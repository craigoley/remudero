# settings/macros.yaml — THE OPERATOR'S MACRO TABLE (W1-T2763).
#
# THE DEFECT THIS CLOSES. The operator types standing shorthand into sessions — `tddr`, `grfp` —
# and the model EXPANDS IT BY GUESSING. A guess is right until it is not, and nothing records
# which expansion a session used. The token saving is nil: a rare four-letter token splits into
# two or three sub-tokens against about five for the phrase. What the operator is actually after
# is a LONG expansion behind a SHORT name, and that is a substitution, not a guess.
#
# WHY A TABLE AND A GENERATOR RATHER THAN HAND-WRITTEN SKILLS. A macro's expansion is a standing
# instruction and will be edited; two hand-kept copies drift. `docs/cli-reference.md` is generated
# from `COMMANDS` and byte-compared by `cli-reference:check`; this is the same shape, and it lets a
# macro NAME the CLAUDE.md headlines its expansion invokes so a renamed rule fails the check rather
# than silently orphaning the macro.
#
# EDIT THIS FILE, NEVER `.claude/skills/*/SKILL.md`. Those are generated. Run
# `npm run macro-skills` after any change here; `npm run macro-skills:check` (driven by
# test/operator-macros-are-generated.test.ts, so it runs inside `npm test` and therefore inside
# CI's required `ci` job) byte-compares them and names the macro that drifted.
#
# WHAT THIS IS NOT. Dispatched workers never load these: `spawnWorker` passes `settingSources: []`,
# and a worker-facing procedure is the skill-workshop lane's job, mined from evidence rather than
# typed by the operator. And the console's reply route stays "A REPLY IS AN INPUT, NEVER A COMMAND"
# (`buildEscalationReplyRoute`, W1-T2496) — a macro typed into a reply is text the Architect reads,
# never a verb the daemon runs.
#
# FIELDS
#   name       the invocation — `/name` in a session. Must not collide with an `rmd` verb.
#   summary    the skill's `description` line: what it does, in one sentence.
#   expansion  the body, verbatim. This is the substitution the operator wanted.
#   headlines  CLAUDE.md `##` headlines the expansion invokes. Each MUST exist or the generator
#              refuses, quoting the missing one — so a renamed rule is a red check, not a silent
#              orphan.
#   args       true appends `$ARGUMENTS`, which Claude Code inserts as literal text.
macros:
  - name: tddr
    summary: "Think deeply and do research before answering — investigate the codebase and the evidence rather than reasoning from memory."
    expansion: |
      Think deeply and do the research before you answer. Do not reason from memory about this
      repository — read the code, run the query, and quote what it actually said.

      Ground every claim in something you ran:

      - Prefer the repo's own instruments over a hand-rolled re-derivation. If a function already
        answers the question, call it rather than reimplementing its rule.
      - A zero is not a measurement until a positive control proves the query could see its
        corpus. Run the control in the same corpus, with the same tool and the same flags.
      - When a result surprises you, re-run it somewhere else before believing it. An
        environmental defect reproduces exactly, so two readings taken the same way are one
        measurement performed twice.
      - Name the query, never only its answer. A count that is not reproducible is a claim about
        the past.

      Say plainly what you measured, what you could not measure, and which parts of the answer
      rest on inference rather than evidence.
    headlines:
      - "Investigation discipline"
      - "Ledger and evidence discipline"
    args: true
  - name: grfp
    summary: "Give recommendations and follow-up prompts — end with a ranked recommendation and the prompts that would carry it forward."
    expansion: |
      Finish with recommendations and follow-up prompts.

      Recommendations: rank them, most valuable first. For each, say what it costs, what it buys,
      and what would have to be true for it to be wrong. Give a recommendation rather than an
      exhaustive survey of options — if you are weighing a choice, pick one and say why.

      Follow-up prompts: write them as prompts I can paste back verbatim to start the next piece
      of work. Each should stand on its own, naming the file, the task id or the query it starts
      from, so it does not depend on this conversation's context surviving.

      Separate what you would do next from what you need me to decide. Anything blocked on my
      ruling goes in its own short list, with the options and your recommendation.
    headlines:
      - "Plan and task hygiene"
    args: true

  # ── EXTERNAL SCAN 2026-09-23: popular community skills, rewritten for this repo ─────────────────
  #
  # The four rows below take IDEAS from two MIT-licensed community collections — Matt Pocock's
  # `mattpocock/skills` (grilling, diagnosing-bugs, handoff, wait-what) and Jesse Vincent's
  # `obra/superpowers` (systematic-debugging, verification-before-completion). No text is copied:
  # every expansion is written here, against this repo's own doctrine, so no third-party notice is
  # owed and Apache-2.0 stays the only licence in the tree. Named anyway, so a reader can compare.
  #
  # WHY ROWS AND NOT AN INSTALLED PLUGIN. A plugin or a `skills.sh` install is a SUBSCRIPTION: its
  # author can change the instructions an operator session runs, on their schedule, with no review
  # here. That is a supply-chain path into the interactive lane that `hooks/deny-floor.sh` exists to
  # bound. A row is reviewed in a PR, is byte-checked by `macro-skills:check`, and changes only when
  # this repo changes it. The full taken / refused / already-held list is MASTER-PLAN §4F.
  - name: grill
    summary: "Interview me about a plan until every decision is settled — rounds of numbered questions, each with your recommended answer, and no action until I confirm."
    expansion: |
      Interview me about the plan, design or decision below until we share one understanding of
      it. Do not start the work. The interview is the work.

      Treat the plan as a tree of decisions. Some decisions depend on others. The FRONTIER is
      every decision whose prerequisites are already settled. Ask in rounds:

      - Each round asks the whole frontier at once. Number the questions (Q1, Q2 …).
      - Give each question a short title, the choices you see, YOUR RECOMMENDED ANSWER, and the
        one piece of evidence that would change your recommendation.
      - Never put a question in this round if its answer depends on another question in this
        round. It belongs in a later round.
      - After I answer, re-compute the frontier and ask the next round.

      Facts are yours to find; decisions are mine to make. Never ask me a question the repository,
      the plan, the ledger or `gh` can answer. Look it up — use a sub-agent for anything slow —
      and report it as OBSERVED with `file:line` or the command you ran. Keep asking the rest of
      the frontier while a lookup runs. If a lookup cannot be done, say so and mark the fact
      INFERRED; never present a guess as a finding.

      Challenge me. If an answer conflicts with CLAUDE.md, DECISIONS.md, a filed task or the code,
      quote the conflict and ask which one wins. When I rule on something, the ruling stands for
      the rest of the interview; raise it again only with new evidence, once.

      Stop when the frontier is empty: every branch visited, nothing silently assumed. Then give
      one summary with three parts — SETTLED (each decision and my reason), OPEN (anything I
      deferred, with your recommendation), and FACTS (what you looked up, with sources). Take no
      action on the plan until I confirm the summary. If I then ask to file it as plan tasks, pass
      the confirmed summary to `rmd plan --mode=create` as its brief; never hand-write shards.
    headlines:
      - "Investigation discipline"
      - "Plan and task hygiene"
    args: true
  - name: diagnose
    summary: "Debug by evidence — build one command that goes red on the reported symptom before forming any theory, then fix and prove it with that same command."
    expansion: |
      Diagnose the problem below. Your first move is a command that produces evidence, never a
      patch.

      1. BUILD A LOOP FIRST. Find ONE command — a test, a script, a CLI call with a fixture, a
         ledger query — that goes red on the EXACT symptom reported, not on something nearby.
         Run it and show the invocation and its output. Make it fast and deterministic: pin
         time, seed randomness, narrow the scope. For a flaky failure, raise the reproduction
         rate until it is debuggable. Until this command exists, do not read code to build a
         theory. If you cannot build one, stop and say what you tried and what you need from me.
      2. CHECK WHAT CHANGED. "It worked yesterday" outweighs any theory. Read `git log` for the
         area and the dates first. Check that the upstream inputs are what you assume before you
         touch the logic that consumes them. For a pipeline, count items at every step before
         changing any filter.
      3. MINIMISE. Cut inputs, config and steps one at a time, re-running the loop after each
         cut, until only the parts that make it fail remain.
      4. HYPOTHESISE, RANKED. List the candidate causes. For each, name the one observation that
         would falsify it, and check that observation before you believe it.
      5. FIX THE NAMED CAUSE, then re-run the SAME loop and show it green. Prove the fix is
         load-bearing: undo it, show red, restore it, show green.

      If two patches have not moved the symptom, stop. No third patch and no wider change — get
      more data or return to the last known good state.

      Report what you OBSERVED (with the command) separately from what you INFERRED. Redact every
      secret from any output you show.
    headlines:
      - "Investigation discipline"
      - "Coverage traps"
    args: true
  # Idea from Matt Pocock's `improve-codebase-architecture` and `codebase-design`
  # (mattpocock/skills, MIT); text written here (MASTER-PLAN §4F).
  - name: architecture-scan
    summary: "Find where the code is hardest to change, rank the candidates for making a module deeper, and hand the one I pick to /grill — no code changes."
    expansion: |
      Scan the codebase for places where a module is shallow: its interface is nearly as complex
      as what it hides, one concept is spread over many small files, or a seam leaks. Do not
      change any code.

      1. SEED FROM EVIDENCE, NOT A HUNCH. Start where the code keeps changing (`git log` churn
         over the last few hundred commits) and where this repo's own signals point: the output
         of `npm run jscpd`, `npm run depcruise` and `npm run source-size-signal`. If I name an
         area, start there instead.
      2. READ THE DECISIONS FIRST. Read DECISIONS.md and docs/adr/ for the area. Do not propose
         what a recorded decision already rejected unless the friction is real enough to reopen
         it — then say so and name the decision.
      3. TEST EACH CANDIDATE. Would deleting the module concentrate the complexity, or only move
         it? Keep the candidates where it would concentrate.
      4. REPORT, ranked, in the terminal or as docs/research/<slug>.md: for each candidate, the
         files, the friction (OBSERVED with evidence, or INFERRED), the proposed deeper module,
         how tests would get simpler, and a strength of Strong, Worth exploring or Speculative.
      5. Ask which one to explore. Then run /grill on it; a confirmed design goes to
         `rmd plan --mode=create` as its brief, never straight into code.
    headlines:
      - "Investigation discipline"
    args: true
  - name: handoff
    summary: "Write a handoff so a fresh session can continue this work — state with evidence, the pending ledger, and the next prompt, paste-ready."
    expansion: |
      Write a handoff so a new session, which sees nothing of this conversation, can continue
      the work. Save it in this session's scratchpad or the OS temp directory — never inside the
      repository — and tell me the path.

      Include, in this order:

      1. GOAL — what the work is for, in two sentences.
      2. STATE AT HEAD — for each branch and PR touched: its name, head SHA, CI state and
         mergeability, each marked OBSERVED (with when and how) or NOT OBSERVED. A PR title, a
         plan status or a ledger line is a record of intent, not state.
      3. DECISIONS — each ruling made in this session, with its reason. These are settled; the
         next session must not re-open them without new evidence.
      4. PENDING — every open item as a ledger: what it is, what blocks it, and who must act.
         Name any task id minted without a reservation as a FLOOR, not a claim.
      5. TRAPS — what was tried and failed, and why, so it is not tried again.
      6. NEXT PROMPT — the first prompt for the new session, complete and paste-ready. Its header
         names the repo, the account, the branch cut from latest `main`, and the mode: RECON or
         IMPLEMENT.

      Point to what already exists — PRs, commits, plan shards, files — by id AND title; do not
      restate it. Redact every secret, token and personal detail.
    headlines:
      - "Ledger and evidence discipline"
      - "Plan and task hygiene"
    args: true
  - name: wait-what
    summary: "Your last message did not land — re-explain it in plain language, with context, and say what you need from me."
    expansion: |
      Your last message did not land. Re-explain it, using plain language (ISO 24495-1):

      - Start with one or two sentences of context: what we are doing and where we are.
      - Then the point, in short sentences. Use common words. Define any term I may not share.
      - Name every task, PR or file by its title or purpose as well as its id — a bare id is
        not an explanation.
      - End with what you need from me, if anything, as one clear question.

      Do not add new material. Say the same thing more clearly, or say plainly that you were
      wrong and what is actually true.
    args: true
  # Idea from Matt Pocock's `retro` (mattpocock/skills, MIT); text written here. Named
  # `session-retro` because `rmd retro` is a verb that syncs the plan from the ledger — a
  # different job. MASTER-PLAN §4F wrongly listed this one as already held.
  - name: session-retro
    summary: "Review a finished session and propose fixes to the agent's environment — each one a check that refuses the mistake, not another rule to remember."
    expansion: |
      Run a retrospective on the session below (this one, if none is named). Improve the
      environment the next agent works in, not the code it wrote. Read the primary record —
      the transcript, the commands and their output, the PRs and CI runs — not your memory of it.

      Find each point of friction: time lost finding a file or a fact, a mistake a check could
      have caught, a gate that refused for a reason nobody could act on, a rule that existed but
      was not followed, a tool call that was expensive for what it returned, a fact the agent
      could not reach.

      For each one, propose the smallest fix, in this order of preference:
      1. GATE — a CI step, a census test or a lint that refuses the mistake by name. A rule
         stated only in prose can be broken silently, so prefer a refusal whenever the mistake
         is mechanical.
      2. DOCTRINE — a CLAUDE.md headline and body, only for a judgement call no check can make.
      3. LEARNING — a `learnings/*.yaml` entry scoped to the files where the fact applies.
      Check first whether a check or rule already exists but did not fire; if so, that is the
      finding, not a new one.

      Report the findings most severe first. For each: what happened, with the evidence marked
      OBSERVED (command, file:line, PR or run) or INFERRED; the class (GATE, DOCTRINE or
      LEARNING); the proposed fix; and the one observation that would show the fix is wrong.

      Propose only. Do not edit CLAUDE.md, doctrine, learnings or the plan. If I ask to file the
      fixes, pass the confirmed list to `rmd plan --mode=create` as its brief.
    headlines:
      - "Investigation discipline"
      - "Plan and task hygiene"
    args: true
