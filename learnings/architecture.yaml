  fact: >-
    `src/run-task.ts` has ZERO headroom on the bare-catch ratchet — 64 of 64, so
    the next bare erasing `catch {}` reddens
    `test/catch-erasure-ratchet.test.ts`. Rethrow, record, carry the distinction
    in the return shape, or state the reason inside the braces. Never raise the
