- id: trace-the-runtime-value-not-the-declarative-source
  subsystem: investigation
  lifecycle: active
  files: [ .remudero/mounts.yaml ]
  fact: >-
    Before editing the config file you were TOLD to change, trace from source
    where the runtime value is actually read. The named declarative source may
    be inert while a code-level default governs live behavior: the
    `.remudero/mounts.yaml` `architect:` row looked authoritative, but spawns
    resolved from `architectModel(config)`'s `?? "opus"` default, so a row-only
    edit would have shipped green and changed nothing observable (required
    wiring `architectModel(config, mounts)`). MIRROR — before filing a NEW
    signal, `git grep` the producer's own type for consumers: the fact is
    usually ALREADY COMPUTED AND DISCARDED. Measured: `parseGhRateLimitHeaders`
    reads `X-Ratelimit-Reset` and `X-Ratelimit-Resource`, consumers `worker.ts`
    plus one test; the plan-state scanner destructures only `ids` off a result
    carrying `examinedLines` and `proposalOnlyLines`; `disarmAutoMerge`'s
    `DisarmOutcome` is dropped at two of three call sites. Carrying a value that
    already exists is the cheapest fix class here; measuring a new one is not.
