- id: check-absence-is-not-a-passed-check
  subsystem: investigation
  lifecycle: active
  files: [ src/lib/sweep.ts ]
  fact: >-
    A check that is ABSENT is not a check that passed — a rollup shows neither.
    Asking whether a red was base-caused or in-diff, a sweep read `success` for
    a required check on three sibling PRs and concluded the fault was in the
    diff. Those heads predated the check's introduction, so it had never run on
    them: absence, not agreement. `baseCausedCheckName` (`src/lib/sweep.ts`)
    needs the check failing on EVERY open PR, so one older head silently refutes
    a real base outage. Restrict the comparison to heads built after the check
    first appeared.
  src: '2026-08-16, #1919; migrated from CLAUDE.md''s Investigation-discipline
    section, W1-T2507'
  cited: "2026-08-31"
