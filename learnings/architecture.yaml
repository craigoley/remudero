- id: verify-pr-body-against-diff-not-memory
  subsystem: review
  lifecycle: active
  files: [ src/lib/review.ts ]
  fact: >-
    Verify every PR-body claim about your own diff against `git diff --numstat`,
    and re-verify after each follow-up commit: `bodyContradictsDiff`
    (`src/lib/review.ts`) opens the diff and fails the PR. Never assert scope
    membership from memory — run the predicate:
    `isInPlanScope("docs/ORIENTATION.md")` returns TRUE (run, not read), and any
    claim about it goes stale the moment `plan-architect.ts` moves. The detector
    also has a SHORTHAND arm: scope-shorthand phrases (the plan-only/data-only
    family) fire when ANCHORED — as a label with a colon, a copular claim ("this
    PR is ...-only"), or attributive before a changeset noun — while bare
    mentions, quoted regions and file paths stay silent
    (`shorthandIsAboutChangeset`). If the diff carries any file outside the
    claimed scope, the anchored phrase fails the PR — so do not write the
    shorthand in a body unless the predicate agrees.
  src: 'W1-T274, W1-T413, #974, #984, #1685; migrated from CLAUDE.md''s
    Before-you-push section, W1-T2507'
  cited: "2026-08-31"
- id: grep-in-path-lazy-split-hazard
  subsystem: proofs
  lifecycle: active
  files: [ src/lib/task-linter.ts, src/lib/review.ts ]
  fact: >-
    Keep a `unit test:` body under 100 characters with at most one comma and no
    `"; "`; a `grep:` pattern MAY contain `" in "` provided an explicit path
    follows it. `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) fails
    `proof-resolvability` at 2+ commas, or `"; "` plus a comma, or over 100
    chars. `DIALECT_GREP_PATH_RE` (`src/lib/review.ts`) is
    `/^(.*?)\s+in\s+(\S*[./*]\S*)$/i` — lazy, with the path group `\S`-only
    against `$`, so the split always lands before the final token and an
    embedded `" in "` survives intact: `grep: always succeeds in one call in
    src/lib/ledger.ts` reads `verdict: pass`. The real hazard is a STOLEN
    TRAILING TOKEN — a pattern ending in a path-like token with no explicit path
    has that token taken as the path: `grep: the convergence invariant fires in
    ledger.ts` greps `ledger.ts` and reads `verdict: exec_error`. The check is
    `captured path == declared path`. Forward-referencing a PATH is safe (the
    named test may not exist yet); forward-referencing a SYMBOL NAME is a guess.
  src: '#982, #984, #920, #921, #943; corrected 2026-08-28; migrated from
    CLAUDE.md''s Writing-proofs section, W1-T2507'
  cited: "2026-08-31"
- id: plan-only-pr-not-auto-capped
  subsystem: proofs
  lifecycle: active
  files: [ src/lib/review.ts ]
  fact: >-
    A plan-only PR is not automatically capped — prefer certification over the
    W1-T205 carve-out. `planOnly` (`src/lib/review.ts`) exempts a plan-only diff
    from the proof-execution floor; it does not stop real proofs from executing.
    `grep: <pattern> in <path>` proofs with an explicit path do execute and can
    earn a full PASS — #877 posted "PASS — 4 criteria substantiated" on 4/4. A
    path-less `grep:` is refused outright by `parseDialectGrep`.
  src: '#877; migrated from CLAUDE.md''s Writing-proofs section, W1-T2507'
  cited: "2026-08-31"
- id: no-rewriting-proofs-on-verify-human
  subsystem: proofs
  lifecycle: active
  files: [ src/lib/drain.ts ]
  fact: >-
    Do not rewrite proofs on `verify: human` tasks. `isDispatchEligible`
    (`src/lib/drain.ts`) returns false at `t.verify !== "auto"` before the
    linter is consulted, so their dialect debt can never stall the queue.
    Forcing chaos drills, device recordings and live deploys into `unit test:`
    yields proofs that parse, match zero tests, and cap the review — the exact
    theatre the dialect gate exists to stop. Report them as needing a proof kind
    the dialect lacks. And before treating a `verify: human` shard's questions
    as live, check whether a `verify: auto` sibling already merged their
    substance — measured twice in two days, the queue held open operator
    questions whose answers had shipped under a different id. The check: grep
    the shard's load-bearing symbols across merged trailers/subjects before
    escalating its questions.
  src: '#984; siblings 2026-08-13/14; migrated from CLAUDE.md''s Writing-proofs
    section, W1-T2507'
  cited: "2026-08-31"
