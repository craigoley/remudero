- id: serve-client-js-template-literal-backtick-trap
  subsystem: codebase
  lifecycle: active
  files: [ src/lib/serve.ts ]
  fact: >-
    `src/lib/serve.ts`'s client JS lives inside a backtick template literal —
    never put a backtick inside a client-code comment (e.g. a mention of
    `lastLiveAt`). It terminates the outer template and esbuild fails with
    `Expected ";" but found ...`. Sanity-check by rendering the shell and
    parsing the client script (`new Function(<largest <script> block of
    renderShellHtml()>)`). serve.ts DOM behavior is covered by real
    Playwright/Chromium tests (`test/serve.*.test.ts`) — run them for any client
    change.
  src: '#777; migrated from CLAUDE.md''s Code-traps section, W1-T2507'
