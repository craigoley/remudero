- id: next-task-id-max-across-both-plan-sources
  subsystem: plan
  lifecycle: active
  files: [ plan/tasks.yaml, plan/tasks.d ]
  fact: >-
    Compute a new task id from the max across BOTH `plan/tasks.yaml` AND every
    `plan/tasks.d/*.yaml` shard. "Next number after the last one I saw" collides
    with tasks that landed concurrently or live in a shard you didn't read, and
    `rmd lint-plan` then blocks the push: `grep -rhoE '^\s*- id: W1-T[0-9]+'
    plan/tasks.yaml plan/tasks.d/ | grep -oE 'T[0-9]+'` then max+1. This is
    minting-only — it truncates letter-suffixed ids; duplicate detection
    compares whole ids (`sort | uniq -d` on `- id:` lines).
  src: '#770, #775 renumbered to W1-T257/W1-T261 -- same collision twice; migrated
    from CLAUDE.md''s Plan-and-task-hygiene section, W1-T2507'
  cited: "2026-08-31"
- id: warn-never-reaches-lint-plan-exit-code
  subsystem: plan
  lifecycle: active
  files: [ src/run-task.ts ]
  fact: >-
    A `warn` never reaches `lint-plan`'s exit code. `lintPlanCommand`
    (`src/run-task.ts`) increments `failing` only inside `if (blocking.length)`,
    then returns `failing > 0 ? 1 : 0`; `proof-resolvability` is demoted at
    `preDispatchLint` and stays advisory in CI. And `lint-plan` exiting 2 with
    `cannot resolve --base <ref>` means your base sha is POISONED, not your diff
    — the message is `run-task.ts`'s own, returned as 2 rather than 1. CI passes
    `BASE_SHA: ${{ github.event.pull_request.base.sha }}`, an event-payload
    snapshot, so a re-run replays the same poisoned sha and clears nothing; the
    remedy is merging current main into the branch (same snapshot class
    W1-T351/#1380 fixed for commitlint).
  src: '#984; the base-sha half 2026-08-14; migrated from CLAUDE.md''s
    Plan-and-task-hygiene section, W1-T2507'
  cited: "2026-08-31"
- id: next-task-id-needs-a-fresh-pull
  subsystem: plan
  lifecycle: active
  files: [ src/run-task.ts, src/lib/task-id-reservation.ts, src/lib/auto-triage.ts ]
  fact: >-
    `rmd next-task-id` reads the LOCAL checkout — `git pull` first or it returns
    an id you filed minutes ago. It does account for open PRs once current. No
    lock covers the triage rung, which mints unattended while you type:
    `state/triage.lock` is triage-against-triage only and
    `state/task-id-reservations` is LOCAL, so neither sees another host's
    unpushed filing. Twice a double-mint made `loadPlan` refuse `origin/main`,
    taking every plan-reading verb with it — W1-T488 (#1816/#1817) and
    W1-T533+W1-T534, repaired by renumbering the loser (#1964). Sweep
    `refs/rmd-id/*` alongside shards and open PRs — only that sees a
    reserved-but-unfiled id — then re-sweep on a fresh fetch immediately before
    pushing.
  src: '#1388: returned W1-T379 right after #1388 filed it, true max 380; migrated
    from CLAUDE.md''s Plan-and-task-hygiene section, W1-T2507'
  cited: "2026-08-31"
- id: hand-mint-uses-the-plain-refspec
  subsystem: plan
  lifecycle: active
  files: [ src/lib/task-id-reservation.ts ]
  fact: >-
    Hand-mint with the PLAIN refspec — `git push origin
    <orphan-sha>:refs/rmd-id/<id>` — never `+` and never `--force-with-lease`:
    `+` silently defeats the lease, so a push that looks gated has no gate at
    all. The CAS is a property of the payload, not the namespace: an orphan
    `commit-tree` over the empty tree with no `-p` gives every writer a unique
    sha, so a second push is structurally a non-fast-forward — the form
    `gitRemoteRefReserver.attempt` (`src/lib/task-id-reservation.ts`) already
    uses. `reserveTaskIdRemote` has ONE call site, the triage mint, so a
    hand-filed shard bypasses it entirely. MEASURED on the real remote: plain
    onto an absent ref succeeds; plain onto an existing ref holding an unrelated
    orphan is rejected (non-fast-forward); `+` forces the update; a deliberately
    wrong `--force-with-lease` combined with `+` still forces it, the lease
    ignored outright; that same lease without `+` is rejected (stale info). Read
    the exit code into a variable — non-zero means the id is TAKEN; renumber,
    never re-push.
  src: 'W1-T509; migrated from CLAUDE.md''s Plan-and-task-hygiene section, W1-T2507'
  cited: "2026-08-31"
- id: rule19-span-and-never-file-empty-files-list
  subsystem: plan
  lifecycle: active
  files: [ src/lib/dispatch-overlap.ts ]
  fact: >-
    A shard whose `files:` spans two concerns fails Rule 19 sizing at
    `risk:medium` — set `risk:high` up front and record in the note that the
    band is Rule 19's SPAN, not blast radius; decomposing a predicate from its
    own falsifier is not a real decomposition. And never file an empty `files:`
    list: `overlappingPaths` (`src/lib/dispatch-overlap.ts`) fail-closes — one
    empty side returns the OTHER side's entire list — so an undeclared task
    overlaps every candidate, and placed first it serializes the whole dispatch
    pool behind it (measured: one empty-`files:` task at the queue head held
    admissions to 1 lane where 11 disjoint tasks waited).
  src: '#1400, #1401, #1779; W1-T476 files the ordering fix; migrated from
    CLAUDE.md''s Plan-and-task-hygiene section, W1-T2507'
  cited: "2026-08-31"
- id: remudero-review-is-a-commit-status
  subsystem: ci
  lifecycle: active
  files: [ src/lib/review.ts, src/lib/open-prs-rest.ts ]
  fact: >-
    `remudero-review` is a COMMIT STATUS, not a check-run — `/check-runs` is
    structurally blind to it. `postReviewStatus` (`src/lib/review.ts`) POSTs
    `repos/.../statuses/{sha}` with context `REVIEW_CONTEXT`; `rollupFromRest`
    (`src/lib/open-prs-rest.ts`) says so explicitly: reading only `/check-runs`
    would drop `remudero-review` entirely and make every reviewed PR look
    unreviewed. The endpoints that DO see it: GraphQL's `statusCheckRollup` (a
    union of CheckRun AND StatusContext nodes) and the combined-status endpoint
    `repos/.../commits/{sha}/status` — use one of those, never `/check-runs`
    alone, when asking "is this PR reviewed".
  src: 'measured twice, 2026-08-13/14; migrated from CLAUDE.md''s CI-and-merging
    section, W1-T2507'
  cited: "2026-08-31"
- id: ledger-step-name-is-a-claim-not-evidence
  subsystem: ledger
  lifecycle: active
  files: [ plan/policy.yaml, src/lib/auto-triage.ts, src/run-task.ts ]
  fact: >-
    Treat a step NAME as a claim, not evidence — check what the function that
    wrote it can actually return. `armAutoMerge` returns one of seven outcomes
    and never throws; five arm nothing, yet five Architect lanes logged
    `automerge.armed` unconditionally. Measured over the unioned ledger: 176
    rows; 135 blind, 17 provably false, 119 undecidable (overlapping categories)
    — the blind rows recorded no `head_sha`, so they can never be adjudicated.
    And the lanes are not equally gated, the obvious reading is backwards: `grep
    -n 'return attemptArm' src/run-task.ts` prints them side by side.
    `triageCommand` arms only after `waitForCiGreen` returns green, and
    `armAutoMerge` then reads `priorReviewVerdictFromLedger` and gates on
    `decideArmFromLedgerVerdict` — TWO gates; it never branches on
    `reviewCommand`'s exit code. `armAutoMergeAtOpen` is `return
    attemptArm(prUrl, deps);` — no verdict gate and no ci gate — and the
    implement lane calls it at PR-open, before any review. So implementation
    PRs, which change source, self-merge earlier and with fewer checks than
    triage PRs, which only add plan text (operator ruling on W1-T489:
    documented, not changed). The unattended rate is real now that W1-T469 fires
    the rung on `partition.serialized.length > 0` rather than idleness, bounded
    by `autoTriage.maxPerDay`/`minIntervalMinutes` (`plan/policy.yaml`). Cost
    per run is a QUERY, not a number to carry — re-derive it over the ledger
    union rather than quoting `src/lib/auto-triage.ts`'s figure.
  src: '#981; the lane-asymmetry half W1-T489, 2026-08-14; migrated from
    CLAUDE.md''s Ledger-and-evidence-discipline section, W1-T2507'
  cited: "2026-08-31"
- id: state-is-scratch-land-findings-in-a-tracked-artifact
  subsystem: ledger
  lifecycle: active
  files: [ plan/feedback, src/lib/feedback-landing.ts ]
  fact: >-
    A report written to `state/` is SCRATCH, not a record — land the finding in
    a TRACKED artifact in the same session, and never let a tracked artifact
    rest its evidence on a `state/` path. `.gitignore`'s `state/` entry is
    correct and load-bearing (the daemon writes runtime exhaust into its own
    tree every run; un-ignored it reads as dirt in `git status --porcelain`,
    which crash-looped the daemon on restart), and that directory also holds
    `state/service-tokens.json` — so this is a PLACEMENT defect, not a gitignore
    one; do not propose un-ignoring it. On the mini a report there is merely
    local; in a cloud container it is destruction, because nothing syncs it and
    the container is reclaimed. MEASURED: 29 distinct `state/*.md` paths cited
    across 43 tracked files, and all 29 absent from a fresh checkout — every one
    is a pointer no worker can follow; a session re-derived a whole finding from
    scratch after `state/recon-retro-test-github-calls.md` turned out not to
    exist. The durable homes: the PR body, the shard's own `rationale`/`note`,
    and `plan/feedback/` — tracked AND landed by `landFeedback`
    (`src/lib/feedback-landing.ts`), which rebuilds from origin/main and pushes,
    so it survives the container by construction. Nothing in this repo tells a
    session where to write a report; the convention lives only in the operator's
    briefs, which is why the rule lives here.
  src: 'established 2026-08-11; migrated from CLAUDE.md''s
    Ledger-and-evidence-discipline section, W1-T2507'
