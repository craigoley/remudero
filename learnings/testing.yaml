- id: lazy-config-in-ci
  subsystem: config
  lifecycle: active
  files: [src/lib/config.ts, src/lib/containment.ts]
  fact: >-
    A lib function that EAGERLY calls loadConfig() (which shells `which claude`) FAILS IN CI where the
    binary is absent — resolve config LAZILY so injected-executor tests never touch it.
  src: PR#18
  cited: "2026-07-14"

# ── Most task-quality failures are catchable DETERMINISTICALLY — no LLM. Cheap checks first. (§5C) ──
- id: task-linting-is-mostly-deterministic
  subsystem: architecture
  lifecycle: active
  files: [src/lib/task-linter.ts]
  fact: >-
    Most task-quality failures are catchable DETERMINISTICALLY with no LLM: criteria COUNT (sizing, Rule
    19), subsystem COUNT, forbidden live-context VERBS (headless-fitness lexicon, Rule 18 — overnight/
    launchctl/killed/"operator confirms"/...), and PROOF-SHAPE (observable proof, not a vibe). Reserve the
    Architect LLM review for genuine ambiguity ("is this really one concern?", "is a criterion secretly a
    task-inside-a-task?"). Cheap deterministic checks first; the LLM layer is advisory and does not block.
  src: W1-T12, this session
  cited: "2026-07-15"

# ── A "live proof" runs the tree's CURRENT checkout, not the branch you meant. (W1-T445) ──
- id: live-proof-runs-the-checked-out-code
  subsystem: testing
  lifecycle: active
  files: [bin/rmd, src/lib/self-sync.ts]
  fact: >-
    A live proof that shells `./bin/rmd` proves whatever source the WORKING TREE holds right then —
    bin/rmd execs `$DIR/src/run-task.ts` relative to ITSELF, so checking out another commit to build
    the fixture silently runs THAT commit's code (measured: a fix "disproved" by a fixture cut at
    origin/main~1). And a fix whose trigger needs the tree BEHIND origin/main with no local commits
    cannot be proven live at all before merge — a branch carrying it is by definition ahead. Prove it
    with a real-repo unit test; a live run can only REPRODUCE the defect already on main.
  src: W1-T445, PR#1662
  cited: "2026-08-12"
  # Pinned to bin/rmd still resolving its entrypoint relative to the script — if that ever becomes
  # an absolute install path, the swap-on-checkout hazard disappears and this entry must quarantine
  # rather than keep being injected.
  assertion: 'grep -q "DIR/src/run-task.ts" bin/rmd'

# ── Measurement traps observed 2026-08-23 (re-derived at 682c5d5a) ──
- id: scan-both-quote-styles
  subsystem: evidence
  lifecycle: active
  files: [scripts, src/lib/task-linter.ts]
  fact: >-
    Quote style silently splits a population. Across scripts/, `=== "number"` appears in three files
    and `=== 'number'` in two — a scan keyed on one form reported the other half as already repaired.
    Match both forms, or normalise before counting; never infer a population's size from one quoting
    convention, and state which form the count was taken over.
  assertion: 'test $(grep -l "number" scripts/coverage-ratchet.mjs scripts/learnings-budget-ratchet.mjs | wc -l) -eq 2'
  src: re-derived at 682c5d5a — 3 double-quoted, 2 single-quoted, 5 total
  cited: "2026-08-23"
- id: grep-anchor-must-fit-one-line
  subsystem: evidence
  lifecycle: active
  files: [plan/tasks.d, plan/tasks.yaml, learnings, src/lib/review.ts]
  fact: >-
    A fixed-string anchor that spans a YAML line break matches NOTHING — four instances in one day,
    each a confident 0 for text visibly present in the file, because grep is line-oriented and folded
    scalars wrap. Reflow the source so the phrase sits on one line, or re-anchor on a span that
    already does. Never shorten the anchor to fit: that weakens exactly what it was pinning.
  assertion: 'grep -q "execWhitelistedProof" src/lib/review.ts'
  src: operator-report 2026-08-23; two instances hit first-hand while filing W1-T1282
  cited: "2026-08-23"
- id: control-proves-reach-not-window
  subsystem: evidence
  lifecycle: active
  files: [src/lib/ledger-grep.ts, scripts, test]
  fact: >-
    A positive control proves the query can SEE its corpus; it does NOT prove the corpus COVERS the
    window asked about. Measured: resolveLedgerUnion returned archiveCount 0 / ok false against a
    state dir whose live ledger read fine — the reader worked and the corpus was simply the wrong one.
    Qualify a control for the WINDOW — date range, surface, tree — as well as for readability.
  assertion: 'grep -q "archiveCount" src/lib/ledger-grep.ts'
  src: measured 2026-08-23 — 126-line live ledger, one distinct step, zero archives
  cited: "2026-08-23"
- id: position-and-side-table-anchors-decay-silently
  subsystem: evidence
  lifecycle: active
  files: [hooks, scripts, test, src/lib/review.ts]
  fact: >-
    An assertion anchored to POSITION, or validated against a HAND-MAINTAINED SIDE TABLE, decays
    silently under a legitimate edit that had no way to know. Anchor on CONTENT, or derive the
    table from OBSERVATION. Measured: hooks/mkdtemp-allowlist.txt keyed 998 exemptions on
    <file>:<line>, so one unrelated line insertion turned a months-old exemption into a false
    refusal on a PR that never touched temp directories; re-keying on <file>:<prefix> collapsed
    them to 909 entries that do not move. Five more in one session — a shard files: list
    invalidated by the size ratchet's own prescribed remedy; a wiring guard slicing start+4000
    chars; HOST_CAUSED_SUITE_REDS hand-maintained beside HOST_PARITY_BASELINE, which derives the
    same facts from a run; a re-anchor that landed 18 chars early; and a generator test hardcoding
    the smallest shard's NAME in a file asking for the real smallest, not a stand-in. Migrate such
    a table by RE-OBSERVING (scan with the table empty, take the tool's own output), never by
    resolving the stale keys — resolving reads the wrong row for exactly the entries that already
    drifted, then makes that wrong value permanent under the new key.
  assertion: 'grep -q "allowlistKey" scripts/mkdtemp-callsite-check.mjs'
  src: W1-T2786 — measured 2026-09-03, 998 line-keyed entries re-keyed to 909 prefix-keyed
  cited: "2026-09-03"
