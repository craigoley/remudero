# learnings/ci.yaml — CI-subsystem shard of the learnings corpus (W1-T33).
#
# One of five subsystem shards (learnings/{platform,architecture,ci,testing,failures}.yaml) — see
# learnings/platform.yaml's header for the full split/index/lifecycle explanation. Regenerate the
# index with `npm run learnings-index` after editing any shard.
#
# CI = facts about GitHub Actions / required checks / the merge gate.
#
# Schema per entry: see learnings/platform.yaml's header (identical schema across every shard).

- id: required-check-poster
  subsystem: ci
  # knowledge gardener: retire required-check-poster
  lifecycle: superseded
  files: [src/lib/review.ts, src/lib/status.ts, ".github/**"]
  fact: >-
    A required check must be posted by the ORCHESTRATOR unconditionally, not solely by a worker: a
    crashed worker leaves it ABSENT, and an absent required check blocks the merge forever (fail-stuck).
  src: PR#13
  cited: "2026-07-14"

- id: skipped-check-deadlock
  subsystem: ci
  lifecycle: active
  files: [".github/**"]
  fact: >-
    A conditionally-skipped required check DEADLOCKS merge forever (reads as expected-pending, never
    green) — gate on ONE always-runs aggregator job that needs: every sub-job, and require only that.
  src: operator-fleet
  cited: "2026-07-14"

- id: security-merge-policy-refusal-evidence-lane
  subsystem: ci
  lifecycle: active
  files: [".github/workflows/security-merge-policy.yml", src/lib/code-scanning-merge-adapter.mjs]
  fact: >-
    When security-merge-policy refuses a pull request, inspect that PR's policy status reason and
    the evidence it names before repairing. Keep each PR's disposition separate: a refusal count
    does not establish one shared cause, and this gate distinguishes unsafe findings, incomplete
    analysis, unsupported evidence, and target or head identity failures. Route the verified failure
    and its narrow repair to the lane that owns the named evidence, then recheck the policy status;
    do not suppress UNKNOWN or treat a repaired cohort as proof of enforcement.
  evidence: >-
    The window recorded as ci-learning:11660:security-merge-policy names PRs #11660, #11761,
    #11801, #11859, and #11861 as refused and repaired, but the available cohort record does not
    establish each PR's refusal reason or one shared mechanism. The policy adapter publishes
    reason-coded decisions, including unsafe findings, incomplete analysis, unsupported evidence,
    and noncanonical targets. Workers in the security-policy repair lane should use each PR's
    decision evidence to select its owner and preserve unknown evidence until resolved.
  src: "ci-learning:11660:security-merge-policy"
  cited: "2026-10-19"

# ── Measurement traps observed 2026-08-23 (re-derived at 682c5d5a) ──
- id: rollup-dedupe-by-latest-attempt
  subsystem: sweep
  # knowledge gardener: retire rollup-dedupe-by-latest-attempt
  lifecycle: superseded
  files: [src/lib/sweep.ts, src/lib/open-prs-rest.ts]
  fact: >-
    A check-runs listing with ?filter=all returns SUPERSEDED attempts forever, so a check that was
    re-run and went green still shows its old failure and a triage pass reports a false red. Dedupe by
    the latest startedAt per check name before judging — the repo's own dedupeRollupByLatestAttempt
    (sweep.ts), keyed on name ?? context. ?filter=latest is NOT that fix: it dedupes within ONE run,
    so two attempts on one sha made by different runs both survive it.
  assertion: 'grep -q "dedupeRollupByLatestAttempt" src/lib/sweep.ts'
  src: operator-report 2026-08-23; dedupe rule re-derived at 682c5d5a; filter=latest arm 2026-08-26
  cited: "2026-08-26"
- id: diff-coverage-needs-cis-own-flags
  subsystem: coverage
  lifecycle: active
  files: [.github/workflows/ci.yml, scripts/diff-coverage.mjs]
  fact: >-
    Run locally without --enable-source-maps and --test-coverage-exclude="test/**", and diffed against
    origin/main rather than the PR's own BASE_SHA, diff-coverage gives a TRUE answer to the WRONG
    question — it read OK while CI blocked on a different line pair. Reproduce with ci.yml's exact
    invocation and the PR's base sha, and build the lcov and the diff from the same committed tree.
  assertion: 'grep -q "test-coverage-exclude" .github/workflows/ci.yml && grep -q "enable-source-maps" .github/workflows/ci.yml'
  src: operator-report 2026-08-23; ci.yml flags re-derived at 682c5d5a
  cited: "2026-08-23"
- id: diff-coverage-ok-can-be-vacuous
  subsystem: coverage
  lifecycle: active
  files: [scripts/diff-coverage.mjs, .github/workflows/ci.yml]
  fact: >-
    diff-coverage --lcov /dev/null prints an OK BYTE-IDENTICAL to a real pass, because "every added
    source line lcov instruments is covered" is vacuously true over an empty instrumentation set. An
    OK is only meaningful with a non-zero SF: record for every changed source file; to prove the gate
    is live, flip one added line to DA:<n>,0 and watch it BLOCK naming that line.
  assertion: 'grep -q "every added source line lcov instruments is covered" scripts/diff-coverage.mjs'
  src: measured 2026-08-23 — /dev/null OK, mutated lcov BLOCKED at exit 1
  cited: "2026-08-23"
- id: body-fetch-guards-on-http-not-size
  subsystem: review
  # knowledge gardener: retire body-fetch-guards-on-http-not-size
  lifecycle: superseded
  files: [src/run-task.ts, src/lib/review.ts]
  fact: >-
    A failed body fetch parses as a DEFECT rather than an error: gh exiting 127 left a 0-byte file and
    check-acceptance reported "DEFECTIVE: no Acceptance header" for a body that was fine. Guard the
    fetch on the HTTP status code and a present, non-null .body key before judging the file — a size
    floor cannot tell a short body from an error payload.
  assertion: 'grep -q "no Acceptance header" src/run-task.ts'
  src: measured 2026-08-23 — gh absent in the container, rc=127
  cited: "2026-08-23"
- id: rerun-the-job-not-the-run
  subsystem: ci
  # knowledge gardener: retire rerun-the-job-not-the-run
  lifecycle: superseded
  files: [src/lib/sweep.ts, src/run-task.ts]
  fact: >-
    Two GitHub re-run endpoints, very different cost: jobs/{job_id}/rerun re-runs ONE job, while
    runs/{run_id}/rerun-failed-jobs re-runs the whole run and re-spends every green sibling in it.
    Measured: one lane re-spent 14 green jobs to retry one.
  assertion: 'grep -q "jobs/{job_id}/rerun" src/lib/sweep.ts'
  src: operator-report 2026-08-26; endpoint choice already reasoned in sweep.ts (W1-T1223)
  cited: "2026-08-26"
- id: lease-is-not-a-supersession-guard
  subsystem: ci
  lifecycle: active
  files: [src/lib/git-push.ts]
  fact: >-
    --force-with-lease guards CONCURRENCY, not SUPERSESSION: it only requires the remote to still
    equal the ref you last FETCHED, so fetching the head you are about to overwrite makes the lease
    pass. Assert local != lease base before pushing.
  assertion: 'grep -q -- "--force-with-lease=" src/lib/git-push.ts'
  src: operator-report 2026-08-26; explicit-form precondition documented at git-push.ts gitPushEmptyCommit
  cited: "2026-08-26"
- id: inherited-violation-not-authors
  subsystem: ci
  lifecycle: active
  files: [scripts/lib/inherited-violation.mjs]
  fact: >-
    A ratchet BLOCKED on a file the diff never touched may be inherited from main: PRs each within
    their own ceiling can cross a bucket together. Re-run its measure against the merge base
    (contentAtRef/splitInheritedViolations) and label a violation that reproduces there INHERITED
    rather than blaming the diff.
  evidence: >-
    2026-09-07: source-size-ratchet was BLOCKED on src/run-task.ts on a clean origin/main checkout, so
    every open PR inherited the failure regardless of its own diff; it surfaced on a branch touching
    only src/lib/review.ts. Several PRs each grew that file within their own recorded ceiling, and the
    sum crossed a bucket boundary after they merged; six PRs were red on it at once and nothing said
    why. Folded 2026-10-17: the narrative moved here, the instruction stays in the fact.
  assertion: 'grep -q "splitInheritedViolations" scripts/lib/inherited-violation.mjs'
  src: measured 2026-09-07 — source-size-ratchet BLOCKED on origin/main across six unrelated open PRs
  cited: "2026-09-07"

- id: ci-shard-one-eight-refuses-conflict-markers
  subsystem: ci
  # knowledge gardener: retire ci-shard-one-eight-refuses-conflict-markers
  lifecycle: superseded
  files: ["plan/tasks.d/**", "src/run-task.ts", "hooks/pre-commit", ".github/workflows/ci.yml"]
  fact: >-
    Before committing or pushing a worker repair that resolves a merge conflict, verify the staged
    tree contains no leftover conflict markers. Git can mark a conflicted path resolved when it is
    staged even if marker text remains; a two-parent commit can then reach CI and fail every shard.
    The harness commit and fix push check for markers, and the pre-commit hook checks every committer.
  evidence: >-
    PR #8551's commit 4c047d2bd was a two-parent merge whose src/lib/now-view.ts retained conflict
    markers; esbuild then failed on the marker text. W1-T5227 records the reproduction and repairs
    the harness commit, fix push, and pre-commit paths.
  src: "ci-learning:8551:ci-shard (1/8)"
  cited: "2026-10-08"

- id: unwired-gate-repair-lane
  subsystem: ci
  lifecycle: active
  files: [".github/workflows/unwired-gate.yml", scripts/unwired-gate-check.mjs, src/lib/ci-parity.ts]
  fact: >-
    Before opening a PR that adds or changes a gate-shaped script, npm check script, or its CI
    registration, run `npm run --silent unwired-gate:check` on the proposed tree. The check reads
    parsed workflow steps and package.json script calls; register each gate in an executable
    workflow or package script, and remove stale allowance rows when wiring lands. This is the
    local check for the unwired-gate refusal, not a textual mention or a unit test of the checker.
  evidence: >-
    The unwired-gate gate refused pull requests #10137, #10215, and #10271, and each was repaired.
    `scripts/unwired-gate-check.mjs` reports gate-shaped scripts that no workflow or package script
    invokes, plus stale allowances; `.github/workflows/unwired-gate.yml` runs the checker. The
    individual refusal logs were not available to establish a narrower shared cause.
  src: "ci-learning:10137:unwired-gate"
  cited: "2026-10-09"

- id: ci-shard-seven-eight-refusals-reach-task-authoring-lane
  subsystem: ci
  lifecycle: active
  files: ["plan/tasks.d/**", "plan/feedback/**", "deploy/**"]
