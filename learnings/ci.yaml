    comparing file comment counts with scripts/comment-load-baseline.json and checking added
    blocks; its CLI signal prints the proposed baseline row when a file exceeds its ceiling.
  src: "ci-learning:5505:comment-load-ratchet"
  cited: "2026-09-29"

- id: a-board-wide-plan-red-is-main
  subsystem: ci
  # knowledge gardener: retire a-board-wide-plan-red-is-main
  lifecycle: superseded
  files: ["plan/tasks.d/**", .github/workflows/ci.yml, src/lib/sweep.ts]
  fact: >-
    When lint-plan, claims and every coverage shard go red together on many unrelated PRs, main's
    plan does not load. This happened three times: #8714 on 2026-10-02, #8877 on 2026-10-03, and
    #8922 later that day, each after two machine plan PRs merged duplicate `priority:` keys seconds
    apart. #8936 was a duplicate fix attempt for the #8922 incident, not another occurrence. Check
    main-plan-guard on main and search
    the open PRs for an existing fix first. Once main is green, run `gh api -X PUT
    repos/<o>/<r>/pulls/<n>/update-branch` on each inherited-red PR: a job re-run replays the OLD
    merge ref and stays red.
  assertion: 'test -f test/no-plan-shard-carries-a-duplicate-key.test.ts'
  src: PRs #8714, #8877, #8922 (incidents); #8936 (duplicate fix attempt for #8922)
  cited: "2026-10-03"

- id: hand-review-collides-with-the-daemon
  subsystem: ci
  # retired 2026-10-17 by the session retro: W1-T5540 shipped in #9217, which honours shared pending claims
  lifecycle: superseded
  files: [src/lib/review.ts]
  fact: >-
    The remudero-review pending claim is read from the LOCAL ledger only, so `rmd review` on one
    host cannot see a daemon review already in flight, and vice versa. From 09-26 to 10-03, 102
    reviews reached post time after the PR had merged and were refused; 82 were from the daemon
    review lane (19 run-task, 1 dep-review). In a sample of 12, the PR had merged 12 seconds to 10
    minutes earlier, and 11 merges were by the operator identity, consistent with cross-host
    duplicate work. Until W1-T5540 lands, check the PR's remudero-review status for "review in
    progress (owned by run ...)" before reviewing by hand.
  src: "review.post_refused rows 09-26..10-03 (102 total: 82 daemon, 19 run-task, 1 dep-review); W1-T5540"
  cited: "2026-10-03"

