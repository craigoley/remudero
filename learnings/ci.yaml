- id: proof-discrimination-refusal-repair-lane
  subsystem: ci
  lifecycle: active
  files: ["plan/tasks.d/**", "test/**", src/lib/proof-grammar.ts]
  error_signatures: ["proof-discrimination", executed_stale]
  fact: >-
    When proof-discrimination refuses a PR, inspect its gate output and make each proof fail at the
    merge base while passing on the changed head; a test added by the PR may also be copied into the
    base proof worktree, so prove the changed behavior with a test of the modified surface. For
    dispatcher or task-authoring changes, update the prompt or criteria writer in the lane that
    produced the inert or stale proof, then verify with the gate's base comparison before pushing.
  evidence: >-
    The proof-discrimination gate refused PR #11139 and the recorded repair changed its broad diff,
    which does not establish one shared cause. PR #11201's W1-T8921 record documents two
    executed_stale proofs: the base proof worktree copied the added test, making both proofs pass at
    base; the repair repointed them at changed behavior that differed between head and base.
    Separate main-repair and alert-fix records W1-T8572 and W1-T8625 trace inert prose proofs to
    dispatcher prompts that omitted the required proof dialect. Use the refusal's observed failure
    and repair the proof-producing lane; the PR list alone does not establish that all refusals had
    the same cause.
  src: "ci-learning:11139:proof-discrimination"
  cited: "2026-10-14"

- id: test-slow-shard-single-suite-at-a-time
  subsystem: ci
  lifecycle: active
  files: ["test/**", "scripts/test-tier-manifest.json", ".github/workflows/ci.yml", package.json]
  fact: >-
    When verifying test changes or the slow-tier runner, run one full test suite at a time. Do not
    background or parallelize `node --test` runs; the deny floor refuses concurrent full-suite
    runs. For focused verification, run one test file or use `--test-name-pattern`. The coverage
    preflight runs its shards sequentially; let it finish before starting another full suite.
  evidence: >-
    The test-slow-shard (1/2) gate refused nine pull requests recorded as
    ci-learning:9362:test-slow-shard (1/2) (9362, 9379, 9382, 9386, 9396, 9415, 9520, 9527, 9649),
    and each was repaired. The task's deny-floor constraint identifies overlapping full-suite
    runs as a refusal condition; this entry directs test authors to serialize full runs and use
    single-file or name-pattern runs for focused checks. Individual PR failure logs were not
    available to establish a more specific shared cause.
  src: "ci-learning:9362:test-slow-shard (1/2)"
  cited: "2026-10-08"

- id: analyze-javascript-typescript-gate-pre-push-steps
  subsystem: ci
  lifecycle: active
  files: [".github/workflows/codeql.yml", ".github/workflows/ci-gate.yml", "plan/tasks.d/**", src/run-task.ts, src/lib/policy.ts, src/lib/dep-review.ts, "test/**"]
  fact: >-
    The Analyze (javascript-typescript) gate is the CodeQL job that ci-gate.yml requires. Before the
    first push, run `npm run --silent rule15-precheck` if the diff touches plan/, and run
    `rmd census-membership` for the census suites a src or test change can move, then run the suites
    it names. Do not wait for the hosted gate to find these; it refuses the same way each time.
  evidence: >-
    The Analyze (javascript-typescript) gate refused six pull requests (9362, 9379, 9624, 9703, 9704,
    9712) in one window, and each was repaired after the refusal. The repairs touched plan/tasks.d
    shards and learnings entries. Recon did not read the six failure logs, so the shared cause is not
    verified; this entry names the pre-push steps that cover the surfaces those repairs touched.
  src: "ci-learning:9362:Analyze (javascript-typescript)"
  cited: "2026-10-08"

- id: commitlint-pr-title-lane
  subsystem: ci
  lifecycle: active
  files: ["plan/tasks.d/**", src/lib/plan-pr-emitter.ts, src/run-task.ts, .github/workflows/ci.yml]
  fact: >-
    The commitlint gate checks the LIVE PR TITLE, which becomes the squash-merge subject, not the
    branch's commit history. Before spending another CI cycle, make the title `type(scope): subject`
    with an allowed lower-case type, lower-case subject, no final period, and at most 100 characters;
    a retitle alone re-runs it.
  evidence: >-
    The commitlint job reads `gh pr view --json title` at job time, and `commitlint.config.mjs`
    extends `@commitlint/config-conventional`. CI history includes 42 repaired commitlint refusals
    in the window recorded as ci-learning:7204:commitlint.
  src: "ci-learning:7204:commitlint"
  cited: "2026-09-30"

- id: mutation-ratchet-refusal-repair-lane
  subsystem: ci
  lifecycle: active
  files: [src/lib/classify.ts, "test/**", stryker.conf.json, scripts/mutation-baseline.json, .github/workflows/ci.yml]
  fact: >-
    When a PR diff can move the mutation score for src/lib/classify.ts, the mutation-ratchet job
    runs Stryker against its scoped tests and compares the result with the ratcheted baseline. Run
    that gate on the proposed tree before pushing when changing the target or its tests. If it
    blocks, use the surviving mutant report to add or repair a test that kills the mutant; do not
    raise the baseline to make the refusal disappear. Changes outside the gate's trigger scope do
    not run this mutation sample, so check the changed-file trigger before treating a skipped job
    as evidence that the score passed.
  evidence: >-
    The mutation-ratchet gate refused PRs #10954 and #10988, and both were subsequently repaired.
    The recorded #10954 repair touched src/lib/classify.ts and
    test/the-daemon-reloads-its-plan-off-the-loop.test.ts. Individual refusal logs were
    unavailable, so this entry routes workers to the gate's mutant report and does not assert a
    more specific shared failure cause.
  src: "ci-learning:10954:mutation-ratchet"
  cited: "2026-10-12"

