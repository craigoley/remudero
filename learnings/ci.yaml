- id: analyze-actions-refusal-needs-per-pr-cause
  subsystem: ci
  lifecycle: active
  files: [".github/workflows/codeql.yml", ".github/workflows/**"]
  fact: >-
    When the CodeQL `Analyze (actions)` check refuses a pull request, inspect that pull request's
    failed job step and repair diff before choosing a remedy. A count of refusals and a later repair
    do not establish a shared cause; do not apply a generic pre-push ritual as though it fixes this
    gate. Record the observed failing step and the change that cleared it so the next worker can
    act on the actual failure.
  evidence: >-
    The ci-learning finding lists PRs #10578, #10628, and #10671 (with #10671 duplicated) as
    `Analyze (actions)` refusals followed by repairs. The PR failure logs and repair diffs were not
    available to this run, so a shared cause and an effective gate-specific prevention are NOT
    established. This guidance is limited to the evidence requirement before selecting a remedy.
  src: "ci-learning:10578:Analyze (actions)"
  cited: "2026-10-15"

# ── clock-sweep-report refusal (ci-learning:11896:clock-sweep-report (merge the shards, classify, deliver), PR #11896) ──
- id: clock-sweep-report-refusal-needs-per-pr-cause
  subsystem: ci
  lifecycle: active
  files: [".github/workflows/**", "package.json"]
  fact: >-
    When the clock-sweep-report (merge the shards, classify, deliver) gate refuses a pull request, read
    that pull request's failed job step and its repair diff before choosing a remedy. A refusal that was
    later repaired does not establish a shared cause, and no generic pre-push ritual is known to prevent
    it. Record the observed failing step and the change that cleared it, so the next worker acts on the
    actual failure.
  evidence: >-
    The ci-learning finding for PR #11896 records the gate going red and being repaired by a change that
    touched many .github/workflows files, package.json and src/run-task.ts. The failing step and the
    repair's causal link were NOT read from the CI log in this entry, so the trigger is not verified here.
    The recorded recommended action is unclear, and guidance changes are parked for a person's decision.
  src: "ci-learning:11896:clock-sweep-report (merge the shards, classify, deliver)"
  cited: "2026-10-16"

- id: an-advisory-ignore-needs-the-operator-yes
  subsystem: ci
  lifecycle: active
  files: [osv-scanner.toml, ".github/semgrep/**", ".github/workflows/osv-scanner*.yml", commitlint.config.mjs, .github/workflows/pr-title-lint.yml, src/lib/code-scanning-merge-policy.mjs]
  fact: >-
    Never add a security-advisory ignore, scanner exclusion or gate loosening without the operator's
    explicit yes; a reachability argument is not a waiver. Read ALL comments on another session's PR
    before pushing to it.
  evidence: >-
    #12305 merged a GHSA-84m7-p3x7-pcfv ignore in .github/semgrep/osv-scanner.toml, argued
    unreachable, over the PR owner's comment asking for no security exception; #12342 reverted it.
    #12322 exempted Dependabot titles from commitlint header-max-length; #12343 reverted it on the
    operator's 2026-10-16 ruling of no gate loosening.
  src: "PRs #12305/#12342, #12322/#12343"
  cited: "2026-10-16"

- id: a-lowered-ceiling-is-rederived-on-current-main
  subsystem: ci
  lifecycle: active
  files: ["scripts/*-baseline.json"]
  fact: >-
    Ceiling ratchets judge each PR on its own base: re-derive a LOWERED baseline row against current
    origin/main right before merge, or siblings that add lines red main (until W1-T9962).
  evidence: >-
    2026-10-16: #12428 and #12437 each added a comment line to src/run-task.ts while #12388 lowered
    its comment-load row to 18250 on a base without them. All three were green alone; main read 18253
    over 18250 from its first verdict at 22:11Z until main-repair #12454 recorded 18253.
  src: "PRs #12428, #12388, #12437, #12454; W1-T9962"
  cited: "2026-10-16"
