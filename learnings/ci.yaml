  src: "ci-learning:8684:claims"
  cited: "2026-10-08"

- id: squash-trailer-gate-task-authoring-lane
  subsystem: ci
  # knowledge gardener: retire squash-trailer-gate-task-authoring-lane
  lifecycle: superseded
  files: ["plan/tasks.d/**", src/run-task.ts, .github/workflows/ci.yml]
  fact: >-
    Before opening a plan-only PR, inspect the commits reachable from its head for
    `Remudero-Task:` trailers that credit implementation tasks. The squash-trailer-gate refuses
    when a credited task declares non-plan files, because the PR changes only plan paths. Remove
    that trailer or include the implementation changes before opening the PR; then rerun the gate
    after correcting the branch or PR metadata.
  evidence: >-
    `scripts/acceptance-author-gate.mjs` applies this refusal only when every changed path is
    plan-scoped and the trailer-resolved task declares non-plan files. The gate's diagnostic names
    both remedies. Fourteen repaired pull requests in the window were recorded as
    ci-learning:5433:squash-trailer-gate.
  src: "ci-learning:5433:squash-trailer-gate"
  cited: "2026-10-08"

- id: acceptance-author-gate-task-authoring-lane
  subsystem: ci
  lifecycle: active
  files: ["plan/tasks.d/**", src/run-task.ts, ".github/workflows/ci.yml"]
  fact: >-
    Before opening a PR from the task-authoring lane, ensure its acceptance block has the required
    header and at least one executable proof using a supported dialect (`unit test:` or `grep:`),
    and that each proof matches evidence in the proposed tree. The acceptance-author-gate refuses
    bodies it cannot judge; repair the block and open a new head so CI evaluates the corrected body.
  evidence: >-
    The acceptance-author-gate runs the shared acceptance-author-time predicate on pull request
    bodies. Pull requests #10003 and #10010 were refused by that gate and repaired; their filing
    records identify this task-authoring lane and the acceptance-block gate as the recurring
    refusal surface.
  src: "ci-learning:10003:acceptance-author-gate"
  cited: "2026-10-09"

- id: comment-load-ratchet-lane
  subsystem: ci
  lifecycle: active
  files:
    - ".github/workflows/ci.yml"
    - "docs/comment-standard.md"
    - "scripts/comment-load-baseline.json"
    - "scripts/comment-load-ratchet.mjs"
  fact: >-
    Before changing the comment-load gate, its workflow, baseline, or documented policy, run
    `npm run --silent comment-load-signal`. The gate refuses either per-file comment growth over
    its baseline or a newly added comment block over 25 lines. If the signal prints a baseline JSON
    row, review and record that exact row in `scripts/comment-load-baseline.json`, then rerun the
    signal; otherwise trim the added comments until it reports OK. See `docs/comment-standard.md`
    for the measured paths and comment limits.
  evidence: >-
    The comment-load-ratchet measures the source paths listed in docs/comment-standard.md,
    comparing file comment counts with scripts/comment-load-baseline.json and checking added
    blocks; its CLI signal prints the proposed baseline row when a file exceeds its ceiling.
  src: "ci-learning:5505:comment-load-ratchet"
  cited: "2026-09-29"

- id: a-board-wide-plan-red-is-main
  subsystem: ci
  # knowledge gardener: retire a-board-wide-plan-red-is-main
  lifecycle: superseded
  files: ["plan/tasks.d/**", .github/workflows/ci.yml, src/lib/sweep.ts]
  fact: >-
    When lint-plan, claims and every coverage shard go red together on many unrelated PRs, main's
    plan does not load. This happened three times: #8714 on 2026-10-02, #8877 on 2026-10-03, and
    #8922 later that day, each after two machine plan PRs merged duplicate `priority:` keys seconds
    apart. #8936 was a duplicate fix attempt for the #8922 incident, not another occurrence. Check
    main-plan-guard on main and search
    the open PRs for an existing fix first. Once main is green, run `gh api -X PUT
    repos/<o>/<r>/pulls/<n>/update-branch` on each inherited-red PR: a job re-run replays the OLD
    merge ref and stays red.
  assertion: 'test -f test/no-plan-shard-carries-a-duplicate-key.test.ts'
  src: PRs #8714, #8877, #8922 (incidents); #8936 (duplicate fix attempt for #8922)
  cited: "2026-10-03"

- id: hand-review-collides-with-the-daemon
  subsystem: ci
  lifecycle: active
  files: [src/lib/review.ts]
  fact: >-
    The remudero-review pending claim is read from the LOCAL ledger only, so `rmd review` on one
    host cannot see a daemon review already in flight, and vice versa. From 09-26 to 10-03, 102
    reviews reached post time after the PR had merged and were refused; 82 were from the daemon
    review lane (19 run-task, 1 dep-review). In a sample of 12, the PR had merged 12 seconds to 10
    minutes earlier, and 11 merges were by the operator identity, consistent with cross-host
    duplicate work. Until W1-T5540 lands, check the PR's remudero-review status for "review in
    progress (owned by run ...)" before reviewing by hand.
  src: "review.post_refused rows 09-26..10-03 (102 total: 82 daemon, 19 run-task, 1 dep-review); W1-T5540"
  cited: "2026-10-03"

- id: strikes-exhausted-counts-rows
  subsystem: ci
  # knowledge gardener: retire strikes-exhausted-counts-rows
  lifecycle: superseded
  files: [src/lib/sweep.ts, src/run-task.ts]
  fact: >-
    Historical "fix strikes exhausted (2/2)" rows can overstate real strikes. Before W1-T5542,
    `priorStrikesFor` counted `fix.dispatch` rows and each `runFixRung` pass restarted numbering at
    strike 1, so two refused rounds could exhaust the display without moving the head or reaching a
    verdict. That was all 16 exhaustions from 09-26 to 10-03; #8868 later read 3/2. For historical
    cases, inspect `fix.commit_refused` rows. W1-T5542 has since changed the tally to count round
    outcomes, not refusals.
  src: ledger 09-26..10-03; W1-T5542
  cited: "2026-10-03"

