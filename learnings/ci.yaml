- id: rule-checks-gate-census-and-plan-scope-refusals
  subsystem: ci
  lifecycle: active
  files: [src/run-task.ts, src/lib/policy.ts, src/lib/dep-review.ts, scripts/census-precheck.mjs, scripts/preflight-author.mjs, src/lib/ledger.ts, src/lib/proof-amendment.ts, "plan/tasks.d/**"]
  fact: >-
    When a change touches a listed source or preflight helper, or a plan task shard, run the cheap
    checks before the first push: `rmd census-membership` (it maps changed paths to the census
    suites that walk the whole tree), and `npm run --silent rule15-precheck`
    when the diff touches plan/. A census suite refuses a file that references nothing it touches, so
    `git grep` cannot find it. A plan/ shard added beside an implementation is refused by the
    standing rule 15 gate; lift it into a plan-only PR and drop it from this branch.
  evidence: >-
    The rule-checks gate refused nine pull requests in the window (ci-learning:9276:rule-checks, with
    repairs on #9301, #9337, #9358, #9362, #9369, #9380, #9382, #9388). The repairs touched the
    run-task and census-precheck lane and plan/tasks.d shards, the same paths the census and
    rule-15 checks walk. Recon did not establish each PR's individual gate failure, so this entry
    names the shared surface, not a verified per-PR cause.
  src: "ci-learning:9276:rule-checks"
  cited: "2026-10-08"

- id: light-gates-pre-push-ratchets
  subsystem: ci
  lifecycle: active
  files:
    - "plan/tasks.d/**"
    - "test/**"
    - ".github/workflows/ci.yml"
    - "scripts/comment-load-baseline.json"
    - "scripts/source-size-baseline.json"
    - "scripts/comment-load-ratchet.mjs"
    - "scripts/source-size-ratchet.mjs"
  fact: >-
    Before pushing a change that touches plan shards, tests, or the light-gates job in
    .github/workflows/ci.yml, run `npm run --silent comment-load-signal` and
    `npm run --silent source-size-ratchet`, and record any printed baseline row in the same commit
    until both print OK. If the diff touches plan/, run `npm run --silent rule15-precheck` before the
    push. Run `rmd census-membership` for the suites the diff can move. Do not record a number in
    the negative-reachability, catch-erasure, or source-text-assertion-census ratchets.
  evidence: >-
    The light-gates job (.github/workflows/ci.yml, job name light-gates) refused nine pull requests
    recorded as ci-learning:9301:light-gates (9301, 9358, 9362, 9369, 9379, 9382, 9388, 9396; 9362
    appears twice), and each was repaired after the gate reported. The repaired files included plan
    shards, test files, and the preflight author script. Recon did not establish each PR's specific
    failure reason, so this entry names the pre-push checks rather than a single cause.
  src: "ci-learning:9301:light-gates"
  cited: "2026-10-08"

- id: prompt-surface-gate-learning-path-evidence
  subsystem: ci
  lifecycle: active
  files: ["plan/tasks.d/**"]
  fact: >-
    When a task changes data in a `learnings/*.yaml` shard, the prompt-surface-gate requires a golden
    verdict under `test/fixtures/golden-verdicts/**`; adding or editing test files alone cannot
    satisfy a path surface. Comment-only YAML changes are exempt, but any changed learning entry
    needs the golden fixture in the same diff.
  evidence: >-
    The prompt-surface-gate refused seven pull requests in the window recorded as
    ci-learning:9856:prompt-surface-gate (9856, 9989, 10001, 10015, 10019, 10027, 10035), and each
    was repaired. The gate implementation confirms that learning-shard path surfaces accept golden
    verdict fixtures and do not accept test-file evidence; this guidance names that remedy for
    task authors.
  src: "ci-learning:9856:prompt-surface-gate"
  cited: "2026-10-08"

- id: remudero-review-refusals-repaired-by-hand
  subsystem: ci
  lifecycle: active
  files:
    - "plan/tasks.d/**"
    - "src/run-task.ts"
    - "src/lib/policy.ts"
    - "src/lib/affected-suites.ts"
    - "src/lib/dep-review.ts"
    - "test/**"
