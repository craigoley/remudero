- id: leak-grep-refuses-plan-shard-token-text
  subsystem: ci
  lifecycle: active
  files:
    - "plan/tasks.d/**"
    - ".github/scripts/leak-grep.sh"
    - ".github/workflows/ci.yml"
  error_signatures:
    - "leak-grep: possible secret matching"
  fact: >-
    The leak-grep gate scans every tracked file, plan task shards included, for fixed secret-token
    formats. Before pushing a plan/tasks.d shard, run `bash .github/scripts/leak-grep.sh` on the
    committed tree, and if it reports a match, reword the matched text so the pattern no longer
    matches. Never add an allowlist entry to defeat the tripwire.
  evidence: >-
    The leak-grep gate went red on PR #11383 and the repair touched
    plan/tasks.d/W1-T9181-the-revalidation-garden-never-closes-on-an-absence.yaml. Checked at
    origin/main on 2026-10-14: that record matches none of the seven patterns in
    .github/scripts/leak-grep.sh. So the token that tripped #11383 is NOT established, and the
    #11383 CI log was not read. The gate's own refusal names the rule above, so this entry
    names that remedy, not a verified per-PR cause.
  src: "ci-learning:11383:leak-grep"
  cited: "2026-10-14"

# ── docs-index-check refusal (ci-learning:11388:docs-index-check, PRs #11388 and #11524) ──
- id: docs-index-stale-after-doc-edit
  subsystem: ci
  lifecycle: active
  files: ["docs/**", "docs/docs-index.json", "docs/README.md", "scripts/generate-docs-index.mjs"]
  fact: >-
    Any edit under docs/**/*.md makes the committed docs/docs-index.json STALE, and the docs-index:check gate refuses the PR; before pushing a docs change run `npm run --silent docs-index`, commit the regenerated docs/docs-index.json, then confirm `npm run --silent docs-index:check` prints OK.
  evidence: "ci-learning:11388:docs-index-check: the docs-index-check gate refused #11388 and #11524 because docs/docs-index.json did not match a fresh regeneration from docs/**/*.md (scripts/generate-docs-index.mjs --check exits 1 with 'is STALE'). The ci-learning note records the #11388 repair as regenerating docs/docs-index.json, editing docs/README.md, and touching three tests (a-refused-green-merge-records-why-and-reruns-a-stale-check, daemon-worktrees-pushes-and-arms-never-block-the-loop, run-task); that repair was NOT re-read from the PRs in this run. Also run `npm run --silent docs-index:check-paths` when a mermaid block cites a path."
  src: "ci-learning:11388:docs-index-check"
  cited: "2026-10-14"

