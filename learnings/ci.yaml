- id: comment-load-ratchet-lane
  subsystem: ci
  lifecycle: active
  files:
    - ".github/workflows/ci.yml"
    - "docs/comment-standard.md"
    - "scripts/comment-load-baseline.json"
    - "scripts/comment-load-ratchet.mjs"
  fact: >-
    Before changing the comment-load gate, its workflow, baseline, or documented policy, run
