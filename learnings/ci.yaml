    The remudero-review gate refused eight pull requests in one window (#9717, #9819, #9824, #9834,
    #9838, #9918, #9971, #9979), and each was repaired after the refusal. Before pushing, a worker
    on a change that touches plan/ runs `npm run --silent rule15-precheck`, and if it adds or edits
    a claim or proof in a plan task file or shard it lifts that shard into a plan-only PR rather than
