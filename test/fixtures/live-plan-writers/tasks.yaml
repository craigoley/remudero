# W1-T515 FIXTURE PLAN — the base blob the two live-plan writers used to take from `plan/tasks.yaml`.
#
# COMMITTED ON PURPOSE. `lintPlanCommand`'s `--base` resolution runs `git show <ref>:<relPath>` and
# exits 2 when that path does not exist at the ref, so a fixture built into a temp directory cannot
# serve a `--base` run at all. A tracked fixture can. And it must live UNDER the repo root: an
# explicit `--plan` resolving outside it is refused by name (W1-T120) before any `--base` plumbing.
