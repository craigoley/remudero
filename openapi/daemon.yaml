  # ── W1-T4611: the fleet-control writes and ingress. Every path below was served (the assembled
  # route table, test/helpers/declared-routes.ts) but undeclared; each entry is derived from its
  # handler. A write route's `tier` is quoted in its description; under `rmd serve`'s
  # `enforceWriteTiers`, the bearer write token is pinned at LOW, an operator session reaches
  # MIDDLE, and a stepped-up operator session reaches HIGH -- a HIGH route also consumes an
  # `X-Confirm-Nonce` issued by POST /v1/confirm for its exact method, path and raw body.

  /v1/confirm:
    post:
      summary: Issue a single-use confirmation nonce for one exact HIGH-tier call.
      description: >
        W1-T404 design (iv) / W1-T500 (src/lib/service.ts's `makeConfirmNonceRoute`, mounted by
        src/lib/serve.ts's `buildServeRoutes`). Write tier LOW -- requesting a nonce grants
        nothing; the target route's own tier check and nonce consumption are the real gate. The
        nonce binds `{method, path, payload}` and expires after 5 minutes.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmNonceRequest"
      responses:
        "200":
          description: A nonce bound to the named call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmNonceResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

