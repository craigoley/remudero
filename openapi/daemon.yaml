  /v1/hooks/github:
    post:
      summary: GitHub webhook ingress -- wakes the sweep early on an allowlisted event.
      description: >
        W1-T2568 (src/lib/github-event-wake.ts's `createGitHubEventWakeHandler`). SELF-AUTHENTICATED:
        no bearer token is read and scope/tier dispatch is bypassed entirely. The caller is
        authenticated by `X-Hub-Signature-256`, GitHub's HMAC-SHA256 of the RAW body under the
        configured webhook secret, compared constant-time. The route carries a declared LOW tier
        that dispatch never consults. It validates, then writes or coalesces one durable
        sweep-wake marker; it never calls GitHub, runs a sweep, or touches the merge hold.
        Allowlisted: `pull_request` (opened, reopened, synchronize, edited, ready_for_review,
        converted_to_draft, closed), `check_run` (completed), `status`, and
        `pull_request_review` (submitted, edited, dismissed).
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=<hex>` -- HMAC-SHA256 of the raw request body under the webhook secret."
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          description: The GitHub event name; one outside the allowlist is a 202 `ignored`.
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's delivery id -- the dedup key; missing on an allowlisted event is a 400.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubWebhookPayload"
      responses:
        "202":
          description: Accepted, coalesced, deduplicated, or ignored -- never retried by GitHub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookReceipt"
        "400":
          description: "`invalid_json` or `missing_delivery_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookRefusal"
        "401":
          description: "`invalid_signature` -- the signature header is missing, malformed, or wrong."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookRefusal"
        "403":
          description: "`repository_mismatch` -- the payload names another repository."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookRefusal"
        "413":
          description: "`body_too_large` -- the body exceeds the 1 MiB bound; it was never buffered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookRefusal"
        "503":
          description: "`webhook_not_configured` -- no webhook secret is configured; nothing is written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubWebhookRefusal"

