      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable promotion history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentPromotionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register a bounded promotion; canary exposure is serialized per policy scope.
      description: >
        Records the candidate, baseline, comparable population, denominator floor, observation
        window, guard metrics, maximum exposure, owner, expiry, and rollback path before any
        replay or approval. At most one active (non-terminal) promotion may hold a given
        (repo, policyScope) pair at a time.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
