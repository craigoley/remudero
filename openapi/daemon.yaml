          $ref: "#/components/schemas/OperatorAgentExperimentOutcome"

    OperatorAgentExperimentRollbackRequest:
      type: object
      required: [experimentId, rollback]
      properties:
        experimentId:
          type: string
        rollback:
          $ref: "#/components/schemas/OperatorAgentExperimentRollback"

    # ── W1-T3855 -- automation-action-v1: the explicit preflight, idempotency, approval, rollback,
    # and receipt contract between a recommendation and an execution (src/lib/automation-action.ts).
    AutomationActionScope:
      type: object
      description: >
        Names a flowId or experimentId AND a repo or instance; a record missing either half is
        refused `missing-scope`.
      properties:
        flowId:
          type: string
          maxLength: 160
        experimentId:
          type: string
          maxLength: 160
        repo:
          type: string
          maxLength: 160
        instance:
          type: string
          maxLength: 160

    AutomationActionPrecondition:
      type: object
      required: [id, source, description]
      properties:
        id:
          type: string
          maxLength: 160
        source:
          type: string
          maxLength: 160
          description: The authoritative source an observation must come from.
        description:
          type: string
          maxLength: 320

    AutomationActionRollback:
      type: object
      required: [mode]
      description: A reversible action names its plan; an irreversible one names the refusal path a rollback request takes instead.
      properties:
        mode:
          type: string
          enum: [reversible, irreversible]
        plan:
          type: string
          maxLength: 320
        refusal:
          type: string
          maxLength: 320

    AutomationAction:
      type: object
      description: >
        An immutable automation-action-v1 record (src/lib/automation-action.ts's
        `validateAutomationAction`). Fields the contract does not name are dropped; a raw prompt,
        transcript, credential, model prose, or browser-owned measurement field -- or a
        credential-shaped value -- refuses the whole record.
      required: [version, actionId, capability, summary, scope, risk, preconditions, freshness, idempotencyKey, createdAt, expiresAt, dryRun, approval, rollback, receiptRef]
      properties:
        version:
          type: string
          enum: [automation-action-v1]
        actionId:
          type: string
          maxLength: 160
        capability:
          type: string
          maxLength: 160
        summary:
          type: string
          maxLength: 320
        scope:
          $ref: "#/components/schemas/AutomationActionScope"
        risk:
          type: string
          enum: [low, medium, high, production, financial, credential, destructive]
        preconditions:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AutomationActionPrecondition"
        freshness:
          type: object
          required: [maxAgeSeconds]
          properties:
            maxAgeSeconds:
              type: integer
              minimum: 1
              maximum: 2592000
        idempotencyKey:
          type: string
          maxLength: 160
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        dryRun:
          type: boolean
        approval:
          type: object
          required: [policy]
          properties:
            policy:
              type: string
              enum: [none, human]
              description: high, production, financial, credential and destructive risk must declare human.
        rollback:
          $ref: "#/components/schemas/AutomationActionRollback"
        receiptRef:
          type: string
          maxLength: 160
          description: The authoritative system of record whose receipt proves what happened.

    AutomationPreconditionObservation:
      type: object
      required: [preconditionId, state, source, observedAt]
      properties:
        preconditionId:
          type: string
          maxLength: 160
        state:
          type: string
          enum: [satisfied, unsatisfied, unavailable]
        source:
          type: string
          maxLength: 160
        observedAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 320

    AutomationPreflightFinding:
      type: object
      required: [outcome, code, detail]
      properties:
        outcome:
          type: string
          enum: [refused, stale, unknown, expired, in-progress]
        code:
          type: string
        detail:
          type: string
        preconditionId:
          type: string
        receiptId:
          type: string

    AutomationPreflightResult:
      type: object
      required: [version, actionId, outcome, evaluatedAt, approval, findings]
      properties:
        version:
          type: string
          enum: [automation-action-v1]
        actionId:
          type: string
        outcome:
          type: string
          enum: [ready, refused, stale, unknown, expired, in-progress]
        evaluatedAt:
          type: string
          format: date-time
        approval:
          type: string
          enum: [not-required, pending, approved, rejected]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPreflightFinding"

    AutomationActionReceipt:
      type: object
      description: One bounded, append-only receipt; completion and rollback link to what they follow via linkedReceiptId.
      required: [version, receiptId, actionId, idempotencyKey, kind, outcome, at, receiptRef, reason]
      properties:
        version:
          type: string
          enum: [automation-action-v1]
        receiptId:
          type: string
        actionId:
          type: string
        idempotencyKey:
          type: string
        kind:
          type: string
          enum: [execution, completion, rollback]
        outcome:
          type: string
          enum: [in-progress, dry-run, refused, succeeded, failed, rolled_back]
        at:
          type: string
          format: date-time
        receiptRef:
          type: string
        linkedReceiptId:
          type: string
        preflight:
          type: string
          enum: [ready, refused, stale, unknown, expired, in-progress]
        code:
          type: string
          description: >
            A refusal's reason; on a completion, W1-T4657's evidence label -- `executor` when the
            action-catalogue-v1 executor wrote it, `self-reported` when a caller posted it.
        reason:
          type: string
          maxLength: 321
        evidenceRef:
          type: string

    OperatorAgentActionHistory:
      type: object
      required: [action, state, approval, receipts]
      properties:
        action:
          $ref: "#/components/schemas/AutomationAction"
        state:
          type: string
          enum: [registered, approved, rejected, in-progress, succeeded, failed, rolled_back, expired]
        approval:
          type: string
          enum: [not-required, pending, approved, rejected]
        decision:
          type: object
          required: [decision, decidedBy, decidedAt]
          properties:
            decision:
              type: string
              enum: [approved, rejected]
            decidedBy:
              type: string
            decidedAt:
              type: string
              format: date-time
        receipts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AutomationActionReceipt"

    OperatorAgentActionList:
      type: object
      required: [version, actions, source]
      properties:
        version:
          type: string
          enum: [automation-action-v1]
        actions:
          type: array
          items:
            $ref: "#/components/schemas/OperatorAgentActionHistory"
        source:
          type: string
          enum: [ledger]

    OperatorAgentActionRegistration:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/AutomationAction"

    OperatorAgentActionDecisionRequest:
      type: object
      required: [actionId, decision]
      properties:
        actionId:
          type: string
        decision:
          type: string
          enum: [approved, rejected]

    OperatorAgentActionObservationRequest:
      type: object
      required: [actionId]
      properties:
        actionId:
          type: string
        observations:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/AutomationPreconditionObservation"
        dryRun:
          type: boolean
          description: Execute only; a dry run evaluates preflight and records a dry-run receipt without admitting anything.
        delegationId:
          type: string
          maxLength: 160
          description: >
            W1-T3878 -- the delegation-profile-v1 this request acts under. Its eligibility (missing,
            revoked, stale, expired, unapproved, over budget, out of scope, unlinked, capability,
            risk ceiling, human gate) enters preflight as refused findings named `delegation-*`.
        estimatedCostUsd:
          type: number
          minimum: 0
          maximum: 10000
          description: W1-T3878 -- the cost an admission under `delegationId` charges against that profile's cost budget.

    OperatorAgentActionCompletionRequest:
      type: object
      required: [actionId, admissionReceiptId, outcome]
      properties:
        actionId:
          type: string
        admissionReceiptId:
          type: string
        outcome:
          type: string
          enum: [succeeded, failed]
        evidenceRef:
          type: string
          maxLength: 160
          description: Required for succeeded -- success is claimed only with the evidence that proves it.
        reason:
          type: string
          maxLength: 320

    OperatorAgentActionRollbackRequest:
      type: object
      required: [actionId, reason, evidenceRef]
      properties:
        actionId:
          type: string
        reason:
          type: string
          maxLength: 320
        evidenceRef:
          type: string
          maxLength: 160

    OperatorAgentActionPreflightResponse:
      type: object
      required: [preflight]
      properties:
        preflight:
          $ref: "#/components/schemas/AutomationPreflightResult"

    OperatorAgentActionStepResult:
      type: object
      description: >
        An engine step's disposition and the receipt it decided. `reused` returns the EXISTING
        receipt for a duplicate idempotency key, completion, or rollback, and appends nothing.
      required: [ok, disposition, receipt]
      properties:
        ok:
          type: boolean
        disposition:
          type: string
          enum: [admitted, dry-run, refused, reused, completed, rolled_back]
        receipt:
          $ref: "#/components/schemas/AutomationActionReceipt"
        preflight:
          $ref: "#/components/schemas/AutomationPreflightResult"
        admission:
          $ref: "#/components/schemas/AutomationActionReceipt"
        executor:
          type: object
          description: W1-T4657 -- the catalogue executor's own ledger row, which the completion's evidenceRef cites.
          required: [step, ts, run_id]
          properties:
            step:
              type: string
            ts:
              type: string
              format: date-time
            run_id:
              type: string

    # ── W1-T3878 -- delegation-profile-v1: the trust budget every delegation carries ──────────
    DelegationProfileScope:
      oneOf:
        - type: object
          required: [kind, repository]
          properties:
            kind:
              type: string
              enum: [repository]
            repository:
              type: string
              maxLength: 160
        - type: object
          required: [kind, instanceId]
          properties:
            kind:
              type: string
              enum: [instance]
            instanceId:
              type: string
              maxLength: 160

    DelegationProfileLink:
      type: object
      description: The action or flow this delegation governs; at least one is required.
      properties:
        flowId:
          type: string
          maxLength: 160
        actionId:
          type: string
          maxLength: 160

    DelegationProfileBudget:
      type: object
      required: [costUsd, durationMinutes]
      properties:
        costUsd:
          type: number
          minimum: 0
          maximum: 10000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 129600
          description: Counted from the operator's acceptance.

    DelegationProfileInput:
      type: object
      description: >
        What an issuer supplies (src/lib/delegation-profile.ts's `buildDelegationProfile`). version,
        revision, createdAt (the server clock) and revocationRef are set by core. A raw prompt,
        transcript, credential, browser-owned measurement, or a model-confidence / prior-approval /
        UI-state field anywhere refuses the whole record by name.
      required: [delegationId, principal, purpose, link, scope, dataClasses, capabilities, capabilitySummary, riskTier, budget, notification, approvalLevel, humanDecision, fallbackOwner, expiresAt]
      properties:
        delegationId:
          type: string
          maxLength: 160
        principal:
          type: string
          maxLength: 160
        purpose:
          type: string
          maxLength: 320
        link:
          $ref: "#/components/schemas/DelegationProfileLink"
        scope:
          $ref: "#/components/schemas/DelegationProfileScope"
        dataClasses:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 120
        capabilities:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 160
        capabilitySummary:
          type: string
          maxLength: 320
        riskTier:
          type: string
          description: The highest risk an action under this profile may declare.
          enum: [low, medium, high, production, financial, credential, destructive]
        budget:
          $ref: "#/components/schemas/DelegationProfileBudget"
        notification:
          type: string
          enum: [silent, on-refusal, on-every-action]
        approvalLevel:
          type: string
          enum: [profile, each-action]
        humanDecision:
          type: string
          maxLength: 320
        fallbackOwner:
          type: string
          maxLength: 160
        expiresAt:
          type: string
          format: date-time
          description: After createdAt and within 90 days of it.

    DelegationProfileReceipt:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [accept, revoke, replace]
        at:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 320

    DelegationProfileView:
      type: object
      description: >
        One profile with its derived state. `riskTier` is the console's four-tier vocabulary (every
        critical tier reads `critical`); `actionRiskCeiling` is core's own tier. `lifecycleState`
        answers "may it act at all" and is never folded with `freshness`; `revocation` is present
        whenever the ledger carries it, including a superseded profile naming its replacement.
      required: [version, delegationId, revision, principal, purpose, link, scope, dataClasses, capabilities, capabilitySummary, riskTier, actionRiskCeiling, budget, notification, approvalLevel, humanDecision, fallbackOwner, createdAt, expiresAt, revocationRef, approval, lifecycleState, status, spentCostUsd, receipts, observedAt, freshness]
      properties:
        version:
          type: string
          enum: [delegation-profile-v1]
        delegationId:
          type: string
        revision:
          type: integer
          minimum: 1
        replaces:
          type: string
        principal:
          type: string
        purpose:
          type: string
        link:
          $ref: "#/components/schemas/DelegationProfileLink"
        scope:
          $ref: "#/components/schemas/DelegationProfileScope"
        dataClasses:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        capabilitySummary:
          type: string
        riskTier:
          type: string
          enum: [low, medium, high, critical]
        actionRiskCeiling:
          type: string
          enum: [low, medium, high, production, financial, credential, destructive]
        budget:
          $ref: "#/components/schemas/DelegationProfileBudget"
        notification:
          type: string
          enum: [silent, on-refusal, on-every-action]
        approvalLevel:
          type: string
          enum: [profile, each-action]
        humanDecision:
          type: string
        fallbackOwner:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revocationRef:
          type: string
        approval:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [pending, approved, denied]
            decidedAt:
              type: string
              format: date-time
        lifecycleState:
          type: string
          enum: [active, expired, revoked]
        status:
          type: string
          enum: [pending, active, denied, revoked, superseded, expired]
        revocation:
          type: object
          properties:
            reason:
              type: string
            revokedAt:
              type: string
              format: date-time
        supersededBy:
          type: string
        pendingReplacement:
          type: string
        spentCostUsd:
          type: number
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/DelegationProfileReceipt"
        observedAt:
          type: string
          format: date-time
        freshness:
          type: string
          enum: [verified]

    DelegationProfileList:
      type: object
      required: [version, profiles, source]
      properties:
        version:
          type: string
          enum: [delegation-profile-v1]
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/DelegationProfileView"
        source:
          type: string
          enum: [ledger]

    DelegationProfileIssueRequest:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/DelegationProfileInput"

    DelegationProfileIssueResult:
      type: object
      required: [ok, profile]
      properties:
        ok:
          type: boolean
        profile:
          $ref: "#/components/schemas/DelegationProfileView"

    DelegationDecisionRequest:
      type: object
      required: [delegationId, decision]
      properties:
        delegationId:
          type: string
          maxLength: 160
        decision:
          type: string
          enum: [accepted, revoked]
        note:
          type: string
          maxLength: 320

    DelegationDecisionResult:
      type: object
      required: [ok, delegationId, decision, decidedBy, at, lifecycleState, approval]
      properties:
        ok:
          type: boolean
        delegationId:
          type: string
        decision:
          type: string
          enum: [accepted, revoked]
        decidedBy:
          type: string
        at:
          type: string
          format: date-time
        lifecycleState:
          type: string
          enum: [active, expired, revoked]
        approval:
          type: string
          enum: [pending, approved, denied]

    DelegationReplaceRequest:
      type: object
      required: [delegationId]
      properties:
        delegationId:
          type: string
          maxLength: 160
        note:
          type: string
          maxLength: 320
        changes:
          type: object
          description: >
            Any DelegationProfileInput field except the identity fields (delegationId, principal,
            link, scope), which refuse `immutable-field`. Unnamed fields carry over; expiresAt
            defaults to the predecessor's lifetime from now.
          additionalProperties: true

    DelegationReplaceResult:
      type: object
      required: [ok, delegationId, replacementId, at, lifecycleState, profile]
      properties:
        ok:
          type: boolean
        delegationId:
          type: string
          description: The profile being replaced; unchanged, and authoritative until the replacement is accepted.
        replacementId:
          type: string
        at:
          type: string
          format: date-time
        lifecycleState:
          type: string
          description: The REPLACED profile's lifecycle, which the replacement does not change.
          enum: [active, expired, revoked]
        profile:
          $ref: "#/components/schemas/DelegationProfileView"

    # ── W1-T3898 -- intent-plan-v1: the reviewable plan between an operator's sentence and an
    # automation-action-v1 request. Core owns it; the console reads the top-level fields.
    IntentPlanStepInput:
      type: object
      required: [capability, summary, risk, preconditions, freshness, dryRun, rollback, receiptRef]
      properties:
        capability:
          type: string
          maxLength: 160
        summary:
          type: string
          maxLength: 320
        risk:
          type: string
          enum: [low, medium, high, production, financial, credential, destructive]
        preconditions:
          type: array
          items:
            type: object
            additionalProperties: true
        freshness:
          type: object
          additionalProperties: true
        dryRun:
          type: boolean
        rollback:
          type: object
          additionalProperties: true
        receiptRef:
          type: string
          maxLength: 160
        estimatedCostUsd:
          type: number

    IntentPlanProposeRequest:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
          maxLength: 4000
        constraints:
          type: array
          items:
            type: string
        facts:
          type: array
          items:
            type: object
            additionalProperties: true
        questions:
          type: array
          items:
            type: object
            additionalProperties: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanStepInput"
        scope:
          type: object
          additionalProperties: true
        delegationId:
          type: string
          maxLength: 160
        budget:
          type: object
          additionalProperties: true
        freshness:
          type: object
          additionalProperties: true
        expiresInMinutes:
          type: integer
        idempotencyKey:
          type: string
          maxLength: 140

    IntentPlanUnknown:
      type: object
      required: [id, question]
      properties:
        id:
          type: string
        question:
          type: string

    IntentPlanReceiptEntry:
      type: object
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [propose, clarify, confirm, undo]
        at:
          type: string
          format: date-time
        issuer:
          type: string
        note:
          type: string

    IntentPlanConsequence:
      type: object
      required: [classes, summary]
      properties:
        classes:
          type: array
          items:
            type: string
            enum: [financial, irreversible]
        summary:
          type: string
        budgetUsd:
          type: number
        ceilingUsd:
          type: number

    IntentPlanExecution:
      type: object
      required: [state, actions]
      properties:
        state:
          type: string
          enum: [not-requested, awaiting-receipt, in-progress, succeeded, failed, refused, expired, rolled-back, partially-rolled-back, unknown]
        actions:
          type: array
          items:
            type: object
            additionalProperties: true

    IntentPlanView:
      type: object
      required: [planId, goal, constraints, unknowns, scope, consequence, freshness, nextDecision, observedAt, receipts, source, version, status, plan, preview, confirmation, execution, events]
      properties:
        planId:
          type: string
        goal:
          type: string
        constraints:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanUnknown"
        scope:
          type: object
          required: [repository]
          properties:
            repository:
              type: string
              description: The resolved repository, `(instance scope)`, or `(unresolved)` while the scope question is open.
            instanceId:
              type: string
        consequence:
          $ref: "#/components/schemas/IntentPlanConsequence"
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        nextDecision:
          type: string
          enum: [answer_clarification, confirm, undo, none]
        observedAt:
          type: string
          format: date-time
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanReceiptEntry"
        source:
          type: string
        version:
          type: string
          enum: [intent-plan-v1]
        status:
          type: string
          enum: [draft, confirmed, withdrawn]
        plan:
          type: object
          description: The immutable intent-plan-v1 envelope -- outcome, constraints, facts and sources, questions, steps, scope, consequence, budget, approval, expiry, idempotency key, and undo paths.
          additionalProperties: true
        preview:
          type: object
          description: Non-operative (`operative` is always false); `state` is ready or the first blocking state by precedence, with every finding kept.
          additionalProperties: true
        confirmation:
          type: object
          additionalProperties: true
        execution:
          $ref: "#/components/schemas/IntentPlanExecution"
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    IntentPlanList:
      type: object
      required: [version, state, intentPlans, source]
      properties:
        version:
          type: string
          enum: [intent-plan-v1]
        state:
          type: string
          enum: [verified]
        intentPlans:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanView"
        source:
          type: string
          enum: [ledger]

    IntentPlanProposeResult:
      type: object
      description: IntentPlanView flattened (this generator's subset has no allOf) plus `ok` and `existing`.
      required: [ok, existing, planId, goal, constraints, unknowns, scope, consequence, freshness, nextDecision, observedAt, receipts, source]
      properties:
        ok:
          type: boolean
        existing:
          type: boolean
        planId:
          type: string
        goal:
          type: string
        constraints:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanUnknown"
        scope:
          type: object
          additionalProperties: true
        consequence:
          $ref: "#/components/schemas/IntentPlanConsequence"
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        nextDecision:
          type: string
          enum: [answer_clarification, confirm, undo, none]
        observedAt:
          type: string
          format: date-time
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/IntentPlanReceiptEntry"
        source:
          type: string
        status:
          type: string
          enum: [draft, confirmed, withdrawn]
        plan:
          type: object
          additionalProperties: true
        preview:
          type: object
          additionalProperties: true
        execution:
          $ref: "#/components/schemas/IntentPlanExecution"

    IntentPlanDecisionRequest:
      type: object
      required: [planId, action]
      properties:
        planId:
          type: string
          maxLength: 160
        action:
          type: string
          enum: [clarify, confirm, undo]
        questionId:
          type: string
          maxLength: 160
          description: clarify only.
        answer:
          type: string
          maxLength: 2000
          description: clarify only.
        confirm:
          type: boolean
          description: confirm only; when present it must be true.
        note:
          type: string
          maxLength: 1000
          description: confirm and undo only.

    IntentPlanDecisionResult:
      type: object
      required: [ok, planId, action, disposition, at, event, plan]
      properties:
        ok:
          type: boolean
        planId:
          type: string
        action:
          type: string
          enum: [clarify, confirm, undo]
        disposition:
          type: string
          enum: [recorded, confirmed, withdrawn, requested, reused]
        at:
          type: string
          format: date-time
        event:
          type: object
          additionalProperties: true
        plan:
          $ref: "#/components/schemas/IntentPlanView"

    IntentPlanDecisionRefusal:
      type: object
      required: [ok, error, planId, action, code, detail]
      properties:
        ok:
          type: boolean
        error:
          type: string
          enum: [conflict]
        planId:
          type: string
        action:
          type: string
        code:
          type: string
        detail:
          type: string
        at:
          type: string
          format: date-time
          description: Present when the refusal itself was recorded (an undo refusal).
        event:
          type: object
          additionalProperties: true

    # ── W1-T3856 -- experiment-promotion-v1: the guarded flow from a candidate policy to measured
    # production exposure (deterministic replay, shadow observation, canary promotion, stop
    # conditions, automatic rollback) that a later-approved experiment-v1 record may take.
    PromotionScope:
      type: object
      required: [repo, policyScope]
      properties:
        repo:
          type: string
          minLength: 1
        policyScope:
          type: string
          minLength: 1
          description: The unit canary exposure is serialized against; at most one active promotion may hold a given (repo, policyScope) pair.
        taskType:
          type: string
        lane:
          type: string

    PromotionGuardMetric:
      type: object
      required: [metricName, unit, direction, abortThreshold]
      properties:
        metricName:
          type: string
        unit:
          type: string
        direction:
          type: string
          enum: [max, min]
        abortThreshold:
          type: number

    PromotionRollback:
      type: object
      required: [plan, reason]
      properties:
        plan:
          type: string
        reason:
          type: string
        receipt:
          type: string

    PromotionRecord:
      type: object
      required:
        - version
        - promotionId
        - candidate
        - baseline
        - scope
        - comparisonPopulation
        - denominatorFloor
        - observationWindow
        - guardMetrics
        - maxExposure
        - owner
        - expiresAt
        - rollback
        - createdAt
        - state
      properties:
        version:
          type: string
          enum: [experiment-promotion-v1]
        promotionId:
          type: string
        experimentId:
          type: string
          description: Links to the experiment-v1 record (W1-T3853) this promotion progresses.
        candidate:
          type: string
        baseline:
          type: string
        scope:
          $ref: "#/components/schemas/PromotionScope"
        comparisonPopulation:
          type: string
        denominatorFloor:
          type: integer
          minimum: 5
        observationWindow:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        guardMetrics:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromotionGuardMetric"
        maxExposure:
          type: number
          minimum: 0
          maximum: 1
          description: The bounded maximum fraction of traffic the canary may take.
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time
        rollback:
          $ref: "#/components/schemas/PromotionRollback"
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [proposed]

    PromotionReplayResult:
      type: object
      required: [caseId, matched]
      description: >
        The bounded per-case receipt submitted and persisted: whether the candidate and baseline
        agreed. The raw candidate/baseline outputs replayPromotion() computes are not part of the
        durable wire contract -- they may be arbitrarily large or unbounded -- so only the
        comparison result is recorded.
      properties:
        caseId:
          type: string
        matched:
          type: boolean

    PromotionReplaySummary:
      type: object
      required: [version, corpusSize, matched, mismatched, deterministic, sideEffectFree, results]
      properties:
        version:
          type: string
          enum: [experiment-promotion-v1]
        corpusSize:
          type: integer
          minimum: 1
        matched:
          type: integer
          minimum: 0
        mismatched:
          type: integer
          minimum: 0
        deterministic:
          type: boolean
        sideEffectFree:
          type: boolean
          enum: [true]
        results:
          type: array
          items:
            $ref: "#/components/schemas/PromotionReplayResult"

    PromotionGuardObservation:
      type: object
      required: [metricName, value, denominator, freshness, comparisonPopulation, observedAt]
      properties:
        metricName:
          type: string
        value:
          type: number
        denominator:
          type: integer
          minimum: 0
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        comparisonPopulation:
          type: string
        observedAt:
          type: string
          format: date-time

    PromotionGuardEvaluation:
      type: object
      required: [state, reasons, breachedMetrics]
      properties:
        state:
          type: string
          enum: [ready, unmeasurable, regressed]
        reasons:
          type: array
          items:
            type: string
        breachedMetrics:
          type: array
          items:
            type: string

    AssistantTrustControlResult:
      type: object
      description: >
        One control case (W1-T3882): a `positive` control proves the corpus is visible (a
        known-good case the candidate must pass); a `negative` control proves a restraint
        failure is detectable (a known-bad case the candidate must flag, never pass silently).
      required: [caseId, metricName, controlType, expectedOutcome, observedOutcome]
      properties:
        caseId:
          type: string
        metricName:
          type: string
          enum:
            - proactivity_precision
            - dropped_thread_recovery
            - clarification_burden
            - intervention_rate
            - unauthorized_side_effect_rate
            - stale_context_use
            - receipt_completeness
            - rollback_success
            - time_to_human_attention
        controlType:
          type: string
          enum: [positive, negative]
        expectedOutcome:
          type: string
          enum: [pass, flagged]
        observedOutcome:
          type: string
          enum: [pass, flagged]

    AssistantTrustEvidence:
      type: object
      description: >
        Restraint and recovery evidence (W1-T3882) that gates a promotion above the base
        guardrail evaluation: any unauthorized side effect, stale-context use, incomplete
        receipt, or failed rollback blocks promotion outright.
      required: [unauthorizedSideEffects, staleContextUses, receiptsComplete, rollbackAttempted, rollbackSucceeded]
      properties:
        unauthorizedSideEffects:
          type: integer
          minimum: 0
        staleContextUses:
          type: integer
          minimum: 0
        receiptsComplete:
          type: boolean
        rollbackAttempted:
          type: boolean
        rollbackSucceeded:
          type: boolean

    RawAssistantTrustContext:
      type: object
      description: >
        Raw material an evaluation MIGHT be handed — never persisted or trained on. Only bounded
        counts and a secret-scrubbed, length-capped note ever leave this boundary; see
        `AssistantTrustEvaluation.evidence`.
      properties:
        prompts:
          type: array
          maxItems: 200
          items:
            type: string
        transcripts:
          type: array
          maxItems: 200
          items:
            type: string
        credentials:
          type: array
          maxItems: 200
          items:
            type: string
        note:
          type: string

    RedactedAssistantTrustEvidence:
      type: object
      required: [promptCount, transcriptCount, credentialCount, note, redacted]
      properties:
        promptCount:
          type: integer
          minimum: 0
        transcriptCount:
          type: integer
          minimum: 0
        credentialCount:
          type: integer
          minimum: 0
        note:
          type: string
        redacted:
          type: boolean
          enum: [true]

    AssistantTrustEvaluation:
      type: object
      description: >
        The evaluation layer above `PromotionGuardEvaluation` (W1-T3882): a candidate may reach
        `ready` only when replay was deterministic and side-effect-free, the corpus carried
        working positive and negative controls, and no unauthorized side effect, stale-context
        use, incomplete receipt, or failed rollback was observed.
      required: [state, reasons, evidence]
      properties:
        state:
          type: string
          enum: [ready, unmeasurable, blocked]
        reasons:
          type: array
          items:
            type: string
        evidence:
          $ref: "#/components/schemas/RedactedAssistantTrustEvidence"

    OperatorAgentPromotionHistory:
      type: object
      required:
        - version
        - promotionId
        - candidate
        - baseline
        - scope
        - comparisonPopulation
        - denominatorFloor
        - observationWindow
        - guardMetrics
        - maxExposure
        - owner
        - expiresAt
        - rollback
        - createdAt
        - state
        - events
      properties:
        version:
          type: string
          enum: [experiment-promotion-v1]
        promotionId:
          type: string
        experimentId:
          type: string
        candidate:
          type: string
        baseline:
          type: string
        scope:
          $ref: "#/components/schemas/PromotionScope"
        comparisonPopulation:
          type: string
        denominatorFloor:
          type: integer
          minimum: 5
        observationWindow:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        guardMetrics:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromotionGuardMetric"
        maxExposure:
          type: number
          minimum: 0
          maximum: 1
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time
        rollback:
          $ref: "#/components/schemas/PromotionRollback"
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - proposed
            - replayed
            - approved
            - shadow
            - canary
            - observing
            - promoted
            - neutral
            - regressed
            - rolled_back
            - expired
            - unmeasurable
        events:
          type: array
          items:
            type: object
            required: [kind, at, state]
            properties:
              kind:
                type: string
                enum: [replay, decision, advance, rollback]
              at:
                type: string
                format: date-time
              state:
                type: string
              replay:
                $ref: "#/components/schemas/PromotionReplaySummary"
              decision:
                type: string
                enum: [approved]
              advance:
                type: object
                required: [target, guard]
                properties:
                  target:
                    type: string
                    enum: [shadow, canary, observing, promoted]
                  guard:
                    $ref: "#/components/schemas/PromotionGuardEvaluation"
                  exposure:
                    type: number
                  assistantTrust:
                    $ref: "#/components/schemas/AssistantTrustEvaluation"
              rollback:
                $ref: "#/components/schemas/PromotionRollback"
              note:
                type: string

    OperatorAgentPromotionList:
      type: object
      required: [promotions, source]
      properties:
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/OperatorAgentPromotionHistory"
        source:
          type: string
          enum: [ledger]

    OperatorAgentPromotionRegistration:
      type: object
      required: [promotion]
      properties:
        promotion:
          $ref: "#/components/schemas/PromotionRecord"

    OperatorAgentPromotionReplayRequest:
      type: object
      required: [promotionId, replay]
      properties:
        promotionId:
          type: string
        replay:
          $ref: "#/components/schemas/PromotionReplaySummary"

    OperatorAgentPromotionDecisionRequest:
      type: object
      required: [promotionId, decision]
      properties:
        promotionId:
          type: string
        decision:
          type: string
          enum: [approved]
        note:
          type: string

    OperatorAgentPromotionAdvanceRequest:
      type: object
      required: [promotionId, target]
      properties:
        promotionId:
          type: string
        target:
          type: string
          enum: [shadow, canary, observing, promoted]
        observations:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromotionGuardObservation"
        exposure:
          type: number
        assistantTrust:
          type: object
          description: >
            Optional assistant-trust evidence (W1-T3882). Its absence preserves the pre-W1-T3882
            base-guardrail-only advance behaviour exactly; when present, the response carries an
            `assistantTrust` evaluation and a `blocked`/`unmeasurable` result can demote an
            otherwise-ready advance to `regressed`/`unmeasurable`.
          required: [controls, evidence]
          properties:
            controls:
              type: array
              maxItems: 64
              items:
                $ref: "#/components/schemas/AssistantTrustControlResult"
            evidence:
              $ref: "#/components/schemas/AssistantTrustEvidence"
            rawContext:
              $ref: "#/components/schemas/RawAssistantTrustContext"

    OperatorAgentPromotionRollbackRequest:
      type: object
      required: [promotionId, rollback]
      properties:
        promotionId:
          type: string
        rollback:
          $ref: "#/components/schemas/PromotionRollback"

    OperatorAgentConsequenceAction:
      type: object
      required: [consequenceClass, target, requiredApprovers]
      properties:
        id:
          type: string
        consequenceClass:
          type: string
          enum: [reversible, disruptive, irreversible, financial]
        target:
          type: object
          required: [identity, source]
          properties:
            identity:
              type: string
            source:
              type: string
              enum: [trusted, external]
            ambiguous:
              type: boolean
        scope:
          type: object
          properties:
            repo:
              type: string
            instance:
              type: string
        evidence:
          type: array
          items:
            type: object
            required: [label, observedAt, maxAgeSeconds]
            properties:
              label:
                type: string
              observedAt:
                type: string
                format: date-time
              maxAgeSeconds:
                type: number
        financial:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
            perActionCeiling:
              type: number
            aggregateCeiling:
              type: number
            aggregateSpentBefore:
              type: number
            quoteExpiresAt:
              type: string
              format: date-time
            coolingOffSeconds:
              type: integer
            coolingOffStartedAt:
              type: string
              format: date-time
        irreversible:
          type: object
          properties:
            affectedResource:
              type: string
            recoveryAvailable:
              type: boolean
            recoveryStatement:
              type: string
            rollbackUnavailableReason:
              type: string
            confirmationNonce:
              type: string
            confirmationExpiresAt:
              type: string
              format: date-time
        requiredApprovers:
          type: integer
        approvals:
          type: array
          items:
            type: object
            required: [approverId, approvedAt, source]
            properties:
              approverId:
                type: string
              approvedAt:
                type: string
                format: date-time
              source:
                type: string
                enum: [trusted, external]
        capabilityGrant:
          type: object
          required: [grantId]
          properties:
            grantId:
              type: string

    OperatorAgentConsequencePreflightRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/OperatorAgentConsequenceAction"

    OperatorAgentConsequenceReceipt:
      type: object
      description: >
        One recorded decision on a pending consequence (src/lib/operator-agent.ts's
        `ConsequenceDecisionReceipt`).
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [approve, refuse]
        at:
          type: string
          format: date-time
        issuer:
          type: string
          description: The deciding credential's actor id, when the ledger row recorded one.
        note:
          type: string
          description: >
            The decision's reason. A refusal with no operator reason carries "operator refused this
            consequence".

    OperatorAgentPendingConsequence:
      type: object
      description: >
        consequence-v1 as the console's `normalizedConsequenceRecord` validates it
        (src/lib/operator-agent.ts's `PendingConsequenceRecord`), projected from the approval the
        consequence preflight persisted on its ledger row.
      required: [consequenceId, classes, target, expiresAt, approverRequired, recoveryStatement, freshness, observedAt, receipts, source]
      properties:
        consequenceId:
          type: string
          description: The preflighted action's id.
        classes:
          type: array
          items:
            type: string
            enum: [financial, irreversible]
        target:
          type: string
          maxLength: 320
          description: The action's target identity, never truncated -- a longer one is not listed at all.
        amountUsd:
          type: number
        currency:
          type: string
        ceilingUsd:
          type: number
          description: The per-action financial ceiling.
        coolingOffMs:
          type: integer
        coolingOffUntil:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The earlier of the quote expiry and the irreversible confirmation expiry.
        approverRequired:
          type: boolean
        recoveryStatement:
          type: string
          maxLength: 1000
        freshness:
          type: string
          enum: [verified, stale]
          description: "`stale` once the earliest evidence item's freshness window has passed."
        observedAt:
          type: string
          format: date-time
          description: When the preflight row that made this consequence pending was written.
        receipts:
          type: array
          description: Empty, or the one refusal recorded since that preflight row.
          items:
            $ref: "#/components/schemas/OperatorAgentConsequenceReceipt"
        source:
          type: string
          enum: ["rmd:core:/v1/operator-agent/consequences"]

    OperatorAgentPendingConsequenceRead:
      type: object
      description: GET /v1/operator-agent/consequences's body (src/lib/operator-agent.ts's `PendingConsequenceRead`).
      required: [state, consequences, source, generatedAt, max, total, truncated, unprojected]
      properties:
        state:
          type: string
          enum: [verified]
        consequences:
          type: array
          description: Newest `observedAt` first, at most `max` records.
          items:
            $ref: "#/components/schemas/OperatorAgentPendingConsequence"
        source:
          type: string
          enum: [ledger]
        generatedAt:
          type: string
          format: date-time
        max:
          type: integer
          description: The per-read cap (MAX_PENDING_CONSEQUENCES, 100).
        total:
          type: integer
          description: Every pending consequence, before the cap.
        truncated:
          type: boolean
        unprojected:
          type: integer
          description: Pending preflight rows written before W1-T4104 carried no approval projection -- counted, never listed.

    OperatorAgentConsequencesReadOnlyRefusal:
      type: object
      description: A write verb on GET /v1/operator-agent/consequences, refused by name.
      required: [error, method, path, detail, allow]
      properties:
        error:
          type: string
          enum: [read_only]
        method:
          type: string
          enum: [POST, PUT, PATCH, DELETE]
        path:
          type: string
          enum: ["/v1/operator-agent/consequences"]
        detail:
          type: string
        allow:
          type: array
          items:
            type: string
            enum: [GET]

    OperatorAgentConsequenceDecisionRequest:
      type: object
      description: >
        src/lib/operator-agent.ts's `validateConsequenceDecisionInput`. `note` is the console's
        earlier name for `reason` and is accepted as an alias; sending both is a 400.
      required: [consequenceId, decision]
      properties:
        consequenceId:
          type: string
          minLength: 1
          maxLength: 160
        decision:
          type: string
          enum: [approve, refuse]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        note:
          type: string
          minLength: 1
          maxLength: 1000

    OperatorAgentConsequenceDecisionResult:
      type: object
      required: [ok, consequenceId, decision, at, receipt]
      properties:
        ok:
          type: boolean
          enum: [true]
        consequenceId:
          type: string
        decision:
          type: string
          enum: [approve, refuse]
        at:
          type: string
          format: date-time
        receipt:
          $ref: "#/components/schemas/OperatorAgentConsequenceReceipt"

    OperatorAgentConsequenceDecisionRefusal:
      type: object
      description: A consequence decision refused because the consequence is not (or no longer) pending; nothing is recorded.
      required: [error, consequenceId, detail]
      properties:
        error:
          type: string
          enum: [not_found, expired_consequence, consequence_not_pending]
        consequenceId:
          type: string
        detail:
          type: string

    EmergencyStop:
      type: object
      description: >
        A bound `emergency-stop-v1` stop (src/lib/emergency-control.ts's `EmergencyStop`).
      required: [schema, id, scope, reason, issuedBy, issuedAt, clearPolicy, affectedCapabilities, affectedDelegationClasses, incidentReceiptId]
      properties:
        schema:
          type: string
          enum: [emergency-stop-v1]
        id:
          type: string
        scope:
          type: string
          enum: [fleet, repository, instance, principal]
        scopeTarget:
          type: string
          description: Present for every scope but `fleet`, which is total by definition.
        reason:
          type: string
        issuedBy:
          type: string
        issuedAt:
          type: string
          format: date-time
        clearPolicy:
          type: string
          enum: [expires, explicit-clear-required]
        expiresAt:
          type: string
          format: date-time
          description: Present only when `clearPolicy` is `expires`.
        affectedCapabilities:
          type: array
          description: >
            The capabilities this stop blocks. The code's type is `string[] | "*"`: the literal
            string "*" (the default) blocks every capability. This document's OpenAPI subset
            (scripts/generate-api-client.mjs) has no union, so only the array arm is typed here --
            a consumer must accept the string "*" as well.
          items:
            type: string
        affectedDelegationClasses:
          type: array
          description: >
            The delegation classes this stop blocks. The code's type is `string[] | "*"`: the
            literal string "*" (the default) blocks every class; as for `affectedCapabilities`,
            only the array arm is typed here and a consumer must accept "*" as well.
          items:
            type: string
        incidentReceiptId:
          type: string
          description: The incident record this stop is accountable to; every receipt of its lifecycle links back to it.

    EmergencyReceipt:
      type: object
      description: >
        One bounded, attributable receipt of an emergency stop's lifecycle
        (src/lib/emergency-control.ts's `EmergencyReceipt`).
      required: [receiptId, stopId, parentReceiptId, kind, outcome, decidedAt, reason]
      properties:
        receiptId:
          type: string
        stopId:
          type: string
        parentReceiptId:
          type: string
          description: Always the stop's own `incidentReceiptId`.
        kind:
          type: string
          enum: [stop, refusal, cancellation, clear]
        outcome:
          type: string
          description: >
            `issued` for a stop, the refused action kind for a refusal, `cleared` or the clear
            refusal code for a clear.
        decidedAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 241
          description: Capped at 240 characters plus a trailing ellipsis.

    EmergencyStopIssueRequest:
      type: object
      description: >
        src/lib/operator-agent.ts's `validateEmergencyStopIssue`, then `createEmergencyStop`'s
        issuance rules. `affectedCapabilities`/`affectedDelegationClasses` default to "*" when
        omitted and may be sent as the literal string "*" -- the OpenAPI subset types only their
        array arm. `issuedAt` is stamped by the daemon.
      required: [scope, reason, issuedBy, clearPolicy, incidentReceiptId]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          description: Defaults to `estop-<uuid>`.
        scope:
          type: string
          enum: [fleet, repository, instance, principal]
        scopeTarget:
          type: string
          minLength: 1
          maxLength: 160
          description: Required for every scope but `fleet`; refused on `fleet`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
        issuedBy:
          type: string
          minLength: 1
          maxLength: 160
        clearPolicy:
          type: string
          enum: [expires, explicit-clear-required]
        expiresAt:
          type: string
          format: date-time
          description: Required for `expires`; refused for `explicit-clear-required`.
        affectedCapabilities:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 160
        affectedDelegationClasses:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 160
        incidentReceiptId:
          type: string
          minLength: 1
          maxLength: 160

    EmergencyStopIssueResult:
      type: object
      required: [ok, stop, receipt]
      properties:
        ok:
          type: boolean
          enum: [true]
        stop:
          $ref: "#/components/schemas/EmergencyStop"
        receipt:
          $ref: "#/components/schemas/EmergencyReceipt"

    EmergencyStopClearRequest:
      type: object
      description: >
        src/lib/operator-agent.ts's `validateEmergencyStopClear`. Clearing succeeds only with a
        `healthy` health read whose `checkedAt` is no more than five minutes old and `complete`
        revocation coverage; anything else is a 409 refusal, not a 400.
      required: [stopId, confirmation, health, revocation]
      properties:
        stopId:
          type: string
          minLength: 1
          maxLength: 160
        confirmation:
          type: object
          description: An explicit human sign-off -- never inferred from a prior approval.
          required: [confirmedBy, confirmedAt]
          properties:
            confirmedBy:
              type: string
              minLength: 1
              maxLength: 160
            confirmedAt:
              type: string
              format: date-time
        health:
          type: object
          description: A fresh, authoritative health/preflight read.
          required: [source, status, checkedAt]
          properties:
            source:
              type: string
              minLength: 1
              maxLength: 160
            status:
              type: string
              enum: [healthy, degraded, unavailable]
            checkedAt:
              type: string
              format: date-time
        revocation:
          type: object
          required: [coverage]
          properties:
            coverage:
              type: string
              enum: [complete, partial, unavailable]

    EmergencyStopClearResult:
      type: object
      required: [ok, receipt]
      properties:
        ok:
          type: boolean
          enum: [true]
        receipt:
          $ref: "#/components/schemas/EmergencyReceipt"

    EmergencyStopClearRefusal:
      type: object
      required: [ok, code, receipt]
      properties:
        ok:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [already-cleared, confirmation-required, health-stale, health-not-healthy, revocation-source-partial, revocation-source-unavailable]
        receipt:
          $ref: "#/components/schemas/EmergencyReceipt"

    EmergencyStopStatusResult:
      type: object
      required: [active, source]
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyStop"
        source:
          type: string
          enum: [ledger]

    EmergencyStopAdmissionRefusal:
      type: object
      description: An action refused because an active emergency stop covers it; the receipt's `stopId` names the stop.
      required: [ok, error, code, receipt]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          enum: [emergency_stop_active]
        code:
          type: string
          enum: [emergency-stop-active]
        receipt:
          $ref: "#/components/schemas/EmergencyReceipt"

    OperatorAgentDelegationHandoffRequest:
      type: object
      description: >
        src/lib/operator-agent.ts's `validateDelegationHandoff`, then
        src/lib/automation-action.ts's `createDelegationEnvelope` (which also refuses a `sender`
        equal to the `recipient`). The recipient's acceptance may only narrow the envelope's
        capabilities; `humanApproval` is required for high, production, financial, credential and
        destructive risk.
      required: [envelope, acceptedCapabilities, action]
      properties:
        envelope:
          type: object
          required: [sender, recipient, principal, purpose, capabilities, audience, expiresAt]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 160
              description: Defaults to `dlg-<uuid>`.
            sender:
              type: string
              minLength: 1
              maxLength: 160
            recipient:
              type: string
              minLength: 1
              maxLength: 160
            principal:
              type: string
              minLength: 1
              maxLength: 160
            purpose:
              type: string
              minLength: 1
              maxLength: 500
            capabilities:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                minLength: 1
                maxLength: 160
            scope:
              type: object
              properties:
                repo:
                  type: string
                instance:
                  type: string
            audience:
              type: string
              minLength: 1
              maxLength: 160
            expiresAt:
              type: string
              format: date-time
            nonce:
              type: string
              minLength: 1
              maxLength: 160
              description: Defaults to `n-<uuid>`.
        acceptedCapabilities:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 160
        action:
          type: object
          required: [capability, nonce, risk]
          properties:
            capability:
              type: string
              minLength: 1
              maxLength: 160
            nonce:
              type: string
              minLength: 1
              maxLength: 160
            risk:
              type: string
              enum: [low, medium, high, production, financial, credential, destructive]
            humanApproval:
              type: object
              required: [approvedBy, approvedAt]
              properties:
                approvedBy:
                  type: string
                  minLength: 1
                  maxLength: 160
                approvedAt:
                  type: string
                  format: date-time

    DelegationReceipt:
      type: object
      description: >
        One bounded, attributable receipt for an executed or refused delegated use
        (src/lib/automation-action.ts's `DelegationReceipt`). Identity fields are capped at 200
        characters and `reason` at 240, each plus a trailing ellipsis when cut.
      required: [receiptId, envelopeId, capability, audience, actorIdentity, decidedAt, outcome, reason]
      properties:
        receiptId:
          type: string
        envelopeId:
          type: string
        parentReceiptId:
          type: string
        capability:
          type: string
        audience:
          type: string
        actorIdentity:
          type: string
        decidedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [executed, refused]
        code:
          $ref: "#/components/schemas/DelegationRefusalCode"
        reason:
          type: string

    DelegationRefusalCode:
      type: string
      description: Every reason a delegation step can be refused for (src/lib/automation-action.ts's `DelegationRefusalCode`).
      enum:
        - unknown-envelope
        - expired
        - revoked
        - parent-revoked
        - identity-mismatch
        - already-accepted
        - empty-acceptance
        - capability-widened
        - expiry-widened
        - not-accepted
        - wrong-audience
        - capability-not-accepted
        - replayed-nonce
        - human-gate-required
        - audit-unavailable

    OperatorAgentDelegationHandoffResult:
      type: object
      required: [ok, receipt]
      properties:
        ok:
          type: boolean
          enum: [true]
        receipt:
          $ref: "#/components/schemas/DelegationReceipt"

    OperatorAgentDelegationHandoffRefusal:
      type: object
      description: >
        A refused handoff, in one of two shapes: refused at the recipient's acceptance step
        (`stage: accept`, `code`, `detail`; no receipt), or refused at execution (`receipt`, whose
        `outcome` is `refused` and whose `code` names why).
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [false]
        stage:
          type: string
          enum: [accept]
        code:
          $ref: "#/components/schemas/DelegationRefusalCode"
        detail:
          type: string
        receipt:
          $ref: "#/components/schemas/DelegationReceipt"

    FollowUpQuietHours:
      type: object
      required: [timezone, start, end]
      properties:
        timezone:
          type: string
        start:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        end:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'

    FollowUpNotificationPolicy:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        quietHours:
          $ref: "#/components/schemas/FollowUpQuietHours"

    FollowUpCandidate:
      type: object
      required: [version, candidateId, sourceEvent, workstream, reason, freshness, deduplicationKey, maxAttempts, owner, createdAt]
      description: A bounded follow-up candidate. It must carry a deadline or dependency and exactly one next action or question.
      properties:
        version:
          type: string
          enum: [follow-up-policy-v1]
        candidateId:
          type: string
        sourceEvent:
          type: string
        workstream:
          type: string
        reason:
          type: string
        freshness:
          type: string
