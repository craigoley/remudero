openapi: 3.1.0
info:
  title: Remudero Daemon Service Surface
  version: 0.1.0
  description: >
    The daemon's ONE tailnet service surface (MASTER-PLAN §7A): REST + SSE,
    single port, bearer-scoped (read vs. write). No client gets a private
    backdoor -- packages/api-client is GENERATED from this document (see
    scripts/generate-api-client.mjs) and is the ONLY way any client talks to
    the daemon.


    v0 (W3-T1a, src/lib/service.ts) shipped the generic mechanism only: bearer
    read/write scope enforcement, a shared JSON error envelope, and SSE
    framing, with `paths` intentionally empty -- no business route yet.

    W3-T2 (MASTER-PLAN §7, WS-5a -- the read-only live board) adds the first
    two: GET /v1/status (task/ledger-state snapshot) and GET /v1/status/stream
    (its SSE live-update companion), built on that same mechanism via
    src/lib/board.ts.

    W3-T5 (MASTER-PLAN §7 -- human-in-the-loop panel actions) adds the first
    write routes: POST /v1/control/{pause,resume,stop},
    POST /v1/questions/answer, and POST /v1/manual/approve, all write-scoped
    and built via src/lib/panel-actions.ts.

    W3-T6 (MASTER-PLAN §7B -- the plan->task->PR graph + interactive plan
    adjustment) adds GET /v1/feedback (the inbox), POST /v1/feedback (submit
    feedback / answer a grill, origin=ui), GET /v1/trace (the plan->task->PR
    provenance graph, W1-T43), and POST /v1/feedback/decision (accept/reject a
    proposal), all built via src/lib/panel-graph.ts.

    W3-T8 (MASTER-PLAN §5B/§7 -- panel skill actions) adds GET /v1/skills: the
    panel's action-button set, resolved fresh from `.remudero/skills/<name>.yaml`
    (the SAME registry `rmd skill list` reads, W1-T44) via src/lib/panel-skills.ts
    -- one button per registry entry, generated, never hard-coded. POST
    /v1/skills/run (src/lib/panel-skill-run.ts) invokes one: today `{ skill:
    "plan", mode: "clarify" }` (Refine) is wired, grounding via the real §5C task
    linter and parking a `grilling` feedback entry the existing GET/POST
    /v1/feedback (W3-T6) already renders inline and answers.

    Every route the daemon's OTHER surfaces still need (re-prioritize, ...) is
    registered by later tasks the same way -- this document is additive, never
    rewritten wholesale.

servers:
  - url: "https://{tailnetHost}"
    description: The daemon over Tailscale, one port for REST and SSE alike.
    variables:
      tailnetHost:
        default: localhost:4317

components:
  securitySchemes:
    bearerRead:
      type: http
      scheme: bearer
      description: >
        Read-scoped bearer token. Grants GET access to read-scoped routes and
        SSE streams. A write-scoped token also satisfies this scope (write is
        a superset of read).
    bearerWrite:
      type: http
      scheme: bearer
      description: >
        Write-scoped bearer token. Required for any route whose `scope` is
        `write` (src/lib/service.ts's `Scope`).
    bearerIngest:
      type: http
      scheme: bearer
      description: >
        W1-T4383 ingest-only bearer token (src/lib/service.ts's `ingestTokenProvider`). Grants
        exactly POST /v1/incidents/events and POST /v1/console/telemetry, and falls through to 401 on
        every other route.

  schemas:
    OperatorAgentAnswer:
      type: object
      description: Bounded read-only answer-v1; missing evidence is explicit and citations are dated.
      required: [version, repository, instance, lens, coverage, answer, citations, missingSources, generatedAt]
      properties:
        version: { type: string, enum: [answer-v1] }
        repository: { type: [string, "null"] }
        instance: { type: string }
        lens: { type: string, enum: [current-repository] }
        coverage: { type: string, enum: [verified, partial, unavailable, unsupported] }
        answer: { type: string, maxLength: 700 }
        generatedAt: { type: string, format: date-time }
        citations:
          type: array
          maxItems: 4
          items:
            type: object
            required: [sourceId, observedAt, freshness, label, value]
            properties:
              sourceId: { type: string }
              observedAt: { type: string, format: date-time }
              freshness: { type: string, enum: [verified, stale] }
              label: { type: string }
              value: { type: string }
        missingSources:
          type: array
          items:
            type: object
            required: [sourceId, reason]
            properties:
              sourceId: { type: string }
              reason: { type: string }
    OperatorAgentActionHandoffPreview:
      type: object
      description: >
        action-handoff-v1 preview (W1-T4559). Non-mutating; names the exact target, write tier,
        consequence, expiry, and recovery verb. The confirmationId is single-use and bound to the
        verified operator who prepared it.
      required: [version, confirmationId, intentId, verb, capability, target, tier, consequence, recovery, preparedAt, expiresAt, mutated, confirmation]
      properties:
        version: { type: string, enum: [action-handoff-v1] }
        confirmationId: { type: string }
        intentId: { type: string }
        verb: { type: string, enum: [fleet.pause, fleet.resume] }
        capability: { type: string }
        target:
          type: object
          required: [kind, instance, repository, state]
          properties:
            kind: { type: string, enum: [fleet-control] }
            instance: { type: string }
            repository: { type: string }
            state:
              type: object
              required: [paused, stopped]
              properties:
                paused: { type: boolean }
                stopped: { type: boolean }
        tier: { type: string, enum: [low, middle] }
        consequence:
          type: object
          required: [risk, reversible, summary]
          properties:
            risk: { type: string, enum: [low, medium] }
            reversible: { type: boolean }
            summary: { type: string }
        recovery:
          type: object
          required: [verb, capability, plan]
          properties:
            verb: { type: string }
            capability: { type: string }
            plan: { type: string }
        preparedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        mutated: { type: boolean }
        confirmation: { type: string, enum: [explicit-operator-confirmation-required] }
        existing: { type: boolean }

    OperatorAgentActionHandoffReceipt:
      type: object
      description: >
        The one attributable receipt for a claimed confirmation. `unresolved` means the external
        outcome is not certified; it is never a success and never an invitation to retry.
      required: [version, receiptId, confirmationId, intentId, verb, capability, instance, repository, actorHash, outcome, code, reason, at]
      properties:
        version: { type: string, enum: [action-handoff-v1] }
        receiptId: { type: string }
        confirmationId: { type: string }
        intentId: { type: string }
        verb: { type: string }
        capability: { type: string }
        instance: { type: string }
        repository: { type: string }
        actorHash: { type: string }
        outcome: { type: string, enum: [succeeded, refused, unresolved] }
        code: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }
        automationReceiptId: { type: string }
        evidenceRef: { type: string }

    OperatorAgentActionHandoffRefusal:
      type: object
      description: A typed refusal; no target was written. A replay names the one stored receipt.
      required: [version, outcome, code]
      properties:
        version: { type: string, enum: [action-handoff-v1] }
        outcome: { type: string, enum: [refused, unresolved] }
        code: { type: string }
        detail: { type: string }
        receipt: { $ref: "#/components/schemas/OperatorAgentActionHandoffReceipt" }

    InstanceUnavailable:
      type: object
      required: [error, status, instance, reason]
      properties:
        error: { type: string, enum: [instance_unavailable] }
        status: { type: string, enum: [unavailable] }
        instance: { type: string }
        reason: { type: string }
    Error:
      type: object
      description: >
        The JSON error envelope every non-2xx response on the surface
        returns (src/lib/service.ts's `sendJson` error paths).
      required:
        - error
      properties:
        error:
          type: string
          description: >
            `unauthorized` (401, no/unrecognized bearer token), `forbidden`
            (403, recognized token missing the required scope), `not_found`
            (404, no route registered for this method + path),
            `invalid_request` (400, a write route's JSON body failed
            validation -- W3-T5's panel-action routes fail loud BEFORE any
            side effect, src/lib/panel-actions.ts's `jsonAction`), or
            `internal_error` (500, the route handler threw).
          enum:
            - unauthorized
            - forbidden
            - not_found
            - invalid_request
            - internal_error
        required_scope:
          type: string
          description: Present only on a 403 -- the scope the caller's token was missing.
          enum:
            - read
            - write
        detail:
          type: string
          description: >
            W1-T4609 -- a human-readable reason accompanying `invalid_request` (400) and a
            route-level `not_found` (404); the service-level 401/403/404/500 envelopes omit it.
        required_tier:
          type: string
          description: >
            W1-T404 -- present only on a 403 refused for an insufficient WRITE TIER by
            src/lib/service.ts's dispatch gate, which `enforceWriteTiers` turns on and `rmd
            serve`'s production wiring sets (W1-T500). `low` (bookkeeping), `middle` (reversible
            but disruptive, or a spend force multiplier) or `high` (spends money or moves code)
            -- the tier the caller's credential was missing, alongside `required_scope: write`.
          enum:
            - low
            - middle
            - high

    StatusProjection:
      type: object
      description: >
        One task's projected merge-state, derived from GitHub (src/lib/status.ts's
        `StatusProjection` -- never written back to plan/tasks.yaml). This is the
        per-task "live state" the read-only board (W3-T2) renders.
      required:
        - taskId
        - status
        - merged
        - source
      properties:
        taskId:
          type: string
          description: The plan task id (plan/tasks.yaml's `id`).
        status:
          type: string
          description: Derived status label in the plan's vocabulary (src/lib/plan.ts's TaskStatus).
          enum:
            - queued
            - recon
            - prompted
            - running
            - review
            - fixing
            - diagnosing
            - blocked
            - merged
            - done
        merged:
          type: boolean
          description: The single fact dependency-gating cares about -- has this task landed?
        source:
          type: string
          description: Which precedence source resolved this projection (`none` if GitHub was read but had no evidence; `throttled` if GitHub could not be read at all).
          enum:
            - ledger
            - pr-field
            - trailer
            - correction
            - none
            - throttled
        prNumber:
          type: number
        prUrl:
          type: string
        prState:
          type: string
        rejected_candidates:
          type: array
          description: >
            Trailer search hits rejected by the ownership/anchor asserts, each with a
            machine-readable reason. Present only when a candidate was actually rejected.
          items:
            type: object
            required:
              - pr
              - reason
            properties:
              pr:
                type: string
              reason:
                type: string
        phase:
          type: string
          enum: [recon, implement, review, fix-rung]
        startedAt:
          type: string
          format: date-time
        elapsedMs:
          type: number
          minimum: 0
        workerState:
          type: string
          enum: [working, tool-executing, quiet]
        workerStateSince:
          type: string
          format: date-time
        workerTelemetry:
          type: object
          description: >
            Bounded worker observability. It names the active role/provider/model and the
            current or last tool, but never carries prompts, tool arguments, or tool output.
          properties:
            role:
              type: string
              enum: [recon, implementer, reviewer, fixer, triage, retro, unknown]
            provider:
              type: string
            requestedModel:
              type: string
            servedModel:
              type: string
            currentTool:
              type: string
            currentToolReason:
              type: string
            currentToolStartedAt:
              type: string
              format: date-time
            lastTool:
              type: object
              required: [name, durationMs, completedAt]
              properties:
                name:
                  type: string
                durationMs:
                  type: number
                  minimum: 0
                completedAt:
                  type: string
                  format: date-time
                outcome:
                  type: string
                  enum: [success, error]
            lastEventAt:
              type: string
              format: date-time
            lastEventKind:
              type: string
              enum: [working, tool-executing, message]
            firstSignalAt:
              type: string
              format: date-time
            firstSignalLatencyMs:
              type: number
              minimum: 0

    StatusSnapshot:
      type: object
      description: >
        GET /v1/status's body -- one StatusProjection per plan task, as of `generated_at`, plus
        (W1-T163, when the daemon's per-token last-seen marker store is wired) the calling
        token's own "since you last checked" recap.
      required:
        - generated_at
        - tasks
      properties:
        generated_at:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/StatusProjection"
        recap:
          type: array
          description: >
            W1-T163: every recap-worthy event (src/lib/recap.ts) after this token's PRIOR
            marker -- absent entirely on a daemon with no last-seen store wired; `[]` on this
            token's first-ever view (nothing to recap FROM).
          items:
            $ref: "#/components/schemas/RecapEvent"
        sinceCheckpoint:
          type: string
          description: >
            W1-T163: this token's marker value BEFORE this request advanced it -- the timestamp
            `recap` was computed as-of. Absent alongside `recap` for the same two reasons.
        github_unreachable:
          type: boolean
          description: True iff the GitHub read backing merge state was unreachable this snapshot.
        counts:
          $ref: "#/components/schemas/StatusCounts"
        spend:
          $ref: "#/components/schemas/GlanceSpend"
        blockedPrs:
          type: array
          description: >
            PRs the sweep disposed into a non-progressing class (src/lib/status-board.ts's
            `BlockedPrBlocker`), re-derived against live merge state every render.
          items:
            $ref: "#/components/schemas/BlockedPrRow"
        blockedPrsUnverifiedReason:
          type: string
          description: Set only when live GitHub state could not be checked; `blockedPrs` is then withheld (empty).
        mergeHeld:
          type: array
          description: The standing operator merge holds (src/lib/status-board.ts's `MergeHeldRow`).
          items:
            $ref: "#/components/schemas/MergeHeldRow"
        prQueue:
          $ref: "#/components/schemas/PrQueueSnapshot"
        modelApprovals:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleModelApproval"
        taskProjection:
          $ref: "#/components/schemas/ConsoleStatusTaskProjection"
        repairLadder:
          type: object
          description: >
            The provider repair ladder (src/lib/worker-provider.ts's `RepairLadderState`), spliced by
            src/lib/serve.ts's `withRepairLadder`. `running`, `unreadable` (with `reason`), or
            `stalled` (with the stall record's fields, which evolve with the ladder and are open here).
          required: [state]
          additionalProperties: true
          properties:
            state:
              type: string
              enum: [running, stalled, unreadable]
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    StatusCounts:
      type: object
      description: GET /v1/status's header counts (src/lib/board.ts's `CountSummary`), derived from the same `tasks`.
      required: [total, running, merged, queued, blocked, merged_known]
      properties:
        total: {type: integer}
        running: {type: integer}
        merged: {type: integer}
        queued: {type: integer}
        blocked: {type: integer}
        merged_known:
          type: boolean
          description: False when merge state's GitHub read was unreachable -- render unknown, not 0 merged.

    GlanceSpend:
      type: object
      description: The GLANCE strip totals (src/lib/glance.ts's `GlanceSpend`).
      required: [mergedToday, channel, spendTodayUsd, spendWeekUsd, sessionSpendUsd]
      properties:
        mergedToday: {type: integer}
        channel:
          type: string
          enum: [fleet]
        spendTodayUsd: {type: number}
        spendWeekUsd: {type: number}
        sessionSpendUsd:
          type: "null"
          description: Always null -- no ledger step records operator-session cost; null is unmeasured, never 0.

    BlockedPrRow:
      type: object
      required: [kind, prNumber, disposition, reason]
      properties:
        kind:
          type: string
          enum: [blocked_pr]
        taskId: {type: string}
        prNumber: {type: integer}
        prUrl: {type: string}
        disposition: {type: string}
        reason: {type: string}

    MergeHeldRow:
      type: object
      description: An operator merge hold. `prNumber` and `taskId` are absent for a fleet-scoped hold.
      required: [by, reason]
      properties:
        prNumber: {type: integer}
        taskId: {type: string}
        by: {type: string}
        reason: {type: string}

    PrQueueSnapshot:
      type: object
      description: >
        Every current open PR (src/lib/board.ts's `PrQueueSnapshot`). An unreadable or partial index
        is `complete: false` with no rows and an `unavailableReason`, never stale rows.
      required: [complete, rows]
      properties:
        complete: {type: boolean}
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PrQueueRow"
        unavailableReason: {type: string}
        lastGoodAt:
          type: string
          description: The newest prior complete queue this route cache held; absent until observed.

    PrQueueRow:
      type: object
      required: [prNumber, prUrl, title, disposition, reason, reviewState, queueClass, held, snapshotAt]
      properties:
        prNumber: {type: integer}
        prUrl: {type: string}
        title: {type: string}
        headRefName: {type: string}
        headSha: {type: string}
        taskId: {type: string}
        disposition: {type: string}
        reason: {type: string}
        reviewState:
          type: string
          enum: [success, failure, pending, none, unreadable, not-applicable]
        queueClass:
          type: string
          enum: [actionable, active, ready-held, waiting, unknown]
        held: {type: boolean}
        snapshotAt: {type: string}
        observedAt: {type: string}

    ConsoleModelApproval:
      type: object
      required: [model, approvedBy, approvedAt, expired]
      properties:
        model: {type: string}
        approvedBy: {type: string}
        approvedAt: {type: string}
        expiresAt: {type: string}
        expired: {type: boolean}

    ConsoleStatusTaskProjection:
      type: object
      description: >
        How much of the plan `tasks` carries (src/lib/serve.ts's `ConsoleStatusTaskProjection`): a
        truncated list says so, so an omitted task never reads as "no worker".
      required: [complete, total, returned, omitted, limit, reason]
      properties:
        complete: {type: boolean}
        total: {type: integer}
        returned: {type: integer}
        omitted: {type: integer}
        limit: {type: integer}
        reason: {type: string}

    RepoRunOutcomes:
      type: object
      description: >
        Trailing seven-day run outcomes from the de-duplicated ledger. `succeeded` counts tasks that
        took merge credit (`verdict.merged`, or a `verdict` of merged, already_satisfied or
        awaiting_merge). `failed` counts runs whose verdict is blocked_ci, blocked_review, no_pr,
        blocked_budget, error_max_budget_usd, blocked_illformed or failed. `superseded` counts such a
        failure whose task later took merge credit; it is in neither term of `errorrate`. Held,
        transient and re-queued verdicts (blocked_transient, blocked_containment, handed_off, ...)
        are in no count.
      required: [succeeded, failed, superseded]
      properties:
        succeeded: { type: integer }
        failed: { type: integer }
        superseded: { type: integer }

    RepoDashboardHealth:
      type: object
      description: >
        One repository's health. `status` is the MEASUREMENT state (`verified` = computed from a
        present ledger, `unknown` = no ledger); `condition` is the OPERATIONAL state, derived in this
        order: `unknown` (no ledger), `paused` (instance PAUSE or STOP flag), `down` (no `daemon.*`
        heartbeat within 30 min), `degraded` (an open incident, or more failed than succeeded runs),
        `idle` (no finished run in 7 days), else `healthy`. `reasons` names each signal that set it.
      required: [status, condition, reasons, queuedtasks, queued, errorrate, runs7d, last_run, alerts]
      properties:
        status:
          type: string
          enum: [verified, unknown]
        condition:
          type: string
          enum: [healthy, degraded, down, paused, idle, unknown]
        reasons:
          type: array
          items: { type: string }
        queuedtasks:
          type: [integer, "null"]
          description: Open plan tasks for the repository (not merged, done, retired or merge-credited).
        queued:
          type: [integer, "null"]
          description: The subset of `queuedtasks` whose plan status is `queued`.
        errorrate:
          type: [number, "null"]
          description: failed / (succeeded + failed) over `runs7d`; null when both are zero or there is no ledger.
        runs7d:
          oneOf:
            - $ref: "#/components/schemas/RepoRunOutcomes"
            - type: "null"
        last_run:
          type: [string, "null"]
          description: The newest verdict or merge-credit timestamp in the window.
        alerts:
          type: [array, "null"]
          description: >
            The operating instance's open incidents (incident-lifecycle.json records not `verified`,
            last seen in 7 days), newest first, at most 12. An empty array is a measured quiet fleet;
            null means this instance does not operate the repository or its incident store was
            unreadable (then `reasons` says which).
          items:
            type: string

    RepoSubscriptionWindow:
      type: object
      description: One provider usage window as the router last read it on a worker assignment. Account-wide, not per repository.
      required: [provider, window, percent_used, resets_at, observed_at]
      properties:
        provider: { type: string }
        window: { type: [string, "null"] }
        percent_used: { type: [number, "null"] }
        resets_at: { type: [string, "null"] }
        observed_at: { type: string }

    RepoSubscriptionUsage:
      type: object
      description: Subscription-billed calls are usage against provider windows, never dollars.
      required: [calls7d, tokens7d, windows]
      properties:
        calls7d: { type: integer }
        tokens7d: { type: number }
        windows:
          type: array
          items:
            $ref: "#/components/schemas/RepoSubscriptionWindow"

    RepoDashboardTelemetry:
      type: object
      description: >
        Trailing seven-day worker telemetry from the de-duplicated ledger; each call counts once (its
        `worker.attempt` receipt when the run wrote one, else the lane's own step row). `tokens7d` is
        input + output + cache-creation tokens; cache reads are `cache_read_tokens7d`. `cash_usd_7d`
        sums only `billing_mode: api` calls, and `cost_7d` is the same figure. `modelsused` is the
        provider-served models plus the canonical selected model of each assignment; a bare alias is
        never reported. Null fields mean there is no ledger.
      required: [measurementClass, tokens7d, cache_read_tokens7d, cash_usd_7d, cost_7d, subscription, modelsused]
      properties:
        measurementClass:
          type: string
          enum: [observed, not-collected]
        tokens7d:
          type: [number, "null"]
        cache_read_tokens7d:
          type: [number, "null"]
        cash_usd_7d:
          type: [number, "null"]
        cost_7d:
          type: [number, "null"]
        subscription:
          oneOf:
            - $ref: "#/components/schemas/RepoSubscriptionUsage"
            - type: "null"
        modelsused:
          type: [array, "null"]
          items:
            type: string

    RepoDashboardSettings:
      type: object
      description: >
        NOT COMPUTED: no config key holds a per-repository proof policy, worker pool size or alert
        threshold. Every field is always null; see `not_computed.settings`.
      required:
        - proofpolicy
        - workerpoolsize
        - alertthreshold
      properties:
        proofpolicy:
          type: "null"
        workerpoolsize:
          type: "null"
        alertthreshold:
          type: "null"

    RepoAction:
      type: object
      description: >
        One repository action. `path` is relative to the operating instance's `/v1/i/<instance>/`
        prefix: `toggleonoff` is POST control/pause or control/resume (write scope, chosen from the
        current flag), `viewlogs` is GET recent. `configure` and `test_run` are never available.
      required: [id, available]
      properties:
        id:
          type: string
          enum: [toggleonoff, viewlogs, configure, test_run]
        available: { type: boolean }
        method:
          type: string
          enum: [GET, POST]
        path: { type: string }
        scope:
          type: string
          enum: [read, write]
        reason: { type: string }

    RepoDashboardEntry:
      type: object
      description: >
        One repository from the instance registry or the validated `.remudero/managed-repos.json`
        set. The row whose instance serves this route is the OPERATING repository: it alone carries
        `active`, `alerts`, pause and heartbeat signals, and it also owns every ledger row that names
        no repository (that instance's gardeners, sweeps and fix lanes).
      required:
        - id
        - reponame
        - repourl
        - connected_at
        - active
        - managed
        - source
        - health
        - telemetry
        - settings
        - actions
        - not_computed
      properties:
        id:
          type: string
          description: Canonical `owner/repo` identity.
        reponame:
          type: string
          description: Repository name from the canonical identity.
        repourl:
          type: string
          description: Deterministic GitHub URL for the canonical identity; no GitHub read is implied.
        connected_at:
          type: "null"
          description: NOT COMPUTED; see `not_computed.connected_at`.
        active:
          type: [boolean, "null"]
          description: False when the operating instance is paused or stopped; null for any other row.
        managed:
          type: boolean
        source:
          type: string
          enum:
            - managed-repos
            - instance-registry
        health:
          $ref: "#/components/schemas/RepoDashboardHealth"
        telemetry:
          $ref: "#/components/schemas/RepoDashboardTelemetry"
        settings:
          $ref: "#/components/schemas/RepoDashboardSettings"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RepoAction"
        not_computed:
          type: object
          description: Why each never-computed field is null, so a consumer removes it instead of showing it as missing.
          required: [connected_at, settings]
          properties:
            connected_at: { type: string }
            settings: { type: string }

    RepoDashboardResult:
      type: object
      description: >
        GET /v1/repos's portfolio, or GET /v1/repos/summary's single operating repository. An empty
        `repos` array is a measured empty set; it is not an unavailable response. A cached read also
        carries `staleness`.
      required:
        - generated_at
        - source
        - repos
      properties:
        generated_at:
          type: string
        source:
          type: string
          enum:
            - managed-repos
            - instance-registry
            - instance-registry+managed-repos
        registry:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [verified, unavailable]
            reason: { type: string }
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RepoDashboardEntry"

    RegistryUnavailable:
      type: object
      description: >
        GET /v1/registry's 503 body (src/lib/serve.ts's `buildRegistryRoute`): the repo registry
        could not be read, or src/lib/instance-registry.ts's `parseInstanceRegistry` refused it.
        Path-free on purpose -- an fs error embeds the absolute path, so only a code is echoed.
        A dedicated refusal rather than a member of the shared Error enum, which a consumer
        switches over exhaustively (packages/daemon-client-smoke).
      required:
        - error
        - reason
      properties:
        error:
          type: string
          enum:
            - registry_unavailable
        reason:
          type: string
          description: >
            `unreadable` when the file could not be read, else the parser's
            `InstanceRegistryErrorCode` (`no_instances_block`, `malformed_line`,
            `duplicate_instance`, ...).

    RegistryResult:
      type: object
      description: >
        W1-T4227 -- GET /v1/registry: the fleet as projects -> repos -> instances, read from the
        one registry (`.remudero/daemon-instances.yaml`, src/lib/instance-registry.ts). It carries
        names, repos and instance prefixes ONLY -- never a path, state dir, credential dir, image
        or token. `drift` is present only when the host's copy is readable and names a different
        instance set; `hostRegistry` says how that comparison went.
      required:
        - projects
        - source
        - generatedAt
        - hostRegistry
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/RegistryProject"
        source:
          type: string
          enum:
            - repo
        generatedAt:
          type: string
        hostRegistry:
          type: string
          enum:
            - in_sync
            - drifted
            - unreadable
            - malformed
        drift:
          $ref: "#/components/schemas/RegistryDrift"

    RegistryProject:
      type: object
      required:
        - id
        - repos
      properties:
        id:
          type: string
          description: The project id; an instance that names none belongs to "default".
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RegistryRepo"

    RegistryRepo:
      type: object
      required:
        - repo
        - instances
      properties:
        repo:
          type: string
          description: owner/name on GitHub.
        instances:
          type: array
          items:
            $ref: "#/components/schemas/RegistryInstance"

    RegistryInstance:
      type: object
      required:
        - name
        - prefix
      properties:
        name:
          type: string
        prefix:
          type: string
          description: The `/v1/i/<name>` prefix the instance is reached under.

    RegistryDrift:
      type: object
      required:
        - hostOnly
        - repoOnly
      properties:
        hostOnly:
          type: array
          items:
            type: string
        repoOnly:
          type: array
          items:
            type: string

    RecapEvent:
      type: object
      description: >
        W1-T163 -- one "since you last checked" row (src/lib/recap.ts): a single ledger event
        after the caller's per-token marker.
      required:
        - kind
        - taskId
        - ts
      properties:
        kind:
          type: string
          enum:
            - merged
            - blocked
            - escalated
            - question_answered
            - retro
        taskId:
          type: string
          description: The originating ledger line's `task_id` verbatim -- `RETRO` for a fleet-wide retro event.
        ts:
          type: string
        detail:
          type: string
          description: A short human-readable detail (verdict string, escalation class, answer text, retro stats).
        title:
          type: string
          description: The plan task's own title -- present only when `taskId` names a real plan task.
        taskCardLink:
          type: string
          description: >
            A same-page `#task=<id>` hash link into the console's task card -- present ONLY
            when `taskId` names a real plan task (a fleet-wide event like `retro` has none).

    # ── W3-T5 (MASTER-PLAN §7, human-in-the-loop panel actions) -- request/result shapes for
    # the six write routes src/lib/panel-actions.ts registers. Every one is write-scoped and
    # ledgered with the caller's bearer as `origin` (src/lib/panel-actions.ts's `bearerTokenId`).
    PauseRequest:
      type: object
      description: POST /v1/control/pause's body -- drain-and-hold, an optional human-readable reason.
      properties:
        reason:
          type: string

    PauseResult:
      type: object
      required:
        - paused
      properties:
        paused:
          type: boolean
        reason:
          type:
            - string
            - "null"

    ResumeResult:
      type: object
      description: POST /v1/control/resume's body -- clears BOTH STOP and PAUSE; reports what it cleared.
      required:
        - clearedStop
        - clearedPause
      properties:
        clearedStop:
          type: boolean
        clearedPause:
          type: boolean

    StopRequest:
      type: object
      description: POST /v1/control/stop's body -- the hard kill, an optional human-readable reason.
      properties:
        reason:
          type: string

    StopResult:
      type: object
      required:
        - stopped
      properties:
        stopped:
          type: boolean
        reason:
          type:
            - string
            - "null"

    AssistantControlRequest:
      type: object
      description: A stable, exact-target assistant control request; retries MUST reuse the same actionId and payload.
      additionalProperties: false
      required: [actionId, instance, action]
      properties:
        actionId: { type: string, minLength: 8, maxLength: 128 }
        instance: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, enum: [pause, resume, stop] }
        reason: { type: string, maxLength: 200 }

    AssistantControlReceipt:
      type: object
      description: The first durable completion receipt; exact retries return this same object without re-dispatch.
      required: [status, actionId, instance, action, evidenceRef, result]
      properties:
        status: { type: string, enum: [completed] }
        actionId: { type: string }
        instance: { type: string }
        repository: { type: string, description: "Server-owned repository identity, including core when configured." }
        action: { type: string, enum: [pause, resume, stop] }
        evidenceRef: { type: string, description: "The reused panel-action ledger row." }
        result:
          oneOf:
            - $ref: "#/components/schemas/PauseResult"
            - $ref: "#/components/schemas/ResumeResult"
            - $ref: "#/components/schemas/StopResult"

    AssistantControlUnknown:
      type: object
      description: A durable claim exists, but the side-effect outcome is not certified; retry never dispatches again.
      required: [status, actionId, detail]
      properties:
        status: { type: string, enum: [unknown] }
        actionId: { type: string }
        detail: { type: string }

    AssistantControlCapability:
      type: object
      description: Read-only served contract. Writable filesystem metadata cannot prove cross-process or cross-host sharing.
      required: [contract, bootSha, instance, repository, admission, claimStore]
      properties:
        contract: { type: string, enum: [assistant-control-v2] }
        bootSha: { type: string }
        instance: { type: string }
        repository: { type: string }
        admission: { type: string, enum: [writable_unverified, uninitialized, unavailable] }
        claimStore: { type: string, enum: [shared_root_configured_topology_unverified] }

    AssistantControlLookup:
      type: object
      description: Nonterminal read-only lookup; completed actions return AssistantControlReceipt instead.
      required: [status, actionId]
      properties:
        status: { type: string, enum: [claimed_unknown, not_found, conflict, unavailable] }
        actionId: { type: string }
        detail: { type: string }

    AnswerQuestionRequest:
      type: object
      description: >
        POST /v1/questions/answer's body -- an operator's answer to a QUESTION-contract entry
        (worker.ts's plan/questions.ndjson), addressed by the task it was raised on (v0 routing
        has no path params, src/lib/service.ts).
      required:
        - taskId
        - answer
      properties:
        taskId:
          type: string
        answer:
          type: string

    AnswerQuestionResult:
      type: object
      required:
        - ok
        - taskId
        - answer
      properties:
        ok:
          type: boolean
        taskId:
          type: string
        answer:
          type: string

    ApproveManualRequest:
      type: object
      description: >
        POST /v1/manual/approve's body -- check off a MANUAL-queue item (MASTER-PLAN §4): closes
        the named `escalation-manual`-labeled GitHub issue (src/lib/escalate.ts).
      required:
        - taskId
        - issueUrl
      properties:
        taskId:
          type: string
        issueUrl:
          type: string

    ApproveManualResult:
      type: object
      required:
        - ok
        - taskId
        - issueUrl
      properties:
        ok:
          type: boolean
        taskId:
          type: string
        issueUrl:
          type: string

    PrActionRequest:
      type: object
      description: >
        A bounded operator request to run the established repair or review command against one
        pull request in this daemon instance. The request is recorded for the daemon's next poll;
        this HTTP route never starts a worker itself. The route is LOW tier (W1-T4077), so no
        confirmation nonce precedes this body.
      additionalProperties: false
      required:
        - action
        - prNumber
      properties:
        action:
          type: string
          enum:
            - fix
            - review
        prNumber:
          type: integer
          minimum: 1

    PrActionResult:
      type: object
      description: >
        Durable receipt only. `armed: true` means the selected daemon instance recorded the
        request; it does not claim that a worker has started or that the pull request is fixed.
      required:
        - armed
        - action
        - prNumber
        - requestedAt
      properties:
        armed:
          type: boolean
          const: true
        action:
          type: string
          enum:
            - fix
            - review
        prNumber:
          type: integer
        requestedAt:
          type: string
          format: date-time

    PrActionSwitchedOff:
      type: object
      description: >
        POST /v1/pr-actions' 409 body (src/lib/panel-actions.ts's `buildPrActionRoute`): the
        operator switched this action off on this daemon -- the marker
        `state/CONSOLE_PR_ACTION_OFF-<action>` exists (src/lib/fleet-control.ts's
        `isPrActionSwitchedOff`). Nothing was recorded but the `console.pr_action_switched_off`
        ledger row. A dedicated refusal rather than a member of the shared Error enum, which a
        consumer switches over exhaustively (packages/daemon-client-smoke).
      required:
        - error
        - detail
      properties:
        error:
          type: string
          enum:
            - switched_off
        detail:
          type: string
          description: Names the switched-off action and the marker file that switched it off.

    MarkEscalationHandledRequest:
      type: object
      description: >
        POST /v1/escalation/mark-handled's body (W1-T182) -- the NEEDS ME affordance an
        ESCALATION row (any class: BLOCKED/MANUAL/HARD_STOP/GRILL) actually supports, distinct
        from ApproveManualRequest's MANUAL-queue check-off: "approve" has no defined verb for an
        escalation. Closes the named `needs-human`-labeled GitHub issue (src/lib/escalate.ts);
        the name is deliberately "mark handled", not "approve" or "resolve" -- closing the issue
        does not, by itself, imply the underlying block is fixed. W1-T4677 requires a class and
        disposition so each class's acted-on precision can be measured; snoozedUntil is required
        only for snoozed_until.
      required:
        - taskId
        - issueUrl
        - class
        - disposition
      properties:
        taskId:
          type: string
        issueUrl:
          type: string
        class:
          type: string
          description: Escalation class used to group acted-on precision.
        disposition:
          type: string
          enum: [acted, false_positive, duplicate, snoozed_until]
        snoozedUntil:
          type: string
          description: Required exactly when disposition is snoozed_until.

    MarkEscalationHandledResult:
      type: object
      required:
        - ok
        - taskId
        - issueUrl
        - class
        - disposition
        - precision
        - tier
      properties:
        ok:
          type: boolean
        taskId:
          type: string
        issueUrl:
          type: string
        class:
          type: string
        disposition:
          type: string
          enum: [acted, false_positive, duplicate, snoozed_until]
        precision:
          type: [number, "null"]
        tier:
          type: string
          enum: [issue, digest, board]

    # ── W3-T6 (MASTER-PLAN §7B) -- the plan->task->PR graph + interactive plan adjustment:
    # submit feedback, answer grills, accept/reject a proposal. Built over the SAME feedback
    # inbox (src/lib/feedback.ts) and trace chain (src/lib/trace.ts, W1-T43) already documented
    # there; the four routes below are src/lib/panel-graph.ts's registrations.
    FeedbackEntry:
      type: object
      description: >
        One `plan/feedback/<id>.yaml` entry (src/lib/feedback.ts's `FeedbackEntry` -- the
        §7B schema shape: capture -> triage -> gate).
      required:
        - id
        - ts
        - raw
        - attachments
        - origin
        - status
        - proposal_pr
      properties:
        id:
          type: string
        ts:
          type: string
        raw:
          type: string
        attachments:
          type: array
          items:
            type: string
        origin:
          description: >
            src/lib/feedback.ts's `FeedbackOrigin`: a human capture method, or one of the
            machine-origin shapes `isValidFeedbackOrigin` admits (`issue#<n>`, W1-T57;
            `alert#<source>-<id>`, W1-T56; `repair#<surface>`, W1-T905; `incident#<sha256>`,
            W1-T4385) naming the source that produced the entry.
          oneOf:
            - type: string
              enum:
                - cli
                - ui
                - issue
            - type: string
              pattern: "^(issue#[0-9]+|alert#(code-scanning|dependabot|secret-scanning)-.+|repair#[a-z][a-z-]*|incident#[0-9a-f]{64})$"
        status:
          type: string
          description: >
            The lifecycle (new -> grilling -> proposed -> accepted/rejected), plus `answered`
            (W1-T2278): the terminal arm a `grilling` entry reaches once a reply names it, the
            same write that sets `answered_by`.
          enum:
            - new
            - grilling
            - proposed
            - accepted
            - rejected
            - answered
        reply_to:
          type:
            - string
            - "null"
          description: >
            W1-T2278 -- the `grilling` entry this entry answers, when captured through POST
            /v1/feedback's `replyTo`; null otherwise.
        answered_by:
          type:
            - string
            - "null"
          description: >
            W1-T2278 -- the reverse edge of `reply_to`: the id of the entry that answered this one,
            set in the same write that moves it to `answered`; null or absent otherwise.
        thread_id:
          type:
            - string
            - "null"
          description: >
            W1-T2496 -- the escalation thread this entry replies to, via POST
            /v1/escalation/reply; a different edge than `reply_to`. Null when none.
        submission_key:
          type:
            - string
            - "null"
          description: >
            W1-T2302 -- the console-minted per-submission key a repeat of the same submit is
            recognised by. Null when none was supplied.
        proposal_pr:
          type:
            - string
            - "null"
          description: Set once `rmd triage` opens a proposal PR for this entry; null until then.
        summary:
          type:
            - object
            - "null"
          description: >
            W1-T313 -- src/lib/feedback.ts's `DecisionSummary`, the plain-language decision card
            generated once when the entry moves to `proposed`; null until then or on a summarizer
            failure.
          required:
            - headline
            - what_happened
            - decision
            - options
          properties:
            headline:
              type: string
            what_happened:
              type: string
            decision:
              type: string
            options:
              type: array
              items:
                type: object
                required:
                  - label
                  - consequence
                properties:
                  label:
                    type: string
                  consequence:
                    type: string
        expansion:
          type:
            - object
            - "null"
          description: >
            W1-T350 -- src/lib/feedback.ts's `FeedbackExpansion`, attached at capture from the
            console's preview; null when no preview ran.
          required:
            - claim
            - evidence
            - recon
            - falsifying_check
          properties:
            claim:
              type: string
            evidence:
              type: string
            recon:
              type: array
              items:
                type: string
            falsifying_check:
              type: string
        upstream:
          type: object
          description: >
            W1-T397 -- present only when a home-repo pointer is configured and this checkout is not
            the home repo: whether the entry's upstream PR landed.
          required:
            - home
            - status
          properties:
            home:
              type: string
              description: "`owner/repo` of the configured home repo."
            status:
              type: string
              enum:
                - landed
                - unreachable
            pr_url:
              type: string
            error:
              type: string
        unverified:
          type: boolean
          description: >
            GET /v1/feedback only (W1-T257): true when this `proposed` entry's proposal_pr merge
            state could not be read (GitHub outage) -- the row is kept, never dropped. Never
            written to plan/feedback/<id>.yaml; a read-time decoration only.
        discharged:
          type: boolean
          description: >
            GET /v1/feedback only (W1-T1257): true when every task this entry filed
            (`origin: feedback#<id>`) is credited MERGED -- the work the proposal produced has
            shipped, even though `status` still names a decision about the proposal itself.
            Derived fresh on every read, like `unverified` above; never written to
            plan/feedback/<id>.yaml and never auto-advances `status` -- whether a discharged
            entry should advance stays a human call.
        dischargeUndecidable:
          type: boolean
          description: >
            GET /v1/feedback only (W1-T1257): true when `discharged` could not be determined
            because the merged-set read failed or was truncated -- a partial read, never
            mistaken for "not discharged". Mutually exclusive with `discharged`; a read-time
            decoration only, exactly like `unverified`.

    FeedbackInboxResult:
      type: object
      description: >
        GET /v1/feedback's body -- every captured feedback entry, oldest first. Served through the
        console read cache (src/lib/serve.ts's `boundConsoleReadRoute`), so `rmd serve` also
        splices in `staleness`; a cold or stalled cache answers `{entries: [], staleness}`. With
        `?limit=` or `?cursor=`, `entries` is one page and `page` says where the next one starts.
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackEntry"
        page:
          $ref: "#/components/schemas/ReadPage"
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    ReadPage:
      type: object
      description: >
        One page of a list read (src/lib/read-page.ts). Pass `nextCursor` back as `?cursor=` for
        the next page; its absence means this page is the last. The cursor names the last item
        served and its position, so an item that leaves the list between two reads never restarts
        the walk.
      required: [total, limit]
      properties:
        section:
          type: string
          description: GET /v1/inbox only -- the lane this page is from.
        total:
          type: integer
          description: Items in the whole list at the time of this read.
        limit:
          type: integer
        nextCursor:
          type: string

    InboxCounts:
      type: object
      description: >
        Every GET /v1/inbox lane's length, including the lanes a `?section=` read leaves out, so a
        badge or a tab count needs no second read.
      required: [ready, drafting, notReady, declined, fleet, needsYou]
      properties:
        ready: {type: integer}
        drafting: {type: integer}
        notReady: {type: integer}
        declined: {type: integer}
        fleet: {type: integer}
        needsYou:
          type: object
          required: [ready, drafting, notReady, declined]
          properties:
            ready: {type: integer}
            drafting: {type: integer}
            notReady: {type: integer}
            declined: {type: integer}

    InboxSectionResult:
      type: object
      description: >
        GET /v1/inbox?section=<name>'s body: that one lane under its own key, exactly as the whole
        body carries it (`needsYou` an object of four lanes, every other section one page of an
        array), plus `counts` and, for a list section, `page`.
      required: [counts]
      properties:
        ready:
          type: array
          items:
            $ref: "#/components/schemas/InboxReadyItem"
        drafting:
          type: array
          items:
            $ref: "#/components/schemas/InboxDraftingItem"
        notReady:
          type: array
          items:
            $ref: "#/components/schemas/InboxNotReadyItem"
        declined:
          type: array
          items:
            $ref: "#/components/schemas/InboxDeclinedItem"
        fleet:
          type: array
          items:
            $ref: "#/components/schemas/InboxFleetItem"
        needsYou:
          $ref: "#/components/schemas/InboxNeedsYou"
        counts:
          $ref: "#/components/schemas/InboxCounts"
        page:
          $ref: "#/components/schemas/ReadPage"
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    SubmitFeedbackRequest:
      type: object
      description: >
        POST /v1/feedback's body -- submit feedback from the panel (ALWAYS captured with
        origin: ui, never taken from this body). `replyTo`, if given, must name an existing
        entry parked `grilling` -- this is "answer a grill" v1 (src/lib/panel-graph.ts's header
        explains why): the answer is captured as a fresh feedback entry that re-enters triage,
        rather than a second, parallel answer-delivery primitive ahead of the still-unbuilt
        W1-T42 grill mechanics.
      required:
        - text
      properties:
        text:
          type: string
        attachments:
          type: array
          description: http(s) links ONLY -- a local file path would resolve against the daemon's own filesystem, not the operator's.
          items:
            type: string
        replyTo:
          type: string
          description: The `grilling` feedback id this submission answers, if any.

    SubmitFeedbackResult:
      type: object
      required:
        - ok
        - entry
      properties:
        ok:
          type: boolean
        entry:
          $ref: "#/components/schemas/FeedbackEntry"

    OperatorActivityItem:
      type: object
      description: One bounded activity, workstream, or authoritative artifact row.
      required:
        - id
        - kind
        - summary
        - source
        - observedAt
        - freshness
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - activity
            - workstream
            - artifact
        summary:
          type: string
        source:
          type: string
        observedAt:
          type: string
          format: date-time
        freshness:
          type: string
          enum:
            - verified
            - stale
            - unavailable
            - unknown
            - not-collected
        taskId:
          type: string
        repository:
          type: string
        state:
          type: string
          enum:
            - active
            - blocked
            - queued
            - completed
            - unknown
        reason:
          type: string
        href:
          type: string

    OperatorActivityResult:
      type: object
      description: GET /v1/operator-activity's bounded, source-labeled read projection.
      required:
        - version
        - state
        - source
        - observedAt
      properties:
        version:
          type: string
          enum:
