  /v1/action-results:
    get:
      summary: Read bounded external-effect reconciliation results.
      description: >
        Read-only external-action-results-v1 projection over daemon-owned, redacted
        external-effect receipts. The route never invokes a connector, accepts browser-owned
        measurements, or turns an unavailable ledger into an empty healthy result.
      security:
        - bearerRead: []
      parameters:
        - name: taskId
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: actionId
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Verified redacted results or an explicit unavailable source state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalActionResultsEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/feedback/decision:
