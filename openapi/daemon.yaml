      description: >
        The bounded per-case receipt submitted and persisted: whether the candidate and baseline
        agreed. The raw candidate/baseline outputs replayPromotion() computes are not part of the
        durable wire contract -- they may be arbitrarily large or unbounded -- so only the
        comparison result is recorded.
      properties:
        caseId:
          type: string
        matched:
          type: boolean

    PromotionReplaySummary:
      type: object
      required: [version, corpusSize, matched, mismatched, deterministic, sideEffectFree, results]
      properties:
        version:
          type: string
          enum: [experiment-promotion-v1]
        corpusSize:
          type: integer
          minimum: 1
        matched:
          type: integer
          minimum: 0
        mismatched:
          type: integer
          minimum: 0
        deterministic:
          type: boolean
        sideEffectFree:
          type: boolean
          enum: [true]
        results:
          type: array
          items:
            $ref: "#/components/schemas/PromotionReplayResult"

    PromotionGuardObservation:
      type: object
      required: [metricName, value, denominator, freshness, comparisonPopulation, observedAt]
      properties:
        metricName:
          type: string
        value:
          type: number
        denominator:
          type: integer
          minimum: 0
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        comparisonPopulation:
          type: string
        observedAt:
          type: string
          format: date-time

    PromotionGuardEvaluation:
      type: object
      required: [state, reasons, breachedMetrics]
      properties:
        state:
          type: string
          enum: [ready, unmeasurable, regressed]
        reasons:
          type: array
          items:
            type: string
        breachedMetrics:
          type: array
          items:
            type: string

    AssistantTrustControlResult:
      type: object
      description: >
        One control case (W1-T3882): a `positive` control proves the corpus is visible (a
        known-good case the candidate must pass); a `negative` control proves a restraint
        failure is detectable (a known-bad case the candidate must flag, never pass silently).
      required: [caseId, metricName, controlType, expectedOutcome, observedOutcome]
      properties:
        caseId:
          type: string
        metricName:
          type: string
          enum:
            - proactivity_precision
            - dropped_thread_recovery
            - clarification_burden
            - intervention_rate
            - unauthorized_side_effect_rate
            - stale_context_use
            - receipt_completeness
            - rollback_success
            - time_to_human_attention
        controlType:
          type: string
          enum: [positive, negative]
        expectedOutcome:
          type: string
          enum: [pass, flagged]
        observedOutcome:
          type: string
          enum: [pass, flagged]

    AssistantTrustEvidence:
      type: object
      description: >
        Restraint and recovery evidence (W1-T3882) that gates a promotion above the base
        guardrail evaluation: any unauthorized side effect, stale-context use, incomplete
        receipt, or failed rollback blocks promotion outright.
      required: [unauthorizedSideEffects, staleContextUses, receiptsComplete, rollbackAttempted, rollbackSucceeded]
      properties:
        unauthorizedSideEffects:
          type: integer
          minimum: 0
        staleContextUses:
          type: integer
          minimum: 0
        receiptsComplete:
          type: boolean
        rollbackAttempted:
          type: boolean
        rollbackSucceeded:
          type: boolean

    RawAssistantTrustContext:
      type: object
      description: >
        Raw material an evaluation MIGHT be handed — never persisted or trained on. Only bounded
        counts and a secret-scrubbed, length-capped note ever leave this boundary; see
        `AssistantTrustEvaluation.evidence`.
      properties:
        prompts:
          type: array
          maxItems: 200
          items:
            type: string
        transcripts:
          type: array
          maxItems: 200
          items:
            type: string
        credentials:
          type: array
          maxItems: 200
          items:
            type: string
        note:
          type: string

    RedactedAssistantTrustEvidence:
      type: object
      required: [promptCount, transcriptCount, credentialCount, note, redacted]
      properties:
        promptCount:
          type: integer
          minimum: 0
        transcriptCount:
          type: integer
          minimum: 0
        credentialCount:
          type: integer
          minimum: 0
        note:
          type: string
        redacted:
          type: boolean
          enum: [true]

    AssistantTrustEvaluation:
      type: object
      description: >
        The evaluation layer above `PromotionGuardEvaluation` (W1-T3882): a candidate may reach
        `ready` only when replay was deterministic and side-effect-free, the corpus carried
        working positive and negative controls, and no unauthorized side effect, stale-context
        use, incomplete receipt, or failed rollback was observed.
      required: [state, reasons, evidence]
      properties:
        state:
          type: string
          enum: [ready, unmeasurable, blocked]
        reasons:
          type: array
          items:
            type: string
        evidence:
          $ref: "#/components/schemas/RedactedAssistantTrustEvidence"

    OperatorAgentPromotionHistory:
      type: object
      required:
        - version
        - promotionId
        - candidate
        - baseline
        - scope
        - comparisonPopulation
        - denominatorFloor
        - observationWindow
        - guardMetrics
        - maxExposure
        - owner
        - expiresAt
        - rollback
        - createdAt
        - state
        - events
      properties:
        version:
          type: string
          enum: [experiment-promotion-v1]
        promotionId:
          type: string
        experimentId:
          type: string
        candidate:
          type: string
        baseline:
          type: string
        scope:
          $ref: "#/components/schemas/PromotionScope"
        comparisonPopulation:
          type: string
        denominatorFloor:
          type: integer
          minimum: 5
        observationWindow:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        guardMetrics:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromotionGuardMetric"
        maxExposure:
          type: number
          minimum: 0
          maximum: 1
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time
        rollback:
          $ref: "#/components/schemas/PromotionRollback"
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - proposed
            - replayed
            - approved
            - shadow
            - canary
            - observing
            - promoted
            - neutral
            - regressed
            - rolled_back
            - expired
            - unmeasurable
        events:
          type: array
          items:
            type: object
            required: [kind, at, state]
            properties:
              kind:
                type: string
                enum: [replay, decision, advance, rollback]
              at:
                type: string
                format: date-time
              state:
                type: string
              replay:
                $ref: "#/components/schemas/PromotionReplaySummary"
              decision:
                type: string
                enum: [approved]
              advance:
                type: object
                required: [target, guard]
                properties:
                  target:
                    type: string
                    enum: [shadow, canary, observing, promoted]
                  guard:
                    $ref: "#/components/schemas/PromotionGuardEvaluation"
                  exposure:
                    type: number
                  assistantTrust:
                    $ref: "#/components/schemas/AssistantTrustEvaluation"
              rollback:
                $ref: "#/components/schemas/PromotionRollback"
              note:
                type: string

    OperatorAgentPromotionList:
      type: object
      required: [promotions, source]
      properties:
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/OperatorAgentPromotionHistory"
        source:
          type: string
          enum: [ledger]

    OperatorAgentPromotionRegistration:
      type: object
      required: [promotion]
      properties:
        promotion:
          $ref: "#/components/schemas/PromotionRecord"

    OperatorAgentPromotionReplayRequest:
      type: object
      required: [promotionId, replay]
      properties:
        promotionId:
          type: string
        replay:
          $ref: "#/components/schemas/PromotionReplaySummary"

    OperatorAgentPromotionDecisionRequest:
      type: object
      required: [promotionId, decision]
      properties:
        promotionId:
          type: string
        decision:
          type: string
          enum: [approved]
        note:
          type: string

    OperatorAgentPromotionAdvanceRequest:
      type: object
      required: [promotionId, target]
      properties:
        promotionId:
          type: string
        target:
          type: string
          enum: [shadow, canary, observing, promoted]
        observations:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromotionGuardObservation"
        exposure:
          type: number
        assistantTrust:
          type: object
          description: >
            Optional assistant-trust evidence (W1-T3882). Its absence preserves the pre-W1-T3882
            base-guardrail-only advance behaviour exactly; when present, the response carries an
            `assistantTrust` evaluation and a `blocked`/`unmeasurable` result can demote an
            otherwise-ready advance to `regressed`/`unmeasurable`.
          required: [controls, evidence]
          properties:
            controls:
              type: array
              maxItems: 64
              items:
                $ref: "#/components/schemas/AssistantTrustControlResult"
            evidence:
              $ref: "#/components/schemas/AssistantTrustEvidence"
            rawContext:
              $ref: "#/components/schemas/RawAssistantTrustContext"

    OperatorAgentPromotionRollbackRequest:
      type: object
      required: [promotionId, rollback]
      properties:
        promotionId:
          type: string
        rollback:
          $ref: "#/components/schemas/PromotionRollback"

    OperatorAgentConsequenceAction:
      type: object
      required: [consequenceClass, target, requiredApprovers]
      properties:
        id:
          type: string
        consequenceClass:
          type: string
          enum: [reversible, disruptive, irreversible, financial]
        target:
          type: object
          required: [identity, source]
          properties:
            identity:
              type: string
            source:
              type: string
              enum: [trusted, external]
            ambiguous:
              type: boolean
        scope:
          type: object
          properties:
            repo:
              type: string
            instance:
              type: string
        evidence:
          type: array
          items:
            type: object
            required: [label, observedAt, maxAgeSeconds]
            properties:
              label:
                type: string
              observedAt:
                type: string
                format: date-time
              maxAgeSeconds:
                type: number
        financial:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
            perActionCeiling:
              type: number
            aggregateCeiling:
              type: number
            aggregateSpentBefore:
              type: number
            quoteExpiresAt:
              type: string
              format: date-time
            coolingOffSeconds:
              type: integer
            coolingOffStartedAt:
              type: string
              format: date-time
        irreversible:
          type: object
          properties:
            affectedResource:
              type: string
            recoveryAvailable:
              type: boolean
            recoveryStatement:
              type: string
            rollbackUnavailableReason:
              type: string
            confirmationNonce:
              type: string
            confirmationExpiresAt:
              type: string
              format: date-time
        requiredApprovers:
          type: integer
        approvals:
          type: array
          items:
            type: object
            required: [approverId, approvedAt, source]
            properties:
              approverId:
                type: string
              approvedAt:
                type: string
                format: date-time
              source:
                type: string
                enum: [trusted, external]
        capabilityGrant:
          type: object
          required: [grantId]
          properties:
            grantId:
              type: string

    OperatorAgentConsequencePreflightRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/OperatorAgentConsequenceAction"

    FollowUpQuietHours:
      type: object
      required: [timezone, start, end]
      properties:
        timezone:
          type: string
        start:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
        end:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'

    FollowUpNotificationPolicy:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        quietHours:
          $ref: "#/components/schemas/FollowUpQuietHours"

    FollowUpCandidate:
      type: object
      required: [version, candidateId, sourceEvent, workstream, reason, freshness, deduplicationKey, maxAttempts, owner, createdAt]
      description: A bounded follow-up candidate. It must carry a deadline or dependency and exactly one next action or question.
      properties:
        version:
          type: string
          enum: [follow-up-policy-v1]
        candidateId:
          type: string
        sourceEvent:
          type: string
        workstream:
          type: string
        reason:
          type: string
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        deadline:
          type: string
          format: date-time
        dependency:
          type: string
        quietHours:
          $ref: "#/components/schemas/FollowUpQuietHours"
        deduplicationKey:
          type: string
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 20
        owner:
          type: string
        nextAction:
          type: string
        nextQuestion:
          type: string
        createdAt:
          type: string
          format: date-time

    FollowUpEvaluation:
      type: object
      required: [version, candidateId, deduplicationKey, state, reason, at, attempts]
      properties:
        version:
          type: string
          enum: [follow-up-policy-v1]
        candidateId:
          type: string
        deduplicationKey:
          type: string
        state:
          type: string
          enum: [scheduled, eligible, snoozed, suppressed, asked, accepted, rejected, expired, blocked]
        reason:
          type: string
        at:
          type: string
          format: date-time
        attempts:
          type: integer
        nextAction:
          type: string
        nextQuestion:
          type: string

    FollowUpReceipt:
      type: object
      required: [delivered, systemActed, completed, permissionToAct, at]
      properties:
        delivered:
          type: boolean
        answered:
          type: boolean
        systemActed:
          type: boolean
        authority:
          type: string
        completed:
          type: boolean
          enum: [false]
        permissionToAct:
          type: boolean
        at:
          type: string
          format: date-time

    FollowUpHistory:
      type: object
      required: [version, candidateId, sourceEvent, workstream, reason, freshness, deduplicationKey, maxAttempts, owner, createdAt, state, attempts, events]
      properties:
        version:
          type: string
          enum: [follow-up-policy-v1]
        candidateId:
          type: string
        sourceEvent:
          type: string
        workstream:
          type: string
        reason:
          type: string
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        deadline:
          type: string
          format: date-time
        dependency:
          type: string
        quietHours:
          $ref: "#/components/schemas/FollowUpQuietHours"
        deduplicationKey:
          type: string
        maxAttempts:
          type: integer
        owner:
          type: string
        nextAction:
          type: string
        nextQuestion:
          type: string
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [scheduled, eligible, snoozed, suppressed, asked, accepted, rejected, expired, blocked]
        attempts:
          type: integer
        events:
          type: array
          items:
            type: object
        receipt:
          $ref: "#/components/schemas/FollowUpReceipt"
        notificationPolicy:
          $ref: "#/components/schemas/FollowUpNotificationPolicy"
        snoozedUntil:
          type: string
          format: date-time

    FollowUpList:
      type: object
      required: [followUps, source]
      properties:
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpHistory"
        source:
          type: string
          enum: [ledger]

    FollowUpEvaluationRequest:
      type: object
      required: [candidate]
      properties:
        candidate:
          $ref: "#/components/schemas/FollowUpCandidate"
        sourceTerminal:
          type: boolean
        dependencyAvailable:
          type: boolean
        notificationPolicy:
          $ref: "#/components/schemas/FollowUpNotificationPolicy"

    FollowUpControlRequest:
      type: object
      required: [candidateId, control]
      properties:
        candidateId:
          type: string
        control:
          type: string
          enum: [snooze, reject, revoke, policy]
        until:
          type: string
          format: date-time
        notificationPolicy:
          $ref: "#/components/schemas/FollowUpNotificationPolicy"

    FollowUpDeliveryRequest:
      type: object
      required: [candidateId]
      properties:
        candidateId:
          type: string
        answered:
          type: boolean
        systemActed:
          type: boolean
        authority:
          type: string

    # ── W3-T8 (MASTER-PLAN §5B/§7 -- panel skill actions) -- the button set
    # src/lib/panel-skills.ts's ONE route returns, resolved from
    # `.remudero/skills/<name>.yaml` (lib/skill.ts's `Skill`, W1-T44) the SAME
    # way `rmd skill list` does.
    SkillEntry:
      type: object
      description: >
        One `.remudero/skills/<name>.yaml` entry (lib/skill.ts's `Skill`) -- the panel button
        IS this registry entry (MASTER-PLAN §5B). `name` is the file's basename, never a
        `name:` field inside the body, so it can never drift from what `rmd skill list`
        reports it under.
      required:
        - name
        - tools
        - permission_profile
        - output_contract
        - grounding_sources
        - gate
        - tier
      properties:
        name:
          type: string
          description: The skill's identity -- its filename minus `.yaml`.
        tools:
          type: array
          items:
            type: string
        permission_profile:
          type: string
        output_contract:
          type: string
        grounding_sources:
          type: array
          items:
            type: string
        gate:
          type: string
        tier:
          type: string

    SkillsListResult:
      type: object
      description: >
        GET /v1/skills's body -- one SkillEntry per `.remudero/skills/<name>.yaml`, resolved
        fresh on every request (src/lib/panel-skills.ts).
      required:
        - skills
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillEntry"

    # ── W3-T8 round 2 (MASTER-PLAN §5B/§7) -- invoking a registry skill button. Today ONE
    # skill+mode is wired: { skill: "plan", mode: "clarify" }, the panel's "Refine" button
    # (src/lib/panel-skill-run.ts).
    RunSkillRequest:
      type: object
      description: >
        POST /v1/skills/run's body -- which registry skill to invoke, an optional mode, and
        (for `plan`/`clarify`, i.e. Refine) the plan task id it targets.
      required:
        - skill
      properties:
        skill:
          type: string
          description: A name present in the `.remudero/skills/<name>.yaml` registry (validated against GET /v1/skills's own source).
        mode:
          type: string
          description: 'The skill mode, e.g. "clarify" for Refine (§5B: plan is ONE skill, THREE MODES).'
        taskId:
          type: string
          description: The plan/tasks.yaml task id this invocation targets. Required for `plan`/`clarify` (Refine).

    RunSkillResult:
      type: object
      description: >
        POST /v1/skills/run's body -- the invoked skill echoed back plus the grill it parked.
        Today always carries a `grilling` `feedback` entry: Refine is the only wired skill/mode,
        and Refine always grills (grounds via the real §5C linter, never proposes outright).
      required:
        - ok
        - skill
        - taskId
        - feedback
      properties:
        ok:
          type: boolean
        skill:
          type: string
        mode:
          type: string
        taskId:
          type: string
        feedback:
          $ref: "#/components/schemas/FeedbackEntry"

    # ── W1-T3899 (external-effect-v1) — connector truth is separate from an action receipt. ──
    ExternalEffectPostcondition:
      type: object
      required: [path, equals]
      properties:
        path:
          type: string
        equals:
          description: JSON value expected at the connector path.
          type: object
          additionalProperties: true
        description:
          type: string

    ExternalEffect:
      type: object
      required:
        - version
        - originatingActionId
        - originatingReceiptId
        - capabilityGrantId
        - connector
        - targetIdentity
        - requestedOperation
        - preconditionSnapshot
        - expectedPostconditions
        - observation
        - idempotencyKey
        - reconciliationState
        - retryPath
        - evidenceReference
        - safeToComplete
      properties:
        version:
          type: string
          enum: [external-effect-v1]
        originatingActionId:
          type: string
        originatingReceiptId:
          type: string
        capabilityGrantId:
          type: string
        connector:
          type: string
        targetIdentity:
          type: string
        requestedOperation:
          type: string
        preconditionSnapshot:
          type: object
          additionalProperties: true
        expectedPostconditions:
          type: array
          items:
            $ref: "#/components/schemas/ExternalEffectPostcondition"
        observedState:
          type: object
          additionalProperties: true
        observation:
          type: object
          required: [status, maxAgeMs]
          properties:
            status:
              type: string
              enum: [fresh, stale, unavailable]
            observedAt:
              type: string
              format: date-time
            ageMs:
              type: number
            maxAgeMs:
              type: number
        idempotencyKey:
          type: string
        reconciliationState:
          type: string
          enum: [applied, refused, pending, partially-applied, drifted, stale, unobservable]
        partialSuccess:
          type: object
          required: [satisfied, unsatisfied]
          properties:
            satisfied:
              type: array
              items: { type: string }
            unsatisfied:
              type: array
              items: { type: string }
        retryPath:
          type: object
          required: [kind, allowed, reason]
          properties:
            kind:
              type: string
              enum: [none, retry, compensation]
            allowed:
              type: boolean
            reason:
              type: string
            attemptNumber:
              type: integer
        evidenceReference:
          type: string
          description: Opaque digest of redacted connector evidence; raw provider output is never stored.
        safeToComplete:
          type: boolean
        reason:
          type: string

    ProviderAuthProjection:
      type: object
      description: >
        The bounded provider-auth-v1 browser projection. Provider credentials, credential homes,
        raw app-server payloads, and transcripts never cross this boundary.
      required: [version, sessionId, provider, profileId, label, state, authUrl, expiresAt]
      properties:
        version:
          type: string
          enum: [provider-auth-v1]
        sessionId:
          type: string
        provider:
          type: string
          enum: [claude, codex]
        profileId:
          type: [string, "null"]
        label:
          type: [string, "null"]
        state:
          type: string
          enum: [unavailable, unsupported, awaiting_browser, complete, failed, expired, cancelled]
        authUrl:
          type: [string, "null"]
          format: uri
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string

    ProviderAuthStartRequest:
      type: object
      required: [provider, profileId]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [claude, codex]
        profileId:
          type: string
          description: Opaque server-configured provider profile id; never a credential or path.

    BenchmarkQualityCoverage:
      type: object
      additionalProperties: false
      required: [denominator, observed, noTerminal, notRecorded]
      properties:
        denominator: { type: integer }
        observed: { type: integer }
        noTerminal: { type: integer }
        notRecorded: { type: integer }

    BenchmarkQualityProjection:
      type: object
      additionalProperties: false
      description: >
        Internal evidence coverage, not a causal model score or public release. Local assignment
        and run identifiers are join keys only and never appear in this response. API request
        estimates and subscription notional amounts are separate; neither is an invoice.
      required: [version, state, asOf, latestSourceAt, sourceRows, assignments,
        joinedTerminalOutcomes, assignmentsWithoutTerminal, terminalsWithoutAssignment,
        duplicates, outcomes, modelEvidence, experimentalCrossover, coverage, accounting]
      properties:
        version: { type: string, enum: [benchmark-quality-v1] }
        state: { type: string, enum: [observed, unavailable] }
        reason: { type: string }
        asOf: { type: [string, "null"] }
        latestSourceAt: { type: [string, "null"] }
        sourceRows:
          type: object
          required: [assignments, terminals, invalidAssignments, terminalsWithoutAssignmentId]
          properties:
            assignments: { type: integer }
            terminals: { type: integer }
            invalidAssignments: { type: integer }
            terminalsWithoutAssignmentId: { type: integer }
        assignments: { type: integer }
        joinedTerminalOutcomes: { type: integer }
        assignmentsWithoutTerminal: { type: integer }
        terminalsWithoutAssignment: { type: integer }
        duplicates:
          type: object
          required: [assignmentRows, terminalRows]
          properties:
            assignmentRows: { type: integer }
            terminalRows: { type: integer }
        outcomes:
          type: object
          required: [success, failure, unavailable]
          properties:
            success: { type: integer }
            failure: { type: integer }
            unavailable: { type: integer }
        modelEvidence:
          type: object
          required: [requestedDifferentFromSelected, servedDifferentFromSelected]
          properties:
            requestedDifferentFromSelected: { type: integer }
            servedDifferentFromSelected: { type: integer }
        experimentalCrossover: { type: string, enum: [unavailable-no-random-allocation-receipt] }
        coverage:
          type: object
          required: [taskClass, risk, requestedModel, selectedModel, provider, effort,
            outcome, servedModel, tokens, duration, billingMode, cost]
          properties:
            taskClass: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            risk: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            requestedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            selectedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            provider: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            effort: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            outcome: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            servedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            tokens: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            duration: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            billingMode: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            cost: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
        accounting:
          type: object
          required: [source, apiRequestsWithCost, apiRequestCostUsd,
            subscriptionCallsWithNotionalCost, subscriptionNotionalCostUsd, unclassifiedCostRows]
          properties:
            source: { type: string, enum: [worker-result-estimate-not-invoice] }
            apiRequestsWithCost: { type: integer }
            apiRequestCostUsd: { type: number }
            subscriptionCallsWithNotionalCost: { type: integer }
            subscriptionNotionalCostUsd: { type: number }
            unclassifiedCostRows: { type: integer }

  responses:
    Unauthorized:
      description: No or unrecognized bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: A recognized token whose granted scope does not cover this route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No route registered for this method + path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: The JSON body failed validation -- no side effect occurred (src/lib/panel-actions.ts's `jsonAction`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested proposal transition conflicts with the durable ledger state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# W3-T2 (MASTER-PLAN §7, WS-5a): the read-only live board's first real business routes --
# a task/ledger-state snapshot (REST) and its live-update companion (SSE). Both are built on
# the v0 mechanism above (src/lib/service.ts) and existing projection logic (src/lib/status.ts)
# -- see src/lib/board.ts. Every OTHER route the design (plan render, worker stream tails,
# DECISIONS feed, escalation inbox, question backlog, cost meter) describes is explicit
# follow-on work, not added here.
paths:
  /v1/analytics:
    get:
      summary: Read the internal benchmark evidence-quality projection.
      description: >
        This operation documents the benchmark-quality-v1 query only. The legacy full and
        console analytics projections remain available on the same route. Missing evidence is
        explicit; this endpoint performs no ledger scan, public upload, or routing change.
      parameters:
        - name: projectionVersion
          in: query
          required: true
          schema: { type: string, enum: [benchmark-quality-v1] }
      security:
        - bearerRead: []
      responses:
        "200":
          description: A versioned aggregate of retained evidence quality.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkQualityProjection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/provider-auth:
    post:
      summary: Start a server-owned provider browser-auth handoff.
      description: >
        Starts provider-auth-v1 for an opaque server-configured account profile. Codex uses the
        daemon-side app-server login flow and returns only an allowlisted browser authorization URL;
        Claude remains explicitly unsupported until a stable machine-facing handoff exists.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAuthStartRequest"
      responses:
        "200":
          description: The initial bounded session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      summary: Read a provider-auth-v1 session projection.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      security:
        - bearerRead: []
      responses:
        "200":
          description: The current bounded session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Cancel a provider-auth-v1 session.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      security:
        - bearerWrite: []
      responses:
        "200":
          description: The cancelled session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/repos:
    get:
      summary: The read-only managed-repo portfolio for the console dashboard.
      description: >
        Reads and validates `.remudero/managed-repos.json` (src/lib/managed-repos.ts). The
        endpoint reports repository identity only; OAuth connection, activation, health,
        telemetry, settings, logs, and test-run state remain explicitly unknown until they have
        durable daemon sources.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The validated managed-repo portfolio, including an honest empty result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDashboardResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/registry:
    get:
      summary: The fleet's one registry -- projects, repos and instances, read-only.
      description: >
        W1-T4227. Parses `.remudero/daemon-instances.yaml` (parseInstanceRegistry) and reports
        drift against the fleet host's `/etc/remudero/daemon-instances.yaml` when that copy is
        readable. An unreadable or malformed host copy is a `hostRegistry` note, never an error.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The registry projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The repo registry could not be read or was refused by the parser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/status:
    get:
      summary: The current board snapshot -- one StatusProjection per plan task.
      description: >
        Read-only live board (MASTER-PLAN §7, WS-5a -> W3-T2): the task-DAG live-state
        projection, computed via src/lib/status.ts's `projectPlan` over the current plan +
        ledger + GitHub (src/lib/board.ts's `computeBoardSnapshot`).
      security:
        - bearerRead: []
      responses:
        "200":
          description: The current board snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── W3-T5 (MASTER-PLAN §7, human-in-the-loop panel actions) -- write routes over the SAME
  # v0 mechanism (src/lib/service.ts), all write-scoped, all built by src/lib/panel-actions.ts.
  # Depends on W3-T2's board existing (the panel acts on what the board shows). Every write
  # is ledgered with the caller's bearer as `origin`, never the raw token (see
  # src/lib/panel-actions.ts's header). Real `rmd serve` CLI wiring is later work, same split
  # W3-T2's routes below already document.
  /v1/control/pause:
    post:
      summary: Pause the fleet (drain-and-hold) -- no new spawns; an in-flight task still finishes.
      description: >
        MASTER-PLAN §4A/§4B: writes the PAUSE flag (src/lib/fleet-control.ts's `requestPause`),
        checked at the top of every drain tick. Ledgers `panel.pause_requested`.
      security:
        - bearerWrite: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseRequest"
      responses:
        "200":
          description: PAUSE is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PauseResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/control/resume:
    post:
      summary: Resume the fleet -- clears BOTH STOP and PAUSE.
      description: >
        MASTER-PLAN §4A: the one command that always means go (src/lib/fleet-control.ts's
        `resumeFleet`). Ledgers `panel.resume_requested`. No request body.
      security:
        - bearerWrite: []
      responses:
        "200":
          description: STOP and PAUSE are both cleared (whichever were set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/control/stop:
    post:
      summary: STOP the fleet -- the hard kill, checked first, every tick.
      description: >
        MASTER-PLAN §4A/§4B: writes the STOP flag (src/lib/fleet-control.ts's `requestStop`),
        checked before PAUSE and before picking up any new task. "STOP from the panel halts the
        fleet within one tick" (W3-T5 acceptance) -- the SAME predicate drain.ts's loop already
        checks first. Ledgers `panel.stop_requested`.
      security:
        - bearerWrite: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          description: STOP is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/questions/answer:
    post:
      summary: Answer a QUESTION-contract entry (MASTER-PLAN §2), attributed to the panel's bearer.
      description: >
        "An escalation answered FROM the panel appears in the ledger with the panel's bearer
        token as origin; the answer flows to the Architect" (W3-T5 acceptance) -- proof is the
        resulting `panel.question_answered` ledger line (src/lib/panel-actions.ts).
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionRequest"
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerQuestionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/manual/approve:
    post:
      summary: Approve (check off) a MANUAL-queue item -- closes its GitHub issue.
      description: >
        MASTER-PLAN §4: "the MANUAL queue doubles as the human's to-do list -- rendered in the
        control panel with check-off (= closing the issue)." Closes the named
        `escalation-manual`-labeled issue (src/lib/escalate.ts) FIRST, then ledgers
        `panel.manual_approved` -- a close that fails never produces a false-approved ledger line.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveManualRequest"
      responses:
        "200":
          description: The issue was closed and the approval recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveManualResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/pr-actions:
    post:
      summary: Queue one confirmed pull-request repair or review in this daemon instance.
      description: >
        W1-T3989: the console can request `fix` for an actionable red PR or `review` for a
        green PR waiting only for Remudero review. This is a HIGH-tier, exact-payload-confirmed
        action. The handler writes durable intent and returns immediately; the daemon consumes at
        most one request per poll through its existing `rmd fix` or `rmd review` command path.
        A successful receipt is intentionally not a worker-start or PR-success claim.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrActionRequest"
      responses:
        "200":
          description: The selected daemon instance recorded a request for its next poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrActionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing write authority or the required high-tier confirmation nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/escalation/mark-handled:
    post:
      summary: Mark an ESCALATION row handled -- closes its GitHub issue.
      description: >
        W1-T182: the NEEDS ME affordance an ESCALATION row (any class) actually supports --
        distinct from /v1/manual/approve's MANUAL-queue check-off, since "approve" has no
        defined verb for an escalation. Closes the named `needs-human`-labeled issue
        (src/lib/escalate.ts) FIRST, then ledgers `panel.escalation_marked_handled` -- a close
        that fails never produces a false-handled ledger line. Closing the issue does not, by
        itself, resolve the underlying block (the issue body says so); the row clears on the
        NEXT poll once GET /v1/status's live join (src/lib/status.ts) reads it CLOSED.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkEscalationHandledRequest"
      responses:
        "200":
          description: The issue was closed and the action recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkEscalationHandledResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── W3-T6 (MASTER-PLAN §7B) -- the plan->task->PR graph + interactive plan adjustment, over
  # the SAME v0 mechanism (src/lib/service.ts), built by src/lib/panel-graph.ts. Depends on
  # W3-T2's board (the panel this extends) and W1-T43's trace chain (src/lib/trace.ts). Every
  # write is ledgered with the caller's bearer as `origin`, via the SAME `appendPanelLedger`
  # primitive W3-T5's routes use. Real `rmd serve` CLI wiring is later work, same split every
  # route on this surface already documents.
  /v1/feedback:
    get:
      summary: The feedback inbox -- every captured entry, oldest first.
      description: >
        `plan/feedback/` (MASTER-PLAN §7B, W1-T40), listed via src/lib/feedback.ts's
        `listFeedback`. Optional `?status=` filters to one lifecycle status.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackInboxResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Submit feedback from the panel -- ALWAYS captured with origin=ui.
      description: >
        "feedback submitted from the panel appears in the inbox with origin=ui and produces a
        proposal PR" (W3-T6 acceptance) -- captures via src/lib/feedback.ts's `captureFeedback`,
        ledgers `panel.feedback_submitted`. `replyTo` doubles this route as "answer a grill" v1
        (src/lib/panel-graph.ts's header).
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackRequest"
      responses:
        "200":
          description: The captured entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFeedbackResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/trace:
    get:
      summary: The plan->task->PR provenance graph for one task or feedback id.
      description: >
        "the panel renders the plan→task→PR graph" (W3-T6 acceptance) -- the SAME two-entry-
        point chain `rmd trace <id>` renders (W1-T43, src/lib/trace.ts), addressed by
        `?id=<task-id-or-feedback-id>` (v0 routing has no path params, src/lib/service.ts).
      security:
        - bearerRead: []
      responses:
        "200":
          description: The provenance chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator-activity:
    get:
      summary: Read the bounded operator activity, workstream, and artifact projection.
      description: >
        Read-only operator-activity-v2 composition over the existing ledger, plan projection,
        dispatcher frontier, and authoritative trace links. The response never contains raw
        prompts, transcripts, credentials, account identifiers, or browser-owned measurements.
        Unavailable and unknown source states remain explicit rather than becoming empty healthy data.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Operator activity projection, including explicit non-verified states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorActivityResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/action-results:
    get:
      summary: Read bounded external-effect reconciliation results.
      description: >
        Read-only external-action-results-v1 projection over daemon-owned, redacted
        external-effect receipts. The route never invokes a connector, accepts browser-owned
        measurements, or turns an unavailable ledger into an empty healthy result.
      security:
        - bearerRead: []
      parameters:
        - name: taskId
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: actionId
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Verified redacted results or an explicit unavailable source state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalActionResultsEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/feedback/decision:
    post:
      summary: Accept or reject a `proposed` feedback entry.
      description: >
        "accepting a proposal from the panel is ledgered with the panel bearer as origin"
        (W3-T6 acceptance) -- src/lib/feedback.ts's `setFeedbackStatus`, ledgers
        `panel.proposal_accepted`/`panel.proposal_rejected`. Only a `proposed` entry may be
        decided (400 otherwise).
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalDecisionRequest"
      responses:
        "200":
          description: The decision was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecisionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator-agent/context:
    get:
      summary: Read the metadata-only personal context inventory.
      description: >
        Reads context-item-v1 envelopes from the ledger union, including rotated records. The
        response excludes raw private content and reports stale or unavailable derived context.
      security:
        - bearerRead: []
      parameters:
        - name: purpose
          in: query
          required: false
          schema:
            type: string
        - name: authorityRef
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Metadata-only context inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register one bounded context-item-v1 envelope.
      description: Records provenance, purpose, authority, retention, visibility, and derivation links before use.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRegistration"
      responses:
        "201":
          description: Context item registered; the response is metadata-only.
        "200":
          description: Identical context item already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/context/revoke:
    post:
      summary: Revoke a context item and its derived dependants.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextActionRequest"
      responses:
        "200":
          description: Bounded revocation receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/context/delete:
