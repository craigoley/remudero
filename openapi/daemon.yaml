          type: string
          format: date-time

    FollowUpList:
      type: object
      required: [followUps, source]
      properties:
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpHistory"
        source:
          type: string
          enum: [ledger]

    # ── W3-T8 (MASTER-PLAN §5B/§7 -- panel skill actions) -- the button set
    # src/lib/panel-skills.ts's ONE route returns, resolved from
    # `.remudero/skills/<name>.yaml` (lib/skill.ts's `Skill`, W1-T44) the SAME
    # way `rmd skill list` does.
    SkillEntry:
      type: object
      description: >
        One `.remudero/skills/<name>.yaml` entry (lib/skill.ts's `Skill`) -- the panel button
        IS this registry entry (MASTER-PLAN §5B). `name` is the file's basename, never a
        `name:` field inside the body, so it can never drift from what `rmd skill list`
        reports it under.
      required:
        - name
        - tools
        - permission_profile
        - output_contract
        - grounding_sources
        - gate
        - tier
      properties:
        name:
          type: string
          description: The skill's identity -- its filename minus `.yaml`.
        tools:
          type: array
          items:
            type: string
        permission_profile:
          type: string
        output_contract:
          type: string
        grounding_sources:
          type: array
          items:
            type: string
        gate:
          type: string
        tier:
          type: string

    SkillsListResult:
      type: object
      description: >
        GET /v1/skills's body -- one SkillEntry per `.remudero/skills/<name>.yaml`, resolved
        fresh on every request (src/lib/panel-skills.ts).
      required:
        - skills
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillEntry"

    # ── W3-T8 round 2 (MASTER-PLAN §5B/§7) -- invoking a registry skill button. Today ONE
    # skill+mode is wired: { skill: "plan", mode: "clarify" }, the panel's "Refine" button
    # (src/lib/panel-skill-run.ts).
    RunSkillRequest:
      type: object
      description: >
        POST /v1/skills/run's body -- which registry skill to invoke, an optional mode, and
        (for `plan`/`clarify`, i.e. Refine) the plan task id it targets.
      required:
        - skill
      properties:
        skill:
          type: string
          description: A name present in the `.remudero/skills/<name>.yaml` registry (validated against GET /v1/skills's own source).
        mode:
          type: string
          description: 'The skill mode, e.g. "clarify" for Refine (§5B: plan is ONE skill, THREE MODES).'
        taskId:
          type: string
          description: The plan/tasks.yaml task id this invocation targets. Required for `plan`/`clarify` (Refine).

    RunSkillResult:
      type: object
      description: >
        POST /v1/skills/run's body -- the invoked skill echoed back plus the grill it parked.
        Today always carries a `grilling` `feedback` entry: Refine is the only wired skill/mode,
        and Refine always grills (grounds via the real §5C linter, never proposes outright).
      required:
        - ok
        - skill
        - taskId
        - feedback
      properties:
        ok:
          type: boolean
        skill:
          type: string
        mode:
          type: string
        taskId:
          type: string
        feedback:
          $ref: "#/components/schemas/FeedbackEntry"

    # ── W1-T3899 (external-effect-v1) — connector truth is separate from an action receipt. ──
    ExternalEffectPostcondition:
      type: object
      required: [path, equals]
      properties:
        path:
          type: string
        equals:
          description: JSON value expected at the connector path.
          type: object
          additionalProperties: true
        description:
          type: string

    ExternalEffect:
      type: object
      required:
        - version
        - originatingActionId
        - originatingReceiptId
        - capabilityGrantId
        - connector
        - targetIdentity
        - requestedOperation
        - preconditionSnapshot
        - expectedPostconditions
        - observation
        - idempotencyKey
        - reconciliationState
        - retryPath
        - evidenceReference
        - safeToComplete
      properties:
        version:
          type: string
          enum: [external-effect-v1]
        originatingActionId:
          type: string
        originatingReceiptId:
          type: string
        capabilityGrantId:
          type: string
        connector:
          type: string
        targetIdentity:
          type: string
        requestedOperation:
          type: string
        preconditionSnapshot:
          type: object
          additionalProperties: true
        expectedPostconditions:
          type: array
          items:
            $ref: "#/components/schemas/ExternalEffectPostcondition"
        observedState:
          type: object
          additionalProperties: true
        observation:
          type: object
          required: [status, maxAgeMs]
          properties:
            status:
              type: string
              enum: [fresh, stale, unavailable]
            observedAt:
              type: string
              format: date-time
            ageMs:
              type: number
            maxAgeMs:
              type: number
        idempotencyKey:
          type: string
        reconciliationState:
          type: string
          enum: [applied, refused, pending, partially-applied, drifted, stale, unobservable]
        partialSuccess:
          type: object
          required: [satisfied, unsatisfied]
          properties:
            satisfied:
              type: array
              items: { type: string }
            unsatisfied:
              type: array
              items: { type: string }
        retryPath:
          type: object
          required: [kind, allowed, reason]
          properties:
            kind:
              type: string
              enum: [none, retry, compensation]
            allowed:
              type: boolean
            reason:
              type: string
            attemptNumber:
              type: integer
        evidenceReference:
          type: string
          description: Opaque digest of redacted connector evidence; raw provider output is never stored.
        safeToComplete:
          type: boolean
        reason:
          type: string

    ProviderAuthProjection:
      type: object
      description: >
        The bounded provider-auth-v1 browser projection. Provider credentials, credential homes,
        raw app-server payloads, and transcripts never cross this boundary.
      required: [version, sessionId, provider, profileId, label, state, authUrl, expiresAt]
      properties:
        version:
          type: string
          enum: [provider-auth-v1]
        sessionId:
          type: string
        provider:
          type: string
          enum: [claude, codex]
        profileId:
          type: [string, "null"]
        label:
          type: [string, "null"]
        state:
          type: string
          enum: [unavailable, unsupported, awaiting_browser, complete, failed, expired, cancelled]
        authUrl:
          type: [string, "null"]
          format: uri
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string

    ProviderAuthStartRequest:
      type: object
      required: [provider, profileId]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [claude, codex]
        profileId:
          type: string
          description: Opaque server-configured provider profile id; never a credential or path.

    BenchmarkQualityCoverage:
      type: object
      additionalProperties: false
      required: [denominator, observed, noTerminal, notRecorded]
      properties:
        denominator: { type: integer }
        observed: { type: integer }
        noTerminal: { type: integer }
        notRecorded: { type: integer }

    BenchmarkQualityProjection:
      type: object
      additionalProperties: false
      description: >
        Internal evidence coverage, not a causal model score or public release. Local assignment
        and run identifiers are join keys only and never appear in this response. API request
        estimates and subscription notional amounts are separate; neither is an invoice.
      required: [version, state, asOf, latestSourceAt, sourceRows, assignments,
        joinedTerminalOutcomes, assignmentsWithoutTerminal, terminalsWithoutAssignment,
        duplicates, outcomes, modelEvidence, experimentalCrossover, coverage, accounting]
      properties:
        version: { type: string, enum: [benchmark-quality-v1] }
        state: { type: string, enum: [observed, unavailable] }
        reason: { type: string }
        asOf: { type: [string, "null"] }
        latestSourceAt: { type: [string, "null"] }
        sourceRows:
          type: object
          required: [assignments, terminals, invalidAssignments, terminalsWithoutAssignmentId]
          properties:
            assignments: { type: integer }
            terminals: { type: integer }
            invalidAssignments: { type: integer }
            terminalsWithoutAssignmentId: { type: integer }
        assignments: { type: integer }
        joinedTerminalOutcomes: { type: integer }
        assignmentsWithoutTerminal: { type: integer }
        terminalsWithoutAssignment: { type: integer }
        duplicates:
          type: object
          required: [assignmentRows, terminalRows]
          properties:
            assignmentRows: { type: integer }
            terminalRows: { type: integer }
        outcomes:
          type: object
          required: [success, failure, unavailable]
          properties:
            success: { type: integer }
            failure: { type: integer }
            unavailable: { type: integer }
        modelEvidence:
          type: object
          required: [requestedDifferentFromSelected, servedDifferentFromSelected]
          properties:
            requestedDifferentFromSelected: { type: integer }
            servedDifferentFromSelected: { type: integer }
        experimentalCrossover: { type: string, enum: [unavailable-no-random-allocation-receipt] }
        coverage:
          type: object
          required: [taskClass, risk, requestedModel, selectedModel, provider, effort,
            outcome, servedModel, tokens, duration, billingMode, cost]
          properties:
            taskClass: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            risk: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            requestedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            selectedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            provider: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            effort: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            outcome: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            servedModel: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            tokens: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            duration: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            billingMode: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
            cost: { $ref: "#/components/schemas/BenchmarkQualityCoverage" }
        accounting:
          type: object
          required: [source, apiRequestsWithCost, apiRequestCostUsd,
            subscriptionCallsWithNotionalCost, subscriptionNotionalCostUsd, unclassifiedCostRows]
          properties:
            source: { type: string, enum: [worker-result-estimate-not-invoice] }
            apiRequestsWithCost: { type: integer }
            apiRequestCostUsd: { type: number }
            subscriptionCallsWithNotionalCost: { type: integer }
            subscriptionNotionalCostUsd: { type: number }
            unclassifiedCostRows: { type: integer }

    # ── W1-T4609: the payloads of fourteen routes the daemon served before this document declared
    # them. Each schema below is transcribed from the TypeScript type or builder the handler
    # actually serializes (named in its description); nothing here is a placeholder shape.

    ConsoleResponseStaleness:
      type: object
      description: >
        The data-status envelope the console read cache splices into every JSON object body a
        CACHED read route serves (src/lib/console-snapshot-cache.ts's `ConsoleResponseStaleness`,
        applied by src/lib/serve.ts's `boundConsoleReadRoute` to GET /v1/recent and GET
        /v1/daemon-health among others). The same facts ride the `x-rmd-cache-state`,
        `x-rmd-cache-age-ms` and `x-rmd-generated-at` response headers.
      required: [status, stale, ageMs, generatedAt, refreshing, budgetMs]
      properties:
        status:
          type: string
          enum: [fresh, stale, unavailable]
          description: >
            The body's own data-status. `unavailable` means no live computation has produced a
            snapshot yet and the body is the route's documented fallback.
        stale:
          type: boolean
        ageMs:
          type: [number, "null"]
          description: Milliseconds since the served snapshot was computed; null when none exists.
        generatedAt:
          type: [string, "null"]
          format: date-time
          description: When the served snapshot was computed; null when none exists.
        refreshing:
          type: boolean
          description: A background recomputation is in flight.
        budgetMs:
          type: number
          description: The request-path budget the cache waited before answering from a fallback.
        reason:
          type: string
          description: Why the snapshot is stale or unavailable, when a cause was observed.

    UsageWindowReading:
      type: object
      description: >
        One Claude usage window (src/lib/account-usage.ts's `UsageWindowReading`). An absent
        `percentUsed` means UNKNOWN, never 0.
      properties:
        percentUsed:
          type: number
        resetsAt:
          type: string

    AccountUsageSnapshot:
      type: object
      description: >
        GET /v1/account-usage's body (src/lib/account-usage.ts's `AccountUsageSnapshot`, built by
        `deriveAccountUsage`). Every value field is ABSENT, never zero, when its source could not
        be read. Identity fields come from `~/.claude.json`'s `oauthAccount` and never carry a
        credential.
      required: [governor, costGovernor, queueGovernor, measures]
      properties:
        accountEmail:
          type: string
        accountUuid:
          type: string
        accountOrg:
          type: string
        fiveHour:
          $ref: "#/components/schemas/UsageWindowReading"
        sevenDay:
          $ref: "#/components/schemas/UsageWindowReading"
        usageAsOf:
          type: string
          format: date-time
          description: The usage reading's own as-of. Absent iff `usageUnknownReason` is present.
        usageAgeMs:
          type: number
        usageUnknownReason:
          type: string
          enum: [unreadable, no-cache, account-mismatch, too-old]
          description: Why the usage windows are UNKNOWN; absent when the reading is good.
        creditState:
          type: string
          enum: [subscription, credits]
          description: Exactly one of `creditState` / `creditUnknownReason` is present.
        creditUnknownReason:
          type: string
          enum: [not-exposed, unrecognised-value]
        creditStateField:
          type: string
          description: Which `~/.claude.json` field the credit state was read from, when one was found.
        governor:
          type: string
          enum: [armed, telemetry-only, unknown]
          description: The headroom governor's posture per the newest `daemon.headroom` ledger line.
        governorAsOf:
          type: string
        governorAgeMs:
          type: number
        costGovernor:
          type: string
          enum: [deferred, unknown]
          description: >
            `deferred` only while a `daemon.cost_governor` line says dispatch is being held;
            absent evidence reads `unknown`, never healthy.
        costGovernorAsOf:
          type: string
        costGovernorAgeMs:
          type: number
        costGovernorObservedUsd:
          type: number
        costGovernorCeilingUsd:
          type: number
        queueGovernor:
          type: string
          enum: [deferred, unknown]
        queueGovernorAsOf:
          type: string
        queueGovernorAgeMs:
          type: number
        queueGovernorObservedOpenCount:
          type: number
        queueGovernorWipLimit:
          type: number
        dailyCostCeilingUsd:
          type: number
        dailyCostCeilingProvenance:
          type: string
          enum: [overridden, default, instance-share]
        dailyCostCeilingDefaultUsd:
          type: number
        dailyCostCeilingFallbackReason:
          type: string
        dailyCostCeilingAuditAsOf:
          type: string
        dailyCostCeilingAuditWho:
          type: string
        dailyCostCeilingAuditFromUsd:
          type: number
        dailyCostCeilingAuditToUsd:
          type: number
        dailyCostCeilingAuditEffectiveUsd:
          type: number
        measures:
          type: string
          description: The scope note carried in the payload so a render can never drop it.

    FleetControlStatus:
      type: object
      description: >
        GET /v1/control/status's body (src/lib/panel-actions.ts's `FleetControlStatus`): the
        Pause/Resume/STOP/quiet-hours button states derived from the fleet-control flag files,
        plus heartbeat evidence of whether the daemon is actually running.
      required: [paused, stopped, quietHours, daemonLiveReason]
      properties:
        paused:
          type: boolean
        pauseDetail:
          type: string
          description: Human-readable detail, present only while paused.
        stopped:
          type: boolean
        stopDetail:
          type: string
          description: Human-readable detail, present only while stopped.
        quietHours:
          type: boolean
        daemonLive:
          type: boolean
          description: >
            Whether a `daemon.*` heartbeat falls inside the liveness bound. OMITTED, never a
            fabricated false, when the ledger gives no evidence either way.
        daemonLiveReason:
          type: string
          enum: [fresh-poll, last-poll-stale, no-daemon-activity, ledger-empty, ledger-absent, ledger-unreadable]
          description: >
            The evidence behind `daemonLive`, always present. `fresh-poll` -> live; `last-poll-stale`
            and `no-daemon-activity` -> not live; `ledger-empty`, `ledger-absent` and
            `ledger-unreadable` -> `daemonLive` omitted.

    EventLoopLag:
      type: object
      description: The serve process's own event-loop delay over a rolling one-minute window (src/lib/daemon-health.ts's `EventLoopLag`).
      required: [p50Ms, p99Ms, maxMs, windowMs]
      properties:
        p50Ms:
          type: number
        p99Ms:
          type: number
        maxMs:
          type: number
        windowMs:
          type: number

    PressureReading:
      type: object
      description: One `/proc/pressure/<resource>` reading, percent of wall time (src/lib/daemon-health.ts's `PressureReading`).
      required: [someAvg10, someAvg60]
      properties:
        someAvg10:
          type: number
        someAvg60:
          type: number
        fullAvg10:
          type: number

    HostPressure:
      type: object
      description: >
        The host's PSI pressure per resource (src/lib/daemon-health.ts's `HostPressure`). A
        resource whose pressure file is absent or unparsable reads the literal `"unknown"`, never 0.
      required: [cpu, io, memory]
      properties:
        cpu:
          oneOf:
            - $ref: "#/components/schemas/PressureReading"
            - type: string
              enum: [unknown]
        io:
          oneOf:
            - $ref: "#/components/schemas/PressureReading"
            - type: string
              enum: [unknown]
        memory:
          oneOf:
            - $ref: "#/components/schemas/PressureReading"
            - type: string
              enum: [unknown]

    GatewayCheckoutState:
      type: object
      description: >
        The serve checkout's own freshness, the SAME reading the stale-code restart decision acts
        on (src/lib/daemon-health.ts's `GatewayCheckoutState`). Each field reads the literal
        `"unknown"` until it has been checked.
      required: [head, behindBy, dirty, checkedAt]
      properties:
        head:
          type: string
          description: The checkout's HEAD sha, or `unknown`.
        behindBy:
          oneOf:
            - type: integer
            - type: string
              enum: [unknown]
        dirty:
          oneOf:
            - type: boolean
            - type: string
              enum: [unknown]
        dirtyPaths:
          type: array
          items:
            type: string
        checkedAt:
          type: string
          description: ISO-8601 time of the check, or `unknown`.
        detail:
          type: string

    DaemonHealthSnapshot:
      type: object
      description: >
        GET /v1/daemon-health's body (src/lib/daemon-health.ts's `DaemonHealthSnapshot`). Every
        field whose own source could not be read is ABSENT, never a placeholder. `hostPressure`
        and `gatewayCheckout` are always sent by the live handler; they are optional here because
        the console read cache's fallback body (src/lib/serve.ts's `fallbackBodyForCachedRead`,
        served before any live snapshot exists) carries only `pollIntervalMs` and `staleness`.
      required: [pollIntervalMs]
      properties:
        lastPollTs:
          type: string
          format: date-time
        lastPollAgeMs:
          type: number
        pollIntervalMs:
          type: number
        nextPollAt:
          type: string
          format: date-time
          description: "`lastPollTs + pollIntervalMs`; absent with no `lastPollTs`."
        diskFreeBytes:
          type: number
        rateLimitRemaining:
          type: number
        eventLoopLag:
          $ref: "#/components/schemas/EventLoopLag"
        hostPressure:
          $ref: "#/components/schemas/HostPressure"
        gatewayCheckout:
          $ref: "#/components/schemas/GatewayCheckoutState"
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    IncidentRecord:
      type: object
      description: One fix-verification lifecycle record as GET /v1/incidents projects it (src/lib/incident-lifecycle.ts's `IncidentWire`).
      required: [fingerprint, title, source, kind, status, firstSeen, lastSeen, count24h, feedbackId, pr]
      properties:
        fingerprint:
          type: string
        title:
          type: string
        source:
          type: string
          enum: [console, gateway, daemon]
        kind:
          type: string
          enum: [exception, http_5xx, latency, invariant]
        status:
          type: string
          enum: [new, filed, building, deployed, verified, regressed]
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        count24h:
          type: number
        feedbackId:
          type: [string, "null"]
        pr:
          type: [number, "null"]

    IncidentsResult:
      type: object
      description: GET /v1/incidents's body -- the lifecycle store, newest `lastSeen` first.
      required: [incidents, generatedAt]
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRecord"
        generatedAt:
          type: string
          format: date-time

    IncidentsUnavailable:
      type: object
      description: >
        GET /v1/incidents's 503 -- the lifecycle store exists but could not be read, reported as
        an error rather than the `200 {incidents: []}` a quiet fleet returns.
      required: [error, reason]
      properties:
        error:
          type: string
          enum: [incidents_unavailable]
        reason:
          type: string
          description: "`malformed` or `unreadable` from the production store reader."

    IncidentEventFrame:
      type: object
      description: One reported stack frame -- file and function only; a line number is never part of the wire shape.
      required: [file, fn]
      properties:
        file:
          type: string
        fn:
          type: string

    ConsoleTelemetryRequest:
      type: object
      description: >
        POST /v1/console/telemetry (src/lib/console-telemetry.ts): one batch of the console's latency
        beacon, at most 50 records. Fields a record carries that are not declared here are dropped.
      required: [records]
      properties:
        records:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ConsoleLatencyRecord"

    ConsoleLatencyRecord:
      type: object
      description: >
        One applied view update as the console measured it; each becomes one `console.latency` ledger
        row. Durations are milliseconds, 0 to 3600000, rounded. Browser-side hops are measured on the
        browser clock; `transportMs` alone uses `clockOffsetMs`, the offset estimated from the events
        stream's `hello.serverNow`.
      required: [view, key, cause]
      properties:
        view: {type: string}
        key: {type: string, description: The view key; empty for an unkeyed view.}
        cause:
          type: string
          enum: [body, judge, hello, poll]
        emittedAt: {type: string, format: date-time, description: The serve-clock time of the view event, when one caused the update.}
        transportMs: {type: number, description: View event emitted by serve to received by the browser.}
        fetchMs: {type: number, description: The refetch, browser to console route to core and back.}
        coreMs: {type: number, description: The core read inside the refetch, from Server-Timing.}
        applyMs: {type: number, description: Response to the view store applying it.}
        paintMs: {type: number, description: Store update to the next painted frame.}
        totalMs: {type: number, description: View event emitted to painted.}
        clockOffsetMs: {type: number, description: The browser clock minus serve's.}

    ConsoleTelemetryResult:
      type: object
      required: [accepted, dropped]
      properties:
        accepted: {type: integer, description: Records ledgered as console.latency rows.}
        dropped: {type: integer, description: Records past the pace of about one row a second, not ledgered.}

    IncidentEventRequest:
      type: object
      description: >
        POST /v1/incidents/events's body (src/lib/incident-events.ts's `IncidentEventInput`,
        validated by `validateIncidentEventBody`). At most 16 KiB. The daemon scrubs `message`
        and `route` (query/fragment stripped; token, email and uuid shapes redacted) and caps
        `message` at 500 characters and `frames` at 20 before anything is fingerprinted or stored.
      required: [source, kind, name, message, at]
      properties:
        source:
          type: string
          enum: [console, gateway, daemon]
        kind:
          type: string
          enum: [exception, http_5xx, latency, invariant]
        name:
          type: string
          minLength: 1
        message:
          type: string
        frames:
          type: array
          items:
            $ref: "#/components/schemas/IncidentEventFrame"
        route:
          type: string
        sha:
          type: string
        at:
          type: string
          description: An ISO date string (any value `Date.parse` accepts).

    IncidentEventResult:
      type: object
      description: >
        POST /v1/incidents/events's answer. `sampled` is true once the fingerprint has passed the
        per-minute cap; a sampled event writes at most one `incident.sampled` row per window.
      required: [fingerprint, accepted, sampled]
      properties:
        fingerprint:
          type: string
        accepted:
          type: boolean
          enum: [true]
        sampled:
          type: boolean

    IncidentIngestBodyTooLarge:
      type: object
      description: POST /v1/incidents/events's 413 -- the raw body exceeded 16 KiB and was not read further.
      required: [error]
      properties:
        error:
          type: string
          enum: [body_too_large]

    OnboardingReadinessCheck:
      type: object
      description: One of the eight onboarding checks (src/lib/onboarding-readiness.ts's `OnboardingReadinessCheck`).
      required: [id, status, reason]
      properties:
        id:
          type: string
          enum: [app-access, default-branch, branch-protection, ci-workflows, agent-instructions, test-command, plan-layout, already-onboarded]
        status:
          type: string
          enum: [pass, warn, fail, unknown]
          description: "`unknown` only when the read could not be completed, never for a definitive GitHub answer."
        reason:
          type: string
        evidence:
          type: string

    OnboardingReadinessReport:
      type: object
      description: >
        GET /v1/onboarding/readiness's body (src/lib/onboarding-readiness.ts's
        `OnboardingReadinessReport`): each check independently pass/warn/fail/unknown, never
        one verdict hiding which check said what.
      required: [repo, checks]
      properties:
        repo:
          type: string
          description: "`owner/name`."
        checks:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingReadinessCheck"

    PeekResult:
      type: object
      description: >
        GET /v1/peek's body (src/lib/serve.ts's `buildPeekRoute`): the tail of one run's
        `state/runs/<runId>.tail`, at most 500 lines and 64 KiB. A missing or unreadable tail is
        `found: false` with a named `reason`, never a silent empty body.
      required: [runId, live, found, lines]
      properties:
        runId:
          type: string
        live:
          type: boolean
          description: Whether the run is in flight, per the daemon's own live-run reader.
        found:
          type: boolean
        lines:
          type: array
          items:
            type: string
        reason:
          type: string
          description: Present only when `found` is false.

    PlanProgress:
      type: object
      description: >
        Whole-plan task counts derived from GitHub, never the plan's decorative `status:` field
        (src/lib/panel-graph.ts's `PlanProgress`). Under `unknown` the last observed reading is
        carried forward with its `asOf`; the counts are absent only on a first reading taken
        during an outage.
      required: [unknown]
      properties:
        done:
          type: number
        inFlight:
          type: number
        queued:
          type: number
        total:
          type: number
        unknown:
          type: boolean
        asOf:
          type: string
          format: date-time
        unavailableReason:
          type: string

    PlanSectionCount:
      type: object
      description: One MASTER-PLAN section's filed/merged pair (src/lib/panel-graph.ts's `PlanSectionCount`).
      required: [heading, filed, merged]
      properties:
        heading:
          type: string
        filed:
          type: number
        merged:
          type: number

    FrontierRow:
      type: object
      description: One frontier row in the dispatcher's own order (src/lib/panel-graph.ts's `FrontierRow`).
      required: [id, title, runnable, reasonKind, reason]
      properties:
        id:
          type: string
        title:
          type: string
        runnable:
          type: boolean
        reasonKind:
          type: string
          enum: [file-order, unmet-dependency, circuit-breaker, blocked]
          description: >
            The TypeScript union also names `verify-human`, but `buildPlanFrontier` excludes those
            tasks from the frontier, so no served row carries it.
        reason:
          type: string

    PlanViewResult:
      type: object
      description: GET /v1/plan/view's body -- progress, per-section counts and the frontier off one plan projection.
      required: [progress, sections, frontier]
      properties:
        progress:
          $ref: "#/components/schemas/PlanProgress"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PlanSectionCount"
        frontier:
          type: array
          items:
            $ref: "#/components/schemas/FrontierRow"

    ProviderRoutingWindowStatus:
      type: object
      required: [name, usedPercent]
      properties:
        name:
          type: string
        usedPercent:
          type: number
        resetsAt:
          type: string

    ProviderRoutingResetCreditsStatus:
      type: object
      description: >
        Manual reset readiness -- a count and the earliest expiry only, never a credit id.
        `earliestExpiresAt` is the provider's own numeric timestamp, passed through unconverted.
      required: [availableCount]
      properties:
        availableCount:
          type: number
        earliestExpiresAt:
          type: number

    CodexModelDecisionOptionStatus:
      type: object
      required: [id, supportedEfforts, accountDefault, mapped, eligible, selected, windows]
      properties:
        id:
          type: string
        displayName:
          type: string
        supportedEfforts:
          type: array
          items:
            type: string
        accountDefault:
          type: boolean
        mapped:
          type: boolean
        eligible:
          type: boolean
        selected:
          type: boolean
        windows:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRoutingWindowStatus"
        reason:
          type: string
          enum: [unmapped, unsupported-effort, quota-unreadable, below-reserve]

    CodexModelDecisionStatus:
      type: object
      required: [requestedCapability, requestedEffort, mappedCandidates, options]
      properties:
        requestedCapability:
          type: string
          enum: [economy, balanced, frontier]
        requestedEffort:
          type: string
        mappedCandidates:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/CodexModelDecisionOptionStatus"
        selectedModel:
          type: string
        selectedEffort:
          type: string
        preferredModel:
          type: string
        preferenceBypass:
          type: string
          enum: [unmapped, unsupported-effort, quota-unreadable, below-reserve, not-visible]

    ProviderRoutingProviderStatus:
      type: object
      required: [provider, readable, windows]
      properties:
        provider:
          type: string
          enum: [claude, codex, cash, openweight]
        readable:
          type: boolean
        windows:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRoutingWindowStatus"
        allocationWindows:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRoutingWindowStatus"
        reason:
          type: string
          enum: [capacity-unreadable, authentication-unavailable, capacity-unavailable]
        accountLabel:
          type: string
        model:
          type: string
        effort:
          type: string
        modelDecision:
          $ref: "#/components/schemas/CodexModelDecisionStatus"
        resetCredits:
          $ref: "#/components/schemas/ProviderRoutingResetCreditsStatus"

    ProviderRoutingSelectedStatus:
      type: object
      required: [provider, tightestRemainingPercent]
      properties:
        provider:
          type: string
          enum: [claude, codex, cash, openweight]
        tightestRemainingPercent:
          type: number
        allocationWeight:
          type: number
        allocationSharePercent:
          type: number
        accountLabel:
          type: string
        model:
          type: string
        effort:
          type: string

    ProviderRoutingModelHealthStatus:
      type: object
      required: [state, source, eligible]
      properties:
        requestedModel:
          type: string
        routedModel:
          type: string
        state:
          type: string
          enum: [healthy, degraded, unknown]
        source:
          type: string
          enum: [fresh, stale, unknown]
        eligible:
          type: boolean

    ProviderPark:
      type: object
      required: [provider, until]
      properties:
        provider:
          type: string
          enum: [claude, codex, cash, openweight]
        until:
          type: string

    CodexModelPreference:
      type: object
      required: [capability, effort, model]
      properties:
        capability:
          type: string
          enum: [economy, balanced, frontier]
        effort:
          type: string
        model:
          type: string

    ProviderRoutingCommittedPolicy:
      type: object
      description: The committed host policy an override is measured against (src/lib/provider-routing-policy.ts's `CommittedProviderRoutingPolicy`).
      required: [enabledProviders, preference, reservePercent, parks, codexModelPreference]
      properties:
        enabledProviders:
          type: array
          items:
            type: string
            enum: [claude, codex, cash, openweight]
        preference:
          type: string
          enum: [automatic]
        reservePercent:
          type: number
        parks:
          type: array
          maxItems: 0
          description: Always empty -- the committed policy parks nothing.
          items:
            $ref: "#/components/schemas/ProviderPark"
        codexModelPreference:
          type: "null"
          description: Always null -- the committed policy states no model preference.

    ProviderRoutingPolicyStatus:
      type: object
      description: >
        The effective provider-routing policy (src/lib/provider-routing-policy.ts's
        `EffectiveProviderRoutingPolicy`). GET /v1/provider-routing re-resolves it live on every
        request, so a console write, expiry or clear is visible before the next dispatch.
      required: [provenance, committed, enabledProviders, routableProviders, preference, reservePercent, parks]
      properties:
        provenance:
          type: string
          enum: [default, overridden]
        committed:
          $ref: "#/components/schemas/ProviderRoutingCommittedPolicy"
        enabledProviders:
          type: array
          items:
            type: string
            enum: [claude, codex, cash, openweight]
        routableProviders:
          type: array
          description: Enabled providers after active parks are applied.
          items:
            type: string
            enum: [claude, codex, cash, openweight]
        preference:
          type: string
          enum: [automatic, claude, codex, cash, openweight]
        reservePercent:
          type: number
        parks:
          type: array
          items:
            $ref: "#/components/schemas/ProviderPark"
        codexModelPreference:
          $ref: "#/components/schemas/CodexModelPreference"
        overrideExpiresAt:
          type: string
        writtenAt:
          type: string
        writerFingerprint:
          type: string
        fallback:
          type: object
          description: Present only when a stored override was refused and the committed policy was used instead.
          required: [reason]
          properties:
            reason:
              type: string
              enum: [unreadable, malformed, unsupported-version, expired, incompatible-with-config]

    ProviderRoutingPreferenceBypass:
      type: object
      required: [provider, reason]
      properties:
        provider:
          type: string
          enum: [claude, codex, cash, openweight]
        reason:
          type: string
          enum: [unreadable, below-reserve]

    ProviderRoutingStatus:
      type: object
      description: >
        GET /v1/provider-routing's body: the daemon's last provider-routing decision as the
        daemon wrote it to `state/provider-routing-status.json` (src/lib/provider-routing-status.ts's
        `ProviderRoutingStatus`, projected field by field by `readProviderRoutingStatus`), with
        `policy` overlaid by a live resolution. The console process never probes a provider.
      required: [version, state, freshness]
      properties:
        version:
          type: number
        state:
          type: string
          enum: [unknown, not-probed, selected, blocked]
        freshness:
          type: string
          enum: [fresh, stale, not-probed, unknown]
        reason:
          type: string
          enum: [absent, unreadable, malformed, unsupported-version]
          description: Why the status is `unknown`.
        enabledProviders:
          type: array
          items:
            type: string
            enum: [claude, codex, cash, openweight]
        reservePercent:
          type: number
        observedAt:
          type: string
        freshUntil:
          type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRoutingProviderStatus"
        selected:
          $ref: "#/components/schemas/ProviderRoutingSelectedStatus"
        blockedReason:
          type: string
          enum: [no-provider-headroom]
        modelHealth:
          $ref: "#/components/schemas/ProviderRoutingModelHealthStatus"
        policy:
          $ref: "#/components/schemas/ProviderRoutingPolicyStatus"
        preferenceBypass:
          $ref: "#/components/schemas/ProviderRoutingPreferenceBypass"

    ViewSource:
      type: object
      description: One input a view was computed from (src/lib/views.ts's `ViewSource`).
      required: [name, asOf, state]
      properties:
        name: {type: string}
        asOf:
          type: [string, "null"]
          description: The input's own as-of time; null when it has none yet.
        state:
          type: string
          enum: [fresh, stale, unavailable]
        reason: {type: string}

    ViewVersions:
      type: object
      description: >
        GET /v1/views/versions and the `hello` event on GET /v1/views/events (docs/views.md): the
        version of every served view body, which is its ETag, by view name and key. A view whose
        switch is not `serve` has no versions and is listed in `disabled`.
      required: [views, disabled]
      properties:
        views:
          type: object
          description: View name to (key to ETag). An unkeyed view has the empty key.
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        disabled:
          type: array
          items: {type: string}

    ViewHello:
      type: object
      description: >
        The first event on every GET /v1/views/events connection (`event: hello`): ViewVersions
        flattened (this generator's subset has no allOf) plus the process's `bootId` (each event id is
        `<bootId>:<seq>`) and `serverNow`.
      required: [bootId, serverNow, views, disabled]
      properties:
        bootId: {type: string}
        serverNow: {type: string, format: date-time}
        views:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        disabled:
          type: array
          items: {type: string}

    ViewEvent:
      type: object
      description: A `view` event on GET /v1/views/events. The served body of (view, key) now has this ETag.
      required: [view, key, etag, stale, emittedAt, asOf, cause]
      properties:
        view: {type: string}
        key: {type: string}
        etag: {type: string}
        stale: {type: boolean}
        emittedAt: {type: string, format: date-time}
        asOf: {type: [string, "null"]}
        cause:
          type: string
          enum: [body, judge]
          description: "`body`: the read-model worker posted a new body. `judge`: re-judging the sources flipped `stale`."
        body:
          type: object
          description: >
            Present when the judged body is at most 4 KiB: the whole view body a GET of (view, key)
            answers with this `etag`, so the client applies it without a refetch. A larger body is
            refetched with If-None-Match.

    ViewHandover:
      type: object
      description: The last event on a GET /v1/views/events stream that serve ends (a drain, or a subscriber stalled too long).
      required: [reason, retryMs]
      properties:
        reason: {type: string, description: "`recycle` on a drain, `slow_consumer` for a stalled subscriber."}
        retryMs: {type: integer}

    NavBadgeView:
      type: object
      description: >
        GET /v1/views/nav-badge (docs/views.md). The view envelope every /v1/views/<name> route
        answers: `version` is `data`'s schema version, `asOf` the oldest source's as-of, `stale` true
        when any source is stale or unavailable. A cold input makes its count absent with a
        `reason`, never a zero.
      required: [view, version, generatedAt, asOf, stale, sources, data]
      properties:
        view:
          type: string
          enum: [nav-badge]
        version:
          type: integer
          enum: [1]
        generatedAt: {type: string, format: date-time}
        asOf: {type: [string, "null"]}
        stale: {type: boolean}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ViewSource"
        data:
          type: object
          required: [agent, inbox]
          properties:
            agent:
              type: object
              description: >
                The operator-agent badge: proposals the console's engine would show (a port of its
                generateProposals and visibleProposals, src/lib/nav-badge-view.ts), with up to 20
                of their ids for a parity check.
              required: [proposalIds, instances]
              properties:
                count:
                  type: integer
                  description: Present only when every selected instance was counted.
                atLeast:
                  type: integer
                  description: Present instead of `count` when only some instances were counted -- a floor, never a total.
                proposalIds:
                  type: array
                  items: {type: string}
                instances:
                  type: array
                  description: One entry per selected instance; `count` absent with a `reason` when it could not be counted.
                  items:
                    type: object
                    required: [instanceId]
                    properties:
                      instanceId: {type: string}
                      repository: {type: string}
                      count: {type: integer}
                      reason: {type: string}
                reason: {type: string}
            inbox:
              type: object
              description: Open inbox items by who must act, from the last GET /v1/inbox classification.
              properties:
                ready: {type: integer}
                needsYou: {type: integer}
                fleet: {type: integer}
                reason: {type: string}

    ReadModelStatusView:
      type: object
      description: >
        GET /v1/views/read-model (docs/views.md): the Phase 1 read model's own status, one body per
        serve, materialized by the read-model worker (src/lib/read-model-worker.ts). Each instance's
        `ledger:<instance>` source is re-judged at request time, so a stalled projector reads stale.
      required: [view, version, generatedAt, asOf, stale, sources, data]
      properties:
        view:
          type: string
          enum: [read-model]
        version:
          type: integer
          enum: [1]
        generatedAt: {type: string, format: date-time}
        asOf: {type: [string, "null"]}
        stale: {type: boolean}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ViewSource"
        data:
          type: object
          required: [instances]
          properties:
            instances:
              type: array
              items:
                type: object
                required: [instance, generation, lease, quarantined]
                properties:
                  instance: {type: string}
                  generation:
                    type: integer
                    description: The instance DB's committed projector transaction count.
                  lease:
                    type: string
                    enum: [held, elsewhere, none]
                  heldBy:
                    type: string
                    description: pid@host of another serve holding the writer lease.
                  quarantined:
                    type: integer
                    description: Rows stamped more than five minutes past their ingest time.
                  reason: {type: string}
            shadow:
              type: array
              description: Each shadowed view's diff counters and cutover readiness (src/lib/view-shadow.ts); absent before the first sample.
              items:
                $ref: "#/components/schemas/ViewShadowReadiness"

    ViewShadowReadiness:
      type: object
      description: >
        One view's shadow comparator counters. `ready` needs zero `real` diffs sustained over a day of
        measured traffic and at least 3 x requests-per-day samples (the rule of three).
      required: [view, requests, firstRequestMs, samples, diffs, streakSamples, streakSinceMs, lastRealMs, requestsPerDay, requiredSamples, ready, reason]
      properties:
        view: {type: string}
        requests: {type: integer}
        firstRequestMs: {type: [integer, "null"]}
        samples: {type: integer}
        diffs:
          type: object
          required: [legacy_horizon, timing, dedupe, real]
          properties:
            legacy_horizon: {type: integer}
            timing: {type: integer}
            dedupe: {type: integer}
            real: {type: integer}
        streakSamples: {type: integer}
        streakSinceMs: {type: [integer, "null"]}
        lastRealMs: {type: [integer, "null"]}
        requestsPerDay: {type: [integer, "null"]}
        requiredSamples: {type: [integer, "null"]}
        ready: {type: boolean}
        reason: {type: string}

    RepositoriesView:
      type: object
      description: >
        GET /v1/views/repositories (docs/views.md, src/lib/repositories-view.ts): the repository
        portfolio across every instance serve holds, in one body. Each instance's `summary` IS its
        GET /v1/i/<instance>/repos/summary body, computed by the read-model worker from that
        instance's projected `repo_row` table; `projects` precomputes the console's grouping and its
        "worst is <repo>" line. Dark until state/read-model/switches.json sets `repositories` to `serve`.
        Version 2 carries no clock stamp in `data`: each summary's `generated_at` is its
        `repositories:<instance>` source's `asOf`, so the ETag moves only when the content does.
      required: [view, version, generatedAt, asOf, stale, sources, data]
      properties:
        view:
          type: string
          enum: [repositories]
        version:
          type: integer
          enum: [2]
        generatedAt: {type: string, format: date-time}
        asOf: {type: [string, "null"]}
        stale: {type: boolean}
        sources:
          type: array
          description: A `ledger:<instance>` and a `repositories:<instance>` source per instance.
          items:
            $ref: "#/components/schemas/ViewSource"
        data:
          type: object
          required: [instances, projects]
          properties:
            instances:
              type: array
              description: One entry per instance serve published, in its order; `summary` absent with a `reason` until its first recompute.
              items:
                type: object
                required: [instanceId]
                properties:
                  instanceId: {type: string}
                  summary:
                    $ref: "#/components/schemas/RepositoriesSummary"
                  reason:
                    type: string
                    description: Why `summary` is absent, or (beside a summary) why the last recompute failed and the summary shown is older.
            projects:
              type: array
              description: >
                Registry projects in first-seen order. A repository the registry names no project for
                is its own project, named after the repository.
              items:
                $ref: "#/components/schemas/RepositoriesProject"
            projectsReason:
              type: string
              description: Present when the registry could not be read, so every repository is its own project.
            reason:
              type: string
              description: Present with empty arrays before serve has published the repository sources.

    RepositoriesSummary:
      type: object
      description: >
        One instance's GET /v1/i/<instance>/repos/summary body (RepoDashboardResult) without its
        `generated_at`, which the view's `repositories:<instance>` source carries as `asOf`.
      required: [source, repos]
      properties:
        source:
          type: string
          enum: [managed-repos, instance-registry, instance-registry+managed-repos]
        registry:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [verified, unavailable]
            reason: {type: string}
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RepoDashboardEntry"

    RepositoriesProject:
      type: object
      description: One project of the repositories view, with the repository whose state is worst.
      required: [project, repos, worst]
      properties:
        project: {type: string}
        repos:
          type: array
          description: References into `data.instances[].summary.repos` by `id`.
          items:
            type: object
            required: [id, reponame, instanceId, state]
            properties:
              id:
                type: string
                description: Canonical owner/repo; the instance name when neither the registry nor serve names its repository.
              reponame: {type: string}
              instanceId: {type: string}
              state:
                $ref: "#/components/schemas/RepositoryState"
        worst:
          type: object
          description: The FIRST repository holding the project's worst state (never an average).
          required: [state, repoId, repoName]
          properties:
            state:
              $ref: "#/components/schemas/RepositoryState"
            repoId: {type: string}
            repoName: {type: string}

    RepositoryState:
      type: string
      description: >
        How far a repository's figures can be trusted, worst first: `unavailable` (no summary),
        `stale` (the last recompute failed; the summary shown is older), `unknown` (computed, no
        ledger), `verified`. The console's RepoHealthStatus.
      enum: [unavailable, stale, unknown, verified]

    NowView:
      type: object
      description: >
        GET /v1/views/now?instance=<id> (docs/views.md, src/lib/now-view.ts): everything the console's
        /now renders for ONE instance. The board is the legacy derivation over the read model's full
        fact history; `groups` precomputes the console's groupBoard; `actions` carries structured
        strikes; `health` is the selected instance's own host probe. Dark until
        state/read-model/switches.json sets `now` to `serve`. Version 2 carries no clock stamp and
        no now-relative value in `data` (the envelope's `generatedAt` and each source's `asOf` do),
        so the ETag moves only when the content does. A consumer derives a duration ("running for
        12 min") from an absolute field such as a task's `startedAt`.
      required: [view, version, generatedAt, asOf, stale, sources, data]
      properties:
        view:
          type: string
          enum: [now]
        version:
          type: integer
          enum: [2]
        generatedAt: {type: string, format: date-time}
        asOf: {type: [string, "null"]}
        stale: {type: boolean}
        sources:
          type: array
          description: "`ledger:<i>`, `github:<i>` (the persisted open-PR snapshot), `plan:<i>` and `host-probe:<i>`."
          items:
            $ref: "#/components/schemas/ViewSource"
        data:
          type: object
          required: [instance, board, prQueue, actions, recent, health, questions]
          properties:
            instance: {type: string}
            board:
              type: object
              required: [counts, spendTodayUsd, taskProjection, tasks, groups]
              properties:
                counts:
                  type: object
                  required: [running, queued, blocked]
                  properties:
                    running: {type: integer}
                    queued: {type: integer}
                    blocked: {type: integer}
                spendTodayUsd: {type: number}
                taskProjection:
                  type: object
                  description: "`tasks` carries every running, needs-you and blocked task and the newest `limit` queued ones; `groups` names them all."
                  required: [complete, returned, limit, total]
                  properties:
                    complete: {type: boolean}
                    returned: {type: integer}
                    limit: {type: integer}
                    total: {type: integer}
                tasks:
                  type: array
                  items:
                    $ref: "#/components/schemas/NowTask"
                groups:
                  type: object
                  description: Task ids in the console's groupBoard order; each task is in exactly one group.
                  required: [running, needsYou, blocked, queued]
                  properties:
                    running: {type: array, items: {type: string}}
                    needsYou: {type: array, items: {type: string}}
                    blocked: {type: array, items: {type: string}}
                    queued: {type: array, items: {type: string}}
            prQueue:
              type: object
              required: [complete, rows]
              properties:
                complete: {type: boolean}
                unavailableReason: {type: string}
                rows:
                  type: array
                  items:
                    type: object
                    required: [prNumber, prUrl, title, disposition, queueClass, held]
                    properties:
                      prNumber: {type: integer}
                      prUrl: {type: string}
                      title: {type: string}
                      taskId: {type: string}
                      disposition: {type: string}
                      queueClass:
                        type: string
                        enum: [actionable, active, ready-held, waiting, unknown]
                      held: {type: boolean}
            actions:
              type: array
              description: Blocked PRs and merge holds, most urgent tone first.
              items:
                $ref: "#/components/schemas/NowAction"
            recent:
              type: object
              required: [entries, mergedToday]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [ts, verb, taskId, title]
                    properties:
                      ts: {type: string}
                      verb:
                        type: string
                        description: A RecentActivityEntry verb; a consumer renders an unknown one.
                      taskId: {type: string}
                      title: {type: string}
                      detail: {type: string}
                      costUsd: {type: number}
                      prUrl: {type: string}
                mergedToday:
                  type: object
                  description: Exact merges today (UTC), one per task and pull request, over full history.
                  required: [count, day]
                  properties:
                    count: {type: integer}
                    day: {type: string}
            health:
              type: object
              description: >
                The selected instance's own host probe; a gauge it could not read is absent, named in
                `reasons`. The probe's sample time is the `host-probe:<i>` source's `asOf`.
              required: [daemon]
              properties:
                diskFreeBytes: {type: number}
                rateLimitRemaining: {type: integer}
                daemon:
                  type: object
                  description: >
                    The daemon's poll liveness. `polling` while a `daemon.*` row is under 5 min old;
                    `silent` otherwise, with `at` the last poll's own time (absent when the live ledger
                    has none). `at` stops moving while the daemon is silent, so a consumer ages it itself.
                  required: [state]
                  properties:
                    state:
                      type: string
                      enum: [polling, silent]
                    at: {type: string, format: date-time}
                    reason: {type: string}
                reasons:
                  type: object
                  additionalProperties: {type: string}
            questions:
              description: Open feedback questions; core only, so another instance carries a `reason` instead.
              oneOf:
                - type: object
                  required: [count]
                  properties:
                    count: {type: integer}
                - type: object
                  required: [reason]
                  properties:
                    reason: {type: string}

    NowTask:
      type: object
      description: One board row as /now renders it; other StatusProjection fields stay on GET /v1/status.
      required: [taskId, title, status, risk]
      properties:
        taskId: {type: string}
        title: {type: string}
        status: {type: string}
        risk: {type: string}
        lastActivityAt: {type: string}
        prUrl: {type: string}
        prNumber: {type: integer}
        phase: {type: string}
        startedAt:
          type: string
          description: The run's start; a consumer derives the running time from it (version 2 dropped `elapsedMs`).
        needsHuman: {type: boolean, enum: [true]}
        verifyHumanPending: {type: boolean, enum: [true]}
        escalation:
          type: object
          properties:
            title: {type: string}
            issueUrl: {type: string}
            unverified: {type: boolean, enum: [true]}
            openedAt: {type: string}
        worker:
          type: object
          properties:
            servedModel: {type: string}
            requestedModel: {type: string}

    NowAction:
      type: object
      description: >
        The console's actionQueueFromStatus, precomputed. `strike` is parsed once from the sweep's
        reason in every form it writes, replacing the console's regex; `sortAt` is the row's own time.
      required: [kind, disposition, reason, tone]
      properties:
        kind:
          type: string
          enum: [blocked_pr, merge_held]
        taskId: {type: string}
        prNumber: {type: integer}
        prUrl: {type: string}
        disposition: {type: string}
        reason: {type: string}
        tone:
          type: string
          enum: [exhausted, held, blocked, unknown, repairing]
        strike:
          type: object
          required: [n, of]
          properties:
            n: {type: integer}
            of: {type: integer}
        sortAt: {type: string}

    RecentActivityEntry:
      type: object
      description: One RECENT feed row minted from a ledger line (src/lib/board.ts's `RecentActivityEntry`).
      required: [taskId, title, verb, ts]
      properties:
        taskId:
          type: string
        runId:
          type: string
        title:
          type: string
        verb:
          type: string
          enum: [merged, verdict, fix, escalated, spend, run-refused, run-started, worker, started, review, automerge]
          description: >
            `merged` is minted from a run's `verdict: merged` row or the sweep's `verdict.merged`
            credit, once per pull request. `started` is a `run.start` (detail: the run type),
            `review` a `review.posted` (detail: its state, verbatim), `automerge` an
            `automerge.armed`. A consumer must render an unknown verb, not drop it.
        ts:
          type: string
          description: The originating ledger line's own `ts`.
        detail:
          type: string
        costUsd:
          type: number
        numTurns:
          type: number
        prNumber:
          type: number
        prUrl:
          type: string
        eventKind:
          type: string
          enum: [working, tool-executing, message]
        eventAt:
          type: string
        workerRole:
          type: string
          enum: [recon, implementer, reviewer, fixer, triage, retro, unknown]
        provider:
          type: string
        requestedModel:
          type: string
        servedModel:
          type: string
        turnsSoFar:
          type: number
        toolName:
          type: string
        toolReason:
          type: string
        toolStartedAt:
          type: string
        toolCompletedAt:
          type: string
        toolDurationMs:
          type: number
        toolOutcome:
          type: string
          enum: [success, error]
        prTitle:
          type: string
          description: GitHub decoration, present only when a read resolved it.
        githubUnavailable:
          type: boolean
          enum: [true]
          description: Present only when GitHub decoration was attempted and failed for this row.

    RecentActivityResult:
      type: object
      description: GET /v1/recent's body -- at most `limit` (default 20) entries, newest first.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivityEntry"
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    SelfMeasurementRow:
      type: object
      description: >
        One `measurement_cadence.ran` ledger row (src/lib/measurement-cadence.ts's
        `MeasurementCadenceRowEntry`). `result` is keyed by cadence verb (camelCased) and each
        value is that verb's SUMMARY (`summarizeMeasurementValue`): scalars, short strings and
        array counts. The verb set grows with the cadence, so the map is genuinely open.
      required: [ts, result]
      properties:
        ts:
          type: string
        result:
          type: object
          additionalProperties: {}

    SelfMeasurementRows:
      type: object
      description: The newest measurement rows, newest first.
      required: [status, rows]
      properties:
        status:
          type: string
          enum: [ok]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SelfMeasurementRow"

    SelfMeasurementUnreadable:
      type: object
      description: >
        The ledger union could not be read in full (no archive at all, or an unopenable
        rotation) -- never answered as an empty "never measured".
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [unreadable]
        reason:
          type: string

    SelfMeasurementDetail:
      type: object
      description: >
        `?detail=<verb>`: that verb's FULL report from the newest row carrying it. `value` is
        whatever that verb recorded, un-summarized, so its shape is the verb's own.
      required: [verb, ts, value]
      properties:
        verb:
          type: string
        ts:
          type: string
        value: {}

    AcceptanceCriterion:
      type: object
      description: One plan acceptance criterion (src/lib/plan.ts's `AcceptanceCriterion`).
      required: [claim, proof]
      properties:
        claim:
          type: string
        proof:
          type: string
        satisfied_by:
          type: string
        holdout:
          type: boolean

    TaskCardRun:
      type: object
      description: One owned run in a task card's history -- read from the ledger, no GitHub call.
      required: [runId]
      properties:
        runId:
          type: string
        verdict:
          type: string
        costUsd:
          type: number
        prUrl:
          type: string

    TaskCard:
      type: object
      description: The row-click task card (src/lib/task-card.ts's `TaskCard`).
      required: [id, title, acceptance, dependsOn, status, merged, runs]
      properties:
        id:
          type: string
        title:
          type: string
        rationale:
          type: string
        acceptance:
          type: array
          items:
            $ref: "#/components/schemas/AcceptanceCriterion"
        dependsOn:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [queued, recon, prompted, running, review, fixing, diagnosing, blocked, merged, done]
          description: The GitHub-derived projection's status, falling back to the plan's own only when no projection resolved.
        merged:
          type: boolean
        prNumber:
          type: number
        prUrl:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/TaskCardRun"

    TaskCardResult:
      type: object
      required: [card]
      properties:
        card:
          $ref: "#/components/schemas/TaskCard"

    VersionResult:
      type: object
      description: GET /v1/version's body -- the console sha captured at server start, and nothing else.
      required: [sha]
      properties:
        sha:
          type: string

    # ── W1-T4610 -- the inbox and escalation routes' payloads. Each schema below is derived from
    # the TypeScript type its handler sends (src/lib/panel-graph.ts, src/lib/inbox-responder.ts,
    # src/lib/inbox-plain.ts, src/lib/inbox.ts, src/lib/fleet-lane.ts, src/lib/panel-actions.ts,
    # src/lib/reply-interpreter.ts, src/lib/escalate.ts, src/lib/serve.ts). This generator's
    # subset has no oneOf/allOf, so a TypeScript union or `extends` is flattened into one object
    # and the flattening is named in that schema's description.

    PlainOption:
      type: object
      description: One option on an inbox item's plain message (src/lib/inbox-plain.ts's `PlainOption`).
      required:
        - label
        - consequence
      properties:
        label:
          type: string
        consequence:
          type: string

    PlainInboxMessage:
      type: object
      description: >
        W1-T4087: an inbox item's plain-language message (src/lib/inbox-plain.ts's
        `PlainInboxMessage`) -- the model writer's text when it passed the plain-message check,
        otherwise the item kind's template. The raw proposal summary is never promoted to it.
      required:
        - headline
        - whatHappened
        - whatWeNeed
        - ifNothingHappens
        - options
        - source
      properties:
        headline:
          type: string
          description: 15 words or fewer.
        whatHappened:
          type: string
        whatWeNeed:
          type: string
          description: What the daemon needs from the operator, as an instruction.
        ifNothingHappens:
          type: string
          description: What happens if nobody acts.
        options:
          type: array
          description: Two or three options.
          items:
            $ref: "#/components/schemas/PlainOption"
        source:
          type: string
          description: Who wrote it -- the model writer or the per-kind template.
          enum:
            - writer
            - template

    InboxDraftedTask:
      type: object
      description: One task a READY proposal's drafted fragment would file (src/lib/panel-graph.ts's `InboxDraftedTask`).
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string

    InboxPredicateFailure:
      type: object
      description: >
        One failing readiness predicate `classifyProposal` named for a not-ready proposal
        (src/lib/inbox.ts's `PredicateFailure`) -- never a bare "not ready".
      required:
        - predicate
        - detail
      properties:
        predicate:
          type: string
          enum:
            - drafted
            - deps_merged
            - deps_observable
            - evidence_anchors
            - lint_clean
            - no_conflict
        detail:
          type: string

    InboxReadyItem:
      type: object
      description: >
        One READY-to-ratify proposal (src/lib/panel-graph.ts's `InboxReadyItem`); the drafted
        tasks ride along so the operator sees exactly what APPROVE would file.
      required:
        - proposalId
        - summary
        - plain
        - draftedTasks
      properties:
        proposalId:
          type: string
        summary:
          type: string
          description: The raw proposal summary (the console's Details).
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        stampLine:
          type: string
          description: The drafted fragment's stamp line, when the draft carries one.
        draftedTasks:
          type: array
          items:
            $ref: "#/components/schemas/InboxDraftedTask"

    InboxDraftingItem:
      type: object
      description: >
        One proposal an Architect worker is drafting right now (src/lib/panel-graph.ts's
        `InboxDraftingItem`).
      required:
        - proposalId
        - summary
        - plain
        - spawnedAt
      properties:
        proposalId:
          type: string
        summary:
          type: string
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        spawnedAt:
          type: string
          description: When the drafting worker was spawned; an empty string when unrecorded.

    InboxNotReadyItem:
      type: object
      description: >
        W1-T2604: one not-ready proposal with the exact predicate failures that hold it
        (src/lib/panel-graph.ts's `InboxNotReadyItem`). Carries no affordance.
      required:
        - proposalId
        - summary
        - plain
        - reasons
      properties:
        proposalId:
          type: string
        summary:
          type: string
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/InboxPredicateFailure"

    InboxDeclinedItem:
      type: object
      description: >
        W1-T3408: one DECLINED proposal (src/lib/panel-graph.ts's `InboxDeclinedItem`), so
        POST /v1/inbox/restore's argument is discoverable. Nothing here is actionable except restore.
      required:
        - proposalId
        - summary
        - plain
        - reason
      properties:
        proposalId:
          type: string
        summary:
          type: string
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        reason:
          type: string
          description: The latest `panel.proposal_declined` row's reason, verbatim.

    InboxNeedsYou:
      type: object
      description: >
        W1-T4086: the operator-owned subset of each lane (`inboxOwner(...) === "operator"`),
        built by GET /v1/inbox's handler from the same four arrays.
      required:
        - ready
        - drafting
        - notReady
        - declined
      properties:
        ready:
          type: array
          items:
            $ref: "#/components/schemas/InboxReadyItem"
        drafting:
          type: array
          items:
            $ref: "#/components/schemas/InboxDraftingItem"
        notReady:
          type: array
          items:
            $ref: "#/components/schemas/InboxNotReadyItem"
        declined:
          type: array
          items:
            $ref: "#/components/schemas/InboxDeclinedItem"

    InboxFleetItem:
      type: object
      description: >
        W1-T4086/W1-T4089: one fleet-owned proposal with the lane it sits in and the fleet lane's
        latest decision, when it has made one (src/lib/panel-graph.ts's `InboxFleetItem`).
      required:
        - proposalId
        - summary
        - plain
        - lane
      properties:
        proposalId:
          type: string
        summary:
          type: string
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        lane:
          type: string
          enum:
            - ready
            - drafting
            - notReady
            - declined
        decision:
          type: string
          description: The fleet lane's latest decision (src/lib/fleet-lane.ts's `FleetLaneDecision`).
          enum:
            - file
            - merge
        reason:
          type: string
          description: That decision's plain reason; present exactly when `decision` is.

    InboxResult:
      type: object
      description: >
        GET /v1/inbox's body (src/lib/panel-graph.ts's `buildInboxRoute`). Deferred, ratified and
        retired proposals are never returned. The four top-level lanes hold every owner's items;
        `needsYou` and `fleet` split them by who must act. `declined`, `needsYou` and `fleet` are
        optional ONLY because the console cache's cold fallback body (serve.ts's
        `fallbackBodyForCachedRead`) carries just `ready`, `drafting` and `notReady`; every
        handler-computed body carries all six.
      required:
        - ready
        - drafting
        - notReady
      properties:
        ready:
          type: array
          items:
            $ref: "#/components/schemas/InboxReadyItem"
        drafting:
          type: array
          items:
            $ref: "#/components/schemas/InboxDraftingItem"
        notReady:
          type: array
          items:
            $ref: "#/components/schemas/InboxNotReadyItem"
        declined:
          type: array
          items:
            $ref: "#/components/schemas/InboxDeclinedItem"
        needsYou:
          $ref: "#/components/schemas/InboxNeedsYou"
        fleet:
          type: array
          items:
            $ref: "#/components/schemas/InboxFleetItem"
        counts:
          $ref: "#/components/schemas/InboxCounts"
        staleness:
          $ref: "#/components/schemas/ConsoleResponseStaleness"

    InboxDigestEntry:
      type: object
      description: One stored daily digest (src/lib/serve.ts's `ConsoleInboxDigestEntry`).
      required:
        - ts
        - text
      properties:
        ts:
          type: string
        text:
          type: string

    InboxDigestsResult:
      type: object
      description: >
        GET /v1/inbox/digests's body (src/lib/serve.ts's `ConsoleInboxDigests`) -- the newest
        digests, up to the render window (`CONSOLE_INBOX_DIGEST_LIMIT`, 10), oldest first.
      required:
        - entries
        - omitted
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/InboxDigestEntry"
        omitted:
          type: integer
          description: Valid entries older than the render window that were left out.
        reason:
          type: string
          description: >
            Present only when the digest store could not be read or parsed; `entries` is then
            empty. A missing store is not an error and carries no reason.

    InboxThreadAction:
      type: string
      description: An action an inbox thread offers or records (src/lib/inbox-thread.ts's `InboxThreadAction`).
      enum:
        - approve
        - decline
        - edit
        - restore

    InboxThreadActionTaken:
      type: object
      description: What the daemon's responder did on a thread, and how to undo it.
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/InboxThreadAction"
        undo:
          type: string

    InboxThreadMessageExtra:
      type: object
      description: A stored thread message's structured extras (src/lib/inbox-thread.ts's `ThreadMessageExtra`).
      properties:
        did:
          $ref: "#/components/schemas/InboxThreadActionTaken"
        suggestedAction:
          $ref: "#/components/schemas/InboxThreadAction"
        question:
          type: boolean
          description: The message is one of the responder's bounded clarifying questions.
        operator:
          type: string
          description: The operator display name a reply was sent under (audit only).
        replyId:
          type: string
          description: The idempotency id POST /v1/inbox/thread/reply stored the reply under.

    InboxThreadMessage:
      type: object
      description: >
        One message on an inbox thread (src/lib/inbox-responder.ts's `ThreadMessageView`). Message
        `seq` 0 is the opening message, derived on read from the item's plain message and never
        stored; it alone carries `plain` and `actions`.
      required:
        - seq
        - from
        - text
        - ts
      properties:
        seq:
          type: integer
        from:
          type: string
          enum:
            - daemon
            - operator
        text:
          type: string
        ts:
          type:
            - integer
            - "null"
          description: Epoch milliseconds; null on the derived opening message.
        plain:
          $ref: "#/components/schemas/PlainInboxMessage"
        actions:
          type: array
          description: On the opening message -- the actions the item's current state allows.
          items:
            $ref: "#/components/schemas/InboxThreadAction"
        extra:
          $ref: "#/components/schemas/InboxThreadMessageExtra"

    InboxThreadSummary:
      type: object
      description: >
        One operator thread in GET /v1/inbox/threads (src/lib/inbox-responder.ts's
        `ThreadSummaryView`). A declined item is listed only once someone has written on its thread.
      required:
        - threadId
        - proposalId
        - headline
        - snippet
        - waitingOn
        - attention
        - lastActivity
        - messageCount
        - unread
      properties:
        threadId:
          type: string
          description: "`thread:<proposalId>::inbox::-::-` (src/lib/inbox-thread.ts's `inboxThreadId`)."
        proposalId:
          type: string
        headline:
          type: string
          description: The item's plain headline.
        snippet:
          type: string
          description: The latest message's first sentence, at most 160 characters.
        waitingOn:
          type: string
          description: "Last-speaker direction only; use attention for an actionable count."
          enum:
            - operator
            - daemon
        attention:
          type: string
          description: Current operator attention from proposal state and an explicit thread question.
          enum:
            - decision
            - reply
            - in_progress
            - history
            - awaiting_daemon
        lastActivity:
          type:
            - integer
            - "null"
          description: The latest message's epoch milliseconds; null when only the derived opening message exists.
        messageCount:
          type: integer
          description: Messages including the derived opening message.
        unread:
          type: boolean
          description: The daemon wrote last and the read mark is behind that message.

    InboxThreadsResult:
      type: object
      description: GET /v1/inbox/threads's body -- waiting-on-you first, then most recent activity.
      required:
        - threads
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/InboxThreadSummary"

    InboxAttentionCensusSourceState:
      type: string
      enum: [observed, partial, unavailable]

    InboxAttentionCensusFact:
      type: object
      required: [source, detail]
      properties:
        source:
          type: string
        detail:
          type: string

    InboxAttentionCensusItem:
      type: object
      required: [threadId, proposalId, kind, waitingOn, attention, classification, whyMe, sourceFacts]
      properties:
        threadId:
          type: string
        proposalId:
          type: string
        taskId:
          type: string
        kind:
          type: string
        waitingOn:
          type: string
          enum: [operator, daemon]
          description: Last-speaker direction, not proof of actionability.
        attention:
          type: string
          enum: [decision, reply, in_progress, history, awaiting_daemon]
        classification:
          type: string
          description: Current source classification or unavailable.
        whyMe:
          type: string
        sourceFacts:
          type: array
          items:
            $ref: "#/components/schemas/InboxAttentionCensusFact"
        retiredReason:
          type: string

    InboxAttentionCensusResult:
      type: object
      description: >
        Read-only core-daemon census. Snapshot counts may overcount actionability when a release
        source is missing; verifiedCounts are conservative lower bounds. No proposal is changed.
      required: [scope, state, countSemantics, snapshotKey, sources, counts, decisionReadiness, verifiedCounts, kinds, items]
      properties:
        scope:
          type: string
          enum: [core]
        state:
          type: string
          enum: [complete, partial]
        countSemantics:
          type: string
          enum: [observed_snapshot_not_verified]
        snapshotKey:
          type: string
          description: Deterministic SHA-256 of the source-qualified response before this field.
        sources:
          type: object
          required: [plan, registry, liveLedger, archiveLedger, githubProjection]
          properties:
            plan:
              $ref: "#/components/schemas/InboxAttentionCensusSourceState"
            registry:
              $ref: "#/components/schemas/InboxAttentionCensusSourceState"
            liveLedger:
              $ref: "#/components/schemas/InboxAttentionCensusSourceState"
            archiveLedger:
              description: >
                Partial even when all retained rotations are readable: the available corpus does not
                prove there were no earlier release receipts before its oldest file.
              $ref: "#/components/schemas/InboxAttentionCensusSourceState"
            githubProjection:
              $ref: "#/components/schemas/InboxAttentionCensusSourceState"
        counts:
          type: object
          description: Observed current thread population, not a verified actionable count when partial.
          required: [decision, reply, in_progress, history, awaiting_daemon]
          properties:
            decision:
              type: integer
            reply:
              type: integer
            in_progress:
              type: integer
            history:
              type: integer
            awaiting_daemon:
              type: integer
        decisionReadiness:
          type: object
          description: >
            Classification of observed decision-labelled items. These categories sum to counts.decision;
            ready does not imply that operator judgment is required, and needsPreparation is not a
            dismissal instruction. All values are observational under partial source coverage.
          required: [ready, needsPreparation, unknown]
          properties:
            ready:
              type: integer
              minimum: 0
            needsPreparation:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
        verifiedCounts:
          type: object
          description: Conservative lower bounds; zero when any needed source is partial.
          required: [decision, reply, in_progress, history, awaiting_daemon]
          properties:
            decision:
              type: integer
            reply:
              type: integer
            in_progress:
              type: integer
            history:
              type: integer
            awaiting_daemon:
              type: integer
        kinds:
          type: object
          additionalProperties:
            type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxAttentionCensusItem"
        discrepancy:
          type: string
          enum: [active_human_ask_has_release_receipt]

    InboxThreadDetail:
      type: object
      description: >
        GET /v1/inbox/thread's body (src/lib/inbox-responder.ts's `ThreadDetailView`, which
        extends `ThreadSummaryView`; flattened here because this generator's subset has no allOf).
      required:
        - threadId
        - proposalId
        - headline
        - snippet
        - waitingOn
        - attention
        - lastActivity
        - messageCount
        - unread
        - details
        - messages
      properties:
        threadId:
          type: string
        proposalId:
          type: string
        headline:
          type: string
        snippet:
          type: string
        waitingOn:
          type: string
          enum:
            - operator
            - daemon
        attention:
          type: string
          enum:
            - decision
            - reply
            - in_progress
            - history
            - awaiting_daemon
        lastActivity:
          type:
            - integer
            - "null"
        messageCount:
          type: integer
        unread:
          type: boolean
        details:
          type: string
          description: The raw proposal summary, for the console's Details.
        messages:
          type: array
          description: Oldest first; `seq` 0 is the derived opening message.
          items:
            $ref: "#/components/schemas/InboxThreadMessage"

    InboxThreadReplyRequest:
      type: object
      description: POST /v1/inbox/thread/reply's body (src/lib/panel-graph.ts's `validateThreadReply`).
      required:
        - threadId
        - text
      properties:
        threadId:
          type: string
          description: An inbox thread id, `thread:<proposalId>::inbox::-::-`.
        text:
          type: string
          maxLength: 4000
          description: Must be non-blank; stored trimmed.
        intentId:
          type: string
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
          description: >
            Client idempotency key. The same caller token, thread and intentId always derive the
            same `replyId`, so a retry is answered `duplicate: true` rather than appended twice.

    InboxThreadReplyResult:
      type: object
      description: >
        POST /v1/inbox/thread/reply's 200 body. `delivery: delivered` means the reply is in the
        thread store; `audit` says separately whether its `inbox.thread_replied` ledger row was
        written (`recorded`), could not be written (`gap`), or could not be confirmed either way
        for a duplicate (`unverified`).
      required:
        - ok
        - delivery
        - audit
        - replyId
        - threadId
        - waitingOn
        - duplicate
      properties:
        ok:
          type: boolean
        delivery:
          type: string
          enum:
            - delivered
        audit:
          type: string
          enum:
            - recorded
            - gap
            - unverified
        replyId:
          type: string
        threadId:
          type: string
        waitingOn:
          type: string
          enum:
            - daemon
        duplicate:
          type: boolean
          description: True when this replyId was already stored with the same text.

    InboxThreadReplyRefusal:
      type: object
      description: >
        A non-2xx body from POST /v1/inbox/thread/reply's handler. `delivery` says whether the
        reply is known not to be stored (`not_delivered`) or cannot be confirmed (`unverified`).
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - not_found
            - reply_store_unavailable
            - reply_intent_conflict
            - reply_in_progress
        detail:
          type: string
        delivery:
          type: string
          enum:
            - not_delivered
            - unverified
        replyId:
          type: string
        priorReplyId:
          type: string
          description: On `reply_intent_conflict` -- the stored reply's id, whose text differs from this one.

    InboxThreadReadRequest:
      type: object
      description: POST /v1/inbox/thread/read's body (src/lib/panel-graph.ts's `validateThreadRead`).
      required:
        - threadId
        - seq
      properties:
        threadId:
          type: string
        seq:
          type: integer
          minimum: 0
          description: Mark read up to and including this message; must not exceed the thread's last `seq`.

    InboxOkResult:
      type: object
      description: "A bare acknowledgement: `{ ok: true }`."
      required:
        - ok
      properties:
        ok:
          type: boolean

    InboxProposalRequest:
      type: object
      description: POST /v1/inbox/approve's body (src/lib/panel-graph.ts's `validateApproveProposal`).
      required:
        - proposalId
      properties:
        proposalId:
          type: string
          description: A proposal id from the active registry; must be non-blank.

    InboxReframeRequest:
      type: object
      description: POST /v1/inbox/reframe's body (src/lib/panel-graph.ts's `validateReframeProposal`).
      required:
        - proposalId
        - feedback
      properties:
        proposalId:
          type: string
        feedback:
          type: string
          description: The operator's feedback, captured verbatim; must be non-blank.

    InboxVerdictRequest:
      type: object
      description: >
        POST /v1/inbox/decline's and POST /v1/inbox/restore's body (src/lib/panel-graph.ts's
        `validateDeclineProposal`, shared by both). `reason` is required on restore too.
      required:
        - proposalId
        - reason
      properties:
        proposalId:
          type: string
        reason:
          type: string
          description: Recorded verbatim on the `panel.proposal_declined` / `panel.proposal_restored` row; must be non-blank.

    InboxProposalStartedResult:
      type: object
      description: >
        POST /v1/inbox/approve's and POST /v1/inbox/reframe's 200 body. `started` confirms only
        the hand-off to a detached `rmd approve` / `rmd reframe`; the resulting PR surfaces
        through the console's own polling.
      required:
        - ok
        - proposalId
        - started
      properties:
        ok:
          type: boolean
        proposalId:
          type: string
        started:
          type: boolean

    InboxDeclineResult:
      type: object
      description: POST /v1/inbox/decline's 200 body.
      required:
        - ok
        - proposalId
        - declined
      properties:
        ok:
          type: boolean
        proposalId:
          type: string
        declined:
          type: boolean

    InboxRestoreResult:
      type: object
      description: POST /v1/inbox/restore's 200 body.
      required:
        - ok
        - proposalId
        - restored
      properties:
        ok:
          type: boolean
        proposalId:
          type: string
        restored:
          type: boolean

    InboxRefusal:
      type: object
      description: >
        A handler-level refusal from an inbox route, always with a human-readable `detail`.
        `not_found` (no active proposal / no current operator thread), `not_ready` (approve of a
        proposal not currently READY -- detail is `refusalReason`), `already_ratified`,
        `already_declined`, `not_declined` (src/lib/inbox.ts's `applyProposalVerdict`),
        `seq_ahead` (a read mark past the last message), `thread_store_unreadable`.
      required:
        - error
        - detail
      properties:
        error:
          type: string
          enum:
            - not_found
            - not_ready
            - already_ratified
            - already_declined
            - not_declined
            - seq_ahead
            - thread_store_unreadable
        detail:
          type: string

    EscalationReplyRequest:
      type: object
      description: >
        POST /v1/escalation/reply's body (src/lib/panel-actions.ts's `validateEscalationReply`).
        `taskId`, `class`, `cause` and `prRef` derive the escalation's thread id
        (`thread:<taskId>::<class>::<cause|->::<prRef|->`, src/lib/inbox-thread.ts's `deriveThreadId`).
      required:
        - taskId
        - class
        - text
      properties:
        taskId:
          type: string
        class:
          type: string
        cause:
          type: string
        prRef:
          type: string
          description: A bare PR number string, as escalate.ts's `extractPrRef` keys it.
        text:
          type: string
          description: The prose reply; must be non-blank.

    ClarifyingQuestion:
      type: object
      description: One clarification the reply interpreter asks (src/lib/reply-interpreter.ts's `ClarifyingQuestion`).
      required:
        - id
        - question
        - established
      properties:
        id:
          type: string
        question:
          type: string
        established:
          type: string
          description: What research already established before asking.

    ReplyInterpretation:
      type: object
      description: >
        src/lib/reply-interpreter.ts's `InterpretReplyResult`, a union discriminated by `status`,
        flattened because this generator's subset has no oneOf: `question` is present exactly
        when `status` is `clarifying`, `unresolved` exactly when it is `exhausted`, and neither
        when it is `understood`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - understood
            - clarifying
            - exhausted
        question:
          $ref: "#/components/schemas/ClarifyingQuestion"
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/ClarifyingQuestion"

    EscalationReplyResult:
      type: object
      description: >
        POST /v1/escalation/reply's 200 body. `feedback` is the entry `captureFeedback` wrote
        (origin `ui`, keyed to the thread); `interpretation` is what the reply interpreter
        decided, and a clarifying question or exhaustion report has already been appended to the
        thread when it is not `understood`.
      required:
        - ok
        - taskId
        - threadId
        - feedback
        - interpretation
      properties:
        ok:
          type: boolean
        taskId:
          type: string
        threadId:
          type: string
        feedback:
          $ref: "#/components/schemas/FeedbackEntry"
        interpretation:
          $ref: "#/components/schemas/ReplyInterpretation"

    EscalationOptionRoute:
      type: string
      description: >
        The closed set of routes a signed escalation answer link may name, each at the write tier
        serve.ts registers for it (src/lib/escalate.ts's `ESCALATION_OPTION_ROUTES`).
      enum:
        - /v1/manual/approve
        - /v1/drain/kick
        - /v1/drain/run
        - /v1/inbox/approve
        - /v1/skills/run
        - /v1/control/pause
        - /v1/control/resume
        - /v1/control/stop
        - /v1/escalation/mark-handled
        - /v1/questions/answer
        - /v1/drain/feedback
        - /v1/auth/scope

    EscalationLinkAnswerResult:
      type: object
      description: >
        POST /v1/escalation/answer's 200 body. The answer is recorded as a reply on the
        escalation's own thread (`answered by link: <route>`); the named route is NOT executed.
      required:
        - ok
        - escalationId
        - route
      properties:
        ok:
          type: boolean
        escalationId:
          type: string
        route:
          $ref: "#/components/schemas/EscalationOptionRoute"

    EscalationLinkRefusal:
      type: object
      description: >
        A JSON refusal from the signed escalation-link routes (src/lib/escalate.ts's
        `OptionLinkRefusal` plus the handler's own): `forged` (403, the signature does not
        verify), `bad-request` / `expired` / `already-used` (410), `invalid_request` (400, no
        thread store or no existing escalation thread -- the link is NOT consumed), `unavailable`
        (503, the signing secret could not be resolved).
      required:
        - error
        - detail
      properties:
        error:
          type: string
          enum:
            - bad-request
            - forged
            - expired
            - already-used
            - invalid_request
            - unavailable
        detail:
          type: string

    # ── W1-T4611: the fleet-control writes and ingress -- request/response bodies derived from
    # each handler's own validator and `sendJson` payload (src/lib/service.ts, panel-actions.ts,
    # panel-graph.ts, operator-notes.ts, serve.ts, provider-routing-policy.ts,
    # operator-merge-hold.ts, github-event-wake.ts).

    HighTierRefusal:
      type: object
      description: >
        The 403 body a HIGH-tier write returns from src/lib/service.ts's dispatch gate, before its
        handler runs. `forbidden` -- the credential lacks write scope (`required_scope`) or its
        granted write tier is below HIGH (`required_tier: high`; the bearer write token is pinned
        at LOW, so only a stepped-up operator session reaches HIGH). `confirm_nonce_required` --
        the tier was granted but no `X-Confirm-Nonce` was presented, or the nonce was unknown,
        expired (5 minutes), already spent, or bound to a different method, path or raw body.
        W1-T4642 folded W1-T4612's `HighTierForbidden` schema into this one: the two differed
        only by `consequenceId`.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - forbidden
            - confirm_nonce_required
        required_scope:
          type: string
          enum:
            - read
            - write
        required_tier:
          type: string
          enum:
            - low
            - middle
            - high
        consequenceId:
          type: string
          description: >
            Present only on POST /v1/operator-agent/consequences/decision's own missing-nonce
            refusal, naming the pending consequence it refused.

    ConfirmNonceRequest:
      type: object
      description: >
        POST /v1/confirm's body (src/lib/service.ts's `validateConfirmNonceRequest`) -- names the
        exact HIGH-tier call the returned nonce will authorize. The nonce is consumed only by a
        request whose method, path and RAW body bytes equal these fields exactly.
      required:
        - method
        - path
        - payload
      properties:
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          description: The target route's path; must start with `/`.
        payload:
          type: string
          description: >
            The exact raw request body the HIGH-tier call will send, byte for byte (an empty
            string for a call with no body). It is compared verbatim, never JSON-normalised.

    ConfirmNonceResult:
      type: object
      description: >
        POST /v1/confirm's 200 body. `nonce` is single-use (a wrong guess spends it too) and
        expires 5 minutes after issue (src/lib/service.ts's `CONFIRM_NONCE_TTL_MS`).
      required:
        - nonce
      properties:
        nonce:
          type: string
          description: 48 hex characters; present it as the `X-Confirm-Nonce` header.

    DrainFeedbackRequest:
      type: object
      description: >
        POST /v1/drain/feedback's body (src/lib/panel-actions.ts's `validateDrainFeedback`) --
        the post-drain rundown's one-tap verdict on one task (W1-T141).
      required:
        - taskId
        - verdict
        - drainRunId
      properties:
        taskId:
          type: string
        verdict:
          type: string
          enum:
            - good
            - wrong
            - needs-follow-up
        drainRunId:
          type: string
        note:
          type: string
          description: >
            W1-T435 steering note, at most 2000 characters (a longer one is a 400, never
            truncated). Quoted into the next fix-rung dispatch only for `wrong` or
            `needs-follow-up`.

    DrainFeedbackResult:
      type: object
      required:
        - ok
        - taskId
        - verdict
      properties:
        ok:
          type: boolean
          enum:
            - true
        taskId:
          type: string
        verdict:
          type: string
          enum:
            - good
            - wrong
            - needs-follow-up

    KickRequest:
      type: object
      description: >
        POST /v1/drain/kick's body (src/lib/panel-actions.ts's `validateTaskId`). `taskId` must be
        a non-empty id safe to embed in a marker filename: `^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$`
        with no `..` (src/lib/fleet-control.ts's `isSafeTaskId`).
      required:
        - taskId
      properties:
        taskId:
          type: string

    KickResult:
      type: object
      description: >
        The kick marker was written. `armed` records intent only -- the daemon's own
        `assertRunnable`-gated dispatch (or refusal) happens at its next poll.
      required:
        - armed
        - taskId
      properties:
        armed:
          type: boolean
          enum:
            - true
        taskId:
          type: string

    DrainNowResult:
      type: object
      description: >
        The `DRAIN_REQUESTED` marker was written; the daemon runs one dispatch cycle at its next
        poll. Records intent only.
      required:
        - armed
      properties:
        armed:
          type: boolean
          enum:
            - true

    DrainPreviewEdge:
      type: object
      description: One dependency edge on a drain-preview card (src/lib/drain.ts's `DependencyEdge`).
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
          description: The linked task's title, or its id when the plan does not carry it.

    DrainPreviewCard:
      type: object
      description: One would-drain task card (src/lib/drain.ts's `DrainPreviewCard`, W1-T140).
      required:
        - id
        - title
        - description
        - dependsOn
        - dependents
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: The task's plan `note`, or an empty string when it has none.
        dependsOn:
          type: array
          description: Incoming edges -- this task's own `depends_on`.
          items:
            $ref: "#/components/schemas/DrainPreviewEdge"
        dependents:
          type: array
          description: Outgoing edges -- tasks that DIRECTLY declare this task as a dependency (one hop).
          items:
            $ref: "#/components/schemas/DrainPreviewEdge"

    DrainPreviewResult:
      type: object
      description: GET /v1/drain/preview's body -- the would-drain queue in dispatch order.
      required:
        - cards
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DrainPreviewCard"

    FeedbackPreviewRequest:
      type: object
      description: >
        POST /v1/feedback/preview's body (src/lib/panel-graph.ts's `validatePreviewFeedback`).
        `replyTo`, when present, must name a feedback entry parked at `grilling`, the same rule
        POST /v1/feedback applies.
      required:
        - text
      properties:
        text:
          type: string
          description: The draft; must be non-blank.
        replyTo:
          type: string
          description: A feedback entry id; non-blank when present.

    FeedbackPreviewResult:
      type: object
      description: >
        POST /v1/feedback/preview's 200 body. `expansion` is null when no expander is wired, the
        expander threw, or its output failed src/lib/feedback.ts's `validateFeedbackExpansion`
        bounds -- fail-open, since the console files the draft plain. Nothing is filed either way.
      required:
        - expansion
      properties:
        expansion:
          type:
            - object
            - "null"
          description: src/lib/feedback.ts's `FeedbackExpansion`.
          required:
            - claim
            - evidence
            - recon
            - falsifying_check
          properties:
            claim:
              type: string
              description: A falsifiable, plain-language headline; at most 300 characters.
            evidence:
              type: string
              description: Only measured/verbatim specifics the operator stated; may be empty; at most 800 characters.
            recon:
              type: array
              description: At most 10 directives, each at most 300 characters.
              items:
                type: string
            falsifying_check:
              type: string
              description: What observation would retire this claim; at most 300 characters.

    GithubWebhookPayload:
      type: object
      description: >
        A GitHub webhook delivery body. Its shape is GitHub's and genuinely open-ended per event;
        the handler reads only the two fields declared here. Anything else is carried through
        unread except for `check_run` classification (name, conclusion, head sha).
      properties:
        action:
          type: string
          description: The event's action, when the event has one (`status` does not).
        repository:
          type: object
          properties:
            full_name:
              type: string
              description: Must equal this daemon's own `owner/repo`, or the delivery is a 403.

    GithubWebhookReceipt:
      type: object
      description: >
        POST /v1/hooks/github's 202 body -- one of four shapes, all a 2xx so GitHub never retries:
        `{accepted: true}` (the sweep-wake marker was written or coalesced),
        `{accepted: false, reason: successful_leaf}` (semantic enforce mode: a successful leaf
        check run, recorded for dedup but no wake), `{duplicate: true}` (this delivery id was
        already seen; nothing re-written), or `{error: ignored}` (an event/action outside the
        allowlist; nothing written).
      properties:
        accepted:
          type: boolean
        reason:
          type: string
          enum:
            - successful_leaf
        duplicate:
          type: boolean
          enum:
            - true
        error:
          type: string
          enum:
            - ignored

    GithubWebhookRefusal:
      type: object
      description: >
        POST /v1/hooks/github's refusal body (src/lib/github-event-wake.ts's
        `createGitHubEventWakeHandler`), checked in this order: `webhook_not_configured` (503, no
        secret configured -- the route ships dark), `body_too_large` (413, over 1 MiB),
        `invalid_signature` (401), `invalid_json` (400), `repository_mismatch` (403),
        `missing_delivery_id` (400).
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - webhook_not_configured
            - body_too_large
            - invalid_signature
            - invalid_json
            - repository_mismatch
            - missing_delivery_id

    MergeHoldRequest:
      type: object
      description: >
        POST /v1/merge-hold's body (src/lib/panel-actions.ts's `validateConsoleMergeHold`).
        Unknown fields are refused. There is deliberately no identity field: the recorded `by` is
        the authenticated caller, never the payload.
      required:
        - action
        - reason
      properties:
        action:
          type: string
          enum:
            - engage
            - release
        reason:
          type: string
          description: Non-blank; stored trimmed.
        prNumber:
          type: integer
          description: A positive integer. Omitted means the whole fleet.
        taskId:
          type: string
          description: A `W1-T<n>` id -- board enrichment only, valid only with `prNumber`.

    AutomergeHold:
      type: object
      description: The current durable merge hold for a scope (src/lib/review.ts's `AutomergeHold`).
      required:
        - by
        - reason
      properties:
        by:
          type: string
        reason:
          type: string

    MergeHoldResult:
      type: object
      description: >
        src/lib/operator-merge-hold.ts's `OperatorMergeHoldResult`. A release of an already-clear
        scope is an idempotent no-op: `written: false` and neither `prior` nor `current`.
      required:
        - action
        - scope
        - written
      properties:
        action:
          type: string
          enum:
            - engage
            - release
        scope:
          type: string
          description: "`the whole fleet` or `PR #<n>`."
        written:
          type: boolean
        prior:
          $ref: "#/components/schemas/AutomergeHold"
        current:
          $ref: "#/components/schemas/AutomergeHold"

    MergeHoldRefusal:
      type: object
      description: >
        POST /v1/merge-hold's 403 body: the dispatch gate's HIGH-tier refusals (see
        HighTierRefusal), plus `bearer_provenance_required` from the handler itself when the
        caller's identity resolves to `unknown`, so no hold is ever written anonymously.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - forbidden
            - confirm_nonce_required
            - bearer_provenance_required
        required_scope:
          type: string
          enum:
            - read
            - write
        required_tier:
          type: string
          enum:
            - low
            - middle
            - high

    OperatorNote:
      type: object
      description: One provenance-stamped operator guidance note (src/lib/operator-notes.ts's `OperatorNoteEntry`).
      required:
        - ts
        - taskId
        - author
        - note
      properties:
        ts:
          type: string
          format: date-time
          description: Stamped server-side at write time, never client-supplied.
        taskId:
          type: string
        author:
          type: string
        note:
          type: string

    OperatorNotesResult:
      type: object
      description: >
        GET /v1/operator-notes's body -- only the notes scoped to exactly `taskId`, oldest first;
        an empty list when none exist.
      required:
        - taskId
        - notes
      properties:
        taskId:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/OperatorNote"

    AddOperatorNoteRequest:
      type: object
      description: >
        POST /v1/operator-notes/add's body (src/lib/operator-notes.ts's `validateAddOperatorNote`).
        `taskId` must be a safe task id (src/lib/fleet-control.ts's `isSafeTaskId`); `author` and
        `note` must be non-blank and are stored trimmed.
      required:
        - taskId
        - author
        - note
      properties:
        taskId:
          type: string
        author:
          type: string
        note:
          type: string

    AddOperatorNoteResult:
      type: object
      required:
        - ok
        - taskId
        - author
        - ts
      properties:
        ok:
          type: boolean
          enum:
            - true
        taskId:
          type: string
        author:
          type: string
        ts:
          type: string
          format: date-time

    OperatorNoteWriteFailure:
      type: object
      description: The note store could not be appended to; nothing was ledgered.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - write_failed

    RecordJudgeLabelRequest:
      type: object
      description: >
        POST /v1/judge-labels's body (src/lib/judge-calibration.ts's `validateJudgeLabelBody`).
        `verdictRef` must match `JUDGE_VERDICT_REF_RE` (`jv-` and 16 lowercase hex digits, as
        judge-calibration-v1's `sample[].verdictRef` carries it); `labeller` must be non-blank and
        is stored trimmed. Any timestamp in the body is ignored.
      required:
        - verdictRef
        - label
        - labeller
      properties:
        verdictRef:
          type: string
          pattern: "^jv-[0-9a-f]{16}$"
        label:
          type: string
          enum:
            - pass
            - fail
        labeller:
          type: string

    RecordJudgeLabelResult:
      type: object
      required:
        - ok
        - verdictRef
        - label
        - labeller
        - labelledAt
        - sampleMembership
      properties:
        ok:
          type: boolean
          enum:
            - true
        verdictRef:
          type: string
        label:
          type: string
          enum:
            - pass
            - fail
        labeller:
          type: string
        labelledAt:
          type: string
          format: date-time
        sampleMembership:
          type: string
          description: >
            Whether `verdictRef` is in the labelling queue the last analytics refresh drew.
            `sample-unavailable` when no refresh has drawn one yet.
          enum:
            - in-sample
            - out-of-sample
            - sample-unavailable

    JudgeLabelWriteFailure:
      type: object
      description: The judge label store could not be read or written; nothing was ledgered.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - write_failed

    SetDailyCostCeilingRequest:
      type: object
      description: >
        POST /v1/policy/daily-cost-ceiling's body. The route adds no bounds check of its own: the
        store refuses a non-finite value or one outside plan/policy.yaml's
        `sweep.dailyCostCeilingUsd` bound with a 400, never clamping it.
      required:
        - usd
      properties:
        usd:
          type: number

    DailyCostCeilingResult:
      type: object
      description: >
        The RESOLVED effective ceiling after the write (src/lib/policy.ts's
        `resolveDailyCostCeiling`), never the input echoed back. `provenance: default` after a set
        means the store could not honour it.
      required:
        - ok
        - usd
        - provenance
        - committedDefaultUsd
      properties:
        ok:
          type: boolean
          enum:
            - true
        usd:
          type: number
        provenance:
          type: string
          enum:
            - overridden
            - default
        committedDefaultUsd:
          type: number
          description: plan/policy.yaml's committed default, carried so an override shows what it replaced.

    ProviderRoutingPolicyOverrideRequest:
      type: object
      description: >
        POST /v1/policy/provider-routing's body (src/lib/provider-routing-policy.ts's
        `ProviderRoutingPolicyOverrideInput`; the store is the one schema authority, so every
        rule below is a 400 from it). Exactly these keys -- `codexModelPreference` may be omitted
        (legacy payload, automatic selection). `enabledProviders` is non-empty, duplicate-free
        and a subset of the committed host config; `preference` is `automatic` or an enabled,
        unparked provider; `reservePercent` is 0-50; `expiresAt` is a canonical ISO timestamp in
        the future and at most 24 hours away; each park names an enabled provider once with an
        `until` in the future and no later than `expiresAt`, and at least one provider stays
        unparked; a Codex model preference needs Codex enabled and unparked, and must match a
        fresh, mapped, eligible option in the daemon's Codex model inventory.
      required:
        - enabledProviders
        - preference
        - reservePercent
        - parks
        - expiresAt
      properties:
        enabledProviders:
          type: array
          items:
            type: string
            enum:
              - claude
              - codex
              - cash
              - openweight
        preference:
          type: string
          enum:
            - automatic
            - claude
            - codex
            - cash
            - openweight
        reservePercent:
          type: number
        parks:
          type: array
          items:
            $ref: "#/components/schemas/ProviderPark"
        codexModelPreference:
          type:
            - object
            - "null"
          required:
            - capability
            - effort
            - model
          properties:
            capability:
              type: string
              enum:
                - economy
                - balanced
                - frontier
            effort:
              type: string
            model:
              type: string
        expiresAt:
          type: string
          format: date-time

    CommittedProviderRoutingPolicy:
      type: object
      description: The committed host policy an override narrows (src/lib/provider-routing-policy.ts's `CommittedProviderRoutingPolicy`).
      required:
        - enabledProviders
        - preference
        - reservePercent
        - parks
        - codexModelPreference
      properties:
        enabledProviders:
          type: array
          items:
            type: string
            enum:
              - claude
              - codex
              - cash
              - openweight
        preference:
          type: string
          enum:
            - automatic
        reservePercent:
          type: number
        parks:
          type: array
          description: Always empty -- the committed policy parks nothing.
          items:
            $ref: "#/components/schemas/ProviderPark"
        codexModelPreference:
          type:
            - object
            - "null"
          description: Always null -- the committed policy selects Codex models automatically.

    EffectiveProviderRoutingPolicy:
      type: object
      description: >
        The policy the next dispatch will use (src/lib/provider-routing-policy.ts's
        `resolveProviderRoutingPolicy`). Every invalid stored state fails closed to the committed
        config with `provenance: default` and a `fallback.reason`.
      required:
        - provenance
        - committed
        - enabledProviders
        - routableProviders
        - preference
        - reservePercent
        - parks
      properties:
        provenance:
          type: string
          enum:
            - default
            - overridden
        committed:
          $ref: "#/components/schemas/CommittedProviderRoutingPolicy"
        enabledProviders:
          type: array
          items:
            type: string
            enum:
              - claude
              - codex
              - cash
              - openweight
        routableProviders:
          type: array
          description: Enabled providers after active parks are applied.
          items:
            type: string
            enum:
              - claude
              - codex
              - cash
              - openweight
        preference:
          type: string
          enum:
            - automatic
            - claude
            - codex
            - cash
            - openweight
        reservePercent:
          type: number
        parks:
          type: array
          description: Only parks still active at resolution time.
          items:
            $ref: "#/components/schemas/ProviderPark"
        codexModelPreference:
          $ref: "#/components/schemas/CodexModelPreference"
        overrideExpiresAt:
          type: string
          format: date-time
        writtenAt:
          type: string
          format: date-time
        writerFingerprint:
          type: string
        fallback:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
              enum:
                - unreadable
                - malformed
                - unsupported-version
                - expired
                - incompatible-with-config

    ProviderRoutingPolicyWriteResult:
      type: object
      description: The resolved policy after a set or clear; it takes effect on the next dispatch, not in flight.
      required:
        - ok
        - effective
        - policy
      properties:
        ok:
          type: boolean
          enum:
            - true
        effective:
          type: string
          enum:
            - next dispatch
        policy:
          $ref: "#/components/schemas/EffectiveProviderRoutingPolicy"

    ProviderRoutingPolicyRefusal:
      type: object
      description: >
        A provider-routing policy write refused before anything was written or cleared.
        `invalid_request` (400, the body failed the store's validation), `codex_model_not_eligible`
        (400, the requested Codex model is not a fresh, mapped, eligible option),
        `provider_policy_unavailable` (409, the daemon has not published a committed
        provider-policy projection yet), `codex_model_inventory_stale` (409, a Codex model
        preference needs a fresh daemon-written model inventory).
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - codex_model_not_eligible
            - provider_policy_unavailable
            - codex_model_inventory_stale
        detail:
          type: string

    QuietHoursRequest:
      type: object
      description: POST /v1/quiet-hours's body (src/lib/panel-actions.ts's `validateQuietHours`).
      required:
        - enabled
      properties:
        enabled:
          type: boolean

    QuietHoursResult:
      type: object
      description: The quiet-hours flag as written.
      required:
        - quietHours
      properties:
        quietHours:
          type: boolean

  responses:
    Unauthorized:
      description: No or unrecognized bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: A recognized token whose granted scope does not cover this route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No route registered for this method + path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: The JSON body failed validation -- no side effect occurred (src/lib/panel-actions.ts's `jsonAction`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested proposal transition conflicts with the durable ledger state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperatorAgentConsequencesReadOnly:
      description: >
        The pending consequence approval list is read-only: every write verb on it is refused by
        name (`read_only`) and records nothing.
      headers:
        Allow:
          description: Always `GET`.
          schema:
            type: string
            enum: [GET]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorAgentConsequencesReadOnlyRefusal"

# W3-T2 (MASTER-PLAN §7, WS-5a): the read-only live board's first real business routes --
# a task/ledger-state snapshot (REST) and its live-update companion (SSE). Both are built on
# the v0 mechanism above (src/lib/service.ts) and existing projection logic (src/lib/status.ts)
# -- see src/lib/board.ts. Every OTHER route the design (plan render, worker stream tails,
# DECISIONS feed, escalation inbox, question backlog, cost meter) describes is explicit
# follow-on work, not added here.

    HighTierForbidden:
      description: >
        A HIGH-tier write refused by src/lib/service.ts's dispatch gate before its handler ran --
        missing write scope, a granted write tier below HIGH, or a missing/invalid/spent
        `X-Confirm-Nonce` (`confirm_nonce_required`). Nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HighTierRefusal"

  parameters:
    ConfirmNonce:
      name: X-Confirm-Nonce
      in: header
      required: true
      description: >
        A nonce from POST /v1/confirm naming this exact method, path and raw request body.
        Single-use, 5-minute TTL; consumed by src/lib/service.ts's dispatch gate before the
        handler runs whenever `enforceWriteTiers` is on (`rmd serve` turns it on).
      schema:
        type: string

# W3-T2 (MASTER-PLAN §7, WS-5a): the read-only live board's first real business routes --
# a task/ledger-state snapshot (REST) and its live-update companion (SSE). Both are built on
# the v0 mechanism above (src/lib/service.ts) and existing projection logic (src/lib/status.ts)
# -- see src/lib/board.ts. Every OTHER route the design (plan render, worker stream tails,
# DECISIONS feed, escalation inbox, question backlog, cost meter) describes is explicit
# follow-on work, not added here.
paths:
  /v1/analytics:
    get:
      summary: Read the internal benchmark evidence-quality projection.
      description: >
        This operation documents the benchmark-quality-v1 query only. The legacy full and
        console analytics projections remain available on the same route. Missing evidence is
        explicit; this endpoint performs no ledger scan, public upload, or routing change.
      parameters:
        - name: projectionVersion
          in: query
          required: true
          schema: { type: string, enum: [benchmark-quality-v1] }
      security:
        - bearerRead: []
      responses:
        "200":
          description: A versioned aggregate of retained evidence quality.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkQualityProjection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/provider-auth:
    post:
      summary: Start a server-owned provider browser-auth handoff.
      description: >
        Starts provider-auth-v1 for an opaque server-configured account profile. Codex uses the
        daemon-side app-server login flow and returns only an allowlisted browser authorization URL;
        Claude remains explicitly unsupported until a stable machine-facing handoff exists.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAuthStartRequest"
      responses:
        "200":
          description: The initial bounded session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      summary: Read a provider-auth-v1 session projection.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      security:
        - bearerRead: []
      responses:
        "200":
          description: The current bounded session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Cancel a provider-auth-v1 session.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      security:
        - bearerWrite: []
      responses:
        "200":
          description: The cancelled session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthProjection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/onboarding/repositories:
    get:
      summary: Read the complete paginated GitHub-token repository candidate inventory.
      description: >
        Read-only repository names visible to the daemon's current Fleet GitHub App installation
        token, or its user-token fallback. This is not onboarding readiness or activation evidence.
        The result is cached for at most 60 seconds and carries its actual observation time. An
        incomplete or failed listing returns 503 instead of a partial success.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Complete repository names visible to the current token.
          content:
            application/json:
              schema:
                type: object
                required: [state, source, observed_at, repositories, total_count]
                properties:
                  state: { type: string, enum: [verified] }
                  source: { type: string, enum: [fleet-app-installation, daemon-user-token] }
                  observed_at: { type: string, format: date-time }
                  repositories:
                    type: array
                    items: { type: string }
                  total_count: { type: integer, minimum: 0 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: GitHub access could not be read or the pagination result was incomplete.
          content:
            application/json:
              schema:
                type: object
                required: [state, reason]
                properties:
                  state: { type: string, enum: [unavailable] }
                  reason: { type: string, enum: [github_read_failed, incomplete_or_invalid_listing] }

  /v1/repos:
    get:
      summary: The repository portfolio for the console dashboard.
      description: >
        Registry instances plus the validated `.remudero/managed-repos.json` set, each with the
        seven-day ledger projection described on RepoDashboardEntry.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The portfolio, including an honest empty result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDashboardResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/repos/summary:
    get:
      summary: The operating repository's portfolio card, a few KB.
      description: >
        The same projection as GET /v1/repos restricted to the one repository this instance
        operates (mounted per instance at `/v1/i/<instance>/repos/summary`). It carries everything
        a portfolio card needs -- queue, run outcomes, error rate, alerts, active, spend, models and
        actions -- so a card needs neither the whole portfolio nor `/status`. Computed off the
        event loop from an incremental ledger index and persisted with serve's console snapshots,
        so a restart answers from the last snapshot (marked stale) while the index rebuilds.
      security:
        - bearerRead: []
      responses:
        "200":
          description: One operating repository, or an empty `repos` array when none is resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDashboardResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/registry:
    get:
      summary: The fleet's one registry -- projects, repos and instances, read-only.
      description: >
        W1-T4227. Parses `.remudero/daemon-instances.yaml` (parseInstanceRegistry) and reports
        drift against the fleet host's `/etc/remudero/daemon-instances.yaml` when that copy is
        readable. An unreadable or malformed host copy is a `hostRegistry` note, never an error.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The registry projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The repo registry could not be read or was refused by the parser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUnavailable"

  /v1/status:
    get:
      summary: The current board snapshot -- one StatusProjection per plan task.
      description: >
        Read-only live board (MASTER-PLAN §7, WS-5a -> W3-T2): the task-DAG live-state
        projection, computed via src/lib/status.ts's `projectPlan` over the current plan +
        ledger + GitHub (src/lib/board.ts's `computeBoardSnapshot`).
      security:
        - bearerRead: []
      responses:
        "200":
          description: The current board snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── W3-T5 (MASTER-PLAN §7, human-in-the-loop panel actions) -- write routes over the SAME
  # v0 mechanism (src/lib/service.ts), all write-scoped, all built by src/lib/panel-actions.ts.
  # Depends on W3-T2's board existing (the panel acts on what the board shows). Every write
  # is ledgered with the caller's bearer as `origin`, never the raw token (see
  # src/lib/panel-actions.ts's header). Real `rmd serve` CLI wiring is later work, same split
  # W3-T2's routes below already document.
  /v1/control/pause:
    post:
      summary: Pause the fleet (drain-and-hold) -- no new spawns; an in-flight task still finishes.
      description: >
        MASTER-PLAN §4A/§4B: writes the PAUSE flag (src/lib/fleet-control.ts's `requestPause`),
        checked at the top of every drain tick. Ledgers `panel.pause_requested`.
      security:
        - bearerWrite: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseRequest"
      responses:
        "200":
          description: PAUSE is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PauseResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/control/resume:
    post:
      summary: Resume the fleet -- clears BOTH STOP and PAUSE.
      description: >
        MASTER-PLAN §4A: the one command that always means go (src/lib/fleet-control.ts's
        `resumeFleet`). Ledgers `panel.resume_requested`. No request body.
      security:
        - bearerWrite: []
      responses:
        "200":
          description: STOP and PAUSE are both cleared (whichever were set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/control/stop:
    post:
      summary: STOP the fleet -- the hard kill, checked first, every tick.
      description: >
        MASTER-PLAN §4A/§4B: writes the STOP flag (src/lib/fleet-control.ts's `requestStop`),
        checked before PAUSE and before picking up any new task. "STOP from the panel halts the
        fleet within one tick" (W3-T5 acceptance) -- the SAME predicate drain.ts's loop already
        checks first. Ledgers `panel.stop_requested`.
      security:
        - bearerWrite: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          description: STOP is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/control/assistant-action:
    post:
      summary: Execute a reviewed assistant pause/resume/stop once per durable action ID on the core instance.
      description: >
        MIDDLE-tier write. The host-shared claim store binds actionId to the verified operator,
        exact instance, repository, action and reason before dispatch. Same-key retries return the first receipt or explicit
        unknown; changed payload refuses. A 503 may mean a post-claim interruption and must
        never be interpreted as a failed side effect safe to retry with a new ID.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantControlRequest"
      responses:
        "200":
          description: The first durable completion receipt, including on exact replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlReceipt"
        "202":
          description: Claimed but outcome unknown or in progress; no replay is dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlUnknown"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "The action ID binds another operator, target, or payload, or this route does not own the instance." }
        "503":
          description: Durable admission or completion unavailable; the outcome must be reconciled before any new action ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlUnknown"

  /v1/control/assistant-action/status:
    get:
      summary: Read the core assistant-control contract and served identity.
      description: >
        Requires a verified operator session. A configured claim root is not proof that
        all writers share one atomic store; admission and topology remain unverified.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Contract version, boot SHA, target, and qualified admission status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlCapability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/control/assistant-action/receipt:
    get:
      summary: Resolve one core assistant action without dispatching a side effect.
      description: >
        Requires the same verified operator and target as the original claim. An unreadable
        claim or receipt is unavailable, never a successful or safely retryable action.
      security:
        - bearerRead: []
      parameters:
        - name: actionId
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Durable completion receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlReceipt" }
        "202":
          description: Claimed but outcome unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No claim exists for this action ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "409":
          description: The action belongs to another operator or target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "503":
          description: Claim or receipt unreadable or incomplete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }

  /v1/questions/answer:
    post:
      summary: Answer a QUESTION-contract entry (MASTER-PLAN §2), attributed to the panel's bearer.
      description: >
        "An escalation answered FROM the panel appears in the ledger with the panel's bearer
        token as origin; the answer flows to the Architect" (W3-T5 acceptance) -- proof is the
        resulting `panel.question_answered` ledger line (src/lib/panel-actions.ts).
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionRequest"
      responses:
        "200":
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerQuestionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/manual/approve:
    post:
      summary: Approve (check off) a MANUAL-queue item -- closes its GitHub issue.
      description: >
        MASTER-PLAN §4: "the MANUAL queue doubles as the human's to-do list -- rendered in the
        control panel with check-off (= closing the issue)." Closes the named
        `escalation-manual`-labeled issue (src/lib/escalate.ts) FIRST, then ledgers
        `panel.manual_approved` -- a close that fails never produces a false-approved ledger line.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveManualRequest"
      responses:
        "200":
          description: The issue was closed and the approval recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveManualResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HighTierForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/pr-actions:
    post:
      summary: Queue one confirmed pull-request repair or review in this daemon instance.
      description: >
        W1-T3989: the console can request `fix` for an actionable red PR or `review` for a
        green PR waiting only for Remudero review. LOW tier, by W1-T4077's operator ruling
        (2026-09-22): the route executes nothing and takes no `X-Confirm-Nonce`, so the console's
        bearer write token (pinned at LOW) reaches it. The handler writes durable intent and
        returns immediately; the daemon consumes at most one request per poll through its
        existing `rmd fix` or `rmd review` command path, which keeps its own rails. A successful
        receipt is intentionally not a worker-start or PR-success claim.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrActionRequest"
      responses:
        "200":
          description: The selected daemon instance recorded a request for its next poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrActionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The requested action is switched off on this daemon; no request was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrActionSwitchedOff"

  /v1/escalation/mark-handled:
    post:
      summary: Mark an ESCALATION row handled -- closes its GitHub issue.
      description: >
        W1-T182: the NEEDS ME affordance an ESCALATION row (any class) actually supports --
        distinct from /v1/manual/approve's MANUAL-queue check-off, since "approve" has no
        defined verb for an escalation. Closes the named `needs-human`-labeled issue
        (src/lib/escalate.ts) FIRST, then ledgers `panel.escalation_marked_handled` -- a close
        that fails never produces a false-handled ledger line. Closing the issue does not, by
        itself, resolve the underlying block (the issue body says so); the row clears on the
        NEXT poll once GET /v1/status's live join (src/lib/status.ts) reads it CLOSED.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkEscalationHandledRequest"
      responses:
        "200":
          description: The issue was closed and the action recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkEscalationHandledResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── W3-T6 (MASTER-PLAN §7B) -- the plan->task->PR graph + interactive plan adjustment, over
  # the SAME v0 mechanism (src/lib/service.ts), built by src/lib/panel-graph.ts. Depends on
  # W3-T2's board (the panel this extends) and W1-T43's trace chain (src/lib/trace.ts). Every
  # write is ledgered with the caller's bearer as `origin`, via the SAME `appendPanelLedger`
  # primitive W3-T5's routes use. Real `rmd serve` CLI wiring is later work, same split every
  # route on this surface already documents.
  /v1/feedback:
    get:
      summary: The feedback inbox -- every captured entry, oldest first.
      description: >
        `plan/feedback/` (MASTER-PLAN §7B, W1-T40), listed via src/lib/feedback.ts's
        `listFeedback`. Optional `?status=` filters to one lifecycle status; `?limit=` and
        `?cursor=` answer one page of the (filtered) list with a `page` envelope.
      security:
        - bearerRead: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 500. Default 100 once `cursor` is given alone.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: The previous page's `page.nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackInboxResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Submit feedback from the panel -- ALWAYS captured with origin=ui.
      description: >
        "feedback submitted from the panel appears in the inbox with origin=ui and produces a
        proposal PR" (W3-T6 acceptance) -- captures via src/lib/feedback.ts's `captureFeedback`,
        ledgers `panel.feedback_submitted`. `replyTo` doubles this route as "answer a grill" v1
        (src/lib/panel-graph.ts's header).
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackRequest"
      responses:
        "200":
          description: The captured entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFeedbackResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/trace:
    get:
      summary: The plan->task->PR provenance graph for one task or feedback id.
      description: >
        "the panel renders the plan→task→PR graph" (W3-T6 acceptance) -- the SAME two-entry-
        point chain `rmd trace <id>` renders (W1-T43, src/lib/trace.ts), addressed by
        `?id=<task-id-or-feedback-id>` (v0 routing has no path params, src/lib/service.ts).
      security:
