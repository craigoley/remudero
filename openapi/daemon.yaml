          description: Bounded deletion receipt; raw private content is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/context-controls/revoke:
    post:
      summary: W1-T3893 self-service revoke — a thin named wrapper over POST /v1/operator-agent/context/revoke.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextActionRequest"
      responses:
        "200":
          description: Bounded revocation receipt.
          content:
            application/json:
