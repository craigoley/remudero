      responses:
        "201":
          description: Promotion registered.
        "200":
          description: Identical promotion already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
