        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Persist bounded operator-agent settings.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentSettingsRequest"
      responses:
        "200":
          description: Settings persisted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/operator-agent/experiments:
    get:
      summary: Read durable self-improvement experiment-v1 history.
      description: >
        Returns the append-only experiment record, approval decision, measured outcome, and
        rollback events across the live ledger and supported rotated ledger files. Approval is
        never presented as measured success; weak attribution is returned as unmeasurable.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable experiment history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentExperimentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register a bounded, falsifiable self-improvement experiment.
      description: >
        Records the hypothesis, intervention, baseline, scope, observation window, and rollback
        path before any operator decision. The durable version is experiment-v1 and excludes raw
        credentials or unbounded model prose.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentExperimentRegistration"
      responses:
        "201":
          description: Experiment registered.
        "200":
          description: Identical experiment already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/experiments/decision:
    post:
      summary: Approve or reject a self-improvement experiment.
      description: Approval records intent only; no outcome or success rate is created until a later observation.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentExperimentDecisionRequest"
      responses:
        "200":
          description: Experiment decision recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/experiments/outcome:
    post:
      summary: Record a later self-improvement experiment observation.
      description: >
        A claimed success, neutral result, or regression is normalised to unmeasurable when its
