          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextExportResult"

  /v1/i/{instance}/control/assistant-action:
    post:
      summary: Execute a reviewed assistant control once on this registered daemon instance.
      description: >
        MIDDLE-tier write. The instance in the JSON body must match this route parameter.
        Every mounted instance shares the core host's durable action-ID claim store, so an ID
        cannot be retargeted across operators, repositories or daemon roots. An unresolved claim is
        unknown, never silently retried.
      security:
        - bearerWrite: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantControlRequest"
      responses:
        "200":
          description: The first durable completion receipt, including on exact replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlReceipt"
        "202":
          description: Claimed but outcome unknown or in progress; no replay is dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlUnknown"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "The action ID binds another operator, target, or payload, or this route does not own the instance." }
        "503":
          description: Durable admission or completion unavailable; the outcome must be reconciled before any new action ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantControlUnknown"

  /v1/i/{instance}/control/assistant-action/status:
    get:
      summary: Read this instance's assistant-control contract and served identity.
      description: Requires a verified operator session; configured storage topology remains unverified.
      security:
        - bearerRead: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contract version, boot SHA, repository, instance, and qualified admission status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlCapability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/i/{instance}/control/assistant-action/receipt:
    get:
      summary: Resolve one action of this instance without dispatching a side effect.
      description: Requires the same verified operator and repository as the original claim.
      security:
        - bearerRead: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
        - name: actionId
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Durable completion receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlReceipt" }
        "202":
          description: Claimed but outcome unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No claim exists for this action ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "409":
          description: The action belongs to another operator or target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }
        "503":
          description: Claim or receipt unreadable or incomplete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantControlLookup" }

  /v1/i/{instance}/operator-agent/ask:
    post:
      summary: Read-only answer-v1 for the selected registered instance's own repository.
      description: >
        Uses only the server-owned registry identity and that instance's independently refreshed
        state-root ledger projection and inbox thread store. The request cannot select a different
        repository or instance. A missing or unreadable evidence source is reported as unavailable;
        this route never performs an action or writes an operator decision.
      security:
        - bearerRead: []
      parameters:
        - name: instance
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The answer-v1 envelope documented by the unprefixed core route below.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentAnswer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The registered instance's state or plan is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceUnavailable"

  /v1/operator-agent/ask:
    post:
      summary: Read-only, evidence-cited answer-v1 for this serving instance's repository.
      description: >
        Authenticated read operation despite POST. The server owns repository and instance scope;
        request JSON accepts only a bounded question. Cross-repository aggregation and navigation
        belong to the console. No action, approval, proposal, task, or ledger write occurs here.
        Unsupported or missing evidence is explicit, not converted into a confident answer.
      security:
        - bearerRead: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: answer-v1 with verified, partial, unavailable, or unsupported coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentAnswer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/operator-agent/action-handoff/prepare:
    post:
      summary: Prepare an action-handoff-v1 preview for one allowlisted, reversible operator verb.
      description: >
        LOW-tier write that mutates no target (W1-T4559). Requires a verified operator session.
        The verb must be in the v1 allowlist (fleet.pause, fleet.resume); high-tier, irreversible,
        financial, destructive, and credential verbs are unavailable. instance and repository must
        equal this serving instance's server-owned identity. Credential-shaped fields or values,
        answer-v1 payloads, and unknown fields refuse. The verb's own catalogue policy runs as a dry
        run. A repeated intentId from the same operator returns the first preview.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intentId, verb, instance, repository]
              properties:
                intentId: { type: string, minLength: 8, maxLength: 128 }
                verb: { type: string }
                instance: { type: string }
                repository: { type: string }
      responses:
        "200":
          description: The first preview for a repeated intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffPreview" }
        "201":
          description: A new expiring preview with a single-use confirmation identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffPreview" }
        "400":
          description: Malformed, unknown verb, model-supplied authority, or an answer-v1 payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No verified operator, or a verb excluded from v1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "409":
          description: Cross-instance, cross-repository, intent conflict, or the verb policy refuses now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "503":
          description: The handoff store or policy check is unavailable; nothing was prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }

  /v1/operator-agent/action-handoff/execute:
    post:
      summary: Execute a prepared action-handoff-v1 action once, on explicit operator confirmation.
      description: >
        MIDDLE-tier write (W1-T4559). Requires the same verified operator who prepared it and
        `confirm: true`. The confirmation is claimed once; the server then revalidates freshness,
        instance and repository scope, target state, and verb policy before delegating to the
        catalogued governed verb. Every claimed confirmation ends in one receipt; a replay returns
        409 naming it. A 202 or 503 is unresolved and must be reconciled, never retried as new.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationId, confirm, verb, instance, repository]
              properties:
                confirmationId: { type: string }
                confirm: { type: boolean, enum: [true] }
                verb: { type: string }
                instance: { type: string }
                repository: { type: string }
      responses:
        "200":
          description: The governed verb ran; the receipt cites its ledger evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffReceipt" }
        "202":
          description: Unresolved; the external outcome is not certified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffReceipt" }
        "400":
          description: Missing explicit confirmation, model-supplied authority, or an answer-v1 payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No verified operator, or a different operator than the one who prepared it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "404":
          description: No prepared action has this confirmation identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "409":
          description: Refused after claim (stale, changed target or scope, policy) or a replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }
        "503":
          description: Claim or receipt not durable; reconcile before any new intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAgentActionHandoffRefusal" }

  /v1/operator-agent/proposals:
    get:
      summary: Read durable operator-agent proposals and decision history.
      description: >
        Returns only proposal, decision, and observed-outcome records reconstructed from the
        append-only ledger, including supported rotated ledger files. No raw analytics payload or
        bearer token is returned. W1-T3895: naming a `principalId` and `repository` narrows the list
        to that repository and applies the principal's accepted preferences AFTER each proposal's
        authority and emergency-stop refusal are settled (see `presentation`).
      security:
        - bearerRead: []
      parameters:
        - name: principalId
          in: query
          required: false
          schema:
            type: string
