  /v1/context-controls/export:
    get:
      summary: W1-T3893 user-authorized export — bounded, redacted, scoped, coverage-checked.
      description: >
        Scoped to exactly one principal AND purpose AND authority. Returns `status: completed`
        ONLY when every selected item's full derivation chain is available; otherwise refuses
        (HTTP 409, `status: refused`) with a `reason` — never a partial "completed" response.
      security:
        - bearerRead: []
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          schema:
            type: string
        - name: authorityRef
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed export — bounded, redacted items for the requested scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextExportResult"
