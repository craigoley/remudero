  /v1/operator-agent/consequence/preflight:
    post:
      summary: Classify and evaluate a consequence-policy-v1 action before any capability it names may be used.
      description: >
        Every operator-agent action path that would go on to use a capability grant (see
        `capability-grant-v1`) evaluates its consequence policy here FIRST. Refuses an ambiguous or
        externally-sourced target, stale evidence, an expired quote/confirmation, an exceeded
        per-action/aggregate financial ceiling, an active cooling-off window, or a shortfall of
        distinct trusted approvers against the action's configured requirement. A `ready` response
        is a preflight verdict only — it never itself uses a capability or reports success.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentConsequencePreflightRequest"
      responses:
        "200":
          description: The action is ready — every consequence-policy check passed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The action was refused by consequence policy; the response names the machine-readable code and reason.

  /v1/operator-agent/consequences:
    get:
      summary: W1-T4104 — the bounded list of consequence approvals waiting on an operator.
      description: >
        src/lib/operator-agent.ts's `readPendingConsequences`, read-only. Lists every action whose
        LATEST consequence preflight row was refused for `missing-approvers` or
        `cooling-off-active`, is `financial` or `irreversible`, carries the approval projection the
        preflight persisted, and has not expired. An approved consequence leaves the list; a
        refused one stays visible with its refusal receipt. Newest first, capped at `max` (100)
        with `truncated` saying when more exist; pending rows written before W1-T4104 carried no
        projection and are counted in `unprojected`, never guessed into a record. An empty queue
        is an empty list with its read time, never a 404.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The pending consequence approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentPendingConsequenceRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Refused by name — the pending consequence list is read-only.
      description: >
        `buildOperatorAgentConsequencesWriteRefusalRoutes` registers POST, PUT, PATCH and DELETE on
        this path at READ scope, so a write is answered `405 read_only` with `Allow: GET` rather
        than the router's anonymous 404. Nothing is recorded; a decision is POST
        /v1/operator-agent/consequences/decision.
      security:
        - bearerRead: []
      responses:
        "405":
          $ref: "#/components/responses/OperatorAgentConsequencesReadOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Refused by name — the pending consequence list is read-only.
      description: "The same refusal as POST on this path -- `405 read_only`, `Allow: GET`, nothing recorded."
      security:
        - bearerRead: []
      responses:
        "405":
          $ref: "#/components/responses/OperatorAgentConsequencesReadOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Refused by name — the pending consequence list is read-only.
      description: "The same refusal as POST on this path -- `405 read_only`, `Allow: GET`, nothing recorded."
      security:
        - bearerRead: []
      responses:
        "405":
          $ref: "#/components/responses/OperatorAgentConsequencesReadOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Refused by name — the pending consequence list is read-only.
      description: "The same refusal as POST on this path -- `405 read_only`, `Allow: GET`, nothing recorded."
      security:
        - bearerRead: []
      responses:
        "405":
          $ref: "#/components/responses/OperatorAgentConsequencesReadOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/operator-agent/consequences/decision:
    post:
      summary: Approve or refuse one pending consequence (HIGH write tier, nonce-confirmed).
      description: >
        `buildOperatorAgentConsequencesDecisionRoute`. HIGH write tier: the bearer write token is
        pinned at LOW and is refused `403 forbidden` with `required_tier: high`; a HIGH-tier
        credential must present an X-Confirm-Nonce minted by POST /v1/confirm for this exact
        method, path and payload. The handler also refuses a request with no nonce header itself,
        so the route never becomes an unguarded write. Only a consequence GET
        /v1/operator-agent/consequences still lists as pending can be decided: an unknown one is
        `404`, an expired or already-decided one `409`, and a refusal records nothing. A decision
        appends one ledger row carrying the first 32 hex characters of the nonce's SHA-256, never
        the nonce itself.
      security:
        - bearerWrite: []
      parameters:
        - name: X-Confirm-Nonce
          in: header
          required: true
          description: The single-use confirmation nonce POST /v1/confirm issued for this exact request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentConsequenceDecisionRequest"
      responses:
        "200":
          description: The decision was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentConsequenceDecisionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing write scope or HIGH write tier (`forbidden`), or no valid confirmation nonce (`confirm_nonce_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighTierRefusal"
        "404":
          description: No pending consequence with this id exists (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentConsequenceDecisionRefusal"
        "409":
          description: The consequence expired (`expired_consequence`) or is no longer pending (`consequence_not_pending`); nothing is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentConsequenceDecisionRefusal"

  /v1/operator-agent/delegation/handoff:
    post:
      summary: W1-T3883 — issue, accept and execute one bounded agent-delegation envelope (HIGH write tier).
      description: >
        `buildOperatorAgentDelegationHandoffRoute`. Builds an `agent-delegation-envelope-v1`
        (src/lib/automation-action.ts's `createDelegationEnvelope`), refuses it by name (`423`)
        when an active emergency stop's scope covers it (the fleet, or its repo, instance or
        principal) and its delegation classes are "*" or include the
        requested capability (ledgering the refusal receipt), then
        records the recipient's explicit, narrow-only acceptance (a refused acceptance is a `409`
        with no receipt) and runs the requested capability through `executeBoundedDelegation` --
        the one seam that checks acceptance, replay, expiry, revocation, identity, audience, audit
        availability and the human gate for high, production, financial, credential and
        destructive risk. Every use that reaches execution, executed or refused, returns one
        bounded receipt and ledgers only that receipt. The
        envelope store is in-memory and per-process. HIGH write tier: the bearer write token
        (pinned at LOW) is refused `403`; a HIGH-tier credential must present an X-Confirm-Nonce
        minted by POST /v1/confirm for this exact request.
      security:
        - bearerWrite: []
      parameters:
        - name: X-Confirm-Nonce
          in: header
          required: true
          description: The single-use confirmation nonce POST /v1/confirm issued for this exact request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentDelegationHandoffRequest"
      responses:
        "200":
          description: The envelope was accepted and the requested capability verified and executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentDelegationHandoffResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing write scope or HIGH write tier (`forbidden`), or no valid confirmation nonce (`confirm_nonce_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighTierRefusal"
        "409":
          description: "Refused at acceptance (`stage: accept`, with `code` and `detail`) or at execution (a refused `receipt` naming its `code`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentDelegationHandoffRefusal"
        "423":
          description: An active emergency stop covers this handoff; nothing is issued, and the refusal receipt names the stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopAdmissionRefusal"

  /v1/operator-agent/actions:
    get:
      summary: W1-T3855 -- read every automation-action-v1 record with its derived state and receipts.
      description: >
        `readOperatorAgentActions` over the ledger union. The first record per actionId wins, the
        first operator decision stands, and receipts append in ledger order; state is derived
        from them, never stored.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable automation-action history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: W1-T3855 -- register an automation action before anything may execute it.
      description: >
        Validates scope, risk, preconditions, freshness, idempotency key, expiry, dry-run
        capability, approval policy, rollback/refusal path and receipt reference, refusing an
        incomplete record by name (`400`, detail `<code>: <reason>`). An identical
        re-registration is `200`; a different record under the same actionId, or a second action
        bound to the same idempotencyKey, is `409`.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionRegistration"
      responses:
        "201":
          description: Action registered.
        "200":
          description: Identical action already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/actions/decision:
    post:
      summary: W1-T3855 -- approve or reject a human-policy action (HIGH write tier, nonce-confirmed).
      description: >
        Only an action whose approval policy is `human` and that is still pending and unexpired
        can be decided; the first decision stands (`409` afterwards). The decider is the
        verified request identity, never a body field. HIGH write tier (operator ruling
        2026-09-28): the bearer write token (pinned at LOW) is refused `403`, and a HIGH-tier
        credential must present an X-Confirm-Nonce minted by POST /v1/confirm for this exact request.
      security:
        - bearerWrite: []
      parameters:
        - $ref: "#/components/parameters/ConfirmNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionDecisionRequest"
      responses:
        "200":
          description: Decision recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HighTierForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/actions/preflight:
    post:
      summary: W1-T3855 -- evaluate an action's preflight without executing or recording anything.
      description: >
        Answers ready, refused, stale, unknown, expired or in-progress with every finding. A
        missing observation, an unavailable or browser-owned source, or an observation from the
        wrong source is `unknown`, never ready.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionObservationRequest"
      responses:
        "200":
          description: The preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionPreflightResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/operator-agent/actions/execute:
    post:
      summary: W1-T3855 -- admit one execution per idempotency key (MIDDLE write tier).
      description: >
        Re-runs preflight at execution time. A duplicate idempotency key returns the existing
        receipt (`200`, `reused`) and appends nothing; anything but a ready preflight appends a
        refusal (`409`); a dry run appends a dry-run receipt (`200`); a ready action is admitted
        `in-progress` (`202`) -- never succeeded -- until POST /v1/operator-agent/actions/complete
        records its evidence. An active emergency stop covering the action's repo or instance
        refuses it first (`423`). W1-T4657 -- a capability in the `rmd.` namespace is run by the
        action-catalogue-v1 executor instead: `200` `completed` with a completion receipt whose
        evidenceRef names the executor's own ledger row, `200` `reused` for a repeat, `409` for a
        refusal (`no-executor`, `tier-insufficient`, `switched-off`, ...). This route proves MIDDLE,
        so a HIGH catalogue capability is refused here and runs only via /actions/execute-high.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionObservationRequest"
      responses:
        "202":
          description: Admitted in-progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "200":
          description: A dry run, or the existing receipt for a duplicate idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused; the receipt names the preflight outcome and code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "423":
          description: An active emergency stop covers this action; the refusal receipt names the stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopAdmissionRefusal"

  /v1/operator-agent/actions/execute-high:
    post:
      summary: W1-T4657 -- execute an action as /actions/execute does, proven HIGH (HIGH write tier).
      description: >
        Identical to POST /v1/operator-agent/actions/execute, but dispatched at the HIGH tier with a
        confirm nonce, so a HIGH-tier catalogue capability (`rmd.task.kick:<taskId>`, which reuses
        POST /v1/drain/kick's handler) can run. Its approval still comes from /actions/decision.
      security:
        - bearerWrite: []
      parameters:
        - $ref: "#/components/parameters/ConfirmNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionObservationRequest"
      responses:
        "202":
          description: A non-catalogue action admitted in-progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "200":
          description: A catalogue action completed by its executor, a dry run, or the existing receipt for a duplicate idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HighTierForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused; the receipt names the preflight outcome and code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "423":
          description: An active emergency stop covers this action; the refusal receipt names the stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopAdmissionRefusal"

  /v1/operator-agent/actions/complete:
    post:
      summary: W1-T3855 -- record how an admitted execution ended (MIDDLE write tier).
      description: >
        Appends a completion receipt linked to the admission. `succeeded` requires an
        evidenceRef; a second completion returns the first; completing anything but an
        in-progress admission is `409` and appends nothing.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionCompletionRequest"
      responses:
        "200":
          description: Completion recorded, or the existing completion returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused (`not-admitted`, `evidence-required`, `receipt-history-full`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"

  /v1/operator-agent/actions/rollback:
    post:
      summary: W1-T3855 -- append a rollback linked to the completion it undoes (MIDDLE write tier).
      description: >
        Never rewrites the admission or completion. An irreversible action's rollback is refused
        and that refusal recorded, naming its declared refusal path; with nothing completed it is
        refused without a record; a second rollback returns the first.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentActionRollbackRequest"
      responses:
        "200":
          description: Rollback recorded, or the existing rollback returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused (`nothing-to-roll-back`, `irreversible`, `receipt-history-full`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentActionStepResult"

  /v1/operator-agent/delegations:
    get:
      summary: W1-T3878 -- read every delegation-profile-v1 with its derived approval, lifecycle and spend.
      description: >
        `readDelegationProfiles` folds the ledger union: the first record per delegationId wins, a
        revocation is terminal, the first acceptance stands, an accepted replacement supersedes its
        predecessor, and admitted executions under a profile sum into `spentCostUsd`.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable delegation profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: W1-T3878 -- issue a delegation profile (LOW write tier; pending until accepted).
      description: >
        `buildDelegationProfile` refuses an incomplete record by name (`400`, `code` and `field`).
        The issued profile is `pending` and authorizes nothing until a HIGH-tier acceptance. A
        second issue under the same delegationId is `409` -- change a profile by replacing it.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationProfileIssueRequest"
      responses:
        "201":
          description: Profile issued, pending approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationProfileIssueResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/delegations/decision:
    post:
      summary: W1-T3878 -- accept or revoke a delegation profile (HIGH write tier, nonce-confirmed).
      description: >
        Accepting GRANTS a trust budget, so this is HIGH like /v1/operator-agent/actions/decision:
        the bearer write token (pinned at LOW) is refused `403`, and a HIGH-tier credential must
        present an X-Confirm-Nonce minted by POST /v1/confirm for this exact request. Only a pending
        profile is accepted, never one whose predecessor was revoked; revocation is terminal, and
        revoking a pending profile denies it. The decider is the verified identity, never a body
        field. A model-confidence, prior-approval or UI-state field is refused `400`.
      security:
        - bearerWrite: []
      parameters:
        - $ref: "#/components/parameters/ConfirmNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationDecisionRequest"
      responses:
        "200":
          description: Decision recorded; `lifecycleState` is the profile's state after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationDecisionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HighTierForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/delegations/replace:
    post:
      summary: W1-T3878 -- issue a linked replacement for a profile (LOW write tier; pending until accepted).
      description: >
        `buildDelegationReplacement` never mutates the original: the replacement is the next
        revision with a derived id, `replaces` set, and a `replace` receipt on the original, which
        stays authoritative until the replacement is accepted and is superseded from then on. A
        revoked, denied or superseded profile, or one already being replaced, is `409`; naming an
        identity field in `changes` is `400` `immutable-field`.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationReplaceRequest"
      responses:
        "201":
          description: Replacement issued, pending approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationReplaceResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/intent-plans:
    get:
      summary: W1-T3898 -- read every intent-plan-v1 with its derived preview, clarification, confirmation and execution.
      description: >
        `readIntentPlanStates` folds the ledger union: a plan row stores the producer's request,
        and the fold rebuilds the plan through `buildIntentPlan`, so a hand-edited row is
        re-validated by the code that admitted it. Each item carries every field the console's
        intent-plan-v1 normaliser reads (planId, goal, constraints, unknowns, scope, consequence,
        freshness, nextDecision, observedAt, receipts, source) plus core's full envelope.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable intent plans, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: W1-T3898 -- propose an intent plan (LOW write tier; a non-operative preview).
      description: >
        `buildIntentPlan` researches the goal first (an explicit `repo owner/name` settles the
        scope; an explicit "at most $N" settles the ceiling) and refuses by name (`400`, `code`
        and `field`) a forbidden, credential-shaped, unknown, or authority-claiming field
        (approved, confirmed, permission, model confidence) -- a sentence is never authority.
        A request with no steps is answered by W1-T4658's `planStepsForGoal`: deterministic
        recognisers propose 0-4 steps from the executor catalogue only, each citing the board or
        fleet-control evidence it was chosen on; an unmatched goal, or missing or stale evidence,
        yields zero steps (previews `unavailable`) and a `goal-unresolved` question. A request
        carrying producer steps is stored unchanged. Nothing is registered, approved, or executed. An identical request under the same
        idempotencyKey is `200` (`existing: true`); a different one is `409`.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentPlanProposeRequest"
      responses:
        "201":
          description: Plan proposed; the body is the plan's read shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanProposeResult"
        "200":
          description: The identical plan already proposed under this idempotencyKey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanProposeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/intent-plans/decision:
    post:
      summary: W1-T3898 -- clarify, confirm, or undo an intent plan (HIGH write tier, nonce-confirmed).
      description: >
        HIGH like /v1/operator-agent/actions/decision: confirming requests automation actions that
        mutate, and undo withdraws or rolls them back, so the bearer write token (pinned at LOW) is
        refused `403` and a HIGH-tier credential must present an X-Confirm-Nonce minted by POST
        /v1/confirm for this exact request. `clarify` records one answer to an OPEN question; a
        question is never asked twice and rounds stop at W1-T2499's bound. `confirm` re-runs the
        preview and, only when it is ready, registers one automation-action-v1 per step (`202`) --
        the plan then reads `awaiting-receipt`, never success, until each action's completion
        receipt names its evidence. `undo` appends a withdrawal, a rollback request linked to the
        completion receipt, or a recorded refusal (`409`); it never rewrites the plan or a receipt.
        Every refusal is `409` with a `code`.
      security:
        - bearerWrite: []
      parameters:
        - $ref: "#/components/parameters/ConfirmNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentPlanDecisionRequest"
      responses:
        "200":
          description: An answer recorded, a plan withdrawn or its rollback requested, or an unchanged decision returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanDecisionResult"
        "202":
          description: Confirmed; the linked actions are requested and awaiting their receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanDecisionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/HighTierForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused by name (already-asked, not-open, clarification-exhausted, preview-<state>, plan-withdrawn, action-conflict, irreversible, in-progress, ...).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentPlanDecisionRefusal"

  /v1/operator-agent/emergency/clear:
    post:
      summary: W1-T3900 — lift one emergency stop (HIGH write tier; the only path that clears a stop).
      description: >
        `buildEmergencyStopClearRoute` over src/lib/emergency-control.ts's `clearEmergencyStop`.
        Requires an explicit human confirmation, a `healthy` authoritative health read taken
        within the last five minutes, and `complete` revocation-source coverage; any shortfall,
        or a stop already cleared, is a `409` carrying a refusal receipt and records nothing. An
        unknown stop id is `404`. HIGH write tier: the bearer write token (pinned at LOW) is
        refused `403`; a HIGH-tier credential must present an X-Confirm-Nonce minted by POST
        /v1/confirm for this exact request.
      security:
        - bearerWrite: []
      parameters:
        - name: X-Confirm-Nonce
          in: header
          required: true
          description: The single-use confirmation nonce POST /v1/confirm issued for this exact request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopClearRequest"
      responses:
        "200":
          description: The stop is cleared; its clear receipt is ledgered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopClearResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing write scope or HIGH write tier (`forbidden`), or no valid confirmation nonce (`confirm_nonce_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighTierRefusal"
        "404":
          description: No emergency stop with this id was ever issued (`not_found`, with a `detail`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The clear was refused; the receipt's `outcome` repeats the refusal `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopClearRefusal"

