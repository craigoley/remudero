            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/context-controls/inventory:
    get:
      summary: W1-T3893 self-service context inventory, scoped to one principal.
      description: >
        Metadata-only, like GET /v1/operator-agent/context, but requires a `principal` and
