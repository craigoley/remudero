          minimum: 1
          maximum: 20
        owner:
          type: string
        nextAction:
          type: string
        nextQuestion:
          type: string
        createdAt:
          type: string
          format: date-time

    FollowUpReceipt:
      type: object
      required: [delivered, systemActed, completed, permissionToAct, at]
      properties:
        delivered:
          type: boolean
        answered:
          type: boolean
        systemActed:
          type: boolean
        authority:
          type: string
        completed:
          type: boolean
          enum: [false]
        permissionToAct:
          type: boolean
        at:
          type: string
          format: date-time

    FollowUpHistory:
      type: object
      required: [version, candidateId, sourceEvent, workstream, reason, freshness, deduplicationKey, maxAttempts, owner, createdAt, state, attempts, events]
      properties:
        version:
          type: string
          enum: [follow-up-policy-v1]
        candidateId:
          type: string
        sourceEvent:
          type: string
        workstream:
          type: string
        reason:
          type: string
        freshness:
          type: string
          enum: [verified, stale, unavailable]
        deadline:
          type: string
          format: date-time
        dependency:
          type: string
        quietHours:
          $ref: "#/components/schemas/FollowUpQuietHours"
        deduplicationKey:
          type: string
        maxAttempts:
          type: integer
        owner:
          type: string
        nextAction:
          type: string
        nextQuestion:
          type: string
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [scheduled, eligible, snoozed, suppressed, asked, accepted, rejected, expired, blocked]
        attempts:
          type: integer
        events:
          type: array
          items:
            type: object
        receipt:
          $ref: "#/components/schemas/FollowUpReceipt"
