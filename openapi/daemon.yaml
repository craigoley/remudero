      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentExperimentOutcomeRequest"
      responses:
        "200":
          description: Experiment observation recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/experiments/rollback:
    post:
      summary: Record a rollback for a regressed self-improvement experiment.
      description: Rollback appends a linked event and leaves the proposal, approval, and regression history intact.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentExperimentRollbackRequest"
      responses:
        "200":
          description: Rollback recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/promotions:
    get:
      summary: Read durable experiment-promotion-v1 replay/shadow/canary history.
      description: >
        Returns the append-only promotion record and its replay, decision, advance, and rollback
        events across the live ledger and supported rotated ledger files. The current state is
        the last event's resulting state, adjusted for expiry.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable promotion history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentPromotionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register a bounded promotion; canary exposure is serialized per policy scope.
      description: >
        Records the candidate, baseline, comparable population, denominator floor, observation
        window, guard metrics, maximum exposure, owner, expiry, and rollback path before any
        replay or approval. At most one active (non-terminal) promotion may hold a given
        (repo, policyScope) pair at a time.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentPromotionRegistration"
      responses:
        "201":
          description: Promotion registered.
        "200":
          description: Identical promotion already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/promotions/replay:
    post:
      summary: Attach a deterministic, side-effect-free replay summary to a proposed promotion.
      description: >
        The submitted summary is a bounded receipt of a replay pass already run over a historical
        corpus by the caller; this route validates and persists it rather than re-executing
        anything, moving the promotion from proposed to replayed.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentPromotionReplayRequest"
      responses:
        "200":
          description: Replay summary recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/promotions/decision:
    post:
      summary: Approve a replayed promotion candidate.
      description: Approval records intent only; only later guard-evaluated evidence can advance the promotion further.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentPromotionDecisionRequest"
      responses:
        "200":
          description: Promotion decision recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/promotions/advance:
    post:
      summary: Advance a promotion one guarded step (shadow, canary, observing, or promoted).
      description: >
        `shadow` entry follows approval alone. Every later step evaluates freshly submitted guard
        observations against the promotion's declared metrics, denominator floor, comparison
        population, and window: a breach becomes `regressed`, insufficient evidence becomes
        `unmeasurable`, and only a fully-ready evaluation reaches the requested target. Requesting
        exposure above the promotion's declared maximum is refused.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentPromotionAdvanceRequest"
      responses:
        "200":
          description: Promotion advanced (or explicitly aborted to regressed/unmeasurable).
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/promotions/rollback:
    post:
      summary: Record a rollback for an approved, shadow, canary, observing, regressed, or unmeasurable promotion.
      description: Rollback appends a linked event and leaves the registration, replay, approval, and advance history intact.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentPromotionRollbackRequest"
      responses:
        "200":
          description: Rollback recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/consequence/preflight:
    post:
      summary: Classify and evaluate a consequence-policy-v1 action before any capability it names may be used.
      description: >
        Every operator-agent action path that would go on to use a capability grant (see
        `capability-grant-v1`) evaluates its consequence policy here FIRST. Refuses an ambiguous or
        externally-sourced target, stale evidence, an expired quote/confirmation, an exceeded
        per-action/aggregate financial ceiling, an active cooling-off window, or a shortfall of
        distinct trusted approvers against the action's configured requirement. A `ready` response
        is a preflight verdict only — it never itself uses a capability or reports success.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentConsequencePreflightRequest"
      responses:
        "200":
          description: The action is ready — every consequence-policy check passed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The action was refused by consequence policy; the response names the machine-readable code and reason.

