        - originatingReceiptId
        - capabilityGrantId
        - connector
        - targetIdentity
        - requestedOperation
        - preconditionSnapshot
        - expectedPostconditions
        - observation
        - idempotencyKey
        - reconciliationState
        - retryPath
        - evidenceReference
        - safeToComplete
      properties:
        version:
          type: string
          enum: [external-effect-v1]
