  /v1/views/events:
    get:
      summary: SSE stream of view versions -- a `hello` map on connect, then one `view` event per changed ETag.
      description: >
        Arch plan Phase 2 (src/lib/view-events.ts). The stream carries versions, never bodies: the
        version is the view's ETag, so the client refetches GET /v1/views/<name> with If-None-Match only
        for what changed. Every connect starts with `hello` (components.schemas.ViewHello) and the
        client diffs it against what it holds; Last-Event-ID is only logged. `view` events
        (components.schemas.ViewEvent) come from a new worker body (`cause: body`) or from a 1 s re-judge
        of each body's sources (`cause: judge`, a stalled projector). A `: hb` comment every 25 s. A
        backed-up subscriber keeps only the latest event per view key, and one backed up for 60 s, like
        every stream when serve drains, ends with `handover` (components.schemas.ViewHandover). Only views
        switched `serve` emit. An open stream is not read attention for serve's recycle patience.
      security:
        - bearerRead: []
      parameters:
        - name: views
          in: query
          required: false
          description: Comma-separated view names to receive; default every view.
          schema:
            type: string
      responses:
        "200":
          description: >
            An open text/event-stream connection (`cache-control: no-cache, no-transform`). Event framing
            is outside this OpenAPI subset's response-body modeling -- see the schemas named above.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Serve runs no read-model worker (`read_model_absent`).

