      description: >
        W1-T141 / W1-T435 (src/lib/panel-actions.ts's `buildDrainFeedbackRoute`). Write tier LOW.
        Ledgers an `operator_feedback` record (verdict, drain run id, and the steering note
        verbatim when present) -- the labeled human signal the learning limb consumes.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrainFeedbackRequest"
      responses:
        "200":
          description: The verdict was ledgered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainFeedbackResult"
        "400":
