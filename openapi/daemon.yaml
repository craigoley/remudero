            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/incidents:
    get:
      summary: The incident fix-verification lifecycle store, newest first.
      description: >
        src/lib/incident-lifecycle.ts's `buildIncidentsRoute`: every incident fingerprint's
        lifecycle (`new -> filed -> building -> deployed -> verified | regressed`), newest
        `lastSeen` first. An absent store is an empty list; a store that exists but cannot be
        read is a 503, never the `200 {incidents: []}` a quiet fleet returns.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The lifecycle records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The lifecycle store exists but could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentsUnavailable"

  /v1/incidents/events:
    post:
      summary: Report one error event for grouping into an incident.
      description: >
        src/lib/incident-events.ts's `buildIncidentEventsRoute` (write scope, tier low): validate,
        scrub, fingerprint (error type plus the first three in-app frames), then ledger one
        `incident.event` row. Past 20 events per fingerprint per minute a burst collapses to ONE
        `incident.sampled` row and later events in that window answer `sampled: true` and write
        nothing. `message` and `frames` never reach the ledger. Reachable with the write token or
        with the ingest-only token, which grants this one method and path and nothing else.
      security:
        - bearerWrite: []
        - bearerIngest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentEventRequest"
      responses:
        "200":
          description: The event was accepted (and ledgered, unless sampled out).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentEventResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The body exceeded 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentIngestBodyTooLarge"

  /v1/console/telemetry:
    post:
      summary: The console's latency beacon -- one console.latency ledger row per applied view update.
      description: >
        Arch plan Phase 2 (src/lib/console-telemetry.ts's `buildConsoleTelemetryRoute`, write scope, tier
        low). The console forwards its browser beacon here, and each record becomes one
        `console.latency` row in core's ledger. Rows are paced to about one a second sustained, after a
        burst of 60; records past the pace are counted in `dropped`, and at most one
        `console.latency_dropped` row a minute says how many. Reachable with the write token or with the
        ingest-only token, which grants this one method and path besides the incident route.
      security:
        - bearerWrite: []
        - bearerIngest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsoleTelemetryRequest"
      responses:
        "200":
          description: The batch was accepted; `accepted` records were ledgered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleTelemetryResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The body exceeded 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentIngestBodyTooLarge"

  # ── W1-T4610: the ratification inbox (W1-T110, W1-T193, W1-T2604, W1-T3407/W1-T3408) and its
  # threads (W1-T4088) -- src/lib/panel-graph.ts's registrations -- plus the daily digests
  # (src/lib/serve.ts's `buildInboxDigestsRoute`). Every write ledgers with the caller's bearer
  # as `origin`; each names the write tier its route registers (W1-T404).

  /v1/escalation/reply:
    post:
      summary: Answer an ESCALATION in prose -- recorded as an input on its thread, never a command.
      description: >
        W1-T2496, W1-T4471 (src/lib/panel-actions.ts's `buildEscalationReplyRoute`). Write tier:
        LOW (W1-T404). Derives the escalation's thread id from the body, refuses (400) when no
        thread store is configured, the thread cannot be read, or it holds no prior message --
        never files an unattached reply. Otherwise appends the reply, runs the pure reply
        interpreter (appending a clarifying question or exhaustion report when it is not
        understood), captures a feedback entry (origin `ui`), records the answer into
        `plan/questions.ndjson`, and ledgers `panel.escalation_replied`. It never closes an issue,
        dispatches, ratifies or arms a merge.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationReplyRequest"
      responses:
        "200":
          description: The reply was appended, interpreted and recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationReplyResult"
        "400":
          description: >
            `invalid_request` with a `detail` -- the body failed validation, or the thread it names
            has no store, cannot be read, or holds no existing escalation. No side effect occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # W1-T2696: signed one-tap answer links on an escalation. Both routes are SELF-AUTHENTICATED
  # (src/lib/service.ts's `Route.selfAuthenticated`): no bearer token is read -- the HMAC-signed
  # query (`e` escalation id, `c` class, `r` option route, `x` expiry epoch ms, `s` 64-hex
  # signature, minted by src/lib/escalate.ts's `mintOptionLink`) is the credential, verified by
  # `verifyOptionLink` before anything acts. Hence `security: []` and no 401/403 bearer responses.

  /v1/escalation/confirm:
    get:
      summary: Verify a signed escalation answer link and show a confirm form -- never acts.
      description: >
        src/lib/panel-actions.ts's `buildEscalationLinkConfirmRoute`. Registered read-scoped but
        self-authenticated. On a verified link it renders an HTML form that POSTs the same query to
        /v1/escalation/answer; a refusal renders its reason as HTML. Refusals other than a
        malformed query are ledgered as `escalation.link_refused` (phase `confirm`).
      security: []
      parameters:
        - name: e
          in: query
          required: true
          description: The escalation id (signed).
          schema:
            type: string
        - name: c
          in: query
          required: true
          description: The escalation's class (signed, so an answer cannot be redirected onto another thread).
          schema:
            type: string
        - name: r
          in: query
          required: true
          description: The option route (signed); a route outside the closed set is refused.
          schema:
            $ref: "#/components/schemas/EscalationOptionRoute"
        - name: x
          in: query
          required: true
          description: Expiry, epoch milliseconds (signed); links live 24 hours.
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: s
          in: query
          required: true
          description: HMAC-SHA256 over `e|c|r|x`, 64 lowercase hex characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: The link verified; an HTML confirm form naming the escalation and option route.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: The signature does not verify (`forged`); an HTML page naming why.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: A malformed query, an expired link, or one already used; an HTML page naming why.
          content:
            text/html:
              schema:
                type: string
        "503":
          description: The signing secret could not be resolved (`unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkRefusal"

  /v1/escalation/answer:
    post:
      summary: Answer an escalation with a signed link's option -- single use.
      description: >
        src/lib/panel-actions.ts's `buildEscalationLinkAnswerRoute`. Registered write-scoped at
        write tier LOW (W1-T404) but self-authenticated by the signed query; there is no request
        body. Verifies the link, confirms the escalation's thread exists (a refusal there does
        NOT burn the link), claims the single-use marker by exclusive create (the loser of two
        racing taps gets 410 `already-used`), then appends `answered by link: <route>` as a
        reply on the escalation's thread and ledgers `escalation.answered_by_link`. The option's
        route itself is never called.
      security: []
      parameters:
        - name: e
          in: query
          required: true
          description: The escalation id (signed).
          schema:
            type: string
        - name: c
          in: query
          required: true
          description: The escalation's class (signed, so an answer cannot be redirected onto another thread).
          schema:
            type: string
        - name: r
          in: query
          required: true
          description: The option route (signed); a route outside the closed set is refused.
          schema:
            $ref: "#/components/schemas/EscalationOptionRoute"
        - name: x
          in: query
          required: true
          description: Expiry, epoch milliseconds (signed); links live 24 hours.
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: s
          in: query
          required: true
          description: HMAC-SHA256 over `e|c|r|x`, 64 lowercase hex characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: The answer was recorded on the escalation's thread and the link consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkAnswerResult"
        "400":
          description: >
            `invalid_request` -- no thread store is configured, or the escalation's thread cannot
            be read or holds no message. The link is not consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkRefusal"
        "403":
          description: "`forged` -- the signature does not verify."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkRefusal"
        "410":
          description: "`bad-request`, `expired` or `already-used`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkRefusal"
        "503":
          description: "`unavailable` -- the signing secret could not be resolved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationLinkRefusal"

  /v1/inbox:
    get:
      summary: The ratification inbox -- ready, drafting, not-ready and declined proposals.
      description: >
        src/lib/panel-graph.ts's `buildInboxRoute`, classified the way `rmd inbox` prints it.
        Deferred-with-trigger, ratified and retired proposals are never returned. Served through
        the console's cached-read wrapper (src/lib/serve.ts's `boundConsoleReadRoute`): the body
        may be the previous snapshot while a recompute runs, says so in `staleness`, carries a
        weak `etag`, and answers 304 to a matching `If-None-Match`. A bare GET is the whole body
        (1.99 MB on the fleet host, 2026-09-30); `?section=` answers one lane (InboxSectionResult),
        and a list section pages by `limit` and `cursor`. Each distinct query is its own cache entry.
      security:
        - bearerRead: []
      parameters:
        - name: section
          in: query
          required: false
          description: >
            `needsYou` (the operator's four lanes, not paged), or one list lane: `ready`,
            `drafting`, `notReady`, `declined`, `fleet`.
          schema:
            type: string
            enum: [needsYou, ready, drafting, notReady, declined, fleet]
        - name: limit
          in: query
          required: false
          description: A list section's page size, 1 to 500. Default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: The previous page's `page.nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: The inbox, or one section of it, with the cache's staleness envelope.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/InboxResult"
                  - $ref: "#/components/schemas/InboxSectionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "304":
          description: The cached snapshot matches the request's `If-None-Match`; no body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/inbox/digests:
    get:
      summary: The mailbox's stored daily digests, newest ten.
      description: >
        src/lib/serve.ts's `buildInboxDigestsRoute` over `readConsoleInboxDigests`. A missing
        store answers an empty list; an unreadable or unparsable one answers an empty list with a
        `reason` -- never a non-2xx.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The digests inside the render window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxDigestsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/inbox/threads:
    get:
      summary: The operator's inbox threads, waiting-on-you first.
      description: >
        W1-T4088 (src/lib/panel-graph.ts's `buildInboxThreadsRoute`): one thread per
        operator-owned inbox item, with its headline, the first sentence of the latest message,
        who it is waiting on, last activity, message count and unread flag.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The thread list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: "`thread_store_unreadable` -- the thread store could not be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"

  /v1/inbox/attention-census:
    get:
      summary: Source-qualified core operator-attention census.
      description: >
        W1-T4742 read-only count of current operator-owned threads by actionability, with why-me
        facts and source coverage. It does not aggregate connected repositories and never offers
        an action. Partial source coverage leaves snapshot counts unverified and verified counts
        conservative, never a claimed healthy zero.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Source-qualified census, possibly partial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxAttentionCensusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Thread store or plan could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"

  /v1/inbox/thread:
    get:
      summary: One inbox thread's messages, oldest first.
      description: >
        W1-T4088 (src/lib/panel-graph.ts's `buildInboxThreadRoute`). The opening message
        (`seq` 0) is derived from the item's current plain message on every read; the raw
        proposal summary rides along as `details`.
      security:
        - bearerRead: []
      parameters:
        - name: id
          in: query
          required: true
          description: The thread id, `thread:<proposalId>::inbox::-::-`.
          schema:
            type: string
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found` -- the id names no current operator-owned inbox item (a missing or malformed id included)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"
        "500":
          description: "`thread_store_unreadable` -- the thread store could not be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"

  /v1/inbox/thread/reply:
    post:
      summary: Write on an inbox thread -- an input for the daemon's responder, never a command.
      description: >
        W1-T4088 (src/lib/panel-graph.ts's `buildInboxThreadReplyRoute`). Write tier: LOW
        (W1-T404) -- it only adds a message; the daemon's responder decides what it means and may
        itself take only reversible actions. Idempotent per caller token, thread and `intentId`:
        the stored reply is keyed by a derived `replyId`, one reply per thread is written at a
        time under an in-flight lock, and the `inbox.thread_replied` ledger row is written once.
      security:
        - bearerWrite: []
      parameters:
        - name: X-Remudero-Operator
          in: header
          required: false
          description: >
            The operator's display name, stored on the message for audit only -- never an
            authorisation input. Ignored unless 1-80 printable ASCII characters.
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxThreadReplyRequest"
      responses:
        "200":
          description: The reply is in the thread store; `audit` says whether its ledger row is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadReplyResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found` -- the thread names no current operator-owned inbox item."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadReplyRefusal"
        "409":
          description: >
            `reply_intent_conflict` (this `intentId` already stored a different text) or
            `reply_in_progress` (another reply on this thread holds the lock; delivery unverified).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadReplyRefusal"
        "503":
          description: "`reply_store_unavailable` -- the thread store write failed; `delivery` says whether the reply is known absent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxThreadReplyRefusal"

  /v1/inbox/thread/read:
    post:
      summary: Mark an inbox thread read up to a message.
      description: >
        W1-T4088 (src/lib/panel-graph.ts's `buildInboxThreadReadRoute`). Write tier: LOW
        (W1-T404) -- bookkeeping; changes nothing but the unread flag. Read marks only move forward.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxThreadReadRequest"
      responses:
        "200":
          description: The read mark was recorded (or was already at or past `seq`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxOkResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found` -- the thread names no current operator-owned inbox item."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"
        "409":
          description: "`seq_ahead` -- the read mark exceeds the thread's last message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"
        "500":
          description: "`thread_store_unreadable` -- the thread store could not be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRefusal"

  /v1/inbox/approve:
    post:
      summary: Approve a READY proposal -- hands off to a detached `rmd approve`.
      description: >
        W1-T193 (src/lib/panel-graph.ts's `buildApproveProposalRoute`). Write tier: HIGH
        (W1-T404) -- it moves code. Re-classifies the proposal live, reading the plan at its
        committed ref, and refuses with 409 anything not currently READY, naming why. A ready
        proposal is ledgered `panel.proposal_approve_requested` and handed to a detached
        `rmd approve`; the 200 confirms only that hand-off.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxProposalRequest"
      responses:
        "200":
          description: The approve run was handed off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxProposalStartedResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
