        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/skills:
    get:
      summary: The panel's skill action-button set, resolved from the registry.
      description: >
        "each v1 skill appears as a panel button resolved from the registry (not hard-coded
        UI)... adding a skill yaml adds a button with no UI code change" (W3-T8 acceptance) --
        the SAME `.remudero/skills/<name>.yaml` registry `rmd skill list` reads (W1-T44,
        src/lib/skill.ts), via src/lib/panel-skills.ts. Reloaded fresh on every request, so a
        skill yaml added after the daemon boots appears on the very next request.
      security:
        - bearerRead: []
      responses:
        "200":
          description: The button set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/skills/run:
    post:
      summary: Invoke a registry skill button -- today, Refine (plan/clarify) only.
      description: >
        "invoking Refine from the panel runs the plan --mode=clarify skill and shows the grill
        inline... the answer flows back" (W3-T8 acceptance) -- src/lib/panel-skill-run.ts.
        `{ skill: "plan", mode: "clarify" }` (Refine) grounds via the REAL, ALREADY-MERGED §5C
        linter (src/lib/task-linter.ts) and parks the result as a `grilling`
        plan/feedback/<id>.yaml entry (src/lib/feedback.ts) -- the SAME entry GET /v1/feedback
        already renders inline and POST /v1/feedback's `replyTo` already answers (W3-T6). Any
        other skill/mode is a 400 naming exactly what is not yet wired, never a silent no-op.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSkillRequest"
      responses:
        "200":
          description: The invoked skill, echoed back with the grill it parked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSkillResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/status/stream:
    get:
      summary: SSE stream of task state flips -- one `status` event per changed StatusProjection.
      description: >
        Live companion to GET /v1/status (MASTER-PLAN §7, WS-5a -> W3-T2): the daemon tails
        state/ledger.ndjson (src/lib/board.ts's `buildStatusStream`) and, for every new line
        naming a task whose derived StatusProjection actually changed, emits an SSE `status`
        event carrying that StatusProjection (src/lib/service.ts's SSE framing). Requires a
        read-scoped bearer token, same as GET /v1/status.
      security:
        - bearerRead: []
      responses:
        "200":
          description: >
            An open text/event-stream connection. Event framing is outside this OpenAPI
            subset's response-body modeling -- each `status` event's `data` payload is a
            components.schemas.StatusProjection.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
