        hypothesis:
          type: string
        intervention:
          $ref: "#/components/schemas/OperatorAgentExperimentIntervention"
        scope:
          $ref: "#/components/schemas/OperatorAgentExperimentScope"
        baseline:
          $ref: "#/components/schemas/OperatorAgentExperimentBaseline"
        rollback:
          $ref: "#/components/schemas/OperatorAgentExperimentRollback"
        createdAt:
          type: string
          format: date-time
        state:
