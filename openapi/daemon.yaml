      summary: Delete a context item and retain its bounded deletion receipt.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextActionRequest"
      responses:
        "200":
          description: Bounded deletion receipt; raw private content is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/context-controls/inventory:
    get:
      summary: W1-T3893 self-service context inventory, scoped to one principal.
      description: >
        Metadata-only, like GET /v1/operator-agent/context, but requires a `principal` and
        narrows the result to that principal's context alone — the operator self-service framing
        the underlying context-governance inventory does not itself provide.
      security:
        - bearerRead: []
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: false
          schema:
            type: string
        - name: authorityRef
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Metadata-only, principal-scoped context inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextControlsInventoryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/context-controls/forget:
    post:
      summary: W1-T3893 self-service "forget" — permanently delete a context item.
      description: >
        A thin, operator-facing named wrapper over POST /v1/operator-agent/context/delete: the
        SAME receipt engine, idempotency, and restart-safe ledger step.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextActionRequest"
      responses:
        "200":
          description: Bounded deletion receipt; raw private content is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/context-controls/revoke:
    post:
      summary: W1-T3893 self-service revoke — a thin named wrapper over POST /v1/operator-agent/context/revoke.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextActionRequest"
      responses:
        "200":
          description: Bounded revocation receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReceiptResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/context-controls/export:
    get:
      summary: W1-T3893 user-authorized export — bounded, redacted, scoped, coverage-checked.
      description: >
        Scoped to exactly one principal AND purpose AND authority. Returns `status: completed`
        ONLY when every selected item's full derivation chain is available; otherwise refuses
        (HTTP 409, `status: refused`) with a `reason` — never a partial "completed" response.
      security:
        - bearerRead: []
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          schema:
            type: string
        - name: authorityRef
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed export — bounded, redacted items for the requested scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextExportResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Refused — absent, incomplete source coverage, or past the bounded item limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextExportResult"

  /v1/operator-agent/ask:
    post:
      summary: Read-only, evidence-cited answer-v1 for this serving instance's repository.
      description: >
        Authenticated read operation despite POST. The server owns repository and instance scope;
        request JSON accepts only a bounded question. Cross-repository aggregation and navigation
        belong to the console. No action, approval, proposal, task, or ledger write occurs here.
        Unsupported or missing evidence is explicit, not converted into a confident answer.
      security:
        - bearerRead: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: answer-v1 with verified, partial, unavailable, or unsupported coverage.
          content:
            application/json:
              schema:
                type: object
                required: [version, repository, instance, lens, coverage, answer, citations, missingSources, generatedAt]
                properties:
                  version:
                    type: string
                    enum: [answer-v1]
                  repository:
                    type: [string, "null"]
                  instance:
                    type: string
                  lens:
                    type: string
                    enum: [current-repository]
                  coverage:
                    type: string
                    enum: [verified, partial, unavailable, unsupported]
                  answer:
                    type: string
                    maxLength: 700
                  generatedAt:
                    type: string
                    format: date-time
                  citations:
                    type: array
                    maxItems: 4
                    items:
                      type: object
                      required: [sourceId, observedAt, freshness, label, value]
                      properties:
                        sourceId: { type: string }
                        observedAt: { type: string, format: date-time }
                        freshness: { type: string, enum: [verified, stale] }
                        label: { type: string }
                        value: { type: string }
                  missingSources:
                    type: array
                    items:
                      type: object
                      required: [sourceId, reason]
                      properties:
                        sourceId: { type: string }
                        reason: { type: string }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/operator-agent/proposals:
    get:
      summary: Read durable operator-agent proposals and decision history.
      description: >
        Returns only proposal, decision, and observed-outcome records reconstructed from the
        append-only ledger, including supported rotated ledger files. No raw analytics payload or
        bearer token is returned.
      security:
        - bearerRead: []
      responses:
        "200":
          description: Durable operator-agent history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAgentProposalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register an evidence-backed operator-agent proposal.
      description: >
        Idempotently records the proposal identity and evidence in the ledger. A repeated
        proposalId with different repository or text is rejected as a conflict.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentProposalRegistration"
      responses:
        "201":
          description: Proposal registered.
        "200":
          description: Identical proposal already registered.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/proposals/decision:
    post:
      summary: Record an operator decision on an operator-agent proposal.
      description: >
        Records accepted, rejected, or more-info. More-info leaves the proposal pending and is
        retained as a learning signal. Accepted proposals have no outcome until a later outcome
        request supplies observed evidence.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentDecisionRequest"
      responses:
        "200":
          description: Decision recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/proposals/outcome:
    post:
      summary: Record a later observed outcome for an accepted proposal.
      security:
        - bearerWrite: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorAgentOutcomeRequest"
      responses:
        "200":
          description: Outcome recorded.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/operator-agent/settings:
    get:
      summary: Read durable operator-agent settings.
