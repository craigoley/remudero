            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,254}$"
        - name: lines
          in: query
          required: false
          description: A positive integer; anything else falls back to 50, and values above 500 are capped.
          schema:
            type: integer
      responses:
        "200":
          description: "The tail, or `found: false` with the reason no tail was read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeekResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/replay:
    get:
      summary: The incident timeline -- `rmd replay`'s narration of a ledger window, as HTML.
      description: >
        src/lib/serve.ts's `buildReplayRoute`: narrates the ledger archive-and-live union between
        `since` and `until` via src/lib/ledger-replay.ts's `buildReplay`, rendered as an escaped
        server-side HTML fragment (`div.replay-panel[data-replay=ok]`). A partial corpus is
        refused, never narrated short: the same 200 then carries `rmd replay`'s own refusal text
        in `div.replay-panel.replay-refused[data-replay=refused]`.
      security:
        - bearerRead: []
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
        - name: until
          in: query
          required: true
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: Narrow to one task id, as `rmd replay --task`.
          schema:
            type: string
        - name: step
          in: query
          required: false
          description: Narrow to steps with this prefix, as `rmd replay --step`.
          schema:
            type: string
      responses:
        "200":
          description: An HTML fragment -- the narration, or the refusal for a partial corpus.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/self-measurement:
    get:
      summary: The newest self-measurement cadence rows, summarized, or one verb's full report.
      description: >
        src/lib/serve.ts's `buildSelfMeasurementRoute` over src/lib/measurement-cadence.ts:
        without `detail`, the newest ten `measurement_cadence.ran` rows with each verb reduced to
        its headline summary -- or `status: unreadable` when the ledger union cannot be read in
        full, never an empty "never measured". With `?detail=<verb>`, that verb's full report
        from the newest row carrying it.
      security:
        - bearerRead: []
      parameters:
        - name: detail
          in: query
          required: false
          description: One cadence verb name, e.g. `autonomyRate`.
          schema:
            type: string
            pattern: "^[A-Za-z][A-Za-z0-9]{0,63}$"
      responses:
        "200":
          description: >
            `SelfMeasurementRows` or `SelfMeasurementUnreadable` without `detail`;
            `SelfMeasurementDetail` with it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SelfMeasurementRows"
                  - $ref: "#/components/schemas/SelfMeasurementUnreadable"
                  - $ref: "#/components/schemas/SelfMeasurementDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`detail` named a verb no measurement row carries (`error: not_found` with a `detail`)."
