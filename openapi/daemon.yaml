      type: object
      description: A redacted external-effect reconciliation receipt; connector payloads never cross the daemon boundary.
      required:
        - version
        - originatingActionId
        - originatingReceiptId
        - capabilityGrantId
        - connector
        - targetIdentity
        - requestedOperation
        - preconditionSnapshot
        - expectedPostconditions
        - observation
        - idempotencyKey
        - reconciliationState
        - retryPath
        - evidenceReference
        - safeToComplete
      properties:
        version:
          type: string
          enum: [external-effect-v1]
        originatingActionId:
          type: string
        originatingReceiptId:
          type: string
        capabilityGrantId:
          type: string
        connector:
          type: string
        targetIdentity:
          type: string
        requestedOperation:
          type: string
        preconditionSnapshot:
          type: object
          additionalProperties: true
        expectedPostconditions:
          type: array
          items:
            type: object
            required: [path, equals]
            properties:
              path:
                type: string
              equals:
                type: object
                additionalProperties: true
                description: JSON-compatible expected value; scalar values are preserved by the daemon even though the generated client represents this open object conservatively.
              description:
                type: string
        observedState:
          type: object
          additionalProperties: true
        observation:
          type: object
          required: [status, maxAgeMs]
          properties:
            status:
              type: string
              enum: [fresh, stale, unavailable]
            observedAt:
              type: string
              format: date-time
            ageMs:
              type: number
              minimum: 0
            maxAgeMs:
              type: number
              minimum: 0
        idempotencyKey:
          type: string
        reconciliationState:
          type: string
          enum: [applied, refused, pending, partially-applied, drifted, stale, unobservable]
        partialSuccess:
          type: object
          required: [satisfied, unsatisfied]
          properties:
            satisfied:
              type: array
              items:
                type: string
            unsatisfied:
              type: array
              items:
                type: string
        retryPath:
          type: object
          required: [kind, allowed, reason]
