version: 2
updates:
  # remudero's package.json lives at the repo root; the worker image has its own lockfile for the two
  # baked CLI packages in /deploy. One npm lane covers both directories because a group in a lane with
  # `directories` lands as ONE pull request across them (W1-T14823): the agent SDK and the image's Claude
  # Code CLI must move together, or the-haiku55-image-pins-match-its-sdk fails on each half alone.
  # The groups still keep the directories apart otherwise: every /deploy package is named by an image
  # group below and excluded from the app group, so an app dependency update never silently changes the
  # image.
  - package-ecosystem: npm
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
    # The two lanes this replaced allowed 10 (/) and 5 (/deploy).
    open-pull-requests-limit: 15
    # head-identity-gate admits a bump by its `chore(deps)` subject; pin it rather than let
    # Dependabot infer `build(deps)` from history.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # IGNORE-FREE by design (MASTER-PLAN §5 FLEET FINDING): minor+patch
    # bumps are grouped so they don't flood one-PR-per-bump; MAJOR bumps
    # are excluded from AUTO-MERGE at the dep-review lane (W1-T54), never
    # via an `ignore:` block here.
    # A dependency joins the FIRST group it matches, so the shared group comes first.
    groups:
      agent-sdk-and-image-cli:
        patterns:
          - "@anthropic-ai/claude-agent-sdk"
          - "@anthropic-ai/claude-code"
        update-types:
          - minor
          - patch
      image-cli-minor-and-patch:
        patterns:
          - "@anthropic-ai/claude-code"
          - "@openai/codex"
        update-types:
          - minor
          - patch
      npm-minor-and-patch:
        exclude-patterns:
          - "@anthropic-ai/claude-code"
          - "@openai/codex"
        update-types:
          - minor
          - patch

  # Refreshes deploy/Dockerfile's immutable Node digest when the base image changes.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    # A Node major is a coordinated change to .nvmrc, the image and the code (W1-T5882), moved
    # only by plan. Minor, patch and digest renewals still flow.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Keeps the SHA-pinned actions in .github/workflows fresh — Dependabot
  # bumps the pinned SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
