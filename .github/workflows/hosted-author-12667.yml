name: Hosted author pilot 12667
on:
  push:
    branches:
      - run-unfiled-1792334880000
    paths:
      - .github/workflows/hosted-author-12667.yml
permissions:
  contents: read
concurrency:
  group: hosted-author-12667-exact-head
  cancel-in-progress: false
jobs:
  author:
    name: hosted-instrument-companion-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      SOURCE_HEAD: e9028a8423f2e93406730121f244e806f5e24ffa
      CAPTURED_BASE: 350a59d4dc273c65628bbb95be9d1416b6c678c2
      SOURCE_BUNDLE_SHA256: 8f072c238ccdf4420fb2829682b1f1367bd6771f85e3f29610409665181c48de
      PUBLICATION_BRANCH: run-unfiled-1792341522996
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pilot-browsers
      PILOT_CONCERN: instrument-companion
    steps:
      - name: Fix one total deadline including setup and calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, os
          deadline = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=195)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PILOT_DEADLINE=' + deadline.isoformat() + '\n')
          PY

          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const tmp=process.env.RUNNER_TEMP;
          fs.writeFileSync(path.join(tmp,'hosted-author-12667.mjs'),process.env.PILOT_CONTROLLER_JS,{flag:'wx',mode:0o600});
          fs.writeFileSync(path.join(tmp,'pilot-source-input.json'),JSON.stringify({format:'rmd-hosted-author-input-v1',head:process.env.SOURCE_HEAD,base:process.env.CAPTURED_BASE,bundleSha256:process.env.SOURCE_BUNDLE_SHA256,bundleBytes:Buffer.from(process.env.PILOT_SOURCE_BUNDLE_B64,'base64').length,requiredPublicPrerequisite:process.env.CAPTURED_BASE,bundleBase64:process.env.PILOT_SOURCE_BUNDLE_B64}),{flag:'wx',mode:0o600});
          JS
        env:
          PILOT_CONTROLLER_JS: |
            import fs from 'node:fs';
            import cp from 'node:child_process';
            import os from 'node:os';
            import path from 'node:path';
            import crypto from 'node:crypto';
            import assert from 'node:assert/strict';
            import net from 'node:net';
            import {pathToFileURL} from 'node:url';
            const [mode,configPath]=process.argv.slice(2);
            const config=JSON.parse(fs.readFileSync(configPath,'utf8'));
            const {source,head,base,publicationBranch,deadline,output,privateHome,privateTmp,browsers}=config;
            const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const git=args=>cp.execFileSync('git',['-C',source,...args],{encoding:'utf8',timeout:60000,maxBuffer:8*1024*1024}).trim();
            const save=(name,value)=>fs.writeFileSync(path.join(output,name),JSON.stringify(value,null,2)+'\n',{flag:'wx',mode:0o600});
            const sample=()=>{
             const mem=Object.fromEntries(fs.readFileSync('/proc/meminfo','utf8').split('\n').filter(l=>/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/.test(l)).map(l=>[l.split(':')[0],Number(l.trim().split(/\s+/)[1])*1024]));
             const vm=Object.fromEntries(fs.readFileSync('/proc/vmstat','utf8').trim().split('\n').map(l=>l.split(/\s+/)));
             const psi=Object.fromEntries(fs.readFileSync('/proc/pressure/memory','utf8').split('\n').find(l=>l.startsWith('full ')).split(' ').slice(1).map(x=>x.split('=')));
             return{at:new Date().toISOString(),memory:mem,swapInPages:Number(vm.pswpin),fullAvg60:Number(psi.avg60),workspaceFree:Number(fs.statfsSync(source).bavail)*Number(fs.statfsSync(source).bsize),tempFree:Number(fs.statfsSync(privateTmp).bavail)*Number(fs.statfsSync(privateTmp).bsize)};
            };
            if(mode==='prepare'){
             assert(/^[a-f0-9]{40}$/.test(head)&&/^[a-f0-9]{40}$/.test(base));
             assert.equal(git(['rev-parse','HEAD']),head);assert.equal(git(['rev-parse','--is-shallow-repository']),'false');assert.equal(git(['status','--porcelain']),'');
             assert.equal(fs.readFileSync(path.join(source,'.nvmrc'),'utf8').trim().replace(/^v/,''),process.versions.node);
             assert(Date.parse(deadline)>Date.now(),'Fixed pilot deadline already elapsed');
             for(const dir of[output,privateHome,privateTmp])fs.mkdirSync(dir,{recursive:false,mode:0o700});
             assert(!fs.existsSync(path.join(source,'.git','objects','info','alternates')),'Borrowed Git objects are not admitted');
             git(['checkout','-b',publicationBranch,head]);git(['config','core.hooksPath','hooks']);
             const mirror=path.join(path.dirname(output),'pilot-main.git');assert(!fs.existsSync(mirror));cp.execFileSync('git',['clone','--mirror','--no-local','--no-hardlinks',source,mirror],{encoding:'utf8',timeout:120000});
             cp.execFileSync('git',['-C',mirror,'update-ref','refs/heads/main',base],{encoding:'utf8',timeout:10000});
             git(['remote','set-url','origin','file://'+mirror]);
             const out={pilot:12667,stage:'prepared',at:new Date().toISOString(),head,base,tree:git(['rev-parse','HEAD^{tree}']),publicationBranch,deadline,node:process.version,platform:process.platform,arch:process.arch,kernel:os.release(),cpus:os.availableParallelism(),source,mirror,locks:{package:hash(path.join(source,'package-lock.json')),manifest:hash(path.join(source,'scripts/test-tier-manifest.json'))},limits:'Fresh public source and lockfile-installed dependencies only; source gate will fetch captured public main from a complete file-only mirror. No production state, credentials or test result reuse.'};save('prepared.json',out);console.log(JSON.stringify(out));
            }else if(mode==='run'){
             assert.equal(process.getuid(),config.uid,'Validation must retain the non-root runner identity');assert.equal(process.env.HOME,privateHome);assert.equal(process.env.TMPDIR,privateTmp);
             assert.notEqual(fs.readlinkSync('/proc/self/ns/net'),config.hostNetNamespace,'Validation network namespace was not isolated');
             const server=net.createServer(socket=>socket.end('loopback-control'));
             await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(0,'127.0.0.1',resolve);});
             const port=server.address().port;
             const loopback=await new Promise((resolve,reject)=>{let text='';const socket=net.connect(port,'127.0.0.1');socket.on('data',b=>text+=b);socket.once('error',reject);socket.once('end',()=>resolve(text));});
             await new Promise(resolve=>server.close(resolve));assert.equal(loopback,'loopback-control');
             save('network-control.json',{pilot:12667,isolatedNamespace:fs.readlinkSync('/proc/self/ns/net'),hostNamespace:config.hostNetNamespace,loopback:'passed',routeTable:fs.readFileSync('/proc/net/route','utf8'),limits:'Loopback positive in a fresh network namespace; no production endpoint or credentials used.'});
             assert.equal(git(['rev-parse','HEAD']),head);assert.equal(git(['status','--porcelain']),'');assert.equal(process.versions.node,fs.readFileSync(path.join(source,'.nvmrc'),'utf8').trim());
             const first=sample();await new Promise(r=>setTimeout(r,30000));const last=sample();
             const checks={memory:min(first.memory.MemAvailable,last.memory.MemAvailable)>=7*1024**3,disk:min(first.workspaceFree,last.workspaceFree,first.tempFree,last.tempFree)>=20*1024**3,noSwapIn:first.swapInPages===last.swapInPages,pressure:Math.max(first.fullAvg60,last.fullAvg60)<0.5};
             save('admission.json',{pilot:12667,at:new Date().toISOString(),head,deadline,first,last,checks,admitted:Object.values(checks).every(Boolean)});assert(Object.values(checks).every(Boolean),'Hosted admission refused after setup; no gate started');
             const command=async(name,args,program=process.execPath,options={})=>{
              assert(Date.now()<Date.parse(deadline),'Fixed deadline elapsed');
              const paths={stdout:path.join(output,name+'.stdout.log'),stderr:path.join(output,name+'.stderr.log')};
              const out=fs.openSync(paths.stdout,'wx',0o600),err=fs.openSync(paths.stderr,'wx',0o600),started=Date.now();
              let reason=null,error=null,escalation;const child=cp.spawn(program,args,{cwd:options.cwd??source,env:{...process.env,...options.env},stdio:['ignore',out,err],detached:true});
              const alive=()=>{if(!child.pid)return false;try{process.kill(-child.pid,0);return true;}catch(e){if(e.code==='ESRCH')return false;throw e;}};
              const stop=why=>{if(reason)return;reason=why;if(alive())process.kill(-child.pid,'SIGTERM');escalation=setTimeout(()=>{if(alive())process.kill(-child.pid,'SIGKILL');},15000);escalation.unref();};
              const timer=setTimeout(()=>stop('fixed-deadline'),Math.max(1,Date.parse(deadline)-Date.now()));timer.unref();
              const leaseTimer=options.ownsSlot?setInterval(()=>{if(!options.ownsSlot())stop('test-slot-lost-or-unknown');},1000):null;leaseTimer?.unref();
              const exit=await new Promise(resolve=>{child.once('error',e=>{error={code:e.code,message:e.message};});child.once('close',(status,signal)=>resolve({status,signal}));});
              clearTimeout(timer);if(leaseTimer)clearInterval(leaseTimer);
              for(let i=0;i<20&&alive();i++)await new Promise(r=>setTimeout(r,50));
              if(alive()){stop('descendants-after-parent-close');for(let i=0;i<320&&alive();i++)await new Promise(r=>setTimeout(r,50));}
              if(escalation)clearTimeout(escalation);const groupClosed=!alive();fs.closeSync(out);fs.closeSync(err);
              const result={...exit,error,reason,outputComplete:groupClosed&&!reason&&!error&&!exit.signal,startedAt:new Date(started).toISOString(),finishedAt:new Date().toISOString(),durationMs:Date.now()-started,ownedGroup:child.pid,groupClosed,stdout:fs.readFileSync(paths.stdout,'utf8'),stderr:fs.readFileSync(paths.stderr,'utf8')};
              save(name+'.native.json',{...result,stdout:undefined,stderr:undefined,stdoutBytes:Buffer.byteLength(result.stdout),stderrBytes:Buffer.byteLength(result.stderr),resources:sample()});
              console.log(JSON.stringify({stage:name,status:result.status,durationMs:result.durationMs,outputComplete:result.outputComplete,reason:result.reason}));
              return result;
             };
             let final, companionEvidence;
             try{
              const refLine='refs/heads/'+publicationBranch+' '+head+' refs/heads/'+publicationBranch+' '+'0'.repeat(40);
              const sourcePrepush=await command('source-pre-push',['--noprofile','--norc','-c','set -euo pipefail; printf "%s\\n" "$1" | /bin/sh hooks/pre-push origin "$2"','pilot-prepush',refLine,git(['remote','get-url','origin'])],'/bin/bash');
              assert.equal(sourcePrepush.status,0,'Unchanged source pre-push hook did not pass');assert(!sourcePrepush.error&&!sourcePrepush.signal&&sourcePrepush.outputComplete===true);
              if(config.concern==='instrument-companion')companionEvidence=await companionControls(command,config);
              const selection=await command('selection',['--import','tsx','scripts/preflight-author.mjs','--dry-run','--head-ref',publicationBranch,'--head-sha',head]);assert.equal(selection.status,0);assert(!selection.error&&!selection.signal);
              fs.copyFileSync(path.join(source,'coverage/preflight-author.json'),path.join(output,'selection.json'),fs.constants.COPYFILE_EXCL);
              const selected=JSON.parse(fs.readFileSync(path.join(output,'selection.json'),'utf8'));assert.equal(selected.headSha,head);assert.equal(selected.baseSha,base);assert(selected.suites.length>0);for(const file of selected.suites)assert(fs.lstatSync(path.join(source,file)).isFile(),file);
              const calibration=await command('calibration',['--import','tsx','scripts/calibrate-author-runtime.mjs']);assert.equal(calibration.status,0);assert(!calibration.error&&!calibration.signal);
              const rows=fs.readFileSync(path.join(output,'calibration.stdout.log'),'utf8').trim().split('\n').flatMap(s=>{try{return[JSON.parse(s)];}catch{return[];}});const profile=rows.findLast(r=>r.head===head&&r.samples===32&&r.path);assert(profile,'No source-bound32-file maintained profile');
              const author=await command('author',['--import','tsx','scripts/preflight-author.mjs','--head-ref',publicationBranch,'--head-sha',head,'--deadline',deadline,'--runtime-profile',profile.path]);
              const receipt=JSON.parse(fs.readFileSync(path.join(source,'coverage/preflight-author.json'),'utf8'));fs.copyFileSync(path.join(source,'coverage/preflight-author.json'),path.join(output,'author-receipt.json'),fs.constants.COPYFILE_EXCL);
              assert.deepEqual(receipt.suites,selected.suites,'Full physical selection changed during validation');for(const file of receipt.suites)assert(fs.lstatSync(path.join(source,file)).isFile(),file);
              const test=receipt.steps.find(s=>s.name==='affected-tests'),summary=test?.testSummary;
              const passed=author.status===0&&!author.error&&!author.signal&&author.outputComplete===true&&receipt.verdict==='passed'&&receipt.headSha===head&&receipt.baseSha===base&&receipt.steps.every(s=>s.ok===true)&&!receipt.tiered&&test?.judge?.complete===true&&summary?.tests>0&&summary.fail===0&&summary.cancelled===0&&summary.todo===0&&summary.pass+summary.skipped===summary.tests;
              final={pilot:12667,at:new Date().toISOString(),head,base,tree:git(['rev-parse','HEAD^{tree}']),deadline,passed,status:author.status,selectedPhysicalFiles:receipt.suites.length,summary,conditionalSkips:summary?.skipped??null,companionControls:companionEvidence??null,judge:test?.judge,slot:receipt.testSlot,executionWorkers:receipt.executionWorkers,runtimeAdmission:receipt.runtimeAdmission,capacity:receipt.capacity,finalResources:sample(),phaseAccounting:receipt.phaseAccounting??null,limits:'Exact-head author gate only. Conditional platform test skips are disclosed, never tests credited as passed; no required check or selected physical suite was manually omitted. Hosted required CI/security/review, publication/reopening and live adoption remain separate.'};
              save('final.json',final);assert(passed,'Actual maintained author gate did not qualify this head');
             }catch(error){if(!final){final={pilot:12667,at:new Date().toISOString(),head,base,deadline,passed:false,error:{message:error.message},limits:'Terminal pilot failure/refusal; no retry, deadline reset, source publication or production action.'};save('final.json',final);}throw error;}
             finally{const coverage=path.join(source,'coverage');if(fs.existsSync(coverage))for(const name of fs.readdirSync(coverage).filter(n=>n.startsWith('rmd-author-')||n.startsWith('rmd-native-runtime-')||n==='preflight-author-static.json'))fs.cpSync(path.join(coverage,name),path.join(output,name),{recursive:true,errorOnExist:true,force:false});}
             console.log(JSON.stringify(final));
            }else throw Error('Unknown pilot mode');
            function min(...values){return Math.min(...values);}

            async function companionControls(command,config){
             const {source,base,head,output,privateTmp,deadline}=config;
             const {acquireTestSlot,testSlotExecutionAllowed,lowPriorityCommand,testRunArgv,startTestSlotHeartbeat}=await import(pathToFileURL(path.join(source,'src/lib/test-slot.ts')).href);
             const file='test/instrument-surface-completeness.test.ts',sourceText=fs.readFileSync(path.join(source,'src/lib/review.ts'),'utf8'),testText=fs.readFileSync(path.join(source,file),'utf8');
             const titles=['hosted author and calibration tools are exact protected instruments, never data exclusions','the generated document index is data while its freshness and path checks remain wired','hosted tooling registration still refuses a newly unregistered executable in a workflow'];
             assert(fs.lstatSync(path.join(source,file)).isFile());for(const title of titles)assert(testText.includes(title));
             const budget=Date.parse(deadline)-Date.now();assert(budget>60000,'No fixed-deadline room for real companion controls');
             const slot=acquireTestSlot('hosted-instrument-companion:controls',{waitBoundMs:Math.min(10*60*1000,budget-60000)});
             assert.equal(slot.outcome,'acquired');assert(testSlotExecutionAllowed(slot)&&slot.childEnvironment,'No real inherited test-slot capacity for controls');
             const root=fs.mkdtempSync(path.join(privateTmp,'companion-falsifiers-')),cases=[];let slotLost=false;
             let heartbeat;
             const summary=text=>Object.fromEntries(['tests','pass','fail','cancelled','skipped','todo'].map(k=>[k,Number([...text.matchAll(new RegExp('^# '+k+' ([0-9]+)$','gm'))].at(-1)?.[1]??NaN)]));
             const run=async(label,repo,expectedFailure)=>{
              assert(!slotLost);slot.refresh();
              assert(fs.lstatSync(path.join(repo,file)).isFile(),'Verified physical fixture test required');
              const argv=testRunArgv(['--test','--test-reporter=tap','--import','tsx','--import','./test/setup/tmp-hygiene.ts',file],Math.min(1,slot.concurrency)),low=lowPriorityCommand(process.execPath,argv);
              const result=await command(label,low.args,low.file,{cwd:repo,env:slot.childEnvironment,ownsSlot:()=>!slotLost}),tap=summary(result.stdout+'\n'+result.stderr);
              assert(!result.error&&!result.signal&&result.outputComplete===true,'Fixture output incomplete: '+label);assert(tap.tests>0&&tap.cancelled===0&&tap.todo===0&&tap.skipped===0);
              const failedTitles=result.stdout.split('\n').filter(l=>l.trim().startsWith('not ok '));
              if(expectedFailure){assert.equal(result.status,1);assert(tap.fail>0&&failedTitles.some(l=>l.includes(expectedFailure)),'Expected intended companion failure: '+expectedFailure);}
              else{assert.equal(result.status,0);assert.equal(tap.fail,0);assert.equal(tap.pass,tap.tests);}
              cases.push({label,base:label==='control-base'?base:head,physicalFiles:[file],tap,expectedFailure:expectedFailure??null,failedTitles});
             };
             const fixture=(label,ref,mutate)=>{
              const repo=path.join(root,label);cp.execFileSync('git',['clone','--quiet','--no-local','--no-hardlinks','--no-checkout',source,repo],{encoding:'utf8',timeout:120000});
              cp.execFileSync('git',['-C',repo,'checkout','--detach',ref],{encoding:'utf8',timeout:20000});assert(!fs.existsSync(path.join(repo,'.git/objects/info/alternates')));
              for(const p of ['package.json','package-lock.json',...fs.readdirSync(path.join(source,'packages')).flatMap(n=>fs.existsSync(path.join(source,'packages',n,'package.json'))?['packages/'+n+'/package.json']:[])])assert.equal(hash(path.join(repo,p)),hash(path.join(source,p)),'Fixture recipe differs');
              fs.symlinkSync(path.join(source,'node_modules'),path.join(repo,'node_modules'),'dir');fs.writeFileSync(path.join(repo,file),testText);
              const target=path.join(repo,'src/lib/review.ts');if(mutate)fs.writeFileSync(target,mutate(sourceText));
              const diff=cp.execFileSync('git',['-C',repo,'diff','--','src/lib/review.ts',file],{encoding:'utf8',timeout:20000,maxBuffer:2*1024*1024});
              fs.writeFileSync(path.join(output,label+'.fixture.diff'),diff,{flag:'wx',mode:0o600});return repo;
             };
             try{
              heartbeat=slot.heartbeat?startTestSlotHeartbeat(slot.heartbeat,row=>{fs.appendFileSync(path.join(output,'controls-heartbeats.ndjson'),JSON.stringify(row)+'\n',{mode:0o600});if(['test_slot.heartbeat_lost','test_slot.heartbeat_failed'].includes(row.step))slotLost=true;}):null;
              await run('control-head',source);
              await run('control-base',fixture('base',base),titles[0]);
              for(const [i,p]of ['scripts/preflight-author.mjs','scripts/calibrate-author-runtime.mjs'].entries()){
               const repo=fixture('remove-tool-'+i,head,text=>{const lines=text.split('\n'),needle=JSON.stringify('^'+p.replaceAll('.','\\.')+'$')+',';assert.equal(lines.filter(l=>l.trim()===needle).length,1);return lines.filter(l=>l.trim()!==needle).join('\n');});
               await run('control-remove-tool-'+i,repo,titles[0]);
              }
              const noData=fixture('remove-data',head,text=>{const lines=text.split('\n'),start=lines.findIndex(l=>l.trim()==='"docs/docs-index.json":'),end=lines.findIndex((l,i)=>i>start&&l.trim().endsWith('",'));assert(start>0&&end>start&&end-start<8);lines.splice(start,end-start+1);return lines.join('\n');});
              await run('control-remove-data',noData,titles[1]);
              const waived=fixture('bad-executable-exclusion',head,text=>{const anchor='export const INSTRUMENT_SURFACE_EXCLUSIONS: Readonly<Record<string, string>> = {';assert(text.includes(anchor));return text.replace(anchor,anchor+'\n  "scripts/unregistered-hosted-control.mjs": "Deliberately wrong disposable fixture, never source policy.",');});
              await run('control-bad-executable-exclusion',waived,titles[2]);
              await run('control-restored-head',source);
              assert(!slotLost,'Test-slot uncertainty cannot qualify companion controls');
             }finally{heartbeat?.stop(true);slot.release();assert.equal(cp.execFileSync('git',['-C',source,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),head);assert.equal(cp.execFileSync('git',['-C',source,'status','--porcelain'],{encoding:'utf8'}).trim(),'');assert(root.startsWith(privateTmp+'/companion-falsifiers-')&&root!==source);fs.rmSync(root,{recursive:true});}
             const out={head,base,slot:{outcome:slot.outcome,concurrency:slot.concurrency,waitedMs:slot.waitedMs},cases,sourceRestoredClean:true,limits:'Real full physical-file controls plus base and four deliberately wrong disposable fixtures. Expected red controls are not author PASS; the unchanged full author selection still follows.'};
             fs.writeFileSync(path.join(output,'companion-controls.json'),JSON.stringify(out,null,2)+'\n',{flag:'wx',mode:0o600});return out;
            }
          PILOT_SOURCE_BUNDLE_B64: 
      - name: Checkout the reviewed pilot controller without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pilot-control
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and reconstruct the exact source from its checksummed Git input
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import cp from 'node:child_process';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const root=process.env.GITHUB_WORKSPACE,control=path.join(root,'pilot-control'),source=path.join(root,'source');
          const input=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'pilot-source-input.json'),'utf8'));
          assert.equal(input.format,'rmd-hosted-author-input-v1');assert.equal(input.head,process.env.SOURCE_HEAD);assert.equal(input.base,process.env.CAPTURED_BASE);assert.equal(input.bundleSha256,process.env.SOURCE_BUNDLE_SHA256);
          const bytes=Buffer.from(input.bundleBase64,'base64');assert.equal(bytes.length,input.bundleBytes);assert(bytes.length<10*1024*1024);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),input.bundleSha256);
          const bundle=path.join(process.env.RUNNER_TEMP,'pilot-source-input.bundle');fs.writeFileSync(bundle,bytes,{flag:'wx',mode:0o600});
          const git=(dir,args)=>cp.execFileSync('git',['-C',dir,...args],{encoding:'utf8',timeout:120000}).trim();
          git(control,['cat-file','-e',input.base+'^{commit}']);
          cp.execFileSync('git',['clone','--no-local','--no-hardlinks','--no-checkout',control,source],{encoding:'utf8',timeout:120000});
          git(source,['fetch',control,'refs/remotes/origin/main:refs/remotes/origin/main']);git(source,['cat-file','-e',input.base+'^{commit}']);
          git(source,['bundle','verify',bundle]);assert.equal(git(source,['bundle','list-heads',bundle]),input.head+' HEAD');
          git(source,['fetch',bundle,'HEAD:refs/heads/pilot-input']);git(source,['checkout','--detach',input.head]);assert.equal(git(source,['rev-parse','HEAD']),input.head);assert.equal(git(source,['status','--porcelain']),'');
          console.log(JSON.stringify({stage:'source-reconstructed',head:input.head,base:input.base,bundleSha256:input.bundleSha256,bundleBytes:bytes.length,author:'NOT_RUN'}));
          JS
      - name: Use the source tree's pinned runtime and npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact locked dependencies
        working-directory: source
        run: npm ci
      - name: Install the browser required by normal repository tests
        working-directory: source
        run: npx --no-install playwright install chromium
      - name: Prepare complete local source inputs without production state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const tmp=process.env.RUNNER_TEMP,workspace=process.env.GITHUB_WORKSPACE;
