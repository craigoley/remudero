name: Security merge policy

# Trusted metadata producer: no PR source, dependency install, artifact download or model call.
# Staged producer only. Requiring its context is a separate, verified activation boundary.
# No pull_request_target trigger: GitHub blocks it by default in public repositories from
# 2026-12-02 (github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2).
# Every PR head that starts ci.yml also starts semgrep-runtime-compatibility.yml (same events,
# main, no path filter), so every head that can earn the required ci-gate reaches this producer
# through workflow_run. A conflicted or [skip ci] head starts neither until a later push.
on:
  workflow_run:
    workflows: [CodeQL, Semgrep runtime compatibility]
    types: [requested, in_progress, completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open PR to backfill after trusted main adoption
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: security-policy-producer
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Publish exact-head policy from trusted metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/security-merge-producer.mjs
