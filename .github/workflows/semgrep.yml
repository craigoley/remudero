name: Semgrep

on:
  pull_request:
    branches: [main]
    # W1-T4401: codeql.yml's PLAN/DOCS fast lane. Semgrep is ADVISORY, so a skipped run cannot deadlock ci-gate.
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "learnings/**"
      - "**/*.md"
  schedule:
    # Nightly, 03:46 UTC (W1-T4401: replaces push-to-main plus weekly; staggered from OSV's 03:14).
    - cron: "46 3 * * *"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions scores a topLevel write worse than the
# same permission at job level, even with one job — W1-T66); the job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan
    # The runtime lock deliberately targets CPython 3.12 / Linux x86_64.
    runs-on: ubuntu-24.04
    # R-50: observed PR runs complete in ~1-2 minutes; 20m bounds a genuine hang with
    # generous headroom.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    # Native CE avoids Docker Hub and image redistribution; build/runtime artifacts are hash-locked.
    # No Pro engine, registry token, SEMGREP_APP_TOKEN or Semgrep Cloud login.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            .github/semgrep/build-requirements.txt
            .github/semgrep/requirements.txt

      - name: Install hash-locked Community Edition
        shell: bash
        env:
          # Only Peewee's reviewed/hashed sdist builds; disable its SQLite extensions, not Semgrep's engine.
          NO_SQLITE: "1"
        run: |
          VENV="$(mktemp -d "${RUNNER_TEMP}/semgrep-ce.XXXXXX")"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip --isolated install \
            --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-deps --force-reinstall \
            -r .github/semgrep/build-requirements.txt
          # Cache downloads, not an executable environment or unverified built wheel.
          "$VENV/bin/python" -m pip --isolated download \
            --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-binary=peewee \
            --no-build-isolation --no-deps --dest "$VENV/artifacts" \
            -r .github/semgrep/requirements.txt
          # Recheck bytes; build Peewee offline with locked tools, no wheel-cache reuse; verify closure.
          "$VENV/bin/python" -m pip --isolated install \
            --no-index --find-links "$VENV/artifacts" --no-cache-dir \
            --require-hashes --only-binary=:all: --no-binary=peewee \
            --no-build-isolation --no-deps --force-reinstall \
            -r .github/semgrep/requirements.txt
          "$VENV/bin/python" -m pip check
          test "$("$VENV/bin/semgrep" --version)" = "1.180.0"
          printf '%s\n' "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        # Never fail the build here; findings surface in the Security tab via SARIF.
        env:
          # W1-T4401: a PR run reports only findings new since its base (every rule still runs; needs
          # fetch-depth 0). Empty on every other event, so those stay full, un-diffed sweeps.
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          BASELINE_ARGS=""
          if [ -n "${BASELINE_REF}" ]; then
            BASELINE_ARGS="--baseline-commit ${BASELINE_REF}"
          fi
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            ${BASELINE_ARGS}
        continue-on-error: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
