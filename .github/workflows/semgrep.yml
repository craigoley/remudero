name: Semgrep

on:
  pull_request:
    branches: [main]
    # W1-T4401: codeql.yml's PLAN/DOCS fast lane. Semgrep is ADVISORY, so a skipped run cannot deadlock ci-gate.
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "learnings/**"
      - "**/*.md"
  schedule:
    # Nightly, 03:46 UTC (W1-T4401: replaces push-to-main plus weekly; staggered from OSV's 03:14).
    - cron: "46 3 * * *"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions scores a topLevel write worse than the
# same permission at job level, even with one job — W1-T66); the job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan
    # The runtime lock deliberately targets CPython 3.12 / Linux x86_64.
    runs-on: ubuntu-24.04
    # R-50: observed PR runs complete in ~1-2 minutes; 20m bounds a genuine hang with
    # generous headroom.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    # Native CE avoids Docker Hub and image redistribution; build/runtime artifacts are hash-locked.
    # No Pro engine, registry token, SEMGREP_APP_TOKEN or Semgrep Cloud login.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            .github/semgrep/build-requirements.txt
            .github/semgrep/requirements.txt

      - name: Install hash-locked Community Edition
        shell: bash
        env:
          # The separately trusted auditor builds only approved Peewee; Semgrep assembly stays inert.
          NO_SQLITE: "1"
        run: |
          ROOT="$(mktemp -d "${RUNNER_TEMP}/semgrep-ce.XXXXXX")"
          python -I -S -B .github/semgrep/source-runtime-qualification.py \
            --install-root "$ROOT" --workspace "$GITHUB_WORKSPACE" --head "$(git rev-parse HEAD)"
          python -I -S -B - "$ROOT/install-mcp-qualification.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert result['state'] == 'HASH_BOUND_INSTALL_AND_MCP_CONTROLS_COMPLETE'
          assert all(result[name] is True for name in ('installedClosureQualified', 'mcpApiQualified', 'httpAuthQualified', 'pilotDefaultOff', 'ownerOverrideUnchanged'))
          assert result['productionOAuthIdentity'] == 'NOT_QUALIFIED'
          assert result['runtimeQualified'] is False and result['wholeCorpusQualified'] is False
          PY
          VENV="$ROOT/runtime-env"
          test "$("$VENV/bin/semgrep" --version)" = "1.181.0"
          ENGINE="$("$VENV/bin/python" -I -B -c 'from semgrep.semgrep_core import SemgrepCore; print(SemgrepCore.executable_path())')"
          case "$ENGINE" in "$VENV"/*) ;; *) echo "CE engine escaped locked environment" >&2; exit 1 ;; esac
          printf 'SEMGREP_QUALIFICATION_ENGINE=%s\n' "$ENGINE" >> "$GITHUB_ENV"
          printf '%s\n' "$VENV/bin" >> "$GITHUB_PATH"

      - name: Qualify native engine, baseline and invalid-rule refusal
        run: node scripts/semgrep-native-contract-ratchet.mjs --receipt "$RUNNER_TEMP/semgrep-qualification.json"

      - name: Run Semgrep
        id: scan
        # Never fail the build here; findings surface in the Security tab via SARIF.
        env:
          # W1-T4401: a PR run reports only findings new since its base (every rule still runs; needs
          # fetch-depth 0). Empty on every other event, so those stay full, un-diffed sweeps.
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          BASELINE_ARGS=""
          if [ -n "${BASELINE_REF}" ]; then
            BASELINE_ARGS="--baseline-commit ${BASELINE_REF}"
          fi
          set +e
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --json-output "$RUNNER_TEMP/semgrep-scan.json" \
            ${BASELINE_ARGS}
          SCAN_EXIT=$?
          printf 'exit_code=%s\n' "$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          exit "$SCAN_EXIT"
        continue-on-error: true

      - name: Record scan inventory without findings or rule redistribution
        if: always() && steps.scan.outputs.exit_code != ''
        continue-on-error: true
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          node scripts/semgrep-native-contract-ratchet.mjs \
            --json "$RUNNER_TEMP/semgrep-scan.json" --sarif semgrep.sarif --exit "$SCAN_EXIT" \
            --receipt "$RUNNER_TEMP/semgrep-scan-inventory.json"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
