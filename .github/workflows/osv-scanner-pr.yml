name: OSV-Scanner (PR)

# Diff-aware scan of the dependency tree, using Google's official reusable
# PR workflow. fail-on-vuln: true — deliberately stricter than the fleet's
# warn-only default, because W1-T23's acceptance proof is a planted
# known-CVE dependency turning THIS job red and AWAITABLE in the PR run
# (Dependabot's own alert is async and not awaitable there).
on:
  pull_request:
    branches: [main]

# Least privilege at the top level (Scorecard TokenPermissions: a topLevel write
# permission scores worse than the same permission scoped to job level — W1-T66);
# the job below passes its own, full permissions block to the reusable workflow.
permissions:
  contents: read

jobs:
  scan-pr:
    # R-50: NOT bounded with a job-level `timeout-minutes` here, deliberately -- this job's body
    # is `uses:` (a reusable-workflow call), and GitHub Actions accepts only
    # name/uses/with/secrets/needs/if/permissions/strategy on such a job; `timeout-minutes` is
    # not part of that allowed set and would be a schema violation, not a stricter bound. The
    # reusable workflow's own job (google/osv-scanner-action) carries whatever timeout its
    # author set; that is out of this repo's control.
    #
    # No actor exemption: a Dependabot PR is exactly the shape of PR that changes dependencies,
    # so it is exactly the PR this scanner must run on, not skip (W1-T211). Skipping it here was
    # doubly wrong: it exempted the highest-risk PRs from the dependency scanner, AND (once this
    # check-run's name is REQUIRED by ci-gate.yml) a skipped `uses:` reusable-workflow caller
    # registers NO check run under that nested name at all -- ci-gate.yml's own header documents
    # this as the synthwatch #102 deadlock class -- so exempting the actor would have permanently
    # blocked every Dependabot PR once ci-gate started awaiting this check instead of racing it.
    #
    # W1-T4401 evaluated (and deliberately did NOT add) a "manifest/lockfile changed" job-level
    # `if:` here, the same shape dependency-review.yml's two jobs now carry. It is the wrong shape
    # for THIS job specifically, for the identical reason the paragraph above already rules out an
    # actor exemption: this is a `uses:` reusable-workflow caller, so a skip leaves the nested
    # `scan-pr / osv-scan` check-run entirely UNREGISTERED rather than posting a green "skipped"
    # conclusion -- ci-gate.yml's REQUIRED wait loop would then time out on every PR that doesn't
    # touch a dependency (the common case), not merely fail to save the cost. This job already IS
    # "diff-aware where the tool supports it" (this file's own header) -- Google's reusable
    # workflow itself compares against the base branch's own scan and reports only newly
    # introduced vulnerabilities -- so it stays unconditional, and dependency-review.yml's two
    # jobs (which are NOT reusable-workflow callers) carry the manifest/lockfile gate instead.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # Recursively scan the repo (picks up package-lock.json at the root).
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
    permissions:
      security-events: write
      contents: read
      actions: read
