name: node-pin-follows-the-image

# W1-T6064: Dependabot's /deploy docker lane moves deploy/Dockerfile's FROM but never .nvmrc, and the
# exact-pin rule (ADR 0002) needs both, so every Node patch bump was red by construction. This syncs
# .nvmrc onto the bump within one major. The push uses the remudero-fleet App's token: a push made
# with GITHUB_TOKEN starts no new workflow run, so CI would never re-check the synced pin. The App
# key is read from DEPENDABOT secrets (a Dependabot-triggered run sees no Actions secrets); the
# token is minted only when the pin actually drifted, so this job's own push re-runs it as a no-op.
on:
  pull_request:
    paths:
      - deploy/Dockerfile

permissions:
  contents: read

jobs:
  sync:
    name: node-pin-follows-the-image
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Sync .nvmrc to the image's Node
        id: sync
        run: |
          node scripts/node-pin-follows-the-image.mjs
          if git diff --quiet -- .nvmrc; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the fleet App's Dependabot secrets
        if: steps.sync.outputs.drift == 'true'
        env:
          CLIENT_ID: ${{ secrets.RMD_FLEET_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RMD_FLEET_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::.nvmrc must move to the image's Node, but the Dependabot secrets RMD_FLEET_APP_CLIENT_ID and RMD_FLEET_APP_PRIVATE_KEY are not set, so the sync cannot be pushed. Add the remudero-fleet App's client id and private key under Settings > Secrets > Dependabot."
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.sync.outputs.drift == 'true'
        with:
          client-id: ${{ secrets.RMD_FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RMD_FLEET_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the synced pin onto the bump
        if: steps.sync.outputs.drift == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="$(cat .nvmrc)"
          git -c user.name="remudero-fleet[bot]" -c user.email="remudero-fleet[bot]@users.noreply.github.com" \
            commit -m "chore(deps): .nvmrc follows the image's Node ${version}" -- .nvmrc
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
