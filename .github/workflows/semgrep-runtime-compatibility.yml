name: Semgrep runtime compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: semgrep-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    name: semgrep-runtime-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime lock changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv --name-only \
            "$BASE_SHA...$HEAD_SHA" -- .github/semgrep/requirements.txt \
            .github/semgrep/build-requirements.txt > "$RUNNER_TEMP/runtime-lock-changes"
          if test -s "$RUNNER_TEMP/runtime-lock-changes"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Runtime locks unchanged; no dependency installation required.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned Python
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
          architecture: x64
      - name: Verify hash-locked install and dependency closure
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          NO_SQLITE: "1"
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          VENV="$(mktemp -d "${RUNNER_TEMP}/semgrep-runtime.XXXXXX")"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes \
            --only-binary=:all: --no-deps --force-reinstall \
            -r .github/semgrep/build-requirements.txt
          "$VENV/bin/python" -m pip --isolated download \
            --index-url https://pypi.org/simple --require-hashes \
            --only-binary=:all: --no-binary=peewee --no-build-isolation \
            --no-deps --dest "$VENV/artifacts" -r .github/semgrep/requirements.txt
          "$VENV/bin/python" -m pip --isolated install \
            --no-index --find-links "$VENV/artifacts" --no-cache-dir --require-hashes \
            --only-binary=:all: --no-binary=peewee --no-build-isolation --no-deps \
            --force-reinstall -r .github/semgrep/requirements.txt
          "$VENV/bin/python" -m pip check
          "$VENV/bin/semgrep" --version
          "$VENV/bin/python" -c 'import pathlib, subprocess, sys; from semgrep.semgrep_core import SemgrepCore; engine = pathlib.Path(SemgrepCore.executable_path()).resolve(); assert engine.is_relative_to(pathlib.Path(sys.prefix).resolve()); subprocess.run([str(engine), "-version"], check=True, timeout=15)'
          echo 'Dependency closure verified. Findings and vulnerability policies are separate and unchanged.'
