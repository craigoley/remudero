name: Semgrep runtime compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: semgrep-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    name: semgrep-runtime-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Trusted workflow literal binds committed auditor bytes without extra API reads.
      AUDITOR_SHA256: 803a9edd12d2e6fbad45adf6463e72c6d5c62264f6579ec96b956f4fd1f786e3
      SOURCE_RECIPE_SHA256: 6d1d2cc20e1a2fe225f913d9df815771b4e047c872bdaabbb59eceea52bcb35d
      ASSEMBLER_SHA256: 96eb19457f4799979e691459ad19ba761ab498d6576470db7c77eb5708171274
      SOURCE_POLICY_SHA256: 5cf435e3bb81a52e1583ea00008d0e46a3c0ec64d920fe6720d59f88870bd83a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime lock changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv --name-only \
            "$BASE_SHA...$HEAD_SHA" -- .github/semgrep/requirements.txt \
            .github/semgrep/build-requirements.txt > "$RUNNER_TEMP/runtime-lock-changes"
          if test -s "$RUNNER_TEMP/runtime-lock-changes"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Runtime locks unchanged; explicit success without downloads/build/install.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          # Use Git's complete diff, not API filename pagination or workflow path
          # filters. Policy-only changes still exercise the exact pinned runtime.
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv --name-only \
            "$BASE_SHA...$HEAD_SHA" -- .github/semgrep/requirements.txt \
            .github/semgrep/build-requirements.txt .github/semgrep/runtime-compatibility-audit.py \
            .github/semgrep/runtime_audit_test_fixtures.py .github/semgrep/test_runtime_compatibility_audit.py \
            .github/semgrep/runtime_audit_metadata_tests.py \
            .github/semgrep/runtime_source_recipe.py .github/semgrep/prepare-source-build.py \
            .github/semgrep/source-build-policy.json \
            .github/workflows/semgrep-runtime-compatibility.yml > "$RUNNER_TEMP/runtime-policy-changes"
          if test -s "$RUNNER_TEMP/runtime-policy-changes"; then
            echo 'test-policy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'test-policy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned Python
        if: steps.scope.outputs.test-policy == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
          architecture: x64
      - name: Create neutral private audit root
        if: steps.scope.outputs.test-policy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_ROOT="$(mktemp -d "${RUNNER_TEMP}/semgrep-audit.XXXXXX")"
          echo "AUDIT_ROOT=$AUDIT_ROOT" >> "$GITHUB_ENV"
      - name: Test Semgrep artifact audit policy
        if: steps.scope.outputs.test-policy == 'true'
        shell: bash
        env:
          AUDIT_PHASE: unit
        run: &staged_auditor_phase |
          set -euo pipefail
          # Restage exact committed bytes for EACH phase. Never execute a mutable
          # PR checkout helper or reuse an auditor a prior build could replace.
          python -I -S - "$HEAD_SHA" "$AUDITOR_SHA256" "$AUDIT_PHASE" \
            "$AUDIT_ROOT" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            "$SOURCE_RECIPE_SHA256" "$ASSEMBLER_SHA256" "$SOURCE_POLICY_SHA256" <<'PY'
          import hashlib, os, pathlib, re, subprocess, sys, tempfile
          head, auditor_sha, phase, root, workspace, scratch, recipe_sha, assembler_sha, policy_sha = sys.argv[1:]
          assert re.fullmatch(r"[a-f0-9]{40}", head)
          assert phase in {"unit", "download", "original", "build", "built", "install", "verify"}
          env = {k: v for k, v in os.environ.items() if not k.startswith("GIT_")}
          env.update(GIT_CONFIG_GLOBAL="/dev/null", GIT_CONFIG_SYSTEM="/dev/null")
          def git(*args):
              return subprocess.run(["git", "-c", "core.fsmonitor=false", "-C", workspace, *args],
                                    env=env, check=True, capture_output=True, timeout=15).stdout
          assert git("rev-parse", "HEAD").decode().strip() == head
          stage = pathlib.Path(tempfile.mkdtemp(prefix="semgrep-audit-code-", dir=scratch))
          for name, expected in (("runtime-compatibility-audit.py", auditor_sha),
                                 ("runtime_source_recipe.py", recipe_sha),
                                 ("prepare-source-build.py", assembler_sha),
                                 ("source-build-policy.json", policy_sha)):
              assert re.fullmatch(r"[a-f0-9]{64}", expected)
              path = ".github/semgrep/" + name
              record = git("ls-tree", "-z", head, "--", path)
              assert re.fullmatch(rb"100644 blob [a-f0-9]{40}\t" + re.escape(path.encode()) + rb"\x00", record)
              blob = record.split(b"\t", 1)[0].split()[2].decode()
              size = int(git("cat-file", "-s", blob))
              assert 0 < size <= 65536
              raw = git("cat-file", "blob", blob)
              assert len(raw) == size and hashlib.sha1(b"blob " + str(size).encode() + b"\0" + raw).hexdigest() == blob
              assert hashlib.sha256(raw).hexdigest() == expected, "first-party source differs from trusted workflow literal"
              with (stage / name).open("xb") as sink:
                  sink.write(raw)
                  sink.flush()
                  os.fsync(sink.fileno())
          stage = stage / "runtime-compatibility-audit.py"
          os.execv(sys.executable, [sys.executable, "-I", "-S", str(stage), "--phase", phase,
                                   "--root", root, "--workspace", workspace, "--head", head])
          PY
      - name: Download original artifacts without candidate execution
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: download
        run: *staged_auditor_phase
      - name: Audit original artifact metadata before candidate execution
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: original
        run: *staged_auditor_phase
      - name: Build only approved Peewee after original audit
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: build
        run: *staged_auditor_phase
      - name: Audit built Peewee metadata and destinations before install
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: built
        run: *staged_auditor_phase
      - name: Install only audited hash-bound wheel set
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: install
        run: *staged_auditor_phase
      - name: Verify installed pip closure and scanner bootstrap additionally
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          AUDIT_PHASE: verify
        run: *staged_auditor_phase
