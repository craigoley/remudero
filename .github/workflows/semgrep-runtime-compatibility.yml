name: Semgrep runtime compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: semgrep-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    name: semgrep-runtime-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime lock changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv --name-only \
            "$BASE_SHA...$HEAD_SHA" -- .github/semgrep/requirements.txt \
            .github/semgrep/build-requirements.txt > "$RUNNER_TEMP/runtime-lock-changes"
          if test -s "$RUNNER_TEMP/runtime-lock-changes"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Runtime locks unchanged; no dependency installation required.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned Python
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
          architecture: x64
      - name: Verify hash-locked install and dependency closure
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          NO_SQLITE: "1"
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: |
          INPUTS="$(mktemp -d "${RUNNER_TEMP}/semgrep-runtime-inputs.XXXXXX")"
          python -I - "$INPUTS" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, pathlib, re, subprocess, sys
          output, repo = map(pathlib.Path, sys.argv[1:])
          for filename in ("build-requirements.txt", "requirements.txt"):
              path = ".github/semgrep/" + filename
              def git(*args):
                  return subprocess.run(["git", "-c", "core.fsmonitor=false", "-C", str(repo), *args], check=True, capture_output=True, timeout=15).stdout
              record = git("ls-tree", "-z", "HEAD", "--", path)
              assert re.fullmatch(rb"100644 blob [a-f0-9]{40}\t" + re.escape(path.encode()) + rb"\x00", record), "lock must be one committed regular file"
              blob = record.split()[2].split(b"\t")[0].decode()
              size = int(git("cat-file", "-s", blob))
              assert 0 < size <= 131072, "lock size outside input bound"
              data = git("cat-file", "blob", blob)
              assert len(data) == size and hashlib.sha1(b"blob " + str(size).encode() + b"\0" + data).hexdigest() == blob
              text = data.decode("ascii")
              pins = {}
              for line in text.splitlines():
                  if not line.strip() or line.startswith("#"):
                      continue
                  pin = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9._-]*)==([A-Za-z0-9][A-Za-z0-9.!+_-]*) --hash=sha256:([a-f0-9]{64})", line)
                  assert pin, "lock admits only one closed version/hash pin per line; no includes, paths or options"
                  name = re.sub(r"[-_.]+", "-", pin[1].lower())
                  assert name not in pins, "duplicate normalized package"
                  pins[name] = pin[2]
              if filename == "build-requirements.txt":
                  assert set(pins) == {"packaging", "pip", "setuptools", "wheel"}
              else:
                  assert pins.get("semgrep") == "1.180.0", "lock must match the currently trusted scanner recipe"
              with (output / filename).open("xb") as sink:
                  sink.write(data)
          PY
          cd "$INPUTS"
          VENV="$(mktemp -d "${RUNNER_TEMP}/semgrep-runtime.XXXXXX")"
          python -I -m venv "$VENV"
          "$VENV/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes \
            --only-binary=:all: --no-deps --force-reinstall \
            -r build-requirements.txt
          "$VENV/bin/python" -I -m pip --isolated download \
            --index-url https://pypi.org/simple --require-hashes \
            --only-binary=:all: --no-binary=peewee --no-build-isolation \
            --no-deps --dest "$VENV/artifacts" -r requirements.txt
          "$VENV/bin/python" -I -m pip --isolated install \
            --no-index --find-links "$VENV/artifacts" --no-cache-dir --require-hashes \
            --only-binary=:all: --no-binary=peewee --no-build-isolation --no-deps \
            --force-reinstall -r requirements.txt
          "$VENV/bin/python" -I -m pip check
          test "$("$VENV/bin/semgrep" --version)" = "1.180.0"
          "$VENV/bin/python" -I -c 'import pathlib, subprocess, sys; from semgrep.semgrep_core import SemgrepCore; engine = pathlib.Path(SemgrepCore.executable_path()).resolve(); assert engine.is_relative_to(pathlib.Path(sys.prefix).resolve()); subprocess.run([str(engine), "-version"], check=True, timeout=15)'
          echo 'Dependency closure verified. Findings and vulnerability policies are separate and unchanged.'
