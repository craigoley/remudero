name: CI gate

# ci-gate (W1-T24) — the one always-reporting required status check. It reads the PR head commit's
# other check runs and fails only when a REQUIRED one really failed.
#
# INVARIANT 1: it always reports. No `if:`, no path filter, so its context can never go absent.
# TRAP: a required check that CAN be skipped deadlocks a merge forever — a skipped reusable-
# workflow caller registers no check run under that nested context name, and branch protection
# waits for "Expected" (synthwatch #102). So branch protection requires only `ci-gate` +
# `remudero-review`, and a skipped or absent sibling never blocks.
#
# INVARIANT 2: it aggregates across workflow FILES. `needs:` + `join(needs.*.result)` resolves
# only within one workflow, and this repo's required checks live in separate files, so the step
# below reads the check-runs REST API (`checks: read`) and applies the same rule.
# Why: the synthwatch #102 replay, the class-bug argument and the branch-protection flip are in
# docs/forensics/ci-gate-yml.md (W1-T24).

on:
  pull_request:
    # The two acceptance-body gates can change their result after a body-only repair.  Re-run the
    # lightweight aggregate on `edited` so its required ci-gate context observes that new result
    # without re-running ci.yml's expensive test jobs.
    types: [opened, synchronize, reopened, edited]

permissions:
  checks: read
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    # INVARIANT: this bound must exceed what it bounds. WAIT_CAP_SECONDS (2400s) plus
    # GRACE_WINDOW_SECONDS (600s) is a 50m worst case, so 60m stays a finite, loud ceiling above
    # it instead of GitHub's 360m default (R-50). FALSIFIER:
    # test/ci-cache-concurrency-and-job-timeouts.test.ts asserts this timeout exceeds that sum.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      # The check-run names that always appear on a PR. The gate WAITS for every one to reach a
      # terminal state before deciding, so a slow-to-register check can never let it pass early
      # (the registration race).
      #
      # INVARIANT: every entry is unconditional — no path filter, no job `if:` — because a
      # path-filtered required check reproduces the synthwatch #102 deadlock class in the header
      # above. Add a job's name here once it is live on main.
      # FALSIFIER: test/every-pr-check-is-required-or-advisory.test.ts fails on any pull_request
      # check-run that is in neither REQUIRED nor ADVISORY below.
      # Why: each entry's provenance (W1-T20c/T25/T26/T28/T29/T31/T38/T96/T97/T211/T934) and the
      # R-51 wall-clock measurement are in docs/forensics/ci-gate-yml.md.
      #
      # One entry per line (JSON array, folded scalar) so concurrent PRs each adding a check
      # append a line instead of both editing the same line and conflicting.
      REQUIRED: >-
        [
        "ci",
        "lint-plan",
        "depcruise",
        "containment-probe",
        "coverage-ratchet",
        "mutation-ratchet",
        "jscpd-gate",
        "claims",
        "learnings-budget-ratchet",
        "commitlint",
        "api-client-drift",
        "no-hand-rolled-fetch",
        "prompt-surface-gate",
        "scan-pr / osv-scan",
        "License Review",
        "leak-grep",
        "assertion-discrimination",
        "task-id-existence",
        "acceptance-author-gate",
        "proof-discrimination",
        "unwired-gate",
        "comment-load-ratchet",
        "source-size",
        "coverage-session-blanking",
        "baseline-monotonic",
        "test-slow",
        "squash-trailer-gate"
        ]
      # Never waited on, never failed for: ci-gate is self, and remudero-review is a separate
      # required context the orchestrator posts directly rather than a check-run.
      IGNORE: >-
        ["ci-gate"]
      # Every OTHER check-run this repo's workflows register on a `pull_request` event, named here
      # only so test/every-pr-check-is-required-or-advisory.test.ts can prove the census complete;
      # the aggregator script never reads this key. An entry claims the job is path-filtered or
      # conditionally skippable (never REQUIRED-able without reproducing synthwatch #102), a
      # documented advisory-only scanner or aggregation shard, or deferred pending a red state.
      # Promoting one is a separate, one-concern PR, not a side effect of adding a name (R-51).
      # W1-T3177: `dashboard` starts ADVISORY, per this block's own rule that a name is added to
      # REQUIRED "once it is live on main". It is a brand-new toolchain (React 19 + Vite + Vitest)
      # whose first green run on main has not happened yet, and a required check that has never been
      # observed green there can deadlock every merge on its first flake. Promoting it is a one-line
      # follow-up once it has run clean on main — and it is REGISTERED rather than omitted, because
      # the alternative is exactly what test/every-pr-check-is-required-or-advisory.test.ts refuses:
      # a job that can go silently red forever with nothing to notice.
      ADVISORY: >-
        [
        "dashboard",
        "flake-retry-aggregate",
        "ci-shard (1/4)",
        "ci-shard (2/4)",
        "ci-shard (3/4)",
        "ci-shard (4/4)",
        "coverage-shard (1/4)",
        "coverage-shard (2/4)",
        "coverage-shard (3/4)",
        "coverage-shard (4/4)",
        "Analyze (javascript-typescript)",
        "Analyze (actions)",
        "Scan",
        "Review",
        "docs-index-check",
        "clock-sweep (+400d, artifacts excluded by name)",
        "heartbeat-watch (reads every host's beat branch off-machine; silent per host until installed)",
        "probe-path-filter",
        "recovery-drill (throwaway fixtures, real recovery code, no live fleet touched)"
        ]
      # W1-T261 re-aggregate grace window — the mechanism is in the step below. Env, not literals,
      # so tests shrink both to seconds.
      GRACE_WINDOW_SECONDS: "600"
      # A terminal failure does not need a 20-second read cadence: the same-sha grace window
      # stays 600s, and a rerun that lands GREEN is now observed within one minute. That reduces
      # the grace read ceiling from 30 to 10 without shortening its false-hold protection.
      GRACE_POLL_INTERVAL_SECONDS: "60"
      # W1-T312 wait cap. Sized from a measured distribution of this repo's own required-check
      # wall-clock, not a guess: n=10 on 2026-08-03, p95 ~1345s, so 2400s leaves ~79% headroom
      # while staying a finite, loud bound. TRAP: the old 900s cap sat below that p95 and turned
      # routine slow-but-green siblings into false timeouts (#1229, #1234). Env, like the grace
      # knobs above, so tests can shrink it.
      # Why: the full n=10 sample is in docs/forensics/ci-gate-yml.md (W1-T312).
      WAIT_CAP_SECONDS: "2400"
      # One recent successful ci-gate run (34709784197, 2026-09-12) emitted 73 wait-loop reads
      # before its siblings completed. Preserve the 15s observation cadence while checks are
      # first registering, then move to 60s: later reads only observe remote state and cannot
      # make a required check complete sooner. At the 2400s cap this is at most 56 wait reads
      # instead of 161, while adding no more than 60s to a long-tail terminal observation.
      WAIT_FAST_WINDOW_SECONDS: "300"
      WAIT_POLL_INTERVAL_SECONDS: "15"
      WAIT_SLOW_POLL_INTERVAL_SECONDS: "60"
    steps:
      - name: Aggregate sibling check results (fail only on a REAL failure; skipped/absent are OK)
        run: |
          set -euo pipefail

          # Defensive defaults (job env already sets both -- see above) so the script never dies
          # on `set -u` if either is ever left unset.
          GRACE_WINDOW_SECONDS="${GRACE_WINDOW_SECONDS:-600}"
          GRACE_POLL_INTERVAL_SECONDS="${GRACE_POLL_INTERVAL_SECONDS:-60}"
          WAIT_CAP_SECONDS="${WAIT_CAP_SECONDS:-2400}"
          WAIT_FAST_WINDOW_SECONDS="${WAIT_FAST_WINDOW_SECONDS:-300}"
          WAIT_POLL_INTERVAL_SECONDS="${WAIT_POLL_INTERVAL_SECONDS:-15}"
          WAIT_SLOW_POLL_INTERVAL_SECONDS="${WAIT_SLOW_POLL_INTERVAL_SECONDS:-60}"

          # A READ THAT FAILED IS NOT A READ THAT SAID NO. On 2026-08-11 a single x509 TLS error
          # on ONE poll killed this script under `set -euo pipefail` and ci-gate reported FAILURE
          # on #1569 -- indistinguishable, at the check level, from a required check going red. The
          # re-run went SUCCESS on the SAME sha with no new commit, so the gate had reported a
          # network hiccup as a merge-blocking verdict. RETRY_ATTEMPTS/RETRY_BACKOFF_SECONDS are
          # env (like the wait/grace knobs) so tests drive them without waiting real seconds.
          #
          # RETRYING THIS READ CANNOT MASK A FLAPPING CHECK, and that is why it is safe: a check's
          # verdict is only ever carried in the BODY of a SUCCESSFUL read. A non-zero `gh api` exit
          # yields NO rows at all, so there is nothing here to mask -- a genuinely red or flapping
          # check still arrives as data, and steps 2/3 (evaluate + the W1-T261 grace window) decide
          # it exactly as before. That is also why no error CLASSIFICATION is attempted: `gh api`
          # exits 1 for a TLS failure and for an HTTP 4xx alike, and on THIS call -- `checks: read`
          # against the workflow's own repo with `github.token` -- an HTTP-level error is a
          # permanent misconfiguration that fails identically after the retries and lands on the
          # unreadable exit below. Guessing at stderr text would add a parser that can be wrong
          # about a distinction this call does not actually need.
          RETRY_ATTEMPTS="${RETRY_ATTEMPTS:-3}"
          RETRY_BACKOFF_SECONDS="${RETRY_BACKOFF_SECONDS:-2}"

          runs_json() {
            # All check runs on the PR head SHA, across every workflow + app, merged across pages,
            # THEN DEDUPED BY NAME (W1-T123): a SHA accumulates one check-run PER ATTEMPT, so a
            # re-run of a required check leaves its earlier failed attempt in the list forever
            # unless we narrow to one row per name. Group by `name` and keep only the attempt with
            # the latest `started_at` -- a name whose failed attempt is followed by a later
            # success now reads as that success; everything downstream evaluates ONLY this
            # deduped, latest-per-name list.
            # (`--slurp` can't combine with `-q`, so flatten the page array with a separate jq.)
            local raw attempt=1
            while [ "${attempt}" -le "${RETRY_ATTEMPTS}" ]; do
              if raw="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" --paginate --slurp)"; then
                jq -c '[ .[].check_runs[] | {name, status, conclusion, started_at} ]
                        | group_by(.name)
                        | map(max_by(.started_at))' <<< "${raw}"
                return 0
              fi
              echo "ci-gate: check-runs read FAILED (attempt ${attempt}/${RETRY_ATTEMPTS}) -- retrying in ${RETRY_BACKOFF_SECONDS}s" >&2
              attempt=$((attempt + 1))
              [ "${attempt}" -le "${RETRY_ATTEMPTS}" ] && sleep "${RETRY_BACKOFF_SECONDS}"
            done
            return 1
          }

          # EXHAUSTED RETRIES STILL FAIL, and the wording is the whole point. An unreadable API
          # means the gate DOES NOT KNOW, and "does not know" on a required check must never pass
          # -- a gate that went green on an unreadable poll would be a far worse defect than the
          # one this retry fixes. So it fails closed, with a message that says UNREADABLE rather
          # than FAILED, and tells the reader a re-run is the remedy (unlike the W1-T312 timeout
          # below, where re-running the same sha is explicitly useless).
          # Called with `||` from the PARENT shell, never from inside a command substitution: an
          # `exit` within `$( )` would only kill the subshell, leaving the caller to carry on with
          # an empty `runs` -- which reads as "no checks exist" and is exactly the silent pass this
          # must never produce.
          unreadable_die() {
            echo "::error::ci-gate: could NOT READ the check-runs API after ${RETRY_ATTEMPTS} attempt(s) -- this is NOT a check failure and says NOTHING about the checks themselves; the gate has no data, so it fails closed. Re-running THIS sha is the remedy (unlike the wait-cap timeout below, which needs a NEW sha)."
            exit 1
          }

          # 1) WAIT until every REQUIRED check is present + completed (terminal). A required check
          #    that never registers -> timeout -> ci-gate FAILS (fail-closed; never a silent pass).
          #    W1-T312: the cap is WAIT_CAP_SECONDS (measured + documented in the job env above),
          #    not a literal -- the old hardcoded 900s sat below this repo's own p95 wall-clock and
          #    turned the routine slow-but-green case into a false timeout (#1229, #1234).
          wait_started_at="$(date +%s)"
          deadline=$(( wait_started_at + WAIT_CAP_SECONDS ))
          while :; do
            runs="$(runs_json)" || unreadable_die
            not_ready="$(jq -r --argjson req "${REQUIRED}" '
              ([ .[] | select(.status=="completed") | .name ]) as $done
              | ($req - $done)
              | .[]' <<< "${runs}")"
            [ -z "${not_ready}" ] && break
            now="$(date +%s)"
            if [ "${now}" -ge "${deadline}" ]; then
              # W1-T312: this is a TIMEOUT, distinct from step 2/3's "required check(s) FAILED" --
              # nothing here concluded a failure, the wait cap simply elapsed first. Re-running the
              # SAME sha changes nothing (the check(s) below are still not registered/completed);
              # the only remedy is a NEW commit/sha to re-trigger the still-pending check(s).
              echo "::error::ci-gate: TIMED OUT waiting for required check(s) to complete (this is NOT a check failure -- a NEW sha is the only remedy, re-running this same sha will not help):"
              printf '%s\n' "${not_ready}" | sed 's/^/  - /'
              exit 1
            fi
            echo "waiting for required check(s) to complete:"
            printf '%s\n' "${not_ready}" | sed 's/^/  - /'
            wait_elapsed_seconds=$(( now - wait_started_at ))
            wait_interval_seconds="${WAIT_POLL_INTERVAL_SECONDS}"
            if [ "${wait_elapsed_seconds}" -ge "${WAIT_FAST_WINDOW_SECONDS}" ]; then
              wait_interval_seconds="${WAIT_SLOW_POLL_INTERVAL_SECONDS}"
            fi
            sleep "${wait_interval_seconds}"
          done

          # 2) FAIL if a REQUIRED check (excluding IGNORE) concluded as a real failure. A check
          #    that is not in REQUIRED can NEVER hold the merge, no matter its conclusion — only
          #    REQUIRED gates, exactly as step 1 only WAITS on REQUIRED. (W1-T1131: this used to
          #    filter ONLY against IGNORE — a one-name self-exclusion — so any of the other
          #    non-required check runs on a head (advisory scanners, informational jobs) could
          #    hold every merge while the error message below claimed a "required" check had
          #    failed, even though no REQUIRED-list entry was involved.) Skipped / neutral /
          #    success all pass — so a path-filter-skipped (or absent) required check never blocks.
          evaluate_fails() {
            jq -r --argjson req "${REQUIRED}" --argjson ig "${IGNORE}" '
              .[] | .name as $n | .conclusion as $c
                  | select(($req | index($n)) != null)
                  | select(($ig | index($n)) == null)
                  | select(["failure","timed_out","cancelled","action_required","startup_failure"] | index($c))
                  | $n' <<< "$1"
          }

          echo "--- gated check runs ---"
          printf '%s' "${runs}" | jq -r '.[] | "  \(.conclusion // .status)\t\(.name)"' | sort

          fails="$(evaluate_fails "${runs}")"

          # 3) RE-AGGREGATE (W1-T261). A required check's LATEST attempt can flip from failure to
          #    success on a rerun that lands moments AFTER this read -- #729 (2026-07-24):
          #    coverage-ratchet was FAILURE at ci-gate's 17:11 read, SUCCESS at 17:18, and only a
          #    manual ci-gate re-run or a fresh sha cleared the stale hold. `check_run:
          #    types: [completed]` was investigated as the trigger for this (design (i)) but
          #    GitHub's documented recursion guard suppresses check_run events for any check run
          #    whose check suite was created by GitHub Actions (docs.github.com/en/actions/using-
          #    workflows/events-that-trigger-workflows#check_run and community discussion #148873)
          #    -- every REQUIRED name here IS a GitHub Actions check suite, so that trigger would
          #    never fire for the checks this gate actually aggregates. Per design (iv), falling
          #    back to the named alternative: before concluding FAILURE, RE-READ (never a fresh
          #    workflow run, no new sha, no manual action) inside a BOUNDED grace window, long
          #    enough to see an in-flight rerun land (600s comfortably covers the #729 seven-
          #    minute gap), short enough to fail closed instead of hanging. `fails` only updates
          #    once a read is FULLY terminal (mirrors step 1's own wait discipline) so an in-flight
          #    rerun can never be misread as a pass by landing on a still-`in_progress` snapshot.
          if [ -n "${fails}" ]; then
            grace_deadline=$(( $(date +%s) + GRACE_WINDOW_SECONDS ))
            echo "::warning::ci-gate: required check(s) failing — entering a ${GRACE_WINDOW_SECONDS}s grace window for a same-sha rerun to land before concluding:"
            printf '%s\n' "${fails}" | sed 's/^/  - /'
            while [ -n "${fails}" ] && [ "$(date +%s)" -lt "${grace_deadline}" ]; do
              sleep "${GRACE_POLL_INTERVAL_SECONDS}"
              runs="$(runs_json)" || unreadable_die
              not_ready="$(jq -r --argjson req "${REQUIRED}" '
                ([ .[] | select(.status=="completed") | .name ]) as $done
                | ($req - $done)
                | .[]' <<< "${runs}")"
              # Not every required name is terminal yet (a rerun is mid-flight) -- keep polling
              # without touching `fails`, so a not-yet-concluded rerun is never read as a pass.
              [ -n "${not_ready}" ] && continue
              fails="$(evaluate_fails "${runs}")"
            done
            echo "--- gated check runs (post-grace-window) ---"
            printf '%s' "${runs}" | jq -r '.[] | "  \(.conclusion // .status)\t\(.name)"' | sort
          fi

          if [ -n "${fails}" ]; then
            echo "::error::ci-gate: required check(s) FAILED — holding merge:"
            printf '%s\n' "${fails}" | sed 's/^/  - /'
            exit 1
          fi
          echo "ci-gate: all required checks terminal, no failures — merge may proceed."
