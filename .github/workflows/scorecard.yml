name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Mondays 02:23 UTC. W1-T4401 dropped push-to-main: branch_protection_rule catches posture changes.
    - cron: "23 2 * * 1"
  workflow_dispatch:

# Least privilege at the top level; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # R-50: observed runs complete in under a minute; 20m bounds a genuine hang with
    # generous headroom.
    timeout-minutes: 20
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Publish results to OpenSSF (OIDC) — required for the badge.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard requires credentials NOT be persisted.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF Scorecard API so a README badge can resolve.
          publish_results: true

      # Keep the raw SARIF as a workflow artifact (handy for debugging).
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
