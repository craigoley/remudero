name: OSV-Scanner

# Full dependency-tree scan on push to main and on a weekly schedule —
# catches advisories cut AFTER a dependency was already merged in, which
# the PR-time diff scan (osv-scanner-pr.yml) can't see. Reports to the
# Security tab via SARIF; warn-only so it never blocks main/schedule.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, off-peak (Mondays 04:43 UTC — staggered from CodeQL).
    - cron: "43 4 * * 1"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions: a topLevel write
# permission scores worse than the same permission scoped to job level — W1-T66);
# the job below passes its own, full permissions block to the reusable workflow.
permissions:
  contents: read

jobs:
  scan:
    # R-50: NOT bounded with a job-level `timeout-minutes` here, deliberately -- see
    # osv-scanner-pr.yml's `scan-pr` job for the identical reasoning: a `uses:` reusable-workflow
    # call accepts no `timeout-minutes` key (GitHub Actions schema), so adding one would be
    # invalid YAML for this job shape, not a stricter bound.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r
        ./
      upload-sarif: true
      fail-on-vuln: false
    permissions:
      security-events: write
      contents: read
      actions: read
