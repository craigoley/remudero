name: OSV-Scanner

# Full dependency-tree scan, nightly (W1-T4401: was every push to main plus weekly) — catches
# advisories cut AFTER a dependency merged, which the PR-time diff scan (osv-scanner-pr.yml)
# can't see, within 24h. No pull_request trigger, so no PR check-run moves. Reports to the
# Security tab via SARIF; warn-only so it never blocks main/schedule.
on:
  schedule:
    # Nightly, off-peak (03:14 UTC — staggered from mutation-nightly's 03:31).
    - cron: "14 3 * * *"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions: a topLevel write
# permission scores worse than the same permission scoped to job level — W1-T66);
# the job below passes its own, full permissions block to the reusable workflow.
permissions:
  contents: read

jobs:
  scan:
    # R-50: NOT bounded with a job-level `timeout-minutes` here, deliberately -- see
    # osv-scanner-pr.yml's `scan-pr` job for the identical reasoning: a `uses:` reusable-workflow
    # call accepts no `timeout-minutes` key (GitHub Actions schema), so adding one would be
    # invalid YAML for this job shape, not a stricter bound.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        -r
        ./
      upload-sarif: true
      fail-on-vuln: false
    permissions:
      security-events: write
      contents: read
      actions: read
