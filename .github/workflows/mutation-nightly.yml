name: Mutation Nightly

# W1-T133 (MASTER-PLAN §5, D-10): the PR-time mutation-ratchet job (ci.yml) is deliberately
# scoped to src/lib/classify.ts only (W1-T108's diff-scope + incremental fixes keep it near-
# instant) -- that leaves the other ~15k lines of src/** with ZERO mutation coverage forever,
# since mutating the FULL tree with Stryker's command test runner (which reruns the whole suite
# per mutant -- no per-mutant test filtering exists yet for Node's built-in test runner) was
# measured at ~4 hours, far past ci-gate.yml's 15-minute required-check wait ceiling. This
# workflow moves that cost OFF the PR critical path entirely: scheduled nightly, full src/**
# scope, OWNS the global mutation score.
#
# NOT a required check, ever -- that is the entire point (D-10: the PR gate's narrow scope is
# only defensible because this workflow is the falsifier of record for everything else). It has
# no `pull_request` trigger and is not listed in ci-gate.yml. stryker.conf.json's `mutate` scope
# (still exactly `["src/lib/classify.ts"]`, W1-T108's shape) is untouched by this task -- the ONLY
# stryker.conf.json edit this task makes is scoping the PR gate's `commandRunner.command` to the
# two test files that actually exercise classify.ts (test/classify.test.ts,
# test/block-reason.test.ts) instead of the full suite -- see ci.yml's mutation-ratchet job
# comment for the measured latency incident that made that necessary. The PR gate's WHAT (mutate
# target, diff-scope trigger, ratchet comparison) keeps W1-T108's exact shape; only the per-mutant
# HOW got faster.
#
# TEST FILES ARE NEVER A MUTATION TARGET, enforced twice: scripts/mutation-nightly-scope.json's
# own `mutate` glob never targets test/** (it lives outside src/** entirely), AND
# scripts/mutation-ratchet.mjs's resolveMutateScope() hard-excludes `test/**` unconditionally
# regardless of what that config says.
#
# BOUNDED, not exhaustive, per run: mutating every one of src/**'s ~84 files with the command
# runner would reproduce the same ~4-hour cost this workflow exists to avoid off the PR path (a
# nightly run still shouldn't run forever). scripts/mutation-ratchet.mjs's `--nightly-scope` mode
# deterministically samples a `fileCap`-sized subset (scripts/mutation-nightly-scope.json) keyed
# on the day-of-year, so a bounded, reproducible sample runs each night and the sample ROTATES --
# the whole matched tree is covered once every N nights (N = ceil(matched-file-count / fileCap)).
# Same night-index always yields the same sample: deterministic, auditable, never flaky.
#
# LOUD FAILURE, never a silent pass: `--nightly-ratchet` (run after Stryker) blocks this workflow
# on a below-baseline sampled score, an unreadable/corrupt report, or a missing "nightly" baseline
# section -- there is no code path that reaches a green run without a real, valid, at-or-above-
# baseline comparison (the W1-T130 degrade-loudly polarity).
#
# This workflow intentionally does NOT auto-commit an updated scripts/mutation-baseline.json --
# ratcheting the nightly floor up is a deliberate, reviewed change, the same convention every
# other baseline in this repo already follows, not something a cron job should do unattended. The
# uploaded report artifact is what a human uses to make that call.
#
# DELIVERY (the "loud" in LOUD FAILURE has to reach a human). Blocking the workflow only produces a
# red badge on a page nobody opens: every other failing check in this repo rides a PR, so a human
# sees it while doing normal work, but a cron job has no such carrier. That made this workflow --
# the falsifier of record for the ~15k lines of src/** the PR gate deliberately does not mutate --
# silent in practice exactly when it had something to say. The `notify` step below closes that with
# scripts/needs-human-issue.mjs, which COMMENTS on an existing open needs-human issue rather than
# opening a new one per night (365 issues a year would train the reader to ignore the label, which
# would rebuild the same gap one level up). The four scheduled security scanners do not need this:
# each uploads SARIF, so its findings already land as code-scanning alerts the alert-intake lane
# reads. This workflow raises no alert and uploads no SARIF, which is what made it the outlier.
on:
  schedule:
    # Nightly, off-peak (03:31 UTC -- staggered from CodeQL 04:43/Scorecard 02:23's own slots).
    - cron: "31 3 * * *"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions -- W1-T66).
permissions:
  contents: read

jobs:
  mutation-nightly:
    name: mutation-nightly (full src/** scope, sampled + rotated)
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the top-level block, so `contents: read` is restated rather
    # than inherited. `issues: write` is the minimum the delivery step needs and is scoped to this
    # job alone (Scorecard TokenPermissions -- W1-T66).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install (clean, from lockfile)
        id: install
        run: npm ci
      - name: List this run's mutate candidates (all of src/**; test/** is never produced by this glob)
        run: find src -type f \( -name '*.ts' -o -name '*.tsx' \) | sort > nightly-candidates.txt
      - name: Resolve tonight's deterministic sample (day-of-year seed, fileCap-bounded, rotates over N nights)
        id: scope
        run: |
          set -euo pipefail
          node scripts/mutation-ratchet.mjs --nightly-scope \
            --files nightly-candidates.txt \
            --night-index "$(date -u +%j)"
      - name: Restore Stryker incremental cache (nightly's OWN cache namespace -- never shared with the PR gate's)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-nightly-incremental-${{ github.run_id }}
          restore-keys: |
            mutation-nightly-incremental-
      # Both runs tee into one log so the failure issue can carry the real diagnosis instead of
      # "it failed, go look". `set -o pipefail` is what keeps the step's own exit code authoritative
      # through the pipe -- without it `tee` would return 0 and a below-baseline night would PASS,
      # turning the delivery fix into a correctness regression.
      - name: Stryker mutation run (tonight's sampled scope -- see the `scope` step above)
        id: stryker
        run: |
          set -o pipefail
          npx stryker run --mutate "${{ steps.scope.outputs.mutate }}" 2>&1 | tee -a nightly-failure.log
      - name: Nightly mutation ratchet (blocks LOUDLY on a below-baseline sample or a missing/broken report)
        id: ratchet
        run: |
          set -o pipefail
          node scripts/mutation-ratchet.mjs --nightly-ratchet \
            --report reports/mutation/mutation.json \
            --baseline scripts/mutation-baseline.json 2>&1 | tee -a nightly-failure.log

      # Delivery. `if: failure()` so a green night stays silent -- a notifier that also fires on
      # success is one the reader learns to filter, which is the same gap again.
      - name: Notify a human (the delivery of record -- see this workflow's header)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_WHEN: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # An earlier step (checkout/install/scope) can fail before the log exists; name the
          # failing step explicitly so the issue is actionable even with no captured output.
          {
            echo "failing step: install=${{ steps.install.outcome }} scope=${{ steps.scope.outcome }} stryker=${{ steps.stryker.outcome }} ratchet=${{ steps.ratchet.outcome }}"
            echo
          } > nightly-notify.log
          cat nightly-failure.log >> nightly-notify.log 2>/dev/null || echo "(no output captured -- the run failed before the mutation steps)" >> nightly-notify.log
          node scripts/needs-human-issue.mjs \
            --source mutation-nightly \
            --title "mutation-nightly is failing" \
            --body-file nightly-notify.log
      - name: Upload the full Stryker JSON report (for a human ratchet-up decision)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-nightly-report
          path: reports/mutation/mutation.json
          retention-days: 14
