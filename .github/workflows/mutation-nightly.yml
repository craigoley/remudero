name: Mutation Nightly

# Mutation Nightly (W1-T133, MASTER-PLAN §5, D-10) — the full-tree Stryker run the PR-time
# mutation-ratchet job (ci.yml) cannot afford at its own scope: that job stays fast by mutating
# only src/lib/classify.ts, which leaves the rest of src/** with no mutation coverage. This
# workflow runs nightly, full scope, and OWNS the global mutation score — NOT a required check,
# ever, and not listed in ci-gate.yml; D-10 makes that narrow PR scope defensible only because this
# workflow is the falsifier of record for everything else.
#
# INVARIANT — test/** is never a mutation target: the nightly scope glob
# (scripts/mutation-nightly-scope.json) excludes it structurally, and
# scripts/mutation-ratchet.mjs's resolveMutateScope() hard-excludes it regardless of that config.
#
# SAMPLING — a full-tree run was measured at ~4 hours, so `--nightly-plan` deterministically
# samples a day-of-year-keyed subset each night and rotates through the whole tree over N nights,
# one Stryker run per sampled file using that file's own direct test importers as the command (no
# per-mutant test filter exists). A file with no importer, one over the per-run budget, or one
# failing on unmutated source is excluded and named, never silently skipped — the reported score is
# a LOWER BOUND. Full scope-resolution design: docs/forensics/mutation-ratchet.md.
#
# LOUD FAILURE — `--nightly-ratchet` blocks on a vacuous run, an invalid run (a mutated file caught
# nothing — a validity check, not a quality floor), a below-baseline score, or a missing/corrupt
# report; nothing reaches green without a real comparison. The baseline is never auto-committed —
# ratcheting it up is a reviewed human call from the uploaded report artifact. DELIVERY: a cron job
# has no PR to carry a red result, so `notify` comments on an open needs-human issue instead.
# Why: measurements, incidents and design arguments compacted out of this file are archived
# verbatim in docs/forensics/mutation-nightly-yml.md, per docs/comment-standard.md.
on:
  schedule:
    # Nightly, off-peak (03:31 UTC -- staggered from CodeQL 04:43/Scorecard 02:23's own slots).
    - cron: "31 3 * * *"
  workflow_dispatch:

# Least privilege at the top level (Scorecard TokenPermissions -- W1-T66).
permissions:
  contents: read

jobs:
  mutation-nightly:
    name: mutation-nightly (full src/** scope, sampled + rotated)
    runs-on: ubuntu-latest
    # R-50: 240m/4h — measured across recent scheduled runs (17.5-124 minutes, including one
    # legitimate non-timeout failure at 124m) and matched to this file's own ~4-hour full-tree
    # estimate above, with headroom so a real run is never truncated before its own verdict.
    # Why: the full measurement — docs/forensics/mutation-nightly-yml.md.
    timeout-minutes: 240
    # Job-level permissions REPLACE the top-level block, so `contents: read` is restated; `issues:
    # write` is the delivery step's minimum, scoped to this job alone (Scorecard TokenPermissions).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        id: install
        run: npm ci
      - name: List this run's mutate candidates (all of src/**; test/** is never produced by this glob)
        run: find src -type f \( -name '*.ts' -o -name '*.tsx' \) | sort > nightly-candidates.txt
      - name: List the test files the per-file mapping is derived from
        run: find test -maxdepth 1 -type f -name '*.test.ts' | sort > nightly-test-files.txt
      # PLAN, not just scope: Stryker's `commandRunner.command` is one command for the whole run,
      # so mutating a wide, sampled scope with it needs one command PER FILE, derived from each
      # file's own direct test importers — never a single command spanning the whole sample.
      - name: Plan tonight's per-file runs (direct test importers, budget-bounded, exclusions named)
        id: plan
        run: |
          set -o pipefail
          node scripts/mutation-ratchet.mjs --nightly-plan \
            --files nightly-candidates.txt \
            --test-files nightly-test-files.txt \
            --night-index "$(date -u +%j)" \
            --plan-dir .stryker-plan \
            --report-dir reports/mutation/nightly 2>&1 | tee -a nightly-failure.log
      # One `npx stryker run` per mutated file; an erroring config does not abort the loop, so the
      # files that DID complete still produce reports.
      #
      # `continue-on-error: true` is what makes that true across the STEP boundary too — W1-T2514:
      # without it, an error here left the `ratchet` step below `skipped` under its default
      # `if: success()`, so the one night a config errors is exactly the night nothing judges the
      # files that finished (confirmed on two real failing runs). It overrides this step's
      # `conclusion` to `success`, never its `outcome`; the `stryker-guard` step below reads the
      # real `outcome` and reddens the job once `ratchet` has had its turn.
      # Why: the two-run measurement — docs/forensics/mutation-nightly-yml.md.
      - name: Stryker mutation runs (one per file -- see the `plan` step above)
        id: stryker
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          failed=""
          for cfg in ${{ steps.plan.outputs.configs }}; do
            echo "=== stryker run $cfg ===" | tee -a nightly-failure.log
            if ! npx stryker run "$cfg" 2>&1 | tee -a nightly-failure.log; then
              rc=1
              failed="$failed $cfg"
            fi
          done
          failed="${failed# }"
          if [ -n "$failed" ]; then
            echo "=== failed configs: $failed ===" | tee -a nightly-failure.log
          fi
          echo "failed_configs=$failed" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # `--report-dir` merges the per-file reports as a disjoint union; `--mutate-scope` is what the
      # plan actually included, so the run-validity guard judges what really ran. No `if:` needed:
      # `continue-on-error` above overrides `stryker`'s conclusion, not its outcome, so this step's
      # default `if: success()` still runs even when a config errored.
      - name: Nightly mutation ratchet (blocks LOUDLY on a vacuous or invalid run, a below-baseline sample, or a missing/broken report)
        id: ratchet
        run: |
          set -o pipefail
          node scripts/mutation-ratchet.mjs --nightly-ratchet \
            --report-dir reports/mutation/nightly \
            --baseline scripts/mutation-baseline.json \
            --mutate-scope "${{ steps.plan.outputs.mutate }}" 2>&1 | tee -a nightly-failure.log

      # `ratchet` above runs regardless of `stryker`'s real outcome, so this step turns a swallowed
      # `stryker` failure back into a job failure — otherwise `continue-on-error` would silently
      # launder "a config errored" into green (the W1-T130 degrade-loudly polarity). `always()` so
      # it still runs, and still fails the job, even if `ratchet` itself failed or was skipped.
      - name: Fail the workflow if any nightly Stryker config errored (ratchet already had its turn)
        id: stryker-guard
        if: always() && steps.stryker.outcome == 'failure'
        run: |
          echo "::error::nightly Stryker run(s) failed for:${{ steps.stryker.outputs.failed_configs }}"
          exit 1

      # Delivery. `if: failure()` so a green night stays silent -- a notifier that also fires on
      # success is one the reader learns to filter, which is the same gap again.
      - name: Notify a human (the delivery of record -- see this workflow's header)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_WHEN: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # An earlier step (checkout/install/scope) can fail before the log exists; name the
          # failing step explicitly so the issue is actionable even with no captured output. W1-
          # T2514: this line now also names WHICH config(s) errored (stryker_failed_configs),
          # rather than only the step-level `stryker=failure` two issues shipped with neither
          # answering.
          # ⚠ THE DIAGNOSTIC RIDES THE ENVELOPE, NOT THE LOG. It used to be written to the TOP of
          # --body-file, and needs-human-issue.mjs's truncateBody keeps the log's TAIL — so on any
          # run whose log exceeded the 65536-char cap this line was the FIRST thing dropped.
          # MEASURED on issue #3387: a 65,538-char body whose visible tail was all `ok` lines from a
          # later passing config, with the failure and the failing config's name both trimmed away.
          # `--preamble` sits above the <details> and survives any log size.
          #
          # `scope=` named a step id that has never existed (this job's step is `plan`), so that
          # field rendered EMPTY in every delivery since it was written — including the two issues
          # whose whole purpose was to say which step failed.
          PREAMBLE="failing step: install=${{ steps.install.outcome }} plan=${{ steps.plan.outcome }} stryker=${{ steps.stryker.outcome }} ratchet=${{ steps.ratchet.outcome }}"
          PREAMBLE="$PREAMBLE"$'\n'"stryker_failed_configs: ${{ steps.stryker.outputs.failed_configs }}"
          cat nightly-failure.log > nightly-notify.log 2>/dev/null || echo "(no output captured -- the run failed before the mutation steps)" > nightly-notify.log
          node scripts/needs-human-issue.mjs \
            --source mutation-nightly \
            --title "mutation-nightly is failing" \
            --preamble "$PREAMBLE" \
            --body-file nightly-notify.log

      # W1-T3030 — THE CLOSING HALF OF THE DELIVERY ABOVE. Without it a recovered job leaves its
      # delivery-of-record open forever: the general escalation reconciler only closes issues with
      # a TASK referent, and a cron job has none, so #3387 sat open across five consecutive passing
      # nightlies until a human closed it by hand.
      #
      # ⚠ THIS IS NOT THE "notifier that also fires on success" the step above warns against. It
      # posts nothing on a green run when there is no open issue for this source — `--resolved` is
      # a silent no-op in that case, which is every ordinary night. It speaks only on the run that
      # actually ends an escalation, which is the one green run a reader wants to hear about.
      - name: Close this job's needs-human issue once it recovers
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_WHEN: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/needs-human-issue.mjs --resolved --source mutation-nightly
      - name: Upload the full Stryker JSON report (for a human ratchet-up decision)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-nightly-report
          path: reports/mutation/nightly
          retention-days: 14
