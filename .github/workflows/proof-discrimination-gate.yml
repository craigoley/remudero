name: Proof discrimination

# The PR body can change without a new commit.  `edited` is therefore required: otherwise a
# body-only proof repair would leave this check's prior result attached to the old body.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# W1-T15177: a push and a body edit seconds apart start two runs on one head. The newer cancels the
# older, as ci.yml and ci-gate.yml already do, so the two never race one 10-minute bound and ci-gate's
# latest-run-per-name rule reads the run that matters.
concurrency:
  group: proof-discrimination-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof-discrimination:
    name: proof-discrimination
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # GitHub's default pull_request checkout is the synthetic merge commit.  The reviewer judges
      # the head, so pin this checkout to the event's head SHA and retain history for merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Reject non-discriminating acceptance proofs
        run: node --import tsx scripts/proof-discrimination-gate.mjs
