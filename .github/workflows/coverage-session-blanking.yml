# COVERAGE-SESSION-BLANKING gate (W1-T2732).
#
# W1-T2292 built scripts/coverage-session-blanking-check.mjs (`delete env.NODE_V8_COVERAGE` reads
# as an opt-out and is not one -- node's child_process force-injects that variable into every
# spawned child regardless of the `env` option, so a child spawned this way stays enrolled in the
# parent's coverage session and its function/line table merges into the parent's report, keyed on
# the absolute path) and its own falsifying unit test, and stopped there by design -- its own
# criterion 7 read "no caller is edited by this task", so wiring a caller was never in its remit
# and no successor was filed. Measured 2026-09-02: the script exited 1, naming 3 delete-is-noop
# defects and 16 unblanked-NODE_TEST_CONTEXT findings, and neither .github/workflows/ nor
# package.json referenced it anywhere. W1-T2732 is that missing successor: it cleared the
# population this script reports (every delete-is-noop site converted to real blanking, every
# unblanked strip blanked) and wires the now-clean script here.
#
# WHY ITS OWN FILE RATHER THAN A ci.yml JOB. A new ci.yml job needs a CI_PARITY_TABLE entry in
# src/lib/ci-parity.ts (test/preflight-ci-parity.test.ts refuses a ci.yml job with none), and
# W1-T2732 is fenced from adding any src/ path to this diff. A standalone workflow file needs no
# parity entry (CI_PARITY_TABLE is scoped to ci.yml by design) and is the direction ci-gate.yml's
# own header already states remudero's required checks are moving toward -- the same reasoning
# scripts/unwired-gate-check.mjs's own workflow file (unwired-gate.yml) already documents in full.
#
# Runs UNCONDITIONALLY on every PR (no path filter, no job `if:` beyond the PR trigger) -- the
# same fail-closed shape as ci.yml's task-id-existence/assertion-discrimination gates and
# unwired-gate.yml's own job: a path-filtered REQUIRED check that can go silently absent is the
# synthwatch #102 deadlock class ci-gate.yml exists to avoid. Named in ci-gate.yml's REQUIRED list
# (this same PR) so a red run here actually blocks a merge -- W1-T2292's detector is decorative
# advisory-only until something refuses on its behalf.
name: coverage-session-blanking

on:
  pull_request:

permissions:
  contents: read

jobs:
  coverage-session-blanking:
    name: coverage-session-blanking
    runs-on: ubuntu-latest
    # W1-T1009: LIGHT band, prophylactic. The check is a `git ls-files` plus a text scan of every
    # tracked test/**/*.ts file, the same shape and order of magnitude as unwired-gate's ~0.2s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Coverage-session-blanking check (no delete-is-noop, no unblanked NODE_TEST_CONTEXT strip)
        run: npm run --silent coverage-session-blanking:check
