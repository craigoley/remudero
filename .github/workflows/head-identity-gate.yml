name: head-identity-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  head-identity-gate:
    name: head-identity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Refuse a pull request head with no declared identity
        run: npm run --silent head-identity-gate:check
