name: head-identity-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  head-identity-gate:
    name: head-identity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub's default pull_request checkout is the synthetic merge commit, whose message is
      # "Merge <head> into <base>" and carries no trailer.  This gate reads the HEAD commit message,
      # so unpinned it judges the merge commit and the Remudero-Task trailer form it advertises can
      # never be satisfied (W1-T3514).  Same pin, same reason, as proof-discrimination-gate.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Refuse a pull request head with no declared identity
        run: npm run --silent head-identity-gate:check
