name: Fleet Heartbeat Watch

# The other half of scripts/fleet-heartbeat.sh: that script publishes "I am still here" from each
# host, and this job notices when it stops. It runs on GitHub's runners, off the host it judges,
# because a watcher living on the machine it watches cannot report that machine's death.
#
# Delivery goes through scripts/needs-human-issue.mjs, the same idempotent issue-per-marker
# mechanism clock-sweep.yml, recovery-drill.yml and mutation-nightly.yml already use. This job is
# not a required check and not a normal PR trigger, the same polarity as those three siblings, and
# it is absent from ci-gate.yml and from CI_PARITY_TABLE for the same reason.
#
# INVARIANT: a branch absent from HEARTBEAT_BRANCHES has never installed the beat, and this job
# stays silent about it — only a branch that EXISTS and has gone stale is a finding, judged branch
# by branch and never collapsed to "some host is fresh".
# Why: a collapsed reading would repeat the outage this design guards against (W1-T483) — see
# docs/forensics/fleet-heartbeat-watch-yml.md#branch-absence-is-silent.
#
# INVARIANT: STALE_AFTER_MINUTES is six times the beat's five-minute cadence, sized generously
# because the transient-failure rate it must tolerate is unmeasured; refine only once the beat's
# own `since_prev_beat_s` gives real data.
# Why: a bound sized against an unmeasured population has repeatedly fired on healthy conditions
# here (W1-T312, W1-T380, W1-T382) — see docs/forensics/fleet-heartbeat-watch-yml.md#the-staleness-threshold.
#
# This job does not cover its own silence — a scheduled run GitHub drops has no watcher of its own.
#
# Runs hourly at :37, offset from :00/:30 and the three other scheduled jobs' own minutes so the
# four never contend for a runner window — docs/forensics/fleet-heartbeat-watch-yml.md#scheduling.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fleet-heartbeat.sh"
      - ".github/workflows/fleet-heartbeat-watch.yml"

permissions:
  contents: read

env:
  # One entry per host, space-separated: heartbeat-mini, heartbeat-azure. Adding a host costs one
  # word here plus `RMD_HEARTBEAT_BRANCH=<word>` in its cron line; an entry with no beat yet costs
  # nothing, because absence is silent per branch (see the file header).
  #
  # A branch named here is also guarded from the branch reaper (reapBranchesCommand,
  # src/run-task.ts); a name missing from that gate's own DECLARED_BRANCH_GUARDS is reported as
  # drift.
  # Why: the retired `heartbeat` entry stays here, inert, rather than being deleted — see
  # docs/forensics/fleet-heartbeat-watch-yml.md#heartbeat_branches.
  HEARTBEAT_BRANCHES: "heartbeat-mini heartbeat-azure"
  STALE_AFTER_MINUTES: "30"
  # W1-T2876: only a branch listed here is expected to run a polling daemon, so only it is
  # escalated on daemon_verdict — heartbeat-mini runs no daemon and would otherwise fail this job
  # forever on a true STALE reading. A branch not listed stays silent on this arm.
  # Why: PRs #4095 and #4068 fixed a run that printed "daemon STALE" and reported 0 stale — see
  # docs/forensics/fleet-heartbeat-watch-yml.md#daemon_expected_branches.
  DAEMON_EXPECTED_BRANCHES: "heartbeat-azure"

jobs:
  heartbeat-watch:
    name: heartbeat-watch (reads every host's beat branch off-machine; silent per host until installed)
    runs-on: ubuntu-latest
    # R-50: observed runs complete in 15-30 seconds; 20m bounds a genuine hang with generous
    # headroom.
    timeout-minutes: 20
    permissions:
      contents: read
      # DELIVERY. Without this the job's only output is a red badge on a page nobody opens — the
      # same discipline clock-sweep.yml and recovery-drill.yml both name in their own headers.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No `npm ci`, unlike the sibling workflows: scripts/needs-human-issue.mjs uses only node
      # builtins and every check below is bash, so this watcher still runs on a day `npm ci` itself
      # is broken.
      # Why: see docs/forensics/fleet-heartbeat-watch-yml.md#no-npm-ci for the full reasoning.

      # Self-check first, gating the live read: a watcher that reports health regardless of input
      # is worse than none, the same discipline clock-sweep.yml and recovery-drill.yml open with.
      # Inline here while the changeset stays two files; promote it to scripts/ with its own test/
      # falsifier if it grows.
      # Why: see docs/forensics/fleet-heartbeat-watch-yml.md#self-check-first.
      - name: Self-check (a watcher that cannot separate fresh from stale reports false health — fail before watching)
        run: |
          set -euo pipefail
          fail() { echo "SELF-CHECK FAILED: $*" >&2; exit 1; }
          threshold_s=$(( STALE_AFTER_MINUTES * 60 ))

          # (i) the predicate discriminates, in both directions, at its own boundary.
          is_stale() { [ "$1" -gt "$threshold_s" ]; }
          is_stale $(( threshold_s + 60 )) || fail "an age one minute PAST the threshold was judged fresh"
          ! is_stale $(( threshold_s - 60 )) || fail "an age one minute INSIDE the threshold was judged stale"
          echo "self-check: staleness predicate discriminates at ${STALE_AFTER_MINUTES}m"

          # (i-b) W1-T2876: the daemon arm must discriminate on BOTH axes -- the verdict itself AND
          # whether the branch is expected to run a daemon at all. A pair that only proved "STALE
          # escalates" would also pass for an UNCONDITIONAL arm, and an unconditional arm fails this
          # job forever on `heartbeat-mini`, whose STALE reading is correct and permanent. Both
          # directions of both axes are therefore asserted here.
          is_daemon_stale() { case "$1" in STALE*) return 0 ;; *) return 1 ;; esac; }
          daemon_expected() { case " ${DAEMON_EXPECTED_BRANCHES} " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          is_daemon_stale "STALE — last poll 2h17m ago" || fail "a STALE daemon verdict did not read as stale"
          ! is_daemon_stale "live"                      || fail "a live daemon verdict read as stale"
          daemon_expected heartbeat-azure               || fail "the fleet host is absent from DAEMON_EXPECTED_BRANCHES"
          ! daemon_expected heartbeat-mini              || fail "a host that runs no daemon is armed on the daemon arm"
          echo "self-check: daemon arm discriminates on verdict AND on branch membership"

          # (ii) the beat script parses, and reports the three states it exists to separate.
          bash -n scripts/fleet-heartbeat.sh || fail "scripts/fleet-heartbeat.sh does not parse"
          work=$(mktemp -d)
          iso_ago() { date -u -d "-$1 seconds" +%Y-%m-%dT%H:%M:%S.000Z; }
          seed() { # seed <name> <daemon-age-s> <install-healthy?> [deploy-age-s|none]
            mkdir -p "$work/$1/root/state" "$work/$1/install/scripts"
            cp scripts/fleet-heartbeat.sh "$work/$1/install/scripts/"
            printf '{"ts":"%s","step":"daemon.boot","env_clean":true,"head_sha":"0123456789abcdef0123456789abcdef01234567"}\n' "$(iso_ago 9000)" \
              > "$work/$1/root/state/ledger.ndjson"
            printf '{"ts":"%s","step":"daemon.idle","tick":7,"poll_interval_ms":60000}\n' "$(iso_ago "$2")" \
              >> "$work/$1/root/state/ledger.ndjson"
            if [ "$3" = "healthy" ]; then
              mkdir -p "$work/$1/install/node_modules/.bin"
              printf '#!/bin/sh\n' > "$work/$1/install/node_modules/.bin/tsx"
              chmod +x "$work/$1/install/node_modules/.bin/tsx"
            else
              mkdir -p "$work/$1/install/node_modules"
            fi
            # THE FOURTH ARG IS OPTIONAL AND DEFAULTS TO OMITTED (W1-T2349): every seed() call
            # above this one predates the deploy-supervisor probe and must keep asserting exactly
            # what it asserted, so a ledger with no `deploy.` line is the default, not a special
            # case that needs naming at every call site.
            if [ -n "${4:-}" ] && [ "$4" != "none" ]; then
              printf '{"ts":"%s","step":"deploy.skip","reason":"up-to-date"}\n' "$(iso_ago "$4")" \
                >> "$work/$1/root/state/ledger.ndjson"
            fi
          }
          beat() { RMD_HEARTBEAT_DRY_RUN=1 RMD_ROOT="$work/$1/root" bash "$work/$1/install/scripts/fleet-heartbeat.sh"; }

          seed healthy 45 healthy
          beat healthy | grep -q '^daemon_verdict=live$' || fail "a fresh daemon line did not read as live"
          beat healthy | grep -q '^rmd_verdict=ok$'      || fail "a present tsx did not read as ok"

          seed deaddaemon 8040 healthy
          beat deaddaemon | grep -q '^daemon_verdict=STALE' || fail "a two-hour-old daemon line did not read as STALE"
          beat deaddaemon | grep -q '^rmd_verdict=ok$'      || fail "a healthy install was misreported while the daemon was stale"

          seed brokeninstall 45 broken
          beat brokeninstall | grep -q '^tsx_present=no$'      || fail "a missing tsx was not detected"
          beat brokeninstall | grep -q '^rmd_verdict=BROKEN'   || fail "an emptied node_modules did not read as BROKEN"
          # THE CASE THE WHOLE DESIGN TURNS ON: an emptied node_modules kills every rmd verb while
          # the running daemon keeps ticking from resident memory. A heartbeat written as a verb
          # goes silent here and reads identically to a power cut; this one must still report.
          beat brokeninstall | grep -q '^daemon_verdict=live$' || fail "the broken-install beat lost the daemon signal it must still carry"
          echo "self-check: the beat script separates healthy / dead-daemon / broken-install"

          # (ii.b) THE DEPLOY-SUPERVISOR TICK (W1-T2349). The daemon and install fields above can
          # all read healthy while the SEPARATE deploy-supervisor cycle has stopped ticking — that
          # is the whole gap this field closes, so the self-check proves the three states `seed`'s
          # new fourth argument can produce: a fresh `deploy.` line, an hours-old one, and a ledger
          # with none at all.
          seed freshdeploy 45 healthy 30
          beat freshdeploy | grep -q '^supervisor_verdict=live$' || fail "a fresh deploy. line did not read as live"

          seed staledeploy 45 healthy 5400
          beat staledeploy | grep -q '^supervisor_verdict=STALE' || fail "a 90-minute-old deploy. line did not read as STALE"
          # THE CASE THIS TASK FILES: a stalled deploy cycle must not be confused with a dead
          # daemon or a broken install — both of the OTHER verdicts must still read healthy.
          beat staledeploy | grep -q '^daemon_verdict=live$' || fail "a stale deploy-supervisor beat lost the daemon signal it must still carry"
          beat staledeploy | grep -q '^rmd_verdict=ok$'      || fail "a stale deploy-supervisor beat lost the install signal it must still carry"

          seed nodeploy 45 healthy none
          beat nodeploy | grep -q '^supervisor_verdict=unknown$' || fail "a ledger with no deploy. line did not read as unknown"
          ! beat nodeploy | grep -q '^supervisor_last_age_s=' || fail "an absent deploy signal still published an age"
          echo "self-check: the beat script separates a fresh / stale / absent deploy-supervisor tick"

          # (iii) THE RESTART BUDGET DEGRADES TO ABSENT, NEVER TO ZERO (W1-T483). No `remudero-daemon`
          # exists on a runner, so this exercises the unreadable path for real rather than by
          # stubbing it — whether the runner reaches it through "no container runtime" or through
          # "inspect answered nothing" does not matter, because both must publish NO NUMBER.
          # `restart_count=0` here would read as "the whole budget is untouched" — the most
          # reassuring value in the range — off a read that never happened. The two branches are
          # separated by name in test/fleet-heartbeat.test.ts; this clause only pins the outcome.
          beat healthy | grep -q '^restart_source=' || fail "the beat dropped restart_source entirely"
          ! beat healthy | grep -q '^restart_count=' || fail "an unreadable restart budget still published a count"
          ! beat healthy | grep -q '^restart_max='   || fail "an unreadable restart budget still published a maximum"
          echo "self-check: an unreadable restart budget is ABSENT, not zero"

      - name: Read every host beat branch and judge each age
        # Skipped on `pull_request`: a PR touching these two files is exercising the SELF-CHECK
        # above, and must not go red merely because the operator's machine happens to be off.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          threshold_s=$(( STALE_AFTER_MINUTES * 60 ))
          : > heartbeat-report.txt
          watched=0
          absent=0
          stale=0

          # `supervisor_verdict` (W1-T2349) is judged FROM THE VALUE THE BEAT ITSELF PUBLISHED —
          # never re-derived from the ledger here, because this job cannot reach the host's
          # filesystem at all; it only reads what `scripts/fleet-heartbeat.sh` already decided.
          # NEVER-PRESENT IS SILENT (design note iv): `unknown` covers both "this host has no
          # deploy-supervisor at all" (the container host advances via its own deploy entrypoint
          # script under docker instead, never logging a deploy.* line) and "the ledger could not
          # be read", and neither is a finding —
          # only a branch whose beat SAYS `STALE` is. IT COUNTS INTO THE SAME `stale` TOTAL a beat's
          # own age already does (design note vi: "counts it like `stale`") rather than a second
          # counter, so the combined pass/fail verdict below stays the single `[ "$stale" -eq 0 ]`
          # check it always was — a stalled deploy cycle on an otherwise-fresh beat is still a
          # reason this job must fail, exactly as a stale beat itself is.
          is_supervisor_stale() { case "$1" in STALE*) return 0 ;; *) return 1 ;; esac; }

          # W1-T2876: THE SIGNAL THIS JOB USED TO PRINT AND THEN DISCARD. `fleet-heartbeat.sh`
          # publishes `daemon_verdict` so that a beat cannot be a liveness claim about the cron
          # alone -- its own header: "A beat that only proves the cron fired is a GREEN LIGHT ON A
          # DEAD FLEET, which is worse than no light at all." Until now that value appeared ONLY in
          # the self-check above: the judging loop extracted `supervisor_verdict` and nothing else,
          # so on 2026-09-05 (run 33961825846) this job printed `daemon STALE` twice while the Azure
          # daemon had been dead three hours, and reported `0 stale`. Same shape as the supervisor
          # arm, counting into the SAME `stale` total, so the combined verdict below stays the single
          # `[ "$stale" -eq 0 ]` check it has always been.
          is_daemon_stale() { case "$1" in STALE*) return 0 ;; *) return 1 ;; esac; }
          daemon_expected() { case " ${DAEMON_EXPECTED_BRANCHES} " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          # THE LOOP NEVER EXITS EARLY, IN EITHER DIRECTION, AND THAT IS THE FIX. A `break` or an
          # `exit 1` on the first stale branch would hide every host after it; an early success on
          # the first fresh branch would hide every host after THAT — which is precisely the outage
          # this was extended for, where one healthy machine's beat covered another's silence. So
          # every branch is judged on its own and the verdict is combined only at the end.
          for branch in $HEARTBEAT_BRANCHES; do
            if [ -z "$(git ls-remote --heads origin "$branch")" ]; then
              absent=$(( absent + 1 ))
              echo "heartbeat-watch: '${branch}' does not exist on origin — that host has NOT INSTALLED the beat."
              echo "  Silent by design: see this workflow's header. Install scripts/fleet-heartbeat.sh on a"
              echo "  five-minute cadence with RMD_HEARTBEAT_BRANCH=${branch} and this watcher arms itself"
              echo "  on the first beat."
              continue
            fi
            watched=$(( watched + 1 ))

            git fetch --no-tags --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            beat_epoch=$(git log -1 --format=%ct "origin/${branch}")
            age_s=$(( $(date -u +%s) - beat_epoch ))
            age_m=$(( age_s / 60 ))
            subject=$(git log -1 --format=%s "origin/${branch}")
            payload=$(git show "origin/${branch}:heartbeat.txt" 2>/dev/null || echo "(no heartbeat.txt on the branch)")
            sup_verdict=$(printf '%s\n' "$payload" | sed -n 's/^supervisor_verdict=//p' | tail -n 1)
            dmn_verdict=$(printf '%s\n' "$payload" | sed -n 's/^daemon_verdict=//p' | tail -n 1)

            # THE CONDITION LEADS THE REPORT, NAMED EXPLICITLY (design note vi) — this workflow's
            # issue title reads "the machine has stopped reporting", which is WRONG for a fresh
            # beat carrying a stalled deploy cycle, so the per-branch block must say WHICH failure
            # fired rather than leave the reader to infer it from the age line and payload alone.
            if [ "$age_s" -gt "$threshold_s" ]; then
              condition="BEAT STALE — the machine itself has stopped reporting (${age_m}m, threshold ${STALE_AFTER_MINUTES}m)"
            elif daemon_expected "$branch" && is_daemon_stale "$dmn_verdict"; then
              condition="DAEMON STALE — the beat is fresh but the daemon has stopped polling: ${dmn_verdict}"
            elif is_supervisor_stale "$sup_verdict"; then
              condition="DEPLOY-SUPERVISOR STALE — the beat is fresh but the deploy cycle has stopped: ${sup_verdict}"
            else
              condition="fresh — beat ${age_m}m old, deploy-supervisor ${sup_verdict:-unknown}"
            fi

            # THE LAST BEAT'S PAYLOAD, NOT JUST ITS AGE. "No beat for 71 minutes" is half an answer;
            # "and the last one said the daemon had not polled in two hours", or "and the last one
            # said node_modules was empty", is the whole one — and it is the difference between
            # knowing the machine is gone and knowing which part of it is. The BRANCH IS NAMED on
            # every block, because with more than one host an unlabelled payload cannot be
            # attributed and the report would repeat the very confusion this closes.
            {
              echo "── ${branch} ──"
              echo "Condition: ${condition}"
              echo "Last beat was ${age_m} minute(s) ago (threshold: ${STALE_AFTER_MINUTES}m)."
              echo "Last beat subject: ${subject}"
              echo
              echo "Last beat payload:"
              echo "$payload"
              echo
            } >> heartbeat-report.txt

            if [ "$age_s" -gt "$threshold_s" ]; then
              stale=$(( stale + 1 ))
              echo "heartbeat-watch: STALE — '${branch}' has not beaten for ${age_m} minute(s)." >&2
            elif daemon_expected "$branch" && is_daemon_stale "$dmn_verdict"; then
              stale=$(( stale + 1 ))
              echo "heartbeat-watch: DAEMON STALE — '${branch}': ${dmn_verdict}" >&2
            elif is_supervisor_stale "$sup_verdict"; then
              stale=$(( stale + 1 ))
              echo "heartbeat-watch: DEPLOY-SUPERVISOR STALE — '${branch}': ${sup_verdict}" >&2
            else
              echo "heartbeat-watch: fresh — '${branch}' is ${age_m} minute(s) old."
            fi
          done

          cat heartbeat-report.txt
          echo "heartbeat-watch: ${watched} branch(es) watched, ${absent} not installed, ${stale} stale."
          [ "$stale" -eq 0 ] || exit 1

      - name: Open or update a needs-human issue when the beat has stopped
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_WHEN: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s heartbeat-report.txt || echo "(no report captured -- the run failed before it could read the beat branch)" > heartbeat-report.txt
          node scripts/needs-human-issue.mjs \
            --source fleet-heartbeat \
            --title "fleet-heartbeat: the machine has stopped reporting" \
            --body-file heartbeat-report.txt

      - name: Upload the beat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartbeat-report
          path: heartbeat-report.txt
          if-no-files-found: ignore
