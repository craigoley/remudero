name: Fleet Heartbeat Watch

# THE OTHER HALF OF scripts/fleet-heartbeat.sh. That script makes the mini say "I am still here"
# on a cadence; this job is the thing that NOTICES WHEN IT STOPS. A heartbeat nobody watches is
# not a heartbeat — and the watcher has to live somewhere the machine cannot take down with it,
# which is why this runs on GitHub's runners and reads the signal over the wire rather than
# anywhere on the host it is judging.
#
# A FOURTH CALLER OF AN EXISTING MECHANISM, not a new one. Delivery goes through
# scripts/needs-human-issue.mjs exactly as clock-sweep.yml, recovery-drill.yml and
# mutation-nightly.yml already do, for the reason that script's own header gives: "a scheduled job
# that fails produces a red badge on a page nobody opens." It is idempotent by construction — it
# COMMENTS on an existing open issue carrying the `<!-- needs-human:fleet-heartbeat -->` marker and
# OPENS one only when none exists, so an hourly cron cannot produce a wall of duplicates; identity
# rides that marker rather than the title, so retitling during triage does not fork a thread; and
# it exits 1 when delivery itself failed, because a failure to notify must be loud.
#
# NOT A REQUIRED CHECK AND NOT AN ORDINARY PR TRIGGER — the same polarity clock-sweep.yml,
# recovery-drill.yml and mutation-nightly.yml all establish, and deliberately absent from
# ci-gate.yml. It is also not a ci.yml job, so it needs no CI_PARITY_TABLE entry: `runCiParity`'s
# drift check (src/lib/ci-parity.ts) parses ci.yml's own top-level job keys and nothing else.
#
# ── BRANCH ABSENT MEANS NOT INSTALLED, AND IS SILENT ──────────────────────────────────────────
# The single most important behaviour here. The beat script is committed to the repo but INSTALLED
# on each host separately, so between this workflow merging and that installation there is a window
# — possibly days — in which a host's branch does not exist at all. Firing then would open a
# needs-human issue every hour about a machine nobody has armed yet, which is precisely how a
# label gets trained into noise and then ignored. So: no branch => NOT INSTALLED => silent. Only a
# branch that EXISTS and has gone quiet is a finding. This is the same bound-fires-on-a-healthy-
# condition trap W1-T312, W1-T380 and W1-T382 were each filed for, in a new guise.
# AND THAT CLAUSE IS NOW PER BRANCH, WHICH IS THE PART MOST EASILY BROKEN. The loop below decides
# installed-or-not for EACH branch on its own and never collapses to "some branch is fresh, so all
# is well" — a single any-branch-is-fresh reading would reproduce the exact outage this watcher was
# extended for.
#
# ── ONE BRANCH PER HOST, AND WHY A LIST RATHER THAN A JOB EACH (W1-T483) ──────────────────────
# Each beat is a force-pushed PARENTLESS commit, so a branch carries exactly one beat and no
# history, and two hosts beating to the same branch OVERWRITE each other. This watcher reads
# `now - last commit`, so it would see whichever host beat most recently and a healthy host would
# mask a dead one completely. MEASURED 2026-08-14: the Azure fleet was down 2h56m — 90% of a day's
# downtime in one event — while `heartbeat` kept reporting `daemon live`, truthfully, about the
# mini, and this watcher correctly stayed silent about the wrong machine.
# TWO SHAPES WERE AVAILABLE AND THE SHARD RANKED NEITHER. One JOB per host reads well in the
# Actions UI and isolates failures, but duplicates the whole body per host and makes the
# absent-is-silent rule a copy-paste invariant — the kind that drifts. A LIST keeps that rule in
# ONE place, costs one word per new host, and lets each entry be independently silent; its cost is
# that all hosts share one job result and one issue thread, which the per-branch report below
# offsets by naming every branch it read. The list is taken for the single-definition reason.
# A THIRD SHAPE WAS REJECTED: discovering branches by prefix (`git ls-remote --heads 'heartbeat*'`)
# would arm new hosts automatically, but any stray or abandoned `heartbeat-*` branch would then go
# stale and alarm forever — a watcher that alarms on junk gets muted, and a muted watcher is worse
# than none. An explicit list cannot do that.
#
# ── THE THRESHOLD, AND WHERE THE NUMBER COMES FROM ────────────────────────────────────────────
# STALE_AFTER_MINUTES = 30, which is SIX TIMES the beat script's documented five-minute install
# cadence. The multiple is what needs justifying, so:
#
#   * The threshold must clear the largest gap a HEALTHY fleet can produce. Note what does NOT
#     enter that: this job's own hourly cadence affects DETECTION LATENCY, not the measured age —
#     the age is `now - last beat commit`, so a healthy reading is one beat interval plus jitter
#     whenever this happens to run. The only healthy sources of a gap are a transiently failed
#     `git push` (network blip, a GitHub 5xx) and launchd/cron jitter on the mini.
#   * The distribution of those transient failures is UNMEASURED. It cannot be sampled today —
#     the machine is down — and this repo's recurring defect is a bound sized against a population
#     nobody has observed, which then fires on healthy conditions (ci-gate's wait cap under the
#     real check wall-clock, W1-T312; a deploy ceiling consumed by a dry run, W1-T380; a check-wait
#     bound where 21 of 21 booked PRs later merged, W1-T382). With the population unmeasured the
#     correct move is to size GENEROUSLY and let operation measure it, not to fit to intuition.
#   * Six tolerates five consecutive missed beats — twenty-five minutes in which `git push` alone
#     failed repeatedly, which is a real problem in its own right and deserves the issue anyway.
#   * The cost of that generosity is bounded and small: worst-case detection moves from about five
#     minutes to about thirty, plus this job's hourly cadence — against a status quo of hours, or
#     never.
#   * REFINEMENT IS BUILT IN. Every beat carries `since_prev_beat_s`, the gap the MACHINE itself
#     observed since its own last published beat, so after a few weeks the real distribution is
#     readable off the beats and this multiple can be fitted to data instead of to caution. Do not
#     tighten it before that data exists.
#
# ── WHAT THIS JOB DOES NOT COVER ──────────────────────────────────────────────────────────────
# Its own silence. GitHub's scheduled workflows are best-effort and can be delayed or dropped on a
# low-activity repository, and nothing here notices if this job stops running. A watcher-of-the-
# watcher is an infinite regress; the honest statement is that this closes the machine-goes-dark
# gap and not the GitHub-drops-our-cron gap.
#
# HOURLY at :37 — off :00/:30 for the reason clock-sweep.yml's own scheduling note gives, and off
# the minutes clock-sweep (:23), mutation-nightly (:31) and recovery-drill (:17) already occupy, so
# the four scheduled instruments never contend for the same runner window.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fleet-heartbeat.sh"
      - ".github/workflows/fleet-heartbeat-watch.yml"

permissions:
  contents: read

env:
  # ONE ENTRY PER HOST, space-separated. `heartbeat-mini` is the mini's and `heartbeat-azure` is
  # Azure's. Adding a host is one word here plus `RMD_HEARTBEAT_BRANCH=<that word>` in its cron
  # line — and an entry whose branch does not exist yet costs nothing, because absence is silent
  # per branch.
  #
  # THE BARE `heartbeat` NAME IS DELIBERATELY GONE FROM THIS LIST, AND NOTHING WRITES IT ANY MORE.
  # It was the mini's until its cron moved to `RMD_HEARTBEAT_BRANCH=heartbeat-mini`; its last beat
  # is frozen at 2026-08-14T16:30:00Z carrying `beat_host=Craigs-Mac-mini`. Leaving it here would
  # watch a branch no host writes, which goes stale after STALE_AFTER_MINUTES and opens a
  # needs-human issue about a machine that is perfectly healthy — the fastest way to get this
  # watcher muted. The ref is NOT deleted: deleting a remote ref is the operator's act, and the
  # reaper can never offer it anyway (see the guard note below). It simply sits inert.
  #
  # NAMING A BRANCH HERE ALSO GUARDS IT FROM THE REAPER, AND OWES A DECLARATION. `reapBranchesCommand`
  # (src/run-task.ts) derives `namedInSource` from `git grep -F <branch> -- src/ scripts/ deploy/
  # .github/`, so an entry in this list makes that branch permanently GUARDED — it can never be
  # classified deletable. The cost is the other half of that mechanism: a branch guarded by the grep
  # but missing from `DECLARED_BRANCH_GUARDS` is reported as DRIFT and `rmd reap-branches` exits 1
  # naming it. That verb is a hand-run DRY RUN — no workflow, no gate, no daemon cadence calls it —
  # so nothing automated goes red, and the message says exactly what to do. Declaring the name there
  # is a one-line change to src/run-task.ts and is deliberately NOT part of W1-T483, whose scope is
  # observability and which declares no `src/` path. Whoever adds the third host should expect the
  # same alarm; its own doc calls that "the alarm working as intended".
  HEARTBEAT_BRANCHES: "heartbeat-mini heartbeat-azure"
  STALE_AFTER_MINUTES: "30"

jobs:
  heartbeat-watch:
    name: heartbeat-watch (reads every host's beat branch off-machine; silent per host until installed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # DELIVERY. Without this the job's only output is a red badge on a page nobody opens — the
      # same discipline clock-sweep.yml and recovery-drill.yml both name in their own headers.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No `npm ci`, unlike the three sibling workflows — a deliberate subtraction, not an
      # oversight. scripts/needs-human-issue.mjs imports only node builtins (node:fs,
      # node:child_process, node:url, node:util) and the checks below are bash, so nothing here
      # needs the dependency tree. That also means this watcher keeps working on a day `npm ci`
      # itself is broken, which is not a hypothetical failure mode for this repo.

      # SELF-CHECK FIRST, gating the live read — the same "probe self-check before sweeping"
      # discipline clock-sweep.yml and recovery-drill.yml both open with. A watcher that reports
      # health regardless of input is worse than no watcher, because it reads as coverage that does
      # not exist. Both halves are exercised: the staleness predicate must DISCRIMINATE, and the
      # real beat script must produce the three verdicts it exists to distinguish. This is inline
      # rather than a third file because the changeset is deliberately two files; if it grows,
      # promote it to scripts/ and give it a test/ falsifier.
      - name: Self-check (a watcher that cannot separate fresh from stale reports false health — fail before watching)
        run: |
          set -euo pipefail
          fail() { echo "SELF-CHECK FAILED: $*" >&2; exit 1; }
          threshold_s=$(( STALE_AFTER_MINUTES * 60 ))

          # (i) the predicate discriminates, in both directions, at its own boundary.
          is_stale() { [ "$1" -gt "$threshold_s" ]; }
          is_stale $(( threshold_s + 60 )) || fail "an age one minute PAST the threshold was judged fresh"
          ! is_stale $(( threshold_s - 60 )) || fail "an age one minute INSIDE the threshold was judged stale"
          echo "self-check: staleness predicate discriminates at ${STALE_AFTER_MINUTES}m"

          # (ii) the beat script parses, and reports the three states it exists to separate.
          bash -n scripts/fleet-heartbeat.sh || fail "scripts/fleet-heartbeat.sh does not parse"
          work=$(mktemp -d)
          iso_ago() { date -u -d "-$1 seconds" +%Y-%m-%dT%H:%M:%S.000Z; }
          seed() { # seed <name> <daemon-age-s> <install-healthy?> [deploy-age-s|none]
            mkdir -p "$work/$1/root/state" "$work/$1/install/scripts"
            cp scripts/fleet-heartbeat.sh "$work/$1/install/scripts/"
            printf '{"ts":"%s","step":"daemon.boot","env_clean":true,"head_sha":"0123456789abcdef0123456789abcdef01234567"}\n' "$(iso_ago 9000)" \
              > "$work/$1/root/state/ledger.ndjson"
            printf '{"ts":"%s","step":"daemon.idle","tick":7,"poll_interval_ms":60000}\n' "$(iso_ago "$2")" \
              >> "$work/$1/root/state/ledger.ndjson"
            if [ "$3" = "healthy" ]; then
              mkdir -p "$work/$1/install/node_modules/.bin"
              printf '#!/bin/sh\n' > "$work/$1/install/node_modules/.bin/tsx"
              chmod +x "$work/$1/install/node_modules/.bin/tsx"
            else
              mkdir -p "$work/$1/install/node_modules"
            fi
            # THE FOURTH ARG IS OPTIONAL AND DEFAULTS TO OMITTED (W1-T2349): every seed() call
            # above this one predates the deploy-supervisor probe and must keep asserting exactly
            # what it asserted, so a ledger with no `deploy.` line is the default, not a special
            # case that needs naming at every call site.
            if [ -n "${4:-}" ] && [ "$4" != "none" ]; then
              printf '{"ts":"%s","step":"deploy.skip","reason":"up-to-date"}\n' "$(iso_ago "$4")" \
                >> "$work/$1/root/state/ledger.ndjson"
            fi
          }
          beat() { RMD_HEARTBEAT_DRY_RUN=1 RMD_ROOT="$work/$1/root" bash "$work/$1/install/scripts/fleet-heartbeat.sh"; }

          seed healthy 45 healthy
          beat healthy | grep -q '^daemon_verdict=live$' || fail "a fresh daemon line did not read as live"
          beat healthy | grep -q '^rmd_verdict=ok$'      || fail "a present tsx did not read as ok"

          seed deaddaemon 8040 healthy
          beat deaddaemon | grep -q '^daemon_verdict=STALE' || fail "a two-hour-old daemon line did not read as STALE"
          beat deaddaemon | grep -q '^rmd_verdict=ok$'      || fail "a healthy install was misreported while the daemon was stale"

          seed brokeninstall 45 broken
          beat brokeninstall | grep -q '^tsx_present=no$'      || fail "a missing tsx was not detected"
          beat brokeninstall | grep -q '^rmd_verdict=BROKEN'   || fail "an emptied node_modules did not read as BROKEN"
          # THE CASE THE WHOLE DESIGN TURNS ON: an emptied node_modules kills every rmd verb while
          # the running daemon keeps ticking from resident memory. A heartbeat written as a verb
          # goes silent here and reads identically to a power cut; this one must still report.
          beat brokeninstall | grep -q '^daemon_verdict=live$' || fail "the broken-install beat lost the daemon signal it must still carry"
          echo "self-check: the beat script separates healthy / dead-daemon / broken-install"

          # (ii.b) THE DEPLOY-SUPERVISOR TICK (W1-T2349). The daemon and install fields above can
          # all read healthy while the SEPARATE deploy-supervisor cycle has stopped ticking — that
          # is the whole gap this field closes, so the self-check proves the three states `seed`'s
          # new fourth argument can produce: a fresh `deploy.` line, an hours-old one, and a ledger
          # with none at all.
          seed freshdeploy 45 healthy 30
          beat freshdeploy | grep -q '^supervisor_verdict=live$' || fail "a fresh deploy. line did not read as live"

          seed staledeploy 45 healthy 5400
          beat staledeploy | grep -q '^supervisor_verdict=STALE' || fail "a 90-minute-old deploy. line did not read as STALE"
          # THE CASE THIS TASK FILES: a stalled deploy cycle must not be confused with a dead
          # daemon or a broken install — both of the OTHER verdicts must still read healthy.
          beat staledeploy | grep -q '^daemon_verdict=live$' || fail "a stale deploy-supervisor beat lost the daemon signal it must still carry"
          beat staledeploy | grep -q '^rmd_verdict=ok$'      || fail "a stale deploy-supervisor beat lost the install signal it must still carry"

          seed nodeploy 45 healthy none
          beat nodeploy | grep -q '^supervisor_verdict=unknown$' || fail "a ledger with no deploy. line did not read as unknown"
          ! beat nodeploy | grep -q '^supervisor_last_age_s=' || fail "an absent deploy signal still published an age"
          echo "self-check: the beat script separates a fresh / stale / absent deploy-supervisor tick"

          # (iii) THE RESTART BUDGET DEGRADES TO ABSENT, NEVER TO ZERO (W1-T483). No `remudero-daemon`
          # exists on a runner, so this exercises the unreadable path for real rather than by
          # stubbing it — whether the runner reaches it through "no container runtime" or through
          # "inspect answered nothing" does not matter, because both must publish NO NUMBER.
          # `restart_count=0` here would read as "the whole budget is untouched" — the most
          # reassuring value in the range — off a read that never happened. The two branches are
          # separated by name in test/fleet-heartbeat.test.ts; this clause only pins the outcome.
          beat healthy | grep -q '^restart_source=' || fail "the beat dropped restart_source entirely"
          ! beat healthy | grep -q '^restart_count=' || fail "an unreadable restart budget still published a count"
          ! beat healthy | grep -q '^restart_max='   || fail "an unreadable restart budget still published a maximum"
          echo "self-check: an unreadable restart budget is ABSENT, not zero"

      - name: Read every host beat branch and judge each age
        # Skipped on `pull_request`: a PR touching these two files is exercising the SELF-CHECK
        # above, and must not go red merely because the operator's machine happens to be off.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          threshold_s=$(( STALE_AFTER_MINUTES * 60 ))
          : > heartbeat-report.txt
          watched=0
          absent=0
          stale=0

          # `supervisor_verdict` (W1-T2349) is judged FROM THE VALUE THE BEAT ITSELF PUBLISHED —
          # never re-derived from the ledger here, because this job cannot reach the host's
          # filesystem at all; it only reads what `scripts/fleet-heartbeat.sh` already decided.
          # NEVER-PRESENT IS SILENT (design note iv): `unknown` covers both "this host has no
          # deploy-supervisor at all" (the container host advances via deploy/entrypoint.sh, never
          # logging a deploy.* line) and "the ledger could not be read", and neither is a finding —
          # only a branch whose beat SAYS `STALE` is. IT COUNTS INTO THE SAME `stale` TOTAL a beat's
          # own age already does (design note vi: "counts it like `stale`") rather than a second
          # counter, so the combined pass/fail verdict below stays the single `[ "$stale" -eq 0 ]`
          # check it always was — a stalled deploy cycle on an otherwise-fresh beat is still a
          # reason this job must fail, exactly as a stale beat itself is.
          is_supervisor_stale() { case "$1" in STALE*) return 0 ;; *) return 1 ;; esac; }

          # THE LOOP NEVER EXITS EARLY, IN EITHER DIRECTION, AND THAT IS THE FIX. A `break` or an
          # `exit 1` on the first stale branch would hide every host after it; an early success on
          # the first fresh branch would hide every host after THAT — which is precisely the outage
          # this was extended for, where one healthy machine's beat covered another's silence. So
          # every branch is judged on its own and the verdict is combined only at the end.
          for branch in $HEARTBEAT_BRANCHES; do
            if [ -z "$(git ls-remote --heads origin "$branch")" ]; then
              absent=$(( absent + 1 ))
              echo "heartbeat-watch: '${branch}' does not exist on origin — that host has NOT INSTALLED the beat."
              echo "  Silent by design: see this workflow's header. Install scripts/fleet-heartbeat.sh on a"
              echo "  five-minute cadence with RMD_HEARTBEAT_BRANCH=${branch} and this watcher arms itself"
              echo "  on the first beat."
              continue
            fi
            watched=$(( watched + 1 ))

            git fetch --no-tags --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            beat_epoch=$(git log -1 --format=%ct "origin/${branch}")
            age_s=$(( $(date -u +%s) - beat_epoch ))
            age_m=$(( age_s / 60 ))
            subject=$(git log -1 --format=%s "origin/${branch}")
            payload=$(git show "origin/${branch}:heartbeat.txt" 2>/dev/null || echo "(no heartbeat.txt on the branch)")
            sup_verdict=$(printf '%s\n' "$payload" | sed -n 's/^supervisor_verdict=//p' | tail -n 1)

            # THE CONDITION LEADS THE REPORT, NAMED EXPLICITLY (design note vi) — this workflow's
            # issue title reads "the machine has stopped reporting", which is WRONG for a fresh
            # beat carrying a stalled deploy cycle, so the per-branch block must say WHICH failure
            # fired rather than leave the reader to infer it from the age line and payload alone.
            if [ "$age_s" -gt "$threshold_s" ]; then
              condition="BEAT STALE — the machine itself has stopped reporting (${age_m}m, threshold ${STALE_AFTER_MINUTES}m)"
            elif is_supervisor_stale "$sup_verdict"; then
              condition="DEPLOY-SUPERVISOR STALE — the beat is fresh but the deploy cycle has stopped: ${sup_verdict}"
            else
              condition="fresh — beat ${age_m}m old, deploy-supervisor ${sup_verdict:-unknown}"
            fi

            # THE LAST BEAT'S PAYLOAD, NOT JUST ITS AGE. "No beat for 71 minutes" is half an answer;
            # "and the last one said the daemon had not polled in two hours", or "and the last one
            # said node_modules was empty", is the whole one — and it is the difference between
            # knowing the machine is gone and knowing which part of it is. The BRANCH IS NAMED on
            # every block, because with more than one host an unlabelled payload cannot be
            # attributed and the report would repeat the very confusion this closes.
            {
              echo "── ${branch} ──"
              echo "Condition: ${condition}"
              echo "Last beat was ${age_m} minute(s) ago (threshold: ${STALE_AFTER_MINUTES}m)."
              echo "Last beat subject: ${subject}"
              echo
              echo "Last beat payload:"
              echo "$payload"
              echo
            } >> heartbeat-report.txt

            if [ "$age_s" -gt "$threshold_s" ]; then
              stale=$(( stale + 1 ))
              echo "heartbeat-watch: STALE — '${branch}' has not beaten for ${age_m} minute(s)." >&2
            elif is_supervisor_stale "$sup_verdict"; then
              stale=$(( stale + 1 ))
              echo "heartbeat-watch: DEPLOY-SUPERVISOR STALE — '${branch}': ${sup_verdict}" >&2
            else
              echo "heartbeat-watch: fresh — '${branch}' is ${age_m} minute(s) old."
            fi
          done

          cat heartbeat-report.txt
          echo "heartbeat-watch: ${watched} branch(es) watched, ${absent} not installed, ${stale} stale."
          [ "$stale" -eq 0 ] || exit 1

      - name: Open or update a needs-human issue when the beat has stopped
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_WHEN: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s heartbeat-report.txt || echo "(no report captured -- the run failed before it could read the beat branch)" > heartbeat-report.txt
          node scripts/needs-human-issue.mjs \
            --source fleet-heartbeat \
            --title "fleet-heartbeat: the machine has stopped reporting" \
            --body-file heartbeat-report.txt

      - name: Upload the beat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartbeat-report
          path: heartbeat-report.txt
          if-no-files-found: ignore
