# Remudero CI — the green-merge gate (W1-T1B). Every PR needs this workflow's green result to
# merge, including the runner's own self-modifying PRs.
#
# INVARIANT 1 — a required check is named by the JOB NAME below, never by this file's name, and
# branch protection is armed with the name OBSERVED from the API after a first run. A typo'd
# context deadlocks merges forever.
#
# INVARIANT 2 — a required check that goes SKIPPED deadlocks merge just as hard (the synthwatch
# #102 class ci-gate.yml exists to avoid). Every job below therefore runs unconditionally: no path
# filter, and no job `if:` beyond an event guard (`github.event_name == 'pull_request'`) or an
# aggregator's `always()`. The two matrix jobs carry no `if:` at all, at job or step level, and
# scope themselves with shell guards instead; their shards collapse through the always-run
# aggregators `ci` and `coverage-ratchet`, whose two stable names are the only required contexts
# while the matrix checks still expose which shard failed.
#
# INVARIANT 3 — every job bounds its own runtime (W1-T1009). A LIGHT-band job sits at 10m,
# prophylactic: 13x the 46s maximum observed over 440 sampled job-runs of that class. The two
# Playwright-carrying HEAVY jobs derive their own bounds below.
#
# Why: the measurements, incidents and design arguments compacted out of this file are archived
# verbatim in docs/forensics/ci-yml.md, per docs/comment-standard.md.
name: CI

on:
  pull_request:
  # W1-T1033: `ci` runs on main pushes; PR-only jobs below shell-skip or event-guard their work.
  # TRAP: `ci-gate.yml` must not gain this trigger; test/push-ci-on-main.test.ts pins why.
  push:
    branches: [main]

permissions:
  contents: read

# R-50: a force-push mid-run left the superseded PR run competing for the same CI-minute budget as
# its replacement, so group by PR number and let a PR's own runs cancel their predecessor.
#
# INVARIANT: `cancel-in-progress` is true only on `pull_request`. A push to `main` groups by
# `github.ref` (always `refs/heads/main` here) so those runs share one FIFO queue and are never
# cancelled — this is the only lane running the full suite and the coverage aggregate against
# `main`, and cancelling a slower in-flight run would drop coverage data for a merged commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci-shard (${{ matrix.shard }}/4)
    # W1-T1033: no `if:` here — this matrix and its aggregator run on both triggers above.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # W1-T1009: HEAVY band. 35m/2100s sits in the gap between the longest observed non-hung run
    # (1637s) and the first observed hang (2647s). INVARIANT: it must stay strictly below
    # ci-gate.yml's WAIT_CAP_SECONDS (2400s), or ci-gate times out first and the misattribution
    # defect returns intact. Re-derive this if that cap is ever retuned (W1-T312).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `origin/main` must RESOLVE on the runner: test/recon-gaps-relayed.test.ts shells
          # `git show origin/main:src/run-task.ts` against the live checkout, and a shallow fetch
          # leaves no such ref. It self-clears on a re-run, so it reads as noise — it cost four CI
          # cycles across #1658, #1659 and #1677 in one day.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine Playwright's pinned browser version (cache key input)
        id: playwright-version
        run: |
          VERSION="$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # R-50: caches the downloaded browser binary only, keyed on runner OS plus the exact
      # playwright version pinned in package-lock.json, never a lockfile hash. No apt interaction.
      - name: Cache Playwright's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (W1-T153 shell a11y/responsive tests need a real headless browser — Lighthouse-equivalent axe-core scan, 390px/1440px no-hscroll, fleet-control read-back/STOP-confirm interaction)
        # NO `--with-deps`, and that is the whole fix: it is what invoked apt, and apt is what
        # failed. Measured on a green run, `--with-deps` installed nine FONT packages and no
        # browser dependency at all — every Chromium shared library is already in the runner image
        # — and no suite here needs those fonts.
        #
        # TRAP: no retry, no wait, no DPkg::Lock::Timeout. #2211's `wait_for_apt_lock` used
        # `flock`, which cannot observe apt's `fcntl(F_SETLK)` lock, and its `timeout` orphaned a
        # root-owned apt-get the runner user cannot signal. A retry cannot outlive a lock holder it
        # created and cannot kill; removing apt removes all of it.
        #
        # FALSIFIER: test/workflow-playwright-install.test.ts refuses `--with-deps` and every
        # retry/wait token in either install step.
        # Why: W1-T1027 filed it, W1-T1034 (#2223) measured it — docs/forensics/ci-yml.md.
        run: npx playwright install chromium
      - name: Typecheck
        # §5 TIER 2, quality gate 4/4 (W1-T98): this step is TS-strict's actual enforcement. A
        # strict-mode violation anywhere in src/**/test/** fails it and blocks merge via ci-gate.
        # TRAP: "0 violations" reads the same whether strict is genuinely wired or silently inert
        # (the neon-drift `_probe(x)` lesson). FALSIFIER: test/strict-probe.test.ts drives the real
        # `tsc` against scripts/strict-probe.ts, a permanently-broken probe deliberately excluded
        # from this step's own `-p tsconfig.json` scope.
        run: |
          if [ "${{ matrix.shard }}" != "1" ]; then
            echo "CI sharding: typecheck runs once on shard 1; shard ${{ matrix.shard }} skips the duplicate invocation."
            exit 0
          fi
          npx tsc -p tsconfig.json --noEmit
      - name: Determine this diff's fast-lane class (W1-T2428 — the `ci` half)
        # A deliberate second copy of the `coverage-ratchet` job's classify step, never a shared
        # output: `needs:` would chain two parallel jobs and cost more than the skip saves.
        # INVARIANT: the class comes from the real predicate — scripts/diff-class.mjs imports
        # `isInPlanScope` from src/lib/plan-architect.ts, so no bash respelling can drift and
        # silently skip a suite (W1-T2428, Q2). It fails closed twice over: the script resolves
        # anything unreadable to SOURCE, and this step clamps stdout to the three known tokens.
        # TRAP: this job also runs on a push, where every request-scoped context token is empty, so
        # no `run:` body here may name one (#3187). Falsifier: test/push-ci-on-main.test.ts.
        id: classify
        run: |
          # PUSH-SAFE BY CONSTRUCTION, and that is an INVARIANT not a preference:
          # test/push-ci-on-main.test.ts asserts no `run:` body in THIS job mentions
          # any request-scoped context token — this job also runs on a push to
          # main, where every one of them is empty. `coverage-ratchet` may use them (it is gated on
          # the event); `ci` may not. So the base comes from GITHUB_BASE_REF, a plain environment
          # variable set on a pull request and EMPTY on a push — exactly the discriminator needed,
          # without naming a forbidden token. `fetch-depth: 0` above guarantees the history for it.
          if [ -n "${GITHUB_BASE_REF}" ]; then
            # NO DEPTH-LIMITING FLAG (test/no-shallowing-of-the-canonical-checkout.test.ts,
            # W1-T2333): shallowing flags are forbidden on any git invocation under
            # .github/workflows/, and one here was also unnecessary — this job's own checkout
            # above already sets `fetch-depth: 0`, so the history is complete before this runs.
            # The ratchet scans TEXT, so this note names no flag literally either.
            git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt 2>/dev/null || : > changed-files.txt
          else
            : > changed-files.txt
          fi
          CLASS="$(node --import tsx scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T2428 fast-lane: this diff classifies as ${CLASS}."
      - name: Test
        # W1-T255: routed through scripts/test-with-retry.mjs (`npm run test:ci`), not plain
        # `npm test`. A green run spawns the same command once; a red run retries it once and names
        # the first attempt's failing test on stdout, so a flake leaves a record instead of erasing
        # it on a manual re-run. `npm test` itself stays retry-free — Stryker re-runs it per mutant
        # (stryker.conf.json), where a retry would blur the kill signal.
        #
        # W1-T2428 fast lane: on a PLAN_ONLY/DOCS_ONLY diff, run only the suites such a diff can
        # fail, enumerated at run time by scripts/diff-class.mjs. It fails closed on the enumeration
        # as well as the class: any failure, and any empty result, falls through to the unmodified
        # `npm run test:ci`. The skip names itself in the log and in $GITHUB_STEP_SUMMARY, because a
        # silent 0-second green is the one defect this lane must not add.
        #
        # W1-T2597 TRAP: a killed or timed-out shard prints only the assertions it reached and never
        # node's trailing summary, so its failure set is a subset by construction yet reads
        # identically to a complete one. The block below makes that legible without changing whether
        # the job is red; it needs `tee`, `set +e` and `PIPESTATUS` under Actions' `-eo pipefail`.
        # Why: measured on PR #3542 — docs/forensics/ci-yml.md.
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ] && [ "${{ matrix.shard }}" != "1" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — shard ${{ matrix.shard }} has no work; shard 1 owns the plan/docs-reading set."
            exit 0
          fi
          if [ "$CLASS" = "SOURCE" ]; then
            echo "CI sharding: class=SOURCE — running test shard ${{ matrix.shard }}/4."
            set +e
            # Node stops parsing runtime options at the first positional test pattern. npm appends
            # `--` arguments after package.json's existing `test/**/*.test.ts` pattern, so the old
            # `npm run test:ci -- --test-shard=...` ran the WHOLE suite in every matrix member: all
            # four live #3609 jobs reported the same 12,752 tests. Invoke the same retry wrapper
            # directly so `--test-shard` reaches Node BEFORE the positional pattern.
            node scripts/test-with-retry.mjs \
              node --test --test-shard=${{ matrix.shard }}/4 \
              --import tsx --import ./test/setup/tmp-hygiene.ts "test/**/*.test.ts" \
              2>&1 | tee test-shard-output.log
            CODE="${PIPESTATUS[0]}"
            set -e
            if [ "$CODE" -ne 0 ] && ! grep -qE '^# tests [0-9]+' test-shard-output.log; then
              echo "::error::ci-shard ${{ matrix.shard }}/4 exited ${CODE} with NO node-test-runner summary ('# tests'/'# pass'/'# fail') anywhere in its output. A killed or timed-out run prints only the assertions it reached and no totals, so its failure set is a SUBSET BY CONSTRUCTION — this red is UNVERIFIED, not a diagnosed failure set (W1-T2597)."
              echo "- **W1-T2597: NO-SUMMARY SHARD** — ci-shard (${{ matrix.shard }}/4) exited ${CODE} with no trailing \`# tests\` summary. Its failure set is UNVERIFIED (truncated evidence), distinct from a shard that reported a complete, genuine failure set." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$CODE"
          fi
          SUITES="$(node --import tsx scripts/diff-class.mjs --list-plan-reading-suites)" || SUITES=""
          if [ -z "$SUITES" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} but the suite enumeration FAILED or was empty — running the FULL suite (fail closed)."
            echo "- W1-T2428 fast-lane: class=${CLASS}, enumeration unusable — ran the **full** suite (fail closed)" >> "$GITHUB_STEP_SUMMARY"
            npm run test:ci
            exit $?
          fi
          COUNT="$(printf '%s\n' "$SUITES" | grep -c .)"
          TOTAL="$(ls test/*.test.ts | grep -c .)"
          echo "W1-T2428 fast-lane: class=${CLASS} — running ${COUNT} of ${TOTAL} suites (the plan/docs-reading set); skipping the rest, which this diff cannot fail."
          echo "- W1-T2428 fast-lane: class=${CLASS} — ran **${COUNT} of ${TOTAL}** suites (the plan/docs-reading set), skipped the remainder" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$SUITES" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          # THE SAME HARNESS IMPORTS `npm run test:ci` CARRIES — `--import tsx` and
          # `--import ./test/setup/tmp-hygiene.ts`. The fast lane changes WHICH suites run,
          # never the harness they run under.
          node --test --import tsx --import ./test/setup/tmp-hygiene.ts $SUITES

  ci-required:
    name: ci
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Collapse all test shards into the stable required check
        env:
          SHARD_RESULT: ${{ needs.ci.result }}
        run: |
          case "$SHARD_RESULT" in
            success)
            echo "ci: all four test shards succeeded."
              ;;
            failure)
              echo "ci: a test shard FAILED (matrix result: failure) — open the shard log; this is a real break until that log says otherwise."
              exit 1
              ;;
            cancelled)
              echo "ci: the shard matrix was CANCELLED (matrix result: cancelled) — usually a newer push superseded this head, so this is not by itself evidence of a test failure, and the current head's own run is the authoritative one. Still red on purpose: a cancelled matrix proves nothing about the tree. Open the shard log — a head sha tells you whether a failure is CURRENT, never whether it is REAL."
              exit 1
              ;;
            skipped)
              echo "ci: the shard matrix never ran (matrix result: skipped) — nothing was measured, so nothing is certified. Open the workflow run to see which upstream job gated it."
              exit 1
              ;;
            *)
              echo "ci: unrecognised matrix result '${SHARD_RESULT}' — refusing. A required check must never pass a state it does not understand."
              exit 1
              ;;
          esac

  commitlint:
    # W1-T31 (MASTER-PLAN §6A), relocated by W1-T129 — the Conventional Commits gate. This repo
    # squash-merges every PR (`squash_merge_commit_title: COMMIT_OR_PR_TITLE`, and neither
    # `gh pr merge --squash` call site in src/run-task.ts / src/lib/worker.ts passes an explicit
    # `--subject`), so only the PR TITLE becomes the commit that lands. Linting the branch commit
    # range failed PRs over commits that would never exist post-merge while leaving the artifact
    # that does persist unchecked. This job lints the title alone against commitlint.config.mjs —
    # relocated, not dropped. FALSIFIER: test/commitlint-mode.test.ts, test/commitlint-config.test.ts.
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # W1-T351: `gh pr view` below needs this to read the live PR title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: commitlint (the PR title — read LIVE via `gh pr view`, not the opened-event payload snapshot)
        # W1-T351: `github.event.pull_request.title` is a snapshot taken at opened/synchronize/
        # reopened (this workflow declares no `types:`, so `edited` is excluded), so a title
        # corrected after `opened` was invisible to the linter and a re-run replayed the same stale
        # payload. `gh pr view --json title` queries the API at job time instead.
        #
        # TRAP: an empty read (API/auth failure) is reported distinctly rather than reaching
        # commitlint as a blank string, where it surfaces as "subject may not be empty" + "type may
        # not be empty" — the signature that cost three investigations.
        # FALSIFIER: test/ci-title-lint.test.ts.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          if [ -z "$PR_TITLE" ]; then
            echo "::error::commitlint: gh pr view returned an EMPTY title for PR #$PR_NUMBER -- this is an empty read (API/auth failure), distinct from a non-conventional title. Do not edit the title to fix this; investigate the gh call."
            exit 1
          fi
          printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.config.mjs --verbose

  leak-grep:
    # Plaintext-secret tripwire (MASTER-PLAN §5 TIER 1). Not a required context yet (W1-T24 wires
    # the aggregator); its own job status is what "on every PR" is proven by.
    name: leak-grep
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: leak-grep (plaintext secret tripwire)
        run: bash .github/scripts/leak-grep.sh

  coverage-ratchet:
    # §5 TIER 2, quality gate 1/4 (W1-T25) — coverage never goes down.
    # scripts/coverage-ratchet.mjs compares this run's lcov totals against the recorded floor in
    # scripts/coverage-baseline.json and exits non-zero on any coverage-lowering PR; that floor
    # only ever ratchets up, by a reviewed bump, never down to make a red PR pass.
    #
    # W1-T212 (recon R-12): that aggregate floor is diff-blind by design, so new code with zero
    # covering tests merges freely while the codebase-wide aggregate holds. The "Diff coverage"
    # step below is a separate, diff-scoped check on the SAME job — sharing this job's
    # always-registers shape rather than adding a required context that could go absent — and
    # fails when the diff adds a source line lcov marks instrumented but never hit.
    name: coverage-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # W1-T1033: deliberately no `if:` here, at job or step level — test/diff-coverage.test.ts asserts
    # this job body carries none at all (the #729 discipline), so the job still registers on the push
    # trigger. Its collection step opens with a plain shell guard instead, and the staging step
    # uploads a skipped marker so every matrix child still yields a checkable artifact. A push has no
    # PR base — `github.event.pull_request.base.sha` is empty there — so the real work must be
    # skipped rather than run wrong.
    # W1-T1009: HEAVY band. Unlike `ci`, this job runs the whole suite under
    # `--experimental-test-coverage`, and W1-T2430's measurement found every one of THIS job's
    # cancellations died on the `Test with coverage` step below, none on `npx playwright install` —
    # same band as `ci`, for its own reason and at its own number. The 39m/2340s ceiling holds until
    # real matrix runs establish a safe lower bound. INVARIANT: it must stay strictly below
    # ci-gate.yml's WAIT_CAP_SECONDS (2400s), or ci-gate times out first and the misattribution
    # defect returns intact; re-derive it if that cap is retuned (W1-T312).
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine this diff's fast-lane class (W1-T2428 — a PLAN_ONLY/DOCS_ONLY diff cannot move source coverage)
        # INVARIANT: the class comes from the real predicate — scripts/diff-class.mjs imports
        # `isInPlanScope` from src/lib/plan-architect.ts. Two of the repo's three scope predicates
        # already disagree; a bash reimplementation here would be a fourth (W1-T2428, Q1). It fails
        # closed twice over: the script resolves an unreadable, empty or malformed input to SOURCE,
        # and this step clamps stdout to the three known tokens, so even a `node`/`tsx` that cannot
        # start leaves CLASS=SOURCE. On a push, changed-files.txt is left empty and the script's own
        # empty-list rule resolves it to SOURCE.
        # TRAP: step-level bash, never a YAML `if:` — the class is READ by the bash guards below.
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}"...HEAD > changed-files.txt || true
          else
            : > changed-files.txt
          fi
          CLASS="$(node --import tsx scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T2428 fast-lane: this diff classifies as ${CLASS}."
      - name: Determine Playwright's pinned browser version (cache key input)
        id: playwright-version
        run: |
          VERSION="$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # R-50: the same cache as the `ci` job's identical step above — see that step for why it is
      # safe and what it is keyed on.
      - name: Cache Playwright's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (same requirement as the ci job — W1-T153's shell a11y/responsive tests launch a real headless browser; this job runs the same test/**/*.test.ts glob under coverage, so it needs it too)
        # The same step as the `ci` job's above, and the same measurement behind dropping
        # `--with-deps`. Fixing one copy and not the other left the second free to take the board
        # down alone — it did, PR #2150 five minutes after PR #2148. This `run:` line must stay
        # byte-identical to the `ci` job's, which test/workflow-playwright-install.test.ts asserts.
        run: npx playwright install chromium
      - name: Test with coverage (spec output to the CI log, lcov to a file — src/** only, test/** excluded from the ratio)
        # W1-T220 defect 1: a `spec` reporter to stdout runs alongside the `lcov` reporter pair.
        # With `--test-reporter=lcov` alone, a failing run's CI log carried zero test output — just
        # "Process completed with exit code 1". The lcov artifact is unchanged.
        #
        # W1-T210 round 2 INVARIANT: `--enable-source-maps` is REQUIRED. Without it,
        # `--experimental-test-coverage` reports DA: positions against the tsx-transpiled JS, not
        # the .ts file named in `SF:` — `neutralizeFenceMarkers` at true line 1120 was reported at
        # 506. The aggregate ratchet tolerates that (it reads only totals), but diff-coverage.mjs
        # looks git-diff line numbers up directly in the DA: map and silently hits an unrelated
        # line, which blocked fully tested new code as uncovered.
        #
        # W1-T255 IS NO LONGER IN FORCE HERE, and this block asserted the opposite until 2026-08-28:
        # the retry is gone from this job and stays in `ci`. Read the wrapper's rationale there.
        # Why: the two operator rulings of 2026-08-28 — docs/forensics/ci-yml.md.
        run: |
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "W1-T1033: coverage-ratchet is PR-only; skipping the real test-with-coverage run on a ${GITHUB_EVENT_NAME} event (see this job's own comment above)."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Test with coverage (no src/**/test/** path in this diff, so coverage cannot newly move)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Test with coverage** (no src/**/test/** path in this diff)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # W1-T1217: `--import ./test/setup/tmp-hygiene.ts` is NOT optional here and its absence
          # was a real divergence, not a saving. The `ci` job runs this same
          # `test/**/*.test.ts` glob through `npm run test:ci`, whose script DOES carry that
          # flag; this step spelled the invocation out inline and omitted it — so the two
          # required jobs ran the same suite under different module sets. Everything the harness
          # provides (the tmp-dir reaper AND, since W1-T1217, the `GIT_CONFIG_*` pair that
          # disables git's background gc for every spawned git) was simply absent from the
          # coverage run. Any test asserting on that environment passes in `ci` and fails here,
          # which is exactly how this was found.
          # ── OPERATOR RULING 1 (2026-08-28): NO FLAKE RETRY IN THIS JOB. ───────────────────
          # `scripts/test-with-retry.mjs` is GONE from this invocation and STAYS in the `ci` job,
          # which is faster and where a second pass fits inside its own bound. Here it re-ran the
          # WHOLE suite on any pass-1 failure, and the second pass usually could not finish: of the
          # SIX two-pass `coverage-ratchet` runs on record, one completed red (2176s), ONE
          # COMPLETED GREEN (2159s), and FOUR were cancelled at 2355-2361s against the 2340s bound.
          # A cancellation names no test, so the retry converted a `failure` that named the failing
          # assertion into a `cancelled` that named nothing.
          #
          # WHAT THIS GIVES UP, STATED RATHER THAN BURIED: that ONE green in six was a real rescue.
          # Removing the retry means a genuine flake in this job now reports red on the first pass
          # instead of being papered over. The `ci` job still retries, so a flake that reproduces
          # in both harnesses is still caught there; a flake unique to instrumentation is not.
          #
          # ── OPERATOR RULING 2: THIS STEP IS NO LONGER A TEST VERDICT. ─────────────────────
          # `ci` owns correctness — it runs the same glob on the quieter harness AND runs on main.
          # This job owns COVERAGE. The duplication is inherent (lcov cannot be produced without
          # running the suite instrumented), so what is removed is the duplicated VERDICT, not the
          # duplicated run.
          #
          # A STEP-LEVEL SHELL GUARD, NEVER A YAML CONDITIONAL AND NEVER A `paths:` FILTER.
          # test/diff-coverage.test.ts asserts this job body carries no line beginning with a YAML
          # conditional (the #729 skipped-check-deadlock discipline), and this job STAYS REQUIRED in
          # ci-gate's list — it must still register and still fail on a coverage regression. The
          # comment two blocks below is what makes a plain `exit 0` here safe: no step in this job
          # carries a YAML conditional, so a FAILING step skips every step after it. Swallowing the
          # test exit code is therefore the only way to keep the coverage gates running at all.
          mkdir -p coverage/raw
          set +e
          NODE_V8_COVERAGE=coverage/raw node --enable-source-maps --experimental-test-coverage --test-coverage-exclude="test/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            --test --test-shard=${{ matrix.shard }}/4 --import tsx --import ./test/setup/tmp-hygiene.ts "test/**/*.test.ts"
          TEST_EXIT=$?
          set -e
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "coverage-ratchet: the instrumented suite exited ${TEST_EXIT}. THIS JOB NO LONGER TREATS THAT AS ITS VERDICT (operator ruling, 2026-08-28) — \`ci\` owns test correctness. The coverage gates below still run and still block."
            echo "- coverage-ratchet: instrumented suite exited **${TEST_EXIT}** — not this job's verdict; see the \`ci\` job for the test result. Coverage gates below still ran." >> "$GITHUB_STEP_SUMMARY"
          fi
          # THE ONE THING THIS STEP STILL FAILS ON: no lcov. Without it the coverage gates below
          # have nothing to read, and a green job would then mean "coverage was never checked" —
          # exactly the vacuous pass this whole job exists to prevent. Absence is a real failure.
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage-ratchet: no lcov produced — the coverage gates below would have nothing to read. FAILING."
            exit 1
          fi
          if ! find coverage/raw -maxdepth 1 -type f -name 'coverage-*.json' -print -quit | grep -q .; then
            echo "coverage-ratchet: no raw V8 coverage produced — cross-shard branch identities could not be merged. FAILING."
            exit 1
          fi
          exit 0
      - name: Stage this coverage shard for the required-check aggregator
        run: |
          mkdir -p coverage-artifact
          if [ -s coverage/lcov.info ]; then
            # The raw process reports were 514 MB for ONE shard on this PR's first live run.
            # Deduplicate repeated source maps locally while retaining every process boundary and
            # V8 range. The aggregator reconstructs those reports, then pinned Node maps and merges
            # all four bundles before assigning LCOV line/branch IDs.
            mkdir -p coverage/compact
            mkdir -p coverage-artifact/raw
            node --expose-internals scripts/coverage-merge-ratchet.mjs --compact-output coverage/compact coverage/raw
            cp coverage/lcov.info coverage-artifact/lcov.info
            cp coverage/compact/coverage-*.json coverage-artifact/raw/
          else
            echo "${GITHUB_EVENT_NAME}:${{ steps.classify.outputs.class }}" > coverage-artifact/skipped
          fi
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-artifact
          retention-days: 1
          if-no-files-found: error

  coverage-ratchet-required:
    name: coverage-ratchet
    runs-on: ubuntu-latest
    needs: [coverage-ratchet]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Require every coverage shard to produce an artifact
        env:
          SHARD_RESULT: ${{ needs.coverage-ratchet.result }}
        run: |
          case "$SHARD_RESULT" in
            success)
            :
              ;;
            failure)
              echo "coverage-ratchet: a coverage shard FAILED (matrix result: failure) — open the shard log; this is a real break until that log says otherwise."
              exit 1
              ;;
            cancelled)
              echo "coverage-ratchet: the shard matrix was CANCELLED (matrix result: cancelled) — usually a newer push superseded this head, so this is not by itself evidence of a test failure, and the current head's own run is the authoritative one. Still red on purpose: a cancelled matrix proves nothing about the tree. Open the shard log — a head sha tells you whether a failure is CURRENT, never whether it is REAL."
              exit 1
              ;;
            skipped)
              echo "coverage-ratchet: the shard matrix never ran (matrix result: skipped) — nothing was measured, so nothing is certified. Open the workflow run to see which upstream job gated it."
              exit 1
              ;;
            *)
              echo "coverage-ratchet: unrecognised matrix result '${SHARD_RESULT}' — refusing. A required check must never pass a state it does not understand."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine this diff's fast-lane class for the coverage aggregator
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}"...HEAD > changed-files.txt || true
          else
            : > changed-files.txt
          fi
          CLASS="$(node --import tsx scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards
      - name: Merge raw V8 coverage shards before assigning LCOV branch indexes
        run: |
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "coverage-ratchet: push event — no PR coverage merge required."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — no coverage shards were collected."
            exit 0
          fi
          for SHARD in 1 2 3 4; do
            RAW_DIR="coverage-shards/coverage-shard-${SHARD}/raw"
            if ! find "$RAW_DIR" -maxdepth 1 -type f -name 'coverage-bundle-*.json' -print -quit 2>/dev/null | grep -q .; then
              echo "coverage-ratchet: expected compact V8 coverage for shard ${SHARD}; refusing a partial merge."
              exit 1
            fi
          done
          mkdir -p coverage
          node --expose-internals scripts/coverage-merge-ratchet.mjs --output coverage/lcov.info \
            coverage-shards/coverage-shard-1/raw coverage-shards/coverage-shard-2/raw \
            coverage-shards/coverage-shard-3/raw coverage-shards/coverage-shard-4/raw
      # INVARIANT (2026-08-13): Diff coverage runs BEFORE the aggregate ratchet. No step in this job
      # carries an `if:`, so a failing step skips every step after it — measured, in five of six
      # recent failing runs the ratchet concluded `failure` and `Diff coverage` was `skipped`, so the
      # only gate checking that a PR covers the lines it adds did not run at all. Ordering the
      # per-diff check first makes it independent without an `if:`, which `if: always()` would not
      # have preserved.
      - name: Compute this PR's base...head diff (for the per-diff coverage check below)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "W1-T1033: coverage-ratchet is PR-only; skipping on a ${GITHUB_EVENT_NAME} event — BASE_SHA is empty here and would fail this diff."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping the base...head diff computation (Diff coverage below has nothing to check)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Compute this PR's base...head diff**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff "${BASE_SHA}"...HEAD > pr.diff
      # TRAP: RMD_CI_REPORT is set per-STEP on these two gate steps only, never at job level. The
      # collection step above runs the whole suite, and the diff-coverage and coverage-ratchet
      # suites spawn these same scripts over BLOCKING fixtures that inherit the job env — a
      # job-wide flag would publish those fixture failures as real check-run annotations.
      - name: Diff coverage (blocks a PR that adds untested source lines, even when the aggregate floor below stays green)
        env:
          RMD_CI_REPORT: "1"
        run: |
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "W1-T1033: coverage-ratchet is PR-only; skipping on a ${GITHUB_EVENT_NAME} event (no pr.diff was computed above)."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Diff coverage (no pr.diff was computed above; no src/**/test/** path in this diff to check)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Diff coverage**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/diff-coverage.mjs --lcov coverage/lcov.info --diff pr.diff
      - name: Coverage ratchet (blocks a PR whose branch coverage is below the absolute floor)
        env:
          RMD_CI_REPORT: "1"
        run: |
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "W1-T1033: coverage-ratchet is PR-only; skipping on a ${GITHUB_EVENT_NAME} event (no coverage/lcov.info was collected above)."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Coverage ratchet (no coverage/lcov.info was collected above; no src/** path in this diff can move the aggregate)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Coverage ratchet**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/coverage-ratchet.mjs --lcov coverage/lcov.info --baseline scripts/coverage-baseline.json
      - name: Stage the merged lcov for the coverage-merged artifact # W1-T2662, for W1-T2661's reader
        run: |
          mkdir -p coverage-merged-artifact
          if [ -s coverage/lcov.info ]; then
            cp coverage/lcov.info coverage-merged-artifact/lcov.info
          else
            echo "skipped" > coverage-merged-artifact/skipped
          fi
      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: coverage-merged-artifact
          retention-days: 1
          if-no-files-found: error

  mutation-ratchet:
    # §5 TIER 2, quality gate 2/4 (W1-T96) — green tests that kill no mutants are theatre; the
    # mutation score is the falsifier. scripts/mutation-ratchet.mjs compares this run's Stryker
    # report against scripts/mutation-baseline.json and exits non-zero on any test-suite-weakening
    # PR; that floor only ever ratchets up. FALSIFIER: test/mutation-ratchet.test.ts.
    #
    # SCOPE: Stryker has no per-mutant test filtering for `node --test`, and mutating the whole
    # src/** tree measured ~4 hours — past ci-gate's required-check wait ceiling, which would
    # deadlock every PR. `stryker.conf.json`'s `mutate` glob is therefore scoped to one pure-logic
    # module (src/lib/classify.ts); widening it is a one-line glob change plus a baseline recapture.
    #
    # LATENCY, two independent fixes here. (1) DIFF-SCOPED (W1-T108): the check run still registers
    # unconditionally, but the `trigger` step runs `mutation-ratchet.mjs --changed-files` — that
    # script's own path-filter mode, so mutate-scope lives in one place — and the Stryker run
    # executes only when the diff can move the score. (2) INCREMENTAL: the cache step below persists
    # Stryker's report across runs; its diff is a pure text comparison, so a report restored from
    # another branch is still correct, just less of a shortcut.
    #
    # W1-T133 TRAP: `commandRunner.command` was `npm test`, the full glob rerun per mutant, and blew
    # past 55 minutes. Only test/classify.test.ts and test/block-reason.test.ts import from
    # src/lib/classify.ts; scoping it to those two gave the SAME 108 valid mutants in 54 seconds.
    # Why: the full latency measurements are in docs/forensics/ci-yml.md.
    name: mutation-ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    # W1-T1009: LIGHT band. This job installed Playwright until W1-T133 removed that step, so it
    # is not immune to the same stall class even though the measured hangs were elsewhere.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine whether this diff can move src/lib/classify.ts's mutation score
        id: trigger
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD > changed-files.txt
          cat changed-files.txt
          node scripts/mutation-ratchet.mjs --changed-files changed-files.txt
      - name: Restore Stryker incremental cache
        if: steps.trigger.outputs.matched == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ github.run_id }}
          restore-keys: |
            mutation-incremental-
      - name: Stryker mutation run (scoped target — see stryker.conf.json; this diff touches it, see trigger step)
        if: steps.trigger.outputs.matched == 'true'
        run: npx stryker run
      - name: Mutation ratchet (blocks a test-suite-weakening PR)
        if: steps.trigger.outputs.matched == 'true'
        # W1-T2707: `--ledger` is what makes the verdict emission a real production path rather
        # than a flag only tests pass. `resolveLedgerPath` is EXPLICIT-ONLY by design (an ambient
        # default once wrote 35 junk lines into an operator's real ledger), so without this the
        # emission resolves `unconfigured` on every genuine run and D-10 keeps counting a
        # population that is never produced. The write is fully contained -- it can never change
        # this job's exit code or its byte-for-byte stdout.
        run: node scripts/mutation-ratchet.mjs --report reports/mutation/mutation.json --baseline scripts/mutation-baseline.json --ledger "$GITHUB_WORKSPACE/state/ledger.ndjson"
      - name: Upload the mutation verdict ledger
        # Emitting into a path the runner discards would make the line above unobservable, which
        # is the failure mode this task exists to end. `always()` so a BLOCKING verdict -- the one
        # D-10 most wants counted -- is uploaded too, not only a passing one.
        if: always() && steps.trigger.outputs.matched == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-verdict-ledger
          path: state/ledger.ndjson
          if-no-files-found: ignore
          retention-days: 30

  learnings-budget-ratchet:
    # §5 TIER 2 (W1-T38, MASTER-PLAN §8A) — "compression is a deliverable" enforced, not
    # aspirational. A CEILING: the total INJECTABLE weight of the active learnings corpus (every
    # learnings/*.yaml shard, lifecycle: active only, rendered exactly as src/lib/learnings.ts's
    # selectLearnings would inject it) is compared against scripts/learnings-budget-baseline.json.
    # Superseded and quarantined entries contribute zero chars (W1-T33, W1-T34), so raw corpus
    # bytes are not what is capped. The cap only ever ratchets up, by a reviewed bump.
    # FALSIFIER: test/learnings-budget-ratchet.test.ts, whose fixture holds bytes constant across
    # an active-versus-superseded switch.
    name: learnings-budget-ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Knowledge budget ratchet (blocks a PR that pushes the active learnings corpus over the recorded cap)
        run: npm run --silent learnings-budget-ratchet
      # W1-T503 (MASTER-PLAN §8A) — CLAUDE.md is injected in full into every session on every lane
      # and was the fleet's largest per-session injectable with no budget at all.
      #
      # INVARIANT: this rides as a STEP in the sibling budget job, not a job of its own, and the
      # placement is load-bearing. CI_PARITY_TABLE is asserted against ci.yml BY JOB NAME in both
      # directions (test/preflight-ci-parity.test.ts, via parseCiJobNames) and nothing asserts a
      # job's STEP list, so a new job would force an entry in src/lib/ci-parity.ts — a product path
      # — beside this workflow, the Rule 25 pairing this placement avoids. Do NOT "complete" it with
      # a matching runStep(). Enforcement is unchanged: a `run:` step carries no continue-on-error,
      # so a non-zero exit fails `learnings-budget-ratchet`, already required by ci-gate.yml.
      #
      # TRAP (W1-T2831): the §8A net-byte arm needs a comparand. This job checks out at
      # actions/checkout's default depth, so `git merge-base HEAD origin/main` cannot resolve and
      # the script falls back to BASE_SHA — which no step passed, so the arm would have skipped on
      # every run. On a push this is empty and the arm correctly skips. The cap in
      # scripts/claude-md-budget-baseline.json only ratchets up, by a reviewed bump.
      # Why: the 2026-08-22 cap raise and its zero-headroom predecessor — docs/forensics/ci-yml.md.
      - name: CLAUDE.md size ratchet (blocks a PR that grows CLAUDE.md past the recorded cap, and refuses a net-positive diff per §8A)
        run: npm run --silent claude-md-budget-ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  jscpd-gate:
    # §5 TIER 2, quality gate 3/4 (W1-T97) — a duplication CEILING: copy-pasted code rots
    # independently and silently. No wrapper script is needed: jscpd's own `--threshold` flag exits
    # non-zero when the duplicated-lines percentage across src/** exceeds the ceiling recorded in
    # .jscpd.json (2%, with headroom over the 1.11% measured at capture). .jscpd.json carries no
    # comment field, because jscpd's parser rejects unknown keys, so the rationale lives here.
    # FALSIFIER: test/jscpd-gate.test.ts drives the real CLI over a planted copy-paste and a clean
    # fixture.
    name: jscpd-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: jscpd duplication gate (blocks a duplicate above the recorded threshold)
        run: npm run --silent jscpd

  claims:
    # PLAN-CLAIMS gate (W1-T29, MASTER-PLAN §12A) — the awareness layer for prose. Plan prose is
    # unverifiable; a falsifiable claim paired with a shell assertion that must exit 0 is not.
    # `plan/claims.yaml` lists them; scripts/claims-check.mjs runs every one and fails the moment any
    # exits non-zero, printing the false claim's id, prose and plan_section so the log NAMES the lie
    # instead of leaving a bare exit code. A claim can be falsified by a change anywhere in the tree,
    # not just under plan/. FALSIFIER: test/claims-check.test.ts.
    name: claims
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Plan claims (every plan/claims.yaml assertion must exit 0)
        run: npm run --silent claims

  assertion-discrimination:
    # ASSERTION-DISCRIMINATION gate (W1-T1051). A test can assert that a literal appears in the RAW
    # text of a repo file while that literal is satisfiable only by a COMMENT beside the mechanism
    # the test claims to pin: the mechanism dies and the assertion still passes.
    #
    # TRAP, measured: a CI wait that should have blocked ~5 minutes on an apt lock returned in ~1
    # second and shipped green, because the test pinned the literal `flock`, present only because
    # the step's own comment named the tool it called. Mutation testing cannot see this class — it
    # mutates SOURCE, and `test/**` is never a mutation target (stryker.conf.json,
    # mutation-nightly-scope.json).
    #
    # scripts/assertion-discrimination-check.mjs strips comments from the target a statically
    # resolvable readFileSync call names (a real repo path, never a per-test tmpdir) and re-evaluates
    # the literal against the stripped copy, against scripts/assertion-discrimination-baseline.json,
    # whose every entry must carry a written reason.
    # FALSIFIER: test/assertion-discrimination-check.test.ts.
    name: assertion-discrimination
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Assertion discrimination (comment-stripped re-evaluation of raw-text assertions)
        run: npm run --silent assertion-discrimination

  lint-plan:
    # §5C Layer A (W1-T20c) — the CI half of the deterministic task linter. It is pure JS over
    # plan/tasks.yaml with no network, so running it on every PR costs nothing.
    #
    # SCOPED to the PR's own edit (`--base <pr-base-sha>`): only task ids new or changed versus the
    # base, never the whole historical queue — re-grading everything already open is the retro's
    # separate plan-health sweep (W1-T20d). `fetch-depth: 0` so the base commit's plan/tasks.yaml
    # resolves via `git show`.
    #
    # FAIL-CLOSED: any blocking violation (sizing, headless-fitness, proof-shape, proof-dialect,
    # provenance) on an in-scope task fails this job, which ci-gate's required list waits on.
    # proof-dialect (W1-T246, moratorium finding 9) reuses parseWhitelistedProof verbatim from
    # src/lib/review.ts, so a proof that cannot execute never lands.
    name: lint-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: rmd lint-plan (PR-changed tasks only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run --silent lint-plan -- --base "$BASE_SHA"

  depcruise:
    # MASTER-PLAN §5 TIER 3 (W1-T26) — the architecture fitness gate, and cheap static analysis.
    # The games' purity gates generalised into a declarable layering rule: `src/lib` must not
    # import the CLI entrypoint (`src/run-task.ts`) or the scratch spike script (`src/spike.ts`)
    # — see `.dependency-cruiser.cjs`'s `lib-no-spike-or-cli` rule. A violating import anywhere
    # under src/lib fails this job. FALSIFIER: test/architecture-fitness.test.ts plants a
    # violation to prove the rule is active, not merely declared.
    name: depcruise
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: dependency-cruiser fitness rules
        run: npm run --silent depcruise

      # THE CYCLE-COUNT RATCHET. `no-circular` is deliberately `warn`: `error` would fail every PR
      # touching any module in an existing ring, and thirteen rings knot much of src/lib. The cruise
      # above REPORTS cycles and this step holds their COUNT at or below scripts/cycle-baseline.json's
      # ceiling, so net growth blocks and touching a ring does not. #2798 cut the count from 24 to 13
      # and nothing held the result; this does. It runs in THIS job so it adds no required context.
      - name: Cycle-count ratchet (blocks a diff that ADDS a dependency cycle; existing rings stay warn-only)
        run: npm run --silent cycle-ratchet

  containment-probe:
    # MASTER-PLAN §5 TIER 1 (W1-T28): the containment probe as a required check on any diff touching
    # sandbox, deny-floor or env. A settings typo silently drops containment, so static validation
    # alone is not enough — the probe is the empirical guarantee (WS-0 FF10a, W1-T2).
    #
    # What is SCOPED to the PR's changed paths is this job's internal behaviour, never its
    # registration (probe-path-filter.yml is the live fixture proving that shape).
    # `containment-diff-trigger.ts` reuses `containmentTrigger()` from src/lib/specialist-panel.ts —
    # the same deterministic predicate the Layer-4 containment specialist is routed by — so the CI
    # gate and the advisory panel never drift on what "touches sandbox/hooks/env/deny-floor" means.
    # On a match the job runs test/containment.test.ts; on no match it still completes successfully.
    name: containment-probe
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine whether this diff touches sandbox/hooks/env/deny-floor
        id: trigger
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD > changed-files.txt
          cat changed-files.txt
          node --import tsx .github/scripts/containment-diff-trigger.ts changed-files.txt
      - name: Containment probe (test/containment.test.ts — required, this diff touches a containment-relevant path)
        if: steps.trigger.outputs.matched == 'true'
        # W1-T1250 INVARIANT: `--import ./test/setup/tmp-hygiene.ts` is not optional here, the same
        # fix W1-T1217 made to coverage-ratchet above. `src/lib/ci-parity.ts`'s
        # `containment-probe:test` step already spells this invocation out with the harness (its own
        # `TMP_HYGIENE_IMPORT` constant), so `rmd preflight --ci-parity` was running this file WITH
        # the harness while this required check ran it WITHOUT — a harness-dependent assertion could
        # pass locally and still fail here.
        run: node --test --import tsx --import ./test/setup/tmp-hygiene.ts test/containment.test.ts

  api-client-drift:
    # §7A packages/api-client generator and stale-client drift check (W3-T1b). The client is
    # GENERATED from openapi/daemon.yaml: scripts/generate-api-client.mjs regenerates
    # packages/api-client/src/schema.d.ts, and `--check` fails the moment the committed file no
    # longer matches a fresh regeneration — so a hand-edited or forgotten client goes red here
    # instead of silently drifting from the daemon it describes.
    # FALSIFIER: test/api-client-drift-check.test.ts.
    name: api-client-drift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: api-client drift check (committed client must match a fresh regeneration from openapi/daemon.yaml)
        run: npm run --silent api-client:check

  no-hand-rolled-fetch:
    # §7A: "no client may hand-roll a `fetch` to the daemon — a grep gate fails the build" (W3-T1c).
    # scripts/no-hand-rolled-fetch-check.mjs walks `apps` and `packages`, excluding
    # `packages/api-client` itself — the one sanctioned home for a future runtime HTTP layer — and
    # fails on any direct `fetch(`/`axios(...)`/`new XMLHttpRequest` call. Every client must talk to
    # the daemon only via `@remudero/api-client`.
    # FALSIFIER: test/no-hand-rolled-fetch-check.test.ts.
    name: no-hand-rolled-fetch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: No-hand-rolled-fetch grep gate (apps/**, packages/** except packages/api-client)
        run: npm run --silent no-hand-rolled-fetch:check

  task-id-existence:
    # TASK-ID EXISTENCE gate (W1-T1048). TRAP: #2251 cited an id as its own task id in shipped code
    # (deploy/recycle-container.sh, test/recycle-container.test.ts) that resolved to neither a
    # reservation ref nor a plan record. The hand lane's only id source, `rmd next-task-id`, prints
    # an id and reserves NOTHING by design, so a later mint handed the same number out as free and
    # nothing noticed until an open PR had to be renumbered.
    #
    # scripts/task-id-existence-check.mjs walks `src` and `deploy` — never `test`, whose ids are
    # synthetic fixture data — and fails on any `W1-T<n>` resolving to neither a `refs/rmd-id/*`
    # reservation ref nor a declared `- id:` plan record, against the written-reason baseline
    # scripts/task-id-existence-baseline.json. FALSIFIER: test/task-id-existence-check.test.ts.
    name: task-id-existence
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # W1-T2324: the collision half compares declared ids against `origin/main` AT CHECK TIME,
          # so that ref must exist. An unreadable base read as an empty one is the false zero that
          # produced the 2026-08-26 id collisions, so the gate REFUSES by design instead.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Task-id existence check (cited ids resolve; no id collides with main OR an open PR — W1-T3055 supplies the token that half needs; docs/forensics/task-id-existence-check.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run --silent task-id-existence:check -- --require-open-prs

  source-size:
    # SOURCE-SIZE ratchet — a per-file LINE ceiling, the same shape as the comment-load and
    # learnings-budget gates and for the same reason: something grew unnoticed. W1-T2488 built the
    # ceiling and nothing ever ran it; on a clean main at 6e31c5d2 `npm run source-size-ratchet` read
    # BLOCKED on seven files, up to +478 lines over. A recorded ceiling nothing enforces is dead
    # configuration that drifts, which is exactly what it had done.
    #
    # This job runs the ENFORCING `--baseline` mode; the separate `source-size-signal` script reports
    # growth of changed files and never fails. The gate refuses one thing: a baselined file whose
    # line count grew past its ceiling. A decrease is always accepted, and a PR that shrinks a file
    # re-captures the ceiling downward in the same diff.
    # FALSIFIER: test/source-size-baseline-is-enforced.test.ts.
    name: source-size
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Source-size ratchet (no baselined file grows past its recorded ceiling)
        run: npm run --silent source-size-ratchet

  comment-load-ratchet:
    # COMMENT-LOAD ratchet — a CEILING on comment volume, the same shape as the learnings-budget
    # and jscpd gates and for the same reason: something grew unnoticed. Measured on main at
    # ea02cc83: 87,888 comment lines against 101,007 code lines across the measured roots, 46.5%,
    # paid in context by every agent session that opens a file.
    #
    # It refuses two things and judges nothing else: a file whose comment-line count grew past
    # scripts/comment-load-baseline.json, and a newly ADDED comment block over 25 lines. The
    # written standard is docs/comment-standard.md.
    # FALSIFIER: test/comment-load-ratchet.test.ts.
    name: comment-load-ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The added-block half diffs against the merge base with `origin/main`, so that ref must
          # exist. Without it the base read fails and the gate REFUSES by design (an unreadable base
          # read as an empty diff is a false zero), reddening every PR rather than none.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Comment-load ratchet (no file grows past its ceiling; no added block over 25 lines)
        run: npm run --silent comment-load-signal

  main-ceiling-drift:
    # W1-T3068: push-only signal for absolute ceilings crossed by merged growth on main.
    # SIGNAL, NOT GATE: requiring this skipped-on-PR check would deadlock every PR.
    name: main-ceiling-drift
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Absolute ceilings, measured against main itself
        run: |
          # Each ratchet is run even if an earlier one fails, so one breach never hides another —
          # a first-failure exit would report one file and leave the rest unmeasured.
          rc=0
          run_gate() {
            gate="$1"
            shift
            echo "::group::${gate}"
            npm run --silent "$@" || { rc=1; echo "main-ceiling-drift: ${gate} BLOCKED on main itself"; }
            echo "::endgroup::"
          }
          run_gate source-size-ratchet source-size-ratchet
          run_gate learnings-budget-ratchet learnings-budget-ratchet
          run_gate claude-md-budget-ratchet claude-md-budget-ratchet
          run_gate comment-load-signal comment-load-signal -- --base HEAD^
          if [ "$rc" -ne 0 ]; then
            echo "main-ceiling-drift: main is past a recorded ceiling. No pull request is wrong — main is."
            echo "Every open PR touching a named file now inherits this and will report it as INHERITED."
            echo "TO FIX: record the ceiling the failing gate prints, in a PR of its own, and merge it first."
          fi
          exit "$rc"
