# Remudero CI — the green-merge gate (W1-T1B). Every PR needs this workflow's green result to
# merge, including the runner's own self-modifying PRs.
#
# INVARIANT 1 — a required check is named by the JOB NAME below, never by this file's name, and
# branch protection is armed with the name OBSERVED from the API after a first run. A typo'd
# context deadlocks merges forever.
#
# INVARIANT 2 — a required check that goes SKIPPED deadlocks merge just as hard (the synthwatch
# #102 class ci-gate.yml exists to avoid). Every job below therefore runs unconditionally: no path
# filter, and no job `if:` beyond an event guard (`github.event_name == 'pull_request'`) or an
# aggregator's `always()`. The two matrix jobs carry no `if:` at all, at job or step level, and
# scope themselves with shell guards instead; their shards collapse through the always-run
# aggregators `ci` and `coverage-ratchet`, whose two stable names are the only required contexts
# while the matrix checks still expose which shard failed.
#
# INVARIANT 3 — every job bounds its own runtime (W1-T1009). A LIGHT-band job sits at 10m,
# prophylactic: 13x the 46s maximum observed over 440 sampled job-runs of that class. The two
# Playwright-carrying HEAVY jobs derive their own bounds below.
#
# W1-T4406 — `merge_group` (the GitHub merge queue's own event, W1-T4405 made auto-merge
# queue-aware) is a THIRD trigger alongside `pull_request` and `push`. `coverage-ratchet` and
# `test-slow` already run their real work on any non-push event reaching their shell guards
# (`test-slow` carries no job-level `if:` at all — W1-T4396 — and already treats "not
# pull_request" as the full-suite lane), so both pick up `merge_group` for free: the merge queue's
# own synthetic commit gets the full instrumented suite AND the slow tier, on the exact tree that
# is about to land, with no separate wiring. `coverage-ratchet`'s few PR-scoped shell guards are
# widened (never replaced — pull_request keeps every byte of its existing, separately-tested
# behavior) to also treat `merge_group` as real work; see that job's own comments.
#
# Why: the measurements, incidents and design arguments compacted out of this file are archived
# verbatim in docs/forensics/ci-yml.md, per docs/comment-standard.md.
name: CI

on:
  pull_request:
  # W1-T1033: `ci` runs on main pushes; PR-only jobs below shell-skip or event-guard their work.
  # TRAP: `ci-gate.yml` must not gain this trigger; test/push-ci-on-main.test.ts pins why.
  push:
    branches: [main]
  # W1-T4406: the merge queue's own event — GitHub creates a temporary merge commit and runs every
  # workflow that declares this trigger against it before the queue lets a PR land. No `types:`
  # filter, for the same INVARIANT 2 reason `pull_request` and `push` above carry none.
  merge_group:

permissions:
  actions: read
  contents: read

# W1-T4406: ONE FLAG — the pull_request-time switch design note (iv) calls for, so flipping it (or
# reverting it) is a one-line, one-PR change. "0" until the W1-T4404 shadow record shows two weeks
# with no missed real failure: every existing pull_request behavior below stays byte-for-byte
# unchanged while it reads "0" (see the `ci` job's Test step, the one reader of this flag).
env:
  RMD_AFFECTED_SUITE_LIVE: "0"

# R-50: a force-push mid-run left the superseded PR run competing for the same CI-minute budget as
# its replacement, so group by PR number and let a PR's own runs cancel their predecessor.
#
# INVARIANT: `cancel-in-progress` is true only on `pull_request`. A push to `main` (or a
# `merge_group` run — W1-T4406, matched by the same `|| github.ref` fallback since it has no PR
# number either) groups by `github.ref` so those runs share one FIFO queue and are never
# cancelled — this is the lane running the full suite and the coverage aggregate against `main` or
# the queue's own merge commit, and cancelling a slower in-flight run would drop coverage data for
# a tree about to land.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  squash-trailer-gate:
    name: squash-trailer-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Refuse trailer credit added by any branch commit
        run: node --import tsx scripts/acceptance-author-gate.mjs --commit-trailer-only

  ci:
    name: ci-shard (${{ matrix.shard }}/8)
    # W1-T1033: no `if:` here — this matrix and its aggregator run on both triggers above.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # W1-T1009: HEAVY band. 35m/2100s sits in the gap between the longest observed non-hung run
    # (1637s) and the first observed hang (2647s). INVARIANT: it must stay strictly below
    # ci-gate.yml's WAIT_CAP_SECONDS (2400s), or ci-gate times out first and the misattribution
    # defect returns intact. Re-derive this if that cap is ever retuned (W1-T312).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `origin/main` must RESOLVE on the runner: test/recon-gaps-relayed.test.ts shells
          # `git show origin/main:src/run-task.ts` against the live checkout, and a shallow fetch
          # leaves no such ref. It self-clears on a re-run, so it reads as noise — it cost four CI
          # cycles across #1658, #1659 and #1677 in one day.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine Playwright's pinned browser version (cache key input)
        id: playwright-version
        run: |
          VERSION="$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # R-50: caches the downloaded browser binary only, keyed on runner OS plus the exact
      # playwright version pinned in package-lock.json, never a lockfile hash. No apt interaction.
      - name: Cache Playwright's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (W1-T153 shell a11y/responsive tests need a real headless browser — Lighthouse-equivalent axe-core scan, 390px/1440px no-hscroll, fleet-control read-back/STOP-confirm interaction)
        # NO `--with-deps`, and that is the whole fix: it is what invoked apt, and apt is what
        # failed. Measured on a green run, `--with-deps` installed nine FONT packages and no
        # browser dependency at all — every Chromium shared library is already in the runner image
        # — and no suite here needs those fonts.
        #
        # TRAP: no retry, no wait, no DPkg::Lock::Timeout. #2211's `wait_for_apt_lock` used
        # `flock`, which cannot observe apt's `fcntl(F_SETLK)` lock, and its `timeout` orphaned a
        # root-owned apt-get the runner user cannot signal. A retry cannot outlive a lock holder it
        # created and cannot kill; removing apt removes all of it.
        #
        # FALSIFIER: test/workflow-playwright-install.test.ts refuses `--with-deps` and every
        # retry/wait token in either install step.
        # Why: W1-T1027 filed it, W1-T1034 (#2223) measured it — docs/forensics/ci-yml.md.
        run: npx playwright install chromium
      - name: Typecheck
        # §5 TIER 2, quality gate 4/4 (W1-T98): this step is TS-strict's actual enforcement. A
        # strict-mode violation anywhere in src/**/test/** fails it and blocks merge via ci-gate.
        # TRAP: "0 violations" reads the same whether strict is genuinely wired or silently inert
        # (the neon-drift `_probe(x)` lesson). FALSIFIER: test/strict-probe.test.ts drives the real
        # `tsc` against scripts/strict-probe.ts, a permanently-broken probe deliberately excluded
        # from this step's own `-p tsconfig.json` scope.
        run: |
          if [ "${{ matrix.shard }}" != "1" ]; then
            echo "CI sharding: typecheck runs once on shard 1; shard ${{ matrix.shard }} skips the duplicate invocation."
            exit 0
          fi
          npx tsc -p tsconfig.json --noEmit
      - name: Determine this diff's fast-lane class (W1-T2428 — the `ci` half)
        # A deliberate second copy of the `coverage-ratchet` job's classify step, never a shared
        # output: `needs:` would chain two parallel jobs and cost more than the skip saves.
        # INVARIANT: the class comes from the real predicate — scripts/diff-class.mjs imports
        # `isInPlanScope` from src/lib/plan-architect.ts, so no bash respelling can drift and
        # silently skip a suite (W1-T2428, Q2). It fails closed twice over: the script resolves
        # anything unreadable to SOURCE, and this step clamps stdout to the three known tokens.
        # TRAP: this job also runs on a push, where every request-scoped context token is empty, so
        # no `run:` body here may name one (#3187). Falsifier: test/push-ci-on-main.test.ts.
        id: classify
        run: |
          # PUSH-SAFE BY CONSTRUCTION, and that is an INVARIANT not a preference:
          # test/push-ci-on-main.test.ts asserts no `run:` body in THIS job mentions
          # any request-scoped context token — this job also runs on a push to
          # main, where every one of them is empty. `coverage-ratchet` may use them (it is gated on
          # the event); `ci` may not. So the base comes from GITHUB_BASE_REF, a plain environment
          # variable set on a pull request and EMPTY on a push — exactly the discriminator needed,
          # without naming a forbidden token. `fetch-depth: 0` above guarantees the history for it.
          if [ -n "${GITHUB_BASE_REF}" ]; then
            # NO DEPTH-LIMITING FLAG (test/no-shallowing-of-the-canonical-checkout.test.ts,
            # W1-T2333): shallowing flags are forbidden on any git invocation under
            # .github/workflows/, and one here was also unnecessary — this job's own checkout
            # above already sets `fetch-depth: 0`, so the history is complete before this runs.
            # The ratchet scans TEXT, so this note names no flag literally either.
            git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt 2>/dev/null || : > changed-files.txt
          else
            : > changed-files.txt
          fi
          CLASS="$(node --import tsx scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T2428 fast-lane: this diff classifies as ${CLASS}."
          # W1-T4395: a diff under test/ only still runs its tests. test-only-run.txt holds "files" plus the
          # changed test files, or "full" (a helper, fixture or setup file changed), or nothing.
          : > test-only-run.txt
          if [ "$CLASS" = "SOURCE" ] && [ -s changed-files.txt ]; then
            node --import tsx scripts/diff-class.mjs --test-only-run --changed-files changed-files.txt > test-only-run.txt 2>>diff-class.log || : > test-only-run.txt
          fi
      - name: Test
        # W1-T255: routed through scripts/test-with-retry.mjs (`npm run test:ci`), not plain
        # `npm test`. A green run spawns the same command once; a red run retries it once and names
        # the first attempt's failing test on stdout, so a flake leaves a record instead of erasing
        # it on a manual re-run. `npm test` itself stays retry-free — Stryker re-runs it per mutant
        # (stryker.conf.json), where a retry would blur the kill signal.
        #
        # W1-T2428 fast lane: on a PLAN_ONLY/DOCS_ONLY diff, run only the suites such a diff can
        # fail, enumerated at run time by scripts/diff-class.mjs. It fails closed on the enumeration
        # as well as the class: any failure, and any empty result, falls through to the unmodified
        # `npm run test:ci`. The skip names itself in the log and in $GITHUB_STEP_SUMMARY, because a
        # silent 0-second green is the one defect this lane must not add.
        #
        # W1-T2597 TRAP: a killed or timed-out shard prints only the assertions it reached and never
        # node's trailing summary, so its failure set is a subset by construction yet reads
        # identically to a complete one. The block below makes that legible without changing whether
        # the job is red; it needs `tee`, `set +e` and `PIPESTATUS` under Actions' `-eo pipefail`.
        # Why: measured on PR #3542 — docs/forensics/ci-yml.md.
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          # W1-T4395: the coverage lane skips a test-only diff, so the changed tests run here, through the
          # same candidate lane as a plan/docs diff; a helper or fixture change runs the full suite.
          TEST_ONLY_RUN="$(head -n 1 test-only-run.txt 2>/dev/null || true)"
          case "$TEST_ONLY_RUN" in
            files) CLASS="TEST_ONLY" ;;
            full) ;;
            *) TEST_ONLY_RUN="" ;;
          esac
          TIER_BASE="HEAD"
          if [ -n "${GITHUB_BASE_REF}" ]; then
            TIER_BASE="origin/${GITHUB_BASE_REF}"
          fi
          # W1-T4406: ONE FLAG (this workflow's own top-level env; default "0"). Until the W1-T4404
          # shadow record earns the flip, this block never fires and a pull_request SOURCE diff
          # takes the unchanged W1-T3207 skip below, byte-for-byte. Flipped to "1", it runs the
          # live W1-T4404 selector (src/lib/affected-suites.ts — the SAME pure function `rmd
          # preflight` shares) instead of deferring to coverage-ratchet, which is the mechanism
          # that actually moves the run off every PR push. A fullRun verdict (a config, lockfile,
          # workflow or test-helper change the selector does not model) leaves CLASS untouched, so
          # it falls through to the ordinary full fast tier below, unmodified.
          if [ "$CLASS" = "SOURCE" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "$TEST_ONLY_RUN" != "full" ] && [ "${RMD_AFFECTED_SUITE_LIVE:-0}" = "1" ]; then
            node --import tsx -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const root = process.env.GITHUB_WORKSPACE || process.cwd();
              const changed = readFileSync(process.argv[1], "utf8").split("\n").map((l) => l.trim()).filter(Boolean);
              const mod = await import(root + "/src/lib/affected-suites.ts");
              const sel = mod.affectedSelectionOrFull(changed, () => mod.readAffectedSuitesInput(root, changed));
              writeFileSync(process.argv[2], sel.fullRun ? "full\n" : sel.suites.map((s) => s + "\n").join(""));
              console.log("W1-T4406: live selection for " + changed.length + " changed file(s) -> " + (sel.fullRun ? "FULL: " + sel.reasons[0] : sel.suites.length + " suite(s)"));
            ' changed-files.txt affected-suites-selected.txt || echo "full" > affected-suites-selected.txt
            if [ "$(head -n 1 affected-suites-selected.txt 2>/dev/null || true)" != "full" ]; then
              CLASS="AFFECTED"
            fi
          fi
          if [ "$CLASS" != "SOURCE" ]; then
            COUNT=0
            if [ "$CLASS" = "TEST_ONLY" ]; then
              SUITES="$(tail -n +2 test-only-run.txt)"
            elif [ "$CLASS" = "AFFECTED" ]; then
              # W1-T4406: the live selector's own suite list, run through the exact same
              # duration-balanced candidate-shard machinery the plan-reading lane below uses.
              SUITES="$(cat affected-suites-selected.txt 2>/dev/null || true)"
            else
              SUITES="$(node --import tsx scripts/diff-class.mjs --list-plan-reading-suites --changed-files changed-files.txt)" || SUITES=""
            fi
            if [ -z "$SUITES" ]; then
              if [ "${{ matrix.shard }}" = "1" ]; then
                echo "W1-T3191 fast-lane: candidate enumeration FAILED or was empty — shard 1 owns the FULL suite fallback."
                echo "- plan-reading shard summary: candidate_count=0, assigned_count=all, predicted_duration_ms=unknown, fallback=full-suite, shard=1/8" >> "$GITHUB_STEP_SUMMARY"
                npm run test:ci
                exit $?
              fi
              echo "W1-T3191 fast-lane: candidate enumeration FAILED or was empty — shard 1 owns the FULL suite fallback; shard ${{ matrix.shard }} does not duplicate it."
              echo "- plan-reading shard summary: candidate_count=0, assigned_count=0, predicted_duration_ms=0, fallback=full-suite-owner-1, shard=${{ matrix.shard }}/8" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              printf '%s\n' "$SUITES" > plan-reading-suites.txt
              COUNT="$(grep -c . plan-reading-suites.txt)"
              if node scripts/test-tier-manifest.mjs \
                --select-candidates plan-reading-suites.txt --shard ${{ matrix.shard }}/8 --base "$TIER_BASE" \
                > assigned-plan-reading-suites.txt 2> plan-reading-selector.log; then
                cat plan-reading-selector.log
              else
                cat plan-reading-selector.log
                echo "W1-T3191 fast-lane: candidate validation failed — taking the complete source-CI fallback."
                CLASS="SOURCE"
              fi
            fi
            if [ "$CLASS" = "SOURCE" ] && [ -n "$SUITES" ]; then
              echo "plan-reading shard summary candidate_count=${COUNT} assigned_count=0 predicted_duration_ms=0 fallback=source shard=${{ matrix.shard }}/8"
              echo "- plan-reading shard summary: candidate_count=${COUNT}, assigned_count=0, predicted_duration_ms=0, fallback=source, shard=${{ matrix.shard }}/8" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # PUSH-SAFE BY CONSTRUCTION. `GITHUB_EVENT_NAME` is set on EVERY trigger, so comparing it
          # against a literal is exactly the discriminator this job needs. The census polices
          # request-scoped context that is EMPTY on a push, and an always-set variable is not that;
          # see test/helpers/push-safety.ts for the list and why this token left it. (That file
          # names the tokens; this comment must not, because a comment inside a run body IS part of
          # the body the census reads.) It was briefly written as two adjacent string literals to
          # dodge the census by text, which is what prompted narrowing the rule instead.
          if [ "$CLASS" = "SOURCE" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "$TEST_ONLY_RUN" != "full" ] && [ "${RMD_AFFECTED_SUITE_LIVE:-0}" != "1" ]; then
            echo "W1-T3207: coverage-ratchet owns the single instrumented full-suite run; ci skips the quieter second harness on PR source diffs."
            echo "- W1-T3207: skipped the quieter ci test harness on SOURCE; coverage-ratchet owns the single instrumented full-suite run for this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CLASS" = "SOURCE" ]; then
            echo "CI sharding: class=SOURCE — running test shard ${{ matrix.shard }}/8."
            set +e
            # The manifest assigns the fast tier by cumulative recorded duration. The explicit
            # base means tests newly merged to main default fast without making this branch update
            # a ledger entry it did not introduce; a test introduced by this PR still refuses.
            RMD_TEST_DURATION_OUTPUT="${RUNNER_TEMP}/test-duration/shard-${{ matrix.shard }}.json"
            export RMD_TEST_DURATION_OUTPUT
            node scripts/test-with-retry.mjs \
              node scripts/test-tier-manifest.mjs --run fast --shard ${{ matrix.shard }}/8 --base "$TIER_BASE" \
              2>&1 | tee test-shard-output.log
            CODE="${PIPESTATUS[0]}"
            set -e
            if [ "$CODE" -ne 0 ] && ! grep -qE '^# tests [0-9]+' test-shard-output.log; then
              echo "::error::ci-shard ${{ matrix.shard }}/8 exited ${CODE} with NO node-test-runner summary ('# tests'/'# pass'/'# fail') anywhere in its output. A killed or timed-out run prints only the assertions it reached and no totals, so its failure set is a SUBSET BY CONSTRUCTION — this red is UNVERIFIED, not a diagnosed failure set (W1-T2597)."
              echo "- **W1-T2597: NO-SUMMARY SHARD** — ci-shard (${{ matrix.shard }}/8) exited ${CODE} with no trailing \`# tests\` summary. Its failure set is UNVERIFIED (truncated evidence), distinct from a shard that reported a complete, genuine failure set." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${{ matrix.shard }}" = "1" ]; then
              # W1-T3068: absolute ceilings can be crossed by a merge on main, after every PR stayed
              # under the per-PR ratchet. Measure them on main's push lane under the existing `ci`
              # check name, so no skipped push-only PR context is introduced.
              run_main_ceiling_gate() {
                gate="$1"
                shift
                echo "::group::main-ceiling-drift:${gate}"
                npm run --silent "$@" || {
                  CODE=1
                  echo "main-ceiling-drift: ${gate} BLOCKED on main itself"
                }
                echo "::endgroup::"
              }
              run_main_ceiling_gate learnings-budget-ratchet learnings-budget-ratchet
              run_main_ceiling_gate claude-md-budget-ratchet claude-md-budget-ratchet
              run_main_ceiling_gate comment-load-signal comment-load-signal -- --base HEAD^
              # W1-T3655: THE CENSUS WATCHES ITS OWN BASE. expiring-fixture-census otherwise only
              # rides `comment-load-ratchet`, a `pull_request`-only job (W1-T1033) -- so a fixture
              # stamp already sitting on `main` reddened every open PR beside it while no run was
              # ever charged with fixing it (MEASURED 2026-09-16: one main-branch stamp took
              # #5725, #5733, #5734, #5736, #5738 and #5739 red at once, each paying the same
              # diagnosis separately). It is not an `npm run` script, so it is invoked directly
              # rather than through `run_main_ceiling_gate` above. `CENSUS_MAIN_BRANCH_RUN=1`
              # forces the STRICT reading: on this lane `origin/main` IS the commit under test, so
              # reading it as an earlier base to inherit a crossing from would let a main-branch
              # bomb excuse itself on the one run that exists to catch it.
              echo "::group::main-ceiling-drift:expiring-fixture-census"
              CENSUS_MAIN_BRANCH_RUN=1 RMD_CI_REPORT=1 node scripts/expiring-fixture-census.mjs || {
                CODE=1
                echo "main-ceiling-drift: expiring-fixture-census BLOCKED on main itself"
              }
              echo "::endgroup::"
              if [ "$CODE" -ne 0 ]; then
                echo "main-ceiling-drift: main may be past a recorded ceiling or the test shard failed."
                echo "If a grouped ceiling above is BLOCKED, no pull request is wrong — main is."
                echo "TO FIX a blocked ceiling: record the ceiling the failing gate prints, in a PR of its own, and merge it first."
              fi
            fi
            # Stage FLAKE-RETRY evidence outside the checkout. The following upload uses
            # `always()`, so red shards remain observable without weakening the shard verdict.
            FLAKE_RETRY_DIR="${RUNNER_TEMP:-$PWD}/flake-retry"
            mkdir -p "$FLAKE_RETRY_DIR"
            grep -E '^FLAKE-RETRY:' test-shard-output.log > "$FLAKE_RETRY_DIR/shard-${{ matrix.shard }}.log" || : > "$FLAKE_RETRY_DIR/shard-${{ matrix.shard }}.log"
            exit "$CODE"
          fi
          ASSIGNED_COUNT="$(grep -c . assigned-plan-reading-suites.txt)"
          TOTAL="$(ls test/*.test.ts | grep -c .)"
          SUMMARY="$(grep '^test-tier-manifest: plan-reading shard summary ' plan-reading-selector.log)"
          echo "W1-T3191 fast-lane: class=${CLASS} — running ${ASSIGNED_COUNT} of ${COUNT} plan-reading candidates on shard ${{ matrix.shard }}/8 (${TOTAL} repository suites total)."
          echo "$SUMMARY"
          echo "- W1-T3191 fast-lane: ran **${ASSIGNED_COUNT} of ${COUNT}** candidates (${COUNT} of ${TOTAL} repository suites are in the conservative set); ${SUMMARY#test-tier-manifest: }" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' assigned-plan-reading-suites.txt >> "$GITHUB_STEP_SUMMARY"
          RMD_TEST_DURATION_OUTPUT="${RUNNER_TEMP}/test-duration/shard-${{ matrix.shard }}.json"
          export RMD_TEST_DURATION_OUTPUT
          set +e
          RETRY_SCRIPT="scripts/test-with-retry.mjs"
          node "$RETRY_SCRIPT" \
            node scripts/test-tier-manifest.mjs --run-candidates plan-reading-suites.txt --shard ${{ matrix.shard }}/8 --base "$TIER_BASE" \
            2>&1 | tee test-shard-output.log
          CODE="${PIPESTATUS[0]}"
          set -e
          if [ "$CODE" -ne 0 ] && ! grep -qE '^# tests [0-9]+' test-shard-output.log; then
            echo "::error::plan-reading shard ${{ matrix.shard }}/8 exited ${CODE} with no node-test-runner summary — the failure set is unverified (W1-T2597)."
            echo "- **W1-T2597: NO-SUMMARY PLAN-READING SHARD** — shard ${{ matrix.shard }}/8 exited ${CODE} with no trailing test summary." >> "$GITHUB_STEP_SUMMARY"
          fi
          FLAKE_RETRY_DIR="${RUNNER_TEMP:-$PWD}/flake-retry"
          mkdir -p "$FLAKE_RETRY_DIR"
          grep -E '^FLAKE-RETRY:' test-shard-output.log > "$FLAKE_RETRY_DIR/shard-${{ matrix.shard }}.log" || : > "$FLAKE_RETRY_DIR/shard-${{ matrix.shard }}.log"
          exit "$CODE"
      - name: Workflow guard mutation (W1-T3220 — a ci.yml skip guard that no test can distinguish turns a required check into a green no-op)
        run: |
          # NO EARLY `exit 0` IN THIS STEP, DELIBERATELY. The check below enumerates skip-shaped
          # guards — a conditional whose block reaches `exit 0` — so writing this step's own gate
          # that way would add a fourteenth guard demanding coverage for the privilege of running
          # the coverage check. An if/else costs one line and enumerates as nothing.
          #
          # SHARD 1 ONLY, AND ONLY WHEN THE WORKFLOW ITSELF CHANGED. The guard population cannot
          # move unless ci.yml does, and a full pass is ~4 minutes against ~1 minute with the
          # baseline in place (MEASURED 2026-09-08, 14 guards over 35 ci.yml-reading suites), so
          # running it four times on every PR would buy nothing at four times the cost.
          if [ "${{ matrix.shard }}" = "1" ] && grep -qxF ".github/workflows/ci.yml" changed-files.txt; then
            node scripts/workflow-guard-mutation-ratchet.mjs
          else
            echo "workflow-guard-mutation: not shard 1, or ci.yml is not in this diff — the guard population cannot have moved."
          fi
      - name: Upload this shard's flake-retry evidence (best-effort input to ci-required's per-test aggregator, W1-T2904)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-retry-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/flake-retry
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload this shard's duration evidence (structured Node test events, W1-T2904)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-duration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-duration
          retention-days: 1
          if-no-files-found: ignore

  # W1-T2904: flake-retry evidence, aggregated across every shard. INFORMATIONAL ONLY -- it writes
  # to the step summary and gates nothing, which is exactly why it may not live inside `ci-required`:
  # `scanner-gate-config` refuses `continue-on-error: true` anywhere in a job ci-gate REQUIRES, on the
  # ground that a required check which cannot report failure is not a gate at all. As its own job it
  # keeps the best-effort tolerance these steps need, runs on `always()` independently of the verdict
  # (so it no longer has to be ordered "before the exit 1"), and is registered ADVISORY in ci-gate.yml.
  flake-retry-aggregate:
    name: flake-retry-aggregate
    runs-on: ubuntu-latest
    needs: [ci, test-slow, coverage-ratchet] # W1-T4398: the coverage lane retries too
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      # Checkout must precede artifact downloads: actions/checkout cleans the workspace, so the
      # former order deleted every downloaded shard before either aggregator could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
      - name: Download every shard's flake-retry evidence (best-effort; a shard that recorded none still counts as present)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flake-retry-shard-*
          path: flake-retry-shards
      - name: Download every duration evidence artifact (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-duration-*
          path: test-duration-shards
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Aggregate flake-retry evidence per test (informational only — gates nothing)
        continue-on-error: true
        run: |
          node scripts/flake-retry-aggregate.mjs flake-retry-shards/*/*.log >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: Build a reviewed next-manifest proposal from duration evidence (never writes the checkout ledger)
        continue-on-error: true
        run: |
          mapfile -t DURATION_FILES < <(find test-duration-shards -type f -name '*.json' -print 2>/dev/null | sort)
          if [ "${#DURATION_FILES[@]}" -eq 0 ]; then
            echo "- W1-T2904: no complete duration evidence was available; no manifest proposal produced." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/test-tier-manifest.mjs --record-evidence "${DURATION_FILES[@]}" --output test-tier-manifest.next.json
            echo "- W1-T2904: attached a deterministic next-manifest proposal from ${#DURATION_FILES[@]} shard artifact(s)." >> "$GITHUB_STEP_SUMMARY"
            # W1-T3724: SAY WHETHER THE PROPOSAL IS WORTH LANDING, AND BY HOW MUCH. The proposal
            # has been built on every run since W1-T2904 and read by nobody, so the placeholder
            # population never fell and the shards packed 338 files as free. `--propose` exits 0
            # when the proposal would change a shard assignment or give a file its first real
            # measurement; the adopt below runs against a COPY, so this step reports the shift
            # without touching the tracked manifest — landing it is the gated PR this names.
            if node scripts/test-tier-manifest.mjs --propose --proposed test-tier-manifest.next.json --shard-count 8 >/dev/null 2>&1; then
              cp scripts/test-tier-manifest.json /tmp/manifest-before.json
              ADOPTED="$(node scripts/test-tier-manifest.mjs --adopt test-tier-manifest.next.json 2>&1 || true)"
              cp /tmp/manifest-before.json scripts/test-tier-manifest.json
              echo "- W1-T3724: the proposal is MATERIAL — ${ADOPTED}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- W1-T3724: the proposal is not material; no shard assignment would change." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Publish the next duration manifest proposal
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-tier-manifest-proposal
          path: test-tier-manifest.next.json
          retention-days: 7
          if-no-files-found: ignore

  ci-required:
    name: ci
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Collapse all test shards into the stable required check
        env:
          SHARD_RESULT: ${{ needs.ci.result }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO_SLUG: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          print_unfinished_test_from_logs() {
            if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GH_REPO_SLUG:-}" ]; then
              echo "  Last started unfinished test: unavailable (workflow run id is not present)."
              return 0
            fi
            LOG_FILE="$(mktemp)"
            if ! gh run view "$GITHUB_RUN_ID" --repo "$GH_REPO_SLUG" --log > "$LOG_FILE" 2>/dev/null; then
              echo "  Last started unfinished test: unavailable (could not read workflow logs)."
              return 0
            fi
            node - "$LOG_FILE" <<'NODE'
          const { readFileSync } = require("node:fs");
          const text = readFileSync(process.argv[2], "utf8");
          const active = new Map();
          let order = 0;
          for (const raw of text.split(/\r?\n/)) {
            const parts = raw.split("\t");
            const job = parts.length >= 3 ? parts[0] : "workflow log";
            let line = parts.length >= 3 ? parts.slice(2).join("\t") : raw;
            line = line.replace(/^\d{4}-\d\d-\d\dT\S+\s+/, "");
            const started = line.match(/^\s*# Subtest: (.+?)\s*$/);
            if (started) {
              active.set(job, { job, name: started[1], order: ++order });
              continue;
            }
            const finished = line.match(/^\s*(?:ok|not ok) \d+(?: - (.*?))?\s*$/);
            if (!finished) continue;
            const name = finished[1];
            if (!name) {
              active.delete(job);
              continue;
            }
            for (const [key, value] of active.entries()) {
              if (value.name === name) active.delete(key);
            }
          }
          const newest = [...active.values()].sort((a, b) => b.order - a.order)[0];
          if (newest) {
            console.log(`  Last started unfinished test: ${newest.name} (${newest.job}).`);
          } else {
            console.log("  Last started unfinished test: unavailable (no started-without-finished TAP test found).");
          }
          NODE
            rm -f "$LOG_FILE"
          }

          case "$SHARD_RESULT" in
            success)
            echo "ci: all eight test shards succeeded."
              ;;
            failure)
              echo "ci: a test shard FAILED (matrix result: failure) — open the shard log; this is a real break until that log says otherwise."
              exit 1
              ;;
            cancelled)
              # W1-T3345: a newer push means this sha is not the one that merges (a non-result); an
              # UNCHANGED head means a shard died at its ceiling: tests DID NOT run. Fails closed.
              CURRENT_HEAD=""
              if [ -n "${PR_NUMBER:-}" ]; then
                CURRENT_HEAD="$(gh api "repos/${GH_REPO_SLUG}/pulls/${PR_NUMBER}" --jq .head.sha 2>/dev/null || true)"
              fi
              if [ -n "$CURRENT_HEAD" ] && [ -n "${RUN_HEAD_SHA:-}" ] && [ "$CURRENT_HEAD" != "$RUN_HEAD_SHA" ]; then
                echo "ci: SUPERSEDED — this run measured ${RUN_HEAD_SHA}, the PR head is now ${CURRENT_HEAD}."
                echo "  The newer head runs its own shards and is what merge gates on, so this cancelled"
                echo "  run is a non-result rather than a failure. Not blocking."
                exit 0
              fi
              if [ -z "$CURRENT_HEAD" ]; then
                echo "::error::ci: the shard matrix was CANCELLED and the current PR head could not be"
                echo "  read — refusing, because an unreadable answer is not permission to pass an"
                echo "  unmeasured head. A cancellation is not by itself evidence of a test failure."
                echo "  Open the shard log."
                exit 1
              fi
              echo "::error::ci: SHARD HANG — the matrix was cancelled while the PR head"
              echo "  (${RUN_HEAD_SHA}) was unchanged, so nothing superseded it: a shard was killed at its"
              echo "  timeout-minutes ceiling. THE TESTS DID NOT RUN — this is NOT a failure of this"
              echo "  diff, and re-running the same sha will hang again: a cancellation is not by itself"
              echo "  evidence of a test failure."
              print_unfinished_test_from_logs
              exit 1
              ;;
            skipped)
              echo "ci: the shard matrix never ran (matrix result: skipped) — nothing was measured, so nothing is certified. Open the workflow run to see which upstream job gated it."
              exit 1
              ;;
            *)
              echo "ci: unrecognised matrix result '${SHARD_RESULT}' — refusing. A required check must never pass a state it does not understand."
              exit 1
              ;;
          esac

  test-slow:
    # W1-T2904: the SLOW tier, split out of the `ci` matrix's file-count sharding, which cannot
    # balance a suite where one file (test/run-task.test.ts, ~58s alone) sits wherever its hash
    # happens to land while most files finish in well under a second. `npm run test:slow` reads
    # scripts/test-tier-manifest.json's recorded per-file durations (never the file-count
    # heuristic) and runs exactly the files at or above its threshold. It is REQUIRED through
    # ci-gate before the fast shards may exclude those files. It registers on every pull_request
    # event (W1-T1033), so the required context is never silently absent.
    name: test-slow
    runs-on: ubuntu-latest
    # W1-T4396: no job-level if — the push lane runs the slow tier too. W1-T3207 skips it on a
    # SOURCE pull request, so without this the 107 slowest files ran on main nowhere at all. It is
    # its own job, so it never lengthens the fast shards' critical path.
    timeout-minutes: 35
    # W1-T2904 HEAVY BAND. `test-slow` carries a `playwright install` step because 9 of the 106
    # files at or over the manifest's 5000ms threshold are the Playwright-driven serve.* suites,
    # so it is a third Playwright-carrying job and must be banded like the other two rather than
    # left at the light-band 10-15m: under the observed non-hung tail a light bound kills honest
    # work. 35m is the derived heavy FLOOR, and it stays strictly below ci-gate.yml's
    # WAIT_CAP_SECONDS (2400s = 40m) so ci-gate never times out first and misattributes the hang.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Determine Playwright's pinned browser version (cache key input)
        id: playwright-version
        run: |
          VERSION="$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (the slow tier includes browser-backed console suites)
        run: npx playwright install chromium
      - name: Check every test file is tiered (W1-T2904 unwired-gate wiring — `test:tier:check` refuses an untiered file so the fast/slow split can trust scripts/test-tier-manifest.json before either tier runs)
        run: |
          # A push has no base branch; the tier check is a per-PR admission gate that main already passed.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            npm run --silent test:tier:check -- --base "origin/${GITHUB_BASE_REF}"
          fi
      - name: Establish whether the exact plan-reading matrix owns this diff (W1-T3191)
        id: plan-reading
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "class=PUSH" >> "$GITHUB_OUTPUT"
            echo "established=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt 2>/dev/null || : > changed-files.txt
          CLASS="$(node --import tsx scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY) ;;
            *)
              cat diff-class.log || true
              echo "established=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if ! node --import tsx scripts/diff-class.mjs --list-plan-reading-suites --changed-files changed-files.txt > plan-reading-suites.txt; then
            echo "established=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/test-tier-manifest.mjs \
            --select-candidates plan-reading-suites.txt --shard 1/8 --base "origin/${GITHUB_BASE_REF}" \
            > /dev/null 2> plan-reading-selector.log; then
            cat plan-reading-selector.log
            echo "established=true" >> "$GITHUB_OUTPUT"
          else
            cat plan-reading-selector.log
            echo "established=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the slow tier (scripts/test-tier-manifest.json's slow-tier files; none recorded yet still exits 0)
        run: |
          if [ "${{ steps.plan-reading.outputs.established }}" = "true" ]; then
            echo "W1-T3191: exact plan-reading matrix established — slow-tier files are already distributed across its eight shards; suppressing duplicate execution."
            echo "- plan-reading matrix established: test-slow registered successfully and suppressed duplicate execution" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.plan-reading.outputs.class }}" = "SOURCE" ]; then
            echo "W1-T3207: coverage-ratchet owns the single instrumented full-suite run; test-slow skips the duplicate slow-tier harness on source diffs."
            echo "- W1-T3207: skipped duplicate slow-tier execution on SOURCE; coverage-ratchet owns the single instrumented full-suite run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RMD_TEST_DURATION_OUTPUT="${RUNNER_TEMP}/test-duration/slow.json"
          export RMD_TEST_DURATION_OUTPUT
          if [ "${{ steps.plan-reading.outputs.class }}" = "PUSH" ]; then
            # W1-T4396: main's push lane. One bounded failed-file retry, as the fast shards get.
            echo "W1-T4396: push to main — running the slow tier."
            node scripts/test-with-retry.mjs node scripts/test-tier-manifest.mjs --run slow --base HEAD
          else
            npm run --silent test:slow -- --base "origin/${GITHUB_BASE_REF}"
          fi
      - name: Upload slow-tier duration evidence (structured Node test events, W1-T3302)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-duration-slow
          path: ${{ runner.temp }}/test-duration
          retention-days: 1
          if-no-files-found: ignore

  commitlint:
    # W1-T4399 — ~17 one-minute gates (commitlint, leak-grep, learnings-budget-ratchet,
    # jscpd-gate, dashboard, claims, assertion-discrimination, lint-plan, depcruise,
    # containment-probe, api-client-drift, no-hand-rolled-fetch, prompt-surface-gate,
    # task-id-existence, source-size, comment-load-ratchet, baseline-monotonic) used to be their
    # own job each — its own checkout, its own `npm ci`, its own rounded-up-to-a-minute runner.
    # Design: (i) they run here as STEPS with `continue-on-error: true`, sharing one checkout and
    # one `npm ci`, then the final step reports each step's outcome as its OWN check run, under
    # the exact name ci-gate.yml's REQUIRED list and branch protection already use (checks API) —
    # so no required context disappears. (ii) A gate with its own heavy setup (coverage-ratchet's
    # matrix, mutation-ratchet's Stryker cache) stays its own job, untouched below. (iii)
    # `continue-on-error` means one step failing never skips the next — every step below always
    # runs and always reports.
    name: commitlint
    # WHY THIS JOB KEEPS THE `commitlint` KEY rather than a new one, e.g. `light-gates`: adding a
    # genuinely NEW ci.yml job key would force a matching new entry in src/lib/ci-parity.ts
    # (test/preflight-ci-parity.test.ts asserts ci.yml's job list against that table in both
    # directions), and Standing rule 25 refuses a single PR editing that table beside the workflow
    # it mirrors. Expanding an EXISTING job key in place — this one — registers nothing new, so
    # ci-parity.ts needs no edit at all.
    #
    # The other 16 original job keys stay in this file too (see each below), under their ORIGINAL
    # names, permanently `if: false` rather than deleted or renamed — deleting one is the same
    # ci-parity.ts problem as above, and renaming one breaks a DIFFERENT invariant:
    # test/every-pr-check-is-required-or-advisory.test.ts derives every REQUIRED/ADVISORY entry
    # from a real job's `name:` and refuses one nothing derives. So THIS job's own check run is
    # ALSO still named "commitlint" (unchanged), same as every other stub below reuses its own
    # original name — meaning a skipped stub and this job's real, checks-API-posted result for
    # that same gate share one name on every PR. ci-gate.yml's own read already groups check runs
    # by name and keeps only the latest `started_at` (W1-T123, for the identical "a rerun leaves an
    # earlier attempt behind" case), unmodified, which is what resolves that duplicate: this job
    # needs real work first (checkout, `npm ci`, the gates themselves), so its post always lands
    # later than a stub's near-instant skip. `if: false` never queues a runner, so a stub costs
    # nothing at runtime.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # W1-T4399: to post each gate's own check run below.
      pull-requests: read # W1-T351: commitlint's `gh pr view` step needs this.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Determine this diff's fast-lane class (shared by every path-scoped gate below — see each original job's own comment, compacted to docs/forensics/ci-yml.md, for why each is scoped the way it is)
        id: classify
        run: |
          git diff --name-only HEAD^1...HEAD > changed-files.txt || : > changed-files.txt
          CLASS="$(node scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T3512 fast-lane: this diff classifies as ${CLASS}."
      - name: Install (clean, from lockfile)
        run: npm ci

      - name: rule-checks population (tree-derived census and ratchet suites, without coverage)
        id: rule-checks
        continue-on-error: true
        run: node --import tsx scripts/list-rule-suites.mjs --run

      - name: commitlint (the PR title — read LIVE via `gh pr view`, not the opened-event payload snapshot)
        id: commitlint
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          if [ -z "$PR_TITLE" ]; then
            echo "::error::commitlint: gh pr view returned an EMPTY title for PR #$PR_NUMBER -- this is an empty read (API/auth failure), distinct from a non-conventional title. Do not edit the title to fix this; investigate the gh call."
            exit 1
          fi
          printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.config.mjs --verbose

      - name: leak-grep (plaintext secret tripwire)
        id: leak-grep
        continue-on-error: true
        run: bash .github/scripts/leak-grep.sh

      - name: Knowledge budget ratchet (blocks a PR that pushes the active learnings corpus over the recorded cap)
        id: learnings-budget-ratchet
        continue-on-error: true
        run: npm run --silent learnings-budget-ratchet

      - name: CLAUDE.md size ratchet (blocks a PR that grows CLAUDE.md past the recorded cap, and refuses a net-positive diff per §8A)
        id: claude-md-budget-ratchet
        continue-on-error: true
        env:
          BASE_SHA: HEAD^1
        run: npm run --silent claude-md-budget-ratchet

      - name: jscpd-gate (duplication ceiling)
        id: jscpd-gate
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent jscpd

      - name: dashboard (typecheck, Vitest suite, console bundle build)
        id: dashboard
        continue-on-error: true
        run: |
          npm run --silent typecheck:dashboard
          npm run --silent test:dashboard
          npm run --silent build:console

      - name: claims (every plan/claims.yaml assertion must exit 0)
        id: claims
        continue-on-error: true
        run: npm run --silent claims

      - name: assertion-discrimination (comment-stripped re-evaluation of raw-text assertions)
        id: assertion-discrimination
        continue-on-error: true
        run: npm run --silent assertion-discrimination

      - name: lint-plan (rmd lint-plan, PR-changed tasks only)
        id: lint-plan
        continue-on-error: true
        run: npm run --silent lint-plan -- --base HEAD^1

      - name: dependency-cruiser fitness rules
        id: depcruise
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent depcruise

      - name: Cycle-count ratchet (blocks a diff that ADDS a dependency cycle; existing rings stay warn-only)
        id: cycle-ratchet
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent cycle-ratchet

      - name: containment-probe (test/containment.test.ts, only when the diff touches sandbox/hooks/env/deny-floor)
        id: containment-probe
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1...HEAD > changed-files.txt
          cat changed-files.txt
          node --import tsx .github/scripts/containment-diff-trigger.ts changed-files.txt
          MATCHED="$(grep '^matched=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          if [ "$MATCHED" = "true" ]; then
            node --test --import tsx --import ./test/setup/tmp-hygiene.ts test/containment.test.ts
          else
            echo "containment-probe: not required for this diff — no changed path touches sandbox/hooks/env/deny-floor."
          fi

      - name: api-client-drift (committed client must match a fresh regeneration from openapi/daemon.yaml)
        id: api-client-drift
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent api-client:check

      - name: no-hand-rolled-fetch (apps/**, packages/** except packages/api-client)
        id: no-hand-rolled-fetch
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent no-hand-rolled-fetch:check

      - name: prompt-surface-gate (requires golden evidence for prompt/learnings edits)
        id: prompt-surface-gate
        continue-on-error: true
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
          node --import tsx scripts/prompt-surface-gate.mjs --base "origin/${GITHUB_BASE_REF}"

      - name: task-id-existence (cited ids resolve; no id collides with main OR an open PR)
        id: task-id-existence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run --silent task-id-existence:check -- --require-open-prs

      - name: source-size (growth informs review and follow-up work; measurement failure still refuses)
        id: source-size
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent source-size-signal

      - name: Comment-load ratchet (no file grows past its ceiling; no added block over 25 lines)
        id: comment-load-ratchet
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent comment-load-signal

      - name: Expiring-fixture census (no fixture crosses its threshold inside the margin)
        id: expiring-fixture-census
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        env:
          RMD_CI_REPORT: "1"
        run: node scripts/expiring-fixture-census.mjs

      - name: Contract-coverage ratchet (no first-party route escapes the contract)
        id: contract-coverage-ratchet
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: node scripts/contract-coverage-ratchet.mjs

      - name: Console-parity ratchet (every verb maps to a route or a stated cli-only reason)
        id: console-parity
        if: steps.classify.outputs.class == 'SOURCE'
        continue-on-error: true
        run: npm run --silent console-parity

      - name: baseline-monotonic (no SCORE_TABLE floor/ceiling regresses against origin/main without a reviewed bumpRationale)
        id: baseline-monotonic
        continue-on-error: true
        run: node scripts/baseline-monotonic-check.mjs

      - name: Report each gate's result under its own required check-run name (checks API — W1-T4399 design (i))
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME_RULE_CHECKS: ${{ steps.rule-checks.outcome }}
          OUTCOME_COMMITLINT: ${{ steps.commitlint.outcome }}
          OUTCOME_LEAK_GREP: ${{ steps.leak-grep.outcome }}
          OUTCOME_LEARNINGS_BUDGET_RATCHET: ${{ steps.learnings-budget-ratchet.outcome }}
          OUTCOME_CLAUDE_MD_BUDGET_RATCHET: ${{ steps.claude-md-budget-ratchet.outcome }}
          OUTCOME_JSCPD_GATE: ${{ steps.jscpd-gate.outcome }}
          OUTCOME_DASHBOARD: ${{ steps.dashboard.outcome }}
          OUTCOME_CLAIMS: ${{ steps.claims.outcome }}
          OUTCOME_ASSERTION_DISCRIMINATION: ${{ steps.assertion-discrimination.outcome }}
          OUTCOME_LINT_PLAN: ${{ steps.lint-plan.outcome }}
          OUTCOME_DEPCRUISE: ${{ steps.depcruise.outcome }}
          OUTCOME_CYCLE_RATCHET: ${{ steps.cycle-ratchet.outcome }}
          OUTCOME_CONTAINMENT_PROBE: ${{ steps.containment-probe.outcome }}
          OUTCOME_API_CLIENT_DRIFT: ${{ steps.api-client-drift.outcome }}
          OUTCOME_NO_HAND_ROLLED_FETCH: ${{ steps.no-hand-rolled-fetch.outcome }}
          OUTCOME_PROMPT_SURFACE_GATE: ${{ steps.prompt-surface-gate.outcome }}
          OUTCOME_TASK_ID_EXISTENCE: ${{ steps.task-id-existence.outcome }}
          OUTCOME_SOURCE_SIZE: ${{ steps.source-size.outcome }}
          OUTCOME_COMMENT_LOAD_RATCHET: ${{ steps.comment-load-ratchet.outcome }}
          OUTCOME_EXPIRING_FIXTURE_CENSUS: ${{ steps.expiring-fixture-census.outcome }}
          OUTCOME_CONTRACT_COVERAGE_RATCHET: ${{ steps.contract-coverage-ratchet.outcome }}
          OUTCOME_CONSOLE_PARITY: ${{ steps.console-parity.outcome }}
          OUTCOME_BASELINE_MONOTONIC: ${{ steps.baseline-monotonic.outcome }}
        run: |
          set -euo pipefail
          # A `skipped` outcome (a fast-laned gate this diff cannot move) reports SUCCESS — the
          # native job it replaces also stayed green when its own fast-lane guard skipped the work.
          # A gate that used to be several steps of ONE job (learnings-budget-ratchet, depcruise,
          # comment-load-ratchet) still reports ONE check run: `report` takes every constituent
          # step's outcome and the check is success only when ALL of them are (the same AND the
          # native job conclusion computed before this task).
          report() {
            local check_name="$1"
            shift
            local conclusion="success"
            for outcome in "$@"; do
              if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
                conclusion="failure"
              fi
            done
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f "name=${check_name}" \
              -f "head_sha=${HEAD_SHA}" \
              -f "status=completed" \
              -f "conclusion=${conclusion}" \
              -f "output[title]=${check_name}" \
              -f "output[summary]=W1-T4399: reported by this job's ${check_name} step(s) (outcome(s): $*)" \
              >/dev/null
            echo "W1-T4399: reported ${check_name} = ${conclusion} (step outcome(s): $*)"
          }
          report "commitlint" "${OUTCOME_COMMITLINT}" "${OUTCOME_RULE_CHECKS}"
          report "leak-grep" "${OUTCOME_LEAK_GREP}"
          report "learnings-budget-ratchet" "${OUTCOME_LEARNINGS_BUDGET_RATCHET}" "${OUTCOME_CLAUDE_MD_BUDGET_RATCHET}"
          report "jscpd-gate" "${OUTCOME_JSCPD_GATE}"
          report "dashboard" "${OUTCOME_DASHBOARD}"
          report "claims" "${OUTCOME_CLAIMS}"
          report "assertion-discrimination" "${OUTCOME_ASSERTION_DISCRIMINATION}"
          report "lint-plan" "${OUTCOME_LINT_PLAN}"
          report "depcruise" "${OUTCOME_DEPCRUISE}" "${OUTCOME_CYCLE_RATCHET}"
          report "containment-probe" "${OUTCOME_CONTAINMENT_PROBE}"
          report "api-client-drift" "${OUTCOME_API_CLIENT_DRIFT}"
          report "no-hand-rolled-fetch" "${OUTCOME_NO_HAND_ROLLED_FETCH}"
          report "prompt-surface-gate" "${OUTCOME_PROMPT_SURFACE_GATE}"
          report "task-id-existence" "${OUTCOME_TASK_ID_EXISTENCE}"
          report "source-size" "${OUTCOME_SOURCE_SIZE}"
          report "comment-load-ratchet" "${OUTCOME_COMMENT_LOAD_RATCHET}" "${OUTCOME_EXPIRING_FIXTURE_CENSUS}" "${OUTCOME_CONTRACT_COVERAGE_RATCHET}" "${OUTCOME_CONSOLE_PARITY}"
          report "baseline-monotonic" "${OUTCOME_BASELINE_MONOTONIC}"

  leak-grep:
    # W1-T4399: this gate now runs as a step of the `commitlint` job above (see its own header
    # comment) — this job key stays registered, permanently skipped, under its original name.
    name: leak-grep
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 10
    steps:
      - run: echo "runs as a step of the commitlint job now — see W1-T4399"

  coverage-ratchet:
    # §5 TIER 2, quality gate 1/4 (W1-T25) — coverage never goes down.
    # scripts/coverage-ratchet.mjs compares this run's lcov totals against the recorded floor in
    # scripts/coverage-baseline.json and exits non-zero on any coverage-lowering PR; that floor
    # only ever ratchets up, by a reviewed bump, never down to make a red PR pass.
    #
    # W1-T212 (recon R-12): that aggregate floor is diff-blind by design, so new code with zero
    # covering tests merges freely while the codebase-wide aggregate holds. The "Diff coverage"
    # step below is a separate, diff-scoped check on the SAME job — sharing this job's
    # always-registers shape rather than adding a required context that could go absent — and
    # fails when the diff adds a source line lcov marks instrumented but never hit.
    name: coverage-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # W1-T1033: deliberately no `if:` here, at job or step level — test/diff-coverage.test.ts asserts
    # this job body carries none at all (the #729 discipline), so the job still registers on the push
    # trigger. Its collection step opens with a plain shell guard instead, and the staging step
    # uploads a skipped marker so every matrix child still yields a checkable artifact. A push HEAD is
    # no merge commit, so `HEAD^1` names its ordinary parent rather than a base side — the real work
    # must be skipped rather than run wrong (W1-T3060).
    # W1-T1009: HEAVY band. Unlike `ci`, this job runs the whole suite under
    # `--experimental-test-coverage`, and W1-T2430's measurement found every one of THIS job's
    # cancellations died on the `Test with coverage` step below, none on `npx playwright install` —
    # same band as `ci`, for its own reason and at its own number. The 39m/2340s ceiling holds until
    # real matrix runs establish a safe lower bound. INVARIANT: it must stay strictly below
    # ci-gate.yml's WAIT_CAP_SECONDS (2400s), or ci-gate times out first and the misattribution
    # defect returns intact; re-derive it if that cap is retuned (W1-T312).
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Determine this diff's coverage class (W1-T2428 — a PLAN_ONLY/DOCS_ONLY/TEST_ONLY diff cannot move source coverage)
        # INVARIANT: the class comes from the real predicate — scripts/diff-class.mjs imports
        # `isInPlanScope` from src/lib/plan-scope.ts. Two of the repo's three scope predicates
        # already disagree; a bash reimplementation here would be a fourth (W1-T2428, Q1). It fails
        # closed twice over: the script resolves an unreadable, empty or malformed input to SOURCE,
        # and this step clamps stdout to the four known coverage tokens, so even a bare Node invocation that
        # cannot start leaves CLASS=SOURCE. `plan-scope.ts` is a dependency-free leaf and Node 22.22.3
        # strips its type annotations, so this runs before npm ci. On a push, changed-files.txt is left
        # empty and the script's own empty-list rule resolves it to SOURCE.
        # TRAP: step-level bash, never a YAML `if:` — the class is READ by the bash guards below.
        id: classify
        run: |
          # W1-T4406: `merge_group` joins `pull_request` here — its own synthetic commit's first
          # parent is the target branch's tip, exactly like a PR's, so HEAD^1...HEAD is the diff
          # that is about to land, not a shallow guess.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            git diff --name-only HEAD^1...HEAD > changed-files.txt || true
          else
            : > changed-files.txt
          fi
          CLASS="$(node scripts/diff-class.mjs --coverage-class --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|TEST_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T2428 fast-lane: this diff classifies as ${CLASS}."
      - name: Validate the coverage test-tier manifest before spending a shard (W1-T2904)
        # A missing manifest row is a deterministic precondition failure, not a coverage result.
        # Check it immediately after classification so a newly added test cannot consume the
        # Playwright install or an instrumented shard before the real cause is reported. The
        # merge-base argument is essential: inherited omissions belong to main, while a row
        # introduced by this diff is the author's admission failure.
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping source coverage tier validation."
            exit 0
          fi
          node scripts/test-tier-manifest.mjs --check --base HEAD^1
      - name: Install (clean, from lockfile)
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping npm ci; coverage collection will emit the required skipped artifact."
            exit 0
          fi
          npm ci
      - name: Determine Playwright's pinned browser version (cache key input)
        id: playwright-version
        run: |
          VERSION="$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # R-50: the same cache as the `ci` job's identical step above — see that step for why it is
      # safe and what it is keyed on.
      - name: Cache Playwright's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (same requirement as the ci job — W1-T153's shell a11y/responsive tests launch a real headless browser; this job runs the same test/**/*.test.ts glob under coverage, so it needs it too)
        # The same step as the `ci` job's above, and the same measurement behind dropping
        # `--with-deps`. Fixing one copy and not the other left the second free to take the board
        # down alone — it did, PR #2150 five minutes after PR #2148. For SOURCE, the command stays
        # byte-identical to the `ci` job's; the class guard makes this required matrix child a no-op
        # before Playwright is available for PLAN_ONLY/DOCS_ONLY diffs.
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Playwright Chromium; coverage collection will emit the required skipped artifact."
            exit 0
          fi
          npx playwright install chromium
      - name: Test with coverage (spec output to the CI log, lcov to a file — src/** only, test/** excluded from the ratio)
        # W1-T220 defect 1: a `spec` reporter to stdout runs alongside the `lcov` reporter pair.
        # With `--test-reporter=lcov` alone, a failing run's CI log carried zero test output — just
        # "Process completed with exit code 1". The lcov artifact is unchanged.
        #
        # W1-T210 round 2 INVARIANT: `--enable-source-maps` is REQUIRED. Without it,
        # `--experimental-test-coverage` reports DA: positions against the tsx-transpiled JS, not
        # the .ts file named in `SF:` — `neutralizeFenceMarkers` at true line 1120 was reported at
        # 506. The aggregate ratchet tolerates that (it reads only totals), but diff-coverage.mjs
        # looks git-diff line numbers up directly in the DA: map and silently hits an unrelated
        # line, which blocked fully tested new code as uncovered.
        #
        # W1-T255's WHOLE-SUITE retry is gone from this job (the operator rulings of 2026-08-28 —
        # docs/forensics/ci-yml.md); W1-T4398's failed-file, uninstrumented retry replaces it.
        run: |
          # W1-T4406: `merge_group` widens this guard alongside `pull_request` — never replaces it;
          # every pull_request behavior below is untouched. The merge queue's own commit is the
          # exact tree about to land, so it earns the same real instrumented run a PR gets.
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || { echo "W1-T1033: coverage-ratchet only runs its real work on pull_request/merge_group; skipping the real test-with-coverage run on a ${GITHUB_EVENT_NAME} event (see this job's own comment above)."; exit 0; }
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Test with coverage (no src/**/test/** path in this diff, so coverage cannot newly move)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Test with coverage** (no src/**/test/** path in this diff)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # W1-T1217: `--import ./test/setup/tmp-hygiene.ts` is NOT optional here and its absence
          # was a real divergence, not a saving. The `ci` job runs this same
          # `test/**/*.test.ts` glob through `npm run test:ci`, whose script DOES carry that
          # flag; this step spelled the invocation out inline and omitted it — so the two
          # required jobs ran the same suite under different module sets. Everything the harness
          # provides (the tmp-dir reaper AND, since W1-T1217, the `GIT_CONFIG_*` pair that
          # disables git's background gc for every spawned git) was simply absent from the
          # coverage run. Any test asserting on that environment passes in `ci` and fails here,
          # which is exactly how this was found.
          # ── OPERATOR RULING 1 (2026-08-28): NO WHOLE-SUITE RETRY IN THIS JOB. ────────────
          # W1-T4398 narrows it: the retry below re-runs only the failed files. The ruling's case was
          # the whole-suite form, which re-ran EVERYTHING on any pass-1 failure, and the second pass
          # usually could not finish: of the
          # SIX two-pass `coverage-ratchet` runs on record, one completed red (2176s), ONE
          # COMPLETED GREEN (2159s), and FOUR were cancelled at 2355-2361s against the 2340s bound.
          # A cancellation names no test, so the retry converted a `failure` that named the failing
          # assertion into a `cancelled` that named nothing.
          #
          # WHAT THE NARROW RETRY GIVES UP: a failure that happens ONLY under instrumentation passes
          # its uninstrumented retry, so it reads as a recovered flake. It is never silent — the
          # step prints FLAKE-RETRY-RECOVERED and flake-retry-aggregate counts it.
          #
          # ── OPERATOR RULING 2 (W1-T3207, 2026-09-08): THIS IS THE TEST VERDICT NOW. ────────
          # The suite runs once per PR, under instrumentation, because coverage cannot be rebuilt
          # from the quieter harness. This gives up the second harness's independent signal: W1-T1041
          # measured 12 of 600 runs where one harness caught what the other missed. The operator
          # accepted that loss to remove the duplicated full-suite run.
          #
          # A STEP-LEVEL SHELL GUARD, NEVER A YAML CONDITIONAL AND NEVER A `paths:` FILTER.
          # test/diff-coverage.test.ts asserts this job body carries no line beginning with a YAML
          # conditional (the #729 skipped-check-deadlock discipline), and this job STAYS REQUIRED in
          # ci-gate's list — it must still register and still fail on a coverage regression. The
          # comment two blocks below is what makes artifact absence fail closed: no step in this job
          # carries a YAML conditional, so a failing shard makes the stable aggregator refuse.
          if ! node scripts/test-tier-manifest.mjs --select-all --shard ${{ matrix.shard }}/8 --base HEAD^1 \
            > coverage-test-files.txt 2> coverage-shard-selection.log; then
            cat coverage-shard-selection.log || true
            echo "coverage-ratchet: duration-balanced test selection failed; refusing to run a partial or unclassified coverage shard."
            exit 1
          fi
          cat coverage-shard-selection.log || true
          if ! grep -q . coverage-test-files.txt; then
            echo "coverage-ratchet: duration-balanced test selection returned no files; refusing an empty coverage shard."
            exit 1
          fi
          mapfile -t COVERAGE_TEST_FILES < coverage-test-files.txt
          mkdir -p coverage/raw
          set +e
          # W1-T4398: one bounded retry of the FAILED FILES, uninstrumented — never the whole suite,
          # which is what ruling 1 above removed. Pass one alone gets NODE_V8_COVERAGE and writes the
          # lcov, so the coverage figures are pass one's; a pass on retry is reported as a flake.
          node scripts/test-with-retry.mjs --coverage-first-pass coverage/raw \
            node --enable-source-maps --experimental-test-coverage --test-coverage-exclude="test/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=stderr \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            --test --import tsx --import ./test/setup/tmp-hygiene.ts "${COVERAGE_TEST_FILES[@]}" \
            2>&1 | tee "${RUNNER_TEMP}/coverage-test-output.log"
          TEST_EXIT="${PIPESTATUS[0]}"
          set -e
          FLAKE_RETRY_DIR="${RUNNER_TEMP}/flake-retry"
          mkdir -p "$FLAKE_RETRY_DIR"
          grep -E '^FLAKE-RETRY' "${RUNNER_TEMP}/coverage-test-output.log" > "$FLAKE_RETRY_DIR/coverage-shard-${{ matrix.shard }}.log" || : > "$FLAKE_RETRY_DIR/coverage-shard-${{ matrix.shard }}.log"
          # W1-T4404: the affected-suite selector in SHADOW. It records what it WOULD have run and, for
          # each file that really failed above, whether each selection had it. It runs after the
          # full suite, never changes what ran, and never changes this step's verdict.
          git diff -U0 HEAD^1...HEAD > "${RUNNER_TEMP}/affected.diff" 2>/dev/null || : > "${RUNNER_TEMP}/affected.diff"
          node --import tsx scripts/select-affected-suites.mjs --changed-files changed-files.txt \
            --diff "${RUNNER_TEMP}/affected.diff" --failed-from "${RUNNER_TEMP}/coverage-test-output.log" \
            || echo "W1-T4404: the shadow selector itself failed; nothing depends on it."
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "coverage-ratchet: the instrumented suite exited ${TEST_EXIT}. W1-T3207 makes this the surviving test harness; lcov/raw coverage are still checked before the shard fails."
            echo "- coverage-ratchet: instrumented suite exited **${TEST_EXIT}** — W1-T3207 makes this the surviving test harness; lcov/raw coverage were still checked before failing the shard." >> "$GITHUB_STEP_SUMMARY"
          fi
          # THE ONE THING THIS STEP STILL FAILS ON: no lcov. Without it the coverage gates below
          # have nothing to read, and a green job would then mean "coverage was never checked" —
          # exactly the vacuous pass this whole job exists to prevent. Absence is a real failure.
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage-ratchet: no lcov produced — the coverage gates below would have nothing to read. FAILING."
            exit 1
          fi
          if ! find coverage/raw -maxdepth 1 -type f -name 'coverage-*.json' -print -quit | grep -q .; then
            echo "coverage-ratchet: no raw V8 coverage produced — cross-shard branch identities could not be merged. FAILING."
            exit 1
          fi
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "coverage-ratchet: the single instrumented suite exited ${TEST_EXIT}; failing the PR from the surviving harness."
            exit "$TEST_EXIT"
          fi
          exit 0
      - name: Stage this coverage shard for the required-check aggregator
        run: |
          mkdir -p coverage-artifact
          printf '%s\n' "${GITHUB_EVENT_NAME}:${{ steps.classify.outputs.class }}" > coverage-artifact/class
          if [ -s coverage/lcov.info ]; then
            # The raw process reports were 514 MB for ONE shard on this PR's first live run.
            # Deduplicate repeated source maps locally while retaining every process boundary and
            # V8 range. The aggregator reconstructs those reports, then pinned Node maps and merges
            # every shard's bundle before assigning LCOV line/branch IDs.
            mkdir -p coverage/compact
            mkdir -p coverage-artifact/raw
            node --expose-internals scripts/coverage-merge-ratchet.mjs --compact-output coverage/compact coverage/raw
            cp coverage/lcov.info coverage-artifact/lcov.info
            cp coverage/compact/coverage-*.json coverage-artifact/raw/
          else
            echo "${GITHUB_EVENT_NAME}:${{ steps.classify.outputs.class }}" > coverage-artifact/skipped
          fi
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-artifact
          retention-days: 1
          if-no-files-found: error
      - name: Upload this coverage shard's flake-retry evidence (W1-T4398 — read by flake-retry-aggregate)
        # No YAML conditional (the #729 discipline above), so this runs only when the shard is
        # green — which is exactly when a recovered flake would otherwise leave no record. A red
        # shard names its failing test in its own log.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-retry-shard-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/flake-retry
          retention-days: 1
          if-no-files-found: ignore

  coverage-ratchet-required:
    name: coverage-ratchet
    runs-on: ubuntu-latest
    needs: [coverage-ratchet]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Require every coverage shard to produce an artifact
        env:
          SHARD_RESULT: ${{ needs.coverage-ratchet.result }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO_SLUG: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          print_unfinished_test_from_logs() {
            if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GH_REPO_SLUG:-}" ]; then
              echo "  Last started unfinished test: unavailable (workflow run id is not present)."
              return 0
            fi
            LOG_FILE="$(mktemp)"
            if ! gh run view "$GITHUB_RUN_ID" --repo "$GH_REPO_SLUG" --log > "$LOG_FILE" 2>/dev/null; then
              echo "  Last started unfinished test: unavailable (could not read workflow logs)."
              return 0
            fi
            node - "$LOG_FILE" <<'NODE'
          const { readFileSync } = require("node:fs");
          const text = readFileSync(process.argv[2], "utf8");
          const active = new Map();
          let order = 0;
          for (const raw of text.split(/\r?\n/)) {
            const parts = raw.split("\t");
            const job = parts.length >= 3 ? parts[0] : "workflow log";
            let line = parts.length >= 3 ? parts.slice(2).join("\t") : raw;
            line = line.replace(/^\d{4}-\d\d-\d\dT\S+\s+/, "");
            const started = line.match(/^\s*# Subtest: (.+?)\s*$/);
            if (started) {
              active.set(job, { job, name: started[1], order: ++order });
              continue;
            }
            const finished = line.match(/^\s*(?:ok|not ok) \d+(?: - (.*?))?\s*$/);
            if (!finished) continue;
            const name = finished[1];
            if (!name) {
              active.delete(job);
              continue;
            }
            for (const [key, value] of active.entries()) {
              if (value.name === name) active.delete(key);
            }
          }
          const newest = [...active.values()].sort((a, b) => b.order - a.order)[0];
          if (newest) {
            console.log(`  Last started unfinished test: ${newest.name} (${newest.job}).`);
          } else {
            console.log("  Last started unfinished test: unavailable (no started-without-finished TAP test found).");
          }
          NODE
            rm -f "$LOG_FILE"
          }

          case "$SHARD_RESULT" in
            success)
            :
              ;;
            failure)
              echo "coverage-ratchet: a coverage shard FAILED (matrix result: failure) — open the shard log; this is a real break until that log says otherwise."
              exit 1
              ;;
            cancelled)
              # W1-T3345: a newer push means this sha is not the one that merges (a non-result); an
              # UNCHANGED head means a shard was killed at its ceiling and the tests DID NOT run.
              # Fails closed. Falsifier: test/a-cancelled-shard-is-not-a-broken-diff.test.ts.
              CURRENT_HEAD=""
              if [ -n "${PR_NUMBER:-}" ]; then
                CURRENT_HEAD="$(gh api "repos/${GH_REPO_SLUG}/pulls/${PR_NUMBER}" --jq .head.sha 2>/dev/null || true)"
              fi
              if [ -n "$CURRENT_HEAD" ] && [ -n "${RUN_HEAD_SHA:-}" ] && [ "$CURRENT_HEAD" != "$RUN_HEAD_SHA" ]; then
                echo "coverage-ratchet: SUPERSEDED — this run measured ${RUN_HEAD_SHA}, the PR head is now ${CURRENT_HEAD}."
                echo "  The newer head runs its own shards and is what merge gates on, so this cancelled"
                echo "  run is a non-result rather than a failure. Not blocking."
                exit 0
              fi
              if [ -z "$CURRENT_HEAD" ]; then
                echo "::error::coverage-ratchet: the shard matrix was CANCELLED and the current PR head could not be"
                echo "  read — refusing, because an unreadable answer is not permission to pass an"
                echo "  unmeasured head. A cancellation is not by itself evidence of a test failure."
                echo "  Open the shard log."
                exit 1
              fi
              echo "::error::coverage-ratchet: SHARD HANG — the matrix was cancelled while the PR head"
              echo "  (${RUN_HEAD_SHA}) was unchanged, so nothing superseded it: a shard was killed at its"
              echo "  timeout-minutes ceiling. THE COVERAGE TESTS DID NOT RUN — this is NOT a failure of this"
              echo "  diff, and re-running the same sha will hang again: a cancellation is not by itself"
              echo "  evidence of a test failure."
              print_unfinished_test_from_logs
              exit 1
              ;;
            skipped)
              echo "coverage-ratchet: the shard matrix never ran (matrix result: skipped) — nothing was measured, so nothing is certified. Open the workflow run to see which upstream job gated it."
              exit 1
              ;;
            *)
              echo "coverage-ratchet: unrecognised matrix result '${SHARD_RESULT}' — refusing. A required check must never pass a state it does not understand."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards
      - name: Require downloaded coverage shard artifacts
        id: coverage-artifact
        run: |
          EXPECTED=""
          for SHARD in 1 2 3 4 5 6 7 8; do
            CLASS_FILE="coverage-shards/coverage-shard-${SHARD}/class"
            if [ ! -s "$CLASS_FILE" ]; then
              echo "coverage-ratchet: expected coverage-shard-${SHARD} artifact metadata; refusing a missing or partial artifact."
              exit 1
            fi
            VALUE="$(cat "$CLASS_FILE")"
            case "$VALUE" in
              # W1-T4406: merge_group:* joins the whitelist alongside pull_request:* — the classify
              # step above now computes a real class for a merge_group run too.
              pull_request:PLAN_ONLY|pull_request:DOCS_ONLY|pull_request:TEST_ONLY|pull_request:SOURCE|merge_group:PLAN_ONLY|merge_group:DOCS_ONLY|merge_group:TEST_ONLY|merge_group:SOURCE|push:SOURCE) ;;
              *)
                echo "coverage-ratchet: coverage-shard-${SHARD} carried unrecognised class metadata '${VALUE}'."
                exit 1
                ;;
            esac
            if [ -z "$EXPECTED" ]; then
              EXPECTED="$VALUE"
            elif [ "$VALUE" != "$EXPECTED" ]; then
              echo "coverage-ratchet: coverage shards disagree on fast-lane class (${EXPECTED} vs ${VALUE})."
              exit 1
            fi
          done
          EVENT="${EXPECTED%%:*}"
          CLASS="${EXPECTED#*:}"
          echo "event=${EVENT}" >> "$GITHUB_OUTPUT"
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
      - name: Merge raw V8 coverage shards before assigning LCOV branch indexes
        run: |
          # W1-T4406: merge_group widens this guard alongside pull_request (never replaces it).
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || { echo "coverage-ratchet: push event — no PR coverage merge required."; exit 0; }
          CLASS="${{ steps.coverage-artifact.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — no coverage shards were collected."
            exit 0
          fi
          for SHARD in 1 2 3 4 5 6 7 8; do
            RAW_DIR="coverage-shards/coverage-shard-${SHARD}/raw"
            if ! find "$RAW_DIR" -maxdepth 1 -type f -name 'coverage-bundle-*.json' -print -quit 2>/dev/null | grep -q .; then
              echo "coverage-ratchet: expected compact V8 coverage for shard ${SHARD}; refusing a partial merge."
              exit 1
            fi
          done
          mkdir -p coverage
          node --expose-internals scripts/coverage-merge-ratchet.mjs --output coverage/lcov.info \
            --shard-count 8 \
            coverage-shards/coverage-shard-1/raw coverage-shards/coverage-shard-2/raw \
            coverage-shards/coverage-shard-3/raw coverage-shards/coverage-shard-4/raw \
            coverage-shards/coverage-shard-5/raw coverage-shards/coverage-shard-6/raw \
            coverage-shards/coverage-shard-7/raw coverage-shards/coverage-shard-8/raw
      # INVARIANT (2026-08-13): Diff coverage runs BEFORE the aggregate ratchet. No step in this job
      # carries an `if:`, so a failing step skips every step after it — measured, in five of six
      # recent failing runs the ratchet concluded `failure` and `Diff coverage` was `skipped`, so the
      # only gate checking that a PR covers the lines it adds did not run at all. Ordering the
      # per-diff check first makes it independent without an `if:`, which `if: always()` would not
      # have preserved.
      - name: Compute this PR's base...head diff (for the per-diff coverage check below)
        run: |
          # W1-T4406: merge_group widens this guard alongside pull_request (never replaces it) —
          # its own synthetic commit IS a merge commit, so HEAD^1 resolves there too.
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || { echo "W1-T1033: coverage-ratchet only runs its real work on pull_request/merge_group; skipping on a ${GITHUB_EVENT_NAME} event — HEAD is no merge commit here and HEAD^1 would not resolve."; exit 0; }
          CLASS="${{ steps.coverage-artifact.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping the base...head diff computation (Diff coverage below has nothing to check)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Compute this PR's base...head diff**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff HEAD^1...HEAD > pr.diff
      # TRAP: RMD_CI_REPORT is set per-STEP on these two gate steps only, never at job level. The
      # collection step above runs the whole suite, and the diff-coverage and coverage-ratchet
      # suites spawn these same scripts over BLOCKING fixtures that inherit the job env — a
      # job-wide flag would publish those fixture failures as real check-run annotations.
      - name: Diff coverage (blocks a PR that adds untested source lines, even when the aggregate floor below stays green)
        env:
          RMD_CI_REPORT: "1"
        run: |
          # W1-T4406: merge_group widens this guard alongside pull_request (never replaces it).
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || { echo "W1-T1033: coverage-ratchet only runs its real work on pull_request/merge_group; skipping on a ${GITHUB_EVENT_NAME} event (no pr.diff was computed above)."; exit 0; }
          CLASS="${{ steps.coverage-artifact.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Diff coverage (no pr.diff was computed above; no src/**/test/** path in this diff to check)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Diff coverage**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/diff-coverage.mjs --lcov coverage/lcov.info --diff pr.diff
      - name: Coverage ratchet (blocks a PR whose branch coverage is below the absolute floor)
        env:
          RMD_CI_REPORT: "1"
        run: |
          # W1-T4406: merge_group widens this guard alongside pull_request (never replaces it).
          [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || { echo "W1-T1033: coverage-ratchet only runs its real work on pull_request/merge_group; skipping on a ${GITHUB_EVENT_NAME} event (no coverage/lcov.info was collected above)."; exit 0; }
          CLASS="${{ steps.coverage-artifact.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T2428 fast-lane: class=${CLASS} — skipping Coverage ratchet (no coverage/lcov.info was collected above; no src/** path in this diff can move the aggregate)."
            echo "- W1-T2428 fast-lane: class=${CLASS} — skipped **Coverage ratchet**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/coverage-ratchet.mjs --lcov coverage/lcov.info --baseline scripts/coverage-baseline.json
      - name: Stage the merged lcov for the coverage-merged artifact # W1-T2662, for W1-T2661's reader
        run: |
          mkdir -p coverage-merged-artifact
          if [ -s coverage/lcov.info ]; then
            cp coverage/lcov.info coverage-merged-artifact/lcov.info
          else
            echo "skipped" > coverage-merged-artifact/skipped
          fi
      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: coverage-merged-artifact
          retention-days: 1
          if-no-files-found: error

  mutation-ratchet:
    # §5 TIER 2, quality gate 2/4 (W1-T96) — green tests that kill no mutants are theatre; the
    # mutation score is the falsifier. scripts/mutation-ratchet.mjs compares this run's Stryker
    # report against scripts/mutation-baseline.json and exits non-zero on any test-suite-weakening
    # PR; that floor only ever ratchets up. FALSIFIER: test/mutation-ratchet.test.ts.
    #
    # SCOPE: Stryker has no per-mutant test filtering for `node --test`, and mutating the whole
    # src/** tree measured ~4 hours — past ci-gate's required-check wait ceiling, which would
    # deadlock every PR. `stryker.conf.json`'s `mutate` glob is therefore scoped to one pure-logic
    # module (src/lib/classify.ts); widening it is a one-line glob change plus a baseline recapture.
    #
    # LATENCY, two independent fixes here. (1) DIFF-SCOPED (W1-T108): the check run still registers
    # unconditionally, but the `trigger` step runs `mutation-ratchet.mjs --changed-files` — that
    # script's own path-filter mode, so mutate-scope lives in one place — and the Stryker run
    # executes only when the diff can move the score. (2) INCREMENTAL: the cache step below persists
    # Stryker's report across runs; its diff is a pure text comparison, so a report restored from
    # another branch is still correct, just less of a shortcut.
    #
    # W1-T133 TRAP: `commandRunner.command` was `npm test`, the full glob rerun per mutant, and blew
    # past 55 minutes. Only test/classify.test.ts and test/block-reason.test.ts import from
    # src/lib/classify.ts; scoping it to those two gave the SAME 108 valid mutants in 54 seconds.
    # Why: the full latency measurements are in docs/forensics/ci-yml.md.
    name: mutation-ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # W1-T1033: PR-only; see the `on:` block above.
    # W1-T1009: LIGHT band. This job installed Playwright until W1-T133 removed that step, so it
    # is not immune to the same stall class even though the measured hangs were elsewhere.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Determine this diff's fast-lane class (W1-T3512 — this job's own trigger step below already narrows to src/lib/classify.ts; this narrows further, to whether npm ci is worth paying at all)
        # Bare `node`, no --import tsx: scripts/diff-class.mjs imports the dependency-free
        # src/lib/plan-scope.ts leaf, so this classifies before npm ci (coverage-ratchet's pattern).
        # Fails closed twice: an unreadable/empty list resolves to SOURCE inside the script, and
        # this step's case clamp forces anything else to SOURCE too.
        # INVARIANT this relies on: `matched=true` below requires touching src/lib/classify.ts or
        # one of its two test files, all three outside plan scope and outside docs/, so CLASS is
        # always SOURCE whenever `matched` could be true — skipping npm ci here can never skip a
        # Stryker run the unmodified trigger step below would otherwise have started.
        id: classify
        run: |
          git diff --name-only HEAD^1...HEAD > changed-files.txt || : > changed-files.txt
          CLASS="$(node scripts/diff-class.mjs --changed-files changed-files.txt 2>diff-class.log)" || CLASS="SOURCE"
          case "$CLASS" in
            PLAN_ONLY|DOCS_ONLY|SOURCE) ;;
            *) CLASS="SOURCE" ;;
          esac
          cat diff-class.log || true
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          echo "W1-T3512 fast-lane: this diff classifies as ${CLASS}."
      - name: Install (clean, from lockfile)
        run: |
          CLASS="${{ steps.classify.outputs.class }}"
          if [ "$CLASS" != "SOURCE" ]; then
            echo "W1-T3512 fast-lane: class=${CLASS} — skipping npm ci; mutation-ratchet's own trigger step below can only match a src/lib/classify.ts diff, which this diff is not."
            echo "- W1-T3512 fast-lane: class=${CLASS} — skipped npm ci and the mutation trigger check (no src/** path in this diff)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm ci
      - name: Determine whether this diff can move src/lib/classify.ts's mutation score
        id: trigger
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1...HEAD > changed-files.txt
          cat changed-files.txt
          node scripts/mutation-ratchet.mjs --changed-files changed-files.txt
      - name: Restore Stryker incremental cache
        if: steps.trigger.outputs.matched == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ github.run_id }}
          restore-keys: |
            mutation-incremental-
      - name: Stryker mutation run (scoped target — see stryker.conf.json; this diff touches it, see trigger step)
        if: steps.trigger.outputs.matched == 'true'
        run: npx stryker run
      - name: Mutation ratchet (blocks a test-suite-weakening PR)
        if: steps.trigger.outputs.matched == 'true'
        # W1-T2707: `--ledger` is what makes the verdict emission a real production path rather
        # than a flag only tests pass. `resolveLedgerPath` is EXPLICIT-ONLY by design (an ambient
        # default once wrote 35 junk lines into an operator's real ledger), so without this the
        # emission resolves `unconfigured` on every genuine run and D-10 keeps counting a
        # population that is never produced. The write is fully contained -- it can never change
        # this job's exit code or its byte-for-byte stdout.
        run: node scripts/mutation-ratchet.mjs --report reports/mutation/mutation.json --baseline scripts/mutation-baseline.json --ledger "$GITHUB_WORKSPACE/state/ledger.ndjson"
      - name: Upload the mutation verdict ledger
        # Emitting into a path the runner discards would make the line above unobservable, which
        # is the failure mode this task exists to end. `always()` so a BLOCKING verdict -- the one
        # D-10 most wants counted -- is uploaded too, not only a passing one.
        if: always() && steps.trigger.outputs.matched == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-verdict-ledger
          path: state/ledger.ndjson
          if-no-files-found: ignore
          retention-days: 30

