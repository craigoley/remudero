  baseline-monotonic:
    # W1-T4399: this gate now runs as a step of the `commitlint` job above (see its own header
    # comment) — this job key stays registered, permanently skipped, under its original name.
    name: baseline-monotonic
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 10
    steps:
      - run: echo "runs as a step of the commitlint job now — see W1-T4399"

  ci-gate:
    # W1-T4400 — THE REQUIRED AGGREGATE, WITHOUT HOLDING A RUNNER. ci-gate.yml's pull_request job used
    # to start with this workflow and poll until every required check finished: a waiter billed for
    # the whole CI run. Here it is `needs:`-ordered after every other job in this file, so it starts
    # only when they have finished; the required checks from OTHER workflows had all ended by minute
    # 4 on every PR measured, so the step's own bounded wait loop is a formality. It runs ci-gate.yml's
    # aggregation step read from that file (scripts/ci-gate-from-contract.mjs) — one copy of the gate,
    # its REQUIRED list and its refusals. ci-gate.yml keeps only the `edited` re-aggregation.
    #
    # `always()` IS LOAD-BEARING: without it a failing needed job SKIPS this job, and GitHub counts a
    # skipped required check as passing. FALSIFIER: test/the-ci-gate-does-not-hold-a-runner.test.ts.
    #
    # W1-T4406: DELIBERATELY STAYS `pull_request`-only, unlike every job it `needs:`. This gate's
    # own REQUIRED list (ci-gate.yml) names ~26 checks, most of them ~17 one-runner gates the
    # `commitlint` job posts (commitlint, lint-plan, jscpd-gate, claims, ...) that are themselves
    # `if: github.event_name == 'pull_request'` and would never register on a `merge_group` commit
    # — so waiting on the full list there would time out and deadlock the queue on every entry
    # (the exact skipped/absent-required-check class INVARIANT 2 above exists to avoid). The merge
    # queue's own ruleset is expected to require the underlying check NAMES this file's `ci`,
    # `coverage-ratchet` and `test-slow` jobs already post unconditionally — not this aggregate —
    # exactly as W1-T4405's design note keeps `remudero-review` off the queue's own requirements.
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [squash-trailer-gate, ci, flake-retry-aggregate, ci-required, test-slow, commitlint, leak-grep, coverage-ratchet, coverage-ratchet-required, mutation-ratchet, learnings-budget-ratchet, jscpd-gate, dashboard, claims, assertion-discrimination, lint-plan, depcruise, containment-probe, api-client-drift, no-hand-rolled-fetch, prompt-surface-gate, task-id-existence, source-size, comment-load-ratchet, baseline-monotonic]
    if: ${{ always() && github.event_name == 'pull_request' }}
    # Light band. Its wait starts only after every ci.yml job has finished, so it covers stragglers
    # from OTHER workflows alone (all done by minute 4 on every PR measured): a 900 s WAIT_CAP_SECONDS
    # here, plus ci-gate.yml's 600 s grace window, still ends inside this bound — so the gate's own
    # named refusal always fires before the job is killed.
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      WAIT_CAP_SECONDS: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Aggregate sibling check results (ci-gate.yml's own step — fail only on a REAL failure)
        run: node scripts/ci-gate-from-contract.mjs
