name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # W1-T3725. Editing this list: scripts/** and .github/** stay OUT (both look like config,
    # both are code CodeQL reads), and push/schedule stay UNFILTERED (a skipped PR analysis is
    # sound only because the same commit is analysed on push to main). Both pinned by
    # test/a-plan-filing-does-not-pay-for-codeql.test.ts.
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "learnings/**"
      - "**/*.md"
  schedule:
    # Weekly, off-peak (Mondays 04:17 UTC — deliberately not on :00/:30).
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Explicit workflow — GitHub's *default* CodeQL setup is left OFF at the
# repo level (code-scanning/default-setup) because running both conflicts
# and leaves each unreliable (fleet lesson, MASTER-PLAN §5).
#
# W1-T4401 RE-VERIFIED THIS, rather than assuming the comment above still holds: `gh api
# repos/{owner}/{repo}/code-scanning/default-setup` reads `{"state":"not-configured", ...}` on
# 2026-09-24 — the default setup really is off, so there is no live second CodeQL analysis to
# retire today. Nothing here changes: ONE explicit workflow, ZERO default-setup duplicates,
# matching design (ii)'s "one CodeQL analysis, not two." If default-setup is ever turned back on,
# THAT is the moment to retire one of the two via gate-monotonic + a GATE_RATIONALE, not this PR.
#
# Least privilege at the top level (Scorecard TokenPermissions: a topLevel write
# permission scores worse than the identical permission scoped to job level, even
# though this workflow has only one job — W1-T66); the job below elevates only
# what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    # Cancel superseded runs of the same ref + language, but never cancel
    # in-flight runs of a different language.
    concurrency:
      group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    # R-50: this repo's PR-firing CodeQL runs complete in 1-2 minutes; 20m bounds a genuine hang
    # (e.g. a CodeQL database build stalling) with generous headroom.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # remudero orchestrates its own fleet of workflows — scan them too.
          - language: actions
            build-mode: none
          # Runtime artifact policy is executable Python, not workflow config.
          # Analyze it without importing or installing the candidate packages.
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality: security-extended queries + maintainability.
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

      - name: Export code-health measurement metadata
        if: github.ref == 'refs/heads/main'
        env:
          CODE_HEALTH_LANGUAGE: ${{ matrix.language }}
          CODE_HEALTH_SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          CODE_HEALTH_SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          node scripts/code-health-provenance.mjs --sarif-dir "$CODE_HEALTH_SARIF_DIR" \
            --config .github/codeql/codeql-config.yml --workflow .github/workflows/codeql.yml \
            --output code-health-quality.json
      - name: Retain code-health metadata without security results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-health-quality-${{ matrix.language }}
          path: code-health-quality.json
          retention-days: 14
          if-no-files-found: error
