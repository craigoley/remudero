name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # W1-T3725 — DO NOT ANALYSE JAVASCRIPT ON A DIFF THAT CANNOT CONTAIN ANY.
    #
    # MEASURED on #5891, a PLAN_ONLY pull request touching one file under plan/tasks.d/:
    #   WALL CLOCK 3.8 min — of which 3.8 was Analyze (javascript-typescript), the critical path.
    # Against 20.3 min for a code PR, so W1-T2428's fast-lane classifier in ci.yml is already
    # doing real work and the coverage shards correctly skip. What remained was CodeQL: a
    # SEPARATE workflow with no paths filter, which predates the classifier and never learned
    # about it. It is not a required check either, so it gates nothing while setting the wall
    # clock for every filing — and this fleet files many.
    #
    # ONLY SURFACES THAT CANNOT CARRY CODE. scripts/** and .github/** are DELIBERATELY absent: a
    # script or a workflow IS code CodeQL reads, and adding either is the mistake this shape
    # invites, because both merely LOOK like configuration. The task's own falsifier names it.
    #
    # THE SAFETY ARGUMENT, AND IT MUST HOLD: skipping a pull-request analysis is sound ONLY
    # because the same commit is still analysed on push to main, and the weekly scan still
    # sweeps the whole tree. Neither trigger below carries a filter, and a test asserts that
    # rather than trusting it.
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "learnings/**"
      - "**/*.md"
  schedule:
    # Weekly, off-peak (Mondays 04:17 UTC — deliberately not on :00/:30).
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Explicit workflow — GitHub's *default* CodeQL setup is left OFF at the
# repo level (code-scanning/default-setup) because running both conflicts
# and leaves each unreliable (fleet lesson, MASTER-PLAN §5).
#
# Least privilege at the top level (Scorecard TokenPermissions: a topLevel write
# permission scores worse than the identical permission scoped to job level, even
# though this workflow has only one job — W1-T66); the job below elevates only
# what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    # Cancel superseded runs of the same ref + language, but never cancel
    # in-flight runs of a different language.
    concurrency:
      group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    # R-50: this repo's PR-firing CodeQL runs complete in 1-2 minutes; 20m bounds a genuine hang
    # (e.g. a CodeQL database build stalling) with generous headroom.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # remudero orchestrates its own fleet of workflows — scan them too.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality: security-extended queries + maintainability.
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
