# plan/claims.yaml — the AWARENESS LAYER for prose (W1-T29, MASTER-PLAN §12A).
#
# Plan prose is unverifiable; a FALSIFIABLE claim with a command that must exit 0 is not. Every
# entry below is a fact the plan asserts ABOUT THE SYSTEM, paired with a shell command that proves
# it true right now. The `claims` CI job (.github/workflows/ci.yml) runs every assertion on every
# PR; a red claim means THE PLAN IS LYING ABOUT THE SYSTEM — caught in CI, naming the false claim,
# not by a human noticing months later. scripts/claims-check.mjs is the runner; its falsifier
# fixture (test/claims-check.test.ts) proves a broken assertion actually turns the job RED and
# names the failing claim, not just that the file parses.
#
# Schema per entry (the first four fields required, all strings; the fifth optional):
#   id:           stable slug — printed in the CI failure output, never reused for a different fact
#   claim:        the human-readable assertion the plan is making about the system
#   plan_section: where the claim is asserted in prose (MASTER-PLAN.md section or a docs/*.md file)
#   assertion:    a shell command (run via `sh -c` from the repo root) that MUST exit 0 iff the
#                 claim holds. Keep it cheap, offline, and deterministic — no network, no live
#                 GitHub state (a PR's default GITHUB_TOKEN cannot read branch-protection settings;
#                 see the merge-gate claim below), no wall-clock dependence.
#   precondition_paths (optional list of strings): every path (relative to the repo root) the
#                 assertion needs to exist before it can say anything true or false about the
#                 claim. When one is missing, scripts/claims-check.mjs (W1-T2215) reports the claim
#                 `could-not-run` WITHOUT ever spawning the assertion — never "the plan is lying".
#                 This matters most for a NEGATED assertion (`! grep ...`): grep exits 2 on a
#                 missing file, and `!` turns that 2 into 0, a silent false PASS with no
#                 diagnostic. Declaring the file here closes that fail-open hole. Most assertions
#                 below are third-party binaries (grep/test/node --test) whose exit codes this repo
#                 does not own, so this is the ONLY generalisable way to tell "could not run" from
#                 "ran and disagrees" — see W1-T2215's design note.
#
# Seeded (W1-T29) with the six claims named in this task's design note. One of those six —
# the merge-gate claim — had already DRIFTED by the time this file was written: the design note's
# literal wording was `[ci, remudero-review]`, but W1-T24 replaced the standalone `ci` context with
# the `ci-gate` aggregator (docs/review-gate.md, VERIFIED 2026-07-15; live-checked via
# `gh api repos/craigoley/remudero/branches/main/protection/required_status_checks` while authoring
# this file: `["remudero-review","ci-gate"]`). Seeding the stale wording would make this claims file
# lie on arrival — exactly the failure mode plan-claims exists to catch — so it is seeded with the
# CURRENT, correct fact instead (Standing rule 7: distrust the prompt over the installed version).

- id: worker-no-mcp-config
  claim: "Workers get NO MCP config (MCP auto-approves under bypass, so the surface stays zero) —
    spawnWorker's SDK Options and the worker settings template carry no MCP field at all."
  plan_section: "MASTER-PLAN.md §1 Architecture — four planes (Worker plane)"
  assertion: '! grep -rIiq "mcp" src/lib/worker.ts settings/worker.json'
  precondition_paths: ["src/lib/worker.ts", "settings/worker.json"]

- id: worker-env-strips-anthropic
  claim: "buildWorkerEnv strips every ANTHROPIC_* env var from the child process — a worker never
    inherits the operator's API key and always falls back to subscription OAuth."
  plan_section: "MASTER-PLAN.md §9 Resource doctrine — mounts, windows & context (FIELD FINDING 1,
    the billing boundary)"
  assertion: 'node --test --import tsx --test-name-pattern "strips ANTHROPIC_\* from a polluted parent env" test/env.test.ts'
  precondition_paths: ["test/env.test.ts"]

- id: tasks-yaml-never-machine-written
  claim: "plan/tasks.yaml is never machine-written — no writeFileSync/writeFile call anywhere in
    src/ or bin/ targets it; merge-state is DERIVED FROM GITHUB and only the Architect edits the
    file, via a plan-only human PR."
  plan_section: "MASTER-PLAN.md §13 Plan-sync: the in-repo PR flow (never scp again)"
  assertion: '! grep -rnE "writeFileSync\(|writeFile\(" src bin --include=*.ts --include=*.mjs --include=*.js 2>/dev/null | grep -i "tasks\.yaml"'
  precondition_paths: ["src", "bin"]

- id: default-budget-usd-100
  claim: "DEFAULT_BUDGET_USD is 100 — the runaway tripwire, not a work allowance."
  plan_section: "MASTER-PLAN.md §9 Resource doctrine — mounts, windows & context"
  assertion: 'grep -qE "^export const DEFAULT_BUDGET_USD = 100(\.0)?;" src/run-task.ts'
  precondition_paths: ["src/run-task.ts"]

- id: containment-fails-closed
  claim: "Containment fails closed: an unproven or silently-dropped sandbox BLOCKS the run (throws
    ContainmentError before any worker writes a byte) rather than allowing it — absence of an
    outside-cwd write is not itself proof; an OS denial must be OBSERVED."
  plan_section: "MASTER-PLAN.md §4A Workspace containment (fleet-wide)"
  assertion: 'node --test --import tsx test/containment.test.ts'
  precondition_paths: ["test/containment.test.ts"]

- id: merge-gate-required-contexts
  claim: "The merge gate's required status checks are [ci-gate, remudero-review] — the ci-gate
    aggregator (W1-T24) replaced the standalone ci context, so a skipped granular job can never
    deadlock a merge."
  plan_section: "docs/review-gate.md#required-contexts"
  assertion: 'grep -qF ''required_status_checks.contexts = ["ci-gate", "remudero-review"]'' docs/review-gate.md'
  precondition_paths: ["docs/review-gate.md"]

# Added by W1-T213 (RECON R-30): plan/claims.yaml's original six claims point at code/tests and,
# for prose, only at docs/review-gate.md -- README.md, CONTRIBUTING.md and the operator guide
# were entirely unguarded, and drifted from the code on four counts (the WS-stage claim, the
# required-check name, --repo coverage, and the operator guide's verb list). These four claims
# close that gap; test/docs-claims.test.ts's falsifier fixtures prove each one actually turns RED.

- id: docs-ws-stage-not-ws0-spike
  claim: "README.md does not claim the repo is still the WS-0 spike, or that run-task.ts becomes
    real in WS-1 -- WS-1 closed 2026-07-15 and run-task.ts is real, dispatched code today."
  plan_section: "README.md#whats-here-today"
  assertion: 'node --test --import tsx --test-name-pattern "README.md does not claim the repo currently contains the WS-0 spike" test/docs-claims.test.ts'
  precondition_paths: ["test/docs-claims.test.ts"]

- id: docs-required-check-name
  claim: "CONTRIBUTING.md names ci-gate, not bare ci, as the required aggregator status check --
    matching docs/review-gate.md and live branch protection."
  plan_section: "CONTRIBUTING.md#required-status-checks"
  assertion: 'node --test --import tsx --test-name-pattern "CONTRIBUTING.md names ci-gate \(not bare ci\) as the required aggregator check" test/docs-claims.test.ts'
  precondition_paths: ["test/docs-claims.test.ts"]

- id: docs-repo-flag-coverage
  claim: "docs/operator-guide.md documents the --repo flag, a real flag parsed by run-task.ts
    (resolveReviewTarget and the drain/daemon/sweep/fix call sites)."
  plan_section: "docs/operator-guide.md#the-commands-rmd-binrmd"
  assertion: 'node --test --import tsx --test-name-pattern "docs/operator-guide.md documents the --repo flag" test/docs-claims.test.ts'
  precondition_paths: ["test/docs-claims.test.ts"]

- id: docs-verb-coverage
  claim: "docs/operator-guide.md's command table names every verb in the COMMANDS registry
    (src/run-task.ts, W1-T47) -- derived from the registry so a verb added later is caught
    automatically instead of needing this task done again."
  plan_section: "docs/operator-guide.md#the-commands-rmd-binrmd"
  assertion: 'node --test --import tsx --test-name-pattern "docs/operator-guide.md.s command table covers every COMMANDS registry verb" test/docs-claims.test.ts'
  precondition_paths: ["test/docs-claims.test.ts"]

- id: docs-ci-gate-md-removed
  claim: "docs/ci-gate.md does not exist as a one-line CI-probe artifact masquerading as
    documentation -- its real content (the ci-gate aggregator mechanics) lives in
    docs/review-gate.md."
  plan_section: "docs/review-gate.md#ci-gate-aggregator-w1-t24"
  assertion: '! test -f docs/ci-gate.md'

# Added by W1-T387: CLAUDE.md told every author `rmd check-proof` was "the reviewer's own parser
# and executor" while it only ever shared the PARSER -- it ran its own hand-rolled exit-code check
# past that, which read a name-filtered proof resolving to a file but matching no real test title
# as a green PASS (measured: exit 0, hits 17) while the reviewer's own execWhitelistedProof, which
# reads the TAP stream rather than the exit code, reported no-match. Registering the correction as
# a claim (rather than only fixing the sentence) is the point: a future edit that reintroduces a
# second hand-rolled verdict path -- or that lets check-proof's OWN raw exit code decide the CLI's
# exit code again -- turns this claim red instead of silently drifting the plan back to lying.

- id: check-proof-collapsed-onto-review-executor
  claim: "rmd check-proof judges a proof's verdict by calling execWhitelistedProof, the SAME
    executor the reviewer runs at PR time -- not a second, hand-rolled exit-code check of its own
    -- so a name-filtered proof that resolves to a file but matches no real test title can no
    longer read GREEN locally while the reviewer judges it no-match."
  plan_section: "CLAUDE.md#writing-proofs-and-acceptance-criteria"
  assertion: 'node --test --import tsx --import ./test/setup/tmp-hygiene.ts --test-name-pattern "ACCEPTANCE #1: check-proof reports the SAME no-match verdict" test/check-proof-executor-parity.test.ts'
  precondition_paths: ["test/check-proof-executor-parity.test.ts"]

# Added by W1-T986 (fb-1785780032614-be23bf): CLAUDE.md's "Before you push" section prescribed a
# hand-rolled scoped-lcov + `git diff --cached` recipe instead of naming the shipped single entry
# point (`rmd preflight --ci-parity`, W1-T294) that shells CI's own commands -- the documented
# recipe diverged from ci.yml in coverage scope and diff base, and was measured reporting
# `diff-coverage: OK` over zero added lines. This claim is bidirectional so the correction cannot
# silently drift back in EITHER direction: red if CLAUDE.md stops naming the parity invocation,
# and red if the hand-rolled `diff-coverage.mjs --lcov` recipe reappears as the prescribed local
# check.

- id: local-gate-invocation-parity
  claim: "CLAUDE.md's 'Before you push' section documents the shipped `rmd preflight --ci-parity`
    entry point as the local pre-push check -- not a hand-rolled scoped-lcov + `git diff --cached`
    recipe that approximates CI rather than running it."
  plan_section: "CLAUDE.md#before-you-push"
  assertion: 'grep -qF "preflight --ci-parity" CLAUDE.md && ! grep -qE "diff-coverage\.mjs --lcov [^ ]+ --diff" CLAUDE.md'
  precondition_paths: ["CLAUDE.md"]

# Added by W1-T409 (the offline half of W1-T392's split): MASTER-PLAN.md's "## SHIPPED log"
# section and its not-shipped prose ("not shipped"/"unbuilt"/"did not ship") are two lists a
# machine can cross offline. W1-T149 shipped (PR #349) but the SHIPPED log entry was never
# written, and six retro cycles re-asserted it unbuilt before the drift was caught by hand -- this
# claim is the standing, self-consistency half of the gate that incident argues for (the other
# half, GitHub-truth re-derivation, is W1-T410's planStateTruthRung, out of scope for an offline
# claims.yaml assertion). It reuses W1-T410's extractAssertedUnbuiltTaskIds (src/lib/retro.ts)
# rather than re-deriving the not-shipped phrase extractor a second time.

# Added by W1-T2334 (fb-1786006232525-6d94d8): docs/operator-guide.md and the generated
# docs/cli-reference.md both promised verbs like `check-proof`/`emissions` were read-only, but
# `checkCliFreshness` (src/lib/self-sync.ts) runs BEFORE almost any verb's body and can
# fast-forward this checkout's `main` on a clean, behind, on-main checkout -- true about each
# verb's own body, false about the invocation, and `RMD_SELF_SYNC_DONE=1` (the provable escape
# hatch) appeared nowhere under docs/ outside docs/research/. This claim guards the fix so the
# guide cannot silently drift back to the unqualified wording.

- id: docs-fast-forward-escape-hatch
  claim: "docs/operator-guide.md names the CLI entry point's checkCliFreshness fast-forward
    (git merge --ff-only origin/main, before almost any verb's own body runs) and documents
    RMD_SELF_SYNC_DONE=1 as the idiom that keeps a verb the guide calls read-only provably so --
    derived from every COMMANDS registry verb that itself claims read-only-ness, so a verb added
    later is covered without redoing this task."
  plan_section: "docs/operator-guide.md#the-commands-rmd-binrmd"
  assertion: 'node --test --import tsx --test-name-pattern "docs/operator-guide.md names the entry-point fast-forward and documents RMD_SELF_SYNC_DONE=1" test/docs-claims.test.ts'
  precondition_paths: ["test/docs-claims.test.ts"]

- id: plan-state-claims-self-consistent
  claim: "MASTER-PLAN.md does not assert a task id BOTH shipped (the '## SHIPPED log' section, in
    either its long-form W<n>-T<n> or house-style compressed-pair T<n>/#<pr> notation) AND
    not-shipped (a 'not shipped'/'unbuilt'/'did not ship' line elsewhere) -- scripts/plan-state-
    claims.mjs names the id and both lines when it finds one."
  plan_section: "MASTER-PLAN.md §SHIPPED log"
  assertion: 'node --import tsx scripts/plan-state-claims.mjs'
  precondition_paths: ["MASTER-PLAN.md", "plan/tasks.yaml"]
