raw: "CLOSING fb-1785936728348-a9efd3 — STARVATION IS REFUTED, AND THE ERROR IS
  WORTH MORE THAN THE FINDING. That entry claimed the sweep never attempted
  #1344, #1346 and #1348 because they had zero sweep.post_review rows. Wrong:
  sweep.disposed carries 13,269 rows and writes a decision for EVERY PR EVERY
  TICK. #1344/#1346 read 'wait — checks pending 10m (< 60m ceiling)' on every
  pass, correctly, because review-before-green is not the lane's order.
  #1343/#1345 read 'dep-review' — dependabot has its own lane by deliberate
  filter, and the post-review rule's own comment says so. Nothing was skipped.
  THE ERROR: I queried the record of 'I ran a review' and read its emptiness as
  inattention, while the record of 'here is what I decided' sat full beside it.
  Absence in one step is not absence of the event when a sibling step carries it
  — the same class as reading the live ledger and missing 665 rotations. THE
  REAL CAUSE IS DIFFERENT AND OLDER: the sweep went TOTALLY BLIND from 13:08 to
  13:30 — zero dispositions for anyone, not a starved tail. #1348 opened and
  closed entirely inside that window, which is why it has no rows at all; it was
  never seen because NOTHING was. W1-T265's own doc records the identical
  failure at identical magnitude: 'went completely blind — 22 consecutive
  minutes with ZERO PRs dispositioned.' Second occurrence, same shape, nothing
  caught either. ORDERING IS NOT A DEFECT: the loop iterates every open PR
  unbounded, with no cap and no per-tick budget. WHAT REMAINS, and it should not
  inherit the starvation framing: an unattempted PR is already distinguishable,
  but A DOWN SWEEP IS NOT — a blind pass and a genuinely quiet fleet look
  identical. The one line that closes it is a per-pass heartbeat: a sweep.pass
  step carrying enumerated and dispositioned counts, WRITTEN BEFORE THE LOOP so
  it survives a throw inside it. Falsifying check: if some existing step already
  fires unconditionally per sweep pass, the heartbeat exists and the gap is that
  nothing reads it."
