raw: "Regression: privileged host/container operations can leave mutable Git
  administration paths root-owned even though the daemon runs as uid 1000.
  Observed root-owned origin remote-tracking ref and reflog blocked git fetch,
  which withheld daemon reviews; stale root-owned worktree metadata also caused
  reviewer worktree errors. Generalize post-recycle ownership and writability
  verification across mutable runtime state (ledger plus Git
  refs/reflogs/worktree metadata), preserve immutable objects and all history,
  and fail before admitting daemon work when a required mutable path is not
  writable by the runtime uid."
