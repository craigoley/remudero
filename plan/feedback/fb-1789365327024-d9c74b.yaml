raw: "Triage feedback#fb-1789349833277-20ca42 committed its proposal and
  feedback-link commits, pushed branch
  run-TRIAGE-fb-1789349833277-20ca42-1789365003724, and opened core PR #5494,
  but then its holder PID disappeared before ledger steps
  pr.opened/run.awaiting_external/claim release and left state/triage.lock
  wedged. Manual recovery proved PID absent, branch and PR persisted, then
  released only the stale lock. Make triage post-PR handoff crash-safe: persist
  terminal/handoff state before or atomically with the remote PR operation,
  recover/release a dead local lock without permitting concurrent ID minting,
  and test a process interruption immediately after remote PR creation. Do not
  drop remote claim ownership while the PR is genuinely awaiting CI."
