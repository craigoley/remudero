raw: "Daemon availability: a single worker whose retained stdout exceeds the
  1048576-byte budget terminates the whole daemon. Observed during recycle:
  W1-T3395 reported 1055334 bytes, daemon summary stopped error, and Docker
  restarted the service. Scope a repair that makes overflow a terminal per-run
  failure/refusal with retained diagnostic metadata and lock release, while the
  scheduler continues processing other work; prove an over-cap worker cannot
  terminate the daemon."
