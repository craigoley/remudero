raw: "PORTAL DATA-PLANE BLOCKER: PR #14 is intentionally draft. Its merged
  dependency app/api/console/summary/route.ts calls GET /fleet and GET /inbox
  and requires asOf plus fleet counts or decisions; Remudero main serves GET
  /v1/status (src/lib/board.ts) and GET /v1/inbox (src/lib/panel-graph.ts) and
  does not expose that shape. Before repairing or un-drafting #14, define a
  versioned, read-only portal summary contract and an integration fixture
  proving its exact payload, freshness and unavailable behavior. The transport
  must keep the browser away from the control origin: Vercel server only reaches
  an Azure-local read-only rmd serve surface through Cloudflare Tunnel plus
  Access service credentials; no write/control token in browser code, and
  actions stay disabled. This needs a linked core contract/transport task and a
  portal adapter task; do not guess endpoint names or payload fields again."
