summary:
  headline: Block new task-linter defects in plan-only PRs
  what_happened: "CI currently treats shared-proof and several call-site and
    proof-scope findings as warnings, so PR #6127 auto-merged despite
    substantive defects. Existing warnings on unchanged tasks are not
    diff-scoped for blocking."
  decision: Implement a changed-task-only guard that blocks these three
    diagnostics while preserving inherited warnings as nonblocking.
  options:
    - label: Implement bounded guard
      consequence: Prevents defective new or edited tasks from auto-merging without
        reopening historical warnings.
    - label: Keep warning-only policy
      consequence: Preserves current merge flow but leaves the incident’s failure path
        available.
    - label: Block all plan warnings
      consequence: Raises safety broadly but risks stopping unrelated PRs over
        inherited legacy findings.
