raw: "Lifecycle defect observed during an attempted graceful recycle on
  2026-09-13: deploy/recycle-container.sh wrote state/PAUSE at 12:56:55Z, but
  the daemon started a fix sweep at 13:00:47Z and selected workers at 13:01:13Z
  and 13:01:18Z. PAUSE is checked at the daemon outer loop and review-admission
  seam, but the already-running fix sweep can still admit workers, so recycle
  drain is non-convergent. A normal rmd resume then refused at its pre-command
  self-sync because a local pending feedback file had landed upstream and would
  collide. Build one scoped lifecycle repair: every task/sweep admission must
  honor the shared worker hold; recycle interruption/failure must clear only its
  attributable pause; and fleet-control resume must remain safe when checkout
  freshness cannot advance. Prove with deterministic tests that a PAUSE
  introduced after the outer loop starts prevents fix-sweep spawn, and that the
  abort/resume path never strands the fleet. Keep proof-registry work separate."
