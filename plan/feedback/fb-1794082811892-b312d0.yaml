summary:
  headline: Approve building a separate private consent path for offline model evaluation
  what_happened: Engineers want a new, separate consent receipt for private
    offline model evaluation, leaving the existing public field-trials consent
    unchanged. The user authorized building a separate fail-closed path with
    synthetic-only qualification; that chat authorization is not a native
    data-use receipt. No trusted secondary-use authority or resolver exists, so
    the real field-trials matrix stays NOT_RUN until approved authority and
    owner-provisioned data exist.
  decision: Record whether to approve building the separate private consent path
    with synthetic fixtures only; this decision never grants authority over
    private field-trials data or permits substitute private data.
  options:
    - label: Approve the build with synthetic fixtures only
      consequence: A native receipt and resolver are built and qualified on synthetic
        data; the real matrix stays NOT_RUN until an owner provides a receipt
        and real snapshot.
      intent: approve
    - label: Decline until the owner provisions a receipt first
      consequence: No new consent path is built now; work waits until the owner
        supplies the receipt and real inputs.
      intent: decline
    - label: Reframe the scope to reuse the existing consent path
      consequence: Private evaluation runs under the current public consent semantics,
        which may not cover the revocation and privacy boundaries required.
      intent: reframe
