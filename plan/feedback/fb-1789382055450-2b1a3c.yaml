raw: "Production smoke: /sign-in renders Clerk default text Want early access
  even though public copy must say Register interest. Cause: app/layout.tsx
  mounts ClerkProvider with no localization override; app/sign-in renders
  SignIn. Implement a server-side Clerk localization override using the
  documented signIn.start.actionText__join_waitlist and
  actionLink__join_waitlist keys so no deployed public Clerk-auth surface
  promises early access or a preview. Add a configured-runtime regression that
  exercises the rendered SignIn localization contract, not only app and waitlist
  source slices. Preserve real waitlist behavior and private-console
  authorization. Validate typecheck, unit tests, production build, and a browser
  assertion against the configured path with Clerk test credentials; do not use
  a real customer identity."
