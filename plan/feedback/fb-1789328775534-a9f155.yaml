raw: "RECYCLE/WORKER DEADLOCK: On 2026-09-13, W1-T3167 had a final REPORT in
  state/runs/W1-T3167-1789326639527.tail at 19:26:23Z and no child except socat,
  but its inflight lock remained. A targeted SIGINT caused the daemon to respawn
  Claude against the same completed task; deploy/recycle-container.sh then
  paused dispatch and could not safely advance because the lock host was the
  CURRENT running container. Design a single-owner terminal-reaping protocol:
  persist a machine-readable terminal receipt before cleanup; release or
  quarantine only the exact matching lock after final receipt plus no non-bridge
  child; never respawn a terminal run; make recycle recognize that terminal
  condition without deleting arbitrary locks. Prove with an integration fixture
  reproducing final receipt plus socket-only process, then verify recycle
  reaches the graceful docker-stop path and records the receipt/lock
  disposition."
