raw: "TWO IDIOM TRAPS THAT COST CI ROUNDS AND FALSE FINDINGS, both mechanical.
  (1) CLAUDE.md's max-id recipe grep -oE 'T[0-9]+' is CORRECT FOR MINTING and
  WRONG FOR DUPLICATE DETECTION: the plan carries 21 letter-suffixed ids
  (W1-T12a, W1-T1B, W1-T3F and others) which the numeric regex truncates to
  their stems, manufacturing EIGHT phantom collisions. Observed 2026-08-04
  during #1290. Anchoring on the whole token is the fix. The recipe's documented
  purpose is minting, so this is not a defect in it — it is a missing caveat
  about the second use, and the next reader will re-derive the same confusion.
  (2) COMMITLINT TITLE FIXES HAVE AN ORDERING REQUIREMENT NOBODY DOCUMENTS: an
  over-length PR title must be edited FIRST, then pushed. ci.yml uses on:
  pull_request with DEFAULT types, and 'edited' is not among them — so a title
  edit alone re-triggers nothing, while a push before the edit snapshots the old
  title via synchronize. Getting it backwards on #1287 cost two CI rounds.
  RECON: establish whether adding 'edited' to ci.yml's pull_request types is
  safe (it would re-run CI on every body edit, which may be costly at this merge
  rate), or whether the fix is a documented ordering rule in CLAUDE.md. Say
  which, with the CI-minutes cost of the first option at the current PR rate.
  Falsifying check: if ci-gate re-aggregates on a title edit through some other
  path, the ordering does not matter and only the id recipe needs its caveat."
