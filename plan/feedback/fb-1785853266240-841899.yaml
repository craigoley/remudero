raw: "TWO GRAMMAR/RULE GAPS FOUND WHILE FILING #1282, both mechanical and both
  will recur. (1) A NEGATIVE grep: PROOF IS UNSATISFIABLE BY CONSTRUCTION. A
  task whose criterion is an absence — 'MASTER-PLAN no longer claims two lanes'
  — cannot be proven by a grep: that must MISS after the change: a grep: proof
  that misses at review time is executed_fail, which overrides keyword coverage,
  so it would fail the very PR that satisfied it. The author caught this before
  shipping and rewrote both proofs as positives. Nothing in the grammar's
  documentation says an absence claim has no expressible proof. RECON: establish
  whether the dialect has ANY form for an absence (a grep: over a replacement
  string is the obvious workaround — assert what the text NOW says rather than
  what it no longer says), and if so document it; if not, say plainly that
  absence claims must be restated positively and where that belongs. Note the
  same attempt also produced a pattern containing ' in ', which the path regex
  splits on — a second trap in one proof. (2) plan-index.json STORES LINE
  NUMBERS, so ANY line-count change to MASTER-PLAN invalidates it — not just
  adding a ## heading, which is what CLAUDE.md's rule says. A two-line edit left
  the heading count at 38 and the index stale; regenerating reflowed 36 entries.
  The rule as written is narrower than the mechanism requires. Falsifying check:
  if the index is regenerated by a hook or a CI step rather than by hand,
  staleness self-corrects and only the rule's wording is wrong."
