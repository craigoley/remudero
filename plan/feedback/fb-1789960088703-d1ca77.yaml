raw: "Gap in the existing W1-T3884 analytics fix: core only returns the bounded
  console-v1 envelope when query parameter projectionVersion=console-v1, but
  hosted remudero-console calls /v1/analytics?projection=console-v1 and its
  normalizer expects a different timestamp/measurement/class vocabulary. File a
  paired core+console compatibility task: align the named query parameter,
  define one bounded redacted envelope contract, map
  provider_reported/provider-reported and field names deliberately, preserve
  legacy unversioned response, and prove an authenticated console request is
  <=128 KiB and renders typed data rather than Unavailable."
