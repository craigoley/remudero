raw: "Console daemon branch-reap safety scan is fail-open for repos without
  deploy/: planBranchReap calls git grep once over src/, scripts/, deploy/,
  .github/. In remudero-console, deploy/ is absent, git exits 128, the catch
  treats it as no source reference, and namedInSource becomes false even if src/
  would contain the branch. Observed repeatedly as fatal deploy/: no such path
  in remudero-console-daemon logs during UI-T55. Select only existing paths or
  distinguish exit 1 no-match from an execution error and fail conservatively;
  add a multi-repo regression test."
