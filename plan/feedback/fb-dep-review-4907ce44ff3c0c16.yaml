  Updates `opentelemetry-api` from 1.37.0 to 1.45.1
  <details>
  <summary>Release notes</summary>
  <p><em>Sourced from <a href="https://github.com/open-telemetry/opentelemetry-python/releases">opentelemetry-api's releases</a>.</em></p>
  <blockquote>
  <h2>Version 1.45.1/0.66b1</h2>
  <p>This is a patch release on the previous 1.45.0/0.66b0 release, fixing the issue(s) below.</p>
  <h3>Fixed</h3>
  <ul>
  <li><code>opentelemetry-api</code>: make <code>AnyValue</code> and <code>AttributeValue</code> explicit type aliases (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5703">#5703</a>)</li>
  <li><code>opentelemetry-sdk</code>: fix thread leak bug in resource initialization logic for long running resource detectors (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5706">#5706</a>)</li>
  <li><code>opentelemetry-exporter-otlp-proto-http</code>: restore <code>requests</code> as the default HTTP transport so proxy environment variables such as <code>HTTPS_PROXY</code> are honored again (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5714">#5714</a>)</li>
  <li><code>opentelemetry-api</code>: fix quadratic time parsing of the <code>tracestate</code> header and discard <code>tracestate</code> headers longer than 8192 characters (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5746">#5746</a>)</li>
  </ul>
  <h2>Version 1.45.0/0.66b0</h2>
  <h3>Added</h3>
  <ul>
  <li><code>opentelemetry-exporter-prometheus</code>: add support to configure Resource attributes as metric labels (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5122">#5122</a>)</li>
  <li>infra: add renovate (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5202">#5202</a>)</li>
  <li><code>opentelemetry-api</code>, <code>opentelemetry-sdk</code>: add support for extended attribute values everywhere. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5266">#5266</a>)</li>
  <li><code>opentelemetry-sdk</code>: wire the top-level <code>log_level</code> field in declarative configuration — when set, maps the OTel <code>SeverityNumber</code> value to a Python logging level and applies it to the <code>opentelemetry</code> logger so SDK internal diagnostics respect the configured severity. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5351">#5351</a>)</li>
  <li><code>opentelemetry-sdk</code>: add the new stable <code>AlwaysRecordSampler</code> (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5354">#5354</a>)</li>
  <li><code>opentelemetry-configuration</code>, <code>opentelemetry-sdk</code>: wire top-level <code>attribute_limits</code> into per-signal providers via declarative config; add <code>log_record_limits</code> support to <code>LoggerProvider</code> (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5365">#5365</a>)</li>
  <li><code>opentelemetry-exporter-otlp-json-http</code>: add OTLP JSON HTTP exporter package (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5374">#5374</a>)</li>
  <li><code>opentelemetry-api</code>, <code>opentelemetry-sdk</code>: add <code>enabled()</code> support to the Logger API, SDK, and <code>LogRecordProcessor</code> to let instrumentation skip expensive work when logging is disabled (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5380">#5380</a>)</li>
  <li><code>opentelemetry-exporter-otlp-json-file</code>: add OTLP JSON file Docker tests (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5412">#5412</a>)</li>
  <li><code>opentelemetry-configuration</code>: wire the experimental <code>tracer_configurator/development</code>, <code>meter_configurator/development</code> and <code>logger_configurator/development</code> fields into <code>create_tracer_provider</code>, <code>create_meter_provider</code> and <code>create_logger_provider</code>, so per-instrumentation-scope <code>enabled</code> overrides declared in the config file are applied to the provider (previously these fields were parsed but silently discarded). The logger <code>minimum_severity</code>/<code>trace_based</code> fields are not supported by the Python SDK and are ignored with a warning. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5418">#5418</a>)</li>
  <li><code>docs/examples</code>: add example on how to manually setup the SDK to get SDK metrics (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5449">#5449</a>)</li>
  <li><code>opentelemetry-docker-tests</code>: add Prometheus exporter docker tests (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5457">#5457</a>)</li>
  <li><code>opentelemetry-sdk</code>: count records dropped after shutdown on <code>otel.sdk.processor.{span,log}.processed</code> with <code>error.type=already_shutdown</code> (batch span/log and simple log processors), which the semantic conventions define as a valid value for this metric. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5509">#5509</a>)</li>
  <li><code>opentelemetry-semantic-conventions</code>: update semantic conventions to v1.44.0 (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5511">#5511</a>)</li>
  <li><code>opentelemetry-sdk</code>: add <code>host.id</code> to the host resource detector (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5653">#5653</a>)</li>
  <li><code>opentelemetry-test-utils</code>: add <code>CapturingSampler</code> to record what samplers receive in instrumentation tests (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5681">#5681</a>)</li>
  </ul>
  <h3>Changed</h3>
  <ul>
  <li>Enable <code>PIE</code> (flake8-pie) ruff rule and fix all violations (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5150">#5150</a>)</li>
  <li>The public <code>opentelemetry.util.types.AttributeValue</code> type in package <code>opentelemetry-api</code> is being expanded to include <code>None</code>, heterogeneous sequences of primitive types (and nested sequences) as opposed to only homogeneous primitive sequences, and Mappings of strings to any primitive types or sequences/mappings (which themselves must only contain primitive types or sequences/mappings validated the same way). If a <code>bytes</code> type is set as an attribute value in the SDK, it will no longer be utf-8 decoded to a string, instead it will be passed along as is in accordance with the OTEL spec, since <code>bytes</code> is a valid type in the OTLP proto. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5266">#5266</a>)</li>
  <li><code>opentelemetry-exporter-otlp-proto-http</code>: add a <code>max_request_size</code> argument to the OTLP HTTP exporters (traces, logs, metrics); serialized requests larger than the limit are dropped before sending, measured before compression. Defaults to 64 MiB (enabled); set to 0 to disable. Mirrors opentelemetry-go#8157. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5369">#5369</a>)</li>
  <li>[BREAKING] <code>opentelemetry-api</code>: subclasses of <code>Logger</code> need to implement the <code>enabled</code> method (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5380">#5380</a>)</li>
  <li><code>opentelemetry-exporter-otlp-proto-http</code>: refactor to use shared opentelemetry-exporter-otlp-common and opentelemetry-exporter-http-transport packages and switch default HTTP backend to urllib3 (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5389">#5389</a>)</li>
  <li><code>opentelemetry-sdk</code>: unify logging force_flush timeout defaults to 30000ms (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5438">#5438</a>)</li>
  <li><code>opentelemetry-python</code>: enable Ruff default ruleset and fix auto-fixable lint issues (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5491">#5491</a>)</li>
  <li><code>opentelemetry-sdk</code>: <code>SimpleSpanProcessor</code> now drops spans ended after <code>shutdown()</code> instead of passing them to the exporter, and counts them on <code>otel.sdk.processor.span.processed</code> with <code>error.type=already_shutdown</code>. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5512">#5512</a>)</li>
  <li>Bump pytest to 9.0.3 (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5518">#5518</a>)</li>
  <li><code>opentelemetry-exporter-otlp-proto-http</code>: clarify that the <code>endpoint=</code> kwarg requires the full signal path (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5633">#5633</a>)</li>
  <li><code>opentelemetry-sdk</code>: fix typos in SpanLimits docstring (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5658">#5658</a>)</li>
  </ul>
  <h3>Fixed</h3>
  <ul>
  <li><code>opentelemetry-configuration</code>: perform environment variable substitution on scalar values after parsing the configuration file, so <code>${VAR}</code> references inside comments and mapping keys are no longer substituted and undefined references in comments no longer abort loading (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5407">#5407</a>)</li>
  <li><code>opentelemetry-configuration</code>: declarative config environment variable substitution now replaces an unset variable that has no default with an empty value instead of raising an error, per the configuration spec. Resource attributes whose value resolves to null (an unset <code>${VAR}</code> with no default) are skipped with a warning instead of being inserted as a null value. (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5408">#5408</a>)</li>
  <li>'scripts/build.sh<code>: add </code>opentelemetry-configuration<code>and</code>opentelemetry-proto-json` to the package to release (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5425">#5425</a>)</li>
  <li><code>opentelemetry-sdk</code>: fix <code>View</code> instrument-name matching so a view configured with an instrument's real (mixed-case) name is applied; matching is now case-insensitive and platform-independent instead of relying on <code>fnmatch</code>'s OS-dependent case handling (<a href="https://redirect.github.com/open-telemetry/opentelemetry-python/pull/5430">#5430</a>)</li>
  </ul>
  <!-- raw HTML omitted -->
  </blockquote>
