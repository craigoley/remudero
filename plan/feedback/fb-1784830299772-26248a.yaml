raw: "AA16B6 ROOT CAUSE (follow-up): the npm-global claude symlink was rewritten
  2026-07-23T16:05Z to bin/claude.exe — an ASCII-text launcher with no exec bit
  — breaking every SDK spawn from ~16:14Z (in-flight workers survived; first
  logged draft_error 17:01Z). The SDK's 'musl/glibc' error text is a misleading
  canned diagnosis of EACCES-on-a-script. Suspected writer: the CLI auto-updater
  half-completing (observed version: <paste>, reinstalled to: <paste>). Confirms
  W1-T236's exact risk — its build should pin the binary path+version, disable
  or gate auto-update on this host, and add the spawn_binary_unlaunchable
  preflight naming the real errno."
attachments: []
origin: cli
status: accepted
proposal_pr: https://github.com/craigoley/remudero/pull/1932
summary:
  headline: Auto-updater overwrote spawnable binary; decide on build safeguards
  what_happened: On 2026-07-23 16:05Z, CLI auto-updater partially completed and
    overwrote the npm-global claude symlink with a non-executable script,
    breaking SDK spawns for ~45 minutes. Error messages blamed musl/glibc, but
    the real cause was EACCES (permission denied) on script execution.
  decision: "Implement three controls: pin binary path+version in build, disable
    or gate auto-update on this host, and add spawn_binary_unlaunchable error
    with real errno."
  options:
    - label: Implement all three safeguards
      consequence: Prevents recurrence; requires build change and deployment coordination.
    - label: Gate auto-updater immediately
      consequence: Mitigates risk fast; leaves binary management gap unresolved.
    - label: Add diagnostic error only
      consequence: Improves debugging; doesn't prevent binary corruption from auto-update.
