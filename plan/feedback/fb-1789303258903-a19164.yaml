raw: "Create an audited Azure Remudero artifact-retirement workflow after the
  isolated remudero-site supervisor/config migration is proven. Observed host
  facts: core remudero-daemon currently mounts /home/craigoleyagent/rmd-state2;
  its systemd and cron configuration name that root; legacy
  /home/craigoleyagent/rmd-state is an inactive directory containing only an
  empty state/ directory; remudero-site has its own protected
  /mnt/rmd/remudero-site-state; and remudero-site-daemon is intentionally exited
  after a STOP while the cross-repo proof-runner repair is pending, with no site
  systemd supervisor yet. Do not delete, move, prune, or relaunch any
  active/retained item in this task. First produce a per-artifact manifest with
  owner, retention reason, byte size, age, all references across active Docker
  mounts, fstab, systemd, cron, deploy scripts, and Git worktrees, plus an
  explicit non-live proof. Only then archive eligible artifacts to the data disk
  with a reversible receipt; delete only after the retention interval and a
  fresh reference census. The default-path/config inconsistencies must be
  resolved by the separate multi-repository supervisor task before retiring the
  old state root. Include positive controls proving the reference census sees
  live core and site state, and post-action checks proving neither daemon
  source/state mount nor control marker path changed."
