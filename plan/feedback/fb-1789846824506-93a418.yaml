raw: "Observed on remudero-console PR #819: a daemon ci-log repair created a
  verified Vercel config fix, but its synthetic PR task declared files: [], so
  harnessCommitForShellLessWorker called commitWorkerEdits and it
  deterministically refused at src/run-task.ts:32937. The repair stayed unpushed
  and CI remained red until a bounded operator recovery committed only
  vercel.json. Design and implement a safe self-repair path for synthetic PR
  fixes: it must never stage arbitrary worker edits, must record an attributable
  declared or policy-derived repair surface before commit, must reject any
  undeclared path, and must cover this exact no-files repair regression plus a
  malicious/stray-file falsifier. Include the normal fix dispatch, commit, push,
  and head-provider lifecycle proof."
