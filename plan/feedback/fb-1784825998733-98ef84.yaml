  pure over the injected MergedResolver (corrections-supreme deriveStatus by
  contract) — so either the injected resolver on this path is not the production
  derivation, or throttled/errored reads are being conflated with not-merged
  (the W1-T119 class). Evidence: [paste the exact inbox output + timestamp].
  Need: the resolver injection audited on both daemon and CLI paths, and
  throttled surfaced as throttled, never as unmet."
