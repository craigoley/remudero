  <h3>Bug Fixes</h3>
  <ul>
  <li><strong>core:</strong> prevent test runners racing to populate shared caches on startup (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6251">#6251</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/c931a93237816901f1e9f48da411170beeb3dfca">c931a93</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6250">#6250</a></li>
  <li><strong>instrumenter:</strong> crash when mutating ts non null expression in babel &gt;= 8 (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6221">#6221</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/e873a24ea7fe828a790a1b4e8c50bc46bbb3c99e">e873a24</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6185">#6185</a></li>
  <li><strong>vitest-runner:</strong> do not select tests whose name only starts with a filtered name (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6246">#6246</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/6ad4adbe21a30dcc1cdb4c22ab4304e02fe9d32e">6ad4adb</a>)</li>
  <li><strong>vitest-runner:</strong> report mutant collection failures instead of surviving mutants (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6269">#6269</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/cf5695e88fac6063dc0fc172f4443fa513cd85f0">cf5695e</a>)</li>
  </ul>
  <h3>Features</h3>
  <ul>
  <li>add opt-in mutation-phase test timing diagnostics with sidecar reporter (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/5866">#5866</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/201dce8efee34fa04e05b6474800a5d2fc8791d3">201dce8</a>)</li>
  <li><strong>core:</strong> cli option for command runner (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6006">#6006</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/aa7f3bb0a322eaaef4c626d3a491ed471c6e7be1">aa7f3bb</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/5153">#5153</a></li>
  <li><strong>core:</strong> report mutant <code>duration</code> in the mutation report (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6252">#6252</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/7284a4a20daca496e49dfb9e534a4d2be41d0c2e">7284a4a</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/5866">#5866</a> <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/5866">#5866</a></li>
  <li><strong>vitest-runner:</strong> report test locations (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6188">#6188</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/f2a49ff02437e3b7fe2682dba808ac93039895bf">f2a49ff</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6186">#6186</a></li>
  <li><strong>vitest-runner:</strong> support vitest pool options (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6268">#6268</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/3073ea2c4ef0402953347cff92db8f6b62d64de9">3073ea2</a>), closes <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6236">#6236</a> <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/5982">#5982</a> <a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6223">#6223</a></li>
  <li><strong>vitest-runner:</strong> support vitest v5 (<a href="https://redirect.github.com/stryker-mutator/stryker-js/issues/6214">#6214</a>) (<a href="https://github.com/stryker-mutator/stryker-js/commit/10e2cca959ea1e33fca94164186577b3074e7629">10e2cca</a>)</li>
  </ul>
