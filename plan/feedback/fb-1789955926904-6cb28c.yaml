raw: "Deployment freshness defect observed 2026-09-21: Build image (ACR)
  triggers only for deploy/Dockerfile, deploy/entrypoint.sh, or .dockerignore.
  Runtime source and policy changes do not build an image, containers run
  detached image trees, and write commands rightly refuse when origin/main
  advances. Define provenance-aware automation: build runtime-affecting changes
  automatically, handle plan-only updates without stale writes, expose image SHA
  versus origin SHA, and prove a daemon can accept feedback after a main merge
  without a manual recovery build or direct restart."
