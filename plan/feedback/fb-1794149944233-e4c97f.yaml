raw: "Production broker child-entry loader defect and planner no-verdict
  fallback. On current origin/main 7cac4f4f4f58d00d9c2a069eae5de6169cb6c9b8,
  launching src/gh-read-broker-client-main.ts with plain Node and no loader
  exits 1 with ERR_MODULE_NOT_FOUND for src/lib/gh-read-broker-client.js.
  ghBrokerClientSpawn in src/lib/gh-read-broker-client.ts forwards loader flags
  only from process.execArgv, which is empty in the bundled daemon; existing
  test/github/every-mac-session-reads-github-through-one-broker.test.ts passes
  only because its parent has tsx. This caused the active Mac fix-lane gardener
  to emit 12 inventory failures over 11h while the daemon stayed up.
  Reproduction recorded read-only; no daemon restart. Need a narrow plan task
  for a bundled/no-loader child entry plus real child-process broker and
  fallback coverage, without changing policy or gates. Also two `rmd plan
  --mode=create` attempts from the authorized writable operator checkout
  produced no recognized verdict and no PR; all reserved IDs were released.
  Improve durable routing so planner no-verdict outcomes retain evidence, owner,
  retry/fallback or follow-up route instead of ending with no actor. Keep these
  as separate task scopes if both warrant work. References: PR #17217 recovery
  report at
  /Users/craigoley/.codex/work-artifacts/remudero-pr17217/reports/Remudero PR
  flow reliability.md; source reproduction and gardener inventory failures
  confirmed 2026-11-08."
