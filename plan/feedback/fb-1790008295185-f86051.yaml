raw: "Inbox foundations: expose a bounded, authenticated thread-read contract
  for daemon/operator correspondence. Existing inbox-thread JSONL already
  preserves ordered escalation and reply messages, but it is not wired into
  production serve and no API returns thread summaries or messages. Add a
  verified read model for threads (stable id, subject/context, open or resolved
  state, latest activity, unread-safe message sequence, provenance) and a write
  path that appends a human reply to its existing thread with a durable receipt.
  Include daemon-originated follow-ups so a thread can show multiple alternating
  messages, not just a single escalation and answer. Preserve fail-closed
  unreadable-store semantics and keep all control credentials server-side. This
  is the dependency for the private console email-like inbox."
