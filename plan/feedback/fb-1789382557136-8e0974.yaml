raw: "Root planner incident: rmd plan --mode=create run
  PLAN-create-1789382437531 reserved W1-T3559 through W1-T3563 and created
  /home/node/Remudero/worktrees/run-PLAN-create-1789382437531 at origin/main,
  but produced no task shards, no plan PR, and no terminal plan success or
  failure ledger row. rmd peek reports FINISHED with no tail. A control-plane
  operation must never consume durable IDs then disappear. Add a terminal-state
  contract for every planner worker: durable started, succeeded with artifact or
  PR, or failed with classified cause and retry or reclaim-safe outcome; surface
  it through status without a broad paginated GitHub read failing the whole
  board. Prove an injected worker-spawn or output failure leaves no ambiguous
  reserved IDs and the operator can retry without duplicate or lost work."
