raw: "Instance registry bootstrap gap: recycle-container.sh --instance validates
  gh_app_id, gh_app_installation_id, gh_app_private_key_path, and
  max_old_space_mb but discards all four while deriving runtime settings. On a
  new instance with no outgoing container, first boot therefore refuses without
  manually supplied GH_APP_* values; after that bridge it launches with
  NODE_OPTIONS unset despite the registry heap. Make registry-selected first
  boot carry and validate those App settings and the heap into
  recycle-container, with tests proving a fresh instance needs no GH_TOKEN and
  gets its configured NODE_OPTIONS. Observed on console instance 2026-09-14; no
  personal token was used."
