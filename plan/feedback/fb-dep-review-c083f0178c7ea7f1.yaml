  # or
  pnpm add @anthropic-ai/claude-agent-sdk@0.3.314
  # or
  bun add @anthropic-ai/claude-agent-sdk@0.3.314
  </code></pre>
  <h2>v0.3.312</h2>
  <h2>What's changed</h2>
  <ul>
  <li>Added <code>autoMode</code>, <code>skipAutoPermissionPrompt</code>, <code>useAutoModeDuringPlan</code> and <code>permissions.disableAutoMode</code> to the <code>Settings</code> type</li>
