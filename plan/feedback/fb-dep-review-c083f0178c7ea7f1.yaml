  <h2>What's changed</h2>
  <ul>
  <li>Added <code>sandbox_required_unavailable</code> to <code>startup_failure_reason</code>, for the result Claude Code writes when a required sandbox cannot run</li>
  <li>Added <code>permissions.blockWritesOutsideWorkingDirectories</code> to the <code>Settings</code> type</li>
