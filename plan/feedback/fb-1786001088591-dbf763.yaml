raw: "THE CANONICAL CHECKOUT WAS SHALLOW AND NOTHING NOTICED UNTIL #1407 REFUSED
  — found 2026-08-06T07:16Z after a Mac mini reboot. git rev-parse
  --is-shallow-repository returned true and git log held 208 commits against a
  repo with 980. remote.origin.fetch is the normal refspec and there is no
  partial-clone filter, so the config did not cause it. THE ONLY REASON IT
  SURFACED is that #1407 (the lint-plan merge-evidence split, merged hours
  earlier) REFUSES to compute on a shallow clone by name rather than scanning —
  'truncated history would misread absent commits as absent evidence'. Without
  that guard the split would have silently reported a wrong number, which is the
  exact naked-zero shape P48 was ratified against. The guard earned itself on
  its first production run. WHAT IT SILENTLY DEGRADED WHILE SHALLOW: git log -S
  symbol archaeology, merge-base checks, git log --follow on docs, and the
  implementing-commit evidence several of this week's recons rested on — all of
  which would return plausible answers computed over 21% of history with no
  error. UNKNOWN: when it became shallow and what did it. Two candidates,
  neither confirmed, both new since yesterday — #1407's own test suite creates a
  real --depth 1 shallow clone to assert the refusal, and an operator npm ci
  recovery ran in this tree after the shared node_modules was emptied. Neither
  should touch the parent checkout. RECON: establish whether anything in the
  fleet or its test suites can shallow the canonical checkout, and whether a
  shallow state should be detected at daemon boot rather than only by one linter
  that happens to need history. Note the asymmetry: a shallow clone breaks READS
  silently and breaks nothing loudly, so detection must be proactive. Falsifying
  check: if the checkout was shallow from its original clone days ago, then
  everything above about a recent cause is wrong and the finding is only that
  nothing detected it for that long."
