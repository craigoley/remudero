raw: "Vercel blocked console PR #12 because the committed email
  remudero-worker@users.noreply.github.com cannot map to a GitHub account.
  Current production evidence: remudero-site daemon uses Craig Oley
  <craigoley@gmail.com> and deploys; remudero-console daemon uses the generic
  default; core entrypoint deploy/entrypoint.sh defaults
  RMD_GIT_AUTHOR_NAME/RMD_GIT_AUTHOR_EMAIL to the generic bot when unset.
  Generalize a per-target, explicitly configured commit identity with a
  non-placeholder GitHub/Vercel-verifiable preflight before dispatch. Preserve
  explicit automated attribution and do not disable/relax Vercel project
  collaboration checks. Test invalid identity refusal, valid per-target
  inheritance, and that a console preview from a new worker commit is not
  collaboration-blocked. Reconcile configuration only through the shipped
  graceful recycle path after a reviewed change lands."
