raw: "Fix isolated-repository rmd fix bootstrap. OBSERVED 2026-09-20 on
  remudero-console PR #1456: the sanctioned console daemon command rmd fix 1456
  --repo remudero-console refuses before dispatch with ENOENT opening
  <console-root>/settings/worker.json. The console owns .remudero/mounts.yaml
  but intentionally has no committed worker-template or hooks path; changing cwd
  to its checkout makes fix resolve the target as repoRoot while the running
  daemon source lives in /app. This leaves red console PRs unrecoverable by
  their daemon and encourages manual repair. Design a bounded source-root versus
  target-root contract for fix/sweep: a repository-owned sandbox template and
  hooks must be required and explicitly bootstrapable without credentials, or
  the installed daemon must retain its verified template without silently
  borrowing target state. Never fall back to arbitrary host paths or stage
  arbitrary edits. Add an end-to-end fake isolated target proof: rmd fix reaches
  its ci-log worker when the policy is present; its missing-policy refusal names
  the exact bootstrap remedy; a malicious stray file remains outside the
  declared repair surface. Cover the current PR #1456 missing-template
  regression and preserve per-repo credentials/topology boundaries."
