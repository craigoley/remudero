raw: "Recovery: preserve and classify untracked declared files before harness
  commit. API-T41 declared app/api/console/follow-ups/route.ts, but git
  porcelain reported its untracked parent directory app/api/console/follow-ups/.
  commitWorkerEdits treated the directory as undeclared, committed only the
  library and tests, and the PR failed typecheck because the tested route was
  absent. Add a bounded untracked-file expansion/snapshot step that resolves
  only files under declared surfaces, proves every resolved file is declared,
  stages exactly those files, and preserves/refuses ambiguous or out-of-scope
  artifacts. Cover a new untracked route file under a declared file path and a
  mixed declared/out-of-scope directory; the former must commit and the latter
  must remain uncommitted with explicit evidence."
