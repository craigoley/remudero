raw: "Observed on 2026-09-20: console task UI-T36 produced two open
  implementation PRs after a freshness handoff. #1484 carried an older head plus
  an out-of-scope CSS file and an in-flight review; #1491 was the later worker
  result based on the current plan and changed exactly the declared files. Add a
  semantic-supersession guard: when two open PRs carry the same canonical task
  trailer, prove newer branch ancestry and declared-file ownership, retain the
  newer canonical build, close or disarm only the older superseded PR with an
  attributable receipt, and never merge both. Preserve ambiguous pairs for human
  review; do not choose by timestamp alone."
