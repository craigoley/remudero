raw: "OBSERVED 2026-09-14: generated plan/retro PRs can be created with stale
  acceptance proofs that CI necessarily rejects. PR #5507 (run
  RETRO-1789375194129, plan-index regeneration only) fails proof-discrimination
  because its required proof grep: ^export function acceptanceAuthorTimeCheck in
  src/lib/review.ts passes unchanged at both its head 930118f and base 0f7afa8.
  This is not a PR-local code defect: the generated contract names source
  outside the diff. Add a pre-create validation to every autonomous PR-emission
  path (task, retro/plan filing, feedback landing where applicable) that
  resolves the task/contract at the intended head and runs proof discrimination
  against the planned base. It must refuse or repair the proposal before remote
  PR creation when a required proof is stale, out of scope, malformed, or cannot
  execute. Preserve an explicit escape only for a documented, measured baseline
  allowance; do not silently waive stale proofs. Add a regression test through
  the real emission adapter, not only the pure checker."
