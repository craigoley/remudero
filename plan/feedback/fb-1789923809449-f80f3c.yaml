raw: "Observed live: feedback landing branches are intentionally ephemeral and
  GitHub deletes them after merge, but landPending and its lease-rebuild call
  git fetch origin --quiet without --prune. A stale local
  origin/feedback-landing ref is then treated as live pending content; the
  calculated --force-with-lease expects its deleted SHA, the remote correctly
  rejects it as stale, and every subsequent sweep repeats forever. Require the
  landing reader to reconcile deleted landing refs before deriving the lease;
  prove a branch fetched locally, deleted remotely, then retried lands the
  preserved record with an absent-ref lease. Preserve the existing refusal when
  a branch that actually still exists is unreadable, and never weaken
  compare-and-swap for a live tip. Live controller evidence: repeated failures
  through 16:58Z with expected 8e4b9d..., remote ref absent; one git fetch
  --prune repaired the state and the 17:02Z normal sweep landed PR 6226."
