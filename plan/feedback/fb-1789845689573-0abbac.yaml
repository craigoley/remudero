raw: "Improve the private console analytics information architecture after live
  evidence from authenticated app.remudero.com on 2026-09-19. The current page
  renders seven equal Trend cards, but only five have ledger-backed historical
  sources. queue.pending and provider.allowance.remaining are current live
  signals and must not be presented as failed historical charts. Implement a
  desktop-and-phone-first redesign that: keeps all seven scalar decision cards
  with source/as-of; shows only retained historical series in Trends; moves
  live-only queue and provider readings into a compact Current signals surface
  with an honest awaiting-history state; makes absent outcome/work-category
  breakdowns a concise source-backed empty state rather than a large grid of
  unavailable cards; retains URL filter and drilldown semantics; preserves
  stale, unauthorized, unavailable, and not-collected distinctions; validates at
  a phone viewport and desktop with Playwright. Coordinate with core task
  successors to W1-T3802, W1-T3804, W1-T3805, but do not fabricate data or block
  on their landing."
