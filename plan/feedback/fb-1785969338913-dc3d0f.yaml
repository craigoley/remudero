summary:
  headline: Feedback files duplicate; confirmation message is false
  what_happened: Two operator clicks filed two identical entries, but the banner
    falsely claimed 'nothing filed yet—review and confirm.'
  decision: Disable console-feedback writes until the confirmation button actually
    controls whether data files.
  options:
    - label: Disable immediately
      consequence: Stops silent duplicates now; feature offline until full fix with
        working confirmation is deployed.
    - label: Deploy deduplication today
      consequence: Prevents exact duplicates via server-side nonce but false
        confirmation remains; plan full fix for next sprint.
    - label: Fast-track confirmation fix
      consequence: Solves root cause but feature stays live with known defect until
        deployed; manual cleanup may be needed.
