  without an operator-guide section fails lint (the docs-are-a-gated-artifact
  learning, enforced); the console-url and status verbs are the first customers.
  (6) SECRETS-AT-REST AUDIT — one recon task: enumerate every token/credential
  currently in state/, plists, and the ledger; assert each against the serve.ts
  rotation doctrine; file per-finding."
