raw: Add a real authenticated Playwright layer for the private console. The
  current suite only proves the unconfigured fail-closed state. Use Clerk
  official Playwright testing helpers and a dedicated non-production test
  instance/test users, with keys supplied only as CI secrets and never persisted
  in the repo, browser artifacts, or deployed production config. Configure a
  serial Clerk setup project and reusable auth state. Cover an administrator
  viewing the Now/Inbox summary in verified, stale, and unavailable upstream
  states; anonymous and non-administrator no-payload denial; desktop and Pixel 7
  responsive/no-overflow/error-free behavior; and sign-out recovery. Keep
  deterministic daemon responses behind a test-only server seam; do not rely on
  a live fleet or a real operator session.
