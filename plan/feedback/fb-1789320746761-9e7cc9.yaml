  carrying an inflight lock despite comments asserting fix runs consume no lock.
  Repair must establish a single worker identity model, classify
  normal/retro/review/fix processes against actual inflight ownership, and add a
  fresh state test proving PAUSE then recycle reaches zero without post-pause
  worker creation. Evidence: deploy/recycle-container.sh lines 773-786, 905-986;
  host state /home/craigoleyagent/rmd-state2/state/inflight; live container
  f0b16d4d716d."
