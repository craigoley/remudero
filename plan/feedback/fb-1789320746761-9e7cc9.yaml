raw: "Graceful recycle does not converge under PAUSE: recycle-container.sh wrote
  state/PAUSE at 2026-09-13T17:04:54Z, but docker ps at 17:31 observed a retro
  worker with /tmp/retro-settings-RETRO-1789318858540.json (elapsed 135s) and
  reviewer worker with /tmp/reviewer-settings-review-PR5423-1789320564933.json
  (elapsed 127s). PAUSE must prevent every new worker-producing lane, not only
  drain dispatch, or the recycler continues waiting for post-pause work.
  Separately, deploy/recycle-container.sh worker_lines() matches all
  Claude/Codex processes and counts normal lane-holding workers as lane-less in
