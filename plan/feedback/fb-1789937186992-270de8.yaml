raw: "Core harness repair: observed on remudero-console API-T40 PR #1493. The
  canonical task declared app/api/console/delegations/route.ts, yet the worker
  commit/PR omitted it while leaving that same source file untracked in its
  registered worktree. CI then failed importing the absent route. The normal fix
  rung correctly refused to take ownership because the worktree is dirty, which
  leaves a known red PR unable to self-repair. File one high-risk core task that
  prevents this lifecycle: before finalizing a worker commit, prove every
  changed declared source path is either committed or explicitly preserved with
  a durable refusal; after a failed PR, permit a fresh fix worktree only when
  the dirty owner cannot be safely reclaimed, without deleting, force-staging,
  or mutating its artifacts. Add discriminating tests for declared-untracked
  omission and for dirty-owner preservation plus successful fresh-fix dispatch.
  Preserve existing ownership/CAS/process protections and do not weaken
  dirty-worktree refusal."
