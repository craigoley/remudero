raw: "Reconcile the console read-path runtime regression after merged W1-T3192
  and W1-T3415. OBSERVED inside the live serve container: concurrent
  client-shaped requests returned /v1/status 200 in 3658ms (110313 bytes),
  /v1/feedback 200 in 13058ms (355306 bytes), /v1/recent 200 in 13059ms (6599
  bytes), /v1/inbox 200 in 14820ms (449398 bytes), and /v1/daemon-health 200 in
  15076ms. Sequential controls were /v1/recent 3ms and /v1/inbox 1869ms, showing
  queueing/event-loop head-of-line behavior rather than permanent endpoint cost.
  Hosted console server reads abort at 5000ms, leaving Board recent activity and
  Inbox unavailable. Existing task shards claim all overlapping console
  responses meet their budgets, but source tests did not prove the deployed
  client concurrency and payload mix. Implement or file the smallest
  non-duplicative repair: production-shaped concurrent read telemetry/test with
  an injected large inbox/feedback response, coalescing or async scheduling that
  prevents a small recent/health response from waiting behind it, explicit
  bounded stale responses when necessary, and no synthetic zero data. Do not
  raise the console timeout as the fix. Include the deployed/runtime validation
  method and deploy freshness boundary; the current core container source is
  older than merged main, so code merge alone cannot be called live
  remediation."
