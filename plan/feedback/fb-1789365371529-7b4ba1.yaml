raw: "Follow-up to fb-1789364676982-6244cf: the current graceful recycler cannot
  change console from its non-empty generic author merely by exporting an
  override. deploy/recycle-container.sh captures a non-empty outgoing container
  value with precedence over shell values, and deploy/entrypoint.sh leaves an
  already-configured identity unchanged. The solution needs an explicit, audited
  per-target author replacement/commissioning path with preflight validation and
  post-recycle verification—not a one-off host git config or a shell export that
  the recycler silently ignores. Test both initial commission and replacement of
  a bad persisted identity while preserving the normal no-silent-drop
  runtime-env contract."
