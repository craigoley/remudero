  headline: Authorize an audited console-author replacement path
  what_happened: The recycler keeps a non-empty author identity from the outgoing
    container, and the entrypoint preserves it. A shell override cannot change
    that saved identity, so the console may continue using the generic author.
  decision: Require a per-target, audited author replacement path with preflight
    checks and post-recycle verification; test first-time setup and replacement
    of a bad saved identity while preserving runtime environment values.
  options:
    - label: Approve the change
      consequence: Build and verify the commissioning and replacement paths before
