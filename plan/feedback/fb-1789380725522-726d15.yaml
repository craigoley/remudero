raw: "OBSERVED 2026-09-14: the core daemon can classify a PR as blocked-fixable
  but cannot start the repair rung. On PR #5505 (W1-T3554, head 966f29d), the
  ledger records sweep.action_failed: buildSweepEffects requires
  updatePrBodyImpl from its entrypoint adapter. Runtime source at
  src/run-task.ts:1375-1423 calls buildSweepEffectsFromLib without
  updatePrBodyImpl; src/lib/sweep.ts:965 makes that dependency mandatory and
  src/lib/sweep.ts:1171-1179 uses it for the missing-task-trailer repair. Every
  production buildSweepEffects entrypoint must supply the real GitHub PR-body
  writer, with an integration-level test proving a blocked-fixable PR reaches
  the fix rung instead of throwing. Preserve fail-closed behavior for a
  genuinely unavailable writer. After the repair lands and is gracefully
  deployed, the daemon must reclassify and repair #5505 without a manual rmd
  fix. Also ensure the test does not merely inject the missing dependency at the
  library unit seam; it must exercise the production adapter path."
