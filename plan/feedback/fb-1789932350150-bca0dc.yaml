raw: "Observed during the official deploy/recycle-container.sh --instance core
  run on 2026-09-20: it wrote PAUSE before waiting, but the worker census kept
  admitting new lane-less sweep/fix workers after the hold. The recycler moved
  from 0 to as many as 6 lane-less workers and never converged while normal lane
  holders were also active. This contradicts W1-T3491, whose task is marked
  merged and explicitly promises STOP/PAUSE fence full-sweep review and repair
  admission. Treat the merged task as semantically superseded by live evidence,
  not complete. Implement a regression that raises PAUSE during a recycle/drain
  wait and proves no new review, fix, intake, retro, or task worker is admitted
  after the marker; the recycler may wait only for workers admitted before the
  hold, then reach a safe zero or refuse with an attributable pre-hold set.
  Preserve existing in-flight work; do not solve this by killing it or weakening
  pause semantics."
