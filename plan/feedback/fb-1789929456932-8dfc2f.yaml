raw: "Observed during live fleet verification: rmd status --json was invoked
  with RMD_SELF_SYNC_DONE=1 and emitted only github_app.token_refreshed, then
  remained live for 146 seconds until its exact PID was terminated; it produced
  no JSON and no stated refusal. A supposedly read-only health/status command
  must have a bounded, explicit outcome per external read (healthy, stale,
  unavailable, rate-limited, or timed out), rather than silently waiting past
  its operational budget. Preserve all no-write/no-spawn semantics. Prove a
  delayed or hanging provider/GitHub read returns a machine-readable degraded
  status within the configured bound, and that a normal current read still
  reports healthy state."
