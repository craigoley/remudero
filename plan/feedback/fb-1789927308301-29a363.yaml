raw: "Reconcile the deployed Azure control plane with the merged automatic
  deployment contract. OBSERVED 2026-09-20: origin/main is
  efdd31692a50bcc1704c734eb7e5dabdf43c3ff4 while the running remudero-serve
  container reports baked source 089af54ccefc4a38c3666c632e1a8a3eb93d6992, so
  merged console-read and analytics work is not live. The host has only a
  five-minute fleet-heartbeat cron and a daily host-update.sh --reclaim-only
  cron; the former does not deploy and the latter explicitly never pulls or
  recycles. W1-T3245 is marked merged, but its intended supervisor is not
  actually commissioned on this container host. Diagnose the current controller
  topology, including whether a systemd unit or safe container-native reconciler
  is expected. Implement or file the smallest safe restoration so a verified
  baked-image/main drift follows the existing graceful idle, build, pull,
  digest, health-check, rollback and rate-limit script process; no direct docker
  restart, no unsafe recycle, no deployment on unverified drift, and clearly
  distinguish mounted-source restarts from baked-image recycle. Include a live
  host installation/commissioning proof that does not overwrite stronger
  existing units."
