raw: "GRACEFUL RECYCLE MUST NOT DEADLOCK ACROSS AN AUTOMATIC CONTAINER RESTART.
  Observed on the core Azure daemon 2026-09-13: recycle-container.sh wrote
  state/PAUSE at 22:32:35Z and waited for the preexisting W1-T3483 lock. The
  daemon self-restarted under Docker restartCount 1, preserving the same
  container id and hostname. runDaemon logged daemon.boot_held because PAUSE was
  checked before daemonBoot, so daemonBoot never ran its stale-lock sweep. The
  completed W1-T3483 lock recorded pid 73 and startedAt 21:18Z; after the 21:49Z
  restart pid 73 belonged to an unrelated Node libuv-worker. The host recycle
  script correctly refused after 3000 seconds and removed PAUSE without stopping
  the container. Once unpaused, the per-poll daemon.inflight_sweep reaped the
  stale lock by container boot identity at 22:32:02Z, then the next guarded
  recycle succeeded. Fix the lifecycle so a process restart while PAUSE is set
  still performs the safe boot identity sweep before honoring the hold, or
  otherwise provides a daemon-owned safe reaper that cannot create this
  deadlock. Do not make the host script delete same-container locks. Add focused
  tests for a Docker restart retaining hostname plus reused live pid and
  preexisting PAUSE; prove the lock is reaped safely, no duplicate task starts,
  pause remains honored, and recycle completes without waiting the full bound.
  Runtime acceptance: induce the modeled condition on a disposable state fixture
  or equivalent integration harness and prove one recycle completes without raw
  Docker restart, manual lock deletion, or timeout."
