raw: "Regression: a host-side operation can leave state/ledger.ndjson owned by
  root although runtime containers run as uid 1000. This causes EACCES in
  appendLedger and blocks daemon triage/review/telemetry. Implement a
  source-owned prevention and a deterministic post-recycle ownership/writability
  proof for the core state ledger; preserve append-only contents and fail loudly
  before runtime if ownership is wrong."
