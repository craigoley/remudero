- id: W1-T5527
  title: "EVERY PRICED LEDGER STEP IS IN THE CONFIG GARDEN'S READ — a census that each step whose rows carry `cost_usd` or `pr_url` inside a worker run is in `CONFIG_GARDEN_LEDGER_STEPS`, so a new step cannot silently fall out of the config gardener's filtered ledger read"
  repo: remudero
  depends_on: [W1-T5526]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: low
  origin: "operator session 2026-10-03: follow-up to W1-T5474 (#8933)"
  plan_refs: [W1-T5474, W1-T5526]
  files: [test/every-priced-ledger-step-is-in-the-config-garden-read.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-03 on origin/main 3e026b90. W1-T5474 (#8933) made `configInventory` read the ledger union
    filtered to `CONFIG_GARDEN_LEDGER_STEPS` (src/lib/config-gardener.ts), a hand-written list. Its doc
    says why: with no verdict line, `gatherRuns` takes a run's first `cost_usd` and first `pr_url` row of
    any step, "so each step carrying either inside a run is listed". When someone adds a step that writes
    `pr_url` or `cost_usd` under a worker's run_id and does not add it to the list, the filtered read drops
    it. The gardener then prices or credits that run differently from an unfiltered read, and no test
    notices.
    It depends on W1-T5526, which narrows the cost fallback to worker rows. The census should be written
    against the reader as it will be.
  design: |
    A census test over src/: find every ledger write (`log("<step>", {…})` and `appendLedger(…, { step:
    "<step>", … })`) whose payload literal names `pr_url` or `cost_usd`, and assert each step is in
    `CONFIG_GARDEN_LEDGER_STEPS`, or in an explicit exemption list where each entry gives its reason (for
    example, written only under a non-worker run_id). Include a positive control: the census must find the
    known members `pr.opened` and `implement.done`, so a scanner that finds nothing fails.
  acceptance:
    - claim: "every ledger step written with pr_url or cost_usd is in CONFIG_GARDEN_LEDGER_STEPS or a reasoned exemption, and the census finds pr.opened and implement.done as its positive control"
      proof: "unit test: test/every-priced-ledger-step-is-in-the-config-garden-read.test.ts"
  falsifier: |
    Remove `pr.head_provider` from `CONFIG_GARDEN_LEDGER_STEPS`. The census names it.
