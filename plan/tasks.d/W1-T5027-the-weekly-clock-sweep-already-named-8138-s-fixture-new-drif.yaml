  falsifier: |
    Remove the budget check and the second test reddens (the sweep runs past its budget and names nothing); keep the
    check but skip the ordering and the first test reddens (the newest suite is swept last, so it is the one a budget
    cuts). Change the exit to 0 on unreached and the second test reddens on the exit code. The positive control (third
    test) stays green in all three, which is what shows the bound fires only on exhaustion.
