    THE DECISION THIS BUYS, stated for the operator: at today's population the budget WILL fire every week (the last
    two full runs were 25.5 and more than 29.8 minutes), so the sweep goes red and names its oldest-touched tail until
    the structural follow-up (concurrency or shards, plus a workflow edit, plus a scheduled re-measure of the +400d
    run time) lands. That is the honest state of the instrument: today it is silent. The budget is sized ABOVE the 09-21
    runtime so it is a backstop for growth, not a bound that fires on the healthy size (this repo's recurring defect);
    if the operator reads 27 minutes as too tight, the constant is the one edit.
