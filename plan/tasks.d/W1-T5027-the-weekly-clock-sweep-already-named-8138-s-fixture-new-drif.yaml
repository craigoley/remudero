  rationale: |
    MEASURED 2026-09-30 at origin/main 1f6d904bb. THE DYNAMIC SCAN THE OPERATOR ASKED FOR ALREADY EXISTS, AND IT DID NAME
    THE #8138 FIXTURE; THIS TASK DOES NOT BUILD A SECOND ONE. `scripts/clock-shift.mjs` is the preload (FK_SHIFT_DAYS shifts
    the no-arg `Date.now()` and `new Date()`, leaves `Date.parse`, `Date.UTC`, performance.now and timers alone);
    `scripts/clock-sweep.mjs` derives the candidate population and runs ONE FILE PER INVOCATION at +400 days;
    `.github/workflows/clock-sweep.yml` runs it every Monday 05:23Z; `classifySweep` already flags a NEW drifting suite at
    any count (W1-T3276). An RMD_TEST_CLOCK_SKEW_DAYS preload, a time-bomb-scan script and a second weekly job would each
    duplicate one of those.

    (1) THE INSTRUMENT SEES THE BOMB, AND SAW IT. The fixture (`const RECENT = "2026-09-16T18:50:00Z"`, `lastActivityAt:
    RECENT`, no `now`) landed in #5831 on 2026-09-17T01:55Z. It is in `deriveCandidates()` (468 candidates today; the
    regexes key on `lastActivityAt` and any date literal, so a named constant is no obstacle, the one shape the static
    census cannot see). Replayed on the pre-fix file (bfc69ee68^) with `FK_SHIFT_DAYS=<n> node --test --import tsx
    --import $PWD/scripts/clock-shift.mjs`: 16 pass / 0 fail at -12 and -8 days, 8 fail at 0 (today), +7 and +400. The
    scheduled run of 2026-09-21 (run 35590593553, sweep step 10:47:41 to 11:13:10) printed `NEW DRIFT - 7 suite(s) NOT in
    scripts/clock-sweep-baseline.json's recorded set` with test/a-verdict-is-reused-when-nothing-it-judged-changed.test.ts
    FIRST in the list, nine days before main went red.

    (2) IT WAS DELIVERED AS A COMMENT ON A LONG-LIVED THREAD AND NO FIX LANDED FOR NINE DAYS. The step 'Open or update a needs-human issue on
    drift' printed `commented on existing issue #5513`: that issue was opened 2026-09-14 (label `backlog`, 4 comments,
    last updated 09-24, still open), because needs-human-issue.mjs keys ONE thread per `--source clock-sweep`. A new
    suite is a new comment, not a new escalation. That delivery defect is real and is a FOLLOW-UP here (it needs a workflow
    edit and a per-suite source key); it is NOT this task. Also measured, in the 09-14 report that opened #5513: 3 of its
    7 'drifting' suites (serve.density-ia, serve.live-state, console-shell-client) fail for `browserType.launch: Executable
    doesn't exist` (the job never runs `npx playwright install`), a failure at +0 days that the sweep reports as clock drift
    with a 'fails by +7 days' fuse. A second FOLLOW-UP, not this task.

    (3) THE RUN THAT FOLLOWED NEVER FINISHED. Scheduled runs of clock-sweep.yml (9 total): 09-07 success, 09-14 failure,
    09-21 failure (sweep step 25 min 29 s), 09-28 CANCELLED: sweep step 05:34:37 to 06:04:25 (29 min 48 s, the job's
    `timeout-minutes: 30`), and 'Open or update a needs-human issue on drift' is `if: failure()`, so it was SKIPPED (a
    cancelled job is not a failure). No report, no fuse bisection, no comment. The candidate count went 326 (09-14,
    per #5513's captured output) to 468 today; the script header still says 'all 42 candidates' and the workflow comment
    says a sweep 'completes in ~10-11 minutes'. A cancelled instrument reports the same thing whether the suites are clean
    or on fire: the repo's 'a silence reads as success' defect.

    (4) WHAT THIS TASK DELIBERATELY DOES NOT DO. It does not add concurrency, shards or a matrix job (that is the
    structural fix, and it needs a workflow edit plus a decision about ledger and port collisions under parallel
    shifted runs: FOLLOW-UP, stated explicitly), does not add a workflow file, does not change `AGE_SURFACE_RE`, the
    ceiling, the ladder or the +400 shift, and does not touch `scripts/expiring-fixture-census.mjs` (its static
    detector remains blind to a named constant; the sweep, not the census, is the catch for that shape).
    CLAUDE.md's clock-signature census walks `src/` only (scripts/clock-signature-ratchet.mjs, `join(root, "src")`), so
    scripts/ and test/ are outside it; no bare `Date.now()` is added to src/run-task.ts.
  design: |
    (i) `orderNewestFirst(suites, touchedAt)` (scripts/clock-sweep.mjs), pure: sort by the last commit time of the
    suite's test file, newest first, ties and unknown files by name. `touchedAt` is an injected
    `() => Map<suite, epochSeconds>`; the default reads ONE `git log --format=%ct --name-only -- test/` (the workflow
    checks out with fetch-depth 0). If the read fails the order is the existing name order AND the report says
    'order: name (git history unreadable)' — never a silent fallback.
    (ii) `SWEEP_BUDGET_MS` (PRIMARY CONTROL on how long one sweep may spend running suites, declared as such in its
    doc comment; set to 27 minutes, under the workflow's 30-minute timeout-minutes, which stays the BACKSTOP). `main`
    takes an injected `now` (default Date.now, real because the sweep's own process clock is never shifted: only the
    child gets the preload) and checks the budget BEFORE starting each suite.
    (iii) When the budget runs out, the remaining suites are not run and are NAMED: `UNREACHED — N suite(s) not run
    inside the 27-minute budget (oldest-touched last): <first ten> + M more`, and `ok` is false, so the workflow's
    `if: failure()` delivery fires. A sweep that reaches every suite prints no such section and behaves exactly as today.
    `classifySweep` is unchanged: an unreached suite is not a pass and not a drift, so it is a third value the summary
    carries (`unreached`), never folded into `immune`.
    (iv) The report's existing header lines are kept; one line is added: `order: newest-touched first`.
    (v) ONE test really shells out for the default `touchedAt` seam against a throwaway git repo with two commits
    (CLAUDE.md coverage trap: a default seam every test fakes is unreachable), and an in-process test drives `main` with
    an injected clock, runner and derive, as test/clock-sweep.test.ts already does.
