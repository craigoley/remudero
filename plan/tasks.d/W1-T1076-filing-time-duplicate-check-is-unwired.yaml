  note: |
    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `lint-plan` reads three
    stems here — `task-linter`, `run-task` and `knowledge-dedup` — and refuses that at medium.
    DECOMPOSITION IS DECLINED WITH A REASON: the predicate change and its corpus wiring are the same
    defect. W1-T420 already shipped the predicate alone, and the result is the unreachable organ in
    rationale (3); shipping the corpus shape without the k choice would reproduce rationale (4),
    where the check is wired and still catches nothing. The diff is a corpus builder, one `opts.k`,
    and one call-site assignment.

    `test/knowledge-dedup.test.ts` IS THE EXISTING HOME — W1-T420's own ACCEPTANCE 3 tests for
    `duplicateTitleViolations` live there — so it is declared rather than a new filename.

    THIS SHARD CARRIES NO PROOF THAT GREPS ITS OWN PATH. Its eight proofs are name-filtered
    `unit test:` forward references, for which `proofScopePath` returns `undefined`, so `proof-scope`
    is silent on all eight.

    EVERY FIGURE IS A QUERY. Re-derive the call-site census by grepping `openTaskTitles:` as an
    assigned key across `src/` with `moduleExists` and `resolveNameFilteredCandidates` as live
    controls. Re-derive every score by importing `bestNearDuplicate` and passing `{ k }` — note that
    its third parameter is an OPTIONS OBJECT and NOT a cutoff, so a number passed there is silently
    ignored and every pair comes back as a match; filter on `.score` yourself. Re-derive the
    false-positive load by scanning slugs at each k against the plan on main. The k=3 figures will
    move as shards land; the shape of the trade-off is what this task rests on.
