- id: W1-T1076
  title: "TWO LANES FILED THE SAME FINDING TWO MINUTES APART, TWICE IN TWENTY MINUTES, AND NO CHECK COULD HAVE SEEN IT — `duplicateTitleViolations` (W1-T420) IS BUILT, TESTED AND UNREACHABLE because `opts.openTaskTitles` is assigned NOWHERE in `src/`; and wiring it alone fixes nothing, because the house-style TITLE scores 0.00 and 0.05 on the two measured pairs while the filename SLUG at k=2 scores 0.20 and 1.00 — supply the corpus from OPEN plan PRs, in changed-tasks scope only, and score the slug"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 35.00
  risk: high
  rationale: |
    MEASURED 2026-08-20 against origin/main `607220e6`, from a scratch worktree whose HEAD was
    proved equal to that sha before any reading. Every predicate below was DRIVEN — `bestNearDuplicate`,
    `duplicateTitleViolations`, `DEFAULT_SHINGLE_K` — never re-implemented, and every zero carries a
    control on the same invocation.

    (1) THE COST IS DATED AND IT IS DUPLICATE FILINGS, NOT DUPLICATE PROSE. Two pairs of shards
    were filed on the same subject, by independent lanes, within twenty minutes:
      #2324 `W1-T1071` 20:34:13Z and #2325 `W1-T1070` 20:36:47Z — 2m34s apart — both filing that a
      self-path `grep:` proof cannot discriminate on an implementing diff.
      #2327 `W1-T1075` 20:52:47Z and #2328 `W1-T1074` 20:54:43Z — 1m56s apart — both filing that
      `diff-coverage` is a correct gate that runs too late. THEIR SHARD FILENAMES ARE BYTE-IDENTICAL
      apart from the id.
    NEITHER PAIR CROSS-CITES: a grep for the sibling's id or PR number over all four bodies returns
    zero. LIVE CONTROL on the same query shape: those same four bodies cite 6, 12, 2 and 1 OTHER task
    ids respectively, so the zero is a real absence and not a broken read. These are independent
    derivations, minutes apart, and no lane could have seen the other.

    (2) AND THE PROSE RE-DERIVATION THE BRIEF HYPOTHESISED IS REAL BUT MODEST — SAID PLAINLY RATHER
    THAN INFLATED. Over the whole corpus of merged plus open PR bodies, counting a body as
    "explaining from scratch" when a single sentence carries both the mechanism and a causal
    connective and cites no prior PR or task: the proof-execution classifier 19, the CI-gate
    ordering 23, the `executed_stale` fallback 10. HAND-CLASSIFYING the smallest set — all 12
    `executed_stale` explanations — most are the PR that CHANGED that code documenting its own
    change, which is correct, or an author applying CLAUDE.md's `grep -arn`, never `grep -F` rule
    almost verbatim, which is the existing pipeline WORKING. So a compiled page set is not what
    today's evidence buys. The sharp, dated cost is (1).

    (3) THE ORGAN THAT WOULD CATCH IT EXISTS AND HAS NO CALLER. `duplicateTitleViolations`
    (`src/lib/task-linter.ts`, W1-T420) takes `opts.openTaskTitles`, scores every open task title
    against the candidate with `bestNearDuplicate`, and warns above `DEFAULT_DUPLICATE_CUTOFF`. It
    is wired into `lintTask`'s aggregator and it is silent by construction absent a corpus — its own
    doc says so: "Absent `opts.openTaskTitles` ⇒ silent (the caller hasn't supplied a corpus)."
    CALL-SITE CENSUS: `openTaskTitles:` as an assigned key returns ZERO across all of `src/`. LIVE
    CONTROLS on the identical query shape, both non-zero: `opts.moduleExists =` and
    `opts.resolveNameFilteredCandidates =` are each assigned once in `src/run-task.ts`, and a second
    `moduleExists:` arrives there in object-literal form — so the injected-predicate
    wiring pattern is real and used, and this zero is an absence rather than a query defect. The
    `openTaskTitles` identifier that DOES appear in `run-task.ts` belongs to the retro follow-up
    harvest and is passed as `openTitles`, a different option to a different function.

    (4) WIRING IT ALONE WOULD HAVE CAUGHT NEITHER PAIR, AND THAT IS THE HALF THAT MATTERS.
    Driven over the real predicate at the shipped `DEFAULT_SHINGLE_K = 3` and cutoff 0.2, scoring
    the TITLE: pair A reads 0.000 and pair B reads 0.054. Both far below cutoff. The reason is
    structural rather than accidental — the house title style is long, shouty and deliberately
    distinctive prose, so two descriptions of one mechanism share almost no 3-token shingle. The
    FILENAME SLUG is the opposite: short, topical, and written to name the subject. Scoring the slug:
    pair A 0.111 and pair B 1.000 at k=3; pair A 0.200 and pair B 1.000 at k=2 — BOTH CAUGHT at k=2,
    with the module's own fixture control still reading 0.818 at that k.

    (5) CONCATENATING TITLE AND SLUG IS WORSE THAN THE SLUG ALONE, WHICH IS COUNTER-INTUITIVE AND
    MEASURED. At k=2 the joined text scores 0.049 and 0.102 against the slug's 0.200 and 1.000: the
    long title floods the shingle set and dilutes the signal the slug carries. An implementer must
    not "improve" this by adding more text.

    (6) THE FALSE-POSITIVE LOAD IS MEASURED, NOT ASSUMED, AND k=2 IS THE HONEST CHOICE. Slug pairs
    at or above cutoff across the whole plan on main: 124 at k=1, 25 at k=2, 4 at k=3. k=1 warns on
    roughly a third of the plan and is unusable; k=3 misses pair A. k=2 sits between, and its top
    hits read as genuinely adjacent work rather than noise. The LIVE corpus is open plan PRs, not the
    whole plan, so the warns any one filing actually draws are far fewer than 25.

    (7) THE PLAN'S OWN NEAR-DUPLICATE IS NOT EVIDENCE FOR THIS TASK AND IS RECORDED AS SUCH.
    Scanning all 414 shards on main by title at cutoff 0.2 returns EXACTLY ONE pair — `W1-T1062` and
    `W1-T403`, byte-identical titles, both queued. That pair is DELIBERATE: #2293 re-filed the
    original under a fresh id because its own plan-only filing commit had credited it as built, and
    that body CITES `W1-T1004` rather than re-deriving it. It is an example of the knowledge pipeline
    working. It is not a duplicate this task would prevent, and it must not be counted as one.
    ── ADDED 2026-08-25, RATIONALE ONLY. A THIRD PAIR, AND IT IS A COUNTER-EXAMPLE ──────────────

    (8) THE THIRD PAIR, AND ITS CAUSE IS NOT THIS SHARD'S CAUSE. On 2026-08-25 the same defect was
    filed twice: W1-T2256 as #2789 and W1-T2257 as #2790, both naming `receiptCommand`'s read of
    `ledgerPathFor(config)` at `run-task.ts:11727-11729`. #2789 was CLOSED UNMERGED as superseded.
    THE TWO PAIRS THIS SHARD RESTS ON WERE TWO LANES FILING MINUTES APART; THIS ONE WAS A SINGLE
    OPERATOR ISSUING THE SAME BRIEF TWICE, HOURS APART, ONCE WITH AN UNFILLED ID PLACEHOLDER. So the
    collision is UPSTREAM OF DISPATCH ENTIRELY — no lane-side coordination could have prevented it,
    which is precisely the argument for a FILING-TIME corpus check rather than a dispatch-time lock.
    Both shards swept all eight id surfaces clean and both were correct to: an id sweep answers "is
    this id used", never "has this defect already been filed under another id".

    (9) BUT SCORED WITH THIS SHARD'S OWN METRIC, THE REMEDY WOULD NOT HAVE CAUGHT IT. Re-derived by
    importing `bestNearDuplicate` and passing `{ k }`, exactly as rationale (7) requires, over the
    real corpus `shardSlugFromPath` reads — the shard FILENAMES, not the branch names:
        W1-T2256  receipt-reads-the-live-file-rotation-already-took
        W1-T2257  the-receipt-verb-reads-the-file-rotation-empties
        k=2   SLUG 0.100   TITLE 0.365
        k=3   SLUG 0.000   TITLE 0.278
    `DEFAULT_DUPLICATE_CUTOFF` is 0.2 and `DUPLICATE_SLUG_SHINGLE_K` is 2, so **THE SLUG AT 0.100 IS
    HALF THE CUTOFF AND WOULD NOT HAVE WARNED, WHILE THE TITLE AT 0.365 WOULD HAVE.** THAT IS THE
    EXACT INVERSE OF PAIRS A AND B, where the slug scored 0.200 and 1.000 and the title 0.00 and
    0.05. A THIRD AGREEMENT WOULD HAVE BEEN WORTH LITTLE; THIS IS A COUNTER-EXAMPLE AND IS RECORDED
    AS ONE.

    (10) WHAT THE COUNTER-EXAMPLE DOES AND DOES NOT OVERTURN. It does NOT overturn the choice to
    score the slug: switching back to the title would take pairs A and B from CAUGHT to MISSED
    (0.00 and 0.05, both under the cutoff), trading two catches for one. **NEITHER SIGNAL CATCHES
    ALL THREE PAIRS, AND WITH n=3 THAT IS THE WHOLE OF WHAT THE EVIDENCE SUPPORTS.** The honest
    reading is that the slug is the better single signal on the pairs measured and is not a
    complete one — which is an argument for the check staying ADVISORY (design (iv)) rather than for
    changing what it scores. An implementer must not read this section as a mandate to score both,
    or to concatenate them: rationale (5) already measured the concatenation as WORSE than the slug
    alone, and nothing here disturbs that.
    ONE OBSERVATION, NOT A PROPOSAL: the BRANCH slugs for the same pair — `receipt-reads-the-live-file`
    and `receipt-reads-the-rotated-file` — score 0.200 at k=2, exactly at cutoff. Branch names are
    not the corpus `shardSlugFromPath` reads and this shard does not propose making them one; it is
    recorded only so a later reader does not rediscover it as an unexplored option.

    (11) Q2 — THE CORPUS WOULD PROBABLY HAVE SEEN IT, AND IT WOULD NOT HAVE MATTERED. #2789 was
    created 2026-08-25T01:16:26Z and #2790 at 01:17:53Z — EIGHTY-SEVEN SECONDS APART — and #2789 was
    still open (it closed at 01:19:52Z). The remedy builds its corpus from OPEN plan PRs via
    `listOpenHeadBranches()` plus each PR's `changedFiles`, so a PR opened eighty-seven seconds
    earlier is the marginal case for a list read, and this shard cannot prove from here whether that
    read would have returned it. **BUT THE VISIBILITY QUESTION IS NOT THE BINDING CONSTRAINT: even
    with #2789 fully visible, the slug score of 0.100 is below the cutoff and no warning would have
    been emitted.** Recording the timing without that sentence would imply the corpus was the gap,
    and it was not.

    ── ADDED 2026-08-25, RATIONALE ONLY, POST-MERGE. THE THIRD PAIR RESOLVES ───────────────────

    (7) THE REMEDY THIS SHARD PRESCRIBED IS INCOMPLETE, AND THE FIX IS ONE OPERATION AWAY. This
    record already carries its own counter-example (#2793): a THIRD pair whose slug-at-k=2 score
    falls below the cutoff. MEASURED 2026-08-25 WITH `bestNearDuplicate` IMPORTED AND DRIVEN,
    slugs read through `shardSlugFromPath`, slug at `DUPLICATE_SLUG_SHINGLE_K = 2`, title at
    `DEFAULT_SHINGLE_K = 3`, cutoff `DEFAULT_DUPLICATE_CUTOFF = 0.2`:
      A  W1-T1071 / W1-T1070   slug 0.200  title 0.000  max 0.200  CAUGHT
      B  W1-T1075 / W1-T1074   slug 1.000  title 0.054  max 1.000  CAUGHT
      C  W1-T2256 / W1-T2257   slug 0.100  title 0.278  max 0.278  CAUGHT
    SLUG ALONE 2 OF 3. TITLE ALONE 1 OF 3. `max(slugScore, titleScore)` 3 OF 3, AT THE EXISTING
    CUTOFF, WITH NO NEW METRIC INVENTED AND NO THRESHOLD MOVED. The slug figures reproduce this
    shard's own rationale (4) exactly, which is the control that the harness is wired the same way
    it was when those numbers were first taken.

    (8) AND THE FALSE-POSITIVE HALF IS WHAT MAKES IT SAFE, BECAUSE AN IGNORED ADVISORY IS AN
    ABSENT ONE. Over 584 shards on origin/main, all 169,071 pairs scored: SLUG ALONE crosses 0.2
    on 40 pairs; `max()` crosses on 40; AND THE SETS ARE IDENTICAL. `max()` adds ZERO pairs the
    shipped metric does not already flag, and there are ZERO title-only pairs. The single
    title-crossing pair, `W1-T1062` / `W1-T403`, scores slug 1.000 as well — the DELIBERATE
    re-file rationale (6) already documents. And across the recent burst W1-T2200..W1-T2271 (59
    shards, 1,711 pairs) ZERO cross under slug, title or max. SO THE ADVISORY LOAD AN OPERATOR
    SEES IS UNCHANGED AT 40, and those 40 are the load already accepted when the slug metric
    shipped.

    (9) AND THIS IS NOT THE CONCATENATION RATIONALE (5) REFUSED — STATED EXPLICITLY BECAUSE THE
    OBVIOUS READING IS THAT IT WAS. Rationale (5) measured the JOINED text at 0.049 and 0.102
    against the slug's 0.200 and 1.000, and named the cause: the long title floods the shingle set
    and dilutes the signal the slug carries. THAT IS ONE FEATURE BUILT BY CONCATENATION. Scoring
    two features SEPARATELY and taking the higher dilutes neither: pair B keeps its 1.000 and pair
    C gains its 0.278. The two operations differ, rationale (5)'s measurement stands unchallenged,
    and a builder must not read it as having already refused this.

    (10) AND WHAT A BUILDER WILL FIND ALREADY DONE, SO NOBODY RE-DERIVES IT. THE CORPUS WIRING
    SHIPPED. `duplicateCorpusOpts` (`src/run-task.ts:13809-13821`) supplies `openTaskTitles`,
    `duplicateSlug` and `duplicateShingleK`; its ONLY call site is `run-task.ts:14200`, passing
    `true` literally, under the comment "scope is populated iff `--base` was given, so this branch
    IS the changed-tasks pass". SO THE CHECK IS ARMED WITH A CORPUS IN `--base` SCOPE TODAY, and
    a lane running `lint-plan --base origin/main` had it live. THE GAP WAS ALWAYS THE METRIC AND
    NEVER THE WIRING.

    (11) ONE NUMERIC RECONCILIATION, SO NOBODY THINKS TWO MEASUREMENTS DISAGREE. Pair C's TITLE
    scores 0.365 at k=2, 0.278 at k=3 and 0.241 at k=4. The shipped title path uses
    `DEFAULT_SHINGLE_K = 3`, SO 0.278 IS THE OPERATIVE NUMBER — and the pair clears 0.2 at every k
    measured, so the catch does not depend on that choice.

    (12) AND ONE SIGNAL NOTED WITHOUT BEING RECOMMENDED. W1-T2256 and W1-T2257 both named
    `receiptCommand`'s read at `run-task.ts:11727`, so a `files:`-or-citation OVERLAP signal
    exists if a future pair ever defeats `max()`. IT WAS NOT MEASURED. Nobody should build it on
    that observation alone: it must be scored on these same three pairs AND the same
    false-positive windows first, exactly as slug and title were, or it is a hunch wearing a
    metric's clothes.

  design: |
    (i) THE CORPUS IS OPEN PLAN PRs, SUPPLIED AT THE CALL SITE. The candidate is the shard being
    filed; the corpus is the shard title AND filename slug of every plan shard added by a currently
    OPEN pull request. That is precisely the surface neither lane in (1) could see. It is supplied
    the way `moduleExists` and `resolveNameFilteredCandidates` already are — the verb holding a real
    checkout and a GitHub reader passes a predicate in, and the linter itself stays pure and reads
    no disk and no network.

    (ii) ONLY IN CHANGED-TASKS SCOPE. `lintPlanCommand` populates its extra `opts` only when `scope`
    is set, and W1-T497's comment beside that block says why in terms: the whole-plan pass is a job
    "ci.yml calls cheap pure JS with no network". A GitHub read in the whole-plan pass would break
    that property for every task on every run. Scoped to the one or two tasks a PR actually touches,
    it costs one list call.

    (iii) SCORE THE SLUG, AT k=2, VIA `opts.k`. `bestNearDuplicate` already takes `{ k }`, so this
    needs no change to `knowledge-dedup.ts` — the caller chooses. Rationale (4) and (6) are the whole
    argument and both numbers must be re-derived by the implementer, not trusted from this shard.

    (iv) WARN, UNCONDITIONALLY, AND NEVER BLOCK. W1-T420 made this advisory on purpose: sibling tasks
    in one arc legitimately score high, and a false block at filing costs a whole re-file cycle. That
    posture is preserved exactly. The check writes nothing, mutates nothing, and gates nothing — the
    author reads the warn and decides. There is no second actor and no state a live daemon depends on.

    (v) NO CORPUS ⇒ NO OPINION. If the GitHub read fails or returns nothing, the corpus is empty and
    the check is silent, which is already `duplicateTitleViolations`' documented contract. A failed
    read must never manufacture a warn and must never fail the lint.

    (vi) NO NEW STORE, AND THAT IS A CONSTRAINT NOT A PREFERENCE. Nothing here adds a file, an index,
    a database, an embedding or a search service. The corpus is derived from GitHub at call time and
    discarded. A second store is a second thing to go stale, and the whole point of this task is a
    surface that cannot drift from the thing it describes.

    (vii) OUT OF SCOPE, NAMED. W1-T1059 is a DIFFERENT concern and must not be folded in: it gives
    `runPromotionPass` a caller so a project learning can travel to the cross-repo `user-overall`
    layer. That is distribution between repos, at retro time; this is duplicate detection within one
    repo, at filing time. It shares only a family resemblance — an organ built, tested, ratified and
    left without a caller — and this task is a second instance of that family, not the same instance.
    Also out of scope: any change to `DEFAULT_DUPLICATE_CUTOFF` or `DEFAULT_SHINGLE_K` themselves,
    both of which are measured defaults for the learnings corpus and are not this task's to move; k
    is chosen per call.
