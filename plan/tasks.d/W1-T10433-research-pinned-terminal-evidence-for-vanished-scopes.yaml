  design: |
    Produce a research-backed specification with exact current source symbols and an adoption decision
    explicitly deferred to separate operator review. Bind terminal evidence to nonce, owner PID/start,
    UID, host boot identity, namespaces, dedicated scope identity, collector revision and original lease.
    Require positive populated-to-quiescent observation covering descendants and attested containment;
    specify collector durability, crash/partial-write behavior, freshness and replay rejection.
    Live work evidence wins over a claimed terminal receipt. Missing/unreadable/mismatched receipt,
    incomplete containment, reused paths/identities or contradictory observations remain UNKNOWN.
    Avoid circular settlement: closure proof, then separately authorized exact-owner release, then
    original-record read-back. Already released is not a prerequisite for proving closure.
    Include positive and removal controls, stale/wrong-head/wrong-nonce/live-descendant falsifiers,
    and explicit NOT_RUN for unavailable native capacity/permissions. No native run, lease mutation,
    policy activation, process signals, infrastructure or new-build hold is authorized by this task.
