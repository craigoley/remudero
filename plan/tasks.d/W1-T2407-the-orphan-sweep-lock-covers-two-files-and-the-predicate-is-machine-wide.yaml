  falsifier: |
    If a failing run's own output already names the competing process, then the measurement this
    task calls for has already been taken and the diagnostic half must be closed rather than built —
    what would remain is the lock's scope alone. The check is direct: read a CI log for a failing
    `W1-T356 wiring` attempt and look for a command line belonging to a fixture other than the two
    that hold the lock. Equally, if the set of spawning fixtures and the set of lock holders are
    already identical at head, the scope gap has been closed by another change and this task must be
    closed rather than implemented.
