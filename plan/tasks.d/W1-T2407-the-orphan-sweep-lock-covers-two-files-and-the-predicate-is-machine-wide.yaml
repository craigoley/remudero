  title: "THE ORPHAN-SWEEP LOCK COVERS TWO FILES AND THE PREDICATE IT GUARDS IS MACHINE-WIDE — sweepOrphanWorkers kills on readMarkers plus isRunActive alone, isRunActive consults the CALLER'S OWN inflight dir, and defaultListCandidates walks every pid on the machine, so a stray from any of the four other spawning fixtures is always read not-active, killed, and ledgered into the wrong ledger; W1-T356's assertion recurred four times the day its two-file lock shipped"
