    - claim: "an unavailable no-commit rerun falls through to the requeue arms in the same pass"
      proof: 'grep: test("W1-T8041: an unavailable failed-job rerun falls through to the requeue arms" in test/a-deferred-requeue-survives-a-no-commit-rerun.test.ts'
  falsifier: |
