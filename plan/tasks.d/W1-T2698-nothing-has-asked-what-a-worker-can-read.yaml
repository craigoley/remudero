    THE PROBE MAY FIND THE CREDENTIALS FILE REACHABLE ON THE FIRST RUN. That is a finding, not a
    failure: it lands in the baseline, and W1-T2699 — filed beside this task, not promised in
    prose — is the shard that shrinks it. Under Rule 25 a new CI job to run the probe on the
    ubuntu class would be instrument surface; this task runs it under the existing suite.

    SOURCES: OpenClaw docs/security/THREAT-MODEL-ATLAS.md (credential exfiltration, residual
    risks) and the v2026.8.1 release note ("SecretRef model credentials").
