- id: W1-T6259
  title: "A DISPATCHED RUN'S PROJECTION READS CHANGED FILES OFF THE LOOP — the daemon's lane gateway factory and runTask's default gateway are built without `changedFilesCache`, so projectPlan → deriveStatus → uncreditedBuildWarning falls back to buildBatchedGithub's synchronous changedFiles memo and shells gh once per candidate PR on the daemon thread; a live CPU profile after W1-T6246 deployed (2026-10-07 18:32Z) caught one unbroken 160.8 s block there"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — every gateway a dispatched run projects through has the non-blocking changed-files provider
  band_meaning: span
  origin: "operator session 2026-10-07: post-W1-T6246 daemon CPU profile (lanes/claude/daemon-cpu-after.cpuprofile)"
  plan_refs: [W1-T6246, W1-T5689, W1-T2392]
  files: [src/run-task.ts, test/a-dispatched-runs-projection-reads-changed-files-off-the-loop.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    MEASURED 2026-10-07 18:32–18:38Z (360 s Profiler session on the live daemon, pid 114, restarted
    18:27Z on c942c2a53 = W1-T6246): busy 353.8 s of 360 s; spawn 203.6 s self. W1-T6246's
    reader-agreement block is gone and defaultBlockingSleepSync fell from 55 s to 1.7 s, but the
    longest run (160.8 s) is runTask → projectPlan → deriveStatus → changedFiles →
    uncreditedBuildWarning, with 145.8 s under ghExecFile. READ on origin/main: buildBatchedGithub's
    `changedFilesCache` option is "the BOARD's non-blocking, durable changedFiles … Omitted ⇒ the
    synchronous memo". run-task.ts wires it at two constructions (the board gateway and one near
    line 36745) but not at the lane gateway factory (`githubFactory ?? ((o, r) =>
    buildBatchedGithub(o, r, { log, snapshotCache: boardSnapshotFor(o, r) }))`) nor at runTask's
    default (`opts.github ?? opts.githubFor?.(owner, task.repo) ?? buildBatchedGithub(owner, task.repo)`).
  design: |
    Hand every daemon-side gateway the same createChangedFilesCache provider the board uses (one per
    owner/repo, shared), so a changedFiles read either returns the durable cached answer or defers
    (the provider's existing `undefined` = not yet known, which uncreditedBuildWarning already
    treats as no warning yet), never a synchronous gh call on the calling thread.
  acceptance:
    - claim: "the daemon's lane gateway factory gives its gateways the non-blocking changed-files provider"
      proof: 'grep: test("W1-T6259: a lane gateway reads changed files through the non-blocking provider" in test/a-dispatched-runs-projection-reads-changed-files-off-the-loop.test.ts'
    - claim: "a dispatched run's projection makes no synchronous gh call for changed files"
      proof: 'grep: test("W1-T6259: a dispatched run projects with no synchronous changed-files gh call" in test/a-dispatched-runs-projection-reads-changed-files-off-the-loop.test.ts'
  falsifier: |
    Keep the factory as it is: a projection over a fixture with an uncredited merged PR calls the
    gateway's synchronous exec seam for `pulls/<n>/files`, and the second test fails.
