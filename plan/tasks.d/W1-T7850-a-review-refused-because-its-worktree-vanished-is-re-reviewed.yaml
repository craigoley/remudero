    - claim: "a host-gap refusal releases the review key for a fresh review of the same head with no freshness probe"
      proof: 'grep: test("W1-T7850: a vanished-worktree refusal is re-reviewed at the same head with no freshness backoff" in test/a-review-refused-because-its-worktree-vanished-is-re-reviewed.test.ts'
    - claim: "an unreadable refusal with no host gap keeps today's freshness backoff"
      proof: 'grep: test("W1-T7850: an unreadable refusal with no host gap keeps the freshness backoff" in test/a-review-refused-because-its-worktree-vanished-is-re-reviewed.test.ts'
  falsifier: |
    Leave the freshness reader as it is. A removed repo dir then grades plain unreadable with no host gap, and the
    first test fails. Leave `priorActionsFromLedger` routing every unreadable refusal to `reviewFreshnessRefusals`.
    The #10783 ledger shape (one refusal, then stale probes) then holds the PR with "awaiting proven freshness" and
    no re-review, and the third test fails. Route every unreadable refusal to a re-review, and the fourth test sees
    a ref-lock refusal skip its backoff and fails.
