  design: |
    1. Key. The harness reads, through the hardened leaf (hostWorktreeGit or hostWorktreeGitAsync, never a
       synchronous spawn on the daemon loop):
       - tree: `git rev-parse HEAD^{tree}`
       - head: HEAD's sha
       - base: the sha of origin/main the gate judges against
       - the push line the hook receives: local ref, remote ref and remote sha
       - recipe: `git rev-parse HEAD^{tree}` of the harness's own code root. A changed hook or script is a new recipe.
       The worktree must be clean: `git status --porcelain --untracked-files=all` is empty, because the hook's
       checks read the working directory as data. A dirty tree records nothing and reuses nothing.
       head and the push line are part of the key because hooks/pre-push's head-identity-gate and
       worker-branch-shape read the commit and the remote sha, not only the tree.
    2. Record (new src/lib/gate-verdict-record.ts, exporting recordPushGatePass and reusablePushGatePass). It lives under <config.root>/state/gate-verdicts/,
       outside every worktree. The daemon process writes it atomically (temp file, then rename), and only for a
       pass. Fields: the key, result, duration_ms, ts, observed_by (the harness function that awaited the exit
       status) and trust: "harness-observed". A record is never read from, or derived from, any path under a
       worktree, including coverage/preflight-summary.json. Retention: writing a record drops every record whose
       tree is not the HEAD tree of a registered worktree. No constant is added.
    3. The push gate reuses. Before running the hook, worktreePushExec and worktreePushExecAsync compute the key. An
       exact pass record skips the hook and ledgers push_gate.reused (tree, head, base, recipe, the record's ts and
       observed_by). A missing, unreadable, malformed or mismatched record runs the hook as today, and a pass is
       recorded. So a repeated push of the identical tree reuses its earlier pass.
    4. The pre-open gate asks the push gate early. After its fast gate, runPreopenGate runs the same harness push gate
       on the clean committed tree. It uses an exported runner from git-push.ts, so the hook, env allowlist, gate HOME
       and sandbox are the same as the push leaf's. A refusal joins the failed steps handed to the worker, named
       push-gate, before the PR opens. A pass is recorded, and the push of the identical tree that follows reuses it
       under step 3. Add a runPushGate seam to PreopenGateOptions. Its default is the real runner, and one test runs
       that default for real (doctrine/coverage-traps/partial-fakes-fire-defaults.md).
    5. Ledger. implement.preopen_gate and every push-gate run, whether reused or run, carry tree, head, base and
       recipe, so the reuse rate can be read from the ledger.
    6. Not changed: the fast gate's own steps and their verdict, which stays advisory to reuse. The worker's prompt.
       CI. The hook's checks and RMD_PREPUSH_GATES. The restart checkpoint push (prGates: false). A record never
       turns a refusal into a pass. A hook failure is never recorded.
    Census suites the builder joins: run `rmd census-membership` and the leaf censuses
    (test/a-host-git-call-into-a-worker-worktree-runs-no-worker-code.test.ts,
    test/every-host-git-spawn-into-a-worktree-uses-the-hardened-leaf.test.ts,
    test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts).
    Tests go in test/a-push-gate-verdict-on-a-tree-is-reused-not-re-run.test.ts, with each title written as test("<title>", verbatim as in the proofs.
