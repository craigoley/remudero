  rationale: |
    THE TRUST BOUNDARY, READ at origin/main. This record keeps to it.
    - A verdict is reusable only if the harness observed it: the daemon process awaited the exit status of the
      harness's own gate code, and that code ran with the worktree as data.
    - The push gate meets this. The push leaf (git-push.ts worktreePushExec and worktreePushExecAsync) runs the
      HARNESS's hooks/pre-push. Its scripts run from the hook's own code root, never from the tree being pushed
      (W1-T6120). Code the branch owns runs in the proof sandbox (W1-T6138). The env is an allowlist
      (prePushGateEnv). The leaf awaits the hook's exit status.
    - The pre-open fast gate does not meet it. When the worktree holds bin/rmd, which every core build does,
      preopenGateLaunch runs the worktree's own bin/rmd, or that worktree's run-task bundle. So the branch's code
      computes the verdict. defaultRunGate's execFile is given no env and no sandbox. readGateSummary then reads
      coverage/preflight-summary.json inside the worker's worktree. That verdict is worker-controlled. It is never
      recorded as reusable, and nothing here may let it skip the push gate.
    - Worker runs are not harness verdicts either. prompt-render.ts asks the worker to run census-precheck
      and the affected-suite reach ratchet itself.
