  rationale: |
    OBSERVED ON MAIN AT 41231c670. The required `source-size` workflow job runs
    `source-size-ratchet`, whose package entry explicitly passes the legacy `--baseline` flag.
    The main-push ceiling block and CI-parity mirror run the same command. Worker prompts tell
    every implementation worker to run it and record growth before pushing. FAST_GATE_STEPS grants
    a failing `source-size` check the baseline as a remedy, and sweep maps that stable check name
    back to the recording command. PR #4603 demonstrated the result: tested daemon growth was red
    until automation added a second commit that changed only the baseline from 3002 to 3500.

    This contradicts the material replacement already on main. W1-T2734's default command emits a
    schema-versioned, PR-relative signal and returns zero for growth while failing closed when it
    cannot measure. W1-T2862 retains that successful output and files one deduplicated priority-1
    decomposition feedback item for a material hotspot. The new signal therefore preserves
    visibility and creates work without making the feature PR red; the legacy ratchet adds only a
    metadata edit, a CI cycle, merge-conflict surface and fix dispatch.

    W1-T196 and W1-T2381 also declare sweep.ts and sweep.test.ts, but solve unrelated attribution
    and repeat-escalation routing. This task changes only the source-size recordable-ratchet
    classification; it neither supersedes nor alters either task's disposition behavior.
  design: |
    Keep the stable required check name `source-size`, but make its workflow and CI-parity mirror
    run `source-size-signal` with enough git history to resolve the merge base. Remove the absolute
    source-size baseline from the main-push ceiling block: a PR-relative signal is not an absolute
    ceiling and on main its refreshed base equals HEAD. Update the worker contract to run the signal
    and explain that growth passes while measurement failure does not.

    Rename the explicit compatibility package command to `source-size-baseline:legacy`, retain the
    underlying `--baseline` implementation for historical fixture reproduction and declared
    generated-file conflict recovery, and remove source-size's baseline remedy from the active
    fast-gate/fix/sweep path. A red `source-size` check then reaches diagnosis as a failed sensor;
    automation must never edit an unrelated number and retry the same failed measurement.
  acceptance:
    - claim: "positive source growth runs under the stable required source-size check and exits green while an unreadable base or failed measurement remains red"
      proof: "grep: Source-size signal (growth informs review and follow-up work in .github/workflows/ci.yml"
    - claim: "no workflow, CI-parity entry or worker contract invokes the legacy baseline ratchet"
      proof: "grep: source-size-baseline:legacy in package.json"
    - claim: "a red source-size sensor has no baseline remedy and cannot enter the recordable-ratchet auto-repair rung"
      proof: "grep: deliberately no `remedyFiles` in src/lib/ci-parity.ts"
    - claim: "the explicit legacy baseline implementation remains callable for historical fixtures and generated-file conflict recovery under a name that cannot be confused with the active gate"
      proof: "grep: source-size-baseline:legacy in src/lib/sweep.ts"
  falsifier: |
    Close without implementation if the required `source-size` job already runs the nonblocking
    signal, or if material growth cannot reach the W1-T2862 consumer. Both were checked: ci.yml and
    CI_PARITY_TABLE run the explicit baseline command, while source-size-followup.ts and its worker
    call site are present and tested.
  note: |
