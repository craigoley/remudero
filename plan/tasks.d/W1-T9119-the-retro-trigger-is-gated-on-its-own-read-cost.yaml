  design: |
    No fixed count, no fixed byte bound and no timer.
    1. THE CHECK READS ONLY WHAT IT USES. `readRetroTriggerLedgerAsync` reads the union from a window derived from its
       own inputs: `since` = the marker's ts, widened back to the earliest `run.start` of any run still unsettled at the
       marker (the runs `taskIdsWithRuns` can need), read from the previous check's result; with no marker or no
       previous result it reads the whole union once, as today. Repeat reads go through the incremental union (or its
       digests) so a tick re-reads only new rotations and the live tail. Off the loop, as today.
    2. EACH READ IS MEASURED. Every check ledgers `retro_trigger.ledger_read` {since, rotations_opened, digests_used,
       bytes_decompressed, rows, ms}. These rows are the evidence the gate below learns from.
    3. THE GATE IS THE READ'S PROJECTED COST AGAINST MEASURED HEADROOM. Replace the `overBound` borrow. Before the
       check, project its cost: the decompressed bytes of the rotations in its window that it holds no digest for,
       estimated as their on-disk bytes times the expansion ratio observed by its own recent `retro_trigger.ledger_read`
       rows (no rows yet: the ratio of the newest rotation, measured once). Defer only when that projection exceeds the
       daemon's measured heap headroom at that moment (`v8.getHeapStatistics()` limit minus used, the same figures
       `daemon.alive` reports). Ledger the projection, the headroom and the reason on every deferral. The compaction
       rung keeps its own trigger; nothing else reads `overBound`.
    4. A PERSISTENT DEFERRAL IS NAMED, WITH N DERIVED. Count consecutive deferrals with the same reason class. When
       their span exceeds the retro's own expected interval, ledger `daemon.retro_trigger.deferral_persisting` once per
       episode {reason, first_deferred_at, observations, expected_interval_ms, last_retro_at}. The expected interval is
       learned: the median gap between the last retros' `retro_triggered` rows in the union; with fewer than two, the
       policy's `daysThreshold`. N (observations) is that interval divided by the median gap between this daemon's
       deferral observations, so it is never configured. A new `retro_triggered` row ends the episode.
    Tests go in test/the-retro-trigger-is-gated-on-its-own-read-cost.test.ts, with `test(` titles verbatim as in the
    proofs below. Drive the tick with fake `checkRetroTrigger`/`checkLedgerCompaction` deps, a fake heap reader and a
    fixed clock; drive the read with a temp state dir of small gzip rotations.
