  note: |
    THE LIVE PROBES WERE READ-ONLY AND ARE LISTED SO THEY CAN BE RE-RUN. Over ssh, inside the
    running container: `ps -eo pid,ppid,etimes,args` for the process tree, `hostname` and
    `docker inspect --format '{{.Id}}'` for the host/lock comparison, `cat /proc/uptime` and
    `ps -o etimes= -p 1` for the boot-time signal, `command -v ps` for the syscall's availability,
    and `docker inspect --format '{{range .Config.Env}}...'` for the throttle. Nothing was
    started, stopped, signalled or written.

    `files:` IS THREE PATHS AND EACH EARNS ITS PLACE. `src/lib/fs-race-safe.ts` holds
    `isHolderStale` and is where the boot-side rung lands; `deploy/entrypoint.sh` is where the
    signal chain is broken and where a `trap` or a final-attempt `exec` restores it; the test is
    new rather than appended, because the existing lock suites are large and this repo has
    measured file-level coverage crashes in large shared test files. The shard's own path is
    absent. NOTE THAT `deploy/entrypoint.sh` IS A BAKED PATH: it ships only on an image rebuild,
    not on merge, so the shutdown half of this fix is inert until the operator triggers one — the
    boot-side half ships immediately via the mount.

    RISK IS `high` UP FRONT AND THE BAND IS RULE 19's SPAN: a source module, a baked deploy
    script and a new test. If the sizing check disagrees at authoring time, record the refusal
    rather than pre-inflating.

    EVERY FIGURE IS DATED 2026-08-20 AND WILL DRIFT — RE-RUN THE PROBE. The one measurement this
    shard could NOT take is which rung of `isHolderStale` returned false on the real occurrence;
    the daemon's refusal line prints the holder's pid, host and startedAt, so capture it next time
    rather than inferring it.

