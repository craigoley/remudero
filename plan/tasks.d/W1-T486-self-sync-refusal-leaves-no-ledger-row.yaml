- id: W1-T486
  title: "`checkCliFreshness` is the only refusal path in the fleet that leaves no ledger row — it warns to stderr and returns, so nobody can say how often the dirty branch fires versus the diverged one, and W1-T446's ruling has sat unanswerable for two days"
