  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    `>=2 subsystems while risk<high`, and `files:` spans `src/lib/` and `test/`. The band is Rule 19's
    SPAN, not blast radius -- the change is an optional sink parameter and three call sites.

    `verify: auto` IS CORRECT HERE EVEN THOUGH THE SUBJECT IS INSTRUMENTATION. Every criterion is
    decidable over an INJECTED sink with no network and no real ledger: a fake records what was
    emitted, and the three refusal branches are reachable with fixtures the declared suites already
    build. This task does NOT ask the operator to rule on anything -- it exists so that W1-T446's
    ruling BECOMES answerable, which is a different thing from making it here.

    `files:` IS DERIVED BY INVOCATION COUNT, counting OCCURRENCES rather than lines. `src/lib/self-sync.ts`
    holds every branch. On the test side, `checkCliFreshness(` is invoked 10 times in
    `test/self-sync.test.ts`, 10 in `test/worktree-verb-containment.test.ts` (W1-T452's suite, which
    owns the worktree branch that shadows dirty) and 5 in `test/self-sync-branch-guard.test.ts`
    (W1-T445's suite, which owns off-main); every other file mentioning the symbol invokes it ZERO
    times. All three are declared because the three refusal branches are split across them and a row
    added to one branch must be proven on all three.
    `src/run-task.ts` IS DELIBERATELY NOT DECLARED: it emits `daemon.install_freshness`, but that comes
    from `ensureInstallFresh` and this task does not touch it. At 19,588 lines every task declaring it
    serialises against every other that does (W1-T471).
    The shard's own path is NOT declared: adding it converts the endemic proof-scope warnings into one
    hard `rule15-filing` violation."
