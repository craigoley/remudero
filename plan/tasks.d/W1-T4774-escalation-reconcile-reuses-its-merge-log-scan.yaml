  files: [src/run-task.ts, test/escalation-reconcile-reuses-its-merge-log-scan.test.ts]
  rationale: |
    A live CPU profile of remudero-daemon on 2026-09-29 put
    sweepEscalationReconcile > buildEscalationReconcileCandidates > readMergedPathsByPr at 64 s, and
    readMergeSubjectsByPr at 15.5 s, out of 25 minutes. Both are execFileSync git log scans over
