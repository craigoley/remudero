    - claim: "a live branch-claim holder or any process whose cwd is the owner or its descendant preserves W1-T2863's stand-down and performs no remove, lock reclaim, checkout or worker spawn"
      proof: "unit test: test/fix-branch-checkout-serialization.test.ts"
    - claim: "a dirty worktree, staged change, untracked file, detached head, local-ahead commit, foreign path or changed remote head is never reclaimed"
      proof: "unit test: test/fix-branch-checkout-serialization.test.ts"
    - claim: "an unreadable, unsupported, permission-denied or bounded-out process/branch/tree probe fails closed with a named checkout-claim decline"
      proof: "unit test: test/fix-branch-checkout-serialization.test.ts"
    - claim: "successful recovery re-reads Git registration, emits one bounded checkout_owner_reclaimed record and then uses the existing exclusive branch claim and checkout guard"
      proof: "unit test: test/fix-branch-checkout-serialization.test.ts"
    - claim: "the recovery never kills a process, force-removes a worktree, resets or deletes a branch, weakens live-upstream reaping, or adds a timer, sleep or background lifecycle"
      proof: "unit test: test/fix-branch-checkout-serialization.test.ts"
    - claim: "removing only the proven-abandoned recovery arm reproduces PR #4236's permanent registered_worktree_owner stand-down and fails the focused suite"
      proof: "mutation test: test/fix-branch-checkout-serialization.test.ts"
  falsifier: |
    Close without implementation if current main already distinguishes a proven-abandoned
    registered fix owner from a surviving worker before returning `registered_worktree_owner`, or
    if another existing reaper can remove a clean live-PR fix residue under the same safety proof.
    The live registry, absent process/lock and hour-long unchanged head refute both alternatives.
