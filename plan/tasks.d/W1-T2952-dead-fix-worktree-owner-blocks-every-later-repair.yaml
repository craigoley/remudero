- id: W1-T2952
  title: "A DEAD FIX WORKTREE OWNER BLOCKS EVERY LATER REPAIR — W1-T2863 correctly protects a registered branch across freshness restarts, but the shared reaper correctly keeps every live-PR branch, so a clean lockless residue can own the branch forever"
