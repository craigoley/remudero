  note: |
    THE FALSIFIER IS A NEW FILE, NOT AN APPEND. test/status-board-operator-message.test.ts is
    W1-T2806's falsifier and carries coverage-load-bearing assertions; appending this defect's
    proofs to it would make one suite answer for two tasks. A purpose-named file also lets the
    pure-path proof earn judgeCriterion's not_yet_built carve-out at filing time.

    RISK BAND IS RULE 19'S SPAN AND band_meaning SAYS SO. subsystemsOf derives concerns from file
    STEMS, so src/lib/status-board.ts and test/status-board-operator-message.test.ts read as two
    even though the change is one concern plus its falsifier. Declared rather than worked around.

    THE DEFECT WAS INTRODUCED BY W1-T2806 AND IS RECORDED AGAINST IT, NOT HIDDEN. The wiring that
    made the board's structural gaps visible left its own projection outside the guard it added.

    EVERY COUNT HERE IS A QUERY AND NOT A NUMBER TO CARRY. The zero try blocks, the control of 11,
    the 440 lines of headroom, the 49-minute window and the jscpd threshold all move with the tree.
    Re-run them; do not quote them forward.
