- id: W1-T3158
  title: "NO SURFACE SAYS WHICH MODEL AND EFFORT ACTUALLY RAN A TASK, OR WHEN — the console shows `selected.model` / `selected.effort` for the routing decision it is ABOUT to make, and nothing anywhere shows what DID run; the ledger holds the answer in `run.start`'s `mount.model`/`effort` and `implement.done`, `runModelIndex` already joins them, and the retro's own lane table attributes only 98 of 200 implement rows"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 18.00
  files: [src/lib/serve.ts, test/no-surface-says-which-model-ran-a-task.test.ts]
