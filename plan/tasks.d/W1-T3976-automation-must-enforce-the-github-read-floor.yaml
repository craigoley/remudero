- id: W1-T3976
  title: "UNATTENDED REVIEW AND DAEMON LANES LEAVE THE GITHUB READ FLOOR ADVISORY — the transport can refuse a burst, but production handlers never opt into enforcement, so a review pass can keep reading until GitHub's secondary limiter returns 403"
  repo: remudero
  depends_on: [W1-T3297, W1-T529]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 18.00
  files: [src/lib/github-transport.ts, src/run-task.ts, test/the-transport-paces-its-own-reads.test.ts]
  origin: "operator-session#review-admission-and-github-cadence-2026-09-21"
  note: "reservation hand-off: unknown -> file-W1-T3976-1790022675000"
  plan_refs: [W1-T3297, W1-T529, W1-T3969]
  status: merged
  attempts: 0
  rationale: |
    The transport already has the right shared stamp and an explicit `enforce` mode, but its
    library default is deliberately advisory. That is safe for injected diagnostics and unsafe for
    the unattended lanes that repeatedly read the board: a review attempt in this session emitted
    `gh read cadence ... advisory` only 117 seconds after the previous read, then GitHub returned
    a secondary-limit 403 even though the primary quota probe said 5000/5000. The resulting
    `remudero-review` could not post, leaving a green PR blocked on the required context.

    W1-T3297 correctly kept the library default advisory so a generic caller cannot be stopped by
    an accidental cache stamp. W1-T529 correctly makes the budget floor degrade instead of retrying.
    What is missing is the production boundary that makes those decisions true for the daemon and
    the CLI review lane: when no operator mode is supplied, the whole unattended lifetime must
    run with `RMD_GH_TRANSPORT_FLOOR=enforce`, while an explicit environment choice remains
    authoritative and the wrapper restores it for an in-process caller.
  design: |
    (i) Add one async, injectable wrapper at the transport boundary. It sets `enforce` only when
         the caller supplied no mode, restores the prior value in `finally`, and never changes the
         transport's advisory library default.
    (ii) Wrap the CLI `review` handler and the long-lived `daemon` handler with that same wrapper.
         The daemon's child workers inherit the enforced mode; writes remain exempt and the existing
         stand-down path records a bounded read refusal instead of retrying the same burst.
    (iii) Prove both call sites and both environment directions in the transport's existing suite.
         Do not add another stamp, another rate-limit probe, or a new timer.
  acceptance:
    - claim: "unattended automation enforces the read floor for its lifetime and restores the caller mode"
      proof: "unit test: unattended automation enforces the floor for its lifetime and restores the caller mode"
    - claim: "the review CLI handler enters the shared enforcement boundary"
      proof: "grep: withGhTransportFloor(() => reviewCommand( in src/run-task.ts"
    - claim: "the daemon CLI handler enters the shared enforcement boundary"
      proof: "grep: withGhTransportFloor(() => daemonCommand( in src/run-task.ts"
  falsifier: |
    Run the wrapper with no mode and with an explicit `advisory` mode, then exercise a read inside
    the 180-second stamp window. The first must refuse before spawning `gh`, the second must preserve
    advisory behavior, and after either call the caller's environment must be unchanged. Remove
    either handler wrapper and its grep proof must fail; replacing the shared wrapper with a second
    stamp or a retry loop is out of scope and must not satisfy this task.
