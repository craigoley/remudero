  design: |
    Add bounded integration regressions around the existing bin/rmd -> planCommand -> spawnWorker
    path. Run from a disposable target repository outside Core's node_modules ancestry with valid
    target plan/mount configuration and no tsx, settings or hooks of its own, using the explicit
    harness settings/install fixture. Use isolated state, local Git fixtures with fixture-local
    identity, and local deterministic Codex app-server/exec stubs; no remote PR, credentials,
    network, subscription call or live dispatch. Do not replace spawnWorker or its real default
    probe with an always-successful fake. Run a matching fresh Core-context control and assert both
    reach the Architect. Control inherited loader/preload flags and cold capacity caches so the
    target's missing dependency is actually exercised. Assert the intended lookup corpus with a
    successful stub handshake, not merely absence of a tsx error.

    INVARIANT planning-context: The harness supplies runtime, settings and hooks; target plan,
    mounts, owner/repository and worker cwd remain target-scoped. A deterministic CLEAR response
    produces no plan edits or PR in both target and Core cases, and fixture dependencies are unchanged.
    INVARIANT planning-gates: Architect tier/subscription routing, ownership, ID reservation,
    allowed plan paths, task lint and acceptance proof checks still gate a PROPOSED result before
    publication; ordinary review, hosted CI and protected merge retain authority afterward.

    In the separate filing-gates suite, use local/injected publication boundaries to demonstrate a
    valid plan-only proposal reaches the existing publisher once, an invalid proof or out-of-plan
    edit is refused before publication, and no worker can edit its own implementation criteria.
    Assert the existing gate calls and preserved publisher inputs; do not pretend an offline test
    proves hosted CI or protected merge has passed. Keep the real bootstrap portion from the first
    suite; downstream publication can be recorded offline. Do not refactor production planCommand
    for a test-only shortcut. Confirm test/worker/run-task placement with rmd test-place; use package aliases
    and the shared root helper. Clean up only the fixtures each test owns.
    Give the first suite an executed test titled "W1-T12517 target without tsx reaches its architect"
    so the added regression artifact has a positive head-versus-base proof. The whole-file guard
    proofs execute its behavior after W1-T12516 has already corrected the runtime.

    This task adds regression evidence only. If it exposes another production launch defect, name
    the exact site and file a separate bounded amendment instead of weakening a gate or expanding
    scope. T172 remains untried until this task, W1-T12516 and the separate W1-T12515 Console proof
    correction have landed through their normal gates. Preserve its failed branch unchanged.
  acceptance:
    - claim: "invariant:planning-context — real rmd planning reaches its Architect without target tsx, retains target context, and passes the fresh Core CLEAR control"
      kind: guard
