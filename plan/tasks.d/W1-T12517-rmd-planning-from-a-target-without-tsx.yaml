    - claim: "invariant:planning-gates — valid plan-only proposals use existing publication while malformed proofs and unauthorized edits are refused before it"
      kind: guard
      proof: "unit test: test/worker/run-task/rmd-planning-without-tsx-keeps-filing-gates.test.ts"
    - claim: The added planning suite declares the target-without-tsx bootstrap regression
      proof: "grep: W1-T12517 target without tsx reaches its architect in test/worker/run-task/rmd-planning-keeps-target-context-without-tsx.test.ts"
  falsifier: |
    With W1-T12516's loader fix removed, the target planning child must fail before the Architect
    while the Core control succeeds; restore it and both reach the stub Architect. Independently
    plant an invalid proof and out-of-plan edit: each must leave the publisher uncalled. Record
    actual executed test counts. No green result from a fake probe or zero matched tests counts.
