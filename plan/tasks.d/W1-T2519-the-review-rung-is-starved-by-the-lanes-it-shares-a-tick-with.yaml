- id: W1-T2519
  title: "THE REVIEW RUNG IS STARVED BY THE DISPATCH LANES IT SHARES A TICK WITH — `deps.sweep()` runs ONCE per iteration and the iteration cannot come round again until `Promise.allSettled` over that tick's lanes settles, so three 400-turn implement runs block every review for the length of the longest; daemon.ts's own comment measures the gap at p50 39.6s, p95 32.1m, max 64.5m, and a green PR observed 1h47m with zero reviews posted fleet-wide"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 20.00
  files: [src/lib/daemon.ts, test/the-review-rung-is-starved-by-the-lanes-it-shares-a-tick-with.test.ts]
  origin: "operator-session#a-green-pr-waited-two-hours-for-a-review-2026-08-30"
  plan_refs: ["W1-T1065", "W1-T1044", "W1-T2504", "W1-T2513"]
