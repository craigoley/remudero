- id: W1-T5867
  title: "A REFUSED MERGE START ESCALATES IN THE SAME RUNG — W1-T5864 records a merge-conflict round whose merge never started as a failed strike, but the unchanged-tree pre-strike gate can then stand the next round of the same rung down, so escalation waits for another sweep pass"
  repo: remudero
  depends_on: [W1-T5864]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 3.00
  risk: high  # Rule 19: one concern — a refusal strike is never followed by a no-op stand-down in the same rung
  band_meaning: span
  origin: "operator session 2026-10-05: W1-T5864 (#9322) builder's follow-up 1"
  plan_refs: [W1-T5864, W1-T4458]
  files: [src/run-task.ts, test/a-refused-merge-start-escalates-in-the-same-rung.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-05 on W1-T5864's head 5b72863f (#9322). A merge that never starts (fetch failed,
    or already up to date while GitHub says dirty) is now a failed strike with no worker spent,
    and the rung continues. When `captureWorktreeSnapshot` is wired, the unchanged-tree
    pre-strike gate sees the same tree on the next round and stands it down; the strike is in the
    ledger, so the next sweep's budget shrinks and escalation happens at the cap one pass later.
    For a stranded dirty PR (the #9301 shape) that is one more sweep interval before an operator
    is told.
  design: |
    After a merge-start or MERGE_HEAD refusal, the same rung retries the merge start (a fresh
    fetch) rather than running the unchanged-tree gate. A second refusal in a row escalates
    `merge_conflict_unresolved` immediately, naming both refusal reasons.
  acceptance:
    - claim: "two consecutive merge-start refusals in one rung escalate merge_conflict_unresolved in that rung naming both reasons, a refusal followed by a started merge proceeds to the worker, and a normal unchanged-tree stand-down outside merge mode is unchanged"
      proof: "unit test: test/a-refused-merge-start-escalates-in-the-same-rung.test.ts"
  falsifier: |
    Let the unchanged-tree gate run after a refusal: the second round stands down and the test sees
    no escalation in the rung.
