- id: W1-T6113
  title: "A CONSUMER REPO'S OPEN-WEIGHT unit_test IS NICED, BOUNDED AND SCOPED — PR #9753 (W1-T6091) runs a harness-derived suite list only in a tree carrying scripts/diff-class.mjs; in console and site the check still runs the whole-tree argv at default priority and node's default concurrency, ended only by the wall-clock timeout"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the consumer-tree branch of the open-weight unit_test check
  band_meaning: span
  origin: "operator session 2026-10-06: left deliberately by PR #9753 (W1-T6091), revisited"
  plan_refs: [W1-T6091, W1-T6090, W1-T3617]
  files: [src/lib/worker-provider.ts, test/a-consumer-open-weight-unit-test-is-bounded.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-06 on origin/main 23c0e7dfe. src/lib/worker-provider.ts `run_check` takes the scoped path
    only when `existsSync(join(cwd, OPENWEIGHT_UNIT_TEST_SELECTOR_MARKER))` (scripts/diff-class.mjs);
    otherwise `openWeightCheckArgv("unit_test")` returns OPENWEIGHT_CHECKS.unit_test, `node ... --test
    --test-reporter=tap` over the whole tree, without the OPENWEIGHT_UNIT_TEST_NICE prefix or
    OPENWEIGHT_UNIT_TEST_CONCURRENCY the scoped path applies. The comment on
    OPENWEIGHT_UNIT_TEST_SELECTOR_MARKER says this was deliberate: a consumer has no model to narrow by,
    and the timeout still ends the call, now ledgered as `cash.run_check`.
  design: |
    THE CHEAP CANDIDATE. (1) The consumer branch runs under the same nice prefix and explicit
    `--test-concurrency` as the scoped branch (W1-T6090's testRunConcurrency when it has landed, else
    OPENWEIGHT_UNIT_TEST_CONCURRENCY). (2) Bounded scope, derived by the harness from git and never from
    the model: the test files the worktree's diff against its merge base adds or changes, plus test
    files whose basename matches a changed source file's; none is an `empty` outcome, and more than
    OPENWEIGHT_UNIT_TEST_MAX_SUITES is the same named refusal the scoped branch uses. The whole-tree argv
    is never run. Both outcomes are ledgered on `cash.run_check` with the scope rule that chose them.
    THE COSTLY CANDIDATE, a per-consumer import-graph selector, waits until `cash.run_check` rows for
    consumer repos show the basename rule refusing or missing failures CI then catches.
  acceptance:
    - claim: "in a tree without the selector marker the unit_test check runs under nice with an explicit test concurrency, over only the diff's changed test files and the test files matching a changed source file's basename, returns empty when there are none and refuses past the suite cap, and never runs the whole tree"
      proof: "unit test: test/a-consumer-open-weight-unit-test-is-bounded.test.ts"
  falsifier: |
    Leave the consumer branch on the fixed argv: the fixture consumer tree's run carries no explicit
    test files and the scope test fails.
  note: |
    PR #9753 chose the whole-tree argv on purpose; this revisits it as the cheap bounded scope, not a
    selector. Consumer suites may not be node --test (the fixed argv already assumes they are); if a
    consumer's suite is not, the check refuses by name rather than run.
