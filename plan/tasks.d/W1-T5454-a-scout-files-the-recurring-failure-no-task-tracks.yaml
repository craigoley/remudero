  falsifier: |
    Cover a symptom with a queued task that cites its step and the scout still files it; or file past the
    queue bound; or credit the class on a merge while the symptom's rows kept growing. The affected proof must
    fail. CLOSE THIS TASK without implementation if `git grep -n "scoutGardenSpec" src/` shows a
    scout already exists.

