  rationale: |
    READ 2026-10-03 over origin/main 231b7673b. The registered gardens (REGISTERED_GARDEN_NAMES in
    src/lib/garden-registry.ts) are plan, gate, test, config, export, ci-friction, selector-shadow,
    evidence-coverage, overseer, machine-judge, hot-file, host-resource and backlog. Each starts from one
    measured signal in its own domain. The plan gardener only merges duplicates and retires done tasks
    (PLAN_GARDEN_CLASSES); the backlog gardener only places or retires an EXISTING task. Nothing starts
    from the ledger as a whole and asks which recurring failure no task covers. A person finds those today.
    The machinery to land one already exists: `renderMachineShard` (src/lib/machine-filing.ts) renders and
    lints a record with the shared header, the machine-filing judge rules on its risk and releases a
    `proceed` to `verify: auto`, and `backlogCitedSteps` (src/lib/backlog-gardener.ts) already says which
    ledger steps a task cites. This task adds the producer only.

  design: |
    (i) src/lib/scout-gardener.ts exports `scoutGardenSpec`, a GardenSpec (src/lib/gardener.ts) with ONE class,
    `file-uncovered-symptom`. It is registered in the same task, so the module is reached by the daemon and not
    only by its own tests: add `"scout"` to REGISTERED_GARDEN_NAMES in src/lib/garden-registry.ts (after
    `"backlog"`, with its minimum pass interval beside the others) and a `scout` branch to
    `buildRegisteredGarden` in src/run-task.ts over the same workspace and ledger writers the backlog garden
    uses. The overseer discovers a gardener from ledger step suffixes, so it watches the scout from its first
    scorecard row with no overseer edit. Declared risk:high with band_meaning span only because Rule 19 counts the
    module, the registry and the builder as separate concerns; it is not a risky change.
    (ii) INVENTORY: read the ledger union (readLedgerUnionRecordsSync) over a trailing window for steps whose
    name carries a failure shape (`failed`, `refused`, `unavailable`, `escalated`, `unhealthy`) and count rows per
    step per half-window. A symptom is a step whose count grew or held across both halves.
    (iii) UNCOVERED means NO queued task and NO task merged in the trailing window cites the step
    (`backlogCitedSteps` over every plan task) AND no gardener's own scorecard already prices it. A covered
    symptom is never filed. A step the ci-friction gardener prices is covered by definition.
    (iv) FILE through `renderMachineShard`: the family origin is `scout:<step>`, files are read from the
    ledger rows' own `file` or `module` fields when present and otherwise left to the worker's recon, cost is the
    row count priced with `costPriority`, and a record the linter refuses is never written. Filers do not choose
    `verify:` or `risk:`; the machine-filing judge rules, and its deterministic backstop still sends a risky
    record to a person.
    (v) ADMISSION IS BOUNDED BY THE QUEUE. The queue grew 225 to 266 in a day while 32 tasks merged
    (W1-T4941). The scout files at most as many records per pass as the fleet merged in the trailing day, and
    NONE while the unprioritized share of the queue exceeds the backlog gardener's own band target. This bound
    is a backstop; its comment must say so.
    (vi) JUDGED BY SURVIVAL, NOT BY MERGE: after a scout-filed task merges, the symptom's row count over the
    next window is the metric (a symptom that stopped is a credit; one that kept growing is a debit), so the
    class's Beta record cannot be earned by churn.

