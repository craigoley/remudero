- id: W1-T5454
  title: "NOTHING LOOKS FOR WORK NOBODY HAS ASKED FOR — fourteen gardeners tend what already exists (merge, retire, band, prune, tier, tune) and each reacts to one narrow signal; a step that keeps failing or refusing in the ledger with no queued or recently merged task citing it waits for a person to notice. A scout gardener files that finding through the machine-filing path"
