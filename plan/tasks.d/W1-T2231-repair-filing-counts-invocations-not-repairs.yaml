  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Filed at `medium` first and MEASURED: the
    linter refused it — "[sizing] spans 2 distinct subsystems/concerns (repair-filing-counts-invocations,
    sweep) at risk:medium — Rule 19: raise to risk:high or decompose". Rule 19 derives the concern from
    each declared path's STEM, so a source file and its own test trip it whenever the test is not named
    after the source. `files:` here is one source file and one new test; the actual blast radius is
    small — a counting predicate and the evidence it selects, with nothing deleted and no gate moved.
    Decomposing the predicate from the test that falsifies it is not a real decomposition.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/repair-filing-counts-invocations.test.ts`, declared in `files:`, so on this filing PR
    it resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED, NOT ASSUMED. `rmd check-proof` on the declared path reads
    `parse: OK — kind=test`, `hits: 0`, `verdict: fail` — it names no existing file. The SAME verb on
    an EXISTING pure path, `unit test: test/sweep-repair-filing.test.ts`, reads `hits: 130`,
    `verdict: pass` — so the dialect DOES execute a pure path when one exists, and the absent path's
    non-execution is the forward reference rather than a broken proof. `check-proof` cannot see this
    shard's `files:` declaration, which is why its `fail` is expected and is not the reviewer's verdict.

    THE HEADLINE EXPECTATION IS CORRECTED IN RATIONALE (5) RATHER THAN CARRIED. The inflation is real
    and large — 1.4x to 2.2x on every `blocked-fixable` bucket — but it changed ZERO filing decisions
    over this corpus, because every due bucket clears the threshold of 3 on the spending count alone
    with 8 to 30 to spare. A shard that claimed the threshold had fired on phantom repairs would be
    unsupported by the very measurement it rests on. What IS defective is the number the entry reports
    and the exemplar it carries, which is what the acceptance criteria are written against.

    THE RAW MISS FIGURE MUST NOT BE QUOTED ALONE. 46% conflates 59 rows that carry the synthetic
    `SWEEP` task id — unjoinable by construction — with 40 genuine no-spend stand-downs out of 154
    joinable seeds (26%). Both numbers are recorded so neither is mistaken for the other.

    ID PROVENANCE, AND WHY THIS ID RATHER THAN THE ONE NAMED. The operator named W1-T2230. Its
    reservation resolved and was NOT this account's: `refs/rmd-id/W1-T2230` was minted by
    `Ubuntu@Remudero` (the Azure host) at 2026-08-24T16:58:38.752Z, ONE MINUTE before the sweep read
    it, with W1-T2229 minted by the same host 27 minutes earlier. The brief's own precondition — that
    the reservation be this account's and unused — fails on ownership, and a one-minute-old
    reservation from a live lane is the double-mint that has refused `loadPlan` on origin/main twice
    (W1-T488, and W1-T533+W1-T534 renumbered to W1-T911/W1-T912). W1-T2231 was reserved by the repo's
    OWN mechanism before this shard was written — an orphan `commit-tree` over the empty tree pushed
    with a PLAIN refspec, mirroring `gitRemoteRefReserver`, authored by `cao825@Craigs-Mac-mini`. It
    CREATED on the first attempt, which is the evidence the id was free.

