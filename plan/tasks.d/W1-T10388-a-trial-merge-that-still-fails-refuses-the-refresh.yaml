  rationale: |
    OPERATOR RULING 2026-10-22: do not refresh a PR whose red is its own.
    READ at origin/main 32887fe4d (symbols, not lines):
    - `assessRefreshClearance` refuses on a `reproduced` trial merge (every failing file still fails) and refreshes
      on `clear`. On `partial`, with no prior refresh on the same red, it refreshes ("keeping today's refresh").
      A file that still fails on main-merged-into-the-head cannot be cleared by merging main.
    - `refreshedOnSameRed` treats a prior refresh as the same red only when EVERY current failing file was in that
      refresh's list. A red whose file list shifts while one persistent file keeps failing is never "the same red".
    OBSERVED (core ledger 10-21T08:49Z..10-22T01:20Z, read-only):
    - PR 13324 has five `refresh.clearance` rows, arm base-fixed, refresh true, evidence partial, at heads
      3dca3cda1, 82f6d5747, 212d9d3ad, 59e8130dd and 97349e0ae. Each is followed by a `sweep.base_fixed.refresh`
      outcome updated.
    - The failing lists differ head to head. All of them name
      test/inbox/an-amended-contract-releases-a-design-or-scope-hold.test.ts, #13318's test, which kept failing
      because the branch had reverted #13318's sweep.ts hunk (W1-T10387).
    - Main was green for it: `sweep.base_reproduction` reads `passes` on main.
    - Fleet-wide in the same window, 45 `refresh.clearance` rows admitted a refresh on `partial`.
    NOT COVERED ELSEWHERE: W1-T10338 (queued) stops a refresh after a red refresh only while the fix rung stands down
    on an escalation; #13324's rung was not standing down. W1-T8396 (merged) built this clearance, and W1-T6405 and
    W1-T9595 (merged) the base-fixed arm and its admission. Swept origin/main 32887fe4d plan/tasks.d and all 18
    open PR heads' plan trees for assessRefreshClearance, refresh.clearance, base-fixed and "keeping today's
    refresh": no other shard.
  design: |
    1. PARTIAL REFUSES. A `partial` trial merge returns refresh false, evidence `partial`, naming the files that
       still fail on the trial merge. Merging main cannot clear them, so the red stays with the fix lane, which
       already owns an own-red. `clear` still refreshes, and `reproduced` still refuses.
    2. THE SAME RED IS A SHARED FAILING FILE. `refreshedOnSameRed` treats a prior refresh as the same red when the
       checks overlap and at least one current failing file was in that refresh's list. A red with no test files
       keeps today's rule.
    3. `unrunnable` and `fileless` keep today's behaviour. They are not this task, and the 44 `unrunnable` rows in the
       window come from a probe that is not wired.
    4. No new config key, threshold or env var.
    5. Tests (new file, titles verbatim as in the proofs): a partial trial merge refuses and names its still-failing
       files. A prior refresh sharing one failing file counts as the same red. Clear still refreshes and reproduced
       still refuses.
  acceptance:
