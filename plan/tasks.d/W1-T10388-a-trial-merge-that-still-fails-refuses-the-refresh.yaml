  risk: medium  # narrows one refresh admission; the fix lane already owns an own-red
  band_meaning: span
  origin: "operator ruling 2026-10-22, item 9: a refresh must not be the remedy when the failing check is the PR's own"
  plan_refs: [W1-T8396, W1-T6405, W1-T9595, W1-T10338, W1-T10387]
  files:
