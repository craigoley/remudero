  title: "A TRIAL MERGE THAT STILL FAILS A FAILING TEST REFUSES THE REFRESH — `assessRefreshClearance` (src/lib/base-reproduction.ts) answers `partial` (\"some failing test files still fail on the trial merge; keeping today's refresh\") with refresh TRUE, and `refreshedOnSameRed` matches a prior refresh only when every current failing file was in it, so #13324 (W1-T9434) took five main merges in 6 h on 2026-10-21 (82f6d57, 5ac41a4, 59e8130, 97349e0, 355244c8e), each admitted `partial`, each re-running CI on a red that was the PR's own"
