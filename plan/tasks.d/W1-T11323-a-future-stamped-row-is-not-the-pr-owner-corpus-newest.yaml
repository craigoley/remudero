- id: W1-T11323
  title: The pr-owner projection skips a ledger row stamped more than the future-stamp tolerance past now, so a future row can neither become the corpus's newest timestamp nor the latest fix or sweep that holds a PR OWNED
  repo: remudero
  depends_on: []
  priority: 0.7
  type: implement
  verify: auto
  principles:
