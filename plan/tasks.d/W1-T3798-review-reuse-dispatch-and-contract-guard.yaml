- id: W1-T3798
  title: "REVIEW-REUSE DISPOSITIONS ARE INERT AND IGNORE THE TASK CONTRACT — an unchanged PR diff can be held forever after a base-only update, while a changed acceptance contract can be incorrectly treated as safe to reuse"
  repo: remudero
  depends_on: []
  type: implement
