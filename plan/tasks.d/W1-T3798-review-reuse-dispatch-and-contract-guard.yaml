  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED 2026-09-19 on remudero-console PR #455. The PR's first rebased head had the same
    PR-owned diff as the earlier reviewed head but a new merge base. The console daemon repeatedly
    selected `discriminate-only`; its ledger named the intended action on each sweep, but no
    `remudero-review` was posted. `src/lib/sweep.ts` deliberately forces `alreadyDone = true` for
    both `review-reused` and `discriminate-only`, and its action switch contains no effect for
    either. The task which introduced the dispositions records that this was a separately unwired
    producer. A required status can therefore remain absent forever despite green ordinary checks.

    The same incident falsifies W1-T3704's assertion that a base-only move can change only proof
    discrimination. Console plan PR #532 changed API-T28's first criterion to `satisfied_by` for
    an earlier merge. After #455 rebased, its own diff was unchanged while the acceptance contract
    had changed from an executable criterion to prior-merge credit. Reusing a former judgment would
    therefore judge the wrong contract. An operator invoked the supported reviewer once to restore
    the current-head status; that unblocked and auto-merged #455 but is not a fleet repair.
  design: |
    (i) RECORD AND COMPARE THE REVIEWED TASK CONTRACT. Each reusable verdict carries a stable digest
        of the acceptance contract that the reviewer actually resolved: task identity, resolved
        criteria including claim/proof/satisfied_by/holdout, risk and budget inputs that govern the
        review/merge contract. On a later head, an unreadable digest or any difference forces the
        existing full-review lane. This is a third input beside own-diff and merge-base identity;
        it prevents a base merge from silently changing what the prior verdict means.

    (ii) WIRE BOTH CHEAP OUTCOMES TO A DURABLE CURRENT-HEAD RESULT. An exact reuse must post a
         traceable current-head verdict derived from the recorded decision and then allow the normal
         auto-merge predicate to decide. A base-only move with an unchanged contract must run only
         the deterministic discrimination work required by that prior decision, then post the
         resulting current-head status. Both paths are bounded by the existing review concurrency,
         exact-input deduplication, status-write guard and per-PR throw containment; neither may
         merely ledger an intention.

    (iii) FAIL TOWARD FULL REVIEW. Missing, malformed or non-replayable prior decision evidence;
          changed own diff; changed task contract; unreadable merge facts; or failed discrimination
          all route to the existing authoritative full-review path. A reuse may never copy a status
          that cannot be tied to both the current head and current contract.

    (iv) KEEP REVIEW AUTHORITY CENTRAL. Reuse/discrimination code must call the existing guarded
         status and auto-merge boundaries rather than writing a GitHub status or arm decision via a
         new path. Ledger rows name the reused head, current contract digest and outcome so a later
         sweep can distinguish a completed cheap review from an unwired action.
  acceptance:
    - claim: "an unchanged own diff and merge base with an unchanged readable contract posts one durable current-head reuse verdict rather than remaining in an inert disposition"
      proof: "grep: W1-T3798 reuse-posts-current-head-verdict in test/a-verdict-is-reused-when-nothing-it-judged-changed.test.ts"
    - claim: "an unchanged own diff with a moved base and unchanged readable contract executes only discrimination, posts its current-head outcome, and does not invoke the full reviewer"
      proof: "grep: W1-T3798 base-only-runs-discrimination in test/a-verdict-is-reused-when-nothing-it-judged-changed.test.ts"
    - claim: "a base-only plan change that turns an executable API-T28-like criterion into satisfied_by forces full review instead of reuse or discrimination-only"
      proof: "grep: W1-T3798 changed-contract-forces-full-review in test/a-verdict-is-reused-when-nothing-it-judged-changed.test.ts"
    - claim: "missing or malformed former contract or decision evidence fails toward the existing full-review path without posting or arming from stale data"
      proof: "grep: W1-T3798 unreadable-evidence-falls-back in test/a-verdict-is-reused-when-nothing-it-judged-changed.test.ts"
  falsifier: |
    Delete either action handler and the exact-input or base-only action-count proof must fail.
    Remove the contract digest comparison and the API-T28-like base-only contract-change fixture
    must fail by selecting reuse or discrimination-only. Make a former decision unreadable and
    observe any cheap status post or auto-merge arm: that disproves the fail-closed boundary.
