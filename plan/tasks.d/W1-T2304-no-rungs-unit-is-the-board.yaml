- id: W1-T2304
  title: "NO RUNG'S UNIT IS THE BOARD — the sweep and the fix rung read one PR, the retro reads runs since a marker, auto-triage reads queue capacity, and the sweep's whole cross-PR vocabulary is one function that is undefined below two PRs; an operator ran the missing loop by hand for a night and it produced four merged fixes and five shards none of which was reachable from inside a single PR's diff"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 45.00
  files: [src/lib/board-review.ts, src/lib/measurement-cadence.ts, test/board-review.test.ts]
  origin: "operator-brief#no-rungs-unit-is-the-board-2026-08-26"
  plan_refs: ["W1-T2288", "W1-T2289", "W1-T2240", "W1-T1259"]
