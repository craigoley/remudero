  rationale: |
    WHY: a fault in reading history becomes permission to merge.
    READ at 51105aaa3: decideSweepArm (src/lib/sweep.ts:14365-14402) looks in the rotated history when the live
    ledger has no verdict. A complete history with no verdict refuses. An incomplete one answers arm: true,
    "no ledgered verdict recoverable for this head". The capped and plan-only facts are then never applied.
    OBSERVED: every sweep.arm_verdict_history_read since 2026-11-21T08:54Z is complete=false (W1-T14314's lock
    file), so this branch was reachable for over a day. GitHub's required remudero-review status still had to be
    green. I found no PR that merged through this branch; the search was for the reason text in the ledger only.
  design: |
    HELD for the operator: W1-T3471 chose fail-open on purpose, so an archive fault would not stall merging.
    INVARIANT readable-history-decides-as-before: with a recoverable verdict, or a complete history, the arm decision is exactly as on origin/main.
    1. An incomplete or throwing history with no live verdict answers arm: false and names the unreadable history.
    2. The next pass reads again. Nothing is disarmed and no status is written.
  acceptance:
    - claim: "With no live verdict and an incomplete or throwing history, decideSweepArm answers arm false and names the unreadable history"
