    Amendment 2026-11-23 (hand build stopped before commit): readArmVerdictHistory (src/lib/sweep.ts) calls a
    history complete only when it has at least one archive, and a test state directory has none. So the
    refusal makes every sweep test that arms a green, reviewed PR without writing a review.posted row for its
    head stand down instead of arming. 17 such suites, found by running 28 of the ~275 that share this setup,
    are now in files:; more may exist. A builder should run the whole sweep test set once on the host and
    give each arming fixture a review.posted row for its head (or a complete history), not loosen the rule:
    the design and the-sweeps-arm-decision-reads-no-ledger-union-on-the-loop.test.ts line 199 both count an
    archive-free history as unreadable.
    Amendment 2026-11-23b (second hand build, stopped before commit): a run of all 772 suites that import
