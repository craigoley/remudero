  title: "THE MINT REISSUED A LIVE ID BECAUSE ITS OPEN-PR SURFACE COSTS GRAPHQL AND THE GRAPHQL BUDGET WAS GONE — the ceiling came from three surfaces instead of four, and the missing one was precisely the surface holding the id that had just merged; two shards now carry W1-T2316, and the same data is core-billed over REST for one page and one point"
