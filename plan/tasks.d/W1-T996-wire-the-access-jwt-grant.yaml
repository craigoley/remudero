    risk: high IS SET UP FRONT AND THE BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (`src/lib/task-linter.ts`) exempts only risk high, and `subsystemsOf` derives subsystems from the
    acceptance-criteria text as well as from `files:`; this shard spans the serve wiring, the config
    surface and a suite, and its criteria name provider ordering, header absence, write tiers and a
    refresh lifecycle.

    PROOF DIALECT WAS CHOSEN BEFORE WRITING, DELIBERATELY. Five criteria are mechanical and use the
    name-filtered `unit test:` form. The sixth is doc-shaped — a scope statement about what this
    shard is not — so it takes a `grep:` rather than a `unit test:` that would parse, match zero and
    cap the review at a criterion no test can ever satisfy. `demonstration:` is refused outright by
    `check-proof` and appears nowhere here. Every `unit test:` title was measured against test/ with
    `grep -rlF` and matched ZERO files, against a control title lifted from the real seam suite that
    matched one; each is plain prose under 100 characters with no comma, no semicolon-space and no
    regex metacharacter. The `grep:` proof is on ONE PHYSICAL LINE and was verified against this
    changeset's own head as well as the merge base.

    ONE ADVISORY IS ACCEPTED KNOWINGLY. `rmd lint-plan` emits a single finding against this shard, a
    `proof-scope` WARNING that criterion 6's grep names this shard's own path while `files:` does not
    list it. It is advisory and never blocking — the run carried 179 blocking tasks and NOT ONE names
    W1-T996. Both remedies are worse: declaring the shard's own path would place the filing inside its
    own implementation scope, and repointing the grep at src/lib/serve.ts would name a file this
    changeset does not touch, which reads hits 0 and `executed_fail` and fails the review outright.

