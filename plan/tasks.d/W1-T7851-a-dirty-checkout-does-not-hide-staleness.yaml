- id: W1-T7851
  title: "A DIRTY CHECKOUT DOES NOT HIDE STALENESS FROM FRESHNESS AGE PRESSURE — `daemonFreshnessFromService` answers `not stale` for a dirty tree that is behind main, `staleSinceMs` starts only on a stale reading, so the core daemon booted at 00:03Z on a sha main had passed at 22:05Z read age pressure 0 at 03:13Z, and nothing said why the tree was dirty"
