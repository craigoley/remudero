    - claim: "the staleness clock starts on the first dirty-and-behind reading, so the first clean stale reading carries the accrued age pressure"
      proof: 'grep: test("W1-T7851: age pressure accrues while the checkout is dirty and behind" in test/a-dirty-checkout-does-not-hide-staleness.test.ts'
    - claim: "the dirty arm and the boot dirty row name the dirty tracked paths"
      proof: 'grep: test("W1-T7851: a dirty reading names the tracked paths that make it dirty" in test/a-dirty-checkout-does-not-hide-staleness.test.ts'
    - claim: "a restart the dirty tree withholds is logged once per new sha"
      proof: 'grep: test("W1-T7851: a restart withheld by a dirty tree is named once per new sha" in test/a-dirty-checkout-does-not-hide-staleness.test.ts'
  falsifier: |
    Leave `daemonFreshnessFromService` returning the bare dirty arm. The behind flag is then absent, `staleSinceMs`
    never starts while dirty, and a fixture that reads dirty-and-behind for two hours before its first clean stale
    reading gets age pressure 0, as the 03:13:02Z decision did. The second and third tests fail. Let a dirty tree read
    `stale: true`, and the first test fails, because the restart would loop on a refused sync.
