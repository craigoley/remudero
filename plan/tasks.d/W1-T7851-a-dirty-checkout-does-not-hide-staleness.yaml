  budget_usd: 8.00
  risk: high  # Rule 19: one concern — staleness is measured by loaded sha against origin/main whatever the dirty arm says
  band_meaning: span
  origin: "operator approval 2026-10-11: file the recommended follow-ups (a dirty checkout reset the daemon's freshness age pressure)"
  plan_refs: [W1-T4945, W1-T6093, W1-T3756, W1-T5308, W1-T5476, W1-T2964]
