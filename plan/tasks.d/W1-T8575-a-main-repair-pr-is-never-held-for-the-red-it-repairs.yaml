- id: W1-T8575
  title: "A MAIN-REPAIR PR IS NEVER HELD FOR THE RED IT REPAIRS — on 2026-10-12 the sweep stood the red-main repair PR #11096 down as base-red (\"proof-discrimination is absent from main's latest run, and main is red ... the branch refreshes once main is green\"), so the PR that would turn main green waited for main to turn green; and a check that judges only the PR's own body was read as inheritable from main"
  repo: remudero
  depends_on: []  # W1-T8042 (queued, P1) also edits src/lib/sweep.ts but not decideBaseRed; not serialized, so a deadlocked main is not kept waiting on its chain (W1-T8038, W1-T8041)
