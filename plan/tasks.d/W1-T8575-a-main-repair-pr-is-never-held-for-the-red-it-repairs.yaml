    - claim: "an ordinary PR red only on a body-scoped check is its own red while main is red, and W1-T5490's lint-plan wait is unchanged"
      proof: 'grep: test("W1-T8575: a body-scoped red is the PR own while a tree red still waits" in test/a-main-repair-pr-is-never-held-for-the-red-it-repairs.test.ts'
    - claim: "every required pull_request check that triggers on edited is body-scoped or exempted by name"
