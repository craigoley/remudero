    - claim: "the body-scoped set exists in sweep.ts"
      proof: "grep: PR_BODY_SCOPED_CHECKS in src/lib/sweep.ts"
  falsifier: |
    Delete the `isMainRepairPr` arm, and the #11096 fixture stands down with "is absent from main's latest run" again and
    no fix is dispatched. Delete proof-discrimination from `PR_BODY_SCOPED_CHECKS`, and the ordinary-PR body-scoped test
    reads `wait`. Add the body-scoped skip to every name, and W1-T5490's lint-plan test and the tree-red half of this file
    read `own`. Add a new edited-triggered required workflow, and the census names it.
