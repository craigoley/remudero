  origin: "operator standing direction 2026-10-12: fix reds at the root; red main from #11085, deadlocked repair #11096"
  plan_refs: [W1-T5490, W1-T4351, W1-T6403, W1-T6024, W1-T8042, W1-T8572]
  files:
