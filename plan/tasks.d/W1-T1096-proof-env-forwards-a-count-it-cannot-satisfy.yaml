  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH, AND NO PROOF SHELLS GIT. Every criterion uses the
    pure-path `unit test:` form naming `test/proof-env-git-config-triple.test.ts`, declared in
    `files:`, so on the filing PR it resolves through W1-T456's `forwardReferenceFiles` carve-out to
    `not_yet_built`. `buildProofEnv` is a pure function over an env object, so its falsifier needs
    no git subprocess — which matters here more than usual: a proof that shelled git to prove a
    git-config defect would be testing the very thing that is broken.

    `risk: high` IS SET UP FRONT AND IT IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses a
    `src/` module and `test/`, and the acceptance wording names the proof-execution and environment
    surfaces, so `subsystemsOf` (`src/lib/task-linter.ts`) derives more than one tag. The diff
    itself is one consistency check inside `buildProofEnv` and its falsifier.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT. `PROOF_ENV_ALLOWLIST`, `buildProofEnv` and
    `defaultProofSpawner` all live in `src/lib/review.ts`. `test/review.test.ts` is deliberately NOT
    declared — design (v) leaves its fixture untouched, and declaring a file the diff will not touch
    would trip `inverseScopeUntouchedFiles`.

    SWEPT BY SUBJECT AS WELL AS BY ID, AND THE SUBJECT SWEEP IS WHAT FOUND THE PARENT.
    `W1-T499-proof-harness-inherits-the-daemon-environment.yaml` is on main and is cited as parent;
    `W1-T1036` matched the same slug grep but is about a stale `index.lock` and is a different
    subject. No open PR touches the allowlist.

    ID PROVENANCE. `refs/rmd-id/W1-T1096` resolves to 0378e12aacb84f614978b4ae4176edd524ca36e2,
