    - claim: "a red that main's own CI also fails at the PRs' base files no flake incident"
      proof: 'grep: test("W1-T9551: a red main also fails at the base files no flake incident" in test/a-red-that-never-recovers-on-retry-across-prs-is-inherited-from-main.test.ts'
    - claim: "a main-inherited red is routed to the main-health rung, which names the repair that already covers it"
      proof: 'grep: test("W1-T9551: a main-inherited red is routed to the main-health rung" in test/a-red-that-never-recovers-on-retry-across-prs-is-inherited-from-main.test.ts'
    - claim: "a red that recovers on retry still files a flake incident"
      proof: 'grep: test("W1-T9551: a red that recovers on retry is still a flake incident" in test/a-red-that-never-recovers-on-retry-across-prs-is-inherited-from-main.test.ts'
  falsifier: |
    Replay W1-T9532's evidence (3 PRs #11705/#11735/#11769, each also_failed, 0 recovered) through
    `runFlakeIncidentGardener`. At origin/main it files a flake incident; with the change it files nothing and
    writes one `flake_incident.main_inherited` row. Drop the recovered===0 branch and the first test reds; keep
    one recovered row in the fixture and the flake is still filed.
