    budget_usd 70 — slightly under W1-T289's 75 because the shared primitive already exists (reclaimStaleLock
    is the seam, not a new abstraction); the cost is the deterministic reuse fixture and establishing the
    platform mechanism from documentation.
    verify:auto — every claim is decidable by an injected fixture over the predicate.
    NO depends_on. The dispatch-stall arm predates the console anchor entirely and is independent of it; the
    misrender arm only exists once that anchor lands, which is why status.ts is declared conditionally in the
    design rather than as an edge that would stall this behind an unmerged PR.
    LATENT, NOT OBSERVED IN THE WILD: no incident is attached, and I did not find one in the ledger. It is
    graded high anyway because the trigger is ordinary (a crashed run's lock plus a wrapped pid space,
    measured wrapping on this host) and because the failure is SILENT — a refused dispatch reads as a task
    that simply never runs."
