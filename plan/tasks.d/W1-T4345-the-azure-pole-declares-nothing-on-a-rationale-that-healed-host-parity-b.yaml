  title: "THE AZURE POLE DECLARES NOTHING ON A RATIONALE THAT HEALED — HOST_PARITY_BASELINE's container pole is asserted empty from a 16-failure set measured at 3a5c677 whose 14 largest were `jq` absent from the image, and deploy/Dockerfile now installs jq with a build-time probe; the container's real divergence set has never been re-measured, so every FIX round in a worktree re-derives is-this-pre-existing by hand"
