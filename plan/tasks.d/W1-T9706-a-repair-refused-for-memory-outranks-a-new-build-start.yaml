  design: |
    One priority rule, adaptive, with no new fixed number (operator ruling: no hard thresholds):
    1. DEMAND. When createSweepFixAdmissionController refuses a claim on a readable pressure reading (the MiB arithmetic,
       not the stand-in and not an unreadable reading), it records that repair as waiting for host memory in a new
       in-process module, src/lib/repair-memory-demand.ts: the PR, when its blocker began waiting (waitSinceMs on the full
       pass, else the refusal time), the MiB it was short, and the refusal time. An admission for that PR, or a pass
       that no longer derives it, clears it. The sweep and the build dispatch run in the same daemon process (actor_pid
       120 wrote sweep.fix_capacity, dispatch_memory_observed and run.start after the 17:32Z boot), so no file is needed.
       A refusal stays fresh for HOST_MEMORY_PRIORITY_PROPOSAL.demandRefreshBoundMs, the existing proposal that
       review demand already uses. Every light pass re-derives a waiting repair, so live demand stays fresh.
    2. YIELD. memoryGovernorGateFor (src/run-task.ts), which every new implement dispatch consults, asks the module
       after checkMemoryGovernor admits. A new build yields (deferred, tier "yield-to-repair") only when all of these
       hold:
       (a) a fresh repair is waiting for memory;
       (b) live work in this container can still free memory (ownContainerWorkLive, the same test the container tier
           uses). With nothing live, holding a build cannot make a repair fit, so the build is admitted and named;
       (c) the repair outranks the build under rankDemand/priorityScore with HOST_MEMORY_PRIORITY_PROPOSAL. The build's
           wait starts at its first yield in the current streak, so a build held long enough outranks the repair and
           is never overtaken indefinitely.
    3. ROWS. dispatch_memory_observed carries the yield decision: yielded, the repair PR it yielded to, that repair's wait
       and shortfall, both scores, and why it did not yield when it did not. An analyst can then count the build-minutes
       spent on repairs.
    4. BOUNDARIES. This adds no fixed threshold and no new policy value. It changes no budget mode (plan/policy.yaml
       hostMemoryBudget stays as it is), no memory limit, no floor, and none of the fix or review arithmetic. A
       review start is not affected.
