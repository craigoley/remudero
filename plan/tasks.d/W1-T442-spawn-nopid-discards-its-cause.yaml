  note: "verify:auto — nothing here needs an operator ruling. Design (ii) leaves ONE choice open and
    states why (a) is preferred, which is an engineering argument rather than a policy the plan
    withheld.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance
    text and this set crosses `src/lib` and `test/`, which is >=2 subsystems and would be a sizing
    violation at any lower band. Raised up front — the W1-T400/W1-T407 lesson. The actual change is
    a message, a callback and one `stat`.
    `test/worker-containment.test.ts` IS DECLARED AND THE REASON IS MEASURED, not defensive: it
    already asserts the thrown text with `/has no pid/`, so it is the suite that goes red the
    moment that message gains its context, and a `files:` omitting it is the refusal-at-push that
    cost W1-T407 three dispatches. NOTE FOR WHOEVER RUNS THE GLOB: that suite is a known
    side-flipping flake alongside the W1-T356 wiring tests — attribute by failure SET across both
    sides, never by count.
    THE SPAWN PATH IS LIVE. This edits the code every worker starts through, on a host running a
    daemon. The falsifiers must drive a REAL spawn failure (a command that genuinely cannot
    execute), never a stubbed `undefined` pid — a fabricated no-pid is indistinguishable from the
    thing under test, which is the whole defect one level up.
    Both new proofs are forward references to a PATH, never to a symbol: a path forward-reference is
    safe and a symbol one is a guess, and a `grep:` proof naming an existing symbol would match the
    merge base as well as the head and be downgraded to stale.
    budget_usd 55 — the edit is small; the cost is the four falsifier directions, of which the
    uncaught-exception guarantee (design iii) is the one that needs care because asserting the
    ABSENCE of a crash requires driving the late event deliberately rather than waiting for it.
    NO COUNT HERE SHOULD BE QUOTED FORWARD — re-run the union sweep; two events is what it was at
    2026-08-12T15:20Z and a third would change the priority."
