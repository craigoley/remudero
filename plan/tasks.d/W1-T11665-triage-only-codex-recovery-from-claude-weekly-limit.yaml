  rationale: |
    Operator-approved root-cause fix (feedback fb-1794082767548-ccbff0). Scope:

    RECOVERY TRIGGER. Only an explicitly CLASSIFIED Claude subscription weekly-limit refusal
    on the TRIAGE lane. Reauction AT MOST ONCE, only to an already-enabled subscription
    provider (Codex). Eligibility requires exact attempt evidence: no task-side tool effects,
    no workspace change, and usage/cost both zero. Ambiguous receipts, missing evidence or
    ineligible capacity FAIL CLOSED (no reauction).

    CODEX WEBSEARCH. Add Codex native WebSearch to the triage research profile only, using the
    verified CLI search flag (verify against the installed CLI, do not guess) and the declared
    lane bounds. Unsupported CLI version or missing tool FAILS CLOSED.

    CODEX SEARCH SEAM (clarified by feedback fb-1794131268424-0b71c3). Codex CLI 0.166.0 parses
    root `--search` but the Exec arm does not forward interactive.web_search, so `codex --search
    exec` does NOT prove native web_search for the noninteractive worker. Do NOT rely on the root
    flag. The supported path is a scoped explicit config override `-c web_search="live"` placed in
    the argv built by `codexExecArgs` in src/lib/worker-provider.ts (now in scope), emitted ONLY
    for the TRIAGE research profile (TRIAGE_CODEX_SEARCH in src/lib/worker.ts); implement/review
    argv stay byte-identical. Synthetic tests assert the EXACT argv (override present for triage,
    absent elsewhere) and FAIL CLOSED when the installed CLI version/capability is unsupported or
    missing. Search stays TRIAGE-only, PLAN stays pinned to Claude, no WebFetch/cash/provider
    calls, and the refusal eligibility/provenance guards are retained unchanged.

    PROVENANCE. Preserve both attempt assignments and the original refusal provenance in the
    receipt/ledger.

    NON-GOALS. Do not route PLAN through Codex; no WebFetch; no cash; no tool broadening for
    implement or review lanes.

    TESTS use synthetic fixtures only; no live provider calls.

