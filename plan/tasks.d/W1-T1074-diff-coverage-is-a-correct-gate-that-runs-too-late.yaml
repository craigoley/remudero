  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/preflight-coverage-mode.test.ts`, declared in `files:`, so on the filing PR it
    resolves through the W1-T456 forward-reference carve-out (`forwardReferenceFiles`,
    `src/lib/review.ts`) to `not_yet_built` rather than executing against an absent file.

    `risk: high` IS SET UP FRONT AND IT IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses two
    `src/` modules and `test/`, so `subsystemsOf` (`src/lib/task-linter.ts`) derives more than one
    tag. The diff itself is one flag, one runner and its wiring.

    `src/run-task.ts` MUST BE DECLARED, per DECISIONS.md's 2026-08-18 W1-T471 ruling: the flag is
    refused by `unknownArgError` inside `preflightCommand` unless that file learns it, and the
    ruling records that the file is not split and tasks are not re-scoped to avoid declaring it.
    `src/lib/ci-parity.ts` is where `runPreflightFast` and `FAST_GATE_STEPS` already live, so the
    new mode's engine belongs beside them rather than in a third module.

    `scripts/diff-coverage.mjs` IS DELIBERATELY NOT DECLARED — design item (iv). Declaring a file
    the diff will not touch would trip `inverseScopeUntouchedFiles` and serialise this task against
    every other task that names it.

    THE SIX-PR CLAIM THAT PROMPTED THIS RECON IS RECORDED AS REFUTED IN RATIONALE (4) RATHER THAN
    QUIETLY DROPPED. The live instance (#2314) and the historical record in CLAUDE.md carry the
    argument; no count is asserted, because the population that would support one could not be
    reconstructed from the GitHub record.

