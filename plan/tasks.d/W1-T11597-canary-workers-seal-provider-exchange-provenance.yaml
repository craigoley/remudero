      proof: 'grep: W1-T11597 criterion 3: workerExecutionEvidence providerInvoked contract is unchanged in test/routing/model-canary-provider-exchange-provenance.test.ts'
    - claim: The sealed receipt binds runId, canary attemptId and the worker-spawn attempt id; mismatch validation belongs to W1-T11119
      proof: 'grep: W1-T11597 criterion 4: sealed evidence binds run canary attempt and worker spawn attempt in test/routing/model-canary-provider-exchange-provenance.test.ts'
    - claim: Offline tests perform zero provider transport and zero spend
      proof: 'grep: W1-T11597 criterion 5: offline provider exchange controls use zero transport and zero spend in test/routing/model-canary-provider-exchange-provenance.test.ts'
    - claim: The real stream reducer issues the seal
      proof: 'grep: sealProviderExchange( in src/lib/worker.ts'
    - claim: The coding request port forwards the sealed value without decoding it
      proof: 'grep: providerExchange: result\.providerExchange in src/lib/model-canary-coding-adapter.ts'
    - claim: The durable producer receipt is a local typed attempt subtype that survives a JSON round-trip across the owner boundary with every binding intact, built without casts or caller-authored JSON
      proof: 'grep: W1-T11597 criterion 8: provider exchange receipt round-trips through JSON at the owner boundary as a typed attempt subtype in test/routing/model-canary-provider-exchange-provenance.test.ts'
  falsifier: >-
    Replay scripted message streams through collectWorkerResult. Real-model and allowlisted-error
    streams must seal; every excluded stream must not. Widening the allowlist to cloud_credential_error
    or unknown, or accepting a bare isApiErrorMessage flag, must fail criterion 2. Changing
    providerInvoked or the WorkerExecutionEvidenceV1 shape must fail criterion 3. Sealing with a
    swapped canary attempt id must yield a receipt whose binding differs from the request context under
    criterion 4. Any transport call or nonzero spend must fail criterion 5. A receipt that loses a binding,
    or needs a cast, after JSON.stringify/JSON.parse at the owner boundary must fail criterion 8.
