  design: >-
    Leave workerExecutionEvidence() and WorkerExecutionEvidenceV1 unchanged. Add a private
    sealProviderExchange( inside collectWorkerResult() that issues positive-only provider-exchange
    evidence: only for a provider-originated assistant message naming a real non-synthetic model, or a
    provider response error the stream actually received whose SDKAssistantMessageError value is on a
    closed allowlist. cloud_credential_error (no request reached the provider) and unknown (no
    provider-response guarantee; treated as unavailable) are never on that allowlist. Every other outcome
    issues nothing (absent, never false): cloud_credential_error, unknown, a bare isApiErrorMessage flag,
    the <synthetic> model, an empty stream, query-start only, abort, timeout, local spawn or tool failure,
    and every ambiguous or local-only outcome. The durable producer receipt is a local typed attempt
    subtype declared in src/lib/model-canary-runner.ts that extends the existing CanaryAttempt resources
    with an optional providerExchange receipt binding runId, the canary attemptId and the worker-spawn
    attempt id. It is plain JSON-serialisable data built without casts or caller-authored JSON, and the
    test proves it survives JSON.stringify/JSON.parse across the owner boundary with every binding intact.
    The coding port forwards it unread and the runner carries it through existing resources; neither
    validates nor consumes it. Validation (mismatch reads unavailable) and consumption belong to
    W1-T11119. Offline tests use scripted streams with zero transport and zero spend.
  note: >-
    Grants no consent, native-owner, admission, source-qualification or spend release, and changes no
    privacy control. The first live pilot keeps its separate USD 25 total cap with no retries or top-ups.
    This plan and its offline tests make no provider calls. W1-T11119's owner, branch and status are
    untouched; no source task is dispatched by this filing.
