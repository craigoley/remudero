    - claim: "an unresolvable registered claim renders as UNDETERMINED with its reason rather than being silently omitted, and the renderer's count parity makes omission unrepresentable"
      proof: "grep: UNDETERMINED( in scripts/generate-capability-snapshot.mjs"
