  design: Add a bounded closed quality-profile selector for the verified canonical repository target and wire resolveProjectPreflight into the actual preflight command. Resolve shared harness tooling from its installed harness root and consumer commands/configuration from the verified target checkout. Preserve Core default argv, commit policy, coverage/static/census and failure semantics. Console runs its actual declared contract/read/write-parity, plan-dependency, TypeScript and unit checks; Wreckterra uses its existing declared test/typecheck/build/security commands under the existing cost and admission policy. Inspect the current repository CI definitions and package scripts before pinning each profile. Do not run the Core CLI COMMANDS/deps census against a Next.js consumer. Target identity must use the existing canonical owner/repo resolution, checked against the actual checkout; an arbitrary package name, cwd shape, browser field or --repo assertion cannot select a weaker profile. An unregistered target, missing command/config/tool, unreadable identity or unknown measurement returns an explicit unavailable/refused result, never a skipped PASS or a Core fallback. Retain required hosted CI, normal first-push author checks, test-slot/resource/timeout guards, receipt freshness, source identity and partial-result semantics. Prove real default subprocess commands in disposable target fixtures as well as injected failures. Do not edit consumer repositories, dependencies, ignore lists, scanner exclusions, workflows or budgets in this task. This repairs construction/qualification; it grants no product execution or deployment authority.
