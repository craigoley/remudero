  design: |
    Only a complete current child AND worker build may be reused.
    1. Before an existing slot's expensive build, positively qualify its artifacts through
       the maintained build module's source/recipe/dependency and payload-integrity
       validators. Validate every declared child and every declared worker. Reuse the
       existing sourceHash, childEntryIsCurrent and workerBundle semantics; never trust a
       SHA, manifest existence, an empty inventory, a partial check or --check alone.
    2. Run source and payload hashing in a bounded child through the existing asynchronous
       RunCommand. Never import or hash the large tree on serve's main event loop. An
       unavailable/unsupported check, unreadable/malformed manifest, changed input,
       missing/corrupt child or missing/corrupt worker is not current: run the existing
       build. An absent build script or failed build retains its existing absent/failed
       outcome and tsx fallback. No success-shaped catch may certify reuse.
    3. Preserve the built/absent/failed outcome contract. An additive reused flag may
       distinguish verified reuse from a fresh build in serve.slot_child_entries and
       the existing cold-start result. Record bounded elapsed work honestly. Verify
       standby retry and cold consumers; do not cache only by process or source SHA.
    4. Real tiny default-path controls must validate all required artifacts, observe the
       skipped second build, and prove missing/corrupt workers force rebuilding even
       while child entries are still valid. Cover source/lock changes, malformed or
       incomplete manifests, unavailable validation, failed checks and build failures.
       Keep existing real child/error/exit/signal/fallback assertions and caller controls.
    No admission, shedding, spacing, memory limit, reserve, lifecycle or service changes.
    No provider, budget, permission, authentication, claim, guard or deployment changes.
    Use strict TDD and source-only removal/restoration, exact committed-tree author,
    source-instrumented same-SHA diff coverage, caller/census sweeps, stored acceptance,
    governed review and full current-head CI. Measure the avoided build locally first;
    production memory/latency benefit requires separate adoption and live measurement.
  acceptance:
    - claim: "repeating a fully qualified slot preparation avoids a second bundle build and reports reuse"
      proof: 'unit test: W1-T10058: repeated preparation reuses a complete current build'
    - claim: "every child and worker payload is required, even when the child-only CLI reports current"
      proof: 'unit test: W1-T10058: corrupt or missing workers cannot authorize reuse'
    - claim: "changed source or dependency inputs and unqualified artifacts require rebuilding"
      proof: 'unit test: W1-T10058: changed or unqualified inputs rebuild instead of claiming reuse'
    - claim: "the real default child and existing absent or failed-build fallback remain truthful"
      proof: 'unit test: W1-T10058: default validation stays off-loop and preserves failed build fallback'
  falsifier: |
    With the new real tiny-fixture controls intact, remove only reuse: the second-build
    count assertion must fail. Restore reuse, then replace its whole-build qualification
    with the old child-only --check: corrupting a worker must fail the no-reuse assertion.
    Restore whole-build qualification and require all controls to pass with actual file
    and case inventories. A timing-only assertion or injected successful check cannot
    prove production reuse. Do not start a live model or recycle a service for the test.
