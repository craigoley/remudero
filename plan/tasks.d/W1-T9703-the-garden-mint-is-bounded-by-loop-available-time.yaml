      proof: 'grep: test("W1-T9703: a held loop never turns a finished garden mint into a timeout" in test/a-garden-mint-is-bounded-by-loop-available-time.test.ts'
    - claim: "a reservation child stopped at its loop-available budget still rejects as GardenMintTimedOutError and holds nothing"
      proof: 'grep: test("W1-T9703: a garden mint stopped at its loop-available budget is a GardenMintTimedOutError" in test/a-garden-mint-is-bounded-by-loop-available-time.test.ts'
    - claim: "the wall-clock census names a daemon-reachable child stopped through an AbortController a timer aborts, through a seam whose default wraps a child"
      proof: 'grep: test("W1-T9703: the census names an AbortController-plus-timer kill of a daemon-reachable child" in test/no-daemon-loop-path-arms-a-wall-clock-child-timeout.test.ts'
    - claim: "W1-T7742's late-success test now expects the mint to be filed"
      proof: 'grep: test("W1-T9703: a late successful mint is filed" in test/a-garden-filing-mints-its-task-id-off-the-daemon-loop.test.ts'
  falsifier: |
    At origin/main, run ciLearningTaskIdMinter(root).async(branch) with the real default executeAsync and a child
    that prints {"id":"W1-T9001",...} and exits immediately, while a busy-wait holds the loop for twice the bound:
    the call rejects with GardenMintTimedOutError and heldSha("W1-T9001") is undefined, though the child reserved it.
    Plant the pre-fix body shape into a reached function at origin/main: the census counts 0.
