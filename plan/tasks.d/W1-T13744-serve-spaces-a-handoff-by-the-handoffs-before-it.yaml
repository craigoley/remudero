  rationale: |
    WHY: OBSERVED on the host 2026-11-18: serve booted 19:18Z on f8481b61d, handed off after 20:57Z to a62d80e9e, and
    at 22:51:57Z wrote serve.handoff_spacing_absorbed with remainingMs 7801186, a wake at 01:02Z, the 4 h cap after
    about 21:02Z. Main was 17 commits ahead and nothing could reach serve before the cap.
    READ at origin/main 29d46f39b, src/lib/serve-supervisor.ts: the handoff sets pressure to the decayed value plus 1
    at lastDoneAt, and awaitSpacing reads that pressure, so the handoff just done weighs on its own gap. An ask a few
    minutes later sees about 1, and handoffSpacingMs(1, 2 h) is 4 h, the cap. Every ordinary handoff after a quiet
    spell therefore waits the cap, never the base. W1-T13303 set "at most every two hours" as the intent, and W1-T13534
    added the cap after a 3.45 h wait ("W1-T13303 kept 2 h as the intent"). The cap bounded the symptom; this removes
    the self-weight that causes it.
    EFFECT: one handoff after a quiet spell waits 2 h. Under steady merges the gap settles near 2.4 h (earlier
    handoffs decay with the 1 h half-life) instead of 4 h, so more handoffs a day; each is a prewarmed generation.
    SCOPE: a new option, as W1-T13676 did; a bare createServeSupervisor and the W1-T13303/W1-T13534 tests are unchanged.
  design: |
    INVARIANT seam-default-unchanged: without the option nothing changes.
    1. ServeSupervisorOptions gains spaceByEarlierHandoffs. On each handoff_done the supervisor keeps the pressure
       before the +1 (decayed to lastDoneAt) as spacingPressure; the pressure written to serve.handoff_done is unchanged.
    2. When the option is true, awaitSpacing decays spacingPressure (not pressure) to now; otherwise it reads pressure.
    3. serve-supervisor-main.ts runServeSupervisor passes spaceByEarlierHandoffs: true.
  falsifier: |
    Read the full pressure under the option: criterion 1 fails. Drop the earlier handoffs too: criterion 2 fails. Drop
    the production option: criterion 3 fails. Apply it regardless of the option: criterion 4 fails.
  note: |
    CLOSED UNBUILT 2026-11-19 (author's own retraction). The rationale above is wrong. awaitSpacing recomputes
    the decayed pressure on EVERY ask and returns false once lastDoneAt + spacing has passed; only the backstop timer
    is fixed at the first ask, and serve.handoff_spacing_absorbed reports that timer's remainingMs. OBSERVED in the
    host ledger: absorbed at 23:40:59Z (remainingMs 4858559, timer 01:01:58Z), then the coalesced ask at 23:56:58Z
    was admitted and serve.handoff_done landed 23:58:06Z (a62d80e9e -> eb79fd765, pressure 1.162), INFERRED from that pressure about 2.6 h after
    the previous handoff, not 4 h. One handoff after a quiet spell clears at about 2.4 h; W1-T13303 asked for
    "at most every two hours", which 2.4 h meets. The change would add handoffs (serve CPU) for about 0.4 h less
    lag, so it is retired. Implementation PR #19538 is closed unmerged.
    Id reserved for run-unfiled-1795046400001 with ~/rmd-work/bin/reserve-id.sh.
