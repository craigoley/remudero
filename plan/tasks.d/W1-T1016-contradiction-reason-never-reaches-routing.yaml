  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    RE-DERIVED AT origin/main 3efd809 IN A SCRATCH WORKTREE. Every claim below was read from
    source on that tree, not carried from the brief.

    (1) THE REPAIR EXISTS AND IS CORRECT. `deriveChangesetClaimUpdate` (src/run-task.ts, W1-T307)
    rewrites a stale `exactly N files` claim to match the real diff and fail-safes to `undefined`
    on anything it cannot reconstruct with confidence. `runFixRung` (same module) calls it BEFORE
    re-review, so a routed repair fixes the sentence and the review then judges the corrected body.

    (2) THE DISPOSITION ROW EXISTS AND IS CORRECT. `DISPOSITION_RULES` (src/lib/sweep.ts) carries
    THREE `blocked-fixable` rows; the third reads
    `pr.reviewState === "failure" && (pr.unmetCriteria.length > 0 || (pr.actionableGateFailures?.length ?? 0) > 0)`
    and is ordered BEFORE the `blocked-ambiguous` review-failure catch-all. So the disjunct that
    would route this shape is already shipped — this task must NOT add one.

    (3) THE BREAK IS ONE FIELD, ONE LAYER DOWN. `actionableGateFailuresFromReasons` (src/lib/sweep.ts)
    is `reasons.length === 1 ? [{ reason: reasons[0] }] : []`, and the changeset-contradiction path
    ledgers `reasons: []`. W1-T304's own doc in src/lib/review.ts records exactly this: the reason
    "existed only inside the posted commit-status description (a 140-char field that truncates it)".
    So `reasons: []` yields `actionableGateFailures: []`, the disjunct is false, and the PR falls to
    `blocked-ambiguous` — a human.

    (4) THE REASON IS ALREADY COMPUTED AND ALREADY ON THE ROW UNDER ANOTHER NAME.
    `reviewLedgerLegibilityFields` (src/lib/review.ts) already emits BOTH
    `failure_class: reviewFailureClass({...})` — which returns `changeset_contradiction` for this
    path — AND `failure_reason: verdict.summary`. Nothing has to be derived or invented; the single
    reason exists at the write site already.

    (5) AND NOTHING ROUTES ON `failure_class`, BY DESIGN. Its only two mentions in src/lib/sweep.ts
    are doc comments stating it is never keyed on (design note v), and
    `actionableGateFailuresFromLedger` (src/run-task.ts) says the same. That is a deliberate choice
    this task does not reopen.

    (6) POPULATING `reasons` DOES NOT COLLIDE WITH THE OTHER READER — CHECKED, NOT ASSUMED. Exactly
    two readers of `line.reasons` exist in src/. `unmetFromLedger` (src/run-task.ts) builds its
    result with `claims.map(...)` where `claims` comes from `unmet_criteria` and `reasons[i]` is only
    a positional lookup, so with `unmet_criteria` empty it returns `[]` whatever `reasons` holds. The
    contradiction path has no unmet criteria by construction. The second reader is
    `actionableGateFailuresFromLedger`, which is the one this task intends to reach.
  design: |
    THE SHAPE: write the reason that is already known into the field that is already read. No new
    field, no new rung, no new signal, and nothing consuming anything that did not consume it before.

    (i) THE ONE CHANGE. On the changeset-contradiction failure path, the `review.posted` row must
    carry its single reason in `reasons` rather than an empty array. The reason is already computed
    at the write site (rationale 4); this is a plumbing change, not a derivation.

    (ii) EXACTLY ONE REASON, NEVER MORE. `actionableGateFailuresFromReasons` qualifies only at
    `length === 1` and that bound is deliberate — it is what keeps a multi-cause failure out of the
    automatic rung. A contradiction failure that somehow carried two reasons must stay unrouted, so
    the write must not concatenate or flatten several contradictions into one entry.

    (iii) EXPLICITLY OUT OF SCOPE, AND ALL THREE ARE CORRECT AS THEY STAND:
    `deriveChangesetClaimUpdate`, `runFixRung`, and the `blocked-fixable` disposition row. Touching
    any of them widens a one-field routing fix into a behaviour change. Also out of scope: making
    anything read `failure_class`, which rationale 5 records as a deliberate design choice.

    (iv) THE UNMET-CRITERIA PATH MUST BE PROVEN UNCHANGED, IN THE SAME RUN. This edits a field an
    ordinary failing review also writes. A test that only shows the contradiction path now carries a
    reason would pass just as well if the change had corrupted the ordinary path, so the negative
    control must run beside it and observe the unmet-criteria row's own reasons untouched.

    (v) AND THE ROUTING MUST BE ASSERTED AT THE DISPOSITION, NOT AT THE FIELD. Showing
    `actionableGateFailures` is non-empty proves the plumbing; it does not prove the PR stops
    reaching a human. The criterion that matters drives the real rules and observes `blocked-fixable`
    where `blocked-ambiguous` was returned before.

    (vi) MUTATION CHECK, FILE-SHA BRACKETED. Read the sha256 of the edited file, remove the reason
    write, read it again and require it to DIFFER, run the suite and require the routing test to
    FAIL, restore, and require the sha to return to the original. A no-op mutation is otherwise
    indistinguishable from a surviving mutant.
