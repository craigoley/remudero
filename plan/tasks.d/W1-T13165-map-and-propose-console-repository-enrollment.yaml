- id: W1-T13165
  title: Map how a repository becomes fleet-managed today, and propose the one Console-driven path to enroll an existing or new repository
  repo: remudero
  depends_on: []
  type: recon
  verify: auto
  risk: high
  band_meaning: span
  status: queued
  dispatch_hold: false
  attempts: 0
  files:
    - docs/repository-enrollment.md
    - .remudero/daemon-instances.yaml
    - .remudero/managed-repos.json
    - src/lib/instance-registry.ts
    - src/lib/onboarding-readiness.ts
    - src/lib/onboarding-golive.ts
    - src/lib/product-build.ts
    - src/lib/product-plan-operation.ts
    - deploy/install-host-units.sh
    - deploy/recycle-container.sh
  origin: human#2026-11-16-unify-repository-management
  rationale: >-
    Operator ruling 2026-11-16: onboard existing repositories and create new ones from the Console,
    with every repository managed the same way as remudero. Observed 2026-11-16 at ef8b749: two
    different meanings of "managed" exist. A dedicated RMD instance is a .remudero/daemon-instances.yaml
    row (core, site, console; mode shadow|live; W1-T4265/W1-T4266 promote shadow to live through a
    reviewed registry PR). A product target is "enrolled" when it is listed in
    .remudero/managed-repos.json (site, console, wreckterra), which product-build and
    product-plan-operation check (target_not_enrolled / target_daemon_missing). The Console's
    onboarding wizard reads GET /v1/onboarding/readiness (eight checks) but no Core route adds a
    registry row, so "Go live" ends at a build receipt and a newly onboarded repository never gets
    its own instance. Wreckterra's signed-in Products page shows Build unavailable with a saved plan
    command awaiting reconciliation.
  design: >-
    RECON, no runtime change. Write docs/repository-enrollment.md with four sections: "Decision
    points" (one row per place that decides whether a repository is managed: registry rows,
    .remudero/managed-repos.json, the host copy at /etc/remudero/daemon-instances.yaml, Console
    allowlists; each with reader, writer and whether a Console action can change it today, citing
    file and symbol), "Host convergence" (what makes a new registry row live on the host: units,
    state dirs, containers, credential mounts; each step marked automated or manual with the script
    or symbol), "Proposed enrollment path" (one path for an existing repository and a new one from
    the product flow: readiness, a reviewed registry PR adding a shadow row, host convergence,
    shadow evidence, go-live), and "Ordered tasks" (implementation tasks in dependency order, each
    naming core, ops or Console). Label every statement OBSERVED (with a citation) or INFERRED.

    NO-INVARIANTS: a report-only task; it changes no code path, gate, registry row or credential.
  acceptance:
    - claim: "The report maps every decision point that makes a repository managed, with reader, writer and Console reachability cited by file and symbol"
      proof: "grep: ## Decision points in docs/repository-enrollment.md"
    - claim: "The report traces host convergence for a new registry row and marks each step automated or manual"
      proof: "grep: ## Host convergence in docs/repository-enrollment.md"
    - claim: "The report proposes one enrollment path for existing and new repositories (readiness, shadow registry PR, host convergence, shadow evidence, go-live)"
      proof: "grep: ## Proposed enrollment path in docs/repository-enrollment.md"
    - claim: "The report lists the implementation tasks in dependency order, each naming core, ops or Console"
      proof: "grep: ## Ordered tasks in docs/repository-enrollment.md"
    - claim: "Every statement in the report is labeled OBSERVED or INFERRED"
      proof: "grep: OBSERVED in docs/repository-enrollment.md"
