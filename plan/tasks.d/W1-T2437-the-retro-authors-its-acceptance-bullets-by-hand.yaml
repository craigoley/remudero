  title: "THE RETRO'S ACCEPTANCE BLOCK IS AUTHORED BY AN AGENT AND FAILS TWO WAYS THE HOUSE RENDERER WOULD HAVE PREVENTED ONE OF — `retro.ts` builds no PR body at all and imports `plan-pr-emitter` in comments only, so `renderAcceptanceBlock` is unreachable from that lane by construction; the Architect worker writes the bullets by hand, they wrap onto continuation lines that `parseAcceptanceBlock` treats as the block's end, and separately their proofs carry no recognised dialect"
