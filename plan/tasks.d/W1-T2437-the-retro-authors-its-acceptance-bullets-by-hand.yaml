    - claim: "the block a retro produces round trips through the parser the reviewer uses"
      proof: "unit test: test/retro-acceptance-block-shape.test.ts"
    - claim: "no claim text is generated altered or supplied by anything this task adds"
      proof: "unit test: test/retro-acceptance-block-shape.test.ts"
    - claim: "the plan filing lane's own body shape is unchanged"
      proof: "unit test: test/retro-acceptance-block-shape.test.ts"
  falsifier: |
    If a fresh sweep of `acceptance-author-gate` failures finds an `unparseable` defect on a branch
    that is NOT a `run-RETRO-*` sync, the defect is not confined to one producer and a writer-side
    fix is the wrong scope — a repair path or a parser change would then be arguable where today it
    is not. The measurement must count DISTINCT BRANCHES and not runs: the four runs on record are
    two PRs, and counting runs overstates the population two-fold.

    SEPARATELY DECISIVE: if `renderAcceptanceBlock` gains a dialect check, the second half of this
    task is already solved elsewhere and only the layout half remains; and if `retro.ts` ever begins
    building the PR body in code, the unreachability this shard rests on is gone and the finding must
    be re-derived rather than trusted.
