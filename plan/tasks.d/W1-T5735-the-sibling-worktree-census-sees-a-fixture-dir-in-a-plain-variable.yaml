- id: W1-T5735
  title: "THE SIBLING-WORKTREE CENSUS SEES A FIXTURE DIR HELD IN A PLAIN VARIABLE — W1-T5625's SUFFIXED_FIXTURE_DIR matches only `${<x>.dir}<suffix>` and `<x>.dir + \"<suffix>\"`, so a fixture dir copied into `repo` and suffixed as `${repo}-wt` builds the same leaking sibling and passes"
  repo: remudero
  depends_on: [W1-T5625]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 3.00
  risk: low
  origin: "operator session 2026-10-04: follow-up audit (research/audit/followups.md) item 92"
  plan_refs: [W1-T5625, W1-T5550]
  files: [test/no-test-worktree-outlives-its-fixture.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 70bb29f8. test/no-test-worktree-outlives-its-fixture.test.ts
    (W1-T5625, #9145) refuses, in any test file matching ADDS_WORKTREE, a path built beside a
    fixture dir. Its shape (a), SUFFIXED_FIXTURE_DIR, requires the operand to end in `.dir`
    (`\$\{\s*<ident>\.dir\s*\}[-\w.]` or `<ident>.dir + "<suffix>"`), and shape (b),
    PARENT_OF_FIXTURE_DIR, requires `dirname(<ident>.dir)`. A fixture dir first copied into a plain
    variable (`const repo = fixture.dir`, or a `gitRepo(...).dir` destructured) and then suffixed
    (`${repo}-wt`, `repo + "-wt"`) is the same sibling the file's header says leaked 10 worktrees,
    and neither shape sees it. No live offender was found at this sha; this closes the spelling.
  design: |
    Resolve one level of aliasing per file: collect identifiers bound from a fixture dir
    (`const x = <y>.dir`, `const { dir: x } = ...`, `const x = gitRepo(...).dir`) and apply both
    shapes to those identifiers too. Add a falsifier fixture text for each new spelling and a control
    that a suffixed non-fixture variable stays unflagged.
  acceptance:
    - claim: "the census flags a fixture dir aliased into a plain variable and then suffixed, and leaves a suffixed non-fixture variable alone"
      proof: "grep: W1-T5735: a fixture dir held in a plain variable and suffixed is refused in test/no-test-worktree-outlives-its-fixture.test.ts"
  falsifier: |
    Drop the alias pass: the aliased fixture text is not flagged and the new test fails.
