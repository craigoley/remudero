  note: |
    CORRECTED 2026-09-05 BY DESIGN (iii)'s OWN CHECK — THIS IS NOT A HOST FACT. The note below
    called it "the ONLY one of the four 2026-09-04 findings that is GENUINELY A HOST FACT". Read
    against the fixture, it is a TEST DEFECT: bash is not the code under test but a PROBE, the
    production path resolves bash BY NAME through the injectable spawn seam (detectHostFacts spawns
    "bash", never an absolute path), and the env the probe is handed carries PATH (measured keys:
    CODEX_HOME, GH_TOKEN, GITHUB_TOKEN, HOME, PATH, REMUDERO_WORKER_SCOPE). The probe could always
    have resolved the interpreter as production does. Fixed at the source; no cluster declared, since
    one over a fixed defect attributes to the machine reds that no longer happen. The criteria above
    are repointed to what was actually delivered rather than left describing a cluster it would be
    untrue to declare. The original text stands below, because design (iii) existed precisely to
    catch this and the record is more useful than a silent edit.

    ORIGINAL NOTE: THIS IS THE ONLY ONE OF THE FOUR 2026-09-04 FINDINGS THAT IS GENUINELY A HOST FACT. The other
    three — the ad-hoc lane leak, the host-update tmp collision and the git-grep word boundary — are
    defects, and each is filed as such. Grouping all four as "machine noise" was the reading this
    filing set out to correct, and design (iii) exists so this shard does not commit the same error
    one level down by declaring a cluster over a test defect.

    risk: high IS RULE 19'S SPAN, NOT BLAST RADIUS, AND IS SET DELIBERATELY. `sizingViolation`
