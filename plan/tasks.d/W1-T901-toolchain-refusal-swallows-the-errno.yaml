  note: "verify:auto — nothing here needs an operator ruling; the one open choice (design (i), the
    probe's return shape) is an engineering call the implementer settles against the live injection
    sites, not a policy the plan withheld.
    risk:high is Rule 19's SPAN plus a genuinely live surface: `resolveClaudeExecutable` is on the path
    of EVERY worker spawn on a host running a daemon, and a resolver that wrongly rejects a good binary
    grounds the whole fleet. The change itself is one probe, one field and one render.
    `test/worker.test.ts` IS DECLARED DELIBERATELY, not defensively: it asserts
    `/exists, --version failed/` today (worker.test.ts:496), so it is the suite that goes red the moment
    the message gains its cause — the W1-T442/W1-T407 lesson about a `files:` that omits the suite the
    change breaks.
    `test/daemon.test.ts` and `test/strike-accounting.test.ts` are NOT declared and were checked: both
    construct their own toolchain-blocked fixture strings and never read the real message.
    budget_usd 45 — small edit, and the cost is the falsifier: a real non-executable file, a real probe,
    and the platform's actual errno rather than one the test asserts into existence.
    WHAT THIS TASK IS NOT: it is not a re-file of W1-T236, whose two halves shipped
    (`DISABLE_AUTOUPDATER=1` in env.ts, the `preflight.binary_pin` rung in run-task.ts), and it is not a
    re-file of W1-T113, whose preflight already catches this class. It closes the sliver both left: the
    refusal knows the binary is unlaunchable and cannot say why."
