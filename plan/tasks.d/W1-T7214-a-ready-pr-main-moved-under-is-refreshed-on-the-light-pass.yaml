- id: W1-T7214
  title: "A READY PR MAIN MOVED UNDER IS REFRESHED ON THE LIGHT PASS — W1-T6022's ready-overlap refresh runs only in a full sweep, and a run in flight starves the full sweep; on 2026-10-09 #10353 merged at 13:52:22Z on a base that lacked #10349 (merged 13:43:28Z, same file src/lib/read-model-worker.ts) because no full sweep ran in between, and main stayed red 55 minutes"
  repo: remudero
  depends_on: [W1-T6022]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — which ready PRs the light pass refreshes; it writes contributor branches unattended
  band_meaning: blast-radius
  origin: "operator session 2026-10-09: main red 13:52-14:47Z (#10349 x #10353 typecheck clash), root-caused while fixing stuck PRs"
  plan_refs: [W1-T6022, W1-T5922, W1-T528, W1-T5921, W1-T5903, W1-T5940]
  files: [src/run-task.ts, src/lib/sweep.ts, test/a-ready-pr-main-moved-under-is-refreshed-on-the-light-pass.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    MEASURED 2026-10-09 (core ledger, git): #10349 (764f9d998) and #10353 (4e8cbb29f) both changed
    src/lib/read-model-worker.ts. #10353 was armed at 13:34:03Z on head 4430b86, its CI ran on a base
    without #10349, #10349 merged at 13:43:28Z, and GitHub's native auto-merge merged #10353 at
    13:52:22Z the moment its own CI finished. The ledger has no sweep.disposed row for #10353 between
    13:34Z and its merge, and no update-branch for it: the daemon restarted at 13:43:40Z and recycled
    13:47-13:52Z, and while a run is in flight it runs only light passes. `buildSweepLightHook`
    passes `updateBranch: undefined` (W1-T528: N single-PR `runSweep` calls could each update the
    "oldest of one"), so W1-T6022's `ready-overlap` refresh in `openPrsBehindMain` can only fire on a
    full sweep. W1-T5922 already lets the light pass ARM a ready PR, so the light pass arms a PR it
    can never refresh. The merge queue that would have caught this is disabled (W1-T5940 queued).
  design: |
    The light-pass hook computes `openPrsBehindMain`'s `ready-overlap` / `ready-unknown` selection
    ONCE over its whole `openPrs` snapshot (not per PR, so W1-T528's fan-out cost cannot recur) and
    refreshes at most the single oldest-head selected PR per light pass, through the same
    `updateBranch` effect and the same W1-T5921 one-update-per-(PR, head) spend the full sweep uses.
    It stands down under the W1-T5939 incident hold and W1-T5903's merge-queue skip exactly as the
    full sweep does. A ready PR with no overlap, or a truncated base list (`ready-unknown`), is
    unchanged. The update row names `source: light_pass`.
  acceptance:
    - claim: "a light pass refreshes the one ready PR whose own file main changed since its CI base; with two such PRs it refreshes only the older head; a ready PR with no overlap and a ready-unknown PR are not refreshed; under an incident hold it refreshes nothing"
      proof: "unit test: test/a-ready-pr-main-moved-under-is-refreshed-on-the-light-pass.test.ts"
  falsifier: |
    Leave `updateBranch: undefined` in `buildSweepLightHook`: the ready-overlap PR is never refreshed
    on a light pass and the test fails.
