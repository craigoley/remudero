  rationale: |
    The original scout observed four analytics.source_snapshot_failed rows across its trailing
    window. Recurrence is a class signal, not proof that every row has the same root cause.
    At source f70e352746a1cb9d1245de1f5c49ada5614e14be the slow lane uses the non-yielding
    deriveAnalyticsSnapshotFromCheckpointedLedger wrapper, unlike the existing legacy cache's
    scanAnalyticsLedger continuation. A timed-out full scan cannot retain its partial fold.
    A controlled 2026-10-21 ledger union observed core fail after 120029 ms while site and
    console completed. The separate legacy scan advanced across rewritten rotations; this
    does not prove identical invalidation or the sole cause of the slow-lane failure.
    Natural core recovery at 06:09:02.262 is a counterexample to permanent failure. Later ledger
    projector lag independently made the combined agent reading stale. Preserve both facts.
  design: |
    Reuse scanAnalyticsLedger's existing partial-result contract, with per-instance bounded
    progress separate from its last fully successful checkpoint. Retain the 120-second timeout
    and existing half-timeout leg budget; do not raise bounds, add provider calls or introduce
    request-time ledger scans. Continue progress on subsequent scheduled legs, not a busy loop.
    NEVER publish partial analytics as a successful source snapshot. Retain the prior payload
    and its actual source clock until a complete readable fold is available; distinguish
    attempt/progress/failure from successful source completion in bounded diagnostic evidence.
    Keep repository isolation, serial work, existing lease/switch publication guards, rotation
    and source invalidation, missing/unreadable/malformed corpus semantics and unknown prices.
    A partial instance must yield service to other due instances and normal Inbox units.
    Keep progress in this lane's existing lifetime or prove restart durability explicitly;
    never silently reuse foreign, corrupt or stale progress. No unbounded identifiers as metric
    labels, prompts, credentials, monetary assumptions, new permissions or spending changes.

    Test runSlowLaneWorker's actual default scanner with private real gzip/plain/live ledgers
    and a controlled clock. Both cold start and rewritten-checkpoint legs must retain progress,
    emit no partial success, and eventually equal a one-pass positive control without replay
    duplication. Cover timeout/abort, corrupt progress, unreadable earlier legs, new rotations,
    changed or missing live source, repository isolation, disabled view and lease loss. Prove
    another due repository and Inbox remain serviceable. Remove only continuation wiring and
    require the behavioral assertion to fail, then restore exact source and retain all tests,
    caller/census checks, same-head instrumented coverage, native author, canonical stored
    proofs, governed review and hosted CI. New source paths require a separate amendment.
    Source merge, qualified loaded adoption, natural fresh cached API and signed-in Agent
    behavior are separate acceptance stages; no deployment or forced refresh is authorized.
