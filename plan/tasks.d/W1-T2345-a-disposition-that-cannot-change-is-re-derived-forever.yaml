    - claim: "nothing added paces or throttles or sleeps a call"
      proof: "unit test: test/sweep.test.ts"
  falsifier: |
    If `sweep.disposed` rows over a fresh window show that no PR reaches fifty consecutive
    dispositions of one verdict on one unchanged head, the loop this task bounds does not occur at
    the rate measured and the task must be closed rather than implemented. The measurement to re-run
    is the same one: group rows by pr_number, key each on disposition plus head_sha, and take the
    longest consecutive run.
