- id: W1-T292
  title: "an EXPIRED copied OAuth token is invisible to the credential preflight — CREDENTIAL_FAILURE_RE keys on 'not logged in' + 'run /login', which the SDK's 'OAuth session expired and could not be refreshed' result matches NEITHER, so an expiry-dead spawn falls back to the generic unproven verdict W1-T237 exists to prevent"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  note: "ORIGINAL RATIONALE, UNCHANGED, for full context on the defect this task named.
    OBSERVED LIVE 2026-07-22 ~19:20Z: worker spawns died at $0 with 'OAuth session expired and could not
    be refreshed'. W1-T235 removed the LOCKED-login-keychain cause by copying the OAuth item into a dedicated
    worker keychain; the COPY then expires on its own schedule and cannot refresh, which is a SECOND, distinct
    credential death the preflight cannot currently name.
    VERIFIED AT SOURCE: src/lib/containment.ts:193-194 defines CREDENTIAL_FAILURE_RE = /not logged in/i and
    CREDENTIAL_LOGIN_HINT_RE = /run \\/login/i, and :308-311 requires isError PLUS BOTH fragments before setting
    credentialFailure. The expiry result text carries neither fragment, so evidence.credentialFailure stays false
    and the verdict path at :331-345 skips the spawn_credential_failure arm entirely — the run renders as the
    generic 'containment UNPROVEN' case, which is EXACTLY the misdiagnosis W1-T237 was filed to end. The
    conservative two-fragment match was correct for the locked-keychain signature and is simply blind to this one.
    PLATFORM FACT, not inference: in non-interactive (-p) and Agent SDK mode the CLI reports 'Failed to
    authenticate: OAuth session expired and could not be refreshed' (anthropics/claude-code issues #28827, #50743
    — OAuth tokens are not refreshed in headless/non-interactive invocations; #21765 — a COPIED credential's
    refresh token is not used on the machine it was copied to, which is precisely this fleet's shape).
    THE OPERATOR RESPONSE DIFFERS FROM BOTH NEIGHBOURS, which is the named-reason doctrine's whole test: a locked
    login keychain wants an unlock, an isolation failure wants a sandbox investigation, and an expired COPY wants
    a re-provision (W1-T293). Collapsing expiry into either neighbour sends the daemon — and the operator — to the
    wrong remedy, and the daemon may burn fix strikes against a cause no code change can reach."
  design: |
    ONE new named reason at the seam W1-T237 already built. Do not restructure the verdict path.
    (1) A THIRD conservative signature. Add an expiry-specific matcher (the observed 'OAuth session expired'
        fragment, and 'could not be refreshed' as the corroborating second fragment, in the SAME two-fragment
        style as the existing pair) applied ONLY in combination with isError. VERIFY THE EXACT STRINGS from a
        seeded SDK error-result before hardcoding — the two-fragment discipline exists so an unrelated error is
        never mislabelled, and a loose /expired/ would mislabel rate-limit and session-window text.
    (2) A DISTINCT reason token: spawn_credential_expired, carried in the containment.probe ledger line, the
        say() output and the returned verdict, alongside — never merged into — spawn_credential_failure.
    (3) FAIL CLOSED, unchanged. An expiry-dead worker proves nothing about isolation, so this is a NAMING change
        on an already-failing path, not a new pass. The three outcomes W1-T237 separated stay separated and gain
        a fourth: credential-failure (locked/logged-out), credential-EXPIRED, genuine-unproven, real-OS-denial.
    (4) THE HANDOFF. The named token is the trigger W1-T293's recovery keys on, so it must be a stable exported
        symbol, not a message substring assembled at the call site.
    NOT IN SCOPE: recovering from the expiry. Re-provisioning the worker keychain is W1-T293 and must not be
    folded in here — the W1-T235/W1-T237 split (remove the cause vs. name the failure) is the precedent this
    filing follows deliberately.
  acceptance:
    - claim: "this task is withdrawn as already satisfied — the expiry-named reason is a stable, distinct symbol in containment.ts and every criterion is credited to a named merged PR"
