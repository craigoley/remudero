  note: "FILED from feedback fb-1784749981468-a531e5 (captured 2026-07-22T19:53:01Z, incident ~19:20Z).
    Citations verified in this tree: containment.ts:193-194 (both regexes), :305-311 (the isError + BOTH fragments
    conjunction), :331-345 (the verdict arm and the spawn_credential_failure token).
    PLANTED-PROBE ACCEPTANCE, the W1-T98/W1-T237 pattern: seed a known-shaped expiry result and assert the verdict
    names it, rather than waiting for the live condition to recur.
    verify:auto — the whole change is a pure classification over a seeded WorkerResult; no spawn, no keychain, no
    credential required. risk:low — it only SPLITS an already-failing verdict; the worst regression is a
    mislabelled reason on a run that fails closed either way, and the third acceptance claim is that falsifier.
    budget_usd 60 — one file, one regex pair, one verdict arm, a four-case table.
    SEQUENCING, expressed here rather than as a depends_on edge (the W1-T233 precedent — both tasks arrive on one
    plan PR and are independently valuable): this names the condition, W1-T293 heals it. If W1-T293 lands first it
    must not invent its own message-substring test for expiry; it keys on this token."
