  rationale: "WITHDRAWN AS ALREADY SATISFIED 2026-08-04 (W1-T324, the plan-hygiene sweep). Filed at 03:10 UTC on
    2026-08-03 (same filing PR #1168 as its sibling W1-T293), fixed at 05:58 UTC the same day — the same
    concurrent-filing-vs-concurrent-implementation pattern as its siblings W1-T273/W1-T291. Verified from
    source before withdrawing, not inherited from a claim.
    ALL FIVE CRITERIA ARE SATISFIED BY commit 1a8098e (PR #1174, merged 2026-08-03T05:58:23Z,
    'fix(containment): recognize expired-oauth spawn text as credential failure'), whose body explains a
    round-1 attempt folded expiry into spawn_credential_failure (contradicting this record's explicit
    'must be DISTINCT' requirement) and round 2 fixed that review finding to match this task exactly:
      criterion 1 -> test/containment.test.ts:271 'probeContainment: a seeded error-result carrying
        \"OAuth session expired...\"' yields the expiry reason
      criterion 2 -> test/containment.test.ts:299 (distinct from spawn_credential_failure; login-hint case
        unchanged)
      criterion 3 -> test/containment.test.ts:328 (unrelated 'expired' text, e.g. rate-limit, not
        mislabelled)
      criterion 4 -> test/containment.test.ts:258 'assessContainment: credentialExpired => FAILS CLOSED...'
      criterion 5 -> `grep: spawn_credential_expired in src/lib/containment.ts` MATCHES 5 hits today, all
        from PR #1174's own implementation — a stable exported symbol, exactly as required
    RESIDUAL NOTE, carried forward rather than smuggled into this credit: the CONSUMER side (a real
    run-time call site setting worker.ts's priorSpawnCredentialExpired from a live containment failure)
    is not wired anywhere outside worker.ts/worker-home.ts/containment.ts themselves — but that end-to-end
    wiring was never one of this task's own acceptance criteria (it is W1-T293 arm (3)'s job, which PR
    #1169 supplies). Doesn't affect this task's own credit.
    THE CODE STANDS AND MUST NOT BE REVERTED. This entry withdraws a WORK ITEM, not the behaviour.
    ★ THE RESIDUAL CAME TRUE IN PRODUCTION 2026-08-12, AND THE WITHDRAWAL STAYS CORRECT.
    This entry is NOT re-opened: the DETECTOR shipped and still stands. `assessContainment`
    (src/lib/containment.ts) checks `credentialExpired` FIRST — before `credentialFailure`, before
    `outsideWriteCreated`, before the `!osDenialSeen` fallback — and names `spawn_credential_expired`
    exactly as this task required. Verified again at c9007d7. Re-opening it would re-file work that
    merged 2026-08-03, and this record already says the code must not be reverted.
    WHAT FAILED IS THE RESIDUAL NOTE ABOVE, and it now has a measured cost. On the Azure daemon an
    expired credential disabled four subsystems and NONE of the four messages named expiry: three
    `retro.error` rows (refusing to spawn a credential-dead worker), a `blocked_containment` reading
    'no OS-denial observed … the write may never have been attempted', a triage with no verdict line,
    and a headroom governor that went blind and then parked. It cost FOUR container restarts and THREE
    recons; the decisive fact was two timestamps 8.0 hours apart.
    WHY THE NAMED REASON DID NOT FIRE, located at source rather than inferred: `credentialExpired` is
    TEXT-MATCHED from the dead worker's transcript — it requires `isError` PLUS both
    `CREDENTIAL_EXPIRED_RE` and `CREDENTIAL_REFRESH_FAILED_RE`. A worker that dies without producing
    both fragments leaves the flag false, the correctly-ordered rungs fall through, and the LAST arm
    prints the generic unproven text — precisely the message Azure showed. The expiry signal is inferred
    from a dead process's WORDS while the credential file's own `expiresAt` sits readable on disk:
    `extractCredentialExpiryMs` (worker-home.ts) already parses it, and is compared against the clock
    only on the darwin sidecar path, never on the Linux/container preflight path.
    AND THE HOOK IS STILL UNWIRED, WITH ITS OWN COMMENT NOW STALE. `worker.ts`'s
    `keychain.priorSpawnCredentialExpired` says in terms: NOT YET WIRED to any containment token here
    (W1-T292 hasn't shipped one to consume) — this is the hook a future caller sets. W1-T292 DID ship
    that token on 2026-08-03, and nobody returned to wire the hook. MEASURED at c9007d7: `git grep
    priorSpawnCredentialExpired` finds it declared in worker-home.ts and worker.ts and threaded between
    them, and set by NO caller in run-task.ts, daemon.ts or drain.ts. The keychain rung that would carry
    it is itself macOS-only (run-task.ts: macOS only; elsewhere the rung is absent), so on Linux the
    file-based path never runs either.
    THE CREDIT ERROR WORTH NAMING: this record hands the end-to-end wiring to W1-T293 arm (3), and
    W1-T293's own record is ALSO withdrawn-as-already-satisfied (PR #1169, 2026-08-03). Two siblings each
    pointed at the other for the consumer side and both were withdrawn; the wiring exists in neither.
    That is not a defect in either withdrawal — each task's OWN criteria really were met — it is a gap
    that falls between two correct credits, which is the shape a per-task check cannot see.
    NO NEW ID MINTED HERE (a daemon is running); whether the wiring becomes its own task is the
    operator's call, and this record now carries the evidence for it.
