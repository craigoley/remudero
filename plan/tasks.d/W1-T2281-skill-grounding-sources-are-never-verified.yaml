    - claim: "every grounding source declared by every skill in the shipped registry resolves"
      proof: "unit test: test/skill-grounding-sources-resolve.test.ts"
    - claim: "a skill whose entire declared corpus is unresolvable is distinguishable from one that searched and matched nothing"
      proof: "unit test: test/skill-grounding-sources-resolve.test.ts"
    - claim: "the section-anchor form is either resolved or refused, never silently widened to the whole file"
      proof: "unit test: test/skill-grounding-sources-resolve.test.ts"
    - claim: "no skill declares a grounding source under a path absent from a fresh checkout"
      proof: "unit test: test/skill-grounding-sources-resolve.test.ts"
    - claim: "a source that vanishes at runtime still degrades to no-match rather than throwing"
      proof: "unit test: test/skill-grounding-sources-resolve.test.ts"
