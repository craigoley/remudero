  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so a source module, a config directory and a test named after neither trip it at
    `medium`. The change is one check plus the declarations it reddens.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/skill-grounding-sources-resolve.test.ts`, declared in `files:`, so on this filing
    PR it resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL, CONFIRMED PRESENT BEFORE IT
    WAS BELIEVED. `rmd check-proof` on the declared path reads `exit: 1`, `hits: 0`, `verdict: fail`.
    The SAME verb on an EXISTING pure path — `unit test: test/skill.test.ts`, the test file for the
    very module this task changes — reads `verdict: pass`.

    THE ID WAS RESERVED BY THE OPERATOR AND IS NOT RE-MINTED; NO MINT WAS CALLED, BECAUSE ONLY ONE
    SHARD IS WARRANTED. `refs/rmd-id/W1-T2281` resolves to 86799f0d565fa341b56a3101effe383cf8e12dc5;
    this shard VERIFIES THE ID IS UNUSED rather than that it is this account's. Five surfaces swept,
    each control pre-qualified for its own surface, remote ref counts read first (142 heads, 400
    `refs/rmd-id/*`): shards on main 0 (control W1-T2276 = 1); whole tree at HEAD 0 (control 1);
    remote head names 0 (control, 92 `run-*` heads read); commit subjects and bodies on main 0
    (control 1); open PR titles, bodies and head refs 0 across all 7 open PRs (control `W1-T2` = 7).
    Presence of a reservation is not usage.

    A SECOND SHARD WAS CONSIDERED AND REFUSED. The recon's other candidate — that the operator's
    repeated filing rails exist only as prose — has no defect measured in this repo to anchor it,
    and its only real warrant would have been "another project automates this", which does not
    justify a task. W1-T1076 already owns duplicate-shard detection at filing time and covers the
    W1-T2274/W1-T2275 pair retired today (#2840); W1-T2266 already owns the adoption gap. Filing
    fewer was the correct outcome.
