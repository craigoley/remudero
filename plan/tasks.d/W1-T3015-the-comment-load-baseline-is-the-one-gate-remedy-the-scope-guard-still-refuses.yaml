- id: W1-T3015
  title: "THE COMMENT-LOAD BASELINE IS THE ONE GATE REMEDY THE SCOPE GUARD STILL REFUSES — `comment-load-ratchet` prints `scripts/comment-load-baseline.json` as its own fix, but that path is absent from `REGENERABLE_ARTIFACT_GENERATORS`, so committing it is an out-of-scope overrun, the fix prompt forbids it, and a conflict on it is refused; register it, as W1-T2650/W1-T2651 did for its twin"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
