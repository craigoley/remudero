  falsifier: |
    Keep the `remoteHead !== checkpoint.headSha` throw for a present ref. Both dispatches in the first test then end no_pr
    restart_checkpoint_restore_failed, the loop this task closes. Write the superseded row but leave
    `pendingWorkerBoundaryHandoffs` blind to it, and the second dispatch still sees the receipt. Leave the row out of the
    retained set, and the rotation test sees the receipt pending again. Push H back over the moved ref, and the rewritten
    test sees the origin ref change. Collapse a failed `ls-remote` into "moved", and the failed-read test sees a transient
    error consume a live receipt.
