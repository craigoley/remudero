  title: "A CHECKPOINT BRANCH THAT MOVED IS RESOLVED ONCE, NOT REFUSED ON EVERY DISPATCH — when a handoff receipt's run branch still exists but its head is no longer the receipt's head, restoreBoundaryCheckpoint refuses with \"remote head moved\", pendingWorkerBoundaryHandoffs keeps the receipt after that failure, and every later dispatch of the task fails the same way with no worker run"
  repo: remudero
