- id: W1-T3149
  title: "THE AUTHOR-TIME GATE CAN READ A PR'S BASE/HEAD BUT DOES NOT REFUSE A PLAN-ONLY DIFF THAT CLAIMS AN IMPLEMENTATION TASK — it admits the trailer, then CI and deterministic review discover criteria no plan amendment can satisfy"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 20.00
  files: [scripts/acceptance-author-gate.mjs, test/acceptance-author-gate.test.ts]
  origin: "operator-session#root-cause-pass-2026-09-08"
  plan_refs: ["W1-T952", "W1-T2297", "W1-T3231", "W1-T413", "W1-T3067"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at origin/main dc970e6e. On 2026-09-08, #4573 changed one
    `plan/tasks.d/` shard while its body carried `Remudero-Task: W1-T3101`; the deterministic
    floor then judged W1-T3101's implementation criteria against the plan-only diff. The same
    shape occurred in #4585, #4586, #4587 and #4588 for W1-T3043. Removing the trailer and
    supplying the PR's own `## Acceptance` block repaired each PR by hand.

    The original shard said the credit half was also unguarded. That is now false. The merged
    status path refuses a trailer credit when the changed paths are plan-only
    (`src/lib/status.ts:2121-2161`), with `test/trailer-credit-plan-only.test.ts` proving both
    refusal and a source-changing control. W1-T3149 must not duplicate or weaken that landed
    post-merge guard.

    The earlier author-time boundary remains unprotected. `acceptanceAuthorTimeCheck` accepts any
    trailer that resolves in the plan (`src/lib/review.ts:4750-4780`). Its CI caller already reads
    `pull_request.base.sha` and `head.sha`, checks out full history, and runs a local
    `git diff` to identify introduced shard records (`scripts/acceptance-author-gate.mjs:103-155`,
    `.github/workflows/acceptance-author-gate.yml:59-64`). It does not use that same local evidence
    to ask whether this trailer can describe the diff. The result is a green author-time check,
    followed by an avoidable full CI/review cycle and a generic criterion failure.
  design: |
    (i) ADD ONE AUTHOR-TIME STRUCTURAL REFUSAL. Derive the non-empty changed-path set from the
    event payload's base/head range with local git; resolve the trailer's declared `files:` from
    the checked-out plan; and refuse only when every changed path is in plan scope while the
    trailered task has at least one declared non-plan path. Reuse the repository's plan-scope
    predicate; do not create a fourth spelling of plan scope.

    (ii) KEEP THE EXISTING ACCEPTANCE PREDICATE AS THE BODY AUTHORITY. This gate is an additional
    structural check before `acceptanceAuthorTimeCheck`, not a replacement for its parser or its
    plan resolver. The refusal message names the trailer, the non-plan declared paths, and both
    remedies: remove the trailer and author this PR's own `## Acceptance` block, or include the
    implementation changes.

    (iii) PRESERVE BOTH CONTROLS. A plan-only task may legitimately keep its trailer on a plan-only
    diff. The same implementation-task trailer may legitimately pass when the diff includes a
    source path. An unavailable, empty, or malformed local diff result supplies no structural
    evidence and leaves the existing gate's verdict unchanged; it must not manufacture a refusal
    on every PR during a checkout failure.

    (iv) NO NETWORK, NO POST-MERGE CHANGE, NO REVIEW-PATH DUPLICATION. The current workflow's
    `fetch-depth: 0` and event payload already provide the needed evidence. Do not call GitHub,
    alter `findMergedByTrailer`/status credit, alter semantic-review spawning, or add a second
    review-time version of this predicate.
  acceptance:
    - claim: "the author-time gate refuses #4573's measured shape: one plan/tasks.d path plus a W1-T3101 trailer, naming that trailer, W1-T3101's non-plan declared files, and both remedies"
      proof: "unit test: W1-T3149 criterion 1"
    - claim: "a plan-only diff trailered to a task whose declared files are all in plan scope passes the new structural check"
      proof: "unit test: W1-T3149 criterion 2"
    - claim: "a source-changing diff carrying the same implementation-task trailer passes the new structural check"
      proof: "unit test: W1-T3149 criterion 3"
    - claim: "missing, empty or unreadable local diff evidence preserves the existing acceptance-author-gate verdict instead of refusing by default"
      proof: "unit test: W1-T3149 criterion 4"
    - claim: "removing only the structural predicate makes the #4573-shaped fixture pass, proving current main lacks this earlier refusal"
      proof: "unit test: W1-T3149 criterion 5 mutation"
  falsifier: |
    Close without implementation if the author-time gate already combines the payload-derived changed
    paths with the trailered task's declared files and emits a structural refusal for the #4573
    shape. Checked at origin/main dc970e6e: `introducedShardTaskIds` is the only base/head diff
    consumer, and `evaluateGate` passes only `body`, `authorLogin`, `trailerResolves`, and
    `introducedTaskIds` to `acceptanceAuthorTimeCheck`; no changed-path/task-file predicate exists.

    The post-merge credit concern is falsified and deliberately removed from this task's work:
    `planOnlyDiffRefusal` already controls trailer credit in `src/lib/status.ts:2143-2161`.
  note: |
    AMENDMENT 2026-09-11. The original W1-T3149 scope joined an early structural review failure to
    a post-merge false-credit risk. The latter landed independently as W1-T413/W1-T3067 behavior,
    so this shard retains only the unbuilt author-time refusal. This is one concern: reject a
    plan-only PR that structurally cannot implement the task it claims.
