- id: W1-T2699
  title: "A SECRET A WORKER CAN READ IS A SECRET A PROMPT CAN LEAK — move the model credential and the git credential behind the daemon, so a worker's process tree holds only sentinels, the daemon injects real values at the network boundary for declared hosts alone, and the ledger records destination and decision, never a value"
  repo: remudero
  depends_on: [W1-T2698]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 90.00
  rationale: |
    RE-DERIVED AT f632e15fa (2026-09-02).

    (1) THE SHAPE, AND WHERE IT COMES FROM. OpenClaw 2.0's release note: "keep resolved secrets
    behind process-local sentinels through auth storage, inject plaintext only at final
    network/provider boundary", with an "opt-in proxy limiting protected-secret substitution to
    approved destinations" and a "value-free audit". Its network-proxy doc is candid that the
    proxy's destination policy "is the actual security boundary" and that it logs "destination,
    decision, status, and reason — never request bodies, authorization headers, cookies, or other
    secrets". This repository has the pieces the shape needs: an allowlist of hosts
    (settings/worker.json, W1-T1289), an App-token refresher in-process (W1-T2311), a credential
    helper story (W1-T2552), and a probe that names what a worker can reach (W1-T2698).

    (2) WHY IT MATTERS MORE HERE THAN THERE. Prompt injection is the threat model's first class
    and its own residual: "adaptive attackers still exceed 80% against state-of-the-art
    defenses". W1-T2700's envelope is a floor, not a wall. The mitigation that does not depend on
    the model resisting is that there is nothing in reach worth exfiltrating. And the 2026-09-02
    DECISIONS verification records the bring-your-own-subscription shape's hardest reading:
    a customer's token at rest on the operator's VM. A boundary where the token rests in one
    daemon-held store, never in a worktree, a transcript or a worker env, is the shape that
    reading asks for.

    (3) THE TWO CREDENTIALS, AND THE SEAM FOR EACH. THE MODEL: the SDK subprocess honours
    `ANTHROPIC_AUTH_TOKEN` above the on-disk login and `ANTHROPIC_BASE_URL` for its endpoint
    (Claude Code authentication docs, precedence list). A worker therefore receives a sentinel
    bearer and a loopback base URL; the daemon's boundary proxy replaces the sentinel with the
    real subscription credential for the model host and nothing else. `buildWorkerEnv`'s
    `ANTHROPIC_*` strip (W1-T1) is amended for exactly these two names, and `billingMode` keeps
    reading subscription because the injected credential is the subscription's. THE REPOSITORY:
    a git credential helper that answers over a unix socket the containment mounts, minted per
    request by the daemon from its refreshed installation token, so the token never sits in a
    file the worktree can read.
  design: |
    (i) src/lib/secret-boundary.ts: the loopback proxy (bind on 127.0.0.1, one port per daemon),
    the sentinel minting, the destination table derived from settings/worker.json, and the
    value-free ledger row `boundary.request` (host, decision, status, reason). An undeclared host
    is refused at connect time, before any header is read.

    (ii) src/lib/worker.ts: `buildWorkerEnv` emits the sentinel and base URL; the credential
    helper path and socket are placed in the child's git config; nothing else in the env changes.

    (iii) src/lib/github-app.ts: `mintScopedToken(repo, ttl)` for the helper — the smallest
    token the push needs, expiring with the run (W1-T2398's run-length gate is the model).

    (iv) THE FALSIFIER IS W1-T2698's PROBE: after this task the baseline for every host class
    shrinks to zero reachable secrets, and the probe's own reads of the credentials file, the
    env and the helper all report refused or sentinel. That is the acceptance, not a claim in
    prose.

    (v) WHAT DOES NOT CHANGE. The allowlist. The App. The subscription. Billing mode. The
    reviewer. No new external write.
  acceptance:
    - claim: "a worker's env carries a sentinel bearer and a loopback base URL and no real credential, proven by the spawn env builder's output"
      proof: "unit test: test/secret-boundary.test.ts"
    - claim: "the boundary proxy substitutes the real credential only for the model host and refuses an undeclared host at connect time with a ledgered reason"
      proof: "unit test: test/secret-boundary.test.ts"
    - claim: "the git credential helper answers over the socket with a per-request scoped token and never writes a token to the worktree"
      proof: "unit test: test/secret-boundary.test.ts"
    - claim: "the ledger row for a boundary request carries host, decision, status and reason and never a value"
      proof: "unit test: test/secret-boundary.test.ts"
    - claim: "the spawn path routes through the boundary"
      proof: "grep: secretBoundaryEnv( in src/lib/worker.ts"
