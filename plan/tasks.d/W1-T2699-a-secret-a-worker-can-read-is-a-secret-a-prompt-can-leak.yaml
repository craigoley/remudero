  note: |
    risk:high, band_meaning:blast-radius — this is the auth path of every worker; a defect here
    stops the fleet, which is why it depends on the probe and ships behind it.

    ONE QUESTION FOR THE OPERATOR, NOT THE BUILDER. Routing the operator's own subscription
    credential through a loopback proxy on the operator's own host, for the operator's own
    workers, is ordinary use of the credential in the sense the 2026-09-02 DECISIONS verification
    quotes; the customer shape stays the prior-approval question that entry records. This shard
    does not settle that and does not need to.

