- id: W1-T4076
  title: "THE HOST LAUNCHERS CAN NEVER CONVERGE — the instance registry lacks ten fields install-host-units.sh requires, so every watchdog's converge refuses and the site launcher, installed 2026-09-13, still runs deploy-run WITHOUT --state-root and reads core's state instead of its own"
  repo: remudero
  depends_on: []
  type: implement
  priority: 1
  verify: human
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: high
  band_meaning: blast-radius
  origin: "operator-session#auto-recycle-2026-09-22"
  plan_refs: ["W1-T3596", "W1-T3732", "W1-T3245"]
  files:
    - .remudero/daemon-instances.yaml
    - test/the-instance-registry-renders-every-launcher.test.ts
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-22 ON THE FLEET HOST.
    (1) THE SITE DAEMON IS NEVER RECYCLED BY ITS OWN WATCHDOG. ~/rmd-site-relaunch.sh (root-owned,
        installed 2026-09-13) runs `rmd deploy-run --image-drift-only` with no --state-root, so the
        supervisor evaluates CORE's state root: at 21:53Z it reported "up-to-date" for site while the
        site container still ran image 64cb920c28ab two image commits behind, with site's own
        state/DEPLOY_REQUESTED unread. The current template (deploy/install-host-units.sh) renders
        `--state-root "$STATE_DIR"`; core's and console's launchers carry it because they were
        re-installed by hand on 2026-09-20/21.
    (2) CONVERGENCE NEVER RUNS. Each launcher's converge_host_units re-renders its units from the
        checkout, but `install-host-units.sh --instance <name>` exits FATAL "instance 'site' missing
        required field 'service_user'": the committed registry declares repo, state_dir,
        container_name, the three credential dirs and image, while the installer requires ten more —
        service_user, max_old_space_mb, service_name, watchdog_service_name, watchdog_timer_name,
        launcher_path, revival_log, gh_app_id, gh_app_installation_id, gh_app_private_key_path.
        recycle-container.sh already accepts all ten (it ignores them), so declaring them is safe
        for recycles.
    (3) Separately, site's checkout had been DIRTY since 2026-09-20 with an unsubmitted feedback file
        (moved to rmd-site-state/recovered-feedback/; its subject is covered by W1-T4006), which made
        converge refuse before it ever reached the installer.
  design: |
    (i) Declare the ten fields for core, site and console, each MEASURED from the live host (the
    running systemd units, the launchers' own values, `docker inspect`) and cited in a comment — the
    same discipline the registry's header already records for the existing fields.
    (ii) A test renders every declared instance through install-host-units.sh's check mode in a temp
    dir and asserts it succeeds and that the rendered launcher passes --state-root.
    (iii) verify: human, because the first tick after merge REWRITES root systemd units on all three
    daemons; the operator watches that first converge (check mode first, then install).
  acceptance:
    - claim: "every declared instance renders through the installer's check mode"
      proof: 'grep: test("W1-T4076: every declared instance renders its host units" in test/the-instance-registry-renders-every-launcher.test.ts'
    - claim: "every rendered launcher scopes deploy-run to its own state root"
      proof: 'grep: test("W1-T4076: every rendered launcher passes its own state root" in test/the-instance-registry-renders-every-launcher.test.ts'
  falsifier: |
    CLOSE IF .remudero/daemon-instances.yaml already declares service_user for every instance.
