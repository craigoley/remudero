      that the fleet's review merges. The backlog spec's `apply` is the model: plan-only paths, a title, a body
      with `## Acceptance` grep proofs on its markers.
    - The LLM judge seam: src/lib/issue-revalidation-garden.ts `issueRevalidationJudgeText`. It is one tool-less
      spawn on the escalation judge's mount (`benchmarkNonDispatchSpawn`, `withReceiptIdentity`).
    - Strict JSON verdict parsing: src/lib/fix-progress-judge.ts `parseFixProgressVerdict` / `judgeFixProgress`.
      A malformed or failed answer is "unavailable" and is re-asked next pass, never guessed.
    - Earned authority:
      - src/lib/machine-filing-judge.ts `familyTrackRecord` / `earnedConfidenceBar`, and its re-ask schedule
        (`reaskIntervalMs`, W1-T8830).
      - W1-T9035's allowance, max(1, floor(alpha / (beta + undone))), is the 10-13 operator ruling's shape.
