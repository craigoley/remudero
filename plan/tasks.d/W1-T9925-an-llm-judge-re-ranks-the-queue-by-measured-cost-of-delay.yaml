  design: |
    No fixed count, interval, ratio or cap anywhere (standing operator rule). Every bound below is read from a
    measurement and is reported with its inputs.
    1. A NEW REGISTERED GARDENER `queue-judge` in src/lib/queue-judge-gardener.ts.
       - It is a `GardenSpec` with classes `raise` and `lower`, both reviewed: `review` says "priority is a judgement
         call", and the PR opens with `judgedByOutcomeNote`.
       - The module exports `queueJudgeGardenSpec(deps, overrides?)`, built like `backlogGardenSpec`. Its one caller
         is the new `"queue-judge"` case in run-task.ts `buildRegisteredGarden`.
       - Append it to `REGISTERED_GARDEN_NAMES` and wire it in `buildRegisteredGarden` with the escalate dep, as
         the backlog case does. The off switch is the framework's upper-cased name prefix.
       - It changes nothing in dispatch-value.ts. Dispatch already turns priority into urgency. This gardener
         makes the priority mean something again.
    2. INPUTS: ONE EVIDENCE PACK PER QUEUED TASK, read-only, built before the judge is asked.
       - Dependents: `openDependentFanout` over `depends_on`, with the dependent ids.
       - Incidents and escalations: open incident records (src/lib/incident-lifecycle.ts store, status not
         `verified`) and open escalations whose text names the task id or a fingerprint the shard cites.
       - Red-PR blockers it would fix: open PRs whose newest `sweep.disposed` row (pr_number, disposition, reason,
         task_id) names the task id or a ledger step the shard cites. Report the count and the PR numbers, and
         separately whether a STUCK disposition (held, escalated, blocked) cites it.
       - Age: filing time from `filingDatesFromPlanHistory`, expressed in measured median waits, the same unit as
         `costOfDelayContext`.
       - Attempts and failures: run.start count, non-worker refusals (`streakRefusal`), the last verdict, and the
         shard's `attempts`.
       - Operator origin: an operator pin on the priority line, an `origin:` that names an operator session or
         approval, or neither.
       - Its current dispatch score and stride pass, from the newest `dispatch.cost_of_delay.ready` context when
         one is available.
       - Why it is not dispatching, when that is not its rank: an unmerged dependency, a `dispatch_hold`, a
         `not_before`, `verify: human`, or a file overlap with an in-flight run.
       - Each fact names its source (ledger step and ts, file, PR number), so the judge cites evidence rather than
         recalling it.
       - The ledger read is bounded to the steps named here (readLedgerUnionRawLinesSync with a pattern, as
         W1-T5363 bounds the backlog read). It is never an unfiltered union read.
    3. THE JUDGE.
       - One tool-less spawn per pass on the escalation judge's mount (the `issueRevalidationJudgeText` seam). The
         prompt holds:
         - the evidence packs;
         - the operator's rule, verbatim: cost of delay = what waiting costs (dependents and capacity unblocked,
           incidents and red PRs it ends, protective intent), never the task's age alone;
         - its own record (design 6).
       - It answers strict JSON. For each task it moves: `{id, priority, reason, evidence: [refs from the pack],
         expected_cost_of_delay, expected_outcome: {unblocks_tasks, ends_incidents, unsticks_prs, starts_within}}`.
       - Parse it like `parseFixProgressVerdict`. A malformed answer, or a failed spawn, writes nothing. It ledgers
         `queue_judge.unavailable` with the reason and is asked again next pass.
       - Deterministic checks after the judge. Refuse, row by row:
         - an unknown id;
         - a cited evidence ref that is not in the pack;
         - a task that is not queued;
         - a value outside lint's [0, 99].
       - Operator pins. A task whose priority line carries an operator pin (`# operator-YYYY-MM-DD` or
         `# operator YYYY-MM-DD`) is NEVER moved to a larger number. The judge may propose it. The proposal becomes
         ONE escalation through the gardener's escalate dep, carrying the judge's reason and evidence and asking
         the operator to confirm. Nothing is written to the shard. The pin may be raised (a smaller number) like
         any task. No judged value may sit below the smallest operator-pinned priority on the queue without the
         same escalation. The judge reorders within the operator's frame and never above it.
       - The judge OWNS a priority only while it equals the value in its marker, the same ownership rule as the
         backlog gardener's `MARKER`. Any other edit, by an operator or another gardener, is authoritative for
         that pass and is re-judged from fresh evidence.
    4. OUTPUT: PRIORITY WITH A ONE-LINE REASON AND THE EVIDENCE, through a reviewed plan PR.
       - The write-back uses this repo's existing reason field, the inline comment on the priority line:
         `  priority: <n>  # queue-judge-YYYY-MM-DD: <one-line reason>`
         Below `status: queued` goes a marker:
         `  # queue judge: priority=<n> evidence=<16 hex>`
         The hex is a hash of the evidence pack, the same scheme as `evidenceHash`.
       - Where it replaces a `# backlog gardener: band=` marker, it removes that marker. The backlog gardener
         then reads the value as declared and leaves it alone.
       - A judged machine record goes through `reparkStaleRuling`, exactly as `applyBacklogActions` does, because
         priority is inside its `risk_ruling` pin. The machine-filing judge re-rules it on its next pass (W1-T8830).
       - `landingRefusal` is `backlogLandingGuard` (or the same lint-plan and machine-shard checks). A draft lint
         would refuse is a recorded filing failure, never a red PR.
       - The PR body lists each move: from and to, the reason, the cited evidence, the expected outcome.
         `## Acceptance` holds one `grep:` per moved shard on its marker line.
       - It ledgers one `queue_judge.prediction` row per move: task_id, from, to, expected_cost_of_delay,
         expected_outcome, evidence_signature, pr_url.
       - Only the `raise` or `lower` class drawn this pass acts, as `planGarden` decides. One pending PR at a time,
         per the framework.
    5. PACE AND SIZE, BOTH MEASURED.
       - Cadence comes from queue churn, not a timer. A pass is due (`cheapFingerprint`) when the queue has turned
         over the head its last ranking covered. The changes since its last landed ranking count tasks filed,
         merged, retired or re-prioritized, read from main's first-parent plan history. The pass is due once that
         count reaches the number of distinct tasks its last pass predicted would start before the next one. That
         number is the measured starts per hour (distinct task_id `run.start` rows) times the measured open-to-merge
         time of its own PRs.
       - High churn shortens the interval and a quiet queue lengthens it. An unchanged queue reads nothing
         (`gardenPassDue` returns on the same fingerprint). A first pass, with no record, is due at once.
       - Size comes from its own measured review cost. For each of its merged PRs, review cost per moved shard is
         the minutes from PR open to its first PASS `review.posted` row, divided by the shards it changed. Take the
         median of that.
       - A pass moves no more shards than fit, at that cost, inside the time until its next pass is due. It also
         moves no more than its record allows: max(1, floor(alpha / (beta + misses))) for the acting class (design
         6). It takes the smaller of the two.
       - Moves are ranked by the size of the predicted cost-of-delay change, largest first. Every other proposed
         move is named as deferred in `queue_judge.scorecard`, with the bound and its inputs.
       - Until it has a merged PR, the review prior is the backlog gardener's own merged plan PRs, measured the
         same way, and the row says so.
    6. SELF-CHECK: PREDICTIONS SCORED AGAINST OUTCOMES, AND AUTHORITY EARNED FROM THE RECORD.
       - Each pass first scores every open prediction whose task merged or retired, or whose queue has turned over
         twice past its predicted start.
       - A RAISE is a hit when:
         - the task started within its predicted window; and
         - after it merged, what it claimed happened: a named dependent dispatched, a linked incident reached
           `verified`, or a named stuck PR merged or left its stuck disposition.
       - A LOWER is a hit when no incident, escalation or stuck-PR disposition cited the task while it waited.
       - A task held by something other than its rank is scored `not_ranking`, with the holder named. That covers
         an unmerged dependency, a hold, `verify: human`, a file overlap and a lane outage. It is neither a hit nor
         a miss.
       - Each verdict is ledgered as `queue_judge.outcome`: task_id, prediction ts, verdict, the observed facts.
       - Each verdict becomes an effect in the gardener's effects file (`writeGardenEffects`), which
         `foldGardenEffects` folds into that class's Beta record.
       - `misses` in the allowance counts the class's scored misses since its last credit. So authority grows with
         hits and shrinks with misses and with closed (declined) PRs, as the framework already debits them.
       - When a class's posterior mean falls to or below the fleet's own prior for garden classes, that class runs
         in shadow. It still asks the judge and ledgers predictions and outcomes, but opens no PR. Its shadow hits
         earn it back.
       - The judge's prompt carries this record. Every scorecard reports it, so the operator can read the judge's
         precision directly.
    7. EXPECTED FIRST OUTCOME (an evidence check, not a hard-coded rule). With today's inputs, the cheap-restart
       chain should land at or near the head:
       - W1-T9089 is runnable now that W1-T9087 merged. Its dependent is W1-T9091. Its cost of delay is the ~42%
         of lane slot-minutes lost to restart idle, per the capacity read.
       - W1-T9092 has no open dependency.
       The test fixture models this queue in miniature (design 8). A first live pass that ranks the chain low,
       with today's evidence, is a defect to report.
    8. TESTS. A new file, test/gardeners/the-queue-judge-re-ranks-queued-tasks-by-measured-cost-of-delay.test.ts, with `test(`
       titles verbatim as in the proofs.
       - Fixture: a temp plan root with shards; an injected ledger reader; an injected judge text function, with no
         spawn; and an injected clock.
       - Cases: the operator-pin case; the empty-queue case; a malformed judge answer; a judge that lowers an
         operator pin; a judge that cites evidence missing from the pack; a scored hit and a scored miss; a task
         held by overlap scored `not_ranking`; and the review-cost bound with a deferred move.
       - The empty-queue pass reads no ledger rows beyond its cheap fingerprint, calls the judge zero times, writes
         no file and opens no PR.
