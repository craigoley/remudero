      The binding constraint is restart idle. The ADR 0007 cheap-restart chain removes it. On main, W1-T9087
      merged as #12219 (2026-10-16 12:08Z; the RESULTS.md note still lists it as queued). W1-T9089 (priority 2) is
      now runnable and heads the rest of the chain. W1-T9091 (priority 1.5) depends on it. W1-T9092 (priority 1.5)
      has no open dependency. All three sit among 134 tasks at priority 1-1.x or above.
    HOW DISPATCH ORDERS TODAY (symbols, not lines).
    - src/lib/dispatch-value.ts `costOfDelayContext` scores each open task. The score is the validity share near
      its age (`validityShareNearAge`), times (1 + open dependent fan-out), times its class score
      (`scoreByClass`), times its class merge posterior, times `dispatchUrgency(tierGap, age / medianWait)`.
    - `dispatchUrgency` = `2^-tierGap * (1 + log2(1 + waits))` (W1-T9323, #11584). `priorityTiers` measures the
      tier gap from the smallest declared priority. An absent priority sits one tier below the lowest declared one.
    - The stride pass is (1 + non-refused starts) / score. Its result is ledgered as `dispatch.cost_of_delay.ready`
      (`costOfDelayReadyRow`) or refused, and then the fallback order runs.
    - Per-class value is ledgered by run-task.ts as `dispatch.value.calibrated`.
    - So `priority` is the ONE intent input. Every other factor is measured. When most of the queue shares a tier,
      the tier gap is 0 for all of them, and only age and fan-out remain. A protective fix filed today ranks
      with, and behind, 80 older P1s.
    WHAT ALREADY WRITES PRIORITY, AND WHY IT DOES NOT FIX THIS.
    - src/lib/backlog-gardener.ts (W1-T4941). It places only UNPRIORITIZED tasks into bands 2/3/4 with a fixed
      rule (`judgeBacklog`). It marks them `  # backlog gardener: band=N evidence=<16 hex>`. It treats any other
      priority as authoritative (`MARKER` ownership in `backlogInventory`). It never re-ranks a declared priority
      and never touches the P1 pile.
    - src/lib/machine-filing.ts `costPriority` prices a machine finding once, at filing, by its filer's cost
      quantile. The value sits inside the `risk_ruling` pin: `taskRulingPin` hashes `priority`, and
      `reparkStaleRuling` re-parks an edited judged record to `verify: human`, as `applyBacklogActions` does.
    - Operators pin by hand: `priority: N  # operator-YYYY-MM-DD: <why>`. That inline comment is this repo's
      priority-reason field. 68 shards use it.
    MACHINERY TO REUSE.
    - Garden framework: src/lib/gardener.ts `GardenSpec` / `runGardenAsync`. It gives a per-class Beta record
      (`GardenState.classes`, fresh Beta(3, 1)), one pending PR at a time, and `judgedByOutcomeNote` for a reviewed
      class. A close declines its targets (`declinedTargets`). An effects file (`gardenEffectsPath`) is folded by
      `foldGardenEffects`. `landingRefusal` is the lint-plan preflight. `cheapFingerprint` and `gardenPassDue` make
      an idle tick free.
    - Registration: src/lib/garden-registry.ts `REGISTERED_GARDEN_NAMES` and `gardenSchedule`, and run-task.ts
