  falsifier: |
    At origin/main no gardener changes a declared priority. A fixture queue with 30 plain priority-1 tasks, one of
    which has two open dependents and an open incident that cites it, gets no write. Every test above fails for lack
    of the module.
    With the fix, delete the operator-pin check and the pinned task is written at a larger number: the pin test
    fails. Make the empty-queue pass call the judge and the no-op test fails. Replace the measured review-cost bound
    with a constant and the cadence/size test fails, because its fixture's measured cost allows fewer moves than the
    judge proposes and asserts the deferred list.
