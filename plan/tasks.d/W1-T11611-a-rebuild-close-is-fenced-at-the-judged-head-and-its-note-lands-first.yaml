  acceptance:
    - claim: "When the fix-progress judge routes a PR to rebuild, the sweep closes only through deps.withRebuildCloseFence(pr, judgedHeadSha, writeNote, close). The fence takes the PR's per-branch fix claim (fixBranchClaimKey, reclaim false), reads the PR again after the judgment, and closes only if it is still open and unmerged at the judged head on the same branch. If the head moved, the claim is held, the read fails, or the fence is not wired, the sweep closes nothing, writes no note and no requeue row, and ledgers sweep.strike_ladder.held with judged_head_sha and the observed_head_sha it read"
      proof: "unit test: W1-T11611: a moved head stands the judged rebuild down"
    - claim: "Inside the fence, a durable pending note for the PR's task is written before the close: author strike-ladder-pending, with the PR URL, judged head, failing checks, unmet claims and strike history. If that note cannot be written, the PR is not closed. If the close is not then confirmed CLOSED at the judged head, the sweep writes no counted strike-ladder note and no sweep.strike_ladder.requeued row, and ledgers sweep.strike_ladder.close_unconfirmed with task_id, pr_number, expected_head_sha and observed_head_sha"
      proof: "unit test: W1-T11611: the rebuild note is written before the close"
    - claim: "The rebuild caps keep their current sources. The lifetime count is the task's notes with author exactly strike-ladder, and the per-UTC-day cap and the judge's rebuild history are the task's sweep.strike_ladder.requeued rows. Only a close confirmed at the judged head appends the counted strike-ladder note (today's content) and the requeued row. A refused, held or unconfirmed close leaves both counts unchanged, so the next pass sees the same rebuildsSoFar and the same per-day state"
      proof: "unit test: W1-T11611: an unconfirmed close spends no rebuild cap"
    - claim: "A rebuild decided without a progress judge, the refresh and digest rungs, and the stale, stale-proof, empty-diff and dependency closes keep their current behaviour"
      proof: "unit test: W1-T11611: an unjudged rebuild keeps its current behaviour"
    - claim: The production sweep effects wire the rebuild close fence as a recorded effect-surface member
      proof: "grep: withRebuildCloseFence in src/lib/sweep.ts"
  rationale: |
    OBSERVED in the source at this filing's base (src/lib/sweep.ts, applyStrikeLadder, near lines 19880-19939):
    - Line ~19880 reads the live state (`deps.readLiveState`) and checks the head. Then, when `deps.fixProgressJudge` is wired (it is in production through productionFixProgressJudge, which spawns a model), line ~19909 awaits `judgeSloRebuild`. Only then does line ~19921 call `deps.close(pr, reason)`. That runs `gh pr close <url>` (line ~3376) with no head precondition, no second read and no branch claim. applyStrikeLadder takes no fixBranchClaimKey claim, while dispatchFix (line ~2820) and the dependency close fence (withDependencyCloseFence, line ~3316) both do. So a fix worker can push during the judgment, and the sweep then closes a head the judge never saw.
    - The close comes first and the durable note second. After closing, line ~19923 checks the head and returns `close was not confirmed at the expected head; no note written`, and line ~19935 returns `closed PR ... but the durable failure note could not be written`. In both cases the PR is already closed, and the task it requeues has no record of why it was closed or what was tried. W1-T11077's own acceptance says no PR is closed while its note is not durable, but only for its future loop-decision routes, which wait on a human gate. The SLO and strike-ladder rebuilds that run today do not have that guarantee.
    WHAT THE AUDIT FOUND ELSEWHERE, so the task stays small:
    - Every other unmerged-PR close in the full sweep (stale supersession, stale-proof and empty-diff supersession) runs behind the act-time live-head guard (W1-T5749/W1-T7734, near line ~21902), with no model call between the guard and the close. Its successor is named: the superseding PR (re-read at write time by W1-T3784) or main itself.
    - The dependency close already holds the branch claim and makes a strict fresh read (withDependencyCloseFence).
    - The triage, feedback-landing and dep-review closes (src/run-task.ts ~34782, src/lib/feedback-landing.ts ~1098, src/run-task.ts ~12168) close work whose content is already on main.
    - For a task PR, the replacement is the same task id. Its plan record stays queued when the PR closes unmerged, and the requeue row and note name it. The owner is the fleet's strike ladder (author "strike-ladder").
    So the only path where a close can run ahead of its record and its exact-head check is the judged rebuild arm.
    PLATFORM FACT: GitHub cannot bind a close to a head. The GraphQL ClosePullRequestInput has only pullRequestId and clientMutationId, while MergePullRequestInput carries expectedHeadOid (https://docs.github.com/en/graphql/reference/pulls). So exact-head binding for a close can only be a fence: hold the fleet's branch claim, make a fresh read after the last decision, then verify after the close. That is the pattern withDependencyCloseFence already uses.
    Settled by lookup: is this already filed or already decided? -> No. W1-T11077 adds note-before-close only for loop-decision rebuild/split routes and is held at verify: human. W1-T11076 (decideLoopOutcome, already called from sweep.ts) is shadow only and acts on nothing. W1-T5690 owns the ladder rungs, not close fencing. W1-T3784 re-reads only the supersession winner. W1-T4565 covers the resequence close. W1-T5030 caps stale-proof closes. W1-T921 owns branch deletion. None fences the judged rebuild close (plan/tasks.d/W1-T11077-*, W1-T11076-*, W1-T3784-*, W1-T4565-*, W1-T5030-*, W1-T921-*).
    Settled by lookup: does this lift W1-T11077's evidence or human gate? -> No. It adds no new close route and no new trigger, and it closes nothing that is not closed today. It only narrows when the existing rebuild arm may close. W1-T11076 stays shadow only. W1-T11077 stays verify: human until W1-T11076 has seven days of loop.decision rows and the operator has spot-checked them (plan/tasks.d/W1-T11077-a-looping-pr-is-rebuilt-or-split-instead-of-escalated.yaml).
    Settled by lookup: does it weaken any GitHub required check or review protection? -> No. It touches no merge path, required check, ruleset or review gate, and it keeps W1-T921's no `--delete-branch` close (src/lib/sweep.ts close effect).
    Settled by lookup: can GitHub's close API carry an expected head? -> No (https://docs.github.com/en/graphql/reference/pulls). Hence the claim, re-read and post-close verification fence.
    CLARIFICATION (PLAN-clarify-1794312531179), re-derived by symbol on current main:
    Settled by lookup: what do the rebuild caps actually count? -> Two different things. The lifetime count `rebuilds` (rebuildsSoFar, the `rebuilds >= 2` unavailability test, and the padding of the judge's history) is `effects.readNotes(taskId)` filtered to `author === "strike-ladder"`. The per-UTC-day cap (rebuiltOnUtcDay) and the judge's rungHistory come from sloRungHistory over sweep.strike_ladder.requeued rows (src/lib/sweep.ts applyStrikeLadder; src/lib/strike-ladder.ts sloRungHistory/rebuiltOnUtcDay; src/lib/pr-blocker.ts judgeSloRebuild strikesSpent). The earlier criterion said both caps count only requeued rows. That was wrong for the lifetime cap. Its design also wrote the counted strike-ladder note before the close, so a refused or unconfirmed close would have used up a lifetime rebuild. The amended design writes an uncounted strike-ladder-pending note before the close. It appends the counted note and the requeued row only after a confirmed close, which is exactly when today's code spends both.
    Settled by lookup: does the fence need production caller wiring outside src/lib/sweep.ts? -> No. The production body goes in src/lib/sweep.ts buildSweepEffects beside withDependencyCloseFence. Its name goes in the same Pick union and in SWEEP_EFFECT_SURFACE (src/lib/sweep.ts). The entrypoint adapters spread the lib effects (src/cli/commands/sweep.ts `...effects`), the way strikeLadder already reaches runSweep without being in the src/run-task.ts or src/cli/commands/sweep.ts Pick unions. The surface census suites (test/one-effect-surface-has-one-recorded-list.test.ts, test/sweep-orchestration-lives-in-lib.test.ts, test/build-sweep-effects-takes-one-deps-object.test.ts) read SWEEP_EFFECT_SURFACE, so they need no edit.
    Settled by lookup: does the task need ledger rotation retention? -> No. sweep.strike_ladder.held and sweep.strike_ladder.requeued are already retained (src/lib/ledger.ts). The new sweep.strike_ladder.close_unconfirmed row is evidence only: no cap, rung or dedup reads it back, because an unconfirmed close writes neither counted source. So src/lib/ledger.ts is out of scope.
    Settled by lookup: which existing tests reach the judged rebuild close and must change? -> Three. These are the only judge-wired suites that drive the strike-ladder rebuild arm to a close. test/sweep/an-unanswered-fix-escalation-is-rebuilt-after-its-slo.test.ts asserts readNotes(TASK).length is 1. test/sweep/flow-review-failed-n-unmet-criterion.test.ts asserts one close and one requeued row. test/every-fixed-repair-budget-defers-to-the-progress-judge.test.ts asserts one appendNote call and a close on continue. Each builds its own deps without the new seam, so each must wire a pass-through withRebuildCloseFence fake and expect the pending note next to the counted one. The unjudged ladder suites (strike-exhaustion-climbs-a-ladder-before-it-reaches-a-human, every-blocked-pr-climbs-a-rung-on-a-clock, the-strike-ladder-reads-a-merge-base-and-climbs-past-a-conflict, a-requeued-task-is-not-held-by-its-own-spent-checkpoint-branch) wire no fixProgressJudge and keep today's path.
  design: |
    1. Add an optional SweepDeps effect `withRebuildCloseFence?: (pr, judgedHeadSha, writeNote: () => boolean, close: () => Promise<void>) => Promise<{ closed: boolean; reason?: string; observedHeadSha?: string }>`. Add its name to SWEEP_EFFECT_SURFACE and to lib buildSweepEffects' Pick union. Put the production body in buildSweepEffects next to withDependencyCloseFence. It calls acquireInflightLock(inflightDir, fixBranchClaimKey(owner, repo, pr.headRefName), { run_id: runId, reclaim: false }) and makes one fresh `pulls/<n>` read ({ fresh: true }). It refuses unless state is open, merged is false, head.sha equals judgedHeadSha and head.ref equals pr.headRefName. Then it calls writeNote() and refuses if that returns false. Then it calls close() and releases the claim in finally. A thrown error refuses with its reason. No reopen and no new GitHub write.
    2. In applyStrikeLadder, when the judged branch ran (deps.fixProgressJudge wired and judgeSloRebuild returned rebuild), pass pr.headSha (the head given to the judge) as judgedHeadSha. writeNote appends today's note text through effects.appendNote with author "strike-ladder-pending", worded as a close in progress, not a completed one. close calls deps.close(pr, reason). If the seam is absent or returns closed false, record sweep.strike_ladder.held with the reason, judged_head_sha and observed_head_sha, and return a hold. Then keep today's post-close readLiveState check. If the PR is not CLOSED at the judged head, record sweep.strike_ladder.close_unconfirmed and return a hold. On a confirmed close, append today's counted note (author "strike-ladder", content unchanged). If that append fails, keep today's hold and write no requeued row. Then record sweep.strike_ladder.requeued as today. The lifetime filter stays `author === "strike-ladder"`, so the pending note never counts.
    3. A rebuild with no progress judge keeps today's path unchanged. The stale, stale-proof, empty-diff and dependency closes, the refresh and digest rungs, src/lib/ledger.ts, src/run-task.ts and src/cli/commands/sweep.ts are not touched. Nothing here widens a build scope guard.
    4. The new test file drives applyStrikeLadder through runSweep with injected deps and covers six cases. (a) A judge stub whose call advances the fake live head: the close is never called and the held row names both heads. (b) A held claim: no close. (c) writeNote returning false: no close. (d) A confirmed close: the pending note is ordered before the close call, then the counted note and the requeued row are written. (e) A post-close head mismatch: close_unconfirmed is written, with no counted note, no requeued row, and a second pass reads the same rebuildsSoFar. (f) A judged rebuild with no fence wired: no close. The three existing judged-rebuild suites wire a pass-through fence fake. Their note-count assertions change only to expect the extra pending note.
  falsifier: |
    Revert the seam so the rebuild arm calls deps.close straight after judgeSloRebuild. The head-advancing judge stub must then show close called at an unjudged head, so criterion 1 fails. Move the note back after the close and the ordering assertion in criterion 2 fails. Write the pre-close note with author "strike-ladder" and case (e)'s second pass reads rebuildsSoFar one higher, so criterion 3 fails. If production already holds the fix branch claim through the whole of applyStrikeLadder (a claim neither audit found), criterion 1's held-claim case is redundant, and the task shrinks to the note ordering and cap preservation.
