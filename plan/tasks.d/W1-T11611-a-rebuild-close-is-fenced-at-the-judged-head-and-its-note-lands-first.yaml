- id: W1-T11611
  title: "A STRIKE-LADDER REBUILD CLOSES ONLY THE HEAD ITS PROGRESS JUDGE SAW, AND ITS REQUEUE NOTE IS DURABLE BEFORE THE CLOSE — applyStrikeLadder reads the live head, then spends a model call in judgeSloRebuild, then runs `gh pr close` with no second read and no branch claim, and writes the task's failure note only after the close, so a fix push during the judgment gets a PR closed at a head nobody judged and no note"
