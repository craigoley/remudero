- id: W1-T5712
  title: "A MANAGED CHECKOUT WHOSE LOCKFILE MATCHES AN INSTALL ON THE SAME DISK HARD-LINKS IT — staged-install runs npm ci into every managed checkout and daemon install, so seven copies of one remudero lockfile (hash 810610c0f29a, 745-857 MB each) sit on one device with nlink 1, about 5 G that one donor would hold once"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: medium
  origin: "operator session 2026-10-04: research/flow/report.md (change-aware flow) item 8, one node_modules donor per lockfile"
  plan_refs: [W1-T4933, W1-T5533]
  files: [src/lib/staged-install.ts, test/a-matching-install-is-hard-linked-not-reinstalled.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a and the host, read only. 116 real node_modules dirs hold
    10.4 G, but 15 over 100 MB carry 10.1 G (the first report's "116 copies" overstates the
    reachable dedupe); 422 more are symlinks (fleet worktrees, `linkWorktreeNodeModules`). The big
    copies: three tenants' managed checkouts (754-836 MB) and daemon-install (745 MB), plus
    state2/repos/remudero, a stale state2/worktrees/sweep-W1-T4419-* (857), thread-followups-* (2 x
    754), lanes/claude/site (560), the site and console repos (470, 485). Every remudero copy shares
    lock hash 810610c0f29a (`.rmd-install-hash`/`.rmd-lock-blob`) on one device with nlink 1
    (checked on tsx/package.json in 6 dirs). Hand worktrees already hard-link (W1-T5533
    `hand-worktree`, `cp -al`, #9093). src/lib/staged-install.ts (W1-T4933) runs `npm ci` into a
    staging dir and renames it into place with no donor reuse. RISK: a postinstall that edits files
    in place would write through shared links, so a donor must be verified by its marker.
  design: |
    Before `npm ci`, staged-install looks for a donor install on the same device whose
    `.rmd-install-hash` equals the target's lockfile hash and whose marker verifies; it then builds
    the staging dir with `cp -al` from the donor and renames it into place as today. No donor, a
    different device, a marker mismatch or a failed link falls back to `npm ci`, and the choice is
    reported.
  acceptance:
    - claim: "with a fake npm, a target whose lockfile hash matches a verified same-device donor is staged by hard link (nlink above 1) without calling npm ci, while a hash mismatch or a donor on another device runs npm ci"
      proof: "unit test: test/a-matching-install-is-hard-linked-not-reinstalled.test.ts"
  falsifier: |
    Remove the donor branch: the matching fixture calls npm ci and nlink stays 1; the test fails.
