  note: |
    `risk: high` IS SET UP FRONT AND IT IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses a
    `src/` module, a plan-data file and `test/`, which is what `subsystemsOf` counts; the blast
    radius of the diff itself is one ceiling in one function plus one policy row.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT. `src/lib/sweep.ts` is the only source file
    that reads the ceiling (`reviewLanes` and `selectReviewAdmission` are both defined there;
    a word-bounded count of each across `src/ test/ deploy/` reads `reviewLanes` 7 and
    `pendingReviews` 6 in `src/lib/sweep.ts` AND NOWHERE ELSE AT ALL, `selectReviewAdmission` 6
    there plus 3 in `test/sweep-review-admission.test.ts`, and `inFlightReviewKeys` 6 there plus
    1 prose mention in `src/lib/daemon.ts` and 3 in `test/daemon.test.ts`. All four read ZERO in
    `deploy/`; positive control on that zero, same tool and flags over the same paths, `sweep`
    matches 2/4/7 in `deploy/Dockerfile`, `deploy/host-update.sh` and
    `deploy/recycle-container.sh`). `plan/policy.yaml` is required by rule 2 — a threshold is policy
    data, never a constant near its call site. `test/review-lane-budget.test.ts` is a NEW file
    rather than an append to `test/sweep.test.ts`, per this repo's coverage rule that a
    coverage-load-bearing test lives in its own file.

    `src/run-task.ts` IS DELIBERATELY NOT DECLARED. `buildSweepHook`/`buildSweepLightHook` wire
    the same `buildSweepEffects` into both passes and neither needs to change for a ceiling that
    is read inside `runSweep`; DECISIONS.md's 2026-08-18 W1-T471 ruling is therefore not reached
    here — this task is not re-scoped to avoid that file, it simply does not touch it.
    `src/lib/daemon.ts` is likewise not declared: `laneCount` keeps reading `dispatchLanes`
    unchanged, which is design (i)'s whole point.

    DELIBERATE OVERLAP WITH W1-T1044, NAMED RATHER THAN AVOIDED: both declare
    `plan/policy.yaml`, so `overlappingPaths` will serialise them. That is the correct outcome —
    both add a bound to the daemon's resource envelope and landing them one at a time is safer
    than racing two policy-table edits. This shard does not depend on W1-T1044 and is
    independently buildable in either order.

    THIS SHARD IS SMALLER THAN THE BRIEF EXPECTS, AND THAT IS THE FINDING. Reviews do not need
    to be MOVED into the light pass: they are already there. `buildSweepLightHook` wires the
    SAME `buildSweepEffects` object the full sweep uses and passes `actionable: d => d ===
    "post-review"`, so post-review is the ONE disposition the light pass is allowed to fire —
    dispatchFix, close, escalate, depReview, arm and updateBranch all stand down there with
    "deferred to full sweep (light pass)", and the credit-backfill and inbox-draft rungs are
    excluded outright. The light pass therefore already has everything a review needs, and
    `runSweepLightPass` already fans one `runSweep` call out per open PR CONCURRENTLY. Nothing
    needs to be plumbed, moved, or newly made concurrent. What is missing is one number that is
    currently borrowed from dispatch.

