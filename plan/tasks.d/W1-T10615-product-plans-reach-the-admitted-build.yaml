  rationale: The operator authorized implementation, task filing and guarded Remudero builds of the Console new-product flow and mobile-first Central Park prototype, using existing public craigoley/wreckterra. Source/main and every open PR head were swept for subject overlap; no competing product-flow implementation was observed. Existing auth, nonce, admission, review and resource guards remain required. Hosted PR14208 proved every new served product operation also needs its public contract and actual route-wiring evidence. W1-T10572 shares only the contract and generated client files for an unrelated gardener description; this task adds the named product operation, and does not supersede that Analytics work.
  design: Compose repository readiness, actual executable test/profile acceptance, persisted approved task-plan identity and the existing runnable selector/admission into a high-tier product build action. Reuse the actual target-repository bounded drain/kick mechanism; no new shell interpreter, raw browser command, alternate worker launcher or detached fallback. Verify repo ID, owner, branch/head, task provenance, claims, merged credit, target runner and inherited budget immediately before action. Record acknowledged/queued/admitted/running independently, link real run/PR evidence and never call queued work building. Missing permission, capacity, installation, runner or target remains actionable blocked/unknown. Before first source-task filing, require confirmed repository bootstrap at the exact target head. For a README-only repository, persist and reconcile a reviewed starter/template PR and actual test/typecheck/build/security receipts; absent source callers are not invented or waived. File only the qualified implementation frontier and preserve later work as a non-dispatch roadmap until its real callers exist. Workflow-file writes require the existing operator credential when the Fleet App lacks permission; expose a resumable operator action and verify its resulting PR/head instead of expanding App permissions, claiming an unperformed write, or dispatching through the gap. Preparation is not gameplay task credit. Wreckterra is the first target. Enroll a target only with verifiable baseline/runner receipts; reviewed registry/shadow promotion remains separate. Preserve all active slots and jobs. Mount buildProductBuildRoutes from the existing serve composition; the route builder delegates to the named product operation rather than a test-only seam. For every newly served product operation, declare the authenticated route plus bounded request, response and explicit failure schemas in openapi/daemon.yaml, then regenerate packages/api-client/src/schema.d.ts through the maintained generator. Exercise the assembled HTTP operation with the real default transport and verified-actor guard in the existing test/console-api/serve/product-routes.test.ts, and register that actual proof in test/route-wiring.test.ts. No contract baseline, wiring-debt entry, host-capability waiver, or client-granted verification substitutes for those proofs.
