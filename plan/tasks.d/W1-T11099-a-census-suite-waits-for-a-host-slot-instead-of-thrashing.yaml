- id: W1-T11099
  title: The author preflight's census suites record, in shadow, the host admission they would have waited for, so concurrent preflights can queue instead of thrashing the box
  repo: remudero
  depends_on: [W1-T11098]
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # two scripts, one concern: admission for the census suite children, shadow only
  origin: operator-session#preflight-throughput-2026-11-02
  plan_refs:
    - W1-T9951
    - W1-T5617
  files:
    - scripts/census-precheck.mjs
    - scripts/preflight-author.mjs
    - test/ci/gates/an-author-suite-child-waits-for-a-host-slot-instead-of-thrashing.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: Before its census suite children start, the author preflight asks the host static-work admission in shadow and records in its receipt what it would have done (outcome, would-wait ms, concurrent heavy steps, load), while the suites still start exactly as before
      proof: "unit test: test/ci/gates/an-author-suite-child-waits-for-a-host-slot-instead-of-thrashing.test.ts"
    - claim: Each census suite child records its native elapsed time and the host load at its start, so a slowdown under contention is measured per suite
      proof: "grep: W1-T11099 criterion 2 in test/ci/gates/an-author-suite-child-waits-for-a-host-slot-instead-of-thrashing.test.ts"
  rationale: |
    MEASURED 2026-11-02 over 12 author preflight receipts (progress.json under each worktree's coverage/rmd-author-*):
    - Wall time per run 45-90 min. census-precheck alone took 536-2,336 s, static-preflight 828-3,120 s, the affected subset 699-937 s.
    - The same census step took 536 s on 2026-10-30 and 2,336 s on 2026-11-02 at load average 34-47 on 8 cores: three author preflights and the fleet ran at once.
    - static-preflight already runs under admitStaticWork and lowPriorityCommand; census-precheck's suite children run under no admission. Its 120 s child bound then fires on a loaded, healthy host (W1-T9919), so both of the operator session's 13:05Z runs ended NOT MEASURED after 35 min.
  design: |
    Shadow first. preflight-author asks admitStaticWork (or the test-slot queue) for a census-suites label without waiting, records outcome, wouldWaitMs, the heavy steps it saw and loadavg in receipt.censusAdmissionShadow, and releases at once. census-precheck adds elapsedMs and startLoad per suite child to its output lines. Nothing waits, nothing is skipped.
    Promotion to act (the census suites wait for admission): after 7 days of receipts, when the shadow shows each census run that would have waited would have finished sooner by waiting (its measured elapsed under contention minus wouldWaitMs, against its uncontended calibration), and the operator says yes.
  note: |
    reservation hand-off: run-unfiled-1793629687846 -> run-unfiled-1793629687846
    Reserved with rmd next-task-id from the operator checkout (W1-T11098..W1-T11102 on run-unfiled-1793629687846). Operator ruling 2026-11-02: "go with all of your recommendations"; the plan named this one shadow first.
