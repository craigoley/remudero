- id: W1-T1000003
  title: "A PULL REQUEST THE OPERATOR HELD IS INVISIBLE ON THE BOARD — deriveBlockers and deriveNeedsMe read no arm state at all, so a request that is deliberately not merging lands in no blocker class and no needs-me bucket and looks exactly like one still waiting on checks: render the hold as its own row, keyed on the ledgered hold state W1-T1000002 writes"
  repo: remudero
  depends_on: ["W1-T1000002"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: |
    FILED FROM fb-1785792944591-e0473c ALONGSIDE W1-T1000002, WHICH OWNS THE MECHANISM. The feedback
    argued a hold expressed as a withdrawal kills the invisibility problem because a held request is
    a RECORDED state rather than an absence. That is true of the LEDGER and false of the BOARD, and
    the difference is the whole of this shard.

    MEASURED IN THIS WORKTREE: `src/lib/status-board.ts` contains ZERO occurrences of
    `autoMergeArmed`, against same-file controls `blockers` and `needsMe` which are both real
    sections with real derivations (`deriveBlockers`, `deriveNeedsMe`). `src/lib/status.ts` does
    carry an `armedAwaitingMerge` projection flag set from the gateway's `autoMergeArmed(prUrl)`, so
    the board's absence is a GAP IN THE SURFACE, not an absence of the underlying fact.

    THE CONSEQUENCE, STATED PLAINLY: once W1-T1000002 lands, an operator can hold the fleet's merges
    and then read a board that shows nothing about it. A hold that is invisible is a stall waiting to
    be diagnosed as something else — and the fleet-wide-stall direction is exactly the cost
    W1-T1000002's design (vii) owns and hands here.
  design: |
    ONE ROW, KEYED ON A STATE THAT ALREADY EXISTS. This shard adds NO new state, NO new ledger step
    and NO new gateway read: it consumes the hold reader W1-T1000002 introduces.

    (i) WHERE IT GOES. A held request is NOT an ordinary in-progress state — nothing will move it
    without a human — so it belongs in the operator-facing sections, rendered with the hold's AUTHOR
    and REASON carried through from the ledger row. A hold row with no reason is a bare alert and is
    refused by the same standard MASTER-PLAN section 4 applies to escalations.

    (ii) IT MUST NOT MINT A SECOND TAXONOMY. The board's own design fence (its blockers section
    comment) is that the board mints no blocker taxonomy of its own. The hold is ONE row derived from
    the hold state, never a re-derivation of "why is this not merging" from check or review fields.

    (iii) THE QUIET CASE IS FREE. No hold engaged yields no row at all. A surface that prints a line
    per open request every render is the noise floor that makes a board unreadable — the same reason
    `armedButStalled` fires on two facts and not one.

    (iv) RELEASE CLEARS IT WITH NOTHING ELSE TO DO. The row is derived per render from the current
    hold state, so a release removes it on the next render — no marker, no acknowledgement, no
    second lifecycle to keep in sync with the ledger.

    EXPLICITLY NOT IN SCOPE: the hold mechanism itself, the withdrawal, the ledger retention and the
    operator verb (all W1-T1000002); any change to what arms.
  acceptance:
    - claim: "with a hold engaged the board renders exactly one row naming the held request, its author and its reason"
      proof: "unit test: test/status-board.test.ts"
    - claim: "with no hold engaged the board renders no hold row at all, so the quiet case stays quiet"
      proof: "unit test: test/status-board.test.ts"
    - claim: "a released hold disappears from the next render with no acknowledgement step"
      proof: "unit test: test/status-board.test.ts"
    - claim: "the board reads the hold state rather than re-deriving a reason from check or review fields"
      proof: "grep: mergeHeld in src/lib/status-board.ts"
