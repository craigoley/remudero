  note: |
    **NO PROOF IN THIS SHARD GREPS ITS OWN PATH.** All five criteria use the pure-path `unit test:`
    form naming `test/containment-turn-budget.test.ts`, declared in `files:`, so `judgeCriterion`'s
    `not_yet_built` carve-out applies at filing time. A `grep:` proof naming this shard would be out
    of scope by construction: a `verify: auto` task cannot declare its own plan record in `files:`.

    **WHAT THIS TASK DOES NOT OWN.** The prompt's THREE/FOUR narration is `W1-T1271`'s, including the
    `/THREE commands/` assertion in `test/deny-floor-probe.test.ts` that pins it. The discarded
    failure evidence is `W1-T1281`'s. The egress arm itself is `W1-T1265`'s (#2626). This task owns
    the CEILING and the exhaustion signal, and nothing else — a fix that corrects the narration
    without moving the cap has not addressed it, and neither has one that moves the cap without
    making exhaustion nameable.

    **RISK BAND IS RULE 19 SPAN, NOT BLAST RADIUS.** `files:` crosses `src/` and `test/`, so the SPAN
    reading is `high`. `high` EXEMPTS `sizingViolation` rather than clearing it — it returns
    `undefined` outright at that band — so a clean lint is NOT evidence the span was vetted. The
    blast radius is narrower: one derived constant and one new reported field, both inside the probe.
    The danger is the FAIL-CLOSED DIRECTION, which is why criteria 3 and 4 exist as a pair — a change
    passing criterion 1 while failing either of those has bought turns by weakening the verdict.

    **THE FALSIFIER, STATED SO IT CAN BE RUN.** Falsified if probe runs still terminate at the cap
    after the change — the derived ceiling was still too low, and the allowance is the figure on
    trial. Also falsified if a genuinely uncontained run stops reporting `contained: false`, or if a
    turn-exhausted run is reported as a containment finding rather than as exhaustion.

    **MEASUREMENT PROVENANCE.** Clone checked NOT shallow (`--is-shallow-repository` false, 2079
    commits) BEFORE any history query. `src/run-task.ts` is 1,502,392 bytes — over the Contents API's
    1 MB cap — so every figure from it was read through git objects. `resolveLedgerUnion` was run
    FIRST and returned `archiveCount 0, ok false` against this container's only `state/`, whose live
    ledger carries a single distinct step; the reader worked and the corpus is elsewhere, so **NO
    LEDGER FIGURE IS QUOTED** and the run-level counts above are the operator's transcripts, cited
    as such.

    **ID PROVENANCE.** `refs/rmd-id/W1-T2201` reserved 2026-08-24T02:08:43Z and confirmed still held
    and unused. Eight surfaces swept, each with a control qualified for that surface, and ONE CONTROL
    DISQUALIFIED AND RE-TAKEN RATHER THAN REPORTED: the open-PR-title surface's `W1-T` control read
    **0**, because neither open PR carries a task id in its title, so it was re-taken on a token that
    is present. Reservation ref 1 against a namespace of 320; shard filenames on main 0 (control
    `W1-T1284` = 1); `- id:` lines 0 (control `W1-T1284` = 1); open-PR titles 0 (re-control = 1);
    open-PR head branches 0 (control `run-*` = 87); open-PR file lists 0 across 2 of 2 heads
    enumerated and captured, control 5 file entries; anchored merged trailers
    `^Remudero-Task:\s*<id>\s*$` 0 (control `W1-T1274` = 1 across 98 merged); merged subjects 0
    (control `(W1-T1284)` = 1 across 2079).

    **THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE**, read through git objects over
    `src/lib/containment.ts`: `maxTurns: 6` / `these THREE commands` / `probeTurnBudget`. Main reads
    2 / 1 / 0 and every open head reads exactly 2 / 1 / 0. The two non-zero columns are the control
    that the reader worked; the zero is the defect — nothing anywhere derives the cap from the
    command count, and no open head is adding it.
