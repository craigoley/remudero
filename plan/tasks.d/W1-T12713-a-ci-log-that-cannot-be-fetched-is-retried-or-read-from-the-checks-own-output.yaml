  rationale: |
    WHY: #18550 shows "coverage-shard (6/8) failed — log NOT read: the log fetch was attempted and FAILED (gh api …)". A
    fix round that cannot read the failure guesses, and a guess costs a round.
    MEASURED read-only on the Azure host, ledger and rotated archives 2026-11-11 20:25Z to 2026-11-14 20:25Z:
    - 192 rows carried "log NOT read": 178 sweep.disposed, 8 escalation.issue_opened, 5 sweep.question.logged. Causes in
      the dispositions: no Actions job id 119 rows on 5 pull requests (security-merge-policy and remudero-review), API rate
      limit 43 rows on 16 pull requests, HTTP 5xx 14, HTTP 404 2.
    - Fix rounds: 22 of the 314 CI failures handed to fix.dispatch had no excerpt (7%); 10 of those were remudero-review.
    - fix-lane.evidence_unreadable: 38 rows (HTTP 502 33, HTTP 503 4, rate limit 1).
    - serve.ci_incidents.job_log_unreadable: 471 rows on 471 jobs (HTTP 404 410, rate limit 61).
    CHECKED on GitHub: 5 of 5 sampled 404 jobs (132574965822 comment-load-ratchet, 131154636420 claims, 131634995076
    depcruise, 131969760084 source-size, 132364624617 source-size) are check runs in the "Security merge policy" workflow
    with 0 steps and no runner. They have no log by construction. Their cause is in the check run output, for example
    "claims: setup did not succeed (classify=skipped install=skipped), so no gate ran". Log retention is 90 days, and a
    fresh failed job's log reads with HTTP 200.
    READ at origin/main 5d1670adc:
    - src/lib/tick-read-worker.ts:1315 starts each check as no-job-id; :1430-1447 falls back to annotations, else records
      fetch-failed with the gh error. There is no retry and no read of the check run output.
    - src/lib/sweep.ts:6901 describeCiLogUnavailable writes the "log NOT read" text.
    - src/lib/ci-incidents.ts:149 serve reads the same endpoint with no fallback.
  design: |
    INVARIANT never-blind-when-output-exists: when GitHub holds text about the failure, the fix round gets it.
    1. src/lib/tick-read-worker.ts: export pure `classifyLogFetchFailure(error, job?)` returning rate-limit (with the
       reset time when the error or headers give it), transient, or absent.
    2. Rate-limit and transient: keep the check's other evidence, set `logDeferred: { until }` and retry in a later pass.
       Back-off: the reset time, else 60 s doubling to 15 min. After two failed retries, use step 3's text.
    3. Absent and no-job-id check runs: read the check run (`check-runs/<id>`: output.title, output.summary, output.text)
       on the async path, and use it as the tail with tail_source `check-output`. The sync path, and a caller that
       injects its own log read, use the REST rollup's inline title and summary, so no synchronous spawn is added to a
       daemon-loop path. A commit status keeps its description in `statusDescription`: the fix prompt and the progress
       judge already read it (tail_source `status-description`), and a tail would print it twice and change the
       security-merge-policy evidence that test/a-security-policy-block-reaches-a-red-prs-fix-round.test.ts pins.
    4. src/lib/sweep.ts describeCiLogUnavailable: add a deferred case, "log read deferred (<cause>, retry at <time>)". The
       fix dispatch waits for a deferred log only until its retry time, then uses what it has.
    5. src/lib/ci-incidents.ts: the same classification and step 3 fallback.
    NOT IN SCOPE: the GitHub token's request budget; log streaming (W1-T5836).
  falsifier: |
    Treat every failure as absent and criteria 1 and 2 must fail. Skip the check run read and criteria 3 and 4 must fail.
    Leave serve as it is and criterion 5 must fail. Change the read of a good log and criterion 6 must fail. Restore and
    all must pass.
  note: |
    Id reserved for run-unfiled-1794689039000 with ~/rmd-work/bin/reserve-id.sh. The fleet builds it.
