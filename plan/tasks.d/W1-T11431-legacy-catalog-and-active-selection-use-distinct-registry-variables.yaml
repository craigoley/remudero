  rationale: |
    W1-T10573 (#15532) is already merged and introduced explicit private-registry selection through the existing host, serve, recycle and daemon paths. The merged code still overloads RMD_INSTANCE_REGISTRY: the recon in W1-T11276 found that heartbeat, host-update, installer enumeration and resource-policy readers consume that same variable as a legacy catalog path. This task fixes that distinct compatibility defect: retain RMD_INSTANCE_REGISTRY for legacy catalog consumers and use RMD_SELECTED_INSTANCE_REGISTRY for active selection. During transition, selected readers accept the old variable only when the new variable is absent; when the new variable is present but invalid, they fail closed instead of falling back. If both are set, each reader uses the variable matching its meaning. W1-T10573 built the selection behavior; this task separates the two meanings and preserves mixed-version compatibility.

    The implementation is limited to exactly twenty-two paths: the eighteen previously approved paths, deploy/runtime-env-vars.sh (approved 2026-11-06) and deploy/host-update.sh (operator-directed takeover 2026-11-06, because the W1-T1069 proof requires its fallback list and printed launch to carry the same names), and test/deploy/selected-registry-contract-discriminates.test.ts (approved 2026-11-06 because proof-discrimination runs only newly added test files against merge-base source). Declaring the names alone would let a bare recycle replace a selected container and drop its private mount: test/recycle-container.test.ts showed status 0 with no refusal on the 2026-11-06 patch, and the daemon would then point at a missing registry file. The bare recycle therefore refuses until W1-T11454 inherits the selection. The six reader paths added by PR #16930 carry explicit selection through the real task, CLI, daemon, sweep and SRE paths. This separate one-path amendment adds src/lib/worker.ts so child environments strip RMD_SELECTED_INSTANCE_REGISTRY alongside the legacy registry variable, preventing explicit worker environment overrides from exposing the private registry path. Reuse the existing selected-reader, bounded file-read and binding contracts; do not add another loader, scanner, daemon, scheduler or private-data channel. Keep absent-configuration behavior byte-compatible. Invalid, unreadable, malformed, unsupported, stale or revised selected inputs remain explicit failure/unknown. Selection confers no actor, publication, deployment or release authority. Existing owner STOP/PAUSE/override, SHADOW policy, trusted paths, environment allowlisting, and private-safe prompts/argv/logs/public projections remain unchanged. Add only a synthetic setup example to the existing contract documentation; retain the complete public Apache implementation and existing public registry data.

    The deploy supervisor recently refused the guarded recycle because the daemon carried RMD_INSTANCE_REGISTRY_FILE_BINDING, RMD_INSTANCE_REGISTRY and RMD_INSTANCE_REGISTRY_DIGEST while deploy/runtime-env-vars.sh omitted those names. This approved one-path amendment declares those names only, so the existing recycler preserves the live bindings; it does not install or select private configuration. Extend the already-listed test/recycle-container.test.ts to assert all three names are carried, an unknown runtime name still refuses, and no values are logged or persisted.

    The operator-approved addition of test/a-recycle-finds-a-holders-worktree-where-the-container-mounts-it.test.ts covers the compatibility boundary introduced by fail-closed selected-registry handling: absent or missing mount metadata retains the legacy fallback, while unreadable mount metadata refuses replacement before disclosing private host/container mount paths. Keep this existing regression in scope; the task's six acceptance claims, budget, risk, and release holds do not change.

    W1-T100 (#173) is a separate, already-merged blocked_ci-to-ci-log fix-routing task; its shared src/run-task.ts and src/lib/sweep.ts paths are touched here only to propagate selected-registry semantics through existing readers and environment guards, not to alter that routing. The scope also overlaps open PR #16832 (src/lib/deployer.ts) and #16833 (deploy/recycle-container.sh). The declared depends_on records those existing task IDs; implement only after both normally merge and fresh ownership permits. Do not edit or adopt either PR. Existing four approved proof titles intentionally span the corresponding host, launcher, reader and safety test modules.

    This is source-only compatibility work. It does not authorize installing or selecting private configuration, invoking the real installer/recycler, changing live GitHub/runtime settings, stopping or restarting workers, releasing an image/recycle, or performing live cutover. Because deployer.ts and config-schema.ts are baked runtime inputs, verify the exact automatic image-build/recycle and release-hold behavior before publication/merge. Obtain the separately required exact release/cutover approval if existing safeguards do not prevent worker-affecting release. Preserve all existing owners, receipts, failures, budgets and readiness holds.
