  design: |
    RELEASE CRITERIA, pre-agreed with the operator (this record stays verify: human until they are met):
    - W1-T11029 has been live for at least 48 h and written at least one instrument_grant.shadow row.
    - Every would_grant patch saved under state/instrument-grant-shadow is purely additive (true by construction) and the operator's spot-check of those patches agrees that each one adds a registration or tightens and weakens nothing.
    The reviewer is independent of the round: a fresh judge given only the instrument patch, the gate it belongs to and the stood-down PR's failing check, asked whether the patch can make any check pass that would otherwise fail for a reason other than the registration it adds.
  falsifier: |
    Skip the reviewer: the fixture whose additive patch appends a skip entry to a census exclusion list is granted, and the test fails. Grant a would_escalate judgement: the modifies fixture opens a PR, and the test fails.
