    - THE HOST TAIL IS THE DAEMON'S LIFETIME PEAK. On every row since each boot settled, numbers.hostTailMib equals
      numbers.daemonGrowthTailMib: 1,000-2,800 MiB, with daemonGrowthTypicalMib 0. It is 75-90% of hostClaimMib.
