      latest was 0-700 MiB.
    - SWAP INFLATES IT. VmHWM is a resident peak and VmRSS excludes swap, so a host that swaps the daemon out RAISES the
      charge. At 01:10Z VmRSS was 1,193 MiB and the charge 2,865 MiB, while the daemon held 1.0-1.1 GB in swap.
