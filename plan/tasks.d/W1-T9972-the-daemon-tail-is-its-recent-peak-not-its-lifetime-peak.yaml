  design: |
    No new constant, interval, count or byte threshold. The window is the series' existing hour (HOUR_MS) and
    `daemonGrowthMinSamples`.
    1. THE DAEMON'S GROWTH IS ITS RECENT PEAK. When the own daemon's sample series (`daemonSeries`) has at least
       `daemonGrowthMinSamples` samples in the last hour, its growth is the series' max rss+swap less the CURRENT
       rss+swap, and its typical part is the median less the current. Read the current value from the pid's
       /proc status as VmRSS + VmSwap when readable, else the latest sample. The swap belongs in the figure because the
       series is rss+swap.
       A spike inside the window is still charged in full. The lifetime VmHWM no longer sizes the tail.
    2. TOO FEW SAMPLES: as today. The proc's VmHWM - VmRSS is the growth, all of it typical, and the basis says so.
       This covers the first minutes after a boot with no footprint.
    3. RECORD BOTH. Each `daemon_growth` entry keeps the lifetime figure as `lifetimePeakGrowthMib` with its proc
       basis, for comparison only. Its `basis` names the series that sized the growth. `numbers` gains
       `daemonGrowthLifetimePeakMib`, the sum of the lifetime figures, and `hostTailOwner`: "daemon:<instance>", the
       owning claim's worker class, or "start". A row naming unrealized-reservations then says whose tail tipped it.
       The comparison fields decide nothing.
    Update the existing assertions that pin the proc figure as the growth, in
    test/the-memory-budget-treats-the-daemon-as-one-more-tail.test.ts ("the peak is still the proc's VmHWM - VmRSS")
    and test/the-memory-budget-measures-what-the-host-can-show.test.ts ("VmHWM - VmRSS of the daemon pid"). Each
    becomes the series figure where the fixture has enough samples, and stays the proc figure where it has too few.
    New tests go in the new file, with `test(` titles verbatim as in the proofs below. The fixture comes from the
    01:50:30Z row: /proc status VmHWM 4,058 MiB, VmRSS 1,758 MiB, VmSwap 600 MiB; 30 footprint samples over the last
    hour at 1,920-2,648 MiB; MemAvailable 4,300 MiB; a worker typical of 256 MiB; reserve 2,048. Under the lifetime
    rule that fixture defers on unrealized-reservations, and under the recent rule it fits.
