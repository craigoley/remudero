    - claim: "the task's acceptance criteria travel on the absent-pointer path, filtered through visibleCriteria so a holdout criterion's text never reaches the worker"
      proof: "unit test: test/recon-degrade.test.ts"
    - claim: "a RESOLVABLE record renders byte-identically to today on both the healthy and the degraded call sites — the falsifier proving this changed only the nothing-to-point-at case"
      proof: "unit test: test/recon-degrade.test.ts"
    - claim: "an unresolvable record is ledgered once by the call site, so spec-blind dispatches are countable rather than visible only inside one prompt"
      proof: "grep: task_record.absent in src/run-task.ts"
