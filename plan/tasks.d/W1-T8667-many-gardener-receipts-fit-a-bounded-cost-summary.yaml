  repo: remudero
  depends_on: [W1-T8484]
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1.15
  budget_usd: 24.00
  risk: high
  origin: "operator console follow-up 2026-10-12; live cached core gardener cost reports over_budget"
  plan_refs: [W1-T8484, W1-T4949, W1-T4950, W1-T6466]
  files: [src/lib/gardener-spend.ts, test/a-gardener-spend-read-requires-the-exact-parent-pass.test.ts, test/many-gardener-receipts-fit-a-bounded-cost-summary.test.ts]
  status: merged
  attempts: 0
  rationale: |
    At 2026-10-12T16:02:08Z the positively served cached Analytics view on loaded code
    8139a0d184fdd368fe145d1f0043616103a9887a carries gardener-spend-v1 for all three repositories.
    Core reports not_collected/over_budget, not measured zero; site and console report
    correlation_not_available with disabled scheduling. The independent live core inventory
    at 16:16:26Z has 17 gardens, 7613 bytes and 90 attempts within generation
    DAEMON-1791817925860, so its inventory is below both native limits. The existing W1-T8484
    overflow test deliberately sends 500 valid distinct priced child receipts under one exact
    completed parent and expects collection to overflow, although a compact exact summary of
    those receipts fits the unchanged public budget. The current collector accumulates raw
    receipt objects before folding, conflating input history volume with output cardinality.
    Preserve W1-T8484's exact-parent trust and unknown-price semantics; fix this capacity gap,
    not missing historical links, model pricing, human decisions or gardener activation.
  design: |
    First discriminate collection, source serialization and final response overflow using
    the existing native fixtures and positive ordinary-Analytics controls. Aggregate canonical
    producer receipts before materializing the private source, using compact scoped parent/pass
    evidence and per-gardener price/count summaries. Preserve exact same-repository and daemon
    generation joins, terminal versus interrupted parent state, canonical raw-line deduplication
    across gzip/plain/live overlap, all priced-step membership, and unknown/unpriced/unlinked
    counts. Do not infer historical parentage or classify missing correlation as zero spend.
    Keep the existing 32-gardener and 64-KiB public response limits unchanged. Bound intermediate
    memory explicitly, distinguish genuine overflow from many receipts for an already-known
    scoped pass, and refuse rather than dropping costs or labeling an incomplete subtotal complete.
    Maintain compatibility with retained legacy raw-source snapshots and preserve independently
    valid Analytics if the optional attribution cannot be built. Shared host/fleet cost remains
    excluded from repository totals. Keep source window, observation time and materialization
    time distinct. The production caller remains the existing off-loop Analytics refresh; no
    HTTP ledger scan, added timer, cross-repository fanout, provider call, external collector,
    policy/model approval change, broad gardener activation, Inbox disposition or service restart.
    Amend the existing valid-500-receipt overflow fixture into a capacity regression; retain
    separate load-bearing tests for malformed/oversized inventory and genuine response overflow.
    Validate a default capture plus real worker refresh/cached HTTP read with at least 500 valid
    distinct priced receipts for one completed parent, mixed known/unknown prices, conflicting
    parents and rotation overlap. A compact subtotal is not proof of causal improvement.
    Research: https://opentelemetry.io/docs/specs/otel/metrics/sdk/#cardinality-limits distinguishes
    aggregation cardinality from measurement count and requires explicit overflow accounting.
    Apply that principle without adopting an SDK default, stripping scope or exporting telemetry.
  acceptance:
    - claim: "many valid priced receipts for a matched parent fit the unchanged bounded summary"
      proof: 'unit test: W1-T8667: many priced receipts fit bounded gardener summaries'
    - claim: "aggregation preserves exact parent scope unknown prices and interrupted outcomes"
      proof: 'unit test: W1-T8667: compact costs preserve scoped parent and unknown evidence'
    - claim: "raw legacy sources and rotated duplicates retain the canonical cost semantics"
      proof: 'unit test: W1-T8667: compact and legacy spend sources agree across rotation'
    - claim: "the real worker serves high-receipt cost from cache without a ledger read on HTTP"
      proof: 'unit test: W1-T8667: real worker materializes many gardener receipts before cached reads'
    - claim: "genuine capacity overflow remains named and preserves ordinary Analytics"
      proof: 'unit test: W1-T8667: genuine compact overflow preserves independent Analytics'
  falsifier: |
    Remove the compact aggregation and restore raw receipt accumulation: the valid-500-receipt
    default-capture and real-worker tests must fail on over_budget while inventory and ordinary
    Analytics positive controls pass. Delete scope/parent or canonical deduplication separately:
    wrong-repo/generation/interrupted or replayed costs must fail their respective tests. Restore
    the exact committed source and require real TAP summaries over verified physical test paths,
    native author validation and instrumented same-tree diff coverage. Merge, source adoption,
    live price/correlation coverage and measured benefit remain separate receipts.
