  rationale: |
    OBSERVED 2026-09-08, and this record exists because its author FIRST GOT IT WRONG. W1-T3167's
    caveat as filed said this shape came from "the same condition re-escalating WITHOUT DEDUP".
    Dedup was never skipped. It ran, and it correctly declined.

    THE MEASUREMENT THAT SETTLES IT — every duplicate carries a DISTINCT head sha:
      PR #4532: #4541 26a53a22 · #4568 5105a48d · #4595 b1a1429e · #4604 e765a00e
      PR #4559: #4633 3a29c58a (12:31:09Z) · #4646 69b6e0a1 (13:50:00Z)
    and `gh api repos/craigoley/remudero/pulls/4559/commits` shows 69b6e0a1 committed 12:57:12Z —
    BETWEEN the two. The push is the whole explanation.

    THE MECHANISM, exactly. `findDuplicateEscalation` (src/lib/escalate.ts) requires taskId and PR to
    match, then vetoes when `headSha` is present on both sides and differs
    (`matchesOptionalDimension`, `HEAD_SHA_LINE_RE = /^\*\*Head:\*\*\s*(\S+)\s*$/m`). W1-T195 chose
    that deliberately: "with the prior issue CLOSED and the condition recurring on the same sha,
    that is a genuine re-escalation. Dedup is about concurrent observers, not about time."

    WHY THE DESIGN IS RIGHT AND STILL PRODUCES THIS. For a CONTENT-dependent ask — "these checks are
    red at this sha" — a new head genuinely is a new question, and re-asking is correct. But these
    two producers ask head-INDEPENDENT questions:
      "review failing with no actionable unmet criteria (contradictory)" is a SPEC problem: the
        criterion's text is unattainable, which no commit alters.
      "PR ... cannot be repaired from its non-fleet head" is an OWNERSHIP fact about the branch,
        which a further push to that same branch cannot change (W1-T3168).
    Pushing to either PR re-asks a question the operator has not yet answered.

    THE OPERATOR-VISIBLE COST: on a board holding 8 items, 6 were duplicates of 2 questions.
  design: |
    (i) THE PRODUCER DECLARES WHETHER ITS ASK DEPENDS ON THE HEAD. This is the producer's knowledge,
    not the dedup function's — `escalate()` cannot infer from a summary string whether a new commit
    changes the question. A head-independent escalation omits the head from its DEDUP KEY while
    still RECORDING the head it observed, because the observed sha is evidence and must not be lost.
    (ii) DEFAULT UNCHANGED, AND THAT IS THE SAFETY ARGUMENT. Every existing producer keeps today's
    head-vetoing behaviour by default; only a producer that opts in becomes head-independent. A
    change that flips the default silently converts genuine per-sha re-escalations into a single
    stale issue — the false-negative direction, which is the costly one.
    (iii) AN UNANSWERED ASK IS UPDATED, NEVER SILENTLY DROPPED. When a head-independent duplicate is
    suppressed, the OPEN issue records that the condition recurred at a new sha. The operator must be
    able to see the question is still live and has been observed again; a suppression that leaves no
    trace is how a re-escalation becomes a forgotten one.
    (iv) THE TWO NAMED PRODUCERS OPT IN, and no others in this task. Widening beyond the two whose
    head-independence is argued above would be asserting a property of producers this shard has not
    read.
  acceptance:
    - claim: "a head-independent producer firing twice at DIFFERENT head shas opens ONE issue — the measured #4633/#4646 shape collapses to one"
      proof: "unit test: test/a-push-does-not-re-ask-a-head-independent-question.test.ts"
    - claim: "a head-DEPENDENT producer firing twice at different shas still opens TWO issues — W1-T195's design is preserved, not overturned"
      proof: "unit test: test/a-push-does-not-re-ask-a-head-independent-question.test.ts"
    - claim: "the suppressed recurrence is recorded on the open issue, naming the new sha — the ask is never silently dropped"
      proof: "unit test: test/a-push-does-not-re-ask-a-head-independent-question.test.ts"
    - claim: "a head-independent escalation still RECORDS the head it observed in its body, so the evidence survives even though the dedup key omits it"
      proof: "unit test: test/a-push-does-not-re-ask-a-head-independent-question.test.ts"
    - claim: "every producer that does not opt in dedups byte-identically to today"
      proof: "unit test: test/a-push-does-not-re-ask-a-head-independent-question.test.ts"
  falsifier: |
    CLOSE IF the dedup key already ignores the head for these producers:
      `grep -n 'HEAD_SHA_LINE_RE' src/lib/escalate.ts` and read `findDuplicateEscalation`'s
      `matchesOptionalDimension(e.headSha, ...)` veto.
    MEASURED 2026-09-08: the veto is unconditional for any escalation carrying a headSha, and both
    named producers carry one — every one of the six duplicate issues renders a `**Head:**` line.
    POSITIVE CONTROL, required because "the shas differ" is the entire claim: the six issue bodies
    must yield SIX DISTINCT `**Head:**` values. MEASURED: 26a53a22, 5105a48d, b1a1429e, e765a00e,
    3a29c58a, 69b6e0a1 — six distinct.
    PROVE IT LOAD-BEARING: the head-independent fixture must collapse to ONE issue while the
    head-dependent fixture in the SAME suite still opens TWO. If both collapse, the change has
    overturned W1-T195 rather than narrowed it, and genuine per-sha re-escalations are now lost.
    DO NOT satisfy this by dropping `headSha` from the dedup key globally. That is the false-negative
    direction: a check that is red at one sha and red again at a later one is TWO observations, and
    collapsing them hides the second.
    DO NOT satisfy this by deduping on the rendered title. Two producers can share a title prefix,
    and W1-T345 already had to reach for the title only in the no-PR case for exactly that reason.
