    RELATIONSHIP TO ITS SIBLINGS, stated so three shards are not mistaken for one: W1-T3166 wires
    the judge at BIRTH (routing), W1-T3167 re-judges what is ALREADY OPEN (aged routing), W1-T3168
    stops a producer firing on a HEALTHY PR (producer precision), and this one stops a producer
    re-asking an UNCHANGED question (dedup key). Each is a distinct mechanism and none subsumes
    another — the six duplicates measured here would survive all three of the others.
    CAVEAT WITH EQUAL WEIGHT: head-independence is asserted here for TWO producers, from reading
    what their questions ask. It is a judgement about their semantics, not a measurement, and a
    reviewer who disagrees about either one should say so — the criterion structure holds either
    way, only the opt-in list would shrink.
