  rationale: |
    W1-T4409 (#6915) routes daemonCommand's consumer-repo and --plan loads through loadPlanQuarantiningDuplicates. The
    core daemon's self-target path does not use loadPlan: syncPlanOrRefuse -> syncPlanFromOrigin builds the plan
    from origin/main blobs via mergePlanBlobs (src/lib/plan.ts), which throws `duplicate task id` exactly as
    loadPlan did. A duplicate on core main would crash-loop the core daemon, which is the fleet's reviewer for every
    repo. Separately, parseTasksFromYaml throws on an id declared twice in ONE file, for every loader.
  design: |
    mergePlanBlobs gains the same quarantining mode (an onDuplicate callback, strict by default), and the self-target
    daemon path uses it with loadDaemonPlan's ledger and escalation. parseTasksFromYaml's in-file duplicate joins the same
    quarantine in that mode: both entries are held out. lint-plan and CI stay strict.
  acceptance:
