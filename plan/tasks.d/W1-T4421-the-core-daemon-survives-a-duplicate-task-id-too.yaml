      proof: "unit test: the core daemon's origin-blob plan load quarantines a duplicate id instead of throwing"
    - claim: "an id declared twice in one file is quarantined in daemon mode"
      proof: "unit test: an id declared twice in one file is quarantined in daemon mode"
  falsifier: |
    CLOSE IF the core daemon already survives a duplicate task id on its own plan.
