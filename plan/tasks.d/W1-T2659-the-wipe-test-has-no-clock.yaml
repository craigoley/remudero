- id: W1-T2659
  title: "THE WIPE TEST HAS NO CLOCK — P12's falsifier has a harness, a subject generator, arm isolation and a named factor, and its only caller is a CLI verb nobody schedules; give it a policy-gated cadence rung off by default, one pair core the verb and the rung share, and a seat in the measurement report that refuses below the pairing floor"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 75.00
  rationale: |
    RE-DERIVED AT 74e130251 (2026-09-02).

    (1) THE HARNESS IS COMPLETE AND UNCALLED. `rmd wipe-test <task-id> [--factor learnings|recon]`
    (`wipeTestCommand`, src/run-task.ts) ratifies P12: run one sandbox task twice, arm A unmasked
    and arm B with the factor masked, ledger the pair as `wipetest.pair`, aggregate pairs of one
    factor (`aggregateWipeTestPairs`, src/lib/wipe-test.ts). Four follow-ups closed its known
    defects — W1-T1252 (never ledger a pair neither arm measured), W1-T1253 (`generateSandboxTask`,
    a subject supply that never runs out), W1-T1256 (arm isolation), W1-T2512 (a named factor, so
    pairs are comparable per factor) — and the sandbox exists (`craigoley/remudero-sandbox`, public).
    Callers of the core at this sha: `git grep -n aggregateWipeTestPairs -- src/` outside its own
    module finds ONE mention, a comment in run-task.ts. No rung, no cadence row, no policy key names
    the wipe test (`grep -c wipeTest plan/policy.yaml` reads 0; control: `boardReview` reads 1).
    The module's own header says why: "Running the experiment (scheduling real pairs against the
    sandbox, reading the aggregate) is an operator action". It has stayed one.

    (2) WHETHER A PAIR WAS EVER LEDGERED IS A LEDGER-UNION QUERY THIS FILING COULD NOT RUN. This
    host holds no fleet rotations. The query is `rmd ledger-grep 'wipetest.pair'` on the fleet host,
    with `rmd ledger-grep 'measurement_cadence.ran'` as its positive control. The direction refresh
    of 2026-09-01 reported W1-T86 "filed-and-unrun" from the operator's own account; this shard
    carries that as reported, not as measured, and the rung is correct either way — a harness with
    one anecdote is as unfalsified as one with none, and the module's pairing discipline says so in
    terms ("a single pair is an anecdote").

    (3) WHY A CLOCK AND NOT A BRIEF. Every other measurement in this repository that mattered got a
    cadence: rule-efficacy, verdict-calibration and autonomy-rate (W1-T1259), the adoption report
    (W1-T2266), the verb census (W1-T2485), the board review (W1-T2304), the digest. The one
    measurement whose answer decides whether the knowledge tier is worth its injection budget is the
    one left to a human remembering a verb. MASTER-PLAN §8A names it as the gap: "measure whether
    semantic memory helps (P12, the Wipe Test)".

    (4) IT SPENDS, SO IT SHIPS OFF. A pair is two worker runs on the sandbox mount. That is real
    subscription headroom, which is why the rung reads its policy row absent-means-OFF and ships
    inert (Law 5, the W1-T2579 shape): the operator ratifies once by adding the row, and the
    `headroom` governor's existing refusal applies before any spawn, as it does to every other
    dispatch.
  design: |
    (i) ONE PAIR CORE. Extract the arm loop of `wipeTestCommand` — target resolution, factor
    resolution, preflight, arm order, the two `runTask` calls, `ledgerWipeTestPair` — into
    `runWipeTestPair(subject, factor, deps)` in src/lib/wipe-test.ts, and make the CLI verb a thin
    caller of it. A pair the clock runs and a pair the operator runs are then the same code path by
    construction, and the existing wipe-test tests keep exercising the core through the verb.

    (ii) THE RUNG. `wipeTestCadenceCheck` beside `measurementCadenceCheck` and `digestCadenceCheck`
    in src/run-task.ts's daemon tick: policy `wipeTestCadence.{enabled, minIntervalMinutes,
    maxPerDay}` (defaults when present: 1440 / 1), its own marker file via
    `recordMeasurementCadenceFire`. On fire it takes `seq` as one more than the count of prior
    `wipetest.pair` rows in the ledger union, builds the subject with `generateSandboxTask` from
    the learnings index and a shard selection that rotates through the index's keys, alternates the
    factor between `learnings` and `recon` per `wipeTestPairFactor`, resolves the sandbox target
    with `resolveWipeTestTarget` (never the primary repo — the existing refusal), and calls the pair
    core. A target it cannot resolve, a headroom refusal, or a preflight refusal ledgers
    `wipetest.cadence.refused` with that reason and spawns nothing.

    (iii) THE SEAT IN THE REPORT. `runMeasurementCadenceReport` gains a wipe-test member: the
    aggregate per factor over `wipetest.pair` rows from the ledger union, `status: "refused"` with
    the pair count when fewer pairs than the pairing floor exist, `status: "measured"` with the
    aggregate deltas otherwise. The floor is a named constant in wipe-test.ts, not a policy knob.
    This is the harness's first production reader.

    (iv) LEDGER ROWS. `wipetest.cadence.fired` (seq, subject shards, factor), `.skipped` (cadence
    reason), `.refused` (the refusing read's own reason). The existing `wipetest.pair` row is
    unchanged.

    (v) WHAT DOES NOT CHANGE. The arms, the masking, the null-pair refusal, the sandbox-only
    default, the factor vocabulary. No new spend path: the rung dispatches through the same
    `runTask` the verb does.
  acceptance:
    - claim: "the pair core is one function the CLI verb and the rung both call, so a pair run by the clock is the pair the operator would run by hand"
      proof: "unit test: test/wipe-test-cadence.test.ts"
    - claim: "the rung is off when its policy row is absent, fires at most once per window, and records its own marker"
      proof: "unit test: test/wipe-test-cadence.test.ts"
    - claim: "each firing takes a fresh sandbox subject from the learnings index and alternates the factor, and an unresolvable target refuses before any spawn"
      proof: "unit test: test/wipe-test-cadence.test.ts"
    - claim: "the measurement report carries the per-factor aggregate and refuses below the pairing floor rather than printing a rate over one pair"
      proof: "unit test: test/wipe-test-cadence.test.ts"
    - claim: "the CLI verb calls the shared pair core"
      proof: "grep: runWipeTestPair( in src/run-task.ts"
    - claim: "the rung has its production call site in the daemon tick"
      proof: "grep: wipeTestCadenceCheck( in src/run-task.ts"
