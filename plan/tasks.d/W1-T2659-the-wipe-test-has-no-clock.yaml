  note: |
    risk:high, band_meaning:span — the harness module, the daemon tick, the measurement report and
    a policy row are four concerns under Rule 19. Blast radius while the row is absent: none; with
    it present: two sandbox worker runs per day at most, under the headroom governor.

    FIRST LIGHT DOES NOT WAIT FOR THIS. The operator can run one pair today on the fleet host:
    `RMD_SELF_SYNC_DONE=1 ./bin/rmd wipe-test <sandbox-task-id> --factor learnings`, then read
    `rmd ledger-grep 'wipetest.pair'`. This shard makes the second, tenth and fiftieth pair happen
    without anyone remembering.
