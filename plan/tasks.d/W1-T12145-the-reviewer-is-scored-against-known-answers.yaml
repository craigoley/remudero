  rationale: |
    MEASURED 2026-11-10 in the core instance's ledger, 2026-10-27 to 2026-11-10: the two reviewer models disagree widely, and nothing measures which one is right.
    - gpt-6.1-sol gave FAIL in 55.6% of reviews (409 of 736). sonnet-5-5 gave FAIL in 14.6% (47 of 322).
    - gpt-6.1-sol failed a criterion although its proof passed in 26.0% of criteria (623 of 2,392). sonnet-5-5 did so in 3.7% (37 of 987).
    - A gpt-6.1-sol review took a median 273 seconds and $0.44. A sonnet-5-5 review took 54 seconds and $0.13.
    - The shadow judge agreed with the reviewer in 57.3% of cases (43 of 75). Agreement shows only that two models differ. It does not show which one is right, and nothing reads it.
    - src/lib/verdict-calibration.ts already joins a passed merge to a later revert or fix. It groups by verdict class and never by reviewer model.
    AMENDED 2026-11-21 (operator session, decision-quality program), after a read of origin/main dd829e355. The first design cannot run as written:
    - src/lib/review-replay-sample.ts only re-classifies recorded inputs (replayReviewSample, :99-105). It never starts a reviewer.
    - The blinded paired evaluator (src/lib/paired-review-eval.ts, W1-T4905) requires the bug arm to be the corpus head
      (paired-review-eval.ts:119; src/lib/review-finding-evidence.ts:104). It requires the whole head tree to fit 512 KiB, which
      remudero's own changes never do. Its reviewer model is pinned to gpt-6.1-sol (src/lib/replay-harness.ts:306), and it runs
      only as an operator-activated paid pilot.
    - The live reviewer already has a shadow mode that judges and publishes nothing: `--reviewer-shadow`
      (src/lib/reviewer-health.ts:62; src/cli/commands/review.ts:2255; W1-T10269).
    Known answers from history replace seeded mutants. A merged head later reverted or follow-up-fixed is a real escaped defect, so
    there is no mutant-realism gap (Just et al., FSE 2014: 17% of real faults were not coupled to mutants). A head clean through the
    window is a control. Every case passed the incumbent reviewer once, so it is a hard set by construction. The incumbent is
    re-run on a sample to measure its own run-to-run noise.
    Operator decisions for this pass (2026-11-21): unattended; idle subscription capacity only, below 80% of every measured usage
    window; a $25 a week evaluator cash cap for cash-backed reviewers.
  design: |
    Add src/lib/reviewer-calibration.ts.
    1. Cases: read verdict_calibration.outcome rows (W1-T12425). reverted and followup_fixed heads are escaped defects (right
       verdict FAIL); clean heads are controls (right verdict PASS). Sample per risk level with a seed. Drop a case whose pull
       request is missing or whose head cannot be fetched.
    2. Freeze the case list once per epoch, with its seed, in the state directory. A new epoch starts only when at least 20 new
       escaped defects exist. An epoch is never rewritten.
    3. Runner: run the live reviewer with `--reviewer-shadow` on the case's PR at its recorded head, with the model under test
       pinned. RECON first: name the seam that pins the reviewer's model, or add a flag the review command forwards to the reviewer
       spawn. A case reviewer posts no status and no comment.
    4. Gate:
       - A subscription-backed case runs only when replayIdleGate (src/lib/golden-corpus.ts:268) reads the fleet idle, with
         limitPct 80.
       - A cash-backed case reserves against a $25-per-7-days evaluator sub-cap inside the existing cash allowance, before any
         request.
       - A refusal writes one row with its reason.
    5. Score per model: false-FAIL rate on controls and detection rate on escaped defects, each with a Wilson interval and case count;
       cost and duration per case; and the incumbent's re-run agreement on a sample, as the noise floor.
    6. Write one review.calibration.result row per model per pass, registered in src/lib/ledger-steps.ts.
    7. Register the protocol (case rule, metrics, cap, idle limit, the sequential test's mixing variance and α) with eval-card's
       protocolHash before the epoch's first case.
    8. Early stop: after each batch, consult W1-T14147's always-valid sequential test per metric and model pair. A pair whose
       comparison reads decided gets no more cases this epoch, and the row records the decision, the p-value and the cases spent.
    For criterion 4, add the reviewer's served model to `VerdictRow` from the `review.posted` row and group by it. Where the row
    names no model, count it under "unreadable".
    INVARIANT calibration-publishes-nothing: a case review posts no status, comment or label and changes no pull request, and no case spends outside the idle gate or the evaluator cap.
    NOT IN SCOPE: any change to which model reviews live work (W1-T14043 reads this pass's result), the review prompt, and seeded
    mutants.
  falsifier: |
    Label a clean head as an escaped defect and criterion 1 must fail. Derive the set again on the second pass and criterion 2
    must fail. Count a FAIL on a control as correct and criterion 3 must fail. Post a status from the pass and criterion 5 must
    fail. Spend past the cap or while the fleet is busy and criterion 6 must fail. Restore and require all to pass.
