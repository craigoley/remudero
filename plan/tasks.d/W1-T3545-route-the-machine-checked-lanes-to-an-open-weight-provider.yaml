  note: |
    THE SPEND EVIDENCE IS ALREADY IN THIS REPO. `.remudero/mounts.yaml`'s own W1-T3094 block,
    measured 2026-09-08 over 4,131,278 run-tagged rows -> 915 distinct runs:

      inbox.draft_synthesized   1,436 runs   $4,486   45% of ALL metered spend
      implement.done              668 runs   $3,429   (the lane that actually ships code)
      triage                      176 runs
      retro                        89 runs     $740

    AND THE GATE HAS NEVER REJECTED A DRAFT ON CONTENT. Across 468 retained `inbox.classified`
    rows, all 299 `not_ready` verdicts failed on exactly ONE predicate — `drafted`. ZERO failed
    `lint_clean`, `deps_merged`, `evidence_anchors` or `no_conflict`. The top mount is buying a
    margin nothing downstream has ever spent.

    THE OPEN-WEIGHT MODEL WAS MEASURED ON THIS REPO'S OWN OUTPUT CONTRACT, 2026-09-13, against
    `gpt-oss-120b` (Apache 2.0) on `GlobalStandard` in the `synthwatch-foundry` AIServices account
    (eastus2), NOT from a public benchmark:

      shard authoring   11/11 field checks, YAML parses, 2/2 acceptance proofs dialect-valid
                        (`unit test: ` / `grep: ... in ...`) — 451 prompt + 583 completion tokens
      classification    5/5 escalation classes, including the branch-name `credit_error` case
                        — 2,012 tokens total for all five, ~$0.0012

    PRICE, from the Azure retail API the same day: $0.15 / 1M input, $0.60 / 1M output. That is
    roughly 1/25th of the balanced Claude mount these lanes ride today, and it is CASH rather than
    subscription window — which is the entire point: the three subscriptions are the scarce
    resource, and this lane is 45% of what consumes them.

    TRIAGE IS NOT TEXT-ONLY CLASSIFICATION. At `origin/main` on 2026-09-14,
    `TRIAGE_WORKER_TOOLS` is Read/Write/Edit/Grep/Glob/WebSearch and a PROPOSED verdict with no
    changed plan file is deterministically refused. The Azure deployment supports the required
    function-call conversation shape, but rejects `tool_choice: "required"` with
    `UnsupportedToolUse`; with `tool_choice: "auto"`, five live runs each emitted a bounded
    `read_file` call and accepted its tool result before returning the final answer. The adapter
    therefore needs a contained, allowlisted tool loop before this lane can be routed. That is a
    correction to the "classification" shorthand, not a relaxation of any deterministic gate.
  rationale: |
    THE DISPATCH-CHOKE-POINT OVERLAP IS DECLARED, NOT HIDDEN. W1-T62/W1-T77/W1-T78/W1-T94/
    W1-T100/W1-T150/W1-T168/W1-T176 are the historical owners of integrity, sweep, and fix-rung
    behavior that share `src/lib/worker.ts`, `src/lib/sweep.ts`, or `src/run-task.ts`. This task
    does not reimplement any of their decisions: it carries an explicit provider-affinity value
    through those existing dispatch boundaries so machine-checked mounts can bypass the capacity
    auction without fabricated capacity telemetry.

    THIS IS NOT THE OVERFLOW VALVE, AND MUST NOT BE BUILT AS ONE. `config.overflow: "api_key"`
    (W1-T258) already exists and fires only when a window is exhausted. That leaves the 45% lane
    consuming subscription headroom every single run until the moment it runs out. The lever here is
    ROUTINE routing of lanes whose output is MACHINE-CHECKED, so the subscription is spent only on
    work that needs judgement no linter can supply.

    THE ARCHITECTURE WAS BUILT FOR THIS. W1-T2573 made the capability axis provider-neutral
    explicitly so "a SECOND vendor's adapter performs a TABLE LOOKUP here rather than a substring
    match" — `.remudero/mounts.yaml`'s `capabilities` block already carries `claude`,
    `claude_candidates` and `codex` keys. A third provider is the shape that block was designed to
    accept. `WorkerProviderId` ("claude" | "codex", src/lib/config.ts) is the one union that must
    widen, and it appears as an inline literal in roughly eight places in src/lib/worker.ts — those
    are the real edit surface, not the ladder.

    THE MEASURED FAILURE MODES ARE PROMPT-SHAPED, NOT CAPABILITY-SHAPED, and each has a fix that
    must be encoded rather than rediscovered:
      (a) `response_format: {type:"json_object"}` IS BROKEN on this model — it returned
          `{"final{": 0}`. Plain prompting with an explicit inline schema returned 5/5. Do not set it.
      (b) IT IS A REASONING MODEL: reasoning tokens consume the completion budget. A 1,500-token
          ceiling truncated a shard mid-string; 5,000 completed in 583. Size the budget accordingly.
      (c) A `proof:` VALUE CONTAINS A COLON, so unquoted it is invalid YAML. The first attempt
          failed on exactly that. The prompt must require double-quoting; this repo's own shards do.

    PHI-4-MINI WAS TESTED AND REJECTED, so nobody re-litigates it: asked for JSON-only it returned
    prose troubleshooting advice, and under `json_object` it emitted valid JSON with an INVENTED
    schema. At $0.08 vs $0.15 per 1M the saving cannot pay for that unreliability. ONE open-weight
    model, not a mix — a second adds vendor variance and a second failure mode for pennies.
  design: |
    (i) WIDEN THE UNION AT ITS SOURCE. `WorkerProviderId` in src/lib/config.ts gains one member.
    Then fix every inline `provider: "claude" | "codex"` literal in src/lib/worker.ts to reference
    the union instead of restating it — restating is what made this a multi-site edit at all.
    (ii) ADD THE LADDER ROW AS DATA. A new key under `capabilities` in `.remudero/mounts.yaml`,
    capability -> effort -> ordered model ids, exactly the shape `codex` already uses. Adding a
    model stays a data edit.
    (iii) THE ADAPTER MIRRORS `spawnCodexWorker`. It is an OpenAI-compatible `/chat/completions`
    endpoint, so the closest existing shape is the Codex path, including its model-id allowlist
    regex. It maps ONLY the named `SpawnWorkerArgs.tools` capability set to function definitions,
    contains every repository path under `cwd`, returns each result to the same conversation, and
    stops at `maxTurns`; it never gives the model an ambient shell or a tool not explicitly
    granted. The deployment rejects `tool_choice: "required"`, so the adapter uses `"auto"` and
    its system instruction requires a granted tool when the task needs one. Encode the three
    failure modes above IN the adapter, each with a comment naming what it prevents.
    (iv) THE CREDENTIAL NEVER LANDS ON DISK OR IN THIS REPO. Read the endpoint from config and the
    key from the environment, resolved the way `secret-boundary.ts` already keeps a worker's real
    token out of its env. The key is retrievable with
    `az cognitiveservices account keys list --name synthwatch-foundry --resource-group synthwatch-rg`
    — that command, never the value, belongs in any file.
    (v) ROUTE ONLY THE MACHINE-CHECKED LANES, and say in the PR body why each qualifies:
    `synthesis.inbox_draft` (deterministic linter + bounded relint), `synthesis.triage`
    (classification plus deterministic plan-diff verification through the bounded tool bridge),
    `routes.review.low`, `routes.manual.low|medium`, and
    `routes.implement.*.docs|plan-lint`. Recon low/medium MAY follow once the first five are
    measured, not in the same change.
    (vi) LEAVE THESE ON CLAUDE, DELIBERATELY: `architect` and `judge` (the Tier Invariant binds
    them), `retro` (89 runs, output acted on directly, mounts.yaml states the reasoning),
    `implement.src`, `reviewer`, `diagnose`, `fix`. The implement lane trips on this repo's own
    conventions even on a frontier mount — literal proof-title matching, the `## Acceptance` heading
    trap, the fully-injected-coverage trap were all observed the same day — and a weaker model there
    buys retries, not savings.
