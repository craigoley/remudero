  falsifier: |
    RE-MEASURE THE LANE BEFORE BUILDING. The 45% figure is mounts.yaml's own 2026-09-08 measurement
    and the fleet has run a week since. Re-derive `inbox.draft_synthesized` spend from the ledger
    union and use YOUR number; if the lane has shrunk, the premise is weaker and the scope should
    shrink with it.
    RE-RUN THE MODEL PROBE, DO NOT TRUST MINE. The 11/11 and 5/5 above are single runs at
    temperature 0 on 2026-09-13. Run each at least five times before wiring: a lane at 1,436 runs
    per window needs a pass RATE, and one sample is not one.
    DO NOT TREAT TRIAGE AS TEXT-ONLY. Before routing it, prove the deployment accepts the complete
    function-call conversation with `tool_choice: "auto"`, and prove a fixture cannot read or
    write outside its cwd, invoke an undeclared tool, or exceed `maxTurns`. A prose-only adapter
    would return PROPOSED with no plan diff and `decideTriage` would correctly refuse it.
    PROVE THE TIER INVARIANT STILL BITES. Declare an open-weight model above the architect in a
    fixture and show load REFUSES. A third provider that quietly escapes G-17 is the one way this
    task can do real harm.
    DO NOT ROUTE `implement.src`, `reviewer`, `architect`, `judge` OR `retro`. If a measurement
    later argues for one of them, that is its own task with its own evidence. Widening scope here
    converts a cost change into a quality regression nobody measured.
    A PASS RATE BELOW THE RELINT BUDGET IS A FAILURE, NOT A TUNING NOTE. `inbox_draft` retries
    through `MAX_RELINT_ATTEMPTS`; if the open-weight draft needs more relints than that bound
    allows, it is cheaper per token and more expensive per accepted draft. Measure accepted drafts
    per dollar, never tokens per dollar.
