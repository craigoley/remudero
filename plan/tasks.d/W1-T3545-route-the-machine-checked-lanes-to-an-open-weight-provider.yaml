  note: |
    THIS IS PHASE ONE OF THE OPEN-WEIGHT PROGRAM, DELIBERATELY WITH NO THIRD PROVIDER AND NO
    MOUNT ROUTED ANYWHERE NEW. The original task contained four independently revertible PRs, but
    a `run-W1-T3545-*` branch is itself a completion-credit path: `taskIdFromRunBranch` adds the
    task trailer to a PR and `taskCreditedMerged` also credits a merged head branch. A partial PR
    therefore cannot carry the program's final acceptance without either failing it or falsely
    crediting the entire program. This amendment gives the first independently mergeable seam the
    existing id; W1-T3546 owns the adapter and W1-T3547 owns the measured triage rollout.

    THE SPEND CASE REMAINS THE REASON FOR THE PROGRAM. `.remudero/mounts.yaml`'s W1-T3094 reading
    on 2026-09-08 measured `inbox.draft_synthesized` at 1,436 runs and $4,486, 45% of metered
    spend, while all 299 retained `not_ready` inbox verdicts failed only `drafted`, never the
    content predicates. This phase creates no cost-bearing path; it makes later deliberate routing
    possible without fabricated capacity telemetry.
  rationale: |
    Provider selection is currently fleet-global. `resolveProviderRoutingPolicy` reads one
    preference and `selectWorkerProviderForPolicy` is a capacity auction that refuses a provider
    with no readable consumption window. A pay-per-token endpoint must never be made selectable by
    inventing a perpetual "full" window. An explicit provider on a worker mount is the narrow
    alternative: it selects a named enabled provider, bypasses the auction, and records why.

    The central `WorkerProviderId` union is currently restated inline across `worker.ts` and the
    policy preference validator separately hand-writes its values. This phase centralizes those
    declarations before widening the union, so the later adapter has one authoritative provider
    identity and an unknown mount provider refuses at load.
  design: |
    Add optional `provider?: WorkerProviderId` to `Mount`; parse and validate it at load. Thread it
    through every worker spawn. With no provider on a mount, preserve the current auction behavior.
    With a provider, choose that enabled provider without reading or manufacturing capacity data and
    ledger `selectionPath: mount-affinity`; auction-selected workers ledger `selectionPath: auction`.
    The Tier Invariant remains provider-neutral and must still reject an architect that does not
    strictly outrank a provider-affine worker. Do not add `openweight`, endpoints, credentials,
    capability data, or any provider declaration to `.remudero/mounts.yaml` in this phase.
  acceptance:
    - claim: "a mount provider parses only as a known WorkerProviderId, and an absent provider preserves the capacity-auction path"
      proof: "unit test: mount provider affinity parses only known providers"
    - claim: "a declared enabled provider bypasses the capacity auction without synthetic capacity and records mount-affinity in its selection ledger fields"
      proof: "unit test: mount affinity bypasses the capacity auction and records that path"
    - claim: "the Tier Invariant still rejects an under-ranked architect when a worker mount declares a provider"
      proof: "unit test: the Tier Invariant still rejects an under-ranked architect with a provider declared"
  falsifier: |
    Delete the direct affinity dispatch before the capacity reader. The affinity test must fail by
    attempting to read a capacity window; restoring the dispatch must return the suite to green.
    Declare an unknown provider in a mounts fixture and require load refusal. Declare a provider on
    a worker whose architect is not strictly higher-ranked and require the existing Tier Invariant
    refusal. If any mount routes to a new provider in this phase, the phase boundary has failed.
