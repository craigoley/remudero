- id: W1-T2864
  title: "AN AGENT-OPENED PLAN PR MISSES THE FAST REVIEW LANE — admission trusts only the local pr.opened plan_only ledger event, so an otherwise identical one-file task filing opened through GitHub is classified as semantic work and waits behind a judge it will never spawn"
  repo: remudero
  depends_on: [W1-T2439, W1-T2472]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
