  rationale: |
    READ at main 6a04d2f18: buildStatusStream (src/lib/board.ts) creates a ledger tail cache and runs deriveStatus for
    EVERY plan task inside subscribe(), then polls the ledger every pollMs, per connection. N viewers cost N tails and
    each subscribe costs a full derive. No heartbeat comment frame is written, so Cloudflare's ~100 s idle timeout
    cuts a quiet stream. The console never consumes the stream today (its /api/console/summary/stream relay was never
    shipped; CONSOLE-T70 builds it), so the stream must be cheap before it gets real viewers.
  design: |
    A new src/lib/status-stream-publisher.ts exports subscribeStatusStream and holds ONE ledger tail and ONE lastSent map for the whole process, started
    on the first subscriber and stopped when the last leaves. buildStatusStream's subscribe registers with it.
    EXACT WIRE CONTRACT (CONSOLE-T70 pins it; keep it byte for byte):
    - `event: status` with `data:` one task's StatusProjection JSON, the same payload as today (liveSpendUsd and
      liveTurns included).
    - every status event carries `id: <bootId>:<generation>`, where generation is a monotonic integer per publisher.
    - a comment line `: hb` every 25 s on every open stream.
    - a request carrying Last-Event-ID whose bootId differs, or whose generation is older than the retained window
      (keep the last 500 events), first receives `event: resync` with `data: {"reason":"gap"}`. The client then
      re-reads its summary once; a full snapshot is never streamed.
    A new subscriber is never replayed history, exactly as today.
