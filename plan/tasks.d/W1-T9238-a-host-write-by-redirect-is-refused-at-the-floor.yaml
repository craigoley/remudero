  falsifier: |
    Delete the host-mode redirect check: `ssh remudero 'ps aux > /tmp/.x'` exits 0 and the first test fails. Judge every
    redirect token after ssh (local ones too): `ssh remudero 'ps aux' > ~/x` is refused and the third test fails. Treat
    `2>&1` as a path write: `ssh remudero 'docker logs core 2>&1'` is refused and the third test fails.
