  rationale: |
    REPRODUCED 2026-10-13 on origin/main 6732a7690 by piping the PreToolUse JSON the Bash tool sends into
    `bash hooks/deny-floor.sh` (the harness test/the-house-rules-are-refused-at-the-floor.test.ts uses), with
    RMD_HOUSE_RULE_OVERRIDE unset:
      - `ssh remudero 'ps aux > /tmp/.x'`                        exit 0 (runs)
      - `ssh remudero 'docker logs core 2>&1 | tee /dev/shm/x'`  exit 0 (runs)
      - `ssh remudero 'cat foo > ~/out.txt'`                     exit 0 (runs)
      - `ssh remudero 'pkill node'` (control)                    exit 2, "destructive process control sent to the fleet host"
    WHY, READ on origin/main (symbols, not lines): rule 16's host mode is `hr_ssh`, which collects the words after the
    `remudero` destination (skipping LOCAL redirect tokens outside the quoted remote command, which is right) and hands the
    remote text to `hr_check ... host`. `hr_segment` then judges only the PROGRAM position in host mode (kill, pkill,
    killall, docker, systemctl, rm). A redirect token inside the remote command (`>`, `>>`, `2>`, `&>`, `>file`) and a
    `tee` program are never looked at, so a host write passes as a read-only query.
    The house rule (agent-brief preamble, "Host"): never write ANY file on the host, no `>` or `tee` into /tmp, /dev/shm,
    ~ or anywhere else over ssh; stream output back to the Mac instead (`ssh remudero '...' > ~/local-file`).
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and all 342 open origin heads for `hr_ssh` (main 0, no head more),
    `/dev/shm` (main 0; one head, codex/plan-w1-t2956-1788697284364, names it as a TMPDIR in an unrelated shard), and the
    pair deny-floor + redirect (10 shards on main, none about host writes). Control: `acceptance-author-gate` reads 93
    shards on main and on every head.
  design: |
    1. HOST MODE JUDGES REDIRECTS. In host mode (the text `hr_ssh`, a host heredoc or here-string, `docker exec` or a
       pipe into ssh hands to `hr_check`), a write redirect (`>`, `>>`, `N>`, `N>>`, `&>`, `>|`, and the glued `>path`
       forms the tokenizer keeps as one word) whose target is a path is refused through `hr_host_refuse` with the rule
       name `host`, naming the redirect and its target. Two targets are not writes and still run: `/dev/null` and an fd
       duplication (`2>&1`, `>&2`).
    2. HOST MODE JUDGES TEE. `tee` at the program position with any file operand other than `/dev/null` is refused the
       same way. `tee` with no file operand (or only `/dev/null`) still runs.
    3. LOCAL REDIRECTS STAY LOCAL. A redirect OUTSIDE the quoted remote command (`ssh remudero 'ps aux' > ~/x`,
       `ssh remudero cat f 2>&1 | tee ~/local`) is the Mac's and still runs; `hr_ssh`'s existing skip of local redirect
       tokens is the boundary, and an unquoted remote word list is judged by what ssh sends (the remote words), never the
       local redirect after them.
    4. THE MESSAGE NAMES THE ALTERNATIVE: stream the output back (`ssh remudero '<query>' > <local file>`) and, if a host
       write is truly needed, report the exact command to the operator. RMD_HOUSE_RULE_OVERRIDE=host keeps working as for
       the other host refusals.
    No new number: the refusal is a shape, like every other rule-16 refusal.
    Tests go in test/a-host-write-by-redirect-is-refused-at-the-floor.test.ts, driving the hook as the house-rules test
    does, each refused shape paired with an allowed near-miss so deleting the rule fails both.
