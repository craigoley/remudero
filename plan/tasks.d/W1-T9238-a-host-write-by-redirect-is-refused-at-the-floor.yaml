    - claim: "a redirect to /dev/null, an fd duplication, and a redirect outside the quoted remote command still run"
      proof: 'grep: test("W1-T9238: dev-null, fd duplication and local redirects still run" in test/a-host-write-by-redirect-is-refused-at-the-floor.test.ts'
