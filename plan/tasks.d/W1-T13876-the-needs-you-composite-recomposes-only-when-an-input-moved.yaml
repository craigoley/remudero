  rationale: |
    WHY: a 61 s CPU profile of serve's main thread on the host with the Console open (OBSERVED 2026-11-19
    21:31:57-21:32:58Z, operator-approved) put the main thread at 0.22 cores against a 0.3 goal for serve's whole
    process. composeNeedsYou with compareGates was the largest self-time block (1.17 s). withNeedsYouView in
    src/lib/needs-you-view.ts calls composeNeedsYou on every read of the view and on every walk of the bodies,
    though its inputs (the input view entries and the known instances) are replaced, never mutated, when they
    move. compareGates in src/lib/human-gate.ts calls Date.parse on both sides of every comparison, so a sort of n
    gates parses about 2 n log n times.
  design: |
    needs-you-view.ts: compose() keeps the composed entry with the input entries and the instance keys it was
    built from, and returns it when both are reference-identical (sameItems). The body listener uses one
    isNeedsYouInput predicate. human-gate.ts: compareGates takes optional precomputed times, and the sort maps each
    gate to its sourceTime once, sorts the pairs and maps back. The view's body and order are unchanged.
    INVARIANT gate-order-kept: gates still sort oldest opened time first, ties broken by key, as before.
  falsifier: |
    Compose on every read again: criterion 1 fails (the input body's data is read on each read). Call compareGates
    without the precomputed times: criterion 2 fails (more than one parse per gate).
