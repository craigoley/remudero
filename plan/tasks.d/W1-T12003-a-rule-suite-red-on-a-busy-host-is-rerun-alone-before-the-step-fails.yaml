  rationale: |
    OBSERVED 2026-11-10 on the Azure host (8 cores, 1-minute load 44 to 113, CPU pressure some avg300 79 to 94 percent): five author preflight attempts across three branches failed their static step, and four of the five failed only on suites that pass alone.
    - run-W1-T11860 attempt 2 (06:39Z): eight tests in six suites, among them test/architecture-fitness.test.ts, test/coverage-session-blanking.test.ts and test/rules/scout-config-gardener-failed.test.ts, with spawnSync npm ETIMEDOUT and spawnSync /usr/bin/node ETIMEDOUT in their errors.
    - run-W1-T11884 attempt 2 (07:40Z) and a plan filing (02:53Z): test/ci/a-rejected-census-measurement-retains-its-complete-capture.test.ts alone, on one assertion about an error string.
    - Each attempt took about three hours of wall time on that host, so one such failure costs a branch three more hours, and the retry adds to the load that caused it.
    - These suites spawn children under fixed 90 to 120 second wall-clock timeouts. W1-T11939 sizes the pass from host pressure, which lowers how often this happens; this task is what the runner does when it still does.
  design: |
    In runRuleSuitesConcurrently collect the suites whose child exited non-zero, and after the pass rerun each once with nothing else running. Green alone: print RERUN-GREEN with the suite and both durations and count it as passed. Red alone: print both outputs and fail as today. Print a closing line with the rerun count so a suite that needs the rerun often is visible in the log.
    NOT IN SCOPE: the fixed child timeouts inside the suites, the affected-tests stage, and any change to what CI runs; hosted CI still runs every suite once and is the gate.
  falsifier: |
    Skip the rerun and criterion 1 must fail; treat a suite red alone as passed, or rerun it twice, and criterion 2 must fail; rerun on a clean pass or at concurrency 1 and criterion 3 must fail. Restore and require all three to pass.
