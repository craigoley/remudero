  status: merged
  attempts: 0
  rationale: |
    READ at origin/main dd829e355 (2026-11-21).
    - A machine-filed CI lesson is proved by string presence: ciLearningShardYaml writes `grep: <findingId> in <lessonsFile>`
      (src/lib/measurement-cadence.ts:3591-3594). Nothing proves the lesson reaches a worker. Only 3 entries in learnings/ci.yaml
      carry `error_signatures:`, so most lessons match by file path only.
    - The draft (CiLearningShardDraft, :3195-3226) knows its gate, the check that went red. A later fix round's failing check name
      (CiFailure.name, src/lib/sweep.ts:7114) is exactly that text, so the gate is the natural error signature for the fix-lane
      knowledge shadow (W1-T14138).
    - Measured on 2026-11-21 at origin/main 17e986698: learnings/ci.yaml holds 31 ci-learning entries, 25 of them active.
      selectLearnings selects only 2 of the 25 for a context naming their own gate; they are the two whose error_signatures
      hold the gate exactly. With `[<gate>]` added in memory, all 25 are selected. Superseded entries are never selected,
      because selectLearnings drops non-active entries before matching. Error signatures match as exact substrings
      (errorHitCount, src/lib/learnings.ts), and the 25 gates are check names, not common words.
    - Without the backfill, a fix round failing one of those checks matches none of their lessons, so the W1-T14138 shadow
      would see almost no CI-lesson matches. learnings-budget-ratchet counts only each entry's rendered fact line, so
      signatures add no budget weight. prompt-surface-gate admits a learnings data change only with a golden verdict under
      test/fixtures/golden-verdicts/ (evidenceFor, scripts/prompt-surface-gate.mjs).
    - judgeCiLessonEfficacy (src/lib/ci-lesson-recurrence.ts:46-83) reads a lesson held, recurred or unmeasurable, but
      mintCiLearningShards drops every gate that already has a lesson (`heldGates`, measurement-cadence.ts:3432, 3441), and the
      recurrences are read only by a hand-run script (daemon.ts:6916; scripts/private-routing-daily-review.mjs:229). A lesson that
      did not work is never replaced.
    - Machine shards must keep `files:` to the lesson and its golden fixture (src/lib/plan.ts:1786-1790), and proof-scope blocks a
      path proof outside files for machine shards (src/lib/task-linter.ts:3356-3363); a `unit test:` title names no path.
    - A builder observed that the reviewer's resolver answers `unresolvable` for a generated test title, which is never written
      literally in a file, and falls back to running the whole suite. So a per-lesson `unit test:` proof would make every
      machine lesson's review slow and fragile. The generated suite runs in CI on every PR, so it can enforce reach instead.
    - The cadence's two mint callers in src/run-task.ts pass no filed lessons, so without wiring the reopen would never run live.
  design: |
    1. ciLearningShardYaml's note tells the worker to write the new entry with `src: "<findingId>"` and
       `error_signatures: [<gate>]`, the check name that went red, so the generated suite can read the gate from src.
    2. Add test/learning/every-ci-lesson-is-selected-for-its-own-check.test.ts, which generates one test per ACTIVE ci-learning
       entry in learnings/ci.yaml and learnings/ci.d/*.yaml, titled `ci lesson <findingId> is selected for its own check`. Each
       runs selectLearnings over the real corpus with the gate name as context text and asserts the entry is selected.
       Superseded entries get no test, since they are never injected.
    3. The shard template's proofs are unchanged. Reach is enforced by the generated suite, which CI runs on every PR: a lesson
       whose entry is not selected for its own check turns that suite red, so its PR cannot merge.
    4. When a gate's held lesson reads recurred, mintCiLearningShards no longer drops that gate. It drafts a reopen whose finding id
       carries `#r<N>`, where N is one more than the prior reopens. ciLearningGateOf and parseFiledCiLesson accept the suffix.
       In src/run-task.ts, both mint callers read the filed lessons before minting and pass them when the read is measured, and
       a ladder hand-off is given to the flow-remedy ladder, so the reopen and the hand-off run live.
    5. At the third reopen the gate goes to the existing flow-remedy ladder (LadderKind, src/lib/flow-remedy-gardener.ts:61-85) instead
       of filing another lesson. A held lesson files nothing, and so does an unmeasurable one.
    6. Backfill: add `error_signatures: [<gate>]` to every active ci-learning entry in learnings/ci.yaml whose signatures do not
       already hold its gate exactly, keeping any existing signature. Change no fact text. Add the golden verdict case
       test/fixtures/golden-verdicts/ci-lessons-carry-their-gate/ in the layout of the existing ci-*-lesson cases, with a
       checkout/learnings/ci.yaml, and register it in test/golden-verdicts.test.ts. It must replay as an executed pass, as the
       other ci-*-lesson cases do. A case nothing runs would be evidence in name only.
    The hand-fix lesson template (the ci-learning rung's file-keyed drafts, parked for operator release) is out of scope and
    keeps its proofs.

    INVARIANT a-lesson-proves-reach: a CI lesson drafted from a failing check cannot merge unless the generated suite selects it for its own check.
  acceptance:
    - claim: "A drafted CI lesson shard tells its worker to write the finding id as src and the gate's check name as an error signature"
      proof: "grep: W1-T14140 criterion 1: in test/gardeners/a-ci-lesson-reaches-its-check-and-reopens-when-it-recurs.test.ts"
    - claim: "Every active ci-learning entry is selected by selectLearnings for a context naming its own check, one generated test per entry"
      proof: "grep: is selected for its own check in test/learning/every-ci-lesson-is-selected-for-its-own-check.test.ts"
    - claim: "invariant:a-lesson-proves-reach — an active ci-learning entry that is not selected for its own check fails the generated suite"
      kind: guard
      proof: "grep: W1-T14140 criterion 3: in test/gardeners/a-ci-lesson-reaches-its-check-and-reopens-when-it-recurs.test.ts"
    - claim: "A gate whose held lesson recurred is drafted again as a reopen, numbered one past the prior reopens"
      proof: "grep: W1-T14140 criterion 4: in test/gardeners/a-ci-lesson-reaches-its-check-and-reopens-when-it-recurs.test.ts"
    - claim: "The third reopen goes to the flow-remedy ladder, and a held or unmeasurable lesson files nothing"
      proof: "grep: W1-T14140 criterion 5: in test/gardeners/a-ci-lesson-reaches-its-check-and-reopens-when-it-recurs.test.ts"
    - claim: "The measurement cadence hands the filed lessons to the mint, so a recurred gate reopens live"
      proof: "grep: W1-T14140 criterion 6: in test/gardeners/a-ci-lesson-reaches-its-check-and-reopens-when-it-recurs.test.ts"
  falsifier: |
    Keep the heldGates filter for a recurred lesson and criterion 4 must fail. Write the lesson without the gate signature and
    criterion 1 must fail, and its generated selection test must fail. Remove one backfilled signature and that entry's
    generated test must fail. Drop the mint callers' lessons in src/run-task.ts and criterion 6 must fail. Restore and require
    all to pass.
