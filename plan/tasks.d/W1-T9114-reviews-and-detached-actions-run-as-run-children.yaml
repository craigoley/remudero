  falsifier: |
    Keep `drainInFlightReviews` awaiting child reviews and the restart test's exit waits for the fake child. Skip
    adoption for review kinds and the boot test finds the slot freed and the PR re-admitted while the child still
    runs. Settle a terminal child on each boot and the second boot posts a second verdict.
