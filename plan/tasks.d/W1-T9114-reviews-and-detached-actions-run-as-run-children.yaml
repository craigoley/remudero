  design: |
    No new bound and no fixed list. The contract is W1-T9070's; this task adds kinds to it.
    1. INVENTORY FIRST, AS DATA. Enumerate every in-process unit a restart drains today (the `DetachedActionKind`
       union plus the review registry) into one table in src/lib/run-child.ts, read through
       `detachedWorkPlacement(kind, evidence)`, which `drainBeforeRestart` (src/lib/daemon.ts) calls to decide what it
       still waits for. The table holds kind, what it holds in memory, whether
       it can resume from files, and its measured drain cost. The cost comes from the ledger, not a guess:
       `daemon.freshness_drain.completed` and `daemon.memory_drain.completed` already carry `in_flight_reviews`,
       `detached_sweep_actions` and `duration_ms`, and `daemon.detached_action_released` / `_abandoned` carry
       `action_kind` and `age_ms`. A kind moves to a child only when its measured drain time is non-zero over the
       window the task measures; a kind that never held a drain stays in process and the table says why. Expected from
       the 10-12/13 window: reviews and fix-dispatch move; retro already spawns its own subprocess
       (`runAutomatedRetroSubprocess`, W1-T2870) and only its settle moves.
    2. THE SAME CONTRACT. A moved kind runs as a run child: a run directory with `spec.json` (kind, the serializable
       inputs the in-process call takes today, the PR number and head sha for a review), `status.json` written by the
       child, and the identity triple (pid, start ticks, container generation). The child's reservation opens on its
       own root (W1-T9080), so the memory governor counts it. Results map back through the closed failure union; an
       unknown failure settles as lost, never as success.
    3. ADOPTION ON BOOT, THE SAME AS RUNS. The boot path's `adoptRunChildren` (W1-T9086) classifies these kinds with
       the same four outcomes (live, terminal, lost, dead). A live review child keeps its review slot and counts in
       the review width; a terminal one posts nothing twice (idempotent by run id and head sha); a lost one releases
       the slot and the next light pass re-admits the PR.
    4. A RESTART WAITS FOR NOTHING IT DOES NOT OWN. Under the mode that moved them, `drainBeforeRestart` waits only
       for kinds still in process, `lightPassRefillsClosed` is not set for child reviews, and
       `daemon.freshness_drain.completed` gains `detached_children_left_running` by kind.
    5. BEHIND THE EXISTING SWITCH. Moved kinds follow `sweep.runChild.mode` (W1-T9082/W1-T9087): `shadow` spawns a
       probe that round-trips the contract for one review and records its cost; `auto` promotes on the same
       boot-cycle evidence W1-T9087 uses, and demotes on a lost or misidentified child.
    Tests go in test/reviews-and-detached-actions-run-as-run-children.test.ts, with `test(` titles verbatim as in the
    proofs below, over a temp state dir, a fake spawn and a fake clock.
