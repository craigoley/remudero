  title: "the host-parity runner has no invoker, so the baseline can neither be pruned nor populated — runHostParity already computes the healed and undeclared lists that would report its own staleness, and nothing in the repo ever calls it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55
  risk: medium
  rationale: "MEASURED at d2f50ff. `runHostParity` (src/lib/host-parity.ts) already returns
    `healed` — 'declared for this pole and NOT observed — the baseline is stale and would mute a
    real failure' in its own words — alongside `undeclared`. THE REPORTING IS BUILT. Its ONLY
    caller is `scripts/host-parity.ts`, and NOTHING INVOKES THAT SCRIPT: `git grep -ln host-parity
    -- .github/` returns EMPTY, there is no npm script matching /parity/, and no daemon rung calls
    it. POSITIVE CONTROL for the same query shape: `scripts/diff-coverage.mjs` IS invoked from
    .github/workflows/ci.yml. So this is a built-and-never-wired capability, the class
    test/producer-completeness.test.ts and the SHIPS-UNWIRED floor already exist to catch, one
    level up — at the RUNNER rather than at a field.
    THE CONSEQUENCE IS MEASURED, IN BOTH DIRECTIONS.
    (a) A HEALED ENTRY IS NEVER PRUNED. The single `pole: \"ci\"` entry — recon-gaps-relayed's
    byte-identity test — was declared in #1659 at 19:14 on 2026-08-12 and healed by #1682 at 22:54
    THE SAME EVENING, which raised the `ci` job's checkout to `fetch-depth: 0` precisely so
    `origin/main` resolves; that workflow's own comment names this test as the reason. The entry
    has stood for four days describing a divergence the repo itself fixed within four hours.
    (b) A WHOLE POLE WAS NEVER BASELINED. `HostPole` is `mini | ci | azure` (#1707 gave the
    container its own pole 'instead of reporting as ci'), and HOST_PARITY_BASELINE declares FOUR
    `mini` entries, ONE `ci` entry and ZERO `azure` entries. Eleven failures reproduce on a
    container host today and not one is declared anywhere.
    AND THE ELEVEN ARE DIVERGENCES, NOT FLAKES — established by REPETITION UNDER VARIED
    CONDITIONS, which is the only discriminator that separates the two. Two independent
    whole-suite runs on one host at one sha produced BYTE-IDENTICAL failure sets (sha256 prefix
    823a8bc31a144d5b both, 7277 tests / 11 fail each), and every implicated file re-run WHOLE in
    isolation reproduced its exact failures twice more — once under load and once idle. Four
    observations, zero variation. Most name their own coupling by construction: `daemonBoot` reads
    `process.env`, `emissionsCommand` reads the real ledger corpus, `reapStaleWorktrees` reaps real
    worktrees, and the W1-T505 tests assert a printed `docker run` invocation.
    NOT IN THIS TASK, and cited rather than re-investigated: CI's own undeclared failure is
    `git commit-tree` refusing without a committer identity, because `actions/checkout` sets
    `safe.directory` and credentials but never `user.name`/`user.email`. #1971 is in flight for it."
  design: |
    (i) GIVE THE EXISTING RUNNER AN INVOKER. Nothing here re-implements the diff: `runHostParity`
    already computes `healed` and `undeclared` correctly, and this task must not duplicate that.
    The gap is that no caller exists, so the report is written for nobody.
    (ii) IT REPORTS, IT DOES NOT GATE. `runHostParity`'s own doc rules a gate out and gives the
    reason: four bounds in this repo have fired on a healthy condition, and a host-divergence check
    that blocked merges would be the fifth. The runner already writes a `plan/feedback/` record and
    exits 0; the wiring must preserve both.
    (iii) A POLE WITH NO DECLARED ENTRIES MUST READ AS UNBASELINED, NOT AS CLEAN. Today an empty
    pole and a perfectly-parity-clean pole are indistinguishable in the output, which is why
    `azure` could sit unpopulated without anyone noticing. That distinction is the one new fact
    this task adds, and it is the direction the current code cannot express.
    (iv) THE FLAKE/DIVERGENCE DISTINCTION IS ENFORCED BY REPETITION, NOT BY JUDGEMENT. The file
    states twice that a flake is not a divergence and must not be declared as one. Whatever
    populates a pole must require a failure to reproduce across N runs before it is declarable, so
    the rule is structural rather than a convention every future session has to remember.
    (v) FALSIFIER, BOTH DIRECTIONS: a pole with zero declared entries is reported as unbaselined (a
    change that reported nothing fails this), AND a pole that is genuinely parity-clean is NOT
    reported as unbaselined (one that flagged every pole would pass the first and fail this — the
    false-positive containment).
    (vi) NOT IN SCOPE, each for a stated reason: EDITING HOST_PARITY_BASELINE, which is the bulk
    update the file's own rule anticipates and forbids, and which cannot be done honestly until a
    repetition-enforced run produces the evidence; DELETING it, because it is the only thing
    between a session and attributing every host artifact to its own diff; the eleven container
    divergences themselves, which are the INPUT to this mechanism rather than its subject; and CI's
    commit-tree identity failure, which #1971 already fixes.
  acceptance:
    - claim: "a pole with no declared entries is reported as unbaselined rather than silently clean"
      proof: "unit test: a pole with no declared entries is reported as unbaselined rather than clean"
