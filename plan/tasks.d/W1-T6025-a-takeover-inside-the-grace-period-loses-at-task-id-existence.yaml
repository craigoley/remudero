  design: |
    (1) When the reservation head's holder line has source=reclaimed, read its PARENT commit's holder too.
    Takeover age = reclaimer started_at minus parent started_at. If both parse and the age is under the grace
    (mirror RESERVATION_PUSH_GRACE_MS; the test pins parity with src/lib/task-id-reservation.ts), the ORIGINAL
    holder is the rightful holder: a filer equal to taken_over_from passes the holder check, and a filer equal
    to the reclaimer is refused with text naming the original branch, host and started_at and calling the
    reclaimer the loser of the race. (2) Every holder refusal prints the holder's host, pid, started_at and
    source, not only its branch. (3) The open-PR collision half asks the reservation which colliding PR's head
    is the rightful holder (by (1)), refuses only the other PR, and names the winner's PR and branch. With no
    readable holder it keeps today's symmetric refusal (fail-closed).
  acceptance:
