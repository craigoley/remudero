    W1-T3367, PR #5050). Deliberately does NOT presuppose a worktree-isolation leak: a source audit at
    filing time found no symlink bridging `plan/` between worktrees and no path/branch-collision gap in
    `uniqueRunBranch`/`pruneStaleRuns`/`worktreeAdd` — re-derive before building, per the W1-T515 precedent
    that these facts move. The one documented class that COULD explain the symptom (W1-T1010's
    workers-caught-mid-run-by-an-ungraceful-recycle incident) is named but unconfirmed; equally plausible
    is that W1-T3367 saw its OWN uncommitted draft output, a misattribution rather than a leak. Scoped to
    ONE file (the assertion's diagnostic power) so it is buildable regardless of which is true; any
    src/-level fix a real investigation surfaces is EXPLICITLY deferred to a separate follow-up, never
    bundled here."
