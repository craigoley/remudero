  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so two source modules and a test named after neither trip it at `medium`. The change
    is prompt text plus, if the task chooses (iv), one field label at the construction site.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/risk-judge-description-is-the-defect.test.ts`, declared in `files:`, so on this
    filing PR it resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL, CONFIRMED PRESENT BEFORE IT WAS
    BELIEVED. `rmd check-proof` on the declared path reads `exit: 1`, `hits: 0`, `verdict: fail`. The
    SAME verb on an EXISTING pure path — `unit test: test/risk-judge.test.ts`, the test file for the
    very module this task changes — reads `verdict: pass`.

    THE TWO LANES HOLDING W1-T2282 AND W1-T2283 WERE CHECKED TWICE AND NEITHER COVERS THIS SUBJECT.
    At first read neither had filed anything. BOTH OPENED A PR WHILE THIS SHARD WAS BEING WRITTEN,
    and the re-check immediately before commit found them: **#2859 `chore(plan): file docs/ as the
    uncovered knowledge corpus (W1-T2282)`** and **#2858 `chore(plan): file W1-T2283 — the requeue
