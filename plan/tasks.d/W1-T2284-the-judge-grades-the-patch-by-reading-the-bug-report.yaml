- id: W1-T2284
  title: "The risk judge's `description` IS the shard title, and every shard title in this repo is a defect statement in the negative voice — so on the one class of work this fleet exists to do, a fix, the judge is handed the bug report and asked to grade the patch; it quoted W1-T2263's title back as the change and escalated the fix that REMOVED that defect at 0.85, the highest confidence of the day, over a `remudero-review` PASS on 8 of 8 criteria"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 50.00
  risk: high
  rationale: |
    Filed by reading and measuring, from a scratch worktree PROVEN equal to origin/main by sha
    (daa4b5be), clone shallow-checked `false`. `src/run-task.ts` read via git objects and cited by
    SYMBOL — #2851 relocated symbols in that file today and every line number from earlier briefs
    has drifted. No suite, no poller, no spawning verb.

    (1) THE DESCRIPTION IS THE TITLE. ONE LINE, INSIDE `runTask` (`src/run-task.ts`):
        change: { description: `${task.title} — ${prUrl}`, files: task.files },
    and the SAME string arrives a SECOND time three lines later —
    `planContext: { taskId: task.id, title: task.title, taskType: task.type }`. So the judge reads
    the shard title twice and the PR title never.

    (2) AND THE TITLE IS A DEFECT STATEMENT, BY CONVENTION. The five most recently filed shards on
    main, opening words: *"THE SERVE PROCESS'S BOARD GATEWAY IS THE ONE UNPACED CONSTRUCTION AND IT
    EXHAUSTED GITHUB'S SECONDARY LIMIT"*; *"THE CONSOLE'S USAGE PANEL READS A FILE ITS OWN CONTAINER
    CANNOT SEE"*; *"THE ACCESS JWT PROVIDER IS BUILT, TESTED AND HAS ZERO PRODUCTION CALL SITES"*;
    *"RULING — REMUDERO IS BRING-YOUR-OWN-SUBSCRIPTION"*; *"the node runtime the whole fleet executes
    is INHERITED and never asserted"*. Four of five are the broken state in the present tense. **THE
    JUDGE IS THEREFORE HANDED A DESCRIPTION OF THE DEFECT AND ASKED WHETHER THE CHANGE IS RISKY**,
    and the more precisely a shard names what is wrong, the more alarming its fix reads.

    (3) THE 0.85 CASE, RE-DERIVED END TO END. W1-T2263's title, verbatim from the shard:
    *"A SEMANTIC DOWNGRADE OVERWRITES THE ONLY FIELD THAT COULD NAME THE REMEDY — … then the floor's
    accumulated reason is REPLACED by a fixed eight-word constant …"*
    Issue 2853's escalation reason, verbatim: *"The description explicitly identifies this change as
    a 'SEMANTIC DOWNGRADE' … The description states that 'the floor's accumulated reason is REPLACED
    by a fixed eight-word constant' … passing gates do not negate a deliberate semantic downgrade in
    data quality."* **THE JUDGE QUOTED THE DEFECT STATEMENT AND GRADED IT AS THE CHANGE.**
    The PR is `fix(review): append the semantic downgrade note instead of overwriting reason`
    (#2852), and its diff at `daa4b5be` does the exact opposite of what the judge described:
        -    reason = "reviewer judged the proof non-responsive (semantic downgrade)";
        +    reason = semanticClause ? `${reason} — NOTE: ${downgradeNote}: ${semanticClause}` : `${reason} — NOTE: ${downgradeNote}`;
    The REMOVED line IS the constant the title names, and the added line is the `${reason} — NOTE: …`
    append idiom the source comment says a sibling dialect branch already uses. `remudero-review` on
    that head read **`PASS — 8 criteria substantiated, no test theater`, state `success`**. Merged by
    hand.

    (4) FOUR ESCALATIONS ARE IN SCOPE, NOT THREE, AND THEY ARE NOT ONE FAILURE MODE. Read fresh from
    the issues rather than carried:
        2769  2026-08-24  W1-T2216  #2765  LOW  0.60 — floor, not a misread
        2824  2026-08-25  W1-T2246  #2820  HIGH 0.72 — a scope fact
        2846  2026-08-25  W1-T2252  #2845  LOW  0.68 — floor, not a misread
        2853  2026-08-25  W1-T2263  #2852  HIGH 0.85 — the inversion
    **ONLY ONE OF THE FOUR IS AN INVERSION.** 2769's own text reads *"Change implements the stated
    plan exactly … the unusualness is deliberate design within stated constraints, not unplanned
    deviation"* — a CORRECT reading that escalated because 0.60 < 0.7. 2846 likewise: *"Change
    directly addresses the named plan issue"*, escalated at 0.68. 2824 named an undeclared third
    file, `src/run-task.ts` at +92/-10 — a real observation the judge could only have made from the
    `ACTUAL CHANGE` block, and it made it correctly. **THE BRIEF'S "THREE ESCALATIONS, ALL THREE
    CARRYING THE PHRASE" IS TRUE OF THE PHRASE AND NOT OF THE DIAGNOSIS**, and the correction
    matters because it is what decides Q2.

    (5) THE PHRASE IS THE PROMPT'S OWN RULE, NOT A DISCLOSURE — AND W1-T454 PUT IT THERE ON PURPOSE.
    `evidenceQualifiedReason` (`src/lib/risk-judge.ts`) prepends *"on the change's description/files
    alone, no diff was read — "* to every non-internal reason. `buildRiskJudgePrompt` states it as an
    instruction: *"YOU ARE NOT SHOWN A DIFF (W1-T454). The description and files list below are
    everything you get — no patch, no hunks, no code."* So the diff is **DELIBERATELY NOT PASSED**,
    which is the third of the brief's three possibilities and the only one the source supports.

    (6) AND THIS EXACT DEFECT WAS ALREADY MEASURED ONCE, BY W1-T1031, WHOSE REMEDY WAS NOT THIS ONE.
    `RiskJudgeChangeView`'s own doc: *"a description that correctly NAMES the defect it removes reads
    to the judge exactly like a description that INTRODUCES one, because nothing about the change's
    real shape was ever shown (10/75 `risk_judge.decision` rows escalated, 9 merged anyway, none
    prevented anything; three same-day escalations on implementations whose descriptions named their
    own subject)."* **THAT IS THIS TASK'S SENTENCE, WRITTEN BEFORE THIS TASK.** W1-T1031 answered it
    with a bounded REST diffstat and its doc says plainly *"STILL NOT A DIFF"*. The diffstat shipped,
    and 2853 happened anyway — because a `+84/-4` line count cannot tell a removal of the named
    defect from an introduction of it. **The measurement was right and the remedy was aimed at the
    wrong half: the problem is the FRAMING of the description, not the absence of a shape.**

    (7) THE LEDGER CANNOT SEE TODAY AND SAYS SO. Step names taken from source (`risk_judge.decision`,
    `risk_judge.escalated`, `risk_judge.parse_attempt`). Over the union at the state dir, per form
    (666 `.gz` / 6 plain / 1 live), `risk_judge.decision` reads 64/23/0 and `risk_judge.escalated`
    8/2/0, controlled in every form by `run.start` at 257438/1314/200. Deduped across the union:
    **87 distinct decisions, 10 escalations — 11.5%**, against a control of 787 distinct `run.start`
    (from 258,952 raw rows, so the dedup is load-bearing). **NEWEST ROW PER STEP: `risk_judge.decision`
    2026-08-12T23:47:53.826Z, `risk_judge.escalated` 2026-08-12T13:53:17.117Z.** This host's corpus
    ends thirteen days before the four escalations above, so it cannot carry them; the GitHub issues
    are the independent evidence and the ledger figure is the historical base rate only.
  design: |
    (i) Q2 — THE REMEDY IS THE FRAMING, AND THE MEASURED EVIDENCE SAYS SO RATHER THAN THE ARGUMENT.
    One sentence in `buildRiskJudgePrompt` telling the judge that the description states the DEFECT
    THE TASK EXISTS TO REMOVE and the change under assessment is the REMEDY. Costs nothing per PR,
    scales to any diff size, and is the only thing that touches the one case that was actually wrong.
    **2853 IS AN INVERSION AND FRAMING FIXES IT: the judge had every fact it needed and read the
    polarity backwards.** The same sentence would have cost 2769 and 2846 nothing — both already
    read the change correctly.

    (ii) AND THE DIFF IS A SEPARATE, WEAKER CASE THAT THIS TASK SHOULD NOT SMUGGLE IN. **2824 IS THE
    ONLY CASE A DIFF WOULD HAVE CHANGED**, and it would have changed it from "escalate" to "resolve
    itself" — the judge already HAD the scope fact from the `ACTUAL CHANGE` block and stated it
    correctly; what it lacked was the thirty lines that show the undeclared file's change is benign.
    That is a real improvement and a real cost: tokens on every judged PR, on the cheapest configured
    mount whose floor `RISK_JUDGE_CHANGE_VIEW_FILE_CAP`'s own doc puts at 40,000 tokens of context,
    and no bound that fits a large PR. **SO: NOT BOTH, NOT YET.** Ship the framing, keep the
    measurement running, and let a diff be argued on its own evidence later — the warrant today is
    one escalation a human resolved by reading thirty lines, which the shard should call a cheap
    outcome rather than a failure.

    (iii) THE SENTENCE MUST NOT BECOME A LICENCE. The framing tells the judge what the description
    IS; it must not tell the judge that a fix is therefore safe. The failure mode to test for is the
    obvious one: a prompt that says "the description is the defect, the change is the remedy" invites
    "therefore low risk", which would convert a reading error into a rubber stamp. The new test must
    carry a falsifier in that direction — a change whose description names a defect AND whose gates
    state is genuinely concerning must still be able to reach `high`.

    (iv) THE DOUBLE-DELIVERY IS PART OF THE SCOPE AND MAY BE PART OF THE FIX. `task.title` reaches
    the judge as BOTH `change.description` and `planContext.title`. Whether the remedy relabels the
    description at its construction site in `runTask`, or adds the framing in
    `buildRiskJudgePrompt`, or both, is the task's to decide — `files:` declares both modules so the
    answer cannot drift outside what was declared. **That is deliberate: an undeclared third file is
    exactly what escalation 2824 fired on, and this shard should not reproduce it.**

    (v) Q3 — WHAT MUST NOT CHANGE.
      **THE JUDGE KEEPS ITS VETO AND KEEPS ESCALATING WHEN UNSURE.** All four escalations stopped an
      unattended merge and all four were right to. Two were the confidence floor firing on a correct
      reading, which is the floor working, not failing.
      **`DEFAULT_CONFIDENCE_THRESHOLD` IS NOT MOVED.** Not to 0.6, not anywhere. Two of the four
      cases sit just under 0.7 and would vanish if it dropped — that is the outcome to refuse, not
      to engineer. Nothing here lowers a threshold and nothing auto-merges past a high verdict.
      **`evidenceQualifiedReason` KEEPS QUALIFYING.** If the judge still has not read a diff, every
      reason must keep saying so. A framing sentence changes what the description MEANS, not what the
      judge has SEEN, and the qualifier is the sentence that keeps those two apart.
      **THE OPERATOR GATES EVERY MERGE.** Nothing in this task arms, merges, or widens what may
      proceed unattended.

    (vi) THE CALIBRATION COST IS CITED, NOT RE-FILED. Three hand-merges past the judge today produced
    NO calibration record: W1-T2244 is the producer for exactly that, and its build (#2828) is
    blocked on W1-T2276's source-map defect. **NEITHER IS RE-FILED HERE.** They are named so the
    reader knows why the base rate in rationale (7) stops at 2026-08-12 and why today's four cases
    exist only as GitHub issues.

    (vii) NOT IN SCOPE, NAMED: passing a real diff; `RISK_JUDGE_CHANGE_VIEW_FILE_CAP`; the confidence
    threshold; the shard-title convention itself (the titles are correct and useful — the judge's
    reading of them is what is wrong); `parseRiskJudgeResponse`'s third state; and the escalation
    taxonomy.
