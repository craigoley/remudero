    - claim: "invariant:pressure-still-stretches — below the cap, handoffSpacingMs still grows with pressure, and the first serve.handoff_deferred spacing row is unchanged"
      kind: guard
      proof: "grep: W1-T13534 criterion 4 in test/console-api/serve/serve-logs-each-handoff-ask-the-spacing-wait-absorbs.test.ts"
  rationale: |
    WHY: on 2026-11-17 (OBSERVED, host ledger) serve handed off at 22:18:56Z, then at 22:33:24Z wrote one
    serve.handoff_deferred reason spacing with waitMs 12423555 (about 3.45 h; spacingMs 13291701 after pressure).
    Handoff asks at 22:48Z and 23:03Z (target c287903b2, 9 commits behind) wrote serve.handoff_requested, but no
    row said the pending wait absorbed them, so a merged fix (#19203) was not live and the ledger did not say why. An operator container restart was needed to load it.
    READ at origin/main, src/lib/serve-supervisor.ts awaitSpacing: `if (spacingPending) return true;` returns before
    any log, by design ("the wait re-asks once, however many asks arrive meanwhile").
  design: |
    INVARIANT pressure-still-stretches: below the cap the pressure scaling and the single re-ask are unchanged.
    1. In awaitSpacing, when spacingPending is already set, count the ask and write serve.handoff_spacing_absorbed
       { sha (the asked target, when known), remainingMs, absorbed } before returning true.
    2. Reset the count when the wait ends.
    3. Add SERVE_HANDOFF_SPACING_MAX_MS = 2 * SERVE_HANDOFF_SPACING_BASE_MS (BACKSTOP) and clamp handoffSpacingMs to
       it, so pressure can at most double the wait (W1-T13303 kept 2 h as the intent; 3.7 h was observed).
  falsifier: |
    Return silently on a pending wait: criterion 1 fails. Re-ask per absorbed ask: criterion 2 fails. Drop the clamp:
    criterion 3 fails. Clamp at the base: criterion 4 fails.
