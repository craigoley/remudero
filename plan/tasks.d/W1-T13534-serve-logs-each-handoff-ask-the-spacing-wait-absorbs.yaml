      proof: "grep: W1-T13534 criterion 1 in test/console-api/serve/serve-logs-each-handoff-ask-the-spacing-wait-absorbs.test.ts"
    - claim: "When the wait ends, the one re-ask still runs exactly one handoff, as before"
