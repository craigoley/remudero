  falsifier: |
    Keep the proof-discrimination prompt and the plan-amendment writer for an untrailered PR: the body is never
    rewritten, and the first test fails.
    Leave planRepairCapable true for a taskless PR: the blocker owner reads plan-repair, and the second test fails.
    Keep W1-T1110's reading of every stand-down as ended: the next pass dispatches again at the same head, and the
    third test fails.
    Key the hold or the rung's priorDesign reuse on the head alone: the repaired body is held, or stood down with no
    worker, and the fourth test fails.
    Regression guards, kept by the same file:
    - A trailered PR's capped proof still goes to the plan-amendment route (live since #13397; dead before it).
    - A same-round `proof_amendment.requested` refusal row does not release the hold.
    - A new head releases every hold.
    - A live in-flight rung is still deduped.
    - A handed_off stand-down is still a live wait.
    - A stand-down row without the new fields keeps today's re-dispatch.
