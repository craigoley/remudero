  design: |
    No fixed bounds. A repair is re-dispatched when, and only when, something it read has changed.
    1. A TASKLESS CAPPED PROOF IS A BODY REPAIR. For a PR where `carriesTaskTrailer(pr)` is false:
       - The sweep's capped route never sets the plan-repair owner. `planRepairCapable` is false for it, the blocker
         owner is the fix lane, and `planCappedRepair` / `judgeCappedRepair` never return `repair_plan_shard`.
       - The fix round renders a body variant of the `proof-discrimination` prompt. It says this PR has no task, so
         its BODY's Acceptance block is what review judges. It asks for the same PROOF_AMENDMENT block (claim and
         old_proof byte-for-byte, new_proof). It says the harness, not the worker, writes the body.
       - run-task.ts validates each proposed entry through `validateProofAmendmentProposal`
         (src/lib/proof-amendment.ts), the validator `requestProofAmendment` runs: identical claim, parseable proof, a
         hit at head and a miss at the merge base through `buildBaseProofDir`, and (since #13397) no head match made of
         comment lines only. Never a second copy of those checks (amended 2026-10-21). Then
         `repairedProofsAreSafeToPush` must accept the rewritten criteria.
       - Only then is the live body rewritten through the existing body writer (`updatePrBody`), replacing those
         proof lines and nothing else. The round ledgers `fix.body_proof_repaired` with the old and new body digest.
       - It never calls `dispatchProofAmendmentWrite` for a taskless PR (since #13397 that call only records a
         `shard-not-found` refusal). A trailered PR keeps the plan-amendment route #13397 made live, unchanged.
       - A refused or empty proposal ends the round as a stand-down that records why. Item 2 then holds it.
       - The rewritten body is a new review input, so review re-runs on its own edited event as it does for any
         body edit.
    2. A STAND-DOWN RECORDS WHAT IT READ, AND THE SWEEP DOES NOT RE-DISPATCH UNTIL ONE OF THOSE THINGS CHANGES.
       - Every `fix.stood_down` row records: the head sha; the task-contract revision it worked on (as
         `fix.needs_design` already does); and, for a taskless PR, a sha256 of the PR body it read.
       - `fixRungStalledWithoutNewHead` / `fixSeedRead` read such a stand-down as `ended` (re-dispatchable) only when
         the current PR differs on one of those inputs. Otherwise it reads as a standing hold. A stand-down written
         before this field existed keeps today's reading.
       - On the first pass that finds the hold, the sweep escalates it once through W1-T10282's exact-head escalation
         route, with the stand-down's own reason. It ledgers the outcome whether delivered or not. On every later
         pass it records an acted:false stand-down that names the hold, spends no capacity and dispatches no worker.
       - A changed head, contract revision or (taskless) body releases the hold, and the next pass routes the PR
         normally.
       - runFixRung's `priorDesign` reuse in run-task.ts compares the same inputs, so a body repaired at an unchanged
         head gets a real round instead of an instant stand-down.
       - A `proof_amendment.requested` refusal row written by the same round (the #13397 hand-off) belongs to that
         round: it is neither a changed input nor a release, and the hold and the `priorDesign` reuse read through it
         (amended 2026-10-21).
       - Rows that are not stand-downs keep W1-T1110's reading: a live rung stays deduped, and a handed_off
         stand-down stays a live wait until the sweep receives it.
    3. OUT OF SCOPE, NAMED. The `rung.strike` "needs-human escalation ALREADY OPEN" stand-down (85 of the 382) is
       released by an issue closing, and stays as it is. The `sweep.repeat_escalated` row stays a ledger-only
       counter (W1-T2381).
    Tests go in test/sweep/a-stood-down-repair-is-not-re-dispatched-on-the-same-head.test.ts (or the folder
    `rmd test-place` computes). They use runSweep and runFixRung with injected deps, a ledger fixture shaped from
    #13282's rows, a fake body writer and a fake review. No real gh, worker or network.
