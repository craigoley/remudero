    DEFECT (a), MISROUTING. A taskless PR's capped proof is sent to a round that cannot repair it.
      - src/lib/sweep.ts: the capped route (W1-T3306, the block ending in the reason string above) sets
        `planProofBlockedPrs`, and `finalBlocker` reads it as `planProofUnrunnable`.
      - `planRepairCapable` is true whenever `deps.dispatchPlanOnlyRepair` is wired, so src/lib/pr-blocker.ts
        names the owner `plan-repair`, although a taskless PR has no shard to repair.
      - `planCappedRepair` / `judgeCappedRepair` (src/lib/classify.ts) return `repair_body` while
        `bodyStrikes < bodyCeiling`. Body strikes never advance, because a stand-down spends none, so the progress
        judge is never consulted.
      - The round's evidence carries `proofDiscrimination`, so FIX_MODE_RULES picks mode `proof-discrimination`.
        Its prompt (src/lib/prompt-render.ts) says "THE PLAN, NOT THIS PR'S BODY, IS WHAT A TRAILERED PR IS JUDGED
        AGAINST", "Do NOT edit the PR body's Acceptance block", and asks for a PROOF_AMENDMENT that a parent-owned
        process writes.
      - run-task.ts sends that proposal only to `dispatchProofAmendmentWrite` -> `requestProofAmendment`, which
        writes a plan shard.
      - For an untrailered PR every one of those statements is false. The sweep's reason says "repair the PR
        body", and the prompt forbids exactly that. The worker's NEEDS_DESIGN is the correct answer to the prompt
        it was given.
      - src/lib/body-repair.ts has no taskless or capped-proof path at all. Its `diagnoseBodyDefects` even reports
        `no-trailer` on every run-unfiled body. Its validators (`diagnoseUnrunnableProofs`,
        `repairedProofsAreSafeToPush`) guard only the acceptance-author-gate body write in run-task.ts.
      - sweep.ts already knows the distinction elsewhere: `carriesTaskTrailer(pr)` gates the W1-T5544 proof-repair
        route.
    DEFECT (b), NO-PROGRESS RE-DISPATCH. Nothing compares a stood-down rung's inputs with the current ones.
      - `fixRungStalledWithoutNewHead` (src/lib/sweep.ts, W1-T1110) reads any `fix.stood_down` whose outcome is not
