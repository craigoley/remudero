      - runFixRung's `priorDesign` check (run-task.ts) finds the same-head `fix.needs_design` and stands down
        before any worker runs. Every later dispatch at that head is therefore certain to stand down: a futile
        dispatch, by construction.
      - The sweep's `designHandoff` hold (from #13318) only refreshes on a changed task-contract revision, and
        otherwise falls through to dispatch. A taskless PR has no contract revision.
      - `repeat_streak` / `sweep.repeat_escalated` cannot stop this. By W1-T2381 the row "IS THE WHOLE OUTPUT — no
        deps.escalate() call", and it counts dispositions; it is not a dispatch gate.
      - For a taskless PR the input that can change at an unchanged head is the BODY. Both the sweep hold and the
        rung's `priorDesign` reuse are keyed on the head alone, so a repaired body at the same head would be held
        forever.
