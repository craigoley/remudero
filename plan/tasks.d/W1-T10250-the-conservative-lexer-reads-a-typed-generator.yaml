  design: |
    1. `scanSource` conservative mode accepts a TypeScript return-type annotation between a generator's parameter
       list and its body brace (declaration, expression and `async function*` forms), scanning it as type text: no
       regex literal and no `yield` can start there, and `<`/`>`/`{`/`}` nesting inside the type is tracked so an
       object type does not open the body. Plain functions are unchanged.
    2. Inside a generator body, a control keyword (`if`, `while`, `for`, `with`, `switch`, `catch`) followed by `(`
       is a statement head as anywhere else. Keep refusing only what is really ambiguous there: the existing
       `yield`-then-slash cases and the cases the corpus test's own assertions name (`await / liveCall() /g;`,
       `if (ready) {} /\`/.test(value);`) must still throw `lexical context unknown`.
    3. Legacy (non-conservative) output stays byte-identical: the corpus test's five legacy comparisons per file
       must still be zero mismatches.
    4. OPERATOR DECISION (do not decide it in the build): whether the corpus test then REFUSES any src/**/*.ts
       unknown instead of printing it. Proposed: yes, since a silent unknown in src/ costs every PR touching that
       file a full fallback. If ruled no, leave that test's assertions unchanged and drop it from the diff.
    5. TESTS in test/ci/suites/a-typed-generator-is-lexed-not-refused.test.ts (folder from `rmd test-place` on a stub
       importing test-impact-map.ts and affected-suites.ts; re-run it on the real file), `test(` titles verbatim as in
       the proofs. Drive `changedSymbols` with a one-hunk diff inside a typed generator, using an in-memory readFile.
