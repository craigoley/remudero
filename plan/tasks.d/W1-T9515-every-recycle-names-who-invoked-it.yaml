  design: |
    Operator rulings: no fixed threshold; automated flow; a hand action is evidence, never refused.
    1. THE CALLER NAMES ITSELF. Each automated invoker passes `RMD_RECYCLE_CALLER`. `watchdog_recycle` passes
       `watchdog:<who>` (progress-watchdog and each other rung), deployer.ts's recycle backend passes `deploy-tick`, and
       sre-runbooks.ts passes `sre-runbook:<runbook>`. It is a label, not a secret.
    2. THE SCRIPT RECORDS ITS ACTOR. recycle-container.sh gathers the facts W1-T7839's `gatherActorEvidence` reads
       (OS user, host, container id, stdin/stdout tty, SSH_CONNECTION client and pty, agent env markers, the parent
       process chain, REMUDERO_SESSION_ID as a claim) and writes them as an `actor_evidence` object in the same
       `ActorEvidence` shape, so `readActorEvidence`, `pauseActor` and `pauseDetail` read it unchanged. Its
       `caller_class` follows the same rule; a test pins the shell and TypeScript classifiers to agree on the same
       inputs. The PAUSE body gains `caller` and `actor_evidence`. `reason` and the W1-T9409 fields are unchanged,
       because W1-T5127, W1-T5804 and release-orphan-recycle-pause.sh key on them.
    3. A ROW FOR EVERY INVOCATION. Before it pulls or pauses anything, the script appends `recycle.invoked`
       {caller, actor_evidence, pid, writer_start, container, instance, verdict} to the ledger it already writes. A
       run that refuses or exits early still leaves the row.
    4. A RECYCLE WITH NO KNOWN CALLER IS SURFACED. With `RMD_RECYCLE_CALLER` unset, the row's caller is
       `unattributed`. operator-interventions.ts reads a `recycle.invoked` with no automated caller as a control
       intervention (`hand-recycle:<caller_class>`), with the cause read from the ledger as for a `fleet.pause`.
       Because W1-T8264 already reports interventions, the fleet sees each hand recycle and who ran it.
    Tests (new file, `test(` titles verbatim as in the proofs below) run recycle-container.sh with the stub `docker`
    the W1-T9409/W1-T5281 tests use and read its PAUSE body and ledger row. They drive the launcher's
    `watchdog_recycle` and deployer.ts's recycle backend to check the variable they pass, and they drive
    operator-interventions.ts with an unattributed row.
