    misjudges every PR at once. Design (i) measures that trap rather than assuming it away.
    **`files:` WAS DERIVED BY INVOCATION COUNT**, measured at `044cd79`: `ghLiveState` occurs in
    `src/run-task.ts` **11** times and in no other source path — it is defined and wired there, which
    is why `src/run-task.ts` IS declared despite W1-T471's serialisation cost; the change genuinely
    lives there and there is no smaller honest declaration. `src/lib/open-prs-rest.ts` scores
    `rollupFromRest` **3** and is the existing REST-composition home the new sibling belongs beside.
    The test home is `test/open-prs-rest.test.ts` at **15** on the same symbols — the highest of any
    test path (`test/run-task.test.ts` 10, `test/drain.test.ts` 8, `test/sweep.test.ts` 5).
    **`src/lib/sweep.ts` IS DELIBERATELY NOT DECLARED** despite scoring `readLiveState` 4 and
    `post_review` 4: it consumes the injected dep and does not need to change if the substitution is
    shape-preserving, and a declared-but-untouched path fails `inverseScopeUntouchedFiles`
    (`src/lib/review.ts`) exactly as an undeclared one fails `scopeViolationFiles`. If an implementer
    concludes a deferral IS needed after all, `sweep.ts` is where it lives and **the shard must be
    amended first** rather than the path added mid-run.
    **THE ACCEPTANCE PROOFS ARE NAME-FILTERED, NOT PURE PATHS.** A pure path runs a whole suite and one
    unrelated failure fails every criterion — the shape that killed #1830 twice. Each of the four
    titles was checked to match **0** paths on `origin/main` today against a positive control (`an
    exit 0 is NEVER throttled`) matching **1**, and each is under 100 characters with no comma so
    `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them.
    EVERY FIGURE HERE IS AZURE-ONLY AND DATED 2026-08-15: the 31-of-114 loss rate, the 7.3s median,
    the 656 passes, the 23 `sweep_light.error` rows, the two-versus-three-valued state comparison, and
