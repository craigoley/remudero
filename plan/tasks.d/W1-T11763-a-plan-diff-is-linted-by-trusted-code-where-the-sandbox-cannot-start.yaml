  rationale: |
    MEASURED 2026-11-08 while PR #17406 was being fixed. The source report is an untracked local artifact and may not be in
    a worker checkout, so the evidence is restated here in full:
      - The protected pre-push / plan-emitter lint route needs Linux bwrap. On the Darwin host the sandbox probe failed,
        the lint-plan precheck read "could not run the lint — not blocking on an unreadable check", and publication went
        ahead.
      - Hosted remudero-review then found two deterministic proof errors in the PR's plan shards. These are the offline
        lint's own proof rules, so a lint run before the push would have reported them.
      - The corrected head needed one more full hosted CI cycle. That is the round trip this task removes: one CI cycle
        per plan publication from a Darwin host whose shards carry a lint finding.
    READ on this checkout (symbols, not lines):
      - hooks/pre-push: when gate_root differs from tree_root, own_tree=0 (the harness's hook pushing a worker or
        architect worktree, as PLAN-create runs do under /Users/.../worktrees). The lint-plan block then runs the
        tree's package.json `lint-plan:fast` argv through `createPrePushSandboxRunner` (src/lib/git-push.ts).
        `createPrePushSandboxRunner` throws `ProofSandboxUnavailableError` unless `probeProofSandbox`
        (src/lib/review.ts) reads mode `bwrap`. The catch prints "skipped, NOT passed (CI runs it)" and exits 2, and
        rc 2 is "not blocking". W1-T6138's design (3) chose exactly that: never run unsandboxed, never pass.
      - The same arm runs the BRANCH's lint argv. For a plan-only candidate this is not needed. The lint
        implementation is harness code, and the candidate's plan files are data to it. `lintPlanCommand`
        (src/run-task.ts) already accepts `--repo-root` / `--plan` / `--base` / `--offline`, and `lintPlanForReview`
        already launches the HARNESS's run-task entry (`childEntryArgv(repoRoot, "run-task", ...)`, cwd repoRoot) against
        a PR-head checkout as `--repo-root`. That is the trusted-installed-lint-over-data pattern this task reuses.
      - src/lib/plan-pr-emitter.ts: `runInTree` runs the TREE's scripts/lint-plan-precheck.mjs with `inTreeEnv()`, which is
        `process.env` wholesale, and `planPrPreflightAllows` logs `plan_pr.preflight_unreadable` and still allows the
        push when a check could not run (W1-T5348 design 3, which this task does not revisit for non-lint checks).
    Settled by lookup: is this already filed or already decided? -> no. W1-T4901 (merged) put the lint in the hook with
      exit 2 not blocking. W1-T5348 (merged) made an unreadable preflight check report without refusing. W1-T6138
