    THIS SHARD'S OWN PROSE IS THE SHAPE THAT TRIPS THE JUDGE, AND THAT IS DELIBERATE. It describes a
    judge misreading descriptions, which is precisely the pattern §4 shows being penalised. A
    plan-only filing is not itself judged — the judge runs inside a task's own run, after that
    task's PR exists — but the IMPLEMENTATION of this task will be, on a description that names this
    hazard. **IF IT ESCALATES ON ITS OWN DESCRIPTION, THAT IS THE ELEVENTH INSTANCE AND SHOULD BE
    RECORDED AS ONE**, not worked around by softening the text.

    THE MEASUREMENTS ARE QUERIES. Re-derive with a per-form read of `state/ledger.*.ndjson` and
