- id: W1-T3892
  title: "TURN A CONVERSATION INTO A BOUNDED PLAN — goal extraction, clarification, preview, confirmation, and undo"
  repo: remudero
  depends_on: [W1-T2499, W1-T3855, W1-T3878]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 85.00
  risk: high
  band_meaning: blast-radius
  origin: "research:instinct-automation-2026-09-20"
  plan_refs: ["§Self-improvement", "W1-T2499", "W1-T3853", "W1-T3855", "W1-T3878"]
  files:
    - src/lib/intent-plan.ts
    - src/lib/operator-agent.ts
    - src/lib/serve.ts
    - openapi/daemon.yaml
    - test/intent-plan-envelope.test.ts
    - test/intent-plan-clarification.test.ts
    - test/intent-plan-preview.test.ts
    - test/intent-plan-confirmation.test.ts
    - test/intent-plan-undo.test.ts
  status: queued
  attempts: 0
  rationale: |
    W1-T2499 proves that RMD can ask bounded clarification questions, but it intentionally fences that
    loop into onboarding. Instinct's low-friction experience starts with an outcome in an ordinary
    conversation and turns it into background work without making the user author a runbook. RMD needs
    that missing middle while keeping the authority boundary explicit.

    This task is the intent and planning layer above W1-T3855. It must not infer permission from a
    sentence, model confidence, or a remembered approval. It gives the operator a reviewable plan and
    a safe answer path before any action contract can be confirmed.

    W1-T3853 owns experiment records; this task owns the user-facing intent-to-plan boundary before an
    experiment or action can be requested.
  design: |
    Add a versioned `intent-plan-v1` envelope containing the requested outcome, constraints, known
    facts and sources, unresolved questions, proposed bounded steps, consequence class, scope, budget,
    required approval, expiry, idempotency key, preview state, confirmation state, and linked undo or
    refusal path. Reuse the bounded clarification discipline from W1-T2499 outside onboarding: research
    first, ask only unresolved questions, deduplicate them, and stop after a finite round budget.

    A preview is non-operative. Confirmation creates a linked automation action request but never
    renders success until the durable action receipt exists. Undo is a new linked action or refusal,
    never mutation of the original plan or receipt. Missing, stale, ambiguous, or over-budget intent
    remains explicitly unavailable or blocked.
  acceptance:
    - claim: "an intent plan records outcome, constraints, sources, scope, consequence, budget, approval, expiry, and idempotency metadata"
      proof: "unit test: test/intent-plan-envelope.test.ts"
    - claim: "clarification asks only unresolved questions, deduplicates them, and stops at a bounded round limit"
      proof: "unit test: test/intent-plan-clarification.test.ts"
    - claim: "a plan preview is non-operative and preserves stale, unavailable, ambiguous, and over-budget states"
      proof: "unit test: test/intent-plan-preview.test.ts"
    - claim: "confirmation creates a bounded action request but does not claim success before a durable receipt"
      proof: "unit test: test/intent-plan-confirmation.test.ts"
    - claim: "undo is a linked bounded action or refusal and never rewrites the original plan or receipt"
      proof: "unit test: test/intent-plan-undo.test.ts"
    - claim: "the operator-agent path calls the intent-plan module before requesting an executable action"
      proof: "grep: buildIntentPlan( in src/lib/operator-agent.ts"
  falsifier: |
    Treat a natural-language request as authority, ask the same question twice, ask indefinitely, execute
    from a preview, report success before a receipt, or rewrite history during undo. The corresponding
    proof must fail.
  note: "This is the missing conversation-to-plan seam; W1-T3855 remains authoritative for execution and receipts. Filing only: implementation is not claimed here."
