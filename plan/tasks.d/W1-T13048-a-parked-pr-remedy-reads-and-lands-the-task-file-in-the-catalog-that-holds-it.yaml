      proof: "grep: W1-T13048 criterion 1 in test/sweep/a-parked-pr-remedy-files-in-the-catalog-that-holds-the-task.test.ts"
    - claim: "For a task in the public plan, the effect reads and lands in the public repository, as W1-T12709 does today"
