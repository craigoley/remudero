    - src/lib/worker.ts
    - test/an-open-weight-provider-rides-the-capability-ladder.test.ts
  origin: "operator-session#open-weight-resequence-2026-09-14"
  plan_refs: ["W1-T3545", "W1-T3546", "W1-T3569"]
