    - claim: "workstreams, repositories, actions and incidents each declare inputsFingerprint over every input their bodies depend on (rows, snapshots, files and clock-derived fields), and a ledger row none of them reads leaves each declared view skipped"
      proof: "grep: W1-T11976 criterion 1 in test/console-api/read-model/a-heavy-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "For each declared view, a row or file the view does read changes its fingerprint and the next build's body equals a build made with the skip disabled, and a clock-derived field crossing its threshold with no row moving gets a build"
      proof: "grep: W1-T11976 criterion 2 in test/console-api/read-model/a-heavy-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "A view whose inputs include a source it cannot fingerprint cheaply declares nothing and builds as before, and the test names it and the input; now and host are expected to be two of them"
