  acceptance:
    - claim: "workstreams, repositories, now, host, actions and incidents each declare digestReads over the tables, snapshots or files their materialize reads, and a ledger row none of them reads leaves all six skipped"
      proof: "grep: W1-T11976 criterion 1 in test/console-api/read-model/a-heavy-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "For each of the six, a row or file the view does read changes its fingerprint and the next build's body equals a build made with the skip disabled"
      proof: "grep: W1-T11976 criterion 2 in test/console-api/read-model/a-heavy-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "A view whose inputs include a source it cannot fingerprint cheaply declares nothing and builds as before, and the test names it"
      proof: "grep: W1-T11976 criterion 3 in test/console-api/read-model/a-heavy-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
  rationale: |
    OBSERVED 2026-11-10 on the Azure host (8 cores, CPU pressure some avg300 79 percent): serve used 1.0 to 2.8 cores in 20 to 30 s samples at cpu-shares 4096 against the daemon's 512, with 3.8 GB resident. route-reads.json shows the console's last read of any view at 01:12:34Z; from 01:33Z to 04:19Z, with no reader, read_model.view_builds summed 4,385 s of build time over 9,987 s.
    - Heavy-lane build time with no reader: now 1,614 s (155 builds, 10.4 s mean, 1,456 s of it in the board stage), workstreams 431 s, repositories 275 s, host 51 s.
    - None of them declares what it reads, so none can be skipped.
  design: |
    Use the mechanism the previous task adds. For each view, fingerprint what materialize reads: for now, the board snapshot generation, the gate and feedback rows and the plan; for workstreams, the task and PR rows it derives from (it already tracks reused against derived); for repositories, the registry and telemetry snapshot. A view with an input it cannot fingerprint cheaply stays undeclared and is named in the test.
    NOT IN SCOPE: making the board stage itself incremental.
  falsifier: |
    Let an unrelated row change a fingerprint and criterion 1 must fail; miss an input and criterion 2 must fail; declare a view whose input is not fingerprinted and criterion 3 must fail. Restore and require all three to pass.
  note: |
