  status: queued
  attempts: 0
  note: |
    risk:high on BOTH of Rule 19's counts, deliberately: SPAN (src/lib, plan/, test/) and the
    atomic-coupling exit (design (vii)) — the detector, the policy rows and the NEEDS ME row prove
    ONE invariant that no subset can satisfy, the same shape W1-T250 was graded on. It is NOT
    decomposed into three untestable halves.
    budget_usd 75 — above the two sibling sensors (55 each) because this one spans five files and
    writes a ledger step, below the 100 tripwire.
    THE TEST PATH IS DECLARED IN `files:` (W1-T310); every proof above names a declared path.
    plan/policy.yaml IS DECLARED because the rows are part of the shipped invariant, not a follow-up
    — a multiplier left as a source constant is exactly the defect W1-T330 and W1-T331 had to
    correct afterwards for `dailyCostCeilingUsd`.
    A RUNNING DAEMON WILL NOT PICK UP A RETUNED MULTIPLIER MID-FLIGHT: `loadDefaultPolicy` memoizes
    for the process lifetime (policy.yaml's own `dailyCostCeilingUsd` comment). State the shipped
    values' basis in the row comments so a later reader can retune by plan PR without re-deriving.
    NO depends_on: W1-T252/W1-T253 are the substrate and are LANDED, so the loader this reads
    already exists.
    SIBLINGS FROM THE SAME FEEDBACK: W1-T929 (cache-hit ratio) and W1-T930 (turn-efficiency per
    merge). W1-T929 also declares src/lib/status-board.ts, so these two SERIALISE — correct
    partitioner behaviour on a genuinely shared file, and cheaper than two half-tasks racing it.
    THE FEEDBACK'S BATCH-LANE ASK IS REFUSED ON PLATFORM FACTS, not deferred — MASTER-PLAN §9
    amendment, same filing.
