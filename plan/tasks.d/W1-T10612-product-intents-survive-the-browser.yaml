  rationale: The operator authorized implementation, task filing and guarded Remudero builds of the Console new-product flow and mobile-first Central Park prototype, using existing public craigoley/wreckterra. Source/main and every open PR head were swept for subject overlap; no competing product-flow implementation was observed. Existing auth, nonce, admission, review and resource guards remain required.
  design: "Implement product-intent-v1: bounded idea, portfolio, decisions with provenance, research links, repository identity, objective revision, resource envelope and stage evidence. Use one core-owned durable store under the existing state root, atomic commit and optimistic revisions; no browser/localStorage authority and no new hosted database. Derive owner only from service verifiedActor; require the signed operator identity for reads and writes, never a browser owner field or shared-bearer substitute. Mount real GET /v1/products and POST /v1/products routes from serve. Unknown store, corrupt JSON, conflicts and unavailable identity remain explicit failures. Include Wreckterra as a fixture only, not a hard-coded user/product. Preserve ledger/history receipts. Bound keys, collections, text, request bytes and output; do not log source idea text or credentials."
