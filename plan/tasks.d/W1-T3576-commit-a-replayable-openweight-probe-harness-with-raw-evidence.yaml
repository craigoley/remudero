- id: W1-T3576
  title: "COMMIT A REPLAYABLE OPENWEIGHT PROBE HARNESS WITH RAW EVIDENCE — a retained aggregate cannot distinguish prompt-contract failure from model failure, so make lane-shaped A/B probes reproducible without ever persisting an Azure key"
  repo: remudero
