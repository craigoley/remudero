  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20
  risk: high
  band_meaning: span
  origin: human#2026-11-02-console-inbox-delivery
  plan_refs: [W1-T2494, W1-T2496, W1-T4471, W1-T8887, CONSOLE-T128]
  files:
    - src/lib/escalation-conversation.ts
    - src/lib/panel-actions.ts
    - src/lib/inbox-thread.ts
    - src/lib/serve.ts
    - openapi/daemon.yaml
    - packages/api-client/src/schema.d.ts
    - test/inbox/escalation-conversation.test.ts
