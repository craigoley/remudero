  acceptance:
    - claim: "The containment suite removes every settings directory it creates when the test that made it ends, and a run of the suite leaves the temp root's count of its own entries where it found it"
      proof: "grep: W1-T13191 criterion 1 in test/containment.test.ts"
    - claim: "A precheck child that completes leaves no capture directory behind, and one that is stopped or rejected leaves exactly one, retained with its reason"
      proof: "grep: W1-T13191 criterion 2 in test/ci/gates/a-run-that-ends-leaves-no-capture-directory-behind.test.ts"
    - claim: "invariant:evidence-of-a-stopped-run-is-kept — a capture retained for a stopped, rejected or custody-unknown child is never removed by this change, and no directory another process owns is touched"
      proof: "grep: W1-T13191 criterion 3 in test/ci/gates/a-run-that-ends-leaves-no-capture-directory-behind.test.ts"
  rationale: |
    COUNTED 2026-11-16 on the operator Mac and the fleet host, by the operator session and the builder of W1-T13146.

    - Before that day's reboot the Mac's temp root held 1,190 `rmd-*` / `remudero-*` entries: 506 `rmd-containment-test-*`, 450 `rmd-census-capture-*`, 63 `rmd-cow-wt-*` and others. The reboot emptied it. Seventy minutes later it held 234: 110 `rmd-containment-test-*`, 100 `rmd-census-capture-*`. So the leak runs at about three entries a minute while author preflights run.
    - The fleet host's /tmp held 140 the same day, 31 of them `rmd-census-capture-*`.
    - READ test/containment.test.ts: `settingsFile()` calls `mkdtempSync(join(tmpdir(), "rmd-containment-test-"))` on every call and nothing in the file removes the directory.
    - READ scripts/census-precheck.mjs: `runCensusChild` makes `rmd-census-capture-*` per child; a complete capture goes through `completeCensusCapture`, a failed custody read through `retainFixture`. Which of the two the 100 leftovers came from is not known.
    - Each leftover is small, but every beat measures each one (W1-T13190), and on the Mac that made one suite take 179 s and stopped four author preflights at the census bound (W1-T13146, W1-T13189).
  design: |
    MEASURE FIRST: on the Mac, list the `rmd-census-capture-*` leftovers with what each holds (a complete result, a stop, a rejection) and say which path left them; do the same for the `rmd-cow-wt-*` entries and name their producer. Put the counts in the PR body. A producer found here that is outside this task's files is reported, not changed.

    1. containment.test.ts: `settingsFile()` takes the test context and registers the directory's removal when the test ends (the shared owned-fixture helper already does this; use it rather than a second mechanism).
    2. census-precheck.mjs: a complete capture's directory is removed once its result is read; the stopped, rejected and custody-unknown cases keep theirs, as today.
    3. The new suite drives the capture path with an injected child through each of the three endings and counts the directories under a temp root of its own.
    INVARIANT evidence-of-a-stopped-run-is-kept: nothing retained on purpose is removed, and nothing is removed by name pattern across the temp root.
    NOT IN SCOPE: a reaper for old leftovers (the test setup's dead-owner reaper is the place for one; report whether its prefix list covers these names); the beat's cost (W1-T13190).
  falsifier: |
    Leave the containment directories in place and criterion 1 must fail. Keep a complete capture, or drop a stopped one, and criterion 2 must fail. Remove a retained capture, or remove by pattern across the temp root, and criterion 3 must fail. Restore and all pass.
