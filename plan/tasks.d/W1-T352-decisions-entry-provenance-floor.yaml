    is why the vocabulary is corpus-derived and pinned by tests, and why (v) requires the pass arm.
    budget_usd 65 — one floor check, corpus-derived constants, two-direction falsifier.
    BLOCKING FROM DAY ONE is this task's argued position (rationale i-iii); if review data later
    shows false positives, the demotion to advisory is a one-line severity change and the evidence
    will be in the review ledger — the reverse of shipping advisory and hoping someone remembers to
    promote it.
    OVERLAPS, cited not duplicated: W1-T32 (decision-record hygiene — WHICH auto-choices get
    recorded; shipped in part as shouldRecordDecision) governs record volume, not provenance;
    W1-T191 (blocked/retired) was the commit bridge. Neither checks authorship marks."
