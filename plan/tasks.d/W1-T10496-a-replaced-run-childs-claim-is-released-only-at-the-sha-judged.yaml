  design: |
    One concern: a proved replaced claimant's release belongs to the exact claim that was judged.
    1. Bind the anchor message and dead-claimant deletion to ONE observed holder SHA, in both synchronous
       and asynchronous wrappers. The real Git adapter must read the message of that exact SHA, not silently
       substitute a later holder. An unreadable/missing identity declines; a changed ref fails the pinned CAS.
       Existing optional anchorMessage callers remain compatible; holder/evidence arm semantics stay unchanged.
    2. Admit daemon-owned run_child mint rows through the EXISTING replaced-container proof: own-instance
       created row, anchor/mint host match, different current host, and held drain.lock acquired after the
       mint. Keep daemon support. The reason names the ACTUAL actor, anchor and proof; never say a daemon
       minted a run_child claim. The boot caller and bounded mint reader already exist and need no new layer.
    3. New tests use real bare Git remotes for adapter/drop and race controls, with explicit fixture identity.
       Insert a new live claim after death-message acquisition but before deletion, for BOTH wrappers; it
       must survive. Prove real run-child actor derivation and mint-row reading, not a holder/evidence shortcut.
       The test path is computed from the dispatch-claim import; confirm rmd test-place on the physical file.
    4. Suite-only controls retain legacy daemon release, a live same-container adopted child's claim,
       operator/worker/unknown actors, absent/unreadable/mismatched mint, post-lock mint, absent holder and
       changed-anchor CAS. No new expiry, threshold, supervisor/projection, cap or policy change.
    5. Normal current-head hosted gates, native review and protected automatic merge. Observe natural source
       adoption, a genuine future boot release and W9119 progress, then retro publication/marker advancement.
       Diagnostic success or a merged PR alone does not establish any of those runtime outcomes.
