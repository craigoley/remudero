  design: |
    Prior behavior: runFixRung owns refusal outcomes and keeps non-matching refusal prompts, commit guards, accounting,
    and push behavior on their existing paths. The recovery is additive only after a FIXED report is refused because
    the worker changed nothing. Every recovery dispatch still passes through the same rung's commit and push guards.
    The eligibility decision lives in a distinct pure helper, src/lib/fix-no-edit-recovery.ts, which fix.ts's runFixRung
    consults at its refusal arm; it is separate from W1-T7748's shouldRecheckAfterNothingChanged in
    src/lib/fix-rung-classify.ts, which did not move the cause.
    INVARIANT non-matching-refusals: commit refusals other than the exact FIXED plus "the worker changed nothing"
    case retain the existing prompt and dispatch behavior without a no-edit recovery.
    INVARIANT unchanged-recovery-guard: the single recovery dispatch remains subject to the rung's commit guard, so an
    unchanged worktree cannot be pushed and cannot trigger a second recovery dispatch.
    Each invariant has its own test file: its proving test title carries "W1-T11014 criterion 2" in
    fix-lane-no-edit-recovery-non-matching-refusals.test.ts and "W1-T11014 criterion 3" in
    fix-lane-no-edit-recovery-unchanged-guard.test.ts, so the whole-file proof is bound to its criterion.
  note: "Filed by fix-lane at rung 2; measure the cause's share of PR-hours after the build merges."
