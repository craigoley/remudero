- id: W1-T11376
  title: "A grep proof whose every match is a comment is refused where it is written, not only at review: lint-plan, rmd check-proof and the redesign Architect's edit guard apply review's comment-only rule, so no filer can emit a proof review always grades executed_stale"
  repo: remudero
  priority: 0.8
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern, the comment-only grep rule, applied across four subsystems: review owns the predicate, and lint-plan, check-proof and the redesign Architect each call it
  origin: operator-session#16652-proof-swap-2026-11-04
  plan_refs:
    - W1-T3210
    - W1-T10372
    - W1-T11190
  files:
    - src/lib/review.ts
    - src/lib/task-linter.ts
