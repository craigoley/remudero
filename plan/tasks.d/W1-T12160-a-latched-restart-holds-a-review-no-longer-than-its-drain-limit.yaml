    - claim: "When the deadline has passed, the daemon still runs and the drain of the exit has not begun, the latch admits a review again. One row records that the hold ended, with the time since the latch and what the exit still waits for"
      proof: "grep: W1-T12160 criterion 3 in test/daemon/a-latched-restart-holds-a-review-no-longer-than-its-drain-limit.test.ts"
    - claim: "A fix and a build refill stay held after the deadline, as today"
      proof: "grep: W1-T12160 criterion 4 in test/daemon/a-latched-restart-holds-a-review-no-longer-than-its-drain-limit.test.ts"
    - claim: "Once the drain of the exit has begun, the latch holds a review when the deadline has passed, as before this task"
      proof: "grep: W1-T12160 criterion 5 in test/daemon/a-latched-restart-holds-a-review-no-longer-than-its-drain-limit.test.ts"
  rationale: |
    OBSERVED 2026-11-10 in the core instance: from 12:37Z to 12:58Z the light pass admitted no review of a green pull request. Each row said "not admitted this pass: restart latched, and the review would outlast its drain".
    - That is 21 minutes. The drain deadline is the latch time plus `sweepWallClockBoundMs`, which is 559,000 ms by default, about 9 minutes.
    - `restartAdmission` in src/lib/daemon.ts refuses when the time left is not longer than the measured length of the work. After the deadline the time left is negative, so it refuses every review for as long as the process lives.
    - The hold exists so that the exit does not abandon a review (W1-T9808). Once the deadline has passed and the daemon has not exited, the hold protects nothing and green pull requests wait.
    - What kept the daemon alive past its deadline on that day is not established. This task limits the cost of that state; it does not explain it.
  design: |
    In `restartAdmission`, when `daemonClock.now()` is past `restartWindow.deadlineMs` and the kind is a review or a plan review, return true.
    Write one row the first time this happens for a latch, with the milliseconds since the latch and the phases of the work that `restartDrainInventory()` still lists.
    Keep the refusal for the kinds "fix-dispatch" and "dispatch-refill": that work is longer and costs more when the exit abandons it.
    AMENDED 2026-11-10 (hand build): keep the refusal also once the drain of the exit has begun, that is, once `drainBeforeRestart` runs for a freshness exit.
    A review admitted then gets no time: the drain gives up on it at once and tells it to stop, and the exit can cut it while it posts its verdict.
    Before the drain of the exit begins, a review admitted past the deadline is work admitted after the latch, and the drain waits one time limit for it.
    NOT IN SCOPE: why an exit can pass its deadline, the drain itself, and the wording of the stand-down rows (W1-T11156).
  falsifier: |
    Keep the refusal after the deadline and criterion 3 must fail. Admit a fix after the deadline and criterion 4 must fail. Admit a review that is longer than the time left before the deadline and criterion 2 must fail. Remove the check for the drain of the exit and criterion 5 must fail. Restore and require all five to pass.
  note: |
    A review admitted after the deadline may still be abandoned by a late exit. W1-T11928 keeps a computed verdict for the next pass, which lowers that cost.
