      proof: "grep: W1-T12160 criterion 1 in test/daemon/a-latched-restart-holds-a-review-no-longer-than-its-drain-limit.test.ts"
    - claim: "While the time left is shorter than the measured length and the deadline has not passed, the latch holds the review, as today"
