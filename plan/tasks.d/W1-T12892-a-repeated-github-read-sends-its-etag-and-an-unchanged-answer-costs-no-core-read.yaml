  rationale: |
    WHY: the fleet spends the GitHub App installation's 15,000 core reads an hour before each reset. Then
    reviews cannot start (W1-T12888 shows the stall). Many reads ask for exactly what the same process asked
    for minutes before. GitHub does not count a 304 Not Modified against the core limit.
    MEASURED on the Azure host, 2026-11-14 16:48Z to 2026-11-15 16:48Z (core, site and console ledgers):
    - daemon.quota rows: in 18 of 26 reset windows the remaining count fell to the 1,500 write reserve, and in 15
      it fell to 114 or less (12 to 0).
    SAMPLED, 2026-11-15 16:54Z to 17:03Z: every gh process on the host, read from /proc (endpoint shape, container
    and parent verb only). 1,357 calls, about 8,700 an hour. 694 of 1,271 GET calls (55%) asked for a path already
    read earlier in the same 9 minutes, about 4,400 an hour. By endpoint, per hour: paged pulls list 1,273;
    issues lists 662.
    RECHECKED for the amendment, 2026-11-18, at origin/main 1f902f383:
    - W1-T12531 (merged 2026-11-16) sends a daemon `gh api <path>` read through one in-process fetch client,
      src/lib/github-http-read.ts, after the broker and the cadence step (github-transport.ts ghHttpReadFor).
    - W1-T12839 (merged 2026-11-16) made that client conditional: a bounded ETag store keyed by credential
      identity, origin and path; a 304 returns the stored answer with the 304's rate-limit headers; a 200
      replaces it; any other answer drops it. That is the first design of this task, built on the path production
      now takes. Its NOT IN SCOPE line leaves "paginated and jq forms (still spawned)".
    - parseGhApiRead (github-http-read.ts:133) refuses --paginate, so every paged read still spawns gh and sends
      no ETag. ghTextAsync (github-transport.ts:515) never uses the in-process client at all.
    - SAMPLED 2026-11-18 11:47Z to 11:52Z (every gh process, endpoint shape and container only): 589 gh calls, 69
      of them --paginate (about 830 an hour): issue lists, issue comments and reactions (the escalation answer
      walk, src/lib/escalation-answers.ts:244 and :260, which read through ghTextAsync), and pulls/<n>/files.
      The other big group, 336 ops catalog blob GETs, is W1-T13673's; it sends through an injected executor and
      keys on content, so this task does not touch it.
    - The first design's own gh-process store (a new src/lib/github-conditional-read.ts, entries under
      github-etag/, a 304 read from gh's exit 1) would now be a second store beside W1-T12839's, on a path the
      daemon's single-page reads no longer take. This amendment drops it and extends the client that exists.
    EXPECTED SAVING: the paged reads that repeat unchanged. At the 2026-11-15 repeat share (55%) that is about
    450 of the 830 paged calls an hour, more counted pages, plus the per-issue comment reads the escalation walk
    still sends after W1-T13688. It also removes a gh process per paged read. Criterion 6 measures it.
  design: |
    INVARIANT never-a-stale-page: a stored page is returned only for a 304 that answers a request sent with that
    page's own ETag. Later pages follow the Link of the page actually returned for this read.
    INVARIANT gh-shaped-pages: callers cannot tell the in-process paged read from gh's. Parse both with the
    readers callers already use.
    INVARIANT each-page-is-a-read: every page is sent as one read: claimed from the installation budget, paced as
    the client paces one read, and recorded with its own rate-limit headers.
    INVARIANT one-credential-per-entry: unchanged from W1-T12839; the key holds the credential identity, never
    the token.
    1. In src/lib/github-http-read.ts, let parseGhApiRead accept --paginate (a field `paginate: true` on the
       request) and keep refusing --slurp, --jq, -q, --template, fields, --input and every other flag. Add the
       paged send: read page 1 conditionally, then each `rel="next"` URL from the Link header of the answer
       returned (stored or new), each one conditional with its own key, until no next link. Build the text gh
       prints for those pages, with and without -i. Before building, check gh's paged output on the host
       (`gh api -i --paginate` on a two-page read with the operator's user token, never the installation) and
       write the test's expected text from what it prints.
    2. In src/lib/github-transport.ts, claim a budget read for each page after the first inside the paged send,
       record each page's rate-limit headers, and let ghTextAsync use ghHttpReadFor under the conditions of
       criterion 5, after its broker and cadence steps, as ghStdoutAsync does.
    3. Count conditional sends and 304 answers in the client and add `conditional: {sent, not_modified}` to
       the object takeGhReadCadenceTally returns. The daemon already spreads that object into the daemon.quota
       row (src/lib/daemon.ts:8061), so daemon.ts does not change.
    4. Run test/github/compress-src-lib-github-transport-ts.test.ts and the W1-T12839 test file
       (test/github/an-unchanged-github-read-costs-none-of-the-rate-limit.test.ts); grep test/ for tests that
       expect a --paginate read to spawn gh or that assert the whole takeGhReadCadenceTally object.
       Two do: W1-T12531 criterion 5 (test/github/daemon-github-reads-share-one-in-process-client.test.ts)
       and W1-T12839 criterion 5 (test/github/an-unchanged-github-read-costs-none-of-the-rate-limit.test.ts)
       list a bare `--paginate` read among the forms that still spawn gh. In both lists, the paged form
       becomes `api --paginate --slurp <path>`, which this task leaves to gh.
    NOT IN SCOPE: --jq and --slurp forms, synchronous ghJson and ghExec callers, writes, GraphQL, the read
    broker, the ops catalog reader, and the share split.
  falsifier: |
    Keep refusing --paginate in parseGhApiRead: criteria 1 and 7 must fail. Follow the stored page 1's Link after
