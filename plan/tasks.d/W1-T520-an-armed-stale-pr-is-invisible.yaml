    overrun against a two-path declaration.
    A CAUTION FOR WHOEVER BUILDS IT: src/lib/sweep.ts changed on 2026-08-15 under W1-T513 (#1888,
    the shared review-key mutex), so re-read the module before assuming its shape.
    PROOF NOTES: all three proofs are the NAME-FILTERED `unit test:` form, never the whole-file path
    form, so each names the behaviour it proves rather than a file that would pass on any test in it.
    Each title was verified to match ZERO files today via `grep -rlF` over test/, against a control
    matching one, so every one discriminates head from base. Each is plain prose under 100 characters
