    are ONE subsystem, and the blast radius matches — one new exported predicate beside
    decideSweepArm, adding no import to any other module and changing no existing behaviour.
    FILES DERIVED BY INVOCATION: src/lib/sweep.ts is where this repo already makes a per-PR decision
    about arming, and test/sweep.test.ts is that module's existing suite; both exist today.
    src/run-task.ts is DELIBERATELY NOT DECLARED — no effect is wired, and that file serialises every
