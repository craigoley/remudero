  rationale: |
    WHY: the merge-time ratchet judge never counts fixture-copy or deps-interface when a PR lands src or test files. The population is larger than the one-read bound, so both gates read unread on every pass. A PR that crosses either ceiling merges without the judge holding it.
    MEASURED on the Azure host core ledger (live ledger plus rotated archives), 72 h to 2026-11-15T02:46Z:
    - 1,161 `sweep.ratchet_judge.decided` rows (672 clean, 347 crossing, 142 unread). 406 of them, on 55 PRs, carry "population is N bytes, past the 50331648-byte bound". The first was at 2026-11-13T21:33:39Z.
    - The populations named were 60,579,696 to 87,787,864 bytes. The test population alone is past the bound.
    - In 59 of the 406 rows the bound is the whole verdict (unread); in 347 the row also holds other gates' rows. Remedies on the 406: update-branch 323, proceed 59, unwired 20, retry-later 4. Outcomes: direct-merge-updated 220, armed 41, none 145.
    MEASURED at origin/main dec302d31 on the host: 4,674 test files (60.8 M characters) and 753 src files (26.4 M characters). countFixtureCopiesInTexts took 315 ms and depsInterfaceCounts 94 ms; reading the files took 874 ms.
    READ at origin/main 5e3cabf0b:
    - src/lib/merged-ratchet-verdict.ts:130 POPULATION_BYTES_BOUND is 48 MiB, "under the 64 MiB stdout cap of one git call" (planSafetyGitSync and planSafetyGitAsync, src/lib/plan-pr-merge-safety.ts:223, maxBuffer 1 << 26).
    - :448 a listing past the bound sets populationUnread, and populationTexts (:213) then returns a reason for each population gate. The bound limits one git call, but the code applies it to the whole population.
    - :430 readBatch reads every path in one `git cat-file --batch` call, so a population past 64 MiB cannot be read in one call.
    - The counters are not sums over files: countFixtureCopiesInTexts keeps sets of builder names across files, and depsInterfaceCounts finds aliased seams across files. So the judge must count the whole population once; only the reads can be split.
    MEASURED again on the Azure host live ledger, 2026-11-15T07:39Z to 18:10Z: the test population alone is 61,848,086 bytes. 119 of about 210 judge verdicts carry the bound reason, on about 30 PRs: 59 unread and 61 crossing. Each of the 61 crossing rows also holds a source-size row (a gate that was read; the last at 13:01Z, before W1-T12717 stopped counting source-size), so the bound did not itself make a verdict crossing.
    RELATED: W1-T12717 (#18616, open) names this defect and leaves it out of scope ("the population bound"); it changes the same file, so this task builds after it.
  design: |
    INVARIANT same-count: the counts the judge derives from a population read in parts equal the census scripts' counts on the same tree.
    INVARIANT no-ceiling-raise: no git call returns more than POPULATION_BYTES_BOUND bytes of listed blobs, and the bound is not raised.
    INVARIANT no-clean-on-a-part: a gate whose population was not read in full is unread, never clean; W1-T12509's no-clean-without-count is kept.
    1. src/lib/merged-ratchet-verdict.ts: keep parsePopulationListing, and make it return each path's size as well as the total. Remove the whole-population bound check at :448.
    2. Split the population paths into parts whose listed sizes add up to at most POPULATION_BYTES_BOUND, in listing order. Read each part with its own `git cat-file --batch` call through the same `git` step, at main for unchanged paths (as today) and at the merged tree for landed paths. A path whose own size is past the bound makes the population unread with that path and size in the reason.
    3. Merge the parts into the same readMain/readMerged maps the judge reads today, then count once. No change to judgeMergedRatchets, the counters or any baseline.
    4. A failed part makes the population unread with that part's verb, status and stderr (the `failed` helper), as a failed listing does today.
    5. Tests build a clone with test/helpers/git-repo.ts whose test population is just past the bound, from a few large generated test files. Drive readMergedRatchetInputsSteps with the production planSafetyGitSync runner.
    6. The affected-reach code tree (src, scripts, bin and test) reads its extra files the same way: in parts under the bound, with one blob past the bound or a failed part making affected-reach unread with that reason. Its old whole-tree check goes too, so the W1-T12526 criterion 4 test in test/gardeners/the-merge-time-verdict-counts-learnings-reach-and-house-layout.test.ts now expects the reason that names the file.
    NOT IN SCOPE: any baseline value; POPULATION_BYTES_BOUND; the gates the judge counts (W1-T12717, W1-T12526); the remedy chosen for a crossing.
  falsifier: |
    Put the whole-population bound check back: criterion 1 must fail with unread. Count each part on its own and add the counts: criterion 2 must fail on a builder name defined in one part and used in another. Raise the bound to 128 MiB: criterion 3 must fail. Ignore a failed part: criterion 4 must fail with a clean gate. Restore, and all must pass.
