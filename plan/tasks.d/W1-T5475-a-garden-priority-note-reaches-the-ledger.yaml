- id: W1-T5475
  title: "A GARDEN PRIORITY NOTE REACHES THE LEDGER — the daemon calls `childGardenPassSpawn()` with no options, so W1-T5365's `garden.priority_degraded` note (nice or ionice refused) goes to daemon stderr and never reaches the ledger"
  repo: remudero
  depends_on: [W1-T5365]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: low
  origin: "operator session 2026-10-03: follow-up to W1-T5365 (PR #8887)"
  plan_refs: [W1-T5365]
  files: [src/run-task.ts, test/a-garden-priority-note-reaches-the-ledger.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    W1-T5365 (PR #8887, open at filing) gives `childGardenPassSpawn` (src/lib/garden-registry.ts) an
    optional `log`. When `nice` or `ionice` is refused, the garden child still runs at normal priority
    and logs `garden.priority_degraded`. With no `log`, the note is written as JSON to
    `process.stderr`. The daemon builds its spawn in src/run-task.ts as
    `boundedGardenPassSpawn(injectedPassSpawn ?? childGardenPassSpawn(), 2)`, with no options. So on the
    one host where the note matters, it lands in container stderr, and no ledger query or board can see
    it. The daemon's ledger `log` is already in scope there: it is passed to `startGardenOffLoop` on the
    next line.
  design: |
    Pass `{ log }` to `childGardenPassSpawn` at the daemon's call site. To make that testable without
    starting the daemon, factor the expression into a small exported builder (e.g.
    `daemonGardenPassSpawn(log, injected)`) and call it from the daemon. No change to garden-registry.ts.
  acceptance:
    - claim: "the garden pass spawn built in run-task is given the ledger log, so a refused nice writes garden.priority_degraded through that log, not to stderr"
      proof: "unit test: test/a-garden-priority-note-reaches-the-ledger.test.ts"
  falsifier: |
    Build the spawn without `{ log }`. A pass whose fake `nice` is refused writes nothing to the recording
    log, and the note goes to stderr.
