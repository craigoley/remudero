    THE RECON WAS READ-ONLY BY INSTRUCTION AND BY HAZARD. Neither the suite nor any `runSweep`
    test was run; the live queue-head-versus-dispatcher comparison is the operator's measurement
    and the source analysis is this shard's.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. Queue head is the surface an operator picks work
    from, and the filter tally feeds the idle-reason panels; a mistake either hides real work or
    advertises more of what dispatch refuses.

    BOTH `src/` FILES ARE DECLARED BECAUSE THE PROMISE AND THE VOCABULARY ARE APART:
    `deriveQueueHead` is in `src/lib/status-board.ts`, and `DispatchFilterReason` with the
    `hasPushedRunBranch` consumption is in `src/lib/drain.ts`. Binding the predicate without a name
    for the exclusion would swap one silent omission for another.

    THE SUBJECT SWEEP COUNTED MATCHES PER HEAD AGAINST MAIN'S BASELINE RATHER THAN TESTING
    PRESENCE. Every branch descends from main and carries main's shards, so a presence test returns
    a hit on all 134 heads and means nothing. The baseline on main is one subject shard
    (`W1-T298-queue-starvation-escalates`), and no head exceeded it — so no in-flight sibling
    exists.

