      proof: "unit test: test/queue-head-dispatch-parity.test.ts"
    - claim: "a task excluded by a pushed run branch is named on the surface rather than omitted"
      proof: "unit test: test/queue-head-dispatch-parity.test.ts"
    - claim: "the surface distinguishes what dispatch will take from what it is refusing"
      proof: "unit test: test/queue-head-dispatch-parity.test.ts"
    - claim: "the pushed-run-branch exclusion is a named dispatch filter reason rather than a ledger row alone"
      proof: "unit test: test/queue-head-dispatch-parity.test.ts"
    - claim: "the recoverable-class census keeps its existing membership unchanged"
      proof: "unit test: test/queue-head-dispatch-parity.test.ts"
