  falsifier: |
    If the uncredited-build population at head is dominated by pull requests that name no task id
    anywhere, then there is no reliable signal to report and this task must be closed rather than
    implemented: reporting on the trailerless population alone would be a paperwork check, which
    design (i) refuses. The measurement is direct — re-run the split of merged src-touching PRs
    into those naming an id in prose and those naming none, and if the naming share falls below
    half, the premise has gone.
