    Route both reads through the existing async union readers (same options: step filter,
    refuseIncomplete, candidate early-exit), awaited where the sweep already awaits; keep every
    fail-closed outcome (an incomplete union still throws its named error, a candidate scan that runs out
    of budget still counts unknown). No new reader is written.
