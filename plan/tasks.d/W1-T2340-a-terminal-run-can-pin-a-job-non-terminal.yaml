- id: W1-T2340
  title: "A TERMINAL RUN CAN PIN A JOB NON-TERMINAL, AND A CHECK-RUNS READER CANNOT SEE IT — W1-T2327's criterion 1 was written on a job-count premise that measurement falsified, so this task carries the corrected discriminator: a job whose status is non-terminal inside a run whose conclusion is terminal, joined from the run listing a check-runs read never exposes"
