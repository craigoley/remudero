- id: W1-T11776
  title: "SECURITY-MERGE-POLICY RE-EVALUATES WHEN THE TRUSTED EXACT-HEAD CODEQL CHECK ARRIVES AFTER ITS WORKFLOW COMPLETED, AND STAYS FAIL-CLOSED UNTIL THEN — the producer reobserves only `security-analysis-pending` with trustedCodeqlCount > 0. A completion that sees no trusted CodeQL check yet (trusted-exact-head-codeql-result-missing, PR #17416: checkCount 48, trustedCodeqlCount 0) publishes error once, and nothing re-runs the policy when the check later passes"
  repo: remudero
  depends_on: [W1-T10976]
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern (when the trusted producer re-observes); the classifier, permissions and publication guards are unchanged
  band_meaning: span
  origin: architect
  plan_refs: [W1-T10976, W1-T11750]
  files:
    - scripts/security-merge-producer.mjs
    - src/lib/code-scanning-merge-adapter.mjs
    - .github/workflows/security-merge-policy.yml
    - test/security-merge-producer.test.ts
    - test/code-scanning-merge-adapter.test.ts
  status: queued
  priority: 2
  attempts: 0
  acceptance:
    - claim: "after a verified CodeQL workflow completion whose observation has zero CodeQL-named checks of any identity at the exact head, the producer reobserves within the existing three 60 s waits and can publish success once the trusted check completes clean; an untrusted CodeQL-named check, a failed or running workflow, head or base drift, and an exhausted window all stay error, and exhaustion publishes the distinct reason trusted-codeql-result-absent-after-completion"
      proof: "unit test: W1-T11776: an absent trusted CodeQL result reobserves until it appears"
    - claim: "a completed check_run event re-runs the policy only for a CodeQL check from the trusted github-advanced-security identity at an open PR's exact head, and every other check_run is refused without a read or a status write"
      proof: "unit test: W1-T11776: a trusted CodeQL check_run publishes only for its exact head"
    - claim: "the observation receipt counts CodeQL-named checks of any identity apart from trusted ones, and a complete corpus with none reads 0 while a foreign-app CodeQL check reads 1"
      proof: "unit test: W1-T11776 criterion 3 counts untrusted CodeQL names separately"
    - claim: "the trusted producer workflow subscribes to completed check runs"
      proof: "grep: check_run: in .github/workflows/security-merge-policy.yml"
    - claim: "the exhausted absent-result case has its own named reason"
      proof: "grep: trusted-codeql-result-absent-after-completion in scripts/security-merge-producer.mjs"
  rationale: |
    ORIGIN: the operator's 2026-11-08 follow-up from the PR #17211 recovery and run W1-T11750, item (3).
    OBSERVED by the operator on PR #17416 (https://github.com/craigoley/remudero/pull/17416): the exact-head
    security-merge-policy ran before trusted CodeQL finished, observed checkCount 48 and trustedCodeqlCount 0, and
    published unknown/error. CodeQL later passed, and the status stayed red until the policy was re-run by hand.
    READ in this worktree:
    - src/lib/code-scanning-merge-policy.mjs returns unknown('trusted-exact-head-codeql-result-missing') when no
      trusted CodeQL check exists at the head, and unknown('security-analysis-pending') only when one exists and is
      not completed.
    - scripts/security-merge-producer.mjs reobserves after a completed/success CodeQL workflow_run only when
      `decision.reason === 'security-analysis-pending' && observation.trustedCodeqlCount > 0`. The zero-count result
      therefore gets no wait, and the run ends with error.
    - .github/workflows/security-merge-policy.yml triggers on pull_request_target, workflow_run (CodeQL, Semgrep
      runtime compatibility), merge_group and workflow_dispatch. Nothing fires when the CodeQL check run itself
      completes.
    - test/security-merge-producer.test.ts 'security completion reobservation excludes ... untrusted analysis
      identities' requires that an untrusted CodeQL-named check never waits. The extension below keeps that.
    Settled by lookup: is this already filed or already decided? -> Not this shape. W1-T10976 (queued, verify human)
    recovers a completed NEUTRAL '1 configuration not found' check and says "Preserve the pending-check recovery".
    It does not admit a zero-trusted-check observation and adds no trigger. W1-T10134 and W1-T10248 were retired.
    W1-T10474 is a retired hand-fix count (plan/tasks.d/W1-T10976-*, W1-T10474-*).
    Settled by lookup: does an open PR already do this? -> No. None of the 12 open PRs on 2026-11-08 touches the
    producer or its workflow (https://github.com/craigoley/remudero/pulls).
    Settled by lookup: can upload or workflow completion prove the check exists? -> No. SARIF upload and processing
    are separate, and processing finishes after the upload returns
    (https://docs.github.com/en/code-security/reference/code-scanning/codeql/codeql-cli-manual/github-upload-results,
    cited by W1-T10976). So a completion can precede the trusted check.
    Settled by lookup: is there an event for the check's own completion? -> Yes. check_run with activity type
    `completed` triggers a workflow only from the default branch's workflow file. It does not trigger when the check
    suite was created by GitHub Actions or its head SHA is associated with GitHub Actions
    (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#check_run).
    The producer's own Actions checks therefore cannot recurse. Whether the github-advanced-security CodeQL check
    delivers for a PR head is the falsifier's post-merge observation, not an assumption.
    OVERLAP: W1-T10976 declares the same producer, adapter, workflow and both test files. This task depends on
    W1-T10976 so the dispatcher cannot start a conflicting worker: W1-T10976 lands first, then this task adds the
    absent-result wake while preserving its single shared three-wait budget.
  design: |
    1. ADMIT THE ABSENT RESULT. In the CodeQL workflow_run completed/success branch, also reobserve a published
       result whose reason is `trusted-exact-head-codeql-result-missing` when the observation has checksComplete
       true and NO check named 'CodeQL' of any app at that head. codeqlObservation
       (src/lib/code-scanning-merge-adapter.mjs) gains `codeqlNamedCount`, the number of exact-head checks named
       CodeQL whatever their app. It is a diagnostic receipt beside trustedCodeqlCount, and the classifier still
       decides alone. Any CodeQL-named check with a foreign identity stays as today: no wait, error. Use the same loop, the same three 60 s waits and the same
       publishSecurityMergeDecision call, so every head, base, file and check guard re-runs on each observation.
    2. NAME EXHAUSTION. If the last observation is still the absent result, publish error with description
       `unknown: trusted-codeql-result-absent-after-completion`. It is never pending or success. The step-3 trigger
       is the wake.
    3. RE-EVALUATE WHEN THE CHECK EXISTS. Add `check_run: types: [completed]` to the workflow. A job-level `if:`
       skips any check_run whose name is not CodeQL or whose app slug is not github-advanced-security, so no runner
       is spent on other checks. In runSecurityMergeProducer, accept eventName 'check_run' only when check_run.name
       is 'CodeQL', app.slug is 'github-advanced-security', app.id is 57789, app.owner.login is 'github', status is
       completed, and head_sha is 40 hex. Then associate open PRs through the same bounded commits/<sha>/pulls read
       and exact-head filter as workflow_run, and publish through the same classifier. Anything else throws
       'unsupported security producer event' before any read. Permissions, the trusted-main checkout,
       persist-credentials:false and timeout-minutes:5 are unchanged, and no permission is added.
    4. TESTS (extend the existing file). `test("W1-T11776: an absent trusted CodeQL result reobserves until it appears", ...)`
       covers a zero-trusted-check completion that becomes a clean trusted check on wait 2, publishes error then
       success, and ends with the named reason if the result stays absent for all three waits. An untrusted
       CodeQL-named check still never waits. Drift during a wait writes no success.
       `test("W1-T11776: a trusted CodeQL check_run publishes only for its exact head", ...)` covers a trusted
       completed check_run publishing success at its head. A check_run from another app, another name, a
       non-completed status or a malformed sha is refused with zero reads and zero writes. In
       `test/code-scanning-merge-adapter.test.ts`, add
       `test("W1-T11776 criterion 3 counts untrusted CodeQL names separately", ...)` for the diagnostic count. The workflow test asserts the check_run
       trigger and that the permissions block is unchanged.
    NOT IN SCOPE: the classifier's safe/blocked rules, W1-T10976's neutral-configuration recovery, merge_group
    handling, required-check settings, and any status write outside the exact head.
  falsifier: |
    At origin/main, a completion fixture whose first observation has zero trusted CodeQL checks, and whose second
    has a clean trusted check, records zero waits and one error write, so the first test fails. If a foreign-app
    CodeQL-named check makes the producer wait or publish success, the trust filter is broken. If no
    check_run-triggered producer run appears for a trusted CodeQL completion at an open PR head after merge, the
    trigger is inert on this repository. Step 1 then remains the only re-evaluation, and the task reopens for a
    different wake. Red must never be turned green without one.
