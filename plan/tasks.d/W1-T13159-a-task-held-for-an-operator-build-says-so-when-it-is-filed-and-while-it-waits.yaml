  rationale: |
    FOUND 2026-11-16 by the operator session, asking why W1-T9310 (queued, priority 2, no dependencies, filed 2026-10-13) had never been dispatched.

    - READ src/lib/drain.ts on origin/main: `isDispatchEligible` declines any task for which `workflowPaths(t).length > 0`, as "operator-build" (W1-T5351, #8826): the fleet App has no workflows permission and cannot push such a change. W1-T9310 declares `.github/workflows/ci.yml`, so it has been ineligible on every tick since it was filed.
    - Nothing told anyone. No filing lint mentions a workflow path (`workflowPaths` and W1-T5351 appear in no lint). `operatorBuildRoutedLogger` writes `dispatch.operator_build_routed`, but only `runDrain` and `runDrainLanes` wire it; the daemon's dispatch options do not. In the daemon the decline is counted only in the idle-reasons tally, written on idle ticks, whose buckets name at most eight ids.
    - MEASURED in the core ledger, read-only: over 2026-11-14 to 2026-11-16 the only rows naming W1-T9310 are 10 `measurement_cadence.ran` rows.
    - COUNTED on origin/main with `git grep` over plan/tasks.d: 51 queued records declare a path under .github/workflows/. 15 of them are `verify: auto` and so meet this hold with nothing else in the way: W1-T2874, W1-T8946, W1-T9310, W1-T9396, W1-T9870, W1-T9878, W1-T10560, W1-T10751, W1-T10756, W1-T10951, W1-T11003, W1-T11164, W1-T11776, W1-T12415 and W1-T12505. Three are priority 1 to 1.3.
    - Some no longer need the workflow edit at all: the ci.yml change W1-T9310 names landed in #11506 on 2026-10-14, and the task has waited a month for an edit that was already made.
    - The hold is right: a workflow change can rewrite the gates and reach secrets, and granting the App that permission is an operator decision this task does not take.
  design: |
    1. task-linter.ts: a diff-scoped finding on a new or changed record whose `files:` holds a workflow path: "<path> is a workflow file: the fleet cannot push it (W1-T5351), so this task waits for an operator build. Split the workflow edit into its own task, or declare `operator_build: true`." A record with `operator_build: true` passes. Warning severity; it never refuses a filing.
    2. daemon.ts: the dispatch options wire `operatorBuildRoutedLogger`, keyed by task and contract revision so a row is written once per revision, not once per tick.
    3. status-board.ts: one section, OPERATOR BUILDS, fed by the same filter tally, with id, priority, paths and filing age for every held task. READ on origin/main: today the reason text ("edits a .github/workflows/ file the fleet App cannot push — needs an operator build") exists in the queue-head refusal table and in panel-graph.ts, so it shows only on a task that happens to sit at the queue head; a priority-2 task behind others is never listed.
    INVARIANT the-hold-itself-is-unchanged: `isDispatchEligible`'s operator-build decline is not weakened, and `operator_build: true` changes only the lint finding.
    NOT IN SCOPE: giving the fleet App workflows permission; building the fifteen held tasks; splitting existing records (report in the PR body which of the fifteen still need their workflow path, from a read of each).
  falsifier: |
    Drop the finding, or raise it for a record that declares operator_build: true, and criterion 1 must fail. Leave the daemon's options unwired, or write the row on every tick, and criterion 2 must fail. Cut the list at eight and criterion 3 must fail. Let a task with a workflow path become eligible and criterion 4 must fail. Restore and all pass.
  note: |
    reservation hand-off: run-unfiled-1794835016375 -> run-unfiled-1794835016375
