  rationale: |
    THE BRIEFING'S PREMISE WAS OVERTAKEN WHILE THIS WAS BEING FILED, AND THE CORRECTION IS THE
    FINDING. The brief describes the egress WIRING as blocked and unfiled, with W1-T1265 having
    shipped only the decision half. Re-derived at origin/main: `assessEgressContainment` reads ZERO
    in `src/lib/containment.ts`, so the decision half has not landed either — it is still an open
    PR. AND THE WIRING IS ALREADY BUILT: a count-per-head subject sweep over open PRs found #2626
    ("feat(containment): prove network containment per run with an egress arm (W1-T1265)") on
    `run-W1-T1265-1787503092377`, a SECOND lane on the same id, which changes
    `containmentProbePrompt(token)` to `containmentProbePrompt(token, allowedHost)` and rewrites the
    prompt. So "the wiring is unfiled" is not true and this task is NOT that.

    WHAT IS TRUE, AND IS UNFILED, IS THE OBSTACLE THE WIRING RAN INTO.
    `test/deny-floor-probe.test.ts` asserts `assert.match(prompt, /THREE commands/, "the prompt must
    ask for all three steps")`. #2626 replaces that prompt line with "run these FOUR commands IN"
    and does NOT touch the test file — its diff is exactly `src/lib/containment.ts` and
    `test/containment.test.ts`. SO #2626 BREAKS A SUITE OUTSIDE ITS OWN `files:`, and its `ci` job
    was still running when this was filed, which makes the claim checkable rather than rhetorical:
    if `ci` on `50d2856` goes red on that assertion, this shard's premise is demonstrated; if it
    goes green, this shard is wrong and should be closed.

    THE COUNT IS NOT THE HAZARD THE ASSERTION WAS WRITTEN FOR. It arrived in `05f980f`
    ("feat(containment): probe the deny floor per run, inside cwd where only the hook can refuse",
    #1575) — the commit that made the deny floor the THIRD step — under the block heading "The probe
    REACHES the worker". Its own message says "the prompt must ask for all three steps". THE
    CONTRACT IT PROTECTS IS THAT THE PROMPT'S NARRATED COUNT AGREES WITH THE STEPS ACTUALLY LISTED,
    which is real and worth keeping: the worker acts on the prose, so a prompt that says THREE while
    listing four will plausibly run three and silently skip one. The literal `THREE` is a proxy for
    that agreement, and the proxy breaks on every future step while the property it stands for does
    not.

    THE FALSIFIER HAS FIRED, AND IT CONFIRMS THIS SHARD RATHER THAN RETIRING IT. Measured on
    #2626 (W1-T1265, head 50d28568): the `ci` job reported `# tests 8823 / # pass 8820 / # fail 2`,
    and the retry line named both failures — "the probe prompt carries the tripwire command, so a
    spawned worker actually attempts it" and "MUTANT: the strip guards the OS-denial test, and the
    tripwire is observed inside cwd". BOTH LIVE IN `test/deny-floor-probe.test.ts`. The
    `coverage-ratchet` job (97226518545) failed on the SAME TWO TESTS at its own full-suite step, so
    the coupling cost two red required checks rather than one.

    SO THE COUPLING IS OBSERVED, NOT INFERRED: a two-file diff entirely inside its own declared
    `files:` — `[src/lib/containment.ts, test/containment.test.ts]` — broke a suite OUTSIDE it. The
    task that tripped it did nothing wrong procedurally: it swept before dispatch, stayed in span,
    and ran its declared test file, which passed. The declared-span discipline and the
    run-only-what-you-declare discipline are individually correct and together leave exactly this
    gap, which only the full suite closes.

    AND THERE IS A SECOND PIN THE SHARD DID NOT ANTICIPATE, SHARPER THAN THE FIRST. The same file
    carries a mutation-anchor uniqueness guard: it asserts
    `containmentSrc.split("stripDenyFloorLines(r.transcript)").length - 1 === 1`, with the stated
    reason "the substitution target must be UNIQUE or the mutant proves nothing". W1-T1265's first
    attempt added a second call and the count read 2. THE GUARD COUNTS OCCURRENCES IN RAW SOURCE
    TEXT, NOT PARSED CALL SITES — so after the duplicate call was removed and the code was correct,
    the count STILL read 2, because the explanatory comment written to record the fix quoted the
    literal verbatim. A comment broke a mutation guard. That is the same class as the step count and
    a harder one to see: the step count at least fails on a change to the thing it describes, while
    this fails on a change to the PROSE ABOUT that thing.

    AND THE REPAIR WAS NOT A TEST EDIT, WHICH IS THE PART THAT MATTERS FOR SCOPING THIS TASK. The
    prompt kept THREE containment commands and added the egress check as an explicit FOURTH step, so
    `/THREE commands/` still matches and the assertion's own intent — the narrated count agrees with
    the containment steps listed — is preserved rather than worked around. The duplicate call was
    dropped ON THE MERITS: `egressDenialSeen` now derives from `EGRESS_DENIAL_RE` alone, so a
    filesystem denial can no longer read as an egress denial, which that file's own doc already
    said the two patterns must never do. Both repairs landed inside the changing task's declared
    span and `test/deny-floor-probe.test.ts` was never edited.

    THAT A REPAIR EXISTED INSIDE THE SPAN IS NOT AN ARGUMENT THAT THE PIN IS FINE. It cost a full
    red CI cycle across two required checks to discover, the fix was available only because the
    egress step could be phrased as an addition rather than a renumbering, and the NEXT step added
    to that prompt may have no such phrasing available. The question this shard asks — assert the
    CONTRACT rather than the COUNT — is unchanged by the repair and is now better evidenced than
    when it was filed.

    AND A THIRD LAYER FIRED ON THE SAME PR, WHICH MAKES THIS A CLASS RATHER THAN A PAIR. After both
    repairs above landed and every check run went green on #2626, the REQUIRED COMMIT STATUS failed:
    `remudero-review: FAIL — body contradicts its own diff: claimed "No test/", actual changed
    files: test/containment.test.ts` (re-derived from the combined status on ddd9df5d, which reads
    `failure` with that one context). THE CLAIM IT FOUND WAS A QUOTATION. The PR body reported that
    `bodyContradictsDiff` had scored the commit message at 0 against a DELIBERATELY FALSE control,
    and quoted that control inline in italics as the evidence — so the detector read the quoted
    false claim as the body's own assertion about the diff.

    THE DETECTOR WAS RIGHT AND ITS NARROWNESS IS DELIBERATE — RECORDED HERE SO NOBODY PROPOSES
    WIDENING IT. `stripQuotedRegions` (`src/lib/review.ts`) blanks ONLY blockquote lines and fenced
    code blocks, and its own doc gives the reason: widening the exclusion to inline code spans
    "would let a real contradiction hide behind a single backtick — strictly worse than today's
    over-firing". The same doc names this exact failure mode with two live fixtures (#1194, #1206),
    and warns that the usual escape is worse than the problem: paraphrasing the quotation
    "silently destroys the most useful record of what went wrong". THE REPAIR WAS THEREFORE TO
    FENCE THE QUOTATION, NOT TO PARAPHRASE IT — the record stays verbatim, inside the one construct
    the function is built to ignore. Verified three ways: the stored body reproduced the failure,
    the fenced body scored zero, and an unfenced copy of the same sentence appended as a control
    still fired — so the fence does the work rather than a weakened check.

    AND A BODY FIX ALONE CLEARS NOTHING, WHICH IS PART OF THE COST. A posted verdict is never
    re-reviewed on the same sha, so the repair also required a NEW HEAD: the commit was amended to a
    fresh sha over a BYTE-IDENTICAL TREE, body first and sha second, so the sweep could not
    re-review the new head against the old body.

    SO THE CLASS, STATED ONCE FOR ALL THREE: A CHECK KEYED TO TEXT RATHER THAN TO THE CONTRACT FIRES
    ON SOMETHING SUBSTANTIVELY CORRECT. Three layers on one PR, and they fail on progressively more
    distant things: (1) the prompt's step count fails on a change to THE THING IT DESCRIBES;
    (2) the mutation-anchor uniqueness guard fails on a change to THE PROSE ABOUT that thing, since
    it counts occurrences in raw source text and a comment quoting the literal keeps the count wrong
    after the code is right; (3) the changeset-claim detector fails on A QUOTATION OF A FALSE CLAIM
    the body is reporting rather than making. ALL THREE WERE RIGHT TO FIRE GIVEN WHAT THEY MEASURE.
    NONE OF THEM MEASURED WHAT IT WAS PROTECTING. That is the whole of this shard's question, and
    with the filing observation it now rests on four data points rather than one.

    NOTHING HERE PROPOSES WEAKENING ANY OF THE THREE. Not a wider `stripQuotedRegions`, not a
    relaxed uniqueness guard, not an exemption for prompt-changing tasks. The ask is unchanged:
    assert the CONTRACT the text stands in for. And the honest limit already recorded above still
    binds — the repair stayed inside the declared span only because the egress step could be phrased
    as an addition rather than a renumbering, and the next step added to that prompt may have no
    such option.
  design: |
    (i) Q1 — WHAT THE ASSERTION PROTECTS, AND THE THREE WAYS TO KEEP IT. The property is
    NARRATION/LIST AGREEMENT, not the number three. Options, with costs:
      (a) BUMP THE LITERAL each time a step is added (THREE -> FOUR -> ...). Cheapest edit. Cost: it
          stays count-shaped, so it breaks again on the next step, and it breaks in a file the
          changing shard will again not declare — this exact failure, deferred.
      (b) ASSERT THE CONTRACT: derive the number of listed steps from the prompt itself and require
          the narrated count to match it, so the test passes for ANY count and fails only on genuine
          drift. Cost: slightly more test code, and the derivation must key on the prompt's own
          numbering rather than on a hand-maintained list, or it reintroduces the same coupling one
          level down. THIS IS THE PROPOSED FIX.
      (c) DELETE IT. REFUSED, and the reason is stated rather than assumed: it catches a worker being
          told the wrong number of steps, which is a real and silent failure — the probe would report
          on steps it never ran. Deleting it would trade a brittle guard for no guard.
    (ii) Q2 — ORDER AND SHARING, ANSWERED AGAINST WHAT #2626 ACTUALLY DID. That lane chose FOUR
    commands rather than five, so it combined the blocked attempt and the allowlisted control into
    one command or folded one into an existing step. THIS TASK TAKES NO POSITION ON THAT CHOICE and
    must not relitigate it — it is W1-T1265's to make. What this task fixes is only that whichever
    count is chosen, the assertion should not have to be edited to accommodate it. FOR THE RECORD,
    because the brief asks: separate commands with separate report slots make a PARTIAL RESULT
    legible (one slot missing is distinguishable from one slot failing), and a partial result must
    map to UNPROVEN — which the three-state verdict already does, since the control's absence leaves
    `allowedEgressSucceeded` falsy.
    (iii) Q3 — WHAT MUST NOT CHANGE. The allowlist's four domains, `failIfUnavailable`,
    `settingSources: []`, and the pinned key-set guard in `src/lib/settings.ts` all stay exactly as
    they are; this task touches a test assertion and nothing else. The three-state verdict stays
    three-state — no fourth state — and the probe continues to OBSERVE rather than enforce.
    (iv) THIS IS A SUCCESSOR, NOT AN AMENDMENT, AND THE DISTINCTION IS STANDING RULE 21's.
    `test/deny-floor-probe.test.ts` is not in W1-T1265's `files:`, and `files:` is protected
    post-merge, so the path cannot be added to that task once it lands. A separate id carrying the
    separate concern is the sanctioned route, which is what this is.
    (v) THE FALSIFIER RUNS BOTH WAYS. A prompt whose narrated count DISAGREES with its listed steps
    must fail; a prompt whose count agrees must pass AT ANY COUNT, three or four or more. A test that
    only accepted one specific number would satisfy the second only by accident and would be the
    defect restated.
  acceptance:
    - claim: "a prompt whose narrated count disagrees with its listed steps fails the assertion"
      proof: "unit test: test/deny-floor-probe.test.ts"
    - claim: "a prompt whose narrated count agrees passes regardless of how many steps there are"
      proof: "unit test: test/deny-floor-probe.test.ts"
    - claim: "the tripwire command and its report slot are still asserted by content, not by position"
      proof: "unit test: test/deny-floor-probe.test.ts"
  note: |
    risk: medium IS SET UP FRONT. RULE 19's SPAN is one stem — a single test file — and the BLAST
    RADIUS is likewise small: no source path changes, no runtime behaviour moves, and the guard
    being replaced is strengthened rather than removed. Both readings agree here, which is why the
    band is not `high`.

    `src/lib/containment.ts` IS DELIBERATELY NOT DECLARED. The prompt itself is W1-T1265's to change
    and a second lane is changing it now; this task must not race that edit. Declaring the source
    file would also make this task overlap both open W1-T1265 PRs and serialise behind them for no
    benefit — the assertion can be made count-agnostic against the CURRENT prompt and stays correct
    after either lane lands.

    THE CORRECTION W1-T1265's OWN SHARD NOW CARRIES, RESTATED SO IT IS NOT LOST AGAIN:
    `ContainmentEvidence` carries SIX fields, not four — `credentialExpired` (W1-T292) and
    `denyFloorProbeCreated` postdate the count in that shard's rationale. The two the design calls
    load-bearing, `osDenialSeen` and `insideWriteCreated`, are unchanged.

    THIS SHARD IS FALSIFIABLE BEFORE IT IS BUILT, WHICH IS UNUSUAL AND WORTH SAYING: if #2626's `ci`
    on `50d2856` passes with the prompt reading "FOUR commands" while
    `test/deny-floor-probe.test.ts` still asserts `/THREE commands/`, then the coupling this task
    describes does not exist and the task should be closed unbuilt rather than implemented.

    PROOF NOTES: all three proofs are the PURE-PATH `unit test:` form naming
    `test/deny-floor-probe.test.ts`, which this shard's own `files:` declares. That file EXISTS on
    origin/main, so these proofs execute rather than forward-referencing.
