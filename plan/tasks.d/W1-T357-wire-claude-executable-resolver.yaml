    risk:high — set by Rule 19's span (daemon, run-task), not blast radius: the slot lives in
    daemon.ts and its production caller in run-task.ts, one deliverable. Behaviorally additive
    observability; the failure directions are a wrong recorded path or today's absent record.
    budget_usd 40 — one slot, one closure, one falsifier; the census called it 'near-trivial, the
    smallest item'.
    OVERLAP, cited not duplicated: W1-T236 (queued, files src/lib/env.ts) hardens the spawned
    binary against mid-run auto-update swaps — a spawn-env concern; this task only records what
    boot resolves. The implementing PR must not drift into env.ts."
