    the stamp is written into MASTER-PLAN.md verbatim and shown by `rmd inbox`, so the operator approves it as shown.
  design: |
    1. `composeStampLine(proposalId, label, fragmentIds, clock)` builds the canonical stamp
       "- <proposalId> (<label>) — RATIFIED <YYYY-MM-DD> -> <ids>." from the proposal id, the drafting clock's UTC date
       (an injected clock, defaulting to the system clock) and the fragment's own task ids. The harness, not the model,
       writes it.
    2. The label is the model's one-line summary only: taken from the model's STAMP text (its parenthetical when it has
       one, else its prose), with every date, time, task id, proposal id, "ratified"/"RATIFIED" and "->" list removed and
       the result bounded to one short line; empty falls back to the proposal's kind. No date or id the model wrote
       survives into the stamp.
    3. The draft rung replaces the model's stamp with the composed one before `lintDraftedFragment`; `stampLineViolations`
       stays as the guard (a composed stamp always passes it). `rmd inbox` and the console show the composed stamp, so the
       operator still approves exactly what lands in MASTER-PLAN.md.
    4. The draft prompt asks only for the one-line summary (the STAMP marker stays, its content is the summary), so a
       model is never asked to format the line.
    5. Stranded drafts heal without a redraft: `classifyProposal` re-composes the stamp of a STORED draft from its
       fragment's ids before linting, so a draft held not_ready only on a draft-stamp block becomes ready on the next pass
       (the 19 live ones); drafts with other violations keep their other reasons and redraft as today.
    6. NEW-<n> placeholder ids stay legal inside the stamp (they are the fragment's ids); the console shows
       `draftedTasks[].title` instead of the stamp, which a console task covers.
