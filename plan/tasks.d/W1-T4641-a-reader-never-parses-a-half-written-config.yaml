- id: W1-T4641
  title: "A SECOND PROCESS CAN PARSE THE CONFIG WHILE THE FIRST IS STILL WRITING IT — createOrReadExclusive's EEXIST path reads the file another process just created but has not yet filled, and loadConfig throws Unexpected end of JSON input"
  repo: remudero
