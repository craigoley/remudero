- id: W1-T2510
  title: "AN UNRELATED PLAN FILING THROWS AWAY A TASK'S RECON — the artifact is keyed `(task_id, plan_sha, files_digest)` and `plan_sha` is the WHOLE plan directory, so filing any other task's shard invalidates every cached recon; a live row at 2026-08-30T18:08:35Z shows W1-T2467 discarded with its `files_digest` BYTE-IDENTICAL either side, on a day when 28 of 45 commits to main touched `plan/`"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 14.00
  files: [src/run-task.ts, test/an-unrelated-filing-keeps-a-tasks-recon.test.ts]
  origin: "operator-session#recon-cache-measurement-2026-08-30"
  plan_refs: ["W1-T2509"]
  status: queued
  attempts: 0
  rationale: |
    THE CACHE WORKS; ITS KEY IS TOO COARSE. Measured over the ledger union on 2026-08-30:
    `recon.reused` 10 against `recon.invalidated` 22, so the artifact does survive sometimes and
    "the cache never hits" would be the wrong claim. What the rows show instead is WHY it dies.
    SURFACE 1 recon.reused rows across the ledger union = 10
    SURFACE 2 recon.invalidated rows across the ledger union = 22
    SURFACE 3 of five sampled invalidations, ones whose files_digest was UNCHANGED = 2
    SURFACE 4 commits touching plan on main in one day = 28
    SURFACE 5 worker spawns a task pays = 3

    ONE ROW PROVES IT AND THE SHARE ONLY SIZES IT. At 2026-08-30T18:08:35Z, W1-T2467's recon was
    invalidated with `reason: "plan_sha"` while `prior_files_digest` and `files_digest` were the
    SAME STRING. Nothing about that task changed. The plan changed — because a different task's
    shard was filed minutes earlier. A second sampled row (W1-T2381) shows the identical shape.

    RE-DERIVE THE SHARE RATHER THAN TRUSTING THIS ONE, and note the host has no `python3`:
    `rmd ledger-grep "recon.invalidated"`, then count rows whose `prior_files_digest` equals their
    `files_digest`. Two of five is a SAMPLE taken on one day; the defect is proven by any single
    such row, the magnitude is a query, and no count of it survives the hour it was taken in.

    THE KEY SHOULD BE THE TASK'S OWN RECORD, NOT THE WHOLE DIRECTORY. MASTER-PLAN's invalidation
    sentence names "`plan_sha` or the task's declared `files:`" — the INTENT is "this task's
    definition changed", and hashing every shard in `plan/` is a proxy so loose that filing an
    unrelated task satisfies it. Hashing the task's OWN plan record honours the same sentence more
    precisely: a change to W1-T2467's shard invalidates W1-T2467's recon; a change to W1-T2505's
    does not.

    THE SOURCE ALREADY CONCEDES THE PROXY IS WEAK. Its own comment rejects keying on `head_sha`
    because "an artifact keyed on it is invalidated by the FIRST unrelated merge and essentially
    nothing survives to be reused", then records that "plan_sha is only 1.7x looser". That is an
    admission the chosen key barely escapes the failure it was chosen to avoid — and on a
    plan-heavy day it does not escape it at all.

    IT MUST STILL FAIL CLOSED, WHICH IS THE HAZARD. A recon reused when the task's definition HAS
    changed is far worse than one needlessly rebuilt: the implement worker would act on a stale
    reading of its own criteria. So a missing or unreadable plan record must invalidate, never
    reuse, and the `files_digest` half of the key is untouched.

    NOT IN SCOPE: whether recon earns its spawn at all, which is a separate question this makes
    cheaper rather than answers; the artifact's contents or TTL; and `head_sha`, already rejected
    with its reason recorded.

    THE RISK BAND IS BLAST RADIUS, NOT RULE 19's SPAN: one src stem plus a test is a narrow span,
    but a cache key that reuses too eagerly feeds a stale recon into a worker that then builds
    against it, and that failure is silent.
