    - claim: "the report never refuses a mint or a dispatch"
      proof: "unit test: W1-T533: the rare-overlap report refuses nothing"
    - claim: "the rarity threshold is policy data a fixture can move"
      proof: "unit test: W1-T533: the rarity threshold is policy data"
