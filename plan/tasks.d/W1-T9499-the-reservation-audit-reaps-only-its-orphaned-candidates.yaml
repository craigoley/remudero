  rationale: |
    MEASURED 2026-10-14 (census epoch 14:45Z) with one `git ls-remote origin 'refs/rmd-id/*' 'refs/heads/*'`
    and a fetch of every anchor into a scratch repository. Each reservation was classified against the plan
    declarations on main and in plan history, the run-<id>-* branches, the anchor's live holder branch, and
    the 17 open PRs. There are 7,130 reservations:
        shard on main ............ 3,216
        orphan (held by nothing) . 3,885
        holder branch live ...........  18
        shard in plan history only ....   8
        open run branch ...............   3
    Orphans by anchor age: 473 are 30d+, 748 are 7-30d, 2,506 are 1-7d, 139 are 2h-1d, and 19 are under 2h.
    By anchor source: 3,517 automatic, 358 legacy (no holder line), 6 hand-mint, 4 reclaimed. By producer:
    scout-garden 1,490, triage 807, host-resource-garden 512, approve 354, selector-shadow-garden 99,
    plan 62, ci-friction-garden 42, unknown 65, other 46.
    PR #11707 and W1-T9488 stop new leaks at the source. Each releases only the caller's OWN claim, and
    W1-T9488 rules out "reaping existing orphans" by name. That leaves the existing 3,885 orphans with no
    owner. Every mint seeds its floor from `ls-remote 'refs/rmd-id/*'`, so every mint lists all 7k lines.
    `--audit` (W1-T3300) already classifies each reservation as HELD, CANDIDATE or UNKNOWN, but it is
    read-only. Its CANDIDATE bar is a fixed 14 days (`RESERVATION_AUDIT_DEFAULT_AGE_DAYS`), and it reads
    each anchor with its own `git fetch`: 7,130 fetches a pass.
    OPERATOR RULING, 2026-10-14: "go with your recommendations", which approves this reaper. For this
    mechanism it overrides the CLAUDE.md doctrine line (doctrine/plan-and-task-hygiene/loser-renumbers.md:
    "reclaiming one is an operator decision"). The decision becomes a standing, evidence-based policy
    instead of a per-id call. A contested reservation still is never deleted: the leased delete below
    leaves any ref that has moved.
  design: |
    (i) `rmd next-task-id --audit --reap` runs the existing audit (`buildReservationAuditReport`,
        `classifyReservationAuditRows`) and acts ONLY on rows whose status is CANDIDATE. A HELD or UNKNOWN
        row is never touched.
    (ii) Add the anchor's live holder branch as HELD evidence. The census found 18 such reservations that
        the audit cannot see today. Read it with `reservationHolderBranch` (task-id-reservation.ts) against
        the same `ls-remote --heads` read the run-branch check makes.
    (iii) ANY UNREADABLE SURFACE MEANS SKIP. If the refs read, the heads read, the open-PR read, the
        plan-history read, or any anchor read is degraded or unknown, the pass deletes nothing. It reports
        which surface failed. A per-row UNKNOWN is never reaped either. `--offline` refuses `--reap`.
    (iv) THE AGE BAR IS DERIVED, NOT FIXED. Each pass re-measures the reserve-to-first-PR-open delay over
        the HELD rows that carry both an anchor time and a holder PR or branch, from the same anchors and
        branches the audit already reads. The bar is the LARGEST delay observed, never a quantile, so
        every late filer seen so far would have survived it. It is never below RESERVATION_PUSH_GRACE_MS,
        the bound the takeover path already uses. W1-T5279 measured p50 34 s and 168 of 171 within 2 h,
        and the 3 late ones are why the bar is the maximum. With no measured population, the pass does
        not act. The report states the bar, its basis (n, max, p50) and the population it was read from,
        and replaces the fixed 14-day default for `--reap`. `--audit` alone is unchanged.
    (v) READ THE ANCHORS WITH ONE FETCH. Fetch `refs/rmd-id/*` into a private namespace in one
        `git fetch`, then read each anchor message locally. Never one fetch per ref.
    (vi) LEASED DELETES, ONE BATCHED PUSH. Run `git push --porcelain origin --force-with-lease=<ref>:<sha>
        ... :<ref> ...`, where each sha is the one observed in THIS pass. That is the
        `src/lib/task-id-release.ts` primitive, batched, behind `assertClaimRefPushAllowed`. A ref that
        moved since the read is rejected by its own lease and survives. Split the push into more than one
        only when the refspec list would exceed the platform's argument limit.
    (vii) TRUTHFUL PER-ID INTENTS AND OUTCOMES. Git's leased push and a local ledger append are not one
        transaction. Before any --apply deletion, write and verify a pending intent for EVERY selected
        id, containing the batch identity, exact ref and observed sha, anchor message/holder line,
        eligibility evidence and the derived age bar. An intent is explicitly PENDING, never released
        or credited as a deletion. If any intent cannot be written and read back completely, delete
        nothing. Keep the existing lease and claim-ref push guards; never prewrite a released outcome.
        After the push, confirmed per-id results use the existing released/skipped outcomes. If the
        push result or a subsequent outcome write is unavailable, report UNKNOWN and return nonzero;
        the verified pending intent remains recoverable instead of claiming successful journaling.
        An unresolved batch prevents another deletion batch for that repository/state root until
        reconciliation completes. Read pending intents and outcomes through the complete compressed,
        rotated-plain and live ledger union, refusing unread/torn history under the existing bounds.
        Reconciliation freshly reads each exact ref: an absent ref may be recorded as observed absent
        with actor UNKNOWN, never attributed to this process without evidence; a moved ref survives,
        and an unchanged ref is not deleted by reconciliation. Append a truthful resolution only;
        another deletion still requires a fresh complete audit and explicit --reap --apply. Preserve
        every pending intent until it has a recorded resolution. No history eviction or new read-limit
        increase is authorized, and neither --apply nor reconciliation is added to a gardener or cron.
    (viii) DRY-RUN FIRST. `--reap` without `--apply` deletes nothing. It prints every row it would reap,
        plus the bar and its basis, and writes one `task_id.reservation_reap_planned` summary row (counts,
        bar, basis), never one per id. Only `--reap --apply` deletes. This task wires `--apply` into
        nothing automated: no gardener, cron or lane runs it. Enabling a recurring reap is a separate
        operator step.
    NOT IN SCOPE: changing when or how lanes reserve, or releasing a lane's own unused ids (W1-T9488,
    PR #11707). Never a pattern delete.
