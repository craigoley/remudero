      proof: 'grep: test("a reap deletes only candidate reservations past the bar in one leased push" in test/the-reservation-audit-reaps-only-its-orphaned-candidates.test.ts'
    - claim: "a reap with any unreadable surface deletes nothing and names the surface"
      proof: 'grep: test("a reap with any unreadable surface deletes nothing" in test/the-reservation-audit-reaps-only-its-orphaned-candidates.test.ts'
    - claim: "the reap's age bar is the largest measured reserve-to-PR delay, never below the push grace, and the report names it and its basis"
      proof: 'grep: test("the reap bar is derived from the measured reserve-to-PR delays" in test/the-reservation-audit-reaps-only-its-orphaned-candidates.test.ts'
    - claim: "a reservation whose anchor's holder branch is live is HELD, never a candidate"
      proof: 'grep: test("a live holder branch holds a reservation" in test/the-reservation-audit-reaps-only-its-orphaned-candidates.test.ts'
    - claim: "--reap without --apply deletes nothing and writes one summary row; with --apply every selected id has a verified pending intent before deletion and a truthful confirmed or UNKNOWN outcome"
      proof: 'grep: test("a reap is a dry run unless applied, and an applied reap ledgers every id" in test/the-reservation-audit-reaps-only-its-orphaned-candidates.test.ts'
    - claim: "an intent write or readback failure prevents every deletion; a post-push outcome-write failure remains UNKNOWN with recoverable intents"
      proof: 'unit test: a reap refuses unwritten intents and preserves unknown post-push outcomes'
    - claim: "a fresh reconciliation resolves pending intents without deleting unchanged or moved refs or inventing the deleting actor"
      proof: 'unit test: pending reap intents reconcile truthfully across ledger rotation without another deletion'
  falsifier: |
    Delete the CANDIDATE filter, or let a degraded surface through. The first two tests must fail with a
    HELD, UNKNOWN or moved ref deleted from the fixture origin. Replace the derived bar with the 14-day
    default, and the bar test must fail.
    Inject an intent append/readback failure: no leased delete is attempted. Let the leased push
    succeed and fail its first outcome append: the command returns nonzero with UNKNOWN, and every
    candidate's exact anchor remains in a verified pending intent. In a fresh invocation after ledger
    rotation, reconcile absent, unchanged and moved refs without deleting any ref or attributing an
    unproven actor; unread or torn history must refuse the reconciliation and any new deletion batch.
