  rationale: "MEASURED AT 00fd676 WITH CI'S EXACT INVOCATION: lines 98.34% against a 95.62 floor,
    branches 90.27% against a 90.40 floor — BLOCKED at -0.13pts. Every PR now inherits it: #1741 and
    #1743 (plan-only) passed the same gate, then #1739 (5 files) failed at 90.18% / -0.22, and #1744
    (plan-only, ONE YAML FILE) failed at 90.21% / -0.19. A YAML diff cannot move branch coverage.
    NO AGGREGATION HOLE, AND THIS IS SETTLED. `ci-gate` FAILED at 19:17:41Z; #1739 MERGED at
    19:15:31Z — TWO MINUTES AND TEN SECONDS EARLIER. Branch protection requires exactly
    `remudero-review` and `ci-gate`, and `coverage-ratchet` aggregates into `ci-gate` correctly. A
    MERGE RACED A STILL-PENDING REQUIRED CHECK, the same shape as #1721 the same day. Do not
    re-investigate the gate stack.
    THE RATCHET IS AGGREGATE AND DENOMINATOR-SENSITIVE BY ITS OWN ADMISSION.
    `scripts/coverage-ratchet.mjs` sums LF/LH and BRF/BRH across every source file and compares two
    whole-suite percentages at epsilon 1e-9, while `scripts/diff-coverage.mjs` scores ONLY changed
    lines. SO `diff-coverage` ALREADY GUARANTEES NEW CODE IS COVERED and the aggregate ratchet
    protects a DIFFERENT property — whole-suite erosion. And `scripts/coverage-baseline.json`'s own
    `_branchFloorCorrection` note already describes today's failure mode: `THE DRIVER IS THE
    DENOMINATOR: across those four runs BRH moves by 2 (12176-12178) while BRF moves by 15
    (13439-13454)`, and a run loading fewer modules discovers fewer branches, which RAISES the ratio.
    RE-BASELINING BRANCHES WOULD BE A WEAKENING, NOT A TIGHTENING, and an earlier 90.75% reading is
    STALE — main is 90.27% today, BELOW the floor. The LINE floor is separately stale LOW (98.34 vs
    95.62, 2.72pts of slack nobody captures). DO NOT CONFLATE THE TWO DIRECTIONS.
    AND `reviewCommand` WAS ALREADY DRIVEN BEFORE #1739 — `review-rest-transport.test.ts` twice and
    `run-task.test.ts` once, both predating it. That does NOT refute the import-graph mechanism,
    because `node --test` runs each file in its OWN CHILD PROCESS, so a new file adds a FRESH set of
    discovered-but-unexecuted modules. But the mechanism is subtler than `compiled for the first
    time` and must not be restated that way."
  design: |
    (i) THE MEASUREMENT COMES FIRST AND THE REMEDY SECOND. THE DECIDING QUESTION IS UNANSWERED: ARE
    THE NEWLY-DISCOVERED BRANCHES GENUINELY UNTESTED CODE, OR ARTEFACTS OF IMPORT-TIME EVALUATION?
    They want opposite responses — cover them, or accept the denominator shift — so no option below
    may be chosen before this is answered.
    (ii) THE METHOD IS SPECIFIED BECAUSE THE OBVIOUS ONE FAILED. An attempt to diff BRF per file
    between main and #1739's parent was INVALID AND INCOHERENT: `run-task.ts` BRF fell 532 and
    `review.ts` fell 311, i.e. main DISCOVERED FEWER branches while SCORING HIGHER. TWO FAULTS — a
    CHECKOUT was compared against a WORKTREE, and only the lcov reporter was used so NEITHER RUN
    PRODUCED A `# tests` SUMMARY LINE, leaving both pass/fail sets uncaptured. Run-to-run BRF variance
    of HUNDREDS swamps the effect. THE METHOD MUST BE: the SAME TREE for both readings, the SAME
    reporter set INCLUDING `spec` so a summary line exists, pass/fail sets CAPTURED and compared, and
    REPEATED READINGS — the baseline's own note took EIGHT LOCAL READINGS before moving a floor by
    0.04pts.
    (ii-RETRACTED, 2026-08-13) THAT METHOD WAS FOLLOWED EXACTLY AND FAILED ANYWAY. Kept above rather
    than deleted, per §8A: two failed attempts with DIFFERENT faults are the most useful thing anyone
    has produced on this question, and a later session must not re-derive the protocol and repeat it.
    ATTEMPT TWO used the SAME TREE, the `spec` reporter, THREE readings a side, INTERLEAVED so drift
    hit both sides equally. It failed three ways at once:
      1. THE INSTRUMENT LOST HALF ITS WRITES. Across 16 run-attempts only 8 produced a usable lcov. In
         the first pass 5 of 6 were 0 BYTES, and every empty file's mtime equalled its run's START,
         not its end — opened at start, never written at exit. The one survivor ran in the quietest
         window (load 12.5 falling to 9.8) while the others ran at 13-19. A LOAD-DEPENDENT FLUSH RACE.
      2. SIX READINGS OF A BARELY-CHANGED TREE SPREAD WIDER THAN THE EFFECT: 87.88, 88.04, 89.89,
         89.90, 89.91, 89.94 — a 2.06pt BRANCH SPREAD against the 0.54pt effect, roughly 4x. Lines
         spread 88.17 to 98.17, TEN POINTS.
      3. THE READINGS CLUSTER BY TEST COUNT, NOT BY SHA. Every 6800-test reading scored about 89.9%;
         every 6769/6788 reading about 88%. `run-task.ts` BRF swung 2810 to 3496 across readings of
         the same nominal code.
    AND IT CONTRADICTS ITSELF IRRESOLVABLY, BOTH SIDES FROM THE SAME SIX RUNS: the test counts track
    the sha CORRECTLY (base 6769, after 6788, the base sha verified with `git cat-file` to lack
    `test/base-blob-read-failure.test.ts`), YET `src/lib/review.ts` reports LF 5841 in ALL SIX readings
    against a base file of 5702 LINES — and lines-found cannot exceed a file's length. The session
    DECLINED TO GUESS which side is wrong and so does this shard.
    THE SESSION'S OWN ERROR, NAMED: it suppressed `git checkout`'s stderr with `2>/dev/null` and never
    asserted HEAD afterwards, so it cannot cleanly say which tree each run measured. Any future
    protocol MUST assert HEAD after every checkout.
    AND THE SHAS WERE WRONG IN THE ORIGINAL FRAMING: `origin/main` moved to `2411153` mid-session, so
    comparing against `main` attributes THREE LATER PRs to #1739. THE CORRECT PAIR IS `4429ff6`
    (#1739's parent) AGAINST `00fd676` (its merge) — adjacent commits, so the diff is exactly #1739.
    (ii-b) SO THE READING MUST COME FROM CI'S OWN LOGS, NOT FROM THIS HOST. CI is uncontended, its
    runs exist in bulk, and it is the reading THE GATE ACTUALLY MAKES — the baseline's own note already
    observes CI reads higher and steadier than local. ANY FUTURE ATTEMPT MUST NOT REPEAT A LOCAL
    PROTOCOL, however carefully specified.
    (iii) FOUR OPTIONS. The first three are the obvious ones and each is costed; the fourth is the
    operator's position and is NOT ranked below them.
      (a) COVER THE NEWLY-DISCOVERED BRANCHES. Honest if they are real gaps. Cost UNKNOWN until (i)
      answers — it may be a handful or a hundred, and the failed method above could not size it.
      (b) STOP THE NEW TEST DRIVING `reviewCommand`. Cheaper call site, but a session recorded that
      the alternative FAILED `diff-coverage`, which wants that line covered, and covering it requires
      driving `reviewCommand`. THAT CONFLICT WAS NOT RE-VERIFIED, so this shard does NOT claim a third
      shape exists — establish it before relying on it.
      (c) RE-BASELINE. On BRANCHES this LOWERS a floor main sits under, which is a WEAKENING and the
      baseline forbids it in its own words. On LINES it would RAISE 95.62 toward 98.34, which is a
      tightening and a genuinely separate change.
      (d) CHANGE THE MECHANISM, NOT THE NUMBER — THE OPERATOR'S POSITION, AND IT SURVIVES EITHER
      ANSWER TO (i), WHICH IS WHY IT BELONGS HERE RATHER THAN AS AN OBVIOUS CHOICE. A static
      hand-maintained floor is fragile by construction: the number moves for reasons unrelated to test
      quality (the denominator note above), the noise band is ALREADY MEASURED at 0.0936pt, the
      current margin was sized at 1.24x it, and moving a floor by 0.04pts took EIGHT LOCAL READINGS.
      A gate needing that ceremony to adjust, which then BLOCKS PLAN-ONLY YAML EDITS when it drifts,
      is expensive to maintain and cheap to trip. THE ASYMMETRY IS THE TELL: lines carry 2.72pts of
      uncaptured slack while branches sit 0.13 BELOW and block everything.
      TWO DISTINCT SHAPES, KEPT APART BECAUSE THEY ANSWER DIFFERENT QUESTIONS:
        (d-i) A TOLERANCE BAND rather than a hard floor — fail only outside a multiple of the MEASURED
        noise band instead of at epsilon 1e-9. Uses a number this repo already derived. ESTABLISH THE
        MULTIPLE: too tight reproduces today, too loose lets genuine erosion through, and this repo has
        FIVE measured instances of a bound firing on a healthy condition.
        (d-ii) A FLOOR THAT RATCHETS ON GREEN — when a run comes in ABOVE the floor the floor moves up
        automatically, so it only ever blocks a real drop. THAT IS THE ORDINARY MEANING OF `ratchet`,
        and what exists today is a STATIC THRESHOLD MAINTAINED BY HAND: MEASURED, nothing in the repo
        writes `scripts/coverage-baseline.json` — there is NO WRITER, only readers — while the file's
        own comment instructs a human to `raise them (ratchet up) when coverage genuinely improves`.
        THE HAZARD, NAMED: an auto-advancing floor RATCHETS ON A LUCKY RUN. A run that loads fewer
        modules scores higher for denominator reasons, the floor rises on an artefact, and every
        subsequent run fails — TODAY'S DEFECT WITH THE SIGN FLIPPED. That is why (d-ii) may need
        (d-i) UNDERNEATH it rather than instead of it.
    (iv) IF (i) SAYS REAL GAPS, a tolerance band HIDES them and (a) is right. IF (i) SAYS ARTEFACTS,
    the gate is measuring noise and (d) is right. State which the finding supports before building.
    (v) WHAT THE TWICE-FAILED MEASUREMENT DOES SETTLE, AND WHAT IT LEAVES OPEN (2026-08-13).
    SETTLED — THE MECHANISM QUESTION. The gate compares a whole-tree average against a fixed number at
    `epsilon 1e-9`, the floor sits 0.13pt BELOW main, and the instrument's own spread on this host is
    ~2pt. A THRESHOLD AN ORDER OF MAGNITUDE FINER THAN ITS INSTRUMENT'S SPREAD CANNOT DISTINGUISH A
    REGRESSION FROM A RE-ROLL. That is direct evidence for option (d), and specifically for (d-i), a
    tolerance band keyed to MEASURED noise.
    AND IT RAISES THE BAND: the baseline's recorded 0.0936pt spread came from eight readings on one
    tree; this session measured 2.06pt on an equally static tree. WHATEVER MULTIPLE (d-i) PICKS MUST BE
    DERIVED FROM A FRESH SPREAD, NEVER FROM THE 0.0936pt FIGURE.
    STILL OPEN — WHETHER THE BRANCHES ARE REAL GAPS. The `deployer.ts` sample (untaken `??` and ternary
    arms inside code six test files exercise) STANDS UNREFUTED AND UNEXTENDED at n=1.
    A SEPARATE READING OVER 92 CI LOGS classified 98% as uncalled-function declaration lines and 2% as
    pure artefact. CARRIED HERE WITH ITS CI PROVENANCE AND EXPLICITLY NOT AS A LOCAL MEASUREMENT — it
    was never reproduced on this host, and nothing local in this shard corroborates it.
    THIS DOES NOT PRE-EMPT THE RULING. The four options stand unchanged and the choice between them is
    the operator's.
