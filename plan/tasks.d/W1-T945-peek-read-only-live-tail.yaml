  note: |
    risk:high is Rule 19's SPAN, and here blast radius argues UP rather than down for ONE reason: this
    is the first route that serves raw worker output over HTTP. Criteria 4, 5 and 6 exist to keep that
    honest (read-only, id-validated, capped, no new auth path). The verb itself is a file tail.
    budget_usd 80 — the tail read is trivial; the cost is the route, the follow-mode termination
    fixture and the traversal/cap falsifiers.
    depends_on W1-T942: with no `<root>/state/runs/<runId>.tail` there is nothing to read, and a peek
    verb that always prints "no tail recorded" is a shipped-unwired surface (W1-T322/W1-T323).
    SERIALISATION, STATED: src/lib/serve.ts is shared with W1-T944 and src/run-task.ts with W1-T942,
    so this task batches with neither. Both are real shared files, not a filing defect — and both are
    ordered before it by depends_on anyway.
    THE TEST PATH AND BOTH GREP PATHS ARE DECLARED IN files: (W1-T310), so the scope guard cannot
    refuse this run after the work is done.
