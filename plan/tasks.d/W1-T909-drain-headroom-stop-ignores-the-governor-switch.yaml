  note: |
    WHY A NEW TASK AND NOT THE AMENDMENT THE RULING ASKED FOR. Clause 5 says "W1-T249's acceptance gains the
    flag criterion". W1-T249 HAS SINCE SHIPPED — test/headroom-reserve.test.ts opens "These four tests are this
    task's own named acceptance proof", and `escalateHeadroomReserve` is wired in src/run-task.ts — and
    `postMergeAmendmentViolations` (src/lib/task-linter.ts, W1-T180) blocks amending a merged task's criteria.
    That is exactly the W1-T264 precedent recorded in DECISIONS.md (a residual of a merged task filed as its
    own shard rather than appended to it). So the clause-5 criterion is CARRIED HERE, against the site where it
    is actually false, instead of being written into a record no worker will ever run again.
    WHAT IS ALREADY DONE — DO NOT REBUILD IT. The flag itself (config `headroom.enabled` + env
    `RMD_HEADROOM_ENABLED` via `resolveHeadroomEnabled`), the daemon's telemetry-without-enforcement block, the
    once-per-episode reserve escalation behind the same switch, the plan/policy.yaml `headroom.enabled` row
    (default true, W1-T252/W1-T253) and the 2026-07-28 default flip are all SHIPPED. The daemon-side falsifier
    is proven in test/daemon.test.ts. This task is the drain-side remainder and nothing else.
    risk:high ON MERIT, not only on span. It changes WHEN a dispatch path stops throttling itself, and the
    failure direction is asymmetric — a wrong edit dispatches through a genuinely exhausted window on hosts
    that never opted out. The design answers that with the default (`?? true`) untouched and an explicit
    ENABLED-unchanged criterion, the same discipline W1-T259 used for the daemon. `sizingViolation` also reads
    the span as two subsystems once the test path is declared, which W1-T310 records as the standing tension —
    high is the honest band on both counts.
    files: DERIVED, NOT GUESSED. Both headroom blocks and the `DrainOpts`/`StopReason` docs are all in
    src/lib/drain.ts; the new suite is declared because W1-T310's check requires every proof path to sit inside
    the declared list. src/run-task.ts is DELIBERATELY NOT DECLARED — `drainCommand` already resolves and
    passes `opts.headroomEnabled`, so it needs no edit, and a declared-but-untouched path fails
    `inverseScopeUntouchedFiles` exactly as an undeclared one fails the scope guard. A NEW suite rather than
    test/drain.test.ts keeps the falsifier a named artifact and keeps the declared span at one src file.
    ON THE PROOFS: four whole-file `unit test:` paths, no `grep:` — a call-site grep would match at the merge
    base (`headroomEnabled` already appears in src/lib/drain.ts for the unreadable branch) and be downgraded to
    executed_stale, proving nothing about the branch that matters.
    EVERY SOURCE FACT HERE IS DATED 2026-08-16 AND IS A QUERY, NOT A CONSTANT. Re-derive before building.
