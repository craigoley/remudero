- id: W1-T11682
  title: "NO NATIVE SECONDARY-USE CONSENT OR RESOLVER EXISTS for private offline model evaluation — field-trials-consent-v1 covers only aggregate/public release, so the owner's authorized secondary use cannot be expressed or enforced"
  repo: remudero
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 30.00
  risk: high  # private data boundary: resolving inputs without a bound receipt is a disclosure
  band_meaning: blast-radius
  priority: 2
  status: queued
  attempts: 0
  origin: "feedback#fb-1794082811892-b312d0"
  plan_refs: [W1-T10831, W1-T10832]
  files:
    - src/lib/secondary-use-receipt.ts
    - src/lib/offline-eval-resolver.ts
    - src/lib/field-trials-flow.ts
    - test/secondary-use-receipt.test.ts
    - test/offline-eval-resolver.test.ts
  rationale: |
    Feedback fb-1794082811892-b312d0. The user authorized secondary use, but core has only
    field-trials-consent-v1 (aggregate-opt-in, public semantics; DECISIONS.md field-trials section,
    FIELD_TRIALS_CONSENT_VERSION in src/lib/field-trials-flow.ts). No native receipt or resolver
    contract exists. Do NOT widen field-trials-consent-v1.
  design: |
    - New versioned secondary-use receipt (separate schema and file from field-trials-consent-v1) binding:
      owner, repo/source, purpose, exact snapshot digest, exact corpus digest, allowed offline analysis,
      privacy boundary, and revocation. Any mismatch, missing field or revoked receipt refuses.
    - New resolver verifies the receipt BEFORE resolving any snapshot, analysis input or corpus, and emits
      only private digest-linked aggregate/evaluation metadata (no raw rows, ids, paths or prompts).
    - field-trials-consent-v1 behaviour and the --consent/--field-note paths stay byte-for-byte unchanged.
    - Qualification uses SYNTHETIC fixtures only. The real field-trials matrix stays NOT_RUN until an
      owner-provisioned receipt and actual snapshot, analysis input and corpus exist. Never create
      substitute private data or a stand-in receipt.
  acceptance:
    - claim: "a receipt missing or mismatching any bound field (owner, source, purpose, snapshot digest, corpus digest, analysis, privacy boundary) or revoked is refused before any input is resolved"
      proof: "unit test: test/secondary-use-receipt.test.ts"
    - claim: "the resolver emits only private digest-linked aggregate metadata from synthetic fixtures, and reports NOT_RUN when no owner receipt exists"
      proof: "unit test: test/offline-eval-resolver.test.ts"
    - claim: "field-trials-consent-v1 semantics are unchanged"
      proof: "unit test: test/field-trials-flow.test.ts"
  falsifier: |
    At base no receipt or resolver exists. Resolving before checking the receipt, accepting a digest
    mismatch, honouring a revoked receipt, or accepting field-trials-consent-v1 as secondary-use consent
    must each fail a case.
