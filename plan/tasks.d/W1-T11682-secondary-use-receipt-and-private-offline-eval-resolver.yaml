- id: W1-T11682
  title: "NO NATIVE SECONDARY-USE CONSENT OR RESOLVER EXISTS for private offline model evaluation — field-trials-consent-v1 covers only aggregate/public release, so its chat authorization cannot be treated as data-use consent"
  repo: remudero
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 30.00
  risk: high  # private data boundary: resolving inputs without verified authority is a disclosure
  band_meaning: blast-radius
  priority: 2
  status: queued
  attempts: 0
  origin: "feedback#fb-1794082811892-b312d0"
  plan_refs: [W1-T10831, W1-T10832]
  files:
    - src/lib/secondary-use-receipt.ts
    - src/lib/offline-eval-resolver.ts
    - src/lib/field-trials-flow.ts
    - test/secondary-use-receipt.test.ts
    - test/offline-eval-resolver.test.ts
  rationale: |
    Feedback fb-1794082811892-b312d0. The user authorized building a separate fail-closed path
    and synthetic-only qualification. That chat authorization is not a native data-use receipt.
    Existing field-trials-consent-v1 grants aggregate/public-release rights only; no trusted
    secondary-use authority or private resolver exists. Do NOT widen the existing consent or
    treat a structurally valid receipt, synthetic fixture, repo role, or account login as authority.
  design: |
    - Add a separate versioned receipt contract binding owner, source, purpose, exact snapshot,
      analysis-input and corpus digests, allowed offline analysis, privacy boundary, issuer and
      revocation state. Require a trusted verifier supplied by the host's existing authority;
      the receipt's fields alone never establish authority. Do not create a trust root, signing
      key, owner allowlist, sample receipt or default data path.
    - Add an explicit opt-in private offline-evaluation entrypoint that verifies native authority
      before the resolver can read any snapshot, analysis input or corpus. The production default
      has no authority/input provider and returns NOT_RUN without resolving paths.
    - The resolver emits only private digest-linked aggregate/evaluation metadata. No raw rows,
      participant identifiers, prompts, private paths, provider calls, network egress, upload,
      training, or publication. Qualification uses synthetic fixtures and injected test-only
      authorities; the receipt test must prove aggregate-only public consent is refused before
      the resolver can read any path. Test authorities must never be accepted by production.
    - Keep field-trials-consent-v1 and existing --consent/--field-note behavior unchanged. The
      public aggregate receipt cannot authorize private secondary use.
    - The real field-trials matrix remains NOT_RUN until a trusted native receipt and the exact
      owner-provisioned snapshot, analysis input and corpus are available through a secure resolver.
  acceptance:
    - claim: "missing, untrusted, mismatched, revoked, or aggregate-only authority refuses before any private input is resolved"
      proof: "unit test: test/secondary-use-receipt.test.ts"
    - claim: "without trusted authority the resolver reports NOT_RUN, and synthetic output contains only private digest-linked aggregates"
      proof: "unit test: test/offline-eval-resolver.test.ts"
    - claim: "the production flow calls the separate native secondary-use receipt verifier"
      proof: "grep: verifySecondaryUseReceipt[(] in src/lib/field-trials-flow.ts"
    - claim: "the production flow calls the private offline resolver only through the verified opt-in path"
      proof: "grep: resolvePrivateOfflineEval[(] in src/lib/field-trials-flow.ts"
  falsifier: |
    A private input read before the native verifier succeeds, acceptance of the public aggregate
    receipt, any synthetic/default authority accepted in production, a digest mismatch, revocation,
    provider/network activity, or raw/identifying output must each fail a case.
