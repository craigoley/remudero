- id: W1-T3283
  title: "A PR THAT FORGETS ITS TRAILER SPENDS A HUMAN AND A FULL CI CYCLE ON A ONE-LINE BODY EDIT — the gate names both accepted shapes, the branch name already carries the task id, and nothing joins them"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 25.00
  files: [src/lib/sweep.ts, test/a-missing-trailer-is-repairable-from-the-branch.test.ts]
  origin: "operator-session#board-drive-2026-09-09"
  plan_refs: ["W1-T1060", "W1-T3231", "W1-T2998"]
