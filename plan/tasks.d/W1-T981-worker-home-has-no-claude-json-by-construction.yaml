  note: |
    TRIAGED, NOT RELAYED. The feedback asked for recon into "what creates a worker home's .claude.json,
    what writes the backup, whether the restore is automatic, and whether the gap can widen under
    load". Three of those four are answered in the rationale from source citations and a zero-hit
    search, so this task is NOT that recon — it is the disposition of what the answers leave open. A
    worker that re-derives the race hypothesis has wasted its budget.

    depends_on W1-T505 IS DELIBERATE. It rewires the same `.claude` grant these backups travel through
    and declares the same two files, so landing this first would either conflict or pin behaviour
    W1-T505 then moves. If W1-T505 is abandoned, re-grade this to depends_on [] rather than inheriting
    its fate — nothing here needs the narrowing to be correct, only to be settled.

    risk:medium — ONE module by Rule 19's count (`moduleIdFromPath` folds `test/worker-home.test.ts`
    and `src/lib/worker-home.ts` to the same `worker-home` id). It argues UP toward high because
    `materializeWorkerHome` runs before every spawn and a mistake there is the W1-T235/W1-T505 blast
    radius; it argues DOWN because disposition (A) is a comment, a constant and a test. Medium is the
    honest middle, and a worker choosing (B) or (C) should re-grade before implementing.

    budget_usd 45.00 — below the 60 house default on purpose: the expensive half (establishing the
    mechanism) is already paid and cited above.

    `files:` DERIVED, NOT GUESSED. `WORKER_HOME_SYMLINKS`, `WORKER_HOME_RC_FILES` and
    `materializeWorkerHome` all live in `src/lib/worker-home.ts`, which is the entire mechanism;
    `test/worker-home.test.ts` is the home suite by weight (the same derivation W1-T505's note records
    against `worker-home-poisoned-slot` and `worker-home-per-run`). `src/lib/worker.ts` is NOT declared
    — its call sites at :862/:918/:1039 are cited as evidence and need no edit, and declaring an
    untouched file fails `inverseScopeUntouchedFiles`. The proofs run the WHOLE existing suite file
    rather than name titles, so they parse today and execute whatever the implementation adds.

    ONE PROOF IS A GREP AND IT NAMES A SYMBOL THAT DOES NOT EXIST YET (`CLAUDE_CONFIG_REL`, the
    sibling of the existing `CLAUDE_REL` at src/lib/worker-home.ts:187) — that is the point: it fails
    until the slot is actually named in source, which is the minimum every disposition owes.
