    SIGKILL deadline" prints the POOL DEFECT line on stderr. Each of the three new tests is red there.
    GUARDS (must stay green, unchanged): test/a-shard-cancelled-at-its-timeout-names-its-failure.test.ts
    "W1-T8038: a pool defect names its leaking and victim files in the signature" (the-leaker/the-victim log
    still signs "pool defect: test/the-leaker.test.ts leaks into test/the-victim.test.ts"), and
    test/a-deterministic-shard-timeout-is-not-re-queued.test.ts "W1-T8040: the signature names a pool defect
    and a runner failure before the ceiling".
