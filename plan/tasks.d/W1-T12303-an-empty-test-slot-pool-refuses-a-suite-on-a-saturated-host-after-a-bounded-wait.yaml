  rationale: |
    Initiative (operator, 2026-11-11). OBSERVED on the 8-vCPU Azure host: load averaged 75 to 85, and later CPU PSI some avg10 was 84 percent, while the shared test-slot directory had no live slot holder. Every suite was admitted at once. The exact claims gate then failed in nested bwrap timeouts, and the same proof-executor suite failed on unchanged origin/main. Those attempts are capacity-inconclusive, not a branch regression.
    Settled by lookup: is this already filed? -> no. W1-T12004 covers static stages only, keeps "the only holder is always admitted", and lists "the slot queue for test suites" as NOT IN SCOPE. This task depends on it, so the two do not edit test-slot.ts at the same time (plan/tasks.d/W1-T12004-*).
    Settled by lookup: where is the gap? -> cpuShort in src/lib/test-slot.ts:1573 returns undefined when holders === 0, whatever cpu.left is. At the wait bound, src/lib/test-slot.ts:2027 returns unslotted("wait_bound_exceeded") and the run goes ahead UNSLOTTED at --test-concurrency=1.
    Settled by lookup: is there an existing NOT_RUN lease shape to reuse? -> yes. executionAllowed false is already NOT_RUN and never a fallback (testSlotExecutionAllowed, src/lib/test-slot.ts:1081-1098). Every caller already refuses on it (scripts/preflight-author.mjs:673, src/lib/retro-preflight.ts:631, src/lib/worker-provider.ts:5215).
    Settled by lookup: is the fixed four-worker cap settled? -> removed. W1-T11891 removes every fixed four-worker ceiling, and its suite test/ci/a-capable-host-runs-more-than-four-author-workers.test.ts must stay green. This task adds no holder count and no worker cap.
    Settled by lookup: what orders waiters? -> the shared queue in src/lib/test-slot-queue.ts. W1-T9950 orders it by arrival and W1-T11915 by cheapest first, aged by wait. A waiter held here keeps its ticket and position.
    Settled by lookup: is the wait bound a new constant? -> no. TEST_SLOT_WAIT_BOUND_MS (src/lib/test-slot.ts:57) is reused.
  design: |
    In the measured suite path, add emptyPoolCpuShort(slot). It runs only when the pool has no other holder. It returns a reason when two things are both true: cpuAdmission computed on W1-T12301's effective cores leaves fewer than 1 worker, and at least one reading (load per usable core, CPU PSI some or full avg10, read with readReviewHostObservation) is above its calibrated line from W1-T12302.
    Any UNKNOWN reading or line counts as not above. cpuShort calls it in place of the holders === 0 early return. Every other branch is unchanged.
    While it holds, the waiter stays in the shared queue and polls as today. The test_slot.waiting and test_slot.queued rows name the CPU cause.
    At TEST_SLOT_WAIT_BOUND_MS a wait held only by emptyPoolCpuShort returns a lease with the new outcome over_capacity, executionAllowed false, and note "NOT_RUN: OVER_CAPACITY ..." naming the readings and lines. It writes a test_slot.over_capacity row and releases its ticket. It does not return wait_bound_exceeded and does not run unslotted. A wait held by other holders keeps today's wait_bound_exceeded behaviour.
    Readings are injected through the existing load and clock seams, so no host is needed.
    NOT IN SCOPE: the static stage (W1-T12004), how callers report over_capacity (W1-T12304, W1-T12305), any holder count or worker cap, and RMD_TEST_SLOTS fixed pools.
  falsifier: |
    Keep the holders === 0 early return and criterion 2 must fail. Refuse on a missing reading and criterion 3 must fail. Admit the second waiter first on recovery and criterion 4 must fail. Run UNSLOTTED at the bound and criterion 2 must fail. Restore and require all to pass.
  note: |
    Filed by PLAN-create-1794411017336 from the reserved ids, in order. Rebase onto W1-T12004 before starting: both edit src/lib/test-slot.ts.
