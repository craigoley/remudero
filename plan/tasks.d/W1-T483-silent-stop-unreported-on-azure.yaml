    `test/` — and `sizingViolation` (`src/lib/task-linter.ts`) blocks at >=2 below `high`. The band is
    Rule 19's SPAN, not blast radius: nothing here changes how the fleet restarts, only whether the
    stop is reported.
    `files:` WAS DERIVED BY INVOCATION COUNT, NOT PROSE MENTION. Measured over `test/`: `heartbeat`
    appears 12 times in `test/fleet-heartbeat.test.ts`, which is the only suite whose subject IS the
    beat — the higher raw counts elsewhere (`test/sweep-pass-heartbeat.test.ts` 23,
    `test/daemon.test.ts` 36) are a different `heartbeat` (the sweep's own pass heartbeat and the
    daemon's liveness rows), and neither drives `scripts/fleet-heartbeat.sh`. The two non-test paths
    are the script and its watcher, which are the only files that can carry the change at all.
    **NO `src/` PATH IS DECLARED AND THAT IS DELIBERATE.** The exit-code separation lives in
    `src/lib/daemon.ts` and is argued OUT of scope in design (iv); declaring it here would both trip
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) on an untouched path and pull a policy change
    into an observability task. `src/run-task.ts` is NOT declared either: it is 19,588 lines and two
    of the three currently-eligible tasks already name it, which is why only two lanes fill (W1-T471,
    via `partitionByFileOverlap` in `src/lib/dispatch-overlap.ts`).
    THIS SHARD'S OWN PATH IS DELIBERATELY NOT IN `files:` — adding it converts the `proof-scope`
    warnings into a HARD `rule15-filing` violation, measured on W1-T464.
    THE PROOFS ARE PURE-PATH FORWARD REFERENCES: the named tests do not exist yet, and a path is safe
    to forward-reference where a symbol name would be a guess.
    ONE MEASUREMENT HERE WILL GO STALE AND SHOULD BE RE-TAKEN, NOT QUOTED: `RestartCount` was 1 at
    2026-08-14T12:19:22Z against a maximum of 5. If it is climbing again, another silent stop is
    already approaching — read it, do not cite this line."
