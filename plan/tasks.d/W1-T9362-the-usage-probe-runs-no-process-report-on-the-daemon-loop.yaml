- id: W1-T9362
  title: "THE USAGE PROBE RUNS NO PROCESS REPORT ON THE DAEMON LOOP — `openUsageProbeSession` opens an SDK query with no `pathToClaudeCodeExecutable`, so on Linux the SDK calls the synchronous, uncached `process.report.getReport()` to pick a musl or glibc binary on every in-process Claude spawn's capacity read; getReport was 56 s of self time in the 2026-10-14 00:41Z stall profile"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the usage probe hands the SDK the binary spawnWorker already resolves; it runs inside the daemon process
  band_meaning: blast-radius
  origin: "operator approval 2026-10-14 (Craig approved all three stall-0048 follow-ups; item 3 asked to find what calls process.report.getReport in the daemon loop and whether it is synchronous and repeated)"
  plan_refs: [W1-T7746, W1-T9361, W1-T9114, W1-T113, W1-T9352]
  files: [src/lib/worker.ts, test/the-usage-probe-runs-no-process-report-on-the-daemon-loop.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-14 (core ledger, daemon pid 1710758; local copy of the rotated archives, Azure host read-only):
      - 00:41:30.287 `daemon.loop_stall_profile` (W1-T7746): getReport 56,189 ms of self time, second only to
        readFileUtf8, inside a profile that covered only about two 67.5 s chunks of a 504 s stall (W1-T9361).
      - The daemon spawned in-process Claude workers through the window (`worker.attempt` rows from pid 1710758 for
        RISK-JUDGE, CI-JUDGE, FEEDBACK-SUMMARY and reviews, 24 between 00:25 and 00:42).
    WHO CALLS getReport (read on origin/main b102674b1 and the installed node_modules):
      - Nothing in src/ calls `process.report`. Of the packages src/ imports at runtime (yaml, zod,
        typescript/unstable/ast, @anthropic-ai/claude-agent-sdk), only the SDK does.
      - @anthropic-ai/claude-agent-sdk sdk.mjs (0.3.293, the lockfile version; 0.3.276 the same): when `options.pathToClaudeCodeExecutable` is unset, query()
        resolves its native binary through a function whose default `preferMusl` argument returns
        false off Linux and otherwise calls `process.report.getReport()` and reads `header.glibcVersionRuntime`. Nothing
        caches it, so it runs on every such query(), synchronously on the calling thread. (detect-libc, the other
        installed caller, caches its answer and is not imported by src/.)
      - `spawnWorker` (src/lib/worker.ts) passes `pathToClaudeCodeExecutable: claudeBin` from
        `resolveClaudeExecutable(claudeExecutableCache)`, cached per process, so a worker's own query() never probes.
      - `openUsageProbeSession` (src/lib/worker.ts) builds `options` with only `settingSources` and `env`, so every
        usage probe takes the SDK's getReport path. It is reached from `readClaudeProviderCapacity` (a 60 s cache, read
        when a spawn routes its provider), from `readFreshSelectedCapacity` (`forceRefresh: true`, when a spawn
        measures its provider window), and from `readUsageSnapshotViaSdk` (src/run-task.ts).
      - getReport is a whole diagnostic report: every libuv handle, with network names resolved unless
        `process.report.excludeNetwork` is set (it is false; nothing in src/ sets it), plus shared objects and
        resource usage. On 2026-10-14 the host held 4.3 GB of swap at load 20.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and the 8 open PR heads (2026-10-14 01:28Z) for getReport,
    pathToClaudeCodeExecutable and openUsageProbeSession. Control: "getReport|pathToClaudeCodeExecutable" reads 5
    files on main (W1-T1289, W1-T2245 and a feedback record cite the spawn option; W1-T5480 rejected getReport in
    serve for this cost; W1-T9352 quotes the profile) and 4 on each head; none touches the usage probe. W1-T9114
    moves reviews to run children, which moves their probes but leaves the daemon's judges and capacity reads.
  design: |
    No threshold; the binary is already resolved once per process.
    1. `openUsageProbeSession` passes `pathToClaudeCodeExecutable` from the same `resolveClaudeExecutable` and
       `claudeExecutableCache` that `spawnWorker` uses, so the SDK never runs its libc probe for a usage probe.
    2. The context gains the same seam `spawnWorker` has (`claudeExecutable: { cache, deps }`), so a test can
       resolve without the real filesystem.
    3. A resolution failure is never a new failure: the probe opens as today (the SDK resolves its own binary), so
       a capacity read never throws where it did not before.
    4. The spawn chokepoint is unchanged: the SDK `query` import stays in src/lib/worker.ts only
       (test/spawn-guard.test.ts).
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Inject `runQuery` and capture
    the options it is called with.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/the-usage-probe-runs-no-process-report-on-the-daemon-loop.test.ts"
    - claim: "the usage probe hands the SDK the resolved claude binary"
      proof: 'grep: test("W1-T9362: the usage probe passes the resolved claude binary to the SDK" in test/the-usage-probe-runs-no-process-report-on-the-daemon-loop.test.ts'
    - claim: "the probe reuses the per-process resolution, so repeated probes resolve once"
      proof: 'grep: test("W1-T9362: repeated probes resolve the binary once" in test/the-usage-probe-runs-no-process-report-on-the-daemon-loop.test.ts'
    - claim: "a failed resolution opens the probe as before and throws nothing new"
      proof: 'grep: test("W1-T9362: a failed resolution opens the probe as before" in test/the-usage-probe-runs-no-process-report-on-the-daemon-loop.test.ts'
  falsifier: |
    Leave `options` as on main: the first test sees no pathToClaudeCodeExecutable. Resolve on every probe without
    the cache: the second test counts two resolutions. Let a resolver error escape: the third test throws.
