      (test/panel-actions.test.ts, test/a-dismissed-escalation-records-why.test.ts);
    - an unsnoozed escalation's decision is unchanged (test/now-decisions.test.ts);
    - precision still counts a snoozed row as a disposition (escalation-precision's existing suite).
    Remove each guard's production branch in turn, and its existing case must fail. Then restore it and
