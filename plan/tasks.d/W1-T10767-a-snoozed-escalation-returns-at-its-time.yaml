  falsifier: |
    At base the route calls `deps.issues.close` for `snoozed_until`, accepts any non-empty string, and
    `escalationDecisions` takes no snoozes, so each case fails as follows.
    - Keep the unconditional close: the first case's zero-close assertion fails.
    - Drop the time validation: the second case sees a 200.
    - Ignore the instant and hide a snoozed escalation forever: the at-time half of the third case fails.
    - Ignore the newer birth: the wake-early half of the third case fails.
    GUARDS that held at base and must still hold:
