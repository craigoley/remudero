  attempts: 0
  note: |
    THE FOURTH CRITERION IS ASSERTED BY TEST, NOT BY A NEGATIVE GREP. Its first draft greped for
    `DOES honour it` and required it to STOP matching, which `check-proof` grades `no-match` — test
    theatre — because a `grep:` proof must MATCH at head and MISS the base. A test that reads
    CLAUDE.md and refuses the stale claim is also the shape this repo already uses
    (`test/claude-md-rules-reach-their-scope.test.ts`), and it satisfies CLAUDE.md's own instruction
    that a rule which turns out to matter needs something that REFUSES it, not a reworded paragraph.

    THIS SHARD DECLARES CLAUDE.md AND THAT IS DELIBERATE. Rule 15's filing check refuses a plan
    record in `files:` only when an out-of-plan path rides along; CLAUDE.md is out-of-plan and no
    plan record is declared here, so the combination is clean. The doc edit is design (iii) and is
    NOT the deliverable on its own — design (i) and (ii) are, per CLAUDE.md's own instruction that
    the fix for a rule that turns out to matter is to make something refuse it.

    THE OBSERVED FAILURE IS PRE-EXISTING, VERIFIED BOTH SIDES. This test is red at merge-base
    67e6a451 and on a working branch, one failure each, in a full-suite run carrying a `# tests`
    summary on both sides — so it is not any diff's, and `ci:host-caused-suite-reds` correctly does
    not declare it, since it is a defect rather than a host fact.

    risk: high IS RULE 19'S SPAN, NOT BLAST RADIUS, AND IS SET DELIBERATELY. `sizingViolation`
    (`src/lib/task-linter.ts`) derives subsystems from `files:` AND from the acceptance text, and
    exempts only `risk: high`; this shard touches one source file plus its new suite, which the
    linter counts as 3 concerns. The change itself is small and its blast radius is narrow — the
    field records span, exactly as W1-T999's own note records it.
