  rationale: |
    FILED AS THE RULE-21 FOLLOW-UP TO A PROPOSAL THAT WAS ALREADY SATISFIED, and that framing is
    the first finding rather than a preamble. The follow-up harvest
    `followup:W1-T2478-1788108376050:2026-08-30T16:49:17.177Z:0` asked to IMPLEMENT W1-T2478 on the
    ground that the run was a recon whose deliverable was only a report. Verified at this checkout,
    the implementation is present in tracked source: `src/lib/ci-parity.ts:856-990` carries the
    W1-T2478 block, `FAST_GATE_CENSUS_BOUND_MS = 2000` at `:899`, four `boundMs`-bearing census
    entries at `:948-980`; `package.json:61-64` carries `census:bound-kind`,
    `census:catch-erasure`, `census:negative-reachability` and `census:no-shallowing`; and
    `test/fast-gate-admits-the-census-class.test.ts` exists and asserts the admission set. Ratifying
    the proposal as written would dispatch a worker to rebuild shipped work — the already-satisfied
    class W1-T229 and W1-T202 were each retired for.

    THE ONE SURFACE THAT IS STATED AND NOT SHIPPED, WHICH IS WHAT THIS TASK CLOSES. W1-T2478's own
    ratified measurement reads: census suites that walk the src population = 6; of those under the
    two-second bound = 5; combined milliseconds of those five = 5372; milliseconds of the one that
    bound excludes = 6371. The shipped set is FOUR —
    `test/fast-gate-admits-the-census-class.test.ts:66` asserts `CENSUS_STEPS.length === 4` and its
    own comment calls them "four of the six measured census suites". So TWO of the six are
    unaccounted for in any artifact a reader can open: the fifth that the ratified measurement
    placed UNDER the bound, and the sixth the bound excludes. Neither is named in `src`, in
    `package.json`, or in the test.

    THE REFUSAL IS CLAIMED AND EVIDENCED NOWHERE (standing rule 22, applied to the gate's own
    admission record). `ci-parity.ts:884-886` states, of an unnamed member: "A suite that fits shape
    (a)-(c) but fails (d) is not added here and is not exempted either — it stays out until it is
    made cheaper or its own cost is argued separately." That sentence names no suite and carries no
    number, so nobody can re-measure it, re-argue it, or notice when it becomes cheap enough to
    admit. A refusal that cannot be checked is indistinguishable from a forgotten entry, and this
    task exists because the artifact cannot presently tell those two apart.

    THE TASK'S OWN DOCTRINE IS WHAT INDICTS THIS, WHICH IS WHY IT IS A FOLLOW-UP AND NOT A
    RE-ARGUMENT. W1-T2478 required admission "decided by a stated predicate rather than an
    enumerated list", refusal "by the SAME bound rather than by an exception written for it", and a
    set "never defined by an enumerated list somebody extends later without re-measuring". Four
    names in a table with no population beside them IS an enumerated list; the predicate lives in a
    comment. And a SILENT omission is strictly worse than the written exception the task forbade —
    an exception is at least visible and arguable, where an absence is neither.

    THE CONSEQUENCE IS THE ORIGINAL DEFECT, RE-ACQUIRED ONE SUITE AT A TIME. The next author who
    writes a census-shaped suite has nothing to check membership against, so the fast gate goes
    blind to it exactly the way it was blind to `test/bound-kind-declared.test.ts` when a single
    undeclared bound-shaped constant reddened #3304 after a clean fast run. The sibling shard
    W1-T2523 (queued) reasons from "the population is enumerable from the same data the fast gate
    already keeps" — true today only of the four admitted members, false of the other two, so the
    gap propagates into work not yet built.

    HONEST LIMITS OF THIS FILING, STATED SO THE IMPLEMENTER DOES NOT INHERIT THEM AS FACTS. This
    was drafted from a read-only seat with no shell and no GitHub read, so: (i) the merged state of
    W1-T2478 is asserted from tracked-file contents at this checkout, not from a PR read; and (ii)
    the six / five / four counts are re-read from W1-T2478's ratified rationale and the shipped
    test's own assertion, NOT re-measured. The implementer RE-MEASURES rather than trusting either
    number — distrust the prompt over the installed version. If the fifth suite now measures OVER
    the bound, that is a legitimate outcome and not a failure of this task: the deliverable is that
    its refusal is NAMED and NUMBERED, never that it is admitted.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: the population and the step table sit in one
    stem, the census npm-script surface is a second and the test a third, so `files:` spans
    independent acceptance concerns and sizingViolation refuses risk:medium for the span alone —
    the same recorded regrade W1-T2478 itself carries for the same three paths.
  design: |
    ENUMERATE THE POPULATION, DERIVE THE ADMISSION. Add one exported census population beside
    `FAST_GATE_STEPS` in `src/lib/ci-parity.ts`: every suite satisfying the shipped predicate's
    clauses (a) walks the tracked src population via `git ls-files`, (b) asserts something about
    every file it walks, (c) carries a baseline or exemption table — each member carrying its own
    re-measured milliseconds and a verdict that is either ADMITTED (and therefore present in
    `FAST_GATE_STEPS` with `boundMs`) or REFUSED with a reason that is a NUMBER (measured ms
    against `FAST_GATE_CENSUS_BOUND_MS`) or a NAMED failing clause of (a)-(c).

    THE STEP TABLE BECOMES A PROJECTION, NOT A PARALLEL LIST. `FAST_GATE_STEPS`' census entries are
    derived from the population's admitted members, so the two cannot disagree and a hand-added
    census step with no population member is impossible rather than merely discouraged.

    THE DRIFT GUARD IS A CENSUS OF THE CENSUS, AND IT IS APPROXIMATE BY CONSTRUCTION. A suite in the
    tree satisfying (a)-(c) and absent from the population FAILS. The recogniser is a heuristic and
    must say so in its own words — the posture W1-T2523 records for its own derivation — so a suite
    it cannot classify is carried as UNKNOWN and reviewed, never omitted silently, which would
    rebuild the same blind spot one layer up.

    MEASURE, DO NOT COPY. Re-measure each member's own `npm run --silent <script>`-shaped
    invocation at head rather than transcribing the 2026-08-30 figures from W1-T2478's rationale;
    the numbers are a property of the tree at a moment and this task's whole complaint is about
    numbers that nobody can re-derive.

    POLARITY UNCHANGED, SAID PLAINLY BECAUSE THIS REPO KEEPS REDISCOVERING IT.
    `FAST_GATE_CENSUS_BOUND_MS` stays a PRIMARY CONTROL in W1-T1266's sense — it decides admission
    on an ordinary run, before anything has failed — and the refusal record is documentation of a
    measurement, never a backstop and never documented as one.

    NOT IN SCOPE: changing what any census suite ASSERTS; changing the value of
    `FAST_GATE_CENSUS_BOUND_MS`; `--ci-parity`, which already shells the full suite and is
    unchanged; adding a third preflight mode; and W1-T2523's changed-path-to-suite report.

    SEQUENCING FENCE, STATED SO NOTHING IS ORPHANED (standing rule 14). W1-T2523 is queued, builds
    the changed-path-to-census-suite REPORT, and declares `src/lib/ci-parity.ts` too. Whichever
    lands second READS this population rather than growing a second enumeration, and neither may
    hard-code a parallel list. Recorded as sequencing rather than a `depends_on` edge for the reason
    this plan already records twice (W1-T233, W1-T177): a hard edge onto a queued sibling strands
    independently valuable work if that sibling stalls.

    VERIFY FROM SOURCE BEFORE EDITING, DISTRUSTING THIS NOTE — line numbers drift:
    `ci-parity.ts:856-990` (the W1-T2478 block and its four entries), `:899` (the bound), the
    per-entry timing in `runPreflightFast`, `package.json`'s `census:*` scripts, and
    `test/fast-gate-admits-the-census-class.test.ts:65-66`, whose four-entry assertion this task
    must UPDATE against the derived population rather than contradict.
