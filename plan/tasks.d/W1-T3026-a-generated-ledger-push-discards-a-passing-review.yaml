- id: W1-T3026
  title: "A PASSING REVIEW IS DISCARDED BY A PUSH THAT CHANGES ONLY A GENERATED LEDGER — the verdict binds to a head sha, so re-recording a comment-load or source-size ceiling throws away a completed review: #4193 was reviewed NINE times in one day, #4236 six, #4194 five"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: high
  budget_usd: 30.00
  files: [test/a-generated-ledger-push-does-not-discard-a-review.test.ts]
  origin: "operator-session#why-are-reviews-slow-2026-09-07"
  plan_refs: ["W1-T230", "W1-T2851", "W1-T3022"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-07 from `review.posted` rows: PR #4193 was reviewed NINE times, #4236 six,
    #4194 five, #4213/#4181/#4174 three each. A `remudero-review` status is pinned to a head sha,
    so ANY push invalidates a completed verdict and the PR must be re-reviewed from scratch.

    THE PUSHES THAT CAUSE IT ARE OFTEN CONTENTLESS. The dominant class today was re-recording a
    ratchet ceiling: all four CONFLICTING PRs conflicted on `scripts/comment-load-baseline.json`
    and nothing else (W1-T3022). Resolving that conflict is a one-line edit to a generated ledger,
    and it discards a review that judged the diff's actual content.

    THE REPO ALREADY HAS THE CONCEPT. `GENERATED_LEDGER_CLASSES` (src/lib/task-linter.ts) names
    exactly this file class, and `COMPANION_PATH_CLASSES` sits beside it. So "this push changed only
    a generated ledger" is expressible with a predicate that already exists rather than a new list.

    WHY THIS IS `verify: human` AND `files:` IS EMPTY. Carrying a verdict across a head change
    weakens the guarantee W1-T230 established — that a posted review names the exact sha it judged
    — and W1-T2851 records a whole shard about a SUCCESS status certifying a body it did not judge.
    Any design here trades review freshness for throughput, and the shape of that trade is an
    operator decision, not a worker's. At least three shapes exist and they differ in blast radius:

      (a) RE-POST the existing verdict onto the new head when the diff between the two heads touches
          only generated-ledger paths. Cheapest; the verdict text is unchanged and provably about
          the same content.
      (b) RE-RUN the reviewer but seed it with the prior verdict, so the cost is a confirmation
          rather than a fresh judgement.
      (c) Do not re-record ceilings on a reviewed head at all — hold the baseline edit until merge.
          Removes the push instead of forgiving it; interacts with W1-T3022's bucket.

    A BUILD MUST NOT PICK ONE UNILATERALLY. Whichever is chosen, the invariant that must survive is
    the one W1-T230 exists for: no review may be credited to content it did not read.
  acceptance:
    - claim: "a push whose entire diff against the reviewed head lies in generated-ledger paths does not force a fresh semantic review"
      proof: "unit test: test/a-generated-ledger-push-does-not-discard-a-review.test.ts"
    - claim: "a push touching ANY non-generated path still invalidates the prior verdict, unchanged"
      proof: "unit test: test/a-generated-ledger-push-does-not-discard-a-review.test.ts"
    - claim: "whatever is posted on the new head names the content it actually judged, so W1-T230's guarantee is not weakened"
      proof: "unit test: test/a-generated-ledger-push-does-not-discard-a-review.test.ts"
  note: |
    `files:` NAMES ONLY THE TEST, mirroring W1-T2927's shape and for its stated reason: the
    implementation set depends on which of (a)/(b)/(c) the operator picks, and pre-naming source
    files would pick one. The test path must nevertheless be a MEMBER of `files:` — an earlier
    draft left `files:` empty and `lint-plan` refused it, because `judgeCriterion` grants the
    not-yet-built carve-out only for a path this task declares; without it every criterion would
    grade `executed_fail` and fail the PR that builds them. A builder adding source files beyond
    this one is a ratified widening recorded in the PR body, not a violation to work around.

    RE-DERIVE THE POPULATION BEFORE BUILDING. The nine/six/five counts are one day, and W1-T3022
    (bucketing the comment-load ceiling) should reduce the dominant cause. If the re-review counts
    have collapsed by the time this is picked up, the remaining value is much smaller and the task
    should be re-priced or closed rather than built on today's number.

    2026-09-07, BUILD PASS — THE SHARD'S OWN PRE-BUILD CONDITION FIRES. This shard instructs:
    "RE-DERIVE THE POPULATION BEFORE BUILDING ... If the re-review counts have collapsed by the time
    this is picked up, the remaining value is much smaller and the task should be re-priced or
    closed rather than built on today's number." IT HAS COLLAPSED. Recorded here rather than acted
    on, because retiring or re-pricing a shard is an operator act, not a worker's.

    MEASURED across the live ledger and all rotations, DEDUPED. Raw `review.posted` rows are 85,316
    but only 837 are distinct reviews: rotation RETAINS decision-relevant steps, so a row reappears
    in every subsequent archive and a naive count over-reports by 99.0%. The dedup key is
    (ts, pr, head_sha). CONTROL: the deduped counts reproduce this shard's own cited figures exactly
    — #4193 = 9, #4236 = 6, #4194 = 5 — which is what establishes the key is right. (Those nine fell
    on 2026-09-06, not 09-07 as the rationale says; the counts are correct, the date is off by one.)

    AGE-CONTROLLED, so a partial day cannot manufacture the result — reviews within 6h of each PR's
    FIRST review, counting only PRs whose 6h window has fully elapsed:

        cohort      PRs   mean   max   >1   >=3
        2026-09-02  152   1.26     4   34     4
        2026-09-03  108   1.23     4   19     4
        2026-09-04   94   1.40    12   20     4
        2026-09-05  120   1.15     4   15     2
        2026-09-06  124   1.31     9   20     7
        2026-09-07   39   1.05     2    2     0

    Every prior cohort contains PRs reviewed 4-12 times. The 09-07 cohort contains NONE above 2 and
    none at all with >=3. That is the predicted effect of W1-T3022 (bucketing the comment-load
    ceiling, #4406) and W1-T3015 (registering it as a regenerable artifact, #4422), which together
    removed the dominant contentless-push class this shard was filed against.

    CAVEAT, EQUAL WEIGHT: n=39 for the final cohort against ~120 for the others, and the day was
    partial when measured. Under the prior ~16% rate of PRs with >1 review, 2 of 39 is low but not
    extraordinary (binomial p is around 0.06) — so the MEAN is suggestive rather than conclusive.
    The load-bearing observation is the MAX: every earlier cohort had a PR reviewed at least four
    times and this one has none above two. One more full day would settle it.

    RECOMMENDATION: re-price toward closure rather than build. The three designs (a)/(b)/(c) all
    trade review freshness against a throughput problem whose measured size has fallen by roughly an
    order of magnitude, and (a) and (b) both weaken W1-T230's guarantee to buy it.

