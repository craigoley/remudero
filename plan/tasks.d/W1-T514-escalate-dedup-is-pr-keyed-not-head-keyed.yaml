- id: W1-T514
  title: "the sweep's escalate gate is keyed by PR NUMBER while every sibling dedup set is keyed by pr@head, so a PR that escalated once never escalates again however it breaks later — and W1-T195 built the head-aware transport dedup for this exact caller, which the upstream gate makes unreachable"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  risk: high
  principles: {tdd: strict}
  budget_usd: 35.00
  rationale: "MEASURED ON THE MINI's FULL LEDGER UNION, 2026-08-15. Corpus per form — `.gz` 666
    files, plain 4, live 1, 671 total. COVERAGE control (rows opened per form, so a form that was
    never globbed is visible rather than silent): gz 4,257,015 rows / 2,547,918 `sweep.disposed`;
    plain 64,663 / 7,827; live 13,736 / 1,157. Full-line deduped that is **16,598 distinct disposed
    lines over 773 PRs**, spanning 2026-07-17T22:02:56Z .. 2026-08-13T00:30:31Z. The rotations
    duplicate heavily, so the raw 2.5M is NOT the population and is not cited as one.

    THE DEFECT IS ONE KEY, AND ITS SIBLINGS ARE THE CONTROL. In `runSweep` (`src/lib/sweep.ts`) the
    `alreadyDone` switch keys `mergeable` on `${pr.prNumber}@${pr.headSha}`, `blocked-fixable` and
    `conflicted` on the same, `dep-review` on the same, and `post-review` on
    `${pr.taskId}@${pr.headSha}` — each with its own comment saying why a new head must RE-EARN the
    attempt. `blocked-ambiguous` alone reads `prior.escalated.has(pr.prNumber)`, with no comment
    justifying the difference, and `priorActionsFromLedger` fills it with a bare `escalated.add(pr)`.
    `prior.armed`'s own comment states the rule the escalate arm does not follow: keyed by PR number
    alone the set had NO EXPIRY, and one `acted:true` line deduped that PR forever.

    THE CONSEQUENCE, COUNTED. 214 PRs escalated at least once. **54 of them were later dispositioned
    `blocked-ambiguous` at a DIFFERENT head sha with the escalation suppressed — 468 rows.** Every
    one of those 468 carries NO `stand_down_reason`, which is the discriminator that makes them the
    DEDUP GATE rather than one of the named stand-downs beside it (the unattributable-filing arm and
    the ABSENT re-push arm both write a reason; re-running the same query with `stand_down_reason is
    None` required returns the identical 54/468, so the two sets do not overlap at all). **14 of the
    suppressed rows read `fix strikes exhausted` at the later head** — a fresh, actionable,
    ladder-exhausted block silenced by an issue opened against a sha that no longer exists.

    AND THE TRANSPORT ALREADY SOLVED THIS — THE GATE IN FRONT OF IT IS WHAT MAKES THE FIX DORMANT.
    `escalate()` (`src/lib/escalate.ts`) carries a COMPOSITE dedup key whose optional dimensions are
    `headSha` and `cause`, and its own doc names the beneficiaries verbatim: the fix rung's
    strike-exhaustion escalate and THE CLARIFICATION RUNG'S BLOCKED-AMBIGUOUS ESCALATE 'get the real
    fix W1-T195 exists for: a new push (new headSha) or a different cause on the same sha each open
    their own issue instead of being silenced by a stale one.' Because `prior.escalated` decides
    whether `escalate()` is CALLED AT ALL, and it is PR-keyed, that head dimension is never reached
    for the very caller W1-T195 cites. This is the dormancy genre W1-T488/W1-T497 and W1-T114 all
    belong to — a correct mechanism, merged and tested, that no production path can invoke.

    THE AUTHOR ALREADY NAMED THE FAILURE, IN THE FILE. The ABSENT re-push arm keeps `acted` false and
    explains why in terms: `acted:true` on a blocked-ambiguous line feeds `prior.escalated`, so
    claiming it 'would tell every later pass this PR was already escalated — and the PR would then
    never escalate at all, which is the very silent-forever failure this remedy exists to end.' That
    is a local workaround for one arm of one disposition. The permanence it works around is general.

    CONTROL THAT THE SHA-KEYED SETS REALLY DO RE-EARN, so the 54 are not an artifact of PRs simply
    never changing head: 24 PRs took a real fix dispatch at MORE THAN ONE head (`prior.fixed`,
    sha-keyed), against **1** PR ever escalated at more than one head. The `armed` set is NOT usable
    as a control here and is deliberately not cited as one — `pr.autoMergeArmed === true` (GitHub's
    observed state) short-circuits before its sha-keyed fallback is consulted, so its 0 says nothing
    about keying."
  design: |
    (i) KEY THE ESCALATE SET THE WAY EVERY SIBLING IS KEYED. `priorActionsFromLedger`
    (`src/lib/sweep.ts`) stores `${pr}@${head_sha}` for the blocked-ambiguous arm, and the
    `alreadyDone` switch reads `prior.escalated.has(`${pr.prNumber}@${pr.headSha}`)`. Both edits are
    one line each and sit beside the sibling arms they are being made to match. NOTHING ELSE IN THE
    SWITCH CHANGES.
    (ii) ADD NO NEW SIGNAL — THE CONSUMER ALREADY EXISTS AND IS THE POINT. This task wires no ledger
    step and no new field. What it does is make `escalate()`'s existing `headSha` dimension reachable
    from the sweep, so a new head opens its own issue exactly as W1-T195 designed. An implementer who
    reaches for a new step has misread the task: `daemon.tree_dirty` and `daemon.stale_code` (W1-T494,
    #1833) both fire and nothing reads either, and that is the outcome to avoid.
    (iii) THE STORM IS THE REAL RISK AND MUST BE ARGUED, NOT ASSUMED AWAY. Sha-keying means a PR that
    pushes ten times can open ten issues. Two bounds already exist to mirror rather than invent:
    `escalate()`'s own open-issue search (it never matches a CLOSED issue, so an operator's resolution
    does not silence a recurrence) and `policy.reviewOrphanCap`, which caps how many times one PR may
    re-earn a lane before escalating instead. IF A BOUND IS NEEDED, MIRROR `reviewOrphanCap`. DO NOT
    REVERT TO PR-KEYING as the bound — that is the defect. And cost it: `sweepEscalationReconcile`
    (the closure leg) already runs on the daemon's own poll cadence, so the steady-state issue count
    is bounded by open PRs, not by pushes.
    (iv) FALSIFIER, BOTH DIRECTIONS, AT THE SAME PR. A PR escalated at head A and re-dispositioned
    blocked-ambiguous at head B escalates AGAIN; the SAME PR re-dispositioned at head A does NOT.
    Reverting the key fails the first; dropping the dedup entirely fails the second.
    (v) THE UNATTRIBUTABLE-FILING ARM MUST KEEP STANDING DOWN. A plan-filing PR with no
    `Remudero-Task:` trailer stands down with a named reason and never escalates; that arm is checked
    BEFORE the dedup and must be unaffected by this change, or every plan PR starts escalating per
    push.
    (vi) NOT IN SCOPE, AND EACH IS OWNED OR REFUSED ELSEWHERE. The sweep's cadence and what occupies
    the main tick — W1-T513 (#1868). Rate-limited review attempts — W1-T511 (#1866). An elapsed-time
    ceiling on `blocked-fixable`: COSTED AND REFUSED, see the note. The `escalated` set's behaviour
    across a ledger rotation (one PR in the corpus escalated twice, consistent with its earlier row
    rotating out of the retained window) — real, but it is `DECISION_RELEVANT_LEDGER_STEPS`'s concern,
    not this key's.
