    there, and it is ~19,900 lines that `partitionByFileOverlap` (W1-T471) serialises against every
    other task naming it.

    TWO NEGATIVE FINDINGS FROM THE SAME RECON, RECORDED HERE SO THEY ARE NOT RE-FILED.
    (1) BLOCKED-AMBIGUOUS IS NOT TERMINAL, and any shard resting on that premise is wrong.
    Dispositions are re-derived fresh every pass and the rule table carries no memory of the prior
    one. Measured over the same union: **280 transitions OUT of blocked-ambiguous across 220 of 773
    PRs — 117 to post-review, 96 to blocked-fixable, 29 to mergeable, 37 to wait, 1 to stale.** A red
    PR is not in that state at all: `isBlockedCi` claims it one row earlier as `blocked-fixable`.
    (2) AN ELAPSED-TIME CEILING ON `blocked-fixable` WAS COSTED AND REFUSED, and refusing it is the
    finding. Separating heads eventually dispatched to (213) from heads never dispatched to (78) by
    minutes-since-first-red gives a FALSE-POSITIVE RATE OF 74% AT 10 MINUTES, 84% AT 30, and 92% AT
    60; the never-dispatched population is SHORTER-lived (max 60.9m) than the eventually-dispatched
    one (max 134.7m, p90 43.0m), so no threshold separates them. A stand-down-count derivative does no
    better (44-67%). That bound would have been the FOURTH instance of the family CLAUDE.md already
    names — W1-T312's ci-gate cap, W1-T380's deploy ceiling, W1-T382's 21-of-21 check-wait — a bound
    that fires on a healthy condition.

    WHAT THE RECON COULD NOT MEASURE, STATED AS A LIMIT RATHER THAN A ZERO. The two PRs that prompted
    it (#1863, #1864) were handled by the AZURE daemon, and this host has NO ROUTE to that ledger — no
    ssh key, no HTTP on the probed ports, and the tailnet carries only the mini. Their per-pass
    disposition sequence is therefore UNMEASURED, not absent, and every figure above comes from the
    mini's corpus, which ends 2026-08-13 and contains neither PR (positive control: #1844, #1849 and
    #1830 also read 0 rows there, so the zero is corpus age, not a broken query). RE-DERIVE ON AZURE
    BEFORE BUILDING. What IS established for those two from GitHub: both went red (14:53 open ->
    15:10:46Z first red; 14:54 -> 15:12:16Z) and sat 20.7 and 23.2 minutes with no fix commit, no
    comment, no issue and no `remudero-review` status on either original head, until a human pushed.

    PROOF NOTES: all four proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
