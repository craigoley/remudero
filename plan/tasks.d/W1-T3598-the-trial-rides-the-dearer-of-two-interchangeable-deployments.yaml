  rationale: |
    RESEARCHED 2026-09-15 against published Azure pricing, and read against this repo's own
    measured history. Three independent reasons the trial deployment is the wrong one:

    (1) PRICE, BOTH AXES. gpt-5-nano is $0.05/1M input and $0.40/1M output; gpt-oss-120b is
    $0.15/$0.60. Three times cheaper on input, 1.5x on output. Nothing is traded away for it.

    (2) NO ADAPTER WORK. `openWeightEndpoint` builds
    `openai/deployments/{model}/chat/completions?api-version=2024-10-21` — the Azure OPENAI route.
    gpt-5-nano is Azure-OpenAI-family and rides it unchanged. The cheapest-OUTPUT candidate
    (Phi-4-mini, $0.07/$0.23) sits behind the Azure AI Model Inference `/models` route instead and
    would need an endpoint branch, which is why it is NOT this task.

    (3) THE OUTPUT DEFECTS ARE GPT-OSS-SPECIFIC, AND THIS REPO MEASURED THEM. Three of them, all
    recorded in-tree: `OPENWEIGHT_MAX_COMPLETION_TOKENS = 5_000` carries "gpt-oss-120b is a
    reasoning model; 1,500 truncated a shard mid-string in the live probe"; the adapter refuses
    `response_format` because "gpt-oss-120b returned malformed JSON under json_object in the
    measured probe"; and W1-T3567 exists only to add colon-quoting and closed-enum rules after
    gpt-oss emitted unquoted `proof:` values and invented enum literals.

    (4) THE DECIDING ARGUMENT IS NOT COST, IT IS WHETHER THE TRIAL CAN RUN. `synthesis.inbox_draft`
    is mounted at `max_turns: 400, context_budget: 180000`. ESTIMATED from those declared numbers at
    `dailyCapUsd: 5`: gpt-oss-120b settles ~$0.028 per full-context turn, exhausting the day at
    roughly 175 turns — SHORT OF ONE 400-TURN RUN. gpt-5-nano settles ~$0.010, roughly 500 turns,
    which covers it. On the dearer deployment the cap would halt a single run mid-flight and
    W1-T3570 would measure a budget ceiling while appearing to measure model quality. These are
    estimates from the declared budgets, not observations — which is itself the point: the sizing
    must be checked before the trial, not discovered inside its results.

    NOT AN ARGUMENT FOR SKIPPING THE MEASUREMENT. Cheaper tokens are not cheaper work; W1-T3570
    still decides widening on accepted drafts per dollar. This task only ensures the trial runs on
    the candidate that is cheaper AND more likely to satisfy the output contract, so the measurement
    is about the model rather than about the cap.
  design: |
    (i) ADD gpt-5-nano AS A PRICED DEPLOYMENT, its W1-T3597 price row beside gpt-oss-120b's. Both
    stay priced; neither is deleted.

    (ii) LEAD THE ECONOMY AND BALANCED LADDER ROWS WITH IT in `.remudero/mounts.yaml`'s
    `capabilities.openweight`, keeping gpt-oss-120b as the trailing fallback in the same rows — the
    exact shape the `codex` block already uses for a demoted model, so a deployment that stops
    answering falls back rather than failing the lane. `FALLBACK_OPENWEIGHT_MODELS` (the code-side
    default when the table is absent) moves with it so the two cannot disagree.

    (iii) FRONTIER IS LEFT ON gpt-oss-120b. A nano-class model is not a frontier substitute, and
    today all three tiers point at one deployment, which expresses no choice at all. This makes the
    ladder mean something.

    (iv) THE OUTPUT CONTRACT STAYS. W1-T3567's preamble is cheap, conditional, and harmless to a
    compliant model; removing it would couple this task to a quality claim it has not measured.
    Whether gpt-5-nano can safely re-enable `response_format` is a SEPARATE question with its own
    probe, deliberately not answered here.

    (v) OUT OF SCOPE: the `/models` endpoint branch that would unlock Phi-4-mini and the other
    non-OpenAI-family deployments; enabling the provider; the mount that routes inbox_draft
    (W1-T3569 owns it); `dailyCapUsd`'s value; and any change to what the measurement decides.
  acceptance:
    - claim: "gpt-5-nano resolves as the leading economy and balanced openweight deployment while gpt-oss-120b remains a reachable fallback in the same rows"
      proof: "unit test: the openweight ladder leads with gpt-5-nano and keeps gpt-oss reachable"
    - claim: "an identical request reserves and settles strictly less on gpt-5-nano than on gpt-oss-120b, read from each deployment's own price row rather than a shared constant"
      proof: "unit test: gpt-5-nano reserves and settles strictly less than gpt-oss-120b"
    - claim: "gpt-5-nano is dispatched through the already-shipped Azure OpenAI deployment route with no second endpoint shape introduced"
      proof: "unit test: gpt-5-nano dispatches through the existing azure deployment route"
    - claim: "the code-side fallback list and the mounts ladder name the same leading deployment, so an absent table cannot silently route the dearer one"
      proof: "unit test: the code fallback and the mounts ladder name one leading deployment"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF THE LADDER ALREADY LEADS WITH A NON-GPT-OSS DEPLOYMENT. Re-run
    before building: `grep -n -A 12 'openweight:' .remudero/mounts.yaml`. Every economy/balanced row
    reading `[gpt-oss-120b]` alone is the precondition this task assumes.

    AND THE PRICE ASSERTION MUST COMPARE TWO REAL ROWS. Assert the reserved and settled figures for
    the SAME request differ between the two deployments in the direction their published prices
    predict. Asserting one deployment's number against a hand-typed constant proves only that the
    arithmetic runs.

    AND THE FALLBACK ARM MUST BE ABLE TO FAIL. Prove gpt-oss-120b is still REACHABLE in the rows it
    trails by selecting it explicitly; a test that only asserts the leading entry would pass
    identically if the fallback had been deleted, which is the regression that turns a bad
    deployment day into a dead lane.

    AND DO NOT ASSERT A QUALITY CLAIM. This task measures price and routing only. Any assertion that
    gpt-5-nano's OUTPUT is better belongs to W1-T3570's measured trial, not here.
  note: |
    FILED 2026-09-15. Ids W1-T3597/W1-T3598 swept against three surfaces before use: reservation
    refs (highest held W1-T3595, 1611 refs read as the positive control), origin/main's shards
    (highest W1-T3596), and every open PR title/body/head (6 open, none claiming either id).
    `rmd next-task-id` itself returned W1-T3597 but DEGRADED — it could not enumerate open PRs in
    this container (the GitHub CLI is absent here) — so the open-PR half was swept by hand rather
    than taken on its word.

    verify:auto on both. Every criterion is mechanical, and the operator ruling standing since
    2026-09-08 is that a record is parked on a person only when a judge deems the change risky, not
    on its author's caution. The ONE decision here that is genuinely an operator's — whether the
    provider id `openweight` should keep that name once a proprietary nano model rides it — is
    deliberately left out of both records rather than settled by a worker.
