- id: W1-T3598
  title: "THE BOUNDED TRIAL RIDES THE DEARER, LESS COMPLIANT OF TWO INTERCHANGEABLE DEPLOYMENTS — gpt-5-nano is cheaper than gpt-oss-120b on BOTH token axes, needs no new endpoint because it is Azure-OpenAI-family, and carries none of the three measured output defects that forced W1-T3567's contract; at `dailyCapUsd: 5` the difference decides whether one inbox-draft run can finish at all"
