    failure. This is a legitimate residual gap, not a reason to withhold credit for what the acceptance
    criteria actually asked for (see W1-T324's follow-ups for whether it deserves its own tiny filing).
    THE CODE STANDS AND MUST NOT BE REVERTED. This entry withdraws a WORK ITEM, not the behaviour.
