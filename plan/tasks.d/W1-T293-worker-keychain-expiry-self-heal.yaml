      criterion 4 -> test/worker-keychain-expiry.test.ts:221 'claim: a spawn that died with the
        expiry-named reason forces the next provisioning attempt to re-provision rather than skip'
      criterion 7 -> `grep: credential-expired in src/lib/worker-home.ts` MATCHES 4 hits today, all from
        PR #1169's own implementation — no credential value in any log, name-domain only
      criterion 9 -> `grep: remudero-worker in docs/operator-guide.md` MATCHES 6 hits today, including
        docs/operator-guide.md:399 the section header '### Recovering from an expired worker credential
        copy (W1-T293)'
    RESIDUAL NOTE, same class as W1-T292's, carried forward rather than smuggled into this credit: the
    full runtime wiring that feeds a real containment spawn_credential_expired verdict into the NEXT
    spawn's priorSpawnCredentialExpired opt doesn't exist at any call site outside the three library
