    NO depends_on EDGE ON W1-T2478, DELIBERATELY AND FOR A RECORDED REASON. Its code is at head
    (`FAST_GATE_CENSUS_BOUND_MS` and the four entries are live in `src/lib/ci-parity.ts`) but its
