  rationale: |
    THE PREDICATE ALREADY SHIPPED, WHICH CHANGES THIS FROM A PRECAUTION INTO A RECONCILIATION.
    The follow-up asked for the census membership to be derived BEFORE the admission predicate was
    written. It was not, and the predicate is now at head, so the question is no longer hypothetical:
    the set it was written against is unrecorded, and three numbers about it disagree.

    MEASURED AT HEAD, EVERY FIGURE READ FROM SOURCE RATHER THAN CARRIED FROM THE BRIEF:
    SURFACE 1 census entries wired in `FAST_GATE_STEPS` (each carrying `boundMs`) = 4 —
      bound-kind-census, catch-erasure-census, negative-reachability-census, no-shallowing-census,
      wired through four `census:*` scripts (package.json:61-64), each naming exactly one file.
    SURFACE 2 the count W1-T2478's rationale asserted as the population = 6.
    SURFACE 3 the count that same rationale measured UNDER the 2000ms bound = 5, itemised only as
      five runtimes (548, 769, 1078, 1196, 1781 ms; their stated sum, 5372, is arithmetically five
      values) — so FOUR of FIVE under-bound suites were wired and the fifth is accounted for nowhere.
    SURFACE 4 files in `test/` matching a tracked-tree walk (`ls-files`) = 18.
    SURFACE 5 places in the repo naming which suites the six are = 0. `src/lib/ci-parity.ts`,
      `test/fast-gate-admits-the-census-class.test.ts` and `CLAUDE.md` were each read; the number
      survives only as prose in an assertion message ("exactly four of the six measured census
      suites") with no roster behind it.

    A COUNT IS NOT A POPULATION, AND THIS ONE IS ALREADY LOAD-BEARING TWICE. W1-T2478's own header
    states the admitted set is "defined by a predicate ... never by an enumerated list somebody
    extends later without re-measuring" — correct, and this task does not weaken it. But a predicate
    still has to be APPLIED to a candidate population, and that population was never written down.
    The consequence is not theoretical: the shipped assertion pins the admitted count against a
    denominator no reader can check, so a fifth under-bound suite going unwired is indistinguishable
    from a fifth that was refused for cause. That is the same shape as a bare non-zero exit — a
    verdict with its reason discarded — which this repo's own fast-gate work exists to remove.

    THE SECOND CONSUMER IS ALREADY QUEUED AND ALREADY DOUBTS THE NUMBER. W1-T2523 builds the report
    that names which census suites a changed path enters, and its own rationale says "RE-DERIVE
    RATHER THAN TRUST THE TWO", proposing `git grep -l 'ls-files'` intersected with `src/` filters
    as an approximation it explicitly declines to call complete. Without a roster, admission and
    that report derive membership twice, from two approximations, and are free to disagree — the
    two-derivations class this repo has paid for in the projection layer and the board layer already.

    WHAT THIS IS NOT. Not a new gate: the roster refuses nothing by itself, and a wrong derivation
    that BLOCKED a PR would be the bound-fires-on-a-healthy-condition defect. Not an override of the
    2000ms bound, which stays the primary control deciding admission. Not a re-audit of the seven
    non-census steps. Not a change to what any census suite asserts, and not an argument for wiring
    the over-bound member, which stays out on the bound's own terms.

    COMPLETENESS IS CLAIMED HONESTLY OR NOT AT ALL. The `ls-files` derivation is an approximation:
    a suite that walks the tree by some other means is invisible to it. So every observed walker
    resolves to one of three recorded states — a roster member with its measurement, a
    non-member with its stated reason, or UNCLASSIFIED — because a silent omission rebuilds the
    same blind spot one layer up, which is precisely how the eighteen-versus-six gap survived.

    THE RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS: one src stem plus its test is a src+test pair
    the sizing check refuses at risk:medium (the same regrade W1-T2523 records for the identical
    shape). The blast radius is genuinely small — the deliverable is evidenced data plus the
    consistency assertions over it, and it changes no admission decision that the bound does not
    already make.
