      proof: "unit test: test/the-census-roster-is-named-not-numbered.test.ts"
    - claim: "a tracked test file that walks the src population and is absent from the roster resolves to UNCLASSIFIED with its path reported, never silent omission"
      proof: "unit test: test/the-census-roster-is-named-not-numbered.test.ts"
    - claim: "a census entry added to FAST_GATE_STEPS with no roster entry FAILS — the roster cannot be bypassed by extending the step list"
      proof: "unit test: test/the-census-roster-is-named-not-numbered.test.ts"
