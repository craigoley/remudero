- id: W1-T1015
  title: "THE REVIEW-ORPHAN COUNTER CANNOT TELL A SWEEP-INITIATED UPDATE FROM A FOREIGN PUSH — it counts distinct prior reviewed heads and nothing else, so every branch update the sweep performs spends an orphan strike against the cap it also enforces, and widening the update lane past armed PRs would strand each one it touched"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 75.00
  rationale: |
    FILED FROM RECON at origin/main 02d5b89. Every symbol, count and control below was re-read on
    that tree. THE LEDGER SURFACE WAS UNAVAILABLE — this host carries no `state/` directory, so no
    figure here is ledger-derived and none is presented as such.

    (1) THE UPDATE LANE ALREADY EXISTS AND IS NOT WITHDRAWN — ESTABLISH THAT BEFORE READING THE
    REST. `updateBranch` is LIVE: `buildSweepEffects` (`src/run-task.ts`) wires
    `updateBranch: (pr) => updateBranchImpl(pr)`, and `runSweep` (`src/lib/sweep.ts`) calls it at
    most once per pass on the single PR `selectUpdateBranchTarget` chose. It shipped as
    `feat(sweep): update one armed-and-behind PR per pass, oldest head first`. It is disabled in
    EXACTLY ONE caller, `runSweepLightPass`, whose own comment gives the reason verbatim:
    *"`runSweepLightPass` fans ONE `runSweep` call out PER open PR, concurrently … so N single-PR
    calls here could each pick 'the oldest of one' and update-branch N PRs in one tick, exactly the
    N+(N-1)+…+1 cost this shard exists to prevent."* THAT REASON STILL HOLDS — the light pass is
    still per-PR concurrent — so nothing here re-enables it there, and a builder must not.

    (2) THE COUNTER KEYS ON SHA AND CARRIES NO ACTOR. `reviewOrphansFor` (`src/run-task.ts`)
    derives both `reviewOrphanedByPush` and `priorReviewOrphans` from one ledger scan: it collects
    `review.posted`/`review.post_refused` lines for this task id whose `head_sha` differs from the
    current head, and counts the DISTINCT prior heads. There is no actor field, no source, and no
    notion of who minted the new head. A sweep-initiated update and a human force-push are the same
    event to it. `armedButStalled`'s own doc states the mechanism it is subject to: *"updating mints
    a NEW head and a verdict is sha-pinned … so every update discards the verdict it was waiting
    on."*

    (3) SO THE ANSWER TO "CAN IT DISTINGUISH ITS OWN UPDATES" IS NO, AND THAT IS THE PREREQUISITE.
    The cap (`reviewOrphanCap`, default 2) escalates to `blocked-ambiguous` awaiting a human. An
    update lane that ran on more than the armed-and-behind set would therefore spend a strike per
    PR it touched and hand each one to a human at the second touch — the lane would manufacture the
    stranding it was built to relieve.

    (4) BUT THE DATA TO ATTRIBUTE ALREADY EXISTS AND IS SIMPLY NOT JOINED — THIS IS NOT A MISSING
    FIELD. `runSweep` writes `sweep.update_branch.attempted` before the call and
    `sweep.update_branch.<outcome>` after it, each carrying `pr_number`, `pr_url` and
    `head_sha: target.headSha`. That sha is the head the sweep updated FROM — precisely the head
    that becomes a prior reviewed head one poll later. So the join is: a prior head that appears as
    `head_sha` on a `sweep.update_branch.*` row for this task is a head THE SWEEP ITSELF superseded
    and must not count as a foreign orphan. NOTE WHAT IS NOT RECORDED: the NEW sha is never written,
    because GitHub's update-branch response carries a message rather than a sha and nothing re-reads
    it. The attribution must therefore key on the OLD sha, which is the one actually present.

    (5) AND THOSE ROWS ROTATE, SO THE JOIN IS NOT DURABLE AS IT STANDS. Membership tested bounded to
    the set body of `DECISION_RELEVANT_LEDGER_STEPS` (`src/lib/ledger.ts`):
    `sweep.update_branch.attempted` 0 and `sweep.update_branch.error` 0, against in-set controls
    `review.posted` 1 and `verdict` 1. `reviewOrphansFor`'s own doc records why that matters for the
    other half of this join — both review steps are in the set, *"which is what stops a rotation
    from archiving the lines and silently resetting `priorReviewOrphans` to zero — the line IS the
    bound."* The update rows carry no such bound, so an attribution built on them decays.

    (6) THE OBSERVED POPULATION IS SMALL, WHICH IS THE COST ARGUMENT RATHER THAN A COUNTER-ARGUMENT.
    At the time of this recon, 8 open PRs, all 8 opened and read serially (0 failures): every one
    `mergeable_state: blocked`, ZERO `behind`, 4 armed. That zero is NOT structural — 16
    `Merge branch 'main' into …` commits exist in history, so `behind` is reachable and the button
    has been pressed. All 16 are dated 2026-08-15 and predate the lane's own ship, so there is no
    git evidence the SHIPPED lane has yet fired. COULD NOT VERIFY whether `required_status_checks`
    is strict, which governs how often GitHub reports `behind` at all: the branch-protection
    endpoint returned HTTP 403 for this token. THE ACCESS THAT WOULD SETTLE IT: a read of
    `branches/main/protection` with a token carrying admin scope.
  design: |
    THE SHAPE: teach the orphan counter which prior heads the sweep itself superseded, and make that
    evidence survive rotation. Nothing else.

    (i) DETERMINE THE JOIN KEY FROM SOURCE BEFORE WRITING ANYTHING. Rationale (4) states that the
    only sha on a `sweep.update_branch.*` row is the OLD head. Confirm that from source rather than
    from this shard, and state in the PR whether the join is sound for a PR updated TWICE (two rows,
    two distinct old heads, both of which must be excluded) and for a PR whose update FAILED
    (`conflict`/`error` — no new head was minted, so nothing was orphaned and the row must NOT
    suppress a later genuine orphan). Those two cases are where a naive join goes wrong.

    (ii) DELIVERABLE A — ATTRIBUTE. A prior reviewed head that the sweep recorded itself updating
    from must not increment `priorReviewOrphans`, and must not set `reviewOrphanedByPush`.

    (iii) DELIVERABLE B — MAKE IT DURABLE. The rows the join reads must survive rotation, by the
    same mechanism and for the same stated reason the two review steps already do. Establish which
    retention category is correct rather than adding a new one.

    (iv) FAIL CLOSED, NEVER OPEN. If the evidence is absent — rotated, never written, or a row with
    no `head_sha` — the head must count as a FOREIGN orphan exactly as today. An attribution that
    fails open would silently disable the cap, which is the one protection against re-reviewing a
    PR forever. `reviewOrphansFor`'s own doc already refuses to treat an absent sha as a distinct
    head; this must refuse in the same direction.

    (v) A SUPPRESSION TEST ALONE PROVES NOTHING, AND THIS IS THE TRAP. An implementation that
    suppresses EVERY orphan satisfies "a sweep-updated head does not count" perfectly and deletes
    the cap. Every criterion is PAIRED with its control in the SAME run: a sweep-updated head
    suppressed AND a foreign push still counted; a failed update still counted; and an absent row
    still counted.

    (vi) THE MUTATION CHECK IS FILE-SHA BRACKETED. Read the sha256 of the edited file, invert the
    attribution, read it again and require it to DIFFER, run the suite and require the paired
    foreign-push control to FAIL, restore, and require the sha to return.

    (vii) OUT OF SCOPE, ENUMERATED, EACH A SIBLING RATHER THAN A PART OF THIS.
    WIDENING THE LANE ITSELF: `armedButStalled` (`src/lib/sweep.ts`) requires BOTH
    `autoMergeArmed === true` AND `mergeState === "behind"`, so an unarmed stale PR is never
    updated. Widening that set is what the operator ultimately wants and it is BLOCKED ON THIS
    TASK, not delivered by it — a wider lane without attribution strands what it touches.
    THE INFRASTRUCTURE-INCIDENT GAP: the fix rung sees only PR-level CI failures and dispatches
    nothing for a red main, a wedged toolchain install, a secondary rate limit or a stale lock.
    That is repair generally; this is the rebase prerequisite. Do not absorb it.
    RE-ENABLING `updateBranch` IN `runSweepLightPass`: refused, for the reason quoted in rationale
    (1), which still holds.
    AND THREE APPROACHES THE OPERATOR HAS ALREADY REJECTED ON GROUND TRUTH, recorded so no
    implementer re-derives them: `required_status_checks_strict: true`; a main-red dispatch gate;
    and a merge queue (`merge_group` appears in no workflow, and `remudero-review` is posted to
    `statuses/<sha>` over open PRs, so it can never go green on a speculative branch).
  acceptance:
    - claim: "a prior head the sweep recorded updating from does not increment the orphan count"
      proof: "unit test: W1-T1015: a sweep-updated prior head does not increment the orphan count"
    - claim: "a foreign push still increments the count, in the same run as the suppression above"
      proof: "unit test: W1-T1015: a foreign push still increments the orphan count"
    - claim: "a failed update suppresses nothing, because no new head was ever minted"
      proof: "unit test: W1-T1015: a failed update suppresses no orphan"
    - claim: "absent attribution evidence counts the head as foreign, never as suppressed"
      proof: "unit test: W1-T1015: absent evidence counts the head as foreign"
    - claim: "inverting the attribution fails the foreign-push control, with the file sha read either side"
      proof: "unit test: W1-T1015: inverting the attribution fails the foreign-push control"
