- id: W1-T4574
  title: "FIELD TRIALS FROM OUR OWN FLOW — audited ledger x GitHub aggregates across three opted-in repos"
  repo: remudero
  depends_on: [W1-T4554, W1-T4573]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  band_meaning: blast-radius
  origin: "human request 2026-09-26: use proprietary ledger and GitHub history for automation, PR correctness, throughput and model transition charts"
  plan_refs: ["W1-T100001", "W1-T4554", "W1-T4560", "W1-T4573", "docs/research/model-evidence-program.md"]
  files:
    - src/lib/field-trials-flow.ts
    - src/lib/field-trials-github.ts
    - src/lib/benchmark-cohort.ts
    - src/run-task.ts
    - test/field-trials-flow.test.ts
    - test/field-trials-github.test.ts
    - docs/research/model-evidence-program.md
  status: queued
  rationale: |
    Public core PR activity can already be plotted with source links, but GitHub merges are not
    worker successes, deployed changes, or proof of correctness. The three owned repos have
    aggregate-public consent in the site registry, yet raw private ledger and GitHub event data
    require a local join, a release manifest, and explicit missingness before any derived figure
    is published. Historical model selection is observational and often lacks served-model and
    final-outcome joins; no causal model ranking follows from a pre/post overlay.
  design: |
    Incrementally ingest the audited three-form ledger union and paginated GitHub PR, commit,
    review, check-run, deployment, and revert/follow-up events for core, site, and console.
    Expose this through an operator-invoked, resumable snapshot command before any scheduled
    cadence; scheduling and site import require separate validation and cannot become a PR gate.
    Use immutable task/assignment/run IDs and PR node IDs/SHAs internally; match the plan task
    trailer and branch credit paths separately, record unmatched and ambiguous links, handle
    edits, reruns, late data, partial API reads, and right-censored open work. Preserve source
    watermarks, API pages, as-of times, schema version, exact denominators, and observed vs
    unavailable values. Never infer deployment from merge or correctness from a green check.

    Produce five explicitly observational families: (1) model adoption by instance/day and task
    class, separating requested, selected, and served models and source merge from runtime boot;
    (2) automation conversion from eligible task through assignment, worker, PR, review, merge,
    deployment and verified outcome, with human-touch and missing-join fractions at every stage;
    (3) PR repair and correctness signals: first-pass CI, review rounds, repair attempts,
    reversions, linked regressions and later incidents, with follow-up windows and an honest
    unknown-correctness bucket; (4) flow and recovery distributions: task claim to PR/merge/
    deploy/verification, retries, self-repair and escalation, censoring unfinished work and
    distinguishing DORA commit-to-deploy lead time; (5) learning-loop yield: gardener proposal
    to task/experiment/action, accepted versus declined, verified result, follow-up defect and
    human effort. Show task-mix and time stratification; reserve causal benefit claims for
    randomized A/A then A/B trials with pinned stack provenance.

    Keep raw IDs, paths, prompts, account names, and private event text local. Export only
    versioned, reviewed, consent-checked aggregates with a revocable release manifest, small-cell
    disclosure review, source links where public, and explicit unavailable reasons. A refresh
    failure retains a dated last-known-good release and alerts the gardener; it cannot impede PR
    flow or change routing. No paid trial, automatic publication, or score promotion in this task.
  acceptance:
    - claim: "all three repos and ledger forms reconcile with GitHub provenance and unmatched links visible"
      proof: "unit test: field trials join three repo ledger and GitHub histories with explicit missingness"
    - claim: "a merge never becomes deployment or correctness and unfinished work is censored"
      proof: "unit test: field trials distinguish merge deployment verification and censored work"
    - claim: "model transitions show measured runtime exposure without asserting causal benefit"
      proof: "unit test: field trials adoption separates source merge from served model exposure"
    - claim: "private identities and low-disclosure aggregates cannot leak through a release"
      proof: "unit test: field trials release manifest suppresses private join keys and unsafe cells"
    - claim: "late API pages and ledger repairs rebuild only affected partitions, with stale release preserved on failure"
      proof: "unit test: field trials replay late evidence without blocking work"
    - claim: "the aggregate builder is reached by an explicit operator command, not only by tests"
      proof: "grep: buildFieldTrialsFlowSnapshot( in src/run-task.ts"
  falsifier: |
    Treat a GitHub merge as a verified fix; interpret PR count as productivity; count a CI
    rerun as a new PR; attribute a pre/post difference to one model despite task-mix or harness
    drift; turn unknown into zero; expose raw private IDs; or stop a healthy PR when the
    analytics or GitHub ingestion is unavailable.
