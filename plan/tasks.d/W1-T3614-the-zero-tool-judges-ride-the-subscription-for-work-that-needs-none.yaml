  note: |
    OPERATOR QUESTION 2026-09-15: when is nano right over gpt-oss, and are the subscriptions being
    spent anywhere these deployments would suffice? Both halves are measured below.

    ── THE ELIGIBILITY FILTER IS THE TOOL SURFACE ───────────────────────────────────────────────
    `OPENWEIGHT_FUNCTIONS` implements Read, Write, Edit, Grep, Glob and nothing else. Auditing every
    declared tool list in the tree:

        ELIGIBLE (tools are a subset)
          INBOX_DRAFT_WORKER_TOOLS   [Read, Grep, Glob]   -- already routed, W1-T3569
          ESCALATION_JUDGE_TOOLS     []                   src/lib/escalate.ts
          VERIFY_HUMAN_JUDGE_TOOLS   []                   src/lib/verify-human-judge.ts
          RISK_JUDGE_TOOLS           []                   src/lib/risk-judge.ts
          RULING_JUDGE_TOOLS         []                   src/lib/ruling-judge.ts
          JUDGE_TOOLS                []                   src/lib/flight-judge.ts
          PROMOTION_JUDGE_TOOLS      []                   src/run-task.ts

        BLOCKED (declares a tool the adapter does not implement)
          TRIAGE_WORKER_TOOLS        WebSearch
          PLAN_WORKER_TOOLS          WebSearch, WebFetch
          FIX_WORKER_TOOLS           Bash
          SPECIALIST_TOOLS           Bash
          every routes.* lane        UNRESTRICTED tools by default (W1-T2591)

    SIX LANES DECLARE NO TOOLS AT ALL. Their own source says why this is safe: "read-only BY
    CONSTRUCTION -- no tools at all", "everything it needs is baked into the prompt, so it has no
    ability to explore the worktree or take any action". They are the cleanest openweight
    candidates in the fleet and every one of them is on the subscription today.

    ── THE VOLUME, MEASURED OVER THE LEDGER UNION (three globs, positive-controlled) ─────────────
    Control: `inbox.draft_synthesized` reads 2,346 rows, matching W1-T3094's retained lane.

        escalation.judged      29,834 rows   72 tasks   6.9d   ~4,300/day AND RISING
                               daily: 1083, 2596, 2960, 4440, 6290, 5549, 6026
        verify_human.judged    41,552 rows   56 tasks   ONE 30-MINUTE WINDOW on 2026-09-09,
                               20,776 of them judge_failed -- an incident, not steady state
        risk_judge.decision       399 rows  399 tasks  34.0d   ~12/day, one per task, healthy
        inbox.draft_synthesized 2,346 rows             19.5d   ~120/day  <- the 45%-of-spend lane

    So `escalation.judged` alone runs ~50x more often than the lane W1-T3094 calls the largest in
    the fleet, and it is GROWING. Its dedup is NOT the problem: `lookupDuplicateEscalation` runs
    BEFORE `judgeEscalation` (src/lib/escalate.ts), so these are genuinely distinct escalations --
    the per-sha dedup dimension (W1-T195) turns over as the fleet pushes.

    ── WHICH DEPLOYMENT, AND THE RULE THAT DECIDES IT ───────────────────────────────────────────
    Measured against the live account with the adapter's own URL, api-version and body:

        lane              input     gpt-oss out   nano out   cheaper
        inbox_draft     259,181         452         2,207    nano,    2.83x
        escalation judge    446         177           993    gpt-oss, 2.40x

    nano is cheaper PER TOKEN on both axes ($0.05/$0.40 vs $0.15/$0.60) and DEARER PER TASK on
    short prompts, because it spends ~5x the completion tokens on reasoning (993 vs 177; 2,207 vs
    452). Solving for the crossover with r = nano_out/oss_out:

        nano is cheaper when   input_tokens  >  (4r - 6) x oss_output_tokens
        with the measured r of 4.9-5.6 that is roughly  input > 15 x output

    AND A HARD CONSTRAINT ABOVE THAT ONE: gpt-oss-120b's context window is 131,072 tokens
    (W1-T3613), so any lane whose prompt exceeds it MUST use nano regardless of cost. That is the
    real reason inbox_draft rides nano, and it is not written down anywhere today.
  rationale: |
    The subscriptions are the constraint this whole arc exists to relieve, and the judges are the
    purest case for moving: no tools, self-contained prompts, machine-parsed verdicts, and a
    volume that dwarfs the lane already routed. Routing them also tests the adapter on SHORT
    prompts, which is the half W1-T3570's inbox_draft trial cannot measure.
  design: |
    Give the judge lanes a mount with `provider: openweight` and a capability/effort pair that
    resolves to gpt-oss-120b, NOT nano -- the measurement above is the reason, and it must be
    stated in the mount comment so the next reader does not "fix" it to the per-token-cheaper row.

    START WITH ONE LANE, NOT SIX. `escalation.judged` is the volume and has a demote-only,
    fail-open contract already: `judgeEscalation` returns `deliver` on any spawn error, so a bad
    deployment degrades to "show the operator everything" rather than hiding work. That is the
    safest possible first cut and it is already written. Do not move the flight judge (`judge:`
    mount) in this task: it is bound by the Tier Invariant (G-17, src/lib/mounts.ts), which
    compares tier AND capability rank against every worker it supervises, and openweight sits
    outside the `tiers` table those checks read.

    The lane must keep its fail-open arm proven by a test that a spawn failure still yields
    `deliver` -- routing a judge is only safe because failing open is safe.
  acceptance:
    - claim: "the escalation judge rides openweight on the deployment measured cheaper for short prompts, and the mount says why"
      proof: "unit test: the escalation judge rides openweight on the short-prompt deployment"
    - claim: "a failed openweight judge spawn still delivers the escalation rather than hiding it"
      proof: "unit test: a failed openweight judge spawn fails open to deliver"
  falsifier: |
    Point the judge mount at the per-token-cheaper deployment and the first test must fail on the
    measured-cheaper assertion. Make the spawn throw and the second test must still observe a
    `deliver` verdict; if it observes `demote` or an exception, the fail-open arm is gone and
    routing this lane is unsafe. Remove the provider and the first test must fail rather than
    silently passing on the auction.
