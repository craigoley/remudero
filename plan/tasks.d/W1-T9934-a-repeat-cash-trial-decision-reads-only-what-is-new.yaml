  rationale: |
    DEPENDS ON PR 12406 (the wipe-test cadence hand-fix, head 48ef3814f, no task id). Build only after it merges. It
    is the model for a windowed, counted, incremental reader and for the bytes and rotations fields on a row.
    READ at origin/main fb566039c (symbols, not lines):
    - src/lib/cash-trial.ts decideCashTrial: a task in the control arm returns before any read. For a cash-arm task
      it calls windowedRows unless `readRows` is injected.
    - windowedRows calls readLedgerUnionRawLinesSync with `sinceTs` (policy windowDays, default 7),
      `pattern: /cash-simple|"step":"verdict"|selection_assignment_id/` and refuseIncomplete. Every rotation not
      before the window is read and gunzipped in full on every call. Its own rule refuses the decision ("ledger
      source unreadable or incomplete for paid-trial spend") when any rotation is unread, the live file fails to
      read or is absent, or a file is unclassified.
    - It filters raw lines by a field pattern, not by step. createIncrementalLedgerUnion caches only `step` reads,
      so it cannot share PR 12406's step-filtered reader.
    - src/run-task.ts logs `cash_trial.decided` with only arm and reason.
