- id: W1-T11138
  title: "A fleet container whose on-failure:5 restarts are spent is revived when it exits, not on the next 5-minute watchdog tick — revival after docker gave up took 170 s p50 and 974 s p90 over 10-20..10-27 (6 such outages on core), dark time that is pure waiting for the timer"
