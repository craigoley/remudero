    reject per-pass wiring. The autonomy question that WOULD need one belongs to W1-T447 and is held
    there; `depends_on: [W1-T447]` keeps this behind it.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance text
    and this set crosses `src/`, `docs/` and `test/`. Raised up front.
    `docs/operator-guide.md` IS DECLARED BECAUSE IT WILL TRIP, and the reason is measured rather than
    defensive: W1-T447's build went red on `docs-claims` (the guide must cover every COMMANDS verb)
    and on `generate-cli-reference --check` (a byte-comparison) the moment it added a verb. If this
    task changes the verb's usage text it trips both again. `docs/cli-reference.md` is deliberately
    OMITTED — it is GENERATED, so it appears in the diff without being hand-edited; declaring a
    generated artifact invites someone to edit it by hand.
    `test/sweep.test.ts` IS DECLARED AND THE REASON IS MEASURED, not defensive: it invokes the sweep
    62 times (counted on the invocation, not prose mentions), against 8 in `sweep-pass-heartbeat` and
    7 in `sweep-arm-parity`, so it is the suite that moves when the sweep gains a step.
    `test/branch-reaper-dry-run.test.ts` is declared because it pins `reapBranchesCommand`'s exit
    codes, and clause (iv) may have to change how a non-zero reap is treated.
    THIS IS THE SEVENTH files: CORRECTION-OR-PRE-EMPTION THIS WEEK. Five tasks were refused at push
    for omitting the suite that asserts the shape they changed, a sixth was corrected mid-flight, and
    W1-T447 itself needed docs added after its first full glob. The pattern is that a files: list
    gets written from the code the author pictures, not from the GATES that observe it.
    NO NUMBER HERE SHOULD BE QUOTED FORWARD — 7.38s, 625 passes, 5,000 requests and 49 branches were
    true at 2026-08-12T22:20Z. Sweep cadence and branch count both move hourly; re-measure before
    deciding anything."
