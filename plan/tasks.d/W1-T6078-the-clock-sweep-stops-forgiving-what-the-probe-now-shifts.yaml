  rationale: |
    RE-MEASURED 2026-10-19 at origin/main 6860068ca. This supersedes the 2026-10-06 design below wherever they differ.
    THE SWEEP. Scheduled run 39205083524 (2026-10-19T05:32Z, head b3a66e583) is the first complete sharded +400d
    sweep: 10 of 10 shards present, 854 candidates, 0 never run, 854 run, "PASS — 854 suite(s) immune at +400d".
    The slowest shard took 9.2 minutes of its 30-minute cap. Positive control: the 2026-10-12 run named
    test/ci-refresh-prevention.test.ts as NEW DRIFT; this run ran it in shard 9 at +400d and read it `ok`.
    THE RECORDED SET. Of the 11 names in driftingSuitesAtCapture, nine still exist and every one ran `ok`:
    cost-governor, daemon-crashloop-wiring, daemon-triage-guard-wiring, fleet-heartbeat, host-update-reclaim,
    install-symlink-refusal, run-task, serve-service-boot, worktree-reap-liveness. The other two,
    serve.density-ia and serve.live-state, have no test file. So the ceiling forgives 11 suites the sweep no longer
    sees drift in. If one of the nine drifts again, it is not NEW DRIFT (it is recorded) and stays under the
    ceiling, so the sweep passes and opens no issue. The "BELOW CEILING ... lower driftCeiling" hint cannot catch
    this either: scripts/clock-sweep.mjs prints it only inside `if (drift.length)`, so a clean run never asks.
    ALREADY DONE OR OBSOLETE on main since the 2026-10-06 design:
    - CLOCK_ARTIFACTS is an empty Map. #11305 (2026-10-13) dropped the prune-liveness and serve.glance exclusions
      after a complete sweep proved them stale, and its comment names W1-T6035. Design item (2) no longer applies.
    - test/worktree-reap-liveness.test.ts already says the probe "could not shift before W1-T6035". Its proof and
      the CLOCK_ARTIFACTS proof both read 1 at 6860068ca, so neither could fail. They are replaced below.
    STILL STALE at 6860068ca, verbatim:
    - test/cost-governor.test.ts:460, test/daemon-crashloop-wiring.test.ts:40, test/run-task.test.ts:8139: "line
      updates `home`'s own mtime to the REAL OS clock (mtimes are not shiftable, same mechanism CLOCK_ARTIFACTS'
      prune-liveness/serve.glance entries cite)". Both halves are now false: mtimes shift, and the entries are gone.
    - test/fleet-heartbeat.test.ts:57 and test/host-update-reclaim.test.ts:635: "monkeypatches only THIS process's
      global `Date`, never a child process's". The child-process half is still true.
    - docs/forensics/clock-shift.md:49 quotes "mtimes are not shiftable" with no note that W1-T6035 superseded it.
    CONTENTION: W1-T9870 (queued, priority 1) re-keys this baseline's stems to basenames. Emptying the list first
    leaves it nothing to re-key there; either order merges.
    MEASURED 2026-10-06 at origin/main a76291b3 (the original filing, kept for its history).
    scripts/clock-shift.mjs says "shift Date.now()/`new Date()` AND fs stat times forward". The last completed
    sweep then, run 36045188675 (2026-09-24, +400d, before #9669), read cost-governor, daemon-triage-guard-wiring,
    fleet-heartbeat, host-update-reclaim, install-symlink-refusal, serve-service-boot and worktree-reap-liveness
    `ok`, and daemon-crashloop-wiring, run-task, serve.density-ia and serve.live-state FAIL. The design below at that
    time lowered the ceiling to 4.
  design: |
    (1) scripts/clock-sweep-baseline.json: set driftingSuitesAtCapture to [] and driftCeiling to 0. Keep the
    driftingSuitesAtCapture key as an empty array, never delete it: test/clock-sweep.test.ts's W1-T3276 test
    requires Array.isArray(recorded) and recorded.length === DRIFT_CEILING, and its baseline test requires
    driftCeiling >= 0; [] and 0 satisfy both. Keep `_comment` verbatim (the same test pins it). Set capturedAt to
    2026-10-19 and capturedAgainst to "origin/main @ b3a66e583 (clock-sweep run 39205083524)". After this, any
    drifting suite is OVER CEILING, so the sweep fails and clock-sweep-deliver.mjs opens its issue; that is the
    ratchet working. The baseline is not in clock-sweep.yml's pull_request paths, so no sweep runs on the PR.
    (2) Rewrite the five stale test comments to say the probe now shifts the file clock (W1-T6035), and drop the
    CLOCK_ARTIFACTS citation from the three that make it. Keep each explicit re-stamp: it still pins the fixture's
    age to the injected clock. Change fleet-heartbeat and host-update-reclaim to "shifts only THIS process's
    clocks"; a child process's clock still does not move. Comment-only edits: no assertion changes.
    (3) docs/forensics/clock-shift.md: add a dated note after the module-header block saying the prune-liveness
    and mtime lines are superseded by W1-T6035 (#9669). Leave the quoted block verbatim.
    The proofs are greps on lines this change adds, because a comment and ratchet edit has no behaviour for a unit
    test to discriminate. Every one reads 0 at 6860068ca.
