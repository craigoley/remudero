- id: W1-T3711
  title: "THE SQUEEZE SEATS ARE DEAD CONFIGURATION — `mounts.architect.squeeze_model` and `mounts.judge.squeeze_model` parse, validate, and fold into the Tier Invariant, but the only two functions that READ them have zero reachable callers, so an operator can set the seat that is supposed to survive a maxed subscription and nothing will ever select it"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 12.00
  files:
    - src/lib/config.ts
    - src/run-task.ts
  origin: "operator-session#squeeze-readiness-2026-09-16"
  plan_refs: ["W1-T3692", "W1-T3705", "W1-T3696"]
  status: merged
  attempts: 0
  note: |
    MEASURED ON origin/main 2026-09-16, after #5793 merged the seat work:

        grep -rn "judgeModel("     src | grep -v src/lib/config.ts   ->  0 callers
        grep -rn "architectModel(" src | grep -v config.ts,retro.ts  ->  1 caller, ONE ARGUMENT
        grep -rn "squeezeModel"    src | grep -v src/lib/mounts.ts   ->  only config.ts itself

    So `squeeze_model` is parsed by `parseMount`, validated against `tiers:`, and folded into the
    G-17 Tier Invariant via `min(architectTier, architectSqueezeTier)` -- and then read by nobody.

    THE TWO REASONS ARE DIFFERENT, AND THE JUDGE ONE IS THE HARDER OF THE TWO.

      architectModel(config, mounts, {squeezed}) -- the mounts-aware overload has NO caller. Its one
      live call site (`src/run-task.ts`, the plan lane) is `architectModel(config)`, deliberately, and
      a recorded ruling pins it there: "ONE-ARGUMENT ON PURPOSE ... passing `mountsTable` here would
      be a MODEL CHANGE for this lane, not a cleanup" (fb-1784921980488-44b355 section 4). So wiring
      it is not a cleanup either -- it needs that ruling revisited or a different seat named.

      judgeModel(mounts, {squeezed}) -- has no caller AND NO SEAT TO WIRE. `resolveRiskJudgeMount`
      (`src/lib/risk-judge.ts`) walks `mounts.routes` and picks the cheapest worker mount; it never
      reads `mounts.judge`. `escalate.ts` and `verify-human-judge.ts` both go through it, falling
      back to their own optional `escalation_judge`/`verify_human_judge` rows. `mounts.judge` is the
      Tier-Invariant CEILING, not a dispatch seat -- which is why nothing selects from it.

    WHY THIS MATTERS RATHER THAN BEING TIDINESS. The operator's stated requirement was that the top
    tier must not be Claude-only, so the fleet keeps working when the subscription is maxed. The
    parsing, the tier ranks and the cap all shipped. The SELECTION did not. A host that sets
    `squeeze_model` today gets a green load, a satisfied invariant, and the subscription model anyway.

    DO NOT "FIX" THIS BY WIRING THE PLAN LANE. That is the one site the ruling names, and changing it
    silently alters which model writes plans. Name the seat first.
  rationale: |
    This is the shipped-unwired shape this plan refuses elsewhere by gate: config that validates,
    documents itself, folds into an invariant, and is then read by nothing. It is worse than absent
    config, because absent config fails loudly the moment an operator looks for it, while this fails
    silently and looks configured.

    It was found by trying to USE it. A session set out to "compute `squeezed` from live capacity and
    pass it to architectModel/judgeModel" -- the obvious next wire after #5790/#5792/#5793 -- and
    discovered there was nothing to pass it TO. That is the honest reason this is filed rather than
    built: the work is not a wiring task, it is a question about which seat the squeeze model is for,
    and one of the two candidate answers is pinned by an operator ruling.

    THE CHEAP HALF IS WORTH DOING FIRST AND ALONE: make the dead row REFUSE. `parseMount` already
    throws on a `squeeze_model` absent from `tiers:`; it could equally refuse a `squeeze_model` on a
    row whose model is never selected from, which turns a silent no-op into a load-time error naming
    the seat. That costs no ruling and removes the false sense of configuration immediately.
  acceptance:
    - claim: "a squeeze_model set on a row that nothing selects from is refused at load rather than silently ignored"
      proof: "grep: squeezeModel in src/lib/mounts.ts"
    - claim: "the squeeze seat resolvers have a reachable caller, or the dead ones are removed"
      proof: "grep: judgeModel in src/run-task.ts"
  falsifier: |
    Run, on origin/main:

        grep -rn "judgeModel(" src | grep -v src/lib/config.ts

    A non-zero count means a caller has appeared since this was measured and this finding is stale --
    close it with that correction recorded.

    Close WITHOUT wiring the plan lane if the operator re-affirms fb-1784921980488-44b355 section 4.
    In that case the honest outcome is to DELETE the unreachable overload and the `judge` seat
    resolver rather than leave them as a promise the config cannot keep, and to say so in DECISIONS.md.
