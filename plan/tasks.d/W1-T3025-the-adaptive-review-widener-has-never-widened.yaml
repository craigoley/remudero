  rationale: |
    WITHDRAWN AS FILED 2026-09-09 — THE PREMISE IS FALSIFIED AND THE ACCEPTANCE CONTRACT IS
    ARITHMETICALLY UNSATISFIABLE. Re-verified at 378ee37e72196983e0e92da82f94d66372f3120b,
    then checked unchanged at e4ce28bebaef0d1299f39b6ecdbd68ff5a6c082f: `plan/policy.yaml`
    sets `reviewLanes` value 3 and max 3, while `clampedWidth` in
    `src/lib/review-capacity.ts` caps `effectiveWidth` at `maxWidth`. Production supplies both
    `baseWidth` and `maxWidth` as 3. The criterion requiring `effective_width > base_width` can
    therefore never pass without changing the operator-set policy bound, which this task explicitly
    excludes.

    THE MEANINGFUL RECOVERY ALREADY SHIPPED. Across 516 exact-line-deduplicated, post-policy-change
    `review.capacity` rows, `provider-telemetry-unavailable` produced 174 recoveries, 81 holds and
    ZERO reductions; `telemetry-unavailable` produced ZERO rows. W1-T2987's additive recovery toward
    base width is working. `host-worker-budget` was the material reducing reason and its rows carried
    real occupancy. `queue_depth` was zero in 429 of 516 rows and exceeded `effective_width` in only
    five, removing this task from queue-latency ownership.

    THIS SUPERSEDES THE EARLIER CLAIM that 665 missing-telemetry decisions were narrowings. That
    reading conflated a reason label with transition direction and pooled the pre-change and
    post-change eras. The post-change transition census above separates reductions, holds and
    recoveries.

    `status: blocked` IS THE RETIREMENT RECORD, not a live blocker: `withdrawn` is not a valid task
    status, and W1-T270/W1-T467 establish the in-place tombstone convention. The original rationale,
    acceptance, falsifier and provenance remain below as the historical record. No replacement task
    is filed here. If a future operator raises `reviewLanes.max` above `reviewLanes.value`, above-base
    widening becomes reachable again and must earn a fresh task plus a discriminating test at that
    time. This retirement grants no authority to change review lanes, host-worker budget, telemetry
    policy, review-capacity source, or daemon behavior.

    --- ORIGINAL RATIONALE, PRESERVED VERBATIM ---

    W1-T2853 shipped `selectRuntimeReviewWidth` (src/lib/review-capacity.ts, wired at
    run-task.ts:31230) to EARN a third review lane on a sustained healthy window. Its own policy
    prose calls lane three "temporary capacity earned by a sustained healthy window, not a new
    default". MEASURED over every `review.capacity` row in the ledger union, 2026-09-05 .. 2026-09-07:

      decisions                    : 718
      effective_width ABOVE base   :   0   (0%)
      effective_width AT base      : 382  (53%)
      effective_width BELOW base   : 336  (47%)
      max effective_width observed :   2   (max_width is 3)

    THE EARNED LANE HAS NEVER BEEN EARNED. `reason: healthy-window` appears FIVE times in three
    days, and on two of those it still returned width 1. So the mechanism is not merely
    conservative — the widening arm has no observed successful case at all.

    THE DOMINANT REFUSAL IS ABSENT TELEMETRY, NOT OBSERVED PRESSURE:

      telemetry-unavailable          : 349  (218 -> width 2, 131 -> width 1)
      backlog-not-sustained          : 125
      cpu-pressure                   : 111  (all -> width 1)
      provider-telemetry-unavailable :  74
      host-worker-budget             :  43
      review-latency-expanded        :   9

    349 + 74 = 423 of 718 (59%) are the reader failing to observe, not the host being busy. A
    representative row at 2026-09-07T13:38 carries `mem_available_mib: 29838`,
    `cpu_psi_some_avg10_pct: 0`, `memory_psi_some_avg10_pct: 0`, `healthy_samples: 0` — an idle
    host with 29 GiB free, refused for want of a provider reading.

    NOT EVERY REFUSAL IS SPURIOUS, AND THE FILING SHOULD NOT PRETEND OTHERWISE. `cpu-pressure` was
    checked and is real: the sampled row carries `cpu_psi_some_avg10_pct: 75.9`. That arm is
    working. The defect is that a MISSING reading is treated the same as a BAD one, and
    `healthy_samples` (needing 3 consecutive) can never accumulate across a stream where 59% of
    samples are unreadable.

    WHY IT MATTERS NOW: W1-T3024 raised the committed base 2 -> 3 on operator direction. That
    raises what the widener HOLDS, but 47% of decisions narrow below base regardless, so the
    committed value cannot deliver three lanes on its own while this stands.
