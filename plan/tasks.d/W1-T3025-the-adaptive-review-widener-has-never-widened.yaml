    - claim: "a sustained window that is healthy on every reading the host CAN supply widens above base_width at least once, with a test that fails if the widening arm is unreachable"
      proof: "unit test: test/adaptive-review-widener-can-widen.test.ts"
    - claim: "genuine pressure still narrows — the cpu-pressure arm observed at 75.9% PSI keeps its current behaviour"
      proof: "unit test: test/adaptive-review-widener-can-widen.test.ts"
    - claim: "the decision row names whether a refusal came from an OBSERVED reading or an ABSENT one, so this measurement can be re-derived from the ledger without re-reading source"
      proof: "unit test: test/adaptive-review-widener-can-widen.test.ts"
