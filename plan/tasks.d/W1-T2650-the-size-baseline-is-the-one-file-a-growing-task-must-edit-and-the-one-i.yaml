  note: |
    FILED 2026-09-01 from followup:DAEMON-1788192519316:2026-08-31T16:38:07.971Z:0 (harvested from
    W1-T2516, run DAEMON-1788192519316, PR #3409). THE FOLLOW-UP'S LITERAL ASK IS DELIBERATELY NOT
    FILED, and the measurement that retires it is recorded here verbatim so no future reader
    re-derives it or re-files it:
      src/lib/account-usage.ts — the requested `740` is ALREADY on main, matching the file exactly
        (last content line 740). Nothing to do.
      src/lib/worker.ts — the requested `3547` is now BELOW the file, which measures 3684 lines
        (last content line 3684) against a recorded 4000 bucket. Ratifying it literally would have
        turned a green gate RED by 137 lines. This is the W1-T137 "PREMISE CORRECTED" shape: the
        harvested numbers were true when observed and false when read.
    The `source-size-ratchet` check the follow-up calls "still-red" is GREEN for both named files on
    main today, so the proposal's premise no longer holds and its remedy would regress the gate.
    WHAT SURVIVES is the follow-up's second clause — "outside W1-T2516's declared file scope, so it
    needs either a scope amendment or a separate small task" — generalised past the two stale
    numbers into the structural contradiction that produced them. This task is that clause.
    VERIFY-FROM-SOURCE OBLIGATION ON THE IMPLEMENTER, and it is load-bearing rather than a formality:
    read `scopeGuardOutOfScopeFiles` (run-task.ts:3799), `fixRungScopeStandDownReason` (:3976) and
    `scopeViolationFiles` (review.ts:3592) and establish each one's ACTUAL disposition — the
    implement path is documented at run-task.ts:3954 as "push-and-flag" rather than a hard refusal,
    while the reviewer's check is described at review.ts:383 as fail-closed. If the measured
    dispositions differ from this note, correct the note in the PR body rather than building to it;
    line numbers are a 2026-09-01 survey and drift is expected.
