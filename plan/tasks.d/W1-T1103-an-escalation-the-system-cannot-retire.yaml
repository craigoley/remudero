- id: W1-T1103
  title: "the escalation rung opens issues it can never retire — it escalates on a check that has merely NOT STARTED, half the board carries no label the retirement path filters on, and half carries no referent any lookup can resolve, so six false escalations sit open with nothing able to close them but a human"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high
  rationale: |
    THE RECON IS CITED, NOT RE-DERIVED: the twelve open `needs-human` issues were classified on
    2026-08-21 from one paginated read plus local git, and this shard carries that result rather
    than repeating it.

    (1) ZERO OBSERVED RUNS IS THE STATE EVERY CHECK PASSES THROUGH BEFORE IT STARTS. Five open
    issues — #2301, #2302, #2304, #2305 and #2076 — each read `[ABSENT] required check has ZERO
    observed check runs on head <sha>`, and EVERY referenced PR subsequently merged: #2297 at
    81b7760c, #2298 at 75a1f3d1, #2299 at 00cf401d, #2286 at 47f66a3f, #2075 at b4604217. #2396 is
    a sixth instance of the same family reached by a different route. The rung did not observe a
    failure; it observed a beginning.

    (2) AND THIS IS NOT A GAP IN THE TAXONOMY — IT IS A THIRD ARM THE TAXONOMY DOES NOT HAVE, WHICH
    IS THE ONE THING THE SUBJECT SWEEP CHANGED ABOUT THIS FILING. W1-T176 (`queued`) RULED that a
    required check with zero check runs is not ambiguous but a DETERMINISTIC-ACTION state, and
    W1-T186 (`queued`) already names `checksState: "none"` as overloaded and splits it — CONFLICTED
    (zero checks expected, merge main in), ABSENT (zero runs on a MERGEABLE PR, post the check),
    PENDING (checks exist and are running, wait), FAILING. BOTH ARE CITED, NEITHER IS RE-FILED.
    What the six measured instances show is that the split needs a THIRD reading of zero: a
    mergeable PR whose workflow has not been SCHEDULED yet is indistinguishable, by run count
    alone, from one whose required check is genuinely missing — and W1-T186 routes both to ABSENT.
    So W1-T176's ruling is not wrong about a genuinely absent check; it is falsified as a rule
    about a COUNT, because the count cannot carry the distinction.

    (3) THE DISCRIMINATOR THE COUNT LACKS IS TIME, NOT MORE STATE. A head seconds old with zero
    runs and a head hours old with zero runs are the same number and opposite situations. Nothing
    in the current view separates them, which is why five PRs that were merely early were reported
    as blocked.

    (4) HALF THE BOARD IS INVISIBLE TO THE RETIREMENT PATH. `labels=needs-human` returns six of the
    twelve open issues; #2076, #2300, #2301, #2302, #2304 and #2305 carry NO LABEL AT ALL. Every
    consumer that filters on that label — the console queue, the reconciler's read side, any
    operator query — is looking at half a board and cannot know it.

    (5) AND HALF CAN NEVER SELF-RETIRE WHATEVER THEIR CONTENT. #2032 and #2360 carry no `Task:`
    trailer at all, which is the `no_task_trailer: 2` in the reconciler's own drop counts for the
    day. #2301, #2302 and #2304 carry a synthetic `PR-2297`-style label in that field while the
    body reads `Task undefined`. #2063 carries `Task: daemon`, a pseudo-task no lookup resolves.
    THEIR PRs MERGING DOES NOT HELP: nothing links a merge to an issue, so terminality of the
    referent is unreachable when the referent itself is unresolvable.

    (6) SO THE THREE PARTS ARE ONE CONCERN, AND THE CONCERN IS A LIFECYCLE, NOT A MESSAGE: an
    escalation this system opens must be one this system can close. Escalating on an unstarted
    check creates the false positive; the missing label hides it from the path that would retire
    it; the unresolvable referent makes retirement impossible even when it is seen. Fixing any one
    alone still leaves an issue only a human can close.

    (7) THE FOURTH SHAPE IS CITED AND DELIBERATELY NOT SCOPED IN. #2063 is a starvation notice that
    COUNTS recoverable blockers and names none of their ids, so it can be neither verified nor
    retired; its premise has since failed outright, with hundreds of merges to main since it
    opened. W1-T298 owns queue-starvation escalation and W1-T186 owns naming the observed blocker —
    that pair is where the fix belongs, not here.

    ── AMENDED 2026-08-23, PURELY ADDITIVE: A THIRD REFERENT KIND IS NEEDED ─────────────────────

    (8) THE TASK TRAILER IS NEEDED ONLY TO FIND A REFERENT, NEVER FOR THE CLOSE DECISION -- SO A
    NON-TASK ESCALATION IS NOT INHERENTLY UNRETIRABLE. `buildEscalationReconcileCandidates`
    (`src/run-task.ts`) gates on exactly two things: `no_task_trailer`, when
    `/^\*\*Task:\*\*\s*(\S+)\s*$/m` finds no line in the body; and `no_referent`, when a line exists
    but `plan.byId` misses it, it is not `PR-<n>`, and `prReferentFromIssueText` returns undefined
    on BOTH body and title. The close itself never consults a task: `sweepEscalationReconcile`
    branches on `if (!c.derived.merged && !c.derived.closed)`, and on the PR path `derived` is
    built straight from `deps.github.prByRef(n).state` with `source: "pr-referent"`. A NON-TASK
    ESCALATION THAT NAMES A PR ALREADY CLOSES ITSELF TODAY.

    (9) AND THE TWO GATES ARE ORDERED, WHICH IS SHARPER THAN THE PAIR SUGGESTS: `no_task_trailer`
    SHORT-CIRCUITS BEFORE THE PR FALLBACK IS REACHABLE. The `if (!taskId)` arm `continue`s
    immediately; the `prReferentFromIssueText` fallback lives inside the LATER `if (!task)` arm,
    which is only reached when a `**Task:**` line was found and merely failed to resolve. So an
    issue carrying resolvable PR URLs and no `**Task:**` line is dropped WITHOUT the fallback that
    would have resolved it ever being consulted. MEASURED: `#2032`'s body carries nine `/pull/<n>`
    references and no `**Task:**` line, so it drops as `no_task_trailer` with its referent in hand.

    (10) WHAT GENUINELY CANNOT CLOSE IS AN ESCALATION NAMING NEITHER, AND THE MEASURED THREE SPLIT
    ACROSS BOTH COUNTERS RATHER THAN ONE. Re-derived 2026-08-23 against the live issues: `#2438`
    (dispatch queue starved) carries a `**Task:**` line and no PR anywhere -> `no_referent`;
    `#2360` (mutation-nightly failing) and `#2032` (clock-sweep fixture drift) carry no `**Task:**`
    line -> `no_task_trailer`. That is 1 and 2, which is exactly the `dropped:
    {"no_task_trailer":2,"no_referent":1}` the summary row reported. Their referents are a QUEUE
    STATE, a WORKFLOW CONCLUSION and a SWEEP FIXTURE -- none of which is a task or a PR.

    (11) A CORRECTION TO THE RECORD THIS AMENDMENT WAS WRITTEN FROM: `#2032` IS STILL OPEN. `#2438`
    and `#2360` were closed by hand on 2026-08-23; `#2032` was not, and read `state: open` when
    this was written. So the class is not merely historical -- one member is on the board now.

    (12) "DO NOT OPEN" IS THE WRONG REMEDY FOR THIS CLASS, WHICH IS WHY DESIGN (iii) DOES NOT
    COVER IT. A nightly that genuinely starts failing SHOULD be reported; refusing to open the
    issue would trade an un-retirable true positive for a silent real failure, which is strictly
    worse. The answer is a THIRD REFERENT KIND -- a check or workflow whose conclusion the
    reconciler can re-read, exactly as it already re-reads a PR's state -- so the escalation opens
    when the condition holds and retires itself when it stops holding. Design (iii)'s two kinds, a
    plan task id and a PR number, cannot express `mutation-nightly`.

    (13) THE VISIBILITY HALF IS ALREADY SHIPPED; IT IS DURABILITY THAT IS ABSENT.
    `renderEscalationReconcileSummary` (W1-T1101, `src/run-task.ts`) already renders
    "N open needs-human issue(s) checked · N closed · N became candidate(s), N dropped
    (N no-task-trailer, N no-referent)". It has exactly ONE call site, inside `rmd sweep`'s own
    `console.log`, so the line exists and reaches nobody who is not running a sweep by hand. The
    drop is counted and named; it is not durable. Nothing here re-files W1-T1101, and W1-T347
    remains the owner of the moot-question guard on issues already open.

    (14) AND THE EXISTING GUARDRAILS STAND UNCHANGED. Design (v) forbids bulk-closing the open
    board and this amendment proposes no closure of any current issue. Nothing closes an
    escalation whose condition still holds, and no issue is closed without RE-DERIVING that
    condition -- a timer or an age rule would be the wrong fix, because it would retire a true
    positive on the clock rather than on the evidence.
  design: |
    (i) DO NOT ESCALATE ON A CHECK THAT HAS NOT STARTED. The rung needs a third reading of zero
    beside W1-T186's CONFLICTED and ABSENT: NOT-YET-SCHEDULED, decided on how long the head has
    existed rather than on the run count, which cannot carry it. Below that threshold the
    disposition is WAIT and no issue is opened; above it the existing ABSENT path is unchanged.
    The threshold must be derived from this repo's own observed time-to-first-check, never a
    guessed constant — a bound that fires on a healthy condition is this repo's recurring defect.

    (ii) EVERY ESCALATION THIS SYSTEM OPENS CARRIES THE QUEUE LABEL. `escalate()`
    (`src/lib/escalate.ts`) already applies `needs-human` alongside its per-class and ask-type
    labels; the measured board shows six issues without it, so at least one opening path does not
    go through that labelling. The falsifier is the property, not the path: no opened escalation
    lacks the label the retirement path filters on.

    (iii) CARRY A RESOLVABLE REFERENT OR DO NOT OPEN. An escalation whose `Task:` field is a
    synthetic `PR-<n>` label, a pseudo-task, or absent is one no lookup can retire. The emitter
    must either resolve a real referent — a plan task id, or the PR number in a field the
    reconciler actually reads — or decline to open and say why, rather than creating a permanent
    operator obligation.

    (iv) THIS IS A LIFECYCLE GUARANTEE AND SHOULD BE TESTED AS ONE. The three arms above are worth
    stating as a single property over a rendered escalation: it is labelled, it names a resolvable
    referent, and it is not opened against a head too young to have been scheduled.

    (v) DO NOT PROPOSE BULK-CLOSING ANY OPEN ISSUE. Five of the six are provably stale, and the
    operator is ruling on each. An issue closed on a heuristic is a question nobody ever answers —
    the remedy here is that the NEXT one can retire itself, never a sweep over the current board.

    (vi) NOT IN SCOPE, EACH WITH ITS OWNER: W1-T176's ruling and W1-T186's four-way split, which
    this task extends rather than replaces; W1-T283, which fixes what the console can SEE from the
    plan-task side; W1-T345's referent-less dedup and W1-T347's moot-question guard, which act on
    issues already open; and W1-T298 plus the starvation notice of rationale (7).
  acceptance:
    - claim: "a required check with zero runs on a head too young to have been scheduled disposes to wait and opens nothing"
      proof: "unit test: test/escalation-retirability.test.ts"
    - claim: "a genuinely absent required check on an older head still escalates exactly as it does today"
      proof: "unit test: test/escalation-retirability.test.ts"
    - claim: "every escalation this system opens carries the queue label the retirement path filters on"
      proof: "unit test: test/escalation-retirability.test.ts"
    - claim: "an escalation whose referent no lookup can resolve is refused rather than opened"
      proof: "unit test: test/escalation-retirability.test.ts"
