    THE SUBJECT SWEEP CHANGED THIS SHARD AND THAT IS RECORDED RATHER THAN HIDDEN. Sweeping shard
    slugs across main AND all 120 remote heads for the escalation/retirement subject surfaced
    W1-T186, whose own title already carries the phrase `zero check runs`, and its cited parent
    W1-T176. Had this been filed from the recon alone it would have re-filed a taxonomy that
    already exists. Rationale (2) states precisely what is new — a third reading of zero that
    neither task has — instead of restating what they own.

    `risk: high` IS SET UP FRONT AND IT IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses two
    `src/` modules and `test/`, and the acceptance wording names the dispatch-sweep and escalation
    surfaces, so `subsystemsOf` (`src/lib/task-linter.ts`) derives more than one tag.

