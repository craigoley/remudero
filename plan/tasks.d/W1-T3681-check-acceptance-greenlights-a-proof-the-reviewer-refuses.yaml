- id: W1-T3681
  title: "rmd check-acceptance reports OK on a proof the reviewer REFUSES — the one pre-flight verb an author runs before opening a PR never asks the discrimination question, and check-proof --base already answers it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 8.00
  files:
    - src/run-task.ts
  origin: "operator-session#two-plan-prs-refused-on-the-same-proof-2026-09-16"
  plan_refs: ["W1-T387", "W1-T273", "W1-T362", "W1-T2251"]
  status: queued
  priority: 2
  attempts: 0
  note: |
    MEASURED 2026-09-16, end to end, on this host.

    A body whose only criterion is `grep: band_meaning: span in plan/tasks.yaml`:

      $ rmd check-acceptance /tmp/old.md
      criteria parsed: 1
      empty proofs:    0
      OK -- the parser resolves exactly what was written, and every proof is non-empty.

    The SAME proof, run through the executor that review actually uses:

      $ rmd check-proof "grep: band_meaning: span in plan/tasks.yaml" \
          --base 59f09a0f580a581dde63e3ad14402e34a4801e75
      hits:       10      verdict: pass
      base hits:  5       base:    pass
      discrimination: executed_stale -- this proof matches BOTH head and base, so it
                      discriminates NOTHING
      exit: 5

    COST, THE SAME DAY. remudero-site#39 and remudero-console#47 were both opened carrying that
    exact proof and both failed `remudero-review` with an identical refusal. `check-acceptance` was
    run against one of those bodies before it opened and reported OK.
  rationale: |
    THE ANSWER EXISTS AND THE PRE-FLIGHT VERB DOES NOT ASK FOR IT. `checkProofCommand` implements
    the full discrimination path behind `--base` -- a real detached merge-base worktree (R-11),
    the reviewer's own executor on both trees, and `executed_stale` as exit 5, which is the
    reviewer's OWN name for the downgrade it applies (W1-T273/W1-T362). Nothing is missing from the
    machinery.

    What is missing is the CHAIN. `checkAcceptanceCommand` reads a whole body and validates its
    SHAPE: header present, bullets not truncated, proofs non-empty, trailer scope not mismatched.
    It never executes a proof and takes no `--base`. So an author with a whole body in front of
    them must already know to (a) reach for a second, per-proof verb, and (b) pass a flag whose
    omission is documented as leaving "every line and exit code byte-identical" -- that is, whose
    omission is SILENT.

    WHY "OK" IS THE DEFECT AND NOT MERELY THE OMISSION. This verb's whole purpose is to stand in
    for the reviewer before a PR opens. Printing `OK` on a body the reviewer will refuse is the
    failure mode this repo names everywhere else: a check that passes while comparing nothing. The
    author reads OK as "the gate will accept this", because that is what the verb is for.

    NOT A SECOND IMPLEMENTATION. The fix must CALL the existing executor, not restate it. A second
    discrimination path that drifted from `checkProofCommand`'s would be strictly worse than none.
  design: |
    (i) `check-acceptance` accepts `--base <ref>`, the same spelling and semantics as
        `check-proof --base`. Omitted, every line and exit code stays byte-identical to today, so
        no existing caller changes -- `dispatchAlertFixRun`'s `deps.checkAcceptance` binding
        included.

    (ii) With `--base`, each parsed criterion is run through the SAME entry point `check-proof`
         uses. The merge-base worktree is built ONCE for the whole body and torn down once, not
         per criterion -- N criteria must not build N worktrees.

    (iii) Per-criterion output gains one line, and it names the reviewer's own verdict word:

           [3] claim: ...
               proof: grep: band_meaning: span in plan/tasks.yaml
               discrimination: executed_stale -- matches base too; counts for nothing in review

    (iv) EXIT CODE FOLLOWS THE GATE, which is this verb's existing contract. Any criterion
         reporting `executed_stale` exits non-zero. A body whose proofs all discriminate keeps
         exit 0 and the existing OK line.

    (v) The summary line must not say OK when a criterion is stale. It states how many of N
        criteria discriminate.

    WHAT THIS TASK IS NOT. It does not change what the reviewer does, does not change any refusal
    text, and does not make `--base` mandatory -- an author working without a base ref gets exactly
    today's behaviour, and the verb stays usable where no worktree can be built.

    THE SUITE GOES IN test/check-acceptance-names-a-proof-that-discriminates-nothing.test.ts, kept
    out of files: for the reason W1-T3680 records: lint-plan's proof-unit-test-unresolvable rule
    requires a `unit test:` proof to resolve in the head tree once files: names a test/ path, and a
    filing ships no tests. The build adds the path to files: in the commit that creates the file.
  acceptance:
    - claim: "a criterion whose proof matches at the base ref too is reported as discriminating nothing rather than counted as OK"
      proof: "unit test: a criterion matching base too is named as discriminating nothing"
    - claim: "a body carrying any stale criterion exits non-zero, so a script gating on this verb cannot green-light a PR the reviewer will refuse"
      proof: "unit test: a body with a stale criterion exits non-zero"
    - claim: "omitting the base ref leaves every line and exit code as they are today, so no existing caller changes behaviour"
      proof: "unit test: check-acceptance without a base ref is unchanged"
    - claim: "the merge-base worktree is built once for the whole body rather than once per criterion"
      proof: "unit test: a four-criterion body builds one base worktree"
  falsifier: |
    Report OK on a proof that matches both trees and the first test must fail. Keep exit 0 while a
    criterion is stale and the second must fail. Change any line emitted without --base and the
    third must fail. Build a worktree per criterion and the fourth must fail.
