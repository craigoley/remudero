  falsifier: |
    Fake deps: a first full pass that never settles, the backstop a few poll intervals away, `checkLedgerCompaction`,
    `checkMeasurementCadence`, `checkRetroTrigger` and `checkAutoTriage` wired, and one task whose runOne stays in
    flight until the test releases it, well after the gate opens. At origin/main none of the four checks runs before
    the release (the throwaway repro in the rationale shows exactly this). With the change each runs at least once
    before the release. Remove the timer start from the gate-open path and the first test reds; drop the retro /
    auto-triage run point and the second reds; start the timer at boot instead of at the gate and the third reds.
