    - claim: Existing badge ranking preferences and immutable ledger lifecycle remain compatible
      proof: 'unit test: W1-T9244: complete proposal records preserve ranking and durable history ownership'
    - claim: The actual worker and cached HTTP read publish records without extra scans writes or provider calls
      proof: 'unit test: W1-T9244: default worker and HTTP serve complete cached proposals without side effects'
  falsifier: |
    Remove actual materialization of complete records while retaining rank generation:
    the empty-history default-worker/HTTP positive case must fail, not an import error.
    Remove identity/source/bounds checks independently; each refusal case must fail.
    Restore exact committed source and require native author/caller/census gates, complete
    physical TAP, same-tree changed-source instrumentation, discriminating diff coverage,
    actual GitHub stored-body parsing, current-head governed review and all required CI.
    Merge, runtime adoption, native parity readiness and console consumption are separate
    receipts. Filing this task is not implementation, adoption or live agent recovery.
