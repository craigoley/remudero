  rationale: |
    THIS BLOCKS THE RETRO LANE, NOT ONE PR. `docs/ORIENTATION.md` is regenerated by `rmd retro` on
    every run — its own header says so and says hand edits are overwritten — and it renders §12's
    standing rules verbatim via `extractStandingRules`. Rule 27 will be in every future rendering,
    so PR #3309 is not an unlucky retro; it is the first one after W1-T2456 landed, and every
    subsequent retro fails the same way.

    THE GATE IS NOT WRONG AND MUST NOT BE WEAKENED. `test/rule-15-16-filing-misattribution.test.ts`
    scans tracked files for a rule-15/16 citation carrying filing-doctrine vocabulary, and its own
    comment explains why the window is three lines rather than one: the original sweep was
    line-scoped and MISSED a case where "Rule 15:" sat on one line and "file a task" on the next. A
    citation does not stop being a citation because prose wrapped. That reasoning is correct.

    THE DEFECT IS THAT A PROXIMITY WINDOW IS A CLAIM ABOUT LINE BREAKS, AND A RENDERER OWNS THOSE.
    Rule 27 quotes the misattribution it retired; the quoted forms are stripped correctly by
    `stripQuotedSpans`. What survives is the BARE PROSE "rule 15 itself stands", which in the plan
    sits about ninety lines away from any wording about who may file — far outside any three-line
    window. Collapsed onto a single line, every part of a 108-line rule becomes adjacent to every
    other part, and the detector fires on an adjacency the source never had.
    SURFACE 1 physical lines rule 27 spans in the plan = 108
    SURFACE 2 physical lines the retro renderer collapses it onto = 1
    SURFACE 3 the citation gate's proximity window in lines = 3
    SURFACE 4 paths the citation sweep excludes = 2
    SURFACE 5 tracked files the gate flags at the retro head = 1

    THE REMEDY IS THE RENDERER, AND IT FIXES A SECOND THING. A verbatim copy should preserve the
    line structure of what it copies — that is what makes it verbatim. Collapsing 108 lines onto
    one also makes the rule unreadable in the very document whose stated purpose is that "a fresh
    Architect session should be able to orient from THIS doc alone". So preserving the breaks is
    not a workaround for a gate; it is what the renderer should have done, and the gate passing is
    a consequence rather than the goal.

    THE TWO ALTERNATIVES ARE NAMED AND REFUSED, WITH REASONS. (a) EXCLUDING `docs/` FROM THE SWEEP
    would blind the gate to every hand-written doc, and the sweep's exclusions are currently `plan`
    and `node_modules` only — narrow on purpose. (b) WIDENING OR CHARACTER-SCOPING THE WINDOW
    changes the detector's semantics for every file to accommodate one generated one, and the
    three-line choice is itself a measured fix for a real miss. Neither should be taken to spare a
    renderer from emitting newlines.

    NOT IN SCOPE: the gate itself, unchanged in both its window and its exclusions; §12 rule 27's
    wording, which is correct and whose bare "rule 15 itself stands" is exactly the clause a reader
    needs; and any other content `renderOrientation` emits.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: one src stem and its test, two distinct
    stems, and sizingViolation measures span rather than intent.
