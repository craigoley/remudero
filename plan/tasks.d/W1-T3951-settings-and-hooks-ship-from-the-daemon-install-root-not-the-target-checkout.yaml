- id: W1-T3951
  title: "OPERATOR RULING (bundle-with-daemon, fb-1789961451233-8554de, answering the grill fb-1789955524334-18bbf0): every `renderWorkerSettings({ templatePath: join(repoRoot, \"settings\", \"worker.json\"), hooksDir: join(repoRoot, \"hooks\"), ... })` call site in src/run-task.ts reads settings/worker.json and hooks off `repoRoot` — the TARGET checkout (`resolveRepoRoot`'s cwd-ascent) — instead of the fixed daemon install root, so a dedicated-repo target with no settings/hooks of its own hits ENOENT"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 8.00
  files: [src/run-task.ts, src/lib/worker.ts, test/config-fixture-path-parity.test.ts]
  origin: feedback#fb-1789961451233-8554de
  plan_refs: ["fb-1789955524334-18bbf0", "fb-1789961451233-8554de"]
  status: queued
  attempts: 0
  rationale: |
    GROUNDED at this triage pass. `src/lib/repo-location.ts`'s `repoRoot` is `resolveRepoRoot(argv,
    cwd)`: an explicit `--repo-root` flag, else `git -C cwd rev-parse --show-toplevel` — the TARGET
    checkout an operator or dedicated-repo Architect is standing in. `src/lib/install-root.ts` already
    exists and already resolves a SEPARATE, fixed daemon install checkout (`resolveInstallRoot`,
    `config.installRoot ?? join(config.root, "daemon-install")`), used correctly by
    `install-checkout`/`deploy` call sites in src/run-task.ts (lines ~29828-30124, verbatim comment
    there: "the install checkout ..., NEVER repoRoot — repoRoot is [the target]").

    EVERY WORKER-SETTINGS RENDER SITE DID NOT GET THAT MEMO. Grepped 2026-09-21: nine call sites in
    src/run-task.ts (`renderWorkerSettings({ templatePath: join(repoRoot, "settings", "worker.json"),
    hooksDir: join(repoRoot, "hooks"), ... })`, at minimum the triage/plan/inbox/retro/serve/onboard-
    recon/onboard-synthesize/alert-fix/fresh-review-runner call sites) all key off `repoRoot`, the
    TARGET checkout. fb-1789955524334-18bbf0 reproduced the resulting defect directly: triaging
    against a dedicated target repo (remudero-console) resolves target policy correctly, then
    `renderWorkerSettings` reads `<target>/settings/worker.json` and throws ENOENT, because the
    target repo legitimately ships no such file.

    fb-1789961451233-8554de is the OPERATOR'S ANSWER to that grill, choosing bundle-with-daemon
    explicitly: "Settings/worker.json and hooks ship from the fixed daemon install root, never a
    target checkout. Target root retains plan, feedback, Git identity, and mount policy." That
    resolves the ambiguity fb-1789955524334-18bbf0 raised (which of target-root vs. executor-root
    should own settings/hooks) in favour of the executor/daemon side — this task builds exactly that,
    nothing more.
  design: |
    (i) SWAP THE ROOT, NOT THE SHAPE. Every `renderWorkerSettings({ templatePath: join(repoRoot,
    "settings", "worker.json"), hooksDir: join(repoRoot, "hooks"), outPath: ... })` call site in
    src/run-task.ts becomes `join(installRoot, "settings", "worker.json")` /
    `join(installRoot, "hooks")`, where `installRoot = resolveInstallRoot(config)` — reusing the
    accessor already imported and used correctly by the install-checkout/deploy call sites a few
    thousand lines below in the same file. `outPath` (under `config.root/tmp/...`) is UNCHANGED: it
    is neither the target checkout nor the daemon install root, and already correct.

    (ii) TARGET ROOT KEEPS EXACTLY WHAT THE OPERATOR NAMED. `repoRoot` (plan, feedback, git identity,
    mounts — `mountsPath(repoRoot)`, `loadMounts`, plan file paths, `resolveOwnerRepo`) is NOT
    touched by this task. Only the settings/hooks pair moves. `mountsPath`/`loadMounts` call sites
    stay on `repoRoot` — mount policy is explicitly retained by the target per both feedback entries.

    (iii) `src/lib/worker.ts` already has a same-shaped precedent to follow: `installRootDir()`
    (line ~3184, `dirname(dirname(dirname(fileURLToPath(import.meta.url))))`) is used to locate
    `node_modules`/`git-credential-socket-helper.mjs` OFF THE INSTALL ROOT, never the target repo it
    is asked to operate on — this task's `renderWorkerSettings` fix is the same distinction applied
    to settings/hooks. No change to `worker.ts` is required unless a call site there also renders
    worker settings off `repoRoot`; the file is declared in `files:` to cover that check, not because
    a change there is assumed.

    (iv) PROVE A MOUNTS-ONLY TARGET WORKS, PER THE FEEDBACK'S EXPLICIT ASK. Add or extend a test
    (in test/config-fixture-path-parity.test.ts, or a case within it) that constructs a target repo
    fixture with a mounts file and NO settings/worker.json and NO hooks/ directory, drives a
    triage/plan/inbox-shaped path through `renderWorkerSettings`'s new call sites, and asserts it
    reads the settings TEMPLATE and hooks off the daemon install root fixture instead of failing
    ENOENT against the target — while the target's own mounts/plan/feedback paths are read from
    `repoRoot` unchanged (no policy weakening: the target's mount table is still what gates risk).

    NOT IN SCOPE: install-checkout/deploy call sites (already correct), redesigning
    `resolveInstallRoot`/`resolveRepoRoot` themselves, and any change to mount-policy resolution.
  acceptance:
    - claim: "renderWorkerSettings call sites read settings/worker.json and hooks from the daemon install root, not the target checkout"
      proof: "grep: resolveInstallRoot(config) in src/run-task.ts"
    - claim: "a target repo with mounts but no settings/worker.json can still render worker settings via the install root"
      proof: "unit test: test/config-fixture-path-parity.test.ts — a mounts-only target renders worker settings from the daemon install root"
  falsifier: |
    CLOSE IF `join(repoRoot, "settings", "worker.json")` no longer appears anywhere in
    src/run-task.ts's `renderWorkerSettings` call sites (`grep -n 'templatePath: join(repoRoot'
    src/run-task.ts` returns zero) AND a mounts-only target fixture with no settings/worker.json
    passes triage/plan/fix through the new test. CLOSE ALSO IF a prior task already made this exact
    swap — re-grep before starting.
  note: |
    `origin: feedback#fb-1789961451233-8554de` per this triage's requirement; `plan_refs` names both
    the original grill and this answering entry so a later reader can follow the decision chain
    without re-deriving it. `files:` lists exactly the paths this task's own design touches:
    `src/run-task.ts` (the nine-plus call sites), `src/lib/worker.ts` (checked for a same-shaped
    site, may end up an unused declaration if none is found — left in per the instructions to name
    every touched path, not to omit a path merely because the check may come back negative), and
    `test/config-fixture-path-parity.test.ts` (the mounts-only-target proof). `src/run-task.ts` is
    declared despite its size because this task's own rationale names concrete line ranges it edits;
    the file is not touched incidentally.
