    - claim: "The plan reload of serve, the production caller, composes both catalogs, and the test goes through that reload"
      proof: "grep: planDestinationRepository( in src/lib/serve-plan-reload.ts"
  rationale: |
    OBSERVED 2026-11-10: the board and serve read the public plan only, so an ops task would be invisible to the operator.
    - Readers: src/lib/serve-plan-reload.ts, src/lib/status-board.ts (it calls `loadPlan` on the public checkout) and src/lib/board.ts.
    - The operator ruled on 2026-11-10: a public pull request body and the public board may carry the title and the acceptance criteria of a task held in the private repository, and no other field of it. The rationale, the design notes, the evidence and every other field stay private.
    - This narrows the rule of W1-T11768 for those two fields only. W1-T11770 kept every byte of the ops catalog off the status board and off the views of serve. This task changes that for the two fields and for nothing else.
    - The id and the status of an ops task are already public: the id is in the trailer of its public pull request, and the status follows from the merge.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. This task adds no kind. It must merge before `task` is turned on.
  design: |
    Compose the plan in the plan reload of serve and in the status board. Mark each task with its catalog.
    Build the public row of an ops task from an explicit list of fields. Do not build it from the task object with fields removed, so that a new field of a task is private by default.
    The console at app.remudero.com needs a sign-in. The builder lists each surface that this task changes and says which ones are public. A surface that is not public may show more only if the operator says so.
    NOT IN SCOPE: the selector, the merge credit, and a new console screen.
  falsifier: |
    Read one catalog and criterion 1 must fail. Add the rationale of an ops task to the public row and criterion 2 must fail. Show zero for an unreadable catalog and criterion 4 must fail. Restore and require all six to pass.
