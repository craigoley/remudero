- id: W1-T2741
  title: "GITHUB CHECK FANOUT IS A FULL-SWEEP STORM — the signed webhook coalesces bytes on disk but every distinct terminal check still interrupts the daemon, producing up to sixteen complete sweep passes in one minute and hundreds of accepted wake rows during one CI wave"
  repo: remudero
  depends_on: []
