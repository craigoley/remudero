- id: W1-T11746
  title: "Declared compatibility invariants have executable acceptance proofs"
  repo: remudero
  depends_on: [W1-T120]
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1
  budget_usd: 15.00
  risk: high
  band_meaning: span
  origin: "operator follow-up to PR #17212: a compatibility guarantee was in design prose but had no independent acceptance proof"
  plan_refs: [W1-T9649, W1-T11627, W1-T120]
  files: [src/lib/task-linter.ts, src/run-task.ts, .remudero/skills/plan.yaml, test/plan/design-invariants-have-executable-acceptance-proofs.test.ts, test/a-blocked-task-must-name-its-disposition.test.ts, test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts, test/lint-plan-fast-scopes-to-the-merge-base.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED in PR #17212 review #5814165194: the reviewer said the new test moved legacy receipts from superseded
    into unknown, violating design constraint 2 that those outcome counts remain unchanged. The compatibility
    statement was in design prose, but not an independent acceptance claim with a discriminating proof. Once the
    binding projection proofs were repaired, the remaining acceptance could pass without preserving that invariant.
    W1-T11627/#17270 has since added the regression test for this exact legacy case; this task prevents the same
    plan-shape gap from silently recurring in future implementation tasks.

    The existing linter checks that acceptance proofs parse, resolve, and discriminate from base. It does not check
    that each explicit design invariant maps to a distinct executable acceptance claim. Add a small structured
    convention inside the existing design/acceptance fields, enforced only for new or changed plan records, and
    teach the plan authoring skill to enumerate affected legacy buckets, defaults, error/unknown paths, and output
    semantics. Historical tasks remain grandfathered. Do not infer semantic coverage from a keyword count.

    Distinct from W1-T120, which proves lint-plan read the intended plan file. This task checks that each invariant
    declared inside that correctly-read task file has its own acceptance proof. It depends on W1-T120 because both
    changes edit the plan-lint path; serializing them avoids overlapping builders.

    Settled by lookup: may files: grow to cover the three synthetic-fixture tests that regressed in exact-head
    preflight? -> yes, operator-approved files-only expansion; their fixture builders now declare NO-INVARIANTS
    with reasons, and implementation intent and acceptance scope are unchanged (PLAN-clarify-1794239724670 focus).
  design: |
    1. In an implementation task's design, authors declare each behavior-preservation or intentional-compatibility
       contract as INVARIANT <slug>: <statement>. When source behavior is entirely new, they explicitly write
       NO-INVARIANTS: <reason>. The planning skill instructs authors to inventory prior output buckets, legacy
       receipts, defaults, error/unknown behavior, and public side effects before choosing either form.
    2. In the diff-scoped lint-plan --base pass, require exactly one declaration form for each new/changed
       implementation task. The changed-task runner sets requireDesignInvariantDeclaration; the pure
       invariantSlugViolations helper enforces it. Every invariant slug must appear in exactly one acceptance claim as
       invariant:<slug>, and that claim must have a distinct non-empty proof using the existing proof dialect.
       Missing, duplicate, orphaned, or multiply-mapped slugs are blocking violations. NO-INVARIANTS requires a
       concise reason. Do not parse arbitrary prose or compare keyword counts.
    3. Keep old unchanged task records valid and leave whole-plan/dispatch behavior unchanged. Apply the new rule
       only to tasks in the changed-task pass; existing plan debt is not backfilled by this task.
    4. Preserve ordinary proof resolvability and base discrimination. A syntactically mapped proof still has to
       pass the existing proof checks; this rule adds design-to-acceptance coverage and does not waive any gate.

    INVARIANT proof-mapping: every declared design invariant on a new or changed implementation task maps exactly
    once to its own acceptance claim and executable proof.
    INVARIANT legacy-debt: the new check applies only to changed-task lint, leaving unchanged historical tasks valid.
  acceptance:
    - claim: "invariant:proof-mapping — every declared design invariant on a new or changed implementation task maps exactly once to its own acceptance claim and executable proof"
      proof: "unit test: test/plan/design-invariants-have-executable-acceptance-proofs.test.ts"
    - claim: "invariant:legacy-debt — missing, duplicate, orphaned and multiply-mapped invariant slugs fail the changed-task lint, while unchanged historical tasks remain unaffected"
      proof: "grep: invariantSlugViolations in src/lib/task-linter.ts"
    - claim: "the changed-task runner enables invariant declarations only for the new/changed task lint pass"
      proof: "grep: requireDesignInvariantDeclaration in src/run-task.ts"
    - claim: "the plan authoring instructions require a prior-behavior inventory and an explicit NO-INVARIANTS: reason when there is no inherited behavior to preserve"
      proof: "grep: NO-INVARIANTS: in .remudero/skills/plan.yaml"
  falsifier: |
    Remove the invariant-to-acceptance mapping check and a fixture with an orphaned or duplicate slug passes lint.
    Run the new rule outside changed-task scope and historical shards become newly failing. Remove the author instruction
    and a new plan can omit both an invariant inventory and an explicit no-invariants reason without notice.
  note: |
    Reservation held at refs/rmd-id/W1-T11746 for branch
    plan-file-review-finding-disposition-1794153325956. This task strengthens plan evidence only; it does not
    change review verdicts, merge gates, or any worker's authority.
