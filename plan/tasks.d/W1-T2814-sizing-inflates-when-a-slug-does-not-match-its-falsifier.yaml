      proof: "unit test: test/sizing-inflates-when-a-slug-does-not-match-its-falsifier.test.ts"
    - claim: "given a violation the own-falsifier carve-out could resolve, the message names that third exit AND the condition under which it applies — that the declared test is the suite proving THIS task's criteria — so a reader can tell whether it applies to them rather than reading it as permission to rename"
      proof: "unit test: test/sizing-inflates-when-a-slug-does-not-match-its-falsifier.test.ts"
    - claim: "deleting the message change reds a test by name, so the new text is load-bearing rather than decorative"
      proof: "unit test: test/sizing-inflates-when-a-slug-does-not-match-its-falsifier.test.ts"
    - claim: "the census predicate re-runs at build time through the linter's OWN subsystemsOf and records its measured count, and the stated abandonment floor is asserted against that measurement rather than against a number copied from the filing note"
      proof: "unit test: test/sizing-inflates-when-a-slug-does-not-match-its-falsifier.test.ts"
    - claim: "the carve-out itself is unchanged — a task declaring a test that is NOT its own falsifier still spans two subsystems and is still refused, so naming the third exit never widened the gate it explains"
      proof: "unit test: test/sizing-inflates-when-a-slug-does-not-match-its-falsifier.test.ts"
  note: |
    FILED 2026-09-04, from W1-T2809's own filing tripping this rule. The sequence is the evidence:
    the violation fired, the message offered "regrade to risk:high", regrading would have silenced
    it, and only reading `subsystemsOf` revealed that the real remedy was a rename — a remedy the
    message does not mention. W1-T2799's filing took the regrade exit EARLIER THE SAME SESSION and
    took it correctly (it spans two genuine source stems, escalate and run-task), which is why the
    two cases together are the falsifier pair rather than one anecdote: the same message, two
    tasks, two different correct answers, and no way to tell them apart from the text.

    SIBLINGS, DELIBERATELY NOT FOLDED IN: W1-T2809 (census discovery's single-idiom blindness — the
    task whose filing surfaced this) and W1-T2790's ordering, which governs how a recognizer should
    be built, not how a diagnostic should be worded. Each is its own concern under Rule 19.
