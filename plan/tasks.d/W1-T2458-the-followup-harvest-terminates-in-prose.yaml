    ── Q2. WHAT A ROUTED FOLLOW-UP WOULD CARRY AS EVIDENCE — AND WHY IT IS NOT AN ANCHOR ─────────

    `Proposal` requires `evidenceAnchors: EvidenceAnchor[]`, and `EvidenceAnchor` is
    `{description, pattern, path?}` where `pattern` is a literal or regex `git grep` checks on the
    target ref. A `FollowupEntry` is `{type, text}`: FREE PROSE WITH NO PATTERN. So a
    follow-up-minted proposal would ship `evidenceAnchors: []` — EXACTLY the board-review family's
    defect that W1-T2451 had to add `originatingItemId` to work around, and that expiry is W1-T2451's
    to own, not this task's.

    `FollowupCandidate` already carries `entryId`, `runId`, `taskId` and an optional `prUrl`.
    ⚠ THAT IS A REFERENT, NOT AN ANCHOR, AND THE DISTINCTION IS THE WHOLE ANSWER. A referent says
    WHERE THE CLAIM CAME FROM; an anchor says WHAT IS STILL TRUE ON A REF. `git grep` cannot check a
    run id. So `runId`/`taskId`/`prUrl` is sufficient for ATTRIBUTION and for the
    `originatingItemId`-shaped retirement W1-T2451 already built — a follow-up whose PR merged and
    whose text no longer matches anything is retirable by referent — and it is NOT sufficient for
    `classifyProposal`'s evidence arm, which greps `pattern`. Any routing must therefore either
    synthesise a pattern from the entry text (which the entry does not guarantee) or route through
    the referent arm and accept an empty anchor set knowingly. Naming which of the two is the
    deliverable is this task's first decision, and it is not made here.

    ── Q3. THE TAP IS SMALLER THAN FEARED, AND THE DEDUP THAT WOULD MEET IT IS INERT ─────────────

    2,115 declared entries, not 15,642 — the first thing sizing the tap changes is the size.

    `mineFollowups` HAS its own dedup and it is doing nothing: `followup.deduped` reads 2 rows
    against 3,068 distinct `followup.harvested` entry harvests (deduped by ts+run_id+entry_id) —
    0.1%. WHY IS THE CHEAP NEXT READ AND IT IS ANSWERED HERE BY READING THE PREDICATE: the dedup has
    two arms, a `processed` Set of entry ids already harvested, and `followupMatchesTitle` against
    OPEN TASK TITLES ONLY. The first arm suppresses re-harvest, not duplication between distinct
    entries; the second compares free prose to task titles, which is the same paraphrase-blind
    comparison W1-T2455's own measurement found — its refusal caught 3 of 32 because "2-shingle
    Jaccard over a kebab slug does not see paraphrase". THAT FIGURE IS W1-T2455's AND IS CITED, NOT
    RE-DERIVED HERE.

    SO THE HONEST ESTIMATE OF WHAT SURVIVES A REFUSAL BUILT ON THAT MECHANISM IS: NEARLY ALL OF IT.
    Both existing filters compare a prose sentence against a slug or a title, and neither sees
    paraphrase, so a tap opened onto 2,115 entries would deliver close to 2,115 candidates rather
    than a deduplicated few. NO NUMBER IS ASSERTED BEYOND THAT BOUND, because measuring the real
    survival rate requires running the refusal over the entries, which is a build step, not a recon
    one — and stating a fraction without running it would be the assumption this record exists to
    stop.

    ── Q4. THE THREE KINDS DO NOT ROUTE, AND THE TYPE HAS NO DEFINITION TO ROUTE ON ──────────────

    `FollowupEntry.type` is `"research" | "task" | "action"`. NOTHING IN `src/` BRANCHES ON IT. The
    only `.type ===` comparisons against those literals are in `src/lib/serve.ts`'s command palette,
    a different `r.type` over search results. The single read of a follow-up candidate's type is
    `renderFollowupCandidates` rendering a display label.

    ⚠ AND THE TYPE CANNOT BE GIVEN ROUTING SEMANTICS WITHOUT A DEFINITION FIRST. `parseFollowups`'s
    own doc introduces the three only as PARSE PREFIXES — one typed entry per line, an optional
    bullet tolerated, a line naming none of the three silently skipped — and says nothing about what
    any of them MEANS. The worker picks the prefix. So "research should become a proposal and task
    should become a task" is a guess dressed as a reading: the words suggest a routing the contract
    never defined. IF THE THREE SHOULD ROUTE DIFFERENTLY, DEFINING THE TYPE IS THE FIRST
    DELIVERABLE, and a build that branches on today's undefined labels would encode the guess.

