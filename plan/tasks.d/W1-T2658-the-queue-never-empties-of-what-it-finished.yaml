- id: W1-T2658
  title: "THE QUEUE NEVER EMPTIES OF WHAT IT FINISHED — the retro compresses MASTER-PLAN every 25 merges and nothing compresses plan/tasks.d; add rmd archive-merged, a policy-gated rung that renames credited shards into plan/merged.d and opens the plan PR the operator gates, proving each move in the PR's own acceptance block"
  repo: remudero
  depends_on: [W1-T2657]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 75.00
  rationale: |
    RE-DERIVED AT 74e130251 (2026-09-02); the population figures are W1-T2657's and are not
    repeated. What this task adds is the CLOCK and the WRITER — the two things W1-T2657 deliberately
    leaves out.

    (1) THE RETRO ALREADY HAS THE DISCIPLINE, POINTED AT THE WRONG FILE. MASTER-PLAN §8A makes
    compression a deliverable; `retro.mergesThreshold` (plan/policy.yaml, lifted from
    `DEFAULT_RETRO_MERGES_THRESHOLD` in src/lib/retro.ts) fires the retro every 25 merges and its
    plan-only PR folds, sharpens and retires MASTER-PLAN text. plan/tasks.d has no sibling: at 86
    merges on 2026-09-01 the retro ran roughly three times and moved nothing out of the queue, which
    is why 84% of it is done-work. This is a rung with a cadence, not a one-off sweep — W1-T367
    refused the sweep because it "would be stale again next merge", and a clock is the answer to
    that objection, not a bigger sweep.

    (2) THE MOVE IS JUSTIFIED BY CREDIT, NEVER BY THE FIELD. The selector is the projection the
    dispatch path already trusts — `projectPlan` (src/lib/status.ts) — and only its strongest
    sources: `merged: true` with `prState` confirmed `merged` by GitHub, or `source: "correction"`
    (an operator's `rmd correct`). The yaml `status:` is never read (W1-T367 stands). A `throttled`
    or `none` read, a missing projection, or the monotonic-under-darkness fallback (W1-T179) moves
    NOTHING and ledgers why: a rename made on a stale read is a task that vanishes from the queue
    while still open, the one outcome worse than the queue we have. Retired shards
    (`status: blocked` + `retirement:`) stay where they are — they are operator records, not merged
    work, and W1-T1287 owns their taxonomy.

    (3) THE WRITER IS A RENAME, AND THE PR PROVES ITSELF. `git mv plan/tasks.d/<id>-<slug>.yaml
    plan/merged.d/<id>-<slug>.yaml`, content byte-identical, so every comment survives — the
    property W1-T367's first reason protects. The plan PR is opened through the approve path's own
    gateway (`RatifyGateway`: `createRatificationBranch` then `openPlanPr`, src/run-task.ts) rather
    than a second hand-rolled opener — the lesson W1-T2296 recorded. Its body carries one executable
    acceptance line per moved shard, anchored on the NEW path (`grep: - id: <id> in
    plan/merged.d/<file>`), so the reviewer's own executor discriminates head from base for every
    move without a human diffing 40 renames. The PR is plan-only by construction, so `planOnly`'s
    carve-out applies and the proofs still execute (W1-T205, #877).

    (4) LAW 5 AND RULE 15, BY CONSTRUCTION. The rung acts within a policy the operator ratifies
    once: `archiveMerged.enabled` is read absent-means-OFF, so this task ships inert and the
    enabling row is a policy PR the operator merges — the same fail-inert shape W1-T2579 uses for
    the arm bands. It mints nothing and files nothing (Rule 15): a rename is not a filing, and the
    PR it opens is the operator's to merge, exactly as every retro PR is. It never touches
    auto-merge; whether the sweep later arms a plan-only PR is the sweep's existing policy, not this
    rung's.

    (5) THE CADENCE AND ITS FLOOR. `decideMeasurementCadence` (src/lib/measurement-cadence.ts) with
    its own marker file, the shape `digestCadenceCheck` (src/lib/digest.ts) already copies:
    `archiveMerged.{enabled, minIntervalMinutes, maxPerDay}` plus `minShards`, a floor on how many
    movable shards must exist before a PR is worth the operator's click. The default floor is 25 —
    the retro's own merge threshold, for the same reason: below it the PR is noise. A firing that
    finds fewer than the floor ledgers `archive.skipped` with the count and moves nothing.
  design: |
    (i) ONE MODULE, PURE CORE. `src/lib/archive-merged.ts` exports `planArchiveMoves(plan,
    projection, policy)` — a pure function from a loaded `Plan` and a projection map to a list of
    `{taskId, from, to, prUrl, source}` moves plus a `refused` reason when the read cannot be
    trusted — and `archiveMergedRung(deps)`, which reads the cadence marker, calls the core, performs
    the renames in a fresh worktree cut from origin/main, and opens the PR through the injected
    gateway. `rmd archive-merged [--write]` is the operator's hand route over the same core;
    without `--write` it prints the moves and touches nothing.

    (ii) LEDGER ROWS CARRY THE DECISION THAT PRODUCED THEM. `archive.moved` (one row per move:
    task_id, from, to, pr_url, source), `archive.skipped` (below the floor, with count),
    `archive.refused` (darkness, throttled, missing projection — with the reason from the read that
    refused, never from a later gate), `archive.pr_opened` (the PR url and the move count). The
    outcome and the reason come from the same decision, per the #981 rule.

    (iii) WHERE IT PLUGS IN. Beside `measurementCadenceCheck` and `digestCadenceCheck` in
    src/run-task.ts's daemon tick, gated first on the policy row, then on the cadence, then on the
    floor, then on the projection's health — each gate ledgering its own refusal.

    (iv) DEPENDS ON W1-T2657 for the loaders, the dispatch refusal and the id gates; this task adds
    no reader of its own beyond the core's use of `Plan.byId` and `task.archived`.

    (v) WHAT DOES NOT CHANGE. No shard's text. No status field. plan/tasks.yaml. Credit derivation.
    The retro's own PR. Auto-merge policy.
    WITHDRAWN 2026-09-02 — this task implements candidate (b), archive-on-credit, which the
    W1-T1260 ruling did not authorise (recorded in DECISIONS.md, 2026-09-02). W1-T1260 records (b) as
    undecided in either direction, needing a blast-radius measurement over every plan_refs /
    satisfied_by pointer, loadPlan's corpus and the id-mint sweep that no shard has taken. Withdrawn
    unbuilt, not refuted: if that measurement is taken and the operator ratifies (b), this is the
    design to revive.

  acceptance:
    - claim: "the mover selects only shards the projection reports merged with a GitHub-confirmed PR state or an operator correction, never from the yaml status field"
      proof: "unit test: test/archive-merged.test.ts"
    - claim: "a throttled, missing or darkness-fallback projection moves nothing and ledgers the refusal with the read's own reason"
      proof: "unit test: test/archive-merged.test.ts"
    - claim: "a move is a rename with byte-identical content so every comment in the shard survives, and a retired shard is never moved"
      proof: "unit test: test/archive-merged.test.ts"
    - claim: "the rung is off when the policy row is absent, fires only inside its cadence, and skips below the movable-shard floor"
      proof: "unit test: test/archive-merged.test.ts"
    - claim: "the opened plan PR carries one executable acceptance line per moved shard anchored on its new path"
      proof: "unit test: test/archive-merged.test.ts"
    - claim: "the rung has its production call site in the daemon tick"
      proof: "grep: archiveMergedRung( in src/run-task.ts"
  risk: high
  band_meaning: span
  origin: "oper#follow-up-brief-2026-09-02"
  plan_refs: ["W1-T2657", "W1-T367", "W1-T2579", "W1-T2296", "W1-T1287", "§8A", "§12"]
