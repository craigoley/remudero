  retirement: withdrawn
  attempts: 0
  note: |
    risk:high, band_meaning:span — a new module plus the daemon tick plus a policy schema row are
    three concerns under Rule 19; the runtime blast radius is one plan-only PR per firing, moving
    files whose implementations already merged, gated by a row that ships absent.

    NOT A SUBSTITUTE FOR THE FIELD. After this rung runs, a live shard's `status: queued` is true
    because the shard is live, and a merged shard is in merged.d because it merged; the field is
    still decorative and the header ruling still stands. The window between a merge and the next
    firing (at most the cadence) leaves a merged shard in tasks.d looking exactly as it looks today
    — never worse, and the direction refresh's status-truth ask is met by location, not by a writer.

    FIRST RUN IS THE OPERATOR'S. With the row enabled, the first PR will carry on the order of
    seven hundred renames (W1-T2657 rationale (1)); the floor does not cap a firing's size, because
    capping it would leave the queue half-compressed for weeks. The operator may prefer to run
    `rmd archive-merged --write` by hand once and let the cadence carry the rest; both paths are one
    core, so the PR is the same either way.
