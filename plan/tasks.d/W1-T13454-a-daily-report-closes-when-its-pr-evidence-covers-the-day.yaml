    - W1-T13442
  files:
    - src/lib/daily-progress-collector.ts
    - test/console-api/read-model/a-daily-report-closes-when-its-pr-receipt-lands-mid-pass.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A complete PR receipt written after the pass began but before its files were read certifies the closed day, and the job's closedThrough advances"
      proof: "grep: W1-T13454 criterion 1 in test/console-api/read-model/a-daily-report-closes-when-its-pr-receipt-lands-mid-pass.test.ts"
    - claim: "A merge stamped after the pass began but before its rows were read is an event, not an invalid row"
      proof: "grep: W1-T13454 criterion 2 in test/console-api/read-model/a-daily-report-closes-when-its-pr-receipt-lands-mid-pass.test.ts"
    - claim: "invariant:no-false-complete — a receipt stamped after the files were read is still refused as newer than the cutoff, and the day stays open"
      kind: guard
      proof: "grep: W1-T13454 criterion 3 in test/console-api/read-model/a-daily-report-closes-when-its-pr-receipt-lands-mid-pass.test.ts"
    - claim: "A MERGED row with no mergedAt whose updatedAt precedes the report window is skipped; one updated inside the window still makes the source partial"
      proof: "grep: W1-T13454 criterion 4 in test/console-api/read-model/a-daily-report-closes-when-its-pr-receipt-lands-mid-pass.test.ts"
  rationale: |
    WHY: the daily-progress jobs on the Azure host have closedThrough 2026-10-26 (OBSERVED 2026-11-17), so every pass
    re-collects three weeks and outruns its deadline (W1-T13442 bounds the cost; this task removes the cause).
    OBSERVED on the host's closed-PR board caches: 8,452 core, 131 site and 561 console MERGED rows carry no mergedAt.
    collectDailyProgress counts each as invalid, and one invalid row makes every required PR source partial for every
    date, so no day can close. OBSERVED for the console: its closed-PR receipt is rewritten about every minute and is read
    minutes into the pass (behind core's ledger read), so validClock (lastAttemptAt <= the pass's start) fails with
    "The source receipt is newer than this report's cutoff."
  design: |
    INVARIANT no-false-complete: a source is complete only for evidence that existed when its files were read.
    1. Per repository, after its board files are read, take now = max(pass start, clock.now()). That repository's
       validity checks, cutoffs, generatedAt, observedAt and job stamps use it; today and yesterday stay the pass's.
    2. A MERGED row with no mergedAt and an updatedAt before the report window's start is skipped for that date
       (GitHub moves updated_at at a merge, so it merged before the window). Without updatedAt, or updated inside or
       after the window, it still counts invalid.
  falsifier: |
    Judge at the pass's start: criteria 1 and 2 fail. Drop the updatedAt skip: criterion 4 fails. Read now before the
    board files: criterion 3 still passes, criteria 1 and 2 fail.
