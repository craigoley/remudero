      proof: 'grep: test("W1-T10832: the refresh passes the private consent file only when it is owner-only" in test/deploy/the-field-trials-refresh-passes-the-host-consent-file.test.ts'
    - claim: "with a candidate and no open import PR the pass opens one ready site PR through the REST writer on a non-fleet branch; with one open it updates that PR instead of opening a second"
      proof: 'grep: test("W1-T10832: a field-note candidate keeps exactly one site import PR open" in test/routing/a-field-note-candidate-opens-one-reviewed-site-pr.test.ts'
    - claim: "core never writes reviewedBy, reviewedAt or publishedAt into the staged note, and no code path arms, enqueues, approves or merges the site PR"
      proof: 'grep: test("W1-T10832: core stamps no review fields and nothing merges the site PR" in test/routing/a-field-note-candidate-opens-one-reviewed-site-pr.test.ts'
    - claim: "a stage-mode refusal is recorded in the refresh row and opens no PR, and an unchanged outcome opens no PR and writes nothing"
      proof: 'grep: test("W1-T10832: a refused or unchanged stage opens no PR" in test/routing/a-field-note-candidate-opens-one-reviewed-site-pr.test.ts'
    - claim: "the field-trials command drives the site import through the new module"
      proof: 'grep: syncFieldNoteSiteImport( in src/lib/field-trials-flow.ts'
  falsifier: |
    At base every case fails: the refresh passes no --consent and nothing opens a site PR.
    - Pass --consent whenever the path exists, symlink or group-readable: the owner-only case fails.
    - Open a new PR per pass: the one-open-PR case fails.
    - Stamp reviewedBy or reviewedAt in core, at candidate time or from any review: the no-stamp case fails.
    - Call `gh pr merge` or enable auto-merge anywhere on this path: the nothing-merges assertion fails.
    - Validate in core and skip the site stage mode: the refusal case fails.
    - Treat the unchanged exit code as staged: the unchanged half of that case opens a PR and fails.
    GUARDS that held at base and must still hold:
    - test/field-trials-flow.test.ts (withheld without consent, revocation, refusal on a private join key);
    - test/plan-pr-emitter.test.ts (the REST create and probe argv).
    Each guard's existing case must fail when its production branch is removed, and pass again with zero
    failures once it is restored.
