  rationale: |
    READ 2026-10-27: core origin/main 07dbdcc77, remudero-site main b80fbbb, the host read-only.

    TODAY. deploy/field-trials-refresh.sh (installed copy blob ab84b6cd = main) runs `rmd field-trials`
    with no --consent; the 10-18 log reads `release: withheld (no-consent-receipt) ... nothing published`.
    The host's private directory /home/craigoleyagent/rmd-state2/state/field-trials holds no consent file.
    CONSENT. Craig approved a field-trials-consent-v1 file at ~13:45Z on 2026-10-27, granting
    aggregate-opt-in for craigoley/remudero, craigoley/remudero-console and craigoley/remudero-site, each
    with receipt "owner-2026-10-27-craig-oley". The approved copy is on the operator Mac at
    ~/Remudero-notes/field-trials/field-trials-consent-v1.json, sha256
    e117b3d1fc83c97f23577c2156c870896a53367804562124424dd489cf5b6fbd; it validates under
    parseFieldTrialsConsent (src/lib/field-trials-flow.ts). The site's registry (lib/field-trials-consent.ts,
    revision owner-2026-09-25-v1) already lists remudero, remudero-console and remudero-site as active
    aggregate-public; it names repos without the owner prefix, so the exporter maps owner/repo to the repo
    name.
    THE SITE SIDE IS BUILT. PORTAL-T37 shipped the importer (remudero-site #178, #181): it validates a
    reviewed aggregate, refuses overlap and chains a history, and its design reserves the daily candidate PR
    for "after the core exporter is proven", never auto-merged. Nothing in the site repo schedules an import
    (no workflow names the importer; no open branch is a field-note branch).
    THE SITE STAGE MODE (PORTAL-T41, filed in remudero-site PR #201, branch plan-file-1793108648359, read
    2026-10-27). It gives scripts/import-model-field-note.mjs a non-interactive stage mode with three outcomes,
    each with a distinct exit code: staged, unchanged (the candidate is the release already recorded; nothing
    is written) and refused (the validator's reason; nothing is written). It also writes a reviewer summary
    built only from public fields. It makes the owner's MERGE of the import PR the review, so a
    machine-staged note never claims reviewedBy owner before a review has happened. ORDER: a depends_on link
    across repos cannot be expressed, so this task's site-PR step runs only after PORTAL-T41 has merged on
    site main. Until then the pass stops after the W1-T10831 candidate and records
    `site-stage-mode-unavailable` in the field-trials.refresh row.
    THE EXISTING WRITER PATH. src/lib/plan-pr-emitter.ts already opens and probes PRs over REST
    (probeExistingPlanPr, createPlanPrRest: `gh api --method POST repos/{owner}/{repo}/pulls`) through an
    injected GhApiFetcher, and the refresh's GitHub step already runs with the fleet GitHub App credentials
    (GH_APP_ID, GH_APP_INSTALLATION_ID, GH_APP_PRIVATE_KEY_PATH from remudero-daemon). No cross-instance
    handoff that carries a data payload to the site instance's lane was found, so this uses the REST path.
  design: |
    1. CONSENT PATH. The durable host path is the core private directory:
       /home/craigoleyagent/rmd-state2/state/field-trials/field-trials-consent-v1.json (in the container,
       /home/node/Remudero/state/field-trials/field-trials-consent-v1.json). The refresh passes it as
       --consent when it is a regular, non-symlink, owner-only file, honouring an RMD_FIELD_TRIALS_CONSENT
       override; absent means today's `withheld (no-consent-receipt)`, never a failure of the other steps.
       The file is NOT committed (it is the owner's grant, not code). Print this operator copy command in the
       implementation PR exactly, and never run it from a session:
         scp ~/Remudero-notes/field-trials/field-trials-consent-v1.json remudero:/home/craigoleyagent/rmd-state2/state/field-trials/field-trials-consent-v1.json && ssh remudero 'chmod 600 /home/craigoleyagent/rmd-state2/state/field-trials/field-trials-consent-v1.json && sha256sum /home/craigoleyagent/rmd-state2/state/field-trials/field-trials-consent-v1.json'
       The printed digest must equal e117b3d1fc83c97f23577c2156c870896a53367804562124424dd489cf5b6fbd.
       A revoked or removed receipt withdraws that repo from the next candidate (the existing
       revokeWithdrawnConsent path).
    2. AFTER A GOOD REFRESH (the snapshot step ok per W1-T10830's step states), run the W1-T10831 exporter.
       A withheld result ends the pass with its reason in the field-trials.refresh row.
    3. ONE OPEN SITE PR. With a candidate, run PORTAL-T41's stage mode of the site's own
       scripts/import-model-field-note.mjs in a fresh checkout of site main, so the site's validator,
       overlap rule and lineage chain decide. Act on its exit code:
       - staged: open or update ONE ready (never draft) PR on craigoley/remudero-site. Use a branch outside
         every fleet branch pattern (not run-*, plan-file-*) and no Remudero-Task trailer. Find an existing
         PR with probeExistingPlanPr; open a new one with createPlanPrRest. The PR carries only the two data
         files the stage mode changed, and its body is the stage mode's reviewer summary.
       - unchanged: open no PR and change nothing.
       - refused: record the reason. Open no PR and do not work around the refusal.
       A newer candidate while the PR is unmerged replaces its contents with one window from the last
       RELEASED windowEnd, so there is never a second open import PR or an overlapping window.
    4. THE OWNER'S MERGE IS THE REVIEW: ONE OWNER TOUCH. Core never writes reviewedBy, reviewedAt or
       publishedAt, and never edits the staged note; PORTAL-T41's stage mode owns those fields. No
       automation arms, enqueues, approves or merges the PR; the owner merges it. Verify the site
       instance's sweep does not arm a PR on this branch shape, and pin that with a test. A PR left
       unmerged past the page's 72 h historical label stays open and is refreshed, never merged.
    syncFieldNoteSiteImport in the new src/lib/field-trials-site-import.ts owns steps 3 and 4; the
    `rmd field-trials` command calls it after the exporter.
    5. Every outcome (withheld, candidate, site-stage-mode-unavailable, staged with PR opened or updated, unchanged, refused by the importer) is in
       the field-trials.refresh row. Prove the App installation can push a branch and open a PR on
       remudero-site under the SERVICE identity before relying on it; if it cannot, the row says so and the
       PR reports the exact grant the operator must add.
    6. ONE PR, MORE THAN ONE DATA FILE (amended 2026-10-27). W1-T10878 adds a second candidate,
       data/model-guidance.json, to this same pass. syncFieldNoteSiteImport must not assume the PR holds only the
       field note: it carries whatever data files the site's stage mode staged, still as ONE open import PR,
       and its body is the stage mode's summary. This task ships the field note only; W1-T10878 wires the
       second file.
  acceptance:
