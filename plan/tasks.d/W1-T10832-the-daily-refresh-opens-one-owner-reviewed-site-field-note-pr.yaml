- id: W1-T10832
  title: "THE DAILY FIELD-TRIALS REFRESH NEVER REACHES THE SITE — it passes no --consent and publishes nothing, so a public note would need a hand PR every day before the page's 72 h historical label; after a good refresh with the owner's consent file present, core writes the field-note candidate and keeps one site import PR open through the existing REST writer, and only the owner merges it"
  repo: remudero
  depends_on: [W1-T10830, W1-T10831]  # needs a refresh that survives and ledgers its steps, and the exporter's candidate
  type: implement
  verify: auto
  principles: { tdd: strict }
