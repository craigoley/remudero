  design: |
    1. `rmd test-move <folder> [--dry-run]`, registered in src/run-task.ts as testMoveCommand, works on a fresh worktree
       of origin/main.
       - Candidates: the rows scripts/test-placement/test-folders.tsv (W1-T9874) assigns to <folder> or its second
         levels, plus any test added since whose placeTest says <folder>. They are regenerated on every run; no stored
         diff is ever replayed.
    2. SKIP SET.
       - Every file touched by an open PR. This takes ONE GitHub read per wave (a paged list of open PRs with their
         files), paced by the shared read floor.
       - Every file a run-*/fix-* branch head changes against its merge base. This is a git-only read: ls-remote plus
         diff.
       - Every file that is not location-free by W1-T9864's guard.
       - Every file whose basename is not unique.
       Skipped files are listed in the PR body by reason.
    3. MOVE COMMIT. It holds only `git mv`, with byte-identical content. The tool asserts that
       `git diff -M100% --name-status` shows only R100 for every moved test, and refuses otherwise.
    4. RE-KEY COMMIT, the second commit in the same PR.
       - Every path-keyed file above is rewritten old -> new, with values preserved and rows never deleted.
       - census-precheck's parity judgement becomes rename-aware: a row whose path this diff renames, with identical
         values, is not growth.
       - The tool asserts that no key in those files names an absent path afterwards.
    5. BUDGET. The tool measures git's rename pairing on the prospective diff in a scratch clone. If any moved file
       fails to pair as R100, it halves the batch until all do, and leaves the rest for the next run of the same wave.
       There is no fixed file count.
    6. RECORD.
       - Append the move commit's SHA to .git-blame-ignore-revs, preceded by a line `# test-move <folder> <task id>`.
         The file is created by the first wave.
       - Append one compact JSON line (JSON.stringify, no spaces) to scripts/test-placement/waves.ndjson, beginning
         {"folder":"<folder>","task":"<id>","base":"<sha>","moved":n,"skipped":{...}}.
       - Write a ledger row, step `test.move`, with the same fields.
    7. --dry-run prints the plan and writes nothing. The tool never pushes or merges; the wave task's normal PR flow
       does.
    New test under test/ci/.
