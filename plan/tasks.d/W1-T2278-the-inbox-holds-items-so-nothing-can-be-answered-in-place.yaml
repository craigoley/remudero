    - claim: "no code path advances a record to a closed state without an operator message causing it"
      proof: "unit test: test/feedback-thread-survives-a-reply.test.ts"
    - claim: "no route added by this change files work, merges, closes a pull request, or rejects on the operator's behalf"
      proof: "unit test: test/feedback-thread-survives-a-reply.test.ts"
