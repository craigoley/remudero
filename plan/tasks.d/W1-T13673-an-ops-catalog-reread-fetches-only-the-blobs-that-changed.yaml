  acceptance:
    - claim: "Two readOpsCatalogSnapshotAsync reads through one api, where between them the branch moves to a commit that changes exactly one shard, send exactly one git/blobs GET on the second read (the changed shard) and return outcome ok with the changed task"
      proof: "grep: W1-T13673 criterion 1 in test/github/an-ops-catalog-reread-fetches-only-the-blobs-that-changed.test.ts"
    - claim: "A second read through the same api at the same commit sends no git/blobs GET, and its task list, binding and identityDigest equal the first read's"
      proof: "grep: W1-T13673 criterion 2 in test/github/an-ops-catalog-reread-fetches-only-the-blobs-that-changed.test.ts"
    - claim: "invariant:same-catalog-as-a-cold-read — for the same commit, a read that uses kept blobs returns the same outcome, task list, binding and identityDigest as a read of the same answers through a new api that has kept nothing"
      kind: guard
      proof: "grep: W1-T13673 criterion 3 in test/github/an-ops-catalog-reread-fetches-only-the-blobs-that-changed.test.ts"
    - claim: "invariant:only-verified-bytes — a blob answer that fails any existing check (sha, encoding, base64 shape, size, the git SHA-1) is refused exactly as on origin/main and is not kept, so the next read sends that blob's GET again; a kept blob is used only for the same api, the same repository id and the same blob sha; no blob byte is written to a file"
