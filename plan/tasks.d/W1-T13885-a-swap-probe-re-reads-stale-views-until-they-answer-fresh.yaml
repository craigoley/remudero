- id: W1-T13885
  title: "A swap probe re-reads the views that answered stale or failing until they answer fresh, so each serve swap records how long its views took to recover"
  repo: remudero
  depends_on: [W1-T13832]
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # Rule 19 sizing: one concern (follow-up rounds of the existing swap probe) in serve-swap-probe.ts plus one option passed from serve.ts; the first probe row and the demand tallies are unchanged
  band_meaning: span
  origin: "human#2026-11-19-serve-swap-evidence"
  plan_refs:
    - W1-T13832
    - W1-T13602
  files:
    - src/lib/serve-swap-probe.ts
    - src/lib/serve.ts
    - test/console-api/views/a-swap-probe-re-reads-stale-views-until-they-answer-fresh.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A swap probe whose views answer stale re-reads only those views after 15 s, 60 s and 240 s, and the first round in which they all answer 200 fresh writes serve.swap_probe with round, sinceSwapMs and settled true"
      proof: "grep: W1-T13885 criterion 1 in test/console-api/views/a-swap-probe-re-reads-stale-views-until-they-answer-fresh.test.ts"
    - claim: "invariant:bounded-settle — at most three follow-up rounds per swap; a swap whose views all answer fresh writes none; a newer swap probe cancels the older swap's pending rounds; a last round that is still stale writes settled false"
      kind: guard
      proof: "grep: W1-T13885 criterion 2 in test/console-api/views/a-swap-probe-re-reads-stale-views-until-they-answer-fresh.test.ts"
    - claim: "serve.ts gives the swap probe the pending-round handle that lets a newer swap cancel an older swap's rounds"
      proof: "grep: settle: swapProbeSettle in src/lib/serve.ts"
  rationale: |
    WHY: W1-T13832 (#19724, 29866f658) made each serve swap read every served view once. OBSERVED on the host, first live
    row: serve.swap_probe at 2026-11-19T22:52:13.509Z (ledger.2026-11-20T00-20-28-609Z.ndjson.gz), trigger cold_start,
    generation 1, sha f43e0fb14, ms 909. agent, repositories, read-model and instances answered 200 ok with stale true;
    only inbox-threads was fresh; inbox-thread was no_key. Traffic moved 45 s later (serve.recycle_swapped 22:52:58Z).
    The next serve.demand rows (from 22:57:12Z) hold views_probe and no client views section, so nothing records when
    those four views became fresh, or whether clients ever read them stale. One read at swap time shows the state at the
    swap, not the recovery.
    READ at origin/main 1584806f3: src/lib/serve-swap-probe.ts runSwapProbe reads each served view once, writes one row and
    returns it; its `seen` set ignores a repeat for the same generation and trigger. src/lib/serve.ts binds the generation
    hook swapProbe to runSwapProbe with `seen: swapProbesRun`.
  design: |
    INVARIANT bounded-settle: a swap writes at most 1 + 3 serve.swap_probe rows; follow-up rounds run off the request path
    on unref'd timers, never throw, and stop at the first settled round, at the last round, or when a newer probe starts.
    1. serve-swap-probe.ts: SWAP_PROBE_SETTLE_DELAYS_MS = [15_000, 60_000, 240_000] (delays after the swap probe, so the
       last round is about 5 minutes after the swap). SwapProbeOptions gains `settle?: { cancel?: () => void }` and an
       injectable `schedule?: (run: () => void, ms: number) => () => void` (default setTimeout with unref).
    2. After the first row, when any probed view answered stale or a status of 400 or more (no_key views excluded),
       runSwapProbe schedules round 1. Each round re-reads only the views still unsettled, with the same key, through the
       same reader, under the same time bound, and writes serve.swap_probe with the request's trigger, generation and sha,
       plus `round` (1 to 3), `sinceSwapMs` (from the first probe's start) and those views' results. A round in which every
       re-read view answers 200 fresh adds `settled: true` and schedules nothing; round 3 still unsettled adds
       `settled: false`. The first row is unchanged (no round field). The re-reads go through the reader with source
       swap-probe, so they count in views_probe, never in views.
    3. Starting a probe calls settle.cancel() first, so a newer swap's probe cancels the older swap's pending rounds.
    4. serve.ts: `const swapProbeSettle = {}` beside swapProbesRun, passed as `settle: swapProbeSettle`.
  falsifier: |
    Re-read every view instead of only the unsettled ones, or never mark settled: criterion 1 fails. Schedule a fourth
    round, schedule rounds for an all-fresh probe, or skip settle.cancel(): criterion 2 fails. Drop the option from
    serve.ts: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1795134349000 with ~/rmd-work/bin/reserve-id.sh.
    Proposed after reading the first live serve.swap_probe row; the per-swap time to fresh is the signal a later incident
    check or Console surface can read (nothing reads serve.swap_probe yet).
