  falsifier: |
    If a fresh three-form union read shows ANY `panel.*` row, any `console.*` literal, any `PANEL-`
    run id or any `console.ceiling_override_written` row, the write surface has been used and this
    task must be re-derived rather than trusted — the premise is that it never has. The measurement
    to re-run is the same one, over the archive-plus-live union with a per-form coverage control,
    with the SERVE PROCESS'S OWN 31 ROWS as the positive control proving the ledger is writable and
    the query can see rows written from that process.

    SEPARATELY FALSIFYING: if `serve.identityCapability` is set on the install, the process DOES see
    an authenticated identity before any route runs, Q1's answer changes, and what the tokens buy
    must be re-derived against that gate rather than against an external one the code cannot read.
