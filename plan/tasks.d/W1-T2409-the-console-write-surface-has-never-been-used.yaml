  rationale: |
    THE ID, AND THE ORDINAL READING RECORDED RATHER THAN ASSUMED. Eight surfaces swept, anchored
    `W1-T2409([^0-9]|$)` with a `[0-9]` class and never `\d`, anchored printed beside unanchored at
