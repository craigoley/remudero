- id: W1-T11136
  title: "One run's output overflow or pid-less spawn ends its lane, not the daemon — 10 `spawnSync git ENOBUFS` (4 of them in W1-T9091) and 2 `spawnDetachedGroup: child process has no pid` errors stopped core with stopReason=error over 10-20..10-27, because laneDeliveryFailure (src/lib/drain.ts) recognises only `Command failed: ` and PR-open refusals, and the row never names which command overflowed"
