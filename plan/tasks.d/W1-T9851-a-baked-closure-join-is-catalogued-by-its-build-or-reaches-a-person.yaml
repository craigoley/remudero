  falsifier: |
    At origin/main, `repairCensusRefusedPush` over a `census-suite: test/baked-supervisor-inputs.test.ts fails` refusal,
    on a task whose `files:` lacks src/lib/baked-runtime-inputs.ts and .github/workflows/acr-build.yml, with a worker
    that edits both, has the harness commit refuse both as undeclared. The rung returns `refused` and `escalate()` is
    never called, so the first and third tests fail. A fix round whose NEEDS_SCOPE names acr-build.yml calls
    `amendScope`, which is refused `instrument-path`, and stands down with no escalation, so the fourth test fails.
