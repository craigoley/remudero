  rationale: |
    WHY: the sweep held PRs on a security-merge-policy state GitHub had already replaced.
    MEASURED over 48 h of the fleet ledger (sweep.disposed, 2026-11-17 12:00Z to 2026-11-19 12:00Z),
    against each head's status history read with `gh api .../commits/<sha>/statuses`:
    four heads had the configuration-not-found wait (blocker security-unknown-hold, the W1-T13470 rule).
    All four still held after GitHub's newest status at that head read `safe`:
    - #19339 fa91d13: safe 2026-11-18 07:00:44Z, held 07:03:53Z (190 s); first other disposition 07:04:29Z.
    - #19434 a4b53eb: safe 15:17:19Z, held 15:30:26Z (788 s); first other disposition 15:37:56Z (20.6 min).
    - #19489 41a67e1: safe 21:18:53Z (again 21:24:30Z), held 21:21:23Z and 21:31:09Z; next disposition was a
      conflict at 21:40:38Z.
    - #19647 c67768a: safe 2026-11-19 11:27:15Z, cleared 11:33:56Z, then held again at 11:35:29Z on a
      view with snapshot_age_ms 713,315 (a light pass on its last good list).
    The rows report snapshot_age_ms 3,180 (#19434) and 2,813 (#19489): small, because the age is
    counted from when the tick-read generation settled (W1-T9704), not from when its rollups were read.
    The rollups are read at the start of the generation. tick_read.stale_refused rows in the same 48 h
    record read_ms p50 220,774, p90 421,246, max 577,589 for one generation, and 1,110
    sweep_light.views_fallback rows with reason slow_read.
    WHY A RE-READ AND NOT A FASTER READ: the generation's age rule is W1-T9704's deliberate choice, and
    shortening it costs every consumer. The hold is rare (4 heads in 48 h), so one single-PR re-read
    (W1-T7734's rereadPrAtAct, already wired on full and light passes) before the hold costs little.
    The full pass already makes a fresh decision read (readSecurityMergeObservation) but ignores its
    answer for the disposition.
    W1-T13787 (queued, claimed) dispatches the producer when that fresh read clears. On a stale view it
    would dispatch the producer for a status that is already safe. This task re-reads first, so
    W1-T13787's dispatch runs only on a status that is still unknown on GitHub.
  design: |
    INVARIANT hold-on-a-fresh-view: a configuration-not-found hold is written only on a view whose rollup was read in this pass, or after a re-read failed.
    INVARIANT real-unknown-still-holds: a status that is still unknown after the re-read holds exactly as today.
    INVARIANT one-read-per-pass: at most one re-read per PR and pass.
    INVARIANT no-producer-dispatch-on-a-stale-view: W1-T13787's dispatch needs a re-read view that still reads the unknown.
    1. In runSweep's walk, where the "wait" disposition for blocker security-unknown-hold with
       codeqlConfigurationWarningWait(pr) is handled, and before observeCodeqlConfigurationWarning: if
       deps.rereadPrAtAct is set, the PR is not in rederivedPrs, and the view was not already re-derived in
       this pass (rederivedIndices), add it to rederivedPrs and call rereadPrAtAct(pr).
    2. Same head and codeqlConfigurationWarningWait(reread) false: replace openPrs[prIndex], add to
       rederivedIndices, set freshReadAtMs, put the index back in walkOrder, as the moved-head branch does.
       Do not ledger the stale hold. The re-derived row carries `rederived: true`.
    3. Otherwise hold on the snapshot as today; a thrown re-read is named in the reason.
    4. Reuse the moved-head branch's code; do not add a second re-read helper. No new constant, step or
       config key. src/lib/sweep.ts has a comment cap (test/sweep/compress-src-lib-sweep-ts.test.ts).
  falsifier: |
    At origin/main criterion 1 fails: the pass writes the security-unknown-hold row from the stale view.
    Re-read without the rederivedPrs guard: criterion 3 sees two re-reads in one pass. Skip the hold when
    the re-read throws: criterion 2 sees no hold.
