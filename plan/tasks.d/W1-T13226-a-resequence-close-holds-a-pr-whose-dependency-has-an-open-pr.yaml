  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # narrows a destructive close; a dependency with no open PR still closes exactly as today
  band_meaning: blast-radius
  origin: "operator-session#console-inbox-defects-2026-11-16"
  plan_refs:
