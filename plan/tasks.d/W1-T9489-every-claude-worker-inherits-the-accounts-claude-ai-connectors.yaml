- id: W1-T9489
  title: "EVERY CLAUDE WORKER INHERITS THE FLEET ACCOUNT'S CLAUDE.AI CONNECTORS — fix, implement, review and recon spawns under bypassPermissions are offered all eight mcp__claude_ai_Claude_Docs__* tools (create, update, delete, export ...), a write and exfiltration path out of the sandbox, and a fix worker already called one on 2026-10-14; make every spawn strictMcpConfig with an explicit server map, deny mcp__claude_ai_* outright, and fail loudly on any init inventory that still lists one"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto  # the reviewer and risk judge are strict on a high band; a bad option breaks spawns loudly, and a revert restores today's behaviour
  principles: {tdd: strict}
  budget_usd: 16.00
  risk: high  # security hardening of EVERY Claude worker spawn: a wrong option drops the knowledge tool or refuses every spawn fleet-wide
