  rationale: |
    VERIFIED FROM SOURCE, not inferred: `evaluateGate` (scripts/acceptance-author-gate.mjs:365-366)
    calls `authorTimeProofShapeRefusal(body, result)` UNCONDITIONALLY whenever
    `acceptanceAuthorTimeCheck` returns `ok: true` — including the trailer fast path
    (src/lib/review.ts:5208-5210), which returns `ok: true` the moment a `Remudero-Task:` trailer
    resolves, WITHOUT ever reading the body's own `## Acceptance` block. `authorTimeProofShapeRefusal`
    then re-parses that block regardless, so a purely decorative narrative Acceptance section — written
    only to satisfy the human-facing "substantiate every criterion" instruction — can trip a false
    `proof-shape` refusal on work whose real criteria already resolve from the plan.

    THIS IS NOT A NEW FINDING. MASTER-PLAN.md already documents it in detail, more than once, as one of
    the two dominant repeats in the current retro cycle's harvest: "`authorTimeProofShapeRefusal`
    (scripts/acceptance-author-gate.mjs) re-parses the PR body's own `## Acceptance` section for proof
    shape EVEN WHEN a `Remudero-Task:` trailer has already resolved the criteria from the plan — named
    independently by FOUR tasks (W1-T3558, W1-T3578, W1-T3579, W1-T3580), each having paid a full CI
    cycle to rediscover it" and is explicitly folded into evidence for the standing **P63** proposal
    ("a gate whose remedy the declared scope forbids is still a deadlock") — "**P63's deadlock, at repo
    scale**. Counted ONCE each as operational causes (DR-8)." DR-8 is the retro's own documented rule for
    exactly this shape: a repeat finding is ROUTED to the proposal it already evidences, never re-minted
    as a fresh task. This follow-up (originating from W1-T3558 again, run DAEMON-1789395952439) is
    another instance of the SAME already-counted finding.

    THE FIX IS ALREADY DESIGNED AND QUEUED — plan/tasks.d/W1-T3574-reconcile-the-acceptance-header-trailer-shadow-report.yaml,
    `status: queued`, `attempts: 0`, files scoped to `scripts/acceptance-author-gate.mjs` and
    `test/acceptance-author-gate.test.ts` only. Its design is STRICTER, and correctly so, than this
    proposal's own framing ("skip the check entirely once the trailer fast path returned ok: true"):
    `acceptanceAuthorTimeCheck`'s trailer arm returns `ok: true` even when `trailerResolves` is
    `undefined` (an unreadable plan) — `if (trailerId !== undefined && (opts.trailerResolves ===
    undefined || opts.trailerResolves(trailerId)))` — so skipping on bare `ok: true` would also skip on a
    body whose trailer resolves to NOTHING because the plan could not be read, which is exactly the
    "empty-plan fallback" false-safety W1-T3574's own falsifier guards against ("Mutate the resolver to
    use only declaredPlanTaskIds and the empty-acceptance control must become an unsafe success").
    W1-T3574 instead adds a distinct, fail-closed resolver that checks the trailered task's NON-EMPTY
    acceptance at the PR's EXACT head sha before bypassing the body parser — the same condition
    `resolvePlanCriteriaAtHead` already uses on the reviewer side (src/run-task.ts). Filing a second task
    against the naive framing would EITHER duplicate W1-T3574's work (P66's "two authoring lanes draw
    from one task board" failure mode, already named live in this same MASTER-PLAN cycle at
    W1-T3573/W1-T3574/W1-T3582) or, if built exactly as this proposal's own words suggest, ship a
    WEAKER, less-safe rule than the one already queued.
  design: |
    NOT TO BE BUILT. Left in the plan as a RETIREMENT RECORD, not a work item, so this exact
    `followup:` proposal has a durable, grep-able disposition instead of silently vanishing from the
    inbox or costing a sixth full CI cycle to rediscover. `status: blocked` with `retirement: withdrawn`
    is the established convention for a plan-bookkeeping record that must never be dispatched — enforced
    at the SAME filter drain.ts already applies to every other task: `isDispatchEligible`
