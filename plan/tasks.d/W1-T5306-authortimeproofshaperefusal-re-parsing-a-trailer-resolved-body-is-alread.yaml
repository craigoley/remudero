    reporting it as `"retired"` once a legal `retirement:` value is present (W1-T2474,
    `RETIREMENT_REASONS`, src/lib/plan.ts:46).

    depends_on is left at `[]` and no other task, no source file, and no test is touched by this record.
    The actual fix stays entirely W1-T3574's, unmodified by this filing.

    IF A FUTURE READER FINDS W1-T3574 CLOSED WITHOUT SHIPPING THIS RULE — retired unbuilt, superseded
