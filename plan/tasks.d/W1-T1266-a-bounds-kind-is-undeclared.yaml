    THE EXTERNAL PRECEDENT IS CITED, NOT COPIED, AND ITS LIMIT IS CARRIED. `covibes/zeroshot` at
    `2b0b35b` requires a termination witness in its compiled IR, and its own
    `DEFAULT_MAX_ITERATIONS = 100` is picked with no justification at the site — the transferable
