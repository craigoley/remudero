- id: W1-T1266
  title: "NOTHING DISTINGUISHES A BACKSTOP FROM A PRIMARY CONTROL AT THE DECLARATION SITE, SO A MIS-SIZED BACKSTOP SILENTLY BECOMES THE THING THAT STOPS THE LOOP — CLAUDE.md already calls that this repo's recurring defect and cites three instances, W1-T1219 was a fourth, and the fix rung's `strikeCap: 2` is a PRIMARY control with nothing measurably descending across strikes"
