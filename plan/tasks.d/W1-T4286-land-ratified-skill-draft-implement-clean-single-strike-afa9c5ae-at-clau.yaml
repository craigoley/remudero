  rationale: |
    RATIFIES inbox proposal skill-draft:afa9c5aea4d3c168 (skill-workshop.ts, W1-T2766): a
    "clean_single_strike" procedural candidate mined from 79 merged implement runs, cleared the
    module's own two-run floor by a wide margin, and was scanned clean by scanSkillDraft (no
    disallowed host/path/tool, no injection-shaped line) before staging.

    RULE 19 #588 MERITS: this is one cross-file invariant, not two piecewise tasks — the checked-in
    skill file and its real-tree injection test must land together to prove this ratified skill is
    selectable by the production harness route.

    APPROVING A skill-draft PROPOSAL DOES NOT WRITE .claude/skills/ ITSELF — VERIFIED FROM SOURCE.
    approveCommand/createRatificationBranch (src/run-task.ts) treat every proposal's cached draft
    identically as a {fragmentYaml, stampLine} plan-task fragment, minted via
    materializeDraftTaskIds and written as plan/tasks.d/ shards; there is no skill-draft:-specific
    branch anywhere in inbox.ts or run-task.ts. So ratifying this proposal correctly means filing
    THIS task, which a later implement worker executes (through the ordinary ci+remudero-review
    gate) to actually create the file — matching stageSkillDraft's own comment that the write
    happens "once rmd approve ratifies the staged proposal into a plan PR", i.e. via the worker's
    own PR, not the ratification PR.

    THE PROPOSAL'S OWN "NOT reachable by a worker today" TEXT IS STALE — this is the ratification's
    load-bearing finding, not an assumption. describeWorkerSkillReachability (skill-workshop.ts:252)
    answers ONLY whether the native SDK Skill-tool can load .claude/skills/ via settingSources
    (still [], still false — WORKER_SETTING_SOURCES is untouched and untouchable, see W1-T4287's
    rationale and this task's own falsifier below). But W1-T3101 (status: merged) built a SECOND,
    ALREADY-LIVE route the reachability text never considers: run-task.ts:12091-12098 —
    `selectSkillsForTask(loadInjectableSkills(join(repoRoot, ".claude", "skills")), task.type,
    DEFAULT_KNOWLEDGE_BUDGET_CHARS)` — reads .claude/skills/<name>/SKILL.md straight off the repo
    checkout and inlines any body whose frontmatter carries `applies-to:` matching the task's own
    type into the implement prompt's CONTEXT block, ledgering skillsInjectedEvent. This draft
    ALREADY carries `applies-to: implement` (renderSkillDraft emits it automatically for any
    candidate.taskType in INJECTABLE_SKILL_TASK_TYPES, which "implement" is), so once this file
    exists at the exact path, it becomes live-reachable for every implement-type dispatch with zero
    further code change. The existing generic regression test
    test/a-drafted-skill-is-selectable-for-its-own-task-type.test.ts already proves the MECHANISM;
    this task's own new test proves THIS SPECIFIC skill is picked up by it, closing the loop from
    "staged proposal" to "load-bearing prompt content" the P25 dead-consumer discipline requires.
