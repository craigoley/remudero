  note: |
    `risk: high` IS RULE 19'S SPAN AND IS SET UP FRONT. The declared list crosses the REST producer,
    the disposition row that renders its evidence, and the completeness gate that fails the build the
    moment a producer appears — the same three concerns W1-T984 declared and refused to decompose, for
    the same reason: split them and you land either a producer nobody reads or an allowlist removal
    with nothing wiring the field, each individually red. BLAST RADIUS IS DELIBERATELY LOW: with both
    flags off, no disposition moves and no pull request is closed that today survives.

    `files:` DERIVED BY READING THE SYMBOLS, NOT GUESSED. `hydrateMergeConflictEvidence` and the
    hydration cap live in `src/lib/open-prs-rest.ts`; `buildOpenPrViews` — where a producer is
    ASSIGNED and where `hydrateMergeConflictEvidence` is already called — is in `src/run-task.ts`;
    `DISPOSITION_RULES`, `SupersessionVerdict`, `SupersessionStatus` and `DEFAULT_SWEEP_POLICY` are all
    in `src/lib/sweep.ts`; the allowlist is in `src/lib/producer-completeness.ts`. Each declared source
    file has its owning suite declared beside it. `src/run-task.ts` IS DECLARED AND ITS SERIALISATION
    COST IS ACCEPTED IN WRITING (`partitionByFileOverlap`, W1-T471): the assignment cannot happen
    anywhere else, and W1-T984 paid the same price at the same seam. `plan/policy.yaml` is NOT
    declared — no default moves, and declaring an untouched file fails `inverseScopeUntouchedFiles`.

    ONE PROOF IS A GREP FOR A SYMBOL THAT DOES NOT EXIST IN THAT FILE YET, WHICH IS THE POINT. It
    greps text the change ADDS, never text it removes, so it can only go green by a producer genuinely
    landing in the module where the sibling field was wired — the identical form and identical
    reasoning W1-T984 used for `mergeConflict` in the same file. Re-derive its zero before building
    (a `mergeState` count in the same file is the live control).

    THE COUNTS THIS SHARD DOES NOT HAVE ARE NAMED AS ABSENT. It was filed by a triage pass with no
    shell: no ledger union was resolved, no `git grep -c` was run, and NO CLAIM IS MADE about how often
    the bare-number row has fired. W1-T932's rationale (5) already records that a 3,413 firing count
    could not be re-derived and must be treated as UNMEASURED until someone runs it where the daemon
    writes; that warning stands and is not overwritten here. The only quantities used are the ones the
    feedback entries carry on their own faces — five PRs in 2026-08-13..08-20 and three in
    2026-08-20..08-27 (`fb-repair-stale-2955`) — and they are used only to size the candidate set.

    AND ONE CITED PAIR IS KNOWN NOT TO BE A DUPLICATE BUILD, WHICH IS WHY THE DIAGNOSIS IS DEFERRED
    RATHER THAN ASSUMED. `plan/tasks.d/W1-T449-arm-site-attribution-ledger-line.yaml` records that
    `8a024d42` — the head the entry cites for PR #1689 — was an ABANDONED DRAFT of that task,
    superseded 94 minutes later by #1690 deliberately. So at least one of the five closes was correct
    and intentional, and a shard claiming five duplicate builds would be false on its own evidence.
    That is precisely the discrimination the missing producer would make, and precisely why design
    (vii)(b) refuses to file the duplicate-PR diagnosis before it exists.
