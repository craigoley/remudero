  rationale: |
    MEASURED 2026-09-07, and the whole finding is one table. Every open CONFLICTING pull request,
    merged against origin/main in a scratch worktree:

      PR 4395  conflicted: scripts/comment-load-baseline.json
      PR 4394  conflicted: scripts/comment-load-baseline.json
      PR 4383  conflicted: scripts/comment-load-baseline.json
      PR 4360  conflicted: scripts/comment-load-baseline.json

    ONE file, nothing else, four for four. And all four change the SAME key — `src/run-task.ts` —
    against main's 16427: 16432, 16468, 16493, 16434.

    THE REMEDY WAS ALREADY WRITTEN DOWN, IN THIS FILE, AS A CONDITIONAL. The baseline's own
    `_comment` header says: "two concurrent PRs that both grow the SAME file edit the same line
    here and conflict. If that becomes common the fix is that file's bucket trick
    (CEILING_BUCKET_LINES), not a wider gate." Four of four is common. And W1-T2539, which bucketed
    the sibling, states the invariant outright: "an exact-count baseline always conflicts on
    concurrent growth (changing a JSON value is delete-plus-add)."

    WHY THE SIBLING DOES NOT CONFLICT, WHICH IS THE CONTROL: `source-size-baseline.json` was
    committed 119 times in 30 days against comment-load's 130 — comparable churn — and appears in
    none of the four conflicts, because its recorded values are BUCKETS and two PRs crossing one
    boundary write the same number.

    BUCKET SIZED ON MEASUREMENT, NOT ADOPTED FROM THE SIBLING. Single-commit growth in this
    baseline over 60 days: 83 events, p50 16, p90 46, p99 68, MAX 68, none above 250. 250 exceeds
    the observed maximum by 3.7x. The sibling's 500 was rejected: the mean measured file carries
    216 comment lines, so a 500-bucket would park most of the corpus in bucket one and retire the
    gate rather than debounce it.

    ALL FIVE OBSERVED VALUES ROUND TO 16500, so the conflict class is removed rather than resolved.
  acceptance:
    - claim: "two concurrent growths of one file record the same ceiling, so the edit that used to conflict is byte-identical on both sides"
      proof: "grep: two concurrent growths of one file record the SAME value in test/comment-load-ratchet.test.ts"
    - claim: "a shrink inside one bucket no longer rewrites the entry, removing the same churn from the other direction"
      proof: "grep: a shrink INSIDE one bucket leaves the entry untouched in test/comment-load-ratchet.test.ts"
    - claim: "the bucket is a declared constant sized against measured growth, not a magic number in the judge"
      proof: "grep: CEILING_BUCKET_COMMENTS in scripts/comment-load-ratchet.mjs"
    - claim: "growth past a recorded ceiling is still refused and the ceiling is still never advanced automatically"
      proof: "unit test: test/comment-load-ratchet.test.ts"
  note: |
    WHAT THIS DOES NOT DO, STATED PLAINLY BECAUSE IT IS THE COST: a file may now grow up to 249
    comment lines past its last ceiling before the gate notices. That is the coarseness the bucket
    buys, and it is the same trade W1-T2526 records for the size ledger — this gate is a REVIEW
    SIGNAL about volume and grades no falsifier. If the visibility matters more than the conflicts,
    the knob is CEILING_BUCKET_COMMENTS and lowering it costs conflicts back.

    IT DOES NOT RETROACTIVELY FIX THE FOUR OPEN PRs. Their branches already carry exact values, so
    merging main still conflicts on that line; each needs to re-record once. The class is closed
    going forward, not behind.

    MIGRATION IS LAZY, mirroring W1-T2539: an existing exact entry stays valid until its file next
    grows past it, at which point the refusal prints the bucketed value to record. No mass rewrite
    of the baseline is performed here — that would itself conflict with every open PR.

    ID PROVENANCE: `rmd next-task-id --reserve` atomically reserved refs/rmd-id/W1-T3022.
