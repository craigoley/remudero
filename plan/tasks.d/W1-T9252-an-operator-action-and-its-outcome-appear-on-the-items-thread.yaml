- id: W1-T9252
  title: "AN OPERATOR ACTION AND ITS OUTCOME APPEAR ON THE ITEM'S THREAD — reframe, decline, restore, approve and release are recorded only as ledger rows, and GET /v1/inbox/thread builds a thread from the opening message plus the thread store alone, so the console's email-style thread never shows what the operator did or what the fleet did in response; and some Needs your decision items (Board review, machine-judge) have no readable or writable thread at all"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 14.00
  risk: high # spans the thread store, the thread routes and view, the operator verbs (inbox.ts, panel-graph.ts, run-task.ts) and a boot backfill; no verdict, classification or dispatch change
  band_meaning: span
  origin: "operator session 2026-10-13 17:20Z: console thread view (CONSOLE-T129) review: operator actions missing from threads; 17:40Z: console #2101 reply composer gets not-found on Board review and machine-judge items"
  plan_refs: [W1-T2494, W1-T8826, W1-T8831, W1-T9062]
  files:
    - src/lib/inbox-thread.ts
    - src/lib/inbox-responder.ts
