  acceptance:
    - claim: "For each measurable verdict row, the outcome join gives one verdict_calibration.outcome row with the task id, the head sha, the merge sha and the window: reverted for a revert inside the window, followup_fixed for a follow-up fix inside the window, and clean when the merge is older than the window and has neither. A merge younger than the window with neither, and every unmeasurable row, gives no row"
      proof: "grep: W1-T12425 criterion 1 in test/review/typed-answers-gain-an-outcome.test.ts"
    - claim: "A head that already has an outcome row of the same kind in the ledger union gets no second row, and clean is never written for a head that has a reverted or followup_fixed row"
      proof: "grep: W1-T12425 criterion 2 in test/review/typed-answers-gain-an-outcome.test.ts"
    - claim: "The measurement cadence writes the outcome rows from the same git read as the verdict calibration report, whenever its caller gives an outcome writer, with or without escalate. A failed git read writes no outcome row. The daemon's cadence call gives the writer"
