    - claim: "The judge calibration reader keeps the outcome rows and gives a typed answer the outcome of its head through one declared map per role. For the risk role, reverted and followup_fixed map to high and clean maps to low. The head comes from the row's head_sha, or from the decision key of the risk surface (task id and head) and the review surface (pull request, head and digest)"
      proof: "grep: W1-T12425 criterion 4 in test/review/typed-answers-gain-an-outcome.test.ts"
    - claim: "A risk distribution whose head has an outcome row gets a Brier and a log-loss figure and counts in outcomes.scored. A typed answer with no head, with no outcome row, or in a role with no map entry keeps a null outcome and counts in outcomes.unknown. The current judge's answer is never used as the outcome"
      proof: "grep: W1-T12425 criterion 5 in test/review/typed-answers-gain-an-outcome.test.ts"
