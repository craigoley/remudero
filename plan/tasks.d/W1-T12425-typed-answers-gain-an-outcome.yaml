  rationale: |
    WHY: W1-T12414's scorer gives a Brier score, a log-loss and calibration buckets only for a distribution with a known outcome. No outcome is recorded today, so every distribution counts in `outcomes.unknown` and the per-model bar of W1-T12417 has no Brier figure to read. The operator rule (decision-model handoff, 2026-11-12) is that no gate changes model until measurement earns it.
    READ 2026-11-12 in the W1-T12414 hand build (/mnt/scratch/rmd/hand/wt-T12414, commit badd9e6f1, not yet merged):
    - src/lib/typed-answer-scores.ts:65 gives each row an `outcome` that is "never the current judge's answer". :118 sets it to null for every decision.answered row. :181-186 score only rows whose outcome is a declared option, and :200 counts the rest as `outcomes.unknown`.
    - src/lib/judge-calibration.ts:89-100 maps each shadow_judge.paired row to a single answer with `outcome: null` (:98). Its input digest is a hash of the row's decision_key (:96), so the pull request is not in the row. :76 RETAINED_STEPS keeps no outcome step, so the analytics fold has no outcome to join.
    - src/lib/decision-model.ts:310 (the W1-T12416 build under it) writes `input_digest` as a hash of the input text, and no head sha.
    READ 2026-11-12 in the source at origin/main 13efbdf36:
    - src/lib/verdict-calibration.ts:526 `verdictCalibrationReport` is the revert and follow-up-fix join. Per verdict row it finds the merge (:570 `locateMergeCommit`), then asks :592 `wasReverted` and :596 `hasFollowupFix` inside `ATTRIBUTION_POLICY.windowDays` (:424, 14 days). It counts per class and keeps no per-head result.
    - src/lib/measurement-cadence.ts:2467 mines the verdict rows, :2473-2479 is the one place the host reads git history (`defaultMeasurementCadenceGitLog`, :1816), and :2482 runs the join. Its only rows (:2505-2508, drift rows) are written only with `opts.escalate` and a caller's `writeLedgerLine`.
    - src/run-task.ts:22042 is the daemon's cadence call (`runMeasurementCadenceReportAsync`). It passes no top-level writer. :22073-22082 shows the pattern for a writer of one row family (W1-T4243's `knowledge.measured`).
    - The judged heads are already in the shadow keys: the review shadow's key is `<pull request url>:<head>:<digest>` (src/cli/commands/review.ts:1140) and the risk shadow's key is `<task id>:<head>` (src/cli/commands/run-task-verb.ts:8333). src/lib/shadow-judge.ts:44 writes it as decision_key.
    - W1-T12145 (queued) also changes src/lib/verdict-calibration.ts. It groups the report by reviewer model and writes no row. W1-T12421 gives replayed corpus answers an expected answer as their outcome; it records nothing for live answers. No queued task and no open pull request records a live outcome (open heads checked 2026-11-12: #18184, #18183, #18180, #18033).
  design: |
    1. In src/lib/verdict-calibration.ts add `verdictOutcomeRows(verdictRows, gitDump, { now, policy, recorded })`. It uses the same commit index and the same `locateMergeCommit`, `wasReverted` and `hasFollowupFix` as `verdictCalibrationReport`, so the two never disagree. It returns one row per head and kind: `{ step: "verdict_calibration.outcome", task_id, head_sha, merge_sha, outcome: "reverted" | "followup_fixed" | "clean", window_days }`. `clean` needs the merge to be older than `window_days` at `now`. `recorded` is the set of (head, kind) pairs already in the ledger union; a pair in it gives no row (criterion 2).
    2. In src/lib/measurement-cadence.ts, at :2482, call `verdictOutcomeRows` on the same rows and the same git dump, with the cadence's one clock read. Read `recorded` from the ledger union the cadence already resolves. Write each row through a new optional `outcomes.writeLedgerLine`, not gated on `escalate`. With a git read error, write nothing.
    3. In src/run-task.ts give the daemon's cadence call an `outcomes.writeLedgerLine` in the shape of the knowledge writer (:22073-22082). Declare the step in src/lib/ledger-steps.ts.
    4. In src/lib/judge-calibration.ts keep `verdict_calibration.outcome` rows in RETAINED_STEPS and in the fold, keyed by head sha. Add `TYPED_ANSWER_OUTCOME_MAP`, one exported table from (role, outcome kind) to a declared option. It starts with the risk role only (reverted and followup_fixed to high, clean to low), because the review shadow's answer is a vector of per-criterion verdicts with no single option. Moving the map is a reviewed diff, as `ATTRIBUTION_POLICY` is.
    5. Read each typed answer's head from its row's `head_sha`, else from the risk or review decision key. Add the head to the typed-answer row so the join does not need the raw key. Before `scoreTypedAnswers`, set a typed answer's outcome from its head's rows: reverted or followup_fixed wins over clean. A head with no row stays null.
    6. If the checkpoint fold digest changes, re-pin it in test/an-analytics-checkpoint-keeps-folds-not-rows.test.ts and state the prior digest, as W1-T12414's amendment did.
    NOT IN SCOPE: any gate, route, threshold or gardener that reads the scores; an outcome for roles that judge no pull request (ci, fix-progress, verify-human, refresh-value, the quiet-worker watchdog); changing `verdictCalibrationReport`'s figures or W1-T12145's grouping; a head sha on decision.answered rows (see the note).
  falsifier: |
    Write clean for a merge younger than the window and criterion 1 must fail. Write a second row for a recorded head and kind and criterion 2 must fail. Gate the outcome rows on escalate and criterion 3 must fail. Use the current judge's answer as the outcome and criterion 5 must fail. Drop the outcome step from RETAINED_STEPS and criterion 6 must fail. Restore and require all to pass.
