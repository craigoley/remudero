- id: W1-T1238
  title: "THE PRODUCER'S NOTE WILL BE A LIE THE MOMENT ITS READER LANDS — sweep.ts:4364-4369 states `sweep.pass` is unregistered because \"nothing reads it yet\" and promises the consumer's own PR registers it; W1-T1236 builds that consumer and W1-T1237 registers the step, leaving a comment that actively misdirects the next reader into re-deferring work already done"
  repo: remudero
  depends_on: ["W1-T1237"]
  type: implement
  verify: auto
  budget_usd: 8.00
  risk: low
  rationale: |
    THE NOTE IS LOAD-BEARING PROSE, NOT DECORATION. sweep.ts:4364-4369, verbatim: "NOT REGISTERED
    in DECISION_RELEVANT_LEDGER_STEPS or RENDER_RELEVANT_LEDGER_STEPS, deliberately: nothing reads
    it yet (the consumer is out of scope here, one concern), and the decision set is the
    NEVER-ROTATED core, so registering an unread step there would keep it forever for no reader. It
    rotates like any other diagnostic row until a consumer exists; the change that builds that
    consumer registers it then, in the same PR."

    EVERY CLAUSE OF IT BECOMES FALSE ACROSS W1-T1236 AND W1-T1237. Something reads it
    (`judgeSweepLiveness`, the `sweep-liveness` arm in doctor.ts); it no longer rotates like any
    other diagnostic row (it is in `RENDER_RELEVANT_LEDGER_STEPS`, recency-bounded); and the
    "in the same PR" promise is discharged by the spine rather than literally. A reader who trusts
    it will believe the consumer is still unbuilt — which is exactly how this defect survived: the
    deferral was recorded in a comment, was never filed as a task, and sat unread until a feedback
    round found it. THE SAME COMMENT SHAPE CAUSED THE ORIGINAL GAP; leaving it stale re-arms it.

    WHY IT IS ITS OWN RECORD. `src/lib/sweep.ts` is a THIRD concern under Rule 19 — bundling this
    one-block comment edit with the doctor arm or the ledger registration is what made the original
    filing a five-concern monolith the linter refused. It is small, it is last, and it is honest
    about being a documentation correction rather than a behaviour change.
  design: |
    ONE CONCERN, ONE FILE, ONE COMMENT BLOCK — src/lib/sweep.ts:4364-4369.

    (1) REWRITE THE DEFERRAL PARAGRAPH TO STATE WHAT IS NOW TRUE: `sweep.pass` (and
        `sweep.summary`) are registered in `RENDER_RELEVANT_LEDGER_STEPS` — the recency-bounded
        category, NOT the never-rotated decision core — and the reader is `judgeSweepLiveness`, the
        `sweep-liveness` arm in `src/lib/doctor.ts`, which pairs this row with the summary that
        should follow it. Name W1-T1236 and W1-T1237 so the next reader can walk to the decisions
        instead of re-deriving them.

    (2) KEEP THE PARTS THAT ARE STILL TRUE AND STILL VALUABLE: why the row sits BEFORE the loop,
        why `sweep.summary` alone cannot be this signal, and why the decision core was the wrong
        home for it. Those are the reasoning that survives; only the "nothing reads it yet"
        deferral is retired.

    (3) DO NOT TOUCH THE EMIT. `log("sweep.pass", ...)` at sweep.ts:4371 keeps its exact position,
        payload and wording. `test/sweep-pass-heartbeat.test.ts` owns that behaviour and must stay
        green completely untouched — it is not in `files:` and no criterion here asks it to change.

    (4) NOTHING ELSE IN sweep.ts. Not the loop, not the disposition path, not the light-pass doc at
        sweep.ts:5288 (its `sweep.pass`/`sweep.summary` mention is still accurate). One block.

    EXPLICITLY NOT IN SCOPE: any behaviour change anywhere; a pass correlation id (the arm pairs by
    time order deliberately — W1-T1236 design 2b); any edit to doctor.ts or ledger.ts.
  acceptance:
    - claim: "the producer's note names the reader that now consults the row, in place of the retired \"nothing reads it yet\" deferral"
      proof: "grep: judgeSweepLiveness in src/lib/sweep.ts"
    - claim: "the note names the arm by the name the report prints, so an operator seeing the check can find the emit"
      proof: "grep: sweep-liveness in src/lib/sweep.ts"
    - claim: "the note points at the registration that discharged its own in-the-same-PR promise"
      proof: "grep: W1-T1237 in src/lib/sweep.ts"
