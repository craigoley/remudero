  note: |
    THIRD AND LAST OF THE RULE 19 DECOMPOSITION of the original five-concern filing
    (doctor / ledger / ledger-render-retention / sweep / sweep-pass-liveness), with
    `origin: feedback#fb-1785937739950-070a87` preserved verbatim across all three. It does NOT
    merit risk:high under the #588 test: it asserts no cross-file invariant at all — one comment
    block in one file.

    depends_on W1-T1237 (and transitively W1-T1236): the corrected note asserts a registration and
    a reader that must already exist, or it swaps one false comment for another.

    ALL THREE PROOFS DISCRIMINATE — VERIFIED AT FILING TIME. `judgeSweepLiveness`, `sweep-liveness`
    and `W1-T1237` each return ZERO matches in src/lib/sweep.ts today, so none can pass before the
    work is done. No pattern carries an unescaped BRE metacharacter.

    A GREP ON A COMMENT IS THE RIGHT PROOF HERE AND ONLY HERE. The call-site rule's warning — that
    `grep: foo in x.ts` passes on a comment merely mentioning foo — is about proving CODE is
    reached; this task's entire deliverable IS the comment, so the mention is the artifact, and no
    src/ module is created for that rule to police in the first place.

    NO PRE-PASSING REGRESSION CRITERION. The obvious "the emit is unchanged" proof would name a
    test that is green today and would therefore discriminate nothing (W1-T1209's own note records
    this trap). `test/sweep-pass-heartbeat.test.ts` runs on every PR regardless and will fail this
    one if the emit is disturbed.

    principles: OMITTED DELIBERATELY. Every sibling carries `{tdd: strict}`; a red-first test for a
    comment correction would be a source-text assertion pinning prose, which rots on the next honest
    rewording. The three greps ARE the executable check.

    risk:low and budget_usd 8.00 — no behaviour changes, the blast radius is one comment block, and
    the whole cost is reading the two merged siblings closely enough to describe them accurately.
