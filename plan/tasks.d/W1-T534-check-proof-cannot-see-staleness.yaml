  note: "verify:auto — the comparison is decidable from two fixture trees with no network and
    no spawn beyond the executor this verb already drives.
    risk:high IS SET UP FRONT and is Rule 19's SPAN, NOT blast radius — the two are pulling in
    opposite directions here and the band follows the span, as the rule requires. The span is
    two subsystems (`run-task`, `check-proof-base`) because `subsystemsOf` folds a `.test`
    basename onto its SOURCE, and there is no `src/lib/check-proof-base.ts` for the new suite
    to fold onto, so it counts as its own concern. Naming the suite to fold onto `run-task`
    would mean appending to test/run-task.test.ts, which is forbidden for a coverage-load-bearing
    test (that file crashes at FILE level under coverage, zeroing every record in it). The real
    blast radius is SMALL: an OPTIONAL flag whose absence preserves today's behaviour exactly.
    Filed at medium first and corrected only after `lint-plan` said so, which is recorded here
    rather than quietly amended.
    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT: `checkProofCommand` lives in src/run-task.ts
    and is the only definition of this verb; the suite is a NEW file rather than an append,
    per the rule that a coverage-load-bearing test must not share a file that can crash at file
    level. `src/lib/review.ts` is DELIBERATELY NOT DECLARED — clause (v) puts the reviewer's own
    staleness computation out of scope, and an implementer who concludes the shared predicate
    must move there MUST AMEND THIS SHARD TO DECLARE IT FIRST rather than overrunning; #1869
    shipped a 22-file overrun against a two-path declaration.
    FILED, NOT BUILT, and deliberately kept separate from W1-T533 rather than absorbed into it:
    they share a session's motivation and nothing else — one repairs a body the harness
    invalidated, the other reports a discrimination the CLI never measured.
    PROOF NOTES: all three proofs are the NAME-FILTERED `unit test:` form, never the whole-file
    path form. Each title was verified to match ZERO files today via `grep -rlF` over test/,
    against a control matching one, so every one discriminates head from base. Each is plain
    prose under 100 characters with no comma and no regex metacharacter, so
    looksLikeScenarioNarrative does not fire and proofNameResolutionViolations cannot either.
    Zero candidates today is the legitimate forward reference for an unimplemented task.
