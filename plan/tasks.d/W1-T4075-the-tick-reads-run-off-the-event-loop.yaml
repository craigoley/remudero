  title: "EVERY DAEMON RESTART FREEZES THE LOOP 85-99 S ON ITS FIRST SWEEP AND EVERY WARM SWEEP STILL BLOCKS 30-50 S UNSEEN — 62-170 synchronous gh spawns per pass at 5% CPU or less: move the tick's reads to a worker-hosted, generation-bound read plane and report loop delay as a distribution"
