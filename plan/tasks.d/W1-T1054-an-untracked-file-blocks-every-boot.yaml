  note: |
    RULE 25 RE-DERIVED BY RUNNING THE REAL `INSTRUMENT_SURFACE` EXPORT, NOT BY READING IT, WITH FOUR
    CONTROLS. `deploy/entrypoint.sh` DOES NOT MATCH — deploy/ is not instrument surface — and
    neither does `test/entrypoint-boot.test.ts` nor `src/lib/deployer.ts`. Positive controls:
    `.github/workflows/ci.yml` and `scripts/coverage-ratchet.mjs` both DO match, so the predicate
    was live when the three negatives were taken. THIS TASK THEREFORE DOES NOT NEED TO RIDE ALONE.

    A DANGLING CITATION ALREADY NAMES THIS ID, AND IT IS NOT A COLLISION THE ALLOCATOR COULD SEE.
    `plan/tasks.d/W1-T341-deploy-idle-gate-deferral-bound.yaml` cites this id in prose and in
    `plan_refs` as "`decideDeployTrigger`'s staleness rule", added by #1303 on 2026-08-04 when the
    plan's ids were nowhere near this range. Verified across all history: this id was NEVER declared
    as an `id:` field and no shard for it ever existed, so `mintNextTaskId` — which reads `id:`
    fields structurally and not prose — never saw it and the reservation is sound. The consequence
    is editorial rather than structural: once this shard lands, W1-T341's reference points at an
    unrelated task instead of at nothing, which is worse for a reader than a dangling id. W1-T341's
    record is NOT edited here — Rule 15 keeps a worker out of another task's record — and the
    correction is left to the operator.

    PROOF DIALECT UNIFORM AND DELIBERATE. Every criterion forward-references through `unit test:`. A
    forward-referencing `grep:` at an EXISTING path is a HARD refusal on a filing PR: the path is
    greppable, the symbol is not yet there, the proof executes, returns zero, and `executed_fail`
    overrides keyword coverage. Two filing PRs were refused that way inside half an hour on
    2026-08-20 before the pattern was named.

    ID PROVENANCE — PRE-MINTED AND READ BACK BEFORE FILING, THEN RE-SWEPT IMMEDIATELY BEFORE
    PUSHING. The reservation resolves to the sha the operator's own mint printed. Five surfaces, each
    with a live control: the reservation (present; control, a sibling id, present); shard FILENAMES
    via `git ls-tree -r` (zero; control, a merged id, one); ids mentioned under `plan/` (ONE — the
    dangling W1-T341 citation above, which is why this note exists; control, a merged id, one); open
    PR text (zero; control one); and `git grep` across `src/ test/ deploy/` (zero; control W1-T1046,
    two — the id claimed in shipped source while four surfaces read it free, which is why that fifth
    surface exists). Live `run-` branches for this id read zero against a control reading one.
