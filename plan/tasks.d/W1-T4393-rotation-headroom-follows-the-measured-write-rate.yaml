  rationale: |
    MEASURED 2026-09-23 on the fleet host (~/rmd-state2/state) after delta archiving (#6876) went live at 21:55Z:
    rotations at 21:54:59, 21:59:18 and 22:03:33 (about 14 per hour); each new archive is a pure delta
    (325 and 266 rows, 11.9 KB and 11.2 KB gzipped, 0 rows shared; control: the last two full snapshots shared
    5,962 of 6,254 rows). But the live file sits at 4.10-4.18 MB right after rotating. rotateLedger's per-step
    caps (MAX_RETAINED_LINES_PER_STEP) and dedupe leave a retained core above the 4 MiB ceiling, so every
    rotation ends in the W1-T244 convergence shed to `Math.floor(ceilingBytes * 0.9)`. The next ~420 KB of
    appends trips it again. Each rotation re-reads and rewrites the whole ~4 MB live file synchronously on
    the daemon's loop, about 1.4 GB of rewrite a day for about 2 MB of new rows an hour. The retained core
    existed so live-only readers kept history. Since #6868 and #6876, union readers read the archives and
    the archives hold every row once, so a smaller live core loses nothing.
  amendments: |
    AMENDED 2026-09-24 AFTER #6936 (W1-T4394) DEPLOYED, per the parking ruling: re-measure the rotation rate,
    then shed high-volume steps first and protect decision-critical live readers, or close. RE-MEASURED on the
    fleet host (~/rmd-state2/state, deduped union of archives plus live file, 07:30-11:30Z): 3,522 rows/h,
    1.30 MB/h; github.wake.* down from ~1,035 to ~110 rows/h; 18 archives 07:07-11:26Z, still ~4.2 rotations/h,
    so the falsifier below is NOT met. The live file after rotation: 4,017,518 bytes in 6,110 rows, 3,803,838
    bytes of them older than an hour, and ZERO rows of worker.activity, worker.turns, sweep.dispose,
    sweep.dispose.not_open, board_gateway.* or github.wake.summary. HIGH-VOLUME STEPS ARE ALREADY SHED FIRST:
    passes 1-4 of rotateLedger keep none of them. What fills the ceiling is the retained decision and render
    core: sweep.disposed 865 KB, review.posted 829 KB, review.post_refused 450 KB, report.followups 191 KB,
    main.health.observed 141 KB, review.unwired_advisory 124 KB. The original design (shed to ceiling minus an
    hour of rate) would drop ~1.3 MB of exactly those rows oldest-first, which is why it was parked. #6987 cuts
    ~10% of appends at the source (duplicate sweep.dispose rows) but none of the core, so it does not make this
    moot. The design is therefore inverted: keep the core whole and raise the ceiling above it by the measured
    rate. The earlier build on run-W1-T4393-1790216136013 implements the superseded design; do not reuse it.
  design: |
    Keep every row passes 1-4 of rotateLedger retain; this task changes no retention set and no per-step cap.
    After a rotation writes the carried core, compute the EFFECTIVE ceiling = max(LEDGER_ROTATION_CEILING_BYTES,
    carried core bytes + one hour of the measured append rate), capped at LEDGER_ROTATION_CEILING_BYTES x
    LEDGER_ROTATION_BACKSTOP_MULTIPLIER. The rate is bytes appended since the previous rotation (the live size at
    rotation minus the previous carried core bytes) over the time since it (the newest archive's mtime, as
    ledgerRotationDue already reads), smoothed across rotations. Persist the effective ceiling beside the carried
    prefix in ledger.ndjson.carried.json, so the per-append ceiling check reads one small file and never lists
    the archives. With no measured rate, or an unreadable sidecar, use today's fixed ceiling. The W1-T244
    convergence shed is unchanged and still applies when the core itself exceeds the effective ceiling (only
    at the backstop cap). Ledger the measured rate and the chosen ceiling on each rotation. TRADE, stated: a
    live-only read grows from ~4.0 MB to ~5.3 MB at today's rate, while rotation rewrites fall from ~4.2 x 4 MB
    an hour to ~1 x 5.3 MB, and union readers open ~4x fewer archives.
