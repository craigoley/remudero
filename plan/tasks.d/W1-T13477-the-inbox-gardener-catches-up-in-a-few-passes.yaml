  acceptance:
    - claim: "The Inbox gardener's ledger catch-up budget per pass is 300 seconds"
      proof: "grep: ledgerCatchUpMs: 300_000 in src/lib/inbox-gardener.ts"
    - claim: "The pinned limits test asserts the 300-second catch-up budget"
      proof: "grep: ledgerCatchUpMs: 300_000 in test/gardeners/the-inbox-gardener-retires-an-ask-whose-task-already-shipped.test.ts"
  rationale: |
    WHY: Craig approved the Inbox gardener in shadow mode; act mode waits for a clean day of shadow rows, and no pass
    can be clean until the gardener read model has read the whole ledger.
    OBSERVED on the host 2026-11-17 (daemon booted 13:44Z with W1-T13348, again 16:06Z):
    - inbox.gardener_pass rows 14:57Z and 18:15Z: source_partial, gaps [coverage:ledger] (18:15Z also coverage:plan).
    - Read model source_file checkpoint: 18 archives read after the 14:57Z pass, 23 after 18:15Z, of 232 on disk
      (~885 MB gz). 0 quarantined rows, no source fault.
    - garden.lifecycle: the inbox pass waits 20-42 min in the admission queue and runs about every 3 h; the 14:57Z
      pass took 42 s of which 20 s was catch-up.
    At 5-18 archives per 20 s pass and one pass per ~3 h, full coverage takes days.
    W1-T13348 (merged, #19080) replaced the 25 ms tick with a 20 s catch-up; this task only resizes that budget from
    host measurements of the shipped mechanism, so the shared files are an amendment, not a second build.
    READ at origin/main: INBOX_GARDENER_LIMITS.ledgerCatchUpMs = 20_000 (src/lib/inbox-gardener.ts). The pass runs in
    a garden child process (garden-registry lifecycle reports executionMs and process-completed), not in the daemon
    loop, and garden-registry sets no execution time limit for it, so a longer catch-up does not stall the daemon.
  design: |
    NO-INVARIANTS: only a budget constant changes. The read still stops at the budget and reports source_partial
    until coverage is complete; the existing W1-T13348 catch-up test keeps guarding that, and it passes at the merge
    base too, so it cannot be an acceptance proof.
    1. Set INBOX_GARDENER_LIMITS.ledgerCatchUpMs to 300_000. At the observed rate that reads ~75-270 archives per
       pass, so coverage completes in 1-3 passes; once caught up, a pass reads only new rotations and returns early.
    2. Update the pinned limits assertion in the-inbox-gardener-retires-an-ask-whose-task-already-shipped.test.ts.
    The W1-T13348 catch-up test derives its stepping clock from the constant and must pass unchanged. It is not an
    acceptance proof: it passes at the merge base too, so proof-discrimination refuses it (amended after #19181).
  falsifier: |
    Leave the constant at 20_000 and the pinned limits test and the grep proofs fail.
