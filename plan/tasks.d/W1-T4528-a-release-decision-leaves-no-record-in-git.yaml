  rationale: |
    READ 2026-09-24 at origin/main 9aa0dd61. Names are symbols; re-verify at your head.

    OBSERVED: accumulateDeployRestartPressure (src/lib/deploy-judge.ts) scores each pending change
    (0/1/3/9/18) and restarts at DEPLOY_RESTART_SCORE_THRESHOLD (18), at most once per
    DEPLOY_RESTART_RATE_CEILING_MS (1 h). Its only record is the `deploy.restart_score` and
    `deploy.restart_pressure` ledger rows on the deciding host.
    OBSERVED: .github/workflows/acr-build.yml tags every successful image build `image/<date>-<sha7>`
    (a BUILD marker, pushed with GITHUB_TOKEN). There is no release marker.
    Phase 2 of the release-tag plan. It records releases and changes no deploy behavior: nothing
    consumes the tag until W1-T4530.
  design: |
    (i) Only the primary (W1-T4527 isPrimaryDeployment === true) mints. Any other answer mints nothing.
    (ii) When runDeployCycle's pressure decision is `restart`, mint an ANNOTATED tag
         `release/<YYYYMMDD>-<n>` (n = 1 + today's highest n on origin) on the source SHA being deployed.
    (iii) The tag message is a manifest the next phases parse, one `key: value` per line after a title line:
          `source_sha`, `image_ref` (the registry image built for the newest baked-path commit at or before
          source_sha, via the existing newestBakedSha reading: the release bundles its image), `prev_release`,
          `total`, `threshold`, `decided_at`, then one `change: <sha> <score> <reason>` line per scored change.
          src/lib/release-tags.ts owns formatReleaseManifest and parseReleaseManifest as exact inverses.
    (iv) Tags are append-only: never moved, never deleted. A name collision retries with n+1 and a mint failure is
         logged as `release.mint_failed` and never blocks the deploy the decision already made.
    (v) Mint with a credential whose push starts workflows (the fleet App's installation token, not
        GITHUB_TOKEN, whose events start no workflow run). Name the credential path you used.
    (wiring) runDeployCycle calls mintReleaseTag from release-tags.ts.
