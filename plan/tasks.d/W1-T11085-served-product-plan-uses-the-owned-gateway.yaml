  design: |
    Reuse fleetRatifyGateway/freshOriginMainTreeRunner and the maintained owned worktree factory,
    dependency attachment, clean source, identity, lease, child lifetime, causal scope and ledger
    behavior. Correct the actual serveCommand/server composition so its real product routes
    receive the typed owned public productPlan port. Keep library code independent of CLI
    initializers. Use one maintained construction path; do not add another launcher, clone scan,
    hard-coded host directory, detached fallback or persistent service. Preserve correct control,
    instance, source and target roots. Check the production worktree/log/state locations rather
    than assuming an immutable generation's sibling is a managed target or writable worktree.

    Existing unowned server assembly must continue to make productPlan unavailable explicitly.
    Preserve approve/reframe compatibility and update the old CLI wiring assertion if the owned
    gateway now arrives from the CLI. Do not weaken the refusal or fabricate successful status.
    Keep product ownership, verification, operation idempotency and product/global budget gates.
    A failed fresh-source handoff remains a failed/unknown operation under the existing journal;
    it is not evidence of success and is not silently retried.

    Exercise the production assembly without injecting planGateway or a fake productPlan method.
    Use local Git repositories, configured fixture identity, a real child fixture executable and
    the existing owned runner/ledger path. Observe actual cli_started/exited rows and source/head
    provenance. No test invokes a model or remote side effect. Cover no owned runner, unavailable
    fresh source and repeated identical saved-command recovery with at most one actual child.
    Keep each catch/refusal observable; fixture-only fake services cannot substitute for testing
    the default seam. New imports use package aliases and the shared repository-root helper.

    Keep this task dispatch-held until its filing review, required checks, protected merge and
    approved operator release are recorded. Approval is scoped to five files and USD30, not a new
    implementation retry allowance or higher global limit. Normal ownership, selector, admission,
    TDD, review, hosted CI and protected merge remain required. Do not revive completed C3 source
    branches, edit other workers' claims, change access, restart services or stop shared workers.
    Source tests, deployment adoption and signed-in operation results are separate evidence.
    The first actual Wreckterra gameplay worker must still launch through signed-in Console C4;
    no CLI substitute or physical-device claim is granted by this repair.
