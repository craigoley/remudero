  rationale: |
    At c5119b5428, scripts/preflight-author.mjs:737-739 runs its selected Node suites without
    --test-timeout. scripts/lib/author-step-capture.mjs:9 bounds the whole step at four hours;
    src/lib/review.ts:3599-3635 also has a whole-proof bound. Neither names an individual hung
    test or allows a finished test run with leaked handles to exit normally. The first run's
    claim that the Mac lock could be held indefinitely was overstated, and its permission errors
    were caused by the wrong user. The narrower code gap is real: fast and slow hosted tiers
    already supply per-test hang bounds, while author preflight and Node unit proofs do not.
    Open-head inspection found no new overlapping task or implementation in 13 open PRs;
    W1-T11445 and #16969 concern plan merges and event-loop pipe holds, not Node test timeouts.
  design: |
    Share a Node argv helper between author preflight and the sync/async proof executors.
    Derive the per-test timeout from the slowest selected suite's measured duration, with the
    manifest's existing tier threshold for unmeasured suites and its calibrated hang factor.
    Preserve an explicitly supplied timeout rather than silently replacing caller policy.
    Include the existing force-exit and result-pipe-drain handling so completed summaries survive.
    Preserve suite selection, ordering, outer process bounds and non-Node proof commands.
    Load the target checkout's manifest lazily for proofs, preserving src-only sandbox imports.
    No new duration threshold. Test the real executor argv through injected spawners without
    network access, including async execution, fallback inputs and explicit-timeout precedence.
