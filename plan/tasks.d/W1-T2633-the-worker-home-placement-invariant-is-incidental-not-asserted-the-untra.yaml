    SIZING: files names one src stem and its OWN test file (moduleIdFromPath strips `.test`, so both
    resolve to `worker-home`) plus .gitignore, which yields no module id at all — one concern, one
    subsystem, so risk:medium is the honest band rather than a Rule 19 regrade.
    CROSS-REFERENCES, none of them re-filed here: W1-T18 (the redirection mechanism this asserts the
