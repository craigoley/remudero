- id: W1-T2633
  title: "THE WORKER-HOME PLACEMENT INVARIANT IS INCIDENTAL, NOT ASSERTED — the untracked dotfiles are expected scaffolding (15 worker-home-<runId>.<uuid> siblings of the checkout, each holding exactly the eight WORKER_HOME_RC_FILES plus .claude.json, zero of them inside a work tree), but workerHomeDir returns an OPERATOR-SETTABLE config.workerHomeRoot with no guard, so one config value would materialize home scaffolding INTO a tracked tree; refuse a home that resolves inside any git work tree, ignore the two editor directories, and write the answer down"
  repo: remudero
  depends_on: []
