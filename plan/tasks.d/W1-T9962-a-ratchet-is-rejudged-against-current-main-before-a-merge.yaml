  design: |
    1. ONE PURE VERDICT. Add `judgeMergedRatchets` (src/lib/merged-ratchet-verdict.ts). It takes readers for the merged
       tree and for main's tip, and the changed paths (the merge-tree tree diffed against main). It returns `clean`,
       `crossing`, `stale-lowering` or `unread`. Each counted row carries the gate, path, merged count, main's
       ceiling, the PR's ceiling and a `rederived` value. Counting reuses the gates' own counters, never a copy:
       - `evaluateCensusPrecheck` from scripts/census-precheck.mjs, with readHead from the merged tree and readBase
         from main. That gives comment-load, clock-signature, fixture-copy, house-layout and deps-interface.
       - `evaluateRatchet` from learnings-budget-ratchet.mjs and claude-md-budget-ratchet.mjs, read off the trees.
       - affected-reach: move `measureReach` and `reachVerdict` from test/the-affected-suite-reach-ratchet.test.ts
         into scripts/lib/affected-reach.mjs, so the census test and the judge import one counter. Its importer count
         is a board-wide total that two PRs can each raise by one.
       Gates it does not count are named on the row, never read as clean:
       - `run-derived`: coverage and mutation ceilings, which need an instrumented run. W1-T5696's baseline-path
         refresh still covers them.
       - `delta-only`: source-size. Its CI form, `source-size-signal`, reports each PR's own delta and exits 0 on
         growth, so it has no shared ceiling to cross.
    2. A CEILING LOWERED ON A STALE BASE IS RE-DERIVED ON MAIN. Take a row the PR lowered, where the merged count is
       above the PR's value but at or under main's ceiling (#12388: PR row 18250, main row 18251, merged 18251). That
       is `stale-lowering`, and `rederived` is the merged count: the value the ratchet's own shrink-record writes on
       that tree. A tightening from main never reads as a raise. A merged count above main's own ceiling is
       `crossing`, and `rederived` is the gate's printed record value. The verdict never edits a branch itself.
    3. JUDGED AT THE ARM AND AT THE MERGE. Add the dep `readMergedRatchets` (optional, like `readOwnFiles`).
       - In `attemptArmSteps`, call it before `deps.armAuto`, on both passes (W1-T5922 arms on the light pass).
       - In `directMergePreflightSteps`, call it before each merge-as-is return: the W1-T3694 untouched arm and the
         W1-T5748 plan-safe arm. W1-T9536's overlap check stays beside it.
       A PR at behind_by 0 is skipped: its merged tree is its head, and its CI already counted it.
       On `crossing` or `stale-lowering`, do not arm and do not merge. Take the existing update-branch effect under
       W1-T5921's one update per (PR, head), and record `reason: ratchet_collision` with the rows on the evidence.
       The refreshed head re-runs CI on current main. Its ratchet red then goes to the PR's own W1-T4004 ratified
       baseline repair (`ratifiedBaselineRatchetRepairFor`), which writes `rederived`, or to the fix lane.
    4. AN ARMED PR IS RE-JUDGED WHEN MAIN MOVES. GitHub merges an armed PR whenever its checks finish, so a verdict at
       arm time goes stale as main advances.
       - Each sweep pass, full or light, judges every auto-merge-armed, non-draft PR whose (head, main tip) pair has
         no judge row yet. The memo is that pair, so a quiet main costs nothing.
       - A `crossing` or `stale-lowering` verdict refreshes that PR through `updateBranch`, as a repair path:
         `forced_by: ratchet-collision` on W1-T7735's `sweep.refresh.decided` row. Each refresh is once per (PR, head),
         under W1-T5939's incident hold, oldest arm first.
       - Never disarm. `--disable-auto` has itself fired a merge (synthwatch #340). The new head is enough: GitHub
         cannot merge it until its required checks pass on current main.
       - A `clean` verdict lets W1-T7735's ambiguous-overlap judge skip the LLM call for a baseline-path overlap,
         because the count already answered it.
    5. CHEAP AND BOUNDED BY THE WORK, NOT A NUMBER.
       - One `git merge-tree --write-tree --no-messages <main> <head>` runs in the managed clone, after fetching main
         and refs/pull/N/head as `probeOpenPrMerges` does. Use the fetched FETCH_HEAD sha, never a local branch.
       - Reuse `probeMerge`'s tree when that pair was probed this pass.
       - Read blobs with `git show <tree>:<path>`, off the loop through `execFileLoopBounded`. There is no worktree,
         no npm and no CI run.
       - Only measured paths that the PR or main changed since the merge base are counted, plus every baseline the
         merge touched.
       - No count cap and no new constant: the armed set is the bound, and each pair is judged once.
       - A merge-tree conflict is left to GitHub's mergeability (a dirty PR is never armed). A failed read or a
         counter throw is `unread`: the arm or merge proceeds as today, with the reason on the row. That is a third
         value the outcome join can score, never a silent clean.
    6. SELF-TUNING ROWS.
       - `sweep.ratchet_judge.decided` records: PR, head, main_sha, verdict, the counted gates, the uncounted gates
         and their class, the rows (capped list plus count), the remedy and elapsed ms.
       - `sweep.ratchet_judge.outcome` joins a later main red on a ceiling gate (the `main.health.observed` and
         main-repair-ratchet rows) to the last `clean` verdict of the merge that reddened it. That catches a miss, e.g.
         two PRs that main had not joined when each was judged, so the hit rate is observed rather than assumed.
       - Add both steps to the rotation-retained list in src/lib/ledger.ts.
    SHARED SURFACE ONLY: W1-T100 (blocked_ci routing to the ci-log fix) and W1-T9748 (a recon tracing declared files to
    the staging refusal) also name src/lib/sweep.ts and src/run-task.ts. Neither judges a ceiling or holds an arm or
    merge. Here sweep.ts gains only the armed re-judge selection, and run-task.ts only the merge-tree I/O wiring.
    COMPOSITION. W1-T9536's overlap refresh, W1-T5748's plan load, W1-T7214's ready-light pass, W1-T7735's value test,
    W1-T4351's base-red slot and the #10390 main-health rung are unchanged. This task adds a measured count before the
    arm or merge, and a re-judge while armed. A crossing that slips through the window between a main advance and the
    next pass is still recorded by main-repair's ratchet lane, and the outcome row counts it.
    TESTS. Build the incident with gitRepo() and a local identity, never raw `git init` (fixture-copy census; the CI
    runner has no git identity):
    - main starts at a baseline row of N with N comment lines;
    - a main commit adds one line;
    - PR A adds one line on the old base;
    - PR B trims, records N-1, then merges an older main;
    - PR C adds one line.
