    (no `reload` symbol in the file). The instance's managed checkout IS fast-forwarded (W1-T4356), so its plan
    files move while serve holds the boot parse. Core's main thread reloads in place (reloadServePlan) and
    #8784 pins worker threads to it; non-core instances have neither. W1-T5060 retires these gateways, but it is
    dispatch_hold on a 7-day measured gate, so the stale board stands until then. Scope-time checks: W1-T5060 is
    the only open record naming instance-gateway.ts and it retires rather than reloads; no run- branch or open
    PR head touches the file.
  design: |
    Each non-core instance's BoardDeps reads its plan through a per-instance holder that re-parses when the
    instance's plan files change (thread-plan.ts planFilesIdentity is the file identity core threads already
    use), off the request's hot path where possible, and swaps `board.plan` in place as reloadServePlan does for
    core. A failed re-parse keeps the last good plan and logs `serve.instance_plan_reload_failed` naming the
    instance; a successful one logs `serve.instance_plan_reloaded`. An instance whose BOOT parse failed still
    answers 503 until a later parse succeeds.
    This machine-authored scope amendment records two coupled source concerns as high/span and explicitly holds implementation pending a fresh native filing judgment and verified resolution of the preserved remote source ownership. The dispatch_hold is intentional, not an automatic release: a proceed judgment alone does not establish source-owner handoff or clear this hold. It records no prior operator release or model verdict. The earlier medium/blast-radius classification and failed census receipt are preserved in Git and validation evidence; configured worker budget, original claim and operational authority are unchanged.
    Qualification boundary: loaded plan identity is not remote freshness. The October27 read-only comparison found Serve on Console checkout 2b91e906 with179tasks while the actual Console daemon was on249c7f40 with216tasks. Reloading the same old mounted checkout cannot repair that separate mount/source-origin mismatch. Keep it an explicit operational readiness dependency; this task cannot fetch, pull, remap, restart, select another registry, or silently borrow a daemon code tree.
    Publication barrier: recheck the same plan-source identity before publishing a replacement. Resolve this instance repository and configured plan path once, capture its monolith and complete shard identity, parse only that source, and reject identity changes or unreadable source at the final check. A last good plan may remain available as retained evidence; do not describe failed refreshes or missing source as a successful current load. Preserve startup503 until a successful verified load, and source/repository isolation throughout.
    Recent cache repair: replay only retained recent rows when the plan identity changes. Status already invalidates its plan-keyed memo, but recent activity otherwise permanently skips rows for unknown taskIDs. Keep its bounded retained history and normal unchanged-request incremental behavior; a plan update must not trigger a full rotated-ledger scan, a new measurement store or duplicate GitHub decoration on every render.
    Legacy work preservation: retain remote WIP 575da92a3d2a3885df2f35730bc233c91e10485e on run-W1-T6012-1791711657759. It is not a merged or qualified implementation. Resolve source ownership and process-tree quiescence through the normal native workflow before implementation; do not overwrite or clear another owner. Extend the existing physical gateway/server regression suite test/one-gateway-serves-every-instance.test.ts; no nonexistent future path is declared and no committed test is removed. New test code uses package aliases and the shared root helper.
    Default-path controls must use physical temporary sources and the real loader, not only injected fakes. Cover healthy current identity, stale or changing identity, missing and unreadable sources, malformed edits, boot recovery, same-count shard changes, unchanged memo reuse and cross-instance isolation. Remove the reload wiring and independently remove the recent-cache invalidation to demonstrate both regressions. Keep all limits, permissions, routes, write-action checks, read-model switches, provider/budget settings and hosted gates unchanged.
