    - claim: "After a verified plan replacement the same recent route can classify already-retained rows for newly known tasks and updated titles, with unchanged requests remaining incremental and other instances isolated"
      proof: "unit test: W1-T6012: retained recent activity follows its instance plan identity"
    - claim: "Concurrent reads share one bounded refresh, repeated failed identities do not create duplicate readers or unbounded diagnostics, and a broken boot recovers only after a verified successful load"
      proof: "unit test: W1-T6012: instance plan refresh coalesces and recovers without a restart"
