  title: "THE PER-SESSION CONTEXT TAX IS PAID ON RULES THE WORKER CANNOT ACT ON — CLAUDE.md is injected IN FULL at 67,535 bytes with ONE byte of headroom, 9,723 of them about operating the daemon host a containerised worker can never touch, 6,400 in five dated append-only sections the file's own maintenance rule forbids, and 30 of its 84 bullets name a concrete path that `learnings/`'s glob matcher already scopes"
  repo: remudero
