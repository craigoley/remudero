    `refs/rmd-id/W1-T1028` each read 1. Mention-trap control: `W1-T999999` reads 0 refs and 0
    filenames.
    THE MINT USED THE PLAIN REFSPEC WITH EVERY VARIABLE BRACED: orphan payload over the empty tree
    (4b825dc642cb6eb9a060e54bf8d69288fbee4904), nonce
    Craigs-Mac-mini-56516-1787146675876532000, no `+` and no lease: PUSH RC=0, `* [new reference]
    46a590b891a256cd8e4972bce8a8dfac8261e086 -> refs/rmd-id/W1-T1030`, readback equal, `HTTP 403`
