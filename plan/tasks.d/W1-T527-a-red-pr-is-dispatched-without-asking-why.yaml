  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, and independently
    warranted: this decides whether a red PR gets a worker at all, so a wrong classification does not
    fail loudly, it silently stops fixing something. budget_usd 40 — one pure predicate, three
    discriminators over data already read, and a stand-down that reuses the existing mechanism.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT IN PYTHON (a bare substring inflated `ghLiveState`
    from 6 to 11 today). `src/lib/sweep.ts` scores `standDownReason` 19, `isBlockedCi` 12, `ciFailures`
    10, `deriveDisposition` 8, `describeCiFailures` 4, `CiFailure` 3 — the predicate, the evidence and
    the stand-down all live there. `test/sweep-blocked-routing.test.ts` is the ESTABLISHED routing home
    (`isBlockedCi` 7, `deriveDisposition` 5) rather than a new file, because these assertions are
    exactly what that suite already covers. `src/run-task.ts` IS NOT DECLARED: it scores `ciFailures`
    28 but as the PRODUCER (`fetchCiFailures`), which needs no change — the classification consumes what
    it already emits — and it is a 19,943-line file `partitionByFileOverlap` (W1-T471) serialises
    against every task naming it. `src/lib/host-parity.ts` is NOT declared either: W1-T517's predicate
    is reused, not edited, and `inverseScopeUntouchedFiles` (`src/lib/review.ts`) fails a declared path
    the implementation never reaches.

    THE BEST OUTCOME WAS AVAILABLE AND IS THE ONE TAKEN: the classification is the whole task and the
    routing is free. Rationale (4) is why — a stand-down already spends no strike, so naming the cause
    is sufficient for the existing arms to do the right thing. An implementer who finds themselves
    building a new rung has left the design.

    PROOF NOTES: all four proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
    file and one unrelated failure fails every criterion. Each was verified to match ZERO files today
    against a control matching exactly one, and each is under 100 characters with no comma so
