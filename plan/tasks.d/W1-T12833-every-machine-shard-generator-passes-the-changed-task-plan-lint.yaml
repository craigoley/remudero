  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - 292 scout filings (207 distinct minted ids), 33 selector-shadow, 7 gate, 5 flow and 4 fix-lane filings were refused by [design-invariant-proof] between 2026-11-13T03:19Z and 2026-11-15T15:02Z. These gardens' shards never reach main.
    - READ src/lib/machine-filing.ts renderMachineShard: it parses its own text and calls lintTask(task) with default options. A record the plan PR preflight refuses (lint-plan --base sets requireDesignInvariantDeclaration) therefore reads clean to its filer.
    - git grep for NO-INVARIANTS and "INVARIANT " over the generator modules finds one declaration, the gate gardener's fixture-crossing template. The other renderMachineShard call sites declare nothing: ci-friction, flake-incident, flow (2), flow-remedy, gate (3 more), host-resource, hot-file, scout. The same holds for selector-shadow's two hand-assembled templates and the CI-learning draft in measurement-cadence.ts.
    - Class cause: nothing runs the generators against the lint the gate applies, so a new lint rule breaks machine filing in production with no CI signal. The same thing happened earlier with new-shard-rule-suite (12 scout refusals) and shared-proof (15 selector-shadow, 7 redesign).
  design: |
    1. machine-filing.ts: add the required invariants field to MachineShardSpec. Render the declared form into the design text and the acceptance list (one invariant:<slug> claim per slug with its own proof). Lint with the changed-task options that need no checkout (requireDesignInvariantDeclaration true). Export the option set so the census uses the same object.
    2. Each generator declares truthfully for its own template. Prefer a real INVARIANT with a mapped claim wherever the drafted remedy changes existing behaviour (for example "the gate still refuses the defect it was written for", "the symptom row is still written when its failure occurs"). Use NO-INVARIANTS only with a specific reason (for example a task that only adds a new test or scorecard). Never use a placeholder reason.
    3. selector-shadow's two templates and the CI-learning draft call the shared lint on their final text before writing.
    4. The census is the durable guard: it enumerates the generators by name and renders each from a fixture finding.
    INVARIANT a-generator-never-writes-a-refused-record: a record the shared lint refuses is never written or landed, and the refusal is logged with its checks, so adding a lint option can only stop a filing, never let a refused one through.
    The nine existing suites in files: build a MachineShardSpec by hand and gain only the required field; one judge suite's expectation gains the invariant claim.
    KNOWN REMAINING, found while building: a plan-only filing promotes two older warnings to blocks (promoteIntroducedPlanOnlyDiagnostics). The selector-shadow miss template carries shared-proof (its two original claims share one proof) and the CI-learning draft carries proof-scope (its second proof greps a fixture path outside files:). Both predate this task and still refuse those two filers at the preflight; they need their own task.
    NOT IN SCOPE: the lint's scope for old tasks (W1-T12832), LLM-authored designs (redesign, triage), and the per-garden retry ladder (W1-T12834).
  falsifier: |
    Drop the changed-task option from the shared lint and criterion 1 must fail. Remove one generator's declaration and criterion 3 must fail naming it. Write a refused record and criterion 4 must fail. Restore and all pass.
