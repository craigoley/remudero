  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives each concern from a declared
    path's stem, so a source file and a test not named after it trip it at `medium`. `files:` here is
    one source file and one new test; the blast radius is a lane's own reporting, with no gate moved,
    no test skipped and no branch or declaration removed.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/host-caused-suite-reds.test.ts`, declared in `files:`, so on this filing PR it
    resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED, NOT ASSUMED. `rmd check-proof` on the declared path reads
    `hits: 0`, `verdict: fail` — it names no existing file. The SAME verb on an EXISTING pure path,
    `unit test: test/ci-parity-contract.test.ts`, reads `exit: 0`, `hits: 64`, `verdict: pass`. So the
    dialect DOES execute a pure path when one exists, and the absent path's non-execution is the
    forward reference rather than a broken proof. The first file tried for that falsifier,
    `test/ci-parity.test.ts`, DOES NOT EXIST and read `hits: 0` exactly like the declared path — a
    falsifier that discriminated nothing; it was replaced rather than reported.

    THE CENSUS IS CARRIED, NOT RE-MEASURED — no suite was run for this filing. What WAS re-derived
    here from source: the 29 `runs-on:` lines and the zero `macos` mentions, the
    `notify-platform-guard` prose, the `runStep("ci:test", …)` call site, the `declare -A` line and
    the host's bash version, the `keychain` seam's six fields against `runReview`'s zero, the
    `CLAUDE_CODE_OAUTH_TOKEN` acceptance on non-darwin, and the `state-backup` skip's actual
    predicate. The corrected 17 comes from a per-file recount of the SAME TAP output the census used.

