  design: |
    No new constant. Memory stays bounded by distinct frames, not by stall length.
    1. FOLD, DON'T DROP. Each rotated chunk is folded into a running per-frame aggregate before it is released, so a
       stall of any length is attributed from the moment profiling began. The aggregate is keyed by frame and
       caller, so its size follows the number of distinct frames the stall ran, never its duration.
    2. SAY WHAT WAS PROFILED. The row gains `profiled_ms` (the summed span of the folded chunks) and
       `unprofiled_ms` (the stall's time before profiling began, about one bound). `unattributed_ms` keeps its meaning
       (lag minus sync spawn); a reader can now tell profiled-and-unnamed from never-profiled.
    3. NAME THE CALLER. Each top self frame carries `caller`: the nearest ancestor in the profile's node tree with
       a script url (function, url, line), so readFileUtf8 or getReport names the JS that called it. The row also
       carries `top_inclusive`: the JS frames with the most total (self plus descendants) time, the same count
       (`LOOP_STALL_TOP_FRAMES`) as the self list.
    4. Unchanged: the derived bound, the one-profile-at-a-time rule, the failure row and the no-file rule.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Feed `topSelfFrames`' successor
    synthetic `CpuProfile` chunks (a native leaf under a named JS function, three chunks of one stall).
