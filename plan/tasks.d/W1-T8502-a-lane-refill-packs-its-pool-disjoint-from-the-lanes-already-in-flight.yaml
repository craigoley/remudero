- id: W1-T8502
  title: "A LANE REFILL PACKS ITS POOL DISJOINT FROM THE LANES ALREADY IN FLIGHT — on 2026-10-12 at 08:28:15Z the refill packed W1-T7735 (P1, sweep.ts + run-task.ts) first, so the pack dropped every other run-task.ts task, then an in-flight lane serialized W1-T7735 away and P2 W1-T7812 took the lane while P1 W1-T7957 and P1.5 W1-T8198 were runnable, with no dispatch.serialized row"
