    - claim: "A valid source-owned template reaches a real temporary plan/feedback file while a worse legacy event is refused, and arbitrary template strings or unsafe metadata never leak"
      proof: "unit test: W1-T13131 criterion 3: a valid template files safely beside a refused legacy event"
    - claim: "invariant:eligible-controls-and-history — Eligible templated incidents retain authorization, body bounds, sampling, pause, pacing and open-work/landed-entry dedupe; refusal leaves historical fingerprints and already-landed feedback unchanged and never initiates a fix"
      proof: "unit test: W1-T13131 criterion 4: eligible controls and historical evidence remain intact"
    - claim: "HTTP ingest calls the source-owned template resolver before fingerprinting"
      proof: "grep: resolveIncidentTemplate( in src/lib/incident-events.ts"
    - claim: "SRE publication calls the source-owned template resolver before feedback capture"
      proof: "grep: resolveIncidentTemplate( in src/lib/sre-lane.ts"
  falsifier: |
    Restore normalized-message fingerprinting or sampleMessages publication separately: planted
    values change the basis or appear in the temporary feedback YAML, failing the regression.
    Remove the no-template guard: a legacy direct-ledger row files feedback and fails the test.
    A refuse-everything implementation fails the valid-template positive control.
