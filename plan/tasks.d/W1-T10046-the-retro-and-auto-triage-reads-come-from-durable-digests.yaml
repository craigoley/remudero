  design: |
    1. `readRetroTriggerLedgerAsync` reads through a module-level `createEscalationTriageHistoryReader` with slice
       { holder: "run-task.retro-trigger-runs", the RUN_LEDGER_STEP_PATTERN steps, version "1" } and hands
       `retroTriggerPrelude` records. When the read is not ok it falls back to the live file, as today. The sync twin
       `readRetroTriggerLedger` is unchanged; the parity test "the awaited and sync retro trigger reads answer the
       same corpus identically" stays green, and a new test shows the digest read finds the same runs.
    2. `autoTriageCheck`'s default `readRefusalRows` becomes an awaited module-level slice reader with holder
       "run-task.auto-triage-refusals" over the two refusal steps, off the loop. An unreadable read still means no
       refusals.
    3. Each retro check ledgers `retro_trigger.ledger_read` (the row W1-T9119 named) with rows, ms, rotations,
       seeded_rotations, digest hits and misses and the pass's loop read bytes and parsed lines from `lastPass()`; the
       auto-triage rows (auto_triage.fired and .skipped) carry the refusal read's same counts.
    4. No count, bound or env var is added. Each new holder adds one digest per rotation, pruned as the others are.
    5. TESTS in test/the-retro-and-auto-triage-reads-come-from-durable-digests.test.ts, `test(` titles verbatim as in
       the proofs: one reader writes digests over gzip fixtures, each archive is overwritten with same-length garbage
       and its mtime restored, and a fresh reader (the restarted process) must still return the archived rows.
  acceptance:
    - claim: "a restarted retro check reads its run slice from digests, not rotations"
      proof: 'grep: test("W1-T10046: a restarted retro check reads its run slice from digests, not rotations" in test/the-retro-and-auto-triage-reads-come-from-durable-digests.test.ts'
    - claim: "a fresh auto-triage check reads its refusal slice from digests off the loop, and an archived refusal still holds"
      proof: 'grep: test("W1-T10046: a fresh auto-triage check reads its refusal slice from digests off the loop" in test/the-retro-and-auto-triage-reads-come-from-durable-digests.test.ts'
    - claim: "every retro check ledgers what its read cost"
      proof: 'grep: retro_trigger\.ledger_read in src/run-task.ts'
  falsifier: |
    At origin/main a fresh process over the same-length-garbage archives cannot read them: the retro union refuses
    as incomplete and falls back to the live file, losing the archived run.start, so the first test fails; the sync
    refusal read returns not-ok, so an entry refused in an archived rotation fires, failing the second; and a
    setImmediate turn counter sees 0 turns during the sync read. Deleting the fix gives `# fail N`, restoring it
    `# fail 0`.
  note: |
    EFFECT, measured after merge: retro_trigger.ledger_read rows on the first check after a boot show digest hits
    for every archive and loop read bytes near the live file's size; a rootio-style capture after a boot shows no
    whole-corpus burst. Healthy shape: the two bursts are gone.
