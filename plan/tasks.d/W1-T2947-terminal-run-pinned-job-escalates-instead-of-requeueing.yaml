    - claim: "a run still in progress and a terminal run whose jobs are all terminal retain their existing dispositions and trigger no requeue"
      proof: "unit test: test/terminal-run-pinned-job-requeue.test.ts"
    - claim: "an unreadable jobs response or a pinned job without an id triggers no guessed mutation and retains the fail-closed escalation"
      proof: "unit test: test/terminal-run-pinned-job-requeue.test.ts"
