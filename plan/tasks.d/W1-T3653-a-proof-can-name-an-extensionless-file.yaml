- id: W1-T3653
  title: "NO PROOF CAN BE WRITTEN AGAINST AN EXTENSIONLESS FILE — the `grep:` dialect requires a target whose final segment carries an extension, so hooks/pre-push, hooks/pre-commit and every extensionless deploy script are unprovable by construction"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 12.00
  files: [src/lib/task-linter.ts, test/a-proof-can-name-an-extensionless-file.test.ts]
  origin: oper#pr-queue-sweep-2026-09-16
  plan_refs: ["W1-T3388"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED ON #5740, 2026-09-16. That PR's subject was hooks/pre-push, and its acceptance could
    not name the file it changed:

        acceptance-author-gate: REFUSED (proof-shape) — criterion 1 cannot execute: target
        `hooks/pre-push` names no file — a `grep:` proof must name a FILE (a path whose final
        segment carries an extension, e.g. src/lib/plan.ts) — a directory target is not a proof
        of anything specific.

    The rule is a HEURISTIC standing in for "is this a file or a directory", and on this repo's own
    tree it is wrong for an entire class: `hooks/pre-push`, `hooks/pre-commit`, `hooks/commit-msg`
    are all tracked, all executable, all extensionless. So is any extensionless script under
    deploy/. Every one of them is unprovable, and a task that changes one must aim its proof at
    something adjacent -- which is what #5740 did, naming the test file instead.

    THAT IS A PROOF OF THE WRONG THING. The claim was about the hook's behaviour; the proof could
    only reach the suite that exercises it. The gate did not refuse a weak proof, it refused the
    accurate one and accepted a weaker substitute.
  design: |
    The question the heuristic is approximating is answerable exactly: git knows whether a path is a
    blob or a tree. `git ls-files --error-unmatch <path>` (or a cat-file type read) settles it with
    no guessing, and the proof executor already shells git elsewhere.

    KEEP THE REFUSAL FOR A REAL DIRECTORY. The check exists because `grep: foo in src/lib` proves
    nothing specific, and that must keep failing. What changes is the TEST it applies: blob-or-tree
    rather than has-a-dot.

    A PATH THAT DOES NOT EXIST AT ALL IS STILL REFUSED, and its message must say which of the two it
    is -- absent, or a directory -- because "names no file" today cannot tell an author with a typo
    from one aiming at hooks/pre-push on purpose.

    THE SEAM MATTERS: the linter runs in contexts with no repo (unit tests, a plan loaded from
    text), so the existence read must be injectable and must degrade to today's extension heuristic
    when it cannot run, rather than refusing everything or accepting everything.
  acceptance:
    - claim: "a grep proof naming a tracked extensionless file is accepted and executes against that file"
      proof: "unit test: test/a-proof-can-name-an-extensionless-file.test.ts"
    - claim: "a grep proof naming a directory is still refused, so the check keeps the case it was written for"
      proof: "unit test: a directory target is still refused"
    - claim: "an absent path is refused with a message naming absence rather than directory-ness, so a typo reads as a typo"
      proof: "unit test: an absent path is refused as absent not as a directory"
    - claim: "with no repo reader injected the extension heuristic still applies, so the linter keeps working where git cannot be reached"
      proof: "grep: GREP_TARGET_EXTENSIONLESS in src/lib/task-linter.ts"
  falsifier: |
    Take #5740's refused criterion verbatim -- `grep: <pattern> in hooks/pre-push` -- and it must be
    accepted and execute. Point the same proof at `hooks/` and it must still refuse. Point it at
    `hooks/pre-pushh` and the message must say absent, not directory. Remove the injected reader and
    the extension heuristic must return, or the linter breaks everywhere it runs without a checkout.
