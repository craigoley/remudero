- id: W1-T408
  title: "the daily cost ceiling is derived from the LOCAL ledger, so N instances spend N times it — and from inside either one everything looks correct, because each knows only its own spend and nothing self-corrects"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: "RE-DERIVED FROM SOURCE AT e2bdc55. `checkCostGovernor` (src/lib/sweep.ts) defers a
    dispatch when the observed day cost reaches `policy.dailyCostCeilingUsd`, and the observed
    figure reaches it from `costGovernorGateFor` (src/run-task.ts), which reads the LOCAL ledger
    file and sums each run's `verdict` line for the current UTC day. plan/policy.yaml sets the
    ceiling to 500.
    SO THE CEILING IS PER INSTANCE, NOT PER ACCOUNT. Two containers each stop politely at 500 and
    the bill is 1000. Each one is reading its own ledger correctly, refusing at exactly the
    configured number, and reporting a healthy fleet. THE CORE SENTENCE OF THIS FILING IS THAT
    NOTHING LOOKS WRONG FROM INSIDE EITHER CONTAINER — there is no error, no warning, and no
    reading either instance could take that would reveal the other. It is not a race and not a
    drift; it is an arithmetic assumption that was true while there was one machine.
    NOT HYPOTHETICAL FOR LONG. The stated direction is N containers on N codebases, and that shape
    is available today: the unit of isolation is the INSTANCE, keyed off HOME, so separate
    containers share no state directory — and therefore share no ceiling either. The isolation is
    correct and is not what this task changes.
    IT IS THE DAILY CEILING, NOT THE PER-RUN BUDGET, AND THEY ARE DIFFERENT MECHANISMS. The per-run
    cap travels as `maxBudgetUsd` into each worker spawn and is enforced by the SDK against that one
    spawn; the fleet's own comment calls dollars the real backstop and max-turns the runaway-loop
    guard. It is per-task and per-spawn, it composes correctly across instances because each spawn
    is genuinely separate work, and THIS TASK DOES NOT TOUCH IT. Only the day-scoped, ledger-derived
    ceiling is in scope."
