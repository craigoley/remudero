  note: "THERE IS NO SHARED DOLLAR FIGURE ANYWHERE, AND THAT IS ESTABLISHED FROM SOURCE RATHER THAN
    ASSUMED. It is the decisive fact, because it removes the option that looks best on paper.
    The fleet does already trust two things across machines. GitHub decides what merged, which is
    authoritative and shared — but GitHub knows nothing about dollars. And the account usage read
    is genuinely shared: it probes the real account, so a second instance's spend is already
    reflected in it. That is why the headroom ceiling merely OVERSHOOTS and then converges, while
    this one does not.
    BUT THE ACCOUNT SURFACE CANNOT SERVE THIS CEILING, for two independent reasons, and either
    alone is sufficient. FIRST, THE UNIT IS WRONG: the usage snapshot carries a percent-consumed
    figure per window and nothing else — the whole module contains no dollar quantity of any kind.
    SECOND, THE WINDOW IS WRONG: it reports a five-hour rolling session and weekly caps, while this
    ceiling is dollars over a UTC day. Neither can be converted into the other, because a percent
    of an opaque quota is not a price.
    SO A SHARED READ IS NOT AVAILABLE, AND BUILDING ONE WOULD BE CROSS-INSTANCE COORDINATION, WHICH
    IS OUT OF SCOPE BY CONSTRUCTION. The ledger is an append log with tailers rather than a shared
    database, and one-instance-per-volume is the intended shape. This task is about A NUMBER BEING
    PER-INSTANCE. It is not about instances talking to each other, and an implementation that makes
    them do so should be refused at review.
    THE FIX IS THE SMALLER ONE, AND IT IS ENOUGH — ARGUED, NOT ASSUMED. A configured share that the
    OPERATOR divides, plus making the effective number visible. Three reasons it is sufficient:
    (i) IT MAKES THE ARITHMETIC TRUE AGAIN. Two instances at 250 each spend what one at 500 spent.
    The operator already knows how many instances exist — that is the one fact no instance can
    discover and the operator cannot avoid knowing.
    (ii) IT CHANGES NO DISTRIBUTED STATE, so it cannot introduce a coordination failure, a lock, or
    a consensus question. The ceiling keeps reading the local ledger, which is always readable.
    (iii) IT MAKES THE ERROR VISIBLE RATHER THAN SILENT. Today the effective ceiling appears NOWHERE
    until it trips: the deferral line carries the observed cost and the ceiling, but it is written
    only at the moment of refusal, and no board or status surface renders the number at all. An
    operator running two instances at the default has no reading that would tell them so.
    THE FAILURE DIRECTION IS DECIDED BY THE FIX RATHER THAN BY A JUDGEMENT CALL, AND THAT IS THE
    STRONGEST ARGUMENT FOR IT. The hard question was what a ceiling should do when a shared figure
    cannot be read — refusing would halt a healthy fleet on a network blip, and this repo has FOUR
    bounds that fired on healthy conditions; proceeding would be today's behaviour with extra steps
    and more moving parts. A configured share HAS NO SHARED FIGURE TO BE UNREADABLE, so the dilemma
    does not arise at all. Removing a hazard beats choosing which way to fail into it.
    AN UNSET SHARE MUST BEHAVE EXACTLY AS TODAY. A single-instance operator must see no change of
    any kind, which is why one acceptance criterion exists solely to pin that. The new knob is a
    DIVISION the operator opts into, never a new default.
    WHAT IS NOT ENOUGH, AND SHOULD BE SAID SO IT IS NOT MISTAKEN FOR VICTORY: this makes the
    arithmetic correct and visible. It does not make it ENFORCED. Nothing stops an operator setting
    two instances to 500 each, and nothing detects that they did. That residue is real and is the
    honest price of not coordinating; it should be recorded in the implementation rather than
    quietly hoped away.
    RISK HIGH IS THE SIZING RULE'S SPAN, NOT BLAST RADIUS. The file set crosses the governor's own
    module, the dispatcher that feeds it, and the policy pair carrying the knob, plus tests. The
    behaviour change with the knob unset is nil by construction.
    RECORDED FOR THE NEXT READER, AND DELIBERATELY NOT BUNDLED HERE: the same recon that ranked this
    first also found that FIVE MORE crash-recovery sweeps are daemon-only beyond worktrees — stray
    orphans, worker scratch, abandoned review clones, temp dirs, inflight locks and per-spawn worker
    homes. The code's own comments cite 5866 MiB of abandoned clones and a 26,711-directory ENOSPC
    as the measured precedents. W1-T406 covers WORKTREES ONLY. That is a separate task with a
    separate shape and must not be folded into this one."
