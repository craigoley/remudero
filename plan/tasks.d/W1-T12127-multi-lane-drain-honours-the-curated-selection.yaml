    lacks). risk:medium — dispatch selection, one function, one module; a wrong fix dispatches unselected work, which
    is the failure being closed. NO depends_on. The test suite
    test/multi-lane-drain-honours-the-curated-selection.test.ts is THIS task's own falsifier (new, written solely to
    prove these acceptance criteria), so it is named after this shard's slug; the change is one subsystem (drain
    selection in src/lib/drain.ts)."
