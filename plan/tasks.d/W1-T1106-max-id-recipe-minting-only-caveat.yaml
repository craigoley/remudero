  attempts: 0
  note: |
    verify:auto — the deliverable is text in one tracked file and all three proofs are greps over
    that file. risk:low and budget 12.00 — one bullet in one doc, no code path, no dispatch
    surface, and the only real work is EXECUTING the replacement recipe before quoting it.
    files: is exactly `CLAUDE.md` — derived from where the recipe actually lives (verified at
    filing time), not from where a reader might expect a doc change. This shard's own path is
    deliberately absent, per the convention the other shards follow.
    ITEM (2) OF THE ORIGIN FEEDBACK IS ALREADY DECIDED AND IS NOT FILED — recorded here so it is
    not re-triaged: CLAUDE.md already carries "A corrected PR title is observed by a RE-RUN, not
    only by a new sha — but `edited` still fires nothing" (W1-T351; re-derived 2026-08-06), which
    documents the default `[opened, synchronize, reopened]` types, the retitle-THEN-push ordering,
    and the re-run escape hatch. `.github/workflows/ci.yml` carries the same finding at the
    commitlint step, where W1-T351 made the job read the title LIVE via `gh pr view --json title`.
    That LIVE read is the origin feedback's own falsifying condition: a re-run re-lints the current
    title with no push at all, so `edited` buys nothing and the ordering is a cheapness preference,
    not a correctness one.
