- id: W1-T2315
  title: "TWO RESOLVERS DECIDE WHETHER A PR BODY IS JUDGED AND NOTHING RECONCILES THEM — the CI gate answers from a line scan that survives a plan refusal while the reviewer answers from loadPlan and silently falls through to the body when it throws, so a duplicate id makes the gate keep exempting every trailered body while the reviewer grades those same PRs off blocks that 180 of 206 recent merges would have failed"
