  design: |
    1. Keep the existing pre-admission request as the delivered-key release/idempotency demand. Do NOT
       move that release after admission: doing so can strand the delivered verdict that must be retried.
    2. Derive pacing/progress rounds from real admitted/terminal review evidence. A positively denied
       request cannot increase completed rounds, no-op signals or the backoff multiplier. Two duplicate
       demand markers cannot manufacture two completed attempts without two actual attempt witnesses.
    3. Use a bounded exact attempt identity through the existing admission/terminal producers where the
       current fields cannot distinguish attempts. Do not join all events by daemon run_id, count an
       initial baseline review as a re-review, or rely on request timestamps being append-monotonic.
       Legacy or partial attribution stays explicit unknown/incomplete, never fabricated completed work.
       Preserve history; no mark, ledger or archive deletion and no new store or supervisor.
    4. Preserve the existing observed-duration formula and thresholds, active-owner/claim exclusion,
       semantic and memory admission, both host-gap routes and protected merge certification. Do not
       cure the wait by manually posting a review, weakening a cap or renaming the real proof titles.
    5. New tests use the computed test/sweep folder and the literal titles below. Replay the denied and
       duplicate demand shapes, positive admitted/terminal re-reviews that still grow normal pacing,
       a live owner, changed head/input, repeated refusal, and unknown legacy attribution. The two
       declared legacy suites may gain honest admission/terminal fixture witnesses; keep their assertions
       about actual review pacing, escalation and the absence of body/plan repair intact. Keep all
       existing ledger-step names, pricing membership and normal entry-point coverage.
