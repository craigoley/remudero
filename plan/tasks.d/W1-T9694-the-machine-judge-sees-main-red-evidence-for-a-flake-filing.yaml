  design: |
    HOW THIS RELATES TO W1-T9551. W1-T9551 stops new main-inherited filings at the source. This task makes the
    judge apply the SAME classification to any flake-incident record it judges. That covers records filed before
    W1-T9551 shipped, W1-T7532/W1-T7765/W1-T7799 still queued at verify: auto, and any record whose group gained
    evidence after it was filed. W1-T9551's build (run-W1-T9551-1792082362617) keeps its main-inherited test inline
    in runFlakeIncidentGardener. This task lifts that test into ONE exported predicate in
    src/lib/flake-incident-gardener.ts, which both the gardener and the judge call. There is never a second copy, so
    the two cannot disagree. That is why this task depends on W1-T9551.
    1. EVIDENCE. For a record whose origin starts `flake-incident:`, a new optional port on MachineJudgePorts reads
       the harness's own facts and appends them to the EVIDENCE line:
       - the record's retry outcomes, from its `flake_incident.filed` row (recovered, also_failed, prs, base shas);
       - whether main's CI or a base-reproduction probe failed the test file at any of those bases
         (mainFailingTestFiles / the W1-T9551 main-failures reader), stated as true, false or unread;
       - any main.repair record whose red detail names the test title (offending sha, fix PR).
       The line says plainly that a test that never passes on retry across PRs that do not touch it is the
       signature of an inherited red. Unread evidence is said to be unread, never shown as false.
    2. A MAIN-INHERITED RECORD IS RETIRED, NOT RELEASED. When W1-T9551's classifier reads the record's evidence as
       main-inherited, the judge does not ask the model to release it. Through its one judge PR it rewrites the
       record the way the operator retired W1-T9532 and is retiring W1-T9668 (#12091): `status: blocked`,
       `retirement: retired`, and a reason naming the evidence and the main-health route. It writes the
       `flake_incident.main_inherited` row that W1-T9551's main-health rung reads, so the red is routed where
       W1-T9551 routes a new one, and one `machine_judge.main_inherited` row (task id, origin, recovered,
       also_failed, main_red true|false|unread). No person is asked. A record with any recovered retry, or with
       main evidence unread and too few PRs for the classifier, goes to the model as today, now with the
       evidence from point 1.
    3. ALREADY RELEASED. A flake-incident record that is still queued at verify: auto under a judge ruling is
       re-judged on the first pass where its computed evidence differs from what it was released on. This follows
       W1-T8830's moved-input rule, so W1-T7532, W1-T7765 and W1-T7799 are reconsidered once and not re-asked every
       pass.
    4. Tests (new file, `test(` titles verbatim as in the proofs below) replay W1-T9668: 9 PRs, 0 recovered,
       9 also failed, and main red on the file at the bases. Cover also a recovered-retry record, which still
       reaches the model with the evidence line, and a record whose main evidence is unread.
