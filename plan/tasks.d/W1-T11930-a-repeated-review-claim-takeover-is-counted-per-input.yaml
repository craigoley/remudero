- id: W1-T11930
  title: A review claim taken over from an owner that died without a verdict, for an input already taken over before with no verdict between, writes a repeat row naming the input and the count, and the flow report carries the count per PR
  repo: remudero
  depends_on: []
  priority: 1.3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # one concern: a counting row at takeover; the takeover rule itself and every status written are unchanged
  origin: operator-session#github-access-1109
  plan_refs:
    - W1-T5904
  files:
    - src/lib/review.ts
    - test/a-repeated-review-claim-takeover-is-counted-per-input.test.ts
  status: merged
  attempts: 0
  acceptance:
    - claim: A takeover of a stale review claim for an input whose previous claim was also taken over, with no verdict row between them, writes a review.claim_repeated row with the input key, head sha and the number of consecutive takeovers
      proof: "unit test: test/a-repeated-review-claim-takeover-is-counted-per-input.test.ts"
    - claim: A takeover after a delivered verdict, or the first takeover of an input, writes no repeat row and the count starts again at one
      proof: "grep: W1-T11930 criterion 2 in test/a-repeated-review-claim-takeover-is-counted-per-input.test.ts"
    - claim: The statuses written by a takeover are identical with the change and without it
      proof: "grep: W1-T11930 criterion 3 in test/a-repeated-review-claim-takeover-is-counted-per-input.test.ts"
  rationale: |
    OBSERVED 2026-11-09: #17494's remudero-review history holds 8 stale-claim takeovers between 17:05Z and 22:08Z (one per daemon lifetime of about an hour, plus intermediate ones), with no verdict posted by any of them. Nothing counted it, so the loop was visible only by reading the status history of one head.
    - A count per input is the evidence the flow gardener and an operator need to see a review that keeps starting and never finishing, without choosing a threshold now.
  design: |
    - At the takeover site, read the input's prior takeover and verdict rows from the ledger and write the counting row. No status, comment or admission changes.
    - NOT IN SCOPE: the takeover rule, why the owners died, and any escalation.
  falsifier: |
    Write no row on a repeat: criterion 1 must fail. Write one on the first takeover or after a verdict: criterion 2 must fail. Change a written status: criterion 3 must fail. Restore and require all three.
  note: |
    reservation hand-off: run-unfiled-1794267225693
    Success is review.claim_repeated rows that name the PRs stuck in a start-and-die loop.
