  acceptance:
    - claim: "The test file has one test for each value of `exit_cause` that the core ledger shows on two or more fresh-tree reviews in the 7 days before the build. Each test has the value in its title and drives `buildReviewerCodeFreshnessGate` and the real review command to that exit"
      proof: "grep: W1-T12226 criterion 1 in test/review/each-failure-class-of-the-fresh-tree-review-has-a-cause-and-a-fix.test.ts"
    - claim: "The row `review.ran_from_fresh_tree` carries the field `ended_as` with one of three values: `verdict` when the child posted a terminal verdict, `no_verdict` when the review correctly had nothing to post, and `defect` for every other exit. A row with `verdict` or `no_verdict` carries no `failure` field"
      proof: "grep: W1-T12226 criterion 2 in test/review/each-failure-class-of-the-fresh-tree-review-has-a-cause-and-a-fix.test.ts"
    - claim: "Each cause that the build classes as `defect` has its fix in the same pull request. The test of that cause fails when the fix is removed"
