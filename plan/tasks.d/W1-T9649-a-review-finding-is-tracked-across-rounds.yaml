  rationale: |
    READ at origin/main 3f9003ebf (2026-10-15).
    - `extractReviewFindings` builds a finding's id from the owner, repo, PR, head sha, criterion, category and an
      evidence digest of the anchor's path, line and text (src/lib/review-findings.ts:126-127). After any push the same
      issue gets a new id.
    - `deriveReviewFindingOutcomes` (src/lib/review-finding-outcomes.ts:95) labels an older finding `superseded`
      whenever a later head of the same PR was reviewed (:125-128). That says nothing about the finding itself.
    - So nothing measures whether a fix round made a finding go away, or whether the reviewer raised the same issue
      again. Each extra round costs a fix worker and a full CI run of about 16 minutes.
    - W1-T4849's ruling stands: a resolved thread or a merge is workflow activity, never correctness. These labels are
      flow telemetry and claim nothing about whether a finding was right.
    Found while reading msitarzewski/agency-agents (security/security-ai-generated-code-auditor.md): a stable finding
    fingerprint lets a rescan say still here, resolved, or new.
    SCOPE CORRECTION (architect clarify 2026-11-07, PR #17212 at a997b62c2 held pending CI):
    - The outcome fold never sees raw ledger rows. Production reads every `review.finding` receipt through
      `projectFlowRow` (src/lib/field-trials-flow.ts:206). That function maps `finding_id` and `category` into `FlowRow`
      (:252) and has no `lineage_key` read. So unit fixtures that build `FindingFlowRow` by hand pass, but production
      always sees the lineage key as absent, and every older finding falls to `not-re-raised`.
    - The fix: `FlowRow` gains `lineageKey: string | null`, the same name `FindingFlowRow` uses in PR #17212, and
      `projectFlowRow` maps `text(row.lineage_key)`.
      This is one more bounded field on the private snapshot projection. It is not free text.
    Settled by lookup: is this already filed or decided? -> no. `lineage_key` appears only in this shard, and in
      MASTER-PLAN.md only as the W1-T9649 index line (plan/tasks.d, MASTER-PLAN.md:4579, LEARNINGS.md, DECISIONS.md).
    Settled by lookup: is the projector really named `projectFieldTrialsRow`? -> no. It is `projectFlowRow`
      (src/lib/field-trials-flow.ts:206). No function named `projectFieldTrialsRow` exists in src/.
    Settled by lookup: where does the projection regression test go? -> test/review-finding-outcomes.test.ts. It already
      imports `projectFlowRow` and `deriveReviewFindingOutcomes`, and its `row` helper builds every fixture through the
      real projection (test/review-finding-outcomes.test.ts:7,14).
    Settled by lookup: does adding the field widen the telemetry boundary? -> no. `FindingFlowRow` feeds only
      `deriveReviewFindingOutcomes`, and design step 3 still bars every gate, status and repair-label reader.
  design: |
    1. Each receipt gains `lineage_key`: a digest of owner, repo, PR, criterion, category, anchor path and anchor text.
       It has no head sha and no line number, so a moved line keeps its key.
    2. In `deriveReviewFindingOutcomes`, `superseded` splits into:
       - `persisted`: a later reviewed head of the same PR carries a finding with the same `lineage_key`;
       - `not-re-raised`: no later head does.
       The confirmed-repair, human-accepted, human-rejected, conflicting and unknown counts are unchanged.
    3. Nothing that gates, posts a status, or labels a repair reads either label.
    4. `projectFlowRow` (src/lib/field-trials-flow.ts) carries the receipt's `lineage_key` into `FlowRow.lineageKey`.
       It maps `text(row.lineage_key)`, which is null when the key is absent. Without this, the production path drops
       the key before the fold sees it.
    New tests go in test/a-review-finding-is-tracked-across-rounds.test.ts, with `test(` titles exactly as in the
    proofs below. The projection regression goes in test/review-finding-outcomes.test.ts. It builds raw ledger-shaped
    `review.finding` rows carrying `lineage_key` and passes them through its existing `row` helper (`projectFlowRow`),
    never a hand-built `FindingFlowRow`. Two heads of one PR share a key on a moved line, and that finding is
    `persisted`. A key that no later head carries is `not-re-raised`.
