  design: |
    No new bound, no TTL and no timer.
    1. A CURSOR, AND A WALK THAT STOPS AT IT. The cache gains `cursor`, the newest `updated_at` the last read saw, and
       `mainSha`, the origin/main sha that read was made against. A read with a valid cache for this repository pages
       newest-updated-first as today, but stops at the first page whose last row is older than `cursor` (`<`, so rows
       updated in the same second are read again, which is harmless). The rows it reads are classified as today. The
       result is MERGED into the cached fixes by PR number, so a re-read PR replaces its own entry, and the merged set
       is pruned to the 14-day window by `merged_at`. `byPr` is kept and pruned with it. A missing, unreadable or
       other-repository cache, or one without a cursor (every cache written before this change), takes today's full
       window walk once and writes a cursor.
    2. REFRESH ON NEED, NOT ON A CLOCK. A hand fix is a merged PR, so it reaches origin/main as a commit, and the
       reader already needs that commit locally for `git diff-tree`. So the read is due only when
       `readOriginMainSha(repoRoot)` (src/lib/inbox.ts, a ref-file read with no git spawn) differs from the cache's `mainSha`. While it is unchanged, the cached fixes are
       returned, pruned to the window at this pass's clock, with `source: "cache"` and no gh call. An unreadable
       origin/main sha makes the read due, never skipped. Remove the `600_000` literal.
    3. FAILURE STAYS AS TODAY. A failed page throws inside the try, so the pass reads `unmeasured` with the reason, and
       the cache and its cursor are left as they were, never advanced past rows that were not read. The read stays in
       the garden child; nothing moves onto the daemon loop.
    Inject the origin/main reader the way `run` is injected, so tests need no git repo for the gate. Tests go in
    test/the-ci-friction-hand-fix-read-pages-only-what-changed.test.ts, with `test(` titles verbatim as in the proofs
    below. Drive `readCiFrictionHandFixes` with a fake `run` that serves numbered pages and records every gh argv, a
    fixed Clock, and a temp state dir. Update test/w1-t5300-a-hand-fix-is-ci-friction-evidence.test.ts only where it
    pins the old TTL.
