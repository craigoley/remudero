  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 6 merges were feedback landings, and each triage outcome edits a feedback file.
    - Writers: `captureFeedback` in src/lib/feedback.ts, the landing pass `sweepFeedbackLandingAsync` that src/cli/commands/daemon.ts wires, and `landFeedbackStatusContent`, which `setFeedbackStatus` calls.
    - The gate of the ops repository scans a feedback file for leaks. Its pattern refuses text that quotes the prefix of a token. A refused file must not block the files beside it.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. Removing `feedback` from the kinds turns this kind off.
    - Work in the ops repository comes first and is not filed here: the fleet App must be installed there, and its gate must accept a feedback file.
  design: |
    In `captureFeedback` and in the landing pass, call `resolvePlanDestination("feedback")` for a new file. Pass its checkout as the landing root and its repository as `targetRepository`.
    For a status write, find the repository that holds the file with the readers of the earlier task, and land there.
    Reuse the preflight change of the decision task for a checkout with no scripts directory.
    NOT IN SCOPE: the triage command, which edits a feedback file in a lane worktree. The next task covers it.
  falsifier: |
    Land a new file in the public repository with the kind on and criterion 1 must fail. Land a status write for a public file in the destination and criterion 3 must fail. Let one refused file stop the batch and criterion 4 must fail. Restore and require all six to pass.
