  acceptance:
    - claim: "A second build of the sweep effects on the same state directory, in a new process, decompresses no rotated ledger file that the first build read"
      proof: "grep: W1-T12271 criterion 1 in test/sweep/the-sweep-effects-read-terminal-heads-from-the-slice-store.test.ts"
    - claim: "The terminal heads are the same as those that `resolveLedgerUnion` gives for the same files, in a fixture with rows in the live file and in two rotated files"
      proof: "grep: W1-T12271 criterion 2 in test/sweep/the-sweep-effects-read-terminal-heads-from-the-slice-store.test.ts"
    - claim: "An unreadable rotated file gives the answer of today for an unread history. A head is never reported as free because its file could not be read"
      proof: "grep: W1-T12271 criterion 3 in test/sweep/the-sweep-effects-read-terminal-heads-from-the-slice-store.test.ts"
    - claim: "The test goes through `buildSweepEffects`, the production caller, with nothing injected in place of the reader"
      proof: "grep: W1-T12271 criterion 4 in test/sweep/the-sweep-effects-read-terminal-heads-from-the-slice-store.test.ts"
  rationale: |
    FOUND 2026-11-11 in the startup and recycle research: `buildSweepEffects` reads every rotated ledger file each time a new process builds it.
    READ at origin/main 0953736f0, src/lib/sweep.ts.
    - Line 2665: `buildSweepEffects` calls `terminalUncreditableHeads(ledgerPath)` while it is built.
    - Line 1099: that function calls `resolveLedgerUnion` on the state directory with one pattern. The call is synchronous and decompresses each rotated file.
    - The state directory of the core instance held 40 rotated ledger files for three days on 2026-11-11.
    - Line 28000: `createEscalationTriageHistoryReader` reads a slice of each rotated file once and keeps it in a store with a shared snapshot. W1-T12235 (queued) uses that store for the lifetime history and exports what a second user needs.
    The first sweep after a restart, the review command and the fix command each build the effects in a new process. Each pays the full read.
    CHECKED for overlap: W1-T12235 covers the lifetime history only. W1-T12236 (queued) covers the open pull request reads at a restart.
  design: |
    Give `terminalUncreditableHeads` its rows from a reader that `createEscalationTriageHistoryReader` builds for a new slice:
    - a holder name of its own, the steps that the pattern of today matches, `sharedSnapshot: true`;
    - a `project` function that keeps only the fields that the function reads.
    Keep the function's result type and its callers. Keep the answer for an unread history.
    The builder must confirm with the test of criterion 2 that the reader gives the same heads as the union read. If it cannot, stop and report the difference.
    NOT IN SCOPE: the other `resolveLedgerUnion` calls in src/lib/sweep.ts (lines 18742, 19374 and 19685 read for one pull request at action time), and the store itself.
  falsifier: |
    Call `resolveLedgerUnion` again and criterion 1 must fail. Drop the rows of the live file and criterion 2 must fail. Return no heads for an unreadable file and criterion 3 must fail. Restore and require all four to pass.
