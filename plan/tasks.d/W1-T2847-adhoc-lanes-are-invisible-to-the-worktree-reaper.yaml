      proof: "unit test: test/adhoc-lane-root.test.ts"
    - claim: "the lane root is reaped through the parent-aware removal rather than a bare recursive delete"
      proof: "unit test: test/adhoc-lane-reap.test.ts"
    - claim: "a lane whose branch is still live upstream is never reaped however old"
      proof: "unit test: test/adhoc-lane-reap.test.ts"
    - claim: "the lane rung surveys and ledgers what it would reclaim before it is permitted to delete"
      proof: "unit test: test/adhoc-lane-reap.test.ts"
    - claim: "a named lane-root resolver exists beside worktreesDir rather than a hardcoded path"
      proof: "grep: adhocLaneRoot in src/lib/worker.ts"
