  note: |
    SCOPE RATIFIED BY THE OPERATOR BEFORE FILING. Four remediation shapes were put to the operator
    from the 2026-09-04 recon; this shard is the one chosen ("D"), namely move the practice into
    config.root and give that root a lane reaper. The three declined shapes are recorded in design
    (vii) rather than dropped, so a later reader does not re-propose the $HOME reap root.

    WHY THIS IS NOT W1-T411. W1-T411 gives stale temp dirs, per-spawn worker homes and abandoned
    review clones a start-of-run rung; every one of those roots is under tmp or is a standalone
    clone. NONE of them is a linked worktree under config.root, which is this shard's entire subject.
    Verified at filing: nothing under plan/ mentions a hand-cut, operator or interactive worktree
    lane, by `git grep` over plan/ with a matching control.

    WHY THIS IS NOT THE WORKTREE-REAP REMOVAL FIX. The parent-aware removal in design (ii) is
    already open as a separate PR against `reapStaleWorktrees`; it changes HOW an entry is removed
    and reclaims no disk. This shard changes WHICH root is scanned. Filed as a dependent-free task
    because it consumes that work through the exported helper rather than editing the same block.

    FILES DERIVED FROM THE RESOLUTION CHAIN, NOT GUESSED. `src/lib/worker.ts` is declared because
    `worktreesDir`, `reapStaleWorktrees`, `runWorktreeReapRung`, `planWorktreeRemoval` and
    `executeWorktreeRemoval` are all defined there. `src/lib/config.ts` is NOT declared: `config.root`
    already resolves correctly (`join(homedir(), "Remudero")`, unchanged since the repo's first
    substantive commit 7985d6aa, confirmed by blame) and this task adds a sibling of `worktreesDir`,
    not a new root key. `src/lib/clone-reaper.ts` is NOT declared — design (vii). `src/run-task.ts`
    is NOT declared: the rung wiring already exists via `runWorktreeReapRung`, and an implementer who
    needs it should widen the shard deliberately rather than inherit it.

    BOTH NEW TEST PATHS ARE DECLARED AND BOTH ARE NEW. Acceptance proofs use the PURE-PATH
    `unit test: test/<file>.test.ts` form, not a title: in a plan shard `judgeCriterion`'s
    `not_yet_built` carve-out needs `!nameFiltered` AND the path present in `files:`, so a title here
    would grade `no-match` and become test theatre. The fifth criterion is doc-shaped — the finding
    itself — and takes a `grep:` on ONE PHYSICAL LINE against this shard's own path.

    THE MEASUREMENT THIS FILING COULD NOT CLOSE, RECORDED RATHER THAN SMOOTHED. ~98 of the 154
    home-root directories in rationale (4) disappeared during 2026-09-01/02 with NO `rm -rf` and NO
    `git worktree remove` anywhere in the Codex command log, searched in absolute, tilde and glob
    forms. If something automated removed them, the ~10% teardown rate and the derived per-day cost
    are too pessimistic. The console account's Claude Code transcripts are mode 0700 and were not
    readable, so that half of the population was never observed at all; every creation count in
    rationale (4) is therefore a FLOOR.
