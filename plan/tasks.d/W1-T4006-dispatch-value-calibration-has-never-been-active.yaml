- id: W1-T4006
  title: "THE CLOSURE-VALUE CALIBRATION HAS NEVER ONCE BEEN ACTIVE ON THE TWO DAEMONS THAT LOG IT — 352 consecutive `missing-prior-snapshot` refusals, and the third daemon never logs the step at all, so nobody has ruled on which configuration is correct"
