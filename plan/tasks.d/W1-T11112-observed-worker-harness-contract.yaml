  rationale: "OBSERVED: worker-provider.ts explicitly returns unknown served model and unsupported compaction for Codex, while settings/tool translation and worker adapter behavior span provider and worker modules. Existing model capability ladders classify model tiers, not runtime enforcement. Omnigent separates declared capability from observed conformance; its offline harness bench can exit zero with live probes not run, and policy DENY requires a real attempted tool call. Sources: https://github.com/omnigent-ai/omnigent/blob/42ab304337a27c995f0875c681b4a85b811364ee/omnigent/harness_capabilities.py ; https://github.com/omnigent-ai/omnigent/blob/42ab304337a27c995f0875c681b4a85b811364ee/tests/harness_bench/README.md ; https://github.com/omnigent-ai/omnigent/blob/42ab304337a27c995f0875c681b4a85b811364ee/tests/harness_bench/probes/policy_deny.py . This adapts the distinction without adopting their runtime. W1-T10635 already owns skill conformance using actual governed worker capability context; reuse that context rather than widening or re-declaring its tool surface. This task observes runtime enforcement evidence, which that skill scan does not attest."
  design: |-
    Extend the existing worker adapter boundary with a small versioned, redacted harness-contract receipt. Capability fields cover pre-tool interception, resume, configured compaction, served-model identity, tool-result lineage, billing provenance and filesystem/network isolation. Each has supported/unsupported/unknown plus evidence class declared, deterministic-adapter-test or observed-installed-runtime; a declaration or fixture pass cannot become live enforcement. Bind installed observations to exact adapter revision, actual executable immutable identity when available, policy/settings digest and environment class; missing/unreadable identity is unknown. Reuse existing init/assignment metadata and observed facts; do not spawn version probes in the daemon hot path. Any future explicit live probe requires its own existing native admission and authority. An omitted/unattempted case is NOT_RUN or SKIPPED, never pass.
    Exercise existing Claude/Codex adapters through deterministic transcript/spawn seams, including supported and refused tool paths. Preserve Codex unknown served identity and false compactionConfigured. A policy claim needs evidence at the actual tool interception seam; final model prose is insufficient. A receipt is observational and cannot widen tools, egress, resume rights, sandbox authority, routing or spending. Record bounded evidence identifiers, no executable paths containing usernames, policy contents, prompts, arguments, credentials or raw output. Keep fixtures under existing physical suites and use package aliases/shared repo-root helper for new tests. Report per-capability declared/tested/live-observed/unknown coverage; no live-rate or benefit claim follows from fixture tests.
  acceptance:
    - claim: adapter contracts preserve unsupported and unknown capabilities instead of inheriting another harness defaults
      proof: "unit test: harness contract keeps unsupported Codex identity and compaction distinct from unknown"
    - claim: fixture and declared claims remain distinct from installed-runtime enforcement with exact context binding
      proof: "unit test: harness contract cannot promote declared fixture skipped or stale evidence to observed enforcement"
    - claim: real denied tool attempts prove adapter interception while an unattempted case remains not run
      proof: "unit test: harness contract denial evidence requires the tool interception path"
    - claim: contract receipts remain bounded redacted and observational
      proof: "unit test: harness contract metadata cannot widen worker authority or disclose runtime contents"
  falsifier: Remove only the evidence-class/context check and show stale fixture evidence becomes falsely observed and the corresponding test fails. Independently make unknown adapters inherit Claude flags and bypass the real denied-tool seam. Each planted fault must fail; restore exact source and run physical suites. Live qualification stays NOT_RUN until an explicit admitted run exists.
