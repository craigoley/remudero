  rationale: |
    OBSERVED 2026-11-09 (Azure host ledger union, scanned from 2026-10-20, and `gh`): no `measurement_cadence.ran` row exists after 2026-10-25, 15 days. `run_failed` rows fill the gap on most days (8 on 2026-10-31, 8 on 2026-11-02, 6 on 2026-11-03), and a title search for "measurement cadence" finds no escalation issue after 2026-09-10. Nobody was told.
    - The causes changed while the silence held, so no cause-specific alarm would have caught it: 8 fires refused by the pre-push shard census (2026-10-27 to 2026-10-30), 12 refused for an oversized pull-request body (2026-11-03 to 2026-11-08, W1-T11859), and several children that exited without a result.
    - A cadence reports `ran` only when every rung completes, and one failing rung (the plan-status landing) discards the rest of the report, so the absence of a `ran` row is the one signal that survives any cause.
    - The escalation catalogue already has the shape: `escalateCrashLoop` and `escalatePostReviewStall` dedup on an episode key written to the ledger whether or not delivery succeeded, and a marker step the escalation reads back must be registered in DECISION_RELEVANT_LEDGER_STEPS or rotation erases it.
  design: |
    - `escalateMeasurementCadenceStall` in escalation-catalogue.ts, called with the failure's message. It reads the newest completed run through `latestMeasurementRows(stateDir, 1)` (already unreadable-aware: an unreadable ledger returns no verdict, never "never measured"). No row, an unreadable ledger, or a row within `MEASUREMENT_CADENCE_STALL_MS` (24 hours, four fires at the 360-minute policy floor) opens nothing.
    - Past the bound it opens one BLOCKED escalation whose body names the newest completed run, the hours since, and the failure text cut to its first 300 and last 600 characters (a command-line failure ends with its cause).
    - Dedup is an episode key: a `measurement_cadence.stalled.escalated` ledger row carrying `episode_last_ran` (the newest completed run's timestamp). A prior marker with the same value skips. A new completed run changes the value, so the next stall escalates again. The marker is written whether or not delivery succeeded, as `escalateCircuitBreak` explains. The step is added to DECISION_RELEVANT_LEDGER_STEPS in ledger.ts, because this function reads it back.
    - daemon.ts: the four places that log `measurement_cadence.run_failed` call one helper, `cadenceStallCheck`, which invokes an optional `escalateCadenceStall` dependency inside a try/catch so a failing alarm can never break the failure handler. The check runs only on a failure, so the whole-union read happens at most once per fire, never per tick. cli/commands/daemon.ts supplies the dependency with the target repository, state directory, ledger path and run id.
    - NOT IN SCOPE: why any single fire fails (W1-T11859, W1-T11860), the `ran` row's contents, the `escalate` policy flag, and the policy schema: the 24-hour bound is a named constant, not a new policy key.
  falsifier: |
    Drop the age check (escalate on every failure): criterion 2 must see an issue opened for a fresh cadence. Drop the dedup (open on every stalled failure): criterion 3 must see two issues in one episode. Key the dedup on the failure text instead of the newest completed run: criterion 3 must see a second issue after a recovery and a new stall, or a duplicate when the cause changes. Treat an unreadable ledger as a stall: criterion 4 must see an issue opened with no evidence. Restore each and require all four.
  note: |
    reservation hand-off: run-unfiled-1794237557000 -> run-unfiled-1794237557000
    Filed from the plan-status reconcile investigation (W1-T11859, W1-T11860, #17516). Operator instruction 2026-11-09: "file the alarm task". The persistent-drift alarm proposed earlier is generalised here: the signal that survives every cause is a cadence that stopped completing, not a drift count.
