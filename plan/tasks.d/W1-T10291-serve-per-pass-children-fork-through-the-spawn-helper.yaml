- id: W1-T10291
  title: "SERVE'S PER-PASS CHILDREN FORK THROUGH W1-T9754'S LONG-LIVED SPAWN HELPER, NOT FROM SERVE — PR #13207 forks one read-model oracle child per consistency slice from serve's read-model worker thread, and a fork's synchronous part copies the whole parent's page tables: `spawn_sync_ms` 84-196 ms offline from a 1.5 GB parent, INFERRED 250-500 ms at serve's 3.3-4.4 GB, about 22 times an hour, each on the thread that runs the projector's ticks"
  repo: remudero
  depends_on: [W1-T9754]  # the helper itself; PR #13207 (the per-slice child) is merged at origin/main faefe0655
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern, which process forks serve's per-pass children; what each child runs and answers is unchanged
  band_meaning: span
  origin: "coordinator brief file1020c item 2 (2026-10-20); the expected-cost paragraph of PR #13207's body (logs-8864/c5-pr-body.md)"
  plan_refs: [W1-T9754, W1-T10290, W1-T10294, W1-T9638]
  files:
    - src/lib/spawn-helper.ts
    - src/lib/child-entry-argv.ts
