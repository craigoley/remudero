    - claim: "Wrong folder, renamed basename, changed or missing marker, duplicate candidate, symlink, fixture, traversal and unreadable placement stay refused, as do undeclared production edits and empty scope"
      proof: "grep: W1-T11501 criterion 2 in test/ci/suites/a-computed-test-placement-preserves-file-scope.test.ts"
    - claim: "Implement and fix staging, push scope and review scope share the narrow predicate; ordinary placement, proof and Rule15 gates still run"
      proof: "grep: W1-T11501 criterion 3 in test/ci/suites/a-computed-test-placement-preserves-file-scope.test.ts"
  note: |
    H4-A; reserved on the operator-backed plan-file branch. Eight open PR heads were fetched and
    compared against main; no authored diff implements this subject. Existing T9860/T9862 are
    dependencies in meaning, not permission to loosen unrelated gates. No build in the filing PR.
  falsifier: |
    Remove staging integration: the correctly placed test is unstaged and criterion 1 fails.
    Remove computed-folder or marker checks: the corresponding negative case fails criterion 2.
    Remove each caller integration separately and its criterion 3 fixture must fail.
