  rationale: |
    At main a9eb76ff103a, src/lib/prompt-render.ts:60-68 compares an exact declared Set.
    src/run-task.ts:30959-30970 stages changed paths through pathIsUnderDeclaredSurface;
    its extra new-test admission accepts name-filtered unit proofs, not the grep criterion markers
    used by these shards. A correctly placed new test is therefore undeclared and can remain
    unstaged, or make an implement/fix scope guard refuse, despite the correct computed folder.
    src/lib/review.ts:5470-5480 likewise reports an exact-path scope advisory. Rule15 precheck
    only blocks editing criteria alongside implementation, not the placement itself.
    W1-T9860 already resolves committed tests by unique basename for proofs and credited-test-path;
    W1-T9862 covers proof debt and overlap, not worker staging. Do not duplicate those mechanisms.
    REPORTS.md records T11445 changing root to ledger to sweep through separate plan PRs, and
    T11444 changing deploy to sweep. The test contents determine placement, so a sketch is not final.
  design: |
    Add one shared admission predicate for this narrow case and use it for worker staging,
    implement/fix scope checks and review scope comparison. Resolve identity from a declared
    eligible test path and one unique candidate in the observed checkout/tree. Require the same
    basename, a regular repository test outside fixtures, no traversal or symlink, the exact folder
    computed by the current placement engine using the candidate's contents, and every existing
    task criterion marker required by its proofs unchanged. Preserve exact paths for non-tests.
    A new test whose declared path never existed is eligible under the same checks; do not require
    a Git rename. A declared test already present elsewhere, ambiguous candidates, changed markers,
    wrong folders, different basenames and unreadable placement remain refusals.
    The CLI adapters fix.ts:564-565, review.ts:691 and run-task-verb.ts:7464 are in scope only
    to carry task criteria/observed checkout evidence to that same predicate. They are real
    callers found by the source census; leaving them out would require another scope amendment.
    Pass task criteria and observed placement evidence through the existing scope/staging callers;
    do not turn sameTestFile's basename equality into unrestricted scope admission.
    Keep plan criteria verbatim and use W1-T9860's resolver after the candidate is committed.
    Merged proofs are intentionally not rewritten under that existing operator ruling. No Rule15
    exemption, placement-census waiver, broad test glob or proof-content substitution is authorized.
    Production integration tests exercise real staging in a private git fixture and caller wiring,
    plus positive and negative scope cases. The new test sketch computed test/ci/suites HIGH;
    recompute with final contents before building and report any mismatch.
  acceptance:
