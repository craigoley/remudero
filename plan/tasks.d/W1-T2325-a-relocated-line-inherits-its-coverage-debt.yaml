    - claim: "a genuinely new uncovered source line with no merge-base counterpart still fails the gate"
      proof: "unit test: test/diff-coverage.test.ts"
    - claim: "each removed counterpart exempts at most one added line, so a duplicated untested block still blocks"
      proof: "unit test: test/diff-coverage.test.ts"
    - claim: "every honoured relocation exemption is printed and names its counterpart, so no line is silently waved through"
      proof: "unit test: test/diff-coverage.test.ts"
    - claim: "the existing non-executable, type-only and process-boundary carve-outs are unchanged"
      proof: "unit test: test/diff-coverage.test.ts"
    - claim: "the relocation set is derived from the removed lines the diff already carries, with no second coverage run"
      proof: "grep: removedLinesByFile( in scripts/diff-coverage.mjs"
