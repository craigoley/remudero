  note: |
    `risk: high` IS SET UP FRONT, for the same reason W1-T481 sets it: `sizingViolation`
    (`src/lib/task-linter.ts`) blocks at >=2 subsystems while risk<high, and `files:` spans
    `scripts/` and `test/`. The band is Rule 19's SPAN, not blast radius — the runtime effect is one
    gate reading one line differently.

    THE ACCEPTANCE IS THE FALSIFIER, NOT THE SYMPTOM. A gate change that proves only that the false
    positive is gone is indistinguishable from switching the gate off, so the fixture pair must
    demonstrate BOTH directions on a same-tree pair: `relocated-block` passes, `relocated-duplicate`
    (the same block pasted twice against one removal) still blocks. Build the lcov and the diff from
    the SAME tree, commit before measuring, and NAME THE SHA in the PR body — the reuse-a-stale-
    artifact failure voided a whole prior measurement session.

    A SCOPED LOCAL RUN IS A FILTER, NOT A WORK LIST (LEARNINGS.md, PR #2037): it over-reports
    against a widely-exercised source file. Take the flagged set from CI's own log; capture with
    `cmd > out 2> err`, never `2>&1 > file`, and assert the capture non-empty before believing a
    zero from it.

    `files:` IS DERIVED BY INVOCATION, NOT BY MENTION. `docs/review-gate.md` carries the
    "diff-coverage round N" log and would be the natural place to write round 6 up, but it is
    DELIBERATELY NOT DECLARED: Rule 25 refuses an instrument diff that also carries a product path,
    and the doc entry can ride a later plan-only PR. `src/run-task.ts` is not declared either — at
    ~19.5k lines every task naming it serialises against every other that does (W1-T471), and this
    change does not touch it. This shard's own path is not declared, because declaring it converts
    the endemic proof-scope warnings into a hard `rule15-filing` violation.

    WHAT IS NOT CLAIMED. That the ten lines on #1399 are reproducible from any current tree — they
    are not; the argument rests on CLAUDE.md's recorded measurement of main's coverage of that block
    and on the `-`-discarding arm of `addedLinesByFile`, both readable from source today.
