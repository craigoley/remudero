- id: W1-T3722
  title: "THE OPEN-PR DISPATCH HOLD HAS EXISTED SINCE 2026-07-17 AND PORTAL-T12 WAS STILL DISPATCHED TWICE — W1-T3688 filed it as 'nothing holds it', which was false when written: find the hole in the hold that already exists, and cover THAT"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 50.00
  rationale: |
    THIS CORRECTS W1-T3688'S DIAGNOSIS, NOT ITS INCIDENT. The incident is real and expensive: two
    lanes each spent a budgeted run building the same module, they produced CONFLICTING files, and
    one PR had to be closed by hand. What is wrong is the cause the shard names.

    (1) W1-T3688 SAYS, VERBATIM: "An open pull request is the state that must hold dispatch off,
        and nothing holds it." THAT WAS FALSE WHEN WRITTEN:

          2026-07-17  #159   "Dispatch dedup: an OPEN PR means IN-FLIGHT, never runnable (W1-T80)"
          2026-09-16  #5766  files W1-T3688 with the sentence above

        Two months apart. `isDispatchEligible` (src/lib/drain.ts) has consulted `opts.isOpenPr` and
        returned false on an OPEN PR since #159, and W1-T177 later added a FRESH live-state read
        that confirms the cached snapshot before skipping.

    (2) THE PROOF THAT THE HOLD WORKS TODAY. PR #5843 added four tests asserting exactly the
        behaviour W1-T3688 says is missing. MEASURED: that test file, copied onto unmodified
        origin/main and run there, passes 4 of 4. `proof-discrimination` refused the PR for the
        right reason -- the behaviour predates the diff, so no criterion in it can discriminate.

    (3) SO THE QUESTION IS NOT "WHY IS THERE NO HOLD", IT IS "WHY DID THE HOLD NOT HOLD". Something
        let PORTAL-T12 through while its run-shaped PR was open and, per W1-T3688's own note, while
        "the head form projectPlan indexes was present and correct".

    (4) WHERE TO LOOK FIRST, FROM THE CODE'S OWN COMMENTS -- A LEAD, NOT A FINDING. `isOpenPr`
        answers from a projection SNAPSHOT (`src/run-task.ts`: "never the `lastProj` snapshot
        `isOpenPr` itself answers from"), and `readLiveState` is the fresh confirmation layered over
        it. W1-T3688's own account has the first run exiting "the moment it opened #43" -- a PR that
        opens mid-cycle is exactly the shape a snapshot taken before it cannot see. Whether the
        fresh read covers that window is the first thing to measure, and it may not be the answer.

    (5) THE HOLD IS ALSO THINLY COVERED FOR ITS AGE. It is load-bearing dispatch dedup, roughly
        5,600 PRs old, and #5843 existed at all because direct coverage of it was missing.
  design: |
    (i) REPRODUCE BEFORE FIXING. The first deliverable is a test that goes RED ON MAIN. W1-T3688's
        shard is being corrected precisely because a test that passes on main was mistaken for
        evidence; this task must not repeat that. If no red-on-main case can be built, that is
        itself the finding and the incident gets re-attributed rather than a fix invented.

    (ii) THE INCIDENT IS THE SPEC. PORTAL-T12, a run-shaped head, a projection that indexed it, a
         first run that exited on opening the PR. Reconstruct that sequence -- especially the
         window between a PR opening and the next projection -- rather than a tidied-up version of
         it.

    (iii) DO NOT WIDEN THE INFLIGHT LATCH. W1-T3688 ruled that out for a good reason that still
          holds: holding `inflight:<taskId>` until merge parks a task behind an abandoned, refused
          or human-blocked PR, which is an unbounded hold. Whatever closes the window must stay
          bounded.

    (iv) KEEP #5843'S TESTS. They are honest characterization cover for a guard that had almost
         none, and they belong in the tree under a task that says that -- not under a claim to have
         established behaviour two months older than the filing.

    NOT IN SCOPE: `openSiblingObservation`. That logs a PATH-OVERLAP sibling and dispatches anyway
    by design (W1-T2397); it is a different mechanism from a task's own open PR and is not this
    incident.
  acceptance:
    - claim: "a test reproduces a second dispatch of a task whose own run-shaped pull request is open, and it fails on unmodified main"
      proof: "unit test: a task whose pr opened mid-cycle is dispatched a second time"
    - claim: "the window the reproduction exercises is closed, and the same test then passes"
      proof: "unit test: a pr that opens mid-cycle holds its task off the next dispatch"
    - claim: "a pull request that is genuinely gone still releases its task, so the fix cannot become an unbounded hold"
      proof: "unit test: a closed or merged pr still releases its task after the fix"
    - claim: "an unreadable live state keeps the task held rather than dispatching it, preserving the existing fail-open direction"
      proof: "unit test: an unreadable live state still holds the task"
  falsifier: |
    THE FIRST CRITERION IS THE FALSIFIER FOR THE WHOLE TASK. If its test passes on unmodified main,
    the reproduction is wrong and no fix built on it means anything -- which is the exact trap
    W1-T3688 and #5843 fell into, measured at 4 of 4 passing on main. Widen the inflight latch
    instead and the third assertion goes red. Dispatch on an unreadable live state and the fourth
    fails.
