  design: |
    No new constant, no window and no cap. The rung's outputs (candidates, ledger rows, labels, comments) do not change.
    1. GITHUB OFF THE LOOP. The rung's default gateway becomes `ghIssueGatewayAsync(owner, repo)`, built on the same
       `io.execAsync` seam the relabel already takes, so one injected executor covers every gh call the rung makes.
       Add an awaitable twin of `listRetirableEscalationIssues` in src/lib/sweep.ts with the same dedupe by number
       and the same whole-list fail-soft contract (a failed label read fails the whole list). The demote `comment`
       and `triageExistingEscalation`'s `comment`/`closeWithComment` use the async gateway. No sync gh spawn is left on
       this rung's path. The reconciler rung is out of scope.
    2. READ ONLY THE SLICE, AND ONLY WHAT IS NEW SINCE THE LAST PASS. Replace the whole-union sync read with an
       escalation-history reader that `buildSweepHook` builds once per daemon start, beside `boardGithub`. It sits on
       the existing incremental union machinery, step-filtered to the four steps above. Its first load runs off the
       loop (the memo's async `load`), and each later pass parses only the rotations and live-file bytes added since
       the pass before. There is no time window: an issue born in the oldest rotation is still found. The
       `refuseIncomplete` meaning stays: an unread rotation gives no history, and the rung skips the pass rather than
       judging from a partial one. The `rmd sweep` call site, which passes no reader, gets a one-shot async read of the
       same slice. `io.rows` stays as the test seam.
    3. INDEX ONCE PER PASS. One map from `issue_url` to its newest birth row, plus the set of judged `state_key`s, is
       built in a single walk of the slice. It replaces the per-issue `[...history].reverse().find` copy.
    4. Unchanged: the judge, the triage modes, relabel routing, every ledger row written, and dryRun.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Drive `sweepEscalationTriage`
    with an injected `execAsync` whose `gh issue list` resolves on a timer, and with a fixture state dir of gzipped
    rotations whose reads are counted.
