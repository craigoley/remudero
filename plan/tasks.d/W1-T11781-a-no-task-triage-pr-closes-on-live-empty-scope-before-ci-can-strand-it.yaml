- id: W1-T11781
  title: "A no-task triage PR closes on fresh empty-scope evidence before CI can strand it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  priority: 1
  status: queued
  attempts: 0
  note: "Reserved from the operator checkout on codex/operator-pr-flow-20261108; subject sweep found zero matches on main and each of the four open PR heads observed 2026-11-08."
  origin: "operator request 2026-11-08: fix PR #17348 and prevent already-complete triage PRs from becoming stuck"
  plan_refs: [W1-T963, W1-T11076, W1-T11077, W1-T10625]
  files:
    - src/run-task.ts
    - test/triage/no-task-triage-close-before-ci.test.ts
    - test/empty-diff-merge-gate.test.ts
    - test/helpers/gh-shim.ts
    - test/helpers/gh-shim.test.ts
  rationale: |
    PR #17348 was a closed, unmerged triage PR with zero changed files. Its feedback entry already
    had `status: rejected` at the base, head and current main; W1-T10625 already owns the accepted
    feedback outcome, so no duplicate product task is needed. `proof-discrimination` correctly
    failed because the proof was already true on the base, and `security-merge-policy` correctly
    returned `unknown: changed-file-corpus-incomplete`; neither gate is the defect.

    In `triageCommandLocked`, the W1-T963 live declared-scope check for `no_task` and `grill`
    currently follows `waitForCiGreen`. A red or unavailable CI result returns first and leaves
    the now-empty PR open. Evaluate the existing empty-scope disposition after publication,
    plan-only and provenance checks but before the CI wait. Immediately before closing, re-read
    the PR and require it to remain open on the same head and base used for the decision. A failed
    fetch, incomplete scope, unreadable PR state, or changed identity is unknown and leaves the PR
    open with a named recoverable outcome. Keep an equivalent live-scope recheck after CI so a
    sibling landing while checks run is still detected.

    Limit the early terminalization to `no_task` and `grill`; a `propose` PR also carries a new task
    shard and cannot be classified from its feedback file alone. Non-empty scope must retain all
    existing CI, proof, security, review and merge gates. Do not weaken or rewrite those gates.
    This closes the ordering gap left by W1-T963 without changing its successful green-CI behavior.

    SCOPE AMENDMENT: the existing W1-T963 end-to-end regression fixture must also be updated. Its old fake
    REST response omits `base.sha`, and it injects the sibling landing only during the CI poll; both assumptions
    predate the required exact-head/base safety read. The fixture will model complete PR identity and keep the
    sibling landing during CI, proving the post-wait scope recheck still catches it. The new early-close
    fixture also needs the exact head and base SHAs produced by the triage branch push. The shared `ghShim`
    currently emits only fixed response text, so add a route that streams the current contents of a response
    file and verify that capability in its helper suite. The bare-origin post-receive fixture writes the PR
    identity response when the branch is pushed. This keeps the test on the shared shim and avoids adding
    another hand-rolled shell fixture to the census.
  acceptance:
    - claim: "A no_task or grill triage PR with a complete empty live declared scope closes before a red CI wait can strand it, after a fresh read confirms the expected open PR head and base"
      proof: "unit test: W1-T963: an already-done triage PR is closed not merged"
    - claim: "A non-empty declared scope still follows the ordinary CI, review and merge gates, and the live-scope check still catches a sibling landing during the CI wait"
      proof: "unit test: W1-T963: end-to-end — a sibling's landed fix closes an already-done triage PR, never merges it"
    - claim: "An incomplete or unreadable live scope or PR-state read, or a changed PR identity, never causes an empty-scope close and leaves the PR available for recovery"
      proof: "unit test: W1-T963: a non-empty diff still passes in the same run"
    - claim: "The existing no_task/grill terminalizer remains limited to those actions and does not classify a proposal from its feedback-file diff alone"
      proof: "unit test: W1-T963: an empty-diff PR is refused"
    - claim: "The shared ghShim can return a response file's updated contents at invocation time"
      proof: "unit test: test/helpers/gh-shim.test.ts"
  falsifier: |
    Place the live-scope terminalizer after the CI early return: the red-CI empty-scope case must
    fail by leaving the PR open. Treat a fetch or PR-state refusal as an empty scope: the incomplete
    evidence case must fail. Remove the post-CI scope recheck: the sibling-landing case must fail.
