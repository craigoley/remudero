- id: W1-T1256
  title: "THE WIPE-TEST'S TWO ARMS ARE NOT INDEPENDENT — the clone-or-fetch-and-reset runs ONCE, before arm A, inside `if (!isSelf)`, and the two arms then run on consecutive lines with nothing between them, so arm B dispatches against whatever arm A left; arm A is always the learnings-ON arm and always first, which makes the inheritance systematic and one-directional rather than noisy"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  rationale: |
    RE-DERIVED FROM SOURCE AT origin/main 479e7fb, NOT CARRIED. `wipeTestCommand` (`src/run-task.ts`)
    performs its clone-if-absent / fetch+reset-if-present exactly once, inside `if (!isSelf)`, under
    a comment describing it as "the same clone-if-absent / fetch+reset-if-present pattern `rmd
    daemon`'s non-self target uses". That block closes, `runId` is minted, and the two arms then run
    on CONSECUTIVE LINES with nothing between them:

      const rawArmA = await runTaskFn(taskId, { planPath, config, skipGitSync: true });
      const rawArmB = await runTaskFn(taskId, { planPath, config, skipGitSync: true, maskLearnings: true });

    ARM A IS ALWAYS THE LEARNINGS-ON ARM AND ALWAYS RUNS FIRST. `maskLearnings` is absent on the
    first call and `true` on the second, and the order is a literal, not a parameter. So whatever
    arm A leaves is inherited by arm B in the SAME DIRECTION on every pair the harness will ever
    run. THIS IS BIAS, NOT NOISE: noise would cancel across pairs, and a fixed-order inheritance
    does not. A harness whose entire output is a DIFFERENCE between two arms cannot have one arm
    conditioned on the other arm's output and still be measuring what it claims.

    THE RESET IS REAL BUT IT IS IN THE WRONG PLACE. It is not missing — it runs — it simply runs
    before arm A rather than between the arms, so it conditions the PAIR's starting state and never
    the SECOND arm's. And it is inside `if (!isSelf)`, so on a self-target run there is no reset at
    all.
  design: |
    (i) Q1 — WHAT ARM A LEAVES, AND WHICH OF IT ARM B ACTUALLY READS. Enumerated, then classified,
    because a leftover nobody reads is not contamination:
      - THE CLONE (`<config.root>/repos/<repo>`): reset only before arm A. Arm B's worktree is cut
        by `worktreeAdd(repoDir, worktreePath, branch, "origin/main")`, i.e. from the clone's
        origin/main ref — so what matters is not the working tree but where that ref points.
      - THE RUN BRANCH arm A pushed (`run-<taskId>-<digits>`): read by `hasPushedRunBranch`
        (`src/lib/drain.ts`), consumed by `nextRunnable`/`isDispatchEligible`. THE WIPE-TEST PATH
        NEVER CALLS THE SELECTOR — a grep of the whole command body for
        `nextRunnable(`/`isDispatchEligible(` returns ZERO against a control of 11 such calls
        elsewhere in the file. SO THIS LEFTOVER IS NOT READ ON THIS PATH and is not contamination
        here; it becomes contamination the moment anything routes the wipe-test through drain.
      - ARM A's OPEN PR, THE LEDGER ROWS ARM A APPENDED, AND THE STATUS-CACHE PROJECTION: all three
        feed ONE reader. `runTask` builds `projection = projectPlan(plan, { ledgerPath, github },
        statusPath)` and `isMerged = (t) => projection.get(t.id)?.merged ?? false` FRESH ON EVERY
        CALL, so arm B constructs its own projection from a ledger arm A has already written to, a
        GitHub gateway that can now see arm A's PR, and `<config.root>/state/status.json`, which
        `projectPlan` reads back as its `previousProjection` fallback.
      - THE INFLIGHT LOCK (`<config.root>/state/inflight`, keyed by task id): taken and released per
        run; an arm A that dies without releasing blocks arm B outright.
    (ii) THE CHAIN, STATED AS A CHAIN: ARM A SUCCEEDS -> ARM A MERGES -> `projectPlan` REPORTS
    MERGED -> ARM B REFUSES AT ZERO COST. `runTask` gates on `if (isMerged(task))` and returns
    verdict `task_already_merged` without spawning unless `--rerun` is passed, which
    `wipeTestCommand` does not pass. Auto-merge is armed at PR-OPEN, so arm A's own PR can merge
    while arm A is still finishing. A SUCCESSFUL ARM A DESTROYS ITS OWN CONTROL: the better arm A
    does, the more certainly arm B measures nothing. And once arm A's PR merges, the sandbox's
    origin/main CONTAINS ARM A'S DIFF, so even a non-refusing arm B is cut from a ref where the work
    is already done.
    (iii) WHY NO RESET REACHES IT, WHICH IS WHY THE SCOPE MOVED. Re-fetch-and-reset between arms is
    cheap; a fresh clone per arm is cleaner and costs a clone. THEY LEAVE THE SAME THINGS UNRESET:
    arm A's pushed run branch and arm A's PR are REMOTE objects, and `task_already_merged` reads
    remote/ledger state through `projectPlan` while `hasPushedRunBranch` reads the remote ref list —
    NEITHER IS REACHABLE BY ANY LOCAL RESET. Worse, if arm A merged, `reset --hard origin/main`
    resets TO the contaminated state and a fresh clone CLONES it. The two options are equally
    powerless against exactly the channel that bites.
    (iv) OPERATOR RULING, 2026-08-23: NEITHER ARM MERGES. THE PAIR IS MEASURED AT THE VERDICT, NOT
    AT THE MERGE. Every quantity `wipetest.pair` records — turns, cost, verdict, strikes,
    `proof_exec` — is determined BEFORE any merge, so stopping short of the merge loses NO signal
    and removes the contamination at its SOURCE rather than trying to undo it afterwards. This is
    the fix; the reset question is downstream of it.
    (v) THE TWO REJECTED ALTERNATIVES, RECORDED SO THEY ARE NOT RE-PROPOSED. SEPARATE SUBJECTS PER
    ARM destroys the pairing the instrument rests on: the whole construct is a DIFFERENCE between
    two arms over the SAME task, and two different subjects make the difference a comparison of
    tasks rather than of learnings. A STRUCTURALLY UNMERGEABLE SUBJECT (one that cannot pass its own
    gate) removes the merge by removing success, so the harness would only ever measure tasks that
    CANNOT SUCCEED — an unrepresentative sample, and the one population where a learnings effect is
    least likely to show.
    (vi) SO WHAT THIS TASK NOW IS, AND IT IS SMALLER THAN IT WAS. NOT a reset mechanism: the
    NO-MERGE BOUNDARY, plus whatever local reset is still required once the remote cause is gone.
    AND THE HONEST ANSWER IS THAT NO LOCAL RESET IS NEEDED FOR THIS CHANNEL. Trace it with neither
    arm merging: `isMerged` is false for arm B, so the zero-cost refusal cannot fire; the clone's
    origin/main never moves, so arm B's worktree is cut from the same ref arm A was; the run branch
    and open PR are read only by drain's selector, which this path never calls; the status cache and
    the ledger rows matter to arm B ONLY through `merged`, which is now false. The remaining local
    state is a per-run worktree at a unique `run-<taskId>-<epochMs>` path and an inflight lock taken
    and released within each awaited arm — neither is shared between arms in steady state.
    TWO RESIDUALS ARE NAMED RATHER THAN FOLDED IN: a crashed arm A can strand its inflight lock,
    which is a pre-existing failure mode with an existing stale-lock reap and not this task's
    contamination; and arm A's PR and branch still ACCUMULATE across pairs, which is hygiene, not
    contamination, and should be scoped explicitly if the builder wants it rather than smuggled in
    under "reset".
    (vii) ARM ORDER, STATED PLAINLY RATHER THAN RECOMMENDED AS A FIX, AND IT SURVIVES THE RULING.
    Arm A is always the learnings-ON arm and always first — the order is a literal, not a parameter —
    so any residual inheritance runs in ONE direction on every pair. Alternating which arm runs first
    CONVERTS A SYSTEMATIC BIAS INTO RANDOM ERROR: strictly better than a fixed order, and STILL NOT
    CLEAN, because it lowers bias by raising variance rather than removing the leak. IT IS NOT A FIX
    AND MUST NOT BE SHIPPED AS ONE. It is worth doing ALONGSIDE the no-merge boundary: it costs one
    line, it removes the always-A-first confound that would otherwise survive any residual leak, and
    it makes such a leak visible as scatter instead of drift. This is what acceptance criterion four
    pins, and the ruling does not retire it — the no-merge boundary removes the KNOWN channel, and
    alternation is the cheap guard against an unknown one.
    (viii) THE FALSIFIER IS ITS OWN AND MUST RUN IN BOTH DIRECTIONS. Direction one: a pair where arm
    A reaches a verdict and arm B must still dispatch — no `task_already_merged`, no zero-cost
    refusal. Direction two, the control: the same fixture with the no-merge boundary REMOVED, where
    arm B demonstrably DOES refuse. Direction one alone is vacuous — a test that cannot detect the
    refusal when it is present proves nothing when it reports none.
    (ix) DECISIONS SPLIT FROM I/O. The no-merge boundary is a POLICY decision — whether this
    dispatch may arm/merge — and belongs in `src/lib/wipe-test.ts` as a pure function over injected
    state; the arming and teardown calls stay in `src/run-task.ts`. That split is what lets the
    falsifier drive both directions without a network.
  acceptance:
    - claim: "arm B does not inherit the already-merged verdict arm A produced for the same subject"
      proof: "unit test: test/wipe-test-arm-isolation.test.ts"
    - claim: "with the between-arms reset disabled arm B demonstrably observes arm A's artifact"
      proof: "unit test: test/wipe-test-arm-isolation.test.ts"
    - claim: "the remote state a local reset cannot reach is named rather than silently assumed clean"
      proof: "unit test: test/wipe-test-arm-isolation.test.ts"
    - claim: "the learnings-on arm is not always the arm that runs first"
      proof: "unit test: test/wipe-test-arm-isolation.test.ts"
