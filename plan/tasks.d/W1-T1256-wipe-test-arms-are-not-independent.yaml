  note: |
    AMENDED 2026-08-23 BY OPERATOR RULING, AND THE AMENDMENT IS SCOPED TO `design` AND `note` ONLY.
    `title`, `acceptance`, `files:` and `status:` are BYTE-IDENTICAL to the filing, proven
    field-by-field rather than asserted. THE RECORD HAD NOT MERGED WHEN IT WAS AMENDED — its PR was
    still open and the shard was absent from origin/main — so Standing rule 21 was never engaged;
    `postMergeAmendmentViolations` was nonetheless run in BOTH directions, and its result is recorded
    below rather than assumed.

    WHAT THE RULING CHANGED. The filing framed the defect as a misplaced reset. The finding stands and
    its consequence is larger: no reset reaches the contamination, because arm A's branch and PR are
    REMOTE and `task_already_merged` reads state a local reset cannot touch, while
    `worktreeAdd(…, "origin/main")` means a merged arm A moves the very ref arm B is cut from. The
    chain is arm A succeeds -> arm A merges -> `projectPlan` reports merged -> arm B refuses at zero
    cost, so A SUCCESSFUL ARM A DESTROYS ITS OWN CONTROL. The ruling is that NEITHER ARM MERGES and
    the pair is measured AT THE VERDICT. Design (iv)-(vi) carry it, with the two rejected
    alternatives and their reasons.

    AND THE TASK GOT SMALLER, WHICH IS RECORDED BECAUSE IT WOULD BE EASY TO MISS. Once neither arm
    merges, NO LOCAL RESET IS NEEDED FOR THIS CHANNEL — design (vi) traces why, reader by reader.
    Two residuals are named and deliberately NOT folded in: a stranded inflight lock from a crashed
    arm A (pre-existing, with an existing reap), and the accumulation of arm A's PRs and branches
    across pairs (hygiene, not contamination).

    THESE THREE STACK, SO P12 IS A SEQUENCE AND NOT A COMMAND, AND THE SEQUENCE IS UNCHANGED BY THIS
    RULING. W1-T1252 (#2593) files the null-pair refusal — the harness ledgers pairs it never
    measured. W1-T1253 (#2595) files the missing subject generator — there is nothing to seed a pair
    with. THIS task files the arm dependence. NO VALID PAIR EXISTS UNTIL ALL THREE LAND: a subject
    generator with no arm isolation produces a biased pair, arm isolation with no generator produces
    no pair at all, and either without the null-pair refusal writes a `wipetest.pair` row regardless.
    NEITHER SIBLING IS RE-FILED HERE and neither is a dependency edge, because they are independently
    landable in any order — only their CONJUNCTION is the precondition for signal.

    THE SUPPLY PROBLEM IS CONTEXT, NOT SCOPE. SBX-T1/T2/T3 all read `status: queued` while their work
    is already on the sandbox's main, so a pair run today re-runs an already-landed diff and both
    arms refuse. That is a fourth, separate condition on getting signal; it is recorded here so the
    sequence above is not mistaken for complete, and it is deliberately NOT scoped into this task.

    risk: high IS SET UP FRONT, AND BOTH READINGS ARE RECORDED AS REQUIRED. RULE 19's SPAN is the
    band's cause: `files:` spans three concerns — the pure wipe-test module, the command layer in
