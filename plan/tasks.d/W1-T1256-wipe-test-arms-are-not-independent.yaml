  note: |
    THESE THREE STACK, SO P12 IS A SEQUENCE AND NOT A COMMAND. W1-T1252 (#2593) files the null-pair
    refusal — the harness ledgers pairs it never measured. W1-T1253 (#2595) files the missing subject
    generator — there is nothing to seed a pair with. THIS task files the arm dependence. NO VALID
    PAIR EXISTS UNTIL ALL THREE LAND: a subject generator with no arm isolation produces a biased
    pair, arm isolation with no generator produces no pair at all, and either without the null-pair
    refusal writes a `wipetest.pair` row regardless. NEITHER SIBLING IS RE-FILED HERE and neither is
    a dependency edge, because they are independently landable in any order — only their CONJUNCTION
    is the precondition for signal.

    THE SUPPLY PROBLEM IS CONTEXT, NOT SCOPE. SBX-T1/T2/T3 all read `status: queued` while their work
    is already on the sandbox's main, so a pair run today re-runs an already-landed diff and both
    arms refuse. That is a fourth, separate condition on getting signal; it is recorded here so the
    sequence above is not mistaken for complete, and it is deliberately NOT scoped into this task.

