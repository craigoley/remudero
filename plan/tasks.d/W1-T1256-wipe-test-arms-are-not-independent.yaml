    acceptance text, which here names arm isolation, a disabled-boundary control, remote state and
    arm ordering. BLAST RADIUS ARGUES LOWER AND IS RECORDED SO THE BAND IS NOT MISREAD AS DANGER: the
    verb is sandbox-only by default (`resolveWipeTestTarget`), it is operator-invoked rather than
