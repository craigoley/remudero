  title: "A HOST OR TUNNEL OUTAGE BLANKS THE CONSOLE BECAUSE THE CONSOLE CAN ONLY PULL — push each changed status and recent snapshot, HMAC-signed, to the console's ingest route so it can keep showing the last snapshot, labelled stale, while the gateway is unreachable (optional; take on if outages continue after the pull fixes)"
