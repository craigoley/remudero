- id: W1-T3805
  title: "EMPTY dimensions AND drilldowns HIDE THE TWO REQUESTED BREAKDOWNS — aggregate outcome and work category without treating unknown rows as successes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 55.00
  origin: architect
