  rationale: |
    OPERATOR DIRECTION 2026-09-09, verbatim: "why would it review something and fail to act?! ...
    rmd should not be able to refuse to act! The whole point is for it to act!"

    MEASURED THE SAME EVENING, on the three PRs open at the time (#4867, #4879, #4887):

        disposition = mergeable
        acted       = False
        reason      = review success, required checks green — arming auto-merge
        stand_down_reason = CAPPED verdict (zero proofs executed) — refuses to arm auto-merge
                            without executed proof or an explicit, ledgered operator override

        #4887 stand-downs=6  23:39:27 -> 23:53:16  streak=2
        #4879 stand-downs=6  23:39:29 -> 23:53:17  streak=2
        #4867 stand-downs=6  23:39:29 -> 23:53:17  streak=2

    THE REFUSAL IS CORRECT AND MUST SURVIVE THIS TASK. Every proof on all three graded
    `executed_stale`: it passed at the head AND at the merge base, so it discriminated nothing and
    the criteria fell back to the keyword floor (`floor_degraded: true`, `capped: true`). Arming
    that is merging on prose, and `decideSweepArm`'s own comment records the cost: "#800 armed at
    proof_exec 0/5 and merged 35 seconds later."

    THE DEFECT IS THAT NOTHING ELSE HAPPENS EITHER. The state is terminal with no actor:
      - checks are GREEN, so no `blocked-fixable` disposition and no fix rung;
      - the verdict is CAPPED, so `decideAutoMergeArm` refuses;
      - `deriveDisposition` classifies it `mergeable`, which has exactly one action — arm — and that
        action stands down every pass.
    The PR sits until a human intervenes. Nothing drains the queue and nothing bounds it.

    AND THE FIX RUNG COULD NOT ACT EVEN IF DISPATCHED, which is why this is not a one-line routing
    change. Every `FIX_MODE_RULES` row (prompt-render.ts) keys off `unmetCriteria`, and these
    verdicts carry `unmet_criteria: []` — every criterion was MET, on the keyword floor.
    `body-coverage` and `reviewer-unmet` both require `unmet.length > 0`; the table would fall
    through to `reviewer-unmet` with nothing to hand a worker.

    SCOPE MEASURED, so this is sized honestly: 8 capped-and-not-plan-only verdicts across 159 PRs
    with a ledgered verdict; 5 already closed by other means; the 3 open ones are the population
    above. Small today. Unbounded, because nothing drains it.
  design: |
    (i) A CAPPED VERDICT BECOMES ITS OWN DISPOSITION, ordered STRICTLY BEFORE `mergeable`. Today
    `deriveDisposition`'s positive match is `checksState === "green" && reviewState === "success"`,
    which swallows this case into a disposition whose only action is one it cannot take. The new row
    matches the same green+success pair AND a ledgered capped verdict for THIS head with no
    recorded override, and routes to a FIXABLE disposition.
    (ii) THE ARM PREDICATE IS NOT TOUCHED. `decideAutoMergeArm` and `decideSweepArm` keep their
    current refusal byte for byte. This task changes WHICH DISPOSITION a capped PR receives, never
    whether a capped verdict may arm. A reviewer's instinct will be to "just arm it"; that is the
    one change this task must not make.
    (iii) A NEW FIX MODE, `proof-discrimination`, ADDED AS A TABLE ROW. `FIX_MODE_RULES` is
    injectable and its own doc says a new row must derive a new mode "with zero change to
    `deriveFixMode`". The row matches a review that is capped with NO unmet criteria and at least
    one proof graded `executed_stale` or `not_executable`.
    (iv) THE PROMPT CARRIES THE STALE PROOFS AND THE REMEDY, not the whole review. Each criterion's
    claim, its proof string, and its grade — plus the repo's own rule: a pure-path `unit test:`
    proof discriminates ONLY where its file is ABSENT or FAILING at base, so a criterion over an
    existing suite must be proven with a `grep:` on a CHANGED LINE instead. That remedy is
    mechanical and is what a human applies to this class today.
    (v) THE REPAIR IS A BODY EDIT AND THAT IS ALREADY A REVIEW INPUT. Review retries key on the
    versioned digest of head plus exact body, so a repaired body re-earns review on the SAME commit
    with no new push. The loop therefore closes without a rebuild: repair -> re-review -> proofs
    discriminate -> the EXISTING arm path fires on real evidence.
    (vi) THE STRIKE BUDGET IS SHARED WITH THE EXISTING RUNG, DELIBERATELY. A PR that has already
    burned its strikes on CI failures does not get a fresh budget here — an unbounded repair loop on
    a PR nobody can fix is the failure mode a strike cap exists to stop. Exhaustion escalates on the
    existing path rather than looping.
    (vii) NOT IN SCOPE: arming a capped verdict, changing the CAPPED override mechanism, promoting
    `lint-plan`'s `proof-base-discrimination` warning to a refusal (prevention is a separate task
    with its own population), or changing what `executed_stale` means.
