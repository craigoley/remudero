    A CORRECTION IS RECORDED HERE BECAUSE IT CHANGED THE TASK. The first diagnosis claimed the
    ledger line LIES — that `sweep.disposed` says "arming auto-merge" while `acted:false` and the
    refusal never reaches the ledger. That was WRONG: `stand_down_reason` carries the capped refusal
    verbatim, and the first read simply printed the `reason` field and dropped it. There is no
    legibility defect. The stall is real; the invisibility was the reader's.
    PREVENTION IS A SIBLING AND IS DELIBERATELY NOT FOLDED IN. `lint-plan` already reports this
