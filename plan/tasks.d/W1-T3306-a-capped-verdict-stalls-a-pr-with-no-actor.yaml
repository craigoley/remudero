    - claim: "the rendered prompt names each stale proof with its grade and states the discrimination remedy, and carries no other mode's inputs"
      proof: "unit test: test/a-capped-verdict-stalls-a-pr-with-no-actor.test.ts"
    - claim: "a ledgered operator override still routes the PR to mergeable, so the existing escape is not removed by the new row"
      proof: "unit test: test/a-capped-verdict-stalls-a-pr-with-no-actor.test.ts"
    - claim: "the new disposition shares the existing strike budget: an exhausted PR is not re-dispatched"
      proof: "unit test: test/a-capped-verdict-stalls-a-pr-with-no-actor.test.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF a capped green PR already reaches a rung: read
    `deriveDisposition`'s rule table (sweep.ts) for a row matching capped, and the `mergeable`
    case in the action switch. MEASURED 2026-09-09: the only capped reference in that path is
    `cappedOverrideFromLedger`, consulted to decide whether to arm — never to route.
    THE ARM REFUSAL IS THE CONTROL AND IT MUST BE PROVEN UNMOVED. A fixture with a capped verdict
    must STILL refuse to arm after this change. A suite that only proves the new disposition passes
    on an implementation that also relaxed the gate, which would be the single most damaging
    outcome available here.
    PROVE THE NEW MODE IS UNREACHABLE TODAY: run `deriveFixMode` over the capped-with-zero-unmet
    evidence against the CURRENT table and require it NOT to be the new mode. Without that control
    the new row may be matching something the old table already handled, and the task is moving code
    rather than closing a gap.
    PROVE THE LOOP TERMINATES. A repair that lands and still grades stale must consume a strike and
    reach the existing escalation, not re-dispatch. A fix rung with no ceiling on a PR nobody can
    repair is worse than the stall it replaces.
    DO NOT ARM A CAPPED VERDICT. Stated twice on purpose, here and in design (ii).
    DO NOT MATCH ON `reason` PROSE. The keyword-floor sentence is rendered text and rots; match on
    the structured `proof_exec` grades and the `capped` flag.
