  rationale: |
    WHY: the operator ruled that no pull request waits on the operator (2026-11-14, quoted in W1-T12709). W1-T12709 (#18738, open) replaces the needs-human stand-down for open pull requests, but it leaves out the W1-T10339 stand-down hold. That path still opens one needs-human issue per head before it holds.
    READ on the W1-T12709 branch (run-W1-T12709-1794776376000, head ae709cccb):
    - src/lib/sweep.ts:22973-23008: when the newest fix.stood_down row read inputs that all still stand, the pass sets standDownHold, disposition refused-escalate and blocker escalated. The comment says "It escalates once through the exact-head escalation route and holds."
    - :23042: the parked-PR remedy runs only when `standDownHold === undefined`, so this path skips it.
    - :25144: the refused-escalate action arm calls deps.escalate and records stand_down_escalation_outcome delivered or failed. :23336 dedups later passes on that row, so the issue is opened once per head and the pull request then waits.
    MEASURED read-only on the Azure host, core ledger and rotated archives, 2026-11-08T23:00Z to 2026-11-15T23:04Z:
    - 261 sweep.disposed rows with stand_down_hold true, on 28 pull requests.
    - 26 of them have stand_down_escalation_outcome delivered: 26 needs-human escalations on 19 pull requests (#17766, #17804, #17864, #17866, #17888, #18003, #18015, #18033, #18037, #18041, #18054, #18071, #18110, #18113, #18134, #18221, #18227, #18250, #18616).
    - Sites of the hold: rung.branch_claim 216, rung.strike 31, rung.evidence_head 12, rung.post_ci_review_source 2.
    - From the first to the last hold row on each pull request: 49.3 PR-hours in total. Longest: #17804 10.2 h, #17864 5.8 h, #18015 4.9 h.
    - Example: #18616 at 528d4c6, 2026-11-15T07:32Z, "fix stood down at rung.strike and nothing it read has changed", acted true, blocker escalated.
    The hold itself is right: a dispatch on the same inputs would stand down again with no worker. Only the needs-human issue is wrong. Each of these causes clears without a person: a new head, a new contract, a released branch claim, or the held-escalation ladder after HELD_ESCALATION_SLO_MS (6 h).
    RELATED, not duplicated: W1-T12709 (the remedy this task extends; it builds on its parkedPr host and its parked_pr.remedy row). W1-T10653 (an open-escalation stand-down reaches the SLO ladder). W1-T10990 (observe only).
  design: |
    INVARIANT no-stand-down-issue: a stand-down hold on an open pull request never opens a needs-human issue.
    INVARIANT one-row: one parked_pr.remedy row per pull request, head and stand-down site.
    1. src/lib/sweep.ts: the stand-down hold keeps its disposition, blocker and dedup, so heldEscalationAt and the held-escalation ladder work as today.
    2. src/lib/parked-pr-remedy.ts exports standDownHoldRemedy(pr, hold, ledger, host, ctx). In the refused-escalate action arm of src/lib/sweep.ts, after the held-escalation ladder block and before deps.escalate: when standDownHold is set and deps.parkedPr is wired, call it. It calls takeParkedPrRemedy with remedy fix-on-pr, cause `stand-down:<site>` and the hold's reason as text. Set acted false and a stand-down reason that names the hold and says no issue was opened. Do not call deps.escalate.
    3. The dedup at :23336 also counts a pass whose parked_pr.remedy row for this head and site exists, so a later pass writes no second row.
    4. No change to fixSeedRead, the release rules (new head, contract, body, conflict hand-off under a new main), or the strike and SLO ladders.
    5. Without deps.parkedPr (tests that do not wire it, and dry runs) the old path stays, so the two existing test files keep their meaning. Update their assertions only where they wire the production effects.
    NOT IN SCOPE: the fix rung's own rung.needs_design issue (W1-T13046); the plan-scoped round's escalation (W1-T13047).
  falsifier: |
    Keep the deps.escalate call for a stand-down hold: criteria 1 and 2 must fail. Write the remedy row on every pass: criterion 3 must fail. Hold a new head on the old row: criterion 4 must fail. Skip the ladder when the hold is past the SLO: criterion 5 must fail. Restore, and all must pass. If, 7 days after merge, the ledger still shows stand_down_escalation_outcome delivered rows from a daemon that wires parkedPr, the change did not reach production.
