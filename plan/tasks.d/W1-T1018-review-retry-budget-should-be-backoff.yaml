  note: |
    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (src/lib/task-linter.ts) exempts only `risk === "high"` and fires at two or more concerns; this
    record names three (sweep, run-task, the review-orphan wiring suite). The blast radius is real
    but bounded in a specific direction worth stating: getting this wrong toward "retry forever,
    never escalate" is the dangerous side, because it is silent, which is why design item (ii) makes
    the escalation a criterion in its own right rather than a side effect.

    verify: auto IS DELIBERATE, AND THE JUDGEMENT IS ALREADY MADE. The shape question — budget versus
