- id: W1-T3176
  title: "A BUILT CONSOLE WOULD BE THE FIRST BUILD ARTIFACT THIS SYSTEM HAS EVER HAD, AND NO DEPLOY PATH PRODUCES ONE — `bin/rmd` execs `tsx src/run-task.ts`, there is no `dist/`, CI runs `tsc --noEmit`, and the container's update path runs `npm ci` and nothing else"
  repo: remudero
  depends_on: [W1-T3175]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 25.00
  files:
    - deploy/Dockerfile
    - deploy/entrypoint.sh
    - src/lib/serve.ts
    - src/run-task.ts
    - package.json
    - test/a-missing-console-build-fails-loudly.test.ts
    - test/entrypoint-boot.test.ts
  origin: "operator-session#console-architecture-2026-09-08"
  plan_refs: ["W1-T3173", "W1-T3175"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-09-08, four reads that agree.
      1. `bin/rmd`'s last line: `exec "$DIR/node_modules/.bin/tsx" "$DIR/src/run-task.ts" "$@"`.
         Production runs TypeScript directly, at runtime.
      2. `ls dist build` -> neither exists. NOTHING in this repo is precompiled.
      3. `.github/workflows/ci.yml:112` runs `npx tsc -p tsconfig.json --noEmit`. A `build` script
         exists in package.json but CI never emits from it, so a broken emit would not be caught.
      4. `deploy/entrypoint.sh:290`: `( cd "$TREE" && npm ci ) || die "npm ci failed in $TREE"`.
         The RUNNING CHECKOUT is updated in place and dependency-installed; nothing builds.

    THE NEW FAILURE MODE, STATED PLAINLY BECAUSE IT DOES NOT EXIST TODAY. Once the console is a
    build output, a checkout that updates without rebuilding serves a STALE console — or, worse, an
    absent one. Today that is structurally impossible: the console is a string inside the source
    that runs, so it cannot be older than the code around it. This shard is the price of W1-T3173
    and it should be paid deliberately rather than discovered.

    THE OPERATOR WAS TOLD THIS BEFORE APPROVING and the record should carry it: the cost was named
    as "the first build artifact the system has ever had", with the mitigation being a build beside
    the `npm ci` plus a loud failure on a missing build. This shard is that mitigation.

    THE SILENT-FAILURE SHAPE IS THE ONE TO DESIGN AGAINST. A console whose HTML shell loads but
    whose JS bundle 404s renders a blank page and a console error the operator never sees, on a
    surface whose entire purpose is telling him what is wrong. A daemon that REFUSES TO SERVE a
    console it cannot find is strictly better than one that serves an empty frame.
  design: |
    (0) SCOPE, WIDENED 2026-09-09 WITH ITS REASONS. `package.json` declares the `build:console`
    script both deploy paths invoke — without it they are wired to nothing. `src/run-task.ts` holds
    the startup banner, and design (ii) says the result is reported THERE, one line under the
    console URL, because the failure being prevented is an operator opening that URL and getting a
    blank tab. `test/entrypoint-boot.test.ts` encodes the boot's npm-invocation contract and this
    change alters it.

    (0b) ⚠ AND THAT TEST CORRECTED THE DESIGN. The first implementation ran `build:console`
    UNCONDITIONALLY on every boot, and `entrypoint-boot.test.ts` refused it with its own stated
    reason: "an unconditional install on every boot would be a silent cost nobody would notice."
    That applies to a Vite build at least as hard — this host restarts tens of times a day (the
    watchdog revives it, the daemon's freshness exit fires), so an unconditional build is waste that
    nothing would ever have surfaced. It now builds ONLY when the console build is absent, mirroring
    the tsx bootstrap directly above it.

    (0c) THE GAP THAT LEAVES, NAMED RATHER THAN PAPERED OVER. A checkout that updates its SOURCE
    without rebuilding still serves a stale console. Design (iv) scopes this shard to ABSENCE
    deliberately, so rebuild-on-change is a separate task and not a silent omission here.

    (i) THE BUILD RUNS WHEREVER `npm ci` RUNS — the image build (`deploy/Dockerfile`) and the
    in-place checkout update (`deploy/entrypoint.sh`). Two paths update the running code; a build
    wired into only one of them is a stale console waiting for the other path to be taken.
    (ii) `rmd serve` VERIFIES ITS BUILD AT STARTUP AND SAYS SO. A missing or unreadable console
    build is reported at boot, in the startup banner, naming the directory it looked in — not
    discovered by an operator staring at a blank tab.
    (iii) REFUSE, DO NOT DEGRADE, and this is the whole safety argument. Serving the shell without
    its assets produces a blank page indistinguishable from a hung daemon. The API routes MUST keep
    serving (an operator with `rmd status` and a dead console is far better off than one with
    neither), but the console route itself must fail legibly.
    (iv) THE STALENESS QUESTION IS SEPARATE FROM THE ABSENCE QUESTION and only absence is claimed
    here. Detecting "this build is older than the source it was built from" needs a provenance
    stamp and a comparison, and folding it in would put two mechanisms behind one falsifier.
  acceptance:
    - claim: "an absent console build directory is reported at startup, naming the path that was searched"
      proof: "unit test: test/a-missing-console-build-fails-loudly.test.ts"
    - claim: "with the build absent, the console route refuses legibly and the /v1 API routes still serve — the daemon degrades on one surface, never on both"
      proof: "unit test: test/a-missing-console-build-fails-loudly.test.ts"
    - claim: "a present build is served and produces NO startup complaint — the check discriminates present from absent"
      proof: "unit test: test/a-missing-console-build-fails-loudly.test.ts"
    - claim: "both deploy paths that run npm ci also produce a console build — the image build and the in-place checkout update"
      proof: "grep: build:console in deploy/entrypoint.sh"
  falsifier: |
    CLOSE IF anything already produces or verifies a build artifact:
      `ls dist build 2>/dev/null` · `tail -1 bin/rmd` ·
      `grep -nE 'npm ci|npm run|tsc' deploy/entrypoint.sh`
    MEASURED 2026-09-08: no dist/ or build/; bin/rmd execs tsx directly; entrypoint.sh runs
    `npm ci` at line 290 and no build of any kind.
    PROVE IT LOAD-BEARING: the fixture with an EMPTY build directory must produce the startup
    complaint AND a legible console refusal AND a still-serving /v1 route; the same fixture with a
    populated directory must produce none of the first two. If the absent case is silent, the
    mechanism has not been added — it has been described.
    DO NOT satisfy this by making the daemon REFUSE TO START. The console is one surface of a
    process that also runs the fleet; killing the daemon because a front-end build is missing trades
    a blank page for an outage, which is the costlier direction by a wide margin.
    DO NOT satisfy this by committing build output to the repository. That makes every console
    change a binary diff, makes the ratchets meaningless, and moves the staleness problem from
    deploy time to review time where it is harder to see.
  note: |
    Rule 25 CHECKED: `deploy/` is deployment scripting and `src/lib/serve.ts` is ordinary src;
    neither is an instrument path under the rule, and no `scripts/` gate is touched.
    ORDERING: depends on W1-T3175 because a startup check for a build the server cannot serve
    verifies nothing an operator can use.
    CAVEAT WITH EQUAL WEIGHT: this shard covers ABSENCE, not STALENESS. A build that exists but was
    produced from an older source still serves silently and this task does not detect it. That is a
    real remaining gap, deliberately unclaimed, and it needs its own record.
    SECOND CAVEAT: `deploy/entrypoint.sh` is 32 KB of shell that this repo's test suite does not
    execute. The fourth criterion is therefore a `grep:` proof — it establishes the build was wired
    into the update path, NOT that the path runs correctly on the host. Only a real recycle proves
    that, and no unit test here should claim otherwise.
