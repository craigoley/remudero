  rationale: |
    THE DEFECT AT SOURCE. `src/lib/tmp.ts`'s `sweepStaleTempDirs` reaps only names starting with
    `RMD_TMP_PREFIX` = `"rmd-"`. `test/setup/tmp-hygiene.ts` wraps `fs.mkdtempSync` to normalize a
    bare prefix through `reapableTmpPrefix`, prepending `rmd-test-` so the sweep matches — but
    that wrap only fires when the setup file is `--import`ed. A bare `node --test <file>`, a
    script the tests spawn (`scripts/recovery-drill.mjs:159`), a developer running one file
    directly, and every future callsite added by a worker that forgets the convention all bypass
    it. The wrap was a workaround at the wrong layer; the callsite is what needs to be authored
    correctly.

    THE RULE. A `mkdtempSync` call whose FIRST argument is `join(tmpdir(), <expr>)` (or a
    statically-resolvable alias) is a violation UNLESS `<expr>` is a string beginning with
    `rmd-`, or a template literal beginning with `${RMD_TMP_PREFIX}`, or the callsite is on
    the documented `hooks/mkdtemp-allowlist.txt`. Non-string
    `<expr>` (variable prefix, function return, spread) is refused outright: the rule reads the
    AST, not the runtime value, so a variable prefix cannot be statically proven reapable and
    must be replaced with a resolved literal. `scripts/tracked-source-write-check.mjs` is the
    precedent for the AST walk shape: `git ls-files` for corpus, best-effort static resolution of
    string arguments, a small explicit exemption list rather than pattern soup, and a doc comment
    that names what the check CANNOT catch.

    THE HOOK. `.husky/` does not exist here; `lint-plan` runs from CI only (measured 2026-09-03).
    `hooks/pre-commit` doesn't exist yet either, but `hooks/commit-msg` and `hooks/deny-floor.sh`
    both do, and `src/lib/worker.ts` (line 3297) already writes `core.hooksPath hooks` into every
    worktree at `worktreeAdd`, and `deploy/entrypoint.sh` writes the same for the daemon
    container. So a new tracked `hooks/pre-commit` calling `scripts/mkdtemp-callsite-check.mjs`
    inherits the SAME wiring `commit-msg` uses, with no bootstrap, no husky install, and no
    developer machine that CI never sees. A worker that authors a bare-prefix callsite gets its
    commit refused in its own worktree, before the branch push, before CI. The check also runs in
    CI (a new `.github/workflows/ci.yml` job or a `lint-plan` sibling) so the operator's own
    checkout, and any commit made outside the hook path, cannot slip past.

    THE MIGRATION IN THIS PR. Only the sites the falsifier NAMES — the five test prefixes
    (`sweep-reentry-`, `unwired-gate-`, `fleet-heartbeat-gclog-`, `w1-t2587-instr-base-`,
    `reclaim-state-`) and `scripts/recovery-drill.mjs:159` — plus every OTHER site that lives in
    the same files as those five. That is bounded and reviewable. The remaining ~1015 hits ship
    behind a sibling migration shard (see BAND below) in tranches that respect the conflict
    surface every open branch presents. Until they land, they carry an allowlist entry in
    `scripts/mkdtemp-callsite-check.mjs` naming their file and a reason, so the rule fails closed
    for NEW additions without paying the migration cost on day one.

    WHAT THIS DELIBERATELY DOES NOT DO. It does not change `src/lib/tmp.ts` itself (the earlier
    at-source approach's dead body). It does not add a global load-order dependency across the
    codebase. It does not widen `sweepStaleTempDirs` to match non-`rmd-` prefixes — that would
    make the sweep read every unrelated program's temp dirs and turn the incident it was built
    for into a data hazard. And it does not touch `test/setup/tmp-hygiene.ts`'s runtime wrap, so
    a suite running today with the wrapper loaded keeps working exactly as before.

    BAND. `risk: high` with `band_meaning: span` is Rule 19 SIZING, not blast radius: the linter
    lives in `scripts/`, its wiring lives in `hooks/` and `src/lib/worker.ts`, the migration
    lives in `scripts/recovery-drill.mjs` and five test files. Six subsystems on paper, one
    concern in practice: a callsite convention and its enforcement. Not decomposable: shipping
    the rule without migrating the sites it names would immediately red every pre-commit and
    every CI on this repo; shipping the migration without the rule leaves the next author to
    reintroduce the defect.
