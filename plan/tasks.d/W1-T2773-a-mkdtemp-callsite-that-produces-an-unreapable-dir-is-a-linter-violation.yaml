  # explicit.
  #
  # PRE-COMMIT MESSAGE FOLD (operator directive): refusals must name the fix, not the rule. The
  # message is written for a human who authored the bare form an hour ago and does not yet know
  # this repo has a reapability discipline. Shape:
  #
  #     mkdtemp prefix 'foo-' will not be reaped by src/lib/tmp.ts's sweepStaleTempDirs — use
  #     `${RMD_TMP_PREFIX}foo-` or add to hooks/mkdtemp-allowlist.txt with a reason.
