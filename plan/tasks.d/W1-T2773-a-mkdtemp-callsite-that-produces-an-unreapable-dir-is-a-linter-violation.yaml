    - claim: "a mkdtempSync callsite prefixed with `${RMD_TMP_PREFIX}` (the one existing sanctioned constant) is accepted, and NO other prefix is admitted as sanctioned by this rule"
      proof: "unit test: test/mkdtemp-callsite-check.test.ts"
    - claim: "hooks/pre-commit invokes the check and exits non-zero when any staged file adds a refused callsite, so a worker's own worktree stops the commit before any branch push"
      proof: "unit test: test/mkdtemp-callsite-check.test.ts"
    - claim: "the five test prefixes the falsifier names (sweep-reentry-, unwired-gate-, fleet-heartbeat-gclog-, w1-t2587-instr-base-, reclaim-state-) and scripts/recovery-drill.mjs are migrated to rmd- prefixes and pass the rule at head"
      proof: "unit test: test/mkdtemp-callsite-check.test.ts"
  falsifier: |
    Delete the string-literal refusal branch from `scripts/mkdtemp-callsite-check.mjs` and the
    named test in `test/mkdtemp-callsite-check.test.ts` moves `# fail 0` -> `# fail 1`. Restore
