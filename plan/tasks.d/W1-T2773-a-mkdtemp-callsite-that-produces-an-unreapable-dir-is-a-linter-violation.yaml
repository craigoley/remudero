  note: |
    THIS SHARD'S SCOPE CHANGED. The first brief called for an unconditional fix inside src/lib/tmp.ts:
    move `reapableTmpPrefix` in, install a `fs.mkdtempSync` wrap at module load, and let the ~60
    fixture callsites route through unchanged. That was built and the falsifier (a bare
    `node --test` on `test/a-bound-that-stops-waiting-does-not-stop-the-work.test.ts`) refused to
    pass: the fix produced ZERO reapable dirs, 4 fresh bare `sweep-reentry-*`. Root cause: `tmp.ts`
    is a LEAF; only `src/run-task.ts` and `src/lib/worker-provider.ts` import it, so its wrap fires
    only when one of those is on the graph. A bare `node --test <file>` doesn't load either.
    Operator ruling recorded: (a) documenting a longer `--import` workaround and (b) widening
    tmp.ts into a hub with a global load-order dependency are both worse than the status quo.
    Option (c) is correct: catch the callsite at authoring time with a linter that reads the AST
    directly, so the fix does not depend on any import graph.

    AND THE SCALE CHANGED. `git grep -E "mkdtempSync\\s*\\(\\s*join\\s*\\(\\s*tmpdir\\s*\\(\\s*\\)"`
    over src/scripts/test/ that DON'T carry `rmd-` on the same line: 1020 hits across 629 files;
    307 files carry no `rmd-` literal anywhere. The earlier brief's "5 examples + others grep
    finds" underestimated by two orders of magnitude. The rule + hook + migration cannot ship as
    ONE PR (conflict surface every open branch touches), and it doesn't have to: this shard ships
    the RULE and the HOOK and the SPECIFIC SITES the falsifier exercises; a sibling shard picks
    up the rest of the migration in tranches.
  # ── OPERATOR FOLD-INS (2026-09-03) ────────────────────────────────────────────────────────
