- id: W1-T2604
  title: "THE CONSOLE INBOX CAN ONLY SAY YES, SO EVERY PROPOSAL IT CANNOT RATIFY STAYS FOREVER — /v1/inbox exposes exactly TWO actions, approve and reframe, and there is no decline, retire or dismiss anywhere in panel-graph.ts; a proposal that is self-withdrawn, refused at ratification, already satisfied on main, or a duplicate of one just ratified is READY by every predicate and has no path out except being approved into a task nobody wants — MEASURED 2026-09-02: of 52 READY proposals, 5 declared themselves WITHDRAWN/REFUSED/ALREADY-SATISFIED in their own titles and 3 more were duplicates of work already shipped"
  repo: remudero
