    - claim: "On synthetic logs with known probabilities and a known provider effect, the estimate recovers the effect within tolerance across seeds"
      proof: "grep: W1-T14146 criterion 2: in test/routing/the-fleet-estimates-each-routing-policy-from-logged-probabilities.test.ts"
    - claim: "The interval resamples tasks, so one task's attempts move together"
      proof: "grep: W1-T14146 criterion 3: in test/routing/the-fleet-estimates-each-routing-policy-from-logged-probabilities.test.ts"
    - claim: "A cell reads concluded only past the experiments' decision rule and floor, and otherwise names why it is running or underpowered"
      proof: "grep: W1-T14146 criterion 4: in test/routing/the-fleet-estimates-each-routing-policy-from-logged-probabilities.test.ts"
    - claim: "invariant:within-support — no row values a provider whose logged probability in that cell was 0"
      kind: guard
      proof: "grep: W1-T14146 criterion 5: in test/routing/the-fleet-estimates-each-routing-policy-from-logged-probabilities.test.ts"
    - claim: "The measurement cadence writes the estimate"
