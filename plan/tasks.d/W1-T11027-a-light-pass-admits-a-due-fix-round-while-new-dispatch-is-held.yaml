  risk: high # the fix lane's admission timing on light passes; capacity, strike and judgment gates are unchanged
  origin: operator-session#queue-focus-2026-10-30
  plan_refs:
    - W1-T11026
    - W1-T2584
  files:
    - src/lib/sweep.ts
    - test/sweep/a-light-pass-admits-a-due-fix-round-while-new-dispatch-is-held.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "While state/FOCUS is held by the focus gardener, a blocked-fixable PR whose fix round is due and admitted by every gate the full sweep applies (fix capacity, strike schedule, progress judgment, in-flight and escalation holds) starts that round within one light pass, instead of being disposed \"deferred to full sweep (light pass)\". Without state/FOCUS, light passes defer exactly as today"
      proof: "unit test: test/sweep/a-light-pass-admits-a-due-fix-round-while-new-dispatch-is-held.test.ts"
  rationale: |
    The operator's 2026-10-30 ask is that the gardener "dispatches more fix workers" while it holds new work. OBSERVED, operator recon (sweep.disposed rows for blocked-fixable PRs, 2026-10-29T14:50Z to 2026-10-30T14:50Z, 1,375 rows over 64 PRs, 218 acted):
    - 175 were "deferred to full sweep (light pass)" and 168 were review-only boot, drain or interphase passes with the repair lanes closed.
    - Host capacity refused a due fix only 34 times (sweep.fix_capacity: host_worker_budget 8; the fix queue was empty in 486 of 719 readings).
    So the binding constraint on fix throughput is when a pass may admit a fix, not how many workers exist. Full passes run once per daemon tick, a median 72.6 minutes apart over 7 days (daemon.tick_phases).
  design: |
    The builder first reads why light passes defer repair (the light pass's actionable() and standDownReasonFor in src/lib/sweep.ts, and the task that introduced it) and keeps every read and gate the full pass's fix admission depends on. Two shapes satisfy the claim: the light pass admits the round itself through the same admission path, or it requests the full sweep at once (the sweep retrigger) for that PR. Pick the one that keeps a single admission path, and record the choice in the PR body.
    The focus signal is the file the focus gardener writes (W1-T11026); review-only boot and drain passes keep their repair lanes closed.
  falsifier: |
    Remove the focus branch: the test's held-focus fixture is again disposed "deferred to full sweep (light pass)" and fails. The no-focus fixture must defer either way.
  note: |
    Reserved with rmd next-task-id from the operator checkout (run-unfiled-1793371974275). Builds after W1-T11026 merges.
    No change to fix capacity, strike caps or progress judgment is authorized by this task.
