  rationale: |
    WHY: the operator asked on 2026-11-12 for a decision-model judge trial in the field trials, with latency, cost per decision, agreement, Brier and abstention rate (backlog item FT2). The daily field-trials pass is where rmd keeps its private model evidence, so the judge figures belong there, next to the worker figures and apart from them.
    WHY NOT A CONTROLLED TRIAL OR A FIELD NOTE (read 2026-11-12 at origin/main 920669542):
    - src/lib/field-trials-controlled-release.ts:48-60 accepts one registered epoch of exactly two model arms, randomized per task, with merged-on-main as the primary outcome, for the site's fixed field-trials-v1 parser (:28-30, site commit eae03ec12). A judge shadow is paired on the same input, not randomized per task, and its outcome is an answer, not a merge. It does not fit that contract.
    - src/lib/field-trials-field-note.ts:2-9 builds the site's model-field-note-v1 from the adoption cells, per selected model and task class. Judge rows there would sit under gpt-6-luna beside worker coverage, which W1-T12420 forbids.
    - So this task adds a private family. Publishing it needs a site schema, which is the operator's decision and is not filed here.
    READ 2026-11-12 at origin/main 920669542:
    - src/lib/field-trials-flow.ts:72 FLOW_STEPS and :74 GUARDRAIL_STEPS name the steps the snapshot reads; no judge step is among them. :922 `buildFieldTrialsFlowSnapshot` derives the families, :1067-1068 reuses unchanged partitions by input hash, and :1270 `buildFieldTrialsRelease` builds the release from named families only.
    - src/lib/field-trials-refresh.ts:7 REFRESH_STEPS runs the snapshot daily, so the new family needs no new flag or cadence.
    - src/lib/shadow-judge.ts:76 writes shadow_judge.paired rows today (review, risk, verify-human), so the family has live rows before any decision model is called.
    - docs/research/model-evidence-program.md:56 trial 4, "Escalation and judge policy", already names calibration and abstentions as the measures for a judge. The document says nothing about decision models or surfaces.
  design: |
    1. Add src/lib/field-trials-judges.ts with `judgeTrialCells(rows, periodOf)`. It maps decision.answered, shadow_judge.paired and judge_replay rows to W1-T12414's recorded answers (with W1-T12420's model surface), calls `scoreTypedAnswers` per cell, and adds latency and settled-dollar medians from the rows.
    2. In src/lib/field-trials-flow.ts add the three steps to a JUDGE_STEPS set that only `judgeTrialCells` reads, and add a `judges` family with partition input hashes like the other families. Add input digests and decision keys to privateKeys. Do not add the family to `releaseCells` or to the field-note input.
    3. In docs/research/model-evidence-program.md add a section "Judge family": what it reads, its key (role, model and surface), its basis (live or replay), its measures, and that it is private until a reviewed site schema exists. Add the per-model calibration rule: a calibration and a threshold belong to one model on one surface.
    NOT IN SCOPE: any site schema or release of judge figures; any gate, route or gardener reading the family; a randomized judge trial.
  falsifier: |
    Let a decision.answered row reach the adoption family and criterion 1 must fail. Pool two surfaces in one cell and criterion 2 must fail. Merge live and replay answers and criterion 3 must fail. Compute agreement here in place of the scorer and criterion 4 must fail. Add the family to the release cells and criterion 5 must fail. Restore and require all to pass.
