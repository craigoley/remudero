    risk:high — RULE 19 / #588 MERITS TEST, YES: criterion 1 is ONE cross-file invariant unsatisfiable
    piecewise — 'a boot pass lands an entry stranded before startup' needs the rung
    (src/lib/feedback-landing.ts), its daemonBoot/poll call sites (src/lib/daemon.ts) and the deps the
    producer supplies (src/run-task.ts) present in the SAME test; a rung without its caller is exactly
    the merged-green-and-unreached class, so decomposing the trigger from the thing it triggers would
    ship the defect this task exists to close.
    It also argues UP on its own terms: the new caller runs UNATTENDED EVERY POLL against a force-pushed
    shared branch: a rung that force-pushes noisily or dirties the daemon checkout is worse than the
    stranding it fixes, which is why three of the criteria are about doing NOTHING correctly.
    budget_usd 60 — the scan, the tree building and the gated-PR path all already exist; the cost is the
    fixture daemon loop and the never-throws/never-dirty assertions.
