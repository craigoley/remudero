  falsifier: |
    Close without implementation if a dependency-bearing non-merged result does not terminate the
    persistent daemon or if exit 76 does not start a new in-container lifetime. Checked at
    origin/main 3514b1cc: `src/lib/daemon.ts` returns `summary("blocked", blockedDetail)` after the
    settlement loop, `daemonExitCode("blocked")` returns 76, and `deploy/entrypoint.sh` sleeps,
    syncs and restarts on 76. The live 03:58Z log showed that exact chain at restart 3/100.

    Also close if an existing runtime park already excludes only the blocker while keeping its PR
    reconciliation and independent frontier alive. `NextRunnableOpts.excludeIds` exists in
    `src/lib/drain.ts`, but `runDaemon` supplies no daemon-lifetime set and instead returns. Do not
    falsify this from W1-T2537, W1-T2964 or W1-T2965: their merged tests preserve exit-76 restart,
    content-aware freshness and first-cycle progress respectively; none parks a queue subtree.
