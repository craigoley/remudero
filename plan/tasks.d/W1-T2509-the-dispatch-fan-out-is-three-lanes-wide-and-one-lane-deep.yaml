- id: W1-T2509
  title: "THE DISPATCH FAN-OUT IS THREE LANES WIDE AND ONE LANE DEEP — `dispatch.concurrent_set` proves the batch admits three tasks at `lane_count: 3`, yet their run ids are minted 78 SECONDS APART because `Promise.allSettled(admitted.map(runOne))` maps over work that blocks the single-threaded event loop; the daemon has been paying for three lanes and running one since concurrent dispatch shipped"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
