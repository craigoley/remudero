- id: W1-T10845
  title: Dependabot bumps the cloudflared pin, and the head-identity gate admits that bump as a dependency-only PR
  repo: remudero
  depends_on:
    - W1-T10844
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  budget_usd: 6
  risk: high  # one concern (a bump reaches merge) spanning the bot config, the admission set and its test
  band_meaning: span
  origin: operator-request#cloudflared-emudhra-2026-10-27
  plan_refs:
    - W1-T3680
    - W1-T6064
  files:
    - .github/dependabot.yml
    - src/lib/dep-review.ts
    - test/review/a-cloudflared-pin-bump-is-a-dependency-only-pr.test.ts
  status: queued
  attempts: 0
  rationale: |
    W1-T10844 pins the console tunnel to deploy/cloudflared/Dockerfile and rolls the host onto that pin with no gap. Without this task the pin moves only when a person remembers to move it. The 2026-10-27 eMudhra floor (cloudflared >= 2026.10.2) found the host on 2026.8.3 because nobody did.
    Dependabot's docker ecosystem already refreshes deploy/Dockerfile's Node digest (.github/dependabot.yml), and its PRs merge here: chore(deps) #14095-#14097 merged on 2026-10-25.
    But its entries are per directory, and the head-identity gate's dependency-bump form (W1-T3680) admits only paths that isDependencyDeclarationPath accepts. For deploy/, that is the explicit DEPLOY_DEPENDENCY_DECLARATIONS set in src/lib/dep-review.ts, which names deploy/Dockerfile but not deploy/cloudflared/Dockerfile. Pointing Dependabot at the pin alone would yield bumps the gate refuses, every week.
  design: |
    (1) .github/dependabot.yml: a `package-ecosystem: docker` entry for `directory: /deploy/cloudflared`, weekly, with the same chore commit-message prefix as the other entries.
       Calendar versions mean each January's bump (e.g. 2026.12.x to 2027.1.0) reads as semver-major. The dep-review lane holds a major for the operator (W1-T54). Accept that: it is one approval a year, and it is NOT widened here.
    (2) src/lib/dep-review.ts: add exactly `deploy/cloudflared/Dockerfile` to DEPLOY_DEPENDENCY_DECLARATIONS.
       No glob and no widening of workspace matching, as that set's own comment demands. This also leaves edge-heal.sh and every other deploy path code, so a bump head touching them is still refused.
    The merged bump then reaches the host through the core install checkout's fast-forward and W1-T10844's drift roll, with no human step.
  acceptance:
    - claim: Dependabot's docker ecosystem watches the cloudflared pin's directory
      proof: "grep: directory: /deploy/cloudflared in .github/dependabot.yml"
    - claim: a dependabot head whose only change is deploy/cloudflared/Dockerfile is admitted as a dependency-only bump, and one that also touches deploy/edge-heal.sh is refused
      proof: "unit test: test/review/a-cloudflared-pin-bump-is-a-dependency-only-pr.test.ts"
  falsifier: |
    Drop the new DEPLOY_DEPENDENCY_DECLARATIONS entry. The admitted-bump test then sees isDependencyDeclarationPath("deploy/cloudflared/Dockerfile") return false, and fails.
