  falsifier: |
    At origin/main (and after W1-T9967 alone), W1-T9874's (1 + 29) = 30x factor multiplies its score. A P2 at
    urgency ~0.8 scores 24x the fresh P1's base, so it sorts first and the first test fails.
    With the fix, its pass is the P2 tier's no-fan-out slot, which sits after the fresh P1.
    Ways to break it, and the test that catches each:
    - Drop the fan-out entirely: the within-tier test sees the 29-dependent P2 tie on age and be decided by id.
    - Cap the factor instead of assigning slots: the property test finds a large-enough fan-out that moves a tier.
