  design: |
    No fixed count, cap or weight (standing operator rule).
    1. SLOT-PRESERVING FAN-OUT (`costOfDelayContext`, src/lib/dispatch-value.ts, a helper named `fanoutWithinTier`).
       - Compute each open task's pass WITHOUT the fan-out factor: `pass0 = (1 + starts) / score0`, where score0 is
         today's product less `(1 + fanout)`, and the urgency is W1-T9967's.
       - The pass0 values fix which TIER owns each position in the order.
       - Within each tier (one declared priority value; absent is its own tier, as in `priorityTiers`):
         - sort the tier's members by the WITH-fan-out pass `passF = (1 + starts) / (score0 x (1 + fanout))`, ties by id;
         - sort the tier's pass0 values ascending;
         - give the k-th member the k-th smallest pass0 as its `stridePassByTaskId` value.
       - So the passes are a permutation, within a tier, of the no-fan-out passes. Every cross-tier comparison
         `compareDispatch` makes reads exactly what it would read with no fan-out at all. Inside a tier, more open
         dependents still go first.
       - The result is a total order. A pairwise rule ("compare across tiers without fan-out, within with it") is
         NOT transitive: P1 A, an old P2 B, and a young P2 C with a large fan-out form a cycle. That is why the
         design assigns slots instead of changing the comparator.
    2. `costOfDelayByTaskId` keeps the full product, fan-out included, so the value W1-T9325's explanation row reads is
       unchanged in meaning. Only the stride pass is slot-assigned.
    3. Unchanged: `openDependentFanout`, `compareDispatch` and its tiebreak chain, the fallback order, eligibility and
       the pack.
    4. TESTS. A new file, test/downstream-fan-out-reorders-within-a-tier-never-across-one.test.ts, with `test(` titles
       verbatim as in the proofs. It uses `buildDispatchValueContext` plus `dispatchOrder` on injected plans and rows
       with fixed timestamps, as the W1-T9323 file does.
       - Falsifier: W1-T9874 (P2, 29 open dependents in the plan, age inside the P1 tier's measured wait) against
         W1-T9926 (P1, fresh).
       - Within-tier: two P2s of equal age, one with 29 dependents and one with none. The one with dependents is first.
       - The property: on a mixed queue of at least three tiers, with ages and fan-outs varied, the sequence of TIERS in
         `dispatchOrder` is identical with and without the dependents.
