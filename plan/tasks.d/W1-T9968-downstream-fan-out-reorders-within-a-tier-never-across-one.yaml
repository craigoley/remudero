  rationale: |
    MEASURED by agent Q-DISPATCH, 2026-10-16 evening, running `costOfDelayContext` in-process at the daemon's HEAD
    2d27304fc (session scratchpad qdispatch-repro.ts):
    - The score is `validity x (1 + openDependentFanout) x class score x merge posterior x urgency`. The fan-out factor
      multiplies the WHOLE score, so it competes directly with the tier weight `2^-tierGap`.
    - W1-T9874 (P2, 29 downstream) scored 17x W1-T9926 (P1). A 30x factor outweighs any gap below about five tiers.
    - Five of the last eight starts were the 42-task test-restructure chain, whose head tasks carry the chain's fan-out.
    READ on origin/main 0209f6837: the line
    `score = probability * (1 + (context.openDependentFanoutByTaskId.get(task.id) ?? 0)) * (classScore ?? NaN) * mergeProbability * urgency`
    in `costOfDelayContext`, then `pass = (1 + starts) / score`. `compareDispatch` (src/lib/drain.ts) compares the stride
    pass first, so the fan-out factor crosses tiers directly.
    WHY DEPENDS ON W1-T9967 AND NOT ONE TASK WITH TWO CRITERIA.
    - Rule 19 would allow one `risk: high` task with both criteria. The ruling's two options are independent
      acceptance concerns, though: one is the time unit, the other the fan-out scope. Each has its own falsifier, so
      decomposing keeps each build and each review to one concern.
    - Both edit `costOfDelayContext`. Overlap packing would serialize them anyway, but in an undefined order, and the
      second would conflict on the same lines. `depends_on` makes the order explicit.
    - The order is W1-T9967 first. This task's live effect needs it. Under the 10.09 h survivor median, a P2 older than
      about 10 h already outranks a fresh P1 on age alone, so removing fan-out from the cross-tier order would not put
      W1-T9926 ahead of an old W1-T9874. With W1-T9967, the P2 ages in the P1 tier's own wait, and then fan-out is the
      only lift left. This task removes it.
