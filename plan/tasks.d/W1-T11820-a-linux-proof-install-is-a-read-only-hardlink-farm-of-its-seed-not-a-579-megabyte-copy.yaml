- id: W1-T11820
  title: On Linux a proof install is a hardlink farm of its seed with read-only files and real directories, so a worktree reaches a preflight-admissible install in seconds without 579 MB of new data
  repo: remudero
  depends_on: []
  priority: 0.3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # changes how a proof install is materialized on Linux; an in-place write must fail and never reach the seed, a failed link falls back to today's copy, and macOS is unchanged
  band_meaning: blast-radius
  origin: operator-session#preflight-efficiency-2026-11-09
  plan_refs:
    - W1-T10739
    - W1-T10507
  files:
    - src/lib/dependency-seeds.ts
