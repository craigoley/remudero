  design: |
    Operator rulings: no hard thresholds (no fixed wait, age or count), lean into automation.
    1. A PENDING CHILD IS VISIBLE. `spawnRunChild` reports the run as pending (a new `onPending({ runId, abort })`
       port, threaded by `runInChildWhenOn` to a new `runOptions.onChildPending`) once its engine is chosen and it
       enters the reservation, and ledgers `run_child.admission_waiting` once (task, run id, queue length). The run
       directory is created only after the reservation is held, so a waiting run leaves no spec-less directory for
       `namedByLiveRuns` to read as undecidable.
    2. A PENDING CHILD NEVER HOLDS THE RESTART. In runDaemon, a run that is pending or a child is out-of-process:
       `latchRestart` makes it no holdout, `onStarted` does not count it as `admittedUnderLatch` in-process work, and
       `reportRestartWait` lists it as `pending_children`, not under in_process_work. A pending run admitted before the
       restart fires becomes a child through `onChild` as today (adoptable).
    3. THE RESTART ABANDONS A PENDING CHILD, NEVER RUNS IT IN-PROCESS. When the restart fires, each pending run is
       aborted through W1-T9969's `AdmissionRequest.signal`. `spawnRunChild` returns a distinct abandoned launch
       (it took no claim and wrote no spec), ledgers `run_child.spawn_abandoned` with waited_ms, and `runOne` does not
       fall back to `runTaskFn`; the lane ends lane-local (the existing `TaskAdmissionError` path), so refill is not
       closed. The next daemon's spawn for that task passes the carried wait as W1-T9969's `sinceMs`, so a restart
       never sends a queued run to the back of the queue.
    4. A CHILD THAT FALLS BACK IN-PROCESS UNDER THE LATCH IS JUDGED AS IN-PROCESS. A refill admitted as
       `runs_as_child` whose spawn returns `started: false` (no engine, spawn failure) is judged at that moment by the
       predicate it skipped (W1-T9924's `restartAdmission("dispatch-refill")`, W1-T9069's R while a holdout waits).
       Refused, it does not start in-process: the lane ends lane-local and parks on the latch path with
       `daemon.admission_held` naming the fallback reason.
    5. Unchanged: work already running in-process, W1-T5721's fix-worker protection, the drain and its bound, and
       admission order inside `awaitMemoryAdmission`.
    6. Tests (new file, titles verbatim as in the proofs; drive runDaemon with an injected runOne that calls
       `onChildPending` and resolves only when aborted, `adoptRunChildren`, restart-history lines and a fake clock as
       W1-T9924's suite does, and drive spawnRunChild with an injected `reserve` that waits on its signal):
       - a latch with only a pending child in flight restarts without waiting on it, and the run is abandoned, not run
         in-process. At origin/main the run is a holdout and the restart waits for it;
       - a pending child admitted before the restart fires becomes an adoptable child (positive control);
       - while the reservation waits, no run directory exists; once it is held, the spec is written;
       - a `runs_as_child` refill whose spawn falls back while the latch holds is refused when its class median exceeds
         the drain's time left, and still runs when it fits.
