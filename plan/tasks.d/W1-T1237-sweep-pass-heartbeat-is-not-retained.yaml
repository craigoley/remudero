  note: |
    RULE 19 / #588 MERITS TEST — ANSWERED YES, RATIONALE IN ONE LINE: the derived-from-consumers
    lock is a SINGLE cross-file invariant over src/lib/ledger.ts and
    test/ledger-render-retention.test.ts that is unsatisfiable piecewise (widen the derivation
    without registering => that one test fails; register without widening => the membership is
    underived, the hardcoded-second-list failure the lock exists to refuse), so this piece is raised
    to risk:high rather than split further.

    IT IS THE MIDDLE OF THE SPINE. W1-T1236 (the reader, and the `SWEEP_LIVENESS_STEPS` marker this
    derivation keys off) must merge first — the lock retains what a consumer demonstrably reads, so
    the registration is underivable before the reader exists. W1-T1238 (the producer's stale note)
    follows this one because the note must name a registration that has actually landed. Same
    `origin: feedback#fb-1785937739950-070a87` as both siblings.

    files: TWO PATHS, and doctor.ts is deliberately NOT among them. The widened derivation and the
    window assertion both READ doctor.ts (source scan and one imported constant) and modify nothing
    in it, so the scope guard stays satisfied and the arm's own suite is not disturbed.

    THE GREP PROOF IS QUOTED AND ESCAPED ON PURPOSE: `"sweep\.pass"` demands the STRING LITERAL, so
    a mere prose mention in one of ledger.ts's long comment blocks (there are several) cannot
    satisfy it, and the `\.` keeps the executor's regex from widening the dot.

    verify:auto — rotation is exercised through the real `rotateLedger` against a tmpdir fixture the
    file already builds, and the derivation lock is a source scan. No live fleet, no network.

    budget_usd 20.00 — two Set entries, one widened derivation, three fixtures. The cost is the
    reconciliation in design (4), not the edit.
