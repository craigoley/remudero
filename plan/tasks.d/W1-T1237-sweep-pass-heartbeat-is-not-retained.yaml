    - claim: "sweep.summary is retained on the same terms, so the paired derivation can read both halves"
      proof: "unit test: W1-T1237: sweep.summary is retained beside sweep.pass"
    - claim: "the render retention window is at least the sweep-liveness bound it must feed"
      proof: "unit test: W1-T1237: the render window is at least the sweep-liveness bound"
    - claim: "neither step is added to the never-rotated decision core"
      proof: "unit test: W1-T1237: the decision core is unchanged by this registration"
