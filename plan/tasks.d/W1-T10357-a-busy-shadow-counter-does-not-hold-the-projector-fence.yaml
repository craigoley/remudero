  rationale: |
    Rule 19 / #588: exercise the default fileShadowStore and real independent SQLite writers,
    not a fake save error. Signed-in selected-repository Inbox refresh on October21 withheld
    replies after a core projector BEGIN IMMEDIATE lock failure. Existing W1-T9501/#12817,
