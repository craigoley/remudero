    a waiting ensureLease, but do not prove a continuous lock, exclusive blocker or every cause.
    A private independent-process two-WAL-database reproduction over unchanged current source
    passed three controls: an auxiliary lock alone leaves the projector writable; actual
    fileShadowStore.save waiting on that lock holds the projector fence; releasing the auxiliary
    writer restores progress and exact key persistence. Lost home lease refuses without changing
    counters. This proves the structural mechanism, not a claim that all Azure pressure or every
    historical Inbox failure has the same cause. Open-head subject sweeps found no competing
    implementation. The operator explicitly approved the counter-only fail-fast policy.
    SQLite documents busy waits as connection-specific and timeout zero as disabling that wait.
    One auxiliary evidence write must not spend its busy wait holding the core write fence.
  design: |
    Writable shadow-counter connections alone must use no SQLite busy wait from connection
    initialization onward, including WAL/schema opening and later writes on a reused connection.
    Preserve the existing 5000ms busy backstop on every ordinary read-model connection and on
    read-only shadow-counter queries. Do not expose a new setting or generic configurable timeout.
    Retain the home withWriteTransaction lease fence before creating, migrating or writing any
    auxiliary file. Never reverse cross-database lock acquisition or write after lease loss.
    Preserve WAL and synchronous=FULL durability, counter/key atomic commits, future/foreign/
    corrupt-store refusal, rollback/close cleanup and exact historical key membership.
    A busy auxiliary database must throw the original refusal, not report a successful save.
    Keep existing view.shadow_failed handling and persistenceFailed readiness withholding.
    A later existing normal comparison must reconcile exact missed append or real-diff reset
    before readiness resumes. No automatic retries, dropped keys, successful partial evidence,
    threshold changes, new scheduler, sampler or relaxation of generation/parity requirements.
    Extend only the existing incremental persistence suite. Use real private WAL databases and
    an independent fixture process that explicitly owns the auxiliary BEGIN IMMEDIATE until
    released by test IPC. Test both the first persistent writer open and an already warmed
    connection. Prove refusal while the auxiliary holder is still active, unchanged committed
    evidence and actual projector write progress. Reconcile append and reset on a later normal
    comparison after releasing that fixture writer. Include ordinary fast-save, lost-lease,
    no-file-creation, read-only/core timeout, FULL durability and corruption/schema controls.
    Close fixture servers/processes/databases and flush transaction observers before removing
    their private directories; never delete live or unknown diagnostic sidecars.
    Record the actual operator decision through native release/ruling, not a model verdict.
    Preserve normal committed-tree author validation, instrumented same-tree diff coverage,
    literal stored-body proofs, native review and hosted/security checks. CI infrastructure and
    Azure memory remain other chats' work. No model/provider call, permission, billing, budget,
    service setting, live claim recovery, restart or deployment is included.
