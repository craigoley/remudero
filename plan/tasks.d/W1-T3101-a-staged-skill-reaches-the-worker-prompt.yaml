    - claim: "selection is ledgered in the shape of learnings.injected, so the retro can ask whether a staged skill was used"
      proof: "unit test: test/a-staged-skill-reaches-the-worker-prompt.test.ts"
    - claim: "spawnWorker still passes settingSources: [], so the isolation the deny-floor and the operator guide rely on is untouched"
      proof: "unit test: test/a-staged-skill-reaches-the-worker-prompt.test.ts"
  falsifier: |
    CLOSE IF a production caller already exists: `grep -rn "stageSkillDraft" src/ test/` and read
    every hit. MEASURED 2026-09-08 at a0b6ba81e: the only references outside the module are in
    test/skill-workshop.test.ts.
    CLOSE ALSO IF a worker can already read a skill by some other route — read `spawnWorker`'s
    `settingSources` argument (src/lib/worker.ts:1136) before concluding it cannot.
    PROVE IT LOAD-BEARING: with the CONTEXT part removed, the prompt probe must lose the skill while
    the staging probe still passes, so the suite separates "it was staged" from "it arrived" — the
    exact distinction this whole task is about, and the one a staging-only test cannot make.
    DO NOT satisfy this by widening `settingSources`. Three sites in this tree state that isolation
    as load-bearing; overturning it from inside a delivery task is the shape this repo refuses.
