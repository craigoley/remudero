  rationale: |
    OBSERVED at a0b6ba81e.

    THE PRODUCER IS UNCALLED. `grep -rn "stageSkillDraft" src/ test/` returns hits only in
    `src/lib/skill-workshop.ts` itself and in `test/skill-workshop.test.ts` (:17, :167, :172, :184).
    There is no production caller. The module is well tested — the suite drives staging, the
    single-proposal shape, and the no-re-stage property — and none of that is at issue: what is
    absent is the CALL.

    THE OBVIOUS ROUTE IS CLOSED, AND CORRECTLY SO. A skill could in principle reach a worker through
    `~/.claude`, and it cannot: `spawnWorker` passes `settingSources: []`. That is stated in three
    places in this tree — src/lib/worker.ts:201 ("`spawnWorker` always passes `settingSources: []`.
    So it reads `false` on every call today"), src/lib/worker.ts:1136, and src/lib/compaction.ts:238
    ("A rule only humans read cannot bind the lane"). docs/operator-guide.md:60 makes the operational
    consequence explicit for a sibling rung: "A remedy names `learnings/*.yaml`, never `CLAUDE.md`,
    because `spawnWorker` passes `settingSources: []` and no dispatched worker reads it."

    SO WIDENING `settingSources` IS NOT THE FIX AND THIS TASK DOES NOT PROPOSE IT. That isolation is
    load-bearing: `hooks/deny-floor.sh` describes itself as "a tripwire, NOT a sandbox — the OS
    sandbox (§4A) is the real boundary", and the worker's settings isolation is part of what that
    boundary is worth. A skill must arrive the way knowledge already arrives.

    KNOWLEDGE ALREADY HAS A ROUTE, AND IT IS THE PROMPT. `implementPromptParts` (src/run-task.ts:12304)
    is the ONE derivation of the `# CONTEXT` + `# TASK` blocks, shared with the W1-T2297
    `prompt.manifest` call site so "what the manifest fingerprints" cannot drift from "what the
    worker received". `matchedLearnings` is already a parameter of it, and injection is already
    ledgered — `log("learnings.injected", {...})` at src/run-task.ts:13766, with the retro reading
    those rows' `matched_ids` (src/lib/retro.ts:3128). W1-T2761 added a policy-gated headline part
    to the same array, so the shape for adding one more part under a flag is established.
  design: |
    (i) `retroCommand` (src/run-task.ts:23245) CALLS `stageSkillDraft` ON RATIFIED DRAFTS. The retro
    is where drafts are produced and judged; staging there gives the producer the caller it lacks
    without inventing a new rung.
    (ii) `renderImplementPrompt`'s CONTEXT GAINS A SKILLS PART, added to `implementPromptParts`'s
    array so the manifest fingerprints it automatically — never assembled separately, which is the
    exact drift that array exists to prevent.
    (iii) SELECTED BY TASK CLASS, and UNDER THE EXISTING BYTE BUDGET. `DEFAULT_KNOWLEDGE_BUDGET_CHARS
    = 8148` (src/lib/learnings.ts:41) already bounds injected knowledge; the skills part spends from
    that same budget rather than adding a second one, so the worst case is unchanged and no task
    needs to re-measure a prompt ceiling.
    (iv) LEDGERED LIKE LEARNINGS: one row in the shape of `learnings.injected` (:13766), naming what
    was selected, so the retro can ask whether a staged skill was ever actually used — the question
    that is unanswerable today because nothing is ever selected.
    (v) `settingSources` IS NOT TOUCHED. A builder who finds the prompt route insufficient files a
    companion task arguing the isolation change on its own terms; it does not ride in here.
  acceptance:
