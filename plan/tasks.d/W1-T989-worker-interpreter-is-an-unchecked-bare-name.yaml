  note: |
    verify:auto — every branch is a resolution, a refusal or a rendered string over injected inputs,
    assertable with a doctored PATH and a real temp directory. Nothing here needs a live service or
    an operator ruling: the one QUESTION the feedback asked that a human must answer (which node the
    host should install) is design (vii)'s first exclusion, and it needs no code either way.
    risk:high is Rule 19's SPAN plus a genuinely live surface — `subsystemsOf` reads `files:` plus
    acceptance text, this set crosses `src/lib` and `test/`, and the surface is on the path of EVERY
    worker spawn on every host running a daemon. A resolver that wrongly rejects a good interpreter
    grounds the whole fleet, which is the same argument W1-T901 made about `resolveClaudeExecutable`
    one module over. The change itself is one resolver, one refusal and one render.
    `src/run-task.ts` IS DELIBERATELY NOT DECLARED. The refusal reuses the existing
    `blocked_toolchain` class, which `daemon.ts` and `ledger.ts` already route, so no call site there
    needs to change — and declaring that file serialises this task behind every other one naming it
    (`partitionByFileOverlap`, W1-T471; the cost W1-T924's note spells out). If design (iv)'s
    evidence record turns out to need a new ledger rung in `run-task.ts`, that is a scope-guard flag
    and a re-file, not a quiet widening: `scopeViolationFiles` fails an undeclared path.
    `test/worker.test.ts` IS DELIBERATELY NOT DECLARED and was checked: it seeds its own
    `locations:` table for the CLI resolver and asserts nothing about the interpreter or about
    `describeSpawnTarget`'s field set. If the implementation finds it goes red,
    `inverseScopeUntouchedFiles`/`scopeViolationFiles` will say so — re-file rather than edit it
    undeclared. (`test/spawn-nopid-diagnosis.test.ts` is the other candidate and was checked the same
    way; if design (iii) moves its assertions, declare it in the re-file.)
    THE FALSIFIER MUST DRIVE A REAL PATH LOOKUP, not a stubbed resolver: a temp directory holding a
    real executable file, a PATH pointing at it, and a second case where the directory is removed
    between resolution and spawn. A test that stubs "the interpreter is missing" cannot tell the fix
    from the defect — the whole defect is that the lookup never happens.
    NOTHING IN THE RATIONALE SHOULD BE QUOTED FORWARD AS CURRENT FACT: the SDK line, the allowlist,
    the shim, the two `unresolved` guards and `DEFAULT_LAUNCHD_PATH` were read in this working tree
    at triage, and the pid, run id and nvm path are the FEEDBACK's observations of 2026-08-03.
    Re-derive per design (vi).
    LATENT, NOT LIVE, AND THE FILING SAYS SO: the originating observation is probably a start-method
    artifact (see the rationale's falsifier paragraph). Filed anyway because the structure that let
    an unchosen interpreter run the fleet is real, unguarded, and invisible from inside the repo.
