- id: W1-T10728
  title: "THE RETRO CAN FAIL EVERY TIME IT FIRES AND NOTHING SAYS SO — the gardener overseer reads no retro outcome row and W1-T9119 names only a persisting DEFERRAL; read `retro.error` and `retro_aborted_integrity` as the retro's failures and `retro.synthesized`/`retro.no_op` as its passes through the overseer's NOTICE/HEAL/ESCALATE ladder, failures only, so a quiet retro is never judged"
