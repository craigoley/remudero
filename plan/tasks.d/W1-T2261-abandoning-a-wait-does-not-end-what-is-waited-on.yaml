    - claim: "an abandonment whose markers match invokes the injected teardown seam exactly once for that candidate"
      proof: "unit test: test/abandon-reclaims-the-worker.test.ts"
    - claim: "a reclaim that matches no candidate records that outcome distinctly from one that invoked the teardown"
      proof: "unit test: test/abandon-reclaims-the-worker.test.ts"
    - claim: "the wall-clock bound keeps its committed value, and a spawn that has not exceeded it never reaches the teardown seam"
      proof: "unit test: test/abandon-reclaims-the-worker.test.ts"
    - claim: "a teardown seam that throws leaves the rung's verdict unchanged rather than propagating into it"
      proof: "unit test: test/abandon-reclaims-the-worker.test.ts"
