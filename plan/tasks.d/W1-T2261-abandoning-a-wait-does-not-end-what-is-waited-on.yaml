  note: |
    **`files:` IS DRAWN AGAINST THE DEFECT.** The marker must be set where the spawn is constructed
    (`src/run-task.ts`) and is read by the primitives in `src/lib/worker-containment.ts`; a fix that
    touched only the first would leave the read side unproven, and one that touched only the second
    would fix nothing. The declaration is a bare single-line list so `SHARD_FILES_LINE_RE` matches and
    the forward-reference exemption applies — a block-style list silently forfeits it.

    **THE PROOF PATH DOES NOT EXIST, AND THE FALSIFIER FOR THAT MUST DISCRIMINATE.**
    `test/abandon-reclaims-the-worker.test.ts` is absent from the tree. A NON-EXISTENT control path
    reads `hits: 0` and `verdict: fail` exactly as the declared target does, so it proves nothing; the
    discriminating control is an EXISTING path, which resolves to real tests while the declared one
    cannot.

    **WHAT THIS TASK DOES NOT OWN.** The bound's VALUE is W1-T1219's (one policy row derived from
    sweep-tick durations and applied to a fix spawn) and is not re-litigated here. The
    restart-strands-the-lock failure is W1-T1067's and was explicitly ruled out by the capture: the
    lock held the live daemon's own inner pid. The liveness ROW is W1-T1274's and works; what is
    missing is a consumer that escalates on it, which this shard records under Q2 rather than
    re-filing.

    **RISK BAND — BOTH READINGS.** SPAN: `files:` crosses `src/` and `test/` and names two source
    files, so Rule 19's span reading is `high`. The band EXEMPTS the sizing check rather than clearing
    it — `sizingViolation` returns `undefined` outright at `high` — so a clean lint is not evidence
    the span was vetted. BLAST RADIUS: narrow on the marker itself (two fields on one object literal),
    wider on the reclaim's reporting, because a no-match log turns a currently-silent path into one
    that speaks on every abandonment.

    **THE FALSIFIER.** Falsified if an abandoned spawn's process still survives after the markers are
    set — that would mean the match is not the only thing blocking the kill. Also falsified if a
    worker still producing output is killed, if the bound's value moves, or if a reclaim failure
    begins throwing into the rung instead of degrading.

    **MEASUREMENT PROVENANCE.** Host `vm`, `/usr/bin/bash`, uid 0. Scratch worktree at a fresh path,
    `HEAD == origin/main` proven by sha, `--is-shallow-repository` false (2188 commits) checked before
    any history query, removed after. `src/run-task.ts` is 1,542,304 bytes — over the Contents API's
    1 MB cap, where it returns an empty body that greps to a clean zero — so every figure came from
    the sha-proven worktree. Fetched `refs/rmd-id/*` verified 380 local against 380 remote BEFORE
    sweeping. Source lines were read BY LINE NUMBER, not from grep output. **THE `ps` CLAIM WAS
    MEASURED RATHER THAN RECALLED**: an earlier session note that `ps` could not read a process
    environment did NOT hold here and was discarded rather than carried.

    **ID PROVENANCE — UNUSED, NOT OWNED.** The reservation ref exists against a namespace of 380; its
    anchor was deliberately NOT checked. Eight surfaces verified UNUSED, each control pre-qualified on
    its own surface, and **ONE SURFACE RE-QUALIFIED TWICE**: the open-PR-title control `W1-T` read 0
    across three open PRs, a second attempt on `fix(` also read 0, and it was finally qualified on
    `refactor(` = 2 — reporting the target's zero under either failed control would have been
    unsupported. THE SUBJECT WAS SWEPT: no shard names `fixArgs` or `workerMarkerEnv`, against a
    control of one shard naming `spawnFixWorkerBounded` (W1-T1219, about the bound's value); the two
    shards matching `reclaim.*silent` were opened and are W1-T1067 and W1-T396, neither this.
