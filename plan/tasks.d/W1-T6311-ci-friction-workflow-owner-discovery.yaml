    the existing no-owner fixture remains held; clear every origin instead: exhausted and
    operator-held controls reopen. Replay the same witness or unrelated main changes and
    require zero second revalidation. Delete each fix and record nonzero failures before
    restoring it and obtaining a complete zero-failure test summary.
