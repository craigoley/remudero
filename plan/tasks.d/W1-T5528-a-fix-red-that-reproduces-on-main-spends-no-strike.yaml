    - src/run-task.ts:10279 (W1-T2671 site, inside `runFixRung` at :9614) refreshes the branch only when the
      head is behind and base CHANGED the failing file (`decideRedBaseRefresh`, sweep.ts:3750). A red that
      main carries without having changed that file falls through to a strike.
    REUSABLE PARTS THAT ALREADY EXIST:
