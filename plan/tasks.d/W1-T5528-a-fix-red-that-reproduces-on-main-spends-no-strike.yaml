  rationale: |
    MEASURED on the extracted week ledger (2026-09-26T00Z..2026-10-03T19Z, head 3e026b902):
    - 226 `fix.dispatch` rounds. Main health at dispatch time (the latest `main.health.observed` row):
      undetermined 167, green 36, red 23. Over all 5815 `main.health.observed` rows: undetermined 4217
      (73%), red 1007, green 591. 103 rounds ended `fix.commit_refused`, and 78 of those ran while main
      read undetermined.
    - `sweep.base_red.stood_down` fired 2 times and `sweep.base_red.refresh` 2 times in the window.
    - 134 ci-log rounds carried failures, and 77 of them named a test file as their `ci_failures[].signature`.
      41 of those 77 were refused. The same census files recur across unrelated PRs within hours, for example
      test/the-census-roster-is-named-not-numbered.test.ts (5 tasks), test/source-size-baseline-is-enforced.test.ts
