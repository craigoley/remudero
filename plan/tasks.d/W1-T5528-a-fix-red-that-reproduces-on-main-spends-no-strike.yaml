  design: |
    1. NEW src/lib/base-reproduction.ts (pure):
       - `baseReproductionFiles(failures)`: `failingTestFilesFromCiFailures` (sweep.ts:3721) normalised to
         repo-relative `test/...` paths, deduped. An empty result means no test evidence, and the PR falls
         through to today's path unchanged.
       - `decideBaseReproduction(files, outcomes)` takes per-file outcomes `fails | passes | absent | unrunnable`
         at a given main sha. The verdict is `reproduced` when every file is `fails`; `partial` when some fail
         and others pass or are absent; `clear` when none fail; `unrunnable` when any probe could not reach a
         verdict and none failed. `absent` means the file does not exist at main (the PR added it), and it
         counts as the PR's own, never as base. Only `reproduced` stands down. Every other verdict falls
         through to today's dispatch, so an unreadable probe never blocks a fix.
       - `probeCacheFromLedger(lines)`: per-(main_sha, file) outcomes read back from earlier
         `sweep.base_reproduction` rows, so one main tip runs each file at most once across every PR and pass.
       - `strikesToRefund(lines, taskId, headSha, reproducedChecks)`: the `fix.dispatch` rows on this
         (task, head) whose `ci_failures[].check` are all among the checks whose test files reproduced.
    2. src/lib/sweep.ts: in the blocked-fixable arm, after the cancelled-check stand-down (:11651) and before
       the stale-proof and terminal checks (:11662), when `ciFailuresForFix` names test files, call a new
       optional `SweepDeps.reproduceFailingTestsOnMain(pr, files, mainTipSha)`. The trigger is independent of
       `main.health.observed`, so it fires with main `undetermined`. Each call appends
       `sweep.base_reproduction` {pr_number, head_sha, main_sha, files:[{file, outcome, duration_ms, cached}],
       verdict}.
       On `reproduced`: `acted = false`, the stand-down reason names the files and main sha, no claim is taken
       and no strike is spent. The PR is re-probed when main's tip moves. When a head that stood down as
       `reproduced` reads `clear` at a newer tip, the arm spends that head's one branch refresh through the
       existing `deps.updateBranch` and `BASE_RED_REFRESH_STEP` row (sweep.ts:6102) instead of dispatching,
       because the head still carries the old base.
    3. Refund: on `reproduced`, append one `fix.strike_refunded` {task_id, pr_number, head_sha, strike,
       main_sha, reason: "base-red-reproduced", test_files} per row from `strikesToRefund`.
       `fixLedgerRowsForHead` (sweep.ts:9807) skips a `fix.dispatch` row matched by a refund on the same
       (task, head, strike). `priorStrikesFor` and `deriveStrikeHistory` both read through it, so the cap and
       the clarification history agree. The refund is ledgered and never edits a past row.
    4. src/run-task.ts: wire the production `reproduceFailingTestsOnMain`. It runs
       `git worktree add --detach <worktreesDir>/base-repro-<sha12> <origin/main sha>` (worker.ts:3936, never
       /tmp) and `linkWorktreeNodeModules` (worker.ts:4118, a symlink with no npm ci). Each file runs through
       `execWhitelistedProofAsync` with `unit test: <file>` and the policy `proofTimeoutMs`. All of it is
       async and nothing runs synchronously on the daemon loop. One probe worktree is in flight per host
       (a promise chain), and it is removed in `finally`. A worktree-add failure returns `unrunnable` for
       every file.
    5. W1-T5490 owns the name match and main-health fallback. This task owns running the files. Together a
       base red is caught by name when main's run speaks to it and by execution when it does not.
