      (4 PRs during the 10-03 plan-load outage). The ledger alone cannot say which of these were base reds.
      That gap is what this task closes: today no code path runs the file on main to find out.
    WHERE THE DECISION IS MADE TODAY:
    - src/lib/sweep.ts:6126 `decideBaseRed` returns `wait` only when a PR failure's check NAME is in
      `main.failingChecks` and main reads `red`. With main `undetermined` it always returns `own`.
