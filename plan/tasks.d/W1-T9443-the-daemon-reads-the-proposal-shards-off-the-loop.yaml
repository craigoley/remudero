  design: |
    No time window and no cap. Every shard stays in the population every pass.
    1. ONE SHARD MEMO PER DAEMON START. src/lib/inbox.ts gains a proposal-shard reader that keeps, per shard file, the
       digest (inode, size, mtime in ns from a bigint stat) and the parsed proposal. `refresh()` is async. It lists the
       directory with fs.promises, stats each entry, and re-reads and re-parses only files whose digest changed or
       are new. It drops files that are gone. The duplicate-id refusal and the "no valid id" refusal are those of
       `readProposalShards`, unchanged. An unreadable directory is still a throw, never an empty population. The
       writes go through temp plus rename, so a rewritten shard always has a new inode and an unchanged one keeps its
       digest.
    2. THE DRAFT RUNG READS THROUGH IT. `buildInboxDraftHook` holds one reader, built once per daemon start like
       W1-T9390's. The orphan prune gets an async form that awaits `refresh()` and the blob and drafts reads
       (fs.promises) before it takes the registry lock. Under the lock it re-checks only the digests (async stat) and
       re-reads the files that moved. The drafts rewrite uses `writeAtomicAsync`. The sync `pruneOrphanedDrafts` stays
       for CLI callers, which are separate processes.
    3. A WRITE TOUCHES ONLY WHAT CHANGED. In `updateProposalRegistry`'s write half, a proposal that already has a shard
       is rewritten only when its serialized form differs from the shard's current content. A new proposal is written
       and a dispositioned one is unlinked, as today. The blob write is unchanged. After this, one update moves one
       digest, not 1,357.
    4. TELEMETRY. `proposal_shards.refreshed` {files, read, unchanged, removed, ms} once per refresh. It is what a
       re-measure reads to confirm the incremental path holds.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Inject the reader's fs seam: a
    deferred readFile, read counts, a fake stat.
