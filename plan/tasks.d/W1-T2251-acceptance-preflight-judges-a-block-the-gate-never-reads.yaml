  note: |
    THE GATE STAYS AUTHORITATIVE AND STILL FAILS CLOSED ON NOTHING TO JUDGE. Nothing here touches
    `judgeReview`, the `noCriteria` arm, or the resolution order at `src/run-task.ts:10740`. The
    reviewer keeps preferring the trailer's shard and keeps falling back to the body only at zero,
    and a PR with no criteria from either source keeps failing — "nothing to judge is never a pass"
    is not weakened by a word.

    THE REMEDY IS AGREEMENT, NEVER RELAXATION. The preflight is what moves, and it moves TOWARD the
    gate. No assertion is loosened on either side, and no body that fails today starts passing
    because of this task.

    AND NOTHING MAKES THE PREFLIGHT BLOCKING. It is not wired into CI, not made a required check,
    and not consulted by dispatch. An advisory that is wrong in both directions earns correction or
    retirement, not promotion — promoting it would convert a false alarm into a blocked PR, which is
    the opposite of the finding.

    W1-T1097 IS CITED AND NOT RE-FILED: it owns the OTHER direction, where the verb reports OK on a
    body it resolved zero criteria from. This task must not change `defective`'s
    `criteriaParsed`-against-`bulletsWritten` comparison, so the two can land independently and in
    either order.

