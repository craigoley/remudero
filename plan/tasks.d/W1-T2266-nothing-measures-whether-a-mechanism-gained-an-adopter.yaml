- id: W1-T2266
  title: "Nothing measures whether a shipped mechanism ever gained an adopter, so the gap is found by accident: four distinct shapes (symbol with no caller, field with no writer, script with no invoker, gate with no subject) and the only existing scan answers one of them, diff-scoped, so it never sees the backlog"
