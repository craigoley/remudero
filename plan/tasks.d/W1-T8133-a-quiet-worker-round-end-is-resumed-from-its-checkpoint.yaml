      proof: 'grep: test("W1-T8133: a mid-session quiet handoff is resumable on the next tick" in test/a-quiet-worker-round-end-is-resumed-from-its-checkpoint.test.ts'
  falsifier: |
    Leave the receipt predicate as it is on main: the first test reads no receipt for the quiet verdict, and the
    second sees the earlier receipt deleted. Skip the delete after a quiet receipt: the third test's later merged
    verdict leaves a stale receipt alive. Keep the boot-only resumable set: the
    fourth test sees `dispatch.skipped` with reason run-branch-already-pushed for the task.
