- id: W1-T8133
  title: "A QUIET-WORKER ROUND END IS RESUMED FROM ITS CHECKPOINT — the W1-T7807 `end_round` verdict pushes a checkpoint and ends `handed_off` with reason quiet_worker_round_ended, but pendingWorkerBoundaryHandoffs counts only freshness_yield verdicts and `run.freshness_handoff` rows as receipts, so the quiet verdict ERASES the task's receipt and the next run starts over"
  repo: remudero
  depends_on: [W1-T7806]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — a checkpoint pushed by a quiet-worker round end is restored by the next run
  band_meaning: span
  origin: "operator approval 2026-10-11: follow-ups from the recycle-stall fix (hand PR #10925)"
  plan_refs: [W1-T7807, W1-T7697, W1-T7747, W1-T7806, W1-T8008, W1-T4662]
  files: [src/lib/daemon.ts, test/a-quiet-worker-round-end-is-resumed-from-its-checkpoint.test.ts]
