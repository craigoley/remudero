  falsifier: |
    THE LAW 5 ARM IS THE ONE THAT MATTERS, AND IT MUST FAIL CLOSED. Construct a marked shard at
    `verify: auto` and assert the linter BLOCKS it. Then construct the same shard at
    `verify: human` and assert it passes. A change that lets a marked shard dispatch has recreated
    the laundering shape with extra steps.

    AND PROVE THE MARK IS LOAD-BEARING, NOT DECORATIVE: an UNMARKED shard at `verify: auto` must
    still pass, or the arm is refusing every task in the plan and its green is meaningless.

    THE CEILING NEEDS A BACKLOG CASE. Supply more findings than the ceiling and assert the excess is
    NAMED in the result, not silently dropped — the adoption rung's `excludedMechanisms` shape.

    IDEMPOTENCY IS FALSIFIED BY RUNNING TWICE. Two fires over an unchanged corpus must file on the
    first and nothing on the second.

    DO NOT RESOLVE ANY OF THIS BY WIDENING WHAT THE RUNG MAY WRITE. If the parked shard proves
    awkward in practice, that is an operator decision to re-take, not a licence for the rung to edit
    guidance directly.
