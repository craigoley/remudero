  rationale: |
    THE OPERATOR ASKED FOR A DAILY LOOP THAT FILES ITS OWN FINDINGS. Both halves are open, and the
    second is the one with a law attached.

    THE PACING HALF IS SMALL. `decideMeasurementCadence` (`src/lib/measurement-cadence.ts`) is a
    shared two-bound decision function, and the established convention is that each rung gets its
    OWN policy row and its OWN marker file so cadences never drag one another — `digestCadence`'s
    comment says exactly that about not folding into `measurementCadence`. A daily rung is one row
    plus one marker, not new infrastructure.

    THE FILING HALF IS WHERE THE LAW IS. `rule-efficacy.ts` states that auto-filing a task from a
    metric "would be the laundering shape Law 5 forbids", and the same posture is pinned across the
    tree: the daemon rung "NEVER files a task or mints an id (Law 5)"; the policy doc says
    "promote-to-instrument proposal, never a filed task — Law 5"; the digest "files nothing, mints
    nothing".

    BUT LAW 5 IS NARROWER THAN THAT SHORTHAND, AND READING IT SETTLES THE DESIGN. Its text
    (`docs/research/research-laws-and-gaps-2026-08-05.md`, Part 1) is "RECORDS LAUNDER AUTHORITY
    UNLESS THE AUTHOR CLASS RIDES THE RECORD — unmarked records read as ratified; origin tags carry
    commission, not intent". The prohibition is on an UNMARKED record, not on filing. Its own
    prediction names the failure mode: "any new record channel added without a mandatory
    author-class mark will, within weeks, carry a machine conclusion a later reader treats as an
    operator ruling."

    AND THIS REPO ALREADY HAS THE COMPLIANT SHAPE, BUILT FOR EXACTLY THIS. `rulingVerifyViolation`
    (`src/lib/task-linter.ts`, W1-T326/W1-T353) refuses a ruling-shaped task at `verify: auto` and
    says why in its own comment: "isDispatchEligible already refuses any task whose `verify !==
    "auto"`, so a ruling-shaped task at verify:human simply PARKS until the operator looks." A
    machine-authored shard that is MARKED and PARKS is not laundering: it cannot present itself as
    ratified and it cannot dispatch itself. The operator's approval becomes one flip rather than
    authoring a shard from scratch.

    THE DECLARED SURFACE OVERLAPS TWO LIVE SHARDS, AND THIS IS THE RULING RATHER THAN A NARROWED
    `files:`. `lint-plan`'s duplicate-surface arm names W1-T20c and W1-T120, both sharing
    `src/lib/task-linter.ts` + `src/run-task.ts`. Neither is superseded and neither supersedes this.
    W1-T20c is the linter's ORIGINAL deterministic-guard build (§5C Layer A) — the framework this
    task adds one arm to, not a competing edit of the same arm. W1-T120 is about a gate PROVING it
    read the file under test, a claim over how any arm reports its evidence, orthogonal to which
    arms exist. This task adds exactly one new refusal (a marked shard may not sit at
    `verify: auto`) plus a cadence row and its wiring. The overlap is the legitimate
    wiring-task/module shape the arm's own message names, so it is ruled on here and left visible
    rather than hidden by trimming the declaration.

    WHAT THE LOOP IS ACTUALLY FOR, AND WHY THE TARGET IS NOT ZERO RED. A first-time red is how a
    convention gets discovered — W1-T2595 measured seven causes in one evening that no author could
    have known. The tractable target is zero REPEAT failures, which is what `ruleEfficacyReport`
    already computes. A rung that chased zero red would be chasing the signal that teaches.
  design: |
    (i) ONE ROW, ONE MARKER, THE SHARED DECISION FUNCTION. Add a cadence row beside
    `measurementCadence`/`digestCadence`/the adoption row, with its own marker path, and call
    `decideMeasurementCadence` — never a second decision function, and never folded into an
    existing row (that comment's stated reason: a short interval on one rung must not drag another).

    (ii) THE MINT CEILING IS A PRIMARY CONTROL, NOT A BACKSTOP. Mirror `ADOPTION_MINT_CEILING`
    verbatim in shape: cap what one fire may file, name every finding the ceiling EXCLUDED rather
    than dropping it, and key idempotency on a deterministic id derived from the failure signature —
    the discipline `adoptionProposalId` already holds, so reruns never duplicate.

    (iii) THE AUTHOR-CLASS MARK IS A FIELD AND A LINT, NOT A CONVENTION. `origin:` is explicitly
    insufficient by Law 5's own words. Add a machine-author mark to the shard schema and a
    task-linter arm that REFUSES a marked shard at `verify: auto` — the same trigger shape
    `rulingVerifyViolation` uses, for the same reason. Prose here would be unenforced, which is the
    thing CLAUDE.md's own header says makes a rule violable "silently and repeatedly".

    (iv) THE FILED SHARD PARKS. `verify: human` is what makes `isDispatchEligible` refuse it. That
    is the whole safety argument: the loop may propose work into the plan, and only the operator can
    release it. Do not add a bypass.

    (v) THE OUTPUT MUST REACH THE LANE THAT OPENS THE PRs. `spawnWorker` passes `settingSources: []`
    (`src/lib/worker.ts`), so a DISPATCHED WORKER NEVER READS CLAUDE.md — measured, not assumed.
    Workers are reached by matched `learnings/*.yaml` entries injected into `renderImplementPrompt`.
    A filed shard whose remedy is "add a CLAUDE.md bullet" would therefore improve interactive
    sessions and change nothing about the fleet's own pull requests; the shard this rung files must
    name the surface that reaches the lane the failure came from.

    (vi) THE FILING PR MUST NOT CARRY A `Remudero-Task:` TRAILER, AND THIS WAS HIT WHILE FILING THIS
    ARC. W1-T413: "a MERGED PLAN-ONLY PR carrying a `Remudero-Task:` trailer is credited by
    `deriveStatus` as that task's implementation, so the task reads merged forever and can never be
    dispatched again." A rung that opens a filing pull request and copies the trailer convention
    visible on merged filing PRs (#3617, #3748 both carry one) would credit every shard it files as
    already built, and the fleet would never build any of them — the rung would silently defeat
    itself while every gate stayed green. `acceptance-author-gate` accepts a bare `## Acceptance`
    header OR a trailer, so the header alone is sufficient and is the form to emit.

    ⚠ CORRECTED 2026-09-06, SAME DAY, BY RUNNING THE SHIPPED PREDICATE. The paragraph that stood
    here reported "33 tasks read merged while never having been built, 33 of 33 invisible to
    dispatch, 24 credited by their own filing". THAT MEASUREMENT WAS WRONG and the error is worth
    more than the number was: it modelled merge credit as the UNION of the trailer and the run-branch
    head ref — the two paths CLAUDE.md names for BUILDING a merged set — and omitted the two
    plan-only REFUSALS `deriveStatus` actually applies on top of them.

    BOTH REFUSALS SHIP. `isPlanOnlyFilingPr` (W1-T1004) refuses credit when the crediting run wrote
    its own `pr.opened … plan_only: true` ledger row. And `planOnlyDiffRefusal` (W1-T413, at the
    trailer rung of `derivePrPrecedence`) reads the pull request's CHANGED FILES through the
    gateway's `changedFiles` and refuses a plan-only changeset outright. W1-T413 is not an open
    defect; its fix is live, which also explains why #1602 closed it as already-satisfied.

    MEASURED BY CALLING `deriveStatus` ITSELF, three shapes, one stub gateway and no ledger row so
    only the DIFF refusal could fire:
      - a plan-only filing PR on a NON-run branch  → merged=false, source=none   (REFUSED)
      - a plan-only filing PR on the task's OWN run branch → merged=true, source=trailer
      - an ordinary build PR carrying source        → merged=true, source=trailer

    SO THE RESIDUAL HOLE IS REAL BUT NARROW, AND IT IS THE ONE THIS RUNG MUST AVOID.
    `ownsOwnRunBranch` short-circuits the diff refusal as a stated cost control — "a worker's own
    run-branch PR is an implementation by construction" — so a filing PR that sits on
    `run-<id>-<epoch>` is waved through, and only W1-T1004's LEDGER row can then refuse it. Of the
    33 candidates, 23 were credited by a pull request on the task's own run branch (still creditable,
    subject to that ledger row) and 11 sat on other branches and are refused today. The exact figure
    needs the daemon host's ledger, which the filing environment could not read; 23 is the upper
    bound, not the count.

    WHAT THIS CHANGES FOR THE RUNG, WHICH IS THE POINT OF RECORDING IT: emitting a bare
    `## Acceptance` header with NO trailer is still the correct form, but the reason is narrower than
    first written — the trailer is refused on a non-run branch anyway. The rung must additionally
    NEVER open its filing pull request on a `run-<id>-<epoch>` branch naming the id it is filing,
    because that is precisely the shape the shipped refusals wave through.

    AND THE METHOD LESSON OUTLASTS BOTH NUMBERS. A sweep that reconstructs a system's decision from
    its INPUTS reproduces the modeller's own rule, not the system's. Both wrong readings here came
    from that: first reading trailers out of squashed COMMIT MESSAGES (which drop them) instead of
    pull request bodies, then reconstructing credit without the refusals. The reliable move is to
    call the shipped function — `deriveStatus` — on the shapes in question, which is what finally
    settled it and costs less than either sweep.

    (vii) NOT IN SCOPE: editing `learnings/*.yaml` or CLAUDE.md directly from the rung — the filed,
    parked shard is the output, and that is the whole Law 5 argument; and the corpus and attribution
    stages, which are W1-T2957 and W1-T2958.
