  design: |
    ONE CONCERN: a review failure whose remedy is a named gate failure must reach the worker as that
    remedy. Not the CI arm, not the strike cap, not the disposition.

    (i) THE DEFECT IS THE MODE, NOT THE EMPTINESS — and that is why the remedy is not W1-T1282's.
    Rationale (2) shows the dominant input carries a named remedy; rationale (7) shows the strikes
    are not demonstrably wasted. Standing the rung down would discard a remedy that exists and stop
    dispatches that may be working. The fix is to carry `actionableGateFailures` into the evidence
    and select a mode on it, so the prompt names the remedy the sweep already named.

    (ii) `reviewer-unmet` MUST STOP BEING A CATCH-ALL. `when: () => true` (`run-task.ts:4512-4513`)
    means every unclassified evidence shape lands there and inherits a prompt built from
    `unmetCriteria`. A rule that matches everything cannot be wrong, which is exactly why it hides
    this. Whatever mode is added, the last rule should name what it is for.

    (iii) AND AN UNCLASSIFIABLE FAILURE SHOULD BE NAMED, NOT DEFAULTED. Four of the 22 joined to
    `review failing with no actionable unmet criteria (contradictory) — escalating` — the sweep had
    already decided it was contradictory, and a dispatch happened anyway. That case wants a named
    stand-down (W1-T1282's shape, on this arm) rather than a mode; the two remedies are not
    alternatives and design (i) does not cover it.

    (iv) WHAT MUST NOT CHANGE, PINNED BY CRITERIA. THE STRIKE CAP STAYS AT 2. THE RUNG STILL
    DISPATCHES WHEN THERE ARE UNMET CRITERIA — the 13 non-empty rows are the working path and must
    be byte-identical after this. AND A REVIEW FAILURE WITH NO UNMET CRITERION MUST STILL BLOCK THE
    MERGE: the remedy is a correct mode or a named stand-down, NEVER proceeding as if the review
    passed. A change that turns any of the 22 into a merge is the failure mode this task must not
    ship.

    (v) NOT IN SCOPE, NAMED: the CI arm and its two closed defects (W1-T457, W1-T1282), cited and
    not re-filed; the disposition rule at `sweep.ts:2651`, which is correct and stays; the strike
    cap; and `body-coverage`, which rationale (1) shows never dispatches empty.
