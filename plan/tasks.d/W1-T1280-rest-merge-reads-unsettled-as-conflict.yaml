  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/rest-merge-unsettled-retry.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19 SPAN — the `files:` list is one module and its test.
    The change decides whether the fleet merges a PR after GitHub has refused once, on the path that
    runs when the quota is already exhausted; too loose and it spins a spent budget, too tight and
    this defect survives.

    WHAT WAS RE-DERIVED AND WHAT WAS NOT. Rationale (1)-(3) are read directly from
    `src/run-task.ts` at origin/main and are checkable without the fleet. Rationale (4) states
    plainly that the 18:45 mergeability reading is the OPERATOR's and cannot be re-taken from here,
    because the same head now reads `dirty`; what this shard verified is the review status and its
    timestamp on `a6da30e5`, and the code path. Rationale (5) reports a zero WITH its control and
    WITH the reason the control does not license it.

    ID PROVENANCE. `refs/rmd-id/W1-T1280` resolves to
    521b7d5d3b292f5bf47e7bcdaade7ec74f6723ff, read over git protocol; live negative control,
    `refs/rmd-id/W1-T999999` returns EMPTY output. THE ANCHOR MESSAGE WAS NOT JUDGED. Eight surfaces
    were swept with a control PRE-QUALIFIED FOR EACH and NONE DISQUALIFIED: a declared `- id:` on
    main, a shard FILENAME on main, any occurrence in main's tree, the reservation refs (a reserved
    id reads 1 and a non-reserved id reads 0, so the surface discriminates), a LIVE `run-W1-T*`
    head, main's commit messages, open PR titles-plus-bodies (controlled with an id CURRENTLY open,
    since a merged id has left that surface), and merged PR bodies including the `Remudero-Task:`
    trailer. Subject anchors were counted PER OPEN HEAD against main's own baseline.
