      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
    - claim: "the decision reads the merge facts rather than the wording of the error"
      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
    - claim: "the retry stops at its bound and returns the same outcome it returns today"
      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
    - claim: "a state that settles to mergeable is merged and one that settles to conflicting is not"
      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
    - claim: "the fallback still runs only after arming has been attempted and refused on quota"
      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
    - claim: "no conflict is resolved and no merge happens without a passing verdict"
      proof: "unit test: test/rest-merge-unsettled-retry.test.ts"
