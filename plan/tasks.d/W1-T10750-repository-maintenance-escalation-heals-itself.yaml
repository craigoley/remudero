    - The starvation case keeps `activeLanes` at 1 for every survey with gc.log present. Assert that
      the incremental pass ran and the full gc was admitted within the derived bound.
    - The operator case injects the issue gateway. Assert one open on escalation, no duplicate on a
      second escalation, and a close on recovery.
    Restore base code with `git show origin/main:<path>`, never stash, and watch every case fail.
    Run the suite, `npm run -s lint-plan:fast` and `rmd preflight --fast` on the committed tree
    before the first push.
