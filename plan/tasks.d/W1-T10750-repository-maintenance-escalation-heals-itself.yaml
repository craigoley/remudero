  falsifier: |
    - Restore `if (state.escalated ...) return` at object-reaper.ts:799: the escalated case must fail
      on the runner call.
    - Drop the reclaim call from the live path: the escalated case must fail on the surviving lock.
    - Remove the tmp_pack or ref-lock entries: the leftover case must fail.
    - Make the owner check ignore the live process list: the live-owner half must fail.
    - Pass no `gc.pruneExpire`: the prune-window case must fail.
    - Restore the gc.log `deferred` branch ahead of the incremental branch: the starvation case must
      fail.
    - Skip the issue close on success: the operator case must fail.
    GUARDS that held at base and must still hold:
    - rmd never writes or removes gc.log, and success still needs the marker gone;
    - no raw `git gc`, `git prune` or `--prune=now`;
    - an unreadable survey never authorizes an action;
    - cadence and backoff survive a restart.
    Each guard's existing case in test/repository-maintenance-controller.test.ts must fail when its
    production branch is removed, and pass again with zero failures once it is restored.
