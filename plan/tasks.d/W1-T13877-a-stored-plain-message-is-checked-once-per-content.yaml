  rationale: |
    WHY: the same 61 s serve main-thread profile (OBSERVED 2026-11-19 21:31:57-21:32:58Z, Console open, main thread
    0.22 cores) put checkPlainMessage with machineTokens at about 1.1 s, plus Buffer encoding from sha256. Every
    thread list (operatorThreadItems in panel-graph.ts) calls plainInboxMessage for each item, and
    currentStoredMessage in src/lib/inbox-plain.ts re-runs plainSourceFingerprint, validateDecisionSummary and
    checkPlainMessage each time. Those checks read only the stored message and the proposal id and summary that its
    matched sourceFingerprint already names, and no clock, so the answer for one content never changes.
  design: |
    inbox-plain.ts: storedMessageChecksOut memoizes the shape and plain-language verdict in a Map keyed on the
    JSON of the fingerprint, source and every field the checks read. plainSourceFingerprint memoizes its hash by
    its JSON key. Both maps clear when they reach PLAIN_CHECK_MEMO_MAX (4096). What is served and refused is
    unchanged.
    INVARIANT memo-bounded: neither memo grows past PLAIN_CHECK_MEMO_MAX, and answers stay correct after a clear.
  falsifier: |
