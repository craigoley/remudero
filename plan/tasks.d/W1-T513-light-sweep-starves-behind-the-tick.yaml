- id: W1-T513
  title: "the light sweep runs inside the main tick and starves behind whatever occupies it, so a green PR can wait tens of minutes for a review that takes seven seconds — 41 sweep gaps over five minutes, 15.2 starved hours in a 161.6-hour corpus"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  risk: high
  principles: {tdd: strict}
  budget_usd: 25.00
  rationale: "MEASURED ON THE AZURE HOST (`Remudero`), 2026-08-15. Ledger corpus per form: `.gz`
    **0 files**, plain 2, live 1 — COVERAGE control on a step present in every non-empty form
    (`run.start`): gz 0 / plain 128 / live 85, so the gz zero is an empty form, not a missed glob.
    Union, full-line deduped: **31,288 rows** spanning **161.6 hours**.

    (1) **THE CADENCE, WHOLE-CORPUS.** `sweep.pass` inter-pass gaps, n=**2,613**:
    **median 63s, p75 111s, p90 118s, p99 441s, max 187.0 min**; **72% land within 90s**.
    **41 gaps exceed 5 minutes and 12 exceed 15 minutes**, totalling **15.2 starved hours** — 9.4% of
    the corpus.

    (2) **WHAT HOLDS THE TICK, CLASSIFIED RATHER THAN GUESSED.** Each of the 41 gaps attributed by
    what logged inside it:
      **ci wait held the tick   23 gaps  331 min**
      daemon restart / outage   10 gaps  368 min   (an outage, NOT starvation — excluded from the case)
      **fix rung held the tick   6 gaps  202 min**
      other rung                 2 gaps   10 min
    **EXCLUDING RESTARTS: 31 GAPS, ~9 HOURS.** The CI wait is the most FREQUENT occupant; the fix rung
    is the longest per instance.

    (3) **AND IT IS NOT A FROZEN EVENT LOOP — RE-DERIVED EXPLICITLY, BECAUSE THE FIRST HEURISTIC GOT
    IT BACKWARDS.** Across all 42 `ci.polling` clusters longer than five minutes, the ledger carries
    **68 `daemon.alive` rows AND 180 `sweep.pass` rows**. A frozen loop stops both (the discriminator
    W1-T463/#1813 established); here the heartbeat keeps writing and sweeps largely still land.
    **THE TICK IS OCCUPIED, NOT FROZEN.**

    (4) **AND ONE MEASUREMENT WAS WRONG BEFORE IT WAS RIGHT — RECORDED SO IT IS NOT REPEATED.** A first
    pass counted `ci.polling` clusters longer than SIXTY SECONDS and found '41 of 49 with no sweep
    inside'. **THAT THRESHOLD MANUFACTURES STARVATION**: with a 63s median cadence, a 60-90s window
    frequently contains zero sweeps by sampling alone. Re-run at a five-minute threshold the same
    clusters are mostly healthy. **ANY FUTURE MEASUREMENT HERE MUST USE A WINDOW SEVERAL TIMES THE
    CADENCE, OR IT WILL RE-DISCOVER A PHANTOM.**

    (5) **THE RUNG DURATION PROFILE, LEDGER-DERIVED.** Time between each rung's own boundary rows, and
    how often a `sweep.pass` fails to land inside:
      implement run (`run.start`->`verdict`)          n=68  median **28.3 min**  p90 82.5  max 174.2   no sweep inside: 30/68
      review spawned (`review.reviewer`->`posted`)    n=34  median  0.1 min  p90  0.4  max   2.5
      post-review (`attempt`->`done`)                 n=85  median  0.2 min  p90  0.8  max   2.6
      fix rung (`fix.dispatch`->`fix.done`)           n=17  median  0.0 min                        (bookkeeping rows, not the work)
    **THE IMPLEMENT RUN IS THE ONLY MULTI-MINUTE RUNG, AND IT IS THE ONE ALREADY WRAPPED** — sweeps
    land inside 38 of its 68 spans. The reviewer rungs are sub-minute and are NOT the problem."
  design: "(0) **WHAT IS NOT WRONG — RECORD IT SO NOBODY RE-INVESTIGATES IT.** Reviews are FAST:
    `sweep.post_review.attempt` -> `review.posted` is **median 7.3s, p90 36.6s, n=81**, and the spawned
    half is faster still at median 3.3s (n=34). And they are GENUINELY CONCURRENT — `runSweepLightPass`
    (`src/lib/sweep.ts`) ends `return Promise.all(openPrs.map((pr) => runSweep([pr], deps, policy)))`.
    **THE REVIEWER IS NOT THE PROBLEM AND MUST NOT BE 'OPTIMISED'.**

    (i) **THE MECHANISM.** `startInFlightTicker` (`src/lib/daemon.ts`) wraps the IMPLEMENT DISPATCH
    ONLY. The fix rung and the reviewer rung run inside the main tick with no ticker, so a long await
    anywhere in the tick defers the next `sweepLight` until it returns. `sweepLight` is driven from
    `src/lib/daemon.ts` (18 references there), which is why the tick and the light pass share a thread.

    (ii) **THE CRUX, AND IT IS EASY TO GET BACKWARDS — STATE WHICH PROBLEM ANY FIX SOLVES.**
    `startInFlightTicker` exists because a long dispatch once silenced `daemon.alive` entirely. **IT
    KEEPS THE HEARTBEAT ALIVE. IT DOES NOT MAKE THE SWEEP RUN.** Measurement (3) proves the two are
    already decoupled: the heartbeat wrote 68 rows through the long clusters. **SO EXTENDING THE
    TICKER TO THE OTHER RUNGS WOULD MAKE THE FLEET LOOK HEALTHIER WITHOUT SHORTENING A SINGLE PR'S
    WAIT** — the reads-like-success shape this repo has measured repeatedly. **AN IMPLEMENTER WHO
    REACHES FOR THE TICKER MUST SAY WHICH OF THE TWO PROBLEMS THEY ARE SOLVING.**

    (iii) **THE ALTERNATIVES. ARGUE ALL FOUR; NONE IS RANKED HERE.**
      (a) **RUN THE LIGHT PASS ON ITS OWN TIMER**, independent of the tick. Closest to what the
          operator wants. **COST — AND IT IS A REAL RACE, NOT A THEORETICAL ONE:** `claimedReviewKeys`
          is declared INSIDE `runSweep` (`src/lib/sweep.ts`, 4 references), so it is PER-CALL. Two
          concurrent passes each construct their own Set and could double-review the same PR. A
          verdict is a sha-pinned commit status, so a duplicate post is an idempotent overwrite rather
          than a wrong verdict — but the spawned reviewer half would run twice, which costs money.
          This option REQUIRES lifting the mutex out of `runSweep` first.
      (b) **EXTEND `startInFlightTicker` TO THE OTHER RUNGS.** Small and local. **BUT SEE (ii)** — on
          this evidence it treats the symptom that is already absent.
      (c) **BOUND THE RUNGS THAT HOLD THE TICK.** The fix rung already caps at two strikes, but that
          caps ATTEMPTS, not DURATION; nothing found caps how long a single occupant may hold the
          tick. A duration cap is the smallest change that shortens the tail directly.
      (d) **DO NOTHING BUT SURFACE IT.** The median is 63s and 72% land inside 90s. **THE TAIL MAY
          SIMPLY BE THE COST OF A SINGLE-THREADED DAEMON**, in which case the honest remedy is
          visibility rather than concurrency.

    (iv) **AND COST ANY PROPOSAL THAT SWEEPS MORE OFTEN — THIS IS A HARD CONSTRAINT.** The cadence is
    already the heaviest GitHub caller: **656 `sweep.pass` rows in a day**, roughly one per two
    minutes, each a list read plus per-PR live-state reads. That day reached **11,213 calls against a
    5,000/hour GraphQL limit**. **A PROPOSAL THAT HALVES THE INTERVAL DOUBLES THE HEAVIEST CALLER ON A
    BUDGET THAT IS ALREADY EXHAUSTING.** Any option must state its call-volume delta.

    (v) **THE OTHER HALF OF THE SYMPTOM IS OWNED ELSEWHERE — CITE, DO NOT DUPLICATE.** W1-T511
    (#1866) owns the rate-limit half: **31 of 114 review attempts (27%) died on `GraphQL: API rate
    limit already exceeded`**, discarded whole with no retry and no alarm. That and this task produce
    the same operator-visible symptom by different mechanisms. **DO NOT ABSORB IT.**

    (vi) **WHAT MUST NOT BE BUILT.** No reviewer optimisation (see (0)). No second heartbeat. No
    unbounded concurrency without lifting `claimedReviewKeys` first (see (iii)(a)). And nothing that
    increases sweep frequency without the call-volume arithmetic in (iv)."
  acceptance:
    - claim: "a long-running tick occupant no longer blocks the light pass"
      proof: "unit test: W1-T513: a long tick occupant does not block the light pass"
    - claim: "two light passes cannot review the same pull request twice"
      proof: "unit test: W1-T513: two light passes cannot double review one pull request"
    - claim: "the sweep interval is unchanged so the call budget is not increased"
      proof: "unit test: W1-T513: the light pass interval is unchanged by the fix"
    - claim: "a heartbeat alone does not count as a sweep having run"
      proof: "unit test: W1-T513: a heartbeat alone is not counted as a sweep"
