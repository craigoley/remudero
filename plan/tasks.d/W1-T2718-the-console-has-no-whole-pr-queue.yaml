- id: W1-T2718
  title: "THE CONSOLE HAS TASK ROWS AND A BLOCKED-PR EXCEPTION LIST BUT NO WHOLE OPEN-PR QUEUE — give the operator one live, ordered cockpit that shows every open head's current sweep disposition, review state, exact wait reason and freshness without a second GitHub walk"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 70.00
  files:
    - src/lib/board.ts
    - src/lib/serve.ts
