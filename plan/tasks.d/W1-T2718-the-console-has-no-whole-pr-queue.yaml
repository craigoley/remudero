      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
    - claim: "a queue row uses only a same-head latest sweep disposal and never carries an old head's disposition or reason onto a pushed head"
      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
    - claim: "the queue reuses the batched gateway's open index, the board's one ledger read and its existing review vocabulary without a second GitHub walk or browser-side fetch"
      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
    - claim: "an unreachable or truncated open index is rendered as an incomplete unreadable queue with reason and freshness, never as an empty healthy queue"
      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
    - claim: "the console queue orders actionable, active, ready or held, waiting and unknown rows deterministically and exposes filters without hiding an unclassified row"
      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
    - claim: "the queue is repainted from the existing atomic status snapshot and adds no polling loop, write route or operational side effect"
      proof: "unit test: test/console-pr-queue-cockpit.test.ts"
  note: |
    W1-T914 already renders review state on task rows and W1-T1006 already renders the blocked-PR
