  attempts: 0
  rationale: |
    OBSERVED AT origin/main 4cc3efde. `BoardSnapshot.tasks` is one row per PLAN task, not one row
    per open pull request. W1-T914 decorates a task row's PR link with the current
    `remudero-review` state, and W1-T1006 adds only PRs whose latest sweep disposition is already
    non-progressing. The shell has Decisions, Now, Plan and Feed tabs; it has no view whose
    population is "every live open PR". A green head waiting for review, an active reviewer, an
    auto-merge-ready head, a held head and a red head therefore cannot be inspected as one queue.
    The operator has to reconcile the GitHub board, daemon log and ledger by hand. That is the
    queue-hygiene work the daemon is meant to own.

    THE INPUTS ALREADY EXIST; THIS TASK IS A PROJECTION, NOT ANOTHER POLLER. The production
    `buildBatchedGithub` gateway's `listOpenHeadBranches()` returns every live open PR from its
    existing cached open-half walk, including number, URL, title, head ref and body. The same
    `computeBoardSnapshot` call already reads the ledger once and already projects task-backed
    review state. `sweep.disposed` records PR number, task id, head sha, disposition and the exact
    reason the reconciler derived. Join those three existing inputs. Do not call `gh` from the
    browser, do not add a second REST/GraphQL walk, and do not invent a console-only disposition
    taxonomy.

    BUILD ONE `PrQueueRow` PER CURRENT OPEN PR. Identity comes from the live open index. The newest
    same-head `sweep.disposed` row supplies disposition and exact reason. A task-backed row may
    reuse the review state already projected for that PR. A live PR with no task credit or no
    same-head disposal still renders, explicitly as unattributed or not-yet-observed; absence is
    information, never a reason to omit it. A disposal for an old head must never describe a new
    head. If the open index is failed or truncated, withhold the claimed-complete queue and expose
    the gateway's classified reason plus the last good snapshot age rather than drawing an empty,
    healthy-looking board.

    ADD A QUEUE TAB TO THE EXISTING CONSOLE SHELL. Default order is actionable first, then active,
    ready/held, waiting and unknown, stable by PR number inside a class. Each compact row shows PR,
    title, task attribution, head abbreviation, disposition, review state, exact reason and
    snapshot freshness; expanding it shows the latest known queue transition without replacing
    the existing task journey. Filters for actionability, review state and task id operate only on
    the already-loaded snapshot. The existing SSE/status refresh paints this field atomically with
    the rest of `BoardSnapshot`; there is no new polling loop.

    THIS TASK IS READ-ONLY. It does not start a review, fix, merge, close, deploy or daemon action;
    those remain the sweep's responsibility and the operator's existing controls. Console
    merge-hold controls are a separate write concern and must not be smuggled into this PR.

    RULE 19: risk is high for span, not blast radius. The change crosses the board model, the
    inline console shell, its focused proof and the board source-size ratchet. It changes no gate,
    routing decision, provider call or worker admission.
