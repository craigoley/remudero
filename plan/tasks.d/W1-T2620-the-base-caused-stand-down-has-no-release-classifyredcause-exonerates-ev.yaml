  note: |
    WHY THIS IS NOT AN EXISTING ENTRY, each neighbour read before filing rather than assumed.
    W1-T527 built the stand-down and owns the no-strike guarantee; it never proposed an exit.
    W1-T124/W1-T474 built the remedy and its class table; W1-T977 fixed WHEN that rung can see its
    trigger. All three are downstream of a hand-authored row and none fires without one.
    W1-T1033 supplies a first-party base-cause INPUT (a push run on `main`) and its own note states
    the attribution surface "is not built here"; it changes what the classifier can know, never what
    the stand-down then does. W1-T2304's board rung is READ-ONLY BY CONSTRUCTION — it "pushes to no
    branch" — and files registry proposals. W1-T528/W1-T1208 own `update-branch` for a disjoint,
    green, armed, `behind` population. NOTHING RELEASES A BASE-CAUSED STAND-DOWN.

    THE PROVOKING INSTANCE IS EVIDENCE, NOT THE DELIVERABLE. The follow-up was raised off a base-
    commit fix merging at its source while sibling PRs kept failing on the identical unrelated cause.
    This task builds NO row for that PR and hardcodes no PR number: a release keyed on "main has
    moved" covers that instance and every future one without a per-incident filing, which is the
    whole reason to prefer it over a fourth `FixClass` row.

    `src/run-task.ts` IS DECLARED AND THE COST IS ACCEPTED IN WRITING. Design (i) and (iv) both need
    the caller to supply real effects, because `src/lib/sweep.ts` states repeatedly that it never
    talks to GitHub. W1-T471 serializes every task naming `run-task.ts`, so this shard will not batch
    with any of them, and a sweep-only change would leave the reader permanently undefined and the
    stand-down exactly as unbounded as it is today.

    `risk: high` IS SET UP FRONT AND IS RULE 19's SPAN, NOT BLAST RADIUS. `moduleIdFromPath` strips
    `.test`, so the three declared paths resolve to `sweep`, `run-task` and `base-caused-release` —
    three, above the sizing threshold, so no file list satisfying this task's own scope passes at
    medium. Blast radius argues DOWN: one optional dep, one bounded release, and the omitted-dep
    path byte-identical to today (criterion 6).

    PROOF NOTES. All six criteria use the PURE-PATH form against a file this task creates, so the
    proof executes the whole suite and every test in it belongs to this change — the same shape
    W1-T1033 and W1-T2304 use for their own new files. No `grep:` criterion is offered: the only
    tokens that would discriminate head from base are identifiers this task has not written yet, and
    forward-referencing a SYMBOL is a guess where forward-referencing a PATH is not.
    `test/base-caused-release.test.ts` does not exist today — a forward-referenced path, kept out of
    a shared suite per the house rule.

    ID PROVENANCE IS DELIBERATELY ABSENT. The `id:` here is the placeholder `W1-T2620`; `rmd approve`
    mints and reserves the real id at ratification, so no id is guessed and no reservation is
    claimed by this draft.
