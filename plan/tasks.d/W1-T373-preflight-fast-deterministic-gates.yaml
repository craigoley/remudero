    move is the raise. The real hazard is smaller than the label: a fast mode that grew into the
    suite would silently start costing worker spend, which is why (iii)'s refusal is a stated rule.
    budget_usd 70 — a mode flag, a curated step list, the ci-parity parity fix, a spawn-recorder
    falsifier proving the suite is never shelled, and the two doc regenerations (viii) forces.
    files: DECLARES src/lib/ci-parity.ts for the parity fix (v), docs/operator-guide.md and
    docs/cli-reference.md because (viii)'s two gates require them for a usage-string change, and
    test/ci-parity-contract.test.ts because the fourth criterion asserts the new entry there. Omitting a
    written path is what refused five dispatches in one week.
    ON THE PROOFS. Three name test/preflight-fast-mode.test.ts, which does not exist yet: `rmd
    check-proof` reports 0 candidates for it today. That is a FORWARD REFERENCE TO A PATH, which
    CLAUDE.md records as safe — unlike forward-referencing a symbol name, which is a guess — and the
    path is declared in files: so the worker creates it. The fourth names test/ci-parity-contract.test.ts, an
