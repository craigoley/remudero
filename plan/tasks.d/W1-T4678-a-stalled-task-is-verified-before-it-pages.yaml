    The verification marker is read back to deduplicate a fingerprint; ledger rotation must retain it and a rotation test
    must prove the read still works after compaction. The offline-first stage records provisional verdicts while preserving
    the existing circuit-breaker notification until a replay supports a live disposition.
  design: |
    (i) Before dispatch.circuit_broken.escalated, a cheap-lane verifier reads the evidence and returns one of: amend proof,
    retire, requeue with a note, escalate with a named owner and the reason.
    (ii) It runs once per new evidence fingerprint and cannot approve or bypass a gate.
    (iii) Offline first: replay recent breaker escalations and compare its verdict with the operator's resolution.
