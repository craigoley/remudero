  rationale: |
    OBSERVED: a circuit-broken task escalates straight to the operator (src/lib/escalation-catalogue.ts); W1-T2487 found 26
    of 50 blocked tasks name no disposition; 2026-09-28 W1-T3116's breaker issue #7432 would have been answered 'correct the
