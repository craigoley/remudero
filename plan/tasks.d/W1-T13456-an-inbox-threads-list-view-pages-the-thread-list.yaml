  rationale: |
    WHY: Craig approved retiring serve's old read paths on 2026-11-17. The Console reads GET /v1/i/core/inbox/threads on
    every render and every 30 s refresh (24,228 Console reads in route-reads.json at 18:10Z); it is computed in serve
    from the classification, the thread store and the read marks. The Console thread (recon at console 032b751) cannot
    move off it until a view answers the same rows.
  design: |
    INVARIANT inputs-not-clock: no clock in data; the same inputs give the same ETag.
    1. A read-model view built in the view thread, like inbox-thread-view.ts: inputs are the stored classification
       snapshot (readPersistedInbox: proposals and classifications), the plain store, the thread store and the read
       marks; rows come from the same operator-item and thread-summary functions the route uses, never a copy.
    2. Pages bounded like pageInboxThreads (INBOX_THREAD_PAGE_MAX_BYTES), keyed section-free: first page key "", later
       pages by cursor; the envelope keeps snapshotKey, threadListKey and contract.
    3. Mount it as W1-T13455 mounts inbox-thread (served by default, reader entry, contract, census).
  falsifier: |
    Build rows with a separate copy of the summary logic: criterion 1 drifts. Accept an old cursor: criterion 2 fails.
    Put a clock in data: criterion 3 fails.
