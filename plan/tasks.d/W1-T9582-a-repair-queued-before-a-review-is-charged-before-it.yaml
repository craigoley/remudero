  rationale: |
    READ on origin/main c386eab77. Symbols, not lines.
    MEASURED 2026-10-14T22:11Z..2026-10-15T00:56Z, the core ledger streamed read-only from the Azure host. The daemon
    ran W1-T9498 (#11779) from its 23:07Z boot and #11837 (conflicted on the light pass) from its 23:47Z boot, per the
    live checkout's reflog. In that window: 55 sweep.review_started, 5 fix.dispatch, 34 sweep.disposed rows reading
    "live host capacity exhausted" over 9 PRs (30 blocked-fixable, 4 conflicted). The oldest blocker refused was 117 min
    old. 51 of 91 sweep.fix_capacity rows read zero admissions with a repair queued.
    WHY. In runSweep's full pass, `fullReviews.planned` is Math.min(fullReviewQueueDepth, fullReviewLanes). It is
    passed to createSweepFixAdmissionController as `reviewReservations`, and every fix claim is admitted only on the
    headroom left after those planned reviews (`reviewChargeMib`). How long each PR has waited plays no part. A review
    of a head pushed a minute ago is charged before a repair whose blocker_since is hours old. W1-T9498 fixed what
    each reservation costs, not which goes first. The light pass cannot take up the slack under load: daemon.ts runs
    the review clock's passes `reviewOnly` whenever a pass or a review is in flight, and lightPassActionable then
    stands every repair down ("deferred to full sweep (light pass)"). So the full pass is where a repair is admitted
    under a steady review queue, and there it always comes last. #11755 and #11785 read exactly that from 22:43Z to
    00:56Z.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main for createSweepFixAdmissionController, reviewReservations,
    review_charge_mib, fullReviewLanes, "capacity exhausted", starvation and outrank. W1-T9498 (cost, merged),
    W1-T8086 and #11837 (light-pass admission, merged), W1-T7095 (review versus build admission) and W1-T3202 (review
    pool start, merged) are adjacent. None orders a repair against a review. Swept the plan/ diffs of the 171
    origin heads with a commit in the last 3 days. No head adds one.
  design: |
    No fixed share, no slot count, no age cap. One order, by how long each PR has waited.
    1. ORDER BY WAIT. The full pass orders its planned reviews and its repair claims by the blocker_since of each PR's
       current blocker (priorBlockersFromLedger, the field sweep.disposed already writes), oldest first. A review is
       charged against the headroom only when its PR began waiting before the repair claiming now. A repair is then
       admitted when the headroom left after the charges ahead of it covers the fix estimate (W1-T9498's arithmetic,
       unchanged).
    2. A REVIEW A REPAIR OVERTAKES STAYS QUEUED. When a repair takes the headroom a later-queued review would have
       used, the review pool does not start that review this pass. It stays in the queue with its own blocker_since,
       so it goes first next pass against any repair queued after it.
    3. TIES AND UNKNOWNS. A PR with no recorded blocker_since sorts by its PR's last activity. Equal waits keep today's
       order (reviews, then repairs).
    4. ROW. sweep.fix_capacity adds `ordered_ahead` (the PR numbers charged ahead of this claim) and the claim's own
       `blocker_since`, so a refusal row shows why it lost.
    Tests go in the new file, `test(` titles verbatim as in the proofs below. Use the 00:42:26Z row as a fixture
    (headroom 2406 MiB, three reviews at 1130, a fix at 1283), with injected blocker ages.
