- id: W1-T3650
  title: "A PULL REQUEST'S OWN ACCEPTANCE BLOCK AND ITS TASK'S DECLARED PROOFS CAN DIVERGE WITH NOTHING NOTICING — CONSOLE-T12 shipped and merged while all four of its declared proofs named unit tests that did not exist"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 45.00
  files: [scripts/acceptance-author-gate.mjs, test/a-trailer-pr-is-judged-against-the-task-it-credits.test.ts]
  origin: oper#dispatch-refusal-audit-2026-09-16
  plan_refs: ["W1-T1060", "W1-T952", "W1-T2297"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-16. `CONSOLE-T12` declared four criteria, every one proved by a named unit
    test. None of the four tests existed:

        "the now board renders a row per live task, never only a count"
        "the activity feed renders the verb, task and cost of each recent event"
        "one unavailable source does not blank a surface that read successfully"
        "an empty board states that nothing is running"

    The BEHAVIOUR shipped — rows, the activity feed, per-source degradation, the empty state — and
    the pull request was reviewed, approved and merged on its OWN `## Acceptance` block, whose
    bullets named different tests that did exist. Two sets of criteria for one piece of work, and
    nothing compared them.

    IT ALSO COST A SECOND DEFECT. Because that PR carried an `## Acceptance` block INSTEAD of a
    `Remudero-Task: CONSOLE-T12` trailer, `findMergedByTrailer` never credited the task. The record
    stayed `queued` and the console daemon re-attempted it 1,232 times in 10.4 hours (W1-T3649).

    WHY THE EXISTING GATES DO NOT CATCH THIS. `acceptance-author-gate` asks whether a body is
    JUDGEABLE — a header with parseable bullets, or a trailer resolving to a filed task. Both were
    satisfiable independently, and the PR satisfied the first. `proof-discrimination` executes the
    proofs a body declares, not the ones its task declares. No check reads both and compares.

    NOT A BAN ON EITHER SHAPE. A body-level block is right for work with no filed task, and a
    trailer is right for work that has one. The defect is a PR that has BOTH a filed task and a
    body block, whose two proof sets disagree — that is a claim about the work that two readers
    would answer differently.
  acceptance:
    - claim: "a pull request that both credits a task and carries its own acceptance block is refused when the two name different proofs"
      proof: "unit test: a body block that disagrees with its task's proofs is refused"
    - claim: "a pull request carrying only one of the two is unaffected, so neither shape is banned"
      proof: "unit test: a body block with no task trailer is judged exactly as before"
    - claim: "the refusal names which proofs differ, so the author repairs the disagreement rather than guessing"
      proof: "unit test: the refusal names the proofs that differ"
  falsifier: |
    Make the check compare only proof COUNTS and the first test still passes while two different
    proof sets of equal size merge — which is the defect. Refuse a body-only PR and the second
    fails. Print a generic refusal and the third fails.
