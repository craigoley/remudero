  rationale: |
    MEASURED 2026-09-30: 266 queued tasks, 176 with no `priority:` (absent priority sorts LAST in the drain, so
    they are effectively never reached); by age 76 under 2 days, 51 at 2-7, 75 at 7-14, 39 at 14-30 and 25 over 30
    days. The queue grew from 225 to 266 in a day while 32 task builds merged. A hand review of 18 queued verify-human
    tasks the same day found about half already done, ruled or overtaken (W1-T2615, W1-T3102, W1-T3103, W1-T3887,
    W1-T971, W1-T433, W1-T2203, W1-T417, W1-T3332), each checked against main. The plan gardener retires a task only
    when its proofs hold on main; nothing judges relevance or assigns priority.
  design: |
    AMENDED 2026-10-01 at the operator's request ("look at how to do this in the smartest way possible"). Measured
    context: the dispatch value calibration (W1-T3412) has never activated: 178 dispatch.value.refused in 3 days,
    and one unmeasurable class refuses the whole calibration (W1-T5112 fixes it). The plan gardener omits
    REPRIORITIZE on the false premise that dispatch-value already orders the queue. So NOTHING ranks the ~235
    unprioritized tasks today, and released or rescued tasks sit behind every prioritized one indefinitely.
    THE JOB IS PLACEMENT, NOT ORDERING. The gardener puts an unprioritized task into a coarse band. Ordering inside a
    band belongs to W1-T5112's per-class value score and the open-dependent fanout tie-break.
    1. SCOPE: only queued tasks with no `priority:`. An operator- or session-set priority is never changed.
    2. DETERMINISTIC EVIDENCE FIRST, gathered read-only and cited in the PR body for every proposal:
       a. open-dependent fanout (openDependentFanout, src/lib/dispatch-value.ts): what this task unblocks;
       b. LIVE SYMPTOM: whether the ledger rows the rationale cites (step names, reasons, measured counts) still
          occur in the trailing window of the ledger union. A symptom that stopped is retirement evidence; a
          symptom that grew is urgency evidence;
       c. PREMISE: whether the files and symbols the shard names still exist on main;
       d. OVERTAKEN: whether a merged task in the trailing window shares its surface (the duplicate-surface lint
          already computes this) or its proofs already hold on main (the plan gardener's own check);
       e. CLASS VALUE: W1-T5112's `dispatch.value.calibrated` class mean and attempts, when present. Its absence is
          not a reason to wait.
    3. THE JUDGE SYNTHESIZES, IT DOES NOT GUESS. It reads the shard plus (2), and answers with one of: band 2
       (live, growing symptom or unblocks dependents), band 3 (valid, no urgency), band 4 (cold: valid but no
       symptom and no dependents), or a retirement (closed|withdrawn) citing which of (2b-2d) shows it is done,
       overtaken or premise-gone. It never proposes priority 1: band 1 stays the operator's and the sessions' range.
       That is the gardener's own output space, not a refusal of anything.
    4. SELF-PACED, NO FIXED BATCH: each pass examines as many tasks as the fleet merged in the trailing day, oldest
       first, so placement keeps up with drainage without flooding review.
    5. RE-EXAMINE ON CHANGED EVIDENCE: a task this gardener banded is looked at again only when its evidence (2)
       changes, for example its symptom stops or a dependent merges, never on a timer.
    6. Same PR shape as the plan gardener: one plan-only PR per pass, ordinary review and auto-merge, a closed PR is
       the decline signal. It registers through the garden registry and runs off the daemon loop once W1-T5114
       lands.
    7. Correct plan-gardener.ts's REPRIORITIZE comment so it points at this task and W1-T5112, not at a calibration
       that never activated.
    MEASURE AFTER MERGE: unprioritized share of the queue (176 of 266 on 2026-09-30), time from filing to first
    dispatch for gardener-banded tasks, and retirements merged against reverted or reopened.
