- id: W1-T4413
  title: "A TASK WHOSE FALSE CREDIT IS LATER WITHDRAWN IS BLOCKED FOREVER — its old `task_already_merged` refusal is read as an independent failure, so a task that was only filed, never built, can never dispatch; treat that refusal like blocked_inflight, a non-failure"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 15.00
  risk: medium
  origin: "board pass 2026-09-24: remudero-site stuck since 2026-09-20"
  plan_refs: ["W1-T319", "W1-T1004", "W1-T3979"]
  files:
    - src/lib/status.ts
  status: merged
  attempts: 0
  rationale: |
    OBSERVED 2026-09-24 on remudero-site. Filing PRs #108 ("chore(plan): file public learning provenance
    follow-up") and #109 were opened on branches run-PORTAL-T20-1789934727000 and run-PORTAL-T21-1789939888409.
    On 2026-09-20 the branch-name credit path briefly counted them as the builds. dispatch refused both as
    `task_already_merged` (the dispatch.blocked_independent rows), and the sweep wrote credit_backfill /
    verdict.merged. Since then, the plan-only-filing refusal (isPlanOnlyFilingPr, W1-T1004) correctly withdraws
    that credit, so deriveStatus finds base.merged false. It then finds the old `task_already_merged` row in
    latestIndependentFailureBlock and marks the task `blocked` for good. Neither task was ever built: their
    unit-test titles return 0 hits on site main (control: a known title returns 1). The site daemon's idle
    reasons list PORTAL-T20/T21/T22 as blocked and PORTAL-T24 as unmet-deps. The site fleet has dispatched
    nothing since 2026-09-22 12:58Z.
  design: |
    In latestIndependentFailureBlock (src/lib/status.ts), a `dispatch.blocked_independent` row whose verdict is
    `task_already_merged` is a CREDIT refusal, not a task failure, and it never sets the latch. This is
    the same treatment W1-T3979 gives `blocked_inflight` and W1-T2474 gives `blocked_illformed`. If the task
    really is merged, deriveStatus has already returned at its merged-is-terminal line. If the credit was
    withdrawn, the task becomes dispatchable. Historical rows stay in the ledger for forensics. No other
    verdict changes meaning.
  amendment: "2026-09-24 GUARD CRITERION REMOVED: \"a genuinely merged task is still reported merged, not queued\" is a regression guard that passes at the merge base too, so proof-discrimination can never accept it. Its test stays in the suite as a regression test."
  acceptance:
    - claim: "a task_already_merged refusal never blocks a task whose credit was withdrawn"
      proof: "unit test: a task_already_merged refusal never blocks a task whose credit was withdrawn"
  falsifier: |
    CLOSE IF a task whose only independent-failure row is task_already_merged is already dispatchable once its credit is withdrawn.
