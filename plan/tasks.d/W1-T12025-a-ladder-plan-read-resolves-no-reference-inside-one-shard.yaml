  rationale: |
    OBSERVED 2026-11-10T08:35:35Z on the core daemon: flow-remedy.gardener_failed with "flow plan shards unreadable: plan/tasks.d/W1-T11062-flow-conflict-merge-conflict-mergestate-dirty.yaml: PlanError: task W1-T11062: superseded_by unknown task 'W1-T11172'". The pass had queued 3,596 s and run 828 s before it failed.
    - W1-T11172 is on main in its own shard. readLadderPlan (src/lib/flow-remedy-gardener.ts) passes each shard to loadPlanFromYaml, which resolves depends_on and superseded_by inside the one blob it is given.
