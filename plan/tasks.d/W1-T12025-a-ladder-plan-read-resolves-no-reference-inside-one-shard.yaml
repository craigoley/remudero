  design: |
    Read each listed shard with parseTasksFromYaml, which checks the shard's own schema and leaves cross-task references to the whole-plan loader. Keep the unreadable list and its throw in the gardeners as they are.
    NOT IN SCOPE: whether the superseding task has landed (retirementHoldsOrigin already decides that) and the gardeners' queue time.
  falsifier: |
