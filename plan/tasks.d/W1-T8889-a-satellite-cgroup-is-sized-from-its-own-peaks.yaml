  rationale: |
    READ 2026-10-12 at origin/main 42dae2eb8; cgroup files read via docker exec; daemon.alive 48 h.
    OBSERVED:
    - console: memory.high 2.0 GB, memory.peak 2.61 GB, 553 `high` events, swap peak 0.63 GB, current p50 1.26 / p90
      1.93 GB, workers active in 60% of samples.
    - site: memory.high 1.75 GB (1,879,048,192), peak 1.75 GB, 0 high events, current p90 1.25 GB, 0 active workers in
      31 h.
    - Both satellites: memory.max 9.25 GB, the same as core.
    - Core's memory.high is already self-tuned (#10486, `host.memory_high`, memory-high-tuned-remudero-daemon.json).
    OWNERSHIP: none for the satellites.
  design: |
    RE-SCOPED 2026-11-02 under operator ruling R2 (2026-10-27): "Re-scope queued W1-T8889 (fixed console/site bounds:
    3 GB max, 1.25 GB floor) to learned peaks inside that budget", the budget being R1's shared host budget (W1-T11130).
    The fixed 3 GB max, the 1.25 GB floor and the x1.15 / x1.5 multipliers are dropped.
    - memory.high: core's self-tuner (deploy/memory-high-tuner.sh) runs for site and console too, starting from each
      satellite's own learned peak (its recorded memory.peak and current p95 over the tuner's window), with its
      RMD_MEMORY_HIGH_FLOORS entry as the floor until a peak is learned. It grows, holds and shrinks by the tuner's
      existing tiers, never above its memory.max.
    - memory.max: not set here. It is W1-T11130's shared budget, host - reserve - the other containers' learned
      peaks. This task records each satellite's learned peak (its cgroup memory.peak, beside
      memory-high-tuned-<container>.json) so that budget can read it, and adds no bound of its own. The two tasks can
      land in either order: without W1-T11130 the satellites keep today's memory.max.
    Applied at the next recycle through the existing recycle path. Ledgered on host.memory_high.adjusted.
  acceptance:
    - claim: "each satellite's memory.high is self-tuned from its own learned peaks with no fixed max or floor of its own, and its learned peak is recorded where W1-T11130's shared budget reads it"
      proof: 'grep: test("W1-T8889: a satellite cgroup is sized from its own peaks" in test/a-satellite-cgroup-is-sized-from-its-own-peaks.test.ts'
  falsifier: |
