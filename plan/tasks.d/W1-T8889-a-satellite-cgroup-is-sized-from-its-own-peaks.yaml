  repo: remudero
  depends_on: []  # R2: memory.max is W1-T11130's (PR #16256); this task tunes memory.high and records the peak that budget reads
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the satellites' cgroup sizing follows their measured use; core is unchanged
  band_meaning: span
  origin: "operator ruling 2026-10-12: no VM resize; right-size what we have"
  plan_refs: [W1-T11130]
  files: [deploy/recycle-container.sh, deploy/install-host-units.sh, test/a-satellite-cgroup-is-sized-from-its-own-peaks.test.ts]
