  rationale: |
    The daemon wiring currently maps readLedgerUnionRecordsSync(...).ok=false to []. That is
    indistinguishable downstream from a measured zero-friction ledger. A garden pass can cache a
    false fingerprint or scorecard, weakening the process that should learn from PR repairs.
    The union reader also swallows live-file read failures, so the strict option must report
    that failure while retaining best-effort behavior for other callers. Rule 19 prices the
    existing broad test suites and the production composition root as a span.
  design: |
    Preserve the ledger union reader's refusal reason at the production seam. An unreadable
    archive or live file fails the garden pass with a named ledger error; it writes no scorecard,
    task, or clean fingerprint. A readable empty corpus remains valid and distinguishable.
