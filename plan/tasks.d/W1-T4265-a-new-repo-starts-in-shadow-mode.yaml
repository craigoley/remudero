- id: W1-T4265
  title: "A NEWLY ONBOARDED REPO WOULD GO STRAIGHT TO MERGING — give a registry instance a mode: shadow instances run real tasks but open DRAFT pull requests, never arm or merge, and record what would have merged or been blocked, so the operator judges evidence before anything lands"
  repo: remudero
  depends_on: [W1-T4227]
  priority: 2
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high
  band_meaning: span
  origin: "operator-request#onboard-wild-trails-2026-09-23"
  plan_refs: ["W1-T4227", "W1-T4264", "W1-T4266"]
  files:
    - src/lib/instance-registry.ts
    - src/run-task.ts
  status: queued
  attempts: 0
  rationale: |
    The design doc's onboarding gate: a new repo is proven in a shadow instance before it goes live
    (GitHub rulesets' Evaluate mode is the precedent: record what would have passed or failed without
    enforcing). The operator must never discover that a dry run merged code. Wild Trails
    (craigoley/wild-trails) is the first repo through it.
  design: |
    Registry instances gain `mode: shadow | live` (absent = live, so existing instances are unchanged).
    A shadow instance's worker opens pull requests as drafts, and every path that arms auto-merge, merges
    or marks ready-for-review refuses for a shadow instance by name. After review, the run ledgers
    `shadow.verdict` with the PR, the review verdict and what a live instance would have done
    (would_merge | would_block + reason). A daemon started with mode shadow says so in its first ledger row.
  acceptance:
    - claim: "a shadow instance opens its pull requests as drafts"
      proof: "unit test: a shadow instance opens its pull requests as drafts"
    - claim: "a shadow instance never arms or merges a pull request"
      proof: "unit test: a shadow instance never arms or merges a pull request"
    - claim: "a shadow run records what a live instance would have done"
      proof: "unit test: a shadow run records what a live instance would have done"
    - claim: "an instance with no mode stays live"
      proof: "unit test: an instance with no mode stays live"
    - claim: "the pull request path asks the registry for the instance mode"
      proof: "grep: instanceMode( in src/run-task.ts"
