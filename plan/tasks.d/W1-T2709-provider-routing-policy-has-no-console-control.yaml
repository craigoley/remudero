  falsifier: |
    Close without implementation if current main has a state-resident, live-reloaded provider
    routing policy with audited high-consequence console controls for automatic/preference,
    enabled providers, reserve and bounded parking; selection still enforces existing capacity
    eligibility; and applying it requires no daemon/container lifecycle action. A config form that
    edits a host file, a control that bypasses reserve, or a UI without a real worker consumer does
    not falsify the task.
