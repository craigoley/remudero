- id: W1-T3694
  title: "The deploy watchdog is DELIBERATELY blind to a stale-running daemon on a premise measured 2026-09-16 not to hold, and its liveness input has no producer anywhere in src/ — so every skip reads up-to-date while the review queue is stalled"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 10.00
  files:
    - src/lib/deployer.ts
    - src/run-task.ts
  origin: "operator-session#three-manual-fast-forwards-in-one-afternoon-2026-09-16"
  plan_refs: ["W1-T3245", "W1-T3240", "W1-T3691"]
  status: merged
  priority: 2
  attempts: 0
  note: |
    MEASURED 2026-09-16 on the Azure host. Every deploy tick in the window recorded the same line:

      deploy.skip  reason="up-to-date (install HEAD == origin/main; daemon liveness not observed)"

    while the daemon was behind origin/main and its reviewer was refusing to post verdicts
    (`review.skipped_stale_reviewer_code`, six pull requests, over an hour). The operator
    fast-forwarded the daemon's tree BY HAND THREE TIMES in one afternoon; each time reviews
    resumed within seconds.

    FACT 1 — THE LIVENESS INPUT HAS NO PRODUCER. `daemonAlive?: () => boolean | undefined` is
    declared in `TriggerInputs` and its own comment says "Omitted => liveness is simply not
    observed (today's behaviour)". `grep -rn daemonAlive src/` returns hits in deployer.ts AND
    NOWHERE ELSE: no caller supplies it. So `i.daemonAlive === true` is never reached, the
    dead-daemon restart arm at the top of `decideDeployTrigger` can never fire, and every skip
    line ends "liveness not observed" permanently. This is the W1-T126 shape — a consumer whose
    producer was never written.

    FACT 2 — THE TICK IS BLIND TO STALENESS ON A NAMED PREMISE. `decideDeployTrigger` computes
    `runningStale` correctly, then discards it:

      const restartReasons = i.imageDriftOnly === true ? false : behind || runningStale;

    W1-T3245's own comment states why, and states the premise in full:

      "that is a different event with a different cost and it is ALREADY HANDLED -- the daemon's
       own freshness check exits 75 and the entrypoint re-fetches, tens of times a day, in
       seconds."

    THE PREMISE IS THE DEFECT. It was true enough when written and was not re-measured. On
    2026-09-16 the daemon sat behind long enough to stall six reviews, three separate times.
  rationale: |
    THIS IS NOT A REQUEST TO UNDO W1-T3245. Its reasoning is sound: two actors racing on the
    daemon's own restart is worse than one, and a watchdog that recycles on mount staleness would
    duplicate a job the daemon does well in the common case. The tick should still not RESTART on
    `runningStale`.

    WHAT IS WRONG IS REPORTING "UP-TO-DATE" WHILE DECLINING TO LOOK. The skip line is the only
    thing an operator or an alarm reads, and it asserts a healthy state the tick did not verify:
    it did not observe liveness (it cannot), and it deliberately ignored `runningStale` (which it
    computed). A watchdog is permitted to decline to act. It is not permitted to report health it
    did not measure -- that is the "check that passes while comparing nothing" this repo refuses
    everywhere else.

    WHY IT COMPOUNDS W1-T3691. That task makes a repeated stale-reviewer skip ask for the restart
    the entrypoint already implements -- the repair. This one is the ALARM: the single external
    observer that could have said "the daemon is behind and its reviews are stalled" said
    "up-to-date" instead, which is why an hour passed before a human noticed. Fixing either alone
    leaves the other half silent.

    NO NEW PROBE IS BEING INVENTED FOR FACT 1. `runningHead()` is already supplied (from
    `readLatestBootSha`), and `rmd status` already renders a LIVENESS section from the process
    table. The producer exists; it was never wired to this consumer.
  design: |
    THE BAND RECORDS WIDTH, NOT DANGER. Two concerns are declared because FACT 1 IS ITSELF A MISSING
    EDGE between them: the consumer (`daemonAlive`) lives in deployer.ts and the caller that must
    supply it lives in run-task.ts. A task scoped to either one alone could not wire the producer at
    all, which is the whole subject.

    (i) THE SKIP LINE STATES WHAT IT MEASURED AND WHAT IT DID NOT. When liveness was not observed,
        or when `runningStale` was computed and deliberately ignored, the reason says so by name
        instead of "up-to-date". An unmeasured quantity is never reported as healthy.

    (ii) `satisfied` STAYS FALSE WHENEVER ANYTHING WAS UNMEASURED. It already gates on
         `daemonAlive === true`; that is correct and must not be loosened. This task keeps it and
         makes the REASON agree with it, since today a skip can read "up-to-date" while
         `satisfied` is `undefined`.

    (iii) THE LIVENESS PRODUCER IS WIRED. `deps.daemonAlive` is supplied from the same source
          `rmd status`'s LIVENESS section already uses. `undefined` remains a legitimate answer on
          a host where the probe cannot run, and it keeps meaning NOT OBSERVED -- it must never be
          coerced to `false`, because the restart arm acts on `false`.

    (iv) THE TICK STILL DOES NOT RESTART ON `runningStale`. W1-T3245's separation is preserved
         exactly. The change is to REPORTING and to a blocker row, never to the tick's action.

    (v) A STALE-RUNNING DAEMON RENDERS AS A BLOCKER. `rmd status` gains a row naming the running
        sha, origin/main, and that the tick is deliberately not acting on it -- so the state is
        legible to a human without tailing a ledger, which is how it was found.

    NO THRESHOLD. There is no number of commits or minutes above which this fires: it reports what
    each tick actually measured, on every tick.

    THE SUITE GOES IN test/the-deploy-tick-never-reports-health-it-did-not-measure.test.ts, kept
    out of files: for the reason W1-T3680 records.
  acceptance:
    - claim: "a tick that could not observe liveness says so instead of reporting up-to-date, so an unmeasured quantity is never rendered as healthy"
      proof: "unit test: an unobserved liveness tick does not report up-to-date"
    - claim: "a tick that computed runningStale and deliberately ignored it names that in its reason rather than omitting it"
      proof: "unit test: an ignored runningStale is named in the skip reason"
    - claim: "the liveness input is supplied by a real caller, so the dead-daemon restart arm is reachable rather than dead code"
      proof: "grep: daemonAlive: in src/run-task.ts"
    - claim: "the tick still declines to restart on runningStale, so W1-T3245's separation of the two actors is preserved"
      proof: "unit test: the tick does not restart on runningStale alone"
    - claim: "a stale-running daemon renders as a blocker naming both shas, so the state is readable without a ledger tail"
      proof: "unit test: a stale-running daemon renders as a blocker with both shas"
  falsifier: |
    Report up-to-date with liveness unobserved and the first test fails. Omit an ignored
    runningStale from the reason and the second fails. Leave daemonAlive unwired and the third
    fails. Restart on runningStale and the fourth fails. Render no blocker row and the fifth fails.
