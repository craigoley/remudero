- id: W1-T5483
  title: "THE RUN PREFLIGHT COMMENTS MATCH THE ONCE-PER-BOOT RULING — src/run-task.ts's containment and isolation preflight blocks still say \"Once per run, empirically confirm\" although W1-T5346 reuses a cached probe verdict per boot and input change"
  repo: remudero
  depends_on: [W1-T5411]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: low
  origin: "operator session 2026-10-03: found building W1-T5411 (PR #8913)"
  plan_refs: [W1-T5346, W1-T5411]
  files: [src/run-task.ts, test/the-run-preflight-comments-match-the-once-per-boot-ruling.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    W1-T5411 (PR #8913, open at 089b44df) rewrites the module headers of src/lib/containment.ts and
    src/lib/isolation.ts to the W1-T5346 ruling, under which probes are proven once per boot and again on
    any change of their inputs, keyed by `probeVerdictKey`. It does not touch src/run-task.ts. On origin/main
    491cd7d0, the run's two preflight comments still state the old contract. The "Post-spawn CONTAINMENT
    PREFLIGHT" block says "Once per run, empirically confirm an outside-cwd write is OS-DENIED" (the phrase
    wraps across two comment lines). The "Isolation PREFLIGHT" block says "Once per run, empirically
    confirm a worker inherits ZERO operator aliases/functions". The code under both comments already reads
    `cachedProof` (`probeCache.lookup(probeKey)`) and calls `reuseProof(...)` instead of probing when a
    verdict is cached.
  design: |
    Rewrite both comment blocks. Each probe is proven once per boot and on any change of its inputs
    (`probeVerdictKey`), reused through `reuseProof` otherwise, and never assumed from configuration.
    Cite W1-T5346. Comments only; no behaviour change. The new suite declares `@source-text-subject` as
    W1-T5411's suite does, finds each block by its PREFLIGHT heading, joins its comment lines so a
    wrapped phrase still matches, and asserts it no longer says "once per run" and names the ruling.
  acceptance:
    - claim: "neither run preflight comment block in src/run-task.ts still says the probe runs once per run, and each names the once-per-boot ruling and W1-T5346"
      proof: "unit test: test/the-run-preflight-comments-match-the-once-per-boot-ruling.test.ts"
  falsifier: |
    Leave either comment saying "Once per run" (today both do) and the suite fails on it, the wrapped
    containment phrase included.
