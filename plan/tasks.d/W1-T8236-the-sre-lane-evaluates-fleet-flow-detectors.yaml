    - claim: "a still-firing finding is re-ledgered at most once per short window"
      proof: 'grep: test("W1-T8236: a still-firing finding re-ledgers once per short window" in test/the-sre-lane-evaluates-fleet-flow-detectors.test.ts'
    - claim: "detector inputs are in the writer census"
