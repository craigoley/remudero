- id: W1-T3979
  title: "A LIVE IN-FLIGHT CLAIM IS A SCHEDULING DEFERRAL, NOT AN INDEPENDENT FAILURE — daemon.ts persists `blocked_inflight` as dispatch.blocked_independent and status.ts then permanently excludes a task whose worker was already making progress"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 30.00
  files: [src/lib/daemon.ts, src/lib/status.ts, test/inflight-contention-does-not-durably-block.test.ts]
  origin: "operator-session#three-daemon-followup-2026-09-21"
  plan_refs: ["W1-T1268", "W1-T2910", "W1-T3565"]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED LIVE WHILE RECOVERING CONSOLE UI-T43. A fresh operator-authorized run acquired
    UI-T43's real inflight lock and started a healthy worker. On the daemon's concurrent tick,
    the second admission correctly returned `blocked_inflight` before it could spawn a second
    worker. daemon.ts nevertheless followed its generic independent-failure arm and wrote
    `dispatch.blocked_independent verdict=blocked_inflight`. That row is later read by
    `latestIndependentFailureBlock` as a permanent failure, even though the first worker was
    still making forward progress. A lock that does its job therefore poisons the task it protects.

    W1-T1268 deliberately uses the existing `blocked_inflight` RunResult for a contested
    cross-host claim; that vocabulary is correct. The wrong consumer is daemon.ts's generic
    durable-block writer. W1-T2910 correctly made genuine independent failures survive restart,
    and W1-T3565 correctly exempted exactly `blocked_illformed`, a zero-cost admission defect.
    Neither covers a live contention outcome. The live lock and the normal in-flight selector
    already prevent a second worker from running; a permanent ledger block is redundant while
    the lock is live and harmful after it releases.
  design: |
    (i) Treat `blocked_inflight` as a transient scheduling deferral at the daemon's result
    boundary. It must not enter `independentFailureBlocksThisRun` and must not write
    `dispatch.blocked_independent` or `daemon.block.independent_failure`. The current tick may
    continue, while the live in-flight lock remains the actual exclusion until its owner finishes.

    (ii) Preserve durable failure semantics for every non-matching verdict. `blocked_review`,
    no_pr, failed, blocked_git_fetch, blocked_budget, blocked_containment, and unknown results
    continue through W1-T2910's existing writer unchanged. `blocked_illformed` keeps W1-T3565's
    special same-process admission behavior; do not merge these two distinct reasons into a broad
    "zero cost" exception.

    (iii) Repair the historical projection without rewriting ledger evidence. A retained
    `dispatch.blocked_independent` row whose exact verdict is `blocked_inflight` must not set
    `independentFailureBlocked`; it records a past contention incident, not a task failure. Keep
    the row readable for forensics. A later real independent block must still supersede that
    historical deferral, exactly as a later run currently supersedes an earlier block.

    (iv) Prove both producer and reader arms. Drive a real live lock through the daemon dispatch
    result and prove no durable block is emitted and no worker is double-spawned. Separately drive
    a historical retained blocked_inflight row through the status projection and prove admission
    is restored, while the same fixture with blocked_review remains blocked. No manual ledger
    deletion, timer tuning, provider routing change, or new retry loop is in scope.
  acceptance:
    - claim: "a live blocked_inflight claim is a scheduling deferral and is re-offered without a durable independent block"
      proof: "grep: W1-T3979 producer: blocked_inflight writes no durable block in test/inflight-contention-does-not-durably-block.test.ts"
    - claim: "a historical blocked_inflight row is re-admitted while a blocked_review row remains durably blocked"
      proof: "grep: W1-T3979 reader: a retained blocked_inflight row does not durably block in test/inflight-contention-does-not-durably-block.test.ts"
    - claim: "genuine independent failure handling remains durable and still excludes the task"
      proof: "grep: W1-T3979 falsifier: the identical fixture with blocked_review instead of blocked_inflight still durably blocks in test/inflight-contention-does-not-durably-block.test.ts"
    - claim: "the live inflight lock prevents a second worker spawn across repeated daemon ticks"
      proof: "grep: W1-T3979 concurrency: a real held inflight lock keeps the worker spawn count at zero across every tick in test/inflight-contention-does-not-durably-block.test.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTING if an actual `blocked_inflight` result already bypasses
    `dispatch.blocked_independent` and status.ts already treats its historical row as a deferral.
    At filing, the UI-T43 ledger contains the counterexample, daemon.ts's only special admission
    verdict is blocked_illformed, and status.ts maps every other durable row to blocked.

    THE NEGATIVE ARM is a real independent failure: mutate the fixture from blocked_inflight to
    blocked_review without changing its task, cost, or row order. It must remain durably blocked.
    A repair that releases both arms has weakened W1-T2910 rather than fixed contention.

    THE CONCURRENCY ARM is a still-live lock: while it exists, a second dispatcher must still
    spawn zero workers. A fix that merely stops writing a ledger row but starts a second worker
    would trade a stuck task for concurrent writes and is strictly worse.
  note: |
    Rule 25 CHECKED: the declared source paths are product scheduling and projection paths, not
    instrument surfaces. `risk: high`, `band_meaning: blast-radius` because a wrong classification
    either preserves the fleet-wide sticky block or permits concurrent workers against one task.
    This task is intentionally separate from W1-T3978: that task recognizes one producer-owned
    harness commit refusal after a worker completed; this task recognizes a pre-spawn live lock
    contention. Combining them would replace two exact predicates with an unsafe broad retry rule.
