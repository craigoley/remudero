    - claim: "the CLI resolves its pause target through the new resolver"
      proof: 'grep: resolvePauseTarget( in src/run-task.ts'
    - claim: "pause and resume refuse an absent configured root without recreating state"
      proof: 'unit test: W1-T7727: a missing configured root refuses pause and resume without recreating state'
    - claim: "a failed fleet anchor cannot delete an existing shared hold"
      proof: 'unit test: W1-T7727: a failed fleet anchor never clears an existing shared hold'
    - claim: "the real CLI refuses a rejected fleet hold update without reporting an existing hold absent"
      proof: 'unit test: W1-T7727: the real CLI refuses a rejected fleet hold update'
  falsifier: |
    Restore the old propagation (requestPause called with the real shared git deps from pauseCommand). The isolation test then
    finds refs/rmd-pause/hold on the fixture's bare origin, and the site, console and wild-trails instances' production
    checkSharedPause readers report held. The test fails.
