- id: W1-T7727
  title: "A PAUSE HOLDS ONLY THE INSTANCE IT TARGETS — `rmd pause` pushes the fleet-wide refs/rmd-pause/hold, and core, site and console all run the same checkout against the same origin, so pausing core for a serve window also halts site, console and any other host's daemon: the default pause and resume act on ONE instance resolved through the registry's state_dir, and the fleet-wide hold becomes a separate, explicit --fleet act"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — which instance a CLI pause or resume writes; the readers and the gates a pause holds are unchanged
  band_meaning: span
  origin: "operator ruling 2026-10-10: fix pause scoping before any serve restoration window (a core-only pause was the approved precondition)"
  plan_refs: [W1-T1216, W1-T2262, W1-T4429, W1-T3622, W1-T6640, W1-T5343, W1-T3732]
  files: [src/run-task.ts, src/lib/fleet-control.ts, src/lib/pause-target.ts, src/lib/status-board.ts, src/lib/config-schema.ts, docs/control-surface.md, docs/cli-reference.md, docs/operator-guide.md, test/a-pause-holds-only-the-instance-it-targets.test.ts, test/a-test-run-never-pauses-the-live-fleet.test.ts, test/pause-hold-is-attributable.test.ts, test/w1-t143-diff-coverage.test.ts, test/cli-reference.test.ts]
