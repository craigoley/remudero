  title: "A TEST SHARD CAN FAIL WITH NO `# tests` SUMMARY AND CI REPORTS IT IDENTICALLY TO A REAL FAILURE SET — MEASURED 2026-09-01 on PR #3542: shard 1 produced 161 KB of log, no `# tests`/`# pass`/`# fail` line anywhere, and went straight to `Process completed with exit code 1`, so nothing downstream can tell a run that FAILED from one that never REPORTED, and the fix rung would strike against evidence that does not exist"
