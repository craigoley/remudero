  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 37 merges were plan filings and amendments made by hand in operator sessions. It is the largest family.
    - A hand filing follows doctrine/plan-and-task-hygiene/file-from-the-operator-checkout.md: a worktree of the public repository, `rmd next-task-id --branch`, the fast plan lint, a commit, and a pull request.
    - No command tells a session where a new task file goes. A session that does not know of the switch files in the public repository.
    - This is one of five writer tasks. Each one waits for the readers of both catalogs.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. Removing `task` from the kinds turns this kind off.
  design: |
    Add the command `rmd plan-destination <kind>` to the command table in src/run-task.ts. It prints the result of `resolvePlanDestination`.
    Let the reservation of `rmd next-task-id` read the branch from the destination checkout when the working directory is there. The reservation ref stays on the public repository.
    Let the fast plan lint find the code root through the resolver when it runs in the destination checkout.
    Rewrite the doctrine page and the section of the operator guide in the writing standard, docs/plain-language.md.
    NOT IN SCOPE: the ship scripts of the operator sessions, which are in no repository (W1-T12169).
  falsifier: |
    Print the public repository with `task` on and criterion 1 must fail. Refuse a branch of the destination checkout and criterion 2 must fail. Remove the command name from the doctrine page and its criterion must fail. Restore and require all seven to pass.
