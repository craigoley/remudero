- id: W1-T9569
  title: "A REVIEW-ONLY LIGHT PASS NAMES ITS SCOPE — during the orphaned recycle PAUSE (2026-10-14 08:12-10:57Z) pause-clock review-only passes ledgered every fix and conflict stand-down as \"deferred to full sweep (light pass)\", hiding 487 PAUSE-held deferrals; the stand-down text and a new light_pass_scope field name the real scope (pause, drain, boot, idle or interphase-review)"
  repo: remudero
  depends_on: [W1-T9558]  # #11832 rewrote the same refill standDownReasonFor in src/lib/sweep.ts; build on top of it
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern (the review-only pass names its scope) across daemon.ts, run-task.ts and sweep.ts; no admission or dispatch decision changes
  band_meaning: blast-radius
  origin: "operator session 2026-10-14 (approved \"go\"): the orphaned recycle PAUSE read-out, 08:12-10:57Z, read only"
  plan_refs: [W1-T100, W1-T147, W1-T254, W1-T1211, W1-T2426, W1-T4053, W1-T4429, W1-T5343, W1-T8086, W1-T9558]
  files: [src/lib/daemon.ts, src/run-task.ts, src/lib/sweep.ts, test/a-review-only-light-pass-names-its-scope.test.ts]
