  priority: 1
  attempts: 0
  rationale: |
    OBSERVED 2026-10-14: an orphaned recycle PAUSE held core from 08:12Z to 10:57Z. Through it the pause review
    clock (`startInterphaseReviewClock(..., "pause")` in src/lib/daemon.ts) and the paused-phase light review
    (`daemon.sweep_light.review_only`) ran review-only passes. Each `blocked-fixable` and `conflicted` PR in them
    stood down with the `sweep.disposed` reason "NOT DISPATCHED this pass: deferred to full sweep (light pass)".
    That text blames the ordinary light-pass restriction, so 487 deferrals that the PAUSE caused read as routine
    light-pass deferrals, and nothing on the row said a PAUSE was holding the repair lanes.
    WHERE IT COMES FROM. `LightPassScope` (src/lib/daemon.ts) carries only `reviewOnly: boolean`. Five callers pass
    `{ reviewOnly: true }`: the interphase clock under scope "pause" or "drain", or with a pass or review already
    in flight; the paused-phase review (W1-T5343); the boot review; and the idle light pass.
    `buildSweepLightHook` (src/run-task.ts) folds all of them into `reviewOnly`, and `lightPassActionable(d,
    fixRungAllowed, false, !reviewOnly, !reviewOnly)` refuses the repair lanes. `runSweep` (src/lib/sweep.ts) then
    writes `deps.standDownReasonFor?.(disposition) ?? "deferred to full sweep (light pass)"`, and the light hook
    wires no `standDownReasonFor`, so every review-only scope gets the generic fallback. #11837 (W1-T8086's
    conflict round on the light pass) just touched `lightPassActionable`. It is not the defect: the refusal is
    right, but its name is wrong.
    SHARED SURFACE. W1-T100 (blocked_ci routing to the fix path) and W1-T147 (the overnight chaos drill) also
    declare src/run-task.ts, src/lib/sweep.ts or src/lib/daemon.ts. Neither names the light pass's stand-down text
    or a scope field. This task changes only what a review-only pass writes on its row, not what it does.
  design: |
    1. `LightPassScope` (src/lib/daemon.ts) gains `scope: "pause" | "drain" | "boot" | "idle" | "interphase-review"`.
       Each `sweepLight({ reviewOnly: true })` caller passes its own value. The interphase clock passes "pause" or
       "drain" from its scope, and "interphase-review" when it is review-only only because a pass or review is in
       flight. The paused-phase review passes "pause", the boot review "boot" and the idle light pass "idle".
       An ordinary pass still passes nothing.
    2. `buildSweepLightHook` (src/run-task.ts) wires `standDownReasonFor` when the pass is review-only. A disposition
       that `lightPassActionable` refuses reads "review-only <scope> pass: repair lanes closed until <the scope's
       end>" (for example "review-only pause pass: repair lanes closed until the PAUSE lifts"), never "deferred to
       full sweep (light pass)". The ordinary light pass keeps today's text unchanged. Keep W1-T9558's (#11832)
       review-lane admission (`isReviewLaneDisposition`) unchanged.
    3. `runSweep` (src/lib/sweep.ts) takes the scope on `SweepDeps` and writes `light_pass_scope: <scope>` on every
       `sweep.disposed` row that a review-only pass wrote. A query can then count pause-held deferrals without
       parsing prose (ledger-and-evidence-discipline: reason-from-the-decision).
    4. Tests drive `buildSweepLightHook` or `runSweepLightPass` with a `conflicted` and a `blocked-fixable` PR under
       each scope. Each asserts the stand-down text and `light_pass_scope`, and asserts that an ordinary pass keeps
       "deferred to full sweep (light pass)" and writes no `light_pass_scope`.
    Out of scope: which lanes a review-only pass admits (W1-T8086, W1-T9558), and the orphaned PAUSE itself.
  acceptance:
    - claim: "a review-only pause pass ledgers its fix and conflict stand-downs with the pause scope named in the text and in light_pass_scope"
      proof: 'grep: test("a review-only pause pass names the pause in its stand-down and light_pass_scope" in test/a-review-only-light-pass-names-its-scope.test.ts'
    - claim: "every review-only caller passes its own scope: pause, drain, boot, idle and interphase-review"
      proof: 'grep: test("every review-only light pass caller names its scope" in test/a-review-only-light-pass-names-its-scope.test.ts'
    - claim: "an ordinary light pass keeps the deferred to full sweep text and writes no light_pass_scope"
      proof: 'grep: test("an ordinary light pass keeps its deferral text and writes no light_pass_scope" in test/a-review-only-light-pass-names-its-scope.test.ts'
  falsifier: |
    Drop the scope from `buildSweepLightHook`'s `standDownReasonFor` so it falls back to the generic text: the pause
    test reads "deferred to full sweep (light pass)" and fails. Pass `{ reviewOnly: true }` without a scope at the
    boot caller: the caller test fails naming boot. At origin/main the test file does not exist.
