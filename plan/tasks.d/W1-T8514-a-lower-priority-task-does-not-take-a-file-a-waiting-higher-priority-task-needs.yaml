  falsifier: |
    In-flight A holds X. Dispatch order is [P1 B (X + Y), P2 C (Y), P2 D (Z)]. After W1-T8502 alone, the pack
    skips B for its overlap with A and takes C, and the refill starts C, so B now waits on A AND C. With this
    task the pack defers C for B and the refill starts D. Remove the reservation and the first test starts C.
    Tick shape, with nothing in flight and three lanes: dispatch order [P1 H (R), P1 W (R + S), P2 C (S),
    P2 D (T)] dispatches [H, C, D] today. With the fix it dispatches [H, D], and W is serialized behind H. Make the release comparison non-strict, or drop the outran-history
    arm, and the release test reads the wrong pick. Drop the callback wiring and the log test sees no
    dispatch.deferred_for_priority row.
