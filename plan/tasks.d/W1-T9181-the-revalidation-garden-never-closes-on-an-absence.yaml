- id: W1-T9181
  title: "THE REVALIDATION GARDEN'S FIRST SHADOW PASS WOULD HAVE CLOSED A LIVE ESCALATION ON A MISREAD STEP NAME — #10269 (the ci-friction gardener's filing fails) was judged resolved because the evidence pack read `ci-friction.garden_filing_failed` as `friction.garden_filing_failed`, a step nothing writes, and its zero rows reached the judge as proof of a fix, while the real step had a row at 14:16Z and the fleet re-observed the condition at 11:02Z the same day: step names keep their hyphens, a zero for a step no code writes is told to the judge as no evidence, and an absence-only citation or a re-observed escalation never closes"
