  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    `>=2 subsystems while risk<high`, and `files:` spans `src/lib/`, `src/` and `test/`. The band is
    Rule 19's SPAN, not blast radius: the runtime effect is one empty commit per PR per merged fix
    class, capped.

    HOW THIS DIFFERS FROM ITS TWO ADJACENTS, both merged and both cited above.
    W1-T459 is the task that ORDERED this filing: it rejected a re-run rung for flakes and said the
    callerless rung's own defect \"is separate and is NOT this task … File that separately; do not fold
    it in here\". This is that separate filing, and it obeys W1-T459's constraint — a flake has no
    merged fix PR, so no flake row is proposed here.
    W1-T456 is the same ROOT (a filing PR that no rung can route because it has no resolvable task id)
    but the opposite REMEDY: W1-T456 makes a filing repairable, whereas this task makes a red OBSOLETE
    so no repair is needed. They compose; neither subsumes the other, and this one deliberately does
    not touch `resolveOpenPrTaskId`.
    W1-T405 is adjacent and NOT the same: it asserts base currency at DISPATCH, before a worker run
    starts. This task acts on PRs that already exist and are already red.

    `files:` COVERS THE EXISTING TESTS THAT PIN THE SHAPES THIS TASK CHANGES.
    `test/post-fix-reverification.test.ts` holds the rung's 16 existing invocations and is where the
    two new rows and the wiring are proven. `test/sweep-absent-repush.test.ts` pins the
    `repushAbsent`/`pushEmptyCommit` wiring this task reuses for its own effect.
    `test/sweep-blocked-routing.test.ts` pins the blocked-routing order the new rung must precede.
    `src/lib/ledger.ts` is DELIBERATELY ABSENT: `sweep.post_fix_redriven` is ALREADY registered in
    `DECISION_RELEVANT_LEDGER_STEPS`, so no ledger change is owed and adding the file would widen the
    span for nothing.
    THE SHARD'S OWN PATH IS NOT IN `files:`, which costs the endemic `proof-scope` warnings. Adding it
    is strictly worse: a plan-scope path beside `src/` at `verify: auto` destroys the reviewer's
    filing carve-out and converts those warnings into one hard `rule15-filing` violation."
