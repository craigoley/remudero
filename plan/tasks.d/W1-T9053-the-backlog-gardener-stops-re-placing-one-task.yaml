    - `judgeBacklog` sets band 2 when `recent > previousDay`. W1-T6117 cites routine high-volume steps (`pr.opened`,
      `run.awaiting_external`), so that comparison crosses back and forth every hour.
    - `applyBacklogActions` rewrites the marker even when main already carries the target band, because the daemon's plan
