  design: |
    1. `applyBacklogActions` skips a task whose marker on the fresh workspace already carries the target band.
    2. Hysteresis: a gardener-marked task is re-banded at most once per 24h, and band 2 needs a clear rise (e.g.
       `recent >= 2 * previousDay`), not any rise.
