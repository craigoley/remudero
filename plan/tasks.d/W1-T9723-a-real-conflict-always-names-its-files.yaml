  falsifier: |
    On main, pass two of the #11991 reproduction (same head, mergeability unread, ledger row from pass one) disposes
    `blocked-ambiguous` "files: none captured", so the first test fails. If the row writes `conflict_files` but
    inheritance ignores it, or inheritance reads a field the row never writes, it still fails. Carry evidence across
    a head change, and the test's new-head case disposes conflicted when it must not. Leave the gap unnamed, and the
    second and third tests fail on the reason text.
