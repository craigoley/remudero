      proof: "grep: producerAudit( in src/lib/preopen-gate.ts"
  rationale: |
    OBSERVED 2026-11-03: of five review FAILs triaged by hand that afternoon, four were the same shape, a new test supplying an input that no production code produces:
    - #16412: reviewLoad is supplied only by fixtures.
    - #16452: runDetachedWork never passes onPhase, so 'review:posted' never reaches status.json.
    - #16474: setup_ms and proofs_ms are never written, and reviewCpuChildren is never populated.
    - #16441's first finding: a window join no production timing can satisfy.
    Each test passed, each feature was dead in production, and each cost the fleet at least one review cycle plus a fix round.
    MEASURED over the 7-day core ledger union (read-only): 21 of 485 review.finding mechanisms (4%, 17 PRs) state this shape in explicit words such as "no production producer", "only by fixtures" or "never populated". The regex is conservative and misses paraphrases, so the true share is higher. That afternoon's triage reads 4 of 5.
    WHY BEFORE THE PR, AND WHY SHADOW: the builder still holds its context before the PR opens, and handing it the gap there is a continuation (renderPreopenGatePrompt), not a new fix round. But a judge can be wrong in both directions. So it records first: W1-T11105's shape, a shadow measured against an outcome the operator then decides on. The outcome here is the reviewer's own later finding at the same head.
  design: |
    1. src/lib/producer-audit.ts: producerAudit({ diff, tree, judge }) asks the cheap judge lane (the same mount family the CI-escalation and machine-filing judges use) one bounded question. It names the inputs the diff's tests supply that production must also supply (new optional fields, seams, deps entries, ledger fields read) and the production producer of each, citing file:line in the tree. The answer is parsed into { audited: true, inputs: [{ name, producer: "path:line" | null }] } or { audited: false, reason }.
    2. src/lib/preopen-gate.ts: after the fast gate settles and before the push gate, when the policy switch is on (default shadow), run producerAudit with the gate's own diff and add producer_audit to the result. preopenGateLedgerFields carries unproduced, inputs_audited and the judge provenance. Nothing is handed to the worker in shadow.
    3. A pure scoring helper (exported from producer-audit.ts) joins implement.preopen_gate rows to later review.finding rows at the same head, by input name appearing in the mechanism, and returns hits, misses and unflagged audits.
    4. Promotion (a separate operator-approved change): after about a week, report hit and miss counts and the false-flag rate. Then the operator decides whether an unproduced input becomes a pre-open continuation.
  falsifier: |
    At origin/main nothing before review checks whether an input a new test injects has a production producer. The implement.preopen_gate row has no producer_audit field.
