  rationale: |
    THE CLARIFICATION LOOP IS BUILT AND FENCED INTO ONE SUBJECT. `generateGapQuestions`,
    `generateGoalElicitationQuestions` and `generateOnboardQuestions` produce questions;
    `validateQuestion`/`validateQuestions` check them; `unansweredQuestions` and
    `assertAnswersComplete` refuse to proceed while any remain. There is a `plan/questions.ndjson`
    and a console route that answers one. All of it is reachable only from onboarding.
    SURFACE 1 question generators shipped today = 3
    SURFACE 2 of those, importers outside the onboarding directory = 0
    SURFACE 3 questions the plan has recorded = 2
    SURFACE 4 feedback entries already landed = 155
    SURFACE 5 console routes shipped today = 40

    UNDERSTANDING IS THE ABSENCE OF UNANSWERED QUESTIONS, NEVER A MODEL SAYING IT UNDERSTOOD. This
    is the design decision the task turns on. A comprehension check that asks a model "do you
    understand?" gets yes, always, and is worth nothing. `assertAnswersComplete` already encodes the
    honest version — proceed only when the unanswered set is empty — and reusing that predicate is
    what makes this checkable rather than a vibe.

    THE CLARIFICATION GOES BACK INTO THE THREAD, WHICH IS WHY IT DEPENDS ON TWO TASKS. A question
    that arrives anywhere other than the conversation it belongs to is a second inbox. It appends to
    the thread W1-T2494 defines, through the reply route W1-T2496 ships, so an operator answering
    reads it as the colleague coming back with a question rather than a new ticket.

    RECON RUNS BEFORE THE QUESTION, NOT INSTEAD OF IT, AND THAT ORDER IS THE WHOLE VALUE. A
    colleague who asks what they could have looked up is worse than one who asks nothing. So the
    interpreter researches first and asks only what research could not settle, and every question it
    does ask states what it already established — which is also what stops the loop asking the same
    thing twice.

    IT ASKS, IT DOES NOT ACT. Nothing here dispatches, ratifies, files a task or arms anything;
    reaching "understood" is a state on a thread and W1-T2500 owns what happens next. That split
    keeps the comprehension logic reviewable on its own, and keeps a model's reading of a sentence
    from being one step away from a spend.

    THE BOUND MATTERS BECAUSE A LOOP THAT CAN ASK FOREVER IS A DENIAL OF SERVICE ON AN OPERATOR.
    Rounds are bounded; on exhaustion the thread reports what remains unresolved and stops, rather
    than asking a sixth time or silently proceeding on a guess.

    NOT IN SCOPE: moving or rewriting the onboarding generators, which keep their current behaviour
    and callers exactly; the execution handoff and any fan-out, which W1-T2500 owns; and the
    inbound direction, which W1-T2498 owns.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: two src stems plus a test, carrying two
    independent acceptance concerns — the comprehension predicate and the bounded round trip.
