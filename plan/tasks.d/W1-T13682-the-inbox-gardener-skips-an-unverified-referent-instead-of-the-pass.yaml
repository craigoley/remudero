  rationale: |
    WHY: Craig ruled 2026-11-18 12:11Z (decision card "Skip only those items"): an unverifiable item is skipped and
    recorded, and the gardener still judges the rest. Shadow mode stays on.
    OBSERVED on the host 2026-11-18 05:00-06:52Z: every inbox.gardener_pass ended source_partial with gap
    coverage:github. state/inbox-classification.json at 06:29Z held exactly 2 classifications with referentUnverified
    (operator-test:console-answers-20261118-a and -b, whose originatingItemId names no board item) and 0 indeterminate
    projection entries; attentionCensus.sources.githubProjection was partial. Two test items out of about 2,400 stopped
    every pass until a thread removed them by hand at 06:52Z.
    READ at origin/main: panel-graph.ts sets githubProjection partial when any projection value is indeterminate OR any
    classification has referentUnverified (inbox.ts resolveBoardReferent returns unreadable). inbox-gardener.ts capture
    copies that value into coverage.github, and inboxGardenerGaps turns any non-observed coverage into a whole-pass refusal.
  design: |
    INVARIANT indeterminate-projection-stays-partial: an indeterminate projection value (a task merge fact GitHub did
    not answer) still makes coverage.github partial and the whole pass refuses, as today.
    1. In capture, collect the snapshot classifications with referentUnverified. When the census says githubProjection
       partial, the snapshot's projectionIndeterminate is exactly false, and at least one referent is unverified, the
       pack's coverage.github is observed. Any other value is passed through unchanged.
    2. Each candidate whose proposal is in that set carries referentUnverified: true.
    3. The pass loop skips a marked candidate before any proof, judge or retirement, storing decision defer_source with
       a digest that can never equal a real semantic input, so a later verified read re-judges it.
    4. The pass result carries unverified_referents: <count over the whole pack> when it is non-zero, so the gap is
       still recorded in the inbox.gardener_pass row.
  falsifier: |
