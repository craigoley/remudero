      proof: "unit test: test/lint-plan-proof-discrimination.test.ts"
    - claim: "a forward-referencing proof, naming a test the task's own PR will create, is NOT reported, so the healthy majority case stays silent"
      proof: "unit test: test/lint-plan-proof-discrimination.test.ts"
    - claim: "the check is silent when the base predicate is absent, so the whole-plan and pre-dispatch passes never report the standing population"
      proof: "unit test: test/lint-plan-proof-discrimination.test.ts"
    - claim: "the check warns and never blocks, so a repair whose target test is red at the base is not refused on a heuristic"
      proof: "unit test: test/lint-plan-proof-discrimination.test.ts"
    - claim: "the linter still reads no disk and shells no git, the base fact arriving only through the injected predicate"
      proof: "unit test: test/lint-plan-proof-discrimination.test.ts"

  falsifier: |
    THE CENSUS IS CRITERION ONE AND IT CAN END THIS TASK. Re-derive the biting population on a
    FULL-HISTORY checkout: for each shard, resolve the commit that ADDED it and ask whether each
    pure-path `unit test:` proof's path existed at that commit's PARENT. The 749 figure in the
    rationale is the wrong measurement and must not be reused. THE FLOOR, STATED BEFORE THE WORK:
    under 15 shards where a proof named an already-existing file at its own filing base, close this
    task UNBUILT with the measurement recorded — the rule then belongs in prose alone, and one
    confirmed instance is an anecdote rather than a population.

    CLOSE THIS TASK WITHOUT IMPLEMENTATION if `lint-plan` already reports proof staleness under any
    name. `proof-dialect`, `proof-resolvability` and `proof-scope` are NOT that check: shape,
    existence-now, and declared-scope membership are three different questions, and none consults a
    base ref.

    THE FALSE-POSITIVE DIRECTION IS THE ONE THAT SINKS THIS. Prove the forward-referencing case
    stays silent against a REAL shard whose test did not exist at its filing base, not only against
    a synthetic fixture. A check that fires on the healthy majority is a regression even if every
    true positive it finds is real.

    Do NOT discharge this by blocking rather than warning, by making the linter read disk or shell
    git, by wiring the predicate into the pre-dispatch call site, or by changing what review does
    with an `executed_stale` verdict.

