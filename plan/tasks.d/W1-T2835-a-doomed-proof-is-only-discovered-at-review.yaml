  rationale: |
    THE RULE EXISTS AND NOTHING REFUSES IT. CLAUDE.md now states that `classifyBaseProofOutcome`
    (`src/lib/review.ts`) decides staleness by RE-RUNNING a proof against the merge-base, so a
    pure-path `unit test:` proof discriminates ONLY where its file is absent or failing there — and
    that a task REPAIRING an existing test can therefore never prove itself that way. That rule is
    prose. CLAUDE.md's own preamble says a rule stated only there "can be violated silently and
    repeatedly", and that when one turns out to matter the fix is to make something refuse it.

    THIS ONE TURNED OUT TO MATTER, MEASURED ON A REAL SHARD RATHER THAN IMAGINED. W1-T2813 was
    filed with four acceptance criteria, all pure-path `unit test:` proofs naming
    `test/the-wipe-test-can-only-ask-about-learnings.test.ts` — a file that already existed on main,
    because that task's whole purpose was to REPAIR the test in it. `lint-plan` reported zero
    violations for the shard; a control run without it gave the identical rc and failing count. The
    defect surfaced only when its builder read `classifyBaseProofOutcome` by hand, one PR later. The
    filing and the build were the same session, so nothing external caught it either.

    THE LINTER ALREADY POLICES TWO OF THE THREE QUESTIONS AND SAYS SO IN ITS OWN COMMENT: it
    "validates proof SHAPE (proof-dialect) and RESOLVABILITY (proof-resolvability), never whether
    the artifact a proof names is inside" scope. Discrimination is the third question and no check
    asks it. VERIFIED by reading, not by a bare count: the four `merge-base|origin/main|baseCwd|
    classifyBase` hits in `src/lib/task-linter.ts` are all prose in comments about private
    advisories and shard filing; none is a base-aware proof check.

    THE MIRROR OF A CHECK THAT ALREADY EXISTS. `proofResolvabilityViolations`'s own `LintOpts` doc
    records the exact tension this task completes: "a queued task's proof legitimately
    FORWARD-REFERENCES the test its own PR will create, and this check cannot tell that apart from
    a dead reference pre-dispatch." That check reasons about the CURRENT tree and treats absence as
    the ambiguous case. This one reasons about the BASE tree, where absence is the HEALTHY case and
    PRESENCE is the defect. The two are complementary readings of one fact and must not be merged:
    resolvability asks whether the artifact will ever exist, discrimination asks whether it already
    did.

    THE RAW COUNT OVER-COUNTS AND IS NOT THE CENSUS. Over the 1037 shards in `plan/tasks.d/` that
    carry an acceptance block, 838 use at least one pure-path `unit test:` proof and 749 name a test
    file present in the tree TODAY. That 749 is NOT the biting population and must not be quoted as
    one: most of those tasks have MERGED, so the file exists now precisely because that task created
    it — at filing time it was a healthy forward reference. The honest figure needs each shard
    evaluated at ITS OWN filing base, which this filing session could not compute (shallow clone, 88
    commits). Sizing the real population is the builder's first criterion, below, and the floor is
    stated before the work rather than after it.

  design: |
    Add ONE check to `src/lib/task-linter.ts`, joining `proof-dialect` / `proof-resolvability` /
    `proof-scope` as a fourth member of that family rather than a new mechanism. Name it for the
    question it asks, not for the failure it predicts.

    THE LINTER IS PURE, SO THE BASE FACT ARRIVES BY INJECTION — do not make this module read disk
    or shell git. Add a `LintOpts` predicate answering "did this repo-relative path exist at the
    base ref", the base-tree counterpart of the existing `moduleExists`, and follow the contract
    that opt's own doc already sets: ABSENT ⇒ THE CHECK IS SILENT. Three checks already model this
    (`moduleExists`/`callSiteViolations`, `blockedDisposition`, `newMonolithIds`), and two of them
    fire only in the `--base` pass for the same reason this one must: a whole-plan run has no base
    to compare against and must not report the standing population.

    WARN, NEVER BLOCK. "The file exists at base" is a HEURISTIC for "the proof passes at base",
    which is what actually makes it stale. A repair whose target test is currently RED at base
    discriminates correctly and would be refused by a blocking arm — a false positive on a
    legitimate shape. Match `proof-scope`'s default (`warn`) and give the severity an override in
    `LintOpts` exactly as its siblings do, but wire no call site to `block`.

    A FORWARD-REFERENCING PROOF MUST NOT WARN. The healthy TDD case — a proof naming a test the
    task's own PR will create — is the majority and the whole point of the pure-path form. A check
    that warns on it would be worse than the gap it closes, because it would train readers to
    ignore the new row. Pin that direction with its own test, not only the positive one.

    The message must name the CONSEQUENCE, not the shape: that `classifyBaseProofOutcome` re-runs
    this proof at the merge-base, that passing there grades `executed_stale`, and that the criterion
    then degrades to the keyword floor SILENTLY. A reader who sees only "this file exists at base"
    cannot act on it.

    Wire the predicate at `lint-plan`'s `--base` pass in `src/run-task.ts` and nowhere else. That
    file is declared and the serialisation cost is accepted in writing (W1-T471). Do not touch the
    pre-dispatch call site: a queued task's proof legitimately forward-references, and that site
    already demotes `proof-resolvability` to `warn` for exactly this reason.

    Do NOT change `classifyBaseProofOutcome`, `judgeCriterion`, the `executed_stale` verdict, or any
    review-time behaviour. This task moves the discovery EARLIER; it does not alter what review does
    when it discovers it.

  acceptance:
