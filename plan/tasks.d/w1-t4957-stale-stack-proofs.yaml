  title: "A RED proof-discrimination CHECK NEVER REACHES THE PROOF-AMENDMENT LANE — the sweep routes it to a ci-log worker that can only edit code, so a stacked child whose parent merged its proofs stays red while the fix lane merges main into it (#8080/#8088, 2026-09-30)"
