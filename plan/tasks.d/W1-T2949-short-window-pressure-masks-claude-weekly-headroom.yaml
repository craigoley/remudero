    - claim: "when Claude reports no weekly window, allocation falls back to the existing session window without inventing zero or full headroom and without making a readable provider unreadable"
      proof: "unit test: test/worker-provider.test.ts"
    - claim: "the Claude allocation projection contains only bounded names, percentages and reset timestamps already returned by the single capacity read, with no credential or raw response data"
      proof: "unit test: test/worker-provider.test.ts"
    - claim: "deterministic squared weighting, explicit provider preference, model-health routing and provider-consumption attribution remain unchanged outside the Claude allocation-window projection"
      proof: "unit test: test/worker-provider.test.ts"
    - claim: "the implementation adds no capacity probe, worker dispatch, retry, timer, polling, merge, build, deploy, restart or lifecycle action"
      proof: "unit test: test/worker-provider.test.ts"
  falsifier: |
    Close without implementation if current main already keeps Claude's five-hour window as a hard
    eligibility guard while weighting Claude-versus-Codex automatic allocation from comparable
    weekly subscription windows, and the captured 54/7/5 versus 29 shape produces a Claude-majority
    deterministic sequence. A selector that removes the five-hour hard gate, compares the five-hour
    percentage directly with a weekly percentage, or waits for that short window to reach the reserve
    boundary does not falsify this task.
