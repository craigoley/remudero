  rationale: |
    OBSERVED ON MAIN AT 547790d6 AND ON THE AZURE FLEET AT 2026-09-06T08:17Z.
    `claudeCapacityFromUsage` exposes the five-hour session window and both weekly windows only in
    `ProviderCapacity.windows`. `providerAllocationWindows` therefore falls back to that complete
    set, and `tightestRemaining` uses the minimum remaining percentage even though the windows have
    different horizons. In the captured fleet decision, Claude was 54% used in its five-hour
    window, 7% used weekly across all models and 5% used in the scoped weekly bucket; Codex was 29%
    used in its weekly allocation window. The selector compared Claude's 46% five-hour remainder
    with Codex's 71% weekly remainder and assigned Codex a 72.155% automatic share. The operator's
    long-horizon subscription posture was the reverse: Claude had at least 93% weekly remaining and
    Codex had 71%.

    THIS IS NOT W1-T2871. That task correctly separates an independent Codex model bucket from the
    standard Codex provider-pressure bucket, but it explicitly leaves Claude's allocation projection
    as its existing session-plus-weekly set. Once W1-T2871 lands, the cross-provider comparison would
    still place a five-hour Claude window and a weekly Codex window on the same scale. W1-T2859 owns
    the deterministic weighted sequence, which this task preserves. The other live surface overlaps
    answer unrelated questions: W1-T2711 publishes and controls the account-visible Codex model
    inventory, while W1-T2748 makes a read-only Codex reviewer start outside a Git repository. Neither
    changes Claude's capacity projection or the horizons compared by automatic provider allocation.

    BURST SAFETY AND ALLOCATION ARE DIFFERENT DECISIONS. Every live window must remain readable,
    valid and above the reserve before Claude is eligible; a pressured or exhausted five-hour window
    must still stop new Claude admissions. Among providers that passed those hard gates, however,
    the long-running daemon should distribute work using comparable subscription-horizon headroom.
    Otherwise an ordinary five-hour burn cycle can divert most of the fleet away from a newly reset
    weekly Claude allowance and consume the scarcer Codex subscription first.
  design: |
    Give Claude an explicit `allocationWindows` projection without changing its existing `windows`.
    When at least one readable weekly window exists, the allocation projection contains the bounded
    weekly windows and excludes the five-hour session window. When no weekly window is reported,
    omit the projection so the existing `providerAllocationWindows` fallback uses the session window
    rather than inventing headroom or making Claude unreadable.

    Keep eligibility and reserve enforcement on the complete existing `windows` array. Keep the
    deterministic W1-T2859 squared weighting, explicit provider preferences, model-health routing,
    account labels, capacity reads and provider-consumption attribution unchanged. W1-T2871 remains
    responsible for the corresponding Codex model-versus-provider projection and console labels;
    this task changes only which already-read Claude windows feed cross-provider allocation.

    Emit the bounded Claude allocation-window projection through the already-existing provider
    telemetry and durable routing snapshot path. Add no probe, timer, worker, retry or lifecycle
    action. The captured 54/7/5 Claude versus 29 Codex shape must become Claude-majority while both
    providers remain sampled by the deterministic weighted sequence.
