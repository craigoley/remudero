- id: W1-T11851
  title: "rmd plan run from a non-interactive shell pushes its task-id reservation refs and its run branch through the host GitHub App identity, minted at the git credential-helper boundary. No GH_TOKEN or App variable enters the planner's environment; GitHub reads stay on the broker; and a host whose credential source is present but unusable gets a named refusal before any id is claimed or any worker spawns"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high  # Rule 19: one concern, which credential the plan lane's own git pushes present. A wrong source widens a token or strands reserved ids
  band_meaning: blast-radius
  priority: 1  # a planner launched from a non-interactive shell cannot reserve ids or push, so architect filings stall
  origin: architect
  plan_refs: [W1-T5115, W1-T9083, W1-T2699, W1-T9669, W1-T11774, W1-T9680, W1-T6148, W1-T9488, W1-T11789]
  files:
    - src/lib/secret-boundary.ts
    - src/run-task.ts
    - test/plan/a-non-interactive-planner-pushes-through-the-host-credential-helper.test.ts
  status: merged
  attempts: 0
  rationale: |
    ORIGIN: operator initiative from the PR #17348 recovery, gap B. Planner git pushes and task-id reservation fail
    from non-interactive shells, because the only token is an interactive-only ~/.bashrc export. Bash reads ~/.bashrc
    only for an interactive non-login shell (https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html).
    READ in this worktree (symbols, not lines):
    - src/run-task.ts planCommand mints, then reserves the remote id block with
      `gatedRemoteRefReserver({ lane: "plan", run: gitRunAdapter((args) => hostWorktreeGitResult(worktreePath, args)) })`.
      Once the worker finishes it calls `gitPushRunBranchAsync(worktreePath)`, and in its finally it releases unfiled
      ids with `releaseUnfiledReservations` over hostWorktreeGitResult(repoDir).
    - src/lib/worktree-git.ts harnessCredentialConfig resets credential.helper. It re-adds the harness socket helper
      only when harnessCredentialSocket is set AND the worktree's config.worktree is wired to it. Otherwise it re-adds
      the system and global helpers.
    - Only two callers set the socket: the daemon (startDaemonGitCredentialSocket, W1-T5115) and a run child
      (startRunChildGitCredentialSocket, W1-T9083). planCommand starts neither. So an operator-launched `rmd plan`
      uses whatever global helper the account has, and that helper gets nothing when the token only exists in an
      interactive shell. git then fails with "could not read Username" (the W1-T9680 shape), which is not a hang.
    Settled by lookup: is this already filed or already decided? -> No.
      - W1-T5115 (merged) wires daemon-dispatched workers and leaves "direct rmd run-task and an App-unconfigured host"
        ambient. It decides nothing for `rmd plan`.
      - W1-T9083 (merged) covers run children. W1-T11774 (queued) narrows a read token for the host watchdog.
      - W1-T11693 (queued, PR #17494) clears host-profile functions in WORKER login shells. That is a different
        surface.
      No shard names planCommand's credential source (grep of plan/ for planner plus auth, credential and push).
    Settled by lookup: what existing host credential source is there, without .bashrc? -> The host instance registry at
      DEFAULT_HOST_INSTANCE_REGISTRY_PATH (/etc/remudero/daemon-instances.yaml, src/lib/instance-registry.ts). It records
      gh_app_id, gh_app_installation_id, gh_app_private_key_path and gh_app_private_key_host_path. The
      host_alert_key_path rule in deploy/install-host-units.sh maps the container key path onto the host: the explicit
      host path, else the claude_dir file behind /home/node/.claude/. W1-T9669 and W1-T11774 already use this App
      identity for host children. No new App, key, PAT or token store is needed.
    Settled by lookup: can the mint take the identity without touching process.env? -> Yes. mintScopedToken
      (src/lib/github-app.ts) reads `opts.env ?? process.env`, so a private env object works. It mints a token scoped
      to one repository, and refuses a pathless request instead of widening it (the W1-T2699 useHttpPath note in
      wireCredentialHelperSocket).
    Settled by lookup: must the socket run off the main thread? -> Yes. The reservation pushes are synchronous
      (hostWorktreeGitResult), and an in-thread socket deadlocks a synchronous git (MEASURED, W1-T5115; see
      startSocketThread's doc). startRunChildGitCredentialSocket with no injected mint already uses the socket thread.
    Settled by lookup: do planner GitHub reads already go through the broker? -> Yes. openPrMintTexts reads through
      ghJson, and src/lib/github-transport.ts routes reads through brokerGhRead (gh-read-broker-client.ts). This task
      leaves that path alone.
    Settled by lookup: does an open PR already touch this? -> No. The 3 open PRs on 2026-11-09 are #17505 (+3/-8 against
      main), #17494 (+3/-12, worker-home) and #17485 (+12/-3, ops-catalog). None touches secret-boundary.ts,
      worktree-git.ts, task-id-reservation.ts or planCommand
      (https://api.github.com/repos/craigoley/remudero/pulls?state=open, compare main...head for each).
    Settled by lookup: should the PR-create write be folded into this task? -> No. It is a gh REST subprocess whose
      credential comes from its env, not from git (runGhPrCreate's exec, prCreateArgv in src/run-task.ts). So it is
      a separate concern with its own refusal, filed as W1-T11864, which depends on this task's resolver. On
      2026-11-09 no open PR (#17511, #17505, #17494, #17485) touched either surface.
  design: |
    OWNER: planCommand in src/run-task.ts owns the socket's lifetime. src/lib/secret-boundary.ts owns the resolver and
    the identity-carrying mint. worktree-git.ts, task-id-reservation.ts, github-app.ts, the gh read broker and the
    daemon are unchanged.
    1. RESOLVE. Add an exported `plannerHostGitCredential(ownerRepo, { registryPath?, access? })` in secret-boundary.ts.
       It reads the registry with parseInstanceRegistry and selects the instance whose github_repo equals ownerRepo.
       It returns one of:
       - {kind: "app", appId, installationId, keyPath} when exactly one matching instance names all three. keyPath
         follows the host_alert_key_path rule. It is checked readable with fs.access(R_OK); the bytes are never
         read here.
       - {kind: "ambient"} only when the registry file does not exist (ENOENT), for example a Mac operator account.
       - {kind: "refused", reason} in every other case: unreadable or malformed registry, no matching instance,
         several matches with different identities, a missing field, or an unreadable or unmappable key path.
    2. MINT AT THE HELPER BOUNDARY. For "app", planCommand starts startRunChildGitCredentialSocket with runDir
       `<config.root>/tmp/plan-cred-<runId>` (mode 0700; an overlong path refuses, as that function already does).
       It passes the identity to the socket thread through workerData: ids and key PATH only, never key bytes or a
       token. realScopedMint calls mintScopedToken with a private env object holding exactly GH_APP_ID,
       GH_APP_INSTALLATION_ID and GH_APP_PRIVATE_KEY_PATH. planCommand then calls
       wireCredentialHelperSocket(worktreePath, socketPath) on the plan lane's own worktree. sharesHarnessCheckout
       guards it so it never wires repoDir or the operator checkout. All of this happens before the remote
       reservation, so the reservation pushes, the run-branch push and the finally-block release all present the
       scoped token.
       Teardown order in the finally: releaseUnfiledReservations, then unwireCredentialHelperSocket(worktreePath),
       then close the socket. The release still needs the credential, so it goes first.
    3. NO AMBIENT TOKEN. planCommand never assigns GH_TOKEN or GH_APP_* to process.env or to the plan worker's spawn
       env. The minted token exists only in the socket thread's memory. Ledger rows stay value-free
       (boundary.request).
    4. FAIL CLOSED.
       - "refused", or a socket that fails to start: ledger plan.credential_refused {reason, registry_path} and return
         non-zero BEFORE any reservation push and before any worker spawn, so no id is claimed and no paid worker
         starts.
       - A mint refusal during the run: the push fails through today's classified paths
         (plan.id_reservation_failed, or the push error), and the finally block still releases what it holds.
       - "ambient": today's system and global helper path, byte for byte. Keychain and token storage are not touched,
         and nothing falls back to an ambient GH_TOKEN this code supplies.
    5. READS UNCHANGED. openPrMintTexts and every other planner GitHub read keep going through github-transport and
       the broker. The resolver never calls gh.
    TEST (test/plan/a-non-interactive-planner-pushes-through-the-host-credential-helper.test.ts):
      - Resolver over fixture registry files: app, ambient (missing file), and refused (malformed, missing field,
        unreadable key, two conflicting matches).
      - NON-INTERACTIVE HELPER, real git and bash. A fixture plan-lane worktree is wired to a socket started with an
        injected mint that records the identity it was given and returns a fake token. In a `bash -c` child, run
        `git credential fill` for protocol=https, host=github.com, path=<owner>/<repo>.git through the harness
        credential config. The child's env is built from scratch with no GH_TOKEN and no GH_APP_* variable, and its
        HOME holds a .bashrc that exports a decoy GH_TOKEN. The answer must be the fake token, and the mint must have
        seen the registry identity.
      - RED CONTROL: the same child with `bash -ic` does read the decoy, which proves the decoy is observable. An
        unwired worktree does not get the fake token.
      - REFUSAL: a refused resolution makes planCommand stop before the remote reserver runs (zero calls) and before
        spawn (zero calls).
      - READS: the open-PR read seam is called exactly once through its existing transport, and no token value
        appears in the planner's process.env.
    LIMITS / NOT IN SCOPE:
      - the gh PR-open write and any other gh write. The PR-open write is filed as dependent task W1-T11864, because
        run PLAN-create-1794227143936 pushed its branch and then failed at PR create with no credential. This task
        on its own does NOT complete the end-to-end non-interactive plan flow;
      - `rmd next-task-id` run from the operator checkout, because wiring it would write the operator checkout's git
        config. If it is measured failing the same way, file that separately;
      - worker, daemon and run-child credentials (W1-T5115, W1-T9083);
      - token TTLs, App permissions, keychain or token storage, and any change to the broker or its credential
        (W1-T11789).
  acceptance:
    - claim: "rmd plan resolves the host App identity from the host instance registry and presents a repo-scoped token minted at the git credential-helper boundary for its reservation and run-branch pushes, with no GH_TOKEN or App variable in its environment"
      proof: "unit test: test/plan/a-non-interactive-planner-pushes-through-the-host-credential-helper.test.ts"
    - claim: "planCommand asks the planner credential resolver before it reserves any id"
      proof: "grep: plannerHostGitCredential( in src/run-task.ts"
    - claim: "a non-interactive child whose only token is a .bashrc export gets the scoped token from the wired helper, and an unusable credential source refuses before any reservation push or worker spawn while reads stay on the broker"
      proof: "grep: W1-T11851 criterion 3 in test/plan/a-non-interactive-planner-pushes-through-the-host-credential-helper.test.ts"
  falsifier: |
    At this tree, planCommand starts no credential socket and wires no helper. So `git credential fill` in the fixture
    plan worktree, in a non-interactive child with no GH_TOKEN, returns no password, and the first criterion fails.
    The change is wrong in any of these cases:
    - a token value or GH_APP_* variable ever appears in process.env or the plan worker's env;
    - a refused registry still reaches the reserver or spawn;
    - the helper answers a pathless request with any token;
    - the open-PR read stops going through github-transport.
    If `bash -ic` in the red control does not read the decoy, the fixture cannot see the original failure and must be
    fixed before any green counts.
