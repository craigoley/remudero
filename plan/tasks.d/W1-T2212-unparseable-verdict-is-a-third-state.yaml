  title: "an UNPARSEABLE model verdict is a THIRD STATE and two rungs store it inside their adverse one — the risk judge encodes it as a real `verdict: high, confidence: 1` so every consumer that reads the label sees a risk finding, and the triage rung collapses it into an untyped `action: error` that no rung may retry, so three paid dispatches produced nothing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  rationale: |
    Filed by reading only, from a scratch worktree PROVEN equal to origin/main (behind-count 0).
    No suite, no spawning verb. Both instances re-derived from GitHub and from source.

    (1) THE RISK JUDGE, RE-DERIVED. Issue #2696 opened 2026-08-24T10:25:03Z, titled
    `[BLOCKED] W1-T2201: risk judge ESCALATED (high, confidence 1.00)`, body carrying
    "judge output carried no parseable RISK_VERDICT — failing closed (never silent-proceed)".
    PR #2695 is TWO FILES (`src/lib/containment.ts` +142/-16, `test/containment-turn-budget.test.ts`
    +330/-0) and MERGED UNCHANGED at 2026-08-24T11:45:30Z after manual review. THERE WAS NO RISK
    FINDING TO READ.

    (2) AND THE MECHANISM IS IN THE TYPE, NOT THE PROSE. `FAIL_CLOSED_VERDICT` (`src/lib/risk-judge.ts`)
    IS a `RiskJudgeVerdict`: `{ verdict: "high", confidence: 1, reasons: [...] }`. The third state is
    STORED INSIDE THE ADVERSE ONE, so every consumer that reads `verdict`/`confidence` — including the
    escalation title an operator reads first — sees a genuine high-confidence risk finding. Only
    `reasons[0]` distinguishes them, and no title renders it. THE SAME FUNCTION CONTRADICTS ITSELF ON
    CONFIDENCE: the parsed path defaults a missing confidence to 0 because it must "never assume high
    confidence that was never stated", while the UNPARSED path hardcodes 1.

    (3) THE TRIAGE RUNG, RE-DERIVED, AND ITS SHAPE IS DIFFERENT. `decideTriage` (`src/lib/triage.ts`)
    returns `{ action: "error", reason: "no ALREADY_DECIDED:/AMBIGUOUS:/PROPOSED: verdict line found
    in the worker's output" }`. That IS a distinct action — but the CAUSE is prose only, and it shares
    `action: "error"` with a substantively different failure one branch above (`triage worker touched
    non-plan file(s)`), which is a worker that misbehaved rather than one that answered unreadably.
    Nothing may retry either. `plan/feedback/fb-1785959570301-a65f94.yaml` is on main and its triage
    finally landed as #2689 — the FOURTH dispatch; the three that failed left no PR by construction,
    which is why their only trace is the fleet ledger.

    (4) SO THE TWO RUNGS FAIL DIFFERENTLY AND NEITHER CAN SAY WHY. One reports a risk finding it never
    read; the other reports an error whose cause is untyped. In both, the operator cannot separate a
    real adverse judgment from a malformed response without opening the diff.

    (5) AND THE CLASS IS WIDER THAN THE TWO INSTANCES — A THIRD SITE IS CONFIRMED, NOT SUSPECTED.
    `flight-judge.ts` carries the IDENTICAL collapse: `FAIL_CLOSED_VERDICT: JudgeVerdict =
    { state: "off_track", recommendation: "escalate", confidence: 1, evidence: [...] }`, and
    `risk-judge.ts`'s own doc says it "mirrors flight-judge.ts's `FAIL_CLOSED_VERDICT`".
    `src/lib/learnings.ts` cites the same doctrine again. This task does NOT declare those files;
    they are named so a later reader knows the pattern is three-deep and not finished here.
  design: |
    (i) THE DISTINCTION MUST BE A TYPE, NOT A POLICY — THIS IS THE WHOLE ANSWER TO "ENFORCEABLE
    RATHER THAN INTENDED". Make the parser return a discriminated union whose UNPARSEABLE arm is not
    a verdict at all, so the retry branch is reachable ONLY from that arm. A parsed-but-adverse
    verdict is then a DIFFERENT TYPE and cannot enter the retry path — the compiler refuses it, not a
    reviewer. Any design where both states share one type and a boolean or a string decides
    retryability re-creates exactly this defect one level down.

    (ii) THE RETRY RE-REQUESTS, IT NEVER RE-ASKS. Build the prompt and the input ONCE and reuse the
    same value for every attempt; nothing about the request may vary between them. Re-asking a judge
    until it parses is one step from re-asking until it approves, and the difference is only
    observable if the attempts are byte-identical. THE FALSIFIER: a test that captures every attempt's
    prompt and asserts they are identical, and a second that asserts a parsed `high` verdict is
    retried ZERO times. Without both, "only on unparseable" is an intention.

    (iii) HARD-BOUNDED, AND THE BOUND CHANGES NOTHING ELSE. A small attempt cap; at the bound the
    SAME escalation fires as today, with the same class and the same blocking effect. Each attempt
    writes its own ledger row so the count is auditable after the fact rather than inferred.

    (iv) AND NAME THE CAUSE WHERE THE OPERATOR ACTUALLY READS IT. The original defect is legibility:
    `ESCALATED (high, confidence 1.00)` must not be the title of a malformed-response escalation. The
    title must distinguish the two, and the risk judge's confidence must stop asserting 1 for a
    verdict it never read — 0 is what its own parsed path uses for a value that was never stated.

    (v) TWO FILES, ONE CONCERN, AND RULE 19 DOES NOT REFUSE IT — MEASURED, NOT ASSUMED.
    `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` outright when `task.risk ===
    "high"` ("Rule 19 exemption — high already assumes wide scope"), so this combination is permitted
    at this band and would only have blocked at `risk:medium`. The span is declared deliberately: the
    retry contract in (i)-(iii) must be IDENTICAL in both rungs, and splitting the task is the
    likeliest way to end up with two divergent retry policies — which is the laundering hazard itself.

    (vi) REFUSED BY NAME. An unparseable verdict STILL BLOCKS. The escalation STILL FIRES at the
    bound. NOTHING proceeds on a verdict it could not read. No retry on any parsed verdict, adverse
    or not. No widening of what counts as parseable to make more responses succeed.

    (vii) NOT IN SCOPE, NAMED: `flight-judge.ts` and `learnings.ts` (rationale 5); the `touched
    non-plan file(s)` arm of `decideTriage`, which is a real worker misbehaviour and must keep failing
    without retry; and the judges' prompts, which this task does not tune.
