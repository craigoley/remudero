    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/unparseable-verdict-third-state.test.ts`, declared in `files:`, so on the filing PR
    it resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS RULE 19 SPAN AND BLAST RADIUS BOTH, AND THE SPAN WAS MEASURED RATHER THAN
    ASSUMED — see design (v): `sizingViolation` exempts `risk:high` by an early return, so the
    linter permits this pair and would only have refused it at a lower band. The BLAST RADIUS is that
    both rungs gate whether unattended work proceeds.

    TWO OF THE BRIEF'S PREMISES ARE CORRECTED HERE RATHER THAN CARRIED. FIRST, the two rungs do NOT
    share a parser: `parseRiskJudgeVerdict` (`src/lib/risk-judge.ts`) matches
    `/RISK_VERDICT:\s*(\w+)/i`, while `decideTriage` (`src/lib/triage.ts`) consumes a verdict parsed
    by `/^[ \t]*ALREADY_DECIDED[ \t]*:[ \t]*(.+)$/gim` and its siblings — two files, two regexes,
    nothing shared. SECOND, `rule-efficacy` does NOT refuse the laundering shape by name: it is a
    MEASUREMENT module (`ruleEfficacyReport`, `escalateRepeatingRules`, given a cadence by W1-T1259)
    that reports whether rules are working. The anti-laundering doctrine that IS in-tree lives
    elsewhere — `onboard/recon.ts` ("never launders a guess as ground truth") and `open-prs-rest.ts`
    ("would launder 'GitHub did not say' into 'definitely not a draft'") — and design (ii) rests on a
    falsifier rather than on any of those citations.

    THE THREE FAILED TRIAGE DISPATCHES LEFT NO GITHUB TRACE BY CONSTRUCTION — the rung's own contract
    is "leaving no PR" — so their count is the operator's, taken from the fleet ledger, and is not
