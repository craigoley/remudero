      proof: 'grep: test("W1-T8533: every step a refresh decision reads is in the retention set" in test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts'
    - claim: "the refresh-step census finds the four known steps by name and reports an unretained refresh step"
      proof: 'grep: test("W1-T8533: the refresh census finds the four known steps and reports an unretained one" in test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts'
    - claim: "a base-fixed refresh row survives a real rotation, and the sweep still refuses a second refresh on the same red"
      proof: 'grep: test("W1-T8533: a refresh row survives rotation and still refuses a second refresh on the same red" in test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts'
    - claim: "a PR older than the live file's span reads its refresh history from the rotations"
      proof: 'grep: test("W1-T8533: a PR older than the live window reads its refresh history from the rotations" in test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts'
    - claim: "an unreadable refresh history is named on the clearance row and never read as no prior refresh"
      proof: 'grep: test("W1-T8533: an unreadable refresh history is named and never read as no prior refresh" in test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts'
    - claim: "the base-fixed refresh step is retained"
      proof: 'grep: "sweep\.base_fixed\.refresh" in src/lib/ledger.ts'
    - claim: "the refresh clearance step is retained"
      proof: 'grep: "refresh\.clearance" in src/lib/ledger.ts'
  falsifier: |
    Remove `"sweep.base_fixed.refresh"` from `DECISION_RELEVANT_LEDGER_STEPS`. The census reds by name, and in the rotation
    test the refresh row is archived and the sweep refreshes the same red a second time, as #10190 and #10787 would have
    after a rotation. Restrict the census to string literals, as test/ledger-rotation.test.ts does today, and its positive
    control fails, because none of the four reads is a literal on main. Drop the union fallback, and the old-PR test sees a
    second refresh. Treat an unreadable union as "no prior refresh", and the last test sees a refresh with no history row.
  note: |
    EFFECT, measured after merge from the core ledger with no numeric pass mark: per PR, count same-red refreshes (the
    same checks and test files) that follow an earlier one, before and after W1-T8396 plus this task. Healthy shape: no
    same-red repeat unless the clearance row names merged-probe or prefilter evidence, or `history: "unreadable"`. Also
    count `history: "union"` rows, which is how often the live window fell short of a PR's life, and the size of the live
    core after rotation, which shows what the two retained steps cost.
