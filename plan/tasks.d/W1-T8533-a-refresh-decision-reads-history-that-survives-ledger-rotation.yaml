- id: W1-T8533
  title: "A REFRESH DECISION READS HISTORY THAT SURVIVES LEDGER ROTATION — W1-T8396 (#11085) refuses a second refresh on a red a refresh already failed to clear, but two of the four steps it reads (sweep.base_fixed.refresh, refresh.clearance) are not retained, the core ledger rotates about hourly, and 7 of 13 measured same-red repeat refreshes (10-08..10-12) straddled a rotation, so the guard would not see the first refresh"
  repo: remudero
  depends_on: [W1-T8396]  # its readers (refreshRecordsFromLedger, refusedRefreshClearancesFromLedger) and its refresh.clearance step are what this retains
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — every row a refresh decision reads outlives the PR it gates; it spans the rotation's retained set and the sweep's history read
  band_meaning: span
  origin: "operator approval 2026-10-12 (\"Go\")"
  plan_refs: [W1-T8396, W1-T6405, W1-T4351, W1-T4935, W1-T3471, W1-T244, W1-T1262, W1-T1201]
  files:
