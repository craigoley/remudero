- id: W1-T14303
  title: "The fixture-copy census counts a repo, GitHub or ledger builder name only where it is declared in code, not where its text sits inside a string or template literal, so a test that holds fixture source in a string does not push its builder into a workaround"
  repo: remudero
  depends_on: []
  priority: 3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # the census is a ratchet the author preflight and the pre-push precheck run; a lexer that loses its place could hide real builder copies, so criterion 2 pins that code after a tricky string still counts
  origin: "operator-session#fixture-census-counts-string-text-2026-11-22"
  plan_refs:
    - W1-T2903
    - W1-T12322
    - W1-T14152
  files:
