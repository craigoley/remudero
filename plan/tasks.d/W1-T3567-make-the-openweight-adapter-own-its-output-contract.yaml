  note: |
    reservation hand-off: main -> chore/file-openweight-output-contract-1789389121907

    OBSERVED 2026-09-14 from a retained ten-call Azure A/B artifact at
    `state/recon/openweight-authoring-ab-1789389121907.json` (SHA-256
    c0f8e1f026833fb77359b38cd9b0a43d2728377bc09fe5a7dd08a58bdbed0b93): a
    shard-shaped prompt without an explicit quote rule parsed 3/5 times, while the
    same prompt with the four-line double-quote rule parsed and met the field
    contract 5/5 times. This record contains no credential. The exact 0/5 claim from
    the earlier recon was not reproduced, so it is not repeated here.

    W1-T3546 already placed a proof-quoting sentence in `inboxDraftPrompt`. That is
    insufficient as a provider contract: a future openweight lane may have a different
    authoring prompt or a closed classification enum. The adapter is the single common
    request builder, remains unused by any mount while this task lands, and is the
    narrow place to prevent a per-lane prompt omission from reaching paid traffic.
  rationale: |
    The Azure adapter intentionally omits `response_format: json_object` and uses a
    5,000-token reasoning budget because those are deployment-specific facts. The
    observed YAML failure has the same ownership: `spawnOpenWeightWorker` constructs
    every provider request, so it must supply the output constraints every routed
    lane inherits. Leaving the rule only in the inbox prompt would make the next lane
    re-discover a paid, avoidable failure.
  design: |
    Define one named OpenWeight system-prompt preamble in `src/lib/worker-provider.ts`
    and prepend it as the first system message on every Chat Completions request from
    `spawnOpenWeightWorker`; retain the caller prompt as the user message. The
    preamble must state three conditional rules: quote YAML scalar values containing
    a colon, especially `proof:` values; when a request names a closed enum, emit
    exactly one listed literal and choose the nearest listed value rather than invent
    `unknown` or `ambiguous`; and emit no Markdown fence when a raw document is
    requested. It must not claim every worker response is YAML or otherwise change a
    lane's semantic task.

    Extend the existing adapter transport test to inspect the actual serialized first
    request: it must have the preamble before the supplied user prompt, include all
    three rules, and omit `response_format`. Keep endpoint/authentication, tool
    handling, cash accounting, capability selection, mounts, and every non-openweight
    provider unchanged.
  acceptance:
    - claim: "every OpenWeight request begins with one adapter-owned preamble that requires colon-containing YAML values to be quoted, refuses invented closed-enum labels, and forbids fences for a requested raw document"
      proof: "unit test: the openweight adapter prepends its output contract to every request"
    - claim: "the adapter-built request still omits response_format while retaining the caller prompt as the user message"
      proof: "unit test: the openweight adapter sends no response format after adding its output contract"
  falsifier: |
    Delete the preamble from the request-message construction and the transport assertion must
    fail because its first message is no longer the contract. Mutate the request to add
    `response_format`; the request-shape assertion must fail. A test that only matches a
    standalone string constant, rather than the serialized request passed to the transport, is
    insufficient because it cannot prove the adapter sends the contract.
