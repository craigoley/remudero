  rationale: |
    OBSERVED 2026-11-18: the Codex "Build skills" page (learn.chatgpt.com, undated) says Codex scans `.agents/skills`
    in every directory from the working directory up to the repository root, plus `$HOME/.agents/skills`, and lists
    no `.claude/skills`. An `agents/openai.yaml` with `policy: allow_implicit_invocation: false` keeps a skill
    explicit-only. This repository has no `.agents/` folder, so the operator's Codex sessions (.codex/config.toml,
    W1-T10302) get none of the eleven macros in settings/macros.yaml. W1-T4332's falsifier recorded Codex discovery as
    unverified; for `.claude/skills` this confirms its premise. A mirror under `.agents/skills` would also sit in every
    Codex worker's worktree, and explicit-only skills may still be listed in a worker's context.
  design: |
    1. Read the pinned Codex version's skill discovery (source or docs at that version) and confirm the paths.
    2. Trace spawnCodex (src/lib/worker-provider.ts) for the cwd and config a worker runs with, and test whether a
       `-c` override or `[[skills.config]] enabled = false` hides repository skills from `codex exec`.
    3. Compare a repository mirror generated by scripts/generate-macro-skills.mjs with a user-level install under
       `$HOME/.agents/skills` on the operator's machine only.
    Write the report with the three headings the proofs name, each on its own line, label claims OBSERVED or INFERRED,
    and add it to docs/docs-index.json.
