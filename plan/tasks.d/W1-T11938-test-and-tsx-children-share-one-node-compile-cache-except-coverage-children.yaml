  priority: 0.6
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # child environment builders for every test run; a wrong cache path can only cost speed, but coverage children must keep it off
  band_meaning: blast-radius
  origin: "operator ruling 2026-11-10 go with it (efficiency batch, slim serve, lighten preflight, janitor)"
  plan_refs:
