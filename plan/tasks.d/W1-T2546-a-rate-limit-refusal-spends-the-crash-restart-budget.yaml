  note: |
    risk:high, band_meaning: blast-radius — a wrong classification here decides whether the fleet
    restarts or dies, and the span is small. Mirrors W1-T2537's shape deliberately: a new exit
    code beside DAEMON_EXIT_BLOCKED and DAEMON_EXIT_STALE, so the entrypoint arm that consumes it
    is the one already proven.
