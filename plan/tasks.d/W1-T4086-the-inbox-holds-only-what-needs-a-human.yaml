      proof: 'grep: test("W1-T4086: the inbox shows the operator only the items that need a person" in test/the-inbox-holds-only-what-needs-a-human.test.ts'
    - claim: "every fleet finding kind is routed to the fleet lane"
      proof: 'grep: test("W1-T4086: every fleet finding kind is routed to the fleet lane" in test/the-inbox-holds-only-what-needs-a-human.test.ts'
    - claim: "an unknown kind stays with the operator"
      proof: 'grep: test("W1-T4086: an unknown kind stays with the operator" in test/the-inbox-holds-only-what-needs-a-human.test.ts'
    - claim: "the inbox route calls the owner rule"
      proof: 'grep: inboxOwner( in src/lib/panel-graph.ts'
  falsifier: |
    Return every proposal in `needsYou` and the first test goes red on its adoption and proof-debt fixtures. Default an
