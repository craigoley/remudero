  falsifier: |
    Build #11096's request (testFiles: [test/a-spent-check-requeue-survives-ledger-rotation.test.ts]) and render its body.
    Restore the old prompt-only path, and the body has no block the dispatcher wrote: `acceptanceAuthorTimeCheck` refuses
    it, or a proof has no dialect. Restore `ci:` in `mainRepairRevertBody`, and the revert test reads a proof with no
    `unit test:`/`grep:` prefix. Remove the `deps.checkAcceptance` call, and the no-test-file case writes no defect row.
