  rationale: |
    READ on origin/main 5ec079f75. Symbols, not lines.
    THE INCIDENT. #11085 (W1-T8396) merged as 97e3f9136 at 13:12Z. It added `refusedRefreshClearancesFromLedger`
    (src/lib/base-reproduction.ts), which reads `REFRESH_CLEARANCE_STEP` ("refresh.clearance"), a step missing from
    `DECISION_RELEVANT_LEDGER_STEPS`, so test/a-spent-check-requeue-survives-ledger-rotation.test.ts fails on main.
    The main-health lane dispatched one fix worker (`dispatchMainRepairFixRun`), which opened #11096
    (main-repair-fix-97e3f9136d82-1791813063189, task main-repair-97e3f9136d82) with the right one-line fix. Its body's
    proofs were prose ("test/x.test.ts passes"), so proof-discrimination failed on f84af4f. A session hand-wrote
    `unit test: test/a-spent-check-requeue-survives-ledger-rotation.test.ts` and `grep: "refresh\.clearance" in
    src/lib/ledger.ts` into the body.
    WHY. `mainRepairFixPrompt` (src/run-task.ts) tells the worker "an `Acceptance:` block of `- <claim> | <proof>`
    bullets naming the failing test(s) that now pass". It never names a dialect. review.ts only executes a proof that
    opens with `unit test:` or `grep:` (`DIALECT_TEST_RE`, `DIALECT_GREP_RE`); anything else is prose. The filing lanes
    were taught the grammar long ago (`ACCEPTANCE_PROOF_GRAMMAR`, src/lib/proof-grammar.ts; `RETRO_ACCEPTANCE_BLOCK_GRAMMAR`
    in run-task.ts); this lane never was.
    WHY NOT A PROMPT LINE. The dispatcher already holds the answer. `MainRepairFixRequest.testFiles`
    (src/lib/main-health-rung.ts) carries the failing test files, from `baseReproductionFiles(failures)`, and each fails
    on main by definition. So `unit test: <path>` for each of them fails at base and passes at a correct head: the
    discrimination proof-discrimination wants. The harness can write that block itself, as triage already does
    (`triageCommitMessage`, src/lib/triage.ts: "the HARNESS authors ... never the LLM, so the `Acceptance:` contract
    can never be malformed"). Teaching the worker the grammar would leave a model's spelling between a red main and
    its repair.
    THE BLOCK MUST BE IN THE BODY THE PR IS OPENED WITH. acceptance-author-gate and proof-discrimination read the
    pull_request event payload. Both now also trigger on `edited`, but a post-open body edit starts a second run
    after the first already reported. Writing the block before the open avoids that race. Two ways the code already
    supports: the worker opens with `gh pr create --body-file <file the dispatcher wrote>`, or the worker pushes and the
    dispatcher opens the PR over REST, as `openMainRepairRevertPr` already does.
    THE SAME DEFECT, HARNESS-AUTHORED. `mainRepairRevertBody` writes
    `- the failing check(s) pass with <sha> reverted | ci: <checks>`. `ci:` is not a dialect, so the revert PR the same
    lane opens when the fix is not enough carries a prose proof too.
    SIBLINGS CHECKED:
      - `alertFixPrompt` (run-task.ts) teaches the same bare `- <claim> | <proof>` shape. Its proofs depend on the alert,
        and the request carries no failing test files, so the dispatcher cannot write them. Out of this task. The
        cheapest root fix there is to give that prompt `ACCEPTANCE_PROOF_GRAMMAR`. Reported separately, not done here.
      - `triageCommitMessage` (src/lib/triage.ts) and `buildAmendmentBody` (src/lib/proof-amendment.ts) are
        harness-authored and use executed proofs already. Not affected.
      - `renderAcceptanceBlock` (src/lib/plan-pr-emitter.ts) renders criteria it is given and round-trips them through
        `parseAcceptanceBlock`. It is the renderer this task reuses, not a defect.
    MEASURED on host remudero, ~/rmd-state2/state, 2026-10-12 ~14:10Z. Niced, 85 rotation archives from 10-08 onward
    plus the live file, rows deduplicated by ts and step. The lane shipped 10-09 (#10192). Positive control: 19
    `main-repair.dispatching`, 9 `main-repair.dispatched_worker`, 7 `main-repair.no_pr` and 2 `main-repair.pr_opened` rows
    (earliest 10-10T12:27Z, newest today). The two PRs: #10712 (main-repair-de219e4fdb3e, 10-10) was armed on a full PASS
    and has no stand-down row. #11096 is this incident: proof-discrimination red, stood down as base-red. So 1 of the 2
    repair PRs failed proof-discrimination. The sample is small, so it shows the defect is live. It does not give a rate.
  design: |
    1. ONE PURE RENDERER. Add `mainRepairAcceptanceCriteria(request)` in run-task.ts. It returns one criterion per
       `request.testFiles` entry, `{ claim: "<path> passes again on the repaired head", proof: "unit test: <path>" }`, and
       renders them with `renderAcceptanceBlock` (src/lib/plan-pr-emitter.ts), so the block round-trips through
       `parseAcceptanceBlock` or throws.
    2. THE DISPATCHER WRITES THE BODY. `dispatchMainRepairFixRun` writes a body file before the worker spawns: a
       placeholder line for the worker's prose, the rendered block, `origin: main-repair#<sha>` and
       `Remudero-Task: <id>`. `mainRepairFixPrompt` tells the worker to open the PR with `--body-file <that file>` and
       to put its prose only where the placeholder is. The prompt stops asking the worker for an `Acceptance:` block.
       Opening the PR over REST from the dispatcher, as `openMainRepairRevertPr` does, is an equal choice. Either way
       the opening payload carries the block.
    3. NO PARSED TEST FILE. When `request.testFiles` is empty, nothing executable is known up front. Then the prompt
       gives the worker `ACCEPTANCE_PROOF_GRAMMAR` and asks for one `unit test:` or `grep:` proof per check it repairs.
       After the open, the dispatcher runs `deps.checkAcceptance` on the PR, as `dispatchAlertFixRun` does today. The
       main-repair dispatch never calls it now. A defect lands a `main-repair.acceptance_defect` row naming it.
    4. THE REVERT BODY. `mainRepairRevertBody` takes the failing test files the fix request had. Its criterion becomes
       `unit test: <path>` for each one. With none, it falls back to one `grep:` proof of a line the revert's own diff
       removes from main and restores at the parent, chosen by the dispatcher from that diff. It never uses `ci:`.
    5. Unchanged: who repairs, when the revert step fires, branch naming, the `Remudero-Task:` trailer and every other
       lane's prompt.
