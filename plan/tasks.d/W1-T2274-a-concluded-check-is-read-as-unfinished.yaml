    - claim: "a check whose conclusion is skipped is classified as done rather than pending"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
    - claim: "a cancelled required check is distinguished from a failed one rather than folded into red"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
    - claim: "a stale conclusion is classified rather than left holding the wait open"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
    - claim: "an unrecognised conclusion never reaches green"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
    - claim: "five identical readings with nothing running still stops the wait"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
    - claim: "the poll loops read the same conclusion sets the sweep reads"
      proof: "unit test: test/check-conclusion-vocabulary.test.ts"
