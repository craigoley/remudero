  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so two source files and a test named after neither trip it at `medium`. The change
    itself is small — one shared set replacing a third private one, plus the two states (ii) says
    are missing.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/check-conclusion-vocabulary.test.ts`, declared in `files:`, so on this filing PR it
    resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL, AND THE CONTROL WAS CONFIRMED
    PRESENT BEFORE IT WAS BELIEVED. `rmd check-proof` on the declared path reads `exit: 1`,
    `hits: 0`, `verdict: fail`. The SAME verb on an EXISTING pure path — `unit test:
    test/check-wait-progress.test.ts`, the test file for `checkWaitStalled` itself — reads
    `verdict: pass`.

    THE ID WAS RESERVED BY THE OPERATOR AND IS NOT RE-MINTED. `refs/rmd-id/W1-T2274` resolves to
    aa3ba6c3879f2c3549244e480ed5c9392abccaec; this shard VERIFIES THE ID IS UNUSED rather than that
    it is this account's. Six surfaces swept, each with a control pre-qualified for its own surface,
    and the remote ref counts read first (138 heads, 394 `refs/rmd-id/*`): shards on main 0 (control
    W1-T2250 = 2); whole tree at HEAD 0 (control 5); remote head names 0 (control, 89 `run-*` heads
    read); commit subjects and bodies on main 0 (control 3); open PR titles, bodies and head refs 0
    across all 3 open PRs (control `W1-T2` = 3). Presence of a reservation is not usage.

    THE PREMISE THAT THE FLEET "WAITS FOREVER" IS NARROWED RATHER THAN REPEATED. The wait is
    bounded — `checkWaitStalled` decides stalled from the rollup SIGNATURE and from
    `rollupHasRunningCheck`, never from the `pending` list, so reclassifying NEUTRAL would not by
    itself have changed the stall DECISION on either head. What the misclassification corrupts is
    the REASON the verdict carries, and in the sweep's own vocabulary (c) it corrupts the state
    itself, which is where the measured 65-minute and 237-minute pending readings came from. Both
    are worth fixing; only the second is a forever-wait, and the shard says which is which.
