- id: W1-T3893
  title: "LET OPERATORS SEE AND FORGET CONTEXT — inventory, export, deletion propagation, and restart-safe memory controls"
  repo: remudero
  depends_on: [W1-T3881, W1-T3824, W1-T3826]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 75.00
  risk: high
  band_meaning: blast-radius
  origin: "research:instinct-automation-2026-09-20"
  plan_refs: ["§Learning provenance", "§Credential boundary", "W1-T3853", "W1-T3881", "W1-T3824", "W1-T3826"]
  files:
    - src/lib/context-controls.ts
    - src/lib/operator-agent.ts
    - src/lib/serve.ts
    - src/lib/ledger.ts
    - openapi/daemon.yaml
    - test/context-controls-inventory.test.ts
    - test/context-controls-forget.test.ts
    - test/context-controls-export.test.ts
    - test/context-controls-derivation.test.ts
    - test/context-controls-restart.test.ts
  status: queued
  attempts: 0
  rationale: |
    W1-T3881 gives retained context provenance, purpose, retention, revocation, and deletion semantics.
    A trustworthy assistant also needs an operator-facing control contract: what is remembered, why it
    is eligible, what derived items depend on it, and whether a forget request really propagated.

    This task owns the redacted self-service read and lifecycle receipts. It does not expose raw private
    context through a browser or public site, and it does not create a second memory store.

    W1-T3853 owns experiment evidence, not personal-context lifecycle. This task owns the inspect,
    forget, revoke, and export boundary for assistant memory.
  design: |
    Add `context-controls-v1` for scoped inventory, forget, revoke, and user-authorized export. Inventory
    returns metadata only: source, purpose, sensitivity, authority, freshness, retention, derivation
    links, and current state. Forget and revoke append linked receipts and mark dependent derived items
    unavailable; restart and reindex must not restore them. Export is bounded, redacted, scoped to the
    selected principal and purpose, and refuses when source coverage is incomplete.

    Every response distinguishes absent, stale, unavailable, pending, completed, and refused. The
    controls must honor the selected repository or principal scope from W1-T3824/W1-T3826.
  acceptance:
    - claim: "context inventory exposes bounded provenance and state metadata without raw private content"
      proof: "unit test: test/context-controls-inventory.test.ts"
    - claim: "forget and revoke requests create durable receipts and remove eligible context from planning"
      proof: "unit test: test/context-controls-forget.test.ts"
    - claim: "export is scoped, redacted, bounded, and refuses incomplete source coverage"
      proof: "unit test: test/context-controls-export.test.ts"
    - claim: "derived context becomes unavailable when a required input is forgotten or revoked"
      proof: "unit test: test/context-controls-derivation.test.ts"
    - claim: "restart and reindex do not silently restore forgotten or revoked context"
      proof: "unit test: test/context-controls-restart.test.ts"
    - claim: "the operator-agent planning path filters through the context-control state"
      proof: "grep: filterContextForPurpose( in src/lib/operator-agent.ts"
  falsifier: |
    Return raw context, forget only the index while leaving a derived item usable, export another scope,
    recreate revoked context after restart, or call incomplete coverage complete. The proof must fail.
  note: "W1-T3881 owns context governance; this task makes deletion and inspection usable and honest."
