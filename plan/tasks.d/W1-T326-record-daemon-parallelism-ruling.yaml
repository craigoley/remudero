  note: "verify:auto - the whole deliverable is text at known paths, so grep proofs execute against it
    directly and no operator need be present to judge them.
    risk:high - this writes a BINDING RULING on dispatch architecture: an entry that overstates its blockers would stop work that should happen, while one
    that understates them would licence a change with three unresolved hazards.
    budget_usd 40 - the lowest on the current board because the content is dictated by this task's own
    design and the verification is two greps; the work is writing it accurately, not deriving it.
    NO NEGATIVE PROOFS HERE, deliberately. An earlier draft of this task carried a third criterion
    proving MASTER-PLAN no longer claims the daemon runs two lanes. That pattern MATCHES main and would
    have to MISS after the work — and a `grep:` proof that misses at review time is executed_fail,
    which OVERRIDES keyword coverage and fails the very PR that satisfied it. The MASTER-PLAN sentence
    is therefore corrected in the filing PR instead, and both proofs here are positive.
    NO depends_on: this records a decision and blocks nothing. W1-T325 (the dispatchLanes policy row)
    is the prerequisite for ever ACTING on a different answer, but the ruling stands without it."
