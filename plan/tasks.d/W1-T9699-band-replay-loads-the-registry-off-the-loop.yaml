  design: |
    1. Give the daemon replay an awaited registry read using W1-T9443's createProposalShardReader. Hold the reader for
       the daemon lifetime and refresh each pass; unchanged shards are neither read nor parsed again. Read the legacy
       blob off the loop too, preserving merge precedence. Do not introduce an unbounded per-root memo.
    2. Wire triageFleetLaneAsync to the awaited path through the repo's async-step/driver pattern. Keep the existing
       synchronous API for non-daemon callers with one decision implementation shared between drivers. A Promise
       around the old synchronous read is not an async filesystem port. Include daemon-owned reader wiring in run-task
       only where its lifetime requires it; verify the real daemon path, not only an injected replay seam.
    3. Preserve replay decisions, delivery, stores/ledger, locks and re-offer/escalation behavior. Corrupt/unreadable
       blob or shard, a colliding ID or a refused refresh must defer absence judgments as today. A last-good memo does
       not turn unreadable current evidence into an empty registry or authorize dropping a proposal.
    4. Prove the real default on a private fixture and the waiting boundary with a controlled pending async read.
       Repeated refresh reads no unchanged shard; replacement/deletion changes exactly the affected population.
       Exercise refused reads and preserve the existing guarded outcomes and proposal IDs. Run the caller and garden
       driver census suites this diff joins, without a new allowance, dropped population or disabled replay.
    5. After normal source adoption, retain one natural replay refresh and its existing files/read/unchanged/removed
       counts. This task claims the measured caller read path; overall loop-health qualification remains separate.
