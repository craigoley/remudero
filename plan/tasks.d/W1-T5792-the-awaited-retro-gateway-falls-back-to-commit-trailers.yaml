- id: W1-T5792
  title: "THE AWAITED RETRO GATEWAY FALLS BACK TO COMMIT TRAILERS — W1-T5649's `retroShippedGithubGatewayAsync.findMergedByTrailer` searches merged PR bodies only and answers null on a miss, while the sync gateways (`ghGateway`, `buildBatchedGithub`) fall back to the `Remudero-Task:` trailer on main's commits, so the daemon's retro can miss a merge the CLI retro credits"
  repo: remudero
  depends_on: [W1-T5649]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium
  origin: "operator session 2026-10-05: W1-T5649 (#9216) follow-up"
  plan_refs: [W1-T5649, W1-T2387, W1-T3104]
  files: [src/run-task.ts, test/the-awaited-retro-gateway-falls-back-to-commit-trailers.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main f0452a82 and #9216 (W1-T5649, open). The awaited gateway's
    `findMergedByTrailer` runs one `search/issues` query for `"Remudero-Task: <id>" in:body` and
    returns `hit ? {...} : null`. `buildBatchedGithub` (src/lib/status.ts) keeps "body-first,
    commit-trailer-fallback precedence" through `buildCommitTrailerIndex` (W1-T2387), and
    `ghGateway` does the same. A PR whose body lost or never had the trailer but whose squash commit
    carries it (the fleet's commit trailer is the durable one) is credited by the CLI retro and not
    by the daemon's. The daemon's gateway already has the commit corpus in hand: `mergedCommits`
    parses `git log` for the candidate filter.
  design: |
    On a body-search miss, answer from the commit trailers: the newest commit on main whose body
    carries an anchored `Remudero-Task: <id>` line, resolved to its PR number from the subject's
    `(#<n>)`, through the same async `git log` read (bounded by `boundGitCall`). If W1-T5649 has
    not merged, stop and record needs-design. Add no comment lines to src/run-task.ts.
  acceptance:
    - claim: "with a body search that finds nothing and a main commit carrying the anchored trailer, the awaited gateway returns that commit's PR, and with neither it returns null as the sync gateway does"
      proof: "unit test: test/the-awaited-retro-gateway-falls-back-to-commit-trailers.test.ts"
  falsifier: |
    Return null on the body miss: the commit-trailer fixture is uncredited and the test fails.
