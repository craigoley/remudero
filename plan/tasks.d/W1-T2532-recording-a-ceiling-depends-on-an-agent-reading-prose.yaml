    - claim: "the CI assertion is still able to refuse: the recording mode is opt-in and the path CI runs never writes"
      proof: "unit test: test/recording-a-ceiling-does-not-depend-on-reading-prose.test.ts"
    - claim: "a file that shrinks is still ratcheted DOWN and a brand-new file is still recorded, exactly as before"
      proof: "unit test: test/recording-a-ceiling-does-not-depend-on-reading-prose.test.ts"
    - claim: "the recorded line is byte-identical to what the refusal instructs a reader to write, so the two paths cannot drift"
      proof: "unit test: test/recording-a-ceiling-does-not-depend-on-reading-prose.test.ts"
    - claim: "removing the opt-in guard makes the CI assertion pass over a tree that really is over its baseline"
      proof: "unit test: test/recording-a-ceiling-does-not-depend-on-reading-prose.test.ts"
