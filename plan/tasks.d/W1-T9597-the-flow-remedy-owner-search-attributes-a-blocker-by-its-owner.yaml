    - claim: "every declared blocker owner except NONE and operator names an existing module that is not a remedy filer"
      proof: "unit test: W1-T9597: every declared blocker owner names an existing module that is not a remedy filer"
    - claim: "the suite exists under its own title"
      proof: "grep: W1-T9597: a base-red blocker is owned by its declared owner module in test/the-flow-remedy-owner-search-attributes-a-blocker-by-its-owner.test.ts"
    - claim: "the declared owner-to-module map exists"
      proof: "grep: PR_BLOCKER_OWNER_MODULES in src/lib/pr-blocker.ts"
  falsifier: |
    Fixture: `sweep.disposed` rows for one PR with blocker `base-red`, `blocker_owner: main-health`, and reason
    "required checks red — ci-log fix, strike 1/2 — NOT DISPATCHED …". Inject an `OwnerSearch` whose `filesContaining`
    returns the four measured one-hit files and records each call. At origin/main `draftShard` names
    src/lib/fix-lane-gardener.ts and calls `filesContaining("required checks red")`, so the first test fails on both
    counts. Swap the owner for `NONE`: at base the draft still takes the text-match file, so the second test fails.
    Remove the `main-health` entry after the change: the census test and the first test both go red.
