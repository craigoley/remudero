  rationale: |
    READ 2026-09-23 AT origin/main b5c2804 during a backlog triage of feedback entries still at `status: new` that no plan record cited. File:line citations are from that read and are approximate (~); re-verify at your head before relying on them (binding rule: distrust the prompt over the installed code).

    OBSERVED: `linkWorktreeNodeModules` (src/lib/worker.ts ~3395-3411) hashes package.json/package-lock.json, warns
    on a mismatch and returns "linked-lockfile-mismatch"; its caller `worktreeAdd` (~3993) discards the return value.
    OBSERVED: `resolveNodeModulesSource` (~3330) falls back to the install root's node_modules when the target repo has
    none, so a console or site worktree is linked to CORE's dependency tree.
    OBSERVED: W1-T2777 (#3818) shipped detection only and says so ("THIS TASK DOES NOT TOUCH REFRESH"); W1-T2716's
    refuse-or-park design was retired as overtaken by it. So the refusal half was never built.

    ALSO REPORTED AS: fb-1789315360491-ff460c, fb-1789328946438-96e9b7, fb-1790038102980-5f225f.

    risk: high is Rule 19's span (an existing suite, not this task's own falsifier), not blast radius.

    VALUE (triage estimate): high.

    NARROWED 2026-09-23 (operator direction: rmd runs one daemon per repo, and a change to core must not break the
    other two). Found while reviewing a build of the first design (local commit 2b2ec9b8, not shipped):
    OBSERVED (.remudero/daemon-instances.yaml): three containers from ONE image run `rmd daemon --repo remudero`,
    `--repo remudero-site` and `--repo remudero-console`. In each, the rmd install is $HOME/Remudero/remudero (core,
    `npm ci` at boot in deploy/entrypoint.sh) and target clones live at $HOME/Remudero/repos/<repo>, which carry no
    node_modules (W1-T2716's live measurement). So EVERY worktree in all three containers links core's install root.
    OBSERVED: remudero-console and remudero-site (package names remudero-console / remudero-site) need next, react,
    @clerk/nextjs and their own vitest and typescript; core's tree has none of the first three and pins typescript ^7.
    Neither satellite has a hooks/ dir, so the W1-T137 reason for linking (commitlint for hooks/commit-msg) is core-only.
    CONSEQUENCE FOR THE FIRST DESIGN: its clause (ii) would refuse every satellite dispatch forever, because
    ensureInstallFresh refreshes only the install root; and throwing from worktreeAdd itself reached the fix, review and
    lane callers plus proof-amendment.ts, of which only runTaskBody releases the dispatch claim; and runDrainLanes
    (src/lib/drain.ts) reads the rejected lane as drain.lane_error, ending a recycle drain in error.
    OBSERVED (src/lib/daemon.ts stopForFreshness): every daemon installs BEFORE a freshness restart, so a SAME-package
    mismatch against the install root clears on the next freshness restart. That is what makes clause (i) a deferral.
    The satellite fix proper (a repo- and lockfile-keyed dependency tree) is W1-T4260.
    SUPERSEDES: W1-T4003's stated claim that the root link and its lockfile-mismatch warning remain the shared-install
    baseline, for the implement lane on a same-package mismatch only. Every other caller keeps that baseline.
  design: |
    (i) OPT-IN, IMPLEMENT LANE ONLY. worktreeAdd gains an option that only runTaskBody's implement path sets. With it,
        a mismatch between the worktree's install inputs and the linked tree's, where BOTH package.json files name the
        same package, throws a typed error with reasonClass blocked_toolchain and names the remedy (the install root
        refreshes on the next freshness restart). Without the option, behaviour is byte-identical to today: warn and link.
    (ii) A CROSS-PACKAGE LINK IS RECORDED, NEVER REFUSED. When the worktree's package name differs from the linked tree's
        (a satellite linked to core's install root), log worktree.node_modules_cross_package with both names and both
        paths, and keep today's link. No satellite dispatch changes outcome in this task.
    (iii) runTaskBody's worktree-add catch gets its own arm for the typed error: log worktree.node_modules_refused,
        remove the worktree, release the dispatch claim through the holder arm (a failed release is logged and never
        replaces the typed error), and rethrow so the daemon's spawn-infra path defers it without a strike.
    (iv) runDrainLanes treats that typed error as a deferral of the lane, not drain.lane_error.
    (v) Never run `npm ci`/`npm install` inside the worktree: the node_modules symlink is shared and an install's clear
        phase empties it (the plan header's binding rule).
