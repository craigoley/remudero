- id: W1-T4193
  title: "AN IMPLEMENT WORKTREE WHOSE LOCKFILE DIFFERS FROM THE SAME PACKAGE'S LINKED node_modules RUNS ANYWAY — linkWorktreeNodeModules detects the mismatch, warns and returns linked-lockfile-mismatch, and worktreeAdd ignores the result, so a core worker's proofs run against dependencies its own commit never asked for: defer the implement dispatch on a same-package mismatch, and record (never refuse) a satellite worktree linked to another package's tree"
