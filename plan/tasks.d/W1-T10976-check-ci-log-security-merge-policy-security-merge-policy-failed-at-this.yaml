  design: |
    1. Entry and budget. Extend the existing producer recovery only after a verified repository-local CodeQL
       workflow_run is completed/success. Validate run identity/attempt, workflow path and trusted execution
       provenance, and its association with the current open PR head; a workflow name or event payload alone is
       insufficient. Read metadata only from trusted main code; execute no PR source or uploaded artifacts.
       Preserve the pending-check recovery and admit the exact missing-configuration shape below. Share at most
       three 60-second waits with the existing path, not a second retry ladder. Impose a monotonic 240-second total
       recovery deadline from producer entry, including reads, transport retries and all candidate PRs, reserving
       the remainder of the existing five-minute job for final publication. Never start work that cannot fit the
       remaining budget. This is a backstop inherited from existing bounds, not a measured GitHub latency promise.

    2. Freeze the target. Every observation re-reads the same open PR number, head SHA, base SHA and non-null
       merge_commit_sha, and verifies refs/pull/<n>/merge resolves to that merge SHA with the expected head/base
       parents. Bind expected analysis key and ALL categories to the trusted workflow configuration, initially
       the three categories above. Do not shrink the set when a category is absent. Revalidate this tuple during
       pagination, between observations and immediately before any status write. Head, base, merge, workflow
       configuration or run-attempt drift invalidates the old recovery; do not retarget it or reset its deadline.
       A stale observation never posts success to either head. Missing merge-ref identity stays UNKNOWN.

    3. Complete evidence. Through the shared adapter, list code-scanning analyses for refs/pull/<n>/merge with
       bounded pagination (reuse SECURITY_METADATA_MAX_PAGES); omit tool_name from query arguments and validate
       each selected row's tool.name === 'CodeQL'. Validate positive unique analysis IDs, exact merge commit_sha,
       ref, analysis_key, category, typed timestamps/counts, error === '' and warning === ''. Select the latest
       unambiguous analysis generation for each expected category; an older clean row cannot mask a newer failed
       row. Foreign-tool/key/ref/commit rows cannot fill a category. Require complete SARIF processing where its
       status is consulted, and no ignored/truncated-results warning. A successful analysis with findings is not
       itself a clean security result: results_count neither counts high/critical nor establishes their absence.
       Prove page termination; a full last page requires a subsequent page, and a page ceiling is incomplete.
       Reject malformed, duplicate, changing or truncated corpora and API/permission failures rather than using
       a partial array as an empty result. Add only job-level security-events: read to the trusted producer
       workflow for the new reads; retain its existing permissions, trusted-main checkout and timeout.

    4. Narrow reconciliation. Always select the newest exact-head check from the existing trusted GitHub Advanced
       Security app identity. Only completed/neutral with title exactly '1 configuration not found' and a complete,
       fixture-backed summary of the single configuration-missing warning is eligible. Strictly parse the entire
       warning and bind its one missing configuration to the expected analysis key/category and PR/base context;
       title matching, substrings or treating arbitrary neutral checks as safe is forbidden. Capture the verbatim
       trusted warning as a regression fixture during implementation; the synthetic receipt summary above is a
       negative control. If that full shape cannot be verified, remain UNKNOWN. Reconcile this warning only when
       all category analyses for the SAME merge commit satisfy step 3 and complete PR-specific CodeQL alerts and
       instances establish the existing changed-code/new-alert high/critical policy. Validate returned tool.name
       on alert evidence too, and exact merge/key/category identity on instances; unreadable severity or inability
       to establish new-alert semantics is UNKNOWN. Any genuine new high/critical alert remains blocked/failure,
       retaining alert numbers and its existing repair route. Neither all categories present nor zero API rows
       alone is a green. Only the shared classifier may grant safe; the adapter, synchronous/async merge guards
       and producer use the same evidence and rule, never a workflow-only success override. A newer ordinary
       trusted success still goes through the existing full classifier. Other warnings/failures remain UNKNOWN.

    5. Exhaustion and ownership. While eligible processing/categories are pending, publish UNKNOWN/error for the
       verified head and reobserve within the one window. Incomplete at the deadline, invalid evidence or an
       unrecognized warning produces a final explicit UNKNOWN/error with a distinct recovery disposition reason,
       never indefinite pending or success. If identity drift prevents a current-head write, retain a refused-write
       receipt and rely on a fresh event's independent observation, never carry old permission forward. Extend
       producer result/observation receipts with run/attempt, head/base/merge, expected/observed categories,
       analysis IDs/key, latest check generation, attempt count, elapsed time and terminal reason, without secrets.
       In sweep.ts consume the exact-head recovery disposition using the existing securityMergePolicy observation
       and escalation/owner machinery: record the owning PR task (or security-policy owner when absent), evidence
       link and one durable escalation/disposition per head and reason. Suppress repeated generic ci-log fix
       dispatch ONLY for this unresolved recovery; do not silently drop the blocker, consume fix strikes, hide a
       concurrent genuine alert or suppress unrelated reds. Repeated sweeps reuse the disposition; failure to record
       it stays actionable and visible. A real alert still reaches the existing source-repair/human route.
       Successful recovery proceeds through ordinary review, SHA-bound admission and merge guards.
    FALSIFIERS:
    Add load-bearing regressions to the three existing whole-file suites and the declared test/sweep file:
    - A verified completion with a neutral exact warning, initially one missing category, then all three valid
      same-merge analyses and a complete below-threshold alert corpus, changes error to success within the bound.
      Also cover eventual newer native CodeQL success; prove no success before complete evidence arrives.
    - A permanently missing category, absent/failed analysis, warning-bearing or unprocessed SARIF, wrong tool.name,
      foreign key/ref/commit, duplicate generation, malformed page, short/inconsistent corpus and a full final page
      at the ceiling never produce success. Test pagination beyond page one with matching and foreign-tool controls;
      assert request argv contains no tool_name filter and does not depend on a legacy top-level response field.
    - Change head, base or merge SHA independently (including unchanged head with a new merge SHA), close the PR,
      supersede the workflow attempt, or change configured categories during a wait/read/before publication:
      no stale success write. Failed/running/foreign/spoofed workflows cannot enter this recovery.
    - An unknown warning summary, two missing configurations, another neutral title and newer failed evidence
      stay UNKNOWN despite older clean rows. A genuine new high/critical alert with all categories present posts
      failure and retains its fix route; low/medium/quality fixtures retain the existing threshold semantics.
    - Exhaustion stops within the shared wait/deadline budget, posts error and records an owner/task disposition;
      two more sweep passes dispatch no generic security fix round. Unrelated reds and real-alert repairs remain
      actionable, and disposition-write failure cannot look handled. Include real CLI-transport coverage via the
      existing local shim, not live GitHub, as well as injected-read and catch-arm cases.
    With the implementation removed the delayed-recovery and disposition tests must emit '# fail N'; restored,
    '# fail 0'. Also delete each identity/completeness/alert guard in turn: its negative control must fail, exposing
    any false green. Preserve the failing/passing receipts at the tested committed SHA when implementing.
    POST-MERGE MEASUREMENT:
    At the IMPLEMENTATION merge SHA/time (not this clarification's merge), retain the original cause key and the
    gardener's equal before/after windows, each at most four days: report this cause's fix-round numerator and ALL
    fix rounds denominator, distinct PRs and recurrence. Separately audit every recovery-admitted PR/head/merge/run
    tuple in that after-window: recovered, still UNKNOWN, blocked, drifted, owner/task disposition and any repeated
    generic round, with receipts and observation coverage through the window's end. Compare equivalent exposure
    counts; a lower count or half-life decay alone earns no credit. Require recurrence/share improvement AND
    false-green=0, where a false green is any recovery success lacking complete stable category/alert evidence or
    admitting a new high/critical alert. Positive controls must prove the corpus includes a real admitted recovery
    and a blocked/UNKNOWN case; no admitted recoveries or incomplete receipts is insufficient evidence, not success.
    Any false green immediately fails qualification and goes to the security owner; do not expand the recognizer.
    A share that does not fall reopens the cause at rung 2 under existing human/security holds, using the per-PR
    dispositions to test the hypothesis rather than authorizing repeated blind fix rounds or a broader bypass.
