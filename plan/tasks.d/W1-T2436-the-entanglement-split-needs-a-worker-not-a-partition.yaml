  falsifier: |
    If a fresh read of `fix.instrument_entangled` over a union that COVERS the window finds the
    entanglement refusal is not reached — or is reached only on PRs a partition really could have
    split, meaning the prerequisite needed no new code — then a dispatch is the wrong instrument and
    this task should be closed in favour of the partition it rejects. The measurement must compare
    the prerequisite PR against the original for ADDED lines in files the original never touched;
    2 of 2 on record required them, and a run of zeros would refute the premise directly.

    SEPARATELY DECISIVE: if `outOfDiffBlockerFor` stops keying on `blocked on #N`, or if
    `instrumentPaths` and `srcPaths` stop being disjoint, the brief this task hands a worker no
    longer exists and the finding must be re-derived rather than trusted.
