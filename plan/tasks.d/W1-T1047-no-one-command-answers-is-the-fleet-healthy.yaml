    post-merge amendment on shipped work.

    THE SPARE RESERVATION IS LEFT ALONE, AND THAT IS THE DISTINCTION. A merely-reserved id with no
    citation anywhere is a spare and gets reused; an id already load-bearing in shipped code does
    not. `refs/rmd-id/W1-T1046` therefore stays as it is.

    `src/run-task.ts` IS DECLARED BECAUSE THE VERB REGISTRATION LIVES IN `COMMANDS` THERE, and
