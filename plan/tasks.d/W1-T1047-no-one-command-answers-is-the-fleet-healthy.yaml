    - claim: "the one-line summary and the process exit code both carry the worst verdict observed"
      proof: "unit test: doctor: the summary line and the exit code agree on the worst verdict"
    - claim: "the new module has a real call site — the verb registration dispatches into it from the CLI entrypoint"
      proof: "unit test: doctor: the verb registration dispatches into the doctor module"
