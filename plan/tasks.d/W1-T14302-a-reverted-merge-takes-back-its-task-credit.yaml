  rationale: |
    WHAT HAPPENED (2026-11-22). W1-T11112 merged as #20049 (3a6fe5dd57). With #20077 it broke main's
    typecheck at test/a-paired-dispatch-trial-shares-one-grader.test.ts:836 (TS2739). The fleet's
    main repair reverted it at about 05:05Z: #20136 (b17638178d) and a twin #20134 (483ea392eb). Both
    say "This reverts commit 3a6fe5dd57cf51426e501fb002973b4a8fbb1d6e." At 06:28Z the plan reconcile
    #20154 (94f3287c56) still flipped plan/tasks.d/W1-T11112-observed-worker-harness-contract.yaml
    from queued to merged. The code is gone from main, the plan says the task is done, and nothing
    will build it again. That is lost work with no signal.
    OTHER CASES on main (every "This reverts commit" body in main's whole history, checked by hand):
    - W1-T11459: #17260 reverted by #17304 on 2026-11-08, flipped to merged by reconcile #17755 on
      2026-11-10. Not lost: W1-T11728 (#17408) restored it under its own id. Its shard lists W1-T11459
      in plan_refs and its origin names "revert PR-17304". Criterion 3 keeps this case merged.
    - W1-T5113: #9091 reverted by #9131 on 2026-10-04 and flipped to merged by #9157 the same day.
      It was built again as #9213 with its own trailer, so its credit is real now (criterion 2).
    - The other matches are branch commits inside squash merges. Their sha is not on main.
    WHERE THE CREDIT IS DECIDED (origin/main 77d91a0c21):
    - The reconcile landing (src/lib/feedback-landing.ts:101, planReconcileLanding at :1877) lands
      the writes that planReconcileCadence (src/lib/measurement-cadence.ts:1514) gets from
      reconcilePlan (src/lib/plan-reconcile.ts:96). The credit set comes from
      buildPlanReconcileCadenceInput (measurement-cadence.ts:1582) and creditProjectionWithReadState
      (src/run-task.ts:19053). That calls buildCreditCandidates (src/lib/tick-read-worker.ts:3295),
      which calls projectPlan (src/lib/status.ts:4147) and filters with creditIsReconcilable
      (tick-read-worker.ts:136).
    - projectPlan runs deriveStatus (status.ts:3730) and derivePrPrecedence (status.ts:2620) per
      task. The rungs credit a task from: an operator correction, the durable credit store
      (merge-credit.json, status.ts:2659-2712), a manual completion, the ledger pr.opened PR, the PR
      body trailer, the run branch, and the commit trailer index (buildCommitTrailerIndex,
      status.ts:4074, a full `git log` of origin/main). Each rung asks only "did a PR with this task's
      trailer merge?". GitHub keeps #20049 MERGED after the revert, and its commit stays in main's
      history. No rung asks whether a later commit on main reverted it.
    - The only subtraction is plan/credit-overrides.yaml (creditOverrideExclusion, status.ts:2572;
      applyCreditOverride after it). It is a hand-written operator ruling per (task, PR) pairing.
      Nothing writes one for a revert.
    - The status file is one-way by design: reconcileShardStatus (plan-reconcile.ts:57) only moves
      queued to merged, so that a GitHub outage that reads every task as uncredited cannot reopen
      the plan. So even a correct projection would never move W1-T11112 back to queued.
    - Dispatch reads the projection, not the status field (plan-reconcile.ts header; planTaskLanded,
      src/run-task.ts:39456). A hand edit to queued does not dispatch the task, and the next
      reconcile (about every 4 to 6 h: #20114 02:17Z, #20154 06:28Z, #20210 11:56Z) flips it back.
    PRIOR ART: src/lib/learnings.ts:1746 and src/lib/verdict-calibration.ts:383 already match
    /This reverts commit\s+([0-9a-f]{7,40})/i. No filed task covers revert and credit (grep of
    plan/tasks.d for revert with credit or reconcile, 2026-11-22).
    AMENDMENT 2026-11-22 (an override does not reach the fleet). After the filing, the operator merged
    a remove-credit row for (W1-T11112, PR 20049) in plan/credit-overrides.yaml (#20236, 622c10f738,
    14:01Z). At 16:47:47Z the daemon tick sweep still released a hand `rmd claim` on W1-T11112:
    ledger row dispatch.claim_released, surface tick-sweep, pr_url #20049, arm evidence. The fleet's
    state/status.json still read W1-T11112 as source trailer, merged true, PR 20049, with no
    creditOverride field, and no task in that file carried creditOverride at all. Code facts at
    origin/main 5001dc528f:
    - The sweep's isMerged (src/cli/commands/daemon.ts:2479, releaseLandedClaims) is the tick's own
      isMerged (src/lib/daemon.ts:7636 and 7669): the merged field of the projectPlan projection
      (refreshMerged, daemon.ts:1657-1674, or the tick read producer, src/lib/tick-read-worker.ts:363).
      releaseLandedDispatchClaims (src/lib/dispatch-claim.ts:1117) skips a claim only when isMerged
      is false (dispatch-claim.ts:1130). Dispatch reads the same isMerged (isDispatchEligible,
      src/lib/drain.ts:682; its comment says t.status is never read there).
    - planTaskLanded (src/run-task.ts:39443) does read status: merged, but only for depends_on
      checks and the parked verify-human sweep (run-task.ts:38907, 39476, 39487), not for dispatch.
      A stale merged shard still marks its dependents' prerequisite as met, so the re-queue matters.
    - Every one of those projections finds the override file at
      defaultCreditOverridePath(ledgerPath) (src/lib/status.ts:581), which is
      dirname(dirname(ledgerPath))/plan/credit-overrides.yaml, so <config.root>/plan. On the fleet
      host config.root is /home/node/Remudero, and that file does not exist. The plan lives in the
      target checkout /home/node/Remudero/repos/remudero/plan, which does hold the W1-T11112 row.
      loadCreditOverrides (status.ts:587) reads a missing file as no rows, so in the fleet every
      remove-credit row subtracts nothing (status.ts:2572 and 4181 read it; tick-read-worker.ts and
      creditProjectionWithReadState, run-task.ts:19052, pass no creditOverridePath).
    - The shard's status: merged line cannot be edited by hand: any shard edit re-lints its unit
      test: proofs, whose tests were reverted, and fails with proof-unit-test-unresolvable.
    So an override row today neither stops the claim sweep nor re-queues the shard. Design steps 8
    to 10 fix the read at the projection, which is the predicate the sweep and dispatch share, and
    let the same bounded re-queue act on an override.
  design: |
    INVARIANT a-revert-takes-back-its-credit: a (task, PR) credit whose squash commit a later commit on main reverts does not stand, unless the work was merged again or the revert was itself reverted or restored.
    INVARIANT an-override-reaches-the-fleet-projection: every projection that feeds dispatch, the tick claim sweep or the plan reconcile reads the remove-credit rows of the checkout whose plan it projects; a missing or unreadable override file still subtracts nothing and re-queues nothing.
    INVARIANT a-dark-revert-read-changes-nothing: an unreadable or foreign history adds no exclusion; only a positive revert record on the read ref takes credit back or re-queues a shard.
    1. src/lib/reverted-merges.ts (new, pure):
       - revertedMergesFromLog(records): records are { sha, subject, body } from a main history walk.
         Map each commit with a squash subject (prNumberFromSquashSubject) to its PR number. For each
         body line "This reverts commit <7-40 hex>", resolve the sha by prefix among the records. A
         name that is not on the walk is ignored. Two reverts of one commit count once. A revert of a
         revert cancels the first revert. Returns a map from reverted PR number to { revertSha,
         revertPr }, where revertPr comes from the revert's own squash subject.
    2. src/lib/status.ts:
       - Build the revert map from the same `git log <ref> --format=%H%x00%s%x00%b%x1e` walk that
         buildCommitTrailerIndex already runs. Do not add a new synchronous spawn site: the row for
         buildCommitTrailerIndex in test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts must
         not grow, and no new name may join that table. Keep the same origin-slug check: a foreign
         checkout gives an empty map, and a failed read gives null, which means no exclusion.
       - Expose it on ghGateway and buildBatchedGithub as an optional GitHub method
         revertedMergePr?(prNumber). Re-read it when origin/main moves: a gateway that lives across
         ticks must not keep a map from before a new revert. Key the memo on the origin/main sha, as
         resolveMergeLogReadOptions (tick-read-worker.ts) does.
       - In creditOverrideExclusion, a pairing is also excluded when revertedMergePr(pr) answers and
         no restoration applies. So every rung, the durable rung and the applyCreditOverride backstop
         skip it, and a later legitimate merge of the task still credits it. Restoration: a later
         commit on main carries Remudero-Task for a task whose shard lists this task in plan_refs and
         names the revert PR as #<n> or PR-<n>. projectPlan holds the plan, so it supplies this check.
       - An excluded projection carries a sparse revertedCredit: { pr, revertSha, revertPr? } field
         beside creditOverride, so the board can say why a merged task reads queued.
    3. src/lib/plan-reconcile.ts: add requeueRevertedShard(text, taskId, projection). It changes
       "  status: merged" to "  status: queued" only when the projection carries revertedCredit, is
       not merged and is not indeterminate, and the shard has no retirement. It names its reason when
       it declines. Do not change reconcileShardStatus: its one-way rule and its tests stay as they are.
    4. src/lib/measurement-cadence.ts and src/run-task.ts: creditProjectionWithReadState also returns
       the reverted projections, as a sparse field that is present only when it is not empty, so
       today's result shapes stay the same. buildPlanReconcileCadenceInput adds the re-queue writes to the same
       landing, with an edit that runs requeueRevertedShard on main's current text (the W1-T13816
       rule). planReconcileCadence reports them as requeued task ids beside drift.
    5. src/lib/plan-reconcile-batch.ts and src/lib/feedback-landing.ts: the proof for a re-queued file
       is "grep: ^  status: queued$ in <file>". The carry-forward check near feedback-landing.ts:1749
       re-derives an earlier pending blob with that file's own edit, not only reconcileShardStatus.
    6. Ledger: one row plan.reconcile.reverted_requeue { task, pr, revert_sha, file } per re-queue,
       written where the landing input is built. Declare it in src/lib/ledger-steps.ts and in the
       recordOnly map of scripts/write-only-ledger-step-baseline.json (W1-T14149).
    7. Tests in test/a-reverted-merge-takes-back-its-task-credit.test.ts, titled "W1-T14302 criterion
       N: ...". Use fixture git repos made with `git init -b main` in a temp dir, or injected log
       records. Load test/setup/tmp-hygiene.ts. No test reads the real repository's history or calls
       GitHub. Change the listed existing tests only where a shape they pin changes (for example the
       cadence result or the batch proof).
    8. src/lib/status.ts: add planCreditOverridePath(checkoutRoot), which returns
       join(resolveRepoLayout(checkoutRoot).planDir, "credit-overrides.yaml"). Pass it as
       creditOverridePath from the target checkout in: createTickReadProducer's derive and its
       buildCreditCandidates call (tick-read-worker.ts, from options.checkoutRoot);
       buildCreditCandidates' creditIo, widened to Pick<DeriveDeps, "readCreditStore" |
       "writeCreditStore" | "creditOverridePath">; refreshMerged in src/cli/commands/daemon.ts (from
       targetCheckoutRoot); and creditProjectionWithReadState in src/run-task.ts (from its
       checkoutRoot). defaultCreditOverridePath stays for the board and console readers
       (board-projection.ts:850, workstreams-view.ts:363, run-task.ts:19905) and for
       createNativeTargetRepository (daemon.ts:649); they are not in scope here.
    9. requeueRevertedShard also acts on a projection that carries creditOverride, with the same
       guards: not merged, not indeterminate, no retirement, shard text "  status: merged". The
       ledger row is the same plan.reconcile.reverted_requeue step with a cause field: revert (with
       revert_sha) or override (without it). Declare cause in the step's fields. No new step.
    10. The claim sweep needs no special case. Its isMerged is the projection's merged field, so
       steps 2 and 8 make it false for a reverted or overridden pairing. Do not read shard status
       in releaseLandedDispatchClaims or in releaseLandedClaims, and do not add a per-task list.
    11. src/cli/commands/sweep.ts calls buildCreditCandidates at two places that omit creditIo: the
       sweepCommand pass and the daemon sweep's fallback when tickRead.creditCandidates is absent.
       Pass creditOverridePath: planCreditOverridePath(<the target checkout root>) in both. These
       candidates set taskMergedBy (sweep.ts projectMergedTaskCandidates), which closes an open PR
       as a leftover; on 2026-11-22 17:17Z that close took rebuild PR #20283 for W1-T11112 while its
       override row was inert.
    AFTER THE BUILD MERGES: the first reconcile pass re-queues W1-T11112 and writes one
    plan.reconcile.reverted_requeue row for it (the revert and the override name the same pairing;
    one row, either cause). The other override rows (PORTAL-T19 107, W1-T5016 8212, W1-T5017 8213,
    W1-T380 1437) now reach the fleet projection for the first time; their tasks are credited by
    other PRs (state/status.json: W1-T5016 by 8683, W1-T5017 by 8455, W1-T380 by 1392), so they
    stay merged. W1-T11459 and W1-T5113 stay merged. Check both on the
    host with `rmd ledger-grep plan.reconcile.reverted_requeue` and the next reconcile PR's file list.
  falsifier: |
    On origin/main, criterion 1 reads W1-T1 as merged after the revert. Remove the exclusion from the
    durable rung only: criterion 1's durable-store case stays merged. Exclude per task, not per
    pairing: criterion 2's later PR 140 does not credit. Drop the restoration check: criterion 3
    re-queues the W1-T11459 fixture. Treat a failed history read as "every PR reverted": criterion 4
    changes projections. Let requeueRevertedShard act on missing credit instead of revertedCredit:
    criterion 5's no-revertedCredit shard is rewritten. Leave the landing's carry-forward as it is:
    criterion 6's earlier re-queue is dropped. Wire the re-queue only in tests: the
    requeueRevertedShard( grep in src/lib/measurement-cadence.ts finds nothing. Let
    requeueRevertedShard ignore creditOverride: criterion 8's overridden shard stays merged. Keep
    defaultCreditOverridePath in the tick read producer: criterion 9's projection reads merged true
    with no creditOverride, because <config.root>/plan does not exist in the fixture. Release a claim
    whenever the shard text says merged: criterion 10's reverted and overridden claims are released.
