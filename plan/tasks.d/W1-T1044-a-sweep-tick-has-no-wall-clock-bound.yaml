- id: W1-T1044
  title: "A SWEEP TICK HAS NO WALL-CLOCK BOUND, SO A FIX-RUNG WORKER THAT NEVER RETURNS PARKS THE DAEMON INDEFINITELY — the turn cap and the budget cap cannot fire on a shell command that never returns, and the run has been measured 21 times in seven days for 20.9 hours total, the longest 165 minutes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    MEASURED 2026-08-19/20 AT origin/main 39c690ef, on the Azure host. Process state was captured
    from `/proc` BEFORE the operator recycled the daemon and cannot be re-taken; the source and
    ledger halves below are re-derived at that sha. No `/rate_limit` call was made and no process
    was signalled.

    (1) WHAT HAPPENED. A `claude` worker ran 8,970s as a DIRECT CHILD of the daemon, spawned two
    seconds after boot, in `ep_poll`. Its `--settings` path and cwd named the lane and the task that
    no ledger row named: `sweep-fix-settings-W1-T446-*.json` and
    `worktrees/sweep-W1-T446-*`. Its child was a shell loop with no exit condition it could reach —
    `until [ "$(gh run view <id> --json status --jq .status 2>/dev/null)" = "completed" ]; do sleep
    20; done` — no iteration cap, no timeout, and `2>/dev/null` makes a failing `gh` return an empty
    string that can never equal `completed`. A BROKEN gh AND AN UNFINISHED RUN ARE
    INDISTINGUISHABLE TO IT. The daemon sat in `ep_poll` with that worker as a direct child and
    essentially no CPU movement; `await deps.sweep()` had not returned since 21:10:45 and
    `daemon.sweep.failed` never fired, because nothing threw.

    (2) THE CLASS, WHICH IS NOT THE LOOP. The worker carries `--max-turns 400` and
    `--max-budget-usd 45` and NO TIME BOUND. A shell command that never returns burns NEITHER a
    turn NOR a dollar, so both caps are structurally unable to fire. Fixing the `until` loop fixes
    one instance; THE NEXT WORKER WILL WRITE A DIFFERENT UNBOUNDED COMMAND. The loop is the trigger
    and the missing wall-clock bound is the defect.

    (3) IT IS RECURRENT, NOT A ONE-OFF — AND THIS IS THE MEASUREMENT THAT MATTERS. `daemon.alive`
    carries a `phase` field (`startInFlightTicker`, `src/lib/daemon.ts`) present on all 5,635 rows
    since 2026-08-12T23:46:59 (control: 0 rows without it). Sweeping for runs of consecutive
    `phase: sweep` rows with no `dispatch` between them finds 28 runs, 21 of them longer than 20
    minutes, 9 longer than an hour, the longest 165.5 minutes. THE CONFOUND WAS RULED OUT: a fast
    dispatch emits no ticker row, so each of the ten longest runs was checked for ANY post-sweep
    step — `daemon.iteration`, `daemon.headroom`, `daemon.quota`, `daemon.idle`, `dispatch.*`,
    `daemon.orphan_sweep`, `daemon.feedback_landing_sweep` — and ALL TEN CONTAIN NONE, against
    corpus controls of 2,108 `daemon.quota`, 1,045 `daemon.headroom` and 931 `daemon.idle` rows. The
    loop genuinely never reached dispatch. Total: 20.9 hours over a 168.2-hour instrumented window,
    12.4% of it.

    (4) BUT IT DOES NOT EXPLAIN ALL THE IDLE TIME, AND THE SHARD SAYS SO. Restricted to the same
    instrumented window, 19 of 80 above-median inter-dispatch gaps overlap a hang (24%), covering
    11% of long-gap seconds. So the fleet was hung repeatedly AND was also genuinely waiting for
    work most of the time. THE 91%-BUILT PICTURE STANDS AND THE IDLE DIAGNOSIS IS PARTLY WRONG
    RATHER THAN OVERTURNED.

    (5) THE STALL DETECTOR IS ALREADY BUILT AND HAS NEVER FIRED. W1-T943 shipped one in #2051 — a
    policy-data quiet threshold, `worker.stalled` ledgered once, escalating through the existing §4
    machinery, 213 lines into `src/run-task.ts` plus a 440-line suite — and W1-T942 shipped the
    `worker.state` sensor in #2037. Neither saw this worker. ALL 2,854 `worker.state` rows in the
    corpus carry a `W1-T…` DISPATCH-LANE run_id and ZERO carry a sweep- or fix-shaped one; no row of
    ANY step does. `worker.stalled` has never been written, against positive controls of 8
    `ci.stalled` and 2 `pr.stalled`. A detector keyed on worker silence cannot observe a worker that
    was never sensed, so the built detector had no subject.

    (6) THE QUOTA METER GOES BLIND EXACTLY WHEN IT MATTERS. `daemon.quota` records the GraphQL
    bucket (`bucket: "graphql"`, `remaining`, `resets_at`) but is logged AFTER the sweep, so ZERO
    quota rows fall inside ANY of the eight longest hangs. An unledgered worker polling GraphQL
    every 20 seconds is invisible to it by construction. On whether exhaustion TRIGGERS the hang the
    evidence is suggestive and thin, and is recorded that way: 3 of 21 hangs began with the last
    reading at `remaining: 0` against a base rate of 2.1% across 1,054 readings — roughly sevenfold
    enrichment — but the other 18 began with ample budget. NOT ESTABLISHED AS THE CAUSE.

    (7) AND ONE CIRCULATING FIGURE IS WRONG. `daemon.idle_reasons` is logged after
    `await deps.sweep()`, so a tick that never returns can never reach it. Its newest row,
    2026-08-18T17:30, has been read all day as "the daemon has not been idle". IT IS A CONSEQUENCE
    OF THIS STALL, NOT EVIDENCE ABOUT THE QUEUE, and the pool was not empty when it was quoted —
    `runnableCandidates` returned 19 eligible tasks (controls: limit=0 -> 0, limit=3 -> 3).
