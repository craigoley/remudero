  note: |
    WHERE THE BOUND GOES, AND WHAT EACH PLACEMENT MISSES. Three candidates, and the measurement says
    TWO ARE REQUIRED because neither covers the other.

    (a) ON `await deps.sweep()` (`src/lib/daemon.ts`). This is the one that frees the DAEMON — it is
    the await that did not return, and bounding it is what lets the next tick reach dispatch. WHAT
    IT MISSES: it abandons the sweep without touching what the sweep spawned. THE HUNG WORKER KEEPS
    RUNNING AFTER THE DAEMON GIVES UP ON IT, still holding its worktree, its lock and its API
    session, still polling. A bound here alone converts one parked daemon into an orphan that
    nothing reaps.

    (b) ON THE WORKER SPAWN inside `runFixRung` (`src/run-task.ts`). This is the one that RECLAIMS
    THE RESOURCES. WHAT IT MISSES: it bounds only this spawner. The sweep can hang on anything else
    it awaits — a network read, a different spawn — and the daemon parks exactly as before.

    (c) ON `runFixRung` AS A WHOLE. Strictly between the two and covers neither fully: it does not
    bound the rest of the sweep, and by itself it does not say what becomes of a worker still alive
    when the rung returns.

    SO THE TASK TAKES (a) AND (b) TOGETHER: the daemon-side bound restores dispatch, and the
    worker-side bound stops the abandoned worker becoming an unreaped orphan. (c) IS NOT BUILT.

    WHAT HAPPENS TO AN ABANDONED WORKER, AND WHY THE CI PRECEDENT DOES NOT TRANSFER CLEANLY.
    W1-T1009 capped CI jobs and that worked, but a CI job holds nothing: a `claude` worker holds a
    worktree, a lock and a live API session, and killing one mid-run LOSES UNRECORDED IMPLEMENT
    SPEND — a `verdict` row is only written when the run ends, so an abandoned worker's thinking
    appears nowhere. The bound must therefore RECORD BEFORE IT RECLAIMS: the task id, the elapsed
    time and the run's own identifiers go to the ledger first, so the abandonment is legible even
    though the spend is not recoverable. Deliberately NOT in scope: recovering that spend, resuming
    an abandoned run, or any partial-cost estimate.

    THE THRESHOLD IS POLICY DATA, NOT A LITERAL. `plan/policy.yaml` already carries W1-T943's own
    quiet threshold with its derivation written beside it, and `src/lib/policy.ts` already parses
    bounded numeric fields (`minIntervalMinutes`, `maxPerDay`). This bound follows that shape. IT
    MUST SHIP AT A VALUE ABOVE THE OBSERVED HEALTHY MAXIMUM, not at a round number: healthy sweep
    ticks measured 61.8s median and 111.8s p90, and the shortest confirmed hang ran 20 minutes, so
    the whole healthy population and the whole hung population are separated by more than an order
    of magnitude. THE FIRST TEST WRITTEN MUST BE THE INSIDE-THE-BOUND PATH, so a sweep that is
    merely slow is never abandoned.

    WHAT MUST NOT BE BUILT. NOT A FIX FOR THE `until` LOOP — it is the trigger, not the defect, and
    bounding one shell idiom leaves the class open. NO NEW LEDGER STEP FOR LIVENESS: the `phase`
    field already distinguishes a sweeping tick from a dispatching one and the fix there is a
    READER, not a signal (see the sibling below). NO KILL PATH FOR A HEALTHY WORKER. NO CHANGE TO
    `--max-turns` OR `--max-budget-usd`. NO CHANGE TO `drain.lock`, which is the daemon's
    single-instance guard taken at boot and released on signal — holding it for the daemon's
    lifetime is correct and it is NOT involved.

    SIBLINGS, NAMED AND NOT ABSORBED. **THE `phase` READER IS THE DETECTION HALF AND IS A SEPARATE
    CONCERN.** `daemon.alive` carries `phase` and NOTHING READS IT — the string "daemon.alive"
    appears three times across `src/`, one of them the write site in `startInFlightTicker`. Since
    21:09 there were 140 `daemon.alive` rows, ALL `phase: sweep`, ZERO `dispatch`, against a control
    of 110 sweep / 135 dispatch before the hang. The signal that would have caught this in sixty
    seconds already exists and has no consumer; building that reader is detection-after-the-fact and
    this task is prevention. W1-T513 added the ticker precisely so a slow full sweep would not
    starve the light pass, AND IT SUCCEEDS AT THAT — the defect is that the liveness signal the
    fleet trusts is emitted by the mechanism that masks the stall. W1-T484 is the INVERSE concern
    (`status: queued`) — a busy daemon reported dead — and is not this one. W1-T943 and W1-T942 are
    BUILT and are not re-filed; rationale (5) records why they did not see this worker, and whether
    the fix-rung lane should emit `worker.state` at all is a THIRD concern that is named here and
    not answered.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT, chosen by a word-bounded invocation count of the
    seams the bound touches (`runFixRung`, `startInFlightTicker`, `deps.sweep`, `pollIntervalMs`):
    `src/lib/daemon.ts` 45, `src/run-task.ts` 32, `src/lib/sweep.ts` 12. `src/lib/sweep.ts` is
    DELIBERATELY NOT DECLARED — `runSweep` is the thing being bounded, not the thing that bounds,
    and neither placement (a) nor (b) edits it. `src/run-task.ts` IS DECLARED because `runFixRung`
    is defined there; per DECISIONS.md's 2026-08-18 W1-T471 ruling that file is not split and tasks
    are not re-scoped to avoid it, and the ruling states the ceremonial acceptance sentence is no
    longer required, so it is declared plainly and the serialisation cost is accepted.

    `test/sweep-wall-clock-bound.test.ts` DOES NOT EXIST at 39c690ef — a forward-referenced PATH,
    never a guessed symbol — and is a new file because the house rule keeps a coverage-load-bearing
    test out of a shared suite.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text, and this set
    crosses two `src/` modules, a plan file and `test/`. Blast radius argues UP in one direction:
    the seam is the daemon's main loop, and a bound set too low would abandon healthy sweeps, which
    is why the threshold is required to sit above the observed healthy maximum rather than at a
    round number.

