      proof: "unit test: product plan coverage observation preserves source inventory and mapping unknown states"
    - claim: same-input replay is stable and reporting failure cannot change operation state proof verdict or build admission
      proof: "unit test: product plan coverage observation preserves operation and admission behavior"
    - claim: the real served observation and generated response schema retain bounds privacy and optional legacy compatibility
      proof: "unit test: product plan coverage observation reaches the bounded served response contract"
  falsifier: Substitute the current brief after its digest changes, erase an entry from an independently pinned reviewed inventory, treat absent inventory as zero requirements, label a link implemented, mutate operation state because report generation fails, or drop the optional report at the actual served response. Each corresponding physical case must fail with its isolated guard removed and pass when restored; retain control/mutant/restored receipts. A proposal omitting arbitrary source meaning remains semantic-review-unverified, with no claim that structural tests infer all requirements. Healthy exact-source and legacy-without-report controls must preserve existing operation/admission results.
