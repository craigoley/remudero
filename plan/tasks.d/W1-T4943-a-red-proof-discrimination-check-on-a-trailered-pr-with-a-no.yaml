  falsifier: |
    Remove the new arm and the first test sees `dispatchFix` called with `proofDiscrimination` evidence (the #8177 behaviour, a worker whose proposal is never applied). Let the arm fire
    with no `pr.taskId` and the third test sees no ci-log dispatch. Keep the `proofs[0]`-only flag and the fifth test finds one unmarked proof. A test that only reddens on removal pins
    that the arm exists, not what it decides: the second and third tests are the two directions.
  note: |
    RISK: high because it changes which actor spends on a red PR and writes a plan PR. The flag lane edits no claim/proof/satisfied_by line, so it needs no Rule 15 carve-out.
    OVERLAP: W1-T4957 (merged) owns the evidence builder and the empty-diff close; this task narrows its routing and does not touch `proofDiscriminationEvidenceFromCheckLog`'s output shape.
    A builder who finds the flag PR unreadable to the operator should widen the marker text, never the authority. NOT MEASURED: the fleet ledger is not on disk in the research session,
    so how many stale-proof reds reached a worker in production is unknown; the routing facts above were probed on main with fakes.
