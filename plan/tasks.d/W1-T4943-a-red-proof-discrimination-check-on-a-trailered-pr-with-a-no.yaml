  rationale: |
    MEASURED 2026-09-30 at origin/main 1f6d904bb, by driving the shipped `runFixRung` with fakes (scratch test, deleted) and by calling the shipped pure
    functions. #8177 (W1-T4957) sends a stale-proof red to the `proof-discrimination` fix mode. THE WRITER THAT MODE FEEDS NEVER RUNS ON THIS ROUTE.

    (1) UNREACHABLE. `runFixRung` calls `dispatchProofAmendmentWrite` only after the strike's push has been followed by a GREEN CI wait
    (src/run-task.ts:11498). A proposal-only worker does not move the head, the required `proof-discrimination` check stays red, and
    `ciGateState(ci) !== "green"` at run-task.ts:11293 hits `continue` (run-task.ts:11390) first, setting `noReviewYet`. Probed with a red
    `waitForCiGreen`: strike 1 logs `fix.dispatch mode=proof-discrimination` then `fix.ci_not_green`; strike 2 logs `fix.dispatch mode=ci-log`; no
    `proof_amendment.requested` row exists. The second worker is exactly the ci-log worker #8177 set out to avoid. `proofDiscriminationNow`
    (run-task.ts:10722) requires `!noReviewYet`, so the mode never returns.

    (2) REFUSED IF REACHED. With a green wait the probe logs `proof_amendment.requested outcome=ineligible reason=review-not-success` on round 1.
    `buildFixRungDispatchArgs` seeds `initialReview.state = "failure"` (run-task.ts:37785) and `proofAmendmentIneligibleReason` returns on
    `pr.reviewState !== "success"` (src/lib/proof-amendment.ts:94). The capped-green route shares that seed, so W1-T3434's own writer is ineligible on round 1
    there too; it reached `refused` only on round 2, where `runReview` had replaced the seed.

    (3) CLAIM DRIFT. The gate's log carries no claim, so `proofDiscriminationEvidenceFromCheckLog` (src/lib/sweep.ts:7940) sets `claim = proof`. The writer
    then calls `replaceProofScalar(text, claim, oldProof, newProof)`, whose nearest-preceding-`claim:` test (src/lib/proof-amendment.ts:266-277) cannot contain
    the proof string: measured on the W1-T4957 shard, claim=proof string returns `undefined` (`shard-drifted`, proof-amendment.ts:443-445), the real claim returns text.

    (4) A SUCCESS WOULD STILL DEBIT A STRIKE. `recordIdentity` logs the amendment as `fix.dispatch kind=proof_amendment` (src/run-task.ts:11989), and
    `priorStrikesFor` counts every `fix.dispatch` row: measured 1 row -> 1, plus the identity row -> 2, which is `fixStrikeCap` 2, so the PR escalates as
    "strikes exhausted" the pass after its amendment opens. That is a defect of the capped-green route as well and is NOT fixed here (see design (v)).

    WHY NOT FIX THE WRITER. The writer's authority is a worker proposing a replacement `proof:` that the parent only checks for head-vs-base discrimination (passes at head,
    fails at base, not the plan shard). It never checks that the proof still proves the CLAIM, so on this route it is the act Standing rule 15 forbids, editing a criterion
    to match the diff: a stale proof is either work a merged parent already landed or a preservation invariant (#8099 dropped one by hand from W1-T4902 for exactly that
    reason), and only an Architect can tell which. Re-classifying `kind: guard` is worse: `criterionFieldTampered` protects only claim/proof/satisfied_by
    (src/lib/review.ts:7687), so a `kind:` edit is invisible to Rule 15. The lane that already does the safe thing is W1-T3390's `dispatchPlanOnlyRepair`
    (src/lib/sweep.ts:3262): no worker, a plan-only PR that adds a YAML comment beside the stale proof and edits no claim/proof/satisfied_by line, bounded by
    `MAX_PLAN_REPAIR_STRIKES` (2) and deduped on branch `plan-repair/<taskId>`. It is reached only from the capped-green route and flags only `proofs[0]`.

    WHY TRAILERED ONLY. The gate resolves criteria from the PLAN at the PR head for a trailered PR and falls back to the body only when that is empty
    (scripts/proof-discrimination-gate.mjs:36-40). For a PR with no task trailer the body IS the criteria, a ci-log worker can edit it, and the
    proof-discrimination prompt tells that worker NOT to (src/lib/prompt-render.ts:734-740), so #8177 also regressed that shape.
  design: |
    (i) In runSweep's blocked-fixable arm (src/lib/sweep.ts, after the empty-diff close and before any worker claim), when `staleProofs` reads AND `pr.taskId` is set
    AND the diff is non-empty or unobserved AND `deps.dispatchPlanOnlyRepair` is wired: dispatch `dispatchPlanOnlyRepair(pr, staleProofs)` under the same claim and
    detach wrapper W1-T3390's branch uses, and do NOT call `deps.dispatchFix`. No worker, no strike. The empty-diff close keeps its place in front.
    (ii) When `priorPlanRepairStrikesFromLedger(pr, ledgerLines)` has reached `MAX_PLAN_REPAIR_STRIKES`, or `dispatchPlanOnlyRepair` is not wired, escalate through the existing
    `deps.escalate` with a reason naming the stale proofs; never fall through to a worker.
    (iii) A PR with no `pr.taskId` keeps the ci-log evidence (`fixEvidence` without `proofDiscrimination`): `staleProofs` is read only when `pr.taskId` is set.
    (iv) New exported pure helpers in src/lib/sweep.ts: `claimForProof(shardText, proof)` returns the `claim:` text of the unique criterion whose `proof:` line carries that proof
    (undefined when absent or ambiguous), and `flagStaleProofs(shardText, proofs, marker)` applies `insertPlanRepairFlag` to EVERY stale proof, placing the resolved claim in each marker
    and listing the Architect's options (drop a preservation criterion, precedent #8099; `satisfied_by` the merged stack parent; re-point the proof at a line the PR adds), and returns
    undefined when any proof no longer appears. `dispatchPlanOnlyRepair` uses them in place of its `proofs[0]` read.
    (v) NOT IN SCOPE, said plainly: the four writer defects above stay in the capped-green route and are a separate filing (call the writer before the green wait or eligibility by
    evidence source; give the identity row its own step or exclude `kind: proof_amendment` from `fixLedgerRowsForHead`). No `kind: guard`, `satisfied_by` or drop is ever written by automation.
    The FixMode prompt text ("The review was CAPPED") is correct for the capped route and is no longer reached by check-log evidence, so it is not edited.
