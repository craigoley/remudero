- id: W1-T4943
  title: "A RED proof-discrimination CHECK ON A TRAILERED PR WITH A NON-EMPTY DIFF IS ROUTED (#8177) TO A FIX WORKER THAT CAN NEVER CLEAR IT — the proof-amendment write it reaches is not called until CI is green (run-task.ts:11293 continues first), would be refused `review-not-success` on the seeded round (proof-amendment.ts:94), and would drift on a claim that is the proof string; probed on main, strike 1 is proof-discrimination and strike 2 is ci-log, zero proof_amendment rows"
  repo: remudero
