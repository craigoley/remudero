- id: W1-T12940
  title: "A dependency pull request is judged against its own repository's required checks, so a managed repository's Dependabot bumps stop being held as pending forever"
  repo: remudero
  priority: 0.9
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # it decides which checks must be green before the dependency lane arms a bump; a wrong set either arms early or never arms
  band_meaning: span
  origin: "operator-session#pr-queue-root-causes-2026-11-15"
  plan_refs:
    - W1-T9929
    - W1-T11606
    - W1-T11865
  files:
    - src/cli/commands/sweep.ts
    - src/run-task.ts
