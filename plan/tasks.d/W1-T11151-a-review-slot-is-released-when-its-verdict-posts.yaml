    findings, item 3 (p1), first half: release at post. The second half, cheap child start, is W1-T11152. Ordering: do not build in
    parallel with W1-T11149 (both edit the child registry in src/lib/sweep.ts and runReview); not in depends_on because it is not
    on main at filing.
