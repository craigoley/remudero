  depends_on:
    - W1-T11926
  priority: 1.3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # how two host jobs get a GitHub credential; the value must never reach a log or a command line
  band_meaning: span
  origin: operator-session#follow-ups-2026-11-10
  plan_refs:
    - W1-T11926
    - W1-T236
  files:
    - deploy/rmd-host-cleanup.sh
    - deploy/idle-starved-probe.sh
    - src/run-task.ts
    - test/deploy/a-scheduled-shell-job-takes-its-github-credential-from-the-resolver.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "One command runs a given command with the credential that the resolver chose in its environment. It prints the name of the source and never the value"
      proof: "grep: W1-T12170 criterion 1 in test/deploy/a-scheduled-shell-job-takes-its-github-credential-from-the-resolver.test.ts"
    - claim: "The host cleanup job makes its GitHub calls through that command. Its own default token file is gone from the script"
      proof: "grep: W1-T12170 criterion 2 in test/deploy/a-scheduled-shell-job-takes-its-github-credential-from-the-resolver.test.ts"
    - claim: "The idle probe makes its GitHub call through that command and no longer mints a token in its own inline script"
      proof: "grep: W1-T12170 criterion 3 in test/deploy/a-scheduled-shell-job-takes-its-github-credential-from-the-resolver.test.ts"
    - claim: "When no source answers, each job logs one line that names every source tried, and then does what it does today without a credential"
      proof: "grep: W1-T12170 criterion 4 in test/deploy/a-scheduled-shell-job-takes-its-github-credential-from-the-resolver.test.ts"
    - claim: "The command calls the resolver"
      proof: "grep: resolveGithubCredential( in src/run-task.ts"
  rationale: |
    OBSERVED 2026-11-10 in the source on main: two scheduled shell jobs each find a GitHub credential in their own way.
    - deploy/rmd-host-cleanup.sh reads the first line of `~/.gh-token` when GH_TOKEN is not set (`RMD_CLEANUP_GH_TOKEN_FILE`).
    - deploy/idle-starved-probe.sh mints an App token with an inline Node script and exits 2 when that fails.
    - W1-T11926 files one resolver for every gh call that the TypeScript code makes: a reference for one repository, a reference for all, the ambient GH_TOKEN, then gh's own login. It names every source it tried when none answers.
    - A shell job does not go through that code. After W1-T11926, the token file of the cleanup job is a source that the resolver does not know, and a failure there names no cause.
  design: |
    Add a command to the table in src/run-task.ts that calls `resolveGithubCredential` and runs the rest of its arguments as a child with the credential in the child's environment.
    The two jobs call it for each gh call. A job that must run before the engine checkout exists keeps its exit code of today and logs why.
    The operator who wants the old token file adds it to the resolver as a file reference. W1-T11926 defines that kind.
    The value never appears in an argument, in standard output or in a log.
    NOT IN SCOPE: the resolver itself, the container's own GH_TOKEN, and deploy/recycle-container.sh.
  falsifier: |
    Print the value and criterion 1 must fail. Leave the default token file in the cleanup job and criterion 2 must fail. Exit with no line when no source answers and criterion 4 must fail. Restore and require all to pass.
  note: |
    Build this after W1-T11926 merges. Its module src/lib/github-credential.ts is not on main at this filing.
