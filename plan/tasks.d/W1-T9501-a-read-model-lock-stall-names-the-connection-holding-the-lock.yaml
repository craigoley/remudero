  rationale: |
    CORRECTNESS AMENDMENT 2026-10-17: distinguish attempted acquisition, recorded successful acquisition,
    released/stale records and unverifiable process identity. This preserves the three-file diagnostic scope,
    budget, review gates, limits and all operational guards; it adds no lock, reclaim or recovery authority.
    A natural 21:12:51Z agent publication failure now identifies exec.begin-immediate on namespace PID508474.
    The independently checked current serve host PID3528404/start275349447 maps to that namespace PID.
    This identifies the failing connection, not the blocking holder. SQLite's transaction documentation says
    BEGIN IMMEDIATE can fail while another write transaction is active; no successful acquisition can be
    inferred from a record written before that call returns. The bind mount also crosses PID namespaces.
    OBSERVED in the core ledger (archive ledger.2026-10-14T13-40-43-328Z.ndjson.gz and the live file), serve run
    SERVE-1791980175174, pid 128:
      - 12:27:02Z first read_model.tick_failed "database is locked [connection=369176e1…/writer pid=128 thread=4
        path=/home/node/rmd-scratch/read-model/core.v1.sqlite]", and in the same second read_model.view_cost_write_failed
        "database is locked [connection=21045f48…/writer pid=128 thread=12 …]". Both of serve's writers waited.
      - 12:29:00Z read_model.stalled (stalledMs 77500), the store was reopened; 12:30:05Z read_model.stall_escalated
        opened #11656; tick_failed continued (failures 9..17, backoff 60 s) with fresh connection ids after each reopen.
      - 12:40:43Z read_model.unstalled, stalledMs 784978, with no operator action. Single one-retry lock misses
        recurred at 13:24Z, 13:48-13:49Z and 15:34Z.
    INFERRED: other transaction activity blocked these attempts. The rows do not establish one continuous
    third holder for the entire thirteen-minute interval. identifyLockFailure (read-model-db.ts)
    appends only the WAITING connection's id, role, pid and thread, so neither the tick_failed rows nor the
    escalation can say which connection, thread, process or code path held it. The read-model directory is bind-mounted
    into BOTH the serve and core-daemon containers (/mnt/scratch/rmd/rmd-state2/read-model), so the holder may be
    another process. W1-T5177 moved READERS onto read-only connections; the actual conflicting operation
    and its owner remain unknown. This task supplies bounded transaction observations, not a recovery policy.
  design: |
    1. Every writable ReadModelDb (openReadModel's writer and attachReadModel) records each write transaction it
       opens in a per-database sidecar directory (readModelSidecarDir), one bounded atomic record per connection.
       Include connection/transaction nonce, caller label, thread, process identity and timestamps.
       An attempted BEGIN is never a verified holder.
       A before-BEGIN record, if needed for a blocked call, is explicitly attempting. Only after BEGIN IMMEDIATE
       returns successfully may it become recorded-acquired, with a separate acquisition timestamp. A failed
       BEGIN never promotes it. Successful COMMIT/ROLLBACK or close retires only that connection/transaction's
       own record; a failed COMMIT may leave a live transaction and must not be reported as released.
    2. Process liveness requires matching boot ID, PID namespace and process start ticks; otherwise report unknown.
       A bare pid, process existence, age or namespace mismatch cannot establish liveness or death. Preserve
       cross-container records as unverifiable when identity cannot be checked; PID reuse is not the old owner.
       Dead-identity records are stale. Missing, malformed, unreadable and truncated inventories are explicit
       unknown/incomplete states, never no-holder evidence. A successful acquisition record is last-recorded
       transaction evidence, not independent proof that it still owns SQLite's lock at the failure instant.
    3. identifyLockFailure and read_model.stalled/stall_escalated carry the same bounded diagnostic observations:
       attempting, recorded-acquired, stale or unknown, with label, identity, as-of and elapsed record age.
       Keep at most three oldest relevant records and report inventory completeness separately. An attempt's
       age is never held duration. No record is none-recorded, not no lock; outside connections and implicit
       transactions may be unobserved. A failing connection is never relabeled as the blocking connection.
    4. Diagnostic records grant no lock-release, lease-clearing, capacity-reclaim or lifecycle authority.
       Sidecar failure never blocks/fails a database write, changes busy timeouts or transaction ordering,
       deletes another connection's records, or increases a resource/safety limit. Log a bounded
       read_model.holder_record_failed once per connection; failed cleanup stays explicitly unverified.
    Tests stay in the existing new-file scope with the verbatim proof titles. Use a REAL private WAL database
    and two connections: one successfully acquires BEGIN IMMEDIATE; the other's real failed BEGIN remains an
    attempt, not a holder. Preserve label/oldest-record escalation and unknown/unrecorded controls. Add
    acquisition failure, failed COMMIT, successful release/close, cleanup failure, PID reuse, foreign namespace,
    identity unreadability, malformed/truncated inventory and late cleanup of an old nonce controls. At least
    one test uses the real default sidecar writer and a real child process; fakes alone do not cover it.
  acceptance:
    - claim: "a real failed write reports the separately recorded successful acquisition and label, never its own attempting record as the holder"
      proof: 'grep: test("W1-T9501: a locked write names the connection holding the lock" in test/a-read-model-lock-stall-names-the-connection-holding-the-lock.test.ts'
    - claim: "a stall escalation carries the oldest recorded acquisition with explicit state and observation age, not an invented continuous blocking duration"
      proof: 'grep: test("W1-T9501: a stall escalation names the oldest lock holder" in test/a-read-model-lock-stall-names-the-connection-holding-the-lock.test.ts'
    - claim: "verified dead identities are stale, reused or foreign/unverifiable identities are unknown, and absent records mean none-recorded rather than no lock"
      proof: 'grep: test("W1-T9501: a dead or unrecorded holder is named as such" in test/a-read-model-lock-stall-names-the-connection-holding-the-lock.test.ts'
  falsifier: |
    Remove the holder record from immediate() and the locked write's error names only the waiting connection again.
    Promote a before-BEGIN attempt to a holder: the real competing-writer control must fail. Trust bare pid
    existence or age across namespaces: identity controls must fail. Treat failed COMMIT or sidecar cleanup as
    verified release: the corresponding controls must fail. Restore each change and require actual passing
    test/file inventories, same-commit instrumented coverage, canonical proofs, governed review and CI.
