      proof: 'grep: test("W1-T4926: a newly deployed model is trialed once and never on a timer" in test/a-newly-deployed-model-earns-its-lane-by-a-bake-off.test.ts'
    - claim: "the trial covers every thinking level the model accepts"
      proof: 'grep: test("W1-T4926: the trial covers every thinking level the model accepts" in test/a-newly-deployed-model-earns-its-lane-by-a-bake-off.test.ts'
    - claim: "the result is one proposal with the ranked table, and routing is unchanged"
      proof: 'grep: test("W1-T4926: the result is one proposal with the ranked table, and routing is unchanged" in test/a-newly-deployed-model-earns-its-lane-by-a-bake-off.test.ts'
    - claim: "the sweep calls the trigger"
      proof: 'grep: findUntrialedModels( in src/lib/sweep.ts'
  falsifier: |
    Run the bake-off on every sweep and the first test sees a second trial for the same model.
