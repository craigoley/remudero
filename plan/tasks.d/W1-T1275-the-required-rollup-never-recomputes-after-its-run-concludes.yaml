- id: W1-T1275
  title: "THE REQUIRED ROLLUP NEVER RECOMPUTES ONCE ITS OWN RUN CONCLUDES — `ci-gate` resolves the latest attempt per name and re-reads inside a 600-second grace window, then stops forever, so a sibling that goes green two hours later leaves a green suite held by a verdict about a state that no longer exists"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  rationale: |
    MEASURED 2026-08-23 in a scratch worktree proved equal to `origin/main` at ffcddf0b before any
    reading. The clone was checked rather than assumed and was already full (2,040 commits). Files
    over the contents-API cap were read as git objects. Ledger figures come from
    `resolveLedgerUnion` on `"step":"<name>"` anchors over 21 archives, `ok:true`, `unread:0`, with
    step names taken from source; the control `"step":"risk_judge.decision"` read 152 at the time
    of this pass (it reads live and grows).

    (1) THE INSTANCE, RE-DERIVED AT #2612's HEAD `e97690b0` WITH `filter=all`. `ci-gate` ran
    14:27:16Z → 15:12:54Z, conclusion `failure`. `coverage-ratchet` has two attempts: `cancelled`
    at 14:27:16Z (completed 15:02:32Z) and `success` at 17:03:13Z (completed 17:17:36Z). `ci` reads
    `success`, completed 14:41:30Z. So the gate was CORRECT WHEN IT RAN — a cancelled required
    check is a terminal non-success — and wrong about the world from 17:17:36Z onward.

    (2) AND IT DID EVENTUALLY RECOMPUTE, WHICH IS THE PROOF THAT NOTHING AUTOMATIC DID.
    `ci-gate` has a SECOND attempt at 17:48:20Z → 17:48:24Z, `success`, and the workflow run
    (32645473001) reads `run_attempt: 2`. The `CI` run (32645472930) is likewise `run_attempt: 2`.
    Both were re-run through the Actions API; nothing in the gate re-evaluated itself. The rollup
    asserted `failure` for 155.4 minutes after writing its verdict, and for 30.7 minutes after the
    last sibling had gone green. #2612 is merged now, at that same head.

    (3) THE BRIEF'S FRAMING IS CORRECTED HERE RATHER THAN REPEATED, BECAUSE THE FILE CONTRADICTS
    IT. The gate reasons carefully about WHICH attempt — `.github/workflows/ci-gate.yml:186-192`:
    "a SHA accumulates one check-run PER ATTEMPT, so a re-run of a required check leaves its
    earlier failed attempt in the list forever unless we narrow to one row per name. Group by
    `name` and keep only the attempt with the latest `started_at`". BUT IT ALSO ALREADY REASONS
    ABOUT WHEN. W1-T261 shipped a bounded re-read: `GRACE_WINDOW_SECONDS: "600"` with
    `GRACE_POLL_INTERVAL_SECONDS: "20"` (:137-138), entered only when a required name is failing,
    and its comment names the identical 2026-07-24 incident (#729) — "coverage-ratchet was FAILURE
    at ci-gate's 17:11 read, SUCCESS at 17:18, and only a manual ci-gate re-run or a fresh sha
    cleared the stale hold". SO THE OMISSION IS NOT "WHEN TO READ" IN GENERAL. It is that every
    re-read lives INSIDE the run, and once the run concludes there is no path back.

    (4) Q1 — WHAT COULD RE-TRIGGER IT, AND ONE CANDIDATE IS ALREADY REFUTED IN THE FILE. `ci-gate`
    is triggered by `on: pull_request` and nothing else. The obvious fix, a `check_run` completion
    webhook on a sibling, was investigated by W1-T261 and REFUSED with a reason recorded at
    :276-282: GitHub's documented recursion guard suppresses `check_run` events for any check run
    whose check suite was created by GitHub Actions, "and every REQUIRED name here IS a GitHub
    Actions check suite, so that trigger would never fire for the checks this gate actually
    aggregates". That leaves: (a) a fresh head sha, which is what the fix rung reaches for and
    which costs a worker run and a new CI cycle; (b) a sweep-side re-run through the Actions API,
    which is what actually cleared #2612 by hand; (c) widening the grace window, which converts a
    stale verdict into a held runner and is bounded by `WAIT_CAP_SECONDS: "2400"` anyway; or
    (d) nothing, which is today.

    (5) Q2 — THE PERMISSION WALL, CONFIRMED IN BOTH DIRECTIONS WITH THE FLEET'S OWN TOKEN.
    `POST repos/craigoley/remudero/check-runs/97208963168/rerequest` returns HTTP 403, message
    verbatim: "Resource not accessible by personal access token" — reproduced here against the
    completed `ci-gate` attempt from (1). The token is a `github_pat_`-prefixed fine-grained PAT.
    The Actions route is confirmed the other way, from shipped code and observed effect rather
    than by triggering one: `src/run-task.ts:20586` posts
    `repos/{owner}/{repo}/actions/jobs/{jobId}/rerun`, and (2)'s `run_attempt: 2` is that route's
    signature. NO RE-RUN WAS TRIGGERED BY THIS RECON.

    (6) AND THE BRIEF'S ENDPOINT IS THE WRONG ONE, WHICH MATTERS FOR THE REMEDY'S SHAPE. W1-T1223
    chose the JOB endpoint over the run endpoint deliberately and says so at `run-task.ts:20573`:
    "THE JOB, NEVER THE RUN: `actions/jobs/{job_id}/rerun`, never `actions/runs/{run_id}/
    rerun-failed-jobs` — a whole-run re-run would re-spend an…". `src/lib/sweep.ts:3368` repeats
    the same refusal. So a sweep-side remedy must go through the per-JOB Actions route, not the
    run-level one the brief names.

    (7) THE COST IS MEASURED AND IT IS NOT ONLY DELAY. The `blocked_ci` fix rung spent BOTH its
    strikes on this PR's task, W1-T1249: `fix.dispatch` strike 1/2 mode `ci-log` at 17:04:51.701Z
    followed by `fix.ci_not_green` at 17:04:52.390Z, then `fix.dispatch` strike 2/2 at
    17:07:04.338Z with `fix.ci_not_green` at 17:07:05.066Z, then `fix.exhausted` reason
    `ci_never_green` and `escalation.issue_opened` → `issues/2632` (labels `needs-human`,
    `escalation-blocked`, `needs-action`) at 17:07:08.599Z. TWO BOUNDED WORKER RUNS AND AN OPERATOR
    PAGE. State at that moment, stated precisely rather than as "fully green": `ci` had been
    `success` since 14:41:30Z, `coverage-ratchet`'s re-run was IN FLIGHT (started 17:03:13Z,
    concluded `success` 17:17:36Z), and the ONLY failing required check was the stale rollup.

    (8) AND THE SAME PR BURNED FIVE MORE SWEEP ACTIONS ON A SECOND, UNRELATED FAULT. Five
    `sweep.fix.error` rows paired with five `sweep.action_failed` rows, all disposition
    `blocked-fixable`, each reading `Command failed: gh pr view … GraphQL: API rate limit already
    exceeded`. That is not this defect and is not filed here; it is recorded because it is part of
    what this one PR cost.

    (9) THE NEAREST RELATIVE IS W1-T1223 (#2533) AND IT IS NOT RE-FILED. That task owns REQUEUING
    the cancelled required check — the thing that made `coverage-ratchet` terminal-but-wrong. This
    task owns the ROLLUP THAT READ IT: even with the requeue working, the sibling's success lands
    after `ci-gate` has concluded, and nothing recomputes the aggregate.
  design: |
    ONE CONCERN: a concluded rollup must be able to be recomputed when the state it summarised
    changes. Not which attempt it reads, not whether it is required, not what it decides.

    (i) THE DEFECT IS A MISSING RECOMPUTE, NOT A WRONG ANSWER, AND THE REMEDY MUST PRESERVE THAT.
    `ci-gate` stays REQUIRED. Its latest-`started_at` per-name resolution (rationale 3) stays
    exactly as it is. Nothing may mark a gate green without re-evaluating it — a remedy that
    overrides, ignores, or ages-out a `failure` conclusion is refused; the only acceptable way to
    turn this gate green is to RUN IT AGAIN.

    (ii) THE TRIGGER MUST BE THE ACTIONS PER-JOB ROUTE. Rationale (5) shows the checks route is
    closed to this token by permission, and rationale (6) shows the run-level Actions route is
    closed by an existing ruling. That leaves `actions/jobs/{job_id}/rerun` — the endpoint W1-T1223
    already uses, so this needs no new credential, no new permission, and no new client.

    (iii) THE CONDITION MUST BE NARROW, OR IT BECOMES A RE-RUN LOOP. The recompute is for exactly
    one shape: the rollup concluded non-success, and a required sibling has since reached a LATER
    terminal success on the SAME head. Not "the gate is red", not "time has passed" — a criterion
    pins that a genuinely red suite is never re-run on this path.

    (iv) AND IT MUST BE BOUNDED AND OBSERVABLE. One recompute per (head, sibling-transition), never
    an unbounded retry, and a ledger row naming which sibling's transition triggered it — so a
    re-run storm is impossible by construction and a human reading the ledger can tell this apart
    from a hand re-run.

    (v) THE GRACE WINDOW IS NOT WIDENED. Rationale (4)(c): `GRACE_WINDOW_SECONDS` stays 600 and
    `WAIT_CAP_SECONDS` stays 2400. Widening converts a stale verdict into a held runner, and it
    could not have covered this instance anyway — the sibling's success landed 125 minutes after
    the gate concluded.

    (vi) NOT IN SCOPE, NAMED: W1-T1223's requeue of the cancelled check (rationale 9); the
    rate-limit failures of rationale (8); the `check_run` trigger, refuted in the file itself; and
    any change to what `ci-gate` considers required or how it dedupes.
