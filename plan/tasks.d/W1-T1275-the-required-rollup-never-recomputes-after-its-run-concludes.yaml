    - claim: "the recompute happens at most once per head and sibling transition"
      proof: "unit test: test/ci-gate-reaggregate.test.ts"
    - claim: "the gate's latest-attempt-per-name resolution is unchanged"
      proof: "unit test: test/ci-gate-dedupe.test.ts"
    - claim: "no path marks the gate green without re-evaluating it"
      proof: "unit test: test/ci-gate-reaggregate.test.ts"
