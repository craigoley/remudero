  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/ci-gate-reaggregate.test.ts` (11 tests today) or `test/ci-gate-dedupe.test.ts`
    (4 tests), both declared in `files:` and both already existing, so each resolves against a real
    file rather than a forward reference.

    `risk: high` IS RULE 19'S SPAN, SET UP FRONT. `files:` names three stems and the sizing check
    reads them as distinct concerns below `high`. The blast radius is narrow — a sweep-side
    re-trigger and its two test homes — but the band is honest for a second reason: this arm posts
    to the Actions API, and a condition drawn one notch too wide is a re-run loop against a shared
    CI budget, which is why design (iii) and (iv) each carry their own criterion.

    THE WORKFLOW ITSELF IS DELIBERATELY NOT DECLARED. `.github/workflows/ci-gate.yml` is correct as
    written: rationale (3) and (4) show it already resolves the right attempt and already re-reads
    within its run, and rationale (4) shows the webhook trigger that would let it recompute itself
    is refused by GitHub's own recursion guard. The recompute therefore belongs to the sweep, which
    already holds the Actions client and already re-runs jobs for W1-T1223. Declaring the workflow
    would invite an implementer to widen the grace window, which design (v) refuses.

    TWO CORRECTIONS TO THE BRIEF ARE RECORDED RATHER THAN CARRIED SILENTLY, BECAUSE THE SHARD IS
    THE RECORD. FIRST: the gate does NOT reason "not at all about when to read" — W1-T261's grace
    window is exactly that reasoning, and citing the file as evidence of an oversight would have
    misread it; the real gap is that every re-read is inside the run. SECOND: the working Actions
    endpoint for a sweep-side remedy is the PER-JOB one; `actions/runs/{run_id}/rerun-failed-jobs`
    is refused by name in two places in this repo (rationale 6).

    ONE MEASUREMENT MOVED UNDER THE BRIEF AND IS RECORDED AS FOUND. At filing time `ci-gate` had a
    SECOND attempt — 17:48:20Z, `success`, `run_attempt: 2` — and #2612 is merged. The brief's "one
    attempt" was true when written; the stale interval is therefore bounded and measurable rather
    than open-ended: 155.4 minutes from the gate's own verdict, 30.7 minutes from the last sibling
    going green.

    THE ID WAS PRE-MINTED AND READ BACK BEFORE ANYTHING WAS WRITTEN. `refs/rmd-id/W1-T1275`
    resolves on origin against a namespace of 305 such refs. EIGHT SURFACES WERE SWEPT, each
    control qualified on its own surface first: shard filenames 0 against W1-T1223 at 1; plan
    `- id:` lines 0 against W1-T1223 at 1; the reservation 1, which is the pre-mint, against
    W1-T1274's own at 1; open PR titles 0 against W1-T1271 at 1; open PR head branches 0 against
    `run-W1-T` heads at 2; open PR file lists 0 with coverage at four captured of four enumerated,
    against `plan/tasks.d/` paths at 2 across the same heads; merged trailers 0 against
    `Remudero-Task: W1-T1252` at 1, with 459 trailer-carrying commits on main; and merged subject
    credit 0 against W1-T1223 at 1, with `run-W1-T1275-*` at 0 against a namespace of 84 `run-*`
    branches.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE. Three markers at every open PR
    head and at main: `GRACE_WINDOW_SECONDS` and the `on:` `pull_request:` line in
    `.github/workflows/ci-gate.yml`, and `actions/jobs/` in `src/run-task.ts`. Main reads 5 / 1 / 2
    and every head reads exactly 5 / 1 / 2 — no head moves any marker. `src/run-task.ts` exceeds
    the contents-API cap, so every head was read through git objects.
