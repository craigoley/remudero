    {1, 2, 4, 8, 12, 24} HOURS MAPS TO 60..1440 MINUTES, INSIDE THAT MIN/MAX, AND THE HOURLY
    SETTING NEEDS `maxPerDay` 24, WHICH IS EXACTLY ITS DECLARED MAXIMUM. The digest needs its own
    row rather than sharing the family's, because a 1-hour digest must not drag
    `rule-efficacy`/`verdict-calibration`/`autonomy-rate` to an hourly cadence — but it needs no
    new decision function.

    (7) AND #1066'S LESSON IS RECORDED VERBATIM IN THIS TREE, AT `src/run-task.ts:14233`: that PR
