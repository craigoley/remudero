  rationale: |
    ALL SOURCE CLAIMS RE-DERIVED AT origin/main 145099d4 IN A SCRATCH WORKTREE PROVEN EQUAL TO IT
    BY SHA, WITH `src/run-task.ts` READ THROUGH GIT OBJECTS. LEDGER FROM `resolveLedgerUnion` AT
