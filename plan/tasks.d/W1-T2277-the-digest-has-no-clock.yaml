    (1) THE ASK IS SMALLER THAN IT LOOKS, BECAUSE THREE OF THE FOUR PARTS ALREADY EXIST, AND A
    BUILD THAT DOES NOT KNOW THAT WILL REBUILD THEM. `src/lib/digest.ts` ships `collectSince`,
