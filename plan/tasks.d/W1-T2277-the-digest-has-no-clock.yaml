    (2) WHAT IS MISSING IS THE CLOCK, AND THE MODULE SAYS SO ITSELF. `digest.ts`'s own header:
    "assembled here, delivered here, SCHEDULED by the daemon loop later (W1-T12) — this module
    owns no clock/cron of its own." A case-insensitive grep for "digest" across
    `src/lib/daemon.ts` returns ONE line, and it is an unrelated comment about folding alert
    counts into a digest — NO DEP, NO CALL, NO FIRE. THE SCHEDULER W1-T12 PROMISED WAS NEVER
    WIRED.

    (3) AND THE ONE DELIVERY ADAPTER CANNOT RUN ON THIS FLEET. `notify.ts` defaults
    `channelName` to "imessage", which its own comment calls "the only adapter W1-T8 ships", and
    that channel's `unavailable()` is DARWIN ONLY — it drives Messages.app through `osascript`,
    which "exists on no other platform". THE FLEET RUNS ON LINUX. So even a scheduled digest
    would report itself undeliverable on every fire until a second adapter exists.

    (4) SO THE GAP IS THREE THINGS AND NOT A REWRITE: a cadence, a configurable window, and a
    channel that resolves on this host. THE CONSOLE INBOX IS THAT CHANNEL AND IT NEEDS NO CHANGE
    TO `notify.ts`: the inbox already lives as `inbox-proposals.json` / `inbox-drafts.json` under
    `config.root`, served by `GET /v1/inbox`, so an inbox adapter is a `NotifyChannel`
    implementation and nothing more.

    (5) THE CADENCE FITS THE EXISTING ONE WITH NO NEW SCHEDULER AND NO NEW POLICY MACHINERY.
    `decideMeasurementCadence` (`src/lib/measurement-cadence.ts:113`) already reads a marker,
    refuses on `enabled: false`, FAILS CLOSED on a corrupt marker, enforces
    `minIntervalMinutes` against the newest fire and `maxPerDay` against a rolling window, and
    emits five steps: `measurement_cadence.fired`, `.ran`, `.skipped`, `.check_failed`,
    `.run_failed`. Its Law 5 pin is in its own doc at `:28`: "Nothing in this module files a task
    or mints an id."

    (6) AND THE REQUESTED WINDOW SET FITS THE EXISTING POLICY BOUNDS — CHECKED, NOT ASSUMED.
    `plan/policy.yaml`'s `measurementCadence` row carries `minIntervalMinutes` value 360 with
