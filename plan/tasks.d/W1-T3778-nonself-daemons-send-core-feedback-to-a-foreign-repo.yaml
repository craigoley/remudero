- id: W1-T3778
  title: "NON-SELF DAEMONS TRY TO OPEN A FEEDBACK PR IN THE DRAIN TARGET AFTER PUSHING ITS BRANCH TO THE CORE CHECKOUT — every site or console tick reports a false landing and retries forever because the target repository cannot contain the source branch"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 32.00
  origin: "operator-session#all-daemons-healthy-2026-09-19"
  plan_refs: ["W1-T530", "W1-T3560", "W1-T1000002"]
  files:
    - src/run-task.ts
    - test/nonself-feedback-landing.test.ts
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on the Azure site daemon on 2026-09-19. Its engine checkout is
    `/home/node/Remudero/remudero` (remote `craigoley/remudero`), while its drained target is
    `craigoley/remudero-site`. `sweepFeedbackLandingRung` calls `sweepFeedbackLanding(repoRoot, …)`
    against the engine checkout but passes `targetRepository: { owner: target.owner, repo: target.repo }`
    whenever the target is non-self. The landing bridge therefore pushes a scoped branch to
    `craigoley/remudero`, then asks `gh pr create --repo craigoley/remudero-site --head <that branch>`.

    The falsifying remote control was direct: the site-scoped landing branch existed on
    `craigoley/remudero` and did not exist on `craigoley/remudero-site`; neither repository had a
    PR for it. GitHub consequently refused the create with "Head sha can't be blank" and "No commits
    between main and <branch>". Three untracked feedback records remained in the engine checkout and
    the site daemon retried the same impossible create every poll. `LandFeedbackResult.landed: true`
    is not evidence of a PR here: by contract it means the source branch was pushed successfully.

    The current comment claims the feedback inbox is this harness's own inbox and is present regardless
    of the drained target. That makes the non-self caller the defect: a core-owned inbox must be landed
    by the core daemon, not routed to an unrelated target repository by every non-self daemon.
  design: |
    Run the disk-backed feedback landing sweep only for a self-target daemon. The core daemon remains
    the single owner of the core engine checkout's `plan/feedback/` inbox and retains the existing
    landing branch, compare-and-swap, PR reuse and auto-merge behavior unchanged. A non-self daemon
    must neither invoke the bridge nor issue git/gh writes for that core-owned inbox.

    Keep the target-plan reloader independent: console and site daemons still reload their own target
    plans and drain their own task frontiers. Do not change `feedback-landing.ts`'s general explicit
    target API; that API may be used by a caller whose checkout and target are actually the same
    repository. Do not delete or overwrite queued feedback files: the next core-owned sweep lands the
    existing durable copies.
  acceptance:
    - claim: "a non-self daemon never invokes the core feedback landing bridge or opens a source-branch PR against its drained target"
      proof: "grep: W1-T3778 criterion 1 in test/nonself-feedback-landing.test.ts"
    - claim: "a self-target daemon still invokes the existing feedback landing bridge exactly once per configured sweep"
      proof: "grep: W1-T3778 criterion 2 in test/nonself-feedback-landing.test.ts"
  falsifier: |
    Reject this task if a production non-self daemon's `repoRoot` resolves to the same repository as
    its drained target and its scoped landing branch is present in that target before `gh pr create`.
    The measured site control was the opposite: the branch was present only in `craigoley/remudero`.
    Delete the non-self guard in the new test and require criterion 1 to fail by observing a bridge
    call; retain the guard and require the same assertion to pass.
  note: |
    This implementation task deliberately omits its own shard from `files:`. The shard is filed in a
