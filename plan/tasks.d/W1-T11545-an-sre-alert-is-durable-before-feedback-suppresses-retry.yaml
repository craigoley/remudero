      proof: "grep: W1-T11545 criterion 1 in test/sre/an-sre-alert-is-queued-before-feedback-can-suppress-its-retry.test.ts"
    - claim: "The async drain preserves the qualified repository and owner-assignment policy across restart, names unknown policies, and never duplicates an issue after assignment failure"
      proof: "grep: W1-T11545 criterion 2 in test/sre/an-sre-alert-is-queued-before-feedback-can-suppress-its-retry.test.ts"
    - claim: "The real daemon SRE binding uses the durable handoff and its default create and assignment children leave the loop responsive"
      proof: "grep: W1-T11545 criterion 3 in test/the-sre-lane-runs-on-the-primary-instance.test.ts"
  note: |
    Follow-up explicitly required by W1-T11458's unsafe-retry exception. The ten-line sketch
    computes test/sre/ at medium confidence, inbox-operator runner-up. The existing integration
    suite already imports Root; do not add a new Root importer or change a cap.
    The constructor census sees 51 real calls across 23 source files and four supplied executors.
    The subject sweep covers all three open heads against eleven positive main subject lines,
    counting each head and its authored delta; none adds or removes this subject. W1-T11474 is
    the prerequisite generic handoff, not a duplicate of SRE's feedback and assignment contract.
    This filing authorizes no live notification, janitor application, deploy, recycle or cutover.
  falsifier: |
    Move feedback or episode acknowledgement before durable enqueue: criterion 1 fails on a
    write failure. Let no_new_evidence suppress the failed enqueue, or repeat the physical act
    while retrying its ask: criterion 1 fails on identical evidence. Drop the repository or
    assignment policy from routing or identity, erase an assignment failure, or recreate its
    already-published issue after restart: criterion 2 fails. Restore synchronous real GitHub
    delivery on the daemon path: criterion 3's actual-child heartbeat assertion fails. Each
    removal must reach its intended assertion and restore green; missing APIs are structural.
