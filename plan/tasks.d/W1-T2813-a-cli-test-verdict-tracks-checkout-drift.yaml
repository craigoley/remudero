- id: W1-T2813
  title: "A CLI TEST'S VERDICT TRACKS CHECKOUT DRIFT RATHER THAN THE CODE UNDER TEST — the wipe-test entrypoint case calls the real `main()` without controlling the self-sync guard, so it passes on a current checkout and fails `1 !== 2` the moment the same branch falls behind origin/main, which reads as a product defect and is not one"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: low
  band_meaning: blast-radius
  budget_usd: 6.00
  files: [test/the-wipe-test-can-only-ask-about-learnings.test.ts]
  origin: "operator-session#hermetic-cli-entrypoint-test-2026-09-04"
  plan_refs: ["W1-T2812", "W1-T2810"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED IN BOTH STATES on 2026-09-04, on the SAME branch, with no source change between them.
    The subject is the case titled "main(): `rmd wipe-test <id> --factor recon --repo remudero`
    (no --allow-non-sandbox) dispatches to wipeTestCommand and exits 2":

      branch != main, `git rev-list --count HEAD..origin/main` = 0   ->  # tests 20  # pass 20  # fail 0
      branch != main, behind by 11 (20861fb..7a13b30)                ->  # tests 20  # pass 19  # fail 1

    Nothing about the code under test differs between those two runs. The only variable is how
    stale the checkout happened to be, which is not a property this test means to assert.

    WHY IT FAILS, AND HOW WE KNOW. This was diagnosed through W1-T2812's own retention helper
    rather than by reading source: once the suite stopped discarding its subject's stderr, the very
    first red carried its own cause. `main()` reaches the self-sync freshness check, which refuses
    because the checkout is behind origin/main while sitting on a branch that is not `main`, and
    exits 1. It never reaches the non-sandbox refusal that exits 2, so the assertion reads `1 !== 2`
    and names a wipe-test concern that was never evaluated.

    THE GUARD ALREADY READS process.env, SO NO NEW SEAM IS NEEDED. `checkCliFreshness`
    (`src/lib/self-sync.ts`) resolves its loop guard as
    `env[SELF_SYNC_GUARD_ENV] === "1" || process.env[SELF_SYNC_GUARD_ENV] === "1"`. That second
    disjunct is deliberate and documented in the module's own header: re-entrancy is a property of
    the PROCESS, and a spawn writes a child's environment and cannot reach a parameter. A test can
    therefore control the guard for its own window with no injection and no production change.

    THE AUDIENCE IS THE WORST POSSIBLE ONE. CI checks out at head and the operator's own `main`
    checkout is exempt by branch name, so this reds for exactly one population: a contributor on a
    feature branch that has drifted. That is also the reader least able to tell an ambient-state
    red from a real one, and this specific failure cost real time before W1-T2812 made it legible.

  design: |
    Control the guard for the window in which `main()` runs, in the same shape this test already
    uses for `process.argv` and `process.exit`: save the prior value, set
    `process.env[SELF_SYNC_GUARD_ENV] = "1"` before the call, and restore the exact prior state in
    the same `finally` that restores the other two. Restore by DELETING the key when it was absent
    rather than writing an empty string, so a sibling test cannot observe a value this one invented.

    Import `SELF_SYNC_GUARD_ENV` from `src/lib/self-sync.js` rather than writing the literal
    `"RMD_SELF_SYNC_DONE"`. A renamed constant must break this test at the type level instead of
    silently reverting it to the ambient behaviour this task exists to remove.

    Keep W1-T2812's `cap.explains(...)` wrapper exactly as it is. It is what produced this
    diagnosis, the criterion it discharges is already merged, and removing it would re-blind the
    next failure in this same test.

    DO NOT WEAKEN THE GUARD. Nothing under `src/` is in scope: not `checkCliFreshness`, not the
    refusal text, not the branch or behind-count conditions, and not the loop-guard disjunct. The
    defect is that one test inherits ambient state, not that the guard is wrong to refuse.

    Do not skip, quarantine or retitle the test, and do not relax its assertion: it must still
    assert exit code 2 for the same reason it asserts it today.

  acceptance:
    - claim: "the test controls the self-sync guard for its own window instead of inheriting whatever the ambient checkout state happens to be"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "the prior environment is restored exactly, deleting the key when it was previously absent, so no sibling test observes a value this one invented"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "the guard is named through the module's exported constant rather than a bare string literal, so a rename breaks the test instead of silently reverting it"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "the case still asserts exit code 2 for the same reason, and still carries its subject's stderr into a failure through the W1-T2812 capture"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"

  falsifier: |
    THE FIX IS PROVEN IN BOTH STATES OR IT IS NOT PROVEN. Run the suite twice: once from a checkout
    at origin/main, and once from the same branch deliberately set behind origin/main, both WITHOUT
    `RMD_SELF_SYNC_DONE` in the environment. Report both `# tests` summaries. A run that only
    covers the current-checkout state re-measures the state that already passed and demonstrates
    nothing, because that is the state this defect does not occur in.

    CLOSE THIS TASK WITHOUT IMPLEMENTATION if the case already sets or injects the guard for its own
    window. A suite that merely passes today does not discharge it: at behind-count 0 the defective
    version passes too, which is precisely why this went unnoticed.

    Do NOT discharge this by weakening or bypassing `checkCliFreshness`, by exporting the guard
    value into the whole test process, by skipping or quarantining the case, or by relaxing its
    assertion from exit code 2.

