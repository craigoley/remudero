      proof: "grep: W1-T12201 criterion 1 in test/inbox/a-new-decision-file-lands-in-the-plan-destination-and-readers-read-both.test.ts"
    - claim: "With no host file, each of the three lands on the same branch of the same repository with the same calls as today"
