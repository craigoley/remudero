    RATIFIES the follow-up harvest `followup:W1-T2462-1788054829616:2026-08-30T01:56:18.209Z:1` —
    "confirm result-shape compatibility between `resolvePlanCriteriaForReview` (src/run-task.ts) and
    `resolvePlanCriteriaAtHead` (src/lib/review.ts) before wiring, since the task's acceptance criteria
    depend on it being a like-for-like replacement, not a rewrite." The confirmation was PERFORMED at
    filing rather than deferred to the worker: the answer is that parity holds for four fields and
    fails for two facts — a fifth field (`openTaskIds`) the doc's enumeration omitted, and the read
    identity inside `source`. Both are carried above as criteria; neither is asserted as a defect
    without a source citation.

    SEQUENCING FENCE, NOT A HARD EDGE (the W1-T233 precedent). W1-T2511 is queued and declares
    `src/run-task.ts`, so it and this task overlap on the same file and should not run concurrently
    (the W1-T171 overlap class, still unbuilt — so the fence is stated here rather than enforced).
    It is DELIBERATELY not a `depends_on`: a hard edge would strand a legibility repair behind a
    risk:high reordering of the review preamble, and neither task needs the other to be correct.
    Whichever lands second must preserve the other's work: W1-T2511 owns the divergence CAUSE reaching
    the ledger/console, this task owns the SOURCE string's read identity, and they touch adjacent lines
    of the same block.

    `depends_on: [W1-T2462]` is the true ancestor and is already merged (#3285), so it gates nothing —
    it is recorded because this task exists ONLY as that task's follow-up and would be an orphan
    without it (Standing rule 17).

    HONEST LIMIT ON DIVERGENCE 1, stated so the implementer does not over-trust this row: the
    `?? new Set()` equivalence was verified at ONE consumer (review.ts:3677, reached from :3928 via
    `evidence.openTaskIds`). The guard must ENUMERATE the consumers rather than inherit that count —
    if a second consumer exists that distinguishes an absent set from an empty one, the correct close
    flips from prove-and-lock to restore, and the PR should say so rather than quietly proving the
    weaker claim.
