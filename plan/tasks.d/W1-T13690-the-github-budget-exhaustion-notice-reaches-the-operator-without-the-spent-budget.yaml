  rationale: |
    WHY: the notice that tells the operator the GitHub budget ran out has never arrived. Filing it needs the
    budget that ran out.
    MEASURED in the core ledger, 2026-11-14 to 2026-11-18: 7 daemon.quota_exhausted.escalated rows for the core
    bucket, every one with delivered false and issue_url null (2026-11-14 08:41Z, 20:07Z, 23:01Z; 2026-11-15
    00:01Z, 13:07Z; 2026-11-18 01:01Z, 04:10Z). For the two on 2026-11-18 the ledger names the cause in an
    escalation.dedup_unreadable row of the same second: "gh call pacer stood down: core at 1496/15000, at or below
    the floor" (01:01Z) and "core at 0/15000" (04:10Z). The same 56 daemon.quota rows show the graphql bucket at
    9,867 to 10,000 remaining throughout.
    READ at origin/main 1f902f383:
    - src/lib/daemon.ts:8076-8084 calls onQuotaExhausted once, on the tick a bucket first reads 0 from
      `gh api rate_limit` (that read costs nothing). src/cli/commands/daemon.ts:2502 wires escalateQuotaExhaustion.
    - src/lib/escalation-catalogue.ts:883-948 escalateQuotaExhaustion calls tryEscalate with ghIssueGateway.
      escalateSteps (src/lib/escalate.ts:1959) first runs lookupDuplicateEscalation, which lists every open
      needs-human issue over REST (`/issues?labels=...`, a core read). At the write reserve the installation
      budget refuses that read (src/lib/github-installation-budget.ts: reads stop at remaining <= 10% of the
      limit), and at 0 GitHub refuses it. W1-T2912 then refuses creation, so the notice is never sent.
    - escalation-catalogue.ts:898-901 dedups on any escalated row for the same bucket and resets_at, delivered or
      not. Nothing sends an undelivered notice again, so it is lost for good.
    - The transport already keeps `api graphql` out of the core budget (installationCoreRead in
      src/lib/github-transport.ts), and the repo already reads GraphQL in several places (arm-auto-merge.ts:955,
      plan-task-migration.ts:188, pr-state.ts:113).
    OVERLAP: W1-T298 (queue starvation escalates) also lists src/lib/daemon.ts and src/lib/ledger.ts. It adds the
    starvation notice; this task changes only the quota notice's gateway and adds its late send. Neither
    supersedes the other.
    WHY GRAPHQL, AND WHY ALSO AFTER THE RESET:
    - A reserve kept for the notice would not help. The write reserve already exists, and the count still
      reaches 0, because serve and run children read outside the daemon's budget share. The notice fires at 0 by
      design, so there is nothing left in core to reserve.
    - A ledger-backed console or board notice is not an existing channel for this alert: status.ts and
      board-review.ts read escalations from open needs-human issues, no reader shows an
      escalation.dedup_unreadable row, and notify.ts's channels (iMessage, email) wrote no notify.sent rows in
      the live core ledger or its 40 newest archives. Building a new channel is a larger change than this alert needs.
    - GraphQL is a separate limit (10,000 an hour) that the fleet barely uses. An issue opened with a GraphQL
      createIssue mutation and a dedup list read with a GraphQL `repository.issues(labels:, states: OPEN)`
      connection spend none of core. That is not the `search()` connection W1-T1208 moved away from.
    - When GraphQL fails too (a graphql exhaustion, a network fault), sending once after the reset with the
      window stated keeps the record: the operator learns that the budget ran out and for how long.
  design: |
    INVARIANT the-same-notice: the escalation text, labels and dedup rule are those of origin/main; only the
    gateway that reads and writes the issue changes, and only for a core exhaustion.
    INVARIANT dispatch-never-paused: unchanged from W1-T372. Both paths only report.
    INVARIANT no-core-read-on-a-core-alert: for a core exhaustion, every call the notice makes is `api graphql`.
    1. In src/lib/escalate.ts add ghIssueGatewayGraphql(owner, repo): an IssueGateway whose listOpen(label) reads
       open issues with that label through one paged GraphQL query (`repository { issues(labels: [$label],
       states: OPEN, first: 100, after: $cursor) { nodes { number url title body } pageInfo { ... } } }`) and
       returns the OpenIssue shape parseLabelledIssuesRest returns (html url as `url`), and whose create(title,
       body, labels) calls the createIssue mutation with the repository id and label ids read in the same query.
       Call assertLiveWriteAllowed("gh-issue-create", ...) before the mutation, as the REST create does. Omit
       ensureLabel (the needs-human label exists on every repository that has escalations; a missing label id is
       a create failure). Register an async twin as ghIssueGateway does (asyncIssueTwins), so the daemon loop
       reaches no new synchronous spawn; run test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts.
    2. In escalateQuotaExhaustion use ghIssueGatewayGraphql when info.bucket is "core" and ctx.issues is not
       set. Keep ghIssueGateway for "graphql". Check that neither the installation budget nor the pacer's floor
       refuses an `api graphql` call when the last core reading is at or under the floor; if the pacer's
       stand-down applies to every call, exempt `api graphql` calls from a core reading only.
    3. Late delivery: add an optional deps.onQuotaRecovered hook in src/lib/daemon.ts, called on the tick that
       clears the latch (the bucket reads positive after it read 0 in this process). Add no comment lines to
       daemon.ts (comment cap; run test/daemon/compress-src-lib-daemon-ts.test.ts). In escalation-catalogue.ts
       add deliverQuotaExhaustionLate(info, ctx): read the newest daemon.quota_exhausted.escalated row for the
       bucket; when it says delivered false and no daemon.quota_exhausted.delivered_late row has the same
       bucket and resets_at, send the notice through the same gateway choice as step 2, with the summary
       changed to say the bucket ran out between the row's ts and its resets_at and that this is sent after the
       reset, and write the delivered_late row whatever the outcome. Wire it in src/cli/commands/daemon.ts.
    4. Add "daemon.quota_exhausted.delivered_late" to the kept steps in src/lib/ledger.ts beside
       daemon.quota_exhausted.escalated, so a restart after a rotation does not send it twice.
    5. Add no reserve, cap or config key. A process that restarts after the reset and before a positive tick
       sends no late notice; the escalated row still records the exhaustion.
    NOT IN SCOPE: the share split, the write reserve, other escalations' gateways, and the headroom notices.
  falsifier: |
    Keep the REST gateway for a core exhaustion: criteria 1 and 3 must fail. Drop the dedup read from the
    GraphQL gateway: criterion 2 must fail. Send the late notice on every positive tick: criterion 5 must fail.
    Leave the new step out of the kept steps: criterion 7 must fail. Restore and require all to pass.
