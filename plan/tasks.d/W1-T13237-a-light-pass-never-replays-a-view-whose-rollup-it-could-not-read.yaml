      proof: "grep: W1-T13237 criterion 3 in test/sweep/a-light-pass-never-replays-a-view-whose-rollup-it-could-not-read.test.ts"
  rationale: |
    MEASURED 2026-11-16 by the operator session on the core ledger, read-only, with the code path traced on origin/main by a read-only investigation.

    - The daemon's light passes escalated PRs whose heads had dozens of checks as "not positively mergeable — checks none, review none — escalating": #18871 at 15:40:43Z and 15:47:27Z (GitHub showed 76 checks on that head; the PR merged at 16:16Z with a passing review), #18876 at 15:40:50Z and 15:47:27Z, #18893 at 18:38:51Z. A `pr.stuck` row (owner NONE, "unknown signature") came with the first.
    - The decisive field, `sweep_light.pre_review_timing.views_source` of the same run: the 15:40 and 15:47 dispositions came from passes whose views were a FALLBACK (rows at 15:37:30Z and 15:42:41Z), and the 18:38 one from an own read (18:33:29Z).
    - `sweep_light.views_fallback` wrote 42 rows between 15:00 and 19:00Z, 40 of them `slow_read`. `github.budget.throttled` wrote none, so installation-budget refusals are not the trigger.
    - READ on origin/main (the investigation's quotes): `openPrWithRollupSteps` in src/lib/open-prs-rest.ts catches any failed per-head rollup read and returns the PR with `rollupUnreadable: true` and no rollup; the views then read checks "none" and review "none". W1-T13195 (queued, filed today) carries that flag onto the view and makes such a PR wait instead of escalating.
    - What W1-T13195 does not cover: src/lib/light-pass-open-pr-list.ts (W1-T12755) stores whatever the last read resolved as the last-good list (`read.then((views) => { lastGood = { views, readAtMs: … } })`) with no per-view completeness check, and serves it to every pass whose read is slower than 60 s for up to 15 minutes. A slow read is not cancelled; when it finishes partly read, it becomes the list the next slow passes replay. So one partly failed read is decided on again and again, and the fallback row does not say how old or how complete the list was.
  design: |
    1. `keep` merges per PR: a view whose rollup was unread does not replace that PR's previous fully read view; with no previous one, the PR is absent from the last-good list (a pass that does not see a PR decides nothing about it).
    2. The fallback row gains the list's age in milliseconds and the count of fully read views; the pass's disposition rows keep `snapshot_age_ms` meaning what it means today, and a new field names the list's age where a fallback served it (today `snapshot_age_ms` on a light pass is measured from the pass start, not from the list).
    3. The new suite drives the list with injected reads: one fully read, one partly read, a fallback after each.
    INVARIANT a-fully-read-list-is-kept-as-today: nothing changes for a read whose every view is fully read.
    NOT IN SCOPE: what a pass does with an unread rollup on its own read (W1-T13195); why reads are slow (the per-call timeout and the concurrent rollup prefetch of W1-T12530 are the candidates; report what you see); the deadline and age bounds.
  falsifier: |
    Store a partly read list whole and criterion 1 must fail. Drop the age or the count from the fallback row and criterion 2 must fail. Change what a fully read list stores, or a bound, and criterion 3 must fail. Restore and all pass.
