      proof: "grep: W1-T13237 criterion 1 in test/sweep/a-light-pass-never-replays-a-view-whose-rollup-it-could-not-read.test.ts"
    - claim: "A pass that falls back to the last-good list records the list's age and how many of its views were fully read, on the same row that says it fell back"
