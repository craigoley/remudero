  rationale: |
    Narrow testing can reduce latency and storage only after missed-failure risk and completeness
    are measured. Existing selector-shadow miss tasks (including W1-T10356) repair particular edges;
    do not duplicate or take over those lanes. This low-priority recon specifies paired held-out
    validation and platform applicability, not new selector edges or production narrowing.
    Microsoft's primary TIA documentation describes safety fallbacks and periodic full validation
    in its supported VSTest context: https://learn.microsoft.com/en-us/azure/devops/pipelines/test/test-impact-analysis?view=azure-devops
    Those platform-specific guarantees are not evidence that this Node selector already has them.
    Main and all five open PR head plan trees were compared at d0a612ff on 2026-10-22; no newly added
    overlapping paired-reference contract was found. Retain existing missed-edge observations as data.
  design: |
    Map current selection, module/descriptor/non-code read maps, CI reference population, platform skips,
    shadow collector and promotion consumers to exact source symbols. Pin both arms to the same source
    head, platform, dependency/runtime, fixture inputs and reference population; neither arm replaces CI.
    Keep every physical suite/test counted: executed pass/fail, error, cancelled, unknown, and explicitly
    evidenced not-applicable. A Linux skip of an APFS-only test is not a pass or silent denominator removal.
    Define missed failing suites/edges with denominator, reference failures, runtime, peak memory, allocated
    and reclaimed bytes, selection savings and cost of fallback. Use physical file controls, injected
    missing-edge/removal controls, source/descriptor mismatch, incomplete reference and stale-head cases.
    Missing, skipped-without-applicability, mismatched or partial evidence is UNKNOWN, not zero misses.
    Keep human labels NULL/UNKNOWN unless actually supplied; synthetic labels remain training-ineligible.
    Recommend conservative fallback for unknown/dependency/helper/configuration changes and a measured
    periodic reference policy. Any automatic promotion, test-policy narrowing or native workload needs
    separate reviewed authority. Existing capacity, one-use grants, pilot gate, active work, reviews
    and serving stay unchanged. No model calls, infrastructure or live execution is authorized.
