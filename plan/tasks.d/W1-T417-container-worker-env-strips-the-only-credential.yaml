- id: W1-T417
  title: "`buildWorkerEnv`'s ALLOWLIST names `CLAUDE_CODE_OAUTH_TOKEN`, which is UNSET in a container, while the three vars that DO carry the credential there are stripped — so every `/usage` probe fails to authenticate and the drain's headroom governor stops a healthy run at its fourth miss"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  rationale: "RECON 2026-08-10, RE-DERIVED AT af586e3 — every symbol named below was confirmed to
    live where this shard says it does.
    THE MEASUREMENT. Two consecutive containerised drains stopped with `headroom_degraded — usage
    unreadable 4x consecutively (limit 3)`, one after three dispatches and one after four, each
    surrendering the rest of a `--max 6` budget. The drain's `readUsage` is
    `() => readUsageSnapshot(config)` at BOTH call sites in src/run-task.ts; that function shells
    `claude -p /usage` through `UsageProbeRunner` with an env built by `buildWorkerEnv`
    (src/lib/env.ts) and a HOME redirected by `materializeWorkerHome`.
    WHAT IS ACTUALLY STRIPPED, read from the running container's own environment:
    `CLAUDE_CODE_OAUTH_TOKEN` — the one credential name on the ALLOWLIST — is UNSET, while
    `CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR`, `ANTHROPIC_BASE_URL` and
    `CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST` are all SET and none is allowlisted. ALLOWLIST is
    literally `PATH, HOME, TMPDIR, LANG, USER, CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN`.
    AND THE FILE ROUTE IS CLOSED TOO. `WORKER_HOME_SYMLINKS` (src/lib/worker-home.ts) grants exactly
    `.claude`, `.config/gh`, `.gitconfig` and `Library/Keychains/login.keychain-db` into the
    redirected HOME. `~/.claude.json` is NOT among them, and the keychain grant is macOS-only — its
    own comment says a redirected HOME hides the keychain and Claude Code exits `Not logged in` at
    $0 before any turn. On Linux there is no keychain to grant and the file that would substitute
    is not carried, so the probe has no credential by either route.
    THIS IS #1513's FAMILY. That PR added `GH_TOKEN` to this same ALLOWLIST so a container worker
    holds the credential macOS already grants it. The headroom probe is the next var in the same
    queue, and the symptom is the same shape: a capability the mini has by ambient means and a
    container does not.
    THE COST IS REAL AND MISATTRIBUTED. Two drains surrendered their budgets, and the operator
    diagnosed a broken API. A separate change corrects the MESSAGE to point at `usage.probe_failed`;
    it does not restore the reading, and this task is the one that does.
    THE LEDGER IS UNREACHABLE — the Mac mini is down and the drains ran on a container whose state
    volume this session could not reach, so the `usage.probe_failed` rows that would name the exact
    failure stage are UNMEASURED. Every environment fact above is read from a live container's own
    `env` and from source; none is inferred from a ledger."
  design: |
    (i) ESTABLISH WHICH OF THE THREE IS ACTUALLY REQUIRED, BEFORE WIDENING ANYTHING. The recon
    observed three vars set and unallowlisted; it did NOT establish that all three are needed. A
    credential surface must not grow by the size of the observation. Determine, by running the probe
    with each subset, the MINIMUM set that authenticates — it may be the file-descriptor var alone,
    it may need the base URL, it may need neither if another route exists. Report the finding; the
    minimum set is the change, and anything beyond it is refused.
    NOTE THE FILE DESCRIPTOR MAY NOT SURVIVE A SPAWN AT ALL. `CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR`
    names an inherited fd; whether `execFileSync` passes that fd through to the child is a fact to
    MEASURE, not to assume. If it does not, allowlisting the variable achieves nothing and the task
    is about a different route entirely — say so rather than shipping a var that cannot work.

    (ii) THE HAZARD, AND IT IS THE WHOLE REASON THIS IS ITS OWN TASK. `buildWorkerEnv` THROWS on any
    surviving `ANTHROPIC_*` key other than the gated overflow valve — `ANTHROPIC_KEY` is
    `/^ANTHROPIC_/i`, `SANCTIONED_KEY` is `ANTHROPIC_API_KEY`, and the throw reads
    `billing-boundary violation — ANTHROPIC_* keys survived`. `validateConfig` (src/lib/config.ts)
    separately refuses `overflow: "api_key"` with no `dailyCapUsd`, because an api-mode run must be
    hard-capped. `ANTHROPIC_BASE_URL` MATCHES THAT REGEX. It is exactly what the assertion exists to
    catch, and admitting it by widening the regex, adding a second sanctioned name, or special-casing
    the prefix all weaken the one guard standing between this fleet and silently billing API rates
    instead of the subscription.
    SO THE BAR IS: admit it WITHOUT weakening the billing refusal, or do not admit it. A base URL is
    not a credential and billing mode is derived from key NAMES (`billingModeFromEnvKeys`), so a
    carve-out that is narrow, named, and asserted — one exact variable, never a prefix — may be
    defensible. Prove the refusal still fires on a real `ANTHROPIC_API_KEY` leak in the same test
    file, or the carve-out is not established.

    (iii) ALLOWLIST OR THREAD? POSE THE QUESTION #1476 ALREADY ANSWERED ONCE, AND DO NOT ASSUME THE
    ANSWER TRANSFERS. `CLAUDE_CODE_OAUTH_TOKEN` went on the ALLOWLIST rather than being threaded
    explicitly, because threading needs all three spawn paths to opt in and a missed one yields a
    silently UNAUTHENTICATED worker — the failure this fleet is worst at seeing. That argument is
    strong for a credential every spawn needs. It is WEAKER for a var only the usage probe needs,
    where a narrow thread through `readUsageSnapshot` alone would leave worker spawns untouched and
    the billing assertion completely intact. Weigh both and record which, with the reason.

    (iv) THE PROBE'S HOME REDIRECT IS PART OF THE QUESTION. If the minimum set in (i) turns out to be
    a FILE rather than a variable, the fix is a `WORKER_HOME_SYMLINKS` entry, not an ALLOWLIST entry —
    and that table's own comments show it already reasons about what a redirected HOME hides. Do not
    assume the answer is the allowlist because the recon looked at the allowlist first.

    (v) FALSIFIER, BOTH DIRECTIONS. A container-shaped env must produce a child env the probe can
    authenticate with, AND a parent carrying a stray `ANTHROPIC_API_KEY` without the engaged valve
    must still throw. The second is the one a rushed implementation drops, and it is the one that
    protects the billing boundary.

    (vi) WHERE THE NUMBERS COME FROM, IF THIS TASK ASKS FOR ANY. Any count of affected runs is a
    `git log`/`git show` walk of `origin/main` plus the local checkout — there is no GitHub query
    here and no history mining. Three tasks stalled this week on clauses a worker read as a network
    question.

    NOT IN SCOPE: the drain's degraded-mode BOUND and its polarity (ratified; `readUsageSnapshot`'s
    doc says so outright), the `headroom_degraded` MESSAGE (a separate change), the console's
    `cachedUsageUtilization` panel, and `GH_TOKEN`'s existing entry.
  acceptance:
    - claim: "the minimum set of container credential variables the usage probe needs is named as data rather than inferred from what happened to be observed"
      proof: "grep: CONTAINER_CREDENTIAL_KEYS in src/lib/env.ts"
    - claim: "a container shaped environment produces a worker env the usage probe can authenticate with"
      proof: "unit test: test/container-credential-worker-env.test.ts"
    - claim: "a stray Anthropic api key with no engaged overflow valve still throws the billing boundary violation"
      proof: "unit test: test/container-credential-worker-env.test.ts"
    - claim: "every allowlist entry that exists today still survives, so this widening adds and never removes"
      proof: "unit test: test/container-credential-worker-env.test.ts"
