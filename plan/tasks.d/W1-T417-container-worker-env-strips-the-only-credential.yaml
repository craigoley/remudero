    neither the entanglement gate nor the cli-reference drift check is tripped.
    FILES: CAN CONTAIN THE DESIGN, checked deliberately because tasks this week could not.
    `ALLOWLIST`, `ANTHROPIC_KEY`, `SANCTIONED_KEY`, `buildWorkerEnv` and `billingModeFromEnvKeys`
    ALL live in src/lib/env.ts, and a dedicated test file mirrors #1513's own
    test/gh-token-worker-env.test.ts. src/lib/worker-home.ts is named in clause (iv) as the
    ALTERNATIVE route and is deliberately NOT declared — if the measurement in (i) sends the fix
