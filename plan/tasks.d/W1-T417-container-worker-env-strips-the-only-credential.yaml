  note: "RETIREMENT RECORD, 2026-08-10 — THIS TASK IS RETIRED BECAUSE ITS PREMISE IS REFUTED, not
    because the work is done. It must not be dispatched. Everything below is preserved verbatim so
    a future reader needs no archaeology.
    WHAT THE PREMISE WAS: that `claude -p /usage` FAILS TO AUTHENTICATE because `buildWorkerEnv`
    strips the container's credential, and that the fix is to widen the ALLOWLIST.
    THE EVIDENCE THAT REFUTES IT — two `usage.probe_failed` rows, measured on the drain host:
    {\"step\":\"usage.probe_failed\",\"stage\":\"parse\",\"reason\":\"no 'Current session:' line in /usage output\"}
    both carrying stage `parse`, NOT `spawn`.
    WHAT THAT FIELD PROVES, DERIVED FROM SOURCE AT db22bd8 rather than taken on trust.
    `readUsageSnapshot` (src/run-task.ts) is written as TWO tries and its own comment says the split
    is not cosmetic. The FIRST wraps `materializeWorkerHome`, `buildWorkerEnv` and the
    `runUsageProbe` call, and its catch emits stage `spawn`. The SECOND wraps `parseUsage(out)`
    ALONE, and its catch emits stage `parse`. So a `parse` row is reachable ONLY once the
    subprocess has RETURNED OUTPUT: no nonzero exit, no missing binary, and — decisively for this
    task — no `buildWorkerEnv` throw. The reason string is emitted at exactly ONE site in the whole
    codebase, `parseUsage`'s `UsageParseError` in src/lib/headroom.ts, guarded by `SESSION_LINE`.
    AND A CORRECTION TO THE BRIEF THAT RETIRED THIS, because a retirement record that overstates its
    own evidence is the failure it exists to prevent: the stage field ALONE is NOT the whole
    refutation. src/lib/containment.ts records that an unauthenticated headless run RETURNS the text
    `Not logged in - Please run /login` (matched there on result TEXT, via `CREDENTIAL_FAILURE_RE`
    plus `CREDENTIAL_LOGIN_HINT_RE`), and such a body would ALSO fail `parseUsage` with this exact
    reason. The stage field proves the subprocess returned; it does not by itself prove the return
    was authenticated. WHAT SETTLES IT IS THE OUTPUT.
    THE MEASURED OUTPUT, run directly in the image with a real token, recorded here so nobody
    re-derives it: `claude -p /usage` returns a SESSION COST SUMMARY — `Total cost: $0.0000`,
    `Total duration (API)`, `Total code changes`, `Usage: 0 input, 0 output ...` — and NO
    account-window panel, and no `Not logged in` fragment. A `Total duration (API)` line and a token
    `Usage:` line are the shape of a run that REACHED THE API. The probe authenticates and runs; it
    returns output the parser does not recognise, because `-p` mode emits no `Current session:` line
    at all.
    THE CONSEQUENCE, PLAINLY: widening the credential ALLOWLIST would have bought NOTHING, because
    the probe is not failing on credentials. Worse, it would have been actively harmful in the one
    direction this repo guards hardest. Clause (ii) below already flags that `ANTHROPIC_BASE_URL`
    matches `ANTHROPIC_KEY`'s `/^ANTHROPIC_/i` and is exactly what the billing-boundary throw exists
    to catch. Note WHERE that throw fires: `buildWorkerEnv` is called INSIDE the spawn try, so
    admitting that variable without also carving it out of the assertion would convert today's
    `parse` row into a `spawn` row — turning a parser mismatch into a hard probe failure while
    looking like a fix. This task would have spent 70 dollars weakening the guard between this fleet
    and API-rate billing, to solve a problem that is not in the environment.
    WHAT REPLACES IT, NAMED BUT DELIBERATELY NOT FILED HERE — that is its own pass. The real fix is
    the probe's SOURCE or its PARSER, never the environment. `readAccountUsageFile`
    (src/lib/account-usage.ts) reads `~/.claude.json`'s `cachedUsageUtilization`, a FILE rather than
    a subprocess, and that block carries its own `fetchedAtMs` (an honest as-of) and `accountUuid`
    (whose usage it describes) — both things a `/usage` capture cannot supply. Note the route is not
    free today: `WORKER_HOME_SYMLINKS` (src/lib/worker-home.ts) does NOT carry `~/.claude.json` into
    the redirected HOME, which the original rationale below already established. That is a fact for
    the replacement task to weigh, not a reason to reopen this one.
    WHAT IS NOT CLAIMED. The ledger is UNREACHABLE from this session — the Mac mini is down — so the
    two rows above and the `-p` capture are the OPERATOR'S measurements, used as given. What is
    re-derived here at db22bd8 is the source structure that makes them decisive: the two-try split,
    the single emitter of the reason string, and the call position of `buildWorkerEnv`.
    ORIGINAL NOTE, UNCHANGED, follows.
    verify:auto — the env construction and the billing assertion are pure over an injected
    parent env, decidable in-process. Clause (i)'s minimum-set determination does run the real probe
    once, which spends a small amount of account quota; that is the only non-pure step and it is
    what makes the difference between a measured minimum and a guessed one.
    risk:high IS BLAST RADIUS HERE, NOT ONLY RULE 19'S SPAN. files: does read as two concerns (env,
    container-credential-worker-env), so the band is required either way — but the reason to review
    this carefully is clause (ii): the change touches the ONE assertion standing between this fleet
    and billing API rates instead of the subscription, and a version that widens `ANTHROPIC_KEY`'s
    regex rather than naming a single exact variable would disarm it while looking like a fix.
    RULE 25 CHECKED BEFORE FILING: neither declared path is an INSTRUMENT_SURFACE entry (no
    workflow, no *-ratchet.mjs, no diff-coverage.mjs, no *-baseline.json, no
    mutation-relevant-paths.json, no stryker.conf.json), and src/lib/env.ts is not in
