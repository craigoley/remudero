    ON THE PROOFS: one is `grep:` with an explicit path, naming a symbol that exists NOWHERE in src/
    or test/ today, so it cannot match the merge base and be downgraded to executed_stale. That
    name is BINDING on the implementer rather than a guess: CONTAINER_CREDENTIAL_KEYS for the
    named minimum set, and the two direction tests use the pure-path form against
    test/container-credential-worker-env.test.ts, which does not exist yet — a forward reference to a
    PATH, safe per CLAUDE.md, declared in files: so the worker creates it. It is deliberately NOT a
    `grep:` against that path: grep on a missing file returns exec_error rather than a clean no-match,
    which is a worse signal than the absence it is meant to record.
    THE FOURTH PROOF WAS REWRITTEN BEFORE FILING, and the reason is worth keeping: it first named
    test/env.test.ts, and `proof-scope` refused it — that path is outside this task's files:, so the
    push-time scope guard would have refused the branch AFTER the work was done. The claim is
    asserted in the declared test file instead, over the allowlist's current entries, rather than by
    widening files: to buy a path the design never needed."
