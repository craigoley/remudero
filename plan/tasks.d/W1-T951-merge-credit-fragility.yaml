  note: |
    verify: human IS SET UP FRONT AND IS THE POINT. A defect in this task re-dispatches work
    that already shipped — the exact failure it exists to prevent — and design item (i) requires
    a JUDGEMENT about which layer owns the durable record before any edit. `isDispatchEligible`
    (src/lib/drain.ts) returns false at `t.verify !== "auto"` before the linter is consulted, so
