    risk: high IS BOTH RULE 19'S SPAN AND REAL BLAST RADIUS, unusually. The span is four files
    across two subsystems (status derivation, dispatch selection). The blast radius is genuine:
    this changes what the fleet believes has already shipped, and an over-crediting bug silently
    STOPS work while an under-crediting bug silently REPEATS it.

    FILES DERIVED BY READING THE SOURCE AT 7bd6dc1, NOT GUESSED. `src/lib/status.ts` carries the
    branch rung (`corroborateByBranch`, :2148-2163) AND both `findMergedByHeadBranch`
    implementations (:3267, :3721) — the whole credit derivation is in that one module.
    `src/lib/drain.ts` carries the consumption gate (`isDispatchEligible` :362, `MergedSet` :28).
    Suites chosen by invocation count: test/open-pr-corroboration.test.ts is the direct exerciser
    of the rung (findMergedByHeadBranch=2, head-branch=2), and test/dispatch-lifetime-breaker.
    test.ts is the highest exerciser of the selection path (runnableCandidates=4, nextRunnable=9),
    against a control suite reading 0 for both. `src/run-task.ts` is DELIBERATELY NOT DECLARED:
    its two `isMerged` sites (:10621, :12292) only read `projection.merged` and add no derivation
    of their own, and W1-T471 records that declaring the monolith serialises every task naming it.
    A builder choosing a persistence layer outside these four will need to widen this list at that
    point, and design item (i) is where that decision is made.

    plan_refs CITES PULL REQUESTS, WHICH DEPARTS FROM CONVENTION, DELIBERATELY. Across 313 shards
    the established shapes are "W1-TN" (575), "§N" (118) and "PN" (31), and NO shard cites a PR
    number. The evidence for this task is three merges rather than three tasks, so the refs name
    them. This is safe at every gate: plan.ts:131 calls plan_refs "DECLARATIVE metadata" and
    task-linter.ts:1939 records that the parser DROPS the field entirely, so nothing validates it.

    THE ID RESTS ON A FIVE-SURFACE SWEEP; THE RESERVATION WAS REFUSED. W1-T949 is contested (PRs
    #2047 and #2048 both claimed it) and #2048 is being renumbered to W1-T950, so both were
    avoided. W1-T951 read 0 against refs/rmd-id/*, main's shard filenames, the main tree, every
    open PR's file list, and plan/tasks.yaml — each with a positive control reading 1 (W1-T949,
    W1-T948, W1-T947, W1-T950, W1-T280 respectively). Highest id claimed on any surface was 950.
    The gated push to refs/rmd-id/W1-T951 used an orphan commit over the empty tree
    (4b825dc6) carrying a host-pid-nanosecond nonce, a braced refspec, and the exit code captured
    in a variable rather than read through a pipe. It returned PUSH_EXIT_CODE=1, verbatim:
      error: RPC failed; HTTP 403 curl 22 The requested URL returned error: 403
      send-pack: unexpected disconnect while reading sideband packet
      fatal: the remote end hung up unexpectedly
      Everything up-to-date
    The readback found no ref, so the reservation does not exist and the sweep is the whole basis.
    REFS ARE CORROBORATING, NEVER AUTHORITATIVE HERE: the namespace holds 47 refs against 563
    taken ids, so a ref reading absent proves nothing on its own — which is why all five surfaces
    were swept and why the tree, not the ref namespace, is the authority.
