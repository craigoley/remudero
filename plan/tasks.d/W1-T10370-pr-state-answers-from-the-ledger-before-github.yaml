      proof: "grep: W1-T10370: stale PRs are revalidated by one batched broker query in test/ledger/pr-state-answers-from-the-ledger-before-github.test.ts"
    - claim: "every printed field carries its as-of timestamp and source"
      proof: "grep: W1-T10370: every field prints its as-of time and source in test/ledger/pr-state-answers-from-the-ledger-before-github.test.ts"
    - claim: "the CLI dispatches the pr-state verb to its handler"
      proof: "grep: prStateCommand( in src/run-task.ts"
  falsifier: |
    Make the verb call the broker unconditionally and the fresh-ledger test reds (one call where none is allowed). Skip
    the revalidation and the stale test reds. Drop the as-of stamp and the third test reds.
  note: |
