    scopeGuardOutOfScopeFiles, scopeViolationFiles, rubricAdvisorySection and the runReview
    comment path are all on main at 07d2d65.
    THE EMPTY-files: ASYMMETRY, RECORDED SO THE IMPLEMENTER DOES NOT REDISCOVER IT MID-BUILD.
    Design (iii) sources the section from scopeViolationFiles, which returns the EMPTY list on an
    absent or empty declared scope — deliberately, and its own doc says so in as many words:
    DELIBERATELY DIFFERENT FROM scopeGuardOutOfScopeFiles, which returns the whole diff in that
    same case (a task declaring nothing is not treated as declaring everything). Both re-derived
    from source at d968c50. CONSEQUENCE: for a task declaring no files: this change is not
    block-to-flag but block-to-LEDGER-ONLY — the scope_guard.overrun row is written and NOTHING
    renders on the PR, clause (iii-b)'s paste-ready line included, since that line is a child of
    the same section. THE NARROW CORRECTION, IF THE IMPLEMENTER WANTS IT: have
    scopeAdvisorySection PREFER THE PUSH SITE'S out_of_scope when it has one, rather than
    recomputing from scopeViolationFiles. That lets the advisory speak on the one case the review
    side declines, and it changes scopeViolationFiles' semantics for no other PR — so it does not
    reopen W1-T401's settlement, which design (vi) puts out of scope.
    WHY THIS IS A NOTE AND NOT A CRITERION: IT IS LATENT. 80 of 461 tasks declare no files:, and
    ZERO of them are dispatchable — of the 18 surviving isDispatchEligible's merge-independent
    gates, 14 are refused by proof-dialect at assertLintClean inside runTask before any work
    begins (so they never reach the push site at all), and the 4 that lint clean, W1-T282 through
    W1-T285, are implemented and merged. All six no-files: shards were filed on ONE DAY,
    2026-08-01; the 147 shards filed since then all carry files:. Nothing in the linter requires
    the field — every use is task.files ?? [] — so a future filing can reintroduce it, which is
    why the fact is written down rather than assumed extinct. Counts are a query, not a standing
    number: re-run it before relying on it. (recon 2026-08-11, source-derived at d968c50; LEDGER
    UNMEASURED, the mini is down.)
    WITHDRAWN AFTER THE FACT — clause (iii-b) AND ITS FOURTH CRITERION, operator-ruled
    2026-08-11. Both are REMOVED from this record above; this paragraph is the whole of what
    survives them, and the reference to 'clause (iii-b)' in the preceding paragraph — left byte-
    identical on purpose, since it was written before this ruling — points here.
    THE IDEA, PRESERVED BECAUSE THE REASONING STILL STANDS: the advisory could render the
    corrected declaration ready to paste, [...declaredFiles, ...outOfScope] deduped and sorted,
    formatted as the yaml files: line. It computes nothing new — scope_guard.overrun already
    carries BOTH halves as out_of_scope and declared_files — so it is a pure function of two
    values in hand, and it would turn a human's job from an investigation into a paste.
    WHY IT WAS WITHDRAWN, TWO REASONS AND THE SECOND IS THE DECIDING ONE. First, the task SHIPPED
    WITHOUT IT (#1585, 37eb375): correctedFilesLine is 0 hits across src/ and test/ on
    origin/main, verified with a control on the same file, so the criterion asserted a deliverable
    the merged tree does not contain — by this repo's own gate semantics an executed_fail, which
    overrides keyword coverage and would fail a re-review of an already-merged task. Second, the
    line is UNRENDERABLE FOR EXACTLY THE TASKS THAT MOST NEED IT: it would be a child of
    scopeAdvisorySection, which sources from scopeViolationFiles, which returns [] on an empty
    declared scope BY DESIGN — so a task declaring no files:, the case where a corrected files:
    line is the entire point, is the one case that renders nothing. Withdrawing the criterion is
    therefore not a retreat from the idea; it is refusing to bind a task to a deliverable whose
    own design note already records it as half-inert. Anyone reviving it should resolve the
    empty-scope asymmetry FIRST — the narrow correction is named in the paragraph above.
    THE PROCESS FINDING, RECORDED BECAUSE IT WILL RECUR AND COST MORE NEXT TIME. Clause (iii-b)
    and its criterion were added at 18:17 by #1583, AFTER the implementation branch was cut from
    #1581 at 17:25 and BEFORE it merged at 18:40 — git merge-base --is-ancestor e506894 300b89c
    is FALSE. The implementer read a three-criterion record and shipped against it faithfully;
    the contract changed underneath a run already in flight, and neither side did anything wrong.
    THE GUARD EVERY BRIEF USES DOES NOT CATCH THIS: git ls-remote --heads origin 'run-<id>-*'
