  title: "THE DOCTRINE BYTE CAPS DROP KNOWLEDGE ON THE FLOOR — §8A refuses ANY net-positive CLAUDE.md diff whatever the headroom, and `learnings` sits at 41714/42000, so a retro that harvests a real rule has nowhere to put it and reports the ceiling as the blocker; MEASURED twice, both times the rule was simply lost"
  repo: remudero
