  rationale: |
    REPRODUCED on the current base from this macOS host. `test/a-gardener-pr-carries-a-conforming-identity.test.ts`
    creates a worktree under `/var/folders/...`; Node resolves its script URL through `/private/var/folders/...`,
    while `scripts/lib/argv.mjs` compares the URL and argv spelling byte-for-byte. The generator then exits
    successfully without running its main function, and `git add docs/docs-index.json` fails because no index
    was produced. The unrelated script test already covers the ordinary true/false cases; the missing case is
    the macOS alias path that causes this real integration failure. GitHub Linux CI passed the integration
    suite on current main; the local macOS parity run remains falsely red.
  design: |
    Compare the canonical filesystem identities of a module URL and argv path in `isMainModule`, returning
    false when either path cannot be resolved; do not fall back to basename matching. Add a symlink-path
    regression while keeping unrelated scripts false. Keep the real garden integration test as the end-to-end
    proof that the docs generator actually runs and its index is committed.
  acceptance:
    - claim: "isMainModule recognizes a symlinked argv path but not a different file"
      proof: "unit test: isMainModule recognizes a symlinked argv path but not a different file"
  falsifier: |
    CLOSE IF `isMainModule` already treats `/var` and `/private/var` spellings as the same existing file and
    all path-sensitive tests pass on this macOS host without changing the scratch safety boundary.
