      proof: "unit test: test/an-instrument-change-that-only-tightens-is-not-entanglement.test.ts"
  falsifier: |
    Close without implementation if `detectInstrumentEntanglement` already admits a tightening-only
    instrument change. MEASURED at origin/main 30a4a2e9a against #4558's real diff
    (`git diff origin/main...origin/run-W1-T2896-1788841173870`): `entangled: true`,
    `instrumentPaths: ["scripts/bound-kind-baseline.json", "scripts/gh-transport-baseline.json"]`,
    22 srcPaths — while `bound-kind-baseline.json` contains removals only and
    `gh-transport-baseline.json` is a new file pinned at 0. The blocking control (same call, `scripts/`
    paths removed) returned `entangled: false`, proving the refusal live.

    Also close if `ENTANGLEMENT_EXEMPT_INSTRUMENTS` already covers those two paths — it does not; its
    four entries are knowledge-budget, source-size, comment-load and clock-signature, and its own doc
    comment states that a new baseline gets full entanglement blocking, so the newly added instrument
    is unreachable by that mechanism by design.

    DO NOT falsify this from W1-T2521. `isIntroducingCensusGate` admits a new CENSUS GATE SCRIPT plus
    its first registration; it does not read numeric direction, does not apply to a baseline JSON, and
    left #4558 refused in the measurement above. It is the PRECEDENT for the subtraction point, not a
    prior implementation of this rule.
