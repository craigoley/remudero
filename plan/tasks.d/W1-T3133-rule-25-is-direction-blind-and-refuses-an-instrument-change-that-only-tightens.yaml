    ONE CONCERN ONLY: make rule 25 read the DIRECTION of an instrument change instead of only its path.
    Not in scope: adding, removing or migrating any `ENTANGLEMENT_EXEMPT_INSTRUMENTS` entry; changing
    `INSTRUMENT_SURFACE`; changing what counts as a product path; and unblocking #4558 by hand — that
    PR is the evidence this task was derived from, and it is expected to clear on its own once this
    ships, with no edit of its own.

    The declared-direction table in design (ii) is the dangerous half. A wrong entry does not fail
    loudly; it quietly admits a loosening. Acceptance criterion 2 exists to redden on an inverted
    table, and it must be verified by actually inverting one entry and watching it fail.
