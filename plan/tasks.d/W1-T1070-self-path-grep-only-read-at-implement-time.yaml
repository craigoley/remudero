      proof: "unit test: W1-T1070: the changed-tasks pass raises the check to blocking"
  origin: "recon#self-path-grep-cannot-discriminate-2026-08-20"
  plan_refs: ["W1-T310", "W1-T456", "W1-T497", "W1-T1056"]
  files: [src/lib/task-linter.ts, src/run-task.ts, test/task-linter.test.ts]
  status: queued
  attempts: 0
  note: |
    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `lint-plan` reads two
    stems here — `task-linter` and `run-task` — and refuses that at medium. DECOMPOSITION IS
    DECLINED WITH A REASON: design (iii) is the whole point of the task, and the severity lever it
    needs lives in `lintPlanCommand`'s `if (scope)` block in `run-task.ts` while the predicate lives
    in the linter. Splitting them ships a predicate nothing consults — which is the defect in (4),
    reproduced. The diff is one predicate, one message, and one severity line.

    `test/task-linter.test.ts` IS THE EXISTING HOME and is declared rather than a new filename, so
    `subsystemsOf` reads `task-linter` and not a third stem.

    THIS SHARD DELIBERATELY CARRIES NO PROOF THAT GREPS ITS OWN PATH — that is the defect being
    filed, and a shard that committed it while describing it would be unreadable as evidence. Its
    eight proofs are name-filtered `unit test:` forward references, which `proofScopePath` returns
    `undefined` for, so `proof-scope` is correctly silent on all eight.

    EVERY FIGURE IS A QUERY, NOT A NUMBER TO CARRY. Re-derive the population by parsing each shard's
    `acceptance:` and comparing each `grep:` proof's path (the token after the LAST " in ") against
    the shard's own path; re-derive the already-warned count by calling `proofScopeViolations(task)`
    directly and matching its `criterion N` prefix; re-derive the open-PR scores by importing the
    real `proofKeywords`/`tokenize` and `MIN_COVERAGE` rather than restating 0.6. All three moved
    between W1-T310's filing (102 of 338 tasks) and this one (76 of 414), and they will move again.
