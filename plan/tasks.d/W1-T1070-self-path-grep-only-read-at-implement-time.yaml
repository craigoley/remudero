      proof: "unit test: W1-T1070: a self-path grep proof draws its own named violation"
    - claim: "declaring the shard's own path in files does not silence that violation"
      proof: "unit test: W1-T1070: declaring the shard's own path does not silence it"
    - claim: "the violation text sends the author to the filing PR body rather than to files"
      proof: "unit test: W1-T1070: the self-path violation points at the filing PR body"
    - claim: "an ordinary out-of-scope grep keeps the existing proof-scope wording untouched"
      proof: "unit test: W1-T1070: an ordinary out-of-scope grep keeps its message"
    - claim: "a name-filtered unit test proof stays silent because it names no path at all"
      proof: "unit test: W1-T1070: a name-filtered unit test proof stays silent"
    - claim: "every self-path criterion on a shard is reported and not only the first"
      proof: "unit test: W1-T1070: every self-path criterion on a shard is reported"
    - claim: "the check warns by default so no queued task is refused at dispatch"
      proof: "unit test: W1-T1070: the check warns by default at pre-dispatch"
