  rationale: |
    RULED 2026-11-10 by the operator: send cheap, easy tasks and decisions to cheap pay-per-token models when possible. The daily cash cap is 10 dollars on a normal day and 50 dollars on a squeeze day.
    MEASURED 2026-11-10 by the operator session in the core instance's ledger, 2026-10-27 to 2026-11-10:
    - Judge calls on gpt-6-luna at low effort succeeded in 95.9% of 3,266 calls, at a median cost of $0.003.
    - Judge calls on claude-haiku-5-5 at low effort succeeded in 99.9% of 1,396 calls, at a median cost of $0.002.
    - The gardeners and the escalation judge already run on the cash model gpt-oss-120b. `.remudero/mounts.yaml` gives the escalation judge its own row with `provider: cash`.
    - About 6,800 calls of the risk judge, the feedback summary and the ci judge still drew on subscription quota.
    - Claude was below its reserve in 33.4% of assignments. A judge call on a subscription takes quota that a build could use.
    READ 2026-11-10 in the source on main:
    - The risk judge, the decision summary and seven other callers share `resolveRiskJudgeMount` in src/lib/risk-judge.ts. It returns the cheapest mount in the routing table, and that mount names no provider.
    - `.remudero/mounts.yaml` says that the risk judge fails closed, and that it moves to cash "only behind a measured reliability record". No such record exists for it.
    - W1-T11075 (queued) gives the ci judge and the fix-progress judge their own rows and a cash shadow. It covers no other role, writes no summary and proposes no switch.
    - The cash trial in src/lib/cash-trial.ts already sends the simplest build work to cash. This task covers decisions.
  design: |
    The roles of this task are the risk judge (`realRiskJudge`) and the decision summary (`resolveDecisionSummaryMount` and its caller in src/lib/feedback.ts). W1-T11075 covers the ci judge and the fix-progress judge.
    Add src/lib/judge-shadow.ts with two functions.
    1. `shadowJudgeCall` takes the role, the prompt, the answer of the current model and the role's own parser. It picks the first ready model of the cash economy row at low effort, reserves against the daily cash cap with `squeezed` unset, sends the prompt once and writes one `judge_shadow.compared` row. A refusal or a failure writes one `judge_shadow.skipped` row with the reason.
    2. `judgeShadowSummary` reads those rows and the rows of W1-T11075 and returns the figures of criterion 5 for each role. The builder reads the step name that W1-T11075 chose.
    The caller does not wait for the shadow call. The risk judge returns its verdict first, as the typed shadow of W1-T4672 does today.
    Add two optional rows to `.remudero/mounts.yaml`, `risk_judge` and `feedback_summary`, with the shape of `escalation_judge`. src/lib/mounts.ts parses them. `realRiskJudge` and the decision summary read their row first and fall back to `resolveRiskJudgeMount`. This task adds both rows with the model and effort that `resolveRiskJudgeMount` returns today and with no provider, so no model changes when it merges. It writes each row on one line, so that the gardener replaces one line.
    Add a class to the config gardener. Its candidate is one edit of `.remudero/mounts.yaml` that adds or changes the row of one role to the cash economy model with `provider: cash`. The bar is: at least 200 paired calls in the last 14 days, at least 98% agreement, and at most 2% of shadow calls with no usable answer. The canary of the gardener then measures the role on its new model and rolls the edit back as it does for a mount today.
    The cost is small. About 6,800 calls in 14 days is about 490 calls a day. At $0.003 a call that is about $1.50 a day, under the normal figure of 10 dollars. The cap is the bound: a day that reaches it gets no more shadow calls.
    Record the new rows and the bar in docs/model-routing.md.
    NOT IN SCOPE: the ruling judge and the machine-filing judge, where a wrong answer refuses a ruling or dispatches work; the flight judge, which the tier rule binds; the callers of `resolveRiskJudgeMount` outside the two roles; and the reconciled invoice of W1-T10858.
  falsifier: |
    Return the shadow's answer to the caller and criterion 3 must fail. Send the request after the cap refuses and criterion 4 must fail. Count a skipped call as agreement and criterion 5 must fail. Propose a switch at 97% agreement and criterion 6 must fail. Change the mount of a role that has no row and criterion 7 must fail. Restore and require all to pass.
  note: |
    The three numbers of the bar are new. The builder may replace each one with a measured value and must say why in the pull request.
    Build this after W1-T11075 merges. The pair of the daily cash cap needs W1-T12186 before a config file can hold it; this task reads a plain number as the normal figure.
