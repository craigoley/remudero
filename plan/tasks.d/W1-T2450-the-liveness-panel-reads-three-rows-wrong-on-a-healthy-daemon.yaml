    - claim: "a boot that follows a freshness exit is distinguishable from one that follows a crash"
      proof: "unit test: test/liveness-distinguishes-absent-sensor-from-dead-service.test.ts"
    - claim: "a window of freshness restarts does not breach the crash-loop detector while a window of real crashes still does"
      proof: "unit test: test/liveness-distinguishes-absent-sensor-from-dead-service.test.ts"
