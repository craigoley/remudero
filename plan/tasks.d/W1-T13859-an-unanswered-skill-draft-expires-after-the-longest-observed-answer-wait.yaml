  rationale: |
    OBSERVED on the Azure host, 2026-11-19. No time limit exists for any Inbox proposal. A proposal leaves
    the open set only through an answer: ratify.approved, panel.proposal_declined (by the operator, the
    fleet lane or the Inbox responder), or a retirement backed by proof (a merged task, a finding that is
    gone, a successor). A skill draft has no task to merge, so only the operator can answer it. Two
    implement drafts have waited since September. The first-seen store dates them 2026-10-13, which is
    when the store started (1,197 ids carry that same backfill stamp). The ledger has skill.staged rows
    for 88d9945f from 2026-09-25 and for 84a7cc07 from 2026-09-30.

    The bound must come from data, not a fixed number. Over the first-seen store and the full ledger,
    excluding the backfill stamp, 775 proposals were answered after they were first seen. The longest
    wait was 32.62 days (a follow-up approved by the fleet on 2026-11-16). The longest wait for an
    operator answer was 0.8 days (5 proposals, 4 of them console tests). On that data, a draft first seen
    more than 32.62 days ago has waited longer than any proposal that was answered.

    Scope amendment 2026-11-20 for PR 19830: files adds three tests the compaction fix edits.
    The fleet fix publishes archives only to unused paths and lets the verdict lock reclaim a stale
    holder; the existing compaction and decline tests pin the old archive names and lock behavior.

    MOVED to W1-T14047 by the sweep (W1-T12709): 1 criteria that need operator input, so https://github.com/craigoley/remudero/pull/19830 merges on the rest.
  design: |
    1. Add skillDraftExpiryBound(stateDir) in skill-workshop.ts. Read the first-seen store
       (inboxFirstSeenPath in panel-graph.ts; export its reader if a second reader is needed and check the
       import with depcruise) and the ledger union through readLedgerUnionRecordsSync with steps
       ratify.approved and panel.proposal_declined and refuseIncomplete. For each id, the wait is from its
       first-seen time to its first answer at or after that time. Leave out ids stamped with the store's
       earliest time (their true age is unknown) and rows with origin skill-workshop (so expiries never
       feed the bound). The bound is the largest wait. Return {bound, sample} or {unmeasured: reason}.
    2. Add expireUnansweredSkillDrafts(registryPath, stateDir, log, clock). For each skill-draft
       proposal with a skill file: skip it when the ledger has ratify.approved or a decline that is not
       restored (ledgerProposalVerdicts), or when the workshop's close record from W1-T13858 matches its
       stored text. Otherwise, when now minus first-seen is greater than the bound, close it with the
       W1-T13858 close and the reason "expired: unanswered for <age> days; the longest wait of any
       answered proposal is <bound> days (<n> answered)".
    3. Call it in the retro in src/run-task.ts right after stageSkillDrafts. It is best-effort like that
       call: a throw is logged as skill.expire_failed and never fails the retro.
    4. No fixed number. The bound changes as answers arrive. With no measurable sample, nothing expires.
    5. REMAINING RACE (operator ruling 2026-11-21, PR 19830 review round 3): no shared ledger append lock exists.
       appendLedger takes no lock, and deploy/entrypoint.sh, deploy/recycle-container.sh and deploy/idle-starved-probe.sh
       append with shell >>. A row can therefore land between the completeness check and the decline. Expiry detects it
       after its write and withdraws the decline, so a reader may briefly see a decline that is then withdrawn.
       Preventing it needs a ledger append lock that every appender takes, which is a separate task.
    INVARIANT approve-only-writes-skills: An expiry writes only the ledger decline and the registry close record. Nothing writes under .claude/skills/ except `rmd approve`, and `rmd restore` reopens an expired draft.
  falsifier: |
    Count the workshop's own expiry rows in the sample: criterion 5's bound grows and the test fails.
    Drop the first-seen backfill filter: the sample takes in 1,197 ids with unknown ages. Replace the
    derived bound with a constant: criterion 1's fixture, whose longest wait is not that constant, fails.
  note: |
    Filed from the 2026-11-19 skill-draft analysis. Builds on the close step of W1-T13858.
