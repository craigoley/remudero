- id: W1-T13258
  title: "An operator turns the Inbox gardener to shadow, act or off with one recycle flag, and every later recycle carries that mode instead of silently dropping it"
  repo: remudero
  priority: 1.1
  depends_on: []
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # changes the daemon recycle script; secrets keep their existing capture path and only one non-secret name becomes settable
  band_meaning: blast-radius
  origin: "operator-session#console-inbox-defects-2026-11-16"
  plan_refs:
    - W1-T9284
    - W1-T13197
    - W1-T13202
    - W1-T1069
  files:
    - deploy/runtime-env-vars.sh
