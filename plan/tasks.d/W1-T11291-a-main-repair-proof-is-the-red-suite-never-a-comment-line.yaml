  title: "A main repair's Acceptance proof is the suite that turned main red, which fails at the base by construction, and the diff-anchor fallback never greps a comment line, so a correct main repair is no longer CAPPED and main is not left red waiting for an operator"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern, the proof a main-repair PR body carries; it decides whether main's repair can arm
  origin: operator-session#main-repair-capped-2026-11-03
  plan_refs:
