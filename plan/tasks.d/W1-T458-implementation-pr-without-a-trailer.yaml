- id: W1-T458
  title: "an implementation PR that merges with no `Remudero-Task:` trailer earns its task NO credit and leaves it re-dispatchable, and the reviewer never looks at the trailer at all"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
