- id: W1-T11374
  title: "Auto-triage reads its status: new candidates from origin/main's plan/feedback (plus the checkout's own untracked captures), so feedback merged after the daemon booted is triaged on the next pass instead of waiting for the next restart"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern, which tree auto-triage enumerates; it gates every feedback item's path to a task, including the dependency-repair priority
  origin: operator-session#coupled-dependabot-pair-2026-11-04
  plan_refs:
    - W1-T2749
    - W1-T2289
