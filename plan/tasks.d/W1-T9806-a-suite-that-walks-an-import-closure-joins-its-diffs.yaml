  falsifier: |
    At origin/main, two things fail. First, `sourceTextReaderOf("test/baked-supervisor-inputs.test.ts", <its text>,
    roots)` returns `walks: []` and `censusShaped: false`, so `readerJoins(reader, "src/lib/ledger.ts")` is false and
    the second test fails. Second, `evaluateAdmittedCensusSuites` over a src/lib/ledger.ts diff that adds
    `import ... from "./host-identity.js"` joins none of the three suites, so `runSuites` is never asked for them and
    the fourth test fails.
