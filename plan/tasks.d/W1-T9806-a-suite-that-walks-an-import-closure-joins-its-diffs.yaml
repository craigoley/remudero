  rationale: |
    OPERATOR RULING (Craig, 2026-10-16): W1-T9804 ("a scope amendment may add a .github/workflows/ path") is REJECTED
    as a security weakening and retired with `superseded_by: W1-T9806`.
    - The auto-mode classifier refused that edit as [Security Weaken].
    - Builder B19 found that a "tracked-path token insertion" into codeql.yml's or semgrep.yml's `paths-ignore` passes
      W1-T9804's rule and removes a path from scanning.
    - Craig chose to PREVENT, not carve out. The fix lane never edits a workflow file. A change that joins the baked
      closure is caught BEFORE the PR opens. The implement worker gets the closure-census results and updates the lists
      in its own reviewed build (W1-T9851). A case that is still missed escalates to a person (W1-T9851).
    The lists a closure join must update:
    - DEPLOY_LOGIC_PATHS in deploy/install-host-units.sh, held to the deployer closure by `deployLogicModules` in
      test/a-busy-primary-reaches-its-image-recycle.test.ts;
    - BAKED_RUNTIME_SOURCE_PATHS in src/lib/baked-runtime-inputs.ts, held to the serve-supervisor closure by
      test/baked-supervisor-inputs.test.ts;
    - .github/workflows/acr-build.yml's `on.push.paths` list (held to BAKED_RUNTIME_SOURCE_PATHS by
      test/acr-build-trigger.test.ts) and its drift `for p in ...` loop.
    #12289's hand repair 3d24f75dd edited exactly those three files.

    READ at origin/main db88033a3 (2026-10-16), re-read at d1f751b9d:
    - src/run-task.ts `coveragePrecheck`: `if (suites.length > PREFLIGHT_SCOPED_COVERAGE_SUITE_CEILING) return { outcome:
      "unavailable", reason: ... "too wide to precheck quickly ..." }`. A diff to src/lib/ledger.ts reaches thousands of
      suites. W1-T9483 (queued) gives the coverage precheck a narrow first pass. That is about coverage, not censuses.
    - The census half runs through scripts/census-precheck.mjs (hooks/pre-push and the fix rung's
      `fixCensusSnapshotSteps`). `evaluateAdmittedCensusSuites` joins CENSUS_ADMITTED_MEMBERS by `walks`, plus
      PRECHECK_TRIGGERED_SUITES and PRECHECK_PATH_TRIGGERED_SUITES by `trigger`. Each failing row prints
      `census-suite: <file> fails — run ...; <remedy>`. None of the three suites above is in any of those tables.
    - W1-T9757 (queued, unbuilt: no merged trailer, no run- head) makes the precheck also run the census-shaped readers
      `discoverSourceTextReaders` places on the diff. Its appended rows carry no `remedy`.
    - The gap W1-T9757 leaves: src/lib/source-text-readers.ts `walksFromArgs` composes a walk only from literal
      segments ("a segment that is a variable stops the composition there").
      - test/baked-supervisor-inputs.test.ts walks `queue = ["src/lib/serve-supervisor-main.ts"]` with
        `readFileSync(join(ROOT, file), "utf8")`.
      - test/a-busy-primary-reaches-its-image-recycle.test.ts `deployLogicModules` walks
        `queue = ["src/lib/deployer.ts"]` with `readFileSync(file, "utf8")`.
      Neither suite carries a marker or a git pathspec, so both read `walks: []` and `censusShaped: false`. No diff
      joins them, and #12289's ledger.ts diff, which grew both closures, joins neither.
    - NOT COVERED: no shard on main or on any open head mentions an import-closure census marker or a baked-closure
      precheck row (swept origin/main plan/tasks.d and every open head's plan/ and file diffs, 2026-10-16, for
      census-closure|baked closure|DEPLOY_LOGIC_PATHS|BAKED_RUNTIME_SOURCE_PATHS and for edits to
      scripts/census-precheck.mjs and src/lib/source-text-readers.ts: none).
  design: |
    1. THE MARKER. src/lib/source-text-readers.ts exports `CENSUS_CLOSURE_MARKER = "@census-closure:"`. A comment line
       carrying it names one or more seed paths before its prose, as `@census-reads:` does.
    2. THE EXPANSION. `discoverSourceTextReaders` expands each seed to its relative runtime-import closure in the
       tree being read: static `import`/`export ... from` and literal `import()`/`require()`, `.js` read as `.ts`,
       type-only imports skipped, as test/baked-supervisor-inputs.test.ts `runtimeImports` reads them. Each closure
       file becomes an exact walk, and the reader is `censusShaped: true`. A seed that does not exist is no walk, and
       the meta-census's `isUnplacedSourceReader` reports it as today. This makes `rmd census-membership` name both
       suites for any diff into their closures.
    3. THE TWO SUITES. test/baked-supervisor-inputs.test.ts declares `// @census-closure: src/lib/serve-supervisor-main.ts`
       and test/a-busy-primary-reaches-its-image-recycle.test.ts declares `// @census-closure: src/lib/deployer.ts`.
       Their assertions do not change.
    4. EXPLICIT SELECTION BEFORE THE PUSH. scripts/census-precheck.mjs adds three PRECHECK_PATH_TRIGGERED_SUITES rows,
       so the precheck asks them whether or not W1-T9757's reader rows have landed:
       - test/baked-supervisor-inputs.test.ts, seed src/lib/serve-supervisor-main.ts;
       - test/a-busy-primary-reaches-its-image-recycle.test.ts, seed src/lib/deployer.ts;
       - test/acr-build-trigger.test.ts, seed src/lib/serve-supervisor-main.ts.
       Each row's trigger is a `closureImportTrigger(seed)`. It is true when the diff changes the suite, its seed, or
       one of the catalog files (deploy/install-host-units.sh, src/lib/baked-runtime-inputs.ts,
       .github/workflows/acr-build.yml). It is also true when a changed file inside the seed's relative-import
       closure (the union of the head and merge-base closures, walked through `readHead`/`readBase` with
       IMPORT_SPECIFIER_RE, `.js` read as `.ts`) imports a specifier set at head that differs from its merge base.
       An added import and a removed one both count, since both move the closure. The text walk may over-include a
       type-only import. A wider join costs one suite run, and a narrower one costs a CI round.
       The rows are `modeled: evaluateAdmittedCensusSuites` in PRECHECK_PARITY through the existing spread.
    5. THE REFUSAL NAMES THE LISTS. Each row's `remedy` names, in this build, every list its census holds:
       - the supervisor row: "catalog each module the closure gains or loses in BAKED_RUNTIME_SOURCE_PATHS
         (src/lib/baked-runtime-inputs.ts) and in .github/workflows/acr-build.yml's on.push.paths and drift loop";
       - the deployer row: DEPLOY_LOGIC_PATHS (deploy/install-host-units.sh);
       - the trigger row: acr-build.yml's on.push.paths and drift loop against BAKED_RUNTIME_SOURCE_PATHS.
       No remedy may end in the `or record ... in <file>` shape. `censusPushRefusal` would read that as an offered
       baseline. When W1-T9757's reader row for the same suite also joins, the explicit row wins the `testFile`
       dedupe, so its remedy is the one printed.
    6. Nothing here decides who acts on the refusal or widens a fix round's scope. That is W1-T9851's job.
       requestScopeAmendment and INSTRUMENT_SURFACE are not touched.
    7. Tests (new file, `test(` titles verbatim as in the proofs below):
       - a fixture tree where seed a.ts imports b.ts and b.ts imports c.ts, plus a suite declaring
         `@census-closure: a.ts`: the reader walks a.ts, b.ts and c.ts, and `readerJoins` is true for a diff to c.ts;
       - on the real tree, the readers for the two suites in step 3 join `src/lib/ledger.ts` (the #12289 diff);
       - a type-only import does not extend the reader closure, and a missing seed leaves the suite unplaced;
       - `evaluateAdmittedCensusSuites` over #12289's shape (src/lib/ledger.ts at head importing a new
         ./host-identity.js its base did not) joins all three rows, with `runSuites` faked;
       - with `runSuites` reporting test/baked-supervisor-inputs.test.ts failing, the violation row names
         BAKED_RUNTIME_SOURCE_PATHS, src/lib/baked-runtime-inputs.ts and .github/workflows/acr-build.yml, and
         `censusPushRefusal` (src/run-task.ts) reads no offered baseline from it;
       - an import added to a src/lib file outside both closures joins none of the three rows (negative control).
       The new suite drives `evaluateAdmittedCensusSuites`. Give it a PRECHECK_PARITY row,
       `{ modeled: evaluateAdmittedCensusSuites }`, beside W1-T9757's.
