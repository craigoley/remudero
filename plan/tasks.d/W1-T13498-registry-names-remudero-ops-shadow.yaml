- id: W1-T13498
  title: "The fleet registry names remudero-ops as a shadow instance, and the suites that pin the live topology count it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # adds a registry row every registry reader sees; a shadow row never arms or merges (W1-T4265)
  band_meaning: span
  origin: "human#2026-11-17-onboard-remudero-ops"
  plan_refs:
    - W1-T4265
    - W1-T4227
  files:
    - .remudero/daemon-instances.yaml
    - test/one-registry-for-the-fleet.test.ts
