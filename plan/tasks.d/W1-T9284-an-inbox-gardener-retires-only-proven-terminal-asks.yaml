  rationale: |
    The existing Inbox heals release-proven asks and publishes an attention census, but issue #7708 still asks for bounded general revalidation and reversible receipts. The operator approved this separate gardener after the false-dismissal audit, not bulk closure based on age or wording.
  design: |
    Use changed input identity or the existing low-cost gardener cadence. Revalidate against the current source-qualified plan, merged PR trailer/build-branch credit, release receipts, superseding verdicts and open referents. Retire only from a positive terminal or handoff receipt proving the operator is no longer the next actor. Preserve registry/thread history, record the reason and source, and provide an idempotent restore path. Never infer consent, retire by age alone, or treat an unavailable source as terminal. Route mechanical follow-ups through the existing fleet lane. Ask a judge only for residual cases with changed inputs, and expose failure/low confidence through the needs-triage contract. Integrate the audit task before broad adoption; keep held security, budget, tenant, policy and irreversible questions visible.
  implementation_notes: |
    This operator-requested hand build intentionally supersedes W1-T4884 claim/proof text with code.
    It retains human ownership under rule15-filing; the existing build authorization does not record
    an approval, release or merge. Priority, risk, budget and the canonical acceptance/falsifier remain.
    Immutable-key and current source qualification depend on W1-T9288; verified operator admission and
    freshness leaf depend on W1-T9286. The gardener defaults off and needs separate operator activation.
    Only the real open/unmerged proof-debt cadence can stamp new mechanical purpose. Legacy untyped
    human asks remain visible; there is no fabricated purpose backfill. Mechanical purpose binds task
    ownership and criteria, and held security/current unanswered replies take precedence. The public
    16 KiB retirement history is a bounded frozen projection; its counts are separate from the full
    source-qualified dismissal audit denominator. Accepted restoration is journal durable before the
    next completed slow-lane snapshot materializes it. The W1-T4884 record is explicitly superseded
    where it promised verify:auto-alone retirement; maintained release/census proofs now require
    positive exact evidence and preserve unanswered human asks. The assembled-route census includes
    the real registered retirement POST independently of OpenAPI; no route baseline is enlarged.
    Registry, thread, policy and journal reads validate and consume one bounded regular-file descriptor,
    reject symlinks and growth, and close on every outcome. No host or daemon changes are included.
