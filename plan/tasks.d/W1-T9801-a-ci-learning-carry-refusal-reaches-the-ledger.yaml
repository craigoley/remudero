- id: W1-T9801
  title: "A CI-LEARNING LANDING'S CARRY REFUSALS REACH THE LEDGER — W1-T9753 made a ci-learning filing return carryRefused (the shards its landing refused to carry forward because main changed them too), but buildCiLearningCadenceRunner drops it and the daemon's ci_learning_cadence.ran row records only filed, skipped and refused, so a refused carry is invisible to every ledger reader"
  repo: remudero
  depends_on: [W1-T9753]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern, what the ci-learning cadence row records about its landing; no filing decision changes
  band_meaning: blast-radius
  origin: 'W1-T9753 builder report (PR 12271), follow-up (a); coordinator brief batch1016 item 3a'
  plan_refs: [W1-T9753, W1-T3542, W1-T3561, W1-T4115]
  files:
    - src/run-task.ts
    - src/lib/daemon.ts
    - test/a-ci-learning-carry-refusal-reaches-the-ledger.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ at origin/main ec0eb2ce2, which carries W1-T9753 (af07bd799, PR 12271). Symbols, not lines:
    - src/lib/feedback-landing.ts: `CiLearningFilingResult.carryRefused?: FeedbackRefusal[]` ("paths the landing
      refused to carry forward because main changed them too"). The ci-learning filing steps return
      `{ filed, skipped, refused, ...carryRefused }` on both the landed and the not-landed arm.
    - src/run-task.ts buildCiLearningCadenceRunner: after the landing, it keeps only `filing.filed.length`,
      `filing.skipped.length` and `filing.refused.length`. `CiLearningCadenceRunnerResult` has filedCount,
      skippedCount and refusedCount, and no carry field. carryRefused is dropped here.
    - src/lib/daemon.ts: the `ci_learning_cadence.ran` row writes `filed`, `skipped`, `refused` (the LINTER's
      refusals) and nothing about the landing's carry refusals.
    - The feedback landing sweep does record its refusals (`feedback.landing_sweep` carries `refused`, `carried`
      and `inherited_skipped`), so this is the one landing kind whose carry refusals no row names.
    - The manual verb (ciLearningCommand) prints filed, skipped and linter refusals, and not carryRefused either.
    INFERRED: a carry refusal means a ci-learning shard on the landing branch lost to main's copy. Today that is
    invisible unless someone diffs the branch by hand. W1-T9753's builder named this gap in its report.
  design: |
    1. buildCiLearningCadenceRunner carries the landing's carry refusals onto its result: a count, plus the
       refused paths and reasons (FeedbackRefusal as W1-T9753 shaped it).
    2. The daemon's ci_learning_cadence.ran row records them beside `refused`, under a name that cannot be read as
       the linter's refusals (for example `carry_refused` with the count and the paths). A run without carry
       refusals records 0, so a reader can tell "none" from "not measured".
    3. The manual `rmd ci-learning` verb prints each carry refusal by path and reason, as it already does for the
       linter's.
    4. No new constant. If the builder bounds the path list on the row, that bound is an OPERATOR DECISION named in
       the PR.
    Tests go in test/a-ci-learning-carry-refusal-reaches-the-ledger.test.ts, titled verbatim as in the proofs.
  acceptance:
    - claim: "a cadence run whose landing refused to carry a shard returns that refusal on its result"
      proof: 'grep: test("W1-T9801: the cadence runner keeps the landing carry refusals" in test/a-ci-learning-carry-refusal-reaches-the-ledger.test.ts'
    - claim: "the ci_learning_cadence.ran row records the carry refusals apart from the linter refusals, and 0 when there are none"
      proof: 'grep: test("W1-T9801: the cadence ran row records carry refusals" in test/a-ci-learning-carry-refusal-reaches-the-ledger.test.ts'
  falsifier: |
    On origin/main, run buildCiLearningCadenceRunner with a landShards fake that returns one carryRefused entry: the
    result has no carry field, so the first test fails. Drive the daemon's ci-learning cadence with a runner whose
    result carries one carry refusal: the ci_learning_cadence.ran row has no carry field, so the second test fails.
