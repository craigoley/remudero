- id: W1-T13584
  title: "A selected-registry recycle names the worker smoke's verdict code instead of withholding it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # widens one line class through the selected-lifecycle privacy filter; the message and paths stay withheld
  origin: "human#2026-11-17-onboard-remudero-ops"
  plan_refs:
    - W1-T6171
    - W1-T13498
    - W1-T13437
  files:
    - deploy/recycle-container.sh
    - test/recycle-container.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "The selected diagnostic filter turns a WORKER-SMOKE FAIL line into its verdict and error code, and the line's message and path never reach stdout"
      proof: 'grep: test("W1-T13584: the selected filter names the worker smoke verdict and code, never its message" in test/recycle-container.test.ts'
    - claim: "The filter's new arm emits the verdict line through the existing bounded emit"
      proof: "grep: worker smoke verdict: in deploy/recycle-container.sh"
    - claim: "invariant:selected-filter-withholds-detail — a WORKER-SMOKE line without a code-shaped token, and every line class the filter handled before, keep their current withheld output"
      proof: 'grep: test("W1-T13584: a worker smoke line without a code token stays withheld" in test/recycle-container.test.ts'
  rationale: |
    WHY: onboarding remudero-ops (W1-T13498, 2026-11-18 01:55Z) ran `deploy/recycle-container.sh --instance ops
    --first-boot` with RMD_SELECTED_INSTANCE_REGISTRY set. It refused in run_worker_smoke ("the real worker smoke
    FAILED (exit 1)"), and the operator saw only 29 lines of "selected lifecycle diagnostic (private details
    withheld)". The cause was found only by re-running the smoke by hand (host RECON 2026-11-18 ~02:05Z, OBSERVED):
      WORKER-SMOKE FAIL ENOENT: no such file or directory, open '/home/node/Remudero/daemon-install/settings/worker.json'
    selected_registry_diagnostic_filter (deploy/recycle-container.sh) rewrites every line containing REFUSING or
    FAILED, and every other non-empty line, to a withheld placeholder. That is right for the message and paths. The
    verdict word and the error code (PASS|FAIL plus a token such as ENOENT) carry no host detail, and they are the
    one thing that tells the operator which class of failure to look for. A non-selected recycle already prints the
    whole bounded tail (W1-T6171), so the code is not a new disclosure class on this host.
    Overlap: W1-T13437 (spawn helper on by default) also lists deploy/recycle-container.sh and its suite, for the
    RMD_SPAWN_HELPER deploy list. This task touches only selected_registry_diagnostic_filter, a different function.
    Out of scope (separate concern): first boot does not provision <state_dir>/daemon-install or seed the ledger.
  design: |
    In selected_registry_diagnostic_filter's `line` function, before the REFUSING/FAILED arm, match a line whose
    text (after optional leading whitespace and an optional "smoke-output| " prefix) is
    `WORKER-SMOKE (PASS|FAIL) <code>` where <code> is ^[A-Z][A-Z0-9_]{1,39}$ followed by ":" or a space or end of
    line. Emit `<caller>: worker smoke verdict: <PASS|FAIL> <code>` through the same bounded `emit`. Anything else,
    including a WORKER-SMOKE line whose next token is not code-shaped, falls through to the existing arms unchanged.
    The test's title carries the task id, so the id sits on a code line, not only a comment.
    INVARIANT selected-filter-withholds-detail: every line the filter does not match today keeps its current output
    bucket (registry reason, remedy, refusal/failure placeholder, dry-run note, diagnostic placeholder, oversized
    placeholder), the 64-line emit cap and the completion-frame exit codes are unchanged, and no message text, path
    or value after the code token ever reaches stdout.
  falsifier: |
    Delete the new arm: the first unit test fails (no "worker smoke verdict: FAIL ENOENT" line), and the second
    still passes. Feed the filter a line with a path after the code: the test asserts the path never appears in
    stdout.
