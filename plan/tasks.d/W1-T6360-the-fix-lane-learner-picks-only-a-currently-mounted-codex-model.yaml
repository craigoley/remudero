- id: W1-T6360
  title: "THE FIX-LANE LEARNER PICKS ONLY A CURRENTLY MOUNTED CODEX MODEL — applyFixLearner (src/lib/worker.ts) re-reads Codex for any historical arm whose draw wins, so the fix lane is routed back to gpt-6-sol after the 2026-10-02 Sol 6.1 switch (8 fix.routing_decision rows selected gpt-6-sol on 2026-10-08; W1-T6334's fix.done 09:29Z routed gpt-6-sol)"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high  # Rule 19: one concern — learner arms are limited to the models the current mounts row offers
  band_meaning: span
  origin: "operator session 2026-10-08: Sol 6.1 adoption audit (operator: 'we should add Sol 6.1 everywhere')"
  plan_refs: [W1-T6028]
  files: [src/lib/worker.ts, src/lib/fix-routing-learner.ts, test/the-fix-lane-learner-picks-only-a-currently-mounted-codex-model.test.ts]
  status: merged
  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-08 (core ledger, ~09:17-11:18Z): routed_model gpt-6.1-sol 152, gpt-6-sol 4 — all 4 fix-lane;
    selected_model gpt-6-sol 8 vs gpt-6.1-sol 4 in fix.routing_decision. READ on origin/main: applyFixLearner
    (worker.ts) + fixRoutingWeights (fix-routing-learner.ts) score every historical selected_model and re-route to
    the winner even when the current mounts row no longer offers it. W1-T6028 measured gpt-6-sol at 0.53 vs 0.39
    for 6.1 on this lane, so the learner prefers 6.0 on purpose; the operator ruled 2026-10-08 to use Sol 6.1
    everywhere, which this enforces. The learner keeps learning among the mounted models.
  design: |
    Filter the learner's candidate arms to models present in the lane's current capability row (the mounts'
    order for that provider/tier/effort); a historical arm outside it is ignored rather than re-read. Keep its
    evidence in the ledger so a future re-mount can re-enable it. If the filter leaves one arm, route it without a
    draw.
  acceptance:
    - claim: "an unmounted historical arm (gpt-6-sol) is never selected even when its weight is highest"
      proof: 'grep: test("W1-T6360: an unmounted arm is never selected" in test/the-fix-lane-learner-picks-only-a-currently-mounted-codex-model.test.ts'
    - claim: "among mounted arms the learner still prefers the higher-weighted one"
      proof: 'grep: test("W1-T6360: the learner still ranks mounted arms" in test/the-fix-lane-learner-picks-only-a-currently-mounted-codex-model.test.ts'
  falsifier: |
    Keep the unfiltered arms: with gpt-6-sol weighted 0.53 and 6.1 at 0.39 the learner selects gpt-6-sol and the
    first test fails.
