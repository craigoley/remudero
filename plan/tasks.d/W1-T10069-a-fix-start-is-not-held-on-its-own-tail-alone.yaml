  design: |
    Operator rulings honoured: no hard threshold, no raise of core memory.max, the 2,048 MiB host reserve unchanged.
    1. A SHORTFALL THAT IS THE START'S OWN TAIL. In `awaitMemoryAdmission`, a shortfall where the verdict's hostTail is
       owned by the start, every other claim is charged at most its decayed share (no other start is inside its own
       time-to-peak), and MemAvailable less the daemons' typical growth less the start's TYPICAL claim still clears the
       host reserve, admits the start on a named tier `own-tail`.
    2. ONE AT A TIME. At most one `own-tail` start may be inside its time-to-peak at once (as `agedRunning` guards the
       aged rung); a second waits for fits as today, and the first is charged its full learned estimate once admitted,
       so the next admission sees the real charge (W1-T9679's rule).
    3. THE HARD STOPS STAY. memory-available, container-ceiling with containerSighted, and psi still refuse.
    4. `memory_budget.enforce_admit` rows on this tier carry the start's typical and tail and the other claims' total,
       so the next re-measure can tell a starving bound from a full host.
    5. TESTS in test/a-fix-start-is-not-held-on-its-own-tail-alone.test.ts, `test(` titles verbatim as in the proofs,
       driving `awaitMemoryAdmission` with fake ports: the 16:55Z shape (MemAvailable 4,028, start 3,788/1,169, others
       charged 0, psi clear) admits on own-tail; a second start while the first is inside its time-to-peak waits
       (control); the same shape with memory-available or psi refuses.
