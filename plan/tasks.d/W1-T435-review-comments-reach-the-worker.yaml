- id: W1-T435
  title: "a human comment on a run PR reaches NOTHING automated — the review floor reads the body, the fix rung reads the ledger, and the operator's words on the diff itself evaporate: make unresolved human PR comments a first-class fix-rung evidence source, and wire the producer W1-T78's re-arm has been waiting for"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 85
  rationale: "FILED FROM the operator's Warp-podcast brief (oper#warp-podcast-2026-08-11),
    evidence re-derived at afb12dd. THE GAP, MEASURED FROM SOURCE: no comment-GET exists
    anywhere in src/ — the `remudero-review` keyword floor reads the PR BODY only (the #974
    lesson), the fix rung's evidence set (`runFixRung`, src/run-task.ts) is ledger unmet
    criteria, CI log tails and merge conflicts, and `pendingAnswer` (the W1-T78 answered-
    clarification re-arm with `strikeCapForAnswer`) is mechanism-complete with NO PRODUCER —
    its own scope doc says nothing populates it in the real gateway. So the one place a human
    naturally steers agent work — commenting on the diff — is the one channel the harness
    cannot hear; steering works only through side channels (reframe, operator notes, question
    answers). THE PRACTICE THIS ADOPTS, source-verified in Warp's own open repo and docs
    (github.com/warpdotdev/warp CONTRIBUTING.md; docs.warp.dev interactive-code-review;
    Turing Post interview, VERBATIM: 'you'll have an easy way of commenting on those diffs
    and adjusting the agent as it goes along'): inline human comments on an agent diff are
    batched and the agent resolves them in one pass — comment-to-agent is the primary
    steering loop, with the human as reviewer. THE RMD-NATIVE DIVERGENCE: comments do not
    bypass the gates — they become EVIDENCE the fix rung consumes under its existing strike
    discipline, so a comment steers exactly as a failed criterion does, with the same caps,
    the same re-review, and the same escalation on exhaustion. The operator has been building
    toward precisely this: W1-T78 shipped the re-arm allowance, W1-T164 shipped pre-run
    notes; the missing piece is the producer that reads the PR. LEDGER: UNMEASURED (mini
    down); the no-comment-reader claim is source-derived at afb12dd."
  design: |
    (i) humanCommentEvidence (src/lib/sweep.ts): given a PR's comment threads (injected
    reader seam; default shells gh), return the unresolved HUMAN comments — bot/self
    comments excluded by author identity, resolved threads excluded — normalized to
    {author, path, excerpt, url}. Pure over supplied data; the gh leaf is the injectable
    default per the #978 discipline. The name is load-bearing — the call-site criterion
    greps it at its consumer.
    (ii) the fix rung consumes it: `runFixRung`'s evidence assembly (src/run-task.ts) gains
    the comment docket as a fourth evidence source, quoted verbatim in the fix prompt with
    attribution — the worker addresses the comments the way it addresses unmet criteria,
    inside the SAME strike cap, fresh re-review after, escalation on exhaustion unchanged.
    (iii) the same reader is `pendingAnswer`'s producer: sweep's PR view populates the
    W1-T78 seam from answered clarification threads, so the merged re-arm mechanism finally
    fires — one reader, two consumers, no second gh surface.
    (iv) a comment round-trip is ledgered (fix.comment_evidence: pr, count, authors) so the
    W1-T436 docket and the retro can see how often human words on the diff steered a run.
    (v) FALSIFIER, both directions: a fixture PR with one unresolved human comment re-arms
    the fix rung and the fix prompt quotes the comment verbatim (deleting the producer fails
    this), AND a PR whose only comments are the harness's own review comment and resolved
    threads produces an EMPTY docket and no re-arm — the self-echo containment (a rung that
    re-arms on its own review comment would loop forever; this direction is the loop guard).
    (vi) NOT IN SCOPE: mid-run steering of a live worker (no such verb exists; this steers
    between strikes); inline-position fidelity (excerpt+path suffice for v0); any change to
    strike caps or the review floor; Slack/issue comments (PR comments only).
  acceptance:
    - claim: "an unresolved human comment on a run PR re-arms the fix rung with the comment quoted in the evidence, while the harness's own comments and resolved threads produce no re-arm"
      proof: "unit test: test/review-comment-steering.test.ts"
    - claim: "the comment reader is one named source consumed at the fix rung, not a second ad-hoc gh surface"
      proof: "grep: humanCommentEvidence( in src/run-task.ts"
  risk: high
  origin: oper#warp-podcast-2026-08-11
  plan_refs: ["W1-T78", "W1-T164", "W1-T141"]
  files: [src/run-task.ts, src/lib/sweep.ts, test/review-comment-steering.test.ts]
  status: queued
  attempts: 0
  note: "verify:auto — the reader is seam-injected and both falsifier directions are
    fixture-decidable offline. risk:high — the files: span (sweep reader, run-task fix-rung
    wiring, their test) is Rule 19's SPAN, not blast radius; the behavioral containment is
    falsifier direction two, the self-echo loop guard. Rule 25: touches src/run-task.ts
    (instrument-adjacent) with nothing else entangled. budget_usd 85 — the reader seam, two
    consumers (fix evidence + pendingAnswer producer), the ledger line, two-direction
    fixtures. PROOF NOTES: `humanCommentEvidence` is 0 hits across src/ AND plan/ at afb12dd
    (measured, case-sensitive) so the grep discriminates and names no existing symbol; the
    open-paren form greps the CONSUMER (src/run-task.ts), distinct from the defining module,
    per the call-site lint; the unit-test proof is the pure-path form against a file declared
    in files:. LEDGER: UNMEASURED (mini down). NO depends_on: the fix rung, sweep PR view and
    W1-T78's re-arm allowance are all on main at afb12dd."
