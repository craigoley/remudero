  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-24 over the 150 most recent merged PRs: median open-to-merge 37 min (p75 82, p90 131). 77% of all PR time is spent before the final head's CI starts (repair and re-push rounds), 16% in that final CI, 7% waiting for review, ~0% waiting to merge. Only 62 of 150 merged on their first head. Runner queueing is not a factor (job start p50 3 s, p90 41 s).
    OBSERVED: remudero-fleet[bot] merges a `chore(plan): regenerate plan/plan-index.json` PR after most plan merges
    (#6930, #6902, #6895, #6884, #6865 in two days); plan-index.json is changed by 7 of 150 merged PRs, 2 of them PRs that had
    main merged in.
    REPLAN REQUIRED BY THE OPERATOR AFTER PR #7172 CLOSED: the first `files:` list omitted the writers, readers' registries,
    console artifact, and regression guards, so its implementation could not safely retire the committed index. The full
    production surface is the Architect commit flow (`applyPlanProposalCommit`), plan/retro/approve in `run-task.ts`, the
    capability snapshot generator, both plan-index npm scripts, the two CI prechecks, the panel-graph console reader, and
    the `review.ts` / `sweep.ts` path registries. The old guards in `test/plan-index.test.ts`, capability-snapshot,
    architect, emitter, inbox-approve, retro, run-task, and path-classification suites must be retargeted to the new source
    or retired when they assert that generated JSON is committed or a removed writer is called. Unrelated parsing and
    runtime behavior remains covered. `scripts/generate-plan-index.mjs` already exports the canonical `parsePlanIndex`;
    the read-time implementation will call that parser rather than reimplement its heading/summary rules. `plan_refs`
    records the pre-existing W1 tasks sharing `src/lib/review.ts`, `src/lib/sweep.ts`, or `src/run-task.ts`; this change
    retires their obsolete generated-index handling while preserving their independent review, dispatch, and task rules.
  design: |
    (i) The worker prompt and panel-graph console reader derive the compact index from `MASTER-PLAN.md` at read time,
    cache by source content hash, and reuse `parsePlanIndex` exported from `scripts/generate-plan-index.mjs`. Preserve the
    current entry shape, source line numbers, ordering, summaries, and missing-source behavior. (ii) Retire
    `regeneratePlanIndexFile` / `regeneratePlanIndexAndCommit` only after removing their Architect, plan, retro, and approve
    callers. The capability-snapshot flow stops writing the index; remove `plan-index` / `plan-index:check` package
    scripts and the corresponding unwired/pre-push path registrations. (iii) The console still needs a file-shaped
    artifact: CI generates `plan/plan-index.json` with the canonical generator and uploads it for the console consumer;
    it is a build artifact and never a committed/runtime source of truth. (iv) Remove the obsolete generated-file entries
    from `review.ts` and `sweep.ts`, delete the committed JSON in the same PR, and replace only tests whose assertions
    require the committed file or retired call sites.
  acceptance:
    - claim: "runtime readers derive and cache the index from MASTER-PLAN.md using the generator's parser"
      proof: 'grep: test("W1-T4432: readers derive and cache the plan index from MASTER-PLAN\.md with the shared parser" in test/the-plan-index-is-derived-not-committed.test.ts'
    - claim: "Architect, plan, retro, approve, and capability-snapshot flows no longer write a committed plan index"
      proof: 'grep: test("W1-T4432: plan commit flows and capability snapshot do not write a committed plan index" in test/the-plan-index-is-derived-not-committed.test.ts'
    - claim: "CI provides the console with a generated plan-index artifact, without committing the file"
      proof: 'grep: test("W1-T4432: the console receives a generated plan-index artifact from CI" in test/the-plan-index-is-derived-not-committed.test.ts'
    - claim: "path registries and pre-push gates no longer require a committed plan-index file"
      proof: 'grep: test("W1-T4432: no plan-index path registry or gate requires a committed index" in test/the-plan-index-is-derived-not-committed.test.ts'
  falsifier: |
    Keep the committed file or any regeneration writer if a worker or console reader loses headings/line numbers when the
    file is absent, the CI artifact differs from the canonical generator, or Architect/plan/retro/approve can still stage
    the index. The tests must delete the file and run each real reader, and must falsify at least one removed writer when
    its guard is temporarily restored.
