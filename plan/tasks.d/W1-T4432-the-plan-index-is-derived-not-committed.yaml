- id: W1-T4432
  title: "plan/plan-index.json IS REGENERATED BY A BOT PR AFTER NEARLY EVERY PLAN MERGE AND CONFLICTS WITH PLAN PRS IN FLIGHT — a derived file committed to main is a merge surface; derive it where it is read (or build it in CI) so no pull request carries it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 25.00
  risk: high
  band_meaning: span
  origin: "operator ask 2026-09-24: get PRs through the process quicker — automated flow and self-improvement; research over the 150 most recent merged PRs"
  plan_refs: []
  files: [src/lib/plan-index.ts, src/lib/plan-pr-emitter.ts, test/the-plan-index-is-derived-not-committed.test.ts]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-24 over the 150 most recent merged PRs: median open-to-merge 37 min (p75 82, p90 131). 77% of all PR time is spent before the final head's CI starts (repair and re-push rounds), 16% in that final CI, 7% waiting for review, ~0% waiting to merge. Only 62 of 150 merged on their first head. Runner queueing is not a factor (job start p50 3 s, p90 41 s).
    OBSERVED: remudero-fleet[bot] merges a `chore(plan): regenerate plan/plan-index.json` PR after most plan merges
    (#6930, #6902, #6895, #6884, #6865 in two days); plan-index.json is changed by 7 of 150 merged PRs, 2 of them PRs that had
    main merged in.
  design: |
    (i) Readers build the index from plan/ at read time (cached by the plan tree hash) instead of reading a committed
    file. (ii) The regenerate-PR emitter is retired. (iii) If any consumer needs a file (the console), CI builds it as an
    artifact rather than a commit. (iv) plan-index.json is deleted from the tree in the same PR.
  acceptance:
    - claim: "the plan index is built from plan/ at read time"
      proof: 'grep: test("W1-T4432: the plan index is built from plan/ at read time" in test/the-plan-index-is-derived-not-committed.test.ts'
    - claim: "no pull request regenerates the plan index"
      proof: 'grep: test("W1-T4432: no pull request regenerates the plan index" in test/the-plan-index-is-derived-not-committed.test.ts'
  falsifier: |
    Keep the committed file and the first test finds a reader that fails when plan-index.json is absent.
