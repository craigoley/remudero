    PLATFORM FACT, CHECKED FOR THIS FILING RATHER THAN ASSUMED: `gh pr create --fill` uses the
    commit information for title and body — the first/only commit's subject and body for a
    single-commit branch, and the BRANCH NAME as title with the list of commit titles as body for
    a multi-commit one — and an explicit `--title` overrides the derived title. That is what
    makes design (iii) a faithful local reproduction rather than an invention, and design (iv)'s
    note that the lost branch-name fallback is a gain rather than a regression.

    WHAT THIS TASK IS WORTH, STATED HONESTLY: it does not stop GraphQL exhaustion and reduces
    nobody else's burn. It moves the fleet's LAST push-boundary write off the bucket that hits
    zero and onto the one that was 97% free during the measured incident, so an exhaustion
    somebody else caused stops costing a completed run.
