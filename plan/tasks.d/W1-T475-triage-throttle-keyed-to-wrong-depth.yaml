  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/lib/daemon.ts` and
    `src/lib/auto-triage.ts` plus their suites; `sizingViolation` (`src/lib/task-linter.ts`) refuses
    `medium` at two subsystems. `verify: human` — design (ii) offers two incompatible directions and
    this shard picks neither.
    HOW THIS DIFFERS FROM W1-T469 (#1759), WHICH IT MUST NOT BE READ AS. W1-T469 files the
    INVISIBILITY: the rung sits inside the idle branch, so `if (!i.idle)` is unreachable and a busy
    tick LOGS NOTHING. THIS SHARD IS ABOUT THE GATE'S PREDICATE AND THE THROTTLE'S INPUT — that the
    predicate fires with lanes full, and that the cadence is keyed to a number uncorrelated with
    capacity. W1-T469 could be fixed in full and both defects here would remain.
    `files:` IS DELIBERATELY TIGHT, BECAUSE `partitionByFileOverlap` BLOCKS ON DECLARED PATHS and
    every extra entry serialises this task against others naming it. Derived BY INVOCATION COUNT at
    556ef229: `test/auto-triage-rung.test.ts` 11 invocations / 12 mentions, and
    `test/auto-triage-policy-seam.test.ts` 5 / 6 (the curve-and-policy seam, which is the shape a
    corrected input changes). EXCLUDED with counts so the choice is auditable:
    `test/auto-triage-daily-cap.test.ts` (2 invocations, asserts the cap not the curve),
    `test/auto-triage-wiring.test.ts` (0) and `test/ops-alert-cadence.test.ts` (0). POSITIVE CONTROL:
    12 test files mention `autoTriage`/`auto-triage` at all, so the shortlist is a filter and not an
    empty query. THIS SHARD'S OWN PATH IS ABSENT FROM `files:` DELIBERATELY.
    ADJACENT MEASUREMENT, RECORDED SO IT IS NOT RE-RUN, AND NOT ABSORBED: triage-minted work is MORE
    SPREAD than the dispatchable head but MORE COLLISION-PRONE than the plan average — all tasks 42%
    declare `src/run-task.ts` / 54% any hot file; feedback-origin 54% / 56%; triage-minted-and-
    surviving 53% / 63%; against the current dispatchable head's ~80%. ROUGHLY ONE TRIAGE IN TWO
    YIELDS WORK THAT COULD FILL A FREE LANE — partial relief, not decisive. That bears on whether
    loosening the gate helps, and belongs to the operator's ruling, not to this defect.
    AND THE HAZARD FOUND ALONGSIDE, MEASURED RATHER THAN ASSERTED. `overlappingPaths`
    (`src/lib/dispatch-overlap.ts`) has THREE arms, not one: both-empty returns `[\"*\"]`, and a
    SINGLE empty side returns THE OTHER SIDE'S ENTIRE LIST — so **A TASK WITH AN EMPTY `files:` LIST
    OVERLAPS EVERY OTHER CANDIDATE**, exactly as the module's own `FAIL-CLOSED ON UNDECLARED SCOPE`
    doc says. VERIFIED EMPIRICALLY against the real partitioner: `empty + declared` admits 1 and
    defers 1, while `declared + disjoint` admits 2. POPULATION: 80 of 499 tasks declare an empty or
    absent `files:`, but only 10 are UNMERGED, only 1 is triage-minted (W1-T286), and only TWO are
    unmerged AND `verify: auto` so as to reach the partitioner at all — W3-T3 (`status: blocked`, so
    never a candidate) and **W1-T49 (`queued`, `auto`) — the single live exposure today.** The general
    hazard is real; the current blast radius is one task.
    PROVENANCE. Everything above is a TREE FACT at 556ef229 — `plan/policy.yaml`, `daemon.ts`,
    `drain.ts`, `auto-triage.ts`, `dispatch-overlap.ts`, `sweep.ts` and the plan tree — and is
    host-independent. The $1.07 triage mean is THE MINI's ledger and is not a claim about the Azure
    fleet; the two hosts keep separate ledgers with no SSH route between them."
