  # plan gardener: retire W1-T4111 — Every acceptance proof already holds on main.
  attempts: 0
  rationale: |
    READ 2026-09-23: plan/tasks.d holds 1,537 merged, 221 queued and 103 blocked shards (92 of the blocked already carry
    `retirement:`). Filing-time dedup (`bestNearDuplicate`, knowledge-dedup.ts) stops a new duplicate but nothing merges
    ones already filed; plan.ts states retirement is operator-only and never auto-written; no filer learns that its
    tasks never ship.
  design: |
    (i) Classes: MERGE — a queued task that near-duplicates an older queued one gets `superseded_by` (text surgery, same
        shape as plan-reconcile); REPRIORITIZE — `priority:` follows dispatch-value evidence (dispatch-value.ts); RETIRE —
        a stale queued task whose referent is gone is PROPOSED for retirement with `review: "operator"` (W1-T4110), so
        the PR is never auto-merged and a person makes the call, as doctrine requires.
    (ii) Metrics per class: MERGE — a merged-away task not re-filed within the window; REPRIORITIZE — share of raised
         tasks that dispatch and merge; RETIRE — the operator's merge rate on the proposals.
    (iii) Emits through plan-pr-emitter.ts so every PR passes the plan-PR gates.
  acceptance:
