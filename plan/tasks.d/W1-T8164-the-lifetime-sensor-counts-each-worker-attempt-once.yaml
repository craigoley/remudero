      proof: 'grep: test("W1-T8164: an archived yield or refusal is not a lifetime attempt" in test/the-lifetime-sensor-counts-each-worker-attempt-once.test.ts'
    - claim: "one live worker attempt counts once, so a single live attempt reports no pressure"
      proof: 'grep: test("W1-T8164: a live start is counted once, not twice" in test/the-lifetime-sensor-counts-each-worker-attempt-once.test.ts'
    - claim: "W1-T7837's three 2026-10-11 runs (one restart_checkpoint_failed, two handed_off) report no lifetime pressure"
      proof: 'grep: test("W1-T8164: the W1-T7837 runs report no lifetime pressure" in test/the-lifetime-sensor-counts-each-worker-attempt-once.test.ts'
  falsifier: |
    Keep `lifetimeInfrastructureRefusal` in `taskAttributableLifetimeDispatches`: the restart_checkpoint_failed run
    is charged and the first and fourth tests fail. Keep the archive projection blind to verdicts: the archived yield
    is charged and the second test fails. Keep adding `attributableLive` to a `tallyFor` that already holds the live
    overlay: one live start counts 2, `> 1` reports pressure, and the third test fails.
