  note: "`verify: human` ON PURPOSE. Design (a)-(d) is a RULING, not a decidable criterion: each option
    trades a different kind of honesty for a different kind of blindness, and no linter can settle
    which loss the operator prefers. `isDispatchEligible` parks it until that ruling exists, which is
    the correct behaviour for this shard rather than a defect in it.

    `risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    `>=2 subsystems while risk<high`, and `files:` spans `src/lib/` and `test/`. The band is Rule 19's
    SPAN, not blast radius -- three of the four options are a handful of lines.

    `files:` IS DERIVED BY INVOCATION COUNT, counting OCCURRENCES rather than lines, and spans the
    UNION of the four options because the shard deliberately picks none. `src/lib/daemon-health.ts`
    holds `deriveLastPoll`; `src/lib/daemon.ts` holds `startInFlightTicker` and is where an
    unconditional tick row would go. On the test side: `test/daemon-health.test.ts` invokes
    `deriveLastPoll(` 3 times (the most of any file), `test/daemon.test.ts` mentions
    `startInFlightTicker` 6 times (the most), and `test/daemon-alive-liveness.test.ts` is the only
    file touching BOTH symbols, which is why all three are declared rather than the top one only.
    `src/run-task.ts` IS DELIBERATELY NOT DECLARED: `review.reviewer` is emitted there, but no option
    requires editing it, and at 19,588 lines every task declaring it serialises against every other
    that does (W1-T471). `src/lib/sweep.ts` is likewise not declared -- option (a) would widen a
    ticker defined in `daemon.ts`, not edit the sweep. If an implementer finds either genuinely
    required, that is a `files:` amendment, not a silent widening.
    The shard's own path is NOT declared: adding it converts the endemic proof-scope warnings into one
    hard `rule15-filing` violation."
