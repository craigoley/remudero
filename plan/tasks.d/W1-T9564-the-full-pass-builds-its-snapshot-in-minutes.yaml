  design: |
    1. Time every stage first. One `sweep.full_prelude` row per full pass names each stage's `elapsed_ms`: the tick read
       (with `source: served|own_read`), escalation-triage evidence, main health, escalation answers, post-fix
       reverification, stale-gate workflows, behind-main, merge probes, credit candidates, and `runSweep`'s preamble up to
       `sweep.pass`. Deploy it and read it before choosing the cut.
    2. Cut the largest measured stages, in this order of preference:
       (a) run the independent stages concurrently: the own read beside triage evidence, main health and escalation
           answers;
       (b) read per-PR facts in parallel under the existing `GhCallPacer`, never past it;
       (c) incremental snapshot: re-read only PRs whose `updated_at` or head moved since the last full pass, and reuse the
           warm board gateway's rows and the light pass's fresh per-PR observations for the rest. Never serve a whole
           generation older than `TICK_READ_MAX_AGE_MS` (W1-T5761/W1-T5762), which disposed merged PRs.
       No new fixed bound: any wait added here is learned from the stage timers.
    3. Date ages by the clock at the act. `pendingAgeMinutes` and every age `runSweep` derives for a PR re-read in the
       pass use the pass clock at that PR's disposition (`passClockMs`), or the re-read's own time, never the pass-entry
       `now`. A pending age can never be negative.
    4. Acceptance reads the effect. After deploy, the median full pass's start-to-`sweep.pass` span is a small fraction of
       today's 20.8-23.1 min, and no `sweep.disposed` row reads a negative pending age.
