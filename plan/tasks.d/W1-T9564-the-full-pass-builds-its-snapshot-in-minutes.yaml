  falsifier: |
    Give `runSweep` a PR whose head moved under the pass, injected so the re-read reports `checksPendingSince` 15 min after
    the pass-entry `now`, and advance the pass clock 16 min before its disposition. At origin/main the row reads
    `checks pending -15m`. With the change it reads `checks pending 1m`. A full pass whose prelude stages each take a
    fixed injected time writes no `sweep.full_prelude` at origin/main and one row naming every stage with the change.
