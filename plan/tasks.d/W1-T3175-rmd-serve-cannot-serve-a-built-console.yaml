- id: W1-T3175
  title: "`rmd serve` CANNOT SERVE A BUILT CONSOLE — it emits `application/json` and `text/html` and nothing else, so there is no route that could return the JS, CSS, font or map files a bundled SPA is made of"
  repo: remudero
  depends_on: [W1-T3173]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 25.00
  files: [src/lib/serve.ts, test/the-console-serves-its-own-assets.test.ts]
  origin: "operator-session#console-architecture-2026-09-08"
  plan_refs: ["W1-T3173", "W1-T3176", "W1-T139"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-09-08. The complete set of content types `src/lib/serve.ts` ever sets, by
    `grep -oE '"content-type"[^,)]*' src/lib/serve.ts | sort -u`:
      "content-type": "application/json" }
      "content-type": "application/json" };
      "content-type": "application/json; charset=utf-8" }
      "content-type": "text/html; charset=utf-8" }
    FOUR, of TWO kinds. No `text/javascript`, no `text/css`, no `font/woff2`, no `image/*`, no
    `application/json` source map served as one. A bundled SPA is precisely a set of those files.

    CORRECTION RECORDED, because the author of this shard said otherwise earlier the same day: an
    earlier claim that "serve.ts sets only application/json content types" was WRONG — it also
    serves `text/html` for the shell. The HTML precedent exists; the ASSET route is what does not.
    The distinction matters: this is a new route on an existing HTML-serving surface, not a new
    capability class.

    WHY THIS IS NOT A DETAIL. `apps/dashboard/index.html`'s own header has said since #294 that
    "Wiring the daemon to actually SERVE this directory as static files over Tailscale ... is
    explicit follow-on work". That follow-on has never been done, which is why `apps/dashboard`
    exists as a real npm workspace that NOTHING SERVES — `src/lib/serve.ts:559` says so outright:
    "NOT apps/dashboard's full SPA — that page's own header already documents why it stays a
    separate, later-wired artifact." W1-T3173's rebuild is blocked at the first step without this.

    A STATIC FILE ROUTE IS A CLASSIC SOURCE OF PATH TRAVERSAL and this repo serves over a tailnet
    with a bearer-token model, so the traversal question is not academic.
  design: |
    (i) SERVE FROM ONE RESOLVED ROOT, AND REFUSE ANYTHING THAT ESCAPES IT. Every request path
    resolves against the build directory and the RESOLVED result must remain inside it; `..`,
    absolute paths, URL-encoded separators and symlinks that leave the root are all refused. THE
    REFUSAL IS THE POINT and it needs literal both-arm fixtures, not a comment claiming safety.
    (ii) CONTENT TYPE FROM A CLOSED ALLOW-LIST, never from the extension by string concatenation. An
    unknown extension is refused rather than served as `application/octet-stream`: a console build
    emits a known, small set of file kinds and anything else in that directory is a surprise.
    (iii) THE SPA FALLBACK IS EXPLICIT, NOT A CATCH-ALL. A client-routed path must return the
    shell's `index.html`, but a MISSING ASSET must 404 — a fallback that returns HTML for a missing
    `.js` turns a deploy error into a blank page with a syntax error in the console, which is
    exactly the failure W1-T3176 exists to make loud.
    (iv) THE AUTH MODEL IS THE ONE THE CONSOLE ALREADY HAS, unchanged: a read token loads the board,
    and `GET /v1/console/write-grant` upgrades a tab to write. This route MUST NOT invent a second
    credential path, and must not serve assets to an unauthenticated caller if the shell is not
    served to one either.
  acceptance:
    - claim: "a built asset under the console root is served with a content type from the closed allow-list"
      proof: "unit test: test/the-console-serves-its-own-assets.test.ts"
    - claim: "a path that RESOLVES outside the console root is refused — ..%2f, a bare .., an absolute path and a symlink out are each refused, and a legitimate nested asset is still served"
      proof: "unit test: test/the-console-serves-its-own-assets.test.ts"
    - claim: "an unknown extension inside the root is refused rather than served as octet-stream"
      proof: "unit test: test/the-console-serves-its-own-assets.test.ts"
    - claim: "a client-routed path returns the shell, and a MISSING asset returns 404 — the fallback never masks an absent build artifact"
      proof: "unit test: test/the-console-serves-its-own-assets.test.ts"
    - claim: "the route requires the same read scope the shell requires — no asset is readable by a caller who could not load the console"
      proof: "unit test: test/the-console-serves-its-own-assets.test.ts"
  falsifier: |
    CLOSE IF a static-asset route already exists:
      `grep -oE '"content-type"[^,)]*' src/lib/serve.ts | sort -u`
    MEASURED 2026-09-08: four entries, only `application/json` and `text/html`.
    POSITIVE CONTROL: the same grep must FIND the `text/html` shell entry — if it returns nothing,
    the extraction is broken rather than the route absent. MEASURED 2026-09-08: it finds it.
    PROVE THE TRAVERSAL REFUSAL LOAD-BEARING: the escaping fixtures must be REFUSED while a
    legitimately nested asset in the same test is SERVED. A suite where every path 404s proves the
    route is broken, not that it is safe.
    DO NOT satisfy this with a catch-all that returns index.html for anything not found. That
    passes a naive "the SPA loads" check while converting every missing-build failure into a silent
    blank page — the precise defect W1-T3176 is filed to prevent.
    DO NOT serve assets from the repository root or from `src/`. The root is the BUILD directory
    only; a route that can read source files has turned a console into a source browser.
  note: |
    Rule 25 CHECKED: `src/lib/serve.ts` is ordinary src; no instrument path is entangled.
    DEPENDS ON W1-T3173 because serving a build presumes there is a build to serve; it does NOT
    depend on W1-T3174 — assets are files, not API routes, and the fetch gate has no bearing on them.
    CAVEAT WITH EQUAL WEIGHT: this shard makes the daemon ABLE to serve a console build. It does not
    produce one, and it does not verify one exists at boot — that is W1-T3176, and shipping this
    alone leaves a route that correctly 404s on an empty directory.
