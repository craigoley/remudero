  acceptance:
    - claim: readEscalationAnswers gathers its escalation_answer.ignored, escalation_answer.refusal_alarm and panel.question_answered history through createEscalationTriageHistoryReader with a declared slice, returns the same rows the openLedgerUnion walk returns, keeps its unreadable-history alarm, and a second read over unchanged rotations reads no archive bytes
      proof: "unit test: test/inbox/escalation-answers-read-their-history-through-a-cached-slice.test.ts"
    - claim: escalation-answers.ts no longer walks the whole ledger union for its refusal history
      proof: "grep: createEscalationTriageHistoryReader( in src/lib/escalation-answers.ts"
  rationale: |
    OBSERVED 2026-11-03, 12:45-18:45Z, Azure host:
    - The 5 full passes each began after a sweep.full_prelude of 23-72 min (elapsed_ms 1,432,300-4,356,472).
    - Its escalation_answers stage took 447, 2,066, 340, 598 and 331 s.
    - Green PRs wait for the full pass to dispose them: 17 PRs sat at awaiting-review for up to 222 min while lanes were free.
    - readEscalationAnswers (src/lib/escalation-answers.ts) iterates openLedgerUnion over the whole ledger union, filtered to three steps, when gateway.refusalIssues is set. That is about 750 rotations (fleet_state_parts.union_rotations 717-754), decompressed on every full pass.
    - The repo already reads such slices through createEscalationTriageHistoryReader. On the auto-triage refusal slice its rows show digest_hits 714 of 717 rotations (auto_triage.refusal_read).
  design: |
    - Declare a ledger slice for the three steps readEscalationAnswers reads. Read it through a module-level createEscalationTriageHistoryReader, held across passes in the daemon process, in place of the openLedgerUnion loop.
    - Map the reader's unreadable outcome to the existing historyReadable = false path, so escalation_answer.refusal_alarm_unreadable still fires.
    - Bump the slice version if the reader requires one.
    NOT IN SCOPE: fleet_state's own union read, and any other prelude stage.
