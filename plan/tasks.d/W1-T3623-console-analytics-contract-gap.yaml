- id: W1-T3623
  title: "TWO CONTRACTS BOTH CALLED console-v1 AND THEY SHARE NO METRIC — the console asks /v1/analytics for runs.completed, tokens.total, cache.reuse, cost.modeled.usd, duration.p50.ms and queue.pending, the daemon answers with invocationsByVerb, workersByLaneModel, taskDurationsMs, noTerminalTaskCount and workerDurationsByLane, so every card on the operator's analytics page reads Unavailable: not collected"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 90.00
  files: [src/lib/analytics-route.ts, test/console-analytics-contract-gap.test.ts]
  origin: oper#console-analytics-unavailable-2026-09-15
  plan_refs: ["W1-T425"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED 2026-09-15, after RMD_CONTROL_ANALYTICS_INSTANCES was finally configured. The
    console's analytics page went from

      "Unavailable -- The analytics gateway is not configured for this deployment"

    to

      "Verified -- As of 2026-09-15T20:50:20.676Z"

    with the repository filter correctly naming craigoley/remudero. The gateway reaches the
    daemon and the read succeeds. EVERY CARD STILL READS Unavailable, and the reason changed
    from not_configured to NOT COLLECTED -- which is the console telling the exact truth.

    THE TWO SIDES IMPLEMENTED THE SAME PROJECTION NAME AND NEVER MET. Both call it console-v1.
      console asks for:  runs.completed · tokens.total · cache.reuse · cost.modeled.usd ·
                         duration.p50.ms · queue.pending · provider headroom
      daemon answers:    invocationsByVerb · workersByLaneModel · taskDurationsMs ·
                         noTerminalTaskCount · workerDurationsByLane
    Zero overlap. A version string that both sides increment independently is not a contract,
    and this is what that costs: a fully wired, authenticated, honest analytics surface with
    nothing to show.

    THE DAEMON ALREADY HOLDS MOST OF THE INPUTS, so this is a projection gap rather than a
    measurement one. taskDurationsMs answers duration.p50.ms; /v1/status's counts.queued answers
    queue.pending and its spend.spendTodayUsd answers cost.modeled.usd; /v1/account-usage carries
    provider headroom. Only tokens.total and cache.reuse need a genuinely new read.

    NOT COLLECTED MUST STAY AVAILABLE AS AN ANSWER. Whatever this emits, a measure the daemon
    genuinely does not collect has to keep saying so rather than reading as zero -- the console's
    own direction is that unknown, unavailable, redacted and not-collected are explicit states,
    never zeroes, and closing this gap must not close that door.
  design: |
    Emit the metric keys the console's catalog names, from the aggregates this projection already
    computes where one answers the other, and state per metric which measurement class it is --
    observed, provider-reported or modeled -- because the console renders that distinction and
    cannot infer it.

    Version the projection so a mismatch is DETECTED rather than rendered as an empty dashboard:
    the failure this task exists to close was silent on both sides, and a contract that cannot
    report its own mismatch will produce it again.

    W1-T425's redaction reservations are untouched: these are aggregates, and no ledger row, raw
    prompt or tool argument leaves the host to serve them.
  acceptance:
    - claim: "the projection emits the metric keys the console catalog names, rather than a disjoint set under the same version string"
      proof: "unit test: the console projection emits every metric key the console catalog names"
    - claim: "a metric the daemon does not collect is reported as not collected rather than as zero"
      proof: "unit test: an uncollected metric is reported as not collected, never as a zero reading"
    - claim: "each emitted metric names its measurement class, so the console need not infer it"
      proof: "unit test: every emitted metric names its measurement class"
    - claim: "a projection whose version the caller does not understand is refused rather than rendered empty"
      proof: "unit test: an unrecognised projection version is refused rather than answered with a disjoint payload"
