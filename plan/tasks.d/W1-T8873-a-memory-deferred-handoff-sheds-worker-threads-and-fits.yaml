  rationale: |
    READ 2026-10-12 at origin/main 42dae2eb8; ledger 10-10 23:00Z to 10-12 23:08Z (deduplicated).
    OBSERVED:
    - 660 `serve.handoff_deferred` reason memory since 10-12 07:13Z; serve moved only through the 15:56Z restart.
    - `serve.handoff_shed`: beforeBytes 3,583 MB → afterBytes 3,583 MB. `shedActive` ("Tier 1: the active generation
      drops its rebuildable caches") reaches the main heap (~0.38 GB).
    - Worker heaps early-max vs steady p50 (MB): views 1443/377, heavy views 1648/1186, plan reload 465/61, oracle 683/84,
      board 642/322; prewarm ~220 and repo-dashboard ~300 early only.
    - The serve cgroup's memory.peak (5.91 GB) equals its MemoryHigh, and its swap hit the 1 GB swap.max, so the cold-start
      peak is censored.
    - Steady RSS p50 3.79 GB.
    INFERRED: shedding or terminating the rebuildable worker threads frees ~2.0-2.3 GB, enough for the new generation's
