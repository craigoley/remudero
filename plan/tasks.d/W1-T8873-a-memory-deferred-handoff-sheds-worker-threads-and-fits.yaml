    stages view workers.
  design: |
    1. TIER 2 SHED: when a handoff is deferred for memory, the next attempt sends a `shed_workers` message.
       - The active generation terminates its rebuildable worker threads (views, heavy views, plan reload, oracle, board,
         prewarm, repo-dashboard). It keeps serving cached view bodies in the EXISTING degraded mode (stale-while-
         revalidate: bodies carry their as-of, nothing invents data) and reports the freed bytes.
       - The supervisor re-measures free memory and proceeds if the candidate peak now fits.
       - If it still does not fit, the workers restart and the deferral continues as today.
    2. STAGED BOOT (the new generation): start view workers one at a time, each after the previous one's first build, so
       the boot peak is the maximum of the workers rather than their sum.
    3. Bounded: tier 2 runs at most once per handoff attempt and never more than once per 15 min. It is ledgered
       (`serve.handoff_shed` with tier, freed bytes and duration of degraded mode). No limit, reserve or MemoryHigh changes.
  acceptance:
    - claim: "a memory-deferred handoff sheds the active generation's rebuildable worker threads, measures the freed bytes, and proceeds when the candidate now fits, while cached views keep answering in degraded mode and a still-short attempt restores the workers"
