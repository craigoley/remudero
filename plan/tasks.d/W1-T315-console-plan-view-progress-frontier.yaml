  note: "FILED 2026-08-03 from feedback fb-1784770111145-cf7c24 (clause 2). depends_on [W1-T314] is a real
    dependency — this fills the tab that task creates — and the design states the explicit fallback if T314
    stalls, per the W1-T183/#410 lesson that a hard dep stalls its dependant. risk:high: it reads the drain's
    own ordering predicate and the batched GitHub gateway; a wrong frontier misdirects the operator's
    attention, which is the exact failure this arc exists to fix. NOT a re-decision of W1-T279/W1-T280 (the
    CLI status board and its --json, which own liveness and feed the Now tab) — those answer 'is it running',
    this answers 'where does the plan stand and what is next'."
