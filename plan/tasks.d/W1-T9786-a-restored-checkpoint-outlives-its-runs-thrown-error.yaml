- id: W1-T9786
  title: "A RESTORED CHECKPOINT OUTLIVES ITS RUN'S THROWN HARNESS ERROR — W1-T9047's run restored run-W1-T9047-1792027244995 at 03:48Z on 2026-10-15 and its push threw 'could not read Username' at 04:10Z; that thrown verdict consumed the receipt with no implement.checkpoint_kept row, so every pass refused the P1 as run-branch-already-pushed until the 24 h orphan grace, and the next build had no checkpoint left to restore"
