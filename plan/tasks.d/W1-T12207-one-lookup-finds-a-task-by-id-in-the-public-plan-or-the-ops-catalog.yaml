  rationale: |
    OBSERVED 2026-11-10: no single function reads a task by id. `loadPlan(` has 36 call sites in src/run-task.ts and about 13 other files call it.
    - Review reads the plan at the head of the pull request, then on origin/main, then the acceptance block of the body (`resolvePlanCriteriaAtHeadAsync`, called from src/cli/commands/review.ts). For an ops task it would have the body only, with no declared files, risk or budget.
    - The fix command calls the same function twice in src/cli/commands/fix.ts.
    - The scope gate is `changedPathsOutsideDeclaredFiles` in src/lib/sweep.ts.
    - `rmd claim` refuses an id that is not on origin/main of the public repository (`claimPlanRoot` and `plannedOnOriginMain` in src/run-task.ts).
    - W1-T12185 and W1-T11770 finish the shadow reader of the ops catalog. This task depends on both.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. This task adds no kind. It must merge before `task` is turned on.
  design: |
    New module src/lib/task-lookup.ts. Export `findTaskInCatalogs(taskId, deps)` with the result `{ outcome, task, catalog }`.
    Read the ops catalog through the pinned reader of W1-T11768, `readOpsCatalogSnapshotAsync`. Do not add a second reader.
    In review, call the lookup after the two reads of the public plan find nothing and before the body is used.
    The lookup runs on the host. Its result is private. A caller that writes to a public surface may write the title and the acceptance criteria of an ops task and no other field (operator ruling, 2026-11-10).
    NOT IN SCOPE: the daemon selector, the merge credit, the board, and the 36 other call sites of `loadPlan`.
  falsifier: |
    Read the ops catalog first and criterion 1 must fail. Fall back to the body for an ops task and criterion 2 must fail. Refuse the claim of an ops task and criterion 4 must fail. Return "absent" for an unreadable catalog and criterion 5 must fail. Restore and require all nine to pass.
