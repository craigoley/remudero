    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so a source file and a test not named after it trip it at `medium`. `files:` is one
    source file and one new test. NOTE THAT THE `pr.opened` EMITTERS LIVE IN `src/run-task.ts`,
    WHICH IS DELIBERATELY NOT DECLARED: the writer fix is a separate concern from the reader fix
    (design (iii) says neither is prerequisite to the other), and declaring a second source file
    here would widen the scope past what one task should carry.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/receipt-reads-the-live-file.test.ts`, declared in `files:`, so on this filing PR it
    resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL. `rmd check-proof` on the
    declared path reads `exit: 1`, `hits: 0`, `verdict: fail`. The SAME verb on an EXISTING pure path
    — `unit test: test/receipt.test.ts`, the test file for the very module this task changes — reads
    `exit: 0`, `hits: 58`, `verdict: pass`. The control file was confirmed present BEFORE the
    falsifier was believed.

    THE FIGURES ARE RE-DERIVED, NOT ATTRIBUTED, BECAUSE THE UNION RESOLVED. `resolveLedgerUnion`
    returned `ok: true` with 672 archives and the live file read, so the rail's refusal condition did
    not apply here. Where this host's denominators differ from the operator's, both are recorded and
    the difference is named rather than reconciled away.

    THE ID WAS RESERVED BY THE OPERATOR AND IS NOT RE-MINTED. This shard VERIFIES THE ID IS UNUSED
    rather than that it is this account's, which is the condition that governs filing.

