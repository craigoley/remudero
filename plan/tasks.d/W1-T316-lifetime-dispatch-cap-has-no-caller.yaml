  note: "verify:auto - the whole behaviour is a predicate supplied to a dep object plus a ledger line,
    machine-checkable with no operator present.
    risk:high - it gates DISPATCH. A predicate wired wrongly halts legitimate work; wired not at all
    leaves the current spend loop open. The blast radius is every task the fleet would otherwise run.
    budget_usd 60 - well under the house default: the counter, threshold and refusal branch already
    exist and are tested, so this is two dep-object edits plus a regression lock.
    NO depends_on: W1-T271 is already merged (#- see MASTER-PLAN's P29 entry); nothing else blocks this.
    SIBLING PATTERN, worth the worker knowing: this is the THIRD shipped-but-unasked predicate found in
    this codebase - checkCostGovernor and checkQueueGovernor (src/lib/sweep.ts) are in the identical
    state, and W1-T317 files the first of those. If a general 'every exported gate has a caller' lint is
    ever built, these three are its fixtures. Do NOT build it here."
