  acceptance:
    - claim: "The cash arm's models are the policy's models plus each ready open-weight deployment whose newest cash.invoice.reconciled verdict is reconciled and whose newest bake-off row ran with tools. A deployment with no verdict, or a diverged or unreconcilable one, is not an arm"
