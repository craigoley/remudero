    - claim: "A cash-arm task draws one model by a stable hash of the task id, so every retry of the task gets the same model. The spawn gets that one model and no fallback to another arm"
      proof: "grep: W1-T12424 criterion 2 in test/routing/the-cash-simple-trial-draws-each-task-s-cash-model.test.ts"
