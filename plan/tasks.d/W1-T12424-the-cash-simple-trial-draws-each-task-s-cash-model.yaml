  rationale: |
    WHY: the operator asked on 2026-11-12 for routing experiments with arms for the open-weight deployments that have spare quota, on economy work, scored by merge rate as today (backlog item BM3). The operator wants a new deployment to enter trials with no operator step.
    READ 2026-11-12 at origin/main 920669542:
    - src/lib/routing-experiments.ts:31-69 ROUTING_EXPERIMENTS holds only Claude-versus-Codex epochs. W1-T10842 (queued) adds a Codex-versus-Codex shape and W1-T12150 (queued) an effort shape. Neither covers the cash provider.
    - The cash work that exists is the cash-simple trial. src/lib/cash-trial.ts:33-41 DEFAULT_CASH_TRIAL_POLICY sends 50 percent of the simplest implement work to cash, with models ["gpt-oss-120b"] (:40), a budget of 10 percent of the daily cap (:36), and a stop rule against the control arm (:144 `cashTrialStopReason`). :29 records why gpt-5-nano left: 158 assignments, 54 errors, 1 PR in 45 verdicts.
    - :259-268 `cashTrialSpawnFields` passes the whole models list to the spawn, so the spawn takes the first ready one. There is no per-task draw between cash models and no figure per model. src/cli/commands/run-task-verb.ts:5543-5551 is the only caller.
    - W1-T10855 (merged) priced DeepSeek-V4-Flash, DeepSeek-V4.1-Flash and Kimi-K2.6 and kept them "off every lead". W1-T10857 (merged) put them in the bake-off with tools. W1-T10858 (queued) lets an open-weight deployment lead only after one UTC day's metered cost matches the invoice. This task uses the same verdict, so a trial arm is a lead that is paid at a checked price.
    OBSERVED 2026-11-12 by the operator session: gpt-oss-120b has 450K tokens per minute and DeepSeek-V4-Flash, DeepSeek-V4.1-Flash and Kimi-K2.6 have 300K each, with spare quota.
    WHY THE CASH-SIMPLE TRIAL AND NOT A NEW EXPERIMENT SHAPE: the trial already has the eligible population, the budget share, the control arm and the merge outcome. A new epoch kind would repeat all of them.
  design: |
    1. In src/lib/cash-trial.ts add `cashTrialModels(policy, readiness)`: the policy's models, then each ready open-weight deployment (`openWeightDeploymentReady`) whose newest `cash.invoice.reconciled` row (W1-T10858) says reconciled and whose newest `inbox.bakeoff` row ran with tools. Add `cashTrialModelFor(taskId, models)`, a stable hash of the task id over the models in name order, with its own draw point so it does not depend on the cash or control draw.
    2. In src/cli/commands/run-task-verb.ts pass `[cashTrialModelFor(task.id, models)]` to `cashTrialSpawnFields` in place of the whole list, and log the drawn model in `cash_trial.decided`.
    3. Extend `summarizeCashTrial` with a per-model breakdown keyed by the drawn model, and apply `cashTrialStopReason` per model. A stopped model leaves the draw; a task whose drawn model is stopped draws again over the models left.
    4. When W1-T12142 has merged, give the per-model comparison its decision rule. If not, keep minSample as the floor.
    NOT IN SCOPE: the cash economy and balanced rows of .remudero/mounts.yaml; any automatic change of a lead; the decision models (they are not workers).
  falsifier: |
    Admit a deployment with no reconciled verdict and criterion 1 must fail. Draw by attempt in place of task and criterion 2 must fail. Pool two cash models in the summary and criterion 3 must fail. Stop the whole trial for one weak model and criterion 4 must fail. Restore and require all to pass.
