- id: W1-T2565
  title: "THE HEADROOM GOVERNOR SAMPLES ON THE VERY LOOP WHOSE DURATION IT IS MEANT TO BOUND — daemon.headroom is written once per runOne iteration and the readUsage call sits AFTER runGatedSweep, the sweep carrying the inbox-draft rung, so the more a tick spends the longer until the next reading and the sampling rate is inversely coupled to spend; MEASURED over the three-form union: gaps run median 158s but p95 4,400s and max 21,586s, and across one 58-minute window the account went 30% used to exhausted with the governor holding its last value while 43 in-flight ticker passes carried a DISK reading and ZERO carried an account one"
