    effect on the repository, making them the lowest-risk surface for a genuine paired comparison.
  design: |
    Sample a bounded fraction of read-only judge decisions (review semantic verdicts, risk-judge
    dispositions, verify-human decisions) and re-run each with a different model in shadow,
    recording both decisions with their assignments. Measure agreement, and once W1-T4608's verified
    outcomes exist, calibration of each judge model against them. The shadow decision never gates,
    posts or changes anything; spend is bounded by measured headroom and paid arms by W1-T4603.
  acceptance:
