  rationale: |
    OPERATOR DIRECTION 2026-09-08, verbatim: "We've talked about adding an llm as a judge for the
    verify human shards to make sure they actually need me, then surface them through the inbox."

    THE POPULATION, measured over `plan/tasks.yaml` + `plan/tasks.d/` on 2026-09-08:
      `verify: human` shards total                  71
      by status  {queued: 53, blocked: 6, done: 2, merged: 10}
      not merged / blocked / retired                55
    All 53 queued ones render on the operator's board as identical rows reading "awaiting human
    verification -- filed verify: human, never auto-dispatched", carrying NO affordance at all —
    `needsMeVerifyRowHtml`'s own comment says so: "there is no issue to view and no PR to point at
    ... nothing exists yet to click."

    THEY ARE NOT ESCALATIONS AND NO EXISTING JUDGE TOUCHES THEM. `status.ts`'s only two
    `needsHuman = true` assignments (:2501, :2899) are both escalation-derived. W1-T349's residual
    escalation judge — wired to production for the first time by W1-T3166 — runs at
    `escalate()`'s choke point, which these never cross. W1-T3167's re-judge reads OPEN
    ESCALATION ISSUES; these have no issue. A verify:human shard has never been asked a question by
    anything.

    WHY A JUDGE AND NOT A PREDICATE. Whether W12-T1 ("the site is a separate repository") still
    needs the operator in September is a reading of the shard's own text against current repo
    state. No field on the record answers it: `status` says queued, `verify` says human, and both
    were true the day it was filed and are true now. A deterministic rule that captured it would
    have to encode the judgement — and would then silence live items with the same confidence.

    THE ASYMMETRY IS THE SAME ONE, AND IT MATTERS MORE HERE. escalate.ts's header states it: a
    false negative hides work the operator cannot know to look for and is the COSTLY direction; a
    false positive costs one skim. These shards have NO issue and NO PR, so a wrongly-silenced one
    leaves no artefact anywhere for him to stumble across later. Fail open, always.
  design: |
    (i) DEMOTE-ONLY, AND THE TYPE MUST NOT BE ABLE TO EXPRESS ANYTHING ELSE — the same construction
    `EscalationJudgeDecision` uses. A verdict may move a shard OFF the operator's ask list into a
    visible backlog; it may never close it, retire it, edit the plan record, or change `verify:`.
    A judge that can edit the plan has been given rule-15 powers by the back door.
    (ii) THE PLAN IS NEVER WRITTEN BY THIS. The verdict is a ledgered ROUTING fact, read by the
    console. `plan/tasks.d/` is untouched — a machine may propose, only an operator releases, and
    a judge that mutates a shard's record has broken that rule while appearing to tidy.
    (iii) THE PROMPT CARRIES WHAT A HUMAN WOULD NEED: the shard's title, rationale, acceptance and
    age, plus whether its `depends_on` are merged and whether anything in `src/` cites its id. A
    judge asked only "does this need a human" with no state to read is guessing, and its verdict is
    then noise with a model's confidence on it.
    (iv) JUDGE ONCE PER OBSERVED STATE, NEVER ONCE PER POLL. 53 shards times every refresh is a
    token event, not a sweep. Key the verdict so an unchanged shard is not re-asked, and let a
    CHANGE — a dependency merging, a citation appearing — re-open the question.
    (v) EVERY VERDICT IS LEDGERED WITH ITS REASON, on both arms, and registered in
    `DECISION_RELEVANT_LEDGER_STEPS` in the SAME change. W1-T3166 had to establish "has the judge
    ever run" from three separate reads because no such row existed; that mistake is not repeated.
  acceptance:
    - claim: "a queued verify:human shard is judged, and a demote verdict removes it from the operator's ask count while leaving the shard itself untouched in the plan"
      proof: "unit test: test/a-verify-human-shard-is-judged.test.ts"
    - claim: "the judge cannot close, retire, or edit a shard — no path writes plan/tasks.yaml or plan/tasks.d/, and a stub attempting it changes no file"
      proof: "unit test: test/a-verify-human-shard-is-judged.test.ts"
    - claim: "a throwing, timing-out or unparseable-verdict judge leaves the shard ON the operator's list — fail open, proven at the callsite"
      proof: "unit test: test/a-verify-human-shard-is-judged.test.ts"
    - claim: "an unchanged shard is not re-judged on a second pass; a shard whose dependency has since merged IS re-judged"
      proof: "unit test: test/a-verify-human-shard-is-judged.test.ts"
    - claim: "every verdict writes a ledger row naming decision and reason on BOTH arms, and that step is decision-relevant so it survives rotation"
      proof: "unit test: test/a-verify-human-shard-is-judged.test.ts"
    - claim: "the judge has a PRODUCTION call site — src/run-task.ts calls it, not only its own tests"
      proof: "grep: judgeVerifyHumanShard( in src/run-task.ts"
  falsifier: |
    CLOSE IF anything already judges a verify:human shard:
      `grep -rniE 'verify.?human' src/ --include=*.ts` and a read of the two `needsHuman = true`
      assignments in `src/lib/status.ts`.
    MEASURED 2026-09-08: both are escalation-derived; `needsMeVerifyRowHtml` renders these rows
    straight from the plan with no verdict anywhere in the path.
    POSITIVE CONTROL for the census, because "53" carries the whole argument: the walk must report
    every bucket — MEASURED {queued: 53, blocked: 6, done: 2, merged: 10} over 71 shards. A walk
    returning one number is unverified.
    PROVE IT LOAD-BEARING: the fixture needs a shard that plainly still needs a human (an unmet
    dependency, a live referent) AND one that plainly does not (its dependency merged, its work
    cited in src). A stub judge must be able to separate them and the ask count must move by
    exactly one. If both route the same way, the mechanism is decorative.
    DO NOT satisfy this by letting the judge edit the plan record. Design (ii) is the whole safety
    boundary; a "tidy-up" that flips `verify: human` to `verify: auto` has dispatched 53 tasks
    nobody approved.
    DO NOT satisfy this by hiding the demoted shards. W1-T507 exists because that queue was
    invisible. Demoted means OFF THE ASK COUNT and still listed, exactly as W1-T3183 requires.
    DO NOT reuse the escalation judge's prompt unchanged. It reasons about an issue with options
    and a recommendation; a verify:human shard has none of those, and a prompt describing fields
    that do not exist invites a confident answer about nothing.
  note: |
    THE CALL-SITE CRITERION EXISTS BECAUSE lint-plan REFUSED THIS SHARD WITHOUT IT, and the refusal
    is the point: "task W1-T3188 creates src/lib/verify-human-judge.ts but no acceptance criterion
    proves a CALL SITE for it." That is precisely the defect W1-T3166 was filed to end — W1-T349
    built a complete, tested judge that nothing ever called, and it sat unwired long enough for its
    fleet-notice queue to hold zero issues for its entire existence. A second judge filed the same
    way would have repeated it. The gate caught what its author did not.
    Rule 25 CHECKED: `src/lib/` and `src/run-task.ts` are ordinary src.
    DEPENDS ON W1-T3166 for a real reason, not tidiness: that task gave the FIRST production caller
    to a judge that had none, and its `escalation.judged` row plus retention registration are the
    pattern this one copies. Building a second judge before the first has ever run in production
    would repeat W1-T349's own failure mode at twice the scale.
    RELATIONSHIP TO ITS SIBLINGS: W1-T3166 judges an escalation at BIRTH, W1-T3167 RE-judges an open
    one, W1-T3168 stops a producer firing on a healthy PR, W1-T3179 stops a push re-asking a settled
    question, and this judges a population that has NEVER been asked anything. Five mechanisms, no
    overlap.
    CAVEAT WITH EQUAL WEIGHT: this shard makes the 53 rows JUDGEABLE. It does not predict how many
    a judge would demote — that is a model's reading of 53 records and no measurement here forecasts
    it. It could be most of them or almost none, and the operator should expect to calibrate.
    SECOND CAVEAT: a demoted shard is still work someone filed on purpose. This changes where it is
    COUNTED, never whether it gets done, and nothing here should be read as a way to shrink the plan.
