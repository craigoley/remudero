  rationale: |
    OBSERVED ON THE LIVE AZURE FLEET, READ-ONLY, OVER THE THREE-FORM LEDGER UNION. The daemon
    booted at 2026-09-08T01:15:59.902Z. Its main-thread headroom row completed at
    01:23:32.775Z; `retro_triggered` did not appear until 01:25:14.312Z. Nothing between those
    rows gates the retro check, so its synchronous eligibility read held task admission for
    101.537 seconds. The same marker was 2026-09-03T02:24:39.835Z, and the union contained 151
    distinct `run.start` ids after it. Task selection and admission then completed in under four
    seconds, so lane count cannot recover this time: the lanes do not exist yet.

    THE SOURCE EXPLAINS THE MEASUREMENT. `retroTriggerCheck` parses the run corpus, calls
    `shippedSince`, then calls `runlessMergesSince`. `shippedSince` loops every scoped run. A run
    that observed `merged` pays `headRefName`; every other run pays `findMergedByTrailer`, then a
    matching result pays `headRefName` too. That is O(runs since marker) GitHub round trips in a
    function whose only output is a threshold decision. W1-T2981 correctly detached the retro
    body, but this synchronous preflight remains above dispatch.

    THE LEDGER ALREADY HOLDS THE CHEAPER AUTHORITATIVE INPUT. W1-T150's full sweep writes
    `verdict.merged` only after its `CreditCandidate.merged` has been ownership-asserted and
    trailer-anchored. A native `verdict` with `verdict: merged` is the worker's own terminal
    credit. Both rows carry task and PR identity and are in the same archive/live corpus the
    trigger already reads. W1-T3088 taught `gatherRuns` to consume `verdict.merged`, but
    `RUN_LEDGER_STEP_PATTERN` does not include that step, so the trigger's narrow union drops the
    new fact before `gatherRuns` can see it. Filing is not implementation: both facts were checked
    at origin/main `c3db99bb9bea6bfc89c61b1946ac7551683da6d9`.

    THE TRIGGER AND THE RETRO HAVE DIFFERENT JOBS. Eligibility needs a bounded, conservative count
    to answer whether a cadence threshold fired. The full retro gather still needs its complete
    ledger/GitHub union and P9 branch-ownership diagnostics. Repeating the full gather before
    deciding whether to launch the full gather is the maintenance tax this task removes.
  design: |
    (i) MAKE THE TRIGGER LEDGER-FIRST. Extend its narrow ledger pattern to include
    `verdict.merged`. Derive `mergesSinceMarker` from native merged verdicts plus ownership-asserted
    credit rows strictly after the marker. Deduplicate by PR URL when present, then by task id, so
    repeated descriptions of one merge never manufacture threshold progress.

    (ii) REMOVE PER-RUN GITHUB LOOKUPS FROM ELIGIBILITY. `retroTriggerCheck` may retain the one
    gateway-availability probe that preserves its current fail-closed outage posture, but it must
    not call `findMergedByTrailer`, `headRefName`, or `mergedCommits`. Those remain in the full
    retro gather, unchanged, where their detailed reconciliation is consumed.

    (iii) PRESERVE THE OTHER TWO TRIGGERS. Marker age and pending follow-ups still feed
    `evaluateRetroTrigger` exactly once from the same parsed corpus. An absent marker remains the
    unbounded-days case; a corrupt marker still returns `undefined`; an unavailable gateway still
    skips the tick.

    (iv) WINDOW THE ARCHIVE READ AT THE MARKER WHEN ONE EXISTS. `resolveLedgerUnion` already owns
    a name-derived, fail-loud `since` option. Pass the marker timestamp so rotations proven older
    than the eligibility window are not opened. The live file is still always read, malformed
    rotation names are still read, and zero/unreadable archive coverage keeps the existing loud
    fallback rather than becoming a plausible partial count.

    (v) DO NOT WEAKEN THE RETRO'S P9 CONTRACT. `buildGather`/`shippedSince`, their branch checks,
    discrepancy output, and the retro subprocess are out of scope. This changes only the daemon's
    pre-launch cadence input; the launched retro still verifies the full truth before publishing.

    (vi) TELEMETRY, NOT A TIMER ASSERTION. Add the credited/native/deduplicated counts to the
    existing retro-trigger decision path or a single adjacent diagnostic so a future regression
    is attributable. Do not encode a wall-clock threshold in unit tests; prove zero per-run gateway
    calls with throwing spies over a 151-run synthetic corpus.
