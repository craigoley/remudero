      proof: "unit test: test/retro-trigger-ledger-credit-fast-path.test.ts"
  falsifier: |
    Close without implementation if a production-shaped trace shows `retroTriggerCheck` does not
    call a GitHub gateway per scoped run, or if the main-thread interval from the last pre-retro
    rung to `retro_triggered` is under ten seconds with the same 151-run corpus. Both were checked:
    source at c3db99bb loops scoped runs through `shippedSince`, and the three-form ledger trace
    measured 101.537 seconds. Also close if `verdict.merged` is not ownership-asserted at its
    writer; `runCreditBackfill` documents and types `CreditCandidate.merged` as ownership-asserted,
    trailer-anchored before appending the row.
