  rationale: |
    WHY: inbox drafts are 89.5% of paid spend, and most of that money buys no draft.
    OBSERVED (ledger union, 2026-11-05 to 2026-11-19): cash inbox draft rows cost $129.3. Successful drafts were
    $58.22 (46 drafts, about $1.27 each). Drafts that failed after spending were $71.08 (55%): openweight_error
    $50.05 over 57 rows ($40.41 of it with partial or unavailable token usage), and cash_allowance_exhausted $21.03
    over 715 rows. One failed gpt-6-luna draft read 503,033 input tokens over 2 requests for 123 output tokens; one
    haiku draft read 1,561,526 input tokens. Inbox input tokens: p90 1,068,558, max 35,340,158.
    OBSERVED in code: reserveOpenWeightBudget (worker-provider.ts) reserves per request, not per run. The draft is
    a tool loop, so request 1 is billed and a later request is refused with OpenWeightAllowanceExhaustedError, and the
    row is labelled cash_allowance_exhausted with a cost. The context check (OpenWeightRequestTooLargeError) is also
    per request, so a run whose second request outgrows the window fails after the first is billed.
    WHY THE PROMPTS ARE LARGE (INFERRED from code, measured by criterion 5): inboxDraftPrompt (inbox.ts) pastes
    planProjectionForDependsOn(currentPlanText), an index of every task in the plan (5,799 shard files on main today), into every
    draft, and a relint redraft pastes the whole prompt again plus the failed fragment. 503,033 tokens over 2 requests
    is about 250,000 tokens a request. Subscription drafts also Read plan/tasks.yaml through tools, which explains the
    multi-million-token rows.
  design: |
    INVARIANT no-paid-draft-that-cannot-finish: a cash draft starts only when its estimated whole run fits the
    routed deployment's effective window and the allowance left today; every other draft path is unchanged.
    1. worker-provider.ts: export cashDraftFit({ deployment, promptChars, expectedRequests, squeezed }) that returns
       { fits: true } or { fits: false, reason: "window" | "allowance", estimatedTokens, estimatedUsd, leftUsd }.
       It reads openWeightEffectiveWindow, openWeightReservationUsd and the same allowance state
       reserveOpenWeightBudget reads, and reserves nothing. No new cap: it applies the existing allowance and
       window before the first request instead of during the run.
    2. inbox.ts runDraftRung: DraftRungDeps gains an optional cashFit; before each cash spawn, call it with the
       prompt's length and the lane's expected requests (the median request count of the lane's last observed
       drafts, default 2). On fits false, log inbox.draft_cash_skipped, write no attempt key, and return the
       proposal undrafted. Add prompt_chars and plan_index_chars to inbox.draft_synthesized.
    3. run-task.ts draftProposalBatch passes cashDraftFit as cashFit. Declare inbox.draft_cash_skipped in
       ledger-steps.ts.
    Shrinking the plan index itself is a follow-up once criterion 5 has measured it.
  falsifier: |
    Remove the cashFit call: criterion 2's fixture spawns a draft past today's allowance and the test fails.
  note: |
