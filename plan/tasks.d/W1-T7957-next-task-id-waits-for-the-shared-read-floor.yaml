- id: W1-T7957
  title: "RMD NEXT-TASK-ID WAITS FOR THE SHARED GH READ FLOOR — its open-PR read runs in the transport's advisory mode, which only warns inside the 180 s window, so filing agents mint 102-167 s apart through rmd while the deny-floor hook, which shares the same stamp file, cannot see a read made inside rmd"
  repo: remudero
  depends_on: [W1-T7952]  # shares src/run-task.ts
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — an operator verb's GitHub read waits for the floor the hook enforces
  band_meaning: span
  origin: "operator approval 2026-10-11: file the recommended follow-ups (rmd next-task-id reads under the shared gh floor)"
  plan_refs: [W1-T3275, W1-T3297, W1-T4085, W1-T4970, W1-T6372, W1-T3091]
  files: [src/lib/github-transport.ts, src/run-task.ts, test/next-task-id-waits-for-the-shared-read-floor.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    READ on origin/main cb58d3155 (2026-10-11).
    ONE STAMP ALREADY, AND TWO RULES ABOUT IT.
      - The hook (hooks/deny-floor.sh rule 10, :1253-1362) paces a read-shaped `gh` in a Bash command's text. It
        reads `${RMD_GH_CACHE_HOME:-${XDG_CACHE_HOME:-$HOME/.cache}}/remudero/gh-last-read` (:1289-1305) under its
        `.lock` (:1312) and refuses inside `RMD_GH_COOLDOWN_S` (default 180, :1282-1285).
      - rmd's transport resolves the same path (`ghReadCadenceStampPath`, src/lib/github-transport.ts:831) and the
        same lock (`withGhCadenceLock`, :1048). So the stamp is already shared. What differs is the rule applied
        to it.
      - The transport decides with `ghReadCadenceDecision` (:898). Inside the window it allows in advisory mode
        (:922) and refuses only under `enforce`. `resolveGhTransportFloorMode` (:839) defaults to advisory.
      - Only `rmd review` is wrapped in the enforcing scope (`withGhTransportFloor`, src/run-task.ts:56277).
      - `next-task-id` dispatches unwrapped (src/run-task.ts:56365). Its one GitHub read is `openPrMintTexts`
        (:42812, called at :28040), a sync `ghJson`. So inside the window it prints the W1-T3297 advisory line
        (github-transport.ts:1156) and reads anyway. The cross-process gap it does honour is
        `DEFAULT_GH_SHARED_READ_GAP_MS`, 1.5 s (:426).
      - The transport never reads `RMD_GH_COOLDOWN_S`; its window is the constant `DEFAULT_GH_READ_CADENCE_S`
        (:690). The hook's documented operator override therefore does not reach rmd.
    The hook cannot see `./bin/rmd next-task-id`: its text holds no `gh`. That is by design (github-transport.ts:672-675).
    EVIDENCE.
      - The operator session reports filing agents on 10-10 and 10-11 minting 102-167 s apart through
        `rmd next-task-id`, each time with the advisory warning printed.
      - This filing's own mints: the stamp read 11:26:21Z after the second mint. The third ran at 11:28:29Z,
        128 s later, and rmd allowed it. A guard script in the session then held the fourth.
  design: |
    1. A WAIT MODE IN THE TRANSPORT. `resolveGhTransportFloorMode` accepts "wait". In wait mode, a gated read
       inside the window does not throw and does not just warn. It awaits the remaining window on the shared
       stamp, under the same lock, then reads and stamps. The sync path uses `sleepSync` and the async path uses
       `sleep`, the seams that already exist. It prints one line naming the wait, the window and the stamp path.
       The burst rule (`DEFAULT_GH_READ_BURST`) is unchanged: only an invocation's first read waits.
    2. ONE WINDOW VARIABLE. The transport's window reads `RMD_GH_COOLDOWN_S` exactly as the hook parses it
       (digits only, else 180). The constant stays the default. `RMD_GH_COOLDOWN_S=0` remains the one documented
       operator choice that skips the wait. No new variable is added.
    3. NEXT-TASK-ID RUNS IN WAIT MODE. Its dispatch (src/run-task.ts:56365) runs inside
       `withGhTransportFloorMode("wait", ...)`. An explicit `RMD_GH_TRANSPORT_FLOOR` in the environment still wins.
       So the daemon's children, such as the gate gardener's `next-task-id --reserve` spawn
       (src/lib/gate-gardener.ts:236), inherit the daemon's advisory mode and never wait.
    Tests go in the new file test/next-task-id-waits-for-the-shared-read-floor.test.ts, with `test(` titles exactly as
    in the proofs below. Use injected clock, stamp and sleep seams, and no real `gh`. The existing cadence, burst and
    interactive-read suites must stay green.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/next-task-id-waits-for-the-shared-read-floor.test.ts"
    - claim: "a wait-mode read inside the window sleeps the remaining window on the shared stamp, then reads and stamps"
      proof: 'grep: test("W1-T7957: a wait-mode read waits out the shared floor before reading" in test/next-task-id-waits-for-the-shared-read-floor.test.ts'
    - claim: "next-task-id's open-PR read waits for a stamp the hook wrote 120 s earlier and does not read before 180 s"
      proof: 'grep: test("W1-T7957: next-task-id waits for a read the hook stamped" in test/next-task-id-waits-for-the-shared-read-floor.test.ts'
    - claim: "the transport's window honours RMD_GH_COOLDOWN_S as the hook parses it, and 0 skips the wait"
      proof: 'grep: test("W1-T7957: the transport window reads RMD_GH_COOLDOWN_S like the hook" in test/next-task-id-waits-for-the-shared-read-floor.test.ts'
    - claim: "an inherited RMD_GH_TRANSPORT_FLOOR=advisory keeps a daemon-spawned next-task-id from waiting"
      proof: 'grep: test("W1-T7957: an inherited advisory floor does not wait" in test/next-task-id-waits-for-the-shared-read-floor.test.ts'
  falsifier: |
    Leave next-task-id dispatched outside any floor scope. A stamp written 120 s ago then lets `openPrMintTexts` read
    at once with only the advisory line, as the 11:28:29Z mint did, and the second test fails. Keep the window a
    constant, and RMD_GH_COOLDOWN_S=0 still waits, so the third test fails. Make wait mode override an explicit env
    choice, and the gate gardener's spawn waits, so the fourth test fails.
