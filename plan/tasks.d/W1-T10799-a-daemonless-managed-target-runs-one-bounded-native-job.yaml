  design: >-
    This task does not decide module API names. Derive the call sites from
    W1-T10797's qualified report, and reuse only existing functions. (1)
    Routing. When the registry is readable, names no live instance for an
    enrolled managed target, and the core daemon's own root is readable and not
    halted, ProductBuildService writes the existing repo-scoped requestKick
    marker under the CORE root. It does not throw target_daemon_missing. These
    remain explicit refusals: an unreadable registry or managed set
    (target_unreadable), an unenrolled target, and a halted or unreadable core
    root. A live target instance keeps its own kick path unchanged. (2)
    Ownership. The core daemon admits such a marker only for an enrolled managed
    target that has no live instance of its own. It runs ONE bounded job, and
    only through the maintained drain. The steps are: derive the target clone
    plan path exactly as resolveDaemonTarget does; sync it from origin/main
    through the existing plan-sync refusal; apply applyCuratedSelection with
    exactly the one kicked task id, depth 1, max 1 and one lane; and run
    runDrain with the core daemon's own dispatch-claim, merged/open-PR, hold,
    budget, WIP, memory/headroom and review deps. It never raises any ceiling.
    The job never re-enters the target plan's other tasks, and it ends when that
    one dispatch reaches a terminal verdict. (3) Durability. The job is keyed by
    the kick origin that ProductBuildService already mints. Re-delivering the
    same request resumes or reports the same job and never spends twice. A
    daemon restart or lost response recovers the job from its durable record and
    from the dispatch claim. It never infers recovery from a marker or a branch.
    (4) Evidence. queued, admitted and running come only from correlated native
    receipts in the core ledger that readTargetExecution reads for that origin.
    refused, unknown and capacity-deferred are explicit outcomes. A marker, a
    fixture, free capacity or a managed profile alone never reads as admitted or
    running. Out of scope: browser commands, a new process or unit, a new
    instance registration, environment or access changes, cap increases, hold
    releases, manual claim deletion, and the Core18 plan producer, native-review
    protocol or evidence collectors (W1-T10618). Bind plan, merged/open-PR reads
    and dispatch claims to the verified TARGET owner, repository identity and
    target plan revision; reuse the Core host capacity services without
    inheriting Core-repository-specific query closures. Reserve the bounded job
    within the existing shared Core lane and WIP accounting before entering the
    maintained drain: simultaneous product requests with one available slot must
    admit at most one job, and defer the other explicitly. This adds no capacity
    or parallel scheduler.
