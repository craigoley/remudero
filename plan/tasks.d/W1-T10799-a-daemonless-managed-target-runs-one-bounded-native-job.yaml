  rationale: >-
    Functional prerequisite for W1-T10618 (Core18). Its worker refused criterion
    1 with needs-operator-input: "No shipped daemon serves Wreckterra; verified
    delivery requires an approved execution binding". This task is that binding.
    It is filed as a plan-only operation (run PLAN-clarify-1793095322512). It
    edits no source and releases no hold. OBSERVED CODE (worktree base at
    filing): ProductBuildService (src/lib/product-build.ts) defaults daemonRoot
    to registryDaemonRoot. That function returns "absent" when no live registry
    instance names the repository, and start() then throws
    target_daemon_missing. The only kick consumer is daemonKickPort
    (src/cli/commands/daemon.ts), and it offers a repo-scoped marker only to the
    daemon whose target names that repository. drainCommand (src/run-task.ts)
    accepts only --until, --max, --repo, --curated, --dry-run and --allow-stale.
    It always reads THIS checkout's plan; per its own comment, --repo "only the
    status gateway moves". So no existing drain reads a target repository's
    plan. resolveDaemonTarget (src/run-task.ts) is the only existing composition
    that derives a target clone's plan path (reposDir/<repo>/plan). It is
    reachable only through rmd daemon, which is persistent. runTask
    (src/cli/commands/run-task-verb.ts) already refreshes and works in the
    managed checkout of task.repo. The worker side therefore already supports a
    target-repo task. taskTargetsRepo (src/lib/drain.ts, W1-T988) states that
    the single-target daemon guard is "not multi-repo support". INFERENCE (by
    elimination, not observed wiring): the operator's constraints forbid a new
    persistent service, an alternate launcher, a detached fallback and any
    environment change. They also forbid importing CLI composition into a
    library. Under those constraints, the only existing process that owns kick
    consumption, lane supervision and every admission governor is the core
    daemon (runDaemon). It is therefore the native lifetime owner. The narrow
    exception to W1-T988 is bounded: one job, one task, one lane. It never makes
    the daemon a multi-repo scheduler. POLICY SOURCE vs RUNTIME:
    .remudero/managed-repos.json (reviewed source) enrolls craigoley/wreckterra.
    The live instance registry under the state dir is runtime configuration, and
    this filing did not read it. The retained W1-T10797 tail
    (state/runs/W1-T10797-1793093826672.tail) lies outside this worktree's
    file-tool confinement and was not read. Its reported call sites are
    therefore unqualified input, which is why W1-T10797 is a dependency. Settled
    by lookup: is this already filed or already decided? -> no. No plan shard,
