- id: W1-T5456
  title: "ONE UNPARSEABLE PLAN SHARD STOPS THE WHOLE FLEET — on 2026-10-03 a duplicate `priority:` key in plan/tasks.d/w1-t5431-selector-shadow-miss.yaml made the core daemon crash-loop at boot (PlanError: plan is not valid YAML, Map keys must be unique); W1-T4421 already quarantines a duplicate task ID and keeps running, but a shard that fails to parse still throws out of the plan read"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: low
  budget_usd: 35.00
  priority: 1
  status: queued
  attempts: 0
  origin: "operator session 2026-10-03: the outage that blocked the fleet for hours; the daemon-side half of the PR #8877 follow-up"
  plan_refs: ["W1-T4421", "W1-T4409", "W1-T245", "W1-T4802"]
  files:
    - src/lib/plan.ts
    - test/a-malformed-shard-is-quarantined-not-fatal.test.ts
  rationale: |
    READ 2026-10-03 over origin/main 231b7673b. `syncPlanFromOrigin` (src/run-task.ts) accepts a `quarantine`
    callback and, when it is given, reads through `mergePlanBlobsQuarantiningDuplicates` (src/lib/plan.ts),
    which only handles a task id declared in two files (reason `duplicate_id`, QuarantinedTask). Every shard
    blob is parsed by `parseTasksFromYaml`, which on a YAML error throws `PlanError("plan is not valid YAML
    (<label>): ...")`. Nothing between that throw and the daemon's boot catches it, so a single bad shard on
    origin/main stops dispatch for the whole fleet: the deployer then logged `deploy.unhealthy_rollback` and
    `deploy.skip` every five minutes. Two plan PRs that each lint clean can merge into an invalid shard (the
    gardeners edited the same record 28 s apart), so this is a recurring class, not a one-off.

  design: |
    (i) Extend the quarantine path in plan.ts: a shard blob whose YAML does not parse, or whose entries fail
    field validation, is QUARANTINED as a whole file with reason `unparseable` and the parse message. It is
    never the monolith: a monolith that does not parse stays fatal, because there is nothing to fall back to.
    (ii) A task in another file whose `depends_on` names an id that lived only in the quarantined shard is
    quarantined with reason `dependency_quarantined`, so the "every depends_on resolves" check does not turn
    one bad shard into a second PlanError. The dependents are named in the report.
    (iii) Each entry carries its `reason` and, for `unparseable`, the parse message, so the reporting half
    (a sibling task in run-task.ts) can name the file a person must repair. The daemon keeps dispatching
    everything else.
    (iv) Quarantine is read-side only. Nothing writes to or reverts the bad shard, and a quarantined shard
    that is repaired on main is read normally on the next tick with no state to clear.
    (v) The quarantine callback stays opt-in: CLI paths that validate the plan (`rmd lint-plan`, the CI gates)
    keep failing loud on the same input. Only the daemon's boot and tick reads degrade.

  acceptance:
    - claim: "a shard that is not valid YAML is quarantined and the rest of the plan loads"
      proof: 'grep: test("W1-T5456: a shard that is not valid YAML is quarantined and the rest of the plan loads" in test/a-malformed-shard-is-quarantined-not-fatal.test.ts'
    - claim: "a task depending only on a quarantined shard is quarantined too and named"
      proof: 'grep: test("W1-T5456: a task depending only on a quarantined shard is quarantined too and named" in test/a-malformed-shard-is-quarantined-not-fatal.test.ts'
    - claim: "a monolith that does not parse is still fatal"
      proof: 'grep: test("W1-T5456: a monolith that does not parse is still fatal" in test/a-malformed-shard-is-quarantined-not-fatal.test.ts'
    - claim: "the lint and CI path still fails loud on the same shard"
      proof: 'grep: test("W1-T5456: the lint path still fails loud on the same shard" in test/a-malformed-shard-is-quarantined-not-fatal.test.ts'
    - claim: "a quarantined entry carries its reason and the parse message"
      proof: 'grep: test("W1-T5456: a quarantined entry carries its reason and the parse message" in test/a-malformed-shard-is-quarantined-not-fatal.test.ts'
  falsifier: |
    Let a malformed shard throw out of the daemon's plan read, or let the lint path swallow it. The affected
    proof must fail. CLOSE THIS TASK without implementation if `git grep -n "unparseable" src/lib/plan.ts`
    already shows a shard-level quarantine.

  notes: |
    The CI-side half (a plan-writing gardener lints the merged result before it lands) is the sibling task.
    Both are needed: this one limits the damage, the other stops the cause.
