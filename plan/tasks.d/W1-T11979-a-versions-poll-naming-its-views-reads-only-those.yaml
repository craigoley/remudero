- id: W1-T11979
  title: A versions poll that names the views its page shows counts as a read of only those views, so an open console tab no longer keeps every view on its hot cadence
  repo: remudero
  depends_on:
    - W1-T11973
  priority: 1.4
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # an added optional query parameter; a poll without it behaves as today
  band_meaning: blast-radius
  origin: operator-session#serve-idle-2026-11-10
  plan_refs:
    - W1-T11127
    - W1-T11815
  files:
    - src/lib/read-model-worker.ts
