  rationale: |
    WHY: the largest single daemon loop stall under pid 1098566 (OBSERVED, host core ledger, 2026-11-20 00:46:28Z) was
    253,258 ms of lag, 248,261 ms of it sync spawn: execFileSync git -C (worktree remove) in worktreeRemove, under
    buildHealedReviewerTree. buildReviewerHealthRoute in src/run-task.ts hands buildHealedReviewerTree a sync
    worktreeRemove for both its remove and its cut's leftover fallback, although buildHealedReviewerTree accepts an
    async remove and src/lib/worker.ts already has worktreeRemoveAsync. A stalled loop holds every review admission,
    merge and sweep for the stall's length.
  design: |
    src/lib/worker.ts: healedReviewerTreeTools(repoDir, worktreeRoot, prepare) returns { cut, remove }. remove is
    worktreeRemoveAsync. cut calls prepare; when it refuses, it awaits worktreeRemoveAsync on
    <worktreeRoot>/<prefix>-<sha12> and prepares again, and when nothing is there to remove the cut's own refusal
    stands, as today. buildReviewerHealthRoute builds its cut and remove from it, passing prepareFreshOriginMainTree as
    prepare. buildHealedReviewerTree is unchanged. prepareFreshOriginMainTree's own sync add is out of scope.
    INVARIANT cut-refusal-stands: a refused cut with nothing to remove rejects with the cut's own error.
  falsifier: |
    Use the sync worktreeRemove in healedReviewerTreeTools again: criteria 1 and 2 fail (the tree is removed, or cut
    again, on the caller's turn of the loop); the invariant test still passes.
