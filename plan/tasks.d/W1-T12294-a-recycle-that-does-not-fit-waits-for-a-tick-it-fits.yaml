      proof: 'grep: test("W1-T12294: the next tick tries the recycle again with no back-off" in test/deploy/a-recycle-that-does-not-fit-waits-for-a-tick-it-fits.test.ts'
    - claim: "The fit check runs on each tick, and the recycle starts on the first tick at which it fits: the runs in flight have ended, or their predicted remainder plus the time outside the wait fits the time left. The script then gets the derived wait, as in W1-T12247"
      proof: 'grep: test("W1-T12294: the recycle starts on the first tick at which it fits" in test/deploy/a-recycle-that-does-not-fit-waits-for-a-tick-it-fits.test.ts'
