    - claim: "Deferrals tick after tick never count toward the refusal streak. Over five deferrals the deploy cycle writes no `deploy.refusal_persisting` row and no `deploy.refusal_escalated` row, calls no `escalateRefusal`, and leaves a refusal streak of another reason as it was"
