  rationale: |
    WHY: for about 30% of every hour no review starts on the core daemon, while green PRs wait. The fleet spends
    the GitHub App installation's core budget down to the 10% write reserve (W1-T12553) 15 to 35 minutes before
    each reset. From then until the reset, the light pass decides from its last good open-PR list (W1-T12755),
    which is what that task is for. But on a last good list every acting PR's head is re-read at act time, and
    that read is an ordinary core read, so the budget refuses it too. Every admitted review stands down, the
    other green PRs are "not admitted this pass ... admitted #A, #B, #C, #D ahead", and the next pass repeats it.
    W1-T12755 keeps a pass moving when the list read is slow; it cannot when the list read failed for budget.
    OBSERVED on the Azure host core ledger, 2026-11-15 10:00Z to 16:06Z (rotated segments plus ledger.ndjson):
    - github.budget.throttled reason reserve (or share) at 10:35:51Z, 11:42:27Z, 12:56:31Z, 13:49:23Z and
      15:54:22Z, each with remaining 1494 to 1507 of 15000 and the reset at about :09 past the next hour.
      Together these reserve windows are 108 of the 366 minutes.
    - 360 of 361 sweep.action_failed rows "act-time head of PR #N is unreadable on the last good open-PR list
      — standing down" fall inside those windows, and all 72 sweep.review_refill.skipped rows "live head
      unreadable". The 197 sweep_light.views_fallback rows in the windows carry error "gh call pacer stood down:
      core at 1494/15000, at or below the floor".
    - Review starts (sweep.review_started): 12 in the 108 window minutes, 127 in the other 258 (0.11 against
      0.49 a minute). review.posted: 2 in, 54 out. sweep.post_review.done: 4 in, 87 out.
    - 2026-11-15 15:54Z to 16:06Z: #18575, #18689 (checks green) and #18539, #18582 were admitted every pass and
      stood down every pass; #18690 and #18692 were "not admitted this pass: semantic post-review admission
      bound 4, in-flight 1; admitted #18539, #18575, #18582, #18689 ahead". review.capacity in the same minutes
      had effective_width 4 = base_width 4, so neither the width nor the host-worker budget held these starts.
    READ at origin/main 455ed55d9:
    - src/lib/light-pass-open-pr-list.ts:126-133 headReadOrStandDown throws when readLiveState returns ok:false.
    - src/cli/commands/sweep.ts:1369 wires it as readLiveStateAtAct on a last good list; src/lib/sweep.ts:23485
      (lane act) and :27370 (refill) call it.
    - src/run-task.ts:7640 liveStateSteps reads one PR over REST (singlePrRestArgs) and returns ok:false on
      any throw, so a GhPaceFloorStandDownError becomes "unreadable".
    - src/lib/github-transport.ts:635-660 every non-write core read goes through claimRead;
      src/lib/github-installation-budget.ts:175-176 refuses all reads while remaining <= the 10% reserve.
    - The reserve exists "so merges, reviews and comments still land" (github-installation-budget.ts:19). A
      review or merge decided from a last good list cannot land without its act-time head read, so the reserve
      currently blocks the very writes it keeps room for.
    COST of the change: one read per acting PR per pass. At width 4 and a pass about every 3 minutes, a 25-minute
    window spends about 35 reads of the 1,500-read reserve.
  design: |
    INVARIANT no-act-on-a-moved-head: unchanged from W1-T12755. A moved act-time head stands down as
    sweep.head_moved; an unreadable one stands down; a merge from a last good list names the list's head.
    INVARIANT reserve-reads-are-act-time-only: only the act-time head read that gates a review post, refill or
    merge on a last good list may read inside the write reserve. Every other read keeps today's refusal.
    INVARIANT bounded-reserve-spend: a reserve-class read stops at the pacer floor (DEFAULT_GH_PACE_FLOOR_FRACTION
    of the limit, the existing 2%), never at zero, and it is counted like any other read.
    1. src/lib/github-transport.ts: export withActTimeHeadReads(fn), an AsyncLocalStorage scope (the module
       already uses one, ghLoopHost). admitInstallationReadAsync and admitInstallationReadSync, inside that
       scope, ask the budget for a reserve-class read instead of claimRead.
    2. src/lib/github-installation-budget.ts: add claimReserveRead() beside claimRead(): ok while remaining is
       above the pacer floor (a fraction passed in, not a new number), counted in the same shared Reads slot;
       refused with reason "reserve" at the floor. claimRead and the W1-T12553 share and reserve rules stay as
       they are.
    3. src/lib/light-pass-open-pr-list.ts: headReadOrStandDown runs read(pr) inside withActTimeHeadReads. Its
       stand-down for ok:false or a missing head stays.
    4. Add the focused test file for criteria 1 to 5. Criterion 5 drives buildSweepLightHook end to end with
       the real budget and the gh shim, as W1-T12755 criterion 6 does.
    NOT IN SCOPE: who spends the installation budget to the reserve each hour (W1-T12553, W1-T12555); the
    open-PR list read itself; the review child's own reads; the excluded head-task-metadata refusals (W1-T12883);
    reviews withheld as "materially behind" (W1-T12824). No ceiling, width or reserve fraction changes.
