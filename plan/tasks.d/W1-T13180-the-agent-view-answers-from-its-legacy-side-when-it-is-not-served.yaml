  status: merged
  attempts: 0
  acceptance:
    - claim: "With no agent entry in read-model/switches.json (mode off), GET /v1/views/agent?instance=core&part=proposals answers 200 with a body computed by the same operator-agent readers the worker's body uses, where today it answers 404 view_disabled"
      proof: "grep: W1-T13180 criterion 1 in test/console-api/read-model/the-agent-view-answers-from-its-legacy-side-when-it-is-not-served.test.ts"
    - claim: "In shadow mode the legacy side answers (legacy primary) and the request is still offered to the shadow comparator; in serve mode the worker's body answers as today"
      proof: "grep: W1-T13180 criterion 2 in test/console-api/read-model/the-agent-view-answers-from-its-legacy-side-when-it-is-not-served.test.ts"
