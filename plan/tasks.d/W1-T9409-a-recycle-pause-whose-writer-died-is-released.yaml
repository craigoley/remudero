  design: |
    Operator rules: no fixed threshold and no timer. A PAUSE is released only on proof that its writer is gone,
    and never when the hold belongs to an operator.
    1. THE BODY MAKES THE CHECK EXACT. deploy/recycle-container.sh keeps `reason` exactly as it is (W1-T5127 and
       W1-T5804 key on it) and adds these fields to the PAUSE it writes:
         - `container`: the full docker Id of CONTAINER_NAME, read before the write;
         - `containerName`;
         - `writerStart`: the writer's own process start time, from a portable `ps -o lstart= -p $$`;
         - `phase`: "waiting".
       Just before `docker stop` (where RECYCLE_SIGNAL_PHASE flips), the script rewrites the body with
       phase "stopping", only if the file still holds RECYCLE_PAUSE_BODY, and updates RECYCLE_PAUSE_BODY so
       `clear_own_pause` still matches its own.
    2. AN ERROR EXIT IN THE WAIT PHASE TAKES ITS PAUSE WITH IT. The EXIT trap calls `clear_own_pause` when the
       exit status is non-zero and the phase is still waiting. This covers a `set -e` abort like 10-14's rc=2,
       as W1-T5281 already does for signals. After the stop phase the PAUSE stays, as today.
    3. THE HOST TICK RELEASES WHAT NO TRAP CAN. Add deploy/release-orphan-recycle-pause.sh
       (--container NAME --state-dir DIR). The watchdog tick in deploy/install-host-units.sh calls it in the
       container-running branch, before the unchanged-tick exit, as it calls memory-high-tuner.sh: bounded and
       never fatal to the tick. It releases only when ALL of these hold:
         (a) the PAUSE parses and its `reason` is exactly the recycle's. Anything else is an operator hold
             (the W1-T4197 rule) and is kept without a ledger row;
         (b) `phase` is "waiting". After "stopping", the replacement path owns the PAUSE;
         (c) `host` equals this host's hostname. Another host's pid cannot be judged here;
         (d) the writer is dead: no process has that pid, or the process that has it started at a time other
             than `writerStart` (the pid was reused);
         (e) docker reports the recorded `container` Id as the running container under `containerName`
             (State.Running true, Id equal).
       Any unreadable input (docker or ps failing, a field missing) means keep. Releasing re-reads the body
       byte-for-byte and then moves it aside to state/PAUSE.orphaned-recycle-<pid>; it is never deleted. The
       script appends a ledger row, step `recycle.orphan_pause_released`, lane deploy. The row names the
       writer pid, host and writerStart, the container, requestedAt, and the evidence for (d) and (e).
    4. AN OLD-SHAPE BODY IS NEVER RELEASED. A recycle PAUSE without `container`, `phase` or `writerStart`, like
       the one on 2026-10-14, is kept. When its writer is dead on this host, the tick ledgers
       `recycle.orphan_pause_unverifiable` once per body, naming the writer, for a human to act on.
    5. No setsid change. W1-T5281 already tells ssh users to run the recycle detached. On 10-14 the writer was
       a systemd oneshot, and (3) covers SIGKILL under either launcher.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Drive
    deploy/release-orphan-recycle-pause.sh against a fixture state dir with a stub `docker` on PATH. A dead
    writer is a child that was spawned and reaped. A live writer is a running child with its real start time.
    Drive the EXIT-path test through the real recycle-container.sh, using the W1-T5281 test's stub technique.
