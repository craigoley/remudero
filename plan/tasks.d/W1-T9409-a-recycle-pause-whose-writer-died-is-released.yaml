  falsifier: |
    Against main, write the 10-14 PAUSE with a reaped pid and a stub docker that reports the old container
    running. Run the watchdog's checks. The PAUSE stays forever and no row is written, so the first test fails.
    If the release script ignores `phase` or `reason`, the after-stop and operator tests fail. If it reads any
