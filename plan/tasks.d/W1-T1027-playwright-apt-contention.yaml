    - claim: the shard establishes from a green run that the apt dependency installs only fonts
      proof: "grep: APT IS ONLY THERE FOR FONTS in plan/tasks.d/W1-T1027-playwright-apt-contention.yaml"
    - claim: the shard separates the already-shipped bounding change from the unfixed hang
      proof: "grep: W1-T1009 BOUNDS AND DOES NOT PREVENT in plan/tasks.d/W1-T1027-playwright-apt-contention.yaml"
    - claim: the shard forbids bundling the workflow change with any product path under Rule 25
      proof: "grep: THIS IS AN INSTRUMENT-ONLY CHANGESET in plan/tasks.d/W1-T1027-playwright-apt-contention.yaml"
    - claim: the shard requires both duplicated copies of the step to be fixed together
      proof: "grep: ONE STEP DUPLICATED ACROSS TWO JOBS in plan/tasks.d/W1-T1027-playwright-apt-contention.yaml"
    - claim: the shard refuses a single green run as evidence, since the failure is contention
      proof: "grep: A GREEN RERUN IS NOT A FIX in plan/tasks.d/W1-T1027-playwright-apt-contention.yaml"
    - claim: the existing workflow-shape assertions still hold after the step is changed
      proof: "unit test: test/workflow-job-timeouts.test.ts"
