  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) exempts only
    `risk === 'high'` and returns clean only below two subsystems, and `files:` spans `.github/`
    and `test/`. The band is Rule 19's SPAN, not blast radius — the runtime effect is one setup
    step in one workflow file.

    `files:` IS DERIVED, NOT GUESSED. `.github/workflows/ci.yml` holds both copies of the step.
    `test/workflow-job-timeouts.test.ts` is declared because it already asserts, by CONTENT, that
    exactly `ci` and `coverage-ratchet` carry a `playwright install` step — a remedy that changes
    the run line moves that assertion, so the file is genuinely touched rather than merely nearby.
    `test/workflow-playwright-install.test.ts` does NOT exist and is declared as a NEW path:
    forward-referencing a path is safe where a symbol would be a guess, and CLAUDE.md requires a
    coverage-load-bearing test in its own file. Sixteen test files read `.github/workflows/ci.yml`;
    the other fourteen assert unrelated properties (title linting, dependency review, NUL bytes)
    and are deliberately excluded. `src/run-task.ts` is NOT declared — this change does not touch
    it, and every task naming the monolith serialises against every other that does (W1-T471). The
    shard's own path is not declared either, which would convert the endemic proof-scope warnings
    into one hard `rule15-filing` violation.

    THE REMOTE RESERVATION WAS REFUSED, and the two refusal signatures were distinguished rather
    than conflated. W1-T1026 was swept clean minutes earlier and then genuinely taken: the push
    came back `! [rejected]` and a readback returned `cc34133f`, whose anchor commit reads
    `reserve W1-T1026 nonce=Craigs-Mac-mini-18450-...` — the mini's own allocator, live and
    minting. Every attempt from W1-T1027 upward then returned the TRANSPORT limit instead, verbatim
    and with no `! [rejected]` line anywhere:
      error: RPC failed; HTTP 403 curl 22 The requested URL returned error: 403
      send-pack: unexpected disconnect while reading sideband packet
      fatal: the remote end hung up unexpectedly
      Everything up-to-date
    That trailing `Everything up-to-date` is why the exit code was captured in a variable rather
    than read through a pipe. WHAT THE 403 IS, stated only as far as it was observed: a REST
    branch-delete from the same container returned an explicit refusal — `Write access to this
    GitHub API path is not permitted through this proxy` — so at least the REST write path is
    proxy-blocked here. The git-over-HTTPS ref push returned a bare `HTTP 403 curl 22` with no
    message, which is CONSISTENT with the same block but is not the same observation and is not
    reported as one. Either way it is the class W1-T518 files, and the filing proceeds without a
    reservation rather than being held by it. W1-T1027 is free on all three
    readable surfaces at filing time — reservations, filed ids across `plan/tasks.yaml` plus every
    `plan/tasks.d/` shard, and open-PR titles/bodies/branches — each checked with a positive
    control (W1-T1026 reserved, W1-T1019 filed, W1-T1021 named by an open PR)."
