  note: "risk:high IS RULE 19'S SPAN, NOT BLAST RADIUS — recorded up front rather than shipped as a
    lint violation. `subsystemsOf` reads two concerns off this `files:` list (the dispatcher module
    and its suite), and W1-T411 records the same list shape failing sizing at `risk:medium` with
    the exact message `spans 2 distinct subsystems/concerns … raise to risk:high or decompose`.
    Decomposing is not available: the change is one conditional and one field in one function, and
    its only assertions live in the one declared suite. THE ACTUAL BLAST RADIUS IS ONE LEDGER ROW
    PER DAEMON BOOT — no reap decision, no age arithmetic, no predicate and no policy field is
    touched, and the worst regression is a row nobody reads.
    budget_usd 25 — above W1-T1061's 20 (one field on an existing row) because this also reverses a
    shipped assertion and adds a roots-count, and well below W1-T320's 75, which ships a policy row
    with a real reader plus a cadence hook.
    verify:auto — every criterion is decidable in-process against the injectable `roots`/`reap`/
    `policy` deps the function already accepts and the suite already uses. Nothing spawned, no
    network, no operator.
    `files:` DECLARES THE SUITE because a proof naming a path outside `files:` is a proof-scope
    warning at filing and a scope-guard REFUSAL after the work is done — the W1-T309 lesson. The
    suite EXISTS today (test/clone-reap-wiring.test.ts, which is where the assertion being reversed
    lives), so no new file is created and the whole-file proof form executes on day one.
    NO depends_on, established rather than assumed. W1-T320 edits src/lib/tmp.ts, src/run-task.ts,
    src/lib/policy.ts and plan/policy.yaml; W1-T411 edits src/run-task.ts. The only overlap with
