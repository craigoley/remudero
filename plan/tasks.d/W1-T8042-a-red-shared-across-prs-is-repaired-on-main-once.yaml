  design: |
    Operator ruling: no hard thresholds. "Shared" is structural, not a tuned count.
    1. CORRELATE. Each full sweep pass computes, for every red open PR, the signature of each failing check:
       the check family (shard index folded, as mainRedSignature does) plus its W1-T8038 ciFailureSignature.
       A signature is MAIN-INHERITED when both of these hold:
       a. It is red on more than one open PR, and none of those PRs' own diffs (vs merge base) touches a file
          the signature names (the failing test, a pool leaker or victim, a BLOCKED gate's input).
       b. Every affected head's merge base already contains one main commit that none of the green-on-that-
          check heads of the same PRs (or main's last concluded run on that check) contained.
       A PR whose own diff touches a named file is never classified main-inherited. It may be the cause, and
       it keeps its own lane.
    2. STAND DOWN. A PR whose every red is main-inherited is disposed `blocker: main-inherited,
       blocker_owner: main-repair`. It spends no fix strike and gets no job re-run or base refresh for that
       red. The stand-down reason names the signature and the other PRs sharing it.
    3. ONE REPAIR. Hand the signature to the #10731 main-repair lane once, as a red signature with its PR
       evidence (PR numbers, heads, first-seen times, the candidate main commit from 1b). That lane's
       signature-keyed dedupe means a second pass, or a sixth PR, advances the same record and never opens
       another. If main's own run later concludes red on the same signature, that is the same record.
    4. RELEASE. When a PR's check goes green or its signature changes (after a main refresh or the repair
       merging), it returns to its ordinary lane on the next pass. Nothing in this task holds a PR longer than
       its signature stays shared.
    Tests go in a new file, test/a-red-shared-across-prs-is-repaired-on-main-once.test.ts, with `test(`
    titles verbatim as in the proofs below. Drive runSweep with three open PRs replaying the 10-11 shape:
    disjoint diffs, the same ci-shard signature, a recording dispatchFix, requeueCheck and main-repair
    handoff. Add a fourth PR whose own diff touches the named test file.
