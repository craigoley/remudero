    budget_usd 50 — the logic is a fold over records; the cost is clause (iv)'s branch, because the
    implementer may discover mid-task that no durable history exists and must then also ship the
    emission. If that branch is taken, expect the upper end.
    verify:auto — every claim is decidable in-process over a seeded history fixture. Nothing spawned,
    no Stryker invocation, no network.
    CLAUSE (iv) IS A REAL FORK, NOT A HEDGE. Establish FIRST whether the gate's verdicts survive
    anywhere durable, and record that finding in the PR body before writing the rung — the answer
    determines whether this task reports a lifetime or merely starts one, and a reader six months from
    now needs to know which of the two they are looking at."
