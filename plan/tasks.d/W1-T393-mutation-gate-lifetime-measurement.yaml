    - claim: "an empty history fails the positive control instead of reporting zero escapes as a result"
      proof: "unit test: test/mutation-gate-lifetime.test.ts"
    - claim: "the rung is reached from the retro gather rather than merged unwired"
      proof: "unit test: test/mutation-gate-lifetime.test.ts"
