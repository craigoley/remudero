- id: W1-T2485
  title: "THE DEAD-CAPABILITY REPORT STILL HAS NO SCHEDULER, AND NOW THAT ITS CORPUS IS TRUSTWORTHY IT SHOULD GET ONE — W1-T2479 fixes the population and its control; this gives the corrected report a cadence beside the five verbs already on that spine, as a REPORT into the digest and never a proposal minter, because a verb writing no ledger line has no determinate fix"
  repo: remudero
  depends_on: [W1-T2479]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 12.00
  files: [src/lib/measurement-cadence.ts, src/run-task.ts, test/the-verb-census-reaches-a-reader.test.ts]
