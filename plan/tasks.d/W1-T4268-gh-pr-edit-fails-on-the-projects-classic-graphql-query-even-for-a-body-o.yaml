  rationale: |
    HARVESTED VERBATIM from the fix worker dispatched at 2026-09-14T07:19:45.398Z (strike 2, round
    "fresh", mode ci-log) against RETRO-1789367285330's own plan-only PR #5499 (run DAEMON-1789365794642;
    ledger: fix.dispatch at that exact timestamp, then automerge.armed + fix.resolved "review passed" at
    07:19:53-54). Its follow-up: `gh pr edit`'s underlying GraphQL mutation errors on this repo/token with
    "Projects (classic) is being deprecated … (repository.pullRequest.projectCards)" even for a body-only
    edit; `gh api -X PATCH` worked as a substitute.

    W1-T2948 (merged; verified live in src/run-task.ts:3579-3637) already fixed the HALF of this that the
    harness controls: every one of its OWN PR-body writers — the acceptance-gate repair, the trailer
    stamp, the retro repair — was rerouted off `gh pr edit --body` onto `prBodyRestArgs`/`writePrBodyRest`,
    a REST `PATCH repos/{owner}/{repo}/pulls/{number}` call, precisely because that GraphQL query selects
    `repository.pullRequest.projectCards`. That fix is real and this task does not touch it, extend it, or
    duplicate it.

    WHAT IT DOES NOT COVER, AND WHAT THIS RUN JUST PROVED: a worker's OWN ad hoc `gh pr edit` invocation —
    title, body, or label edits it issues directly in its own session, never routed through the harness's
    internal writer — hits the identical failure with zero guidance. Verified by grep across
    src/lib/compaction.ts, src/lib/prompt-render.ts, and every learnings/{platform,architecture,ci,
    testing,failures}.yaml shard: none mentions `gh pr edit`, `projectCards`, "Projects Classic", or
    `-X PATCH`. A worker hitting this today has no signal telling it the command's failure is a TRANSPORT
    defect rather than evidence the edit was rejected — it would either silently give up, treat its own
    edit as never having landed, or (as this run did) burn turns rediscovering the REST substitute from
    scratch. compaction.ts's own `outputContractLines` ALREADY coaches workers through a `gh pr create
    --title ...` invocation a few lines above its `WORKER_PR_AUTHORITY_LINES` splice (the "shared authority
    boundary for both PR-authoring worker prompts") — the exact neighbourhood this fact belongs in.
  design: |
    ONE new shared constant, `GH_PR_EDIT_FALLBACK_LINES: readonly string[]`, defined in
    src/lib/compaction.ts immediately beside `WORKER_PR_AUTHORITY_LINES` (same file, same "shared
    authority boundary for both PR-authoring worker prompts" precedent that constant already documents).
    Content: (a) names the specific failure signature a worker would see verbatim in its own terminal —
    "Projects (classic)" / `repository.pullRequest.projectCards` — so it is recognized as THIS documented
    case rather than treated as a novel failure worth escalating or silently accepting; (b) states plainly
    that a `gh pr edit` failure carrying that signature is a TRANSPORT failure, never evidence the edit was
    rejected or already applied; (c) gives the literal working substitute shape, reusing EXACTLY what
    src/run-task.ts's own `prBodyRestArgs` (W1-T2948) already proved correct rather than inventing a
    second, unverified transport: `gh api -X PATCH repos/{owner}/{repo}/pulls/{number} -f <field>=<value>`
    (e.g. `-f body=…`, `-f title=…`); (d) carries forward the `-f`, never `-F` warning W1-T2948's own
    comment already documents (`-F` reads a leading `@` value as a FILENAME and substitutes
    `{owner}`/`{repo}`/`{branch}` placeholders), so a worker fixing this gotcha does not open a new one.

    SPLICE POINTS, mirroring `WORKER_PR_AUTHORITY_LINES`'s own placement exactly so the two prompts cannot
    drift: `...GH_PR_EDIT_FALLBACK_LINES` immediately beside the existing `...WORKER_PR_AUTHORITY_LINES`
    line inside `outputContractLines()` (compaction.ts, the implement contract), AND immediately beside
    `renderFixPrompt()`'s own `...WORKER_PR_AUTHORITY_LINES` line (prompt-render.ts:509, the fix contract) —
    imported from compaction.ts exactly as `WORKER_PR_AUTHORITY_LINES` already is, never a second copy of
    the wording.

    SCOPE FENCE: zero new call sites in src/run-task.ts; zero changes to the harness's own internal
    PR-body/trailer/retro writers, which are W1-T2948's and already shipped, already REST-only. This task
    is exclusively the worker-facing PROMPT gap left open — a worker's own `gh pr edit` invocation, which
    the harness cannot see or intercept in advance, only warn about.
