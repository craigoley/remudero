      proof: "grep: GH_PR_EDIT_FALLBACK_LINES in src/lib/prompt-render.ts"
    - claim: "the task adds no new call site to src/run-task.ts and touches none of the harness's own internal PR-body/trailer/retro writers — this is prompt text only, never a second REST-write implementation competing with W1-T2948's"
      proof: 'grep: test("W1-T4268: the task adds no run-task call site and no second REST-write implementation" in test/gh-pr-edit-fallback-contract.test.ts'
  note: |
    RISK regraded medium->high for span alone (compaction.ts + prompt-render.ts are two distinct module
    stems under the Rule-19 sizing count) — the blast radius is the opposite of the band: a two-line
