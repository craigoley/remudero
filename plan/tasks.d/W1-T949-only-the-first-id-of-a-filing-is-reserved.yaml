    THE ID RESTS ON THE FOUR-SURFACE SWEEP, BECAUSE THE RESERVATION COULD NOT BE OBTAINED. The
    gated push to refs/rmd-id/W1-T949 was attempted FIRST, with a unique orphan payload over the
    empty tree (4b825dc6), a host-pid-nanosecond nonce in the message, the refspec braced, and the
    exit code captured into a variable rather than read through a pipe. It exited 1 with
    `send-pack: unexpected disconnect while reading sideband packet` / `fatal: the remote end hung
    up unexpectedly`, and the readback (`git ls-remote origin refs/rmd-id/W1-T949`) came back EMPTY
    — so the ref is ABSENT and the mint did not take. SO THE SWEEP IS THE WHOLE BASIS, and it was
    run over FIVE surfaces rather than four, because the monolith owns ids the shards do not
    (clause (vii) names that omission as a defect in the procedure): W1-T949 read 0 against
    refs/rmd-id/* (46 refs, max W1-T946), 0 against shard filenames on origin/main (max W1-T947), 0
    against plan/tasks.yaml (max W1-T280), 0 across every open PR's file list (#2042, #2043), and 0
    across every open PR's title. Highest id claimed on ANY surface was W1-T948, from open PR
    #2042's file list. TWO POSITIVE CONTROLS ON THE SAME INVOCATIONS: W1-T947's shard filename reads
    1 on the filename surface, and refs/rmd-id/W1-T946 reads 1 on the ref surface — so both
    zero-returning queries were demonstrably able to see their corpus.
