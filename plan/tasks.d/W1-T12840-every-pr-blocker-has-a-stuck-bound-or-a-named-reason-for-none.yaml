      proof: "grep: W1-T12840 criterion 5 in test/github/every-pr-blocker-has-a-stuck-bound-or-a-named-reason-for-none.test.ts"
  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - READ src/lib/sweep.ts stageBackstops: bounds exist for 6 of the 17 PR_BLOCKERS: awaiting-arm, security-alert-hold, security-unknown-hold, conflict and awaiting-review at 30 minutes, own-red at 45.
    - READ src/lib/pr-blocker.ts SLO_CLIMBING_BLOCKERS: the SLO ladder climbs for awaiting-ci, strikes-exhausted, escalated, conflict, plan-proof-unrunnable and other.
    - review-failed (owner fix-lane), base-red (main-health), held-draft (ready-draft), operator-hold (operator) and stale-reviewer-withheld (deploy-freshness) have neither. A PR can sit under one of them with nothing reporting it.
    - By 2026-11-15T02:48Z, 5 of 32 open PRs were review-failed. One of them, #18449, had been open about 23 hours. Its blocker is not in either list.
    - The repo's recurring defect is a bound that fires on a healthy condition, so each new bound must come from the measured population of cleared episodes and not from the neighbouring constants.
  design: |
    1. Measure first: from sweep.disposed episodes over 14 days, compute per-blocker cleared-episode durations for the five blockers. Set each bound at or above the p95 and state the figures beside the constant.
    2. sweep.ts: add the five bounds to the default stageBackstops; reportStuckStage needs no new branch.
    3. pr-blocker.ts: add the named no-bound list (with reasons) for blockers that deliberately have none, and keep operator-hold out of SLO_CLIMBING_BLOCKERS.
    INVARIANT the-six-existing-bounds-are-unchanged: no existing minutes value or ladder membership changes.
    NOT IN SCOPE: new remedies for the five blockers, the fix lane's strike ladder, and non-fleet heads (W1-T12841).
  falsifier: |
    Remove a new bound and criterion 1 must fail. Change an existing bound and criterion 2 must fail. Add a blocker to PR_BLOCKERS with no bound and no reason and criterion 4 must fail. Let the ladder act on operator-hold and criterion 5 must fail. Restore and all pass.
