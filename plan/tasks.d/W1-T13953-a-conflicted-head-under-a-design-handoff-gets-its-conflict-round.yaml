  rationale: |
    OBSERVED 2026-11-20 (host ledger and GitHub): #19655 (W1-T12270) went mergeable_state dirty. Its conflict round
    ended fix.needs_design_routed kind=design at 2026-11-19 21:19:59Z. Every branch update since returned 422
    conflict (22:13Z, 11:02Z), and the latest disposition (12:19:31Z) read "task contract amended under this
    terminal design handoff — adopting main before any fix admission — NOT DISPATCHED: amendment refresh failed;
    awaiting new evidence/operator answer" (sweep.ts). update-branch cannot merge a conflicted head, so the PR sat
    16 h with a stale pending review status. Hand-merged 2026-11-20 (c5c3c168f; one hunk in read-model-worker.ts).
  design: |
    INVARIANT clean-head-adopts-main: only a conflicted head changes route.
    1. In the amended-design-handoff arm of the sweep, read the PR's conflicted state first; conflicted routes to
       the existing conflict dispatch (the conflicted disposition), not to update-branch.
    2. A 422 "merge conflict" from update-branch marks the head conflicted for the next pass.
  falsifier: |
    Without the route criterion 1's conflicted fixture disposes "amendment refresh failed" and dispatches nothing.
