    - claim: "Explicit and unreadable escalations retain their questions and conservative fallback behavior"
      proof: "unit test: W1-T10365: explicit review escalations retain their questions"
  falsifier: |
    In an owned disposable clone keep all tests identical and remove only the age-conditioned
    factual template/check changes. The open-age and current-cached-message regressions must
