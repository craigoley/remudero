- id: W1-T3672
  title: "THE DAEMONS EMIT A `gh: Not Found (HTTP 404)` EVERY POLL AND IT DROWNS STDOUT — 177 lines in 30 minutes on console, 66 on site, zero on core, while every ledger step reports ok; the noise is benign and it is why 1,232 dispatch refusals went unnoticed for ten hours"
  repo: remudero
  depends_on: []
  type: diagnose
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 30.00
  files: [docs/recon/the-polled-404.md]
  origin: oper#gap-sweep-2026-09-16
  plan_refs: ["W1-T3657"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-16 across the three live instances, over the same 30 minutes:

        remudero-console-daemon   177 x "gh: Not Found (HTTP 404)"
        remudero-site-daemon       66 x
        remudero-daemon             0 x

    It is NOT a failure. In the same minute a 404 was emitted, the console instance's ledger shows
    `board_gateway.fetch_ok` twelve times, `board_gateway.issue_fetch_ok` five times,
    `board_snapshot.unchanged` ten times and two clean `sweep.summary` rows. Every sweep completes.
    The 404 is a `gh` stderr line from a call whose failure is tolerated and never ledgered.

    WHY IT IS WORTH A TASK ANYWAY, AND THIS IS THE WHOLE ARGUMENT. Stdout is the only place a
    pre-dispatch refusal is reported. On 2026-09-16 the console daemon refused CONSOLE-T12 1,232
    times over 10.4 hours and the site daemon refused three PORTAL tasks 30 times, blocking that
    fleet completely -- and none of it was noticed, because reading that stdout means reading past
    a 404 every few seconds. A benign line emitted often enough is not benign: it is a signal
    suppressor.

    THE ASYMMETRY IS THE CLUE. Core emits zero. Site and console emit hundreds. Whatever the call
    is, it is something the two non-core instances do and core does not, on a poll cadence -- one
    roughly every 25 seconds on site, faster on console.

    WHY diagnose AND NOT implement. The call has not been identified: it is not the board gateway
    (those all report ok), not the heartbeat (no beat ref exists in ANY repo, and core would 404
    too), and not repo reachability (both repos answer 200). Filing a fix for an unidentified call
    would be a guess, and this project has paid for those.
  acceptance:
    - claim: "the recon names the exact gh invocation that 404s, with the evidence that identifies it rather than a hypothesis"
      proof: "grep: THE CALL in docs/recon/the-polled-404.md"
    - claim: "the recon explains the core-versus-others asymmetry, since any answer that does not is not the answer"
      proof: "grep: WHY CORE DOES NOT in docs/recon/the-polled-404.md"
    - claim: "the recon rules on whether the call should be fixed, silenced or ledgered, rather than only describing it"
      proof: "grep: RULING in docs/recon/the-polled-404.md"
  falsifier: |
    A recon naming a candidate without evidence fails the first criterion. One that does not
    account for core emitting zero has not identified the call, whatever else it found. One with no
    ruling is a description, not a diagnosis.
