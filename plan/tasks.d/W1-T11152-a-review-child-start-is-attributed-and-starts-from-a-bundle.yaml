- id: W1-T11152
  title: "A review's time from admission to running is attributed per launch segment, and the fresh-tree reviewer starts from the store's bundle instead of a cold tsx `bin/rmd review` — code reviews held their slot 25.0 h a week between admission and process start, plus 11.2 h from start to the pending post, and the 89 reviews a week that re-run from a fresh tree start `bin/rmd` in a tree with no dist/, which falls back to tsx on src/run-task.ts"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # Rule 19: one concern, what a review's start costs; it spans the run-child launch that times it and the fresh-tree spawn that runs under tsx
  band_meaning: span
  origin: operator-session#review-lane-findings-2026-11-02
  plan_refs:
