  budget_usd: 15.00
  files: [src/run-task.ts]
  origin: oper#squeeze-session-2026-09-17
  plan_refs: ["W1-T3727", "W1-T3696", "W1-T3726", "W1-T3731"]
  status: queued
  attempts: 0
  rationale: |
    W1-T3727 declared BOTH committing lanes — retro and alert_fix. PR #5941 built the alert_fix
    half only, on branch `run-W1-T3727-1789667671000`, and merging it credited the whole task
    through the BRANCH-NAME path (CLAUDE.md: "a TRAILER-ONLY SET UNDER-CREDITS, because the BRANCH
    NAME is a second, independent credit path"). Nothing noticed the other half. This shard is that
    half, refiled so it can be dispatched.

    WHAT IS ALREADY DONE, so the build does not redo it. `DISPATCH_LANE_TOOL_BOUNDS.retro` has
    carried an `openweight` row since W1-T3726, and both retro dispatch sites already resolve
    per-provider via `resolveDispatchLaneToolBound("retro", ...)`. The table is not the gap.

    THE TWO REMAINING GAPS, verified on origin/main at 6fe0410c5:

    (1) NO DIVERT OFFER. Neither retro dispatch site passes `cashDivertSpawnFields("retro")`, so a
        BLOCKED auction refuses the spawn outright rather than diverting it. Resolving a bound
        per-provider answers "what surface would openweight get"; it does not answer "may this be
        diverted when the auction blocks" — those are different questions with different
        functions, and only the second one keeps the lane alive under a squeeze. This is the same
        one-line-per-site shape #5941 used for the fix rung and #5952 for review.

    (2) THE COHERENCE RULE IS UNSATISFIED. Retro's prompt tells the worker to `git add` and commit
        (lib/retro.ts stamps shards and commits them). W1-T3696's rule is that a shell-less surface
        may be offered ONLY where the prompt already said the harness commits — the prompt is built
        BEFORE the auction runs, so offering it otherwise hands a worker, on retry, a surface that
        cannot do what it was just asked to do. `harnessCommitForShellLessWorker` exists and has
        exactly two call sites (run-task.ts:9689 implement, :14176 fix). Retro needs the third,
        plus the prompt's committing footer swapped the way `renderFixPrompt` swaps it.

    DO NOT SOLVE THIS BY WIDENING OPENWEIGHT_CHECKS — `git push` is absent from that table by
    construction (W1-T3572 removed forge authority from cheap models deliberately). The harness
    performs the effect, exactly as implement and fix now do.

    WHAT STOPS WITHOUT IT: plan authorship and the learning flywheel stop for the whole squeeze
    window. Not fleet-stopping on its own — the build and review loops now survive on cash — which
    is why this is filed rather than hot-fixed.

    FILES NOTE (W1-T3730): this shard's `files:` deliberately OMITS the test file the build will
    add. That is not an understatement of scope — it is the only way past `lint-plan`'s
    `proof-unit-test-unresolvable` check, which reads a `test/` path in `files:` as "this diff
    ships the suite" and then refuses every forward-referencing proof title. On a plan-only filing
    that premise is false, which is exactly the defect W1-T3730 is filed to fix. The build MUST
    add the test file named in the acceptance proofs below and add it to `files:` at that point.

  acceptance:
    - claim: "the retro lane offers a cash divert surface at its dispatch sites, so a blocked auction can divert it"
      proof: "grep: cashDivertSpawnFields(\"retro\") in src/run-task.ts"
    - claim: "the harness performs retro's commit when it runs on a shell-less surface"
      proof: "grep: harnessCommitForShellLessWorker in src/run-task.ts"
    - claim: "a retro spawn told the harness owns git is coherent with the surface it is offered"
      proof: "unit test: W1-T3746"
