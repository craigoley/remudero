    - claim: "the profile bound is derived from the interval and the observed lag history, not a constant"
      proof: 'grep: test("W1-T7746: the profile bound follows the interval and the observed lag history" in test/an-unattributed-loop-stall-is-profiled-live.test.ts'
    - claim: "the profile row carries the interval sync_spawn_ms and the unattributed remainder"
      proof: 'grep: test("W1-T7746: the profile row carries sync_spawn_ms and the unattributed remainder" in test/an-unattributed-loop-stall-is-profiled-live.test.ts'
    - claim: "an inspector failure writes loop_stall_profile_failed and leaves the loop running"
      proof: 'grep: test("W1-T7746: an inspector failure writes loop_stall_profile_failed and the loop keeps running" in test/an-unattributed-loop-stall-is-profiled-live.test.ts'
  falsifier: |
    Without the watchdog there is no `daemon.loop_stall_profile` row, and the first test fails. Name a constant
    bound: the second test's two lag histories give the same bound. Drop D's `sync_spawn_ms` from the row: the
    third test finds no `unattributed_ms`. Let an inspector error escape: the fourth test's loop timer stops
    firing.
