    - claim: "a same-scope ended candidate reaches the injected termination and ledger sinks, while a same-scope active candidate reaches neither sink"
      proof: "unit test: test/orphan-sweep-instance-scope.test.ts"
    - claim: "daemonCommand supplies the scope derived from its own config root to both boot-time and per-poll orphan sweeps"
      proof: "unit test: test/orphan-sweep-instance-scope.test.ts"
    - claim: "the existing real W1-T356 daemonCommand fixture marks its own stray with the fixture root scope and cannot kill a foreign-scope control process"
      proof: "unit test: test/orphan-sweep-instance-scope.test.ts"
    - claim: "production still invokes the real process table and signal primitives; the remedy narrows authorization rather than replacing the I/O with fakes"
      proof: "unit test: test/orphan-sweep-instance-scope.test.ts"
  falsifier: |
    Spawn two real throwaway process groups carrying valid run/task markers but scopes derived from
    different temporary roots. Invoke the real daemonCommand wiring for one root with both visible.
    If it signals the foreign-scope group, installation isolation is false. If it fails to signal
    the same-scope ended group, the remedy disabled orphan cleanup rather than scoping it. The
    foreign group is unconditionally cleaned up by the test after the assertion; no production
    worker is used as a fixture.
  note: |
    This does not start, stop, restart, deploy or reconfigure the daemon. It does not alter review,
    merge, headroom or provider-selection policy. W1-T2407 remains the owner of test-fixture lock
    coverage and diagnostics; this task owns the missing production authorization dimension that
    a lock between test files cannot supply.
