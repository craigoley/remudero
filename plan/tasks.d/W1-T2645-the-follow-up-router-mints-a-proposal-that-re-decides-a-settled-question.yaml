- id: W1-T2645
  title: "THE FOLLOW-UP ROUTER MINTS A PROPOSAL THAT RE-DECIDES A SETTLED QUESTION — routeFollowupsToRegistry has exactly two refusal arms (a lexical title-dedup with measured recall 3-in-32, and the type route), neither of which consults the decided record, so a candidate whose remedy contradicts a documented decision reaches a drafting slot before anything can say no; add a THIRD named arm driven by a settled-question DATA table, seeded with the one row four instances already justify"
