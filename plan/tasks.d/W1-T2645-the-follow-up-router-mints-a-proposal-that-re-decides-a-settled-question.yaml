  rationale: |
    RE-SCOPED FROM followup:DAEMON-1788107419932:2026-08-30T16:56:33.630Z:1, whose literal remedy —
    "sync plan/tasks.d/W1-T2473-*.yaml status: from queued to shipped (PR #3304 already merged it),
    stale status could cause a scheduler to re-offer completed work" — is REFUSED on three
    independent grounds, each read from source at head rather than assumed. The proposal is not
    dropped: it is the regression corpus for the arm below.

    (1) THE REMEDY IS NOT REPRESENTABLE, AND AN EXISTING GATE ALREADY REFUSES IT. TASK_STATUSES
    (src/lib/plan.ts:15-26) is queued|recon|prompted|running|review|fixing|diagnosing|blocked|
    merged|done. `shipped` is not a member, and plan.ts:232-235 THROWS PlanError on a non-member —
    not for that task, for the WHOLE load. Every consumer of loadPlan (drain, lint, review, the
    daemon) would red, and main-plan-guard runs loadPlan on every PR precisely so that cannot
    reach main. So the proposed edit is already fail-closed; nothing needs building to stop it.

    (2) THE STATED MECHANISM IS FALSE, AND ITS FALSITY IS MEASURED. drain.ts:34-35 defines the
    dispatch predicate as "a merged predicate — DERIVED FROM GITHUB in the real runner
    (status.ts)", and plan/tasks.yaml's own header states that `status:` is DECORATIVE /
    initial-state only and that the runner never writes it back. W1-T367 measured 248 of 359 tasks
    (69%) carrying `status: queued` while their PR was MERGED. If the field drove dispatch the
    fleet would be re-offering two thirds of its plan continuously. It is not, and the field
    changes no dispatch decision.

    (3) THE CLASS IS OWNED, AND THIS WOULD BE THE PER-INSTANCE PATCH OF IT. P46 clause (i) already
    owns "a shard whose status: is stale against DERIVED state is a premise wrong at dispatch
    time" — widened by R16 on six shards and by R32 on three more (W1-T2318 dispatched THREE
    times; five runs, 21% of a 24-run window). P56 owns the downstream half. W1-T367 owns the
    readers. W1-T410 owns the retro-gather plan-state truth rung. Hand-syncing one shard's field
    is the reactive-diagnosis anti-pattern this plan names repeatedly.

    AND THE PROPOSAL IS THE FOURTH RECORDED INSTANCE OF ONE MISDIAGNOSIS, WHICH IS THE ACTUAL
    FINDING. DECISIONS.md carries at least three auto-choose no-op rationales — W1-T1, W1-T12a,
    W1-T99 — each concluding, in near-identical words, that "a dispatcher keying off
    plan/tasks.yaml's decorative status: queued field instead of GitHub-derived status re-queues an
    already-merged task". MASTER-PLAN R32 then supplies the MEASURED cause instead: those merges
    carry no Remudero-Task trailer, so the DERIVED state cannot see them either — premise-rot with
    no derivable ground truth to check the premise against. Four independent producers reached a
    hypothesis the record had already answered, and nothing between the producer and a drafting
    slot consults that record.

    THE RESIDUE NOTHING OWNS IS THE PRODUCER, NOT THE FIELD. `rmd triage` (W1-T41) GROUNDS a
    feedback entry against plan/learnings/ledger/DECISIONS before proposing, on the stated ground
    that re-deciding a settled question is a failure. routeFollowupsToRegistry (src/lib/retro.ts)
    has no such rung. Its doc names exactly two refusal arms — "title-dedup" (mineFollowups'
    followupMatchesTitle word-overlap) and "type-not-plan-shaped" (FOLLOWUP_TYPE_ROUTES) — and the
    sibling lexical dedup this family relies on measured recall of 3 in 32 (W1-T2455, cited at
    W1-T2473's Q3), so a re-decided question is not caught by similarity either. The asymmetry
    between the two intake lanes is the defect, and it is small: the outcome union already models
    "a decline always NAMES the arm that declined it", so the third arm is an addition to a shape
    that exists, not a new lane.

    WHAT WAS NOT VERIFIABLE FROM THIS SEAT, STATED RATHER THAN GUESSED. Whether PR #3304 credits
    W1-T2473 could not be checked here (no network verb in this seat), and it does not change the
    disposition either way: if #3304 carries the trailer or a run-W1-T2473-* head, derivation
    already credits the task and the field is inert; if it does not, the MISSING TRAILER is the
    defect, which is R32's measured cause under P46 with P56's remedy — never a field sync.

    WHAT THIS TASK DOES NOT DO, EXPLICITLY. It edits no shard. It changes no dispatch path, no
    status model, and no enum. It annexes nothing from P46 or P56 — those keep the dispatch-premise
    and false-credit halves untouched. It does not touch classifyProposal, mineFollowups' dedup, or
    FOLLOWUP_TYPE_ROUTES' existing semantics, and it never files a task.
  design: |
    ONE NEW REFUSAL ARM IN routeFollowupsToRegistry (src/lib/retro.ts), matching the two that are
    already there. VERIFY the function, its FollowupRouteOutcome union, FOLLOWUP_TYPE_ROUTES and
    followupProposalId from source before editing — this note is a 2026-08-31 reading and the shape
    may have moved.

    (i) THE TABLE IS DATA, NOT BRANCHES (rule 2). Export a small settled-question table whose rows
    carry {id, a predicate over the candidate text, decidedIn (the citation), reason}. SEED IT WITH
    EXACTLY ONE ROW: a candidate proposing to WRITE a task's `status:` field, decided against by
    plan/tasks.yaml's header status model (derived from GitHub; never machine-rewritten, because a
    machine writer would race the human editor) and by src/lib/plan.ts's TASK_STATUSES enum. A
    second settled question later is a ROW, never a code branch — the W1-T81/W1-T92/W1-T101
    precision-family discipline.

    (ii) THE ARM DECLINES PROMOTION ONLY, NEVER THE HARVEST. A matched candidate is still
    harvested and still ledgered (recordFollowupHarvest is untouched, exactly as the existing
    "action" decline leaves its entry harvested); only the mint into the registry is refused. The
    outcome gains arm "settled-question" and a reason that NAMES the deciding record, so a reader
    can tell it from "already covered by the title dedup" without re-deriving either.

    (iii) FAIL-OPEN IS THE CORRECT POLARITY HERE AND IS THE OPPOSITE OF THIS REPO'S USUAL DEFAULT.
    Refusing a genuine follow-up LOSES work permanently; minting a redundant one costs one
    ratification that says no. So the predicate must be NARROW and ambiguity must ROUTE: it matches
    the proposed-WRITE property, never the mere appearance of the word. This is W1-T118's lesson —
    a check that matches surface text where it means to match a property — applied at filing time
    instead of at lint time.

    (iv) THE EXISTING ARMS AND IDEMPOTENCE ARE UNTOUCHED. title-dedup and type-not-plan-shaped keep
    their current outcomes verbatim, and a second pass over an already-routed candidate still adds
    nothing (updateRegistry's own existing-id check, unchanged).
