      proof: "unit test: test/followup-settled-question-arm.test.ts"
    - claim: "the false-positive falsifier holds: a candidate that merely mentions status, or that proposes work on the status board, still ROUTES and mints its proposal — the arm matches a proposed write to the status field, never the word"
      proof: "unit test: test/followup-settled-question-arm.test.ts"
    - claim: "the settled-question rows are DATA — adding a row declines a seeded candidate with no change to the router, and an empty table routes every candidate exactly as the pre-change function did"
      proof: "unit test: test/followup-settled-question-arm.test.ts"
    - claim: "the two existing arms are unchanged and idempotence holds — a title-deduped and a not-plan-shaped candidate produce their current outcomes, and a second pass over an already-routed candidate adds nothing"
      proof: "unit test: test/followup-settled-question-arm.test.ts"
    - claim: "the new arm is a named member of the routing outcome, so a decline is legible as a settled question rather than a bare boolean"
      proof: "grep: settled-question in src/lib/retro.ts"
  note: |
    RE-SCOPED, NOT INVENTED. The occasioning proposal
    (followup:DAEMON-1788107419932:2026-08-30T16:56:33.630Z:1, from W1-T2477, run
    DAEMON-1788107419932) asked for a one-field shard edit. That edit is refused on the three
    grounds in the rationale, and its own text is criterion 1's regression corpus — the strongest
    available form of the test, since the arm must decline the exact input that produced it.
    NO SHARD EDIT IS FILED ALONGSIDE THIS, DELIBERATELY. plan/tasks.d/W1-T2473-*.yaml keeps
    `status: queued`; correcting it per-instance is P46 clause (i)'s dispatch-premise half, and
    the credit half is P56's. Neither is annexed here.
    risk:high IS RULE 19's SPAN, NOT BLAST RADIUS — the change is one refusal arm plus a
    one-row table. files: names src/lib/retro.ts and a test whose stem differs, which the sizing
    check reads as two subsystems (the W1-T189 precedent, graded UP for the same reason and
    recorded as a regrade rather than worked around). Decomposing a single arm into two tasks
    would be the dishonest move.
    depends_on IS EMPTY ON PURPOSE. W1-T105 (the follow-up harvest) reads queued in the plan, but
    routeFollowupsToRegistry, FOLLOWUP_TYPE_ROUTES and followupProposalId are all present at head
    and the harvester demonstrably runs — this proposal is its output. A dependency on a task
    whose code is already there would gate real work behind a stale record, which is the very
    class this task exists to stop propagating.
