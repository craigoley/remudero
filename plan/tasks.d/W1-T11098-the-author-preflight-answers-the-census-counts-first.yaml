- id: W1-T11098
  title: The author preflight answers the cheap census counts in seconds before any heavy step, and a branch the counts already refuse never waits for the census suites
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # two scripts, one concern: the order in which the author preflight asks its questions
  origin: operator-session#preflight-throughput-2026-11-02
  plan_refs:
    - W1-T5617
    - W1-T9919
  files:
    - scripts/census-precheck.mjs
    - scripts/preflight-author.mjs
    - test/ci/the-author-preflight-answers-the-cheap-counts-first.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: census-precheck --counts-only runs the static counts (clock, comment load, fixture copy, house layout, deps interface, repo root, census parity) without starting the instrument child or any census suite, and exits 1 naming each caused row or 0 when clean
      proof: "unit test: test/ci/the-author-preflight-answers-the-cheap-counts-first.test.ts"
    - claim: In full mode a branch whose static counts already refuse prints those rows and exits 1 without starting any census suite; the instrument-surface check still runs
      proof: "grep: W1-T11098 criterion 2 in test/ci/the-author-preflight-answers-the-cheap-counts-first.test.ts"
    - claim: preflight-author runs census-counts as its first step, right after the dependency precheck, and a refusal there ends the run without starting census suites, static-preflight or tests
      proof: "grep: W1-T11098 criterion 3 in test/ci/the-author-preflight-answers-the-cheap-counts-first.test.ts"
  rationale: |
    MEASURED 2026-11-02 over 12 author preflight receipts (progress.json under each worktree's coverage/rmd-author-*):
    - Wall time per run 45-90 min. census-precheck alone took 536-2,336 s, static-preflight 828-3,120 s, the affected subset 699-937 s.
    - The same census step took 536 s on 2026-10-30 and 2,336 s on 2026-11-02 at load average 34-47 on 8 cores: three author preflights and the fleet ran at once.
    - Every census finding the operator session hit today was a static count: clock-signature (newDate in stall-verifier.ts), fixture-copy (gitInitSites), house-layout (plan/tasks.d literal) and deps-interface. Each surfaced only at the end of a 25-40 min census step, because main() prints violations after evaluateAdmittedCensusSuites has run every admitted suite. So each code PR needed 2-3 preflight runs.
    - evaluateCensusPrecheck and censusParityViolations already run first, in-process, in seconds; only their reporting waits.
  design: |
    1. census-precheck gains --counts-only: evaluateCensusPrecheck plus censusParityViolations, no measureViaChild, no evaluateAdmittedCensusSuites. Exit 0/1, 2 only when unreadable.
    2. Full mode: when the static violations are non-empty, skip evaluateAdmittedCensusSuites and say so; evaluateInstrumentSurface still runs (W1-T5101 reports it beside the rows). A refused branch is refused either way; suite findings surface on the next run, after the cheap fix.
    3. preflight-author: a census-counts step first, right after authorDependencyProvenance (a missing installation still refuses before any census starts). A refusal throws the way census-precheck's does now, with the rows in the receipt. The full census-precheck step stays where it is.
    4. hooks/pre-push is unchanged.
