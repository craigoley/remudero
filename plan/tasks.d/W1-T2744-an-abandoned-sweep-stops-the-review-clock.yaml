  falsifier: |
    Close without implementation if the production `runGatedSweep` in the deployed image returns
    promptly after its `daemon.sweep.abandoned` row while a detached light-pass fix remains
    unresolved, OR if a `daemon.alive`/light-review row exists after 00:45:59Z in the same live run.
    Both checks were run before filing: the deployed source unconditionally awaits
    `stopSweepTicker()` in `runGatedSweep`'s `finally`; that stop unconditionally awaits
    `drainDetachedSweepActions()`; and the ledger contained neither control-loop heartbeat nor
    review activity after 00:45:59Z despite accepted webhook rows through 01:09:40Z. A container
    that remains up, or a worker that remains CPU-active, does not falsify the defect — those are
    the measured shape of the wedge.
