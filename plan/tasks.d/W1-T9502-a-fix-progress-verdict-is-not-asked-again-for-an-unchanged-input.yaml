        test file still failing on a trial merge) and two fix commits; stalled-stage escalations did fire (issues
        #11589 05:43Z, #11637 10:02Z, #11651 11:54Z, #11661 12:44Z).
    READ on origin/main f07a85601 (src/lib/sweep.ts, symbols):
      - `runSweep` builds `judgedContinue` and `judgedUnavailable` fresh per pass. `askProgress` reuses only those, then
        builds the input, hashes it (`inputKey`), and calls `judgeFixProgress` (an LLM spawn).
      - In the blocked-fixable path `askProgress` runs before `claimFixDispatch` and `claimFixAdmission`, so a refused
        admission discards the verdict and the next pass asks again on the same input.
      - The ledger already holds what reuse needs: each `fix.progress_judged` row records pr_number, head_sha,
        input_key, verdict and approach. An escalate verdict is already latched by `progress_escalated_key`.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and all 14 open PR heads for input_key, inputKey and
    progress_judged. Control: those terms read 8 shards on main and on 13 heads (5 on one); none adds a shard.
    W1-T7762 (a new red class gets a fresh judgment) is the other direction and stays true here: a new red class
    changes the input and its key. W1-T9297 adds failure evidence to the input; a head's evidence is stable, so the
    key still repeats. W1-T9433 changes the stalled-stage backstop, not the judge.
  design: |
    Operator rulings: no fixed threshold, age or count; the judge still rules on every new question.
    1. REUSE ON AN UNCHANGED KEY. Before spawning the judge, `askProgress` (and the other `judgeFixProgress` call
       automated repair judgment sites in src/lib/sweep.ts and the fix rung in src/run-task.ts) share one keyed lookup in src/lib/fix-progress-judge.ts over
       the newest `fix.progress_judged` row in the caller's already-read ledger lines with the same
       pr_number, head_sha and input_key. A continue verdict, or a change-approach verdict with its approach, is
       reused as the decision; the judge is not spawned. Ledger `fix.progress_reused` {pr_number, head_sha, input_key,
       verdict, judged_at}.
    2. ANY CHANGE ASKS AGAIN. A different key (new head, new red class, new round, new evidence, an operator answer, a
       contract revision) finds no match and asks the judge, as today. An `unavailable` verdict is never reused. An
       escalate verdict keeps its existing latch.
    3. No time bound on reuse: the input is the whole question, and an unchanged question has an answer.
       The standalone diagnostic judge command is not an automatic repair caller and remains unchanged.
    Tests go in the computed test/sweep/ folder, with `test(` titles verbatim as in the proofs below, driving `runSweep` with a counting
    fake judge and an admission that refuses, replaying #11559's 999a5dc head over three passes.
