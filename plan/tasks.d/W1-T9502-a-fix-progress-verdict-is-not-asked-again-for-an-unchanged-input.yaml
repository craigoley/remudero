        (03:44-04:02Z), head e8773b6 key 1d1fc7c3 13 times (04:34-06:37Z), head 03aa001 key 0c970a4a 4 times, head
        58f6f36 key 7011c841 6 times. No fix round ran until 58f6f36 (11:14Z); between verdicts every
        `sweep.disposed` stood down on "live host capacity exhausted".
      - The re-measure: #11559 alone held 369 of 1,244 red PR-minutes (30%) across 7 heads. Its heads moved by four
