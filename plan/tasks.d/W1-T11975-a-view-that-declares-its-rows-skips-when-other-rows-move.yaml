    - src/lib/nav-badge-view.ts
    - test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "For a view that declares digestReads, the input digest holds that fingerprint, the plan identity, the switches and the lease state, and leaves out the store-wide generation and every source snapshot the view did not declare"
      proof: "grep: W1-T11975 criterion 1 in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "instances, agent, analytics and nav-badge each declare a fingerprint over the tables or snapshots their materialize reads, and a ledger row none of them reads leaves all four skipped"
      proof: "grep: W1-T11975 criterion 2 in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "For each of the four, a row the view does read changes its fingerprint and the next build's body equals a build made with the skip disabled"
      proof: "grep: W1-T11975 criterion 3 in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "A view without a declaration builds exactly as before"
      proof: "grep: W1-T11975 criterion 4 in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
  rationale: |
    OBSERVED 2026-11-10 on the Azure host (8 cores, CPU pressure some avg300 79 percent): serve used 1.0 to 2.8 cores in 20 to 30 s samples at cpu-shares 4096 against the daemon's 512, with 3.8 GB resident. route-reads.json shows the console's last read of any view at 01:12:34Z; from 01:33Z to 04:19Z, with no reader, read_model.view_builds summed 4,385 s of build time over 9,987 s.
    - With a console open the idle stretch does not apply, so the skip is what bounds cost. It reached one view of fifteen: builds equalled calls for instances (7,318), analytics (8,288), agent (11,416) and nav-badge (2,553).
    - The ledger gains about one row every 5 s, and serve's own agent.built and workstreams.built rows are 27 percent of them, so a digest keyed on the store-wide generation never repeats.
  design: |
    In inputDigest, when the view declares digestReads, build the digest from the per-instance fingerprint, plans, states without the generation, switches and shadow; keep today's digest for views without one. Give each of the four views a fingerprint that is cheap (an indexed max or count over the tables it reads, or the as_of of the snapshots it names) and add the equality test that pins it: fold a row, build with and without the skip, compare bodies.
    NOT IN SCOPE: the heavy-lane views (the next task) and pacing.
  falsifier: |
    Put the generation back into a declared view's digest and criterion 1 must fail; let an unrelated row change a fingerprint and criterion 2 must fail; miss a row a view reads and criterion 3 must fail; change an undeclared view and criterion 4 must fail. Restore and require all four to pass.
  note: |
    reservation hand-off: run-unfiled-1794287307841 -> run-unfiled-1794287307841
