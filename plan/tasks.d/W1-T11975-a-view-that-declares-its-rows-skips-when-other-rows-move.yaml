  rationale: |
    OBSERVED 2026-11-10 on the Azure host (8 cores, CPU pressure some avg300 79 percent): serve used 1.0 to 2.8 cores in 20 to 30 s samples at cpu-shares 4096 against the daemon's 512, with 3.8 GB resident. route-reads.json shows the console's last read of any view at 01:12:34Z; from 01:33Z to 04:19Z, with no reader, read_model.view_builds summed 4,385 s of build time over 9,987 s.
    - With a console open the idle pacing (W1-T11933) does not apply, so the skip is what bounds cost. It reached one view of fifteen: builds equalled calls for instances (7,318), analytics (8,288), agent (11,416) and nav-badge (2,553).
    - The ledger gains about one row every 5 s, and serve's own agent.built and workstreams.built rows are 27 percent of them, so a digest keyed on the store-wide generation never repeats.
  design: |
    OBSERVED in code on 2026-11-10 (origin/main 17745c6bf). Changing inputDigest alone skips nothing and is not safe:
    - reusableSources allows a skip only when every source of the last bodies is a fresh ledger or plan source. All four views carry other sources (registry:repo, inbox-capability, analytics, gardener-spend, operator-agent-memory, the inbox source). That is why instances declares ledgerReads today and still builds on every call.
    - restamp sets every non-ledger source to as of the clock. A skipped body would say a snapshot or a registry reading is as fresh as the clock.
    - digestReads receives one instance store. The bodies also depend on the clock (instances liveness is now minus the last heartbeat against INSTANCE_LIVENESS_BOUND_MS; the agent memo holds floor(now / AGENT_CLOCK_MS); analytics and nav-badge derive source state and lagMs from now against a snapshot as_of), on files (the repository and host registry files, mount checks, the inbox contract, nav-badge-sources.json, the inbox classification snapshot), and on the home store (an agent unit is scoped to one instance but reads its analytics snapshot from ctx.sourceStore).

    MECHANISM (read-model-worker.ts). Add one optional member to ReadModelView: inputsFingerprint(ctx), which receives the same scoped build context materialize receives and returns a string, or undefined when it cannot state its inputs on this call. It must cover every input the bodies and their sources depend on:
    - the rows it reads: an indexed max or count over each table, from ctx.instances and ctx.sourceStore;
    - each snapshot it reads: its as_of, error and error_ms from ctx.sourceStore;
    - each file it reads: its identity (inode, size and mtime), or absent;
    - each field derived from the clock: the value of the comparison itself where the field is a threshold (up or down, fresh or stale), or a time bucket no longer than the field's step (the agent clock bucket);
    - each source the view stamps as of the clock: a time bucket no longer than that source's budget, so the body is rebuilt at least once inside the budget;
    - anything it reads from the instance state beyond the lease and its holder.
    It must be cheap: no body parse, no scan. A view that cannot meet this declares nothing and W1-T11974 counts it under no_declaration.
    For a view with inputsFingerprint:
    - inputDigest returns the parts inputs (the fingerprint), plan, state (each store's path and inode, the lease and its holder; no generation), switches and shadow. It is unreadable, as today, when a store is missing, the lease is not held, the projection failed or the fingerprint is undefined or throws. W1-T11974 then reports inputs as a reason.
    - reusableSources accepts any source name, and still requires built keys and every source of the last bodies to be fresh.
    - restamp refreshes ledger sources as today and republishes every other source exactly as built.
    ledgerReads keeps its meaning (the as-of stamp of the ledger source). digestReads and the digest of a view without inputsFingerprint do not change.

    AUDIT (read-model-worker.ts). A wrong declaration must not stay silent. Per unit, the first would-be skip and every twentieth after it (READ_MODEL_SKIP_AUDIT_EVERY) runs materialize anyway and compares each key's ETag with the published one. Equal: publish as a normal build; count the call under the reason audit. Different, or a different key set: publish the new bodies, ledger read_model.view_skip_mismatch (view, instance, the count of differing keys) through the existing log sink, and stop skipping that unit for the life of the ticker; its later builds count under mismatch. not_skipped plus skipped still equals calls.

    VIEWS. Give instances, agent, analytics and nav-badge a fingerprint under these rules. Read each materialize in full first and list its inputs in a comment beside the fingerprint. Known inputs: instances (heartbeat row, the up or down comparison per instance, both registry files, each mount, the inbox contract store, lease and generation validity, a bucket for the capability source stamp); agent (the fold sequence, the committed analytics snapshot of its instance in the home store, the clock bucket); analytics (the four snapshot states per instance, the stale comparison per source, the host model approval config); nav-badge (the fold state, the sources sidecar file, the classification snapshot file, the analytics stale comparison). If a body holds a value that changes on every build, the view stays undeclared and the test names it.
    Add the tests that pin each one: fold a row, build with and without the skip, compare bodies; advance the clock past each threshold with no row moving and require a build.
    NOT IN SCOPE: the heavy-lane views (the next task), pacing, and making a view's inputs cheaper to read.
  falsifier: |
    Put the generation back into a declared view's digest and criterion 1 must fail; let an unrelated row change a fingerprint and criterion 2 must fail; miss a row a view reads and criterion 3 must fail; change an undeclared view and criterion 4 must fail; drop the liveness comparison from the instances fingerprint and criterion 5 must fail; stamp a non-ledger source as of the clock on a skip and criterion 6 must fail; remove the audit build and criterion 7 must fail; inject a view in place of the lane registration and criterion 8 must fail. Restore and require all eight to pass.
