- id: W1-T11975
  title: "A view that declares the rows it reads is skipped when only other rows moved: its input digest uses its own fingerprint in place of the store-wide generation and undeclared snapshots, declared first for instances, agent, analytics and nav-badge"
  repo: remudero
  depends_on:
    - W1-T11974
  priority: 1.1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # a wrong fingerprint serves a stale body; each declaration is proved by a body-equality test against a full build
  band_meaning: blast-radius
  origin: operator-session#serve-idle-2026-11-10
  plan_refs:
    - W1-T11127
    - W1-T11815
  files:
    - src/lib/read-model-worker.ts
    - src/lib/instances-view.ts
    - src/lib/agent-view.ts
