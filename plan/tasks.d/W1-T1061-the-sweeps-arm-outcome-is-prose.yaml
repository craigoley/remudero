    EVERY FIGURE IS DATED 2026-08-20 AND WILL DRIFT — RE-RUN THE QUERY RATHER THAN QUOTING IT.
    The census: `zgrep -h '"step":"sweep.disposed"' <every ledger form> | sort -u`, then count rows
    whose JSON contains `arm outcome:` and tally the outcome by parsing that string — which is the
    very awkwardness this task removes, and worth doing once so the before-figure is honest. Take a
    per-form file count as the coverage control before trusting any total. The write site:
    `git grep -n 'arm outcome' -- src/lib/sweep.ts` returns exactly one line today.

    ID PROVENANCE — THIS SHARD WAS RENUMBERED, AND THE REASON IS THE POINT RATHER THAN AN
    APOLOGY. It was first filed as W1-T1053, on an id the operator hand-reserved and read back
    against the sha he supplied before any work started. Five minutes later the triage lane
    independently minted and filed THE SAME id, and both PRs opened one second apart — so
    `loadPlan` (`src/lib/plan.ts`), which throws `duplicate task id` on exactly that shape, would
    have refused origin/main for every plan-reading verb had both merged. That is W1-T1055's
    (#2281) subject arriving live: `rmd next-task-id` PRINTS an id and RESERVES nothing, so a
    hand-reserved id and a lane-minted id can be the same integer with neither caller wrong. This
    shard moves rather than the triage PR because the triage branch is a `run-TRIAGE-*` head with
    a live owner and it also carries a feedback-entry state change, so closing it would strand
    that entry as `new` and triage would re-attempt it. The W1-T1053 mentions kept in this
    paragraph are DELIBERATE HISTORY, not stale references.

