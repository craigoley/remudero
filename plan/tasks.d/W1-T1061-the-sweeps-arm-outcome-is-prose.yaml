- id: W1-T1061
  title: "THE SWEEP LANE RECORDS ITS ARM OUTCOME AS PROSE INSIDE A REASON STRING — `standDownReason = \"arm outcome: <outcome>\"` on a `sweep.disposed` row, so the one lane that arms the most PRs is the one lane whose outcome cannot be read without parsing a sentence; move it to a field on the row it already writes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  rationale: |
    MEASURED 2026-08-20 on Craigs-Mac-mini under /bin/zsh 5.9, in a scratch worktree at
    origin/main 63837dc7. Per-form coverage control taken first — 666 gz, 6 plain, 1 live, all
    readable — and every census deduped on the FULL LINE. No `/rate_limit` call; the daemon and
    its state files untouched.

    (1) THE SHAPE, FROM ONE WRITE SITE. `src/lib/sweep.ts` assigns
    `standDownReason = "arm outcome: " + String(armOutcome)` when the arm did not arm, and that
    string is carried onto the PR's own `sweep.disposed` line as `stand_down_reason` — the same
    field every other non-actionable disposition uses for a human sentence. THE OUTCOME IS
    THEREFORE PROSE INSIDE A REASON, ON A ROW ABOUT A DISPOSAL, AND THE ONLY WAY TO COUNT ARM
    OUTCOMES FROM THIS LANE IS TO PARSE ENGLISH.

    (2) THE OTHER TWO LANES DO NOT DO THIS, WHICH IS WHAT MAKES IT A DEFECT RATHER THAN A STYLE.
    Both `logArmAttribution` call sites (`src/run-task.ts`) pass the outcome as a FIELD, so a
    review-lane or operator-lane outcome is machine-readable even when the step name is wrong —
    that separate wrongness is W1-T1052's, cited and NOT absorbed here. The sweep lane is the one
    that is not even that.

    (3) MEASURED ON THE UNION: 16,598 distinct `sweep.disposed` rows, 216 of them carrying
    `arm outcome:`, and ALL 216 reading `no-task-id`. The row's own `task_id` reads the literal
    `SWEEP` on every one of them. POSITIVE CONTROL for that zero-free reading: the same corpus
    yields 24 word-bounded `standDownReason` invocations in `src/lib/sweep.ts` and a live
    `stand_down_reason` field on those rows, so the query can see the field it is reading.

    (4) AND THE 216-FOR-216 IS NOT THIS TASK'S DEFECT — IT IS ALREADY FILED. Every one of those
    rows reads `no-task-id` because the sweep could not resolve a task id for the PR at all, which
    is W1-T453's subject in terms: `buildOpenPrViews` resolves a PR's task id from the BODY
    TRAILER ALONE, so a fleet-built PR with no trailer can never arm. That shard's own rationale
    already quotes `no task id resolvable for this PR — arming withheld` and names the
    `no-task-id` vocabulary. It is filed and queued. THIS TASK DOES NOT TOUCH IT.
  design: |
    ONE CONCERN: the outcome's storage shape on a row the sweep already writes. Not the step name,
    not the task id, not the arm decision.

    (i) THE RULING, MADE BEFORE FILING SO THIS SHARD ASKS NOTHING. Two shapes were available: the
    sweep emits the same arm row the other two lanes emit, or the disposed row stays and the
    outcome moves from prose into a field. THE SECOND IS CORRECT AND THE FIRST IS REFUSED. Three
    reasons, in order of weight:
      - THE ROW IS ALREADY JOINABLE, JUST NOT BY TASK. `sweep.disposed` carries `pr_number` and
        `pr_url`; `task_id: SWEEP` is the LANE identity, not a missing subject identity. A lane
        that acts on open PRs it did not dispatch is correctly keyed on the PR.
      - UNIFORM SHAPE WOULD BE NON-UNIFORM MEANING. An `automerge.*` row emitted by the sweep
        asserts an arm attempt tied to a task the sweep does not have, which is a worse untruth
        than the one being fixed.
      - IT WOULD ADD A ROW, which is the cost W1-T1052 just declined to pay on the same lane's
        behalf.

    (ii) THE CHANGE, STATED MECHANICALLY. The outcome becomes its own field on the existing
    `sweep.disposed` line, beside `stand_down_reason` rather than inside it. NO NEW STEP AND NO NEW
    ROW: the row is written today, unconditionally, at the same place. The `stand_down_reason`
    sentence may stay for a human reader, but it must stop being the only carrier — a reader must
    never have to split on a colon to learn what happened.
    NO FIELD OF THAT NAME EXISTS TODAY (a word-bounded sweep of `src/` finds none), so the addition
    collides with nothing. POSITIVE CONTROL: `stand_down_reason` reads 24 in the same file, which
    is the sibling the new field sits beside.

    (iii) WHAT IS OUT OF SCOPE, EACH WITH ITS OWNER, AND NONE OF IT ABSORBED.
      - THE STEP NAME a non-arming outcome is filed under: W1-T1052.
      - THE MISSING TASK ID that makes every observed outcome `no-task-id`: W1-T453.
      - THE ARM DECISION itself and anything about whether the sweep should arm: untouched.
      A reader who fixes only this one still cannot join a sweep arm to a task, and that is
      correct — the join is W1-T453's to restore.

    (iv) WHAT THIS TASK MUST NOT DO. It must not emit an `automerge.*` row from the sweep — that
    is the refused option in (i). It must not add a ledger step. It must not rename
    `stand_down_reason` or repurpose it. It must not delete the two tests that assert the prose;
    they must be re-derived to assert the field, because they are what proves the outcome is
    recorded at all.
  acceptance:
    - claim: "the disposed row carries the arm outcome as its own field rather than inside a sentence"
      proof: "unit test: sweep arm outcome: the disposed row carries the outcome as a field and not as prose"
    - claim: "the outcome is readable without splitting a reason string on a colon"
      proof: "unit test: sweep arm outcome: the field is readable without parsing a sentence"
    - claim: "a disposal that involved no arm attempt carries no outcome field at all"
      proof: "unit test: sweep arm outcome: a disposal with no arm attempt carries no outcome field"
    - claim: "the human sentence and the machine field agree rather than drifting apart"
      proof: "unit test: sweep arm outcome: the sentence and the field agree on what happened"
    - claim: "the change adds no new ledger step and no new row"
      proof: "unit test: sweep arm outcome: no new ledger step is added by the change"
