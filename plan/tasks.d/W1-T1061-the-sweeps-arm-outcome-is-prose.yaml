    pass scoped this lane out of a sibling shard with an open design question attached — whether
    the sweep should emit an arm-shaped row at all. That question is answered in design note (i)
    and the answer is recorded there rather than left for a recon to re-derive. A shard that files
    a question spends a dispatch discovering it.

    `files:` WAS DERIVED BY WORD-BOUNDED INVOCATION COUNT AND IS DELIBERATELY THREE PATHS.
    `src/lib/sweep.ts` holds the ONLY write site of the prose and 24 of the 31 `standDownReason`
    invocations in `src/`; exactly two test files assert the `arm outcome` string, and both are
    declared. `src/run-task.ts` carries the other 7 invocations but NOT this write site, so it is
    deliberately NOT declared — that keeps this out of the file DECISIONS.md's 2026-08-18 W1-T471
    ruling accepts one dispatch lane for, and the ruling would have licensed declaring it had the
    change needed to. The shard's own path is absent.

    RISK IS `high` AND THE BAND IS RULE 19's SPAN, NOT BLAST RADIUS — RECORDED HERE BECAUSE THE
    TWO READ DIFFERENTLY. The change itself is narrow: one source module, one field, one concern.
    But `files:` names two test files whose stems the sizing check reads as distinct concerns
    (`arm-outcome-five-sites` and `sweep`), and at `risk:medium` it BLOCKS with
    *"spans 2 distinct subsystems/concerns … raise to risk:high or decompose"*. MEASURED, not
