  rationale: |
    THE OBSERVABILITY HALF OF P63, and the plan states the defect in one clause of its own:
    "Five fix rungs reported this independently, in nearly identical words, and NONE COULD NAME IT AS
    A PATTERN." Five correct reports, zero aggregation. The pattern was found by a human reading five
    prose paragraphs across five PRs a cycle later.

    WHY THIS IS NOT SATISFIED BY W1-T2653. W1-T2653 makes the DECLARED remedy files reachable. It cannot
    make the NEXT undeclared one reachable, because nobody knows what it is until it fires — the
    class already reached three distinct gates (the size ratchet, `producer-completeness`'s
    `KNOWN_UNWIRED`, the catch-erasure baseline) and the sixth instance landed on a file the harvest
    had not predicted. A registry with no detector for its own gaps rots silently: the first
    unregistered member reproduces the full deadlock and is again reported as five paragraphs of
    prose. This is the guard against that, and it stays valuable precisely BECAUSE W1-T2653 ships.

    AND P63 CANNOT BE SCORED WITHOUT IT. P63's FALSIFIER is "a window in which NO `blocked_ci` run's
    fix rung names an out-of-scope remedy file" and its KILL TRIGGER is "three consecutive cycles at
    zero members". Both are counts of a population nothing counts. Today the only way to score them
    is to re-read every fix rung's prose by hand — which is how the class was found and is not a
    method that survives a retro running unattended. A proposal whose own falsifier is unmeasurable
    cannot be honestly retired OR honestly held.

    THE EMITTER DISCIPLINE IS ALREADY HOUSE LAW. W1-T186 requires the system to name the OBSERVED
    blocker rather than an inferred symptom. A rung that stands down saying "a fix worker added
    path(s) outside the declared scope" has named the symptom; the observed blocker is "the failing
    gate <name> prescribes <file> as its own remedy and this task's scope does not contain it." One
    sentence an operator can act on, instead of five they must correlate.
  design: |
    (i) A NAMED DISPOSITION, DERIVED NOT GUESSED. When the rung stands down and at least one
    new out-of-scope path is a remedy file DECLARED by a currently-failing gate (W1-T2653's registry
    read), classify the stand-down as the gate-remedy class rather than generic scope drift. The
    classification is deterministic — a set intersection over facts the rung already holds — and
    involves no model call.

    (ii) AND CATCH THE UNDECLARED MEMBER, which is the durable half. A stand-down whose out-of-scope
    path is named by the failing check's own output as the fix — the ratchet's `TO FIX: ... edit
    <path>` shape — but which carries NO registry entry, is surfaced as the class WITH the missing
    entry named, so the registry's gap is reported by the first case that hits it rather than by the
    next retro. VERIFY FROM SOURCE what the failing-check text the rung already receives actually
    contains before choosing the match; if the text cannot be matched reliably, report the class from
    the stand-down alone and say so — an honest partial detector beats a brittle parse.

    (iii) THE ESCALATION NAMES ALL THREE THINGS: the gate, the file, and whether a declaring entry
    exists. That is what turns five prose reports into one decidable operator question.

    (iv) COUNTABLE, NOT MERELY LEGIBLE. The ledger line carries the class, the gate and the file, so
    a window's member count is a ledger read. Emitting a line nobody can aggregate would reproduce
    the defect one layer down.

    (v) NOTHING ABOUT WHAT THE RUNG REFUSES CHANGES. The stand-down still stands down (W1-T2653 governs
    what is permitted); this changes only how it is NAMED, ESCALATED and COUNTED. A version that
    also altered the refusal would entangle a measurement with the thing it measures.

    OUT OF SCOPE, NAMED. (a) Any change to what the scope guard permits — that is W1-T2653's, and this
    task must be verifiable with W1-T2653's exemption disabled, so it measures the class rather than
    depending on the class being fixed. (b) Retro-side reporting of the count — this task emits the
    countable line; whether the retro renders it is that rung's decision. (c) The escalation
    transport itself.
