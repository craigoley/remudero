    - claim: "an ordinary out-of-scope path keeps today's generic stand-down reason — the class is a named subset, never a relabelling of every scope refusal"
      proof: "unit test: test/a-deadlock-the-harness-cannot-count.test.ts"
    - claim: "the escalation names the gate, the file, and whether a declaring registry entry exists, so one sentence replaces the five prose reports"
      proof: "unit test: test/a-deadlock-the-harness-cannot-count.test.ts"
    - claim: "an out-of-scope remedy with NO registry entry is still reported as the class, with the missing entry named — the registry cannot rot silently"
      proof: "unit test: test/a-deadlock-the-harness-cannot-count.test.ts"
    - claim: "the class is COUNTABLE from the ledger alone: a seeded window yields its member count, so P63's zero-member falsifier and three-cycle kill trigger are measurable rather than prose"
      proof: "unit test: test/a-deadlock-the-harness-cannot-count.test.ts"
  note: |
    risk:high with band_meaning: span — the two declared files are one consumer and its falsifier
    suite, scored as two concerns by basename; the change itself is one concern (naming, escalating
    and counting one stand-down class) and alters no verdict, exit code or refusal.

    depends_on W1-T2653 is a REAL dependency, not ordering courtesy: this task keys its classification
    on W1-T2653's declared remedy-file registry. Without it, the detector would have to mint a second,
    divergent list of the same files — the drift W1-T2551's "read the repo's own declaration"
    discipline exists to prevent. Both tasks declare `src/run-task.ts`, so `overlappingPaths` would
    serialise them regardless; the edge makes the order deliberate rather than incidental.

    THE MEASUREMENT MUST NOT DEPEND ON THE FIX. Criterion 4 is the one that keeps this task alive
    after W1-T2653 ships, and criterion 5 is what makes P63 scorable at all.
