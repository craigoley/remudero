    - claim: "an empty proposals array is still a legitimate empty result"
      proof: "unit test: test/inbox-registry-absence.test.ts"
    - claim: "no caller is made to fail on a registry that has never been created"
      proof: "unit test: test/inbox-registry-absence.test.ts"
