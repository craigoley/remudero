      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "a rule's full body is retrievable on demand by its headline"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "a body that cannot be retrieved degrades to injecting the full rule, never to silence"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "every headline in the index resolves to exactly one body"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "the headline index sits with the stable prefix and bodies with the volatile tail"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "no rule text is altered by being split into headline and body"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "the learnings injection is unchanged in content and ordering"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
    - claim: "removing the retrieval path makes the degradation assertion fail"
      proof: "unit test: test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts"
