- id: W1-T5620
  title: "THE FEEDBACK-LANDING SWEEP'S PLAN-PR PREFLIGHT RUNS OFF THE DAEMON LOOP — W1-T5521 (#8993) moved the sweep's rungs to `planPrPreflightAtCommitAsync`, but `landPending`'s `pushOnce` (src/lib/feedback-landing.ts) still calls the sync `planPrPreflightAtCommit`, so a per-iteration `sweepFeedbackLanding` that pushes holds the loop for the whole preflight (~290 s measured for W1-T5521)"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one defect — the async sweep and its rung wiring
  origin: "operator session 2026-10-04: W1-T5521 (#8993) left sweepFeedbackLanding on the sync preflight"
  plan_refs: [W1-T5521, W1-T5460, W1-T5525, W1-T5348, W1-T530, W1-T5284]
  files: [src/lib/feedback-landing.ts, src/run-task.ts, test/the-feedback-landing-preflight-runs-off-the-daemon-loop.test.ts]
  status: queued
