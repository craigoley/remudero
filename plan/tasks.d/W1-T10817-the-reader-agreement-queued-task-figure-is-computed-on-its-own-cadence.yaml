- id: W1-T10817
  title: "THE READER-AGREEMENT QUEUED-TASK FIGURE IS COMPUTED ON ITS OWN CADENCE — independentFigures fires the independent queue gateway's warm() and reads factsStale() on the same line; only this 15-minute check warms that gateway and its TTL is max(15 s, walk), so the facts are always stale when read and the queued figure has not been compared once since W1-T6246 (#9908) merged on 2026-10-07"
  repo: remudero
  depends_on: []  # W1-T6246 (merged, #9908) added the off-loop gateway and the staleness gate; W1-T9981 (merged, #12645) added the reader.agreement row
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 10.00
  risk: medium  # Rule 19: one concern, the queue figure of one cross-check. It must stay off the daemon loop (W1-T6246's guard), and a figure computed from facts older than the board's own snapshot is not a comparison
  band_meaning: span
  priority: 2  # an observability cross-check reads nothing and says nothing about it; no PR or dispatch decision depends on it
  status: queued
  attempts: 0
  origin: "investigator V62, 2026-10-27, re-verifying a 2026-10-17 lead from agent B51 (#12645 / W1-T9981) at origin/main ab1bf6914"
  plan_refs: [W1-T6246, W1-T9981, W1-T4841, W1-T2440]
