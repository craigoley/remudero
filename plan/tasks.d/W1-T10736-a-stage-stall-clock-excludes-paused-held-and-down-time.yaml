  design: |
    1. PR STAND-DOWNS ARE READ FROM STRUCTURE, NOT PROSE. A `sweep.disposed` row with `acted: false` and any
       `light_pass_scope` is fleet-withheld. That restores what "deferred to full sweep (light pass)" meant
       before W1-T9569. Keep the existing FLEET_WITHHELD_STAND_DOWN arms (PAUSE/STOP hold, host capacity,
       worker budget, and the legacy light-pass text for rows written before 10-22). An acted row is never
       withheld.
    2. INSTANCE INTERVALS, BY EVIDENCE. From the same ledger read, derive the instance's own intervals over
       [blocker_since, now]:
       a. NOT RUNNING: from the last row of one daemon run (`run_id` DAEMON-*) to the next `daemon.start` of a
          different run. One daemon holds an instance's lock, so the earlier run had ended by then.
       b. HELD: from a `daemon.boot_held` row, or a `daemon.admission_held` / `daemon.sweep_light.held` row
          whose control or detail is a fleet PAUSE or STOP, to that run's next unheld evidence. Unheld evidence
          is a `daemon.boot`, a non-light `sweep.pass`, or the run's end, which a NOT RUNNING interval then
          covers.
       No interval is inferred from a gap length or a timeout. There are no fixed thresholds.
    3. THE STALL CLOCK SUBTRACTS THE UNION. Subtract the union of the PR's withheld intervals and the
       instance's NOT RUNNING and HELD intervals, clipped to the stage, so an overlap is counted once. That
       union replaces `heldMs` at :17452. The bounds, stage keys, dedup, the W1-T9971 in-flight check and the
       W1-T8167 review-overrun deferral are unchanged.
    4. THE ROW SAYS WHAT WAS EXCLUDED. `pr.stuck` keeps `held_ms` (now the union total) and adds
       `excluded_ms: { pr_withheld, instance_down, instance_held }`. The escalation sentence names the
       excluded minutes by kind. A stage with nothing excluded reads as today.
    5. RETENTION. Every step the clock reads survives at least the life of an open stage. Add
       `daemon.boot_held`, PAUSE/STOP `daemon.admission_held` and `daemon.sweep_light.held` to the retained set
       in src/lib/ledger.ts with this consumer named, as that file's doctrine requires. Otherwise read them
       through the existing union reader. Do not widen retention for any other step.
