  falsifier: |
    The unchanged filing base has no production selected-mode qualification
    context; actual run/sweep observers cannot report the selected file's mode or
    changed digest. New behavioral cases fail at those actual consumer seams.
    Removing forwarding/rechecks or sharing caller-mutated inputs must restore
    that failure. Restored green must preserve the independent ACTUAL legacy
    effects, not pretend SHADOW denied them. A passing pure producer test, stored
    trusted string, invented identity or unchanged-source retry is not evidence.
