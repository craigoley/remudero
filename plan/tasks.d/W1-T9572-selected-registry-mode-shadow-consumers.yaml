  rationale: |
    READ actual main f59f4a2a1406b64124d64759c797f4866b68bfa9. Normal source
    merges11714/11802/11845 provide selected immutable reads, explicit bound writer
    targets and full lifecycle fields. They do NOT qualify actual mode consumers.
    instanceMode/readInstanceRegistryText still use fixed checkout-local legacy
    text; missing or malformed legacy evidence becomes live. runTaskBody holds
    that result for deferred arming; buildSweepEffects computes repoMode from the
    same separate read; daemon.target reports it independently. Only the opted-in
    registry route calls the selected reader. CLI pause and a daemon input still
    trim/OR their own RMD_INSTANCE_REGISTRY overrides. Those other target readers
    remain separately governed; this task is the run/sweep MODE-EVIDENCE concern,
    not every deployment/serve/pause/heartbeat consumer or private activation.
    The fresh complete main/ALL16-open-head source/plan sweep and100-PR window
    11702..11855 credit actual source9559; no competing selected-mode source task
    was found. Run-child11852, feedback-reply11838 and garden-pacing11833 touch
    other run-task sections. Use actual normally merged source if those evolve;
    do not infer compatibility from their open head or copy their implementations.
    The legacy invalid/unreadable-to-live tests are intentional compatibility
    controls, not tests to weaken. Shadow evidence must report unknown/would-refuse
    without changing those effects or inventing selected live authority.
  design: |
    1. Reuse the existing async selected reader and immutable binding in
       instance-mode.ts. Add a bounded typed selected mode reading for exactly
       the target repository/instance, with explicit legacy, ready, unknown and
       refused outcomes. Resolve supported CLI input, supplied environment and
       configured path once; preserve true absence versus explicit empty. Never
       reread a healthy legacy path after selected failure. Require actual mode
       evidence for a selected effect observation; missing/retired/ambiguous
       identity, missing mode, unsupported contract/capability, revision change
       and outages stay unknown/refused rather than becoming selected live.
       Keep the existing legacy helpers and their absence behavior unchanged.
    2. Wire an OPTIONAL production qualification context at actual CLI/run and
       daemon/sweep composition roots, not fixture-only currentSubject injection.
       Support only opt-in SHADOW observation in this source step; absent context
       issues no new selected reads or receipts and preserves legacy effects.
       An existing shell env value alone must not silently enable a new runtime
       admission policy. Reuse existing input/clock/IO ports; declare any optional
       configuration and environment readers in the existing public schema.
       Validate/snapshot the opt-in and every input before awaiting. Do not add
       an enforcement/ON activation path, private selection, new CLI daemon,
       registry service, scanner, scheduler or live config write here.
    3. Carry the same immutable result through runTaskBody's deferred arm and the
       independent sweep arm/direct-merge/queue paths. Re-read bounded current
       selected evidence immediately at the actual attempted effect observation,
       not a startup-only trusted string. A changed/unknown read cannot grant
       permission. Preserve distinct selected shadow/live/unknown reasons and
       original binding digest; do not silently retarget a pending run. Observe
       each real arm outcome, including awaited async defaults and existing
       fallback/direct effects. A sync-only seam cannot certify fresh async
       authority: name that unknown, do not add a blocking sync adapter.
    4. In SHADOW, record would-refuse/would-shadow/would-live alongside the ACTUAL
       unchanged legacy outcome. An observer never blocks an effect, authorizes
       private source publication, clears owner holds or bypasses existing
       review/CI/security. Existing genuine shadow-instance no-arm behavior stays
       enforced as before. Preserve owner/admin override, configured-human/service
       scopes, trusted PR flow, direct/default absent-context behavior and real
       required checks. Selected integrity and actor admission are not a private
       publication grant. Serialized receipts and worker/proof arguments contain
       no private paths, bytes or invented PR-head/actor/repository identities.
    5. Use real default async filesystem reads in disposable selected/healthy-legacy
       fixtures and sentinel current-evidence changes during in-flight work.
       Exercise actual run and sweep adapters, independent arm/direct/queue
       branches, fresh source revisions, caller/port mutation, every newly reached
       catch, bounded timeout/cancellation and responsive event-loop controls.
       Configured SHADOW effects must equal legacy controls even when the selected
       observation would refuse. Removing reader forwarding/current recheck or
       immutable snapshots must fail the corresponding real-consumer criterion;
       exact restoration must pass. Do not call a producer-only metadata test
       full consumer qualification or a would-deny receipt live blocking proof.
    6. Reuse existing off-loop orchestration and receipts to keep reads bounded
       and repeated unchanged causes quiet; no critical-loop scanner, unbounded
       corpus walk or new gardener activation. Retain original failure/cause
       identity across summaries. Evidence unknown never times out into trusted
       or external. This task cannot activate or re-adopt foreign source input.
    7. Refresh BOTH scope-time checks before build AND publication: actual main,
       ALL OPEN-head subject blobs/real own diffs with corpus/window controls,
       exact merged Task trailers OR run branches, live remote branches, package
       runnableCandidates and ordinary task ownership. Keep existing claims and
       checkpoints recoverable. All final paths fit this scope; a demonstrated
       additional consumer needs a normal files-only amendment ACTUALLY MERGED
       before editing. No baseline widening, primitive rename, fake production
       call, detector exemption, extra reviewer or gate waiver. Commit before
       verified-path/childtsx/tmp-hygiene/shipped-host-slot tests and source-mapped
       diff coverage; prove each changed source SF. One native author per distinct
       tree; EVERY failure compares on its actual unchanged pinned base with
       complete TAP before attribution or repair. Unknown causes stay unknown.
    8. Update the contract doc/index only as needed. After this source merges,
       deployment/serve/pause/heartbeat and supported child-process forwarding
       still need separate actual-consumer qualification before immutable private
       staging. Live enforcement, selection or cutover requires bounded recovery
       proof AND separate human authorization. WORKERS CONTINUE for isolated
       source/tests. Inspect baked and automatic freshness implications before
       publication; compatible live replacement needs human exact-instance drain,
       incompatible shared state/claims/credential/config changes need approved
       FULL AFFECTED WRITER STOP, ALL only if ALL affected. No schedules recreated.
