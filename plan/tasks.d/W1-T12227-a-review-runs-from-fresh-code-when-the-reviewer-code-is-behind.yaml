  rationale: |
    OBSERVED 2026-11-04T01:56Z to 2026-11-11T01:56Z in the ledger of the core instance: 42 reviews ran in full and then the publication check refused them for stale reviewer code.
    - 34 of the 42 had the verdict success and 8 had the verdict failure. The median review time was 6.5 minutes each.
    - The 42 reviews were on 33 pull requests. After the refusal, the pull request waited a median of 39 minutes for its next verdict. The longest wait was 389 minutes.
    - 11 of the 45 restart decisions had the trigger "withheld reviews". So these refusals also cause restarts.
    - The fresh-tree review ran 56 times, and 43 of them used the slow `tsx` entry.
    READ at origin/main 17745c6bf:
    - The sweep asks `buildReviewerCodeFreshnessGate` in src/run-task.ts. On a stale reading the gate sends the review to the fresh tree. That path decides at admission already.
    - `buildRequiredFixReviewRunner` reads the freshness at the start and then runs the review in this process, whatever the reading says. A stale reading is refused only at publication.
    - `runDetachedReview` in src/lib/run-child.ts calls the review command with no start reading. The command then reads the freshness just before it posts (`reviewerFreshnessForPublication` in src/cli/commands/review.ts).
    - A fresh-tree child reads at its own start (W1-T9727) and runs the review also when that reading is stale.
    - `reviewerCodePublicationRefusal` in src/lib/review.ts refuses a terminal verdict on a stale or unreadable reading and writes `review.post_refused`.
    - `spawnRmdReviewForFreshTree` asks the store for a compiled entry (W1-T11152). A tree at a new commit of main is usually not in the store, so `bin/rmd` starts `tsx`.
    Which of the three paths gave the 42 refusals is not established. The row of criterion 5 names the path, so the count per path is readable after the merge.
    This task depends on W1-T12225 and W1-T12226: it sends more reviews through the fresh tree, and that path failed in 26 of 56 runs.
  design: |
    INVARIANT fresh-reading-runs-as-today: with a fresh reading at admission the review runs in this process and that
    reading decides the publication, as today.
    1. `decideReviewPath` in src/lib/run-child.ts decides the path of a review before any reviewer spend. It reads the freshness once. Fresh or unreadable: run in this process with that reading as the start reading (unreadable keeps the just-in-time read at publication, as today). Stale: run from the fresh tree through the gate's `fromFreshTree`. Inside the fresh tree, `buildFreshTreeReviewRunner` still sends a review whose shared tree is leased to its own per-attempt tree (W1-T14066).
    2. `reviewerCodeStartGate` (the sweep gate, and the run child's review through `gatedDetachedReviewCommand`, W1-T12824) and `buildRequiredFixReviewRunner` (src/run-task.ts) call that function. On a stale reading the required fix review runs from the fresh tree through the sweep's gate and returns a withheld result, so the fix rung stands down as it does on a withheld verdict today.
    3. In the review command, a child with the flag `--judge-at-own-start` that is not a shadow review and reads stale returns before the pending status and before the reviewer, with the exit cause `reviewer-stale-at-start` (W1-T12226's cause; its gate retry at the new head of main stays as built).
    4. In `publishReviewStatusLocked`, when the refusal is for a stale reading and the state is terminal, write `review.refused_after_finished_review` after `review.post_refused`. Take the path and the reviewer time from the caller. This row is a defect count: the target is 0.
    5. In `spawnRmdReviewForFreshTree`, when the store misses for the shared fresh tree, call `fillStoreForOwnTree` once per commit with source `fresh-tree-review`. Do not wait for it. The build writes its existing `child_entry.*` result row. A per-attempt tree is not built, because it is removed when it settles.
    Keep the fail-closed rule: a review runs with fresh code or it does not run.
    NOT IN SCOPE: the restart score (W1-T12230), and a verdict that was computed and could not post (W1-T11928).
  falsifier: |
    Let `buildRequiredFixReviewRunner` run the review on a stale reading and criterion 1 must fail. Let the run child's review skip the start check and criterion 2 must fail. Let a stale child start its reviewer and criterion 3 must fail. Remove the new row and criterion 5 must fail. Remove the build and criterion 7 must fail. Restore and require all eight to pass.
  note: |
    Amendment 2026-11-23 (hand scope scan stacked on W1-T12226, nothing committed): W1-T12824 moved the start gate, the
    fresh-tree row and the detached review to src/lib/run-child.ts, and gated `runDetachedReview`, so the run child no
    longer calls the review command with no start reading. W1-T12226 names a fresh-tree child's stale own-start exit
    `reviewer-stale-at-start` and adds the one gate retry; this task keeps that name and makes the child exit before
    judging. Two tests outside the old files change: test/a-review-is-judged-against-main-at-its-start.test.ts (the
    W1-T9727 stale own-start case no longer reaches post_refused) and
    test/an-untasked-pr-silently-skips-the-semantic-reviewer.test.ts (buildRequiredFixReviewRunner takes the gate). The
    scan ran 115 related suites with the change; no other test changes. A shadow review is exempt from the early exit,
    so calibration cases stay measured.
    After the merge, read the rows for 7 days. The count of `review.refused_after_finished_review` was 42 in the 7 days before; the target is 0. The restart decisions with the trigger "withheld reviews" were 11 of 45; they fall when the refusals fall.
