  acceptance:
    - claim: "A review that the fix pipeline requires reads the freshness of the reviewer code before it starts a reviewer. If the reading is stale, the review runs from the fresh tree and no reviewer starts in this process. The test drives `buildRequiredFixReviewRunner`"
      proof: "grep: W1-T12227 criterion 1 in test/review/a-review-runs-from-fresh-code-when-the-reviewer-code-is-behind.test.ts"
    - claim: "A review that runs as a run child goes through the same start check before it starts a reviewer. If the reading is stale, the child starts no reviewer and the review runs from the fresh tree. The test drives `runDetachedReview` through `buildReviewerCodeFreshnessGate`"
      proof: "grep: W1-T12227 criterion 2 in test/review/a-review-runs-from-fresh-code-when-the-reviewer-code-is-behind.test.ts"
    - claim: "A fresh-tree child whose own start reading is stale exits before its pending status and before it starts a reviewer, with the exit cause `reviewer-stale-at-start`. The gate then runs the review one more time, from a tree at the new head of main. It does not try a third time"
      proof: "grep: W1-T12227 criterion 3 in test/review/a-review-runs-from-fresh-code-when-the-reviewer-code-is-behind.test.ts"
    - claim: "If the fresh tree cannot run, no reviewer starts and the row `review.skipped_stale_reviewer_code` gives the reason, as today. No path starts a reviewer on a stale reading"
      proof: "grep: W1-T12227 criterion 4 in test/review/a-review-runs-from-fresh-code-when-the-reviewer-code-is-behind.test.ts"
    - claim: "If the publication check refuses a terminal verdict for stale reviewer code after a reviewer ran, it writes one row `review.refused_after_finished_review`. The row has the pull request, the head, the path that admitted the review and the reviewer time spent. The row `review.post_refused` stays as today"
      proof: "grep: W1-T12227 criterion 5 in test/review/a-review-runs-from-fresh-code-when-the-reviewer-code-is-behind.test.ts"
    - claim: "invariant:fresh-reading-runs-as-today — with a fresh reading at admission, the review runs in this process and that reading decides the publication, as today"
      kind: guard
