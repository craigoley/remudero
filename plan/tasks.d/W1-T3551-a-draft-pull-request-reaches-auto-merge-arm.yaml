- id: W1-T3551
  title: "A DRAFT PULL REQUEST REACHES AUTO-MERGE ARM BECAUSE THE `mergeable` DISPOSITION AND ITS ARM PATH NEVER READ `OpenPrView.isDraft` — GitHub then refuses the arm and the sweep logs it as an acted-on failure rather than a named held-draft disposition, so the hold silently repeats every pass"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 40.00
  files: [src/lib/sweep.ts, src/lib/review.ts, src/lib/arm-auto-merge.ts, test/draft-pr-merge-hold.test.ts]
  origin: "feedback#fb-1789331541509-6463e8"
  plan_refs: ["W1-T528", "W1-T1000002", "W1-T93"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED FROM SOURCE IN THIS WORKTREE, NOT ASSUMED. `src/lib/sweep.ts`'s `DISPOSITION_RULES`
    carries exactly one row that arms auto-merge:

      disposition: "mergeable"
      when: (pr) => pr.checksState === "green" && pr.reviewState === "success"

    with NO `isDraft` term (sweep.ts, the row documented "POSITIVE MATCH ONLY (W1-T93)"). Contrast
    the SIBLING eligibility filter `armedButStalled`'s caller two hundred lines below, which DOES
    gate on it: `if (view.isDraft === true) return false;` (sweep.ts:5385, W1-T528). So one arm-
    adjacent path in the same file already treats a draft as excluded and the arming path itself
    does not.

    Downstream, neither `decideAutoMergeArm` (src/lib/review.ts) nor `armAutoMerge`/
    `armAutoMergeDetailed`/`armAutoMergeAtOpen` (src/lib/arm-auto-merge.ts) reference `isDraft`
    either — grepping `isDraft` across those three functions returns nothing. So a draft PR that is
    green and review-success-carrying is classified `mergeable`, the sweep calls the real arm
    effector, GitHub refuses because the PR is a draft, and the caller records whatever generic
    failure/log shape an arm rejection produces today rather than a distinct, named held-draft
    disposition. The next sweep pass re-derives the same `mergeable` match and repeats the attempt.

    DR-1734 (this repo's own ratified record) already states the constraint in prose: "an
    irreversible diff, a non-green PR, a draft, and a CAPPED verdict without a ledgered override
    still never arm. That clause may not be softened by an implementer." The `mergeable` row is the
    live violation of that clause's third named case.

    W1-T1000002 shipped the adjacent shape (a ledgered hold refused inside `alreadyDone`, converging
    disarm, at-open gate at `attemptArm`) for an OPERATOR hold. A draft is a DIFFERENT, GITHUB-OWNED
    signal — it needs no ledger row and no operator author, only a positive predicate read off
    `OpenPrView.isDraft`, but it belongs at the SAME two seams W1-T1000002 names: the `mergeable`
    disposition's match (or a row ordered before it) and wherever `attemptArm`/`armAutoMergeAtOpen`
    originate an arm, so a draft opened directly (not reached via the sweep's periodic pass) is
    caught too.
  design: |
    (i) ADD A `held-draft` DISPOSITION, ORDERED BEFORE `mergeable`, MATCHING `pr.isDraft === true`
    together with the checks-green/review-success predicate `mergeable` already uses (never widen
    `mergeable`'s own `when` per the rejected alternative W1-T1000002 §(viii)(c) already recorded:
    silently re-dispositioning a PR by editing an existing row's predicate hides the change from
    review). `acted: false`, reason names the draft state explicitly ("open pull request is a draft
    — GitHub refuses auto-merge on a draft; held until marked ready for review"), so no dedup key is
    seeded and the row re-derives cleanly every pass without ever calling the arm effector.

    (ii) A MANUAL `rmd review <pr>` MAY STILL INSPECT A DRAFT (post a verdict, run checks) BUT MUST
    NOT ARM IT: gate `attemptArm`/`armAutoMergeAtOpen` (or their shared call site) on the same
    `isDraft` read so a draft never reaches the effector regardless of entry path, mirroring
    W1-T1000002 design (v)'s "gate where arms originate, which is two call sites, not eight."

    (iii) PRESERVE NON-DRAFT BEHAVIOUR EXACTLY: a PR with `isDraft !== true` (including `undefined`,
    since an absent field must never silently read as `false` and grant arm eligibility) falls
    through to the existing `mergeable` row unchanged.

    (iv) POST-FIX RECONCILIATION: the same held-draft row must re-fire on a later sweep pass over an
    unchanged draft PR (no dedup key survives it, per (i)), so a draft that gained green checks and
    review success after a previous pass is still held, not silently promoted.

    EXPLICITLY NOT IN SCOPE: any operator-authored hold ledger (that is W1-T1000002, already
    shipped and orthogonal); auto-marking a draft ready for review; any change to
    `armedButStalled`'s existing `isDraft` filter, which is already correct.
  acceptance:
    - claim: "a draft pull request with green checks and review success calls no arm effect during an ordinary sweep pass"
      proof: "unit test: test/draft-pr-merge-hold.test.ts"
    - claim: "the same draft pull request calls no arm effect on a later, post-fix reconciliation sweep pass either"
      proof: "unit test: test/draft-pr-merge-hold.test.ts"
    - claim: "a held draft's disposition row records acted false with a reason naming the draft state"
      proof: "unit test: test/draft-pr-merge-hold.test.ts"
    - claim: "a non-draft pull request with the same green checks and review success still arms exactly as before"
      proof: "unit test: test/draft-pr-merge-hold.test.ts"
    - claim: "a manual review of a draft pull request never reaches the arm effector"
      proof: "unit test: test/draft-pr-merge-hold.test.ts"
    - claim: "the sweep's disposition table carries a held-draft row ordered before the mergeable row"
      proof: "grep: held-draft in src/lib/sweep.ts"
  note: |
    FILES DERIVED BY READING THE SOURCE IN THIS WORKTREE: src/lib/sweep.ts (the `mergeable` row and
    `armedButStalled`'s existing `isDraft` filter at line 5385, both read directly above);
    src/lib/review.ts (`decideAutoMergeArm`, grepped for `isDraft` and found absent);
    src/lib/arm-auto-merge.ts (`armAutoMerge`/`armAutoMergeDetailed`/`armAutoMergeAtOpen`, same
    grep, same absence). risk: high because this is the merge-arm path itself and a wrong gate
    either strands a legitimate PR or re-opens the exact GitHub-refusal loop this task exists to
    close.
