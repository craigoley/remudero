  falsifier: |
    Route on the anchor alone, without the criterion join. The met-criterion finding then lands on the fix
    prompt, and the follow-up test fails.
    Drop the prior-route check. A replayed review appends a second route row and mints a second candidate, so the
    idempotency assertions fail.
    Treat a stale-head or unsupported-anchor row as verified. The UNKNOWN test then sees a harvest candidate and
    fails.
    Mark a follow-up linked whenever any task names the PR. The ownership test's unrelated task flips the state,
    and the test fails.
    Delete the router call from review.ts, and the production-wiring proof fails.
  note: |
    Telemetry-to-authority handoff only. Each finding goes to an authority that already exists: the same-PR fix
    rung, or the follow-up harvest, then the proposal registry, then the machine judge. A verified anchor is
    provenance, not correctness. Shares paths with W1-T10846 (fix.ts, prompt-render.ts, run-task.ts), and dispatch
    overlap detection serialises the two.
