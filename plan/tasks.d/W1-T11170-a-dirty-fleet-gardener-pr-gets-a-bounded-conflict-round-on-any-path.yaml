  acceptance:
    - claim: A dirty PR whose head matches MACHINE_LANE_HEAD_RE and whose author isFleetAppAuthor gets one bounded conflict round per head and main tip, whatever paths its conflict names, instead of blocked-ambiguous "head is not this PR task's rmd-owned run branch"; a dirty head that is not a machine-lane head, or is not fleet-App-authored (an operator session's run-unfiled-* or plan-file-* head included), stays blocked-ambiguous exactly as today
      proof: "unit test: test/sweep/a-dirty-fleet-gardener-pr-gets-a-bounded-conflict-round-on-any-path.test.ts"
    - claim: On such a head the round's deterministic tier runs before any worker, in a tree cut at the PR head under regenerateConflictViaGit's leases, sandbox and fence; a conflicted path main deleted takes main's deletion, a path whose PR change is already on main byte for byte (the redundant re-fix comparison) takes main, and a REGENERABLE_ARTIFACT_GENERATORS path takes its generator's output; it pushes only when every unmerged path is resolved, and writes a sweep.conflict_regenerated row with mode take-main or regenerate per path
      proof: "grep: W1-T11170 criterion 2 in test/sweep/a-dirty-fleet-gardener-pr-gets-a-bounded-conflict-round-on-any-path.test.ts"
    - claim: When the deterministic tier leaves a path unresolved, the plan-scoped round (W1-T9289) takes plan-scope conflicts and the merge-conflict fix mode takes the rest, each under the existing strike cap and fix claim; after a round that fails, the fix progress judge decides whether another round, a change of approach, or one escalation follows, and no fixed count ends the repair
      proof: "grep: W1-T11170 criterion 3 in test/sweep/a-dirty-fleet-gardener-pr-gets-a-bounded-conflict-round-on-any-path.test.ts"
  rationale: |
    MEASURED 2026-11-03 ~00:30Z over the 7-day conflict rows of the core ledger union (~/Remudero-notes/conflict-findings-2026-11-03.md,
    evidence in ~/Remudero-notes/conflict-evidence-1103/, read-only). Code read at origin/main c0a6f1c74.
    Non-run branches are never repaired: 133 of 1,096 conflict-disposed passes (12.1%) across 4 PRs.
    - #15551 (head review-replay-garden-1793300871628, author app/remudero-fleet, closed unmerged): 160 blocked-ambiguous passes
      from 2026-10-31T00:12Z to 2026-11-01T13:25Z (36.5 h). The one file was test/fixtures/review-replay/sample.ndjson. 60
      merge probes read conflict, and update-branch answered 422 on each try. 105 passes read "deferred to full sweep (light
      pass)". No round was ever admitted: the conflicted row needs fixHeadAcceptable, a PR task's own run- branch, and W1-T9289's
      planConflictRoundCandidate needs every path in plan scope.
    - #16044 (head backlog-garden-1793547598484, the fleet App, closed unmerged): 47 rows over 22.1 h on
      plan/tasks.d/W1-T11078-product-plan-resolves-the-managed-target-checkout.yaml: 18 wait and 29 blocked-ambiguous. 2
      plan-scoped rounds were dispatched, 15 deferred on the light pass, and 17 read "an escalation was already filed for this
      head". W1-T9289's round is a worker round. Nothing tries take-main or a generator first.
    - #16236 and #14277 (both merged) were dirty plan-only PRs for 1 and 4 passes. Their heads are run-unfiled-* by cao825, an
      operator session's branches, not fleet-owned. They stay out of this task (see note).
    READ: MACHINE_LANE_HEAD_RE and isFleetAppAuthor already define a fleet-owned head (the gardeners, the landings,
    TRIAGE/APPROVE/RETRO). The plan round reads the author through readPlanRepairFacts. regenerateConflictViaGit already holds
    the lease, sandbox and fence for a tree cut at a PR head. isRedundantRefixConflict already compares a path's PR change to
    main byte for byte. REGENERABLE_ARTIFACT_GENERATORS already names the generators.
    Operator ruling 2026-11-02: rmd must resolve merge conflicts automatically, with a gardener as the backstop. Repair loops get
    an LLM progress judge.
    NOT COVERED ELSEWHERE: W1-T9289 (merged, #12793) covers plan-scope conflicts on these heads, by a worker. W1-T9578 (merged,
    #13952) covers registry-only conflicts on run- branches. W1-T11167 (item 4) covers a clean local merge on run- branches.
    W1-T11171 (item 6b) decides WHEN a conflict round may run (light passes, ranking). This task decides WHICH heads one may
    write to and in what tier order.
  design: |
    1. OWNERSHIP. Add a fleetOwnedConflictHead(pr, facts) predicate: isMachineLanePlanHead(pr.headRefName) and
       isFleetAppAuthor(facts.authorLogin), with the author read once per pass as the plan round already reads it. A dirty PR
       that passes it and has captured conflict evidence (or a probe conflict row at the exact head and main) leaves the
       blocked-ambiguous row for the round below. Everything else keeps today's rows.
    2. DETERMINISTIC TIER. Through regenerateConflictViaGit with a fleet-owned mode: the same fetch, leases, detached tree,
       merge, `ls-files -u`, sandboxed generators, ancestry check and leased push. Per unmerged path: absent from main, take the
       deletion. Present in REGENERABLE_ARTIFACT_GENERATORS, run its generator. PR change already on main byte for byte, take
       main's blob. Any other path aborts the merge and falls to 3. The commit carries no Remudero-Task trailer when the PR has no
       task (SWEEP). A gardener's record line in a plan shard is never edited by hand: a plan path that is not redundant falls
       to 3.
    3. ROUND. Plan-scope paths go to the existing plan-scoped round (dispatchPlanGateRound). Others go to dispatchFix in
       merge-conflict mode with the PR's file list, both sides' logs and the PR body, keyed by escalationTaskIdFor(pr) as the
       plan round already is. Both use the existing claimFixDispatch, claimFixAdmission and strike cap. After a failed round,
       resolveFixProgress with the round history, as the plan round's refused-twice arm does, decides between continue,
       change-approach and escalate.
    4. RECORD. sweep.conflict_regenerated rows with mode take-main, regenerate or deleted-on-main per path. The disposition is
       conflicted, with a reason naming the tier.
    Tests go in the new file, titled verbatim as in the proofs, against real throwaway repos (gitRepo()), with heads named
    review-replay-garden-<n> and backlog-garden-<n>, an injected author and an injected judge.
  falsifier: |
    At origin/main a dirty review-replay-garden head conflicting on a test fixture dispositions blocked-ambiguous "head is not
    this PR task's rmd-owned run branch" and no round runs, so the first test fails. If the redundant comparison or the
    deletion arm is dropped, a backlog-garden fixture whose shard change is already on main dispatches a worker instead of
    pushing take-main, and the second test fails. If a fixed round count replaces the judge, the third test's change-approach
    fixture escalates and fails.
