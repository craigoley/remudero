  note: |
    PROVENANCE IS W1-T2312'S, UNCHANGED — one third of a single filing from
    feedback#fb-1785982194342-bb9d81, split under `rule15-filing`, not a new finding.

    `depends_on: [W1-T2313]` IS NOT DECORATION. Until W1-T2313 removes the sentence from W1-T65's
    `design:` body, criterion 1 is UNSATISFIABLE: a correct implementation of this test goes red on
    the live corpus. Dispatching this first would burn a run producing a true failure and then
    tempt the worker into weakening its own predicate to get green — the exact criteria-softening
    `remudero-review` exists to refuse. The spine is W1-T2313 -> {W1-T2312, W1-T2314}.

    RULE 19, ANSWERED RATHER THAN WAIVED. One new file, one module id — there is no second
    subsystem to decompose toward, so `sizingViolation` does not fire at `risk: medium` and raising
    to high would be noise. The three criteria are three assertions over ONE predicate in ONE file,
    which is the W1-T4/W1-T3E shape Rule 19 explicitly does not count as span.

    NO CALL-SITE CRITERION IS OWED, AND HERE IS WHY. `callSiteViolations` fires on a task that
    CREATES a `src/` module reached only by its own tests; this task creates a TEST and no `src/`
    module at all, so there is no consumer to grep for. The reachability question it exists to ask
    is answered by construction: `node --test` over `test/` is the caller, and the suite runs in the
    required check. If the predicate is ever lifted into a `src/lib/` module for a linter check to
    share, THAT task owes a `grep: <symbol>( in <its caller>` criterion.
