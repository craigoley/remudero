      proof: 'grep: test("W1-T8038: a timed-out shard whose annotations only name the timeout reads its job log" in test/a-shard-cancelled-at-its-timeout-names-its-failure.test.ts'
    - claim: "a pool defect line names the leaking and victim files in the signature"
      proof: 'grep: test("W1-T8038: a pool defect names its leaking and victim files in the signature" in test/a-shard-cancelled-at-its-timeout-names-its-failure.test.ts'
    - claim: "a shard cancelled at its ceiling after a passing summary is classified, never null"
      proof: 'grep: test("W1-T8038: a shard cancelled after a passing summary reads as timed out after a passing summary" in test/a-shard-cancelled-at-its-timeout-names-its-failure.test.ts'
  falsifier: |
    Leave ciFailuresSteps taking any non-bare annotation as the whole tail. The timed-out fixture's logTail is
    then only the runner lines, and the first test fails. Drop the pure-test-pool retention or the POOL DEFECT
    arm, and the signature test reads a null or a bare file. Remove the passing-summary arm, and the third test
    reads undefined, which is the 10-11 null.
