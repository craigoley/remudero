  design: |
    No new constant or count. Classify by what the log says.
    1. FETCH. In ciFailuresSteps, an annotation set that holds only the runner's own cancellation or timeout
       lines is treated like the bare exit-code case. The job log region is read as well. The runner line is
       kept beside the region so the timeout stays visible. A readable log is never displaced by annotations.
    2. REGION. extractCiFailureRegion and ciFailureRegionReducer retain the `pure-test-pool:` verdict lines
       (pool failed, also fail isolated, POOL DEFECT with leaker and victim). They are retained the way
       FLAKE-RETRY lines already are: one copy each, wherever they sit in the job.
    3. SIGNATURE. ciFailureSignature names, in this order:
       a. a POOL DEFECT line, by its leaking and victim files;
       b. a pooled `not ok` whose isolated re-run passed, by the failing file, marked as a pool failure;
       c. a job killed at its ceiling after a complete passing summary, as "timed out after a passing summary";
       d. a job killed at its ceiling with no summary, by the last started unfinished test if the log names
          one, else "timed out with no test result".
       A check whose log was readable and red never gets a null signature again. A log that could not be read
       keeps its logUnavailable cause. That case is not a signature.
    4. The fix.dispatch row's ci_failures then carries these signatures unchanged (run-task.ts maps
       ciFailureSignature). The fix prompt's evidence (ciFailurePromptEvidence) carries the retained lines.
    5. BASE REFRESH. decideRedBaseRefresh also refreshes, before the strike, when both of these hold:
       a. The red is a timed-out or cancelled check, or one with no file-level signature.
       b. The PR is behind main, and the commits it lacks change the harness that check's job runs rather
          than tests: its workflow file under .github/workflows/, the scripts/ entry points the job invokes,
          or test/setup/.
       The matched base files go in matching_base_files on fix.base_refresh_checked, as they do today. An
       exact failing-file match still refreshes as before. A PR that is not behind, or whose missing commits
       touch none of that harness, falls through to the strike unchanged.
    Tests go in a new file, test/a-shard-cancelled-at-its-timeout-names-its-failure.test.ts, with `test(`
    titles verbatim as in the proofs below. Drive fetchCiFailuresAsync with injected fetchAnnotations and
    fetchJobLog fakes that replay the 10-11 shape: annotations holding only the runner's timeout lines, and a
    job log with the pooled not ok, the isolated pass summary, the POOL DEFECT line and the cancel marker.
    Drive decideRedBaseRefresh with the 14:35Z shape: a timed-out ci-shard red, behind_by 7, and a base diff
    touching scripts/pure-test-pool.mjs. Add a control whose base diff touches only an unrelated src/ file.
