      proof: "unit test: test/a-grep-proof-naming-an-added-test-file-greps-the-copy-put-there-for-it.test.ts"
    - claim: "the decision reads the added-file set the copy itself uses, so the two cannot drift apart"
      proof: "grep: addedTestFiles in src/lib/review.ts"
    - claim: "a grep proof naming a test file that ALREADY existed at the base still degrades as stale, so the fix narrows nothing"
      proof: "grep: still-stale in test/a-grep-proof-naming-an-added-test-file-greps-the-copy-put-there-for-it.test.ts"
