    - claim: "that escalation names the repo-wide required-contexts read as the observed blocker, including the branch it could not read"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
    - claim: "a required-contexts read that FAILED is distinguishable from protection that declares no required contexts — the producer no longer collapses both into one boolean"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
    - claim: "the classified cause is captured where the read happens and reaches the disposition view without a second GitHub call"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
    - claim: "the disposition is unchanged: an unreadable gate still escalates, and nothing posts a review or arms auto-merge on it"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
    - claim: "a readable required-contexts read still routes a checks-green, review-none PR to the review lane exactly as today"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
    - claim: "the read still fails soft — a throwing or absent gh never crashes the sweep pass"
      proof: "unit test: test/protection-read-failure-is-named.test.ts"
  note: |
    (i) W1-T176 BOUNDARY (ii) IS NOT REOPENED, AND MUST NOT BE. That task settled, at risk:high, that
    an unreadable gate classifies AMBIGUOUS and ESCALATES — "an unreadable gate must never be assumed
    permissive" — and this task keeps that verbatim. Nothing here posts a review, arms a merge, or
    downgrades the shape to `wait`. What is unsettled, and all this task claims, is WHAT THE
    ESCALATION SAYS: W1-T176 wrote the fail-closed rule and never wrote the sentence, so the fallback
    sentence is the generic catch-all — and W1-T186's ABSENT branch then fills the silence with a claim
    that is false for this cause. A build that "fixes" this by no longer escalating has rebuilt the
    exact fail-open hole W1-T176 was filed to close.

    (ii) THE FEEDBACK'S OWN LIMIT IS RESPECTED. fb-2955 reports a RECURRENCE and states its root cause
    is unobserved; it is not evidence for a remedy. What is cited above as OBSERVED is only the four
    ledger rows and their timestamps. Everything else is re-derived from source in this working tree
    and stated as such — the 17-minute band is consistent with a bounded read outage and is NOT claimed
    as proof of one, because the cause is precisely the thing the code currently discards. Once (3)
    ships, the next occurrence names its own cause and no one has to reason like this again.

    (iii) AND THE SIBLING FEEDBACK IS WHY THIS ONE IS ACTIONABLE. fb-2954 covered the same surface and
    was REJECTED, correctly: its 20 PRs wore seven different reasons, so "blocked-ambiguous recurs" was
    a surface-level count with no single defect under it. fb-2955 is homogeneous — one reason, one
    shape, one discriminator — which is what makes a filing possible here and was not possible there.
    A future heterogeneous recurrence on this surface should still be rejected on the same grounds.

    (iv) RULE 19 BAND. `risk: high` is set UP FRONT because `files:` spans three source stems — the
    reader (`status.ts`), the producer (`run-task.ts`) and the renderer (`sweep.ts`) — and Rule 19
    refuses ≥2 subsystems below high. THE BAND IS THE SPAN READING, NOT A BLAST-RADIUS JUDGEMENT: no
    disposition changes, no new GitHub call, and the behavioural surface is one predicate plus the text
    it selects. The span is irreducible — the fact is destroyed in the reader, so it cannot be named in
    the renderer without crossing both.

    (v) NO depends_on. W1-T186's build is already in source, W1-T176's rule is already enforced, and
    W1-T2293 is a different router; nothing here waits on any of them.
