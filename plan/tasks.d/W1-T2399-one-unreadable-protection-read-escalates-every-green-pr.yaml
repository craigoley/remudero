- id: W1-T2399
  title: "ONE UNREADABLE BRANCH-PROTECTION READ ESCALATES EVERY CHECKS-GREEN PR IN THE PASS, AND TELLS THE OPERATOR THE OPPOSITE OF WHAT HAPPENED — `requiredContextsUnreadable` is the ONLY residual discriminator that can drop a `checks green, review none` PR to the terminal catch-all, the repo-wide read that sets it is made ONCE PER SWEEP PASS, its failure reason is thrown away inside a bare `catch`, and `observedBlockerState` then labels the PR ABSENT and asserts the required check has ZERO observed check runs — a claim about the PR's checks that the sweep never observed and that its own green `checksState` contradicts"
