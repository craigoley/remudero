    `deploy/Dockerfile` DOES NOT MATCH — deploy/ is not instrument surface — and neither does
    `src/lib/worker-home.ts`, its test, nor `src/lib/env.ts`. Positive controls:
    `.github/workflows/ci.yml` and `scripts/coverage-ratchet.mjs` both DO match. So this task is NOT
    instrument-entangled and does not ride alone. The Dockerfile is cited throughout and is NOT in
    `files:` — nothing in the image needs to change, which is the whole point of rationale (1).

    THE FIRST QUESTION NEARLY KILLED THIS TASK AND THE ANSWER IS RECORDED SO IT IS NOT REOPENED. The
    variable is unset deliberately, the reason still holds, and the shard is written to work WITH
    that decision rather than against it. If a future reader proposes setting
    `PLAYWRIGHT_BROWSERS_PATH`, rationale (1) is the refusal.

    PROOF DIALECT UNIFORM. Every criterion forward-references through `unit test:`. A
    forward-referencing `grep:` at an EXISTING path is a hard refusal on a filing PR: the path is
