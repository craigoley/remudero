  design: |
    1. ONE HELPER, test/helpers/host-requirement.ts. `requiresLinux(reason)` returns `false` when
       `process.platform === "linux"`, unconditionally. On any other platform it returns
       `"Linux-only: <reason>"`, to be used as `test(title, { skip: requiresLinux("…") }, …)`.
       Take an optional `{ platform }` port so its own test drives both arms.
       It keys on the PLATFORM, never on a capability probe like `existsSync("/proc/…")`. On Linux it
       never skips, so a Linux host that lacks /proc, bwrap or GNU tools FAILS the test loudly rather
       than skipping it. That is how CI behaviour stays unchanged.
       A sibling for a non-Linux set (state-backup's win32 case) uses the same shape and the same
       never-skip-on-the-required-platform rule.
    2. TEST 1 BECOMES PORTABLE. Pass `runCheck: (input) => runOpenWeightCheck({ ...input, platform: "linux" })`
       to `spawnOpenWeightWorker`. The existing bwrap pass-through shim then runs the real runner and
       judge on every host. Production is untouched: the refusal off Linux stays, and the
       `platform`/`runCheck` ports are already declared test-only.
    3. TEST 2 DECLARES ITS HOST: `skip: requiresLinux("the real tree-peak sampler reads /proc/<pid>/status")`.
    4. TEST 3 BECOMES PORTABLE AT THE SOURCE. Both ci.yml collect steps copy without `cp -t`, using a
       form that BSD and GNU both accept (for example `xargs -0 -r -I{} cp {} "$RUNNER_TEMP/fold-debt/"`).
       The W1-T7853 test already runs the real step body and asserts the exact copied file set, so it
       is the evidence that CI behaviour is unchanged.
    5. MIGRATE the eight hand-rolled `skip:` host checks in the five files named in the rationale to
       the helper. Each one names its reason, and the three `existsSync("/proc/self/stat")` skips stop
       being able to hide a Linux failure.
    6. THE CENSUS, test/a-host-only-test-names-its-host-through-one-helper.test.ts. It walks
       `git ls-files test .github/workflows` and refuses three things:
       (a) a test's `skip:` option or `t.skip(` guard whose expression reads `process.platform` or a
           `/proc` path anywhere except the helper;
       (b) a test file that reaches a real procfs default (`createTreePeakSampler()` with no overrides,
           `defaultProbe`, `defaultGeneration`, or a `readFileSync`/`existsSync`/`readdirSync` of a
           "/proc…" literal) and neither imports the helper nor appears in a declared allowlist. Each
           allowlist entry is file plus reason and says why that file is green off Linux. This is the
           shape of test/host-capability-fixtures.test.ts: declared sites, no numeric cap.
       (c) a GNU-only flag in shell text a test can execute: workflow `run:` bodies, plus command
           strings in test sources. The token set is `cp -t`, `sed -i` with no suffix, `readlink -f`,
           `date -d`, `stat -c`, `find … -printf` and `grep -P`. It must not match BSD-stub argument
           checks such as `"$a" = "-printf"`. deploy/ scripts are out of scope here, because
           host-capability-fixtures' `platform-tool` kind and the stat/date fallbacks already cover them.
       The census plants one violation of each kind in a fixture tree and asserts it reddens (the
       falsifier).
