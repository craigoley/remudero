    The 6 skips are hand-rolled host checks. Across test/ there are eight such `skip:` sites in five
    files, written four different ways:
    `skip: !existsSync("/proc/self/stat")` (three tests in
    test/a-memory-reservation-is-released-only-when-its-whole-tree-is-gone.test.ts), a bare
    `skip: process.platform !== "linux"` with no reason (test/a-local-gate-run-has-no-bound-of-its-own.test.ts),
    and named-reason forms in test/a-claim-minted-before-this-namespace-booted-has-no-claimant.test.ts
    and test/heavy-build-reservation.test.ts. test/state-backup.test.ts skips on win32.
    The existsSync form is the dangerous one. A Linux host that lost /proc would SKIP those tests, not
    fail them.
    GNU-only flags in workflow `run:` bodies, measured over `cp -t`, `sed -i` with no suffix,
    `readlink -f`, `date -d`, `stat -c`, `find … -printf` and `grep -P`: exactly the two `cp -t` lines.
    In test sources: zero command uses. The only hits are BSD-stub argument checks such as
    `"$a" = "-printf"`, and the census must not match those.

    OVERLAP CHECKED, none. plan/ on origin/main and the shard diffs of all 24 remote heads that touch
