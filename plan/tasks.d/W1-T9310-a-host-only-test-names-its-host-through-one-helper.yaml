    ATTRIBUTED.
    1. The test plants a pass-through `bwrap` shim on PATH and drives the real open-weight tool loop.
       But `runOpenWeightCheck` (src/lib/worker-provider.ts) builds its argv through
       `openWeightCheckSandboxArgv`, which THROWS "cash RunCheck requires Linux bubblewrap; refusing an
       unsandboxed local check" when `process.platform !== "linux"`. That happens before any spawn, so
       the shim never runs. The error carries no stdout, so `run_check` returns `exitCode: 1` with
       `output: ""`. The exit-code assertion passes by accident and the judge-line assertion fails.
       The refusal is correct production behaviour. The test is what is not portable. The repo
       already has the portable idiom: `openWeightCheckSandboxArgv` takes a test-only `platform` port,
       `spawnOpenWeightWorker` takes a test-only `runCheck` port, and
       test/the-harness-commits-for-a-worker-with-no-shell.test.ts already passes `platform: "linux"`.
       PROVEN IN A THROWAWAY EDIT (not committed): passing
       `runCheck: (input) => runOpenWeightCheck({ ...input, platform: "linux" })` makes the file pass on
       darwin, so the real runner, the real `node --test` child and the real judge all run through the shim.
    2. `createTreePeakSampler()` (src/lib/host-memory-learning.ts) reads each member's peak from
       `/proc/<pid>/status` VmHWM. darwin has no /proc. The sampler "NEVER throws" by design, so it
       records no sample, `readPeakSamples("fix", …)` is empty, and `[0]!.peakMib` throws. The subject
       IS the real /proc sampler, so this test cannot become portable. It is Linux-only by construction.
    3. The test extracts the REAL `run:` body of the "Collect the fold debt …" steps from
       .github/workflows/ci.yml (two steps, in the `ci` and `commitlint` jobs) and runs it under the
       host's bash. Both bodies end `xargs -0 -r cp -t "$RUNNER_TEMP/fold-debt"`. `-t` is GNU-only, and
       BSD cp rejects it. PROVEN IN A THROWAWAY EDIT: `xargs -0 -r -I{} cp {} "$RUNNER_TEMP/fold-debt/"`
       makes the file pass on darwin, and it copies the same set of files on the GNU runner.

    SWEPT FOR MORE OF THE SAME KIND, bounded. 68 test files: every file that plants a `bwrap` shim or
    uses the pass-through sandbox, every file naming a `/proc/` path, every file reaching
    `createTreePeakSampler`/`defaultProbe`/`defaultGeneration`, the 21 files that run a workflow
