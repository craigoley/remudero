- id: W1-T11100
  title: A census source-reader's calibration is cached by its context hash and, in shadow, the preflight records the calibration runs a cache hit would have skipped
  repo: remudero
  depends_on: [W1-T11098]
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # one script, one concern: reusing a calibration measurement whose inputs have not changed, shadow first
  origin: operator-session#preflight-throughput-2026-11-02
  plan_refs:
    - W1-T5617
  files:
    - scripts/census-precheck.mjs
    - test/ci/gates/a-source-reader-calibration-is-reused-for-unchanged-inputs.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: An accepted census-reader calibration is stored under its context hash, and a later run with the same context reads it back and records a would-skip with the saved native milliseconds, while still running its own calibration in shadow mode
      proof: "unit test: test/ci/gates/a-source-reader-calibration-is-reused-for-unchanged-inputs.test.ts"
    - claim: A changed context, a failed or partial calibration, a case inventory that differs, or an entry older than the policy's calibration age is never a hit
      proof: "grep: W1-T11100 criterion 2 in test/ci/gates/a-source-reader-calibration-is-reused-for-unchanged-inputs.test.ts"
  rationale: |
    MEASURED 2026-11-02 over 12 author preflight receipts (progress.json under each worktree's coverage/rmd-author-*):
    - Wall time per run 45-90 min. census-precheck alone took 536-2,336 s, static-preflight 828-3,120 s, the affected subset 699-937 s.
    - The same census step took 536 s on 2026-10-30 and 2,336 s on 2026-11-02 at load average 34-47 on 8 cores: three author preflights and the fleet ran at once.
    - One census-precheck run (W1-T11094, 2026-11-02) ran 71 census suite files: 141 calibration or runtime lines, and 500 s of calibrationMs alone, before each suite's qualification run. runCensusSuitesViaChild calibrates every source-reader on every run, although its context hash (readContext) names exactly the inputs a calibration measures.
  design: |
    Shadow first. After an accepted calibration, write {context, tests, identities, elapsedMs, finishedMs} to an account-owned cache file keyed by context. Before calibrating, read the entry; when context, inventory and age all match, print census-reader-calibration-cache: {file, context, hit: true, wouldSaveMs} and still calibrate. Misses print hit false with the reason.
    Promotion to act (a hit replaces the calibration run): after 7 days, when hits agree with the fresh calibration (same inventory, elapsed within the policy's remeasure margin) in at least 95 of 100 hits, and the operator says yes.
  note: |
    reservation hand-off: run-unfiled-1793629687846 -> run-unfiled-1793629687846
    Reserved with rmd next-task-id from the operator checkout (W1-T11098..W1-T11102 on run-unfiled-1793629687846). Operator ruling 2026-11-02: "go with all of your recommendations"; the plan named this one shadow first.
