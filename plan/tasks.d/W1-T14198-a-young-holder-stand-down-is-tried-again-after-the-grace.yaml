  rationale: |
    WHY: the W1-T13829 hand-off (#19701) does not act in the case it was filed for.
    READ FROM THE CODE (origin/main f80f72841, src/lib/sweep.ts):
    - tryPlanRepair (line 23231) writes the lasting per-head claim (claimPlanHandoff, line 12218, a
      plan-handoff-attempts file opened with flag wx) at lines 23264-23266, before repairPlanPr runs.
    - The holder checks run later, inside handOffHeldPlanPrIds -> handoffStandDown. The age check is at
      line 12315: "the reservation of <id> started at <t>; it must be older than 2 h".
    - A stand-down for a hand-off spends the head: tryPlanRepair adds `<head>@held-task-id-handoff`
      for any hand-off stand-down (line 23291), and planRepairHistoryFromLedger (line 12068) does not
      `continue` for a held-task-id-handoff stand-down, so the next pass reads the head as spent.
    - The test pins this: "W1-T13829 criterion 4: a failed push and a stand-down each spend one attempt
      at their head" (test line 616), and its stand-down reason is a reservation younger than 2 h.
    THE MOTIVATING CASE (#19604, from the W1-T13829 shard): the holder reservation started
    2026-11-19T05:24:07.232Z, the PR opened at 05:32:43Z and went red on task-id-existence soon after.
    The first sweep after that is inside the 2 h grace, so it stands down for youth and spends the
    head. The PR head does not change, so no later sweep tries again. The shard says "On #19604 it would
    have acted near 07:24Z"; with this code it never acts.
  design: |
    INVARIANT young-holder-not-spent: a stand-down whose only reason is a reservation younger than
    RESERVATION_PUSH_GRACE_MS does not spend the head; the next try is no earlier than started_at plus
    RESERVATION_PUSH_GRACE_MS.
    INVARIANT once-per-head: every other outcome still spends the head, and each try still goes
    through claimPlanHandoff, so two sweeps cannot act on one head at once.
    CHOICE: a dated deferral, not a pre-claim age check. Rejected: reading the reservation age in
    tryPlanRepair before the claim, which copies handoffStandDown's fetch and parse outside its
    fail-closed checks.
    1. handoffStandDown returns the youth result as { reason, retryAtMs } (retryAtMs = the latest
       started_at plus RESERVATION_PUSH_GRACE_MS over the young handoffs). handOffHeldPlanPrIds passes
       retryAtMs up in its stood-down outcome. Every other stand-down has no retryAtMs.
    2. tryPlanRepair: on a hand-off stand-down with retryAtMs, ledger the row with retry_at (ISO) once,
       remove this pass's claim file for the head, and do not add `<head>@held-task-id-handoff`.
       Before claiming, skip the hand-off while now is before the newest retry_at ledgered for the head.
    3. planRepairHistoryFromLedger: a held-task-id-handoff stand-down row with retry_at adds its
       stood-down keys and a `<head>@held-task-id-handoff@retry-at@<iso>` key, and `continue`s, so the
       head is not spent. Rows without retry_at keep today's behaviour.
    4. Change the criterion 4 test at line 616: its stand-down example becomes "holder branch <b> of
       <id> is on origin", which still spends the head. Add the new tests in the same file, titled
       "W1-T14198 criterion N: ...", with the injected now and ledger the file already uses. Load
       test/setup/tmp-hygiene.ts.
  falsifier: |
    On origin/main criterion 1 fails: planRepairHistoryFromLedger holds the head after the youth
    stand-down, and criterion 3's later sweep never calls repairPlanPr. Keep the claim file: criterion 1
    finds it and criterion 3 is refused by claimPlanHandoff. Drop the retry_at wait: criterion 2's early
    sweep calls repairPlanPr again. Stop spending the head on every stand-down: criterion 4's
    holder-on-origin case is retried. Skip claimPlanHandoff on the retry: criterion 4's two sweeps act
    twice.
