  falsifier: |
    If `isPlanFiling` is found populated by `buildOpenPrViews` at the sha a build starts from,
    clause (8) is stale and the producer half is already done — the task reduces to the bound
    alone. The check is one grep of `src/run-task.ts` for an assignment to that field, with
    `lastActivityAt` as the positive control proving the producer assigns fields at all.

    SEPARATELY FALSIFYING: if a fresh union read shows the `not_attempted` and `success`
    populations converging — a plan-only review reaching the judge at a rate well above the 11 of
    552 measured here — then the cheap lane is not cheap in practice and the cap's reason DOES
    reach it. The measurement to repeat is the `review.pending_posted` to `review.posted` join
    split on `reviewer_outcome` and `plan_only`, with the per-form read control recorded in (2).

    AND IF the queue wait is observed collapsing without any change to the bound, the cost in (3)
    was a transient of queue depth rather than of the cap, and the remedy must be re-argued
    against whatever actually cleared it.
