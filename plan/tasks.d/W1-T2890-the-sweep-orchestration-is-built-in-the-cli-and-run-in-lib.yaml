- id: W1-T2890
  title: "THE SWEEP ORCHESTRATION IS BUILT IN THE CLI FILE AND RUN FROM LIB — buildSweepEffects and its effect builders live in run-task.ts while runGatedSweep, drainDetachedSweepActions and the sweep passes live in src/lib/sweep.ts, so the one subsystem is split across the layering boundary in the wrong direction: move the orchestration into sweep.ts now that it takes one deps object (decomposition step 7)"
  repo: remudero
  depends_on: [W1-T2889]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  origin: retro#recon-2026-09-05
  plan_refs: ["§1", "§8A", "W1-T2883", "W1-T2744", "W1-T2865"]
  files: [src/run-task.ts, src/lib/sweep.ts, test/sweep-orchestration-lives-in-lib.test.ts]
  status: queued
  attempts: 0
  rationale: |
    Step 7 of the run-task.ts decomposition chain (audit recon-2026-09-05 T6; R-29). OBSERVED at
    f7ceb86: `src/lib/sweep.ts` owns `drainDetachedSweepActions` (:6204) and the sweep passes,
    while `buildSweepEffects` (`src/run-task.ts:29297`, 1,005 lines) and the effect builders it
    composes sit in the entrypoint. The lib half cannot import the CLI half (depcruise
    `lib-no-spike-or-cli`, severity error), so the effects are threaded down through parameters
    — which is what produced the 23-parameter signature step 6 collapsed. W1-T2744 and W1-T2865
    both repaired the detach/abort seam between these two halves; each had to read both files to
    do it.

    THE FIX: move `buildSweepEffects` and the builders only it uses into `src/lib/sweep.ts`
    (or a sibling `src/lib/sweep-effects.ts` if sweep.ts would exceed its own recorded ceiling —
    say which in the PR); run-task.ts imports and RE-EXPORTS the moved names so the existing
    sweep tests resolve. Anything the builders reach in run-task.ts that is not yet in lib moves
    with them if pure, or is injected through the deps object if effectful — never a
    lib -> run-task import. Lower the run-task.ts ceiling in `scripts/source-size-baseline.json`
    by the lines removed. The new test builds effects through the lib module with recorders and
    asserts the produced effect set equals the pre-move output for the same deps.
  acceptance:
    - claim: "the sweep effects are built in the lib sweep module rather than in the entrypoint"
      proof: "grep: buildSweepEffects( in src/lib/sweep.ts"
    - claim: "building effects through the lib module produces the same effect set as before the move"
      proof: "unit test: test/sweep-orchestration-lives-in-lib.test.ts"
