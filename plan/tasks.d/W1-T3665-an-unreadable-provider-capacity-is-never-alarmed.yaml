      proof: "unit test: a provider unreadable beyond the bound raises the capacity arm"
    - claim: "a readable provider does not raise it, so the arm discriminates rather than always firing"
      proof: "unit test: a readable provider capacity does not raise the arm"
    - claim: "the arm names the direction and the reset rather than a bare percentage, because a bare 95 was read as 95 remaining"
      proof: "unit test: the capacity arm names consumed, remaining and the reset"
