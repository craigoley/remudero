  rationale: |
    MEASURED. `auth.json` last refreshed 2026-09-11T13:27:57Z; its `id_token` expired one hour
    later. From then until an operator re-authenticated on 2026-09-16T10:35:39Z, every capacity
    read returned `"provider":"codex","readable":false` and the auction gave codex no headroom, so
    100% of balanced work went to Claude. Claude's weekly reached 44% in that window.

    NOTHING ANYWHERE SAID SO. `rmd doctor` has no provider-capacity arm at all. The condition is
    visible in a daemon log line nobody greps, and the fleet's only outward signal -- the heartbeat
    -- reports `daemon live | build STALLED | rmd ok` and says nothing about providers.

    THE FAILURE PRESENTS AS HEALTH, WHICH IS WHY FIVE DAYS PASSED. `codex login status` printed
    "Logged in using ChatGPT" throughout, because the ACCESS token stays valid for ten days while
    the ID token the rate-limit read needs lives one hour. A `codex exec` request succeeded on
    2026-09-16 while the capacity read still failed. Every cheap check an operator would reach for
    said healthy.

    A PERCENTAGE WITH NO DIRECTION IS PART OF THE DEFECT. The reading is `used_percent: 95`, and an
    operator reading it cold took it for 95% REMAINING and acted on that. Whatever this arm prints
    must name the direction and the reset: "95% consumed, 5% left, resets 2026-09-19".

    SCOPE: REPORT, NEVER REPAIR. Re-authentication is an interactive device-auth flow and is the
    operator's. This arm's whole job is to make the condition impossible to miss, the same division
    every neighbouring doctor arm states -- "W1-T978 owns reclamation, doctor only reports".

  acceptance:
