       here. Never claim LCOV instruments Bash: real-script effect traps and
       removal/restoration falsifiers qualify these shell branches. Required
       hosted full CI/coverage/proof/normal review still gate normal merge.
    7. Inspect current baked and automatic-update implications before publication.
