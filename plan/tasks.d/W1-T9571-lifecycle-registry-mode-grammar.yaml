  design: |
    1. Extend the TWO existing bounded case blocks, not a duplicate parser or a
       new registry service. Accept exactly shadow and live for one optional
       mode field in the selected row. Reject malformed or duplicate mode before
       any host artifact write or container mutation. Preserve optional absence
       byte-for-byte; do not invent a new live default, strip a safety field,
       accept arbitrary siblings or globally tighten unrelated legacy fields.
       Retain the existing Bash3 portability contract; no associative-array or
       external-tool requirement that an existing supported host cannot satisfy.
    2. Carry/validate mode as existing registry metadata, never as permission to
       mount credentials, promote an instance, arm/merge a PR, clear PAUSE/STOP,
       bypass owner control or publish private source. This task does not add a
       new runtime env override, selection fallback, state/claim format or live
       activation arm. Keep RMD_INSTANCE_NAME, app/heap/credential path forwarding,
       target identity, owner-authored holds and all existing lifecycle guards.
    3. Add red behavioral cases to the EXISTING installer/recycler suites using
       their real scripts, temporary rendering roots and recording Docker/Azure
       transports. Assert exact successful valid-mode outputs, not a source-text
       marker or exit0 alone. Invalid and duplicate mode must trap the first
       consequential effect; unrelated future fields still refuse. Include
       shadow, live, absent-mode and unknown-field positive/negative controls.
       Never run an actual host install, container recycle, closure or promotion.
    4. Exercise legacy output equality and existing owner PAUSE/STOP preservation.
       Remove each actual case/validation fix to make its behavioral test fail,
       restore the exact committed source and observe complete green TAP. Do not
       relax the prior tests, detector or baseline to obtain a result. The normal
       W9559 lifecycle-field census should still see the same vocabulary: it
       already included existing mode, so adding that shell member widens no
       selected contract. Derive controls from actual opened case blocks.
    5. Update the existing public contract doc and generated index only if it
       changes. State the supported mode grammar, legacy absence and remaining
       path/digest/consumer/private-overlay gaps. Source compatibility is not
       deployment or private selection. All new admission remains opt-in SHADOW
       ONLY; human owner/admin override and complete Apache core stay intact.
    6. Before build AND publication refresh exact merged Task trailers OR run
       branches, active remote branches/claims, actual main and ALL OPEN-head
       subjects with corpus/window/positive controls, package runnableCandidates
       and ordinary ownership. The filing ID reservation is not an implementation
       claim. Commit before measurement; verify paths, explicit childtsx/tmp
       hygiene and shipped host-slot admission. One native author per distinct
       committed tree. Reproduce EVERY failed title on THAT actual unchanged
       pinned base before attribution/repair; unknown causes stay unknown. Keep
       every failed/incomplete/setup/skip receipt. Source-mapped coverage must
