  rationale: |
    THE ID. Eight surfaces, anchored `W1-T2427([^0-9]|$)` with a `[0-9]` class and never `\d`, each
    printed anchored beside unanchored. Surface 1 reads 1 of 540 reservation refs. The open set was
    enumerated FIRST and every control drawn from it; where the open set cannot supply a control for
    a band, that is stated rather than reported as a pass.

    ── Q1. THE SILENT ARMS, BY SYMBOL ───────────────────────────────────────────────────────────

    `runSweep`'s `alreadyDone` switch (`src/lib/sweep.ts`) has eight arms. Three of them set
    `dedupStandDownReason` beside the flag and four do not.

      SETS A REASON — the control, and these fire on the SAME runs as the silent ones:
        `mergeable`                     four disjuncts, each with its own sentence (W1-T1116)
        `blocked-fixable` / `conflicted`  guarded by `if (alreadyDone)` (W1-T1110)
        `wait`                          reuses `reason` verbatim (W1-T1116 design iv)

      SETS NO REASON — assigns the flag and falls to `break`:
        `post-review`        `alreadyDone = prior.reviewDelivered.has(reviewKey) || prior.reviewRefused.has(reviewKey)`
        `blocked-ambiguous`  `alreadyDone = prior.escalated.has(...)`
        `dep-review`         `alreadyDone = prior.depReviewed.has(...)`
        `stale`              `alreadyDone = prior.closed.has(pr.prNumber)`

    THE FIELD IS WRITTEN CONDITIONALLY, WHICH IS WHY ABSENT MEANS SILENT rather than empty:
    `finalizeDisposition` spreads `...(standDownReason ? { stand_down_reason: standDownReason } : {})`,
    so an undefined value produces no key at all and a reader cannot distinguish "declined for a
    stated reason" from "no reason was ever computed".

    ⚠ THIS IS THE FOURTH SITE OF A CLASS THIS REPO HAS ALREADY REPAIRED TWICE, AND THOSE TWO ARE
    CITED RATHER THAN RE-FILED. W1-T1116 records that the `mergeable` arm's switch set no
    `standDownReason` on any of its three disjuncts, and fixed those plus `wait`. W1-T1110 records
    127 identical stand-downs on one PR reading exactly like an unwired action path, and fixed the
    fix-dispatch arm. W1-T1061 moved an arm outcome out of a prose reason and into its own field.
    NEITHER REACHED THESE FOUR ARMS. Nothing here re-opens any of them.

    ── THE MEASUREMENT, OVER A CONTROLLED THREE-FORM UNION ───────────────────────────────────────

    0 `.gz`, 39 rotated, 1 live, 483,535 rows, `ok: true`. Of 65,482 `sweep.disposed` rows carrying
    `acted != true`, 33,192 carry `stand_down_reason` and 32,290 do not.

    ⚠ AND THE SPLIT BY TIME CORRECTS A READING THIS SHARD WOULD OTHERWISE HAVE MADE. The silent
    bulk is HISTORICAL and already repaired: `wait` at 20,596 silent rows stops on 2026-08-22,
    `mergeable` at 778 stops on 2026-08-22, and `stale` at 222 stops on 2026-08-17 — while all
    three keep producing REASONED rows into 2026-08-27 and 2026-08-28. THOSE ARE W1-T1116's FIX
    LANDING AND MUST NOT BE COUNTED AS A LIVE DEFECT. What is still silent TODAY is
    `blocked-ambiguous` (7,888 rows, newest 2026-08-27T23:06:37), `blocked-fixable` (2,497, newest
    2026-08-27T21:28:01) and `post-review` (291, newest 2026-08-27T23:41:58).

    ⚠ AND ONE MORE CORRECTION THE OPERATOR'S OWN FRAMING WOULD NOT HAVE SURFACED: `post-review` is
    NOT the largest instance. `blocked-ambiguous` is silent twenty-seven times more often and is
    equally live. The post-review case is the one that COST something measurable, which is a
    different claim from being the biggest.

    THE CONTROL RUNS BOTH WAYS AND ON THE SAME CORPUS. Every disposition appears in the reasoned
    column too — `blocked-fixable` 10,932, `blocked-ambiguous` 4,107, `post-review` 485,
    `dep-review` 372, `stale` 260 — so the field is demonstrably writable on these rows and its
    absence is a property of the ARM taken, never of the row type or of the writer.

    ⚠ Q2. WHETHER EACH SILENT ARM IS A STAND-DOWN AT ALL, ANSWERED ON W1-T1110's CRITERION ───────

    THE TEST IS NOT "did it decline" BUT "could a reader otherwise tell it from a broken action
    path". All four fail that test, and each fails it for its own reason.

      `post-review` — FAILS, AND THE COST IS ALREADY BANKED. A silent row here is indistinguishable
      from an unwired `deps.postReview`, from a lost light-pass admission, and from a dry run.
      W1-T2426 could not attribute PR 3152's nine consecutive stand-downs to `selectReviewAdmission`
      for exactly this reason, and recorded the gap rather than guessing. A FUTURE FIX TO THE
      ADMISSION ORDER CANNOT BE PROVEN TO HAVE WORKED FROM THESE ROWS.

      `blocked-ambiguous` — FAILS. Deduped on `prior.escalated`, so a silent row reads the same as
      `deps.escalate` never being wired or throwing. This is the largest live population.

      `dep-review` — FAILS. Same shape on `prior.depReviewed`; 18 silent rows, small but not zero.

      `stale` — FAILS AS CODE EVEN THOUGH THE LEDGER HAS GONE QUIET. Its newest silent row is
      2026-08-17, but the arm is unchanged, so the next time a closed PR is deduped it goes silent
      again. A population that has stopped firing is not a fixed arm.

    NONE OF THE FOUR IS A NO-OP THAT NEVER CONSIDERED ACTING. Each computed a `prior.*` membership
    test and DECLINED on it — that is a decision, and the precedent is settled: `wait` is the one
    genuinely no-op-shaped arm in the switch and W1-T1116 gave it a reason anyway, reusing
    `reason` verbatim rather than inventing a second sentence.

    ── Q3. WHAT IT COSTS ────────────────────────────────────────────────────────────────────────

    ZERO NEW LEDGER LINES. The rows already exist and already carry `acted`, `disposition`,
    `pr_number`, `head_sha` and `repeat_streak`; this adds one string to a row that is written
    either way. Each arm already holds the fact the sentence would state, at the point of the
    check — `reviewDelivered`/`reviewRefused`, `prior.escalated`, `prior.depReviewed`,
    `prior.closed` — so nothing new is read, computed or fetched. The two precedents did exactly
    this shape on their own arms and neither added a step name.

    ⚠ WHAT IS REFUSED. No disposition changes. The one-per-pass admission bound is untouched.
    Nothing paces, sleeps or retries. No gate is added and no escalation surface is opened — the
    two repairs cited above both put the sentence on the EXISTING row, and W1-T2381 separately
    records that routing a repeat condition to an issue surface reached no reader seven times out
    of eight.

    ── WHAT IS OWNED ELSEWHERE ──────────────────────────────────────────────────────────────────

    The admission ORDER is W1-T2426, whose key is bumped by the action it gates. The repeated
    COMMENT carrying an unchanged verdict is W1-T2419. The population literal that made a PR body
    wrong is W1-T2424. THIS OWNS ONLY THE MISSING REASON, and specifically only the four arms named
    above.

    ── AMENDMENT 2026-08-28: A FIFTH SITE, THE REVIEWER RATHER THAN THE SWEEP ────────────────────

    THE SAME CRITERION FAILS ONE FILE OVER. `remudero-review` posts
    `no acceptance criteria to judge (fail closed)` for TWO DIFFERENT SITUATIONS AND THE SAME
    SENTENCE, so a reader cannot tell a correct refusal from a resolvable input the reviewer did
    not have. That is exactly W1-T1110's test — not "did it decline" but "could a reader otherwise
    tell it from a broken action path" — applied to `src/lib/review.ts` instead of the
    `alreadyDone` switch this task owns.

    MEASURED OVER THE THREE-FORM UNION, 2026-08-28. All-time there are 61 such refusals.
      59 carry a SYNTHETIC `PR-NNNN` task id: genuinely trailer-less pull requests where the
         refusal is CORRECT and must not change (sample: PR 2822, `task_id` reads `PR-2822`).
       2 carry a RESOLVED `W1-T` id — PRs 3164 and 3168 — where the trailer parsed, the shard
         existed on `main`, and the reviewer read a plan that predated it.
    THE 2 AND THE 59 LAND ON ONE SENTENCE. Nothing on the row separates them.

    THE CAUSE, PROVEN BY SHA RATHER THAN BY INFERENCE. `daemon.boot` at 2026-08-27T22:56:34Z
    carried `head_sha=6511fe60`; both verdicts posted inside that boot window, at 00:15:52Z and
    00:38:38Z. At `6511fe60` both shards read ABSENT from `plan/tasks.d/`; at the next boot's
    `070f5b7b` both read PRESENT, with W1-T990 as a control reading 1 at BOTH shas and the
    population moving 668 to 675. Their shards merged 37 and 46 minutes AFTER the container booted.

    ⚠ AND THE FALSE TELL, RECORDED SO IT IS NOT CHASED AGAIN. The review log prints
    `read: plan/tasks.yaml (sha256:85921b21b6e1)` and that value is CONSTANT BY CONSTRUCTION — it
    hashes the MONOLITH, which does not change when a shard lands under `plan/tasks.d/`. Verified:
    that hash equals `plan/tasks.yaml` at `origin/main` exactly. A constant hash is consistent with
    a stale plan and is NOT evidence of one. THE BOOT SHA IS THE EVIDENCE.

    ⚠ Q2 — THE REMEDY SHAPE, WITHOUT THE MECHANISM. Either of two things separates the two
    situations at ZERO LEDGER COST, because the `review.posted` row already exists and already
    carries a resolved `task_id`:
      • a distinct failure class for the case where `task_id` RESOLVED but the plan lookup missed, or
      • a boot-sha stamp on the row, so a reader can date the plan the verdict was judged against.
    WHICH OF THE TWO IS A BUILD's CHOICE AND IS NOT DECIDED HERE. Neither adds a ledger line,
    neither adds a step name, and neither is a rung.

    ⚠ Q3 — THE SCALE, STATED SO NOBODY OVER-BUILDS. This is 2 of 61 all-time and the FIRST
    OCCURRENCE across 484,000 union rows. Both happened inside 23 minutes, because two shards
    merged inside one boot window. IT IS NOT STRUCTURAL AND THE REMEDY IS A SENTENCE, NOT A RUNG.
    A reader who finds this paragraph while sizing the work should size it accordingly.

    ⚠ WHAT MUST NOT CHANGE. FAIL-CLOSED STAYS. "Nothing to judge is never a pass" was CORRECT on
    the evidence the reviewer had; the 59 depend on it and the 2 were not wrongly refused, only
    wrongly indistinguishable. THE DEFECT IS THAT THE SENTENCE CANNOT DISTINGUISH ITSELF. And no
    `## Acceptance` block goes into a BUILD's pull-request body as a workaround — a build's criteria
    belong to its shard, and a body block creates a second source that can drift, which is
    W1-T2315's class.

    SCOPE. This amendment records a fifth site of this task's own class; it does not widen this
    task's `files:`, which stay `src/lib/sweep.ts` and its test. Whether the reviewer half is built
    here or filed separately is the operator's call, and this paragraph exists so that call is made
    on evidence rather than rediscovered.

