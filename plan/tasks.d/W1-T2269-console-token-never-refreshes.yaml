  note: |
    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. The declared files cross a runtime concern
    (`serve.ts`, `github-app.ts`) and a deploy concern (`serve-container.sh`), which fails sizing at
    `risk: medium`. The change itself is small and reversible; the band records the span.

    THE LEDGER EVIDENCE IS OWED AND WAS NOT TAKEN. The rationale says why: the authoring container's
    corpus fails its own positive control. Before building, re-take it against the operator's state
    root, per form, with a control that fires — and re-take correction (A) with a live
    `docker inspect` of the running console, because repo evidence and the commissioning brief
    disagree about how many credential names that container carries, and which is right decides
    whether the App path is already half-wired there or absent entirely.

