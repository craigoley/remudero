- id: W1-T2269
  title: "THE CONSOLE HOLDS A PERSONAL TOKEN FOR ITS WHOLE LIFETIME AND NOTHING EVER REPLACES IT — `serve.ts` never references `refreshInstallationToken`, its launcher copies `GH_TOKEN` out of the daemon container at spawn time, and that copy is terminal: the daemon's refresh failure falls back to the token it already had, while the console has no refresh to fall back FROM"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 30.00
  rationale: |
    **SIZE, STATED FIRST SO NOTHING BELOW IS READ AS THE GRAPHQL BURN'S CAUSE.** This is an
    AUTHORITY AND STALENESS defect, not a volume one. The 10,064-point GraphQL burn traces to the
    six-second CI poll inside workers; nothing here is that. Read as a burn diagnosis this shard
    would be wrong, and the fix it proposes would relieve nothing.

    **THE MECHANISM, RE-DERIVED FROM SOURCE.** `refreshInstallationToken` is referenced in
    `src/lib/github-app.ts` (which declares it) and `src/run-task.ts` (which arms it). It is
    referenced NOWHERE in `src/lib/serve.ts`. Control: the same probe finds it in exactly the two
    modules named, so the reader is not blind.

    **THE CONSOLE'S TOKEN IS A SPAWN-TIME COPY.** `deploy/serve-container.sh` prefers the invoking
    shell's `GH_TOKEN` and otherwise captures one by `docker inspect` on the daemon container's own
    environment, then passes it by NAME (`-e GH_TOKEN`, value never printed, never written to disk).
    Whatever the daemon's token WAS at the moment the console started is what the console holds
    until it is replaced by hand. `startInstallationTokenRefresh` runs in the daemon's process, not
    the console's, so a daemon-side refresh updates `process.env.GH_TOKEN` in a DIFFERENT process
    and the console's copy is untouched by construction.

    **TWO CORRECTIONS TO THE BRIEF THAT COMMISSIONED THIS, BOTH MEASURED.**

    (A) **THE CONSOLE DOES NOT CARRY ALL FOUR APP ENV NAMES — ON REPO EVIDENCE IT CARRIES ONE.**
    `deploy/serve-container.sh` passes `GH_TOKEN` and never mentions `GH_APP_ID`,
    `GH_APP_INSTALLATION_ID` or `GH_APP_PRIVATE_KEY_PATH`; it does not source
    `deploy/runtime-env-vars.sh` at all. That file's own header declares itself the list of names
    "the `remudero-daemon` container carries at runtime", and its console-side companion
    `RMD_SERVE_RUNTIME_ENV_VARS` names only `RMD_SERVE_HOST` and `RMD_SERVE_NETWORK` — no GitHub
    credential of any kind. The other console launch path, `deploy/host-update.sh`, passes no
    `GH_TOKEN` either. **A LIVE `docker inspect` SHOWING FOUR NAMES WOULD NOT CONTRADICT THIS; IT
    WOULD LOCATE A THIRD LAUNCH PATH NOT IN THIS REPO, WHICH IS ITSELF THE FINDING.** The build
    step must re-take this on the host before assuming either reading.

    (B) **THE CONSOLE IS NOT A PASSIVE TOKEN HOLDER — IT SPENDS THE TOKEN, ON BOTH ARMS.** The
    brief's "no `gh pr view` calls of its own" is true of that one verb and false of the general
    claim. `serve.ts` names no GitHub host and reads no `GH_TOKEN` directly; every `fetch(` in it is
    browser-side, to the console's own routes. But it assembles gateways that shell `gh`:
    `status.ts`'s board gateway calls `execFileSync("gh", …)` for reads, and `ghIssueCloser`
    (`panel-actions.ts`) calls `execFileSync("gh", ["issue", "close", …])` for writes. `gh` reads
    `GH_TOKEN` from its environment, so the spawn-time copy authenticates both.

    **THE LEDGER HALF COULD NOT BE TAKEN HERE AND IS NOT REPORTED AS A ZERO.** The brief's host
    `e5afe226f001` appearing in no `github_app.token_refreshed` row, against six daemon hosts across
    172 rows, is a claim about the OPERATOR'S state root. The corpus reachable from the authoring
    container holds one live ledger and no rotations in either form, and its POSITIVE CONTROL FAILS:
    `run.start` reads zero there, so the file is this container's own local exhaust and cannot
    answer the question. Reported as unmeasured rather than as an absence. The step name itself IS
    confirmed from source — `github_app.token_refreshed` is emitted by `github-app.ts`.
    ── ADDED 2026-08-25, RATIONALE ONLY, POST-MERGE OF #2819. THE APP-ENV DISAGREEMENT RESOLVES ──

    (A) THE RUNNING CONSOLE CARRIES FOUR CREDENTIAL NAMES, AND THE SHARD's SOURCE READING WAS
    RIGHT ABOUT THE SCRIPT. `docker inspect remudero-serve` reports `GH_TOKEN`, `GH_APP_ID`,
    `GH_APP_INSTALLATION_ID` and `GH_APP_PRIVATE_KEY_PATH`, plus `RMD_SERVE_NETWORK` and the base
    image's own `DISABLE_AUTOUPDATER`/`HOME`/`NODE_VERSION`/`PATH`/`YARN_VERSION`. And
    `deploy/serve-container.sh` really does pass `GH_TOKEN` alone: it carries exactly TWO `-e`
    flags, `-e GH_TOKEN` at `:206` and `-e "RMD_SERVE_NETWORK=…"` at `:207`, and names no
    `GH_APP_*` anywhere. BOTH READINGS ARE CORRECT AND THEY DESCRIBE DIFFERENT THINGS.

    (B) BECAUSE THE COMMITTED LAUNCHER POSTDATES THE RUNNING CONTAINER, AND THAT IS SHARPER THAN
    "TWO COMMITS". `deploy/serve-container.sh` has been touched by exactly ONE commit in the
    repo's whole history — `59ec3c2`, 2026-08-22T23:02:59Z, "record the remudero-serve console
    container and its bring-up" (#2534). The image the container runs is labelled
    `org.opencontainers.image.revision: 3873867205ad8ccd48474c6544b2533906efb8c8` and was Created
    2026-08-22T21:42:30Z — EIGHTY MINUTES BEFORE that commit. `git cat-file -e
    3873867:deploy/serve-container.sh` fails: THE LAUNCHER DID NOT EXIST AT THE SHA THE IMAGE WAS
    BUILT AT. `3873867` is itself an ancestor of `59ec3c2`, so this is ordinary history, not a
    rewrite. So the committed script cannot have started this container, and nothing drifted —
    the script was written afterwards to record a container that was already running.

    (C) AND THE OTHER APPARENT LAUNCH PATH IS NOT ONE. `deploy/host-update.sh:353` does contain
    `docker run -d --name remudero-serve`, but it sits inside a `cat <<PRINTED` heredoc opened at
    `:240` and terminated at `:379`, whose own first printed line reads "host-update: DAEMON-MODE
    INVOCATION — printed only. Nothing has been started and nothing was run." The escaped `\\`
    continuations and the escaped `\${RMD_SERVE_HOST:-0.0.0.0}` are the tell. BOTH `docker run`
    occurrences in that file (`:313` daemon, `:353` serve) are inside that same heredoc, and
    `:303` says so outright: "THIS ONLY CHANGES THE PRINTED TEXT: the operator re-runs `docker
    run` by hand to apply it." IT IS THE KIND OF LINE THAT READS AS EXECUTABLE AND IS NOT. It also
    passes no `GH_TOKEN` at all — only `-e RMD_SERVE_HOST` and `-e RMD_SERVE_NETWORK`.

    (D) SO NEITHER COMMITTED PATH STARTED THE CONSOLE, AND THE THREE `GH_APP_*` NAMES ARE THERE BY
    INHERITANCE. They reached the container from an operator shell that had them exported at the
    moment of an ad-hoc `docker run`. THAT LANDS THIS TASK ON THE BRANCH ITS OWN NOTE ANTICIPATED
    — A CAPABILITY PRESENT AND UNWIRED — WITH ONE ADDITION THAT CHANGES WHAT THE BUILD MUST DO:
    IT IS PRESENT BY INHERITANCE RATHER THAN BY DESIGN. A console restarted from
    `deploy/serve-container.sh` as committed would come up with `GH_TOKEN` and nothing else, and
    the three `GH_APP_*` names would silently vanish. So a build that wires `serve.ts` to
    `refreshInstallationToken` must not assume the inputs are present; the launcher has to pass
    them, or the console has to say plainly that it cannot refresh.

    (E) AND THE CAPABILITY IS ALREADY DECLARED ELSEWHERE IN THE SAME TREE, WHICH IS WHY THE GAP IS
    NARROW. `deploy/runtime-env-vars.sh:38-40` already lists `GH_APP_ID`,
    `GH_APP_INSTALLATION_ID` and `GH_APP_PRIVATE_KEY_PATH`, and `deploy/host-update.sh:68` carries
    the same three in `RMD_DAEMON_RUNTIME_ENV_VARS`. The names exist and are maintained; only the
    console's own launcher omits them.

    (F) AN ADJACENT OBSERVATION, RECORDED WITHOUT WIDENING `files:`. The same printed runbook
    documents `state/PAUSE` and `state/STOP` as PLAIN FILES under the state root —
    `touch ${STATE_DIR}/state/PAUSE` and `touch ${STATE_DIR}/state/STOP`, with "no exec, no
    console, works from a phone" as the stated reason. THAT IS A LOCAL PAUSE SURFACE DISTINCT FROM
    `refs/rmd-pause/hold`. W1-T2264 found that the latch block can only see file-backed holds;
    THIS IS WHY — the board was built when the file was the only pause there was, and the ref-
    backed hold arrived later beside it rather than replacing it. CITED, NOT RE-FILED, AND
    DELIBERATELY NOT IN THIS TASK'S `files:`.

  design: |
    **Q1 — WHAT THE CONSOLE DOES WITH THE TOKEN: IT WRITES, SO THIS IS AN AUTHORITY QUESTION AND
    THE SHARD IS THE LARGER OF THE TWO SHAPES THE BRIEF OFFERED.**

    The write routes are real and reach GitHub. `buildEscalationMarkHandledRoute` declares
    `scope: "write"` and calls `deps.issues.close(input.issueUrl)`, whose production implementation
    shells `gh issue close`. `/v1/manual/approve`, `/v1/inbox/approve`, `/v1/drain/kick`,
    `/v1/drain/run` and `/v1/skills/run` are declared HIGH-TIER write paths. `ratify.approve` is a
    DETACHED SPAWN that outlives the HTTP request that triggered it, which `gateStaleCodeExit`'s own
    doc names as the case its counter cannot see.

    So a permanent user-scoped credential is not merely stale — it is the authority under which an
    operator-facing surface closes issues and files work. W1-T2211 already established that the
    console's write-token file is readable by a worker, so a lane can approve its own work; the two
    compose badly. This shard must not widen that: it changes WHICH credential authenticates, never
    WHO may call the routes.

    **Q2 — WHAT BREAKS ON EXPIRY OR REVOCATION: THE DAEMON DEGRADES, THE CONSOLE HAS NOTHING TO
    DEGRADE TO.**

    `github-app.ts` states the daemon's contract in terms: FALLBACK IS THE DEFAULT — missing config,
    an unreadable key, a signing failure or a rejected exchange all leave `process.env.GH_TOKEN`
    exactly as they found it, ledger a named reason, and never refuse to boot. `EXCHANGE_TIMEOUT_MS`
    is 20s and, by its own doc, is reasoned from a bound rather than fitted to a measurement, so a
    timeout costs one retry inside the `REFRESH_MARGIN_MS` cadence and never a missed refresh. That
    is a fallback FROM a fresh token TO the previous one. The console's copy IS the previous one and
    there is no rung beneath it.

    On expiry the console does not fail silently in the way the pre-W1-T181 code did: that fix moved
    the catch into the gateway's own `index`, so a throwing read is classified and marked rather
    than returned as a bare empty list, and `readFailed()`/`readFailureReason()` back the
    `github_unobservable` signal `derivePrPrecedence` consults BEFORE trusting an empty result. The
    failure is also loud — `console.error` plus an injectable log.

    **WHAT IS NOT ESTABLISHED, AND IS THE BUILD'S FIRST JOB:** the read-failure signal is produced in
    `status.ts` and consumed in `board.ts`; `serve.ts` itself references none of `lastFetchFailed`,
    `readFailed`, `readFailureReason` or `github_unobservable`. Control: `resolveFreshness` is
    referenced in `serve.ts`, so that probe is not blind. Whether the operator SEES "GitHub
    unreadable" rather than a quiet stale board therefore depends on a path through `board.ts` that
    this shard did not trace. W1-T2218 and W1-T2235 both turned on the console rendering an unknown
    as a finding; the same hazard applies here and the build must settle it by observation, not by
    reading the producer and assuming the surface.

    **Q3 — WHAT MUST NOT CHANGE.**

    (i) The console stays READ-MOSTLY and its write tiers stay exactly as they are. Nothing here
    grants a new scope, adds a route, or moves a route between tiers. A refresh mechanism changes
    the credential's provenance, never its permissions.

    (ii) **NOTHING COUPLES THE CONSOLE'S LIFETIME TO THE DAEMON'S.** It is deliberately a separate
    container with its own `--restart=unless-stopped` policy. A design in which the console must
    reach the daemon to obtain or renew a credential — an HTTP call, a shared file the daemon owns,
    a startup ordering constraint — converts an independent restart policy into a dependent one and
    is refused on that ground alone, however convenient. Note the tension this creates with the
    spawn-time copy the console already takes from the daemon: that copy is a ONE-TIME read at
    launch which the console survives without, and a renewal path must not turn it into a running
    dependency.

    (iii) No secret reaches a log line, a ledger row, argv, or disk. `serve-container.sh` and
    `entrypoint.sh` both go out of their way to hold the token only in an environment, and
    `github-app.ts` states the same rule for the refresher.
