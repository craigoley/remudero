  note: |
    risk:high, band_meaning: blast-radius — `acceptance-author-gate` is a REQUIRED check, so a false
    refusal here blocks every PR that trips it. That is why rationale (6) fixes the polarity: every
    arm fires on a positive structural finding and anything unclassifiable passes unchanged.

    `files:` DERIVED FROM SOURCE. `acceptanceAuthorTimeCheck`, `acceptanceBlockDiagnostics` and
    `parseWhitelistedProof` are all in `src/lib/review.ts`; the new arm belongs beside the three
    refusals it joins, and reusing that module's own parser is what keeps this from becoming a
    second spelling of "this proof cannot run".
