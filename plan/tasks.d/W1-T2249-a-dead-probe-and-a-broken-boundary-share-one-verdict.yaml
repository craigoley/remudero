  note: |
    ── Q1. CAN A SPAWN FAILURE BE NAMED WITHOUT WEAKENING THE GATE ─────────────────────────────

    (i) YES, AND THE FUNCTION ALREADY DOES IT TWICE. The `spawn_credential_expired` and
    `spawn_credential_failure` arms sit AHEAD of the unproven classifier and each throws its own
    `ContainmentError` with its own check symbol, its own `observed` value, and the SAME
    unconditional `throw`. Both refuse the run. Neither weakens the gate. The shape this task
    needs already exists and must be followed rather than invented: a third pre-classifier arm
    for a transport or API failure, thrown, failing closed, distinguishable by symbol.

    (ii) THE RUN MUST STILL NOT PROCEED, AND THAT IS NOT NEGOTIABLE. W1-T1265 requires containment
    PROVEN rather than assumed. A probe whose worker died proves nothing about the sandbox, so it
    can never be treated as a pass. The distinction this task adds is in the NAME and in what
    reads the name, never in whether the run continues.

    (iii) NAMING ALONE IS INSUFFICIENT, AND THAT IS THE HALF THAT MAKES THIS A TASK. Nothing
    downstream reads the check symbol to decide anything: a search across the tree finds it copied
    onto a report in `retro.ts` and nowhere else. So a new symbol with no reader would be the
    W1-T329 shape this repo already refuses, a reason recorded that nothing consults. The reader
    that must exist is the breaker's own counter.

    (iv) WHAT CHANGES DOWNSTREAM, PRECISELY. `dispatchesWithoutNewOwnedPr` must not count a run
    refused for an infrastructure spawn failure. It counts `run.start` and resets on `pr.opened`;
    the narrow change is to exclude a `run.start` whose run ended in the new class. NOTHING ELSE
    MOVES: the breaker's threshold does not change, the reset rule does not change, and a genuine
    dispatch-with-no-PR still counts exactly as it does today.

    (v) AND THE EXPIRY ARM NEEDS ITS OWN LOOK. A transcript that says an OAuth token has expired
    was classified `unproven`, so either the credential predicate does not read that text or it
    was not reachable on that path. Whichever it is, the fix must not leave two arms that are
    supposed to catch this and do not.

    ── Q2. WHY THE EVIDENCE IS MOSTLY MISSING ──────────────────────────────────────────────────

    (vi) IT IS NOT TRUNCATED AND IT IS NOT DROPPED. IT IS WRITTEN ON ONE PATH ONLY.
    `containment.ts` records the excerpt as a CONDITIONAL SPREAD keyed on the worker result's own
    error flag, and the comment beside it (W1-T238) says so outright: the field is recorded "ONLY
    when the underlying worker call itself errored", so "a clean probe spawn never gets this
    field". A probe that returns normally and simply observes no denial is a clean spawn by that
    test, so the case that most needs a transcript is exactly the case that carries none.

    (vii) THE COVERAGE NUMBERS, AND A CORRECTION TO THE READING OF THEM. `stderr_excerpt` is
    present on 32 of 406 probes and absent on 18 of the 50 failures, which sounds like a diagnosis
    resting on a minority. BUT ALL 18 EXCERPT-LESS FAILURES ARE `unproven`, every one of them
    predating W1-T1281; every one of the 20 post-split failures carries an excerpt. So the
    evidence gap is HISTORICAL, not ongoing.

    (viii) WHICH DOES NOT CLOSE THE GAP, BECAUSE THE STRUCTURAL HOLE IS UNEXERCISED RATHER THAN
    FIXED. The conditional spread still means a `contained: false` with no error flag would record
    nothing, and `no-denial-observed` -- the one state that describes a probe that ran cleanly and
    saw no denial -- reads ZERO so far. The day it fires it will arrive with no transcript. The
    remedy is to record the excerpt on every REFUSING probe rather than on every ERRORING one; a
    passing probe's row stays exactly as it is, which is the property W1-T238 was protecting.

    ── Q3. WHAT MUST NOT CHANGE ────────────────────────────────────────────────────────────────

    (ix) NO RELAXING, SKIPPING, SAMPLING OR THRESHOLDING OF THE PROBE. The measurement
    STRENGTHENS W1-T1265 rather than weakening it: the refusals are honest, and what they refuse
    is a probe that could not run. A high failure rate is not an argument for trusting the
    boundary. Whoever builds this must add no path on which containment is treated as proven
    without an observed denial, and no sampling rate, retry budget or failure threshold that
    would let a run proceed unproven.

    (x) `turns-exhausted` STAYS DISTINCT, AND SO DO THE OTHER THREE. W1-T2201 earned that name
    and it must survive intact, as must `probe-never-ran`, `write-never-attempted` and
    `no-denial-observed`. THIS TASK ADDS A FIFTH REASON; IT DOES NOT MERGE THE FOUR. A build that
    collapses any of them has done the opposite of what is asked.

    (xi) THE BREAKER STILL BREAKS. Excluding an infrastructure refusal from the counter is not
    disabling the counter. A task that genuinely dispatches five times without producing an owned
    PR must still trip, at the same threshold, with the same reset rule. The redispatch storm
    W1-T1279's own escalation cites is a real failure mode and this must not reopen it.

    (xii) THE HOST QUESTION IS OUT OF SCOPE AND UNDIAGNOSED. Why one container failed 13 of 13
    probes in 41 minutes while six siblings failed 0 of 72, and why the current one runs at 23 of
    53, is NOT answered here and must not be filed against this id. It is a separate pass. This
    task changes how a failed probe is NAMED and COUNTED, not how often it fails.

    (xiii) DO NOT RE-FILE W1-T1265, W1-T1281 OR W1-T2201. W1-T1265 established that containment
    must be proven; W1-T1281 split the unproven state into four; W1-T2201 added the exhaustion
    state and its turn budget. All three shipped and all three hold. This shard sits BESIDE them:
    it adds the class none of them covers, the spawn that died before it could observe anything.

    (xiv) RULE 19 BAND. `risk: high` is set up front because `files:` spans two source stems and
    Rule 19 sizes on SPAN. The band is the span reading and NOT a blast-radius judgement; the
    change adds one pre-classifier arm, one exclusion in a counter, and perturbs no existing
    threshold.
