- id: W1-T4227
  title: "THE FLEET'S REPOS AND INSTANCES ARE DEFINED IN FOUR PLACES THAT DISAGREE — the console's hard-coded OWNED_REPOSITORY_REGISTRY, core's managed-repos.json, the host's /etc/remudero/daemon-instances.yaml (which omits core) and the console's RMD_CONTROL_REPO_INSTANCES env; make .remudero/daemon-instances.yaml the one registry, give each instance its project and repo, serve it read-only as /v1/registry, and flag the host copy when it drifts"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high
  band_meaning: span
  origin: "operator-request#projects-repos-onboarding-2026-09-23"
  plan_refs: ["W1-T3596", "W1-T4228", "W1-T4229", "W1-T4244", "W1-T433"]
  files:
    - .remudero/daemon-instances.yaml
    - src/lib/instance-registry.ts
    - src/lib/serve.ts
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-23 (fleet host + both repos' main). The console lists repos from a hard-coded
    OWNED_REPOSITORY_REGISTRY merged with each instance's /v1/repos; core builds /v1/repos from
    .remudero/managed-repos.json; the watchdog converges from /etc/remudero/daemon-instances.yaml, which
    lists site and console but NOT core, while the repo's own .remudero/daemon-instances.yaml declares all
    three; and the console reaches instances through a JSON env var. Adding Wild Trails today means about
    five hand edits in three systems. The operator's design (doc "Remudero Projects, Repos and Onboarding")
    adds a light Project layer — Remudero = core + site + console — which needs one place to live.
  design: |
    Extend each instance in .remudero/daemon-instances.yaml with `project` (default "default") and `repo`
    (owner/name); the Remudero project = core + site + console (operator ruling 2026-09-23: adopt the
    project layer). A pure parser, `parseInstanceRegistry` in src/lib/instance-registry.ts, validates it (unique names, one repo per
    live instance). serve exposes GET /v1/registry (read scope): projects → repos → instances, each with
    the /v1/i/<instance> prefix W1-T4228 serves it under, and nothing else — never credential paths,
    state dirs or tokens. It also reports drift
    when the host registry path (injectable; default /etc/remudero/daemon-instances.yaml) is readable and
    names a different instance set. managed-repos.json keeps working as today.
  acceptance:
    - claim: "the registry parser refuses duplicate instance names and live repos"
      proof: "unit test: the registry parser refuses duplicate instance names and live repos"
    - claim: "the registry route lists projects, repos and instances without any path or secret"
      proof: "unit test: the registry route lists projects, repos and instances without any path or secret"
    - claim: "an instance with no project belongs to the default project"
      proof: "unit test: an instance with no project belongs to the default project"
    - claim: "a host registry that names a different instance set is reported as drift"
      proof: "unit test: a host registry that names a different instance set is reported as drift"
    - claim: "serve builds its registry route from the parser"
      proof: "grep: parseInstanceRegistry( in src/lib/serve.ts"
