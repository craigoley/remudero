- id: W1-T9669
  title: "THE LAUNCHER'S host_alert GIVES `rmd host-alert` NO GITHUB CREDENTIAL, SO W1-T9625'S DIRECT POST CAN NEVER FIRE — the rendered host_alert runs rmd on the HOST with no GH_APP_ID, GH_APP_INSTALLATION_ID, GH_APP_PRIVATE_KEY_PATH or GH_TOKEN (the launcher hands those only to the container, with a CONTAINER key path), and #12000's hostGithubToken throws 'no host credential' on exactly that environment"
  repo: remudero
  depends_on: [W1-T9625]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high  # Rule 19: one concern — the environment the launcher gives `rmd host-alert`; what host-alert decides and posts is unchanged
  band_meaning: span
  origin: "operator session 2026-10-15: follow-up to W1-T9625 (PR #12000), whose direct post reads a host credential the launcher never supplies"
  plan_refs: [W1-T9625, W1-T9627, W1-T9645, W1-T9500]
  files: [deploy/install-host-units.sh, test/the-host-watchdogs-own-alarms-reach-the-spool.test.ts, test/the-launcher-host-alert-carries-the-app-credential.test.ts]
  status: merged
  priority: 1  # operator-2026-10-15: a down daemon's alert waited 1 h 46 m for the daemon it reported; W1-T9625 exists to remove that wait and is inert without this
  attempts: 0
  rationale: |
    READ in the repo only (no host credential file was read), at origin/main cd482d436 and #12000's head 00266e3b9:
    - deploy/install-host-units.sh render_host_alerts: host_alert runs
      `cd "$STATE_DIR/remudero" && RMD_SELF_SYNC_DONE=1 [timeout 120] "$rmd" host-alert --state-root ... --json` on the
      HOST. It sets no GitHub variable. The watchdog unit's only Environment= lines are RMD_ROOT and REGISTRY.
    - The launcher already resolves the App credential: GH_APP_ID_V (RMD_GH_APP_ID, default 4648213),
      GH_APP_INST_V (RMD_GH_APP_INSTALLATION_ID, default 155256285) and GH_APP_KEY_V
      (RMD_GH_APP_PRIVATE_KEY_PATH, default /home/node/.claude/rmd-app.pem). It hands them only to `docker run`
      (`-e GH_APP_ID=... -e GH_APP_INSTALLATION_ID=... -e GH_APP_PRIVATE_KEY_PATH=...`). GH_APP_KEY_V is a
      CONTAINER path. On the host the same file is either GH_APP_KEY_HOST_V (RMD_GH_APP_PRIVATE_KEY_HOST_PATH, the
      explicit read-only mount source) or, under the `-v ${CLAUDE_DIR}:/home/node/.claude` mount, the CLAUDE_DIR
      path that /home/node/.claude maps to.
    - #12000 (W1-T9625, open) src/lib/launcher-host-alerts.ts hostGithubToken: with no GH_APP_* triple and no
      GH_TOKEN it throws "no host credential: set GH_APP_ID, GH_APP_INSTALLATION_ID and GH_APP_PRIVATE_KEY_PATH, or
      GH_TOKEN, in host-alert's environment". So on the launcher's real environment every direct post fails, and
      the alert waits for the daemon again.
    deploy/install-host-units.sh is also edited by W1-T9627 (run-W1-T9627-1792065434776) and W1-T9645's build. The
    hunks are disjoint (progress-watchdog and revive log), but a builder merges origin/main first.
  design: |
    1. render_host_alerts gives host_alert's rmd child three variables, and only that child:
       - GH_APP_ID and GH_APP_INSTALLATION_ID from the values the launcher already resolved.
       - GH_APP_PRIVATE_KEY_PATH as a HOST path. Use GH_APP_KEY_HOST_V when it is set. Otherwise, when GH_APP_KEY_V
         lies under /home/node/.claude/, use the same relative path under CLAUDE_DIR. Otherwise pass none and let
         hostGithubToken name the gap.
       All are rendered with printf %q, as GH_APP_KEY_SHELL already is. The launcher never reads, copies or checks
       the key file; only host-alert's child opens it.
    2. No GH_TOKEN is minted or written by the launcher. The App path is the credential; hostGithubToken's GH_TOKEN
       fallback stays for a host that sets one itself.
    3. A rendered-launcher test (beside test/the-host-watchdogs-own-alarms-reach-the-spool.test.ts) renders the
       launcher with a fixture CLAUDE_DIR and with an explicit host key path, runs its host_alert against a stub rmd
       that prints its environment, and asserts the three variables and the host-side key path in both cases. It
       also asserts the container's own `-e GH_APP_PRIVATE_KEY_PATH` is unchanged.
  acceptance:
    - claim: "the rendered host_alert hands rmd host-alert the App id, installation id and a host-side key path"
      proof: 'unit test: test/the-launcher-host-alert-carries-the-app-credential.test.ts'
    - claim: "with no explicit host key path, the key path is the CLAUDE_DIR file the container's /home/node/.claude path maps to"
      proof: 'grep: test("W1-T9669: host_alert maps the container key path onto the host claude dir" in test/the-launcher-host-alert-carries-the-app-credential.test.ts'
    - claim: "an explicit host key path wins, and the container's own key path is unchanged"
      proof: 'grep: test("W1-T9669: an explicit host key path is what host_alert passes" in test/the-launcher-host-alert-carries-the-app-credential.test.ts'
  falsifier: |
    At origin/main, render the launcher and run its host_alert against a stub rmd that prints GH_APP_ID: the stub
    prints nothing, so the first test fails.
