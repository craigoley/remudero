- id: W1-T3423
  title: "A WORKER CAN PUSH A CI CONTROL-PLANE CHANGE WITH A REQUIRED-CHECK REGISTRATION, CI-PARITY ENTRY, OR CAPABILITY SNAPSHOT MISSING — the detectors run only after GitHub CI begins, while the old hook test-runner route is intentionally removed after corrupting shared Git state; add one diff-scoped static pre-push check"
  repo: remudero
  depends_on: [W1-T3225]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 22.00
  files:
    - hooks/pre-push
    - scripts/ci-control-plane-precheck.mjs
    - src/lib/ci-control-plane.ts
    - src/lib/ci-parity.ts
    - test/every-pr-check-is-required-or-advisory.test.ts
    - test/ci-control-plane-precheck-refuses-before-push.test.ts
    - test/the-hook-spawns-no-test-suite.test.ts
  origin: "operator-session#board-wide-red-2026-09-11"
  plan_refs: ["W1-T2738", "W1-T3059", "W1-T3072", "W1-T3225", "W1-T3414", "W1-T3422"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on #5170's repair chain, not inferred from a title: adding the `squash-trailer-gate`
    job required three coupled control-plane edits. Its first red reported that the check name was
    in neither `.github/workflows/ci-gate.yml`'s REQUIRED nor ADVISORY registry; the next red
    reported that `src/lib/ci-parity.ts` had no `CI_PARITY_TABLE` entry; the final red reported a
    stale generated capability snapshot. Each detector exists and each correctly fails, but all run
    after the branch is pushed and a GitHub CI cycle has begun.

    OBSERVED at current main. `test/every-pr-check-is-required-or-advisory.test.ts` derives every
    pull-request check from the workflow files and rejects a name absent from REQUIRED, ADVISORY,
    and IGNORE. `test/preflight-ci-parity.test.ts` rejects both a real `ci.yml` job without a
    `CI_PARITY_TABLE` row and a table row for no real job. `npm run capability-snapshot:check`
    renders the four source-derived claims and reports a stale `MASTER-PLAN.md` or
    `plan/plan-index.json`; it completed cleanly in about two seconds in this checkout.

    OBSERVED at `hooks/pre-push`: its current routes are rule15, rule25, and tier admission. It
    intentionally contains no test-runner invocation. W1-T3225 removed its census-suite runner
    after two real armed pushes damaged shared Git state, and
    `test/the-hook-spawns-no-test-suite.test.ts` makes that absence a regression property. Adding
    an indiscriminate `node --test` route would repeat the rejected design, not close this gap.

    W1-T2738 solved a different but adjacent constraint: a complete new ci.yml job registration
    can ride with the job without Rule 25 making the required atomic change impossible. It does not
    ask whether that registration is complete before the push. W1-T3422 is likewise related only
    at the queue boundary: it will use bounded evidence to release stale-red PRs; this task prevents
    the missing-control-plane class from consuming a CI cycle in the first place.
  design: |
    (i) EXTRACT ONE STATIC CONTROL-PLANE VERDICT, NEVER A SECOND CENSUS. Move the pure workflow
    candidate derivation and REQUIRED/ADVISORY/IGNORE reconciliation currently exercised by
    `test/every-pr-check-is-required-or-advisory.test.ts` into a small production module. The test,
    the pre-push entry point, and any future caller must use that one parser. Pair it with the
    existing exported `parseCiJobNames` and `CI_PARITY_TABLE`; a ci.yml job is valid only when it
    has exactly one complete mirrored-or-reasoned exclusion entry, and a PR check is valid only when
    it is accounted for by the ci-gate registry. Do not parse YAML with regular expressions, weaken
    matrix/reusable-workflow handling, or make a hand-maintained second check-name roster.

    (ii) RUN ONLY WHEN THE LOCAL DIFF CAN AFFECT THE VERDICT. The new script reads the merge-base
    diff using the same `origin/main...HEAD` boundary as the existing hook routes. It checks workflow
    topology/registry/parity changes only when their inputs changed, and checks generated capability
    snapshot freshness only when one of its declared source inputs or generated outputs changed.
    An ordinary product diff therefore adds no hook work. An unreadable base/diff is named as
    unreadable and does not claim a clean result; preserve the hook's established non-blocking
    handling of that state rather than turning a local repository accident into a fleet-wide outage.

    (iii) ADD THE STATIC ROUTE TO THE ARMED HOOK, NOT A TEST RUNNER. Invoke the entry point through
    `node --import tsx`, after the existing environment scrub and alongside the existing prechecks.
    It may parse files and run the existing `capability-snapshot:check` command, but must not invoke
    `node --test`, `npm test`, an unbounded preflight, network access, or a GitHub CLI/API command.
    Keep `RMD_PREPUSH_GATES=0` as the documented emergency escape and keep all existing routes.

    (iv) MAKE THE THREE #5170 SHAPES ACTIONABLE. On a relevant diff the refusal must name the
    missing job/check and the file that must be reconciled: a new PR job omitted from ci-gate's
    lists, a new ci.yml job omitted from parity, and a changed capability source with stale
    generated outputs. A complete control-plane edit passes. A changed non-control-plane file
    skips without claiming it inspected the registries. The script must never regenerate or rewrite
    a snapshot during a push; it only exposes the existing deterministic remedy.

    (v) TEST THROUGH A REAL LINKED-WORKTREE PUSH. Extend the safe fixture pattern W1-T3225 already
    uses so it proves the hook refuses each incomplete control-plane shape and permits a complete
    one, without relying on a direct hook invocation. Preserve the structural and process-level
    assertion that the push spawns no test runner. Fixture isolation must retain W1-T3224's scrub
    boundary: no assertion may mutate the shared checkout, index, gitdir, capability snapshot, or
    remote.
  acceptance:
    - claim: "every pull_request check derived from the real workflow files is accounted for by exactly one ci-gate registry choice, and a synthetic omitted check is named by the same static checker used before push"
      proof: "unit test: W1-T3423: a missing PR check registry entry refuses the real hook"
    - claim: "a ci.yml job without a mirrored-or-reasoned CI_PARITY_TABLE entry is refused before its push, while a complete job/registry/parity edit passes"
      proof: "unit test: W1-T3423: an unpaired CI job refuses before push"
    - claim: "a capability-snapshot source or output edit with stale generated outputs is refused before push and the hook never rewrites those outputs"
      proof: "unit test: W1-T3423: a stale capability snapshot refuses before push without rewriting it"
    - claim: "an unrelated product diff skips the control-plane route, and the route makes no network, GitHub CLI, full-preflight, or test-runner invocation"
      proof: "unit test: W1-T3423: an unrelated product push skips the static route without a test runner"
    - claim: "the real linked-worktree hook still refuses the existing tier-admission case, permits a clean tree, and spawns no test runner"
      proof: "unit test: W1-T3423: the hook preserves its no-test-runner boundary"
    - claim: "the static parity predicate is reached by the production ci-parity engine rather than existing only for its hook test"
      proof: "grep: ciControlPlaneParity( in src/lib/ci-parity.ts"
  falsifier: |
    CLOSE AS ALREADY BUILT only if an armed real pre-push hook invokes a static checker for the
    three #5170 shapes and that checker shares the actual workflow-census/parity logic rather than
    duplicating it. Reading CI test names, a PR title, or a plan task does not satisfy that test.

    The required negative controls are load-bearing: remove a registry choice, remove a parity
    entry, or make the snapshot stale and the corresponding real-push fixture must refuse and name
    the remedy. Conversely, a complete control-plane edit and an unrelated product edit must push.
    A test that invokes the hook directly does not falsify this task: W1-T3224 showed that Git's
    exported environment differs in a linked-worktree hook.

    Reject any implementation that restores the deleted generic census runner, starts an API poller,
    runs the full CI-parity suite, or writes generated files in the hook. The exact evidence against
    each is visible from the child process argv and the before/after fixture state. These controls
    keep a better worker check from becoming either another shared-Git corruption path or another
    source of GitHub-rate-limit pressure.
  note: |
    reservation hand-off: main -> codex/w1-t3423-control-plane-plan

    The task deliberately has `risk: high`: `hooks/pre-push` is installed into every worker
    worktree, while the source module, CI parity table, and two test families are coupled by one
    control-plane invariant. Its blast radius is the fleet's ability to push, not the number of
    lines in the static checker.

    `capability-snapshot:check` was measured locally at this filing as a deterministic, clean
    static command. That measurement does not establish a fleet-wide latency guarantee; the design
    limits it to the narrow input/output diff set and makes no claim about unrelated pushes.
