  note: |
    THE NARROW FORM WAS CHOSEN OVER THE BROAD ONE ON PURPOSE, AND THE BROAD ONE IS RECORDED SO NOBODY
    THINKS IT WAS MISSED. The feedback asked whether "the default should require an explicit arm seam
    rather than defaulting to the real one, so reaching it is opt-in". The BROAD reading — make the
    seam mandatory in every process, production included — reverses a production default and would be
    an operator ruling. The NARROW reading implemented here gates the requirement on `isTestRunner()`,
    so production wiring is untouched and only a `node --test` process can ever see the refusal. It
    delivers the property that was actually asked for (reaching the real arm from a test becomes
    opt-in) at zero production blast radius. If the broad form is later wanted, this guard is where it
    would be widened, and that widening is a separate filing.

    `risk: high` IS BLAST RADIUS, NOT RULE 19 — TWO STEMS WOULD NOT HAVE FORCED THE BAND. The subject
    is the code path that arms auto-merge on real pull requests. A guard placed one line too early, or
    a predicate that misreads a live daemon as a test runner, disarms the fleet's merge path in
    production. Claiming Rule 19 compelled the band would be a false claim in the direction that
    flatters the filing.

    SIX OF SEVEN PROOFS ARE THE PURE-PATH `unit test:` FORM against a file that does not exist on this
    tree — `not_yet_built` on the filing PR through W1-T456's carve-out, executed once the file lands.
    The seventh is a `grep:` for text this change ADDS (`requireExplicitArmSeam(`) in a path that
    exists today, so it MISSES now and HITS after the change; restated positively on purpose, because
    a grep that must miss after the change reads `executed_fail` and fails the very PR that satisfies
    it.

    THE ONE FALSIFIER TO RUN FIRST, BEFORE WRITING ANY SOURCE. Confirm on the tree of the day that
    `armIfVerdictPermits` still has no token — `deps.arm ?? armAutoMergeDetailed` at or near line
    2795. If some intervening task has already made the seam required, this shard is MOOT and must be
    closed as such rather than implemented anyway. The whole task rests on that one `??`.

    REPRODUCE THE REMOTE ENVIRONMENT, DO NOT INFER FROM THE STACK TRACE. The feedback's author found
    the fault by EMPTYING this machine's config to recreate CI's condition, matching CI's failure set
    exactly, then restoring it byte-identically (72 bytes, re-read and re-verified). If this work needs
    to see the failure it prevents, that is the technique — and the restore is part of it, not an
    afterthought.
