  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/daemon.test.ts`, which is declared in `files:` and already exists with 110
    tests, so each resolves against a real file rather than a forward reference.

    `risk: high` IS RULE 19'S SPAN AND IS SET UP FRONT RATHER THAN AFTER A REFUSAL. `files:` names
    two stems, which the sizing check reads as distinct concerns and refuses at `medium`.
    Decomposing is wrong: design (ii) is one rule — the gate must be reachable — applied at the two
    points that can make it so, and either half alone leaves the other's failure standing. The
    blast radius is the daemon's own loop, which is why the band is honest in both directions: a
    mistake here does not corrupt a decision, it changes how often a correct decision is made.

    TWO MEASURED GAPS ARE CARRIED UNRESOLVED RATHER THAN FOLDED IN, because neither is established
    and folding an unexplained observation into a mechanism is how a wrong cause survives review.
    FIRST: a 106-minute window on 2026-08-23, 14:44:35Z to 16:30:51Z, with NO `daemon.alive` rows
    at all — a boot is missing from the ledger's view and this shard does not claim to know why.
    SECOND: `automerge.rate_limit_refused` carries the fields `gh_bucket`, `gh_bucket_resets_at`
    and `gh_bucket_operation`, and the most recent of its 11 rows reads `gh_bucket: "unknown"` and
    `gh_bucket_resets_at: "unknown"` — so the shape shipped and the attribution did not. Whether
    that is W1-T1235's remaining half or a separate defect is NOT established here.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN.
    `refs/rmd-id/W1-T1272` resolves on origin against a namespace of 302 such refs; a reservation
    existing is not evidence a shard does. EIGHT SURFACES WERE SWEPT, EACH CONTROL QUALIFIED ON ITS
    OWN SURFACE BEFORE THE ZERO WAS TRUSTED: shard filenames 0 against W1-T1252 at 1; plan `- id:`
    lines 0 against W1-T1252 at 1; the reservation 1, which is the pre-mint, against W1-T1252's own
    reservation at 1; open PR titles 0 against W1-T1271 at 1 (live in an open title now); open PR
    head branches 0 against `run-W1-T` heads at 3; open PR file lists 0 with coverage at ten
    captured of ten enumerated, against `plan/tasks.d/` paths at 5 across the same heads; merged
    trailers 0 against `Remudero-Task: W1-T1248` at 1, with 454 trailer-carrying commits on main;
    and merged subject credit 0 against W1-T1252 at 1, with `run-W1-T1272-*` at 0 against a
    namespace of 86 `run-*` branches.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE, NOT A PRESENCE TEST, AND WAS
    READ THROUGH GIT OBJECTS BECAUSE THE FILES INVOLVED EXCEED THE CONTENTS API'S LIMIT. Four
    markers at every one of the ten open PR heads and at main: `checkFreshness`, `deps.sweep!()`
    and `deps.sweepLight` in `src/lib/daemon.ts`, and `checkFreshness` in `test/daemon.test.ts`.
    Main reads 6 / 1 / 5 / 0 and EVERY head reads exactly 6 / 1 / 5 / 0 — no head moves any marker.
    The fourth marker's zero is the finding of rationale (7), and it is controlled by the same
    file's 14 references to the sweep dep, so the scan reaches the file and the absence is real.
