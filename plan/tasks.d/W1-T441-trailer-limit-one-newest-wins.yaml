  note: "verify:auto — nothing here needs an operator ruling. Design (iii) leaves ONE choice open and
    names the condition that decides it (does `ownsOwnRunBranch` discriminate the W1-T254 shape),
    which is a measurement the implementer can take, not a policy the plan withheld.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` and acceptance text,
    and this set crosses `src/lib`, `src/` and `test/`, which is >=2 subsystems and would be a sizing
    violation at any lower band. Raised up front rather than shipped as one — the W1-T400/W1-T407
    lesson. The actual change is a candidate list and a preference rule.
    THE TWO EXISTING SUITES ARE DECLARED DELIBERATELY, not defensively.
    `test/already-satisfied-exit.test.ts` and `test/already-satisfied-unverifiable.test.ts` both
    assert `resolveAlreadySatisfied`'s outcomes against a gateway returning a SINGLE `PrRef`; if the
    gateway's shape or the preference rule changes, those are the tests that go red, and a `files:`
    omitting them is the refusal-at-push that cost W1-T407 three dispatches. Verified by invocation,
    not by mention: both call `resolveAlreadySatisfied` directly and construct
    `findMergedByTrailer` fixtures.
    All four proofs name ONE forward-referenced PATH; a path forward-reference is safe and a symbol
    one is a guess, and a `grep:` proof naming an existing symbol would match the merge base as well
    as the head and be downgraded to stale.
    budget_usd 65 — the fetch widening is small; the cost is the preference rule, the tie-break, and
    the four falsifier directions, of which `exactly one PR carries the trailer` is the one that must
    prove behaviour is UNCHANGED for the 479 of 495 ids that are not affected.
    NO COUNT HERE SHOULD BE QUOTED FORWARD — re-run the body scan; the duplicate set grows every time
    a task is closed as already-satisfied."
