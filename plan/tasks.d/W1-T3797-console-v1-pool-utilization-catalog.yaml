- id: W1-T3797
  title: "QUEUE PRESSURE IS NOT POOL UTILIZATION — expose observed dispatch capacity and occupancy so the agent can propose scaling without guessing configured worker count"
  repo: remudero
  depends_on: [W1-T3796, W1-T3762]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 70.00
  origin: human
  plan_refs: ["§12", "W1-T3762"]
  files: [src/lib/operator-agent-capacity.ts, test/operator-agent-capacity.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at origin/main 948173f3: daemon.ts:596-809 sizes admitted lanes from SweepPolicy.wipLimit
    and the scheduler's lane budget, while run-task.ts:29291 and :34950 document the distinction
    between admitted lanes, worker concurrency, and the host's measured capacity. The current
    console agent can observe queue.pending but correctly lists worker-pool-utilization as
    unsupported. Queue depth alone cannot prove that a configured pool is underutilized.
  design: |
    Add a pure capacity adapter by reading the existing bounded dispatch and worker fields supplied
    by the caller; this task does not change scheduler admission, worker execution, or the routing
    producer owned by W1-T3762. Name the configured lane/pool bound, observed admitted lanes, active
    worker occupancy, queued work, and the measurement window. Keep configured versus observed values
    separate; if the ledger cannot read one side of the relationship, return an explicit unavailable
    reason and suppress scale proposals. Add positive controls for a genuinely occupied pool and for
    a queue-only fixture so the latter cannot be misreported as utilization. W1-T3794 owns final
    console-v1 composition.
  acceptance:
    - claim: "pool utilization includes configured capacity, observed occupancy, queued work, and a measurement window"
      proof: "grep: W1-T3797 criterion 1 in test/operator-agent-capacity.test.ts"
    - claim: "queue depth alone never produces an underutilization or scale recommendation"
      proof: "grep: W1-T3797 criterion 2 in test/operator-agent-capacity.test.ts"
    - claim: "missing scheduler capacity data is explicit unavailable and suppresses the scale signal"
      proof: "grep: W1-T3797 criterion 3 in test/operator-agent-capacity.test.ts"
