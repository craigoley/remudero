- id: W1-T5706
  title: "A LEFTOVER WORKER-SMOKE CONTAINER PINS NO IMAGE, AND A ZERO-BYTE RECLAIM NAMES WHAT PINS EACH ONE — the recycle's image prune protects every image any container uses, running or not, so two Created smoke containers and ad-hoc stopped ones hold 4.0 GB images and ~/reclaim.log reads 'Total reclaimed space: 0B' every time"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the recycle reclaim's image pins
  band_meaning: blast-radius
  origin: "operator session 2026-10-04: research/flow/report.md (change-aware flow) item 8, the image budget"
  plan_refs: [W1-T2585, W1-T2725, W1-T5688]
  files: [deploy/recycle-container.sh, test/a-stale-worker-smoke-container-pins-no-image.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a and the host (`docker system df`, `docker ps -a`, read
    only). /mnt/rmd is 126 G, 108 used, 12 free; containerd images 27.2 G: 7 remudero images, each
    4.26 GB with 4.0 GB unique (246.6 MB shared base). CORRECTION to the first report ("all pinned by
    stopped containers"): 4 are held by RUNNING tenants (daemon, console daemon, site daemon, serve —
    each on its own image) and 1 by `rmd_cash_attempt_impl_gate_v4`, which is never touched; only 2
    (about 8.0 GB) are held purely by stopped containers — `remudero-site-daemon-worker-smoke` and
    `remudero-console-daemon-worker-smoke` (Created), and the ad-hoc `nifty_black`; serve's image
    also carries 3 exited `inbox-plan-validation-*`. deploy/recycle-container.sh's reclaim (W1-T2585)
    protects every image used by any container and runs `docker image prune -af`, and by design
    never runs `docker container prune` (an ad-hoc stopped container may be someone's). Its worker
    smoke runs as `${CONTAINER_NAME}-worker-smoke` with `--rm` and is removed only on the failure
    path, so a smoke left in Created state survives. A budget of 2 images is unreachable without
    recycling all four tenants onto one image; the realistic floor is 5. `--cache-from` is dropped:
    images are built remotely by `az acr build` (.github/workflows/acr-build.yml), with no local build.
  design: |
    (i) Before the reclaim, remove only containers named exactly `${CONTAINER_NAME}-worker-smoke`
    that are not running — the recycle's own leftovers. No other name is ever removed, and
    `rmd_cash_attempt_impl_gate_v4` is never listed for removal.
    (ii) After the prune, when it reclaimed 0 bytes, print one line per image still held only by
    non-running containers: image id, unique bytes, and the container names pinning it, so an
    operator can remove `nifty_black`-style leftovers by name.
  acceptance:
    - claim: "with a fake docker, a Created worker-smoke container from an earlier recycle is removed before the prune and its image is reclaimed, a stopped container with any other name still protects its image and is named in the pin report, and the cash container is never removed"
      proof: "unit test: test/a-stale-worker-smoke-container-pins-no-image.test.ts"
  falsifier: |
    Drop the smoke removal: the fake docker's protected set still holds the smoke image and the test
    fails.
