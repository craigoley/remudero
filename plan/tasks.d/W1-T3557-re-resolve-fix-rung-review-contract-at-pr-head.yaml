- id: W1-T3557
  title: "RE-RESOLVE THE FIX-RUNG REVIEW CONTRACT AT THE CURRENT PR HEAD — a plan split or scope amendment after sweep admission must not let a stale task object publish a superseded verdict"
  repo: remudero
  depends_on: [W1-T3501]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 12.00
  files:
    - src/run-task.ts
    - test/fix-rung-report-provenance.test.ts
  origin: "operator-session#fix-rung-stale-contract-2026-09-14"
  plan_refs: ["W1-T2462", "W1-T3501", "W1-T3545"]
  status: merged
  attempts: 0
  note: |
    OBSERVED 2026-09-14: daemon run DAEMON-1789351932540 began before W1-T3545 was split.
    Its post-fix review of PR #5474 at bf95bac5 used the six-criterion pre-split contract even
    though the PR head carried W1-T3545's three current Phase One criteria. The terminal ledger
    row records the old claims verbatim. This is not a worker judgment failure: runFixRung passes
    opts.task to runReview, and runReview judges task.acceptance directly. The ordinary `rmd review`
    command already resolves a task's criteria at the PR head; this lower-level fix-rung call does
    not.
  rationale: |
    A review verdict is input-pinned to the PR head. Reusing a task object captured when the sweep
    started makes the verdict answer a different contract after a legitimate plan split, scope
    amendment, or acceptance repair. The resulting failure can consume strikes and block a green
    PR even though every current proof passes. The remedy must preserve fail-closed review behavior
    without inventing a current contract when the PR-head plan cannot be read.

    W1-T3501 is the preceding, unbuilt body-input repair on these same two files. It ensures a
    fix re-review receives the current PR body rather than worker transcript; it does not refresh
    the separately captured task.acceptance or task.files. This task depends on it so the two
    complementary repairs cannot race or conflict in the same post-fix review boundary.
  design: |
    At the post-fix review boundary, resolve the trailered task's acceptance criteria and declared
    files from the current PR head using the same head-bound plan resolver as `rmd review`. Pass
    that refreshed contract to the lower-level reviewer instead of the task object captured at
    sweep admission. If the current head does not resolve a readable task contract, do not fall
    back to the captured acceptance: emit a named ledger refusal and stand the stale run down so a
    later fresh sweep can reconcile it. Preserve synthetic-task behavior, the review's existing
    per-head deduplication, and all ordinary unmodified-task paths.
  acceptance:
    - claim: "a post-fix review receives the task acceptance criteria and declared files resolved at the current PR head, not the sweep-start task snapshot"
      proof: "unit test: a fix-rung re-review refreshes its task contract at the current PR head"
    - claim: "an unreadable or missing PR-head task contract never falls back to stale acceptance and instead records a named stand-down without invoking the reviewer"
      proof: "unit test: a fix-rung re-review refuses an unreadable current task contract without replaying stale criteria"
  falsifier: |
    Mutate the post-fix boundary to pass opts.task directly and require the first test to receive
    the stale criteria and fail. Mutate the unreadable-contract arm to continue with opts.task and
    require the second test to observe a reviewer invocation and fail. Restore both arms and run
    the two proofs through rmd check-proof against the merge base.
