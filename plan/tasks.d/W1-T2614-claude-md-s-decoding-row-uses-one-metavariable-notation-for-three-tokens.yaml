      proof: "unit test: test/docs-claims.test.ts"
    - claim: "the correction is SURGICAL — the `G-N` and `DR-N` clauses keep their hyphens, which are literal and correct (`G-17` is the row's own example; DR- is hyphenated 73 times in MASTER-PLAN), so a blanket de-hyphenation of the row FAILS the check"
      proof: "unit test: test/docs-claims.test.ts"
    - claim: "the guarantee is registered as its own gated claim `retro-proposal-id-doc-form` in plan/claims.yaml and is BIDIRECTIONAL, so a drift fails CI by name in either direction instead of surviving in prose"
      proof: "grep: retro-proposal-id-doc-form in plan/claims.yaml"
  note: |
    FILED 2026-09-01 from the W1-T2457 follow-up harvest (run W1-T2457-1788020906446, PR #3272).
