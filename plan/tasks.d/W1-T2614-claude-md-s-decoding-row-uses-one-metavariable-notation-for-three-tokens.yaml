    sentence may need.

    risk:medium is the honest band, not a sizing dodge. Span is ONE subsystem: `plan/claims.yaml` is
    a discounted plan-data artifact and `test/docs-claims.test.ts` is the task's companion suite
    (DATA_ARTIFACT_CLASSES / COMPANION_PATH_CLASSES, src/lib/task-linter.ts), leaving `CLAUDE.md`
    alone in the tally — so no Rule 19 regrade is needed and none is claimed. Blast radius is a
    claims row whose only failure mode is a red claims-check on a doc edit, recoverable in one line,
    the band W1-T107 and W1-T129 already occupy. No dispatch path, no merge arm, no gate config.

    MINT RECORD, following the discipline at run-task.ts:19679 rather than guessing: the highest
