  falsifier: |
    Measure silence against a fixed hour count: a gardener that passes daily is flagged all day
    and the cadence test fails. Drop the `garden_filing_escalated` check: the filing-streak test
    sees a second escalation. Write the effect verdict straight into `<name>-gardener.json` from
    the overseer: the fold test's concurrent pass overwrites it and the class record is unchanged.
