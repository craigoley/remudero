- id: W1-T13325
  title: "The automatic branch reap reads merge credit off the daemon loop: the daemon's reap pass awaits the credit scan that keeps durable digests, not the synchronous whole-union read, so the first reap after a daemon start no longer stalls the loop (106 s and 127 s after the two starts on 2026-11-17)"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # the credit set feeds the reaper's reasons for slug and run branches; a credit read that wrongly names a task as credited mislabels a branch, and a failed read must still leave those branches held
  origin: "operator-session#loop-lag-2026-11-17"
  plan_refs:
    - W1-T12753
    - W1-T13155
    - W1-T13185
