  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, and the blast radius is
    genuinely high here because the wiring site is the file every other task contends for.
    **`files:` WAS DERIVED BY INVOCATION COUNT ON THE SYMBOL THAT CHANGES, NOT PROSE MENTION**,
    measured at `a0028d7`: `taskRecordContextLine` occurs in `src/run-task.ts` (**4**) and in
    `test/recon-degrade.test.ts` (**4**), and in no other path. That is the whole declared set.
    **PHRASE THAT COUNT CAREFULLY WHEN YOU QUOTE IT.** The original wording here read \"appears in
    exactly TWO files\", and `bodyContradictsDiff` (`src/lib/review.ts`) FAILED the filing PR over it —
    the detector opens the diff and reads any `exactly N files` as a claim about THE CHANGESET, which
    for a one-file filing is false. It cannot tell a symbol-occurrence count from a scope claim, and it
    is right not to guess. An implementer echoing that shape into their own PR body will be failed the
    same way, so state occurrence counts as paths-and-counts rather than as a file TALLY.
    **`test/plan-sharding.test.ts` IS DELIBERATELY NOT DECLARED** even though it scores **13** on
    `taskRecordPath`, the highest of any file: it tests the PATH FUNCTION (`src/lib/plan.ts`, score 1),
    which this task does not change — the change is to what the CALLER anchors that path against. A
    declared-but-untouched path fails `inverseScopeUntouchedFiles` (`src/lib/review.ts`) exactly as an
    undeclared one fails `scopeViolationFiles`.
    **`src/run-task.ts` IS DECLARED DELIBERATELY AND THE COST IS ACCEPTED EXPLICITLY.** It is ~19,900
    lines and `partitionByFileOverlap` (W1-T471) serialises every task that names it, so this task
    will not run concurrently with any other that declares it. **THAT COST IS PAID ON PURPOSE**: the
    line being fixed IS in that file, and avoiding it has already shipped two checks dormant. There is
    no smaller honest declaration.
    **THE ACCEPTANCE PROOFS ARE NAME-FILTERED, NOT PURE PATHS.** A pure path would run
    `test/recon-degrade.test.ts` whole and couple every criterion to unrelated failures in it — the
    shape that killed #1830 twice. Each of the four titles was checked to match **0** files on
    `origin/main` today, against a positive control (`an exit 0 is NEVER throttled`) matching **1**;
    each is under 100 characters with no comma, so `looksLikeScenarioNarrative`
    (`src/lib/task-linter.ts`) cannot fail them.
    EVERY NUMBER HERE IS AZURE-ONLY AND DATED 2026-08-15: the 12-of-41 write split, the 29 worktree-only
    control, the live mtimes, and the two staleness windows. RE-DERIVE BEFORE BUILDING — worker
    transcripts are per-run and only three worker-home directories survived to be counted."
