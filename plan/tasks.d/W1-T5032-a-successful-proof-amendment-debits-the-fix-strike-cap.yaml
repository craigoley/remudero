      proof: 'grep: test("W1-T5032: a proof-amendment identity row is not a strike under either regime" in test/a-proof-amendment-identity-row-is-not-a-fix-strike.test.ts'
    - claim: "a sweep under a worker strike plus an amendment identity row still claims and dispatches the fix worker"
      proof: 'grep: test("W1-T5032: a worker strike plus an amendment identity row still dispatches under the claim" in test/a-proof-amendment-identity-row-is-not-a-fix-strike.test.ts'
    - claim: "a real worker dispatch still counts: cap worker rows exhaust the tally and refuse the claim, the preserved-count control"
      proof: 'grep: test("W1-T5032: a real worker dispatch still counts toward the cap" in test/a-proof-amendment-identity-row-is-not-a-fix-strike.test.ts'
    - claim: "the identity row is still written and still resolved by lookupIdentity, so a re-dispatch opens no second amendment"
      proof: 'grep: test("W1-T5032: the identity row is still written and resolved by its key" in test/a-proof-amendment-identity-row-is-not-a-fix-strike.test.ts'
    - claim: "the production ledger selector skips the identity row in its head-selecting loop, a production call site of the helper"
      proof: 'grep: isProofAmendmentIdentityRow(line)) continue in src/lib/sweep.ts'
  falsifier: |
    Remove either exclusion in `fixLedgerRowsForHead` and a test reddens: drop the head-branch `continue` and the fresh-count and head-keyed tallies
    read 2 again; drop the no-head filter and the no-head case of the regime test reddens. Make the predicate match on `step` alone and the
    preserved-count test reddens (a real worker row is swallowed). Stop the row being written and the still-written test reddens. CLOSE IF a
    `fix.dispatch` row with `kind: proof_amendment` is already excluded from `fixLedgerRowsForHead`'s output.
  note: |
    RISK: high because src/lib/sweep.ts carries the strike cap that bounds autonomous worker spend and the escalation path; the change can only make
    a tally read LOWER by exactly the rows of one kind, so it can allow one more worker dispatch where today a stale-proof PR escalates, never fewer.
    BOUND CENSUS: the cap is unchanged and no constant is added, so test/bound-kind-declared.test.ts is not touched.
    src/lib/sweep.ts carries a comment-load row (scripts/comment-load-baseline.json); keep the new doc comment short and inside it, never raise or delete the row.
