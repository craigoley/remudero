- id: W1-T3146
  title: "EVERY SHARD DECLARES A `budget_usd` AND NOT ONE HAS EVER FIRED — the median declared budget is $35.00 against a median implement run of $4.08 and a p90 of $10.30, so the enforced hard cap sits 8.6x above the middle of the population it bounds and `blocked_budget` appears ZERO times in the entire ledger union"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: span
  budget_usd: 12.00
  files: [src/lib/task-linter.ts, test/a-declared-budget-is-calibrated-against-observed-runs.test.ts]
  origin: "operator-session#router-efficiency-2026-09-08"
