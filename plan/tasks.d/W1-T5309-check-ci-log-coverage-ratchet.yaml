  rationale: |
    MEASURED 2026-10-21, read-only (core ledger archives 2026-10-07..10-21 plus the live file, deduplicated;
    gardener state ci-friction-gardener.json; origin/main 03e4f4ac7).

    THE CAUSE IS LIVE, AND SMALLER THAN THE ORIGINAL FILING.
    - The gardener's last pass (2026-10-21T10:05Z, seven-day half-life) prices it at 226.9 PR-minutes as
      check:ci-log:coverage-ratchet plus 140.9 as check:ci-log:coverage-ratchet:diff-coverage-blocked-…
      (the same cause, split by signature since W1-T9056). The original 1407.5 has decayed.
    - fix.dispatch rows naming coverage-ratchet: 70 in 10-08..10-14 (65 diff-coverage BLOCKED, 18% of
      ci-log rounds, 176 worker-minutes); 18 in 10-15..10-21 (15 BLOCKED, 7.8%, 150 worker-minutes). Newest:
      #13031, #13081, #13173 (10-20) and #12975 (10-19). They are real coverage defects (added lines with zero
      covering tests), not flakes: 2 of the 18 were timeouts and 1 had no signature.

    THE PRECHECK HAS NO VERDICT, AND NEVER REFUSES.
    - 401 push.coverage_precheck rows, 10-13..10-21: 309 (77%) `unavailable`, 0 `uncovered`, 2
      `uncovered-narrow`; most `covered` rows read "no changed src file". Zero pushes were refused.
    - After W1-T9483's narrow pass deployed (10-20/21), 31 of 46 real source diffs read `unavailable`
      because the NARROW pass itself was over the 40-suite ceiling ("928 own and direct-importer suite(s)",
      "256 …"). coverageNarrowSuites (src/lib/coverage-narrow.ts) unions the direct importers of EVERY
      changed src file, so one hub file blinds the whole diff: src/run-task.ts has ~930 direct-importer
      suites, src/lib/daemon.ts and src/lib/sweep.ts ~230 each.
    - Per-file import reach cannot replace it: run-task.ts's import cycle makes even small modules reach
      1,700-3,000 suites (engine-tree.ts, 1 direct importer, reaches 1,719). An authoritative `uncovered`
      from the import graph is out of reach; the narrow verdict is the signal there is.

    REPLAY — 28 heads CI blocked on diff-coverage, 10-13..10-20 (all fetched; the repo's own
    buildAffectedSuitesGraph/selectAffectedSuites run per file at each head): in 20 of 28 (71%) every
    blocked line sits in a file with at most 40 direct-importer suites (engine-tree.ts 1, inbox-responder.ts
    8, fleet-lane.ts 15, proof-missing-export.ts 1, host-memory-admission.ts 5, dep-review.ts 6 or 11, …).
    A narrow pass over those files' own and direct-importer suites would have named CI's exact lines: a
    suite subset never covers a line no suite covers. The other 8 blocked lines sit in hub files (daemon.ts,
    run-task.ts, sweep.ts, inbox.ts, deployer.ts).

    THE ADVISORY THAT EXISTS IS RIGHT AND IGNORED. coveragePushRefusal (src/run-task.ts) refuses only
    `uncovered`; `uncovered-narrow` is ledgered and the head pushes. W1-T9483's design said the implement and
    fix prompts would name its lines; that was never built. The one advisory with a CI outcome so far
    (10-20 19:24Z, head 7e0608df) flagged src/lib/proof-missing-export.ts:65; CI blocked exactly that line on
    PR #13173 and a fix round followed at 23:31Z (1 of 1). The other (W1-T10310, gh-read-broker.ts:413) has
    no CI outcome yet.

    PARITY GAP. The precheck's COVERAGE_SRC_FILE (src/run-task.ts, `^src/.*\.ts$`) and coverage-narrow.ts's
    SRC_FILE judge only src/**/*.ts. CI's gate (scripts/diff-coverage.mjs changedSourceFiles) also judges
    src/**/*.mjs and scripts/**/*.mjs, so an .mjs-only diff reads "covered: no changed src file". 4 of the
    28 blocked heads had their blocked lines in .mjs files (inside mixed diffs); none was .mjs-only.

    WHAT EARLIER RUNGS TRIED: W1-T4810 (a docs paragraph) and W1-T9653 (a docs record of the mechanism).
    Neither changed a code path.
  design: |
    1. coverage-narrow.ts — THE NARROW PASS IS PER FILE. Its suites are the diff's own changed test files plus,
       for each changed source file whose direct-importer suites fit the existing measured narrow ceiling
       (PREFLIGHT_SCOPED_COVERAGE_SUITE_CEILING — no new number), that file's direct importers, while the union
       still fits. A hub file over the ceiling adds no importers of its own; when no selected suite loads it,
       add one direct importer so the report carries its SF record. judgeCoverage counts a gap only in files
       whose own and direct-importer suites all ran; a gap only in a hub file is `unavailable`, as today. A
       clean run is still `covered` (a subset that covers every added line is a sound verdict), and only a reach
       pass can return `uncovered`, exactly as today.
    2. run-task.ts, at the fallback_push site only — ONE PRE-PR REPAIR, NOT A REFUSAL. When the precheck returns
       `uncovered-narrow`, the implement push first gets ONE repair attempt through the existing
       repairCensusRefusedPush, with the narrow lines as its evidence (the same prompt block as a W1-T4797
       coverage refusal, saying the lines are the narrow pass's finding). After that one attempt the push
       proceeds as it does today, whatever the attempt did; an unchanged or still-uncovered head is never failed
       for it. W1-T9483's rule holds: an `uncovered-narrow` result refuses nothing — a repair is attempted once,
       then CI stays the authority. rung.fix_push stays advisory: it ledgers the result and pushes, as today.
    3. run-task.ts — COVERAGE_SRC_FILE matches CI's gate predicate: src/**/*.ts, src/**/*.mjs and
       scripts/**/*.mjs. coverage-narrow.ts's source predicate follows it.
    No fixed thresholds are added. The repair is bounded by the existing repair rung's own budget and wall-clock
    bound. Keep the run-task.ts edits to the fallback_push site and COVERAGE_SRC_FILE.
