    - claim: "an uncovered-narrow implement push gets one pre-PR repair attempt, then pushes"
      proof: 'grep: test("W1-T5309: an uncovered-narrow implement push gets one pre-PR repair, then pushes" in test/ci/coverage/the-coverage-precheck-sees-past-a-hub-file.test.ts'
    - claim: "the precheck judges a changed .mjs source file as CI's gate does"
      proof: 'grep: test("W1-T5309: the precheck judges a changed mjs source file as CI does" in test/ci/coverage/the-coverage-precheck-sees-past-a-hub-file.test.ts'
  falsifier: |
    On main, give coveragePrecheck injected ports: changed files src/run-task.ts (950 direct-importer suites)
    and src/lib/engine-tree.ts (one direct importer), a reach selection of 2,000 suites, and a run that leaves
    engine-tree.ts:109 uncovered. It returns `unavailable` ("… own and direct-importer suite(s) were not
    measured") and never runs engine-tree.ts's importer. With the change it runs the own and engine-tree
    importer suites and returns `uncovered-narrow` naming engine-tree.ts:109. The fallback push then spawns
    exactly one repair worker and pushes even when the repaired head is still uncovered; on main it pushes
    with no repair. A changed scripts/foo.mjs alone reads "covered: no changed src file" on main and is
    measured with the change.
    GUARDS (present at base, must stay green): an over-ceiling narrow gap still never returns `uncovered`
    (test/the-coverage-precheck-asks-the-diffs-own-suites-first.test.ts); coveragePushRefusal still refuses
    only `uncovered`; rung.fix_push still pushes on `uncovered-narrow` without a repair; a narrow run that
    covers every added line is still `covered`.
