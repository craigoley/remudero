      proof: 'grep: test("W1-T9557: a sustained typical shortfall still raises one decision naming its basis" in test/the-capacity-decision-charges-the-daemons-typical-growth.test.ts'
    - claim: "with too few footprint samples the whole growth is charged and the basis says so"
      proof: 'grep: test("W1-T9557: too few footprint samples charge the whole growth and say so" in test/the-capacity-decision-charges-the-daemons-typical-growth.test.ts'
