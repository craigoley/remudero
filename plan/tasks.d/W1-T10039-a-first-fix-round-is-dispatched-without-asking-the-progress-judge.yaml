- id: W1-T10039
  title: "A PR WITH NO FIX ROUND GETS ITS FIRST ROUND WITHOUT ASKING THE PROGRESS JUDGE — on 2026-10-17 the judge, given round_count 0 and every signal zero, ruled `escalate` on #12542 (07:10Z and 07:11Z, after a `continue` at 07:06Z on the same input key) but `continue` on #12575 and #12582; #12542 never got a fix round and parked behind needs-human #12545 until a hand round merged it at 14:46Z"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern, whether an unparked PR with no fix round is put to the progress judge; parked waits, rounds after the first and the judge itself are unchanged
  band_meaning: span
  origin: 'coordinator brief batch1017b item 3 (2026-10-17, fleet defect from the PR-queue red triage)'
  plan_refs: [W1-T9297, W1-T9502, W1-T7096, W1-T7243, W1-T7762, W1-T5999]
  files:
    - src/lib/fix-progress-judge.ts
