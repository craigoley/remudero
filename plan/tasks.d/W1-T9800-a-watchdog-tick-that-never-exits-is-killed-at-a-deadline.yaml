- id: W1-T9800
  title: "A WATCHDOG TICK THAT NEVER EXITS IS KILLED AT A DEADLINE, NOT WAITED ON FOREVER — rmd-console-fleet-watchdog.service sat in activating from 2026-10-13 12:16:45Z until a hand kill at 2026-10-16 11:29:40Z (~71 h): its deploy-run child wrote deploy.skip at 12:17:42Z and never exited, the oneshot has no TimeoutStartSec, so its 5-minute timer never fired again and console got no deploy tick, unit converge or recycle for three days"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern, how long one host watchdog tick may run before it is ended and named; the tick's decisions are unchanged
  band_meaning: blast-radius
  origin: 'operator session 2026-10-16: the console watchdog oneshot hung ~71 h until the operator ran systemctl kill at ~11:29Z; coordinator brief batch1016 item 1'
  plan_refs: [W1-T2877, W1-T3245, W1-T3269, W1-T5688, W1-T6249, W1-T9409, W1-T9645]
  files:
