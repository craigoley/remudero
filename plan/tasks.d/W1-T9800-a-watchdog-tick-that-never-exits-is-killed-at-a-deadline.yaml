      proof: 'grep: test("W1-T9800: every instance watchdog service carries a bounded start timeout" in test/a-watchdog-tick-that-never-exits-is-killed-at-a-deadline.test.ts'
    - claim: "a deploy-run that wrote its decision and never exits is killed at its deadline, and the tick names the step in the journal and REVIVAL_LOG"
      proof: 'grep: test("W1-T9800: a deploy-run that never exits is killed at its deadline and named" in test/a-watchdog-tick-that-never-exits-is-killed-at-a-deadline.test.ts'
    - claim: "a timed-out deploy-run raises the deploy-run-problem host alert instead of passing as a clean tick"
      proof: 'grep: test("W1-T9800: a timed-out deploy-run raises the deploy-run-problem alert" in test/a-watchdog-tick-that-never-exits-is-killed-at-a-deadline.test.ts'
  falsifier: |
    On origin/main, render the units for core, site and console: no watchdog service has a TimeoutStartSec line, so
    the first test fails. Run the rendered launcher's healthy-daemon arm with a stub bin/rmd whose deploy-run
    prints a deploy.skip line and sleeps: the launcher never returns, so the second test fails on its own timeout
    and no step line or REVIVAL_LOG row exists; no host alert is raised, so the third fails.
