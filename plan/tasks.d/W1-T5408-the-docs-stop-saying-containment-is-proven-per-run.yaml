- id: W1-T5408
  title: "THE DOCS STOP SAYING CONTAINMENT IS PROVEN PER RUN — W1-T5346 (#8820) moves the containment and isolation probes to once per boot and on any change of their inputs and amends MASTER-PLAN §12 rule 11, but docs/architecture.md still tells a reader containment and isolation are PROVEN PER RUN"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: low
  origin: "operator session 2026-10-03: follow-up to W1-T5346 (#8820)"
  plan_refs: [W1-T5346, W1-T17]
  files: [docs/architecture.md, test/the-docs-stop-saying-containment-is-proven-per-run.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    W1-T5346 (#8820) rewrites MASTER-PLAN §12 rule 11 to "PROVEN by probe — once per boot and again on any
    change of the probe's inputs", with reuse keyed by `probeVerdictKey`. docs/ORIENTATION.md is generated
    by `rmd retro` from MASTER-PLAN, so it follows on the next retro. docs/architecture.md is hand-written
    and does not: its "Two more structural guarantees" bullet says "Containment and isolation are PROVEN
    PER RUN, never assumed". #8820 does not touch it.
    Kept to the one doc (Rule 19, one concern). The rule-11 doc comments in src/lib/isolation.ts and
    src/lib/containment.ts carry the same phrase and are left to the code tasks that next edit those files.
    #8820 is still OPEN at filing (2026-10-03), so W1-T5346 is cited in plan_refs, not depends_on. Build
    this only after #8820 merges, or the docs would describe behaviour main does not yet have.
    docs/forensics/containment.md quotes the old rule as a historical record and is left as written.
  design: |
    Reword the docs/architecture.md bullet to the amended rule 11: proven by probe
    once per boot and on any change of the probe's inputs (image build sha, harness revision, worker
    settings, hooks, CLI version, provider), never assumed. A failed probe is never cached. Name
    `probeVerdictKey`. Prose only; no code change.
  acceptance:
    - claim: "docs/architecture.md no longer says containment or isolation is proven per run and states the once-per-boot-and-input-change rule naming probeVerdictKey"
      proof: "unit test: test/the-docs-stop-saying-containment-is-proven-per-run.test.ts"
  falsifier: |
    Restore the "PROVEN PER RUN" bullet in docs/architecture.md. The suite's case-insensitive scan of the
    file finds it and fails.
