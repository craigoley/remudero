  budget_usd: 24.00
  risk: medium
  origin: "operator console gardener follow-up 2026-10-12; observed /v1/i/core/gardeners spend:null with 129 registered pass attempts"
  plan_refs: [W1-T4949, W1-T4950, W1-T5527, W1-T6466]
  files: [src/lib/gardener-spend.ts, src/lib/analytics-view.ts, src/lib/read-model-worker.ts, src/lib/ledger-steps.ts, openapi/daemon.yaml, packages/api-client/src/schema.d.ts, test/a-gardener-spend-read-requires-the-exact-parent-pass.test.ts]
  status: queued
  attempts: 0
  rationale: |
    The 2026-10-12T10:31:02Z live core gardener read reports 17 enabled registered gardeners,
    129 attempts within one daemon generation, spend:null and outcomeAssessment:not_collected.
    Site and console each report 17 configured but disabled gardeners: zero attempts in their
    current generation does not establish historical zero spend. Pass completion is transport,
    not a measured improvement. W1-T4949, W1-T4950 and W1-T100002 already have merged implementation
    credit; do not rebuild their intake, outcome interfaces or durable delivery work. The current
    missing increment is production cost attribution and its bounded cached read, not new authority.
    A separately prepared parent-pass correlation repair creates a UUID per off-loop pass, carries
    it to the real child, and stamps default ledger writes as gardener_origin. A correlation carrier
    alone is not trustworthy cost evidence: the consuming fold must require an exact parent receipt.
  design: |
    Extend the existing off-loop cached Analytics materialization, not request-time ledger reads,
    per-repository fanout, a new daemon timer, or provider calls. Consume the versioned linked
    gardener_origin carrier only after joining its exact name/passId to garden.lifecycle or
    garden.pass with repository and daemon generation scope. Preserve child run/task identities.
    Missing, invalid, legacy, mismatched, interrupted and absent-price evidence stays explicitly
    unknown/partial. Never infer parenthood from timestamp proximity, task names, process success
    or a reusable PID. If the prerequisite producer is not yet present, return not_collected;
    do not independently implement a competing carrier or reconstruct historical links.
    Reuse the canonical priced-cost semantics and all priced-step census membership. Deduplicate
    receipts using their real canonical identity, including restart/rotation overlap. Treat unpriced
    records as unknown, not zero. Separate priced subtotal from complete attributable total and
    disclose priced/unpriced/unlinked counts, windows, source observation time, retained-corpus
    coverage and truncation. A zero requires a positively observed complete corpus. Host/fleet
    scopes must not be duplicated into repository totals. Missing registry or materialization is
    distinct from disabled scheduling or measured no-cost work. Bound the materialized payload
    to 32 gardeners and 64 KiB and fail closed on overflow, preserving independently valid Analytics.
    Test the real production worker refresh and cached HTTP route across ledger rotation/restart,
    not just a pure fold with fabricated ports. Keep the optional DTO and generated client aligned.
    No raw ledger/config/tokens, telemetry export, policy/model approval change, gardener activation,
    operator disposition, service restart or measurement of fictional ROI. Help/harm requires the
    separately governed exact deployment and comparable measurement chain from W1-T4950.
    Research: https://opentelemetry.io/docs/concepts/context-propagation/ and
    https://opentelemetry.io/docs/specs/otel/trace/api/ explain explicit causal context/links;
    use those principles without introducing an external collector or treating correlation as trust.
  acceptance:
    - claim: "only the exact same-repo parent pass admits a priced child receipt"
      proof: 'unit test: W1-T8484: gardener spend requires the exact scoped parent pass'
    - claim: "unpriced invalid legacy interrupted and absent evidence never becomes zero"
      proof: 'unit test: W1-T8484: incomplete gardener spend remains unknown rather than zero'
    - claim: "duplicate and rotated receipts count once and host scopes are not multiplied"
      proof: 'unit test: W1-T8484: gardener spend survives rotation without duplicate repository cost'
    - claim: "the production worker refresh publishes a bounded optional cached spend DTO"
      proof: 'unit test: W1-T8484: real worker refresh serves gardener spend without request-time scans'
    - claim: "overflow or missing correlation preserves independently valid Analytics"
      proof: 'unit test: W1-T8484: missing or over-budget gardener spend preserves Analytics'
  falsifier: |
    Planned literal tests live in test/a-gardener-spend-read-requires-the-exact-parent-pass.test.ts.
