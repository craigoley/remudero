    then fail the first test. Remove receipt deduplication and replay an archive/current overlap:
    the total must then fail the rotation test. Delete production refresh wiring and the real
    cached HTTP test must fail, while a positive control still observes ordinary Analytics.
    Restore each fix and require real TAP summaries over verified physical test files. Name
    the committed SHA and prove every changed source has an instrumented source-mapped LCOV block.
