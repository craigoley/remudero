      proof: "unit test: test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts"
    - claim: "Pause, drain, boot and idle passes do not arm a ready code PR and each writes its own review-only stand-down, while an ordinary light pass still arms it"
      proof: "unit test: test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts"
    - claim: "On an interphase pass a moved live head, an operator hold, a standing risk refusal, a decideSweepArm refusal and an arm already in flight for the head from an overlapping pass each refuse without calling deps.arm, and each row names its own reason"
      proof: "unit test: test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts"
    - claim: "On an interphase pass a ready head with an unreadable compare is held with the ready PR distance reason, a head the ready-overlap selection picks or the refresh admission lists as waiting is held with a named reason, and no update-branch call is made"
      proof: "unit test: test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts"
    - claim: "On an interphase pass blocked-fixable and worker-needing conflicted heads stand down with the review-only text and no requeue or fix starts, and a mergeable head whose CodeQL gate rules a fix reaches neither dispatchFix nor escalate while its ruling row survives for the next ordinary pass"
      proof: "unit test: test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts"
  falsifier: |
    Pass the predicate as armAllowed but leave readyPrs empty on review-only passes: the unreadable-compare
    fixture arms and criterion 4 fails. Widen the predicate to every review-only scope: criterion 2 fails
    naming the scope. Remove the CodeQL stand-down: dispatchFix is called and criterion 5 fails. Flip
    reviewOnly false instead of adding the predicate: the fix and requeue fixtures start work and
    criterion 5 fails. Drop the guard on runLightPassReadyRefresh: the update-branch count in criterion 4
    is non-zero. At origin/main the test file does not exist, and criterion 1 fails once it does.
