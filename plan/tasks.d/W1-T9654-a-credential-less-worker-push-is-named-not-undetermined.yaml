- id: W1-T9654
  title: "A WORKER PUSH FROM A CREDENTIAL-LESS SANDBOX IS NAMED, NOT 'undetermined' — fallbackPushCause (src/run-task.ts) asks classifyGhFailure (src/lib/status.ts) for an auth failure, and that regex has no 'could not read Username', so a transcript that says exactly that falls through to cause 'undetermined'"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: high  # Rule 19: one concern — the class one fallback_push.cause row reports; the fallback push itself is unchanged
  band_meaning: span
  origin: "operator session 2026-10-15 after #11985: fallback_push.cause rows read 'undetermined' on transcripts that say 'could not read Username'"
  plan_refs: [W1-T2267, W1-T2522, W1-T2398]
  files:
    - src/run-task.ts
    - src/lib/status.ts
    - test/a-credential-less-worker-push-is-named.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    REPRODUCED at origin/main dea228455 (2026-10-15): fallbackPushCause({status: 2, stderr: ""}, "$ git push -u origin
    run-W1-T9047-1\nfatal: could not read Username for 'https://github.com': No such device or address") returns
    cause "undetermined". A transcript with "fatal: Authentication failed" returns "credential_expired".
    WHY, read at origin/main:
    - fallbackPushCause (src/run-task.ts, above scopeGuardOutOfScopeFiles) has four branches. The first is a probe that
      did not answer. The second is classifyGhFailure(null, workerEvidence) === "auth". The third is no `git push` in
      the transcript. Everything else falls to "undetermined".
    - classifyGhFailure (src/lib/status.ts) matches auth as /bad credentials|authentication|not logged in|gh auth
      login|401 unauthorized|unauthorized/i. git's refusal to prompt for a credential it does not have ("could not
      read Username", "could not read Password", "terminal prompts disabled") matches none of them. The transcript
      does contain `git push`, so the call lands in "undetermined".
    - The phrase is already known to the repo: CREDENTIAL_REFUSAL_RE (src/lib/drain.ts) and CREDENTIAL_REFUSAL
      (src/lib/run-child-contract.ts) both list "could not read Username". The fallback classifier is the one place
      that never learned it.
    WHAT IT MEANS: this is not an expired token. git found no credential helper at all and tried to prompt, so the
    worker pushed from its sandbox, which has no credential by design. That needs a different remedy from
    "credential_expired" (a short token margin, W1-T2398) and from "push_not_attempted", and an "undetermined" row
    hides it.
  design: |
    1. One named regex for git's no-credential prompt refusal, exported from src/lib/status.ts beside
       classifyGhFailure: GIT_NO_CREDENTIAL_PROMPT_RE = /could not read (Username|Password)|terminal prompts disabled/i.
    2. fallbackPushCause gains a fifth class, `push_without_credential`. It is checked before the auth branch,
       because that text means no credential reached git, not one that expired. Its detail names a worker push from a
       credential-less sandbox, and its evidence is the scrubbed, bounded transcript, as for every other class
       (fallbackPushEvidence). FallbackPushCause's union gains the member. The `credential_expired`,
       `push_not_attempted`, `probe_unreadable` and `undetermined` answers do not change for any other input.
    3. drain.ts's CREDENTIAL_REFUSAL_RE and run-child-contract.ts's CREDENTIAL_REFUSAL keep their behaviour, so they
       are not edited here. The new constant is the one the fallback classifier reads.
  acceptance:
    - claim: "a worker transcript that says 'could not read Username' after a git push is classed push_without_credential, not undetermined"
      proof: 'grep: test("W1-T9654: a could-not-read-Username transcript is classed push_without_credential" in test/a-credential-less-worker-push-is-named.test.ts'
    - claim: "an expired-credential transcript still classes credential_expired and a push-less transcript still classes push_not_attempted"
      proof: 'grep: test("W1-T9654: the other fallback push classes are unchanged" in test/a-credential-less-worker-push-is-named.test.ts'
  falsifier: |
    At origin/main, fallbackPushCause({status: 2, stderr: ""}, "git push origin x\nfatal: could not read Username for
    'https://github.com': No such device or address").cause is "undetermined", so the first test fails.
