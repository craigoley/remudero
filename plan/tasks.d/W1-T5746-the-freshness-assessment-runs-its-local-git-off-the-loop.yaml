- id: W1-T5746
  title: "THE FRESHNESS ASSESSMENT RUNS ITS LOCAL GIT OFF THE LOOP — after W1-T5282's awaited fetch, `checkServiceFreshnessAsync` still calls `assessFetchedService`, whose `rev-parse HEAD`, `rev-parse origin/main`, `status --porcelain -uno`, `diff --name-only` and `log --name-only` run through a synchronous `execFileSync` git runner on the daemon loop, the last sync work in the freshness read"
  repo: remudero
  depends_on: [W1-T5282]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium
  origin: "operator session 2026-10-04: found while building W1-T5282 (#9161)"
  plan_refs: [W1-T5282, W1-T5745, W1-T5689, W1-T2964, W1-T5672]
  files: [src/lib/self-sync.ts, test/the-freshness-assessment-runs-its-local-git-off-the-loop.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on #9161 (W1-T5282, open, head 92f4daef). `checkServiceFreshnessAsync`
    (src/lib/self-sync.ts) awaits the fetch, then returns
    `assessFetchedService(repoDir, serviceGit(repoDir, deps))`; `serviceGit` defaults to
    `execFileSync("git", ["-C", repoDir, ...args])`. `assessFetchedService` runs up to five git
    commands: `rev-parse HEAD`, `rev-parse origin/main`, `status --porcelain -uno`, and, when behind,
    `diff --name-only <head>..<origin>` and `log --format=... --name-only <head>..<origin>`. Each is
    local and usually fast, but `status` walks the work tree and the log grows with the gap, and they
    run on every freshness read the daemon makes. Batch-10's W1-T5689 (#9155, open) would baseline
    this site, not convert it.
  design: |
    Add an async assessment over the existing `asyncGit(repoDir)` runner with the same five commands,
    the same `-uno` alignment with deploy/entrypoint.sh, and the same unreadable-vs-empty
    distinction for diff and log (`diffUnreadable`, `logUnreadable`); `checkServiceFreshnessAsync`
    awaits it. The sync `checkServiceFreshness` keeps the sync assessment for CLI callers.
  acceptance:
    - claim: "an async freshness read of a behind checkout lets a timer fire while its status, diff and log commands are in flight and returns the same assessment as the sync read, unreadable diff included"
      proof: "unit test: test/the-freshness-assessment-runs-its-local-git-off-the-loop.test.ts"
  falsifier: |
    Keep `assessFetchedService` on the sync runner: the timer fires only after the assessment
    returns and the test fails.
