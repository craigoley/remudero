- id: W1-T3297
  title: "THE GITHUB TRANSPORT WATCHES THE LIMIT THAT DOES NOT FIRE AND IS BLIND TO THE ONE THAT DOES — `ghRateLimitRefusalFromReading` refuses only at `remaining === 0`, while every 403 this session arrived with the primary budget reading 5000/5000; and W1-T3275's cadence floor cannot see `rmd` verbs at all, because a hook matches `gh` in a command's text and `./bin/rmd review` contains none"
  repo: remudero
  depends_on: ["W1-T3275"]
