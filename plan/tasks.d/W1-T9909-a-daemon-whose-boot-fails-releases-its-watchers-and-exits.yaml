  title: "A DAEMON WHOSE BOOT FAILS RELEASES ITS WATCHERS AND EXITS — daemonCommand arms the GitHub-event wake's fs.watch, its signal handlers, the git credential socket, the read plane and the memory census before the try whose finally releases them, so a boot step that throws between them (W1-T9816's bootRunChildMode refuses an unreadable ledger union by design) leaves a live watcher that keeps the process from exiting, and the launcher never revives it; agent R1 hit a 10-minute hang in a daemonCommand test on 2026-10-16"
