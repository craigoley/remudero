      proof: "unit test: test/fleet-hold-shared.test.ts"
    - claim: "an unreachable origin holds rather than releasing"
      proof: "unit test: test/fleet-hold-shared.test.ts"
    - claim: "the local file alone still pauses a host that cannot reach origin"
      proof: "unit test: test/fleet-hold-shared.test.ts"
    - claim: "stop stays one-shot and never becomes a persistent hold"
      proof: "unit test: test/fleet-hold-shared.test.ts"
    - claim: "resume is still the only thing that clears a pause"
      proof: "unit test: test/fleet-hold-shared.test.ts"
  files: [src/lib/fleet-control.ts, src/run-task.ts, test/fleet-hold-shared.test.ts]
