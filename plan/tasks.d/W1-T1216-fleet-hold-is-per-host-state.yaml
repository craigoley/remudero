  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/fleet-hold-shared.test.ts`, declared in `files:`, so on this filing PR it resolves
    through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19'S SPAN. The hold decides whether the fleet spawns at
    all: a mistake either strands every host on a hold nobody can clear, or ignores an operator stop
    during the maintenance it was taken for. Claiming Rule 19 forced the band would be a false claim
    in the direction that flatters the filing.

    BOTH SOURCE FILES ARE DECLARED BECAUSE THE FLAG AND ITS ONLY READER ARE APART.
    `pauseFilePath`/`pauseDetail` live in `src/lib/fleet-control.ts`; the daemon's single
    `checkPause: () => pauseDetail(config.root)` wiring lives in `src/run-task.ts`. A shared read
    added at only one of those leaves the other resolving the old per-host answer.

    THE Q1 ANSWER IS SPLIT ON PURPOSE AND THE WEAKER HALF IS LABELLED AS WEAK. The structural half
    (5) is certain and comes from source. The empirical half (6) establishes a population and
    explicitly declines to attribute it, because the rows carry no host identity — and it records
    that the first count taken was 4,742 raw and 185 deduped, so a later reader is not misled by the
    figure that was wrong.

    THE SUBJECT SWEEP IS WHAT KEPT THIS FROM BEING A RE-FILE. Sweeping the hold's vocabulary across
    every shard on main surfaced W1-T1065, W1-T936, W1-T972 and W1-T483 — four tasks in the same
    multi-host family. Each was read before this was written; none owns the marker's LOCATION, and
    all four are cited rather than re-filed.
