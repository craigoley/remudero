  rationale: |
    Replaces W1-T3802 and W1-T3803 after the merged analytics plan was found to stop at pure
    adapters. The private console reads top-level GET /v1/analytics fields, so the live adapter
    and its one production composition seam must land together. Use only process-owned status and
    provider-routing snapshots; do not refresh, probe, read credentials, or mutate routing.
  design: |
    Add the live metrics adapter and call it from the production analytics route. Emit honest
    queue.pending and provider.allowance.remaining readings with independent state and as-of data;
    absent, stale, unreadable, unauthorized, not-probed, and not-collected remain distinct and no
    absent source becomes zero. Compose these fields at the top level consumed by the console.
    Preserve version refusal and existing compatibility fields. Do not collect historical queue or
    provider allowance trends in this task.
