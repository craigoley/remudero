    - claim: "the suite names the unused-generation refusal in a test title"
      proof: "grep: W1-T9704: a generation that sat unused past the bound after it was published is still refused in test/a-tick-read-is-aged-from-when-it-was-published.test.ts"
    - claim: "the read plane records when each read settled"
      proof: "grep: settledAtMs in src/lib/read-plane.ts"
  falsifier: |
