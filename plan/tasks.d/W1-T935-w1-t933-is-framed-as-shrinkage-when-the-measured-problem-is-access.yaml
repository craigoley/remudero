    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT (`git grep -cw`) AT 723b250.
    `groundClarifyRequest` scores `test/panel-skill-run.test.ts` 12 and `src/lib/panel-skill-run.ts` 5;
    `grounding_sources` scores `src/lib/panel-skill-run.ts` 12, `test/panel-skill-run.test.ts` 7,
    `test/skill.test.ts` 5. **`src/lib/skill.ts` IS DELIBERATELY NOT DECLARED**: W1-T933 already claims
