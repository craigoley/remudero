    **ID PROVENANCE, AND THE RESERVATION DID NOT TAKE.** Four surfaces swept at 723b250:
    `refs/rmd-id/*` max 934 over 41 refs; shard FILENAMES on origin/main max 934 over 315 files
    (control: W1-T933 appears exactly once); every OPEN PR's TITLE (2 open, max W1-T931 in #2013); and
    every OPEN PR's FILE LIST (#2017 1 file, #2013 5 files, no shard paths; extractor control returns
    933 on a synthetic shard path). Tree max across `plan/tasks.yaml` and every shard is 934, so 935.
    The `refs/rmd-id/W1-T935` push used a unique orphan commit over the EMPTY TREE carrying nonce
    `vm-3759-1786931731259082200`, the refspec variable braced, and the exit status captured into a
    variable rather than read through a pipe: it FAILED with exit 1, and the readback confirms the ref
    is ABSENT while the positive control `refs/rmd-id/W1-T934` reads 1 line. This host cannot write
    non-branch refs. **SO THIS ID RESTS ON THE FOUR-SURFACE SWEEP ALONE.**

    PROOF NOTES: all four proofs are NAME-FILTERED titles, never pure paths, each under 100 characters
    with no comma so `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them, and each
    matches ZERO files today against a control matching exactly one.

    **WHAT THIS RECORD DOES NOT CLAIM.** It does not claim W1-T933 is wrong to want a lookup — it is
    right, and the reachability finding it rests on re-derives cleanly. It does not claim workers cannot
    read files: every worker tool set carries `Grep` and `Glob`. And it does not claim the byte ceiling
    should rise; the ceiling constrains the SESSION's context, which finding (1) shows is a different
    context from the worker's."
