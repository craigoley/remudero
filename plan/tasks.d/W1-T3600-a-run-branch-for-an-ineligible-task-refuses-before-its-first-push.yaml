- id: W1-T3600
  title: "NOTHING REFUSES A PUSH TO A `run-<id>-*` BRANCH WHOSE TASK HAS UNMET DEPENDENCIES — the sweep already owns the predicate and closes the PR, but only after a full build, a review-ready body and every CI round have been spent on it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: blast-radius
  budget_usd: 5.00
  files:
    - scripts/run-branch-eligibility-check.mjs
    - test/a-run-branch-for-an-ineligible-task-refuses-before-its-first-push.test.ts
  origin: "operator-session#openweight-model-economics-2026-09-15"
  plan_refs: ["W1-T3598", "W1-T3597", "W1-T1048"]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED 2026-09-15, at full cost, in this repository.

    A session built W1-T3598 while its declared dependency W1-T3597 was still an open PR, opened
    #5603, drove it through CI, rebased it twice as the branch beneath it moved, and rewrote its
    body. At 06:51Z `remudero-fleet[bot]`'s sweep closed it: "task W1-T3598 is unmet dependency in
    the current plan: W1-T3597 — the plan resequenced after this PR was admitted, current dispatch
    will not rebuild it, and it cannot be left owning the task".

    THE SWEEP WAS RIGHT AND IS NOT THE DEFECT. `currentPlanIneligibilityReason` (src/lib/sweep.ts)
    is documented as "exactly mirroring `isDispatchEligible`'s own `unmetDependencies(...).length > 0`
    gate (never re-derived independently)", and closing a PR that cannot be left owning a task is
    correct. The defect is WHEN the refusal arrives: after everything that could be spent has been.

    THE RULE ALREADY EXISTS, AS PROSE THAT BINDS NOTHING. CLAUDE.md says "Before believing 'task X
    is next', confirm the frontier with the repo's own selector — `runnableCandidates(plan,
    isMerged, n)`". That file's own preamble states the case against leaving it there: "a rule
    stated ONLY here can be violated silently and repeatedly, which is why several of these bullets
    exist at all. When a rule below turns out to matter, the fix is to make something refuse it —
    file the task; do not sharpen the wording and call it closed." This is that task.

    THE DAEMON IS ALREADY PROTECTED; THE HAND ROUTE IS NOT. `runDaemon` selects through
    `runnableCandidates`, so a dispatched worker cannot be handed an ineligible task. A session
    working by hand consults nothing, and the first mechanical object that could disagree with it is
    a PR that already exists.

    WHAT THIS CAN AND CANNOT RECOVER, STATED PLAINLY RATHER THAN OVERSOLD. No gate can refuse what a
    hand session decides to build, because the decision precedes every artifact. The earliest
    mechanical moment is the FIRST PUSH of a `run-<taskId>-<epochMs>` branch. Refusing there does not
    recover the build; it bounds the loss to the build alone, instead of the build plus the PR, plus
    every CI round, plus each rebase the dependency's own movement forces, plus a sweep closure and
    the diagnosis it costs the next reader. In the observed case that was the larger half.
  design: |
    (i) ONE PREDICATE, A SECOND CALL SITE — NEVER A SECOND COPY. The check resolves the task id from
    the branch name with the existing extractor (`taskIdFromRunBranch`, status.ts — the one tested
    extractor for that shape) and asks `currentPlanIneligibilityReason(plan, task, isMerged)`, the
    same pure function the sweep uses. Re-deriving "is this runnable" independently is the failure
    this design exists to avoid: two copies drift, and the early one would then refuse work the late
    one admits, or worse the reverse.

    (ii) THE MERGED RESOLVER MUST CREDIT BOTH PATHS. A trailer-only merged set UNDER-CREDITS: in the
    observed session, W1-T3546 shipped in #5487 carrying `Remudero-Task: W1-T3546` in the PR BODY,
    but GitHub's squash commit never carried that trailer into main, so a `git log` trailer scan
    reported it unmerged and a hand-built frontier check wrongly called its dependents blocked.
    `alreadyMergedCreditFromProjection` (src/lib/drain.ts) names both `source: "trailer"` and
    `source: "head-branch"` for exactly this reason. A resolver that reads only one of them turns
    this gate into a generator of false refusals, which is worse than no gate at all.

    (iii) FAIL OPEN ON AN UNREADABLE SURFACE, NOT CLOSED. If the merged surface cannot be resolved
    (no network, no GitHub CLI — both routine in this repo's containers), the check reports UNKNOWN
    and does not refuse. This is the opposite of the cash cap's fail-closed stance and deliberately
    so: an unspendable resource is not at risk here, and a gate that blocks every push whenever a
    remote hiccups stops the fleet. `task-id-existence-check.mjs` already takes this posture —
    "an unreachable remote degrades an unresolved id to a stated UNKNOWN, never a hard failure" —
    and this check should match its neighbour rather than invent a second convention.

    (iv) A BRANCH THAT NAMES NO TASK IS NOT THIS CHECK'S BUSINESS. `chore/…`, `fix/…` and the
    synthetic orchestrator lanes carry no `run-<id>-` shape; they pass untouched.

    (v) OUT OF SCOPE: the sweep's own behaviour, which stays exactly as it is. Also out of scope is
    any attempt to make stacked PRs legitimate — permitting a PR to depend on an unmerged sibling is
    a real design question about the completion model, and answering it by weakening a closure rule
    inside a flake-adjacent task would be the wrong way to settle it.
  acceptance:
    - claim: "a first push to a run-branch whose task has an unmet dependency is refused, and the refusal names the specific unmet dependency rather than reporting a generic ineligibility"
      proof: "unit test: a run branch for a task with an unmet dependency refuses and names it"
    - claim: "a run-branch whose task has every dependency merged is admitted, so the check discriminates on eligibility rather than refusing every run branch"
      proof: "unit test: a run branch for a fully eligible task is admitted"
    - claim: "a task merged only by its head branch, with no trailer in the squash commit, is credited as merged, so the check cannot refuse a dependent on a dependency that actually shipped"
      proof: "unit test: a dependency merged by head branch alone still counts as merged"
    - claim: "an unreadable merged surface degrades to a stated unknown and admits the push rather than blocking every branch whenever the remote is unreachable"
      proof: "unit test: an unreadable merged surface degrades to unknown and does not refuse"
    - claim: "the check asks the sweep's own ineligibility predicate rather than carrying a second copy of the rule that could drift from it"
      proof: "grep: currentPlanIneligibilityReason in scripts/run-branch-eligibility-check.mjs"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF SOMETHING ALREADY REFUSES THIS. Re-run before building:
    `grep -rn 'currentPlanIneligibilityReason\|unmetDependencies' scripts/ hooks/ 2>/dev/null`. A hit
    outside `src/` means the early refusal already exists and this record's premise is gone.

    AND THE ADMIT ARM MUST BE ABLE TO FAIL. A check that refused every `run-` branch would pass any
    test that only asserts refusal. Assert an ELIGIBLE task is admitted, and confirm that arm reddens
    if the predicate is stubbed to always refuse — otherwise the gate is indistinguishable from a
    blanket block on the hand route.

    AND THE HEAD-BRANCH CREDIT ARM MUST USE A DEPENDENCY WITH NO TRAILER IN ITS COMMIT. Seeding a
    fixture whose merged dependency carries a trailer proves nothing about the path that actually
    broke: the arm has to fail if the resolver reads trailers only.

    AND THE UNKNOWN ARM MUST ADMIT, NOT REFUSE. A fail-closed degradation would block every push on
    any container without a reachable remote — this repo's own sandboxes included. If the test
    asserts a refusal there, the design has been inverted.

    AND DO NOT WEAKEN THE SWEEP. If the diff touches `src/lib/sweep.ts`'s closure behaviour, the task
    has been inverted: the sweep is correct, and the point is to arrive before it, not to disarm it.
  note: |
    FILED 2026-09-15 from the session that paid for it. The record deliberately does NOT propose
    making stacked PRs work, though that is the other defensible reading: the sweep's message says a
    task "cannot be left owning" a PR while its dependency is unmerged, and that is a completion-model
    invariant, not a bug to route around. Choosing between "refuse earlier" and "permit stacking" is
    an operator decision; this task takes only the half that is uncontroversial — that a refusal
    already owed should not arrive after every cost has been incurred.

    ID SWEEP: `rmd next-task-id --reserve` REFUSED in this container — it cannot enumerate open PRs
    without the GitHub CLI and declines to claim atomically while that surface is unreadable (the
    W1-T2316 reissue, #2965/#2970). Printing returned W1-T3599 as a floor across tasks.yaml, shards,
    remote plan and history. The open-PR surface was swept by hand instead: 5 open PRs (#5598, #5592,
    #5590, #5587, #5586), highest id claimed W1-T3596, none claiming W1-T3599 or W1-T3600. No
    `refs/rmd-id/` ref was hand-forged to work around the refusal, so if either id is contested these
    records renumber rather than the reservation being deleted.
