- id: W1-T2836
  title: "SERVE REFUSES AN APP-ONLY LAUNCH BEFORE IT READS THE APP CREDENTIALS — the static GH_TOKEN gate runs first, so the durable authentication path cannot bootstrap the console without an obsolete personal token"
  repo: remudero
  depends_on: [W1-T2834]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 15.00
  files: [deploy/serve-container.sh, test/console-token-refresh.test.ts]
  origin: "operator-session#serve-five-minute-auth-failure-2026-09-04"
  plan_refs: ["W1-T1024", "W1-T2269", "W1-T2311", "W1-T2553", "W1-T2778", "W1-T2834"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED LIVE 2026-09-04. The repaired Serve container needed the GitHub App key mounted, but
    `deploy/serve-container.sh --replace` refused before its App-capture section with `no GH_TOKEN
    in this shell and none capturable from remudero-daemon`. The daemon intentionally boots with
    an empty static token and mints its installation token inside the Node process, so Docker
    inspect cannot recover that runtime mutation. The operator therefore had to mint a temporary
    installation token outside Serve solely to satisfy a gate that ran before reading the durable
    credential Serve was about to use.

    This is already solved for the sibling daemon launcher. `deploy/recycle-container.sh` accepts
    either a non-empty static token OR complete App ids plus a host-readable key, while refusing
    when neither is usable. Serve implements the older half of that contract: static token first,
    unconditional refusal second, App capture third. The order makes App-only deployment
    impossible even though `src/lib/github-app.ts` starts an immediate in-process mint.
  design: |
    Capture a static token as before but defer the credential decision until after App ids and the
    key mount have been resolved. Accept either a non-empty GH_TOKEN or the complete, readable App
    credential. In the App-only case pass an explicitly empty GH_TOKEN by name and let the existing
    in-process refresher replace it. Keep the original fail-closed behavior when the App identity
    is partial or the key cannot be mounted. Never print or write any credential value.

    W1-T2834 owns how the host key is found when the sibling daemon is unavailable; this task
    depends on it and changes only what counts as sufficient authentication after resolution.
  acceptance:
    - claim: "Serve launches when no static GH_TOKEN exists but GH_APP_ID, GH_APP_INSTALLATION_ID, and a readable one-file private-key mount are all present"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "a missing or unreadable App key with no static token still refuses before docker run, so the credential gate remains fail closed"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "the App-only path passes no credential value in argv, logs, or disk and preserves the existing name-only Docker environment contract"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "a non-empty static GH_TOKEN keeps its existing precedence and launch behavior"
      proof: "unit test: test/console-token-refresh.test.ts"
  falsifier: |
    Close without implementation if the current Serve launcher accepts a complete App identity
    when both the invoking shell and daemon Config.Env carry no static token. The production dry
    run was executed in exactly that state and refused before section 4b, while the same App key
    was host-readable and successfully minted an installation token immediately afterward.
