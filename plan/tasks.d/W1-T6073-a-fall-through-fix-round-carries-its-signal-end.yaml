- id: W1-T6073
  title: "A FALL-THROUGH FIX ROUND CARRIES ITS SIGNAL END — when a fix worker ends by a signal but LEFT work, run-task.ts falls through to logFixDoneRow, which writes the worker's subtype and no `worker_exit`, so fixArmEvidence's exclusion of an unpushed signal round sees it only through the subtype string `error_exit_null`; since W1-T6027 a codex child that logged turn.failed or a torn last line and was then ended by a signal reads `error_codex` with `exit.kind: \"signal\"`, so its refused, unpushed round is scored refused, and #9675's comment blocks retiring the string check on 2026-10-20 until this row carries `worker_exit`"
  repo: remudero
  depends_on: [W1-T6027, W1-T6028]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — whether a signal-ended fix round's fix.done row names its signal end, and how the routing learner reads that name
  band_meaning: span
  origin: "operator session 2026-10-06: follow-up of #9675 (W1-T6028), with #9682 (W1-T6027)"
  plan_refs: [W1-T6028, W1-T6027, W1-T6032, W1-T5999, W1-T5535]
  files: [src/run-task.ts, src/lib/fix-routing-learner.ts, test/a-fall-through-fix-round-carries-its-signal-end.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-06 at origin/main a76291b3 (after #9675 and #9682).
    THE TWO fix.done WRITERS. In src/run-task.ts the W1-T5999 stand-down row is written only when
    `fixWorkerEndedBySignal(fixResult)` AND the worktree has no uncommitted changes AND no commits ahead of
    roundStartSha. That row carries `subtype: "signal_terminated"`, `worker_exit: "signal"`,
    `worker_exit_signal: fixResult.exit.signal`. A round that LEFT work falls through (W1-T6032) to the
    shared `logFixDoneRow` closure, whose fields are `...fixReceipt.ledgerFields(fixResult)`, round_id,
    fix_outcome, head_sha, pushed_head_sha, strike, round, session_id,
    `subtype: subtype ?? (harnessCommitRefused || fixAction.kind === "scope-needed" ? "commit_refused" : fixResult.subtype)`,
    worker_subtype, cost and turn fields. No `worker_exit`. `fixReceipt.ledgerFields` is `workerLedgerFields`
    (src/lib/worker.ts) plus join ids, and `workerLedgerFields` has no exit field either.
    THE READER. src/lib/fix-routing-learner.ts `endedBySignalWithNothingPushed`:
    `if (row.worker_exit === "signal") return true;` then
    `return (row.subtype === "error_exit_null" || row.worker_subtype === "error_exit_null") && !text(row.pushed_head_sha);`.
    Its own doc says: "The arm can go after 2026-10-20 only once that fall-through row also carries
    `worker_exit`." PR 9675 left that row outside its `files:`, and this task is the one that adds it.
    THE GAP, CONCRETELY. src/lib/worker-provider.ts builds
    `subtype: isError ? (parsed.isError ? parsed.subtype : "error_exit_" + exitCode) : "success"` (a template
    literal in the source) and leaves
    `subtype` untouched under a signal (W1-T6027 design (2)), so a stream that parsed turn.failed or a torn line
    reads `error_codex` while `exit` is `{kind: "signal"}`. That round, refused and unpushed, gets
    `subtype: "commit_refused", worker_subtype: "error_codex"` and the learner scores it
    FIX_ROUND_REWARD.refused, which is the scoring W1-T6028 removed for signal rounds. A Claude worker whose SDK
    throws after its envelope gets `exit` from `workerExitOfError` in collectWorkerResult's swallow arm but keeps
    the envelope's subtype (for example `success` or `error_during_execution`), so the string check misses it too.
    CORPUS (ledger union: 402 .gz rotations, 0 plain rotations, live ledger.ndjson; 2428 distinct fix.done
    rows): 11 unpushed `error_exit_null` rows (7 codex commit_refused, 4 commit_refused unattributed), 1 pushed
    `error_exit_null` row (2026-10-04T01:06:57Z, still scored as #9675 chose), 5 `error_codex` rows (newest
    2026-09-28) whose end cannot be told from the row, and 0 rows with `worker_exit` yet. The population this
    fixes is small today; the value is that the row says what ended the worker, so the subtype-string arm can be
    retired on 2026-10-20 as #9675 planned.
  design: |
    (1) src/run-task.ts logFixDoneRow: when `fixWorkerEndedBySignal(fixResult)`, add `worker_exit: "signal"` and
    `worker_exit_signal: fixResult.exit.signal`, the same two fields the W1-T5999 stand-down row writes. Keep
    `subtype` and `worker_subtype` as they are, so verdict rows and retro mappings do not move.
    (2) src/lib/fix-routing-learner.ts endedBySignalWithNothingPushed: a `worker_exit: "signal"` row is excluded
    only when it has no `pushed_head_sha`. Today that check returns true for any `worker_exit: "signal"` row,
    which was safe only because the stand-down row never pushes. Without this change, (1) would exclude a pushed
    fall-through round that #9675 chose to score. Leave the `error_exit_null` arm in place, and change its doc to
    say it can be removed once the newest pre-change row leaves FIX_ROUTING_READ_WINDOW_MS (14 days after this
    merges), now that every signal-ended row carries `worker_exit`.
    (3) Do not move the decision into workerLedgerFields here. That is the follow-up that makes every lane record
    its exit, and it depends on (2).
  acceptance:
    - claim: "a fix round whose worker ended by a signal and left work writes a fix.done row with worker_exit signal and the signal name, whatever the worker's subtype (error_codex included); the routing learner excludes that row when nothing was pushed and still scores it when a head was pushed; a round whose worker exited normally carries no worker_exit signal and is scored as today"
      proof: "unit test: test/a-fall-through-fix-round-carries-its-signal-end.test.ts"
  falsifier: |
    Drop the fields from logFixDoneRow: the fixture round (codex result `subtype: "error_codex"`,
    `exit: {kind: "signal", signal: "SIGTERM"}`, a dirty worktree, a refused commit) writes a fix.done row with no
    worker_exit, the learner scores it refused, and the test fails. Keep the fields but drop the pushed-head guard
    in endedBySignalWithNothingPushed: the pushed fixture row is excluded, signal_excluded reads 1 where 0 is
    expected, and the test fails.
