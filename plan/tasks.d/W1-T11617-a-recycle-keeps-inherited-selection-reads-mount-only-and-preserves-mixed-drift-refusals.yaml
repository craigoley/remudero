  design: |
    For normal inheritance, derive the host source and qualified launch packet only
    from the bounded Mounts reader and existing selected-registry file reader. Separate
    detection of selection variable presence from extraction of selection path, digest
    and file-binding values, which is needed only for explicit leave qualification.
    Preserve unrelated runtime environment retention and existing captured identity
    checks. Never derive the inherited host source from container environment values.
    Preserve invalid explicit selection and invalid/unreadable mount refusal before
    mutation. Do not print private paths, file bytes or variable values.
    Preserve or classify unrelated runtime drift before a selection-specific early
    refusal can hide it. Orphan/malformed selection plus an undeclared unrelated
    runtime variable retains the existing unrelated refusal and its remedy; only
    selection-only drift receives the selection-specific remedy. No refusal permits
    stop, replacement or a selection-success effect. Keep existing lock, STOP, PAUSE,
    drain, image qualification, identity recheck and rollback guards unchanged.
    Preserve PR #17180's approved leave contract: never discard a possible catalog,
    infer an alias from path equality, add an empty-value/off sentinel, or change the
    selector. A retained catalog that would reactivate selection still refuses.
    Add regression cases in the existing contained real-script Docker fixture. Keep
    every existing test input, assertion, expected value, timeout and skip unchanged.
    Before production edits, retain formal unchanged-source TAP showing the two
    failures and the passing catalog control. Show deletion falsifiers, the full
    affected fixture, source instrumentation and diff coverage, census membership,
    literal preflight PASS, actual author receipt and required hosted CI/review.
    Build only after this separate plan merges and fresh ownership, duplicate,
    dependency, merge-credit, selector and fleet checks permit the existing S4 owner.
  acceptance:
    - claim: "Normal selected-container inheritance derives its host source and qualified packet from Mounts and the file reader without extracting selected path, digest or file-binding values from captured Config.Env; invalid inputs refuse before mutation"
      proof: "grep: W1-T11617 criterion 1 in test/recycle-container.test.ts"
    - claim: "Mixed orphan or malformed selection and unrelated undeclared runtime drift preserves the unrelated refusal and remedy; only selection-only drift gets the scoped selection remedy, and all refusals prevent replacement and selection-success effects"
      proof: "grep: W1-T11617 criterion 2 in test/recycle-container.test.ts"
