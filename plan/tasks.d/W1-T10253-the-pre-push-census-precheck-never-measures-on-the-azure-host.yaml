  rationale: |
    OBSERVED 2026-10-20 on the Azure host (Ubuntu 24.04.4 LTS), read-only:
    - `command -v bwrap` prints nothing (exit 1); /usr/bin/bwrap is absent; `dpkg -l bubblewrap` finds no package.
    - The kernel would allow it: kernel.apparmor_restrict_unprivileged_userns = 0, kernel.unprivileged_userns_clone = 1,
      user.max_user_namespaces = 63829. So installing the package is the missing step, INFERRED from those settings
      and not yet tried.
    - 50 of the 52 `*push*.log` files in logs-8864 (mtimes 10-14..10-20) contain the bwrap line (the two that do not
      are doctrine pushes); for example
      logs-8864/10046-push.log: "pre-push: census-precheck — proof sandbox could not start: bwrap cannot start on this
      Linux host (bwrap is not installed); ran with a throwaway HOME and the env allowlist only: skipped, NOT passed
      (CI runs it)", and the same for ci-control-plane-precheck.
    - A SECOND BLOCKER beside bwrap, in 13 of the 52 push logs (memgate-push.log among them): "census-precheck: census
      suites NOT MEASURED - ... test/bound-kind-declared.test.ts: source-reader runtime calibration is unavailable in
      the managed-worktree proof sandbox".
    READ at origin/main a16d6d95f (symbols, not lines):
    - hooks/pre-push (W1-T6138): when the gate root is not the pushed tree, census suites run through
      src/lib/git-push.ts `createPrePushSandboxRunner`; a runner error prints "skipped, NOT passed (CI runs it)". The
      same arm throws "source-reader runtime calibration is unavailable in the managed-worktree proof sandbox" whenever
      a `readerRuntimePolicy` is passed, before it even builds the sandbox, so reader-census suites stay unmeasured at
      pre-push with or without bwrap.
    - src/lib/review.ts `probeProofSandbox` turns a bwrap spawn ENOENT into "bwrap cannot start on this Linux host (bwrap
      is not installed)".
    - So on this host preflight-author (which runs census suites natively under heavy-run.sh) is the only local census
      evidence a builder gets before CI.
    NOT COVERED ELSEWHERE: W1-T10042 and W1-T10044 (queued) concern the daemon CONTAINER's pre-open gate, whose bwrap is
    baked by deploy/Dockerfile; W1-T6138 (merged) made the host skip a named skip. No shard records the host's missing
    package or the reader-census sandbox refusal (swept origin/main plan/tasks.d and the plan trees of every open PR head,
    2026-10-20 11:40Z, for bwrap, census-precheck and "skipped, NOT passed").
