  note: |
    **NO PROOF IN THIS SHARD GREPS ITS OWN PATH.** All five criteria use the pure-path `unit test:`
    form naming `test/main-health-watch.test.ts`, declared in `files:`, which is the sanctioned
    forward reference: `check-proof` reads `verdict: fail` on it today because the file does not
    exist yet, and it resolves instead through `shardDeclaredFilesInDiff`. A `grep:` proof naming
    this shard would be out of scope by construction, since a `verify: auto` task cannot declare its
    own plan record in `files:`.

    **RISK BAND — BOTH READINGS RECORDED.** SPAN: `files:` crosses `src/` and `test/`, so Rule 19's
    span reading is `high`. **THE BAND EXEMPTS THE SIZING CHECK RATHER THAN CLEARING IT** —
    `sizingViolation` (`src/lib/task-linter.ts:197`) returns `undefined` outright at `risk: high`, so
    a clean lint is NOT evidence the span was vetted. BLAST RADIUS: narrower than the band suggests —
    one new read and one new observation inside the sweep, with no change to dispatch, the fix rung,
    or the merge path. The danger is entirely in Q3's asymmetry, which is why criteria 4 and 5 exist
    as a pair.

    **THE FALSIFIER, STATED SO IT CAN BE RUN.** Falsified if a trunk read reports green over a rollup
    whose checks skipped or concluded without executing — that is the vacuous-pass this task exists
    to refuse, and it would mean the watcher was built on the signal as it stands rather than on a
    signal made real first. Also falsified if an unrelated task's dispatch stops on a red trunk with
    no operator ruling recorded, or if any merge is reverted automatically.

    **MEASUREMENT PROVENANCE.** Clone checked NOT shallow (`--is-shallow-repository` false, 2082
    commits) BEFORE any history query. `src/run-task.ts` read through git objects for the reason
    given in the rationale. `resolveLedgerUnion` was run FIRST and returned `archiveCount 0,
    ok false` against this container's only `state/`; **ZERO ARCHIVES REFUSES RATHER THAN ANSWERING
    FROM THE LIVE FILE**, which holds roughly 0.3% of history, so NO LEDGER FIGURE IS QUOTED. Branch
    protection could not be read (403) and is labelled as the operator's reading. Check-run counts
    were taken with the pending count read alongside the failure count, and the rollup carried a
    duplicate `Analyze (javascript-typescript)` entry — the superseded-attempt shape — which is why
    names are deduped before any per-name conclusion is drawn.

    **ID PROVENANCE.** `refs/rmd-id/W1-T2204` reserved 2026-08-24T02:55:07Z, confirmed still held and
    with no shard under it. Eight surfaces swept, each control pre-qualified on its own surface, and
    **ONE SURFACE DISQUALIFIED AND RE-QUALIFIED RATHER THAN REPORTING THE TARGET'S ZERO**: the
    open-PR-title surface's `W1-T` control read 0, because neither open PR carries a task id in its
    title, so it was re-qualified on `chore(plan)` = 1. Reservation ref 1 against a namespace of 323;
    shard filenames on main 0 (control `W1-T2201` = 1); `- id:` lines 0 (control `W1-T2201` = 1);
    open-PR titles 0 (re-qualified control = 1); open-PR head branches 0 (control `run-*` = 86);
    open-PR file lists 0 across 2 of 2 heads enumerated and captured, control 4 file entries;
    anchored merged trailers `^Remudero-Task:\s*<id>\s*$` 0 (control `W1-T1286` = 1 across 98
    merged), NOTED AS UNDER-CREDITING because plan filings often carry no trailer, while a bare
    `--grep` over-credits; merged subjects 0 (control `(W1-T2201)` = 1 across 2082).

    **THE SUBJECT WAS SWEPT AS WELL AS THE ID.** Five shards matched `main.*health` and every one was
    read before filing: `W1-T1044` (sweep wall-clock bound) and `W1-T1274` (doctor's liveness corpus)
    are unrelated, and the other three matched only because `re`**`main`**`ing` sits near
    `daemon-`**`health`**`.ts` — a false-positive class worth naming. `trunk.*green`, `main is green`,
    `post-merge.*main` and `mainHealth` all read 0 against a control of 61 shards matching
    `fix rung`. The subject is not already filed.
