    - Age reset: blocker_since restarts each time a PR flips between blocked-fixable and refused-escalate at one head (#15133 read blocker_since 2026-10-29T23:30:08Z though its review had failed since 17:47Z). Measure the hold's age at the head, not blocker_age_ms.
    - Since filed: #15620 (2026-10-30T02:29Z) rebuilds an unanswered fix-lane escalation after HELD_ESCALATION_SLO_MS (6 h), and #15621 (14:45Z) added the redesign gardener. Replay their effect as the after window.
