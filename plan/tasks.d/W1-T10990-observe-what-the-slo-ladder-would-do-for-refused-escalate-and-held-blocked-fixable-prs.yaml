  rationale: |
    OBSERVED in the operator's 2026-10-29 recon (ledger read to 2026-10-29T19:28:34Z; 714 gz archives, 0 rotated plain files and the live file). Both strikeLadderDue and sloLadderDue in src/lib/sweep.ts require disposition === "blocked-ambiguous", so applyStrikeLadder never sees a PR in any other disposition.
    OBSERVED, 2026-10-22T19:29:02Z to 2026-10-29T19:29:02Z, distinct PRs with a sweep.disposed row older than 45 minutes: 6 in blocked-ambiguous, 24 in refused-escalate and 132 in blocked-fixable. For 2026-10-08T12Z to 2026-10-15T12Z the same counts were 20, 10 and 91.
    OBSERVED: in the recon window sweep.slo_rung was written twice, both rung refresh (#14793 at 2026-10-28T00:47:42.334Z, #15034 at 2026-10-28T07:58:04.699Z). All-time there are 48 refresh rows, 1 digest row and 0 rebuild rows. fix.progress_judged with site rebuild was written 0 times in the window and 6 times ever, the last at 2026-10-15T20:28:23.973Z. The last sweep.strike_ladder.requeued (the ladder's close) was 2026-10-15T20:28:23.973Z (#12051 and #12078).
    OBSERVED: none of the 6 blocked-ambiguous PRs was closed by the ladder. #13629, #14817 and #14824 merged; #14168 and #15034 were closed by hand by the operator; #14793 is open. #15034 took a refresh rung, then sat in refused-escalate ("fix needs design at this exact head") at its new head, where the ladder cannot reach it.
    INFERRED, not established: the stalled population moved out of blocked-ambiguous into refused-escalate and long-held blocked-fixable, so the ladder's entry gate, not its rung logic, keeps it idle. A recurrence count is a class signal, not a diagnosis (doctrine: recurrence is a class signal), so this task measures what a widened gate would do before any change. Some refused-escalate PRs are held for an operator decision, and some blocked-fixable PRs are hand-built operator branches that are not requeueable; the replay must show both rather than assume them away.
  falsifier: |
    If, with the widened gate, the replay closes no PR that the fleet did not later merge or that the operator did not close by hand, or if every PR it would close was already moving (a new head within the SLO after the close point), widening the gate would add churn without ending a stall, and the report recommends no change.
  note: |
    Reserved with rmd next-task-id from the operator checkout for this filing branch. Filed by operator decision 2026-10-29 as an observation proposal at priority normal (2).
    Read-only: no change to sloLadderDue, strikeLadderDue, decideSloRung, BLOCKER_SLO_MS or any cap is authorized by this task. Any change is a separate filing.
  design: |
    Added 2026-10-30 from the operator recon of ten review-failed PRs, for the builder of this replay:
