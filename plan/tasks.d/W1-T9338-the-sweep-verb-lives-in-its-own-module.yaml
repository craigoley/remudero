  rationale: |
    MEASURED on origin/main bbab8894f, 2026-10-13. src/run-task.ts is 57,478 lines. Of 329 open tasks (no
    `Remudero-Task:` trailer on main, and a shard status that is not merged, retired, done or blocked), 105 declare it
    in `files:`, including 24 of the 48 dependency-met auto tasks at priority <= 1.5. It was touched by 713 of 4,523
    main commits in 30 days. The refill pool never overlaps a running lane's files (W1-T8502), so one build holding it
    serializes every other run-task.ts task. The diagnosis saw it held from 20:12Z to 22:00Z on 2026-10-13.
    CHURN, from `git log --since=30.days -p --unified=0 -- src/run-task.ts`, attributing each hunk to its enclosing
    top-level declaration: buildSweepEffects, buildSweepHook, buildSweepLightHook and sweepCommand were changed by 87 of those 713 commits (36, 28, 15 and 8), with 784 changed lines. The split takes verbs in that churn order:
    W1-T9332 (run-task), W1-T9333 (daemon), W1-T9337 (fix), W1-T9338 (sweep) and W1-T9339 (review). This step moves buildSweepEffects (about 400 lines), buildSweepHook (about 320), buildSweepLightHook (about 300) and sweepCommand (about 140).
    THE SEAM. W1-T2893 made `main()` dispatch through src/cli/registry.ts, but left every handler body in
    run-task.ts. A moved handler still reaches many run-task.ts helpers. W1-T9331 forbids importing them (a cycle with
    HANDLERS). So this step passes them in through one host parameter, the repo's existing `*Deps` pattern, instead of
    moving the whole reachable graph at once.
    buildSweepHook and buildSweepLightHook are also reached by daemonCommand. If W1-T9333 has landed, its daemon module then imports them from ./sweep.js, a src/cli -> src/cli edge the rule allows, and drops them from its host.
    NOT IN SCOPE: re-pointing open shards that declare src/run-task.ts for this verb. A shard edit cannot ride a code
    PR (rule 15). The note names the plan-only follow-up.
  design: |
    1. Create src/cli/commands/sweep.ts. Move the four root implementations sweepCommand,
       buildSweepEffects, buildSweepHook and buildSweepLightHook into it. Keep each moved body
       verbatim apart from reading collaborators from the host, so the relocation exemption
       (W1-T2325, W1-T3138) reads moved lines as moved code rather than new code.
       Other top-level helpers remain at their existing physical locations behind the host
       seam in this step, even when all in-file references are from these four roots. Any
       subsequent helper extraction needs its own scoped task and relocation qualification;
       this task claims no helper-extraction credit.
    2. Any other run-task.ts symbol the moved code reaches arrives through one exported
       `SweepCommandHost` interface, taken as a parameter. src/lib symbols are imported
       directly. A collaborator that an earlier step already moved into src/cli/commands/ is imported from there. The
       module imports nothing from src/run-task.ts (W1-T9331's `cli-no-run-task`).
    3. src/run-task.ts imports the moved roots from "./cli/commands/sweep.js" under local aliases named `<root>FromModule`. It keeps every moved root that
       was exported, or that another run-task.ts symbol calls, as a thin function with the same name and signature. That
       function builds the host from run-task.ts's own symbols and delegates to the module. HANDLERS, every in-file
       caller, and every test that imports a root from src/run-task.ts stay unchanged.
    4. Unchanged: COMMANDS (scripts/rmd-help.mjs source-scans that array), and the verb's behaviour, ledger rows,
       stdout and exit codes. No test file other than the new one and the declared house-layout
       conservation companion is edited. The companion may add qualification/refusal controls only;
       every existing assertion stays unchanged. Existing behavioural tests stay untouched; fix the move,
       not those tests.
    5. The PR body reports the moved symbol count and line count, and the host's member count. A large host is
       acceptable. Never shrink it by importing run-task.ts.
    Tests go in the new file test/the-sweep-verb-lives-in-its-own-module.test.ts, with `test(` titles exactly as in the proofs below. They read the two source
    files as text, need no git and no network, and the verb's existing behavioural tests must pass untouched.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/the-sweep-verb-lives-in-its-own-module.test.ts"
    - claim: "sweepCommand is defined in the sweep module, and src/run-task.ts only delegates to it"
      proof: 'grep: test("W1-T9338: sweepCommand is defined in its module and src/run-task\.ts only delegates to it" in test/the-sweep-verb-lives-in-its-own-module.test.ts'
    - claim: "the sweep module imports nothing from src/run-task.ts"
      proof: 'grep: test("W1-T9338: the sweep module imports nothing from src/run-task\.ts" in test/the-sweep-verb-lives-in-its-own-module.test.ts'
    - claim: "the module declares the moved handler"
      proof: 'grep: export function buildSweepEffects( in src/cli/commands/sweep.ts'
    - claim: "src/run-task.ts calls the moved handler through the module"
      proof: 'grep: buildSweepEffectsFromModule( in src/run-task.ts'
  falsifier: |
    At base, src/cli/commands/sweep.ts does not exist and run-task.ts defines sweepCommand, buildSweepEffects, buildSweepHook, buildSweepLightHook itself, so both new tests fail. Give the module an
    import of "../../run-task.js" and the second test fails, as does W1-T9331's depcruise rule. Leave sweepCommand's body in
    run-task.ts beside the import and the first test fails.
  note: |
