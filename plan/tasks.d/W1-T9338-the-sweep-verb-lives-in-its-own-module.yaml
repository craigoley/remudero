    `dispatch.serialized` and W1-T8771 `dispatch.passed_over` rows whose contended path is src/run-task.ts, before and
    after. FOLLOW-UP (plan-only, after merge): re-point open shards whose work is in sweepCommand, buildSweepEffects, buildSweepHook, buildSweepLightHook from src/run-task.ts to
    src/cli/commands/sweep.ts.
