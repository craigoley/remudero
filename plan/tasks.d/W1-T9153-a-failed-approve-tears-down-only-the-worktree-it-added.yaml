      proof: "unit test: test/a-failed-approve-tears-down-only-the-worktree-it-added.test.ts"
    - claim: "an add at a path whose lock names another live pid refuses and leaves that lock and worktree in place"
      proof: 'grep: test("W1-T9153: an add at a live-held path refuses and keeps the holder" in test/a-failed-approve-tears-down-only-the-worktree-it-added.test.ts'
    - claim: "two approves of the same plan PR branch run concurrently and neither loses its cwd"
      proof: 'grep: test("W1-T9153: two concurrent approves on one path and neither loses its cwd" in test/a-failed-approve-tears-down-only-the-worktree-it-added.test.ts'
    - claim: "an approve whose add threw removes no worktree in its catch"
      proof: 'grep: test("W1-T9153: an approve whose add threw removes nothing" in test/a-failed-approve-tears-down-only-the-worktree-it-added.test.ts'
    - claim: "a dead holder's lock is still reclaimed and the add succeeds"
      proof: 'grep: test("W1-T9153: a dead holder lock is reclaimed and the add succeeds" in test/a-failed-approve-tears-down-only-the-worktree-it-added.test.ts'
  falsifier: |
    Restore the unconditional `writeRunLock` before `worktreeAdd`, and the first test fails: the holder's lock is
    replaced, then deleted by the failed add's `removeRunLock`. Set `worktreePath` before the add and tear it down in
    the catch, and the second test fails: the first approve's directory is gone when it next runs `git -C`, which is
    the 14:12:38Z "cannot change to" failure. Treat a dead pid's lock as live, and the fourth test fails.
  note: |
    EFFECT, measured from the core ledger after the merge sha deploys, with no numeric pass mark. Count approve.error
    and approve.id_reservation_failed rows whose text names "cannot change to", "Unable to read current working
