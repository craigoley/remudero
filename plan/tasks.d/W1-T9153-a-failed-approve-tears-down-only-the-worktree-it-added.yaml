- id: W1-T9153
  title: "A FAILED APPROVE TEARS DOWN ONLY THE WORKTREE IT ADDED — addLockedRunWorktree overwrites a live run's lock at a path it then fails to add, and the approve's catch force-removes that path, so a second approve deleted a first approve's live worktree four times on 2026-10-13 (14:10:55Z to 14:23:23Z) and the first then died with no cwd"
  repo: remudero
  depends_on: [W1-T9065]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: medium  # one concern: a worktree's teardown is gated on owning it; one file, src/run-task.ts (addLockedRunWorktree and approveCommand's two teardowns)
  origin: "found 2026-10-13 diagnosing approve failures after W1-T9065 (#11332) went live at the 13:06Z daemon boot; operator standing direction: fix at root, automated flow"
  plan_refs: [W1-T9065, W1-T5356, W1-T4437, W1-T311, W1-T208, W1-T1036]
  files:
