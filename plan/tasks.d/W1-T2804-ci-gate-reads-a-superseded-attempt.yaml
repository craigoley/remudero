      proof: "unit test: test/ci-gate-reads-a-superseded-attempt.test.ts"
    - claim: "a genuinely red required check still reads red, and a red NON-required context no longer votes at all, with the unreadable-protection degrade carried across from the sibling rather than re-decided"
      proof: "grep: genuine red still reds in test/ci-gate-reads-a-superseded-attempt.test.ts"
    - claim: "the latest-attempt rule and the required-context list are the shared implementations the two siblings already call, not a fourth hand-rolled filter that can drift from them"
      proof: "grep: shared rule not a fourth filter in test/ci-gate-reads-a-superseded-attempt.test.ts"
    - claim: "the gate reader and the ci-log evidence miner resolve their rollups for one sha within a single decision, and the sha they agreed on is observable in what that decision reports"
      proof: "grep: one sha per decision in test/ci-gate-reads-a-superseded-attempt.test.ts"
    - claim: "the falsifier records that a parser-only change is insufficient, so a later reader cannot mistake a dedupe fix for the closed concern"
      proof: "grep: pinning is not parsing in test/ci-gate-reads-a-superseded-attempt.test.ts"
  falsifier: |
    BOTH DIRECTIONS ON THE DEDUPE, AND THE SECOND MATTERS MORE. A dedupe that swallows real failures
    is worse than the bug it replaces: it turns a false red into a false GREEN, which merges.

      FORWARD  — three entries for one check name on one sha, started 13:48:42 CANCELLED,
                 13:49:20 FAILURE, 13:50:02 SUCCESS. The gate reads green.
      REVERSE  — the same three with the LATEST entry FAILURE. The gate reads red. And a single
                 genuine FAILURE with no siblings still reads red, so the dedupe cannot be satisfied
                 by an empty gate.
      BOUNDARY — an entry with NO `startedAt` sorting against one that has it, since
                 `dedupeRollupByLatestAttempt` defines that ordering and this reader now inherits it.

    BOTH DIRECTIONS ON THE REQUIRED-CONTEXT FILTER:
      a red NON-required context does not make the gate red; a red REQUIRED one does; and with the
      required list UNREADABLE (the 403 case, which is the common one on this fleet) every reported
      context counts again, fail-closed — never a green manufactured out of a missing list.

    THE PINNING FALSIFIER IS THE ONE THAT DECIDES WHETHER THIS TASK IS DONE. Construct a round in
    which the head sha MOVES between the gate read and the evidence read, and assert the two readers
    still answer about one commit. A test that only exercises a static head passes on the current
    code and proves nothing — it is exactly the vacuous shape this repo keeps meeting, and it would
    let the parser-only fix this shard's rationale warns about ship as complete.

    AND A CONTROL ON THE FALSIFIER ITSELF: delete the dedupe call and re-run. The forward case must
    go RED (`# fail` non-zero). A test that passes with the fix removed is measuring nothing.
