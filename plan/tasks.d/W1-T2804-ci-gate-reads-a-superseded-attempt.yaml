  rationale: |
    THE GAP, OBSERVED IN SOURCE AT HEAD 3bc1542.
    `ciGateFromRollup` (`src/run-task.ts`) is three lines of judgement over a raw rollup:

        const roll = (rollup ?? []).filter((c) => (c.name ?? c.context) !== REVIEW_CTX);
        const red  = roll.find((c) => isTerminalRed(String(c.conclusion ?? c.state ?? "")));
        if (red) return "red";

    It excludes `remudero-review` and nothing else. Both of its siblings do more, and both got that
    more from ONE task:
      - `checksStateFromRollup` (`src/lib/sweep.ts`) filters to branch protection's OWN required
        contexts and then calls `dedupeRollupByLatestAttempt` before judging.
      - `fetchCiFailures` (`src/run-task.ts`) calls `dedupeRollupByLatestAttempt` first and filters
        on the same shared `REQUIRED_CHECK_FAIL` set.
    W1-T457 added both for the #1728 defect and never reached this third call site. Its own doc
    states the property the third reader does not have: "a SUPERSEDED entry … must never permanently
    veto this function's answer."

    THE CONSEQUENCE OUTRANKS LATENCY, WHICH IS WHY THIS IS FILED AT ALL. A sha accumulates one
    rollup entry PER ATTEMPT, not one per check name — W1-T457 measured two `ci-gate` entries on one
    sha, `completed/cancelled` at 13:48:42 and `completed/success` at 13:50:02. `waitForCiGreen`
    tests `red` FIRST and returns immediately, so a stale CANCELLED attempt of a check whose later
    attempt on that same sha went SUCCESS makes the gate read RED on a PR that is green. That is not
    a slow gate; it is a merge blocked on false evidence, and the run that reads it books
    `blocked_ci` against a PR with nothing wrong. The operator measured the live shape:
    `acceptance-author-gate` carrying three attempts on one sha at edb9cfb3.

    THE MISSING REQUIRED-CONTEXT FILTER IS A SECOND, INDEPENDENT FALSE-RED SOURCE. Every reported
    check votes here, required or not, so a red NON-REQUIRED context — one GitHub itself would merge
    straight past — returns "red" from this gate. `checksStateFromRollup`'s own doc records the
    mirror-image incident this caused on the other reader (#170: a single SKIPPED non-required
    context held checksState at "pending" forever) and the fail-closed degrade it uses when branch
    protection is unreadable. That degrade is part of the contract and must be carried across, not
    reinvented.

    FOLDED IN, NOT FILED SEPARATELY: THE SHA-PINNING SKEW, BECAUSE FIXING THE PARSER WITHOUT IT
    LEAVES THE DEFECT.
      - `waitForCiGreen` reads the PR row, takes `mapRestPr(row).headRefOid`, and calls
        `restRollupFor(owner, repo, sha, read)` — REST `/commits/{sha}/check-runs`, PINNED to the sha
        it read at the top of that poll iteration.
      - the wired `deps.fetchCiFailures` reads `gh pr view --json statusCheckRollup` — GraphQL, at
        whatever the CURRENT head is when that call runs.
    NEITHER FUNCTION PINS ANYTHING ITSELF. Both take the rollup as an ARGUMENT, so the pinning lives
    entirely in their callers, and the two callers pin differently. The stand-down message the fix
    rung then prints —
      "the checks-red rollup and the ci-log evidence miner disagree, so there is nothing to hand a
       fix worker"
    — asserts a DISAGREEMENT, a word that presupposes a common subject. The two readers were never
    pinned to one. Pin them consistently and the honest message falls out of the code rather than
    having to be written; leave the pinning alone and any new message is still a claim about a
    subject that does not exist.

    THIS IS INSTANCE 1 OF THE SHAPE W1-T2793 NAMES, AND W1-T2793 IS NOT ITS OWNER. That shard's own
    rationale enumerates this CI pair as instance 1 and then verifies in source that a parser
    unification cannot reach it, precisely because both take the rollup as an argument. Its
    criterion 2 therefore requires only that the build "records whether the CI reader pair is fixed
    or explicitly out of scope" — an escape hatch, deliberately left open, for a pair whose files
    (`src/run-task.ts`) are not in its `files:` list at all. This shard is what closes it. The two
    are siblings, not duplicates, and neither blocks the other: they touch disjoint files.

    THE TRAP, STATED PLAINLY BECAUSE IT IS THE ONE THIS SHARD EXISTS TO PREVENT. A change that adds
    `dedupeRollupByLatestAttempt` and the required-context filter to `ciGateFromRollup` LOOKS LIKE
    THE FIX. It closes the superseded-attempt vote and the non-required false red, and it leaves the
    two readers still pinned to different shas — so they can still return contradictory answers
    about a PR, and the stand-down message still claims a disagreement about a subject they never
    shared. Unifying the parse without unifying the pinning is a partial fix wearing a complete
    one's clothes.
  design: |
    ONE CONCERN: two readers of one PR's check state must not be able to publish contradictory
    answers about it — which requires that they read the same ENTRIES (parse) about the same
    COMMIT (pinning). Both halves, or the concern is not closed.

    (i) THE PARSE. Give `ciGateFromRollup` the two rules its siblings already have, by CALLING the
    shared implementations, never by re-deriving them: `dedupeRollupByLatestAttempt` for the
    latest-attempt rule and branch protection's own required-context list for the vote. W1-T457's
    own design note is the standing instruction — "the fix is to give the sweep the rule the gate
    already has, not to invent one" — and a fourth hand-rolled filter here would relocate the drift
    rather than remove it.
    CARRY THE FAIL-CLOSED DEGRADE ACROSS UNCHANGED. `checksStateFromRollup` treats an unreadable
    required-context list as "every reported context counts", because an unreadable protection rule
    must never manufacture a false green. A container PAT gets 403 on the protection endpoint, so
    that branch is the COMMON case on this fleet, not an edge one. Read the degrade from the sibling;
    do not re-decide it.

    (ii) THE SIGNATURE. `requiredContexts` is APPENDED LAST with a default, so no positional caller
    shifts and every existing call site stays byte-identical until it is deliberately wired. That is
    the same shape `fetchCiFailures` used for `fetchAnnotations` and the preflight seam used for its
    runner — it is this repo's convention for adding a dependency to a live function.

    (iii) THE PINNING, WHICH IS THE HALF A PARSER FIX CANNOT REACH. Make the two readers agree on
    the commit they are answering about. The mechanism is the build's call, but the property is not:
    within one decision — one poll iteration, or one fix-rung round — the gate reader and the
    evidence miner must resolve their rollups for the SAME sha, and that sha must be OBSERVABLE in
    whatever the decision reports. Prefer threading the already-resolved sha over adding a second
    independent read; a second read is a second chance to skew.

    (iv) THE MESSAGE FALLS OUT, IT IS NOT WRITTEN. Once (iii) holds, "the two readers disagree" is
    either true of a genuinely shared subject — and should name that sha — or the code no longer
    reaches it. Do not hand-author a message asserting a shared subject that the pinning does not
    guarantee; that is the current defect with better prose.

    (v) DO NOT COLLAPSE `ciGateFromRollup` INTO `checksStateFromRollup`. They answer different
    questions and the difference is load-bearing: this one returns "green" only when a check named
    `ci` reports SUCCESS, while the sibling returns green when every REQUIRED context is OK. A
    collapse would silently change what `waitForCiGreen` waits for. Share the RULES; keep the
    verdicts distinct.

    (vi) NOT IN SCOPE, EACH WITH A REASON:
      - The acceptance-reader disagreement on #3840. That is W1-T2793, filed, with its own files and
        its own confirming measurement.
      - `REQUIRED_CHECK_FAIL` / `REQUIRED_CHECK_OK` membership. W1-T2274 last moved that vocabulary
        deliberately; this task consumes it and must not edit it.
      - The `remudero-review` exclusion. It is correct here for the reason `ciGateFromRollup`'s own
        doc gives (the #177 stale-status exhaustion) and stays exactly as it is.
      - Re-queueing a cancelled check. W1-T1223 owns that, and its `CancelledRequiredCheck` producer
        already reads the deduped rollup.
  acceptance:
