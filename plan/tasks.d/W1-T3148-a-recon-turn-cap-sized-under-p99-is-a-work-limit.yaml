      proof: "unit test: test/a-recon-turn-cap-sized-under-p99-is-a-work-limit.test.ts"
    - claim: "the implement turn cap is unchanged, and the table records the measurement showing it is already sized as a cliff"
      proof: "unit test: test/a-recon-turn-cap-sized-under-p99-is-a-work-limit.test.ts"
    - claim: "the table still loads and the Tier Invariant still holds after the edit"
      proof: "unit test: test/a-recon-turn-cap-sized-under-p99-is-a-work-limit.test.ts"
    - claim: "the recon degradation path is reachable as before, so a genuine runaway is still bounded"
      proof: "unit test: test/a-recon-turn-cap-sized-under-p99-is-a-work-limit.test.ts"
  falsifier: |
    CLOSE THIS TASK if the recon cap already clears its own tail: MEASURED 2026-09-08 over 680
    `recon.done` rows, p99 is 21 against a cap of 20, max 26, and 10 runs reach or exceed the cap.
    CLOSE IT ALSO if the wall has never fired: `zgrep` the union for `error_max_turns` — 8 raw rows,
    all one recon run at 21 turns, with `error_codex` at 255 on the identical query as the positive
    control.
    PROVE IT LOAD-BEARING: hold the fixture distribution fixed and assert the OLD cap fails the
    first criterion; a suite that passes at 20 and at the new value is asserting neither.
  note: |
    risk:medium: a data edit to one rung's caps, no code change, and the degradation path is
