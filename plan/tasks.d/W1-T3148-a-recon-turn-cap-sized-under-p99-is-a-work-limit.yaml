- id: W1-T3148
  title: "THE RECON TURN CAP IS THE ONE ROW THAT VIOLATES ITS OWN FILE'S RULING — `routes.recon.*.max_turns: 20` sits BELOW the rung's observed p99 of 21 (p50 6, max 26), 10 of 680 recon runs reach or exceed it, and the only `error_max_turns` wall the fleet has ever ledgered was a recon run at 21 turns that exhausted its retries and left `implement` to proceed with NO recon context at all"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: span
  budget_usd: 10.00
  files: [.remudero/mounts.yaml, test/a-recon-turn-cap-sized-under-p99-is-a-work-limit.test.ts]
  origin: "operator-directive#tripwires-are-for-runaways-2026-09-08"
