  retirement: closed
  attempts: 0
  rationale: |
    THIS TASK DOES NOT PROPOSE COALESCING. COALESCING ALREADY EXISTS, and saying otherwise would be
    the third brief in this project to scope a fix against a shipped mechanism.

    OBSERVED: `src/lib/github-event-wake.ts` carries `isHighFanoutGithubWake`, a `checkSettleMs`
    window (:480, :517, :546-556), `finishCheckBurst` (:523) and a `github.wake.check_settled`
    ledger row (:528) reporting `coalesced_edges`. `createDeliveryDedupStore` (:119) additionally
    dedupes by `X-GitHub-Delivery`. The machinery is present and it is working.

    WHAT IS WRONG IS THE WINDOW. MEASURED over the live ledger 2026-09-05..09-08:

      settle_ms in use                     10000   (one distinct value)
      github.wake.check_settled events       548
      coalesced edges total                 4164   (mean 7.60 per settle)
      settles that coalesced exactly 1 edge  237   (43% — no coalescing at all)
      accepted check_run wakes              6188
      sweep.pass rows                       1725   (each `enumerated: 1` — a targeted single-PR pass)

    A 7.6:1 mean reduction is real work. But 43% of windows close having absorbed nothing, which is
    the signature of a timer shorter than the phenomenon: this repo's CI emits `ci-shard (1/4)`
    through `(4/4)` and `coverage-shard (1/4)` through `(4/4)`, and those complete MINUTES apart,
    not within ten seconds. The window catches simultaneous edges and misses sequential ones.

    WHY THE VOLUME MATTERS. Each surviving wake becomes a targeted sweep that reads the board.
    Over three days the board gateway fetched 110.5 MiB, and this session repeatedly hit GitHub
    rate limiting — including the SECONDARY limit, under which `rmd next-task-id --reserve`
    refused and two `rmd retro` runs lost their merge-state join.

    THE HONEST UNCERTAINTY, STATED UP FRONT: this shard has NOT established that a longer window
    would have absorbed those 237 single-edge settles. It establishes only that the window is
    an order of magnitude shorter than the burst it names. Measuring the actual inter-edge interval
    per (PR, head_sha) is the first thing the builder must do, and it may show the right fix is a
    COMPLETION predicate rather than a longer timer.
  design: |
    (i) MEASURE FIRST, THEN CHOOSE. Derive the real distribution of inter-edge intervals per
    (PR, head_sha) from `github.wake.accepted` rows before touching a constant. A tuning task that
    guesses the new value has learned nothing the old value did not already assume.
    (ii) PREFER A COMPLETION PREDICATE TO A LONGER TIMER, if the data supports it: settle when the
    PR's REQUIRED check set is fully reported, falling back to a timer ceiling. A timer long enough
    to absorb a slow CI is also long enough to delay a fast one.
    (iii) THE CEILING STAYS BOUNDED. Whatever replaces 10 000 ms must have a hard upper bound: a
    settle that never fires is a wake that never wakes, which is a worse failure than a noisy one.
    (iv) `coalesced_edges` STAYS LEDGERED so the change can be measured after it ships — the same
    row that made this defect visible must remain the instrument that judges the fix.
  acceptance:
    - claim: "the settle window is derived from the measured inter-edge distribution rather than a fixed 10s constant, and the derivation is stated in the ledger row"
      proof: "unit test: test/a-settle-window-matches-the-burst-it-absorbs.test.ts"
    - claim: "a burst whose edges arrive minutes apart coalesces into one wake, where the 10s window produced one wake per edge"
      proof: "unit test: test/a-settle-window-matches-the-burst-it-absorbs.test.ts"
    - claim: "a hard ceiling bounds the settle, so no burst can defer a wake indefinitely"
      proof: "unit test: test/a-settle-window-matches-the-burst-it-absorbs.test.ts"
    - claim: "a single isolated edge still wakes promptly, so quiet PRs are not delayed by a window sized for busy ones"
      proof: "unit test: test/a-settle-window-matches-the-burst-it-absorbs.test.ts"
  falsifier: |
    CLOSE IF the window is already adaptive: read `checkSettleMs`'s call sites
    (src/lib/github-event-wake.ts:480, :517, :546-556) and the policy row that supplies it.
    MEASURED 2026-09-08: one distinct `settle_ms` value across all 548 settle rows — 10000.
    CLOSE ALSO IF the single-edge settles turn out to be genuinely isolated edges rather than
    truncated bursts. That is the measurement design (i) demands, and if it comes back "these were
    lone edges", this shard's premise is wrong and it should be closed saying so.
    DO NOT satisfy this by adding a second coalescer. One exists; a second would race it.
    DO NOT raise the constant without the measurement. A number chosen to make the 43% look better
    is a number that will need choosing again.
  note: |
    CLOSED 2026-09-08 BY ITS OWN FALSIFIER. That falsifier reads: "CLOSE ALSO IF the single-edge
    settles turn out to be genuinely isolated edges rather than truncated bursts ... if it comes
    back 'these were lone edges', this shard's premise is wrong and it should be closed saying so."
    It came back lone edges.

    THE PREMISE, MEASURED AND REFUTED. This shard asserted that "a CI run's shard edges arrive over
    MINUTES", so a 10 000 ms window was an order of magnitude too short. Over the 6 188 accepted
    `check_run` wakes in the 2026-09-05..09-08 ledger, the inter-edge gap distribution is:

      p10 0.06s · p25 0.25s · MEDIAN 0.86s · p75 3.39s · p90 10.22s · p99 74.83s

      <= 1s   3294 (53.2%)      <= 30s   5974 (96.6%)
      <= 5s   5016 (81.1%)      <= 60s   6099 (98.6%)
      <= 10s  5557 (89.8%)      <= 300s  6187 (100.0%)

    Edges arrive SUB-SECOND TO SECONDS apart, not minutes. The existing 10 000 ms window already
    spans 89.8% of them. The window is well matched to the burst; the 43% of settles that coalesce
    exactly one edge are bursts OF SIZE ONE, which is the shard's own closing condition.

    A LIMIT ON THAT MEASUREMENT, STATED RATHER THAN GLOSSED. It is the GLOBAL gap between
    consecutive check_run wakes, not the per-(PR, head_sha) gap design (i) asked for. That stronger
    measurement CANNOT BE MADE from the ledger as it stands: a `github.wake.accepted` row carries
    `delivery_id`, `event`, `action` and `repository` — and no PR number and no head sha. With
    several PRs active their edges interleave, so a per-PR gap is necessarily LARGER than the global
    one measured here. That direction weakens the refutation but does not reverse it: to overturn
    this closure a per-PR gap would have to be roughly an order of magnitude above the global
    median, and the p99 of 74.83s bounds how much room there is for that.

    ANYONE REVISITING THIS MUST FIRST add pr_number and head_sha to the wake row. Without them the
    measurement design (i) demands is not available, and a window retuned on the global figure
    would be tuned against the wrong distribution.

