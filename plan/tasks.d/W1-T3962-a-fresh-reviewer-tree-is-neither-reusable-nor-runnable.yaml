- id: W1-T3962
  title: "THE FRESH-REVIEWER RECOVERY TREE IS NEITHER REUSABLE NOR RUNNABLE — a daemon restart collides with its existing per-sha detached tree, while a newly created tree has no canonical node_modules link, so the stale-code fallback skips the review instead of posting it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 34.00
  risk: high
  band_meaning: blast-radius
  origin: human
  plan_refs: [W1-T3723, W1-T3955, W1-T2312, W1-T3378]
  files: [src/run-task.ts, test/a-stale-reviewer-reviews-from-a-fresh-tree.test.ts]
  rationale: |
    Observed on the core fleet host on 2026-09-21. The stale-reviewer recovery path created
    `/home/node/Remudero/worktrees/reviewer-db7a3bc6dca7` and later attempted to create it again
    after the daemon process restarted: `git worktree add --detach` refused because the path already
    existed. The newer `reviewer-9bf6933fbb88` tree was registered at the requested detached commit,
    but its `node_modules` path was absent. Its child therefore failed before review with
    `bin/rmd: ... node_modules/.bin/tsx: No such file or directory`.

    W1-T3723 correctly moved stale reviewer work into an origin/main-pinned worktree. W1-T3955
    subsequently corrected its executable-wrapper invocation, but neither task covered a
    per-process map surviving a daemon restart or the existing worker-worktree dependency discipline.
    The two remaining symptoms share one invariant:
    a fresh reviewer may run only from an exact, clean, dependency-ready detached tree at the
    requested source revision. A mismatched, dirty, absent, or unreadable tree is not evidence that
    it is safe to reuse and must preserve the existing fail-closed skip rather than execute a
    reviewer from unknown code.
  design: |
    Keep W1-T3723's stable per-sha path and its no-stale-verdict rule. Before creating a new tree,
    recognize a previously registered tree only after proving its detached HEAD equals the requested
    origin/main SHA and its checkout is clean; then reuse it. A collision that cannot meet that
    proof remains a named preparation failure and falls back to the ordinary stale-review skip.

    Whether the tree is newly added or safely reused, attach the canonical `node_modules` through
    the existing link helper and keep that generated link out of the worktree cleanliness surface.
    Never run npm in the reviewer worktree. The link's existing lockfile-mismatch observation remains
    diagnostic only: it must not cause this recovery path to silently use a different code revision.

    Do not delete a pre-existing reviewer worktree in this task. Deletion has different ownership
    and liveness requirements; safe reuse or a fail-closed skip is the boundary here.
  acceptance:
    - claim: "a restarted stale-review runner reuses only an exact clean detached worktree at the requested SHA and reaches the review child instead of colliding on its stable path"
      proof: "grep: W1-T3962 fresh reviewer restart reuse control in test/a-stale-reviewer-reviews-from-a-fresh-tree.test.ts"
    - claim: "a newly prepared or safely reused fresh-review tree links canonical dependencies before it spawns rmd review, without installing packages in that worktree"
      proof: "grep: W1-T3962 fresh reviewer dependency link control in test/a-stale-reviewer-reviews-from-a-fresh-tree.test.ts"
    - claim: "a mismatched, dirty, missing, or unreadable existing reviewer tree fails closed to the ordinary skip and never executes a review on an unproven checkout"
      proof: "grep: W1-T3962 fresh reviewer unproven tree control in test/a-stale-reviewer-reviews-from-a-fresh-tree.test.ts"
  falsifier: |
    Remove the exact-HEAD-and-clean reuse check: the stale-tree control must reach the child and
    fail. Remove the dependency-link call: the child-observation test must fail before it can claim
    a runnable fresh tree. Replace the fail-closed arm with an in-process call and the wrong-code
    control must fail. These controls distinguish safe recovery from merely suppressing the visible
    `already exists` error.
