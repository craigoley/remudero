- id: W1-T10269
  title: "A REVIEWER REGRESSION HEALS ITSELF — core measures its own review outcome mix against its history, and when a merge breaks the reviewer it keeps reviewing from origin/main with that merge reverted and opens the revert PR, instead of waiting for fix PRs that only the broken reviewer can pass"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high  # Rule 19: one concern — the review lane detects and routes around its own regression
  band_meaning: span
  budget_usd: 40.00
  priority: 1
  status: queued
  attempts: 0
  origin: "operator session 2026-10-20: reviewer outage after #12954 — 'let's solve root causes, not work around them'"
  plan_refs: [W1-T228, W1-T3723, W1-T3735, W1-T4469, W1-T6403, W1-T4387, W1-T4623, W1-T10270, W1-T10271]
  files:
    - src/lib/reviewer-health.ts
