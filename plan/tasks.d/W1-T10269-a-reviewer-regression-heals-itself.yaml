  falsifier: |
    Key the detector on daemon.boot head_sha alone. The fixture's onset rows come from a fresh
    tree at the offending sha while the boot head predates it, so the first test names the wrong
    code. Build the healed reviewer from the last healthy sha or an engine tree, as the obvious
    fallback would. W1-T228 then reads it stale and withholds, and the healed-reviewer test fails,
    as the live run from eb65ce2 did. Use a fixed withheld-rate threshold. A baseline that already
    carries some withholds then opens on noise, and the second test fails.
