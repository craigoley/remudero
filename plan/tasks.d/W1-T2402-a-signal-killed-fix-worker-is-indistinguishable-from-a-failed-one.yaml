  rationale: |
    THE ID. Eight surfaces, anchored `W1-T2402([^0-9]|$)` with a `[0-9]` class and never `\d`,
    anchored beside unanchored at each. Surface 1 reads 1 of 516 refs. Filenames 0 of 659; declared
