    THE OPEN SET WAS ENUMERATED FIRST (2 PRs) and controls drawn from it — W1-T2399 fires 1 on refs,
    filenames, ids and titles; W1-T2370 fires 1 on bodies; W1-T2397 fires 2 on trailers and 3 on
    subjects. Surface 6's control comes from the LIVE head namespace (W1-T1, 8 heads) because the
    open set carries no `run-*` head today — stated, not papered over. Anchor proved discriminating
