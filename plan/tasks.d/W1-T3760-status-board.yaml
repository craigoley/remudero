- id: W1-T3760
  title: "A CADENCE MARKER WHOSE WRITER IS NOT RUNNING READS AS A STALE RUNG — `last-seen` is written by `rmd serve`, which the same board reports as stopped two sections above, so a deliberately-down service is rendered as a cadence that failed"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: low
  origin: "deferred from W1-T3757's design (iii) — that task fixed the interval half of the same section and explicitly left this, because it needs a fourth marker state"
  plan_refs: [W1-T3757]
  files: [src/lib/status-board.ts]
  status: queued
  attempts: 0
  note: |
    reservation hand-off: unknown -> file-t3760-a-down-writer-is-not-a-stale-rung
  rationale: |
    MEASURED 2026-09-18 on the live board, in two sections of the SAME render:

      serve : not running; sensor: process table
      ...
      last-seen, stale (6d17h ago) — last-seen.json has not advanced in 161h against a
        1440-minute cadence (3 intervals allowed) — the rung is firing and failing, or not firing

    `last-seen.json` is written by `rmd serve` (lib/serve.ts). The board has already resolved that
    `serve` is not running, on the same pass, from the same deps — and then judges its marker as a
    cadence anyway.

    (1) THE CONSEQUENCE TEXT IS FALSE, NOT MERELY UNHELPFUL. "the rung is firing and failing, or
        not firing" names two possibilities and the true one is neither: there is no rung, and
        nothing is expected to write the file while the service is down. An operator who acts on
        that line goes looking for a broken cadence.

    (2) THE THREE STATES CANNOT EXPRESS IT. `fresh | stale | never` were chosen (by this table's
        own comment) because "three states, never two" — reporting a never-fired rung as stale
        sends someone hunting a regression in a rung with no history. The same reasoning applies
        once more: a marker whose writer is deliberately down is a fourth condition, and folding it
        into `stale` repeats exactly the error that comment was written to prevent.

    (3) IT IS HALF OF A SECTION THAT IS NOW OTHERWISE HONEST. W1-T3757 fixed the interval half —
        both stale rows were false alarms, and that one is resolved. This is the other. Two of nine
        rows permanently red for non-defects is what teaches a reader to skip the section; one is
        still one too many.
  design: |
    (i) A MARKER DECLARES ITS WRITER. A row may name the service that writes it. Rows that name
        none are judged exactly as they are today — this widens nothing for the other eight.

    (ii) A DOWN WRITER IS ITS OWN STATE, NOT A STALE RUNG. When the board has positively observed
         that the named writer is not running, the row says so and says nothing about cadence. The
         state is distinct from `never` (which means nothing ever wrote it) and from `stale`.

    (iii) UNSENSED IS NOT DOWN. The liveness section already distinguishes "the sensor answered and
          said not running" from "the sensor could not be asked" — W1-T3241 drew that line for the
          head-vs-origin comparison and it applies unchanged here. Only a POSITIVE observation of a
          stopped writer suppresses the cadence judgement; an unsensed writer is judged as today.

    NOT IN SCOPE: starting `serve`, and whether it should be running at all. This task is about
    what the board says, not about what the fleet runs.
  acceptance:
    - claim: "a marker whose named writer is positively observed stopped reports that, not a cadence verdict"
      proof: "grep: writer is not running in src/lib/status-board.ts"
    - claim: "an unsensed writer is judged exactly as it is today — only a positive stop suppresses the verdict"
      proof: "grep: unsensed is not stopped in src/lib/status-board.ts"
    - claim: "a row naming no writer keeps today's three states byte for byte"
      proof: "grep: names no writer in src/lib/status-board.ts"
  falsifier: |
    Suppress the cadence verdict whenever the writer is merely UNSENSED and the second assertion
    goes red — that is W1-T3241's distinction, and losing it would hide a real stopped rung on any
    host without a sensor. Fold the new state into `stale` and the first goes red. Apply the
    suppression to rows that name no writer and the third goes red, which is the blast radius this
    must not have. Start `serve` in a fixture to make the row green and every assertion still holds
    — the state, not the service, is what is under test.
