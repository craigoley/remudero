  rationale: |
    The impact map can name, per changed function, the suites that ran it on main. It is built every night and read only as
    shadow evidence, so the author still runs the whole module floor.
    READ at origin/main 6cf453f7a:
    - src/lib/affected-suites.ts:66-74 the W1-T6083 `impact` arm is "measured in shadow only". Its input is
      `AffectedSuitesInput.impact` (:92); `readAffectedSuitesInput` (:843) never sets it.
    - src/lib/test-impact-map.ts:941 `readImpactArmInput` has one caller, scripts/select-affected-suites.mjs:76, run by
      ci.yml:1995-1996 for the shadow record. :321 IMPACT_MAP_STALENESS_BOUND is 500 commits.
    - coverage-nightly.yml:206-222 builds and uploads the `test-impact-map` artifact (W1-T6107).
    MEASURED by the operator session from the shadow records: for a function edit the impact arm selects about 1% of the
    floor. The author's narrow set had a median of 843 suites over the over-capacity runs of the last four days.
    CHECKED for overlap: W1-T10740 (queued) is a lexer fix whose premise a worker reported as rotted. W1-T10435 (queued) is a
    parked research report. No open pull request files a task on this subject.
  design: |
    1. Reuse the bounded artifact fetch W1-T12505 adds, for the `test-impact-map` artifact.
    2. Pass `readImpactArmInput` into `readAffectedSuitesInput`'s `extra` as `impact` (add the field to that `extra` type).
    3. When `selection.impact` is present and `selection.impactFallback` is absent, set `receipt.selection = 'affected-impact'`
       and run the changed tests and `selection.impact` in the order of step 8, within the budget of step 9. Record
       `impactSha`, `impactDistance` and `floorLeftToCi: true`.
    4. Otherwise keep today's narrow-else-floor choice and record the reason.
    5. Update the doctrine sentence that says the preflight runs the module-level affected floor.
    THE ARM CANNOT BE ADOPTED AS BUILT (AMENDED 2026-11-18): on the three measured diffs it selected 3,809, 3,512 and
    4,676 (fallback) suites against floors of 4,046, 3,974 and 4,194, while only 153, 122 and 915 suites executed a
    changed function. Steps 6-7 fix the arm in src/lib/test-impact-map.ts before step 3 adopts it.
    6. NEW DECLARATIONS AND WRAPPER ROWS. In impactTouches (~:711-756) a hunk whose live new lines only add a top-level
       declaration is inert: base code never ran it, so it gives no function key and no moduleScope (its first callers'
       edits, or the changed tests, select its suites). In innermost (~:698-707) skip the V8 module-wrapper row (starts at
       line 1, spans the file), so a line is credited to the real function body that holds it.
    7. LINE TRANSLATION. Today fallbackReason (~:852-866) falls back whenever a changed code file also changed after the
       map's sha. Instead, read `git diff -U0 <mapSha> <base> -- <file>` and map each base line into the map's
       coordinates; fall back, naming the file, only for a hunk that overlaps a line changed since the map. (The other
       remedy, building the map from CI's coverage shards on every main push, edits .github/workflows/ and parks an
       automated task, so it is not in this record; file it as an operator build if step 7 is not enough.)
    8. RELEVANCE ORDER. Replace the cheapest-first fill (fittingSubset, scripts/preflight-author.mjs:150-170) for this arm:
       tier 0 the changed tests, tier 1 the suites that executed a changed function body, tier 2 the path readers; within
       a tier, the suite with the higher expected catch value per measured second first. Every suite not run is listed
       in the receipt as left to CI with its reason (over budget, map-blind, path-reader only).
    9. DERIVED BUDGET. Replace AUTHOR_WALL_SHARE = 1/16 (scripts/preflight-author.mjs:46, used at :77) for this arm: a
       suite is worth running locally while its expected catch value (its own red rate over its recorded runs, times the
       measured CI-red PR-minutes a red costs when CI finds it) exceeds its measured cost (its manifest runtime plus its
       share of the measured lock-queue wait). A suite with no history takes the fleet-wide per-suite red rate's upper
       Wilson bound. The receipt names each input, its value and its source.
    INVARIANT every-executing-suite-runs-or-is-named: every suite main's coverage saw execute a changed function body runs locally or is listed as left to CI with its reason.
    NOT IN SCOPE: promoting the impact arm in CI; changing IMPACT_MAP_STALENESS_BOUND; building the map on every main
    push (a workflow change); the import-graph floor and the narrow arm (W1-T12507, W1-T11916).
  falsifier: |
    Use the impact arm when `impactFallback` is set and criterion 3 must fail. Drop the changed tests from the set and criterion 2
    must fail. Count a new top-level declaration as a module-scope edit and criterion 5 must fail (the selection grows to
    the module's loaders). Let innermost return the wrapper row and criterion 6 must fail. Fall back whenever the file
    changed since the map and criterion 7 must fail. Order cheapest-first and criterion 8 must fail: a slow suite that
    executed the changed function is skipped while cheap path readers run. Restore AUTHOR_WALL_SHARE and criterion 9 must
    fail. Drop an over-budget executing suite from the receipt and criterion 10 must fail. Restore and require all ten
    to pass.
