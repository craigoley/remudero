  title: "A ROUTER THAT OPTIMISES `cost_usd` IS OPTIMISING A NUMBER §9 ALREADY CALLS NOTIONAL — on subscription the dollars are an API-equivalent price nobody is billed, while the resource that actually runs out is the subscription window, and with two providers there are now two independent windows to spend"
