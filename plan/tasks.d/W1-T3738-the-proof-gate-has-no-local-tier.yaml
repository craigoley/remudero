- id: W1-T3738
  title: "THE PROOF GATE IS THE ONE CI REFUSAL A BUILDER CANNOT SEE COMING — `check-proof --base` answers it offline in seconds from the head commit's own trailer, and no local tier runs it, so `executed_stale` is discovered twenty minutes later every time"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED ACROSS ONE SESSION, 2026-09-17. `proof-discrimination` refused, on `executed_stale`
    alone: #5897 (2 proofs), #5852 (4), #5927 (3), #5928 (1), plus #5895 and #5898. Every one cost
    a full CI round — a code pull request's cycle measured 20.3 min.

    (1) THE ANSWER IS ALREADY A LOCAL COMMAND, AND IT IS FAST. `rmd check-proof "<proof>" --base
        <sha>` runs the reviewer's own parser and executor against a real merge-base worktree and
        prints `discrimination: executed_stale` or `discriminates`. Used interactively during this
        session it answered in seconds, and it is what I used to FIX every one of the refusals
        above — after CI had already spent the twenty minutes.

    (2) NOTHING NEEDS THE NETWORK. `proof-discrimination-gate.mjs` reads criteria through
        `resolvePlanCriteriaAtHead(body, root, planRelPath, headSha)`, and the body it needs is the
        `Remudero-Task:` trailer — which the HEAD COMMIT already carries on every build branch. So
        a local tier resolves the same criteria from the same plan at the same sha, with no GitHub
        read and no pull request in existence yet.

    (3) THE CLASS IS NOT BUILDER SLOPPINESS, WHICH IS WHY A RULE WILL NOT FIX IT. The proofs that
        graded stale were CONTROL assertions — "a build diff is still refused", "absent behaves
        like an explicit build", "the push and schedule triggers carry no filter". Every one is
        true on the merge base BY DESIGN; that is what makes it a control. Recognising that a
        control needs a corpus control of its own is a judgement made per-proof, and the only
        reliable way to make it is to RUN the thing.

    (4) IT BIT THE BEST-INFORMED AUTHOR IN THE REPO. I wrote W1-T3729 — the task about
        `satisfied_by` and stale proofs — and then shipped three stale control proofs on W1-T3730
        the same afternoon. If reading about it were sufficient, that would not have happened.

    (5) THE FAST TIER CANNOT ABSORB IT. W1-T3737 made the 29-second fast gate the default
        precisely because it is 29 seconds; each proof here spawns a real base worktree and a real
        test, so a four-criterion task costs on the order of a minute. This is its own tier.
  design: |
    (i) RESOLVE THE SAME WAY THE GATE DOES, FROM THE HEAD COMMIT. `resolvePlanCriteriaAtHead` with
        the head commit's message as the body, falling back to its `## Acceptance` block exactly as
        `criteriaForReview` does. One resolution path, so the local tier and the gate cannot
        disagree about WHICH criteria a branch is judged on — the disagreement would be worse than
        no tier at all.

    (ii) EXECUTE THROUGH `check-proof`, NEVER A SECOND EXECUTOR. The verb already owns parsing,
         the base worktree, the timeout and the five exit codes. This tier spawns it per criterion
         and reads `CHECK_PROOF_EXIT.executedStale` — the same constant the gate reads.

    (iii) OPT-IN, AND NAMED IN THE DEFAULT RUN'S OWN COVERAGE LINE. W1-T3737 made a passing
          preflight name the tiers it did not run; this tier joins that list, so a builder who has
          not run it is told so on every green rather than having to know it exists.

    (iv) NO TRAILER, NO OPINION. A branch whose head commit resolves no criteria reports that it
         found none and passes — the same "no predicate ⇒ no opinion" contract every injected
         check in this repo keeps. A tier that invented a refusal from an unresolvable branch would
         be refused by its own authors within a day.

    NOT IN SCOPE: `acceptance-author-gate`, the other payload-driven gate. It needs the PULL
    REQUEST body rather than the commit's, so it needs either a network read or a `--body-file`,
    and that is a different measurement.
  acceptance:
    - claim: "a proof that passes at head and at the merge base is reported locally, before a push, naming the proof"
      proof: "unit test: a stale proof is named locally"
    - claim: "a proof that discriminates is not reported, so the tier refuses only what the gate refuses"
      proof: "unit test: a discriminating proof is not reported"
    - claim: "a branch resolving no criteria says so and passes, rather than inventing a refusal"
      proof: "unit test: no resolvable criteria is not a refusal"
    - claim: "the tier is named among the checks a passing preflight did not run, so a builder who skipped it is told"
      proof: "unit test: the passing summary names the proof tier when it did not run"
  falsifier: |
    Re-derive criteria from the plan directly instead of through `resolvePlanCriteriaAtHead` and
    the first assertion still passes while the tier silently judges a different set than the gate
    does — so the test drives the resolver, not a hand-built criteria list. Read any non-zero exit
    as stale and the second goes red: `check-proof` returns 3 for no-match and 4 for exec_error,
    and neither is a finding. Refuse a branch with no resolvable criteria and the third goes red.
    Add the tier without naming it in the coverage line and the fourth goes red, which is the
    W1-T3737 lesson: a green that hides what it skipped is read as "CI will pass".
  risk: medium
  band_meaning: blast-radius
  origin: human
