- id: W1-T13173
  title: "The read-model oracle sizes each slice from a rate that has a floor, so a slice whose cost is a fixed archive read cannot shrink the cycle to one row a slice and run the oracle child out of its 1 GB heap"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: low # one number in the slice-size rule; the comparison, the heal and the escalation are unchanged
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T10290
  files:
    - src/lib/read-model-consistency.ts
    - test/read-model-consistency.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "After twelve slices that each compared 1 row in 60,000 ms, nextOracleSlice still sizes the next slice at ORACLE_MIN_ROWS_PER_MS x the budget rows (12,500 at the 2,500 ms default), not 1 row"
      proof: "grep: W1-T13173 criterion 1 in test/read-model-consistency.test.ts"
    - claim: "Twelve retryOracleSlice calls (twelve dead oracle children) halve the rate down to the floor and no further, and a cursor stored before this change with rowsPerMs 0.0001 is read at the floor"
      proof: "grep: W1-T13173 criterion 2 in test/read-model-consistency.test.ts"
    - claim: "invariant:measured-rate-above-floor-unchanged — a measured rate above the floor still moves the next slice halfway to it, and a slice that measured nothing keeps the rate (the existing sizing test passes unchanged)"
      kind: guard
      proof: "grep: W1-T13173 criterion 3 in test/read-model-consistency.test.ts"
  rationale: |
    WHY: the serve container's read-model oracle child for the core instance runs out of its 1 GB heap
    (READ_MODEL_ORACLE_HEAP_MB) about every 2 h, and between deaths every check costs about a minute of a
    core and 1.4 GB of memory for almost no work, on a host that is short of CPU while the Console's reads
    time out.
    MEASURED, core ledger on the Azure host (~/rmd-state2/state), 2026-11-16 03:25Z to 13:51Z,
    read_model.consistency and read_model.oracle_child_exited rows for instance core:
    - 25 oracle runs. Every successful one compared 1 to 3 rows ("compared":1..3) from a window a few
      milliseconds wide on 2026-10-04 (for example 2026-10-04T07:23:38.016Z..07:23:38.018Z), read 13 to 18
      archives ("files":{"read":13..18}), took 42 to 72 s (elapsed_ms) and peaked at 1.37 to 1.39 GB RSS
      (child_max_rss_bytes).
    - 5 runs died with SIGABRT (05:02, 06:27, 10:33, 13:07, 13:50Z); docker logs remudero-serve show
      "FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory" for each.
    - The cycle moved about 14 s of 2026-10-04 in 10 hours.
    READ at origin/main (ef8b74910), src/lib/read-model-consistency.ts:
    - nextOracleSlice sizes a slice as targetRows = rate x budgetMs, and advanceOracleSlice moves the rate
      halfway to rows / elapsed ms. A slice's elapsed time is mostly a fixed cost: compareSnapshot reads and
      gunzips every archive the window may touch, whatever its row count. So 1 row in 60,000 ms gives a
      measured rate near 0, the next slice targets 1 row, and the rate never recovers.
    - retryOracleSlice halves the rate after each dead child, with no floor, so each OOM shrinks it again.
      The death is not caused by the slice's rows (it holds 1), so halving cannot help.
  design: |
    INVARIANT measured-rate-above-floor-unchanged: above the floor, the sizing rule is exactly as before.
    1. Add `export const ORACLE_MIN_ROWS_PER_MS = 5` beside ORACLE_SEED_ROWS_PER_MS, with a comment that
       gives the measurement above. At the 2,500 ms budget the floor is 12,500 rows, below the 66k-160k rows
       a day slice held at about 165 MB (the comment on consistencyCheckDue), so a floor slice stays small.
    2. Apply the floor in three places: the rate nextOracleSlice reads from the stored cursor (so a cursor
       that collapsed before this change is read at the floor), the rate advanceOracleSlice stores, and the
       halved rate retryOracleSlice stores.
    3. No change to compareWindow, runOnce, the heap ceiling, the window or the schedule.
    4. Tests in test/read-model-consistency.test.ts beside "the next oracle slice is sized from the rate the
       last one measured", on the same projected() fixture: criterion 1 advances twelve slices with
       { rows: 1, ms: 60_000 }; criterion 2 calls retryOracleSlice twelve times and then stores a cursor with
       rowsPerMs 0.0001 directly in meta; criterion 3 renames the existing sizing test's title to carry its
       marker, with no change to its assertions.
  falsifier: |
    Remove the floor from advanceOracleSlice: criterion 1 fails (target 1 row). Remove it from
    retryOracleSlice or from the stored-rate read in nextOracleSlice: criterion 2 fails. Set the floor above
    the 17.5 rows/ms the existing sizing test reaches: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794838096000 with ~/rmd-work/bin/reserve-id.sh.
    Proof that counts in production: after the deploy, core read_model.consistency rows compare at least
    12,500 rows or finish their cycle, the cycle leaves 2026-10-04 within an hour, and no
    read_model.oracle_child_exited row has outcome died for 24 h.
