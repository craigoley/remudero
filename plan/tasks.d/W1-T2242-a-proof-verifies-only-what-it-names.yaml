  note: |
    RISK BAND — BOTH READINGS, BECAUSE THE BAND EXEMPTS THE CHECK RATHER THAN CLEARING IT.
    `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` at `risk: high`, so a `high`
    band means the span was NEVER SCORED rather than scored and found narrow. The declared write
    surface was measured at `risk: medium` first and that reading is recorded in the PR. The real
    blast radius is high independently of Rule 19: this changes what a PROOF MEANS, and a fourth
    arm wired wrong would let a criterion pass on evidence nobody approved.

    THE PROOFS NAME A PATH THAT DOES NOT YET EXIST, WHICH IS THE SANCTIONED FORWARD REFERENCE.
    `test/fixture-proof-dialect.test.ts` is declared in `files:` and is verified through
    `shardDeclaredFilesInDiff` rather than through `check-proof`, which reads `verdict: fail` on a
    path that has not been created. THE FALSIFIER DISCRIMINATES: criterion 2 fails for a fixture
    that matches at both ends, which is the exact shape criterion 1 would otherwise pass on, so the
    pair cannot both hold for a fixture that proves nothing.

    THE ID WAS RESERVED BY THE OPERATOR AND VERIFIED **UNUSED**, NOT VERIFIED MINE. Its anchor
