  rationale: |
    WHY: on 2026-11-18 the red main (18:47Z to 21:22Z, caused by #19469) was detected but never correctly
    handled, and PR fix rounds chased it, because every reader named the wrong failing file.
    THE RED (main CI run 44373577634, job 135054821069): test/infra/gate-probe-native-evidence.test.ts failed
    ("not ok 832", location ...gate-probe-native-evidence.test.ts:1:2770). Its assertion message quotes the
    TAP of the child it runs, which holds "not ok 1 - W1-T2791 (acceptance 1) ..." and
    "location: '.../test/a-gate-run-leaves-the-tracked-tree-clean.test.ts:1:3191'", both as a quoted string
    and again in the actual: block. The clean-tree test did not fail on its own.
    WHAT READ THE QUOTED FILE (core ledger, ~/rmd-state2/state, 2026-11-18):
    - test-with-retry: "FLAKE-RETRY-FILES: retrying 2 failed file(s) — test/a-gate-run-leaves-the-tracked-
      tree-clean.test.ts, test/infra/gate-probe-native-evidence.test.ts". parseFailingTestFiles matches any
      location: text between a column-0 not ok and the next "..." line, quoted lines included.
    - main health: every main.health.head_reproduction row that ran a file (10 of 11) and every
      main.repair.bisecting / probe_concluded local-test row ran only test/a-gate-run-leaves-the-tracked-tree-clean.test.ts. Every run ended
      unrunnable (LoopBoundedChildTimeout after 183 to 220 s; the test is slow on the loaded host). So head
      reproduction never confirmed the red, local bisection was inconclusive, and the rung fell back to CI
      probes that took 25 to 47 minutes each (113 queued jobs, 0 idle runners). It located the culprit at
      20:56Z and opened its fix PR #19502 at 21:16Z, 2 h 29 min after the merge.
    - base red on PRs: sweep.base_reproduction for #19459 and #19479 read both files. The evidence test
      failed at main in 7 to 18 s; the clean-tree test was unrunnable. decideBaseReproduction needs every file
      to fail, so the verdict was partial, not reproduced, 5 times from 20:19Z to 21:14Z. Fix rounds ran on
      the unrelated PRs: #19479's round at 20:38Z changed gate-probe-native-evidence.test.ts; #19459's round at
      21:14Z ran against the same red and made no diff.
    READ at origin/main 079539063: src/lib/base-reproduction.ts failingTestFilesFromCiFailures adds every
    test path that appears anywhere in the failure name or log tail. baseReproductionFiles,
    main-health-rung.ts (head reproduction, locateOffender, proveCulprit) and sweep.ts (strike cause key) read
