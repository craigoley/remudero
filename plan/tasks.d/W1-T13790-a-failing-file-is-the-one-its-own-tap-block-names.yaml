    WHAT THE RUNG WOULD HAVE DONE with the right file: the evidence test runs in about 12 s. Head reproduction
    would have confirmed the red, local bisection would have read 22cb974e3 (pass) and 73fef8b1b (#19469,
    fail) and located #19469 within minutes, and base reproduction would have read reproduced on every PR, so
    their fix rounds would not have chased main's red.
  design: |
    INVARIANT quoted-is-not-failed: a test file counts as failing only when a column-0 TAP failure names it in
    its own diagnostic block, or, for text with no TAP failure, when the text names it as today.
    1. One rule for both parsers. Strip an optional CI timestamp prefix (an ISO time and one space) from each
       line. A failure block starts at a line that begins "not ok <n> - " at column 0. Its file is the value
       of the first line in that block that is exactly two spaces, "location: '", a path, ":<line>:<col>'"
       (single or double quotes), before the block's two-space "..." line. Lines indented more than two
       spaces, and lines that start with a quote, are never read as keys. A failing nested subtest always
       makes its column-0 ancestor fail with a location in the same file, and a log tail is a suffix, so the
       ancestor is in the tail whenever the nested line is.
    2. scripts/test-with-retry.mjs parseFailingTestFiles (and parseFailingTestEntries, which scans the same
       blocks) use this rule.
    3. src/lib/base-reproduction.ts failingTestFilesFromCiFailures: paths in failure.name as today. For a log
       tail that holds a "not ok <n> - " line at any indent, return the paths the rule finds (none when the
       tail was cut inside a body), and also the files on a "FLAKE-RETRY-FILES: retrying ..." line. For a
       tail with no "not ok" line, keep today's free-text read. Keep the checkout prefix as found (W1-T2671).
    4. No change to decideBaseReproduction, localProbeVerdict or the rung.
    5. The test uses the measured excerpt (lines from job 135054821069, trimmed to the two failure blocks
       and the FLAKE-RETRY lines) as a fixture string.
    AMENDED (2026-11-19): test/a-red-the-pr-caused-is-fixed-not-refreshed.test.ts (PR 14196 tests 15 and 16) used a
    tail `not ok 6 - FILE` then `ok 7 - OTHER` and passed only because the free-text read counted the passing OTHER;
    under the column-0 rule its OTHER line becomes `not ok 7 - OTHER`, keeping what those tests assert.
  falsifier: |
    Keep today's free-text read for TAP tails: criteria 1, 2 and 6 fail. Keep matching any location: text
    in a block: criterion 3 fails. Read only the first column-0 block, or drop nested subtests' parents:
    criterion 4 fails. Return nothing for a non-TAP tail: criterion 5 fails.
