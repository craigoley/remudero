  note: |
    THE BOUND, AND WHY IT IS THE SAME NUMBER AS #2251's.

    7200s, checked DIRECTLY against all 116 `implement.done` rows carrying `worker_duration_ms`
    rather than inferred from percentiles: 19.3 min median, 36.0 p90, 46.7 p95, 55.2 p99, 98.5 max.
    At 7200s, ZERO of the 116 would have tripped it, with a 22% margin over the largest run ever
    observed. At 5400s, ONE would have — which is why the next tighter candidate is rejected rather
    than preferred. The bound is on ELAPSED TIME SINCE THE LAST OBSERVED STATE TRANSITION, never on
    total run age, so a long healthy run that keeps emitting `worker.state` is never touched: that
    is what criterion 6 asserts, and it is the difference between this and a wall-clock kill.

    #2251 CHOSE 7200s FOR THE RECYCLE'S KILL PREDICATE ON THIS SAME POPULATION, AND THE RISKS ARE
    GENUINELY DIFFERENT, SO THE MATCH IS ARGUED RATHER THAN INHERITED. The recycle decides whether
    to kill a process it did not start, WITH an operator present who invoked it. This is a run
    deciding to abandon its OWN worker, UNATTENDED. The naive reading says unattended should be more
    conservative — but it cuts the other way: ABANDONING IS THE SOFTER ACT. The run ends with a
    terminal verdict, the lock is released, the task becomes dispatchable again and the evidence is
    written down; the recycle's kill is terminal for that process with no re-dispatch behind it. One
    number across both is easier to reason about and neither trips any observed run, SO THEY MATCH
    DELIBERATELY. IF EITHER IS EVER RETUNED, RETUNE BOTH OR RECORD WHY THEY DIVERGED.

    WHAT IS RECORDED, AND WHO READS IT. At the moment of abandonment, BEFORE anything is released:
    elapsed since the last observed `worker.state` transition, that last state and its timestamp,
    the run id and task id, the resolved bound, and the lock and worktree about to be released.
    Turns are recorded ONLY IF the stream carried them — the SDK's `num_turns` arrives in the
    completion envelope, which by definition a stalled stream has not produced, so this must be an
    optional field and must never be fabricated. A killed worker writes no `implement.done`, which
    is exactly why its spend appears nowhere today; the same blind spot covers the `no_pr` bucket.
    THE READER IS THE OPERATOR reading the ledger, and that is stated because an unstated one is
    not. Whether an abandonment burns a strike or counts as an attempt is a POLICY QUESTION THIS
    SHARD RAISES AND DOES NOT ANSWER.

    ROTATION MEMBERSHIP IS DECIDED BY THE RULE, NOT BY PREFERENCE. `DECISION_RELEVANT_LEDGER_STEPS`
    (`src/lib/ledger.ts`, 59 entries) is required ONLY IF A DECISION READS THE STEP BACK via
    `.step === "..."`, and `test/ledger-rotation.test.ts` derives its expectation by scanning
    consumer sources for exactly that. An operator-read row needs no membership and must not take
    one; if the implementer adds any predicate that reads this step, it MUST join the set in the
    same PR. Criterion 8 asserts whichever of those two the implementation actually chooses.

    THE ABANDONED PROCESS IS NOT NECESSARILY REAPED, AND THAT IS NAMED RATHER THAN SOLVED. An
    `AbortController` ends the ITERATION; the SDK's child `claude` process is a separate pid and may
    keep running. `killProcessGroup` (`src/lib/worker-containment.ts`) is the pid-based mechanism
    that exists for this and is the natural tool. THE ADJACENT GAP, NAMED AND EXPLICITLY NOT SCOPED
    IN: `deploy/recycle-container.sh` carries three TERM-shaped references and ZERO `SIGKILL`/`-9`
    escalation, so a process that ignores TERM is not escalated there — that is #2251's territory
    and a separate concern, and this shard must not widen into it.

    WHAT MUST NOT BE BUILT. NO CHANGE TO `--max-turns`, `maxBudgetUsd` OR `dispatchLanes` — the
    first two cannot fire on a stall by construction and the third stays at 3 by operator ruling.
    NO REPLACEMENT FOR W1-T943's DETECTOR, whose rung, threshold and escalation are correct and
    stay as they are. NO RETIERING of its `BLOCKED` escalation. NO NEW STALL SENSOR: `worker.state`
    already exists and is what the bound reads. NO BOUND ON `await deps.sweep()` OR ON THE FIX-RUNG
    SPAWN — that is W1-T1044 (#2249), the sibling half of this same class, cited and deliberately
    not re-derived here. NO KILL PATH FOR A PROGRESSING WORKER.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT, ordered by a word-bounded invocation count of the
    seams the bound touches (`spawnWorker`, `queryFn`, `WorkerStateTracker`, `workerStall`):
    `src/run-task.ts` 56 and `src/lib/worker.ts` 23, with every other file at 6 or fewer.
    `src/lib/worker.ts` is where the stream is iterated and where the abort must live;
    `src/run-task.ts` owns the lock, the worktree, the verdict and the rung that already detects the
    stall, so the ACT-ON-DETECTION half cannot live anywhere else. Per DECISIONS.md's 2026-08-18
    W1-T471 ruling that file is not split and tasks are not re-scoped to avoid it, and the ruling
    states the ceremonial acceptance sentence is no longer required, so it is declared plainly and
    the serialisation cost is accepted. `plan/policy.yaml` carries the threshold as data beside the
    existing `workerStall` row it must not disturb.

    `test/worker-clock-bound.test.ts` DOES NOT EXIST at 2529ff12 — a forward-referenced PATH, never
    a guessed symbol — and is a new file because the house rule keeps a coverage-load-bearing test
    out of a shared suite.

    THE FALSIFIER MUST PROVE BOTH DIRECTIONS OR IT PASSES ON A BOUND THAT ABANDONS EVERYTHING.
    Criterion 6 is that other direction and is not optional: a worker still emitting `worker.state`
    transitions must survive past the bound in the SAME run that abandons a silent one.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text, and this set
    crosses two `src/` modules, a plan file and `test/`. Blast radius argues UP: this is the only
    code path that may end a paying worker unattended, which is why the bound is required to key on
    silence rather than age and why the inside-the-bound case is asserted alongside the outside one.

