- id: W1-T1045
  title: "A DISPATCH WORKER IS BOUNDED BY TURNS AND DOLLARS AND BY NOTHING ON THE CLOCK, AND NEITHER CAP CAN FIRE ON A STALL — W1-T943's detector already finds a quiet run and by design never ends it, so a wedged worker holds a lane, an inflight lock and a slot until a human intervenes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    MEASURED 2026-08-20 AT origin/main 2529ff12, on the Azure host. Per-form coverage control first:
    0 `.gz`, 9 plain rotations, 1 live, the `.gz` zero confirmed because `find -name '*.gz'` under
    `state/` returns 0 while the identical shape returns 9 for `ledger.*.ndjson`; deduped on the full
    line. No `/rate_limit` call was made and no process was signalled.

    (1) THERE IS NO CLOCK. `src/lib/worker.ts` contains ZERO `AbortController`, ZERO `abortSignal`
    and ZERO `setTimeout`, against positive controls of 4 `query(` and 2 `for await` IN THAT SAME
    FILE, and against `src/lib/serve.ts` which does use `AbortController` — so the symbol is
    available and used elsewhere in `src/`, and its absence here is a choice rather than a platform
    limit. `spawnWorker` runs the SDK query in-process and iterates the stream to completion.

    (2) AND NEITHER CAP CAN FIRE ON A STALL, BY CONSTRUCTION. `--max-turns 400` and `maxBudgetUsd`
    are both consumption counters: a worker waiting on a command that never returns BURNS NO TURNS
    AND NO DOLLARS, so neither ceiling is approached, let alone reached. The observed instance sat
    at roughly 1.5% CPU for 12,951s. A dispatch worker that stops progressing without ending its
    stream holds its slot the same way — and unlike the fix rung it also holds a LANE and a
    `state/inflight/<task>.lock`.

    (3) THE QUIET FLOOR IS DISPLAY-ONLY, AND THAT IS NOT A BOUND. `DEFAULT_WORKER_QUIET_FLOOR_MS` is
    30s and `WorkerStateTracker` (`src/lib/worker.ts`) emits a `quiet` state consumed by
    `src/lib/board.ts`, `src/lib/serve.ts` and `src/lib/status.ts` — a render, a console element and
    a projection field. Across every `src/` file mentioning `quiet`, exactly one line also mentions
    abort/kill/signal/terminate, and it is the doc saying the detector never does.
    A CONSUMER THAT ONLY RENDERS IS NOT A BOUND.

    (4) W1-T943'S DETECTOR IS ALREADY WIRED AND ALREADY CORRECT — THIS IS THE FINDING THAT MAKES THE
    TASK SMALL. `runWorkerStallDetectorRung` (`src/run-task.ts`) is a PER-POLL rung inside the
    daemon's sweep with its own try/catch, reading `policy.values.workerStall` (`plan/policy.yaml`,
    `value: 3600000`, bounds 1200000-7200000, parsed by `numberField` in `src/lib/policy.ts`). It
    judges every LIVE in-flight run's newest `worker.state` row against that threshold and escalates
    a quiet one. NOTHING ABOUT IT IS BROKEN AND NOTHING ABOUT IT NEEDS REPLACING.

    (5) IT HAS NEVER FIRED BECAUSE NO DISPATCH WORKER HAS EVER STALLED. Over 2,919 `worker.state`
    rows across 55 runs, the inter-row gap is 4s median, 49s p90 and **879s max — 14.6 minutes**,
    against a 60-minute threshold. ZERO gaps exceed `workerStall`; zero exceed 7200s. So the
    silence is the population's, not the detector's: `worker.stalled` has never been written
    (positive controls: 8 `ci.stalled`, 2 `pr.stalled`) because the event has not happened in this
    lane. THE THRESHOLD IS NOT UNREACHABLE AND THE RUNG IS NOT UNWIRED — the two other hypotheses
    are eliminated by that measurement.

    (6) SO THE GAP IS THE ACTION, NOT THE DETECTION. The rung's own doc says it "never kills/signals
    it", and its escalation detail says so to the operator in terms: *"never auto-killed either way
    (design note iv) — the operator, or a future paramedic verb, decides."* That deferral was the
    right call for W1-T943 and it is explicitly a placeholder for something later. THIS TASK IS
    THAT SOMETHING, scoped to the one action the detector deliberately withheld.

    (7) AND THE TIER IT ESCALATES ON IS MEASURED SILENT. It calls `tryEscalate` with
    `class: "BLOCKED"`, while `escalate()` (`src/lib/escalate.ts`) gates its only `notify()` call on
    `cls === "MANUAL" || cls === "HARD_STOP"` and `src/lib/notify.ts` states the same in its header.
    So even on the day it does fire, the detection reaches a queue rather than a person — the same
    tier on which nine crash-loop issues went unread for five days. That is context for why an
    unattended action is needed and is NOT a licence to retier the escalation here.

    (8) HONESTLY STATED: NO DISPATCH WORKER HAS EVER EXCEEDED THE PROPOSED BOUND. The longest
    observed dispatch-run span (first to last `worker.state`) is 92.4 minutes and only one exceeds
    60 minutes at all; ZERO exceed 7200s. The stall class has been observed ONLY in the fix-rung
    lane, which W1-T1044 covers. THIS IS PREVENTION FOR A CLASS THIS LANE HAS NOT YET SUFFERED, and
    it must not be argued as anything stronger. It is still worth building because the two lanes
    differ only in which code path spawns the worker, and this one additionally holds a lane and a
    lock that the fix rung does not.
