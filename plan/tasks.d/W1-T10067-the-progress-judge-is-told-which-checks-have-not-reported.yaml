  status: merged
  priority: 1  # a judge that reads an unreported check as fixed credits a round with progress it did not make, and the next verdict builds on it
  attempts: 0
  rationale: |
    OBSERVED on the core ledger (17:04Z archive and the live file, read-only, niced, streamed to the Mac), #12575
    (W1-T9877), site fix-strike:
    - 16:37:09Z head 7518991a5, red_class acceptance-author-gate+head-identity-gate+proof-discrimination, verdict
      continue: "The latest round cleared the rule-checks red after the scope amendment merged ...".
    - 17:23:16Z same head 7518991a5, red_class
      acceptance-author-gate+assertion-discrimination+ci+ci-shard+claims+comment-load-ratchet+containment-probe+head-identity-gate+lint-plan+proof-discrimination+rule-checks.
      7518991a5 was the 16:29:06Z branch update (fix.scope_amendment branch_update_requested), so at 16:37Z most of its
      CI had not reported.
    - The same shape at 15:12:30Z on 125ad2aaa: a 4-check class, then the 13-check class at 15:20:16Z.
    READ at origin/main 70b15edf7 (symbols, not lines):
    - src/lib/sweep.ts `checksStateFromRollup` returns "red" on the first failing required check, before any pending
      one is looked at, so a head with three early reds and many pending checks is a red fix candidate.
    - The fix-strike site builds `buildFixProgressInput` with `currentRed` from `redCheckNames(pr)` (the failing
      required checks only). Nothing in the input names a pending check.
    - src/lib/fix-progress-judge.ts `buildFixProgressInput` sets a completed round's `redAfter` to the next round's
      `redBefore`, or to `currentRed` for the newest round, so a check that has not reported is absent from
      `redAfter` exactly as a fixed one is.
    WHY THIS IS NOT ANOTHER TASK: W1-T9297 (queued) gives the judge each failing check's evidence; W1-T9502 (queued)
    reuses a verdict for an unchanged input; W1-T10039 (queued) skips the judge at round 0. None says which checks
    have not reported. Swept origin/main plan/tasks.d for progress_judged, buildFixProgressInput, pending check,
    in-flight, half-finished and "not yet reported", and the 3 open PR heads (18:26Z): none.
  design: |
    1. `buildFixProgressInput` accepts `pendingChecks` (the head's required checks that have not concluded, at gate
       granularity) and records it on the input. A completed round whose `redAfter` is derived from the current red
       while `pendingChecks` is non-empty is marked `redAfterPartial: true`, and `signals` gains `pendingChecks`
       (a count, present only when non-zero).
    2. Every sweep.ts site that builds the input from a PR view passes the pending set from `statusCheckRollup` over
       the same required-check gate `checksStateFromRollup` reads (one gate, never a second copy).
    3. The production judge prompt states that a check named in pendingChecks has not reported, so its absence from
       the current red is not evidence it was fixed.
    4. The `fix.progress_judged` row carries `pending_checks` when non-empty, and the pending set enters the input key
       W1-T9502 caches on, so a verdict given on a half-reported head is never reused once the checks conclude.
    5. No wait and no count: the judge still rules when asked; it is told what it cannot see.
    6. TESTS in test/the-progress-judge-is-told-which-checks-have-not-reported.test.ts, `test(` titles verbatim as in
       the proofs: #12575's 16:37Z shape (round dispatched against rule-checks, three reds concluded, rule-checks
       pending) gives an input whose newest round is redAfterPartial with rule-checks in pendingChecks; a fully
       concluded head gives neither (control); the fix-strike site's ledger row names the pending checks.
  acceptance:
    - claim: "a round judged while its checks are still running is marked partial and the pending checks are named"
      proof: 'grep: test("W1-T10067: a half-reported head marks the newest round partial and names its pending checks" in test/the-progress-judge-is-told-which-checks-have-not-reported.test.ts'
    - claim: "a head whose required checks have all concluded carries no pending marker"
      proof: 'grep: test("W1-T10067: a fully reported head carries no pending marker" in test/the-progress-judge-is-told-which-checks-have-not-reported.test.ts'
    - claim: "the fix-strike judgment row names the checks that had not reported"
      proof: 'grep: test("W1-T10067: the fix-strike judgment row names the pending checks" in test/the-progress-judge-is-told-which-checks-have-not-reported.test.ts'
  falsifier: |
    At origin/main `buildFixProgressInput` over #12575's shape has no pendingChecks field and gives the newest round
    `redAfter` without rule-checks, indistinguishable from a fix, so the first test fails. Marking every round partial
    fails the second. Deleting the fix gives `# fail N`, restoring it `# fail 0`.
  note: |
    EFFECT, measured after merge from the core ledger: fix.progress_judged rows whose reason claims a red was cleared
    while that check is in the row's pending_checks. Healthy shape: none.
