  band_meaning: span
  origin: "operator session 2026-10-17 filing agent F17 item 3, from the hand fix of #12575 (X2, 16:40-18:15Z)"
  plan_refs: [W1-T7096, W1-T7762, W1-T9297, W1-T9502, W1-T10039, W1-T9877]
