- id: W1-T10067
  title: "THE FIX-PROGRESS JUDGE IS TOLD WHICH CHECKS HAVE NOT REPORTED, SO A PENDING CHECK NEVER READS AS CLEARED — at 16:37:09Z on 2026-10-17 it ruled on #12575 head 7518991a5 that 'the latest round cleared the rule-checks red' when only acceptance-author-gate, head-identity-gate and proof-discrimination had concluded; at 17:23:16Z, same head, rule-checks, ci, ci-shard, lint-plan and four more had joined them"
  repo: remudero
  depends_on: [W1-T10039]  # same files (src/lib/fix-progress-judge.ts, src/lib/sweep.ts) and the same buildFixProgressInput call sites; serialize, never parallel
  type: implement
