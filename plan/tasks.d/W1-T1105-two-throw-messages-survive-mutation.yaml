  note: |
    `risk: medium` IS THE HONEST BAND — one test file, two assertions, no product code. Rule 19
    reads one concern here and does not force a raise; inflating it would be theatre.

    `test/plan-pr-emitter.test.ts` IS THE EXISTING HOME and is declared rather than a new filename,
    the correction `lint-plan` forced on W1-T1068, W1-T1069, W1-T1078 and W1-T1079.

    THE FOURTH CRITERION'S PROOF IS A FORWARD REFERENCE INTO THE DECLARED TEST FILE, AND THAT
    PLACEMENT WAS MEASURED. Naming `src/lib/plan-pr-emitter.ts` instead drew a `proof-scope` warn
    whose own remedy text says to add that path to `files:` — which would declare a PRODUCT file
    this task must never edit and hand a worker the scope to do it. That is the trap W1-T1070
    files: the check is right that the path is out of scope, and its first suggested fix is the
    harmful one. The proof therefore names the SUITE, where the message string must appear once
    the assertion exists; it reads zero on origin/main today.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH.

    EVERY FIGURE IS A QUERY, AND ONE IS DELIBERATELY ABSENT. Re-derive the survivor census by
    parsing `[Survived] <kind>` rows out of the mutation run's UPLOADED ARTIFACT rather than the
    issue body, which is truncated. Do not carry a total: rationale (5) explains why the numbers in
    this file are a floor.
