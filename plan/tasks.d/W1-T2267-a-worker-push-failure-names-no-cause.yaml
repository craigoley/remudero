  note: |
    THE ORCHESTRATOR FALLBACK PUSH STAYS. It exists because a worker push failing must not lose the
    work, and the operator reports it doing exactly that on 2026-08-25. Nothing here removes it,
    narrows its trigger, or makes it conditional on diagnosing a cause first: the branch must still
    reach origin on every path it covers today, and a run that cannot determine WHY still pushes.

    THE WORKER KEEPS THE ABILITY TO PUSH ITS OWN BRANCH. `github.com` stays in `allowedDomains`
    because that push is why it is there, and `api.anthropic.com` STAYS ABSENT. NO NEW EGRESS of any
    kind is proposed or implied.

    AND THE THREE-OPTION DECISION STAYS CLOSED. `github-app.ts` weighed a fresh re-read inside the
    worker, a retry-once-on-401 in the push path, and accepting the gap, and took the third with its
    reasons written down. THIS IS ABOUT SEEING THE FAILURE, NOT PREVENTING IT. A build that adds a
    retry or a re-read has answered a different question than the one asked.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (run-task, worker-push-credential-visibility) at
      risk:medium — Rule 19: raise to risk:high or decompose into one task per concern The real blast radius is one `catch` and the line beside it; no
    gate, no merge path and no dispatch decision reads either.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/worker-push-credential-visibility.test.ts`, declared in `files:`
    and absent from this tree, so on the filing PR each resolves through W1-T456's forward-reference
    carve-out.
