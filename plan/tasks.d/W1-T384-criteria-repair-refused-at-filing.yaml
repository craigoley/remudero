    risk:medium, calibrated against W1-T353 (the same two files, the same subsystem, the same additive
    blocking check): one concern, one wiring point, and the failure directions cost a wrong lint
    message rather than lost work — a false positive parks a task the operator clears with one field
    edit, which is the cheap direction to be wrong in.
    budget_usd 60 — one trigger, a four-direction falsifier and a status exclusion. Five above
    W1-T353's 55 for clause (v), which that task had no equivalent of.
    files: DECLARES both paths the worker writes and nothing more. `lintTask` is the single wiring
    point (design (iv)), so no third file is needed; omitting a written path is what refused five
    dispatches in one week. Both files EXIST and all four proofs execute today — `rulingVerifyViolation`
    is already tested in test/task-linter.test.ts — so no criterion here is a forward reference.
    THE ONE COST OF SHIPPING THIS, stated rather than discovered later: W1-T324 is `status: queued`
    today and carries the refusable shape, so the check makes it a NEW open-failing task — a
    signal-truthfulness cost of exactly one, on a record that genuinely cannot be dispatched as filed.
    Its work merged as #1298 + #1299 and the right correction is to withdraw it, which is an operator
    plan-only change outside this task's declared files.
    ORDERING, a preference and deliberately NOT a depends_on edge so it cannot stall this: landing
    W1-T324's withdrawal first would leave the open-failing count unmoved. Stated here so the absent
    edge is not read as an oversight (W1-T353's own convention).
    NO depends_on: nothing blocks this."
