    - claim: "a normal-length run emits no runaway signal — the bound does not fire on a healthy population"
      proof: "unit test: test/a-runaway-worker-is-visible-before-it-finishes.test.ts"
    - claim: "the runaway threshold is derived from an observed class distribution, never a source literal"
      proof: "unit test: test/a-runaway-worker-is-visible-before-it-finishes.test.ts"
    - claim: "max_turns stays a flat 400 runaway cliff — no ceiling is lowered by this change"
      proof: "unit test: test/a-runaway-worker-is-visible-before-it-finishes.test.ts"
    - claim: "no worker is killed or deferred by this change: it observes and never acts"
      proof: "unit test: test/a-runaway-worker-is-visible-before-it-finishes.test.ts"
    - claim: "removing the mid-flight emission makes the in-flight visibility assertion fail"
      proof: "unit test: test/a-runaway-worker-is-visible-before-it-finishes.test.ts"
