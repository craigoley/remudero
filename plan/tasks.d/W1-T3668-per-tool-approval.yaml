- id: W1-T3668
  title: "A SKILL CANNOT DECLARE WHICH OF ITS OWN TOOLS NEEDS A HUMAN — approval is per-ROUTE (five HIGH_TIER_WRITE_PATHS) and per-SKILL (one permission_profile), so a worker mid-run either may call every tool it was granted or none, and the operator is asked before dispatch or after the PR, never at the call that matters"
  repo: remudero
  depends_on: []
  type: recon
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 60.00
  files: [docs/recon/per-tool-approval.md]
  origin: oper#pizza-bot-comparison-2026-09-16
  plan_refs: ["W1-T500", "W1-T2696"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED 2026-09-16 on this repo. Approval exists at two grains and neither is the tool call:

      PER ROUTE   HIGH_TIER_WRITE_PATHS names five console paths that need a confirmation nonce
                  (/v1/manual/approve, /v1/drain/kick, /v1/drain/run, /v1/inbox/approve,
                  /v1/skills/run)
      PER SKILL   GET /v1/skills returns each skill's `tools` list and one `permission_profile`

    So a lane is granted a tool list up front and then runs unattended to completion. There is no
    point at which a worker about to make a consequential call pauses and asks.

    WHAT PIZZA BOT DOES INSTEAD, released 2026-09-13. A skill's own SKILL.md frontmatter declares
    the policy beside the tool list:

        tools:
          - mcp:release-tools:check_release
        interruptOn:
          "mcp:release-tools:publish_release":
            allowedDecisions: [approve, edit, reject]

    Two things are worth taking and one is worth arguing about.

    TAKE: THE POLICY LIVES WITH THE SKILL. The thing that knows `publish_release` is dangerous is
    the skill that calls it, not a path list in a different file. Ours is a hard-coded array of
    five console routes in console-shell-client.ts — it cannot express "this skill may read freely
    but must ask before it writes", and it drifts from the routes it names by construction.

    TAKE: `edit` AS A FIRST-CLASS DECISION. Their note is the insight — it "lets you correct what
    the agent proposed rather than rejecting it and starting the run over". We have the mechanism
    already: POST /v1/inbox/reframe. We do not offer it as a decision anywhere an operator looks.

    ARGUE ABOUT: THE DURABLE MID-RUN PAUSE. Theirs checkpoints through LangGraph so a run parks
    mid-flight and resumes hours later from another device. Ours has `resumeSessionId` for a
    worker session but nothing that suspends a run on a pending decision. That is the expensive
    half and it is why this task is RECON, not implement: the question is whether a fleet that
    already reviews every change through a pull request needs a second in-run approval gate, or
    whether the right shape here is a per-tool REFUSAL that ends the run with a filed ask.

    WHAT THIS RECON MUST PRODUCE. A measured recommendation naming which of the three to adopt,
    what each would cost in this codebase, and — for any it rejects — why a pull-request-reviewing
    fleet does not need it. Not a design document that adopts all three because they sound good.
  acceptance:
    - claim: "the recon names, for each of the three ideas, whether to adopt it here and what it would cost in this codebase"
      proof: "grep: RECOMMENDATION in docs/recon/per-tool-approval.md"
    - claim: "the recon measures the current approval grain rather than restating it, naming the routes and the skills it actually found"
      proof: "grep: HIGH_TIER_WRITE_PATHS in docs/recon/per-tool-approval.md"
    - claim: "any idea the recon rejects is rejected with a reason specific to a fleet that reviews every change through a pull request"
      proof: "grep: REJECTED in docs/recon/per-tool-approval.md"
  falsifier: |
    A recon that adopts all three without costing them fails the first criterion. One that
    describes the current design from memory rather than from the route list fails the second.
    One with no REJECTED section has not made a recommendation, only a summary.
