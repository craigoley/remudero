  rationale: |
    RE-VERIFIED at origin/main 1247a5663 on 2026-10-01. The gap the 2026-09-12 shard named is
    unchanged:
      - `startCredentialHelperSocket` (src/lib/secret-boundary.ts) has NO caller in src/. Its only
        caller is test/secret-boundary.test.ts.
      - `mintScopedToken` (src/lib/github-app.ts), the mint the socket is meant to call, also has
        no production caller; src/ names it only in comments.
      - `SpawnWorkerArgs.secretBoundary` (src/lib/worker.ts) is read in `spawnWorker` (the
        `secretBoundaryEnv` substitution and the `wireCredentialHelperSocket` call), but no src/
        call site ever SETS it. No `spawnWorker(` caller passes the field, so both branches are
        dead in production.
    So every daemon-dispatched worker inherits `GH_TOKEN` through env.ts's worker ALLOWLIST, and
    git pushes through deploy/entrypoint.sh's global helper, which reads that inherited copy. That
    copy is the INSTALLATION-WIDE App token, valid for every repo the App is installed on (core,
    console, site), and it is fixed at spawn. github-app.ts's own header states the second half:
    "a worker's copy of GH_TOKEN is fixed at spawn and can outlive the one-hour token on a long
    run. That gap is accepted, not fixed, here." The scoped, per-request path that closes both
    halves for git exists and is tested, but nothing runs it.

    OBSERVED COST (from the original shard): the first #5283 fixture-repair worker finished its
    change, then `git push origin HEAD` failed with `Invalid username or token`. A later retry got
    through on a connector fallback, so that incident alone does not prove expiry. It does show the
    normal push path has an availability hole.

    A SECOND DEFECT BLOCKS THE NAIVE WIRING. `SecretBoundaryHandles` REQUIRES `modelSentinel` and
    `modelBaseUrl`, and `spawnWorker` treats ANY `secretBoundary` as the model boundary: it deletes
    `CLAUDE_CODE_OAUTH_TOKEN` and substitutes the sentinel. A caller that wants ONLY the git half
    cannot express it without breaking model auth. The git half must be separable.

    NOT DUPLICATE WORK. W1-T2699 built the mechanism; its acceptance proved worker.ts's opt-in code,
    not a daemon owner. W1-T2522 ledgers a worker's git and gh failures and leaves the credential
    path alone. W1-T4349 (queued) closes credential-REACH ratchet findings, a different surface.
    lint-plan reports W1-T62 and W1-T94 because both also name worker.ts and run-task.ts. Neither is
    this work: W1-T62 is PR-attribution parsing and W1-T94 is fix-rung failure-mode selection. This
    task leaves both unchanged and owns only the socket's daemon lifetime and git credential transport.
  design: |
    Wire ONLY the git-credential half of the existing boundary into daemon-dispatched workers. Do
    not activate or redesign the model-token proxy, and do not narrow `gh`'s own `GH_TOKEN` (gh has
    no substitution path; out of scope, as secretBoundaryEnv's doc already says).

    (i) DAEMON LIFETIME. After the daemon's existing first App-token readiness barrier
    (`githubAppRefresh.ready`, W1-T2554) settles, start ONE credential-helper socket under the
    daemon state root, mode 0600 (owner only). Its mint callback is `mintScopedToken` for the
    owner/repo git asks about. It mints NOTHING broader when `credential.useHttpPath` is missing or
    the path is malformed: it refuses. Reuse the existing value-free `boundary.request` ledger
    rows. Close the socket and remove its path on normal shutdown. A stale path from a killed
    process is removed only by the existing start routine before it binds.
    (ii) THREADING. Pass the socket path through the real daemon construction to every
    daemon-dispatched worker: ordinary task runs AND sweep `dispatchFix` workers. Use no
    process-global mutable handle, token file, env copy or second helper protocol.
    (iii) SEPARATE THE HALVES. A socket-only handle configures git and leaves the model credential
    env byte-identical. A model-boundary handle keeps today's behaviour. Make the model fields
    optional, or add an optional git-only field to the existing type. Declare no new Deps/Seams
    type (census).
    (iv) UNCHANGED PATHS. Direct `rmd run-task` and an App-unconfigured host keep today's ambient
    behaviour byte-for-byte and create no socket. Do not change git-push fallback, worker retries,
    the App refresh cadence, GitHub permissions, provider routing, or review and merge admission.
    A helper-wiring failure stays VISIBLE (worker.ts's existing `credential_helper_unwired` field)
    and never reports a successful push.
  acceptance:
    - claim: "an App-configured daemon starts one owner-only credential socket only after its first App-token readiness barrier settles"
      proof: "unit test: the daemon starts its git credential socket only after App readiness"
    - claim: "a daemon-dispatched task worker and a sweep dispatchFix worker both receive the same socket path and their worktree's git config names the socket helper"
      proof: "unit test: task and fix workers both receive the daemon git credential socket"
    - claim: "a git credential request for owner and repo is answered by a freshly minted scoped token while the worker env gains no token value and no credential file"
      proof: "unit test: a worker git credential request mints a repo-scoped token on demand"
    - claim: "an App-unconfigured daemon and a direct rmd run-task keep ambient credentials and create no socket"
      proof: "unit test: an unconfigured daemon creates no git credential socket"
    - claim: "a socket-only handle leaves the model credential env unchanged"
      proof: "unit test: a git-only credential handle leaves the model credentials untouched"
    - claim: "a missing owner and repo path or a mint refusal is an explicit refusal and never mints an installation-wide token"
      proof: "unit test: a pathless or refused git credential request mints nothing broader"
    - claim: "the socket is closed and its path removed after normal daemon shutdown"
      proof: "unit test: the daemon git credential socket is removed on shutdown"
  falsifier: |
    At filing, `grep -rn 'startCredentialHelperSocket(' src` finds only the definition, and no src
    call site sets `secretBoundary` on a `spawnWorker` argument. If a production daemon call site
    already starts the socket, threads it to both runTask and sweep dispatchFix, and a fresh worker
    worktree's git config names that socket, close this task without implementation.

    Mutations the suite must catch: remove the daemon-to-spawn threading (the task-worker and
    fix-worker assertions fail); drop `credential.useHttpPath` (the scoped-request assertion fails
    instead of minting installation-wide); create the socket world-writable (the owner-only
    assertion fails).
