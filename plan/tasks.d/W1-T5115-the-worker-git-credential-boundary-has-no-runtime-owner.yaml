- id: W1-T5115
  title: "THE WORKER GIT-CREDENTIAL BOUNDARY IS STILL TEST-ONLY — W1-T2699 built a per-request scoped-token socket and a per-worktree helper, but no daemon starts the socket or hands its path to a production spawn, so every daemon-dispatched worker still pushes with the installation-wide GH_TOKEN it copied at spawn"
