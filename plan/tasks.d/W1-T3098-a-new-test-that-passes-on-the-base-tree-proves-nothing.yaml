- id: W1-T3098
  title: "A NEW TEST THAT WOULD PASS ON THE BASE IMPLEMENTATION IS CERTIFIED AS DISCRIMINATING — `classifyBaseProofOutcome` re-runs a `unit test:` proof inside the R-11 base worktree, but that worktree is a checkout of the merge-base and therefore does not CONTAIN the PR's added test file; `node --test` finds nothing, exits non-zero, the executor reports \"fail\", and the classifier reads that as `discriminates`, so the one proof shape the judge cannot actually evaluate is the one it grades most confidently"
