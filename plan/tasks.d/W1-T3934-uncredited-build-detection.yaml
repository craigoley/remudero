- id: W1-T3934
  title: "A PROSE MENTION IS NOT AN UNCREDITED BUILD — require a merged PR to overlap the task's declared files before it reaches NEEDS ME, while preserving the fail-open warning for tasks with no declared scope"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: medium
  band_meaning: blast-radius
  origin: "operator-follow-up#needs-me-false-positive-2026-09-21"
  plan_refs: [W1-T2392, W1-T1041]
  files: [src/lib/status.ts, test/uncredited-build-detection.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on origin/main 27b39e94: `rmd status --json` surfaces W1-T1041 in
    `needsMe.uncreditedBuilds` because merged PR #4746 mentions W1-T1041 in an explanatory
    code sample. #4746 is actually `Remudero-Task: W1-T3216`, changes `src/lib/daemon.ts`,
    `src/lib/drain.ts`, `src/run-task.ts` and tests, and does not touch any of W1-T1041's
    declared files (`.github/workflows/ci.yml`, `.github/workflows/ci-gate.yml`, and two
    workflow tests). The current W1-T2392 detector distinguishes plan filings from builds by
    `src/` changes, but treats any prose-named task as the build's owner; settled tasks and
    unrelated explanatory mentions therefore become false NEEDS-ME rows.

    This is a routing defect, not evidence that W1-T1041 needs a new operator ruling. A task's
    declared `files:` scope is the repository's existing ownership contract. A merged PR that
    touches none of that scope cannot be the implementation of that task, even when its body
    quotes the task id. Tasks without a declared scope remain fail-open and continue to warn,
    because suppressing a genuinely unscoped uncredited build would be the costlier error.
  design: |
    (i) Extend the pure `uncreditedBuildWarning` predicate with the task's declared files and
    require at least one changed PR path to overlap that scope before returning a warning. Keep
    the current `src/` non-test build discriminator and the existing unreadable/absent-file-list
    fail-open behavior.

    (ii) Thread `task.files` from `deriveStatus` into the predicate without adding a GitHub read;
    `projectPlan` already supplies the merged PR changed-file lists through the same gateway. Do
    not credit, close, retire, or alter dispatch state from this warning. It remains a report-only
    NEEDS-ME signal.

    (iii) Add a regression for the observed W1-T1041/#4746 shape, plus controls proving that an
    overlapping source build still warns, a plan-only filing still stays quiet, and a task with no
    declared files preserves the old fail-open warning behavior.
  acceptance:
    - claim: "a merged PR that only mentions a task in prose and touches none of its declared files does not reach NEEDS ME"
      proof: "unit test: W1-T3934: a prose-only mention outside the task scope is not an uncredited build"
    - claim: "a merged source PR overlapping the task's declared files still produces the report-only warning"
      proof: "unit test: an overlapping source build remains an uncredited-build warning"
    - claim: "a task without declared files remains fail-open rather than silently suppressing an uncredited build"
      proof: "unit test: an unscoped task preserves the uncredited-build warning"
    - claim: "the warning remains report-only and does not change task disposition"
      proof: "unit test: the warning MOVES NO DISPOSITION"
  falsifier: |
    Remove the declared-scope overlap check and the W1-T1041/#4746 regression must fail. Change
    the check to require scope for every task and the unscoped fail-open control must fail. Any
    implementation that credits or retires the task rather than only suppressing a false warning
    is out of scope and unsafe.
