  title: "A MODEL'S OWN `tsc --noEmit -p .` RUNS COLD, FULL AND UNSLOTTED — a worker's raw tsc peaked at 4.4 GB rss on the host on 2026-10-14, and the same command measured 4.41 GB here, while the fleet's incremental check of the same tree peaks at 1.65 GB warm and 1.67-2.69 GB after a typical edit; `npm run typecheck` already runs that way (W1-T7392), but npx tsc and node_modules/.bin/tsc bypass it: the fleet install's tsc entry routes a whole-project no-emit check through the same prepared, seeded, slot-admitted run and passes every other invocation through untouched"
