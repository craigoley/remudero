  note: "`risk: high` IS SET UP FRONT — and it was RAISED from medium by the linter rather than
    argued into place, which is worth recording. `sizingViolation` (`src/lib/task-linter.ts`) reads
    the span as TWO subsystems (`policy`, `run-task`) and refuses medium: `subsystemsOf` folds
    `test/policy.test.ts` onto `src/lib/policy.ts`, but `src/run-task.ts` is its own. THE BAND IS
    THE SPAN. The blast radius happens to deserve the same band for a different reason — this
    changes what merges without a human — which is why design (ii) states the effect out loud and
    (iii) requires the hatch.
    `files:` WAS DERIVED BY INVOCATION COUNT. `loadPolicy(` and `policyPath(` appear in
    `src/run-task.ts` (11 and 10) and `src/lib/policy.ts` (2 and 2); `test/policy.test.ts` scores
    8 and 1 and is the policy suite. `src/run-task.ts` IS DECLARED BECAUSE THE ARM DEP LIVES THERE
    — the sweep's `arm:` closure is constructed in that file, not in `sweep.ts` — and the W1-T471
    serialisation cost is accepted explicitly. `plan/policy.yaml` is declared because the flag's
    default ships in it.
    `src/lib/sweep.ts` IS DELIBERATELY NOT DECLARED: it consumes an injected `arm` dep and needs no
    edit for this change. `test/auto-triage-policy-seam.test.ts` and `test/retro-trigger-check.test.ts`
    also invoke `loadPolicy` but pin OTHER keys and are not touched; a declared-but-untouched path
    fails `inverseScopeUntouchedFiles` (`src/lib/review.ts`) exactly as an undeclared one fails
    `scopeViolationFiles`. DECLARE WHAT YOU WILL TOUCH — #1869 shipped a 22-file overrun against a
    two-path declaration and merged on an advisory.
    RULE 25 IS NOT ENGAGED: no declared path matches an `INSTRUMENT_SURFACE` pattern, and `plan/`
    and `test/` are excluded from `isProductPath`, so this cannot pair a product path with an
    instrument one.
    EVERY CRITERION IS A NAME-FILTERED `unit test:` TITLE, NOT A PURE PATH. Each of the four was
    checked to match zero files under `test/` today against a positive control matching one, and
    each is under 100 characters with no comma.
    THE ID WAS RESERVED THROUGH THE REF ALLOCATOR, NOT A HAND-ROLLED SWEEP ALONE:
    `reserveTaskIdRemote` has a single call site (`triageCommand`'s mint), so a hand-filed shard
    does not pass through it — `refs/rmd-id/W1-T516` was therefore created directly on origin with
    a unique orphan payload before this record was written, and a fresh-fetch sweep cross-checked
    it at zero with a known-taken control reading above one.
    EVERY FIGURE HERE IS DATED 2026-08-15 AND IS A QUERY, NOT A CONSTANT — the predicate's location,
    the three fallback call sites, the branch-protection settings and the draft classification all
    move as the code and the repo settings move. RE-DERIVE BEFORE BUILDING."
