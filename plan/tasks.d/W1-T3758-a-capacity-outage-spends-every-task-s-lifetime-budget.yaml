  rationale: |
    MEASURED ON THE LIVE LEDGER, 2026-09-18. Since the daemon restarted onto working code, it has
    run 15 sweep passes and dispatched NOTHING. The entire visible frontier is refused:

        lifetime-capped   9 tasks   W1-T3673,3674,3675,3676,3677,3678,3679,3718,3719
        skipped          10 tasks   (run-branch-already-pushed)
        indeterminate     8 tasks

    W1-T3718 carries EXACTLY ten `run.start` rows and no `run.end` at all. Every one falls
    between 2026-09-17T22:25 and 2026-09-18T01:11 — precisely the window in which no provider had
    headroom and `daemon.spawn_infra_blocked` was firing. Each dispatch died before a worker ran,
    and each still counted.

    The task's own title is "THE FIX RUNG CANNOT SPAWN A WORKER AT ALL AND BOTH FALLBACKS ARE
    OPERATOR-DISABLED". The task describing the outage was killed by the outage it described.

    THIS IS W1-T2423's CLASS, APPLIED TO THE ONE BOUND THAT WAS DELIBERATELY LEFT OUT. W1-T2423
    (merged) fixed exactly this for the STREAK breaker: "a probe refusal counts as a dispatch that
    produced nothing". `dispatchesEver` was then deliberately excluded from that exclusion, and
    W1-T3523 design (ii) states the reason in the code:

        "an orphan dispatch is still a dispatch by that measure: the host spent a worker slot on it
         whether or not the worker ever wrote a second row. Excluding orphans here would let a task
         that reliably kills its own worker (an OOM, a poison input) re-dispatch forever with
         NOTHING counting it"

    THAT REASONING IS SOUND AND IS NOT IN QUESTION. It is also about a different thing. "A task
    that reliably kills its own worker" is TASK-ATTRIBUTABLE: the input is poison, and the count is
    the signal. A capacity block is FLEET-WIDE and task-independent — the host did NOT spend a
    worker slot, because no slot existed to spend, and every task alive in that window is
    identically affected. The ledger already distinguishes the two by name:
    `daemon.spawn_infra_blocked`.

    SO THE BOUND IS MEASURING THE FLEET'S WEATHER AND CHARGING IT TO THE TASK.

    AND THERE IS NO WAY OUT WITHOUT CODE. `DEFAULT_MAX_TASK_LIFETIME_DISPATCHES = 10` is
    hardcoded; grepping `policy.ts` and `plan/policy.yaml` finds no override, so an operator
    facing nine hard-stuck tasks has no lever short of editing the ledger, which this repo forbids
    — the archives ARE the record.

    THE FIX, AND ITS BOUNDARY: a `run.start` whose run ended in a FLEET-WIDE capacity refusal
    does not count toward `dispatchesEver`. Keyed on the recorded infrastructure cause, never on
    "the run wrote no second row" — that weaker test is exactly what W1-T3523 refused, and
    correctly. An OOM, a poison input, a worker that dies on its own must all still count.

    SECOND DELIVERABLE, BECAUSE THE FIRST DOES NOT UNSTICK WHAT IS ALREADY STUCK: those nine tasks
    carry their ten rows forever. Either the exclusion is retroactive (it reads history, so it is),
    or an operator override exists. Verify after building that all nine become dispatchable again,
    and SAY SO with counts — a fix that only prevents the next occurrence leaves this outage's
    damage permanent.

    FILES NOTE (W1-T3730): `files:` omits the test file the build will add — the only way past
    `lint-plan`'s `proof-unit-test-unresolvable` on a plan-only filing. The build must add it.

