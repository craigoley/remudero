- id: W1-T965
  title: "HARVESTED FOLLOW-UP CANDIDATES DIE AS ARCHITECT PROMPT TEXT — the harvest mines them, dedups them and renders them into a prompt section that is their terminus, so a research follow-up a worker paid to discover reaches no lane that can act on it: route them into plan/feedback/ as deterministic-id entries and let the EXISTING triage lane decide task-versus-no-task, exactly as it already does for the alert lane"
  repo: remudero
  depends_on: ["W1-T963"]
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 80.00
  rationale: |
    FILED FROM A RECON AT 55bf8c5. Every line number below was RE-READ on this branch's base
    b316693 and DRIFT WAS MEASURED, not assumed: feedback.ts :48/:65/:67/:73/:79/:588/:835,
    worker.ts :1607, triage.ts :308, retro.ts :1463/:1531/:2116/:2121, sweep.ts :4032/:4036,
    run-task.ts :16006/:16386 and policy.yaml :434 ALL hold unchanged. ONE drift: the recon cited
    `renderFollowupCandidates` at retro.ts:2205; its declaration is at :2206 (its call site at
    :1531 is unmoved).

    (1) THE TERMINUS IS PROMPT TEXT. A `research` follow-up is a first-class member of the
    follow-up union (`FollowupEntry`, src/lib/worker.ts:1607-1610, kinds research|task|action),
    parsed by `parseFollowups` (worker.ts:1623), ledgered as one `report.followups` row
    (run-task.ts:4934), mined by `mineFollowups` (retro.ts:2139), deduped against `openTitles`,
    and rendered by `renderFollowupCandidates` (retro.ts:2206) into a section headed "Follow-up
    harvest (W1-T105) — PROPOSAL CANDIDATES, never auto-filed (rule 15)". That Architect prompt
    text is where it ends. Nothing downstream can act on it.

    (2) THE PATTERN THIS COPIES ALREADY SHIPS, AND THAT IS WHY RULE 15 IS NOT IN TENSION. A
    non-human, non-alert MACHINE writer already creates feedback entries: the sweep repair filer
    writes `origin: repair#<surface>` — src/lib/sweep.ts:4032 guards on
    `!deps.dryRun && deps.captureRepairFeedback`, :4036 invokes it, the implementation is
    src/run-task.ts:16006-16007 (an `existsSync(feedbackEntryPath(...))` guard immediately
    followed by `captureFeedback`), wired at src/run-task.ts:16386, and bounded by
    plan/policy.yaml:434 (`repairFilingThreshold: 3`) and :446 (`repairFilingWindowDays: 7`).
    Three such entries are on disk. THE WORKER STILL FILES NOTHING under this task either — the
    harvest writes an INTAKE record and triage does the filing, which is the same division of
    labour the alert lane has had since W1-T56.

    (3) TRIAGE NEEDS NO CHANGE, AND THIS WAS MEASURED RATHER THAN ASSUMED. `decideTriage`
    (src/lib/triage.ts:308-313) takes `{verdict, changedFiles}` and reads ZERO fields of the
    entry. A whitespace-collapsing vocabulary scan of the RENDERED triage prompt — collapsed
    because the prompt is stitched from wrapped string literals and a single-line grep would be
    unsound — scored `defect` 0, `bug` 0, `broken` 0, `fix` 0, `repro` 0, `regression` 0,
    `symptom` 0, against same-invocation controls `question` 3, `ambigu` 4, `research` 2,
    `propose` 5, `answer` 3. The lane does not assume a defect report; a research-shaped entry is
    squarely in scope.

    (4) TWO BLOCKERS, BOTH IN ONE FILE. `FeedbackOrigin` (feedback.ts:65) is a CLOSED union —
    `FEEDBACK_ORIGINS = ["cli","ui","issue"]` (:48) widened by three regexes (:67, :69, :73) and
    gated by `isValidFeedbackOrigin` (:79-86). MEASURED against the real predicate:
    `isValidFeedbackOrigin('followup#abc')` === false, with same-invocation controls
    `'cli'` === true, `'alert#code-scanning-82'` === true, `'xyzzy'` === false. And
    `FollowupEntry.type` has NO field in `FeedbackEntry`, so research|task|action drops SILENTLY
    unless encoded into `origin` or into `raw`.

    (5) THE DETERMINISTIC ID IS THE MECHANISM, NOT POLISH. `CaptureFeedbackOptions.id`'s own doc
    (feedback.ts:835-838) states that machine-origin intake passes a deterministic id derived from
    the source item "so a re-run's `existsSync` check on that exact path is the whole dedup
    mechanism — no second store". Without it nothing compares content and the same follow-up lands
    fresh every harvest. THE CORPUS ALREADY HAS THIS PROBLEM: re-implementing the repo's own
    `significantWords` + 0.6 containment over all 149 entries (149 opened against 149 from an
    independent enumeration; controls self-match true, nonsense-vs-real false) found 411
    near-duplicate ordered pairs out of 22052 compared, 349 of them where the covering entry was
    ALREADY REJECTED.

    (6) THE CAP IS REQUIRED BECAUSE THE EMISSION RATE IS UNKNOWN. E — distinct new candidates per
    day surviving the openTitles dedup — COULD NOT BE MEASURED: the production ledger was
    unreachable, `report.followups` rows read 0 in the only reachable ledger and that zero is a
    scope artifact rather than an absence. Consumption WAS measured from git log over
    plan/feedback/*.yaml: 5.00/day (7d), 2.86/day (14d), 2.47/day (30d). The backlog is 64 `new`
    of 149 total with a head aged 15.34 days. The best available proxy for E is MASTER-PLAN's
    rendered candidate-pool series across 103 revisions, ~9/day, which would roughly DOUBLE the
    backlog every 10-16 days. An uncapped writer is therefore not shippable on the evidence
    available.

    (7) THE DEPENDENCY IS LOAD-BEARING AND IS NOT A FORMALITY. This change routes MORE work into
    the triage lane. On 2026-08-17 that lane opened NINE PRs for one feedback id and MERGED FOUR
    of them, three with a diff that was empty against their own declared scope. W1-T963 (filed as
    #2085, merged 21:28:50Z, status queued and UNBUILT) is the gate for exactly that: it makes the
    generated triage proof discriminate and refuses an empty diff. Shipping this router before
    that gate lands amplifies a defect whose fix is already filed and sitting in the queue.
  design: |
    THE SHAPE: one new origin arm, one deterministic-id write beside the existing render, one
    policy-bounded cap. No triage change.

    (i) A FOURTH ORIGIN ARM. `FeedbackOrigin` (feedback.ts:65) gains a `followup#${string}` arm and
    `isValidFeedbackOrigin` (:79-86) a fourth `MACHINE_ORIGIN_FOLLOWUP` regex beside the three at
    :67/:69/:73. The regex must be a CLOSED grammar the way `MACHINE_ORIGIN_REPAIR` (:73) is —
    never a permissive catch-all — because it is the only thing that will ever check this value.

    (ii) THE KIND MUST SURVIVE THE CROSSING. `research|task|action` has no field in
    `FeedbackEntry`. Encoding it into the origin (`followup#<kind>-<key>`) keeps the entry shape
    byte-identical to every existing capture and makes the kind recoverable by the same predicate
    that validates the origin. Encoding it into `raw` instead is permitted only if the builder
    states why, because `raw` is what the triage worker reads as the human's own words.

    (iii) THE WRITE GOES BESIDE THE RENDER, NOT INSTEAD OF IT. The candidate list is already
    computed and already deduped where `renderFollowupCandidates` is called (retro.ts:1531, inside
    `renderGather` at :1463). The prompt section STAYS — this task adds a second consumer of the
    same list, it does not replace the first. A builder who deletes the render has changed what
    the Architect sees, which is not this task.

    (iv) THE ID MUST BE CONTENT-STABLE, AND THAT IS WHAT CRITERIA 3 AND 6 TEST. Derive it from the
    candidate's own text and kind, not from the run id — a run-keyed id passes criterion 3 (a
    re-run of the SAME harvest) and fails criterion 6 (a LATER harvest re-offering the same
    candidate), which is precisely the distinction that matters.

    (v) THE CAP IS A POLICY VALUE WITH BOUNDS, following `repairFilingThreshold`'s own shape in
    plan/policy.yaml (`value`/`origin`/`min`/`max` at :434-438). Overflow is LEDGERED, never
    dropped silently: a cap that discards without a trace is indistinguishable from an emitter
    that produced nothing, which is the observability failure this repo has paid for repeatedly.

    (vi) THE FALSIFIER IS A PAIR IN EVERY DIRECTION. "A deduped candidate writes nothing" is
    satisfied perfectly by a writer that never writes; "an entry is created" is satisfied by a
    writer that writes everything. Criteria 1 and 5 must run in the SAME suite invocation so one
    run carries both directions. THE WEAKEST POSSIBLE CRITERION HERE IS "A FEEDBACK ENTRY EXISTS"
    — it passes whether or not the routing worked, and W1-T963 is filed against exactly that class
    of non-discriminating proof.

    (vii) ESTABLISH FROM SOURCE THAT NOTHING PRUNES plan/feedback/. Criterion 6's guarantee is
    path-existence, which holds only while rejected entries persist; 47 of 149 entries are
    `status: rejected` today. THIS RECON'S OWN READING: `git grep -nE 'unlinkSync|rmSync|rimraf'`
    over src/lib/feedback.ts and src/lib/inbox.ts returns two hits, BOTH lock-file reclaims
    (inbox.ts:1102, :1123), against a control of 15 files using `unlinkSync` elsewhere in src/ —
    so nothing appears to prune entries. THE BUILDER MUST RE-ESTABLISH THIS RATHER THAN INHERIT
    IT, and if any pruner or archiver is found, must state in writing what that means for
    criterion 6 before relying on path existence.

    (viii) OUT OF SCOPE, EACH WITH ITS REASON. `src/lib/triage.ts` — rationale (3) shows the lane
    needs no change. The four-call-site emitter gap (only fix/recon/implement can emit follow-ups
    at all; review, sweep, retro, triage and auto-triage cannot) — that governs WHAT IS PRODUCED,
    this task governs where what IS produced goes. `openapi/daemon.yaml` — see the note. And the
    triage lane's re-dispatch behaviour, which is W1-T963's neighbour and not this task's.
