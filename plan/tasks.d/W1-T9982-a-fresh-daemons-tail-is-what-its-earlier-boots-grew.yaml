  design: |
    No new constant, interval, count or byte threshold. Windows and counts come from existing ones or from what the
    record observed.
    1. SAMPLES NAME THEIR GENERATION. FootprintSample gains `boot`, the daemon generation's start (ms since epoch, the
       same instant as its DAEMON-<ms> run id). A sample without it reads as an unknown generation. The series used by
       W1-T9972 counts only samples from the current generation once it has daemonGrowthMinSamples of them. Before
       that it keeps today's behaviour.
    2. A BOOT-GROWTH RECORD. The daemon keeps one entry per generation in its footprint store:
       {boot, first_bytes, peak_bytes, peak_uptime_ms}. It is updated from the samples it already records, with no new
       reading. Entries are kept for the window the heap-ceiling learning already uses (daemon.heap_ceiling_shadow
       window_ms). A failed read or persist is named, never zero.
    3. THE BOOT PHASE IS LEARNED. A generation is in its boot phase while its uptime is below the largest
       peak_uptime_ms among the recorded earlier generations. During it, the own daemon's growth is the largest
       earlier (peak_bytes - first_bytes) less what this generation has already grown (current rss+swap -
       first_bytes), floored at the proc figure. Its typical part is the median of the same remainders. The basis names
       the generations used ("boot-phase: N earlier boots, +X MiB by uptime Y s"). After the phase, or with no earlier
       generation recorded, the rule is W1-T9972's, and the basis says which applied.
    4. The verdict's daemon_growth entry gains `phase`: "boot" or "steady". The reasons, hostReserveMib, the tiers and
       the worker claims are unchanged.
    Tests go in the new file, with titles verbatim as in the proofs. The fixture comes from the three boots above:
    earlier generations at first ~1,000-1,800 MiB and peak ~3,700-4,100 MiB by uptime 230-430 s; a current
    generation at uptime 60 s with VmHWM 985 / VmRSS 979 MiB; MemAvailable 6,637 MiB; an implement start (estimate 3,196 MiB, typical 447,
    as on the 02:39:12Z row); reserve 2,048. Under today's rule the start fits. Under the boot-phase rule it defers on unrealized-reservations.
