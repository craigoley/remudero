  budget_usd: 14.00
  files: [src/lib/worker.ts, test/the-run-length-credential-gate-has-no-callers.test.ts]
  origin: "operator-session#credential-expired-still-firing-after-its-fix-merged-2026-08-30"
  plan_refs: ["W1-T2398", "W1-T2267", "W1-T293"]
