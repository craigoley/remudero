  attempts: 0
  rationale: |
    A CORRECTION FIRST, BECAUSE THE FIRST DRAFT OF THIS SHARD WAS WRONG. It claimed
    `credential_expired` was "a NEW condition, not the steady state", inferred from ONE 150-minute
    daemon log in which two earlier runs pushed normally. The ledger refutes it: twelve
    `credential_expired` rows across FIVE DAYS, 2026-08-26 to 2026-08-30. It is chronic, not new, and
    the correlation that draft drew with the 19:52Z session lockout is dead — the first row predates
    it by four days. Recorded rather than quietly rewritten, because a shard that hides its own
    retraction teaches the next reader to trust an inference that failed.

    AND THE EARLIEST ROW IS NOT AN ONSET. `fallback_push.cause` is the step W1-T2267 introduced
    (merged 2026-08-25T22:54:13Z), so no row can exist before then BY CONSTRUCTION. Reading
    "earliest row 08-26" as "it started on 08-26" is the query-shape zero class — the tool works, the
    corpus is right, and the question the query answers is not the question being asked.

    THE REAL FINDING. W1-T2398 merged 2026-08-27T20:24:45Z ("make the credential expiry margin
    respect run length"). It shipped both halves properly: `deriveProvisionGate` widens the effective
    skew to `Math.max(credentialExpirySkewMs ?? DEFAULT_CREDENTIAL_EXPIRY_SKEW_MS, opts.expectedRunMs ?? 0)`
    (worker-home.ts:1470) and then refuses outright with `credential-too-short-for-run` when even a
    freshly re-provisioned credential cannot outlast the run (1690). Both are gated on
    `opts.expectedRunMs`, and:

      git grep -n 'expectedRunMs' origin/main -- src/
        => 9 hits, ALL in src/lib/worker-home.ts: the declaration (1051), six doc lines,
           and the two use sites (1470, 1690). ZERO call sites.
      POSITIVE CONTROL, same query shape, same options object:
      git grep -c 'credentialExpirySkewMs|priorSpawnCredentialExpired' origin/main -- src/
        => worker-home.ts 6, worker.ts 2   — sibling options DO reach a caller.

    So the query can see callers of options on this object; `expectedRunMs` has none. Its own doc
    states the consequence plainly: "Omitted ⇒ behavior is BYTE-FOR-BYTE what it was before this
    option existed … and this function never refuses on run length." The gate is inert, and has been
    since the day it merged.

    SIX ROWS BEFORE THE MERGE, SIX AFTER — AND THAT IS CONTEXT, NOT THE PROOF. Before
    2026-08-27T20:24:45Z: W1-T2280, W1-T2324, W1-T2379, W1-T2387, W1-T2398, W1-T2332. After:
    W1-T2415, W1-T2347, W1-T2440, W1-T2453, W1-T2491, W1-T2471. STATED HONESTLY: the after-window is
    roughly twice as long, so the per-hour rate did fall by about half, and this shard does NOT claim
    the fix changed nothing measurable — dispatch volume moves that number too. The claim rests on
    SOURCE: a gate whose enabling argument has no callers cannot have caused any change, in either
    direction.

    WHY A PROVISIONING-TIME GATE IS THE RIGHT SHAPE ANYWAY, ONCE WIRED. The measured worker span that
    lost its credential ran `worker_duration_ms: 1556916` — 25.9 minutes, at 400 turns, sonnet/high.
    W1-T2267 recorded the token's stated life as one hour and found 3 of 589 spans already reaching
    it. A run that long against a token already partly spent is exactly the case W1-T2398's second
    arm refuses. Wiring is therefore the whole job here: no new mechanism, no re-authentication, no
    pacing — one argument, from the dispatcher that already knows the mount's `maxTurns` and the
    task's `budget_usd`.

    THE ESTIMATE MUST BE CONSERVATIVE IN THE RIGHT DIRECTION. `expectedRunMs` too LOW re-creates
    today's silent mid-run expiry; too HIGH refuses spawns that would have finished, which is the
    bound-fires-on-a-healthy-condition failure this repo keeps re-learning (W1-T312, W1-T380,
    W1-T382). It is a dispatcher-side estimate by design — worker-home.ts's doc says "never derived
    in here" — so the estimate and its justification belong in the caller, and a refusal must name the
    observed headroom and the estimate that rejected it, never a bare refusal.

    ALSO ALREADY BUILT AND UNREAD: the return field `observedHeadroomMs` (worker-home.ts:1080) exists
    precisely so "the rate this shard's own rationale could not measure from a ledger becomes
    answerable off-host purely by a caller logging this field". Log it at the same call site that
    starts passing `expectedRunMs`; that is what makes the next version of this question measurable
    instead of arguable.

    RE-DERIVE RATHER THAN TRUST THE COUNTS: `rmd ledger-grep 'fallback_push.cause'` over the union,
    filtered to `"cause":"credential_expired"`, ordered by ts. Print the corpus's newest row beside
    the answer, and remember the step does not exist before 2026-08-25T22:54Z.

    NOT IN SCOPE: the fallback push itself, which works and must keep working; its `force: true`,
    which is correct on a `run-<taskId>-<epochMs>` branch that one run owns; and refreshing a
    credential mid-run, which is a different mechanism from refusing a doomed spawn.

    THE RISK BAND IS RULE 19'S SPAN: one src stem plus a test is narrow, and the linter refuses that
    pair at `risk:medium`, so the band is set high up front. Blast radius is real but bounded — a
    wrong estimate refuses spawns — which is why the estimate's direction is an acceptance criterion.
  acceptance:
    - claim: "the dispatcher passes an expectedRunMs to worker keychain provisioning"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "a credential that cannot outlast the estimate refuses the spawn before it starts"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "the refusal names the observed headroom and the estimate that rejected it"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "a credential with ample headroom spawns exactly as it does today"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "a credential carrying no recorded expiry is never invented one and is not refused"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "observedHeadroomMs is logged on every provisioning call, supplied estimate or not"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "re-provisioning from the keychain is still attempted before any refusal"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
    - claim: "removing the expectedRunMs argument makes the refuses-a-doomed-spawn assertion fail"
      proof: "unit test: test/the-run-length-credential-gate-has-no-callers.test.ts"
