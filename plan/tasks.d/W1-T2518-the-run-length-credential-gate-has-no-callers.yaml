  title: "W1-T2398 SHIPPED A COMPLETE RUN-LENGTH CREDENTIAL GATE AND NOTHING PASSES `expectedRunMs` — the option appears ONLY inside worker-home.ts (its declaration, its docs, and its two use sites at 1470 and 1690) and at zero call sites, and its own doc states that omitting it is 'BYTE-FOR-BYTE what it was before this option existed', so the merged fix for mid-run credential expiry has never once executed"
  repo: remudero
