  note: |
    `risk: medium` — the declared paths reach ONE concern (the installation-token refresh loop) plus
    its own new test file, which is inside Rule 19's span for medium. The blast radius is one
    timeout, one restructured reschedule, and no change to any other arm.

    TWO MILDER FINDINGS ARE CARRIED HERE AS DESIGN NOTES RATHER THAN AS SEPARATE SHARDS, AND THE
    REASON IS THE SAME FOR BOTH: neither changes a verdict, so neither earns the serialisation cost
    of its own task against the same file.
      - `readKey`'s catch answers the IDENTICAL `"private key unreadable"` for a MISSING file and an
        UNREADABLE one. That is the same ENOENT/EACCES conflation that produced two real fail-opens
        on 2026-08-20 (`spawnSync` returning `status: null` on a signalled child read as success,
        and `readdirSync` answering `[]` to both ENOENT and EACCES). HERE IT IS STRICTLY MILDER:
        both arms are failures, both log, and both degrade the same way, so it costs an operator
        diagnostic precision — "wrong path" versus "wrong permissions" — and never correctness.
      - An unparsable `expires_at` silently substitutes `now + INSTALLATION_TOKEN_LIFETIME_MS`
        without naming the substitution, so a malformed expiry is indistinguishable in the ledger
        from a well-formed one-hour token.
    An implementer who is already editing this module may fix either in passing; neither is
    required by this task's acceptance, and neither should widen `files:`.

    THE MEASUREMENTS ARE QUERIES. Re-derive the two gaps with
    `git grep -cE 'AbortSignal|AbortController|timeout' -- src/lib/github-app.ts` against a `fetch`
    control, and `git grep -cE '\.catch\(' -- src/lib/github-app.ts` against a `.then(` control;
    confirm `appendLedger`'s shape by reading its `try`/`finally` directly. Ledger figures need the
    per-form union read with a coverage control taken first.
