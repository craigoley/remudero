  rationale: |
    READ at origin/main db88033a3 (2026-10-16):
    - src/lib/proof-amendment.ts `requestScopeAmendment`:
      `if (existing?.merged) { const result = deps.updateBranch(request.prUrl, request.headSha); return { kind: "branch_update_requested", ...result }; }`
    - src/run-task.ts `runFixRung`, before a strike: a `fix.scope_amendment` row at `priorHeadSha` with outcome
      created/resumed/branch_update_requested (`pendingScope`) calls `amendScope(paths, paths, priorHeadSha)`, then
      always returns `{ outcome: "stood_down", ..., reason: "awaiting scope amendment branch update" }`. No worker
      is dispatched. The next fix round needs CI's verdict on the head GitHub's merge makes, and that verdict is the
      same red the earlier round already diagnosed as needing the widened scope.
    - W1-T9802's shard names this as NOT IN SCOPE and "a separate lead with a different fix": "After the release,
      `requestScopeAmendment` updates the branch and the round stands down to wait for CI on the new head
      (11:42:59Z `branch_update_requested`, head c7fc5e6). That costs one more CI cycle for a red already
      diagnosed."
    - #12289's branch: 201349cf5 (amendment #12292) merged on main 11:24:40Z; c7fc5e68b "Merge branch 'main' into
      run-W1-T9541-..." 11:42:58Z by remudero-fleet[bot]. The operator tracker (D4) records the wait as 35 min.
    - W1-T9561's census of 10-04..14 counts 15 created scope amendments and 1 `branch_update_requested`.
    - NOT COVERED: W1-T9802 releases the round at the amendment's merge. W1-T2671's base refresh is the red-on-base
      arm, not the amendment arm. No open head changes the `pendingScope` block or the `existing?.merged` arm.
    AMENDED 2026-10-17 by filing agent F17 (item 5), filed here instead of as a new task because it is the same arm:
    THE WORK THAT ASKED FOR SCOPE IS LOST. #12575 (W1-T9877), core ledger 14:46Z and 17:04Z archives:
    - 15:26:28Z fix.dispatch; 15:27:03Z fix.scope_amendment created for src/lib/rule-suites.ts (the fix worker wrote
      the file, so `changedPaths` admitted it; W1-T10026 is the implement lane's gap that left it out at 11:46Z).
    - The amendment (#12599) merged; 16:29:06Z fix.scope_amendment branch_update_requested paths
      [src/lib/rule-suites.ts]; the branch update made head 7518991a5. The file existed only in the 15:26Z round's
      worktree, so the merge brought back nothing.
    - 16:37:38Z a fix round was prepared at 7518991a5 and then waited in memory admission (W1-T10069); no round wrote
      the file. X2 restored src/lib/rule-suites.ts by hand (fdd483f99, 18:15Z).
    So even with step 2's same-pass strike, the worker starts from a tree that lacks the file the amendment was for,
    and must re-derive it from the red.
  design: |
    1. THE OUTCOME. In `requestScopeAmendment`, the `existing?.merged` arm returns a new
       `{ kind: "amendment_merged", amendmentNumber }` and no longer calls `deps.updateBranch`. The update-branch
       call moves to the caller's fallback (step 3).
    2. SAME PASS. In runFixRung's `pendingScope` block, on `amendment_merged`:
       - fetch and merge `refs/remotes/origin/main` into the round's worktree with the harness's own merge. The
         widened `files:` is then on the worktree's plan, and the merge commit is the round's base.
       - fall through into the ordinary strike against the same red the round already has (`currentCiFailures`
         at `priorHeadSha`, which is still the PR head). Do not stand down.
       The strike's push carries the merge and the fix together, so CI runs once.
       Ledger `fix.scope_amendment` outcome `amendment_merged` with `merged_locally: true` and the merge sha.
    3. FALLBACK. If the local merge conflicts or cannot run, keep today's behaviour: call `deps.updateBranch`, ledger
       `branch_update_requested` with the reason, and stand down. A conflict then reaches merge-conflict mode on the
       next pass as today.
    4. No new strike accounting: the dispatched strike counts like any other. The amendment dedupe key is unchanged.
    4a. CARRY THE ASKING ROUND'S WORK (F17 amendment). When a round's NEEDS_SCOPE opens or resumes an amendment, the
       parent saves that round's working-tree content for exactly the requested paths (verified, under config.root
       recovery as W1-T7719's preserve does, keyed by task, PR and amendment). In the same-pass strike of step 2, after
       the local merge, those paths are restored into the round's worktree before the worker runs, and the worker's
       evidence names them as restored from the round that asked for scope. The ordinary harness commit then stages
       them (they are now declared). A missing or unverifiable save is named on the `fix.scope_amendment` row and the
       worker's evidence names the paths the merged amendment admitted, never silence.
       W1-T10070 needs the same save for a build that stops before its PR exists; build the save and restore once,
       in whichever of the two lands first.
    5. Tests (new file, `test(` titles verbatim as in the proofs below). They drive `runFixRung` with fakes, and drive
       `requestScopeAmendment` directly:
       - a ledger shaped like #12289's round (`fix.scope_amendment` created at head H, its identity recorded merged)
         dispatches a fix strike in the same invocation. `updateBranch` is never called, and the push's parent
         includes origin/main;
       - a local merge that conflicts falls back to `updateBranch` and stands down as today;
       - `requestScopeAmendment` with a merged identity returns `amendment_merged` and calls no update.
       - #12575's shape (an amendment for src/lib/rule-suites.ts, written only by the asking round) restores the saved
         file into the same-pass strike's worktree before the worker runs.
