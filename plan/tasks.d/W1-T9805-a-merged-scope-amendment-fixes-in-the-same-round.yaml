    - claim: "a local merge that cannot complete falls back to the branch update and stands down"
      proof: 'grep: test("W1-T9805: a conflicting local merge falls back to the branch update" in test/a-merged-scope-amendment-fixes-in-the-same-round.test.ts'
    - claim: "the amendment writer reports a merged amendment without updating the branch itself"
      proof: 'grep: test("W1-T9805: a merged amendment identity is reported, not branch-updated" in test/a-merged-scope-amendment-fixes-in-the-same-round.test.ts'
    - claim: "the file the asking round wrote is restored into the same-pass strike once its amendment merges"
      proof: 'grep: test("W1-T9805: the file the asking round wrote is restored once its amendment merges" in test/a-merged-scope-amendment-fixes-in-the-same-round.test.ts'
  falsifier: |
    At origin/main, runFixRung over a ledger with a `fix.scope_amendment` created row at the PR head and an identity
    store reading it merged returns `stood_down` "awaiting scope amendment branch update" after one `updateBranch` call,
    and dispatches no worker, so the first test fails. The fourth fails because nothing saved src/lib/rule-suites.ts
    when the amendment opened, so the worktree after the merge does not hold it.
