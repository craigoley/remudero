      proof: 'grep: test("W1-T8621: the census names a live decision step read through a constant that rotation does not retain" in test/every-live-ledger-decision-step-survives-rotation.test.ts'
    - claim: "a classified exemption is honoured only when its class holds, and a stale exemption fails"
      proof: 'grep: test("W1-T8621: an exemption is honoured only when its class holds and a stale one fails" in test/every-live-ledger-decision-step-survives-rotation.test.ts'
    - claim: "a step listed twice in the retained set literal is refused"
      proof: 'grep: test("W1-T8621: a step listed twice in DECISION_RELEVANT_LEDGER_STEPS is refused" in test/every-live-ledger-decision-step-survives-rotation.test.ts'
    - claim: "a quiet worker is still reported by the stall detector after a rotation, and only once per episode"
      proof: 'grep: test("W1-T8621: the stall detector still sees a quiet worker after a rotation" in test/every-live-ledger-decision-step-survives-rotation.test.ts'
    - claim: "a code-scanning ruling survives a rotation and the head is not judged again"
      proof: 'grep: test("W1-T8621: a code-scanning ruling survives a rotation and the head is not judged again" in test/every-live-ledger-decision-step-survives-rotation.test.ts'
    - claim: "the stall-dedup step is in the retained set with its reader named"
      proof: 'grep: "worker\.stalled", // in src/lib/ledger.ts'
  falsifier: |
    Remove `code_scanning.judged_false_positive` from the retained set, and the census names it at
    codeScanningGateForHead, and the code-scanning rotation test judges the head a second time. Remove `worker.state`,
    and the stall-detector test finds no candidate after rotation. Restore the old literal-only regex, and the positive
    control reads nothing. Add a second `"refresh.clearance"` line, and the duplicate test names it.
  note: |
    EFFECT, measured after merge from the core ledger with no fixed pass mark: count `worker.stalled` rows per quiet
    episode, and `code_scanning.judged_*` rows per PR@head. Healthy shape: one each, whether or not a rotation fell
    inside the episode or between the ruling and the arm.
