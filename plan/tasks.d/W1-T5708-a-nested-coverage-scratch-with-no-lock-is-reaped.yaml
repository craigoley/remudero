  plan_refs: [W1-T5655, W1-T4526, W1-T5707, W1-T5709, W1-T5550]
  files: [deploy/rmd-host-cleanup.sh, test/a-nested-coverage-scratch-with-no-lock-is-reaped.test.ts]
  status: merged
