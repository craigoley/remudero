  rationale: |
    OBSERVED ON THE LIVE CONSOLE FLEET. UI-T43 and UI-T46 each consumed a successful, billed
    implement run, reported that their declared edits and tests were complete, and then ended
    `no_pr` with zero commits ahead. Both reports explicitly expected the harness to commit and
    publish their work. Neither carried the anchored `COMMIT_MESSAGE:` line required by the
    shell-less harness contract. UI-T46 has the decisive companion receipt:
    `implement.harness_commit_refused reason="no anchored COMMIT_MESSAGE line in the report"`.
    The worktrees were subsequently removed, so the completed edits are gone while the task rows
    remain permanently excluded by `dispatch.blocked_independent verdict=no_pr`.

    THIS IS NOT A BLIND RETRY OF no_pr. A shell-capable worker that commits nothing, an
    ALREADY_SATISFIED claim, an unverified or refuted board read, an undeclared-path refusal, and
    a worker with no evidence of the harness refusing its own commit are all materially different
    outcomes. W1-T3696 deliberately forbids the harness from inventing a commit subject; its
    existing prompt and `harnessCommitForShellLessWorker` must remain authoritative. The narrow
    new fact is that the fleet, rather than the worker, made the publish step impossible after
    substantive work had already been performed.

    THE CURRENT REPRESENTATION CANNOT EXPRESS THAT FACT. `harnessCommitForShellLessWorker`
    writes `implement.harness_commit_refused`, but the implement terminal row is still the generic
    `verdict=no_pr`; daemon.ts writes the generic durable independent-failure block; and
    `latestIndependentFailureBlock` in status.ts reads only that latter row until a later
    `run.start` supersedes it. The helper receipt is not a decision-relevant retained row, so a
    future reader cannot safely decide from it after rotation. W1-T3868 repaired the analogous
    fix-rung outcome, but the implement terminal path and its scheduler block are separate.

    DUPLICATE-SURFACE RULING. This deliberately declares the four source sites together because
    one safe retry requires one producer outcome, one scheduler write, one status reader, and
    rotation retention. The broadly overlapping W1-T12a, W1-T75, W1-T115, W1-T143, W1-T147,
    W1-T151, W1-T160, W1-T298, and W1-T3793 records cover generic terminal behavior, status,
    daemon operation, ledger mechanics, or reloads; none names the paired harness-refusal
    predicate plus a one-time retry marker. Their overlap is real and retained in `plan_refs`, not
    hidden by dropping load-bearing files from this task's declared surface.
  design: |
    (i) Preserve the helper's refusal reason as FIRST-CLASS IMPLEMENT OUTCOME EVIDENCE. When a
    shell-less implement spawn reaches the no-PR guard after the harness refused its commit, the
    terminal result/ledger must carry a distinct, explicit harness-commit-refused classification
    derived from the helper callback. Keep the existing `implement.harness_commit_refused` row;
    do not parse worker prose or synthesize a commit subject. A shell-capable no-PR result remains
    the ordinary no-PR path.

    (ii) Re-admission must require the exact paired evidence, not a report excerpt. The status
    projection may release an independent `no_pr` block only if the same task's terminal no-PR
    outcome explicitly records the harness-commit-refused class (or a legacy companion helper row
    supplies that exact producer-owned evidence), and no earlier retry marker has spent the one
    retry. Unknown fields, absent rows, ALREADY_SATISFIED, and every other no-PR shape remain
    durably blocked exactly as today.

    (iii) Make the one retry durable and ordered. Immediately before the daemon re-offers an
    eligible task, write exactly one `dispatch.harness_commit_retry` row identifying its task and
    original refusal. The status reader must treat that marker as spent even after the retry's
    `run.start`, so a second no-PR/refusal is blocked rather than becoming a per-sweep spender.
    A PR-bearing retry takes the existing success path unchanged. Do not erase, rewrite, or
    backfill either the original block or the original transcript.

    (iv) Retain every ledger step a later decision reads. The terminal refusal classification,
    the helper receipt when used for legacy recovery, and the retry marker must be declared in
    `DECISION_RELEVANT_LEDGER_STEPS` where appropriate, with direct consumer-visible comparisons
    so the rotation derivation test can prove the status decision survives normal rotation.

    (v) Preserve all existing containment: declared-path-only staging, the worker-supplied
    anchored commit message, the independent-failure block for all non-matching outcomes,
    lifetime-dispatch accounting, queue cadence, and `run.start`'s normal meaning. This task does
    not re-run lost work itself, reset a lifetime cap, widen shell authority, or make a generic
    no-PR retriable.
  acceptance:
    - claim: "the implementation preserves a producer-owned harness commit boundary instead of parsing worker prose"
      proof: "grep: harnessCommitForShellLessWorker in src/run-task.ts"
    - claim: "the implementation changes the durable independent-failure decision at its status projection seam"
      proof: "grep: latestIndependentFailureBlock in src/lib/status.ts"
    - claim: "the one-time reoffer is emitted by the daemon rather than guessed from a terminal worker report"
      proof: "grep: dispatch\\.blocked_independent in src/lib/daemon.ts"
    - claim: "the non-matching already-satisfied path remains a distinct terminal route"
      proof: "grep: already_satisfied in src/run-task.ts"
    - claim: "the decision's persistence boundary is explicit in the ledger retention set"
      proof: "grep: DECISION_RELEVANT_LEDGER_STEPS in src/lib/ledger.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTING if a current status projection already distinguishes a generic
    independent no_pr from an exact harness-commit refusal and re-offers the latter once with a
    durable spend marker. At filing it does not: the status reader only sees
    `dispatch.blocked_independent`, while the producer-only helper receipt is separate and the
    historical console tasks remain blocked.

    THE LOAD-BEARING NEGATIVE ARM is an ordinary no_pr: delete the exact refusal classification
    from the fixture while leaving the worker report, cost, task, and generic no_pr unchanged.
    The task must remain blocked. A fix that passes that mutated fixture has converted all no_pr
    outcomes into retries and is wrong.

    THE SPEND ARM is a second matching refusal after a retry marker. Delete the marker check and
    the test must expose a second dispatch; restore it and the second dispatch must disappear.
    A test that only proves a first re-offer cannot distinguish the intended one-time recovery
    from an unbounded queue loop.
  note: |
    Rule 25 CHECKED: none of `src/run-task.ts`, `src/lib/daemon.ts`, `src/lib/status.ts`, or
    `src/lib/ledger.ts` is an instrument surface. The new test is product-path evidence; no
    baseline, workflow, review, or mutation configuration rides with it.
    `risk: high`, `band_meaning: blast-radius` because the decision governs whether a failed
    implementation becomes eligible for another paid worker run. The implementation must make
    the retry narrower, not cheaper-looking by silently admitting unrelated no-pr outcomes.
