    `sed -n '1774,1777p' MASTER-PLAN.md | grep -oE "\bP[0-9]+\b" | sort -u | wc -l`. If it is not
    31, the premise has moved and the ruling should be re-argued on the current number.
    A RULING IS NOT SATISFIED BY BUILDING (a). This task's `files:` is `DECISIONS.md` alone; the
    migration is a separate task that cites the ruling, and a builder who ships `plan/proposals.d/`
    here has decided the question the operator was asked.
  note: |
    PRECEDENT, FOUND BY AUDIT 2026-09-08. W1-T2458 ("THE FLEET MINES ITS OWN NEXT-WORK LIST THROUGH
    FIVE SYMBOLS AND DEPOSITS IT IN A MARKDOWN SECTION NO RUNG READS") is `status: merged` — the
    SAME defect shape as this ruling, on a DIFFERENT corpus: followups rather than retro proposals.
    It was found, filed and FIXED, and `routeFollowupsToRegistry` is the resulting consumer.

    THAT STRENGTHENS THIS RULING RATHER THAN DUPLICATING IT, and it also narrows it: the question is
    no longer "should mined prose become records" — this repo has already answered that once, in the
    affirmative, and shipped it. The question is whether the retro-proposal corpus takes the SAME
    route (option (b), `updateProposalRegistry`, the very writer W1-T2458 used) or its own record
    type (option (a)). An operator ruling should say why proposals differ from followups, if they do.
    verify: human because no test can establish that a shape is the right one — only that an entry
    exists. The three grep proofs are absent TODAY by construction (each measured at 0 above), so
    they discriminate: they can only pass once the ruling is written.
