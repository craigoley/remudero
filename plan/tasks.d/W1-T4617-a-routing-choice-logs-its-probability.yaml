  rationale: |
    MEASURED 2026-09-27 over the three fleets' full ledger unions (core 773,650 / console 356,871 /
    site 269,728 rows, 2026-09-20..27) and origin/main 12baa03. `selectWorkerProvider` weights
    candidates by (headroom - reserve)^2 but picks with a module-level golden-ratio counter, so the
    choice is deterministic and time-of-day correlated and no selection probability exists. The
    `sol-vs-sonnet` A/B unit is the spawn, not the task: 26 of 56 tagged tasks (46%) landed in both
    arms (Fisher p~0.40 on the reported merge rates). `worker.assignment` already records the
    candidate set and eligibility, so only the draw and its probability are missing to make ordinary
    routing usable for inverse-propensity / doubly-robust estimates.
  design: |
    Keep the same weights, but draw with a seeded pseudo-random generator whose seed is derived from
    (task id, attempt, decision point) and record on `worker.assignment` the per-candidate selection
    probability, the drawn value and the seed. Experiments key their arm on the task (stable across
    retries and fix rungs) and record intention-to-treat. The expected share each provider receives
    is unchanged; a probability that cannot be computed is recorded as unavailable. No routing
    policy change beyond replacing the deterministic counter.
  acceptance:
    - claim: "every routed assignment records per-candidate selection probability, draw and seed, and an experiment keeps one arm per task across retries and fix rungs"
      proof: "unit test: test/a-routing-choice-logs-its-probability.test.ts"
  falsifier: |
    Revert the change: the task's own test fails on the gap its rationale measured.
