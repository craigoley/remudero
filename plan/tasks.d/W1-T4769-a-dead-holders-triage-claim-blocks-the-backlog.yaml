- id: W1-T4769
  title: "A DEAD HOLDER'S TRIAGE CLAIM STALLS THE WHOLE FEEDBACK BACKLOG — release a claim whose holder shows no liveness evidence past a bounded window, and when the oldest entry is held by a live claim triage the next unclaimed one instead of ending the pass"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1
  budget_usd: 25.00
  risk: high
  band_meaning: span
  origin: "operator report 2026-09-29: refs/rmd-triage/fb-1789237820690-d3ce67 and fb-1789955906700-8768c6 held by dead containers stalled a 44-entry feedback backlog"
  plan_refs: [W1-T1132, W1-T2289, W1-T469]
  files:
    - src/lib/auto-triage.ts
    - src/run-task.ts
    - docs/forensics/auto-triage.md
