  note: |
    verify:auto — every criterion is decidable in-process over text: a pure check with a red fixture
    and a green one, plus the existing registry/reference sync suite. Nothing here asks the operator
    to rule on anything; the one question that DOES need a ruling (opt-in vs opt-out fast-forward) is
    deliberately left with W1-T446/W1-T924 rather than smuggled in behind a docs change.

    risk:high IS RULE 19's SPAN, NOT BLAST RADIUS. `subsystemsOf` reads `files:` plus acceptance text
    and this set crosses `docs/`, `src/`, `test/` and `plan/`; `sizingViolation` blocks at >=2
    subsystems while risk<high, so the band is raised up front — same call W1-T907 made for the same
    span. The actual change is prose plus one pure function.

    `src/run-task.ts` IS DECLARED AND UNAVOIDABLE: `docs/cli-reference.md` is GENERATED from the
    `COMMANDS` registry that lives there, so the `READ-ONLY: writes nothing, spawns nothing` blurb
    cannot be corrected anywhere else without the two surfaces disagreeing. That file is the repo's
    known serialiser (W1-T471) and the cost is accepted rather than hidden.
    `test/cli-reference.test.ts` IS DECLARED because the fourth criterion names it: an undeclared
    proof path is exactly the `proof-scope` warning W1-T1134's note took rather than argued with.
    `plan/claims.yaml` IS DECLARED because design (iv) wires the new check in by name, which is the
    W1-T213 mechanism that makes the check a CI gate rather than a test nobody runs.

    THE QUOTED DOC LINES ARE QUERIES, NOT CONSTANTS. Re-derive them with a grep for `ead-only` and
    `EAD-ONLY` under `docs/` before writing; the two quoted in rationale (3) were read at triage and
    the surrounding tables move weekly. THE CONDITION LIST IN RATIONALE (2) MUST ALSO BE RE-READ FROM
    `src/lib/self-sync.ts` rather than copied from here — W1-T446 is queued against that exact
    predicate, and a doc that states a stale condition is the same defect wearing a fix.
