  rationale: |
    READ at origin/main 6bdb26420 (symbols in src/lib/board-projection.ts):
    - createBoardProjection's sql.taskFacts selects `seq, ts_ms, step, body FROM fact WHERE task_id = ? AND
      seq <= ?` (plus fact_alias rows) with BOARD_UNREAD_STEPS excluded.
    - storeIndex's taskBucket(id) runs it for each task the update re-derives, JSON-parses every body, adds the
      run stand-in rows (runSql.worker, runSql.activity) and sorts by (ts_ms, kind, seq). Nothing is kept between
      indexes (W1-T9436 releases the rows with the update, for memory).
    - A task re-derives on its own fact rows, a clock rule (BOARD_CLOCK_REDERIVE_MS, 30 s, for projections that
      age with the clock), its GitHub reads (W1-T6016) and cross-task rows. The clock rule alone re-derives the
      same tasks every 30 s, re-reading the same history each time.
    - W1-T9604 (queued, PR #12121 open) caches the STEP buckets the same way this task would cache task buckets,
      and explicitly leaves taskFacts out (its design step 5). This task depends on it and reuses its merge and
      safety rules.
    OBSERVED, core ledger 2026-10-15 12:00-19:17Z, read_model.now_slow_stage rows for instance core (thread views):
    325 slow board stages, median 7.8 s, max 87.7 s, 4,486 s in total (snapshot: 160, 1,007 s).
    OBSERVED offline by the W1-T9604 builder (#12121, head f5ef8e690; synthetic store of 779k fact rows and 4,085
    tasks, 13 now-view builds per arm, bodies byte-identical between arms; logs-8864/W1-T9604-bench): a steady build
    reads 106.4 MB on main and 71.3 MB with W1-T9604; taskFacts task buckets are 67.0 MB of each, ~94% of what is
    left. A full re-derive after a daemon.boot row read 1,238 MB on main and 1,161 MB at head.
    INFERRED: the same ~7x page amplification the step reads had (bodies scattered by seq across pages) applies to
    task buckets; extending a cached bucket reads only the rows past its high seq.
  design: |
    1. A task-bucket cache inside createBoardProjection, beside W1-T9604's step cache: for a task, its parsed fact
       rows in (ts_ms, seq) order and the highest seq read, for the task_id and alias reads alike.
    2. Extend, never re-read: a later index reads only `seq > cached AND seq <= upTo` for that task (and its alias
       rows) and merges them by (ts_ms, seq), since a late row can sort before rows held. Run stand-ins are rebuilt
       per index as today unless the builder shows they extend the same way.
    3. Bounded to hot tasks. The cache keeps the tasks re-derived most recently and evicts by recency. The bound
       (entries or bytes) is an OPERATOR DECISION; the PR proposes a value from the measured re-derive set and the
       bytes held, and names it.
    4. Safety, as W1-T9604: a store whose max seq or digest reads behind the cache drops it; rows stay
       withoutUnreadFields and interned; a reader that mutates a handed-out row gets copies. The board oracle is
       unchanged and audits cache vs uncached (A/A).
    5. Measure: the board stage's step_cache (W1-T9604) gains `task_cache: {hits, extended_rows, full_reads,
       evictions, bytes}` so the fleet reads the saving per build.
    Tests go in test/a-re-derived-task-extends-its-cached-history.test.ts, titled verbatim as in the proofs, over
    createBoardProjection with a real in-memory fact store.
