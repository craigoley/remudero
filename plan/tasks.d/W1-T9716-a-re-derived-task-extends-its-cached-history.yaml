      proof: 'grep: test("W1-T9716: the task cache evicts the least recently re-derived task at its bound" in test/a-re-derived-task-extends-its-cached-history.test.ts'
    - claim: "every now-view body over a run of appends is byte-identical with the cache on and off"
      proof: 'grep: test("W1-T9716: now-view bodies are identical with the task cache on and off" in test/a-re-derived-task-extends-its-cached-history.test.ts'
