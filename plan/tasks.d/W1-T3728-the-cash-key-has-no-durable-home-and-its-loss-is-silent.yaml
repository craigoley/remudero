      proof: "grep: RMD_OPENWEIGHT_API_KEY_PATH in deploy/runtime-env-vars.sh"
    - claim: "a configured-but-unspendable cash lane is reported as a distinct state, not as a healthy fail-open"
      proof: "grep: unspendable in test/the-cash-lane-reports-whether-it-can-spend.test.ts"
    - claim: "the reported state cannot be produced without actually consulting the key, so a green reading means a real one"
      proof: "grep: key is absent in test/the-cash-lane-reports-whether-it-can-spend.test.ts"
