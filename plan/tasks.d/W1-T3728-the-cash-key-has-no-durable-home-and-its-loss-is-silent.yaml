- id: W1-T3728
  title: "THE CASH KEY LIVES ONLY INSIDE THE RUNNING CONTAINER, SO A REPLACEMENT LOSES IT AND ONLY AN OPERATOR CAN RESTORE IT — and every lane that needs it fails OPEN, so the loss is silent"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  risk: high
  budget_usd: 15.00
  files: [deploy/runtime-env-vars.sh, deploy/recycle-container.sh, src/lib/doctor.ts, src/lib/report-commands.ts, test/recycle-container.test.ts, test/the-cash-lane-reports-whether-it-can-spend.test.ts]
  origin: oper#squeeze-readiness-audit-2026-09-17
  plan_refs: ["W1-T3575", "W1-T3692"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED ON THE LIVE FLEET 2026-09-17. `docker inspect remudero-daemon` carried GH_APP_ID,
    NODE_OPTIONS, RMD_RESTART_THROTTLE_S and RMD_FRESHNESS_RESTART_MAX -- and NOT
    RMD_OPENWEIGHT_API_KEY. The cash lane had therefore been dead since 2026-09-15, the last day
    state/openweight-allowance.json records any spend ($0.9270 settled across 104 requests).

    TWO INDEPENDENT DEFECTS, AND THE SECOND IS WHY THE FIRST RAN FOR TWO DAYS.

    (1) THE KEY HAS NO DURABLE HOME. `deploy/entrypoint.sh` reads runtime variables from the
    environment at call time and writes them nowhere, and `recycle-container.sh` captures them from
    the RUNNING container -- so once a container is replaced without the key in the invoking shell,
    it is unrecoverable by the tooling. recycle-container.sh's own header states this for GH_TOKEN
    and notes the remedy already taken for GitHub: App auth uses ids plus a private-key FILE on the
    host (GH_APP_PRIVATE_KEY_PATH) that OUTLIVES THE CONTAINER ENTIRELY. The same shape is available
    here and was never applied.

    (2) THE LOSS IS SILENT BY CONSTRUCTION. Every lane mounts.yaml routes to cash fails OPEN on a
    spawn error, on purpose and correctly: escalation_judge returns `deliver`, verify_human_judge
    resolves to the permissive verdict. So a dead adapter shows MORE, never less, and nothing
    alarms. The live evidence is an escalation.judged row from 2026-09-17T09:38 reading "judge
    output carried no parseable ESCALATION_JUDGE_DECISION -- failing open to deliver". Fail-open is
    the right contract for a judgement; it is the wrong contract for a CAPABILITY, and nothing
    distinguishes the two today.

    THE HEARTBEAT IS THE OBVIOUS HOME FOR (2) and reports none of it: heartbeat.txt carries
    daemon/dispatch/supervisor/ledger/disk/gc verdicts and NO provider posture at all.

    DO NOT FIX THIS BY MAKING THE JUDGES FAIL CLOSED. That would convert a missing key into refused
    rulings and hidden work, which is the outcome the fail-open contract exists to prevent. The
    capability check belongs beside the key, not inside the judgement.

    RULE 19 SIZING: risk:high. The linter counts three concerns (doctor, recycle-container,
    runtime-env-vars) and the two HALVES named above are genuinely separable -- a dispatcher may
    decompose into (1) the durable key home and (2) the posture reading. They are filed together
    because half of this fix is a trap: a durable key nobody can verify is exactly the state that
    ran unnoticed for two days. The band is raised because this changes credential handling on
    the live fleet host, which is what risk:high is for.

  acceptance:
