  rationale: |
    WHY: two copies of the same text walk can drift. W1-T9660 asked for one walk so that the census and
    the SRE-lane test "cannot disagree"; today that holds only because the copies are the same text.
    READ at origin/main ef8b74910:
    - test/helpers/daemon-loop-walk.ts:224 exports codeOnly; :267 regexLiteralEnd; :282-287 censusWalk and
      loopCensusFunctions.
    - test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts:616 has its own codeOnly, :659 its own
      regexLiteralEnd, and :374-379 its own censusWalk and censusFunctions. A diff of the two codeOnly and
      the two regexLiteralEnd bodies shows they are the same. :23 already imports other names from the
      helper.
    Low value, but cheap: delete about 70 lines and add one import.
    W1-T9736 (queued) also edits the census test, to change how the walk reads property names. This task
    changes no walk behaviour; it only removes the copies, so W1-T9736 then has one place to change.
  design: |
    INVARIANT one-walk: the census and the helper use one codeOnly and one census walk.
    1. In the census test, delete codeOnly, regexLiteralEnd, censusWalk and censusFunctions, import codeOnly
       and loopCensusFunctions from the shared helper module, and call loopCensusFunctions where the
       test called censusFunctions.
    2. No change to the shared helper module.
    3. The new test reads the census test source (strings and comments stripped) for the declarations and
       the import in criteria 1 and 2, and runs the codeOnly cases of criterion 3 against the helper's
       codeOnly.
    @not-a-rule-suite: the new test checks the census test's imports; it is not a census, ratchet or baseline.
  falsifier: |
    Leave the local copies: criterion 1 fails. Keep a local censusWalk cache: criterion 2 fails. Change the
    codeOnly output while moving it: criterion 3 fails.
