    depends_on IS DELIBERATELY EMPTY, and the reason matters. The claims machinery this task
    consumes — `plan/claims.yaml` with its documented schema, `scripts/claims-check.mjs`, and
    `test/claims-check.test.ts` — was verified PRESENT ON DISK at filing. Its plan record (W1-T29)
