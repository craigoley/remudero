    A SEPARATE FINDING, NAMED AND NOT FILED, because it is a different concern and I verified only
    half of it: the duplicate-id guard is loud but its failure mode is fleet-wide. `run-task.ts`
    records verbatim that when a duplicate DID land on main, `loadPlan` refused the base tree and
