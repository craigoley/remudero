  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`; `sizingViolation`
    (`src/lib/task-linter.ts`) refuses `medium` at two subsystems. The blast radius is one call site.
    `verify: human` — design (ii) offers four incompatible directions and this shard picks none.
    `src/run-task.ts` IS DECLARED RELUCTANTLY AND ONLY BECAUSE THE ARM CALL SITE GENUINELY LIVES THERE
    (`triageCommand`, beside `armAndLogOutcome`). The cost is real and recorded rather than hidden: at
    19,588 lines, every task declaring it serialises against every other that does (W1-T471), which is
    why `files:` is held to TWO paths. IF THE RULING IS DESIGN (iii) — DOCUMENT, DO NOT CHANGE — THEN
    THIS `files:` IS WRONG AND MUST BE CORRECTED TO THE DOC PATH BEFORE DISPATCH, or
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) will fail the PR on a declared path the
    implementation never touched.
    EVERY CRITERION IS `unit test:` ON PURPOSE. A shard whose proofs are ALL `grep:`
    patterns against its own file caps its own implementation at `proof_exec: 0/N` and needs an
    operator override to proceed — that happened to #1812 today. An earlier draft pinned the
    implement-lane comparison with a `grep:` against this shard's OWN path; `proof-scope` warned that the
    scope guard would refuse a branch touching it, and adding that path is forbidden (it converts the
    endemic warning into a hard `rule15-filing` violation), so the claim became a test instead.
    PROVENANCE, PER NUMBER. The arm timestamps, the merge time and the two PR file lists are GitHub
    API reads and are host-independent. The 744/179/128 arm counts and the 70-run cost distribution
    are THE MAC MINI's ledger over its full three-form union, taken 2026-08-14; the two hosts keep
    separate ledgers with NO SSH ROUTE, so no figure here is a claim about Azure. THE MINI'S DAEMON WAS
    PAUSED THROUGHOUT (`state/PAUSE` since 2026-08-12T19:56, `daemon.pause` logged 14:56:56Z) and held
    a live `drain.lock` at pid 52111 — so its ledger records no dispatch spend today, and the triage
    run measured here was a hand-invoked CLI call, not the rung."
