      proof: "grep: defaultProofDebtCadenceInput( in src/run-task.ts"
    - claim: "the cadence audits the SAME open-plus-unmerged population over the SAME two predicates the verb binds, so the cadence and rmd proof-queue-audit cannot name different offenders on one checkout"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "unavailable merge evidence SKIPS the producer entirely rather than auditing the unfiltered open population — a wider population would name debt a merge already retired"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "every anchor path this binding produces is repo-relative, so taskRecordPath's absolute answer can never reach an EvidenceAnchor, and an unresolvable id is omitted rather than invented"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "a tick that does not fire performs no git, plan or filesystem read for this producer — the binding is lazy inside run, never at hook construction"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "with escalate at its shipped false the fire writes nothing to the proposal registry and still reports a measured clear or backlog rather than a bare zero"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "a fired cadence makes the proof-debt outcome recoverable from the measurement_cadence.ran row, named exactly once rather than duplicated alongside a derived row"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "a throw anywhere in this producer costs one logged row and never the daemon tick that hosts it, and never the cadence's other verbs"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
    - claim: "no path here files a task, approves a proposal, edits an acceptance criterion, or changes what the audit reports"
      proof: "unit test: test/the-proof-debt-producer-reaches-production.test.ts"
