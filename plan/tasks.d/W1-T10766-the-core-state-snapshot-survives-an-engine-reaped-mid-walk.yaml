  falsifier: |
    Each mutation below must turn the named case red:
    - Restore the throwing realpathSync/readdirSync in listStateFiles: the descend case fails with
      the 10-23 message, `ENOENT … lstat '…/engines/<h>'`.
    - Restore the unguarded lstat filter at state-backup-engine-links.ts:107: the preservation case
      fails with the 10-26 message.
    - Keep the link that was preserved before the copy and drop only the vanished files: the copy
      case fails with "missing reconstruction evidence".
    - Walk and copy the engine's payload again: the recorded-not-copied case finds the payload file
      in the archive.
    GUARDS that held at base and must still hold:
    - W1-T10086's five tests in test/state-backup.test.ts, which include "engine dependency
      references do not excuse missing irreplaceable state";
    - acceptance 3b, where a lost ledger refuses;
    - the directory-link-cycle refusal;
    - W1-T5545's live-safe suites (torn tail, ledger grows during the copy);
    - an ENOENT on a path that still exists, or any non-ENOENT error, still throws.
