      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a head whose runs are all progressing normally keeps the reading it has today"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a run still waiting to begin is only called stalled once it passes the configured bound"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "the bound is read from configuration rather than written into the predicate"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a partially registered rollup still reads pending, so the existing re-push arm is not reached"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a stalled head is never routed into the cancelled-check lane, which has no entry to name"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "the arm records the condition once and takes no retry action of any kind"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a second pass over the same unchanged head does not record the condition a second time"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "a required check that never ran still leaves the merge blocked"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "the detector performs no waiting and no repeated fetching within a single pass"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
    - claim: "an unreadable run listing leaves the reading exactly as it is today rather than inventing a stall"
      proof: "unit test: test/startup-failure-is-not-pending.test.ts"
