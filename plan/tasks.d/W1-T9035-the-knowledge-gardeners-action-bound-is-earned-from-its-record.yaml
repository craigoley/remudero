  design: |
    No new fixed count, ratio or timer. The bound is the acting class's own posterior odds that its next change is
    good. It grows with each credit, shrinks with each debit or undone action, and is reported with its inputs.
    1. THE ALLOWANCE. For the merge or retire class acting this pass:
         allowance = max(1, floor(alpha / (beta + undone)))
       `alpha` and `beta` are that class's record in the state the pass planned from, after any pending verdict or
       overseer effect was folded. `undone` counts that class's past targets the garden log records as acted on
       (`- retire <id>:` or `- merge <id> into <x>:` lines in `GARDEN_LOG`) whose learning reads `lifecycle: active`
       in this pass's inventory: an action a person or a later change reversed. Units match: alpha and beta count
       judged changes of the class, and each undone target is one more judged-bad change. The floor of one is
       structural, not a tuning: a class that may never act can never earn evidence, and its Beta draw already decides
       whether it acts at all. A fresh record is Beta(3, 1), giving 3, the operator's 2026-10-13 value. Today's retire
       record (20, 4, 0 undone) gives 5. One more debit gives 4.
    2. REPLACE THE CONSTANT. Remove `GARDEN_MAX_ACTIONS_PER_PASS`. `capByCertainty` takes the allowance per class
       instead and keeps its ranking: most certain first, ties by id, test-pinned and declined entries set aside
       first. To give `candidates` the record, add an optional fourth argument to `GardenSpec.candidates`
       (src/lib/gardener.ts): the class records `runGarden` already holds as `state.classes`. Other gardeners ignore it.
       `planGardenPass` passes its own `opts.state.classes`.
    3. A NAMED ROW RECORDS THE BOUND AND WHY. When merge or retire has candidates in a pass, the knowledge spec logs
       `knowledge.action_allowance` once per such class: `{ class, allowance, alpha, beta, undone, undone_targets,
       candidates, kept, deferred, reason }`. `reason` states the rule with its numbers, e.g. "posterior odds of a
       good retire: floor(20 / (4 + 0)) = 5". The scorecard's `deferred` and the garden log keep naming every deferred
       target. The log line names the allowance and its inputs instead of "cap of 3".
    4. UNCHANGED: `retireCertainties` and its confidence, `MERGE_SIMILARITY`, `planGarden`'s class draw,
       `judgeGardenPending`, `foldGardenEffects`, and every other gardener.
    Tests go in a new file, test/the-knowledge-gardeners-action-bound-is-earned-from-its-record.test.ts, with `test(`
    titles verbatim as in the proofs below. Drive `runGardenPass` the way
    test/the-knowledge-gardener-acts-on-at-most-three-entries-a-pass.test.ts does: a temp root, a learnings shard, a
    usage file, the other classes switched off, and a written `knowledge-gardener.json` state for the record. Update
    that older file so it no longer imports the removed constant. Its behaviour on a fresh record stays: 14 eligible
    retire 3, and 2 eligible retire 2.
