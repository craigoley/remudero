  falsifier: |
    A pass sees 14 eligible retirements. With state retire {alpha 20, beta 4} and no undone target, today's code
    retires 3 and defers 11. The fix retires the 5 most certain and defers 9, and its `knowledge.action_allowance` row
    reads allowance 5, alpha 20, beta 4, undone 0. With a fresh Beta(3, 1) it retires 3. With {alpha 20, beta 4} and
    two garden-log retire targets back at `lifecycle: active`, it retires 3 (floor(20 / 6)). Keep the constant, and the
    first test retires 3 where it expects 5. Ignore undone targets, and the second test retires 5 where it expects 3.
    Drop the row, and the third test finds none.
  note: |
