      proof: "unit test: W1-T1075: a blocked coverage step refuses the push instead of only logging"
    - claim: "a clean coverage run still proceeds exactly as before"
      proof: "unit test: W1-T1075: a clean coverage summary still proceeds to push"
    - claim: "the local runner refuses on an uncommitted tree instead of passing over a diff that omits the work"
      proof: "unit test: W1-T1075: an uncommitted tree is refused rather than silently passing"
    - claim: "a committed tree is not refused so the guard does not block ordinary use"
      proof: "unit test: W1-T1075: a committed tree is not refused by the dirty guard"
    - claim: "the diff the runner hands the checker is the three-dot form against a freshly fetched base"
      proof: "unit test: W1-T1075: the runner builds the diff three-dot against a refreshed base"
