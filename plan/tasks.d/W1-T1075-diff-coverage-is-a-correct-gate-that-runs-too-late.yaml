    THE ANCHOR-SHAPE SURFACE IS DELIBERATELY NOT USED FOR THIS ID, AND THAT IS ITSELF A CONSEQUENCE
    OF #2312. `rmd next-task-id --reserve` now writes reservations through `reserveTaskIdRemote` —
