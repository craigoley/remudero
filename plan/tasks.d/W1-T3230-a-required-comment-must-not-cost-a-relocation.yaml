- id: W1-T3230
  title: "TWO GATES PULL AGAINST EACH OTHER ON EVERY EXTRACTION — `catch-erasure-ratchet` REQUIRES a comment in a catch body and a NEW file enters it at baseline 0, but that required comment is what breaks `relocationKey`'s byte match, so `diff-coverage` then demands a test for code that only MOVED; #4522 hit it three times and each was resolved by a human noticing a cross-gate interaction neither gate names"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: span
  budget_usd: 10.00
  files: [scripts/diff-coverage.mjs, test/a-required-comment-must-not-cost-a-relocation.test.ts]
  origin: "operator-session#4522-merge-2026-09-09"
  plan_refs: ["W1-T3189", "W1-T2325", "W1-T2902", "W1-T212"]
