    OBSERVED 2026-10-13 on host remudero (~/rmd-state2/state), read niced. The band replay entry
    followup:DAEMON-1790001204828:2026-09-21T15:24:16.093Z:0 is stored `refused` at 16:35:14Z with the push refusal
    "plan-PR preflight refused the approve push: [lint-plan] ... [sizing]:; [shard-census] not ok 2 - W1-T3086:
    violating shard files cannot grow past the recorded baseline". Its `plan_pr.preflight_refused` row (16:34:16Z)
    names one violation on the minted shard W1-T9246-investigate-nested-worktree-path-artifact-causing-esm-parse-crash:
    "[sizing] spans 2 distinct subsystems/concerns (plan, review-command-plan-filing-provenance) at risk:low ... rename
    this shard so its filename slug is `review-command-plan-filing-provenance`". The shard-census failure is the same
    violation seen by the W1-T3086 ratchet: the new shard has a blocking lint violation. Its re-draft was written
    `inbox.drafted` `lint_clean: true` at 16:30:24Z, and serve classifies it `ready`.
    REPRODUCED in-process on the Mac against origin/main bbab8894f with the cached draft: NEW-1 (recon, risk:low, files
    test/review-command-plan-filing-provenance.test.ts and src/lib/plan.ts). `lintTask` with
    `draftFilingLintOptions` gives no sizing violation; the same options plus `duplicateSlug` set to the slug the
    approve minted give "block: spans 2 distinct subsystems/concerns (plan, review-command-plan-filing-provenance)".
    WHY, read on origin/main bbab8894f (symbols, not lines). `subsystemsOf` (src/lib/task-linter.ts) discounts a test
    companion as the task's own falsifier when the slug is unknown, and counts it when a known slug differs (W1-T2525,
    W1-T2814). `sizingViolation` takes the slug from `opts.duplicateSlug` or the task's `sourcePath`.
    `lintDraftedFragment` (src/lib/inbox.ts) lints a draft whose tasks have neither, and `draftFilingLintOptions` sets
    no `duplicateSlug`. The approve then writes each task to `plan/tasks.d/<id>-<stem>.yaml`, where
    `ratificationShardFiles` takes the stem from the title (`kebabSlug(title, SHARD_SLUG_MAX_LEN)`), and the push
    preflight lints that file with the slug. So the draft lint answers a different question from the push for every
    drafted task that names someone else's test. W1-T9039 aligned the draft lint with the push floor's base facts and
    left this one out.
    COST, from the ledger union of 2026-10-12 and 2026-10-13 (46 archives plus the live file): 354
    `plan_pr.preflight_refused` rows, 4 of them carrying the slug exit. Small, but each is an approve, an id
    reservation and a refusal, and the draft reads clean, so the band replay never re-offers it and the fleet lane
    retries it once a day.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and all 348 origin heads for duplicateSlug, ownFalsifierSlug,
    own-falsifier and "filename slug" (control: main reads 21 shards, no head reads more). None of the 21 sizes a
    draft: W1-T2525, W1-T2814 and W1-T5677 size a shard by its own slug, which a draft does not have yet.
  design: |
    One fact, the same derivation, no new bound. `lintDraftedFragment` lints each drafted task under the shard slug
    its approve will write: the stem `ratificationShardFiles` derives from the task's title. Share that derivation as
    one exported helper, `draftShardSlug`, which `ratificationShardFiles` also calls, so the two cannot drift. Pass it to the lint as
    `duplicateSlug` for that task only, or set an equivalent `sourcePath`, whichever leaves `sizingViolation` reading it.
    A task with no title keeps today's unknown-slug behaviour, as the writer files it under its id alone. The redraft
    guidance for a slug-dependent sizing block names the title as the thing to change, since the drafter controls the
    title and not the filename. The classifier's lint in `classifyProposal` reaches the draft through the same
    helper, so READY and the push agree.
    Tests go in the new file test/a-drafted-task-is-sized-under-the-shard-slug-its-approve-will-mint.test.ts, with
    `test(` titles verbatim as in the proofs below. Use the DAEMON-1790001204828 shape: a recon task at risk:low whose
    files are another concern's existing test plus one src file, titled so its slug differs from the test's.
