  falsifier: |
    Leave `lintDraftedFragment` without a slug, and the DAEMON-1790001204828-shaped fixture lints clean while
    `lintTask` with the minted slug refuses it [sizing], which is the live store's state. Derive the slug in the lint
    by a second copy of the stem rule, and a title that the shard writer trims differently (a quoted title, or one cut
    at the length cap on a separator) sizes under a slug the approve never writes.
