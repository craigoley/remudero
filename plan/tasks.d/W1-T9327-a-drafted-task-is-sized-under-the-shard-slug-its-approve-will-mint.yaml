    `lintDraftedFragment` (src/lib/inbox.ts) lints a draft whose tasks have neither, and `draftFilingLintOptions` sets
    no `duplicateSlug`. The approve then writes each task to `plan/tasks.d/<id>-<stem>.yaml`, where
    `ratificationShardFiles` takes the stem from the title (`kebabSlug(title, SHARD_SLUG_MAX_LEN)`), and the push
    preflight lints that file with the slug. So the draft lint answers a different question from the push for every
    drafted task that names someone else's test. W1-T9039 aligned the draft lint with the push floor's base facts and
    left this one out.
