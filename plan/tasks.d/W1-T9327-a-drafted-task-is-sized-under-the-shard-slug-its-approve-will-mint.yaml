  design: |
    One fact, the same derivation, no new bound. `lintDraftedFragment` lints each drafted task under the shard slug
    its approve will write: the stem `ratificationShardFiles` derives from the task's title. Share that derivation as
    one exported helper, `draftShardSlug`, which `ratificationShardFiles` also calls, so the two cannot drift. Pass it to the lint as
    `duplicateSlug` for that task only, or set an equivalent `sourcePath`, whichever leaves `sizingViolation` reading it.
    A task with no title keeps today's unknown-slug behaviour, as the writer files it under its id alone. The redraft
    guidance for a slug-dependent sizing block names the title as the thing to change, since the drafter controls the
    title and not the filename. The classifier's lint in `classifyProposal` reaches the draft through the same
    helper, so READY and the push agree. `repairRatificationFragment` and `relintRatificationFragment` size each
    task under the same `draftShardSlug`, so an approve of a draft cached before this lands repairs the slug-only
    sizing block (its existing risk:high + band_meaning:span repair) instead of pushing a shard the preflight refuses.
    Tests go in the new file test/a-drafted-task-is-sized-under-the-shard-slug-its-approve-will-mint.test.ts, with
    `test(` titles verbatim as in the proofs below. Use the DAEMON-1790001204828 shape: a recon task at risk:low whose
    files are another concern's existing test plus one src file, titled so its slug differs from the test's.
