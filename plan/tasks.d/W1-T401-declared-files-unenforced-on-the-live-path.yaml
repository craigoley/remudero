  note: "verify:auto — every claim is a predicate assertion over synthetic diffs and a declared file
    list, decidable in-process with no worker spawn and no network.
    risk:high IS RULE 19'S SPAN, set up front rather than shipped as a violation: files: reads as two
    concerns (review, scope-guard-review-direction). The diff is plausibly small. What earns the band
    is direction of error — this adds a verdict to a MERGE GATE, and a version that fires on the six
    generator gates in clause (ii) parks the queue, while a version pitched too soft restores the
    convention-only status quo with a louder claim to correctness behind it.
    RULE 25 CHECKED BEFORE FILING: files: contains no INSTRUMENT_SURFACE path, so
    detectInstrumentEntanglement has nothing to refuse.
    budget_usd 75 — the cost is clause (ii)'s measurement over real merged PRs and clause (i)'s
    push-observability question, either of which can change the task. Not the predicate.
    THE IRONY IS DELIBERATE AND WORTH LEAVING ON THE RECORD: this shard declares a files: list that
    nothing will check against its own eventual diff, which is the defect it describes.
    ON THE PROOFS: all three name test/scope-guard-review-direction.test.ts, which does not exist yet
    — a forward reference to a PATH, safe per CLAUDE.md, declared in files: so the worker creates it."
