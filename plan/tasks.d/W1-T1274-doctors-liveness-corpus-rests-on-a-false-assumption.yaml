  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/doctor.test.ts`, which is declared in `files:` and already exists with 36
    tests, so each resolves against a real file rather than a forward reference.

    `risk: high` IS RULE 19'S SPAN AND IS SET UP FRONT. `files:` names four stems, which the sizing
    check reads as distinct concerns and refuses below `high`. Decomposing is wrong here and
    rationale (7) is why: the corpus this check needs does not exist yet, so a reader-only change
    has nothing correct to read and an emitter-only change leaves the false FAIL standing. The
    blast radius is one read-only diagnostic and one ledger row per iteration.

    THE BRIEF'S FIGURE WAS RE-DERIVED AND MOVED, AND THE MOVED VERSION IS RECORDED. The measured
    silence is 102.5 minutes on the `daemon.` PREFIX (14:44:35.453Z → 16:27:04.869Z) and 106.3
    minutes on `daemon.alive` ALONE (→ 16:30:51.744Z). The brief's 106 minutes is the second of
    those. Both are read against a two-minute bound, so the conclusion is unchanged; the number is
    corrected because the shard is the record.

    ONE SECOND DEFECT IS CARRIED, NOT FOLDED IN. Rationale (6): the ticker's body guards only
    `onDiskHeadroomBreach` and `sweepLight()`, leaving `sleep`, `checkPause`, `readDiskHeadroom`
    and the `daemon.alive` log call itself unguarded, so a throw there silently ends the only
    recurring liveness emitter for that phase. This shard does NOT claim that is what happened in
    the measured window — it is a separate way the same assumption fails, named so the operator can
    mint it rather than have it disappear into this one.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN.
