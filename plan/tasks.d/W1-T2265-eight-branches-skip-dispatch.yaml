  note: |
    ── Q1. IS THE RETRO's `continue` DELIBERATE? YES, AND THE REASON IS ALREADY WRITTEN DOWN ────

    (i) IT IS DELIBERATE, AND W1-T276 STATES THE REJECTED ALTERNATIVE IN ITS OWN WORDS: "Making
    the retro non-blocking (fire-and-forget) is the obvious larger fix and is NOT this task: the
    loop's single-threadedness is what makes its dispatch accounting sound, and a detached retro
    would race the very plan it rewrites. Bounding the blindness is the honest small fix;
    removing the blocking is a different, larger design question."

    (ii) SO THE CONSISTENCY ARGUMENT THE BRIEF ANTICIPATED EXISTS AND IS RECORDED. A retro reads
    and rewrites the plan; a dispatch selects from it and writes run branches. W1-T276 names that
    race explicitly and declines to open it.

    (iii) AND THE ASYMMETRY WAS SEEN AND CHOSEN, NOT MISSED. The same shard says: "THE ASYMMETRY,
    verified at ebb6777. The dispatch path is protected ... The retro path is not ... is a bare
    await inside the same single-threaded `for (;;)`, with `continue` immediately after. Nothing
    ticks while it runs." `sweepLightDuringRetro` (`daemon.ts:1445-1459`) is the fix it shipped,
    and its own acceptance required "the test must assert it never dispatches".

    (iv) THEREFORE THIS IS NEITHER A DOCUMENTATION TASK NOR A DEFECT IN THE RETRO. The reason is
    documented, the choice is sound, and the retro is an eighth of the cost. WHAT IS UNDOCUMENTED
    IS THE SHAPE THE RETRO SHARES WITH SEVEN OTHER BRANCHES: `sleep(poll)` then `continue`, on
    paths that have nothing to do with plan consistency. THAT is this task.

    ── Q2. ORDER OR CONCURRENCY ────────────────────────────────────────────────────────────────

    (v) CONCURRENCY IS REFUSED, AND NOT BY THIS SHARD's PREFERENCE. Running the retro without
    awaiting it is exactly the alternative W1-T276 rejected with a stated reason. Reopening it
    would be overturning a ruling on the strength of a wall-clock measurement, and the
    measurement does not touch the plan-race argument at all. A BUILD MUST NOT DETACH THE RETRO.

    (vi) ORDER IS THE ANSWER, BUT THE ONE-LINE VERSION IS WRONG AND WOULD BE UNSAFE. Moving
    `:3419` to the top of the body would place dispatch ABOVE the pause check, the headroom park
    and the quota gate — three rungs whose whole purpose is to stop a dispatch that must not
    happen. Those must stay above it. The rungs dispatch can safely precede are the
    OBSERVATIONAL ones: `sweepOrphans`, `sweepFeedbackLanding`, `checkGithubPosture`,
    `runMeasurementCadence`, and the retro. None of them gates a dispatch; each merely delays it.

    (vii) AND ORDER ALONE DOES NOT FIX THE LARGER HALF. Reordering removes the rung latency; it
    does not remove the sixty seconds each deferring branch spends before retrying, which is the
    ~4.75 h. A build that reorders and leaves eight unconditional `sleep(poll)` calls in place
    has addressed the smaller half. THE TWO GO TOGETHER: dispatch should be reachable before the
    observational rungs, AND a branch that defers for a non-safety reason should not also spend a
    full poll.

    (viii) THE SHAPE OF THE TEST FOLLOWS FROM THAT. It should assert reachability — that from a
    given loop state, `:3419` is reached — rather than asserting an ordering of statements, so a
    later refactor that preserves reachability does not break it.

    ── Q3. WHAT MUST NOT CHANGE ────────────────────────────────────────────────────────────────

    (ix) NO LANE COUNT MOVES, AND THIS MEASUREMENT IS AN ARGUMENT AGAINST MOVING ONE: the lanes
    are skipped by control flow, not exhausted by demand, so more of them would sit in the same
    skipped branch. `dispatchLanes` and `reviewLanes` stay where they are and this task must not
    read them.

    (x) THE PAUSE CHECK STAYS FIRST AND KEEPS ITS `continue`. A paused fleet must not dispatch,
    and `:2472` is the guarantee. The headroom park at `:2768`/`:2808` and the quota gate at
    `:2922` stay above dispatch for the same reason: each exists to REFUSE a dispatch, and a
    reordering that puts dispatch in front of them converts a safety gate into a post-mortem.

    (xi) THE RETRO STAYS BLOCKING. W1-T276's ruling stands, `sweepLightDuringRetro` stays, and
    its own guarantee that the light ticker never dispatches stays with it.

    (xii) AND THE FRESHNESS RESTART STAYS. It costs 0.06% of wall clock and exists because a
    daemon running stale code is worse. Nothing here touches it.

    (xiii) RULE 19 BAND. `risk: high` is set UP FRONT because the sizing check reads `files:` as
    spanning two concerns — the `daemon` stem and this task's own test stem — and refuses that at
    `risk: medium`. THE BAND IS THE SPAN READING AND NOT A BLAST-RADIUS JUDGEMENT: the change
    moves statements within one loop body and adds no rung, no gate and no threshold.
