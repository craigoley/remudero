      proof: "grep: the author preflight is advisory in doctrine/before-you-push/preflight-before-first-push.md"
    - claim: "invariant:no-check-leaves-without-a-ci-job — a static check leaves the author path only when a ci.yml job that runs on every pull request runs it"
