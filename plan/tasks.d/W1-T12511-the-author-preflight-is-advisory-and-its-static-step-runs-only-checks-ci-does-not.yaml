  rationale: |
    The author preflight repeats, on every first push, static gates that ci.yml runs on every pull request, and the doctrine
    still reads as if the local run were the gate.
    READ at origin/main 6cf453f7a:
    - src/lib/ci-parity.ts:2895-3021 FAST_GATE_STEPS has 14 steps: rule-checks, cli-reference, claims, learnings-budget-ratchet,
      jscpd, comment-load-ratchet, depcruise, api-client-drift, no-hand-rolled-fetch, source-size, lint-plan, self-path-proof,
      worker-branch-shape and census-precheck. For most, the `reason` says a ci.yml job runs the same check unconditionally
      (for example "ci.yml's jscpd-gate job runs unconditionally"). ci.yml has a job named claims, learnings-budget-ratchet,
      comment-load-ratchet, depcruise, api-client-drift, no-hand-rolled-fetch, source-size and lint-plan; the names do not
      always match (jscpd runs in jscpd-gate), so the link must be stated per step.
    - src/lib/ci-parity.ts:3579 `runPreflightFast` takes `deps.steps`, so a caller can pass a subset without changing the list.
    - worker-branch-shape (:3001, scripts/worker-branch-shape.mjs) and census-precheck have no job under .github/workflows/.
    - scripts/census-precheck.mjs:300-320 (script-ratchet parity, W1-T5737), and :432-490 (instrument-surface) model rules that
      are asked only before the push.
    - doctrine/before-you-push/preflight-before-first-push.md already limits the preflight to the first push and says
      "required hosted checks still gate merge", but describes the local receipt as the check that matters.
    - GitHub: main's required checks are remudero-review, ci-gate and security-merge-policy (strict false). Because strict is
      false, the merge-time ratchet verdict (W1-T12509) is what stops two green pull requests from crossing a ceiling together.
    CHECKED for overlap: W1-T10948 (queued) keeps census and static outcomes complete; it does not change which checks run.
    W1-T11850 (queued) shares one run between identical keys. No open pull request files a task on this subject.
  design: |
    1. Add an optional `ciJob` field to `FastGateStep` and set it on each entry whose check a ci.yml job runs on every pull
       request. The builder reads ci.yml for each one and sets none on a guess.
    2. In scripts/preflight-author.mjs, pass `runPreflightFast` the entries with no `ciJob` (`deps.steps`, :3583). Record
       `leftToCi: [{ job, ciJob }]` on the receipt. run-task and the pre-open gate keep the full list.
    3. Keep the census precheck in the author preflight unchanged, so its meta rows still run.
    4. Rewrite the doctrine and the operator guide in plain words: the author preflight is advisory; the gate is the three
       required checks and the merge-time ratchet verdict.
    INVARIANT no-check-leaves-without-a-ci-job: a static check leaves the author path only when a ci.yml job that runs on
    every pull request runs it.
    NOT IN SCOPE: the pre-push hook (W1-T12510); the worker path's static step.
  falsifier: |
    Set `ciJob` on a step whose ci.yml job has a job-level `if:` and criterion 3 must fail. Set `ciJob` on worker-branch-shape
    and criterion 2 must fail. Restore and require all five to pass.
  note: |
    Id W1-T12511 reserved for run-unfiled-1794582098000 with ~/rmd-work/bin/reserve-id.sh.
    Depends on W1-T12509: the doctrine names the merge-time verdict as part of the gate only once it counts every gate it can.
