- id: W1-T2603
  title: "A RECOVERED HEADROOM BREACH NEVER CLOSES ITS OWN ESCALATION, SO THE CONDITION CLEARS AND THE ISSUE DOES NOT — escalateHeadroomReserve raises a HARD_STOP issue once per breach episode and NOTHING retires it when headroom recovers; buildEscalationReconcileCandidates resolves TASK-referent escalations by plan id, and a headroom breach has no task referent to resolve against, so the class falls through every retirement path; MEASURED 2026-09-02: three identical open HARD_STOP issues (#3334, #3384, #3483) against a weekly window reading 11% used with over_ceiling false, one of them already annotated stale by an operator days earlier and still open"
