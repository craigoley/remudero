    WHAT THE CODE DOES. In runDaemon's dispatch phase, `latchRestart` makes every in-flight lane a member of
    `restartHoldouts` (W1-T7806), and while that set is non-empty `decideRefill`, `conclude` (in `chooseRefill`) and
    `admitAtStart` keep refill open. W1-T8927 (#11281) added the cost trade inside runOne's `restartAtWorkerBoundary`
    closure: reason `finish_is_cheaper` keeps a run as a holdout with a deadline of now + its phase's median
    remaining time (`restartWorkHistory`). That hold branch ALSO runs `refillClosed ??= "stale code"`, so the first
    holdout closes refill for every lane for the rest of the latch, the opposite of W1-T7806. The same closure
    writes `daemon.restart_holdout` or `daemon.restart_yield_asked` on EVERY call, and the quiet-worker watchdog
    calls it on every poll (`runQuietWorkerWatchdog`, `QUIET_WATCHDOG_POLL_MS` = 5 s, through `restartLatchDetail`
    to `restartPending`). The restart fires where the dispatch phase returns `stopForFreshness(inFlightFreshness,
    restartWait.decidedAtMs)`. No row records what a latch cost in lane time.
