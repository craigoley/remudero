  design: |
    Operator rulings: no hard threshold or cap (every bound below is a measured estimate), keep automated flow.
    All of it lives inside runDaemon's dispatch phase in src/lib/daemon.ts. The decision itself is one exported
    pure function, `decideLatchedRestart`, that the tests drive directly.
    1. LATCH STATE. Keep one state for the latch: each holdout's expected finish (its W1-T8927 deadline, which a
       later phase still cannot extend), each idle lane's idle-since, the refills admitted under the latch, and
       the restart's EXPECTED TIME R, the latest expected finish among the remaining holdouts. With no holdout left,
       R is now. `decideLatchedRestart(state, estimates, nowMs)` returns R, the holdouts to ask to yield, and the
       hold and yield costs it compared.
    2. (a) A FREED LANE TAKES WORK THAT ENDS BEFORE R. The hold branch in `restartAtWorkerBoundary` no longer sets
       `refillClosed` to "stale code". While a holdout remains, `decideRefill`/`chooseRefill` take the first
       candidate from the same gates and pool as today (`runnableCandidates`, `partitionByFileOverlap`) whose
       expected span ends at or before R. The expected span is the median settled span of its class:
       `settledSpansByClass` (src/lib/cost-anomaly.ts) over the restart-history lines the daemon already reads at
       boot, keyed by `deriveTaskClass` (src/lib/task-class.ts), the class `run.start` writes. When nothing fits,
       because no class estimate exists, nothing ends before R, R is now, or the latch is a self-scoped change, the
       lane PARKS (the `parkedLanes` path) with one `dispatch.lane_parked` row naming the reason, R, and the nearest
       candidate and its span. It writes another row only when that state changes, and every re-decision below
       wakes it. A refill admitted under the latch is never a holdout and never moves R later (W1-T7806 "cannot
       renew"). It is asked to yield at its first boundary once R passes or no holdout remains. W1-T6274 holds:
       with no holdout, R is now and no new run starts.
    3. (b) THE RESTART MOVES EARLIER WHEN HOLDING COSTS MORE. On each state change, and never on a timer, the latch
       re-decides. State changes are: a latch, a lane freeing, a lane parking or refilling, a holdout reporting a
       new phase (its estimate moves), a holdout settling, and a poll that finds a deadline passed. Take the holdout
       h whose expected finish sets R. Holding cost is the lane time that would sit idle until R: each idle lane
       from now, and each other lane from its own expected finish. Yield cost is the measured
       `restartWorkHistory` yield cost. When holding costs at least the yield, h is asked to yield at its next
       boundary (a new reason, e.g. `idle_lanes_cost_more`), R is recomputed over the remaining holdouts, and the
       test repeats. No history keeps today's behaviour: every run yields (W1-T8927).
    4. (c) ROWS PER STATE CHANGE, NOT PER POLL. `restartAtWorkerBoundary` returns the latch's current answer for a
       run on every call. It writes `daemon.restart_holdout` or `daemon.restart_yield_asked` only when that run's
       answer, reason, phase or deadline changed. The row carries the reason, the in-flight set with each run's
       remaining estimate, and R. A watchdog poll with an unchanged answer writes nothing.
    5. (d) ONE COST ROW PER LATCH. Right before the dispatch phase returns `stopForFreshness` for a latched restart,
       write `daemon.restart_latch_cost` once, with: latched_at, fired_at, waited_ms, idle_lane_ms (the sum over
       lanes of time with no run under the latch), refills_under_latch, the holdouts with each one's outcome
       (finished, yielded on cost, yielded on estimate_elapsed), yields_asked, R as first decided against the
       actual fire time, and old_sha/new_sha.
    6. LAYER 2 COMPATIBILITY. Nothing is persisted and no file format or run contract changes. If build runs later
       outlive the daemon (the coming ADR), the holdouts empty, R becomes the drain's own time, and (a) and (d) keep
       working unchanged.
    UNCHANGED: `restartWorkHistory` and its estimates, the self-scoped rule, W1-T8927's deadline-never-extends rule,
    W1-T8198's single restart predicate, W1-T8170/W1-T8172's drain, and every gate a refill already passes.
    Tests go in the new file test/a-latched-restart-refills-a-lane-with-work-that-ends-before-it.test.ts, with
    `test(` titles exactly as in the proofs below. Drive runDaemon with an injected runOne, checkFreshness and a fake
    clock, as test/a-latched-restart-lets-a-build-finish-when-its-yield-costs-more.test.ts and
    test/a-dispatch-phase-is-not-held-by-its-slowest-lane.test.ts do, plus direct calls to `decideLatchedRestart`.
    Use no live ledger, wall clock or network.
