- id: W1-T12789
  title: Qualify and adopt Stryker core 10.1.1 from Dependabot PR 15178
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 4.50
  origin: feedback#fb-dep-review-2c0184950469bc3f
  plan_refs: ["§7B", W1-T2705, W1-T108]
  files:
    - package.json
    - package-lock.json
    - test/mutation-report-validity.test.ts
    - test/fixtures/mutation-ratchet/stryker-10-reached.json
  status: queued
  attempts: 0
  rationale: |
    PR 15178 proposes @stryker-mutator/core 9.6.1 to 10.1.1. Both the
    manifest and lock still select 9.6.1 in this checkout. W1-T2705 supplies
    the migration intake mechanism, rather than this dependency migration.
    No Stryker 10 adoption task was found in the plan sources reviewed here.
    The captured release notes name dropping Node 20 as a breaking change;
    package.json already requires >=24.21.0 and .nvmrc selects 24.22.2.
    Thus this proposal does not assume that adopting Stryker needs another
    runtime-major migration. The command runner and report consumer still
    need qualification against the actual upgraded package. Current remote
    PR state and open-head overlap were not verified during this intake.
  design: |
    Before implementation, verify PR 15178's current state and discussion,
    active claims, merged task credit and open heads for equivalent migration
    work. Carry only missing changes; never downgrade a newer landed version.
    Independently verify the target package's engine and dependency metadata.
    Upgrade the manifest and regenerate the lock together on the owned task
    branch. Keep the existing supported Node runtime if it satisfies the actual
    engine constraint. Do not edit Dependabot's branch or add ignore rules.

    Prior behavior: stryker.conf.json uses the command runner, mutates classify.ts,
    emits JSON and retains incremental results. scripts/mutation-ratchet.mjs
    consumes those reports in PR and nightly modes. Existing tests exercise
    reports captured from Stryker 9.6.1; their success alone cannot qualify 10.
    INVARIANT mutation-controls: preserve the configured mutation scope, test
    command, quality floors and fail-closed report validity behavior.

    Extend the existing report-validity suite with a bounded real installed
    Stryker CLI run in an isolated disposable fixture, using the command runner
    and JSON reporter. Assert the installed major and expected manifest/lock
    agreement, a successful dry run and nonzero generated mutants, including
    at least one killed mutant. Feed the generated report to the real ratchet
    consumer and retain a small representative v10 report fixture with its
    provenance. Exercise both accepted and rejected report outcomes; keep the
    existing v9 fixtures as backward compatibility evidence. New test code uses
    package aliases and the shared repository root helper. Clean its own temp
    artifacts without touching shared dependencies.

    Add three distinct tests with the exact titles named by the acceptance
    proofs below, one per criterion. These titles are forward references for
    implementation; the existing v9 suite passing does not satisfy them.
    Verify each title resolves to its intended test and misses at the build's
    merge base before claiming the corresponding criterion is met.

    Also run the maintained repository mutation command with a fresh incremental
    cache and the unchanged baseline, and run the existing report, ratchet,
    per-file runner and mutation-trigger suites. Record the package identity,
    runtime, commands and actual outcomes in implementation evidence. A tiny
    fixture smoke test alone does not prove the repository's baseline passes.
    If v10 requires config, consumer or instrument-policy changes beyond this
    file set, stop with the concrete incompatibility and request a bounded plan
    amendment; do not silently widen scope, lower a floor or weaken a gate.
  acceptance:
    - claim: Manifest and lock select the qualified Stryker 10 target and the installed CLI runs on the supported repository runtime
      proof: "unit test: W1-T12789 criterion 1: Stryker 10 manifest lock and CLI agree"
    - claim: An automated isolated-fixture Stryker 10 command-runner execution produces nonzero mutants with at least one detected by a failing test, and its JSON report is accepted by the maintained ratchet consumer
      proof: "unit test: W1-T12789 criterion 2: real Stryker 10 mutants reach the ratchet"
    - claim: "invariant:mutation-controls — valid v10 reports remain accepted while malformed or unreachable reports remain refused, preserving the mutation validity controls"
      proof: "unit test: W1-T12789 criterion 3: v10 validity accepts reached and refuses invalid runs"
      kind: guard
  falsifier: |
    Restore the old manifest/lock version and show the version regression fails;
    restore the upgrade and show a real passing test summary. Replace the reached
    report with malformed or zero-caught data and demonstrate rejection. Record
    the full repository mutation run separately from the bounded fixture smoke.
