- id: W1-T3549
  title: "ESTABLISH OR REFUSE A REAL WEBSEARCH AUTHORITY BEFORE ROUTING GPT-OSS TRIAGE — the bounded Chat Completions adapter deliberately rejects triage's declared WebSearch tool, so changing only the mount would convert an undisclosed capability loss into every-run failure"
  repo: remudero
  depends_on: [W1-T3546]
  type: recon
  verify: human
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 2.00
  files:
    - plan/tasks.d/W1-T3549-establish-an-honest-websearch-authority-before-routing-openweight-triage.yaml
    - docs/recon/openweight-triage-websearch-authority.md
  origin: "operator-session#open-weight-routing-2026-09-14"
  plan_refs: ["W1-T3545", "W1-T3546", "W1-T3547", "W1-T3094"]
  status: merged
  attempts: 0
  note: |
    This is a bounded evidence task, not a routing task. `TRIAGE_WORKER_TOOLS` declares
    Read/Write/Edit/Grep/Glob/WebSearch. W1-T3546 implements only the five local file tools and
    refuses an unknown declaration before it reads a key or calls Azure. That refusal is the safe
    current behaviour, but it means W1-T3547 cannot route triage until the missing authority is
    settled.

    Microsoft Foundry's current gpt-oss-120b capability table names Chat Completions and function
    calling; it does not name the Responses API. Microsoft documents hosted web search through the
    Responses or Agent surface. A model function call is not a web-search result, and an invented
    empty result would be fabricated telemetry. The task must not remove WebSearch from triage,
    silently filter it, or select another model/provider.
  rationale: |
    The Phase Three proposal is deliberately a small machine-checked lane, but the worker still
    relies on its declared authority to research feedback. Routing it through an adapter that
    cannot provide every declared tool would not measure open-weight output quality; it would
    measure a changed task contract. The resulting relint and acceptance rate would be
    uninterpretable, and retries could make a low token price costlier than the Claude baseline.

    The Azure key is environment-only. This recon may issue at most five harmless capability probes
    against the existing deployment, uses the key only in process memory, records response status,
    capability shape and cost summary without a key or response body containing sensitive data, and
    stops below the stated $2 budget. It must use the existing eastus2 deployment rather than adding
    a vendor, subscription or self-hosted model.
  design: |
    First re-read Microsoft Foundry's gpt-oss capability table and the current Azure web-search
    documentation. Then run bounded API-key probes against the existing deployment: a plain Chat
    Completions function exchange is a positive control; any Responses/web-search request must be
    judged by an actual returned web-search result with provenance, not HTTP success alone. Record
    the exact API surface, result, cost summary and go/no-go conclusion without any key or sensitive
    response body in `docs/recon/openweight-triage-websearch-authority.md`.

    If the deployment supplies a real bounded WebSearch authority, file one separate implement task
    for the adapter bridge with tool-input schema, result provenance, spend accounting, timeout and
    refusal tests; W1-T3547 remains mount-only. If it does not, record that outcome and keep W1-T3547 blocked
    rather than weakening triage. This task changes no mount, daemon config,
    credential store or worker adapter.
  acceptance:
    - claim: "the recon report distinguishes an actual web-search result from a model function call"
      proof: "grep: a model function call is not a web-search result in docs/recon/openweight-triage-websearch-authority.md"
    - claim: "a negative result records that Phase Three stays unrouted rather than silently removing the declared tool"
      proof: "grep: W1-T3547 remains blocked in docs/recon/openweight-triage-websearch-authority.md"
  falsifier: |
    A successful result must contain an actual web-search output with provider provenance; a 2xx
    response, a model-authored citation, or a raw function-call request does not falsify the gap.
    Conversely, if the deployment returns that result within the cap, this record must not claim
    the authority is unavailable: file the bounded adapter task and keep W1-T3547 mount-only.
