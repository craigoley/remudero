    THE HYPOTHESIS UNDER TEST. decideTriageClaimRelease's holder arm (src/lib/auto-triage.ts) drops the claim
    "on completion, in a finally, success or not". So once the first lane has published its PR, the claim ref is
    gone while the PR is still open and main still says status new. After that, the only cross-host guard is the
    open-PR read (isFeedbackOpenPr / readFeedbackLiveState; W1-T300 and its wiring W1-T1019), and decideAutoTriage's
    own status-new read cannot see an unmerged verdict. If the second run is auto-triage, the question is whether
    the open-PR guard missed #17389 and why. If it is a direct triage command, the question is whether that path
    consults the open-PR guard at all. Either way, a second claim acquire would succeed against a released ref.
    Both explanations are plausible. The receipts have to pick one, or say they cannot.

    Settled by lookup: is this already filed or decided? -> no. No shard names 901cace1adefcf4b, #17389 or #17394
    as a duplicate decision. #17394 shows up in W1-T11750 and W1-T11763 only as a row in an open-PR census (grep of
