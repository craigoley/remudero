       acquire precedes run 1's release; #17389 had merged before run 2 started; or run 2 claimed through the
       stale/evidence arm. Name the row that refutes it.
    4. VERDICT. Write `investigation verdict: proved`, `refuted`, or `unknown`. For unknown, name the MINIMUM
       missing evidence: which receipt, from which run, and which retention or emission gap made it absent. Do not
       infer past the receipts.
    5. FOLLOW-UP. Only if proved: file ONE separate implement task, under its own minted id, in a separate filing.
       Scope it narrowly to the proved gap (for example: the holder keeps or hands off the claim until its PR
       merges or closes, or direct triage consults the open-PR guard). Choose whichever the timeline proved, and
       name its overlap with W1-T6117. Record that id in the report. Never implement the fix in this task, and never widen
       this task into it. If the verdict is refuted or unknown, record `follow-up: none` and the reason.
