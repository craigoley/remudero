    https://github.com/craigoley/remudero/pull/17394).
  design: |
    READ-ONLY. Do not modify triage, claims, refs/rmd-triage/*, the feedback record, either PR, or #17393. Do not
    answer, label, comment on or close #17393. Its needs-human state is evidence and stays as it is. The only
    write is the new report docs/forensics/triage-incident-901cace1adefcf4b.md, which holds every finding
    below. Do not edit this shard: Rule 15 refuses criteria edits, and the harness owns status.

    1. POSITIVE CONTROL FIRST. Before reading anything about this incident, confirm that the ledger corpus you will
       search (live ledger plus every rotation/archive the ledger union opens) contains a KNOWN row from the same
       window. The control is the pr.opened, or the merge receipt, of #17389 itself, or any triage.claim row
       timestamped on 2026-11-08 between 14:00Z and 16:00Z. The run-id suffixes decode to about 14:40:22Z and
       14:59:17Z. Record the corpus paths, their time span, and the
       control row's ts and seq. If the control is absent, the corpus is blind for this window: say so, and do not
       treat any missing row below as evidence of absence.
    2. JOIN BOTH RUNS. For each of TRIAGE-incident-901cace1adefcf4b-1794148822712 and -1794149957761, collect:
       the task and run id, assignment id, invoking entry point (auto-triage daemon fire versus direct triage
       command, from the auto_triage.* rows or their absence, and the run's argv/actor), host and pid, the
       triage.claim row (proceed, stale_released, reason), the triage.claim_released row (arm, dropped), any refusal
       or skip row (auto_triage.skipped_inflight, stood_down, held), and pr.opened / run.awaiting_external. From
       GitHub, collect for each PR: opened-at, head sha at open and at merge, base sha, the close/reopen events on
       #17394, and the merged-at time and merge commit.
    3. TIMELINE. Put one ordered table (ts, source, event, run) of every receipt above. The hypothesis is PROVED
       only if the table shows this order: run 1 claim acquired, then #17389 opened, then run 1 claim released
       (holder arm), then run 2 claim acquired (proceed true, not stale-released), all while #17389 is open and
