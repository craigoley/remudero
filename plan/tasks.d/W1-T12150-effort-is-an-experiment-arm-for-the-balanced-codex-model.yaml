  rationale: |
    MEASURED 2026-11-10 in the core instance's ledger, 2026-10-27 to 2026-11-10: gpt-6.1-sol build attempts succeeded in 83.3% of 84 at medium effort. At high effort they succeeded in 60.1% of 218.
    - The comparison is observational. The mounts table sends harder tasks to high effort, and 71 of the failed high attempts were container recycles (W1-T12149).
    - So the numbers cannot say which effort is better. Only a random split on the same kind of task can.
    - Every experiment in src/lib/routing-experiments.ts compares two providers. `RoutingExperiment.arms` maps a provider to a label, so it cannot hold two efforts of one model.
    - W1-T5450 files the same question for the Opus model. No task files it for Codex.
  design: |
    Add an effort experiment shape beside the provider shape: one provider, one model, two efforts, one type of work. Reuse `experimentArmForTask` with its own draw point, so the effort draw does not depend on the provider draw.
    Apply the assigned effort where the selected effort is set, in `workerSelectionAssignment` in src/lib/worker.ts. Only tasks whose mount gives the current Sol at high effort for build work join.
    THE MODEL IS THE CURRENT SOL (operator ruling 2026-11-17): resolve it as the first model whose id ends in -sol in codexCandidatesForCapability(capabilities, 'balanced', 'high') (src/lib/worker-provider.ts:907) over the capabilities loadMounts reads (src/lib/mounts.ts:837); today that is the row's head (.remudero/mounts.yaml:212). No Sol version literal in the experiment. When the resolved Sol changes, the experiment starts a new epoch, so no arm mixes two Sol versions; an unreadable table assigns nothing.
    Give the experiment a decision rule in the form W1-T12142 defines, if that task has merged. If not, set `minTasksPerArm` and a stop date.
    Where W1-T5450 has merged first, extend its shape and do not add a second one.
    INVARIANT a-task-outside-the-experiment-keeps-its-mount-effort: the effort draw is independent of the provider draw, and an assignment that Claude serves, or one that is not build work on the current Sol at high effort, is in no effort arm and runs at the effort its mount gives.
    NOT IN SCOPE: effort for fix and review work, and any change to the mounts table.
  falsifier: |
    Key the draw on the attempt and criterion 1 must fail. Hard-code gpt-6.1-sol, or any Sol version, as the experiment's model and criterion 1 must fail on a fixture table led by another Sol. Put a Claude assignment in an effort arm and criterion 3 must fail. Restore and require all to pass.
  note: |
    Medium effort costs less for each attempt. If it also merges more often, the table change is W1-T12143's to propose.
    AMENDED 2026-11-17 (operator ruling, "go with all of your recommendations"): the experiment's model is the CURRENT Sol, the first Sol of the Codex balanced row, not a hard-coded gpt-6.1-sol, so the effort arms measure what the fleet runs. WHY: W1-T13445 (remudero-ops, queued 2026-11-17) puts gpt-6.2-sol at the head of every Codex Sol row, after which a 6.1 experiment would only see tasks that fell back to 6.1. The rationale's 2026-11-10 measurement was on gpt-6.1-sol and stays as measured. Before this amendment the task had no claim, branch or pull request (no refs/rmd-dispatch/W1-T12150, no run-W1-T12150-* branch). The amendment also names criterion 3 as the record's invariant (the plan lint asks a changed implement record to declare one) and widens it to a task outside the experiment; its proof is unchanged.
