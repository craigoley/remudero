      proof: "grep: W1-T12150 criterion 1 in test/routing/effort-is-an-experiment-arm-for-the-balanced-codex-model.test.ts"
    - claim: "A Codex build assignment in the experiment runs at the assigned effort and records the experiment id, the assigned effort and its probability"
