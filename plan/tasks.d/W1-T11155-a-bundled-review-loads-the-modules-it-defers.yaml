  title: "A bundled review loads the modules it defers — review.ts reaches status.ts and escalate.ts through `await import(variable)`, which esbuild cannot bundle, so the run-task bundle resolves './status.js' beside itself and every bundled review that verifies a live remudero-review status throws ERR_MODULE_NOT_FOUND for dist/child-entries/status.js and withholds its verdict (36 post_refused rows from 2026-10-24 to 2026-11-01, still recurring)"
