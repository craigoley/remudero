  rationale: |
    MEASURED 2026-11-02 from the review-lane findings' 7-day ledger extract (read-only, ~/Remudero-notes/review-lane-findings-2026-11-02.md):
    - review.post_refused rows reading "could not verify the live remudero-review status: Error [ERR_MODULE_NOT_FOUND]: Cannot find
      module '/home/node/Remudero/remudero/dist/child-entries/status.js' imported from
      /home/node/Remudero/remudero/dist/child-entries/run-task.mjs": 36 rows between 2026-10-24T20Z and 2026-11-01T02Z, in bursts
      (5 in the 2026-11-01T02 hour). The findings count 26 in their window. fix.dispatch and fix.progress_judged rows carry the same
      error 13 more times, so the withheld verdict also feeds fix rounds.
    READ at origin/main 1368db581, src/lib/review.ts:
    - replayPublisher: `const statusModule = "./status.js"; const { readRequiredStatusCheckContextsAsync } = await import(statusModule);`
      with the comment "status.ts's graph reaches review; load its existing reader only after both modules initialized".
    - postReviewStatusGuarded's cannot-evaluate path: `const escalationModule = "./escalate.js"; ... await import(escalationModule)`,
      "a top-level import closes a cycle and fails the dependency gate".
    - scripts/build-child-entries.mjs bundles with esbuild (bundle: true, format esm, packages external). esbuild leaves an import()
      of a non-literal specifier unbundled, so it resolves relative to the bundle file at run time, where no status.js exists.
    - The other variable import() sites in src (run-task.ts buildMountHeadroomSweep, run-task-verb.ts) pass absolute URLs and resolve.
    ATTRIBUTED: the brief described this class as "dist/child-entries exists before the image or reviewer switch". The error names a
    module that is never emitted into dist/child-entries, whatever the switch order, so the cause is the unbundled deferred import.
    NOT COVERED: W1-T9854 (queued) classes a harness module that cannot load as an environment failure; it would relabel this row, not
    stop it. W1-T8959 (merged, #12719) added the required-publisher read. W1-T8777 (merged) built the worker bundles.
    REPRODUCED 2026-11-03: the Azure current-main `rmd review 6 --repo wreckterra` run passed its acceptance grep, then `lint-plan`
      did not run because the shared stored `run-task.mjs` bundle threw `ERR_MODULE_NOT_FOUND` for package `yaml` from outside the
      Core checkout. The plan-only review remained FAILURE and no semantic model review ran. PR #16584 was diagnostic only and closed
      without merge, so it did not change the dependency-resolution path.
  design: |
    1. Break the cycle instead of hiding it: move readRequiredStatusCheckContextsAsync's dependency for replayPublisher (and the
       escalation calls) behind a seam the composition root passes in, or into a leaf module both graphs can import statically, so
       review.ts needs no deferred relative import. If a deferral must stay, its specifier is a string literal esbuild bundles.
    2. Never rename or wrap the import to dodge depcruise: if the cycle cannot be broken without a gate change, STOP and report it to
       the operator (house rule).
    3. The test builds the run-task bundle into a temp tree with the real buildChildEntries, executes it from a directory outside the Core checkout with the same runtime dependency layout as the shared child-entry store, and drives both deferred review paths with injected readers; it proves the required plan-lint runtime packages resolve and that removing the dependency-resolution change restores the missing-package failure. Criterion 2 scans the bundle graphs' sources for import() of a non-literal relative specifier.
    4. Use a supported, portable esbuild/runtime dependency strategy for compatible packages such as `yaml`; retain externalization only where required by Node-specific or native modules. Bump the bundle recipe version when the recipe changes. Do not rely on `NODE_PATH` for ESM resolution without a regression test that falsifies the observed failure.
    Tests go in test/worker/a-bundled-review-loads-the-modules-it-defers.test.ts, titled verbatim as in the proofs.
