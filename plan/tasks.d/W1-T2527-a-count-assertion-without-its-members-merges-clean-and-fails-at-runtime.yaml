- id: W1-T2527
  title: "A COUNT ASSERTION WITHOUT ITS MEMBER LIST MERGES CLEAN AND FAILS ONLY AT RUNTIME — two PRs each adding one entry to a shared table both change `assert.equal(x.length, 7)` to `8`, so git sees IDENTICAL text on both sides, auto-resolves, and ships a tree whose real count is 9; MEASURED on `test/fast-gate-admits-the-census-class.test.ts` when #3331 and #3335 both joined FAST_GATE_STEPS"
  repo: remudero
  depends_on: []
  type: implement
