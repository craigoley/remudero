- id: W1-T3701
  title: "THREE hand-frozen house-layout ceilings sit at EXACTLY their number with zero headroom, enforced by a 0.6-second check that only runs inside the 16-minute coverage shard — so the next src file to mention any of them fails a pull request 16 minutes late, and the sanctioned alternative has 7 callers against 24 inliners"
  repo: remudero
  depends_on: []
