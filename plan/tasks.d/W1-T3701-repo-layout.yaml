  note: |
    MEASURED 2026-09-16 on origin/main at 65e873a81.

    THREE OF THE FOUR LITERALS SIT AT EXACTLY THEIR CEILING -- zero headroom, by construction:

      literal            src/ files    frozen ceiling
      plan/tasks.d               24                24
      MASTER-PLAN.md             19                19
      learnings/                 16                16

    So the NEXT src file that mentions any of the three reddens a pull request, whatever it is for.

    THE CHECK IS 0.6 SECONDS AND IT RUNS ONLY IN THE SLOWEST JOB:

      $ time node --import tsx --test test/repo-layout.test.ts
      # tests 10   # pass 10   # fail 0   # duration_ms 564.8
      real 0m0.599s

    It is a pure filesystem read -- no instrumentation, no network, no fixtures. It reaches an
    author only through `coverage-shard (4/4)`, measured at 16.3 min average (W1-T3699), because
    sharding happens to put it there. Two pull requests hit it on 2026-09-16 alone: #5770 and
    #5785, each paying a full slow round-trip to learn something a pre-push gate could have said
    instantly.

    THE ESCAPE HATCH IS BARELY ADOPTED. `resolveRepoLayout` (src/lib/repo-layout.ts) landed
    2026-09-09. Seven days later: 7 src files call it, 24 still inline `plan/tasks.d`. The refusal
    names the remedy but nothing routes anyone to it, and nothing drains the 24.
  rationale: |
    THE DIRECTION IS RIGHT AND MUST SURVIVE. A house-layout literal in `src/` is real debt: it
    assumes a layout `resolveRepoLayout` exists to resolve. W1-T2922 was correct to make the count
    non-increasing. Nothing here proposes raising a ceiling, and raising one would be the failure
    the ratchet exists to prevent.

    THE FROZEN NUMBER IS THE DEFECT, NOT THE RULE. A hand-maintained constant has no path back
    down and no meaning except the day it was written. At zero headroom it stops being a ratchet
    and becomes a tripwire: it refuses diffs for what the repository already was, not for what the
    diff did. And it can only be satisfied by editing the constant -- which is precisely what must
    never happen -- or by unrelated cleanup the author did not come to do.

    THE SELF-HEALING FORM ALREADY EXISTS IN THIS REPOSITORY, AND THIS TEST CITES IT WITHOUT USING
    IT. `scripts/comment-load-ratchet.mjs` splits violations into the ones a diff CAUSED and the
    ones it INHERITED from the merge base, and for inherited ones says so and UPDATES ITS OWN
    LEDGER ("already carried N at the merge base -- inherited, not this diff's growth; the ledger
    is updated"). `repo-layout.test.ts`'s own comment quotes that same distinction in as many
    words, then freezes a constant instead. One sibling ratchet maintains itself; this one does
    not.

    A WALL PRODUCES NO FOLLOW-UP WORK. Today an author who legitimately needs a site is simply
    refused, 16 minutes late, with no record that the need existed and no task to convert the file.
    The 24 inliners are invisible as debt -- they are just the number the ceiling happens to equal.
  design: |
    (i) THE CEILING BECOMES THE MERGE BASE'S OWN COUNT, NOT A LITERAL. Compute the count at the
        merge base and compare the head against it, reusing the split
        `scripts/comment-load-ratchet.mjs` already implements rather than restating it. A diff that
        adds a site is refused because IT added one; a diff that inherits 24 is not blamed for 24.
        `HOUSE_LITERAL_CEILING` is deleted -- there is no number left to maintain, and none to raise.

    (ii) THE CHECK MOVES TO THE FAST GATE. At 0.6 s it belongs in `rmd preflight --fast`'s
         FAST_GATE_STEPS table, so an author learns at push time. It stays in the suite as well --
         this ADDS an early reader, it does not remove the gate.

    (iii) A LEGITIMATE NEW SITE FILES ITS OWN CONVERSION RATHER THAN BEING REFUSED OUTRIGHT. When a
          diff adds a site AND the file cannot reasonably resolve through `resolveRepoLayout` yet,
          the gate records a conversion task against that file and admits the diff. Refusal is kept
          for the case the author can act on now; the rest becomes work, not a wall. This is the
          tiered response, and it is why (i) does not simply relocate the cliff.

    (iv) THE DEBT IS REPORTED AS A RATIO, NOT A CEILING. The step prints callers against inliners
         (7 against 24 today) so the trend is legible and a conversion campaign has a number to
         move. No target is set: the number exists to be read, not to be hit.

    NO NEW THRESHOLD IS INTRODUCED ANYWHERE. Every arm keys on what a diff CHANGED relative to its
    own merge base. There is no count above which something fires and no floor beneath which it
    stays quiet.

    THE SUITE IS DECLARED IN files: AND THE PROOFS USE THE PURE-PATH FORM, not test titles. This
    task's files: already names a test/ path (the ratchet it rewrites lives in a test file), which
    turns on lint-plan's proof-unit-test-unresolvable rule: a title proof must resolve in the HEAD
    TREE, and a filing ships no titles. W1-T1071 records the sanctioned answer for exactly this
    shape -- a `unit test: test/<file>.test.ts` PATH resolves through W1-T456's forward-reference
    carve-out (forwardReferenceFiles, src/lib/review.ts) to not_yet_built on the filing PR, and to
    the real suite once it exists. The per-criterion falsifiers below carry what the titles would
    have said.
  acceptance:
    - claim: "a diff that adds no house-layout site passes even when the repository already sits at its inherited count, so a tripwire cannot refuse a diff for what the repository already was"
      proof: "unit test: test/a-house-layout-site-is-judged-against-the-merge-base.test.ts"
    - claim: "a diff that adds a site is refused against the merge base's own count rather than a frozen literal"
      proof: "unit test: test/a-house-layout-site-is-judged-against-the-merge-base.test.ts"
    - claim: "no hand-maintained ceiling constant survives, so there is no number to raise and none to go stale"
      proof: "unit test: test/a-house-layout-site-is-judged-against-the-merge-base.test.ts"
    - claim: "a site that cannot yet resolve through the layout helper records a conversion task and admits the diff, so the response is graded rather than a wall"
      proof: "unit test: test/a-house-layout-site-is-judged-against-the-merge-base.test.ts"
    - claim: "the check reports callers against inliners so the debt is a trend rather than a ceiling"
      proof: "unit test: test/a-house-layout-site-is-judged-against-the-merge-base.test.ts"
  falsifier: |
    Refuse a diff that added no site and the first test fails. Judge an added site against a literal
    rather than the merge base and the second fails. Leave a frozen ceiling constant in the tree and
    the third fails. Refuse outright where a conversion task is the right answer and the fourth
    fails. Print no adoption ratio and the fifth fails.
