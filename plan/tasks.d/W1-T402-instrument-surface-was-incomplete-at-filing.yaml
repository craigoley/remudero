    exported to guarantee.
    RULE 25 CHECKED BEFORE FILING, AND THE ANSWER IS NOT THE OBVIOUS ONE: files: names
    src/lib/review.ts, which is where the surface is DEFINED but is not itself ON it — no declared
    path matches, so detectInstrumentEntanglement has nothing to refuse. Worth stating because a task
    about the instrument surface reads as though it must trip it.
