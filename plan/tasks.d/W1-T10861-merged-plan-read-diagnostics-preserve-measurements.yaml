  rationale: |
    Original automation evidence issue #12001 records a merged-plan Git read that could not distinguish process failure, a timeout, output pressure or scheduling delay. W1-T9651 already owns the loop-available child bound. W1-T9670 / #12116 normally merged as bfcd6dd41d6aef43891878d409e3a0bcdd708ba3 and preserves a bounded stderr tail, signal and string error code; do not rebuild either mechanism or infer the original live cause from a private experiment.

    Fresh source at main 3112ac6f / plan-pr-merge-safety blob 3b273243 still exposes only status/stdout/signal/stderr. It drops explicit measured elapsed/output counts and killed/timeout provenance at the result boundary. The wording currently attributes any signal to its bound; a signal alone does not prove that cause. Existing unreadable/safe/unsafe merge dispositions are authoritative and must not change.

    Read-only scope covered 487 advertised heads, 302 unique plan trees and 8,790 independently content-hash-verified plan blobs, plus all six plan-safety-port variants. None contains the residual measurements. Complete current open-PR file pages and claim-to-plan records found no claimed implementation of that residual. #14860 is an active DISTINCT plan-hold repair in arm-auto-merge.ts: this task remains dispatch-held and source work must reconcile that writer or its normal merge before editing. Fresh subject/owner/source checks still apply at implementation time.

    Keep one concern: truthful diagnostic evidence from the existing sync/async Git factories to their existing merge-refusal ledger rows. Carry measured monotonic wall elapsed, explicit native error code and available killed/known-timeout evidence. Absent legacy readings remain unavailable, never measured zero. Preserve real measured zero. Count the actual available population: if using existing decoded string results, name UTF8 retained-output bytes, not raw pipe bytes; do not claim exact raw bytes after lossy decoding.

    Use the existing trusted repository/cwd and available main/head/merged-tree identity without logging blob stdout, credentials or credential-bearing arguments. Keep stderr redacted and within its existing cap. Attribute budget expiry only from the existing typed loop-bound evidence, not from signal presence. Unknown causes remain named unknown.

    Actual real-Git default-factory positive, missing-cwd, nonrepository and nonzero controls must run alongside each rejection/catch mapping. Reuse the existing shared timeout mechanism's qualification and exercise its caller boundary; do not invent a successful timeout reproduction, add a production timeout override or replace every default with fakes. Use committed guard-removal controls and exact restoration. Full normal author/CI/coverage/security/semantic review and ordinary merge remain; this parked filing is not source delivery, a gate waiver, retry allowance or production authority.
