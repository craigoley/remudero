  design: |
    The existing per-blocker backstops are unchanged, and W1-T8167 owns when they may fire.
    1. NAMED BY ITS REPEAT. The diagnosis adds the stage's dominant `sweep.disposed` reason signature since
       blocker_since, normalised (PR numbers, shas, counts and durations stripped), with its repeat count, for
       example `repeat: "remudero-review owner proven dead — re-running" x85`. "unknown signature" remains only when
       the stage has no repeated reason.
    2. OWNERLESS IS STALLED AT ONCE. A blocker whose `blocker_owner` is NONE is reported on its first disposition.
       No lane will move it, so waiting has no information value. This is structural, not a tuned minute count.
       Its stage row carries `owner: none`.
    3. ONE INCIDENT PER SIGNATURE. Each new `pr.stuck` also appends one `incident.event` (kind `flow`, name
       `pr-stage-stall:<blocker>:<signature>`, fingerprint kind plus name, subject `pr=`). The SRE lane then files
       one root-cause incident when the same signature stalls several PRs, alongside the per-PR escalation the stage
       already makes.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Drive runSweep with the #10783
    disposition history and an ownerless plan-proof-unrunnable PR.
