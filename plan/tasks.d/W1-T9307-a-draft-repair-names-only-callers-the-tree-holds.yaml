  falsifier: |
    Keep `callSiteViolations` accepting any path outside `created` and the first test fails: a fragment whose only call
    proof greps src/app.ts in a fixture tree without it lints clean. Let a CREATES line exempt the caller and the second
    fails. Restore the old `[call-site]` paragraph and the third fails on its candidate line. Restore "Add <path> to
    files:" for an absent path and the fourth fails. Remove any one of the three and the standing-debt:5 replay reaches
    a clean lint on round 2, so the fifth fails.
