      proof: 'grep: test("W1-T9307: the call-site relint lists real callers from the tree and says drop the claim when there are none" in test/a-draft-repair-names-only-callers-the-tree-holds.test.ts'
    - claim: "the proof-scope remedy for a path absent at head never tells the drafter to add that path to files"
      proof: 'grep: test("W1-T9307: a proof-scope remedy for an absent path never says add it to files" in test/a-draft-repair-names-only-callers-the-tree-holds.test.ts'
    - claim: "the standing-debt:5 repair that adds src/app.ts as an invented caller stays NOT READY"
      proof: 'grep: test("W1-T9307: the standing-debt:5 repair that invents an app caller stays NOT READY" in test/a-draft-repair-names-only-callers-the-tree-holds.test.ts'
    - claim: "the redraft prompt reaches the tree's callers through callSiteCandidates"
