  rationale: |
    OBSERVED 2026-10-13 (classification 20:37:28Z, raw-2037/targets.txt). The standing-debt:5 redraft is a docs-only
    recon task, yet it declares files [docs/recon/ownership-assertion-blocker-2026-10.md, src/app.ts] and a criterion
    `grep: checkOwnership( in src/app.ts`. Neither src/app.ts nor checkOwnership( exists on main, and the harness-composed
    stamp records the repair verbatim: "Added src/app.ts to files to satisfy proof scope". verify-human:W1-T216's redraft
    did the same with src/ci-pipeline.ts and `runForgeAttack(` ("The forge attack runner is invoked by the CI pipeline").
    WHY, READ on origin/main 017fe52a9 (symbols, not lines):
      - `callSiteViolations` (src/lib/task-linter.ts) treats every declared src path the tree does not hold as a NEW
        module, so an invented path in a recon task demands a call site. It then accepts as that call site any
        `grep: <sym>( in src/<x>.ts` whose path is not in its own `created` set, including a path the tree does not
        hold and the task never declared. A caller that does not exist satisfies the rule.
      - The `[call-site]` paragraph of `relintGuidanceLines` (src/lib/relint.ts), pasted into every redraft by
        `inboxDraftRelintPrompt` (src/lib/inbox.ts), says "Add a criterion whose proof is 'grep: <symbol>( in <the src
        file that calls it>'" and that the path "must be a DIFFERENT src file". It never says the file must exist,
        never names one, and never offers dropping the claim, so a drafter answering from the prompt invents one.
      - `proofScopeViolations` (src/lib/task-linter.ts) escalates to block exactly when the proof's path is ABSENT at
        head, and its remedy for that case is still "Add <path> to files:". The next redraft obeys and adds the
        invented file, which is the stamp above.
      - W1-T9062 (merged; its CREATES floor is on main) will refuse a declared path the tree does not hold, but it exempts a path declared
        on a `CREATES: <path>` line. A drafter told to "add a caller" can declare that caller as CREATES and pass, so the
        exemption must never let a new file stand as the call site.
    RELATED, NOT DUPLICATED: W1-T9062 owns the path-existence floor, the CREATES allowance, parked-shard grounding and
    the release-first draft. This task owns the repair loop's remedies and the call-site rule's caller. It depends on
    W1-T9062 for the CREATES convention and its shared predicate, and because both edit src/lib/inbox.ts.
  design: |
    No new bound; the existing relint bound (MAX_RELINT_ATTEMPTS) is unchanged.
    1. CALLERS COME FROM THE TREE. Add an exported `callSiteCandidates` in src/lib/relint.ts that, given the checkout
       a draft is linted against and a symbol, returns the existing src/*.ts paths that already hold `<symbol>(` (git
       grep on that checkout, the module itself excluded). For a new module with no known symbol it returns the task's
       declared src files that exist in the tree. `inboxDraftRelintPrompt` (src/lib/inbox.ts) calls it for every
       `[call-site]` violation and pastes the candidates beside the violation.
    2. THE REMEDY OFFERS REAL PATHS OR A DROP, NEVER AN INVENTION. The `[call-site]` paragraph of `relintGuidanceLines`
       and the `callSiteViolations` message say the calling file must EXIST in the tree today, name the candidates when
       there are any, and say otherwise: a task that adds no src module (a recon or docs task) removes the src path
       from `files:` and drops the claim; it never invents a caller file. `proofScopeViolations`, when the path is
       absent at head, no longer says "Add <path> to files:". It says the path does not exist, and the fix is to name
       an existing in-scope path or drop the criterion. The present-path message is unchanged.
    3. A CALLER THE TREE DOES NOT HOLD IS NOT A CALL SITE. At the draft floor (`lintDraftedFragment`, and so readiness
       through `blockingLintMessages`), a call-site-shaped proof (`grep: <sym>( in src/<x>.ts`) whose path the tree does
       not hold blocks as `[draft-call-site-absent]`, and so does one whose path is declared on a W1-T9062 `CREATES:`
       line. A new file can be the module under test; it is never the evidence that the program reaches it.
       `callSiteViolations` counts a proof as a call site only when its path exists per `opts.moduleExists`, so the
       plan-wide lint stops accepting an absent caller too (fixtures in test/call-site-rule.test.ts that relied on an
       absent caller get a predicate that holds it).
    4. THE REPAIR CANNOT CONVERGE ON AN INVENTION. Because (2) and (3) hold every round, a redraft that adds an absent,
       non-CREATES caller to `files:` stays dirty under W1-T9062's path floor and this task's rule, and is cached
       NOT-READY with the message after the bound, never READY.
    Tests go in test/a-draft-repair-names-only-callers-the-tree-holds.test.ts with the titles below verbatim. The
    standing-debt:5 test replays that draft's two rounds through `runDraftRung` with a stub spawn: round 1 declares
    the absent src/ownership.ts, and round 2 adds src/app.ts and `grep: checkOwnership( in src/app.ts`.
