  design: |
    No fixed bounds and no strike cap. Ask the model only when something it has not seen could change the ACTION.
    1. THE BAR IS DECIDED WITHOUT A MODEL CALL.
       - When the family bar moves, re-apply `planRiskJudgeAction` to the record's pinned verdict and confidence at
         the new bar.
       - A `high` verdict never flips on a bar move, so nothing is asked.
       - A `low` verdict whose recorded confidence now clears the bar lands as a re-pinned proceed through the one
         judge PR, with no model call. Its reason names the bar crossing.
       - The bar alone is no longer in `movedEvidence`'s ask triggers.
    2. WHAT STILL ASKS THE MODEL.
       - The record's pin (an edit re-pins, as today), merged depends_on, the cost the family's gardener prices, the
         deterministic backstop's answer, or the cadence falling due.
    3. A BACKSTOP-PINNED ESCALATION IS RE-EVALUATED DETERMINISTICALLY.
       - While `deterministicEscalation` still fires with the same reason, the record writes no reasked row and does
         not touch its family's re-ask record.
       - When the backstop stops firing (a record edit, or W1-T10350's change), the model is asked once, as a moved
         input named "backstop".
    4. THE CADENCE COUNTS ONLY CADENCE RE-ASKS.
       - `repeats` increments only on a cadence-triggered model re-ask with an unchanged answer. An input-triggered
         re-ask leaves the backoff where it was.
       - The family's `asked` and `flipped` counts only model re-asks.
       - The reasked row carries `next_due_at` as an ISO time beside `interval_ms`, so a reader sees a date and not a
         raw 1e20.
