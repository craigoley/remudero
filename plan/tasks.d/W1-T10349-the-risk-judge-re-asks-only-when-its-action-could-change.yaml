        also adds 1 to the family's `asked` count for every re-ask, deterministic ones included.
      - `reaskIntervalMs` = SCALE x odds x 2^repeats. So the bar-drift loop doubled a cadence interval that never
        triggered, and that interval reached 1.4e20 ms.
