  falsifier: |
    - Keep "confidence_bar" as an ask trigger: the stub judge is called on a bar-only move and the first test fails.
    - Re-ask instead of re-applying planRiskJudgeAction: the stub judge is called, or nothing flips, and the second
      test fails.
    - Re-ask a backstop record on every pass: a reasked row is written and `asked` grows, and the third test fails.
    - Increment repeats on an input-triggered re-ask: the interval doubles and the fourth test fails.
    Regression guards, kept by the same file:
    - A merged dependency, a changed cost or a due cadence still asks the model once.
    - An edited record re-pins and is judged fresh.
    - An unchanged answer writes nothing to the plan.
    - A flip lands through the one judge PR.
    - W1-T9043's 30-day withdrawal is unchanged.
    - An operator-released record is never re-asked.
