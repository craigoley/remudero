    THE CODE (src/lib/machine-filing-judge.ts).
      - `reaskParkedEscalations` computes `inputs = machineJudgeEvidence(task, earnedConfidenceBar(...), cost, isMerged)`
        and `moved = movedEvidence(entry.inputs, inputs)`. It skips a record only when
        `moved.length === 0 && !cadenceDue`.
      - `movedEvidence` reports "confidence_bar" whenever `then.bar !== now.bar`. The bar is
        `1 - (1 - base) * 2 * mean` over the family's Beta record, which moves whenever ANY task in the family merges
        or is retired. So it differs on almost every pass.
      - `judgeMachineShard` returns the deterministic backstop's escalation before any model call (confidence 1,
        verdict high). Otherwise it calls the risk judge model.
      - A bar move cannot change the action for a recorded `high` verdict. For a recorded `low` verdict it changes
        the action only if the bar crosses the recorded confidence, which `planRiskJudgeAction` can decide without
        a model.
