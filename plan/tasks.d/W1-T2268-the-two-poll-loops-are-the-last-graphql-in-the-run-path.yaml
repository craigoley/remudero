    - claim: "the poll cadence is unchanged, so no reduction in observations is doing the work"
      proof: "unit test: test/poll-rollup-over-rest.test.ts"
    - claim: "the injected read and sleep seams stay injectable so the loop is drivable without a network or a wall clock"
      proof: "unit test: test/poll-rollup-over-rest.test.ts"
