    THE TWO PULL REQUESTS ARE INDEPENDENT IMPLEMENTATIONS OF THE SAME TWO FILES:

      #43  added lib/canonical-docs.ts (+63)  tests/unit/canonical-docs.test.ts (+60)  MERGED
      #46  added lib/canonical-docs.ts (+52)  tests/unit/canonical-docs.test.ts (+71)  closed by hand

