  acceptance:
    - claim: "Each commit of an advance gets one class. `reviewer`: it changes a path that is material for a review. `loop`: it is not `reviewer` and it changes a file in the import closure of the daemon. `worker_only`: it changes `src/` or `scripts/` and neither of the two. A commit that cannot be classed is `loop`"
      proof: "grep: W1-T12230 criterion 1 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "A `worker_only` commit adds no change pressure. A `reviewer` commit and a `loop` commit add 1 each, as today"
      proof: "grep: W1-T12230 criterion 2 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "For an advance with `loop` commits and no `reviewer` commit, the staleness pressure reaches the score limit at the policy row `loopOnlyHorizonMs`, not at `stalenessHorizonMs`"
      proof: "grep: W1-T12230 criterion 3 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "For an advance with a `reviewer` commit, the staleness pressure reaches the score limit at `stalenessHorizonMs` after the daemon first read that commit, as today"
      proof: "grep: W1-T12230 criterion 4 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "The policy block `freshnessRestart` has the row `loopOnlyHorizonMs` with the value 10800000 and bounds. The loader refuses a value below `stalenessHorizonMs`"
      proof: "grep: W1-T12230 criterion 5 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "The row `daemon.freshness_decision` carries the count of commits in each class and the horizon that the decision used. The test drives `runDaemon` with a freshness reading that the real `daemonFreshnessFromService` made"
      proof: "grep: W1-T12230 criterion 6 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "An install input change, a withheld review and an unreadable advance release the restart as today"
      proof: "grep: W1-T12230 criterion 7 in test/daemon/the-restart-score-counts-a-change-by-the-code-it-affects.test.ts"
    - claim: "The decision row names the classes"
