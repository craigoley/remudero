- id: W1-T3602
  title: "A MECHANICAL CONFLICT RESOLUTION CAN DISCARD A SIDE NOBODY READ — the sweep's conflicted-PR disposition admits an rmd-owned branch to automatic resolution on evidence it never checks byte-for-byte, so a 'redundant re-fix' that is only partially redundant, a deletion conflict, or a hunk that differs from main is resolved unattended instead of being sent to a bounded semantic repair worker"
  repo: remudero
  depends_on: []
