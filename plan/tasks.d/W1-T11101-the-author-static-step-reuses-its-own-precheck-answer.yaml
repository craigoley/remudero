- id: W1-T11101
  title: The author preflight's static step reuses the census answer the author run already took for the same head, instead of running census-precheck a second time
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # three files, one concern: the author static stage skips a census the same run already answered; the fleet pre-open gate keeps its own census step
  origin: operator-session#preflight-throughput-2026-11-02
  plan_refs:
    - W1-T6435
    - W1-T11098
  files:
    - scripts/preflight-author.mjs
    - src/lib/ci-parity.ts
    - src/lib/config-schema.ts
    - test/ci/parity/the-author-static-step-reuses-its-own-precheck-answer.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: When the author preflight's own census-precheck step answered for HEAD, its static stage records census-precheck as answered by that step (naming the head sha and the author step's outcome) without spawning census-precheck again
      proof: "unit test: test/ci/parity/the-author-static-step-reuses-its-own-precheck-answer.test.ts"
    - claim: An answer recorded for a different head, an absent answer, and every run outside the author preflight (rmd preflight run directly, the fleet pre-open gate) still spawn census-precheck exactly as before
      proof: "grep: W1-T11101 criterion 2 in test/ci/parity/the-author-static-step-reuses-its-own-precheck-answer.test.ts"
  rationale: |
    MEASURED 2026-11-02, coverage/preflight-author-static.json of W1-T11094's author run (staticTiming per check):
    - static-preflight took 3,085 s. census-precheck inside it took 1,896 s (61%), rule-checks 924 s (30%), claims 82 s, and the other 25 checks about 3 min together.
    - The same author run had already run census-precheck as its own step (2,117 s). Both ended NOT MEASURED on the time bound, so the second run bought nothing.
    - census-precheck joined the fast-gate steps (W1-T6435) so a hand-built PR that never ran hooks/pre-push still got a census check. The author preflight now runs it as its own step, and from W1-T11098 its counts first.
    - A measurement replaced the original W1-T11101 (seed a new worktree's tsc buildinfo). seedFromCanonical already seeds, a cold typecheck is 28-50 s, and a seed only helps when the TS inputs are identical, which a hand-build never has.
  design: |
    preflight-author passes RMD_AUTHOR_CENSUS_ANSWERED=<headSha>:<outcome> in the static stage's childEnvironment after its census-precheck step returns. Outcome is ok, refused or time-bound; a run whose census refused never reaches static anyway. ci-parity's census-precheck step, and only that step, reads it. When the sha equals the tree's HEAD, it returns ok with detail "answered by the author preflight's census-precheck step at <sha> (<outcome>)" and no spawn. Otherwise it runs as now. The fleet pre-open gate and rmd preflight never set the variable. The variable is registered in ENV_REGISTRY (src/lib/config-schema.ts), and HEAD is read through hostWorktreeGit.
  note: |
    reservation hand-off: run-unfiled-1793629687846 -> run-unfiled-1793629687846
    Reserved with rmd next-task-id from the operator checkout (W1-T11098..W1-T11102 on run-unfiled-1793629687846). Operator ruling 2026-11-02: "go with all of your recommendations". Re-scoped before filing on a measured finding.
