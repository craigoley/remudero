- id: W1-T3337
  title: "THE REVIEW GATE PUBLISHES AUTHORITATIVE VERDICTS FROM CODE IT HAS ALREADY RECORDED AS STALE — `daemon.stale_code` is ledgered and read by nothing, so the reviewer spent hours refusing PRs on a predicate that had been superseded on main, and the verdict carries no provenance that would let a reader tell a stale refusal from a real one"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
