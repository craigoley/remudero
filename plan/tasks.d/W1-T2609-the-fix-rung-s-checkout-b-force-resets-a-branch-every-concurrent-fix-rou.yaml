  note: |
    FILED 2026-08-30 from the follow-up harvest of W1-T2441 (run DAEMON-1788016810368,
    https://github.com/craigoley/remudero/pull/3261), verbatim id
    followup:DAEMON-1788016810368:2026-08-29T15:50:53.273Z:0.
    THE FOLLOW-UP'S OWN ANALOGY IS HALF RIGHT AND THE HALF THAT IS WRONG IS THE LOAD-BEARING ONE.
    W1-T2441 concerns the WORKER-HOME directory, which is keyed on `runId` and where per-spawn
    uniqueness IS the remedy (W1-T2463 owns that remedy; W1-T2441 is instrumentation-only by its own
    constraint). The fix rung's analogue is the WORKTREE — and it is already unique per attempt. The
    branch is a DIFFERENT kind of object: it is the PR's head, an identity other machinery reads, so
    uniqueness there is not a safety property but a credit-destroying one. Same class of bug
    (unsynchronised shared mutable resource), OPPOSITE remedy (exclusion, not uniqueness). Recorded
    because the follow-up invites the reader to copy the wrong half.
    risk:high — this edits the fix rung's commit/push path, and Rule 19's sizing exemption is not why:
    a defect here either parks the fix rung fleet-wide or admits the silent work loss it exists to
    remove. The refuse-rather-than-reset criterion is the guard, and it is load-bearing.
    SEQUENCING, not a hard dep: W1-T2610 touches src/run-task.ts too, so W1-T171's overlap check will
    serialize the pair. Deliberately expressed as file overlap rather than depends_on — both are
    independently valuable, and a hard edge would strand the detection half if this one stalls.
