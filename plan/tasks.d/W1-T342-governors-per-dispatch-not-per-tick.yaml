  note: "verify:auto — admission decisions over injected readings, fully machine-checkable.
    risk:high — it changes how a SPEND ceiling admits work, on a gate with almost no production
    history. Wrong in the permissive direction it doubles the overshoot lanes would cause; wrong in the
    restrictive direction it stalls the fleet on a governor that should not have fired.
    budget_usd 60 — one gate relocation plus staleness treatment and a two-direction falsifier.
    NO depends_on: correct at N=1 (where it is a provable no-op) and it must land BEFORE the lane
    wiring, not after — shipping lanes first would double the traffic through an ungated ceiling for
    however long this took to follow. It is a prerequisite of W1-T343 rather than a companion to it.
    NOT A W1-T326 BLOCKER. That entry named three obstacles and did not name this one; the per-tick
    evaluation point is a fourth, surfaced by the operator's regression list. Recording it here so the
    ruling amendment can carry four obstacles rather than silently inheriting three."
