- id: W1-T9650
  title: "LEAK-GREP REPRINTS A FOUND SECRET INTO A PUBLIC CI LOG AND TELLS THE READER ONLY TO REWORD IT — it echoes every matched line in full, and its one remedy is for a false positive; report the path, line and pattern instead of the match, and say that a real secret must be rotated"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: low  # Rule 19: one concern — what leak-grep prints and advises; patterns and exit codes unchanged
  band_meaning: blast-radius
  origin: "operator ask 2026-10-15: review five agent and skill catalogs for innovation, leaning into automation and self-improvement (MASTER-PLAN §4G)"
  plan_refs: []
  files: [.github/scripts/leak-grep.sh, test/leak-grep-names-where-a-secret-is-never-the-secret.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ at origin/main 3f9003ebf (2026-10-15).
    - .github/scripts/leak-grep.sh echoes every matched line in full (`echo "$matches"`, :32).
    - Its only remedy text is for a false positive: "reword it so the pattern no longer matches" (:40). Nothing says
      what to do about a real secret.
    - leak-grep is a required child check of ci-gate (.github/workflows/ci-gate.yml:92).
    - craigoley/remudero is public, so its Actions logs are public, and a log outlives the branch fix.
    - The CI-log fix rung reads a job's log region into the fix worker's prompt (`defaultCiJobLogRegionAsync`,
      src/run-task.ts:42840). INFERRED, not run: a real key would reach a worker prompt along with the advice to reword
      it, which hides the key from the check without un-leaking it.
    - GitHub push protection makes a real hit rare; the cost when it happens is a live credential.
    Found while reading msitarzewski/agency-agents (security-ai-generated-code-auditor.md): never print a secret back,
    and a real leak needs rotation, not deletion.
  design: |
    1. For each hit, print `path:line`, the pattern's label (the trailing comment on its PATTERNS entry) and at most
       the first 4 characters of the match. Never the full line.
    2. Add the true-positive remedy to the failure text: "A real secret on a pushed branch is already exposed: rotate
       it at the provider. Rewording or deleting it does not un-leak it."
    3. Patterns, the excluded self-path and exit codes are unchanged.
    New tests go in test/leak-grep-names-where-a-secret-is-never-the-secret.test.ts. They run the script in a temp git
    repository with a planted key. Build the key at runtime (for example "gh" + "p_" + "A".repeat(36)) so the test
    source never matches a pattern itself; otherwise leak-grep would fail on its own test.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/leak-grep-names-where-a-secret-is-never-the-secret.test.ts"
    - claim: "leak-grep reports a planted key's file, line and pattern, never the key itself"
      proof: 'grep: test("W1-T9650: leak-grep reports where a planted key is without printing the key" in test/leak-grep-names-where-a-secret-is-never-the-secret.test.ts'
    - claim: "the failure text names rotation"
      proof: "grep: rotate it at the provider in .github/scripts/leak-grep.sh"
  falsifier: |
    Restore `echo "$matches"`. The first test then finds the planted key in the output.
