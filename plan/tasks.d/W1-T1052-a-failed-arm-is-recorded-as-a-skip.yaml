  note: |
    `files:` WAS DERIVED BY WORD-BOUNDED INVOCATION COUNT, NOT GUESSED. `logArmAttribution` reads 5
    in `src/run-task.ts` AND NOWHERE ELSE, which is why that one module carries the whole source
    side; the other two emissions of the same literal are `armIfVerdictPermits`'s dependabot skips
    in the same file. On the test side exactly six files assert the literal, and every one of them
    is declared, because a rename that leaves an assertion behind fails the suite rather than the
    review. DECISIONS.md's 2026-08-18 W1-T471 ruling governs the `src/run-task.ts` declaration: it
    states a new shard declaring the file *"should simply declare it"*, so this one does and cites
    the ruling instead of reciting a formula. The shard's own path is absent.

    ONE HAZARD FOR THE IMPLEMENTER, FROM THIS REPO'S OWN RECORD: `test/run-task.test.ts` has
    intermittently crashed at FILE level under coverage instrumentation, which zeroes the coverage
    record for everything in it. THE RENAME ONLY EDITS EXISTING ASSERTIONS THERE — do not add a
    coverage-load-bearing new test to that file; put any new case in its own file.

    RISK IS `high` UP FRONT AND THE BAND IS RULE 19's SPAN, not blast radius: one source module and
    six test files. The change ships no new behaviour and no new row.

    EVERY FIGURE IS DATED 2026-08-20 AND WILL DRIFT — RE-RUN THE QUERY RATHER THAN QUOTING IT.
    The census: `zgrep -h '"step":"automerge.arm_skipped"' <every ledger form> | sort -u`, then
    tally the `outcome` FIELD — never the step name, which is the whole point of this task. Take a
    per-form file count as the coverage control before trusting any total. Readers of the literal:
    `git grep -alw` across `src/` and `test/`, with `automerge.armed` as the positive control since
    it has real consumers. Membership: `test/ledger-rotation.test.ts` derives it by scanning
    consumers, so run that test rather than reading the constant.
    AND THE NUMBER THIS SHARD COULD NOT SUPPLY is how often the failure has actually occurred. This
    host's rows overlap the current code by about thirty-four hours; the fleet's own ledger is where
    that count lives.

    ID PROVENANCE — FIVE SURFACES, RE-SWEPT IMMEDIATELY BEFORE PUSHING, AND THE FOURTH ONE IS NOT
    DECORATION. Pre-minted by the operator and read back against the sha he supplied before any
    work started: `refs/rmd-id/W1-T1052` -> 6dd5b10344986bf0fd87bcf4140a2c8350b798d1, matched. The
