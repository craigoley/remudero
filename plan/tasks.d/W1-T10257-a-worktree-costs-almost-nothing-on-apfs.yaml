- id: W1-T10257
  title: "EVERY MAC WORKTREE WRITES ~128 MB OF FILES THE OPERATOR CHECKOUT ALREADY HOLDS — APFS can clone them for almost nothing (a cp -c of test/ cost ~3 MB of free space for 57 MB of files), so `rmd worktree add` cuts the worktree with --no-checkout, clones the checkout's unchanged tracked files copy-on-write, reconciles to the base with git, and falls back to a normal checkout off APFS"
  repo: remudero
