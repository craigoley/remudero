  design: |
    1. In `machineFilingAdmissionViolations`, a ci-learning parked proposal's single declared path is exempt from
       `missingDeclaredPaths` when it matches the exact learnings/ci.d/<slug>.yaml pattern `isParkedMachineProposal`
       already uses (one shared predicate, not a second regex).
    2. Every other admission reason still applies to it (selectable, verify:human parked, dependencies), and every other
       origin's exemptions are unchanged. A ci-learning record naming any other missing path, or a second path, is
       still refused.
    3. TESTS in test/a-ci-learning-filing-names-its-new-lesson-file.test.ts, `test(` titles verbatim as in the proofs,
       driving `machineFilingAdmissionViolations` with an in-memory plan and a fake tree; no git.
  acceptance:
