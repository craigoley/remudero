      proof: 'grep: test("W1-T10027: a ci-learning filing naming its own new lesson file is admitted" in test/a-ci-learning-filing-names-its-new-lesson-file.test.ts'
    - claim: "a ci-learning filing naming a missing path outside learnings/ci.d is still refused"
      proof: 'grep: test("W1-T10027: a ci-learning filing naming a missing src path is still refused" in test/a-ci-learning-filing-names-its-new-lesson-file.test.ts'
  falsifier: |
