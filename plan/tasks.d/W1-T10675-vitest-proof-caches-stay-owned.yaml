  design: "Use a proof-owned writable scratch cache for shared-install Vitest filesystem module transforms, wired through createProofCache at the real synchronous and asynchronous proof execution boundary, including check-proof/head/base discrimination and prepared-argv paths. Consult the installed pinned runner version/capability and the primary Vitest 5 fsModuleCachePath contract (https://vitest.dev/config/fsmodulecachepath): its CLI option is --fsModuleCachePath=<path>, distinct from the Vite config cacheDir. Preserve native config loading, target-specific pinned CLI/config, literal name filtering, suite-root restrictions, TAP leaf counts, timeout, no-match/fail/exec_error distinctions and Core Node/grep argv. Keep ordinary dependency installations compatible and never pass an unsupported version flag blindly; unavailable runner metadata/capability remains explicit. Isolate head/base/revision/proof cache identities, retain lockfile invalidation and bounded resource guards, and remove only the completed invocation owned cache after child settlement, including errors and timeout. Never write/chmod/reinstall/clear shared dependency seeds, mutate the consumer lockfile/config, weaken acceptance or coverage, add exclusions, disable result validation, or count an import failure as a discriminating base failure. Exercise the real default child/filesystem path and both executors, not only injected spawners. Independently qualify the preserved Console head with its actual pinned Vitest 5 installation and the real native head/base checker after source deployment; keep that measurement distinct from fixture CI. No consumer source or budget changes."
