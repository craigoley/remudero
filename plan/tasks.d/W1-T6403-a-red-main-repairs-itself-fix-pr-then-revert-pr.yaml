- id: W1-T6403
  title: "A RED MAIN REPAIRS ITSELF — A FIX PR FIRST, THEN A REVERT PR: #10092 turned main red at 12:14:50Z on 2026-10-08 (the wall-clock census measured 32 files/52 sites against a recorded 33/53), core logged main.health.observed red 12 times and repaired nothing, every PR's CI failed the same census, and a human fixed it in #10102 at 12:54Z"
