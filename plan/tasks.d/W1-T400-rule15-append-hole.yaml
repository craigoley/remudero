  status: queued
  attempts: 0
  note: "verify:auto — every claim is a predicate assertion over synthetic diffs, decidable
    in-process with no operator and no network.
    risk:high is NOT the diff size, which is plausibly a few lines. It is that this widens a BLOCKING
    merge gate in the direction that can park legitimate work: every task filing in this repo is an
    append of claim and proof lines, and the ONLY thing separating a filing from a worker rewriting
    its own specification is the planOnly exemption. Clause (iii) exists to prove that separation
    holds empirically before the predicate changes, and clause (iv) to bound what newly fails.
    RULE 25 CHECKED BEFORE FILING: files: contains no INSTRUMENT_SURFACE path.
    budget_usd 70 — above W1-T399's because clause (iv) requires measuring real merged diffs rather
    than reasoning, and because the withdrawal condition in clause (iii) has to be genuinely tested
    rather than waved at.
    SEQUENCING, a preference and deliberately NOT a depends_on edge so it cannot stall: land after
    W1-T399 and after W1-T389/#1465. All three touch src/lib/review.ts in different functions.
    ON THE PROOFS: all three name test/rule15-append-hole.test.ts, which does not exist yet — a
    forward reference to a PATH, safe per CLAUDE.md, declared in files: so the worker creates it."
