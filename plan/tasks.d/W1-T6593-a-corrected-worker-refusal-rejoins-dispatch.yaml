  design: |
    Rejoin the existing categorized-refusal and revision-aware admission mechanism with the
    durable status/selector latch. Reuse extractRefusal and preDispatchContractRevision; do not
    add another refusal dialect, publisher, generic reset command or disk read on the hot loop.
    Preserve source-run identity and the contract that was refused. Only a verified categorized
    refusal whose relevant contract changed earns one normal dispatch, with a durable reason
    receipt; an unchanged record, comment-only amendment, unrelated plan reload, unreadable
    source or ordinary task failure stays held. The retry's run.start spends that opportunity,
    and a new refusal holds its own new contract. Projection and real daemon admission must
    agree. Keep all gates, operator holds, dependency checks and worker ownership unchanged.
    Recover the already-stuck historical T100 case from its real refusal/hold evidence through
    the same path, without rewriting old verdicts or fabricating a successful run. Avoid import
    cycles; use the existing boundary's supplied facts where importing its parser would cycle.
