  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `.github/workflows/` and `test/`. The blast
    radius is one new workflow that can only ever ADD a signal; it gates no merge and blocks no PR.
    `verify: human` — design (ii) versus (iii) is a cost question about a permanent per-merge tax on a
    twenty-a-day fleet, and no linter can settle it. This shard recommends neither.
    `files:` IS TWO PATHS AND `src/run-task.ts` IS DELIBERATELY NOT DECLARED. The exit-2 behaviour
    this rationale rests on ALREADY EXISTS in `lintPlanCommand`; nothing about it needs to change, so
    declaring that file would serialise this task against every other naming it (W1-T471) for no
    edit. RULE 25 IS SATISFIED BY CONSTRUCTION: `.github/workflows/` matches `INSTRUMENT_SURFACE`
    (`src/lib/review.ts`) and `test/` is excluded from `isProductPath`, so an instrument-plus-test
    changeset reads `entangled: false` — but it also means THIS TASK MUST NEVER BE BUNDLED WITH A
    `src/` CHANGE, which is a second reason the recovery half in design (iv) belongs to its own PR.
    EVERY CRITERION IS `unit test:` ON PURPOSE. A shard whose proofs are all `grep:` patterns against
    its own file caps its own implementation at `proof_exec: 0/N` and needs an operator override —
    that happened to #1812 — and a `grep:` naming this shard's own path additionally draws a
    `proof-scope` warning that BLOCKS in CI's changed-tasks pass.
    THE RATE IS THREE ID COLLISIONS IN THREE DAYS, BUT ONLY ONE BROKE MAIN, and that asymmetry is the
    honest sizing input: the id collision is the common event and the broken main is the rare
    consequence. A reader who wants to argue this is too rare to build should start from that, and
    from the fact that the recovery, once known, is one command.
    PROVENANCE. `strict: false`, `enforce_admins: true`, the two `base.sha` values, the four
    push-triggered workflows, the three `DEFAULT_FIX_CLASSES` rows and every timestamp are GitHub API
    or tree facts at e8bcaf60, taken 2026-08-14 from the mac mini. NO LEDGER FIGURE IS USED, so
    nothing here is a claim about either host's ledger, and the mini and Azure keep separate ones
    with no route between them. SHIPPED, RECORDED 2026-09-02 (evidence only). THIS TASK IS BUILT: a merged commit on origin/main carries its own Remudero-Task trailer -- 07d4e44b feat(ci): fail a check on main when the plan no longer loads (#1897). status: queued and verify: human are BOTH left alone: the status field is decorative by documented design and the operator ruled LEAVE THEM on 2026-08-05, and the human gate is this shard's own deliberate parking choice, not this block's to revoke. Nothing mechanical was misled either, since isDispatchEligible refuses a non-auto task before any probe. This record exists because a READER picking build candidates was misled, not a machine."
