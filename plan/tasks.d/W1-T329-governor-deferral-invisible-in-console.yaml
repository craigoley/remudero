  note: "verify:auto — a retention set, a pure posture derivation and a rendered slot, all
    machine-checkable. The strip render is covered by a REAL Chromium page (test/serve.glance.test.ts),
    which is the standard this repo already holds serve.ts DOM behaviour to.
    risk:high — Rule 19 counts ledger, account-usage, serve and the test surface as distinct
    subsystems, and it touches the rotation path: a step added to the WRONG set is retained forever.
    budget_usd 90 — the highest on this board because retention, derivation and a real-browser render
    are three separate proofs, and the retention lock re-derives from consumer source so it cannot be
    satisfied by editing a list.
    files: DELIBERATELY LISTS ALL SIX. A rendered ledger step implies the retention set AND the lock
    that re-derives it; omitting either is how five dispatches died to the scope guard this week.
    NO depends_on: nothing blocks this. W1-T330 (the cost ceiling as a policy row) is the ADJUSTMENT
    half of the same operator complaint and is independent — seeing the limit and changing it are
    different changes to different files."
