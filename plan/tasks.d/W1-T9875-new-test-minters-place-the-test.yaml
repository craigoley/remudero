  rationale: |
    Citations re-verified at origin/main 889966ea5 (2026-10-16). (plan/seeds/test-restructure-2026-10-16/coupling-inventory.md section F)
    - src/lib/inbox.ts:1723 sets the drafting rule: "A new file is either test/<task-title-slug>.test.ts or declared in
      design on its own CREATES: <path> line". draftMissingPathViolations (~2144) exempts only the exact
      `test/${slug}.test.ts`, so a nested new path without CREATES: is refused with draft-path-missing (block).
    - The gardeners mint flat paths:
      - hot-file-gardener.ts:245 `test/${hotFileShardStem(file)}.test.ts`;
      - ci-friction-gardener.ts:1219 `test/${ciFrictionShardStem(key)}.test.ts`;
      - flow-gardener.ts:483 `test/${flowFollowUpStem(stat)}.test.ts`;
      - flow-remedy-gardener.ts:392 `test/${kind.stem}-${stem}.test.ts`;
      - scout-gardener.ts:207 `test/scout-...test.ts`;
      - selector-shadow-gardener.ts:1207 `test/affected-suites-selects-...test.ts`.
    - src/lib/plan.ts:452 SCOUT_TEST_FILE = /^test\/scout-[\w.-]+\.test\.ts$/ and plan.ts:482
      SELECTOR_SHADOW_MISS_TEST_PATH (used at ~490) recognise flat shapes only.
    - CLAUDE.md, AGENTS.md and CONTRIBUTING.md say nothing about where tests live.
  design: |
    1. Each minter computes the folder with placeTest (W1-T9874) from the src modules its minted task names in files:
       and from the test's slug, then mints test/<folder>/<slug>.test.ts. When placement has no signal, it uses the
       folder of the module the finding is about (every gardener has a subject file); it never falls back to flat test/.
    2. inbox.ts:
       - the drafting rule text says a new test goes in test/<computed folder>/<slug>.test.ts;
       - draftMissingPathViolations exempts that path;
       - a new check, draft-test-unplaced (block), refuses a draft whose new test path sits directly under test/ or in
         a folder that is not in scripts/test-placement/subsystem-map.json.
    3. plan.ts: SCOUT_TEST_FILE accepts a scout test in any mapped folder. SELECTOR_SHADOW_MISS_TEST_PATH is compared
       with sameTestFile (W1-T9862), so the shape survives the move.
    4. DOCTRINE. Add a CLAUDE.md headline under "Plan and task hygiene": "**A new test goes in the test/<folder>/ that
       `rmd test-place` computes from its imports — never directly under test/.** →
       the new body page new-tests-go-in-their-computed-folder.md in the plan-and-task-hygiene doctrine section". The body cites this task and
       placeTest. Run `npm run agents-md`.
    New test flat in test/.
