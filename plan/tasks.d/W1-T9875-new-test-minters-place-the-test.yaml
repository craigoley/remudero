    - claim: 'the doctrine index says where new tests go'
      proof: 'grep: new-tests-go-in-their-computed-folder in CLAUDE.md'
  falsifier: |
    On origin/main every minter interpolates `test/${...}.test.ts` and draftMissingPathViolations exempts only the flat
    slug path, so the drafting and gardener tests fail. SCOUT_TEST_FILE rejects a nested path. CLAUDE.md has no such
    entry.
