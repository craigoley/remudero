    - claim: "the same head on the same image is never re-reviewed twice, and a failure with no hand-off keeps the fix route"
      proof: 'grep: test("W1-T9970: the same image never re-reviews twice and an un-handed-back failure keeps its fix route" in test/a-review-fail-handed-back-for-the-sandbox-is-re-reviewed-on-a-newer-image.test.ts'
    - claim: "the review.posted row records the image the reviewer ran in"
      proof: 'grep: runtime_image_sha in src/run-task.ts'
