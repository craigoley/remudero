  design: |
    No new constant or count. Decide from the check's own log.
    1. In the cancelled-check arm, before cancelledCheckRequeueDecision grants a requeue, read the cancelled
       check's CiFailure. When its W1-T8038 signature says the job ran tests and was cancelled at its ceiling
       after a failure (a pool failure, a POOL DEFECT, or a timeout after a failing summary), do NOT requeue:
       - ledger a `sweep.check_requeue.skipped` row with reason "deterministic-timeout", the check name, the
         head and the signature;
       - leave the check among ciFailuresForFix as a genuine failure, so the ci-log fix path receives it
         with its signature, instead of a stand-down as "cancelled required check(s)".
    2. "Timed out after a passing summary" with no failure in the log is NOT deterministic evidence. Every
       test passed, so a hang after the summary may be environmental. It keeps today's one bounded requeue.
       So does a cancellation with no readable log, a superseded run (the SHARD HANG block's SUPERSEDED arm)
       and the W1-T5939 Actions-incident hold. Those paths are unchanged.
    3. A re-run that comes back cancelled with the SAME signature at the same head is already escalated by
       W1-T1223's cancelled-twice arm. Name the matching signature in that escalation's reason.
    Tests go in a new file, test/a-deterministic-shard-timeout-is-not-re-queued.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive runSweep with an OpenPrView replaying #10852: two cancelled
    ci-shards whose logTails hold the pooled failure, plus a recording requeueCheck.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/a-deterministic-shard-timeout-is-not-re-queued.test.ts"
    - claim: "a cancelled shard whose log names a failure before its ceiling is not re-queued and reaches the ci-log fix path"
      proof: 'grep: test("W1-T8040: a shard cancelled at its ceiling after a failing test is not re-queued" in test/a-deterministic-shard-timeout-is-not-re-queued.test.ts'
    - claim: "a cancellation with no failure in its log keeps its one bounded requeue"
      proof: 'grep: test("W1-T8040: a cancellation with no failure in its log is still re-queued once" in test/a-deterministic-shard-timeout-is-not-re-queued.test.ts'
  falsifier: |
