    W1-T1223's premise, "a cancelled required check has no defect in the diff", holds for a superseded run,
    a runner loss or an Actions incident. It does not hold for a job that ran its tests, recorded a failure
    and was cancelled only by its own ceiling at an unchanged head.
    DEPENDS ON W1-T8038 for the signature. Also on W1-T5978 (in flight; it edits the same requeue escalation
