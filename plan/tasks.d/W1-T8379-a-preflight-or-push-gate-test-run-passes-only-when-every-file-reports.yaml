- id: W1-T8379
  title: "A PREFLIGHT OR CENSUS TEST RUN PASSES ONLY WHEN EVERY FILE REPORTS — the preflight ci-checks census suites, the containment probe, census-precheck's suite child and a fix round's reach-ratchet check still read `node --test` exit 0 (or exit 0 plus a nonzero `# tests`) as a pass, so a suite that exits 0 before its own summary passes a merge or push gate; judge each run the way #10894/#10918/#11000 judge theirs"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high # Rule 19: one concern (what counts as a finished test run) across three subsystems: run-task, ci-parity, census-precheck
  band_meaning: blast-radius
  origin: "operator session 2026-10-12: the judged-runs sweep after #11000 (the review's unit-test proof runner)"
  plan_refs: [W1-T4108, W1-T4693]
  files: [src/run-task.ts, src/lib/ci-parity.ts, scripts/census-precheck.mjs, test/a-preflight-or-push-gate-test-run-passes-only-when-every-file-reports.test.ts]
  status: queued
  priority: 1.5
  attempts: 0
  rationale: |
    A `node --test` child can exit 0 without finishing: a test file whose code calls `process.exit(0)`, or a worker
    that dies, loses that file's remaining tests, and node still prints `# duration_ms` and exits 0. #10894 and #10918
    made every CI and pre-push runner judge this: a run passes only when every file it names reaches its own per-file
    summary (`judgeRun` in scripts/pure-test-pool.mjs). #11000 did the same for the review's `unit test:` proof runner.
    READ at origin/main 0525727d0, four local gates still read exit 0 as a pass:
      - src/run-task.ts `runPreflightCiChecks` (PREFLIGHT_CI_CHECKS, ~30291): the `command-registry-census` and
        `deps-interface-census` entries spawn `node --test` on one file each, and `shellOut`'s exit status alone sets
        the step's `ok`. `rmd preflight` then prints "the push may proceed".
      - src/lib/ci-parity.ts, the `containment-probe` job (~1977): its `containment-probe:test` leaf runs
        test/containment.test.ts through `shellOut` and passes on exit 0.
      - scripts/census-precheck.mjs `runCensusSuitesViaChild` (~580): it throws on no `# tests` line and on 0 tests,
        and lists failing suites from TAP `not ok` lines. A suite that exits 0 partway has no `not ok` line, so it
        reads as passing. This runner gates the pre-push hook and every fix round's push.
      - src/run-task.ts `checkFixCensusSnapshot` (~18138): a fix round's census check runs
        test/the-affected-suite-reach-ratchet.test.ts and passes on exit 0 plus `# tests [1-9]`.
    Already judged, not in scope: retro-preflight (through scripts/test-with-retry.mjs), preflight-author and
    flake-screen. The filing, gardener and open-weight worker runners are W1-T8380.
  design: |
    1. Each of the four runs is judged with scripts/pure-test-pool.mjs's existing exports, never a second
       implementation: `prepareJudgedRun` → `judgedNodeTestArgs(args, judged.args)` (plus `judged.env`) → spawn →
       `judgeRun(files, {status, pool: false, root, ...judged.read()})` / `closeJudgedRun`, then `cleanup`. These runs
       execute in the repo checkout, so the file-based tally works; scripts/flake-screen.mjs and
       scripts/preflight-author.mjs are the precedents. src/ code loads the .mjs lazily through `createRequire`, as
       src/lib/review.ts `loadProofJudge` does, never at import (sandboxes copy only src/).
    2. An exit-0 run whose verdict is not `complete` fails, and its detail carries `describeJudgedRun`'s
       `test-judge: … UNREPORTED FILE` line, so the operator sees which file stopped:
       - the preflight ci-check and containment-probe steps get `ok: false`;
       - `runCensusSuitesViaChild` returns the unreported files as failing suites (they are named suites, so the
         caller's existing refusal names them), never `[]`;
       - `checkFixCensusSnapshot` refuses the push with the judge's line as the reason.
    3. A nonzero exit keeps today's reading at each site; only the exit-0 path gains the judgment. A missing tally
       line on an exit-0 run is a failure, never a pass.
    Do not edit scripts/pure-test-pool.mjs. If a helper is missing, say so in the PR and add the smallest one there
    with its own test.
  acceptance:
    - claim: "a preflight ci-check census step whose node --test child exits 0 before its file's summary fails and names the unreported file"
      proof: 'grep: test("W1-T8379: a preflight census check whose suite exits 0 before its summary fails the step" in test/a-preflight-or-push-gate-test-run-passes-only-when-every-file-reports.test.ts'
    - claim: "the containment-probe leaf fails when its suite exits 0 before its summary"
      proof: 'grep: test("W1-T8379: the containment probe fails when its suite exits 0 before its summary" in test/a-preflight-or-push-gate-test-run-passes-only-when-every-file-reports.test.ts'
    - claim: "census-precheck's suite child reports a suite that exits 0 before its own summary as failing"
      proof: 'grep: test("W1-T8379: census-precheck reports a census suite that exits 0 before its own summary as failing" in test/a-preflight-or-push-gate-test-run-passes-only-when-every-file-reports.test.ts'
    - claim: "a fix round's reach-ratchet census check refuses a run that stopped before its summary"
      proof: 'grep: test("W1-T8379: a fix round reach-ratchet check refuses a run that stopped before its summary" in test/a-preflight-or-push-gate-test-run-passes-only-when-every-file-reports.test.ts'
  falsifier: |
    Each test drives the real runner with a test file that registers one passing test and then calls
    `process.exit(0)` before a second test runs, so node exits 0 with that file's summary missing. Remove the judgment
    from any one site and that site's test reads a pass: `ok: true` for the two preflight steps, `[]` from
    `runCensusSuitesViaChild`, and no refusal from `checkFixCensusSnapshot`. A control file that finishes must still
    pass at every site.
