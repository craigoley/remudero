    - The operator ruled "Raise 5 → 15" for sweep.reviewCapacity.cpuPsiLowPct, the recovery watermark (#16617). At the time, width shed at cpuPsiHighPct 20 and recovered only at or below 5, holding at 1 for 182 of 357 min.
