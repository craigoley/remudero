    - ~/.cache/remudero-store-fill-*: 6 test-cache dirs from 10-14 (~225 MB). ~/.cache is outside every janitor root.
      Their creator is not in core's src/test/scripts at 4c83ace0f (the core test uses mkdtemp under tmpdir()).
    - ~/.npm/_cacache: ~316 MB, never age-pruned. remudero-janitor.sh line 1000 prunes only worker-home/.npm/_cacache.
    - On the operator account the janitor skipped all 407 checkouts while its error log repeated "unable to normalize
      alternate object path". #13134 now HOLDS such a checkout for a person even when the object store it meant to
      borrow from still exists, so the hold never clears by itself.
    - The low-space line is a fixed floor (MIN_FREE_GIB=20, remudero-janitor.sh line 65; the WARN at line 1389). It
      names nothing. This account holds ~19 GB of the 193 GB used. The rest is the other account and system areas this
      account cannot read (Xcode CoreSimulator volumes, Chrome code_sign_clone, Claude Desktop VM bundles), plus swap
      (/System/Volumes/VM, 7 x 1 GiB swapfiles; `sysctl vm.swapusage` used 5.4 GB at 11:40Z).
    - preserve-retire is disabled on craigoleyagent: no config file exists, so #13134 reclaims nothing here yet.
    NOT CARRIED HERE, named so they are not lost (each is its own item if wanted):
