    - claim: "on a projected time-to-full the janitor logs one low-space-report block naming the visible top consumers, swap, the unreadable remainder and preserve-retire's state, in place of the fixed 20 GiB floor"
      proof: 'grep: test("W1-T10256: a projected low-space report names consumers and the unreadable remainder" in test/the-mac-janitor-reclaims-what-it-skipped.test.ts'
  falsifier: |
