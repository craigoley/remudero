  rationale: |
    RESCOPED 2026-10-20 against origin/main ffd28dbed, after #13134 (29bfb4333, merged 15:52Z).
    WHAT #13134 ALREADY BUILT, so this task does NOT:
    - deploy/mac/preserve-retire.py runs as the janitor's last phase (remudero-janitor.sh ~line 1299).
    - It is opt-in per account through an owner-private ~/.local/state/remudero/preserve-retire.json.
    - It saves unpublished commits (verified bundle), the uncommitted patch, untracked and ignored files, refs and a
      restore MANIFEST to ~/Remudero-preserved, then retires the idle checkout.
    - It scans ~/Remudero, ~/rmd-work, ~/.codex/work-artifacts and ~/Developer/remudero-operator-worktrees.
    - It holds unreadable history for a person, including "alternate object store missing" (preserve-retire.py
      resolve_git).
    - It rotates the janitor's human log at 16 MiB, keeping one generation.
    This shard's earlier rules 4 (bundle an unpublished worktree), 10 (preserve dirty work), 11 (Codex
    work-artifacts) and the janitor.log half of rule 6 are therefore dropped. JANITOR.md "Preserve-then-retire
    (opt-in per account)" is the contract for them.
    THE RESIDUAL, observed on the Mac as craigoleyagent on 2026-10-20 (read-only):
    - The hourly passes reclaimed 0 MB. janitor.log 11:30Z: "removed=0 ... free=2->2GiB" and
