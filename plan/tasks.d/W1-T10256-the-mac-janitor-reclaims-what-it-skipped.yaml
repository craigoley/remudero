  design: |
    THE WINDOW. Every new rung uses the existing six-hour mtime-and-ctime guard plus the process/CWD/open-file probes.
    It derives nothing new: the operator ruled six hours untouched on 2026-10-12 (W1-T8863). No rung adds a GB floor,
    count cap or other fixed bound.
    1. LOOSE SESSION-SCRATCH FILES (tmp-reclaim.sh).
       - Regular files under ~/Remudero/.session-scratch, at any depth, are judged by their own age.
       - A file is reclaimed once it and its enclosing direct-child tree pass the mixed-age leaf rule /private/tmp
         already uses: the enclosing tree's activity is checked, and rechecked at each deletion boundary.
       - The existing session_scratch_risk exclusions still apply: credential-like names, special files, scheduled log
         paths, symlinks, files inside a Git checkout, and patch/diff/rej/orig evidence.
       - Empty directories left behind are removed under the same guard.
       - The summary line reports files and directories separately: `session scratch files deleted: N, M MB`.
    2. ~/.cache/remudero-* CACHES (remudero-janitor.sh).
       - A direct child of ~/.cache is a candidate when it is a real directory named `remudero-*`, owned by this
         account, holds no .git, *.bundle or lock file, and has had every entry idle for six hours.
       - NEVER: ~/.cache/remudero itself (the gh read-floor stamp and the host-memory peak store), the janitor's own
         LOCK_DIR ~/.cache/remudero-janitor.lock (line 51), or any `*.lock` name.
       - Name the creator of remudero-store-fill-* in the receipt's rationale. If it is a test that leaks, file that leak
         as its own task; do not fix it here.
    3. NPM CACHE (remudero-janitor.sh).
       - Prune $HOME/.npm/_cacache content files idle six hours (mtime and ctime) when no npm/npx process runs as this
         account, then run `npm cache verify` so the index drops entries whose content is gone.
       - When npm is not on cron's PATH, fall back to the existing whole-tree clean_artifact rule that worker-home's
         _cacache already uses.
       - _npx is pruned the same way.
    4. REPAIR A BROKEN ALTERNATES ENTRY (remudero-janitor.sh), before the checkout probes and before preserve-retire runs.
       - A checkout whose objects/info/alternates entry is relative or dangling fails every git probe, and #13134 holds
         it as history-unrecoverable.
       - When the object store that entry meant exists (the relative path resolved against the checkout's original
         objects dir, or a known lender in the same home whose objects dir holds the missing commits), rewrite the
         entry to that store's absolute path, then re-probe with `git rev-parse HEAD` and `git fsck --connectivity-only`
         bounded to HEAD.
       - A repaired checkout is an ordinary candidate again: the janitor's own rules, then preserve-retire when enabled.
       - When no such store exists, change nothing: #13134's hold stands.
       - Keep the original alternates file beside it as `alternates.pre-repair` and log each repair by name. A re-probe
         failure restores the original.
    5. LOW-SPACE REPORT (remudero-janitor.sh). Replace the fixed 20 GiB `WARN low-space` floor with a projection:
       - Record each pass's free bytes in a small samples file.
       - When the projected time-to-full from those samples is inside a few of the janitor's own passes, log one
         `low-space-report:` block. Use the same tiering W1-T4804 ruled: passes, not a GB floor.
       - Report the top consumers this account can see: bounded `du -xsk` of $HOME's direct children and the known
         roots, at most once per pass, with the existing inspection budget.
       - Report swap from `sysctl vm.swapusage`.
       - Report `unaccounted = used - seen - swap`, attributed to "other accounts and system areas this account cannot
         read". The report names the action: the operator acts there.
       - Report whether preserve-retire is enabled for this account and, when it is not, what its last dry-run would
         have retired (count and bytes), so the operator can see the cost of the option below.
       - The EMERGENCY line and preflight-author's 20 GiB reserve are not changed here.
    6. RECEIPTS. Each new rung writes rows to janitor-decisions.tsv with the existing reason-code columns: removed,
       repaired, repair-reverted, low-space-report.
    OPTION FOR THE OPERATOR, NOT BUILT HERE: preserve-retire on by default for agent accounts.
    - Today #13134 is opt-in per account, and craigoleyagent has no config, so its idle checkouts are held forever.
    - Option A (default on for agent accounts): install-janitor.sh writes an owner-private preserve-retire.json with
      `enabled: true` for an account the operator names as an agent account (for example craigoleyagent). Cost: work
      that is never restored is gone after retain_days; every copy sits in ~/Remudero-preserved until then.
    - Option B (stay opt-in, made visible): rule 5's report shows the dry-run reclaim, and the operator enables it per
      account by hand.
    - Option C (default on, longer retain): as A, with a longer retain_days for agent accounts.
    - The builder implements only rule 5's visibility (B). It never writes preserve-retire.json and never changes
      #13134's default. Flipping the default is the operator's ruling.
  acceptance:
    - claim: "the janitor reclaims idle loose session-scratch files, ~/.cache/remudero-* caches and old npm cache content, while recent, open, credential-named, ~/.cache/remudero and the janitor's own lock are kept"
