  rationale: |
    OBSERVED 2026-11-05, ledger containment.probe rows (live plus the newest 40 archives): the blocked request to example.com came back at example.com's real addresses (104.20.23.154, 172.66.147.243) and the allowlisted control at api.github.com's real addresses (140.82.114.x). Days with such REMOTE blocked-host answers: 10-28 30, 10-29 56, 10-30 21, 11-04 20, 11-05 100. Only 3 probes on 11-05 answered at the local proxy (::1), which is what a contained worker shows. 23 probes on 11-05 alone passed overall (contained=true) with a REMOTE blocked-host answer, so their builds ran with open egress.
    This contradicts the operator decision recorded in DECISIONS.md for W1-T3103 (2026-09-22): "CHOSEN: (b), THE ALLOWLIST PROXY. Both phases keep a network; egress is confined to an allowlist."
    Why the probe never proved it: EGRESS_DENIAL_RE in src/lib/containment.ts (curl refusal vocabulary, near :697) matches the bare word "blocked" anywhere in the transcript. Every probe transcript carries it, from command 4's own `EGRESS_RESULT blocked=reached|not-reached` echo and from command 3's deny-floor refusal ("Command blocked by PreToolUse hook"). So egressDenialSeen is effectively always true, and assessEgressContainment returns UNPROVEN at its denial branch (near :556) before its remote-address comparison (near :564) can report the breach. An UNPROVEN egress verdict does not gate containment, so the builds ran.
    Why Codex egress is open: Claude workers' sandbox runs the allowlist proxy that settings/worker.json's sandbox.network.allowedDomains declares (the ::1 answers). Codex workers get the network with no proxy. The legacy path passes `sandbox_workspace_write.network_access=true`, and the private-registry profile (withPrivateRegistryCodexProfile, src/lib/worker-provider.ts) sets `permissions.<name>.network.enabled=true` and enables network_proxy only for disposable reviews (codexExecArgs, near :3087). deploy/codex-requirements.toml carries filesystem deny_read only, no network policy.
    Scope amendment 2026-11-06 (operator ruling in chat: "Both get the wide list"): Claude workers and the Codex proxy share the one widened
    allowedDomains in settings/worker.json. test/a-claude-worker-cannot-run-an-unsandboxed-command.test.ts pins every other sandbox key of
    the committed policy; its network.allowedDomains expectation moves to the EXACT new list, and every other pinned key stays unchanged.
  design: |
    1. Evidence, not prose: the egress command writes the blocked request's own curl exit code and error text to a probe file beside its remote-address file, and the executor reads those. Egress denial is derived from that file alone; the transcript-wide regex no longer feeds the egress verdict. A blocked host answering at a non-local address that differs from the allowlisted control's is PROVEN OPEN, whatever else the transcript says.
    2. Enforcement: Codex workers route egress through an allowlist proxy fed by the same allowedDomains the Claude sandbox uses (one source, secret-boundary.ts and settings.ts already read it), on both the legacy and private-profile paths. The builder measures which mechanism Codex 0.163 supports for a permission profile (its managed network_proxy with an allowlist, or an HTTPS proxy the sandbox cannot bypass) and records the measurement. No fixed constants.
    3. Gate: a PROVEN-OPEN verdict writes a containment.egress_proven_open row immediately (shadow). Making it block dispatch is a tightening that would stop every Codex build until (2) lands, so it ships behind the operator's explicit yes, recorded in DECISIONS.md, and never by default in this task's merge.
    4. Never loosen: UNPROVEN stays UNPROVEN and never becomes contained. Nothing here relaxes the filesystem, token-read or operator-home arms.
    Tests: (a) a probe transcript containing the echo and the tripwire refusal, with remote addresses REMOTE and different, is PROVEN OPEN (at base it is UNPROVEN). (b) a real local-proxy answer (::1 for both) stays as today. (c) a spawned Codex writer's argv and profile carry the proxy and allowlist on both paths (at base neither does).
  falsifier: |
    At origin/main, a probe whose blocked request reached example.com at 104.20.23.154 while the control reached 140.82.114.4 is reported egress UNPROVEN, and the run's containment verdict is contained=true (11-05, 23 such probes).
