    RATIFIES proposal skill-draft:a4ce515f0f097a31 — the first candidate skill-workshop.ts (W1-T2766)
    has ever staged, mined from 78 MERGED implement runs sharing the deterministic shape
    `fixDispatchCount === 0` (PROCEDURAL_SUCCESS_SIGNALS's "clean_single_strike" row, retro.ts).

    THE PROPOSAL'S OWN "NOT REACHABLE BY A WORKER TODAY" LINE IS TRUE AND ALSO NOT THE WHOLE PICTURE.
    It is emitted by `describeWorkerSkillReachability(WORKER_SETTING_SOURCES)`, which reports whether
    the RUNTIME's native project-scoped skill loader can see a repo-owned SKILL.md — it cannot, because
    `spawnWorker` passes `settingSources: []` (worker.ts), and that gap is separately tracked, still
    open, at W1-T3137. That is a DIFFERENT route from the one this ratification actually uses.

    W1-T3101 ("THE SKILL WORKSHOP HAS NO ROUTE TO A WORKER") already shipped and MERGED a second,
    HARNESS-SIDE route that does not depend on settingSources at all: `renderImplementPrompt`'s CONTEXT
    block calls `selectSkillsForTask(loadInjectableSkills(join(repoRoot, ".claude", "skills")), task.type,
    DEFAULT_KNOWLEDGE_BUDGET_CHARS)` (run-task.ts:12091-12096) — a plain filesystem read of the APPROVED
    `.claude/skills/` tree, filtered by each file's `applies-to:` frontmatter, spending the SAME knowledge
    budget matched learnings already spend, and ledgered as `skills.injected`. Its own comment at
    run-task.ts:12089-12090 states: "Empty for every task until an operator approves a skill that declares
    `applies-to:`, so today this changes no prompt by a single byte." This draft's frontmatter carries
    `applies-to: implement`. Ratifying it is precisely the event that comment is waiting for — today
    `.claude/skills/` holds only `tddr` and `grfp` (generated, `disable-model-invocation: true`, no
    `applies-to:`, therefore excluded by `loadInjectableSkills`'s own `if (!m) continue;`), so this would
    be the FIRST skill the pipeline ever actually selects and injects.

    HONEST ASSESSMENT OF THE CONTENT. `PROCEDURAL_STEP_TEXT`'s canonical text for this signal —
    "Resolve the task on the first attempt — land a fix that needs no `fix.dispatch` rung." — restates a
    desired OUTCOME rather than a concrete technique, unlike its sibling `fully_executed_proof`
    ("Execute every acceptance criterion as a real, observed proof — never let the keyword floor stand in
    for a run."). That thinness is a property of the CURRENT two-row `PROCEDURAL_STEP_TEXT` table
    (skill-workshop.ts), not a defect introduced by ratifying THIS draft, and improving that table's
    phrasing is explicitly OUT OF SCOPE here (Rule 15: ratify exactly what was staged and scanned, never a
    rewrite of it). The draft already passed `scanSkillDraft` at staging time against the worker
    allowlist (no disallowed host/path/tool, no instruction-injection shape); this task re-verifies that
    against the CURRENT `settings/worker.json` rather than trusting a scan taken at staging time.

    WHY RATIFY DESPITE THIN CONTENT: it is small (one file, ~4KB well under the 8148-char knowledge
    budget), reversible (a future retro/operator can retire or replace the skill), evidence-grounded (not
    fabricated — 78 real merged runs), and it is the first live exercise of a built-and-tested pipeline
    (stage -> approve -> file -> select -> inject) that has otherwise never fired end to end. Landing it
    gives future retro cycles a genuine signal to watch: does the `clean_single_strike` mined-shape
    frequency move once workers are actually shown this text.
