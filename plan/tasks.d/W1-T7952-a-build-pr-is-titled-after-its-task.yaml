- id: W1-T7952
  title: "A BUILD PR IS TITLED AFTER ITS TASK, NEVER AFTER A CHECKPOINT — when every subject on a run branch is a `wip:` checkpoint, `prTitleFromBranchCommits` strips the marker and titles the PR after the checkpoint, so W1-T7807's 700-line watchdog merged as \"chore: tests and census repairs\" (#10785) and W1-T6085 as \"chore: yield at worker\" (#10834)"
  repo: remudero
  depends_on: []
  dispatch_hold: true  # operator 2026-10-12: held for a session build — restart churn keeps interrupting it; release after the session PR merges or if the session hands it back
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — a filed build PR's title is derived from its task's shard title
  band_meaning: span
  origin: "operator approval 2026-10-11: file the recommended follow-ups (a fix round never degrades a PR's title)"
  plan_refs: [W1-T7807, W1-T6085, W1-T7697, W1-T7096, W1-T1012]
  files: [src/lib/unfinished-checkpoint.ts, src/run-task.ts, test/a-build-pr-is-titled-after-its-task.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    READ on origin/main cb58d3155 (2026-10-11).
    WHAT MERGED. The squash subjects on main are the PR titles, and both name a checkpoint, not the change:
      - 38b6744b5 "chore: tests and census repairs (#10785)", Remudero-Task W1-T7807. It adds
        src/lib/quiet-worker-watchdog.ts. Both branch commits are checkpoints: "chore(wip): quiet worker
        watchdog module and wiring" and "chore(wip): tests and census repairs".
      - cb58d3155 "chore: yield at worker (#10834)", Remudero-Task W1-T6085. It adds
        test/pure-test-files-share-one-process.test.ts. Its first commit is the restart checkpoint
        "wip: yield at worker" (decided: retain work for restart). The fix round's later commit,
        "fix(test): blank coverage env and carry pure-test-pool in tier fixtures (W1-T6085)", left the title alone.
    WHERE THE TITLE COMES FROM. It is set once, when the PR opens:
      - runTask opens the PR with `branchPrTitle(worktreePath)` (src/run-task.ts:20435).
      - `branchPrTitle` (src/run-task.ts:4965) passes the branch's `origin/main..HEAD` subjects to
        `prTitleFromBranchCommits` (src/lib/unfinished-checkpoint.ts:129).
      - That returns the newest subject that is not a checkpoint. When every subject is one, it returns
        `stripWipMarker(real[0])` (:132). `stripWipMarker` (:91) maps "chore(wip): x" and "wip: x" to "chore: x".
        Both titles above are exactly that output.
      - c88e70e53 (#10500) added this to stop titling a PR "wip: ...". It removed the marker but kept the
        checkpoint's words.
    Checkpoint-only branches are a normal outcome. Two writers commit them by design: the worker-boundary yield
    (src/run-task.ts:19625, W1-T7697) and the quiet-worker yield (src/run-task.ts:3376). A worker can also stop on a
    `chore(wip):` tip that the resume loop (src/run-task.ts:19942-19947, W1-T7096) does not finish. In all three
    cases the task is known: runTask holds it.
    NO LATER WRITER REWRITES A BUILD PR'S TITLE. This deviates from the filing brief, which said a fix round
    degraded the titles. A search of src/ for title writes finds only these:
      - the plan-PR retitle and metadata rounds (src/lib/sweep.ts:3069, :4474);
      - head re-home, which copies the old title (src/lib/head-rehome.ts:156);
      - the feedback lane (src/lib/feedback.ts:658).
    The fix lane never edits a title. So the defect is the open-time title, and that is where this task fixes it.
    AMENDED 2026-10-11 (operator approval): priority 2 -> 1. W1-T7957 (priority 1) depends on this task. This task's last
    build branch, run-W1-T7952-1791724959460, stopped at "wip: yield at checkpoint" (13:29:55Z). A THIRD INSTANCE,
    read on origin/main 233304449: "chore: merge main into the restored checkpoint (#10936)", Remudero-Task
    W1-T8047. Its newest commit is the harness's own restore merge. `restoreBoundaryCheckpoint` (src/run-task.ts:5076)
    writes it with `commit-tree -m "wip: merge main into the restored checkpoint"` when a fresh run resumes a
    boundary checkpoint on current main (#10862). Every other subject on that branch is "wip: yield at worker" or
    "wip: yield at checkpoint", so `prTitleFromBranchCommits` (src/lib/unfinished-checkpoint.ts:129) found no
    non-checkpoint subject and returned `stripWipMarker` of the newest one, the merge. So a harness MERGE commit
    named the PR. The design below covers it because the merge subject carries the `wip:` marker. A test pins it,
    so an unmarked harness merge subject can never become the title or supply its type.
  design: |
    1. A TASK TITLE FOR A FILED BUILD. Add `prTitleForTask(subjects, task)` to src/lib/unfinished-checkpoint.ts:
       - The subject is the shard title's lead clause: the text before the first " — ", or the whole title
         when there is none, lower-cased so it passes subject-case, then " (<task id>)".
       - The type and scope come from the newest subject that is not a checkpoint, when one exists. Otherwise
         the type is `feat` with no scope. A stripped checkpoint's `chore` is never used.
       - The result goes through `fitConventionalTitle` (src/lib/commit-message.ts:75), so it never exceeds
         header-max-length 100.
       It never returns a checkpoint's words. A merge commit's subject (the restore merge from
       `restoreBoundaryCheckpoint`, or any other merge subject) never supplies the words or the type. It is
       skipped the same way a checkpoint is.
    2. WIRE IT AT THE ONE OPEN SITE. `branchPrTitle` takes the task. At src/run-task.ts:20435, a filed run
       branch titles its PR with `prTitleForTask`. `prTitleFromBranchCommits` keeps its current behaviour for
       callers with no task (the retro open at :33948 and the plan-filing sites), so nothing outside filed builds
       changes.
    3. LATER ROUNDS KEEP IT. A fix round's commits never feed the title. This adds no new title writer. A test pins
       that a branch whose newest commit is a fix round's subject is still titled after its task.
    Tests go in the new file test/a-build-pr-is-titled-after-its-task.test.ts, with `test(` titles exactly as in the
    proofs below. The existing unfinished-checkpoint and #10500 suites must stay green.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/a-build-pr-is-titled-after-its-task.test.ts"
    - claim: "a branch whose every subject is a checkpoint is titled after its task's shard title, never after the checkpoint"
      proof: 'grep: test("W1-T7952: a checkpoint-only branch is titled after its task" in test/a-build-pr-is-titled-after-its-task.test.ts'
    - claim: "the two merged titles are reproduced as inputs and the derived title names the task, not yield at worker or tests and census repairs"
      proof: 'grep: test("W1-T7952: the #10785 and #10834 branches get their tasks titles" in test/a-build-pr-is-titled-after-its-task.test.ts'
    - claim: "a branch whose newest subject is a fix round's keeps the task title"
      proof: 'grep: test("W1-T7952: a fix round commit does not replace the task title" in test/a-build-pr-is-titled-after-its-task.test.ts'
    - claim: "a branch whose newest commit is the harness's restore merge (#10936) is titled after its task, never 'merge main into the restored checkpoint'"
      proof: 'grep: test("W1-T7952: a restored checkpoint merge subject never titles the PR" in test/a-build-pr-is-titled-after-its-task.test.ts'
    - claim: "a derived title passes checkCommitMessage, including header-max-length 100 for a long shard title"
      proof: 'grep: test("W1-T7952: a task-derived title passes the conventional header checks" in test/a-build-pr-is-titled-after-its-task.test.ts'
  falsifier: |
    Leave runTask calling `branchPrTitle(worktreePath)` with no task. The subjects "wip: yield at worker" then title
    the PR "chore: yield at worker", as #10834 merged, and the first two tests fail. The subjects of #10936's branch then
    title it "chore: merge main into the restored checkpoint", and the restore-merge test fails. Take the type from a stripped
    checkpoint, and a checkpoint-only branch reads `chore:`, so the first test fails. Skip `fitConventionalTitle`,
    and the long-title case exceeds 100 characters, so the conventional-header test fails.
