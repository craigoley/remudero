  falsifier: |
    Leave `threadStorePath` unset in serve and the first test goes red with the route's "no thread store" refusal.
    Await the responder inside the main loop and the third goes red with a busy-loop fixture. Let the responder run
    approve from a reply that says "yes, file it" and the fifth goes red.
