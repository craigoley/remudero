- id: W1-T2344
  title: "A PER-PROBE SLACK CONSTANT ABSORBS A PER-COMMAND COST, AND THE DERIVED CAP HIDES THE DILUTION — probeTurnBudget's derived half moved 6 to 10 automatically when two commands were added on 2026-08-24, but PROBE_TURN_ALLOWANCE stayed 3, and the containment probe now exhausts its turn budget on 29 percent of dispatches"
