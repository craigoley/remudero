    - claim: "the fail closed verdict for an exhausted probe is still reachable and still refuses"
      proof: "unit test: test/containment.test.ts"
    - claim: "all six probe commands are still present, since none may be removed to afford a turn"
      proof: "unit test: test/containment.test.ts"
    - claim: "nothing added paces or throttles or sleeps a call"
      proof: "unit test: test/containment.test.ts"
  falsifier: |
    If the `num_turns` distribution over `containment.probe` rows shows a median at or below 7 out
    of 10 with the exhaustion rate already at zero across a full day, the headroom problem has gone
    away on its own and this task must be closed rather than implemented — the premise is a probe
    running at its cap, and a probe with slack to spare is a different situation with a different
    remedy.
