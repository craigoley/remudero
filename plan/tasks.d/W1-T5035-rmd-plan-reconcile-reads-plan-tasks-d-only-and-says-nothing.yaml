  rationale: |
    MEASURED 2026-10-01 at origin/main 2d82ea51d. THE SMALLER OF TWO OPTIONS, CHOSEN ON THE SOURCE.

    (1) WHAT THE VERB DOES TODAY (src/run-task.ts). `planReconcileCommand` (24766) reads shards with `readPlanShards(shardDir)`
    (24735; `plan/tasks.d/*.yaml`, one `- id:` per file) and writes each rewritten text back to the SAME path. It never opens
    plan/tasks.yaml. CORRECTION OF THE BRIEF: the verb does NOT print "208 queued entries in tasks.yaml it can never touch";
    `renderPlanReconcile` (24893) prints only the shard count and the `skipped:` breakdown of the SHARDS, and no source line
    mentions tasks.yaml. The number came from the measuring agent's own count (it reproduces: 194 queued at this head, 208 before
    #8193's 14 flips). The honest state is worse than the brief put it: the verb is SILENT about those records.

    (2) THE POPULATION, my own script over plan/tasks.yaml at this head: 269 `- id:` records, no id duplicated and none also a
    shard. Folding the verb's own pure `reconcilePlan` over them with every task treated as credited: 193 rewrites, skipped
    `status-not-queued` 16, `retired` 46, `no-status-field` 14 (so 193 queued and not retired, the ceiling of what a read could
    ever name). Every one of the 193 rewrites changes exactly ONE line of its record and the record's line count, which is the
    property the shard path already relies on.

    (3) THE CREDIT IS ALREADY COMPUTED FOR THEM. `defaultCreditedMergedIds` (24839) builds the plan with
    `loadPlan(join(checkoutRoot, "plan", "tasks.yaml"))`, which merges tasks.yaml and tasks.d (src/lib/plan.ts, W1-T122), so the
    credited-id Set already contains tasks.yaml tasks. Only `readPlanShards` and the write stop short. So the GAP is the reader
    and writer, not the projection.

    (4) WHY REPORT-ONLY AND NOT A WRITE, the smaller correct option. (a) plan/tasks.yaml's own header says "STATUS IS DERIVED FROM
    GITHUB — this file is never machine-rewritten ... A YAML round-trip would destroy these comments and a machine writer would
    race the human editor"; a 13,285-line hand-maintained file with 269 records is exactly that file. (b) Every record there has
    the identical line `  status: queued`, so a write needs a position-keyed splice and a guard that the spliced line belongs to
    the intended record; that is a new write path in the verb whose one-way property is its safety. (c) The read half alone
    closes the defect named ("invisible"): an operator runs the dry run, sees the ids, and flips them with the same one-field edit
    #8193 made. A report cannot flip a shard wrongly. A write can be a later task if the report proves worth automating.

    (5) WHAT THE SCAN WINDOWS DO, AND WHY THIS TASK DOES NOT TOUCH THEM. `MERGE_SUBJECT_SCAN_LIMIT` is 5000 and
    `MERGED_PATHS_SCAN_LIMIT` is 4000 (src/run-task.ts:37360, 37354). origin/main has 6,124 first-parent commits, and the merge
    commits of the 14 sit at first-parent positions 5,556-6,013 (W1-T160 #853 at 5556; T178 #423 at 5813; T112 #491 at 5777;
    T115 #279 at 5917; T96 #187 at 5952; T25 #170 at 5957; T20c #134 at 6004; T65 #122 at 6013; T58 #635 at 5678; T246 #697 at
    5653; T245 #651 at 5670; T12a #725 at 5627; T86 and T144 not located by subject). All are past BOTH windows, so their credit
    rows read `creditIsImplementation: undefined`/`creditHasBuildDiff: undefined` and `creditIsReconcilable` declines them: THE
    REPORT THIS TASK ADDS WILL NOT NAME THEM, it will count them in the queued total. That is the stated limit, not a hidden one.
    RAISE vs REPORT: neither belongs here. The windows are cost backstops (a whole-history `git log --first-parent --name-only`
    measured 1.67 s at -n 4000 and 1.48 s at -n 8000 here, so cost is not what binds), but raising them changes WHICH shards
    flip, in bulk, across the whole old plan; that is a credit-semantics decision with its own preserved controls, and
    "report as outside the window" needs the candidate rows, not the id Set this verb receives. File it separately; it is the
    task that actually lets these 14 flip without a hand edit.
  design: |
    (i) src/run-task.ts: `readInlinePlanRecords(planPath)` splits `plan/tasks.yaml` at each line matching `^- id: ` into
    `{ taskId, text }`, the same record shape `readPlanShards` returns. A file that does not exist returns `undefined` (a
    `--plan` fixture directory with no sibling monolith has nothing to report). A file that exists and cannot be read THROWS.
    (ii) `PlanReconcileDeps` gains `readInlineRecords?: () => Array<{ taskId: string; text: string }> | undefined`, default
    `() => readInlinePlanRecords(join(dirname(shardDir), "tasks.yaml"))`.
    (iii) `planReconcileCommand`, AFTER `credited` is read and the shard decision is made, folds the SAME pure `reconcilePlan`
    over the inline records with `(id) => credited.has(id)`. Its `writes` are DISCARDED, never applied, in dry-run and under
    `--write` alike; only `summary.rewritten` (the creditable ids) and `summary.skipped["not-credited-merged"]` are read. The
    queued total is their sum, so a retired, merged or field-less record is never counted or named.
    (iv) `renderPlanReconcile(summary, write, inline?)` gains an optional third argument and, ONLY when the queued total is
    non-zero, appends one block: `plan/tasks.yaml is read-only to this verb (it is never machine-rewritten): <N> queued record(s)
    outside the reconcile; <K> credited merged: <ids>` followed, when K > 0, by `flip these by hand in a plan-only PR`. With K =
    0 only the count is printed. With no inline records, or none queued, the output is BYTE-IDENTICAL to today's.
    (v) An unreadable tasks.yaml prints `plan/tasks.yaml: unreadable (<reason>), its queued records were not counted` and the verb
    carries on: exit codes are unchanged (0 read fine, 1 thrown projection, 2 unreadable shards), because this is an additional
    report and must never turn a working reconcile into a failure; but it is NEVER rendered as "no records".
    (vi) The `plan.reconcile` ledger row gains `inline_queued` and `inline_creditable` (counts only).
    (vii) NOT IN SCOPE: any write to plan/tasks.yaml; the two scan windows; the unreadable-GitHub-read abort (the W1-T5029 draft);
    `buildCreditCandidates` (W1-T5034).
