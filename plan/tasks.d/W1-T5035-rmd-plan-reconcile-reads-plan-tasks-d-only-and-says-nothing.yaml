  falsifier: |
    Apply the inline `writes` (drop the discard in design (iii)) and the `--write` test reddens on a changed tasks.yaml byte.
    Count a retired record as queued and the retirement test reddens. Replace the per-record fold with one global
    `text.replace(/^  status: queued/m, ...)` over the whole file and the identical-status-lines test reddens (the wrong record
    is rewritten). Treat a thrown read as an empty list and the unreadable test reddens. Print the block unconditionally and the
    byte-identical test reddens. BOTH directions are needed.
