- id: W1-T5035
  title: "`rmd plan-reconcile` READS plan/tasks.d ONLY AND SAYS NOTHING ABOUT plan/tasks.yaml, SO 193 QUEUED RECORDS THERE ARE INVISIBLE TO IT AND PR #8193 HAD TO HAND-FLIP 14 OF THEM — the credit projection already covers those records (`defaultCreditedMergedIds` loads tasks.yaml through `loadPlan`), only the shard reader and writer stop at tasks.d; have the verb apply its OWN pure decision (`reconcilePlan`) to each tasks.yaml record read-only and print the queued count plus the ids it would have flipped, never writing tasks.yaml, whose header says it is never machine-rewritten"
  repo: remudero
