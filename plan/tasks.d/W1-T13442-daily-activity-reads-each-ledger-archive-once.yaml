  rationale: |
    WHY: serve's read-model slow lane burned 0.585 cores (30 s inspector profile of serve's generation on the Azure host,
    2026-11-17 17:3xZ): parseObject, ndjsonLines and openLedgerUnion under daily-progress-collector.ts activity().
    OBSERVED in the host ledger: read_model.daily_cancelled every 128-147 s from 17:15:41Z (7 rows, reason "ownership
    changed or collection deadline elapsed"), and no daily_staged, daily_committed or daily_failed row. The manifest's 3
    jobs have closedThrough 2026-10-26, lastAttemptAt 16:05:45Z and nextDueAt 17:00Z, so each job is due on every 60 s
    pass. With closedThrough three weeks back, a run reads every archive since about 2026-10-27, outruns
    ANALYTICS_REFRESH_TIMEOUT_MS (120 s), is aborted, records nothing and starts again from zero: a livelock.
  design: |
    INVARIANT never-stale: an archive is served from the memo only while its (inode, size, mtime) is unchanged.
    1. readDailyActivity (was activity) lists the root's rotations once, skips those before the window, and reads each
       archive whole through openLedgerUnion (corpusSnapshot of that one archive), keeping only rows that can become
       events: step, ts, task id, repository, raw-line fingerprint and the whole-row identity hash, never the payload.
       The since and now filters run when the candidates are used, so a memo entry does not depend on the window.
    2. The memo (process-local, the slow lane's thread outlives its runs) is keyed by root, repository and archive path;
       an archive read with an unread gap is not kept; entries for archives that left the window are dropped.
    3. The live ledger is read each run as before. Events, gaps and available are unchanged for the same corpus.
    Not in scope: why closedThrough is stuck at 2026-10-26 (required PR sources never cover the cutoffs); report it
    separately.
  falsifier: |
    Ignore the memo: criteria 1 and 2 fail (the corrupted-in-place archives are read and counted as gaps). Key it by
    path alone: criterion 3 fails.
