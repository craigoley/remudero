  design: |
    1. Change ONLY the JSON-mode `buildBatchedGithub` call in `statusCommand` so it also passes the persisted repository
       `BoardSnapshotCache` (`createBoardSnapshotCache(<state root>, owner, repo)`, with the root chosen the same way the
       task-case path chooses it). Keep the existing pacer and exec deadline wiring unchanged. Do not change the non-JSON branch.
    2. FAIL CLOSED. If the snapshot is absent, stale, truncated or unreadable, or if a remote-ref read fails, the result
       stays explicit. The rows that needed that evidence are reported `unavailable` with a reason, exactly as W1-T4208
       requires. They are never empty, zero, or silently filled from an unusable snapshot.
    3. Keep the 30-second status JSON read deadline, the selector rules and the admission rules exactly as they are.
       This task adds no new knobs.
    4. TDD, strictly: in test/status-json-deadline.test.ts, write the failing regressions before the change. (a) A fresh
       persisted snapshot is used by the JSON status read without a full board re-fetch. (b) A missing, stale, truncated
       or unreadable snapshot, and a remote-ref failure, each still yield explicit unavailable evidence within the deadline.
       Put `W1-T11280` in each new test title.
       EXACT TITLE STEMS (the acceptance proofs below match them as LITERAL substrings, so copy them verbatim). Write
       one test per case, and start each title with its stem. Plain words only, with no regex metacharacters:
         - `W1-T11280 fresh snapshot` ... (a). This is the behavioural falsifier. It must FAIL until the gateway passes
           the cache, so assert that no full board re-fetch happens (for example, count the injected exec's board-list
           calls). Asserting only that the output is right would pass on the uncached path.
         - `W1-T11280 missing snapshot` ...
         - `W1-T11280 stale snapshot` ...
         - `W1-T11280 truncated snapshot` ...
         - `W1-T11280 unreadable snapshot` ...
         - `W1-T11280 remote-ref failure` ...
       Each fail-closed case (b) seeds THAT one condition in the persisted cache, or in the injected exec for the
       remote-ref case. It then asserts that the affected rows read `unavailable` with a reason, never empty or zero,
       within the deadline. No title may contain two stems, and no pre-existing W1-T4208 test is renamed to carry one.
    NOT IN SCOPE: any other file, any change to board-snapshot-cache.ts or status.ts, any new task.
