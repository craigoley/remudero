    - claim: "a sentinel written in an open PR body no longer raises the ceiling"
      proof: "unit test: W1-T1039: a sentinel written in an open pr body no longer raises the ceiling"
    - claim: "the bound does not trust the second-highest id when that is itself an outlier"
