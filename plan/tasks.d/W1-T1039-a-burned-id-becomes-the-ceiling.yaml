  note: |
    NO OUT-OF-RANGE ID IS WRITTEN ANYWHERE IN THIS SHARD, DELIBERATELY. Every reference to one is
    descriptive — "the outlier magnitude", "an out-of-range shard", "the highest sane declared id is
    1038" — because writing the literal is the exact mechanism being filed and would burn a fourth
    the moment this shard's PR body is open and scanned. The same rule governs the PR body.

    THE GREP PROOF MATCHES RATIONALE PROSE, NOT ITS OWN DECLARATION. The phrase sits on ONE PHYSICAL
    LINE inside rationale (5), is not on line 2, and reads 0 files across the tree at the merge base
    against a control (`never hand back one`) that reads 1 — so it discriminates head from base.

    src/run-task.ts IS NOT DECLARED, AND THAT IS THE MEASURED CHOICE. It carries 245 of 626 records
    and DECISIONS.md's 2026-08-18 W1-T471 ruling accepts one effective lane as the standing cost of
    naming it, so avoiding it is worth doing where the marker is reachable elsewhere. `maxSeen` is
    computed in `mintNextTaskId` (`src/lib/task-id.ts`, declared by ONE shard), and
    `mintNextTaskIdWithHistory`'s own `Math.max(base.maxSeen, historyMax ?? 0)` inherits an already-
    bounded `base.maxSeen`; the history term needs the same bound applied to `historyMax`, which is a
    one-expression change. IF an implementer finds that term cannot be bounded without editing
    run-task.ts, the widening must be ratified before it is made and the W1-T471 cost accepted in
    writing then.

    NO WRAPPER AND NO SHELL SCRIPT. The verb already does the four-surface sweep and the atomic
    reservation properly; anything wrapping it would reimplement both worse. The change is one
    predicate inside the function that computes the maximum.

    W1-T1011 IS CITED AND NOT ABSORBED. It files the triage lane taking a PERMANENT reservation
    BEFORE the work is known to hold — a spend-ordering defect. This is a burned id becoming the
    CEILING — an allocation-arithmetic defect. They share the allocator and nothing else; fixing
    either leaves the other exactly as it was.

    risk: high IS RAISED ON A MEASURED REFUSAL AND THE REFUSAL IS QUOTED. Authored at `risk: medium`
    — one predicate and its test in two files, no workflow, no policy data, no source module beyond
    the allocator itself — and `rmd lint-plan` refused it in these words: *"[sizing] spans 2 distinct
    subsystems/concerns (task-id, task-id-allocation-bound) at risk:medium — Rule 19: raise to
    risk:high or decompose into one task per concern."* The band is Rule 19's SPAN, not blast radius:
    a predicate and the test that pins it are not two tasks, and shipping either alone is how an
    unenforced rule gets written.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form; each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from test/next-task-id-history.test.ts that matched one.
    Each is plain prose under 100 characters with no comma, no `; ` and no regex metacharacter,
    because a bare title is compiled through `escapeRegExp` and matched literally. The fifth is
    doc-shaped and takes a `grep:` with an explicit path.

    ID PROVENANCE — PRE-MINTED AND READ BACK AGAINST ITS EXPECTED SHA BEFORE FILING.
    `refs/rmd-id/W1-T1039` resolves to `ad3b9a98…`, matching the operator's stated value (control
    `refs/rmd-id/W1-T1037` resolves; the negative control, a deliberately-unallocated ref far above
    the range, reads 0 — its literal id is NOT written here, for the reason this whole shard exists). Surfaces swept over
    GIT AND SOURCE ONLY, with no GitHub API call beyond the ref sweep: the reservation; shard
    FILENAMES via `git ls-tree -r` (this id 0, control W1-T1038 = 1 — THE FILENAME IS THE EXISTENCE
    TEST); ids mentioned under plan/ (ADVISORY, 1 file — and that mention is itself the evidence in
    rationale (3), a merged shard citing this very ref as a negative control while it was still
    free); and, in place of the open-PR API surface, `git ls-remote --heads origin` swept for a
    branch naming it, which reads 0 against a control of 1 for a recently-filed id. THE REFS ARE
    RE-SWEPT IMMEDIATELY BEFORE PUSHING.
