  design: |
    (i) prompt-evolution.ts proposes candidate fix-rung prompts from recorded fix transcripts, their commit_refused
    reasons and reviewer verdicts (reflection, not random mutation), keeping a Pareto set across task shapes.
    (ii) Candidates are scored on a held-out half of recorded failures by re-running the fix rung in sealed side worktrees
    (the paired-trial surface), never a pushed branch.
    (iii) A candidate reaches production only through experiment-promotion's shadow -> canary -> rollback path, and only
    after W1-T4669's multi-seed, shuffled-order check passes.
