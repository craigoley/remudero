  falsifier: |
    At origin/main, an `isPlanFiling: true` plan-file-* view whose only failure is ci-shard (7/8), with a job id and the
    #12415 tail lines ("# tests 558", "# fail 0", "66/66 file(s) reported", "Finished uploading artifact content to
    blob storage!", "Finalizing artifact upload", "##[error]Failed to FinalizeArtifact: Unable to make request:
    ECONNRESET"), is disposed refused-escalate with blocker plan-proof-unrunnable and "needs a plan repair". requeueCheck
    is never called and no sweep.ci_infrastructure_requeue row is written. `classifyCiInfrastructureFailure` returns
    undefined for that tail, and `ciFailureRegionReducer` over the full job log drops the summary lines. At head the
    same view is re-run once and parked as awaiting-ci. A second pass with the same failure on the same head escalates.
