    POSTER and merged as #508 on 2026-07-21 (6 files, +424/-3, head `run-W1-T203-1784658054990`,
    anchored trailer), with `hooks/deny-floor.sh`, `test/deny-floor.test.ts`,
    `test/review-status-provenance.test.ts` and `docs/review-gate.md` all confirmed present on main
