    files: IS A DOC BECAUSE THE DELIVERABLE IS A DISPOSITION, NOT A WIRING. `docs/fleet-authoring-
    identity.md` does not exist today, which is the point — the task creates the record. This
    follows W1-T360's precedent exactly (`type: implement`, `verify: human`,
    `files: [docs/flight-control-disposition.md]`), the repo's established shape for a task whose
    output is a decision the operator rules on. src/run-task.ts is DELIBERATELY NOT DECLARED even
    though `ghPrCreateFillCommand` lives there with 8 word-bounded references: nothing is wired by
    this task, and declaring that file would serialize it against the ~103 of 277 shards already
    naming it (W1-T471) for a change that touches no code. An implementer who concludes the wiring
    belongs here must amend this shard to declare it first rather than overrunning.

    verify: human IS THE LOAD-BEARING CHOICE, NOT A FORMALITY. The output is a recommendation
    between credential shapes with real operational cost, and provisioning any of them is an
    operator act outside the repo. `isDispatchEligible` (src/lib/drain.ts) returns false at
