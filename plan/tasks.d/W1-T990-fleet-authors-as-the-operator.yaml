    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN AS THE DESIGN STATES IT, NOT BLAST RADIUS. The
    file list resolves to a single subsystem id, so `sizingViolation` would pass at medium on the
    paths alone; the band is set high because design (iii) requires pricing against the checkout,
    the token and the merge credit simultaneously — three coupled subsystems whose interaction is
    the whole question — and because a wrong answer here is provisioned outside the repo where a
    linter cannot catch it. Blast radius of the shard itself is one new document.

    PROOF NOTES — AND A CORRECTED FIRST DRAFT. All four criteria use `demonstration:`, matching
    W1-T360's and W1-T370's shape for an operator-ruled deliverable. THE FIRST DRAFT USED
    NAME-FILTERED `unit test:` PROOFS AND THAT WAS WRONG: this task's output is a written
    disposition, so a unit test can never substantiate "the record names each candidate actor". It
    would have parsed, matched zero tests, and capped the review — precisely the theatre CLAUDE.md's
    dialect rule names for `verify: human` tasks ("Do NOT rewrite proofs on verify: human tasks").
    `rmd lint-plan` passed the draft at 0 failing / 0 warnings, so the linter did not catch it; the
    rule did. THERE IS DELIBERATELY NO `grep:` CRITERION either: the only tokens that would
    discriminate head from base are strings this task has not written yet, and a `grep:` naming this
    shard's own path is refused by `proof-scope` as outside the declared files.

