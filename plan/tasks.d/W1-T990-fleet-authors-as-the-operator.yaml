- id: W1-T990
  title: "THE FLEET OPENS EVERY PULL REQUEST AS THE OPERATOR'S OWN ACCOUNT — every autonomous PR is authored by cao825 type User, so no platform rule can tell a fleet change from a human one and both of W1-T204's allowed shapes collapse on one shared identity: establish what it would take for the fleet to author as a distinct actor and what breaks when it does"
  repo: remudero
  risk: high
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 50.00
  rationale: |
    MEASURED AT origin/main d9c3c57, 2026-08-18. Every figure re-taken at that head; none carried
    from an earlier session.

    (1) THE FLEET AUTHORS AS THE OPERATOR. Sampled across weeks of PR history, autonomous branches
    included: #2060 head `run-W1-T941-1786978387157` author `cao825` type User; #2024 head
    `run-W1-T934-1786934225604` author `cao825` type User; #2100, #1300, #700 and #520 the same.
    The PR author is the same GitHub account the operator uses.

    (2) A BOT-AUTHORED PR IS POSSIBLE ON THIS REPO, WHICH IS WHAT MAKES THIS A GAP RATHER THAN A
    PLATFORM LIMIT. #1900, head `claude/arm-session-prs`, reads author `claude[bot]` type Bot. So
    the repo already accepts a PR authored by a non-User actor; the fleet simply does not use one.

    (3) W1-T203 SOLVED THE OTHER HALF, AND IT IS A DIFFERENT ACTOR. That task separated who POSTS
    THE VERDICT: `REVIEWER_IDENTITY_ENV` (`REMUDERO_REVIEWER_LOGIN`) and `REVIEWER_TOKEN_ENV`
    (`REMUDERO_REVIEWER_TOKEN`) in src/lib/review.ts, with `postReviewStatus` overriding `GH_TOKEN`
    for that one call. IT SHIPS DARK AND STILL IS: both variables read unset in BOTH running
    containers (presence checked, values never printed), against a control of `GH_TOKEN` set in
    each. Its own doc says so in terms — "this ships DARK until an operator provisions the identity
    and sets both env vars" — and a second comment records "it is DARK in production". Provisioning
    it would change who signs the verdict. It would not change who opens the pull request.

    (4) SO BOTH OF W1-T204's ALLOWED SHAPES COLLAPSE ON THE SAME IDENTITY. Documentation is
    explicit that individual user accounts cannot be named as ruleset bypass actors — bypass is by
    role, team, GitHub App or Dependabot — and that a pull request author cannot approve their own
    pull request. With one authoring account, a path-scoped required-review rule on the gate files
    blocks the fleet and the operator identically, and an operator-only push path grants the fleet
    the same permission it grants the operator. Neither is a gate; both are walls.

    (5) THE CHOKE POINT ALREADY EXISTS AND IS SINGULAR. `ghPrCreateFillCommand` (src/run-task.ts)
    builds the fleet's `gh pr create` argv and carries a comment naming itself the LIVE-WRITE GUARD
    "at the BUILDER, not at each of its four executors". Word-bounded invocation counts: 8 in
    src/run-task.ts, 1 in src/lib/git-push.ts. One builder, four executors — so whatever identity
    decision is made has exactly one place to be expressed, mirroring how `postReviewStatus` became
    the single site for W1-T203's credential.

    (6) IT MATTERS MORE UNDER THE ARC THAN IT DOES TODAY. On this box the collapse costs a gate
    nobody can express. Under the product arc it is the same collapse with a customer's name on it:
    a fleet that authors as the customer cannot be distinguished from the customer by any platform
    control, in their audit log or anyone else's. That is a property of the design, not of this
    installation, and it does not improve by waiting.

    ── AMENDMENT 2026-08-27: THE TITLE CLAIM IS FALSE AT HEAD, AND THE REAL CONFLATION IS NARROWER ─

    THIS TASK'S TITLE ASSERTS THAT EVERY AUTONOMOUS PULL REQUEST IS AUTHORED BY `cao825`, TYPE USER.
    MEASURED 2026-08-27, THAT IS NO LONGER TRUE. Fleet pull requests are authored by
    `remudero-fleet[bot]`: 143 of `main`'s commits carry it, and 20 of the day's 88 merges. Live
    check on two `run-*` lanes, #3167 and #3166 — PR author `remudero-fleet[bot]`, branch-tip git
    author `remudero-worker <remudero-worker@users.noreply.github.com>`, set by
    `deploy/entrypoint.sh` lines 55-56. THE FLEET ALREADY HAS A DISTINCT ACTOR ON BOTH SURFACES.

    ⚠ THE GENUINE CONFLATION IS OPERATOR AND AGENT, NOT FLEET AND HUMAN. The day's merges split 62
    `cao825`, 20 `remudero-fleet[bot]`, 6 `claude[bot]`, and the 62 is the operator PLUS the agent
    session, both authenticating on the same token, inseparable from any artefact. That is a
    strictly narrower problem than this shard describes, and it is the one that blocked an
    automation census the same day: the question "what did the operator actually do today" could not
    be answered at all.

    ⚠ AND W1-T204's POLICY QUESTION IS ALREADY ANSWERED, TODAY, WITH NO CHANGE. A platform rule
    keyed on actor can tell a fleet change from a human one right now, because `remudero-fleet[bot]`
    is a distinct actor. Both of W1-T204's allowed shapes are expressible; they did not collapse.

    ── NOTHING BREAKS ON A SPLIT, MEASURED RATHER THAN ASSUMED ───────────────────────────────────

    THE FAILURE MODE THIS SHARD IMPLIES — that splitting the identity silently uncredits work — IS
    ABSENT. Every candidate was tested by symbol:
      `ownsBranch` (`src/lib/status.ts`)  a pure regex over the branch NAME, zero identity reads
      `deriveStatus` credit sources       `"trailer" | "head-branch"` — content-keyed, never actor-keyed
      `main` branch protection            `restrictions: null`, `required_reviews: null`,
                                          `enforce_admins: false`, 2 required checks — no actor rule
      the auto-merge arm path             no `user.login` read anywhere along it
    THE ONLY CONSUMER OF AN ACTOR LOGIN ANYWHERE UNDER `src/` is `src/lib/dep-review.ts` at lines 50
    and 258, confirming a pull request is Dependabot's. Nothing else reads who authored anything.

    ⚠ Q1. THE SQUASH REWRITES THE AUTHOR, WHICH KILLS THE CHEAP OPTION ──────────────────────────

    GITHUB REWRITES A SQUASHED COMMIT'S AUTHOR TO THE PULL REQUEST'S AUTHOR. PROVEN ON #3172: its
    branch tip read `Ubuntu <craigoleyagent@Remudero...cloudapp.net>` and the merged commit reads
    `Craig Oley <craigoley@gmail.com>`. That is why `remudero-worker` survives on only THREE of
    `main`'s commits against 2,259 for `craigoley@gmail.com` and 143 for `remudero-fleet[bot]` —
    the worker identity is set correctly on every branch and destroyed at merge.

    SO A DISTINCT GIT AUTHOR EMAIL IS CHEAP AND INSUFFICIENT. It costs one configuration line and no
    credential: `RMD_GIT_AUTHOR_NAME` and `RMD_GIT_AUTHOR_EMAIL` already exist as entrypoint
    overrides, and `src/lib/feedback-landing.ts` (lines 70-71, 374-376) is the working precedent for
    a per-commit `git -c user.name= -c user.email=` override that needs no global config. It would
    make the split legible on branch tips and pull-request commit lists, which survive only until
    the branch is reaped. IT WOULD NOT SURVIVE THE MERGE. Only a distinct TOKEN does, because the
    pull-request author does — which is precisely why `remudero-fleet[bot]` is legible on 143
    commits and `remudero-worker` on three.

    ALSO RECORDED SO A BUILD DOES NOT REDISCOVER IT: `src/` sets a git identity in exactly ONE
    place, `feedback-landing.ts`. Everything else inherits ambient configuration. CONTROL: the same
    search finds 49 identity assignments under `test/`, so the count of one is a real floor and not
    a broken query. W1-T1012's harness seam already reaches the branch-tip commit
    (`src/run-task.ts` at 10686 and 17496) to append the task trailer and COULD set an author there
    — but by the paragraph above, that would not reach `main`.

    ⚠ Q2. W1-T203 IS THE ONE CONSUMER THAT WANTS THIS, AND IT SHIPS DARK FOR WANT OF IT ──────────

    `REMUDERO_REVIEWER_LOGIN` and `REMUDERO_REVIEWER_TOKEN` are set ZERO times in the daemon
    container and named by ZERO files under `deploy/`. CONTROL, the same two probes on a variable
    that IS supplied: `GH_TOKEN` reads 1 in-container and is named by 7 files under `deploy/`. So
    the gate is not merely unconfigured — it has never been configurable on this installation.

    A SPLIT ARMS THAT GATE RATHER THAN BREAKING IT. W1-T203's own doc requires a dedicated identity
    "which workers never hold", and ships dark deliberately so a provenance gate armed before the
    identity exists cannot deadlock every merge. W1-T2211 — a worker can read the console's write
    token, `risk: high`, queued — is the standing reason that gate matters rather than being
    theoretical.

    ── Q3. THE ZERO-COST ANSWER TO WHAT WAS ACTUALLY ASKED ───────────────────────────────────────

    MEASURE `.user.login` ON PULL REQUESTS INSTEAD OF AUTHORSHIP ON `main`. It costs nothing, needs
    no credential and no configuration, and it separates fleet from human immediately — the 20 / 62
    / 6 split above came from exactly that field. IT DOES NOT SEPARATE OPERATOR FROM AGENT, and
    nothing short of a distinct token will, because both hold the same one.

    NOTHING HERE PROPOSES CREATING AN ACCOUNT, ROTATING A CREDENTIAL, OR CHANGING BRANCH PROTECTION.
    This task stays `verify: human` and the ruling stays the operator's; this amendment only makes
    it decidable, by replacing the premise it would have been decided on. `acceptance`, `files`,
    `title`, `status` and `risk` are untouched by this edit.

  design: |
    (i) THIS TASK ESTABLISHES; IT DOES NOT WIRE. The deliverable is a written disposition naming
    the candidate actors, what each costs, and what breaks — not a credential and not a code
    change. The shape follows W1-T360's recon precedent (`type: implement`, a docs deliverable,
    `verify: human`), because the output is a decision record the operator rules on.

    (ii) THE CANDIDATES TO PRICE, EACH AGAINST THE SAME QUESTIONS. At minimum: a GitHub App
    installation token; a dedicated machine account holding its own credential; and whatever third
    option the recon finds — the list must be derived, not inherited from this shard. For each:
    can it open a PR on this repo, does the repo accept it (rationale (2) says a Bot author is
    accepted), what does it cost to provision, and what does it hold that a worker must never read.

    (iii) WHAT BREAKS IS THE HALF THAT MATTERS, AND IT IS NOT HYPOTHETICAL. `cao825` currently owns
    the checkout, the token and the merge. Splitting the author identity must be priced against all
    three: whether a distinct author can still push the run branch the checkout produces; whether
    merge credit still resolves, since `findMergedByTrailer` and the `run-<taskId>-<epochMs>` head
    match are what credit a task at all; whether auto-merge arming still works when the arming
    identity and the authoring identity differ; and whether the worker containment property holds,
    since src/lib/env.ts's ALLOWLIST passes `GH_TOKEN` into a worker's environment today. A new
    credential that workers can read separates nothing.

    (iv) THE RECON MUST STATE WHAT IT CANNOT SEE. A prior pass read HTTP 403 on org teams and HTTP
    401 on the installation endpoint with the available token, and enumerated Apps indirectly
    through check-run owners instead. Any claim about what actors exist must name which surface it
    read and which it could not, rather than reporting a token limit as an absence.

    (v) EXPLICITLY OUT OF SCOPE.
      - THE RULESET CONFIGURATION. Downstream of this and already ruled accept-and-record until a
        distinct actor exists. W1-T204 is the CONSUMER of this task's answer, not its sibling, and
        no ruleset, branch protection or repository setting is proposed, changed or designed here.
      - W1-T203's REVIEWER IDENTITY. Solved, merged as #508 on 2026-07-21, dark by design. This
        task must not re-file it, re-band it, or fold its provisioning into its own scope — see the
        note for how the two relate.
      - THE TWO-PR INSTRUMENT SEQUENCE. `INSTRUMENT_SURFACE` covers the gate paths but the checker
        lives in a product path absent from that list, so Rule 25 converts a one-PR attack into a
        two-PR sequence. Real, adjacent, separately observed, and not this.
      - ANY CREDENTIAL PROVISIONING. That is an operator act. This task produces the disposition he
        rules on, and stops.
  acceptance:
    - claim: "the record names each candidate authoring actor with what it costs to provision and what it must never let a worker read"
      proof: "demonstration: operator confirms the record prices each candidate actor and states its containment"
    - claim: "the record states what breaks in merge credit when the authoring identity differs from the operator"
      proof: "demonstration: operator confirms the record states what breaks in merge credit under a split author"
    - claim: "the record states whether a distinct author can still push the run branch and still arm auto-merge"
      proof: "demonstration: operator confirms the record states whether a split author can still push and arm"
    - claim: "every surface the recon could not read is named as unread rather than reported as empty"
      proof: "demonstration: operator confirms every unreadable surface is named as unread rather than empty"
