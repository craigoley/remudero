  note: |
    reservation hand-off: chore/file-openweight-output-contract-1789389121907 -> chore/file-acceptance-trailer-shadow-recon-1789389121907
    amendment: chore/amend-W1-T3574-author-time-plan-criteria-1789389121907

    The original recon falsifier FIRED at origin/main 026ca4fbb. Its exact event
    fixture uses a body headed `## Acceptance criteria` with two prose-only bullets
    and `Remudero-Task: W1-T3525`; W1-T3525 resolves seven non-empty criteria at
    that head through resolvePlanCriteriaAtHead, yet
    `node --import tsx scripts/acceptance-author-gate.mjs --event-path <fixture>`
    exits 1 with `REFUSED (proof-shape)`. The shared acceptanceAuthorTimeCheck is
    correct: it returns `ok: true` for the resolving trailer. The wrapper then calls
    authorTimeProofShapeRefusal, which unconditionally parses the PR body and turns
    that success into a refusal (scripts/acceptance-author-gate.mjs:365-390).

    This amendment supersedes the recon-only disposition. The reviewer uses the
    task's plan criteria first and parses the body only when that head-resolved set
    is empty (src/run-task.ts:15753-15767), so the wrapper is rejecting a body the
    downstream reviewer does not consult.
  rationale: |
    The wrapper's body proof-shape check remains necessary when there is no trailer,
    when the trailer cannot resolve, or when the task at the PR's own head has empty
    acceptance: the reviewer then falls back to the body. A simple `task id exists`
    bypass would weaken that load-bearing arm because planTrailerResolver only scans
    IDs, not non-empty criteria. The gate must learn the same non-empty, exact-head
    condition as the reviewer rather than infer it from the success-message text.

    W1-T3149 owns a prior structural refusal for plan-only implementation claims and
    W1-T3414 owns later follow-up-commit false credit. They share this script and test
    surface but not this post-predicate body-proof-shape condition. This task must
    rebase on either if it lands first; do not dispatch those overlapping edits in
    parallel.
  design: |
    Add a distinct, fail-closed resolver in scripts/acceptance-author-gate.mjs that
    reads the event payload's `pull_request.head.sha` through the existing
    loadPlanAtRef machinery and answers true only for the trailered task's non-empty
    acceptance at that exact head. Pass that already-derived fact into
    authorTimeProofShapeRefusal; when true, preserve the shared successful result
    without parsing body proof shapes. When false or unreadable, retain the existing
    body-proof parser unchanged. Keep the existing lightweight ID resolver for
    acceptanceAuthorTimeCheck, self-credit checks, structural refusals, bot exemption,
    and every no-network property unchanged.

    Tests must run the real event-shaped fixture above and prove it becomes OK; prove
    the same prose block still refuses with no trailer, an unresolvable trailer, and a
    trailer to a task with empty acceptance. The empty-acceptance control is
    load-bearing: it proves the new resolver does not accidentally equate a declared
    task ID with reviewer-owned criteria. Do not edit src/lib/review.ts, a workflow,
    task acceptance criteria, or an existing PR body in this task.
  acceptance:
    - claim: "a prose body Acceptance criteria block cannot fail proof-shape when its last trailer resolves non-empty criteria from the PR head's plan"
      proof: "unit test: acceptance gate ignores body proof shape when head plan criteria resolve"
    - claim: "body-authored, unresolvable-trailer, and empty-plan-criteria prose blocks remain proof-shape refusals"
      proof: "unit test: acceptance gate still refuses prose body proofs without head plan criteria"
  falsifier: |
    Delete the head-resolved-criteria bypass and the resolving-trailer fixture must return the
    original proof-shape refusal. Mutate the resolver to use only declaredPlanTaskIds and the
    empty-acceptance control must become an unsafe success. Delete the body-parser path when the
    resolver is false and the no-trailer prose control must stop refusing. Each mutation proves a
    different boundary: the real regression, the empty-plan fallback, and ordinary body authors.
