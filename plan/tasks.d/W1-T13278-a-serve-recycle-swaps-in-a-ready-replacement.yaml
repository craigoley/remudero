- id: W1-T13278
  title: "Serve restarts and deploys swap in a warmed replacement before the old one stops, so restarting or recreating serve no longer takes the Console down"
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # changes how the serve container is recycled and how cloudflared reaches it; the old path stays behind a switch
  band_meaning: span
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T13277
  files:
    - deploy/serve-container.sh
    - deploy/recycle-container.sh
    - test/a-serve-recycle-swaps-in-a-ready-replacement.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "With RMD_SERVE_BLUE_GREEN=on, recycling serve starts the replacement container under the alternate name on the same network, waits for its /v1/ready and every SMOKE_PATHS route to answer 200, points the tunnel origin (the service name cloudflared reaches) at it, and only then stops the old container"
      proof: "grep: W1-T13278 criterion 1 in test/a-serve-recycle-swaps-in-a-ready-replacement.test.ts"
    - claim: "A replacement that is not ready within the standby bound (STANDBY_READY_BOUND_MS) is removed and the old container keeps serving, with a serve.recycle_aborted row"
      proof: "grep: W1-T13278 criterion 2 in test/a-serve-recycle-swaps-in-a-ready-replacement.test.ts"
    - claim: "invariant:switch-off-is-today — with the switch unset, recycle-container.sh recycles serve exactly as today"
      kind: guard
      proof: "grep: W1-T13278 criterion 3 in test/a-serve-recycle-swaps-in-a-ready-replacement.test.ts"
  rationale: |
    WHY: Craig asked on 2026-11-16 for no-outage serve restarts and deploys. Inside one container the supervisor already
    swaps generations with a readiness check (serve-supervisor.ts: standby -> /v1/ready and smoke routes -> promote), but a
    container recreate (an image deploy, `docker restart`, a recycle) stops the only listener on 4317: on 2026-11-16 a
    recreate at 23:27:45Z was followed by about 40 minutes with no answers, and the restart at 00:08:52Z by about 15 s
    of refused connections. cloudflared reaches serve by service name (originService http://remudero-serve:4317).
  design: |
    INVARIANT switch-off-is-today: the default recycle is unchanged.
    1. Behind RMD_SERVE_BLUE_GREEN=on, give the serve network alias remudero-serve to whichever of two containers
       (remudero-serve-a, remudero-serve-b) is active; start the other, wait for ready and smoke, move the alias with
       docker network disconnect/connect, then stop the old one after its drain bound.
    2. Abort and keep the old one when the new one is not ready in the standby bound.
    3. Both containers share the state mounts read-write; only the active one runs the read-model lease holder (the lease
       already serializes writers).
  falsifier: |
    Stop the old container before the new one is ready: criterion 1 fails. Promote an unready replacement: criterion 2
    fails. Change the default path: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794874389000 with ~/rmd-work/bin/reserve-id.sh.
