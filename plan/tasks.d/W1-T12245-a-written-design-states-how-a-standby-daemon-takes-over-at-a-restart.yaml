  rationale: |
    OBSERVED 2026-11-04T01:56Z to 2026-11-11T01:56Z in the ledger of the core instance: a freshness restart does its drain and its start one after the other, and serve does not.
    - 18 starts after a freshness exit. The median time from the launcher to `daemon.start` was 143 s, and from the launcher to the first admitted review 583 s. The time from `daemon.start` to the first verdict had a median of 725 s.
    - Before the exit the old process waits a median of 18.0 minutes from the restart decision. In that time it starts no build run.
    - The serve process takes new code with no time down. Its supervisor checks out main in a second directory, starts a standby, waits until it is ready and passes the socket: 160 `serve.handoff_done` rows in 7 days. The newest one took 9.5 s to prepare, 31.7 s to be ready and 1.8 s to drain, with a memory peak of 1.5 GB while both ran.
    - The daemon has no standby. It has one checkout (`deploy/entrypoint.sh` moves it in `sync_tree` after the exit) and one lock (`acquireDrainLock`, src/cli/commands/daemon.ts).
    WHY A DESIGN AND NOT A BUILD: the change touches the entrypoint, the lock, the adoption of run children and the checkout. An error stops the fleet. Four smaller tasks of the same filing (W1-T12235, W1-T12236, W1-T12237, W1-T12239) take most of the same time with less risk, and the design must state what is left after them.
    THIS TASK WRITES NO CODE. Its output is one document. A build needs its own task, filed after the operator has read the design.
  design: |
    Write docs/research/a-standby-daemon-for-a-freshness-restart.md with the six headings of the acceptance criteria.
    Measure, do not estimate:
    - the memory of a daemon process at `daemon.start` and at its first tick (`daemon.memory` rows), against the memory limit of the container;
    - the processor time of a start, on a host whose load average was 20 to 30 on 8 cores on 2026-11-10;
    - the GitHub reads of a start, against the hourly quota in `daemon.quota` rows.
    Read and cite:
    - the serve supervisor (src/lib/serve-supervisor.ts, src/lib/serve-generation.ts, src/lib/serve-slots.ts) for the standby pattern that exists;
    - `acquireDrainLock` and src/lib/drain-lock.ts for the lock;
    - `adoptRunChildren` and W1-T9086 for the adoption;
    - `deploy/entrypoint.sh` for the checkout and the restart loop.
    State what the standby may do before it holds the lock (reads only) and what it must not do (any write to GitHub, to a claim or to a worktree).
    Add the document to docs/research/README.md and to docs/docs-index.json.
    NOT IN SCOPE: any change under src/ or deploy/.
  falsifier: |
    Remove one of the six headings from the document and its criterion must fail.
