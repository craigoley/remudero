    THE PROOF FOR CRITERION 6 WAS REPOINTED 2026-09-04: THE OLD ONE COULD NEVER DISCRIMINATE.
    It grepped THIS SHARD for the criterion's own claim text, and a shard merges BEFORE the build
    that cites it, so the pattern matched the merge base exactly as it matched the head.
    `classifyBaseProofOutcome` re-runs every proof against the base and reads a pass there as
    `stale`, so the criterion degraded to the keyword floor, and a scope DISCLAIMER has no
    vocabulary in the diff to satisfy that floor. PR #3985 was refused `unmet` on this criterion
    alone with all 36 checks green. Criterion 6 now greps the sentence the suite carries at its
    own head, and that file is absent at the base by construction, so the proof discriminates.
    The claim is unchanged: only the evidence it points at moved.
