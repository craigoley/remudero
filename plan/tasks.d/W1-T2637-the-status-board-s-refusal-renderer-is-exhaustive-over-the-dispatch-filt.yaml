  note: |
    FILED 2026-08-31 from the follow-up harvest of W1-T2474 (run W1-T2474-1788101371246, PR #3314).
    THE HARVEST'S PREMISE IS CORRECTED HERE, NOT INHERITED. It reads that a retired task "passed
    through either today would mislabel"; for this consumer that is true only counterfactually,
    because the derivation's scope guard (:1935) means nothing but the run-branch reason reaches
    the renderer at all. The live mislabel is in the plan frontier and is filed as the sibling
    task; this one closes a latent trap with a demonstrated history of springing.
    SIBLING, NOT DUPLICATE, AND DELIBERATELY NOT MERGED WITH IT: the two fixes are satisfiable
    PIECEWISE — each module's mapper can be made exhaustive with no change to the other, and each
    is independently testable — so Rule 19 decomposes rather than granting the atomic-coupling
    exit. They also touch disjoint files, so nothing serializes them.
    depends_on IS EMPTY: nothing here waits on unbuilt work; the union arm this generalises over is
    already merged and readable in src/lib/drain.ts on this head.
    risk:medium: one module, read-path rendering, no gate/dispatch/spend/merge semantics, and the
    guard against the one genuinely dangerous direction — silently widening what the board shows —
    is criterion 3 rather than a note.
