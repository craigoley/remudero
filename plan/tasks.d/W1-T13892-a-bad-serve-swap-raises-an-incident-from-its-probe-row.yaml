- id: W1-T13892
  title: "A serve swap with no swap probe, a failed probe, or a served view answering not ready raises an incident from serve's invariant monitor, and clears on the next clean probe"
  repo: remudero
  depends_on: [W1-T13832]
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern in one module (Rule 19): a new incident rule in incident-invariants.ts reading serve.swap_probe beside the swap rows; the monitor, its windows and the other rules are unchanged
  origin: "human#2026-11-19-serve-swap-evidence"
  plan_refs:
    - W1-T13832
    - W1-T13885
    - W1-T13304
  files:
    - src/lib/incident-invariants.ts
    - test/sre/a-bad-serve-swap-raises-an-incident-from-its-probe-row.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A serve swap (serve.handoff_done, serve.supervisor_ready, or serve.generation_crashed and serve.handoff_rolled_back) with no serve.swap_probe row for its sha within 60 s fires the serve-swap-probe rule, and its message names the swap step, sha and time"
      proof: "grep: W1-T13892 criterion 1 in test/sre/a-bad-serve-swap-raises-an-incident-from-its-probe-row.test.ts"
    - claim: "The newest serve.swap_probe row with probe_failed, or with any view answering 5xx or a code other than ok and no_key, fires the rule and names each failing view with its status and code"
      proof: "grep: W1-T13892 criterion 2 in test/sre/a-bad-serve-swap-raises-an-incident-from-its-probe-row.test.ts"
    - claim: "invariant:clean-probe-clears — once the newest serve.swap_probe row is clean (every probed view 200 ok or no_key, no probe_failed), the rule no longer fires; stale answers alone never fire it"
      kind: guard
      proof: "grep: W1-T13892 criterion 3 in test/sre/a-bad-serve-swap-raises-an-incident-from-its-probe-row.test.ts"
  rationale: |
    WHY: W1-T13832 (#19724, 29866f658) writes one serve.swap_probe row per serve swap, but nothing reads it. OBSERVED on
    origin/main 1584806f3: `git grep -n swap_probe -- src scripts` finds only its writer (src/lib/serve-swap-probe.ts),
    the IPC name (src/lib/serve-generation.ts GENERATION_MESSAGES.swapProbe) and the unsent log
    (src/lib/serve-supervisor.ts askSwapProbe). So a swap whose views answer view_not_ready, a probe that fails, or a swap
    that never probes at all (an old generation, a lost IPC message) waits for a human to read the ledger.
    OBSERVED, first live row: serve.swap_probe at 2026-11-19T22:52:13.509Z, cold_start, sha f43e0fb14, every served view
    200 (four stale), so a rule that fires on non-ok codes and not on staleness would have stayed quiet, as it should.
    READ at origin/main: src/lib/incident-invariants.ts RULES is the monitor serve already runs each minute
    (startIncidentInvariantsMonitor in serve.ts). Each rule declares `inputs` (the census
    test/every-incident-rule-reads-a-step-something-writes.test.ts checks each has a writer) and a `bad(window)` verdict;
    evaluateIncidentInvariants fires a rule only when its long window and its 1/12th short window are both bad, and
    invariantFindingLedgerLine writes the incident.event row. SERVE_CPU_BUDGET_RULE_ID (W1-T13304) is the model: it judges
    the newest row of its step.
  design: |
    INVARIANT clean-probe-clears: the rule judges only the newest swap and the newest serve.swap_probe row in the window;
    a clean newest probe ends the firing, and `stale: true` is never a reason to fire (a cold start reads stale bodies by
    design until its projectors catch up; W1-T13885 measures that recovery).
    1. incident-invariants.ts: SERVE_SWAP_PROBE_RULE_ID = "serve-swap-probe", SERVE_SWAP_PROBE_STEP = "serve.swap_probe",
       SWAP_PROBE_DUE_MS = 60_000. The rule's longMs is 12 x 15 min, so the short window (15 min) holds the newest swap.
       inputs: serve.swap_probe, serve.handoff_done, serve.supervisor_ready, serve.generation_crashed,
       serve.handoff_rolled_back.
    2. bad(window), first match wins:
       a. missing: the newest swap row (sha from `toSha` on handoff_done, generation_crashed and handoff_rolled_back,
          `sha` on supervisor_ready) is older than SWAP_PROBE_DUE_MS at the window's newest row, and no serve.swap_probe
          row with that sha has a ts at or after it. Message: "no swap probe within 60 s of <step> <sha> at <ts>".
       b. failed: the newest serve.swap_probe row has probe_failed, or a view whose status is 500 or more, or whose code
          is neither ok nor no_key. Message: trigger, sha, probe_failed, and each failing view as name=status code.
       Otherwise not bad. A window with no swap row and no probe row is no evidence and never fires.
    3. With W1-T13885, a follow-up round row is a serve.swap_probe row too, so its own newest row is what is judged.
    NOT IN SCOPE: a Console surface for the incident; the incident lifecycle store already lists invariant incidents.
  falsifier: |
    Drop the missing-probe branch: criterion 1 fails. Fire only on probe_failed, or count no_key as failing: criterion 2
    fails. Judge any probe in the window instead of the newest, or fire on stale: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1795134894000 with ~/rmd-work/bin/reserve-id.sh.
    Filed as the consumer of serve.swap_probe rows, a separate concern from W1-T13885 (follow-up probe rounds).
