- id: W1-T4045
  title: "THE INTER-PHASE REVIEW CLOCK COUNTS TICKS, NOT TIME — every late wake adds a nominal one second, so under a blocked event loop its 60-second review interval stretches to roughly 60 times the block length: take the larger of the tick count and real elapsed time, so a pass is never later than today and prompt under load"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: high
  origin: "oper#review-clock-counts-ticks-2026-09-22"
  plan_refs: [W1-T2852, W1-T4041, W1-T4046]
  files: [src/lib/daemon.ts, test/the-review-clock-counts-time-not-ticks.test.ts, scripts/test-tier-manifest.json]
