  note: |
    `files:` NAMES THE HARNESS PLUS THE THREE SUITES RE-DERIVED ON THIS HOST, not all nine. The
    other six are named in rationale (1) and an implementer will need to add them to `files:` as
    it reaches them — declaring nine test filenames up front would inflate the Rule 19 stem count
    for suites nobody has yet confirmed still drift at implement time, and the sweep is the thing
    that decides which ones do. Re-run `node scripts/clock-sweep.mjs` before touching a file.

    THE PROOFS DELIBERATELY NAME THE HARNESS, NOT THE NINE SUITES. `test/clock-sweep.test.ts` is
    the instrument that decides whether the drift is gone; a proof naming an individual repaired
    suite would pass whether or not the seam was used, because that suite passes today.

    THIS SHARD CARRIES NO PROOF THAT GREPS ITS OWN PATH.

