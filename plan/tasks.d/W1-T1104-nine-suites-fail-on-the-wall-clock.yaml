  rationale: |
    RE-DERIVED 2026-08-21 against origin/main `94543e79`, from a scratch worktree whose HEAD was
    proved equal to that sha before any reading. The harness is in the tree — `scripts/clock-sweep.mjs`,
    `.github/workflows/clock-sweep.yml`, `test/clock-sweep.test.ts` — so this was re-run rather than
