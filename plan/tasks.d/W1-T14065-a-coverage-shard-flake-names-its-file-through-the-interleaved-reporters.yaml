  acceptance:
    - claim: "topLevelTapFailures, given the coverage-shard excerpt where spec reporter lines (each starting with a check mark or a cross) sit between a column-0 not ok line and the location key under its cross line, returns that failure with location test/a-latched-restart-exits-when-its-last-lane-settles.test.ts"
      proof: "grep: W1-T14065 criterion 1: in test/a-coverage-shard-flake-names-its-file-through-the-interleaved-reporters.test.ts"
    - claim: "parseFailingTestFiles in scripts/test-with-retry.mjs, given that excerpt and the runner's checkout as cwd, returns exactly that one file, so the FLAKE-RETRY-FILES line retries it instead of printing that no failed test file could be named"
      proof: "grep: W1-T14065 criterion 2: in test/a-coverage-shard-flake-names-its-file-through-the-interleaved-reporters.test.ts"
    - claim: "invariant:quoted-paths-stay-out — a path that only a failure's error or actual text quotes is still never a failing file, exactly as W1-T13790 requires"
      kind: guard
      proof: "grep: W1-T14065 criterion 3: in test/a-coverage-shard-flake-names-its-file-through-the-interleaved-reporters.test.ts"
  rationale: |
    OBSERVED 2026-11-20 on core PR #19721 (head b98ccac), coverage-shard (6/12), Actions job 136477819091:
    - One test failed: "a running pass takes precedence over a previously completed pass since the latch"
      (test/a-latched-restart-exits-when-its-last-lane-settles.test.ts:170). The PR changes only
      src/lib/reviewer-health.ts and its own test, and the affected-suite selector reported 0 real failures.
    - The log then said "FLAKE-RETRY: first attempt failed — a running pass takes precedence …" and
      "FLAKE-RETRY-FILES: no failed test file could be named — the instrumented run is not repeated, and its
      verdict stands", so one unrelated flake failed the PR.
    - The coverage job prints the TAP and spec reporters together. After "not ok 451 - …", 12 lines starting
      with a check mark and one starting with a cross come at column 0, and the "  location: '…/test/a-latched-
      restart-exits-when-its-last-lane-settles.test.ts:164:1'" key follows the cross line, not the TAP line.
    OBSERVED at origin/main e200819f2: topLevelTapFailures in src/lib/base-reproduction.ts closes an open block at
    the first column-0 line (`/^\S/`), so the block for not ok 451 closes at the first check-mark line and never
    reads the key. Run on the job's whole log with cwd /home/runner/work/remudero/remudero, parseFailingTestFiles
    returns [] while parseFailingTestNames returns the failing title.
  design: |
    INVARIANT quoted-paths-stay-out: only a block's own two-space location key names a file.
    1. In topLevelTapFailures, treat a column-0 spec line that starts with a check mark or a cross and ends in
       "(<n>ms)" as reporter output, not as the end of an open TAP block. A spec cross line also opens a block
       for its own title, so its two-space location key is read.
    2. Merge a spec block into the TAP failure with the same title, so one failure yields one file and one entry.
    3. Keep the W1-T13790 rule: deeper, nested or quoted lines are never keys.
    4. Use a trimmed excerpt of job 136477819091 as the fixture; keep W1-T13790's fixtures passing unchanged.
  falsifier: |
    Revert step 1 and criterion 1's fixture yields a failure with no location, and criterion 2 returns [].
  note: |
    Id reserved for run-unfiled-1795200575394 with rmd next-task-id on the host.
