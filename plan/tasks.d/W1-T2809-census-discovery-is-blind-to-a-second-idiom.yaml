  title: "CENSUS DISCOVERY IMPLEMENTS ONE ENUMERATION IDIOM AND IS STRUCTURALLY BLIND TO THE OTHER — discoverSrcFilteredLsFilesCallers probes for the literal string ls-files, so the 78 suites that walk src/ with readdirSync/globSync are invisible with ZERO overlap, and the canonical instance hazard (j) was written about is in NEITHER set because unknownCoverage cannot fail open over a candidate never enumerated"
