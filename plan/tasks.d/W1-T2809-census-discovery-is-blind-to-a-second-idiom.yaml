      proof: "unit test: test/census-discovery-is-blind-to-a-second-idiom.test.ts"
    - claim: "the control is falsifiable by construction — with discovery restored to its single ls-files probe the control FAILS naming the undiscovered suite, and it passes only once discovery actually reaches that suite"
      proof: "unit test: test/census-discovery-is-blind-to-a-second-idiom.test.ts"
    - claim: "the two enumeration populations are asserted DISJOINT at head — suites found by the ls-files probe and suites walking src/ by readdirSync/globSync share no member — so the blindness is proven structural rather than incidental to one file"
      proof: "unit test: test/census-discovery-is-blind-to-a-second-idiom.test.ts"
    - claim: "the second matcher carries an in-source STOPGAP label naming the seam as its successor, and a test asserts that label is present so it cannot be silently dropped in a later edit"
      proof: "unit test: test/census-discovery-is-blind-to-a-second-idiom.test.ts"
    - claim: "unknownCoverage still reports every discovered-but-unplaceable caller, so widening discovery never converts a visible unknown into a silent omission"
      proof: "unit test: test/census-discovery-is-blind-to-a-second-idiom.test.ts"
