- id: W1-T3806
  title: "COMPOSE TRENDS AND BREAKDOWNS INTO THE VERSIONED ANALYTICS CONTRACT — complete payload or explicit per-section unavailability"
  repo: remudero
  depends_on: [W1-T3803, W1-T3804, W1-T3805]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 60.00
  origin: architect
  plan_refs: ["W1-T3623", "W1-T3803", "W1-T3804", "W1-T3805"]
  files: [src/lib/analytics-route.ts, test/console-analytics-rich-projection.test.ts]
  status: queued
  attempts: 0
  rationale: |
    The private Next console already accepts scalar console-v1 metrics but receives empty
    timeSeries, dimensions, and drilldowns. W1-T3804 and W1-T3805 deliberately build independent
    producers so their evidence rules can be tested without coupling them to HTTP or the live-state
    wiring. This task is the single owner of their wire composition and versioned response shape.
  design: |
    Compose the trend and breakdown producers into ConsoleV1Projection beside the seven scalar
    metrics. Preserve a section-level state and as-of/coverage metadata: one unavailable producer
    must not erase healthy siblings, and an empty array must never stand in for unavailable, stale,
    unauthorized, or not-collected. Keep the existing raw analytics fields for compatibility unless
    the version contract explicitly requires a bump; mismatched requested versions still refuse.
    This is read-only projection work and changes neither routing policy nor credential exposure.
  acceptance:
    - claim: "console-v1 returns scalar metrics, timeSeries, dimensions, and drilldowns under one explicit version"
      proof: "unit test: test/console-analytics-rich-projection.test.ts"
    - claim: "seven trend keys and the outcome and work-category breakdowns resolve when their producers have evidence"
      proof: "unit test: test/console-analytics-rich-projection.test.ts"
    - claim: "one unavailable, stale, unauthorized, or not-collected section remains explicit without erasing healthy sibling sections"
      proof: "unit test: test/console-analytics-rich-projection.test.ts"
    - claim: "the response contains no credentials, raw provider response, raw ledger row, prompt, or tool argument"
      proof: "unit test: test/console-analytics-rich-projection.test.ts"
