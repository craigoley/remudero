- id: W1-T3202
  title: "THE FULL SWEEP AWAITS EACH REPAIR BEFORE STARTING ITS REVIEW POOL — one slow CI-log or conflict worker holds every later green PR behind it, GitHub wakes are coalesced as skipped-concurrent, and queue latency becomes the duration of the oldest repair"
