  design: |
    1. At the dependency review composition root, select the current exact-head rollup using the
       existing workflow/run/attempt-aware selector, not a new name-only maximum timestamp rule.
       Preserve started/completed times, numeric check-run IDs, posted external IDs and real
       workflow/run identity. Reuse existing REST rollup/observation facilities when the GraphQL
       projection cannot carry that identity. Never fabricate identity from a check-run URL.
       Do not import sweep.ts into dep-review.ts: sweep already imports the dependency judge.
    2. A newer successful attempt of the same producer supersedes its older red; a late rerun
       of an older workflow run cannot override the newer run. Independent workflow producers
       retain the established selector contract. Genuine current red, unread/malformed selected
       evidence and a newer pending attempt remain unresolved, never permission to post success
       or arm. Preserve the lane-owned remudero-review exclusion and existing author/diff/version
       checks, major-migration staging and action-pin rules. Do not ignore another red check.
    3. Bind any extra production read to the selected repository/head, await an existing bounded
       asynchronous transport, and keep outages/head changes explicit and retryable by the existing
       lane. No new daemon poll loop, blocking default, arbitrary timeout-to-green fallback or
       parallel rerun. Preserve legacy injected fixtures deliberately without a real default leak.
       Keep contributor admission opt-in SHADOW, independent owner override and normal required
       CI/security/merge preflights unchanged. No real close, feedback publish or arm in tests.
    4. Drive the actual depReviewCommand boundary in existing test/dep-review.test.ts, with
       forbidden-effect recorders and a real PATH-shim default child. Cover old-red/new-success,
       old-run late rerun, equal-time ID ties, commit statuses, real current red, pending, malformed
       and failed reads, exact-head changes, configured owner and no-policy compatibility.
       Prove every added catch/default, real nonblocking in-flight transport, and W9664 staging
       compatibility. Delete the producer fix to fail these tests, restore to pass. Commit before
       scoped source-mapped coverage; prove all changed source SFs and relevant census membership.
       Run one native author on the final committed tree; reproduce new native failures on its
       actual unchanged pinned base. Normal hosted checks and required review still gate merge.
    OUT OF SCOPE: changing W5694's selector policy, dependency trust/allowlists, gates/baselines,
    ownership recovery, new scheduler activation, credential/settings changes and worker stops.
