      proof: "grep: W1-T13195 criterion 4 in test/a-clean-pr-keeps-its-merge-facts-when-a-pass-reads-no-main-or-no-rollup.test.ts"
    - claim: "invariant:unread-is-never-green — a PR with an unreadable rollup is never mergeable, never armed and never merged on that pass"
