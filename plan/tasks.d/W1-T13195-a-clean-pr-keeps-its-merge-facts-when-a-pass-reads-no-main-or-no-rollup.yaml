  acceptance:
    - claim: "A sweep.disposed row written by a pass with no main tip never records merge_state without merge_main_sha: it carries the main sha of the record it inherited, or it records no merge_state. Then a later pass at main ef8b749 inherits clean for the #18726 shape (clean rows at ef8b749 at 13:20 to 13:28Z, then a row from a pass with no main tip at 13:58:41Z)"
      proof: "grep: W1-T13195 criterion 1 in test/a-clean-pr-keeps-its-merge-facts-when-a-pass-reads-no-main-or-no-rollup.test.ts"
    - claim: "lastKnownMergeStateFromLedger reads a sweep.merge_probe row for the same pr_number and head_sha as a read against its main_sha (verdict clean as clean, conflict as dirty), so a clean probe at the current main is inherited and the reason never says 'read against main (unrecorded)'"
      proof: "grep: W1-T13195 criterion 2 in test/a-clean-pr-keeps-its-merge-facts-when-a-pass-reads-no-main-or-no-rollup.test.ts"
    - claim: "invariant:clean-only-at-its-own-main — a clean or behind record whose main sha is absent or differs from the current main is still not inherited (W1-T11166 stays true); a dirty record stays inherited at any main"
      kind: guard
      proof: "grep: W1-T13195 criterion 3 in test/a-clean-pr-keeps-its-merge-facts-when-a-pass-reads-no-main-or-no-rollup.test.ts"
