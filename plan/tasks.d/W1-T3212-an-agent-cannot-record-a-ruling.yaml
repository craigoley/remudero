  design: |
    (i) THE JUDGE ASSESSES RISK AND QUALITY, NOT CORRECTNESS OF THE DECISION. Its question is whether
    THIS ruling is safe for an agent to land: is it reversible, is it inside the agent's competence,
    does it contradict a standing decision, is it evidenced. It is not asked whether the ruling is
    RIGHT — that is what the operator's bit is for when the answer is no.
    (ii) FAIL CLOSED, AND THIS IS THE OPPOSITE POLARITY TO THE ESCALATION JUDGE. An unreadable,
    throwing or unparseable verdict routes to the INBOX, never to a landed ruling. There the costly
    direction was hiding work from a human; here it is installing a decision nobody reviewed. A
    reviewer's instinct will be to make it match its siblings and it must not.
    (iii) THE ESCAPE HATCH IS THE INBOX THAT ALREADY EXISTS. A refused ruling becomes a proposal the
    operator ratifies with `rmd approve` — the same gated, ledgered, one-bit path (`ratify.approved`)
    proposals already take. No second channel with its own audit trail.
    (iv) EVERY RULING IS ATTRIBUTED AND REVERTIBLE, whoever authored it. An agent-recorded ruling
    carries its author, its evidence and a rollback line, exactly as the operator's entries do. An
    entry a reader cannot attribute is worse than no entry.
    (v) A STANDING DECISION IS NEVER SILENTLY OVERTURNED. A ruling that contradicts an existing
    DECISIONS.md record is RISKY by construction and goes to the inbox regardless of what else the
    judge thinks — the reversal this task itself implements had to be the operator's for exactly
    that reason.
    (vi) EVERY VERDICT LEDGERED WITH ITS REASON, both arms, registered for retention in the SAME
    change. Establishing that the escalation judge had never run took three separate reads because
    no such row existed; that is not repeated.
