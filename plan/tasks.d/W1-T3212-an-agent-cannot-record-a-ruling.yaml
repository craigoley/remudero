    borderline just need a push in one direction or another or a judgement call. it seems like many
    of these can be solved without me."

    THE BLANKET BAN BOUGHT ONE REAL THING and this task must keep it: an agent could not quietly
    install a decision nobody reviewed. What replaces the ban is not permission — it is a REVIEWER.

    THIS IS THE FOURTH JUDGE IN THIS REPO AND THE PATTERN'S FAILURE MODE IS DOCUMENTED. W1-T349 built
