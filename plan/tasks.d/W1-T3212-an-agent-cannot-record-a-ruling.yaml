  falsifier: |
    CLOSE IF an agent can already record a ruling: read `src/lib/authority.ts` and the
    decision-authority text in DECISIONS.md.
    MEASURED 2026-09-08: `fb-1785882211812-bafd8f` states "an agent may recommend a ruling and may
    never record a ruling", cited four times in DECISIONS.md, and `authority.ts` enforces
    "ratification PRs only when an operator names a proposal to `rmd approve`".
    POSITIVE CONTROL for the backlog claim, because a count with no denominator proves nothing: the
    census must report every status — MEASURED {queued: 45, blocked: 5, merged: 10} over 60
    `verify: human` shards. A walk returning one bucket has failed to read the corpus.
    PROVE IT LOAD-BEARING: the fixture needs a ruling the judge PASSES and one it REFUSES, and the
    DECISIONS.md file must differ between them. A suite exercising only the pass arm cannot
    distinguish "the judge gates" from "the judge is decorative".
    DO NOT fail open. The escalation judge fails OPEN because hiding work from a human is its costly
    direction; here the costly direction is landing a decision nobody reviewed. Copying the sibling's
    default is the single most damaging error available in this task.
    DO NOT let the judge rule on a decision that contradicts a standing record. Design (v) sends
    those to the operator unconditionally; a judge permitted to overturn DECISIONS.md entries has
    been handed the authority this task is carefully NOT granting.
    DO NOT build a second ratification channel. The inbox and `rmd approve` already carry the
    operator's bit through a gate that ledgers it; a parallel path duplicates the audit trail and
    the bugs.
