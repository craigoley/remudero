  rationale: |
    This is the workflow half of W1-T10756 ("the fleet cron lines run the converged install"), cut out on 2026-11-16 so the fleet can build the rest. The daemon never dispatches a task whose `files:` names a path under .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a workflow file), so W1-T10756, filed 2026-10-26 at priority 1, waited three weeks for an operator build that nothing announced. Its installer and beat work needs no workflow edit. This record is the part that does, and an operator session hand-builds it.

    WHAT W1-T10756 LEAVES FOR THIS TASK. After it, scripts/fleet-heartbeat.sh publishes `beat_code_verdict`: `current` when the running script's blob equals the converged install's, `STALE — running <path> (<blob>), the converged install <root> at <sha> carries <blob>` when they differ, and `unknown — <reason>` when either read fails. Nothing reads that line. A beat that runs old code keeps reporting, the liveness chain reads it as FRESH, and the only trace is one payload line on a branch nobody opens. That is the silence W1-T10756 was filed for: its rationale, read on the host on 2026-10-26, found the cron running a checkout frozen at 65f87ae06 since 2026-10-16 with no check noticing.

    READ at origin/main ef8b74910f:
    - `git grep -l -e 'beat_code_verdict'` outside plan/ finds no file. Neither the beat nor the watcher knows the field yet.
    - .github/workflows/fleet-heartbeat-watch.yml:58 `DAEMON_EXPECTED_BRANCHES: "heartbeat-azure"`. The judging loop extracts each verdict with one sed line, for example :328 `reaper_verdict=$(printf '%s\n' "$payload" | sed -n 's/^session_reaper_verdict=//p' | tail -n 1)`, and classifies one liveness kind per branch in an `elif` chain (:356 `kind="REAPER_ALARM"`). The delivery step files one record per host with `--source "fleet-heartbeat:${branch}"` (:479) and resolves it at :474.
    - The self-check step (:89) runs before the live read and already carries one arm per verdict, each ending in a line such as :138 `echo "self-check: reaper arm raises only a refused, failed or unfinished pass"`.
    READ on origin's heartbeat-azure branch at 6dc76a1030 (2026-11-16T14:00:03Z), file heartbeat.txt: `install_dir=/home/craigoleyagent/rmd-state2/daemon-install`, `install_head_sha=ef8b74910`, a `session_reaper_verdict=` line, and NO `beat_code_verdict` line. So today a watcher built from this task would raise for the watched host on its first run. That is the reason for the dependency and for the build order below.
  design: |
    BUILD ORDER, checked before the first commit and stated in the PR body. Build this only when BOTH hold:
    - W1-T10756 is merged (its pull request's merge state, not the shard's `status:`);
    - a live beat shows the line: `git fetch -q origin heartbeat-azure && git show FETCH_HEAD:heartbeat.txt | grep -n '^beat_code_verdict='` prints a line, on a beat newer than that merge.
    If the second does not hold after the merge, the host is not yet running the new beat; that is W1-T10756's subject, and this task waits. Landing first would raise a stale-code record on every watch run for a host that is healthy.

    THE WATCHER RAISES STALE CODE OUTSIDE THE LIVENESS CHAIN (moved from W1-T10756 step (c4)). In fleet-heartbeat-watch.yml, extract `beat_code_verdict` beside the other verdicts. A branch in `DAEMON_EXPECTED_BRANCHES` gets its own needs-human record, `--source "fleet-heartbeat:<branch>:code"`, so it neither masks nor is masked by BEAT_STALE and the rest.
    - It raises when the verdict is `STALE`.
    - It ALSO raises when a fresh beat has NO `beat_code_verdict` line at all. The watcher runs from main, so a beat without the field is running code older than W1-T10756. That is how a frozen copy announces itself instead of staying silent.
    - `current` resolves the record. `unknown` neither raises nor resolves, and says so in the report.
    - Title: "fleet-heartbeat (<branch>): the beat runs stale code". The body names the running path, both blobs and the install head.
    - Add the arm to the workflow's self-check step. A STALE fixture and a field-less fixture must raise, and current and unknown fixtures must not.

    THE SUITE, test/daemon/the-heartbeat-watcher-raises-a-beat-that-runs-stale-code.test.ts (the folder `rmd test-place` computes). Extract the judging, delivery and self-check steps from the committed workflow the way test/fleet-heartbeat.test.ts does (`watchStepScript`, `deliverStepScript`), and run them against payload fixtures with a `gh` and a `node scripts/needs-human-issue.mjs` stand-in that record their arguments. Import through `#test/*` and `#src/*`.
    - criterion 1 (the test titled `W1-T13163: the watcher raises stale code, including a beat that predates the field`): STALE and field-less payloads on `heartbeat-azure` each raise `fleet-heartbeat:heartbeat-azure:code`; `current` resolves it.
    - criterion 2: the same STALE payload, otherwise healthy, leaves the liveness record `fleet-heartbeat:heartbeat-azure` resolved (a FRESH kind beside the code record); a payload the chain raises as BEAT_STALE keeps that kind with a `current`, a STALE and a missing code verdict alike.
    - criterion 3: `unknown — <reason>` produces neither a raise nor a resolve for the code source and the report line names it; a branch not in `DAEMON_EXPECTED_BRANCHES` produces no code record for any verdict.
    - criterion 4: run the extracted self-check step as committed (it passes), then with the code arm's predicate replaced by one that never raises and by one that always raises (it must fail both times).
    INVARIANT the-code-record-stands-beside-liveness: the stale-code record and the liveness record of one host are two sources; neither a raise nor a resolve of one changes the other.
    NOT IN SCOPE: scripts/fleet-heartbeat.sh, deploy/install-host-units.sh and the cron lines (W1-T10756); which trees the beat's gc probe judges (W1-T10751); any existing liveness arm.
  falsifier: |
    Moved from W1-T10756:
    - Raise only on an explicit STALE, so a beat without the field stays silent: the field-less half of criterion 1 must fail.
    - Put the arm inside the liveness `elif` chain: criterion 2's FRESH-beside-code assertion must fail.
    Added here:
    - Resolve the code record on `unknown`: criterion 3 must fail.
    - Take the arm out of the self-check step: criterion 4 must fail.
    GUARD that held at base and must still hold: every existing liveness arm still classifies as before (test/fleet-heartbeat.test.ts, test/fleet-heartbeat-supervisor-tick.test.ts and test/daemon/the-beat-publishes-a-session-reaper-pass-that-refused-or-never-finished.test.ts read this workflow). Restore and require every criterion and the guard to pass.
