- id: W1-T2776
  title: "HOST_CAUSED_SUITE_REDS MISSED test/a-lock-whose-container-is-gone-is-reclaimed-not-waited-on.test.ts — the same darwin bash-3.2 `declare -A` cluster it registers for test/recycle-container.test.ts also 8-fails this file, because both shell the same deploy/recycle-container.sh, and the mechanism that keeps the registry current when a NEW test joins an existing cluster did not fire"
  repo: remudero
