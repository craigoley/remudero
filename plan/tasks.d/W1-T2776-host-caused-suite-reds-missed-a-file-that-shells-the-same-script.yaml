  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: "span"
  budget_usd: 4.00
  files: [src/lib/ci-parity.ts, test/host-parity-azure-pole.test.ts]
  origin: "operator-decision#w1-t2776-file-bash32-registry-gap-2026-09-03"
