  title: "THE INBOX INTAKE RUNG DERIVES READINESS FROM THE BATCHED GATEWAY — `buildIntakeRungsDaemonHooks`' `inbox` rung calls `inboxCommand` in-process, and `inboxCommand` builds the unbatched `ghGateway` (one synchronous trailer search per task it derives), which W1-T5650's census can only carry as a shrink-only exemption"
  repo: remudero
  depends_on: [W1-T5650]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the inbox intake rung leaves the unbatched-gateway population
  band_meaning: span
  origin: "operator session 2026-10-05: W1-T5650 (#9210) follow-up"
  plan_refs: [W1-T5650, W1-T2509, W1-T192]
  files: [src/run-task.ts, test/no-daemon-loop-path-builds-the-unbatched-gateway.test.ts, test/the-inbox-intake-rung-derives-readiness-from-the-batched-gateway.test.ts]
  status: merged
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main f0452a82 and #9210 (W1-T5650, open, head 4c3d3977).
    `buildIntakeRungsDaemonHooks` (src/run-task.ts) runs `await (deps.inbox ?? inboxCommand)([],
    { config })` for the `inbox` rung, and `inboxCommand` sets `deriveDeps = { ledgerPath, github:
    ghGateway(owner, repo) }`, so every task its readiness derives is one synchronous `gh` search on
    the daemon loop. #9210's census test (test/no-daemon-loop-path-builds-the-unbatched-gateway.test.ts)
    reaches `inboxCommand` from the daemon and carries it in `BOUNDED_PER_PASS` ("reached only through
    ... the `inbox` intake rung, which ... ships disabled and caps at maxPerDay fires"), ceiling 2.
    The cadence bound is real, but an operator who enables the rung gets the stall class back.
  design: |
    Move the `ghGateway(` construction out of `inboxCommand` into its CLI entry (a function the daemon
    does not reach), so `inboxCommand` takes the gateway as a dependency; the intake rung passes a
    `buildBatchedGithub` gateway built once per `buildIntakeRungsDaemonHooks` call. Remove the
    `inboxCommand` entry from `BOUNDED_PER_PASS` and lower `BOUNDED_PER_PASS_CEILING` to 1. If
    W1-T5650 has not merged, stop and record needs-design. Add no comment lines to src/run-task.ts.
  acceptance:
    - claim: "the inbox intake rung derives readiness for 50 plan tasks through one batched fetch with zero per-task trailer searches, and the census passes with inboxCommand removed from its exemption table at ceiling 1"
      proof: "unit test: test/the-inbox-intake-rung-derives-readiness-from-the-batched-gateway.test.ts"
  falsifier: |
    Put `ghGateway(owner, repo)` back into `inboxCommand`: the counting fake sees one search per task
    and the census names inboxCommand.
