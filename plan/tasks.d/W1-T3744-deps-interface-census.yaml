- id: W1-T3744
  title: "THE *Deps CEILING IS EVADABLE BY RENAMING, AND THE FILE RECORDING IT TELLS AUTHORS THE OPPOSITE — W1-T2894's whole descent strategy rests on a regex that an inline structural type or a `...Seams` suffix walks straight past, while scripts/deps-interface-baseline.json's own comment invites the growth the test refuses"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: low
  origin: "#5940 — coverage-ratchet refused a PR adding one injected seam (158 -> 159); filed by that PR's author, who considered the evasion below before paying with a real consolidation instead"
  plan_refs: [W1-T2894]
  files: [test/deps-interface-census.test.ts, scripts/deps-interface-baseline.json]
  status: queued
  attempts: 0
  rationale: |
    THIS TASK SERVES W1-T2894, IT DOES NOT ARGUE WITH IT. That task built the census precisely so
    "the number can only fall, one PR at a time", and that intent is not in question here. What is
    in question is whether the census can actually hold the line it was given. Measured on #5940
    2026-09-17, twice it cannot:

    (1) THE CEILING IS EVADABLE BY RENAMING. The census matches
        `^(?:export\s+)?(?:interface|type)\s+([A-Za-z0-9_]+Deps)\b`. Two edits defeat it with no
        change in substance: declare the same members as an INLINE structural type in the
        signature, or name the interface `...Seams`. Either adds exactly the ad-hoc wiring
        W1-T2894 exists to eliminate, while the recorded number stays flat — and a flat number is
        then read as the ratchet working. `FreshTreeReviewSeams`, already in this repo, shows the
        second spelling is not hypothetical.

        The author of #5940 hit the refusal and considered both before paying the honest price.
        Under deadline, a builder who reads only the CI line will not.

    (2) THE BASELINE FILE CONTRADICTS THE REFUSAL. test/deps-interface-census.test.ts prints
        "Move wiring behind the composition root or reuse an existing seam instead of adding
        another *Deps shape" — no growth path. scripts/deps-interface-baseline.json, the file it
        reads, says "deliberate growth must be reviewed here". Under W1-T2894 the TEST is right and
        the COMMENT is wrong: the number is meant to fall, not to be negotiated upward. An author
        who finds the comment first will raise the number and cite it.

    (3) THE CHEAPEST HONEST DESCENT IS UNNAMED. main carries seven groups of byte-identical
        member-sets — `RatifyBatchLedgerDeps` was the same three members as `RatifyLedgerDeps` in
        the same file, its own doc comment deferring to the original, and #5940 retired it. Nothing
        surfaces these, so the one move that lowers the number without touching behaviour has to be
        rediscovered by hand each time.
  design: |
    (i) THE SUFFIX IS NOT THE SUBJECT. The census must count an inline structural seam and a
        `...Seams`-suffixed declaration the same as a `...Deps` one, or (1) survives every other
        change here. This is the load-bearing item; the rest is reporting.

    (ii) THE BASELINE COMMENT STATES THE RULE THE TEST ENFORCES. One sentence, agreeing with the
         refusal: the count falls and does not rise. Two files stating opposite rules is how an
         author picks the one they prefer.

    (iii) NAME THE DUPLICATE MEMBER-SETS. Report groups of declarations carrying identical members
          so the honest descent is visible rather than rediscovered. REPORTING, NOT REFUSING — a
          duplicate that predates this task must not turn an unrelated PR red.

    (iv) DO NOT RAISE THE CEILING, AND DO NOT ADD A PATH THAT RAISES IT. W1-T2894 owns that number.

    NOT IN SCOPE: retiring the seven existing duplicate groups, and the composition root itself —
    both are W1-T2894's. This task must not be able to pass by deleting duplicates.
  acceptance:
    - claim: "a seam declared inline or under a different suffix is counted, so renaming no longer evades the ceiling"
      proof: "grep: countsInlineAndAliasedSeams in test/deps-interface-census.test.ts"
    - claim: "the baseline file states the same rule the refusal states, rather than inviting reviewed growth"
      proof: "grep: can only fall in scripts/deps-interface-baseline.json"
    - claim: "declarations sharing an identical member-set are reported as the honest way down, without refusing"
      proof: "grep: identical member-set in test/deps-interface-census.test.ts"
  falsifier: |
    Match on the `Deps` suffix alone and the first assertion goes red — that is the item the whole
    task rests on. Make the duplicate report REFUSE rather than report and an unrelated PR carrying
    a pre-existing duplicate reddens, which (iii) forbids. Leave the baseline comment as it is and
    the second goes red. Raise depsInterfaceCount in any fixture and (iv) must still refuse.
