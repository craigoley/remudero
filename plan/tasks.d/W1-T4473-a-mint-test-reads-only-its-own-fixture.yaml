  # plan gardener: retire W1-T4473 — Every acceptance proof now holds on main, and did not when it was filed.
  attempts: 0
  rationale: |
    OBSERVED 2026-09-24: "W1-T4414: a default-family mint with --branch records that branch too" failed twice (first
    attempt and retry) on #7028's head 5ba4378, passed on main, and passed again after update-branch.
    Reproduced locally on 5ba4378: the command printed "W1-T4468 (max 4467 across tasks.yaml 280, shards 4463, … remote
    plan 4467) — DEGRADED: local-plan (this checkout's plan half is 4 id(s) behind origin's …)" and returned 1
    (nextTaskIdCommand: `return mint.degraded.length ? 1 : 0`). #7035 (W1-T4465..4467) merged one minute after #7028's
    push, which put the branch 4 ids behind.
    OBSERVED: planPath defaults to join(repoRoot, "plan", "tasks.yaml") and no dep injects repoRoot. Of 13 test files
    that call nextTaskIdCommand, 6 pass no --plan (grep over test/).
  design: |
    (i) NextTaskIdReserveDeps gains repoRoot. Each of the six suites points --plan or repoRoot at its own fixture
    clone, whose plan carries the ids the test expects.
    (ii) A census fails when a test calls nextTaskIdCommand with neither --plan nor deps.repoRoot, so a seventh suite
    cannot reintroduce the read.
    (iii) Positive control: the W1-T4414 case passes when run from a checkout whose plan is behind origin.
  acceptance:
    - claim: "no mint suite calls the command without its own plan"
      proof: 'grep: test("W1-T4473: no mint suite calls the command without its own plan" in test/a-mint-test-reads-only-its-own-fixture.test.ts'
    - claim: "a default-family mint passes from a checkout behind origin"
      proof: 'grep: test("W1-T4473: a default-family mint passes from a checkout behind origin" in test/a-mint-test-reads-only-its-own-fixture.test.ts'
  falsifier: |
