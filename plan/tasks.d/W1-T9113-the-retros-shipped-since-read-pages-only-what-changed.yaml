  rationale: |
    READ ON origin/main 535a172e6 (symbols, not lines).
      - THE ASYNC GATEWAY. `retroTriggerCheckAsync` (src/run-task.ts) builds `retroShippedGithubGatewayAsync()` on
        every call. That gateway answers `headRefName` and `findMergedByTrailer` by replaying a fresh
        `buildBatchedGithub` over the `gh` answers it holds. Its `answers` map lives only as long as the one check. On a
        miss, `load` calls `fetchBoardPrsRestAsync(owner, repo, ..., undefined, half)`: `known` is `undefined`, so
        `boardPrsWalk` runs in `full` mode at `BOARD_FULL_PAGE_SIZE` (100) from page 1 until a short page. The replayed
        gateway is built with no `snapshotCache`, so it also starts cold and asks for the same full-mode argv.
      - THE SYNC GATEWAY. `retroShippedGithubGateway` builds `buildBatchedGithub(owner, repo, { exec,
        commitTrailerIndex })`, again with no `snapshotCache`. `retroCommand` uses it for the real retro's shipped
        union, and `retroTriggerPrelude` constructs it for the sync check.
      - WHO REACHES IT. `retroTriggerConclude` runs `shippedSinceAsync`, which calls the gateway for each candidate
        run. With the marker at 2026-10-06T10:45:50Z (state/last-retro.json on the host), every run started since then
        is a candidate, so a check that is not deferred always reads the board, and so walks the whole closed half.
      - WHERE IT RUNS. `buildRetroDaemonHooks` wires `checkRetroTrigger` to `retroTriggerCheckAsync`. The daemon tick
        (src/lib/daemon.ts, "Retro cadence trigger") AWAITS it once per tick, after headroom and before the dispatch
        pick. Every page goes through `ghTextAsync`, so it does not block the event loop, but the tick waits for the
        whole walk, and each page takes a slot of the shared read cadence (`applyGhReadCadenceAsync`).
      - WHAT THE BOARD ALREADY HAS. W1-T2873 made the closed index durable: `createBoardSnapshotCache(config.root,
