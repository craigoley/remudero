  falsifier: |
    Keep `undefined` as `known` in `load`, and the seeded test records every page the fake serves at per_page=100
    instead of one at per_page=30. Seed the load but not the replayed gateway, and the replay asks for a full-mode
    page the load never fetched, so the test sees a second load. Let the retro's snapshotCache commit, and the
    no-write test finds the fixture snapshot rewritten.
