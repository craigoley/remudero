  design: |
    No page cap, no TTL and no timer. The retro reads the same durable closed index the board gateway keeps.
    1. ONE SEED PER GATEWAY. `retroShippedGithubGatewayAsync` and `retroShippedGithubGateway` read the board
       snapshot once when built: `createBoardSnapshotCache(loadConfig().root, owner, repo).closedSeed()`, behind an
       injectable `snapshotFor(owner, repo)` option so tests pass a fixture. The seed is captured once and reused for
       the gateway's life.
    2. THE LOAD AND THE REPLAY ASK FOR THE SAME PAGES. The async `load` passes the seed as `known` to
       `fetchBoardPrsRestAsync`, so the closed half runs in `delta` mode and stops at the first held row with the same
       `updated_at`. The replayed `buildBatchedGithub` and the sync gateway get a `snapshotCache` whose `closedSeed()`
       returns that same seed, so their walk asks for exactly the delta argv the load fetched, and the replay never
       misses on a page the load did not read. The open half is unchanged (no seed, as W1-T2323 requires).
    3. READ-ONLY. The retro's `snapshotCache` makes `commitClosed`, `commitIssues` and `commitOpen` no-ops. The board
       gateway stays the snapshot's only writer, so a retro never races it.
    4. NO SNAPSHOT MEANS TODAY'S WALK. A missing or unreadable snapshot gives no seed, and the gateway walks in full,
       exactly as it does today.
    5. A ROW PER LOAD. Each async `load` of a board half appends `retro_trigger.shipped_read` with `half`, `mode`
       (`delta` or `full`), `calls` and `seeded` (the seed's row count, or 0), from `BoardFetchResult`. The sync
       gateway's walk is the CLI retro's and stays unlogged.
    Tests go in test/the-retro-shipped-read-pages-only-what-changed.test.ts, with `test(` titles verbatim as in the
    proofs below. Drive `retroShippedGithubGatewayAsync` with an injected `execAsync` that serves numbered pages and
    records every argv, and with a fixture `snapshotFor`. Drive `retroShippedGithubGateway` with an injected `exec`.
