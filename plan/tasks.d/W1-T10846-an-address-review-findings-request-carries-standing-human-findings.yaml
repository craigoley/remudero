    Operator source review of this native draft: buildFixRungDispatchArgs in src/run-task.ts is the actual constructor called by the real sweep dispatch. It explicitly copies evidence fields and reconstructs initialReview; a test recording only deps.dispatchFix does not prove that findings reach runFixRung or its worker. The published PrActionRequest/PrActionResult in openapi/daemon.yaml and generated schema.d.ts currently admit only fix/review, so the new supported operation requires those declared paths. readLedgerLines in status.ts explicitly reads only the live file. spend-rows.ts distinguishes produced from restated costs; spendAmountUsd alone is not a complete allowance measurement. The current sweep passes the nominal task budget into the rung, so verified remaining allowance must reach the actual worker ceiling, not only a precheck.
    Research informing functional replay: https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/ describes caller-owned identifiers, original parameter binding and atomic request/effect recording. https://docs.stripe.com/api/idempotent_requests illustrates saved outcomes, parameter mismatch refusal and the consequence of pruning keys. These are design references, not new services or their retention policy. The original native draft and its receipts remain retained. This candidate changes no source, holds, authority, claims or budget. Refresh the complete current open-head subject audit before corrective filing; preserve the original audit's time and limits.
  design: |
    1. A DISTINCT, EXPLICIT REQUEST. Add PrActionName "address-review-findings" through the existing armPrAction ingestion and existing route tier. The caller creates and persists requestId BEFORE POST or CLI dispatch. The new action requires that requestId, reviewId, expectedHeadSha, explicit confirmCurrentHead and bounded selected clarificationCommentIds; it never mints a replacement requestId inside requestPrAction. Freeze and compare the complete bounded command plus actor, instance/repository, PR, resolved task, head and selected review. Same requestId with the same frozen command returns the durable existing outcome; the same id with changed parameters refuses without overwriting it. Different pending requests for the same PR retain the existing no-parallel-work refusal. Existing fix/review fields and behavior remain unchanged. Extend PrActionRequest/PrActionResult and explicit pending/refused/unknown/replayed result definitions in openapi/daemon.yaml, then regenerate packages/api-client/src/schema.d.ts with the maintained generator. Do not reinterpret the display-only operator header or change access/authorization. No Console UI or action-executor catalogue entry.
    2. DEFAULT TRANSPORT. The daemon's runPrAction maps this action to the SAME fixCommand:
       `<n> --repo <r> --requested --address-review-findings <reviewId> --expected-head <sha>
       --request-id <id> [--confirm-current-head] [--clarification <id>]...`. The mapping is one exported
       function in fleet-control.ts, called by the closure in src/cli/commands/daemon.ts. The
       src/lib/daemon.ts action types widen to PrActionName. Marker lifetime and detached execution are
       unchanged (W1-T4077).
    3. EVIDENCE, BOUND AND HONEST (fix.ts, address-review arm only). Refuse by name, before any
       dispatch: missing --requested/--expected-head/--request-id ("address_review_selection_incomplete");
       live head differs from expectedHeadSha ("address_review_head_moved"). Read the review listing with
       pullReviewsRestArgs through the default gh transport and classify it with classifyChangesRequested:
       unreadable or ambiguous ("address_review_evidence_unreadable"); reviewId is not a standing hold, is
       a bot or is superseded ("address_review_not_standing"); the hold's commitId is not the current head
       and confirmCurrentHead is false ("address_review_head_unconfirmed"). Then fetch that review's own
       body and its comments. If both are empty: "address_review_findings_empty". Fetch each selected
       clarification. It must be on this PR, by the holding reviewer, not a bot, and created at or after
       the review. Otherwise: "address_review_clarification_unqualified". Unselected comments are never
       read as findings or as approval. Bound every text field and keep it labelled untrusted.
    4. ORDINARY OWNERSHIP, SCOPE AND BUDGET. The task head must pass fixHeadAcceptable
       ("address_review_head_not_task_owned"). Remaining allowance is a positively observed task-scoped remainder on the SAME accounting basis as the existing task budget and governing operator ruling, reusing maintained produced-versus-restated accounting and the complete relevant instance/repository/task corpus across rotated gzip/plain and live ledger forms. Keep cash, subscription/notional estimates and their attribution distinct; do not invent a cash-only rule for a budget governed by estimated model cost, mix accounting units, or change general budget policy. Do not sum spendAmountUsd on restated verdicts or treat a live-only read, missing/torn corpus, unavailable governing basis or missing relevant producer amount as zero. Carry coverage and positive controls; unavailable evidence refuses address_review_allowance_unknown, and exhausted remainder refuses address_review_allowance_exhausted. Under the ordinary owned branch/request admission, revalidate the remainder and cap the ACTUAL round/worker maxBudgetUsd at min(verified remainder, existing normal ceiling). A positive check followed by passing the full nominal task budget is insufficient. Preserve other current reservations/admission and all global caps. The arm admits only when routeFix's ordinary disposition is
       mergeable or the human-hold blocked-ambiguous row. A terminal PR is still refused. Ordinary
       ci/review/conflict evidence returns "address_review_ordinary_evidence_present" and is left to the
       plain requested fix; the two are never bundled.
    5. SAME DISPATCH. Call the SAME deps.dispatchFix with
       {unmetCriteria: [], humanReviewFindings, operation: "address-review-findings", requestId}. Add
       those fields to FixDispatchEvidence/FixEvidence, plus one deriveFixMode row. The prompt renders the
       findings as untrusted human review evidence. The worker's instruction is a code change within the
       task's declared files only. It must not dismiss or resolve reviews, approve, arm or merge, post a
       status, or edit plan/acceptance text. The result goes through fixDispatchResult unchanged. A
       declined claim, capacity or admission refusal stays a refusal (W1-T9682). There is no second
       launcher, no direct repair and no synthetic red check. The native verdict and the hold are never
       written.
    6. DURABLE, AT MOST ONCE. Persist a bounded private request journal before marker publication or dispatch, using the maintained atomic-publication/request-claim pattern. A ledger read followed by an append is not an atomic claim. Bind the caller requestId and frozen-command digest, retain exact pending/refused/dispatched/unknown outcomes and corresponding real native run/claim identity, and preserve the consumed-request fence after marker removal, completion and restart. Matching retries replay; conflicting parameters refuse; concurrent same-ID callers produce one durable claim and at most one real dispatch. A prepared but uncertain side effect stays unknown and never silently launches again. Reconcile only real owned native receipts. Terminal diagnostics remain in the normal ledger, carrying operation/requestId through completion and scope stand-down. Refuse journal capacity or retention ambiguity rather than evicting a live or consumed fence to permit another dispatch. Legacy plain --requested and automatic sweep do not create this evidence. Test the HTTP response lost AFTER the worker completed and its marker was cleared, not only a replay while a marker exists.
    7. TESTS: exact titles. Fix-lane file (drives the run-task fixCommand export through the shared gh
       shim's real gh subprocess; route-level cases may record the maintained dispatch boundary; `route` is never injected):
       "W1-T10846: an address-review request dispatches the maintained fix rung once with the standing review's findings"
       "W1-T10846: an ordinary requested fix on a green PR with a standing human review is still refused"
       "W1-T10846: a green PR with no standing human review refuses the address-review request"
       "W1-T10846: an old-head review needs explicit current-head confirmation"
       "W1-T10846: a moved head, superseded review, unreadable listing or unqualified clarification is refused by name"
       "W1-T10846: unknown or exhausted allowance and declined admission are refused by name"
       "W1-T10846: the command dismisses no review and posts no status, approval or merge"
       "W1-T10846: a replayed or restarted request returns its recorded outcome without a second dispatch"
       Daemon file (real marker files in a temp state dir, the real pr-actions route handler and the
       daemon's PR-action timer):
       "W1-T10846: an address-review request reaches the fix command with its bound selection"
       "W1-T10846: an address-review marker is distinct from a plain fix marker and runs at most once"
       "W1-T10846: the pr-actions route refuses an incomplete address-review selection"
       Use forbidden-effect traps: the gh-shim call log must contain no dismissals, statuses, reviews
       POST, merge or auto-merge call. Keep the red receipt from the falsifier and the green receipt.
       Do not edit coverage, census, ratchet or placement instruments to make a proof pass.
    OUT OF SCOPE: the Console button and presentation (file separately only if strictly needed);
    action-executor catalogue entries; Console148/149/150 and WRECK-T1..6; PR14788's advisory-policy
    propagation; any live repair of PR2319 or PR2321 (both permits stay consumed, and a later attempt
    needs fresh explicit human authority through this path); review dismissal; claim clearing; daemon
    restarts; spend-limit, allowlist, credential or access changes.

    8. ACTUAL DISPATCH CONSTRUCTOR. Scope src/run-task.ts because buildFixRungDispatchArgs is the default production constructor used by sweep's real dispatch. Carry humanReviewFindings, the durable operation/request identity and the verified remainder through it into runFixRung and the ACTUAL spawn options. The existing constructor synthesizes a failing initialReview for ordinary failure modes; the explicit human-findings mode must preserve the truthful native success and represent outstanding human-request work separately, with no fabricated unmet criterion or published red status. Add a fixture reaching the real default sweep/constructor/rung boundary and controlled worker subprocess/spawn, rather than stopping at a fake dispatch recorder. Prove findings, request id and the lower verified maxBudgetUsd reach that worker; test the terminal outcome and hold/status non-effects. This remains the same maintained launcher and claim lifetime.
    9. REQUIRED NEW REPLAY/ALLOWANCE CASES. In the existing two declared new suites, add distinct executable titles for (a) same HTTP frozen request after successful completion/marker removal and lost response, (b) concurrent same-ID callers over real durable files, (c) same ID changed selection refuses without overwrite, (d) archive producer plus restated terminal counted once and unavailable history refuses, and (e) actual default arg-builder/rung passes the smaller verified allowance and genuine findings into the worker. Neither a metadata-only allowance assertion nor a fake-only dispatcher proves enforcement. Keep all four original acceptance claims/proofs and the original independent guard-removal falsifiers. Run the actual rmd test-place against the written files/imports before publishing; if it disagrees, obtain a normal plan scope/proof correction before writing out-of-plan paths, never edit the placement instrument.
