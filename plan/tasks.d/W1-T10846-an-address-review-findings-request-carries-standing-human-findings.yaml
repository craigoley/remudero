  rationale: |
    OBSERVED (issue https://github.com/craigoley/remudero/issues/14829): Console PR2319 at
    e6a8f62b49898f42f680c3fc3f880d9ff5897aaa has native PASS, green required checks and a standing
    human CHANGES_REQUESTED review 5665129562 naming functional recovery defects. One human-approved
    operator repair was processed once as FIX-1793105698889 and REFUSED at 2026-10-27T12:55:08.626Z:
    "review success, required checks green ... (no block evidence to drive the rung)". No worker ran.
    Console2321's separately owned request hit the same guard. Both permits are CONSUMED; both holds stand.
    READ on main 07dbdcc776160885cbd27dca698b146a161251d3:
    - src/cli/commands/fix.ts requestedFixView returns {...pr, priorStrikes: 0} and nothing else.
      routeFix reuses deriveDisposition; with no ci/review/conflict evidence it falls to
      "refused ... (no block evidence to drive the rung)". That refusal is correct for an ordinary
      request and W1-T4077 design (iii) deliberately preserves it.
    - fixCommand builds its one-PR OpenPrView without scannerBlocker or any review listing, so a
      person's standing review never reaches routeFix or the worker.
    - src/lib/open-prs-rest.ts already has pullReviewsRestArgs and classifyChangesRequested (each human
      reviewer's latest decisive review; an incomplete page is "unreadable", never "no hold").
      src/lib/sweep.ts changesRequestedHold/changesRequestedReason describe a hold and state that no
      automation can clear it. fixHeadAcceptable is the existing task-head ownership test.
    - PrActionName is "fix" | "review"; the marker is keyed (action, PR); the daemon's runPrAction runs
      `rmd fix <n> --repo <r> --requested`. armPrAction is shared by POST /v1/pr-actions and
      action-executor.ts. The x-remudero-operator header is display-only (W1-T4077 design v).
    The issue body itself states it is not a task id, implementation credit or a live retry grant.
    Settled by lookup: is this already filed or already decided? -> no. No plan task names
