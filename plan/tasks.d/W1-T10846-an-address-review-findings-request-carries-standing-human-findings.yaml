  falsifier: |
    Each step below is executable against the implementation and must turn the named test red.
    (a) Load-bearing guard: replace the standing-hold lookup in the address-review arm with an
        always-found hold. The green-no-review and superseded-review tests then dispatch and fail.
    (b) Remove the current-head confirmation check. The old-head test dispatches without
        confirmCurrentHead and fails.
    (c) Delete the request_id replay check. The restart test records two dispatchFix calls and fails.
    (d) Route the request through plain requestedFixView. The positive test is refused with "no block
        evidence" and fails.
    (e) Treat unreadable spend as zero. The allowance test dispatches and fails.
    Restoring each guard gives a genuine nonzero-test, zero-failure summary. The ordinary requested-fix
    refusal test must stay green throughout every mutation; it is the positive control that the default
    path is unchanged.
