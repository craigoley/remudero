  title: "DISPATCH ORDERS BY A COST-OF-DELAY SCORE THAT AGES, AND PRIORITY IS ONE INPUT TO IT — `compareDispatch` sorts on `priority` before the stride, so on 2026-10-13 about 20 dependency-met auto tasks sat at priority <= 1 and 28 more at <= 1.5, and filers minted 0.9-0.93 (#11483, #11485) to get ahead: an arms race the order cannot end"
