  falsifier: |
    Evidence: a median wait of 2 h. Queue: P2 X filed 5 h ago and P1 Y filed now, both unstarted, same class, no
    dependents. Today Y dispatches first because its priority is lower. With the fix, X's urgency is 1 + 2.5 + 0 =
    3.5 against Y's 1 + 0 + ~1, so X dispatches first. Put priority back as the comparator's first key and the first
    test reads Y. Drop the head start and the second test (X and Y both filed now) ties on age and is decided by id.
    Weight raw priority values instead of the outranked share, and the third test sees 0.5 beat 0.9 by more than
    one rank. Leave an undated task out of the stride, and the fourth test finds it sorted last.
  note: |
    EFFECT, measured after merge from the core ledger union with no numeric pass mark: for each `run.start`, compare
