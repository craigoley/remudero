  acceptance:
    - claim: "The command chooses the host for the preflight from readings: the Mac when its memory pressure is normal, else the other configured host. It names the host and the reading. A host whose reading is unreadable is not chosen"
      proof: "grep: W1-T12169 criterion 1 in test/ci/one-command-ships-a-hand-built-branch-from-an-operator-session.test.ts"
    - claim: "On a Mac the command runs the preflight at low priority, so that a person's work on the same machine goes first"
      proof: "grep: W1-T12169 criterion 2 in test/ci/one-command-ships-a-hand-built-branch-from-an-operator-session.test.ts"
    - claim: "After a failed preflight the command runs the failed tests alone, then runs the same tests on unchanged main on the same host. It names each test by its file and its full title, never by its body, and puts each failure in one class: caused by the change, caused by the host, or also failing on main. A test whose file and full title both fail on main is also failing on main, even when the change edits its body"
      proof: "grep: W1-T12169 criterion 3 in test/ci/one-command-ships-a-hand-built-branch-from-an-operator-session.test.ts"
