  rationale: |
    OBSERVED 2026-11-10: operator sessions ship hand-built branches through two shell scripts that are in no repository.
    - One is ~/rmd-hand/bin/ship.sh on the Mac agent account (179 lines). The other is ~/rmd-work/bin/ship.sh on the Azure host. They differ, and each was changed by hand during the day.
    - Each does the same work: one preflight at a time, a rerun of the failed tests alone, a comparison with unchanged main, the push, the pull request and a check of the stored body.
    - 25 branches went through the Mac script that day. Its limit is the memory of the Mac. When the Mac is under memory pressure, the session moves the work to Azure by hand.
    - A Codex session and a Claude Code session each need this, and each writes its own copy.
    - `rmd hand-worktree` (W1-T5533) already gives such a session its worktree with one command. Nothing does the same for the steps after the build.
  design: |
    New module src/lib/hand-ship.ts exports `runHandShip`. Every effect is injected: the readings, the spawn of the preflight, the test runs, git and the GitHub calls.
    The hosts come from a file that the operator owns in the state directory. Each entry has a name, an ssh target or "local", and a kind. The repository holds no host name.
    The classes of criterion 3 follow the Mac script: all green alone means the host; red alone and red on main means also failing on main; otherwise the change.
    The command keeps its state in one directory for each run: status, history, logs and the process id.
    `authorPushEligibility` in scripts/preflight-author.mjs stays the only judge of a receipt.
    NOT IN SCOPE: the merge, any change to the author preflight, and the removal of the two shell scripts. The operator removes them after one week of use.
  falsifier: |
    Choose a host whose reading is unreadable and criterion 1 must fail. Push after a failure in the class caused by the change and criterion 4 must fail. Call a failure that is green on main "also failing on main" and criterion 3 must fail. Restore and require all to pass.
  note: |
    On a remote host the command runs the same preflight over ssh, in a worktree it brings there as a git bundle. The two scripts do this today.
