  amendment: |
    2026-11-23, scope: four paths join files:. (1) src/lib/hand-ship.ts imported authorPushEligibility and
    failingTestsFromTap from scripts/preflight-author.mjs, which spawns src/run-task.ts, so run-task -> hand-ship ->
    preflight-author -> run-task formed a cycle: the reach ratchet refused it (largestScc 90 > 85) and bundled-child
    suites failed on preflight-author's top-level await. Those helpers move unchanged to
    scripts/lib/author-push-eligibility.mjs, which scripts/preflight-author.mjs re-exports and hand-ship imports.
    (2) hand-ship cuts unchanged main with a raw git worktree add on the preflight host, possibly over ssh, where
    worktreeAdd cannot reach. The worktree-creation census requires a named row in src/lib/worktree-sites.ts and its
    test's count of exempt sites; the operator approved that named row (2026-11-23 11:41Z). No acceptance change.
  rationale: |
    OBSERVED 2026-11-10: operator sessions ship hand-built branches through two shell scripts that are in no repository.
    - One is ~/rmd-hand/bin/ship.sh on the Mac agent account (179 lines). The other is ~/rmd-work/bin/ship.sh on the Azure host. They differ, and each was changed by hand during the day.
    - Each does the same work: one preflight at a time, a rerun of the failed tests alone, a comparison with unchanged main, the push, the pull request and a check of the stored body.
    - 25 branches went through the Mac script that day. Its limit is the memory of the Mac. When the Mac is under memory pressure, the session moves the work to Azure by hand.
    - A Codex session and a Claude Code session each need this, and each writes its own copy.
    - `rmd hand-worktree` (W1-T5533) already gives such a session its worktree with one command. Nothing does the same for the steps after the build.
  design: |
    New module src/lib/hand-ship.ts exports `runHandShip`. Every effect is injected: the readings, the spawn of the preflight, the test runs, git and the GitHub calls.
    The hosts come from a file that the operator owns in the state directory. Each entry has a name, an ssh target or "local", and a kind. The repository holds no host name.
    The classes of criterion 3 follow the Mac script: all green alone means the host; red alone and red on main means also failing on main; otherwise the change.
    The command keeps its state in one directory for each run: status, history, logs and the process id.
    `authorPushEligibility` in scripts/preflight-author.mjs stays the only judge of a receipt.
    NOT IN SCOPE: the merge, any change to the author preflight's behaviour (the 2026-11-23 amendment moves its
    push-eligibility helpers to a module it re-exports, nothing more), and the removal of the two shell scripts. The operator removes them after one week of use.
    NO-INVARIANTS: the command is new and has no prior behaviour to keep; the shared modules it touches (authority, git-push, github-transport, worktree-git) gain the rows and helpers it calls, and their existing callers are covered by their own tests.
  falsifier: |
    Choose a host whose reading is unreadable and criterion 1 must fail. Push after a failure in the class caused by the change and criterion 4 must fail. Call a failure that is green on main "also failing on main" and criterion 3 must fail. Key a failure by its callback body instead of its file and title, edit only an assertion message in a test that fails on main, and criterion 3 must fail. Drop the lease and move the remote tip between the last read and the push, and criterion 4 must fail. Restore and require all to pass.
  note: |
    files: amendment 2026-11-20 (operator, fix every red PR, 15:46Z): #19651 adds three caller-less AUTHORITY_TABLE rows
    (hand-ship-push, hand-ship-open-pr, hand-ship-amend-pr), and test/authority-table.test.ts pins every caller-less row,
    so the build must add the three rows to that pin.
    files: amendment 2026-11-20 (operator, approving the recommendation on the #19651 clarification): acceptance-author-gate refused #19651 as canonical-task-scope-exceeded for docs/cli-reference.md, src/lib/authority.ts, src/lib/git-push.ts, src/lib/github-transport.ts, src/lib/worktree-git.ts; each is a change the build needs.
    On a remote host the command runs the same preflight over ssh, in a worktree it brings there as a git bundle. The two scripts do this today.
    Findings from the hand lane on the Mac agent account, added 2026-11-11. The command must keep each of them.
    - One preflight at a time, in a fixed order. Three preflights at once starved the shared test slot: the static phase of each one counts as non-test load for the others. Observed: `wait_bound_exceeded` after 2,700 s with "non-test load 38 leave 0 of 8 usable core(s)".
    - A static step that names its failure is a real failure of the branch. It is not a host fault, and the command does not run the preflight again for it.
    - A branch that already has a pull request is updated. The command does not open a second pull request for it.
    - The body of an amendment pull request needs an `Acceptance:` block. The hand lane's first amendment bodies had none and failed the gate.
    - A launcher that the command starts must add to PATH. It must not replace PATH.
    Restructure 2026-11-21 (#19651 long tail, about 21 review rounds): criteria 3 and 4 were open claims with no threat model, so each round found a new case.
    - Criterion 3 now names a test by file and full title. A change to a test's body does not by itself make the failure "caused by the change".
    - Criterion 4 now names its threat model: the remote tip is the only shared state, and a lease on the tip last read refuses a push when any writer moved it.
