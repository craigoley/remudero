  rationale: |
    WHY: fix admission charges each fix at the fix class's learned p90 (classEstimate("fix")). On 2026-11-19 at
    20:18:37Z the sweep.fix_capacity row showed fix_estimate_mib 5911 against fix_typical_mib 1628 (W1-T13842's
    report, docs/forensics/fix-peak-estimate-drivers.md). At 6 to 9 GiB of headroom that is room for no fix while
    one fix tree is live.
    CAUSE (W1-T13842, OBSERVED): learnedClass (src/lib/host-memory-learning.ts) learns every class from the legacy
    metric: a legacy-hwm sample's own peak and a concurrent-rss sample's paired legacy_p. The legacy metric is the
    sum of each member's lifetime peak (VmHWM), so it counts each member at its own worst moment. On 11-19 the fleet
    wrote 103 legacy-hwm fix samples (p50 4,077, p90 6,629 MiB) and 36 concurrent-rss fix samples, whose concurrent
    RSS p90 was 835 MiB. A legacy-hwm row with no concurrent value is written when the tree's concurrent RSS was not
    observed or was incomplete, and no row says which. readPeakSamples also reads only the last 256 KiB
    (PEAK_TAIL_BYTES) of each store file. state2.ndjson is mostly test-file rows, so the learner saw only about six
    hours of the fleet's fix samples, and the p90 followed whichever heavy legacy samples were newest.
  design: |
    INVARIANT legacy-only-as-fallback: the fix class estimate and typical use legacy-hwm samples only when the read
    population holds no concurrent-rss fix sample, and an estimate learned that way is labelled legacy-hwm-fallback.
    1. learnedClass: for the fix class, learn the estimate and the typical from the concurrent-rss samples' own peaks
       (peakMib) when any exist, and label the estimate basis concurrent-rss. With none, learn from the legacy
       population exactly as today and label it legacy-hwm-fallback. Other classes are unchanged.
    2. The tree sampler keeps the first reason a tree's concurrent peak was not measured (listing-incomplete,
       listing-failed, member-status-unreadable, member-rss-missing, never-observed), finishMeasurement and a nested
       test run's finish return it, and each legacy-hwm row written at release carries it as `why`. parseSamples
       reads it back and compaction keeps it.
    3. readPeakSamples reads the fix class's samples from the whole retained store file (up to PEAK_COMPACT_BYTES,
       the size past which an append compacts the file to the newest samples per class), not its last 256 KiB.
       Compaction keeps samples per class, so test-file rows cannot crowd fix samples out of that read. Test-file
       reads and other classes keep the 256 KiB tail.
    4. sweep.fix_capacity carries fix_estimate_basis from the learned estimate.
    UNCHANGED: the memory floor, the container limit, every existing refusal and rung of the fix admission
    controller, and the typical (median-peak) rung's rule; no new cap.
  falsifier: |
    Put back the legacy-first fix estimate (paired legacy_p for concurrent samples): criterion 1 fails. Drop the
    fallback label: criterion 2 fails. Drop the reason: criterion 3 fails. Read fix samples from the 256 KiB tail:
    criterion 4 fails. Drop the row field: criterion 5 fails.
