  priority: 1.2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the lock keeps one instance from removing an image that another has pulled and not yet started
  band_meaning: span
  origin: operator-session#restart-and-recycle-downtime-2026-11-10
  plan_refs:
    - W1-T12242
    - W1-T2556
    - W1-T11320
    - W1-T12244
  files:
    - deploy/recycle-container.sh
    - deploy/host-recycle-lock.sh
