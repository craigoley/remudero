- id: W1-T10297
  title: "THE SOURCE-MAP HOLDER SIZES EACH PARSED MAP BY ITS OWN BYTES, NOT ONE PER-MODULE AVERAGE — `sourceMapCacheHolder` multiplies the maps parsed by the census's per-module 240,549 B; a bundled main (PR #13218) has ONE linked map, measured at about +145 MiB of heap once parsed, so `daemon.memory` would report ~0.23 MiB for it and under-report by about 145 MiB"
