- id: W1-T4575
  title: "MODEL-PURPOSE TRIAL INTEGRITY — A/A before public effectiveness claims"
  repo: remudero
  depends_on: [W1-T4554, W1-T4560, W1-T4571, W1-T4573]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 75.00
  risk: high
  band_meaning: blast-radius
  origin: "operator 2026-09-26: make Field Trials useful for AI readers with trustworthy model-for-task findings"
  plan_refs: ["W1-T100001", "W1-T4574", "docs/research/model-evidence-program.md"]
  files:
    - src/lib/benchmark-aa.ts
    - src/lib/benchmark-cohort.ts
    - src/run-task.ts
    - test/benchmark-aa.test.ts
    - test/benchmark-aa-wiring.test.ts
    - docs/research/model-evidence-program.md
  status: merged
  rationale: |
    The public site can explain current routing judgment and audit external benchmark claims,
    but cannot yet say which model is more effective for a task. The live Sol/Sonnet arm is
    headroom-selected, and historical receipts have missing served-model and verified-outcome
    joins. W1-T4574's observational flow aggregates must not be promoted into causal model
    rankings. The research program calls for A/A before A/B, but no executable task owns that
    integrity trial. This task closes that gap without gating routine PRs or starting the
    approved, separately budgeted paid pilot.
  design: |
    Add an operator-invoked A/A report over a public-fixture or explicitly opted-in cohort.
    Assign the same pinned model, effort, prompt, tools, harness and scorer under two random
    labels at the task unit, with immutable assignment and allocation receipts. Retain
    non-starters and retry attempts in the original arm; record fallbacks and crossovers rather
    than hiding them. Reconcile the three-form ledger union and benchmark cohorts, including
    source scan warnings, late data, duplicate rows, and versioned task-class/risk strata.

    Report sample-ratio mismatch, assignment-to-terminal-to-verified-outcome joins, per-arm
    served-model and resource-field missingness, outcome maturity/censoring, and the observed
    difference with uncertainty. An A/A report must not declare a model winner; it should reveal
    whether the pipeline would have generated a false difference, selection imbalance, or a
    cash-versus-subscription accounting artifact. Keep API cash estimates, subscription notional
    cost, and actual invoices distinct. Require enough observed evidence for a public claim via
    a reviewed release decision, not a hard ceiling or floor in worker dispatch.

    Produce a versioned, privacy-safe integrity receipt that a later two-arm model-by-task pilot
    can cite. It may recommend follow-up tasks for weak joins, biased allocation, unsupported
    stack revisions, or consent gaps. It must not change routing, block dispatch/review/merge,
    publish private rows, or spend on a paid arm. A refresh failure retains the last known
    dated report and marks it stale; it never converts unavailable into a measured zero.
  acceptance:
    - claim: "task-level A/A allocation is stable across retries and both labels use the same pinned working stack"
      proof: "unit test: benchmark aa assigns stable task labels to one pinned stack"
    - claim: "the report shows sample-ratio mismatch, missing joins, duplicate evidence, and immature outcomes by arm"
      proof: "unit test: benchmark aa exposes imbalance and missingness without a winner"
    - claim: "cash, notional, and unknown accounting stay separate in the integrity report"
      proof: "unit test: benchmark aa keeps cash notional and unknown separate"
    - claim: "late evidence repairs the affected report and an unreadable source cannot produce a healthy empty trial"
      proof: "unit test: benchmark aa replays late evidence and preserves stale state"
    - claim: "a real operator command reaches the A/A builder without a PR or routing gate"
      proof: "grep: buildBenchmarkAaReport( in src/run-task.ts"
  falsifier: |
    A live headroom-selected Sol/Sonnet comparison is relabeled randomized; both A/A labels
    differ in model or harness; retries are new independent allocations; a missing terminal is
    scored as failure; a subscription receipt is called zero-cost; a failed projection blocks
    a healthy PR; or an A/A fluctuation becomes a public model recommendation.
