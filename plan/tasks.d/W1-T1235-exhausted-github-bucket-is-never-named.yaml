  note: |
    **`risk: high` IS SET UP FRONT** — Rule 19 SPAN across `src/` and `test/`, and the blast radius
    is real: `src/lib/worker.ts`'s `ghJson` is the shared read path, so a wrong change there
    misreads every rate-limit response at once.

    **NOT W1-T511, AND THE CHECK IS RECORDED.** W1-T511
    (`rate-limit-discards-review-attempts`, `status: queued`, **a live `run-W1-T511-*` branch exists
    as of this filing**) substitutes ONE GraphQL caller — `ghLiveState`'s `gh pr view --json state`
    — with a REST form. Measured against its shard: `ghLiveState` 4, `readLiveState` 2, `pr view` 5,
    `liveStateFromRest` 1 (its subject, positive control) against `automerge` 0, `arm` 0, `--auto`
    0, `disablePullRequestAutoMerge` 0, `rmd status` 0, `HEADROOM` 0. It removes a caller from the
    exhausted bucket; it does not name the bucket, does not touch the arm, and cannot help the arm,
    which has no REST form to move to. Different remedy, disjoint surface, so this is filed rather
    than folded.

    **DECLARED OVERLAP, DISCLOSED NOT HIDDEN.** `src/run-task.ts` is in W1-T511's `files:` too, so
    `overlappingPaths` will serialise these two behind one another. That is correct — both edit the
    same file — and is stated here so the ordering is a known cost rather than a surprise at
    dispatch. The status line cannot avoid `run-task.ts`.

    **ID PROVENANCE.** `refs/rmd-id/W1-T1235` was reserved at 2026-08-23T03:22:30Z (frontier: 1233
    and 1234 reserved, 1236 free), and eight id surfaces were swept clear before filing, each with a
    control qualified for that surface — including a count-per-head sweep over 130 live heads where
    this id read 0 while the control W1-T1219 read 4.
