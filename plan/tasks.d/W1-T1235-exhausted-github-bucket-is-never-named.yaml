      proof: "unit test: test/rate-limit-bucket-surface.test.ts"
    - claim: "a refusal carrying no readable reset is recorded as unknown rather than given an invented wait"
      proof: "unit test: test/rate-limit-bucket-surface.test.ts"
    - claim: "rmd status reports the GitHub buckets alongside the model headroom section rather than only the model window"
      proof: "unit test: test/rate-limit-bucket-surface.test.ts"
    - claim: "an auto-merge arm refused on the exhausted budget names that budget instead of failing silently"
      proof: "unit test: test/rate-limit-bucket-surface.test.ts"
    - claim: "a call that was never rate limited records no such row, so the row marks real refusals only"
      proof: "unit test: test/rate-limit-bucket-surface.test.ts"
