    NO PROOF IN THIS SHARD GREPS ITS OWN PATH.

    `risk: high` IS RULE 19'S SPAN AND A BLAST-RADIUS STATEMENT. `files:` names three stems across
    two modules the whole console reads through. The band is honest for a second reason: design
    (iv)'s three invariants are all things a careless terminal-row shortcut breaks silently — an
    OPEN row frozen at a stale check state looks exactly like a working board.

