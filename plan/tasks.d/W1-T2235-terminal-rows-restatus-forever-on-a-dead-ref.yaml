    - claim: "a failed status read on an open row is still reported as unreadable rather than as none"
      proof: "unit test: test/board-terminal-review-state.test.ts"
    - claim: "the number of per-row status calls for a board of terminal rows is zero"
      proof: "unit test: test/board-terminal-review-state.test.ts"
