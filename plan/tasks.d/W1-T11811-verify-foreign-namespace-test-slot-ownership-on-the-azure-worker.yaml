- id: W1-T11811
  title: "Verify the foreign-namespace test-slot owner contract on the real Azure/Linux worker — a sandboxed owner in its own PID namespace inside a dedicated scope is held while live and silent, freed only after its tree ends naturally, and kept UNKNOWN with an actionable aged diagnostic when its cgroup namespace or identity cannot be observed; recorded as kernel-level evidence, on a private slot dir, with no kill and no live slot touched"
  repo: remudero
  depends_on: [W1-T11807, W1-T11808, W1-T11809, W1-T11810]
  type: recon
  verify: auto
  budget_usd: 6.00
  risk: medium  # runs real processes on the shared host; bounded to a private slot dir and natural process exit
  band_meaning: blast-radius
  origin: architect
  plan_refs: [W1-T11807, W1-T11808, W1-T11809, W1-T11810, W1-T10433]
  files:
    - docs/forensics/foreign-namespace-test-slot-owner-native-verification.md
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    Unit seams cannot prove three kernel facts the W1-T11807/W1-T11809 contract rests on: (a) that a sandboxed owner
    in its own PID namespace on this host shares the host's cgroup namespace, so its recorded cgroup path resolves
    from a host-namespace waiter; (b) that the cgroup directory's dev/ino is not reused on this kernel within a boot
    after the directory is removed and a new one is made at the same path (the generation W1-T11807 pins); (c) that
    `cgroup.events` reads `populated 0` for that scope only after every descendant, including a detached one, exits.
    docs/heavy-new-build-reservation.md records an earlier "cheap real-kernel rehearsal on existing Azure
    user-manager capacity", so the host has a user manager able to start a scope; this task does not create units
    beyond a transient `systemd-run --user --scope` for the fixture owner.
    Settled by lookup: is native verification of this contract already filed? -> no. W1-T10433 is a default-off
    receipt specification with "No native run ... is authorized by this task"; W1-T10251/W1-T10870 were unit-only.
    Settled by lookup: where does the evidence go? -> docs/forensics/, beside author-preflight-tests-fail-in-the-retro-container.md.
  design: |
    All runs use a private `RMD_TEST_SLOT_DIR` under a fresh scratch dir, never /mnt/scratch/rmd/test-slots, and
    the scratch dir is removed after evidence is written. No process is signalled: every fixture owner and descendant
    ends by its own bounded `sleep`. Record kernel version, cgroup mount, and each command with its output.
    1. FOREIGN PID NAMESPACE, SAME CGROUP NAMESPACE. Inside `systemd-run --user --scope`, start an owner under the
       same PID-namespace isolation the fleet's sandboxed workers use (read it from src/lib/worker-provider.ts; name
       it), take a slot, detach a descendant, and stop the heartbeat. From the host namespace: a waiter logs `live`
       (populated 1) and does not acquire; after the tree exits naturally it reclaims with coverage
       `cgroup-identity`, and the next queued waiter acquires in FIFO order.
    2. NAMESPACE MISMATCH. Repeat with a private cgroup namespace (or a container): the waiter keeps UNKNOWN, logs
       one `test_slot.owner_aged` with missingEvidence "cgroup namespace differs" and a recovery line; `rmd doctor`
       WARNs `test-slot-holds`; running the W1-T11808 command from inside the owner namespace after natural exit
       releases it.
    3. GENERATION. Create, remove and recreate a cgroup at one path and record both dev/ino pairs; if they match, say
       so and mark W1-T11807's identity UNSAFE on this kernel.
    Any step the host cannot run is recorded NOT_RUN with its reason, never inferred.
  acceptance:
    - claim: "the report records the live-silent, naturally-ended and FIFO-continuity runs across a PID-namespace boundary"
      proof: "grep: Foreign PID namespace verification in docs/forensics/foreign-namespace-test-slot-owner-native-verification.md"
    - claim: "the report records the namespace-mismatch UNKNOWN, its aged diagnostic, doctor surfacing and owner-lane release"
      proof: "grep: Namespace mismatch and owner-lane recovery in docs/forensics/foreign-namespace-test-slot-owner-native-verification.md"
    - claim: "the report records whether the cgroup dev/ino generation is reused on this kernel"
      proof: "grep: Cgroup generation reuse in docs/forensics/foreign-namespace-test-slot-owner-native-verification.md"
  falsifier: |
    If step 1's host waiter cannot resolve the owner's recorded cgroup, or step 3 shows a reused dev/ino, W1-T11807's
    cross-namespace basis is unsound on this host and must be reverted to UNKNOWN-only. If any waiter acquires while
    `populated 1`, the contract is broken.
