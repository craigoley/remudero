  rationale: |
    OBSERVED 2026-11-05 building W1-T11428: census-precheck refused test/review/compress-src-lib-review-ts.test.ts because its UNCONDITIONAL assertions commentBytes < 319723 and commentLines < 3222 fail when a later feature adds doc comments to src/lib/review.ts. The test's own note says the captured numbers "are comparison evidence for this edit, not a new comment-volume ceiling", and #16082 already made its token/AST digest comparison apply only on the PR that adds the pin; the two absolute comparisons stayed unconditional.
    Measured at origin/main on 2026-11-05: 19 compression pins carry such absolute comparisons. Headroom left: src/lib/review.ts 68 bytes / 27 lines; risk-judge.ts 2022 bytes / 21 lines; host-memory-shadow.ts 2885 / 19; verdict-calibration.ts 3057 / 34; panel-graph.ts 2403 / 25; the rest 3.8k-15k bytes. W1-T11428 had to trim its own doc comments to a net +55 bytes to fit.
  design: |
    The operator rules at review which rule the pins follow; the builder applies the ruling. The options as filed, not pre-decided:
    (a) The absolute commentBytes/commentLines comparisons apply only on the PR that adds the pin (inside compressionPinBase's "pin added on this PR" branch, as #16082 did for the digests), so later feature edits to a compressed module are free.
    (b) The comparisons stay as a standing ratchet on comment volume, but measured against the module's merge-base rather than a frozen pre-compression capture, so growth is visible per PR instead of a fixed number.
    (c) Another rule the operator names.
    The new census is a CI rule suite, so compression-pins-follow-one-comment-volume-rule.test.ts gets a PRECHECK_PARITY row in scripts/census-precheck.mjs.
    Whichever is ruled: one shared helper in test/helpers/compression-pin.ts carries it, every listed pin uses it, and the census in test/rules/ refuses a compression pin that carries its own absolute comment-volume literal. Fixed thresholds are not introduced.
  falsifier: |
    At origin/main, a feature PR that adds doc comments to src/lib/review.ts fails census-precheck on a pin that was written to compare one compression edit, so the pin acts as a permanent comment ceiling.
