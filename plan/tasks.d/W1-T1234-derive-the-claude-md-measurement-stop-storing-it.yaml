  plan_refs: ["W1-T1231", "W1-T1227", "W1-T297", "W1-T503"]
  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All six criteria use the pure-path `unit test:` form
    naming `test/claude-md-budget-ratchet.test.ts`, which is declared in `files:` and already
    exists, so each resolves against a real file rather than a forward reference.

    THE GATE IS PROVED BOTH WAYS ON PURPOSE. Criterion 1 is the blocking half and criterion 2 is
    the passing half, and the second is not decoration: a blocking assertion alone passes just as
    well against a gate that refuses everything, which is how a ratchet dies without anyone
    noticing. The two together are what make either mean anything, and rationale (5) already drove
    both against the live CLI before this shard was written.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND IT WAS SET BY THE LINTER RATHER THAN BY
    TASTE. Filed at `medium`, `rmd lint-plan` refused it: "[sizing] spans 2 distinct
    subsystems/concerns (claude-md-budget-baseline, claude-md-budget-ratchet) at risk:medium —
    Rule 19: raise to risk:high or decompose". Decomposing is the wrong answer here: removing the
    field without re-pointing its test files a PR that is red by construction, and re-pointing the
    test without removing the field asserts on a figure that is still there. So the band is raised
    and the reason recorded. THE BLAST RADIUS IS GENUINELY NARROW: two files, no `src/` path, no
    workflow, no required-check name. The change REMOVES a refusal rather than adding one, which is
    the direction that deserves care — so criterion 3 pins the removal (the field is gone) and
    criterion 4 pins that its ghost cannot come back (a planted figure changes no verdict), while
    criteria 1, 2, 5 and 6 hold the ceiling itself exactly where it is.

    W1-T1231 (#2555) IS SUPERSEDED, NOT WRONG, AND THE DISTINCTION IS LOAD-BEARING. Its rationale
    established that the invariant is live, that the script never reads the field, and what it cost
    on 2026-08-23; all of that is re-derived here rather than cited on faith. What changed is the
    remedy, by operator ruling, and its criteria are the reason a new id was minted: they were
    written for "move the equality into `evaluateRatchet`" and a worker may never edit acceptance
    criteria to match a new design.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN.
    `refs/rmd-id/W1-T1234` resolves on origin against a namespace of 264 such refs; a reservation
    existing is not evidence a shard does. EIGHT ID SURFACES WERE SWEPT, and TWO CONTROLS WERE
    RE-QUALIFIED RATHER THAN TRUSTED. First: W1-T1231 and W1-T1227 both sit in OPEN PRs (#2555,
    #2550), so neither can control a main-tree surface — the shard-filename and `- id:` surfaces
    were re-controlled on W1-T1222 and W1-T1213, which read 1 each. Second: the merged-trailer
    surface's usual control, `Remudero-Task: W1-T1085`, reads 0 at this head and W1-T1085 appears
    nowhere on main, so it was replaced by `Remudero-Task: RETRO-1787419805720`, which reads 1
    against 27 trailer-carrying commits on main. The eight results: shard filenames 0; plan `- id:`
    lines 0; the reservation 1, which is the pre-mint; open PR titles 0 against W1-T1231 at 1; open
    PR head branches 0 against `run-W1-T` heads at 2; open PR file lists 0 with coverage at eight
    captured of eight enumerated, against `plan/tasks.d/` paths at 5 across the same heads; merged
    trailers 0; and merged subject credit 0 against W1-T1213 at 1, with `run-W1-T1234-*` at 0
    against a namespace of 83 `run-*` branches.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE, NOT A PRESENCE TEST. Four
    markers were counted at every one of the eight open PR heads and at main: `measuredBytes` in
    the baseline, in the ratchet script, and in the ratchet's test, plus `violations.push` in the
    script. Main reads 2 / 0 / 4 / 1 and EVERY head reads exactly 2 / 0 / 4 / 1 — no head moves any
    marker. The script's own `measuredBytes` count of 0 is the fact this task rests on, identically
    absent everywhere, and the three non-zero markers are the control that the reader worked.
