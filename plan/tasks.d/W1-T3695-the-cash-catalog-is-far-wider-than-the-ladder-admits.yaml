  note: |
    MEASURED 2026-09-16 against the live synthwatch-foundry account.

    W1-T3598 RULED THE WIDER CATALOG OUT ON A PREMISE THAT IS NO LONGER TRUE. Its note says the
    cheapest candidate "sits behind the Azure AI Model Inference `/models` route instead and would
    need an endpoint branch, which is why it is NOT this task". Both halves were re-probed:

      POST {endpoint}/models/chat/completions                      -> HTTP 200
      POST {endpoint}/openai/deployments/DeepSeek-V4-Flash/...     -> HTTP 200

    A NON-OPENAI DEPLOYMENT ANSWERS THE ADAPTER'S OWN ROUTE. `openWeightEndpoint`'s
    `openai/deployments/{model}/chat/completions` path serves a DeepSeek deployment unchanged, and
    the adapter already sends `model` in the body, so no second endpoint shape is required. The
    endpoint branch W1-T3598 deferred is not needed for this class at all.

    AND IT DRIVES THE TOOL LOOP, which is the capability that actually gates a cash lane:

      finish_reason: tool_calls
      tool_calls: [{"function":{"name":"Read","arguments":"{\"path\": \"src/index.ts\"}"}}]
      temperature: 0        -> HTTP 200 (accepted, unlike the gpt-5 family, which 400s)
      response_format json  -> HTTP 200, clean {"ok":true,"n":7}
      plain "Reply exactly: DSOK" -> 9 prompt / 3 completion tokens

    THE THREE COMPLETION TOKENS MATTER. gpt-5-mini spends 64 of 76 completion tokens on hidden
    reasoning for a six-token answer; this deployment spends none. On a short-prompt lane that is
    the whole cost argument (W1-T3614 solved the crossover at roughly INPUT > 15x OUTPUT).

    THE CATALOG, CORRECTED. `az cognitiveservices account list-models` is a CATALOG, not a
    deployability list -- DeepSeek-V3.1 is listed and refuses to deploy ("deprecated since
    07/13/2026"). Filtering on the deprecation field instead:

      Llama 3.1            NOT offered (Llama-3.3-70B-Instruct is the oldest Llama present)
      Llama 4              Llama-4-Scout-17B-16E-Instruct AND Llama-4-Maverick-17B-128E: deployable
      DeepSeek V3          V3-0324 and V3.1 DEPRECATED; V3.2 and V3.2-Speciale deployable
      DeepSeek V4          V4-Flash, V4-Flash-0731 and V4-Pro deployable
      Phi-4                Phi-4, -mini-instruct, -mini-reasoning, -reasoning all deployable
      also OpenAI-format   o3-mini, o4-mini, codex-mini, gpt-5.1-codex-mini

    QUOTA IS A DIFFERENT UNIT HERE. These deployments meter REQUESTS PER MINUTE, not TPM: the
    account's DeepSeek-V4-Flash quota is 20 RPM, and a 200-capacity request is refused outright.
    A ladder row that assumes the gpt family's TPM sizing will mis-size these.
  rationale: |
    THE BLOCKER IS PRICE, AND IT IS A HARD ONE. `OPENWEIGHT_PRICES` is load-bearing for
    `dailyCapUsd`: the table's own comment records that a DEARER deployment priced low
    UNDER-reserves and "re-opens exactly the hole reserveOpenWeightBudget exists to close". No
    published rate for DeepSeek-V4-Flash could be confirmed -- it is absent from the Azure OpenAI
    pricing page, absent from the retail prices API, and carries no `cost` in the model catalog.

    WORSE, ITS BILLING IS PUBLICLY DISPUTED. Two Microsoft Q&A threads report DeepSeek V4 charges
    far above the published rate -- one titled "Charged at ~357x Published Rate" for cached tokens,
    another reporting 4.5x on V4 Pro. Wiring a deployment whose real billing is contested at those
    multiples is precisely the under-reservation the cap exists to prevent, so this is NOT a
    "look up the number later" task: the number must be OBSERVED FROM A BILL before any row lands.

    AND NONE OF THIS RELIEVES A BUILD BACKLOG. W1-T3692 measured the standing limit: cash has no
    Bash, `alert_fix` is `{ claude: FIX_WORKER_TOOLS }` with no openweight row, so every cash
    deployment -- however cheap or capable -- serves only recon, diagnose and retro. Widening the
    catalog widens THOSE lanes. It does not move task-building off the subscription.
  design: |
    Order matters, and the first step is not code.

    (1) OBSERVE THE RATE FROM A BILL, not a page. Run a bounded, deliberately small volume through
        one deployment, then read Cost Management for the actual metered amount per token class
        (including any cached-input class, which is where the 357x report lands). Record the
        figures and the DATE READ, as every other row in OPENWEIGHT_PRICES does.
    (2) Only then add PRICES / CONTEXT_WINDOWS / TEMPERATURE rows, exactly as gpt-5-mini did. The
        temperature row is `0` here, not `null` -- this family accepts it.
    (3) Size the ladder row from RPM, not TPM.
    (4) Leave W1-T3598's gpt-oss-vs-nano ordering untouched: this adds a candidate, it does not
        re-litigate a measured ordering.

    DO NOT add a `/models` endpoint branch on the strength of this record -- the measurement above
    says the existing route already serves this class, so a branch would be code with no caller.
  acceptance:
    - claim: "a non-OpenAI cash deployment is reachable on the adapter's existing route, so no endpoint branch is needed for this class"
      proof: "grep: rides the adapter's existing route in src/lib/worker-provider.ts"
  # WITHDRAWN AS A CRITERION, KEPT AS A TEST. "a deployment whose price has not been observed from
  # a bill is refused before transport rather than priced by a neighbour" was a criterion here,
  # proven by `unit test: every deployment named in the cash ladder is priced, shaped and bounded`.
  # proof-discrimination refused it as `executed_stale` on #5864, and that PR's own body says why
  # it had to: "all 4 cases green BEFORE AND AFTER this diff ... deliberately unchanged behaviour,
  # not new code". OPENWEIGHT_PRICES' fail-closed lookup already refuses an unpriced deployment,
  # and #5864 deliberately does NOT add a price row -- the rate must be observed from a bill. A
  # proof that holds on both trees by the author's own account cannot be evidence of the diff.
  # The test stays green. See W1-T3721, which refuses this shape at author time.
  falsifier: |
    Close without implementing if the observed bill shows this class is dearer than gpt-5-mini per
    accepted task, or if the RPM ceiling makes it unusable for a real lane. Cheapness on a page is
    not the claim; cheapness on a bill is.
