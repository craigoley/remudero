  note: |
    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. The declared files cross a document, the commit
    writer and the PR emitter, which fails sizing at a lower band. The change is additive and
    reversible; the band records the span. Splitting the document from the two writers was
    considered and rejected: a scope extension with no wired surface is the unconsumed-declaration
    shape this repo keeps re-filing, and the two writers share one contract.

    THE STANDARD IS EXTENDED, NOT REWRITTEN. Its principles, its prohibition on scores, its
    delivery-first failure direction and its existing exclusions carry over unchanged.

    WHAT WAS MEASURED. On this tree commit-message.ts and plan-pr-emitter.ts cite the standard zero
    times, and checkOperatorMessage has exactly one consumer. Both figures are from the working tree.
