- id: W1-T3849
  title: "commitWorkerEdits STRANDS A DECLARED NESTED NEW FILE UNCOMMITTED — `git status --porcelain -z` with git's default untracked mode reports a brand-new directory as ONE untracked entry (the directory path itself), never the files inside it, so `workerChangedPaths`/`pathIsUnderDeclaredSurface` classify a task-declared new file beneath a new directory as outside its own declared surface, `commitWorkerEdits` leaves it uncommitted, and the shell-less worker's PR ships red"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 10.00
  files: [src/run-task.ts, test/commit-worker-edits-new-directory.test.ts]
  origin: feedback#fb-1789922608262-d7142f
  plan_refs: ["W1-T3696"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED (feedback fb-1789922608262-d7142f, live console T8): a shell-less worker created
    two task-declared new files beneath directories that did not exist before the round. `git
    status --porcelain -z` with git's DEFAULT untracked mode (`--untracked-files=normal`,
    equivalent to omitting `-u`/`--untracked-files`) reports a wholly-new directory as ONE
    entry — the directory path with a trailing slash — never the individual files it contains.
    `workerChangedPaths` (src/run-task.ts) turns that raw porcelain output into a path list
    verbatim, so a declared nested new file such as `src/lib/foo/bar.ts` never appears in
    `changed`; only `src/lib/foo/` does. `pathIsUnderDeclaredSurface("src/lib/foo/",
    ["src/lib/foo/bar.ts"])` returns false (the directory does not equal, nor start with, the
    declared FILE path plus `/`), so the directory entry lands in `undeclared` and
    `commitWorkerEdits` never stages it. The declared file is silently never committed; the
    task's own PR ships without the change CI expects, reproducing the red PR and the recovery
    commit the feedback describes.
  design: |
    Read the porcelain status with `--untracked-files=all` (or an equivalent all-files mode)
    instead of the current default, so newly-created directories are always expanded into their
    individual untracked file paths before `workerChangedPaths`/`pathIsUnderDeclaredSurface`
    classify anything. This is strictly additive to what the status call reports — it never
    changes what "declared" or "under declared surface" MEANS, only ensures the classifier is
    handed real file paths instead of a directory it cannot match against a declared file. The
    existing exact-membership/directory-prefix rule in `pathIsUnderDeclaredSurface` is untouched:
    a declared nested new file, once seen as a real path, already matches it correctly. An
    unrelated new file nested in the SAME or a different new, undeclared directory must still be
    reported in `undeclared` and left uncommitted — the fix widens ENUMERATION only, never the
    declared-path security boundary itself.
  acceptance:
    - claim: "a task-declared new file inside a brand-new (previously nonexistent) directory is committed by commitWorkerEdits"
      proof: "unit test: test/commit-worker-edits-new-directory.test.ts"
    - claim: "an unrelated new file nested in an undeclared new directory remains uncommitted and reported in undeclared"
      proof: "unit test: test/commit-worker-edits-new-directory.test.ts"
    - claim: "the status read now enumerates untracked files individually rather than collapsing a new directory to one entry"
      proof: "grep: untracked-files=all in src/run-task.ts"
  falsifier: |
    In a throwaway repo, declare files `["a/one.ts", "a/two.ts"]` where `a/` does not exist yet
    on the tracked tree; create BOTH `a/one.ts` (declared) and `a/three.ts` (undeclared, same new
    directory). Before the fix, `git status --porcelain -z` reports only `a/` and both files are
    classified `undeclared` — `commitWorkerEdits` commits neither. After the fix, `a/one.ts` is
    committed and `a/three.ts` remains uncommitted and listed in `undeclared`.
  note: |
    Scoped strictly to the enumeration bug the feedback measured. The named test file does not
    exist at filing time and is this task's own falsifier, so its matching shard slug records the
    single commitWorkerEdits enumeration concern rather than widening the task. Nothing here changes the
    declared-path security boundary `pathIsUnderDeclaredSurface` already enforces, and nothing
    here touches the plan-only/exact-membership split `scopeGuardOutOfScopeFiles` uses elsewhere
    in src/run-task.ts.
