  falsifier: Remove one readiness distinction or exact identity check and prove its corresponding behavioral test fails with the same fixture, then passes when restored. In success and failure cases assert zero provider mutation calls and byte-identical canonical product and operation-journal files. Test the real default transport and each catch arm, with a verified physical file list and nonzero test summaries. Fixtures are not live repository, deployment or gameplay receipts.
