- id: W1-T6022
  title: "A READY PR IS REFRESHED WHEN MAIN CHANGED ITS FILES SINCE ITS CI RAN — W1-T5696's distance-overlap arm only fires past the 10-commit distance gate, but a PR merges a median 3 (p90 10) main commits after the base its CI tested; 219 of 1,338 merges in 7 days (16.4%) landed on a main that had changed one of the PR's own files after its CI started, and three of the week's four code-path semantic-conflict reds were that shape"
  repo: remudero
  depends_on: [W1-T5696]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — which ready PRs the sweep refreshes before they merge; it writes contributor branches unattended
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: main red 11:35-13:37 (#9539 vs #9542); merge queue vs strict vs daemon guard research"
  plan_refs: [W1-T5696, W1-T3277, W1-T5903, W1-T5921, W1-T5939, W1-T1014, W1-T5940]
  files: [src/lib/sweep.ts, test/a-ready-pr-is-refreshed-when-main-changed-its-files-since-its-ci-ran.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    MEASURED 2026-10-06 over 2026-09-29T13:46Z..2026-10-06T13:46Z (GitHub: 1,342 merged PRs, 4,095 ci.yml
    runs, per-PR changed files). PR CI wall time p50 21.4 / p90 28.3 min. 93% of merges land within 21.4 min
    of the previous merge; at merge time a PR is a median 3 (p90 10, max 37) main commits past the base
    its last successful `ci` run started on. For 219 merges (16.4%, ~31/day) one of those later commits
    changed a file the PR also changed (95 of them only src/run-task.ts). Code-path semantic conflicts
    that turned main red this week: #9213/#9219 (src/run-task.ts, 27 min apart), #9376/#9365 and
    #9376/#9381 (read-model-worker.ts and shared tests, 18-19 min apart) — all three share a path;
    #9542/#9539 (30 s apart, 11:35Z 10-06) shares NO path: #9539's test reads
    test/fixtures/golden-verdicts/ and #9542 rewrote test/fixtures/golden-verdicts/knowledge-retire/*.
    `openPrsBehindMain` (src/lib/sweep.ts) already computes W1-T5696's `distanceRefreshCause`
    (distance-overlap / distance-baseline), but only after `behindBy > reviewWaitingBranchRefreshThreshold`
    (10), so a ready PR 1-10 behind with an overlapping main change merges untested. Strict protection is
    declined (W1-T1014 closure: one merge per CI cycle = ~2.8/h vs 8/h mean demand) and the merge queue is
    off pending a real-GitHub proof and W1-T5940.
  design: |
    In `openPrsBehindMain`, a PR that is ready to merge (auto-merge armed, or checks green with review
    success) and at least 1 commit behind takes `distanceRefreshCause`'s overlap and baseline arms
    WITHOUT the distance threshold, with update reason `ready-overlap`. The overlap set is extended by
    one reach rule: a test file the PR changes whose source contains a repository path literal that
    prefixes a main-changed path counts as overlapping (the #9539/#9542 shape). A truncated or unread
    base file list is `ready-unknown`: named in the row, not refreshed (today's behaviour), never read
    as "no overlap". The refresh spends W1-T5921's one update per (PR, head), stands down under the
    W1-T5939 incident hold and under W1-T5903's merge-queue skip, and the distance arms above the
    threshold are unchanged.
  acceptance:
    - claim: "a ready PR 2 commits behind whose own file main changed is selected with reason ready-overlap; one whose changed test names a path prefix main changed is selected; one with no overlap is not; a truncated base list is ready-unknown and not selected; a PR under a merge-queue base or an incident hold is not selected"
      proof: "unit test: test/a-ready-pr-is-refreshed-when-main-changed-its-files-since-its-ci-ran.test.ts"
  falsifier: |
    Keep the 10-commit gate in front of the overlap arm: the 2-behind overlapping PR is not selected
    and the test fails.
