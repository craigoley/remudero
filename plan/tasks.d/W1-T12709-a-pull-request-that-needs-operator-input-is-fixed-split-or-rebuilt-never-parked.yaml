  design: |
    INVARIANT never-close-healthy-work: a pull request with nothing unmet and nothing red is never closed.
    RULINGS (session lead for the operator, 2026-11-14), which settle the steps below where they differ:
    R1. A criterion needs operator input ONLY when W1-T12714's needs-design classifier sorts it as a real design or
        input question. Every other unmet criterion is fixable. Hence depends_on W1-T12714 and W1-T12710.
    R2. With no unmet criteria and no red checks, the remedy is fix-on-pr: re-run the stalled stage or review on the
        pull request itself. close-and-rebuild is allowed only when a needs-input criterion has already failed through
        W1-T12710's remedies.
    R3. Held tasks and acceptance amendments land through landTaskFilesAsync (src/lib/feedback-landing.ts), as the
        sweep's draftRefusalAmendments does, with ids from reservePlanRepairTaskId (src/lib/sweep.ts). This replaces
        the landFeedback route in step 5.
    R4. fix-on-pr releases the fix lane's open-escalation stand-down in src/cli/commands/fix.ts for the pull request and
        head the parked_pr.remedy row names, and for no other.
    R5. W1-T12710's stall ladder (STALL_REMEDIES and nextStallRemedy in src/lib/fix-progress-judge.ts, takeStallRemedy in
        src/lib/sweep.ts) ends with operator-input: one escalation, then no round for that criterion until an answer.
        That parks the pull request. W1-T12709 replaces that last step, and the "every remedy was tried" hold after it:
        the criterion becomes a split-follow-up (a held task with a W1-T12715 needs_input question, plus the acceptance
        amendment that moves the criterion out), and the pull request goes on to merge on the rest. The split is
        impossible only when the criterion cannot leave the task (it is a red check, not a criterion, or it is the
        task's only criterion); then the remedy is close-and-rebuild.
    INVARIANT no-parked-pr: an open pull request is never left with "a person must answer" as its only next action. Each
    pass gives it one of three remedies.
    INVARIANT one-question: one held task per pull request and cause.
    1. New pure module src/lib/parked-pr-remedy.ts: `parkedPrRemedy(facts)` where facts are the unmet criteria (each with
       the reason it is unmet and whether it needs operator input), the red checks, and whether the pull request is a plan
       filing. It returns, in this order:
       a. `fix-on-pr`: at least one unmet criterion or red check that a fix round, a scope amendment (W1-T12543's path) or
          an acceptance amendment can act on. The sweep dispatches that remedy.
       b. `split-follow-up`: the criteria that need input are a strict subset. File one follow-up task (the criteria
          verbatim, a needs_input question from W1-T12715, source_pr), and open an acceptance amendment of the pull
          request's task that moves those criteria to the follow-up. The pull request then merges on the rest.
       c. `close-and-rebuild`: nothing can merge without the input. Close the pull request with a comment that links the
          rebuild task. File the rebuild task with needs_input naming the exact input, the pull request's findings in its
          rationale, and the same files and criteria.
       It never returns "wait".
    2. src/lib/sweep.ts and src/lib/escalate.ts: where openEscalationStandDownReason or the held stand-down at :22571 would
       set refused-escalate for an open pull request, call parkedPrRemedy and act on it. Write one `parked_pr.remedy` row
       (pr, head, cause, remedy, held task id if any). Declare the step in src/lib/ledger-steps.ts.
    3. The W1-T78 rung does not open a needs-human issue for an open pull request. The question goes into the held task's
       needs_input, which W1-T12715 shows in the inbox. Host, deploy, feedback and plan-clarify escalations are unchanged.
    4. Plan-only filings take the same path, so plan-proof-unrunnable no longer holds them.
    5. The held task is filed through landFeedback (src/lib/feedback-landing.ts:1481) with an id reserved the usual way.
       A later pass finds it by (pr, cause) in parked_pr.remedy rows and does not file another.
    NOT IN SCOPE: closing old needs-human issues (a separate sweep can close those whose pull request merged); the dispatch
    hold itself (W1-T12715).
  falsifier: |
    Keep the stand-down and criteria 1 and 4 must fail. File the follow-up without the amendment and criterion 2 must fail.
    Close without filing the rebuild and criterion 3 must fail. File a second held task on the next pass and criterion 5
    must fail. Let the W1-T78 rung open its issue and criterion 6 must fail. Skip plan filings and criterion 7 must fail.
    Close a pull request with nothing unmet and criterion 9 must fail. Keep the fix lane's stand-down after a fix-on-pr
    remedy and criterion 10 must fail. Let the stall ladder's operator-input step escalate and hold and criterion 11 must
    fail. Restore and all must pass.
