  rationale: |
    MEASURED on origin/main bbab8894f, 2026-10-13. src/run-task.ts is 57,478 lines. Of 329 open tasks (no
    `Remudero-Task:` trailer on main, and a shard status that is not merged, retired, done or blocked), 105 declare it
    in `files:`, including 24 of the 48 dependency-met auto tasks at priority <= 1.5. It was touched by 713 of 4,523
    main commits in 30 days. The refill pool never overlaps a running lane's files (W1-T8502), so one build holding it
    serializes every other run-task.ts task. The diagnosis saw it held from 20:12Z to 22:00Z on 2026-10-13.
    CHURN, from `git log --since=30.days -p --unified=0 -- src/run-task.ts`, attributing each hunk to its enclosing
    top-level declaration: runReview and reviewCommand were changed by 55 of those 713 commits (33 and 22), with 647 changed lines. The split takes verbs in that churn order:
    W1-T9332 (run-task), W1-T9333 (daemon), W1-T9337 (fix), W1-T9338 (sweep) and W1-T9339 (review). This step moves runReview (about 960 lines) and reviewCommand (about 530).
    THE SEAM. W1-T2893 made `main()` dispatch through src/cli/registry.ts, but left every handler body in
    run-task.ts. A moved handler still reaches many run-task.ts helpers. W1-T9331 forbids importing them (a cycle with
    HANDLERS). So this step passes them in through one host parameter, the repo's existing `*Deps` pattern, instead of
    moving the whole reachable graph at once.
    NOT IN SCOPE: re-pointing open shards that declare src/run-task.ts for this verb. A shard edit cannot ride a code
    PR (rule 15). The note names the plan-only follow-up.
  design: |
    1. Create src/cli/commands/review.ts. Move reviewCommand, runReview into it, plus every top-level run-task.ts symbol whose references all lie inside
       the moved set. Find that set with a reference census over run-task.ts at the build's base: a symbol moves when
       no reference to it remains outside the set. Keep each moved body verbatim, apart from reading its collaborators
       from the host, so diff-coverage's relocation exemption (W1-T2325, W1-T3138) reads the moved lines as moved
       code rather than new code.
    2. Any other run-task.ts symbol the moved code reaches arrives through one exported
       `ReviewCommandHost` interface, taken as a parameter. src/lib symbols are imported
       directly. A collaborator that an earlier step already moved into src/cli/commands/ is imported from there. The
       module imports nothing from src/run-task.ts (W1-T9331's `cli-no-run-task`).
    3. src/run-task.ts imports the moved roots from "./cli/commands/review.js" under local aliases named `<root>FromModule`. It keeps every moved root that
       was exported, or that another run-task.ts symbol calls, as a thin function with the same name and signature. That
       function builds the host from run-task.ts's own symbols and delegates to the module. HANDLERS, every in-file
       caller, and every test that imports a root from src/run-task.ts stay unchanged.
    4. Unchanged: COMMANDS (scripts/rmd-help.mjs source-scans that array), and the verb's behaviour, ledger rows,
       stdout and exit codes. Only the 26 declared existing test companions may follow the original source
       subjects into the review module, retaining their original logical assertions and falsifiers. Exactly one
       existing diagnostic string may name the new owner instead of run-task.ts; no assertion is removed or
       weakened. Reader fixture anchors may follow the host qualification and physical function boundaries.
       The source-text baseline may increase only disarm-lost-race-hard-stop 2 -> 3,
       disarm-on-capped-verdict 1 -> 2, mounts-wiring 2 -> 3, review-decision-finality 1 -> 2,
       review-status-pending 1 -> 2, and run-task-s-widened-git-sites-are-classified-and-converted 0 -> 1.
       The sync-spawn census may relocate only planTreeIsBehindMain:1 and resolveReviewSubjectCheckout:1
       to reviewCommandHost:2; the raw-Git table relocates their two counts of 2 to reviewCommandHost:4,
       and the widened-Git table relocates their two CHECKOUT counts of 1 to reviewCommandHost:2.
       The original managed-checkout and subject-origin reasons remain explicit; aggregate counts do not grow.
       The comment baseline may split the original 14750 ceiling into run-task.ts:14072 and review.ts:678,
       conserving 14750 rather than the native proposal's 15000. Every other entry, exclusion, population,
       threshold, acceptance criterion and falsifier stays unchanged. Restore the original literal
       origin/main:plan/tasks.d read in the host; layout overrides must not change this extraction's behavior.
    5. The PR body reports the moved symbol count and line count, and the host's member count. A large host is
       acceptable. Never shrink it by importing run-task.ts.
    Tests go in the new file test/the-review-verb-lives-in-its-own-module.test.ts, with `test(` titles exactly as in the proofs below. They read the two source
    files as text, need no git and no network, and the verb's existing behavioural tests must pass untouched.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/the-review-verb-lives-in-its-own-module.test.ts"
    - claim: "reviewCommand is defined in the review module, and src/run-task.ts only delegates to it"
      proof: 'grep: test("W1-T9339: reviewCommand is defined in its module and src/run-task\.ts only delegates to it" in test/the-review-verb-lives-in-its-own-module.test.ts'
    - claim: "the review module imports nothing from src/run-task.ts"
      proof: 'grep: test("W1-T9339: the review module imports nothing from src/run-task\.ts" in test/the-review-verb-lives-in-its-own-module.test.ts'
    - claim: "the module declares the moved handler"
      proof: 'grep: async function runReview( in src/cli/commands/review.ts'
    - claim: "src/run-task.ts calls the moved handler through the module"
      proof: 'grep: reviewCommandFromModule( in src/run-task.ts'
  falsifier: |
    At base, src/cli/commands/review.ts does not exist and run-task.ts defines reviewCommand, runReview itself, so both new tests fail. Give the module an
    import of "../../run-task.js" and the second test fails, as does W1-T9331's depcruise rule. Leave reviewCommand's body in
    run-task.ts beside the import and the first test fails.
