    src/lib/task-id-reservation.ts and test/task-id-reservation.test.ts are ONE subsystem, and
    the blast radius matches — one parameter added with a default that preserves today's
    behaviour, no import added to any other module. FILES DERIVED BY INVOCATION: the function,
    its doc contract and its existing suite all live in that one module and its one test file,
    both of which exist today. NOTHING under src/run-task.ts is declared, because the CLI call
