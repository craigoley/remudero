- id: W1-T4349
  title: "close the credential-reach ratchet's two known-open findings — deny the escape-path reads of the operator's real ~/.claude.json and ~/.claude/.credentials.json, and shrink scripts/credential-reach-baseline.json to zero for every measured host class"
  repo: remudero
  depends_on: [W1-T4348]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    Second half of the follow-up harvest fix (followup:DAEMON-1789306309171:2026-09-13T13:53:53.493Z:0,
    run DAEMON-1789306309171, PR #5389). VERIFIED LIVE on this run's own azure-container host:
    settings/worker.json's deny list covers .ssh/.aws/.config/remudero/service-tokens.json but
    NAMES NEITHER `.claude.json` NOR `.claude/.credentials.json` — src/lib/containment.ts's own
    credentialReachTargets literally labels both `ungoverned:*` and says so in its comment ("the
    two credential files in NEITHER table"). Both files exist on this host's real HOME right now,
    and scripts/credential-reach-baseline.json records `reachable: []` for this host's class — a
    live widening the ratchet test would currently fail on, exactly the symptom the follow-up
    flagged.

    `.claude.json` (CLAUDE_CONFIG_REL) is DELIBERATELY absent from WORKER_HOME_SYMLINKS entirely
    (the CLI creates a fresh one per spawn; worker-home.ts's own comment: "granting it back would
    share one mutable inode across every worker") — so its ONLY reach is the escape path, closable
    with zero collision risk against any legitimate grant.

    `.claude/.credentials.json`'s reach is NOT merely an escape path today: before W1-T4348 runs, the
    worker's OWN `.claude` grant resolves to the wholesale `~/.claude` and legitimately exposes the
    SAME file. Denying only the escape path before W1-T4348 lands would do nothing for this target and
    is why this task depends on it — once W1-T4348 seeds `.claude-fleet` and the grant resolves there
    instead, the operator's real `.claude/.credentials.json` is reachable ONLY via the escape path,
    which this task then closes.
  design: |
    Add, to settings/worker.json's `permissions.deny` AND `sandbox.filesystem.denyRead` (both
    lists, matching every existing pair in that file):
      "Read(~/../../.claude.json)"
      "Read(~/../../.claude/.credentials.json)"
    mirroring the EXACT `~/../../` anchor already used for `.ssh`/`.aws`/`.config/remudero` —
    anchored to `realHome`, never the worker's own redirected HOME, so the worker's legitimate,
    `.claude-fleet`-backed grant (a DIFFERENT literal path, one bare `~`) is untouched.
    Rename containment.ts's two `ungoverned:*` target ids to `deny:*` (matching every other covered
    target's naming) and update the target-table comment that currently states these two files sit
    "in NEITHER table."
    Update scripts/credential-reach-baseline.json: remove both ids from EVERY measured class's
    `reachable` array (ci-ubuntu, azure-container, unknown-linux all go to `[]` for these two), and
    replace the `_finding` note (which currently documents the OPEN gap) with a closure note citing
    this task, per the file's own stated convention ("the PR that closed it drops the entry").
    THE LOAD-BEARING FALSIFIER: after the deny rules land, a worker's OWN `.claude` grant (now
    backed by W1-T4348's `.claude-fleet` sibling) must STILL resolve a readable credential — the new
    deny rules target the ESCAPE path only, and must not collaterally deny the worker's legitimate
    one-tilde grant path.
    VERIFY denyRuleCovers's anchor resolution against the actual literal paths involved before
    finalizing (distrust this note) — a bare `~/.claude/.credentials.json` and an escape-anchored
    `~/../../.claude/.credentials.json` are different literal strings under denyRuleCovers's own
    documented anchoring, but confirm this holds for BOTH the test suite's simulated resolution AND
    the real sandbox's Read() semantics before treating it as settled.
  acceptance:
    - claim: "resolveCredentialReach for the operator-claude-json target now returns refused, citing the new deny rule, given the current settings/worker.json"
      proof: "unit test: resolveCredentialReach for the operator-claude-json target now returns refused citing"
    - claim: "resolveCredentialReach for the operator-credentials target now returns refused, citing the new deny rule, given the current settings/worker.json"
      proof: "unit test: resolveCredentialReach for the operator-credentials target now returns refused citing"
    - claim: "removing either new deny rule from the resolved rule set restores the pre-fix reachable/absent outcome for its target — the refusal is decided by the rule, not asserted"
      proof: "unit test: removing either new deny rule from the resolved rule"
    - claim: "a worker's own legitimate .claude grant (backed by W1-T4348's .claude-fleet sibling) still resolves a readable credential after the new deny rules land — the escape-path denial does not collaterally block the worker's own grant path"
      proof: "unit test: test/worker-home.test.ts"
    - claim: "scripts/credential-reach-baseline.json parses as valid JSON whose classes.azure-container.reachable, classes.ci-ubuntu.reachable and classes.unknown-linux.reachable arrays each equal an empty array"
      proof: "unit test: the credential reach baseline parses as valid JSON"
  risk: high
  origin: "followup:DAEMON-1789306309171:2026-09-13T13:53:53.493Z:0"
  plan_refs: ["W1-T2698", "W1-T2699"]
  files: [settings/worker.json, src/lib/containment.ts, scripts/credential-reach-baseline.json, test/credential-reach-probe.test.ts, test/worker-home.test.ts]
  status: queued
  attempts: 0
  note: |
    risk:high matches this exact area's own established precedent (W1-T2698, W1-T2699 were both
    risk:high) — this is the fleet's containment-policy surface, and the collision falsifier above
    is load-bearing, not decorative: a wrong anchor here either fails to close the gap or breaks
    worker authentication fleet-wide. depends_on W1-T4348 because closing operator-credentials before
    the narrowing activates would deny nothing real (the wholesale grant reaches the same file
    through a different, un-denied path) and risks a false sense of closure.

    emissions.test.ts's half of the originating follow-up is NOT addressed here — it is ALREADY
    DECIDED and already queued as W1-T2951 ("ANY LEDGER FILE IS TREATED AS PROOF THE FLEET RAN"),
    which this proposal does not duplicate.
