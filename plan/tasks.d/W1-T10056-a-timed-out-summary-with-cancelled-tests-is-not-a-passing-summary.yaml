      proof: 'grep: test("W1-T10056: a timed-out summary reading fail 0 with cancelled 2 is not a passing summary" in test/a-timed-out-summary-with-cancelled-tests-is-not-a-passing-summary.test.ts'
    - claim: "a cancelled summary that names its last unfinished test reads as timed out during that test"
      proof: 'grep: test("W1-T10056: a cancelled summary naming its last unfinished test reads as timed out during it" in test/a-timed-out-summary-with-cancelled-tests-is-not-a-passing-summary.test.ts'
    - claim: "the headroom fact carries the measured bare-catch figure"
      proof: 'grep: 49 of 49 in learnings/architecture.yaml'
    - claim: "the headroom fact names the baseline table it is measured against"
      proof: 'grep: BASELINE_BARE_CATCH_COUNTS in learnings/architecture.yaml'
  falsifier: |
    At origin/main, `ciFailureSignature` over test (a)'s log returns "timed out after a passing summary", so (a) and
    (b) fail and (c) passes. With the cancelled check in `failZero`, all three pass. Deleting the check gives
    `# fail 2`, restoring it `# fail 0`. `grep -c '49 of 49' learnings/architecture.yaml` reads 0 at origin/main and
    1 after the edit.
  note: |
