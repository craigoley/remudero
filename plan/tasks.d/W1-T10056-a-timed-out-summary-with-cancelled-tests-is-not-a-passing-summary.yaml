  rationale: |
    OBSERVED, item 1 (ci-friction blind spot):
    - READ at origin/main 952508792 (symbols, not lines): src/lib/ci-friction-gardener.ts `poolOrTimeoutSignature`
      (W1-T8038), reached through `ciFailureSignature` once a CI_RUNNER_TIMEOUT_LINE is present. Its `failZero` is
      any line matching `^(?:#|ℹ) fail 0\b` (or a pure-test-pool "run complete … # fail 0" line), `ran` is any
      `# tests`/`# pass` > 0, and `failZero && ran` returns "timed out after a passing summary". Nothing reads
      `# cancelled`.
    - node:test counts a timed-out test under `# cancelled`, not `# fail` (learnings/testing.yaml
      a-cancelled-test-is-a-failure, #12610; its files: already list src/lib/ci-friction-gardener.ts). #12472 made
      scripts/pure-test-pool.mjs `judgeRun` push "# cancelled N" as a problem, so the pool's "run complete" line no
      longer prints over cancelled tests; the raw node:test summary lines the classifier also reads still do.
    - PROBE 2026-10-17 on 952508792's tree (node --import tsx, the pure function only): lines `# tests 90`,
      `# pass 88`, `# fail 0`, `# cancelled 2`, then the runner's "exceeded the maximum execution time" and "The
      operation was canceled." return "timed out after a passing summary" from both `poolOrTimeoutSignature` and
      `ciFailureSignature`. Adding "Last started unfinished test: test/b.test.ts > slow case (ci-shard (7/8))." still
      returns "timed out after a passing summary": the passing-summary arm runs before the unfinished-test arm.
    OBSERVED, item 2 (stale learnings fact):
    - learnings/architecture.yaml `run-task-has-zero-catch-erasure-headroom` says "ZERO headroom on the bare-catch
      ratchet — 64 of 64". The baseline is `BASELINE_BARE_CATCH_COUNTS` in test/catch-erasure-ratchet.test.ts; its
      src/run-task.ts row reads 49 at 952508792 and left 64 in db7701946 (#4591, 2026-09-08).
    - RE-MEASURED 2026-10-17: test/catch-erasure-ratchet.test.ts passes 29/29 (`# fail 0`, `# cancelled 0`),
      including both PROPERTY tests ("count exceeds its baseline" and "allowance sits slack above its actual"). With
      `CATCH_COUNT_SLACK = 0` (W1-T2906) those two together mean the actual bare-catch count of src/run-task.ts is
