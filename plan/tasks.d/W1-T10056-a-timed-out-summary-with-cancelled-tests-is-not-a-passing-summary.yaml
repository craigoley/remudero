    run-task-has-zero-catch-erasure-headroom and "64 of 64" (2026-10-17 ~17:32Z); #12600 only has `# cancelled 0`
    in census-precheck fixtures.
  design: |
    1. CLASSIFIER. In `poolOrTimeoutSignature`, a summary is passing only when it also reports no cancelled test:
       a line matching `^(?:#|ℹ) cancelled [1-9]` makes `failZero` false, so a cancelled summary is a failing
       summary. It then falls through to the existing arms unchanged: "timed out during <last unfinished test>" when
       the log names one, else "timed out with no test result". No new signature string is added, so
       test/a-ci-friction-remedy-is-owned-by-the-code-its-failing-test-exercises.test.ts's list is untouched. A
       `# cancelled 0` line changes nothing.
    2. LEARNINGS (update, not retire: the premise holds, see rationale). Rewrite the `fact` of
       `run-task-has-zero-catch-erasure-headroom` in learnings/architecture.yaml to the measured figure: src/run-task.ts
       has ZERO headroom, 49 of 49, because the zero-slack census keeps its `BASELINE_BARE_CATCH_COUNTS` row equal to
       its real count. Keep the rest of the instruction (rethrow, record, carry the distinction, or state the reason;
       never raise the baseline). The phrases `49 of 49` and `BASELINE_BARE_CATCH_COUNTS` each sit on ONE physical
       line of the folded scalar. Re-measure at the build's base first: if the row is no longer 49, write the row's
       figure and say so in the PR body (the first proof below then needs an operator amendment). Add an
       `evidence:` naming the re-measure and #4591, set `cited:` to the build date, keep `lifecycle: active`, and run
       `npm run learnings-index:check` (the index is a local artifact since W1-T7954, so nothing else is committed).
    3. TESTS in test/a-timed-out-summary-with-cancelled-tests-is-not-a-passing-summary.test.ts, `test(` titles
       verbatim as in the proofs, timestamped lines in the W1-T8038 test's shape:
       (a) `# tests 90`, `# pass 88`, `# fail 0`, `# cancelled 2` followed by the two runner timeout lines: the
           signature is NOT "timed out after a passing summary" (it is "timed out with no test result");
       (b) the same summary plus "Last started unfinished test: test/b.test.ts > slow case (ci-shard (7/8))."
           reads "timed out during test/b.test.ts > slow case";
       (c) a `# cancelled 0` summary still reads "timed out after a passing summary".
  acceptance:
