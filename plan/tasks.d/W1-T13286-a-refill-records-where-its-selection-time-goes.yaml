    test/plan/ops-catalog-shadow-invalid-edges.test.ts and test/daemon/ops-catalog-shadow-enabled.test.ts.
    No assertion changes. The operator approved (2026-11-22 21:36Z) a recordOnly entry for
    dispatch.selection_timing in scripts/write-only-ledger-step-baseline.json, since design step 2 says no
    decision reads the row.
