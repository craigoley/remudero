  rationale: |
    READ at origin/main 5c5abf070:
    - src/run-task.ts depReviewCommand has two captures. The `migrate` branch (W1-T2705, #4421, 2026-09-07) and the
      own-red `capture` closure that reconcileDependabotOwnRed calls (W1-T9586, #11972, 2026-10-15) both run
      captureFeedback(config.root, { origin: "repair#dep-review", submissionKey }).
    - captureFeedback writes <root>/plan/feedback/<id>.yaml and then runs landFeedback(root). Every other caller passes the
      checkout (repoRoot or deps.root). config.root is the state root.
    - Nothing reads config.root/plan/feedback. The landing sweep, triage and listFeedback read the checkout, and
      `git grep` finds no listFeedback, feedbackDir or readFeedbackEntry call on config.root.
    - The sweep (src/lib/sweep.ts depReview) awaits depReviewCommand in-process, so the inline landFeedback runs on the
      daemon loop.
    MEASURED on the core host 2026-10-15 (read-only):
    - config.root in the daemon container is /home/node/Remudero, which is host /home/craigoleyagent/rmd-state2.
      `git rev-parse` there fails: not a git repository. So the inline landFeedback can never land.
    - One stranded file: rmd-state2/plan/feedback/fb-dep-review-adb8a956b051dd72.yaml (ts 2026-09-16T13:06:48Z). It is a
      migration proposal for @types/node 22.20.2 -> 25.9.6 from Dependabot PR #5758.
    - Ledger union (365 archives plus the live file; control: 854 dep-review.decided rows): four
      dep-review.migrate.feedback_captured rows, for #5758 (09-16), #6337 (09-21), #6761 (09-23) and #9767 (10-07). All
      four share submission_key dep-review:migration:craigoley/remudero:@types/node@25 and resolve to that one stranded
      id, because the submission-key dedupe reads the same stranded root. Each was followed by
      dep-review.migrate.ignore_commented and dep-review.migrate.closed, so the bot PR was CLOSED.
    - origin/main has never held a plan/feedback/fb-dep-review-* file (`git log origin/main -- 'plan/feedback/fb-dep-review-*'`
      is empty). Control: 367 plan/feedback entries on main, 10 of them with a repair# origin.
    - There are no dep-review.own_red.* rows yet: #11972 merged at 11:21Z today, so its capture has not fired.
    The @types/node@25 proposal itself is moot, because W1-T5883 moved the fleet to Node 24 deliberately. The mechanism is
    the defect: a migration or own-red proposal is the ONLY durable record of a closed or held bot PR, and it is lost.
  design: |
    1. Both dep-review captures write into the CHECKOUT the sweep and triage read (repoRoot), never config.root.
    2. The daemon call never lands inline. The sweep's depReview call passes the daemon's landing state root, and
       depReviewCommand stages each capture with W1-T9615's stageFeedbackCapture (its submission-key dedupe reads the
       checkout and the queue). The per-poll sweepFeedbackLandingAsync then lands it with the async preflight. A hand
       `rmd dep-review` passes no state root and captures inline in its checkout, as the CLI does today.
    3. The migrate branch closes the Dependabot PR only after the proposal is durable: staged (queued) or present in the
       checkout. A stage that reports an error ledgers dep-review.migrate.capture_failed and holds the PR open, which the
       existing catch arm already does for a throw.
    4. The stranded fb-dep-review-adb8a956b051dd72 is NOT re-landed: W1-T5883 superseded it. Nothing reads config.root's
       plan/feedback after this change. Deleting that host file is an operator write, named in the PR body.
