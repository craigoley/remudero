      proof: "unit test: test/proof-queue-audit.test.ts"
    - claim: "a whole-file path proof naming a test file that does not exist yet is NOT reported, so a legitimate forward reference stays legitimate"
      proof: "unit test: test/proof-queue-audit.test.ts"
    - claim: "a name-filtered proof matching zero tests and a grep proof whose path is absent are both reported, in the shape W1-T229 carried"
      proof: "unit test: test/proof-queue-audit.test.ts"
    - claim: "the audit exits 0 over a plan full of offenders — it is a report, never a gate"
      proof: "unit test: test/proof-queue-audit.test.ts"
    - claim: "the report has a real caller rather than shipping dormant like the check it consumes"
      proof: "grep: proofQueueAudit( in src/run-task.ts"
