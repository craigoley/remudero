  note: "risk:high IS SET UP FRONT — Rule 19 SPAN across src/ and test/, which `sizingViolation`
    (src/lib/task-linter.ts) blocks below that band. The blast radius argues LOWER: a new read-only verb
    that exits 0 on every input and that no dispatch, CI or arm path reads. The span is the reason, and it
    is stated rather than dodged by splitting — a shard that omitted the call site would reproduce the exact
    dormancy this task exists to end (design (vi)).
    verify:auto — the classifier is pure over a loaded plan plus an injected resolver, so both directions
    are assertable against fixtures; the live-plan pass fails open on a shallow checkout exactly as
    test/plan-proof-debt.test.ts already does.
    src/run-task.ts IS DECLARED AND WILL BE TOUCHED — the verb registration has nowhere else to live. THE
    COST IS ACCEPTED, NOT HIDDEN: at ~19,900 lines it serialises this task against every other task naming
    it (`partitionByFileOverlap`, W1-T471), W1-T492 and W1-T497 among them. That is the honest price of
    landing with a caller.
    THE NEW MODULE IS ITS OWN FILE rather than an append to task-linter.ts: that module is documented PURE
    (no fs, no exec) and this audit shells out through the resolver, so hosting it there would break the
    contract three other checks depend on.
    PROOFS: four pure-path `unit test:` forms against the suite this task creates — the path form parses now
    and executes the whole file once it exists, and a title invented here would resolve to zero, which is
    the very defect being filed. The single `grep:` proof names the wiring, the one claim a unit test over
    the classifier cannot make on its own. Both declared paths are inside `files:`, so `proof-scope` is
    silent.
    NO depends_on. W1-T497 wires the same resolver at the changed-tasks pass; neither blocks the other, and
    if W1-T497 lands first this task's classifier can reuse nothing from it — the call sites are disjoint by
    design (design (ii) of that shard).
    THE THREE-ENTRY CONVERGENCE, RULED AND RECORDED so a fourth session does not re-file it as one
    instrument. W1-T309's defect is a proof that EXECUTED AND PASSED while certifying a seam the shipped
    command never reaches — the opposite failure, and no resolver can see it. fb-1785792135748-755f93 was
    TRIAGED AND REJECTED (both criteria paths call the same parser on the same input). Only this entry's
    class — a proof that resolves to NOTHING looking identical to one that resolves to something passing —
    is covered here. One instrument does not cover all three, and claiming it would be the same
    unfalsifiable move this task exists to catch."
