  design: |
    Add optional bounded worker-call coverage inside the existing off-loop gardener
    capture and cached Analytics/OpenAPI shape, using only the declared existing files.
    Reuse its ONE ledger union pass, validated origin, scoped parent and fingerprint
    deduplication. No new HTTP scan, full-corpus pass, timer, exporter or network call.
    Capture only bounded assignment/attempt metadata in the private join index. Match
    actual worker.assignment to worker.attempt by immutable assignment ID and the same
    gardener, pass, repository and generation. Handle arbitrary parent/child ordering.
    Missing, malformed, wrong-scope and conflicting identities remain explicit gaps.
    A duplicate rotated row or conflicting restated attempt cannot create an extra call.

    Expose observed assignment, matched/missing/orphan/conflict, reported-price coverage
    and API/subscription/unknown-billing counts, scoped to repository gardens. An observed
    call is not task success or proof its running/interrupted parent completed. Keep
    API reported estimates, subscription notional and invoices conceptually separate.
    DO NOT add worker attempts to monetary producers, infer price from absent/default
    fields, reconstruct historical parentage, or turn unpriced/legacy data into dollars
    or a zero-call measurement. Old source snapshots without usage capture say unknown.
    Keep canonical existing monetary totals and dedup behavior byte-for-byte compatible
    where feasible, and test equality with and without the extra attempt receipts.

    Preserve the existing 32-garden, 64-KiB response and bounded identity limits. Optional
    coverage overflow or failure must preserve independently valid money subtotals and
    ordinary Analytics, while naming affected usage coverage unavailable/partial rather
    than dropping evidence and claiming complete. Keep source window, capture and
    materialization clocks distinct. No raw IDs, prompts, worker envelopes, credentials
    or unbounded labels enter the public response. Use generated parent/assignment
    fixtures and actual gzip/plain/live files, not a fake collector's returned counts.
    The real worker refresh and authenticated cached HTTP read must carry the result
    without reading ledger files on a GET; extend the existing strict OpenAPI control.
    In analytics-view.ts, allocate the existing monetary payload across all repositories
    first, then fit optional call coverage into remaining bytes. A coverage failure or
    omission means unknown, never zero, and cannot evict another repository's valid
    monetary data. Keep the shared 64-KiB response cap and ordinary Analytics coverage.

    Research: current OpenTelemetry inference-token conventions distinguish aggregate
    usage from operation distributions, which are not total-usage or cost measures:
    https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-token-metrics.md
    Borrow the distinction, not an SDK/exporter migration or a missing-value default.
    This internal nullable evidence contract remains authoritative. Console consumption
    is a separate follow-up pinned to the actual merged producer contract. No provider,
    billing, permission, routing, host resource, service lifecycle, gardener activation,
    Inbox disposition, Field Trials or review/merge-policy change is authorized here.
