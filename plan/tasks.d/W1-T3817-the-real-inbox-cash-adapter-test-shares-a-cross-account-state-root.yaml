- id: W1-T3817
  title: "THE REAL INBOX CASH-ADAPTER TEST REUSES A CROSS-ACCOUNT /tmp STATE ROOT — its config reserves allowance through a hard-coded directory owned by another local account, so an otherwise hermetic test fails EACCES before its fake transport proves the real routed surface: derive config.root and cwd from the test's own temporary root"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: low
  budget_usd: 5.00
  files: [test/an-open-weight-provider-rides-the-capability-ladder.test.ts]
  origin: "recon#local-preflight-openweight-allowance-state-2026-09-19"
  plan_refs: ["W1-T3569", "W1-T3666", "W1-T3607"]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on current origin/main under the active local account. The real
    `synthesis.inbox_draft` cash-adapter test creates a private temporary root for its worker
    and allowance write, but constructs its Config earlier with the fixed
    `/tmp/rmd-mount-affinity-inbox-real` root and cwd. That directory is owned by a different
    local account. The real adapter derives `state/openweight-allowance.json` from config.root
    and performs its atomic reservation before the fake transport. It therefore fails with
    EACCES creating the temporary allowance file instead of exercising the test's declared
    Read/Grep/Glob surface. Other allowance tests in the same file already use mkdtemp roots.

    This is test isolation, not a cash-provider or allowance-policy failure: the request has a
    fake endpoint and test-only secret, and the test must still execute the real adapter and
    real mount table. Cleaning or chmodding the shared /tmp directory would hide cross-account
    interference and mutates state outside the test's ownership.
  design: |
    Create the test's temporary root before its Config and use that one root for Config.root,
    the spawn cwd beneath it, workerHome, and the existing cleanup. Preserve the real shipped
    mounts.yaml read, the real `synthesis.inbox_draft` mount selection, the adapter-supported
    Read/Grep/Glob assertion, the fake transport, and the daily-cap reservation. Do not alter
    provider routing, allowance semantics, endpoint validation, or any shared temporary path.

    The regression test remains the existing real inbox-draft adapter test. It must pass when
    its private root is writable, while restoring the fixed cross-account root must fail before
    fake transport with the allowance write's EACCES on this host. The test must not depend on
    the presence, ownership, or contents of the former shared directory.
  acceptance:
    - claim: "the real inbox-draft adapter test derives both config state and spawn cwd from its own temporary root rather than a cross-account /tmp directory"
      proof: "grep: cwd: join(root, \"worktree\"), in test/an-open-weight-provider-rides-the-capability-ladder.test.ts"
  falsifier: |
    Restore the fixed `/tmp/rmd-mount-affinity-inbox-real` Config root and cwd while retaining
    the private worker root. The real adapter must again fail its atomic allowance-file write
    with EACCES before it can reach the fake transport. A remedy that only makes the assertion
    accept an error, removes the allowance reservation, or chmods a shared directory is not
    this fix.
  note: |
    reservation holder is this filing branch, verified by `rmd next-task-id` reserving
    W1-T3817 on origin before this shard was written; no hand-off is required.

    One test file only. This task repairs local test hermeticity and does not change the cash
    lane's production credentials, pricing, routing, or daily-cap behavior.
