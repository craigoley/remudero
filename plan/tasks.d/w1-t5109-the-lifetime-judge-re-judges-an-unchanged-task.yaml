  rationale: |
    OBSERVED 2026-09-28..10-01 (core ledger union): 163 verify_human.judged rows carry an adaptive-lifetime
    observed_state, over 53 tasks: W1-T4266 10 times, W1-T4686 10, W1-T4627 8, and W1-T3676, W1-T3765, W1-T4481 and
    W1-T4769 6 each. The observed_state suffix changes with whatever row the task last produced:
    `last=managed_checkout.refresh_refused`, `last=sweep.disposed`, `last=dispatch.skipped`,
    `last=run.running_long`, `last=dispatch.claim_released`, and `last=verify_human.judged`, which is the judge's
    own previous verdict. So priorVerifyHumanVerdicts never matches, and the same evidence is judged again. Verdicts
    flip on unchanged facts: W1-T3760 needs_operator, then automate, then needs_operator within 3.5 h; W1-T3765
    automate, then needs_operator, then automate.
    Context, measured in the same pass: the lifetime count is telemetry (drain.ts isDispatchEligible logs
    dispatch.lifetime_pressure but never refuses), and this route passes no `release` hook. So a verdict changes no
    dispatch. Its only effects are judge spawns and inbox proposals, which stageInboxProposalOnce dedupes by id.
    Released tasks that "never re-dispatch" were waiting on queue order (absent priority sorts last), not on this
    route.
    Judge-quality note: W1-T4266's needs_operator reasons describe the FEATURE's runtime operator confirmation
    (flipping a shadow instance live), not a build-time operator need.
  design: |
    No new refusal, no new bound. AMENDED 2026-10-01 at the operator's request ("look at how to do this in the smartest
    way possible"), adding steps 1, 5 and 6 to the original three.
    1. ONE CLASSIFIER FOR "THE TASK FAILED". The lifetime sensor (`taskAttributableLifetimeDispatches`,
       src/lib/status.ts) excludes only capacity refusals and orphaned starts. A lock-busy run error, an unreadable
       GitHub read, a containment or isolation block, `blocked_inflight` on a dead claim, and a freshness yield all
       count as the TASK's attempts: W1-T4266's five dead-claim strikes read as five task failures. Reuse the streak
       breaker's own `infrastructureRefusal(line)` classification (the same one `dispatchStreakTally` uses,
       W1-T4660), so both signals agree on what is infrastructure. Never a second list.
    2. Key a lifetime-route judgment on the evidence that can change the answer: attributable (per 1) dispatches,
       capacity refusals, open-PR evidence, merge evidence, and the LAST TERMINAL VERDICT (the newest `verdict`
       row). Never the newest arbitrary row. verify_human.* rows and dispatch telemetry never enter the key.
    3. An unchanged key reuses the prior verdict (priorVerifyHumanVerdicts), so the judge is asked again only when
       new evidence exists. That also stops the flip-flops, because unchanged facts cannot produce a second verdict.
    4. The question handed to the judge is whether BUILDING the task needs the operator, not whether the feature
       asks an operator at runtime. The judge also gets the task's attributable terminal-verdict history, so it
       judges why the task keeps failing rather than its title.
    5. A RECORDED OPERATOR RULING IS BINDING. A shard `note:` line beginning `OPERATOR RULING <YYYY-MM-DD>:
       automate|needs_operator` is read deterministically. The route records it as the verdict, with no judge
       spawn, until a later dated ruling replaces it. W1-T4266 carries the first one (automate, 2026-10-01).
    6. A task whose attributable failures (per 1) are zero is never judged; its pressure is infrastructure's, and
       the breaker and capacity paths already own that. Ledger `dispatch.lifetime_pressure.infra_only` once per
       evidence key, so the sensor stays legible.
    MEASURE AFTER MERGE: verify_human.judged rows with an adaptive-lifetime observed_state per day (163 over
    2026-09-28..10-01 is the baseline), verdict flips per task, and judge spawns avoided by 5 and 6.
