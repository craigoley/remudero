- id: W1-T269
  title: "headroom becomes PER ACCOUNT — UsageSnapshot has no account field, the /usage capture is a single global probe, and W1-T249's reserve is resolved once for the host, so with two subscriptions the governor would gate every run on whichever account the probe happened to reach"
  repo: remudero
  depends_on: [W1-T266, W1-T267]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  rationale: "WITHDRAWN AS FILED 2026-07-31 by the W1-T266 ruling (docs/account-selection.md, merged as PR #1024),
    which this task's own WITHDRAW-IF clause named as the deciding authority. That record rules PINNED SERIAL-SWITCH
    mode with no concurrency, and says in terms: 'W1-T269 (per-account headroom: splitting UsageSnapshot, the
    reserve curve, and the governor's gate across multiple simultaneously-live accounts) should be WITHDRAWN rather
    than built. With one account live per host, the existing single-window governor is already correct; a
    per-account split of a set with one element is pure cost with no behavioral payoff.' Its follow-ups ask for
    exactly this bookkeeping edit — 'mark W1-T269 and W1-T270 status: withdrawn (or equivalent) in their task files
    per this ruling'. `withdrawn` is not one of plan.ts's TASK_STATUSES, so the equivalent this repo already uses
    for a retirement record is status: blocked (precedent: the W1-T139-superseded native-shell task,
    plan/tasks.yaml — 'RECORD of the retirement decision, not a work item'). SIBLING PRECEDENT: PR #1027 withdrew
    W1-T270 in exactly this shape on 2026-07-31; this entry mirrors it.
    WHY THE RULING KILLS IT. Every acceptance criterion below was written for MULTIPLE SIMULTANEOUSLY-LIVE accounts:
    a snapshot that names which of several accounts it was read under, a reserve curve resolved per label, an
    unreadable reading for one account not masking another's, and a ledger line naming which of several budgets it
    measured. With one account live per host by ruling, each of those is a set with one element — the snapshot's
    label is always the only label, and one account's reading masking another's cannot occur. The existing
    single-window governor is already correct for that world.
    THE ORIGINAL DIAGNOSIS REMAINS TRUE AND IS NOT WHAT IS BEING WITHDRAWN. UsageSnapshot (src/lib/headroom.ts) is
    still exactly { billingMode, session, weekly } with no account field, HEADROOM_LIMIT_PCT is still a single
    host-wide constant, and the reserve still rides one headroom.reservePct. None of that is a defect under
    serial-switch mode; it is the correct shape for it.
    REVERSIBLE ON EVIDENCE, not a permanent no: if the published one-account-per-machine promise in MASTER-PLAN.md
    is ever revisited, per-account headroom becomes wanted again and the withdrawn criteria are preserved verbatim
    in this task's note for exact re-filing."
  design: |
    NOT TO BE BUILT. Withdrawn as filed by the W1-T266 ruling (docs/account-selection.md). Left in the plan as a
    RECORD of the withdrawal decision, not a work item. status: blocked so nextRunnable/assertRunnable never
    dispatch it (drain.ts's isDispatchEligible refuses `status === "blocked"` before any dependency or breaker check).
    WHAT IS ALREADY BUILT, so no later reader rediscovers it at $100. W1-T267 (merged 2026-07-31 as PR #1026,
    commit d88bd5b) made the /usage probe read the SAME credential store the workers spend — it materializes a
    stable worker-home-usage-probe directory with that store symlinked in, passes home: into buildWorkerEnv, and
    moves the execFileSync behind an injectable UsageProbeRunner seam. That is the correctness prerequisite this
    task named, and it landed. It changed src/run-task.ts and added test/usage-probe-store.test.ts; it did NOT
    touch src/lib/headroom.ts or src/lib/daemon.ts, so it satisfies none of this task's criteria — see the
    measurement in the note. The probe now reads the right store for the ONE account that is live, which is
    precisely what serial-switch mode requires and all it requires.
    THE REAL DEFECT IN THIS AREA IS A DIFFERENT ONE AND IS NOT SMUGGLED IN HERE. recon-CG established that
    readUsageSnapshot returns undefined every tick because parseUsage's WINDOW_TAIL makes the resets clause
    mandatory while the live account emits a weekly window without one. That is a parser bug on the SINGLE-account
    path, unrelated to per-account splitting, and it deserves its own filing rather than being reworded into this
    withdrawn entry — reshaping a withdrawn task into new scope would hide a filing decision inside a bookkeeping edit.
    depends_on is left UNCHANGED at [W1-T266, W1-T267] on purpose. status: blocked already stops dispatch before the
    dependency check is reached (drain.ts:127 precedes the unmetDependencies call at :128), so editing the edge would
    change nothing observable while making the graph disagree with what was actually filed. Both dependencies have in
    fact merged, which is exactly why this entry had to be marked promptly: it was dispatch-eligible at the moment of
    this edit.
  acceptance:
    - claim: "this task is withdrawn as filed and never dispatched; the ruling that withdrew it is recorded"
      proof: "grep: should be WITHDRAWN in docs/account-selection.md"
  risk: high
  origin: architect
  plan_refs: ["§4", "§9"]
  files: [src/lib/headroom.ts, src/lib/daemon.ts]
  status: blocked
  retirement: withdrawn
  attempts: 0
  note: "THE FOUR WITHDRAWN CRITERIA, PRESERVED VERBATIM so a future re-filing needs no archaeology:
    (1) claim 'a snapshot carries the account label it was read under and an unattributable snapshot says so rather
    than defaulting' / proof 'unit test: test/headroom-per-account.test.ts';
    (2) claim 'the reserve and the curve resolve per account label while a single configured label reproduces
    today's values exactly' / proof 'unit test: test/headroom-per-account.test.ts';
    (3) claim 'an unreadable reading for one account neither masks nor is masked by a readable reading for another'
    / proof 'unit test: test/headroom-per-account.test.ts';
    (4) claim 'the ledgered headroom line names which account it measured so a reader can tell which budget it
    describes' / proof 'grep: account_label in src/lib/headroom.ts'.
    MEASURED AGAINST #1026 BEFORE WITHDRAWING, so the withdrawal does not rest on the ruling alone — W1-T267 merged
    one hour before this edit and is this task's prerequisite, so the question had to be asked: (1) UNTOUCHED —
    UsageSnapshot is still exactly { billingMode, session, weekly }, no account field; (2) UNTOUCHED — the reserve
    is still one host-wide headroom.reservePct and HEADROOM_LIMIT_PCT is still a single constant; (3) UNTOUCHED —
    there is no per-account read to mask anything, the probe returns one snapshot for the host; (4) UNTOUCHED —
    account_label has ZERO occurrences in src/lib/headroom.ts (the only two 'account' matches in that file are
    prose in comments at :22 and :25), and test/headroom-per-account.test.ts does not exist. #1026 changed
    src/run-task.ts and added test/usage-probe-store.test.ts only. So NOTHING here was satisfied: this task is
    withdrawn by ruling, not by supersession, and none of its four criteria is being dropped as already-done.
    ORIGINAL FILING NOTE, unchanged and still true of the withdrawn product: verify:auto because headroom is pure
    window math over an injected snapshot and the loop-top check already takes an injected reader; risk:high
    because it changes the input to the only mechanism that can stop the fleet spending and names the daemon
    subsystem alongside headroom, Rule 19's threshold twice over; budget_usd 100 as the house default for two files
    with no new seam required.
    WITHDRAW-IF, now DISCHARGED: the original clause read 'W1-T266 rules for a serial switch. Say so on that ruling
    rather than implementing this.' W1-T266 ruled serial-switch (PR #1024, docs/account-selection.md). This entry is
    saying so."
