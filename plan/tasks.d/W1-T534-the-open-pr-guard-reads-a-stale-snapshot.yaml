  note: "`risk: medium` IS SET UP FRONT — Rule 19 SPAN folds `src/lib/drain.ts` and `test/drain.test.ts`
    onto ONE subsystem, and the blast radius matches: one additional injectable probe inside an
    existing predicate, changing no other module. It is a REFUSAL though, so a wrong match stops work
    dispatching — which is why design (vi)'s second direction is mandatory rather than decorative.
    budget_usd 40.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT IN PYTHON. `src/lib/drain.ts` holds
    `isDispatchEligible` (9) and `isOpenPr` (16) — the predicate and its input both live there.
    `test/drain.test.ts` is its suite (`isOpenPr` 27, `OpenPrCheck` 9, `readLiveState` 8).
    `src/run-task.ts` is NOT declared even though it holds the stale `lastProj` closure (`isOpenPr`
    17): the fix is an ADDITIONAL probe in the predicate, not a repair of the projection's freshness,
    and that file serialises every task naming it (W1-T471, 19,943 lines). AN IMPLEMENTER WHO CONCLUDES
    THE PROJECTION ITSELF MUST CHANGE MUST AMEND THIS SHARD TO DECLARE IT rather than overrunning.

    THREE CLAIMS PUT TO THIS RECON DID NOT SURVIVE AND ARE CORRECTED IN THE RATIONALE, because the
    brief asked for scepticism about its own evidence. 'Nothing refuses a second run' — false, see (1).
    '`ls-remote` spends the core budget' — false, see (4); it spends neither. And 'the query lives only
    in `reap-branches`' — it appears in `src/lib/worker.ts` (6) and `src/run-task.ts` (7) as well; what
    IS true is that it is absent from `src/lib/drain.ts` (0 hits, positive control `isDispatchEligible`
    9), which is the claim that matters.

    PROOF NOTES: all four proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
    file and one unrelated failure fails every criterion. Each was verified to match ZERO files today
    against a control matching exactly one, and each is under 100 characters with no comma so
    `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them.

    ID PROVENANCE: `refs/rmd-id/*` was swept ALONGSIDE shards and open PRs and held 515, 516, 520-533
    and 901-908 — **531, 532 AND 533 ARE RESERVED AND 531/532 ARE UNFILED; ALL WERE SKIPPED RATHER THAN
    REUSED**, which is why this is 534. The ref sweep is the only instrument that sees a
    reserved-but-unfiled id. Pushed under `--force-with-lease` with the refspec BRACED (the bare form
    applies zsh's `:r` modifier and ships a corrupt refspec the exit code does not catch), the exit code
    captured into a VARIABLE rather than read through a pipe, and the ref RE-READ with its
    host-pid-nanosecond NONCE matched against the one written."
