  falsifier: |
    If a fresh three-form union read shows any verdict row carrying
    `check: "spawn-transport-failure"`, W1-T2249's exclusion has begun to fire and the population
    this task addresses must be re-derived against it rather than against the 94 rows that all
    read `outside-cwd-denial` today. The read control for that re-run is `dispatch.skipped` at 10
    live plus 2,075 rotated, with each form counted separately and the `.gz` form reported as
    empty rather than globbed silently.

    SEPARATELY FALSIFYING: if any task is found whose `no_pr` runs alone reach the bound and whose
    breaker would be cleared by the discriminator, the rule is too wide and must be re-derived —
    the whole claim is that `blocked_containment` and `no_pr` separate the false positive from the
    true one, and W1-T2323's five `no_pr` runs are the standing control for that separation.

    AND IF the containment probe is ever changed so that a refusal happens AFTER the task worker
    has run, the premise in (4) is void: the discriminator would then exclude runs that did test
    the task, and the counter would stop bounding the thing it exists to bound.
