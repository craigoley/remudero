    - claim: "the sweep and the board show the actor beside the claimed name and flag a mismatch"
      proof: 'grep: test("W1-T7721: the sweep and the board show who really set a hold" in test/a-merge-hold-records-who-really-set-it.test.ts'
    - claim: "a human at a real terminal with no agent markers is unchanged"
      proof: 'grep: test("W1-T7721: a human at a real terminal is unchanged" in test/a-merge-hold-records-who-really-set-it.test.ts'
  falsifier: |
    Leave the row with only `by`/`reason`/`authority`: the actor test finds no actor object. Keep authority hard-coded
    to interactive-cli: the agent test sees a "Craig Oley" hold written from a CLAUDECODE session and read back as a
    confirmed human hold. Leave the sweep reason as `held by ${by}`: the display test sees the claimed name with
    no actor and no mismatch flag.
