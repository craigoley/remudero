  note: "risk:high IS SET UP FRONT — Rule 19 SPAN across src/ and test/, and independently warranted:
    this edits a PR body automatically, so a wrong repair rewrites a human-visible claim without
    anyone reading it.
    FILED AFTER THE BUILD, AND THAT IS RECORDED RATHER THAN HIDDEN. #1955 implements this and its
    body originally asserted this shard as part of its own changeset while never committing it; two
    of its acceptance proofs greped this file and were removed rather than left to fail closed, since
    a `grep:` proof that misses is `executed_fail` and OVERRIDES the keyword floor. Restoring those
    two proofs is safe once this merges.
    THE ID WAS NOT MINTED HERE. `refs/rmd-id/W1-T908` was ALREADY held by the implementing lane —
    a genuine reservation over the empty tree by remudero-worker at 2026-08-16T11:32:34Z, three
    minutes before #1955 opened. A gated push with a fresh nonce was attempted and CORRECTLY REFUSED
    (exit 1, readback sha not the one written), which is exactly what the force-with-lease gate is
    for; the id was then used rather than re-taken. Positive control: refs/rmd-id/W1-T527 read 1.
    files: MATCHES THE IMPLEMENTATION'S OWN DIFF rather than being derived independently, because the
    build already exists: #1955 touches src/run-task.ts (+113) and test/retro-acceptance-repair.test.ts
    (+174/-2), and nothing else. Declaring a path that PR does not touch would fail
    inverseScopeUntouchedFiles.
    PROOF NOTES: the four proofs are NAME-FILTERED titles, each verified present exactly once under
    test/ on the implementing branch and absent from origin/main, and each under 100 characters with
    no comma."
