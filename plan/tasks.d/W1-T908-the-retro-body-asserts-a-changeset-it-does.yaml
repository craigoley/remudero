  design: |
    THE SHAPE: the sentence about the changeset stops being templated and starts being computed,
    at the one point in the run where the changeset is knowable. No ordering change to the
    companions, no new command, no change to what the retro writes.

    (i) COMPUTE, DO NOT TEMPLATE. A repair that runs beside `repairRetroAcceptanceBlock` reads
    the PR's real changed paths and rewrites the body's changeset sentence to NAME THEM. Paths,
    never a count — see (iii). The read is the PR's own file list, so it observes whatever the
    run actually produced rather than whatever the prompt predicted.

    (ii) THIS IS NOT AN ORDERING FIX AND THE DISTINCTION MATTERS. The body genuinely cannot be
    written correctly at authoring time: the worker opens the PR before the companions exist, and
    no reordering fixes that without either making the worker wait on the harness or making the
    harness regenerate before the worker runs — the second is impossible, because ORIENTATION.md
    is regenerated FROM what the Architect just wrote. The correct home is the post-hoc rung that
    already runs after all three commits and already edits the body. A diff read bolted onto the
    worker's own render would run too early and would still be wrong.

    (iii) EMIT PATHS NEVER COUNTS. `bodyContradictsDiff` reads 'exactly N files' as a scope claim
    and fails the PR on it; that phrasing is what refused four PRs. The replacement sentence must
    name the paths and must not contain a count, so a run that regenerates two files or four is
    correct without anyone editing a number. A HARDCODED THREE IS THE SAME DEFECT WEARING A NEW
    NUMBER.

    (iv) STOP THE PROMPT INDUCING IT. `retroPrompt`'s scope instruction stays — the worker really
    must not touch src/ or test/ — but it must stop telling the worker to characterise the PR's
    changeset, because the worker cannot know it. The instruction becomes about what the worker
    edits, and the body sentence becomes the harness's to write.

    (v) THE SEAM SHAPE, AND WHY IT IS NOT A NEW READ PATH. The changed-path read is an injectable
    parameter appended LAST so no positional caller shifts (the #977/#978 rule), defaulting to
    the same `gh` call the surrounding code already makes. Tests inject a recorder; the default
    is exercised so the seam's own body is not left uncovered.

    WHAT MUST NOT BE BUILT: any change to `isInPlanScope` — it is correct and was never
    implicated; any reordering of `regenerateOrientation` or `regeneratePlanIndexAndCommit`;
    any removal of either companion from the changeset; a new ledger step where an existing one
    would do; a retry; and any edit to #1943 or #1944 themselves, which are the operator's.

    THE ADJACENT ITEM, NAMED AND DELIBERATELY NOT FILED HERE: `rmd check-proof` answers 'does it
    match?' while the reviewer SEPARATELY downgrades a proof matching both head and base to
    `executed_stale`, so a proof reads `verdict: pass` locally and substantiates nothing in
    review. It hit twice in one body on #1943 and #1189 merged at 2/4 because of it. It is a
    SEPARATE CONCERN from this one and another lane is filing it; it is named here so it is not
    absorbed into this task or lost.
