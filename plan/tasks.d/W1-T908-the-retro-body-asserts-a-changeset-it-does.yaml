    - claim: "the templated single-file claim does not survive the repair"
      proof: "unit test: W1-T908: the templated one-file claim is replaced rather than left standing"
    - claim: "the changeset is read at a point where the companion files already exist"
      proof: "unit test: W1-T908: the changeset is read after the harness companions are committed"
