  falsifier: |
    Replay W1-T9001-1791904881258 at 15:55:01Z with a fake contained Codex process that keeps streaming
    `worker.activity` events: abort the spawn's signal the way `endRound` does. At origin/main the counting teardown
    stays at 0 and the spawn promise stays pending until the fake emits exit on its own. With the change, teardown
    runs once in the same tick and the spawn settles. Remove the listener and the first test reds. Drop the
    already-aborted check and the second reds. Tear down on any exit and the third reds.
