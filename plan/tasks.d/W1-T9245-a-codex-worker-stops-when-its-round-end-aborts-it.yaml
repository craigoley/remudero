  rationale: |
    READ on origin/main a28c3d23a against the core ledger union on host remudero (~/rmd-state2/state: every
    ledger.2026-10-1[123]*.ndjson.gz rotation plus the live ledger.ndjson, read 2026-10-13 ~16:20Z, niced). Symbols,
