  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/feedback-triage-claim.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. A claim taken before every triage sits in front of
    the rung that files tasks; a mistake either blocks triage fleet-wide or admits the duplicate it
    exists to stop.

    BOTH `src/` FILES ARE DECLARED BECAUSE THE LOCK AND ITS TWO ACQUIRE SITES ARE APART:
    `triageLockPath` is defined in `src/lib/auto-triage.ts`, and both the daemon rung and the
    `rmd triage` CLI path acquire it from `src/run-task.ts`. A claim wired at only one acquire site
    leaves the other racing, which is the same shape as the defect.

    THE COUNT IN RATIONALE (4) IS CLASSIFIED, NOT ASSERTED. Ten paired entries were each read and
    split by SHAPE — seven filed-then-already-decided, two already-decided twice, one other —
    because "two triage PRs" alone would have overstated the harm for the seven where the plan was
    never poisoned. The waste is the Architect call in every case; the unresolvable-PR outcome is
    the operator's two, not these ten.

    THE SUBJECT SWEEP IS WHAT MADE THIS SHARD CORRECT, AND THE FIRST DRAFT WAS WRONG. Sweeping
    slugs across main AND every in-flight head surfaced `W1-T300-triage-inflight-dedup` and
    `W1-T1019-triage-inflight-guard-shipped-unwired`. Filed from the brief alone this would have
    claimed feedback triage has no cross-host claim at all and proposed a new ref namespace to
    supply one — when the guard already exists, is wired as of 2026-08-20, and already reads a
    source every host shares. Rationale (1)-(4) states what is actually left instead.

    ID PROVENANCE. `refs/rmd-id/W1-T1132` resolves to 0d310a18efec4b4822bf6e78dbe9745a7b703808,
    read over git protocol; live control, `refs/rmd-id/W1-T999999` exits 2. THE ANCHOR MESSAGE WAS
    NOT JUDGED. Eight id surfaces were swept plus a subject sweep, including the declared `- id:`
    inside every shard on main, and EVERY CONTROL USED AN ID VERIFIED PRESENT ON MAIN
    (`W1-T1110`) rather than one whose PR was still open — a control that reads zero because its
    own filing has not merged proves nothing.
