  falsifier: |
    Keep `lintPlanCommand` in process: with execFileSync, spawnSync and execSync trapped to throw in the parent, the
    first test's outcome is `ran: false` ("lint-plan threw"), and the second test's setInterval records no tick while
    the shard read runs. Read a killed child's empty output as zero violations: the third test passes a dead lint as clean.
