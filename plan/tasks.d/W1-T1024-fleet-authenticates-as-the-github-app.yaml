  note: |
    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS — the declared paths reach
    two concerns (github-app, run-task) and `sizingViolation` refuses that at medium. Decomposition
    is declined with a reason: a credential module with nothing supplying it to the process is the
    ships-unwired shape this fleet has already measured, so the mint and its wiring are one change.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT. `GH_TOKEN`'s three runtime sites are
    `src/lib/env.ts`, `src/lib/review.ts` and `src/lib/project-init.ts` — **NONE IS DECLARED,
    because none changes**: the refresh works precisely by leaving every reader alone. The new
    module is declared because it is the deliverable; `src/run-task.ts` is declared because the
    daemon command is where a process-lifetime refresher starts. **`src/run-task.ts` COSTS 232
    SHARDS OF SERIALIZATION (W1-T471) AND THAT IS ACCEPTED IN WRITING** — the refresher must live in
    the daemon's own process for `process.env` to mean anything to its children, and there is no
    narrower path that satisfies that. **`deploy/entrypoint.sh` IS NOT DECLARED**: the credential
    helper already re-reads the variable per call, so it needs no edit, and this therefore ships on
    the mount with no image rebuild.

    TWO CITATIONS FROM THE ORIGINATING BRIEF WERE CHECKED AND DO NOT HOLD, SO THEY ARE NOT CARRIED.
    W1-T1018 was cited as filing the boot-refusal blast radius; it is
    `W1-T1018-review-retry-budget-should-be-backoff.yaml` and files the review-orphan cap counting
    distinct pushed heads. W1-T1021 was cited as filing image drift; it has a reservation ref but
    **no shard and no declaration** (filename 0, declared 0, against a control of 1 for W1-T1018),
    so it files nothing yet. Design (iv) therefore cites the observed `loadPlan` refusal directly
    rather than a shard id that does not carry it.

    THE MEASUREMENTS ARE QUERIES. Re-derive with `git grep -woF <symbol> -- src/`, the per-form
    ledger read, and `docker exec … stat` for the key's mode — never by quoting the numbers here.
