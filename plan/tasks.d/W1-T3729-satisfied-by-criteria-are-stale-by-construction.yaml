- id: W1-T3729
  title: "THE PROOF-DISCRIMINATION GATE REFUSES `satisfied_by` CRITERIA, WHICH ARE STALE BY CONSTRUCTION — it runs every criterion the reviewer deliberately never executes, so a task whose criteria the Architect already credited to an earlier PR is unmergeable with no correct exit"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED ON PR #5852 (2026-09-17), `docs(cash): record why W1-T3693's grounding contract stays
    unimplemented`:

      proof-discrimination: FAIL — 4 proof(s) pass at both PR head and merge base
      Allowance for W1-T3693: 0 (scripts/proof-discrimination-baseline.json);
      this PR carries 4, 4 over.

    ALL FOUR of W1-T3693's criteria carry `satisfied_by:` — three citing #5797, one citing #5798.
    That field is the Architect's statement that the criterion was met by an EARLIER merge. A
    criterion met by an earlier merge passes at this PR's merge base BY DEFINITION; `executed_stale`
    is not a finding about it, it is arithmetic.

    (1) THE GATE CONTRADICTS THE REVIEWER IT CLAIMS TO MIRROR. Its own header says it "runs the
        reviewer's own parser/executor". The reviewer does not execute these criteria at all:

          src/lib/review.ts:2359   `if (criterion.satisfied_by)` -> MET, "satisfied by <pr> (prior merge)"
          src/lib/review.ts:2752   `if (criterion.satisfied_by) continue; // already credited ... not a hole`
          src/lib/review.ts:3718   `executableCriteria = criteria.filter((c) => !c.satisfied_by)`

        review.ts has a NAME for the set a proof gate should walk — `executableCriteria` — and it
        excludes `satisfied_by`. `evaluateProofDiscrimination` walks the unfiltered list instead.

    (2) THERE IS NO CORRECT EXIT, WHICH IS WHAT MAKES THIS A WALL AND NOT A GATE. The refusal names
        two remedies and both are wrong here:
          - "replace each stale proof with one that names behavior this PR changes" — the proof is
            correctly pointed; the PR changes nothing about it, which is precisely what
            `satisfied_by` records. Repointing it would make the plan lie.
          - grandfather it in `scripts/proof-discrimination-baseline.json` — that file says of
            itself that the allowance "never rises". Adding a row raises one.
        So the only ways through are to damage the plan or to damage the ratchet.

    (3) IT IS NOT ONE PULL REQUEST. `satisfied_by` is the repo's standing answer for work that
        landed in an earlier PR (§12 rule 16, and the shape #5883 was fixed into after #5868 got it
        wrong). Every task that uses it correctly meets this refusal on the next PR that carries its
        trailer. The gate punishes the correct idiom.

    (4) THE COST IS THE LOOP, NOT THE MINUTES. A PR in this state re-runs, fails identically, and
        the only progress available is an operator hand-editing a baseline — the manual
        queue-working this fleet is supposed to have stopped doing.
  design: |
    (i) FILTER ON THE REVIEWER'S OWN PREDICATE, DO NOT RE-DERIVE IT. `evaluateProofDiscrimination`
        skips a criterion carrying a non-empty `satisfied_by`, using the same truthiness test
        review.ts:3718 uses. A second notion of "executable criterion" is the drift this repo
        refuses everywhere else.

    (ii) SKIPPED IS REPORTED, NEVER SILENT. The OK line names how many criteria were credited to a
         prior merge and not executed. A gate that quietly stops looking at things is how a census
         goes hollow; the count is the thing a later reader needs to see.

    (iii) A `satisfied_by` CRITERION IS NOT COUNTED AS `executed` EITHER. The `executed` tally is
          the gate's evidence that it did work; crediting an unexecuted criterion to it would let a
          task of entirely-satisfied_by criteria report a green with a non-zero execution count it
          did not earn.

    (iv) NOTHING ABOUT THE ALLOWANCE CHANGES. `scripts/proof-discrimination-baseline.json` keeps
         every row it has and keeps its never-rises rule. This change removes criteria that should
         never have reached the count; it does not widen what the count tolerates. No row is added
         for W1-T3693 — after this, it needs none.

    NOT IN SCOPE: the whole-file `unit test: <path>` backlog the baseline grandfathers (5,368
    proofs, ~69% of the corpus) — those carry real proofs and are a different problem.
  acceptance:
    - claim: "a criterion the plan credits to an earlier PR with satisfied_by is not executed by the gate, so it can never be counted stale"
      proof: "unit test: a satisfied_by criterion is never run against the merge base"
    - claim: "a pull request whose criteria are all satisfied_by passes rather than being refused with no correct exit"
      proof: "unit test: a task whose every criterion is satisfied_by is not refused"
    - claim: "a criterion carrying a real proof is still executed and still refused when it passes at both head and base"
      proof: "unit test: an ordinary stale proof beside a satisfied_by criterion is still refused"
    - claim: "the number of criteria credited to a prior merge is reported, so the skip is visible rather than silent"
      proof: "unit test: the gate reports how many criteria it credited to a prior merge"
    - claim: "a criterion credited to a prior merge is not counted as one the gate executed"
      proof: "unit test: a credited criterion does not inflate the executed count"
  falsifier: |
    Count a `satisfied_by` criterion toward `executed` and the fifth assertion goes red — that is
    the tempting shortcut, because the criterion WAS walked. Filter on `criterion.satisfied_by !==
    undefined` rather than on truthiness and the gate diverges from review.ts:3718 for an
    empty-string value; plan.ts:287 already refuses that value at load, so both readings agree in
    practice and the test pins the reviewer's form so a later edit cannot drift. Drop the reporting
    line and the fourth goes red. Skip the whole criterion list when ANY criterion is satisfied_by
    and the third goes red, which is the mistake that would turn one correct exemption into a hole.
