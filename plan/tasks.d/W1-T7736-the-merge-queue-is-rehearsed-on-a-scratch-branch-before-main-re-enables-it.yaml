  files: [scripts/merge-queue-canary.mjs, test/the-merge-queue-is-rehearsed-on-a-scratch-branch-before-main-re-enables-it.test.ts, docs/recon/merge-queue-canary-rehearsal.md, docs/docs-index.json, src/lib/sweep.ts]
