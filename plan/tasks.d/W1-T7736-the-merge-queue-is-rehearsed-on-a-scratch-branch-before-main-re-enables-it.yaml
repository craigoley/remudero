    - claim: "a replayed head is opened against the scratch branch and enqueued, never against main"
      proof: 'grep: test("W1-T7736: a replayed head is opened against the scratch branch and enqueued" in test/the-merge-queue-is-rehearsed-on-a-scratch-branch-before-main-re-enables-it.test.ts'
    - claim: "the report records each group's completion time, outcome and the affected-suite selection it ran"
      proof: 'grep: test("W1-T7736: the report records completion time, outcome and suite selection per group" in test/the-merge-queue-is-rehearsed-on-a-scratch-branch-before-main-re-enables-it.test.ts'
    - claim: "the ruleset, replay PRs and scratch branches are torn down even when a group fails"
      proof: 'grep: test("W1-T7736: the rehearsal tears down even when a group fails" in test/the-merge-queue-is-rehearsed-on-a-scratch-branch-before-main-re-enables-it.test.ts'
    - claim: "the sweep never acts on a replay pull request whose base is the scratch branch"
      proof: 'grep: test("W1-T7736: the sweep never acts on a replay pull request" in test/the-merge-queue-is-rehearsed-on-a-scratch-branch-before-main-re-enables-it.test.ts'
    - claim: "a canary report with a go/no-go verdict exists for the operator"
      proof: 'grep: merge-queue canary verdict: in docs/recon/merge-queue-canary-rehearsal.md'
  falsifier: |
    Let the ruleset payload take its include list from a parameter with no guard: the targeting test builds a
    payload naming `~DEFAULT_BRANCH` and the harness writes it. Drop the `finally`: the teardown test throws
    from a failing group and finds the ruleset still present in the fake. Omit the selection field: the report
    test finds no `affected`/`full` entry for a group.
