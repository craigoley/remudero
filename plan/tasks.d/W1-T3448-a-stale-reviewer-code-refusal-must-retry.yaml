- id: W1-T3448
  title: "A REVIEWER-CODE FRESHNESS REFUSAL IS TREATED AS A PERMANENT VERDICT — the sweep proves a pending owner is dead and selects recovery, then its own refusal dedup vetoes that recovery forever after the reviewer source has become fresh"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 14.00
  files: [src/lib/sweep.ts, test/reviewer-code-freshness-refusal-retry.test.ts, scripts/test-tier-manifest.json]
  origin: "operator-session#dropped-review-recovery-after-daemon-oom-2026-09-12"
  plan_refs: ["W1-T913", "W1-T2753", "W1-T2844", "W1-T3337"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on the Azure fleet host 2026-09-12. Three open, green PRs are selected as
    `post-review` because the durable `remudero-review=pending` owner is proven dead, yet each
    stands down on the same exact-input key: #5209 (W1-T3335, repeat_streak 8), #5245
    (W1-T3343, repeat_streak 111), and #5247 (W1-T3345, repeat_streak 112). The #5247 live
    ledger row at 13:37:27Z is `review.post_refused`, `attempted_state:"failure"`, and
    `reviewer_code_freshness:"stale"`: reviewer code `1c3dae25b7a2` was materially behind
    origin/main `5c2e5d8b6b87`. At 18:46Z, the same deployed check reported
    `{status:"fresh",codeSha:"a5abfd0e",originMainSha:"a5abfd0e"}`. The condition that
    withheld the terminal verdict is therefore gone, but the old row still blocks recovery.

    SOURCE CONFIRMED at origin/main `a5abfd0e`. `src/lib/sweep.ts:6249-6275` sends every
    `review.post_refused` row except a diff ceiling, a thrown-attempt retry, or an already-closed
    lifecycle refusal to the permanent `reviewRefused` set. Both action-time admission
    (`claimReview`, :7045-7058) and ordinary post-review routing (:7477-7491) reject that set.
    The owner-dead rule at :4929-4941 correctly re-offers the pending review but cannot reach a
    worker. W1-T2753 bounded thrown attempts using the existing pending ceiling; it does not
    classify the independently recorded `reviewer_code_freshness` refusal, so it does not fix
    this case.
  design: |
    Classify a `review.post_refused` row with explicit `reviewer_code_freshness:"stale"` or
    `"unreadable"` as a bounded, exact-input retryable freshness outcome, not a terminal semantic
    refusal. Reuse `pendingCeilingMinutes` and the existing timestamp-based admission shape from
    W1-T2753: suppress before the ceiling with a reason that names freshness recovery; re-admit
    at or after the ceiling, or once when the old row is undated. A fresh retry that remains
    stale records a new timestamp and restores the bound; a fresh reviewer-source check that is
    now fresh delivers the ordinary terminal verdict and unblocks arming.

    Keep every other refusal class unchanged: lifecycle, precedence, decision-conflict, permanent
    diff-ceiling, and delivered review rows remain durably deduped. Do not remove status
    provenance, write a synthetic success, alter the reviewer freshness guard, weaken exact-input
    identity, increase review lanes, or add a new retry policy. This is recovery only after the
    existing freshness safety guard has withheld a verdict.
  acceptance:
    - claim: "a dead-owner pending review whose exact input has a stale reviewer-code refusal older than pendingCeilingMinutes is admitted to post-review"
      proof: "unit test: stale reviewer-code refusal is re-admitted after the pending ceiling"
    - claim: "the same stale freshness refusal remains suppressed before the ceiling and the stand-down names bounded freshness recovery rather than a durable verdict"
      proof: "unit test: stale reviewer-code refusal backs off before the pending ceiling"
    - claim: "a second stale freshness refusal advances the exact-input retry timestamp, so the worker cannot run on consecutive sweeps while code remains stale"
      proof: "unit test: a repeated stale freshness refusal restores the retry bound"
    - claim: "an unreadable reviewer-code freshness refusal and an undated old row each receive exactly one recovery admission rather than permanent suppression"
      proof: "unit test: unreadable and undated freshness refusals remain recoverable"
    - claim: "ordinary lifecycle, precedence, diff-ceiling and delivered-review outcomes remain durably deduped for the exact input"
      proof: "unit test: non-freshness review outcomes stay durable"
    - claim: "the focused recovery test is registered in the tier manifest"
      proof: "grep: reviewer-code-freshness-refusal-retry\\.test\\.ts in scripts/test-tier-manifest.json"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION if replaying the #5247 `review.post_refused` row with a proven-dead
    pending owner through `runSweep` already dispatches its post-review worker after the existing
    pending ceiling, or if `priorActionsFromLedger` already gives an explicit reviewer-code
    freshness refusal a bounded retry path. At filing neither is true: the live #5247 row remains
    `acted:false` at repeat streak 112, and source adds it to `reviewRefused` permanently.

    Mutation: restore permanent membership for the freshness row; the after-ceiling admission
    assertion must fail. Mutate the freshness classification to admit on every pass; the
    pre-ceiling and repeated-refusal assertions must fail. Mutate the classifier to include a
    lifecycle or diff-ceiling refusal; the durable-outcome assertion must fail.
  note: |
    Reservation W1-T3448 was atomically claimed on origin before filing. The source field
    `reviewer_code_freshness` makes this a bounded operational refusal, not a reinterpretation of
    review quality. This is separate from W1-T3447's worker-output allocation boundary.
