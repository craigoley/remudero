- id: W1-T9993
  title: "EVERY DAEMON PLAN HOLDER TAKES THE REVISION, NOT A COPY — W1-T9763 gave the self plan one frozen instance per revision and a tick read that posts the revision, but (a) a plan loaded from disk, for a non-self target or an explicit --plan, has no revision, so revisionedRead still posts it whole to the tick-read worker on every tick; and (b) buildSweepHook and buildSweepLightHook take the boot plan by value beside their accessor, and daemonCommand's own `plan` binding feeds the plan copy book and runDaemon, so the boot revision stays alive after a reload"
