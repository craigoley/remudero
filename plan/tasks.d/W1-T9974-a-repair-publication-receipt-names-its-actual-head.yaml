  design: |
    1. Add a small versioned, bounded repair-publication receipt at the maintained parent
       runFixRung publication boundary. A pure renderer consumes the already-observed
       repository/PR, actual head/base, current repo-relative changed paths and admission
       classes. It labels inherited author/native/scoped evidence with its ORIGINAL SHA,
       never upgrades it to the new head, and names new checks as pending/unknown until
       current-head receipts actually exist. Persist a content-addressed manifest before
       any optional external receipt. Reuse the existing exclusive parent repair owner,
       durable evidence and bounded async transport rather than a new owner service.
       Wire reconcileFixPublication from the real ci-log/conflict/review repair paths in
       src/run-task.ts, not a fixture-only caller or dummy production text.
    2. The new reconciler NEVER updates a PR body. Preserve the canonical task trailer,
       Acceptance/claim/proof bytes, human rationale and historical receipts. Default to an
       opt-in SHADOW would-publish observation and durable manifest. Any separately authorized
       public sink is a NEW machine-owned PR conversation comment, not a replacement body or
       an edit to an existing comment. Label preceding author narrative as potentially historical;
       never certify it, replace behavioral proofs with grep, guess discrimination or invent
       review/merge success. No receipt write on a no-change pass; rendering is byte-idempotent.
    3. Bind manifest schema/digest, numeric repository/PR/actor/receipt identity, exact head/base,
       scope and as-of observations. Keep original-SHA lineage even when the head moves.
       Before a public write/reuse, refresh current ownership, head, scope and a complete bounded
       receipt corpus with positive controls. Moved/unreadable input, a human-edited receipt,
       duplicates or ambiguous writes remain durable stale/unknown, never certified publication.
       An uncertain POST is not blindly retried: reconcile through the existing owner with a
       bounded disposition. Promise logical dedupe, NOT unsupported global exactly-once creation.
       Bot write-once does not remove owner/admin editing authority. No private absolute roots,
       tokens, registry/config bytes or private source material enter the public projection.
       Actor admission is NOT private-source publication permission. A manifest grants no scope
       or publication authority; W9973 independently checks the actual first parent push.
       No extra reviewer, blanket trusted-PR hold or gate waiver.
    4. Drive actual runFixRung ci-log and conflict repairs with recording transports and
       disposable Git defaults/catches. Use the real12-to14path shape and a different-size
       positive control, plus unchanged-head/no-edit, stale native failure, skipped/unknown
       checks, unsupported/malformed receipts, sink failure, concurrent human edits and changed
       heads. Trap body-update effects, lost-ack POST success, edited bot comments and private
       publication independently. Test immutable argument snapshots, real bounded async defaults
       and every catch; missing evidence stays unknown without globally holding trusted flow.
       Remove actual receipt forwarding to fail then restore to pass. Prove the stored body
       still resolves unchanged canonical criteria with zero empty proofs; parsing is not proof
       execution, hosted CI, review, merge, deployment or live uptake.
    5. Fresh duplicate/ALL-open subject/frontier/ownership checks precede work and publication.
       Commit before verified TAP and source-mapped diff coverage for every changed SF;
       shipped host slots and one native per changed committed tree, with every failure
       compared on that run's actual unchanged base. Preserve all failures/unknowns.
       Workers continue for isolated source/tests. No new schedule, live config/settings,
       credential/access change, deployment, closure, scheduler activation or worker stop.
       Keep new registry/admission/publication behavior opt-in SHADOW ONLY, public Apache core
       and independent owner/admin override. This plan amendment activates no external sink.
       Confirm its actual normal merge before implementing this changed publication contract.
