  origin: "operator instruction 2026-10-17: keep exact-head repair evidence truthful without rewriting canonical proofs or human prose"
  plan_refs: [W1-T307, W1-T911, W1-T1264, W1-T9793, W1-T9973]
  files: [src/lib/fix-publication.ts, src/run-task.ts, test/a-repair-publication-receipt-names-its-actual-head.test.ts, test/fixrung-body-claim.test.ts]
