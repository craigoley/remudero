- id: W1-T388
  title: "`resolveLedgerUnion` compiles and validates its pattern AFTER the zero-archive early return, so on a root with no archives a malformed, over-long or rejected pattern is reported as `ok: false, archiveCount: 0` — indistinguishable from a missing archive set — while the same pattern on a host WITH archives throws uncaught"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: "RE-SCOPED 2026-08-07. THE SECURITY FRAMING IS WITHDRAWN — it was closed by the very PR
    that filed this task — AND THE ORDERING DEFECT STANDS, re-derived by execution at 3c63dd9.
    WHAT THE ORIGINAL FILING GOT WRONG, stated first so no future reader inherits it. The title and
    rationale described a bare unguarded compile. That is no longer true and arguably never reached
    main: `sanitizeRegExp` was added by #1436 ITSELF in response to the CodeQL alert, so the call at
    this sha reads `new RegExp(sanitizeRegExp(pattern))`. The `js/regex-injection` framing is
    therefore CLOSED and must not be carried forward. The two defects the filing actually rested on
    are a different matter and are re-measured below.
    ALSO PARTLY CLOSED: THE UNBOUNDED MATCH. `sanitizeRegExp` rejects a pattern past 200 characters
    and rejects the canonical nested-quantifier shape. The filing's own 10861 ms measurement used
    `^(a+)+$`, which is now REJECTED before it can compile. So the headline example no longer
    reproduces. WHAT IS NOT CLOSED: the rejection is a single shape test, and re-running it directly
    at this sha, alternation-based shapes are ACCEPTED — a group alternating two equal branches under
    a quantifier, and a bounded-repetition group under a quantifier, both pass. WHETHER THOSE ACTUALLY
    BACKTRACK CATASTROPHICALLY ON THIS ENGINE IS UNMEASURED and must be measured before any claim that
    the bound is complete. Do not restate the 10861 ms figure as live evidence; it belongs to a
    pattern the code now refuses.
    WHAT FULLY STANDS, AND IS THE TASK. `resolveLedgerUnion` returns early when
    `archiveFiles.length === 0`, and the compile plus `sanitizeRegExp` sit BELOW that return. So every
    validation the module performs is unreachable on a root with no archives. Measured directly at
    this sha against a synthetic state root, same three inputs both ways:
    WITH one archive — a malformed pattern throws SyntaxError (Unterminated character class); a
    nested-quantifier pattern throws the rejection Error; an over-length pattern throws the too-long
    Error. ALL THREE UNCAUGHT.
    WITH zero archives — all three return `ok: false, archiveCount: 0, matches: []`, the SAME verdict
    a perfectly valid pattern gets on an empty root. The operator is told there are no archives. He is
    not told his pattern is invalid.
    THE ORDERING DEFECT IS WIDER THAN WHEN FILED, not narrower. #1436 added two more rejection classes
    and placed them on the same side of the early return, so there are now three distinct failure
    modes that vanish into the zero-archive verdict instead of one.
    AND THE UNCAUGHT THROW IS DELIBERATE, WHICH IS WHY IT NEEDS A TASK RATHER THAN A PATCH.
    `sanitizeRegExp`'s own doc says it throws the same way a syntactically invalid pattern already
    does — uncaught, non-zero exit — and that it adds a rejection class rather than error-handling
    plumbing. That was an honest scoping decision by #1436. This task is where the plumbing gets
    written, in a function that is otherwise meticulous about it: `resolveLedgerUnion` already returns
    a named verdict for an unreadable state dir and for zero archives, and treats an unreadable dir as
    zero archives rather than throwing.
    THE SUITE STATES THE INVARIANT IT MISSES. test/ledger-grep.test.ts carries tests whose titles end
    `never a throw`, for the unreadable state dir and the unreadable config. Every one of its cases
    passes a valid pattern. The no-throw discipline was deliberate; the pattern path is the one nobody
    wrote a case for."
  design: |
    (i) WRITE THE FALSIFIER FIRST AND WATCH IT FAIL (tdd:strict), AND ENCODE THE ORDERING IN IT. The
    case is a state root WITH at least one archive — a bad pattern against an archive-less root proves
    nothing, because the early return means nothing is ever validated. That single detail is what the
    existing suite got wrong by omission, so the regression lock has to encode it or it locks nothing.
    Pair it with the zero-archive arm, which must report the pattern problem POSITIVELY rather than
    silently returning the zero-archive verdict.

    (ii) DECIDE WHERE VALIDATION BELONGS, AND SAY WHY. The cheapest correct move is to validate the
    pattern BEFORE the archive scan, so the answer does not depend on what happens to be on disk. That
    changes the verdict on an archive-less root from "no archives" to "bad pattern", which is a
    behaviour change on a currently-silent path and must be stated rather than discovered. If it is
    left where it is instead, the zero-archive return must still surface the pattern problem — one or
    the other, never neither.

    (iii) GUARD THE THROWS, DO NOT ESCAPE THE PATTERN. Escaping would make the argument a literal
    string and destroy the verb: `rmd ledger-grep 'run\.(start|end)'` is the intended usage. Wrap the
    compile and the sanitizer, and on failure return a NAMED error in the same shape as the two errors
    this function already returns — the offending pattern echoed back and the engine's own message,
    which is specific enough to fix a typo from. All THREE throw classes need covering, not just the
    SyntaxError the original filing named.

    (iv) EXIT CODES MUST STAY DISTINGUISHABLE. A malformed or rejected pattern is a USAGE error, not
    the zero-archive verdict, and a caller must be able to tell a typo from a missing archive set.
    That is the whole point of the defect, so it is the thing most worth asserting.

    (v) THE ReDoS BOUND IS NOW A NARROWER, MEASURED QUESTION — do not re-litigate the whole of it.
    `sanitizeRegExp` already rejects the canonical shape. Establish by MEASUREMENT whether the
    alternation-based shapes it accepts actually backtrack catastrophically here; if they do, widening
    the shape test is in scope and the number must be justified on evidence. If they do not, say so and
    leave the bound alone. A bound that fires on a healthy condition is this repo's recurring defect
    (W1-T312, W1-T380, W1-T382), so whatever is chosen must be shown NOT to trip on the ordinary
    patterns this module's own tests already use.

    NOT IN SCOPE: the union semantics, the archive glob, the CLI's output shape, and the CodeQL alert
    — which is closed and must not be reopened as a justification for anything here.
  acceptance:
    - claim: "a malformed pattern against a state root that HAS archives returns a named usage error instead of an unhandled SyntaxError"
      proof: "unit test: test/ledger-grep.test.ts"
    - claim: "a pattern the sanitizer rejects for length or shape also returns a named usage error rather than throwing uncaught"
      proof: "unit test: test/ledger-grep.test.ts"
    - claim: "an invalid pattern against a state root with ZERO archives reports the pattern problem, so it is distinguishable from a valid pattern finding no archives"
      proof: "unit test: test/ledger-grep.test.ts"
    - claim: "the pattern-error exit code stays distinguishable from the zero-archive verdict, so a caller can tell a typo from a missing archive set"
      proof: "unit test: test/ledger-grep.test.ts"
    - claim: "the guarded verb is still reached from the CLI dispatch rather than being a module nothing calls"
      proof: "grep: ledgerGrepCommand( in src/run-task.ts"
