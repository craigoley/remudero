  note: "verify:auto — every claim is an in-process assertion over resolveLedgerUnion and
    ledgerGrepCommand against a synthetic state root, decidable with no operator present.
    risk:high is Rule 19's SPAN, NOT blast radius, and the distinction is the whole of it. The
    sizing check reads files: as two concerns (ledger-grep, run-task) and refuses medium — filed at
    medium first and corrected before push rather than shipped as a violation. The actual blast
    radius is LOW twice over: the diff is one guard plus one bound, and the verb is not on main yet,
    so a defect here cannot regress anything currently shipping. Do not read the band as danger.
    DECOMPOSING WOULD BE FAKE. Splitting the guard from the exit code it returns separates a
    predicate from the only place its result is observable — the same non-decomposition CLAUDE.md
    records from PR #1400.
    src/run-task.ts IS DECLARED DELIBERATELY, not defensively. Design (ii) puts the malformed-pattern
    exit code in ledgerGrepCommand, which lives there — a path a worker writes must be declared, and
    omitting one is what refused five dispatches in a week. It is also what criterion 4's call-site
    proof names, and a proof pointing outside files: is a warning now and a scope-guard REFUSAL after
    the work is done.
    depends_on W1-T379 IS LOAD-BEARING, not bookkeeping. src/lib/ledger-grep.ts does not exist on
    main — PR #1436 adds it. Dispatching this before that merges gives a worker a files: entry with
    no file behind it. If #1436 is ever abandoned rather than merged, this task should be withdrawn
    with it, not re-pointed at something else.
    budget_usd 45 — below W1-T386's 70: the diff is one guard and one bound in a single module. The
    cost is design (iii), choosing a backtracking bound on evidence and proving it does not fire on
    healthy patterns, not the edit.
    ON THE PROOFS. All three use the pure-path form against test/ledger-grep.test.ts, which EXISTS
    today on #1436's branch and is declared in files:. Pure-path is the shard-legal form CLAUDE.md
    names: it lint-passes and the executor runs the whole file, unlike the
    test/foo.test.ts::title form which satisfies lint-plan and then matches zero tests.
    THE MEASUREMENTS ARE FROM THIS CONTAINER at 1d5a2cb: the SyntaxError text verbatim from
    new RegExp('['), and 10861 ms for ^(a+)+$ over a 29-character subject. Re-derive the timing
    before setting any bound — it is hardware-dependent and a threshold copied from this note
    would be a number nobody measured on the host that runs it."
