  note: |
    WHAT MUST NOT CHANGE.

    NOTHING PACES, SLEEPS OR POLLS FASTER. The 60,000 ms poll interval is a floor measured intact on
    every one of 11,772 recorded gaps, and W1-T1066 records what happened the last time a loop here
    polled: an operator locked out of his own repository for ninety minutes. No shorter interval, no
    second ticker, no new timer, no retry cadence. The remedy is to stop the tick WAITING, never to
    make it come round sooner.

    THE TWO-STRIKE FIX CEILING STAYS. Detaching a wait must not detach the bound that stops the fix
    rung retrying forever, and a strike must still be spent exactly once per head.

    THE ONE-PER-PASS REVIEW ADMISSION STAYS. `selectReviewAdmission`'s bound is a spend bound over a
    spawning verb. It is named in design (iii) so it is not mistaken for this defect, and it is not
    raised, relaxed or made conditional.

    W1-T1211's ADMISSION STAYS. `blocked-fixable` and `conflicted` remain admissible to the light pass
    under `fixRungAllowed`. A build that re-narrows the light pass has undone a shipped improvement
    and answered a different question.

    THE OPERATOR GATES EVERY MERGE, and nothing here changes what any disposition is permitted to do
    — only when the loop that computes them is free to run again.

    THE FIGURES ARE QUERIES, NOT NUMBERS TO CARRY. 821, 71s, 847s, 4,127s, 29%, 125-across-68 and the
    16m41s trace are stamped with the date and sha they were read at and will move. Re-run them; no
    acceptance criterion asserts any of them, deliberately.

    RULE 19 BAND. `risk: high` is set UP FRONT for the SPAN of the declared `files:` — two source
    modules and a test — and carries no claim about blast radius.

    THE FORWARD REFERENCE IS DELIBERATE. The declared test file does not exist yet; it is named in
    `files:` so the pure-path proofs resolve under the forward-reference carve-out and read
    `not_yet_built` until the build lands. Every proof is pure-path `unit test:`, so this shard
    carries no `grep:` pattern at all.
