- id: W1-T2203
  title: "THE ID RESERVATION NAMESPACE IS UNREADABLE BY THE MINTER AND UNWRITABLE BY ONE CLASS OF LANE — `next-task-id` reserves into `refs/rmd-id/*` and never reads it, so a stray reservation is invisible to the very verb that would trip over it, while a push to that namespace from an agent container returns HTTP 403 in the same second a branch push succeeds"
  repo: remudero
  depends_on: []
