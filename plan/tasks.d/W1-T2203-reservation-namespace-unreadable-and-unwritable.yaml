  note: |
    RISK BAND — BOTH READINGS, BECAUSE THE BAND EXEMPTS THE CHECK RATHER THAN CLEARING IT.
    `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` at `risk: high`, so a `high`
    band means the span was NEVER SCORED, not that it was scored and found narrow. The `files:`
    list was measured at `risk: medium` first and that reading is recorded in the PR. The real
    blast radius is high independently of Rule 19: this changes how ids are handed out fleet-wide,
    and a minter wired wrong stalls every filing lane at once.

    NO PROOF GREPS THIS SHARD'S OWN PATH. All five criteria use the pure-path `unit test:` form
