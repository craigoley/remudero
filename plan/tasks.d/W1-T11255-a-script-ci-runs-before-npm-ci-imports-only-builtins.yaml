- id: W1-T11255
  title: "Every script a CI step runs before its job's npm ci (or where a fast-lane if can skip that install) loads only Node built-ins and repo files at module scope, enforced by a census over the workflows' steps and each script's static import closure — #16275's top-level @swc/core import reddened every plan-only PR's mutation-ratchet for 2.5 h"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # one concern: a census of what CI's pre-install steps may import; test-only plus its precheck parity row
  origin: operator-session#ci-preinstall-imports-2026-11-03
  plan_refs:
