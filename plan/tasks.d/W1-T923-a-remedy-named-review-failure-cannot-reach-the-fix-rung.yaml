  rationale: "FILED FROM the fix-rung recon of 2026-08-16, evidence re-derived at origin/main 8d3e609
    and over the full ledger union (union deduped across all three forms).

    (1) **THE MOTIVATING CASE, WITH ITS OWN LEDGER ROW AS THE EVIDENCE.** #1991 failed review and
    NOTHING fired — no strike, no dispatch. Its `review.posted` row reads `task_id: PR-1991`,
    `state: failure`, `unmet_criteria: []`, `reasons: []`, `proof_exec: [executed_pass x12]`,
    `failure_class: test_theater`, and a `failure_reason` naming the two exact strings that would
    satisfy the check. Its 49 sweep rows carry `wait`, one `post-review`, and light-pass
    `blocked-ambiguous` deferrals — **ZERO `blocked-fixable`**, against a positive control of 105
    `blocked-fixable acted:true` rows elsewhere in the same corpus.

    (2) **THE CAUSE IS NOT A MISSING TASK ID, AND THE OBVIOUS FIX IS ALREADY SHIPPED.** The
    commissioning hypothesis was `armAutoMerge`'s `if (!taskId)` shape, fixed by passing
    `taskId ?? PR-<n>`. Re-derived: THAT ID ALREADY EXISTS AND IS ALREADY USED — the row above is
    keyed `PR-1991`, minted by `escalationTaskIdFor` (`src/run-task.ts`), and W1-T456's comment
    records that `fixRungTaskFor`'s synthetic-task branch 'already knows how to dispatch against
    with no plan task at all'. **THE DISPATCH SIDE IS ALREADY TRAILER-AGNOSTIC.** Nothing inside the
    rung refused #1991; the rung was never REACHED.

    (3) **THE REAL GATE IS THE ROUTE IN.** Both `blocked-fixable` rows of `DISPOSITION_RULES`
    (`src/lib/sweep.ts`) require `pr.unmetCriteria.length > 0` or `isBlockedCi(pr)`. For #1991
    neither held — every acceptance criterion PASSED (12 of 12 `executed_pass`), so the list is
    empty for the one reason nobody designed for: **THE VERDICT FAILED ON A GATE, NOT ON A
    CRITERION.** Row 7 then correctly routes it to `blocked-ambiguous`. That is not a bug in the
    routing; it is a population gap upstream of it.

    (4) **THE POPULATION, MEASURED AND NOT OVERSOLD.** Across 41 failing reviews of 261 posted:
    by class, `unmet_criteria` 17, `changeset_contradiction` 16, `instrument_entangled` 3,
    `criteria_tampered` 2, `test_theater` 2, `no_criteria` 1. **22 carry a non-empty
    `unmet_criteria` and 19 do not.** Splitting by whether the `failure_reason` names a concrete
    remedy: **18 remedy-named against 23 judgement-or-other — a MINORITY, not a majority.** The
    cross-tab is the actual target: **15 OF 41 ARE REMEDY-NAMED AND HAVE AN EMPTY
    `unmet_criteria`**, so they name their own fix and can never reach the rung. **37%, AND THE
    SHARD SAYS 37% RATHER THAN CLAIMING A MAJORITY.**
    One caution recorded because it nearly shipped a false zero: a first census read **0** failing
    reviews against a live control of 261 `review.posted` rows, because it searched verdict prose
    instead of the structured fields. Every figure above comes from `failure_class`,
    `unmet_criteria` and `failure_reason` on the row itself.

    (5) **AND A SEPARATE FINDING THE IMPLEMENTER MUST NOT BUILD ON: THE CLASSIFIER DISAGREES WITH
    THE REASON.** #1991 is classified `failure_class: test_theater` — the class this design would
    call unautomatable — while its `failure_reason` names two exact strings. **A PREDICATE KEYED ON
    `failure_class` ALONE MIS-SORTS THE MOTIVATING CASE.** That is a defect in the classifier, not
    in the rung, and it is NOT fixed here; it is recorded so nobody keys the new list on that field."
  design: |
    THE SHAPE: populate a NEW actionable list from GATE failures, keyed on the `PR-<n>` id that
    already exists, and let the existing routing consume it. No new detector, no new rung, no
    loosening of any existing field.

    (i) A SIBLING LIST, NEVER A WIDENING OF `criteriaRecoverable`. **OPERATOR RULING, 2026-08-16:
    THE PROHIBITION STANDS.** `criteriaRecoverable`'s own doc pins it strictly to "did a
    `Remudero-Task:` trailer resolve a task id", says widening it "would read as silently crediting
    an unattributed PR, which #1527 forbids", and `test/openpr-taskid-resolver.test.ts` locks a
    plan-only filing PR to `criteriaRecoverable: false` regardless. **DO NOT TOUCH THAT FIELD, ITS
    MEANING, OR ITS LOCK.** The new list is an independent sibling on `OpenPrView` carrying gate
    failures; a PR may have an empty `unmetCriteria`, `criteriaRecoverable: false`, and a non-empty
    actionable list all at once, and that combination must stay legible rather than being collapsed.

    (ii) POPULATED WHERE THE EXISTING ONE IS, FROM THE SAME LEDGER READ. `buildOpenPrViews`
    (`src/run-task.ts`) already computes `filingUnmetKey = !taskId && isPlanOnlyFilingPr(...) ?
    PR-<n> : undefined` and `unmetKey = taskId ?? filingUnmetKey`. The gate-failure read belongs
    beside it, keyed on `taskId ?? PR-<prNumber>` with NO `isPlanOnlyFilingPr` restriction — that
    restriction is what confines today's carve-out to plan filings, and #1991 is a `DECISIONS.md`
    PR, not a filing. This widens WHERE an actionable failure can be read from; it does not widen
    what "recoverable" means, which is exactly the line W1-T456 already drew for `unmetCriteria`.

    (iii) THE ROUTE IN IS ONE ADDITIONAL DISJUNCT, NOT A NEW RULE. `DISPOSITION_RULES`'
    `blocked-fixable` rows gate on `pr.unmetCriteria.length > 0 || isBlockedCi(pr)`. Add the new
    list as a third disjunct so a gate failure with a named remedy routes the same way a criterion
    failure does. Row 7's `blocked-ambiguous` arm and both of its reason strings must stay
    byte-identical for every PR that does NOT carry the new list — that is the regression the
    suite has to pin first.

    (iv) THE PREDICATE IS ONE REMEDY FORM VERSUS A CHOICE, AND IT IS THE PREDICATE RATHER THAN A
    CAVEAT. A remedy with a single form is automatable; a remedy offering a CHOICE is not. #1991 is
    the case that proves it: the provenance check accepts `Chosen (RECOMMENDED, auto)` OR an
    operator-attribution line, and those credit different authors. **A WORKER PICKING THE WRONG ONE
    MISATTRIBUTES A RATIFIED RULING IN `DECISIONS.md`, THE FILE WHERE A FALSE CLAIM DOES THE MOST
    DAMAGE.** So a two-form remedy must be EXCLUDED from the actionable list, not merely flagged
    inside it, and the falsifier must drive exactly that shape.

    (v) DO NOT KEY ON `failure_class`. Rationale (5): #1991 is `test_theater` while naming two exact
    strings, so that field mis-sorts the motivating case. Whatever populates the new list must key on
    the presence of a single-form remedy, and a test must pin that a `test_theater`-classed row with
    a named single-form remedy still qualifies — otherwise this task reproduces the very mis-sort it
    documents.

    (vi) STRUCTURED, NOT PARSED OUT OF PROSE, AND SAY SO IF THAT IS NOT POSSIBLE. The row already
    carries `failure_class`, `unmet_criteria`, `reasons` and `failure_reason` as fields. A regex over
    human-readable verdict prose is brittle and rots silently, which is worse than no automation. If
    the single-form remedy cannot be identified without parsing prose, THE HONEST OUTCOME IS TO
    REPORT THAT AND EMIT A STRUCTURED REMEDY FROM THE CHECK ITSELF instead — a smaller, sounder task
    than a parser nobody will notice going stale.

    (vii) CONTAINMENT ALREADY EXISTS AND IS NOT WEAKENED. The two-strike cap stands untouched — it is
    evidence discipline in code, and if two patches have not moved the symptom the answer is more
    data, not another patch. Under W1-T919's ruling the fleet gates on IRREVERSIBILITY: a fix
    worker's push is a commit on a branch, which is reversible, and it mints a new head that re-earns
    review. That containment claim is NOT re-derived here and must be verified by the implementer
    before it is relied on.

    (viii) EDITING A SESSION PR IS A DIFFERENCE OF DEGREE, NOT KIND — the fleet already reviews, arms
    and merges them (W1-T516). Recorded because it is the honest objection, not because it blocks.

    WHAT MUST NOT BE BUILT: any change to `criteriaRecoverable`'s meaning, its value, or its
    regression lock; a weakening of the two-strike cap; a predicate keyed on `failure_class`; a regex
    over `failure_reason` prose presented as robust; a new ledger step (five fired-and-unread signals
    are already measured — `daemon.tree_dirty`, `daemon.stale_code`, `CiFailure.outsidePrRange`,
    `dh-rate-limit`, `dispatch.stood_down`); and any attempt to fix the classifier disagreement,
    which is its own concern.
