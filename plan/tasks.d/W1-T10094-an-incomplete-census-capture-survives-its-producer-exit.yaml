  rationale: |
    OBSERVED in three fresh-process controls on actual unchanged production readers:
    runCensusSuitesViaChild reports an incomplete child's private capture as retained.
    Its native.json exists before the producing process exits, but is absent afterwards
    when that process uses the maintained tmp-hygiene preload. The same real incomplete
    capture survives when explicitly registered with the existing retainFixture map.
    A healthy child remains a positive control. Normal host admission, physical fixtures,
    source digests and complete command output are retained privately; these observations
    are not three TAP tests, a native pass, or evidence for a historical timeout's cause.
    runCensusChild creates its capture with mkdtempSync; tmp-hygiene records that directory
    and removes it at exit unless the shared retention map names it. The existing timeout
    test reads native.json inside its producing process, so it cannot falsify this loss.
    W9794's exact native-base reproduction passed: its original timeout cause stays UNKNOWN.
    W9919 separately owns the loaded census-child timeout disposition and the same script;
    this task waits for that actual merge and preserves its decision rather than competing.
  design: |
    1. Reuse ONE retention contract for production capture and the maintained fixture exit
       sweep. If a dependency-free shared MJS module is necessary, move/re-export the
       existing retention implementation; do not create a second registry, test-only
       production hook, daemon scanner, broad environment exemption or blanket temp hold.
    2. Register only the real incomplete capture when the production reader says it is
       retained. Keep its original error/status/signal/output-completeness/native receipt
       and private location. A missing or unwriteable capture remains explicit unknown;
       never manufacture evidence or turn a timeout, unreadable tree or failed test green.
       Complete captures retain their existing cleanup. A receipt is not public permission.
    3. Prove fresh-process behavior through the actual production child/default and actual
       tmp-hygiene preload: the owned incomplete capture is readable after producer exit,
       complete/healthy cleanup remains, explicit fixture retention still works, and
       malformed/unreadable evidence stays unknown. Tests remove their own expected
       diagnostic fixtures after checking them; unexpected failures retain useful evidence.
       Bound and reap only their own disposable child groups, never a peer worker.
       Register an-incomplete-census-capture-survives-its-producer-exit.test.ts in
       PRECHECK_PARITY in the already-declared scripts/census-precheck.mjs, with its
       actual reader/retention sources as triggers. Run the real semantic suite; no dummy
       registration, rule-suite naming exemption or census baseline change.
    4. Delete actual production retention forwarding to make the post-exit semantic test
       fail, then restore it to pass. A map unit test or an in-process existence assertion
       alone does not prove custody. Test default IO and each new catch; source-map every
       changed supported source file and name every unchanged or non-instrumented boundary.
    5. Fresh merged trailer/run-branch credit, ALL OPEN subjects, selector and ordinary
       ownership checks precede build/publication. Preserve the W9919 owner and actual
       merged structured reasons. Commit before verified-path/tsx/tmp/shipped-slot tests;
       one native per distinct committed repair, actual pinned-base comparisons for new
       failures, stored canonical proofs and normal required hosted CI/review/merge.
       No time-bound/admission/worker-limit/gate/scanner/baseline change or waiver.
    6. Registry/admission stays opt-in SHADOW ONLY with independent owner/admin override,
       trusted PR flow, scoped services and complete public Apache code. No schedule,
       live configuration/credential/settings/infrastructure change, deployment, external
       closure or worker stop. Source merge does not diagnose the old timeout or activate it.
