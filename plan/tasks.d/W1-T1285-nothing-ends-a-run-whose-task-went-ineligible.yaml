  title: "NOTHING ENDS A LIVE RUN BECAUSE ITS TASK BECAME INELIGIBLE MID-FLIGHT — every kill path this repo has fires on the PROCESS (orphaned, stalled, deploy-drained) and not one reads task state, so a sibling merging the same task or a task going `blocked` leaves its worker spending to completion against work that no longer needs doing"
