      proof: "unit test: test/run-cancel-on-ineligible.test.ts"
    - claim: "a run whose task is still eligible is never ended, however long it has been running"
      proof: "unit test: test/run-cancel-on-ineligible.test.ts"
    - claim: "eligibility is re-derived at cancel time rather than read from a value cached at dispatch"
      proof: "unit test: test/run-cancel-on-ineligible.test.ts"
    - claim: "a terminal task and a merely unroutable one are ended differently, and the difference is observable"
      proof: "unit test: test/run-cancel-on-ineligible.test.ts"
    - claim: "a cancelled run leaves its pushed branch intact, so the commits survive the cancellation"
      proof: "unit test: test/run-cancel-on-ineligible.test.ts"
  note: |
    RISK BAND -- BOTH READINGS, BECAUSE THE BAND EXEMPTS THE CHECK RATHER THAN CLEARING IT.
    `sizingViolation` (`src/lib/task-linter.ts`) opens with `if (task.risk === "high") return
    undefined; // Rule 19 exemption`, so `high` means the span was NEVER SCORED, not that it was
    scored and found narrow. Measured at `risk: medium` this `files:` list scores as more than one
    concern and BLOCKS; at `high` the check returns `undefined`. The band is Rule 19's SPAN. The
    real blast radius is nonetheless genuinely high and not merely wide: this adds a NEW WAY FOR
    THE FLEET TO KILL ITS OWN WORK, which is the strongest argument for the `blocked` status above.

