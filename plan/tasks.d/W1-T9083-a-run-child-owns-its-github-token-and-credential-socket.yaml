- id: W1-T9083
  title: "A RUN CHILD REFRESHES ITS OWN GITHUB TOKEN AND OWNS ITS GIT CREDENTIAL SOCKET — the installation token lives in the daemon's process.env on a refresh timer and the credential socket is closed on daemon exit, so a child that outlives the daemon would push with an expired token or a dead socket"
  repo: remudero
  depends_on: [W1-T9082]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the credentials a run child needs without the daemon
  band_meaning: span
  origin: 'operator approval 2026-10-13 (verbatim: "Agree with all of this. Make sure that we are optimizing other parts of the daemon''s memory to account for this new pressure. Reduce parallelism if we need to. Think about how to ensure efficiency, but keep automated flow."): docs/adr/0007-build-runs-outlive-the-daemon.md'
  plan_refs: [W1-T1024, W1-T8777, W1-T9070, W1-T9082]
  files: [src/run-child-main.ts, src/lib/github-app.ts, src/lib/secret-boundary.ts, src/run-task.ts, test/a-run-child-owns-its-github-token-and-credential-socket.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    ADR 0007 decision A.8.
    READ on origin/main 5f8d3f178:
    - `GH_TOKEN` lives in the daemon's process.env and is refreshed on a timer by `startInstallationTokenRefresh`
      (src/lib/github-app.ts). A child inherits a snapshot that expires in about an hour; a build often runs longer.
    - The git credential socket is owned by the daemon (`startDaemonGitCredentialSocket` in src/run-task.ts; path from
      `daemonGitCredentialSocketPath`, src/lib/secret-boundary.ts) and is closed and removed on daemon exit, so a push
      from a surviving child fails until the next daemon recreates it. Its socket thread starts from its own module
      URL, which a bundled process can start only through W1-T8777's worker bundles.
    - The gh read floor is already cross-process (stamp file and lock, src/lib/github-transport.ts), so it needs nothing.
  design: |
    1. src/run-child-main.ts starts `startInstallationTokenRefresh` for its own process whenever the daemon itself runs
       on an App installation token. A token is never written into the spec or any file: a token on disk is a secret
       at rest.
    2. The child starts its own git credential socket, at a per-run path under its run directory, through the bundled
       worker entry, and closes and removes it before its terminal status. runTask (src/run-task.ts) resolves the socket
       it pushes through with `runChildCredentialSocket(...)` (src/lib/secret-boundary.ts): the child's own path inside
       a run child, the daemon's otherwise.
    3. A child that cannot start either writes `failed` with reasonClass `spawn_infra_blocked` before running the task,
       so the daemon's settle loop treats it as it treats a spawn-infra block today.
  acceptance:
    - claim: "a run child refreshes its own installation token rather than reading one from the daemon"
      proof: 'grep: test("W1-T9083: a run child refreshes its own installation token" in test/a-run-child-owns-its-github-token-and-credential-socket.test.ts'
    - claim: "a run child's credential socket lives under its run directory and is removed before its terminal status"
      proof: 'grep: test("W1-T9083: the credential socket lives under the run directory and is removed at exit" in test/a-run-child-owns-its-github-token-and-credential-socket.test.ts'
    - claim: "a child's credential path still answers after the daemon's own socket is closed"
      proof: 'grep: test("W1-T9083: the child socket answers after the daemon socket closes" in test/a-run-child-owns-its-github-token-and-credential-socket.test.ts'
    - claim: "a child that cannot start its credentials fails as spawn_infra_blocked before the task runs"
      proof: 'grep: test("W1-T9083: a child without credentials fails as spawn_infra_blocked" in test/a-run-child-owns-its-github-token-and-credential-socket.test.ts'
    - claim: "the run-child entry starts its own installation-token refresh"
      proof: 'grep: startInstallationTokenRefresh( in src/run-child-main.ts'
    - claim: "runTask resolves its credential socket through the run-child-aware helper"
      proof: 'grep: runChildCredentialSocket( in src/run-task.ts'
  falsifier: |
    Pass the daemon's socket path in the spec: the third test's credential request fails once the daemon socket closes.
