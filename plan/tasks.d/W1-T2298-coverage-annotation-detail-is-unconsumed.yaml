  note: |
    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. The declared files cross the CI-failure PRODUCER
    (src/run-task.ts) and the recogniser table its output feeds (src/lib/sweep.ts), which fails
    sizing at risk medium. The change itself is additive and reversible; the band records the span.
    Decomposing the reader from the recogniser was considered and rejected: a reader with no
    consumer would ship the same unconsumed-data defect this task exists to close.

    WHAT WAS NOT MEASURED. Whether the log-tail fetch actually fails on the daemon host is not
    known here and is not claimed either way; the authoring container cannot reach that host. The
    argument rests only on the swallow making it unanswerable, which is measurable from source.

    THE FIX PR IS CITED, NOT RE-FILED. PR 2899 shipped the producer and is done; nothing here
    revisits it, and scripts/diff-coverage.mjs and scripts/coverage-ratchet.mjs are deliberately
    absent from the files list because this task consumes their output rather than changing it.
