    - claim: "the diff-scoped coverage recogniser reports and dispatches no fix worker"
      proof: "unit test: test/ci-failure-annotations.test.ts"
    - claim: "the producer still never throws and still names the same failing checks it names today"
      proof: "unit test: test/ci-failure-annotations.test.ts"
