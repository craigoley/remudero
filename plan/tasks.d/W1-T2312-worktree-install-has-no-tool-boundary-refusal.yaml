  note: |
    WHY THIS IS THREE TASKS AND NOT ONE — THE LINTER FORCED IT, AND IT WAS RIGHT. The first filing
    declared `plan/tasks.yaml` alongside `hooks/deny-floor.sh` and the test tree at `verify: auto`,
    and `rule15-filing` (task-linter.ts) refuses exactly that shape: sweeping the instruction out of
    a task record NECESSARILY removes/rewrites `claim:`/`proof:`-adjacent lines, and `judgeReview`'s
    `planOnly` carve-out (`diffFiles.every(isInPlanScope)`) evaporates the moment one declared path
    is outside plan scope — so `criteriaTampered` refuses the PR however good the work is. That is
    #1295 and #1416 verbatim, both recovered only by splitting. A dispatched worker gets ONE PR and
    cannot produce the split itself. So: W1-T2313 is the plan-only sweep, W1-T2314 is the regression
    lock, and this shard is the refusal.

    THE ORDER IS LOAD-BEARING, WHICH IS WHY `depends_on: [W1-T2313]` IS SET. The original note
    declined decomposition on the ground that shipping the refusal while the plan still COMMANDS the
    install means every worker that obeys its own contract walks into a hard refusal it was told to
    trigger. That concern is REAL and is answered by the DEPENDENCY SPINE rather than by packaging:
    W1-T2313 removes the instruction FIRST, and `isDispatchEligible` will not dispatch this shard
    until it has merged. The rule and the removal of the instruction that provokes it stay ordered
    without being one PR.

    `risk: high` IS RETAINED, ON BLAST RADIUS, NOT SPAN. Rule 19's span question is now moot — this
    shard holds ONE concern (`hooks/deny-floor.sh` plus its own test, a single module id). High is
    kept because the deny floor is loaded by BOTH `settings/worker.json` and `.claude/settings.json`:
    a mis-written pattern refuses legitimate Bash calls for every worker and every interactive lane
    at once, and the allow-side control in design (iii) is what bounds that.

    THE CONTAINMENT PROBE WILL RUN, AND THAT IS CORRECT. `CONTAINMENT_PATH_PATTERNS`
    (src/lib/specialist-panel.ts) matches `hooks/`, so this diff trips the required
    `containment-probe` job. Named here so nobody reads it as a surprise.

    WHY THIS IS NOT ALREADY-DECIDED. MASTER-PLAN D-11 cites this exact incident class as evidence
    (a) for cells and notes the mechanism is "now refused in code, SymlinkInstallRefusal" — but D-11
    is OPEN and awaiting operator ratification and dispatches nothing, and the refusal it names
    covers only rmd's own install path. Neither closes the worker-Bash seam.

    THE MEASUREMENTS ARE QUERIES, NOT QUOTED NUMBERS. Re-derive the deny-floor rule count from the
    installed `hooks/deny-floor.sh` and the symlink wiring from `linkWorktreeNodeModules`'s call
    site in `worktreeAdd`.
