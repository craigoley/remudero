    (4) AND THE COUNTER, STATED BESIDE IT, BECAUSE ONE DATA POINT IS NOT A VERDICT. ONE CATCH AGAINST
    A GATE THAT HAS NEVER EARNED ITS COST is evidence, not a ruling. PROVENANCE PER HOST, and the two
    must not be merged. AZURE, carried verbatim from `src/lib/compaction.ts` and NOT verifiable from
    this host: 17 `preflight.failed` rows, 15 of them a `test/preflight.test.ts` fake-spawn defect
    (W1-T455 owns it), and of the 2 genuine one was UNDECIDABLE and one was WRONG — CI passed 21/22
    with 1 neutral on the identical sha. Earned cost: ZERO. THE MINI, re-counted here on its own
    corpus over the three-form union: 27 distinct `preflight.failed` rows, all 27 in the PLAIN form,
    ZERO in gz and ZERO in the live file — so a live-only read would have reported none. Positive
    control `sweep.pass` = 1897; negative control 0. Cost side unchanged: 15-17 minutes of a lane on
