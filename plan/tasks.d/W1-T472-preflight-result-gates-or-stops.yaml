    ── AMENDMENT 2026-08-14, RE-DERIVED ON THE MAC MINI AT f0ce71d ──
    THE FLEET DROPPED IT AND THE FIRST MEASURED COST HAS ARRIVED. Option (b) shipped as #1777
    (`e26f928`) under a DIFFERENT shard, W1-T464, which was `verify: auto` and merged while this
    shard sat unmerged asking for the ruling. THIS SHARD IS STILL OPEN — `verify: human`,
    `status: queued`, and ZERO commits on origin/main name W1-T472 (control: two name W1-T464). No
    closure has landed; this amendment records evidence into an OPEN shard, and it is EVIDENCE
    RATHER THAN A REVERSAL.

    (1) THE OBLIGATION IS GONE FROM BOTH PROMPTS. `ciParityContractLines()` has NO definition and NO
    call site: 2 references in `src/` and both are COMMENTS (`src/lib/compaction.ts`,
    `src/run-task.ts`), plus 2 more in `test/ci-parity-contract.test.ts`'s header. CONTROL, same
    query shape: `commitMessageContractLines` reads 7 references including its `export function` and
    two live spreads. `src/run-task.ts` records why, verbatim: `this rung used to spread
    ciParityContractLines() here ... but the orchestrator never gated on a preflight failure (no
    branch, no early return), so the ~15-17 minute step was paid on every fix round without ever
    blocking one. Removed from BOTH prompts together` — so the FIX RUNG lost the same obligation the
    implement contract did.

    (2) NO WORKER-SIDE CHECK CAN CATCH THIS CLASS NOW. What survives is `--fast`, whose
    `FAST_GATE_STEPS` (`src/lib/ci-parity.ts`) is exactly SEVEN entries — `cli-reference:check`,
    `claims`, `learnings-budget-ratchet`, `jscpd`, `depcruise`, `api-client:check`,
    `no-hand-rolled-fetch:check` — and `diff-coverage` is NONE of them (control: 3 of the 7 contain
