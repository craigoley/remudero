  rationale: "WITHDRAWN AS FILED 2026-08-14 — OPTION (b) SHIPPED UNDER A DIFFERENT SHARD WHILE THIS ONE WAITED FOR THE RULING. #1777 (e26f9285, `fix(compaction): stop making workers run rmd preflight --ci-parity`) is exactly this shard's option (b), and it merged under W1-T464 — which is `verify: auto`. RE-VERIFIED AT f0ce71d6 WITH CONTROLS: `ciParityContractLines` has ZERO definitions and only 2 surviving references, BOTH on comment lines (positive control: `commitMessageContractLines` 7 references, live); in src/lib/compaction.ts both `test:ci` / `preflight --ci-parity` matches are comment lines (2 of 2, control: 8 `preflight` mentions), and `outputContractLines` emits no obligation to run it — its single `--ci-parity` mention is a DURATION reference inside the no-wait contract, not an instruction. AND #1777 CARRIED EVIDENCE THIS SHARD DID NOT HAVE, which is why (b) rather than (a) was right: of 17 `preflight.failed` rows, 15 were a TEST-FIXTURE defect rather than the gate firing; of the 2 genuine ones, one was UNDECIDABLE and one was WRONG — CI passed 21/22 on the identical sha. Earned cost: zero. This shard argued (a) and (b) were `not symmetric` and declined to rank them; #1777 supplied the measurement that breaks the tie. THE PATTERN, NAMED BECAUSE IT WILL RECUR: A `verify: auto` SIBLING SHIPPED THE SUBSTANCE OF A `verify: human` SHARD WHILE THAT SHARD SAT WAITING FOR A RULING, AND NEITHER SIDE NOTICED. Nothing links a human-gated question to an auto-gated task that would answer it, so the queue can hold a live question whose answer has already merged. The cost here was bounded — two shards' worth of stale asking — but the mechanism is general and this is the second instance in two days. status: blocked, NOT a new status: `withdrawn` is NOT in plan.ts's TASK_STATUSES (queued, recon, prompted, running, review, fixing, diagnosing, blocked, merged, done). W1-T270 already hit exactly this and established the equivalent — `status: blocked` as a `RECORD of the retirement decision, not a work item` — so this follows that precedent rather than inventing one. RETRACTED IN PLACE, NOT DELETED (MASTER-PLAN §8A asks for compression, not erasure): every acceptance criterion and the whole original argument are preserved verbatim below, because they are the record of a question that was live when it was asked. OPTION (c) IS SUPERSEDED, NOT DEFERRED, AND IS DELIBERATELY NOT REFILED: collapsing the double suite run was worth ~29% of local suite time, NOT half — this shard was explicit about that — and it is now largely irrelevant to the worker path, because the pre-push run it would have halved is gone. What remains is the hand route's own `--ci-parity`, which is not on any lane's critical path. --- ORIGINAL RATIONALE, PRESERVED VERBATIM --- 
    EITHER THE RESULT GATES SOMETHING, OR THE FLEET STOPS PAYING FOR IT. RUNNING IT AND
    DISCARDING IT IS THE ONE OPTION THAT COSTS FULL PRICE FOR NOTHING. That is the whole concern, and
    it is narrower than W1-T463 — see the note.
    NOTHING GATES ON IT, EXACTLY. RE-DERIVED at 71cedbbc: `preflightFailureNotice`
    (`src/lib/ci-parity.ts`) is named five times in `src/run-task.ts` and INVOKED EXACTLY ONCE
    (measured: 1 occurrence of the name followed by `(`, 0 of them inside a comment; the other four
    are the import and three doc references). The call site is, in full:
      const preflightNotice = preflightFailureNotice(worktreePath);
      if (preflightNotice) {
        log(\"preflight.failed\", { detail: preflightNotice, worktree: worktreePath });
        say(preflightNotice);
      }
    NO BRANCH. NO EARLY RETURN. NO VERDICT EFFECT. The next statement is
    `failOnWorkerError(impl, \"implement\")`, which concerns the WORKER'S OWN error, not the preflight.
    WHAT IT COSTS. THE SUITE RUNS FOUR TIMES PER CHANGE, two of them on the worker's lane: locally
    `ci:test` -> `npm run test:ci` (plain) and `coverage-ratchet:test-with-coverage` (instrumented),
    then the `ci` and `coverage-ratchet` JOBS in CI. RE-DERIVED at 71cedbbc from `CI_PARITY_TABLE`
    (`src/lib/ci-parity.ts`) and `.github/workflows/ci.yml`. **`test-with-retry` WRAPS ALL FOUR** —
    the coverage entry's own comment says it is `Routed through scripts/test-with-retry.mjs, exactly
    as ci.yml's own coverage-ratchet job is (W1-T255)` — SO A FLAKE TAKES IT TO EIGHT, NOT FIVE.
    AND THE LOCAL DOUBLE RUN IS INHERITED, NOT CHOSEN. `ci-parity.ts`'s header states the doctrine —
    `one named step per job`, `THE STEP LIST IS DATA (CI_PARITY_TABLE, one entry per ci.yml job)`,
    enforced by a `ci-parity:drift` step. CI runs the suite twice because `ci` and `coverage-ratchet`
    are SEPARATE RUNNERS where sharing is impossible; the local mirror inherited a shape that only
    makes sense remotely. NO COMMENT IN THE FILE WEIGHS THE DOUBLE RUN ON ITS MERITS."
  design: "(i) THREE OPTIONS, ARGUED, AND THIS SHARD RANKS NONE OF THEM.
      (a) GATE IT — refuse to push, or mark the verdict, on a red preflight. Costs the SAME 15-17
      minutes and buys back the reds in (iii). THE COST IS ASYMMETRIC AND MUST BE SAID: gating makes a
      FLAKY LOCAL RUN BLOCK A GOOD PR, and local flakes here are load-dependent on a contended box.
      (b) DROP IT from the worker path. The machinery for a red PR already exists downstream: the
      `blocked_ci` verdict sits in `NON_HALTING_VERDICTS` with a fix rung behind it, and the fallback
      push preserves everything except the PR body's trailer (W1-T453). Frees 15-17 minutes of a lane
      per change.
      (c) COLLAPSE THE DOUBLE RUN and keep it advisory. The coverage pass ALREADY emits both artifacts
      in one invocation — `--test-reporter=spec --test-reporter-destination=stdout` AND
      `--test-reporter=lcov` — so collapsing removes the PLAIN run only. THE ARITHMETIC HONESTLY:
      P + 2.5P -> 2.5P is **about 29% off local suite time, NOT half**. AND IT CHANGES NOTHING ABOUT
      THE DISCARD — the result is still stepped over.
    (a) AND (b) ARE NOT SYMMETRIC and must not be presented as a coin flip: (a) adds a new way to
    block good work, (b) removes a signal that has sometimes been right.
    (ii) WHAT THE PREFLIGHT HAS ACTUALLY CAUGHT — the case for (b). MEASURED ON THE MINI's ledger
    (all three forms; positive control `sweep.pass` = 1,897): 27 distinct `preflight.failed` rows, of
    which 12 are the 23-step `--ci-parity` shape and 15 are a 3-step shape. **ALL TWELVE FAILED ON
    EXACTLY `ci:test` AND `coverage-ratchet:test-with-coverage`**, across 12 DISTINCT shas, all on
    2026-08-12 between 02:45Z and 23:38Z. CONTROL: rows failing any NON-suite step = 0. So the other
    21 steps have NEVER failed on that host, and the whole local failure history is `the suite went
    red`. THE 21 CHEAP STEPS ARE NOT THE COST EITHER: all seven npm gates together measured 6
    SECONDS on a quiet box (`claims` 4.17s, `cli-reference:check` 0.75s, `depcruise` 0.67s, rest
    <=0.17s). CLOSED — do not re-investigate them.
    (iii) THE STRONGEST ARGUMENT ON THE KEEP SIDE, WHICH WAS ASSUMED UNMEASURABLE AND IS NOT. Same
    corpus: `blocked_ci` has 254 distinct rows over 228 distinct run_ids. Of the 132 that STATE a
    reason, **81 ARE GENUINE (61%)** — `ci red before review` 54, `required check red:
    coverage-ratchet` **20**, `ci-gate` 6, `ci` 1 — against 51 TIMEOUTS (39%); 122 rows state no
    reason at all. `ci.stalled` is 0 with a WORKING control (the same extractor finds
    `sweep.post_review.stalled.escalated`), so that conflator does not exist here; `fix.false_block`
    is 2. **SO WORKERS DO PUSH CODE CI GENUINELY REJECTS, AND 20 OF THOSE REDS ARE
    `coverage-ratchet` — A CHECK THE LOCAL PREFLIGHT MIRRORS AND COULD HAVE CAUGHT.** That is the
    case for making the result GATE rather than deleting it, and it must not be buried.
    (iv) THE SCOPE-SKIP MACHINERY ALREADY EXISTS, TWICE, so a fourth option is cheaper than it looks:
    `runTriggerScopedJob` (`src/lib/ci-parity.ts`) is `the ONE shared shape for 'run a trigger, only
    run the follow-up step(s) when it says REQUIRED'` and is already used by `mutation-ratchet` and
    `containment-probe`; and `rmd preflight --fast` (W1-T373) with `FAST_GATE_STEPS` `never shells
    npm run test:ci`. `isInPlanScope` (`src/lib/plan-architect.ts`) is three clauses and UNDER-CLAIMS
    — measured with controls, `plan/**`, `MASTER-PLAN.md` and `docs/ORIENTATION.md` read IN while
    `src/`, `test/`, `scripts/`, `.github/` and `package.json` read OUT — which is the safe direction.
    (v) BUT NAME THE REAL TRAP, WHICH IS NOT THE PREDICATE. If `git fetch`/`git diff` fails — a stale
    `origin/main`, a shallow clone, a network blip — **AN EMPTY CHANGED-FILES LIST IS
    INDISTINGUISHABLE FROM `no source files changed`**, and every scoped skip fires at once. Worse,
    `refreshOriginMain` and `changedFilesListPath` MEMOIZE the refresh and the listing PER (spawn,
    repoRoot), so ONE failed fetch propagates to EVERY scoped step in the same run. **AN UNREADABLE
    DIFF MUST BE A FAILURE, NEVER AN EMPTY SET** — this repo has seven measured instances of a read
    that FAILED being reported as a read that SAID NO, and this would be the eighth."
