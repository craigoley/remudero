    (5) THE INSTANCE SUPPLIES A SHARPER FRAMING, AND IT NARROWS THE ORIGINAL FORK. The question may
    not be gate-the-whole-preflight versus drop-it, but WHICH SINGLE STEPS ARE WORTH A WORKER'S TIME.
    `diff-coverage` is cheap in itself — it scores only changed lines. BUT: diff-coverage CANNOT RUN
    IN --fast AS THINGS STAND. `scripts/diff-coverage.mjs` reads its lcov with a BARE, UNGUARDED
    `readFileSync(values.lcov)` defaulting to `coverage/lcov.info`; the only producer of that file is
    the coverage suite run (`--test-reporter=lcov --test-reporter-destination=coverage/lcov.info`,
    `.github/workflows/ci.yml`); and `coverage/` is GITIGNORED, so a fresh worker worktree never has
    one. A missing lcov is an ENOENT throw, not a skip.
    SO THE FORK STANDS AS FILED — but with one figure the original did not have, and it is the
    costed third option nobody had priced: the dependency is the COVERAGE suite, not the whole
    parity run. By this shard's own decomposition in (i)(c) — a 4-6 minute non-coverage suite plus a
    ~10 minute coverage suite plus 21 cheaper steps — a coverage-only preflight sufficient to feed
    `diff-coverage` costs about TEN minutes rather than 15-17. Cheaper than what was dropped, not
    cheap. THIS AMENDMENT DOES NOT RESOLVE THE FORK; it records the option and its price.

    (6) THE FOURTEENTH LINE WAS AN INSTRUMENT BUG, CITED AND DELIBERATELY NOT SCOPED IN. In
    `scripts/diff-coverage.mjs`, `fnLines` is keyed by LINE and `fnHits` by NAME and BOTH are
    last-wins, so a shared declaration line resolves to the wrong function and a real `FNDA:13` can
    be overwritten by a later `FNDA:0`. That is instrument-only surface and belongs in its own PR;
    naming it here is provenance for why (3)'s fourteenth line survived its tests, not scope.

    WHY THIS MATTERS EVEN IF W1-T472 IS CLOSED AS MOOT: the fleet now ships with NO worker-side
    coverage check at all, so this question WILL recur. The amendment exists to make the evidence
    findable when it does."
