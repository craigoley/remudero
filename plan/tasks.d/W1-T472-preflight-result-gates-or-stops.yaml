    AND THE LOCAL DOUBLE RUN IS INHERITED, NOT CHOSEN. `ci-parity.ts`'s header states the doctrine —
    `one named step per job`, `THE STEP LIST IS DATA (CI_PARITY_TABLE, one entry per ci.yml job)`,
    enforced by a `ci-parity:drift` step. CI runs the suite twice because `ci` and `coverage-ratchet`
    are SEPARATE RUNNERS where sharing is impossible; the local mirror inherited a shape that only
