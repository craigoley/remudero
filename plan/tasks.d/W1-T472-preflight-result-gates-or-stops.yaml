  design: "(i) THREE OPTIONS, ARGUED, AND THIS SHARD RANKS NONE OF THEM.
      (a) GATE IT — refuse to push, or mark the verdict, on a red preflight. Costs the SAME 15-17
      minutes and buys back the reds in (iii). THE COST IS ASYMMETRIC AND MUST BE SAID: gating makes a
      FLAKY LOCAL RUN BLOCK A GOOD PR, and local flakes here are load-dependent on a contended box.
      (b) DROP IT from the worker path. The machinery for a red PR already exists downstream: the
      `blocked_ci` verdict sits in `NON_HALTING_VERDICTS` with a fix rung behind it, and the fallback
      push preserves everything except the PR body's trailer (W1-T453). Frees 15-17 minutes of a lane
      per change.
      (c) COLLAPSE THE DOUBLE RUN and keep it advisory. The coverage pass ALREADY emits both artifacts
      in one invocation — `--test-reporter=spec --test-reporter-destination=stdout` AND
      `--test-reporter=lcov` — so collapsing removes the PLAIN run only. THE ARITHMETIC HONESTLY:
      P + 2.5P -> 2.5P is **about 29% off local suite time, NOT half**. AND IT CHANGES NOTHING ABOUT
      THE DISCARD — the result is still stepped over.
    (a) AND (b) ARE NOT SYMMETRIC and must not be presented as a coin flip: (a) adds a new way to
    block good work, (b) removes a signal that has sometimes been right.
    (ii) WHAT THE PREFLIGHT HAS ACTUALLY CAUGHT — the case for (b). MEASURED ON THE MINI's ledger
    (all three forms; positive control `sweep.pass` = 1,897): 27 distinct `preflight.failed` rows, of
    which 12 are the 23-step `--ci-parity` shape and 15 are a 3-step shape. **ALL TWELVE FAILED ON
    EXACTLY `ci:test` AND `coverage-ratchet:test-with-coverage`**, across 12 DISTINCT shas, all on
    2026-08-12 between 02:45Z and 23:38Z. CONTROL: rows failing any NON-suite step = 0. So the other
    21 steps have NEVER failed on that host, and the whole local failure history is `the suite went
    red`. THE 21 CHEAP STEPS ARE NOT THE COST EITHER: all seven npm gates together measured 6
    SECONDS on a quiet box (`claims` 4.17s, `cli-reference:check` 0.75s, `depcruise` 0.67s, rest
    <=0.17s). CLOSED — do not re-investigate them.
    (iii) THE STRONGEST ARGUMENT ON THE KEEP SIDE, WHICH WAS ASSUMED UNMEASURABLE AND IS NOT. Same
    corpus: `blocked_ci` has 254 distinct rows over 228 distinct run_ids. Of the 132 that STATE a
    reason, **81 ARE GENUINE (61%)** — `ci red before review` 54, `required check red:
    coverage-ratchet` **20**, `ci-gate` 6, `ci` 1 — against 51 TIMEOUTS (39%); 122 rows state no
    reason at all. `ci.stalled` is 0 with a WORKING control (the same extractor finds
    `sweep.post_review.stalled.escalated`), so that conflator does not exist here; `fix.false_block`
    is 2. **SO WORKERS DO PUSH CODE CI GENUINELY REJECTS, AND 20 OF THOSE REDS ARE
    `coverage-ratchet` — A CHECK THE LOCAL PREFLIGHT MIRRORS AND COULD HAVE CAUGHT.** That is the
    case for making the result GATE rather than deleting it, and it must not be buried.
    (iv) THE SCOPE-SKIP MACHINERY ALREADY EXISTS, TWICE, so a fourth option is cheaper than it looks:
    `runTriggerScopedJob` (`src/lib/ci-parity.ts`) is `the ONE shared shape for 'run a trigger, only
    run the follow-up step(s) when it says REQUIRED'` and is already used by `mutation-ratchet` and
    `containment-probe`; and `rmd preflight --fast` (W1-T373) with `FAST_GATE_STEPS` `never shells
    npm run test:ci`. `isInPlanScope` (`src/lib/plan-architect.ts`) is three clauses and UNDER-CLAIMS
    — measured with controls, `plan/**`, `MASTER-PLAN.md` and `docs/ORIENTATION.md` read IN while
    `src/`, `test/`, `scripts/`, `.github/` and `package.json` read OUT — which is the safe direction.
    (v) BUT NAME THE REAL TRAP, WHICH IS NOT THE PREDICATE. If `git fetch`/`git diff` fails — a stale
    `origin/main`, a shallow clone, a network blip — **AN EMPTY CHANGED-FILES LIST IS
    INDISTINGUISHABLE FROM `no source files changed`**, and every scoped skip fires at once. Worse,
    `refreshOriginMain` and `changedFilesListPath` MEMOIZE the refresh and the listing PER (spawn,
    repoRoot), so ONE failed fetch propagates to EVERY scoped step in the same run. **AN UNREADABLE
    DIFF MUST BE A FAILURE, NEVER AN EMPTY SET** — this repo has seven measured instances of a read
    that FAILED being reported as a read that SAID NO, and this would be the eighth."
