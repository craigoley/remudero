    (3) THE CATCH, MEASURED. PR #1783 (`run-W1-T470-...`) blocked on head `af3034a` with
    `diff-coverage: BLOCKED` naming FOURTEEN added lines: thirteen in `src/run-task.ts` — the
    `coverageImproveCommand` arms — and one in `src/lib/coverage-improvement.ts`. The thirteen were
