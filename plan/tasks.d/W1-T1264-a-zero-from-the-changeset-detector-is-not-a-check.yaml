  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/body-claim-recognition.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS RULE 19 SPAN AND BLAST RADIUS BOTH. The SPAN is that the detector lives in
    `src/lib/review.ts` while the second consumer that must carry the same count
    (`deriveChangesetClaimUpdate`) lives in `src/run-task.ts`; a recognition count that reaches only
    one of them is not an author-side fix. The BLAST RADIUS is that this touches a REQUIRED gate's
    reporting path, where a mistake is a false verdict on live PRs.

    THE BRIEF'S FIRST PREMISE IS CORRECTED, NOT CARRIED. It attributes the #2527 silence to
    `stripQuotedRegions` context. That body has no fences and no blockquotes, the strip pass is a
    no-op over it, and a false count fires at all 51 insertion points — so the attribution cannot
    hold. The real trigger is the literal `exactly` in `countRe`, which is a WORDING dependency, the
    opposite of a context dependency. The brief's CONCLUSION — that the detector was not reading the
    claim at all — is exactly right and is what this shard is about; only the mechanism moved, and
    the corrected mechanism is broader, because rationale (3) shows the absence arm behaves the same
    way.

    THE SECOND OBSERVATION IS RULED OUT OF SCOPE ON PURPOSE, WITH ITS SUCCESSOR NAMED. Present-tense
    prose about a file absent from the diff scores 0, and that is CORRECT: this detector's own doc
    says it is "DELIBERATELY NOT general claim-verification" and that "anything this cannot decide is
    SILENCE, NOT A VERDICT". A contradiction checker keyed on changeset CLAIMS is not a staleness
    checker for narrative, and folding one into the other would forfeit the property that makes it a
    tripwire. MEASURED: the present-but-absent direction IS already reachable, but only through arm
    (c) — an `exactly N files: a, b` ENUMERATION naming a file the diff lacks fires. Anything catching
    the prose form must be a SEPARATE check (for every path-shaped token in a body, require it to be
    in the diff, inside a quoted region, or marked a citation), with its own false-positive argument
    against every legitimate mention of a path the diff does not touch — which this shard does not
    make and does not file.

    ID PROVENANCE. `refs/rmd-id/W1-T1264` resolves to
    4cc77833b5cf8442209afd1b9086fa23512808c9, read over git protocol; live negative control,
    `refs/rmd-id/W1-T999999` returns EMPTY output. THE ANCHOR MESSAGE WAS NOT JUDGED. The clone was
    `--unshallow`ed BEFORE any history query — it was genuinely shallow, and every `git log` answer
    taken before that would have been truncated. Eight surfaces were swept with a control
    PRE-QUALIFIED FOR EACH and none disqualified: a declared `- id:` on main, a shard FILENAME on
    main, any occurrence in main's tree, the reservation refs (control fires at 1 and a non-reserved
    id reads 0, so the surface discriminates), a LIVE `run-W1-T*` head, main's commit messages, open
    PR titles-plus-bodies (controlled with an id CURRENTLY open, since a merged id has left that
    surface), and merged PR bodies including the `Remudero-Task:` trailer. Subject anchors were
    counted PER OPEN HEAD against main's own baseline.
