  design: |
    A reading only: no bound, relief, refusal or threshold.
    1. EVERY HEAVY-LANE VIEW NAMES WHAT IT KEEPS. Each of the now, workstreams, repositories and host views gains or
       extends heldSizes(), returning { "<view>:<holder>[@instance]": { entries, bytes } } for every structure it keeps
       across builds: memos, previous bodies, derived indexes and per-instance caches. Bytes are accounted when the
       structure is filled (the sized-memo pattern), never by walking it on each report. A view that keeps nothing
       returns {}. A structure it cannot size is named with `unsized: <reason>`, never zero.
    2. THE LANE NAMES ITS OWN STATE. reportHolds adds the lane's unit bookkeeping as "lane:<name>". It posts after
       every build of a unit it owns, not only after a now build, so a lane that builds only workstreams still
       reports.
    3. THE PART SAYS HOW MUCH IS STILL UNNAMED. answerThreadHeaps carries, on each views-lane part,
       `unattributed_used_bytes` = used_bytes - the sum of its holds' bytes, with the holds' age. When used_bytes is
       absent, the field is omitted with a reason.
    4. THE SAVING IS READ LIVE. The serve.memory row is unchanged apart from the new holds. A later reduction cites the
       holder name, and its bytes p50 over one generation either side.
    Tests go in the new file, with titles verbatim as in the proofs. Drive a views lane in-process with fixture units.
    One test builds the real now view over a small fixture corpus, so the default heldSizes is covered.
