  note: |
    depends_on: W1-T970 IS ORDERING, NOT COMPILATION, AND THE DIFFERENCE IS STATED SO NOBODY
    MISREADS IT. This change builds and passes on its own. What it cannot do on its own is produce
    a benefit: deferring the arm routes an abandoned PR through the sweep's `mergeable` decision,
    and until W1-T970 makes a refusal durable in that decision, the sweep will arm it on
    green-plus-success exactly as before. So the merge still happens; it merely happens through a
    predicate instead of around one. Building this first is not wrong, it is early.

    verify: human IS SET UP FRONT AND THE REASON IS SPECIFIC. This task proposes to give back part
    of a latency property W1-T125 bought with measurements (2-8 minutes of dead time, four named
    PRs). No unit test can decide whether a 2-minute median wait with a 274-minute tail is an
    acceptable price for closing the window. `isDispatchEligible` (src/lib/drain.ts) returns false
    at `t.verify !== "auto"` BEFORE the linter is consulted, so this shard cannot be picked up by
    the drain until an operator rules — the intended effect, not a side effect.

    risk: high IS SET UP FRONT AND THE BAND IS RULE 19'S SPAN. `sizingViolation`
    (src/lib/task-linter.ts) exempts `risk === "high"` outright, and `subsystemsOf` derives ids
    from `moduleIdFromPath` over `files:` AND from a lexicon scan of the ACCEPTANCE-CRITERIA TEXT.
    Two declared paths already yield two module ids before the criteria are scanned at all, and
    criteria naming arming, verdicts and CI can only add lexicon tags. No file list satisfying this
    task's own scope reaches risk:medium, so the band is set where the rule requires.

