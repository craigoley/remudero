  note: |
    THIS MUST RIDE ALONE — NO `src/` PATH MAY ENTER THIS DIFF, AND THAT IS A GATE, NOT A PREFERENCE.
    `.github/workflows/` is the first entry of `INSTRUMENT_SURFACE` (src/lib/review.ts), and
    `detectInstrumentEntanglement` returns `entangled` when `instrumentPaths.length > 0 &&
    srcPaths.length > 0` — Rule 25. So a single `src/` file alongside `ci.yml` fails the PR. This is
    also why rationale (6)(b)'s sweep classifier cannot be folded in however related it looks.
    `test/` IS SAFE: `isProductPath` is "under src/ and not a test file", and the design's own
    carve-out exists precisely so an instrument-only PR can carry the fixture that proves it. So
    `test/workflow-job-timeouts.test.ts` may ride and MUST — criterion 1 has no other home.

    DOCS-AWARENESS WILL FIRE AND THE BUILDER SHOULD EXPECT IT. `USER_VISIBLE_SURFACE_RE` includes
    every `INSTRUMENT_SURFACE` pattern, so touching `.github/workflows/` makes `checkDocsAwareness`
    demand either a `docs/` change or a STATED reason in the report — `STATED_REASON_RE` requires the
    "no docs update" phrase to be FOLLOWED by an actual reason. `docs/` is neither `src/` nor an
    instrument path, so updating it is Rule-25-safe if the builder prefers that arm.

    A NEW TEST FILE IS DELIBERATE, NOT LAZINESS. House rule: a coverage-load-bearing test goes in its
    own `test/*.test.ts` rather than being appended to a shared file that can crash at file level
    under `--experimental-test-coverage` and zero the record for everything in it.
    `test/workflow-job-timeouts.test.ts` does not exist at 10f719bd; the path is a forward reference,
    which is safe, and no symbol name is guessed.

    DIFF-COVERAGE IS NOT AT RISK HERE: the diff adds no `src/` lines at all, so there is nothing for
    `diff-coverage` to instrument. That is a consequence of Rule 25, not an exemption claimed.

    risk: high IS SET FOR RULE 19'S SPAN, NOT FOR BLAST RADIUS — AND IT WAS MEASURED, NOT ASSUMED.
    Filed first at risk:medium, `lint-plan` refused in as many words: "[sizing] spans 2 distinct
    subsystems/concerns (ci, workflow-job-timeouts) at risk:medium — Rule 19: raise to risk:high or
    decompose into one task per concern". `subsystemsOf` (src/lib/task-linter.ts) derives those two
    tags from the two declared paths, so the span is an artifact of a bound and the falsifier proving
    the bound living in different trees. THEY ARE NOT TWO CONCERNS AND DECOMPOSING THEM WOULD BE
    THEATRE — criterion 1 has no home except a test file, and a test file with no workflow to read
    asserts nothing. Blast radius argues DOWN, hard: the diff adds no `src/` line, changes no
    behaviour any product code can observe, and its worst failure mode is a job that stops early and
    says why.

    ID PROVENANCE — THREE GIT SURFACES FIRST, THEN THE OPEN-PR SURFACE, ZERO `/rate_limit` CALLS.
    W1-T1009 read 0 on all four at 10f719bd: `refs/rmd-id/*`, shard FILENAMES under
    `plan/tasks.d/` on origin/main, DECLARED ids under `plan/` on origin/main, and every open PR's
    title and file list. THE OPEN-PR SURFACE WAS GENUINELY EMPTY RATHER THAN UNREAD — the repo had
    ZERO open PRs at mint time (#2150 and #2148 both merged), which is stated because an empty
    surface and an unqueried one are indistinguishable in a report that only prints 0.
    THE EXISTENCE TEST IS THE FILENAME AND THE ANCHORED DECLARATION, NEVER A `plan/` MENTION.
    Positive control: W1-T1008 reads ref=1 and 7 declared lines. Mention-trap control: `W1-T999999`
    reads 0 refs, 0 filenames, 0 declarations.
    THE MINT USED THE PLAIN REFSPEC: orphan payload over the empty tree
    (4b825dc642cb6eb9a060e54bf8d69288fbee4904), nonce t1009-1787087392-35036, no `+` and no lease:
    PUSH RC=0, `* [new reference] ee419f2c31fd83a01536eafbb95dc0e79329e67c ->
    refs/rmd-id/W1-T1009`, readback equal.
    AND THE GATE PROOF WAS VERIFIED TO BE A REFUSAL RATHER THAN AN AUTH FAILURE. A plain push of a
    fresh orphan at the already-taken `refs/rmd-id/W1-T1008` returned rc=1 with `! [rejected] …
    (fetch first)`, ZERO occurrences of `could not read Username`, and left that ref unchanged at
    4269ddacda013d8933151e20a1e3b10978df51f9. An exit code of 128 with an auth message would have
    proven nothing about the gate.
