  # refusal-amendment (W1-T9337, run DAEMON-1792797246750@7ecddddd77f973a141331e2d6bba6dc421d8994e, 2026-10-24T00:28:15.288Z): the worker refused criterion 4 [contradicts-another-criterion] — proposed re-scope-criteria: reconcile the contradicting criteria — re-scope one so both can hold at once
  #   worker evidence: Existing source-text tests require moved fix-rung statements in `src/run-task.ts`, while criteria 1 and 3 require those statements in `fix.ts` behind thin delegates.
  #   this task is held from dispatch until its record changes; an Architect must make the change above
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    MEASURED on origin/main bbab8894f, 2026-10-13. src/run-task.ts is 57,478 lines. Of 329 open tasks (no
    `Remudero-Task:` trailer on main, and a shard status that is not merged, retired, done or blocked), 105 declare it
    in `files:`, including 24 of the 48 dependency-met auto tasks at priority <= 1.5. It was touched by 713 of 4,523
    main commits in 30 days. The refill pool never overlaps a running lane's files (W1-T8502), so one build holding it
    serializes every other run-task.ts task. The diagnosis saw it held from 20:12Z to 22:00Z on 2026-10-13.
    CHURN, from `git log --since=30.days -p --unified=0 -- src/run-task.ts`, attributing each hunk to its enclosing
    top-level declaration: runFixRung and fixCommand were changed by 95 of those 713 commits (87 and 8), with 1,769 changed lines. The split takes verbs in that churn order:
    W1-T9332 (run-task), W1-T9333 (daemon), W1-T9337 (fix), W1-T9338 (sweep) and W1-T9339 (review). This step moves runFixRung (about 3,230 lines) and fixCommand (about 170).
    THE SEAM. W1-T2893 made `main()` dispatch through src/cli/registry.ts, but left every handler body in
    run-task.ts. A moved handler still reaches many run-task.ts helpers. W1-T9331 forbids importing them (a cycle with
    HANDLERS). So this step passes them in through one host parameter, the repo's existing `*Deps` pattern, instead of
    moving the whole reachable graph at once.
    NOT IN SCOPE: re-pointing open shards that declare src/run-task.ts for this verb. A shard edit cannot ride a code
    PR (rule 15). The note names the plan-only follow-up.
  design: |
    1. Create src/cli/commands/fix.ts. Move runFixRung, fixCommand into it, plus every top-level run-task.ts symbol whose references all lie inside
       the moved set. Find that set with a reference census over run-task.ts at the build's base: a symbol moves when
       no reference to it remains outside the set. Keep each moved body verbatim, apart from reading its collaborators
       from the host, so diff-coverage's relocation exemption (W1-T2325, W1-T3138) reads the moved lines as moved
       code rather than new code.
    2. Any other run-task.ts symbol the moved code reaches arrives through one exported
       `FixCommandHost` interface, taken as a parameter. src/lib symbols are imported
       directly. A collaborator that an earlier step already moved into src/cli/commands/ is imported from there. The
       module imports nothing from src/run-task.ts (W1-T9331's `cli-no-run-task`).
    3. src/run-task.ts imports the moved roots from "./cli/commands/fix.js" under local aliases named `<root>FromModule`. It keeps every moved root that
       was exported, or that another run-task.ts symbol calls, as a thin function with the same name and signature. That
       function builds the host from run-task.ts's own symbols and delegates to the module. HANDLERS, every in-file
       caller, and every test that imports a root from src/run-task.ts stay unchanged.
    4. Unchanged: COMMANDS (scripts/rmd-help.mjs source-scans that array), and the verb's behaviour, ledger rows,
       stdout and exit codes. The eight explicitly declared existing source readers may also follow both
       physical source owners and the mechanical host qualification, preserving all 326 original assertion
       calls byte-for-byte. No other existing test changes are allowed. The source-text assertion baseline
       permits only instrument-isolation and review-provider-provenance to rise from two physical reads to
       three each. The clock-signature baseline may relocate only fixCommand's original Date.now() call:
       src/run-task.ts dateNow 48 -> 47 and src/cli/commands/fix.ts dateNow 0 -> 1, keeping the aggregate
       at 150. This permits restoring that original expression, with legacy and newDate counts unchanged.
       The comment baseline may record src/cli/commands/fix.ts:1500 and lower src/run-task.ts's row
       by the same 1500 (14750 to 13250 on today's main, or 1500 below whatever row an earlier
       extraction left), conserving the aggregate. Where comment volume no longer blocks on the
       adopted base (#14087), leaving the baseline untouched also satisfies this step.
       Every other entry, exclusion, population, threshold and falsifier stays unchanged.
    5. The PR body reports the moved symbol count and line count, and the host's member count. A large host is
       acceptable. Never shrink it by importing run-task.ts.
    Tests go in the new file test/the-fix-verb-lives-in-its-own-module.test.ts, with `test(` titles exactly as in the proofs below. They read the two source
    files as text, need no git and no network, and the verb's existing behavioural tests must pass untouched.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/the-fix-verb-lives-in-its-own-module.test.ts"
    - claim: "runFixRung is defined in the fix module, and src/run-task.ts only delegates to it"
      proof: 'grep: test("W1-T9337: runFixRung is defined in its module and src/run-task\.ts only delegates to it" in test/the-fix-verb-lives-in-its-own-module.test.ts'
    - claim: "the fix module imports nothing from src/run-task.ts"
      proof: 'grep: test("W1-T9337: the fix module imports nothing from src/run-task\.ts" in test/the-fix-verb-lives-in-its-own-module.test.ts'
    - claim: "the module declares the moved handler"
      proof: 'grep: export async function runFixRung( in src/cli/commands/fix.ts'
    - claim: "src/run-task.ts calls the moved handler through the module"
      proof: 'grep: runFixRungFromModule( in src/run-task.ts'
  falsifier: |
    At base, src/cli/commands/fix.ts does not exist and run-task.ts defines runFixRung, fixCommand itself, so both new tests fail. Give the module an
    import of "../../run-task.js" and the second test fails, as does W1-T9331's depcruise rule. Leave runFixRung's body in
    run-task.ts beside the import and the first test fails.
  note: |
    EFFECT, measured after merge with no numeric pass mark: count open shards declaring src/run-task.ts, and the
    `dispatch.serialized` and W1-T8771 `dispatch.passed_over` rows whose contended path is src/run-task.ts, before and
