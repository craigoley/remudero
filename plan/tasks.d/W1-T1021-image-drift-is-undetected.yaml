      proof: "unit test: W1-T1021: a source-only merge does not report image drift"
    - claim: "a baked entrypoint change landing after the image was built reports drift"
      proof: "unit test: W1-T1021: a baked entrypoint change after the build reports drift"
    - claim: "an absent build-sha file reports not-applicable rather than drift"
      proof: "unit test: W1-T1021: an absent build sha file reports not applicable"
    - claim: "a build stamp that is not a hex sha reports unmeasurable rather than drift"
      proof: "unit test: W1-T1021: a non sha build stamp reports unmeasurable"
    - claim: "the daemon freshness gate reaches the new check rather than leaving it unreached"
      proof: "unit test: W1-T1021: the freshness gate reaches the image drift check"
    - claim: "the baked stamp is already present and unread rather than something this task adds"
      proof: "grep: the stamp already exists and nothing compares it to main in plan/tasks.d/W1-T1021-image-drift-is-undetected.yaml"
