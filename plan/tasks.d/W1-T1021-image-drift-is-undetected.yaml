  note: |
    THE GREP PROOF MATCHES RATIONALE PROSE, NOT ITS OWN DECLARATION. The phrase sits on ONE PHYSICAL
    LINE inside rationale (2), is not on line 2 of the file, and reads 0 files across the whole tree at
    the merge base against a control phrase from CLAUDE.md that reads 1 — so it discriminates head from
    base and cannot be downgraded to `executed_stale`.

    NO DOCKERFILE CHANGE, AND THAT IS A MEASURED CONCLUSION RATHER THAN A SCOPE PREFERENCE. The brief
    asked whether a baked revision label should be added here or in a sibling; the answer is NEITHER,
    because `LABEL org.opencontainers.image.revision` and `/etc/rmd-build-sha` are both already in
    `deploy/Dockerfile` and `acr-build.yml` already supplies the value. `deploy/` is therefore absent
    from `files:` entirely, which is also why this shard does not span the Dockerfile and `src/`.

    RULE 25 RE-DERIVED BY RUNNING THE PREDICATE, NOT BY READING IT. `INSTRUMENT_SURFACE`
    (`src/lib/review.ts`) holds 6 entries; compiling them exactly as `INSTRUMENT_SURFACE_RE` does and
    testing six paths gives: `.github/workflows/ci.yml` ON and `scripts/coverage-ratchet.mjs` ON (the
    two positive controls), and `deploy/Dockerfile`, `deploy/entrypoint.sh`, `src/lib/status-board.ts`
    and `src/run-task.ts` all OFF. **`deploy/` IS NOT ON THE INSTRUMENT SURFACE** — and note the
    briefing's suggested positive control `src/run-task.ts` reads OFF, so it cannot serve as one; the
    workflow path and the ratchet script are the controls that actually fire.

    NO NEW SIGNAL WITHOUT A CONSUMER. The new step is read by `deriveNeedsMe` in the SAME change, on
    the exact precedent `COST_ANOMALY_STEP` sets: a small module owning its step constant, imported by
    `src/lib/status-board.ts` and consumed in one clause. It is a RENDER-relevant row, not a decision
    input, so it belongs with `RENDER_RELEVANT_LEDGER_STEPS` rather than
    `DECISION_RELEVANT_LEDGER_STEPS` — the builder must state which set it registered and why, since a
    row nothing decides on does not earn a place in the never-rotated core.

    src/run-task.ts MUST BE DECLARED AND ITS SERIALISATION COST IS ACCEPTED. It is declared by 232 of
    372 records, so this task serialises against most of the pool under `overlappingPaths`. It is
    unavoidable: `serviceFreshnessGate` is the daemon's freshness gate and the site that already writes
    `daemon.tree_dirty` / `daemon.stale_code`, so an emit anywhere else would be a second freshness
    path. src/lib/self-sync.ts is deliberately NOT declared (16 shards, cheap) — `checkServiceFreshness`
    is a mount-side predicate and nothing in it changes; the image question is a different corpus.

    NO REBUILD IS PROPOSED AND NONE MAY BE. `acr-build.yml` stays `workflow_dispatch:` only. A rebuild
    and recycle drops running workers and clears locks, which is more irreversible than a merge, and
    `DECISIONS.md` ratifies gating on irreversibility. DETECTION IS THIS SHARD; DISPATCH IS THE
    OPERATOR'S. An implementer who wires an automatic build has exceeded this task.

    risk: high IS RAISED ON A MEASURED REFUSAL AND THE REFUSAL IS QUOTED, NOT GUESSED. Authored at
    `risk: medium` and run through `rmd lint-plan`, which refused it in these words: *"[sizing] spans 3
    distinct subsystems/concerns (image-drift, run-task, status-board) at risk:medium — Rule 19: raise
    to risk:high or decompose into one task per concern."* The band is Rule 19's SPAN, not blast
    radius: the three subsystems are one new module, one reader clause and one emit site for a single
    finding, and decomposing an emitter from the reader that makes it non-inert is not a real
    decomposition — it is how the eleven unreached modules were built.

    THE `[call-site]` ADVISORY IS ANSWERED BY TEST, NOT BY GREP, AND THE REASON IS MEASURED. The linter
    asks for `grep: <symbol>( in <the file that calls it>`. Measured with `rmd check-proof`: that form
    reads `hits: 0, verdict: fail, exit: 1` at this head, because the symbol does not exist yet — and
    an `executed_fail` overrides keyword coverage and FAILS the PR, so writing it here would fail this
    filing over work that has not started. Control on the same command: `grep: serviceFreshnessGate( in
    src/run-task.ts` reads `hits: 2, verdict: pass`. Criterion 5 therefore proves the call site as a
    name-filtered `unit test:`, which forward-references safely as `no-match`. An implementer SHOULD
    add the grep form once the symbol exists.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form; each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from test/fleet-heartbeat-image-sha.test.ts that matched
    one. Each is plain prose under 100 characters with no comma, no `; ` and no regex metacharacter,
    because a bare title is compiled through `escapeRegExp` and matched literally. The fifth is
    doc-shaped and takes a `grep:` with an explicit path.

    ID PROVENANCE — THE ID WAS PRE-MINTED AND READ BACK BEFORE FILING. `refs/rmd-id/W1-T1021` resolves
    to `11661761…` (negative control `refs/rmd-id/W1-T444444` reads 0). Four surfaces swept anyway,
    GIT FIRST AND REST LAST AND SERIAL, `/rate_limit` never called: the reservation; shard FILENAMES
    via `git ls-tree -r` (371 files, W1-T1021 = 0, control W1-T1017 = 1 — THE FILENAME IS THE EXISTENCE
    TEST, and the shard's `- id:` line is unindented); ids mentioned under plan/ (ADVISORY only, 0 for
    this id against a control of 5 files for W1-T496, proving the surface can match); and the open-PR
    titles, heads and file lists. THE OPEN-PR SET WAS READ, NOT UNREAD: three open pull requests were
    enumerated (#2190, #2191, #2196) and all three file lists fetched, none carrying a plan/tasks path.
