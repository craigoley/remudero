- id: W1-T1021
  title: "THE RUNNING IMAGE CAN FALL ARBITRARILY FAR BEHIND MAIN AND NOTHING NOTICES — `acr-build.yml` is `workflow_dispatch:` only, the entrypoint that boots every container is COPY'd into the image while everything it runs comes from a live mount, and the build sha is already stamped at `/etc/rmd-build-sha` yet no code reads it: compare that stamp against the baked paths' own history at the freshness gate and surface the answer where a human already looks"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    THE SPLIT IS THE WHOLE PREDICATE AND IT WAS RE-DERIVED FROM THE TWO FILES, NOT ASSUMED.
    `deploy/entrypoint.sh` resolves `TREE="$CONFIG_ROOT/remudero"`, fetches and checks it out at every
    boot, then `cd "$TREE"` and runs `./bin/rmd`, which execs `$TREE/node_modules/.bin/tsx`. So `src/`,
    `test/`, `plan/`, `bin/` and `scripts/` are LIVE from the mount and take effect on the next
    freshness restart with no rebuild. `node_modules` is LIVE TOO — the entrypoint bootstraps
    `$TREE/node_modules` and leaves freshness to `ensureInstallFresh`; the image's own `/app`
    node_modules is never reached, so the common belief that it is baked is wrong.

    (1) WHAT IS ACTUALLY BAKED, FROM THE DOCKERFILE'S OWN LINES. `COPY --chown=node:node
    deploy/entrypoint.sh /usr/local/bin/rmd-entrypoint` followed by `ENTRYPOINT [… "/usr/local/bin/
    rmd-entrypoint"]` — the EXECUTED entrypoint is the image's copy, never the mount's. The Dockerfile
    itself bakes every apt binary, `ARG GH_VERSION`, `ARG CLAUDE_CODE_VERSION` and the node base. A
    `COPY . .` snapshot lands at `/app`, but the entrypoint `cd`s away from it, so it is inert rather
    than authoritative. THE BAKED SET FOR THIS DETECTOR IS THEREFORE EXACTLY TWO PATHS:
    `deploy/entrypoint.sh` and `deploy/Dockerfile`. A change under `src/` MUST NOT trigger it.

    (2) THE COMPARISON INPUT ALREADY EXISTS, IS ALREADY POPULATED, AND IS ALREADY READABLE FROM INSIDE.
    `ARG RMD_BUILD_SHA=unknown` / `LABEL org.opencontainers.image.revision="${RMD_BUILD_SHA}"` /
    `RUN printf '%s\n' "${RMD_BUILD_SHA}" > /etc/rmd-build-sha && chmod 0444 /etc/rmd-build-sha`, and
    `.github/workflows/acr-build.yml` passes `--build-arg "RMD_BUILD_SHA=${GITHUB_SHA}"`, so the stamp
    carries a real commit sha rather than the default. `deploy/verify-image.sh` reads it with a plain
    `cat` from INSIDE the container. SO NO DOCKERFILE CHANGE IS NEEDED AND NO LABEL NEEDS ADDING —
    the stamp already exists and nothing compares it to main. That is the entire gap.

    (3) THE DAEMON CANNOT SEE ITS OWN IMAGE THROUGH DOCKER, AND DOES NOT NEED TO. `deploy/
    host-update.sh` runs each container with exactly two `-v` mounts (state and credentials; the serve
    container gets one), and `docker.sock` reads ZERO across `deploy/` against a control of 3 real
    `-v` lines — no socket, no Docker API. `scripts/fleet-heartbeat.sh` gets the value only by
    `docker exec … cat /etc/rmd-build-sha` FROM THE HOST. The detector avoids all of that: the file is
    an ordinary 0444 file in the daemon's own filesystem, so it is a `readFileSync`, not a runtime
    query.

    (4) NOTHING READS IT. `image_build_sha` reads 0 in `src/` — against controls of 78 `head_sha` and
    58 `daemon.boot` occurrences in the same tree, so the zero is real absence and not a broken query.
    The beat PUBLISHES the sha; publishing is not comparing, and no code anywhere joins it to the
    baked paths' history.

    (5) THE FALSE-POSITIVE COST, MEASURED OVER THE WHOLE RETAINED HISTORY. 21 commits have touched
    either baked path across 1,671 commits on main — 1.3%, or about one commit in eighty. Split:
    `deploy/Dockerfile` 14, `deploy/entrypoint.sh` 9, last touched 2026-08-15 and 2026-08-18. CONTROL:
    `src/` was touched by 752 commits (45%), which is what a naive detector keyed on source would fire
    on. THIS IS THE ARGUMENT FOR THE DETECTOR BEING CHEAP, NOT FOR IT BEING URGENT.

    (6) THE READER IS NAMED AND IT ALREADY EXISTS. `deriveNeedsMe` (`src/lib/status-board.ts`) builds
    the needs-me section from LEDGER LINES, keyed today on a single step constant imported from
    `src/lib/cost-anomaly.ts` — a module that owns its step, emits it, and is read by exactly this
    clause. That is the shape to copy. `buildStatusBoard` has TWO callers — `src/lib/board.ts` for the
    console and `statusCommand` (`src/run-task.ts`) — so the finding surfaces in `rmd status` even
    though `remudero-serve` is stopped. `renderDaemonSummary` is deliberately NOT the reader: it has
    ONE call site, in `daemonCommand`'s return path, so a daemon that never exits never prints it.

    (7) THE EMIT POINT ALREADY LEDGERS ITS SIBLINGS. `serviceFreshnessGate` (`src/run-task.ts`) is the
    daemon's boot-time freshness path and already writes `daemon.tree_dirty` and `daemon.stale_code`
    off `checkServiceFreshness`. The image comparison belongs beside them: same gate, same boot, same
    ledger. That is why `src/run-task.ts` is unavoidable here.

    (8) THE THREE DEGRADED CASES, EACH A CRITERION RATHER THAN A COMMENT. Off-container the stamp file
    is ABSENT and the answer is not-applicable, never drift. A stamp that is not a hex sha —
    `ARG RMD_BUILD_SHA=unknown` makes a hand-built image real, and `scripts/fleet-heartbeat.sh` already
    guards it with `*[!0-9a-fA-F]*` — is UNMEASURABLE, never drift. And a stamp naming a commit the
    local history cannot resolve is unmeasurable for the same reason. A detector that reports drift on
    any of these would fire on every developer machine.
