      proof: "grep: at least 20 terminal inbox-draft outcomes are visible in plan/tasks.yaml"
    - claim: "W1-T3570 criterion 1's proof no longer cites a grep path absent from the checkout — it becomes a verify:human demonstration requiring the report to state an accepted-drafts-per-dollar figure against a named Claude baseline and end with exactly one of widen, hold, or stop as its verdict"
      proof: "grep: ends with exactly one of widen, hold, or stop as its verdict in plan/tasks.yaml"
    - claim: "W1-T3570's task-level verify field is changed to human, with a marker note recording the repair and its rationale — the grep-path-absent failure mode cannot recur on these two criteria because neither carries an executable grep/unit-test dialect proof any longer"
      proof: "grep: PROOF-DEBT REPAIR rmd proof-queue-audit in plan/tasks.yaml"
