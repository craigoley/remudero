- id: W1-T13196
  title: "An Inbox decline or reframe carries an idempotency key, so a retried or doubled send acts once and answers with the first outcome"
  repo: remudero
  priority: 1.1
  depends_on: []
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # changes what two operator write routes record and answer; no new authority
  band_meaning: blast-radius
  origin: "operator-session#console-inbox-defects-2026-11-16"
  plan_refs:
    - W1-T2604
    - W1-T3407
  files:
    - src/lib/panel-graph.ts
    - test/inbox/a-repeated-inbox-decision-carries-one-key-and-acts-once.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "Two POST /v1/inbox/decline requests with the same idempotencyKey for one proposal append exactly one panel.proposal_declined row, and the second answers 200 with the first outcome and duplicate: true, even when both are classified before either records"
      proof: "grep: W1-T13196 criterion 1 in test/inbox/a-repeated-inbox-decision-carries-one-key-and-acts-once.test.ts"
    - claim: "Two POST /v1/inbox/reframe requests with the same idempotencyKey hand the feedback off once and record one panel.proposal_reframe_requested row; the second answers with the first outcome and duplicate: true"
      proof: "grep: W1-T13196 criterion 2 in test/inbox/a-repeated-inbox-decision-carries-one-key-and-acts-once.test.ts"
    - claim: "The same key reused for a different proposal, a different decision or different text is refused with 409 idempotency_key_reused and records nothing"
      proof: "grep: W1-T13196 criterion 3 in test/inbox/a-repeated-inbox-decision-carries-one-key-and-acts-once.test.ts"
    - claim: "invariant:a-decision-without-a-key-is-unchanged — a request with no idempotencyKey keeps today's answers (200, 404 not_found, 409 already_declined, already_ratified, not_declined) and rows, and an empty or over-long key is a 400"
      proof: "grep: W1-T13196 criterion 4 in test/inbox/a-repeated-inbox-decision-carries-one-key-and-acts-once.test.ts"
  rationale: |
    OBSERVED 2026-11-16 in production: a Console Decline sent at 14:24:52Z was answered "not confirmed" by the Console, whose LOW decision POST aborts after 5 s, yet core's ledger recorded panel.proposal_declined at 14:39:35Z. The "Make serve a lean API layer" thread measured that write at 887 s inside serve (serve.demand max 887,329 ms): every write route re-classified all 2,343 proposals before acting.
    READ at origin/main: proposalVerdictResponse (src/lib/panel-graph.ts) classifies, calls applyProposalVerdict (src/lib/inbox.ts), and appends the row. The already_declined refusal runs on the classification taken BEFORE the append, so two sends classified inside the same window both pass and both append. Reframe has no refusal for a repeat at all. Neither route accepts any request identity; only the thread reply route dedups, by replyId (src/lib/inbox-thread.ts).
    W1-T13188 (lean serve) shortens the window to one proposal's classification but does not close it; its "writes append and return" redesign step references this task. The Console side (CONSOLE-T190, remudero-console #2578) now holds a timed-out decision as pending and refuses a second send from the same browser, which cannot cover a second tab, a second operator, or the terminal.
  design: |
    1. Both routes accept an optional `idempotencyKey` (1..200 chars of [A-Za-z0-9:_-]); anything else present is a 400.
    2. Keys live in one small JSON store under the inbox state dir (`state/inbox-decision-keys.json`), keyed by key, holding proposalId, decision, a digest of the text, the HTTP status and body answered, and the time. Entries older than 7 days are dropped on write.
    3. The route takes the existing inbox write lock (or a per-key in-process mutex if none spans the classify-and-append), looks the key up first, and answers a stored outcome with `duplicate: true` without classifying. A mismatch of proposal, decision or text digest is 409 idempotency_key_reused.
    4. A new key runs today's path unchanged and stores its outcome after the row is appended (success) or the refusal is decided.
    INVARIANT a-decision-without-a-key-is-unchanged: a request with no idempotencyKey keeps every answer, ledger row and thread event it has today.
    NOT IN SCOPE: approve (HIGH tier, its confirm nonce already binds the body); archive and snooze (already idempotent marks); the Console change to send the key (a CONSOLE task follows this one).
  falsifier: |
    Drop the key lookup and criterion 1 must fail with two rows. Store the outcome before the append succeeds and a failed append must still answer duplicate (criterion 1 covers it). Ignore the text digest and criterion 3 must fail. Reject keyless requests and criterion 4 must fail. Restore and all pass.
  note: |
    Reserved with rmd next-task-id from the operator checkout (refs/rmd-id/W1-T13196). Confirm the test folder with rmd test-place on a stub before writing it. Coordinate with W1-T13188, which edits the same routes to classify only the target proposal; build this after it merges.
