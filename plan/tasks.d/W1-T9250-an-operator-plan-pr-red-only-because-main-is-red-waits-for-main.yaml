      proof: 'grep: test("W1-T9250: an operator plan PR red on a check main also fails waits for main" in test/an-operator-plan-pr-red-only-because-main-is-red-waits-for-main.test.ts'
    - claim: "once main is green, that stood-down operator plan PR is refreshed onto main"
      proof: 'grep: test("W1-T9250: the waiting operator plan PR is refreshed once main is green" in test/an-operator-plan-pr-red-only-because-main-is-red-waits-for-main.test.ts'
    - claim: "an operator plan PR red on a check main passes still escalates as a plan violation"
      proof: 'grep: test("W1-T9250: an operator plan PR red on its own check still escalates" in test/an-operator-plan-pr-red-only-because-main-is-red-waits-for-main.test.ts'
    - claim: "the new test file passes"
      proof: "unit test: test/an-operator-plan-pr-red-only-because-main-is-red-waits-for-main.test.ts"
  falsifier: |
    Restore the early `inheritedRedRefresh` return for non-machine heads: the first test reads refused-escalate and
    blocker plan-proof-unrunnable, and the second sees no update-branch call. Make the wait unconditional: the third
    test, red on a check main's run passed, reads wait instead of refused-escalate.
