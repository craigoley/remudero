- id: W1-T3723
  title: "MERGING A FIX TO THE REVIEWER STOPS THE REVIEWER, AND NOTHING CAN START IT AGAIN — the freshness guard refuses to judge on stale code, self-sync refuses to fast-forward a detached HEAD, and the only recovery left is a restart a multi-instance host refuses: run the review from a worktree at origin/main instead"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    OPERATOR REPORT 2026-09-17, verbatim: "This isn't a loop we should get stuck in EVER! If the
    checkout is behind it should be able to get up to speed. It shouldn't require a reboot to do a
    review."

    THE LOOP, TRACED END TO END ON THE LIVE FLEET:

      (1) #5873 merges. It touches `src/lib/review.ts` -- the reviewer's own code.
      (2) The daemon's loaded code is now 3 commits behind origin/main, and
          `checkReviewerCodeFreshness` (self-sync.ts) calls that STALE because
          `advanceIsMaterial` sees a reviewer-relevant path.
      (3) `buildReviewerCodeFreshnessGate` (run-task.ts) therefore SKIPS every review. MEASURED:
          seven `review.skipped_stale_reviewer_code` rows in 45 minutes, naming #5883 and #5876,
          each with `code_sha 32113c3ae, origin_main_sha 93a9d95d2, changed_paths 5`.
      (4) Self-sync cannot close the gap: the entrypoint checks the daemon out `--detach` by
          design, and W1-T445 refuses to fast-forward a detached HEAD -- correctly, because this
          repo cuts detached heads for base-side comparisons and advancing one would turn a
          base-vs-head diff into head-vs-head.
      (5) So the only recovery is a restart. W1-T3691's recurrence ladder DID fire and ask for one.
          MEASURED: `deploy.restart_refused ... recycle-container: REFUSING -- no --instance given
          while .remudero/daemon-instances.yaml declares instances.` W1-T3596 added that registry
          so an operator could not recycle CORE while meaning console -- also correct -- and the
          daemon's self-restart names no instance.

    EVERY GUARD IN THAT CHAIN IS INDIVIDUALLY RIGHT. Composed, they are a trap with no exit: the
    fleet cannot review after merging a change to its reviewer, and cannot restart to fix that.
    The board sat for over an hour; every green PR was reviewed by hand.

    THE MISREAD THAT MAKES IT LOOK UNSOLVABLE. "Stale reviewer code" is treated as a property of
    the DAEMON that only a restart can change. It is a property of the LOADED MODULE -- and a
    review does not need THIS process's modules, only fresh ones.
  design: |
    (i) MOVE THE WORK, NOT THE CODE. On a stale reading, run `rmd review <pr>` as a SUBPROCESS from
        a detached worktree pinned at origin/main. A new process loads fresh code by construction,
        so no restart, no hot-swap, and no waiting.

    (ii) NOTHING MOVES AN EXISTING REF. `git worktree add --detach` cuts a NEW tree; the daemon's
         own pinned HEAD is untouched, so W1-T445's concern cannot arise. It is the same `--detach`
         worktree the review path already cuts to execute proofs (`realReviewWorktree`,
         composition-root.ts) -- cut at the BASE rather than at the PR head.

    (iii) FAILURE IS `undefined`, NEVER A VERDICT. Fetch, worktree and spawn failures all return
          `undefined`, and the caller falls back to the ordinary skip. This can make a stale
          reviewer review with FRESH code or not at all; it can NEVER make it judge with stale
          code. W1-T3691's recurrence ladder still sees that skip and still escalates, so the
          restart path remains the floor rather than being replaced.

    (iv) ONE WORKTREE PER CODE SHA, REUSED. A pass reviewing six PRs behind one lag pays one
         worktree, not six. The sha is in the path, so a later, different lag cannot silently reuse
         a tree cut for an earlier one.

    (v) WIRED, NOT MERELY EXPORTED. The runner is passed at the real call site in `buildSweepEffects`.
        A fresh-tree runner nothing passes would be the shipped-unwired shape, and the entire point
        is that production stops needing a restart.

    NOT IN SCOPE, and its own filing: the daemon's self-restart names no `--instance`, so
    `deploy/recycle-container.sh` refuses it on any host whose registry declares instances. That
    path is no longer the ONLY recovery once this lands, but it is still broken and should be fixed.
  acceptance:
    - claim: "a stale reviewer reviews the pull request from a fresh tree instead of skipping it"
      proof: "unit test: a stale reviewer runs the review from a fresh tree instead of skipping it"
    - claim: "a fresh reviewer still reviews in process, so the ordinary path pays nothing for this"
      proof: "unit test: a fresh reviewer still reviews in-process, so the ordinary path is untouched"
    - claim: "a fresh tree that cannot be prepared falls back to the skip and never lets stale code judge"
      proof: "unit test: a fresh tree that cannot be prepared falls back to the skip, never to a stale verdict"
    - claim: "the worktree is detached and no existing ref is moved, so a base-side comparison cannot be corrupted"
      proof: "unit test: the runner cuts a DETACHED worktree at origin/main and never moves an existing ref"
    - claim: "a pass behind one lag cuts one worktree and still reviews every pull request in it"
      proof: "unit test: one worktree per code sha, reused across the PRs of a pass"
    - claim: "the recurrence ladder still sees a skip when the fresh tree is unavailable, so the restart escalation is preserved"
      proof: "unit test: with no runner wired at all the gate behaves exactly as it did before"
  falsifier: |
    Make the unavailable-tree branch call the in-process reviewer and the third assertion goes red
    -- MEASURED, that is the one that matters most, because judging with stale code is worse than
    the outage this fixes. Drop `--detach` from the worktree add and the fourth goes red. Cut a
    worktree per PR instead of per sha and the fifth goes red. Leave the runner exported but
    unwired and nothing in the suite fails -- which is why design (v) is asserted at the call site
    by reading, not by test, and named here so a reviewer checks it.
  risk: high
  band_meaning: blast-radius
