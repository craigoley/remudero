  rationale: |
    OBSERVED 2026-11-20: "a running pass takes precedence over a previously completed pass since the latch" in
    test/a-latched-restart-exits-when-its-last-lane-settles.test.ts failed on core PR #19721 (coverage-shard (6/12),
    Actions job 136477819091) with "true !== false" on h.finished(), in a PR that does not touch it.
    CAUSE: W1-T13888 (#19797) made passWithinLimit in src/lib/daemon.ts race the pass against a real setTimeout whose
    delay is computed from the injected fake clock. At the test's 4*windowMs+3 that delay is 0, so the timer fires
    as soon as the fixture's setImmediate flushes run, and the exit may finish before the test reads h.finished().
  design: |
    NO-INVARIANTS: test-only change; it moves no product behaviour.
    1. Give the running-after-completed fixture a freshnessMaxDrainWaitMs (6 windows) that keeps the limit after its
       third pass, so the drain timer is not already due when the test checks that the daemon is still waiting.
    2. Before that check, wait real time (setTimeout(resolve, 5)), so a timer that would fire does fire first.
  falsifier: |
    Remove the fixture's drain limit and the test is again racy at 4*windowMs+3 under load.
