  rationale: |
    OBSERVED 2026-09-02 IN THE OPERATOR'S OWN LOG:

        fix rung: standing down before strike 2 — blocked_ci dispatch with zero enumerable failing
        check(s) — the checks-red rollup and the ci-log evidence miner disagree, so there is nothing
        to hand a fix worker; standing down rather than spending a strike on empty evidence

    THE STAND-DOWN IS THE RIGHT LOCAL DECISION. Spending a strike on empty evidence would buy a
    worker with nothing to read. The defect is not the refusal; it is that the disagreement is
    terminal. The PR is red by the rollup, unexplainable by the miner, and the run ends with no
    diagnosis, no strike spent, and no one holding it. The next tick reaches the same state.

    THE DISAGREEMENT IS THE FINDING AND IT IS NOT RECORDED AS ONE. Two instruments read the same
    PR and return incompatible answers: one says a required check failed, the other cannot name a
    failing check. Exactly one of them is wrong, and which one matters — a rollup that reddens on a
    check the miner cannot see hides real failures, while a miner blind to a real red hides them
    from every fix worker. Today the pair is reconciled nowhere and the discrepancy leaves no row
    a later census could count.

    THIS IS A BOUND-SHAPED FAMILY THE REPO ALREADY TRACKS, in its second direction. CLAUDE.md's
    recurring defect is a bound that fires on a HEALTHY condition; this is an instrument that
    reports NOTHING on an unhealthy one. Both end the same way: a decision taken on evidence that
    was never there.

    WHAT THIS TASK OWES. Record the disagreement as its own ledgered event carrying both sides —
    what the rollup called red, and what the miner enumerated — so the population becomes
    countable and the wrong instrument becomes identifiable from history rather than from a live
    reproduction. The stand-down itself stays: this task does not spend a strike on empty evidence
    either, and does not change when a fix worker is dispatched.
