  rationale: |
    OBSERVED: PR-flow baseline 2026-09-24 — median 37 min, 77% in repair rounds; fix rounds run sequentially in sweep.ts.
    paired-trial.ts (W1-T4625) and W1-T4638 already build sealed side-attempt worktrees but forbid production effect.
    SWE-Gym (https://arxiv.org/abs/2412.21139) and R2E-Gym (https://arxiv.org/pdf/2504.07164): verifier-selected best-of-16
    reached 32.0% vs 42.8% oracle; R2E's hybrid verifier combines execution with a judge — rmd's proofs + reviewer.
  design: |
    (i) FIRST, offline: from paired-trial rows, compute P(either attempt passes) - P(normal attempt passes) per task shape.
    (ii) Only for shapes where that gap pays for the extra attempts (a ratio of measured gain to window share, never a fixed k),
    spawn parallel sealed attempts after the first failed strike; select by proofs, then reviewer.
    (iii) The chosen attempt is pushed as the fix round; the rest are discarded and ledgered.
