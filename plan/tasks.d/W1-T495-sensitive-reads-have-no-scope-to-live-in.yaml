  note: "risk:high IS SET UP FRONT. `files:` spans two subsystems (src/, test/) and
    `sizingViolation` (src/lib/task-linter.ts) blocks at >=2 below high; the band is Rule 19's SPAN,
    and it is independently warranted because this edits the auth dispatch every route passes
    through. budget_usd 45 — one type change, one dispatch branch, one flag, and an over-HTTP
    falsifier in both directions.

    `files:` IS TWO PATHS AND BOTH WILL BE TOUCHED. `src/lib/service.ts` is where `Scope`,
    `IdentityProvider`, `Route` and `createService`'s dispatch all live, so the whole mechanism
    lands in one module. The single new test file carries both falsifier directions rather than
    splitting them, because `inverseScopeUntouchedFiles` (src/lib/review.ts) fails a
    declared-but-untouched path exactly as `scopeViolationFiles` fails an undeclared one, and a
    second declared test file the implementation folded into the first would fail that check.
    `src/lib/serve.ts` is NOT declared: no route is labelled here, so nothing in it is touched, and
    W1-T493 already declares it. `src/run-task.ts` is NOT declared: the flag is a `ServiceOptions`
    field, not a CLI surface.

    PROOF NOTES: all three proofs are the pure-path form against a declared file, which lint-passes
    and executes the whole file; the named file does not exist yet, which is the legitimate forward
    reference for an unimplemented task — what holds today is that the proof PARSES. A path resolves
    to exactly one file by construction, so none can trip the zero-or-many warning W1-T488 added.
    No proof names this shard, so the implementation is not capped at 0/N by self-reference.

    W1-T430's SHARD IS STALE AND THAT MATTERS TO WHOEVER BUILDS THIS: it reads status queued, but
    `IdentityProvider` is BUILT and exported from src/lib/service.ts, with `ServiceOptions.providers`
    appended after the two built-in grantors and its own doc naming a future relay-brokered browser
    session as the anticipated third. So the seam a session would attach through already exists; it
    is the session's ISSUER, not its attachment point, that is undefined. depends_on is EMPTY on
    purpose — this widening needs neither the relay nor a session, and making it wait on either
    would block the one piece that is ready."
