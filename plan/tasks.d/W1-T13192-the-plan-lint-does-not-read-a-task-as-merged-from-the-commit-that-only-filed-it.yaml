  acceptance:
    - claim: "A task whose only crediting commit changed nothing outside the plan is not merged for the plan lint: an amendment to its record is linted as an amendment to a queued task"
      proof: "grep: W1-T13192 criterion 1 in test/plan/the-plan-lint-does-not-read-a-task-as-merged-from-its-own-filing.test.ts"
    - claim: "The lint and the daemon's projection give the same merged answer for the same task and the same history, from one shared rule"
