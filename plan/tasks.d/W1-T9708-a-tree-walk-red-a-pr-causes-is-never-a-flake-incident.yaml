    - W1-T7765 (test/every-host-git-spawn-into-a-worktree-uses-the-hardened-leaf.test.ts, 0 recovered,
      10 also failed): every cited PR adds a raw git spawn the ratchet counts. #10203 909500c21 and #10377
      1e27fa25f add `"-C", root`, #10643 42907e7b1 adds `"-C", root`, and #10671 94c377cf9 adds
