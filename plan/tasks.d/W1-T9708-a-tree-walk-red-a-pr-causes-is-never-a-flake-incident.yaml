    - Main was green on both tests throughout: 38 and 15 sweep.base_reproduction passes, per agent R1.
      W1-T7269 (merged) was an earlier filing for the same git-spawn census, also with 0 recovered.
    READ at origin/main 49ee61067:
    - src/lib/flake-incident-gardener.ts `runFlakeIncidentGardener` → `evidenceOf` clears a PR's observation
      when its changed paths (`readChangedPaths(base, head)`) miss `own`, which is the test file plus
      `testSourcePaths` (its relative imports). A census suite imports none of what it walks, so every PR
      that adds a site the census reports reads as clear.
    - src/lib/ci-parity.ts already knows which tests are censuses and what they walk. The registry
      `CENSUS_MEMBERSHIP_SUITES` (behind `rmd census-membership`, W1-T2969) carries catch-erasure-census,
      walks ["src/"]. The candidate recognizer behind the same command (`discoverCensusCandidates`: the
      `ls-files|readdirSync|globSync` idiom, then `censusCandidateWalks`) names the git-spawn test, walks
      ["src/"]. Nothing hands either to the gardener.
    - W1-T9551 (#12088, open) routes a group with no recovered retry to main-health. Alone, it would send
      W1-T7532's evidence to main-health as a main red; main-health would find main green and log the hint
      resolved. It would say nothing about the PRs that caused the red, and it still counts PR-caused census
      reds toward a group that has one recovered retry, such as W1-T7248's (1 recovered, 2 also failed).
  design: |
    1. ONE CENSUS READER, NEVER TWO. src/lib/ci-parity.ts exports a pure `censusWalksOf(testFile, text)`.
       It returns the registry row's `walks` when `CENSUS_MEMBERSHIP_SUITES` names the file. Otherwise, when
       the text carries the enumeration idiom `discoverCensusCandidates` matches, it returns
       `censusCandidateWalks(text)`. Otherwise it returns []. `discoverCensusCandidates` reads its idiom from
       the same constant, so the gardener and `rmd census-membership` cannot disagree on what is a census.
    2. ATTRIBUTE, DO NOT COUNT. In `evidenceOf`, a coverage-shard observation whose retry ALSO failed, of a
       test whose `censusWalksOf` is non-empty, is not clear when any of the PR's changed paths lies under
       one of those walks. The PR is that red's candidate cause, exactly as a PR that edits the test is. The
       PR therefore never counts toward a flake incident, a watch row, or W1-T9551's main-inherited
       classification. No new ledger step and no digest bump.
    3. A RECOVERED RETRY KEEPS TODAY'S PATH. A census that passes on retry on the same tree is timing, not
       the tree, so a recovered observation is cleared by the existing rule alone. A PR whose diff stays
       outside every walk, such as a plan-only or docs-only PR, also keeps today's rule. A fix-round
       observation is unchanged: it carries no base sha to read a diff from.
    4. MAIN RED STAYS VISIBLE. The rule only removes PRs from the count and never files anything. A census
       main itself fails still reds PRs outside its walk, and main's own CI and W1-T9551's main-failures
       reader still see it.
