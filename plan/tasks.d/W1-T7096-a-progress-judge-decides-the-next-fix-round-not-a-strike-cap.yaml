- id: W1-T7096
  title: "A PROGRESS JUDGE DECIDES THE NEXT FIX ROUND, NOT A STRIKE CAP — after each fix round an LLM judge reads the round history and the current red and rules continue, change-approach or escalate (naming the loop); the fixed strikeCap stops deciding"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — the fix ladder's continue/stop decision moves from a fixed cap to a ledgered judge verdict
  band_meaning: span
  origin: "operator ruling 2026-10-09: 'I don't think 2 fix attempts is enough - an llm judge should determine if more fix attempts should be made or if we're in an endless loop that needs escalated. I hate hard ceilings'"
  plan_refs: [W1-T2452, W1-T1284, W1-T5544, W1-T5334, W1-T100]
  files: [src/lib/fix-progress-judge.ts, src/lib/sweep.ts, src/run-task.ts, test/a-progress-judge-decides-the-next-fix-round.test.ts, "src/lib/read-model-worker.ts"]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED 2026-10-09: the operator hand-fixed stuck PRs all morning (#10234, #10265, #10296, #10298, #10300,
    #10310) while the fleet's fix lane sat at "ci-log fix, strike 1/2". The ladder's only exits are a fixed
    POLICY_SWEEP.strikeCap (2) and the per-arm stand-downs, so a PR either stops after two rounds whatever they
    achieved, or parks in a stand-down with no exit. The operator ruled that a fixed ceiling is the wrong
    instrument: a round that is making progress should continue, and a loop should be NAMED and escalated, not
    counted. The sweep already records every input a judge needs per round: fix.dispatch (head_sha, ci_failures,
    unmet_claims, strike), fix.done (pushed_head_sha, fix_outcome, subtype), fix.commit_refused (reason) and the
    PR's current red set, so the judge needs no new reads. W1-T100 shaped the fix evidence (review vs ci-log);
    this task leaves that shape alone and replaces only the continue/stop decision.
  design: |
    New src/lib/fix-progress-judge.ts (exporting judgeFixProgress) on the existing judge plumbing (the risk-judge provider path the
    machine-filing judge uses via planRiskJudgeAction / judgeReview — never a new provider path):
      1. Deterministic PRE-SIGNALS, computed from the ledger and fed to the judge, never deciding alone:
         no-op round (no pushed head, or pushed == dispatched head), identical red set before/after a round,
         identical diff between rounds, oscillation (a red set seen two rounds ago returns), and REFUSED rounds of
         any reason. Refusals are never strikes, so a head whose rounds keep being refused for alternating reasons
         (#10234 at f417641, 2026-10-09: "no anchored COMMIT_MESSAGE line", then "the worker changed nothing")
         loops "retrying the fix round" with no bound today. A no-op round on a red the worker cannot reproduce
         is the flake/base-red signal: the judge's options include rerun-failed-jobs and attribute-to-base, not
         only another round.
      2. The judge input: each prior round's dispatched head, fix_outcome, failing-check set before/after, the
         round's diff stat, the pre-signals, and the current red. Output: {verdict: continue | change-approach |
         escalate, loop?: string naming the loop ("same failing set for N rounds", "oscillating", "no-op rounds"),
         approach?: string, reason}.
      3. TIERED, SELF-HEALING STRICTNESS, no hard number: the prompt asks for stronger evidence of progress as the
         round count grows (the round count is shown, not compared to a cap); a verdict's reason is ledgered as
         fix.progress_judged. An unparseable or absent verdict re-asks next pass and never dispatches blind.
      4. In runSweep's blocked-fixable arm, replace the strikeCap/fixDispatchBudget gate with the judge verdict:
         continue → dispatch the next round; change-approach → dispatch with the judge's approach text added to the
         worker evidence; escalate → the existing deps.escalate with the named loop. fixCeilingInForce and the
         clarify-answer extension become judge inputs (an operator answer is shown to the judge), not ceilings.
      5. Every existing fix stand-down that today waits with no exit (metadata red "awaiting a fresh edited-event
         verdict", "fix commit refused at this head and red set — incomplete round history", "fix rounds refused
         twice at this head — no further round can add information", a head still red after its one W1-T6353
         failed-job rerun, proof-repair refusals past MAX_PROOF_REPAIR_REFUSALS_PER_HEAD, a scope amendment that
         closed unmerged) routes into this judge after its own wait, so no parked state is permanent.
  acceptance:
    - claim: "a round that changed the red set continues past the old strike cap; three no-op rounds escalate with the named loop"
      proof: 'unit test: test/a-progress-judge-decides-the-next-fix-round.test.ts'
    - claim: "the sweep's blocked-fixable arm asks the progress judge before dispatching another round"
      proof: 'grep: judgeFixProgress( in src/lib/sweep.ts'
  falsifier: |
    Restore the strikeCap gate: a PR whose third round would fix a shrinking red set is escalated at strike 2,
    and the test asserting a fourth dispatch fails.
