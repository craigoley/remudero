- id: W1-T6095
  title: "THE RECYCLER MOUNTS THE OWNER'S CREDENTIAL READ-ONLY — W1-T4863's per-instance claude_dir reached the registry and install-host-units.sh but not recycle-container.sh, so a non-primary instance can only be split from ~/.claude once the recycler mounts the owner's .credentials.json and App key read-only"
  repo: remudero
  depends_on: [W1-T6061, W1-T6252]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: W1-T6061's root cause (W1-T4863 half-built)"
  plan_refs: [W1-T4863, W1-T6061, W1-T4198]
  files: [deploy/recycle-container.sh, .remudero/daemon-instances.yaml, test/the-recycler-mounts-the-owners-credential-read-only.test.ts]
  status: blocked
  retirement: retired
  attempts: 0
  rationale: |
    READ 2026-10-06 on origin/main: install-host-units.sh's registry_primary_claude_dir and
    CREDENTIAL_ARGS mount the primary instance's .credentials.json read-only into a non-primary
    instance's own claude_dir (W1-T4863, D-11), but recycle-container.sh mounts only CRED_DIR (the
    instance's claude_dir) and has no owner-credential or read-only mount. W1-T6061 therefore keeps
    site and console on the owner's ~/.claude; the per-instance isolation W1-T4863 intended is not
    live anywhere.
  design: |
    recycle-container.sh, for a live non-primary instance whose claude_dir differs from the primary's,
    mounts the primary's .credentials.json read-only at /home/node/.claude/.credentials.json (the same
    argv install-host-units.sh renders) and the App key through gh_app_private_key_host_path
    (app-private-key-mount.sh, #9649), and its pre-stop worker smoke runs with those mounts. Then the
    registry re-splits site and console. Host half (operator, in order): mkdir -m 700
    ~/.claude-site and ~/.claude-console owned by the service user; sync /etc/remudero/daemon-instances.yaml;
    install-host-units.sh --instance site|console --install; recycle each; verify a worker reaches
    Claude on each.
    AMENDED 2026-10-07 (W1-T6252 ruling): a split instance must still resolve the ONE shared fleet credential.
    W1-T6252 provisions it at <host ~>/.claude/fleet-auth/claude, which every instance reaches today only
    because all three bind the owner's ~/.claude. With a per-instance claude_dir that path would resolve inside
    ~/.claude-site, re-creating per-instance copies of one OAuth lineage (the 2026-10-07 core outage). So the
    recycler (and install-host-units.sh's argv) also bind the primary's ~/.claude/fleet-auth READ-WRITE at
    /home/node/.claude/fleet-auth, and the worker smoke proves the split instance resolves that file.
  acceptance:
    - claim: "a non-primary instance with its own claude_dir is recycled with the owner's credential and App key mounted read-only"
      proof: 'grep: test("W1-T6095: a split instance is recycled with the owner''s credential mounted read-only" in test/the-recycler-mounts-the-owners-credential-read-only.test.ts'
    - claim: "a split instance mounts the primary's shared fleet-auth store read-write, so it refreshes the one fleet credential"
      proof: 'grep: test("W1-T6095: a split instance mounts the shared fleet credential store read-write" in test/the-recycler-mounts-the-owners-credential-read-only.test.ts'
  falsifier: |
    Drop the owner-credential mount: the recycler's docker run argv for a split fixture instance lacks
    the read-only .credentials.json mount and the test fails.
  note: |
    DISPATCH HOLD: changes production credential layout for site and console; operator build and
    host half, after W1-T6061 is live and the Node 24 rollout (W1-T5883) has settled.
    RETIRED 2026-10-07 (operator ruling, accepting the session's recommendation): W1-T6252's single shared fleet
    credential (live since 21:41Z, all three instances resolve /home/node/.claude/fleet-auth/claude) removed the
    credential-divergence reason for splitting site and console off the owner's ~/.claude. What the split would
    still buy is keeping the owner's Claude history and settings out of site/console workers, which did not justify
    a high-risk host change. Reopen as a new task if that isolation becomes a requirement.
