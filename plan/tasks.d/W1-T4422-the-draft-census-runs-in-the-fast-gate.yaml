- id: W1-T4422
  title: "THE NO-DRAFT CENSUS RUNS ONLY IN CI'S TEST SHARDS — register it in the fast gate so preflight refuses draft-creating code before a push, like every other census"
  repo: remudero
  depends_on: [W1-T4415]
  priority: 3
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high
  band_meaning: span
  origin: "W1-T4415 build (#6923) scope cut"
  plan_refs: ["W1-T4415", "W1-T2478"]
  files:
    - src/lib/ci-parity.ts
    - package.json
  status: blocked
  retirement: closed
  # plan gardener: retire W1-T4422 — Every acceptance proof now holds on main, and did not when it was filed.
  attempts: 0
  rationale: |
    W1-T4415 (#6923) ships scripts/no-draft-pull-request-census.mjs and holds the tree at zero through its test, which
    runs in CI's coverage shards. It is not in FAST_GATE_STEPS, so `rmd preflight` does not run it and a session
    learns of a violation only after pushing. Registering a census means a ci-parity.ts ADMITTED entry, a
    package.json census script and the two pinned FAST_GATE_STEPS lists.
  design: |
    Add `census:no-draft-pr` to package.json (running the census test), an ADMITTED ci-parity.ts entry with its walks
    and measured duration, and update the pinned fast-gate lists in test/preflight-fast-mode.test.ts and
    test/preflight-coverage-mode.test.ts.
  acceptance:
    - claim: "preflight's fast gate runs the no-draft census"
      proof: 'grep: census:no-draft-pr in src/lib/ci-parity.ts'
  falsifier: |
    CLOSE IF the fast gate already runs the no-draft census.
