    risk:low and RULE 19 SIZING CHECKED, NOT ASSUMED: `subsystemsOf` discounts `plan/claims.yaml` as a
    plan-data artifact (DATA_ARTIFACT_CLASSES, `^plan/` + `.yaml`), so the declared set resolves to ONE
