- id: W1-T6147
  title: "CUTTING A WORKTREE RUNS NO TRACKED OR GITDIR HOOK — worker.ts worktreeAdd and worktreeAddAsync run a raw `git -C <repoDir> worktree add`, which runs post-checkout from whatever hooks path the source clone's config names, or from its common gitdir's hooks/, a directory a codex worker can write through its --add-dir git roots; W1-T6122 recorded both as HARNESS-only and left them raw"
  repo: remudero
