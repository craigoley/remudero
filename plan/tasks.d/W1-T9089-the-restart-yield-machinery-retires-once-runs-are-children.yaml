  rationale: |
    ADR 0007 decision A.10. Six defects in one week came from this coupling (W1-T8139, W1-T8198, W1-T8503, W1-T8535,
    W1-T8676, W1-T8927). Once every build run is a child that a booting daemon adopts, a freshness restart has nothing
    to drain but its own reviews and detached actions.
    PRECONDITION (evidence the PR quotes): `run_child.mode_decision` rows, read with `rmd ledger-grep` over every
    rotation form with a positive control, showing auto held `on` since its first promotion with no demotion.
    The 11 test files in files: reference the deleted symbols at origin/main 5f8d3f178
    (`grep -rlE "restartAtWorkerBoundary|restartHoldouts|holdoutDeadlines|restart_holdout|restart_yield_asked|DAEMON_SELF_PATH_PREFIXES|DAEMON_SELF_COMMIT_SCOPE|freshness_restart_waiting|readRestartHistory|restartLatchDetail" test`);
    re-run it before building. Each one is repointed at the child behaviour or removed with the behaviour it pinned,
    never weakened to pass.
    OVERLAP: lint-plan reports W1-T147 (chaos drill, whole-file surface only) and W1-T8927 as sharing these files.
    W1-T8927 merged as #11281 (its shard status lags); this task deletes the holdout W1-T8927 built, once no run needs
    it. W1-T9069 (Layer 1, filed 2026-10-13: a latched restart refills a freed lane with work that ends before it)
    improves the same latch meanwhile and is retired with it here. That supersession is the point of this task.
  design: |
    1. Delete, in `runDaemon` (src/lib/daemon.ts): the `restartAtWorkerBoundary` closure; the `inFlightFreshness` /
       `latchRestart` latch; `restartHoldouts`, `holdoutDeadlines`, `yieldAsked`, `admittedUnderLatch`,
       `restartStillWaitingOnHoldout`; the latch wait before `stopForFreshness`; the freshness polling in
       `actOnDispatchFreshness` and `onDispatchTick`; the `refillClosed ??= "stale code"` arms (`refillClosed` stays);
       the rows `daemon.restart_holdout`, `daemon.restart_yield_asked`, `daemon.freshness_restart_waiting`;
       `restartWorkHistory`, `readRestartHistory`, `RESTART_HISTORY_WINDOW_MS`; `restartLatchDetail` and the watchdog's
       `restartPending` reading.
    2. Delete in src/run-task.ts: the `restartAtWorkerBoundary` branch of `yieldAtWorkerBoundary` and the daemon
       override in `ciWaitFreshness`; the in-process runOne path.
    3. Delete `DAEMON_SELF_PATH_PREFIXES` and `DAEMON_SELF_COMMIT_SCOPE` (src/lib/deploy-judge.ts); `freshnessAdvanceWorth`
       falls through to `deterministicDeployWorth` for every advance the closure task calls material.
       AMENDED 2026-10-15 (operator session): delete #11861's stop-gap with them. That is src/lib/advance-declarations.ts
       (`withTouchedDeclarations` and its parser), `entryChangeOutsideTheDaemon` in src/lib/deploy-judge.ts, the
       src/run-task.ts import and wiring, and
       test/a-run-task-change-outside-the-daemons-declarations-waits-for-the-age-horizon.test.ts. #11861 (merged
       2026-10-15 01:04Z) gives full restart weight only to the src/run-task.ts declarations it names as the daemon's
       own. Once the self-path list it refines is gone, it weighs nothing.
    4. Keep, triggered by an image recycle only: `commitAndPushRestartCheckpoint`, `restoreBoundaryCheckpoint`, the
       `run.freshness_handoff` receipts and readers, the leftover-branch guards, `externalWaitRecycle`,
       `inflight.recycle_yield`, `deploy.drain_handoff`, `drainBeforeRestart`.
    5. The mode switch keeps `shadow` and `auto` only for the probe; `off` and the in-process path are gone. Auto's
       demotion becomes an escalation (`run_child.contract_failing`, raised by `escalateRunChildContract(...)` from the
       daemon wiring in src/run-task.ts through the existing escalate path) since there is no in-process path to fall
       back to; the lost-child crash path keeps every run's outcome correct meanwhile.
