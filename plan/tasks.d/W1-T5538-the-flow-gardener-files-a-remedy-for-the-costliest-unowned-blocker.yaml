    high, with band_meaning: span.
  design: |
    1. EPISODES (src/lib/flow-gardener.ts).
       - Read `sweep.disposed` rows carrying `blocker` through `readLedgerUnionRecordsSync`, as
         `readCiFrictionLedgerRecords` does.
       - Per PR, order the observations. The time between two consecutive passes that observed the PR is
         charged to the earlier observation's blocker. The PR's last observation charges nothing.
       - Cause key = `<blocker>:<reason class>`. The reason class is the disposition reason with shas,
         numbers and PR refs normalised, cut at its first ` — `, so `escalated` splits into its real classes.
       - Weight each charge by `ciFrictionRecencyWeight` with `CI_FRICTION_HALF_LIFE_MS`. There is no hard
         window.
    2. WHICH CAUSES ARE CANDIDATES.
       - Owner `NONE`, or an owner that did not clear it: an episode that ended with the PR closed unmerged
         or merged by a non-fleet actor, or an episode still open longer than the 90th percentile of that
         same cause's own cleared episodes.
       - The bar is self-calibrating per cause, never a fixed number.
       - Rank by weighted PR-hours, tie-broken by distinct PRs.
    3. LADDER AND EFFECT.
       - Origin `flow-blocker:<key>`, then `#r<N>` above rung 1, on the same grammar as
         `ciFrictionRungOrigin`.
       - Effect = that cause's share of total PR-hours in equal windows before and after the remedy's merge,
         using the same one-sided comparison and pending/unmeasurable states as `ciFrictionRemedyEffect`.
       - A debit reopens the cause at the next rung. Rung `CI_FRICTION_ESCALATE_RUNG` escalates through the
         owner-assigned issue path (`sreOperatorEscalation`, src/lib/sre-runbooks.ts:306) and files nothing.
    4. FILING.
       - The `GardenSpec` shape ci-friction uses (inventory, candidates, scorecard, apply).
       - `apply` mints an id through the shared minter, drafts ONE shard naming the cause, its PR-hours, its
         top five PRs with their blocker reasons, and the owner it lacks or that failed.
       - Admit it through `ciFrictionRecordVerdict`, and open a plan-only PR (rule 15's filing exemption).
       - One filing per pass. The scorecard row is the generic `flow.scorecard` (causes, total PR-hours,
         next, ladder).
    5. REGISTER.
       - Add `flow` to `GARDEN_NAMES` (run-task.ts:269) and `REGISTERED_GARDEN_NAMES`
         (garden-registry.ts:30), with default cadence.
       - Add a `case "flow"` to `buildRegisteredGarden` modelled on the ci-friction case; it builds the
         garden from `flowGardenSpec(deps)`, the module's one exported spec builder.
