  falsifier: |
    Four reverts, each turning a named case red:
    - Charge the gap to the later observation: a PR that waited on review for an hour and was then armed
      charges that hour to armed-idle.
    - Drop the owner filter: the fix lane's own-red ranks first and is filed although its owner clears it.
    - Skip `ciFrictionRecordVerdict`: a drafted record with an unparseable proof is filed.
    - Remove `flow` from `REGISTERED_GARDEN_NAMES`: the registry case fails.
