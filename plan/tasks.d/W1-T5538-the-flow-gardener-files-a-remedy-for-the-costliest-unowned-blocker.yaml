  rationale: |
    THE PATTERN EXISTS FOR CI ROUNDS; THIS APPLIES IT TO PR WAITS. The ci-friction gardener
    (src/lib/ci-friction-gardener.ts):
    - reads the ledger union, archives included (`readCiFrictionLedgerRecords`, :137, over
      `readLedgerUnionRecordsSync`), so the live ledger's rotation does not shorten its window;
    - prices causes in PR minutes with a 7-day recency half-life (`CI_FRICTION_HALF_LIFE_MS`, :197;
      `priceCiFrictionCauses`, :217);
    - walks the top causes through a ladder (`ciFrictionLadder`, :782; `LADDER_DEPTH = 8`, :769);
    - files one plan-only shard per pass (`apply`, :945-990);
    - measures each landed remedy by the cause's before/after share in equal windows
      (`ciFrictionRemedyEffect`, ci-friction-remedy.ts:114). A debit reopens the cause one rung up
      (`ciFrictionCauseState`, :165; origin `ci-friction:<key>#r<N>`, `ciFrictionRungOrigin`, :63), and rung 3
      escalates (`CI_FRICTION_ESCALATE_RUNG`, :40).

    It prices only extra CI rounds. A PR that waits with no round at all is invisible to it: an escalated
    PR parked on a metadata-only red, an armed PR GitHub never merged, or a reviewer withholding verdicts.

    FILING ADMISSION, AS IT IS.
    - ci-friction admits a drafted record through `ciFrictionRecordVerdict` (:685), which is
      `loadPlanFromYaml` plus `lintTask`. It does NOT run `lint-plan --base`; no gardener does.
    - This gardener reuses that same admission. Upgrading both to `lint-plan --base` is a separate item and
      is out of scope here.

    WEEK ESTIMATE, PR-hours by blocker, 2026-09-26..2026-10-03. Method and caveats are in W1-T5537's
    rationale; the escalated rows are issue-open hours.

    | blocker | PR-hours |
    |---|---|
    | escalated: metadata-only body red | 121.1 |
    | escalated: plan-only red | 100.2 |
    | own/base-red fix loop | 65.3 |
    | strikes-exhausted | 55.5 |
    | awaiting-ci/review, never needed a fix | 43.6 |
    | armed-to-merged | 26.9 |
    | awaiting-ci before the first fix | 20.3 |
    | stale-reviewer-withheld | 17.4 |
    | review-failed | 4.9 |

    Ranked over owner-NONE blockers, or blockers whose owner did not clear them, the first two filings this
    week would have been the metadata-only and plan-only escalation classes. Strike exhaustion is now
    owned by W1-T5536, and armed-idle by W1-T5492, so both drop off the unowned list once those land.
    That shift is the self-improving loop working.

    REGISTRATION, as verified on main (71fbcc6fe):
    - `GARDEN_NAMES` (src/run-task.ts:269) feeds `GARDEN_BRANCH_RE` (:272).
    - `REGISTERED_GARDEN_NAMES` (src/lib/garden-registry.ts:30) is the daemon's off-loop list.
    - `buildRegisteredGarden` (run-task.ts:33663) needs one `case` (ci-friction's is :33770).
    - Cadence comes from `gardenSchedule` (garden-registry.ts:114).
    - The censuses in test/a-gardener-pass-never-runs-on-the-daemon-loop.test.ts derive from the list, so
      they cover the new name without edits.

    Rule 19: the gardener (src/lib/flow-gardener.ts, new), its registry entry (garden-registry.ts), and its
