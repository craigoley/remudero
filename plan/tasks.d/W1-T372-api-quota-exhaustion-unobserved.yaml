  note: "verify:auto — every claim is an assertion over injected quota readings and a fixture ledger,
    with no operator present. It builds a mechanism and touches no DECISIONS.md, so W1-T353's
    verify:human requirement for ruling-shaped tasks does not apply.
    risk:high — Rule 19 counts the health tick, the escalation path and the ledger retention set as
    distinct subsystems, and a notice that fires per tick is worse than no notice: it is the escalation
    inversion the audit measured. Design (iii) and (iv) are where that risk is managed.
    budget_usd 85 — a two-bucket reader change, a transition detector, an escalator with a per-bucket
    episode key, the retention registration, and a falsifier that must prove ONCE-not-per-tick.
    files: DECLARES test/ledger-rotation.test.ts because the fourth criterion asserts the retention
    property and, per design (vi), that suite's `consumerFiles` list must gain src/lib/daemon.ts or
    src/lib/daemon-health.ts if a deciding read lands in either — the guard is blind to those files
    today. It DECLARES src/lib/ledger.ts because the escalation marker must join
    DECISION_RELEVANT_LEDGER_STEPS. Omitting a written path is what refused five dispatches in one week.
    ON THE PROOFS. Three name test/quota-exhaustion-escalation.test.ts, which does not exist yet:
    `rmd check-proof` reports 0 candidates for it today. That is a FORWARD REFERENCE TO A PATH, which
    CLAUDE.md records as safe — unlike forward-referencing a symbol name, which is a guess — and the
    path is declared in files: so the worker creates it. The fourth names test/ledger-rotation.test.ts,
    an EXISTING suite, so at least one proof executes at filing time. That fourth is a GUARD criterion
    and passes at the merge-base BY DESIGN: its claim is that the retention property holds, which must
    be true both before and after. `unit test:` proofs are structurally exempt from the executed_stale
    downgrade, which applies to `grep:` proofs only; no `grep:` proof is used here, so the line-based
    and basic-regex traps do not arise.
    A WARNING THRESHOLD IS DELIBERATELY EXCLUDED — see design (vii). Reported alongside this filing:
    a warning at, say, 10% remaining would let in-flight work finish rather than discovering exhaustion
    at a push boundary, which is exactly how W1-T333 lost forty minutes. It is a genuinely good idea and
    it is a SECOND threshold with a second dedup question (how often may a warning repeat as the budget
    drains?), so it belongs in its own task filed after this one has data."
