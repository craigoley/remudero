  title: "The review is told whether hosted CI passed each unit-test proof's file at the head it judges, by the same off-host-pass reader the fix lane's progress judge uses, so a proof that fails only in the loaded review sandbox while CI passes it is inconclusive load (W1-T11132's arm (b)) — #15532's motivating failure"
  repo: remudero
