  rationale: |
    WHY: on 2026-11-19 at 12:08Z the now view was switched to serve. core, site and console answer 200, but ops answers
    404 view_not_ready, and read_model.now_view_failed repeats "task W1-T13722: depends_on unknown task 'W1-T10840'".
    The legacy GET /v1/i/ops/status answers 503 instance_unavailable with the same reason. The ops plan holds core tasks
    (repo: remudero) that depend on core ids. Checked on a copy of the ops plan (219 files): strict loadPlan throws;
    the new readers load all 219 tasks. W1-T13752 applied this rule to the instance Inbox and W1-T13585 to the
    daemon boot read; serve's instance gateway (loadPlan) and the now view (threadPlan) still read strictly.
  design: |
    INVARIANT own-repo-dependencies-stay-strict: a task of the instance's own repository still fails the read on an
    unseen dependency with loadPlan's PlanError text, and core's reads are unchanged.
    1. instance-gateway.ts: InstanceStateRoot gets repo (the registry repo). New export instancePlanLoader(root):
       loadPlan when there is no repo, else loadPlanKeepingUnseenDependencies(path, task => !taskTargetsRepo(task.repo,
       repo)). Both plan reads in instancePlanReader use it when opts.loadPlan is not given.
    2. now-view.ts: new export nowInstancePlan(path, repo) = loadTargetPlanQuarantiningDuplicates(path, repo).plan, the
       daemon's own target read. readPlan uses it for every instance but core; core keeps threadPlan.
  falsifier: |
    Put loadPlan back in the gateway: criterion 1 fails with "depends_on unknown task". Make the predicate always true:
    criterion 2 fails because the own-repo task no longer throws.
