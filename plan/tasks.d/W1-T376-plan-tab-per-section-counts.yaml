  note: "verify:auto — a pure reduction plus a renderer, both assertable without a browser.
    risk:high — set by Rule 19's span, not blast radius: the change must exist end-to-end (normalise
    refs and resolve them in panel-graph.ts, render the pair in serve.ts) across two subsystems, and
    serve.ts's client script is a backtick template where a stray backtick breaks the esbuild parse.
    budget_usd 60 — the join is the work: five ref kinds, two section spellings, one word-shaped ref,
    plus the darkness path.
    THIRD PROOF IS A FORWARD REFERENCE TO A PATH, deliberately: test/plan-sections-render.test.ts
    does not exist yet and is declared in files: so the scope guard admits it. Forward-referencing a
    PATH is safe; the first two proofs name test/plan-view.test.ts, which EXECUTES TODAY, so this
    task is not resting on an unexecutable set. Per CLAUDE.md the render assertion gets its OWN file
    rather than being appended to an existing suite.
    depends_on W1-T375 IS ORDERING, NOT MECHANISM: both touch panel-graph.ts's plan-view surface and
    sequencing them keeps two workers off one file. W1-T375 also decides what the tab's most
    prominent list contains, which is the frame this breakdown sits beside."
