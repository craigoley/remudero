- id: W1-T3414
  title: "A FOLLOW-UP COMMIT'S `Remudero-Task:` TRAILER CREDITS THE WHOLE SQUASH — 105 merged commits in 14 days credit a task whose declared deliverables they never shipped, 99 of them with an ENTIRELY plan/ diff, and the PR author's own discipline cannot prevent it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
