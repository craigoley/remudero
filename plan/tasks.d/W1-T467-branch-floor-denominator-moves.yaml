    Its own header states the division: `an already-uncovered pre-existing line is the aggregate
    ratchet's problem, not a new regression this diff introduced.`
    — END OF THE ORIGINAL REASONING. THE AMENDMENT'S OWN MEASUREMENTS FOLLOW. —

    (A) THE EFFECT IS FAR OUTSIDE THE NOISE, over 92 CI readings (n=83 without #1739, n=9 with):
      without #1739 : branches mean **90.771%**, min 90.65, max 90.88 — every reading CLEARS 90.40
      with #1739    : branches mean **90.192%**, min 90.12, max 90.23 — every reading FAILS by 0.17-0.28pt
      => **DISJOINT.** Worst case 0.42pt apart; gap between means 0.5787pt.
    AND **LINES ROSE +2.102pt SIMULTANEOUSLY** (96.222 -> 98.324) — the same fact from the other side:
    more of the codebase became visible to the measurement. PROVENANCE: those figures are the CI
    corpus, not re-measured here. INDEPENDENTLY CORROBORATED on 5 sampled CI job logs while amending —
    pre: #1743 96.23/90.76, #1741 96.23/90.73, #1746 96.24/90.75 (all PASS); post: #1751 98.34/90.22,
    #1752 98.33/90.25 (both FAIL). Same split, same direction, disjoint at n=5 too.

    (B) NAME THE DISCRIMINATOR, BECAUSE TIMESTAMPS DO NOT WORK. A reading is 'with #1739' when its log
    says `[excluded 22 out-of-repo record(s)]` and 'without' at 21 — the step is EXACTLY one, caused by
    #1739's test spawning `/tmp/t460-child-*/probe.ts`. THIS SORTS BY CONTENT, NOT BY CLOCK, which is
    why it works on #1739's own branch pre-merge. MEASURED WHILE AMENDING: **#1746 MERGED AFTER #1739
    AND READS 21** — its head was branched before, so a timestamp sort would have filed it on the
    wrong side.

    (C) ONE SUB-RESULT IS EXACT; THE REST IS A CONVERGING ESTIMATE. SAY WHICH IS WHICH.
      **EXACT: +21 PROVEN-NEW.** CI shows 21 files falling FROM 100.00%, and the lcov shows 21 files
      whose only uncovered branch is that final record — the same 21. At 100% BRF = BRH, so each
      gained exactly one uncovered branch. No modelling.
      **ESTIMATE: ~96 net-new uncovered**, converging with this shard's own +97 and an earlier +101.
      A DIRECTION, NOT A VALUE.
    CORROBORATION FROM THE FUNCTION AXIS: function coverage collapsed **94.96% -> 67.93%**, 2123
    uncalled of 5917 in the post tree. RE-DERIVED LOCALLY HERE (in-repo files only, so the absolute
    numbers differ and the direction does not): functions 95.27% -> 67.77%, uncalled 185 -> 1813, and
    `FNF` 3912 -> 5625 — **+1713 functions DISCOVERED against +85 newly CALLED.** That is the whole
    mechanism in one line.

    (D) TRACTABILITY INVERTS, AND THIS IS THE PRACTICAL CONSEQUENCE FOR OPTION (a). The top ten files
    hold 69.6% of TOTAL uncovered branches (`run-task.ts` alone 51%), so the STOCK is concentrated —
    but the NEWLY-uncovered are **~1 per file across ~96 files, maximally spread**. Option (a) is
    therefore calling ~94 uncalled functions in ~94 SEPARATE FILES. **IT IS NOT A QUICK UNBLOCK**, and
    any reading of it as a ten-file job is wrong.

    (E) RECORD THE METHOD FAILURE SO IT IS NOT REPEATED — THE LOCAL PROTOCOL PRODUCED A VOID RESULT
    THAT LOOKED COMPLETE. **4 of 6 lcovs were 0 BYTES** while every spec file carried a normal
    tests/pass/fail summary: the emptiness is visible ONLY by `stat`-ing the lcov, never from the test
    output. AND THE SURVIVING PAIR MEASURED THE AFTER TREE TWICE — `base-r3.lcov` reports
    `src/lib/review.ts` at LF:5841, which is the AFTER length (5702 at base), and total LF is
    byte-identical at 97591 on BOTH sides. It reproduced the known-invalid signature (`review.ts` BRF
    falling 1274->957, the same shape as an earlier discarded attempt's -311).
    **SO: TAKE THIS READING FROM CI'S OWN LOGS, NOT LOCALLY.** They are uncontended, they are the
    reading the gate actually makes, and they exist in bulk. A local run on a contended box is not a
    cheaper version of that measurement; it is a different and worse one."
  design: "(i) THE DECISION IS TWO OPTIONS, NOT FOUR. Both are recorded with what is already measured;
    NEITHER is recommended here, because the choice is the operator's.
      **(1) RE-CAPTURE THE BRANCH FLOOR AGAINST TODAY'S IMPORT GRAPH, TIGHTENING LINES IN THE SAME
      EDIT.** Using the file's own margin convention (0.56 lines / 0.10 branches under the lowest
      reading): lines **95.62 -> ~97.95, a 2.33pt TIGHTENING**; branches **90.40 -> ~90.05, a 0.35pt
      LOOSENING**. MIXED, NOT PURE — say so plainly rather than selling it as a ratchet-up.
      **(2) STOP COMPARING AN AGGREGATE WHOSE DENOMINATOR MOVES WITH MODULE DISCOVERY.** The
      baseline's own `_branchFloorCorrection` (#1566) already concedes the mechanism — `THE DRIVER IS
      THE DENOMINATOR … BRH moves by 2 while BRF moves by 15` — and sized its margin at 0.1158pt, about
      1.24x a measured 15-branch noise band. **#1739 MOVED BRF BY ~204: FOURTEEN TIMES THE NOISE THAT
      MARGIN WAS BUILT FOR.** So the margin is not merely too small — IT WAS SIZED FOR A DIFFERENT
      PHENOMENON, and widening it would be fitting a bound to the wrong distribution.
    (ii) IF (2) IS CHOSEN, TWO SHAPES MUST BE KEPT APART.
      A TOLERANCE BAND at a stated multiple of measured noise — bounded, explicit, re-derivable.
      A FLOOR THAT RATCHETS UP ON GREEN — and NAME ITS HAZARD RATHER THAN SHIPPING IT QUIETLY: an
      auto-advancing floor RATCHETS ON A LUCKY DENOMINATOR. That is exactly today's defect with the
      sign flipped, and it compounds silently: each lucky run raises the bar the next honest run must
      clear.
    (iii) OPTION (b) FROM THE EARLIER ANALYSIS IS MEASURED NOT TO WORK — recorded so nobody rebuilds
    it. A session performed it exactly: source-text pin, single-line spread call site, shallow
    no-worktree driver. `diff-coverage` went GREEN and **the ratchet still read 90.16%**, because the
    shallow driver STILL ENTERS `reviewCommand` and the compilation happens anyway. Removing that
    driver would leave the spread line uncovered and re-red `diff-coverage`. NO THIRD SHAPE EXISTS:
    any line inside `reviewCommand` can only be covered by entering `reviewCommand`.
    (iv) OPTION (a) — cover the ~97-101 branches — IS REAL WORK ACROSS ~108 FILES, about one branch
    each. It genuinely improves the suite and is NOT narrow by any reading. It is not excluded; it is
    simply not a quick unblock, and presenting it as one would be dishonest.
    (v) TWO EARLIER FIGURES ARE WRONG AND ARE CORRECTED HERE so they are not re-imported: the
    `mounts.ts` `3/3 -> 22/48` came from a SCOPED TWO-FILE EXPERIMENT and is not a whole-suite reading;
    and `main scored 90.75% ABOVE the floor` described **PRE-#1739 main**, not today's."
