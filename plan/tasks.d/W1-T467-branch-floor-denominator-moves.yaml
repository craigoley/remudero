  note: "`verify: human` — BOTH options need a ruling this shard must not pre-empt. Option (1)
    DIRECTLY CONTRADICTS A STANDING INSTRUCTION IN THE FILE IT WOULD EDIT
    (`scripts/coverage-baseline.json`): `Never lower these numbers to make a PR pass — raise them
    (ratchet up) when coverage genuinely improves; a coverage-lowering PR must go CI-red.`
    THE OPERATOR'S POSITION, RECORDED AS HIS: amend that to say what it actually means — never lower
    to hide a REGRESSION, but a DENOMINATOR SHIFT IS NOT ONE.
    AND THE ARGUMENT AGAINST, WHICH THE SHARD OWES HIM: every future lowering will be argued as a
    denominator shift, because that is the cheapest available story and the person telling it is the
    person who wants the PR to land. The instruction is currently UNCONDITIONAL, which is exactly what
    makes it enforceable by a reader who was not there. Amending it trades a bright line for a
    judgement call — DEFENSIBLE ONLY IF THE AMENDMENT NAMES THE EVIDENCE A DENOMINATOR CLAIM MUST
    CARRY (BRF moved, BRH moved, the ratio of the two), not merely the exemption.
    RULE 25 — MEASURED, NOT ASSUMED, with both controls run: `INSTRUMENT_SURFACE` (`src/lib/review.ts`)
    matches `scripts/coverage-baseline.json` AND `scripts/coverage-ratchet.mjs` (via
    `^scripts/[^/]*-baseline\\.json$` and `^scripts/[^/]*-ratchet\\.mjs$`), while `src/lib/review.ts`
    and `src/lib/deployer.ts` read as PRODUCT. So an instrument change CANNOT be entangled with a
    `src/` coverage fix: **the options are separate changesets whatever the ruling**, and this shard's
    `files:` is instrument-only for that reason. Option (a) would be a DIFFERENT task.
    `enforce_admins` ORDERING — a NOTE, not a second concern. `enforce_admins: false` is HOW main
    became red: a merge landed past a red required check, TWICE the same day (#1739 and #1721, both
    merged while `ci-gate` was in progress). Enabling it NOW would bind the operator at exactly the
    moment he needs to merge the fix, because `ci-gate` would fail on the inherited drop. THE ORDER IS:
    **fix coverage -> confirm main goes green -> then enable `enforce_admins`.**
    AND THE STRUCTURAL PRESSURE, RECORDED HONESTLY: `ci-gate` legitimately takes ~25 minutes when
    something fails (`WAIT_CAP_SECONDS: 2400` plus a `GRACE_WINDOW_SECONDS: 600` re-aggregate window).
    That is a long time for a plan-only YAML edit, and hand-merging is a RATIONAL response to it. A
    remedy that makes hand-merging harder WITHOUT making the fleet faster deserves to be rejected."
