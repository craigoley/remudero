  rationale: "WITHDRAWN AS FILED 2026-08-14 — THE CHOICE THIS SHARD ASKS FOR HAS ALREADY BEEN MADE, AND NOT BY THE OPERATOR. Option (2), retiring the aggregate delta comparison, SHIPPED as #1758 (39f198a2, `fix(coverage): judge branches against absolute tiers, not a delta`). RE-VERIFIED AT f0ce71d6 WITH CONTROLS: `classifyCoverageTier` is referenced 3 times across src/ + scripts/ (positive control on the same sweep: `evaluateRatchet` 14); `branchesPct` IS NO LONGER A KEY of scripts/coverage-baseline.json (0 occurrences as a key, its 2 remaining occurrences are prose — control: `linesPct` 2); and `tierPassPct: 90` / `tierBlockPct: 85` are both present. The shipped file rules option (1) OUT in terms: `DO NOT REINTRODUCE A branchesPct DELTA FLOOR.` So neither of this shard's two options remains open — one shipped and the other is now forbidden by the merged design. NOTE THE FIGURES DIFFER FROM THE BRIEF THAT COMMISSIONED THIS CLOSURE (2 and 4); the scope here is src/ + scripts/ at f0ce71d6 and is stated so the count can be reproduced. THE PATTERN, NAMED BECAUSE IT WILL RECUR: A `verify: auto` SIBLING SHIPPED THE SUBSTANCE OF A `verify: human` SHARD WHILE THAT SHARD SAT WAITING FOR A RULING, AND NEITHER SIDE NOTICED. Nothing links a human-gated question to an auto-gated task that would answer it, so the queue can hold a live question whose answer has already merged. The cost here was bounded — two shards' worth of stale asking — but the mechanism is general and this is the second instance in two days. status: blocked, NOT a new status: `withdrawn` is NOT in plan.ts's TASK_STATUSES (queued, recon, prompted, running, review, fixing, diagnosing, blocked, merged, done). W1-T270 already hit exactly this and established the equivalent — `status: blocked` as a `RECORD of the retirement decision, not a work item` — so this follows that precedent rather than inventing one. RETRACTED IN PLACE, NOT DELETED (MASTER-PLAN §8A asks for compression, not erasure): every acceptance criterion and the whole original argument are preserved verbatim below, because they are the record of a question that was live when it was asked. THE RESIDUAL, RECORDED HERE SO THE CLOSURE DOES NOT SWALLOW IT: the LINE floor is untouched by #1758 and is still a delta floor. `linesPct: 95.62` against a real CI figure of 98.32-98.37 over 17 readings (mean 98.348, spread 0.050pt, harvested from CI's own `coverage-ratchet:` log lines, NOT measured locally — two local attempts failed with different faults, one spreading 2.06pt on a static tree and one measuring the after-tree twice). That is ~2.70pt of dead slack. The shipped file says so itself: `that floor is stale LOW against a real ~98.3% and is a delta-era artefact ... tidying it needs its own ruling.` IT IS A DIFFERENT AND SMALLER QUESTION THAN THIS SHARD'S, so it is filed on its own rather than kept alive here. --- ORIGINAL RATIONALE, PRESERVED VERBATIM --- 
    AMENDED 2026-08-13 AGAINST 92 UNCONTENDED CI READINGS. THE HEADLINE SURVIVES AND ONE
    SENTENCE DOES NOT. RETRACTED, NOT DELETED (§8A asks for compression, not erasure — the original
    reasoning below is the record of how this was read twice):
      **'THE NEWLY-DISCOVERED BRANCHES ARE REAL GAPS, NOT IMPORT-TIME ARTEFACTS' IS HALF-WRONG.**
    It generalises from `src/lib/deployer.ts`, n=1, AND THAT FILE IS ATYPICAL: it has no trailing
    zero-hit record and its 9 uncovered branches really are genuine `??`/ternary arms. The general
    population does not look like it. Of 96 files carrying a FINAL zero-hit branch record, **94 (98%)
    sit on an UNCALLED FUNCTION'S DECLARATION LINE** and 2 sit on a non-branching line and are pure
    artefact. THE CLEAN CASE, RE-VERIFIED HERE AND QUOTABLE: `src/lib/proof-grammar.ts` is 42 lines
    with ZERO occurrences of `??`, `||`, `&&` or a ternary (positive control on the same tool: one
    `export`), yet reports `BRF:3 / BRH:2`, and its untaken record is `BRDA:42,2,0,0` — line 42, which
    is literally `];`. THERE IS NO BRANCH THERE TO TEST, so it cannot be a missing test.
    WHAT THAT DOES AND DOES NOT CHANGE. It does NOT rescue the aggregate: 98% ARE real functions with
    real missing tests, so calling this phantom bookkeeping would be dishonest in the other direction.
    It DOES destroy the tractability estimate — see the amendment's own section below.
    **THE HEADLINE IS UNCHANGED AND IS NOW FAR BETTER EVIDENCED:** #1739 made the metric more honest
    and was punished for it. THE HONEST FRAMING, which the options below should be read against: a
    gate comparing ONE WHOLE-CODEBASE AVERAGE against a FIXED NUMBER was handed a BIGGER, MORE HONEST
