- id: W1-T3523
  title: "47% OF DISPATCHED RUNS LEAVE ONLY A `run.start` ROW, AND THE STREAK BREAKER COUNTS EACH ONE AS A FAILED DISPATCH — a worker killed by a container recycle is indistinguishable from one that tried and could not open a PR, so six tasks are circuit-broken for work no worker ever got to attempt"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 16.00
  files: [src/lib/status.ts, test/an-orphaned-run-is-not-a-failed-dispatch.test.ts]
  origin: "operator-session#azure-ledger-2026-09-13"
  plan_refs: ["W1-T271", "W1-T1010", "W1-T2270", "W1-T1210"]
  status: queued
  attempts: 0
  note: |
    MEASURED on the LIVE fleet ledger 2026-09-13, /home/craigoleyagent/rmd-state2/state/ledger.ndjson
    on the Azure host (7572 rows), by grouping every row on `run_id`:

      run.start rows                                        203
      runs carrying NO other row of any kind                 97   (47%)

    Orphans by task (top): RETRO 33, TRIAGE-fb-...d3ce67 18, then EXACTLY 5 each for
    W1-T3349, W1-T3362, W1-T3363, W1-T3364, W1-T3365, W1-T3366 — the six tasks currently
    circuit-broken (issues #5307, #5309, #5312, #5316, #5324, #5327). A healthy run looks like
    `run.start -> pr.opened -> run.awaiting_external -> verdict`; these have the first row and
    nothing after it. Tracing two by run_id (`W1-T3362-1789235501993`,
    `W1-T3362-1789252918650`) returns exactly one row each.

    POSITIVE CONTROL: a task known to have filed this week reads 4 rows from the same query, so
    the reader sees its corpus and the orphan count is a real absence.

    THE COUNTER IS THE DEFECT. `dispatchesWithoutNewOwnedPr` (src/lib/status.ts) counts `run.start`
    rows and resets only on `pr.opened`. An orphan increments the streak IDENTICALLY to a run that
    executed and failed to produce a PR. `DEFAULT_MAX_TASK_DISPATCHES` then trips at a threshold
    whose own docblock says "every count at or above 5 is a documented FAILURE" — and each of the
    six carries exactly 5 orphans. They are halted for work no worker ever got to attempt.

    THE KILLER IS OBSERVED, NOT INFERRED. `deploy/recycle-container.sh` pauses and polls before
    replacing the container, but its last poll before proceeding reads, verbatim, from
    logs/recycle-core-20260913T123437Z.log:

        1 lane-holding + 0 lane-less worker(s) still in flight, waited 180s/3000s - polling
        no in-flight workers - safe to proceed
        docker stop remudero-daemon

    The check is PROCESS LIVENESS. A worker that dies without writing a terminal row is
    indistinguishable from one that finished, so the recycle proceeds and the run is never
    reconciled. The two containers that ran the six tasks (f84778634a4b, 6e70b355bc7d) no longer
    appear in `docker ps -a` at all.
  rationale: |
    THIS IS THE MECHANISM BY WHICH A TASK GETS PERMANENTLY STUCK, which is the failure mode this
    fleet exists to avoid. The breaker is not wrong to exist and its threshold is not wrong: W1-T271
    derived 10 from a real population, and the streak breaker at 5 caught a real redispatch storm.
    What is wrong is the EVIDENCE it reasons over. It treats "a worker was killed by infrastructure
    before it could act" as identical to "a worker acted and produced nothing", and only the second
    is a statement about the task.

    THE COST IS ALREADY PAID AND VISIBLE. Six tasks sit halted behind escalations whose own offered
    remedies — "fix and resume", "correct the credit" — BOTH fail to apply, because there is no PR
    to fix and nothing merged to correct. An operator reading those issues cannot act on them. That
    is the shape of a dead end, not a queue.

    DO NOT "FIX" THIS BY RAISING THE THRESHOLD. At a 47% orphan rate, any threshold is reached by
    accumulating infrastructure deaths; raising it delays the dead end without removing it, and
    costs real dispatch budget on the way. The populations must be SEPARATED, not rebalanced.

    AND DO NOT SIMPLY IGNORE ORPHANS. A task that reliably kills its worker — an OOM, a poison
    input — would then redispatch forever with nothing counting. Repeated orphaning is a real
    signal; it is a signal about the HOST, and it needs its own bound and its own escalation
    reason, not silence.
  design: |
    (i) MAKE THE ORPHAN A FIRST-CLASS READING. A run whose `run_id` carries no row after `run.start`
    is a distinct outcome from a run that terminated. Derive it in src/lib/status.ts beside the
    existing counters, from the rows already present — this needs no new writer and no schema change,
    and it must work on a ledger written before this task ships.
    (ii) THE STREAK BREAKER COUNTS ATTEMPTS, NOT STARTS. `dispatchesWithoutNewOwnedPr` should stop
    counting a run that produced no evidence of having run. Keep `dispatchesEver` (W1-T271's lifetime
    counter) counting every start — it guards a different failure and its docblock says so.
    (iii) BOUND ORPHANS SEPARATELY, WITH THEIR OWN ESCALATION REASON naming the host and the run_ids,
    so repeated infrastructure death is visible as infrastructure death. An operator must be able to
    tell the two escalations apart from the title alone.
    (iv) SAY WHAT UNBLOCKS THE SIX. State in the PR body whether this change alone returns
    W1-T3349/3362/3363/3364/3365/3366 to dispatchable, or whether their existing `circuit_broken`
    rows must also be reconciled — and if the latter, file that as its own task rather than widening
    this one.
    (v) THE RECYCLE'S OWN COMPLETION CHECK IS OUT OF SCOPE HERE. That the "no in-flight workers"
    probe cannot distinguish a dead worker from a finished one is a real second defect in
    deploy/recycle-container.sh (W1-T1010's territory). Name it in the PR body, file it separately,
    do NOT edit the shell script in this changeset — Rule 25 refuses an instrument path riding along
    with src/.
  acceptance:
    - claim: "a run.start carrying no subsequent row for its run_id is reported as an orphan, distinctly from a run that terminated"
      proof: "unit test: a run.start with no subsequent row reads as an orphan"
    - claim: "the streak breaker no longer counts an orphaned run, so infrastructure death cannot trip a per-task circuit breaker"
      proof: "unit test: the streak breaker does not count an orphaned run"
    - claim: "the lifetime dispatch counter still counts every start, since it guards a different failure"
      proof: "unit test: the lifetime counter still counts an orphaned run"
    - claim: "repeated orphaning still escalates, under its own reason naming the host rather than blaming the task"
      proof: "unit test: repeated orphaning escalates as a host fault"
  falsifier: |
    RE-MEASURE THE ORPHAN RATE BEFORE BUILDING, from the live ledger, and use YOUR number. 47% is
    from 2026-09-13 and the fleet recycles often; if the rate has collapsed, the premise is gone and
    this task should be closed rather than built to a stale measurement.
    PROVE THE BREAKER CHANGE IS LOAD-BEARING BY DELETING IT. Construct the exact shape measured
    here — five `run.start` rows for one task, each the only row for its run_id — and show the
    breaker trips before the fix and does not after. `# fail N` before vs `# fail 0` after is the
    evidence; a test that passes both ways asserts nothing.
    DO NOT LET AN ORPHAN BECOME INVISIBLE. A test must show that repeated orphaning still produces
    an escalation. A change that only stops counting, with nothing taking its place, converts a
    wrong escalation into a silent infinite redispatch — strictly worse, because nothing reports it.
    DISTINGUISH AN ORPHAN FROM AN IN-FLIGHT RUN. A run that started ten seconds ago also has no
    subsequent row. If the predicate has no age or liveness condition it will call every live run an
    orphan, and the streak breaker will stop counting real failures. Assert the live case explicitly.
    THE LEDGER ROTATES, AND A RUN CAN SPAN A ROTATION. A `run.start` in one file with its terminal
    row in the next must NOT read as an orphan. The rotations come in more than one form; read the
    union or say in the PR body which form you read and why it is sufficient.
