- id: W1-T2913
  title: "THE DETACHED SWEEP DRAIN HAS NO BOUND AND GATES EVERY FRESHNESS RESTART — drainDetachedSweepActions awaits every detached action to settle before runDaemon returns, so one never-settling detached dispatchFix keeps the daemon running stale code indefinitely: bound the drain by the sweep wall-clock and let a freshness exit proceed with the stragglers recorded"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  origin: retro#recon-2026-09-05
  plan_refs: ["§4", "§13", "W1-T2744", "W1-T2865", "W1-T2379"]
  files: [src/lib/sweep.ts, src/lib/daemon.ts, test/detached-sweep-drain-is-bounded.test.ts]
  status: queued
  attempts: 0
  rationale: |
    Audit recon-2026-09-05 R-10 (INFERRED from the code; the audit names its verifier and this
    task's test IS that verifier). At f7ceb86, `drainDetachedSweepActions`
    (`src/lib/sweep.ts:6204-6208`) loops over the detached-action set awaiting each with no
    deadline, and the daemon's freshness restart (`src/lib/daemon.ts:3001-3010`) awaits that
    drain before `runDaemon` returns. W1-T2744 detached the long CI wait so the review clock
    would not stop; W1-T2865 made a freshness exit stop aborting the fix that wait had started.
    Both are correct and together they create this: a detached `dispatchFix` whose promise
    never settles (a hung `gh`, the R-6 socket case, a worker that never exits) now keeps the
    OLD daemon alive forever, while the deploy supervisor believes it restarted and
    `daemon_boot_head_sha` in the heartbeat stays behind `install_head_sha`. `plan/policy.yaml`
    already carries a `sweepWallClockBoundMs` row (`daemon.ts:158`) for exactly this class of
    bound.

    THE FIX: `drainDetachedSweepActions(opts: { boundMs })` races the drain against the bound;
    when the bound wins it returns the still-pending action descriptors, and the daemon writes
    one ledger row per straggler (`daemon.detached_action_abandoned` with the action kind, the
    task id and the age) before exiting for freshness — the relaunch's inflight-lock reclaim
    (`isHolderStale`) then handles whatever the straggler owned, which is the path it was built
    for. The bound is `sweepWallClockBoundMs` unless a dedicated policy row is added; say which
    in the PR. The test injects a detached action that never settles, runs the freshness exit,
    and asserts `runDaemon` returns within the bound and the abandonment row names the action;
    a control with a settling action asserts no abandonment row.
  acceptance:
    - claim: "a never-settling detached action does not prevent runDaemon from returning within the bound"
      proof: "unit test: test/detached-sweep-drain-is-bounded.test.ts"
    - claim: "the drain takes an explicit bound"
      proof: "grep: detachedDrainBoundMs in src/lib/sweep.ts"
