  note: "verify:auto — nothing here needs an operator ruling. The tier of judgement this task
    requires is bounded by design (iii)'s one choice, and both options are named with the condition
    that decides between them, so a worker does not have to infer a design the plan withheld.
    risk:high is Rule 19's SPAN, not blast radius. `subsystemsOf` reads `files:` AND acceptance
    text, and this set crosses `src/lib` and `test/`, which is >=2 subsystems and would be a sizing
    violation at any lower band. The band is raised UP FRONT rather than shipped as a violation —
    the W1-T400/W1-T407 lesson. The actual blast radius is small: five bytes of source text, and
    design (i) proves the runtime behaviour is unchanged.
    THE `files:` SET IS THE WHOLE POPULATION PLUS ITS FALSIFIERS, and it is complete BY
    CONSTRUCTION rather than by sweep — the four source paths are exactly the mechanical NUL scan's
    non-PNG output, so unlike an ordinary `files:` list this one cannot be short. That matters here
    more than usual, because a short `files:` list is the very failure this defect causes elsewhere.
    Both new test paths are forward references to PATHS, never to symbols: a path forward-reference
    is safe and a symbol one is a guess, and a `grep:` proof naming an existing symbol would match
    the merge base as well as the head and be downgraded to a stale proof that discriminates
    nothing. Three criteria share one proof file deliberately — they are three distinct assertions
    that the same suite must carry, and in the pure-path form the proof executes the whole file.
    budget_usd 60 — the edit itself is five bytes, so the budget is almost entirely the new gate
    plus its two falsifier directions (a planted NUL must fail, a PNG must not) and the equivalence
    suite. Lower than a normal implement task because there is no design to discover.
    NO COUNT IN THIS SHARD SHOULD BE QUOTED FORWARD; the NUL scan is one command and re-running it
    is cheaper than trusting a number."
