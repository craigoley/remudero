  falsifier: |
    Make the provider multiplier a constant 1. The first test's arm with 23 of 37 refused rounds and the arm
    with 1 of 8 refused get equal shares at equal headroom. Set epsilon to 0 and feed one arm only refusals.
    The second test sees that arm's probability fall to 0.
