  note: "verify:human, and the reason is design (i), not the work. The schema question is an
    OPERATOR DECISION with three defensible answers, and `isDispatchEligible` refuses a task whose
    verify is not auto BEFORE the linter is consulted — so this cannot be handed to a worker who
    would rediscover the W1-T391 wall. Flip it to auto once (i) is answered; nothing else about the
    shard needs rewriting when that happens, because every acceptance claim above holds under all
    three options.
    risk:high is Rule 19's SPAN, not blast radius. The file set crosses src/ and test/ and touches a
    documented dispatch seam; the band is raised deliberately here rather than shipped as a sizing
    violation, which is the W1-T400/#1401 lesson.
    src/lib/plan.ts is declared because options (a) and (b) both touch the task schema. Under option
    (c) it is untouched — declaring it costs nothing, whereas omitting it would have the scope guard
    refuse the branch AFTER the work was done.
    All five proofs are forward references to PATHS, never to symbols: a path forward-reference is
    safe, a symbol one is a guess. None is a `grep:` naming an existing symbol, because such a
    pattern would match the merge base as well as the head and be downgraded to a stale proof that
    discriminates nothing.
    The ledger is UNMEASURED throughout — the host is down and no figure in this shard is read from
    it. Every count here is from source at e422486. SHIPPED, RECORDED 2026-09-02 (evidence only). THIS TASK IS BUILT: a merged commit on origin/main carries its own Remudero-Task trailer -- d600b3fa chore(plan): file W1-T403 — the same-owner constraint blocks multi-repo targeting (#1475). THE CREDIT SCAN ALONE MISREADS THIS ONE IN BOTH DIRECTIONS: its only trailer sits on a chore(plan) FILING commit, which CLAUDE.md names as the over-credit hazard, so a raw trailer count says shipped for the wrong reason and a trailer-minus-filings count says not shipped. What settled it was RUNNING THE TESTS: test/owner-target-resolution.test.ts and test/owner-qualified-dispatch.test.ts pass 10 of 10 and assert that --repo owner/name resolves to THAT owner rather than this checkout's own; resolveOwnerRepo survives only as the self-target default, which is correct. status: queued and verify: human are BOTH left alone: the status field is decorative by documented design and the operator ruled LEAVE THEM on 2026-08-05, and the human gate is this shard's own deliberate parking choice, not this block's to revoke. Nothing mechanical was misled either, since isDispatchEligible refuses a non-auto task before any probe. This record exists because a READER picking build candidates was misled, not a machine."
