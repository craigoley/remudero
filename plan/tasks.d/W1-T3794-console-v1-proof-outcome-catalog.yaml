  rationale: |
    OBSERVED at origin/main 948173f3: run-task.ts:5902-5927 writes per-criterion `proof_exec`
    values on `review.posted` rows, distinguishing executed_pass, executed_fail,
    not_executable, and execution errors. The existing daemon also has separate measured producers
    for verdict-class outcomes, panel decisions, and routing/dispatch telemetry, but the console
    projection does not compose those signal families. W1-T3762 owns assignment-to-receipt
    routing-v1 evidence; this task consumes that contract and adds the operator-agent projection
    layer rather than changing routing policy.
  design: |
    Add a pure proof adapter and compose it with the three independent adapters from W1-T3795,
    W1-T3796, and W1-T3797 in the versioned console-v1 response. Emit counts and rates only when
    the denominator is named and meets each producer's conservative floor; carry unavailable,
    mixed-scope, and unmeasurable populations as explicit reasons. Preserve the distinction between
    executed proof failure, non-executable proof, a worker failure, a post-merge revert, an explicit
    operator decision, and automatic routing/merge events. The projection must remain read-only and
    must never turn an empty or unreadable corpus into a healthy zero.
