- id: W1-T12305
  title: "A retro preflight at the suite-capacity wait bound records NOT_RUN without a publication strike or push, and the next scheduled trigger automatically retries after capacity recovers"
  repo: remudero
  depends_on: [W1-T12303]
  priority: 1.4
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high
  band_meaning: span
  origin: architect
  plan_refs: [W1-T12303, W1-T6111, W1-T2803, W1-T2988]
  files:
    - src/lib/retro-preflight.ts
    - src/run-task.ts
    - test/learning/a-retro-preflight-refused-for-capacity-retries-on-recovery-and-is-never-a-strike.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "When the slot returns over_capacity, retro-preflight starts no suite or repair and consumes no repair attempt"
      proof: "unit test: W1-T12305 criterion 1: capacity outcome starts neither tests nor repair"
    - claim: "The outcome writes retro.preflight_over_capacity and no retro.preflight_failed row, so escalation counts no publication strike"
      proof: "unit test: W1-T12305 criterion 2: capacity refusal is a distinct non-strike ledger event"
    - claim: "run-task reports NOT_RUN: OVER_CAPACITY with readings, skips push and escalation, and leaves the marker unchanged so the next scheduled trigger retries after recovery"
      proof: "unit test: W1-T12305 criterion 3: scheduled retry after recovery does not publish or count a strike"
    - claim: "Every other NOT_RUN and each real suite failure retain the existing repair, stand-down and strike-cap path"
      proof: "unit test: W1-T12305 criterion 4: genuine failures retain the existing escalation path"
    - claim: "The capacity event has a distinct ledger step"
      proof: 'grep: retro\.preflight_over_capacity in src/lib/retro-preflight.ts'
  rationale: |
    A capacity-inconclusive run must never become a publication strike or a push. The existing next-trigger cadence provides the automatic retry after capacity recovers.
    The suite-slot acquisition already waits in the shared FIFO for the existing bound. It then releases its ticket on OVER_CAPACITY. A second local wait or immediate reacquisition would double the bound and join the queue tail, undermining fairness.
    Today runAttempt turns every NOT_RUN into retro.preflight_failed. That row feeds decideRetroPublicationEscalation, and run-task treats any preflight failure as a reason to escalate. A distinct capacity outcome and ledger event preserves remedies for actual suite failures while leaving the publication marker untouched for the next scheduled fire.
  design: |
    In runAttempt, an over_capacity lease returns a typed capacity result; it does not throw, start tests or repair, or consume repair budget.
    runRetroPrepublishPreflight returns {ok:false, overCapacity:true, readings} after that one bounded FIFO wait. It does not poll outside the queue or immediately request another ticket. The existing next scheduled trigger retries through the shared FIFO after capacity recovers.
    Log retro.preflight_over_capacity, never retro.preflight_failed, for this outcome. Strike counting reads only retro.preflight_failed, so its implementation does not change.
    In run-task, report NOT_RUN: OVER_CAPACITY and skip push and escalateRetroPublicationFailure. Leave the marker unchanged for the normal next trigger.
    Other NOT_RUN results and genuine suite failures keep today's path.
    NOT IN SCOPE: admission (W1-T12303), author receipt mapping (W1-T12304), worker-provider's open-weight check or trigger cadence.
  falsifier: |
    Start repair or consume an attempt on over_capacity and criterion 1 must fail. Log capacity as retro.preflight_failed and criterion 2 must fail. Push or escalate on capacity and criterion 3 must fail. Route a genuine suite failure through capacity handling and criterion 4 must fail. Restore and require all criteria to pass.
  note: |
    Filed by PLAN-create-1794411017336 from the reserved ids, in order.
