    - claim: "If capacity never recovers within the existing wait bound, the result is ok false with overCapacity true. The ledger gets a retro.preflight_over_capacity row and no retro.preflight_failed row, so decideRetroPublicationEscalation counts no strike"
      proof: "unit test: test/a-retro-preflight-refused-for-capacity-retries-on-recovery-and-is-never-a-strike.test.ts"
