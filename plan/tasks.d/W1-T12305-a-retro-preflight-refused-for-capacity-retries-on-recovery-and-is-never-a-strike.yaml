      proof: "unit test: test/a-retro-preflight-refused-for-capacity-retries-on-recovery-and-is-never-a-strike.test.ts"
    - claim: "Any other NOT_RUN lease and every real suite failure keep today's path: a retro.preflight_failed row, a repair or stand-down, and an escalation at the strike cap"
      proof: "unit test: test/a-retro-preflight-refused-for-capacity-retries-on-recovery-and-is-never-a-strike.test.ts"
