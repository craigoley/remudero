      proof: "grep: retro.preflight_over_capacity in src/lib/retro-preflight.ts"
  rationale: |
    Initiative (operator, 2026-11-11): propagate the empty-pool OVER_CAPACITY outcome through preflight and run-task, and retry automatically when capacity recovers. The proof-executor suite that failed on unchanged origin/main under load is the case where a capacity failure was read as a branch failure.
    Rule 19 (#588 merits test): YES, risk:high with band_meaning span. The overCapacity result shape that retro-preflight.ts returns is what run-task.ts branches on, and criteria 2 and 3 together assert "no strike, no push, marker unchanged". Either half alone leaves the other one booking a capacity refusal as a failed validation. All five reserved ids are already used, so this run could not decompose it.
    Settled by lookup: what does a NOT_RUN lease do in the retro preflight today? -> runAttempt throws "retro preflight NOT_RUN (...)" (src/lib/retro-preflight.ts:631). That becomes a failed attempt, logged as retro.preflight_failed (src/lib/retro-preflight.ts:759).
    Settled by lookup: what counts as a publication strike? -> only retro.preflight_failed rows in the episode (decideRetroPublicationEscalation, src/lib/retro.ts:5083). A distinct step is therefore not a strike, and the escalation logic needs no change.
    Settled by lookup: where does run-task consume the result? -> src/run-task.ts:23641-23671. When preflight.ok is false it says "prepublish validation failed", calls escalateRetroPublicationFailure, and returns 1 with the marker unchanged.
    Settled by lookup: is the retry already filed? -> no. W1-T2803 makes a bound failure stand down rather than repair, and adds no retry on capacity recovery. W1-T12303 leaves callers out of scope.
    Settled by lookup: does the author preflight cover this caller? -> no. W1-T12304 covers scripts/preflight-author.mjs only.
  design: |
    In runAttempt, an over_capacity lease returns a capacity result. It does not throw and does not start the suite.
    runRetroPrepublishPreflight then polls the same injected readings W1-T12303 uses, under TEST_SLOT_WAIT_BOUND_MS. Once the reading has recovered it requests the slot exactly once more and runs the attempt as normal. That attempt does not count toward the repair budget.
    If capacity does not recover, or the second lease is also over_capacity, the result is { ok: false, overCapacity: true, readings }. It is logged as retro.preflight_over_capacity.
    In run-task, a result with overCapacity says NOT_RUN: OVER_CAPACITY, skips escalateRetroPublicationFailure, and returns as the failed branch does today without pushing. The marker stays unchanged, so the next trigger is the outer retry.
    NOT IN SCOPE: the admission rule (W1-T12303), the author preflight (W1-T12304), worker-provider's open-weight run-check (it already returns NOT_RUN on any refused lease), and the retro trigger cadence.
  falsifier: |
    Never re-request after recovery and criterion 1 must fail. Log the capacity refusal as retro.preflight_failed and criterion 2 must fail. Escalate on it and criterion 3 must fail. Route a real suite failure down the capacity path and criterion 4 must fail. Restore and require all to pass.
  note: |
    Filed by PLAN-create-1794411017336 from the reserved ids, in order.
