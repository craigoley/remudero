  rationale: |
    OPERATOR RULING 6 (2026-10-16): test/rules/ becomes the rule-suite declaration.
    Citations re-verified at origin/main 889966ea5 (2026-10-16).
    - src/lib/ci-parity.ts:
      - RULE_SUITE_NAME_RE (~2874);
      - listRuleSuites (~2887) runs `git ls-files -- test` and tests RULE_SUITE_NAME_RE against `path.slice("test/".length)`
        at ~2902, which is unanchored and includes folders;
      - CENSUS_POPULATION holds 12 testFile literals;
      - censusPopulationDrift (~3103);
      - censusJobSlug (~2426) turns a path into a job slug, and a nested path would put "/" into it.
    - src/lib/task-linter.ts newShardRuleSuiteViolations (~1819, test at ~1829) uses the same path slice.
    - scripts/diff-class.mjs censusSuiteFiles (~540) picks census suites by name.
    MEASURED (plan/seeds/test-restructure-2026-10-16/taxonomy.md section 5):
    - 88 suites are enrolled today, 226 s serial;
    - of those, 40 are tests OF the census machinery, which belong in ci/gates/ and keep their enrolment by name;
    - 206 structural suites are not enrolled at all, because their names lack the words;
    - by folder the lane becomes 254 suites and 759 s serial, which W1-T9878 handles.
  design: |
    1. One predicate, isRuleSuitePath(path, header), exported from ci-parity.ts. A path is a rule suite when any of
       these holds:
       - it is under test/rules/;
       - it is in the CENSUS_POPULATION roster;
       - its BASENAME (never a folder segment) matches RULE_SUITE_NAME_RE and its header has no @not-a-rule-suite.
       The 40 machinery tests therefore keep today's enrolment wherever they live (taxonomy.md section 5.3).
    2. listRuleSuites, newShardRuleSuiteViolations and diff-class's censusSuiteFiles all call isRuleSuitePath; there is
       one definition.
    3. censusJobSlug flattens "/" so a nested rule suite gets a valid slug, and censusPopulationDrift resolves roster
       entries through resolveTestPath (W1-T9860).
    4. Until the rules wave (W1-T9895) lands, the population changes only by the files already in test/rules/. The test
       proves a planted test/rules/x.test.ts is enrolled and test/ci/census-y/z.test.ts (folder name only) is not.
    New test under test/ci/gates/ (this task depends on the recursive readers).
