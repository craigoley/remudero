  note: |
    THE ALTERNATIVE HYPOTHESIS WAS TESTED AND REJECTED ON THE OPERATOR'S OWN NUMBERS, WHICH IS WHY
    THIS SHARD EXISTS AT ALL. A first pass concluded there was probably NO defect: `daemon.alive`
    carrying `phase: dispatch` every ~68s is written only by `startInFlightTicker`, which runs only
    while the daemon is blocked on awaited work, so a daemon that never returned to the top of its
    loop would show exactly the observed silence on `daemon.pause`. That reading required admission
    to PREDATE the pause. It did not: both `daemon.iteration` rows read 14:53:35.989Z against a
    14:49 mtime. THE ID WAS HELD UNUSED UNTIL THAT ONE TIMESTAMP CAME BACK, and the shard is filed
    on the branch the measurement actually chose rather than the one that was easier to argue.

    `files:` IS TWO PATHS AND THAT IS THE HONEST LIST. The re-check is one read in
    `src/lib/daemon.ts`, which holds the only occurrence of `deps.checkPause` and the only
    occurrence of `deps.checkStop`. The test goes in a NEW file rather than `test/daemon.test.ts`:
    that file carries 83 `runDaemon` references already, and this repo has measured file-level
    crashes under coverage instrumentation in large shared test files, which would make a
    coverage-load-bearing test flaky for reasons unrelated to the change. The shard's own path is
    absent.

    RISK IS `high` AND THE BAND IS RULE 19's SPAN, NOT BLAST RADIUS — MEASURED, NOT ASSUMED. The
    change is narrow: one source module, one new test file, one concern. This shard was authored at
    `medium` and `rmd lint-plan --base origin/main` REFUSED it — *"spans 2 distinct
    subsystems/concerns (daemon, daemon-pause-before-admission) at risk:medium"* — then passed at
    `high` with the file list unchanged. The two "concerns" are the two FILENAME STEMS; decomposing
    is not the alternative, because the test exists to prove the one read the source file adds.
    Folding the test into `test/daemon.test.ts` would collapse the span but reintroduce the
    coverage-crash hazard named above, so the band is paid instead.

    EVERY FIGURE IS DATED 2026-08-20 AND WILL DRIFT — RE-RUN THE QUERY. The window:
    `zgrep -h '"step":"daemon.iteration"\|"step":"sweep.pass"' <every ledger form> | sort -u`,
    then for each iteration row take the gap to the most recent preceding sweep row. Take a
    per-form file count as the coverage control first. The single-read claim:
    `git grep -an 'deps.checkPause' -- src/lib/daemon.ts` must return exactly one line, and
    `deps.checkStop` likewise — if either returns two, the fix has landed.

