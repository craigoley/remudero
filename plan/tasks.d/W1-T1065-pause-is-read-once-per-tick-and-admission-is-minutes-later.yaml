- id: W1-T1065
  title: "THE OPERATOR'S ONLY STOP CONTROL IS READ ONCE PER TICK AND ADMISSION HAPPENS MINUTES LATER IN THE SAME TICK — `deps.checkPause` is consulted at the top of `runDaemon`'s loop and never again before `daemon.iteration`, with the full sweep and three more awaited hooks in between, so a PAUSE created in that window dispatches anyway; re-check immediately before admission"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  rationale: |
    MEASURED 2026-08-20 on Craigs-Mac-mini under /bin/zsh 5.9, in a scratch worktree proved equal
    to origin/main 944bd33a before anything was read. Per-form ledger coverage control taken first
    (666 gz, 6 plain, 1 live) and every census deduped on the FULL LINE. No `/rate_limit` call; no
    state file touched; no process signalled.

    (1) THE INSTANCE, WITH THE ADMISSION TIMESTAMP THAT SETTLES IT. The operator created
    `state/PAUSE` and the daemon dispatched anyway. `state/PAUSE`'s mtime reads 14:49; BOTH
    `daemon.iteration` rows for the two admitted tasks read 2026-08-20T14:53:35.989Z — one batch,
    admitted ~4.5 MINUTES AFTER the flag existed. That is not an in-flight batch finishing; it is
    a NEW admission past a visible hold.

    (2) IT IS NOT AN UNWIRED DEP, AND THAT MATTERS BECAUSE THE FIX WOULD BE LARGER IF IT WERE.
    `checkPause` IS supplied at both construction sites in `src/run-task.ts` — `daemonCommand` and
    `drainCommand` — as `() => pauseDetail(config.root)`. `isPaused` is `existsSync` on
    `join(root, "state", "PAUSE")`, documented as gating on "existence alone, independent of
    whether the JSON parses (fail CLOSED)", so a bare `touch` pauses exactly as `rmd pause` does.
    Nothing caches a directory handle: the path is re-joined and re-stat'd on every call, so a
    bind mount that resolved at container start resolves on every tick.

    (3) THE DEFECT IS THE WINDOW. `git grep -an 'deps.checkPause' -- src/lib/daemon.ts` returns
    EXACTLY ONE LINE. Between that read and `log("daemon.iteration", ...)` sit roughly eight
    hundred lines carrying FIVE awaited, unbounded operations: `deps.checkFreshness`, then
    `await deps.sweep()` — the full reconciler over every open PR, wrapped in its own in-flight
    ticker — then `await deps.sweepOrphans()`, `await deps.sweepFeedbackLanding()` and
    `await deps.readUsage()`, before `runnableCandidates` and `partitionByFileOverlap` pick the
    batch. PAUSE is never consulted again in that span.

    (4) THE WINDOW IS MEASURED, AND THE FIGURE IS A LOWER BOUND RATHER THAN THE WINDOW ITSELF.
    Over the deduped union, the gap from the last `sweep.pass` row to the next `daemon.iteration`
    (n=142) reads min 19.7s, p50 39.6s, p75 69.2s, p90 3.6m, p95 32.1m, max 64.5m — and FOURTEEN
    OF THE 142 EXCEED THE 4.5 MINUTES THIS INSTANCE WAS MISSED BY. It is a LOWER BOUND because it
    starts at the sweep's LAST row rather than at the pause check, so it excludes the sweep's own
    duration and the three other awaited hooks entirely. One hung sweep ran 3.6 hours the night
    before; that is the same window.

    (5) STOP HAS THE IDENTICAL SHAPE. `deps.checkStop` also returns exactly one line in
    `src/lib/daemon.ts`, one line above the pause read. Both operator holds are single-read,
    top-of-tick, and both miss anything created after that read.

    (6) AND THE CROSS-CHECK THAT WOULD NORMALLY CONFIRM A TICK BOUNDARY IS UNAVAILABLE, WHICH IS
    WORTH RECORDING SEPARATELY. `dispatch.settled_set` — the row logged when an admitted batch
    settles — has not fired since 04:44:01Z. So the "did a tick close between the pause and the
    admission" question cannot be answered from that row on the live corpus, and the
    `daemon.iteration` timestamps had to carry the whole argument. Why that row stopped firing is
    NOT this task's subject and is not diagnosed here.
  design: |
    ONE CONCERN: an operator hold that is read once per tick while admission happens much later in
    the same tick. Not a new control, not the drainage policy, not the sweep's duration.

    (i) THE FIX IS A RE-CHECK IMMEDIATELY BEFORE ADMISSION, AND IT IS DELIBERATELY NOT A NEW
    CONTROL. The existing dep, the existing predicate and the existing `daemon.pause` row all
    stay; what changes is that the value is read again after the awaited hooks and before the
    first `daemon.iteration`, so a hold created during the sweep is honoured on the same tick
    rather than the next one. STOP gets the same treatment for the same reason — leaving one of
    the two single-read would be a half fix on a control whose whole value is that it is
    immediate.

    (ii) DRAIN-AND-HOLD IS PRESERVED, AND THAT IS THE LINE THIS TASK MUST NOT CROSS. `daemon.ts`
    states PAUSE is "a drain-and-hold, an awaiting-resume state", and `drain.ts`'s own check
    carries "awaited to completion before the loop returns here, so an in-flight task always
    reaches its verdict + merge". A re-check BEFORE admission stops the NEXT batch; it must never
    abort a batch already running, never interrupt `Promise.allSettled`, and never cancel a
    worker. The whole change sits above the admission, never inside it.

    (iii) DRAINAGE STAYS UNGATED AND THAT APPEARS DELIBERATE, SO IT IS OUT OF SCOPE.
    `src/lib/sweep.ts` references `checkPause`, `isPaused` and `pauseDetail` NOWHERE — positive
    control: the same query returns hits across `daemon.ts`, `drain.ts` and `run-task.ts`, so the
    zero is a measurement rather than a dead query. `plan/policy.yaml` states drainage
    (sweep/heal/arm/merge, at any depth) is never gated by the dispatch governor. This task does
    not change that. A DISPATCH past a hold is the defect; a drainage rung past it is policy.

    (iv) SECOND DESIGN NOTE — THE ACKNOWLEDGEMENT GAP, CARRIED HERE RATHER THAN FILED SEPARATELY.
    Nothing records that a pause has been SEEN. `daemon.pause` is written only inside the branch
    that acts on it, so while a batch drains there is no row distinguishing "hold seen, draining"
    from "hold not seen at all" — and that is exactly the ambiguity that made this instance read
    as a broken control. The operator waited, saw nothing, escalated to `docker stop`, and had to
    clear a stranded `state/drain.lock` by hand an hour later. THE FIX IS ONE FIELD ON A ROW THIS
    TICK ALREADY WRITES: `startInFlightTicker` emits `daemon.alive` every poll interval during a
    dispatch and can carry whether a hold is currently set. NO NEW STEP AND NO NEW ROW — the same
    discipline the sweep-lane arm-outcome shard applies. It rides here because it is the same
    concern (the operator's hold being observable) and one field, not because it is small.

    (v) WHAT THIS TASK MUST NOT DO. It must not abort in-flight work. It must not add a ledger
    step. It must not gate drainage. It must not diagnose why `dispatch.settled_set` stopped
    firing — that is recorded in the rationale as an unavailable cross-check, nothing more. It
    must not change `isPaused`, `pauseDetail` or either construction site: they are correct.
  acceptance:
