      proof: "unit test: daemon pause: a pause created during the sweep window is honoured before admission"
    - claim: "the re-check sits after the awaited hooks and before the first admission row rather than only at the top"
      proof: "unit test: daemon pause: the re-check runs after the sweep and before the first iteration row"
    - claim: "a batch already in flight still drains to its verdict rather than being aborted"
      proof: "unit test: daemon pause: an in-flight batch still drains rather than aborting"
    - claim: "stop is re-checked at the same point because it has the identical single-read shape"
      proof: "unit test: daemon pause: stop gets the same re-check because it has the same single-read shape"
    - claim: "the heartbeat records that a hold has been seen while a batch drains, so waiting is distinguishable from ignoring"
      proof: "unit test: daemon pause: the heartbeat records that a pause has been seen while the batch drains"
