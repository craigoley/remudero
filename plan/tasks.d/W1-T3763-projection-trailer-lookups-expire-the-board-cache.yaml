  rationale: |
    OBSERVED on the live Azure daemon while diagnosing the missing current-head review for PR #6005
    (2026-09-18): after a clean restart at current `origin/main`, the daemon repeatedly emitted an
    OPEN-board read and a merged-board read containing 4,823 rows about every 15 seconds, without
    reaching the review disposition for #6005. A direct authoritative `rmd review 6005` from that
    same current checkout posted immediately, so GitHub review posting was not the blocker.

    The current source explains the repeated read. `projectPlan` correctly calls
    `listMergedHeadBranches` once and shares the structured head-branch index. It then derives every
    task. Each derivation calls `findMergedByTrailer`; the batched implementation scans
    `mergedNewestFirst` with an anchored body regex until it finds a match. For every task whose
    trailer is absent, that is a full scan of every merged PR body. The projection therefore crosses
    the 15-second board-cache TTL before its own task loop completes; a later lookup starts another
    identical board fetch rather than allowing the daemon to reach its review queue.

    W1-T2323 already floors each cache half's effective TTL at the duration of the fetch that built
    it. That is correct but does not bound synchronous work performed after a fast delta fetch, and
    it must not be reopened by a broad TTL increase. W1-T257 already proves the head-branch index is
    shared. This is the independent trailer-body index omitted from that projection snapshot.
  design: |
    (i) The batched GitHub gateway captures one exact, anchored body-trailer lookup from the merged
    rows already read for the projection. Its lookup is body-first, newest-first, and only initializes
    the existing memoized commit-trailer index after a body miss. No new GitHub request, polling
    loop, TTL increase, or durable cache is introduced.

    (ii) `projectPlan` obtains that lookup once after it obtains the merged head-branch rows, then
    passes it into every derivation. The lookup is a snapshot: after capture it never re-enters the
    board index. Standalone `deriveStatus` calls and gateways without the optional batched surface
    keep the direct `findMergedByTrailer` path unchanged.

    (iii) A failed merged snapshot is represented as a shared null lookup. No task is allowed to
    fan that failure out into a direct read; the existing indeterminate/throttled direction stays
    visible for every task.
  acceptance:
