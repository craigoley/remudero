  rationale: |
    MEASURED 2026-11-10 from three receipts on the Mac agent account: the rule-checks step took 124 to 170 seconds of a static stage of 171 to 225 seconds. No record says how often it caught a defect.
    - The static stage runs 28 checks. Its summary file gives the time of each check (`staticTiming.durationMs`), and nothing keeps that summary after the next run.
    - The gate gardener (W1-T4116) and the CI friction gardener (W1-T4435) measure the gates of hosted CI: how often each refuses and what a red costs in time. Neither reads an author preflight.
    - So the operator cannot say which author checks earn their time. The decision to move a check to hosted CI only, or to run it first, is made without numbers.
  design: |
    scripts/preflight-author.mjs appends the entries after the static stage and after the tests, to a file beside the census history (`~/.cache/remudero/`). The write never changes the verdict of the run.
    New module src/lib/preflight-check-gardener.ts exports `preflightCheckGardenSpec`. It follows the shape of `ciFrictionGardenSpec` in src/lib/ci-friction-gardener.ts and runs through `gardenPass` in src/run-task.ts.
    The finding is a task for a person to judge. The gardener changes no check and no list of checks.
    The history keeps a fixed number of newest entries for each check, so the file stays small.
    NOT IN SCOPE: moving, removing or reordering a check, and the gates of hosted CI.
  falsifier: |
    Count a failure that passed again on the same head as a catch and criterion 2 must fail. File a finding from an unreadable history and criterion 5 must fail. File two findings in one pass and criterion 4 must fail. Restore and require all to pass.
  note: |
    The window and the least number of runs are new numbers. The builder states them in the pull request with the reason.
