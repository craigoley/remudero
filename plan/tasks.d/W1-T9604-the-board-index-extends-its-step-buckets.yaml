  design: |
    1. One step cache per projection. Inside createBoardProjection, keep for each step that any index has asked for:
       its parsed rows in stepFacts order (ts_ms, then seq) and the highest seq read. Keep the same for the plan-only
       filing and reviewed sets. Each index still reads at its own upTo (lastSeq when it is built).
    2. Extend, never re-read. When an index asks for a step whose cached seq is below upTo, read only
       `step = ? AND seq > cached AND seq <= upTo`. Merge those rows into the bucket in (ts_ms, seq) order. A late
       row can carry a ts_ms below rows already held, so an append is wrong and the merge is required. Extend the
       plan-only sets the same way. Each index sees the bucket as it stands at its own upTo. A later index's
       extension never changes rows that an earlier index already handed out.
    3. Safety. If the store's max seq reads below a cached high mark (a different or rebuilt file behind the handle),
       drop the cache and read in full. BOARD_UNREAD_STEPS still return []. Rows stay withoutUnreadFields and stay
       interned as today. If any reader mutates a bucket row, the cache hands out copies; the builder checks this.
       The board oracle (oracleWith) is unchanged and stays the safety net.
    4. Measure. The board stage's read_model.now_slow_stage row, or a sibling row, records the rows read in full and
       the rows read as extension for each index, plus the bytes held. W1-T9436 cut the projection's per-row history
       for memory, so the PR states the held rows and bytes on a production-sized fixture. No size cap or other
       constant is added.
    5. Not changed: which tasks re-derive (W1-T6016, queued, also in board-projection.ts, so whichever lands
       second rebases). taskFacts per-task buckets, the stamps and the snapshot stage. A follow-up candidate, not
       this task: oracleWith re-projects every plan task (3,778 shards on main) each BOARD_ORACLE_INTERVAL_MS (10 min).
    Tests go in test/a-board-index-extends-its-step-buckets.test.ts, with each title written as test("<title>", verbatim as in the proofs. Drive
    createBoardProjection over a real in-memory fact store.
  acceptance:
    - claim: "after rows are appended, an index whose buckets were extended is deep-equal to a fresh full read at the same seq, for every byStep step and both plan-only sets, including a late row whose ts_ms sorts before rows already held"
      proof: 'grep: test("W1-T9604: an extended step bucket equals a fresh full read" in test/a-board-index-extends-its-step-buckets.test.ts'
    - claim: "a second index at a later seq reads only the rows past the cached seq for a step already read"
      proof: 'grep: test("W1-T9604: a later index reads only the new rows of a cached step" in test/a-board-index-extends-its-step-buckets.test.ts'
    - claim: "an earlier index's buckets do not change when a later index extends the cache"
      proof: 'grep: test("W1-T9604: an earlier index keeps the rows it was built at" in test/a-board-index-extends-its-step-buckets.test.ts'
    - claim: "a store whose max seq falls below the cached seq is read in full again"
      proof: 'grep: test("W1-T9604: a store behind the cache is read in full" in test/a-board-index-extends-its-step-buckets.test.ts'
    - claim: "the new suite passes as a whole"
      proof: "unit test: test/a-board-index-extends-its-step-buckets.test.ts"
  falsifier: |
    On origin/main, count the rows stepFacts returns across two indexes built at seq 1,000 and seq 1,010 over one
    store. The second index reads all 1,010 rows of the step again, so the second test fails. Append the extension
    rows instead of merging them by (ts_ms, seq): a late row with an early ts_ms makes the extended bucket differ from
    the fresh read, and the first test fails. Share one mutable bucket array between indexes: the earlier index's
    bucket grows, and the third test fails.
