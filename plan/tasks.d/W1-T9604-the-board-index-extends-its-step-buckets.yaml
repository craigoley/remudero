- id: W1-T9604
  title: "THE BOARD INDEX EXTENDS ITS STEP BUCKETS INSTEAD OF RE-READING HISTORY: each storeIndex that board-projection.ts builds re-runs stepFacts over every row of each step it is asked for, and planOnlyFacts over every pr.opened, review.posted and plan-only marker body. A now-view build can make two such indexes. The fact table only grows by seq, so the buckets and the plan-only sets can be kept and extended with the rows past the last seq read"
