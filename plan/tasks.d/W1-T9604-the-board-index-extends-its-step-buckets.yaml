  rationale: |
    READ at origin/main (symbols in src/lib/board-projection.ts unless named):
    - createBoardProjection's sql.stepFacts is
      `SELECT seq, ts_ms, body FROM fact WHERE step = ? AND seq <= ? ORDER BY ts_ms, seq`.
      sql.planOnlyFacts is `SELECT step, body FROM fact WHERE step IN ('pr.opened', 'review.posted', ?) AND seq <= ?
      AND json_type(body, '$.plan_only') = 'true'`. Its third step is PLAN_ONLY_REVIEW_MARKER_STEP
      (review.plan_only_reviewed, ledger-carry.ts).
    - storeIndex (W1-T9436) builds a fresh `steps` Map and fresh plan-only sets for each index. byStep.get(step)
      runs stepFacts.all(step, upTo) and JSON.parses every row on the index's first ask for that step.
      planOnlyFilingPrUrls and planOnlyReviewedHeads run planOnlyFacts once per index. That query has SQLite
      json_type every body of those three steps up to upTo. Nothing is kept between indexes.
    - storeIndex is called from project() (the ledgerIndex given to projectPlan on each update that re-derives) and
      from the projection's index(bound). now-view.ts's board stage calls `b.index = h.board.index(b.rows)` after
      `h.board.update(...)`, and the snapshot stage hands that index to computeBoardSnapshot. So one now-view build
      can build two indexes, and each reads every requested step from seq 0.
    - Steps read through byStep: status.ts indexedStepRows reads verdict, verdict.merged, daemon.boot and
      escalation.issue_opened. now-view.ts stepRows reads dep-review.decided, escalation.issue_opened and
      ratify.approved.
    - ledger-projector.ts: fact(seq INTEGER PRIMARY KEY, ...), with the index fact_step on (step, ts_ms). A
      read-model rebuild writes a new file (read-model-cli.ts), so one db handle only grows by seq.
