    - claim: "a scout draft rendered by scoutShard, declaring its new test/scout-*.test.ts, passes machineFilingAdmissionViolations"
      proof: 'grep: test("W1-T8523: a scout draft with its new test path passes machine-filing admission" in test/a-gardener-draft-passes-machine-filing-admission.test.ts'
    - claim: "a scout draft that names a missing non-test path is still refused"
      proof: 'grep: test("W1-T8523: a scout draft naming a missing source path is still refused" in test/a-gardener-draft-passes-machine-filing-admission.test.ts'
    - claim: "an unjudged machine record of an unlisted origin is still refused"
      proof: 'grep: test("W1-T8523: an unjudged record of an unlisted origin is still refused" in test/a-gardener-draft-passes-machine-filing-admission.test.ts'
