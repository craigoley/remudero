- id: W1-T3529
  title: "runReview CALLS judgeReview WITH A ReviewEvidence THAT OMITS target — W1-T3525's OWNER/REPO-KEYED SUITE REGISTRY CANNOT SELECT A REGISTERED SUITE FOR A CROSS-REPO PROOF UNTIL THE PRODUCTION CALL SITE ACTUALLY PASSES { owner, repo } THROUGH"
  repo: remudero
  depends_on: ["W1-T3525"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 40.00
  files: [src/run-task.ts, test/run-review-evidence-target.test.ts]
  origin: "feedback#fb-1789312874382-b6f4b1"
  plan_refs: ["W1-T3525", "W1-T1062"]
  status: queued
  attempts: 0
  rationale: |
    `runReview` (src/run-task.ts:4985) already receives `owner` and `repo` in its own args
    (destructured at line 5119), and its `judgeReview` call (line 5317) already threads every
    other `ReviewEvidence` field the binding verdict needs — but that call OMITS `target`, so
    W1-T3525's owner/repo-keyed suite registry (once it merges) has no resolved target to key on
    at the one call site that actually gates a merge. The re-review / fix-rung path
    (`deps.runReview({...})` at src/run-task.ts:9512) already forwards `owner: opts.reviewBase.owner`
    and `repo: opts.reviewBase.repo` into `runReview`'s own args, so BOTH paths already have the
    values in scope; only the evidence object handed to `judgeReview` fails to carry them onward.

    Until this wiring lands, W1-T3525's registry ships DEAD for every production review: it can be
    unit-tested against a directly-constructed `ReviewEvidence`, but the call site that decides a
    real PR's verdict never populates the field the registry keys on, so a `craigoley/remudero-site`
    proof reaching production review would silently fail to resolve its registered `tests/` Vitest
    suite. This task is the narrow successor that closes exactly that gap and nothing else.
  design: |
    (i) Add `target: { owner: string; repo: string }` to the `judgeReview` call inside `runReview`
    (src/run-task.ts:5317-5333), populated from the SAME `owner`/`repo` already destructured from
    `args` at line 5119 — no new resolution, no re-derivation from a bare repo name.
    (ii) The re-review / fix-rung call site (src/run-task.ts:9512-9533) needs NO change beyond what
    it already does: it already forwards `owner: opts.reviewBase.owner, repo: opts.reviewBase.repo`
    into `runReview`'s own args, and `runReview` now threads those into `judgeReview` itself — so
    this task's test coverage for that path asserts the SAME target reaches `judgeReview` through
    the existing forwarding, not that a second forwarding point is added.
    (iii) `ReviewEvidence.target` is consumed ONLY where W1-T3525's registry (once merged) reads it
    to key suite selection; this task does not itself add registry logic (W1-T3525's job), and does
    not touch src/lib/review.ts's registry beyond whatever minimal type surface `target` requires to
    compile against W1-T3525's shape.
    (iv) Every other `judgeReview` argument at both call sites (diff, report, semantic,
    headCheckoutDir, baseCheckoutDir, taskDeclaredFiles, openTaskIds, etc.) is BYTE-FOR-BYTE
    UNCHANGED — this is an additive field, not a refactor of the evidence object.
    (v) The test target must not be re-derivable from a bare repo name (e.g. passing `repo:
    "remudero-site"` alone must not resolve the same as `{owner: "craigoley", repo:
    "remudero-site"}` with a different owner) and an owner/repo pair absent from W1-T3525's registry
    must be refused by that registry's own logic, not silently accepted here — this task proves the
    PLUMBING reaches `judgeReview` correctly; it does not re-prove W1-T3525's own refusal behaviour.
    (vi) A real site PR's evidence must not inherit this repo's `test/` declared-files or dashboard
    config: `taskDeclaredFiles`/`openTaskIds` remain scoped to the CURRENT task exactly as before,
    unaffected by the new `target` field.
  acceptance:
    - claim: "runReview's judgeReview call passes target: { owner, repo } sourced from runReview's own args, unchanged from what the caller supplied"
      proof: "grep: runReview passes its owner/repo target through to judgeReview evidence in test/run-review-evidence-target.test.ts"
    - claim: "the fix-rung re-review call path (runReview invoked with opts.reviewBase.owner/repo) reaches judgeReview with the same owner/repo, with no second, independent forwarding point added"
      proof: "grep: fix-rung path still relies on its existing runReview owner/repo forwarding in test/run-review-evidence-target.test.ts"
    - claim: "every other judgeReview argument (diff, report, semantic, headCheckoutDir, baseCheckoutDir, taskDeclaredFiles, openTaskIds) is byte-for-byte unchanged by this addition"
      proof: "grep: every pre-existing judgeReview evidence field remains in the runReview call in test/run-review-evidence-target.test.ts"
    - claim: "a target is never re-derived from a bare repo name lacking its owner"
      proof: "grep: runReview does not re-derive the target from a bare repo name in test/run-review-evidence-target.test.ts"
  falsifier: |
    CLOSE IF `judgeReview(criteria, {...})` at src/run-task.ts:5317 already includes a `target`
    field sourced from `owner`/`repo`: `grep -n "target: { owner" src/run-task.ts` currently shows
    only the unrelated `resolveReviewSubjectCheckout` call near line 15150, not this call site.
    DO NOT satisfy this by adding registry or suite-selection logic here — that is W1-T3525's job;
    this task is ONLY the plumbing from runReview's args into judgeReview's evidence.
    DO NOT satisfy this by changing what owner/repo runReview itself receives, or by re-deriving
    owner/repo from a URL or a bare repo string — both call sites already have the correct values
    in scope; this task threads them one hop further, nothing more.
  note: |
    Rule 25 CHECKED: this touches `src/run-task.ts`'s `runReview`/`judgeReview` call sites only to
    add one field; no other argument's shape or ordering changes.
    DEPENDS ON W1-T3525 (queued): W1-T3525 defines the owner/repo-keyed registry shape that
    `target` exists to feed; building this first would guess at a field shape W1-T3525 has not yet
    settled. This task does not implement or modify that registry itself.
    Does not cover the site daemon's automated review path or any live merge of a
    `craigoley/remudero-site` PR — those are operational follow-ups once both this task and
    W1-T3525 have merged, not plan acceptance criteria here.
