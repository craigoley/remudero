    WHY IT IS MISSED. For the failing suite, `enumeratesPopulation` returns true (it calls readdirSync on a REPO_ROOT
    path), but `namedPlanOrDocsPaths` returns an empty set. The suite spells its roots as
    `["plan", "docs", "learnings"].map((d) => join(REPO_ROOT, d))` and walks them with a recursive helper,
    `citingFiles(dir)`. The join arm in `namedPlanOrDocsPaths` reads only quoted segments after the first argument, so
    `join(REPO_ROOT, d)` names nothing, and a bare `"plan"` with no slash matches no literal arm. `readsWholePlan`
    therefore reads false, and `readsChangedPlanOrDocs` drops the suite for any plan diff.
    IT IS A CLASS, NOT ONE SPELLING. At origin/main 10 test files hold a bracketed bare `"plan"`, `"docs"` or
    `"learnings"` array element and are not in the 514. Measured with
    `grep -lE '\[\s*"(plan|docs|learnings)"\s*,' test/*.test.ts`, then removing the selected list. They include the
    failing suite, test/the-wipe-test-can-only-ask-about-learnings.test.ts and test/panel-skills.test.ts. Not every one
    reads plan/ (some pass "plan" as an argv word), so the builder classifies each in the PR body.
    The observed read map (W1-T6084, test/setup/read-map.ts) already records every non-code path a suite reads or
    lists. No consumption-ready map is published today: scripts/read-map-corpus.mjs `collect` says it "never emits
    a consumption-ready read map", so a design that relies only on it would select nothing live.
    NOT COVERED ELSEWHERE: swept plan/tasks.d on origin/main and the plan diffs of all 436 open heads for
    namedPlanOrDocsPaths, planReadingSuiteFiles and plan-reading. W1-T5698 (merged) narrowed the selection to readers
    of the changed paths. W1-T9869 (queued) makes the same lists walk nested test/ folders, the same function with a
    different concern; whichever lands second merges the other. No open head changes this arm.
  design: |
    Operator rulings: no hard thresholds and no hand lists. The selection is derived from what a suite reads.
    1. DERIVED ROOTS. A suite whose source holds a quoted bare plan-scope segment (`"plan"`, `"docs"`, `"learnings"`,
       `"doctrine"`, as an array element or a join segment) is a reader of that tree. It does not matter whether the
       segment reaches `join` as a literal or through a variable (`[...].map((d) => join(REPO_ROOT, d))`). The suite
       must also enumerate a repo-rooted directory, as `enumeratesPopulation` already decides, including a walk inside
       a helper whose parameter is the root. `namedPlanOrDocsPaths` returns those roots, so `readsWholePlan` sees
       `plan` and a changed shard selects the suite. A bare segment in a suite that walks nothing selects nothing, so
       W1-T5698's narrowing holds: a suite naming only plan/policy.yaml is still not picked for a shard diff.
    2. OBSERVED READS, PREFERRED WHEN THEY CAN SPEAK. When a read map is supplied and `readMapProblem` says it is
       usable, `planReadingSuiteFiles` also adds every suite the map records reading a changed path, or listing a
       directory the path sits under (`readMapReaders`). When the map cannot speak, the stderr summary line names why,
       for example `read_map=unusable (<reason>)`, and the derived arm alone decides. The static arm is never removed
       while the map is absent.
    3. THE CLI's existing `selected_count`/`previous_count` line gains the count the new arm added. The PR body quotes
       it at origin/main for the W1-T9875 shard, and classifies each of the 10 bare-segment suites above as a real
       plan reader or not.
    4. Tests (new file, test titles verbatim as in the proofs below):
       - a fixture suite in the #12389 shape (bare-segment array mapped through `join(REPO_ROOT, d)`, walked by a
         recursive readdirSync helper) is selected for a lone plan/tasks.d shard diff; at origin/main it is not;
       - the real test/a-retired-index-line-keeps-its-frozen-bullet.test.ts is in the CLI listing for the W1-T9875
         shard path;
       - a bare segment with no population walk, and a suite naming only plan/policy.yaml, are not selected for a
         shard diff (positive control: W1-T5698's narrowing holds);
       - a usable read-map fixture that records a suite listing `plan/**` selects that suite even when its source
         names no plan path, and an unusable map falls back to the derived arm and names why.
