  design: |
    No new constant, interval or byte bound. The window, minRotations, refuseIncomplete and the cadence are unchanged.
    1. EACH READER PARSES ONLY WHAT ITS FIGURES READ. The board side and the independent side each keep their own
       corpus reader and their own reducers, as W1-T4841 and W1-T4820 require. The board side keeps the board's
       dedupe through readLedgerUnionBounded. Each passes a pre-parse `keep` (or `pattern`) that retains a line only
       when it names one of the steps a figure reads, or the task id of a halted task.
       - readLedgerUnionBounded gains a pass-through of that filter, and it also applies to its live-file read. A
         caller that passes no filter reads exactly as today.
       - The halted set comes from the corpus itself. Either one raw pass keeps the step lines and a later pass keeps
         the halted tasks' lines, or one pass keeps both when the order allows it. The builder picks one and says
         which. A parsed copy of the whole window is never held.
    2. THE QUEUED-TASK FIGURE. projectPlan reads broadly. Its independent figure is computed from rows filtered to
       the steps projectPlan's reducers read. The builder derives that list from the reducers, and a census test fails
       when a fixture row of an unlisted step changes projectPlan's queued count. Or it runs in a short-lived worker
       that returns only the count. Either way, the main isolate never holds the whole window.
    3. THE SAVING IS READ LIVE. Each check writes one reader.agreement row, even when the figures agree. It carries
       lines_scanned, rows_kept per reader, heap_used_before_bytes and heap_used_after_bytes (process.memoryUsage, no
       collection), and duration_ms. The before/after pair over daemon.memory and daemon.slack_reclaim rows, one
       generation either side, is the check.
    4. The figures, the reader.disagreement rows and checkReaderAgreement's signature are unchanged. A fixture corpus
       gives the same findings before and after.
    Tests go in the new file, with titles verbatim as in the proofs. Inject the raw readers and count the lines each
    side parses. One test reads a real temporary state dir through the default readers, so the default seams are
    covered.
