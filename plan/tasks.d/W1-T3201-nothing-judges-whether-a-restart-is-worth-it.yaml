  rationale: |
    OPERATOR DIRECTION 2026-09-08, verbatim: "We don't want to restart and recycle too much because
    it adds interruption to our processing, but we also want to pick up important changes. The llm
    judge can decide that much better than a human can in the moment."

    WHAT DECIDES TODAY IS A FILE'S EXISTENCE. `decideDeployTrigger` compares the install's HEAD to
    `origin/main` and looks for `state/DEPLOY_REQUESTED`. The pending change's CONTENT reaches the
    decision nowhere. MEASURED over the full ledger archive union: 15 rows, all `deploy.skip`, 14
    naming "no operator marker".

    A COUNT IS THE OBVIOUS SUBSTITUTE AND IT IS WRONG IN BOTH DIRECTIONS. On 2026-09-08 the checkout
    reached 20 commits behind in two hours. Most were plan-only filings that change no running
    behaviour whatsoever; one (#4640) gave the residual escalation judge its first production caller
    after it had sat unwired since W1-T349 — visible in the ledger as `escalation.judged` going from
    zero to one only after a restart. "Restart at N behind" would have fired for the twenty and
    could equally have waited through the one.

    THE COST SIDE IS REAL AND MEASURED, not a worry. That same recycle PAUSED the fleet and waited
    570s for a live Codex worker to finish before it could proceed. `recycle-container.sh` sizes its
    own wait from measured worker durations — "19.3 min median (1158s), 36.0 p90, 46.7 p95, 98.5
    max" over 115 `implement.done` rows. An ill-timed restart can therefore cost the better part of
    an hour of drained capacity, which is exactly the interruption the operator does not want spent
    on documentation.

    SO THE QUESTION IS A JUDGEMENT, NOT A THRESHOLD: is what is pending worth what it costs to take
    it, right now. That reads a diff and a live state together, and neither a commit count nor a
    file marker can express it.

    THE PATTERN IS ESTABLISHED IN THIS REPO AND ITS FAILURE MODE IS TOO. Four LLM judges exist
    (risk, flight, escalation, promotion). The escalation judge was BUILT COMPLETE — prompt,
    exemptions, fail-open default, a real no-tools spawn, six tests — and had ZERO production callers
    until W1-T3166 wired it the same day this shard was filed. A fifth judge with no call site would
    repeat that exactly, which is why this task declares one.
  design: |
    (i) THE JUDGE DECIDES WANT, THE GATES DECIDE SAFE, AND THE LINE IS ABSOLUTE. A verdict is an
    input to `runDeployCycle`, never a bypass of it: `daemonIsIdle`, `evaluateIdleGate`,
    `DEPLOY_IDLE_DEFER_CEILING_MS`, the health check and the rollback all still run and still refuse.
    A judge that can restart during live work has replaced a human gate with a worse one.
    (ii) A SCORED ACCUMULATOR, NOT A HOLISTIC VERDICT PER POLL. Each merged change gets an IMPACT
    SCORE; the scores accumulate; a restart is wanted when the running total crosses a recorded
    THRESHOLD, and the total resets on a completed restart. This is the operator's design
    (2026-09-08) and it is better than asking "should I restart now" each time for a reason worth
    stating: an accumulator is CALIBRATABLE. Restarting too often or too seldom is fixed by moving
    ONE recorded number, against observed frequency. A holistic verdict offers nothing to turn.
    (ii-a) PLAN-ONLY IS A DETERMINISTIC ZERO AND NEVER REACHES THE JUDGE. `planOnlyDiff` already
    exists, exported and tested (src/lib/review.ts:2736, with `planOnlyFromFiles` at :2730). A
    plan-only change contributes exactly 0, decided by that predicate, spending no spawn and
    exerting no pressure whatsoever — the operator was explicit: "we definitely shouldn't have any
    pressure to restart from plan-only changes". A model must not be able to score it above zero.
    (ii-CALIBRATED) MEASURED AGAINST 1 496 MERGES OVER 14 DAYS (2026-08-25 to 2026-09-08), and the
    measurement CHANGED THIS DESIGN. Commit population: 107.0 merges/day; 598 (39.9%) plan-only;
    638 (42.6%) touch `src/`; 90 more touch `scripts/` without `src/`; 45 test-only; 19 docs-only.
    THE SCORER TO START WITH IS RUNTIME REACH, FLAT — plan-only 0, anything touching `src/` or
    `scripts/` scores 1, everything else 0. That scores 727 of 1 496 commits (48.6%), leaving 51.4%
    at zero. `scripts/` MUST count: gates and instruments are read fresh at invocation but from the
    same stale checkout, so they are inert until a recycle exactly as `src/` is.
    A TYPED SCORER WAS TESTED AND DID NOT EARN ITS COST. Weighting fix=3 / feat=2 / other=1 with
    docs-on-src=0, replayed over the same sequence at MATCHED restart rates, produced waits within
    ~0.3h of the flat scorer and a WORSE maximum at two of three rates (at ~2.2 restarts/day: flat
    p90 11.3h / max 26.6h versus typed p90 10.5h / max 36.0h). At 45.6 src-commits a day the
    fix/feat mix is near-constant over any window long enough to reach a threshold, so weighting
    reorders within a burst and does not move the cadence. START FLAT; a weighting must be justified
    by measurement, not by intuition.
    (ii-UPLIFT) THE JUDGE RAISES A DETERMINISTIC BASE, IT NEVER SETS THE SCORE ALONE — the operator's
    refinement (2026-09-08): "have the judge also up the points if the change is truly an impactful
    update to the daemon, not just a basic: did it touch script and src or not — but what did it
    change and how impactful". The path predicate sets a FLOOR; the judge may raise it after reading
    what actually changed.
    THE MEASUREMENT DID NOT REJECT THIS, AND THE DISTINCTION MATTERS. What was tested and rejected
    (see ii-CALIBRATED) is COMMIT TYPE AS A PROXY — fix=3 / feat=2 from the subject line. A type
    prefix is a label the author chose, not a reading of the diff, and it carried no signal. Nothing
    here measures whether a model reading the change itself does better, because that cannot be
    measured without one in the loop. It is an open bet, and the ledgered scores are how it gets
    settled.
    THE SCALE, chosen so the top rung is expressible rather than arbitrary:
        1   the deterministic floor: any change reaching src/ or scripts/
        3   notable — alters behaviour an operator would notice
        9   significant — changes a decision path, a gate, or a rung's disposition
       18   URGENT — clears a live defect, or wires a mechanism that is currently unreached
    18 EQUALS THE THRESHOLD BY CONSTRUCTION, so "this one change justifies a restart on its own" is
    a verdict the scale can express. A scale whose maximum is below the threshold cannot say it.
    UPLIFT-ONLY, NEVER REDUCTION, and this is the safety property: the judge cannot score a
    src-touching change below 1, and cannot touch plan-only at all. A miscalibrated judge can
    therefore only make restarts MORE frequent — bounded by the rate ceiling (iv) — and can never
    hide a change from the operator. Failing closed (iii) here means NO UPLIFT, base score stands.
    (ii-b) THE JUDGE SCORES IMPACT, IT DOES NOT DECIDE RESTARTS. Its question is narrow and
    answerable — how much does THIS change alter running daemon behaviour — which is a far better
    use of a model than a whole-fleet timing call, and it makes each verdict reviewable in isolation.
    The THRESHOLD, the accumulation and the reset are ordinary code.
    (ii-c) THE PROMPT CARRIES WHAT SCORING NEEDS: the change's subjects and touched paths, whether
    it wires a previously-unreached mechanism, and whether it names a live defect. It does NOT carry
    fleet-timing state — that belongs to the deterministic gates, not to a score.
    (iii) FAIL CLOSED, WHICH IS THE OPPOSITE POLARITY TO THE ESCALATION JUDGE, AND DELIBERATELY. An
    unreadable verdict means DO NOT RESTART. There the costly direction was hiding work from a human;
    here it is interrupting the fleet on a verdict nobody could read. Staying stale is visible,
    boring and reversible; a bad restart costs drained capacity and can recur.
    (iv) A RESTART-RATE CEILING THE ACCUMULATOR CANNOT ARGUE WITH, distinct from the threshold and
    doing a different job: the threshold expresses "enough has built up", the ceiling expresses "not
    this often, whatever the score says". W1-T3199 makes "not too much" a requirement; a bound
    outside the score enforces it, so a miscalibrated scorer cannot thrash the fleet however
    confident it is. Hitting the ceiling is itself a ledgered event.
    (iv-UPLIFT) UPLIFT MOVES THE THRESHOLD, AND IGNORING THAT WOULD SILENTLY TRIPLE RESTARTS.
    Modelled over the same 14-day sequence (52.0 base points/day), holding the flat baseline's ~4.3
    restarts/day:
        uplift        T=12   T=15   T=18   T=24     (restarts/day)
        none (flat)   4.29   3.43   2.86   2.15
        10% -> 9      6.15   4.94   4.22   3.22
        20% -> 9      8.94   6.94   5.72   4.79
    SO WITH UPLIFT THE STARTING THRESHOLD IS 18, NOT 12 — a judge raising ~10% of scoring changes to
    9 reproduces the flat cadence at 18. If the judge turns out to uplift far more often than 10%,
    the threshold rises with it; that is the tuning loop, and the ledgered scores (vi) are what make
    the actual uplift rate observable instead of assumed.
    (iv-CALIBRATED-FLAT) WITHOUT UPLIFT THE THRESHOLD IS 12, chosen from a replay of the real 14-day sequence
    under the flat scorer. The full sensitivity, recorded so the first tuning has a baseline rather
    than a guess (wait = how long a scoring change sits before it is live):
        thr   restarts/day   mean    p50    p90     max
          6           8.66   1.1h   0.7h   2.5h   12.3h
          8           6.44   1.6h   1.0h   3.9h   22.0h
         10           5.15   2.0h   1.3h   4.5h   23.0h
         12           4.29   2.5h   1.7h   5.3h   20.5h     <- start here
         15           3.43   3.3h   2.3h   7.2h   33.3h
         18           2.86   3.9h   2.8h   8.2h   30.8h
         25           2.07   5.4h   4.3h  10.9h   40.0h
    At 12 a daemon-affecting change is live in 1.7h median and 5.3h at p90, for ~4.3 restarts a day.
    NOTE 12 BEATS 15 ON THE WORST CASE (20.5h vs 33.3h) while costing 0.9 more restarts a day — the
    maximum is driven by quiet stretches, not by the threshold, so it is NOT monotonic and a tuner
    must not assume raising the number only trades latency for calmness.
    (iv-a) THE THRESHOLD IS RECORDED AND TUNABLE, and its current value carries the reason it holds
    that value. The operator's own words: "that threshold can be adjusted if we're restarting too
    much or too little". A magic number with no recorded rationale cannot be tuned by anyone who
    did not choose it.
    (v) AN EXPLICIT `rmd deploy` OUTRANKS THE JUDGE. The operator's marker stops being REQUIRED and
    stays SUFFICIENT — a human who has decided must not have to persuade a model.
    (vi) EVERY SCORE LEDGERED WITH ITS REASON, ALONGSIDE THE RUNNING TOTAL AND THE THRESHOLD IN
    FORCE, registered for retention in the SAME change. This is what makes (iv-a) possible at all:
    tuning needs the history of what scored what and how long the total took to cross. Establishing
    what the deployer had been doing since August was possible only because `deploy.skip` rows
    exist; that legibility must survive and must now carry the numbers.
