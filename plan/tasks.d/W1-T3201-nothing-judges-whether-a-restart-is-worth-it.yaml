- id: W1-T3201
  title: "NOTHING JUDGES WHETHER A RESTART IS WORTH ITS INTERRUPTION — the deploy decision is a marker check, so twenty documentation commits and one commit ending an escalation storm are treated identically; a change-and-risk judge should weigh the pending diff's worth against the cost of interrupting what is in flight"
  repo: remudero
  depends_on: [W1-T3199, W1-T3200, W1-T3166]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 40.00
  files: [src/lib/deploy-judge.ts, src/lib/deployer.ts, test/a-restart-is-worth-its-interruption.test.ts]
  origin: "operator-session#deploy-gate-2026-09-08"
  plan_refs: ["W1-T3199", "W1-T3200", "W1-T3166", "W1-T349"]
  status: queued
  attempts: 0
  rationale: |
    OPERATOR DIRECTION 2026-09-08, verbatim: "We don't want to restart and recycle too much because
    it adds interruption to our processing, but we also want to pick up important changes. The llm
    judge can decide that much better than a human can in the moment."

    WHAT DECIDES TODAY IS A FILE'S EXISTENCE. `decideDeployTrigger` compares the install's HEAD to
    `origin/main` and looks for `state/DEPLOY_REQUESTED`. The pending change's CONTENT reaches the
    decision nowhere. MEASURED over the full ledger archive union: 15 rows, all `deploy.skip`, 14
    naming "no operator marker".

    A COUNT IS THE OBVIOUS SUBSTITUTE AND IT IS WRONG IN BOTH DIRECTIONS. On 2026-09-08 the checkout
    reached 20 commits behind in two hours. Most were plan-only filings that change no running
    behaviour whatsoever; one (#4640) gave the residual escalation judge its first production caller
    after it had sat unwired since W1-T349 — visible in the ledger as `escalation.judged` going from
    zero to one only after a restart. "Restart at N behind" would have fired for the twenty and
    could equally have waited through the one.

    THE COST SIDE IS REAL AND MEASURED, not a worry. That same recycle PAUSED the fleet and waited
    570s for a live Codex worker to finish before it could proceed. `recycle-container.sh` sizes its
    own wait from measured worker durations — "19.3 min median (1158s), 36.0 p90, 46.7 p95, 98.5
    max" over 115 `implement.done` rows. An ill-timed restart can therefore cost the better part of
    an hour of drained capacity, which is exactly the interruption the operator does not want spent
    on documentation.

    SO THE QUESTION IS A JUDGEMENT, NOT A THRESHOLD: is what is pending worth what it costs to take
    it, right now. That reads a diff and a live state together, and neither a commit count nor a
    file marker can express it.

    THE PATTERN IS ESTABLISHED IN THIS REPO AND ITS FAILURE MODE IS TOO. Four LLM judges exist
    (risk, flight, escalation, promotion). The escalation judge was BUILT COMPLETE — prompt,
    exemptions, fail-open default, a real no-tools spawn, six tests — and had ZERO production callers
    until W1-T3166 wired it the same day this shard was filed. A fifth judge with no call site would
    repeat that exactly, which is why this task declares one.
  design: |
    (i) THE JUDGE DECIDES WANT, THE GATES DECIDE SAFE, AND THE LINE IS ABSOLUTE. A verdict is an
    input to `runDeployCycle`, never a bypass of it: `daemonIsIdle`, `evaluateIdleGate`,
    `DEPLOY_IDLE_DEFER_CEILING_MS`, the health check and the rollback all still run and still refuse.
    A judge that can restart during live work has replaced a human gate with a worse one.
    (ii) THE PROMPT CARRIES BOTH SIDES OR IT IS GUESSING: on the change side, what is pending —
    subjects, whether any touches `src/` at all versus `plan/` only, and whether anything names a
    live defect; on the cost side, what is in flight — inflight locks, live worker ages against the
    measured duration distribution, and how recently a restart already happened.
    (iii) FAIL CLOSED, WHICH IS THE OPPOSITE POLARITY TO THE ESCALATION JUDGE, AND DELIBERATELY. An
    unreadable verdict means DO NOT RESTART. There the costly direction was hiding work from a human;
    here it is interrupting the fleet on a verdict nobody could read. Staying stale is visible,
    boring and reversible; a bad restart costs drained capacity and can recur.
    (iv) A RESTART-RATE CEILING THE JUDGE CANNOT ARGUE WITH. W1-T3199 makes "not too much" a
    requirement; this enforces it as a bound outside the verdict, so a miscalibrated judge cannot
    thrash the fleet however confident it is. Hitting the ceiling is itself a ledgered event.
    (v) AN EXPLICIT `rmd deploy` OUTRANKS THE JUDGE. The operator's marker stops being REQUIRED and
    stays SUFFICIENT — a human who has decided must not have to persuade a model.
    (vi) EVERY VERDICT LEDGERED WITH ITS REASON, ON BOTH ARMS, registered for retention in the SAME
    change. Establishing what the deployer had been doing since August was possible only because
    `deploy.skip` rows exist; that legibility must survive.
  acceptance:
    - claim: "a pending change that touches only plan/ does not trigger a restart, while one touching src/ and naming a live defect does — the judge reads content, not a count"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "the judge's verdict cannot bypass the deterministic gates: a 'restart now' verdict with a live worker still defers through the idle gate"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "an unreadable, throwing or unparseable verdict resolves to DO NOT RESTART — fail closed, proven at the callsite"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "the restart-rate ceiling holds against a judge that says yes every time, and hitting it is ledgered"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "an explicit rmd deploy marker still forces a deploy without consulting the judge"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "every verdict writes a ledger row naming decision and reason on BOTH arms, and that step survives rotation"
      proof: "unit test: test/a-restart-is-worth-its-interruption.test.ts"
    - claim: "the judge has a PRODUCTION call site — deployer.ts calls it, not only its own tests"
      proof: "grep: judgeDeployWorth( in src/lib/deployer.ts"
  falsifier: |
    CLOSE IF anything already weighs a pending change against interruption cost: read
    `decideDeployTrigger` (src/lib/deployer.ts) and name the field carrying the diff's content.
    MEASURED 2026-09-08: it compares HEADs and looks for an operator marker; no content reaches it.
    POSITIVE CONTROL, because "no deploy decision rows" and "no deploys" look the same: the archive
    union must yield the 15 `deploy.skip` rows and their three distinct reasons. A read returning
    nothing has failed to open the archives.
    PROVE IT LOAD-BEARING: the fixture needs a plan-only pending change AND a src-touching one that
    names a live defect, with a stub judge separating them, and the restart count must differ by
    exactly one. If both route the same way the judge is decorative.
    DO NOT let the judge reach the safety gates. Design (i) is the entire safety argument; a verdict
    that restarts during live work is worse than the marker it replaced.
    DO NOT fail open. The escalation judge fails OPEN because hiding work from a human is its costly
    direction; here the costly direction is interrupting the fleet on a verdict nobody could read,
    so the polarity inverts. Copying the sibling's default would be the single most damaging error
    available in this task.
    DO NOT satisfy this with a commit-count heuristic behind a judge-shaped interface. The rationale
    rejects counts in both directions, and a "judge" that only reads a number has answered the
    question a threshold already answers.
  note: |
    Rule 25 CHECKED: `src/lib/` is ordinary src.
    THE CALL-SITE CRITERION IS DELIBERATE AND IS THE LESSON OF W1-T3166 AND W1-T3188. W1-T349 built
    a complete, tested judge that nothing called; `lint-plan` refused W1-T3188 earlier the same day
    for exactly this omission ("creates src/lib/verify-human-judge.ts but no acceptance criterion
    proves a CALL SITE for it"). A fifth judge is filed with its caller named from the start.
    THE POLARITY INVERSION IS THE MOST IMPORTANT LINE IN THIS SHARD and is stated twice on purpose —
    in design (iii) and again in the falsifier. Every other judge in this repo fails open. This one
    must not, and a reviewer's instinct will be to make it match its siblings.
    CAVEAT WITH EQUAL WEIGHT: nothing here establishes that an LLM judges this well. The operator's
    claim that a judge decides it better than a human in the moment is a reasonable bet, recorded as
    HIS, not as a finding. The ledgered verdicts required by design (vi) are what will make it
    checkable after the fact — and the first weeks of them should be READ, not assumed.
    SECOND CAVEAT: the interruption cost is measured for IMPLEMENT workers (115 `implement.done`
    rows, 19.3 min median, 98.5 max). The cost of interrupting a review, a sweep pass or a retro is
    NOT measured, and the prompt should not present a number it does not have.
