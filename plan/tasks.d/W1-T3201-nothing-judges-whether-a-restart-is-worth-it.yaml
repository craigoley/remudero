  falsifier: |
    CLOSE IF anything already weighs a pending change against interruption cost: read
    `decideDeployTrigger` (src/lib/deployer.ts) and name the field carrying the diff's content.
    MEASURED 2026-09-08: it compares HEADs and looks for an operator marker; no content reaches it.
    POSITIVE CONTROL, because "no deploy decision rows" and "no deploys" look the same: the archive
    union must yield the 15 `deploy.skip` rows and their three distinct reasons. A read returning
    nothing has failed to open the archives.
    PROVE THE ACCUMULATOR LOAD-BEARING, and it takes THREE fixtures, not two: (a) a run of plan-only
    changes must leave the total at zero and the judge uninvoked; (b) a run of scoring changes that
    stays UNDER the threshold must want no restart; (c) the change that crosses it must want exactly
    one, and the total must then reset. A suite that only shows "impactful change causes restart"
    passes on a design with no accumulator at all.
    PROVE THE THRESHOLD TUNABLE: the same change sequence replayed at a higher threshold must yield
    STRICTLY FEWER restarts, and at a lower one strictly more. A threshold that does not move the
    outcome is a constant nobody can calibrate, which defeats the reason this design was chosen.
    DO NOT let the judge reach the safety gates. Design (i) is the entire safety argument; a verdict
    that restarts during live work is worse than the marker it replaced.
    DO NOT fail open. The escalation judge fails OPEN because hiding work from a human is its costly
    direction; here the costly direction is interrupting the fleet on a verdict nobody could read,
    so the polarity inverts. Copying the sibling's default would be the single most damaging error
    available in this task.
    DO NOT satisfy this with a commit-count heuristic behind a judge-shaped interface. A count is not
    a score: the whole point is that twenty plan-only filings weigh ZERO while one wiring commit
    weighs a lot, and a counter cannot express that.
    DO NOT let a model score a plan-only change. `planOnlyDiff` decides that arm deterministically;
    routing it through a judge reintroduces the exact pressure the operator ruled out and spends a
    spawn to do it.
    DO NOT collapse the threshold and the restart-rate ceiling into one number. They answer
    different questions — "has enough built up" versus "not this often regardless" — and merging
    them means tuning one breaks the other.
  note: |
    THE ACCUMULATOR IS THE OPERATOR'S DESIGN (2026-09-08) AND IT DISPLACED A WEAKER ONE OF MINE.
    This shard was first filed asking the judge to weigh a pending diff against interruption cost
    per decision. His version — score each change, plan-only is 0, accumulate to a tunable threshold
    — is better for a reason worth recording: it is CALIBRATABLE. "Restarting too much or too
    little" is fixed by moving one recorded number; a holistic verdict offers nothing to turn. It
    also narrows the model's question to something answerable in isolation and removes the judge
    from the plan-only path entirely.
    THE CALIBRATION CHANGED THE JUDGE'S ROLE, and this is the most important thing the measurement
    produced. A model scoring EVERY change would spend 727 spawns per 14 days to produce outcomes
    a path predicate reproduces within 0.3h. So the judge is NOT the ordinary path: classification
    is deterministic, and the judge earns its place only as an EXCEPTION ESCALATOR — the rare change
    whose urgency is out of proportion to its paths and type (a one-line fix ending a live
    escalation storm). Whether to call it at all in v1 is a live question; shipping the deterministic
    accumulator alone is a defensible first cut and the ledgered scores are what would justify
    adding the model later.
    Rule 25 CHECKED: `src/lib/` is ordinary src.
    THE CALL-SITE CRITERION IS DELIBERATE AND IS THE LESSON OF W1-T3166 AND W1-T3188. W1-T349 built
    a complete, tested judge that nothing called; `lint-plan` refused W1-T3188 earlier the same day
    for exactly this omission ("creates src/lib/verify-human-judge.ts but no acceptance criterion
    proves a CALL SITE for it"). A fifth judge is filed with its caller named from the start.
    THE POLARITY INVERSION IS THE MOST IMPORTANT LINE IN THIS SHARD and is stated twice on purpose —
    in design (iii) and again in the falsifier. Every other judge in this repo fails open. This one
    must not, and a reviewer's instinct will be to make it match its siblings.
    CAVEAT WITH EQUAL WEIGHT: nothing here establishes that an LLM judges this well. The operator's
    claim that a judge decides it better than a human in the moment is a reasonable bet, recorded as
    HIS, not as a finding. The ledgered verdicts required by design (vi) are what will make it
    checkable after the fact — and the first weeks of them should be READ, not assumed.
    SECOND CAVEAT: the interruption cost is measured for IMPLEMENT workers (115 `implement.done`
    rows, 19.3 min median, 98.5 max). The cost of interrupting a review, a sweep pass or a retro is
    NOT measured, and the prompt should not present a number it does not have.
