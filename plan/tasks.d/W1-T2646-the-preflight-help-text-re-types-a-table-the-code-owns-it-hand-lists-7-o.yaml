  note: |
    FILED FROM the W1-T2478 follow-up harvest (PR #3323). The harvest called it cosmetic; the
    grounding pass found three drifts in one string and a structural reason none of them is caught,
    so it is filed as a derive-the-list task rather than a prose correction.

    risk:high IS A RECORDED REGRADE, NOT A WORKAROUND, AND IT IS DEFENSIBLE ON MERITS AS WELL AS ON
    SIZING. The declared set resolves to three subsystems (run-task, the new test file, cli-reference),
    and `sizingViolation` fires below risk:high — the W1-T189/W1-T200/W1-T218 precedent, where a small
    task is graded UP rather than fragmented, because effort and risk are different axes. The merits
    half is real and is the reason this is not merely a linter artifact: making the usage string
    computed couples docs/cli-reference.md to FAST_GATE_STEPS through `cli-reference:check`, which is
    both a CI job and a fast-gate entry, so a wrong render reds a merge-gating check fleet-wide. That
    coupling is the point (design iv) and is exactly why it is named rather than discovered.

    BUDGET 100.00 PER THE FILE HEADER'S BINDING RULE — budget_usd is a runaway tripwire, not an
    allowance, and lowering it near the work's expected cost is the W1-T3 defect (died blocked_budget
    at $3.57 against a guessed $4 cap while still working). The work here is small; the cap is not a
    statement about its size.

    depends_on IS EMPTY DELIBERATELY. W1-T373 (--fast) and W1-T2478 (the census class) are merged, so
    both premises are on main. W1-T48 (the cli-reference drift gate) still reads queued in the plan
    while its code is demonstrably live — docs/cli-reference.md's own header names `cli-reference:check`
    and W1-T48 — so a hard edge to it would strand this behind a phantom, the W1-T75 bootstrap lesson.
    The gate is READ by this task and never edited.

    ON THE PROOFS — all four are the PURE-PATH `unit test:` form against one dedicated file, and that
    shape is chosen on evidence: W1-T253's amendment records that
    `unit test: test/x.test.ts — <sentence>` parses as NAME-FILTERED, so the sentence becomes a
    test-name pattern matching ZERO titles and the run CAPs at 0/N (measured on sibling W1-T252 /
    #901, a risk:high run refused for lack of observation and then rescued by hand). Neither authoring
    linter blocks that shape. The pure path lint-passes AND executes the whole file. The test path is
    INSIDE files:, so `proofScopeViolations` is silent and the scope guard cannot refuse the branch
    after the work is done (the W1-T309 postmortem). No `grep:` proof is used and that is deliberate:
    the obvious candidate, `grep: FAST_GATE_STEPS in src/run-task.ts`, ALREADY matches at head
    (:16718 and :31606 both mention it), so it would not discriminate head from base and would resolve
    executed_stale.

    WHY A FALSIFIER AND NOT JUST AN UPDATED SENTENCE: the string was correct when written and has been
    wrong three times since, each time silently, because nothing ties it to the table it describes.
    An edit restores it to correct-for-now; deriving it removes the class. The banked generalisation
    (every verb's accepted-flag set gated against its own usage) is named in design (vi) and is not
    filed here — one observed instance is not a census.
