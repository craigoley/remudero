  rationale: |
    §9 ALREADY RULES ON THE SHAPE, AND THIS TASK IMPLEMENTS THAT RULING RATHER THAN INVENTING ONE:
    "Routing is knowledge — golden-calibrated. mounts.yaml changes ship as PRs behind the golden
    suite like every other knowledge change. The flywheel proposes DOWNGRADES when a cheaper mount
    passes a task-type's goldens above threshold, and UPGRADES when strike-rate correlates with
    mount." A recommender that edits routing live would violate that doctrine outright.

    SO THE OUTPUT IS A PROPOSAL, AND THE EXISTING PATH ALREADY ACCEPTS ONE. `classifyProposal`
    (src/lib/inbox.ts) tiers proposals, `rmd inbox` reports readiness and `rmd approve` ratifies
    through the gate into a plan PR. This task emits into that path; it does not build a second
    ratification mechanism, and it holds no authority to merge anything.

    IT MUST REFUSE MORE OFTEN THAN IT RECOMMENDS. A recommendation carries the cell it applies to,
    the arms compared, each arm's n, the effect size and an interval — and below a declared minimum
    sample, or when W1-T2574 reports the arms unmatched, the answer is a REFUSAL naming what is
    missing. "No recommendation yet, n=4 against a floor of 30" is the correct output for most
    cells for a long time, and a recommender that always has an opinion is the failure mode, not
    the goal.

    THE TIER INVARIANT IS NOT ADVISORY TO THIS COMPONENT. §9: the flywheel "may lower workers
    freely but can NEVER lower the Architect to or below the worker ceiling". A proposed mount that
    would violate `enforceTierInvariant` must be refused AT PROPOSAL TIME, with the violation
    named, rather than emitted for a human to discover when the config fails to load.

    KNOWN DEPENDENCY, DECLARED RATHER THAN ASSUMED AWAY: §9's pre-merge proof is the golden suite,
    and MASTER-PLAN's own status paragraph records that the golden-task replay suite "has no
    `HarnessRunner` wired" so the Self-Harness leg reports no run recorded BY CONSTRUCTION. Until
    that is wired, a routing proposal's evidence is observational only and the ratifying human is
    the gate. This task must SAY SO in what it emits — a proposal that implies a golden run backed
    it when none did is the exact false-confidence this repo's gates exist to prevent.
