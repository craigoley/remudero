- id: W1-T2575
  title: "NOTHING TURNS THE ROUTING EVIDENCE INTO A DECISION — the sweep prints a table a human must read and act on, so the flywheel §9 has promised since WS-8 (\"the harness learns which horse each job actually needs\") has a measurement leg and no recommendation leg at all"
