  falsifier: |
    Five reverts, each turning a named case red:
    - Restore the `deps.escalate` call for the exhaustion row: the suite's laddered PR records a per-PR
      escalate call.
    - Drop the `priorStrikes = ceiling` overlay: the refreshed head decides `blocked-fixable` (`ci-log fix,
      strike 1/2`) instead of climbing.
    - Count rebuilds from ledger rows instead of operator notes: a rotated-ledger fixture with two notes
      and no `sweep.strike_ladder.requeued` rows rebuilds a third time.
    - Remove the cause-key search: two PRs with the same key open two issues.
    - Remove the assign call: the digest's create args carry no `--add-assignee`.
