  status: queued
  attempts: 0
  note: "verify:auto — the whole change is one predicate in a pure function with an existing test file.
    risk:high IS SET BY RULE 19's SPAN, NOT BY BLAST RADIUS, and the distinction is recorded so a
    later reader does not over-read it. The linter scores `files:` as two concerns (panel-graph,
    plan-view) and offers raise-or-decompose; DECOMPOSING IS WRONG HERE — the change is one
    predicate and its own falsifier, and a predicate cannot ship without the test that proves it
    bites in both directions. The real blast radius is one route's RESPONSE BODY: no dispatch
    behaviour changes, `runnableCandidates` is untouched, nothing writes, and the failure direction
    is visible (a frontier that shows too little). What genuinely earns caution is that this is the
    Plan tab's most prominent list and a careless fix silently discards the temporarily-held rows
    that carry real information — which is what design item (iii) and the second criterion exist for.
    budget_usd 45 — the edit is small; the work is the two-direction falsifier and confirming the
    idle-reasons duplication rather than taking it on trust.
    WHY EXCLUSION AND NOT RE-ORDERING, recorded so the decision is not relitigated: the parked rows
    already render under `need you (verify != auto)` in the pinned header, so keeping them in the
    frontier is duplication with a worse label; and re-ordering alone still lets them crowd the list
    on a quiet day. `already-merged` already takes exactly this treatment for the same reason."
