  title: "MAIN-HEALTH PAGES A HUMAN FOR A FLAKE — the rung escalates on the FIRST settled red conclusion with no same-sha re-run grace window, so an OSV-Scanner job whose scan exited 0 and whose only error was `Failed to FinalizeArtifact … (403) Forbidden` turned main red and opened a MANUAL issue; re-running the identical commit went green, and 17 such escalations have been opened and self-closed"
