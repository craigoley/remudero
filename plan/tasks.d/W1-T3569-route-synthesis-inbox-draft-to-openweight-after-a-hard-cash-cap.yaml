  rationale: |
    The retained W1-T3094 measurement assigns inbox drafting 1,436 runs and 45% of
    metered spend. Its output is deterministically linted and relinted at most
    MAX_RELINT_ATTEMPTS times before classification. The mount-affinity seam already
    bypasses the capacity auction without fabricating a provider window. Routing this
    existing narrow tool surface tests accepted output per dollar before a WebSearch
    bridge or generic-lane capability work expands authority.

    W1-T3546 supplied the inert provider adapter and cannot route a mount; W1-T3547
    remains the later triage-only route behind its WebSearch bridge. This task owns a
    distinct synthesis row and its trial boundary, so the shared mounts/test surface
    is ordered rather than concurrent.
  design: |
    Re-check both tool arrays from the target head immediately before editing. If
    inbox tools are no longer a subset of OPENWEIGHT_FUNCTIONS, refuse and report;
    do not add a missing function merely to preserve this route. Once W1-T3575 has
    supplied a real hard cap, add `provider: openweight` only to
    `synthesis.inbox_draft`, retaining its model, effort, max_turns and context
