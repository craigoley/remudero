  origin: "operator approval 2026-10-13: file the W1-T7848 known limit (at a new main tip, a held rule red refreshes before any probe)"
  plan_refs: [W1-T4351, W1-T6024, W1-T6405, W1-T7848, W1-T8396, W1-T7735]
  files: [src/lib/sweep.ts, test/a-held-red-on-a-check-main-never-ran-is-probed-before-any-refresh.test.ts]
