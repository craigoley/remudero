- id: W1-T9375
  title: "A HELD RED ON A CHECK MAIN NEVER RAN IS PROBED AT THE NEW TIP BEFORE ANY REFRESH — `decideBaseRed` returns `refresh` as soon as main reads green, before the fix rung's W1-T6024 probe runs, so an inherited `rule-checks` red (a check main's census never observes) is refreshed onto a main tip nobody probed; OBSERVED at origin/main 633bcb91f on both refresh paths"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: medium  # Rule 19: one concern — a green main justifies a refresh only for a check its reading observed
