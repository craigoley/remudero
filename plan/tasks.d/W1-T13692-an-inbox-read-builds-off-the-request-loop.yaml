  rationale: |
    WHY: Craig is hitting Console Inbox timeouts: Vercel logs show bursts where every serve read times out at once
    (11:05:20 to 11:05:35Z and 12:13:18 to 12:13:27Z on 2026-11-18), each at a Console Inbox page load of about five
    parallel reads, and a 502 partway through a walk of /v1/views/inbox at about 12:20Z.
    MEASURED: serve.demand 12:13 to 12:18Z had /v1/inbox p95 7.4 s. Stall rows in the bursts carry inbox-view
    renderView (4.7 to 5.0 s stalls), panel-graph inboxLanes and fleet-lane checkInboxSnapshot to read-page
    classificationSnapshotKey (1.0 s self). After the 12:19:22Z generation handoff, one stall of 9.3 s carried
    inboxLanes. On a copy of the live state (inbox-classification.json, 6.7 MB): the in-place read took 132 to 462 ms
    (parse 142 ms, then its checks), lanes 287 to 919 ms and the view's pages 112 to 640 ms, all on the loop of the
    request that first saw the file, and again for every PanelGraphDeps (a WeakMap keyed by deps).
  design: |
    INVARIANT boot-in-place: serve's boot read is in place, so a generation starts from the file on disk.
    INVARIANT off-loop: once a build exists, no Inbox read parses, checks, lanes or pages a changed persisted file on
    the request loop; it answers from the last build (its own generatedAt still judged by INBOX_STALE_AFTER_MS and the
    existing 503 rules) while one build runs.
    1. panel-graph holds one read per inbox root, source identity and scope (shared by every deps), with its lanes and
       the view pages of those lanes. An operator write that moves the plain or fleet store still rebuilds the lanes
       at once, as before.
    2. buildSlowLaneInbox(input) is the whole build (read, check, lanes). inbox-build-worker.ts runs it in a worker
       thread (thread name rmd-inbox-build) and sends the read, the lanes and the view pages as three messages, so
       serve takes each copy in its own turn. N reads that see a new file start one build.
    3. The first read of a slot is in place, as before. Serve's boot reads the core Inbox and builds its lanes in place
       (readSlowLaneInbox(deps, { inPlace: true })) before the generation takes a request, so a new generation never
       answers an older generation's build. A failed build is logged and reads go in place for INBOX_BUILD_RETRY_MS (30 s).
    4. The deps flag inboxBuildOffLoop turns this on: serve's core panel deps and every instance's inbox deps.
  falsifier: |
    A deps object parses its own copy: criterion 1 fails. A request builds a changed file in place, or each read starts
    a build: criterion 2 fails. A failed worker loops or goes silent: criterion 3 fails. The worker's pages differ from
    in-place pages: criterion 4 fails.
