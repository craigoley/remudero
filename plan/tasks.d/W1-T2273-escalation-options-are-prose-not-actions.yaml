  note: |
    ── Q1. WHAT AN OPTION WOULD HAVE TO BE ─────────────────────────────────────────────────────

    (i) A CLOSED SET, NOT FREE PROSE — AND THAT IS THE WHOLE CHANGE. The options an escalation
    emits must be drawn from a vocabulary the console knows how to render, exactly as
    `escalate.ts` already keeps its LABELS a closed set (`BLOCKED` → `escalation-blocked`,
    `MANUAL`, `HARD_STOP`, `GRILL`). A free-text option cannot carry a button because nothing on
    the rendering side can know what pressing it would do. THE PROSE DOES NOT GO AWAY: it stays
    as the human-readable explanation beside the typed kind, the same way a reason class and free
    text sit beside each other elsewhere in this fleet.

    (ii) AND EACH OPTION CARRIES A ROUTE AND A PAYLOAD, OR IT CARRIES NEITHER AND SAYS SO. An
    option the console can execute names the route it posts to and the payload it posts. An
    option the console CANNOT execute — because the act is the operator's, see Q2 — must be
    marked as such rather than rendered identically and silently doing nothing. AN OPTION THAT
    LOOKS PRESSABLE AND IS NOT IS WORSE THAN ONE THAT SAYS "do this in a shell".

    (iii) THE RENDERER STAYS DUMB. `serve.ts` should render what the option declares; it must not
    map option prose to routes by pattern-matching, which would put the vocabulary in two places
    and let them drift — the same two-enumerator defect this repo has already paid for elsewhere.

    ── Q2. WHICH OPTIONS MUST NOT BECOME ROUTES ────────────────────────────────────────────────

    (iv) THE DISTINCTION IS "LET HIM DO IT" VERSUS "LET HIM DECIDE IT AND THE FLEET DOES IT", AND
    ONLY THE SECOND IS IN SCOPE. A console that can merge is a loaded gun: it turns one mis-click
    into an unreviewed merge on main. A console that can RECORD "I judge this safe to merge, and
    here is why" is a decision surface, and the merge still happens through the gate the operator
    already controls.

    (v) SO: NO MERGE ROUTE. NO PR-CLOSE ROUTE. NO REJECT ROUTE. Their absence today is CORRECT and
    this task must not end it. `review-manually` from `issues/2824` is the clearest case — "merge
    it by hand" is not a button, it is a ruling, and what the console owes is a way to record the
    ruling and its reason.

    (vi) AND `re-judge` IS THE OPPOSITE CASE, WHICH IS WHY BOTH ARE WORTH HAVING. Re-posting
    `remudero-review` changes no branch state, merges nothing and is idempotent per head. It is
    the shape of option that CAN safely carry a route. A build should treat it as the worked
    example and `review-manually` as the worked counter-example.

    (vii) THE EXISTING TIERS DECIDE THE REST AND MUST NOT BE RE-INVENTED. HIGH already gates the
    five paths that spend real budget or dispatch work; MIDDLE gates fleet control; LOW gates
    recording and acknowledgement. A new executable option belongs in one of those three, chosen
    by what it costs, never in a fourth tier invented for escalations.

    ── Q3. THE THREE MISSING PIECES OF THE ROUND TRIP ──────────────────────────────────────────

    (viii) (i) NO ROUTE EMITS THE DECISION RECORD. W1-T2244 defines a row carrying the
    escalation, the judged verdict and confidence, the disposition and a validated reason class,
    bound to the head sha. Nothing in the route table would call it: `/v1/escalation/mark-handled`
    stays a LOW-tier close-the-issue action and carries no verdict, no reason, no disposition.
    CITED, NOT RE-FILED.

    (ix) (ii) NOTHING READS IT BACK, AND A TWO-WAY CHANNEL NEEDS A READER THAT IS NOT A GATE.
    W1-T2244's own pins forbid a gate consuming the row, and that pin is RIGHT and must survive.
    But a reader that is not a gate is a different thing: THE FIX RUNG TAKING "judge-was-wrong,
    here is why" AS EVIDENCE FOR ITS NEXT ATTEMPT, exactly as it takes ci-log evidence today.
    Evidence steers an attempt; it does not authorise a merge. Without such a reader the operator
    types a reason into a ledger nothing consults, and the channel is one-way with extra steps.

    (x) (iii) THE REASON HAS NO INPUT SURFACE. A closed reason class needs a PICKER and free text
    needs a FIELD, and `serve.ts` has neither. This is the smallest of the three and the one most
    easily forgotten, because a route that accepts a reason looks complete from the server side
    while the operator has nowhere to type one.

    ── WHAT MUST NOT CHANGE ────────────────────────────────────────────────────────────────────

    (xi) THE OPERATOR GATES EVERY MERGE AND DEPLOY. No merge route, no PR-close route, no
    auto-resolve of an escalation. Nothing here widens auto-merge and nothing closes a PR on a
    score or a signal.

    (xii) THE CONSOLE STAYS READ-MOSTLY AND ITS EXISTING TIERS STAY. This adds a vocabulary and at
    most one executable option kind; it does not re-tier an existing route and does not add a
    tier.

    (xiii) ESCALATION STAYS THE FALLBACK, NOT THE FIRST MOVE. Making an option pressable must not
    make escalating cheaper than fixing — if anything the fleet should escalate LESS once it can
    act, and a build that raises escalation volume has moved the wrong number.

    (xiv) AND THE PROSE SURVIVES. An option's human-readable sentence is what makes an escalation
    legible to somebody reading it on a phone at midnight. Typing the option adds a machine-
    readable sibling; it does not replace the sentence with an enum.

    (xv) RULE 19 BAND. `risk: high` is set UP FRONT because `files:` spans two source stems and
    Rule 19 sizes on SPAN. THE BAND IS THE SPAN READING AND NOT A BLAST-RADIUS JUDGEMENT: the
    change types a field the emitter already writes and renders it on a surface that already
    renders the prose.
