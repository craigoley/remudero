- id: W1-T1033
  title: "NOTHING RUNS THE SUITE AGAINST `main` — `ci.yml` and `ci-gate.yml` are both `on: pull_request` and nothing else, so a broken merge is invisible until an unrelated PR fails for a reason its author cannot explain; three PRs merged red past a required check today and ten went red behind them, one of whose entire diff is three workflow-YAML version bumps"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    MEASURED 2026-08-19 AT origin/main f539e64e, and re-derived there after an earlier reading at
    d4478ea9. No `/rate_limit` call was made; every GitHub read used a REST path.

    (1) THE SUITE HAS NEVER RUN AGAINST `main`, AND THE CAUSE IS STRUCTURAL RATHER THAN DRIFT.
    `main` at f539e64e carries SIX check-runs — `Analyze (actions)`, `Analyze
    (javascript-typescript)`, `plan-load`, `Scan`, `scan / osv-scan`, `Scorecard analysis` — all
    green. `ci`, `coverage-ratchet` and `ci-gate` each read ZERO. POSITIVE CONTROL on that zero: the
    same query against an open PR head (#2218) returns `ci` = 1, so the reader sees its corpus.
    There is no push trigger to have broken: `.github/workflows/ci.yml` and
    `.github/workflows/ci-gate.yml` both declare `on: pull_request` and nothing else. CONTROL that
    this is a real configuration fact and not a failed grep: `codeql.yml`, `main-plan-guard.yml` and
    `scorecard.yml` DO carry a `push:` trigger.

    (2) THE CONSEQUENCE WAS OBSERVED, NOT PREDICTED. Three PRs merged carrying red required checks
    at their merged heads — #2204 at 12:57:39Z (`ci-gate=failure`, `coverage-ratchet=failure`),
    #2212 at 13:37:04Z (the same pair), #2211 at 13:38:54Z (`ci-gate=failure`). Ten open PRs went
    red behind them for one inherited cause, including one whose entire diff is three workflow-YAML
    version bumps. THE ORIGINAL BREAK IS ALREADY FIXED IN #2221 (a test mutating shared source in
    place). THIS TASK IS NOT THAT FIX — IT IS WHY NOBODY SAW IT FOR NINETY MINUTES.

    (3) THE REDUNDANCY OBJECTION DOES NOT HOLD HERE, AND TODAY IS THE PROOF. Post-merge runs are
    commonly called redundant because the PR gate already covered it. `enforce_admins` reads
    `false`, `ci-gate` IS among the required contexts (`["remudero-review","ci-gate"]`), and
    protection DID refuse — the three merges above went through by admin bypass. NO PR-SCOPED GATE
    CAN SEE WHAT LANDS AFTER IT IS BYPASSED: by construction it has already finished running. A
    post-merge run is the only observer of a bypassed merge.
  design: |
    (i) `ci` ALONE, AND THE OTHER TWO ARE EXCLUDED FOR MEASURED REASONS RATHER THAN TASTE.
      `ci-gate` MUST NOT BE ADDED TO A PUSH TRIGGER. Its job env is
      `SHA: ${{ github.event.pull_request.head.sha }}`, which is EMPTY on a push; its wait loop
      calls `gh api repos/${REPO}/commits/${SHA}/check-runs`, that call fails, `runs_json` exhausts
      its retries and `unreadable_die` exits 1 with "could NOT READ the check-runs API". Its
      `concurrency.group` is likewise `ci-gate-${{ github.event.pull_request.number }}`, which
      collapses to one shared group for every push with `cancel-in-progress: true`. Adding it would
      make EVERY MERGE LOOK BROKEN, which is worse than the problem this task fixes.
      `coverage-ratchet` IS TWO HALVES AND ONLY ONE SURVIVES. The ratchet half
      (`coverage-ratchet.mjs --lcov … --baseline scripts/coverage-baseline.json`) is
      base-independent and would work. The diff-coverage half runs
      `git diff "${BASE_SHA}"...HEAD` with `BASE_SHA: ${{ github.event.pull_request.base.sha }}`,
      empty on a push. Even wired to the previous commit it answers a DIFFERENT QUESTION — "lines
      this merge added that no test covers" is not "lines this PR added" — and would re-flag every
      line of a squash-merged PR. The comparison does not mean anything on a push.
      `ci` IS PUSH-SAFE: its job body contains ZERO references to `github.event`, `pull_request` or
      `BASE_SHA` (CONTROL: the `coverage-ratchet` job contains 1). Its steps are `npm ci`, the
      Playwright install, `tsc --noEmit` and `npm run test:ci`.
      THE SUITE IS WHAT FAILED, NOT THE GATE — so the minimum set that would have caught today's
      break is `ci` alone, and that is what this task adds.

    (ii) THE PRICE, MEASURED OVER THE 40 MOST RECENT COMPLETED CI RUNS, SUCCESS-ONLY.
      `ci`               n=31  p50 511s  p95 783s  max 1197s  mean 577s
      `coverage-ratchet` n=23  p50 740s  p95 1285s max 1638s  mean 845s
      At the observed merge rate of 15-30 per day, `ci` alone costs 144 CI-min/day (2.4 h) at 15 and
      289 CI-min/day (4.8 h) at 30. Adding `coverage-ratchet` would add 211-422 CI-min/day for a
      comparison design (i) shows is meaningless on a push.

    (iii) A RED PUSH RUN MUST REACH A NAMED READER, AND THE READER ALREADY EXISTS.
      `classifyRedCause` (`src/lib/sweep.ts`) returns `"base-caused"` when `baseCausedCheckName`
      fires; `redCauseStandsDown` then returns true, which stops the fix rung spending a strike, and
      the reason rides on the EXISTING `sweep.disposed` line rather than a new step — that
      function's own design note (vi) says so, precisely so it is not another mechanism nobody
      reads. THE GAP IS THE INPUT, NOT THE CONSUMER: `baseCausedCheckName(pr, allPrs)` infers base
      causation PURELY from the cross-PR pattern — the same check failing on EVERY open PR, with a
      vacuity guard below two PRs and `undefined` the moment one survivor exists. It reads nothing
      from `main`. Today it would have fired only after most of the ten had reddened, and a single
      PR whose head predated the check would have silenced it entirely. A red push run on `main` is
      a FIRST-PARTY signal needing no inference, and it can attribute the FIRST affected PR.
      CRITERION 3 REQUIRES THE READER TO BE NAMED IN THE CHANGE. Wiring it into
      `classifyRedCause`'s inputs is the expected shape; any other named consumer is acceptable, and
      an UNNAMED one is not.

    (iv) EXPLICITLY NOT PROPOSED.
      - AUTO-REVERT. Current practice offers it, but `DECISIONS.md` ratifies gating on
        irreversibility and an automatic revert of merged work is the operator's call. Named and
        stopped.
      - A MERGE QUEUE. It closes the adjacent gap — two PRs each green, broken together — but it is
        a separate change and W1-T1014 already examined it with its costs.
      - ANY CHANGE TO `enforce_admins` OR ANY OTHER REPOSITORY SETTING. See the note: that is the
        prevention this task does not provide.
      - THE ORIGINAL TEST DEFECT, which #2221 already fixes.
  acceptance:
    - claim: "the suite runs against main on a push, so a broken merge is observable without an unrelated PR failing first"
      proof: "unit test: W1-T1033: the ci workflow runs the suite on a push to main"
    - claim: "ci-gate is not triggered by a push, because an empty PR sha would fail every merge"
      proof: "unit test: W1-T1033: ci-gate is never triggered by a push"
    - claim: "a red push run reaches a named reader rather than being recorded and unread"
      proof: "unit test: W1-T1033: a red main run reaches its named reader"
    - claim: "the pull-request path is unchanged, so no PR gains or loses a check"
      proof: "unit test: W1-T1033: the pull request trigger is byte-for-byte unchanged"
  risk: high
  origin: "oper#nothing-tests-main-2026-08-19"
