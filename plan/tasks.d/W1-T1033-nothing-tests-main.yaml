  note: |
    THIS RIDES ALONE — NO `src/` PATH MAY ENTER THE IMPLEMENTING DIFF, AND THAT IS A GATE. Rule 25
    was RE-DERIVED IN-PROCESS AGAINST `detectInstrumentEntanglement` WITH FOUR CONTROLS:
      `.github/workflows/ci.yml` + `test/push-ci-on-main.test.ts`  -> entangled=false  <- this shape
      `.github/workflows/ci.yml` + `src/lib/sweep.ts`              -> entangled=TRUE
      `src/lib/sweep.ts` + `test/sweep.test.ts`                    -> entangled=false
      `.github/workflows/ci.yml` + two `test/` files               -> entangled=false
    So `test/` may ride (`isProductPath` is "under src/ and not a test file" — the design's own
    carve-out) and `src/` may not. IF CRITERION 3'S READER REQUIRES A `src/` EDIT, IT MUST SHIP AS
    ITS OWN PR rather than being folded in here; the criterion is satisfiable by naming the reader
    and proving the signal reaches it, which a fixture can do without changing `src/`.

    TWO SIBLINGS, CITED AND NOT ABSORBED.
      (i) THE REVIEW VERDICT IS ORTHOGONAL TO THE BOARD. #2204 carried `remudero-review: PASS — 5
      criteria substantiated` while two required checks were red at the same head, and #2212 carried
      `PASS — 3 criteria substantiated` likewise. The reviewer grades the shard's criteria and never
      asks whether the suite is green, which is what made a red PR look mergeable. Its own concern.
      (ii) NOTHING ATTRIBUTES AN INHERITED RED. Ten PRs went red for one cause and not one said so.
      Design (iii) supplies the input that would make attribution possible; the attribution surface
      itself is not built here.

    AND ONE ITEM IS THE OPERATOR'S, NOT THIS TASK'S. `enforce_admins` reads `false` on `main` while
    `ci-gate` IS among the required contexts and protection DID refuse — admin bypass is how three
    red PRs landed. A push run DETECTS a broken trunk; it does not PREVENT one. THAT IS THE
    PREVENTION THIS TASK DOES NOT PROVIDE, and no repository setting is changed by it.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT: the deliverable is the trigger in
    `.github/workflows/ci.yml` plus a falsifier. `test/push-ci-on-main.test.ts` does not exist at
    f539e64e — a forward-referenced PATH, never a guessed symbol — and is a new file because the
    house rule keeps a coverage-load-bearing test out of a shared suite.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text and this set
    crosses the workflow surface and `test/`. Blast radius argues DOWN — one trigger gains a branch,
    the pull-request path is unchanged by criterion 4, and the worst failure is a noisy post-merge
    run rather than a wrong verdict on a PR.

