  rationale: |
    OPERATOR OBSERVATION 2026-09-10, and it was correct against my own first reading: "how can it
    have not recorded what it found ... that makes no sense. shouldn't what we filed be in a PR too?"

    IT DID RECORD, AND IT FILED NOTHING. MEASURED across all three ledger rotation forms:

        ci_learning_cadence.ran  2026-09-07T18:45:42Z  status=backlog drafts=3 excluded=20
        ci_learning_cadence.ran  2026-09-08T19:22:03Z  status=backlog drafts=3 excluded=30
        ci_learning_cadence.run_failed 2026-09-09T20:31:38Z  gh: Bad credentials (HTTP 401)

    And `grep -rl 'origin:.*ci-learning' plan/tasks.d/` returns ZERO. Six drafts minted, none filed.

    THE TWO CALLERS DISAGREE, AND ONLY ONE IS WIRED. `rmd ci-learning` typed by hand files:
    `fileCiLearningShards(result.drafts, checkoutRoot, {...})` (src/run-task.ts:16788), printing
    `FILED <taskId> -> <relPath>`. The DAEMON arm (src/run-task.ts:24251-24263) calls
    `mintCiLearningShards(corpus, [])` and returns four counts. It never calls the filer.

    `plan/policy.yaml:1026` turned this rung ON by operator direction 2026-09-07, and its own comment
    states "this rung FILES" and "Verified after: a 14-day run filed three shards with real ids".
    THAT VERIFICATION WAS OF THE CLI PATH. The scheduled path has never filed anything.

    FOUR DEFECTS IN THIRTEEN LINES, each independently sufficient to lose the lesson:
      1. NO FILER CALL. The drafts are returned as counts and dropped.
      2. EMPTY IDEMPOTENCY SURFACE. `mintCiLearningShards(corpus, [])` — the CLI passes real
         `planOrigins` (:16753). Wired as-is, the same cause would re-file on every run forever.
      3. A HARDCODED ONE-DAY WINDOW. `loadCiFailureWindow(1)` where the CLI takes `--days N`. With
         `maxPerDay: 1`, a single missed firing loses that day's lessons permanently.
      4. THE FIRE IS RECORDED BEFORE THE RUN (:24253, "THE FIRE FIRST"). The 2026-09-09 401 spent
         the day's only allowance and produced nothing. Correct against a crash-loop; wrong against
         a transient outage, which is the observed failure.
  design: |
    (i) THE SCHEDULED PATH FILES WHAT IT DRAFTS, through the SAME `fileCiLearningShards` the CLI
    already calls. Not a second filer: one function, two callers, the second finally wired. Its
    result (`filed`/`skipped`/`refused`) rides the `ci_learning_cadence.ran` row so the ledger says
    what LANDED, not only what was drafted.
    (ii) THE REAL IDEMPOTENCY SURFACE, not `[]`. The daemon passes the same `planOrigins` the CLI
    derives, so a cause already in the plan is skipped rather than re-filed. Without this, (i) alone
    turns one lost lesson into a duplicate every firing.
    (iii) A FAILED FIRING MUST NOT CONSUME THE BUDGET. Keep "fire first" for the crash-loop it
    guards, and RELEASE the allowance when the run throws before doing any work — the observed 401
    shape. A run that filed, or partially filed, keeps its fire: the guard exists to stop repeating
    expensive work, not to punish an outage that did none.
    (iv) THE WINDOW IS A POLICY VALUE, NOT A LITERAL. `loadCiFailureWindow(1)` becomes a named
    default so a missed day can be recovered by widening the window rather than lost.
    (v) CADENCE 1/DAY -> 4/DAY, by operator direction 2026-09-10. `minIntervalMinutes: 1440 -> 360`
    and `maxPerDay: 1 -> 4` in plan/policy.yaml — both inside the schema bounds already declared
    there (min 15/max 1440; min 1/max 24), so this is a DATA edit and no schema changes. Four
    firings also bound the cost of one lost firing to six hours instead of twenty-four.
    (vi) EVERY RECORD STILL PARKS. `author_class: machine` + `verify: human` is unchanged here:
    `isDispatchEligible` refuses it and `machineAuthorVerifyViolation` blocks it at `verify: auto`.
    Releasing drafts automatically is a SEPARATE, later task under its own operator ruling; this one
    must not anticipate it.
