  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF the scheduled path already files: read
    `runCiLearningCadence` (src/run-task.ts) and name the filer call. MEASURED 2026-09-10 at
    4ca042d3: it calls `mintCiLearningShards(corpus, [])` and returns counts; `fileCiLearningShards`
    appears at :16788 (the CLI) and nowhere in the daemon arm.
    THE POSITIVE CONTROL IS THE PLAN ITSELF, because "it filed and I could not see it" and "it never
    filed" print the same absence: `grep -rl 'origin:.*ci-learning' plan/tasks.d/` must be ZERO
    before, and NON-ZERO after a driven run. A count that is zero on both sides means the test drove
    nothing.
    PROVE THE DEDUP ARM SEPARATELY. Drive the rung TWICE over the same corpus: the second run must
    file nothing and report the cause as already present. Without this, (i) ships a rung that
    re-files the same lesson four times a day, which is worse than the silence it replaces.
    PROVE THE RELEASE ARM WITH A THROWING WINDOW, and prove its MIRROR: a run that threw before work
    releases the allowance; a run that filed keeps it. A suite that only drives the happy path passes
    on an implementation that never records a fire at all, which re-opens the crash-loop.
    DO NOT REORDER THE FIRE UNCONDITIONALLY. "Fire first" guards a crash-loop re-running an expensive
    window; only a run that did NO work may release it.
    DO NOT RELEASE A DRAFT TO verify: auto here. That is a separate task under its own ruling.
