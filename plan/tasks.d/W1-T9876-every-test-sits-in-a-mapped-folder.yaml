- id: W1-T9876
  title: "NO NEW TEST LANDS DIRECTLY UNDER test/, AND THE FLAT COUNT ONLY FALLS — a placement check derived from the merge base, because git merges an in-flight flat addition cleanly (splitting a flat directory is not a directory rename); plus every folder is in the map and none is named like a rule suite (test restructure, letter F)"
  repo: remudero
  depends_on: [W1-T9874, W1-T9875, W1-T9860, W1-T9863, W1-T9864, W1-T9869, W1-T9870, W1-T9871, W1-T9872, W1-T9873]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: medium
  origin: 'operator session 2026-10-16, test/ restructure rulings 1-7 (plan/seeds/test-restructure-2026-10-16/decisions.md), plan letter F'
  plan_refs: [W1-T9874, W1-T9875, W1-T9877, W1-T9879]
  files:
    - src/lib/task-linter.ts
    - test/rules/every-test-sits-in-a-mapped-folder.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    plan/seeds/test-restructure-2026-10-16/coupling-inventory.md section F and best-practices section 4.1:
    - Splitting a flat folder into subfolders is not a directory rename, so a test added by an in-flight PR merges
      cleanly into flat test/.
    - Rust's tidy answers this with a check that fails on files appearing in the old location, plus a root count that
      only goes down.
    - Without a placement rule every minter drifts the layout back. W1-T9875 fixes the minters; this check holds the
      line.
    IN-FLIGHT TASKS: at filing, 533 open tasks exist, and many declare a new flat test/<slug>.test.ts. Refusing every
    new flat file would redden their builds, so the check derives its allowance from the plan at the merge base.
    RULE_SUITE_NAME_RE (src/lib/ci-parity.ts ~2874, /(?:census|ratchet|baseline)/i) is matched against the path after
    test/, unanchored. A folder named, for example, ci/census/ would enrol every file in it as a rule suite.
  design: |
    1. test/rules/every-test-sits-in-a-mapped-folder.test.ts, with these checks against the merge base
       (`git merge-base HEAD origin/main`, the PR base in CI; never a fixed number):
       a. No test file is ADDED directly under test/ (`git diff --diff-filter=A` at depth 1), except a path that a shard
          in the merge base's plan names and that did not yet exist. Those are legacy filings: allowed, and printed as
          debt.
       b. The flat count at head is at most the flat count at the merge base plus those legacy additions, so it only
          falls.
       c. Every directory under test/ holding *.test.ts is a folder or second-level folder in
          scripts/test-placement/subsystem-map.json, or one of helpers, setup, lib or fixtures.
       d. No folder segment matches RULE_SUITE_NAME_RE.
       e. The inspected population is > 0 and equals an independent `git ls-files` count.
       Each check is fault-injected in a fixture repo (a planted flat file; a planted test/census-x/ folder) and must go
       red.
    2. task-linter: a new check, new-shard-flat-test (block), refuses a NEW shard naming a test path directly under
       test/ that does not exist at base. Its message suggests `rmd test-place`. Existing shards are untouched; they are
       the legacy allowance in 1a.
    This file lives in test/rules/. It is placed there by design (W1-T9877 makes test/rules/ the rule-suite
    declaration), and its name avoids census|ratchet|baseline.
  acceptance:
    - claim: 'a new test added directly under test/ is refused'
      proof: 'grep: test("W1-T9876: a new flat test is refused" in test/rules/every-test-sits-in-a-mapped-folder.test.ts'
    - claim: 'a flat test named by a shard on the merge base is allowed as legacy debt'
      proof: 'grep: test("W1-T9876: a flat test named by a shard on the merge base is allowed as legacy debt" in test/rules/every-test-sits-in-a-mapped-folder.test.ts'
    - claim: 'the flat count may not rise above the merge base'
      proof: 'grep: test("W1-T9876: the flat count may not rise above the merge base" in test/rules/every-test-sits-in-a-mapped-folder.test.ts'
    - claim: 'a folder outside the map, or named like a rule suite, is refused'
      proof: 'grep: test("W1-T9876: a folder outside the map or named like a rule suite is refused" in test/rules/every-test-sits-in-a-mapped-folder.test.ts'
    - claim: 'a new shard naming a new flat test path is refused at lint'
      proof: 'grep: new-shard-flat-test in src/lib/task-linter.ts'
  falsifier: |
    On origin/main nothing stops a new flat test, and no lint check named new-shard-flat-test exists. The check file
    does not exist, so every grep misses.
