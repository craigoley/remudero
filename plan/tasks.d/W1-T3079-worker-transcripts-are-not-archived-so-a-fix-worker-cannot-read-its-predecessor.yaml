  plan_refs: ["W1-T2733", "W1-T2236", "W1-T1269", "W1-T2205"]
  status: queued
  attempts: 0
  rationale: |
    MASTER-PLAN §Self-improvement: "Transcript archive + predecessor query: every worker session
    transcript is archived per task; fix/diagnose workers may read their predecessors' transcripts
    before acting (Gas Town's 'seance' pattern, done as plain files)."

    OBSERVED at b8892bc4: `grep -rn "seance\|predecessor" src/` returns nothing relevant; no
    `archiveTranscript` or transcript store exists; `src/run-task.ts`'s `workerTranscript` is
    consumed in-run (W1-T2205 fixed its double count) and discarded with the run. The retro's
    `buildGather` parses the NDJSON ledger only. `renderFixPrompt` (`src/run-task.ts`) hands a fix
    worker exactly one evidence mode — the CI failure tail (bounded, W1-T2733), or the unmet
    criteria and gate failures, or the merge conflict — plus the declared scope. The only
    predecessor material any worker sees is the DIAGNOSE report appended verbatim on a
    diagnose-informed retry (`runDiagnoseThenRetry`), which is one path of many.

    W1-T1269 ("the fix rung retries with no test for progress") and W1-T2328 ("never asks whether
    the verdict moved") both describe strikes that repeat because nothing carries the prior attempt
    forward. Reflexion-style episodic memory (arXiv 2303.11366) and the Darwin Godel Machine's own
    self-discovered improvement — "a history of what has been tried before (and why it failed)" —
    are the published forms of the same fix.
  design: |
    (i) ARCHIVE AT `implement.done`, `diagnose.worker_done` AND EVERY FIX WORKER EXIT: write the
    joined transcript to `<config.root>/state/transcripts/<taskId>/<runId>.<rung>.md` with a
    small front-matter (run id, rung, model, verdict-so-far, head sha). Atomic write (temp +
    rename, Standing rule 23). `state/` is already the daemon's exhaust and gitignored.
    (ii) BOUND IT: keep the newest N per task (policy row, default 5) and cap each file at the
    existing `REPORT_EXCERPT_CAP`-scaled size; a reaper runs where `reapStaleWorktrees` already
    runs. Never a growth with no ceiling.
    (iii) POINT, DO NOT INJECT: `renderFixPrompt` and the diagnose prompt gain ONE line naming the
    predecessor transcript path(s) for this task and PR, newest first, with the instruction to
    read them before acting. Injecting the transcript would blow the context budget and is the
    whole-file-injection anti-pattern the learnings store already avoids; a path is retrieval.
    (iv) LEDGER ONE ROW `transcript.archived` per write (path, bytes, rung) so the retro can
    measure whether fix rungs that had a predecessor pointer strike less — the efficacy question
    is left to a later task, but its data starts now.
