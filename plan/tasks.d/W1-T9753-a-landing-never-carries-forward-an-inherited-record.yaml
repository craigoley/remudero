  title: "A LANDING NEVER CARRIES FORWARD A RECORD THE BRANCH ONLY INHERITED FROM MAIN — readBranchPending treats every ownedDir file on origin/<landing-branch> as pending, and stageBranchPending re-stages the branch's copy over main's unless it is identical or (feedback only) main's copy has lineage; so a record or shard main changed after the branch was cut is reverted by the next landing build. LIVE 2026-10-15: three landing branches carry 119 such stale copies against 14 of their own"
