  rationale: |
    READ at origin/main 3ce249c80 (src/lib/feedback-landing.ts; symbols, not lines):
    - readBranchPending lists `ls-tree -r --name-only origin/<branch>` filtered to kind.ownedDir and returns ALL of
      it as pending: the branch's own new records AND every record it merely inherited from the main it was cut
      from.
    - stageBranchPending, for each such path, skips it only when the branch blob equals origin/main's. Otherwise:
      - a feedback record whose main copy has lineage (hasFeedbackLineage: `contribution != null`) goes through
        decideFeedbackStage;
      - every other path, including a feedback record WITHOUT lineage and every non-feedback ownedDir (the
        ci-learning kind's plan/tasks.d), is staged at the BRANCH's blob, over main's newer one.
    - Both builders call it after `read-tree origin/main`: landPendingSteps (feedback, decisions) and
      landContentSteps (ci-learning via landCiLearningShards*, plan-reconcile via landPlanReconcileShards, status
      content via landFeedbackStatusContent). A branch cut before main changed a record therefore re-adds the old
      record (or a record main deleted) in the next landing tree.
