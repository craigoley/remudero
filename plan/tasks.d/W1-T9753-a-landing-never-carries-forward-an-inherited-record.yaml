  falsifier: |
    On origin/main, run the probe's shape through sweepFeedbackLanding: a landing branch cut from main at "base"
    holding its own fb-p, then main sets fb-a to accepted and deletes fb-d. The new landing tree carries fb-a: new and
    re-adds fb-d, so the first test fails. Build a ci-learning landing branch whose tip merged an older main and then
    let main change one inherited shard: landContentSteps restages the old shard, so the second test fails. Take the
    pending set from `<tip>^..<tip>` but skip the merge-base fallback: the merge commit's diff lists every inherited
    file main moved and the second test fails again.
