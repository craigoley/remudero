  design: |
    1. The pending set is what the landing commit itself changed, not everything the branch holds: a landing tip
       has a single parent, the main it was built on, so pending = `git diff --name-only -z <tip>^ <tip> --
       <ownedDir>` (adds, modifications and deletions), plus one `ls-tree -r -z <tip> -- <ownedDir>` for the blobs.
       A tip that is a merge commit (someone merged main into the branch, as ci-learning-landing at 19:38Z) or has no
       readable parent is diffed against merge-base(tip, origin/main) instead, so inherited files are never pending.
    2. stageBranchPending stages only those paths. A path main changed since the tip's base keeps main's copy unless
       the landing commit changed it too, in which case the existing feedback lineage decision (decideFeedbackStage)
       applies, and for a non-feedback path the conflict is REFUSED with the path named, never resolved silently.
    3. The same rule for every kind that carries forward: feedback, decisions, ci-learning, plan-reconcile and status
       content.
    4. Measure: the landing row gains `carried: n` and `inherited_skipped: n`, so a landing that would have reverted
       work is visible.
    5. Fix sketch is from the W1-T9638 builder; INFERRED it also drops ~420 of the ~518 git children per landing
       pass (one diff and one ls-tree instead of per-file rev-parse pairs). Update the named existing suites
       (feedback-landing-reconcile, feedback-landing's rev-parse race, deleted-ref, union-writer) to the new pending
       set; do not weaken what they assert about the branch's own records.
    No new constant.
