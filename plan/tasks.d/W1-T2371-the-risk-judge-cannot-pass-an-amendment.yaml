    MERGED 2026-08-27T10:40:07Z -- (i)/(iv)'s characterisation stands re-derived, not merely trusted.

    (xii) THE RATE IS STILL ONE OF ONE, SO THIS DISPATCH RECORDS AND STOPS. Per (vi): "if it still
    returns one id, record the new instance and stop." This amendment touches only this note --
