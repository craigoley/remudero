    (2) THE INFERENCE IS WRONG STRUCTURALLY, NOT ON THIS PR. An amendment PR edits the SHARD; it
    does not do the work the shard declares. So the declared-versus-actual comparison must always
    mismatch for the entire class. MEASURED over the full merged history: of 776 merged pull
