  falsifier: |
    Run `node scripts/learnings-budget-ratchet.mjs` on origin/main. If it reports meaningful
    headroom (enough for at least one 1,000-char entry), this finding is stale and the task closes
    with that correction recorded -- the measurement above is a point-in-time reading and the
    corpus may have been pruned since.

    Close WITHOUT raising capChars if the operator rules that the corpus should be pruned instead:
    raising the cap is the outcome this task must not assume, because the baseline's own text calls
    it "a deliberate, reviewed change" and warns against using it "to paper over an unreviewed dump
    of learnings".
