  note: |
    CRITERIA SET TO THE DELIVERED DESIGN, 2026-09-16, BEFORE THE BUILD LANDED. The first draft of
    this shard asked for a prune-or-raise decision recorded in scripts/learnings-budget-baseline.json,
    because that is what the ratchet's own remedy text offers. Measuring the corpus found a better
    answer that needs NEITHER: the injected line is `- <fact> [src: learnings#<id>]`, and on the
    longest entries the actionable rule is 7-19% of it. Splitting `fact` into an injected RULE and a
    retrieved `evidence:` field -- the treatment CLAUDE.md already has via doctrine/ and MASTER-PLAN
    via plan-index.json (W1-T2282's "RETRIEVED, not INJECTED") -- took the corpus from 41,714 to
    34,908 against an UNTOUCHED 42,000 cap. The proofs now name that design. Stated rather than
    swapped quietly: a rewritten proof is only honest when the change of design is recorded too.

    RISK:HIGH, NOT MEDIUM, and not to satisfy Rule 19's sizing check: pruning or re-capping this
    corpus changes what EVERY dispatched worker inherits. An entry retired here stops being
    injected into every task whose files: glob matched it, and the failure is silent -- a worker
    simply never learns the fact. That is blast-radius, which is what this plan's band_meaning
    measures.

    MEASURED 2026-09-16 on origin/main, `node scripts/learnings-budget-ratchet.mjs`:

        active corpus 41714 chars (cap 42000) -- 79 active / 83 total entries

    286 CHARS OF HEADROOM. A typical entry in this corpus serialises to 900-1,400 chars, so the
    corpus cannot accept ONE more lesson. The ratchet is working exactly as designed -- it goes
    CI-red rather than letting injected knowledge creep -- but the consequence is that the
    learn-from-PRs loop has nowhere to write.

    THE HEADROOM WAS PROVISIONED AND IS NOW SPENT. scripts/learnings-budget-baseline.json records
    `measuredChars: 34641` at `capturedAt: 2026-08-31` and says capChars "keeps deliberate headroom
    (42000 against a measured 34641) for near-term retro growth". That growth happened: +7,073
    chars in 16 days, and the runway is gone.

    THIS WAS FOUND BY TRYING TO USE IT. Four traps from the 2026-09-16 operator session were
    written as entries and every combination was refused -- four entries, then three, then two,
    then ONE tightened entry still overflowed by 48 chars. The session then reverted rather than
    (a) raising a cap the baseline calls "a deliberate, reviewed change", or (b) retiring another
    author's entries to make room. Both are legitimate outcomes; neither is a worker's unilateral
    call, which is why this is filed rather than built.

    THE FOUR TRAPS, so they are not lost with the attempt (each is measured, each has a falsifier):

      1. `git add -A -- test` swept a KILLED test run's leftover fixture into a commit
         (test/fixtures/live-plan-writers/wiring/tasks.d/zzz-w1-t1225-wiring-probe.yaml), reddening
         task-linter-wiring.test.ts on two PRs via a suite neither diff touched. The litter comes
         from interrupting that slow suite between its write and its cleanup.
      2. test/helpers/git-repo.ts's `gitRepo()` sets committer identity only for ITS own git calls.
         Code under test that shells `git commit` inherits the ambient env, so a fixture passes on
         darwin (identity from the OS user record) and fails on Linux CI with "empty ident name".
         NOT REPRODUCIBLE ON DARWIN -- the CI log is the evidence, not a local falsifier.
      3. A red `coverage-ratchet` is rarely a coverage threshold: it reports a failed shard,
         SUPERSEDED, or a missing artifact, and the cause underneath is usually `diff-coverage:
         BLOCKED`, which names each uncovered line. All four shards GREEN plus a red ratchet means
         superseded -- re-run the failed jobs, never push a fresh sha.
      4. Logic added INLINE inside runTask's dispatch cannot be covered (no test drives that
         function, and the process-boundary directive is for re-exec glue only). Extract it AND let
         the extracted function own its precondition, so the call site is one unconditional line.

    WHERE EACH BELONGS IS PART OF THE DECISION, not an afterthought. (3) and (4) are repo-wide and
    belong in learnings/ where `files:` matching injects them per task. (1) and (2) are traps of an
    INTERACTIVE session on a dev machine -- fleet workers run on Linux and would hit (2)
    immediately -- so they may belong in doctrine/ instead, which costs the interactive lane its
    per-session tax and costs a dispatched worker nothing (spawnWorker passes settingSources: []).
  rationale: |
    A knowledge loop that cannot record what it learns is a loop in name only. The measurements in
    this session say the rest of the machinery is healthy: retro last ran 2026-09-16T13:59Z, 69
    retro-origin shards exist, and 65 of 68 (96%) are credited as built on main. The bottleneck is
    not the trigger, not the filing, and not the build rate -- it is the write surface.

    THE HONEST COUNTERPOINT, so this is not read as bigger than it is: the corpus-wide cap is
    ORTHOGONAL to what any one session pays. `DEFAULT_KNOWLEDGE_BUDGET_CHARS` (8,148, unchanged)
    caps the matched selection a task actually injects, and `selectLearnings` only injects entries
    whose `files:` glob matches. So growing the corpus does NOT tax every run -- the cap exists to
    force curation, which means "prune" is a genuinely available answer and not merely a chore.

    The ratchet itself already names the cheapest starting point: it prints the least-evidenced
    active entries, and five of them read `cited 0x, last 2026-07-14` -- two months without a
    citation. Several are general model/tooling facts rather than repo-specific traps, which is
    what this corpus's own header says it is for ("the durable fact a worker must inherit so the
    same failure class doesn't repeat").
