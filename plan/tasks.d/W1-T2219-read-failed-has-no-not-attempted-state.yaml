    - claim: "a read still in flight is not reported as the previous attempt's verdict"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
    - claim: "asking whether a read failed does not itself perform the read"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
    - claim: "an issue-channel failure is reachable by a caller rather than only logged"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
    - claim: "a classified failure still reports exactly the reason it reports today"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
    - claim: "the blocked-pr class is still withheld when live state cannot be read"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
    - claim: "both failure steps keep logging with their classified reason"
      proof: "unit test: test/read-failed-not-attempted.test.ts"
