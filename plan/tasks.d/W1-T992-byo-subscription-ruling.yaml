    human — the operator judges rulings; isDispatchEligible parks it until then." `verify: human` is
    therefore set UP FRONT, and DECISIONS.md is KEPT in files: — dropping it to satisfy the linter
    would delete the durable home this record exists to create. RE-TAKEN AT THIS FILING: 58 of 619
    tasks are already verify:human (9%), so this joins a queue only the operator can drain. IT WILL
    NOT BE PICKED UP BY THE DRAIN.

    SECTION-CITATION CORRECTION, MADE UNDER REVIEW AND RECORDED SO IT IS NOT REVERTED. This shard
    first cited the superseded list as §6A. IT IS IN §6. Measured on this branch: MASTER-PLAN.md
    carries BOTH `## 6. Open-source packaging` and `## 6A. Open-source governance & the commercial
    boundary`, and the "Open-core stance (D-8)" bullet holding "Pro candidates (post-traction, not
