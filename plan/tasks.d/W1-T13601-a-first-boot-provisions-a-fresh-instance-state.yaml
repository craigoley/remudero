- id: W1-T13601
  title: "A first boot provisions a fresh instance's install checkout, ledger and empty inbox registry before the worker smoke"
  repo: remudero
  depends_on: [W1-T13584]
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # a new host-side script that clones and installs on the operator's host; it writes only absent paths
