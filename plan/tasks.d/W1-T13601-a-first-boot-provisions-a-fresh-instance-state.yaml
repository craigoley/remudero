  acceptance:
    - claim: "On a fresh state dir, the provisioner creates <state_dir>/daemon-install as a clean checkout of the origin it was run from, runs npm ci in it, appends one instance.provisioned row to state/ledger.ndjson, and writes state/inbox-proposals.json as {\"proposals\":[]}"
      proof: 'grep: test("W1-T13601: a fresh state dir gets its install checkout, a seeded ledger and an empty inbox registry" in test/deploy/a-first-boot-provisions-a-fresh-instance-state.test.ts'
    - claim: "recycle-container.sh --first-boot runs the provisioner before run_worker_smoke"
      proof: 'grep: provision-instance-state\.sh in deploy/recycle-container.sh'
    - claim: "invariant:provision-writes-only-absent-paths — a second run, or a run on a state dir that already holds any of the three, changes no byte of what exists and exits 0"
      proof: 'grep: test("W1-T13601: a second provision changes nothing that already exists" in test/deploy/a-first-boot-provisions-a-fresh-instance-state.test.ts'
    - claim: "A provisioner failure (clone or npm ci) refuses the first boot before the smoke, names the failed step, and leaves no half-made daemon-install behind"
      proof: 'grep: test("W1-T13601: a failed install refuses the first boot and leaves no partial checkout" in test/deploy/a-first-boot-provisions-a-fresh-instance-state.test.ts'
  rationale: |
    WHY: onboarding remudero-ops (W1-T13498, 2026-11-18) needed three hand steps on the host, each found only after a
    reader refused (OBSERVED, /mnt/project-files/ops-onboarding-20261117/first-boot-evidence-20261118.md):
      1. No <state_dir>/daemon-install: the worker smoke failed "WORKER-SMOKE FAIL ENOENT ... daemon-install/settings/worker.json"
         (src/lib/containment.ts workerSmokeMain reads the install root, which defaults to <root>/daemon-install in
         src/lib/install-root.ts). The host cloned it and ran npm ci by hand, mirroring console's plain clone.
      2. An empty state/ledger.ndjson: the rendered relauncher refused "ledger.ndjson missing or empty; wrong volume?"
         (deploy/install-host-units.sh relauncher template, the `[ ! -s "$STATE_DIR/state/ledger.ndjson" ]` guard). Only
         the rows a refused recycle wrote let the watchdog boot pass.
      3. No state/inbox-proposals.json: serve's slow lane logs read_model.slow_unit_failed for inbox:ops with ENOENT about
         once a minute (52 between 02:24Z and 03:24Z). refreshInboxClassification (src/lib/inbox-view.ts) statSyncs it for
         every non-core instance. That is the W1-T5339 contract on purpose: test "an instance producer refuses unreadable
         inputs and observes a measured empty registry" accepts empty only as a real {"proposals":[]} file. So the reader
         stays strict, and the first boot writes the measured empty registry.
    Every one of these is a healthy fresh instance, so the next onboarded repo hits all three again. --first-boot is
    already the operator's explicit word that the state dir is fresh (W1-T2555), so it is the right place to provision.
    Overlap: W1-T13584 also edits deploy/recycle-container.sh and test/recycle-container.test.ts, in
    selected_registry_diagnostic_filter only. This task adds one call before run_worker_smoke and one fixture env line,
    and depends on W1-T13584 so the two never build the same files at once.
  design: |
    New deploy/provision-instance-state.sh <state_dir>. Each step acts only when its path is absent:
    - daemon-install: `git clone` the URL from `git -C "$SCRIPT_DIR/.." remote get-url origin` into a temp dir beside the
      target, check out origin's default branch, run `npm ci`, then rename it into place. On any failure remove the temp
      dir, print "provision-instance-state: REFUSING — <step> failed" and exit 1. Never print the remote URL (it may hold
      a credential): print only the step name.
    - state/ledger.ndjson: when absent or zero-length, append one JSON row
      {"ts":<UTC ISO>,"step":"instance.provisioned","outcome":"ok","run_id":"PROVISION-<epoch>"}.
    - state/inbox-proposals.json: when absent, write {"proposals":[]} plus a newline.
    Files are created with the state dir's owner (chown --reference=<state_dir>/state when run as root).
    recycle-container.sh: when FIRST_BOOT=1, run the provisioner on STATE_DIR before the first run_worker_smoke, behind the
    seam RMD_RECYCLE_PROVISION (default 1). A non-zero exit refuses the recycle with the provisioner's step in the reason.
    test/recycle-container.test.ts sets RMD_RECYCLE_PROVISION: "0" in its shared fixture env, next to GH_TOKEN: "", because
    that suite runs every test on the first-boot path and must not clone or install.
    The new suite drives the provisioner against a local bare repo as origin and a stub npm on PATH that records its argv.
    INVARIANT provision-writes-only-absent-paths: an existing daemon-install, a non-empty ledger and an existing registry are
    never opened for writing, moved or removed, whatever their content.
  falsifier: |
    Delete the registry step: the first test fails on the missing inbox-proposals.json. Make the ledger step write
    unconditionally: the second test fails on a changed ledger byte count. Make the stub npm exit 1: the third test passes
    only while the temp-dir cleanup is in place, so deleting the cleanup fails it on a leftover directory.
