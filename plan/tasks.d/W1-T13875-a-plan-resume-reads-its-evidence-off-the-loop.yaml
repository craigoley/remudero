- id: W1-T13875
  title: "A product plan resume reads its operation's ledger evidence off serve's loop, within a bound, and never for a refused hand-off, so \"Resume saved plan\" stops freezing serve while every archive since the plan's request is read under the journal lock"
  repo: remudero
  depends_on: []
  priority: 0
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # what a plan operation's state reads as while its evidence is unread: unknown, never refused or proposed
  band_meaning: span
