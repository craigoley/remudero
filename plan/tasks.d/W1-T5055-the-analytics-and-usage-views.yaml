  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-10-01: the analytics refresh is p50 8 s, p90 49 s and max 90 s for core. The console merges
    instances itself (aggregateOverview), reading 1 + 3N routes per page, and /fleet reads usage separately.
    D10: analytics is NOT re-derived from facts in Phase 4; its output persists in the read model instead.
  design: |
    The slow lane (P4-T04) runs the existing refresh (code unchanged, moved threads) per instance and writes
    source_snapshot(instance, name, as_of, body) for console-v1, signals and usage-v1. analytics merges every
    instance's snapshot in core; usage carries the usage-v1 numbers /fleet needs. Both answer from the
    persisted rows after a restart. nav-badge-view.ts reads the worker's own row and nav-badge-sources.json is
    retired. Sources: analytics:<i>. Register both in read-model-worker.ts.
    Use the existing SQLite adapter and fenced writer transaction for the source_snapshot schema;
    publish a complete producer snapshot and its original source timestamp together. A failed refresh
    retains the last committed snapshot with visible stale/unavailable source evidence, not fresh zeros.
    Keep refresh work off serve's event loop and prove worker restart, lost writer lease, interrupted
    commit, and mixed-instance incomplete-source behavior. Merge ratios from matching numerators and
    denominators; never average instance quantiles. Do not activate console consumers until the merged
    serve generation advertises and serves the contract.
  acceptance:
    - claim: "the analytics view merges every instance snapshot"
      proof: 'grep: test("W1-T5055: the analytics view merges every instance snapshot" in test/analytics-view.test.ts'
    - claim: "after a restart the analytics view answers from the persisted source snapshot"
      proof: 'grep: test("W1-T5055: after a restart the analytics view answers from the persisted source snapshot" in test/analytics-view.test.ts'
    - claim: "the worker registers the analytics view"
      proof: 'grep: createAnalyticsView( in src/lib/read-model-worker.ts'
  falsifier: |
    Keep the snapshot in memory only: a restarted worker answers nothing until a refresh and the second proof
    fails. Serve core's snapshot alone: the merge proof misses the second instance.
