  title: "THE ANALYTICS REFRESH RUNS P90 49 S ON SERVE AND THE CONSOLE MERGES INSTANCES ITSELF — move the refresh to the slow lane, persist each instance's output as a source_snapshot row, and serve analytics (merged across instances) and usage views from it; the worker reads its own row instead of nav-badge-sources.json"
