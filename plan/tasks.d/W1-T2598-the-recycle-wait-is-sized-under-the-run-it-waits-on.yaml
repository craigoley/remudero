- id: W1-T2598
  title: "THE RECYCLE'S BOUNDED WAIT DEFAULTS TO 120s AGAINST A POPULATION WHOSE MEDIAN IS 1158s, SO IT REFUSES ON HEALTHY IN-FLIGHT WORK BY CONSTRUCTION — and the correct derivation is already in the SAME FILE twenty lines below, applied to a different constant (`HUNG_WORKER_AGE_S`, from 115 `implement.done` rows: 19.3 min median, 36.0 p90, 46.7 p95, 98.5 max), so `deploy/recycle-container.sh` refuses roughly ten times too early while carrying, verbatim, the numbers that say it will"
  repo: remudero
