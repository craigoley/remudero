      proof: "unit test: test/the-recycle-wait-is-sized-under-the-run-it-waits-on.test.ts"
    - claim: "restoring the 120 literal makes a healthy run at the observed median refuse again — the falsifier is load-bearing"
      proof: "unit test: test/the-recycle-wait-is-sized-under-the-run-it-waits-on.test.ts"
