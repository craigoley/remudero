  note: |
    `risk: high` IS RULE 19's SPAN, NOT THE BLAST RADIUS, AND IT WAS SET FROM THE LINTER RATHER
    THAN GUESSED. `sizingViolation` (`src/lib/task-linter.ts`) exempts `risk: high` outright and
    otherwise blocks at two or more concerns; this `files:` list spans the retro library, the CLI
    I/O layer and a new test. The verification is recorded with this filing: the same shard at
    `risk: medium` draws the sizing block naming those concerns, and at `risk: high` it clears.
    The real radius is one refusal branch on a path that today has none.

    WHAT MUST NOT CHANGE, STATED SO A BUILDER CANNOT DRIFT INTO IT. The stamper's output format is
    fixed: two lines, `cited:` and `cited_count:`, surgical, never a whole-document YAML
    re-serialize — #2599's own doc gives the reason (a round-trip reflows every other entry's
    `fact: >-` and `files: [...]` into a noisy whole-file diff every cycle). The Law-5-equivalent
    holds: this pass proposes and stamps, it never files a task, mints an id, or promotes,
    retires or adds an entry from a metric. And the operator gate is untouched — this adds a
    refusal inside an existing pass, no new verb, no new arming path, no new merge authority.

    THE ID WAS PRE-MINTED AND READ BACK BEFORE ANYTHING WAS WRITTEN. Eight surfaces were swept,
    each against a control pre-qualified for THAT surface, under the rule that a surface whose own
    control reads zero is DISQUALIFIED rather than used to license the target's zero. Reservation
    ref present against a 297-ref namespace and an absent-id control at 0; shard filename 0, plan
    `- id:` lines 0, any tracked mention 0 — those three against W1-T1248 at 1, 1 and 6; live
    `run-W1-T1267-*` heads 0 against an 84-branch `run-*` namespace; merged trailers 0 and merged
    subjects 0, both against W1-T1248 at 3 — a control that reads non-zero on those two surfaces
    ONLY because #2599 merged during this session, and which would have had to be disqualified an
    hour earlier. No surface was disqualified. Surface eight is a count-per-head sweep of 91 open
    heads read through git objects, 0, with a positive control finding a known id on the densest
    head.

    THE HISTORY QUERIES REQUIRE AN UNSHALLOW AND `src/run-task.ts` CANNOT BE READ THROUGH THE
    CONTENTS API. Both are recorded because each returns a clean, passing-looking wrong answer:
    a shallow clone answers history queries from a horizon that may postdate the evidence, and
    `src/run-task.ts` is over GitHub's 1 MB contents cap and comes back empty, greping to zero at
    every ref including main. Everything above was read from a worktree with `HEAD == origin/main`
    proven equal, through git objects and the local filesystem.
