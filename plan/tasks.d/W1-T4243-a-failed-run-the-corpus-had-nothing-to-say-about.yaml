- id: W1-T4243
  title: "NOTHING MEASURES WHERE THE KNOWLEDGE CORPUS IS SILENT — a run that fails after `selectLearnings` matched zero entries is a knowledge gap the ledger already records and no reader counts; report the miss rate on failed vs clean runs by code area so the next distillation targets where the corpus is blind, without filing anything"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  band_meaning: span
  origin: "research:agent-memory-scan-2026-09-23"
  plan_refs: ["§4E", W1-T4014, W1-T4015, W1-T419, W1-T4241]
  files:
    - src/lib/knowledge-gaps.ts
    - src/lib/digest.ts
    - test/a-failed-run-the-corpus-had-nothing-to-say-about-is-counted.test.ts
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at origin/main f0e1fc43: every implement run writes `learnings.injected` with
    `matched` / `matched_ids` / `dropped` (src/run-task.ts, W1-T419), and every run ends in a
    `verdict` row carrying the same `run_id` (src/lib/ledger.ts). A grep of src/lib/retro.ts,
    digest.ts, measurement-cadence.ts and knowledge-gardener.ts, and of plan/tasks.d, finds no
    reader that asks the complementary question: which failed runs had ZERO matched learnings,
    and in which part of the code do they cluster.

    EXTERNAL PATTERN (research:agent-memory-scan-2026-09-23): Brainfish's knowledge base treats
    "failed searches and content gaps" as the authoring backlog (vendor claim; unverified beyond
    their product pages), and Karpathy's LLM-wiki lint lists "concepts mentioned but lacking
    pages". The shared idea is that a memory system should measure its misses, not only its hits.
    This repo's miners (ci-failure-corpus, the retro's procedural candidates) all start from
    FAILURES; none starts from the corpus's SILENCE.

    WHY A RATE AND NOT A COUNT: a zero-match run proves nothing alone. Some areas legitimately have
    no lessons yet. The signal is a zero-match rate that is higher on non-clean runs than on clean
    runs in the same area. If the two rates are equal, coverage is not associated with failure
    there, and the report must say that instead of ranking the area.

    WHY IT FILES NOTHING (W1-T4014): the learning loop already produces about 7 proposals a day and
    releases 0. Another producer would deepen that queue. This task produces a measurement an
    operator, W1-T4015's corpus selection, or a later retro can read. Turning it into filed work
    waits on W1-T4014's release path.
  design: |
    (i) A PURE fold in a new src/lib/knowledge-gaps.ts over ledger-union rows (src/lib/ledger-union.ts;
        report the union's covered window): join `learnings.injected` to the run's terminal
        `verdict` by `run_id`, and classify each run as clean (the retro's `clean_single_strike`
        definition: merged with zero `fix.dispatch`) or not clean. Masked wipe-test arms and
        verdict-less runs are excluded and counted.
    (ii) Key each run by code AREA: the first two path segments of each file in the task's `files:`
        (for example `src/lib`, `scripts`, `plan/tasks.d`). A multi-area task counts once per area.
    (iii) Per area, emit n_clean, n_failed, the zero-match rate in each, and a verdict: `blind`
        (failed-run miss rate exceeds the clean-run miss rate by a named margin with n_failed at
        or above a named floor), `covered`, `no-association`, or `unmeasurable` below the floor.
    (iv) src/lib/digest.ts renders the `blind` areas, highest failed-run miss count first, each with
        its counts and window. Nothing is filed, and no learning is written.
  acceptance:
    - claim: "a failed run whose injected row matched zero learnings is counted as a miss in every area its task files touch"
      proof: "unit test: W1-T4243: a failed zero-match run is a miss in every area it touches"
    - claim: "an area whose zero-match rate is equal on clean and failed runs reads no-association, not blind"
      proof: "unit test: W1-T4243: equal miss rates on clean and failed runs read no-association"
    - claim: "masked arms and verdict-less runs are excluded and counted, and below the floor the area reads unmeasurable"
      proof: "unit test: W1-T4243: masked and verdict-less runs are excluded and counted"
    - claim: "the gap fold is exported"
      proof: "grep: export function foldKnowledgeGaps( in src/lib/knowledge-gaps.ts"
    - claim: "the digest calls the gap fold"
      proof: "grep: foldKnowledgeGaps( in src/lib/digest.ts"
  falsifier: |
    Rank areas by raw zero-match count and an area where every run, clean or failed, matches
    nothing must be wrongly reported `blind`; the no-association test must catch it. Count a
    masked arm-B run (learnings deliberately removed) as a miss and the exclusion test must fail.
  note: "Measurement only. The companion W1-T4241 asks whether the knowledge we have helps; this asks where we have none."
