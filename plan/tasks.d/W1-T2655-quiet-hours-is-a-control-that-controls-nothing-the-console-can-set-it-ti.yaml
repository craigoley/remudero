      proof: "unit test: test/quiet-hours-dispatch-gate.test.ts"
    - claim: "with no quiet-hours hold the tick is byte-identical to today — same dispatch, no deferral, no extra ledger row — so the recorded RUN-FREE posture and G-14's default-OFF are untouched by this task existing"
      proof: "unit test: test/quiet-hours-dispatch-gate.test.ts"
    - claim: "a quiet-hours hold NAMES itself — its own verdict kind, its own payload and its own ledger step — and is never rendered as a cost, queue, memory or unreadable deferral, and never as `daemon.pause`"
      proof: "unit test: test/quiet-hours-dispatch-gate.test.ts"
    - claim: "an unreadable quiet-hours read ADMITS the dispatch (fail-open, the memory-governor arm's polarity), so a preference flag that cannot be read can never silently halt the fleet — the falsifier being a fail-closed arm that converts one filesystem hiccup into a fleet-wide hold"
      proof: "unit test: test/quiet-hours-dispatch-gate.test.ts"
    - claim: "a quiet-hours hold never routes through the pause path — `checkPause`, `checkStop` and the sweep gating are unchanged, and an in-flight run reaches its verdict exactly as before"
      proof: "unit test: test/daemon.test.ts"
    - claim: "the gate is WIRED at the real `rmd daemon` call site — an unwired gate is an unbuilt one (the W1-T51 drift class this plan has already paid for once)"
      proof: "grep: checkQuietHours in src/run-task.ts"
    - claim: "the status board's QUIET_HOURS latch row states the SHIPPED consequence, not the stale 'a future scheduler consumer reads'"
      proof: "unit test: test/status-board.test.ts"
    - claim: "fleet-control.ts's module doc no longer describes the consumer as later work and names the module that reads the flag"
      proof: "grep: dispatch-governor in src/lib/fleet-control.ts"
