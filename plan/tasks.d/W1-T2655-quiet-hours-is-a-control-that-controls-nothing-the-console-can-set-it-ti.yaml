  note: |
    RATIFIED 2026-09-01 from the W1-T2519 follow-up harvest (run W1-T2519-1788196324559, PR #3419),
    REDIRECTED at ratification rather than taken verbatim. The follow-up asked for
    `deps.checkPause`; that route is genuinely free of `daemon.ts` edits (W1-T2519 made the halt
    content-agnostic) and genuinely halts drainage, because `checkPause` `continue`s the tick before
    the sweep. The redirection is recorded rather than silently applied: the ASK (quiet hours must
    finally gate something) is honoured in full; the MECHANISM moves to the dispatch-governor seam so
    the gate cannot strand a mergeable PR. Cost of the redirect, stated: `daemon.ts` does change (a dep
    declaration and a log arm), so the follow-up's "zero further daemon.ts changes" property is
    deliberately spent.
    RULE 19 — RE-RISK TO HIGH, NOT DECOMPOSE, on the merits (the W1-T240/W1-T250/W1-T253 atomic-coupling
    exit). The files span dispatch-governor, daemon, run-task, fleet-control and status-board, but the
    acceptance asserts ONE invariant — quiet hours defers dispatch, only dispatch, and every surface
    that states its consequence says so — and that invariant is UNSATISFIABLE PIECEWISE: a gate arm with
    no wiring is unbuilt by this repo's own measured precedent (W1-T51 shipped `shippedSince` and it sat
    unplugged for weeks while the defect it fixed kept happening), wiring with no arm has nothing to
    call, and a consequence string edited alone would describe behaviour that does not exist. risk:high
    also reflects the real failure direction: this adds a gate to the autonomous dispatch path, where a
    fail-closed mistake is a silently halted fleet — which is exactly why criterion 4 (fail-OPEN) and
    criterion 2 (byte-identical when absent) are load-bearing rather than defensive.
    depends_on IS DELIBERATELY EMPTY. Every prerequisite is already on main and was read at source
    before filing: `dispatch-governor.ts` with its two call sites and shared payload, `isQuietHours` /
    `quietHoursFilePath` (fleet-control.ts:51-53, :116-118), the `POST /v1/quiet-hours` route and the
    control-status read-back (panel-actions.ts:461-470, :374), and status-board's latch table row
    (:1207-1210). W1-T121 is cited for its DOCTRINE, never depended on — the governor asymmetry this
    task obeys is already written into `checkCostGovernor`/`checkQueueGovernor`'s live contracts, so a
    hard edge onto an unbuilt task would strand this one for a property that already holds (the same
    judgement recorded on W1-T177/W1-T178).
    NOT A RE-DECISION OF THE OVERNIGHT POSTURE. DECISIONS.md's RUN-FREE entry is preserved by
    construction: this host carries no `state/QUIET_HOURS` marker, and criterion 2 makes an absent
    marker byte-identical. What the entry records as an admitted gap — "not yet an enforced control" —
    is what this closes. Turning the toggle ON remains the operator's deliberate act, and G-14's
    "quiet-hours optional/off, Pause in the control set" is untouched: Pause is still the emergency
    hold, quiet hours is now an intake throttle.
    NAMED SUCCESSOR, NOT FOLDED IN: a quiet-hours TIME WINDOW (a schedule rather than a boolean latch —
    §9's wizard gathers quiet hours as a per-instance operator param) belongs in `plan/policy.yaml` under
    P37's bounded-policy discipline and is a separate filing. Whether to file it is the operator's call
    and is deliberately not smuggled into this ratification.
