- id: W1-T2655
  title: "QUIET_HOURS IS A CONTROL THAT CONTROLS NOTHING — the console can set it (tier:middle), the board renders it, and NO dispatch path reads it; wire it as a DISPATCH-DEFERRAL governor arm (never `checkPause`, which halts drainage too), fail-OPEN on an unreadable read, and byte-identical with the flag absent"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  rationale: |
    VERIFIED AT SOURCE 2026-09-01, and the shape of the defect is a LIVE, REACHABLE, ARMED-LOOKING
    CONTROL THAT CHANGES NOTHING. `state/QUIET_HOURS` is writable from the console today —
    `panel-actions.ts:461-470` mounts `POST /v1/quiet-hours` at `tier: "middle"` ("an operator
    preference that changes fleet behaviour", W1-T2277 cites it as exactly that precedent) — and
    `panel-actions.ts:374` reports `quietHours` back on `GET /v1/control/status` so the shell renders
    its button state from real flag files (W1-T153's read-back rule). But `grep isQuietHours src/`
    returns THREE consumers and none of them is a dispatch path: the panel route that writes it, the
    control-status route that reports it, and `status-board.ts:1208-1210`, whose latch row states the
    consequence out loud — "quiet-hours preference is set (an optional throttle a future scheduler
    consumer reads)". `fleet-control.ts:22-29` says the same in the module doc: the flag exists, "the
    scheduler that reads it to throttle spawns is later work". `src/lib/daemon.ts` and `src/run-task.ts`
    contain ZERO references to it. So an operator can toggle a middle-tier control, watch the board
    confirm it is set, and have nothing whatsoever happen — the wrong-affordance class W1-T182 removes
    from NEEDS ME (an action offered that the backend will not honour), here with the affordance
    working and the BEHAVIOUR missing.
    THE STANDING RECORD ALREADY NAMES THE GAP RATHER THAN CONTRADICTING THE FIX. DECISIONS.md's
    overnight-posture entry is unusually careful about this: "NOTE from source (lib/fleet-control.ts:24):
    `setQuietHours` 'only flips the flag a future consumer reads' — nothing consumes it today, so quiet
    hours is currently a no-op in either position. The posture is recorded as intent; it is not yet an
    enforced control." The recorded posture is RUN FREE with the flag ABSENT, and G-14 (§9) fixes quiet
    hours as "optional/off" with "Pause (drain-and-hold) in the control set" as the real hold. Both
    survive this task untouched, because the flag stays default-OFF and an absent marker must leave a
    tick byte-identical — that is criterion 2, not a hope.
    THE FOLLOW-UP'S CHEAP ROUTE IS REAL, AND THIS CANDIDATE REJECTS IT ON EVIDENCE. W1-T2519/#3419
    genuinely did make the halt content-agnostic: `daemon.ts:1852` reads `deps.checkStop?.() ??
    deps.checkPause?.()` and logs whatever truthy string it gets, so folding quiet hours into
    `checkPause`'s supplier (`run-task.ts:22665`, `checkSharedPause`) would light the whole daemon up
    with ZERO further `daemon.ts` edits. It would also be wrong. `checkPause` is read at
    `daemon.ts:2874-2880` and `continue`s the tick BEFORE `runGatedSweep` (`:2907`, `:2966`), so a
    "quiet" daemon performs no sweep, arms no mergeable PR, runs no fix rung and files no escalation —
    a green PR would sit unmerged for the whole window. That is precisely the asymmetry W1-T121 exists
    to defend ("flow control throttles intake, never drainage") and which the two governors already
    state in their own contracts, verbatim, twice: "Never consulted from `deps.sweep`/`deps.sweepLight`
    — drainage of already-open PRs is a separate code path this predicate is never wired into"
    (`daemon.ts:1081-1083`, `:1128-1129`). A schedule preference must not be able to strand in-flight
    drainage; "stranding in-flight work to save money is a worse failure than the spend itself" is the
    same ruling one motive over.
    THE RIGHT HOME ALREADY EXISTS AND NEEDS NO NEW DOCTRINE. `src/lib/dispatch-governor.ts`'s
    `checkDispatchGovernors` is a pure, filesystem-free module with a discriminated
    `DispatchGovernorVerdict` (`cost` | `queue` | `memory` | `unreadable`), a shared
    `governorDeferPayload`, and TWO call sites per tick (tick-top and immediately before `runOne`,
    W1-T342) — consulted by `runDaemon` and `runDrainLanes` alike so one rule lives in one place. A
    deferral there is an in-process idle heartbeat that resumes on its own, dispatch-only by
    construction. Quiet hours is a fourth arm of that gate, not a fourth kind of hold.
  design: |
    ONE ARM, ONE HOME, WIRED AT ONE CALL SITE. VERIFY every reference below from source before
    editing — this note is a 2026-09-01 survey and line numbers drift.
    (i) THE GATE ARM. `dispatch-governor.ts` gains `checkQuietHours?: () => QuietHoursHoldResult |
        undefined` on `DispatchGovernorDeps` and a `{ kind: "quiet_hours"; result }` member of
        `DispatchGovernorVerdict`, with its own `governorDeferPayload` branch. It is consulted in the
        same chain as the existing arms, so both existing call sites (tick-top and pre-dispatch) and
        both callers (`runDaemon`, `runDrainLanes`) inherit it with no second predicate anywhere —
        the module's own "two copies of one rule is a defect this repo has paid for twice".
    (ii) FAIL **OPEN**, DELIBERATELY INVERTING COST/QUEUE. A throw from `checkQuietHours` is caught and
        DISCARDED — it never becomes `{kind: "unreadable"}` — falling through exactly as an admitting
        reading would, mirroring `checkMemoryGovernor`'s arm verbatim and `escalate.ts:571-573`'s AWAY
        flag ("a corrupt/unreadable state dir still fails to the SAFE default … never silently goes
        quiet"). Cost and queue fail closed because unbounded spend and unbounded WIP are worse than
        one held dispatch; here the worse outcome is a preference flag no one can read silently
        halting the fleet, which is the W1-T197 relaunch-storm/W1-T249 lesson applied to a toggle.
    (iii) THE DAEMON SIDE IS A LOG ARM AND A DEP DECLARATION, NOTHING ELSE. `DaemonDeps` declares
        `checkQuietHours?` (optional — omitted, dispatch behaves exactly as before, the contract every
        other guard in that file carries) and `logDispatchGovernorDefer` gains a `quiet_hours` branch
        emitting `daemon.quiet_hours`. NO new `continue`, no new stop reason, no touch to `checkPause`,
        `checkStop` or the sweep. The idle heartbeat and the resume-on-its-own behaviour come free from
        the existing deferral shape.
    (iv) THE WIRING. `run-task.ts`'s `rmd daemon` call site supplies
        `checkQuietHours: () => isQuietHours(config.root) ? {…} : undefined`, ledgering the deferral
        beside the existing `logCostGovernorDeferral`/`logQueueGovernorDeferral` pattern. The `rmd drain`
        call site is DELIBERATELY NOT WIRED: an operator who typed `rmd drain` has asked explicitly, and
        an unsupplied optional dep is a provable no-op. Whether to wire it later is a one-line decision,
        recorded here rather than smuggled in.
    (v) NAME THE BLOCKER (W1-T186). The verdict kind, the payload and the ledger row all say quiet
        hours. A quiet-hours hold must never render as a cost, queue or memory deferral, and never as
        `daemon.pause` — an operator reading the row must not have to guess which control halted them.
    (vi) THE CONSEQUENCE STRINGS ARE PART OF THE DELIVERABLE, NOT DECORATION. `status-board.ts`'s
        `QUIET_HOURS` latch row and `fleet-control.ts`'s module doc both currently assert the flag is
        inert; the moment this ships, both are false, and a board that describes a live control as
        dormant is the W1-T262/W1-T279 honesty defect on the very surface built to end it. The board row
        states what actually happens (new dispatch deferred; drainage unaffected; in-flight completes),
        and the module doc names `dispatch-governor.ts` as the consumer so the next reader is not sent
        looking for a scheduler that never existed.
    (vii) REACH IS INHERITED, NOT EXTENDED. The tick-top gate already governs the retro rung, the
        auto-triage rung, pending kicks and `nextRunnable`; quiet hours gets exactly that reach — no
        more, no less, and no carve-out invented here. An operator who wants a kick honoured turns the
        toggle off, which is one already-shipped console action.
    (viii) OUT OF SCOPE, STATED SO NOTHING IS ORPHANED: no time-window SCHEDULE (the flag is a boolean
        latch today; a windowed schedule is policy data under P37's `plan/policy.yaml` and is a separate
        filing); no change to escalation DELIVERY or notification quieting (that is the AWAY flag and
        P34 clause (e)/W1-T251 — quiet hours means "do not spend", away mode means "do not wake me", and
        conflating them is how one control ends up doing two jobs badly); no change to STOP, PAUSE,
        `checkSharedPause`, or the sweep.
  acceptance:
