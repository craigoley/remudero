- id: W1-T3879
  title: "FOLLOW UP WITHOUT BECOMING NOISE — durable proactive reminders with freshness, quiet hours, deduplication, and human stop controls"
  repo: remudero
  depends_on: ["W1-T3855", "W1-T3878"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  risk: high
  band_meaning: blast-radius
  origin: "research:instinct-automation-2026-09-20"
  plan_refs: ["§Self-improvement", "W1-T3855", "W1-T3878"]
  files:
    - src/lib/follow-up-policy.ts
    - src/lib/operator-agent.ts
    - src/lib/ledger.ts
    - test/follow-up-policy-source.test.ts
    - test/follow-up-policy-stale.test.ts
    - test/follow-up-policy-deduplication.test.ts
    - test/follow-up-policy-stops.test.ts
    - test/follow-up-policy-delivery.test.ts
    - openapi/daemon.yaml
  status: merged
  attempts: 0
  rationale: |
    Instinct's reported magic is not only completing a request; it notices dropped threads and
    returns to them. RMD should offer the same continuity for workstreams and experiments, but a
    proactive system must make the trigger, reason, freshness, and next decision visible. A timer
    that merely sends more messages would erode trust and create duplicate side effects.

    Follow-up belongs in the durable core so CLI, console, and future messaging channels share one
    policy and one receipt. It must remain a nudge or a human handoff unless the delegation profile
    explicitly authorizes the next bounded action.
  design: |
    Add `follow-up-policy-v1` and a ledgered state machine with `scheduled`, `eligible`, `snoozed`,
    `suppressed`, `asked`, `accepted`, `rejected`, `expired`, and `blocked` states. Each candidate
    names the source event, workstream, reason for contact, freshness, deadline or dependency,
    quiet-hour policy, deduplication key, maximum attempts, owner, and the exact next action or
    question. The evaluator must refuse stale or unavailable sources and must not re-arm a candidate
    from an already terminal receipt.

    A human can snooze, reject, revoke, or change the notification policy. Follow-up receipts record
    whether the user answered, whether the system acted, and which authority permitted that action;
    they never imply completion merely because a message was delivered.
  acceptance:
    - claim: "a follow-up names its source event, reason, freshness, deadline or dependency, deduplication key, and next decision"
      proof: "unit test: test/follow-up-policy-source.test.ts"
    - claim: "stale, unavailable, expired, and terminal sources suppress follow-up instead of generating a healthy reminder"
      proof: "unit test: test/follow-up-policy-stale.test.ts"
    - claim: "duplicate candidates coalesce by a durable key and never repeat a terminal side effect"
      proof: "unit test: test/follow-up-policy-deduplication.test.ts"
    - claim: "snooze, reject, revoke, quiet hours, and maximum-attempt controls survive restart from ledgered state"
      proof: "unit test: test/follow-up-policy-stops.test.ts"
    - claim: "a delivered reminder is not rendered as completed work or permission to act"
      proof: "unit test: test/follow-up-policy-delivery.test.ts"
    - claim: "the operator-agent execution path calls the durable follow-up policy module"
      proof: "grep: evaluateFollowUpPolicy( in src/lib/operator-agent.ts"
  falsifier: |
    Send a reminder from stale evidence, re-arm a terminal candidate, ignore quiet hours or revoke,
    duplicate an in-flight candidate, or treat delivery as completion. The affected proof must fail.
  note: "This task owns proactive continuity, not a channel-specific UI or autonomous production action. reservation hand-off: unknown -> run-W1-T3878-1789934131000"
