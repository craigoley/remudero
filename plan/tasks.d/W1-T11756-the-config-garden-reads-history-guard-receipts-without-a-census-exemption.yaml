  design: |
    Include review.history_guarded in CONFIG_GARDEN_LEDGER_STEPS, using the
    previously approved catalog solution. Remove only its unapproved EXEMPT
    entry from the priced-step census. Keep the history-guard receipt itself.
    Add a contained retention control inside the existing census test file:
    invoke the actual config-garden bounded-reader adapter with a deterministic
    reader, verify its requested step set retains the receipt, and retain all
    existing census assertions. Run the whole existing census file as well.
    Remove only the unsupported empty-history fake from the failure-only
    two-readers invocation and run its full existing test file.
    Accept the provider-exclusion fixture's existing empty-history response only
    after paired controls establish: the original fixture passes on unchanged
    pre-S1 main, current source with that response removed fails on the new
    history request, and restored current source passes. Preserve exact base,
    source and fixture blobs, physical file lists and terminal TAP summaries.
    Use pre-S1 main parent 0fe464d92da75308ab7e014856f603d0cdbd775d as the
    initial control candidate; verify its identity and fixture before execution.
    Run those paired controls on the same Azure platform with normal test setup.
    S6's Mac related run on private 573af23a observed a separate synthetic-keychain
    failure in this file's overflow-fallback criterion 1; its owner is running the
    unchanged-base control. That does not prove or disprove criterion 2's history
    regression. Preserve it as a distinct environment/baseline observation, and do
    not alter credentials, platform guards or skip a test to manufacture green.
    The historical-step test-input exception is the gardener historical-step fixture:
    preserve its historical baseline array, titles, duplicate and prefix assertions,
    and extend only its first strict expected set by review.history_guarded. Same-
    Azure unchanged-base controls at 1e8c43d452cc pass 2/2; the unchanged fixture
    against the approved catalog addition fails 1/2 solely on that new step.
    The inventory corpus exception appends exactly one call after every existing
    corpus row: fallback(["review.history_guarded"], "pr_url", 400). Use the existing
    PR-URL fallback helper, not a fabricated paid cost. Every old corpus row,
    timestamp and token-call value stays unchanged; retain every assertion and
    expected value, title, timeout and skip in the existing inventory test.
    Preserve every other existing assertion, expected value, timeout, skip and
    unrelated fake response in all files. If controls do not justify the adapter, restore
    its prior fixture; never silently ratify it or weaken a check to force green.
    A red or unreadable control requires an honest disposition and normal gates.
    No new store, fixed threshold, exemption, allowance or scanner exclusion.
