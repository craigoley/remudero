      proof: "unit test: test/an-absent-verdict-is-not-permission-to-merge.test.ts"
    - claim: "a capped review.posted row at the exact task+head still refuses, so the fix is not a blanket refusal that would have passed anyway"
      proof: "unit test: test/an-absent-verdict-is-not-permission-to-merge.test.ts"
