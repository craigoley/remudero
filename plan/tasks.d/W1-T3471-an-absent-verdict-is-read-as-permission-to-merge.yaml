      proof: "unit test: test/an-absent-verdict-is-not-permission-to-merge.test.ts"
    - claim: "an archive lookup that is unavailable or throws keeps today's fail-open, because an unreadable corpus is not evidence of absence"
      proof: "unit test: test/an-absent-verdict-is-not-permission-to-merge.test.ts"
