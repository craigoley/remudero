  rationale: |
    src/lib/deployer.ts decideDeployTrigger: the automatic image recycle (operator ruling
    2026-09-22) requires imagePublished === true but is guarded by !autoMode; with state/DEPLOY_AUTO
    set, image drift reaches the bare 'auto mode' return with no publication check, so such a host
    can recycle while acr-build is still running and restart onto the old :latest image, spending a
    recycle and a health check for nothing.
  design: |
    Apply the same published-image requirement to auto mode when the staleness is image drift: auto
    mode waits for the build exactly like the default fleet, and still deploys immediately for
    mounted-source staleness.
