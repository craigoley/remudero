      proof: "grep: W1-T14208 criterion 2: in test/a-codex-call-names-the-model-of-its-final-turn.test.ts"
    - claim: "An attempt that ends before finish() (output limit or clock bound) applies the same rule to the turn in progress: observedServedModel names a reroute of that turn only"
      proof: "grep: W1-T14208 criterion 3: in test/a-codex-call-names-the-model-of-its-final-turn.test.ts"
  rationale: |
    WHY: W1-T13868 (#19801, on main) records the model codex says served a call. codex 0.152.0 streams a
    reroute only when the served model differs from the request, at most one per turn (the comment at
    src/lib/worker-provider.ts lines 2284-2290). A turn with no reroute names no model. So when an earlier turn
    was rerouted and the final turn was not, the row names a model that did not serve the final answer.
    READ at origin/main f80f72841 (src/lib/worker-provider.ts):
    - codexServedModel (lines 2294-2300) returns the latest name in reroutes, whatever turn it came from, and
      its doc says that name "served the turn that produced the attempt's final answer". That holds only when
      the final turn was rerouted.
    - The accumulator pushes each reroute target and each event.model name into one list with no turn (lines
      2766-2774, 3105-3112), while turn.started counts turns (line 3091).
    - Callers: the spawn's result (line 6980) and observedServedModel for an attempt that ends early (line 2768).
    OBSERVED 2026-11-21: Codex-protocol streams have more than one turn. A fix.done row at 18:46Z (W1-T14166,
    provider cash, model gpt-6-luna) has num_turns 5 and served_model gpt-6-luna-2026-09-22. No live row shows
    a mixed reroute; this is read from the code, so the priority is low.
  design: |
    INVARIANT served-model-is-final-turn: servedModel is a name observed in the final turn, or null with
    CODEX_SERVED_MODEL_REASON.
    1. The accumulator keeps the turn number with each observed name (the value of numTurns when it is seen),
       within the existing CODEX_REROUTES_KEPT bound.
    2. codexServedModel takes those entries and the final turn number, and returns the latest name whose turn is
       the final turn, else null with CODEX_SERVED_MODEL_REASON. The parsed result's reroutes field keeps its
       shape for any other reader, or the change updates that reader in the same file.
    3. observedServedModel uses the turn in progress as the final turn.
    4. No change to the ledger fields, the reason text or the GPT path.
    5. Tests in test/a-codex-call-names-the-model-of-its-final-turn.test.ts, titled "W1-T14208 criterion N: ...",
       drive CodexJsonlAccumulator or spawnCodexWorker with an injected stream as
       test/every-provider-names-its-served-model-or-why-not.test.ts does. Load test/setup/tmp-hygiene.ts.
  falsifier: |
    On origin/main criterion 1 fails: the result names gpt-6.1-terra. Take the first reroute instead of the
    final turn's: criterion 2's two-reroute stream names the wrong model. Leave observedServedModel on the old
    rule: criterion 3 fails.
