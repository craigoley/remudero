- id: W1-T6124
  title: "A REVIEW PROOF RUNS SANDBOXED, WITHOUT THE DAEMON'S CREDENTIALS — defaultProofSpawner runs the PR's own test code by design and W1-T499 narrowed only its env: the child still runs as the daemon's uid with the daemon's HOME, no filesystem or network sandbox, so it can write ~/.gitconfig and the daemon's own code root and read the GitHub App key; and ensureDeps' `npm ci` in a PR checkout runs that PR's install scripts with the daemon's whole env"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — what a reviewer-run proof child of a PR's own code can reach on the host
  band_meaning: span
  origin: "operator session 2026-10-06: follow-up named in W1-T6106's shard notes (SEPARATE, NOT THIS TASK), verified read-only on origin/main before filing"
  plan_refs: [W1-T499, W1-T1096, W1-T3266, W1-T4587, W1-T4933, W1-T6106]
  files: [src/lib/review.ts, test/a-review-proof-runs-sandboxed-without-daemon-credentials.test.ts]
  status: merged
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-06 on origin/main bd232423a. Static reading only; no hostile proof was run anywhere.
    THE PROOF CHILD: src/lib/review.ts `defaultProofSpawner` and `defaultAsyncProofSpawner` exec the proof (`node
    --test` on the PR head's own test files, which import its src/) with `cwd` the reviewer checkout and `env:
    { ...buildProofEnv(), NODE_V8_COVERAGE: undefined }`. `PROOF_ENV_ALLOWLIST` is PATH, HOME, GIT_CONFIG_NOSYSTEM,
    the GIT_CONFIG_* index-0 triple and GIT_TERMINAL_PROMPT, so GH_TOKEN and the GH_APP_* names are NOT passed — that
    is W1-T499's whole effect. Nothing else confines the child: no bwrap or container, no network namespace, the same
    uid as the daemon, and HOME is the daemon's own. What that HOME holds, per deploy/entrypoint.sh: `$HOME/.gitconfig`
    (the global config, with the GH_TOKEN credential helper), `$HOME/Remudero` (config.root: state/ and the ledger)
    and `$HOME/Remudero/remudero` (TREE, the daemon's own checkout). So a proof can (a) write ~/.gitconfig — e.g. a
    core.fsmonitor or includeIf — which every LATER daemon git call outside W1-T6106's leaf honours with GH_TOKEN in
    its env; (b) write the daemon's code root and state; (c) read the App private key at GH_APP_PRIVATE_KEY_PATH
    (deploy/host-update.sh `RMD_DAEMON_RUNTIME_ENV_VARS`), a file the daemon uid can read; (d) reach the network.
    UNVERIFIED, Linux semantics only: a same-uid child can normally read its parent's /proc/<pid>/environ, which holds
    GH_TOKEN; whether the daemon container's /proc mount or dumpable flag prevents that was not checked.
    THE INSTALL: `ensureDeps` / `ensureDepsAsync` run `npm ci` with `cwd` the PR checkout and NO env option, so the
    daemon's whole environment, GH_TOKEN included. npm ci runs the root package's lifecycle scripts (preinstall,
    install, postinstall, prepare) from the PR's own package.json and reads its .npmrc. It is reached only when the
    checkout has no node_modules link and none yet (a symlinked node_modules returns early), so how often it runs in
    production is UNMEASURED; the staged install path copies package.json from `installRoot`, the shared install.
  design: |
    The builder owns the shape; constraints: (1) on Linux the proof child runs inside bubblewrap in the shape of
    worker-provider.ts `openWeightCheckSandboxArgv` (which the daemon image already ships, deploy/Dockerfile REQ 8):
    a new network and pid namespace, the reviewer checkout bound read-write, its node_modules link target and the node
    runtime read-only, HOME a fresh tmpfs, nothing else of the host mounted — so ~/.gitconfig, config.root, the App
    key and the daemon's /proc are not reachable. (2) The proof verdict machinery is unchanged: the same argv, timeout,
    SIGKILL and env allowlist, and a sandbox that cannot start is a not_executable outcome naming why, never a pass.
    (3) Off Linux (an operator's darwin review) there is no bwrap: run as today and write a ledger row naming the
    proof unsandboxed, rather than refusing review on the operator's machine. (4) `npm ci` in a PR checkout passes
    `--ignore-scripts` and an allowlisted env (no GH_TOKEN, no GH_APP_*), or runs in the same sandbox; the PR says
    which. TAKE THE CHEAP HALF FIRST if the sandbox proves costly: (4) and HOME-as-tmpfs alone close the credential
    and ~/.gitconfig routes; the network namespace waits on a count of proofs that need the network (expected zero).
  acceptance:
    - claim: "on Linux a review proof child whose test writes a marker into HOME and reads a fixture file standing in for the daemon's key sees a fresh HOME and cannot read the key file, the marker never reaches the daemon's HOME, a sandbox that cannot start reads as not_executable rather than a pass, and a PR checkout's npm ci runs no lifecycle script and carries no GH_TOKEN"
      proof: "unit test: test/a-review-proof-runs-sandboxed-without-daemon-credentials.test.ts"
  falsifier: |
    At base, run the fixture proof through `defaultProofSpawner`: it inherits the real HOME, the marker lands there,
    and the fixture key file is readable, so the test fails; `ensureDeps` on the fixture checkout runs its
    postinstall marker script.
  notes: |
    FIXTURES ONLY: the "key" is a fixture file under the test's tmp dir, the HOME the test watches is a tmp dir the
    test sets as the parent's HOME, and the postinstall script writes a fixture marker. Nothing reads a real key or
    a real ~/.gitconfig. The Linux-only arm needs bwrap; on a runner without it the test must report that arm as
    skipped with a name, never passed. Independent of W1-T6106: that task pins host git calls into a worktree; this
    one confines a proof child, and its route (a) is why W1-T6106's leaf alone is not enough.
