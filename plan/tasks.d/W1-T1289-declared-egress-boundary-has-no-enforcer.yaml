    RENUMBERED FROM W1-T2202 ON THIS SAME BRANCH, AND THE OLD SHARD WAS DELETED RATHER THAN
    RENAMED ALONGSIDE. W1-T2202 was a REAL reservation — `refs/rmd-id/W1-T2202` resolves, minted by
    a fleet lane (`1475147@Remudero`, 2026-08-24T02:08:47Z) four seconds after its sibling
    `refs/rmd-id/W1-T2201` (`1474654@Remudero`, 02:08:43Z). It was the WRONG NUMBER, roughly 900
    above the real frontier, and filing under it made the inflation self-sustaining: `next-task-id`
    reads OPEN PLAN PRs and the git history of `plan/` among its surfaces, so this shard's own
    filename fed 2202 straight back into the next mint. Re-derived here: the history scan over
    `plan/` returns 2202 and NOTHING ELSE above 1288, and that single hit is this branch.

    THE STRAY REFS ARE NAMED BECAUSE THEY WILL DO THIS AGAIN. Above the frontier the reservation
    namespace holds `W1-T2201`, `W1-T2202`, `W1-T100000`, and `W1-T1000000` through `W1-T1000004`.
    AND `next-task-id` CANNOT SEE ANY OF THEM: its own documented surfaces are `plan/tasks.yaml`,
    every `plan/tasks.d/*.yaml` shard, open plan PRs, and the git history of `plan/` — the
    `refs/rmd-id/*` namespace is not among them. So a stray reservation is invisible to the minter
    while a stray FILING is not, which is why a bad number becomes permanent only once something
    files under it. Retiring those refs is an operator decision and is not proposed here.

    W1-T1289 IS FREE ON EVERY SURFACE THIS SESSION COULD READ: no `refs/rmd-id/W1-T1289`, no shard
    filename, no `- id:` line. ITS RESERVATION IS NOT YET MINTED — `refs/rmd-id/*` pushes are
    refused from this container with a transport 403 while `refs/heads/*` pushes succeed in the
    same second, so the mint is an operator action. `task-id-existence` accepts EITHER a
    reservation ref OR a declared plan record, so this shard satisfies it on the record arm; the
    ref should still be minted so the double-mint protection is real rather than incidental.

    THE SUBJECT WAS SWEPT AS WELL AS THE ID, AND ONE NEIGHBOUR IS REAL. `allowedDomains` matches
