  rationale: |
    ★ FILED `status: blocked` ON PURPOSE. Every remedy below is an OPERATOR RISK DECISION, and the
    one thing this task must not do is gate. See design (iv): gating today would refuse EVERY
    dispatch, because the arm reads not-contained on every host measured. The unblocking condition
    is a ruling, not a measurement.

    (1) THE DECLARATION IS REAL AND THE CHAIN TO SPAWN IS INTACT. `settings/worker.json` sets
    `sandbox.enabled: true` and `sandbox.failIfUnavailable: true` at lines 27-28, and declares four
    domains under `sandbox.network.allowedDomains` at 37-43: `github.com`, `api.github.com`,
    `codeload.github.com`, `registry.npmjs.org`. `renderWorkerSettings` (`src/lib/worker.ts:1645`)
    is pure `${HOOKS_DIR}` substitution; `validateWorkerSettingsFile` is called at
    `src/lib/worker.ts:855` and checks pinned key placement against the WS-0 hazard; the file
    reaches the SDK with `settingSources` empty. Nothing on that path drops or rewrites the
    allowlist.

    (2) AND THERE THE TRAIL ENDS — BUT THE PRECISE CLAIM IS NARROWER THAN "NO CONSUMER", AND THE
    NARROWER CLAIM IS THE STRONGER ONE. Two things in this repository read `allowedDomains`, and
    NEITHER ENFORCES:
      PLACEMENT   `src/lib/settings.ts` lists it among the pinned keys and rejects it at the
                  sandbox ROOT (the WS-0 silent-drop typo). This proves the key is in the right
                  PLACE. It proves nothing about anyone acting on it.
      PROBE       `allowedHostFromSettings` (`src/lib/containment.ts:362`) reads the FIRST domain
                  to choose a control target for the egress probe, and its own doc says it in
                  terms: "THIS READS THE ALLOWLIST AND NEVER WRITES IT — the probe observes; it
                  does not enforce."
    So the allowlist is validated and observed. It is never applied. THE ENFORCER IS THE INSTALLED
    SDK/CLI SANDBOX — external to this tree.

    (3) THE MEASUREMENT SAYS THE SANDBOX IS ENGAGED AND ENFORCING ONE ARM AND NOT THE OTHER.
    OPERATOR-MEASURED AND NOT RE-DERIVED HERE (see (5)): 26 of 26 `containment.probe` rows carrying
    egress fields read `egress_contained: false` with ONE distinct `egress_reason`, all from
    container hosts — and 17 OF THOSE 26 READ `contained: true` ON THE FILESYSTEM ARM IN THE SAME
    ROW. That overlap is what makes this a specific gap rather than a sandbox that simply is not
    running: the same sandbox, in the same invocation, holds the filesystem restriction and does
    not hold the network one.

    (4) THE VERSION COMMENT IS NOT A PIN AND IS ALREADY STALE — BUT THE RUNNING SYSTEM IS ON THE
    LOCKED VERSION, AND AN EARLIER READING THAT SAID OTHERWISE WAS WRONG.
    `settings/worker.json`'s own `$comment` reads "SDK 0.3.209 / CLI 2.1.209" while
    `package.json` declares `"@anthropic-ai/claude-agent-sdk": "^0.3.233"` and `package-lock.json`
    resolves `0.3.233`. MEASURED IN THE DAEMON'S OWN CONTAINER TREE
    (`/home/node/Remudero/remudero`) at 2026-08-24T02:25Z, OPERATOR-TAKEN AND NOT RE-DERIVED HERE:
    `@anthropic-ai/claude-agent-sdk` AND `@anthropic-ai/claude-agent-sdk-linux-x64` BOTH READ
    `0.3.233` — matching the range and the lockfile exactly. An earlier recon reported `0.3.220`;
    THAT FIGURE CAME FROM A DIFFERENT, STALE CHECKOUT — the container the recon itself ran in, not
    the one that spawns workers — and it is withdrawn here rather than left in the record.

    (4a) SO INSTALL FRESHNESS IS AN ELIMINATED HYPOTHESIS, WHICH STRENGTHENS THE FINDING RATHER
    THAN WEAKENING IT. The 26 proven-broken rows all carry container hosts — `5935b6b32a81` ×23 and
    `1abc274530a9` ×3 — so they were produced BY the locked version. The egress gap is therefore
    NOT a stale-install defect and cannot be closed by reinstalling anything. Whatever is failing
    to enforce is failing at `0.3.233`.

    (4b) WHAT SURVIVES OF THE PIN ARGUMENT IS SMALLER AND STILL TRUE. A `$comment` naming 0.3.209
    against an installed 0.3.233 is documentation that cannot fail, and a CARET RANGE permits
    future upward drift in a security-relevant dependency with NOTHING WATCHING IT. The defect is
    prospective — an unwatched range — rather than a divergence in force today.

    (5) WHAT THIS SHARD DOES NOT CLAIM, STATED BEFORE ANYONE INFERS IT. NOBODY HAS REPRODUCED A
    BLOCKED-HOST REQUEST FROM INSIDE A LIVE WORKER SANDBOX. The case rests on 26 identical readings
    plus the filesystem-arm overlap, not on a direct test, and the 26 could not be re-derived from
    the container this was filed in: `rmd ledger-grep` reports `archives: 0 matched` and refuses,
    and the mandated control `"step":"risk_judge.decision"` refuses identically — a disqualified
    surface, not a measured zero. A direct reproduction is the single most valuable next
    observation and is named in design (v).

    (6) THIS IS NOT W1-T1265, WHICH IS CITED AND NOT RE-FILED. W1-T1265 asks whether network
    containment is PROBED at all — "assumed from configuration", Standing rule 11's own example.
    That probe now exists (`egressProbeCommand`, `allowedHostFromSettings`, the `containment.probe`
    rows above) and it has ANSWERED. This task is about what the answer revealed: the thing the
    probe observes has no owner in this tree. 1265 = we do not know. This = we know, and nobody
    owns it.

    (7) THE Q1 COSTING IS INVALIDATED BY A FACT ABOUT HOW WORKERS RUN, RE-DERIVED HERE.
    WORKERS ARE NOT SIBLING CONTAINERS. They are SDK spawns inside the daemon's OWN container:
    `src/lib/worker.ts` imports `query` from `@anthropic-ai/claude-agent-sdk` and calls it, and the
    string `--network` occurs ZERO times in that file and ZERO times in `settings/worker.json`
    (controls on the same scan: `permissionMode` 2 and `allowedDomains` 2, so the query sees both
    files). Repo-wide the ONLY `--network` is `deploy/serve-container.sh`, which starts the CONSOLE.
    SO "THE CONTAINER's NETWORK NAMESPACE" IN DESIGN (i) IS THE DAEMON's. Restricting it restricts
    the daemon, which legitimately needs github.com, the ACR and its own console — and A SHARED
    NAMESPACE CANNOT DISTINGUISH WORKER TRAFFIC FROM DAEMON TRAFFIC, because there is only one set
    of sockets. Re-costing all four against that: the SDK SANDBOX is the only option with per-worker
    granularity at all, which raises rather than lowers its standing, since the objection to it was
    never granularity but ownership. THE NETWORK NAMESPACE goes from "coarser than per-worker" to
    UNABLE TO EXPRESS THE POLICY — the daemon's own allowlist is a strict superset of a worker's, so
    any namespace rule wide enough for the daemon permits everything a worker wants. `bwrap` becomes
    the only ownable option that can still separate the two, because it wraps a PROCESS rather than a
    container, at the rebuild-gated cost already stated. `socat` is unchanged and still needs its own
    verifier. The design's line "Each container has its own network namespace" is TRUE and IRRELEVANT
    HERE: there is no worker container for it to be true of.

    (8) OPERATOR RULING 1 — THE FLEET MUST BE ABLE TO OBSERVE ITS OWN OUTPUT. `remudero-serve` is a
    FIRST-CLASS ALLOWED DESTINATION for the daemon and for every worker, not an exception carved out
    of a deny rule. It sits on `rmd-net` at 172.18.0.3 with a DNS alias, and the daemon was attached
    to that network at 2026-08-24T11:43Z; `http://remudero-serve:4317/` returns 401 from inside the
    daemon, which is REACHABILITY WITHOUT A TOKEN. Those figures are the operator's own measurement
    and are recorded as such: Docker's engine answers HTTP 500 on this workstation, so this session
    could not re-run them. What this session DID confirm from the tree: `rmd-net` is the network
    `deploy/serve-container.sh` attaches the console to by name, and the operator guide states the
    container must sit on it because the tunnel resolves it by name.

    (9) OPERATOR RULING 2 — READ YES, WRITE NO. Workers SEE the board and MUST NOT approve. A lane
    that can approve can influence its own governance, which is a different and worse failure than
    an over-wide egress rule: it is not exfiltration, it is self-ratification. THE WRITE-TOKEN
    EXPOSURE IS FILED SEPARATELY AS W1-T404 — "one `write` grant reaches all 20 write-scoped routes"
    — and is CITED HERE, NOT RE-FILED. This shard's boundary question is reachability; W1-T404's is
    what a reachable credential may then do.

    (10) OPERATOR RULING 3 — THE GATE CONDITION IS OBSERVABLE, NOT A JUDGEMENT. The arm STAYS
    OBSERVATIONAL until an enforcer exists, and then gates on the probe reading `proven-holding` on a
    run rather than on anyone's assessment that containment is ready. Design (iv)'s arithmetic is why:
    every measured row reads `egress_contained: false`, so a gate armed before an enforcer exists
    refuses EVERY dispatch for a boundary that has never once held. Gating on `proven-holding` cannot
    do that — the condition is false until the enforcement actually works, and true only where it
    demonstrably does.

    (11) AND THE IRONY IS A CONSTRAINT, NOT A JOKE. Workers can reach the console TODAY *because* the
    allowlist does not hold — `remudero-serve` is not among the four declared domains, so the only
    reason ruling 1 is already satisfied is the very failure this shard exists to fix. WHATEVER LANDS
    MUST PERMIT `rmd-net` DELIBERATELY. If it does not, W2's Playwright testing breaks the moment
    containment starts working, and it breaks in the direction that reads as a test regression rather
    than as a policy change — a boundary that begins holding looks exactly like a suite that began
    failing.
  design: |
    ONE CONCERN: give the declared egress boundary an enforcement owner this tree can test.

    (i) Q1 — FOUR CANDIDATES, AND "THE SDK" IS ONE OF THEM RATHER THAN THE ANSWER.
      THE SDK SANDBOX     Zero new code and it is already wired. COST: the enforcement lives
                          outside this repository, cannot be unit-tested here, and its behaviour
                          changes with a dependency version this tree does not pin (rationale (4)).
                          This is the status quo, and the status quo is what measures as not
                          holding.
      THE CONTAINER's OWN Each container has its own network namespace. An egress policy applied
      NETWORK NAMESPACE   there is enforced by the kernel, survives any SDK change, and is testable
                          from inside. COST: it is coarser than per-worker — every process in the
                          container shares it — so a rung that legitimately needs a domain a worker
                          must not have would need its own container or its own exception.
      `bwrap`             Named in `deploy/Dockerfile` and absent from the operator host, so it is
                          an IMAGE-SIDE capability: a change to it ships only on an image rebuild,
                          which is a slower loop and a boundary this repo already documents.
                          COST: per-worker granularity at the price of a rebuild-gated remedy.
      `socat`             Same image-side placement; useful as a controlled egress broker rather
                          than a blocker. COST: it is a proxy, so it becomes a component that can
                          itself fail open, and something must then verify IT.
    WHAT THE COMPARISON IS FOR: an enforcement this tree OWNS AND CAN TEST is worth more than one
    it declares and hopes for. Three of the four options are ownable here; the status quo is not.

    (ii) Q2 — THE PIN. Today the SDK is pinned by `package-lock.json` alone, and rationale (4)
    shows the running tree does not match it. What would DETECT a change: an assertion that the
    installed SDK version equals the locked one, run where workers actually spawn rather than in
    CI only — the same host-vs-CI split that has bitten this repo before. A comment naming a
    version is documentation; it can never fail. If the SDK stays the enforcer, that assertion is
    the minimum, and it belongs beside the containment probe rather than in a doc.

    (iii) Q3 — WHAT MUST NOT CHANGE. The allowlist KEEPS ITS FOUR DOMAINS. `api.anthropic.com`
    STAYS ABSENT — the worker reaches the model through the SDK's own transport, and adding it
    would widen the boundary to the one host that makes the rest of the allowlist decorative.
    `failIfUnavailable` STAYS TRUE. And THE ARM STAYS OBSERVATIONAL until an enforcer exists.

    (iv) WHY GATING NOW WOULD BE WRONG, IN ONE LINE OF ARITHMETIC. Every measured row reads
    `egress_contained: false`. A gate on that field would refuse EVERY dispatch on every container
    host, immediately. Whether to accept that is an OPERATOR RISK DECISION — trading all throughput
    for a boundary that may or may not be breachable — and it is explicitly not this task's to
    make. That is why this shard is `status: blocked` rather than `queued`.

    (v) THE OBSERVATION THAT WOULD MOVE THIS FURTHEST, NAMED SO IT IS NOT SKIPPED. Reproduce a
    request to a NON-allowlisted host from inside a LIVE worker sandbox and record whether it
    succeeds. If it is blocked, the probe's reason is the defect and the boundary holds; if it
    succeeds, the boundary is confirmed breached and the priority of (i) changes completely. Until
    one of those is recorded, this task is arguing from correlation.

    (vi) NOT IN SCOPE. W1-T1265's probe question; the filesystem arm, which measures as holding;
    the deny-floor arm; and the `excludedCommands` list.
