  rationale: |
    WHY: Craig wants serve under 0.3 cores even while the Console is open, and the Inbox still times out during
    serve's main-loop stalls.
    MEASURED on 2026-11-18 from serve's runtime.loop_stall_profile rows: child spawns are about 28% of main-thread
    stall time. The spawn frames are called from self-sync.ts (asyncGit: freshness fetches, gateway checkout reads)
    and ops-catalog-source.ts (the gh ref GET). Each spawn forks serve's ~1 GB process on its loop. The daemon has
    routed its awaited children through a small spawn helper since W1-T9754; serve never installs one, so every
    execFileRouted caller in serve also runs direct.
    NOT W1-T10291: that task moves the read-model oracle's IPC child (forkWorkerEntry) into the helper; this one
    installs the helper in serve and routes its plain awaited git and gh children, which need no IPC channel.
  design: |
    INVARIANT abort-settles: a routed git call settles at its abort signal, exactly when a direct one would.
    INVARIANT signal-kills: a git child that only a signal can stop (a signalled call with no bound) stays direct.
    1. spawn-helper.ts gets bootSpawnHelper(log, env, step, start?) and stopBootedSpawnHelper(helper), with
       SPAWN_HELPER_SWITCH moved there. daemon.ts's boot calls bootSpawnHelper (rows unchanged) and re-exports the switch.
    2. serveCommand calls bootSpawnHelper(log, process.env, "serve.spawn_helper") right after its log is defined,
       before the board and read model grow the process, and stops it on server close.
    3. AsyncGitRunner takes an optional boundMs. boundGitCall passes timeoutMs + lateGraceMs + GIT_FETCH_KILL_GRACE_MS.
       asyncGit routes through execFileRouted when a helper is installed and the call has no signal or names its
       bound; the helper's timeout stops the child.
    4. defaultOpsCatalogApi's default executor is execFileRouted.
  falsifier: |
    Serve never installs the helper: criterion 1 fails. A routed call ignores its abort: criterion 4 fails. A
    signalled call without a bound routes: criterion 5 fails. The catalog spawns direct: criterion 6 fails.
  note: |
