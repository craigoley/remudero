    ── CORRECTION 2: RULE 21 DOES NOT FORBID THIS EDIT ──────────────────────────────────────────

    The harvest's phrase was that amending a merged record is Rule 21 territory. Rule 21 governs a
    criterion added to a task whose IMPLEMENTATION merged, because MERGED is terminal and the criterion
    would orphan. Three facts read from source say this edit is not that:

      (a) All three shards read `status: queued`. The FILES are on main; the TASKS are not merged.
          (Decorative per the tasks.yaml header — the operator re-derives real merge state before
          editing, and the edit stands either way for the reason below.)
      (b) The enforcing check is CLAIM-KEYED. `criterionKey` (task-linter.ts) normalises the CLAIM
          ALONE — W1-T1098 narrowed it off claim+proof precisely so a non-contract edit stops reading
          as an amendment. A rationale citation rewrite adds, removes and changes NO claim, so
          `postMergeAmendmentViolations` has nothing to fire on.
      (c) `mergedFieldChangeViolations` is `severity: "warn"`, never block, and says why in its own
          message: a merged shard's declared fields can still be corrected (W1-T2248) — this makes the
          correction a declared, visible act instead of a silent one.

    So the constraint is narrower than "cannot touch": the correction is permitted, and owes visibility.
    What Rule 21 DID correctly demand is that #3272 not smuggle it in — hence this record.

    ── WHY TWO TASKS, AND WHY THIS HALF IS verify: human ────────────────────────────────────────

    `rule15FilingViolation` (src/lib/task-linter.ts) BLOCKS a task that declares a task-record path
    (`plan/tasks.yaml` or a `plan/tasks.d/*.yaml` shard) alongside any path outside plan scope at a
    `verify` the operator will not be asked to judge. The single-task draft declared three shards
    NEXT TO test/rule-citations-match-their-rule.test.ts, which is W1-T324's and W1-T369's exact
    shape. The consequence is downstream and unfixable by the worker: `judgeReview` computes
    `criteriaTampered = !planOnly && criterionFieldTampered(diff)` (review.ts), and `planOnly` is
    false the instant one test file joins the diff — so the plan-only carve-out that makes a record
    edit reviewable is GONE, and a dispatched worker gets ONE PR and cannot split it.

    BE PRECISE ABOUT THE MECHANISM, because the remedy depends on it: `criterionFieldTampered` keys on
    ADDED or REMOVED `claim:`/`proof:`/`satisfied_by:` LINES, and a pure rationale edit touches none of
    them, so the mixed diff would probably not have tripped it. That is an argument for why the check
    is CONSERVATIVE, not an argument for ignoring it — one stray reflow of an acceptance block inside
    those three shards flips a green PR to an unappealable refusal, and the whole exposure disappears
    for free by not mixing the diffs. The split is the cheap side of that trade.

    verify: human on top of the split, deliberately. The split ALONE clears the linter (this half's
    files are entirely in plan scope, so the rule cannot fire at any verify). `verify: human` is the
    second remedy the reviewer offered and is taken because: the deliverable is three tokens; a whole
    PR lifecycle for three tokens is the cost W1-T2471 already named; and a worker rewriting OTHER
    tasks' records is the shape Rule 15 exists to distrust, even when the edit is provably outside the
    criteria. THE COST IS REAL AND IS STATED: `isDispatchEligible` parks a `verify: human` task until
    the operator acts, and W1-T2616 depends on this one — so if the operator would rather not hand-edit,
    flip THIS record to `verify: auto` (it is plan-only; the filing rule does not fire either way) and
    the pair proceeds unchanged. The split is what makes that a free choice instead of a rewrite.

    ── WHAT IS ACTUALLY BROKEN, STATED HONESTLY ─────────────────────────────────────────────────

    NOT ambiguity. W1-T2457 already measured that the collision was a HAZARD RECORD rather than a live
    defect, and this task does not re-open that. What these three lines are is DANGLING POINTERS: a
    reader following `design rule 8` searches the corpus and finds nothing spelled that way, because the
    only index for that namespace is CLAUDE.md's decoding row and it maps `DR-N`. The cost is small and
    real, and it is strictly worse here than for a merged record, because the records are QUEUED — a
    dispatched worker will read that rationale and follow that citation.
  design: |
    (i) THE THREE CITATIONS BECOME `DR-N`. W1-T2399:112 `design rule 8` -> `DR-8`; W1-T2416:63
    `design rule 17` -> `DR-17`; W1-T2457:60 `design rule 19` -> `DR-19`. Nothing else in any of the
    three lines changes — same sentence, same meaning, a token that now resolves via CLAUDE.md's
    decoding row and MASTER-PLAN's live `DR-N` tokens.

    (ii) BINDING CONSTRAINT, VERIFY IT IN THE DIFF BEFORE PUSHING: the diff touches `rationale` prose
    ONLY. It adds, removes, reorders and rewords NO acceptance criterion, and changes no `files:`,
    `risk:`, `depends_on:`, `status:` or any other declared field, on any of the three records. That is
    what keeps this a citation correction rather than an amendment, and it is why the claim-keyed
    post-merge check stays silent. A diff that touches an `acceptance:` block has misread this task.

    (iii) THE HISTORICAL RECORD IS NOT REWRITTEN — the constraint this task can most easily fail.
    W1-T2456:73 and W1-T2457:38 QUOTE the old spelling in order to describe the namespace that had it.
    Rewriting them to `DR-N` would make each sentence false (they document a form that no longer
    exists, which is the point) and would erase the evidence of the defect. Leave them byte-identical;
    criterion 4 is the executable guard on exactly that, and it matches at head, so a run that breaks
    it breaks a proof that was already green. W1-T2456's shard is NOT in `files:` for the same reason —
    nothing in it is to be touched. Likewise W1-T1082:56's `design rule (i)` is an entirely different
    sense (a numbered design item inside one task's own design block) and W1-T2438:62's unnumbered
    DESIGN RULES is generic English. Neither is in scope.

    (iv) ORDER IS LOAD-BEARING. This half MUST land before W1-T2616. W1-T2616's guard asserts the corpus
    carries no unquoted citation; if the guard lands first it lands RED, on the required `ci` context,
    for every PR behind it. That is the whole reason the spine points this way and not the other.
