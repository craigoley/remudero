- id: W1-T13825
  title: "A shard checkout that runs past 3 minutes is stopped and run once more, so a silent fetch stall no longer uses up to 24 minutes of the shard's ceiling"
  repo: remudero
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # it changes how both shard lanes check out the repository, and moves the W1-T13321 suite with it (Rule 19)
  band_meaning: span
  origin: "W1-T13321 post-merge validation, operator-session#coverage-shard-timeouts-2026-11-19"
  plan_refs:
    - W1-T13321
    - W1-T13271
    - W1-T13269
  files:
    - .github/workflows/ci.yml
    - test/rules/a-stalled-shard-checkout-times-out-and-retries.test.ts
    - test/ci/a-stalled-checkout-fetch-aborts-and-retries.test.ts
