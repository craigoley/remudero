  falsifier: |
    If `RMD_ACCOUNT_FILE_PATH` is found set in the serve environment at the sha a build starts
    from, or `/home/node/.claude.json` is found to exist there, the premise in (1) and (2) is
    closed and the strip's `unreadable` has another cause that must be found before anything is
    changed. The check is two commands against the running container, with the sibling
    `remudero-daemon`, which HAS the file, as the positive control proving the query can see one.

    SEPARATELY FALSIFYING: if `deriveAccountUsage` is found to return identity on the `unreadable`
    reason at that sha, (3) and (4) are already fixed and only the render half of (7) remains. The
    check is the presence of `email` or `uuid` on the value `readAccountUsageFile` returns from its
    catch arm.

    AND IF the cache is observed durably INSIDE the 30-minute bound across repeated readings, (6)'s
    "intermittently fresh" reading is too pessimistic and the utilisation half needs no hedging —
    but the two readings recorded here, 66.5 minutes and 13.9 minutes, straddle the bound, so that
    must be measured over time rather than assumed from either one.
