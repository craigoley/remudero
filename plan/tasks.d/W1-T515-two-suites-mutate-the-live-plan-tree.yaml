  note: "`risk: high` IS SET UP FRONT — `moduleIdFromPath` folds a `.test` basename onto its source,
    so `task-linter-wiring` and `changed-tasks-raw-text` are TWO subsystems and `sizingViolation`
    (`src/lib/task-linter.ts`) would demand the band anyway. THE BAND IS THE SPAN: the blast radius
    is two test files and a fixture, and no `src/` behaviour changes.
    `files:` WAS DERIVED BY THE SAME PER-FILE QUERY THE RATIONALE REPORTS — the two suites that
    bind a repo-root-anchored `plan/` path and write through it — PLUS the fixture the tracked case
    needs a committed base blob for. It is DELIBERATELY NOT the fifteen files that merely reference
    a repo-root-anchored plan path: those read, and a declared-but-untouched path fails
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) exactly as an undeclared one fails
    `scopeViolationFiles`. DECLARE WHAT YOU WILL TOUCH — #1869 shipped a 22-file overrun against a
    two-path declaration and merged on an advisory.
    NO `src/` PATH IS DECLARED because none changes. If an implementer finds that the tracked
    test cannot be moved without a product seam, that is a FINDING TO REPORT rather than a licence
    to widen — design (ii) already establishes why the obvious seam is refused.
    RULE 25 IS NOT ENGAGED: `test/` is excluded from `isProductPath` and no declared path matches
    an `INSTRUMENT_SURFACE` pattern, so this changeset cannot pair a product path with an
    instrument one — the pairing that is failing a PR elsewhere today.
    EVERY CRITERION IS A NAME-FILTERED `unit test:` TITLE, NOT A PURE PATH — a pure path runs the
    whole file and couples every criterion to unrelated failures in it, and one of these very files
    is a known flake source. Each of the three titles was checked to match zero files under `test/`
    today against a positive control matching one, and each is under 100 characters with no comma.
    THE ID WAS RESERVED THROUGH THE ALLOCATOR THAT LANDED TODAY, not by a hand-rolled sweep:
    `refs/rmd-id/W1-T515` was created on origin with a unique orphan payload before this record was
    written (W1-T509/#1870). The sweep was run anyway as a cross-check and agreed; it was
    redundant, which was that task's stated acceptance.
    EVERY FIGURE HERE IS DATED 2026-08-15 AND IS A QUERY, NOT A CONSTANT — the two-writer
    population, the `-uno` asymmetry, the absent test timeout and the fixture pattern all move as
    the tests move. RE-DERIVE BEFORE BUILDING, especially the per-file classification, because the
    line-scoped form of that query reads zero on a repo where the problem is present."
