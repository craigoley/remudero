  design: |
    Typical plus one tail, as W1-T9557 and the host check already define it, applied to every unrealized claim
    including the start's own, and decayed by measurement. It adds no new constant, interval, count or byte threshold.
    1. THE START'S TYPICAL. gatherShadowInputs passes the start's class typical (the same `typical()` helper the ledger
       entries use, measured classes only) as inputs.start.typicalMib. An unseen start is then charged its median as
       typical, and its p90 - median competes for the one tail allowance like every other tree. An unmeasured class keeps
       its whole estimate as typical, as today.
    2. TIME TO PEAK, MEASURED. The tree sampler (host-memory-learning.ts, the per-key entry that raises peakMib every
       TREE_SAMPLE_MS) also notes the tree's age when its peak was last raised. finish() returns it, and recordPeak
       stores it on the sample (a new optional field). Old samples without it stay valid peak samples and are not counted
       as time-to-peak samples.
    3. DECAY. A live tree's remaining typical claim, and its tail, are multiplied by the class's measured survival at the
       tree's age: the weighted share of the class's time-to-peak samples later than ageMs, with the same half-life
       weighting and prior rule learnEstimate uses. A tree older than every measured time-to-peak claims nothing above
       its resident. A class with no time-to-peak samples is not decayed, and the claim says so. A released occupancy
       still claims nothing, as today.
    4. ROWS. Each ShadowClaim gains chargedMib, decay (the survival factor, or null with its reason) and ageMs. numbers
       gains hostClaimUndecayedMib beside hostClaimMib, so a re-measure can compare the two. memory_budget.shadow,
       enforce_wait, enforce_defer and enforce_admit rows carry them, since they write the same numbers.
    5. BOUNDARIES. No change to the reasons' order, hostReserveMib, containerReserveMib, the tiers in
       host-memory-admission.ts, plan/policy.yaml modes, W1-T9557's capacity decision, or W1-T8879's candidate.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Fixture: the 10-12 class peaks above,
    5,000 MiB MemAvailable, a 2,048 MiB reserve, one live build reservation, and an unseen garden start.
