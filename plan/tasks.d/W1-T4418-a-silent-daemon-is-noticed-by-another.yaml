- id: W1-T4418
  title: "A CRASH-LOOPING DAEMON WRITES NO LEDGER ROWS, SO NOTHING THAT READS ITS LEDGER CAN NOTICE IT — the console fleet was dark for three hours and no alert fired; have the core daemon watch every registered instance's sweep freshness and restart rate and escalate to the operator"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  band_meaning: span
  origin: "console fleet outage 2026-09-23 21:14Z to about 00:30Z"
  plan_refs: ["W1-T4227", "W1-T4384", "W1-T4409"]
  files:
    - src/lib/fleet-liveness.ts
    - src/lib/instance-gateway.ts
    - src/lib/serve.ts
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-09-23: remudero-console-daemon exited at loadPlan every ~2.5 min from 21:14Z (duplicate
    CONSOLE-T60), and its last sweep.summary stayed at 21:14:42Z until the operator merged the fold at about 00:30Z.
    No escalation fired. Every planned SRE invariant (W1-T4384) reads the instance's own ledger, and a daemon that
    dies at boot writes almost nothing there. The per-host heartbeat (fleet-heartbeat-watch) is per HOST and stayed
    green because the core daemon on the same host was fine. The operator found out by asking.
  design: |
    src/lib/fleet-liveness.ts exports evaluateFleetLiveness(instances, readLastRows, nowMs). For every registry
    instance (W1-T4227; each names its state root) it returns: last sweep.summary age, daemon.start count and exits
    in the trailing hour, and the newest boot-error line if any. An instance whose sweep is stale beyond its own
    poll cadence times a stated multiple, or which started more than a stated number of times in an hour with no
    sweep between, is DOWN. The core daemon evaluates it once per iteration. Each DOWN instance opens ONE
    needs-human escalation assigned to the operator (escalate's open-issue dedup), naming the instance, the age,
    the restart count and the boot error. A recovery closes nothing by itself but ledgers `fleet.instance_recovered`.
    The core daemon never watches itself here (the host heartbeat does). Thresholds are derived from each
    instance's own observed cadence and stated beside the constants.
  amendment: |
    2026-09-24, from the build agent's host recon (read-only): the core daemon CANNOT read the other instances'
    ledgers. remudero-daemon mounts only rmd-state2 -> /home/node/Remudero, and a find under it sees exactly one
    ledger.ndjson, its own. remudero-serve mounts /home/node/rmd-instances/{console,site} and their state, plus the
    core's, and can read all three, and src/lib/instance-gateway.ts already resolves each instance's
    InstanceStateRoot {instance, root, ledgerPath, planPath} from the registry. So evaluation moves to the gateway:
    instance-gateway.ts exports checkInstanceLiveness(roots, deps), which calls evaluateFleetLiveness over every
    registry instance except core, and serve.ts's existing minute timer calls it (one line, zero comment lines,
    since serve.ts is over its comment ceiling). Escalation uses the gateway's fleet App identity, the same App
    the daemons use for needs-human issues; the build confirms it can open and assign an issue before relying on it.
    The core daemon itself stays covered by the per-host heartbeat, as before.
  acceptance:
    - claim: "a registered instance with a stale sweep and repeated boots is escalated once with its boot error"
      proof: "unit test: a registered instance with a stale sweep and repeated boots is escalated once with its boot error"
    - claim: "a healthy instance raises nothing"
      proof: "unit test: a healthy instance raises nothing"
    - claim: "the gateway evaluates every instance's liveness"
      proof: 'grep: evaluateFleetLiveness( in src/lib/instance-gateway.ts'
  falsifier: |
    CLOSE IF a daemon that stops sweeping is already escalated by another daemon without the operator asking.
