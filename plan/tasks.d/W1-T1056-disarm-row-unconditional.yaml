    - claim: the shard locates the defect in the unconditional row rather than in the swallow
      proof: "grep: THE DEFECT IS THE UNCONDITIONAL ROW in plan/tasks.d/W1-T1056-disarm-row-unconditional.yaml"
    - claim: the shard establishes the fix needs no extra API call because the error text separates the cases
      proof: "grep: THE ERROR TEXT ALREADY DISCRIMINATES in plan/tasks.d/W1-T1056-disarm-row-unconditional.yaml"
    - claim: the shard separates the call site whose row is load-bearing from the two defensive ones
      proof: "grep: SITE A IS THE ONE THAT MATTERS in plan/tasks.d/W1-T1056-disarm-row-unconditional.yaml"
    - claim: the shard fences off the armed-step masquerade as its own id rather than absorbing it
      proof: "grep: THE ARMED MASQUERADE IS A SEPARATE ID in plan/tasks.d/W1-T1056-disarm-row-unconditional.yaml"
    - claim: the shard cites the neighbouring task without re-deriving its mechanism
      proof: "grep: W1-T1052 IS A DIFFERENT FAILURE in plan/tasks.d/W1-T1056-disarm-row-unconditional.yaml"
    - claim: the existing disarm suite still passes once the row becomes conditional
      proof: "unit test: test/disarm-on-capped-verdict.test.ts"
