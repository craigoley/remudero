  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) exempts only
    `risk === 'high'` and returns clean only below two subsystems; `files:` spans `src/` and
    `test/`. The band is Rule 19's SPAN, not blast radius — the runtime effect is one return value
    and three log calls.

    `files:` IS DERIVED BY INVOCATION COUNT WITH WORD BOUNDARIES, at origin/main 3794a555.
    `src/run-task.ts` holds `disarmAutoMerge` and every one of its call sites (`\\bdisarmAutoMerge`
    = 11; `automerge\\.disarmed` = 4) and is the only source file involved.
    `test/arm-at-open.test.ts` (21 and 8) is the heaviest existing coverage of the disarm row and
    asserts its presence and its ordering against `automerge.armed`, so a conditional row moves
    those assertions. `test/disarm-on-capped-verdict.test.ts` (`\\bwithdrawArmIfVerdictRefuses` = 8)
    is the dedicated suite for SITE A. `test/disarm-outcome-recorded.test.ts` does NOT exist and is
    declared as a NEW path — forward-referencing a path is safe where a symbol would be a guess, and
    CLAUDE.md requires a coverage-load-bearing test in its own file.
    DELIBERATELY EXCLUDED, with reasons: `test/risk-judge-wiring.test.ts` (2 and 1) asserts the
    risk-judge escalation rather than the disarm record, and `test/capped-verdict-never-arms.test.ts`
    (1) asserts the arm refusal. Neither file's assertions move when the row becomes conditional.
    THE W1-T471 SERIALISATION COST IS ACCEPTED IN WRITING: declaring `src/run-task.ts` serialises
    this task against every other task declaring it, per DECISIONS.md's 2026-08-18 ruling that the
    monolith stays one file and the fleet accepts one effective dispatch lane. It is declared anyway
    because the function and all three call sites live there and cannot be fixed without it. The
    shard's own path is not declared, which would convert the endemic proof-scope warnings into one
    hard `rule15-filing` violation.

    TWO REQUIRED MEASUREMENTS COULD NOT BE TAKEN ON THIS HOST, and are stated as NOT RUN rather than
    estimated. This container carries NO `state/` directory and NO ledger file of any form, so the
    per-form coverage control the ledger union requires cannot even open its first form. Both must be
    taken on the daemon host before this task is built:
      (a) whether an `automerge.disarmed` row was written for PR #2234 at the time the daemon
          narrated `automerge.disarm_failed` — the measurement that turns clause (1) from a source
          reading into an observed false record;
      (b) how many `automerge.armed` rows carry an `outcome` field whose value is not `armed` or
          `direct-merged` — clause (v)'s size, read from the FIELD and never from the step name, and
          remembering the outcome values are hyphenated.
    The SOURCE side of both is established above and does not depend on either figure."
