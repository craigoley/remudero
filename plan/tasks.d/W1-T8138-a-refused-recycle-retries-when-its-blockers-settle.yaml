  design: |
    Operator ruling: no hard thresholds. Every bound below is read from data, with its source ledgered, and a
    no-history case falls back to today's value and says so (`source: "no_history_fallback"`), as W1-T7807 does.
    1. THE REFUSAL NAMES ITS BLOCKERS. When the script refuses on the drain wait, it writes a machine-readable
       blocker list beside the refusal: each lock's task id and run_id, and each lane-less worker's pid and kind
       (review, retro, fix-rung, unknown) with its attribution. runDeployCycle records it on the refusal.
    2. RETRY ON EVIDENCE, NOT A TIMER. For a refusal of this kind (drain wait), decideDeployTrigger does not use
       IMAGE_RECYCLE_FAILURE_BACKOFF_MS. It retries on the first watchdog tick at which the ledger shows every named
       blocker has yielded or finished: a `verdict` row for that run_id, a `run.freshness_handoff` /
       `worker.recycle_yield` row, the lock gone, or the worker pid gone. A tick that still sees a blocker declines
       with a reason that names it. Other failure kinds (pull, smoke, health) keep today's back-off; they are not
       this task.
    3. AN ADAPTIVE WAIT. The supervisor computes the drain wait and passes it through the existing
       RMD_RECYCLE_WAIT_S override. It is the time the in-flight lanes are expected to need: for each lane, the
       remaining time read from the observed `implement.done` worker_duration_ms distribution conditioned on that
       lane's current age (a high quantile of the runs that were at least that old), taken over all lanes. A lane
       the quiet-worker watchdog has judged (`worker.quiet_judged`, `worker.recycle_yield`) uses that verdict: a
       lane that ended its round is not waited for; a lane whose round end failed is waited for its own expected
       remainder. Ledger `deploy.recycle_wait_derived` with the wait, the per-lane inputs, the sample count and the
       source.
    4. THE SCRIPT STOPS CARRYING A SIZED CONSTANT. With no RMD_RECYCLE_WAIT_S from a caller (an operator's hand
       run), it keeps 3000 s and labels it the no-history fallback in its messages. Update the comment block at
       :405-422 to say where the wait now comes from.
    5. W1-T6062's escalation counts consecutive refused ATTEMPTS for the same instance and reason, not timer
       windows, so it keeps working when retries are no longer hourly.
    Tests (new file, `test(` titles verbatim as in the proofs below): decideDeployTrigger with a recorded drain
    refusal and ledger rows for its blockers, and the wait derivation over a fixture `implement.done` population.
