  rationale: |
    MEASURED 2026-10-15 (core ledger, read-only): daemon.summary at 05:37:33.961Z, run DAEMON-1792035603780:
    stopReason "error", stopDetail "W1-T9047: Command failed: git -C /home/node/Remudero/worktrees/run-W1-T9047-1792035987149
    push origin HEAD / fatal: could not read Username for 'https://github.com/craigoley/remudero.git': No such device
    or address". It attempted W1-T9086, W1-T8138 and W1-T9047.
    READ at origin/main ee1cf822d:
    - src/lib/drain.ts laneDeliveryFailure (W1-T5344, #8785, 2026-10-03) turns a `Command failed: ` rejection into a
      lane-local park, EXCEPT when CREDENTIAL_REFUSAL_RE
      (/Bad credentials|HTTP 401|Authentication failed|could not read Username|Permission denied \(publickey\)/i)
      matches. Its stated reason: "A dead CREDENTIAL is the fleet's failure, not the task's: every lane would hit it
      next".
    - src/lib/daemon.ts settle loop: a rejection that no lane-local arm claims returns `{ taskId, message }` to
      fatalError, and the daemon stops with stopReason error.
    - So this is not a regression of W1-T5344. It is W1-T5344's deliberate carve-out, and its premise fails for
      "could not read Username". That message means no credential was OFFERED by this push, not that the fleet's
      credential was refused. #11985 (f0ccd8548) fixed one way a single push loses its credential helper (a held
      loop truncating `git config --list`), and W1-T9654 names that cause in the run's report.
    - W1-T9654 (queued) leaves drain.ts's CREDENTIAL_REFUSAL_RE alone on purpose (its design point 3). So this needs
      its own task; it does not extend W1-T9654.
  design: |
    1. A credential refusal in one lane is checked against the fleet credential before it can stop the daemon.
       The settle loop asks an independent probe: an awaited, bounded `git ls-remote origin HEAD` through the same
       credential path a fresh worker push uses (the git credential socket, or the App token transport).
       - Probe succeeds: the credential is alive, so the refusal is lane-local. Park the task as W1-T5344 parks a
         delivery failure, with class `push_credential_missing`, and keep the daemon running.
       - Probe refused: today's fatal path is unchanged, and the stop detail names the probe's answer as well as
         the lane's.
       - Probe unreadable: fatal, as today. An unread probe is not evidence the credential is alive.
    2. "Bad credentials", "HTTP 401" and "Authentication failed" are a credential the server REFUSED. They keep the
       probe too, so one stale token in one worktree cannot stop the fleet while the shared one works.
    3. The park is ledgered as daemon.lane_failed with the lane's stderr and the probe verdict. A second lane that
       hits the same refusal while the probe still reads alive is parked the same way, never escalated as a fleet
       outage.
    4. A fixture test drives a worker whose push prints "fatal: could not read Username" with a probe that reads
       alive: the daemon keeps running and parks only that task. With a probe that reads refused, it still stops.
  acceptance:
