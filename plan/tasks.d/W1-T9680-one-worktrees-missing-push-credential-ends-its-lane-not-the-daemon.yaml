  rationale: |
    MEASURED 2026-10-15 (core ledger, read-only): daemon.summary at 05:37:33.961Z, run DAEMON-1792035603780:
    stopReason "error", stopDetail "W1-T9047: Command failed: git -C /home/node/Remudero/worktrees/run-W1-T9047-1792035987149
    push origin HEAD / fatal: could not read Username for 'https://github.com/craigoley/remudero.git': No such device
    or address". It attempted W1-T9086, W1-T8138 and W1-T9047.
    READ at origin/main ee1cf822d:
    - src/lib/drain.ts laneDeliveryFailure (W1-T5344, #8785, 2026-10-03) turns a `Command failed: ` rejection into a
      lane-local park, EXCEPT when CREDENTIAL_REFUSAL_RE
      (/Bad credentials|HTTP 401|Authentication failed|could not read Username|Permission denied \(publickey\)/i)
      matches. Its stated reason: "A dead CREDENTIAL is the fleet's failure, not the task's: every lane would hit it
      next".
    - src/lib/daemon.ts settle loop: a rejection that no lane-local arm claims returns `{ taskId, message }` to
      fatalError, and the daemon stops with stopReason error.
    - So this is not a regression of W1-T5344. It is W1-T5344's deliberate carve-out, and its premise fails for
      "could not read Username". That message means no credential was OFFERED by this push, not that the fleet's
      credential was refused. #11985 (f0ccd8548) fixed one way a single push loses its credential helper (a held
      loop truncating `git config --list`), and W1-T9654 names that cause in the run's report.
    - W1-T9654 (queued) leaves drain.ts's CREDENTIAL_REFUSAL_RE alone on purpose (its design point 3). So this needs
      its own task; it does not extend W1-T9654.
    - COST BEFORE THE EXIT: W1-T9047's push first failed at 04:10:39Z, and refill was held ('a lane rejected') for
      77 min until 05:29Z, before the 05:37:33Z exit. So a lane-local credential refusal must also leave sibling
      refill open.
    - PROBE CHOICE (builder B2, measured 16:54-16:56Z): craigoley/remudero is PUBLIC. `git ls-remote` uses
      upload-pack, which succeeds with credential.helper unset, and info/refs?service=git-upload-pack answers 200
      with no auth, so an upload-pack probe can never read a dead credential. receive-pack discovery
      (GET https://github.com/craigoley/remudero.git/info/refs?service=git-receive-pack with basic auth
      x-access-token:<token>) answers 401 with no token and 401 with a bad token. It spends no REST quota and pushes
      nothing.
  design: |
    1. A credential refusal in one lane is checked against the fleet credential before it can stop the daemon. The
       check is an injected DaemonDeps port, `probeFleetPushCredential`, which returns alive, refused or unreadable.
       - Default in src/lib/daemon.ts: unreadable. With no probe wired, today's fatal path is unchanged, so tests
         stay hermetic and W1-T3165's "Bad credentials remain fatal" fixtures keep their meaning.
       - Production (src/run-task.ts, where cmdDaemon wires DaemonDeps): an awaited, bounded receive-pack discovery,
         GET <origin>/info/refs?service=git-receive-pack, authenticated as x-access-token with the token a fresh
         worker push would use (the App installation token behind the git credential socket). 200 is alive. 401 or
         403 is refused. A timeout or network error is unreadable. Never an upload-pack read (`git ls-remote`),
         which a public repo answers without any credential.
    2. Probe alive: the refusal is lane-local. Park the task as W1-T5344 parks a delivery failure, with class
       `push_credential_missing`, keep the daemon running, and leave sibling refill OPEN. No "a lane rejected"
       refill hold for a lane-local credential refusal.
    3. Probe refused or unreadable: today's fatal path is unchanged. The stop detail names the probe's answer
       beside the lane's stderr.
    4. "Bad credentials", "HTTP 401" and "Authentication failed" take the same probe, so one stale token in one
       worktree cannot stop the fleet while the shared one works.
    5. The park is ledgered as daemon.lane_failed with the lane's stderr and the probe verdict. A second lane hitting
       the same refusal while the probe reads alive is parked the same way, never escalated as a fleet outage.
    6. A fixture test drives a worker whose push prints "fatal: could not read Username":
       - probe alive: the daemon keeps running, parks only that task and refills a sibling;
       - probe refused: it stops;
       - probe unwired: it stops, as today.
       A second test drives the real receive-pack probe against a local HTTP stub that answers 401 for a missing
       or wrong token and 200 for the right one, so a dead credential reads refused.
