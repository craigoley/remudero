    - claim: "the 05:37 shape parks W1-T9047's lane and never reaches fatalError"
      proof: 'grep: test("W1-T9680: a could-not-read-username push parks its lane while the fleet credential probe reads alive" in test/one-worktrees-missing-push-credential-ends-its-lane-not-the-daemon.test.ts'
    - claim: "a refused fleet credential still stops the daemon, naming the probe"
      proof: 'grep: test("W1-T9680: a refused fleet credential probe still stops the daemon and names the probe" in test/one-worktrees-missing-push-credential-ends-its-lane-not-the-daemon.test.ts'
  falsifier: |
    At origin/main, a settle-loop rejection "Command failed: git push origin HEAD\nfatal: could not read Username for
