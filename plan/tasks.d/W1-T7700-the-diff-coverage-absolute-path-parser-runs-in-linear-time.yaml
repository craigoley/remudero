    THE CODE. `diffCoverageReport` (src/lib/sweep.ts:19318) scans every line of a failing check's logTail with
      /^\s*-\s+((?:[A-Za-z]:[\\/]|\/)(?:[^\s:]+[\\/])*[^\s:]+\.[cm]?[jt]sx?):(\d+)(?:\s|$)/
    The segment class `[^\s:]` itself contains `/` and `\`, so `(?:[^\s:]+[\\/])*` can split a run of `x/x/x/...`
    in exponentially many ways before failing. It arrived with d40ff98d2 (#10479, 2026-10-09 22:59Z, "retain
    absolute diff coverage paths"). The shared parser it delegates to, src/lib/diff-coverage-targets.ts:29, uses a
    single class and is not affected.
    REPRODUCED in isolation (node 24.21.0, nice 19, cores 4-7, the regex copied verbatim, the witness
    "- /" + "!/".repeat(n), which never matches):

    | n | length | time |
    |---|---|---|
    | 20 | 43 | 20.7 ms |
    | 24 | 51 | 385 ms |
    | 26 | 55 | 1.62 s |
    | 28 | 59 | 6.73 s |

    That is about 2x per extra `!/` pair, so an ~80-character line runs for hours. A positive control (a legitimate
    absolute path of the same depth, "- /src/" + "a/".repeat(n) + "x.ts:12") matches in under 0.15 ms at every n.
    REACH. The callers are the daemon sweep's diff-coverage handling, src/lib/sweep.ts:4928 and :4951, on any
    failing check whose logTail carries the diff-coverage BLOCKED sentence (DIFF_COVERAGE_BLOCK_RE). A CI log is
    PR-author-controlled text: one printed line can hold the sweep, which runs on the daemon's event loop, so
    every lane stalls with it.
