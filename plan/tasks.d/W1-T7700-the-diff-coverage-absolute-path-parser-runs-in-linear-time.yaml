  design: |
    Remove only the redundant repeated directory group from the actual absolute-path expression:
      /^\s*-\s+((?:[A-Za-z]:[\\/]|\/)[^\s:]+\.[cm]?[jt]sx?):(\d+)(?:\s|$)/
    The final stem's class already includes both separators. Choosing zero repeated directory components
    therefore accepts every string the original repetition accepts, with the same captures. Eliminating
    that ambiguous repetition avoids exponential partitions WITHOUT changing leading/repeated separators,
    dot-prefixed names, Windows drives, glosses, malformed-path rejection, or Unicode.
    The real production-reader regression must exercise those shapes; a copied-regex diagnostic is not
    acceptance evidence. Keep the existing real sweep suite and importer/reach baselines unchanged.
    Do not cap the line length as the fix: a cap hides the shape. Keep the parse result identical for every
    current fixture in the sweep's diff-coverage tests.
