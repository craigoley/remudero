- id: W1-T13865
  title: "A fix round does not start again at a head whose last round ruled NEEDS_SCOPE or FLAKE until the input that ruling waits for has changed"
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # a stand-down at an unchanged input; a new head, a new red or a merged amendment still starts a round
  origin: "operator-session#spend-per-merged-pr-2026-11-19"
  plan_refs:
    - W1-T7096
    - W1-T9502
    - W1-T6465
  files:
    - src/lib/fix-progress-judge.ts
    - src/lib/sweep.ts
    - test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "priorRoundHold returns a NEEDS_SCOPE hold when the task's newest fix.done at this head ruled NEEDS_SCOPE and no scope amendment for the task has merged and main's contract revision is unchanged since that round"
      proof: "grep: W1-T13865 criterion 1: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts"
    - claim: "priorRoundHold returns a FLAKE hold when the newest fix.done at this head ruled FLAKE and no required check has completed on this head since that round ended"
      proof: "grep: W1-T13865 criterion 2: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts"
    - claim: "invariant:no-round-at-an-unchanged-ruling — priorRoundHold returns no hold for a new head, for a check completed red after a FLAKE round, for a merged scope amendment after a NEEDS_SCOPE round, and for FIXED or NOT_LANDED rounds"
      kind: guard
      proof: "grep: W1-T13865 criterion 3: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts"
    - claim: "The sweep stands the fix rung down with the hold as its stand_down_reason and spawns no fix worker; the existing NEEDS_DESIGN hold is unchanged"
      proof: "grep: W1-T13865 criterion 4: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts"
    - claim: "The sweep's fix rung calls the hold reader"
      proof: "grep: priorRoundHold( in src/lib/sweep.ts"
  rationale: |
    WHY: fix rounds that end without a change cost $49.50 of $95.09 fix spend (52%), 2026-11-05 to 2026-11-19.
    OBSERVED (ledger union, fix.done rows): NEEDS_SCOPE 83 rows $10.37, NEEDS_DESIGN 82 rows $6.80, NOT_LANDED 74
    rows $24.48, FLAKE 55 rows $6.82, BASE_RED 7 rows $0.53, unstated 5 rows $0.50. 53 rounds ($10.56) started at
    a task and head whose earlier round had already ruled NEEDS_SCOPE ($7.24 after) or FLAKE ($3.33 after); none
    followed NEEDS_DESIGN. fix.done records the head at the round's end, so this count is INFERRED to be close to,
    not equal to, the rounds started at an unchanged input.
    OBSERVED in code: the sweep (sweep.ts) holds the fix rung at a head whose round handed off NEEDS_DESIGN
    (the fix.needs_design row). resolveFixProgress (fix-progress-judge.ts, W1-T9502) reuses only continue and
    change-approach verdicts at an unchanged input. Nothing holds a head after a NEEDS_SCOPE or FLAKE round, so the
    next sweep can pay for another round at the same input.
  design: |
    INVARIANT no-round-at-an-unchanged-ruling: a fix round never starts at a head and input whose last round's
    ruling waits for a change that has not happened; every other path to a round is unchanged.
    1. fix-progress-judge.ts: export priorRoundHold(ledger, { taskId, headSha, contractRevision, checkCompletions })
       that reads the newest fix.done of the task at the head and returns { hold: "NEEDS_SCOPE" | "FLAKE", since }
       or undefined. NEEDS_SCOPE releases on a merged scope amendment for the task (fix.scope_amendment or
       pr.terminal merged for it) or a changed contract revision. FLAKE releases when any required check completes
       on the head after the round's ts.
    2. sweep.ts: next to the NEEDS_DESIGN hold, call priorRoundHold; on a hold, set standDownReason and break,
       the same way the NEEDS_DESIGN hold does. No count or cap: the hold ends when its input changes.
  falsifier: |
    Remove the priorRoundHold call from the sweep: criterion 4's fixture spawns a second fix worker at the same head
    after a FLAKE round and the test fails.
  note: |
    Id reserved for run-unfiled-1795113525000 with ~/rmd-work/bin/reserve-id.sh.
