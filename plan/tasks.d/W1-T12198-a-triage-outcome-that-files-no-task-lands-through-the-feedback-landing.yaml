  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 9 merges were triage outcomes that filed no task.
    - Each one changes one line, the status of one feedback file. Each one is a pull request with a full CI run and a review.
    - `triageCommandLocked` in src/run-task.ts makes a worktree, commits, pushes and opens a pull request for every outcome.
    - The feedback landing already carries status changes in one pull request on one fixed branch. `landFeedbackStatusContent` in src/lib/feedback-landing.ts does it for the panel and for the evidence gardener.
    - The landing merges as `chore(feedback): land pending filings`. That subject does not name a feedback id. `feedbackOutcomeObserved` in src/lib/auto-triage.ts releases a triage claim only when a merged subject names the id, so the release needs a second source.
    - W1-T9054 (queued, priority 2) asks for the same result through a new triage-outcome pull request. This task uses the landing that exists. Criterion 2 of W1-T9054 is covered when this task merges.
    - 72% of merges to the public repository in that window were plan paperwork. The operator asked to lower the count now, before new plan files move to the ops repository.
  design: |
    In `triageCommandLocked`, branch on the outcome after the decision. For `no_task` and `grill`, call `setFeedbackStatus` with its `land` option, which reaches `landFeedbackStatusContent`. Do not commit in the lane worktree and do not open a pull request.
    Keep the `propose` path as it is: one pull request that edits the feedback file and adds the task file.
    Give the claim release a second evidence source: `readLandedFeedbackEntry` on origin/main with a status that is not `new`.
    Keep the checks that follow a triage pull request (`checkTriageLiveScope`) for `propose` only.
    AMENDED 2026-11-11 at build time: after the branch, a `no_task` or `grill` outcome never reaches the empty-scope close, and `checkTriageLiveScope` acts only on those two outcomes. Remove the two empty-scope blocks in `triageCommandLocked`, `checkTriageLiveScope`, `readTriagePrLifecycleIdentity`, `closeTriagedEmptyScopePr` and `triageLiveScopeDecision`. The landing compares the entry with origin/main itself, so a status that a sibling already landed opens no empty pull request.
    AMENDED 2026-11-11: five existing tests drove the old pull request path for these two outcomes. Update them: drop the two end-to-end empty-scope tests and the `triageLiveScopeDecision` checks in test/empty-diff-merge-gate.test.ts; lower the `triageCommandLocked` row in test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts from 3 to 2 (the removed `gh pr close`); read the landing branch in test/triage-already-decided-citation-resolves.test.ts; answer the landing's `pr create` in test/triage-plan-deps-seam.test.ts; expect exit 0 and no review in test/triage-remote-reservation-timing.test.ts.
    NOT IN SCOPE: the interval of the machine-filing judge (W1-T9054 criterion 1), and any change to the landing itself.
  falsifier: |
    Open a pull request for a `no_task` outcome and criterion 1 must fail. Route `propose` through the landing and criterion 2 must fail. Remove the status read from the claim release and criterion 3 must fail. Drop the escalation of a `grill` and criterion 4 must fail. Restore and require all six to pass.
  note: |
    W1-T9054 needs an amendment after this merges: remove its criterion 2. This filing adds new task files only and does not amend it.
