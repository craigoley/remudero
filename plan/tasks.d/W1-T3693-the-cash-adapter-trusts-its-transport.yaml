- id: W1-T3693
  title: "THE CASH ADAPTER TRUSTS ITS TRANSPORT — no request deadline, finish_reason never read, no tolerant JSON extraction, and no grounding check on what the model returns"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 14.00
  files:
    - src/lib/worker-provider.ts
  origin: "operator-session#synthwatch-comparison-2026-09-16"
  plan_refs: ["W1-T3567", "W1-T3575"]
  status: queued
  priority: 2
  note: |
    COMPARED 2026-09-16 against synthwatch's production Azure adapter (`runner/aoai.ts`,
    `runner/rca.ts`), which has run gpt-5-mini live for months. Four things it does that
    `spawnOpenWeightWorker` does not. Counted in src/lib/worker-provider.ts on origin/main:

        AbortController / timeout          0 occurrences
        finish_reason                      0 occurrences
        fence-tolerant JSON extraction     0 occurrences
        output grounding / discard         0 occurrences

    REMUDERO IS AHEAD ON MONEY and that must not regress: reserve-before-send,
    settle-only-from-a-receipt and the conservative unsettled-reservation rule are all stricter
    than synthwatch's. This record is about TRUSTING THE REPLY, not about spend.
  rationale: |
    (a) NO REQUEST DEADLINE. The `fetch` in `spawnOpenWeightWorker` passes no `signal`, so a hung
    Azure request has no bound and the tool loop waits forever. synthwatch aborts at 30s. This is
    the same class of defect as W1-T3690 (a stalled reader misread as a provider timeout), one
    layer out: there, a deadline fired too early; here, there is no deadline at all.

    (b) `finish_reason` IS NEVER READ. The adapter takes `message.content` and `tool_calls` only.
    gpt-oss-120b and gpt-5-mini are BOTH reasoning models -- a gpt-5-mini probe spent 64 of 76
    completion tokens on hidden reasoning for a six-token answer -- so `finish_reason: "length"`
    with empty or truncated content is a live outcome, and it is currently indistinguishable from
    a genuine short reply. OPENWEIGHT_MAX_COMPLETION_TOKENS's own comment records a shard already
    truncated mid-string at 1,500.

    (c) NO TOLERANT EXTRACTION. `OPENWEIGHT_OUTPUT_CONTRACT` ASKS the model not to fence its
    output, which is the right instruction and not a guarantee. synthwatch asks AND strips
    (`extractJson`: fence match, then outermost {...} slice). Prompt-only is weaker here than
    there, because this adapter deliberately cannot use JSON mode -- gpt-oss-120b returns
    malformed JSON under `response_format` -- so the prompt is the ONLY defence it has.

    (d) NOTHING VALIDATES THE OUTPUT. This is the one that decides which lanes a cheap model may
    serve. synthwatch's RCA requires every observed item to carry `[cite: TOKEN]`, and
    `validateCites` DISCARDS THE WHOLE GENERATION when a citation is missing or unresolvable,
    falling back to `deterministicResult` -- facts-only, `inferred: []`, never an invented cause.
    That is what makes a small model safe on a judgement lane: not better prompting, but a
    validator that can REJECT it and a computed answer to fall back to.
  design: |
    Four separable changes; (a) and (b) are cheap and unlock nothing, (c) and (d) are what widen
    the lane surface. Build in that order so the transport is trustworthy before anything leans
    on it.

    (a) Pass an AbortSignal with a per-request deadline, bounded and configurable, defaulting
        generously (a reasoning model on a large prompt is legitimately slow). A deadline that
        fires must settle the reservation, never leak it.
    (b) Read `finish_reason`. Treat `length` as a NAMED failure that says the budget truncated the
        reply -- never return truncated content as a result. Ledger it so the cap and
        OPENWEIGHT_MAX_COMPLETION_TOKENS can be tuned from evidence.
    (c) Add a fence-tolerant extractor applied to the returned text when a structured document was
        requested. Keep the prompt rule: ask AND strip.
    (d) Add an OPTIONAL grounding contract a caller may impose: a token index, a required citation
        on each asserted item, and a discard-with-fallback when a citation is absent or resolves
        to nothing. It must be opt-in per lane -- imposing citations on a prose lane would be the
        "turn every task into a YAML task" mistake OPENWEIGHT_OUTPUT_CONTRACT already warns about.

    DO NOT weaken the reservation/settlement path to make any of this simpler.
  acceptance:
    - claim: "a request that never answers is abandoned at a deadline rather than hanging the tool loop, and its reservation is settled"
      proof: "unit test: an openweight request abandoned at its deadline settles its reservation"
    - claim: "a reply truncated by the completion budget is a named failure, not a short answer"
      proof: "unit test: a length-truncated openweight reply is refused rather than returned"
    - claim: "a fenced structured reply is still parsed, so the prompt rule is not the only defence"
      proof: "unit test: a fenced openweight reply is extracted rather than rejected"
    - claim: "an asserted item with no resolvable citation discards the generation and falls back, so an ungrounded claim cannot reach a caller"
      proof: "unit test: an ungrounded openweight claim discards the generation"
  falsifier: |
    Close (d) without implementing if no lane wants a grounding contract -- it is machinery for a
    judgement lane, and building it before one exists would be the shipped-unwired shape. (a) and
    (b) stand regardless: they are correctness on the transport, not features.
