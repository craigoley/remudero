- id: W1-T3969
  title: "A GREEN PULL REQUEST CAN HOLD remudero-review=PENDING FOREVER WHEN THE ADVISORY WORKER STALLS — bound reviewer activity and bound shared-pause reads so the scheduler reaches a terminal verdict instead of waiting for a human or a fresh push"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 20.00
  files:
    - src/lib/fleet-control.ts
    - src/run-task.ts
    - test/pause-hold-is-attributable.test.ts
    - test/review-status-pending.test.ts
  origin: "operator-session#review-posting-root-cause-2026-09-21"
  plan_refs: [W1-T3647, W1-T3622, W1-T3961, W1-T3226]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    MEASURED ON #6396 AND #6418. Both PRs had every CI check green while `remudero-review` was
    pending. The daemon's shared-pause probe then blocked in `git ls-remote` for more than an hour,
    so #6418 could not be admitted. After a restart, #6418 completed, but #6396 admitted its
    review and stopped after `review.reviewer.materialized`; the semantic provider never emitted a
    terminal worker result, and the decision claim stayed held. A second sweep correctly reported
    the exact-input key as already claimed, leaving the required status pending rather than asking
    for a human review. This is a liveness defect in the review lane, not a PR defect.

    Two independent unbounded waits caused the incident: the shared-pause read used synchronous
    `git ls-remote` with no timeout, and the advisory reviewer spawn had no idle-activity watchdog.
    The deterministic floor is already the authoritative gate; a stalled advisory worker must be
    abandoned so that floor can post its terminal verdict. A timed-out pause read must fail closed
    for dispatch while returning control to the daemon loop.
  design: |
    (i) Bound the shared-pause git read at a named ten-second wall-clock ceiling. A timeout is an
        unreachable pause source, so dispatch remains held, but the daemon can continue heartbeats,
        reviews, and recovery on the next tick.
    (ii) Give the semantic review spawn the policy's existing worker-abandon bound and preserve the
         deterministic floor as the terminal authority. The reviewer remains advisory and may only
         downgrade; a provider stall therefore cannot hold the decision claim forever.
    (iii) Test both failure shapes through real seams: a fake git executable proves timeout and
          unreachable conversion, and the existing runReview behavioural harness asserts the
          reviewer spawn carries a positive idle-activity bound.
    (iv) Do not weaken the required-check or evidence gates and do not mint a second review for an
         identical input while one is genuinely active. The fix changes only liveness of the two
         bounded waits.
  acceptance:
    - claim: "a shared-pause git read has a named wall-clock bound and a timed-out or failed read becomes unreachable rather than freezing the daemon"
      proof: "unit test: real shared-pause git reads are bounded and convert git failures into unreachable"
    - claim: "the shared-pause bound is a named ten-second constant used by the real git invocation"
      proof: "grep: SHARED_PAUSE_GIT_TIMEOUT_MS in src/lib/fleet-control.ts"
    - claim: "a semantic review worker carries a positive idle-activity watchdog while the deterministic floor remains available"
      proof: "unit test: semantic review worker carries an idle-activity watchdog"
    - claim: "the review spawn uses the existing worker-abandon policy rather than a second hard-coded budget"
      proof: "grep: clockBound: { boundMs: loadDefaultPolicy().values.workerAbandon } in src/run-task.ts"
  falsifier: |
    Replace the fake git helper with a sleep longer than the bound: the test must fail if the read
    waits past ten seconds. Remove the `clockBound` field from the reviewer spawn: the behavioural
    harness must fail because its captured spawn args no longer carry a positive bound. A successful
    test run must include a node:test summary; a zero-test or ghost-path result is not evidence.
  note: |
    The task id was selected after the remote reservation namespace was observed through W1-T3968,
    but the local GitHub credential was rate-limited while attempting the atomic reservation. The
    implementation must re-run `rmd next-task-id --reserve` from an authenticated operator checkout
    before filing if the reservation ref is not already held by this session.
