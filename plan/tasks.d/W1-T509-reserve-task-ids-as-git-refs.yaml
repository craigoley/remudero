    `test/next-task-id-history.test.ts` (4). `taskIdReservationsDir(` — `src/run-task.ts` (4), plus
    one each in the module and two suites. `releaseTaskIdReservation(` matches NOTHING anywhere,
    which is design (iii)'s recommendation already being the status quo.
    **`src/run-task.ts` IS DECLARED DELIBERATELY AND THE COST IS ACCEPTED.** It is where the mint is
    called and where `taskIdReservationsDir` is consulted four times, so the wiring genuinely lives
    there; at ~19,900 lines `partitionByFileOverlap` (W1-T471) serialises this task against every
    other that names it. That cost is paid on purpose — avoiding it has already shipped two checks
    dormant.
    `test/next-task-id-history.test.ts` IS NOT DECLARED: it pins what the mint COMPUTES, which design
    (vi) forbids changing. A declared-but-untouched path fails `inverseScopeUntouchedFiles`
    (`src/lib/review.ts`) exactly as an undeclared one fails `scopeViolationFiles`.
    RULE 25 IS NOT ENGAGED: neither `src/` path matches an `INSTRUMENT_SURFACE` pattern and `test/`
    is excluded from `isProductPath`.
    EVERY CRITERION IS A NAME-FILTERED `unit test:` TITLE, NOT A PURE PATH — a pure path runs the
    whole file and one unrelated failure fails every criterion. Each of the four titles was checked
    to match zero files under `test/` today against a positive control matching one, and each is
    under 100 characters with no comma.
    THE NETWORK FIGURES ARE THIS HOST ON THIS DAY AND ARE NOT THE BRIEF'S. Reservation pushes ran
    1133/1163/1170/1220/1521 ms against an `ls-remote` baseline of 152/157/161 ms — a marginal cost
    near one second, roughly double the 0.55s/55ms carried into the brief from another session. One
    second per filing is still cheap; RE-MEASURE ON THE HOST THAT WILL PAY IT rather than quoting
    either figure. Every probe ref created for these measurements was deleted and the remote verified
    back to zero under both `refs/rmd-id/*` and the probe tag."
