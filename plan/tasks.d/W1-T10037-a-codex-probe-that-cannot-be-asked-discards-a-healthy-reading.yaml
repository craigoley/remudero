  design: |
    1. PERSIST THE LAST GOOD RAW READING. Each successful app-server exchange (rateLimits plus models, never auth
       material) is written atomically to `<config.root>/state/codex-capacity-last-good.json` with its read time and
       the Codex bin + home it came from. A file, not the module cache, because run children are separate processes
       and each probes on its own.
    2. CARRY IT FORWARD ONLY WHEN THE CHILD COULD NOT BE ASKED. When the exchange fails with failureKind `timeout`
       or `starved`, and the request is not `forceRefresh`, readCodexCapacity loads that reading (same bin + home) and
       projects each window: `projected = usedPercent + burnRate * age`. burnRate is the window's own average since
       it opened (`usedPercent / (now - (resetsAt - windowDurationMins))`) or the rate between two stored readings of
       the same window, whichever is higher. A window whose resetsAt has passed is dropped, and so is one with no
       duration. The reading is admitted only if every projected window stays below `100 - reservePercent`. The
       bound comes from the reading itself, so there is no fixed maximum age (Craig's no-hard-thresholds rule).
    3. THE ADMITTED READING IS SELECTED LIKE A FRESH ONE. selectCodexRuntime runs on it with the projected
       percentages, so model choice and the reserve apply unchanged. It is marked
       `carriedForward: { readAt, ageMs, failure }`, and `detail` names both the carry and the failure, so a decision
       record never passes a carried reading off as a fresh one.
    4. EVERYTHING ELSE STAYS UNREADABLE, WITH ITS REASON. That covers an RPC error, exit, spawn failure, malformed
       stdout, pagination, a missing toolchain, `forceRefresh` attribution reads, no stored reading, a different
       bin/home, and a projection that crosses the reserve. The failure backoff and the hedge are unchanged.
    5. TESTS in test/a-codex-probe-that-cannot-be-asked-carries-a-recent-reading.test.ts, `test(` titles verbatim as
       in the proofs. Use an injected spawn whose app-server never answers initialize, an injected clock and a temp
       config root; no real codex.
