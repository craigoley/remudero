  note: |
    THIS SUPERSEDES W1-T966 (#2094), WHICH IS OPEN AND UNMERGED AS THIS IS FILED. That shard covers
    ONLY the `renderIssueBody` half and declares src/lib/escalate.ts + test/escalate.test.ts. It was
    filed before the ledger half was established. Two open shards declaring src/lib/escalate.ts
    serialize against each other under W1-T471, and splitting the two writers across two shards is
    the concrete mechanism by which TWO identity vocabularies get emitted — the outcome design (iii)
    exists to prevent, since each shard would choose its own reader. #2094 SHOULD BE CLOSED
    UNMERGED IN FAVOUR OF THIS ONE. This is flagged rather than assumed: the operator gates it.

    W1-T915 (#1976) IS THE SIBLING, NOT THE DUPLICATE. That files the console's unreachability —
    a surface an operator cannot get to. This is the other half: a surface that IS reachable, and
    a message on it that still cannot say which machine it describes. Neither subsumes the other,
    and this task declares no file W1-T915 declares.

    src/run-task.ts IS DELIBERATELY NOT DECLARED, AND THAT IS A SCOPE DECISION WITH A MEASURED
    BASIS. It invokes `appendLedger` 48 times — the highest of any module — but design (i) puts
    the stamp INSIDE `appendLedger`, so not one of those 48 sites changes. Its only `renderIssueBody`
    hits are 2 comment references, not calls. Declaring it would serialize this task against the
    103 of 277 shards that already name it (W1-T471) and buy nothing. If an implementer finds the
    change genuinely must live there, they must amend this shard to declare it and accept that
    serialization cost in writing rather than overrunning into it.

    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT AT 3d91969, OWN PATH ABSENT.
    `appendLedger`: src/lib/ledger.ts = 9 (its home), then 19 other modules. `renderIssueBody`:
    src/lib/escalate.ts = 11 (its home), src/run-task.ts = 2 comments. For the escalation half the
    suite is test/escalate.test.ts — 8 word-bounded `renderIssueBody` hits, the highest of any test
    file, against test/decision-summary.test.ts at 6 and test/triage.test.ts at 4, both scoped to
    other tasks. For the ledger half THERE IS NO test/ledger.test.ts: ledger.ts is covered by eight
    concern-scoped suites (ledger-account-dimension, ledger-atomic, ledger-corpus-both-forms,
    ledger-grep, ledger-render-retention, ledger-repo-scope, ledger-rotation-convergence,
    ledger-rotation), so a new concern takes a NEW concern-scoped file — test/ledger-host-identity.test.ts
    — following that established pattern. test/ledger-rotation.test.ts is deliberately NOT declared:
    it owns the retention doctrine with 33 word-bounded hits on `DECISION_RELEVANT_LEDGER_STEPS` and
    `rotateLedger` against a control of 0 in test/escalate.test.ts, and retention is out of scope
    per design (v).

    risk: high IS SET UP FRONT AND THE BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. `moduleIdFromPath`
    strips the `.test` segment, so the four declared paths resolve to the subsystem ids `ledger`,
    `escalate` and `ledger-host-identity` — three, above `sizingViolation`'s threshold of two, so no
    file list satisfying this task's own scope could pass at risk:medium. Blast radius argues DOWN:
    one added field on an append and one added line in a render. The band is where the rule puts it.

    PROOF NOTES. Four criteria use the NAME-FILTERED `unit test:` form with a bare title — never the
    pure-path form, which against test/escalate.test.ts would pass on any of that suite's 1729 lines
    and prove nothing about this change. Each title is plain prose, under 100 characters, with ZERO
    commas, no `"; "` and no regex metacharacter, so `looksLikeScenarioNarrative` cannot fail
    proof-resolvability. All four were verified with `grep -rlF` over test/ to match 0 files today
    against a control title that matches 1 — they are forward references to titles this task creates,
    and they are titles rather than symbol names, so nothing here guesses an identifier.
    THE GREP PROOF'S DISCRIMINATION WAS CHECKED BY HAND WITH THE EXECUTOR'S OWN INVOCATION, because
    no local verb reports a stale match: `grep -arn -- 'hostname' src/lib/ledger.ts` returns 0 at the
    merge base, against same-invocation controls of `grep -arn -- 'appendLedger' src/lib/ledger.ts`
    = 9 and `grep -arn -- 'hostname' src/lib/drain-lock.ts` = 2. It therefore MISSES the base and can
    only match on head, so it cannot be downgraded to `executed_stale`. It is single-line, its pattern
    is file text rather than a path slug, and it carries no `" in "` inside the pattern.

    ID PROVENANCE — FOUR SURFACES, EACH WITH ITS OWN POSITIVE CONTROL, PLUS A RESERVATION THAT
    ACTUALLY LANDED. W1-T967 read 0 on all four at 3d91969: refs/rmd-id/* (63 refs enumerated,
    control refs/rmd-id/W1-T946 = 1), shard filenames and declared ids under plan/ (control
    W1-T965 = filename 1 / declared 11), EVERY OPEN PR'S FILE LIST, and EVERY OPEN PR'S TITLE.
    THE FILE-LIST SURFACE EARNED ITS PLACE ON THIS SWEEP: W1-T966 reads 0 in every plan/ path, 0 in
    refs, and 0 across open PR TITLES, yet reads 1 in an open PR's FILE LIST (#2094) — so the file
    list was the ONLY surface that showed it taken, and a sweep without it would have re-used a
    live id. Surface coverage was controlled rather than assumed: the open-PR query returned two
    PRs and four filenames, so the empty result for W1-T967 is a real absence and not a failed call.
    THE GATED PUSH SUCCEEDED, WHICH THE BRIEF DID NOT EXPECT. Orphan payload over the empty tree
    4b825dc642cb6eb9a060e54bf8d69288fbee4904, nonce Remudero-4078723-1787016416053720608, braced
    refspec, `--force-with-lease` with an empty expected value so the push could only create a ref
    that did not already exist, and the exit status captured into a variable rather than read
    through a pipe: PUSH_EXIT_CODE=0. The readback `git ls-remote origin refs/rmd-id/W1-T967`
    returned exactly the nonce commit b3608f5a79149950c5b6ef5995a584551ab0ae0b, matching. So this id
    does NOT rest on the sweep alone — it holds a real reservation ref as well.
