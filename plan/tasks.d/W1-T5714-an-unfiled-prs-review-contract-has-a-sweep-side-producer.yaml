- id: W1-T5714
  title: "AN UNFILED PR'S REVIEW CONTRACT HAS A SWEEP-SIDE PRODUCER — buildOpenPrViews takes the contract digest only from mainPlan.byId, so a PR-<n> or unfiled review can never be reused across heads, and a failed own-diff compare during hydration leaves no trace"
  repo: remudero
  depends_on: [W1-T5713]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high
  origin: "operator session 2026-10-04: research/flow/report.md (change-aware flow) item 9, the review subject"
  plan_refs: [W1-T5713, W1-T3704, W1-T3901, W1-T2299, W1-T2851]
  files: [src/run-task.ts, src/lib/review.ts, test/an-unfiled-prs-review-contract-has-a-sweep-side-producer.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a. `buildOpenPrViews` (src/run-task.ts) sets
    `currentContractDigest` only from `mainPlan.byId`, while `runReview` builds an unfiled PR's
    contract from `parseAcceptanceBlock(pr.body)` under id `taskId ?? PR-<n>` — so the two sides
    never match for an unfiled PR and `reviewReuseVerdict` always says full-review. It calls
    `hydrateReviewReuseFacts` without `onUnreadable`, so a failed compare is silent. MEASURED: 6 of
    the 21 identical-digest re-reviews after sweep updates (W1-T5713) were unfiled PRs. NOT FILED:
    narrowing the review SUBJECT to (diff tree, Acceptance digest, task record) — 5 of the 7
    checkable subject-freshness refusals were real changes (at most 2 of 8 saved: #8684, #9090),
    and W1-T2299 (merged) and W1-T2851 (blocked) treat a body edit as material; re-open if
    subject-freshness refusals on unchanged content exceed one a day.
  design: |
    `buildOpenPrViews` falls back to the body's Acceptance block, with the same id rule `runReview`
    uses, for a PR with no plan record, and passes `onUnreadable` to `hydrateReviewReuseFacts` so a
    failed compare writes one ledger row naming the PR and reason.
  acceptance:
    - claim: "an unfiled PR's body acceptance yields the same contract digest the review recorded, so an unchanged-diff head reuses its review, and a failed own-diff compare during hydration writes one row naming the PR"
      proof: "unit test: test/an-unfiled-prs-review-contract-has-a-sweep-side-producer.test.ts"
  falsifier: |
    Remove the body fallback: the unfiled fixture's digest is undefined, the verdict is full-review,
    and the test fails.
