  rationale: |
    The Mac run review-PR17299-1794115661039 positively records worker.assignment
    and worker.attempt, success=false, terminal isError=true and apiError=true,
    zero observed tokens and no served model. Stderr identifies expired OAuth.
    Yet runReview copies subtype=success into reviewerSubtype and the semantic
    row reports success. The production health reader consequently labels the
    withheld result withheld-success, a reviewer-code population, rather than
    withheld-failure. This is not proof that S6 caused or did not cause an incident.
    The same error is reported under the revert-labelled code; restoring auth alone
    cannot repair this consumer's contradictory result classification.
    Source at main 86d940cf823c: src/cli/commands/review.ts assigns reviewer.subtype
    without preserving its error flags; reviewerOutcome in src/lib/review.ts
    preserves signal/spawn/plan-only precedence but receives no worker flags.
    Evidence: Remudero-notes/sol/S6-Mac-auth-incident-reconciliation.json and
    S6-Mac-overlay-17299-worker-evidence.json. Main and eight captured open head
    trees were swept, with W1-T11459 positive controls on each. W1-T2564 concerns
    usage-refused drafts, W1-T11428 UNABLE verdicts, and W1-T11631 initial GitHub
    admission; none owns this contradictory API-error reviewer consumer.
    A sketch with the actual consumer, health classifier and fixture imports
    computes test/review at high confidence. No existing test is edited.
  design: |
    Preserve structured terminal error evidence at the existing runReview worker
    result boundary. When a result's subtype says success but apiError is true,
    record api_error; when isError alone contradicts success, record worker_error.
    Preserve existing non-success subtypes, plan-only and unattempted outcomes,
    spawn failures, signal rerun/termination precedence, genuine UNABLE handling,
    successful evaluations, proof execution and all publication/owner guards.
    Required semantic review remains withheld for a failed evaluator, including
    one that emitted superficially complete PASS lines. No retry, new provider,
    health threshold/state/filter edit, allowance reset or credential handling.
    Test the actual runReview consumer with contained fake worker envelopes and
    real local Git/proof fixtures, then feed its emitted row to the existing
    production health classifier. Check no publication or arm on error; normal
    successful, non-success, signal and UNABLE controls retain their meanings.
    No live model call is needed to diagnose or locally test the fix.
  acceptance:
