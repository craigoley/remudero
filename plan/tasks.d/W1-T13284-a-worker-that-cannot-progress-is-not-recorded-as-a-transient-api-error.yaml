- id: W1-T13284
  title: "A run whose worker cannot make progress is not recorded as a transient API error, so its verdict is a blocker the dispatcher holds and not a retry signal"
  repo: remudero
  priority: 0.6
  type: implement
  verify: auto
  principles:
