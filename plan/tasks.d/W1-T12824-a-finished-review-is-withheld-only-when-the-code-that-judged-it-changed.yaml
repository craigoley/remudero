  rationale: |
    WHY: finished reviews are thrown away. Each one cost a reviewer run, and the pull request waits for the next restart or the next pass.
    OBSERVED in the core ledger on the Azure host, 2026-11-14 06:45Z to 2026-11-15 06:45Z (rows de-duplicated):
    - review.posted 312. review.post_refused "reviewer code ... is materially behind origin/main" 20, on 12 pull requests, in two episodes. About 90 reviewer minutes were spent on reviews that were then withheld (run start to refusal).
    - All 20 were written by actor run_child (the run-child review path, W1-T9114). The in-process sweep path posted or ran from the fresh tree.
    - Episode 1, 2026-11-14 15:07Z to 15:22Z: 8 withheld. Main moved at 15:06:11Z to 8b221c208 (W1-T12300), which only compressed the comments of src/lib/task-linter.ts. 2 of the 8 reviews started before that merge, so a start reading would have posted them. The episode ended at the 15:33Z restart.
    - Episode 2, from 2026-11-15 06:30Z (still open at 06:45Z): 12 withheld, 1 posted. The daemon restarted at 06:21:44Z. At 06:22:30Z main took c79f9fd5b (W1-T12550, a gardener fix). Its src/run-task.ts hunks change one import line (adds worktreeRemoveIfPresent and its async sibling) and the garden dispose. No review-path code uses the new names, but the import line binds names that the review path uses, so reviewPathSpans counts the whole line. The sweep then asked "one fresh review of this head (W1-T11847)"; each re-run was withheld again (#18490, #18516, #18533, #18643 twice each).
    - In the same 24 h, main took 116 commits; 7 touched a file in REVIEW_MATERIAL_ADVANCE_PATHS, and only these 2 were judged material.
    READ at origin/main 952691269:
    - The refusal: src/lib/review.ts:12116 reviewerCodePublicationRefusal; the outbox drain discards at :12652. Materiality: src/lib/self-sync.ts:901 REVIEW_MATERIAL_ADVANCE_PATHS, :1050 reviewPathSpans (an import line counts when it binds any name the review path uses), reviewMainAdvance at about :826.
    - The sweep path asks buildReviewerCodeFreshnessGate (src/run-task.ts:2260). It reads at the start, routes a stale reading to the fresh tree, and passes the reading as reviewStartFreshness, so the start reading decides publication (operator ruling 2026-10-06, src/cli/commands/review.ts:150).
    - The run-child path does not. src/lib/sweep.ts:3440 hands a full review to installedWorkHost.spawnReview (src/lib/run-child.ts:1533). The child calls runDetachedWork (src/run-task.ts:44672) and runDetachedReview (src/lib/run-child.ts:1270), which calls reviewCommand with no start reading. src/cli/commands/review.ts:2480 then has no start reading, and the publication falls back to the just-in-time read.
    - W1-T12552 set freshnessRestart.minLifetimeMs to 3 hours, so a restart no longer clears the gap soon. Its aim is fewer restarts: each restart closes the repair lanes for the boot review pass and kills fix rounds in flight. This task keeps that policy. It does not restart the daemon, and it does not touch the restart score or any ceiling.
    W1-T12227 (priority 0.8, depends on W1-T12225 and W1-T12226) asks the same start reading for the run child in its criterion 2, among wider changes. This task does only that path and the two false positives, at priority 1.5, so the evidence above stops now. W1-T12227 keeps its other criteria. The fresh tree ran 2 times in these 24 h, both with exit code 0.
  design: |
    1. In src/run-task.ts add gatedDetachedReviewCommand(repoRoot, log). It builds the same gate the sweep builds in src/cli/commands/sweep.ts (about :270-:293): buildReviewerCodeFreshnessGate with checkReviewerCodeFreshnessAsync and buildFreshTreeReviewRunner on the same fresh-tree seams (the review worktree helper and spawnRmdReviewForFreshTree), and returns its call. Share the seam assembly with the sweep instead of copying it, if that keeps both callers simple.
    2. In runDetachedWork, pass ports.reviewCommand ?? gatedDetachedReviewCommand(...) to runDetachedReview. A run child that reads stale now runs the review from the fresh tree, and one that reads fresh carries the start reading to publication.
    3. In reviewPathSpans (src/lib/self-sync.ts), compare an import line of the old and new src/run-task.ts by the names it binds. The line meets the review path only when a name added or removed is used by reached code, or the module specifier changed. Keep every other rule.
    4. Add tokensEqualWithoutComments(oldText, newText) to src/lib/self-sync.ts. Use the TypeScript scanner, skip comment and whitespace tokens, and compare the rest. In the review materiality predicate, a changed .ts path in REVIEW_MATERIAL_ADVANCE_PATHS whose blobs at the merge base and at origin/main are equal by this test is immaterial. A read or scan failure keeps the path material.
    5. Tests reach the run child through runDetachedReview in src/lib/run-child.ts and the gate with a small host. They must not import #src/run-task.js (census:affected-reach). Add the c79f9fd5b and 8b221c208 shapes to test/a-reviewer-verdict-survives-unrelated-main-churn.test.ts as cases.
    INVARIANT no-verdict-from-changed-code: a terminal verdict posts only when the code that judged it was materially current at the start of the review, or the review ran from a fresh tree at origin/main.
    NOT IN SCOPE: the restart policy and score (W1-T12552, W1-T12230), the fresh-tree failure classes (W1-T12226), the fix-pipeline review runner and the stale-at-own-start retry (W1-T12227), and any ceiling.
  falsifier: |
    Let runDetachedWork call reviewCommand directly again, and criteria 1 and 2 must fail. Let the fresh-tree runner fall back to an in-process review, and criterion 3 must fail. Count a whole import line again, and criterion 4 must fail. Make tokensEqualWithoutComments keep comment tokens, and criterion 5 must fail. Restore and require all to pass.
