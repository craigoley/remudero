  design: |
    Converge cached Inbox page membership at a trustworthy completed replacement-population
    boundary, including when a publisher/worker restarts after committing replacement data but
    before every retire message is observed. Preserve the entire current qualified population.
    Keep pending, partial, malformed and foreign-scope evidence unavailable; such evidence must
    never authorize deletion or readiness. Remove stale per-key bookkeeping consistently so
    reloading or producer replacement cannot resurrect a retired cached page.

    Prefer the existing pending/body/drop/current protocol and existing population identity.
    Do not add a second cache owner, an unbounded rescan, a host-specific path or an invented
    success receipt. This task concerns materialized cached pages; it does not dismiss Inbox
    asks, close issues, mutate live stores, erase evidence or change any human decision.

    Exercise a shrinking population with real SQLite and an actual worker/publisher recovery
    path, plus deterministic incomplete/foreign/malformed controls. Observe current page keys
    and exact counts, not only a source grep or a fake body count. Add the regression before
    the fix, save the actual failed assertions, restore the fix and retain real test summaries.
    New imports use package aliases and the shared repository-root helper. Keep new cases in
    the four existing approved files; request scope normally if a required companion is absent.

