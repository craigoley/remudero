    active generation containing this fix, prove a legitimate shrink converges its cache so a
    standby with the same committed current population meets that original floor. Still refuse
    a genuinely thinner standby. Diagnose the single needs-you difference independently and
    preserve valid transient behavior; do not synthesize pages or count filler entries.

