- id: W1-T3156
  title: "THE DAILY DIGEST IS DELIVERED TO A FILE NO SURFACE READS — `digestCadence` fires on schedule and `inboxNotifyChannel` appends to `state/inbox-digests.json`, a channel that deliberately has NO `unavailable()` because \"a file write is always available\", so every digest reports success while reaching nobody; fourteen are stored, the console never opens the file, and the operator learned of the reports' existence only by asking why no email arrived"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  priority: 1
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 14.00
  files: [src/lib/serve.ts, test/a-digest-reaches-a-surface-the-operator-reads.test.ts]
