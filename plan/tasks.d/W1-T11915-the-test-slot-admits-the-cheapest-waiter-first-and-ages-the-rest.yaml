      proof: "grep: W1-T11915 criterion 3 in test/the-test-slot-admits-the-cheapest-waiter-first-and-ages-the-rest.test.ts"
    - claim: On the production path, the author preflight takes its suite ticket first and then prices its selection. Its still-waiting ticket then carries the same costMs that its capacity verdict later records in receipt.capacity, and the next heartbeat keeps that costMs. The ticket's name and arrival time are unchanged, so its arrival position is kept. A ticket that is never priced is ordered as an unpriced waiter, as criterion 1 defines.
      proof: "grep: W1-T11915 criterion 4 in test/the-test-slot-admits-the-cheapest-waiter-first-and-ages-the-rest.test.ts"
  rationale: |
    OBSERVED 2026-11-09: one author preflight of 74 minutes spent 24 minutes waiting for a test slot (measured admission granted one worker on an 8-core host whose own account was using about 990% CPU), and the capacity filing, a plan-only change that needs a few minutes of suites, was refused after a 45 minute wait behind heavier runs. The queue is strict arrival order (W1-T9950, W1-T9951).
    - Shortest-expected-job-first minimises mean wait when one server is the bottleneck, and a small plan-only run behind a long one pays the long one's whole runtime for no benefit to anyone.
    - Pure shortest-first starves a large job, which is why arrival order was chosen. Dividing a waiter's cost by its wait (or any equivalent ageing) keeps the order fair without a ceiling: every waiter's priority rises without bound while it waits.
    - Shortest-job-next needs each job's run time, known or estimated, before the job runs (https://en.wikipedia.org/wiki/Shortest_job_next). The ordering is therefore inert unless the live producer, the author preflight, hands its price to the ticket while the ticket waits. That handoff is folded in from W1-T12061 (criterion 4).
    - Settled by lookup: Is the handoff already filed? -> Yes, as W1-T12061. It is now withdrawn and superseded_by this task (plan/tasks.d/W1-T12061-the-author-preflight-gives-its-price-to-the-test-slot.yaml).
    - Settled by lookup: Is the capacity verdict known before admission? -> No. Its costMs is priceSelection's and reads no budget, so the preflight prices right after enqueueTestSlot (scripts/preflight-author.mjs).
    - Settled by lookup: Does a heartbeat keep a late field? -> Only through the closed-over record that beat() rewrites (src/lib/test-slot-queue.ts).
  design: |
    - Each ticket already carries the label and the selection the run was priced from; add the predicted cost (the capacity verdict's costMs, when known) to the ticket.
    - The next waiter admitted is the one with the lowest cost divided by one plus its waited time. Equal scores fall back to arrival order.
    - Price handoff (folded from W1-T12061):
      - OwnTicket (src/lib/test-slot-queue.ts) gains setPrice(costMs). It updates the record that beat() rewrites and writes the ticket again at once, so the price survives every later heartbeat.
      - TestSlotQueueHold (src/lib/test-slot.ts) gains setPrice too. It hands the price to its own ticket, and does nothing when no ticket was taken or the hold is already settled.
      - parseTestSlotTicket reads an optional costMs. A missing or malformed costMs is read as unpriced and never makes a ticket reapable.
    - The preflight keeps its order: it calls enqueueTestSlot first, then prices. Right after the enqueue it reads scripts/test-tier-manifest.json once and calls priceSelection(partial ? partial.suites : receipt.suites, manifest). It passes that costMs to queue.setPrice and only then starts the static stage.
    - The capacity verdict after admission reuses the same manifest. capacityVerdict's costMs is priceSelection's costMs and does not depend on the budget, so receipt.capacity.costMs equals the price the ticket waited with.
    - Do not wait for the post-admit capacityVerdict to set the price. It runs only after queue.admit() returns, when the ticket has already left the queue.
    - NOT IN SCOPE: the number of slots, the measured pool, memory and CPU admission, the heartbeat and reclaim policy, any wait bound, and what the preflight runs.
  falsifier: |
    Keep arrival order: criterion 1 must fail. Order by cost alone: criterion 2 must fail (the long waiter never gets in). Change reaping or the open-slot admission: criterion 3 must fail. For criterion 4, each of these must make it fail:
    - setting the price only after the post-admit capacity verdict;
    - dropping costMs on the next beat;
    - taking the ticket after pricing, or renaming the ticket when it is priced, either of which moves its arrival position.
    Restore and require all four.
  amendment: |
    2026-11-10, PLAN-expand-1794349444421, at the operator's request: fold in the production price handoff so that one credited task makes cheapest-first ordering live.
    - What changed: W1-T12061 is withdrawn and superseded_by this task. Criteria 1-3 and the ordering rule are unchanged.
    - Criterion 4 adds a production-path test. It shows that the preflight's ticket is priced after its selection is priced, and that it keeps its arrival position.
    - Shortest-job-next needs each job's run time, known or estimated, before the job runs (https://en.wikipedia.org/wiki/Shortest_job_next). Without the handoff, every live ticket is unpriced and is ordered as the median, so the queue still runs in arrival order.
    Settled by lookup:
    - Is the handoff already filed? -> Yes, as W1-T12061 (plan/tasks.d/W1-T12061-*.yaml). It is folded here and withdrawn so that one task is credited.
    - Does the capacity verdict exist while the ticket waits? -> No. scripts/preflight-author.mjs calls admitSuites() (queue.admit()) before it builds the budget from slot.concurrency and calls capacityVerdict. W1-T12061's design ("call it after capacityVerdict prices the selection") would therefore price a ticket that has already left the queue.
    - Does the price depend on the slot? -> No. capacityVerdict's costMs is priceSelection(suites, manifest).costMs, and priceSelection reads no budget (scripts/preflight-author.mjs). So the same cost can be computed right after enqueueTestSlot.
    - Does a heartbeat keep fields added later? -> Only through the closed-over record. takeTestSlotTicket's beat() rewrites { ...current, heartbeatAt } (src/lib/test-slot-queue.ts), so setPrice must update `current`.
    - Is the work claimed or in flight? -> No. There are no plan/claims.yaml rows for W1-T11915 or W1-T12061, and no test file for this task exists yet.
