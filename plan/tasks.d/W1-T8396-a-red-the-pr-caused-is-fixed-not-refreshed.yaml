  falsifier: |
    Leave `fixedOnMain` as `behindMainByPr > 0` alone. The plan-only-delta head then refreshes and never reaches
    the fix lane, so the first test fails. Skip the trial-merge probe and the second test refreshes a red the
    merge keeps. Keep `refreshed` keyed by `pr@head` and reading only the sweep's own steps, and the third test
    sees the fixed-on-main arm refresh the head the fix rung's refresh produced. Gate every refresh off and the
    fourth test fails.
