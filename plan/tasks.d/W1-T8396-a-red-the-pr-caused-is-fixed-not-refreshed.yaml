    THE PATHS, read on origin/main 38470cc40 (symbol names, not line numbers):
      - The second refresh is W1-T6405's fixed-on-main arm in `runSweep`'s blocked-fixable case (src/lib/sweep.ts):
        `verdict === "clear" && (previouslyReproduced || fixedOnMain) && !baseRedHistory.refreshed.has(key)`, where
        `fixedOnMain` is only `behindMainByPr > 0`. A failing test that PASSES on main is read as "main fixed it".
        It is just as consistent with "the PR broke it": main never had the PR's change. Nothing checks that
        main's delta since the head's own base could reach the failing test, or that merging main clears it.
        `fixedOnMainTestFiles` (the stalled-stage arm, W1-T6433) makes the same inference.
      - Neither arm sees the other's refresh. `baseRedHistoryFromLedger` keys `refreshed` by `pr@head` and reads
        only `sweep.base_red.refresh` / `sweep.base_fixed.refresh`; the fix rung's `fix.base_refreshed` is not in
        it. A refresh MAKES a new head, so every arm is once per head, never once per red. Here the second arm
        refreshed the very head the first arm's refresh produced, on the same check and the same failing file.
    W1-T8042 is the opposite case (a red inherited from main worked as each PR's own) and must stay working.
    OVERLAP WITH W1-T100 (same files): W1-T100 routes blocked_ci to the ci-log fix path. This task does not change that
    path or its ladder. It changes only WHEN a refresh arm may merge main instead of letting that path run.
  design: |
    1. A REFRESH NEEDS EVIDENCE IT CAN CLEAR THE RED. Before any refresh arm acts on a red whose failing test
       files are known (the fix rung's `decideRedBaseRefresh` exact-path arm, the sweep's fixed-on-main and
       base-red refresh arms, and the stalled-stage `fixedOnMainTestFiles` arm), decide whether merging main can
       change the outcome:
       a. CHEAP PRE-FILTER. Read main's changed paths since the head's merge base with main. When none of them
          is a failing test file, a module in a failing test file's import closure (the existing import graph
          in src/lib/affected-suites.ts), or a CI harness path (`isCiHarnessPath`), main cannot change the
          result. No refresh, no probe. (The #11017 second refresh: three plan files.)
       b. PROBE THE MERGED TREE. Otherwise run the failing test files on a local trial merge of the head with
          main's tip, reusing the base-reproduction probe machinery (`buildBaseReproductionProbe`, its cache and
          its `BASE_REPRODUCTION_MAX_FILES` refusal). Red on the merged tree: the refresh cannot clear it, so do
          not refresh. Clear: refresh as today. Unrunnable or partial: keep today's behaviour and name why.
       Each decision writes one ledger row naming the arm, the files, main's sha and which evidence decided.
    2. A RED THE REFRESH CANNOT CLEAR IS THE PR'S OWN. When step 1 refuses a refresh, the round proceeds as an
       own red: the fix rung spends its strike and dispatches its worker, and the sweep routes the head to the
       fix lane, exactly as for any own red. Add no new strike rule.
    3. A REFRESH THAT LEFT THE SAME RED IS NEVER REPEATED. Key refreshes by PR and red signature (check name plus
       failing test files, or the harness-path set for a fileless red), not by `pr@head`, and read every refresh
       step (`fix.base_refreshed`, `sweep.base_red.refresh`, `sweep.base_fixed.refresh`). After a refresh, a head
       red on the same signature gets no further refresh from any arm until main changes a path step 1a would
       count. A fileless red (W1-T8038's harness arm) is bound by this rule too.
    4. KEEP THE BASE CASES. A red that reproduces on main still stands down with no strike (W1-T5528, W1-T6024).
       A red main really fixed (the test fails at the head's merge base and passes on the merged tree) still
       takes main once with no strike (W1-T6405). W1-T7445's PR-added coverage lines still take a strike.
    5. NO FIXED BOUNDS. The pre-filter is a path test, the probe an observed outcome. Add no count, timer or
       wall-clock threshold.
    Tests go in the new file test/a-red-the-pr-caused-is-fixed-not-refreshed.test.ts, with `test(` titles exactly
    as in the proofs below. Build the #11017 shape: a head whose own src change breaks an untouched test, main
    ahead by commits that touch only plan/ files, and a recorded clear probe at main's tip.
