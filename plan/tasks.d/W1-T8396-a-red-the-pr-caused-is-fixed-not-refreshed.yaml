    - claim: "a head a refresh left red on the same signature is not refreshed again by another arm"
      proof: 'grep: test("W1-T8396: a refresh that left the same red is not repeated by another arm" in test/a-red-the-pr-caused-is-fixed-not-refreshed.test.ts'
