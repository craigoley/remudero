    isHumanHoldCandidate (src/lib/open-prs-rest.ts) recognises a standing human
    hold. Settled by lookup: do WRECK-T1..6 or Console149/150 need re-filing or
    hold changes? -> no. They live in their own plans with their holds, original
    budget 30 and the reserved 7..9 roadmap. This task associates a product plan
    with them and releases nothing (plan/feedback/fb-1793059243092-5bfa75.yaml).
    SUBJECT SWEEP: the operator's audit (/tmp/product-c3-subject-sweep.json,
    2026-10-27T12:07:56Z) read main 5d693800 and 10 open heads and found zero
