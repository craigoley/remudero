  design: >-
    One versioned operation that is natively owned and recoverable. It is not a
    new launcher. (1) Request. Add one versioned plan-proposal action to the
    existing served product case union in product-routes.ts and serve.ts. Its
    input is productId, expectedRevision and expectedObjectiveRevision, plus a
    requestId. It never accepts a caller-supplied PR, brief text or budget. The
    operation reads the durable saved product. It refuses with an explicit code
    in each of these cases: no verified repository binding; target enrollment,
    head or onboarding (bootstrapConfirmed) that does not verify against the live
    target; no resourceEnvelope on the brief (no default is invented); a stale
    revision. It freezes the exact product revision, the brief digest and the
    verified target head in its durable record. (2) Hand-off. The served
    composition passes the existing ratifyCliGateway hand-off into the operation.
    The operation then runs the existing rmd plan verb ONCE, as a child process
    from the fetched origin/main tree. The child runs with --repo-root set to the
    verified managed target checkout. Use --mode=clarify when the target plan at
    the verified head already holds a legitimate frontier, which reconciles it,
    and --mode=create only when it holds none. The brief argument is
    productCasePlanText(brief), the constraints, the resource envelope and the
    operation id, within the existing request byte limits. Library code never
    imports planCommand or any src/cli or run-task internals. No browser shell,
    detached fallback, unit or persistent service is added. Spending,
    architect-tier, the task-ID block reservation, relint, plan-only and
    PR-ownership guards all stay inside the existing verb, unchanged. (3)
    Durability. Key the operation by product id, frozen revision, brief digest and
    target head. Persist it through ProductIntentStore stage evidence (stage plan,
    outcome proposed, queued or unknown) BEFORE the hand-off. Repeated requests,
    reloads, lost responses and a daemon restart all read the same record, so
    they cause no second model spend, ID block or task. Recovery reads only the
    durable record and the correlated core-ledger rows (plan.start carrying the
    operation id, pr.opened, review and merge). It never infers recovery from a
    branch name or a marker. A child that exits without a correlated pr.opened
    row stays refused or unknown and is never retried silently. If the brief
    revision or the target head changes, the operation reports changed-brief or
    stale-target. It never reuses the old plan. A queued or open proposal is
    never reported as approved or merged. (4) One verification rule. Replace the
    hand-coded checks with ONE exported verifyProductPlanEvidence. Both
    ProductCaseService and ProductBuildService.start call it. It requires all of
    the following:
    the PR is merged into the target default branch of the verified repository
    id; a trusted remudero-review success status sits at the exact PR head,
    resolved through resolveReviewProvenance rather than a generic green badge
    or comment wording; the existing native plan-only review and lint verdict
    record covers that PR and head; no standing CHANGES_REQUESTED review or
    human hold exists (isHumanHoldCandidate); the task content is the same at the
    reviewed head, the merge and the current target head (digest), so any
    post-review drift refuses; the design carries productCasePlanText(brief)
    and the envelope; the task budget_usd does not exceed envelope.budgetUsd.
    It does NOT require a GitHub APPROVED review when the native contract holds.
    It refuses foreign, stale, missing or ambiguous receipts. (5) Provenance
    for an existing frontier. A task whose origin equals productPlanOrigin
    passes as it does today. A legitimate pre-existing task (WRECK-T1) keeps its
    original id, history and origin. It passes only when its reviewed design
    carries the productPlanOrigin token, and the product record holds an explicit
    association entry naming the task id, its original origin and the exact
    PR/head/merge. Never rewrite origin. (6) Enforcement. Before admission,
    ProductBuildService.start refuses a build whose verified plan budget exceeds
    the envelope, or that would exceed envelope.maxConcurrentBuilds active
    builds for the product. Showing the envelope is not enforcement. Out of
    scope: Console UI saving or freezing screens beyond this request, W1-T10618's
    evidence collectors and its acceptance instrument, the W1-T10799 execution
    path, any change to the rmd plan verb's gates, hold releases, cap or budget
    increases, access or runtime config changes, and the first gameplay build.
    That build is admitted only through the signed-in Console C4 UI. Declare the
    new action's authenticated request, response and failure schemas in
    openapi/daemon.yaml. Regenerate packages/api-client/src/schema.d.ts with the
    maintained generator. Prove the served operation through the real default
    transport and the verified-actor guard in
    test/console-api/serve/product-routes.test.ts, and register it in
    test/route-wiring.test.ts.
