  rationale: >-
    Core18 C3 is the step from a saved product brief to a native target plan. It
    was carved out of W1-T10618 as one narrow functional task, and W1-T10618 now
    depends on it. This is a plan-only filing (run PLAN-clarify-1793103032747).
    It edits no source and releases no hold. OBSERVED CODE (worktree base): the
    plan action in ProductCaseService (src/lib/product-case.ts) only calls
    verifyPlan on a pull request the caller supplies. Nothing produces or
    reconciles a target plan. verifyPlan requires a latest GitHub APPROVED review
    at the PR head. It also requires task.origin === productPlanOrigin(...).
    ProductBuildService.start repeats that strict origin comparison on its own
    (src/lib/product-build.ts, the task_stale check). So two consumers each
    hand-code the plan rule. The real Wreckterra plan PR1 (head 84d3f549, merge
    1e55f963) carries native COMMENTED reviews, a remudero-review PASS 7/7 and a
    changed-plan lint of 6/0, but no GitHub APPROVED review. WRECK-T1's origin is
    operator-request#wreckterra-console-product-2026-10-25, so today's rule can
    never accept that legitimate held frontier. productBriefSchema already has an
    optional resourceEnvelope {budgetUsd, maxConcurrentBuilds,
    existingSetupOnly} (src/lib/product-intent.ts). Nothing requires or enforces
    it before a build. Settled by lookup: is this already filed or already
    decided? -> partly. The W1-T10618 rationale kept "the C3 plan producer, the
    native-review protocol and the evidence collectors" in W1-T10618. No other
    shard, DECISIONS.md, LEARNINGS.md or MASTER-PLAN.md entry files them. The
    producer and protocol are now this task, and the evidence collectors stay in
    W1-T10618 (plan/tasks.d/W1-T10618-*.yaml). Settled by lookup: is W1-T10619
    or W1-T10799 a plan producer? -> no. W1-T10619 is evaluation proposals and
    W1-T10799 is bounded target execution (plan/tasks.d/W1-T10619-*.yaml,
    plan/tasks.d/W1-T10799-*.yaml). Settled by lookup: is there an existing native
    plan workflow that can target another repository? -> yes. The global
    --repo-root flag sets repoRoot (resolveRepoRoot, src/lib/repo-location.ts).
    planCommand (src/run-task.ts) resolves owner/repo, the managed clone under
    repos/<repo>, the history-aware task-ID mint and the remote ID-block
    reservation, lint-plan relint, the plan-only PR guards and reviewCommand from
