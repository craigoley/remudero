        original origin and id, and it refuses foreign, stale or missing receipts,
        post-review drift, a standing human hold and an over-envelope budget"
      proof: "unit test: test/infra/product-plan-verification.test.ts"
    - claim: "the product build consumer calls the same verification rule"
      proof: "grep: verifyProductPlanEvidence( in src/lib/product-build.ts"
    - claim: "the product case consumer calls the same verification rule"
      proof: "grep: verifyProductPlanEvidence( in src/lib/product-case.ts"
    - claim: "the served plan-proposal operation matches its authenticated API
        contract through the real default transport"
      proof: "unit test: test/console-api/serve/product-routes.test.ts"
  falsifier: >-
    Remove each of these independently: the durable operation key, the
    exact-head trusted-status check, the reviewed/merged/current digest
    comparison, the human-hold refusal, the association check (forging origin
    instead) and the envelope enforcement. Each corresponding test must fail
    against the same real-durable-file fixture and pass once the piece is
    restored. The hand-off test must spawn a real child executable through the
    default gateway and read the real ledger rows that child writes. The
    GitHub reads must go through the default ghTextAsync transport. Fakes alone
    never prove the default path. Fixture receipts never count as live
    Wreckterra plan, review or merge evidence.
