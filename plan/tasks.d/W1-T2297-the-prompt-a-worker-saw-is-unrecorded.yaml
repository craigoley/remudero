    - claim: "the rendered worker prompt is byte-identical with the manifest wired and without it"
      proof: "unit test: test/prompt-manifest.test.ts"
    - claim: "no manifest row ever carries prompt text"
      proof: "unit test: test/prompt-manifest.test.ts"
    - claim: "an absent optional part is recorded as absent rather than as empty content"
      proof: "unit test: test/prompt-manifest.test.ts"
    - claim: "the spawn path calls the manifest helper rather than shipping it unreached"
      proof: "grep: buildPromptManifest( in src/run-task.ts"
