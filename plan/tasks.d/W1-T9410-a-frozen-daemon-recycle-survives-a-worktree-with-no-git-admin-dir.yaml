    - claim: "the matching worktree is still named in the reason file beside the stray one"
      proof: 'grep: test("W1-T9410: the reason file still names the holder worktree beside a stray one" in test/a-frozen-daemon-recycle-survives-a-worktree-with-no-git-admin-dir.test.ts'
  falsifier: |
    Against main, add to the W1-T6597 fixture one worktree whose .git names a missing gitdir. Run the STALLED
    recycle with GNU sed. It exits 2 right after the RECLAIMING line, the lock is not moved, and the PAUSE stays.
    On macOS, BSD sed exits 1 for the same missing file, so the abort happens there too.
