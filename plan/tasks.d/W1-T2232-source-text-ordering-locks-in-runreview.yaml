    - claim: "the withdrawal is observed before the status post through the injected disarm and the gh argv log"
      proof: "unit test: test/wiring-ordering-behaviour.test.ts"
    - claim: "the arm is observed after the review posted ledger line through the injected arm and the ledger file"
      proof: "unit test: test/wiring-ordering-behaviour.test.ts"
    - claim: "each rewritten assertion fails when its ordered effect is never reached at all"
      proof: "unit test: test/wiring-ordering-behaviour.test.ts"
    - claim: "refactoring the ordered call sites leaves every rewritten assertion green"
      proof: "unit test: test/wiring-ordering-behaviour.test.ts"
