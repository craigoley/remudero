  note: |
    NOTHING IS DELETED AND NOTHING IS RELAXED. Every property these three tests prove is REAL and must
    keep holding after the rewrite: `judgeRubric` strictly after the binding verdict and fail-open; the
    withdrawal beating the post to GitHub (#973); the arm following the `review.posted` ledger write,
    because that line IS the evidence W1-T230's gate reads. No assertion is removed, none is weakened
    to a substring that matches anything, and no platform skip is added — W1-T1051 is the standing
    warning about an assertion a comment could satisfy, and #2735's shape is the answer to it: match
    ONE call, snapshotted at the moment the effect is reached, plus a reached-ness assertion so a green
    can never survive the work never running.

    TWO TRAPS MEASURED ON THIS PATH, BOTH INHERITED FROM #2735 AND NEITHER TO BE CHASED. (a)
    `test/worker.test.ts`'s W1-T2205 end-to-end test reads 66/67 on an UNMODIFIED tree on darwin,
    because `runReview`'s `spawnWorker` call takes no keychain seam and darwin runs the real
    `ensureWorkerKeychain`, which refuses headlessly. Pre-existing; do not chase it and do not add a
    platform skip — #2735's two-observer snapshot is the pattern that survives it. (b)
    `live-write-guard` refuses `gh-pr-merge` by checking the CALL, not the destination, so a
    PATH-stubbed `gh` is not enough; inject a no-op `disarm`.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 4 distinct subsystems/concerns (arm-on-passing-verdict, arm-ordering, review,
      wiring-ordering-behaviour) at risk:medium — Rule 19: raise to risk:high or decompose into one
      task per concern

    Rule 19 derives the concern from each declared path's STEM, so four test files read as four
    concerns even though all four are the SAME seam — ordering assertions inside `runReview`'s body,
    every one of whose effects `runReview` already exposes an observer for (§5). Decomposing them
    would mean three PRs building the same harness three times. AND THE BAND EXEMPTS RATHER THAN
    CLEARS: `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` on its first line at
    `risk: high`, so that refusal is the only scoring of this span this shard will ever get — recorded
    here because nothing downstream will re-derive it. The actual blast radius is nil in production:
    this shard changes no source file, deletes no test, and moves no gate.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH, AND NONE NAMES AN EXISTING TEST FILE. Every criterion
    uses the pure-path `unit test:` form naming `test/wiring-ordering-behaviour.test.ts`, which is
    declared in `files:` and DOES NOT EXIST on this tree — so on this filing PR each resolves through
    W1-T456's forward-reference carve-out to `not_yet_built`. Falsified in the other direction:
    the same form naming an existing path (`test/review.test.ts`) EXECUTES and would be graded on its
    result, which is the shape that red-lined #2707.
