  note: |
    ── Q1. WHAT THE CHECK SHOULD DISTINGUISH, WHAT DISCRIMINATES, AND WHAT ONLY APPEARS TO ──────

    (i) `--fail` IS A REAL IMPROVEMENT AND AN INCOMPLETE ONE. It makes curl exit non-zero on
    http >= 400, which separates a 403 or 407 block page from a served 200. That is strictly more
    than today. It does NOT settle the case, because an interception proxy is free to answer 200
    with a synthesised body, and `--fail` would read that as a reached upstream exactly as the
    current check does.

    (ii) A STATUS CODE ALONE ONLY APPEARS TO SETTLE IT, AND THE SHARD SAYS SO RATHER THAN LETTING
    A BUILD DISCOVER IT. Capturing `%{http_code}` is the same information as `--fail` with more
    resolution; it has the same blind spot for a synthesised 200. A build that adds a status code
    and calls the question closed has moved the boundary of the blindness, not removed it.

    (iii) A RESPONSE-SHAPE TEST DISCRIMINATES BUT COSTS THE PROPERTY THE PROBE WAS BUILT WITH.
    Comparing the body against something known about the real upstream would separate a
    synthesised page from a served one — but it requires FETCHING the body the probe deliberately
    discards, and it pins the check to a third party's markup, which drifts. NOT RECOMMENDED
    WITHOUT AN EXPLICIT RULING, and named here so it is rejected on the record rather than by
    omission.

    (iv) THE TRANSPORT FACTS DISCRIMINATE AND COST NOTHING EXTRA. `curl`'s `-w` already exposes
    `%{remote_ip}` and `%{num_connects}` on a request the probe is ALREADY making, with the body
    still discarded. If the non-allowlisted host and the allowlisted control both terminate at the
    same local address, one proxy answered both and "the upstream was reached" is unsupported —
    which is precisely the fact the model reconstructed by hand. This is the cheapest honest
    discriminator available and the build should weigh it first.

    (v) AND IT ADDS NO COMMAND, WHICH IS THE POINT. `probeCommandCount`
    (`containment.ts:528-531`) counts prompt lines matching `/^\d+\)/gm` — NUMBERED ENTRIES, not
    shell invocations. The egress check is entry `4)` and ALREADY carries two `curl` calls inside
    that one entry. So flags added inside entry 4 leave the count at 6 and `probeTurnBudget`
    (`:571-573`) unchanged at `6 + 1 + 3 = 10`. A SEPARATE NUMBERED `7)` WOULD RAISE THE CAP TO 11
    AUTOMATICALLY (W1-T2201's derivation, working exactly as designed) — that is a legitimate
    option, but it should be a decision about a named cost and not a side effect nobody intended.

    (vi) AND THE THREE-STATE VOCABULARY ALREADY EXISTS; THIS ARM SHOULD USE IT. `contained` /
    UNPROVEN / PROVEN-BROKEN is the epistemology `assessContainment` already expresses. What is
    missing is not a fourth state but the honesty to return UNPROVEN when the evidence supports
    only "something answered". A response with no discriminating detail is UNPROVEN, not proven
    anything.

    ── Q2. WHAT THIS DOES TO W1-T1289 ──────────────────────────────────────────────────────────

    (vii) ITS PRIMARY CLAIM SURVIVES AND IS STRENGTHENED. Nothing in this tree enforces the
    allowlist. The two readers are `src/lib/settings.ts:152-166`, a NARROWING guard that refuses
    any domain outside the pinned set, and `containment.ts:708-716`, whose own doc reads "THIS
    READS THE ALLOWLIST AND NEVER WRITES IT — the probe observes; it does not enforce". The only
    declared hook is a `PreToolUse` filesystem tripwire whose own header says "no network" and
    "It is a tripwire, NOT a sandbox".

    (viii) BUT ITS UNBLOCKING CONDITION IS UNREACHABLE BY THIS INSTRUMENT, AND THAT MUST BE SAID
    PLAINLY. W1-T1289 sits `status: blocked` awaiting the probe reading `proven-holding`. That
    verdict requires `egressDenialSeen` to be the deciding branch — and `:740` returns
    PROVEN-BROKEN first whenever curl got any response at all. On today's evidence that is 90 of
    97 rows, 68 of which ALREADY carry a seen denial. AN INSTRUMENT THAT READS CURL EXIT CODES
    CANNOT PRODUCE `proven-holding` IF EVERY REQUEST RETURNS SOMETHING, however well the sandbox
    is behaving. The condition is not a high bar; it is one this measurement cannot clear.

    (ix) SO THE ORDER IS: FIX THE INSTRUMENT, THEN RULE. W1-T1289 IS CITED, NOT RE-FILED, AND ITS
    `status: blocked` IS NOT CHANGED BY THIS TASK. A build here must not touch that shard.

    ── Q3. WHAT MUST NOT CHANGE ────────────────────────────────────────────────────────────────

    (x) THE EGRESS ARM STAYS OBSERVATIONAL, NOT GATING. It is recorded on the row and never
    thrown on, and that must survive this task. It is too blunt to gate on today and it will
    STILL be blunter than the filesystem arm after any fix here: the filesystem arm observes an
    OS-level denial directly, while this one infers a network policy from a client exit code.

    (xi) THE PROBE STILL FAILS CLOSED. W1-T1265. Nothing here relaxes, skips, samples or
    thresholds the containment gate, and the filesystem arm's authority is untouched.

    (xii) `allowedDomains` IS NOT WIDENED AND `api.anthropic.com` STAYS ABSENT. This task changes
    what the probe can SEE, never what the policy permits, and it must not edit
    `settings/worker.json` — which is not in its `files:`.

    (xiii) AND NOTHING IN THIS TASK MAKES AN OUTBOUND REQUEST TO CHARACTERISE example.com. That
    is the test the recon refused and this shard refuses too. A build may add flags to a request
    the probe ALREADY makes inside its own sandbox; it may not add a new destination, a new fetch
    from the host, or any call whose purpose is to learn what that host serves.

    (xiv) RULE 19 BAND. `risk: high` is set UP FRONT because the sizing check reads `files:` as
    spanning two concerns — the `containment` stem and this task's own test stem — and refuses
    that at `risk: medium`. THE BAND IS THE SPAN READING AND NOT A BLAST-RADIUS JUDGEMENT: the
    change adds observation to one command and one verdict function, and gates nothing.
