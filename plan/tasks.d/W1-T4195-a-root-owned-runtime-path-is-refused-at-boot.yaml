  rationale: |
    READ 2026-09-23 AT origin/main b5c2804 during a backlog triage of feedback entries still at `status: new` that no plan record cited. File:line citations are from that read and are approximate (~); re-verify at your head before relying on them (binding rule: distrust the prompt over the installed code).

    OBSERVED: neither deploy/entrypoint.sh nor deploy/recycle-container.sh contains any ownership or writability
    check (no chown, `test -w` or equivalent).
    The two reports describe the same class twice: state/ledger.ndjson left root-owned (fb-1789957498656-362d42), and git
    administration paths under the checkout left root-owned (fb-1789959757208-462e0b). Either one turns every appendLedger
    or git fetch into an EACCES after the container is already running.

    ALSO REPORTED AS: fb-1789957498656-362d42.

    risk: high is Rule 19's span, not blast radius.

    VALUE (triage estimate): high.
  design: |
    (i) At container start, before the daemon is launched, check that the runtime user can write the ledger file, the
        state directory, and the checkout's .git refs, logs and worktrees directories. (ii) A failure exits non-zero naming
        the first unwritable path and its owner; it never chowns on its own, because a privileged repair is an operator
        act. (iii) The check reads the filesystem only and is driven by a test against a fixture tree.
