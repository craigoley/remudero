    under the existing DEFAULT_KNOWLEDGE_BUDGET_CHARS budget (src/lib/learnings.ts) ALONGSIDE
    whatever else is already in the real tree (never assume it is the only entry), and that
    its rendered body (via renderSkillsPart) appears VERBATIM inside # CONTEXT (not after
