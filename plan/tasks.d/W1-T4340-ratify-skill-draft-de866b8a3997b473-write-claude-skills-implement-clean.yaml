    the file's final content (after the comment edit in (i)) -- a regression here would
    mean the ratified file itself is one this fleet's own gate would have refused to stage.
    (iv) DO NOT touch describeWorkerSkillReachability, stageSkillDraft, or any other
    skill-workshop.ts function -- that staleness is a SEPARATE, general defect (every
    skill-draft proposal's summary line, not just this one) and is filed on its own (W1-T4341).
