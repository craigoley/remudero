    VERBATIM, including every "[src: run#...]" line and the "Filed under:" task-id list --
    Standing rule 17 provenance, and the evidence for WHY this procedure is trusted.
    (ii) PROVE REACHABILITY AGAINST THE REAL TREE, not a synthetic fixture. The new test
