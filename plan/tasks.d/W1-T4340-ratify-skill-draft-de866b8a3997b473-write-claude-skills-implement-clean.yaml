  rationale: |
    RATIFIES skill-draft:de866b8a3997b473 -- a candidate mined by mineProceduralCandidates
    (retro.ts, W1-T87/P13) from 82 merged implement runs sharing the clean_single_strike
    signal (a run that resolves on its first attempt, never reaching fix.dispatch), drafted
    as a Claude Code skill by renderSkillDraft (src/lib/skill-workshop.ts) and staged into
    the inbox by stageSkillDraft under Rule 15 (the Architect proposes, the operator
    ratifies the write under .claude/skills/).

    THE PROPOSAL'S OWN "NOT REACHABLE" LINE IS STALE. It was generated by
    describeWorkerSkillReachability([]) (src/lib/skill-workshop.ts), which answers ONE
    question: does the Claude Code SDK's NATIVE project-scoped resource loading (gated on
    settingSources.includes('project')) see a repo-owned .claude/skills/<name>/SKILL.md?
    spawnWorker passes settingSources: [] (src/lib/worker.ts), so the answer is correctly
    "no" -- but that is NOT how a skill reaches a worker in this fleet any more. W1-T3101
    (merged) built and wired a SEPARATE, independent route: loadInjectableSkills reads
    .claude/skills/<name>/SKILL.md directly off disk via readdirSync/readFileSync
    (bypassing the SDK and settingSources entirely), selectSkillsForTask picks the ones
    whose applies-to: frontmatter names the dispatched task's type, and
    implementPromptParts/renderImplementPrompt (src/lib/prompt-render.ts) inject the
    matched skill's body into the CONTEXT block of every implement worker's prompt --
    ledgered (the skill.staged / skills.injected shape) exactly like matchedLearnings.
    W1-T3101's own design clause (v) states in as many words that widening settingSources
    "is NOT the fix", so the SDK-native route this draft's summary measured was
    DELIBERATELY never going to open.

    THIS DRAFT ALREADY CARRIES THE ONE THING THE REAL ROUTE NEEDS: renderSkillDraft
    computed appliesTo = injectableSkillTaskType(candidate.taskType) for this candidate's
    taskType "implement", which IS one of the five injectable task types
    (INJECTABLE_SKILL_TASK_TYPES), so the rendered frontmatter already carries
    applies-to: implement -- visible verbatim in the staged proposal's own markdown. Once
    this file exists at .claude/skills/implement-clean-single-strike-de866b8a/SKILL.md,
    loadInjectableSkills('.claude/skills') WILL discover it (it has a SKILL.md, it has a
    frontmatter block, SKILL_APPLIES_TO_RE matches its applies-to: line) and
    selectSkillsForTask(skills, 'implement', DEFAULT_KNOWLEDGE_BUDGET_CHARS) WILL select it
    for every implement task -- so ratifying and writing this file is NOT dead weight; the
    proposal's discouraging framing is simply measuring the wrong mechanism.

    .claude/skills/ is git-tracked for exactly this file shape (.gitignore:63-70, the
    W1-T2763 exception carved beside .claude/settings.json), and the two skills already
    there (tddr, grfp, scripts/generate-macro-skills.mjs) are disable-model-invocation
    macros with no applies-to: -- this would be the FIRST skill on this fleet that a
    worker's prompt actually receives through the injection route, so its own end-to-end
    proof matters more than usual: a test against a SYNTHETIC tmpdir tree (as W1-T3101's
    own suite uses) would prove the MECHANISM works, not that THIS FILE, on disk, at its
    real path, is wired up correctly.
  design: |
