      proof: "unit test: W1-T2931: the sweep stops fanning out at the host budget"
    - claim: "a board larger than the budget is processed across passes rather than all at once"
      proof: "unit test: W1-T2931: a board larger than the budget spans passes"
    - claim: "the review lane keeps its width when the sweep respects the ceiling"
      proof: "unit test: W1-T2931: review width survives a bounded fan-out"
