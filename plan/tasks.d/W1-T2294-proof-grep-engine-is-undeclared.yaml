    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. The declared files cross the linter and the
    reviewer/parser; the change itself is small. The band records the span.

    THE EXPOSURE IS ZERO TODAY AND THE SHARD SAYS SO FIRST. If a build finds that unattractive, the
    honest response is to close this unbuilt rather than to inflate it — the rationale's own control
    is what makes the zero trustworthy, and a preventive task that has to pretend otherwise is not
    worth building.

    ONE DIRECTION IS EXPLICITLY NOT SANCTIONED HERE: adding `?` to `breMetacharsIn`'s lists. Under
    the dialect form's BRE that character is literal and such patterns are correct, so flagging it
    would fail working proofs. The design says why at length because it is the obvious wrong fix.
