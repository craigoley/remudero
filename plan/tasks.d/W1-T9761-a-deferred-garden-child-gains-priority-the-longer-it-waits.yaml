  design: |
    One aged rung. It adds no new constant, interval, count or byte threshold (operator ruling). Enforcement stays on for
    gardens and for every other class.
    1. DEFERRAL STREAK. host-memory-admission.ts keeps, per instance and per deferred caller key (the request's runId,
       `garden-<name>`), when its current deferral streak began and how many deferrals it holds. A "defer" caller's waiter
       is ranked with waitingSinceMs set to that streak start, not to this call. An admission, or a pass that no longer
       asks, clears the streak. A daemon restart does not reset the wait: the streak start is seeded from when the garden
       was last due, its last completed pass (the gardener-runtime.json entry's lastCompletedAt) plus its cadence.
    2. CADENCE, MEASURED. The wait a garden may age through is its OWN measured pass cadence: the median gap between its
       completed passes, as startGardenOffLoop observes them in settle(). With fewer than two measured gaps, the garden's
       scheduled interval stands in (gardenSchedule(name).intervalFor(intervalMs), never below its minIntervalMs), and the
       row says so. childGardenPassSpawn hands awaitMemoryAdmission that cadence and its basis with the request.
    3. AGED RUNG. On a shortfall, a "defer" caller whose streak wait is at least its cadence is admitted on a new tier
       "aged" instead of being deferred, when:
       (a) it ranks first by rankDemand with its streak age among the streaks open in this process;
       (b) no other aged garden child from this process is still running. One aged child at a time, so the next verdict
           counts the first child's reservation; and
       (c) the verdict's reasons do not include "memory-available" (measured headroom less the daemons' typical growth
           already below the reserve) or a SIGHTED container ceiling (containerSighted). Those mean the memory is short
           now, not only projected short, so the garden stays deferred and keeps aging.
       swap-in, psi, unrealized-reservations, uncertainty and an unsighted container projection do not block the aged
       rung. They are the projected or transient reasons behind 10-15's 98.5%, and the garden child is already niced,
       idle-IO and heap-capped (GARDEN_CHILD_HEAP_LIMIT_MB).
    4. ROWS. An aged admission writes ENFORCE_ADMIT_STEP with tier "aged", waited_ms (the streak wait, not this call's),
       deferrals (the streak count), cadence_ms, cadence_basis, the reasons it overrode, and the numbers. Every
       ENFORCE_DEFER_STEP row gains deferred_since, deferrals, cadence_ms and why the aged rung did not fire (younger than
       its cadence | outranked | aged child running | memory-available | container sighted). The next re-measure can then
       count aged admissions and their waits.
    5. BOUNDARIES. No change to evaluateShadowMemory's arithmetic, to plan/policy.yaml hostMemoryBudget modes, to the
       "wait" callers (builds, fixes, reviews), or to the garden timers and pacing.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Fixture: an enforced garden policy, a
    verdict short for unrealized-reservations and psi with 5,000 MiB MemAvailable and one live build reservation, and
    an injected clock.
