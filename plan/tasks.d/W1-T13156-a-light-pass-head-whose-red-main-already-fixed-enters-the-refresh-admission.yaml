  rationale: |
    FOUND 2026-11-16 by the builder of W1-T12945 while reading src/lib/sweep.ts, then MEASURED the same day by the operator session, read-only, in the core ledger's rotated files.

    - W1-T12945 routes two causes from the light pass's fan-out to its refresh admission: a head missing its own task record, and a base-red head whose failing check is green on main. The fan-out is built with no branch update (W1-T528), so any other arm that needs a refresh still stands still there.
    - MEASURED over the 58 rotated ledger files from 2026-11-15T00:36Z to 2026-11-16T13:10Z, 5,796 `sweep.disposed` rows:
      - 10 rows read "... NOT DISPATCHED this pass: failing test file(s) <path> already fixed on main <sha>; the branch refresh is unwired on this surface (light pass)". Seen from 05:14Z to 16:33Z on 2026-11-15, on heads red in rule-checks, coverage-shard and required checks.
      - 5 rows read "... NOT DISPATCHED this pass: no-commit CI fix awaits a branch-update gateway for the moved main". Seen from 01:53Z to 02:47Z on 2026-11-16.
      - POSITIVE CONTROL, same query: the two causes W1-T12945 routes read 5 and 26 rows, so the query saw its corpus.
      - NOT OBSERVED in that window, and so not in this task: "deferred to full sweep (update-branch not available on this pass)" (0 rows) and the stalled-stage "branch refresh unavailable" text (0 rows).
    - Each such row is a pass in which a head that one refresh would clear got neither a refresh nor a fix. The full pass does refresh these, but the daemon's own passes are light.
  design: |
    MEASURE FIRST: for the 15 rows above, list the pull requests, how many light passes each stood still, and what finally moved each one (a full pass, a hand refresh, a merge of main by its author). Put the table in the PR body. If every one was cleared by the next full pass within one pass interval, say so: the task is then worth less than it looks and the PR says that plainly.

    1. The base-fixed arm with the reproduction clear, and the no-commit fix that waits for a branch update, hand the head to `runLightPassRefreshAdmission` the way W1-T12945 hands its two causes: the fan-out names the head and presses nothing.
    2. Each press passes the existing `createRefreshAdmission`, the refresh value test and the Actions incident hold, and is recorded once per head and cause with the rows those arms already write on the full surface.
    3. A refresh that does not take, or the same red on the refreshed head, keeps the step that arm takes today (the strike, the fix round or the escalation), with its cause named.
    INVARIANT one-refresh-selection: no branch update is pressed from the per pull request fan-out of a light pass; every press is the whole-snapshot selection's.
    NOT IN SCOPE: the two texts not observed above; W1-T9595's replay of heads a full pass left waiting; what the full surface does; how many refreshes a pass may press.
  falsifier: |
    Leave the base-fixed cause out of the selection and criterion 1 must fail. Leave the no-commit cause out and criterion 2 must fail. Press the head a refresh produced again and criterion 3 must fail. Wire a branch update into the fan-out and criterion 4 must fail. Restore and all pass.
