- id: W1-T2828
  title: "THE CLAUDE CAPACITY READ CANNOT SAY WHICH ACCOUNT IT MEASURED — the operator switches subscriptions by hand and rmd follows whatever Claude Code is logged into, so two readings from two accounts are indistinguishable in the ledger and providerWindowConsumption will silently subtract one account's window from another's the moment two reset timestamps coincide"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  origin: architect
  plan_refs: ["§9", "W1-T265", "W1-T268", "W1-T333", "W1-T2800"]
  files: [src/lib/worker-provider.ts, src/lib/worker.ts, test/the-capacity-read-cannot-say-which-account-it-measured.test.ts]
