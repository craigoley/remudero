- id: W1-T3645
  title: "A TASK CAN DECLARE A FILE ITS IMPLEMENTATION NEVER TOUCHES AND NOTHING SAYS SO — the reviewer reports files touched but NOT declared, never the reverse, so a phantom path inflates the task's concern count, its risk band and the blast radius the dispatcher reads"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  # THE SUITE IS DELIBERATELY NOT LISTED. Standing rule 15 makes this filing ride alone, and a
  # test/ path here reads as "this diff ships the suite", which turns the `unit test:` proof below
  # into proof-unit-test-unresolvable in a tree that by rule cannot carry one. It is
  # test/a-declared-file-the-diff-never-touches-is-reported.test.ts, and it lands with #5865.
  files: [src/lib/review.ts]
  origin: oper#pr-queue-sweep-2026-09-16
  plan_refs: ["W1-T3646", "W1-T3647", "W1-T2525"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED, AND IT TURNED MAIN RED FOR ROUGHLY TWO HOURS.

    W1-T3621 declared `files: [src/lib/inbox.ts, src/run-task.ts, test/...]`. When its
    implementation merged (#5689) the diff was:

        scripts/comment-load-baseline.json, scripts/test-tier-manifest.json, src/lib/inbox.ts,
        and four test files

    `src/run-task.ts` was never touched. `planProjectionForDependsOn` was built INSIDE inbox.ts and
    called there. The span existed only in the declaration.

    THE COST CHAIN, EACH STEP MEASURED. That phantom path made the shard read as spanning two
    subsystems, which tripped Rule 19 sizing, which the shard-lint ratchet then refused on main --
    reddening `every-shard-on-main-is-lintable` on a CLEAN checkout (4/5) and therefore the coverage
    shard of every PR that merged main. Four pull requests chased it: #5697 raised the risk band,
    #5698 duplicated that, #5699 narrowed files:, and #5704 finally measured the declaration against
    the diff and corrected both. Three of those four were reasoning from the gate's message rather
    than from the code.

    NOTHING IN THE TREE COULD HAVE CAUGHT IT. `declared-scope` (task-linter.ts) fires only when
    files: is absent or empty. The reviewer computes declared-vs-diff already and reports the
    UNDER-declared direction as advisory ("This diff touches files the task's files: list does not
    declare"). Declared-but-never-touched is reported by neither.
  design: |
    The reviewer ALREADY has both sides in hand where it builds the declared-scope advisory: the
    task's files: and the PR's changed paths. This adds the second direction of a subtraction it is
    already computing.

    ADVISORY, NOT BLOCKING, AND THE ASYMMETRY IS DELIBERATE. An under-declaration can be an
    operator-ratified widening; an over-declaration can be a task whose work legitimately split, or
    a file the author still intends to touch in a follow-up. Neither is a fault by itself. What is
    missing is that the over-declared case is INVISIBLE -- so it is reported beside its sibling, in
    the same block, and the risk-band consequence is named in the message so a reader sees why a
    phantom path is not free.

    NAME THE CONSEQUENCE, NOT JUST THE FACT. The message must say what the extra path bought: the
    concern count it inflated and the Rule 19 band it forced. "src/run-task.ts is declared but
    unchanged" is a shrug; "declared but unchanged, and it is the whole of this task's second
    concern" is a ruling.
  # RE-POINTED 2026-09-17. THIS TASK'S PREMISE WAS PARTLY WRONG. It says the over-declaration
  # direction "is silent today"; MEASURED against base ae3395b0adce, it was not --
  # `inverseScopeAdvisorySection` and `unwiredAdvisories` both already lived in src/lib/review.ts,
  # and the head suite's own tests for reporting and for staying advisory PASS against base source
  # (3 tests: 2 pass, 1 fail). The one thing that was genuinely missing is the CONSEQUENCE naming,
  # and that is the single test that fails on base. So this is one criterion, not three.
  acceptance:
    - claim: "the over-declaration report names the consequence, so a reader sees that the phantom path is what supplies the task's extra concern rather than merely that it is unused"
      proof: "unit test: the over-declaration report names the concern it inflates"
  # WITHDRAWN AS CRITERIA, KEPT AS TESTS — both characterise behaviour that already shipped:
  #   "a PR whose task declares a file the diff never touches is reported in the reviewer's
  #    declared-scope block"  / proof "unit test: a declared file the diff never touches is reported"
  #   "it stays advisory and never blocks"
  #    / proof "unit test: an over-declared file does not change the review verdict"
  # Both pass against base source, so neither can witness this diff. They are worth keeping as
  # regression cover on a reporting path that had little. See W1-T3721, which refuses a criterion
  # that does not track its code at author time rather than after a build.
  falsifier: |
    Reconstruct W1-T3621's declaration against #5689's merged diff: the report must name
    src/run-task.ts. Remove that path from files: and the report must fall silent. Make the check
    blocking and the third test must fail, because a ratified widening would then be refused on
    evidence that cannot tell it from a mistake.
