  rationale: |
    A claim of a task that origin already holds costs 10 to 45 minutes of host time before git refuses it.
    READ at origin/main 713c610e6:
    - src/lib/dispatch-claim.ts:444-446 `claimPushArgs` is `push origin <anchor-sha>:refs/rmd-dispatch/<id>`.
      `attempt` runs it with no check first: the sync reserver at :334-339 (push at :336) and the async one at
      :531-536 (push at :533). `holder` (:340-342) already reads the ref with ls-remote, but only after the push fails.
    - hooks/pre-push:63 reads stdin once. The loop at :78-95 sorts the lines, and :96-103 are the two fast paths
      (deletion-only, dispatch-claim-only). Every content check (:131-497) runs when neither fast path matches.
    REPRODUCED with git 2.43.0 (the Azure host's git): when origin already holds the ref, the push is a
    non-fast-forward. git leaves a rejected ref out of the hook's input, so the hook runs with an EMPTY stdin.
    :78-95 then sees no dispatch line, the fast path at :100 does not match, and every content check runs against
    the whole branch. Then the push is refused, and `classifyPushFailure` reads it as `taken`.
    The hand lane works around this today (shipbuilt.sh skips its claim when origin holds the ref, and the Azure
    build rules say to claim once). Every other caller of `rmd claim`, and a run's own claim, still pays.
    CHECKED for overlap on origin/main plan/tasks.d: no queued or blocked task names `claimPushArgs`, a claim
    holder check, or the hook's empty-stdin case.
  design: |
    1. At the top of `attempt` in both reservers, after the push guard, read `git ls-remote origin <ref>`.
       A non-zero exit is `unreachable` with its stderr kept, as a failed push is today. A listed sha is `taken`
       with no push. Reuse `holderFromLsRemote` for the parse; add no new exported function.
    2. Otherwise push as today. The push stays create-only (no `+`, no force), so a race between the check and
       the push still ends in a rejected push that reads `taken`. The check only saves the push when origin
       already holds the ref.
    3. Do not change hooks/pre-push. An empty stdin must keep running every gate, because hand runs and tests
       call the hook with no input.
    4. Before you change anything, grep test/ for fakes that pin the git call order of `attempt`
       (test/dispatch-claim.test.ts, test/the-dispatch-claim-runs-git-off-the-daemon-loop.test.ts and the others
       that build `gitDispatchClaimReserver`). If one outside `files` asserts the exact call list, amend first.
    5. AMENDED after the step 4 grep. Three tests outside the first `files` list pin the old git calls of
       `attempt`, and the check breaks each one. Their fakes answer the new ls-remote, and no claim they make
       is removed:
       - test/live-write-guard.test.ts: its fake origin answers every ls-remote with a sha, so the dispatch
         attempt reads `taken` and skips its push (6 pushes, not 7). The fake answers a dispatch claim ref as
         free. Its child process with no runner variable expects the argv list `["ls-remote","push"]`, still
         with no `remote get-url` lookup.
       - test/the-dispatch-claim-runs-git-off-the-daemon-loop.test.ts: a git that hangs is now killed on the
         ls-remote, so the refusal names `git ls-remote timed out`, not `git push timed out`.
       - test/dispatch-claim.test.ts: its W1-T1268 shape fake fails every ls-remote. It answers the claim
         ref's ls-remote as free, so the attempt still pushes and reads `created`.
       A held claim keeps a stderr line for `lastAttemptStderr` that says the push would be rejected, so the
       real-origin test that matches `rejected` passes unchanged. The three suites are three surfaces, so
       Rule 19 raises the risk to high.
    INVARIANT claim-stays-create-only: the claim push never overwrites a ref origin holds; the new check only
    skips a push that would be refused.
    NOT IN SCOPE: the pre-push hook; the triage and pull request claim reservers (they may get the same check later).
  falsifier: |
    Remove the ls-remote check and criteria 1 and 4 must fail (a push runs and the marker hook runs).
    Add `+` to the push refspec and criterion 2 must fail. Return `created` when ls-remote fails and criterion 3
    must fail. Restore and require all five to pass.
