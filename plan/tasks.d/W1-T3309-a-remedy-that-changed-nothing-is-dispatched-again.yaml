  rationale: |
    MEASURED 2026-09-10 on #4851, and CORRECTED once: the first version of this shard said the fleet
    "re-dispatched a remedy against an unchanged cause" and proposed detecting the repeat. That was
    wrong, and the correction is the finding. Nothing was re-dispatched. The sweep ANNOUNCED a
    dispatch three times and no dispatch is recorded as having begun, failed, or escalated.
    THE DISPOSITIONS, verbatim, each with `acted: true`:
      22:36:37  blocked-fixable  structured instrument entanglement — dispatching W1-T2436 …
      01:59:26  blocked-fixable  structured instrument entanglement — dispatching W1-T2436 …
      02:18:17  blocked-fixable  structured instrument entanglement — dispatching W1-T2436 …
    THE RUNG LEAVES A ROW ON EVERY PATH, AND THERE ARE NONE. `run-task.ts`'s entanglement branch
    writes `fix.prerequisite_opened` on success, `fix.prerequisite_dispatch_failed` when the spawned
    worker opens no PR, and `fix.prerequisite_ci_failed` when the prerequisite cannot go green; the
    escalation writes `fix.exhausted`. COUNTED ACROSS THE WHOLE LEDGER: 0, 0, 0 and 0. Not zero for
    this PR — zero ever, for any PR. W1-T3272 itself carries exactly 2 `fix.dispatch` rows, both from
    the earlier ci-log strikes at 21:22 and 22:11, and no other `fix.*` row of any kind.
    SO `acted` IS UNFALSIFIABLE, and that is the defect this task fixes. It is written from a clean
    return rather than from evidence the action produced anything. W1-T1127 already closed half of
    this hole and its comment describes the symptom exactly: "EVERY throw here … was swallowed
    unconditionally, so `runSweep` always saw a clean return and recorded `acted:true`, seeding the
    dedup for a head that never received a single `fix.*` ledger row." It made a throw BEFORE
    `fix.dispatch` reach the caller's catch. It did not, and could not, make a clean return that did
    nothing distinguishable from one that did something.
    WHAT IS NOT ESTABLISHED, AND MUST NOT BE ASSUMED BY WHOEVER BUILDS THIS. Which failure this is
    remains unknown: an early return, a guard that never admitted the branch, or a throw on a path
    still swallowed. W1-T1127 names `git checkout -B` racing `.git/config`'s lock as one historical
    cause and that lock was independently measured stale on this host the same night (W1-T3308,
    60s and 69s against a 2000ms grace) — SUGGESTIVE, NOT DEMONSTRATED, and recorded here so the
    implementer tests it rather than inherits it.
    WHY THIS MATTERS BEYOND ONE PR. `acted: true` seeds `runSweep`'s own dedup. A pass that records
    an action it did not take tells the NEXT pass not to try, which is how a PR sits for hours while
    the board reports it is being worked.
  design: |
    (i) AN `acted` ROW NAMES ITS TRACE. When the sweep records an action as taken, it records WHICH
    ledger step that action was expected to write. The claim stops being "the closure returned" and
    becomes "this specific evidence should now exist".
    (ii) A CLAIMED ACTION WITH NO TRACE IS REPORTED, ON THE NEXT PASS, ONCE. The next pass can see
    that the promised row never appeared and say so — naming the PR, the disposition and the missing
    step. This is a FACT about the ledger, not a new verdict: the disposition is unchanged and no
    remedy is re-run on the strength of it.
    (iii) NO CLOCK AND NO COUNT DECIDES IT. Presence or absence of the named row is the whole
    predicate. It is not "how long has this been stuck" and not "how many passes" — a promise
    unkept once is already a false record, whether the next pass is a minute later or a day.
    (iv) FAIL CLOSED AND STAY QUIET. A disposition that promises nothing, an action whose row this
    pass cannot read, or any ambiguity, renders exactly as today. The addition can never subtract.
    (v) OUT OF SCOPE: fixing whatever actually swallows the entanglement dispatch. That needs the
    diagnosis this observable is what produces. Naming the gap is this task; closing it is not.
  acceptance:
    - claim: "W1-T3309 criterion 1: an acted disposition records the ledger step its action was expected to write"
      proof: "unit test: test/a-remedy-that-changed-nothing-is-dispatched-again.test.ts"
    - claim: "W1-T3309 criterion 2: a claimed action whose named row never appeared is reported once, naming the PR, the disposition and the missing step"
      proof: "unit test: test/a-remedy-that-changed-nothing-is-dispatched-again.test.ts"
    - claim: "W1-T3309 criterion 3: an action whose row DID appear is silent, and a disposition that promises no row is silent"
      proof: "unit test: test/a-remedy-that-changed-nothing-is-dispatched-again.test.ts"
    - claim: "W1-T3309 criterion 4: the report changes no disposition and re-runs no remedy — it is an observation only"
      proof: "unit test: test/a-remedy-that-changed-nothing-is-dispatched-again.test.ts"
  falsifier: |
    CLOSE IF a claimed action already proves itself: count the rung's own outcome rows for a PR the
    sweep dispositioned `acted: true`. MEASURED 2026-09-10 across the whole ledger:
    `fix.prerequisite_opened` 0, `fix.prerequisite_dispatch_failed` 0, `fix.prerequisite_ci_failed` 0,
    `fix.exhausted` 0 — against three `acted: true` entanglement dispositions on #4851 alone.
    THE KEPT-PROMISE CONTROL, because "report a missing row" is trivially satisfiable by reporting
    always: a fixture whose action DID write its named row must render byte-identical to today, and
    so must a disposition that names no expected row. Without both arms this is a change that
    complains about every pass.
    NO CLOCK AND NO COUNT MAY ENTER THE PREDICATE. If the implementation reads an age, a streak or a
    pass count to decide, it has rebuilt `repeatDispositionBound` — whose own defect is that the
    streak RESETS when the head moves, which is exactly what #4851 did while going nowhere.
    DO NOT re-run the remedy on the strength of this observation. A rung that reacts to its own
    missing trace by dispatching again is the loop this task exists to make visible, not to feed.
    DO NOT infer the CAUSE from the absence. The row's absence proves the action left no trace; it
    does not prove a throw, a guard or a race. The shard's own rationale records that distinction
    because the first version of this task got it wrong in the other direction.
  note: |
    Rule 25 CHECKED: `src/lib/sweep.ts` is ordinary src, not an instrument surface.
    THE SLUG MATCHES THE FALSIFIER (`a-remedy-that-changed-nothing-is-dispatched-again`), KEPT FROM THE SUPERSEDED VERSION because renaming a shard already on `main` RE-ISSUES its id (task-id-existence refused exactly that on the first attempt at this correction). The filename now trails the title; the id is what must stay stable so W1-T2525's
    own-falsifier discount applies to Rule 19's span: the suite is declared in `files:`, is named by
    every criterion, and does not exist on origin/main.
    THIS SHARD WAS REWRITTEN, NOT AMENDED, and the first version is worth knowing about. It claimed a
    remedy was re-dispatched against an unchanged cause and proposed a cause-identity to detect the
    repeat. The measurement that killed it: `fix.prerequisite_opened` has zero rows in the entire
    ledger, so there was never a first dispatch for a second to repeat. Building that design would
    have added repeat-detection beside `priorPrerequisitePrFor`, which ALREADY prevents a second
    dispatch and is documented as doing so — a second mechanism guarding against something that was
    not happening.
    CAVEAT WITH EQUAL WEIGHT: this makes a false record VISIBLE and fixes nothing else. #4851 would
    still have sat, and would still have needed the carve-out change that actually unblocked it
    (#4903/#4908). The claim is only that the fleet should not record work it did not do, because
    that record is what tells the next pass to stand down.
