  title: "THE SWEEP RE-DISPATCHES A REMEDY AGAINST AN UNCHANGED CAUSE FOREVER — W1-T1269 built the identity check that stops exactly this and left it inert for want of a producer, and the one dispatch arm that most needs it runs `with zero ordinary strikes` by design, so #4851 was handed the same fix three times across four hours and nothing noticed the remedy was not working"
