  origin: "operator-session#4851-five-hours-2026-09-10"
  plan_refs: ["W1-T1127", "W1-T3172", "W1-T2436", "W1-T3308"]
  files: [src/lib/sweep.ts, test/a-remedy-that-changed-nothing-is-dispatched-again.test.ts]
