- id: W1-T3309
  title: "THE SWEEP RECORDS `acted: true` FOR AN ACTION THAT LEFT NO TRACE — #4851 was dispositioned `blocked-fixable — dispatching W1-T2436 prerequisite split worker` three times across four hours, and the rung that would run it writes one of three outcome rows on EVERY path through it, of which ZERO exist anywhere in the ledger"
  repo: remudero
  depends_on: []
