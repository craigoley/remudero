  rationale: |
    GAP: the adaptive review governor (W1-T2853) already refuses a widen whenever live active workers + the next width would exceed sweep.reviewCapacity.hostWorkerBudget (src/lib/review-capacity.ts, the `host-worker-budget` arms), and it sheds on CPU PSI/learned lane, memory PSI/reserve, provider refusal/headroom, settlement health and latency. On top of that it is capped by a second, static number: `reviewLanes.max: 5` (plan/policy.yaml, operator ruling 2026-10-06 "width 4, max 5"). On the 8-worker host budget that cap stops the widener at 5 even with the host, the provider and review health all calm and three budgeted workers idle. The budget row was derived from the host (W1-T3209: min(8 cores, floor(23483 MiB / 1536 MiB)) = 8). The 5 was a one-step margin over base, not a measurement.
    RESEARCH: Netflix's concurrency-limits library (https://github.com/Netflix/concurrency-limits) says operators rarely know the true limit and should measure it rather than fix it. It treats concurrency as a TCP-style congestion window that grows +1 per healthy sampling window and backs off on latency, timeouts and rejections, with the real limit set by hard resources such as CPU cores. This governor already has the +1-per-healthy-window growth and the back-off arms. The hard resource it measures is hostWorkerBudget, so the ceiling should come from that, not from a second hand-set number.
    OPERATOR AUTHORIZATION: this run's PLAN focus is the user's explicit authorization to remove the arbitrary review-lane ceiling while keeping base 4, min 1, hostWorkerBudget, CPU/memory/provider protection, dispatch-lane policy and the plan-only review fast lane. It supersedes only the "max 5" half of the 2026-10-06 ruling. Ordinary preflight, hosted checks and separate merge/deploy approvals still apply.
    Settled by lookup: is this already filed or already decided? -> no. No shard in plan/tasks.d derives the review ceiling from the host budget. W1-T3025's note leaves raising reviewLanes.max to the operator, and DECISIONS.md/LEARNINGS.md/MASTER-PLAN.md carry no ruling that pins 5 beyond the policy row's own 2026-10-06 comment (plan/tasks.d/W1-T3025-the-adaptive-review-widener-has-never-widened.yaml; plan/policy.yaml sweep.reviewLanes).
    Settled by lookup: where does the static ceiling bind? -> in two places in src/lib/sweep.ts. `selectRuntimeReviewWidth({... maxWidth: policy.reviewLaneMax})` feeds the governor, and `effectiveReviewWidth` clamps the selected width to `policy.reviewLaneMax`. Both read `REVIEW_POLICY.max` from the reviewLanes row. No other src/ site reads reviewLaneMax (grep reviewLaneMax in src).
    Settled by lookup: does hostWorkerBudget already count every worker kind, so admission is bounded by live work? -> yes. sweep.ts says "all worker kinds count against the same spawnWorker boundary counter" (activeWorkerCount), and review-capacity.ts refuses `activeWorkers + min(maxWidth, effectiveWidth + 1) > hostWorkerBudget` before any healthy-window widen. restoreBase and the ineffective-shed hand-back are bounded by the same room.
    Settled by lookup: can the reviewLanes row simply drop `max`? -> no. test/policy.test.ts assertRowsInBounds requires a numeric max whenever a row declares min, and validateReviewLanesRow requires both. The row keeps `max` with its meaning narrowed to the base value's edit bound, set to hostWorkerBudget's own declared max (16) so no legal budget is out of reach. The admission ceiling becomes hostWorkerBudget.value.
    Settled by lookup: does this collide with an in-flight policy edit? -> yes. W1-T11274 (queued) owns the sweep.reviewCapacity recovery-watermark row in plan/policy.yaml. This task depends on it so the two policy edits serialize, and it leaves cpuPsiLowPct and every other reviewCapacity row alone (plan/tasks.d/W1-T11274-the-review-cpu-band-keeps-the-ruled-recovery-point.yaml).
    SIZING (Rule 19, #588 merits test): risk:high with band_meaning: span, not decomposed. The acceptance asserts ONE cross-file invariant, "the review admission ceiling is sweep.reviewCapacity.hostWorkerBudget", and it cannot be landed in pieces. Re-sourcing reviewLaneMax in src/lib/sweep.ts breaks the shipped-row pin in test/review-lane-fairness.test.ts ({value 4, min 1, max 5}) unless that pin moves in the same PR. The policy.yaml max change breaks the same pin. The widener falsifier in test/adaptive-review-widener-can-widen.test.ts only passes once the sweep.ts source changes. The loader refusal in test/review-lane-budget.test.ts lives in the same loadReviewPolicy edit. Every split leaves the tree red in between. The pressure/refusal arms in review-capacity.ts are not touched.
    Settled by lookup: which existing suite is the smallest home for the falsifiers? -> test/adaptive-review-widener-can-widen.test.ts (171 lines). It already drives selectAdaptiveReviewWidth's widening and refusal arms directly. test/review-lane-fairness.test.ts already pins the shipped row ({value 4, min 1, max 5}) and must move with it.
  design: |
    1. src/lib/sweep.ts: set DEFAULT_SWEEP_POLICY.reviewLaneMax from REVIEW_POLICY.capacity.hostWorkerBudget instead of the reviewLanes row's max, citing W1-T11841 at that site. loadReviewPolicy refuses (PolicyError, naming the derived bound) a reviewLanes.value above hostWorkerBudget.value. Base stays reviewLanes.value and min stays reviewLanes.min. effectiveReviewWidth and selectRuntimeReviewWidth keep reading policy.reviewLaneMax, so the governor's maxWidth is now the budget. Every per-pass constraint stays as it is: live activeWorkers, the host-worker-budget arms, CPU PSI/learned lane, memory PSI/reserve, provider refusal/headroom, settlement/latency and the healthy window.
    2. plan/policy.yaml: sweep.reviewLanes keeps value 4 and min 1. Its max becomes 16, the edit bound for the base value equal to hostWorkerBudget's own declared max. The comment says the widener's ceiling is now hostWorkerBudget, cites W1-T11841 and this authorization, and replaces the "lane five is never committed" sentence. Change no other row. hostWorkerBudget, dispatchLanes and every reviewCapacity value stay as W1-T11274 leaves them.
    3. Falsifiers in test/adaptive-review-widener-can-widen.test.ts, driven with the shipped DEFAULT_SWEEP_POLICY.reviewCapacity and its {reviewLanes, reviewLaneMin, reviewLaneMax}. (a) From base 4, with activeWorkers 0, a fresh provider with headroom, and calm PSI and settlements, successive healthy windows reach 6 and then hostWorkerBudget. (b) With activeWorkers 3 the width stops at hostWorkerBudget - 3 and records `host-worker-budget`. (c) Each existing refusal reason holds the width (or sheds it) on a sample that would otherwise have widened, and no sample's effectiveWidth + activeWorkers exceeds hostWorkerBudget. Update the 2026-10-06 shipped-row pin in test/review-lane-fairness.test.ts to the new row plus reviewLaneMax === hostWorkerBudget. Add the above-budget refusal arm to test/review-lane-budget.test.ts.
    NOT IN SCOPE: hostWorkerBudget's value or bounds, any CPU/memory/provider/latency/settlement threshold, dispatchLanes, the plan-only/cheap review fast lane (W1-T11148), review-capacity.ts's arms, and W1-T11274's watermark row.
  note: |
    Filed by PLAN --mode=expand (run PLAN-expand-1794225828615) on the user's explicit authorization to remove the arbitrary review-lane ceiling. Reserved id W1-T11841.
