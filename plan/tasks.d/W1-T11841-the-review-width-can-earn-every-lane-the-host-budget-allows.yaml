  acceptance:
    - claim: Driven with the SHIPPED DEFAULT_SWEEP_POLICY bounds and reviewCapacity, sustained healthy windows with provider headroom widen the review width past 5, one lane per healthy window, up to hostWorkerBudget minus live active workers and never past it. With active workers present, the width stops at the room they leave. Each existing refusal (cpu-pressure, memory-pressure, memory-reserve, provider-refused, provider-headroom, review-unhealthy, review-latency, review-history-insufficient, telemetry-unavailable, backlog-not-sustained) still blocks a widen and never admits past the budget
      proof: "unit test: test/adaptive-review-widener-can-widen.test.ts"
    - claim: The shipped plan/policy.yaml sweep.reviewLanes row is unchanged at value 4, min 1, max 5. DEFAULT_SWEEP_POLICY.reviewLaneMax equals sweep.reviewCapacity.hostWorkerBudget (8), not the row's max, and DEFAULT_SWEEP_POLICY.reviewLanes and reviewLaneMin are still the row's value and min. dispatchLanes and hostWorkerBudget are unchanged
      proof: "unit test: test/review-lane-fairness.test.ts"
    - claim: The review-lane loader refuses a base reviewLanes.value above hostWorkerBudget and names the derived bound, and every existing validateReviewLanesRow refusal arm still fires, including a value above the row's own max
      proof: "unit test: test/review-lane-budget.test.ts"
    - claim: The derived ceiling's source site cites this task and says the reviewLanes row's max only bounds the base value, not runtime admission
      proof: "grep: W1-T11841 in src/lib/sweep.ts"
  rationale: |
    GAP: the adaptive review governor (W1-T2853) already refuses a widen whenever live active workers + the next width would exceed sweep.reviewCapacity.hostWorkerBudget (src/lib/review-capacity.ts, the `host-worker-budget` arms), and it sheds on CPU PSI/learned lane, memory PSI/reserve, provider refusal/headroom, settlement health and latency. On top of that it is capped by a second, static number: `reviewLanes.max: 5` (plan/policy.yaml, operator ruling 2026-10-06 "width 4, max 5"). On the 8-worker host budget that cap stops the widener at 5 even with the host, the provider and review health all calm and three budgeted workers idle. The budget row was derived from the host (W1-T3209: min(8 cores, floor(23483 MiB / 1536 MiB)) = 8). The 5 was a one-step margin over base, not a measurement.
    RESEARCH: Netflix's concurrency-limits library (https://github.com/Netflix/concurrency-limits) says operators rarely know the true limit and should measure it rather than fix it. It treats concurrency as a TCP-style congestion window that grows +1 per healthy sampling window and backs off on latency, timeouts and rejections, with the real limit set by hard resources such as CPU cores. This governor already has the +1-per-healthy-window growth and the back-off arms. The hard resource it measures is hostWorkerBudget, so the ceiling should come from that, not from a second hand-set number.
    OPERATOR AUTHORIZATION: this run's PLAN focus is the user's explicit authorization to remove the arbitrary review-lane ceiling while keeping base 4, min 1, hostWorkerBudget, CPU/memory/provider protection, dispatch-lane policy and the plan-only review fast lane. It supersedes only the "max 5 as admission ceiling" half of the 2026-10-06 ruling; the row's max 5 stays as the base value's edit bound. Ordinary preflight, hosted checks and separate merge/deploy approvals still apply.
    Settled by lookup: is this already filed or already decided? -> no. No shard in plan/tasks.d derives the review ceiling from the host budget. W1-T3025's note leaves raising reviewLanes.max to the operator, and DECISIONS.md/LEARNINGS.md/MASTER-PLAN.md carry no ruling that pins 5 beyond the policy row's own 2026-10-06 comment (plan/tasks.d/W1-T3025-the-adaptive-review-widener-has-never-widened.yaml; plan/policy.yaml sweep.reviewLanes).
    Settled by lookup: where does the static ceiling bind? -> DEFAULT_SWEEP_POLICY.reviewLaneMax is set from REVIEW_POLICY.max (src/lib/sweep.ts DEFAULT_SWEEP_POLICY). `selectRuntimeReviewWidth({... maxWidth: policy.reviewLaneMax})` feeds the governor, and effectiveReviewWidth clamps with `Math.max(min, Math.trunc(policy.reviewLaneMax))`. Re-sourcing that one field moves both readers; neither reader changes.
    Settled by lookup: does hostWorkerBudget already count every worker kind, so admission is bounded by live work? -> yes. sweep.ts says "all worker kinds count against the same spawnWorker boundary counter" (activeWorkerCount), and review-capacity.ts refuses `activeWorkers + min(maxWidth, effectiveWidth + 1) > hostWorkerBudget` before any healthy-window widen. restoreBase and the ineffective-shed hand-back are bounded by the same room.
    Settled by lookup: must plan/policy.yaml change for the ceiling to move? -> no. The runtime ceiling is the DEFAULT_SWEEP_POLICY.reviewLaneMax field in src/lib/sweep.ts; validateReviewLanesRow and test/policy.test.ts assertRowsInBounds keep requiring the row's numeric min/max, so the row stays {value 4, min 1, max 5} and its max keeps bounding only the base value (src/lib/sweep.ts validateReviewLanesRow; plan/policy.yaml sweep.reviewLanes).
    Settled by lookup: does this collide with the active W1-T11274 owner? -> not after this narrowing. W1-T11274 declares plan/policy.yaml and test/review/the-review-cpu-band-keeps-the-ruled-recovery-point.test.ts; this task declares only src/lib/sweep.ts and three existing test files, so the file sets are disjoint and the former depends_on/plan_refs edge on W1-T11274 is removed (plan/tasks.d/W1-T11274-the-review-cpu-band-keeps-the-ruled-recovery-point.yaml). W1-T11274's reservation and shard are untouched.
    Settled by lookup: is the above-budget loader refusal still reachable with max 5 under budget 8? -> yes. hostWorkerBudget's own row allows min 1, so a budget edited below the base value (e.g. 3 with base 4) would make reviewLaneMax < reviewLanes; loadReviewPolicy must refuse that loud (rule 2) rather than clamp (plan/policy.yaml sweep.reviewCapacity.hostWorkerBudget min 1).
    SIZING (Rule 19, #588 merits test): risk:high with band_meaning: span, not decomposed. The acceptance asserts ONE cross-file invariant, "the review admission ceiling is sweep.reviewCapacity.hostWorkerBudget", and it cannot be landed in pieces. Re-sourcing reviewLaneMax in src/lib/sweep.ts breaks any pin of reviewLaneMax === 5 unless the pin in test/review-lane-fairness.test.ts moves in the same PR. The widener falsifier in test/adaptive-review-widener-can-widen.test.ts only passes once the sweep.ts source changes. The loader refusal in test/review-lane-budget.test.ts lives in the same loadReviewPolicy edit. Every split leaves the tree red in between. The pressure/refusal arms in review-capacity.ts are not touched.
    Settled by lookup: which existing suite is the smallest home for the falsifiers? -> test/adaptive-review-widener-can-widen.test.ts (171 lines). It already drives selectAdaptiveReviewWidth's widening and refusal arms directly. test/review-lane-fairness.test.ts already pins the shipped row ({value 4, min 1, max 5}); that row pin stays and gains the reviewLaneMax === hostWorkerBudget assertion.
  design: |
    1. src/lib/sweep.ts: set DEFAULT_SWEEP_POLICY.reviewLaneMax from REVIEW_POLICY.capacity.hostWorkerBudget instead of REVIEW_POLICY.max, citing W1-T11841 at that site with a comment that sweep.reviewLanes.max is only the edit bound for the base value and no longer the runtime admission ceiling. loadReviewPolicy refuses (PolicyError, naming the derived hostWorkerBudget bound) a reviewLanes.value above hostWorkerBudget.value. Base stays reviewLanes.value and min stays reviewLanes.min; validateReviewLanesRow keeps every existing arm. effectiveReviewWidth and selectRuntimeReviewWidth keep reading policy.reviewLaneMax, so the governor's maxWidth is now the budget. Every per-pass constraint stays as it is: live activeWorkers, the host-worker-budget arms, CPU PSI/learned lane, memory PSI/reserve, provider refusal/headroom, settlement/latency and the healthy window.
    2. plan/policy.yaml is NOT edited. sweep.reviewLanes stays {value 4, min 1, max 5} with its existing comments; every reviewCapacity row stays as W1-T11274 owns it.
    3. Falsifiers in test/adaptive-review-widener-can-widen.test.ts, driven with the shipped DEFAULT_SWEEP_POLICY.reviewCapacity and its {reviewLanes, reviewLaneMin, reviewLaneMax}. (a) From base 4, with activeWorkers 0, a fresh provider with headroom, and calm PSI and settlements, successive healthy windows reach 6 and then hostWorkerBudget. (b) With activeWorkers 3 the width stops at hostWorkerBudget - 3 and records `host-worker-budget`. (c) Each existing refusal reason holds the width (or sheds it) on a sample that would otherwise have widened, and no sample's effectiveWidth + activeWorkers exceeds hostWorkerBudget. In test/review-lane-fairness.test.ts keep the 2026-10-06 shipped-row pin ({value 4, min 1, max 5}) and add DEFAULT_SWEEP_POLICY.reviewLaneMax === DEFAULT_SWEEP_POLICY.reviewCapacity.hostWorkerBudget. Add the above-budget refusal arm to test/review-lane-budget.test.ts.
    NOT IN SCOPE: plan/policy.yaml (any row), hostWorkerBudget's value or bounds, any CPU/memory/provider/latency/settlement threshold, dispatchLanes, the plan-only/cheap review fast lane (W1-T11148), review-capacity.ts's arms, and W1-T11274's watermark row, test and reservation.
