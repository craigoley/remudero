  note: |
    THE SEVEN WRONGLY CREDITED RECORDS ARE NAMED AND NOT TOUCHED. W1-T403, W1-T478, W1-T968, W1-T971,
    W1-T974, W1-T985 and W1-T988 are credited merged today by a PR that only added their own shard.
    CORRECTING THEM IS THE OPERATOR'S ACTION AND `postMergeAmendmentViolations` GOVERNS IT. This task
    stops the next one; it does not re-credit or retire any existing record, and a builder who amends
    one has exceeded it.

    src/run-task.ts IS DELIBERATELY NOT DECLARED, AND THAT IS LOAD-BEARING. It is declared by roughly
    209 of 349 shards and W1-T471 serialises every task naming it. It is avoidable because the counts
    say so: `findMergedByTrailer` reads 16 in src/lib/status.ts against 10 in run-task.ts,
    `findMergedByHeadBranch` 12 against 1, and — decisively — `readLedgerLines` reads 14 in status.ts,
    so the `pr.opened{plan_only:true}` marker is already reachable there without exporting or moving
    `isPlanOnlyFilingPr` (7 invocations, all in run-task.ts). AN IMPLEMENTER WHO FINDS THE PREDICATE
    CANNOT BE BUILT WITHOUT run-task.ts MUST AMEND THIS SHARD TO DECLARE IT rather than overrunning.
    CONTROL: `routeSpecialists` reads 0 in status.ts, so these counts discriminate.
    test/status.test.ts is the declared suite: `findMergedBy` reads 28 there, the highest of any test
    file, against 0 in test/filing-forward-reference.test.ts.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN. `sizingViolation` (src/lib/task-linter.ts)
    exempts risk === "high" outright, and `subsystemsOf` derives ids from `moduleIdFromPath` over
    `files:` AND from a lexicon scan of the ACCEPTANCE-CRITERIA TEXT; two declared paths already give
    two module ids before four criteria naming credit, trailers, branches and filings are read. Blast
    radius argues DOWN: one predicate consulted at two existing call sites.

    THE POPULATION WAS SIZED BEFORE ANY FIX WAS PROPOSED, AND IT SHRANK TWICE. The raw shape — a
    plan-only diff that credits a task — matches 15. Removing the two whose task genuinely delivers
    plan text leaves 13. Removing the five that ALSO have a real implementing PR leaves 7, and one
    more is indeterminate. A shard filed this weekend claimed lost work that turned out to be
    correctly-closed duplicates; the same discipline is applied here and it is why this says seven
    rather than fifteen.

    PROOF NOTES. The dialect was chosen before the criteria were written: these are BEHAVIOURAL, so
    all four are the NAME-FILTERED `unit test:` form with an id-prefixed title, which makes each
    self-attributing — a 2026-08-18 audit of 57 verify:human tasks found an id-prefixed title is the
    only artifact that survives the "who created this" test, because a bare suite path is satisfied by
    whichever task created the file first. A `demonstration:` proof would be refused outright by
    `check-proof`, and a doc-shaped `unit test:` proof would parse, match zero and cap the review.
    Every title is plain prose under 100 characters with no comma, no "; " and no regex metacharacter.
    All four were verified to match ZERO files today by `grep -rlF` over test/ against a
    same-invocation control matching 98.

    ID PROVENANCE — THREE GIT SURFACES FIRST, THEN THE OPEN-PR SURFACE, ZERO `/rate_limit` CALLS.
    W1-T1004 read 0 on all four at e5ef4317c: refs/rmd-id/* (94 refs), shard filenames on origin/main
    (352), ids declared anywhere under plan/ (7,176 mentions), and every OPEN PR's title AND file list
