- id: W1-T1004
  title: "A PLAN-ONLY FILING PR CAN CREDIT THE TASK IT JUST FILED AS IMPLEMENTED — the merged-credit path in src/lib/status.ts has no filing-PR awareness at all, so seven queued tasks are credited merged by a PR that only added their own shard, and each then leaves the queue through an optional callback that writes no ledger row"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  rationale: |
    MEASURED 2026-08-18 AT origin/main e5ef4317c, over all 1,620 commits on main joined against 1,582
    merged PR records (#1..#2134 — coverage control passes, the lowest is #1, so no paged window
    floor). The sweep is git-only except the open-PR surface.

    (1) BOTH CREDIT PATHS OVER-CREDIT A FILING, AND THE POPULATION IS BIGGER THAN TWO.
    TRAILER PATH: 5 commits whose diff touches ONLY `plan/` carry an anchored `Remudero-Task:`
    trailer — #1621/W1-T426, #1477/W1-T404, #1475/W1-T403, #1293/W1-T314, #84/W1-T24b — out of 546
    plan-only commits and 174 commits carrying any anchored trailer.
    BRANCH PATH: 10 more sit on a `run-<id>-<epoch>` head with NO trailer — #2134/W1-T988,
    #2129/W1-T985, #2104/W1-T974, #2101/W1-T971, #2099/W1-T968, #1804/W1-T485, #1801/W1-T463,
    #1794/W1-T483, #1789/W1-T480, #1784/W1-T478.

    (2) BUT ONLY SEVEN ARE HARMFUL, AND THE DIFFERENCE IS THE WHOLE POINT OF THIS TASK. Of the 15,
    two are CORRECT — W1-T426's own `files:` are three plan shards and W1-T314's is its own shard, so
    a plan-only PR is exactly the right thing to credit them. Five more are HARMLESS: W1-T404,
    W1-T463, W1-T485, W1-T483 and W1-T480 each ALSO have a genuine implementing PR (#1709, #1775 and
    #1813, #1807, #1798, #1795), so the extra credit is redundant rather than damaging. One is
    INDETERMINATE (W1-T24b declares no `files:`). THE HARMFUL SET IS SEVEN, EACH CREDITED ONLY BY A
    PLAN-ONLY PR AND EACH STILL `status: queued`: W1-T403 (#1475, trailer), W1-T478 (#1784),
    W1-T968 (#2099), W1-T971 (#2101), W1-T974 (#2104), W1-T985 (#2129), W1-T988 (#2134).

    (3) THE CONSEQUENCE IS QUIETER THAN IT LOOKS, AND THE LEDGER PROVES IT. `isDispatchEligible`
    (src/lib/drain.ts) filters a credited task at `if (isMerged(t.id)) { opts.onFiltered?.(t,
    "already-merged"); ... }` — AN OPTIONAL CALLBACK, NOT A LEDGER ROW. The row named
    `dispatch.refused_already_merged` is a DIFFERENT, LATER SITE the task never reaches. MEASURED over
    83,369 deduped ledger rows: that row fires 24 times in total and **0 times for any of the seven**,
    against a `run.start` control of 153. So a falsely-credited task does not even produce the refusal
    an operator might notice; it is filtered at selection and writes nothing at all.

    (4) THE RULE IS RECORDED AND IS ENFORCED ONLY BY OMISSION AT ONE EMITTER.
    `src/lib/plan-pr-emitter.ts` states it on its own `taskId` option: "OMIT for a plan-FILING PR (the
    correctness rule above) — no argument means no trailer, never a wrong one", and the trailer is
    appended only `if (taskId)`. `resolveOpenPrTaskId` (src/run-task.ts) cites #1527 for the same
    rule. NOTHING REFUSES A TRAILER THAT ARRIVES ANY OTHER WAY: measured `Remudero-Task` occurrences
    are 0 in src/lib/task-linter.ts, 0 in commitlint.config.mjs and 0 in .github/workflows/ci.yml,
    against 6 in src/lib/review.ts — all of which are prose, and one of which actively ADVISES adding
    a trailer "so merge credit resolves".

    (5) AND THE BRANCH SHAPE HAS NO GUARD AT ALL ON THE MERGED PATH. `resolveOpenPrTaskId` DOES
    withhold the head-ref fallback for a filing PR — `if (isPlanOnlyFilingPr(ledger, pr.url)) return
    undefined;` — but that function serves OPEN PRs, and the trailer is consulted FIRST and returns
    unconditionally, so it would not have stopped #1475 either. The merged-credit path is
    `findMergedByTrailer` and `findMergedByHeadBranch` in src/lib/status.ts, where `isPlanOnlyFilingPr`
    reads 0 and `plan_only` reads 0, against a `findMergedByHeadBranch` control of 12 in that same
    file. There is no guard there to bypass; there is no guard there.
  design: |
    (i) THE PREDICATE GOES WHERE THE CREDIT IS DECIDED — src/lib/status.ts, alongside
    `findMergedByTrailer` and `findMergedByHeadBranch`. It must distinguish THREE cases, not two.

    (ii) THE SIGNAL IS THE EMITTER'S OWN POSITIVE RECORD, NEVER THE DIFF. `isPlanOnlyFilingPr`'s doc
    already forbids the obvious shortcut in terms: the classification is taken from the `pr.opened`
    line carrying `plan_only: true` that the filing flows write, "never inferred from the diff
    touching only `plan/**` (a hand-authored plan PR would misclassify)". A DIFF-BASED PREDICATE IS
    EXPLICITLY OUT — and rationale (2) shows why: it would refuse the two credits that are correct.

    (iii) NO NEW MECHANISM AND NO NEW SIGNAL. The marker already exists and is already written.
    src/lib/status.ts already reads the ledger (`readLedgerLines`, 14 invocations there), so the
    record is reachable without a new dep, a new row or a new field. Eleven mechanisms in this repo
    have merged green with no reader; this task adds no twelfth.

    (iv) THE FALSIFIER IS FOUR CASES IN ONE RUN, AND A REFUSE-EVERYTHING PREDICATE FAILS IT. A filing
    PR with a trailer must NOT credit; an IMPLEMENTATION PR with a trailer MUST credit; a filing PR on
    a `run-<id>-*` branch must NOT credit; and a filing whose own declared deliverable is plan text
    MUST still credit. Criteria 2 and 4 are the halves a blanket refusal breaks, and they must run in
    the same invocation as criteria 1 and 3.

    (v) OUT OF SCOPE, EACH WITH ITS REASON. src/run-task.ts is NOT declared — see the note; the
    predicate is implementable in status.ts because the ledger is already read there, and declaring
    run-task.ts would serialise this against ~209 of 349 shards for no gain. The OPEN-PR path
    (`resolveOpenPrTaskId`) is NOT changed: it already withholds the branch fallback, and its
    trailer-first ordering is a separate question. And NOTHING HERE RETIRES OR RE-CREDITS AN EXISTING
    RECORD — see the note.
  acceptance:
    - claim: "a filing pull request that carries a trailer does not credit the task it filed"
      proof: "unit test: W1-T1004: a filing pull request carrying a trailer does not credit its task"
    - claim: "an implementation pull request carrying a trailer is credited exactly as today"
      proof: "unit test: W1-T1004: an implementation pull request carrying a trailer still credits its task"
    - claim: "a filing pull request opened from a run branch does not credit the task on that branch"
      proof: "unit test: W1-T1004: a filing pull request on a run branch does not credit its task"
    - claim: "a filing whose task genuinely delivers plan text is still credited by it"
      proof: "unit test: W1-T1004: a filing whose own deliverable is plan text still credits its task"
