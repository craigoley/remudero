    The diagnostic positively asserts the actual CLI replay binding, but is not a
    full reviewCommand execution, repair qualification or historical live-call trace.
    Six normalized function ASTs and the callback were rechecked against main
    568418dd179a8e7401fd6e2ecd2ad5286603edd8; this is not a complete dynamic-closure proof.
    Evidence: Remudero-notes/sol/S5-replay-lifecycle-probe.tap.log and
