  design: |
    Change only the replay-restoration fetchLifecycle callback to the existing
    fetchPrLifecycleAsync transport. Preserve lifecycle ordering, exact qualified URL,
    closed/merged refusal, current-head/status identity, publisher and review-owner
    checks, genuine auth/malformed error provenance and every later status/comment/arm
    guard. Leave the initial pending best-effort callback, legacy injected defaults,
    shared publisher API and other reads unchanged. Add no retry, wait constant, grace,
    cache-shaped success, retry-cap reset, status bypass or daemon/runtime change.
    Exercise the actual replay branch through reviewCommand with its real default
    publisher and contained private transport/cache fixtures. A heartbeat must run
    while lifecycle admission waits, then exactly one child uses the original target.
    Closed/merged or unreadable lifecycle outcomes cannot publish success or reach
    comments/arm/spend. Also preserve genuine open-replay restoration under its normal
    review/status ownership checks. Existing assertions, inputs, expected values,
    timeouts and skips remain untouched. Use repository aliases and repoRoot helpers;
    test-place computes the new test's maintained folder before filing.
    Dependency on W1-T11631 serializes the active review.ts owner; plan merge alone
    grants no implementation, claim transfer, additional retries or runtime authority.
