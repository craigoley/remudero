- id: W1-T11891
  title: A capable host runs more than four measured author workers without a fixed execution ceiling
  repo: remudero
  depends_on: []  # W1-T11583 removed AUTHOR_SLOT_CEILING=1; this follow-up removes its retained four-worker maximum.
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high  # Removes a fixed admission cap; measured CPU, memory, FIFO grants, and deadline checks remain authoritative.
  band_meaning: blast-radius
  origin: architect
  plan_refs: [W1-T7809, W1-T9951, W1-T9952, W1-T9953, W1-T11583]
  files:
    - scripts/preflight-author.mjs
    - scripts/lib/native-author-runtime.mjs
    - scripts/plan-author-runtime.mjs
    - test/ci/a-capable-host-runs-more-than-four-author-workers.test.ts
    - test/ci/an-author-preflight-runs-the-workers-its-measured-slot-grants.test.ts
    - test/author-deadline-capacity.test.ts
