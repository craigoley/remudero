  rationale: |
    READ at current origin/main:
    - scripts/preflight-author.mjs declares AUTHOR_MAX_WORKERS = 4. hostBudget clamps min(cpuWorkers, memoryWorkers, slotConcurrency) to four; deadlineHostBudget refuses budgets above four; enqueueTestSlot passes maxConcurrency: AUTHOR_MAX_WORKERS; executionWorkers clamps to four.
    - scripts/lib/native-author-runtime.mjs: runtimeDeadlineFit also rejects workers > 4. This is used by the real author path and the estimate-only scripts/plan-author-runtime.mjs caller, so the two contracts must be separated rather than granting estimates execution authority.
    - src/lib/test-slot.ts already derives CPU capacity from testRunConcurrency and measured memory capacity from memoryTestConcurrency. The native FIFO slot grant further bounds each run. These measurements provide the dynamic ceiling; AUTHOR_MAX_WORKERS is the additional static maximum.
    - On macOS, readHostCapacityInputs currently calls readMemoryHeadroom without its Darwin vm_stat reader. That returns unknown memory even though the slot reader can call vm_stat. Passing pre-admission width 1 as maxConcurrency then prevents the slot from granting more. The fix must reuse the existing readVmStat path for author pre-admission sizing and test both readable and unavailable readings.
    - With memory unmeasured before a slot is held, the author pre-admission estimate must remain one worker. Once an actual slot is acquired, its measured concurrency may supply the memory-side bound. Infinity is never an admissible substitute for missing memory evidence.
    - scripts/calibrate-author-runtime.mjs limits calibration samples with Math.min(4, slot.concurrency), and scripts/lib/native-author-runtime.mjs readRuntimeProfile refuses any profile whose concurrency is above 4 (line 131). Both are fixed four-worker clamps on the calibration path. They are IN scope under the 2026-11-10 operator amendment below.
    The W1-T11583 implementation merged in PR #17263 and its plan amendment merged in #17276. It removed AUTHOR_SLOT_CEILING=1 and added the measured-slot grant path while deliberately retaining AUTHOR_MAX_WORKERS=4. This task removes that remaining author execution maximum and every calibration clamp still fixed at four. No other current task or decision authorizes it.
