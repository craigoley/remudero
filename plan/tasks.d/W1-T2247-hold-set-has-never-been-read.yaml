  note: |
    NOTHING DELETES AND NOTHING AUTO-PRUNES. The output is a PER-BRANCH RECOMMENDATION the operator
    rules on, the same shape as triage's proposal PR and the inbox's ratifiable draft. No branch is
    removed by this task at any rung, and NOTHING AUTO-PRUNES A BRANCH BECAUSE A MODEL SAID SO — a
    verdict is an input to a human ruling, never an action.

    THE GUARDED SIX STAY GUARDED and protection keeps being evaluated first and winning outright.
    THE MANIFEST STAYS ON STDOUT WITH SHA AND NAME: it is the only thing that makes a deletion
    reversible (`git push origin <sha>:refs/heads/<name>`), and `state/` is gitignored — the path
    where cited reports go to die. Do not move it to a file and do not drop the sha to shorten it.

    AN OPERATOR-RUN ADJUDICATION AND AN AUTOMATIC ONE ARE DIFFERENT PROPOSALS AND THIS ARGUES THE
    OPERATOR-RUN ONE. The reasons are specific rather than general: the residue is 20 and one-off, so
    there is nothing for a schedule to amortise; the failure mode of a wrong verdict is a lost branch
    with no PR, which is unrecoverable except through the manifest sha; and this repo has four bounds
    that fired on healthy conditions, so an unattended rung acting on a model's judgement about
    "still wanted" would be the worst of them. NO CRON, NO POLLER, NO DAEMON RUNG IS PROPOSED HERE.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (hold-set-adjudication-residue, status) at
      risk:medium — Rule 19: raise to risk:high or decompose into one task per concern `sizingViolation` returns `undefined` on its first line at
    `risk: high`, so that refusal is the only scoring of this span this shard will ever get.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/hold-set-adjudication-residue.test.ts`, declared in `files:` and
    absent from this tree, so on the filing PR each resolves through W1-T456's forward-reference
    carve-out.
