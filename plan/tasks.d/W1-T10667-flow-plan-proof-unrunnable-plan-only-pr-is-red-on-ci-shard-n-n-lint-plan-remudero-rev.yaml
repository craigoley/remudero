  design: |
    ROOT CAUSE (measured repeat). W1-T10266 (merged) added `blockerOwner(blocker, planRepairCapable)`, which returns
    `operator` for plan-proof-unrunnable when planRepairCapable is false. Nothing in production calls it. The ledger
    projection is `blockerFields` (src/lib/pr-blocker.ts), called from runSweep in src/lib/sweep.ts, and
    `blockerFields` still computes `blocker_owner` inline as `"NONE"` for this exact case. W1-T10266's test only checks
    blockerOwner, so the `sweep.disposed` rows kept saying NONE. The flow gardener prices NONE as unowned and filed
    this class again (W1-T10667 after W1-T10266).
    CHANGE (src/lib/pr-blocker.ts only):
    1. `blockerFields` sets `blocker_owner: blockerOwner(blocker, planRepairCapable)`. That single owner decision
       now covers both the helper and the projected row. Every other blocker keeps its PR_BLOCKER_OWNERS entry
       unchanged.
    2. No change to src/lib/sweep.ts, DEFAULT_SWEEP_POLICY.stageBackstops, dispositions, admission,
       approval, CI, retry, strike or merge gates.
    TESTS:
    3. Extend the existing "the final write distinguishes plan and metadata waits from own and base reds" test
       in test/every-open-pr-names-one-blocker-and-its-owner.test.ts. For a red plan-only PR it asserts that the
       written `sweep.disposed` row has `blocker` plan-proof-unrunnable, with `blocker_owner` `operator` when no
       plan-repair lane can act and `plan-repair` when one can. It also asserts that `blockerFields(...).blocker_owner`
       equals `blockerOwner(...)` for both values of planRepairCapable. For the incapable caller it asserts that the
       disposition is unchanged (still `blocked-ambiguous`, not cleared or merged). In an actionable pass the
       operator still receives exactly one escalation, made by the disposition.
    4. In test/every-open-pr-names-one-blocker-and-its-owner.test.ts, change each place that locks this case to `"NONE"`
       (the split-cases table, the blockerFields(…, false) assertion, the plan/metadata final-write table and the
       capped-green incapable branch), the expected value becomes `"operator"`. The `other` case stays NONE.
    5. test/a-stalled-pr-stage-is-named-by-the-reason-it-kept-repeating.test.ts: W1-T8267's "stalled at once" rule
       is for blockers no one owns. This case is now owned by the operator, and stageBackstops has no
       plan-proof-unrunnable entry. Do NOT add one, because that lives in sweep.ts. Keep every W1-T8267 `test(` title
       verbatim, so W1-T8267's grep proofs still match. Re-point each fixture that used plan-proof-unrunnable as its
       ownerless example to a blocker whose table owner is still NONE (`escalated` via a dispatch hold, or `other`
       via unreadable reviewer evidence). Those tests then still prove that ownerless stages stall at once.
    NON-GOALS: this does not clear PR #14215 or W1-T10431. W1-T10431 is verify:human and stays a human decision,
    and nothing here makes a verify:human task auto-runnable. The success condition is that the row names who must
    act. It is not that the PR is cleared without a person.
