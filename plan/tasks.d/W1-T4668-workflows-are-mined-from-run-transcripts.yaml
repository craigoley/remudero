  design: |
    (i) For a task shape with enough merged runs, compare the tool-call sequences of first-attempt successes with runs that
    needed repair, and extract the reusable steps (commands, files read first, checks run) as a workflow.
    (ii) Stage the workflow as the skill draft's Procedure section (skill-workshop.ts), citing the runs it came from.
    (iii) A workflow with no step that distinguishes success from repair is not staged.
