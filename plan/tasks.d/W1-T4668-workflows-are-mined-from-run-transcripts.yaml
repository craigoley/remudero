  rationale: |
    OBSERVED 2026-09-28: mineProceduralCandidates (src/lib/retro.ts) groups runs by fixed ledger signals ('no LLM, no I/O');
    the staged skill drafts restate outcomes ('Resolve the task on the first attempt', 'Execute every acceptance criterion as
    a real proof') — skill-draft:88d9945f's 861-byte markdown. Worker transcripts exist (src/lib/worker.ts) but nothing learns
