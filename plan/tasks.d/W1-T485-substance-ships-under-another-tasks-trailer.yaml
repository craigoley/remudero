  note: "`risk: high` IS SET UP FRONT. `files:` spans `src/lib/` and `test/`, and `sizingViolation`
    (`src/lib/task-linter.ts`) blocks at >=2 subsystems below that band. The band is Rule 19's SPAN,
    not blast radius — the deliverable is a report, and design (iv) forbids it changing anything.
    `files:` WAS DERIVED BY INVOCATION COUNT, NOT PROSE MENTION. `projectPlan` (`src/lib/status.ts`)
    is the only function that holds both halves of the predicate — the merged set and the credit
    source — and over `test/` it appears 21 times in `test/status.test.ts`, 12 in
    `test/status-atomic-write.test.ts`, 10 in `test/w1-t187-benchmark.test.ts` and 8 in
    `test/run-task.test.ts`. `test/status.test.ts` is the home suite by weight and by subject; the
    other three are declared on none.
    **`src/run-task.ts` IS DELIBERATELY NOT DECLARED, AND THAT CONSTRAINS THE DESIGN RATHER THAN
    MERELY OMITTING A PATH.** It is 19,588 lines and every task naming it serialises against every
    other task that does (W1-T471, via `partitionByFileOverlap` in `src/lib/dispatch-overlap.ts`). A
    NEW CLI VERB would live there, so design (ii)(a) — a field on the existing projection — is the
    only one of the three shapes this `files:` list can carry. If the implementer prefers (b) or (c),
    THE SHARD MUST BE AMENDED FIRST: `inverseScopeUntouchedFiles` (`src/lib/review.ts`) fails a
    declared-but-untouched path exactly as `scopeViolationFiles` fails an undeclared one.
    THIS SHARD'S OWN PATH IS DELIBERATELY NOT IN `files:` — adding it converts the `proof-scope`
    warnings into a HARD `rule15-filing` violation, measured on W1-T464.
    THE PROOFS ARE PURE-PATH FORWARD REFERENCES: the named tests do not exist yet, and a path is safe
    to forward-reference where a symbol name would be a guess.
    EVERY NUMBER HERE IS AZURE-ONLY AND DATED 2026-08-14 — 510 tasks, 43 unmerged, 465/510 status
    disagreement, the five credit sources and their counts, and the 14-of-43 file-touched
    over-flag. The mini has NO SSH ROUTE to that projection or that ledger. RE-DERIVE BEFORE
    BUILDING; the union moved twice this week."
