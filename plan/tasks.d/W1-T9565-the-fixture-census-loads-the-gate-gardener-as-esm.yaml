- id: W1-T9565
  title: "THE EXPIRING-FIXTURE CENSUS LOADS THE GATE GARDENER AS ESM, SO NO COVERAGE SHARD CARRIES A <define:import.meta> RECORD — scripts/expiring-fixture-census.mjs loads src/lib/gate-gardener.ts through tsx/cjs/api's require, which compiles the src graph as CommonJS, and coverage-merge-ratchet then refuses an unrelated PR (#11757, run 38637609131)"
