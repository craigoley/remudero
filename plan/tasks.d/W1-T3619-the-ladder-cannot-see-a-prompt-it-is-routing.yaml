- id: W1-T3619
  title: "THE LADDER CANNOT SEE THE PROMPT IT IS ROUTING — selectOpenWeightModel takes the request's MODEL and EFFORT but never its SIZE, and no deployment declares a context window, so the adapter picks a model that cannot hold the request and pays a full inflated reservation to find out"
