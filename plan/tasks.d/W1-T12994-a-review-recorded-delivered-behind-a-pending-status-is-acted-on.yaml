      proof: "grep: W1-T12994 criterion 4 in test/sweep/a-review-recorded-delivered-behind-a-pending-status-is-acted-on.test.ts"
    - claim: "invariant:one-review-per-input — a fresh pending status with a live owner is never taken over or reviewed again, and a head and input with a delivered terminal verdict is never reviewed a second time"
