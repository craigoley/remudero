  title: "THE DIAGNOSE RUNG REPORTS A ROOT CAUSE WITH NO REPRODUCTION — `renderDiagnosePrompt` asks for ROOT CAUSE, EVIDENCE and SUGGESTED APPROACH but never for one command that goes red on the failure, so the third patch can inherit a theory nobody reproduced: require a REPRODUCTION field (the command, its red output, or an explicit NONE with what was tried) and a FALSIFIER for the stated cause"
