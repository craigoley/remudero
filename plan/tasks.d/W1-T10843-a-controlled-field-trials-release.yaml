- id: W1-T10843
  title: "BUILD THE CONTROLLED FIELD-TRIALS RELEASE — emit the site's field-trials-v1 artifact from the Terra-vs-Sol trial: evidence controlled, assignmentAudit pass only when the audit passes, exactly two arms with task-bootstrap intervals, never published automatically"
  repo: remudero
  depends_on: [W1-T10842]
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: "operator ruling, Craig 2026-10-27: field trials go live now as observational; controlled charts replace them when the Terra 6.1 vs Sol 6.1 A/B (the first controlled field trial) reports; nothing public auto-merges"
  plan_refs: [W1-T100001, W1-T10841, W1-T10842]
  files:
    - src/lib/field-trials-controlled-release.ts
    - src/lib/field-trials-flow.ts
    - test/routing/controlled-field-trials-release.test.ts
  status: queued
  attempts: 0
  rationale: |
    VERIFIED 2026-10-27. Core's `buildFieldTrialsRelease` (src/lib/field-trials-flow.ts, origin/main 07dbdcc77) emits
    only an OBSERVATIONAL candidate (status "candidate-unreviewed", observational true, causalClaims none,
    causalEffect "observational-only-no-randomized-allocation"). The site's parser,
    craigoley/remudero-site lib/field-trials-release.ts `parseFieldTrialsRelease` (read at site main b80fbbb), accepts
    ONLY a controlled release with exactly these keys: schema "field-trials-v1", releaseId, status "published",
    publicationScope "public-opt-in", publishedAt (ISO with milliseconds, Z), evidence "controlled",
    randomizationUnit "task", metric "verified_completion", intervalMethod "bootstrap-95-task", corpusRevision,
    harnessRevision, scorerRevision, assignmentAudit "pass", sourceRepos (consent-registry allowed),
    consentRegistryRevision, and arms = EXACTLY TWO {modelId, assigned, observed, successes, ciLower, ciUpper} with
    distinct modelIds, 0 < observed <= assigned, 0 <= successes <= observed and ciLower <= rate <= ciUpper within
    [0, 1]. Ids match ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$. Its `publishedFieldTrialsRelease` is null: no release exists.
  design: |
    (i) BUILDER. A new module builds the release from the W1-T10842 trial's intention-to-treat rows and W1-T10841's
    registered protocol: one arm per assigned model (gpt-6.1-sol, gpt-6.1-terra), assigned = tasks assigned,
    observed = tasks that reached the outcome window, successes = verified completions, and a 95% bootstrap interval
    resampling TASKS. Revisions come from the protocol's pinned stack; sourceRepos and consentRegistryRevision from the
    existing consent file path.
    (ii) REFUSALS, each named, emitting no artifact: the assignment audit (assigned arm vs served model, missingness,
    balance) does not pass; the trial has not reached its pre-registered stopping horizon; a source repo lacks consent;
    any field would fail the site parser.
    (iii) CONTRACT TEST. The test vendors the site's parser at site commit b80fbbb (cited) and asserts every built
    release parses, and every refusal case is either refused here or rejected there.
    (v) CALL SITE. The new module exports buildControlledFieldTrialsRelease, called from the existing field-trials
    flow in src/lib/field-trials-flow.ts beside the observational builder.
    (iv) NEVER AUTO-PUBLISHED. The builder writes a candidate file for the existing field-trials import flow; the site
    PR it feeds stays behind Craig's review and nothing public auto-merges. The observational artifact is unchanged.
  acceptance:
    - claim: "A built release has exactly the site's field-trials-v1 keys and values (evidence controlled, randomizationUnit task, metric verified_completion, intervalMethod bootstrap-95-task) and passes the vendored site parser"
      proof: 'grep: test("W1-T10843: the controlled release passes the site field-trials-v1 parser" in test/routing/controlled-field-trials-release.test.ts'
    - claim: "A failing or incomplete assignment audit, an unreached stopping horizon or a source repo without consent emits no release"
      proof: 'grep: test("W1-T10843: a failing assignment audit or an unreached horizon emits no release" in test/routing/controlled-field-trials-release.test.ts'
    - claim: "Each of the two arms' counts and task-bootstrap interval come from the trial's task-level outcomes"
      proof: 'grep: test("W1-T10843: arm counts and intervals come from task-level outcomes" in test/routing/controlled-field-trials-release.test.ts'
    - claim: "The builder only writes a candidate for the reviewed import flow and never publishes or merges anything"
      proof: 'grep: test("W1-T10843: the controlled release is a candidate and is never published automatically" in test/routing/controlled-field-trials-release.test.ts'
    - claim: "The existing field-trials flow calls the controlled release builder"
      proof: 'grep: buildControlledFieldTrialsRelease( in src/lib/field-trials-flow.ts'
  falsifier: |
    Emit assignmentAudit "pass" unconditionally: the failing-audit test sees a release and fails. CLOSE IF core already
    builds a controlled field-trials-v1 release on origin/main.
