  note: "verify:auto — every open question here has a derivable answer. The one judgement call is
    precedence, and design (ii) states a recommendation with its reason rather than parking it.
    `files:` WAS DERIVED FROM THE GATES, NOT FROM THE CODE THE AUTHOR PICTURES — this week's lesson
    after SEVEN corrections. `src/lib/status.ts` is declared because design (i) lifts `projectPlan`'s
    inline regex into an exported helper there; `src/run-task.ts` because `buildOpenPrViews` and
    `isDispatchedRunBranch` both live there.
    THE DECLARED SUITES WERE MEASURED BY INVOCATION, NOT PROSE MENTION. `test/sweep.test.ts` is the
    suite that moves when an `OpenPrView` field changes shape — it builds those views by hand
    throughout. `test/status.test.ts` is declared because `projectPlan`'s attribution is asserted
    there and lifting its regex changes the shape it tests. WHOEVER BUILDS THIS SHOULD RE-COUNT both
    by invocation before trusting this list, and DROP any path the implementation does not touch:
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) fails a declared-but-untouched path just as
    `scopeViolationFiles` fails an undeclared one.
    RULE 19: `risk: high` set UP FRONT so `sizingViolation` (`src/lib/task-linter.ts`) returns early
    before `subsystemsOf` is consulted — the band is the SPAN across `src/` and `test/`, not blast
    radius. The blast radius is one resolver and one lifted regex.
    RULE 25: no instrument entanglement — `run-task.ts` and `status.ts` are product paths and nothing
    here touches `INSTRUMENT_SURFACE`.
    NO NUMBER HERE SHOULD BE QUOTED FORWARD: the 9-filings/0-run-heads sample, the 98
    `arm-error-ignored` rows and #1722's state were true at 2026-08-13T13:00Z. Re-derive — especially
    the filing-head sample, which is the evidence the whole safety argument in (iii) rests on."
