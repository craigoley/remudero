  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - No commit has touched learnings/ on origin/main since 2026-10-24, three weeks. Over the same period the ledger records 234 distinct operator hand actions on fleet PRs, and human-login sessions made about half of all merges.
    - READ measurement-cadence.ts mintCiLearningShards: the rung pairs a red gate with a later green commit on the same PR and keeps file names. It has no input from operator.intervention rows.
    - READ knowledge-gardener.ts: it merges, folds and retires lessons and never creates one.
    - READ retro.ts buildGather and gatherRuns: retro input is ledger run ids only, and operator sessions write no run rows.
    - The W1-T3712 ruling left session lessons to be landed by hand at discovery. The operator replaced it on 2026-11-15 with "Draft automatically, you release".
  design: |
    1. measurement-cadence.ts: add a hand-fix source to the rung's corpus. Group operator.intervention rows that carry evidence (W1-T12836) by cause class and most-changed file, keep classes with 2 or more rows in 14 days, and render one draft per class through the shared machine shard writer.
    2. Dedup against open drafts and merged lessons by the class key stored in the draft's origin (hand-fix:<class key>).
    INVARIANT a-hand-fix-draft-waits-for-the-operator: drafts are verify human and author_class machine, and the selection that injects learnings reads only merged lessons.
    NOT IN SCOPE: capturing the evidence (W1-T12836), automatic release, retro inputs, and doctrine files.
  falsifier: |
    Remove the hand-fix source and criterion 1 must fail. Render a draft as verify auto and criterion 2 must fail. Draft an already drafted class and criterion 3 must fail. Ignore the cap and criterion 4 must fail. Restore and all pass.
