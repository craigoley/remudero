- id: W1-T2566
  title: "THE ATTEMPT-KEY MIGRATION IS BOUNDED WITHIN A BOOT AND UNBOUNDED ACROSS BOOTS — evictRefusalPoisonedKeys frees every keyed proposal that has no cached draft, and a proposal that keeps failing GENUINELY has no cached draft either, so every daemon start re-opens it again; MEASURED 2026-09-01: median daemon process lifetime is 50.5 minutes across 479 processes with 32% under 30 minutes, so the re-open recurs roughly 29 times a day per stuck proposal at an $8.52 draft mean, and the once-per-process closure flag cannot see across the restart that resets it"
