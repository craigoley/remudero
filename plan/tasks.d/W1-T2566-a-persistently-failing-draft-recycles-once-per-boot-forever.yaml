    - claim: "a proposal never seen before is still re-opened on first sight, so a fresh host recovers"
      proof: "unit test: test/reopened-keys-are-reopened-once.test.ts"
    - claim: "the marker survives a process restart, which the closure flag it replaces could not"
      proof: "unit test: test/reopened-keys-are-reopened-once.test.ts"
