- id: W1-T13893
  title: A freshness exit starts no new full pass after its drain begins
  repo: remudero
  depends_on: []
  priority: 1.2
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: operator-request#serve-cpu-thread-2026-11-20
  plan_refs: [W1-T12237, W1-T9352]
  files:
    - src/lib/daemon.ts
    - test/a-freshness-exit-starts-no-full-pass-after-its-drain-begins.test.ts
  status: queued
  attempts: 0
  rationale: |
    Observed 2026-11-20 on the core daemon (pid 148): a restart-in-place request latched a freshness drain at
    23:33:40Z. The in-flight full pass settled at 00:12:54.166Z, the latched drain completed at 00:12:54.198Z, and
    the exit drain started at 00:12:55.055Z. Then at 00:13:01.822Z the daemon wrote daemon.sweep.started (bound_ms
    10799835) for a NEW full pass before daemon.freshness_exit at 00:15:54.816Z. src/lib/daemon.ts says
    "W1-T12237: the exit starts no pass; a running pass is awaited and ends between pull requests", so a path still
    starts a full pass once the exit drain has begun.
  design: |
    Find the path that starts the full pass after the exit drain begins (for example a sweep scheduled on the
    same tick before the exit flag is read, or a second loop that does not check the latch) and make every full
    pass start check the exit latch first. A full pass that already runs keeps W1-T12237's rule: it is awaited and
    ends between pull requests.

    INVARIANT exit-starts-no-pass: once a freshness exit drain has begun, no new full pass starts in that process.
  acceptance:
    - claim: invariant:exit-starts-no-pass — after the exit drain starts, no daemon.sweep.started row is written before daemon.freshness_exit
      proof: 'unit test: test/a-freshness-exit-starts-no-full-pass-after-its-drain-begins.test.ts'
    - claim: the test names the 2026-11-20 sequence it pins
      proof: 'grep: W1-T13893 exit drain in test/a-freshness-exit-starts-no-full-pass-after-its-drain-begins.test.ts'
  falsifier: |
    Remove the latch check from the full pass start: the test must fail with a daemon.sweep.started row after the
    exit drain began.
