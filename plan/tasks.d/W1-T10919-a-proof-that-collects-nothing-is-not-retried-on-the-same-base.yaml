  rationale: |
    RE-VERIFIED 2026-10-28 on origin/main d03d7d3ef by direct read.

    THE INCIDENT (site instance ledger, read-only on the host, via W1's diagnosis 2026-10-28).
    - PORTAL-T45 ran five times on 2026-10-27, 19:07Z to 19:38Z (runs ...055092, ...703335,
      ...189960, ...619000, ...873766), each with a pushed commit. Every run ended
      `pr.open_refused`: its `unit test:` proof "did not pass against merge base", and Vitest printed
      the TAP plan `1..0`, so it collected zero tests.
    - The cause was the runner's scope, not the work. On every one of those bases the site's
      vitest.config.mjs included only `*.test.ts`, and the declared test was a `.test.tsx` file that
      held the proof's title. PORTAL-T44 (site #213, merged 19:56Z) widened the include to
      `{ts,tsx}`. A build cut from that main would have passed.
    - About every 8 minutes a fresh build was cut on the SAME base and refused the same way, until
      `dispatch.circuit_broken` (freshCount 5, maxDispatches 5) halted the task. Releasing it now
      needs an operator `rmd release` (W1-T4691).

    THE DEFECT (core, every repo).
    - `execWhitelistedProof` (src/lib/review.ts) reads a name-filtered run that executed no
      non-skipped leaf as `no-match`, through `vitestNameFilteredOutcome` or `nameFilteredOutcome`.
    - `checkProofCommand` (src/lib/check-proof.ts) exits `CHECK_PROOF_EXIT.noMatch` (3) for it.
    - `openPullRequestChecked` (src/lib/pr-open.ts) treats exit 3 as CONCLUSIVE: `proofInconclusive`
      is only exit 4, null, a signal or an error (W1-T10742), and `failingProof` only exit 1. So it
      rejects as `branch-gap`, the re-dispatchable class, with no cause recorded.
    - `streakRefusal` (src/lib/non-worker-verdict.ts) counts that `pr_open.refused` as the worker's
      strike, and the dispatcher rebuilds it on an unchanged base.
    - Exit 3 conflates two different facts:
      (a) the proof's title is in NO test file at the head: the worker did not write the test, and a
          rebuild can fix it. This stays `branch-gap`.
      (b) the title IS in a test file at the head, but the runner collected zero tests: the runner's
          scope (include glob, file extension, suite root) cannot see that file on this base. A
          rebuild on the same base produces the same refusal, every time.

    WHY NOT A DUPLICATE. W1-T10742 (merged, #14795) made exit 4 a harness outcome and named exit 3
    as conclusive on purpose. W1-T8759 (queued) is about a proof that already passes at base.
    W1-T10897 (queued) makes a consumer daemon see its own run branches. That stops the five
    separate branches, but not the identical rebuild after the branch grace.
  design: |
    1. Classify case (b) in check-proof, where the evidence is. When a test proof's run completes
       with zero non-skipped leaves, AND the head tree has at least one test file containing the
       proof's title, or its declared path exists:
       - Print a `cause: collected-nothing` line. It names the file(s) holding the title and, when it
         can be read, the runner's include pattern from its config (vitest.config.*, or the package
         test script for node --test).
       - Exit code 3 is unchanged for every other caller.
       Use the same corpus resolution check-proof already prints as `candidates:`, so no second
       resolver is added. This covers BOTH runners in use: a vitest `1..0` or "No test files found",
       and node --test `# tests 0`.
    2. In `openPullRequestChecked`, a refusal whose result carries that cause gets a new
       `PrOpenRefusalClass` value, "proof-collected-nothing". Its message names the declared file and
       the include pattern. `recordRefusedPrOpen` writes `refusal_class: "proof-collected-nothing"`
       plus `base_sha` and `runner_config_digest`: the sha256 of the runner-config blobs the cause
       read, at the merge base. A real miss (case a) is unchanged: `branch-gap`.
    3. In `streakRefusal` (non-worker-verdict.ts), that verdict is a non-worker class,
       `proof_collected_nothing`. It is excluded from the breaker and from the lifetime count, and
       it never resets a streak. Keep the W1-T7742 contract: rows from before this task carry no
       class and are left as they were.
    4. In the dispatcher (drain.ts / daemon.ts, beside `stillBlockedByPushedRunBranch`), a task whose
       latest terminal verdict is `proof-collected-nothing` is skipped, with ledger reason
       `proof-collected-nothing-same-runner-scope`. It stays skipped while BOTH of these hold:
       - origin/main's runner-config digest still equals the recorded `runner_config_digest`;
       - the task's shard is unchanged since the refusal.
       When main changes the runner config (as PORTAL-T44 did) or the shard is amended, the task is
       dispatchable on the next tick with no operator release. This is no-hard-thresholds: no timer
       and no count, only the evidence that would change the outcome.
    5. The skip row is written once per state change, not once per tick: log only when the decision
       flips.
  prompt: |
    Read the rationale and design. Write the failing tests first, in
    test/review/a-proof-that-collects-nothing-is-not-retried-on-the-same-base.test.ts, through
    `#src/*` and `#test/*` imports, with REPO_ROOT from #test/helpers/repo-root.js. Inject the proof
