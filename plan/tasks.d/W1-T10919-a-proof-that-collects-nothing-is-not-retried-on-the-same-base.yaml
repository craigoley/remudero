  origin: "filing agent X1 2026-10-28, on Craig's 'file and fix both' after W1's wedge diagnosis of PORTAL-T45"
  plan_refs: [W1-T10742, W1-T8759, W1-T3525, W1-T4691, W1-T7742, W1-T10897, PORTAL-T45, PORTAL-T44]
  files:
    - src/lib/pr-open.ts
    - src/lib/check-proof.ts
    - src/lib/non-worker-verdict.ts
