    - claim: "a proof whose title is in no head file still refuses as branch-gap, so a real worker miss is unchanged"
      proof: 'grep: test("W1-T10919: a proof whose title is in no file still refuses as branch-gap" in test/review/a-proof-that-collects-nothing-is-not-retried-on-the-same-base.test.ts'
    - claim: "a proof-collected-nothing refusal is a non-worker strike that the breaker does not count"
