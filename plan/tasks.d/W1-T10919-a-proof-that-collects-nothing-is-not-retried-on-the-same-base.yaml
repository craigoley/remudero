  rationale: |
    RE-VERIFIED 2026-10-28 on origin/main d03d7d3ef by direct read.

    THE INCIDENT (site instance ledger, read-only on the host, via W1's diagnosis 2026-10-28).
    - PORTAL-T45 ran five times on 2026-10-27, 19:07Z to 19:38Z (runs ...055092, ...703335,
      ...189960, ...619000, ...873766), each with a pushed commit. Every run ended
      `pr.open_refused`: its `unit test:` proof "did not pass against merge base", and Vitest printed
      the TAP plan `1..0`, so it collected zero tests.
    - The cause was the runner's scope, not the work. On every one of those bases the site's
      vitest.config.mjs included only `*.test.ts`, and the declared test was a `.test.tsx` file that
      held the proof's title. PORTAL-T44 (site #213, merged 19:56Z) widened the include to
      `{ts,tsx}`. A build cut from that main would have passed.
    - About every 8 minutes a fresh build was cut on the SAME base and refused the same way, until
      `dispatch.circuit_broken` (freshCount 5, maxDispatches 5) halted the task. Releasing it now
      needs an operator `rmd release` (W1-T4691).

    THE DEFECT (core, every repo).
    - `execWhitelistedProof` (src/lib/review.ts) reads a name-filtered run that executed no
      non-skipped leaf as `no-match`, through `vitestNameFilteredOutcome` or `nameFilteredOutcome`.
    - `checkProofCommand` (src/lib/check-proof.ts) exits `CHECK_PROOF_EXIT.noMatch` (3) for it.
    - `openPullRequestChecked` (src/lib/pr-open.ts) treats exit 3 as CONCLUSIVE: `proofInconclusive`
      is only exit 4, null, a signal or an error (W1-T10742), and `failingProof` only exit 1. So it
      rejects as `branch-gap`, the re-dispatchable class, with no cause recorded.
    - `streakRefusal` (src/lib/non-worker-verdict.ts) counts that `pr_open.refused` as the worker's
      strike, and the dispatcher rebuilds it on an unchanged base.
    - Exit 3 conflates two different facts:
      (a) the proof's title is in NO test file at the head: the worker did not write the test, and a
          rebuild can fix it. This stays `branch-gap`.
      (b) the title IS in a test file at the head, but the runner collected zero tests: the runner's
          scope (include glob, file extension, suite root) cannot see that file on this base. A
          rebuild on the same base produces the same refusal, every time.

    WHY NOT A DUPLICATE. W1-T10742 (merged, #14795) made exit 4 a harness outcome and named exit 3
    as conclusive on purpose. W1-T8759 (queued) is about a proof that already passes at base.
    W1-T10897 (queued) makes a consumer daemon see its own run branches. That stops the five
    separate branches, but not the identical rebuild after the branch grace.
  design: |
    1. Classify case (b) in check-proof, where the evidence is. A test proof whose run reports
       `no-match`, whose candidate resolution found at least one head test file holding the proof's
       title (the files check-proof already prints as `candidates:`), and whose runner loaded ZERO
       files prints a `cause: collected-nothing` line. The line names those files and, when it can
       read one, the runner's include pattern. "Loaded zero files" means the top-level TAP plan is
       `1..0` with no top-level `ok`/`not ok` line, or the runner said "No test files found". That
       covers vitest's `1..0` and a node --test run reporting `# tests 0` with no file wrapper. A
       node name-filtered run that LOADED its file but matched no title still emits the file
       wrapper, so it stays a real miss. Exit code 3 is unchanged for every caller.
    2. In `openPullRequestChecked`, a refusal whose check-proof output carries that cause gets a new
       `PrOpenRefusalClass` value, "proof-collected-nothing". Its message names the files and the
       include pattern. The error carries `runnerConfigDigest`: the sha256 of
       `git ls-tree HEAD -- <runner config paths>` in the run worktree (the vitest.config.* and
       vitest.workspace.* variants, and package.json). That is what the run's runner actually read.
       A real miss (case a) is unchanged: `branch-gap`.
    3. The run's `pr_open.refused` verdict row (run-task-verb.ts) already carries `refusal_class`;
       it also carries `runner_config_digest`. In `streakRefusal` (non-worker-verdict.ts), a
       `pr_open.refused` verdict with `refusal_class: "proof-collected-nothing"` is the non-worker
       class `proof_collected_nothing`: excluded from the breaker, never resetting a streak. Keep
       the W1-T7742 contract: rows from before this task carry no class and are left as they were.
       `nonWorkerVerdictClass` (stranded-task-detector.ts) names it as itself, as it does
       `proof_inconclusive`, never as a `toolchain` fault, so the breaker-release runbook reads it
       as the runner's scope.
    4. HOLD through the EXISTING W1-T3959 mechanism, never a second one. At that refusal,
       run-task-verb.ts writes the task's prior-refusal record (dispatch-repair.ts
       `writePriorRefusal`): escalated, `preDispatchContractRevision` = the task's current
       revision, plus a new optional `runnerConfigDigest`. `terminalPreDispatchRefusalRevisions`
       gains an optional reader for the TARGET repo's current runner-config digest, computed the
       same way from `git ls-tree origin/main -- <paths>`. It is read lazily, at most once per
       selection pass, and only when some record carries a digest. A record whose digest differs
       from that reading, or whose reading failed, is left out of the held map, which fails open. So
       the daemon's existing `isTerminalPreDispatchRefusalHeld` holds the task while BOTH the shard
       and main's runner config are unchanged, and releases it on the next pass when either moves
       (as PORTAL-T44 did), with no operator release. No timer and no count (no-hard-thresholds).
       daemon.ts wires the reader to the target's checkout: the repo root for a self-target, the
       managed `repos/<repo>` checkout for a consumer.
    5. The hold is reported under the existing `held-pre-dispatch-refusal` filter name. The record's
       verdict text, `proof-collected-nothing: <files> (<include>)`, says why, so no new filter
       reason reaches the census tallies.
