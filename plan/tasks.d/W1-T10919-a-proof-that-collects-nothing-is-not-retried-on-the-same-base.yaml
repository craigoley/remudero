    - claim: "a task refused proof-collected-nothing is skipped until main changes its runner config or its shard, then dispatches with no operator release"
      proof: 'grep: test("W1-T10919: a collected-nothing task waits for a runner-config or shard change, then dispatches" in test/review/a-proof-that-collects-nothing-is-not-retried-on-the-same-base.test.ts'
  falsifier: |
    - Drop the collected-nothing cause in check-proof: the first two cases must fail, because the
      refusal is `branch-gap`.
    - Map the new class back to `branch-gap` in `openPullRequestChecked`: the first case must fail.
    - Return undefined from `streakRefusal` for the new verdict: the strike case must fail.
    - Make the dispatch skip ignore the runner-config digest, so it skips forever: the dispatch case
      must fail when the digest changes.
    - Make the skip key on the base sha alone: the same case must fail, because an unrelated merge
      to main would release a build that is refused again.
    GUARDS that held at base and must still hold:
    - an exit-1 proof still opens with its failing proof named;
    - exit 4 is still `proof_inconclusive` (W1-T10742);
    - exit 5 still refuses `stale-proof`;
    - a real miss (case a) still refuses `branch-gap` and still counts as the worker's strike.
    Remove each guard's production branch in turn: its existing case must fail. Then restore it and
    require zero failures.
