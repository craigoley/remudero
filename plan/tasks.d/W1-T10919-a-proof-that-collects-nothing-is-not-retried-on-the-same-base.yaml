- id: W1-T10919
  title: "A PROOF RUN THAT COLLECTS ZERO TESTS IS A RUNNER-SCOPE OUTCOME, NOT A WORKER MISS, AND IS NOT REBUILT ON THE SAME BASE — check-proof exit 3 (no-match) refuses as a plain re-dispatchable `branch-gap` even when the named test exists at the head, so PORTAL-T45 was rebuilt 5 times in 31 minutes on a base whose vitest include could not collect its .test.tsx file, and tripped its breaker"
