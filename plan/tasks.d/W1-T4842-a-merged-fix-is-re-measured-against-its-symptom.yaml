  rationale: |
    OBSERVED 2026-09-29: several fixes were proven only by re-running a live query by hand after merge: #7854 (a
    healthy deploy clears DEPLOY_FAILED — worked on core and console, not on site, for a reason only the re-measure
    found), #7898 and #7920 (board counts, re-measured against the fleet ledger). Unit tests passed in every case; only
    the live re-measure distinguished "merged" from "worked".
  design: |
    (i) A task may declare `symptom_query:` — an rmd read (ledger-grep pattern plus expected direction) naming the
    symptom it removes. (ii) The retro re-runs the query for fixes merged 1-7 days earlier and records
    fix.remeasured {task, before, after, moved}; a fix whose symptom did not move is surfaced once.
