  rationale: |
    OBSERVED 2026-11-03, 12:45-18:45Z, Azure host:
    - sweep.disposed recorded "plan-scoped round deferred to the full sweep (light pass)" 22 times across five fleet plan PRs from 17:14Z to 18:26Z: #16553 x5, #16556 x4, #16559 x4, #16562 x4, #16563 x5. Only 8 plan-scoped rounds dispatched in the window.
    - Full passes ran 5 times in 6 h, each after a 23-72 min prelude (sweep.full_prelude), so a deferred round waits about an hour or more.
    - In src/lib/sweep.ts the plan-round branch defers whenever deps.actionable("blocked-fixable") is false. On a light pass that is lightPassActionable's verdict for the CODE fix rung. The plan round, a plan-only worker, is gated by the code rung's CPU admission even though W1-T11148 gave plan reviews their own pool.
  design: |
    - In the plan-round branch, a light pass no longer defers solely because the code fix rung is not actionable.
    - It dispatches when a plan-lane slot is free, using the same plan-lane accounting W1-T11148 uses, and still runs the base-red, dry-run and workerAdmissionHoldReason checks first.
    - Keep "plan-scoped round deferred to the full sweep (light pass)" as the reason when the plan lane is full.
    - Mark the new admission with a comment naming W1-T11269.
    NOT IN SCOPE: the code fix rung, conflict rounds (W1-T11171), and the round's own worker.
