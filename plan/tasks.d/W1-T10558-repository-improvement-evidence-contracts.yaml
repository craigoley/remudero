  rationale: Daily progress and Code health have no source-owned versioned contract. Current UTC 7/30-day flow
    buckets and a 200-entry Recent feed cannot establish a complete local-day report. Code quality must remain
    separate from delivery friction. Establish expected evidence independently of rows observed, so missing
    data cannot look healthy.
  design: >-
    Define independently versioned typed contracts and runtime boundary validation for daily-progress-v1 and
    code-health-v1. Daily reports identify repository, instance/source scope, local ISO report date, IANA
    reporting zone, exact half-open UTC boundaries, schema version, revision and correction reason,
    generatedAt, source-specific last attempt/last success/coverage-through/next-due clocks, expected and
    observed sources/repositories, completeness and failure reasons. Define authoritative merge event time
    separately from ingestion; confirmed fleet attribution, unknown attribution and non-fleet evidence;
    distinct PR/task identities; observed day activity separate from historical end-of-day open work. Missing
    source, stale source, unauthorized, not collected, measured empty and partial are distinct. Bound rendered
    pages/cursors without bounding the count population. Deployment remains uncollected without an independent
    receipt.


    Code health identifies analyzed/baseline commits, tool/rules/config versions, scan coverage/exclusions,
    stable finding fingerprints, category and source evidence, modeled estimates, required checks and
    assessed/met counts. Incomplete required evidence cannot be healthy. Preserve new/existing findings and
    comparable-scope rules. Do not derive scores from CI success, average unlike repository grades, add
    scanner services, or invent calibration thresholds. These modules define and validate facts; no live
    collection, scheduling, paid model calls or writes. Validate the contract through direct fixtures and
    negative cases. New tests use computed rmd test-place folders and package aliases; adjust proposed test
    paths to the computed locations before filing implementation scope changes.


    Expose a source-owned expected evidence inventory through the existing repositories source publisher.
    buildRepositoryEvidenceInventory is called in repositories-view.ts using server-selected
    repository/instance configuration, independently of observed scan/event rows; retain backward-compatible
    missing-inventory state as not collected. Contract validators are used by this production inventory
    boundary and the following collectors, not only test imports. Do not claim a scanner ran or a source is
    configured merely because it is expected. Keep current repository summary fields and clocks unchanged.
  falsifier: "Remove coverage/identity validation while keeping its fixtures: missing expected repositories,
    invalid day bounds or contradictory source scope must be accepted and the first test fail. Remove
    assessed/comparability validation and the second test must fail. Restore each guard and require real
    matched test summaries."
  acceptance:
    - claim: daily contracts preserve source coverage and reject contradictory repository or day identity
      proof: "unit test: daily contracts preserve coverage and reject contradictory day identity"
    - claim: quality contracts keep incomplete and incomparable assessments from healthy scores
      proof: "unit test: quality contracts reject healthy scores from incomplete or incomparable evidence"
    - claim: the evidence mechanism is reached by its production caller
      proof: "grep: buildRepositoryEvidenceInventory( in src/lib/repositories-view.ts"
