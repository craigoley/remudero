  rationale: |
    OBSERVED ON THE AZURE FLEET 2026-09-05T04:30Z-04:40Z. The final sweep for stale daemon run
    `DAEMON-1788582094463` claimed PR #4040 / W1-T2862 and started a Claude fix worker in
    registered worktree `sweep-W1-T2862-1788582621513`. At 04:39 the worker was still alive and
    running the coverage proof. At 04:40:21 the daemon wrote `daemon_selfrestart_for_freshness`.
    The relaunched process reclaimed the prior fix-branch lock, the worker process was gone, the
    PR head remained `95f7887`, and the ledger contained no terminal result from that attempt.

    THE SOURCE PRODUCES THAT ORDER. `stopForFreshness` runs W1-T1272's mandatory final
    `runGatedSweep`, then immediately logs the restart and returns the stale summary. W1-T2379 and
    W1-T2744 intentionally let a sweep return while a long fix/CI action remains in the module's
    `detachedSweepActions` registry so the review clock stays responsive. The existing
    `drainDetachedSweepActions` is explicitly documented as the daemon-lifetime seam, but
    production imports only `detachedSweepActionCount`; no production call drains that registry
    before process exit.

    W1-T2863 solves the sibling race, not this loss. Its durable worktree-owner check prevents the
    new process from launching a duplicate checkout while the old worktree is registered. It does
    not keep a worker alive through the restart. In this incident that safety check converts the
    aborted attempt into a stranded-worktree stand-down until orphan recovery, rather than into a
    completed repair.
  design: |
    Make the freshness path a real daemon-lifetime boundary. Before returning the stale summary,
    stop any interphase light-review clock that can still admit new detached actions, run the
    existing final full sweep unchanged, then await the existing process-global
    `drainDetachedSweepActions`. Read the bounded count once before the drain and emit change-only
    start/completion telemetry when it is nonzero. Log `daemon_selfrestart_for_freshness` only
    after every action admitted by this process has settled. Do not poll promises or invent a
    second action registry.

    This drain belongs only at the actual freshness exit. Do not put it back into a phase-local
    ticker stop or the abandoned-sweep path: W1-T2744 proved that placement can freeze reviews for
    tens of minutes. A zero-action freshness exit remains immediate. Existing fix-worker, CI and
    provider bounds remain the settlement bounds; do not kill, retry, duplicate, reset or remove
    a worker/worktree to make refresh faster.

    Preserve W1-T1272's final sweep, W1-T2845's two freshness boundaries, STOP/PAUSE precedence,
    W1-T2863's worktree-owner refusal, entrypoint exit code 75, and operator lifecycle authority.
    This task changes only the ownership ordering of work already admitted by the exiting process.
