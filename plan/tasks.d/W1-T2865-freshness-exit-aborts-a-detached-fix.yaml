    - claim: "deleting the process-final drain makes the stale summary resolve while the detached fix is still pending and fails the focused suite"
      proof: "mutation test: test/daemon-freshness.test.ts"
  falsifier: |
    Close without implementation if PR #4040's original fix attempt wrote a terminal outcome or
    moved the head before the freshness event, or if production already drains detached sweep
    actions at the daemon-lifetime boundary. Both checks were run: the head stayed at `95f7887`,
    no terminal attempt row followed the dispatch, the worker vanished at the restart, and the
    only production reference is the heartbeat's count reader.

    Re-design rather than build if preserving the action requires returning the drain to a
    phase-local sweep/ticker stop. That recreates W1-T2744's review outage and is not an acceptable
    repair.
