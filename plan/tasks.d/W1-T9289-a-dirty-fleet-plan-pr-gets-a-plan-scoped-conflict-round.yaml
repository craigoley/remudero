  falsifier: |
    Leave the `conflicted` row gated on `fixHeadAcceptable` alone: the #11381-shaped view still disposes
    blocked-ambiguous with "head is not this PR task's rmd-owned run branch", and the first test fails. Admit
    every dirty plan PR regardless of author: the operator-authored view is dispatched, and the second test fails.
    Resolve by taking the branch's side: the merged shard loses `retirement: retired`, and the third test fails.
    Leave `MACHINE_LANE_HEAD_RE` at 12 gardeners: `fix-lane-garden-1` is not a machine-lane head, and the
    fourth test fails.
