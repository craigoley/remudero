  design: |
    1. EVERY FLEET PLAN FAMILY HAS A CONFLICT OWNER. A dirty PR that is a plan filing (`isPlanFiling === true`) on
       a machine-lane head (`isMachineLanePlanHead`) and authored by the fleet App (`isFleetAppAuthor`, from the
       same facts the plan repair reads) is routed to a plan-scoped conflict round when its captured conflict
       evidence names only plan-scope paths (`isInPlanScope`). Its disposition reason names that round, never
       "head is not this PR task's rmd-owned run branch". An operator, session, contributor or Codex head and a
       PR with a non-plan conflicting path keep today's refusal unchanged. Missing evidence while mergeability
       reads unknown waits as the W1-T5908 row already does.
    2. THE ROUND RESOLVES PLAN TEXT ON THE MERGED TREE. `runPlanScopedFixRound` (or a sibling that shares its
       seams: claim, materialized head worktree, plan-scope allowance, `planPrPreflight` on the result, lease push,
       `updateMetadata`, `sweep.plan_round.*` rows) gains a conflict mode. It merges origin/main into the head (a
       merge commit, never a rebase or force push) and gives the worker the conflicted shards with both sides.
       Main's side is the newer fleet decision (a retirement, a status, a field another lane added) and is kept.
       The branch's change is re-applied only where it still applies to the merged task: a placement or edit
       aimed at a task main has since retired or merged is dropped, and the PR body's matching bullet and
       `## Acceptance` line are removed through `updateMetadata`. The pushed head must preflight clean. When
       nothing of the branch's change is left, the round pushes nothing, and the existing empty-diff supersession
       (`emptyDiffSupersedes`) closes the PR on the next pass.
    3. BOUNDS ARE THE ROUND'S EXISTING ONES. One round per head, and W1-T5543's claim and refused-twice
       exhaustion. No new count, ceiling or timer. A refused or exhausted round escalates once with a question
       that names the plan-scoped conflict, not the code fix rung.
    4. ONE HEAD LIST. The machine-lane head shape includes every name in run-task.ts `GARDEN_NAMES` (derived from
       it or checked against it), so a new gardener cannot open a plan PR that has no conflict owner.
    Tests go in test/a-dirty-fleet-plan-pr-gets-a-plan-scoped-conflict-round.test.ts. Drive `runSweep` with fake
    deps over an `OpenPrView` shaped like #11381 (head backlog-garden-<epoch>, isPlanFiling, mergeState dirty,
    captured evidence on three plan/tasks.d shards, fleet-App author) and over the same view with an operator
    author. Drive the round with a git fixture in which main retired a shard the branch adds `priority:` to.
