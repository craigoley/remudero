  rationale: |
    MEASURED 2026-09-27 over the three fleets' full ledger unions (core 773,650 / console 356,871 /
    site 269,728 rows, 2026-09-20..27) and origin/main 12baa03. benchmark-quality-v1 already
    measures per-field missingness and join coverage, but no process watches it: the gaps behind
    W1-T4613, W1-T4615 and W1-T4616 were each found by a one-off research census. The standard is
    that every daemon, task, cycle, worker and run adds usable evidence or an explicit coverage gap,
    and a gardener turns gaps into bounded work.
  design: |
    An evidence-coverage gardener reads the benchmark-quality projection per lane and field on a
    cadence, and when a lane's coverage for a required field (assignment, served model, tokens,
    cost, outcome join) is below its own trailing baseline or absent, files or updates one dedup-
    keyed follow-up naming the lane, field, denominator and first-seen time. It never gates a PR or
    blocks work; its own failure is visible and becomes repair work.
  acceptance:
    - claim: "a lane whose coverage of a required evidence field falls below its trailing baseline gets one dedup-keyed follow-up, and the gardener never gates a PR"
      proof: "unit test: test/an-evidence-gap-becomes-work.test.ts"
    - claim: "the new module is wired into its production caller, not shipped unwired"
      proof: "grep: runEvidenceCoverageGardener( in src/run-task.ts"
  falsifier: |
    Revert the change: the task's own test fails on the gap its rationale measured.
