- id: W1-T4844
  title: "THE DEPLOY TICK RUNS THE DAEMON'S OWN WORKING TREE, WHICH AN IDLE DAEMON NEVER MOVES — the site's 2026-09-29 19:06 deploy ran code from 13:09 and skipped a fix merged at 15:26. The tick must never run deploy logic older than the checkout it deploys"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: "operator ask 2026-09-30: go with all of these recommended follow ups (throughput, automated flow, self improvement)"
  note: "reservation hand-off: plan-flow-improve-1790732974000 -> plan-flow-improve-1790732974000"
  plan_refs: [W1-T3604, W1-T4267]
  files: [deploy/install-host-units.sh, src/lib/deployer.ts, test/the-deploy-tick-never-runs-older-code-than-it-deploys.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-09-29: rmd-site-relaunch.sh (generated by deploy/install-host-units.sh) runs
    "$STATE_DIR/remudero/bin/rmd" deploy-run. That tree moves only when the daemon boots; the idle site's was at
    cb2224587 (13:09) when its 19:06 deploy ran, so #7854's clearFailure (merged 15:26) never executed there, while
    core and console cleared. The install checkouts (daemon-install) are current but hold no node_modules, so the tick
    cannot simply switch to them — that is why this is filed rather than hand-patched.
  design: |
    Choose on measurement and record it: make daemon-install runnable (install its node_modules at convergence) and
    run deploy-run from it; or keep the daemon tree but have deploy-run refuse to act, logging
    deploy.stale_code, when its own HEAD is behind the install checkout on deploy/ or src/lib/deployer.ts.
  acceptance:
    - claim: "a deploy tick whose code predates the install checkout does not act"
      proof: 'grep: test("W1-T4844: a deploy tick whose code predates the install checkout does not act" in test/the-deploy-tick-never-runs-older-code-than-it-deploys.test.ts'
    - claim: "a current deploy tick proceeds"
      proof: 'grep: test("W1-T4844: a current deploy tick proceeds" in test/the-deploy-tick-never-runs-older-code-than-it-deploys.test.ts'
  falsifier: |
    Skip the freshness check and the first test deploys with stale code.
