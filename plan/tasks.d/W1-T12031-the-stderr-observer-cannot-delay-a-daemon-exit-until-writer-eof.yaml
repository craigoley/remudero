    - claim: The real supervision section records the actual daemon exit before an inherited stderr writer closes, so that writer's open descriptor cannot hold the supervisor at the observer wait
      proof: "grep: W1-T12031 criterion 1 in test/daemon/a-slow-crash-loop-is-reported.test.ts"
    - claim: Forwarded stderr bytes and the last bounded heap-limit line remain exact, absent heap evidence stays absent and the actual child exit code is preserved
      proof: "grep: W1-T12031 criterion 2 in test/daemon/a-slow-crash-loop-is-reported.test.ts"
    - claim: A freshness exit can reach the existing supervised resync and next child while the inherited writer is still open, with the restart, signal and crash-budget decisions unchanged
      proof: "grep: W1-T12031 criterion 3 in test/daemon/a-slow-crash-loop-is-reported.test.ts"
  rationale: |
    OBSERVED 2026-11-10: Core requested freshness exit at 09:15:14Z. Its daemon
    PID151 ended, while supervisor6 waited on its sole child awk109. The observer
    waited for pipe input, supervisor FD19 was closed, and workers retained FD19.
    Installed source SHA256 f9e865fae4cb838ab42c1de2e85fc92707674d3a849a929a0c425790f85f2b7e
    matches the merged S7 entrypoint. Its mawk is 1.3.4 20200120.
    The exact installed supervision section was replayed in disposable fixtures.
    Default awk withheld exit evidence while a private child held its writer open;
    a line-input control recorded real exit75 and heap evidence before writer EOF.
    Both preserved synthetic stderr. This exposes input buffering; output fflush
    does not provide the needed input progress. The published mawk manual confirms
    default pipe buffering. Existing real-entrypoint cases close their writers.
    Main2c6e7431 and all eleven captured open PR heads retain the old observer;
    no current observer-buffering task was found. W10861 concerns merged-plan read
    diagnostics, not this observer. The later Core replacement makes the old leased
    recovery unnecessary; no retargeted recovery or live signal was performed.
  design: |
    Replace only the inline awk stderr observer with a line reader using the
    existing Node runtime. Consume the in-band stop marker without waiting for EOF,
    preserve stderr bytes and line endings, preserve the existing bounded last
    heap-limit evidence, and honor output backpressure before the observer exits.
    Add no executable dependency, source helper file, timeout, grace period or retry.
    Keep the child's saved exit status and every existing signal, restart, resync,
    crash-budget and exit-evidence decision unchanged.
    Append regressions only to the existing slow-crash-loop test. Exercise the
    real supervision section with private child processes and an inherited writer
    that remains open. Also exercise ordinary writer EOF and raw stderr/heap
    forwarding. Preserve all existing assertions, inputs, expected values, titles,
    timeouts and skips. No production failure induction or live pipe modification.
  falsifier: |
    Restore only the old observer and the real held-writer exit and freshness
    continuation regressions must fail on the deployed Linux/mawk environment.
    Drop evidence or alter forwarded bytes and the exact-output control must fail.
    Restore and require every new case and the unchanged existing suite to pass.
  note: |
