    gateway. Nothing spawned, no network.
    THE COUNTS IN THE RATIONALE ARE MEASURED, NOT GREPPED. An earlier draft of this shard said
    `eleven shards in plan/tasks.d` — that was wrong twice over (the real tasks.d count is TEN; it
    wrongly included W1-T324, which reads `status: queued`) and it understated the population by
    two thirds, because it never loaded plan/tasks.yaml. The figures now quoted come from parsing
    BOTH files into one 420-task list and filtering. The lesson is this shard's own: a count taken
    over the file you happened to open is not a count over the plan."
