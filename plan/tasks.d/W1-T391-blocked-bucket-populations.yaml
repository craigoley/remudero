- id: W1-T391
  title: "the starvation census counts deliberate RETIREMENT RECORDS as recoverable blockers — but NOTHING RECORDED distinguishes a retirement from an operator block, both are `status: blocked` on disk, so the fix needs a plan ruling on what `withdrawn` means before any discriminator can be written"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: "THE DEFECT IS REAL AND RE-DERIVED AT 3c63dd9. THE ORIGINAL DESIGN WAS WRONG AND IS
    WITHDRAWN. A session implemented it fully before the flaw surfaced; this shard now carries the
    flaw, the evidence, and the question — not a design.
    THE DEFECT, UNCHANGED AND STILL TRUE. `isDispatchEligible` (drain.ts) files every
    `t.status === 'blocked'` task under one `DispatchFilterReason`; `tallyDispatchFilters` gives it
    one bucket; `StarvationCensus` (daemon.ts) classes that bucket RECOVERABLE, where its own doc
    defines recoverable as the classes that could clear on their own without the plan itself ever
    changing. Retirement records can never clear, so the bucket is permanently non-empty and the
    escalation re-fires forever on a healthy plan. Re-measured over the fully loaded plan (monolith
    plus every shard, 427 tasks at this sha): 32 tasks are `status: blocked` and 31 carry
    withdrawal/retirement language. That is the fourth bound in this repo observed firing on a
    HEALTHY condition, after ci-gate's wait cap (W1-T312), the dry-run deploy ceiling (W1-T380) and
    the check-wait bound (W1-T382).
    WHY THE ORIGINAL DESIGN CANNOT WORK. It proposed discriminating ON-DISK from IN-MEMORY: a
    retirement record is `blocked` in the file as parsed, a runtime flip is applied afterwards. But
    the same filing's own clause on the escalation text says the instruction to lift a plan mark is
    correct FOR A TASK AN OPERATOR BLOCKED INTENDING TO UNBLOCK IT LATER — and that case is ALSO ON
    DISK. So the discriminator separates permanent-record-or-operator-block from runtime-flip. It
    does not separate permanent from recoverable, which is the split the census actually needs.
    PROVEN, NOT ARGUED. `test/queue-starvation.test.ts`'s first claim seeds a task whose title
    states it is an explicitly blocked task — the legitimate operator-block. The implemented
    discriminator reclassified it as withdrawn and that test FAILED. The failure is the proof: the
    two populations are indistinguishable to an on-disk test, and the suite already contains a
    fixture of the case the design would misfile.
    THE 31-OF-32 FIGURE IS A STATISTICAL REGULARITY THAT THE FILING READ AS A STRUCTURAL ONE. That
    almost every on-disk `blocked` task happens to be a retirement record today says nothing about
    what the field MEANS, and a predicate built on it silently misfiles the thirty-second — which is
    exactly what happened. Saying this plainly is the point of the re-scope.
    THE INFORMATION DOES NOT EXIST TODAY, AND THAT IS THE FINDING THAT SIZES THE WORK. Loading the
    plan and taking the union of every field present across all 32 blocked tasks: acceptance,
    attempts, budget_usd, context, depends_on, files, hand_built, id, note, origin, pr, principles,
    prompt, rationale, repo, risk, status, title, type, verify. THERE IS NO FIELD THAT COULD
    DISTINGUISH A WITHDRAWAL FROM AN OPERATOR BLOCK. No `withdrawn`, no `retired`, no `superseded`,
    no reason code. `note` and `rationale` are prose, and a lexicon over prose is the same
    statistical guess in a different costume. `plan.ts`'s `TASK_STATUSES` is queued, recon, prompted,
    running, review, fixing, diagnosing, blocked, merged, done — `withdrawn` is not among them, which
    is precisely why the retirement records use `blocked` and say so in their notes.
    SO THIS IS A PLAN-SCHEMA QUESTION, NOT A SMALL CHANGE, and that is why it is now `verify: human`:
    `isDispatchEligible` refuses a non-auto task before the linter is consulted, so it can no longer
    be handed to a worker who will rediscover this wall.
    COVERED-BY: NO. W1-T298 built the census and is the thing being corrected. W1-T345 dedups
    referent-less escalations, so it makes this fire ONCE rather than per tick — a permanently-open
    wrong issue is the worse failure. W1-T367 ruled the yaml `status:` field decorative and named
    `isDispatchEligible` as the ONE reader that must keep honouring `blocked`; nothing here changes
    that."
  design: |
    THIS SHARD POSES A QUESTION. It deliberately carries no discriminator design, because the
    previous one was inferred from a regularity and shipped a misfiling.

    (i) THE RULING NEEDED, stated as narrowly as it can be. Both populations are `status: blocked`
    on disk and nothing recorded tells them apart. Either (a) a retirement record gets a recorded
    marker of its own so the two become mechanically separable, or (b) the census stops treating
    `blocked` as recoverable at all and the escalation's wording carries the ambiguity instead, or
    (c) the operator-block case is declared not to exist in practice and `blocked`-on-disk is
    DEFINED as withdrawal — in which case the existing test fixture named above is wrong and must
    change with the ruling, not quietly around it. Each of these is a different amount of work and
    only (a) touches the schema.

    (ii) WHAT AN IMPLEMENTER MUST NOT DO. Do not infer the discriminator from note or rationale
    prose. Do not re-derive the 31-of-32 count and treat a larger majority as a stronger argument;
    the count is not the question. Do not add a status value without the ruling — the retirement
    records chose `blocked` precisely because `withdrawn` is not a valid status, so introducing one
    touches every reader of the field.

    (iii) TWO FINDINGS FROM THE STOPPED IMPLEMENTATION, PRESERVED BECAUSE THEY SURVIVE ANY RULING.
    First: whichever way the split is drawn, the new bucket must be added back into
    `autoTriageCensus`'s `depth` AND its `allMerged` guard, or the auto-triage rung's cadence changes
    as an unasked-for side effect — withdrawn ids currently land in the blocked bucket, so they
    already count toward depth and already keep `allMerged` false. Second: `buildPlanFrontier`
    (panel-graph.ts) does NOT pass the discriminator, so a fail-soft default leaves the console
    frontier rendering a blocked task with its own note unchanged. That was MEASURED, not assumed,
    and it is what keeps the change inside drain.ts and daemon.ts rather than spilling into
    panel-graph.ts.

    (iv) THE ESCALATION TEXT LIVES OUTSIDE BOTH DECLARED FILES — `escalateStarvation` is in
    run-task.ts. Any ruling that changes what the escalation SAYS therefore widens this task's
    `files:`, and that widening must be ratified before it is made, not disclosed afterwards.

    NOT IN SCOPE UNTIL THE RULING LANDS: any predicate, any enum member, any schema change.
