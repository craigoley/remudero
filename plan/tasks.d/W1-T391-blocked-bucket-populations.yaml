- id: W1-T391
  title: "the starvation census counts deliberate RETIREMENT RECORDS as recoverable blockers, so the escalation tells the operator to lift a plan mark that must never be lifted — and can never itself be satisfied"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: "MEASURED 2026-08-07 from issue #1444 and read from source at deadef6.
    `status: blocked` CARRIES TWO UNRELATED MEANINGS AND THE CENSUS CANNOT TELL THEM APART.
    (1) A RETIREMENT RECORD, AND IT IS THE OVERWHELMING MAJORITY. Counted 2026-08-07 over the FULLY
    LOADED plan (plan/tasks.yaml plus every plan/tasks.d shard, 420 tasks): **32 tasks carry
    `status: blocked`, and 31 of the 32 are withdrawal or retirement records** — only W1-T10 is
    anything else. Ten live in tasks.d (W1-T191, W1-T269, W1-T270, W1-T273, W1-T286, W1-T291,
    W1-T292, W1-T293, W1-T314, W1-T369); the rest are inline, and they run back to the earliest
    tasks in the plan (W1-T3, W1-T5, W1-T8, W1-T9a/b/c, W1-T11, W1-T14, W1-T37, W1-T53, W1-T61 …).
    They say so in as many words — W1-T369's note is representative: `RECORD of the withdrawal, not a
    work item. status: blocked so nextRunnable/assertRunnable never dispatch it`, with the reason
    given verbatim as `withdrawn is not one of plan.ts's TASK_STATUSES`. They cite each other as
    precedent. These are PERMANENT by design.
    WHY #1444 REPORTS 14 AND NOT 32, WHICH THE IMPLEMENTER MUST NOT MISREAD AS A DISCREPANCY:
    `tallyDispatchFilters` is FIRST-MATCH and `isDispatchEligible` tests `isMerged` BEFORE
    `status === 'blocked'`, so every tombstone whose task also derives MERGED is counted under
    `already-merged` instead. The 14 is the residue — tombstones that are NOT merged — and it will
    drift as credit changes. Size the fix to the 31, never to the 14.
    (2) A RUNTIME FLAG. daemon.ts's independent-failure path sets `task.status = 'blocked'` IN MEMORY
    so `nextRunnable` stops reconsidering the task this run; status.ts's own comment contrasts it as
    the flip that `resets every time a fresh process starts`. Nothing is written to disk.
    THE CENSUS POOLS BOTH. drain.ts's `isDispatchEligible` files every `t.status === 'blocked'` under
    one `DispatchFilterReason`, `tallyDispatchFilters` gives it one bucket, and daemon.ts's
    `StarvationCensus` classes that bucket RECOVERABLE — its doc defines recoverable as the classes
    that `could clear on their own without the plan itself ever changing`.
    THE OBSERVED CONSEQUENCE, quoted from issue #1444: `blocked: 14 (W3-T3, W1-T269, W1-T270, W1-T314,
    W1-T377, W1-T378, W1-T379, W1-T380, +6 more)` with the recommendation `a blocked: task needs the
    plan mark lifted`. That instruction is wrong for BOTH populations and in OPPOSITE ways. For the
    retirement records there is a plan mark and lifting it would re-dispatch work the Architect
    deliberately withdrew. For the runtime flips there is NO plan mark to lift — an operator who opens
    W1-T377's shard finds `status: queued` and has been sent to look at nothing.
    AND IT CAN NEVER BE SATISFIED. The retirement records are permanent, so the bucket is permanently
    non-empty, so `recoverable > 0` holds forever and this escalation re-fires for as long as the
    daemon runs. That is the FOURTH instance of a bound firing on a HEALTHY condition in this repo —
    after ci-gate's wait cap (W1-T312), the dry-run deploy ceiling (W1-T380/#1392) and the check-wait
    bound where 21 of 21 booked PRs merged (W1-T382/#1401).
    COVERED-BY: NO. W1-T298 built the census and is the thing being corrected. W1-T345 dedups
    referent-less escalations, so it makes this fire ONCE rather than per tick — it does not make the
    firing correct, and a permanently-open wrong issue is the worse failure. W1-T367 ruled the yaml
    `status:` field decorative and named `isDispatchEligible` as the ONE reader that must keep
    honouring `blocked`; this task does not touch that."
  design: |
    SEPARATE THE POPULATIONS AT THE ONLY POINT THAT CAN STILL TELL THEM APART — PLAN LOAD.

    (i) THE DISCRIMINATOR IS ON-DISK vs IN-MEMORY, AND IT IS FREE. A retirement record is `blocked` in
    the file as parsed; a runtime flip is applied after. Capture the withdrawn set once when the plan
    is loaded, before any dispatch loop can mutate a Task. No schema change, no new yaml field, and no
    migration of the eleven existing shards — which matters, because W1-T367 already ruled that field
    decorative and a second reader of it would be a step backwards.

    (ii) SPLIT THE BUCKET, DO NOT JUST FILTER IT. `DispatchFilterReason` gains a `withdrawn` member
    alongside `blocked`, so the idle-reasons line an operator actually reads names the two separately.
    Filtering withdrawn tasks out silently would fix the alarm and DELETE the information — the
    operator would lose the ability to see that eleven tasks are retired, which is a real thing to
    know about a plan. This is P48's clause applied to a non-zero value: the count is not wrong, the
    VOCABULARY is, and collapsing rather than naming is the defect.

    (iii) ONLY `blocked` STAYS RECOVERABLE. `StarvationCensus`'s recoverable set drops `withdrawn`.
    A plan whose only non-dispatchable tasks are withdrawn or merged is DONE, not starved — the same
    distinction the census already draws for `already-merged` and `verify-not-auto`, extended to the
    class that actually fits it.

    (iv) THE ESCALATION MUST STOP GIVING THE WRONG INSTRUCTION. `a blocked: task needs the plan mark
    lifted` is only ever correct for a task an operator blocked intending to unblock it later. Say
    that, and say separately what a runtime flip means (it clears on the next process; look at the
    verdict, not the yaml). If neither population is present the escalation must not fire at all,
    which is clause (iii) doing its job.

    (v) FALSIFIER, AND IT MUST BITE ON THE ALARM ITSELF. A plan of exactly one withdrawn task and
    nothing else runnable must produce ZERO starvation escalations, and the same plan plus one
    genuinely-blocked task must produce exactly one naming ONLY that task. One direction alone proves
    nothing: a census that never fires would also pass the first half. Assert the withdrawn id is
    ABSENT from the escalation body, positively, rather than asserting a count.

    NOT IN SCOPE: adding `withdrawn` to `TASK_STATUSES` (a schema change touching every reader, and
    unnecessary once the discriminator is load-time); changing `isDispatchEligible`'s refusal of
    `blocked`, which is correct and is the one sanctioned reader of the decorative field; the
    circuit-breaker bucket, which is already reported separately and is not part of this defect;
    W1-T390's credit bug, which is why two of #1444's named ids are stuck in the first place.
  acceptance:
    - claim: "a plan whose only non-dispatchable tasks are withdrawn raises no starvation escalation at all"
      proof: "unit test: test/blocked-bucket-populations.test.ts"
    - claim: "a withdrawn task and a genuinely blocked task are tallied under distinct reasons rather than one bucket"
      proof: "unit test: test/blocked-bucket-populations.test.ts"
    - claim: "the escalation body names the blocked task and never names the withdrawn one"
      proof: "unit test: test/blocked-bucket-populations.test.ts"
    - claim: "isDispatchEligible still refuses every task marked blocked on disk, withdrawn or not"
      proof: "unit test: test/blocked-bucket-populations.test.ts"
