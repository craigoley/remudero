    over-read it. The change is small and strictly additive to a reporting path, and it cannot alter
    which tasks dispatch: clause (v)'s fourth criterion exists to prove exactly that. What earns the
    band is that the reason enum lives in drain.ts while the recoverable predicate and the escalation
