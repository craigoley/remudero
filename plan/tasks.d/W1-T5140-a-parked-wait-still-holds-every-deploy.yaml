- id: W1-T5140
  title: "A PARKED WAIT STILL HOLDS EVERY DEPLOY — recycle-container.sh waits on every state/inflight lock, and a lock whose holder is parked in run.awaiting_external is not doing work; W1-T5127 hands off only the build run's own CI wait, so the sweep fix round's CI wait (holding a fix-branch claim) and the PR-merge wait still hold the recycle until WAIT_SECONDS runs out and it refuses (2026-10-01: W1-T5004's two locks held a 3000 s wait to refusal at 9441 s old; only RMD_RECYCLE_WAIT_S=5400 got through)"
  repo: remudero
  depends_on: [W1-T5127]
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 15.00
