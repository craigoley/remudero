  rationale: |
    W1-T5433 owns exclusive admission for readiness-gap sidecar appends, not prospective protocol registration. W1-T5434 owns reading a competing frozen calibration population instead of throwing on creation, not the order of runtime-pin validation before registration. Preserve both independent mechanisms and their owners; this narrower proposal neither supersedes those tasks nor changes its two declared paths to hide their shared surface.
    Observed main96425de0e66503c6f81569d0955bd5bfbc18b52c source blob1e902d08e11682043db9cfa239b061db48fb6e17 registers with runProspectiveAa(action:register) before its runtimePinRefusals call. Existing W5341 protects dispatch; this narrowly proposes pre-registration no-write protection, not a claim that any invalid pair actually ran.
    Registration can activate the ordinary daemon side-pair seam. Validate-before-write therefore matters separately from validate-before-dispatch. Reuse W4647/W5341/W5432 and their existing protocol/receipt/task intake rather than duplicate the evaluation framework or run a readiness command merely to inspect it.
    Fresh advertised-head shard and inline-plan subject scope, complete open-PR FILE plus SUBJECT scope and original issue7418 remain required before reservation/publication. A captured population and positive controls establish that bounded scope only, never universal absence or runtime adoption.
    Primary research cross-checks: Anthropic Demystifying evals for AI agents (https://www.anthropic.com/research/demystifying-evals-for-ai-agents) distinguishes final environment outcomes from agent reports; Microsoft Research Data Quality for Trustworthy A/B testing (https://www.microsoft.com/en-us/research/articles/data-quality-fundamental-building-blocks-for-trustworthy-a-b-testing-analysis/) identifies missingness, validity, joins and uniqueness as prerequisites for trustworthy conclusions. These support the design, not proof that Remudero calibration passed.
    Craig approved author NOT RUN for this one parked plan-only filing; normal full CI/security/coverage/review remain required. Serve stays running; W7740 remains USER_HELD90, SHADOW and independent overrides are unchanged, and Foundation/Janitor retain their existing owners. No real protocol, manifest, pair, billing or production state is changed by this filing.
