  title: "THE OVERFLOW VALVE IS UNREACHABLE BEHIND AN EXHAUSTED AUCTION — config.overflow:'api_key' exists to survive a maxed subscription, but the capacity auction refuses on a maxed subscription before any Claude spawn is built, and it has no knowledge the valve is armed"
