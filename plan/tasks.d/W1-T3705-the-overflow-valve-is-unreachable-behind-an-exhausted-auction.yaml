  status: queued
  attempts: 0
  note: |
    MEASURED ON origin/main 2026-09-16. `grep -rn overflow src/lib/worker-provider.ts
    src/lib/provider-routing-policy.ts` returns ZERO: the capacity auction has no knowledge of the
    overflow valve. `selectWorkerProvider` filters out any provider whose window sits at or above
    `100 - reservePercent`, and throws `ProviderCapacityBlockedError` when none remains.

    So on a host with more than one enabled provider, a fully exhausted subscription blocks the
    auction BEFORE a Claude spawn is ever built -- and `config.overflow: "api_key"`, whose entire
    purpose is to keep working when the subscription is exhausted, is never consulted. The valve
    is armed and unreachable at exactly the moment it exists for.

    IT IS NOT UNREACHABLE EVERYWHERE, AND THE CONDITION IS THE POINT. worker.ts guards the auction
    with `!args.mountProvider && !(providers.length === 1 && providers[0] === "claude")`, so:
      - enabled == ["claude"]  -> auction SKIPPED, the valve works today, no code change needed.
      - a mount declaring `provider:` -> affinity path, auction skipped, valve works.
      - enabled == ["claude","codex",...] and all exhausted -> auction BLOCKS, valve unreachable.

    THIS IS THE IMPLEMENT LANE'S ONLY SQUEEZE ANSWER, which is what makes it urgent rather than
    tidy. DECISIONS.md 2026-09-16 records that implement stays Claude-only: it does not fall back
    to cash, by ruling, because the alternative was granting a cheap model forge authority. The
    overflow valve is therefore the one lever that keeps implement running with no subscription
    headroom -- and on a multi-provider host it does not get reached.

    CRITERIA AMENDED 2026-09-16, BEFORE BUILD. The original two proofs named an implementation this
    task then deliberately did NOT choose: they asked for `overflow` to appear in
    worker-provider.ts (i.e. the AUCTION reading the valve) and for an `overflow_unreachable`
    report. The delivered design is a SECOND FALLBACK ARM beside the cash fallback, in worker.ts,
    for the reason the next paragraph already gives — so the auction's filter is untouched and the
    spend sits behind a switch of the same shape. The proofs now name that design. Recorded here
    rather than silently: a proof rewritten to match what was built is only honest when the change
    of design is stated too.

    DO NOT "FIX" THIS BY WIDENING ELIGIBILITY SILENTLY. Making Claude eligible past its ceiling
    whenever the valve is armed converts a capacity bound into a SPEND decision, and the operator
    must be able to see and bound it. `dailyCapUsd` is already doing double duty as the cash cap
    (`reserveOpenWeightBudget` reads it) and as the overflow guard `validateConfig` demands -- a
    conflation this task should report on, and probably separate, rather than deepen.
  rationale: |
    A valve that is armed, correct, two-factor, and never reached is indistinguishable from an
    absent one at the moment it matters. The failure is silent in the worst way: the operator sets
    `overflow: "api_key"`, sees it accepted by `validateConfig`, and reasonably believes the fleet
    survives an exhausted subscription. It does, but only in the single-provider configuration --
    a condition nothing states, no test pins, and no status surface reports.

    The cheap half of this task is the honest half: SAY SO. A status line that reports "overflow
    armed, but unreachable while N providers are enabled" is worth more before the squeeze than a
    perfect eligibility rewrite after it.

    ON THE DECLARED-SURFACE OVERLAP (lint-plan duplicate-surface, advisory): src/lib/worker.ts and
    src/lib/worker-provider.ts are the two files EVERY provider-routing task must touch, so the
    overlap with W1-T2859, W1-T3097, W1-T3546, W1-T3558, W1-T3575 and W1-T3607 is structural, not
    duplicated intent. Each of those adds or prices a PROVIDER; none of them reads
    `config.overflow`, which `grep -rn overflow src/lib/worker-provider.ts` confirms returns zero.
    This task is the only one about the SUBSCRIPTION's own billing mode surviving its own ceiling,
    and it adds no provider. Narrowing files: to dodge the warning would hide a real conflict
    risk from the dispatcher, which the warning text explicitly forbids.
  acceptance:
    - claim: "a blocked auction consults the armed overflow valve instead of refusing with it unread"
      proof: "unit test: a blocked auction reaches the overflow valve"
    - claim: "the valve refuses on any missing factor, so an armed switch alone never bills the fleet to API"
      proof: "unit test: the overflow valve refuses on any missing factor"
    - claim: "cash and overflow stay independent switches, so neither implies the other"
      proof: "unit test: cash and overflow are independent switches"
  falsifier: |
    Set every enabled provider's window past the reserve ceiling with `config.overflow: "api_key"`
    armed and a `dailyCapUsd` set. Before this task, the spawn raises `ProviderCapacityBlockedError`
    and no surface mentions the valve. If it does NOT -- if some path already consults the valve --
    then this finding is wrong and the task closes with that correction recorded.

    Close WITHOUT widening eligibility if the operator rules that an exhausted subscription should
    stall rather than silently start billing API credits. Reporting the condition is in scope
    either way; changing what the auction admits is not, without that ruling.
