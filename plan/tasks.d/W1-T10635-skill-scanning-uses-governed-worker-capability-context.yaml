  rationale: |
    Actual committed-tree diagnostic on the prior captured source refused BOTH opted-in skills, ci-state-forensics and proof-preflight, because their ordinary Read step encounters the scanner's intentionally empty named-tool list. This is a reported contract contradiction, not evidence that the actual workers lack Read or that any permission should be widened.
    Source investigation finds workerAllowlistFromSettings derives allowedTools solely from settings permissions.allow; real staging calls it with undefined. Separately, worker.ts exports maintained implement/provider tool bounds containing Read and threads args.tools into SDK options.tools. The proposed change is a truthful shared context at the scan/staging boundary, not a modification of those bounds. Source blobs and the full current caller must be refreshed and verified before publication; never use a truncated hub prefix as absence evidence.
    Read-only dependency src/lib/worker.ts remains the authoritative profile owner; no worker-profile source edit is declared or authorized here. Passing already-maintained descriptors at the run-task caller avoids a duplicated allowlist or a reverse import/cycle. settings/worker.json, approved .claude skills, permission modes, routing and all runtime tool grants stay unchanged. A future need to change another file requires a separately governed scope amendment, not an undeclared edit.
    W2766 owns the workshop/scanner mechanism, W3101 its maintained staging/injection route and W4283 its outcome-only-content guard. W10135 owns the new discovery census, not this source boundary. W10576 and its existing PR14173 fix lane own prompt-surface evidence and the concrete fix-task gate correction. W9337/PR13851 owns fix-command extraction in the shared run-task hub, a different call site. Preserve those owners and concerns; this proposal neither retires them nor hides shared-file overlap.
    W2698's merged credential-reach work is not implementing credit for the older scanner comment's promised nonempty tool policy. An empty auto-approval rule set is not the complete capability set: the primary Anthropic SDK permissions documentation at https://code.claude.com/docs/en/agent-sdk/permissions and the installed SDK type documentation distinguish allowedTools auto-approval from tools availability and deny rules. Documentation supports the diagnosis; exact local policy and default-path tests must qualify any repair.
    The existing real fix prompt consumes SKILL_FIX_TASK_TYPE even though fix is not a plan TASK_TYPES member. Preserve that domain distinction and coordinate with W10576; do not silently weaken or rewrite W10135 to make a green test. No selection-budget, withholding, task registry, cash, consent, ratification or evaluation activation change is proposed.
    Craig approved publication of this parked plan-only proposal only. Normal reservation, machine judgment, plan lint, hooks, full hosted CI/coverage/security and semantic review retain their authority; no new hosted-author attempt, paid runner, manual merge/arm/review, production Inbox reply/readmark, forced gardener, permission change or production lifecycle action. Foundation and Janitor retain their existing owners; W7740 remains USER_HELD90 and SHADOW/independent overrides remain unchanged.
    The initial maintained renderer defaulted these three non-sensitive paths to risk:low; the actual sizing check refused three concerns at that band. This unjudged parked proposal declares risk:high with band_meaning:blast-radius to retain all three necessary files under Rule 19, not to narrow scope, invent a ruling or alter any worker permission. The normal machine judge and independent dispatch hold remain authoritative.
