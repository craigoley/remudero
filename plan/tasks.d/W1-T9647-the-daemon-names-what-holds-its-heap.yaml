  falsifier: |
    On origin/main no daemon.memory row exists, so the first test finds no row. Register a sized memo, insert 1,000
    entries and sample. With the change, the holder reads 1,000 entries and bytes > 0, and after 1,000 more
    entries it reads a larger figure. Size the holder with a single unbounded approxBytes walk instead, with an
    injected clock charging 1 ms per node: the third test sees one synchronous slice over the per-turn budget and
    goes red. Let the census measure retained bytes without dropping the holder: both holders read the same
    retained figure and the fifth test goes red.
