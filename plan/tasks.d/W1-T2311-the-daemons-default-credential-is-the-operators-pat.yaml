    - claim: "nothing added paces, throttles, sleeps or backs off a call"
      proof: "unit test: test/daemon-default-credential.test.ts"
    - claim: "the second-order timeout question is recorded as unanswered rather than guessed at"
      proof: "grep: UNINVESTIGATED in src/lib/github-app.ts"
