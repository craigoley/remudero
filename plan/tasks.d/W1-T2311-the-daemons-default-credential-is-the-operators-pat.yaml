- id: W1-T2311
  title: "THE DAEMON'S DEFAULT CREDENTIAL IS THE OPERATOR'S PAT — the container's boot env carries a 93-character personal token, refreshInstallationToken only overwrites it in-process, and a timed-out exchange leaves it untouched, so every exchange failure silently relocates fleet traffic onto the operator's budget for at least five minutes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 30.00
  files: [src/lib/github-app.ts, deploy/recycle-container.sh, test/daemon-default-credential.test.ts]
  origin: "operator-brief#daemon-default-credential-is-the-pat-2026-08-26"
  plan_refs: ["W1-T1024", "W1-T1068", "W1-T1235", "W1-T1255", "W1-T2297"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-08-26, TIMELINE EXACT. The container's boot env carries the PAT: `docker exec`
    reads GH_TOKEN at fingerprint 8d073b4c, 93 characters, user 4397075. That is what every
    freshly-started daemon process begins with. `refreshInstallationToken` overwrites
    `process.env.GH_TOKEN` IN-PROCESS, and github-app.ts records that a timed-out exchange leaves
    the previous value untouched.

    SO THE PAT IS NOT REACHED BY FALLING BACK TO IT. IT IS THE DEFAULT, and the App token is the
    thing that has to arrive to displace it. Observed: daemon starts 12:21:57Z, so
    `process.env.GH_TOKEN` is the boot PAT; `github_app.token_refresh_failed` with
    reason "exchange timed out" at 12:23:44Z; no successful refresh after; at 12:26-12:29Z,
    27 of 27 live gh children carry 8d073b4c, len 93.

    THE WINDOW IS STRUCTURAL, NOT INCIDENTAL. `EXCHANGE_TIMEOUT_MS` is 20 s and
    `startInstallationTokenRefresh` rearms off `REFRESH_MARGIN_MS`, 5 minutes, so every timed-out
    exchange opens a window of at least five minutes. Even on success there is always a ~90-second
    window from process start. Today: 31 refreshed, 13 failed, 29.5 percent; and 142 of 142
    failures across all history read reason "exchange timed out", the only mode ever recorded. The
    daemon restarted 8 times today and each restart re-opens the window.

    THE STANDARD IT VIOLATES IS THE REPO'S OWN, in run-task.ts: "THE FLEET AUTHENTICATES AS THE
    INSTALLED GITHUB APP, whose core/graphql pool is measured SEPARATE from an operator's
    interactive session — the incident that files this task was an operator session exhausting
    graphql while the daemon's own traffic in that window was negligible." Today that incident is
    INVERTED: the fleet exhausted the pool the operator needed, and `gh pr create` failed from an
    operator shell with "API rate limit already exceeded for user ID 4397075" (W1-T1024 is the
    task whose premise this breaks).

    RULED OUT WITH EVIDENCE, DO NOT RE-DERIVE. GH_APP_ID, GH_APP_INSTALLATION_ID and
    GH_APP_PRIVATE_KEY_PATH are all set and the key file reads 1675 bytes. DNS and connectivity
    are healthy: 10/10 lookups, 3/3 HTTP 200 at ~30 ms. "Could not resolve host: github.com"
    appeared once in 249 log lines and is transient, not the cause.

    ALREADY SHIPPED, DO NOT REBUILD. The fallback is already VISIBLE:
    test/github-app-fallback-visible.test.ts pins that a standing fallback renders, naming its
    reason and the bucket the calls are billing, and that a timed-out exchange leaves GH_TOKEN
    exactly as found. This task is about WHICH IDENTITY the fallback runs on, not about whether it
    is observable. Observability is done; correctness is not.

    (Q1) THE REMEDY, AND BOTH CANDIDATES ARGUED.

    (a) THE BOOT ENV CARRIES NO GH_TOKEN. A timed-out exchange then produces an UNAUTHENTICATED
    failure, which the existing fail-closed guards already handle (see Q2). This is the stronger
    remedy because it removes the capability rather than the intent: there is no PAT in the
    process to spend, so no future code path can reach one by accident. It also makes the failure
    LOUD at the point of use rather than silent-and-billed.

    WHAT (a) BREAKS, NAMED. An operator running `docker exec` inside that container loses a
    working `gh`, and EVERY MEASUREMENT TAKEN THAT WAY ON 2026-08-26 DEPENDED ON IT — the token
    fingerprinting, the child-process sampling and the rate-limit bracketing were all run that
    way. THE JUDGEMENT THIS TASK MAKES: that is a LOSS worth taking, but it is a real loss and
    must be replaced rather than absorbed. An operator debugging a credential problem needs a way
    in that does not consist of the fleet holding the operator's credential for them. The
    implementation must therefore name a replacement path for operator-side reads before removing
    the boot value, and the acceptance below requires it.

    (b) THE FALLBACK REFUSES rather than proceeding on the wrong identity. Narrower and closer to
    the defect, but weaker: it leaves a usable PAT in the process, so it fixes the one path that
    is known to reach it and nothing else. It also sits in tension with the retry loop's stated
    "degrade, never refuse" contract, which is CORRECT FOR THE LOOP (W1-T1068) and must not be
    rewritten to accommodate this.

    THE TASK PROPOSES (a) AS PRIMARY with (b) as the fallback position if a replacement operator
    path cannot be found. The implementer must record which was taken and why.

    (Q2) WHAT ALREADY HANDLES AN UNAUTHENTICATED FAILURE CORRECTLY, so the remedy is not
    overstated. Ten guard sites consult `github.readFailed?.()` before trusting an empty list:
    credit backfill returns outcome "unverifiable" rather than "not merged"; status-board.ts names
    the reason rather than rendering a clean board; panel-graph.ts marks entries unverified;
    board.ts marks them githubUnavailable; the sweep guard in status.ts gates on readFailed or
    readTruncated. AND THE AUTOMERGE ARM FAILS OPEN LOUDLY AND CORRECTLY (W1-T1235, W1-T1255):
    3 refused, 3 rescued over REST, with the `automerge.rate_limit_refused` row written BEFORE the
    fallback so a successful rescue cannot erase the fact that the budget was spent.

    A SEARCH TRAP, RECORDED SO THE NEXT READER DOES NOT REPEAT IT: a grep for readFailed MISSES
    every one of these unless it accounts for the optional-call form. That mis-read happened
    during this recon and was caught only by a control against a known-busy symbol.

    (Q3) THE SECOND-ORDER QUESTION, RECORDED AND DELIBERATELY UNANSWERED. Why does one exchange in
    three time out at 20 seconds when the same container reaches api.github.com in 30 milliseconds
    unauthenticated? That is UNINVESTIGATED. It must not be guessed at here, and this task must
    not be closed by explaining it. A 29.5 percent failure rate on a 20-second timeout is its own
    defect and MAY BE THE LARGER ONE; it deserves its own filing off its own measurement.

    WHAT MUST NOT CHANGE. Nothing paces, throttles, sleeps or backs off a call — W1-T1066 records
    a polling loop that locked the operator out of his repository for ninety minutes. The retry
    loop's "degrade, never refuse" contract is correct for the loop and stays. The ten fail-closed
    guards stay. The automerge REST rescue stays, and so does its row-before-fallback ordering. No
    token is rotated, scoped or printed; identity work uses logins, lengths and sha256 prefixes
    only.

    RISK BAND. `risk: high` is set UP FRONT and is Rule 19's SPAN, not blast radius: `files:`
    crosses src/ and deploy/, which fails sizing at medium regardless of how small each hunk is.
