      proof: "unit test: test/plan-coherence.test.ts"
    - claim: "a clean corpus renders the counts it examined (shards read, monolith records read, disagreements zero) and never a bare zero, so a check that did not run is distinguishable from a check that passed"
      proof: "unit test: test/plan-coherence.test.ts"
    - claim: "an unreadable plan directory renders `unexamined` with its stated reason, never a silent clean; and the module makes no network or gateway call, so it has no `unavailable` state to degrade into"
      proof: "unit test: test/plan-coherence.test.ts"
    - claim: "the rung has a LIVE CALL SITE in the retro — the fourteen-cycle question is answered every cycle by measurement rather than re-asked in prose, and this module is not a signal read by nothing"
      proof: "grep: planCoherenceRung( in src/lib/retro.ts"
    - claim: "the filename id is resolved by the EXISTING shardSlugFromPath predicate, never a second filename parser — one predicate, so the report and the duplicate-title corpus can never disagree about which shard belongs to which id"
      proof: "grep: shardSlugFromPath in src/lib/plan-coherence.ts"
  note: |
    FILED 2026-08-31 from the W1-T2477 follow-up harvest (run W1-T2477-1788105355034, PR #3318). The
    follow-up's NAMED question is answered in the rationale and answered NEGATIVE — neither W1-T2473
    nor W1-T2477 appears in plan/tasks.yaml — so this task does not exist to re-check those two ids.
    It exists because the STANDING question behind them ("harvest (a)", fourteen cycles) has never
    been measured once, and because the measurement is offline, deterministic and cheap.

    THE CENSUS IS THE FIRST DELIVERABLE AND IT MAY COME BACK EMPTY. That is an acceptable and
    publishable outcome: a clean report carrying "773 shards examined, zero disagreements" retires
    fourteen cycles of prose, which is the whole point. What is NOT acceptable is a fifteenth cycle of
    asking. If the census reads clean for two consecutive cycles with no new finding, the successor
    filing-time GATE named in `design` should be closed as unnecessary rather than built — one
    convention nobody has ever violated does not need a gate, and this note pre-commits to that
    reading so a future cycle cannot quietly widen the trigger to save the work.

