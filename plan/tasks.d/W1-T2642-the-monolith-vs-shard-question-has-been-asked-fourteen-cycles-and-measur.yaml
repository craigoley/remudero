- id: W1-T2642
  title: "THE MONOLITH-VS-SHARD QUESTION HAS BEEN ASKED FOURTEEN CYCLES AND MEASURED ZERO TIMES — loadPlan's MERGED view is coherent by construction, but the two registries beside it are unchecked: a shard's FILENAME id (all that shardSlugFromPath, every grep recipe and git log --grep ever read) may disagree with the record inside it, and the one-task-per-file convention monolithFilingViolations' own message asserts is verified by nothing; a PURE OFFLINE coherence rung measures both every retro and NAMES every offender, never a bare zero"
