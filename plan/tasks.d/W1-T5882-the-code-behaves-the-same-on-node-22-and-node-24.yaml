  rationale: |
    MEASURED 2026-10-05 by running this repo's own ci.yml on Node 24.21.0 (workflow_dispatch on
    probe/node24-ci, run 37329361415): 47 distinct tests failed across all 8 shards and both slow
    shards hit their timeout. Four causes, each read in Node's v22.22.3 and v24.21.0 sources:
    (1) Node 23 made spec the default reporter on every stream; v22 chose TAP for a non-TTY stdout. The
    proof executor (review.ts), preflight-author, retro-preflight, test-with-retry, clock-sweep and
    the workflow-guard ratchet parse TAP from a piped node --test that names no reporter, so on 24 a
    passing unit-test proof grades inconclusive and a failing suite attributes no file.
    (2) Under Node 24's test runner, process.execArgv carries every option at its default
    (--stack-trace-limit, --tls-cipher-list, ...). Thirteen Worker constructions pass it as execArgv
    and throw ERR_WORKER_INVALID_EXEC_ARGV; an inherited execArgv (the default) loads tsx and runs.
    (3) internal/test_runner/coverage TestCoverage went from 7 positional arguments to
    (dir, origDir, options); coverage-merge-ratchet.mjs's old call silently drops its globs.
    (4) readline breaks lines on U+2028/U+2029 from Node 24, which JSON leaves unescaped, so the
    ledger union reader would split a valid row into two damaged ones.
    With these fixes applied (run 37334420618) the slow shards pass and the remaining reds were
    argv-pinning tests, updated here.
  design: |
    Every captured nested node --test names --test-reporter=tap; test-with-retry adds it to a wrapped
    node --test command that names no reporter, and test-tier-manifest always reports TAP to stdout.
    Worker constructions stop passing process.execArgv and inherit it (board prewarm fault tests use a
    non-file worker URL as their real synchronous construction failure). coverage-merge-ratchet.mjs
    builds TestCoverage through newTestCoverage, which picks the 7- or 3-argument shape by arity and
    refuses any other. ledger-union.ts reads rows with ndjsonLines (LF only, UTF-8 safe across chunks).
    Every change holds on Node 22, so this merges while CI still runs 22; W1-T5883 moves the pin.
