  rationale: |
    MEASURED WITH THE SHIPPED PREDICATE, AT HEAD caa9287c, NOT REASONED ABOUT.
    `checkOneConcern` (`src/lib/review.ts`) was run directly over the last 80 commits on
    origin/main — this repo SQUASH-merges, so one commit is one PR. Of the 41 it judges at all
    (32 carried no product source), it FLAGS 35 and passes 6: a firing rate of 85.4%.

    THE MECHANISM, AND IT IS NOT A DISAGREEMENT BETWEEN TWO GATES. `concernStem` keys a concern to
    a file's BASENAME, and its collapse rule is written for a `src/lib/foo.ts` + `test/foo.test.ts`
    pairing. This repo does not name suites that way: a falsifier is named after the CLAIM it
    proves. MEASURED on this tree: 917 of 1039 tracked `test/*.test.ts` files (88.3%) have NO
    same-basename module under `src/`, so for those the collapse rule cannot fire at all and the
    suite contributes its own distinct stem. Every flagged example has that exact shape —
    `a-gate-verdict-names-its-own-context` + `ci-parity` + `run-task`;
    `a-task-trailer-redirects-review-to-an-unrelated-shard` + `run-task`;
    `a-modified-test-line-reads-as-added-test-code` + `review`.

    A HYPOTHESIS WAS KILLED ON THE WAY HERE, AND IT IS WORTH RECORDING SO THE NEXT READER DOES NOT
    CHASE IT. The intake framing was "two instruments disagree about one count", after `lint-plan`
    reported 2 concerns and the rubric reported 3 on the same PR (#3930). THAT IS NOT A DEFECT.
    `checkOneConcern` and `subsystemsOf` share no code and do not read the same input: the rubric
    walks THE DIFF's changed files, the linter reads THE SHARD's declared `files:` field. Both
    numbers are correct for what each measures. The real defect is single-sided and lives entirely
    in the rubric.

    WHAT MAKES THIS FILEABLE RATHER THAN ALREADY-FIXED. W1-T2543 diagnosed THIS ARM, by name and
    with evidence — its own surviving doc in `src/lib/companion-paths.ts` reads: "The advisory
    rubric fired the same way on two PRs within one hour (#3400 `sweep`/`sweep-conflicted-
    disposition`, #3403 `daemon`/`entrypoint-boot`), and an arm that fires on nearly every
    well-formed PR trains its readers to skim past it — which is where a REAL finding is lost."
    Its declared `files:` are `[src/lib/task-linter.ts, test/a-suite-is-not-a-second-concern.test.ts]`.
    `src/lib/review.ts` is NOT among them, and `git grep W1-T2543 -- src/lib/review.ts` returns
    ZERO. So the diagnosis named the rubric and the declared scope could only reach the linter.

    AND THE BRIDGE WAS ALREADY BUILT AND LEFT UNCROSSED, WHICH IS THE SHARPEST FORM OF THIS.
    W1-T2547 extracted the table into `src/lib/companion-paths.ts` for a stated reason, in its own
    header: "so BOTH task-linter.ts and review.ts can read it without importing each other."
    `review.ts` DOES read it — line 16, `import { GENERATED_LEDGER_CLASSES, isCompanionPath }` —
    and calls `isCompanionPath` three times. ALL THREE ARE INSIDE `checkDocsAwareness`, against the
    SIBLING table `GENERATED_LEDGER_CLASSES`. The one arm the extraction's own rationale named
    still runs its private basename rule. This is not a missing seam; it is a seam wired into the
    same file and not called from the one place it was extracted for.

    WHY ADVISORY DOES NOT MEAN HARMLESS. The rubric's own header says these are "observations for
    the operator and the fix rung" — the fix rung CONSUMES them. An input that is wrong 85% of the
    time is worse for a consumer than no input, and it cannot be told apart from the ~15% where the
    arm is RIGHT: `status-board` + `status-board-operator-message` (84ed0b8b) is a genuine
    two-stem PR that a reader trained to skim will skip with the rest.

    THIS IS THE SIXTH INSTANCE OF A PATTERN CLAUDE.md ALREADY NAMES, AND IT GENERALISES IT.
    W1-T312 (ci-gate wait cap), W1-T380 (deploy ceiling), W1-T382 (check-wait bound), the 3000ms
    `CLAUDE_HEALTH_TIMEOUT_MS`, and W1-T2803 (the retro preflight bound) are all BOUNDS — numeric
    thresholds set below the healthy range. THIS ONE IS A PREDICATE. The family is therefore not
    "a bound sized wrong" but "A SIGNAL THAT FIRES ON THE HEALTHY CONDITION", and a predicate whose
    true-condition is the house convention belongs in it. That generalisation is worth more than
    this fix.
  design: |
    ONE CONCERN: the rubric's one-concern arm stops counting a PR's own task-named falsifier as a
    second concern, by CALLING the shared predicate already imported into its file.

    (i) CALL THE SHARED TABLE, NEVER A THIRD RULE. `isCompanionPath` and `COMPANION_PATH_CLASSES`
    (`src/lib/companion-paths.ts`) are already imported into `review.ts`. Use them. W1-T457's
    standing instruction is the governing one — "the fix is to give the sweep the rule the gate
    already has, not to invent one" — and W1-T2790 ranks a shared definition above a second
    hand-maintained one. A fourth basename heuristic here would relocate the drift, not remove it.

    (ii) DISCOUNT ONLY WHILE A NON-COMPANION SURVIVES, exactly as `subsystemsOf` already does.
    That two-pass shape is not an implementation detail to re-derive: a PR that changes ONLY test
    files must still score its stems rather than collapsing to zero concerns and passing vacuously.
    `subsystemsOf`'s own comment states this ("companions are collected SEPARATELY and folded in
    only if nothing else survives, so the discount cannot empty the tally"); mirror it.

    (iii) THE ONE GENUINELY OPEN QUESTION, AND IT MUST BE SETTLED BY THE BUILD WITH A STATED REASON:
    how tightly to identify "this PR's OWN falsifier". Two defensible answers, and this shard
    deliberately does not pick:
      - LOOSE — any `test/` path is a companion while some non-test path survives. That is
        `COMPANION_PATH_CLASSES` as it stands, and it is what the linter did before W1-T2525.
        Simple, needs nothing the rubric does not already have.
      - TIGHT — only the falsifier whose basename matches the task's own shard slug, the
        `ownFalsifierSlug` narrowing W1-T2525 added to the linter. More precise, but the rubric
        would need the task id, which it can only get from the `Remudero-Task:` trailer — a
        dependency the arm does not have today.
    MEASURE BOTH before choosing: re-run the 80-commit probe under each and report the two firing
    rates. If LOOSE and TIGHT differ by little, take LOOSE — it costs no new dependency. Do not
    reach for the trailer without a measured reason to.

    (iv) NOT IN SCOPE, EACH WITH A REASON:
      - `subsystemsOf` and `task-linter.ts`. They are correct; the linter already has this
        discount. Touching them would re-open W1-T2543's settled half.
      - `checkDocsAwareness` and `GENERATED_LEDGER_CLASSES`. A different question for a different
        consumer, as `companion-paths.ts`'s own doc states.
      - Making the arm BLOCKING. It is advisory by design and this task does not change that; it
        makes the advisory worth reading.
      - The other rubric arms. One concern per PR, which is the rule this task is about.
  acceptance:
    - claim: "the one-concern arm counts a source module plus this PR's own task-named falsifier as ONE concern, via the shared companion predicate rather than a rule private to the rubric"
      proof: "unit test: test/the-one-concern-arm-never-adopted-the-shared-table.test.ts"
    - claim: "the discount reads the table already extracted for this consumer instead of adding a fourth basename heuristic that could drift from the linter's"
      proof: "grep: shared table not a third rule in test/the-one-concern-arm-never-adopted-the-shared-table.test.ts"
    - claim: "a PR that genuinely spans two source modules still reports more than one concern, so the fix narrows the false positives without blinding the arm"
      proof: "grep: two real concerns still read two in test/the-one-concern-arm-never-adopted-the-shared-table.test.ts"
    - claim: "a diff of only test files still scores its stems rather than collapsing to zero and passing vacuously, mirroring the two-pass shape subsystemsOf already uses"
      proof: "grep: companions alone never empty the tally in test/the-one-concern-arm-never-adopted-the-shared-table.test.ts"
    - claim: "the firing rate is re-measured with the shipped predicate over real merged commits and the before and after numbers are recorded, so the fix is judged on movement rather than on plausibility"
      proof: "grep: measured firing rate recorded in test/the-one-concern-arm-never-adopted-the-shared-table.test.ts"
  falsifier: |
    BOTH DIRECTIONS, AND THE SECOND IS THE ONE THAT MATTERS. An arm that stops firing entirely is
    not fixed, it is deleted — and it would pass a one-directional test.

      NARROWS  — a diff of `src/lib/foo.ts` plus `test/a-claim-about-foo.test.ts` reads ONE
                 concern. Today it reads two.
      PRESERVES — a diff of `src/lib/foo.ts` plus `src/lib/bar.ts` still reads TWO. And the
                 measured 15% that the arm gets RIGHT today must still fire: use 84ed0b8b
                 (`status-board` + `status-board-operator-message`) as the named regression
                 fixture, since both stems are real source modules.
      VACUITY  — a diff of test files ONLY still scores its stems and does not collapse to zero.

    RE-MEASURE, DO NOT ASSERT. Re-run the probe this shard used — `checkOneConcern` over
    `git log origin/main --format=%H -80`, one commit per PR — before and after, and report both
    rates. The before number must reproduce near 85.4% at build time; if it has moved a long way
    on its own, say so and re-judge whether this is still worth building. A fix that cannot show
    the rate moving has not been shown to work.

    AND PROVE IT LOAD-BEARING: delete the discount and re-run. `# fail` non-zero with it removed,
    `# fail 0` restored.

    ONE QUERY TRAP, NAMED BECAUSE IT WAS HIT WHILE WRITING THIS SHARD: `git log --merges` returns
    ZERO on this repo, because it squash-merges. A probe sampling merge commits reports a confident
    empty result rather than an error. Sample plain commits on origin/main, and require a non-zero
    sample count before believing any rate computed from it.
