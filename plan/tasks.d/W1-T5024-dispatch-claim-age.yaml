  status: queued
  attempts: 0
  rationale: |
    OBSERVED at c94c2bf49: a claim anchor carries mintedAtMs, but the board prints no age and cross-host
    claimant liveness is undecidable. A claim can remain held forever with only a holder and drop command.
  design: |
    Project ageMs from mintedAtMs on the board row. Past a bounded age, open one deduplicated human escalation
    that identifies the exact claim and operator-only release command. Never release an uncertain claim
    automatically. Resolve the escalation when the claim disappears; keep normal dispatch flow unchanged.
