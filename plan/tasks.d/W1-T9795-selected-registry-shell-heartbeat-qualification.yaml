      proof: 'grep: selectedRegistryShadowMain( in src/run-task.ts'
    - claim: Actual scripts and generated trusted launchers observe one bounded selected binding
      proof: 'unit test: selected shell shadow reaches real lifecycle and heartbeat consumers'
    - claim: Later child and measurement observations detect changed or unsupported selection
      proof: 'unit test: selected shell revisions invalidate generated child and heartbeat observations'
    - claim: Supported old and new scripts preserve no-option output and legacy effects
      proof: 'unit test: selected shell qualification preserves mixed version legacy effects'
    - claim: Private selection never reaches public heartbeat fields or untrusted worker transports
      proof: 'unit test: selected shell qualification does not disclose private inputs'
    - claim: Real bounded defaults and catches execute only disposable recording transports
      proof: 'unit test: selected shell defaults and failures remain shadow only without live effects'
    - claim: Under W1-T10573's active selection the shadow option leaves the recycler's launch byte-identical and still records its observation of the named target
      proof: 'unit test: selected shell shadow coexists with the active selection'
    - claim: The capability probe recognizes a maintained child whose argv case sits past any fixed header, and an older child without the grammar keeps its original arguments
      proof: 'unit test: selected shell capability probe reads the whole trusted child script'
    - claim: The historical Bash 3.2 leg is never vendored and resolves through native 3.2 or RMD_TEST_BASH32, else names itself UNMEASURED
      proof: 'grep: RMD_TEST_BASH32 in test/selected-registry-shell-consumers.test.ts'
  falsifier: |
    Existing scripts select paths independently and have no shared bounded
    qualification at generated-child/heartbeat effect boundaries. Behavioral
    tests must fail when their real binding or forwarding is removed, not simply
    find a helper string. Restored output/effects equal legacy or active controls
    even when the observation would refuse. Qualification is not live blocking or
    staging. At the pre-amendment head, merged with main, the maintained recycler
    is read as an old child (its argv case past line 256) and its observations are
    lost; a selected recycle's observation names no target.
