  rationale: |
    At actual main ec0eb2ce2, installer/recycler mode grammar is merged, but their
    selected path and generated child forwarding are independently resolved.
    serve-container and host-update have their own registry selection; heartbeat's
    MEM_REGISTRY reads state/container rows independently. field-trials-refresh
    also uses RMD_INSTANCE_REGISTRY and derives private source mounts; omission
    would leave a consequential reader outside the census. These are not certified
    by accepting a mode field or by W9572's run/sweep receipts. Existing W6095
    credential-mount work remains distinct and uncredited in the exact named
    search; do not take it over or use it as activation authority. Current own
    open-head diffs do not implement selected shell qualification.
    AMENDED 2026-11-03 (operator ruling, in chat: "Re-scope onto #15532"):
    - #15532 (W1-T10573, merged 2026-11-03T17:57Z) made RMD_INSTANCE_REGISTRY the ACTIVE selection in the recycler and serve launchers. An explicit invalid or incomplete selection refuses; genuine absence keeps the public behaviour. Those launchers now bind one invocation's selection by physical identity, mount it read-only and forward its digest and binding.
    - That supersedes this task's "independently resolved selected path and generated child forwarding" for recycle and serve. What remains is this task's own concern: the SHADOW observation at every shell consumer's real effect boundary (install, generated launcher and watchdog, recycle, serve, host update, heartbeat, field trials). It must coexist with the active selection: the same invocation's launch, active or legacy, is unchanged by the shadow option.
    - Merging #15532 exposed two defects in this task's shell layer:
      1. #15532's shared guards pushed recycle-container.sh's `--selected-registry-shadow)` case from line 104 to 387. registry_shadow_supports read only the first 256 lines, so the maintained recycler read as an old child and lost its observations. The probe now reads the whole trusted file, under a size backstop.
      2. The recycler, installer and serve passed the bare `repo` field as the shadow's repository, while the binding matches `owner/name` (RegistryInstance.repo, from github_repo). So no selected recycle could resolve a target. They now pass github_repo.
    - The vendored 628 KB Ubuntu bash-3.2 .deb fixtures, which the risk judge escalated, are removed. The historical-interpreter leg uses (a) the host's native /bin/bash when it reports 3.2 (macOS), (b) an absolute RMD_TEST_BASH32 executable provided outside the repository (a pinned CI install), or (c) a named UNMEASURED diagnostic, while the leg runs under the current bash so no assertion is skipped and nothing claims it was 3.2.
    - An official bash:3.2 container was ruled out: the scripts under test call the host's node, and the recording transports are node scripts writing host paths, which a musl container without node cannot run.
    - files: is re-derived from the files the PR actually touches. The six previously declared but untouched tests and docs index are dropped; the old-script fixtures, the shell fixture helper and two adjusted tests are added.
    FOLLOW-UP, not in this task (it is live behaviour): the installer-generated launcher forwards its baked RMD_INSTANCE_REGISTRY to the watchdog's recycle but adds --instance only when the install named one. So a default (no --instance) install made with the variable set yields a watchdog recycle that #15532 refuses with instance_missing.
  design: |
    1. Re-census the real shell readers and trusted generated launcher/child
       arguments across install, recycle, serve, host update, heartbeat and
       field-trials refresh. Reuse W9793's bounded public reader/observation
       vocabulary through a small shared data-only adapter if needed. It is not
       a daemon, scanner, new scheduler or a second permissive YAML parser.
       A new entry must use the maintained entry contract, real defaults and
       controlled fixtures, not production-only fake call text.
       The actual maintained run-task command dispatch must invoke the bounded
       selectedRegistryShadowMain entry; test real CLI dispatch and supported
       argv alongside script effects. A dummy call added for grep is not wiring.
    2. Require an explicit SHADOW qualification option; environment path presence
       alone never enables policy or observations. RMD_INSTANCE_REGISTRY is
       W1-T10573's active selection, never a shadow channel: the shadow candidate
       is the session captured by the option. Snapshot bounded selected bytes,
       digest/capabilities and actual instance identity; recheck at the real
       attempted launch/write/measurement observation, including generated
       launchers and later heartbeat reads, not only a parent process's startup.
       Name the target by owner/name (github_repo), the identity the binding matches.
    3. Keep host/container/repository-relative namespaces distinct and name
       unsupported mappings unknown. Propagate private selected input only to
       explicitly trusted readers through their supported transport; do not add
       it to the blanket worker environment/mount list or public heartbeat fields.
       A readonly mount is not secrecy. Redact private paths, raw registry values,
       state roots and credential material from diagnostics/publication/worker
       inputs. A digest or admitted actor never grants publication permission.
    4. Compare old/new compatible readers, supported grammar/capabilities,
       explicit empty/missing/malformed/truncated/symlink/revised input, cancelled
       reads, failed observer and sink, same-named different instances and healthy
       legacy traps. SHADOW observes would-refuse alongside actual unchanged
       legacy or active outcomes; it must not block/restart/remount/retarget them.
       Test actual scripts and rendered launchers with recording Docker/Azure/GitHub/
       systemctl transports, temporary HOME/state/lock/output roots and a real
       default reader. No genuine installer, heartbeat job, field-trial scan,
       mount, credential read or container operation is run against live data.
       The capability probe recognizes a maintained child wherever its argv case
       sits, reading the whole trusted file under a size backstop.
    5. The historical Bash 3.2 leg is never vendored: native /bin/bash 3.2, else an
       absolute RMD_TEST_BASH32 executable whose BASH_VERSION is verified, else a
       named UNMEASURED diagnostic with the leg run under the current bash.
    6. Cover every new catch/default, immutable mutation during waits and all
       independent children; delete real forwarding/binding/recheck arms and
       observe failures, then exact restoration. Retain every native failure and
       reproduce each title on its actual unchanged pinned base before repair;
       unknown causes remain unknown, never waived.
    7. WORKERS CONTINUE for isolated source/tests. No schedules, production
       selection or admission activation. Live launcher/mount/image replacement
       needs separate human exact-instance drain. Preserve owner/admin override,
       trusted PR flow, scoped services and the complete public Apache
       implementation/templates.
