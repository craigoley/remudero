    - claim: "install mode writes both service drop-ins atomically, reloads systemd once and proves both effective dependency sets after the write"
      proof: "unit test: test/container-runtime-mount-order-install.test.ts"
    - claim: "installation never starts, stops, restarts or reloads Docker or containerd and never invokes a container lifecycle command"
      proof: "unit test: test/container-runtime-mount-order-install.test.ts"
    - claim: "an unset, relative, absent or unmounted RMD_STATE_DIR is refused before the host is changed"
