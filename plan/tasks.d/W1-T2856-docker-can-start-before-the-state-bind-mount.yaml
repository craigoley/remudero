      proof: "mutation test: test/container-runtime-mount-order-install.test.ts"
  falsifier: |
    Close without implementation if the effective Azure `docker.service` dependencies already
    require and order `/mnt/rmd`, `/var/lib/containerd`, and `/home/craigoleyagent/rmd-state2`, or if
    Docker is prevented from restoring containers until the state bind mount is active by another
    unit. The current effective `RequiresMountsFor` contains only the first two paths; the generated
    state mount unit has no `Before=docker.service` edge.
  note: |
