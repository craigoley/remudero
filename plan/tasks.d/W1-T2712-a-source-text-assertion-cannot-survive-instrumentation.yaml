- id: W1-T2712
  title: "THE NIGHTLY IS RED ON A ROTATION AND THE FILED REMEDY FIXES ONE FILE OF TWENTY-SIX — a test that asserts on the SOURCE TEXT of the module Stryker is mutating cannot pass in the sandbox, because Stryker must rewrite that text to mutate it; the plan must decline to measure such a module and NAME why, and the failure issue must stop truncating away the one line that says which config errored"
