- id: W1-T3434
  title: "A CAPPED-PROOF REPAIR TARGETS THE WRONG AUTHORITATIVE ARTIFACT — a trailered implementation PR resolves its criteria from the plan at its own head, while the proof-discrimination worker is told to edit the PR body; a body write cannot change the verdict and a worker lacking GitHub write access makes the queue appear stuck"
