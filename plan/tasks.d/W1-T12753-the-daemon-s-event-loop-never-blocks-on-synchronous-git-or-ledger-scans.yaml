  rationale: |
    WHY: the core daemon's event loop stops for minutes at a time. While it is stopped, no tick, light pass, review or merge decision runs.
    OBSERVED on the Azure host core ledger (live ledger plus rotated archives), window 2026-11-12T22:31Z to 2026-11-14T22:31Z:
    - 536 `daemon.loop_lag` rows, 25,004 s of lag in total. 181 rows were 60 s or longer (22,859 s). The longest was 402,824 ms (2026-11-13T10:15:01Z).
    - Phases: pulse 154 rows, 20,362 s; interphase 173 rows, 2,460 s; freshness_drain 83 rows, 934 s; pause 117 rows, 501 s; sweep 5 rows, 422 s; dispatch 4 rows, 325 s.
    - Metered sync spawns over the window: 8,686 s. Top callers: runInTree 4,833 s (136 calls), unnamed `<anonymous>` 2,498 s (1,825 calls), hostWorktreeGit 427 s (1,377 calls), ghJson 281 s (448 calls), ghExec 192 s (154 calls), vetPinnedConfig 110 s (1,377 calls).
    - 149 `daemon.loop_stall_profile` rows: 22,934 s of lag, 14,961 s unprofiled, 15,586 s unattributed. Top inclusive frames: readLedgerUnionRecordsSync 3,875 s, triageCommandLocked 2,934 s, landTriageStatusOutcome 2,718 s, driveLanding and landContent 2,665 s each, spawnWorkerImpl 1,443 s, readDraftStats 1,390 s, routeAdaptiveLifetimePressure 1,340 s. Top self frames: spawn 3,191 s, parseObject 2,248 s, garbage collector 1,390 s.
    - 2026-11-14T22:15:33Z `daemon.loop_lag`: lag_ms 118,389, phase pulse, last step run_child.settled. sync_spawn_ms 8,802: hostWorktreeGit 6,363 ms over 57 calls, vetPinnedConfig 2,271 ms over 58 calls.
    - 22:15:44Z `daemon.loop_stall_profile` for that stall: lag_ms 117,903, bound_ms 101,351, unprofiled_ms 106,435, profiled_ms 30,024, unattributed_ms 109,202. Top inclusive: readLedgerUnionRecordsSync 13,172 ms under routeAdaptiveLifetimePressure 12,960 ms; top self parseObject 7,624 ms under scanLedgerBuffer.
    READ at origin/main 7c409f905:
    - src/run-task.ts:37676 routeAdaptiveLifetimePressure is async but reads the whole live ledger with the synchronous readLedgerLines (:37680), then rowsWithArchivedVerifyHumanVerdicts (:37863) calls readLedgerUnionRecordsSync over every archive, and idCitedInSrc (:38307) runs `git grep` with spawnSync once per task. The daemon calls it through productionLifetimePressureHook (src/cli/commands/daemon.ts:2295, src/lib/daemon.ts:4660).
    - src/lib/worktree-git.ts:468 hostWorktreeGit calls vetPinnedConfig (:470) and then execFileSync; hostWorktreeGitAsync (:475) is the async sibling. In the bundle both appear only as the leaf, so the daemon-loop caller of the 57 calls is not named: W1-T11795 (queued) adds the names.
    - src/lib/loop-stall-profiler.ts:387 starts the first profile chunk only when the silence is longer than the learned bound (loopStallBoundMs over recent lags). With long lags in its history the bound reached 101 s, so the first 101 s of a 118 s stall were never profiled. unattributed_ms (:497) is lag minus sync spawn time, so it also counts time the profile did name.
    - test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts counts sync spawn primitives only. It holds rows for hostWorktreeGit, vetPinnedConfig and idCitedInSrc, and has no rule for synchronous ledger scans, so the readLedgerUnionRecordsSync path reached the loop with no refusal.
    RELATED: W1-T11455 (queued) bounds which archives rowsWithArchivedVerifyHumanVerdicts opens, but the read stays synchronous. W1-T4046 (blocked) moves the measurement cadence's union reads to the async reader, not this route.
  design: |
    INVARIANT same-rows: every read this task moves to an async reader returns the same rows in the same order as the synchronous read it replaces; no cache, no new bound, no row dropped.
    INVARIANT census-only-falls: the sync-spawn and sync-ledger-scan baselines are exact and only fall; no row rises and no new name is added.
    1. AMENDED 2026-11-15 (hand build): W1-T11795 is not merged (held on a proof refusal), so the bundled daemon still names no caller of hostWorktreeGit. 24 h of core daemon.loop_lag rows (2026-11-14T15:45Z to 2026-11-15T15:35Z) charge 1,710 calls to `Object.hostWorktreeGit`, 618 to `hostWorktreeGit` and 2,328 to `vetPinnedConfig`, with no caller chain. The static walk finds 98 loop-reachable callers in 40 files. The conversion of the real callers therefore moves to a follow-up task that depends on W1-T11795; this task no longer claims it. W1-T11455 is not needed: ledgerRowsFor (W1-T11423) already bounds the archives a step read opens.
    2. routeAdaptiveLifetimePressure: read the live rows and the archived verify-human verdict rows with the async ledger reader (ledgerRowsFor with the same step filter the sync read uses). Add an async rowsWithArchivedVerifyHumanVerdicts beside the sync one; the sync one stays for its non-daemon caller (rmd verify-human-sweep). The daemon's verify-human cadence (defaultVerifyHumanCadenceResult) moves to the same async readers. The live file is read with an async read and parsed in slices that yield to the loop, keeping readLedgerLines' rows and order.
    3. idCitedInSrc: run `git grep` through the existing async loop-bounded spawn helper and await it; keep the same exit-code meaning.
    4. Not in this task (see step 1): the hostWorktreeGit callers W1-T11795 will name.
    5. Census: add a second population to test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts, SYNC_LEDGER_SCAN_CALL (readLedgerUnionRecordsSync(, ledgerRowsForSync(, readLedgerLines( ), walked by the same loopReachable fixed point, with its own exact baseline recorded at build time. Add a positive control fixture.
    6. Stall profiler: start the first chunk when the silence passes a fixed onset (LOOP_STALL_PROFILE_ONSET_MS, a few heartbeats; name the value and its reason in the why-file). Keep the learned bound as the chunk length only. Compute unattributed_ms as lag minus sync spawn time minus profiled time, floored at 0.
       AMENDED 2026-11-15: the onset is 1,000 ms and never later than the learned bound, and the heartbeat period is at most a quarter of the onset, so an ordinary gap between two beats is never read as a stall. test/an-unattributed-loop-stall-is-profiled-live.test.ts and test/a-stall-profile-names-the-sync-spawns-the-meter-saw.test.ts assert the old unattributed_ms formula (lag minus sync spawn time) and move to the new one.
    NOT IN SCOPE: runInTree and the plan-PR preflight landing chain (4,833 s over the window; it needs its own task); triageCommandLocked and readDraftStats; the ledger archive bound itself (W1-T11455).
