  note: |
    risk:high SET UP FRONT. Rule 19 sizing counts `src/lib/retro.ts` and `src/run-task.ts` as a
    two-module span, and the band is that SPAN rather than blast radius — the stage is pure and
    proposes, so a mistake produces a bad suggestion in a reviewed PR, not a bad write.

    `files:` DERIVED BY INVOCATION COUNT, NOT GUESSED. `src/lib/retro.ts` is where the mine/render
    stages this one joins already live, and it already carries the injected-judge shape
    (`ProceduralPhraseDeps`). `src/run-task.ts` holds `retroCommand` — `src/lib/orientation.ts` and
    `src/lib/plan-pr-emitter.ts` both name it as living there, and it is the only site that
    assembles the Architect stage. DECISIONS.md's 2026-08-18 W1-T471 ruling governs that
    declaration and says a new shard "should simply declare it"; the ritual acceptance sentence is
    explicitly no longer required, so none is written here. `src/lib/learnings.ts` is NOT declared
    for the reason in design (vi). The new suite is its own file rather than an append to
    `test/retro.test.ts`, per the house rule that a coverage-load-bearing test gets its own file.

    THE PROOFS ARE ALL `unit test:` AT A PATH THE IMPLEMENTER CREATES. That is deliberate: a
    forward-referencing `grep:` at an already-existing path would be a refusal, and every claim here
    is about behaviour that does not exist yet. The pure-path form lint-passes today and executes
    whatever the implementation adds.

    THIS TASK DOES NOT CLAIM THE CORPUS IS LARGE. Thirty-six entries enter the pass and all thirty-six
    reach the judge, but how many the judge actually promotes is unmeasured and unmeasurable without
    spawning it. If the answer turns out to be zero, the caller is still correct and the finding is
    still useful: it converts an untestable assumption into a rendered, reviewable proposal list.
