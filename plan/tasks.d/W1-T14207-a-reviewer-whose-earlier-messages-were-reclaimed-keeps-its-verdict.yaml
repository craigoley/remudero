    - claim: "invariant:reclaimed-blocks-not-incomplete — the W1-T13951 fixture (a 400 KiB earlier agent message, a 2 MiB command item, then an 800 KiB final message, then turn.completed, exit 0) returns outputRetention.text complete, outputRetention.blocks truncated, subtype success and isError false, and the review's reviewerOutcome for that subtype is success. On origin/main the same stream returns error_incomplete_output"
