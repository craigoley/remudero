  design: |
    1. A pure `detectUnmeasuredPreopenStreak(rows, threshold)` in src/lib/preopen-gate.ts over implement.preopen_gate
       rows, oldest first: `unmeasured` extends the streak, `pass` or `fail` (a measured gate) ends it. It returns
       the count, the streak's first ts and run id, the newest ts and the newest reason. The threshold is
       `PREOPEN_UNMEASURED_ALERT_AT = 3` (OPERATOR RULING 2026-10-17). The streak is fleet-wide, not per host.
    2. In runTaskBody, straight after the gate row is written: an `unmeasured` gate reads the retained gate rows and,
       at or past the threshold, raises the alert through `spoolEscalation` with a stable title that carries no count
       or time (so a continuing streak is one entry and one issue); the detail names the count, the first and newest
       ts and the reason. A measured gate withdraws a pending alert through `withdrawSpooledEscalation` (or spools
       the close it owes an open issue), as the launcher alerts do. Each raise and clear writes one row under the
       existing step (`implement.preopen_gate`) family: `implement.preopen_gate.alert` with
       { consecutive, streak_first_ts, action: raised|cleared }. A failure to raise is logged and never changes the
       build path.
    3. Add implement.preopen_gate and its .alert row to DECISION_RELEVANT_LEDGER_STEPS, so a rotation inside a
       streak does not restart the count.
    4. No other constant is added. Counting `result === "unmeasured"` (any reason) rather than only
       `containment: unmeasured` is the default; the two were identical on this corpus for streaks of 3 or more.
    5. TESTS in test/three-unmeasured-preopen-gates-raise-a-host-alert.test.ts, `test(` titles verbatim as in the
       proofs, with a temp ledger and state dir, no network.
