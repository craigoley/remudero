  note: "`risk: high` IS SET UP FRONT, deliberately — a session had `sizingViolation`
    (`src/lib/task-linter.ts`) refuse a `medium` at three subsystems today. The band is Rule 19's
    SPAN across `src/` and `test/`, not blast radius: the blast radius is one catch block and one
    options object.
    `files:` WAS DERIVED FROM THE GATES AND THE SUITES MEASURED BY INVOCATION, not by prose mention —
    this week's lesson after SEVEN corrections. At 01965452 exactly two suites invoke the shapes this
    changes: `test/review.test.ts` (5 invocations of `materialiseBaseProofBlobs(`/`baseCwd:`) and
    `test/preexisting-proof-hits-wiring.test.ts` (1). Both are declared. DROP EITHER if the
    implementation does not touch it — `inverseScopeUntouchedFiles` fails a declared-but-untouched
    path just as `scopeViolationFiles` fails an undeclared one.
    `plan_refs` IS DELIBERATELY EMPTY. Design (iv) explains why: W1-T273 and W1-T305 are the near
    neighbours and NEITHER owns this, so listing them would misattribute a new defect to completed
    work.
    NOTHING OBSERVED SO FAR WAS A REAL READ FAILURE — all four sighted reviews carried the benign
    `exists on disk, but not in` message. That bounds the URGENCY without weakening the defect: the
    mis-grade is latent, and it becomes live the first time a base blob is genuinely unreadable
    (ENOBUFS on a large blob is the measured example, and this repo has already hit ENOBUFS once on PR
    JSON large enough to need a 64 MiB maxBuffer).
    RE-MEASURE `status`/`code` BEFORE BUILDING. Those two numbers are the whole basis for the narrow
    fix, and they are a property of the installed git."
