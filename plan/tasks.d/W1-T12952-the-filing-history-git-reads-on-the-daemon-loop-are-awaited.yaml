      proof: "grep: readGit [?][?] hostWorktreeGitAsync in src/lib/task-filing-history.ts"
  rationale: |
    WHY: the daemon loop blocks on synchronous worktree git calls. The largest named share in the last 24 h is the
    filing-history reader of the lifetime-pressure route, which calls hostWorktreeGit through ctx.readGit, so the
    stall profiler names the caller Object.hostWorktreeGit.
    MEASURED, core ledger (~/rmd-state2/state, live file and rotations), 2026-11-14 18:15Z to 2026-11-15 18:16Z,
    90 daemon.loop_stall_profile rows, 14,334 s of loop lag in all. sync_spawn_by_caller, summed:
    - Object.hostWorktreeGit: 1,368 calls, 276.5 s. vetPinnedConfig (the second spawn of each hostWorktreeGit
      call): 1,514 calls, 105.1 s. hostWorktreeGit named as a plain caller: 146 calls, 31.7 s.
    - Every one of the 1,368 Object.hostWorktreeGit calls sits in a row whose top_inclusive frames name
      routeAdaptiveLifetimePressure (24 rows; 4 of them also name rowsWithArchivedVerifyHumanVerdicts).
    READ at origin/main 57ca3bba9:
    - src/lib/task-filing-history.ts:75 sets readGit to options.readGit ?? hostWorktreeGit, and :88 calls
      ctx.readGit(...), a method call: that is the Object. receiver in the frame name.
    - Its callers are routeAdaptiveLifetimePressure (src/run-task.ts:38080) and parkedVerifyHumanShards
      (src/run-task.ts:38641), both through shardAgeDays (src/run-task.ts:38697).
    - hostWorktreeGitAsync exists (src/lib/worktree-git.ts:475).
    - A walk of the daemon loop (test/helpers/daemon-loop-walk.ts, seeded from daemonCommand, object literals
      included) finds 111 reachable functions in 34 files outside worktree-git.ts that name hostWorktreeGit
      (46 in src/run-task.ts, 10 in src/cli/commands/run-task-verb.ts, 9 in src/lib/worker.ts, 5 in
      src/lib/sweep.ts). The existing census (test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts)
      counts the spawn primitives inside hostWorktreeGit, not its callers, so none of them is listed.
    SCOPE: W1-T12753 (in build) converts the same route's ledger reads; its amendment (#18714) leaves the
    hostWorktreeGit calls out. This task converts the measured caller and adds the census so the other 110 can only
    fall, one task each, without a new one.
    DEPENDS ON W1-T11795: its leaf names make the stall rows name the real callers in the bundle, which the
    follow-up conversions need.
    FALSIFIER: if the next 24 h of daemon.loop_stall_profile rows still charge Object.hostWorktreeGit under
    routeAdaptiveLifetimePressure, another method-style caller exists on that route, and the census must name it.
  design: |
    INVARIANT same-filing-dates: the async reader is the same algorithm; only the spawn is awaited.
    INVARIANT same-git-limits: limits, decoding and environment are unchanged.
    INVARIANT census-only-falls: the new census is exact, like SYNC_SPAWN_LOOP_BASELINE.
    1. src/lib/task-filing-history.ts: readGit becomes typeof hostWorktreeGitAsync (default hostWorktreeGitAsync);
       readHistory, metadata and resolveTaskFilingHistory become async. Keep the one-batch-per-invocation shape
       (ctx.results and ctx.failure).
    2. src/run-task.ts: shardAgeDays, parkedVerifyHumanShards and the route await the history. Change nothing
       else in routeAdaptiveLifetimePressure (W1-T12753 owns its ledger reads); if W1-T12753 has merged, rebase on
       it.
    3. New census test/no-daemon-loop-path-calls-the-synchronous-worktree-git-leaf.test.ts on the existing walk
       helpers, with the baseline recorded at build time.
    4. Update test/a-filing-age-that-cannot-be-read-is-unknown-never-zero-days.test.ts for the async reader.
    5. AMENDED 2026-11-15 at build time. parkedVerifyHumanShards becomes async; its five existing test callers await it
       (a-verify-human-shard-is-judged, the-judge-sees-the-evidence-the-shard-carries,
       the-machine-filing-judge-releases-or-escalates, the-verify-human-cadence-reads-the-checkout,
       the-verify-human-queue-reads-credit-not-the-status-field). The lifetime-pressure age test injects a synchronous
       readGit, which no longer type-checks; it injects hostWorktreeGitAsync instead.
    6. The census shares the sync-spawn census's code-only walk (strings and comments blanked), so the two censuses
       agree about reach: test/helpers/daemon-loop-walk.ts exports codeOnly and loopCensusFunctions. The sync-spawn
       census keeps its own copy for now (W1-T12954 edits that file).
    7. Criterion 1 drives routeAdaptiveLifetimePressure from src/run-task.ts. A new test that imports src/run-task.ts
       raises the affected-reach importer count (1,011 > 1,010), so criterion 1 lives in
       test/a-filing-age-that-cannot-be-read-is-unknown-never-zero-days.test.ts, which already imports it. The daemon
       test file holds criteria 2 and 3, which need only the reader module.
    NOT IN SCOPE: the other 110 callers; vetPinnedConfig's own spawn; the read-plane caller names (W1-T11795).
