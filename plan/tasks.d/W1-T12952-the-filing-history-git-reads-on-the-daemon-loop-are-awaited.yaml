  acceptance:
    - claim: "resolveTaskFilingHistory reads git through hostWorktreeGitAsync: with a git on PATH that sleeps 2 s for each call, a 50 ms timer started before routeAdaptiveLifetimePressure keeps firing at least once in every 500 ms while the route reads the filing dates"
      proof: "grep: W1-T12952 criterion 1 in test/daemon/the-filing-history-git-reads-do-not-block-the-daemon-loop.test.ts"
    - claim: "invariant:same-filing-dates — for the same repository and candidates, the async reader returns the same state, committer time and reason for every task as the synchronous reader does today, including every budget-exhausted and unknown case"
