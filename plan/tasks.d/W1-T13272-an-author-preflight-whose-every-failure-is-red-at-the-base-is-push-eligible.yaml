      proof: "grep: W1-T13272 criterion 3 in test/ci/an-author-preflight-whose-every-failure-is-red-at-the-base-is-push-eligible.test.ts"
  rationale: |
    OPERATOR RULING 2026-11-16 23:20Z: asked whether a Mac author preflight that fails only on tests that also fail on main's code should need a per-PR waiver, Craig chose "Yes, standing rule + file fixes": a red that is already on main is not the change's, and the evidence should make the branch pushable without a human. This task is that rule in the preflight itself. W1-T13215 (queued) produces the evidence and explicitly left this decision out of scope.

    - That day, four hand-built PRs needed a one-PR waiver for Mac reds that were present on main: W1-T13171 (#18927), W1-T13175's neighbours, and W1-T13241 (#18965: 2 of 4432 tests, the `readNamespaceBootMs` parse tests, red on a tree byte-identical to main for that suite). Each waiver cost an operator question and a hand attribution run under the Mac lock.
    - Hosted Linux CI still runs every suite and gates the merge, so a host-specific red on main does not reach main through this rule; a red only at the head still refuses.
  design: |
    1. After W1-T13215's attribution, if failing > 0 and every failing test is "also red at the base" (none "only at the head", none "unattributed"), set push-eligible true with a reason "every failing test is also red at the merge base <sha> on this host: <list>".
    2. The verdict row gains `preexisting_reds: [{file, test}]`.
    3. The suite drives the verdict function with injected attribution results.
    INVARIANT a-red-the-change-caused-still-refuses: any head-only or unattributed failure, or a missing attribution, keeps today's refusal.
    NOT IN SCOPE: the attribution itself (W1-T13215); fixing the base reds (W1-T13273 and others); the census precheck; the hosted checks.
  falsifier: |
    Leave such a run not push-eligible and criterion 1 must fail. Drop the list and criterion 2 must fail. Let one head-only failure through, or pass with no attribution, and criterion 3 must fail. Restore and all pass.
