      proof: "grep: W1-T13272 criterion 1 in test/ci/an-author-preflight-whose-every-failure-is-red-at-the-base-is-push-eligible.test.ts"
    - claim: "The verdict row records the pre-existing reds as a list beside the counts, so the PR body and the ledger can show them"
