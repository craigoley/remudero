- id: W1-T6278
  title: "A THREAD PARSES A PINNED PLAN ONLY WHEN IT FIRST READS ONE — every thread that loads thread-plan.ts parses every pin on receipt (6 to 9 threads per pin, 2.9 s and 27.7 MiB each), including workers that never read a plan, such as a short-lived integrity or issue worker that asks for the published pin at start"
  repo: remudero
  depends_on: [W1-T6262]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — when a thread turns a received plan pin into a parsed Plan
  band_meaning: span
  origin: "operator session 2026-10-07: serve CPU and memory plan (item C3, option b), from serve.plan_pin_adopted rows, an isolated parse replay and a static import walk"
  plan_refs: [W1-T5894, W1-T6262]
  files: [src/lib/thread-plan.ts, test/a-thread-parses-a-pinned-plan-only-when-it-first-reads-one.test.ts]
