  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so a script, an existing test and a new test named after neither trip it at
    `medium`. The change is a reconciliation in one parser plus whatever (v) finds in the emitting
    test; no `src/` file is touched at all.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/lcov-function-record-attribution.test.ts`, declared in `files:`, so on this filing
    PR it resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL, CONFIRMED PRESENT BEFORE IT
    WAS BELIEVED. `rmd check-proof` on the declared path reads `exit: 1`, `hits: 0`, `verdict: fail`.
    The SAME verb on an EXISTING pure path — `unit test: test/diff-coverage.test.ts`, the test file
    for the very script this task changes — reads `verdict: pass`.

