    - claim: "no other rung's view changes and the fix rung's strike accounting is identical before and after"
      proof: "unit test: W1-T977: the fix rung strike accounting is unchanged by the rung's own read"
    - claim: "omitting the reader leaves the rung's behaviour byte-identical to today so every existing caller is untouched"
      proof: "unit test: W1-T977: omitting the reader leaves the rung's behaviour unchanged"
