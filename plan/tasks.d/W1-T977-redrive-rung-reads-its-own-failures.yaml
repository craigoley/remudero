- id: W1-T977
  title: "THE RE-DRIVE RUNG WAITS OUT THE WHOLE CI ROUND BEFORE IT CAN SEE ITS OWN TRIGGER — while ANY sibling check is still running the aggregate checksState is pending, so buildOpenPrViews leaves ciFailures undefined and CI_GATE_TIMEOUT_FIX_CLASS cannot match; the rung DOES fire once the round concludes, but by then the fix rung has already claimed the PR and spent a strike"
  repo: remudero
  risk: high
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    RETRACTED CLAIM — "structurally unable to match" — DO NOT RE-IMPORT THIS SENTENCE.
    The original filing (#2108, merged 2026-08-18T04:26:06Z) said CI_GATE_TIMEOUT_FIX_CLASS "cannot
    fire" and was "structurally unable to match". THAT IS FALSE AND IS RETRACTED HERE. The rung
    fires. RE-MEASURED 2026-08-18: FOUR `sweep.post_fix_redriven` rows at 02:49:01.563Z,
    02:49:02.700Z, 02:49:03.814Z and 02:49:04.938Z, every one keyed
    `ci-gate-required-check-timeout`, for PRs 2101, 2098, 2097 and 2096 — the very PRs the original
    rationale offered as proof it could never match. Those redrives pushed the
    `chore(ci): re-trigger checks` commits that minted the heads those PRs then merged on. Any
    later reader who reaches for "impossible", "cannot fire" or "structurally unable" for this rung
    is re-importing a retracted claim.

    SECOND RETRACTION — "2 all time" WAS A STALE SNAPSHOT, NOT A MEASUREMENT. The original filing
    quoted `sweep.post_fix_redriven` at 2. RE-TAKEN ON THE SAME CORPUS: 16 rows — 8 distinct
    redrives, each written twice — spanning 2026-08-17T23:37:09Z to 2026-08-18T04:08:52Z across
    PRs 2089, 2101, 2098, 2097, 2096, 2111, 2108 and 2096 again. It was already 16 when 2 was
    quoted. CLAUDE.md names this failure exactly: NAME THE QUERY, NEVER ITS ANSWER — a count of
    this rung does not survive the hour it was taken in. The figure is therefore given here with
    its timestamp and its re-run query, and a reader who needs it must re-take it.

    WHAT SURVIVES, AND IT IS A LATENCY CLAIM RATHER THAN AN IMPOSSIBILITY ONE.

    (1) THE MECHANISM EXISTS END TO END AND IS UNCHANGED. `CI_GATE_TIMEOUT_FIX_CLASS`
    (src/lib/sweep.ts) matches a failing check named `ci-gate` whose `logTail` matches
    /timed out waiting for required check\(s\)/i. `runPostFixReverification` re-drives a matched
    PR, and its wired call site `sweepPostFixReverification` (src/run-task.ts) mints a fresh head
    through the same `pushEmptyCommit` leaf — which is the remedy `ci-gate` itself prints: "a NEW
    sha is the only remedy, re-running this same sha will not help".

    (2) THE BLINDNESS IS REAL BUT IT IS BOUNDED BY THE CI ROUND, NOT PERMANENT.
    `ciFailures: checksState === "red" ? fetchCiFailures(...) : undefined` at two sites in
    src/run-task.ts. While ANY required check is still running the AGGREGATE `checksState` is
    `pending`, not red, so `ciFailures` is undefined and `(pr.ciFailures ?? []).some(...)` in
    `matchesFailure` is false. The class cannot match FOR AS LONG AS THE ROUND IS PENDING. When the
    round concludes red, `ciFailures` populates and the class matches — which is why the rung has
    16 rows rather than none.

    (3) THE COST IS THE WAIT, AND THE WAIT WAS RE-MEASURED RATHER THAN CARRIED. The original
    filing said "50+ minutes"; that figure is NOT reproduced and is not used. RE-TAKEN over
    2026-08-18T01:30Z..03:00Z from the `checks pending Nm` reasons on `sweep.disposed`, the
    LONGEST wait observed per PR was: #2101 40m, #2097 39m, #2098 37m, #2096 35m. So the bound is
    35-40 minutes on this evidence, not 50+.

    (4) AND THE FIX RUNG GETS THERE FIRST, WHICH IS THE ACTUAL HARM. Two PRs flipped to
    `blocked-fixable` while waiting — #2097 from 02:11:43Z and #2101 from 02:23:35Z, both
    "required checks red — ci-log fix, strike 1/2". That routes a fix WORKER at a PR whose only
    defect was a slow sibling, and it spends one of two strikes. The redrive that would have been
    the correct action arrived afterwards. THE ORDERING IS THE DEFECT: whichever rung sees a
    populated `ciFailures` first claims the PR, and the fix rung is not scoped to wait.

    (5) DO NOT CREDIT THE 02:49 CLEARING TO THE RUNG NOTICING SOMETHING NEW. It followed a DAEMON
    RESTART. The daemon lane went silent after 02:29:05Z, with the largest contiguous gap
    02:40:20Z -> 02:48:07Z (7.8 minutes) carrying only the supervisor's own `cli.invoked` rows;
    `daemon.start`/`daemon.boot`/`daemon.lock_sweep` then landed at 02:48:20Z and ALL FOUR redrives
    fired between 02:49:01Z and 02:49:04Z — within 45 seconds of the daemon coming back. The
    operator reports the cause as a stale `state/drain.lock`; SEE THE NOTE, that cause is NOT
    verified here.

    (6) AND DO NOT CITE THE SAME-SHA RERUNS AS EVIDENCE OF ANYTHING. On #2097 the superseded head
    `ed73dbe79` has `ci-gate` concluding FAILURE at 08:47:39Z — forty minutes AFTER the pull
    request had already merged at 08:07:41Z on the newer head `c726153aa`, whose own `ci` and
    `ci-gate` both succeeded at 02:57:03Z and 03:00:51Z. A check concluding on a sha nothing is
    waiting on proves nothing in either direction. That new head is the one the 02:49:03Z redrive
    minted, which is the cleanest available evidence that the rung works when it can see.
  design: |
    (i) THE RUNG GETS ITS OWN READ, AS AN INJECTED DEP — the shape this module already uses.
    `PostFixReverificationDeps` already injects every effect (`redrive`'s own doc: "this module
    never calls `gh`/git directly", and three separate comments state the module never talks to
    GitHub). Add an OPTIONAL reader to that interface, defaulted to absent so every existing
    caller and fixture is untouched, and have `runPostFixReverification` consult it when a PR's
    snapshot `ciFailures` is undefined. Omitted, behaviour is byte-identical to today.

    (ii) THE WIRING LIVES AT THE EXISTING CALL SITE. `sweepPostFixReverification` (src/run-task.ts)
    supplies the real reader, exactly as it already supplies `pushEmptyCommit` and
    `isMergedByNumber`. That is why src/run-task.ts is declared — see the note, which accepts the
    serialization cost in writing rather than pretending it is free.

    (iii) DO NOT WIDEN `checksState`, AND THIS IS THE LOAD-BEARING CONSTRAINT. Making
    `buildOpenPrViews` populate `ciFailures` while checks are pending would ALSO feed the fix
    rung, which spends a strike per dispatch — so a PR whose siblings are merely slow would start
    burning its two strikes before anything has actually failed. That is the opposite of the
    intent. The read added here is scoped to THIS rung and must not change what any other rung
    observes; criterion 4 is the falsifier for that and must fail if the fix rung's strike
    accounting moves at all.

    (iv) NO NEW SIGNAL, AND THE READER IS NAMED. This task adds no ledger step, no field and no
    new class. The reader is `CI_GATE_TIMEOUT_FIX_CLASS`, which already exists, is already in
    `DEFAULT_FIX_CLASSES`, and is already tested in test/post-fix-reverification.test.ts. The
    existing `sweep.post_fix_redriven` row is the observable outcome; if this task is right, that
    row's rate goes up and nothing else changes.

    (v) THE DEDUP AND ORDERING GUARANTEES STAY. The head-keyed `pr@headSha@class` redrive key is
    untouched, so a PR is still re-driven exactly once per head. The rung still runs BEFORE
    `runSweep` and its caller still excludes `outcome === "redriven"` PRs from the list it hands
    `runSweep`, so a PR this rung acts on is not also disposed in the same pass.

    (vi) THE UNMATCHED PATH MUST STAY HONEST. A PR whose failure matches no merged class must
    still return `outcome: "unmatched"` with no redrive and no ledger line. Criterion 2 is that
    falsifier: without it, "the rung now fires" is satisfied by a rung that fires on everything,
    which is a blanket re-run of every open PR and strictly worse than the current silence.

    (vii) EXPLICITLY OUT OF SCOPE.
      - WIDENING `checksState` OR `buildOpenPrViews` — see (iii).
      - ANY NEW LEDGER STEP OR FIELD — see (iv).
      - THE `ci-gate` WAIT CAP ITSELF (.github/workflows/ci-gate.yml). Raising it would reduce
        how often the timeout occurs but would not make the rung able to see it, and the cap has
        its own history (W1-T312). Different change, different falsifier.
      - THE WEDGED-CHECK CONDITION. A required check stuck at 40x its historical median is a
        distinct signal with no reader today; naming it here would be a signal without a
        consumer, which this repo has nine of already.
      - THE LIGHT-PASS DEFERRAL that left `blocked-fixable` at `acted:false`. Real, adjacent,
        separately observed, and not this.
