  note: |
    src/run-task.ts IS DECLARED, AND THE COST IS ACCEPTED IN WRITING RATHER THAN WAVED AWAY.
    Design (i) puts the reader behind an injected dep because src/lib/sweep.ts states three
    separate times that it never talks to GitHub; the real reader therefore has to be supplied by
    `sweepPostFixReverification`, which lives in src/run-task.ts. That file is declared by 103 of
    277 shards and W1-T471 serializes every task naming it, so this shard will not batch with any
    of them. There is no smaller declaration that still wires the dep: a sweep.ts-only change
    would leave the dep permanently undefined and the rung exactly as blind as it is today.

    AND IT OVERLAPS AN OPEN PR TODAY. #2106 ("fix(sweep): make a risk-judge escalation survive
    the next sweep pass") declares BOTH src/lib/sweep.ts and src/run-task.ts. These two cannot be
    dispatched concurrently. That is the partitioner working correctly on a real shared file, not
    a filing defect — but it is stated here so an implementer does not discover it as a conflict.

    FILES DERIVED BY READING, NOT GUESSED. `runPostFixReverification`,
    `PostFixReverificationDeps`, `FixClass`, `DEFAULT_FIX_CLASSES` and
    `CI_GATE_TIMEOUT_FIX_CLASS` are all declared in src/lib/sweep.ts. `sweepPostFixReverification`
    and both `ciFailures: checksState === "red" ? ... : undefined` sites are in src/run-task.ts.
    test/post-fix-reverification.test.ts exists today at 22966 bytes and is the suite that already
    covers this rung — the criteria extend it rather than opening a second home for the same
    behaviour.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN. `moduleIdFromPath` strips `.test`, so the
    three declared paths resolve to the distinct subsystem ids `sweep`, `run-task` and
    `post-fix-reverification` — three, above `sizingViolation`'s threshold of two, so no file list
    satisfying this task's own scope passes at risk:medium. Blast radius argues DOWN: one optional
    dep and one conditional read, with the omitted-dep path byte-identical to today (criterion 5).

    NO NEW SIGNAL IS PROPOSED AND THE READER IS NAMED — design (iv). This repo carries nine
    mechanisms that merged green with no consumer (`hasPushedRunBranch`, `armedButStalled`,
    `dispatch.stood_down`, `CiFailure.outsidePrRange`, `dh-rate-limit`, `rareOverlapWarnings`,
    `rmd coverage-improve`, `supersessionVerdict`, `risk_judge.escalated`). This task is the
    inverse shape: a consumer that exists, is wired, is exercised 143 times, and cannot see its
    input. Nothing is added for something else to read later.

    PROOF NOTES. ALL FIVE criteria use the NAME-FILTERED `unit test:` form with a bare title, never
    the pure-path form — a path proof against test/post-fix-reverification.test.ts would pass on
    any of that suite's existing tests and prove nothing about this change. Every title is plain
    prose under 100 characters with ZERO commas, no `"; "` and no regex metacharacter, so
    `looksLikeScenarioNarrative` cannot fail proof-resolvability. All five were checked with
    `grep -rlF` over test/ to match 0 files today against a control title that matches 1 — they
    are forward references to titles this task creates, and they are titles rather than symbol
    names, so nothing here guesses an identifier.
    THERE IS DELIBERATELY NO `grep:` CRITERION. A first draft carried one naming this shard's own
    path, and `rmd lint-plan` refused it with `proof-scope`: that path is outside the task's
    declared `files:`, and `scopeGuardOutOfScopeFiles` (run-task.ts) would refuse the implementer's
    branch for it AFTER the work was done. Repointing it at an in-scope file is no better — the
    only tokens that would discriminate head from base are identifiers this task has not written
    yet, and forward-referencing a SYMBOL NAME is a guess where forward-referencing a test TITLE is
    not. The claim it encoded ("no new signal, the reader already exists") is a design statement and
    lives in design (iv), which is where it belongs.

