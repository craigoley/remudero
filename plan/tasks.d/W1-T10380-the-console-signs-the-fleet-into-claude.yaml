- id: W1-T10380
  title: "THE CONSOLE SIGNS THE FLEET INTO CLAUDE — provider-auth-v1 (W1-T3960) answers every Claude start with `unsupported` (\"Claude browser handoff is not available through a stable machine-facing contract yet\", `ProviderAuthSessionStore.start` in src/lib/provider-auth-sessions.ts), so the only way to change the account the fleet runs on is a shell on the host; the daemon drives the Claude CLI's own login into a staging dir, the console shows its authorize URL, the operator pastes the code back, and the fleet store is replaced atomically without touching the host's own login"
