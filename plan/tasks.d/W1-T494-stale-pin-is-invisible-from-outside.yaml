  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `scripts/` and `test/`. The blast radius is
    one published field; the beat gates nothing and blocks nothing.
    `verify: human` — design (ii) offers four surfaces and this shard ranks none, and the operator has
    been minting this family one at a time.
    `files:` IS TWO PATHS. `scripts/fleet-heartbeat.sh` is where the beat is assembled;
    `test/fleet-heartbeat.test.ts` is NOT declared because the new assertions belong in their own file
    rather than appended to a suite that already covers the BSD/GNU `date` divergence — two of its
    tests are DECLARED host-parity divergences (`HOST_PARITY_BASELINE`, `src/lib/host-parity.ts`) and
    a new file keeps this task's coverage off that fault line.
    `src/lib/self-sync.ts` IS NOT DECLARED, DELIBERATELY. The guard there is correct and design (i)
    forbids touching it; declaring it would trip `inverseScopeUntouchedFiles` (`src/lib/review.ts`) on
    a file the implementation must not edit. `src/run-task.ts` is not declared either — nothing here
    touches it, and at 19,588 lines naming it serialises this task against every other that does
    (W1-T471).
    RULE 25 IS NOT ENGAGED: `scripts/fleet-heartbeat.sh` matches NO `INSTRUMENT_SURFACE` pattern
    (those cover `*-ratchet.mjs`, `diff-coverage.mjs`, `*-baseline.json`, `mutation-relevant-paths.json`,
    `.github/workflows/`, `stryker.conf.json`), and `test/` is excluded from `isProductPath` — so this
    changeset reads `entangled: false` and needs no special handling either way.
    EVERY CRITERION IS `unit test:` WITH A TITLE THAT RESOLVES TO ONE FILE — `check-proof` now warns on
    a title matching zero or many tests (W1-T488), and an all-`grep:`-self-referential shard caps its
    own implementation at `proof_exec: 0/N` and draws a `proof-scope` warning that blocks in CI's
    changed-tasks pass.
    PROVENANCE. The guard text, the consumer absence with its `restart_count` control, the two sha
    fields, the absence of any `origin/main` reference in the beat, the entrypoint's unconditional
    `checkout:` log, and the worktree-to-parent writability are ALL measured on the mac mini at
    a5b6edf7 and are tree facts. The Azure row counts, shas, timestamps and the 3-of-24 boot rate are
    ASSUMED from the commissioning measurement — this host has no route to that ledger."
