  rationale: |
    W1-T3022 ended a four-for-four conflict incident by bucketing the comment-load ceiling, and
    its own table names the key that conflicted every time: `src/run-task.ts`. That fix is real,
    and it holds on all three recording paths inside the judge's switch:

      recorded === undefined          -> nextBaseline[path] = ceilingForComments(comments)   BUCKET
      comments > recorded (violation) -> nextBaseline[path] = recorded                       UNCHANGED
      ceilingForComments < recorded   -> nextBaseline[path] = ceilingForComments(comments)   BUCKET
      otherwise                       -> nextBaseline[path] = recorded                       UNCHANGED

    A FOURTH path is applied AFTER that switch, in the block that computes `inheritedAtBase`, and
    it is the only one that writes a fresh EXACT count:

      for (const v of split.inherited) verdict.nextBaseline[v.path] = v.comments;

    `v.comments` is the count measured in THIS working tree, never passed through
    `ceilingForComments`. So the ledger is rewritten to a number that is neither the branch's old
    value nor main's current one.

    MEASURED 2026-09-08, three times, on two independent branches, on the key W1-T3022 named:

      origin/main                       "src/run-task.ts": 15603
      PR #4618 head (8 commits behind)  "src/run-task.ts": 15565
      PR #4637 head (8 commits behind)  "src/run-task.ts": 15565
      after `node scripts/comment-load-ratchet.mjs` in EITHER worktree, unprompted:  15594

    The run exits 0 and prints `recording base-inherited growth`, so nothing refuses, and a worker
    that runs the gate and then `git add -A` ships that line without ever deciding to. Merging it
    is the incident:

      git merge-file  base=15565  ours=15594  theirs=15603   -> CONFLICT
      git merge-file  base=15565  ours=15750  theirs=15750   -> CLEAN   (the bucketed control)

    WHY THIS PATH AND NOT THE OTHERS. Inheritance fires exactly when a branch is behind main on a
    file main has grown — on this repo the common case, not the rare one: both open PRs sampled
    today hit it, and it fires ONLY on an otherwise-passing run, so the gate is green while it
    happens. The three bucketed paths agree between two concurrent branches by construction,
    because a bucket is a function of the count alone. This one disagrees whenever two branches
    measure even one comment line apart.

    THE REMEDY IS THE ONE ALREADY RATIFIED, APPLIED TO THE PATH THAT MISSED IT: record
    `ceilingForComments(v.comments)`. It cannot regress the inheritance behaviour it exists for —
    the point of that block is that this PR is not charged for main's growth, and a bucketed
    ceiling is always >= the exact count, so the file still passes.

    NOT IN SCOPE: the legacy exact values already in the baseline (193, 15565, 15603 and the rest
    predate the bucket). They are grandfathered by the `otherwise` path and converge as files
    shrink; converting them wholesale is a separate decision and would itself be one enormous
    conflicting diff.
    AMENDED 2026-09-08, DURING THE BUILD — THE FILED REMEDY WAS MEASURABLY WRONG AND THE REPO'S OWN
    SUITE CAUGHT IT.

    This task proposed `ceilingForComments(v.comments)`, reasoning that the bucket is what the
    sibling paths use and what W1-T3022 ratified. The bucket does make two branches agree. It also
    ROUNDS UP to the next 250, handing the file up to 249 lines of free headroom — so growth the
    branch itself causes afterwards stops being charged. `test/comment-load-ratchet.test.ts`'s
    existing case "growth main landed while the PR was open passes and is recorded; growth the PR
    added still fails" went red on exactly that second half: it expected 3 and got 250, and its
    follow-on assertion that a fourth comment line is REFUSED could no longer hold.

    RECORD `v.atBase` INSTEAD. `splitBaseInheritedViolations` already computes it. It is equally
    identical between two branches cut from the same base — which is the whole conflict property —
    and grants no slack at all: the ceiling becomes exactly what main already carries, which is
    precisely the claim being made, that this PR is not answerable for main's growth and remains
    answerable for its own. MEASURED with both wrong remedies in place: the raw count fails 2 of 31
    tests, the bucket fails 3.

    Criterion 2 also had to move, because its pattern `ceilingForComments(v.comments)` MATCHES AN
    UNRELATED PRE-EXISTING LINE — the console.error that prints a suggested ceiling. It would have
    passed against any implementation at all, and matches the merge base too, so it graded
    `executed_stale` rather than proving anything.

    THE SHARD'S OWN FILENAME SLUG IS HISTORICAL. It still reads `-a-bucket`, from the filed remedy
    this amendment overturns, and it stays that way deliberately: `task-id-existence --base` compares
    declared ids by FILE with no rename awareness, so renaming a shard reads as RE-ISSUING its id and
    is refused — its printed remedy, "renumber to a fresh reserved id", is wrong advice for a rename.
    The title, rationale and criteria above are the record; the slug is not.

