- id: W1-T3180
  title: "W1-T3022 BUCKETED EVERY COMMENT-LOAD RECORDING PATH BUT ONE, AND THE ONE IT MISSED FIRES MOST OFTEN — the base-inherited write is `nextBaseline[v.path] = v.comments`, an EXACT count that never passes through `ceilingForComments`, so any branch behind main that merely RUNS the gate rewrites the ledger to an interpolated number that conflicts with main on that line: W1-T3022's own failure, on the very key its incident table named"
