  acceptance:
    - claim: "A landing pull request whose own checks are red at its head, where main alone is not red the same way, is rebuilt by the lane at its next pass from the pending edits on current main: one new commit and a body written from it, or the lane closes it and opens the next one itself"
      proof: "grep: W1-T13210 criterion 1 in test/inbox/a-red-landing-pull-request-rebuilds-itself.test.ts"
    - claim: "While the lane waits behind an open landing pull request it writes a waiting row that names the pull request, the state of its checks and the number of edits waiting, once for each change of that state and not once a pass"
      proof: "grep: W1-T13210 criterion 2 in test/inbox/a-red-landing-pull-request-rebuilds-itself.test.ts"
    - claim: "A rebuild that would produce the tree the red head already has is not pushed again: the lane rebuilds only when main or the pending set changed, and otherwise its waiting row says the pull request is red and unchanged, with the failing check"
      proof: "grep: W1-T13210 criterion 3 in test/inbox/a-red-landing-pull-request-rebuilds-itself.test.ts"
    - claim: "invariant:a-rebuild-loses-no-edit — an edit carried by a landing pull request that the lane itself closes or replaces stays pending and is never set aside as closed without a merge; a pull request a person closes sets its files aside as today; and at most one landing pull request is open"
      proof: "grep: W1-T13210 criterion 4 in test/inbox/a-red-landing-pull-request-rebuilds-itself.test.ts"
  rationale: |
    OBSERVED 2026-11-16 by the operator session: landing pull request #18789 was red from 02:51Z to 15:49Z on its own acceptance gate (W1-T13209 has the cause), and nothing repaired it. 32 files waited in state/task-files-landing-pending on the fleet host for those 13 hours, the edit of W1-T13128 among them. The operator session corrected the body by hand.

    READ src/lib/feedback-landing.ts on origin/main (2d69d3780c), `taskFilesLandingSteps`:
    - An open pull request is the seal: `if (open[0]) { result.prUrl = open[0].url; ...; return wait(); }`. The lane looks at nothing else about it, so a red pull request and a green one are the same to it.
    - The wait is silent. `wait` logs `task_files_landing.waiting` only when it is given a reason (`if (reason !== undefined) { ... opts.log?.("task_files_landing.waiting", ...) }`), and the open-pull-request path calls it with none.
    - The commit message and the body both say the branch takes no push while its pull request is open, so the fix lane has nothing to push to, and the pull request is not a run branch.
    - A rebuild by close-and-reopen would lose every edit under today's rules: in the batch loop a staged file whose pull request reads `CLOSED` is set aside with "its landing pull request ... was closed without a merge". That rule is right for a pull request a person closes to decline its edits, and it is the thing a rebuild must not trip.
    INFERRED: that no other pass acts on a red landing pull request. Thirteen hours with no repair says so; which pass reads it and what it decides is the MEASURE FIRST.
  design: |
    MEASURE FIRST: name the daemon pass that reads a landing pull request's checks today and what it decided for #18789 between 02:51Z and 15:49Z on 2026-11-16 (its ledger rows; the operator session can read them). If a pass already routes it somewhere, build on that route and say so.

    1. At the seal, read the open pull request's checks at its head through the reads the sweep already has. Green or pending: wait, as today, and write the waiting row on a state change.
    2. Red, and main alone is red the same way: wait for main to move (the W1-T5531 rule the lane already applies to a preflight refusal).
    3. Red otherwise: rebuild. Build the batch from the pending set on current main exactly as a first landing does, including the per-file preflight that sets a refused file aside. If the tree differs from the head, push it and rewrite the body (W1-T13209 makes the body follow the commit). The sealed-branch promise becomes: no push while the pull request is open and not red.
    4. If the lane must close and reopen instead (decide from the measurement, and say why), it marks the staged records before closing, so the set-aside rule can tell the lane's own close from a person's.
    5. No change to rebuild from: no push. The waiting row says red and unchanged and names the failing check, so the stuck-pull-request reading finds it.
    INVARIANT a-rebuild-loses-no-edit: the lane's own rebuild or close removes nothing from the pending directory; only main holding the bytes, a moved base, a preflight refusal or a person's close does. At most one landing pull request is open per repository.
    NOT IN SCOPE: why the body and the commit disagreed (W1-T13209); the other landing families; a time limit on a pull request's age (the row carries its age; no number decides anything).
  falsifier: |
    Leave a red pull request alone and criterion 1 must fail. Write the row on every pass, or never, and criterion 2 must fail. Push an identical tree again and criterion 3 must fail. Let the lane's own close set a file aside, or open a second pull request, and criterion 4 must fail. Restore and all pass.
  note: |
    reservation hand-off: run-unfiled-1794847949786 -> run-unfiled-1794847949786
