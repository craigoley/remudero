    - claim: "inside the container, with RMD_INSTANCE_NAME=core, the lane resolves core as the live primary and starts"
      proof: 'grep: test("W1-T9500: a containerised core daemon resolves its instance by name and starts the lane" in test/the-sre-lane-finds-its-instance-from-inside-its-container.test.ts'
    - claim: "a recycle with --instance passes the instance name to the container it runs"
      proof: 'grep: test("W1-T9500: the recycle names the instance to the container it runs" in test/the-sre-lane-finds-its-instance-from-inside-its-container.test.ts'
    - claim: "a name the registry does not hold disables the lane, naming it"
      proof: 'grep: test("W1-T9500: an unknown instance name disables the lane by name" in test/the-sre-lane-finds-its-instance-from-inside-its-container.test.ts'
  falsifier: |
    Keep the state-root match alone: /home/node/Remudero against the repo registry resolves nothing and the first test
