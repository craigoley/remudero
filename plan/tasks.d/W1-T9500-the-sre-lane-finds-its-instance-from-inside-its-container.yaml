- id: W1-T9500
  title: "THE SRE LANE FINDS ITS INSTANCE FROM INSIDE ITS CONTAINER — W1-T8232 matches the daemon's state root against the registry's host paths, but inside the container the root is /home/node/Remudero, so every core start since writes `sre_lane.disabled` (63 rows across the 10-10..10-14 rotations, 0 `sre_lane.started`) and the idle-capacity detector that judges a hold's idle cost against its cause's own history never ran while a recycle PAUSE held core's 3 lanes from 08:12Z to 10:58Z on 2026-10-14"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — how a containerised daemon names its own registry instance for the SRE lane
  band_meaning: blast-radius
  origin: "operator session 2026-10-14: flow re-measure (~/Remudero-notes/flow-remeasure-2026-10-14/RESULTS.txt, recommendation 4: a PAUSE-age signal relative to observed recycle durations, no fixed cap)"
  plan_refs: [W1-T8232, W1-T8236, W1-T8238, W1-T8235, W1-T9409, W1-T4429, W1-T8245, W1-T3596]
  files:
