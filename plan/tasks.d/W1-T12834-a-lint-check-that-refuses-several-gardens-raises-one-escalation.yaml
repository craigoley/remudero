  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - 568 [design-invariant-proof] refusals across 11 lanes ran for 60 hours (2026-11-13T03:19Z to 2026-11-15T15:02Z). The operator session found the cause by reading rows.
    - The overseer's ladder is per garden (gardener_overseer.noticed 145, healed 74, escalated 47 in 7 days). READ gardener-overseer.ts: it reads each garden's own failure steps, and no class joins plan_pr.preflight_refused across gardens by failing check.
    - The scout's 292 refusals carry 207 distinct task_ids, so a retry of a refused finding mints a fresh id. Each mint is a pushed refs/rmd-id reservation, and none of those 207 landed.
    - READ gardener.ts runGardenAsync: a preflight refusal logs <name>.garden_filing_failed or landing_repeat_skipped with a doubling retry, and records no fingerprint of the finding it minted for.
  design: |
    1. gardener-overseer.ts: on each pass, group the trailing 24 hours of plan_pr.preflight_refused rows by failing check. Take the lint tag from failures[].lines when present, else failures[].check. Use the row's gardener_origin.name, else lane, as the garden.
    2. At 3 or more gardens, write gardener_overseer.filing_class_blocked and escalate once through the existing escalation path, keyed by the check, so the dedup is the check and not the garden.
    3. gardener.ts: persist the minted id per finding key in the garden's state when a landing is refused, and reuse it on the retry; release it when the finding leaves the inventory.
    INVARIANT one-escalation-per-blocked-check: one escalation per check per blocked episode, however many gardens and passes repeat it.
    NOT IN SCOPE: fixing the refused check itself (W1-T12832, W1-T12833), failure steps the overseer does not classify (W1-T12843), and reaping reservations already minted.
  falsifier: |
    Remove the cross-garden join and criterion 1 must fail. Raise on every pass and criterion 2 must fail. Lower the garden threshold to 1 and criterion 3 must fail. Mint on every retry and criterion 4 must fail. Restore and all pass.
