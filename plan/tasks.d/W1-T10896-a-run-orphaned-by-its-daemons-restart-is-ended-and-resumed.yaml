      proof: 'grep: test("W1-T10896: a same-host claim minted before an in-place restart is released at boot" in test/dispatch/a-run-orphaned-by-its-daemons-restart-is-ended-and-resumed.test.ts'
    - claim: "a claim minted on another host is still left to the operator at boot, unreleased"
      proof: 'grep: test("W1-T10896: a cross-host claim is still left to the operator at boot" in test/dispatch/a-run-orphaned-by-its-daemons-restart-is-ended-and-resumed.test.ts'
    - claim: "the orphaned run gets exactly one orphaned-by-restart verdict, and a second boot writes none"
      proof: 'grep: test("W1-T10896: a run orphaned by the restart gets one orphaned-by-restart verdict" in test/dispatch/a-run-orphaned-by-its-daemons-restart-is-ended-and-resumed.test.ts'
    - claim: "the orphaned run's exact pushed head is a resumable checkpoint, so dispatch resumes it instead of skipping run-branch-already-pushed"
      proof: 'grep: test("W1-T10896: the orphaned run pushed head resumes instead of blocking dispatch" in test/dispatch/a-run-orphaned-by-its-daemons-restart-is-ended-and-resumed.test.ts'
    - claim: "an orphaned-by-restart verdict is never a worker strike"
      proof: 'grep: test("W1-T10896: an orphaned-by-restart verdict is not a worker strike" in test/dispatch/a-run-orphaned-by-its-daemons-restart-is-ended-and-resumed.test.ts'
    - claim: "orphaned-by-restart is a checkpoint handoff reason"
      proof: 'grep: orphaned-by-restart in src/lib/daemon.ts'
  falsifier: |
    At base the boot sweep supplies only the replaced-container probe, so the same-host case returns the
    operator arm and the first case fails; no verdict is written and the branch still blocks, so the third and
    fourth cases fail.
    - Release every same-host claim without the namespace-boot comparison: a claim minted AFTER the boot (a live
      run of this namespace) is released and the first case's live-claim control fails.
    - Release cross-host claims too: the second case fails.
    - Write the verdict on every boot: the "second boot writes none" assertion fails.
    - Count the verdict as a worker failure: the strike case fails.
    - Write the verdict without the head receipt: the resume case still reads run-branch-already-pushed.
    GUARD that held at base and must still hold: test/a-claim-minted-before-this-namespace-booted-has-no-claimant.test.ts
    (the runTask taken-arm release) passes unchanged.
