  design: |
    No fixed count or timer. Each release names the ledger row that earned it.
    1. A RESTORED CHECKPOINT OUTLIVES ITS RUN'S WORKER ERROR. When a run that logged `implement.checkpoint_restored`
       (source_branch S, source_head_sha H) ends through `workerErrorVerdict` with verdict `failed`, and has pushed no run
       branch of its own, run-task writes ONE `implement.checkpoint_kept` row right after that verdict:
       {task_id, run_id, source_branch S, head_sha H, failed_stage, failed_subtype}. A budget breach (`blocked_budget`)
       writes none. `pendingWorkerBoundaryHandoffs` reads that row as a receipt for (S, H), so it re-pends exactly what
       the verdict consumed. Every other verdict consumes the receipt as today, including no_pr and a run that pushed
       its own branch (that branch is the newer checkpoint, W1-T7837). A task whose restored checkpoint keeps failing
       is bounded by the existing dispatch circuit breaker and the lifetime judge. This task adds no bound of its own.
    2. THE GUARD READS THE CURRENT RECEIPTS. When a dispatched run settles, the daemon refreshes that task's entry in
       `resumableHandoffs`, by the same `pendingWorkerBoundaryHandoffs` fold over that task's rows. The next pass's
       `runBranchStateFrom` then sees a receipt that was written or consumed mid-process. Do not re-read the whole
       ledger on each pass. A kept receipt whose branch tip equals H then does not block (W1-T7837's existing rule), and
       the next dispatch restores H through `restoreBoundaryCheckpoint`.
    3. A WORKER-ERROR LATCH RE-OFFERS ON PROVIDER EVIDENCE. In `independentFailureLatch`, a `failed` latch whose run's
       verdict came from `workerErrorVerdict` (reason "worker error at ..." or "worker ended by signal ...") releases on
       the first LATER worker result row (`recon.done`, `implement.done`, `implement.continued` or a fix round's
       result, for any task) with the same `provider` and `subtype: success`. The release has evidence
       `provider_recovered` and no back-off. A task-caused `failed`/`no_pr` latch keeps W1-T7533's rule unchanged. In
       daemon.ts, the in-process `independentFailureBlocksThisRun` hold defers to this latch for a worker-error block,
       so a live process cannot outlast the ledger's release.
    4. EVERY RELEASE LEAVES ITS ROW. The daemon's selection pass writes `INDEPENDENT_BLOCK_RELEASED_STEP` once per
       blocking run, for every release `independentFailureLatch` projects (`provider_recovered`, and W1-T7533's
       `main_moved` and `contract_revised`). The row names blocking_run_id, the evidence and its row's ts.
       `receiptRecorded` stops a repeat.
    5. RETAIN THE KEPT ROW. Add `"implement.checkpoint_kept"` to `DECISION_RELEVANT_LEDGER_STEPS` (src/lib/ledger.ts),
       with a comment naming `pendingWorkerBoundaryHandoffs` as its reader. If it rotated out while the receipt it
       re-pends stayed, the receipt would read consumed again.
    Tests go in a new file, test/a-restored-checkpoint-outlives-its-runs-worker-error.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive `pendingWorkerBoundaryHandoffs`, `runBranchStateFrom` through the daemon's
    selection with an injected run-branch listing, and `independentFailureLatch` with ledger fixtures shaped like the
    W1-T8502 rows above. Use a real gitRepo() fixture with a bare origin for the restore case, with a local git identity
    and neutral helper names.
