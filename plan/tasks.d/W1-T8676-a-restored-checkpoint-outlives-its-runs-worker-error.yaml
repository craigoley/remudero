  falsifier: |
    Leave the fold's "any later verdict replaces" rule alone, and the first test reads the receipt consumed after a
    worker-error verdict, as W1-T8502's was at 13:17:56Z. Keep a receipt through a no_pr verdict, and the second test
    fails. Compute `resumableHandoffs` only at boot, and the third test sees run-branch-already-pushed on the next pass.
    Gate the provider release on INDEPENDENT_BLOCK_BASE_BACKOFF_MS, and the fourth test stays latched. Apply it to a
    task-caused failure, and the fifth test re-offers too early. Leave the release unwritten, and the sixth test reads
    no `dispatch.independent_block_released` row.
