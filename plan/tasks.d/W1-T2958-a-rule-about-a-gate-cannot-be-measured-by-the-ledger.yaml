      proof: "unit test: test/a-rule-about-a-gate-cannot-be-measured-by-the-ledger.test.ts"
    - claim: "the diff coverage rule reads as measured rather than unmeasurable once it declares that channel"
      proof: "unit test: test/a-rule-about-a-gate-cannot-be-measured-by-the-ledger.test.ts"
    - claim: "a rule declaring no channel at all still renders as unmeasurable with its stated reason and never as a zero rate"
      proof: "unit test: test/a-rule-about-a-gate-cannot-be-measured-by-the-ledger.test.ts"
    - claim: "a failure dated before the rule earned its citation is not counted as a recurrence, matching the boundary the ledger channel already applies"
      proof: "unit test: test/a-rule-about-a-gate-cannot-be-measured-by-the-ledger.test.ts"
    - claim: "an entry declaring a ledger step pattern is graded exactly as before this change"
      proof: "unit test: test/a-rule-about-a-gate-cannot-be-measured-by-the-ledger.test.ts"
  falsifier: |
    BOTH DIRECTIONS. A widening that makes every rule measurable has deleted the honest
    UNMEASURABLE arm rather than extended the table: assert a no-channel entry still refuses.

    AND THE LEDGER ARM MUST BE PROVED UNTOUCHED, not assumed. Grade a ledger-signature entry
    before and after and require the same verdict; this task extends one union and must change
    nothing about the channel that already works.

    THE DATE BOUNDARY IS THE SUBTLE ONE. Seed a failure dated BEFORE the citation date and assert
    it is excluded. Without that case a new channel silently counts a repo's whole history against
    a rule written last week, and every rule reads as failing.

    PROVE IT LOAD-BEARING: remove the new channel and re-run — `# fail` non-zero without it,
    `# fail 0` restored.
