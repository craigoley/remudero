- id: W1-T2958
  title: "A RULE ABOUT A GATE CANNOT BE MEASURED BY THE LEDGER, SO THE ONE CI-GATE ROW IN THE EFFICACY TABLE IS MARKED UNMEASURABLE AND STAYS THERE — `MeasurableRuleSignature` offers exactly one recurrence channel, `stepPatterns` over the ledger union, and `rule-efficacy.ts`'s own header states nothing in CI can reach that corpus; give the table a SECOND signature kind keyed on a CI failure so `diff-coverage-gate` becomes measurable without a ledger row that will never exist"
