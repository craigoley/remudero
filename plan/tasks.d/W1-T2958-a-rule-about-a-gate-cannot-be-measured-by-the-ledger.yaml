  rationale: |
    MEASURED AT 903b5a6. `RULE_SIGNATURES` holds three entries. Exactly one is `measurable: true`.
    The row that names a CI gate — `CLAUDE.md#before-you-push:diff-coverage-gate` — is
    `measurable: false`, and it is not an oversight: `MeasurableRuleSignature` exposes ONE
    recurrence channel, `stepPatterns`, matched against the ledger union, and the module header
    says "HOST-SIDE, NOT A CI GATE: the ledger lives on the daemon host; nothing in CI can read
    it." A diff-coverage failure is a red check on a pull request. It never becomes a ledger row,
    so no pattern anyone writes will ever make that row measurable.

    THIS IS A SHAPE, NOT ONE ROW. The rules most worth measuring are the ones a GATE already
    refuses, because those failures are objective, dated and attributable. Under today's single
    channel every one of them is structurally unmeasurable, and the table's honest response is to
    list them UNMEASURABLE — which is correct behaviour producing a useless answer.

    WHY THIS IS SEPARABLE FROM W1-T2957. That task builds the corpus and decides nothing. This one
    changes only how a rule DECLARES its recurrence channel and how the report counts it. Neither
    files anything; the filing question is W1-T2959's.
  design: |
    (i) A SECOND SIGNATURE KIND, NOT A SECOND TABLE. `RULE_SIGNATURES` stays the one reviewed-like-
    policy table. Widen the signature union so an entry declares EITHER ledger `stepPatterns` OR a
    CI-failure signature (a check name plus a matcher over that check's failure evidence), and let
    `ruleEfficacyReport` count recurrences from whichever channel the entry declares. A second
    parallel table would drift from the first, which is the defect W1-T2790 ranks against.

    (ii) THE UNMEASURABLE ARM IS PRESERVED, NOT EMPTIED. A rule with no channel at all still renders
    UNMEASURABLE with its stated reason — P48's no-naked-zero clause is explicit that an
    all-unmeasurable table must render a refusal, never a false "0% repeat-incident rate". Adding a
    channel must not let a rule with neither channel quietly read as 0% instead.

    (iii) THE RECURRENCE DATE RULE CARRIES OVER UNCHANGED. A ledger signature counts a match as a
    RECURRENCE only strictly after the date parsed from the rule's own earning citation. A CI
    signature must use the same boundary, so a failure predating the rule is not counted against it.

    (iv) NOT IN SCOPE: `escalateRepeatingRules`' proposal drafting, which already works on whatever
    the report returns and needs no change to consume a new channel; and the corpus reader itself,
    which is W1-T2957's.
  acceptance:
