  rationale: |
    OBSERVED 2026-11-02, clock-sweep-report on PR #15046 (run 41452854299, shift +400d), and reproduced on origin/main 4edd4e937 with FK_SHIFT_DAYS=7 and a private TMPDIR:
    - "W1-T9432: a renewed claim or a moving run branch keeps the claim": the run-branch case reads reclaim, not alive. The fixture commits its checkpoint with git's real time (readRunBranchActivity reads %ct), while mintedAtMs and nowMs come from the shifted Date.now(), so the branch reads older than the mint.
    - "W1-T9106: the launcher applies the learned ceiling to the daemon verb only": "a stale file keeps the inherited ceiling" got the learned ceiling. The fixture writes valid_until: Date.now() - 1 on the shifted clock, and bin/rmd's launcher child judges Date.now() < valid_until on the real clock.
    - Production reads both sides from real time in each case (a git committer time against the wall clock; a daemon-written file against the launcher's wall clock), so neither is a production time bomb. Unshifted, both suites pass.
    - #15046 surfaced them by touching both files; clock-sweep runs over the suites a diff touches.
  design: |
    Dispatch claim: commit the checkpoint with GIT_COMMITTER_DATE and GIT_AUTHOR_DATE set to checkpointAt, an ISO time taken from the test's Date.now(). Heap ceiling: the stale fixture writes valid_until: 1, past on any clock. No assertion changes.
