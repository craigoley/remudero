    - claim: "the partial set is the changed tests, the readers of each set-aside file and the selection of the modelled rest, bounded by the host budget"
      proof: 'grep: test("W1-T9953: the partial set takes changed tests, set-aside readers and the modelled rest" in test/a-full-fallback-author-selection-is-never-run-whole.test.ts'
    - claim: "a full-fallback run's verdict is over-capacity with a PARTIAL line naming what CI is left to check, never passed"
      proof: 'grep: test("W1-T9953: a full-fallback run says it is partial and is never green" in test/a-full-fallback-author-selection-is-never-run-whole.test.ts'
  falsifier: |
    On origin/main, the console line carries no reason, so the first test fails. With a deadline that fits, the
    affected-tests argv holds every suite, so the second fails. The over-capacity subset keeps only changed tests,
