- id: W1-T9953
  title: "A FULL-FALLBACK AUTHOR SELECTION IS NEVER RUN WHOLE ON A SHARED HOST — under --deadline, preflight-author prices the full fallback against the whole remaining deadline, admits all 3,645 suites at 1-3 workers and holds a shared Mac test slot for 2+ hours to give a slower copy of the full run CI does anyway; it must name the file that forced the fallback, run a reach-and-cost-bounded partial set, and say the rest is CI's"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # one concern: what preflight-author runs when the selector falls back to everything; the shared selector is unchanged
  band_meaning: blast-radius
  origin: 'W1-T9928 rationale (slot-1 held by a 3,645-file full-fallback run); coordinator brief 2026-10-16 "why preflight-author selects the FULL suite"'
  plan_refs: [W1-T7809, W1-T5895, W1-T4404, W1-T6084, W1-T9928, W1-T9951]
  files:
    - scripts/preflight-author.mjs
