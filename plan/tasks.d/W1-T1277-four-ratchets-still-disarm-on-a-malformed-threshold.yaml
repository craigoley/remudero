  title: "FOUR REQUIRED RATCHETS STILL DISARM ON A MALFORMED THRESHOLD — `capChars`, `linesPct`, `branchesPct` and `scorePct` each skip their comparison behind a `typeof … === 'number'` guard, so a quoted baseline value reports OK instead of refusing, and W1-T1233 fixed only the fifth site"
