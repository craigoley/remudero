  note: "verify:human — ruling-shaped by the W1-T353 rule's own logic (the deliverable recommends a
    subsystem's fate); isDispatchEligible parks it for the operator, which is the design.
    risk:medium — a document; the hazard is a wrong recommendation, which the human verify exists
    to catch.
    budget_usd 60 — three source-derived facts and a priced recommendation; no code.
    PROOF NOTE: both grep patterns are new text in a new file — they miss the merge-base and
    discriminate; plain words and a hyphen, no BRE metacharacters. The proofs parse and execute
    against the path once the doc exists; verify:human means no headless dispatch ever runs them
    unattended, which is intended."
