  falsifier: |
    Fake deps whose first full pass never settles, with the backstop far away, and one runnable task. At origin/main no
    `run.start` comes before `daemon.boot_gate.opened` (trigger backstop). With the change the task starts on tick 1,
    while `checkMeasurementCadence` and `checkRetroTrigger` stay deferred until the gate opens. Restore
    `await bootGateOpened` ahead of dispatch and the first test reds. Run the gated cadences on tick 1 instead and the
    second reds. Give the open-PR, run-branch or claim fake a hit for the task and the third must see no start.
  note: |
    EFFECT, measured after merge from the core ledger union with no numeric pass mark: compare
    `daemon.boot_first_dispatch.first_run_start_ms` with this rationale's baseline (boot to first run.start median 4.9
    min over 57 boots, 4.1 min of it gate wait), and the W1-T8235 `boot_gate` idle-phase lane-min per day before and
    after. Healthy shape: first `run.start` follows the boot by about the time of the run-branch read and one
    selection pass, not by the first full pass.
