      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "percentiles are reported, never a mean, so the outlier being looked for cannot drag the figure"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "each class carries its outcome split, so a class that is cheap because it fails early is visible as such"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "cost is divided by SETTLED runs, so a class needing two attempts shows its real per-completed-task price"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "all three rotation forms are read, and the report names which it opened"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "rows are deduped by run_id and the row-to-distinct ratio is printed, so archive duplication cannot inflate a count"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "the corpus's newest timestamp is printed, so a census answering about the wrong window is visible"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
    - claim: "an empty or unreadable corpus REFUSES rather than reporting zeros that read as a real distribution"
      proof: "unit test: test/mount-headroom-sweep.test.ts"
