  acceptance:
    - claim: "Triage's remote id reservation (gatedRemoteRefReserver, reserveTaskIdRemote, reserveTaskIdBlockRemote) and releaseTaskIdReservation run their git through hostWorktreeGitAsync when called from the daemon process, and a daemon-loop triage makes 0 calls to hostWorktreeGitResult"
