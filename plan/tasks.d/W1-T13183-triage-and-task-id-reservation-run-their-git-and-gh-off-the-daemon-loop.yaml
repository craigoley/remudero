    - claim: "The repair feedback capture under runSweep (captureRepairFeedbackWithPriorVerdict) and pullFoldDebtEntries read GitHub through the async gh helpers (ghJsonAsync, ghTextAsync, paceGhEntryAsync), not ghExec or ghJson, on the daemon loop"
      proof: "grep: W1-T13183 criterion 2 in test/triage-and-task-id-reservation-run-their-git-and-gh-off-the-daemon-loop.test.ts"
    - claim: "invariant:no-sync-spawn-on-the-loop-for-these-callers — a guard test runs each of these callers under the daemon loop host with child_process's sync APIs replaced by a recorder, and fails if any of them reaches execFileSync, spawnSync or execSync"
      kind: guard
      proof: "grep: W1-T13183 criterion 3 in test/triage-and-task-id-reservation-run-their-git-and-gh-off-the-daemon-loop.test.ts"
    - claim: "invariant:one-id-one-owner — two concurrent async reservations for the same next id still end with one holder and one refusal, as the sync path does today"
      kind: guard
