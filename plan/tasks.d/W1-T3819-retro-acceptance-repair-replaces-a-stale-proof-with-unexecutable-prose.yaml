  rationale: |
    OBSERVED on the live core daemon on 2026-09-19. `repairRetroAcceptanceBlock`
    detected an invalid or stale Acceptance block and wrote a replacement whose sole
    proof begins `SHIPPED-log/NET-STATE/...`; that text has neither the `grep:` nor
    `unit test:` dialect required by the review executor. The fallback therefore
    converts one review-blocking body defect into another. The retro child for
    RETRO-1789858570652 subsequently reached a blocked-fixable disposition rather
    than a terminal review.

    The repair runs only after the harness has pushed the retro branch, and the
    command already fetches the PR diff immediately after the repair. At that point
    the actual added lines and paths are available without inventing a claim. A
    fallback proof must be evidence from that exact diff, not a static source symbol
    that predates the retro and fails proof discrimination.
  design: |
    Fetch the raw PR diff once after the owned retro PR exists and before the
    acceptance repair; reuse that same diff for the existing plan-only guard. Thread
    a diff-derived proof candidate into `repairRetroAcceptanceBlock`. Select only a
    non-empty, added physical line paired with its actual changed path, escape it for
    the review executor's BRE `grep:` invocation, and render a one-line Acceptance
    criterion from that candidate. The result must parse through the real
    `parseAcceptanceBlock`, execute at head, and be absent from the merge base.

    If the diff has no safely representable added line, do not replace the body with
    prose and do not claim a successful repair. Preserve the existing body, emit a
    distinct durable `acceptance.repair.unrepresentable` reason, and let the normal
    bounded fix/escalation path name the remaining defect. Do not add a second GitHub
    diff request, weaken proof discrimination, or change retro scope/marker rules.
  acceptance:
    - claim: "retro acceptance repair remains a real, test-covered production rung"
      proof: "unit test: the rung REPAIRS a body that parses to one criterion with an empty proof"
    - claim: "the retro command owns its post-publication acceptance repair"
      proof: "grep: repairRetroAcceptanceBlock( in src/run-task.ts"
  falsifier: |
    Restore the prose fallback. The focused repair fixture must parse a criterion
    whose proof has no executable dialect, while the repaired implementation emits
    a `grep:` proof derived from an added fixture line and the real proof executor
    finds it only at head. Separately feed a deletion-only or unrepresentable diff:
    any body edit or `acceptance.repaired` row is a failure, because no honest proof
    was available.
  note: |
    reservation holder is this filing branch, verified by `rmd next-task-id` reserving
