      proof: "grep: W1-T3808 criterion 1 in test/console-analytics-history-route.test.ts"
    - claim: "the production analytics route calls the historical producer and emits top-level timeSeries"
      proof: "grep: buildAnalyticsTimeSeries( in src/lib/analytics-route.ts"
    - claim: "pre-collection, partial, missing, unreadable, and not-collected intervals remain explicit gaps"
      proof: "grep: W1-T3808 criterion 3 in test/console-analytics-history-route.test.ts"
    - claim: "queue and provider historical trends remain explicitly not-collected and no raw rows or task identifiers escape"
      proof: "grep: W1-T3808 criterion 4 in test/console-analytics-history-route.test.ts"
