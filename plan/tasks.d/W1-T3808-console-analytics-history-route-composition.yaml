  rationale: |
    Replaces W1-T3804 and the historical half of W1-T3806. The five supported historical metric
    families already exist in the ledger stream; queue depth and provider allowance do not. The
    producer and top-level route composition therefore ship as one call-site-proven task.
  design: |
    Add a bounded ledger-backed time-series producer for exactly five evidenced metric families,
    naming UTC window, bucket width, aggregation, coverage, and points. Compose timeSeries at the
    top level of GET /v1/analytics. Pre-collection, partial, missing, unreadable, and not-collected
    buckets are explicit gaps, never healthy zeroes. Keep queue and provider historical trends
    explicitly not-collected until retained evidence exists; do not infer them from live scalars.
