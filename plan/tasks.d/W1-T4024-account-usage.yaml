  rationale: |
    THE DATA ALREADY REACHES THE SERVER; IT NEVER REACHES THE CONSOLE. MEASURED 2026-09-22 on the live
    Azure host.

    (0) THE CONSOLE ASKS FOR A PROJECTION THAT CARRIES NONE OF IT. lib/rmd-control.ts in the console
        requests `/v1/analytics?projectionVersion=console-v1`, and the route answers with
        `snapshot.consoleV1` alone (`resolveConsoleV1Projection`). Read from the daemon's own snapshot:
            full snapshot   keys include timeSeries (5 series) and provider
            console-v1      keys: version, asOf, metrics, operatorAgent — no timeSeries, no provider
        So the headroom card says "unavailable", and the trend cards have no series to draw. This is
        also why CONSOLE-T37's shape adapter (console #1606) did not make trends render in production:
        it corrected field names on data the console never receives.

    (1) THE DAEMON PERSISTS EVERY SUBSCRIPTION WINDOW. `state/provider-routing-status.json`
        (written by `writeProviderRoutingStatus`, src/lib/provider-routing-status.ts) held, at
        observedAt 2026-09-22T17:45:22Z:
            claude  readable  session (5h) 2%   weekly (all models) 42%   weekly (Fable) 0%
            codex   readable  codex primary 10080m 70%
        serve reads that file through `readProviderRoutingStatus` in
        src/lib/live-analytics-snapshot-cache.ts — no credential, no probe.

    (2) THE ADAPTER THROWS IT AWAY. `adaptLiveAnalyticsMetrics` (src/lib/analytics-live-metrics.ts)
        exposes ONE figure, `provider.allowance.remaining`, via `providerRemaining`, which returns
        `snapshot.selected.tightestRemainingPercent` when present and otherwise the `Math.min` of
        every window of every provider. Run against the real snapshot above it returned
        `{"state":"observed","value":58}` — claude's weekly window, because claude was the SELECTED
        provider. CODEX WAS AT 70% USED, 30% LEFT, AND APPEARS NOWHERE. That is what a full-snapshot
        caller sees today; simply forwarding this scalar to the console would replace "unavailable" with
        a number that overstates headroom and names no lane, which is worse than absent.

    (3) CASH SPEND IS NEVER PROJECTED. `/v1/analytics` emits five series (runs.completed,
        tokens.total, cache.reuse, cost.modeled.usd, duration.p50.ms) and `workersByLaneModel`,
        whose `lane` is the WORK lane (implement/fix/review), not the provider lane. No field answers
        "what has the cash lane cost". The number is derivable: `implement.done` rows carry
        `provider`, `billing_mode` and `total_cost_usd`; in the live ledger `provider=cash` held 95
        rows and $1.63.

    (4) THE DOUBLE-COUNT TRAP IS REAL, AND ONLY PART OF IT IS UNDERSTOOD. The same ledger holds 168
        `cost.anomaly` rows ($747.72): 40 of 40 sampled share a `run_id` with an attributed worker
        cost row, and none carries `provider` or `model`, so they restate rather than add. It also
        holds 68 `verdict` rows carrying `total_cost_usd` AND `model`, one per run that also has
        worker `.done` cost rows. MEASURED PER RUN: in 38 of 68 the verdict's figure EXACTLY equals
        that run's worker total (a restatement); in 30 it differs (27 lower, 3 higher), and what it
        measures in those runs is NOT established here. So this task does not assert that every
        verdict restates — it asserts only that the cash reading must not depend on the answer.
        Selecting worker rows on `provider === "cash"` excludes both `verdict` and `cost.anomaly`
        by construction (neither carries `provider`), and the test pins it with fixtures of each.

    (5) A KNOWN UNDER-COUNT, STATED RATHER THAN HIDDEN. `fix.done` rows carry `cost_usd` and
        `billing_mode` but NO `provider`, so fix-rung spend on the cash lane cannot be attributed.
        The reading states that it covers implement workers only; it does not guess.
  design: |
    (0) DELIVERED THROUGH A SECOND, SMALL, VERSIONED PROJECTION — NOT BY GROWING console-v1. MEASURED on
        the live snapshot: console-v1 is already 100,489 bytes, 77% of the console's 128 KB response cap
        (MAX_ANALYTICS_RESPONSE_BYTES), almost all of it the operator-agent block whose four detail
        arrays are each at their 100-item cap. Growing it by the series and provider blocks (~14 KB)
        would leave ~13 KB of margin under a limit that, when crossed, makes the console refuse the
        WHOLE response and blank the entire analytics page. So the route recognises a second named
        version on the same path, `?projectionVersion=console-signals-v1`, answering
        `{version, asOf, timeSeries, queue, provider, spend}` — the five bounded series, the live queue
        and provider blocks merged at request time exactly as the full snapshot merges them, and cash
        spend. It needs no new route and no relay change, leaves console-v1 and W1-T3884's contract
        byte-identical, and isolates failure: operator-agent growth can no longer blank headroom, nor
        the reverse. The live `queue` block rides along because the console's queue card is dead for
        the identical reason (console-v1's `queue.pending` is null and no live queue is sent).

    (i) PER-PROVIDER, PER-WINDOW, BESIDE THE EXISTING SCALAR. Add a `provider.accounts` array: for
        each provider in the snapshot, its id, account label, readable flag and reason, and every
        window as `{name, usedPercent, remainingPercent, resetsAt}`, with the snapshot's as-of. The
        existing `provider.allowance.remaining` scalar stays exactly as it is — routing and other
        consumers read it — so this is additive and no current reader changes.

    (ii) NO NEW READER AND NO CREDENTIAL SURFACE. serve reads only the daemon's snapshot file, as it
         already does. Credential isolation holds by construction rather than by review.

    (iii) CASH IS MONEY OVER A NAMED WINDOW. `spend.cash` reports USD over the trailing 7 and 30 days
          from `implement.done` rows with `provider === "cash"`, each with its window bounds, row
          count and as-of. When a window starts before the oldest ledger row still retained, the
          figure is marked `complete: false` rather than silently shrinking as history compacts.

    (iv) UNITS NEVER SHARE A FIELD. Utilisation is a percentage of a refilling window; cash is
         dollars spent. They are separate objects, so no consumer can add or average them.

    (v) STALENESS IS PER READING. A stale or unreadable snapshot marks every provider entry stale or
        unreadable with its as-of; it is never rendered as 0% or 100% used.

    NOT IN SCOPE: historical headroom trends (the route documents provider trends as live-only and
    uncollected), attributing fix-rung spend (needs `provider` on `fix.done`), and the console's
    rendering, which is its own task in the console repo once this payload exists.
