  note: |
    reservation hand-off: unknown -> file-t4024-runway-panel
    REWRITTEN 2026-09-22 BEFORE ANY BUILD, BECAUSE TWO OF ITS PREMISES WERE FALSE WHEN FILED. The
    original rationale said "CODEX HEADROOM HAS NO READER. Nothing in src/ reads a codex rate-limit
    or usage figure." `codexCapacityFromRateLimits` and `readCodexCapacity`
    (src/lib/worker-provider.ts) landed 2026-09-01 in #3498 — three weeks earlier. It also measured
    the OLD console (345,405 bytes of `rmd serve` HTML); the operator's console is app.remudero.com,
