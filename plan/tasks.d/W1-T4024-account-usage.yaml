  falsifier: |
    Keep returning `selected.tightestRemainingPercent` alone and the second assertion goes red —
    that is the live defect, codex invisible behind claude's number. Sum every cost field and the
    third goes red on the verdict and cost.anomaly fixtures. Put utilisation and dollars in one
    "budget used" figure and the fourth goes red. Sum an unbounded window over a compacted fixture
    and the fifth goes red, because a total that falls as history ages out means nothing changed.
