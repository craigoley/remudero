- id: W1-T3691
  title: "A review skipped for stale reviewer code RETRIES FOREVER AND ALARMS NOTHING — six pull requests went unreviewed for over an hour behind a one-commit lag, the daemon already owned the repair (its freshness restart) and the detection (the skip), and nothing connected them"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 12.00
  files:
    - src/lib/sweep.ts
    - src/lib/daemon.ts
  origin: "operator-session#the-board-could-not-clear-2026-09-16"
  plan_refs: ["W1-T490", "W1-T1021"]
  status: merged
  priority: 1
  attempts: 0
  note: |
    MEASURED 2026-09-16. Six core pull requests (#5762, #5763, #5764, #5765, #5766, #5771) carried
    NO `remudero-review` status at all -- not pending, ABSENT -- while every one of them was green
    on every other check. The ledger says why, once per sweep, per pull request:

      review.skipped_stale_reviewer_code  pr=5762  code_sha=a64dc7ff5
      review.skipped_stale_reviewer_code  pr=5763  code_sha=a64dc7ff5
      review.skipped_stale_reviewer_code  pr=5764  code_sha=a64dc7ff5   (and 5765, 5766, ...)

    THE LAG WAS ONE COMMIT. a64dc7ff5 against origin/main at f7d898ed7 -- `git rev-list --count
    HEAD..origin/main` = 1. That one commit held the entire review queue for over an hour.

    THE OPERATOR CLEARED IT BY HAND, and the manual repair is the evidence the automatic one is
    absent: fast-forwarding the daemon's tree onto origin/main caused the daemon to notice and
    restart itself within seconds, after which the skips stopped. The mechanism worked perfectly
    the moment something told it to run.
  rationale: |
    FOUR BEHAVIOURS COMPOSED INTO A STALL AND THREE OF THEM ARE CORRECT. This task must not
    "fix" any of the three:

      1. `deploy/entrypoint.sh:148` checks out `--detach` ON PURPOSE. A pin means exactly what it
         says (its own comment, line 103). Correct.
      2. `rmd` self-sync REFUSES to fast-forward a ref that is not `main` -- "never moving a ref
         that is not main", so it declines to move a detached HEAD out from under an operator's
         work. Correct.
      3. The reviewer REFUSES to post a verdict from stale reviewer code, rather than posting one
         that a newer reviewer would disagree with. Correct, and the whole point of the check.

    THE FOURTH IS THE DEFECT, AND IT IS AN OMISSION RATHER THAN A WRONG ANSWER. The skip is a
    terminal, silent no-op. It is re-derived every sweep, for every pull request, forever, and it
    escalates to nothing: no restart, no `needs-human`, no blocker row, no status. An operator
    reading the board sees green checks and an absent review and has no way to learn that the
    reviewer declined for a reason it has already written down.

    THE REPAIR ALREADY EXISTS AND IS NOT REACHED. `deploy/entrypoint.sh`'s freshness-restart loop
    (W1-T490) re-fetches and re-checks-out `TARGET` every time the daemon exits. A daemon that
    exits on stale reviewer code comes back current and reviews normally -- demonstrated on this
    host today. The skip simply never asks for that exit.

    WHY A COUNTER, NOT A TIMER, AND WHY NOTHING IS HARD-CODED. The response must be tiered on
    OBSERVED REPETITION -- the same skip recurring across sweeps for the same code sha -- not on a
    fixed number of minutes, because sweep cadence varies with load and a wall-clock floor tuned on
    an idle fleet is wrong on a busy one. A single skip is ordinary and must stay silent: the
    daemon may be seconds from a restart it already planned.

    A SECOND, SEPARATE BLINDNESS IS NAMED HERE AND NOT FIXED HERE. The deploy supervisor ticked
    throughout and reported `deploy.skip reason="up-to-date (install HEAD == origin/main; daemon
    liveness not observed)"`. It measured a DIFFERENT install than the daemon runs and concluded
    the fleet was current while the daemon was not -- the same shape as W1-T3682's reclaim naming a
    directory that does not exist. It is recorded here as the reason no external watcher caught
    this, and belongs in its own task.
  design: |
    THE BAND RECORDS WIDTH, NOT DANGER. Two concerns are declared because the defect IS the missing
    edge between them: the sweep owns the skip that detects staleness, the daemon owns the freshness
    exit that repairs it, and neither is wrong on its own. A decomposition would put the detection in
    one task and the repair in another and leave the edge -- the whole subject -- in neither.

    (i) THE SKIP CARRIES ITS OWN RECURRENCE. Each `review.skipped_stale_reviewer_code` records the
        code sha it skipped at. A skip whose code sha matches the previous skip's is a REPEAT; a
        new sha resets the count, because that is a daemon that did move.

    (ii) A REPEATED SKIP ASKS FOR THE RESTART THE ENTRYPOINT ALREADY IMPLEMENTS. On sustained
         recurrence the daemon requests its own freshness exit, exactly as `daemon.stale_code`
         does today, and the entrypoint's existing loop brings it back current. NO new update path,
         NO git write from the sweep, and specifically NOT a fast-forward of the detached HEAD --
         moving that ref is what (2) above correctly refuses.

    (iii) IT IS VISIBLE BEFORE IT IS ACTED ON. A repeated skip renders under BLOCKERS BY CLASS in
          `rmd status` naming the code sha, origin/main's sha, and the pull requests held. The
          operator must be able to read the cause on the board rather than by tailing a ledger,
          which is how it was found.

    (iv) A SINGLE SKIP CHANGES NOTHING -- no line, no restart, no blocker row. Today's behaviour is
         the one-off behaviour, byte for byte.

    (v) THE RESTART IS BOUNDED BY ITS OWN EFFECT. If the daemon comes back on the SAME code sha --
        the target is genuinely pinned behind main, a deliberate state -- that is reported as
        needing a human and NOT retried, so a pinned deployment cannot become a restart loop. This
        is the arm that makes (ii) safe and must not be dropped.

    THE SUITE GOES IN test/a-repeated-stale-reviewer-skip-asks-for-a-restart.test.ts, kept out of
    files: for the reason W1-T3680 records.
  acceptance:
    - claim: "a stale-reviewer skip that recurs on the same code sha asks for the freshness restart, so the queue cannot stall behind a lag the daemon can already repair"
      proof: "unit test: a repeated stale-reviewer skip requests a freshness restart"
    - claim: "a single stale-reviewer skip changes nothing, so an ordinary one-off stays as quiet as it is today"
      proof: "unit test: a single stale-reviewer skip is silent"
    - claim: "a skip at a new code sha resets the recurrence, so a daemon that did move is not treated as stuck"
      proof: "unit test: a new code sha resets the stale-reviewer recurrence"
    - claim: "a daemon that returns on the same code sha reports needing a human instead of restarting again, so a pinned deployment cannot loop"
      proof: "unit test: an unchanged code sha after restart asks for a human"
    - claim: "a held review queue is visible on the status board naming the sha and the pull requests, so the cause is readable without tailing a ledger"
      proof: "unit test: a held review queue renders with its sha and pull requests"
  falsifier: |
    Stay silent through a sustained recurrence and the first test fails. Act on a single skip and
    the second fails. Carry the count across a changed sha and the third fails. Restart again on an
    unchanged sha and the fourth fails. Render nothing on the board and the fifth fails.
