    OBSERVED:
    - `REGISTERED_GARDEN_NAMES` (src/lib/garden-registry.ts) has 17 gardens; none revalidates issues.
    - `runEscalationReconcile` (src/lib/sweep.ts) runs every ~7.7 min.
      - It lists only `RETIRABLE_ESCALATION_LABELS` (needs-human, fleet-notice).
      - It closes only when a referent is MERGED or CLOSED.
      - Its latest summary: issues_seen 30, evaluated 8, closed 0, dropped no_referent 20 and no_task_trailer 2.
    - `runStaleEscalationRejudge` (W1-T3167, sweep.ts) has NO production caller (only its test) and 0 `escalation.rejudged`
