    - GitHub (read 2026-10-12 22:11Z): 53 open issues.
      - 24 are pre-escalation hand-filed observations dated 09-13 to 10-08.
      - 4 gardener-liveness issues whose own body says the overseer healed it.
      - 3 READ-MODEL issues, while 378 of 380 consistency runs in 24 h agree.
      - 10 GRILLs, 4 of them "triage claimed ALREADY_DECIDED citing a file that does not exist".
