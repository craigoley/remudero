  design: |
    The garden's entry point is `runIssueRevalidationGarden` (src/lib/issue-revalidation-garden.ts), registered in garden-registry.ts.
    A registered garden `issue-revalidation` (gardener.ts framework). Cadence hourly with `gardenPacingDue` backoff. ONE
    paced REST list of ALL open issues per pass (no label filter) plus `listComments` only for candidates.
    1. CLASSIFY each issue:
       - task/PR referent: reuse `buildEscalationReconcileCandidates`' derivation;
       - known producer class (gardener-liveness, READ-MODEL-*, MEMORY-CAPACITY-*, main-repair-*, LIVE-EDITS, TRIAGE-*,
         clock-sweep:*);
       - hand-filed.
    2. PROBE "is the condition still true?" against CURRENT evidence, per class:
       - liveness: the overseer's `judgeHealth` on recent rows;
       - READ-MODEL: the last N `read_model.consistency` rows for that instance;
       - clock-sweep: the suite's latest sweep result;
       - task/PR: the reconciler's referent state;
       - hand-filed: a bounded judge (reuse `buildStaleEscalationRejudgePrompt`'s shape) given the issue text plus a
         current-main evidence pack (git grep of the files and symbols it names, recent ledger rows of the steps it
         names).
       The judge returns one of: resolved (with a citation), still-true, convert-to-task, or unknown.
    3. VERDICTS:
       - resolved + positive evidence: close with a citation comment;
       - convert-to-task: draft a plan shard through the normal machine-filing path (machine-filing judge plus lint-plan),
         then close with the PR link once the filing merges;
       - still-true: a dated refresh comment at most weekly;
       - unknown or an indeterminate read: KEEP, never close.
    4. GUARDRAILS:
       - Ship in SHADOW (policy `issueRevalidation.mode: shadow`). Each verdict is ledgered as
         `issue_revalidation.verdict`, with no GitHub writes, until the operator flips it to `act`.
       - Never close MANUAL capacity decisions or open GRILLs (comment-refresh only).
       - Never close an issue where an operator comment is newer than the last bot comment (the operator check in
         escalation-answers.ts).
       - Cap closes at 5 per pass. Every close is reversible (reopen), carries the evidence, and writes a ledger row.
    5. TEST CASE: the shadow ledger over the current 53 open issues is the acceptance evidence for flipping to act. The
       review reads the shadow verdict table.
  acceptance:
    - claim: "the garden lists every open issue, classifies it, probes current evidence, and in shadow mode ledgers a resolved/still-true/convert/unknown verdict without writing to GitHub; in act mode it closes only positively-evidenced, non-MANUAL, non-GRILL issues with no newer operator comment, at most five per pass"
      proof: 'grep: test("W1-T8864: the issue revalidation garden re-judges every open issue" in test/the-issue-revalidation-garden-re-judges-every-open-issue.test.ts'
    - claim: "the garden is registered and scheduled"
