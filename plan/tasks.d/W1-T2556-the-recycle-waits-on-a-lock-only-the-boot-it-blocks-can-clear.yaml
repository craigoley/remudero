- id: W1-T2556
  title: "THE RECYCLE WAITS OUT, THEN REFUSES ON, AN INFLIGHT LOCK THAT ONLY THE NEXT BOOT CAN CLEAR — AND IT IS THE THING THAT PRODUCES THAT BOOT; `state/inflight/*.lock` is counted as a FILE (deploy/recycle-container.sh) with the script's own comment saying to \"let the next boot decide\" (W1-T978's reclaim), so a lock naming a container that no longer exists blocks every recycle forever, and the only escape MEASURED 2026-09-01 was an operator moving the file by hand after reading the dead container's id out of it"
  repo: remudero
  depends_on: ["W1-T2555"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  files: [deploy/recycle-container.sh, test/a-lock-whose-container-is-gone-is-reclaimed-not-waited-on.test.ts]
  origin: "operator-session#the-github-auth-outage-2026-09-01"
  plan_refs: ["W1-T978", "W1-T1010", "W1-T1046", "W1-T2555"]
