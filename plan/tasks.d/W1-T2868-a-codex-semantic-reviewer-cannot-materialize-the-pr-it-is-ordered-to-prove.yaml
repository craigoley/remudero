- id: W1-T2868
  title: "a Codex semantic reviewer cannot materialize the PR it is ordered to prove from its empty read-only cwd, so passing executable proofs can be downgraded as non-responsive"
  repo: remudero
  depends_on: [W1-T2748]
  type: implement
