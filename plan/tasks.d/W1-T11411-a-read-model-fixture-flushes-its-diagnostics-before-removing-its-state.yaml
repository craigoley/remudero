  acceptance:
    - claim: A shared read-model fixture helper removes its state dir only after its registered closers have run in reverse order and flushReadModelTransactions has settled, and a lifecycle case observes that order against real SQLite and the default publisher
      proof: "unit test: test/console-api/read-model/every-read-model-fixture-flushes-before-removing-its-state.test.ts"
    - claim: A census refuses any test suite that opens the read model and removes a temp dir without the shared helper or an awaited flushReadModelTransactions before the removal, with a planted-site control
      proof: "grep: W1-T11411 census in test/console-api/read-model/every-read-model-fixture-flushes-before-removing-its-state.test.ts"
  rationale: |
    OBSERVED, 2026-11-03 to 11-05. ENOTEMPTY ("Directory not empty") from a test teardown rmSync recurs suite by suite:
    - Fix-lane dispatches spent on it in the retained ledger window (archives from 11-03): W1-T10354 at 11-03T11:29Z (rmd-scratch-rm-state, an-empty-scratch-read-model-is-rebuilt-from-the-ledger), W1-T11100 at 11-04T00:05Z (rmd-nav-badge-rm, nav-badge-from-the-read-model), W1-T10957 at 11-04T11:54Z (rmd-now-decisions-inputs).
    - #16468's test-slow-shard (2/3) failed the same nav-badge case on 11-04 and passed on re-run. On 11-05 three board-projection sibling suites failed ENOTEMPTY on teardown on the Mac, on different tests per run, with and without the PR's change (load 19-28).
    - The CI-friction gardener has already filed per-suite tasks for the same class: W1-T11186 (now-view), W1-T11015 (board-projection-keeps-no-unread-blob), W1-T10941 (inbox gardener), and earlier W1-T5461 and W1-T10175 (merged, each fixing one or two suites).
    CAUSE, documented in W1-T10175: since #12817 (W1-T9501) the read-model transaction publisher is a worker thread that writes observation files into the state dir asynchronously. A fixture whose after-hook rmSyncs that dir before the writer settles races it, and the writer's next file lands between readdir and rmdir. flushReadModelTransactions (src/lib/read-model-db.ts:292) is the barrier, but each fix so far applied it to one suite. At origin/main 83 suites open the read model and remove a temp dir without awaiting it, so the class keeps recurring wherever load stretches the window.
  design: |
    1. Add test/helpers/read-model-fixture-dir.ts: readModelFixtureDir(t, kind) makes the temp dir (makeTempDir) and returns it with onClose(fn). Its single async after-hook runs the registered closers in reverse order (awaiting async ones), then awaits flushReadModelTransactions(), then removes the dir. W1-T10175's design is the ordering contract.
    2. Migrate each listed suite's local scratch/fixture removal to the helper. Register DB, cursor, ticker and worker closers with onClose instead of separate t.after hooks that could run after removal. Keep every behavioural assertion unchanged; this is fixture lifecycle only.
    3. Add the census in the new test file. It walks git ls-files test/**/*.test.ts and selects suites that import a read-model opener (createReadModelTicker, createReadModelWorker, openReadModelDb, or a module re-exporting them) and remove a temp dir. It refuses any such suite that neither uses readModelFixtureDir nor awaits flushReadModelTransactions before its removal. Include a planted-site control that a violating fixture is caught, and a minimum-population assertion so the census cannot pass by comparing nothing.
    4. The census lands in the same PR as the last migration. It carries no allowlist of suites that simply have not migrated yet. A suite the census names that is not in files joins by scope amendment.
    Out of scope: rm maxRetries/retryDelay, skips or longer timeouts. A retry hides the race instead of ordering it. Also out of scope: any change to the production publisher, which W1-T10175 ruled out.
  falsifier: |
    At origin/main, a read-model suite whose after-hook rmSyncs its state dir while the transaction publisher still has an unsettled write fails ENOTEMPTY intermittently, and nothing refuses a new suite written that way.
  note: |
    reservation hand-off: plan-file branch reserved via rmd next-task-id --branch from the operator session's ops worktree.
    The 83 listed suites were selected at origin/main 2026-11-05 by: imports createReadModelTicker|createReadModelWorker|openReadModelDb|read-model-db, removes a temp dir in an after-hook, and has no flushReadModelTransactions.
