  design: |
    Qualify one captured feedback target using the existing off-loop origin/main read, the exact pending capture and the already accepted answer's stable submission identity. A canonical grilling record may advance an older queued new capture only when the complete immutable capture identity and content agree and there is no newer queued decision or competing reply. Unknown, unreadable, changed, foreign or contradictory evidence stays refused with an explicit existing diagnostic outcome. A queued answered/rejected or otherwise advanced decision must never be overwritten or revived.
    Keep captureFeedbackReply as the one writer. Carry the qualified canonical target into its existing status update so proposal_pr, summary, source lineage, original text, attachments and all other metadata survive the answered transition. Recheck the relevant pending-record identity immediately before capture; drift must refuse before creating a new reply. Keep current operator recognition, scope, route checks, comment-key deduplication and legacy callers intact. No new synchronous Git or network work on the daemon loop, and no second reply writer.
    Do not clear, delete or rewrite the live queue as a repair shortcut, replay old answers, reland a lifecycle regression, synthesize an operator answer or consider a question-store ACK proof that implementation happened. A later normal pass may consume the already accepted exact answer once after the code is reviewed and adopted. Preserve all genuine human holds and the normal landing workflow.
    Extend the two existing physical suites. Use actual private Git/main and queue fixtures, with ordinary and legacy positive controls; old unchanged new capture plus canonical grilling must create exactly one continuation, retaining canonical metadata and history. Cover repeated passes, pending decision changes, changed raw/attachments/lineage, missing or unreadable main, advanced/rejected/answered targets, a competing reply, and a queue fingerprint changing between qualification and capture. Invalid cases must leave original queue bytes and source history intact and create no reply. Delete the source correction, observe the targeted regression fail, restore it and pass. Preserve all existing assertions, whole-file tests, source-positive coverage, committed author entry, stored executable proofs, hosted checks, governed review and protected merge.
    This scope changes no routing capability, provider, budget, service, deployment setting, CI infrastructure or Azure memory policy. Actual answer-to-feedback continuation, task filing/build and signed-in behavior are distinct verification steps. This filing does not claim that the read-mark route source task is already filed or that every Inbox item requires a human.
