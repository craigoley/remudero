- id: W1-T2838
  title: "Serve listens before its first GitHub App token mint settles"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  origin: architect
  plan_refs: ["W1-T2269", "W1-T2554", "W1-T2836"]
  files: [src/lib/serve.ts, src/run-task.ts, test/console-token-refresh.test.ts]
  status: queued
  attempts: 0
  rationale: |
    `startInstallationTokenRefresh` returns a `ready` promise for the first GitHub App token mint.
    The daemon awaits it before its first board read, but `buildServeRoutes` keeps only `armed` and
    discards `ready`. `serveCommand` then binds immediately. On an App-only launch, reconnecting
    browsers or an early status request can therefore reach GitHub while `GH_TOKEN` is still empty.

    This is the same boot-order contract fixed for the daemon by W1-T2554, on Serve's independent
    refresher. A later successful refresh does not disprove the race: the required evidence is that
    production cannot listen until that first promise has settled.
  design: |
    Preserve the synchronous builders used by unit tests and embedders. Add an internal assembly
    result that carries both the server and the first-mint promise, then expose an async production
    builder that awaits only that initial promise. Wire `serveCommand` to the async builder before
    its first `listen`. The refresher already guarantees that `ready` settles on mint failure and
    rearms, so this orders startup without changing Serve's fail-open availability posture.
  acceptance:
    - claim: "an App-configured production Serve cannot return its server for binding until the first token-mint promise settles"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "an unconfigured Serve has no promise to await and preserves the existing synchronous builder behavior"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "serveCommand uses the ready-aware builder before its first listen call"
      proof: "unit test: test/console-token-refresh.test.ts"
  note: |
    Filed from direct source comparison on 2026-09-04. `run-task.ts` awaits `ready` at daemon boot;
    `serve.ts` currently reads only `.armed`. The falsifier must restore the production call to the
    synchronous builder or discard the captured promise and show the focused test failing.
