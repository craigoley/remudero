  falsifier: |
    If `dispatch.circuit_broken` is found to read non-zero over the LIVE file at the sha a build
    starts from, it has already joined a retention set and the premise in (8) is closed — the
    remedy must then be re-derived against whatever made it durable. The check is one unchained
    count against the live ledger, with `dispatch.circuit_broken.escalated` at 2 live as the
    positive control proving the query can see this family.

    SEPARATELY FALSIFYING: if any task is found whose `pr.opened` rows have rotated out while its
    `run.start` rows survive, the false-trip direction has been realised and (7)'s one-directional
    claim is void — the remedy must then be argued against both directions rather than one. The
    controls for that re-run are the three id counts recorded in (6).

    AND IF `breakerGateFor` is ever changed to build ONE cache per PROCESS rather than one per
    invocation, the seed proposed here is redundant for the restart case and only the rotation
    case remains — the design must be re-taken against that, not layered on top of it.
