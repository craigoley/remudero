    OBSERVED: serveCommand passes `panelGraph: { root: repoRoot }` (src/run-task.ts ~32205), the daemon's own checkout.
    The reply route reads `readFeedbackEntry(deps.root, replyTo)` and refuses unless status is "grilling"
