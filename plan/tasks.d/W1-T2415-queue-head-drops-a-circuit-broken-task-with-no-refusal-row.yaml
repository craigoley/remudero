    SURFACE 5 IS NOT ZERO AND THAT IS CORRECT. Open-PR bodies read 2 for this id, both inside
    #3149 ("chore(plan): retire W1-T2413 with its criteria preserved"), which names W1-T2415 as
    the successor id held for this finding and carries `grep: W1-T2415` against W1-T2413's own
    shard. That is a FORWARD REFERENCE, not a competing filing: it declares no id, opens no
