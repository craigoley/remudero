  falsifier: |
    If `deriveQueueHead` is found to pass `onCircuitBreak` at the sha a build starts from, the
    premise is already closed and this task must be re-derived rather than built. The check is one
    unchained command against `src/lib/status-board.ts`, which reads 0 occurrences today alongside
