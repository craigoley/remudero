    SEPARATELY FALSIFYING: if a fresh three-form union read on the container shows
    `dispatch.circuit_broken` rows from the DRAIN lane, or resolving to more than the two task ids
    W1-T1279 and W1-T2323, the population Q1 sizes has changed and Q3's cost argument must be
    re-priced against it. The positive control for that re-run is `dispatch.skipped` at 2,078
    corpus-wide across the live and plain forms, with each form counted separately.

    AND IF the starvation census is ever observed carrying a non-zero `circuit_broken`, the reading
    in (14) is superseded: the slot would then be exercised, and whether the queue head still needs
    its own row must be argued against that surface rather than against its emptiness.
