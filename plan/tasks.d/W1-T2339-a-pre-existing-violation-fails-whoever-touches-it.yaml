  note: |
    WHAT MUST NOT CHANGE.

    NO GATE IS WEAKENED TO CLEAR A BACKLOG. The exit code for every input is unchanged, including the
    input this shard was filed from: a PR touching a base-failing task still fails. The 156 are a
    measurement, and this task proposes repairing none of them; a build that clears violations to
    make a number smaller has answered a different question.

    RULE 21 STAYS, AND ITS CARVE-OUT IS ALREADY OPEN. A merged task's CLAIMS are frozen. `criterionKey`
    (`src/lib/task-linter.ts`) normalises the CLAIM ALONE, so `criteriaAdded` does not fire on a
    proof-only repair — which is why a repair of W1-T65's own proofs is available as a separate PR
    today and needs nothing from this task. This shard neither widens that carve-out nor relies on it.

    NOTHING PACES, THROTTLES OR SLEEPS. The second lint pass is a synchronous read taken once per
    invocation, on the flag that already resolves a base ref; it adds no timer, no retry cadence and
    no wait.

    THE OPERATOR GATES EVERY MERGE, and this task changes nothing about that.

    THE FIGURES ARE QUERIES, NOT NUMBERS TO CARRY. 156, 144, 12, 234, 636, 170 and 856 are stamped
    with the sha they were read at and will move as unrelated work lands. Re-run the linter rather
    than quoting them; an acceptance criterion asserting any of them would be false within the week,
    which is why none does.

    RULE 19 BAND. `risk: high` is set UP FRONT for the SPAN of the declared `files:` — one module and
    its test — and carries no claim about blast radius, which is one command's reporting path.

    THE FORWARD REFERENCE IS DELIBERATE. The declared test file does not exist yet; it is named in
    `files:` so the pure-path proofs resolve under the forward-reference carve-out and read
    `not_yet_built` until the build lands. Every proof is pure-path `unit test:`, so this shard
    carries no `grep:` pattern at all.
