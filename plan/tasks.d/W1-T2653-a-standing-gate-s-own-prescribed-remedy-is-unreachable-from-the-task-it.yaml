      proof: "grep: remedyFiles in src/lib/ci-parity.ts"
  note: |
    risk:high with band_meaning: span — Rule 19's SPAN measure, DECLARED rather than exempted. The
    three declared files are one gate registry, its two consumers in the fix rung, and their
    falsifier suite; `subsystemsOf` scores them as separate concerns because the basenames differ.
    The invariant is single and UNSATISFIABLE PIECEWISE — a declaration nothing reads permits
    nothing, and a consumer with no declaration has nothing to permit — which is the atomic-coupling
    exit W1-T240/W1-T250/W1-T253 already established, not a sizing dodge.

    THE BLAST RADIUS IS THE REAL REASON FOR high, INDEPENDENT OF SPAN: this relaxes a guard that
    exists to stop a worker touching files it never declared. The scoped-to-the-repair criterion and
    the not-a-declared-remedy falsifier are load-bearing, not defensive extras — a version that
    granted the exemption globally would convert a deadlock into an unbounded scope hole.

    `files:` DERIVED FROM SOURCE, and DECLARED WIDE ENOUGH TO CONTAIN ITS OWN REMEDY — the very
    property this task exists to give every other task. If this PR's own growth crosses a bucket
    boundary, `scripts/source-size-baseline.json` becomes reachable to it only once this task ships;
    until then the operator lands that one line, and the PR body must be re-derived from
    `git diff --name-only origin/main...HEAD` afterwards (W1-T2538's warning applies to this PR too).
