  rationale: |
    RE-VERIFIED 2026-10-26 on origin/main 7b75a38f7. The ledger read was read-only, niced and bounded on
    the host: the console instance's /mnt/rmd/remudero-console-state/state/ledger.ndjson.

    THE INCIDENT. At 18:18:28.293Z the console daemon wrote `daemon.lane_failed` for CONSOLE-T127 with
    class `command_failed`, error `Command failed: git -C …/run-CONSOLE-T127-1793037108107 push origin
    HEAD`, consecutive 1, backoff_ms 1800000. The push's stderr was `remote: Repository not found.` /
    `fatal: repository 'https://github.com/craigoley/remudero-console.git/' not found` (W1-T10749's
    rationale holds the full run).

    THE DEFECT.
    - src/lib/drain.ts:1128 `CREDENTIAL_REFUSAL_RE` is `Bad credentials|HTTP 401|Authentication
      failed|could not read Username|Permission denied \(publickey\)`. It has no `Repository not found`.
    - `laneDeliveryFailure` (:1146-1152) therefore returns `command_failed`. The daemon parks the lane at
      daemon.ts:7565-7568 and never reaches the W1-T9680 credential arm (:7569-7581). That arm runs
      `fleetCredentialFor`, then parks `push_credential_missing` with the stderr and the probe's state
      when the probe reads alive, and stops the daemon when it does not.
    - GitHub answers `Repository not found` (HTTP 404) to an AUTHENTICATED identity that cannot see a
      private repository. W1-T10749 infers that is what CONSOLE-T127 hit. It is a credential's visibility,
      not the task's code, and every lane pushing to that repo with that grant would hit it next.
    - `Invalid username or token` is GitHub's https line for a bad token. GitHub's real output pairs it
      with `fatal: Authentication failed for …`, which the regex already matches. It is added for a
      caller that captures only the remote line.

    WHAT CHANGES, AND WHAT DOES NOT (stated, so the effect is not over-claimed).
    - The park BACKOFF does not change. daemon.ts:871 `laneDeliveryBackoffMs` depends only on the
      consecutive count, from a 30-minute floor (:862). The class is not an input.
    - What changes:
      - the lane is named `push_credential_missing` with its stderr;
      - the fleet probe runs, so a repository the fleet's credential really cannot see is caught at
        the first refusal instead of re-parking every 30 minutes as a task failure;
      - `rmd drain` treats it as fatal, which is W1-T3165's existing contract for a credential refusal
        (drain.ts:2716 has no probe).

    A HAZARD THE BARE REGEX CHANGE WOULD CREATE (the reason this task touches the probe).
    - daemon.ts:2061-2086 `receivePackCredentialProbe` mints a token through the same source as the push
      (the scoped socket mint while the socket listens, src/cli/commands/daemon.ts:1352-1353). It reads
      `info/refs?service=git-receive-pack` and maps 200 to alive, 401/403 to refused, and anything else,
      404 included, to unreadable (:2077-2079).
    - Any state but alive stops the daemon (:7578-7580).
    - W1-T10749's leading explanation is that GitHub's git frontend had not yet seen a JUST-MINTED
      single-repository grant. A probe that mints again and asks within milliseconds can hit the same
      race, read 404, and stop the whole daemon for a refusal one later mint would have cured.
    - So the probe re-asks a 404 ONCE with a freshly minted token before it judges.

    NOT COVERED ELSEWHERE.
    - W1-T10749 (merged filing, queued) retries the HARNESS push once on the same refusal text and
      classes a still-refused push `push_auth_refused` for the breaker. Its rationale lists "adding
      `Repository not found` to drain.ts CREDENTIAL_REFUSAL_RE" under NOT IN SCOPE, "reported
      separately", because it changes W1-T9680's lane-park behaviour for every caller. This task is that
      report.
    - W1-T9680 (merged) built the probe and the park. W1-T9654 (queued) names a credential-less WORKER
      push.
    - Swept plan/tasks.d for CREDENTIAL_REFUSAL_RE and `Repository not found`: only W1-T10749, W1-T9680
      and W1-T9654 name it. Read the 14 open core PRs' titles at 22:15Z: none touches drain.ts's
      classifier or the probe. No run- branch for this id exists.
  design: |
    1. drain.ts `CREDENTIAL_REFUSAL_RE` adds `Repository not found` and `Invalid username or token`. Keep
       the regex's existing anchoring and case rule. `laneDeliveryFailure` and `laneCredentialRefusal`
       read it unchanged.
    2. daemon.ts `receivePackCredentialProbe`: on an HTTP 404 it mints a token again and asks once more.
       - A 200 on the second ask is `alive`.
       - Any other second answer keeps today's mapping, so a persistent 404 stays `unreadable` and its
         detail names both answers.
       - 401, 403, 200 and a network failure on the FIRST ask are judged exactly as today, with no second
         ask.
       - The token value is never logged, as today.
    3. Nothing else. No backoff, park bound, harness push retry (W1-T10749), breaker class or probe
       timeout changes.
  prompt: |
    Write test/dispatch/a-push-refused-as-repository-not-found-is-a-credential-refusal.test.ts.
    `rmd test-place` computed that folder on 2026-10-26 for these imports. Keep this exact path, because
    the proofs grep it. Import through `#src/*`. Every new test title starts with `W1-T10769: `, exactly
    as in the acceptance proofs.
    - Classifier case: an Error whose message is `Command failed: git -C /w/run-X push origin HEAD`, with
      CONSOLE-T127's exact two-line stderr. Assert `laneDeliveryFailure` returns undefined and
      `laneCredentialRefusal` returns its first line and stderr. Do the same for a stderr carrying only
      `remote: Invalid username or token.`. A pre-push hook refusal and a non-fast-forward are still
      `command_failed`.
    - Daemon case: follow the W1-T9680 suite's pattern
      (test/one-worktrees-missing-push-credential-ends-its-lane-not-the-daemon.test.ts). Settle a lane
      rejected with that error, with a probe reading alive. Assert one `daemon.lane_failed` row with
      class `push_credential_missing`, `fleet_credential: alive` and the stderr, and that the daemon goes
      on.
    - Probe case: a local stub answering 404 then 200 reads `alive` after exactly two mints and two asks.
      404 then 404 reads `unreadable`, naming both. A single 403 is `refused` after one ask.
    Restore base code with `git show origin/main:<path>`, never stash, and watch every new case fail. Run
    the suite, `npm run -s lint-plan:fast` and `rmd preflight --fast` on the committed tree before the
    first push.
  acceptance:
    - claim: "a spawned push failing with Repository not found or Invalid username or token is a credential refusal, not a command_failed delivery failure, and the daemon parks it as push_credential_missing after the fleet probe reads alive"
      proof: 'grep: test("W1-T10769: a push refused as repository not found parks as a credential refusal" in test/dispatch/a-push-refused-as-repository-not-found-is-a-credential-refusal.test.ts'
    - claim: "the receive-pack probe re-asks an HTTP 404 once with a fresh mint and reads alive on a 200, while a repeated 404 stays unreadable and 401, 403 and 200 are judged on the first answer"
      proof: 'grep: test("W1-T10769: the credential probe asks a 404 again with a fresh token" in test/dispatch/a-push-refused-as-repository-not-found-is-a-credential-refusal.test.ts'
  falsifier: |
    At base `laneDeliveryFailure` returns `command_failed` for CONSOLE-T127's error, and the probe asks
    once, so both cases fail.
    - Drop `Repository not found` from the regex: the classifier and daemon halves fail.
    - Drop the second ask: the 404-then-200 probe case reads unreadable and fails.
    - Re-ask on every non-200: the single-403 case counts two asks and fails.
    GUARDS that held at base and must still hold:
    - W1-T9680's suite: a refused or unreadable probe still stops the daemon, and an alive probe parks;
    - W1-T3165 in test/daemon.test.ts: auth refusals and non-GitHub transient prose remain fatal;
    - W1-T5344: a hook refusal or a PR-create 422 still parks as command_failed or pr_open_refused.
    Remove each guard's production branch in turn, and its existing case must fail. Then restore it and
    require zero failures.
