- id: W1-T10769
  title: "A PUSH GITHUB REFUSES WITH `Repository not found` PARKS ITS LANE AS A CREDENTIAL REFUSAL, NOT A GENERIC COMMAND FAILURE — drain.ts CREDENTIAL_REFUSAL_RE has no `Repository not found`, so CONSOLE-T127's 18:17Z harness push refusal parked as `command_failed` and the fleet credential probe never ran; and the probe's own 404 must be re-asked once with a fresh mint before it stops the daemon"
