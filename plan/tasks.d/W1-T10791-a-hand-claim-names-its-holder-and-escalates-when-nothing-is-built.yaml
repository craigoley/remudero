  falsifier: |
    At base all four cases fail. The anchor has one line, no tick pass judges an unmerged hand claim, and
    `--status` is an unknown flag.
    - Keep `claimRenewalMessage` copying only the first line: the attribution is gone after one renewal, and the
      first case fails.
    - Count a renewal as progress: the W1-T10573 replay raises nothing, and the second case fails.
    - Judge with a fixed age: the lapse arm fires on a fresh claim, or misses a 4.7 h lapse, and the second case
      fails.
    - Escalate on every tick: the once-per-root assertion fails.
    - Treat an unreadable chain as "no progress": the third case fails.
    - Report another host's pid as dead: the fourth case fails.
