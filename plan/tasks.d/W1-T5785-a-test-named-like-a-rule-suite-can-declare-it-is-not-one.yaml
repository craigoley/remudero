- id: W1-T5785
  title: "A TEST NAMED LIKE A RULE SUITE CAN DECLARE IT IS NOT ONE — `listRuleSuites` reads any tracked test whose name holds census, ratchet or baseline as a CI rule suite, and W1-T5616's census then demands a PRECHECK_PARITY row or a slot in a frozen shrink-only baseline, so a plain unit test so named has no truthful verdict"
  repo: remudero
  depends_on: [W1-T5616]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high  # Rule 19: one concern — the rule-suite population is not decided by a file name alone
  band_meaning: span
  origin: "operator session 2026-10-05: W1-T5676 falsifier rename (#9209)"
  plan_refs: [W1-T5616, W1-T5676, W1-T2644, W1-T2525]
  files: [src/lib/ci-parity.ts, test/a-test-named-like-a-rule-suite-can-declare-it-is-not-one.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main f0452a82. `listRuleSuites` (src/lib/ci-parity.ts) selects
    `roster.has(path) || /(?:census|ratchet|baseline)/i.test(name)`; ci.yml's rule-check step runs
    that set and test/every-ci-census-is-asked-before-the-push.test.ts (W1-T5616) fails on a member
    in neither `PRECHECK_PARITY` nor scripts/census-precheck-parity-baseline.json, which may only
    shrink. W1-T5676's falsifier test/a-census-runaway-re-measure-re-times-its-reference.test.ts is
    a plain unit test of `runPreflightFast`: no parity row is true of it and the baseline cannot
    grow, so #9209 renamed the record's slug instead. Every future unit test about a census, a
    ratchet or a baseline meets the same wall (filers now avoid the words by convention).
  design: |
    A name-matched test whose header comment carries `@not-a-rule-suite: <reason>` is left out of
    `listRuleSuites` (it still runs in the coverage shards like any unit test); the marker without a
    reason throws naming the file, and a `CENSUS_POPULATION` member is listed whatever its header
    says. The marker is read from the file text the function already has the path of.
  acceptance:
    - claim: "a tracked fixture named x-census.test.ts with a reasoned not-a-rule-suite marker is not listed, the same file without the marker is listed, a marker with no reason throws naming the file, and a CENSUS_POPULATION member with the marker is still listed"
      proof: "unit test: test/a-test-named-like-a-rule-suite-can-declare-it-is-not-one.test.ts"
  falsifier: |
    Ignore the marker: the marked fixture is listed and the test fails.
