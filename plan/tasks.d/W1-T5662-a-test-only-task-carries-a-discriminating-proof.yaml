  rationale: |
    READ 2026-10-04 on origin/main 284015b9. No lint rule exists for this: `proofBaseDiscriminationViolations`
    (W1-T2835, src/lib/task-linter.ts) is warn-only, path-form only, and silent on forward references.
    `buildBaseProofDir` (src/run-task.ts, W1-T3098) copies the diff's added `test/**` files into the
    base checkout, so with no src change a test passes at both trees, grades `executed_stale`, and
    discriminates nothing. Hit twice this week: W1-T5527 (`files:` one census test, amended by #9103)
    and W1-T5622 (three test/ files, amended by #9120); both needed a `grep:` criterion added before
    the build could pass review. W1-T5418 (the generic proof-discrimination gardener) does not cover
    it.
  design: |
    A `proof-test-only-discrimination` check: fires when every non-`plan/` `files:` entry is under
    `test/` and every criterion that is not `kind: guard` and has no `satisfied_by` uses a
    `unit test:` proof (either form), with zero `grep:` proofs. Warn on the whole plan; block on a
    new or changed shard through the existing introduced-diagnostic promotion. Measure the hit count
    on main first and name it in the PR.
  acceptance:
    - claim: "lint-plan reports the check on W1-T5527's original filing shape and is silent on its amended shape with a grep: criterion"
      proof: "unit test: test/a-test-only-task-carries-a-discriminating-proof.test.ts"
  falsifier: |
