      proof: "unit test: test/pause-hold-is-attributable.test.ts"
    - claim: "a refspec assembled indirectly still reaches the remote, and that limitation is asserted rather than assumed"
      proof: "unit test: test/pause-hold-is-attributable.test.ts"
    - claim: "the anchor minted for a hold carries process, host and timestamp fields a reader can recover"
      proof: "unit test: test/pause-hold-is-attributable.test.ts"
    - claim: "a held read renders detail naming the recorded setter instead of an anonymous other host"
      proof: "unit test: test/pause-hold-is-attributable.test.ts"
    - claim: "an anchor whose payload cannot be recovered still renders a held detail rather than degrading to absent"
      proof: "unit test: test/pause-hold-is-attributable.test.ts"
    - claim: "an unreachable read stays held and no code path clears the hold on elapsed time alone"
      proof: "unit test: test/pause-hold-is-attributable.test.ts"
