        The first head walked takes the slot, and every other qualifying head that pass stands down with
        "this pass's one branch refresh is spent or unwired — no fix dispatched".
      - The same reason text covers two different causes: the slot was taken by another PR, or `deps.updateBranch`
        is absent. Nothing records which PR took the slot.
    READ on origin/main, src/run-task.ts: both `runSweepLightPass` calls in the light hook pass `updateBranch: undefined`.
    W1-T528 did this so a per-PR fan-out cannot press update-branch N times. So no light pass can refresh a held head,
    and every light pass also reports "spent or unwired".

    MEASURED 2026-10-14 from the core ledger union (extracts in the operator notes: w1-t9533-rows.ndjson,
    w1-t9533-refresh-rows.ndjson):
      - #11776 and #11777 each have 13 `sweep.disposed` rows with that reason, from 20:20:03Z to 21:56:22Z:
        - one from the base-reproduction arm at 20:20Z;
        - twelve from the base-red arm, 20:28-21:56Z: "base red: coverage-shard (5/8) was held while main was red;
          main is green, but this pass's one branch refresh is spent or unwired".
      - In the same window `sweep:refresh` update-branch requests went to #11705 (20:37Z), #11783 (20:40Z),
        #11710 (21:04Z) and #11774 (21:37Z). That is one per full pass, while both held heads waited.
      - #11777 got onto main at 22:57Z through the general `distance-unknown` rung, not the base-red arm.
    A slot of one per pass is a fixed cap, which the operator's standing ruling forbids. Main's fix had already
    landed, so each pass the held heads waited bought nothing.

    WHY NOT "REFRESH THEM ALL". Doctrine `never-fan-out-update-branch` (CLAUDE.md, CI and merging): protection is not
    strict, each refresh re-runs about 16 min of CI and voids the review. A main fix that frees a whole board must
    not press update-branch on every held head in the same second. Admission must be paced by what CI can take.

