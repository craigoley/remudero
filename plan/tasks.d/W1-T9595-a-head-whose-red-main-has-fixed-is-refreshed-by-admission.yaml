      - main is green after a recorded base red;
      - three heads held on it with stood-down rows at t1 < t2 < t3, walked in the order t3, t1, t2;
      - an `assessRefresh` that clears all three;
      - an `updateBranch` stub that records calls;
      - a snapshot in which every earlier admission's required CI has started.
    At origin/main the first walked head (t3) takes `baseRedRefreshPr`. t1 and t2 stand down "spent or unwired", so
    the first test fails on both the count and the order. Make the snapshot show t1's refresh with no started check:
    the second test expects t2 held with a reason naming t1, and at base no such reason exists. Run the light-pass
    builder with the same board: at base `updateBranch` is never called, so the third test fails. Restore the
    single slot after the change and the first and second tests go red again.
