  design: |
    1. ADMISSION REPLACES THE SLOT. Remove `baseRedRefreshPr`.
       - A head qualifies when it would take the slot today:
         - `decideBaseRed` returns `refresh` with main green, or the base-reproduction or stalled-stage arm reads
           clear or fixed-on-main; and
         - `assessRefresh` clears it.
       - A qualifying head becomes a candidate in one per-pass `refreshAdmission`, never a competitor for a slot.
       - Candidates are ordered OLDEST-HELD FIRST. The held-since time is the head's earliest
         `sweep.base_red.stood_down` row, or its `blocker_since` when it has no such row. It is read once per pass
         from the fold the pass already builds (`baseRedHistoryFromLedger`). Walk order never decides who goes
         first, so a PR walked early cannot outrank an older hold.
       - An `assessRefresh` refusal is never admitted. It keeps today's refusal reason, and the head's red is its own.
    2. PACED BY AN OBSERVED SIGNAL, NEVER A CONSTANT. How many candidates a pass admits comes from CI uptake of
       this admission's earlier refreshes:
       - A head this admission refreshed, whose new head shows no started required check in this pass's snapshot,
         is still waiting for a runner. While any such head exists, no further candidate is admitted.
       - Once every earlier admission's CI has started, the next oldest-held candidate is admitted.
       - So a board freed by one main fix is fed to CI as fast as runners take it. It is neither pressed all at once
         nor capped at one per pass.
       - Write the reading on the admission row: admitted PRs, waiting PRs, the PR(s) whose CI has not started,
         and the oldest held-since.
       - Do not add a fixed maximum, minimum or per-pass N. A test drives two signal readings and shows the
         admitted count follows them.
       - An unreadable signal (the snapshot carries no check facts for an earlier admission) admits the oldest-held
         candidate only, and the row says `signal: unreadable`. That is today's behaviour, never worse.
    3. TWO REASONS, NOT ONE.
       - Split "this pass's one branch refresh is spent or unwired" into two texts:
         - unwired: `updateBranch` is absent on this surface. It names the surface (light pass, dry run).
         - waiting for admission: it names the PR(s) ahead of this head and the signal holding it, e.g.
           "waiting for refresh admission behind #N (its CI has not started)".
       - The `sweep.disposed` stand-down reason names the PR that was admitted ahead.
       - A `sweep.base_red.refresh_admission` row per pass records the full admission: admitted, waiting and
         refused heads, each with its arm.
       - Add that step to the rotation-retained steps only if the ledger module requires it for a per-pass row.
         Never add it without measuring that need.
    4. THE LIGHT PASS REFRESHES ONLY THROUGH THE SAME ADMISSION.
       - run-task.ts keeps `updateBranch: undefined` on the per-PR `runSweepLightPass` fan-out (W1-T528's
         at-most-once contract).
       - It gains ONE admission call over the light pass's whole snapshot, before the fan-out, as
         `runLightPassReadyRefresh` does (W1-T7214).
       - That call reads the same ledger fold, so a head refreshed by either pass is never admitted twice
         (`baseRedHistory.refreshed`).
       - An in-flight guard like `lightPassReadyRefreshInFlight` stops overlapping light passes from both admitting.
    5. OUT OF SCOPE:
       - the general distance and ready-overlap rungs;
       - the fix lane's own pre-strike refresh (`fix.base_refreshed`);
       - `tryPlanRepair`'s refresh;
       - W1-T7735's value test.
