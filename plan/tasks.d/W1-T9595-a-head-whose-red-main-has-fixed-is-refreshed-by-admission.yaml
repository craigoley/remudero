    READ on origin/main (f87f7907c), src/lib/sweep.ts:
      - `let baseRedRefreshPr: number | undefined` is declared once per `runSweep` pass. Three arms test it and set it:
        - the W1-T4351 base-red arm (`decideBaseRed` returns `refresh` with main green);
        - the W1-T6405 / W1-T8396 base-reproduction arm (reproduction clear, or the head's tests already fixed on main);
