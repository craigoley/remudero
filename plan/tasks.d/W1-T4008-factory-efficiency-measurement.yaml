  band_meaning: blast-radius
  origin: "research:warp-software-factory-2026-09-22"
  plan_refs: ["§Self-improvement", "W1-T3852", "W1-T3882", "W1-T3899", "W1-T4007"]
  files:
    - src/lib/factory-metrics.ts
    - src/lib/analytics-route.ts
