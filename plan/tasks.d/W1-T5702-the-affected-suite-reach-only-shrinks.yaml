  plan_refs: [W1-T5701, W1-T4404, W1-T2895, W1-T5705]
  files: [src/lib/affected-suites.ts, scripts/affected-reach-baseline.json, test/the-affected-suite-reach-ratchet.test.ts, "package.json", "scripts/census-precheck.mjs", "src/lib/ci-parity.ts"]
  status: merged
