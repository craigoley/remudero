- id: W1-T7743
  title: "THE DAEMON RELOADS ITS PLAN OFF THE LOOP — `loadPlanAtRef`'s default git runner is `execFileSync`, and the tick's plan reloader and the reviewer's at-head criteria read both call it on the loop: 62 `sync_spawn_top` entries on 2026-10-10, worst 10.7 s, plus a synchronous `git fetch` in the dedicated-target reloader"
  repo: remudero
  depends_on: [W1-T7742]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — how the daemon re-reads a committed plan; it gates every tick's plan binding
  band_meaning: span
  origin: "operator session 2026-10-10: core daemon loop-stall investigation (daemon.loop_lag 07:50-09:57Z), operator asked for flow improvements"
