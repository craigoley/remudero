  rationale: |
    Census integration observed at implementation 6ec49c3dfe79: real preflight reports the
    hardened Git population falling from 63 to 57 raw sites, two former synchronous-spawn
    rows falling to zero, and the old private helper declarations moving to shared steps.
    Include all three owning census tests so their exact counts tighten and their worker-tree
    leaf checks cover the shared implementations and their sync/async bindings. Preserve
    existing population scans, positive controls, mutation guards and assertions; no raised
    baseline, new exception, ignored path or exclusion. This amendment changes scope only;
    product acceptance, the behavioral test proof, budget and asynchronous ordering stay intact.
    The existing fetch-before-criteria guard must require the awaited call spelling; retain all
    fixture inputs and catch/fail-closed assertions while the adapter becomes asynchronous.
    W1-T11341 (#16852) moved the review base-proof git and the boot tracker off the loop. The
    2026-11-06 core CPU profile still shows three review-worktree paths running git through
    execFileSync on the daemon's main thread, inside loop holds:
    - materializeReviewWorktree (src/run-task.ts ~:11399, wired through realReviewWorktree in
      src/lib/composition-root.ts ~:40, whose exec defaults to execFileSync), called by
      reviewCommand: 8.9 s in window 3;
    - temporaryIndexTree (src/run-task.ts ~:30537) through hostWorktreeGit: 7.7 s in window 1;
    - sweepStrandedReviewWorktrees (src/lib/review-worktree-reclaim.ts ~:115) through
      worktreeRemove / hostWorktreeGit: 7.2 s in window 1.
    hostWorktreeGitAsync already exists (W1-T11341 used it).
    The remaining approved adapter is src/lib/sweep.ts: plan-round materialization is consumed
    synchronously, and owner-recovery results are stringified without awaiting them. Async Git
    must not turn an unresolved Promise into a worktree path or a ledgered recovery reference.
    The review-reuse consumer in src/cli/commands/sweep.ts:347 also reads materialization
    immediately and tears down its checkout synchronously at :438-441. The shared async binding
    requires that final adapter to await readiness and teardown, with the hold retained until
    removal settles. Its existing best-effort failure handling still applies.
    The tracked direct-Root importer count at 94777e56d is 1010 against a 1010 ceiling; the new
    regression alone would make it 1011. The existing fleet-store test imports only the RunResult
    type through Root, which re-exports that exact type from src/lib/run-result.ts. Point that
    type-only import at its owning module; preserve every existing test and assertion. With the
    new regression still importing Root, the prospective direct count remains 1010. This is not
    a full reach verdict: the complete unchanged ratchet must still pass on the built tree.
    W1-T147 shares src/lib/daemon.ts and src/run-task.ts for a separate operator-run overnight
    chaos drill. This task changes only review-worktree Git and its awaited ordering; it creates
    no fault-injection harness and does not run or activate that human-only drill.
  design: |
    Decide with evidence; record it in the PR body under "## Decisions".
    - Each of the three paths awaits hostWorktreeGitAsync (or the async exec realReviewWorktree can
      be given) instead of the sync form, when reached from the daemon's review lane or sweep.
    - CLI one-shot callers may keep the sync form, if splitting the path is cleaner than making
      the CLI async.
    - Preserve every existing ordering guarantee. A worktree is fully materialized before review
      reads it, and a removal finishes before its path is reused. Prove each guarantee with a test.
    - No new timeouts or constants; reuse the async path's existing bounds.
    Operator-approved source-scope amendment, 2026-11-06: include the three entrypoint adapters.
    At cfa3d855c6, src/cli/commands/daemon.ts:1925 wires the synchronous sweep and
    src/lib/daemon.ts:2762 invokes it without awaiting completion. The review adapter at
    src/cli/commands/review.ts:2190 consumes materialization synchronously; its teardown at :1794
    removes the tree before releasing the hold without awaiting removal. Thread the async result
    through these adapters and retain the existing catch, ownership and completion ordering.
    Operator-approved remaining adapter extension, 2026-11-06: src/lib/sweep.ts awaits plan-round
    materialization before using its path and awaits each recovery callback before interpreting
    or ledgering its result. Preserve the same owner checks, failure handling and cleanup order.
    Operator-approved final command extension, 2026-11-06: src/cli/commands/sweep.ts awaits the
    review-reuse checkout before consuming it and awaits cleanup before releasing its hold or
    resuming its caller. Retain the synchronous one-shot exports and existing disposal semantics.
    Operator-approved regression-scope extension, 2026-11-06: change only the RunResult type
    import in test/daemon/a-fleet-store-on-an-exhausted-account-is-named-and-escalated.test.ts to
    #src/lib/run-result.js. Keep the Root type-export contract checked by the new daemon fixture.
    Change no existing test inputs, assertions, timeouts or skips and no census threshold or
    exclusion. Both original acceptance claims and criterion markers remain unchanged.
