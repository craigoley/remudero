  rationale: |
    W1-T11341 (#16852) moved the review base-proof git and the boot tracker off the loop. The
    2026-11-06 core CPU profile still shows three review-worktree paths running git through
    execFileSync on the daemon's main thread, inside loop holds:
    - materializeReviewWorktree (src/run-task.ts ~:11399, wired through realReviewWorktree in
      src/lib/composition-root.ts ~:40, whose exec defaults to execFileSync), called by
      reviewCommand: 8.9 s in window 3;
    - temporaryIndexTree (src/run-task.ts ~:30537) through hostWorktreeGit: 7.7 s in window 1;
    - sweepStrandedReviewWorktrees (src/lib/review-worktree-reclaim.ts ~:115) through
      worktreeRemove / hostWorktreeGit: 7.2 s in window 1.
    hostWorktreeGitAsync already exists (W1-T11341 used it).
    W1-T147 shares src/lib/daemon.ts and src/run-task.ts for a separate operator-run overnight
    chaos drill. This task changes only review-worktree Git and its awaited ordering; it creates
    no fault-injection harness and does not run or activate that human-only drill.
  design: |
    Decide with evidence; record it in the PR body under "## Decisions".
    - Each of the three paths awaits hostWorktreeGitAsync (or the async exec realReviewWorktree can
      be given) instead of the sync form, when reached from the daemon's review lane or sweep.
    - CLI one-shot callers may keep the sync form, if splitting the path is cleaner than making
      the CLI async.
    - Preserve every existing ordering guarantee. A worktree is fully materialized before review
      reads it, and a removal finishes before its path is reused. Prove each guarantee with a test.
    - No new timeouts or constants; reuse the async path's existing bounds.
    Operator-approved source-scope amendment, 2026-11-06: include the three entrypoint adapters.
    At cfa3d855c6, src/cli/commands/daemon.ts:1925 wires the synchronous sweep and
    src/lib/daemon.ts:2762 invokes it without awaiting completion. The review adapter at
    src/cli/commands/review.ts:2190 consumes materialization synchronously; its teardown at :1794
    removes the tree before releasing the hold without awaiting removal. Thread the async result
    through these adapters and retain the existing catch, ownership and completion ordering.
  acceptance:
    - claim: "On the daemon path, materializeReviewWorktree, temporaryIndexTree and sweepStrandedReviewWorktrees call no synchronous git, and a timer scheduled before each one fires while its git is still running"
      proof: "grep: W1-T11459 criterion 1 in test/daemon/the-daemon-review-worktree-git-runs-off-the-loop.test.ts"
    - claim: "A review still reads a fully materialized worktree, and a stranded-worktree removal completes before the path is reused"
      proof: "grep: W1-T11459 criterion 2 in test/daemon/the-daemon-review-worktree-git-runs-off-the-loop.test.ts"
  note: |
    Sol-level: three call chains, each with ordering assumptions. Copy W1-T11341's test technique
    (a slow fake git, plus a timer that must fire during it). The builder names each criterion test
    with the marker "W1-T11459 criterion N".
  falsifier: |
    Restore any one path to its sync exec. Criterion 1 must then fail for that path, because the timer
    cannot fire while the sync git holds the loop.
