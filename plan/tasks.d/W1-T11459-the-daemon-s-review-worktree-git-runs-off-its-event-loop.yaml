  falsifier: |
    Restore any one path to its sync exec. Criterion 1 must then fail for that path, because the timer
    cannot fire while the sync git holds the loop.
    Remove the sweep adapter's materialization or recovery await: criterion 2 must then fail on
    early worktree use or an unresolved recovery reference, then restore green. Remove the command
    adapter's readiness or teardown await: review reuse must observe an unfinished checkout or
