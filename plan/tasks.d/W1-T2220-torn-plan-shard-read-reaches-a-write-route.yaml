  note: |
    THE HANDED SEVERITY CLAIM WAS TESTED AND FAILED, AND THE FAILURE IS THE MORE USEFUL RESULT.
    Rationale (5): `depends_on` is emptied in ZERO of 280 truncated parses across all 56 shards that
    declare one, because it sits ahead of the long prose blocks. The task is filed anyway because
    the surface is real and the fields that ARE destroyed — `acceptance` in 158 of 299, `files` in
    144 — are the ones a human reads. Filing it under the original mechanism would have made the
    first builder chase a path that does not exist.

    `risk: high` IS RULE 19'S SPAN, NOT A SEVERITY CLAIM. `files:` names two stems and the likely
    diff is small, but the band is honest for a different reason: the wrong remedy here HIDES REAL
    CORRUPTION, which is the failure design (ii) exists to forbid, and remedy (c) changes which
    commit the plan comes from — a semantic change to every one of the five routes.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/main-plan-load-guard.test.ts`, which is declared in `files:` and already
