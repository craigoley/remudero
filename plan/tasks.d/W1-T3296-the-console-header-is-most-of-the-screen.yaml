    - claim: "the first actionable row is reachable without scrolling at laptop and tablet widths"
      proof: "unit test: apps/dashboard/src/App.test.tsx"

  falsifier: |
    CLOSE THIS WITHOUT IMPLEMENTATION if W1-T3177's first screen already lands the status/overview
    split — this is a follow-on screen, not a competing one, and two tasks restructuring the same
    region would collide.

    RE-DESIGN rather than build if the measured budget cannot be met while keeping the anomaly
    banner and the write-state badge above the fold. Those two are the reason the strip is up there
    at all; a budget met by dropping them has optimised the number and lost the alarm.

    DO NOT satisfy this by collapsing the header behind a toggle. A disclosure that starts closed
    hides the anomaly banner in exactly the case it exists for, and one that starts open changes
    nothing measured above.
    DO NOT satisfy it by shrinking type. The live shell already renders 67 elements at 11px
    (W1-T3184); reclaiming pixels from legibility is the trade this repo has already been paying.
    DO NOT restructure `renderShellHtml` to land this sooner — see the note: that is information
    architecture in code the same workstream deletes, and W1-T3177 (iv) forbids touching it.
