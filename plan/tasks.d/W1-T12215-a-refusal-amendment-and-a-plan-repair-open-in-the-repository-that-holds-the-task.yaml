      proof: "grep: findTaskInCatalogs( in src/lib/sweep.ts"
  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 6 merges were refusal amendments.
    - `draftRefusalAmendment` in src/lib/refusal-amendment.ts drafts the amendment. The sweep gives it `readShard`, `probeExisting` and `openAmendmentPr` in src/lib/sweep.ts, all bound to the public checkout and the public repository.
    - The plan repair opens its pull request with `createPlanPrRest` in the same file.
    - Both paths change a task file that exists. So they do not follow the switch. They follow the task file.
    - This is one of five writer tasks. Each one waits for the readers of both catalogs.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. This task reads no kind: it applies while the file names a repository, also after `task` is removed from the kinds.
  design: |
    Before each of the two paths, call `findTaskInCatalogs` for the task id. Bind the read of the task file, the probe, the worktree and the create call to the checkout and the repository of the catalog that holds the task.
    The shared landing for task files, from the interim task of this filing, takes the repository as an argument.
    An amendment in the ops repository edits a task file there. The gate of the ops repository must accept that edit. That work is in the ops repository and is not filed here.
    NOT IN SCOPE: the cause of a refusal, and the text of an amendment.
  falsifier: |
    Open an amendment for an ops task in the public repository and criterion 1 must fail. Move the amendment of a public task to the destination and criterion 3 must fail. Open an amendment when the lookup is unreadable and criterion 5 must fail. Restore and require all seven to pass.
