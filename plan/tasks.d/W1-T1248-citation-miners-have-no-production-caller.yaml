      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "the miners are fed the archive-and-live union rather than the live ledger file alone"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "an entry cited since its last stamp has its cited date advanced from the frozen value"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "an entry with no citation evidence keeps the stamp it already had rather than being cleared"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "the injected budget stays a hard cap and the entries it drops are still logged"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "a superseded entry is still filtered before ranking and no stamp can reintroduce it"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
    - claim: "stamping writes only the cited field and neither adds, promotes nor retires an entry"
      proof: "unit test: test/citation-stamp-wiring.test.ts"
