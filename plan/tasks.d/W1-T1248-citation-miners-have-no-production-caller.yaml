  note: |
    **`risk: high` IS SET UP FRONT** — Rule 19 SPAN across `src/` and `test/`, and the blast radius
    is real: the wiring lands in `retroCommand`, which every retro runs, and a stamp written wrong
    reorders what 38 entries' worth of context injection selects.

    **THE TWO-STORE FINDING IS CARRIED HERE BECAUSE IT EXPLAINS THE SILENCE, NOT BECAUSE THIS TASK
    FIXES IT.** The retro's stagnation counter reads `LEARNINGS.md` (79 bullets); the injector reads
    `learnings/` (38 entries). A meter that never ticked was invisible because the thing being
    watched was a different file. **MERGING THE TWO STORES IS EXPLICITLY NOT PROPOSED** — that is a
    separate operator ruling, and this shard neither makes it nor depends on it.

    **DECLARED OVERLAP.** `src/run-task.ts` is a heavily contended path; `overlappingPaths` will
    serialise this against any other task declaring it. Stated so the ordering is a known cost
    rather than a dispatch-time surprise.

