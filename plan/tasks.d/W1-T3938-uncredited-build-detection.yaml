- id: W1-T3938
  title: "A REPORT-ONLY UNCREDITED-BUILD WARNING MUST NOT OUTLIVE DISPATCH ELIGIBILITY — suppress stale NEEDS-ME noise for blocked tasks while preserving live-build detection"
  repo: remudero
  depends_on: [W1-T3934]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 15.00
  risk: low
  band_meaning: blast-radius
  origin: "operator-follow-up#needs-me-stale-blocked-2026-09-21"
  plan_refs: [W1-T2392, W1-T3934]
  files: [plan/tasks.d/W1-T3938-uncredited-build-detection.yaml]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on origin/main dfdec4eb: the live status board still reports uncredited-build
    rows for blocked or explicitly retired plan records, including W1-T214, W1-T2327,
    W1-T2631, W1-T323, W1-T403, W1-T471, W1-T489 and W1-T965. Their merged PRs do touch
    declared source paths, so W1-T3934 correctly classifies the path overlap; the remaining
    defect is that the report is emitted even though drain.ts's isDispatchEligible rejects
    every task whose plan status is `blocked`. The rendered warning then says the task stays
    dispatchable until a credit surface appears, which is false for this population. This is
    routing noise, not a request for a new operator decision.

    The warning is explicitly report-only and must not become a gate. Suppressing it for a
    task that the existing dispatch predicate unconditionally refuses removes stale NEEDS-ME
    noise without hiding a live queued or released task. The plan's `status` field is generally
    decorative, but `blocked` is the existing semantic refusal used by isDispatchEligible and
    currentPlanIneligibilityReason; it covers both ordinary dependency blocks and retirement
    records without inventing a new terminal state.

    reservation hand-off: run-W1-T3878-1789934131000 -> run-W1-T3938-1789977307000
  design: |
    (i) Keep the W1-T3934 declared-scope predicate, source-file discriminator, and fail-open
    behavior unchanged for tasks that can still enter the dispatch path.

    (ii) In the production derive path, do not attach an uncredited-build warning when the task
    has `status: blocked`. Do not credit, close, retire, or mutate the task, and do not change
    any dispatch or PR disposition. The warning remains an advisory diagnostic for live tasks.

    (iii) Add controls proving that a blocked task with an overlapping uncredited source build
    is quiet, while an otherwise identical queued task still warns. Keep the existing W1-T1041
    scope regression and report-only controls intact.

    acceptance anchor: W1-T3938 blocked task with an overlapping uncredited build is quiet
    acceptance anchor: W1-T3938 queued task with an overlapping uncredited build still warns
    acceptance anchor: W1-T3938 blocked-warning suppression moves no disposition
  acceptance:
    - claim: "the plan records the blocked-task suppression regression"
      proof: "grep: W1-T3938 blocked task with an overlapping uncredited build is quiet in plan/tasks.d/W1-T3938-uncredited-build-detection.yaml"
    - claim: "the plan records the live queued-task control"
      proof: "grep: W1-T3938 queued task with an overlapping uncredited build still warns in plan/tasks.d/W1-T3938-uncredited-build-detection.yaml"
    - claim: "the plan preserves the report-only no-disposition contract"
      proof: "grep: W1-T3938 blocked-warning suppression moves no disposition in plan/tasks.d/W1-T3938-uncredited-build-detection.yaml"
  falsifier: |
    Remove the blocked-status guard and the blocked-task regression must fail. Change the guard
    to suppress queued tasks or all tasks with a declared scope and the queued/live control or
    W1-T3934 controls must fail. Any implementation that changes dispatch, credit, PR state,
    retirement, or merge behavior is out of scope.
