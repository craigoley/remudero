- id: W1-T2288
  title: "THE RETRO's TRIGGER ITERATES RUNS IN A REPOSITORY WHERE MOST MERGES ARE NOT RUNS — `retroTriggerCheck` builds its merge count from `shippedSince(gatherRuns(parseLedger(readFileSync(ledgerPathFor(config)))))`, so the iteration domain is runs and the corpus is the LIVE ledger file with no rotation union; a merge with no run is unreachable by every credit path, and `ownBranchOf` rejects any head that is not `run-<id>-<epoch>`, which is every plan filing"
