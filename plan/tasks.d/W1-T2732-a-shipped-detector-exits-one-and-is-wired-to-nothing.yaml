      proof: "unit test: test/a-shipped-detector-exits-one-and-is-wired-to-nothing.test.ts"
  falsifier: |
    Close without implementation if the check is already invoked by a workflow or an npm script on
    origin/main, or if it exits 0 on a fresh checkout. A change that clears the 3 + 16
    sites WITHOUT wiring the check does not falsify this task: an uncleared tree and an unread
    detector are the same defect one step apart.
