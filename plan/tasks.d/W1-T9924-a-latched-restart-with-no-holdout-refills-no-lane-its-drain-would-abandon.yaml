  design: |
    Operator rulings: no hard thresholds (no fixed wait, age or count), lean into automation.
    1. ONE PREDICATE, W1-T9808's. `restartAdmission` gains the kind "dispatch-refill". Its measured length is the
       candidate's own class median settled span (`classMedianSpans`, W1-T9069's measure, `run.start` to `verdict`).
       The refill admits only while the time left to the drain's deadline (`restartWindow.deadlineMs`) exceeds that
       length. While a holdout still waits, W1-T9069's R-based check is kept as well, and the tighter of the two
       budgets decides. With no history for the class it admits as today, and the row says `no_history`.
    2. CHILD MODE DECIDES PER RUN, NOT PER POOL. A refill skips the predicate only when the run-child policy will run
       it as an adoptable child. That decision lives in src/run-task.ts (W1-T9085's `runChildModeFor` over
       `childModeTracker`), so a new daemon dep, `refillRunsAsChild(task)`, is wired there and read at the refill;
       unwired, it reads false. Then the restart does not wait on it. A refill that will run in-process is judged by (1), whatever `childMode` says.
       The `else next = candidates[0]` branch no longer admits under a latch with no holdout.
    3. A HELD REFILL PARKS THE LANE on the existing latch-park path, so a latch state change wakes it, never the tick.
       It writes `daemon.admission_held` with surface "dispatch-refill", kind, task, class, time left, measured
       length, samples and the child decision, once per lane and state. `daemon.restart_latch_cost` gains
       `refills_held_after_latch`.
    4. Work already admitted is waited on as today. W1-T5721's protection of live fix workers, W1-T9069's holdout
       comparison and the drain's bound are unchanged.
    5. Tests (new file, test titles verbatim as in the proofs below; drive runDaemon with an injected runOne,
       `adoptRunChildren`, restart-history lines and a fake clock, as W1-T9069's suite does):
       - in child mode, a latch with no holdout, the drain waiting on in-process work, and a refill candidate whose
         class median exceeds the time left: no refill starts and a `daemon.admission_held` row names it. At
         origin/main the lane refills (`dispatch.lane_refilled` with `restart_pending: true`);
       - the same refill, when its class median fits the time left, starts (positive control);
       - a refill the run-child policy will run as an adoptable child starts under the latch;
       - with no latch, or no class history, refill is unchanged.
