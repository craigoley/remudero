    READ at origin/main 07a425844, src/lib/daemon.ts (runDaemon's lane pool):
      - `chooseRefill`'s `decide` runs W1-T9069's check only under
        `inFlightFreshness && restartStillWaitingOnHoldout() && !refillClosed`. That check takes only a candidate
        whose `classMedianSpans` span ends before R, and refuses every candidate on `latchSelfScoped()`. With no
        holdout left it falls to `else next = candidates[0]`.
      - `conclude` closes such a refill with "stale code" only when `!childMode`. `actOnDispatchFreshness` closes
        refill (`refillClosed ??= "stale code"`) only when `!childMode` too.
      - `childMode` is true whenever `deps.adoptRunChildren` is wired, and core wires it. Yet each of these runs
        executed in-process (its yield row carries a run id and phase recon). `restartAtWorkerBoundary` therefore
        asked it to yield at once, because with no holdout R is now.
      - So, in child mode with no holdout left and the restart waiting on in-process work (W1-T8172's drain), every
        freed lane refills unconditionally, and the refill is abandoned at its first boundary.
