- id: W1-T2853
  title: "REVIEW CONCURRENCY IS A STATIC NUMBER BLIND TO THE HOST AND PROVIDER — `reviewLanes: 2` cannot use a quiet four-core host to drain a backlog faster and cannot shed admissions when memory PSI, total worker occupancy or subscription headroom says the same two lanes are already too many"
  repo: remudero
  depends_on: []
