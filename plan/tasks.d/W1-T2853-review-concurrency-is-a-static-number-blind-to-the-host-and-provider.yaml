  falsifier: |
    Close without implementation if current source already derives both full- and light-pass review
    width from queue depth, shared build-plus-review occupancy, host memory/PSI and current provider
    headroom, or if a production trace shows `reviewLanes` changing automatically with those inputs.
    Current source computes `Math.max(1, policy.reviewLanes)` at both paths and creates the worker
    pool from that fixed number; the Azure ledger contains no adaptive review-width decision row.
