    - claim: "a rejection carrying its own error code reads as a request failure naming that code, even when the signal has already aborted"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
    - claim: "a fixture that rejects with an uninformative error after its signal fires still reads as a timeout, so the existing seam keeps working"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
    - claim: "the seven reasons outside the catch arm are byte-identical to before, each asserted individually"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
    - claim: "every reason the source can log is declared recordable in the table, and every reason declared unrecordable has no logging call site"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
    - claim: "each prefix-form reason is declared as a prefix, so a sweep matching it as a literal is a declared error rather than a silent zero"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
    - claim: "a failed refresh leaves the environment token exactly as it found it on every arm of the new decision"
      proof: "unit test: test/token-refresh-reason-provenance.test.ts"
