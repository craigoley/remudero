  note: |
    Q3 — WHAT MUST NOT CHANGE, AND THE BUILD IS WRONG IF ANY OF IT MOVES.

    THE EXCHANGE STAYS FAIL-SAFE. A failed refresh leaves the previous token completely untouched;
    the environment seam is written only on the success path, after both body checks. Every new arm
    of the decision must preserve that, and it is asserted per arm rather than once, because a
    decision that grew a branch is exactly where a single end-to-end assertion stops covering.

    NO PACING AND NO SLEEP, AND `EXCHANGE_TIMEOUT_MS` IS UNCHANGED AT 20s. This task changes how a
    caught error is NAMED, never whether or when the exchange is abandoned. The timer stays armed
    before the fetch is issued and stays cleared in `finally`; the rearm on failure stays
    unconditional, so a failed mint still reschedules on the margin rather than going silent.

    THIS IS NOT THE BOARD-WALK FIX. W1-T2318 owns the 19.8-second synchronous enumeration that
    caused the observed population, and CLOSING W1-T2318 MUST NOT BE READ AS CLOSING THIS. The two
    are independent in both directions: fixing the walk removes today's dominant cause and leaves
    the label just as unfalsifiable for the next stall, and fixing the label does not make the walk
    any faster. A build that closes this by making the loop faster has answered the other task.

    NEITHER CITED TASK IS RE-FILED. W1-T2318 and W1-T2311 are named in `plan_refs` and their
    findings are cited, not restated as work: the board walk is W1-T2318's, and the boot-PAT
    identity question is W1-T2311's.

    THE COUNT IS A QUERY, NOT A NUMBER TO CARRY. The 145/142 split above is stamped with its window
    and its per-form file counts precisely so a later reader re-runs it rather than quoting it; the
    corpus grows, and the rotation-only figure will keep drifting from the union figure for as long
    as the live file is excluded from the glob.

    THE FORWARD REFERENCE IS DELIBERATE. `test/token-refresh-reason-provenance.test.ts` does not
    exist yet; it is declared in `files:` so the pure-path proofs resolve under the W1-T456
    forward-reference carve-out and read `not_yet_built` until the build lands.

    RULE 19 BAND. `risk: high` is set for the SPAN of the declared `files:` — one module and its
    test — not for blast radius. The change is confined to one catch arm and one declaration table
    in a module whose consumers do not read the value it produces.
