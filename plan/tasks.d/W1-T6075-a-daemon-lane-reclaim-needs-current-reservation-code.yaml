  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-06 at origin/main a76291b3 (after #9653 b94226b6).
    THE GATE IS OPT-IN. In src/lib/task-id-reservation.ts, gitRemoteRefReserver's reclaim reads
    `const currency = deps.policyCurrency?.(); if (currency && currency.status !== "current") ... return "taken";`,
    and RemoteReserveDeps documents it as "absent, ungated (next-task-id passes reservationPolicyCurrency)".
    Exactly one production construction passes it: nextTaskIdCommand's
    `gitRemoteRefReserver({ run: gitRunAdapter(run), filingBranch: ..., policyCurrency: deps.policyCurrency ?? reservationPolicyCurrency })`.
    Every other `gitRemoteRefReserver(` under src/ omits it:
      src/run-task.ts ciLearningTaskIdMinter `gitRemoteRefReserver({ run: gitRunAdapter(runGit), filingBranch })`
        (the minter every gardener pass uses: ci-friction, selector-shadow, flow, hot-file, host-resource, ci-learning);
      src/run-task.ts triageCommandLocked `const triageRemoteRefReserver = gitRemoteRefReserver({ run: ... })`;
      src/run-task.ts planCommand, approveCommand and approveBatchCommand, each `reserveTaskIdBlockRemote(..., gitRemoteRefReserver({ run: ... }))`;
      src/run-task.ts prefixedNextTaskIdCommand (`next-task-id --prefix`, operator-run but a separate branch from the gated one);
      src/lib/sweep.ts reservePlanRepairTaskId `reserveTaskIdRemote(mint.n, gitRemoteRefReserver({ run, filingBranch })).taskId`
        (the sweep's renumberPlanPrIds default, W1-T5349).
    W1-T6026's other two parts do not close this. Its fresh-unknown-holder grace lives in reservationHolderDrift, so it
    already binds every caller. But its announcement does not: describeReservationTakeover and the
    `next_task_id.reclaimed` row are written only in nextTaskIdCommand. withIdReservationLogging logs only a thrown
    TaskIdReservationError, so a lane's successful takeover leaves only reclaim's `say` hand-off line on the daemon's
    stdout, and `takenOver` on each RemoteReservationHandle is discarded by every lane.
    THE LANES DO TAKE OVER. All 3770 refs/rmd-id/* were fetched into a scratch bare repo and every first-parent
    link was read. 18 links are source=reclaimed: 12 form one chain on the sentinel W1-T100001, which is above
    MAX_ALLOCATABLE_TASK_ID (100_000), and 6 sit on allocatable ids. 3 of those 6 have a fleet container as the
    reclaimer's host:
      W1-T5116: ci-friction-garden-1790852470163 (99@ea9441faa523) took over file/old-shards (Mac-mini) 6.9s after it reserved;
      W1-T5158: run-TRIAGE-fb-1789303258903-a19164 (4a7e1b552ecd) took over ci-friction-garden-1790876856496 29.7s in;
      W1-T5209: run-TRIAGE-fb-1789303258903-a19164 (4a7e1b552ecd) took over ci-friction-garden-1790927008162 21.0s in.
    `git log origin/main -G 'id: W1-T5158'` and the same for W1-T5209 return nothing. Both ids were filed by nobody.
    All three predate W1-T5279 (093cb95f, 2026-10-02T16:13Z), so current code would hold each one. The daemon
    still runs code from a boot sha and restarts only once origin/main has moved past it
    (daemon.ts `daemon_selfrestart_for_freshness`). src/lib/task-id-reservation.ts changed twice on
    2026-10-06 alone (#9644, #9653). So every lane runs older reservation
    policy for part of every day, and that is the gap W1-T6026's gate exists to close, on the one path it does not cover.
  design: |
    OVERLAP WITH W1-T100 (blocked_ci routing): it shares src/lib/sweep.ts and src/run-task.ts by file only; it
    routes red CI to the fix path, while this task touches only the reservation call sites in those files.
    (1) src/lib/task-id-reservation.ts: export `gatedRemoteRefReserver(deps: RemoteReserveDeps & { lane: string;
    log?: (step: string, fields: Record<string, unknown>) => void })`. It returns gitRemoteRefReserver with
    `policyCurrency: deps.policyCurrency ?? reservationPolicyCurrency`. On a successful takeover it also calls
    `log("reservation.taken_over", { lane, ...takeover fields as reservationTakeoverFields names them })` once.
    Do not change gitRemoteRefReserver's own optional default. Its 22 test constructions rely on it being
    ungated, and the real default's answer depends on whether the checkout's module equals origin/main's.
    (2) Every production construction outside nextTaskIdCommand moves to the factory with its lane name and log.
    The sites are ciLearningTaskIdMinter, triageCommandLocked, planCommand, approveCommand,
    approveBatchCommand, prefixedNextTaskIdCommand and reservePlanRepairTaskId. ciLearningTaskIdMinter and
    reservePlanRepairTaskId gain an optional `log` parameter, and their daemon callers pass theirs.
    prefixedNextTaskIdCommand appends describeReservationTakeover to its RESERVED line, as nextTaskIdCommand does.
    nextTaskIdCommand keeps its current wiring and its `next_task_id.reclaimed` row. That literal is a query key
    and is not renamed.
    (3) Census in the new test: read src/run-task.ts and src/lib/sweep.ts and assert that every
    `gitRemoteRefReserver(` call is nextTaskIdCommand's (which names policyCurrency) and that every other
    reserver is built by `gatedRemoteRefReserver(`. A new lane that bypasses the gate then fails by name.
    (4) The default arm really runs: one test calls the factory with no policyCurrency over a scripted origin
    whose holder is 3h stale. It asserts that reclaim returns `created` exactly when
    `reservationPolicyCurrency().status === "current"` and `taken` otherwise. That holds in any checkout and
    covers the default line.
    Out of scope: reservationPolicyCurrency hashes the module FILE at reclaim time, not the source the process loaded.
    That window was not measured, so this task leaves it alone. pid and host stay reporting-only, as in W1-T6026.
  acceptance:
    - claim: "a takeover-eligible reclaim made through any daemon lane's reserver (triage, plan, approve, ci-learning, plan-repair) or next-task-id --prefix advances without pushing when the policy currency is `differs` or `unprovable`, still takes over when it is `current` and logs one reservation.taken_over row naming the lane, and the census refuses a production gitRemoteRefReserver construction that bypasses the gated factory"
      proof: "unit test: test/a-daemon-lane-reclaim-needs-current-reservation-code.test.ts"
    - claim: "the sweep's plan-repair renumber reserves through the gated factory"
      proof: "grep: gatedRemoteRefReserver( in src/lib/sweep.ts"
    - claim: "a lane's takeover is written as a durable ledger step"
      proof: "grep: reservation\\.taken_over in src/lib/task-id-reservation.ts"
  falsifier: |
    Revert planCommand's reserver to `gitRemoteRefReserver({ run })`: with a `differs` currency injected, the scripted
    origin records a `RECLAIMED:refs/rmd-id/<id>` push, so the no-push assertion fails, and the census names
    planCommand. Drop the log call from the factory: the `current` case finds 0 reservation.taken_over rows,
    not 1. Give the factory a `current` default instead of reservationPolicyCurrency: the default-arm test fails
    in any checkout whose module differs from origin/main, and so does CI on this task's own PR.
