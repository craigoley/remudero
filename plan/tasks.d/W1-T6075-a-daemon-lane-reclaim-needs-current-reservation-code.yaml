- id: W1-T6075
  title: "A DAEMON-LANE RECLAIM NEEDS CURRENT RESERVATION CODE AND LEAVES A ROW — W1-T6026's policyCurrency gate and its takeover record reach only nextTaskIdCommand; the six other production reservers (triage, plan, approve, approve --batch, ci-learning's minter, the sweep's plan-repair renumber) plus --prefix build gitRemoteRefReserver with no policyCurrency, which reclaim reads as ungated, and 3 of the 6 takeovers of allocatable ids on origin were by daemon-container lanes (W1-T5116 7s, W1-T5158 30s, W1-T5209 21s; the last two ids were never filed)"
  repo: remudero
  depends_on: [W1-T6026]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — every non-operator reservation path gets the operator path's takeover gate and durable takeover record
  band_meaning: span
  origin: "operator session 2026-10-06: follow-up of #9653"
  plan_refs: [W1-T100, W1-T6026, W1-T6025, W1-T5279, W1-T949, W1-T2326, W1-T5349, W1-T4388, W1-T3742]
