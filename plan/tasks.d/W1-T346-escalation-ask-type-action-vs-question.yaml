  note: "verify:auto — a pure classifier plus rendered HTML, both assertable in-process.
    risk:high — set by Rule 19's span, not blast radius: the type must exist end-to-end (classify in
    escalate, render in serve) to be one deliverable, and splitting it would orphan the call site
    (Standing rule 14). Behaviorally it stays additive: an optional label plus a row affordance, no
    dispatch path, no spend, absent-type degrades to today's rendering everywhere.
    budget_usd 65 — the classifier is small; the cost is the per-family fixtures and the serve-side
    affordance with the W1-T335 helper discipline.
    NO depends_on: derivable from carried fields, so no producer migration precedes it. W1-T347 and
    W1-T349 depend on THIS, not the reverse.
    PRIOR ART, not collisions: W3-T5's 'answer questions (QUESTION contract)' clause names this
    territory with pre-dialect prose proofs and no overlap in files; W1-T336's Decisions tab renders
    the rows this task types. ONE CONCERN: the ask type existing end-to-end (classify, carry, render)."
