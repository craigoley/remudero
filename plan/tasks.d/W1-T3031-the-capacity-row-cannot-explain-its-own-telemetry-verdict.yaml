- id: W1-T3031
  title: "THE `review.capacity` ROW CANNOT EXPLAIN ITS OWN `telemetry-unavailable` VERDICT — the decision gates on `cpuPsiFullAvg10Pct` and the ledger writes only `cpu_psi_some_avg10_pct`, so the deciding reading is the one field the row omits; `telemetry-unavailable` is the largest shed reason at 349 of 753 decisions and no row says WHICH of the three readings was absent"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: low
