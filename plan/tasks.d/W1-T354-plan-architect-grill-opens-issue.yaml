    risk:high — set by Rule 19's span (escalate, plan-architect, run-task), not blast radius: the
    wiring must name the verdict source, the builder and the call site to be one deliverable, and
    splitting them orphans the call site (Standing rule 14). Behaviorally additive: failure
    directions are a missed issue (today's exact behavior) or a duplicate (bounded by dedup).
    budget_usd 55 — one branch, one builder reuse-or-mirror decision, two-direction falsifier.
    OVERLAP, cited not duplicated: W1-T42 (queued) specified the GRILL machinery — its triage half
    shipped; this wires the plan-architect half W1-T42's own text names, and the implementing PR
    should say whether W1-T42's remaining criteria are thereby satisfied rather than silently
    overlapping (Standing rule 16 discipline).
    files: lists plan-architect.ts because the builder-or-mirror decision (design ii) may add the
    thin builder there; if the implementation leaves it untouched, declaring it costs nothing —
    omitting a written path is what refused five dispatches this week."
