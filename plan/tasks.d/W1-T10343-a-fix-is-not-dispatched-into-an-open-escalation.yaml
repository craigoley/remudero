- id: W1-T10343
  title: "A FIX IS NOT DISPATCHED INTO AN ESCALATION THAT IS STILL OPEN, AND AN OPERATOR ANSWER RELEASES IT — the fix rung stands down at rung.strike whenever a needs-human issue for the same task, PR, head and cause is open, but the sweep never reads that before dispatching, so it re-dispatches every pass until the issue closes (85 futile dispatches, 2026-10-14..21); and an answer through POST /v1/questions/answer does not release the stand-down at all while the issue stays open"
  repo: remudero
  depends_on: []  # no semantic dependency: W1-T10339 (#13342, unmerged, so not nameable here) shares src/lib/sweep.ts's blocked-fixable arm but excludes rung.strike from its hold, so either may land first
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high  # Rule 19: one concern, whether a fix is dispatched while the needs-human question it would re-ask is still open; escalation filing, dedup keys, issue closing and every other stand-down are unchanged
  band_meaning: span
  budget_usd: 10.00
  priority: 1  # requested by the operator session 2026-10-21, as the rung.strike half of the W1-T10339 measurement
  status: queued
