      proof: 'grep: test("W1-T10343: an open escalation holds the dispatch" in test/sweep/a-fix-is-not-dispatched-into-an-open-escalation.test.ts'
    - claim: "closing the issue, a new head or a changed contract revision releases the sweep's hold on the next pass"
      proof: 'grep: test("W1-T10343: a closed issue, a new head or an amended contract releases the hold" in test/sweep/a-fix-is-not-dispatched-into-an-open-escalation.test.ts'
    - claim: "an unspent operator answer releases both the sweep's hold and the rung's rung.strike stand-down while the issue is still open"
      proof: 'grep: test("W1-T10343: an operator answer releases an open escalation" in test/sweep/a-fix-is-not-dispatched-into-an-open-escalation.test.ts'
    - claim: "the sweep and the fix rung evaluate one shared open-escalation predicate from src/lib/escalate.ts"
      proof: 'grep: export function openEscalationStandDownReason( in src/lib/escalate.ts'
    - claim: "the new test file passes"
      proof: "unit test: test/sweep/a-fix-is-not-dispatched-into-an-open-escalation.test.ts"
  falsifier: |
    Drop the sweep's read of open escalations: the held PR is dispatched again at the same head, and the first test
    fails.
    Hold on the issue's existence alone: a new head or an amended contract stays held, and the second test fails.
    Leave the answer out of the predicate: the answered PR is held, or its rung stands down, and the third test
    fails.
    Keep the predicate in src/run-task.ts: the grep finds nothing.
    Regression guards, kept by the same file:
    - An unreadable issue list fails open to today's dispatch.
    - An issue naming no head never holds.
    - A spent answer holds again.
    - W1-T5908's cleared conflict cause still releases and closes the issue.
    - Stand-downs at other sites keep W1-T10339's reading.
