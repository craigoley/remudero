  origin: "operator session 2026-10-21: PR-13218 stood down at rung.strike 28 times across five heads while each head's needs-human issue was open"
  plan_refs: [W1-T10339, W1-T10282, W1-T2799, W1-T3579, W1-T5908, W1-T4471, W1-T435, W1-T2752]
  files:
