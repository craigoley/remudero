    - claim: "a second sweep over unchanged data appends no new row for a run already reported"
      proof: "unit test: test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts"
    - claim: "a finding whose cost genuinely changed IS reported again — suppression never swallows a real change"
      proof: "unit test: test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts"
    - claim: "a run that stops being anomalous stops being reported, and is not resurrected by a later sweep"
      proof: "unit test: test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts"
    - claim: "the full flagged set stays recoverable — this dedupes reporting, never deletes history"
      proof: "unit test: test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts"
    - claim: "the module still only reports: no dispatch is deferred, no worker stopped, no merge blocked"
      proof: "unit test: test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts"
