- id: W1-T2558
  title: "THE COST-ANOMALY SENTINEL RE-REPORTS EVERY FINDING ON EVERY SWEEP, FOREVER — `detectCostAnomalies` (src/lib/cost-anomaly.ts) appends a `cost.anomaly` row per anomalous run per pass with no acknowledgement, expiry or dedup, so 45 genuine findings occupy 471 ledger rows and a run from FIVE DAYS AGO is re-flagged on every tick; MEASURED — W1-T2324-1787823430981 carries 26 IDENTICAL rows at $25.68, and the same five runs appear at 06:25:46, 09:29:16 and 10:18:04 with only `median_cost_usd` drifting 5.03 -> 5.10 -> 5.07"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  files: [src/lib/cost-anomaly.ts, test/an-anomaly-is-reported-once-not-on-every-sweep.test.ts]
  origin: "operator-session#the-spend-census-2026-09-01"
  plan_refs: ["W1-T931", "W1-T2557"]
