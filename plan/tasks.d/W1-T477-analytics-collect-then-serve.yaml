  design: |
    (i) COLLECT — three signals, smallest shapes: a `cli.invoked` row in main()
    (src/run-task.ts) carrying {verb, argv_shape} for EVERY verb including read-only ones
    (one row per invocation; the dot in the step name is literal); a `lane` field added to
    the lane log-closures (src/run-task.ts) so worker kind is a FIELD, not step-name
    archaeology; workerDurationMs measured around the worker call and spread into
    workerLedgerFields (src/lib/worker.ts) so per-call wall-clock exists at the source.
    No retention-set changes: the consumer reads the archive union, and registration
    without need is its own defect (the #977 rule cuts both ways).
    (ii) SERVE — buildAnalyticsRoute (src/lib/analytics-route.ts): GET /v1/analytics,
    scope read, mounted in buildServeRoutes (src/lib/serve.ts) beside its siblings. The
    aggregate answers the four questions per instance: invocation counts per verb, worker
    counts and cost by lane/model, wall-clock per task (run.start-to-verdict joins with
    the no-terminal population EXPLICITLY counted as a bucket, never dropped), and
    duration distributions per lane once (i)'s field exists. Sections whose signal
    predates collection render as UNMEASURED-BEFORE-<date>, never as zero — a zero that
    means 'not collected yet' is the false-refutation shape the operator's brief opens
    with (two fleets, one coincident total of 30).
    (iii) THE READER DISCIPLINE, enforced by construction: the route's miner reads through
    ledgerRotationEntries' union ONLY (live-file-only reads refused at review by the grep
    criterion below), dedupes on full lines, keys triage rows on minted_id, and takes
    field names from the writers.
    (iv) CROSS-INSTANCE, stated as the consumer it is: N=1 today; the hosted portfolio
    polls each cell's /v1/analytics through the relay once W1-T433 and hosted
    infrastructure exist — no ledger rows leave the host, which keeps W1-T425's
    redaction reservations untouched.
    (v) FALSIFIER, both directions: a fixture state dir with rows split across the live
    file and TWO rotation archives must aggregate identically to the same rows in one
    file (a live-only reader fails it — the rotation hazard made structural), AND a
    fixture with two byte-identical DAEMON rows at one ts plus one distinct row must
    count three, not two (full-line dedupe, the collapsed-deferral hazard made
    structural).
    (vi) NOT IN SCOPE: shipping raw rows off-host (W1-T425's redaction lane); any hosted
    service; retention-set changes; backfilling signals that were never written (the
    UNMEASURED-BEFORE bucket is the honest rendering); the brief's other print-only
    signals (logTail, risk-judge raw output, waited_ms) — each needs its own writer-side
    decision and this shard names them for follow-up rather than absorbing them.
