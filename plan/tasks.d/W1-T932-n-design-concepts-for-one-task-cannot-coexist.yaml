  rationale: "**THE BLOCKER IS NOT THE IMAGE CHANNEL. IT IS THAT SIBLING CONCEPTS KILL EACH OTHER.**
    The operator wants to send an image to the fleet, get several design concepts back, and pick one —
    including for a product already built. Open three concept PRs against one task today and the two
    lower-numbered ones are disposed `stale` before anyone looks at them.

    (1) **THE ARITHMETIC, RE-DERIVED AT 5d81b8f.** `src/run-task.ts` computes `supersededBy` as the
    highest-numbered OTHER open PR crediting the same task, keyed on `resolveOpenPrTaskId`:
    `const peers = taskId ? (byTask.get(taskId) ?? []) : []`, `const newest = peers.length ?
    Math.max(...peers) : pr.number`, `const supersededBy = newest > pr.number ? newest : undefined`.
    Three concept PRs on one task therefore give the two lower-numbered ones a `supersededBy` BY
    ARITHMETIC — no policy, no judgement, no evidence.

    (2) **THERE ARE THREE `stale` ROWS IN `DISPOSITION_RULES` (`src/lib/sweep.ts`), NOT TWO, AND THE
    ORDER IS WHAT MATTERS.** Verified at 5d81b8f, in table order: a VERDICT row
    (`policy.supersessionDisposalEnabled === true && pr.supersessionVerdict?.status === 'superseded'`,
    W1-T920 / `DECISIONS.md` #1987); then the BARE-NUMBER row (`when: (pr) => pr.supersededBy != null`,
    reason `superseded-by #N`); then an AGE row (`ageDays >= policy.staleDays`). `deriveDisposition`
    selects with `DISPOSITION_RULES.find(...)`, so it is FIRST-MATCH-WINS.

    (3) **THE OLDER ROW HAS GAINED NO GATE, SO THIS TASK DID NOT SHRINK.** The bare-number row is still
    `when: (pr) => pr.supersededBy != null` with no policy argument at all, while the verdict row above
    it is gated `false` (`plan/policy.yaml` `sweep.supersessionDisposal: value: false`). With the gate
    OFF the verdict row cannot match, so the bare-number row is what actually fires — which is exactly
    the case a concept PR hits.

    (4) **AND THE SEAM THIS EXTENDS HAS NO PRODUCER YET, WHICH THE SHARD MUST NOT PRETEND OTHERWISE.**
    `supersessionVerdict` is referenced only in `src/lib/sweep.ts` (11), `src/lib/policy.ts` (2),
    `src/run-task.ts` (1) and `src/lib/producer-completeness.ts` (1) — and that last one is the gate
    that TRACKS knowingly-unproduced fields, not a producer. Control: `supersededBy` spans six files
    with real producers. `plan/policy.yaml` says it in its own words: turning the flag on 'changes
    nothing in production until that detector lands'.

    (5) **THE FIRING COUNT IS UNVERIFIED AND IS DELIBERATELY NOT REPEATED HERE.** A brief claimed the
    `stale` rule has fired 3,413 times. That number could not be re-derived: the only ledger reachable
    from the filing host is `/root/Remudero/state/ledger.ndjson`, 320 lines, holding exactly two step
    kinds — `cli.invoked` (309) and `deploy.skip` (11) — with ZERO `sweep.*` rows, so it is a CLI
    invocation log and not the fleet's decision ledger. Per-form coverage control: of the three
    rotation forms only the live one exists (`.gz` 0 files, rotated-plain 0 files, live 1). Positive
    control FAILED as it must on the wrong corpus — `run.start`, `sweep.disposed` and `review.posted`
    all read 0. **TREAT THE COUNT AS UNMEASURED UNTIL SOMEONE RUNS IT WHERE THE DAEMON WRITES.**"
  design: |
    (i) SCOPE, AND IT IS DELIBERATELY NARROW: a task shape in which N open PRs COEXIST without
    superseding one another until a human selects. NOT the image channel, NOT the selection UI, NOT the
    concept generator. Those are sequenced below and are separate shards.
    (ii) THE SEAM IS THE EVIDENCE-BEARING VERDICT AND ITS POLICY GATE, NOT THE ARITHMETIC. W1-T920
    already moved supersession from a bare number toward an auditable verdict whose own doc says
    "'superseded' alone is unauditable". A concept PR is NOT superseded by a sibling concept, and the
    verdict should be able to SAY so, with a reason, rather than the sweep inferring death from a
    higher PR number. THIS PUSHES THAT EXISTING MIGRATION ONE STEP FURTHER AND DOES NOT DISABLE THE
    OLDER ROW — a guard that works for ordinary duplicate PRs must keep working.
    (iii) PROPOSE THE MECHANISM, DO NOT BUILD IT. The mechanism must let the bare-number row YIELD when
    a verdict positively asserts sibling-concept coexistence, and must fail CLOSED: an absent,
    unreadable or malformed verdict leaves today's behaviour exactly as it is. `"unique"` and
    `"indeterminate"` are already inert in the verdict row for that reason (design note iii there).
    (iv) THE DISPOSITION VOCABULARY HAS NO SLOT FOR THIS AND THAT IS THE SECOND HALF OF THE PROBLEM.
    `Disposition` is `mergeable | blocked-fixable | stale | blocked-ambiguous | dep-review |
    post-review | conflicted | wait`. There is NO "held for selection", and every terminal path is
    merge or close. A concept awaiting a human choice is none of these. Naming that disposition is a
    SEPARATE shard, sequenced next, because adding a vocabulary member touches every consumer.
    (v) NAME THE CONSUMER IN THE SAME PR OR DO NOT EMIT. Seven mechanisms here are already
    built-and-unread — `hasPushedRunBranch`, `armedButStalled`, `dispatch.stood_down`,
    `CiFailure.outsidePrRange`, `dh-rate-limit`, `rareOverlapWarnings`, `rmd coverage-improve` — and
    rationale (4) makes `supersessionVerdict` itself an eighth, producer-less today. A new field whose
    only reader is a test would be the ninth. The consumer here is `deriveDisposition`'s own row, which
    is what makes this a gate rather than a report.
    (vi) DO NOT ROUTE THIS THROUGH `plan/feedback/`. It holds 149 entries, 76 at `status: new`, with
    nothing ageing them out; adding a queue to a queue nobody drains is not a design.
    (vii) THE SURFACE IS GITHUB, NOT THE CONSOLE, AND SAYING SO HONESTLY IS PART OF THE TASK. GitHub
    renders images in PR and issue bodies, authenticated, from a phone, today. The console binds
    `127.0.0.1:4317` with no published port, and `/v1/questions/answer` and `/v1/operator-notes/add`
    have ZERO console-UI references against controls of 2 and 4. A PR BODY CARRYING N IMAGES IS THE
    ONLY REACHABLE SIDE-BY-SIDE VIEW THAT EXISTS.
    (viii) SEQUENCING, and it is the point of filing this one first:
      FIRST  — supersession survival (THIS SHARD): N concepts coexist as open PRs.
      SECOND — a selection disposition: the vocabulary member from (iv), plus its terminal path.
      THIRD  — the image channel, behind W1-T915's reachability work.
      INDEPENDENT — critique-and-snapshot, which can proceed at ANY time and is NOT a prerequisite.
      **THE PRIOR RECON EXPLICITLY REFUSED TO CALL CRITIQUE THE ENABLER, because doing so "would be
      dressing up an unrelated task". THAT REFUSAL IS RECORDED HERE SO NOBODY RE-RANKS IT.**
    (ix) DO NOT ASSUME SCREENSHOTTING WORKS. A Playwright build mismatch broke 96 of 97 browser suite
    runs this weekend, and the fix was a host-local alias that exists on no other machine. Any design
    that needs a rendered screenshot must state that dependency rather than inherit it.
    (x) THE JUDGEMENT PROBLEM IS THE REAL RISK, AND THE SELECTION SURFACE IS THE VALUABLE HALF.
    Divergence is nearly free now; the bottleneck is judgement. The failure mode this invites is work
    that looks polished at first glance and unravels the moment you use it — the form is there, the fit
    is not. FOUR CONCEPTS NOBODY CAN COMPARE ARE WORSE THAN ONE. Build the ability to hold and compare
    before the ability to generate more.
