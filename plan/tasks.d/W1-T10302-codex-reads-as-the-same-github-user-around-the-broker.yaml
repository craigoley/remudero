- id: W1-T10302
  title: "CODEX READS GITHUB AS THE SAME USER AROUND THE BROKER — the operator's Codex sessions run under a second Mac account and open every codex/ PR as cao825, the same GitHub user the Claude sessions read as, but no hook routes their `gh` reads and W1-T10279's broker paces one account only; route Codex reads through the broker and share one pacer per GitHub login across Mac accounts"
  repo: remudero
