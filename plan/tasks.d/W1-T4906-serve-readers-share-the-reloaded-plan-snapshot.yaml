- id: W1-T4906
  title: "SERVE'S READERS DO NOT ALL SEE THE PLAN W1-T4481 RELOADS IN PLACE — /v1/trace, /v1/feedback and the inbox write routes still parse the working-tree plan, which no longer fast-forwards on a plan-only merge; the status-stream publisher pins the plan it started with; and the reload parses 2,615 tasks on serve's loop. Every serve reader reads the one reloaded snapshot, parsed off the loop"
  repo: remudero
