  origin: "2026-09-30 core-console architecture Phase 0 (P0-LOOP review of #7982, W1-T4481)"
  plan_refs: ["W1-T4481", "W1-T4463", "W1-T4454", "W1-T4455", "W1-T4771"]
  files:
    - src/lib/panel-graph.ts
    - src/lib/console-projection-worker.ts
    - src/lib/status-stream-publisher.ts
    - src/lib/serve-plan-reload.ts
