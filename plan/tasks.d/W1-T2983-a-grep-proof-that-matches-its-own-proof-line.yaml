  note: |
    THIS SHARD HOLDS ITSELF TO THE RULE IT PROPOSES, AND THE CHECK CAUGHT ITS SIBLING. Every one of
    the five patterns above matches at least one line outside this acceptance block; each reads two
    hits whole-file and one with the block deleted. The same check, run against W1-T2982 in the same
    session, refused a fourth criterion whose anchor had wrapped across a block-scalar line break so
    that its only match was its own proof line — the precise defect recorded here, caught before it
    shipped rather than after. That is the evidence the rule is satisfiable by an author who wants
    to comply, and the reason the cost figure above is a floor rather than a guess.

    A PREMISE THIS SHARD WAS FILED ON WAS WRONG AND IS CORRECTED HERE RATHER THAN QUIETLY DROPPED.
    The brief held that acceptance is a REPORTED_MERGED_FIELD, so merged shards could not be
    repaired without tripping rule 21. It is not in that list, and the list is warn-only in any
    case. What is actually true is narrower and still binding: criterionKey normalises the CLAIM
    only, so rewriting a claim on a merged task reads as an ADDITION and blocks, while rewriting a
    PROOF and leaving its claim byte-identical is a warn. Remediation may move proofs; it may not
    reword claims.

    THE COUNTS ARE A QUERY TAKEN AT c51d944e, NOT A CONSTANT. 1154 shards, 669 targeted grep proofs,
    168 self-targeting, 167 self-matching, 23 pinning nothing, and the one-to-four warning delta all
    move with the tree. Re-derive them with /usr/bin/grep or git grep and the executor's own -arn
    flags; the harness grep and bare rg are blind to files this corpus contains.
