      proof: "grep: ONE HUNDRED AND SIXTY-SEVEN OF ONE HUNDRED AND SIXTY-EIGHT in plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml"
    - claim: "The shard names the sharpest subset — the proofs whose only match anywhere in the file is their own criterion"
      proof: "grep: TWENTY-THREE PROOFS PIN NOTHING AT ALL in plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml"
    - claim: "The shard records that the defect suppresses an existing check rather than merely evading one, with the control that fires in both runs"
      proof: "grep: THE SELF-MATCH HIDES THREE REAL WARNINGS in plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml"
    - claim: "The shard records that the naive rule is unsatisfiable because proof-grep-safety blocks every anchoring mechanism, and refuses to weaken that gate"
      proof: "grep: THE OBVIOUS RULE HAS NO COMPLIANT FORM in plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml"
    - claim: "The shard leaves severity and remediation to the operator and records why a review-side fix would not block the shipping PR"
      proof: "grep: WHY IT HAS TO BE A FILING-TIME CHECK in plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml"
  files: [plan/tasks.d/W1-T2983-a-grep-proof-that-matches-its-own-proof-line.yaml]
