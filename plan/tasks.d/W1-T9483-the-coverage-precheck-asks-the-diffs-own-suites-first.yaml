  rationale: |
    OBSERVED 2026-10-14, read-only (core ledger ~/rmd-state2/state/ledger.ndjson, origin/main 456decf7):
      - #11677 (W1-T9077) added src/lib/engine-tree.ts (309 lines) with its own test file. CI's coverage-ratchet
        refused head 6cabe559 at about 14:32Z: "diff-coverage: BLOCKED ... src/lib/engine-tree.ts:109, :114, :164,
        :171, :184-187, :204, :205, :226 ...", which were error arms the new test never drove. Fix round 2
        (dispatched 14:47Z) added 94 test lines to the PR's own test file and pushed 97ce1154. The red was on the
        first head too: coverage-shard (2/8) and coverage-ratchet were red on 90dbf82, but round 1 (14:00Z) was
        dispatched before they finished and fixed only rule-checks. That cost one CI cycle and a second round,
        roughly 45 minutes.
      - Every push.coverage_precheck row in the live ledger on 2026-10-14: two read "unavailable: 1446 (and 1449)
        suite(s) are too wide to precheck quickly (over preflight's scoped ceiling of 40)" (W1-T8830, W1-T8866),
        and one read "covered: no changed src file". None reached a verdict on a source diff.
      - The selection for #11677's four changed src files (affectedSelectionOrFull over readAffectedSuitesInput,
        run locally at origin/main) is 2503 suites, and src/lib/engine-tree.ts alone is 150. The suites that
        actually cover the new file are the PR's own test file plus the importers of the changed src files.
      - Wiring is a separate gap: the sweep fix rung pushes with the raw pushFixRound (W1-T8833, queued), and a
        worker that pushes its own head runs only the pre-push hook. Neither path asks the coverage precheck. Even
        once W1-T8833 wires it, this selection width leaves it unavailable on most builds.
  design: |
    1. coveragePrecheck (src/run-task.ts) runs a NARROW pass before the reach-selected passes: the diff's own
       added or changed test files, plus every test file whose import specifiers name a changed src file
       directly. It runs under the existing bound, which the tier manifest's measured durations set (never a
       fixed number of seconds).
    2. If the narrow pass covers every added src line, the outcome is `covered`, the same as today's covered.
    3. If the narrow pass leaves lines uncovered and the reach selection is within the existing ceiling, the
       reach passes run exactly as today, and only they can return `uncovered` (a refusal).
    4. If the reach selection is over the ceiling, the outcome is a new `uncovered-narrow` with the line list. It
       is ADVISORY: it never refuses a push, it is ledgered on push.coverage_precheck with its lines, and the
       implement and fix prompts' pre-push finding names the lines to cover. CI's verdict stays the authority.
       Record, per head, whether CI's diff-coverage later agreed, so the advisory's precision can be read off
       the ledger instead of being assumed.
  acceptance:
    - claim: "a diff over the reach ceiling still gets a verdict from its own and direct-importer suites"
      proof: 'grep: test("W1-T9483: a diff whose reach is over the ceiling is judged by its own and direct-importer suites" in test/the-coverage-precheck-asks-the-diffs-own-suites-first.test.ts'
    - claim: "a narrow-pass gap over the ceiling is advisory and never refuses the push"
      proof: 'grep: test("W1-T9483: a narrow-pass gap over the ceiling is advisory, not a refusal" in test/the-coverage-precheck-asks-the-diffs-own-suites-first.test.ts'
  falsifier: |
    On main, give coveragePrecheck injected ports: a selection of 2503 suites, a changed src file, and a PR test
    file that covers it. It returns `unavailable` ("too wide to precheck") and never runs the PR's own test.
    With the change, the narrow pass runs that test and returns `covered`. Drop a covering line and it returns
    `uncovered-narrow` with that line, and coveragePushRefusal returns undefined.
