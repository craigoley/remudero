  status: queued
  attempts: 0
  note: "verify:auto — every claim is a real Chromium suite passing, which is the standard this repo
    already holds serve.ts DOM behaviour to.
    risk:high — Rule 19 counts the shared harness and eight consuming suites as distinct subsystems.
    The danger is a helper that silently no-ops under the tabbed shape too, which would look like a
    pass here and strand W1-T336 exactly as before; criterion 1 exists to make that failure loud.
    budget_usd 60 — nine files, but the work is mechanical routing, not new assertions. Higher than
    W1-T334 for breadth, lower than W1-T336 because nothing in production changes.
    files: LISTS ALL NINE PATHS, every one of which the worker writes. W1-T314's own history is the
    cautionary case — it declared two paths for work touching eleven and took two scope_guard refusals
    before the shard was widened.
    depends_on W1-T334 IS HARD, not sequencing preference: the helper's tabbed branch cannot be
    written, let alone proven, until a tab bar exists for it to activate."
