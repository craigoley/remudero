  rationale: |
    OBSERVED (console ledger /mnt/rmd/remudero-console-state/state, read only, 43 files modified since
    2026-10-13 12:00Z, .gz and live):
    - `deploy.skip` at 2026-10-13T12:17:42.402Z, actor_pid 56180, run_id DEPLOY-1791893862402, actor
      host_automation, reason "daemon running stale code ... (W1-T3245)", blocker stale_running_daemon.
    - Before it, console wrote a deploy.skip about every 5 min (12:02, 12:07, 12:12). After it there is no console
      DEPLOY row at all until 2026-10-16T11, so that one hung tick held every later console tick for about 71 h.
    - From W1-T9800's record (the systemd journal): SIGTERM went to 38095 (bash), 56139 and 56180 (MainThread)
      only. The unit "Consumed 18.278s CPU time, 799.7M memory peak". The operator saw bash -> node -> node ->
      esbuild ZOMBIE. One hang in 191 console ticks, none in about 2,000 core and site ticks.
    READ at origin/main fb566039c (symbols, not lines; no deploy command was run):
    - bin/rmd `exec`s node_modules/.bin/tsx on src/run-task.ts. So the outer node is the tsx CLI, the inner node
      (56180) is run-task.ts, and esbuild is tsx's transform service, a child of the inner node. Nothing in src/
      calls esbuild's JS API.
    - deployRunCommand is async but awaits nothing. runDeployCycle (src/lib/deployer.ts) logs deploy.skip and
      returns. The command then prints and runs runServePolicyCycle (src/lib/serve-policy-convergence.ts), also
      synchronous. main() ends in flushThenExit (src/lib/flush-exit.ts), which awaits drained() on stdout and
      stderr and calls process.exit. Nothing waits for the event loop to drain, so a ref'd timer, socket, watcher
      or Worker cannot by itself keep the process alive.
    - realDeployDeps' exec (deployer.ts) and realServePolicyDeps' exec (serve-policy-convergence.ts) are
      `execFileSync(cmd, args, { encoding: "utf8" })` with no timeout. On a primary instance, the serve cycle runs
      docker inspect, docker exec, git and bash through them after the skip.
    LIKELY CAUSES, ranked, all INFERRED (the code cannot settle which):
    1. The inner node blocked inside process.exit teardown, joining a thread (tsx's module-hooks thread or an
       esbuild sync worker) that never returns. The child's pipes close, so esbuild exits, but no loop is left to
       reap it, which leaves a ZOMBIE. This fits the near-zero CPU, the absence of a live child in the signalled
       set, and the 1-in-191 rarity, which points to a race.
    2. The main thread in a synchronous wait (Atomics.wait with no timeout) on a tsx or esbuild sync request after
       the esbuild child died. It fits the zombie and the CPU, but no lazy module load after the skip was found to
       trigger one.
    3. A hung execFileSync in the post-skip serve cycle. A latent risk, since these have no timeout. It does not fit
       this incident: a live docker or git child would have been in the unit's cgroup and signalled.
    Ruled out by the process.exit path: ref'd handles, and anything started before the decision.
  design: |
    1. Falsifier first. The test spawns the real bin/rmd deploy-run through the tsx chain, detached, with
       `--state-root <tmp>` and git, docker and gh stubs first on PATH, as in
       test/deploy-run-state-root-override.test.ts. The stubs make the decision an up-to-date skip: git answers
       HEAD == origin/main, and docker exits 1. One variant marks the state root primary in a temp
       daemon-instance registry, so the post-skip serve cycle's exec seams run. Each run asserts a deploy.skip row,
       an exit within the bound, and that a /proc scan (pid, ppid, stat only) finds no process left in the spawned
       session. Repeat N times, because the hang is rare.
    2. Evidence for the next hang, which item 1 may not reproduce. flushThenExit's caller writes one
       `deploy.exit_requested` ledger row (the deploy step family) just before process.exit for deploy-run. In
       deploy/install-host-units.sh, W1-T9800's pre-kill observer adds each thread's stat and wchan
       (/proc/<pid>/task/*/stat and wchan, never cmdline or environ). A row present on a hung tick puts the hang
       in teardown (cause 1). A row absent puts it before exit (cause 2 or 3).
    3. Remove the cheap latent cause: give realDeployDeps' and realServePolicyDeps' execFileSync a timeout, with
       a killed child reported as the command's failure, never as success.
    4. If item 1 reproduces cause 1 or 2: the fix the evidence supports. Candidates are deploy-run starting from
       a precompiled entry under plain node (W1-T7729's bundles), so there is no tsx hooks thread and no esbuild
       service, or ending with process.reallyExit after the flush. Name the choice in the PR. Otherwise ship items
       1-3 and record the rate the falsifier measured.
    OPERATOR DECISIONS, NAMED: the exit bound (proposed 60 s), the repeat count N (proposed 50, which may need a
    tier outside test:ci), and the execFileSync timeout (proposed 120 s). None is taken without approval.
    BAKED-PATH NOTE (READ in src/lib/baked-runtime-inputs.ts at fb566039c): src/lib/deployer.ts is in
    BAKED_RUNTIME_SOURCE_PATHS, so a change to it ships by image build and recycle (CLAUDE.md ci-and-merging).
    src/run-task.ts, src/lib/serve-policy-convergence.ts and deploy/install-host-units.sh are not. Check with
    docker inspect before calling it shipped.
  acceptance:
    - claim: "a real deploy-run whose decision is skip writes deploy.skip and exits within the bound, leaving no live or zombie process in its session, on every repeat"
      proof: 'grep: test("W1-T9921: a skip-deciding deploy-run exits with no live or zombie children" in test/a-deploy-run-that-decides-skip-exits-with-no-live-children.test.ts'
    - claim: "a deploy-run writes deploy.exit_requested just before it exits, so a hung tick shows whether it reached exit"
      proof: 'grep: test("W1-T9921: a deploy-run records that it reached exit" in test/a-deploy-run-that-decides-skip-exits-with-no-live-children.test.ts'
    - claim: "a deploy or serve-policy exec that outlives its timeout ends at that timeout and the command reports a failure"
      proof: 'grep: test("W1-T9921: a hung deploy exec ends at its timeout and fails" in test/a-deploy-run-that-decides-skip-exits-with-no-live-children.test.ts'
  falsifier: |
    On origin/main, no deploy.exit_requested row exists, so the second test fails. realServePolicyDeps' exec is
    execFileSync with no timeout, so a stub `docker` that sleeps past the bound is never killed and the third test
    fails at its own guard. The first test is the regression guard. If it does not reproduce the hang on main within
    N repeats, the builder says so in the PR and does not claim it as a falsifier.
