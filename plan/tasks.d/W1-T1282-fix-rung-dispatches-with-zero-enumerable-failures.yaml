- id: W1-T1282
  title: "THE FIX RUNG DISPATCHES A WORKER WHEN IT HAS ZERO ENUMERABLE FAILURES TO HAND IT — dispatch reads `checksState` from the rollup while the worker's evidence comes from the `ciFailures` miner, and when the second returns nothing the rung spends its strikes anyway and escalates an issue whose own failing-check section prints that it is empty"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  rationale: |
    **THIS IS THE THIRD CONDITION SPLIT OUT OF A DUPLICATE FILING, NOT A NEW DEFECT CLASS.**
    `W1-T1278` was filed twice on the same subject by two lanes within twenty-seven minutes. The
    surviving filing is #2647 (`dc3a6a77`, merged 2026-08-23T18:46:01Z), which owns conditions A
    and B IN SUBSTANCE and not merely by id: re-read on `origin/main` before this shard was cut, it
    names `#2605` twice, `mergeable_state` six times, `merge-tree` and `wipe-test.ts` once each, and
    states the same conclusion in the same words — a repair and a non-repair "produce the identical
    observation". Those conditions are ITS work and are NOT re-argued here.

    **WHAT #2647 DOES NOT COVER, RE-MEASURED AGAINST THE MERGED FILE RATHER THAN CARRIED FORWARD.**
    Marker counts read on `origin/main`'s copy of
    `plan/tasks.d/W1-T1278-the-fix-rung-dispatches-without-re-reading-the-state.yaml`:
    `ZERO ENUMERABLE` 0, `issues/2653` 0, `no evidence` 0, `checksStateFromRollup` 0,
    `REVIEW_CONTEXT` 0, `detailsUrl` 0, `test theater` 0, `2641` 0. CONTROL, on the same file with
    the same reader: `runFixRung` reads 3 and `strike` reads 18, so the zeros are absence and not a
    reader that failed to open the file.

    **THE OBSERVATION. MEASURED ON #2641 (`docs/repoint-recovered-research`) AT HEAD `cd4b110b`.**
    The `blocked_ci` fix rung dispatched TWO bounded ci-log workers and then escalated as
    `issues/2653`, whose own **"Failing check(s)"** section reads, verbatim:
    **"(no evidence — this was checked and is empty)"**. A rung that prints its own emptiness had
    nothing to hand the worker it had already paid for, and it spent two strikes before saying so.

    **THE TWO-READER SPLIT, NAMED PRECISELY — AND THIS CORRECTS THE PARENT's FRAMING.** Dispatch
    reads `checksState`, composed by `rollupFromRest(checkRuns, statuses)`. The worker's evidence is
    `ciFailures`, produced by a SEPARATE miner that pulls an Actions job id out of `detailsUrl`. At
    `cd4b110b` the first returned RED off **three genuinely failed checks** — `ci` completed
    18:33:10Z, `coverage-ratchet` 18:38:26Z, `ci-gate` 18:48:48Z, all before the escalation opened at
    18:57:54Z — and the second returned NOTHING.
    **THE RUNG IS DISPATCHED BY ONE READER AND WORKS FROM ANOTHER.**
    The split is NOT between checks and statuses: `checksStateFromRollup` filters
    `REVIEW_CONTEXT` out entirely, so `isBlockedCi` (`pr.checksState === "red"`) CANNOT be reading
    the review, and any account that explains this dispatch by an invisible commit status is wrong.

    **THE ESCALATION's SECOND EVIDENCE LINE WAS ALSO FALSE WHEN PRINTED.** It states "no review has
    run yet" while the combined-status endpoint records `remudero-review` **FAIL** on that exact head
    at 18:28:27Z — twenty-nine minutes earlier. Both of its evidence lines were false at the moment
    it wrote them. **THE REPORTING HALF OF THAT IS `W1-T1279`'s AND IS CITED, NOT RE-FILED**: this
    shard is about the rung DISPATCHING with nothing in hand, not about how the escalation renders
    what it has.

    **WHAT IS TRUE ABOUT THE BLIND READER, KEPT.** `/check-runs` IS structurally blind to
    `remudero-review` — verified at that head, where 27 check runs carry no entry of that name while
    combined-status carries exactly one. And #2641's actual problem was unreachable by the dispatched
    mode regardless: the verdict reads **"test theater: added tests assert nothing"**, a judgement
    about the PR's body and diff that no ci-log worker addresses.

    **THIS CONDITION NEEDS NO NEW LEDGER FIELD, WHICH IS WHY IT IS THE CHEAPEST OF THE THREE.**
    Unlike a strike-attempt history or a re-read of `mergeable_state`, the failing-check count is
    ALREADY IN HAND at dispatch time.
    **A RUNG WITH ZERO ENUMERABLE FAILURES MUST STAND DOWN WITH A NAMED REASON RATHER THAN DISPATCH.**
    The shape already exists in the same function:
    `fixRungStandDownReason` occurs 4 times in `src/run-task.ts` and the cancelled-check arm already
    sets a reason and leaves `acted` false rather than falling through to `dispatchFix`.

    **NOT PROPOSED, BY NAME: merging the two readers, or treating a failed review as a CI failure.**
    `strikeCap` stays and the escalation at the ceiling stays; what changes is that a rung with
    nothing to enumerate refuses BEFORE it spends, and says why.

    ── ADDED 2026-08-23: THE MINER IS BUILDING A HALF-POPULATED TYPE ────────────────────────────

    (8) `CiFailure` DECLARES FOUR FIELDS AND ITS SOLE PRODUCER ASSIGNS TWO. Re-derived on
    `origin/main`: the interface declares `name` and `logTail` as required, then `sha?:` at
    `src/lib/sweep.ts:246` and `outsidePrRange?:` at `:253`. The only thing that builds one is
    `src/run-task.ts:19440`, which returns `{ name, logTail }`. So HALF the declared shape is
    never populated by anything.

    (9) AND THE UNPOPULATED HALF IS READ ANYWAY. `outsidePrRange` is consumed at
    `src/lib/sweep.ts:1789` (`const rangeNote = f.outsidePrRange`), so a narration branch exists
    for a value that is always `undefined`. The file CONCEDES THIS IN ITS OWN COMMENT at `:1591`:
    "`CiFailure.outsidePrRange` is narrated by `describeCiFailures` and never acted on". The
    condition is documented; what is not is that the field it turns on has no producer at all.

    (10) THIS IS EVIDENCE FOR THIS SHARD, NOT A SEPARATE DEFECT. The miner that returned nothing
    on `#2641` is building a type two of whose four fields are never populated -- the same
    producer, the same call, the same silence. It sharpens the diagnosis rather than widening it:
    the rung's evidence path is not merely EMPTY on some runs, it is STRUCTURALLY PARTIAL on every
    run. ANY REMEDY THAT ADDS ATTEMPT INFORMATION TO `CiFailure` MUST DECIDE WHAT HAPPENS TO THOSE
    TWO: wire them, or move them to `KNOWN_UNWIRED` with a stated reason. Adding a fifth field
    beside two dead ones would leave the shape less honest than it is now.

    (11) AND THE CHECK THAT WOULD HAVE CAUGHT IT IS TWO LINES, NOT A GENERALISATION.
    `auditProducerCompleteness({srcRoot, interfaceFile, interfaceName, allowlist})`
    (`src/lib/producer-completeness.ts`) is ALREADY GENERIC -- nothing in it is `OpenPrView`-
    specific. Pointed at `CiFailure` it returns `unwired: ["sha", "outsidePrRange"]` with
    `producers: ["src/run-task.ts:19440"]`, against a control run on `OpenPrView` that returns its
    five known-unwired fields and two producers, so the reader is not blind. That is a two-line
    addition to `test/producer-completeness.test.ts`.

    (12) AND IT IS NOT AN ARGUMENT FOR A TEST PER INTERFACE -- A SURVEY OF SIX CANDIDATES FOUND
    `CiFailure` THE ONLY OTHER ONE THAT YIELDS ANYTHING. Measured on this tree:
    `LiveStateResult` anchors on `ok` and matches 165 FALSE PRODUCERS, which makes it unusable;
    `LearningsIndex` declares 0 optional fields and 7 of 8 `src/lib/ledger.ts` interfaces do too,
    so there is nothing for the audit to report; `DisarmOutcome` is a STRING UNION
    (`export type DisarmOutcome = "disarmed" | ...`), not an interface; and `ContainmentEvidence`
    audits clean at 0 unwired across 6 optional fields. One more call, not a policy.
