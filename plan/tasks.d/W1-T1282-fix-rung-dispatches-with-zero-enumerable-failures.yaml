  note: |
    **WHY NO PROOF IN THIS SHARD GREPS ITS OWN PATH.** All five criteria use the pure-path
    `unit test:` form naming `test/fix-rung-empty-failures-stand-down.test.ts`, which is declared in
    `files:`, so `judgeCriterion`'s `not_yet_built` carve-out applies at filing time. A `grep:` proof
    naming this shard would be OUT OF SCOPE by construction — `rule15-filing` refuses a `verify: auto`
    task that declares its own plan record in `files:`, and `lint-plan` warns that
    `scopeGuardOutOfScopeFiles` would then refuse the branch AFTER the work is done. The `grep:`
    proofs that pin this shard's recorded findings live in the PR body, where they execute against a
    real path and cap nothing.

    **PARENT AND PROVENANCE.** `W1-T1278` (#2647, `dc3a6a77`) is the parent and was confirmed an
    ancestor of `origin/main` before this shard was cut. This filing REPLACES the duplicate
    `W1-T1278` shard that PR #2648 carried; that file is DELETED in the same commit rather than
    renamed alongside it, so the duplicate id is gone from the tree and `lint-plan` resolves one
    `W1-T1278` again. No second PR was opened — #2648 is retitled in place.

    **WHY THE DUPLICATE HAPPENED, RECORDED SO IT IS NOT RE-LEARNED.** The two lanes swept the same
    eight id surfaces and both read zero, because neither sweep could see the other's unpushed work:
    the reservation for `W1-T1278` was taken at 18:19:35Z, #2648 opened at 18:30:43Z, and #2647
    merged at 18:46:01Z. NO SWEEP SEES UNPUSHED WORK — that half is operator discipline and never a
    check, which is exactly the failure mode already recorded at #2471.

    **ID PROVENANCE.** `refs/rmd-id/W1-T1282` was reserved 2026-08-23T19:28:24Z and confirmed still
    held and unused. Eight surfaces swept, each with a control qualified for that surface, one
    control disqualified and re-taken rather than reported: shard filenames on main 0 (control
    `W1-T1279` = 1); `- id:` lines in `plan/` 0 (control `W1-T1279` = 1); the reservation namespace
    312 refs; open-PR titles 0 (control `W1-T1278` = 1); open-PR head branches 0 (control `run-*`
    heads = 83); open-PR file lists 0 across 3 of 3 heads enumerated and captured, control 12 total
    file entries; anchored merged-PR trailers `^Remudero-Task:\s*<id>\s*$` 0 — **its `W1-T1278`
    control was DISQUALIFIED at 0, because plan filings carry no trailer, and re-taken on
    `W1-T1262` = 1**; merged commit subjects on main 0 (control `W1-T1278` = 1 across 2054 subjects,
    with 515 `Remudero-Task:` lines in the same corpus).

    **RISK BAND IS RULE 19 SPAN, NOT BLAST RADIUS.** `files:` crosses `src/` and `test/`, so the SPAN
    reading is `high`. `high` EXEMPTS `sizingViolation` rather than clearing it — it returns
    `undefined` outright at that band — so a clean lint is NOT evidence the span was vetted. The
    blast radius is narrower: one refusal inside one function, mirroring a stand-down that already
    exists in it. The danger is entirely the CONDITION'S WIDTH, which is why criterion 3 pins the
    has-failures case explicitly; a change passing criterion 1 and failing 3 has built "never fix a
    red PR".

    **THE FALSIFIER, STATED SO IT CAN BE RUN.** This task is falsified if a fix rung that DID have
    enumerable failures stops dispatching, observable as a red required name with a non-empty
    `ciFailures` set that receives no strike. It is also falsified if rung spend does not fall on
    the empty-evidence path — measurable as `escalation.issue_opened` rows whose failing-check
    section is still empty after the change.

    **MEASUREMENT PROVENANCE.** `src/run-task.ts` is over the GitHub Contents API's 1 MB cap, where
    it returns `encoding: "none"` and greps to a clean zero, so every source figure here was read
    through git objects in a checkout fetched from `origin`. No ledger figure is quoted: `ledger-grep`
    refused on zero archives rather than answering from the live file, and a refusal is not a count.
