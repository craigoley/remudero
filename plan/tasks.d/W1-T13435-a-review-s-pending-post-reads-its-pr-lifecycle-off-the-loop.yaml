    - claim: "The fetchLifecycle that reviewCommand passes to its injected postReviewPending for the pending post returns a promise, and for an open, a merged and a closed pull request row it gives the same merged, closed, baseRef and reviewInputDigest as the synchronous fetchPrLifecycle of origin/main"
      proof: "grep: W1-T13435 criterion 1 in test/review/a-review-s-pending-post-reads-its-pr-lifecycle-off-the-loop.test.ts"
    - claim: "invariant:no-sync-gh-in-the-pending-post-lifecycle-read — calling that fetchLifecycle makes 0 synchronous child_process calls (execFileSync, spawnSync, execSync recorded) and 0 Atomics.wait cadence sleeps, and a 20 ms timer keeps firing while its gh read is held for one second"
