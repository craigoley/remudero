  rationale: |
    FOLLOW-UP of W1-T13865, filed by the sweep (W1-T12709) from https://github.com/craigoley/remudero/pull/19767 at 7c2e324439311dff01d32d0e20ecee66b2451c20: 1 of the task's 5 criteria need operator input; they move to a held follow-up task and the pull request merges on the rest.
    FINDINGS of the pull request:
    - priorRoundHold returns a FLAKE hold when the newest fix.done at this head ruled FLAKE and no required check has completed on this head since that round ended: proof executed and PASSED on the PR head (grep: W1-T13865 criterion 2: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts) — NOTE: reviewer judged the proof non-responsive (semantic downgrade): After a same-head FLAKE ruling with no new required completion, a classic protection HTTP 502 makes sweep.ts treat optional lint-plan as required on a release branch whose ruleset requires only release-gate. The in-memory run dispatched one fix worker. With protection readable, the same completion kept the hold.
    - invariant:no-round-at-an-unchanged-ruling — priorRoundHold returns no hold for a new head, for a check completed red after a FLAKE round, for a merged scope amendment after a NEEDS_SCOPE round, and for FIXED or NOT_LANDED rounds: proof executed and PASSED on the PR head (grep: W1-T13865 criterion 3: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts) — NOTE: reviewer judged the proof non-responsive (semantic downgrade): The sweep must release when the scope input changes. For a same-head amendment recorded only as amendment_url, the live reader confirmed a post-round merge and priorRoundHold released, yet sweep.ts still waited for pr.terminal. Reconciliation discovers only pr_url rows. The in-memory sweep dispatched only after a terminal row was supplied.
    - The sweep stands the fix rung down with the hold as its stand_down_reason and spawns no fix worker; the existing NEEDS_DESIGN hold is unchanged: proof executed and PASSED on the PR head (grep: W1-T13865 criterion 4: in test/a-fix-round-does-not-restart-on-an-unchanged-ruling.test.ts) — NOTE: reviewer judged the proof non-responsive (semantic downgrade): The design preserves every other path to a round. A valid repository-owner revise-pr reply widens the unfiled PR's allowed paths at the same head. The new sweep hold blocks that previously authorized round after NEEDS_SCOPE. The in-memory run dispatched zero workers after the grant, and the existing grant suite confirmed the same-head resume path.
    WHY: fix rounds that end without a change cost $49.50 of $95.09 fix spend (52%), 2026-11-05 to 2026-11-19.
    OBSERVED (ledger union, fix.done rows): NEEDS_SCOPE 83 rows $10.37, NEEDS_DESIGN 82 rows $6.80, NOT_LANDED 74
    rows $24.48, FLAKE 55 rows $6.82, BASE_RED 7 rows $0.53, unstated 5 rows $0.50. 53 rounds ($10.56) started at
    a task and head whose earlier round had already ruled NEEDS_SCOPE ($7.24 after) or FLAKE ($3.33 after); none
    followed NEEDS_DESIGN. fix.done records the head at the round's end, so this count is INFERRED to be close to,
    not equal to, the rounds started at an unchanged input.
    OBSERVED in code: the sweep (sweep.ts) holds the fix rung at a head whose round handed off NEEDS_DESIGN
    (the fix.needs_design row). resolveFixProgress (fix-progress-judge.ts, W1-T9502) reuses only continue and
    change-approach verdicts at an unchanged input. Nothing holds a head after a NEEDS_SCOPE or FLAKE round, so the
    next sweep can pay for another round at the same input.
  design: |
    INVARIANT no-round-at-an-unchanged-ruling: a fix round never starts at a head and input whose last round's
    ruling waits for a change that has not happened; every other path to a round is unchanged.
    1. fix-progress-judge.ts: export priorRoundHold(ledger, { taskId, headSha, contractRevision, checkCompletions })
       that reads the newest fix.done of the task at the head and returns { hold: "NEEDS_SCOPE" | "FLAKE", since }
       or undefined. NEEDS_SCOPE releases on a merged scope amendment for the task (fix.scope_amendment or
       pr.terminal merged for it) or a changed contract revision. FLAKE releases when any required check completes
       on the head after the round's ts.
    2. sweep.ts: next to the NEEDS_DESIGN hold, call priorRoundHold; on a hold, set standDownReason and break,
       the same way the NEEDS_DESIGN hold does. No count or cap: the hold ends when its input changes.
  falsifier: |
    Remove the priorRoundHold call from the sweep: criterion 4's fixture spawns a second fix worker at the same head
    after a FLAKE round and the test fails.
  note: |
