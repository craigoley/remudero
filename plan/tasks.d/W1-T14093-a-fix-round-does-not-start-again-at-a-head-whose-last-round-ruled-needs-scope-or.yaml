    (W1-T14001 to W1-T14110). #19767 has merged, so the question to the operator has no pull request to answer.
    The real gap is that a FLAKE round whose rerun came back red (flake_claim refuted or repeated) still holds its
    head; W1-T14201 fixes it. W1-T13944 fixes the repeated filing. This record keeps no question.
