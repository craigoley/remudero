  rationale: "THE BOUNDARY FIRST, BECAUSE FIVE SHARDS FROM THIS WEEKEND RISK READING AS ONE ANOTHER.
    W1-T532 (#1957) owns rarity-weighted overlap for two-ids-one-problem. W1-T534 owns the
    stale-snapshot half of duplicate dispatch and SHIPPED ITS PREDICATE. THIS OWNS ONE THING: SUPPLYING
    THAT PREDICATE'S ARGUMENT. It adds no detector, no row and no policy.

    (1) **THE DEFECT, RE-DERIVED AT 443c5f6.** `hasPushedRunBranch` is declared as an OPTIONAL dep on
    `NextRunnableOpts` and consumed in `nextRunnable` as `opts.hasPushedRunBranch?.(t.id)`, both in
    `src/lib/drain.ts`, and NOTHING IN `src/` EVER PASSES IT — the only suppliers anywhere are seven
    references inside `test/drain.test.ts`. Positive control: `isDispatchEligible` spans 8 `src/`
    files. Negative control: `hasPushedRunBranchZzq` reads 0. Its sibling `onSkipRunBranch` is
    unsupplied in exactly the same way.

    (2) **THE FAILURE MODE IS WHY IT SURVIVED REVIEW, AND IT IS THE POINT OF THIS TASK.** The optional
    chaining operator makes the miss invisible in BOTH directions: at runtime `opts.hasPushedRunBranch?.(t.id)`
    short-circuits to `undefined`, which is falsy, so the guard silently never fires and no error is
    ever raised; and at type-check the field is optional, so omitting it is legal. NO 'UNUSED EXPORT'
    RULE WOULD FLAG IT — the symbol IS used, at its own consumption site. `depcruise` is already wired
    as a CI job and CANNOT EXPRESS THIS: it operates on module dependency graphs, not on whether a
    call site passes an argument.

    (3) **THE SIBLING ALREADY PROVES THE WIRING SHAPE.** `onSkip` — same file, same options object,
    same optional shape — IS supplied in production at three sites: twice in `src/lib/drain.ts`
    (inside `runDrain`'s `skipOpts` and the lanes path) and once in `src/lib/daemon.ts`'s
    `dispatchOpts`, each logging `dispatch.skipped` with `reason: \"open-pr\"`. Those three objects are
    exactly where the missing argument belongs. This is a wiring omission beside a wired sibling, not
    a design gap.

    (4) **THE COST, AND ITS HONEST LIMIT.** Duplicate work is real and measured today: #1873 and #1874
    shipped the same `loadPlan` ENOENT fix over the IDENTICAL two paths — `src/lib/plan.ts` and
    `test/plan-sharding.test.ts` — with #1874 merged and #1873 closed unmerged. **BUT THAT PAIR IS OUT
    OF THIS GUARD'S SCOPE AND THE SHARD SAYS SO RATHER THAN BORROWING THE NUMBER**: both sat on
    `fix/…` branches, and the predicate parses `run-<id>-<epochMs>` ONLY, so it could not have seen
    them. The in-scope instance is #1975, on `run-W1-T911-1786889125459`, which rebuilt
    `reconcileRetroChangesetClaim` over three paths after that work was already closed as superseded.
    So the guard covers the `run-*` lane and nothing else; the `fix/…` and hand-named-branch class
    needs a different mechanism and is NOT claimed here.

    (5) **AND THE ID-COLLISION EVIDENCE IS LIVE WHILE THIS IS FILED.** Sweeping shard files in every
    open PR's DIFF rather than by branch name found #1974 and #1976 BOTH minting W1-T915 right now,
    and #1973 — on `run-TRIAGE-fb-1784901239119-1be356-1786888776855`, a branch no `run-W1-T*` glob
    matches — minting 913 and 914. That is the same family of defect one layer up: a check that cannot
    see the population it is meant to guard."
  design: |
    THE SHAPE: pass the argument that is already declared, consumed and tested. No new predicate, no
    new ledger step, no policy change.

    (i) THE SWEEP IS ONE `ls-remote` PER PASS AND THE PARSER ALREADY EXISTS. `runBranchTaskIds`
    (`src/lib/drain.ts`) is exported and unit-tested and turns raw `git ls-remote --heads origin
    'run-*'` output into a set of task ids, reusing `taskIdFromRunBranch` (`src/lib/status.ts`) rather
    than a second regex. Its own doc records the cost measurement this task rests on — 46 refs in
    199 ms with `core` remaining IDENTICAL before and after — because `ls-remote` speaks the git
    protocol and spends neither the REST nor the GraphQL budget. BUILD THE CLOSURE FROM ONE SWEEP PER
    PASS (`(id) => sweep.has(id)`), NEVER ONE CALL PER CANDIDATE; the per-candidate form is the whole
    cost argument inverted.

    (ii) THE SWEEP MUST BE INJECTED, BECAUSE `drain.ts` IS A PURE MODULE. Measured: `src/lib/drain.ts`
    carries ZERO `execFileSync`/`execSync`/`spawn` calls and no `node:child_process` import, against a
    control of 93 in `src/run-task.ts`. So the ref read belongs behind a new optional `DrainDeps`
    field beside the existing `refreshMerged`/`isOpenPr`/`readLiveState`, supplied by the caller —
    exactly the injection discipline `runOne` and `isOpenPr` already follow. `src/lib/daemon.ts`
    builds its own `dispatchOpts` and calls `nextRunnable` directly, so it is the second supplier site
    and needs the same closure.

    (iii) WHAT THE LOSER DOES — A SKIP, NEVER A TERMINAL STATE. `onSkipRunBranch` is already declared
    for this and its doc already rules on it: ride the EXISTING `dispatch.skipped` row with a distinct
    reason string. The task is NOT marked done, burns NO strike, does NOT escalate, and is offered
    again on a later pass once the branch is gone. Two rows are explicitly refused. `dispatch.stood_down`
    must NOT gain a fourth emitter: it has three emitters and NO reader — absent from
    `LEDGER_STEP_PATTERN` (`src/lib/autonomy.ts`), which carries its sibling `fix.stood_down`, and
    absent from `DECISION_RELEVANT_LEDGER_STEPS` (`src/lib/ledger.ts`, 25-entry control), so it does
    not even survive rotation. And no new step is minted, because that would be this task's own defect
    one layer up.

    (iv) THE ACCEPTANCE MUST PROVE THE ARGUMENT IS PASSED, NOT THAT THE PREDICATE WORKS. THIS IS THE
    WHOLE LESSON. `test/drain.test.ts` ALREADY asserts the predicate's behaviour in isolation, by
    injecting `hasPushedRunBranch` itself — and every one of those assertions PASSES TODAY AGAINST THE
    BROKEN PRODUCTION WIRING, because the test supplies what production omits. A test of that shape
    proves nothing about this defect. The falsifier must drive the REAL supplier construction and fail
    when the argument is dropped.

    (v) THE FALSIFIER, BOTH DIRECTIONS, OR IT IS UNVERIFIED. With the supplier wired, a task whose
    `run-<id>-<epochMs>` branch exists on origin is REFUSED and rides `dispatch.skipped`; with the
    supplier dropped from the same construction, the SAME task DISPATCHES. Both, in one test file, or
    the wiring is unproven.

    WHAT MUST NOT BE BUILT: a lint rule for unsupplied optional deps (see the note — the corrective
    precedent is a filing convention, not a guard); any change to `runBranchTaskIds`' parse; a second
    ref-reading path when `ls-remote` already exists in `src/run-task.ts` and `src/lib/worker.ts`;
    a new ledger step; per-candidate ref probing; and any attempt to cover `fix/…` or hand-named
    branches, which this predicate cannot see by construction.
