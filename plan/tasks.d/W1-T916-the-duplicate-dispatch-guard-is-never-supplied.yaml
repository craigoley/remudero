  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across three `src/` modules and a suite, and
    independently warranted: this changes what the fleet REFUSES to dispatch, so a wrong predicate
    does not fail loudly, it stops work being picked up. budget_usd 45 — one injected field, three
    supplier sites, a four-way falsifier.

    **`src/run-task.ts` IS DECLARED AND THE SERIALISATION COST IS ACCEPTED IN WRITING.** The supplier
    genuinely lives there: `runDrain` is called from `src/run-task.ts` where `DrainDeps` is
    constructed, and that file already runs `git ls-remote` (7 references) while `src/lib/drain.ts`
    cannot exec at all. Declaring it serialises this task against every other task naming that
    19,943-line file (`partitionByFileOverlap`, W1-T471). That is the price of wiring an effect and it
    is paid knowingly rather than avoided by declaring a path the change does not touch.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT IN PYTHON (a bare substring inflated
    `ghLiveState` from 6 to 11 in an earlier session). `src/lib/drain.ts` scores `hasPushedRunBranch`
    2, `onSkipRunBranch` 2, `runBranchTaskIds` 2, `nextRunnable` 19 and `onSkip` 10 — the predicate's
    home and two of three supplier sites. `src/lib/daemon.ts` scores `nextRunnable` 17 and `onSkip` 1
    — the third. `test/drain.test.ts` scores `hasPushedRunBranch` 7, `runBranchTaskIds` 6 and
    `nextRunnable` 49, the highest of any test path. `src/lib/status.ts` is NOT declared:
    `taskIdFromRunBranch` is reused unchanged, and declaring an untouched path fails
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`).

    **WHY NO LINT RULE IS PROPOSED, WHICH IS THE MOST USEFUL THING THE RECON FOUND.** The
    detector-without-supplier pattern is A FILING FACT, NOT A CODE FACT: each shard scoped its
    detector and deferred its action honestly in prose — W1-T520's design says 'IT REPORTS, IT DOES
    NOT ACT'. And the corrective precedent already exists and WORKED UNAIDED: W1-T528 filed the action
    half as its own shard with `depends_on: [\"W1-T520\"]` and shipped it end to end, which is why
    `armedButStalled` — named in the commissioning brief as an instance — has TWO call sites today
    (`selectUpdateBranchTarget`, and the emitter) feeding `updateBranchViaGh`. That refutation shrank
    the population from four to three and is the reason this shard is narrow. A convention that has
    already corrected itself once is a stronger answer than a guard nobody can express.

    **THE OTHER TWO ARE OUT OF SCOPE, NAMED SO THEY ARE NOT REDISCOVERED.**
    `CiFailure.outsidePrRange` is DOCUMENTED AS DELIBERATE NARRATION by `src/lib/sweep.ts` itself and
    is not a defect. `dispatch.stood_down` is untidy telemetry costing nothing today. Neither is
    filed, and neither should be folded in here.

    PROOF NOTES: all four proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
    file and one unrelated failure fails every criterion. Each was verified to match ZERO files under
    `test/` at 443c5f6 against a positive control matching exactly one, and each is under 100
    characters with no comma so `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail
    them. No proof names this shard.

    ID PROVENANCE: tree max was W1-T912 (id field and shard filenames agree) while `refs/rmd-id/`
    already held 515, 516, 520-534 and 901-915 — SO THE ALLOCATOR RUNS AHEAD OF THE PLAN AND SEVERAL
    IDS ARE RESERVED BUT UNFILED. The ref sweep is the only instrument that sees those. Sweeping shard
    files in every open PR's DIFF rather than by branch name found #1974 and #1976 BOTH minting
    W1-T915, and #1973 minting 913 and 914 on `run-TRIAGE-fb-1784901239119-1be356-1786888776855` — a
    branch no `run-W1-T*` glob matches. W1-T916 was verified free on origin/main (0) and in the ref
    list (0), taken as a UNIQUE ORPHAN PAYLOAD OVER THE EMPTY TREE (4b825dc6) carrying a
    host-pid-nanosecond nonce, pushed under `--force-with-lease` with the REFSPEC VARIABLE BRACED and
    the exit code captured INTO A VARIABLE rather than read through a pipe, then the ref was RE-READ
    and its nonce matched against the one written. Positive control: known-taken W1-T534 reads 2 and
    W1-T528 reads 3."
