  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, recorded up front rather than shipped as a
    lint refusal — the same correction already forced on W1-T1017, W1-T1086, W1-T1101 and W1-T1118.
    `subsystemsOf` reads several concerns off this `files:` list (the worker module, triage, the
    dispatcher monolith and two suites) and `lint-plan` refuses that below high. THE ACTUAL DIFF IS
    ONE SMALL EXPORTED HELPER, A `.filter()` ON ONE MATCHALL, AND THE CALL SITES THAT ADOPT THEM; no
    gate, bound, policy value, severity or verdict field moves.

    `files:` DERIVED BY READING THE CHAIN, not guessed. The join and `noPrReportExcerpt` live in
    src/lib/worker.ts; `parseGrillOptions`, `parseTriageVerdict` and `decideTriage` live in
    src/lib/triage.ts; the hand-rolled joins and the `escalateWithSummary` grill branch live in
    src/run-task.ts; the grill/summary end-to-end arms and `t348FakeWorker` live in
    test/triage.test.ts; test/worker.test.ts EXISTS today, so both whole-file proofs execute on day
    one. src/lib/feedback.ts is DELIBERATELY ABSENT — the summary gate does not move (design (iv)),
    and listing it would invite exactly the cap-raising "fix" that criterion refuses.
    src/lib/inbox.ts is DELIBERATELY ABSENT per the scope-out above.

    ON THE GREP PROOF. `workerTranscript` reads ZERO across the repo at head, so it DISCRIMINATES
    against the merge base rather than landing `executed_stale`, and it is stated POSITIVELY — it
    greps text the change ADDS, never the hand-rolled expression it removes. It is a CALL-SITE
    proof in the linter's own demanded form (`callSiteViolations`): the consumer path
    src/run-task.ts, not the module that defines the symbol, because a helper nothing calls is the
    W1-T348 defect this entry is a consequence of. The pattern carries no bracket, star, caret,
    dollar or the words ` in `, so it splits at the single ` in ` before its path, and that path is
    declared in `files:` (W1-T310).

    THE OTHER THREE CRITERIA TAKE THE WHOLE-FILE `unit test:` FORM DELIBERATELY: they are
    BEHAVIOURAL — "appears once, not twice", "two lines yield two options", "a summary lands where a
    raw body lands today" — and a grep cannot express a count or a distinction.

    verify:auto — every criterion is decidable in-process against fixtures the suites already build
    (test/triage.test.ts already drives `triageCommand` end to end against an injected `spawn` and a
    bare origin). The one live-ish step, design (i)'s envelope measurement, is a READ that informs
    the PR body; it gates no criterion, so no criterion needs a human.

    budget_usd 35 — above W1-T1118's 30 because the SDK measurement is real work and the call-site
    conversion spans the monolith, far below W1-T348's 70, which built the wiring this repairs.

    NO depends_on. W1-T348 is the task whose test surfaced this and it is `status: queued` — but
    this shard REPAIRS A DEFECT THAT EXISTS AT HEAD in `parseGrillOptions` and the joins, both of
    which predate it, and blocking behind a queued task would leave the over-count standing. File
    overlap on src/run-task.ts and test/triage.test.ts is the correct and sufficient interlock:
    `overlappingPaths` will serialise the two lanes without a declared dependency.

    RE-READ THE SOURCE BEFORE ACTING RATHER THAN QUOTING THIS SHARD. Every line number and symbol
    above was read off src/lib/worker.ts, src/lib/triage.ts, src/lib/feedback.ts and src/run-task.ts
    during triage of fb-1785959570301-a65f94; the join sites and the ambiguous branch's guards are
    the things most likely to have moved.
