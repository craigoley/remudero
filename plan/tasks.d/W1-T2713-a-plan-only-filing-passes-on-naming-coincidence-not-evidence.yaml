- id: W1-T2713
  title: "THE ONE LANE THAT CAN FAIL A PLAN-ONLY FILING SCORES VOCABULARY OVERLAP BETWEEN TWO TEXTS THE AUTHOR WRITES INDEPENDENTLY — `judgeCriterion` takes `proofKeywords(criterion.proof)` from the SHARD but `reportTokens` from the PR BODY, so a filing passes or fails on whether its test FILENAME happens to echo its own prose; MEASURED 2026-09-02: #3665 cleared `MIN_COVERAGE` at 4/6 = 0.667 only because `provider-routing-console-controls` repeats words its body already used, while the same body scores 0 on any test path named differently"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 10.00
  files: [src/lib/review.ts, test/a-plan-only-filing-passes-on-naming-coincidence-not-evidence.test.ts]
  origin: "operator-session#floor-scores-naming-coincidence-2026-09-02"
  plan_refs: ["W1-T205", "W1-T178", "W1-T219", "W1-T1100", "W1-T2221"]
  status: queued
