  rationale: |
    OVERLAP: W1-T10913 (queued) also edits src/run-task.ts and docs/cli-reference.md, for the field-trials flags only. This task adds a flag to the judge-replay verb of W1-T12418; the two touch different entries of the command registry.
    WHY: the operator asked on 2026-11-12 for a benchmark that replays the judge corpora through each decision model and each open-weight judge, scored by Brier, log-loss, agreement, latency and cost (backlog item BM1). Live shadow rows build up slowly, so a new candidate needs a first record offline.
    DECISION ON THE OVERLAP WITH W1-T12418 (task E): EXTEND IT, DO NOT AMEND IT. E is queued in PR #18175 (not on main), so an amendment from this branch would edit a file that main does not have. E's lane is an Anthropic Message Batch through the secret boundary. Its own design says the Decisions candidates "cannot go through any batch" and "replay through W1-T12416's single requests instead", but no task builds that path. This task builds it as a second lane in E's module, src/lib/judge-replay-batch.ts, with E's corpus reader and E's recorded-answer rows, so there is one harness and one scorer input.
    READ 2026-11-12 in the operator's decision-model handoff (phase 2) and in E, W1-T12416 and W1-T12414:
    - OpenAI Decisions is not a Batch endpoint. Microsoft-Decision-1 accepts 32,768 input tokens. The open-weight deployments document no logprobs, so as judges they give one answer (agreement only).
    - Prices per 1M tokens: Decisions on gpt-6-luna $0.10 input and no output charge; Microsoft-Decision-1 $0.042 input.
    READ 2026-11-12 in the source at origin/main 920669542:
    - test/fixtures/machine-judge-probes.json and test/fixtures/risk-judge-dispositions/ (9 YAML files) are the corpora E reads. test/fixtures/golden-verdicts/ (45 entries) holds verdicts for prompt changes (src/lib/measurement-cadence.ts:3392), not typed judge cases, so this task leaves it out.
    - src/lib/worker-provider.ts:3548 gpt-oss-120b $0.15/$0.60, :3529-3546 DeepSeek-V4-Flash $0.19/$0.51, DeepSeek-V4.1-Flash $0.30/$1.20 and Kimi-K2.6 $0.95/$4.00 per 1M input/output tokens.
    - :1012-1021 W1-T10856 learns each deployment's per-minute token limit from response headers; criterion 2 waits inside it.
    OBSERVED 2026-11-12 by the operator session: decision-1 answered 429 after two calls at capacity 1, and after the raise to capacity 100 the limiter took about 15 minutes to allow 100 requests a minute. A replay must pace itself and stop cleanly on a 429.
  design: |
    1. In src/lib/judge-replay-batch.ts give `replayJudgeCorpus(config, {model, corpus, lane})` a `lane` of `batch` (E, the default) or `direct`. The direct lane resolves the candidate: a decision_models name goes through `askDecisionModel` (W1-T12416); a cash deployment name goes through `sendCashRequest` (W1-T12413) with the role's prompt and the role's parser.
    2. Read the cases with E's reader. Send one case per request, one at a time, and wait between requests while the learned per-minute limit cannot hold the next one.
    3. Replay ceiling: refuse to start when the estimate is above $1.00 per candidate per corpus. The builder may set a measured value and says why in the pull request. Each request reserves through `sendCashRequest`, never the squeezed figure.
    4. Write each answer as E writes it, with `model_surface` from W1-T12420 (decisions for a decision model, text for a cash deployment). Write one `judge_replay.finished` row, declared in src/lib/ledger-steps.ts and src/lib/producer-identity.ts.
    5. `rmd judge-replay --lane direct --candidate <name> --corpus <name>` runs it. The verb in src/run-task.ts reads the flag with `parseJudgeReplayLane`, exported from src/lib/judge-replay-batch.ts. Add the flags to docs/cli-reference.md.
    NOT IN SCOPE: running the replay on its own (W1-T12422 does that from the measurement cadence); any judge, gate or route reading the result; the golden verdicts.
  falsifier: |
    Put two cases in one request and criterion 2 must fail. Send before the estimate check and criterion 3 must fail. Score a single answer with Brier and criterion 4 must fail. Score an abstention as wrong and criterion 5 must fail. Restore and require all to pass.
