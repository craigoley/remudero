  acceptance:
    - claim: "`replayJudgeCorpus` takes a lane, batch or direct. The direct lane reads the same corpora as the batch lane and sends each case as one request: to a decision_models candidate through askDecisionModel, or to a cash deployment through sendCashRequest with the role's own prompt and parser"
      proof: "grep: W1-T12421 criterion 1 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
    - claim: "Each case is one request about one input, and two cases never share a request. Cases are sent one at a time and wait inside the deployment's learned per-minute limit. A 429 that stays after one retry, or a budget refusal, stops the replay with a named reason and keeps the answers already written"
      proof: "grep: W1-T12421 criterion 2 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
    - claim: "Before the first request, the replay estimates the corpus cost from its input sizes and the candidate's price row, and refuses to start when the estimate is above the replay ceiling. Each request then reserves against the normal figure of the daily cash cap"
      proof: "grep: W1-T12421 criterion 3 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
    - claim: "Each result is one recorded typed answer with the case's expected answer as its outcome, keyed by role, model id and model surface, so W1-T12414's scorer gives Brier and log-loss for a distribution and agreement only for a single answer"
      proof: "grep: W1-T12421 criterion 4 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
    - claim: "A case that is larger than the candidate's input limit is counted as too large and is not sent. An abstention and a rejection are counted apart and are never scored as a wrong answer"
      proof: "grep: W1-T12421 criterion 5 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
    - claim: "Each replay writes one judge_replay.finished row: candidate, model surface, role, corpus name and digest, cases sent, answered, abstained, rejected and too large, settled dollars and median latency, or the reason it stopped"
      proof: "grep: W1-T12421 criterion 6 in test/worker/spawn/the-judge-corpora-replay-one-request-at-a-time.test.ts"
