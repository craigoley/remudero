  rationale: |
    (1) HALF ONE, RE-DERIVED FROM THE LIVE ISSUE RATHER THAN CARRIED. `issues/2624`'s
    "Failing check(s):" section renders, verbatim:
      - ci — ci	Typecheck	2026-08-23T16:01:14.5196266Z ##[group]Run npx tsc -p tsconfig.json --noEmit
      - ci-gate — ci-gate	Aggregate sibling check results …	2026-08-23T16:12:44.8447744Z --- gated check runs ---
    Both entries are STRUCTURAL PREAMBLE: an invocation banner and a section header. The real
    diagnostic -- `test/sandbox-subject-generator.test.ts(90,9): error TS2741: Property
    'bySubsystem' is missing … but required in type 'LearningsIndex'` -- appears NOWHERE in the
