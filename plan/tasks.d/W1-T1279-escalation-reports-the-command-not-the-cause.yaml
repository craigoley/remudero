  design: |
    ONE CONCERN: make the escalation name the cause and the trajectory, without making it longer.

    (i) Q1 -- WHERE THE ERROR LINE IS DISCARDED, BY NAME. The diagnostic is in hand at escalation
    time and is thrown away by ONE expression.
      HAS IT      `fetchCiFailures` (`src/run-task.ts`) populates `CiFailure.logTail` with the last
                  60 lines of the `--log-failed` extract (`tailLines = 60`).
      USES IT     `renderFixPrompt` renders that field IN FULL into the fix worker's prompt --
                  `log tail:\n${neutralizeFenceMarkers(f.logTail)}`. The rung has already read the
                  diagnostic, which is why the fix worker could act on it at all.
      DROPS IT    `summarizeCiFailure` reduces the SAME field to `.find((l) => l.length > 0)` and
                  returns `${f.name} — ${firstLine}`.
      RENDERS IT  `renderEscalationEvidence(currentCiFailures ?? [], (f) => `- ${summarizeCiFailure(f)}`, …)`
                  at the exhaustion escalation's "Failing check(s):" block.
    WHAT IS LOST BETWEEN THEM: every line of `logTail` after the first non-empty one -- which is
    where the diagnostic always is, because the first line is always the banner. The fix is a
    SELECTION change inside `summarizeCiFailure`, not a new fetch, a new field, or a new call.

    (ii) THE SELECTION MUST BE A CHOICE, NOT A BIGGER SLICE. Rendering more lines is the wrong
    shape -- it trades a useless line for a wall. What the line should carry is the first line that
    LOOKS LIKE A DIAGNOSTIC rather than a banner: strip the `<job>\t<step>\t<timestamp> ` prefix
    the extract adds, skip `##[group]` / `##[endgroup]` / `---`-banner / bare-timestamp lines, and
    prefer a line matching a compiler/test-runner diagnostic shape. WHEN NOTHING MATCHES, FALL BACK
    TO TODAY'S FIRST LINE rather than to nothing: a banner is a poor summary but an empty one is
    worse, and the W1-T487 empty-evidence wording must keep its meaning.

    (iii) Q2 -- THE CASCADE IS ALMOST DERIVABLE, AND THE HONEST ANSWER IS "ONE SMALL FIELD", NOT
    "ONLY A JOIN" AND NOT "A LARGER TASK". The step names in the brief are REAL, confirmed from
    source: `fix.dispatch`, `fix.ci_not_green`, `fix.exhausted` all exist. Their FIELDS do not
    carry check names: `fix.dispatch` logs `{strike, strike_cap, unmet_count, round, mode,
    verdict_regime, elapsed_ms}`; `fix.ci_not_green` logs `{strike, ci}` where `ci` is
    `waitForCiGreen`'s status word; `fix.exhausted` logs `{strikes, issue_url, reason}`. The names
    DO exist on `pr.polling`, as `checks: ["<name>:<conclusion>", …]` -- but that row is emitted
    only `if (i === 0 || i % 5 === 0)`, is keyed by poll rather than by strike, and is a
    high-volume step subject to the 200-rows-per-step rotation. A time-join against strike windows
    would therefore be SAMPLED and PRUNED, which is a fragile basis for a claim shown to an
    operator. The robust form is one added field on `fix.ci_not_green`, which already carries
    `strike`, naming the checks that were red for THAT strike. That is small rather than large
    because `fetchCiFailures` runs immediately after that log call and the names are already in
    hand -- but it IS new ledger data, and it is priced here rather than smuggled in as a join.

    (iv) Q3 -- WHAT MUST NOT CHANGE. The escalation stays SHORT AND DECIDABLE. It keeps its
    `## Options` and `## Recommendation` sections -- both verified present on the two measured
    issues -- and stays ONE ISSUE PER BLOCK. This task adds THE CAUSE and THE TRAJECTORY, both as
    single lines, and adds no log dump: pasting a 376-line job log would be a different and worse
    defect than the one being fixed. The escalation TAXONOMY (blocked / manual / hard_stop) is not
    touched, and neither is WHEN an escalation fires -- W1-T487's design note (iii) already rules
    that the evidence block changes what the body says, never whether it is sent.

    (v) BOTH DIRECTIONS. A change that simply printed a later line would satisfy the diagnostic
    case while regressing a check whose output has no diagnostic shape at all, so every criterion
    is paired with the behaviour it must leave untouched: the empty-evidence wording, the
    one-line-per-check budget, and the fallback.
