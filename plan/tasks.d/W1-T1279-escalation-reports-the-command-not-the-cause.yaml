    (2) AND IT IS DETERMINISTIC, NOT UNLUCKY -- WHICH IS THE PART THAT MAKES IT WORTH FIXING.
    `fetchCiFailures` shells `gh run view --job <id> --log-failed`, which emits ONLY the failing
