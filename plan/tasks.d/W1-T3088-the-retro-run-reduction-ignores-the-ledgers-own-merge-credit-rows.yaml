- id: W1-T3088
  title: "THE RETRO'S RUN REDUCTION IGNORES THE LEDGER'S OWN MERGE-CREDIT ROWS — the sweep's credit backfill appends a `verdict.merged` row for every gate-side merge it observes, but it keys that row on the SWEEP'S run id, and `gatherRuns` reads only the `verdict` step of the task's own run, so a run that merged gate-side still reduces to `blocked_ci` in every calibration table, `mergedSince`, `degradedSuccess` and the credit union's own denominator, and the retro pays a REST read to rediscover a fact its ledger already holds"
