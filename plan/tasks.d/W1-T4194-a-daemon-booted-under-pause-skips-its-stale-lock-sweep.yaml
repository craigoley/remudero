  design: |
    (i) Under a boot hold, the stale-lock sweep that `daemonBoot` runs for dead pids from a previous container identity
        still runs; everything else `daemonBoot` does stays held. (ii) The sweep releases only locks whose holder is
        provably dead, exactly as on an unheld boot, so a hold never widens what it may delete.
