    alerts)."
  design: |
    (i) RECON FIRST, live: enumerate all 37 alerts via `gh api repos/<owner>/<repo>/code-scanning/alerts
    --paginate -q '.[] | select(.rule.id=="js/unused-local-variable" and .state=="open")'` (or the
    equivalent per-number `gh api .../code-scanning/alerts/<n>`), and record each alert#/file/line/variable
    in a checked-in backlog artifact (docs/codeql-unused-locals-2026.md) BEFORE any source edit — this
    artifact is the deliverable's audit trail and the acceptance test's data source.
    (ii) FIX, not suppress: for each enumerated alert, remove the unused local/parameter or, where the
    variable is genuinely load-bearing (destructuring, a required interface parameter), prefix it with `_`
    per the house convention (W1-T68's own design note) rather than deleting it. NO `// eslint-disable`,
    `// lgtm`, or CodeQL suppression annotation may be added to silence a flagged line instead of fixing it
    — a suppressed-not-fixed alert is a FAILED task (mirrors Standing rule 15's spirit: the criteria must be
    met by the work, never edited/hidden around).
    (iii) VERIFY narrowly: a SCOPED compiler probe (not the global tsconfig flag) — `tsc --noUnusedLocals
    --noUnusedParameters --noEmit` invoked ONLY over the files this task actually touches (the enumerated
    set from (i)) — proves the fix without pre-empting or duplicating W1-T68's global-flag decision.
    (iv) The `files:` list below is illustrative (the historical W1-T68 cluster plus run-task.ts/review.ts/
    status.ts, which commonly carry short-lived locals) — the AUTHORITATIVE scope is whatever the live
    enumeration in (i) returns; a file not listed below but named by a real alert is still in-scope, and a
    listed file with no matching alert is out-of-scope (do not invent edits).
