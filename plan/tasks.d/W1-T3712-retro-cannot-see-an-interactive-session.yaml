- id: W1-T3712
  title: "RETRO LEARNS ONLY FROM DISPATCHED RUNS, SO IT IS BLIND TO THE SESSIONS THAT PRODUCE THE MOST LESSONS — `gatherRuns(records)` makes the LEDGER the whole corpus, and an interactive operator/agent session writes no run rows, so its traps can never enter the loop that exists to collect them"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: medium
  band_meaning: blast-radius
  budget_usd: 12.00
  files:
    - src/lib/retro.ts
  origin: "operator-session#is-the-shift-left-loop-effective-2026-09-16"
  plan_refs: ["W1-T2288", "W1-T33", "W1-T3709"]
  status: blocked
  retirement: closed
  # CLOSED 2026-09-20 by operator authorization: session lessons land at discovery; no session harvester is wanted.
  attempts: 0
  note: |
    MEASURED 2026-09-16. The loop is HEALTHY on every axis except its input:

      retro last ran      2026-09-16T13:59:06Z   (state/last-retro.json on the fleet volume)
      retro-origin shards 69
      built and credited  65 of 68 -- 96%
      guardrails authored 3 of 63 corpus-wide; the OPERATOR authored 57

    Retro's per-task guardrail rate (4%) is the same as the operator's (5%) -- it is not producing
    worse items, it is producing FAR FEWER: 68 tasks against 1,052. The input is why.

    `gatherRuns(records)` (`src/lib/retro.ts`) is the gather, and `records` is the ledger. An
    interactive session -- an operator at a terminal, or an agent in one -- writes no run rows, so
    nothing it learns is reachable by the loop. Of the eight gates that caught real defects in one
    2026-09-16 session, exactly ONE (`W1-T2905`) was retro-authored; the rest are `oper#` and
    `operator-session#`.

    THIS IS NOT W1-T2288, which is already fixed. That task found the TRIGGER iterating runs and was
    shipped as "count merges the retro reviews, not only merges with a worker run" (#2946). The
    trigger now counts merges; the GATHER still reads runs. Same word, different function, and the
    fix for one did not touch the other.

    FOUR CONCRETE LESSONS THE LOOP COULD NOT SEE, from a single session, each measured:
      1. `git add -A -- test` swept a killed test run's probe fixture into a commit, reddening
         task-linter-wiring.test.ts on two PRs via a suite neither diff touched.
      2. `gitRepo()` sets committer identity only for its own git calls, so a fixture whose subject
         shells `git commit` passes on darwin and fails on Linux CI with "empty ident name".
      3. A red `coverage-ratchet` is rarely a coverage threshold; with all shards green it means
         SUPERSEDED, and the cause underneath is usually `diff-coverage: BLOCKED`.
      4. Merging the TIP of a stacked PR silently merges every PR beneath it, leaving them open with
         an empty diff and a proof-discrimination red that reads as a proof defect.

    WHERE THEY BELONG IS PART OF THE PROBLEM. (3) and (4) are repo-wide and want `learnings/`, where
    `files:` matching injects them per task. (1) and (2) are traps of an INTERACTIVE session on a dev
    machine -- a fleet worker runs on Linux and would hit (2) immediately -- so they may want
    `doctrine/`, which costs the interactive lane a per-session tax and costs a dispatched worker
    nothing (`spawnWorker` passes `settingSources: []`). Deciding that routing is in scope here.
  rationale: |
    The loop's purpose is to convert experience into a fact a future worker inherits. It converts
    DISPATCHED experience at a 96% build rate, which is strong. It converts INTERACTIVE experience at
    zero, and interactive sessions are where the operator works, where every ruling is made, and --
    measured above -- where 57 of 63 guardrails came from.

    THE HONEST COUNTERPOINT: an interactive session has no ledger, no run id, no cost row and no
    verdict, so it cannot simply be fed to the same gather. Whatever this builds must not pretend
    otherwise by inventing run-shaped rows for sessions -- that would put fabricated evidence into
    the one corpus whose value is that its entries are measured. A separate intake with its own
    provenance marker is the likelier shape than a widened `gatherRuns`.

    AND IT MUST NOT ASSUME ROOM TO WRITE. W1-T3709 measured the learnings corpus at 41,714 of a
    42,000 cap -- 286 chars of headroom, unable to accept one more entry. An intake that files more
    lessons into a full corpus fails at the ratchet. W1-T3709's two-tier split is the prerequisite,
    not an optional companion.
  acceptance:
    - claim: "a lesson from a session with no ledger rows can enter the corpus, with provenance that does not claim to be a run"
      proof: "grep: gatherRuns in src/lib/retro.ts"
    - claim: "the intake refuses to fabricate run-shaped evidence for a session that had none"
      proof: "grep: interactive in src/lib/retro.ts"
  falsifier: |
    Close WITHOUT building if the operator rules that interactive lessons belong in `doctrine/` and
    CLAUDE.md by hand, authored by the operator rather than harvested. That is a legitimate answer --
    it is how all 57 operator guardrails got there -- and it makes this task unnecessary rather than
    merely deferred. Record the ruling either way.

    The finding itself falsifies on one command: if `gatherRuns` stops being retro's only corpus, or
    a session-shaped intake already exists, this is stale.
