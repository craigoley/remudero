- id: W1-T3491
  title: "FLEET PAUSE AND STOP MUST FENCE EVERY LATER WORKER ADMISSION"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  risk: high
  origin: "issue#5328"
  plan_refs: ["W1-T11", "W1-T1065", "W1-T2584", "W1-T2981", "W1-T2986", "W1-T2659"]
  files:
    - src/lib/daemon.ts
    - src/lib/sweep.ts
    - src/run-task.ts
    - test/daemon-pause-before-admission.test.ts
    - test/sweep.test.ts
