  rationale: |
    OBSERVED on the fleet host (core ledger union, niced zgrep of named archives):
    - 2026-10-13T02:56:30Z panel.proposal_declined verify-human:W3-T7, origin rmd-cli, reason "Later-wave
      design-review skill whose dependencies (W3-T2, W1-T44) are unmerged ... reversible with rmd restore",
      archived in ledger.2026-10-13T03-41-58-104Z.ndjson.gz; 10-13T11:14Z inbox.classified state declined;
      10-14T01:54:18Z inbox.thread_answered action question (origin inbox-responder). The live file now holds
      exactly 200 panel.proposal_declined rows (193 fleet-lane folds), none for W3-T7.
    - The re-surfacing itself is fixed by the receipt store in PR run-unfiled-1792264108185 (every classifier
      and the responder read archived declines). Two gaps remain, both this task:
    - run-task.ts priorVerifyHumanVerdicts(rows) is fed readLedgerLines(ledgerPath), the live file only. The live
      file holds 201 verify_human.judged rows, the cap. A settled shard whose row rotates away is due again
      (shardsNeedingJudgement), costs a judge call, and its needs_operator verdict re-stages the proposal.
    - A decline carries a reason and no observed state. verify-human-judge.ts observedStateKey already names the
      facts that can change the answer (deps merged, cited in src, why-me receipts). Today a decline never lapses:
      a dependency merging after the decline cannot bring the item back, and nothing tells the operator why it would.
  design: |
    1. The judge's prior verdicts come from the archive union plus the live file (the slow lane's union read already
       collects verify_human.judged, panel-graph.ts readRetainedHumanReleases), persisted beside the decline receipts
       and read by routeVerifyHumanBacklog's callers, so rotation never re-opens a settled observed state.
    2. A decline of a verify-human proposal records the observed state key current at the decline in its ledger row
       (`observed_state`) and its receipt.
    3. A declined verify-human proposal whose CURRENT observed state key differs from the decline's lapses: it is
       classified as before the decline, and its item carries `reopenedBecause` naming what changed in words the
       operator reads (for example "W3-T2 and W1-T44 have merged since you declined this on 2026-10-13"). A decline
       with no recorded state (every row before this task) never lapses. `rmd restore` still reverses any decline.
    4. The judge does not judge a proposal while its decline holds. The lapse test is one function,
       `declineLapse(receipt, currentObservedState)` in verify-human-judge.ts, called by panel-graph.ts's classifier;
       the receipt store module from the PR above records `observed_state` beside each receipt.
    5. TESTS in test/a-decline-holds-until-the-state-it-judged-changes.test.ts, test( titles verbatim as below.
