- id: W1-T3436
  title: "A WORKER CAN PASS PRE-PUSH WHILE ADDING A NEGATED OPTIONAL-CHAIN CONFLATOR — the catch-erasure ratchet catches it only after CI starts, and the hook correctly refuses to spawn test suites"
  repo: remudero
  depends_on: [W1-T3225, W1-T3423]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  risk: high
  origin: "operator-session#recurring-red-pr-root-cause-2026-09-12"
  plan_refs: ["W1-T2295", "W1-T2595", "W1-T3225", "W1-T3423"]
  files: [scripts/erasure-conflator-precheck.mjs, hooks/pre-push, test/catch-erasure-ratchet.test.ts, test/erasure-conflator-precheck-refuses-before-push.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED ON THE W1-T3423 REPAIR BRANCH AT 72f14874: `rmd preflight --fast` failed
    `catch-erasure-census` on `src/lib/ci-control-plane.ts: !entry.reason?.trim()`. The census's
    property named that exact unbaselined negated optional-chain conflator. Replacing it with an
    explicit nullish fallback and equality comparison made the isolated census pass 26/26.

    THE EARLY DETECTOR EXISTS, BUT ONLY AS A TEST. `test/catch-erasure-ratchet.test.ts` owns the
    optional-chain parser and its reviewed baseline. `rmd preflight --fast` executes that test, but
    no worker-facing refusal requires the command. The pre-push hook runs rule 15, rule 25, tier
    admission, and W1-T3423's CI-control-plane route; it does not run a test suite.

    DO NOT REVERSE W1-T3225. That task removed the hook's generic census test-runner path after it
    damaged shared Git state and caught none of its measured incidents. W1-T2595 is also not an
    open solution: it is blocked because it already achieved census admission to `preflight --fast`.
    This task closes the remaining invocation gap with one diff-scoped static check, not a second
    fast-preflight contract and not a generic `node --test` invocation.

    W1-T3423 IS A MODEL, NOT COVERAGE. Its static route proves workflow registry, parity-table, and
    capability-snapshot consistency when those control-plane files change. A general source edit
    such as the expression above is outside that route, so adding this detector is neither a
    duplicate nor a widening of the CI-control-plane predicate.
  design: |
    (i) Extract the negated-optional-chain scanner and its reviewed baseline from the census test
    into a pure export of `scripts/erasure-conflator-precheck.mjs`. The census imports that exact
    export. Do not duplicate a regex in a hook script: two detectors that disagree would turn a
    pre-push pass into a false certificate.

    (ii) Add a static script that obtains the local merge base with `origin/main`, considers only
    added or modified `src/**/*.ts` files, scans their current contents with the shared detector,
    subtracts only the existing reviewed baseline sites, and refuses any remaining site. An unreadable
    base or diff must report that it could not decide and refuse; a non-source diff must report a
    named skip. The script performs no network call, writes no baseline, and runs no test runner.

    (iii) Wire that script into the armed pre-push hook after its existing static routes. Preserve
    W1-T3225's structural boundary: no `node --test` from the hook. The route must apply to the
    branch's staged-to-push diff, not merely the working tree, and it must name each file and source
    expression so the worker can make the semantic repair before opening a red PR.

    (iv) Test through a real linked-worktree push. A newly introduced negated optional-chain
    conflator must refuse before the remote moves; a changed file containing only a reviewed baseline
    site must pass; an unrelated source edit must pass and show the named skip or clean result. The
    test must also prove that the hook launches no test runner and does not mutate the baseline.
  acceptance:
    - claim: "a changed source file that introduces an unbaselined negated optional-chain conflator is refused by the real pre-push hook before its remote branch moves, naming the file and expression"
      proof: "unit test: W1-T3436: an unbaselined conflator refuses the real pre-push hook"
    - claim: "a changed source file with only a reviewed baseline site passes, so the new route does not re-refuse existing debt"
      proof: "unit test: W1-T3436: a reviewed baseline site passes the real pre-push hook"
    - claim: "the route uses the census's shared detector, runs no test runner, performs no network call, and never rewrites a baseline"
      proof: "unit test: W1-T3436: the hook route shares the detector without a test runner or writes"
  falsifier: |
    CLOSE WITHOUT BUILDING if an armed real pre-push hook already refuses a newly added
    `!value?.method()` in a changed src TypeScript file without spawning a test runner, and the
    refusal is generated by the same detector and baseline the census uses. A green CI result, a
    prompt sentence, or an existing `preflight --fast` command does not satisfy that condition.
