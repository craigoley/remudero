    READ at origin/main 7cfdd7775:
    - decideDepReview routes a parseable MAJOR to `migrate` (W1-T2705: captureFeedback with origin
      repair#dep-review, then ignore and close), but a minor/patch with red checks only ever reaches `hold`.
    - offendingFiles refuses any diff outside the manifest/lockfile allowlist, so a companion test edit pushed
      onto the Dependabot branch turns `hold` into `refuse`: there is no in-place fix path, by design.
    - the sweep's dep-review row outranks the ci-log fix rung (deliberately: no fleet commits on a bot branch).
  design: |
    In the dep-review pass, a `hold` whose red W1-T9584 classifies as the PR's OWN (a check main's newest
    genuine run passes, or a red that survived one requested Dependabot refresh) becomes a migration proposal,
    reusing the W1-T2705 capture path rather than a new one:
    - captureFeedback (origin repair#dep-review) with a body naming the PR, its head, the bumps parsed from the
      Dependabot summary, every red check, and the instruction to land the SAME version moves plus the companion
      edits on an owned task branch (tests that pin the old literal, derived pins such as the image CLI that must
      equal the locked SDK's claudeCodeVersion, and any sibling Dependabot PR whose bump the fix needs, named by
      number). Submission key = (owner, repo, sorted bumps), so a regrouped Dependabot PR with the same bumps
      files nothing new, and a sibling PR whose bumps the proposal already names is folded in, not re-filed.
    - Unlike a major: NO `@dependabot ignore` comment and NO close. The Dependabot PR stays open and is closed by
      the existing superseded-by row once the owned PR contains its hunks, or by Dependabot itself once main
      carries the versions.
    - Ledger `dep-review.own_red.feedback_captured` {pr_url, head_sha, feedback_id, red_checks}; a capture failure
      ledgers and keeps the hold (fail closed, as the major path does). The 24 h hold escalation stays as the
      backstop for a red that is neither main's nor classifiable.
  acceptance:
