      `actions/setup-node@820762786026740c76f36085b0efc47a31fe5020` (the bump moves it to 949feb24…). The
      same literal-pin shape holds the old SHAs in test/coverage-merged-artifact.test.ts (upload-artifact
      043fb46d…) and test/semgrep-native-install.test.ts (upload-sarif 2892aa5e…), matching the other two red
      shards (7/8, 8/8). CI log read: job 116165924141, `# tests 4116, # fail 1`.
    - #11788 (npm root group, head b00fda7b): test/the-haiku55-image-pins-match-its-sdk.test.ts asserts the
      locked SDK is the literal "0.3.293" and claudeCodeVersion "2.1.293"; the bump moves the SDK to 0.3.296
