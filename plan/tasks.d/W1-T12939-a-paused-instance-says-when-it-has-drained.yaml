  rationale: |
    OBSERVED 2026-11-15, Azure host reboot for OS updates, by the operator session.

    - The operator ran `rmd pause --fleet` at 14:22:03Z and needed to know when all three instances had drained before rebooting. Nothing reports that. `rmd pause --status` prints the hold, and `daemon.pause` rows carry tick, detail and poll interval only (READ src/lib/daemon.ts).
    - The session wrote a process watch by hand. Its first version matched one worker binary path and reported the fleet drained at 14:26Z while two runs were live in core: a build of W1-T12146 started 12:32Z whose worker was two hours in and in its pre-push checks, and a fix round on #18608 started 14:16Z. The mistake was caught by reading the process table again. Both runs finished by 14:33Z; a reboot at 14:26Z would have lost both.
    - A second watch counted four process shapes and live in-flight locks and required two clear readings. It reported drained at 14:35Z, which the ledger confirmed (implement.done 14:30:40Z, fix.done 14:32:46Z, pr.opened 14:33:04Z).
    - The daemon already knows every unit it owns: it is what admits and settles them. The fleet heartbeat (scripts/fleet-heartbeat.sh, published to the heartbeat-azure branch) is already readable off the host.
  design: |
    1. daemon.ts: the paused branches of the loop compute the in-flight census from the registries the loop already holds (run children, the review and fix lanes' in-flight sets, garden children, pending judge calls) and add `in_flight` to daemon.pause. No new process probe.
    2. One hold is one episode, keyed by the hold's own identity (the PAUSE file's or the shared hold ref's content). The first empty census writes daemon.drained; a later non-empty one writes daemon.drain_reopened; a released hold ends the episode.
    3. fleet-heartbeat.sh derives drain_verdict per instance from the newest of daemon.pause, daemon.drained and daemon.drain_reopened, with the same staleness rule the beat uses for daemon_verdict. An unreadable or stale ledger is `unknown`.
    INVARIANT pause-behaviour-unchanged: what a held instance starts, finishes and logs today is unchanged except for the added field and rows.
    NOT IN SCOPE: a command that waits for the drain; stopping in-flight work; a fleet-wide verdict computed by the daemon (the heartbeat's per-instance lines are the fleet view).
  falsifier: |
    Leave review children out of the census and criterion 1 must fail. Write daemon.drained on every paused pass and criterion 2 must fail. Print drained for an unreadable ledger and criterion 3 must fail. Write daemon.drained for an instance that is not held and criterion 4 must fail. Restore and all pass.
