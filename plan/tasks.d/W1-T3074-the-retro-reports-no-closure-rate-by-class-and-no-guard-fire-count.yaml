  rationale: |
    MEASURED 2026-09-07 over `origin/main` (3,586 commits) and `plan/tasks.d/`:
      - the corpus grew 601 -> 1,204 shards between 2026-08-25 and 2026-09-07 (605 added, 2 deleted);
      - `chore(plan)` filings ran 540 commits against 680 ship-class commits in the same window;
      - 42 of the 60 newest shards cluster into gates, proofs, coverage and the fix rung, and 39
        titles say some organ "has no reader / never fires / nothing runs";
      - only 31 shards carry `retirement:`; nothing reports which CLASSES of task close and which
        are filed forever.
    `renderGather` (`src/lib/retro.ts`) emits calibration by type and class, the SHIPPED union,
    MAST, infrastructure recurrence, mutation lifetime, degraded success, procedural candidates,
    skill drafts, follow-ups and plan coherence. None of them answers: for each task class, how
    many were FILED in the window, how many MERGED, how many are OPEN, and what a merge cost. The
    Architect then writes thousands of words of NET STATE from the sections that do exist.

    GitHub's own agentic-workflow meta-orchestrator publishes exactly this table weekly (close rate
    by category, mean time-to-close, cost per run) and uses it to retire categories with 0%
    closure. The retro has every input already: `RunSummary` carries `taskClass`, `shipped` carries
    the merges, and `opts.openTitles` carries the open set.

    THE SECOND TABLE IS HARNESS-COMPRESSION. §Self-improvement makes "which guards are now
    unnecessary" a required retro item. `infrastructureRecurrence` already groups guard/check
    pairs that fired; nothing lists the guards that did NOT fire since the marker, so a dead guard
    is invisible by construction. `resolveGuardCheck`'s fallback rows and `plan/mast-mapping.yaml`'s
    `infrastructure` rows enumerate the guard population; a zero-fire row is the deliverable.
  design: |
    (i) `closureByClass(runs, shipped, openTaskClasses, sinceTs)` returns one row per class:
    `filed` (open + merged in window, when the caller supplies filing dates; else "not supplied"),
    `merged`, `open`, `mergeRate` (REFUSED below a population floor of 5, P48), `costPerMerge`,
    and `lastMergeTs`. Rendered as a markdown table under a new `## Closure by task class`
    section, and ALSO emitted as one ledger line `retro.closure_by_class` so the console and the
    next retro can trend it without re-parsing MASTER-PLAN prose.
    (ii) `guardFireCounts(runs, mapping, sinceTs)` lists EVERY guard the mapping's
    `infrastructure` rows and `GUARD_REASON_FALLBACK_ROWS` name, with its fire count since the
    marker, ZERO ROWS INCLUDED. Render under `## Guard fire counts since marker`; a guard at zero
    for N consecutive markers is flagged "candidate for retirement — verify against the golden
    suite before removing" (the §Self-improvement rule that retirement goes behind the goldens).
    (iii) THE COUNT-OF-MARKERS-AT-ZERO NEEDS THE MARKER TO CARRY IT: extend the retro marker with
    `guard_zero_streak: Record<string, number>` the same way it carries `mast_category_counts`.
    (iv) NOTHING HERE DECIDES: no class is retired and no guard removed by this task. It names them.
  acceptance:
