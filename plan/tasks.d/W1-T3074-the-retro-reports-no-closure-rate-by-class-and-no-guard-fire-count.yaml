- id: W1-T3074
  title: "THE RETRO PRINTS EIGHTEEN PROSE SECTIONS AND NOT THE TWO TABLES A FLEET OPERATOR ACTS ON — closure rate by task class (filed, merged, still open, per class, with cost per merge) and guard fire-count since the last marker — so a task class with zero closures keeps being filed against, and a guard that has not fired in ten cycles cannot be named for retirement, which is the harness-compression duty MASTER-PLAN §Self-improvement assigns to every retro and no rung measures"
