    would invite churn; every term below is a pure sort over parsed fields. NO WRITE HAZARD
    (the operator's Q4): dispatchOrder is computed at read time inside nextRunnable and
    runnableCandidates on every selection — this is a SORT CHANGE IN CODE, not a plan
    mutation; W1-T60's origin-main plan blob and the W1-T340 per-tick snapshot are untouched.
    ANTI-STARVATION: ascending id ordinal IS filing order (ids mint monotonically), so the
    existing tiebreak already supplies the age term; priority: (W1-T422, merged, 3 users
    today) remains the deliberate override and still sorts first."
  design: |
    (i) undeclaredScopeLast (src/lib/drain.ts): a comparator term in compareDispatch,
    after priority and before the ordinal — tasks whose `files:` is empty or absent sort
    AFTER every declared-scope task. The overlap semantics stay fail-closed (an undeclared
    task still serializes against everything — that is correct); what changes is that it
    can no longer do so from the QUEUE HEAD, where it starves every lane. The name is
    load-bearing — the criterion greps it.
    (ii) idOrdinal becomes workstream-aware: the workstream prefix ranks before the task
    ordinal (W1 before W2 before W3 by their own numeric order is NOT the goal — the goal
    is that W2-T1 stops outranking W1-T400 by an accident of the trailing-integer regex;
    rank by (workstream number, task ordinal) so ids compare within their stream and
    streams compare deliberately). The stale "first integer run" doc line is corrected in
    the same edit.
    (iii) lane packing becomes disjointness-first: runnableCandidates' selection loop, when
    collecting more than one candidate, prefers the next ELIGIBLE task that is disjoint
    (via the real overlappingPaths) from those already collected, falling back to
    dispatchOrder position when no disjoint candidate remains — a greedy pack that
    guarantees full lanes whenever the eligible set contains a disjoint set that large,
    measured tonight as the only variant that does. Determinism: the scan order within
    the pack is dispatchOrder itself, so equal inputs yield equal outputs.
    (iv) FALSIFIER, both directions: a fixture pool reproducing tonight's shape (one
    empty-files task ranked first by ordinal, N pairwise-disjoint declared tasks behind
    it) must admit N at lanes=N under the new order where the old comparator admits 1
    (reverting any of (i)-(iii) fails it), AND a pool with NO disjoint pair must admit
    exactly 1 with the remainder serialized in dispatchOrder — the pack must not reorder
    what it cannot improve (the stability containment: absent overlap differences, the
    order is byte-identical to today's).
    (v) NOT IN SCOPE: partitionByFileOverlap's semantics (first-declared-wins and
    fail-closed empty scope both stay); any plan write, priority stamping, or shard edit;
    the truncation width (measured innocent); LLM ranking (measured unnecessary and argued
    against by the operator); backfilling `files:` on W2-T1/W2-T3/W1-T52/W1-T59 (their
    merged-ness needs the Azure status corpus this host cannot read — flagged for the
    operator instead).
  acceptance:
