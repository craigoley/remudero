- id: W1-T476
  title: "the dispatch head is poisoned deterministically — `idOrdinal` ranks W2-T1 at ordinal 1 ahead of the whole W1 backlog and its empty `files:` overlaps every candidate, so production admits 1 lane where the pool holds 11 disjoint tasks: sort undeclared scope LAST, make the ordinal workstream-aware, and pack lanes disjointness-first"
