  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 80
  rationale: "FILED FROM the operator's queue-ordering brief (oper#queue-order-2026-08-14),
    SIMULATED on this filing session's host (a cloud container with the tree at e26f928, no
    fleet ledger route) — every admission figure below is DERIVED from that run tonight, using
    the REAL loadPlan, runnableCandidates, and partitionByFileOverlap with zero glob
    reimplementation; ledger-gated eligibility legs (open-PR dedup, breaker, indeterminate,
