    every W1-T4xx — and W2-T1's `files:` is EMPTY, which overlappingPaths
    (src/lib/dispatch-overlap.ts) treats fail-closed as overlapping EVERYTHING (measured
    degree 27 of 27); first-declared-wins placement then serializes the entire pool behind
    it. Excluding the four empty-`files:` eligibles (W2-T1, W2-T3, W1-T52, W1-T59) the PLAIN
    production order admits full lanes at every width — a property of tonight's queue head,
    not a guarantee; greedy packing is the only variant that fills lanes whenever a disjoint
    set that large exists (greedy MIS 11 of 28 eligible tonight). CAVEAT, stated not buried:
    whether W2-T1 is live-eligible on the Azure fleet is UNMEASURED from this host — the
