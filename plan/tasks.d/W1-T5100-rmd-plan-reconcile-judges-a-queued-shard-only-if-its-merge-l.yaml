  falsifier: |
    Drop the `windowShort` derivation in `creditProjectionWithReadState` and the first, second, fifth and seventh tests redden on exit 0 and a missing line; the positive-control tests stay green, which is what shows the change moves only the short cases. Derive `windowShort` from `!creditIsReconcilable` instead of from the undefined evidence and the filing-shaped-merge test reddens (a merge whose subject says `chore(plan)` is judged, not short).
    Name a never-merged shard (no candidate row) or a retired shard and the never-window-short test reddens. Make `--write` skip the judged writes when a shard is short and the second test reddens on the missing write. Print WINDOW-SHORT on stdout and the byte-identical test reddens. The real-seam pair is the only test that reads real git: a fake builder returning `creditIsImplementation: undefined` cannot prove that a history past `MERGE_SUBJECT_SCAN_LIMIT`
    produces that value, and the control history (merge inside the window) must flip. BOTH directions are needed. CLOSE IF the verb already names shards whose credit evidence is absent, or if W1-T5035's block has folded this report in.
  note: |
    RISK: high because src/run-task.ts is the file the reconcile write lives in and `status: merged` is a one-way plan write; this task adds no write and only ever REFUSES to call a run complete, which is why band_meaning is blast-radius and not span.
    The real-seam fixtures copy test/a-task-credited-first-by-a-refused-pr-reconciles-from-its-later-merge.test.ts (the real `buildCreditCandidates` with a throwaway git repo as the injected evidence root and a gateway fixture) and the failing-gateway shape in test/plan-reconcile-fails-loud-when-its-github-read-fails.test.ts (`withLedgerRoot`, the `run` capture of stdout and stderr). Build the long history with `git fast-import` (one stream, a few thousand empty commits, well under a second), put the task's squash commit
    `feat(x): build (#N)` with a `Remudero-Task:` trailer FIRST so it is the oldest, then `MERGE_SUBJECT_SCAN_LIMIT + 50` filler commits; the control repo puts the same commit newest. Import both constants from src/run-task.ts rather than writing 5000. Wrap the real builder as `(o, r, p, l, log, github) => buildCreditCandidates(o, r, p, l, log, github, () => root)` and hand it to `creditProjectionWithReadState(cfg, root, wrapper, gateway)`;
    the default seam's own `resolveOwnerRepo` is NOT reached, so the test stays inside its throwaway directory. Existing pins that must not move: test/plan-reconcile-credit-parity.test.ts, test/plan-reconcile-fails-loud-when-its-github-read-fails.test.ts, test/the-plan-reconciler-runs-on-a-cadence.test.ts. docs/cli-reference.md is generated from the command registry and the one-line `detail` is NOT changed, so no regen.
    NOT MEASURED, SAID PLAINLY: (a) the verb itself end to end (ledger, config and the GitHub CLI are absent here), including whether it really exits 2 UNKNOWN on every cold run today; (b) credits that exist only in the ledger (the probe used an empty one); (c) whether the 2026-10-11 estimate holds, it assumes 121 commits a day continue. Filed from a REST shim that only issues GET reads; nothing was written to GitHub.
