- id: W1-T5100
  title: "`rmd plan-reconcile` JUDGES A QUEUED SHARD ONLY IF ITS MERGE LIES INSIDE TWO FIXED GIT SCAN WINDOWS (`MERGE_SUBJECT_SCAN_LIMIT` 5000 commits, `MERGED_PATHS_SCAN_LIMIT` 4000) AND A SHARD OUTSIDE BOTH READS `creditIsImplementation: undefined`, SO `creditIsReconcilable` DECLINES IT AND THE VERB FILES IT UNDER `not-credited-merged` WITH NO WORD THAT THE ANSWER WAS NEVER AVAILABLE — at about 121 commits a day a merge leaves the subject window in roughly 41 days; the candidate rows already say which shards are merged-but-unjudgeable, so have the verb name them in a WINDOW-SHORT line with their count and exit 2, never flipping one, never moving a window"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 20.00
  risk: high
  band_meaning: blast-radius
  origin: "operator ask 2026-10-01: a failed read now prints UNKNOWN (W1-T5029), but a read that SUCCEEDED over a window too short for the oldest queued shard is still a confident-looking zero; the 14 plan/tasks.yaml records hand-flipped in #8193 were all past both windows"
  plan_refs: [W1-T5029, W1-T5035, W1-T5034, W1-T3043, W1-T3084, W1-T3063, W1-T3067, W1-T415, W1-T3873]
  files:
