  falsifier: |
    At origin/main a fixture suite importing "#src/run-task.js" has directImports [], and
    selectAffectedSuites(["src/run-task.ts"]) does not select it. At head it is selected. Every new
    test in the new suite fails at base. The real-tree test is load-bearing only if deleting the
    code that reads package.json "imports" turns it red, not merely if its population is non-empty.
    It asserts that population is non-zero before it compares. The one-transition test is
    load-bearing only if a baseline with +1 slack at the transition is refused, and a second
    resolution change is refused too.
