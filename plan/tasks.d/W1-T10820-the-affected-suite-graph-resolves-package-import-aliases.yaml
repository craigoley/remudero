  design: |
    1. RESOLVE THE ALIASES AS NODE DOES. The graph resolves a specifier that starts with "#"
       through the package.json "imports" map, using Node's PACKAGE_IMPORTS_RESOLVE rules: an
       exact key first, then pattern keys with one "*", the longest matching prefix winning. The
       substituted target ("./src/run-task.js") then goes through the SAME candidate list a
       relative specifier uses today, TS's ".js" -> ".ts" included. A "#" specifier that matches no
       key, or whose target is no known file, gives no edge, the same as an unknown relative path.
       Fixture text in template strings still produces specifiers, so a throw there would be wrong.
    2. THE MAP IS READ, NEVER COPIED. The map comes from the package.json of the tree being
       graphed: readAffectedSuitesInput's repoRoot, coverageNarrowSuites' worktree, the ratchet's
       ROOT. A caller with no tree of its own falls back to the module's own checkout. Fixtures pass
       a map explicitly. No "#src" literal is hand-copied into the resolver. An unreadable
       package.json, or a target shape the resolver does not model (a conditions object, an
       array, a target outside the package), THROWS and names it. Every live caller already turns a
       throw into a named FULL run (affectedSelectionOrFull), never a narrower guess.
    3. EVERY CONSUMER GETS THE ALIAS-AWARE GRAPH through buildAffectedSuitesGraph itself:
       preflight-author, coverage-narrow, the merge-group and live-PR/coverage CI paths (all via
       readAffectedSuitesInput + selectAffectedSuites) and the ratchet's measureReach. No consumer
       keeps a second resolver.
    4. RE-BASELINE ONCE (the ruling). In the same PR, scripts/affected-reach-baseline.json is
       re-measured from the alias-aware graph. The recorded importerCount, largestScc,
       medianReachPercent and importer list EQUAL the measured head tree, with no slack. The record
       gains the field "resolution": "package-imports", naming the graph's resolution.
       Its _comment records this as a MEASUREMENT CORRECTION, not a loosening: it names the head sha,
       the old relative-only counts, the new counts, and that the old ceiling counted a shrinking
       subset. "the recorded reach baseline may only shrink against origin/main" learns exactly one
       transition: from a main record with no resolution field to the alias-aware one, the record
       must equal the live measurement exactly. Any other change of the field, or a re-measurement
       with slack, is refused. From then on all three metrics only shrink, as before.
    5. The PR body reports the head-tree numbers it recorded and the before/after of a change to
       src/run-task.ts (suites selected). No threshold is added anywhere.
    6. TESTS. test/ci/suites/the-affected-suite-graph-resolves-package-import-aliases.test.ts
       (folder from `rmd test-place`: test/ci/suites/, high via ci-parity) imports through
       "#src/lib/affected-suites.js" and covers fixture trees and the real tree. The real-tree
       assertion first proves its population is non-empty: at least one tracked suite imports
       "#src/run-task.js". Then every such suite must be in the graph's importers of
       src/run-task.ts. The ratchet suite gains the alias-importer and one-transition tests.
    7. Register the new real-tree test in src/lib/rule-suites.ts under the existing predicate:
       it has no grandfather baseline or exemption table, so clause (c) refuses fast-lane
       admission. This is a reasoned population record, not a testing exclusion: the suite
       remains mandatory in normal full CI. Do not change scripts, thresholds or any existing
       member, and preserve every real-tree assertion and the one-time reach remeasurement.
    Out of scope: src/lib/test-placement.ts's own prefix scan; scripts/mutation-ratchet.mjs
    (W1-T10354, which may reuse the resolver if exported, with no dependency either way); the
    queued selector-shadow-miss tasks; flipping RMD_AFFECTED_SUITE_LIVE.
