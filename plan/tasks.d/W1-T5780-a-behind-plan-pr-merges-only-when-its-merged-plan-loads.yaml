- id: W1-T5780
  title: "A BEHIND PLAN PR MERGES AS-IS ONLY WHEN ITS MERGED PLAN LOADS — W1-T5748's `decidePlanPrMergeSafety` merges on the DISJOINT basis without loading the merged plan, so two PRs that add the same new task id in different shards, or a PR whose depends_on names a task main has since removed, pass and break the plan on main"
  repo: remudero
  depends_on: [W1-T5748]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the merge-safety decision reads the merged plan for every behind plan PR
  band_meaning: span
  origin: "operator session 2026-10-05: W1-T5748 (#9205) follow-up"
  plan_refs: [W1-T5748, W1-T5472, W1-T5615]
  files: [src/lib/plan-pr-merge-safety.ts, test/a-behind-plan-pr-merges-when-its-merged-plan-is-safe.test.ts, test/a-behind-plan-pr-merges-only-when-its-merged-plan-loads.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main f0452a82 (#9205 merged). `readPlanMergeSafetySteps`
    (src/lib/plan-pr-merge-safety.ts) returns as soon as `plansDisjoint(prPlanPaths, mainPlanPaths)`
    holds, without `mergedTreePlanSteps`, and `decidePlanPrMergeSafety` returns
    `{ action: "merge", basis: "disjoint" }` on path disjointness alone. Disjoint PATHS do not make a
    disjoint PLAN: a filing PR that adds W1-T<n> in its own shard while main gained another shard
    declaring the same id, or a shard whose `depends_on` names a task main deleted, touches no path
    main touched. `mergePlanBlobsQuarantiningDuplicates` would quarantine the first and refuse the
    second (the `quarantined` / `refused` states), but it never runs. Both shapes merge, and a
    duplicate id refuses `loadPlan` on main for every PR (the 2026-09-15 incident in
    `rmd next-task-id`'s own help).
  design: |
    Read the merged tree for every behind plan-touching PR: disjoint paths become evidence recorded
    beside the verdict, never a merge basis on their own. `decidePlanPrMergeSafety` merges only on
    `mergedTree.state === "loads"`; every other state refreshes (and escalates past the bound) as
    today. Update W1-T5748's suite where its disjoint fixture expected a merge with no tree read.
  acceptance:
    - claim: "a behind plan PR with disjoint paths whose merged tree declares a duplicate task id, or a depends_on on a task main removed, is refreshed not merged, while a disjoint PR whose merged tree loads still merges directly"
      proof: "unit test: test/a-behind-plan-pr-merges-only-when-its-merged-plan-loads.test.ts"
  falsifier: |
    Keep the disjoint short-circuit: the duplicate-id fixture merges and the test fails.
