- id: W1-T9765
  title: "THE DAEMON'S GROW-ONLY BOOKS ARE BOUNDED OR SIZED ON ITS MEMORY ROW — runDaemon's measuredRuns, dirtyBlockedShas and their siblings in daemon.ts, and status.ts's changedFilesByUrl and reviewStateCache, only ever grow for the life of the process, and the memory census cannot reach them, so their size is unknown"
  repo: remudero
  depends_on: [W1-T9647]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern, the lifetime size of the daemon's in-process books; what each book answers is unchanged
  band_meaning: span
  origin: 'operator approval 2026-10-15 (verbatim: "go ahead - do as much as you can in parallel"; earlier: "innovate; lean into automation and self improvement"): W1-T9647 memory census (PR 12231), item Z3'
  plan_refs: [W1-T9647, W1-T9105, W1-T9106]
  files:
    - src/lib/daemon.ts
    - src/lib/status.ts
    - test/the-daemons-grow-only-books-are-bounded-or-sized.test.ts
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ at origin/main 3ce249c80 (symbols, not lines):
    - src/lib/daemon.ts runDaemon creates `dirtyBlockedShas = new Set<string>()` and `measuredRuns: MeasuredRun[] = []`
      (seeded from the boot ledger by dispatchRunHistory, appended per run), plus the attempted/merged books W1-T9647's
      shard names. None is trimmed.
    - src/lib/status.ts (the gateway built per daemon) creates `changedFilesByUrl = new Map<string, string[] | null>()`
      and `reviewStateCache = new Map<string, {at, state}>()`; entries are set per PR URL ever seen and never deleted.
    - OBSERVED offline by the W1-T9647 build (PR 12231), census 27d1f36d8d59 on 2026-10-15 over a synthetic production-scale corpus (369 rotations x 8,900 rows, 18,000 live rows, 12,000 closed PRs, 600 issues; plan at 4,112 tasks); evidence logs-8864/9647-census/census-27d1f36d8.{json,md}. Live set 867 MiB, filing threshold 43.4 MiB (min of 5% of the live set and 50 MiB). The per-step shares are INFERRED. These books are not reachable from the census's holder constructors, so the census reports nothing for
      them; W1-T9647's shard ranked them INFERRED under 10 MB. Their real size is unmeasured.
    INFERRED: small today, but each grows with every PR and run for the life of a daemon generation, and a long-lived
    generation is what W1-T9106's heap ceiling and the slack reclaimer are tuned against.
  design: |
    1. Each book either (a) drops entries it can no longer be asked about (a closed PR's changed files and review state
       once it leaves the open set; a run older than the history window measuredRuns' readers use), or (b) exports a
       measure (entries and an approximate byte figure accounted at insert) registered as a holder on W1-T9647's
       daemon.memory row. The builder states per book which and why.
    2. A bound that is a new number (a window, a cap) is an OPERATOR DECISION, proposed with the measured sizes, not
       chosen.
    3. Readers keep their answers for every key they can still be asked about (tests drive each reader before and after
       a trim).
    Tests go in test/the-daemons-grow-only-books-are-bounded-or-sized.test.ts, titled verbatim as in the proofs.
  acceptance:
    - claim: "after a PR closes and leaves the open set, its changed-files and review-state entries are gone or appear in a sized holder on the memory row"
      proof: 'grep: test("W1-T9765: a closed PR leaves the gateway books or is sized on the memory row" in test/the-daemons-grow-only-books-are-bounded-or-sized.test.ts'
    - claim: "runDaemon's run and sha books stay within their window, or appear as sized holders, and their readers answer as before"
      proof: 'grep: test("W1-T9765: the daemon run books are bounded or sized and answer as before" in test/the-daemons-grow-only-books-are-bounded-or-sized.test.ts'
  falsifier: |
    On origin/main, feed the gateway 1,000 PR URLs that each close: changedFilesByUrl and reviewStateCache still hold
    1,000 entries and no holder names them, so the first test fails. Trim measuredRuns below the window its run-length
    reader uses: that reader's answer changes and the second test fails.
