    metadata/human-escalation holds, not continuous interphase starvation. This task addresses
    the observed repeated scheduling delay and its no-fair-handoff mechanism, not those holds.
    W1-T11027 covers the focus gardener's FOCUS signal only and expressly defers without focus;
