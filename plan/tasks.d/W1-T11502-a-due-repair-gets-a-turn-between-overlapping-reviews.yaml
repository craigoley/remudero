  design: |
    Preserve review overlap and its existing width. Retain a due-repair request from a light
    disposition as scheduling debt, bound to the observed PR/head and ordinary repair owner.
    Arrange a serialized repair-capable pass after currently admitted overlapping passes settle,
    before admitting another generation of overlapping reviews indefinitely. A fair handoff or
    shared admission-owner queue is preferable to dispatching concurrent repair sweeps. Re-read
    facts and use the exact ordinary plan-repair/fix/conflict admission path when the turn arrives.
    Derive readiness from completion and pending work, not fixed timers, streaks or magic counts.
    Preserve new-green review wake debt and release repair debt when the head settles or changes.
    Pause, boot, drain, freshness latch, capacity, per-head mutex, strikes, progress judgment and
    escalation holds remain authoritative. Do not open repair during pause/drain/boot or simply
    set reviewOnly false on an overlapping pass. Record request, handoff and refusal reasons.
    Use an in-process controllable completion fixture: an unrelated review remains in flight,
    review arrivals continue, a due plan repair is observed, incumbents settle, and the repair
    gets the next permitted turn without waiting for all future review arrivals to stop.
