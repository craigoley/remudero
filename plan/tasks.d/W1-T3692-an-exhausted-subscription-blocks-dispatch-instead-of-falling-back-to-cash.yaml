- id: W1-T3692
  title: "AN EXHAUSTED SUBSCRIPTION BLOCKS DISPATCH INSTEAD OF FALLING BACK TO CASH — ProviderCapacityBlockedError stalls the queue at the exact moment a pay-per-token deployment should carry it, and only three lanes could accept the hand-off anyway"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
