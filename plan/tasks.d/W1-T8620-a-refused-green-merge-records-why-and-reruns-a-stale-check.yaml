  rationale: |
    READ on origin/main 32360d06a. Symbols, not lines.
    THE INCIDENT. #11096 (task main-repair-97e3f9136d82, head f84af4f) was armed on a full PASS at 14:24:41Z. From the
    core ledger on host remudero (~/rmd-state2/state/ledger.ndjson, read niced; positive control: 198 rows name 11096):
      - `automerge.armed_idle` "first armed, reviewed, green idle sighting" at 14:31:04Z.
      - At 14:41:07, 14:47:58 and 14:56:10Z: `automerge.arm_failed` lane sweep, outcome direct-merge-failed,
        mergeability MERGEABLE, remedy direct-merge, and NO error field. Beside each, `automerge.armed_idle_refused`
        carries only `outcome`.
      - Each `sweep.disposed` row reads "arm outcome: direct-merge-failed; no stale-rollup refresh: GitHub reports
        mergeable=undefined, mergeableState=unknown". The `sweep.merge_probe` rows of those passes read
        `github_mergeable_state` "unknown".
      - At 14:56:52Z a distance-overlap update-branch moved the head to 092038d. That is a separate refresh, not a
        remedy for the refusal, and it re-ran CI and voided the review.
    GitHub's refusal text, `Required status check "ci-gate" is failing. (HTTP 405)`, reached only `deps.say` (the
    docker log). That text is from the incident brief. The container that wrote it (5c92360aef39) was replaced at
    15:13Z, so its log could not be re-read.
    THE STALE RED, MEASURED (GitHub Actions runs at head f84af4f, read 15:37Z). The brief called 38259941644 a newer
    ci-gate run. It is not: it is the `CI` workflow (.github/workflows/ci.yml), created 14:01:59Z, success at 14:23:17Z.
    The ci-gate runs (.github/workflows/ci-gate.yml) at that head are 38258744473 (13:52Z, cancelled) and 38259738068
    (created 14:00:25Z). The brief puts that run's first attempt at failure, 14:14Z. Its attempt 2, the session's hand
    re-run, concluded success at 14:59:59Z. So no newer ci-gate run superseded the failure. ci-gate concluded before
    the CI run it gates had finished, and nothing re-ran it. Every check it gates was then green, and so was the
    daemon's own latest-run read ("review success, required checks green"). The red was the gate's stale verdict.
    Because its inputs finished 9 minutes after it concluded, ci-gate's in-run grace re-read (W1-T261) could not clear it.
    WHY THE TEXT IS LOST. `mergeDirectAfterPreflightSteps` (src/lib/arm-auto-merge.ts) catches the REST merge's error as
    `msg2`, says it, and returns `{ outcome: "direct-merge-failed", directMergePreflight: evidence }` with no `error`.
    Both ledger writers already copy `error` when a result carries it: `armAndLogOutcome` (src/lib/sweep.ts) and the
    review arm site that calls `logArmAttribution`. The armed-idle branch in `runSweep` writes
    `automerge.armed_idle_refused` through `recordIdle` with `{ outcome }` alone. Doctrine: a ledger line carries the
    reason from the decision that produced it.
    WHY NOTHING ACTED. W1-T6404 built this case's remedy. `refreshStaleRollupAfterRefusal` (sweep.ts) runs on the
    armed-idle `direct-merge-failed` branch. It returns early unless `pr.mergeableState === "blocked"` and
    `pr.mergeable === true`. Mergeability was unread on all three passes, so it declined each time and the next pass
    retried the same refused merge. Its remedy is also the costly one: `updateBranch` mints a fresh sha, which re-runs
    every required check (about 16 minutes) and voids the exact-input review. Doctrine says do not push a fresh sha to
    clear a stale-red ci-gate (doctrine/ci-and-merging/stale-red-self-clears.md). That doctrine assumed ci-gate's own
    in-run re-read clears it (W1-T261); here the stale red is a whole separate earlier run, which no re-read reaches.
    WHAT ALREADY EXISTS AND IS REUSED. `classifyRollupSupersession` (sweep.ts, W1-T4908) names each failed entry a later
    attempt of the same check outranks. `deps.readCiGateRollup` reads the head's rollup. `deps.requeueCheck` re-runs ONE
    job, never the whole run (its own W1-T1223 doc: a whole-run re-run re-spends green siblings), and `jobRerunRefusal` turns GitHub's
    in-flight HTTP 403 into `deferred` (W1-T5920). `requeueCheckJob` writes its bounding row before the POST (W1-T1223).
    `CHECK_REQUEUE_STEP` keys on `${headSha}@${checkName}` alone, which is why this task adds its own (head, run id) key
    and does not reuse that one.
    NOT COVERED ELSEWHERE: swept origin/main plan/tasks.d for direct-merge-failed, stale_rollup, armed_idle_refused and
    `Required status check` (W1-T6404, W1-T5492, W1-T1052 and others, all merged; W1-T7747 moves the merge off the
    loop; W1-T7735 prices main-merge refreshes). None writes the refusal text or re-runs a stale gate job. The
    plan/tasks.d additions on all 281 origin heads (24 files, all read) name none of these.
  design: |
    No fixed count or timer. Each action is spent once per key and the key is the evidence.
    1. THE REFUSAL TEXT IS ON THE ROW. `mergeDirectAfterPreflightSteps` returns `error: msg2` with
       `direct-merge-failed`. `automerge.arm_failed` then carries `error` through the writers that already copy it.
       The armed-idle branch passes `error` to `recordIdle`, so `automerge.armed_idle_refused` carries it too.
    2. CLASSIFY THE REFUSAL, THEN ACT. Add the pure `classifyMergeRefusal(error, rollup)` to src/lib/sweep.ts. It parses
       the check GitHub names (`Required status check "<name>" is ...`) and reads the head's rollup through
       `classifyRollupSupersession`. Its kinds:
         - `stale-check`, in either of two shapes. SUPERSEDED: the named check's newest run on this head is SUCCESS,
           and a superseded FAILURE or CANCELLED entry of that check remains (W1-T4908's shape), or the newest run is
           itself CANCELLED. GATE-OLDER-THAN-INPUTS (#11096): the named check is ci-gate, its newest run on this head
           failed, that run completed before the newest completion among the checks ci-gate gates (the REQUIRED list
           `readCiGateRequired` reads), and every one of those checks is green by the daemon's latest-run read.
         - `real-red`: the named check's newest run failed or is still running. The PR is not green, and the next pass's
           ordinary disposition owns it.
         - `transient`: the refusal is rate-limit or transient (`armFailureIsRateLimited`, `armFailureAction`). The next
           pass retries, as today.
         - `other`: anything else, including an unreadable rollup with a check-naming refusal.
    3. A STALE CHECK IS RE-RUN, NOT RE-MERGED. For `stale-check`, the armed-idle branch re-runs the failed entry's JOB
       (the superseded one, or the stale ci-gate run's) through `deps.requeueCheck`, ONCE per (head sha, run id). Before the POST it writes
       `automerge.stale_check_rerun` with check_name, head_sha, the shape, the stale run id, the run that outranks it, job_id and
       GitHub's refusal text. A `deferred` answer (W1-T5920) voids the row for the next pass. The step joins
       `DECISION_RELEVANT_LEDGER_STEPS` (src/lib/ledger.ts), because forgetting it loops. While the re-run is in flight
       the rollup reads pending, so the next pass waits and does not retry the merge blind. This branch keys on GitHub's
       refusal and the rollup, never on `mergeableState`, which read unknown on all three #11096 passes.
    4. ANYTHING ELSE ESCALATES WITH ITS REASON. For `other`, and for a repeat `stale-check` refusal at a (head, run id)
       already re-run, the sweep escalates once per (head sha, refusal text) through `deps.escalate`, quoting GitHub's
       text. W1-T6404's `refreshStaleRollupAfterRefusal` stays for a refusal with no readable text. It runs only after
       this classification declines, so a fresh sha is never the first answer to a stale check.
    5. THE DISPOSED ROW SAYS WHICH. The `sweep.disposed` stand-down reason names the kind and the action, for example
       `direct-merge-failed: stale-check ci-gate (run 38259738068 concluded before its gated CI run 38259941644) — job re-run`.
    6. Unchanged: W1-T1050's landed-merge re-check, the preflight remedies, W1-T1223's cancelled-check requeue and its
       key, W1-T5920's deferral backstop, and the review lane's arm path apart from the added `error`.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive `mergeDirectAfterPreflightSteps` through the
    exported arm entry with an injected `mergeDirect` that throws GitHub's 405 text, and `runSweep`'s armed-idle branch
    with injected `readCiGateRollup`, `requeueCheck` and `escalate`.
