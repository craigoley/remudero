  falsifier: |
    Drop `error: msg2` from the `direct-merge-failed` return, and the first test reads no error field on either row.
    Key the re-run on `mergeableState === "blocked"` as W1-T6404 does, and the #11096 fixture (mergeability unknown)
    re-runs nothing and retries the merge. Drop the gate-older-than-inputs shape, and the #11096 fixture (no newer
    ci-gate run) escalates or retries instead of re-running. Drop the (head, run id) key, and the repeat test re-runs a second time.
    Treat every check-naming refusal as stale, and the real-red test re-runs a failing check.
