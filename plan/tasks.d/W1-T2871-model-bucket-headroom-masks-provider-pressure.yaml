- id: W1-T2871
  title: "MODEL-BUCKET HEADROOM MASKS PROVIDER PRESSURE — an independently full Codex-Spark bucket makes automatic routing favor Codex even when the standard Codex allowance is constrained and Claude has materially more subscription room"
  repo: remudero
  depends_on: [W1-T2842, W1-T2859]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 24.00
  files:
    - src/lib/worker-provider.ts
    - src/lib/worker.ts
    - src/lib/provider-routing-status.ts
    - src/lib/serve.ts
    - test/worker-provider.test.ts
