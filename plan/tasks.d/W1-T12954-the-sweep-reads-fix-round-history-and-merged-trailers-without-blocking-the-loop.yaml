  rationale: |
    WHY: since W1-T12544 merged (2026-11-15 13:34Z), the core daemon's sweep blocks its event loop for minutes on
    one synchronous read of every ledger rotation. And once a day the retro trigger blocks it for about a minute
    matching one regular expression per run against every merged PR body.
    MEASURED, core ledger (~/rmd-state2/state), 2026-11-14 18:15Z to 2026-11-15 18:16Z, 90
    daemon.loop_stall_profile rows:
    - 20 rows name runSweep in top_inclusive. In 15 of them the stack is runSweep -> conflictRoundHeldHead ->
      terminalFixDesignHandoff -> readLedgerUnionRecordsSync, with parseObject under scanLedgerBuffer as the top
      self frame. Those 15 rows have 3,845 s of loop lag; the union read alone is 1,364 s of profiled time, and
      its longest single read is 354 s (17:12:32Z). The first is at 14:50:12Z, 76 minutes after W1-T12544 merged.
    - The other 5 runSweep rows name listFeedback (captureRepairFeedbackWithPriorVerdict) or readMergedPlan.
    - One row (03:20:06Z, lag 109 s) names retroTriggerPrelude -> shippedSince -> findMergedByTrailer, 58.6 s,
      whose top self frames are one RegExp per task id ("^Remudero-Task:\s*W1-T11195\s*$" and others).
    - sweep.full_prelude stage times (wall time, awaits included; 40 passes): ledger_fold median 7.3 s, p90 74 s,
      max 191 s; anomaly_sentinels median 27 ms, p90 301 ms, max 125 s (one pass). No profile row names a
      function of either stage, so this task does not move them; see the falsifier.
    - docker stats at 18:20Z: remudero-daemon at 186% CPU.
    READ at origin/main 57ca3bba9:
    - src/lib/sweep.ts:20819 readRepairHistory is readLedgerUnionRecordsSync over fix.dispatch, fix.retrigger,
      fix.done, fix.needs_design and sweep.conflict_regenerated with refuseIncomplete, read once a pass and lazily
      from the PR walk (sweep.ts:22816 and :22830).
    - src/lib/ledger-union.ts:835 readLedgerUnionRecords streams the union asynchronously; :1832
      readLedgerUnionRecordsMemoized keeps parsed rotations in a memo across passes but parses synchronously.
    - src/lib/status.ts:5562 findMergedByTrailer builds a new RegExp for each call and tests it against
      index().mergedNewestFirst; findMergedByTrailerAll filters the same list. retroTriggerPrelude calls
      shippedSince (src/lib/retro.ts:779), which calls it once for each candidate run.
    SCOPE: W1-T12753 (in build) moves the lifetime-pressure route and idCitedInSrc off the loop and adds the
    synchronous-ledger-scan census. This task touches neither src/run-task.ts nor W1-T12753's new test files. It
    depends on W1-T12753 only to lower the census row that W1-T12753 records for this sweep read.
    FALSIFIER: if, after this lands, sweep.full_prelude still shows ledger_fold above 60 s at p90 while no stall
    profile names readLedgerUnionRecordsSync under runSweep, the ledger_fold stage's own folds block the loop and
    need their own task; if stall rows still name conflictRoundHeldHead, the read is still synchronous.
  design: |
    INVARIANT same-rows: the awaited read returns what readLedgerUnionRecordsSync returns today for the same
    directory and options, in the same order; an incomplete corpus gives undefined as today.
    INVARIANT same-trailer-answers: the index is a cache of today's answer, built from the same list.
    INVARIANT census-only-falls: the sweep's synchronous-ledger-scan census row only drops; no row rises.
    1. src/lib/sweep.ts: before the PR walk, read the readRepairHistory steps through an awaited reader that
       loads rotations off the loop, with the same completeness answer as refuseIncomplete. Reuse the slice
       reader the sweep already has for this (createEscalationTriageHistoryReader, as the fleet-state history
       does): it loads each rotation with the streaming rotation memo, keeps it across passes, and answers the
       strict LedgerUnionRecordRead. Keep one reader for each ledger directory in a module-level map, read
       through a new exported readSweepRepairHistory(ledgerPath). Give readRepairArchive the result. Only a pass
       with a holdable PR (conflicted or blocked-fixable) awaits it before conflictRoundHeldHead; the refresh
       history reader awaits the same read.
    2. src/lib/status.ts: add mergedTrailerIndex(list), a Map from task id to the merged PRs whose body carries
       the anchored trailer line, newest first, built once for each index() result. findMergedByTrailer and
       findMergedByTrailerAll read it.
    3. test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts: lower the sweep's row only.
    4. Add the two focused test files.
    5. test/a-refresh-decision-reads-history-that-survives-ledger-rotation.test.ts: its "read once per PR per
       pass" test counts the archive's fs.readFileSync calls and expects 1. The archive is now read through
       fs.createReadStream off the loop, so the test counts both: no synchronous read, and one stream for the
       repair history beside the cost-anomaly scan's own stream.
    NOT IN SCOPE: openEscalationSince's union read (sweep.ts:20067), the ledger_fold and anomaly_sentinels folds,
    listFeedback, readMergedPlan, src/run-task.ts.
  falsifier: |
    Call readLedgerUnionRecordsSync again for readRepairHistory: criterion 1 must fail. Drop refuseIncomplete:
    criterion 2 must fail. Clear the memo between passes: criterion 3 must fail. Build the index on every call:
    criterion 4 must fail. Return the oldest trailer PR: criterion 5 must fail. Restore and require all to pass.
