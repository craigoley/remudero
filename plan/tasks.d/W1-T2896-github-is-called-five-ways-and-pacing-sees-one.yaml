- id: W1-T2896
  title: "GITHUB IS CALLED FIVE WAYS AND RATE-LIMIT PACING SEES ONE — the paced ghJson, 50 direct execFileSync(\"gh\") sites in 18 files, ghJsonAsync, GhApiFetcher plus its pacer, ghGateway with seven domain factories, and a raw fetch; only 8 of 246 execFileSync sites carry a timeout, so one half-open socket parks the daemon: make one transport module the only way out, with a default timeout and a census that refuses a new direct spawn"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
