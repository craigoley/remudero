      proof: 'grep: test("W1-T4087: a writer that keeps failing falls back to the plain template, never the raw summary" in test/every-inbox-message-is-plain-language.test.ts'
    - claim: "every live fleet kind has a plain template"
      proof: 'grep: test("W1-T4087: every live fleet kind has a plain template" in test/every-inbox-message-is-plain-language.test.ts'
    - claim: "the inbox route calls the plain writer"
      proof: 'grep: plainInboxMessage( in src/lib/panel-graph.ts'
  falsifier: |
    Pass the raw summary through as `plain` and the second and third tests go red on the live adoption sample. Drop a
    kind's template and the fourth goes red.
