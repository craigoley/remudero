  note: |
    **RISK BAND SET FROM RULE 19 SPAN, AND WHAT THE BAND DOES.** `files:` crosses `src/` and `test/`,
    so the SPAN reading is `high`. **`high` EXEMPTS THE SIZING CHECK RATHER THAN CLEARING IT** —
    `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` outright at `risk: high` under
    the comment "Rule 19 exemption — high already assumes wide scope". So this band is A DECLARATION
    OF SPAN AND NOT EVIDENCE THE SPAN WAS VETTED, and a later reader must not read a clean lint as
    the sizing having been checked.

    **THE BLAST-RADIUS READING, RECORDED SEPARATELY.** It is narrower than the band suggests: the
    change is one refusal inside one `case` arm of one function, mirroring a stand-down that already
    exists three lines away. What makes it genuinely risky is the FIRST-MATCH-WINS table — a
    predicate written slightly wide would silence `blocked-fixable` for PRs that are not conflicted
    at all, which is why criterion 3 pins the not-dirty case explicitly.

    **MEASUREMENT PROVENANCE.** `src/run-task.ts` reads 1,484,997 bytes — over the GitHub Contents
    API's 1 MB cap, where it returns `encoding: "none"` and greps to a clean zero — so every source
    figure here was read through git objects in a worktree proven equal to `origin/main` by SHA
    equality. `rmd ledger-grep` refused on zero archives rather than answering from the live file,
    so no ledger count is quoted.

    **ID PROVENANCE.** `refs/rmd-id/W1-T1278` was reserved 2026-08-23T18:19:35Z and confirmed still
    held and unused. Eight id surfaces were swept with a control pre-qualified for each and none
    disqualified: reservation ref, shard filenames on main, `- id:` lines in `plan/`, open-PR titles,
    open-PR head branches, open-PR file lists, anchored merged-commit trailers
    (`^Remudero-Task:\s*<id>\s*$`, never a bare substring), and merged subjects. The SUBJECT was
    swept as well as the id: ten shards name both a conflicted head and the fix rung, and each was
    read — `W1-T984` is the producer side and `W1-T1269` the progress side, neither is this.
