  falsifier: |
    CLOSE THIS WITHOUT IMPLEMENTATION if DECISIONS.md already carries a gate-posture ruling.
    MEASURED 2026-09-10: it carries fifteen `Operator-ruled` entries and none of them is about
    whether a gate may block.
    DO NOT record this as an agent's own conclusion. The decision-authority ruling forbids it, and
    the operator's words are available verbatim — transcribe them.
    DO NOT let the entry read as "remove the gates". The measurement that motivates it is a gate
    that REFUSED where it could have REPAIRED, not a gate that existed. An entry a reader can cite
    to delete a ratchet has inverted the ruling.
    DO NOT let CLOSE become the new default refusal. The bar is harm, and the falsifier for any
    implementation is that an INCOMPLETE change — an untiered file, an unfolded byte — still lands.
    A system that closes what it used to block has kept the block and lost the work as well.
    DO NOT implement W1-T3319/3320/3321 in this task. The record is the deliverable; a ruling that
    ships with its own implementation cannot be cited as settled prior art by the work it authorises.
