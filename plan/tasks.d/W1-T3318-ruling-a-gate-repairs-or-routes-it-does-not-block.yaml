  rationale: |
    THE OPERATOR'S DIRECTION, 2026-09-10, verbatim:

      "the goal should never be to block prs. The goal should be to fix them and get them through
       the system or spin off follow-up tasks if they can't be easily fixed in-line"

      "the only time to block is if it is truly a bad change, a malicious change, or something that
       is going to really negatively regress rmd in a meaningful way"

      "in which case it should be closed anyway"

    THE THIRD CLAUSE IS THE SHARPEST AND MUST NOT BE SOFTENED IN THE RECORD. It abolishes BLOCKED AS
    A RESTING STATE. A change is repaired and lands, or it is routed and lands with a follow-up
    filed, or it is genuinely harmful and is CLOSED with the reason. What no longer exists is the
    fourth outcome the system currently spends most on: a PR that sits blocked, gets re-dispatched,
    and blocks again.

    IT IS ALREADY PROVEN IN THIS REPO, which is why it is a ruling rather than a preference.
    W1-T3205's test-tier admission refused any commit adding an untiered test file. MEASURED over
    one day: two operator pushes blocked, and FOUR daemon crashes across W1-T3226, W1-T3242 and
    W1-T3274 twice — each one exiting 1 against docker's `on-failure:5`, taking `RestartCount` to 4
    of 5. Zero defects caught in exchange.

    W1-T3311 did not delete that gate. It made the gate PERFORM the remedy its own refusal message
    already named. MEASURED AFTER: #4923 merged 04:52Z, the daemon restarted 04:55Z, and in the
    ~1000 log lines since there has been not one `pre-push REFUSED` and not one error stop. The
    single most expensive thing in the system became invisible, and the protection is unchanged —
    the push-time admission still refuses a commit made with the hook bypassed.

    THE DISTINCTION THE RULING DRAWS is between a remedy that is COMPUTABLE and one that needs
    judgement. Seeding a manifest line is computable: there is exactly one right answer and the
    refusal message already stated it. Deciding WHICH rule to fold out of a full CLAUDE.md is not —
    and that gate's response to not knowing is to drop the rule entirely (W1-T3320).

    AND THE COST OF THE FOURTH OUTCOME IS MEASURED, on the same night as the crashes. W1-T2923,
    W1-T2924 and W1-T2962 each ended `blocked_ci` TWICE; W1-T2926 and W1-T2995 blocked; W1-T3274 was
    attempted three times. Meanwhile the cost-anomaly detector fired 18 times, with W1-T2924 at
    $11.37 against a $2.90 median and W1-T2906 at $12.06 — one drain pass alone cost $19.88. The
    fleet's most expensive activity that night was re-running tasks into the same block. Twelve
    merges landed; the churn is where the money went. Under this ruling that third attempt does not
    happen: the second block routes or closes.
  design: |
    (i) THE RULING IS RECORDED, NOT IMPLEMENTED HERE. This task's whole deliverable is the
    DECISIONS.md entry; W1-T3319/3320/3321 are the work it authorises. A ruling that ships with its
    own implementation cannot be cited by the next task as settled prior art.
    (ii) THREE TERMINAL POSTURES, NAMED — and "terminal" is the load-bearing word, because each one
    ENDS the change's journey. "Do not block" is not "do not check":
      REPAIR  — the remedy is computable: apply it, stage it, say so, and the change lands.
                (W1-T3311's shape, and the only one that needs no human.)
      ROUTE   — the remedy needs judgement: the change LANDS and the follow-up is FILED, naming it.
      CLOSE   — the change is bad, malicious, or a meaningful regression to rmd: close the PR with
                the reason. Not blocked, not parked, not retried. Closed.
    (iii) THERE IS NO FOURTH OUTCOME, and the entry must say so in as many words. `blocked` as a
    resting state is what this ruling removes: a PR that neither lands nor closes is the state the
    fleet spent most of its money on. A gate that today reports "blocked" must be re-read as asking
    which of the three it actually meant.
    (iii-a) CLOSE IS NARROW AND MUST NOT BE READ AS THE OLD REFUSE. The bar is HARM — a secret in the
    diff, a destructive migration, a change that breaks the fleet's own recovery path, a meaningful
    regression. INCOMPLETENESS IS NOT HARM: a missing manifest line, an untiered file, an unfolded
    doctrine byte is a REPAIR or a ROUTE, never a close.
    (iv) THE RECORD NAMES THE MEASUREMENT, not just the preference. Four daemon crashes and two
    blocked pushes against zero defects is what makes this a ruling rather than a taste; an entry
    that records only "the operator prefers not to block" is a sales document (W1-T3173's caveat).
    (v) NAME THE COST ADMITTED: a REPAIR posture means a gate now WRITES to the tree it checks, which
    is a larger surface than reading it. W1-T3311's own falsifier — that the seed must be idempotent
    and byte-identical when idle — is the shape every repair gate must carry, or a gate that fixes
    becomes a gate that churns.
