- id: W1-T3559
  title: "EVERY LANDING OWNER SHARES ONE LITERAL REF — `LANDING_BRANCH = \"feedback-landing\"` is a module constant and `ensurePrOpen`/`findPendingLandingPr` key only on that string, so two daemon instances with different state roots (and even different target repositories) force-push the SAME ref and reuse the SAME PR: derive the landing identity from the resolved target repository plus the landing owner so no two owners can ever address one branch"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 55.00
  files:
    - src/lib/feedback-landing.ts
    - src/lib/branch-reaper.ts
    - test/feedback-landing-repo-scope.test.ts
    - test/branch-reaper-landing-family.test.ts
  origin: architect
  plan_refs: ["W1-T530", "W1-T191", "W1-T447", "W1-T3532", "W1-T3554", "§7B"]
  status: queued
  attempts: 0
  rationale: |
    READ AT THIS COMMIT, NOT INFERRED.

    (1) THE IDENTITY IS A LITERAL. `src/lib/feedback-landing.ts` declares
    `export const LANDING_BRANCH = "feedback-landing"` and `LANDING_PR_TITLE` as module constants,
    and `FEEDBACK_LANDING_KIND` binds them once for the whole process. `ensurePrOpen` resolves an
    existing PR through `findPendingLandingPr({ gh, branch: kind.branch })` — keyed on that string
    and nothing else — and `finishLanding` pushes `<commitSha>:refs/heads/${kind.branch}`. Nothing
    in the identity mentions the target repository, the state root, the host, or the process.

    (2) SO THE OWNER SET IS UNBOUNDED BY CONSTRUCTION. Every `rmd` process that reaches this module
    is an equal claimant to one ref and one PR. That is safe for exactly one writer and is the
    premise the module's own force-push note rests on ("this branch is bot-owned and never diverges
    by history, only by content"). The fleet no longer has one writer: W1-T3532 is filing the
    per-instance supervisor for core and site instances on ONE Azure host, each with its own state
    root, and W1-T3554 is filing a daemon launched `--repo <target>` where `target.isSelf` is false.

    (3) AND IT HAS ALREADY MISROUTED A RECORD ACROSS REPOSITORIES. Reported in
    feedback#fb-1789328786213-ba9741 (2026-09-13): a daemon running the harness with
    `--repo remudero-site` kept feedback landing in the core source context, and "site feedback
    consequently landed as core PR #5438".

    (4) THE SHARED-REF HAZARD IS NOT HYPOTHETICAL EITHER — the disjoint-batch clobber it enables is
    measured and filed separately as W1-T3560, which this task is the precondition for: scoping the
    identity removes the CROSS-REPOSITORY claimant, and W1-T3560 removes the SAME-repository one.

    (5) THE REAPER IS COUPLED TO THE LITERAL AND WILL DELETE A SCOPED REF IF IGNORED.
    `src/lib/branch-reaper.ts` guards `"feedback-landing"` by two independent signals: the declared
    `DECLARED_BRANCH_GUARDS` entry, and `namedInSource`, a `git grep -l -F` SUBSTRING match over the
    branch NAME. A derived name that never appears verbatim in source is guarded by neither, so a
    live landing ref becomes a reap candidate — the exact failure mode that list's own comment
    documents for variable-referenced branches.
  design: |
    (i) ONE DERIVED IDENTITY, NOT A SECOND CONSTANT. The landing identity (branch, PR title/head,
    and the owned directory `LandingKind` already carries) must be DERIVED from the resolved target
    repository plus the landing owner, in one place, and every consumer must read it from there —
    never re-type a literal at a call site. The same fragmentation class W1-T1062 named for owner
    resolution applies: a second hard-coded string is not a fix.

    (ii) THE EXISTING CORE IDENTITY MUST NOT MOVE. `feedback-landing` and `decisions-landing` are
    live refs with live open PRs, a declared reaper guard, and an `rmd triage` exit-2 message that
    names the pending landing PR. The self/core owner MUST continue to resolve to exactly the names
    it resolves to today — this task adds scoping for other owners, it does not rename core's.
    Prove that byte-for-byte, because a silent rename strands whatever is on the branch right now.

    (iii) LOOKUP MUST BE SCOPED ON BOTH AXES. `findPendingLandingPr` must find only the PR whose
    head is THIS owner's branch in THIS target repository; a PR open on another owner's branch, or
    on the same branch name in another repository, must not be returned as reusable.

    (iv) THE REAPER MUST SEE THE FAMILY, BY CALLING THE IDENTITY MODULE. Whatever shape the derived
    name takes, `branch-reaper.ts` must recognise the whole family as guarded — via a declared
    pattern, not a hand-maintained list of instance names — and its existing drift alarm
    (guarded-by-grep but undeclared) must still fire rather than being silently widened into a
    catch-all that guards everything. The pattern is `isLandingRef(...)`, exported beside
    `landingIdentity(...)` from `src/lib/feedback-landing.ts` and CALLED by the reaper: a second
    regex re-typed in `branch-reaper.ts` is the same fragmentation (i) forbids, and an export the
    reaper never calls is a module that merges green while a live ref is still reapable.

    (v) NOT IN SCOPE, DELIBERATELY. WHICH repository's `plan/feedback` a captured record belongs to
    — the broader per-instance repository/state ownership ask in fb-1789328786213-ba9741 — is NOT
    decided here. This task makes the landing WRITE TARGET unambiguous for whatever owner performs
    it; record routing, per-instance ledgers/lanes/triage ownership, and the knowledge-exchange
    boundary stay open. Also out of scope: the union/lease writer (W1-T3560), record monotonicity
    (W1-T3561), and the operational reconciliation of records already split (W1-T3562).

    (vi) PRESERVE EVERY EXISTING GATE. No direct push to main, `assertLiveWriteAllowed` on every
    live write, the scratch-index isolation (W1-T60), the tree-compare short-circuit that stopped
    the #1113 CI-cancellation deadlock, the #954 guard, the `automergeHoldFromLedger` consult, and
    the `ci + remudero-review` protected statuses all remain exactly as they are.
  acceptance:
    - claim: "the landing branch, PR head and owned directory are derived from the resolved target repository and landing owner rather than read from a module-level literal"
      proof: "unit test: test/feedback-landing-repo-scope.test.ts"
    - claim: "two landing owners with different target repositories resolve to different refs and neither can address the other's branch or reuse the other's pull request"
      proof: "unit test: test/feedback-landing-repo-scope.test.ts"
    - claim: "the self target's landing identity still resolves to the exact branch and pull-request head it resolves to today, so the live refs and open PRs are not stranded by a rename"
      proof: "unit test: test/feedback-landing-repo-scope.test.ts"
    - claim: "a pending landing PR lookup scoped to one owner does not return a pull request open on another owner's branch"
      proof: "unit test: test/feedback-landing-repo-scope.test.ts"
    - claim: "the branch reaper guards the whole derived landing family and still reports a guarded-but-undeclared branch as drift"
      proof: "unit test: test/branch-reaper-landing-family.test.ts"
    - claim: "the derived identity has a named resolver the landing path calls rather than a second hard-coded branch string"
      proof: "grep: landingIdentity( in src/lib/feedback-landing.ts"
    - claim: "the reaper's guard for the landing family is computed from the identity module's own exported predicate, so the new export is reached from a different source file and not only from its tests"
      proof: "grep: isLandingRef( in src/lib/branch-reaper.ts"
  falsifier: |
    CLOSE IF the landing branch and PR head are already derived per target repository and per owner,
    and two owners provably cannot address one ref. As of this filing `LANDING_BRANCH` is the string
    literal `"feedback-landing"` in `src/lib/feedback-landing.ts` and `findPendingLandingPr` keys on
    that string alone.
    DO NOT satisfy this by adding a second literal constant for the site instance, by passing an
    ad-hoc branch override at one call site, or by renaming the core branch — (ii) forbids the last
    one outright and (i) forbids the first two.
  note: |
    risk:high because a wrong answer here writes to the wrong repository's refs; the blast radius is
    a force-pushed ref, not a local file. `band_meaning: span` is declared anyway — the honest count
    is the two source modules below (`feedback-landing`, `branch-reaper`), and Rule 19's span is then
    REPORTED rather than exempted, which is the weaker of the two claims and the right one here: the
    identity resolver and the reaper guard that would delete its ref cannot be proved apart (a scoped
    ref that the reaper still reaps is one invariant over both files). `files:` is deliberately narrow: `src/lib/feedback-landing.ts`
    owns the identity, `src/lib/branch-reaper.ts` owns the guard that would delete a scoped ref, and
    the test file is new. `src/run-task.ts` is NOT declared — the sweep rung there passes `root` and
    reads the result, and this task must not need a signature change at that 37%-declared hub.
