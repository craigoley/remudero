  rationale: |
    OBSERVED: origin: is free text (12 shards share 'operator ask 2026-09-24: get PRs through the process quicker');
    there is no goal file and plan/claims.yaml checks facts, not outcomes. Memory rule 're-measure the symptom, not the
    component'. Paperclip keeps goals as records with a parent, owner and status, and rolls spend up by goal
    (https://github.com/paperclipai/paperclip/blob/master/doc/SPEC-implementation.md §7.4, §13.3).
  design: |
    (i) plan/goals.d/G-*.yaml: symptom, measurement command, baseline, direction; tasks gain an optional goal: field.
    (ii) When all of a goal's tasks settle, re-run the measurement and ledger goal.moved / goal.unmoved with both values.
    (iii) Unmoved goals are retro input; the console shows spend and movement per goal; a goal with poor spend-to-movement
    is proposed for lower priority through the existing governed plan flow rather than stopping or mutating its priority
    directly. First retrofit: PR-flow, CI redesign, model evidence. Console rendering is a separate console-repo companion.
  acceptance:
