  falsifier: |
    Leave the catch in checkDispatchGovernors discarding the error: the transient test finds no ledger row,
    and the sustained test sees dispatch admitted with no escalation. Replace the derived bound with a literal
    constant: the history test reads the same bound for two different recovery histories. Never clear the
    streak on a good read: the recovery test sees the hold persist.
