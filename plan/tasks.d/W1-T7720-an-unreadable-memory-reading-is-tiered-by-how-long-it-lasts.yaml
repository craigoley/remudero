  title: "AN UNREADABLE MEMORY READING IS TIERED BY HOW LONG IT LASTS — a transient read failure of the host memory probe or the reservation store keeps dispatching and writes a ledger row; a sustained one holds new dispatch and escalates; the line between them is derived from observed recovery times, never a fixed cap"
