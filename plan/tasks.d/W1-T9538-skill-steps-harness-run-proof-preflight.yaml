    - claim: "one integration test loads the real proof-preflight skill fences, executes them through the worker harness and runner, asserts before/after prompt results and one skill.step row per step, then passes those same rows to buildSkillEffectivenessReport and asserts executed-step effectiveness; removing any link fails that test"
      proof: "unit test: test/skill-steps-run.test.ts"
