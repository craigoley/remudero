- id: W1-T9538
  title: "Harness-run skill steps: fenced rmd: directives in SKILL.md, piloted on proof-preflight, ledgered as harness-observed skill.step rows"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 80.00
  rationale: "OPERATOR RULED 2026-10-13 ('File, pilot proof-preflight'). Skill usage is self-reported
    (SKILLS_USED -> skills.used via logSkillsUsed), so buildSkillEffectivenessReport measures injection and
    self-claims, not execution. proof-preflight steps 2, 5 and 6 (run proof before, rerun proof after, run
    test-tier check) are deterministic: the harness already knows the task's proofs and files. Pattern observed
    in nanoclaw (nanocoai/nanoclaw ab09973a): prose plus fenced directives, an engine runs what it understands,
    anything else degrades to the agent. Ships NO new skill; the 2026-09-29 outcome-only skill retirement stands;
    mining is out of scope. Line numbers cited in the feedback were read at efd226b50 and have drifted at current
    main (logSkillsUsed now src/run-task.ts:37625, buildSkillEffectivenessReport src/lib/skill-workshop.ts:831);
    the implementer re-locates by symbol."
  design: |
    1. SYNTAX. Fenced blocks inside SKILL.md (rmd:proof before, rmd:proof after, rmd:check <command>). With
       fences stripped the prose must still read as a complete procedure (test asserts this on proof-preflight).
    2. RUNNER. A new module parses fences and runs the ones it understands around the worker: before-proof
       result and after-proof/check results are placed in the worker prompt. One skill.step ledger row per
       step: skill, step, phase, outcome. Harness-observed, never self-reported.
    3. FALLBACK. An unknown directive or a step that fails to run falls back to the prose step for the agent,
       with a row whose outcome records the deferral. Never a crash, never a silent drop.
    4. REPORT. buildSkillEffectivenessReport reads skill.step rows when present and measures effectiveness on
       executed steps; with no rows it keeps today's behaviour.
    5. Annotate .claude/skills/proof-preflight/SKILL.md steps 2, 5, 6 with the fences. Keep the boundary that
       workers do not execute scripts: the harness runs the steps, not the worker.
    FALSIFIER: remove the harness step runner; a proof-preflight run then writes no skill.step row and its
    prompt carries no before or after proof result.
  acceptance:
