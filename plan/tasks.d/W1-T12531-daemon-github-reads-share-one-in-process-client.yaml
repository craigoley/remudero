  rationale: |
    Each daemon GitHub read starts its own gh process, and those processes cost the host CPU that reviews and builds need.
    MEASURED by the operator session on the Azure host, 2026-11-13: 5-7 gh CLI processes run at once, about 2 cores between
    them. The installation rate limit was hit at 15:00Z and killed 2 post-review runs.
    READ at origin/main 51e329755, src/lib/github-transport.ts:
    - :385 ghJsonAsync calls ghStdoutAsync, which runs execAsync("gh", ...) (:403) once per read that the broker (:219
      ghBrokeredAsync) does not answer. Each read pays a full gh start: a new process, its config read and a new TLS connection.
    - :330 asyncReadInFlight already coalesces identical concurrent reads, and :1832 applyGhReadCadenceAsync paces them;
      both sit before the spawn, so an in-process client can keep them by replacing only the spawn.
    - :152-168 every gh spawn takes its credential from resolveGithubCredential (W1-T11926, src/lib/github-credential.ts).
    - :43 parseGhRateLimitHeaders reads the same response headers an HTTP client receives directly.
    W1-T12075 and W1-T12272 (both queued) move every gh call site to that one credential source and ledger a missing one;
    they keep one gh process per call. This task keeps their credential rule and removes the process for daemon reads.
    CHECKED for overlap: W1-T10279's broker serves the Mac accounts' reads and stays first in line here; W1-T12530 changes how
    many reads the open-PR views make, not how each is sent.
  design: |
    1. New module src/lib/github-http-read.ts: one shared client, githubHttpRead (node's fetch with a keep-alive agent) that takes an
       already-parsed read (path, headers wanted) and a token, sends GET https://api.github.com/<path> with the headers gh
       sends (Accept: application/vnd.github+json; User-Agent: remudero), and returns {status, headers, body}. It must
       not import the ledger or config (github-transport.ts sits below the ledger; check with depcruise).
    2. In ghStdoutAsync, after the broker and the cadence step and before the spawn: when the args are an `api <path>` read the
       client can parse (no method flag other than GET, no -f/-F/--input, no --paginate/--slurp, no --jq/-q/--template, no
       --hostname), send it through the client with the token resolveGithubCredential picks. With the -i form, rebuild the
       header block so splitGhHeaderBlock and parseGhRateLimitHeaders read it unchanged. Any other form spawns gh as today.
    3. Map a non-2xx response to the error the gh path raises for it (same class, same message shape, so isGhRateLimitError
       and the pacer react the same way).
    4. The injected-executor seam stays: when execAsync is not the real execFileAsync, the call takes the spawn path, as the
       coalescing code already does.
    INVARIANT one-credential-source: the client's token is the one resolveGithubCredential returns for the same argv.
    INVARIANT same-read-rules: broker first, then the cadence floor, then coalescing, for both the client and the spawn.
    NOT IN SCOPE: writes, synchronous ghJson/ghExec callers, the broker's own upstream spawn (ghRunForBroker).
  falsifier: |
    Route criterion 1's read to the spawn and criterion 1 must fail (a child process starts). Skip applyGhReadCadenceAsync on
    the client path and criterion 2 must fail. Map a 403 secondary limit to a plain error and criterion 4 must fail. Restore
    and all must pass.
