  note: "verify:human ON PURPOSE — `isDispatchEligible` parks it until the operator rules, because
    design (i) is a policy question about relaxing a safety guard and no linter can settle it. Every
    other field is filled so that a ruling is the ONLY thing missing.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance text
    and this set crosses `src/lib` and `test/`. Raised up front.
    `test/self-sync.test.ts` IS DECLARED AND THE REASON IS MEASURED: it drives real repos through
    `checkCliFreshness` and asserts the `dirty` refusal, so it is the suite that moves the moment the
    predicate is scoped. That is the FIFTH consecutive task this week where a `files:` list would
    otherwise have omitted the suite pinning the old behaviour (W1-T442, W1-T443, W1-T444, W1-T445).
    THE FALSIFIER MUST DRIVE REAL GIT REPOS, never a stubbed runner alone — the existing suite
    already builds a real origin and clone and asserts HEAD ACTUALLY ADVANCED, and a scoping change
    proven only against a fake `git` would pass while the real `status`/`diff` disagreed.
    AND IT MUST ASSERT THE REF: a test that only checks `status !== \"refused\"` passes for an
    implementation that permits the sync and then fails to move anything.
    Q1 — THE REFUSAL-TYPE RATES ARE NOT MEASURABLE, AND THAT IS ITSELF THE FINDING.
    `checkCliFreshness` WRITES NOTHING TO THE LEDGER; it only `warn()`s to stderr, so no row records
    whether a refusal was `dirty`, `diverged` or `off-main`. MEASURED across ALL THREE ledger forms on
    the mini (666 `.gz`, 4 plain, 1 live) at 2026-08-14: the function's own four message substrings —
    `refusing to auto-sync`, `has diverged from origin/main`, `never merging or rebasing on your
    behalf`, `uncommitted changes` — all return ZERO, against a POSITIVE CONTROL of 2,009 `sweep.pass`
    rows over the same corpus with the same tool and flags. The only freshness rows present are
    `daemon.install_freshness` (11) and `daemon_selfrestart_for_freshness` (2), both written by
    `checkServiceFreshness`, a DIFFERENT function. SO NOBODY CAN BE SHOWN WHICH HALF IS THE COMMON ONE,
    and this shard must not imply otherwise. If the ruling needs that number, the rates have to be
    instrumented first.
    W1-T452 ALREADY SHRANK THE DIRTY POPULATION. #1731 (merged 2026-08-13T13:58:42Z) returns
    `{status: worktree}` ABOVE the dirty branch, and its own comment says so: `It also skips dirty,
    which a worktree mid-task always is.` A worker worktree is dirty mid-task AND diverged once it
    commits, so that single return removed the ENTIRE worktree population from BOTH refusals; 82
    worktrees are registered on this clone. WHAT REMAINS in the dirty population is non-worktree
    checkouts — in practice the operator's own `main` and the daemon's live checkout.
    Q2 — A DIVERGENCE REFUSAL MAY SIMPLY BE CORRECT, WHICH NARROWS THIS SHARD RATHER THAN WEAKENING IT.
    An unpublished commit is work, and the function states one contract for both arms: never mutate,
    never merge or rebase on the operator's behalf. The real case was resolved by archiving and
    dropping that commit rather than asking the tool to reason about it. IF THAT READING HOLDS, the
    scope here is the `dirty` guard ALONE and this amendment has removed a misleading exhibit and
    nothing else. NOT A RULING — recorded so the ruling is not made against the wrong branch.
    Q3 — WHAT A STALE CLI THERE COSTS, since it changes the stakes. `~/Remudero/remudero` is not a
    spare checkout: MEASURED 2026-08-14, `com.remudero.daemon` (pid 83613) and `com.remudero.serve`
    (pid 87805) BOTH run `/Users/craigoleyagent/Remudero/remudero/bin/rmd` ->
    `node_modules/.bin/tsx src/run-task.ts`. THE RUNNING PAIR IS NOT AFFECTED — each holds its module
    graph from process start — so a stale checkout costs (a) every NEW `rmd` invocation from that
    directory, which is the binary the mini's sessions invoke, and (b) whatever the daemon boots into
    at its NEXT restart. Both booted after the reset and are on origin/main now.
    NO SHA OR COUNT ANYWHERE IN THIS SHARD SHOULD BE QUOTED FORWARD — `f8eefb5..70d52c2` and the
    one-line porcelain were true at 2026-08-12T20:00Z; the clean/diverged and reset readings at
    2026-08-14T13:00Z and 13:34:39Z; the ledger and worktree counts on the mini that same day. The
    mini and Azure keep SEPARATE ledgers with no ssh route, so none of these is a claim about Azure."
