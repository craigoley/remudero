    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance text
    and this set crosses `src/lib` and `test/`. Raised up front.
    `test/self-sync.test.ts` IS DECLARED AND THE REASON IS MEASURED: it drives real repos through
    `checkCliFreshness` and asserts the `dirty` refusal, so it is the suite that moves the moment the
    predicate is scoped. That is the FIFTH consecutive task this week where a `files:` list would
    otherwise have omitted the suite pinning the old behaviour (W1-T442, W1-T443, W1-T444, W1-T445).
    THE FALSIFIER MUST DRIVE REAL GIT REPOS, never a stubbed runner alone — the existing suite
    already builds a real origin and clone and asserts HEAD ACTUALLY ADVANCED, and a scoping change
    proven only against a fake `git` would pass while the real `status`/`diff` disagreed.
    AND IT MUST ASSERT THE REF: a test that only checks `status !== \"refused\"` passes for an
    implementation that permits the sync and then fails to move anything.
    NO SHA OR COUNT HERE SHOULD BE QUOTED FORWARD — `f8eefb5..70d52c2` and the one-line porcelain
    were true at 2026-08-12T20:00Z on the mini."
