  rationale: |
    OBSERVED 2026-11-20 (host ledger, core) on #19791:
    - 15:14:46 sweep.review_started; the post-review lane ran "one exact-input review alongside CI".
    - 15:15:10 review.pending_posted (run review-PR19791-1795187698034).
    - 15:19:52 worker.output_truncated, then 15:19:55 review.reviewer error_incomplete_output and
      review.semantic_incomplete; 15:20:06 daemon.child_work_settled outcome lost. No review.posted row.
    - 15:38:37 sweep.disposed wait: "checks pending 42m (< 60m ceiling) — waiting, re-deriving next sweep".
    - No review ran again until 16:07:47, when an operator hand run took over the stale claim.
    Window 12:00Z to 16:28Z: 59 review runs claimed a pending status and 14 of them never posted a verdict;
    12 of the 14 ended in review.semantic_incomplete.
    OBSERVED at origin/main f5c90bcd4, src/lib/sweep.ts:
    - The alongside-CI post-review row requires `pr.reviewState === "none"`, so a head that still shows the
      dead run's pending claim never matches it.
    - The dead-owner re-run row ("owner proven dead — re-running the review lane") requires
      `pr.checksState === "green"`.
    - So while checks are pending, a dead claim falls to the wait row until CI ends or the claim passes
      REVIEW_LOCK_TTL_MS (42 minutes).
    W1-T13951 removes the most common way a reviewer dies (output past the 1 MiB cap). This task makes any
    other death cost one sweep pass instead of the rest of the CI run.
  design: |
    INVARIANT live-claim-waits: only the view producer's own proof that the owner is dead releases the claim.
    1. In the alongside-CI post-review row of src/lib/sweep.ts, also match `pr.reviewState === "pending"` when
       `pr.reviewPendingOwnerDead === true`, with the same age, refusal and unreadable-context guards it has today.
    2. Keep the existing `(pr.priorReviewAttemptsForInput ?? 0) === 0` and reviewInputLoop bounds, so one input is
       still reviewed at most as often as today; a dead claim that never posted adds no completed judgment.
    3. Give the reason its own wording for this case, naming the dead owner, beside the existing text.
    4. A stale-only pending (reviewPendingIsStale without reviewPendingOwnerDead) keeps waiting while checks run.
  falsifier: |
    Remove the new match and criterion 1's fixture is disposed wait, as #19791 was at 15:38:37Z.
  note: |
    Id reserved for run-unfiled-1795192209733 with rmd next-task-id on the host.
