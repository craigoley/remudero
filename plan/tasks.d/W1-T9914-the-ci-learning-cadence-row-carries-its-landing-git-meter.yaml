  rationale: |
    READ at origin/main fb566039c, which carries W1-T9638 and W1-T9755. Symbols, not lines:
    - src/lib/feedback-landing.ts: `LandingGitMeter` and `newGitMeter` count each git ask's calls, wall ms and
      loop ms (meterGit). driveLanding and driveLandingAsync take the meter as an optional third argument.
      Only sweepFeedbackLanding and sweepFeedbackLandingAsync pass one, and logLandingSweep writes it onto
      `feedback.landing_sweep` as git_driver, git_calls, git_wall_ms and git_loop_ms.
    - landCiLearningShardsAsync calls `driveLandingAsync(ciLearningLandingSteps(...), preflight)` with no meter.
      CiLearningFilingResult has no git field.
    - src/run-task.ts buildCiLearningCadenceRunner keeps only the filed, skipped and refused counts from the
      landing. src/lib/daemon.ts writes the `ci_learning_cadence.ran` row from that result.
    - The brief named src/lib/measurement-cadence.ts. It holds the ci-learning markers and
      ciLearningCadenceCheck only. It does not write the row, so it is not in files:.
    OBSERVED by the W1-T9755 builder (logs-8864/9755-bench.log, offline bench of landCiLearningShardsAsync, real
    git, 3 queued shards, 5 reps per arm, same tree): with a 1 GB touched ballast (RSS about 1.1 GB) the loop was
    held 2575-3198 ms per pass on main and 1544-2123 ms at head. At about 110 MB RSS the arms were within noise.
    INFERRED: the daemon runs at 1.5-2 GB RSS, so the live saving should be at least the bench's. No ledger row
    can show it today, because no ci-learning row carries the meter.
    W1-T9801 (queued) adds carry refusals to the same row through the same runner result. This task waits for it,
    so the two builds do not edit the same row literal at once.
    lint-plan names W1-T147 (the overnight chaos drill, verify: human) as sharing src/lib/daemon.ts and
    src/run-task.ts. That drill injects faults around the daemon; it does not touch the ci-learning row or the
    landing meter, so the overlap is two large files, not one surface.
  design: |
    1. landCiLearningShardsAsync (and the sync landCiLearningShards, with driver "sync") drives its landing with a
       fresh meter and returns it on CiLearningFilingResult as `git: { driver, calls, wallMs, loopMs }`.
    2. buildCiLearningCadenceRunner copies that onto CiLearningCadenceRunnerResult. A run that drafted nothing and
       so did not land carries no git field.
    3. The daemon's ci_learning_cadence.ran row writes git_driver, git_calls, git_wall_ms and git_loop_ms with the
       same names and rounding as feedback.landing_sweep. When the run did not land, it writes
       `git_driver: "none"` and git_calls 0, so a reader can tell "no landing" from "not measured".
    4. No new constant, no new step name.
    Tests go in test/the-ci-learning-cadence-row-carries-its-landing-git-meter.test.ts, titled verbatim as in the
    proofs. Drive landCiLearningShardsAsync over a real temp repo with one queued draft, and the daemon's cadence
    with a runner fake.
  acceptance:
    - claim: "an awaited ci-learning landing returns its git meter: driver async, a call count above zero, and wall and loop ms"
      proof: 'grep: test("W1-T9914: an async ci-learning landing returns its git meter" in test/the-ci-learning-cadence-row-carries-its-landing-git-meter.test.ts'
    - claim: "the ci_learning_cadence.ran row carries git_driver, git_calls, git_wall_ms and git_loop_ms, and git_driver none when nothing landed"
      proof: 'grep: test("W1-T9914: the cadence ran row carries the landing git meter" in test/the-ci-learning-cadence-row-carries-its-landing-git-meter.test.ts'
  falsifier: |
    On origin/main, landCiLearningShardsAsync returns { filed, skipped, refused } with no git field, so the first
    test fails. Drive the daemon's ci-learning cadence with a runner whose result carries a meter: the
    ci_learning_cadence.ran row has no git_driver, so the second test fails.
