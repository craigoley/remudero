  note: |
    NO TIER MOVES ON THIS SHARD AND THE INVARIANT IS NOT DELETED. It proposes a MEASUREMENT and a
    RE-EXAMINATION, not a downgrade. W1-T167 established routing as policy data with per-class cost
    and outcome ledgered SO THE RETRO CAN EVALUATE IT; this is an input to that evaluation and
    nothing more. `assertArchitectAboveWorker` keeps throwing on a same-or-lower-tier Architect,
    `enforceTierInvariant` keeps rejecting a violating `mounts.yaml` at load, and the `architect:`
    row is not edited.

    THE REVIEWER'S TIER AND THE RISK JUDGE'S VETO TIER ARE OUT OF SCOPE. The judge mount rides opus
    for a reason `.remudero/mounts.yaml` states independently — it supervises a worker and must
    outrank what it supervises — and that is the ratification half of §2 above, which no capability
    measurement speaks to. Do not let a build widen into them.

    AND THE PAPER IS EVIDENCE FOR AN ARGUMENT, NEVER A MEASUREMENT OF THIS REPO. Its harness is
    task-time context — skills, prompts, memories, tools — and a plan shard is a work item, not
    context. A build that cites it as though it measured specification-writing here should be
    refused. What this shard actually asks for is the local measurement, because this fleet's own
    ledger can answer its own version of the question and never has.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (retro, tier-invariant-evidence) at risk:medium
      — Rule 19: raise to risk:high or decompose into one task per concern

    Rule 19 derives the concern from each declared path's STEM, so
    a source file and the new test that falsifies it read as two concerns whenever the test is not
    named after the source. AND THE BAND EXEMPTS RATHER THAN CLEARS: `sizingViolation`
    (`src/lib/task-linter.ts`) returns `undefined` on its first line at `risk: high`, so that
    refusal is the only scoring of this span this shard will ever get.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/tier-invariant-evidence.test.ts`, declared in `files:` and absent
    from this tree, so on the filing PR each resolves through W1-T456's forward-reference carve-out
    to `not_yet_built`.
