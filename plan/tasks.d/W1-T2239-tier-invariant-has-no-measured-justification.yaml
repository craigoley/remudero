      proof: "unit test: test/tier-invariant-evidence.test.ts"
    - claim: "a lane whose rows carry no model key is reported as unattributed rather than folded into a model total"
      proof: "unit test: test/tier-invariant-evidence.test.ts"
    - claim: "notional cost is labelled as api-equivalent rather than presented as billed spend"
      proof: "unit test: test/tier-invariant-evidence.test.ts"
    - claim: "the tier invariant still throws on a same-or-lower-tier architect exactly as it does today"
      proof: "unit test: test/tier-invariant-evidence.test.ts"
    - claim: "no mount row and no configured model is altered by this change"
      proof: "unit test: test/tier-invariant-evidence.test.ts"
