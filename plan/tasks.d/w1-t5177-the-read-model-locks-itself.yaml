  design: |
    Readers (the materializer's reads and the consistency oracle) open their own read-only WAL connection, so they
    never take or wait on the writer's lock; only the projector writes. busy_timeout stays as is. A remaining lock
    failure keeps today's backoff and ledgers which connection hit it.
  acceptance:
    - claim: "a reader connection never reports a lock while the projector writes"
      proof: 'grep: test("W1-T5177: a reader connection never reports a lock while the projector writes" in test/read-model-readers-never-contend-with-the-writer.test.ts'
  falsifier: |
