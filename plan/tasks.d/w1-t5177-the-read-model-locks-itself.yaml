  rationale: |
    OBSERVED (core ledger union, 84,778 rows, 4,620 read_model.* rows as control): read_model.tick_failed x5 and
    read_model.materialize_failed x4 with error "database is locked" (e.g. 2026-10-01T18:19:23Z and 20:02:04Z,
