  note: |
    risk:high, band_meaning: blast-radius — this changes what a live CI gate accepts on EVERY
    source file, and a wrong bucket either stops catching growth or blocks the whole fleet. The
    span is one instrument plus its own falsifier suite.

    THE 145 EXISTING ENTRIES ARE NOT REWRITTEN by this task — see rationale (7). A reviewer
    expecting a large baseline diff should expect the opposite: none.
