- id: W1-T6107
  title: "MAIN BUILDS THE TEST IMPACT MAP THE SHADOW ARM READS — PR #9760 (W1-T6083) adds buildImpactMap, `coverage-merge-ratchet.mjs --impact-map` and `select-affected-suites.mjs --impact-map/--base`, but nothing ever runs the builder and CI's shadow step passes no map, so the impact arm records nothing; the coverage-shard artifacts it needs are kept for one day"
  repo: remudero
  depends_on: [W1-T6083]
  type: implement
  # a .github/workflows path: an operator build, as W1-T6088 and W1-T5940 park theirs
  verify: human
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the impact map is produced on main and handed to the shadow selector
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: follow-up found while building W1-T6083 (PR #9760)"
  plan_refs: [W1-T6083, W1-T4404, W1-T4406, W1-T6088, W1-T5940, W1-T5923, W1-T5705]
  files: [.github/workflows/coverage-nightly.yml, .github/workflows/ci.yml, test/main-builds-the-test-impact-map-the-shadow-arm-reads.test.ts, test/helpers/gh-shim.ts, test/helpers/gh-shim.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-06 on the PR #9760 head (1225b4c5d) and origin/main 23c0e7dfe. scripts/coverage-merge-
    ratchet.mjs `writeImpactMap` builds the map through src/lib/test-impact-map.ts `buildImpactMap` from
    raw, compact or chunked coverage directories and needs `--sha`; scripts/select-affected-suites.mjs
    reads one through `readImpactArmInput` when given `--impact-map <path>` and `--base`. No caller passes
    either: ci.yml's coverage-shard shadow step runs select-affected-suites with only --changed-files,
    --diff and --failed-from, and no step or daemon path runs `--impact-map`. The input exists: every
    coverage shard uploads `coverage-shard-<n>` (raw/ per-process reports, `retention-days: 1`) and the
    coverage-ratchet-required job already downloads all eight with `pattern: coverage-shard-*`. W1-T6083's
    shard design named a daemon-side fetch; #9760 built neither half of the delivery, so the map has no
    producer and the arm reads its fallback on every run.
    AMENDED 2026-10-13 (operator-approved redesign; the original reading above stays as written).
    THE ORIGINAL PRODUCER CANNOT WORK AT HEAD, MEASURED. W1-T5923 (premapping) changed what a ci.yml
    coverage shard uploads: `Stage this coverage shard` now copies coverage/premapped/coverage-*.json,
    and writePremappedCoverageDirectories keeps only each report's translated `result` array, dropping
    the `test`/`root`/`child` identity and the source-map cache that buildImpactMap needs to name a
    suite. Negative control on origin/main b001fd214: two real suites run under NODE_V8_COVERAGE, then
    `--premap-output`, then `--impact-map` over the premapped directory exits with "contains no V8
    coverage files". Positive control on the same raw reports: `--compact-output` (what
    coverage-nightly's shards upload; compaction keeps `test`, `root` and `child` per report) then
    `--impact-map` writes an rmd-test-impact-map-v1 map of 2 suites, 523 source files, 0 orphan
    reports, 1 suite credited with a child's report.
    THE ORIGINAL TRIGGER RARELY FIRES. Of the 30 newest ci.yml push runs on main (2026-10-13 05:54Z to
    10:22Z) 16 were cancelled by a newer push, and the 13 that succeeded include non-SOURCE commits whose
    coverage shards ran no instrumented suite (run 38381017566: every coverage shard 32-43 s).
    coverage-nightly is a schedule on main that no merge cancels, and its merge job already downloads
    all eight compact shards. Main merges about 200 commits a day (211 in the 24 h before this
    amendment), so a nightly map stays inside IMPACT_MAP_STALENESS_BOUND (150 commits) for roughly the
    first 18 hours after each run; past that the arm falls back and names why, which costs shadow
    evidence for part of each day and never a verdict.
  design: |
    PRODUCER: coverage-nightly, not ci.yml. In the `merge` job, after the merged lcov is written, install
    the lockfile (`npm ci`: the builder is TypeScript and runs under `--import tsx`) and run
    `node --import tsx scripts/coverage-merge-ratchet.mjs --impact-map test-impact-map.json --sha
    "$GITHUB_SHA"` over the same eight `coverage-shards/coverage-shard-<n>/raw` compact directories the
    merge reads. A builder failure is written to the step summary and never fails the job (the map is
    shadow evidence, and the nightly's floor verdict must not depend on it). Upload the map as the
    `test-impact-map` artifact with `retention-days: 14` (at least 7), only when the file exists.
    CONSUMER: ci.yml's coverage shard, in SHADOW. On pull_request, a step before `Test with coverage`
    fetches the newest `test-impact-map` artifact from a successful coverage-nightly run on main with
    the same `gh run list` / `gh run download` pattern the narrowed-floor read already uses (the
    workflow holds `actions: read`), and records the map's path. The shadow selector call then passes
    `--impact-map <path> --base <the PR base sha>`; with no map it passes neither flag and prints why.
    Live selection, required checks and every other event's behavior do not change. The shared gh
    shim (test/helpers/gh-shim.ts) gains a route that writes a file, so the fetch step's real shell body
    can be exercised with a downloaded map; no hand-rolled gh shim (the fixture-copy census refuses one). THE COSTLY
    CANDIDATE (also building per-shard maps in ci.yml's shards before premapping and merging them on
    main pushes) waits until the shadow record shows the arm is worth a fresher map than one a day.
  acceptance:
    - claim: "coverage-nightly builds the impact map from its eight downloaded compact shards with the run's sha, uploads it as the test-impact-map artifact with a retention of at least 7 days, and never fails the run on a builder error; ci.yml's coverage-shard shadow step on pull_request passes --impact-map with --base when a nightly map was fetched and omits both when none exists, and no other event's selection changes"
      proof: "unit test: test/main-builds-the-test-impact-map-the-shadow-arm-reads.test.ts"
  falsifier: |
    Drop the `--impact-map` pass from the shadow step, or build the map from a premapped directory: the
    workflow fixture's shadow invocation carries no map flag, or the builder control finds no V8
    coverage, and the test fails. Let a builder error fail the nightly: the never-fails control fails.
