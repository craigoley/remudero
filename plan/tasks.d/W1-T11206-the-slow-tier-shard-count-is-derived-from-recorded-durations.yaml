  acceptance:
    - claim: slowTierShardCount(manifest, { ceilingMs, workers }) returns the smallest shard count, never below 2, whose largest shard's predicted wall time (predictMakespanMs over balanceFilesByDuration's split of the slow tier) is at most 60% of the job ceiling; it rises when recorded durations grow, and on origin/main's scripts/test-tier-manifest.json with the 35-minute ceiling it returns more than 2
      proof: "unit test: test/ci/suites/the-slow-tier-shard-count-is-derived-from-recorded-durations.test.ts"
    - claim: ci.yml derives the test-slow-shard matrix from that count through a planning job's output, and both the push lane and the pull-request lane pass --shard <index>/<derived count>, so no hard-coded shard total remains
