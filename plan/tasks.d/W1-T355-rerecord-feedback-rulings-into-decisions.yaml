  design: |
    ONE DECISIONS.md ENTRY PER RULING, TRANSCRIPTION NOT EDITING.
    (i) Each entry: an operator-attribution header dated with the RULING's own date (not the
    transcription date prominently — the ruling ruled when it ruled), the feedback entry's raw text
    QUOTED VERBATIM — byte-identical, fenced — and a provenance line naming the feedback id and
    carrying the literal phrase 're-recorded from plan/feedback' (load-bearing text: the first
    acceptance proof greps for it, chosen because the a4153e id ALREADY appears in DECISIONS.md's
    2026-07-28 SUPERSEDES header and would go executed_stale as a pattern). Nothing is reworded,
    summarized, or dropped.
    (ii) THE FEEDBACK FILES ARE NOT DELETED and their status fields are NOT edited by this task —
    the queue's own lifecycle owns them; this task only makes the permanent record exist where
    DECISIONS.md's readers already look. (The a4153e citation in the 2026-07-28 entry then resolves
    inside the same file.)
    (iii) COMPLY WITH THE PROVENANCE FLOOR by construction: every added entry carries the operator
    attribution form — this task is the first filed under the W1-T353 rule and is verify:human for
    exactly that reason; the operator's review of the PR IS the ratification that the transcription
    is faithful.
    (iv) FALSIFIER: a diff-check that each of the five raw texts appears byte-identical inside
    DECISIONS.md (the fenced quote equals the feedback file's raw field) — state the comparison in
    the PR body with the five ids.
    NOT IN SCOPE: ruling on anything new; editing feedback statuses; the sixth-and-beyond candidates
    (none found — if the implementing pass finds another self-labelled ruling, it says so and the
    operator decides whether it joins).
