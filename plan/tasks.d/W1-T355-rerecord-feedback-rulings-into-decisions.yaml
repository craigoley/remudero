  rationale: "RE-DERIVED AT da30616 by a full sweep of plan/feedback/ (109+ entries): exactly FIVE
    are true ruling-records — text that self-labels as operator authority and issues binding
    direction rather than reporting a defect:
    fb-1784894405468-a4153e ('HEADROOM GOVERNOR BECOMES A FLAG, DEFAULT OFF — OPERATOR RULING
