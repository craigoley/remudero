  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/wipe-test.test.ts`, which is declared in `files:` and already exists — it
    carries 26 tests today — so each resolves against a real file rather than a forward reference.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND IS SET UP FRONT RATHER THAN AFTER A
    REFUSAL. `files:` names three stems (`run-task`, `wipe-test`, and the suite), which the sizing
    check reads as distinct concerns and refuses at `medium` — the same refusal W1-T1234 took at
    filing time. Decomposing is wrong here: the pre-flight and the ledger-time backstop are one
    rule ("never record a pair you did not measure") applied at the only two points that can see
    it, and either alone leaves the other's cause recordable. The blast radius is narrow: one verb
    that no automated lane invokes, one writer, and no change to any dispatch path.

    THE REFUSAL MAKES THE HARNESS UNUSABLE TODAY, AND THAT IS THE POINT. With every sandbox subject
    merged (rationale 1), the pre-flight will refuse every invocation until the generator of
    rationale (8) exists or `--rerun` is wired. That is the correct outcome: an instrument with no
    subjects should say so, not emit zeroes. The alternative — leaving it writing null pairs — lets
    `aggregateWipeTestPairs` report a growing `pairs` count made entirely of refusals, which is the
    exact shape that makes a number look like evidence.

    ONE FIGURE THIS SHARD DECLINES TO INVENT. Rationale (9): the design says "many" and names no
    threshold, and choosing N needs an effect size nobody has measured. A later reader wanting a
    number should say what effect size they are powering for.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN.
    `refs/rmd-id/W1-T1252` resolves on origin against a namespace of 282 such refs; a reservation
    existing is not evidence a shard does. EIGHT ID SURFACES WERE SWEPT, each against a control
    PRE-QUALIFIED ON THAT SURFACE — and the qualification was done first rather than assumed:
    W1-T1231 reads 0 on the main-tree surfaces because its shard is not on main, so W1-T1234 and
    W1-T1227 (both on main) were used there instead. Shard filenames 0 against W1-T1234 at 1; plan
    `- id:` lines 0 against W1-T1234 at 1; the reservation 1, which is the pre-mint, against
    W1-T1234's own reservation at 1; open PR titles 0 against W1-T1251 at 1 (live in an open
    title); open PR head branches 0 against a `run-W1-T` head at 1; open PR file lists 0 with
    coverage at seven captured of seven enumerated, against `plan/tasks.d/` paths at 4 across the
    same heads; merged trailers 0 against `Remudero-Task: TRIAGE-fb-1785958099820-862db0` at 2,
    with 48 trailer-carrying commits on main; and merged subject credit 0 against W1-T1234 at 1,
    with `run-W1-T1252-*` at 0 against a namespace of 82 `run-*` branches.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE, NOT A PRESENCE TEST. Four
    markers were counted at every one of the seven open PR heads and at main: `allow-non-sandbox`
    and `wipeTestCommand` in `src/run-task.ts`, and `ledgerWipeTestPair` and `rerun` in
    `src/lib/wipe-test.ts`. Main reads 3 / 3 / 2 / 0 and EVERY head reads exactly 3 / 3 / 2 / 0 —
    no head moves any marker. The `rerun` count of 0 in `wipe-test.ts` is the fact rationale (3)
    rests on, identically absent everywhere, and the three non-zero markers are the control that
    the reader worked.
