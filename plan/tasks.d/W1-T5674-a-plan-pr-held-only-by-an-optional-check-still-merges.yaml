- id: W1-T5674
  title: "A PLAN PR HELD ONLY BY AN OPTIONAL CHECK STILL MERGES — W1-T5615's `attemptPlanPrMerge` admits only `clean`/`behind`, so a plan PR whose required checks are green but a non-required check is red (`unstable`) is held unarmed on every pass forever, and its `readPlanTouch` REST read repeats on every arm attempt"
  repo: remudero
  depends_on: [W1-T5615]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: medium
  origin: "operator session 2026-10-04: watch log, W1-T5615 (#9119) follow-ups"
  plan_refs: [W1-T5615, W1-T5472, W1-T2855]
  files: [src/lib/arm-auto-merge.ts, test/a-plan-pr-held-only-by-an-optional-check-still-merges.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on #9119 (W1-T5615, merged 9acbd719; re-checked on 43190266). `attemptArm` calls
    `attemptPlanPrMerge` for a `touched` or `unreadable` plan PR, which takes the direct path only
    when `facts.mergeableState === "clean" || facts.mergeableState === "behind"` and otherwise
    returns `plan-pr-held`. `unstable` means the required checks pass and a non-required check is red
    or pending; before #9119 `armAuto` merged such a PR, after it the PR is held on every pass.
    `directMergePreflight`'s own comment already treats `clean`, `blocked` and `unstable` as
    merge-as-is states; `has_hooks` is GHES-only. `readPlanTouch` (`planTouchFromRest`, a sync
    `ghJson`) now runs before `armAuto` on every arm attempt, and a held plan PR repeats it plus
    `readMergeFacts` every pass.
  design: |
    (i) Admit `unstable` (and `has_hooks`) to the direct path, where `directMergePreflight` still
    updates a behind head first.
    (ii) Cache `planTouch` per `prUrl@head` in `realArmDeps`, like the existing `mergeQueueReads`
    TTL cache; never cache `unreadable`.
  acceptance:
    - claim: "a plan PR whose mergeable_state is unstable with behind_by 0 is merged directly, and two arm attempts at one head read its file list once"
      proof: "unit test: test/a-plan-pr-held-only-by-an-optional-check-still-merges.test.ts"
  falsifier: |
    Drop `unstable` from the admit list; the result is `plan-pr-held` and the test fails.
