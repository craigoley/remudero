- id: W1-T3646
  title: "TWO AGENTS REPAIR THE SAME PULL REQUEST AND NEITHER CAN SEE THE OTHER — the reviewer takes a named lock before it judges, but nothing is held while a PR is being FIXED, so independent lanes rediscover one defect, write the same remedy twice, and race each other's pushes"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  files: [src/lib/review.ts, test/a-pr-under-repair-names-its-holder.test.ts]
  origin: oper#pr-queue-sweep-2026-09-16
  plan_refs: ["W1-T3647", "W1-T3645"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED ACROSS ONE NIGHT OF BOARD REPAIR, with the duplicates named:

        #5684  two lanes independently reached the SAME two remedies (a PRIMARY CONTROL kind tag
               and an @source-text-subject marker); one lane's commit was discarded
        #5673  same defect diagnosed twice
        #5697 / #5698   two PRs filed minutes apart for one shard-lint failure; one closed
        #5699 / #5704   still open, and their diffs are BYTE-IDENTICAL
        two pushes rejected mid-flight because the branch had moved under a second repairer

    None of that is a reasoning failure. Each lane read the same red check and derived the same
    correct fix; the waste is that neither could see the other had started.

    THE MECHANISM ALREADY EXISTS, ONE STATE OVER. Before judging, the reviewer posts
    `remudero-review: review in progress (owned by run <runId>)` (src/lib/review.ts) -- a named,
    visible claim on the PR for the duration of the work. Reviewing is held. REPAIRING is not, and
    repairing is the longer and more collision-prone half.
  design: |
    Reuse the reviewer's own lock shape rather than inventing a second protocol: a status posted on
    the head sha naming the holder, so the claim is visible to anything that can read the PR and
    dies with the sha it was taken against.

    A LEASE, NOT A MUTEX. It must be advisory and TIME-BOUNDED (see W1-T3647, which supplies the
    TTL this leans on). A repair lease that cannot be broken converts one stuck lane into a PR
    nobody may touch, which is strictly worse than the duplication it prevents -- the failure this
    very board hit when a review lock sat for two hours.

    WHAT IT MUST NOT DO: block a human, and never gate CI. The lease informs a lane deciding what
    to pick up next; it is not a permission check on pushing.

    THIS TASK IS THE CLAIM; W1-T3647 IS ITS EXPIRY. They share src/lib/review.ts deliberately and
    are filed apart because they fail differently: without this one, work is duplicated; without
    that one, work is blocked. Neither subsumes the other, and a single task would have to justify
    one band for two failure modes.
  acceptance:
    - claim: "a lane beginning repair on a PR records a visible holder on that head, so a second lane reading the PR can see the work is already claimed"
      proof: "unit test: a repair lease names its holder on the head sha"
    - claim: "the lease is advisory and never gates a push or a check, so a claimed PR stays repairable by anyone who decides to"
      proof: "unit test: a held repair lease does not refuse a push"
    - claim: "a lease taken against an older sha does not hold the current head, so a pushed fix releases the claim rather than outliving it"
      proof: "unit test: a lease on a stale sha does not hold the new head"
  falsifier: |
    Run two repair lanes against one PR: the second must see the first's holder. Remove the lease
    and it must see nothing, which is today's behaviour and the state that produced the five
    duplicates above. Make the lease refuse a push and the second test must fail. Push a new commit
    and confirm the old lease no longer holds -- if it does, a stale claim outlives the work.
