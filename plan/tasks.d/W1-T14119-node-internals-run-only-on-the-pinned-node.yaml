- id: W1-T14119
  title: Coverage tooling that loads Node internals refuses to run on any Node other than the .nvmrc pin, and names the pin
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high # coverage merge and rebuild entry points; a wrong guard stops every coverage shard
  band_meaning: span
  origin: operator-session#pr-backlog-sweep-2026-11-21
  plan_refs: []
  files:
    - scripts/test-with-retry.mjs
    - scripts/coverage-merge-ratchet.mjs
    - test/merge-lcov.test.ts
    - test/node-24-runtime-compatibility.test.ts
    - test/ci/suites/node-internals-run-only-on-the-pinned-node.test.ts
  status: queued
  attempts: 0
  rationale: |
    #19651 removed hand-ship's use of Node internals and replaced it with the public --test-name-pattern and
    --test-skip-pattern filters, checked on Node 24.22.3. Other code still loads internal/test_runner/coverage under
    --expose-internals. Node does not keep that module stable between releases, and converge owns Node upgrades on
    the host, so the next upgrade can break the coverage merge without saying why.
    - scripts/coverage-merge-ratchet.mjs: loadTestCoverage requires internal/test_runner/coverage. It has
      assertPinnedNodeVersion, but that runs on the merge path only and no test proves it fires.
    - scripts/test-with-retry.mjs: rebuildCoverage requires internal/test_runner/coverage and the file re-execs itself
      with --expose-internals. It has no pinned-version check.
    - test/merge-lcov.test.ts and test/node-24-runtime-compatibility.test.ts load internal/test_runner/coverage
      directly in -e children.
    Other callers that pass --expose-internals to the merger are census scope, not edits: src/lib/ci-parity.ts,
    scripts/coverage-batches.mjs, .github/workflows/ci.yml, .github/workflows/coverage-nightly.yml, about a dozen
    tests that spawn the merger, and the source-map tests
    (test/daemon-memory-counts-the-source-maps-parsed.test.ts,
    test/memory/a-worker-spawn-names-its-site-without-source-maps.test.ts,
    test/the-sync-spawn-meter-names-its-caller-without-source-maps.test.ts).
  design: |
    1. test-with-retry.mjs --rebuild-coverage checks process.version against .nvmrc before it requires the internal
       module, and on a mismatch exits non-zero naming both versions.
    2. coverage-merge-ratchet.mjs runs assertPinnedNodeVersion before loadTestCoverage on every entry (--output,
       --compact-output, --premap-output), not only the merge path.
    3. A census in the new suite lists every tracked file that names internal/test_runner/ or --expose-internals, and
       fails when a new file joins without a pinned-version guard (a caller that only passes the flag to a guarded
       script counts as guarded through that script).
    4. The two tests that load the module directly fail loudly, naming both versions, when process.version is not the
       pin. They never skip and never pass vacuously.
    NOT IN SCOPE: replacing the coverage merge with a public API. Node has no public raw-V8-coverage merger at
    24.22.3, so that is its own design task.

    INVARIANT internals-only-on-the-pin: no code path loads internal/test_runner/coverage on a Node other than the .nvmrc pin without first failing and naming both versions.
  acceptance:
    - claim: "test-with-retry.mjs --rebuild-coverage on a Node other than the .nvmrc pin exits non-zero, names both versions, and never loads internal/test_runner/coverage"
      proof: "grep: W1-T14119 criterion 1: in test/ci/suites/node-internals-run-only-on-the-pinned-node.test.ts"
    - claim: "invariant:internals-only-on-the-pin — the coverage merger refuses a mismatched Node before loadTestCoverage on every entry (--output, --compact-output, --premap-output)"
      kind: guard
      proof: "grep: W1-T14119 criterion 2: in test/ci/suites/node-internals-run-only-on-the-pinned-node.test.ts"
    - claim: "a census lists every file that names internal/test_runner/ or --expose-internals, and fails when a new file joins without a pinned-version guard"
      proof: "grep: W1-T14119 criterion 3: in test/ci/suites/node-internals-run-only-on-the-pinned-node.test.ts"
    - claim: "the two tests that load the internal module directly fail loudly, naming both versions, when process.version is not the pin; they never skip and never pass vacuously"
      proof: "grep: W1-T14119 criterion 4: in test/merge-lcov.test.ts"
  falsifier: |
    Remove the version check from rebuildCoverage, or move the merger's check after loadTestCoverage: criteria 1
    and 2 load the internal module on a mismatched Node and fail. Add a new --expose-internals caller with no
    guard: criterion 3's census fails.
