- id: W1-T5049
  title: "AN INBOX THREAD IS POLLED EVERY 8 S AND TOOK 15.2 S COLD — /v1/inbox/threads is a request-time compute; add the on-demand inbox-thread?id= view over the thread store and that proposal's classification, so a reply moves its ETag and push retires the poll"
  repo: remudero
  depends_on: ["W1-T5048"]
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: "2026-10-01 core-console architecture Phase 4 design (P4-T10), arch-phase4-design.md"
  plan_refs: ["W1-T4088"]
  files:
    - src/lib/inbox-thread-view.ts
    - test/inbox-thread-view.test.ts
    - src/lib/read-model-worker.ts
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-10-01 (Phase 4 gentle probe, host): /v1/inbox/threads answered in 15,209 ms cold, and the
    console's /inbox/[threadId] page polls every 8 s. Inbox is the top measured pain in the Phase 4 ranking.
  design: |
    inbox-thread?id= is an on-demand keyed view (W1-T5048's want mechanism). Inputs: the thread store jsonl
    and the thread's proposal classification from the inbox view (P4-T06). It is dirtied by the thread file's
    fingerprint (size, mtime, inode) and by that proposal's classification. Source: inbox-store. Register it
    in read-model-worker.ts. The console retires the 8 s poll once the view serves.
  acceptance:
    - claim: "a thread reply changes the inbox thread view etag"
      proof: 'grep: test("W1-T5049: a thread reply changes the inbox thread view etag" in test/inbox-thread-view.test.ts'
    - claim: "an unchanged thread keeps its etag across worker passes"
      proof: 'grep: test("W1-T5049: an unchanged thread keeps its etag across worker passes" in test/inbox-thread-view.test.ts'
    - claim: "the worker registers the inbox thread view"
      proof: 'grep: createInboxThreadView( in src/lib/read-model-worker.ts'
  falsifier: |
    Key the body on the proposal alone: a reply leaves the ETag unchanged and the first proof fails. Rebuild
    on every pass with a fresh timestamp: the second proof sees the ETag move.
