- id: W1-T10777
  title: "AN ENGINE TREE IS NEVER AN UNMANAGED LANE — the ad-hoc lane reaper lists every <state>/engines/<hash> worktree as an unmanaged lane and has removed about 180 of them since 10-16, including the two whose removal failed core's state snapshot on 10-23 and 10-26; engines belong to pruneEngineTrees, which alone knows which one a live run names"
