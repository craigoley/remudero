  rationale: |
    OBSERVED 2026-11-20 (host ledger, core): 29 review.semantic_incomplete rows on #19673 from 11-19 13:48Z to
    11-20 12:09Z, each after worker.output_truncated with limitBytes=1048576 (spilled 1088278 / dropped 760598 at
    11:03Z; spilled 2176322 / dropped 1520962 at 11:36Z). #19830 died the same way at 10:52:44Z (spilled 1087719,
    dropped 760039, retained 3912) and its pending status then stood for 95 minutes. In 06:20-12:20Z, 21 of the
    review lane's 59 lost children exited 2 on incomplete output. A reviewer that reads large files emits large
    command-output items; the verdict is in the final agent_message, which the cap drops with the rest.
  design: |
    INVARIANT cap-unchanged: retention stays within the existing byte limit.
    1. worker-provider.ts (Codex stdout retention): when the limit is reached, drop command-output item bodies
       before agent_message items, so the newest agent_message is kept whole when it fits the limit alone.
    2. outputRetention.text reads complete when the final agent_message was retained; blocks may read truncated.
    3. Keep worker.output_truncated counts exact.
  falsifier: |
    Without the change criterion 1's 1.1 MiB fixture reads text truncated and the final message is missing.
  note: |
    Id reserved for run-unfiled-1795177718799 with rmd next-task-id on the host. Do not raise the limit: the
    healthy-condition doctrine applies, the population here is command output, not verdict text.
