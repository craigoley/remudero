    - claim: "the fix rung worktree lets a timer fire while git fetch is in flight"
      proof: 'grep: test("W1-T5284: the fix rung worktree lets a timer fire while git fetch is in flight" in test/daemon-worktrees-pushes-and-arms-never-block-the-loop.test.ts'
    - claim: "a run branch push lets a timer fire while git push is in flight and refuses what the sync push refuses"
      proof: 'grep: test("W1-T5284: a run branch push lets a timer fire while git push is in flight" in test/daemon-worktrees-pushes-and-arms-never-block-the-loop.test.ts'
    - claim: "arming auto-merge lets a timer fire while its gh calls are in flight and returns the same outcome"
      proof: 'grep: test("W1-T5284: arming auto merge lets a timer fire while gh is in flight" in test/daemon-worktrees-pushes-and-arms-never-block-the-loop.test.ts'
    - claim: "the new suite runs and passes"
      proof: "unit test: test/daemon-worktrees-pushes-and-arms-never-block-the-loop.test.ts"
  falsifier: |
    Route any of the four back to its sync form and its timer-probe test sees the timer fire only after the call
    settles.
