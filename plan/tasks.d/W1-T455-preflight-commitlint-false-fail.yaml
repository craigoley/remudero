- id: W1-T455
  title: "a TEST writes a FORGED preflight summary into whatever tree it runs in, and the orchestrator reads it as the worker's own verdict — 15 of 27 recorded preflight failures are fabricated, and the commitlint premise this shard opened with is REFUTED"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  risk: high
  origin: oper#preflight-commitlint-false-fail-2026-08-13
  principles: {tdd: strict}
  budget_usd: 40
  files:
