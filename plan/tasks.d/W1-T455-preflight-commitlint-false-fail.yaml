  rationale: "PREMISE REFUTED 2026-08-13, REWRITTEN NOT CLOSED — the original reasoning is PRESERVED
    VERBATIM below under ORIGINAL REASONING (RETRACTED), because it is the record of how this was
    misdiagnosed twice and §8A asks for compression, not erasure.
    WHAT IS REFUTED: `commitlintStep` does not fail healthy commits. Nothing was wrong with commitlint.
    WHAT ACTUALLY HAPPENS, re-derived at 43ca3f30 and quotable in three lines:
      `test/preflight.test.ts` defines a FAKE SPAWN — `commitlint: { status: 1, stderr:
      \"header-max-length\" }` — and calls `preflightCommand([], { spawn })` WITH NO `--summary-file`.
      `preflightCommand` (src/run-task.ts) writes to
      `flagValue(rest, \"--summary-file\") ?? preflightSummaryPath(repoRoot)`.
      `repoRoot` is a MODULE-LEVEL `const repoRoot = resolveRepoRoot(process.argv.slice(2),
      process.cwd())`.
    SO RUNNING THE SUITE WRITES A FAKE FAILING SUMMARY INTO WHATEVER TREE THE SUITE RUNS IN. THREE
    suites do it, each calling `preflightCommand([], { spawn })` with no summary path:
    `preflight.test.ts`, `preflight-ci-parity.test.ts`, `preflight-fast-mode.test.ts`.
    `preflightFailureNotice(worktreePath)` (src/lib/ci-parity.ts) then READS it and the orchestrator
    logs `preflight.failed`, believing it is the worker's own verdict.
    NOTE A SYMBOL CORRECTION: the brief that commissioned this rewrite named
    `workerPreflightFailureDetail`; NO SUCH SYMBOL EXISTS at 43ca3f30. The reader is
    `preflightFailureNotice`, and the argv logic is its line
      appends the argv suffix ONLY when `summary.args` is a non-empty array, so NO SUFFIX means
      `args: []`.
    THE MEASURED SPLIT HAS MOVED AND THE NEW NUMBERS ARE STRONGER, NOT WEAKER. Re-derived over all
    three ledger forms (666 gz / 3 plain / 1 live), deduped across forms: **27 `preflight.failed`
    rows — 15 FORGED, 12 GENUINE**, not the 14-of-15 the original brief carried. The discriminator is
    the argv suffix, and the separation is UNANIMOUS: all 15 forged rows read EXACTLY
    `1 of 3 step(s) failed: commitlint` — the fake's signature, character for character — and carry no
    suffix, so `args: []`. All 12 genuine rows carry `(rmd preflight ...)` AND a different shape,
    `2 of 23 step(s) failed: ci:tes…`. A bimodal split with no overlap.
    THE `durationMs` DISCRIMINATOR CORROBORATES IT: `tsc -p tsconfig.json --noEmit` cannot pass in one
    millisecond. Forged summaries measured 0–1 ms; genuine runs 9,656 ms to 3,488,663 ms.
    THE REUSABLE FINDING IS A THREE-PROPERTY CONJUNCTION, and it is why this is worth a task at all:
      WRITTEN FROM A `repoRoot`-DERIVED PATH BY A TEST · GITIGNORED · TRUSTED BY THE ORCHESTRATOR.
    Only the conjunction bites. MEASURED at 43ca3f30 over the four worktree-relative artifacts the
    orchestrator reads: `plan/tasks.yaml` and `plan/feedback/` are TRACKED and not ignored, so a test
    writing there DIRTIES THE TREE AND IS VISIBLE — git is the protection. `coverage/preflight-summary.json`
    is untracked AND ignored AND adjudicated, which is why it alone produced false verdicts.
    THE SECOND MEMBER, RECORDED SO THE CLASS IS NOT READ AS A SINGLETON: `plan/questions.ndjson`,
    written by `appendQuestion(repoRoot, …)` (src/lib/worker.ts), gitignored, and read by
    `readQuestionsNdjson(root)` (src/run-task.ts) — consumed by `buildOpenPrViews` and the feedback
    docket rung. IT WAS NEARLY DISMISSED AS LITTER because grepping the FILENAME across `src/` returns
    only comments; THE READER BUILDS THE PATH INTERNALLY. Its consumers AGGREGATE rather than
    ADJUDICATE, so the consequence is quieter — a polluted question list, not a false verdict. That is
    stated as the limit of the claim, not softened.
    AND THE COUNTER-EXAMPLE, WHICH PROVES THE REPO ALREADY KNOWS THIS CLASS: `taskIdHistoryCachePath`
    (src/run-task.ts) deliberately resolves against `git rev-parse --git-common-dir` rather than
    `repoRoot`, its own doc saying NOT repoRoot. The pattern was recognised and avoided once already.
    ORIGINAL REASONING (RETRACTED — the commitlint premise below is FALSE; preserved as the record of
    the misdiagnosis): RE-DERIVED at 4096adc. `commitlintStep` (src/lib/commit-message.ts) spawns
    `<repoRoot>/node_modules/.bin/commitlint --config <repoRoot>/commitlint.config.mjs --from
    <range.from> --to <range.to>` and reports
    `commitlint: FAIL — ${range.from}..${range.to}\\n${(res.stdout + res.stderr).trim()}` — so the
    `origin/main..HEAD` in a recorded failure is the LITERAL argument pair, and everything after
    the newline is commitlint's own output.
    THE RECORDED FAILURE CANNOT BE A LINT FAILURE. From the W1-T451 run's
    `coverage/preflight-summary.json`: `{\"name\":\"commitlint\",\"ok\":false,\"detail\":\"commitlint:
    FAIL — origin/main..HEAD\\nheader-max-length\"}` with typecheck and emitter-checks both PASS.
    Measured three ways: that range was ONE commit whose subject
    `fix(service): expire and evict confirm nonces (W1-T451)` is 55 CHARACTERS;
    `commitlint.config.mjs` is stock `@commitlint/config-conventional`, limit 100; and the
    identical invocation reproduced EXIT 0.
    IT IS SYSTEMATIC, NOT A ONE-OFF. Fifteen `preflight.failed` rows exist on the Azure ledger and
    FOURTEEN name `1 of 3 step(s) failed: commitlint` — the sole exception is a `--ci-parity` run
    failing three test/coverage steps. Across every failing head sha the LONGEST subject is 86
    characters (7862096) against a limit of 100, so `header-max-length` cannot legitimately have
    fired on any of them.
    THE CONSEQUENCE IS A SILENT REROUTE, NOT A COSMETIC WARNING. A failed worker preflight sends
    the run down the orchestrator fallback (`say(\"fallback: pushing branch from orchestrator
    (outside sandbox)\")`, src/run-task.ts) — which is how PR #1722 came to exist pushed from
    outside the sandbox. A spurious gate failure rerouted a healthy run."
  design: |
    (i) FIND THE REAL CAUSE BEFORE CHANGING THE CHECK. Two false-failure modes are already
    demonstrated and they are NOT the same bug:
      (a) EMPTY RANGE. MEASURED: `commitlint --from X --to X` prints its USAGE BANNER and exits 9.
      The step reports that as a FAIL. And the ledger contains exactly this shape — the W1-T404 row
      records `preflight FAILED at 3a5c677`, which WAS origin/main at that moment, so the worker had
      committed nothing and `origin/main..HEAD` was empty. A worker that runs preflight before its
      first commit fails a gate for having written nothing yet.
      (b) THE `header-max-length` OUTPUT IS UNEXPLAINED. MEASURED: a genuine over-length header
      makes commitlint print a multi-line block (`⧗ --- input ---`, `✖ header must not be longer
      than 100 characters, current length is N [header-max-length]`, `✖ found 1 problems`). A bare
      rule id on its own line is NOT commitlint's output shape in any observed mode. Establish what
      produces it before assuming a range problem.
    (ii) THE RANGE HYPOTHESIS IS NOT SUPPORTED TODAY AND MUST BE RE-TESTED, NOT ASSUMED. A worker
    worktree inherits its parent clone's refs, so a stale `origin/main` there could widen the range
    and sweep in an older long-subject commit. MEASURED at filing: the fleet clone
    (`/home/node/Remudero/repos/remudero`, the clone worker worktrees are cut from) resolves
    `origin/main` to 4096adc — CURRENT, zero behind. So the widening hypothesis is refuted at this
    sha. It may still have held at the moment of an individual failure; that is what needs
    instrumenting rather than reasoning about.
    (iii) CAPTURE THE EVIDENCE BEFORE IT IS REAPED. This investigation lost its primary artifact:
    `coverage/preflight-summary.json` lives in the worker's worktree, and the reaper removed both
    the W1-T451 and W1-T452 worktrees during this session — one of them BETWEEN a directory listing
    and the next command. Whatever ships must make the failing invocation reconstructable from a
    durable surface (the ledger row already carries the step name; it does not carry the resolved
    refs, the commit count, or commitlint's own output).
    (iv) EMPTY IS NOT A FAILURE. Whatever the cause of (b), a range with no commits is a healthy
    state — a worker that has not yet committed has nothing to lint — and must not fail the step or
    reroute the run. Both directions belong in the acceptance: an empty range passes, and a
    genuinely over-length subject still fails.
  note: "KEEP THIS SEPARATE FROM THE MISSING TRAILER — TWO DEFECTS THAT MET ON ONE RUN. Commitlint
    PASSES #1722's message WITHOUT a `Remudero-Task:` trailer (measured, exit 0), so commitlint does
    not enforce the trailer and this step's failure does not explain its absence. The body-only
    task-id resolver is filed separately as W1-T453 (#1725). Do not merge the two.
    THE CI-PARITY FRAMING NEEDS CORRECTING, AND THE BRIEF THAT PROMPTED THIS TASK HAD IT SLIGHTLY
    WRONG. It is tempting to say 'a gate that disagrees with the gate it exists to predict' —
    CI was green on d4f996b (ci-gate: success, every required check passing) while the local step
    failed. But `ci-parity.ts` ALREADY declares the commitlint job `mirrored: false`, with the
    stated reason that CI's job lints the SQUASH-MERGE PR TITLE, which does not exist until the PR
    is opened, and that preflight's step is 'the closest local proxy available pre-push'. So there
    is no parity claim to violate. THE SHARPER AND TRUE STATEMENT is narrower: a local proxy gate
    fails on healthy input, and its failure silently changes how the run pushes.
    RISK:HIGH IS RULE 19's SPAN, NOT BLAST RADIUS — two subsystems (the preflight step in
    commit-message.ts and the fallback/logging path in run-task.ts) plus the suites that observe
    them. The change itself is expected to be one predicate plus a captured detail string.
    FILES WRITTEN FROM THE GATES, separated BY INVOCATION COUNT: `commitlintStep(` is invoked by
    test/preflight.test.ts (3, which also invokes runPreflight 5 times),
    test/preflight-spawn-failure.test.ts (3), test/preflight-killed-child.test.ts (1) and
    test/commit-message.test.ts (1) — all four declared. A dozen further suites mention 'preflight'
    in prose with ZERO invocations of these symbols (test/binary-pin-rung.test.ts,
    test/isolation.test.ts, test/host-update-reclaim.test.ts and the rest) and are deliberately
    excluded. test/ci-parity-contract.test.ts is also excluded: it asserts the ci.yml job table,
    which this task does not change — and if an implementer finds they must touch the
    `mirrored: false` entry, that is a signal the scope grew and the files: list must grow with it."
  acceptance:
    - claim: "running the preflight suite leaves no summary file behind in the tree it ran in"
      proof: "unit test: test/preflight-summary-containment.test.ts"
    - claim: "a preflight invoked with an injected spawn refuses to write to the default summary path"
      proof: "unit test: test/preflight-summary-containment.test.ts"
    - claim: "a real preflight with no injected spawn still writes its summary where the orchestrator reads it"
      proof: "unit test: test/preflight-summary-containment.test.ts"

  design_addendum: "TWO CANDIDATE FIXES, AND THE SHARD DOES NOT PICK FOR THE IMPLEMENTER.
    (a) FIX THE TESTS. Pass an explicit `--summary-file` into a tmpdir from all three suites. Narrow,
    touches only `test/`, and fixes THE INSTANCE. Its weakness is that it fixes only the three suites
    that exist today: the fourth suite someone writes next month re-opens it, because nothing refuses.
    (b) FIX THE COMMAND. Make `preflightCommand` REFUSE to write to the DEFAULT path when a spawn is
    INJECTED — an injected spawn means a test, and a test has no business writing the orchestrator's
    adjudicated artifact. Touches production code (`src/run-task.ts`) and fixes THE SHAPE: it cannot
    be re-opened by a new suite. RECOMMENDED, because this defect survived three suites and the
    class has a second member.
    ORDERING FACT THAT BOUNDS THE DAMAGE, and it explains the split exactly: `--ci-parity` shells
    `npm run test:ci`, so the suite writes the fake AND THEN `preflightCommand` OVERWRITES it with the
    real verdict. That is precisely why every genuine row is a `--ci-parity` row. THE DAMAGE IS THE
    INVERSE CASE: a worker that runs the suite by ANY route not followed by a preflight write leaves
    the fake as final state, and is charged with a failure it never earned and never saw.
    DOES A REAL DEFECT SURVIVE? The original downstream claim — that a failed preflight reroutes the
    push to the orchestrator fallback — STILL HAPPENED, 15 times, but from a FORGED cause. The
    fallback itself is sound: it pushes from `worktreePath`, so branch content, commit, author and
    scope-guard flagging all survive. The ONLY divergence is that `--fill` composes the PR body from
    the commit message, hence no `Remudero-Task:` trailer — WHICH IS ALREADY ADDRESSED BY W1-T453
    (#1725), whose head-ref fallback resolves exactly those PRs. NOTHING FURTHER NEEDS FILING, and
    this clause exists so nobody re-files it."