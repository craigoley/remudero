    - claim: "the sweep's arm carries the head-bound decision it already made"
      proof: "unit test: W1-T1028: the sweep arm carries its own head bound decision"
    - claim: "a capped verdict with no ledgered override still refuses on the widened path"
      proof: "unit test: W1-T1028: a capped verdict still refuses on the widened path"
    - claim: "an irreversible diff still refuses on the widened path"
      proof: "unit test: W1-T1028: an irreversible diff still refuses on the widened path"
    - claim: "the two gates disagree on absent evidence rather than no rule matching"
      proof: "grep: the sweep decides to arm and the handoff refuses for evidence it never needed in plan/tasks.d/W1-T1028-handfiled-pr-never-reaches-the-arm.yaml"
