    depends_on: [W1-T1020] IS THE FIRST CLAUSE AND IT IS LOAD-BEARING. `isDispatchEligible`
    (`src/lib/drain.ts`) will not dispatch this task until W1-T1020 is credited, which is the
    ordering the rationale argues rather than a courtesy. AND IF BOTH DECLARE `src/lib/sweep.ts` THEY
    SERIALISE UNDER `partitionByFileOverlap` — THAT IS CORRECT HERE, NOT UNFORTUNATE: they change the
    same arming decision from two sides and running them concurrently would let each land against a
    tree the other had already moved.

    src/run-task.ts IS NOT DECLARED, AND THAT IS A MEASURED CHOICE. It carries 235 of 375 records,
    and DECISIONS.md's 2026-08-18 ruling accepts one effective lane as the standing cost of declaring
    it — so avoiding it when the marker is reachable elsewhere is worth doing rather than a
    preference. Both halves of the disagreement are in `src/lib/`: `decideSweepArm` in sweep.ts (70
    shards) and `decideArmFromLedgerVerdict` in review.ts (98 shards). If an implementer finds the
    handoff cannot be carried without touching `armAutoMerge`'s own signature in run-task.ts, that
    widening must be ratified before it is made, not disclosed afterwards.

    NO NEW FLAG, AND NO SECOND CONFIG SURFACE. `sweep.armSessionPrs` already exists at `value: true`
    with schema-bounded siblings in the same `sweep:` block (`staleDays` 1-90, `strikeCap` 1-10,
    `wipLimit` 1-50) and is already read through `booleanField`. The operator's ruling — arm
    everything green and reviewed here, with a switch another operator can flip — is RECORDED against
    that row. A boolean with no `min`/`max` is the established shape for this table; `armSessionPrs`
    and `supersessionDisposal` are both written that way.

    THE CONSOLE HALF IS A SIBLING AND IS NOT ABSORBED. A `policy.yaml` row is operator-togglable
    today with an editor. The console button needs a chain this task does not own: the console is
    currently STOPPED, its write routes need W1-T996's Access-JWT grant, and `/v1/inbox/approve` is
    `tier: "high"` while the provider grants `middle`. NAMED, NOT SCOPED IN.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. The criteria name an arming
    handoff, a head-bound decision, a capped refusal and an irreversibility refusal across two lib
    modules; `sizingViolation` (`src/lib/task-linter.ts`) derives subsystems from `files:` plus the
    acceptance text and would refuse medium on that span.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form; each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from test/sweep.test.ts that matched one. Each is plain
    prose under 100 characters with no comma, no `; ` and no regex metacharacter, because a bare title
    is compiled through `escapeRegExp` and matched literally. The fifth is doc-shaped and takes a
    `grep:` with an explicit path.

