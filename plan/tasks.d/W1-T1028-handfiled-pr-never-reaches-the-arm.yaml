- id: W1-T1028
  title: "THE OPERATOR HAS RULED THAT A GREEN REVIEWED HAND-FILED PR SHOULD NOT NEED HIS MERGE — and the arming rule and its flag BOTH already exist and are both on, so the surviving gap is one disagreement: the sweep's own gate fails OPEN on absent ledger evidence and the handoff it calls fails CLOSED on the same absence, which is exactly the population a hand-filed PR falls in"
  repo: remudero
  depends_on: [W1-T1020]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    W1-T1020 MUST BUILD FIRST, AND IT IS NOT BUILT YET — CHECKED BY SYMBOL, NOT BY `status:`.
    `decideAutoMergeArm` (`src/lib/review.ts`) still takes
    `Pick<ReviewVerdict, "state" | "capped" | "planOnly">` and its body never mentions
    `partiallyExecuted`; that field exists in review.ts but only feeds the "PARTIAL: X/Y" summary
    annotation. So the `!verdict.capped` branch still returns `arm: true, reason: "verdict is a full
    PASS"` for a review that executed 1 of 6 proofs, because CAPPED means ZERO executed. THIS TASK
    WIDENS WHICH PRs REACH THAT DECISION; W1-T1020 MAKES THE DECISION CORRECT. Widening first would
    route more PRs into a decision known to be wrong. W1-T1020's shard is filed (#2198, plan-only)
    and unbuilt.

    (1) THE BRIEFED PREMISE DOES NOT SURVIVE, AND THE CORRECTION IS THE FINDING. The claim was that
    every arming path is run-scoped and no rule matches a hand-filed PR. `DISPOSITION_RULES`
    (`src/lib/sweep.ts`) already carries a `mergeable` row whose predicate is exactly
    `pr.checksState === "green" && pr.reviewState === "success"` — no run scope, no task, no plan.
    `sweep.ts` imports `loadPlan`/`Plan` ZERO times against a control of 9 import lines, so the
    sweep really can arm anything it enumerates, and it does act: the `mergeable` branch calls
    `decideSweepArm` and then `deps.arm(pr)`.

    (2) THE FLAG ALSO ALREADY EXISTS AND IS ALREADY ON. `sweep.armSessionPrs` sits in
    `plan/policy.yaml` at `value: true` with `origin: "net-new"`, is read by `booleanField` in
    `src/lib/policy.ts`, and is consumed by `sweepArmTaskId` (`src/run-task.ts`), which substitutes
    the review lane's `PR-<n>` surrogate id when a PR has none — landed by W1-T516 as #1890 on
    2026-08-15. So the operator's "a setting, default off for another operator" is not a new surface
    to invent; it is a row that exists, and this task must RECORD the ruling against it rather than
    add a second flag.

    (3) SO WHAT ACTUALLY REFUSES, TRACED END TO END. `decideSweepArm` recovers facts through
    `postedArmFactsFromLedger(lines, pr.taskId, pr.headSha)`, which returns `undefined` the moment
    either key is missing, and its documented contract is FAIL-OPEN: *"a head with no recoverable
    ledgered verdict arms exactly as it did before this function existed."* The sweep therefore says
    ARM. The very next call, `armAutoMerge` → `priorReviewVerdictFromLedger(lines, taskId)` →
    `decideArmFromLedgerVerdict`, opens with the opposite rule: *"no ledgered review.posted verdict
    found for this task — arming withheld (W1-T230, fail closed)."* the sweep decides to arm and the handoff refuses for evidence it never needed.
    Two gates, one question, opposite defaults — and the hand-filed population is precisely where the
    evidence is absent, because its verdict is keyed to a surrogate id minted at review time rather
    than to a task the plan knows.

    (4) THE POPULATION, MEASURED ON THE MINI'S LEDGER AND LABELLED AS SUCH. This host's state dir
    (666 gz, 6 plain, 1 live; per-form `sweep.disposed` counts 2,547,918 / 10,141 / 1,157, every form
    non-zero; deduped on the FULL LINE). `no-task-id` resolves to 432 distinct rows — 216
    `sweep.disposed` rows carrying `disposition: "mergeable"` paired with 216 `sweep.dispose.not_open`
    — over SEVEN distinct PRs between 2026-07-31 and 2026-08-12, one PR refused 88 times. THOSE ARE
    HISTORICAL: they predate W1-T516 and are what it fixed. What is NOT historical in shape is
    `ledger-refused`: 11 distinct rows, and SEVEN OF THE ELEVEN carry a `PR-<n>` surrogate task id
    (PR-977, PR-981, PR-982, PR-984, PR-985, PR-989 …). That is the disagreement in (3), on the
    record. CONTROL on the same corpus: `deferred to full sweep` reads 7,508 distinct rows, so the
    query and the corpus are sound. THE MINI'S FLEET LANES STOP AT 2026-08-12 AND AZURE'S IS THE
    FLEET'S — every count here is this host's and #2198's own refusal is not in it.

    (5) WHERE THE FIX BELONGS: A WIDENED HANDOFF, NOT A NEW DISPOSITION ROW. The `mergeable` row
    already matches and is already ordered ABOVE the `blocked-ambiguous` catch-all, so no row is
    added and no ordering changes — `DISPOSITION_RULES` is first-match-wins and a new row would be
    redundant at best. The change is that the sweep's arm must CARRY the head-bound decision
    `decideSweepArm` already made, instead of handing over a task id and inviting a second,
    task-keyed recovery that cannot succeed for this population. Both functions live under `src/lib/`,
    which is why `src/run-task.ts` is not declared.

    (6) THE RULING WIDENS THE POPULATION, NOT THE PERMISSIVENESS, AND THIS IS THE CLAUSE AN
    IMPLEMENTER MAY NOT SOFTEN. Everything `decideAutoMergeArm` refuses today must still refuse on the
    widened path: an `irreversible` diff (checked FIRST, and no override buys it back), a verdict whose
    `state !== "success"`, a CAPPED verdict with no ledgered `automerge.capped_override_granted`, and
    `decideArmFromLedgerVerdict`'s head-mismatch refusal — a verdict posted for an older head must
    never arm the new one. A draft PR and a PR whose required checks are not green never reach the
    `mergeable` row at all. Nothing in this task relaxes any of them.

    (7) NOT ARMING AT PR-OPEN, DELIBERATELY. `armAutoMergeAtOpen` (W1-T125) fires inside `runTask` with
    no verdict gate and no CI gate, and W1-T975 (`status: queued`) files the arm-timing question.
    BOTH ARE CITED AND NEITHER IS ABSORBED: this task arms only where a review verdict already exists,
    which is the opposite end of the timing question from W1-T125's early arm.
  acceptance:
