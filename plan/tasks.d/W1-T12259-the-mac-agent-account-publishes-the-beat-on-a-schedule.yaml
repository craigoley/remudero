  rationale: |
    OBSERVED 2026-11-11: the Mac agent account publishes no heartbeat, so no part of the fleet measures its free disk on a schedule.
    - The last heartbeat of this account is the commit of the branch `heartbeat`, dated 2026-08-14T12:45-04:00. Its payload names `/Users/craigoleyagent/Remudero/remudero`.
    - The Azure host publishes `heartbeat-azure` every five minutes. Its newest commit was 2026-11-11T03:40Z.
    - The janitor of the account wrote `EMERGENCY: 8GiB free < 20GiB floor` at 2026-11-09T22:00 and `19GiB free` at 2026-11-10T20:00. The lines went to `~/Library/Logs/remudero/janitor.log`. Nothing reads that file.
    - The author preflight refused twice on 2026-11-11 for free disk below 20 GiB. The hand lane tried again every five minutes and told nobody.
    READ at origin/main 3c6e5e476.
    - The host-resource gardener reads the refs `refs/remotes/origin/heartbeat-<host>` (`hostResourceInputStamp`, src/lib/host-resource-gardener.ts:71). A host with no such branch does not exist for it.
    - The header of scripts/fleet-heartbeat.sh describes the schedule: a launchd job with `StartInterval` 300 that starts the script of the checkout. No file in the repo installs that job.
    - `.github/workflows/fleet-heartbeat-watch.yml` reads a declared list of branches (`HEARTBEAT_BRANCHES`, line 306). A new branch raises no silence alarm until someone adds it to that list.
    - The accounts of this Mac already have launchd jobs. W1-T12176 (queued) makes doctor read their state.
    CHECKED for overlap: W1-T2877 (merged) installed the units of the Azure host. W1-T10756 (queued) is about which checkout the cron lines of the Azure host run. Neither installs a job on a Mac.
  design: |
    New script deploy/mac/install-heartbeat.sh, in the shape of deploy/mac/install-tmp-reclaim.sh.
    - Options: `--checkout <path>` (default `~/Remudero/remudero`), `--host <name>`, `--check`, `--dry-run`, and `--agents-dir <path>` for the test.
    - It writes `~/Library/LaunchAgents/com.remudero.heartbeat.plist` with `StartInterval` 300, the program path, and the four variables of criterion 2. It writes through a temporary file and a rename.
    - It loads the job with `launchctl bootstrap gui/<uid>` only when it wrote a new or changed file. The test replaces `launchctl` with a recorder.
    - It reads the heartbeat branches of the remote with `git ls-remote` for criterion 3.
    The heartbeat pushes with the git credential of the account, as the header of the script describes. The installer handles no credential.
    The heartbeat reports the commit of its checkout (`install_head_sha`), so a reader can see a checkout that is out of date.
    deploy/mac/JANITOR.md gets one short section: what the job does, the command to install it, and the command to check it.
    If criterion 6 shows that the script fails on a Mac with no daemon state, fix the probe that fails in the script and add scripts/fleet-heartbeat.sh to `files` by a scope amendment.
    NOT IN SCOPE: the watch workflow, the Azure host, a janitor change, and the removal of the branch `heartbeat`.
  falsifier: |
    Write a token variable into the property list and criterion 2 must fail. Accept the host name `azure` and criterion 3 must fail. Write a file under `--check` and criterion 4 must fail. Unload another job and criterion 5 must fail. Restore and require all seven to pass.
  note: |
    Host and account: the Mac, for each account whose owner runs the installer. The first one is the agent account `craigoleyagent`.
    The job removes nothing. It reads sizes and pushes one commit to its own branch.
    After the merge the owner of the account runs the installer once. A merge alone starts no job.
    This task has the most open questions of the filing: the script has not run on this account since August, and the push needs the git credential of the account under launchd.
    Until this job runs, W1-T12254 cannot see the Mac.
