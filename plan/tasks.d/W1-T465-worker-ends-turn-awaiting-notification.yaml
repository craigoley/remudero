    MEASUREMENT AMENDMENT, 2026-08-21 — THE FINDING STANDS, IT HAS A PRICE, AND THE TRANSCRIPT NARROWS THE
    REMEDY. Nothing else in this shard changes: not the title, not `files:`, not the acceptance block, not
