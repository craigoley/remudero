- id: W1-T3618
  title: "THE REVIEWER PAYS IN FULL AND THEN DISCARDS THE VERDICT — reviewerCodeFreshness is read at POST time, after the worktree is materialized, the proofs are executed and the reviewer is spawned, so a stale daemon spends the whole review and publishes nothing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 25.00
  files: [src/lib/daemon.ts, src/run-task.ts, test/review-freshness-stops-before-it-spends.test.ts]
  origin: oper#queue-throughput-2026-09-15
  plan_refs: ["W1-T228", "W1-T2965", "W1-T126", "W1-T2964"]
  note: "reservation hand-off: main -> chore/file-review-freshness-waste-1789496306"
  # W1-T3091: absent priority sorts LAST (drain.ts compareDispatch: `priority ?? +Infinity`),
  # so an incident-causing task queues behind every other. the reviewer discards a verdict it paid in full for: 8 terminal verdicts computed and thrown away in one 4-hour window, 6 of them success
  priority: 1
  status: queued
  attempts: 0
  rationale: |
    NOT A DEFECT IN THE GUARD. W1-T228's publication guard is correct and must not be weakened:
    a verdict computed by code that cannot account for itself should not be published. The defect
    is WHERE it is read, and what the daemon does after it fires.

    MEASURED 2026-09-15 on the Azure fleet host, from `docker logs -t remudero-daemon` over the
    four hours 14:04Z-18:07Z. EIGHT terminal verdicts were computed and discarded; ONE was posted:

      14:24:20  success WITHHELD  PR #5644  (head eabfdd2)
      14:37:52  success WITHHELD  PR #5645  (head 41a6935)
      14:58:45  failure WITHHELD  PR #5631  (head 8b0aba7)
      17:06:51  failure WITHHELD  PR #5646  (head 2481005)
      17:45:24  success WITHHELD  PR #5590  (head ded3119)
      17:48:47  success WITHHELD  PR #5651  (head 6c56516)
      17:52:33  success WITHHELD  PR #5647  (head 09d55cc)
      18:04:35  success WITHHELD  PR #5671  (head b881206)

    SIX of the eight were `success`. Each was a PR that had earned its green and did not get it,
    so it sat unmergeable and was re-reviewed — at full price — on a later pass.

    WHERE THE MONEY GOES BEFORE THE CHECK. `reviewerCodeFreshness` is passed to `judgeReview` as a
    THUNK (`run-task.ts`, the `reviewerCodeFreshness: () => checkReviewerCodeFreshness(repoRoot,
    process.env)` wiring) and is not called until `postReviewStatusGuarded` is inside the per-task
    lock. By then the call has already: materialized `headCheckoutDir` as a real worktree, executed
    every whitelisted proof against it, and — when `spawnReviewer` is true, which it is on the
    daemon's sweep — spawned a reviewer worker against `taskBudgetUsd`. The freshness read is the
    LAST thing that happens and the FIRST thing that could have been known.

    WHY THE DAEMON CANNOT NOTICE IN TIME. `deps.checkFreshness()` is polled at the TOP of a tick in
    `daemon.ts`, above the sweep. A cycle that is fresh when it starts and goes stale mid-flight
    cannot learn this until the cycle ends. All four of the 17:45-18:04 withholds are inside ONE
    cycle that began at 17:19:22 on a checkout that WAS origin/main at that moment. The entrypoint
    then re-syncs in 5s (`FRESHNESS_RESTART_PAUSE_S`) — the restart is cheap; the waiting is not.

    THE DUTY CYCLE. Fresh (publishable) windows across the four hours: 14:04-14:24, 16:31-17:06,
    17:19-17:45. Stale windows: 14:24-15:04 (40m), 17:06-17:19 (12m), 17:45-18:07+ (22m+). At least
    ~74 of ~240 minutes were spent computing verdicts that could not be published.

    WHAT IS NOT THE FIX, MEASURED SO NOBODY RE-PROPOSES IT. Narrowing `MATERIAL_ADVANCE_PATHS` for
    the publication question looks obvious and is nearly worthless. Over the last 80 commits on
    origin/main: 26 are material under the current predicate, and 21 of those touch the transitive
    import closure of `src/lib/review.ts` (86 files, computed from the import graph). Narrowing to
    that closure would avert 5 of 26 withholds — ~19%. The closure is simply too wide to help.

    TWO CHANGES, BOTH ABOVE THE SPEND.

    1. READ FRESHNESS BEFORE BUYING, NOT AFTER. The sweep reads reviewer-code freshness ONCE per
       cycle, before the first PR's worktree is materialized. A stale reading means no terminal
       verdict is attempted for the remainder of that cycle: no worktree, no proof execution, no
       reviewer spawn. `pending` stays publishable (it is progress, not a verdict) and the reason
       is ledgered per PR skipped, so the skip is never silent.

    2. A STALE READING ENDS THE CYCLE, IT DOES NOT MERELY SUPPRESS IT. The sweep signals the daemon
       loop to stop for freshness at the next tick boundary, so the entrypoint's 5s re-sync runs and
       the daemon returns on code that CAN publish.

    W1-T2965 IS PRESERVED AND MUST BE PROVEN PRESERVED. Forward progress still outranks freshness
    for the first cycle: this signal is consumed by the SAME `cyclesEntered > 0` gate that governs
    the existing exit, never around it. Dispatch is NOT suppressed — only terminal-verdict review
    is. A cycle that has dispatched work has made progress, which is the property W1-T2965 exists
    to defend, and a test must assert dispatch still happens on a stale cycle.

    THE FALSIFIER, AND IT MUST BE SHOWN RED. Drive a sweep over THREE PRs with an injected stale
    reviewer-code reading and a counting fake for worktree materialization:
      - with the fix: exactly ONE freshness read, ZERO materializations, ZERO proof executions,
        and the daemon's next tick returns the stale stop reason
      - delete the fix: THREE materializations and THREE discarded verdicts
    Record `# fail N` with the guard deleted and `# fail 0` with it restored. A test that passes
    both ways is not evidence.

    DO NOT WEAKEN W1-T228. The publication guard keeps its current behaviour and its current
    predicate. Nothing here makes a stale reviewer publish a terminal verdict; this task only stops
    it from PAYING for one it will throw away.

    SIZING (Rule 19, band_meaning: span). This spans daemon.ts and run-task.ts because the fix is
    ONE cross-file invariant — freshness read once, before the sweep, gating both dispatch-vs-review
    and the daemon's stop signal — that the falsifier above asserts as a single behaviour across
    both files together; it is not satisfiable piecewise, so it is raised to risk:high (the #588
    merits test) rather than decomposed.

  acceptance:
    - claim: "a stale reviewer reads freshness once per cycle and materializes no worktree, so nothing is executed or spawned for a verdict that cannot be published"
      proof: "unit test: a stale reviewer reads freshness once and materializes nothing"
    - claim: "a stale review cycle still dispatches work, so W1-T2965's forward-progress rule is preserved rather than traded away"
      proof: "unit test: a stale review cycle still dispatches work"
    - claim: "a stale reading ends the cycle through the existing cyclesEntered gate, so the entrypoint re-syncs instead of the daemon idling on code that cannot publish"
      proof: "unit test: a stale reviewer signals the daemon to stop for freshness"
    - claim: "the new early gate never over-fires: a fresh reading still reaches the ordinary review path for every PR, so W1-T228's late publication guard stays the fail-closed floor rather than being displaced by it"
      proof: "unit test: the gate never over-fires"
    - claim: "an unreadable freshness reading fails toward attempting the review, so the new early gate cannot become a silent refusal path of its own"
      proof: "unit test: an unreadable freshness reading fails toward attempting the review"
