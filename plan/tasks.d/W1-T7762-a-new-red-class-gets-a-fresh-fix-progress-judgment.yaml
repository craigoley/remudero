  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — which red a fix-progress verdict applies to; it decides the label and the round a judged PR takes
  band_meaning: span
  origin: "operator session 2026-10-10: main-red investigation, operator asked for flow improvements"
  plan_refs: [W1-T7096, W1-T5966]
  files: [src/lib/fix-progress-judge.ts, src/lib/sweep.ts, test/a-new-red-class-gets-a-fresh-fix-progress-judgment.test.ts]
