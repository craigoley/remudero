- id: W1-T7762
  title: "A NEW CLASS OF RED GETS A FRESH FIX-PROGRESS JUDGMENT, NOT THE LAST ONE'S LABEL — on 2026-10-10 PR #10671 kept the label `fix round 4 — judge: change-approach`, ruled at 16:55Z on census-precheck-refused comment-load-ratchet reds, on unrelated coverage-shard and diff-coverage reds at 17:26, 17:47 and 18:12Z"
  repo: remudero
