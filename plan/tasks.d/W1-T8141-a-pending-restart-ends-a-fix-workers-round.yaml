- id: W1-T8141
  title: "A PENDING RESTART OR RECYCLE ENDS A FIX-RUNG WORKER'S ROUND AND KEEPS ITS WORK — a fix worker has no yield at all, so a recycle drain or a freshness restart waits for it to finish (or kills it with the container), and its partial fix survives only as a dead owner's residue"
  repo: remudero
  depends_on: [W1-T8139]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — a fix worker yields to a pending restart with its partial work kept for the next round
  band_meaning: span
  origin: "operator approval 2026-10-11: follow-ups from the recycle-stall fix (hand PR #10925)"
  plan_refs: [W1-T6362, W1-T5974, W1-T5918, W1-T7697, W1-T7807, W1-T5127, W1-T1046, W1-T9337, W1-T9089, W1-T6434]
  files: [src/run-task.ts, src/cli/commands/fix.ts, src/cli/commands/run-task-verb.ts, test/a-pending-restart-ends-a-fix-workers-round.test.ts]
  status: queued
  priority: 2  # raised 2026-11-11 on the 7-day restart study (36 exits to 2026-11-11): the drain gave up on 20 fix dispatches at a median age of 51 min; was 3
  attempts: 0
  rationale: |
    READ on origin/main 5d117761b:
      - runFixRung (src/run-task.ts:11237) spawns fix workers for the sweep's fix lane. None of its spawns pass
        through watchDispatchSpawn (:3359), whose only caller is the dispatch path (:17548), so neither the W1-T7807
        quiet watchdog nor #10925's recycle round end (merged 2026-10-11) ever sees a fix worker. Its `endRound` also returns
        "not an implement worker" for any other worker class.
      - The only recycle yield in the sweep is a RESUMED CI wait (src/lib/sweep.ts:3880, W1-T5127). A fix worker
        mid-round has none.
      - deploy/recycle-container.sh counts a fix-rung worker (`*sweep-fix-settings-*`, :1790) as lane-less busy until
        it is 7200 s old, and its `fix-branch--*` lock as lane-holding. So a recycle waits for it, then refuses.
      - When a fix worker is killed anyway (a restart, a recycle past its wait), W1-T6362 preserves the dead owner's
        staged diff with preserveTrackedDirtyPatch (:44972) and offers it to the next round. That is recovery after
        a kill, not a yield. Unstaged edits and the round's reasoning are lost, and the round is charged.
    The sibling task filed with this one ends an IMPLEMENT worker's round for a latched daemon restart. This task is
    the fix-rung half.
    DEPENDENCY: the sibling task (W1-T8139) adds the pending-yield predicate (recycle PAUSE or restart latch) this
    task reads. Both edit src/run-task.ts. Serialized after it.
    Scope amended 2026-11-13 (hand build, read on origin/main): the pointers above are stale.
      - W1-T9337 moved the body of runFixRung to src/cli/commands/fix.ts. src/cli/commands/sweep.ts calls that module
        directly (`runFixRungFromModule(opts, host.fixCommandHost())`), so the sweep's fix lane never passes the
        src/run-task.ts wrapper. The one spawn every fix round shares is `spawnFixWorkerBounded` in src/run-task.ts,
        reached through `host.spawnFixWorkerBounded`. Its context type is declared in src/cli/commands/run-task-verb.ts
        (`RunTaskCommandHost["spawnFixWorkerBounded"]`) and carries no PR url or branch.
      - W1-T9089 retired the restart latch that W1-T8139 read (`restartPending` is gone from
        src/lib/quiet-worker-watchdog.ts). The pending-yield predicate on main is the recycle PAUSE only:
        `recyclePauseDetail(config.root)` in src/lib/recycle-yield.ts, which the implement watchdog and the sweep's CI
        wait already read.
      - The next round's offer reads the newest `sweep.fix.owner_residue_preserved` row for the PR and head
        (`readPreservedOwnerPatch`, src/lib/sweep.ts, W1-T6434). That row needs the PR number.
    So the build needs src/cli/commands/fix.ts (pass the PR and branch to the strike's spawn, and end the round when the
    spawn reports a yield) and src/cli/commands/run-task-verb.ts (the context field and the yield outcome in the spawn's
    type). The trigger is the recycle PAUSE; a restart latch no longer exists to read.
  design: |
    Operator rulings: no hard thresholds; lean into automation.
    1. A fix worker's spawn is watched for the same pending-yield predicate (recycle PAUSE or the daemon's restart
       latch). Reuse runQuietWorkerWatchdog's seam, or a direct poll of the predicate, whichever adds less. Do not
       add a second predicate.
    2. On a pending yield, end the fix round deliberately. Stop the worker, preserve ALL its work (staged and
       unstaged) through the existing preserveTrackedDirtyPatch path, and record where it went. NEVER push partial
       fix work to the PR head: that would start CI and a review on an unfinished fix.
    3. The round ends as a handoff, not a strike. Ledger `fix.round_yielded` with the PR, the trigger, the preserved
       patch location and the paths. The fix lane does not count it toward the strike cap, and the next fix round
       is offered the preserved patch as prior partial work, as W1-T6362 already does for a dead owner.
    4. The fix claim and its `fix-branch--*` lock are released through the normal round exit, so the recycle's
       drain sees the lane free.
    Amended 2026-11-13 to the code on main (see the rationale):
    5. The watch lives in `spawnFixWorkerBounded` (src/run-task.ts), as one more arm beside the wall-clock bound and
       the W1-T4105 supersession watch. It runs only for a strike's spawn: the call that passes the new context field
       `fixRound: { prUrl, branch }` (src/cli/commands/fix.ts) and a `config.root`. It polls `recyclePauseDetail` at
       the cadence the supersession watch already uses (`DEFAULT_POLL_INTERVAL_MS`). The predicate is the recycle PAUSE;
       the restart latch named in point 1 was retired by W1-T9089.
    6. On a pending recycle it aborts the spawn and waits for the worker to stop (the wall-clock bound still applies).
       It then preserves the whole worktree against the head the round started from: commits the worker made, staged
       and unstaged edits, and new files, into one `refs/rmd-recovery/fix-dirty/...` ref through
       preserveTrackedDirtyPatch, which proves the ref's tree equals the worktree's. Only then does it reset the
       worktree to that head. It writes `fix.round_yielded` and a `sweep.fix.owner_residue_preserved` row for the PR
       and its head, so `readPreservedOwnerPatch` offers the ref to the next round.
    7. The spawn returns a `yielded` outcome. runFixRung writes `fix.done` (subtype `round_yielded`, with the branch
       claim's run id), releases the claim and stands down. It writes no `fix.dispatch` row, so no strike is counted.
    8. When the work cannot be preserved, nothing is reset: the round stands down with `retainWorktree`, so the sweep
       keeps the worktree as the worker left it and the dead-owner recovery (W1-T6362) finds it.
    INVARIANT no-partial-push: a yielded fix round never pushes to the PR branch and never commits the worker's partial
    work onto it; the PR head after the yield is the head before it.
    INVARIANT operator-pause-holds: a PAUSE whose detail is not the recycle's own leaves a running fix worker alone; only
    `recyclePauseDetail` ends a round.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive runFixRung with injected seams and a
    real gitRepo() fixture, a pending recycle PAUSE, and a worker with one staged and one unstaged edit.
