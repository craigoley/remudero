  falsifier: |
    Leave fix spawns unwatched, as on main: under the pending recycle the first test sees the worker run to its end
    and no `fix.round_yielded` row. Push the checkpoint to the PR branch instead of preserving it: the second test
    sees a new head on the PR branch.
