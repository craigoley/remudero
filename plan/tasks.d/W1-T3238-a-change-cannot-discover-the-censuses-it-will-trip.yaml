      proof: "unit test: W1-T3238: an unmodelled suite that walks a corpus is named as a candidate with its glob"
    - claim: "a suite that walks nothing stays unmodelled and is never promoted to a candidate"
      proof: "unit test: W1-T3238: a suite that only imports symbols is not a candidate"
    - claim: "the MODELLED set is unchanged — a candidate is never merged into the names the verb vouches for"
      proof: "unit test: W1-T3238: candidates are a separate section and the named set is byte-identical"
