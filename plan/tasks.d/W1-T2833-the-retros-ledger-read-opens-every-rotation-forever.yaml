    - claim: "a corpus holding rotations both inside and outside the window opens exactly the in-window ones and skips the rest by their stamped filename, without decompressing what it skips"
      proof: "unit test: test/the-retros-ledger-read-opens-every-rotation-forever.test.ts"
    - claim: "the window exceeds the measured maximum report-to-harvest lag, and a follow-up whose harvest marker lands at the far end of that lag is still deduplicated rather than re-minted as a duplicate candidate"
      proof: "unit test: test/the-retros-ledger-read-opens-every-rotation-forever.test.ts"
    - claim: "retained bytes per rotation opened is reduced against the same fixture corpus, measured as a ratio between the returned payload and what stays reachable, so the amplification is proven to move independently of the window"
      proof: "unit test: test/the-retros-ledger-read-opens-every-rotation-forever.test.ts"
    - claim: "an omitted window still reads every rotation exactly as it does today, so every OTHER caller of resolveLedgerUnion is byte-identical and this change is scoped to the follow-up read"
      proof: "unit test: test/the-retros-ledger-read-opens-every-rotation-forever.test.ts"
  note: |
    FILED 2026-09-04 from an on-host investigation of the daemon's first CRASH of the day (exit 134,
    `FATAL ERROR: Reached heap limit`, ~305947 ms in, RETRO-1788542811854 running, 57 runs in
    scope). Every other restart that day was exit 75 (freshness), which by design does not spend
    docker's `on-failure:5` budget; a crash does. At the time of filing `RestartCount=0` on a
    container recreated at 18:07:57Z, so all five remain — but the budget is now reachable in a way
    it was not before.

    THE ~2050 MB BOUNDARY IS NODE'S DEFAULT, MEASURED: `heap_size_limit` reads 2096 MB on this host
    (Node v22.23.2) with NO `NODE_OPTIONS`, NO `--max-old-space-size`, and NO container memory
    limit. `OOMKilled=false` — V8 hit its own ceiling; the kernel was not involved.

    THE CRASH PATH LEAVES LOCKS BEHIND: the daemon held `state/drain.lock` (pid 1185324, startedAt
    16:54:23Z) when it died. It was reclaimed on the next boot, so no action is required, but a
    reader tracing a stale lock to this crash should find that written down rather than re-derive it.

    THE FALSIFIER IS DELIBERATELY A FILE-READ COUNT AND NOT A HEAP MEASUREMENT. Heap is the symptom,
    its mechanism is unproven (see `rationale`), and a heap assertion would rest on V8 internals this
    task has not established. Rotations opened is exactly what the window changes, is deterministic,
    and reproduces on any corpus. Heap may be recorded as a secondary observation; no criterion
    depends on it.
