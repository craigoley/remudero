  rationale: |
    MEASURED 2026-11-03 ~00:30Z over the 7-day conflict rows of the core ledger union (~/Remudero-notes/conflict-findings-2026-11-03.md,
    evidence in ~/Remudero-notes/conflict-evidence-1103/, read-only). Code read at origin/main c0a6f1c74.
    - #15679 (W1-T9796): 205 conflict-disposed rows from 2026-10-30T14:43Z to 2026-11-02T06:26Z. 126 stand-downs read "detached
      fix dispatch failed before fix.dispatch <n> times ... (fix dispatch refused: worker admission is held: PAUSE: cannot reach
      origin ...)", FIX_DISPATCH_FAILED_BACKSTOP 3 reached. That is about 38 h on a cause that had cleared.
    - #14176 (W1-T10559): 81 rows carried dispatch_held fix_claim_decline from 2026-10-26T04:10Z to 14:50Z. Six
      sweep.fix.checkout_claim_declined rows named owner_dirty_recovery_preserve_failed on
      worktrees/sweep-W1-T10559-1792983204646. FIX_CLAIM_DECLINE_BACKSTOP 3 held the head while that worktree existed.
    THE COUNT HAS BEEN PATCHED ONE CAUSE AT A TIME. Each patch was the symptom:
    - #14423 (2026-10-26) re-validates a failed owner preservation before lifting the decline hold.
    - #16032 (2026-11-01) stops counting a fleet PAUSE refusal toward the dispatch-failure backstop (FLEET_PAUSE_REFUSAL regex).
    The count stays. Any other transient cause (a fetch that timed out, a GitHub 5xx, a host restart mid-claim) still latches the
    head after three, and only a new head lifts it. A held PR makes no new head.
    READ: fixDispatchHoldAtHead and dispatchFailureHoldAtHead (src/lib/sweep.ts) count rows per (PR, head) against the two
    constants. The decline hold already stands down "while that worktree exists", a cause probe for one cause. The dispatch-failure
    hold has none. Both escalate once on the count, with no judge.
    Operator rulings: no fixed thresholds, so derive from measurement with tiered, self-healing responses; repair loops get an LLM
    progress judge.
    NOT COVERED ELSEWHERE: W1-T10709 (blocked) re-checks a stopped owner recovery once after an accepted answer. That is an answer
    path, not the hold's own retry. The sibling item 5b, W1-T11169 (stale fix seeds), is a different hold, the dedup on a dead daemon's seed.
  design: |
    1. CAUSE. Classify each failure and decline row's recorded reason into a cause with a probe where one exists: owner-held
       (worktree_path present, and its owner pid or claim live; the claim path's existing owner census), fleet-held (PAUSE held,
       origin unreadable; the existing workerAdmissionHoldReason and FLEET_PAUSE_REFUSAL reads), or unprobed (anything else,
       keyed by a normalized reason class, as reasonClass does for the fix-lane gardener).
    2. LIFT. A probed cause holds only while its probe reads it present, re-read each pass. An unprobed cause retries at
       last_failure + backoff. The base is the ledger's measured time from a failure of that cause class to the next
       fix.dispatch for the same PR, the median over the readable window; with no sample it is one sweep pass. It doubles per
       consecutive same-cause failure at the head and resets on a dispatch. No count stops a retry.
    3. JUDGE. After each failed retry, call resolveFixProgress with the head's cause history as remedyHistory, as the plan
       round's refused-twice arm does. Escalate once per (PR, head, cause) only on verdict escalate. On change-approach, carry
       the constraint into the next dispatch. On unavailable, keep the backoff.
    4. RECORD. The hold's sweep.disposed fields name cause, probe result, next_retry_at, backoff_ms and judge_verdict, so
       fleetWithheldStageMs and ownEscalationAtHead keep reading them.
    5. Remove FIX_DISPATCH_FAILED_BACKSTOP and FIX_CLAIM_DECLINE_BACKSTOP. The four existing tests that import them move to the
       cause-aware hold.
    Tests go in the new file, titled verbatim as in the proofs, over the real fixDispatchHoldAtHead with an injected owner probe,
    PAUSE read and judge, and ledger fixtures shaped like #15679's and #14176's rows.
  falsifier: |
    At origin/main, three unprobed failures at one head hold the fourth pass even after the cause has cleared, because
    dispatchFailureHoldAtHead returns a hold on failures.length >= 3. The first test's "dispatches again at the same head" fails,
    and the constants still exist. If the doubling is dropped, a fixed-interval retry fails the second test's backoff assertion.
    If the hold escalates on a count with the judge unavailable, the third test fails.
