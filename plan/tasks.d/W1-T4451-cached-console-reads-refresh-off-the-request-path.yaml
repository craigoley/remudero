  rationale: |
    READ at main 6a04d2f18: boundConsoleReadRoute (src/lib/serve.ts) wraps CONSOLE_CACHED_READ_PATHS
    (/v1/status, /v1/recent, /v1/inbox, /v1/daemon-health, /v1/repos) with a single-flight refresh and a
    CONSOLE_READ_ROUTE_BUDGET_MS = 750 race, but its handler calls `refresh(req)` on EVERY request. There is no
    minimum age and no timer, so the cache is a fallback for a slow refresh, not stale-while-revalidate. The
    W1-T3925 comment in the same function admits that a synchronous route.handler (buildStatusRoute,
    buildRecentRoute are synchronous) "runs to completion ... entirely inside this call to refresh(req)", so while
    it runs the budget timer and every other request on serve's one thread wait. The console polls /v1/status and
    /v1/recent every 5 s per open tab (console design finding 1), so compute rate tracks tab count and a slow
    refresh freezes every route. W1-T4261 (merged) made the inbox classification incremental; it did not change
    this wrapper.
  design: |
    New module src/lib/console-snapshot-cache.ts exports createConsoleSnapshotCache and owns the buffer, single-flight and freshness logic;
    boundConsoleReadRoute delegates to it (serve.ts is over its comment-load ceiling: add ZERO net comment lines
    there). Each cached path gets a `minRefreshMs` (status and recent 2 s, inbox 10 s, daemon-health 5 s, repos
    10 s), held as data in the new module. A request with a buffer answers it IMMEDIATELY with the existing
    `x-rmd-cache-state` / `x-rmd-cache-age-ms` headers and JSON `staleness` field. It schedules a refresh only when
    the buffer is older than its interval, and that refresh starts via setImmediate AFTER the response is written,
    never on the request's stack. Only a path with no buffer yet (cold) waits on compute, still under the existing
    750 ms race and fallbackBodyForCachedRead. Single-flight is kept, so N concurrent requests start at most one
    refresh. The response contract (status codes, headers, staleness field) is unchanged byte for byte. Use the
    Clock port for ages, never Date.now(). Another agent is separately fixing the gateway stall from
    watchInstanceLiveness's synchronous ledger read; do not touch instance-gateway.ts or fleet-liveness.ts.
  acceptance:
