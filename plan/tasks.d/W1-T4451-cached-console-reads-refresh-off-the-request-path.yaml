      proof: "unit test: a fresh console buffer is served without running the route handler"
    - claim: "an older buffer is answered at once and its refresh starts only after the response is written"
      proof: "unit test: a stale buffer is answered first and its refresh runs after the response"
    - claim: "serve builds its cached console reads through the new snapshot cache"
