    `files:` IS DERIVED BY WORD-BOUNDED INVOCATION COUNT, NOT BY GUESS. `isDispatchEligible` reads 9
    in `src/lib/drain.ts`, 5 in `src/lib/daemon.ts` and 1 in `src/run-task.ts`; `onStoodDown` reads 4
