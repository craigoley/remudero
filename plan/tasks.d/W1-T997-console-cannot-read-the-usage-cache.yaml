  note: |
    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT AT c8568c2, OWN PATH ABSENT.
    `readAccountUsageFile`: src/lib/account-usage.ts = 5 (its home), test/account-usage.test.ts = 11,
    plus one comment reference each in src/lib/worker-home.ts and src/lib/worker.ts which are prose
    and NOT calls — neither is declared. `deriveAccountUsage`: src/lib/account-usage.ts = 6,
    test/account-usage.test.ts = 21, src/lib/analytics-route.ts = 1 comment, src/lib/ledger.ts = 1.
    `buildAccountUsageRoute` is imported and wired in src/lib/serve.ts, which is why that file is
    declared — the missing supplier lives at that wiring site, not in the reader.
    src/run-task.ts is NOT declared: its only reference is a comment naming
    `buildAccountUsageRoute`/`ceilingPolicy` as an existing pattern, and declaring it would serialize
    this task against the many shards already naming it (W1-T471) for no benefit.

    risk: high IS RULE 19'S SPAN, AND THE LINTER DECIDED IT RATHER THAN THE AUTHOR. A first draft
    filed this at medium; `lint-plan`'s changed-tasks pass refused it in as many words —
    "[sizing] spans 2 distinct subsystems/concerns (account-usage, serve) at risk:medium — Rule 19:
    raise to risk:high or decompose into one task per concern" — because `moduleIdFromPath` strips
    the `.test` segment and the three declared paths resolve to the ids `account-usage` and `serve`,
    which is exactly the threshold. Raised on that refusal, not on judgement, and recorded here so
    the band reads as enforced rather than chosen. DECOMPOSITION IS THE OTHER OPTION THE RULE OFFERS
    AND IT IS REFUSED ON PURPOSE: the reader and the wiring that fails to supply it are one defect,
    and splitting them would file a supplier with nothing to supply. Blast radius genuinely argues
    low: one supplied value, one conditional read, and the omitted path leaves today's behaviour
    byte-identical (criterion 3).

    THE PANEL IS NOT THE ONLY THING DOWN RIGHT NOW, AND THAT IS RECORDED HERE RATHER THAN FOLDED IN.
    At the time of measurement `remudero-serve` was EXITED with code 137, having stopped at
    17:30:39Z after its board gateway logged a GitHub rate-limit 403 for user id 4397075;
    `OOMKilled=false`, `RestartCount=0`, restart policy `unless-stopped`. So the console was
    unreachable for a second, unrelated reason while this gap was being measured. That is an
    operational event for the operator, not a scope item, and this task neither diagnoses nor fixes
    it.

    PROOF NOTES. All four criteria use the NAME-FILTERED `unit test:` form with a bare title, never
    the pure-path form — a path proof against test/account-usage.test.ts would pass on any of that
    suite's existing tests and prove nothing about this change. Each title is plain prose under 100
    characters with ZERO commas, no `"; "` and no regex metacharacter, so
    `looksLikeScenarioNarrative` cannot fail proof-resolvability, and the executor compiles a bare
    title as an ESCAPED LITERAL so nothing in them acts as a wildcard. All four were checked with
    `grep -rlF` over test/ to match 0 files today against a control title matching 1 — forward
    references to titles this task creates, and titles rather than symbol names, so nothing here
    guesses an identifier. THERE IS DELIBERATELY NO `grep:` CRITERION: the tokens that would
    discriminate head from base are identifiers this task has not written yet, and a `grep:` naming
    this shard's own path is refused by `proof-scope` as outside the declared files.

    ID PROVENANCE — FOUR SURFACES, EACH CONTROLLED, PLUS A MINT THAT PROVED ITS OWN GATE. W1-T997
    read 0 on all four at c8568c2: refs/rmd-id/* (92 refs enumerated, control refs/rmd-id/W1-T946 =
    1), shard filenames on origin/main and ids declared anywhere under plan/ (control W1-T965 =
    filename 1 / declared 9), EVERY OPEN PR'S FILE LIST and EVERY OPEN PR'S TITLE (the open-PR query
    returned 3 lines, so the empty result is a real absence and not a failed call). 985 through 996
    are reserved, so 997 is the first free id above that block.
    THE MINT USED THE PLAIN REFSPEC — no `+`, no `--force-with-lease`: orphan anchor over the empty
    tree with ZERO parents, exit status into a variable, MINT_EXIT_CODE=0 with `* [new reference]`,
    readback of refs/rmd-id/W1-T997 returning exactly the nonce commit
    b489ab204fda6553978033ba3360363b1db1e12f. AND THE GATE WAS PROVED ON THE SAME INVOCATION: a
    second orphan pushed by the identical plain form at the TAKEN ref refs/rmd-id/W1-T946 returned
    PROBE_EXIT_CODE=1 with `! [rejected]`, and that ref still reads its original commit — the
    rejection is the gate, demonstrated rather than asserted.
