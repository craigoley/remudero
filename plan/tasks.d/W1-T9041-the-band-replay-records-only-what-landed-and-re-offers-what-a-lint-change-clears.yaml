  design: |
    No new bound and no timer. Every re-offer is triggered by a change in what the lint says, or in the guidance it
    gives, and is checked on the fleet lane pass that already calls the replay.
    1. REFILED MEANS A PLAN PR OPENED. `ledgerOutcome` records `refiled` only on a `ratify.approved` row naming the
       proposal after the seed. `ratify.approved` joins the union read's steps. `approve.shards_written` alone is no
       outcome. A later `approve.error` is `refused` with its text, as today, and a push refusal is one of those.
       MIGRATION: an entry stored `refiled` with no `ratify.approved` row after the seed is re-judged once, on the
       next pass, by the same rule. The store is still never re-seeded.
    2. ONLY refiled AND skipped_superseded ARE FINAL. `redraft_not_ready` and `refused` are open outcomes. Each stores
       the violation set it was judged on, plus a fingerprint of the guidance text `relintGuidanceLines` gives for that
       set. A pass reports `complete` only when every entry is final.
    3. RE-OFFER ON A CHANGE. Each pass re-lints each open entry's CACHED draft in-process with today's
       `lintDraftedFragment`, after the stamp composition `classifyProposal` applies. It calls no model.
       a. Clean now: write `inbox.replayed` with outcome `reoffered` and reason "cleared by a lint change", then clear
          the stored outcome. The fleet lane files it when the snapshot reads it ready. This is the path for the 6
          drafts W1-T8828 cleared.
       b. The violation set differs from the stored one, or the guidance fingerprint for it changed: drop the cached
          draft and its attempt key, as the first pass does (`invalidateDrafts`), so the draft rung re-drafts it once
          under today's lint and guidance. Write `reoffered` with the reason that matched.
    4. ESCALATE WHAT NO CHANGE CAN FIX, BY NAME. When a re-draft under the current guidance comes back with the same
       violation set it was offered on, the replay writes `inbox.replay_escalated` with `proposal_id`, `family` and the
       unresolved violations grouped by lint check. It delivers once per proposal per violation set through a new
       `escalateReplayStranded` in src/lib/escalation-catalogue.ts. That function follows the catalogue's pattern: the
       ledger row is the dedup key, written whether or not delivery succeeds. `replayBandMeaningRefusals` takes it as
       an injected `escalate` dep, which `FleetLaneDeps` carries. run-task.ts wires it where it builds the fleet lane's
       deps, beside `approve`. Absent the dep, the row is still written.
    Tests go in a new file, test/the-band-replay-re-offers-what-a-lint-change-clears.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive `replayBandMeaningRefusals` over a fixture state dir: a store with one entry
    per open outcome, draft caches whose fragments are clean, dirty-unchanged and dirty-changed under the injected lint,
    and a ledger with `approve.shards_written` followed by a preflight `approve.error`, and one followed by
    `ratify.approved`.
