- id: W1-T2657
  title: "A CREDITED SHARD HAS NO HOME BUT THE QUEUE — 709 of 840 plan/tasks.d shards are merged work, 166 of the linter's 170 open failures are done tasks, and every loader reads one directory; give the plan a second directory, plan/merged.d, that every reader understands and an absent one that reads as empty"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 90.00
  rationale: |
    RE-DERIVED AT 74e130251 (2026-09-02). Every figure carries its query so it can be re-taken; none
    of them survives the day it was taken.

    (1) THE POPULATION. `ls plan/tasks.d/*.yaml | wc -l` reads 840. Credit was taken the way the
    projection takes it — the anchored `Remudero-Task:` trailer union the non-filing squash-subject
    suffix, with `chore(plan)`/`plan:`/`docs(plan)` subjects EXCLUDED because a filing cites a task
    and does not implement it (the 55 ids that exclusion removed are the over-credit CLAUDE.md warns
    about). Result: 709 of the 840 shards are credited; 131 are not, and 23 of those carry
    `status: blocked`. Controls: W1-T2304 reads credited (its build merged as #2952), W1-T992 reads
    not credited (a verify:human ruling, never dispatched). The queue is 84% done-work by file count.

    (2) THE COST THE REPO'S OWN INSTRUMENT REPORTS. `rmd lint-plan` at this sha: "1056 task(s)
    checked (open tasks only) — 170 open failing (166 with a merged implementation, 4 with none)".
    The linter's own failing-split says 98% of what it fails every run is work that already shipped.
    That split exists BECAUSE of this problem (run-task.ts's `classifyFailingMergeEvidence` was built
    to stop the aggregate misleading) and CLAUDE.md carries a standing warning not to read the bare
    count as supply. `loadPlan("plan/tasks.yaml")` measures 1157 ms over 1109 tasks, paid on every
    dispatch tick and every verb. At the current filing rate (the fleet merged 86 PRs on 2026-09-01;
    `git log --since=2026-09-01T00:00Z origin/main | grep -c '^commit'`) the directory doubles in
    about two weeks.

    (3) WHAT IS ALREADY SETTLED, AND NOT RE-OPENED HERE. W1-T367 ruled, from plan/tasks.yaml's own
    header, that `status:` is initial-state only and the runner NEVER writes it back, for two stated
    reasons: a YAML round-trip destroys comments, and a machine writer races the human editor. It
    refused to sweep the stale shards because a sweep "would be stale again next merge". That ruling
    STANDS. This task adds no writer for the field and touches no shard's text. It changes WHERE a
    shard lives, not what it says: a `git mv` is a rename with byte-identical content, so the first
    reason cannot apply, and the second applies only to shards already credited — the ones nobody
    edits except under Standing rule 21, whose base lookup is by id and keeps working across both
    directories (design (iv)). W1-T367 (iii) also chose to keep `isOpenLintTask` yaml-based so the
    linter stays offline, at the price of a signal it knew was stale. Location resolves that
    trade-off without a network read: a shard under plan/merged.d is out of the lint scope by
    construction, deterministically, with no GitHub call.

    (4) WHY THIS IS THE FOUNDATION AND NOT THE MOVE. The move is a rung with a cadence and a policy
    row (its own shard, W1-T2658, depends on this one). Nothing may move until every reader of the
    live directory knows the archive exists, because the readers are many and several are gates:
    `git grep -l 'tasks\.d' -- src/ scripts/` names 30 files at this sha (control: `plan.ts` is
    among them). The code-level ones, by symbol: `listShardFiles`/`loadPlan`/`loadPlanAtRef`/
    `taskRecordPath` (src/lib/plan.ts — three loaders, each validating every `depends_on` against
    its own `byId`, so a dependency on an archived id would throw "depends_on unknown task" the
    moment a shard moved); `shardTaskIds` (src/lib/task-id.ts — the id minter's max; an archive it
    cannot see re-mints an archived id); `materializeOriginShards` (src/run-task.ts — the dispatch-
    time origin/main blob; an archive it does not copy makes every dependent of an archived task
    undispatchable); `shardSlugIndex`/`planShardSlugCorpus` (src/run-task.ts); `isDispatchEligible`
    (src/lib/drain.ts); `isOpenLintTask` (src/run-task.ts); scripts/task-id-existence-check.mjs
    (the id-existence GATE — an id cited in src/ that resolves only to an archived shard would fail
    CI) and scripts/acceptance-author-gate.mjs (declared-id enumeration). scripts/generate-plan-
    index.mjs indexes MASTER-PLAN sections only and is unaffected — checked, not assumed.

    (5) THE OTHER DECORATIVE FIELD, NAMED AND LEFT ALONE. `attempts: 0` is written by every shard
    and read back by nothing that writes it (plan.ts defaults an absent value to 0; the counts the
    board shows come from the ledger). It is out of scope here for the same reason `status:` is.
  design: |
    (i) TWO DIRECTORIES, ONE PLAN. `plan/tasks.d/` stays the live directory and the only place a
    new shard is ever written (inbox.ts's `writeRatificationShards`, the architect and triage
    prompts). `plan/merged.d/` holds shards whose implementation merged. `loadPlan` and
    `loadPlanAtRef` read both, in that order, into ONE `Plan`: ids unique across both (a collision
    is a `PlanError` naming both paths), every `depends_on` resolved across both, and each task
    carrying `archived: true` when and only when it was read from merged.d. `archived` is DERIVED
    FROM LOCATION and never parsed: a shard that spells `archived:` as a YAML key is refused at load,
    so location stays the single source. An absent merged.d reads as empty, exactly as an absent
    tasks.d does today — every existing fixture, test and unsharded plan loads unchanged.

    (ii) READERS DECIDE PER SITE, AND SAY SO. `isDispatchEligible` refuses an archived task with its
    own reason (`archived`) BEFORE `isMerged` is consulted — no GitHub read, no darkness case.
    `isOpenLintTask` and `openTaskIdsFromPlan` exclude archived tasks. `taskRecordPath` searches
    merged.d after tasks.d, so Rule 15 and Rule 21 lookups by id keep working for a moved shard.
    `shardTaskIds` (task-id.ts) and scripts/task-id-existence-check.mjs and
    scripts/acceptance-author-gate.mjs enumerate both directories. `materializeOriginShards` copies
    both into the dispatch-time blob. `shardSlugIndex`/`planShardSlugCorpus` index both. The
    architect and triage prompts say where history lives. docs/task-lifecycle.md describes the two
    directories and keeps its existing sentence that the status field is decorative.

    (iii) THE RATCHET THAT MAKES THE NEXT READER DECLARE ITSELF. A test walks `git ls-files` under
    src/ and scripts/ and, for every file containing the literal `tasks.d`, requires EITHER the
    literal `merged.d` in the same file OR a one-line comment beginning `PLAN-DIR: live-only —`
    stating why that site reads the live directory alone. It fails naming the file. The baseline is
    empty: every site this task touches satisfies the rule on merge, so the ratchet starts at zero
    debt — same shape as W1-T2295's catch-erasure ratchet, and for the same reason: a convention
    stated in a shard is violated silently; a walk that names the file is not.

    (iv) WHAT DOES NOT CHANGE. The `status:` field and its header ruling (W1-T367). plan/tasks.yaml,
    the pre-sharding monolith (W1-T122 left its migration to a later codemod; this task does not
    take it up). The credit projection (`projectPlan`, `findMergedByHeadBranch`) — location never
    feeds credit; credit is what later JUSTIFIES a location, in W1-T2658. No shard moves in this
    task's own diff.
  acceptance:
    - claim: "an absent plan/merged.d reads as empty in every loader, so every existing fixture and unsharded plan loads unchanged"
      proof: "unit test: test/plan-merged-dir.test.ts"
    - claim: "a shard under plan/merged.d loads with archived derived from its location, its id unique across both directories, and a depends_on naming it resolved"
      proof: "unit test: test/plan-merged-dir.test.ts"
    - claim: "the dispatch filter refuses an archived task before any GitHub read and the offline lint scope excludes it"
      proof: "unit test: test/plan-merged-dir.test.ts"
    - claim: "the id minter, the id-existence gate and the origin-blob materializer all enumerate plan/merged.d"
      proof: "unit test: test/plan-merged-dir.test.ts"
    - claim: "a src or scripts file naming the live directory must name the archive or state why it is live-only, enforced by a walk over tracked files that fails naming the file"
      proof: "unit test: test/plan-dir-readers-ratchet.test.ts"
    - claim: "the working-tree loader reads the archive directory"
      proof: 'grep: "merged\.d" in src/lib/plan.ts'
    - claim: "the id-existence gate reads the archive directory"
      proof: 'grep: "merged\.d" in scripts/task-id-existence-check.mjs'
  risk: high
  band_meaning: span
  origin: "oper#follow-up-brief-2026-09-02"
  plan_refs: ["W1-T367", "W1-T122", "W1-T2295", "§8A", "§12"]
  files: [src/lib/plan.ts, src/lib/task-id.ts, src/lib/drain.ts, src/run-task.ts, scripts/task-id-existence-check.mjs, scripts/acceptance-author-gate.mjs, docs/task-lifecycle.md, test/plan-merged-dir.test.ts, test/plan-dir-readers-ratchet.test.ts]
  status: queued
  attempts: 0
  note: |
    risk:high, band_meaning:span — Rule 19's SPAN measure: the loader, the id minter, the dispatch
    filter, the monolith's lint scoping and two CI scripts are distinct concerns that must change
    together or the archive is unsafe (rationale (4) names the failure each one would cause alone).
    Not blast radius: no shard moves in this diff, and an absent merged.d is a no-op by design (i).

    THE HYPOTHESIS THIS FILING CARRIES, UNRESOLVED. That the fleet's LLM readers — an architect
    grepping tasks.d for prior art, a worker reading a dependency's shard — are misled by
    `status: queued` on merged work into re-proposing or re-building it. It matters if true and is
    merely tidy if false. The falsifier is a ledger-union query this host could not run:
    `rmd ledger-grep 'already-merged'` restricted to re-dispatch attempts whose task had a stale
    queued shard. W1-T367's rationale records that three sessions inferred a hazard from the field
    that the dispatch path does not have; this filing claims nothing about dispatch and everything
    about legibility, which (2) measures directly.

    THE OPERATOR RATIFIES THE SEMANTICS, NOT THE CODE. A second directory is a change to what the
    plan IS; the direction refresh of 2026-09-01 named it as needing the operator's brief rather than
    a session's shard, and the 2026-09-02 brief supplied it. This task is the reversible half — with
    merged.d empty, nothing observable changes — and W1-T2658 is the half that moves.
