  acceptance:
    - claim: "When the interphase review clock is stopped while one of its passes never settles, stop() returns after a bounded wait, ledgers the passes it left running with how long each had run, and the tick continues; a pass that settles within the bound is awaited as today"
      proof: "unit test: test/daemon/one-hung-interphase-review-pass-cannot-park-the-tick.test.ts"
  rationale: |
    OBSERVED, operator recon 2026-11-01: the daemon (DAEMON-1793529044317) wrote one daemon.tick at 10:32:16 and none after; its dispatch phase settled at 12:10:32, and no light pass finished after 11:33:39. The stop() of startInterphaseReviewClock (src/lib/daemon.ts) ends with `if (activePasses.size > 0) await Promise.all(activePasses)`, unbounded, so one light pass whose open-PR read hung (its GitHub token had expired; W1-T11070) parked the whole tick. The earlier stall had the same shape: a light pass whose open_pr_views took 10,896,359 ms finished at 10:10:49, and the next daemon.tick followed 37 s later.
    Scope distinction from W1-T10871: that task compresses comments only. This task changes the review-stop behavior and updates the wall-clock declaration needed to qualify that behavior; current main's daemon compression census compares against the PR base, so no frozen daemon hash update is needed here. It does not perform comment compression.
