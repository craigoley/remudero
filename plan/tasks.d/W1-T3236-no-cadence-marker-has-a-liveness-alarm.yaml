      proof: "unit test: W1-T3236: a marker older than its own rung's interval is reported stale"
    - claim: "a marker that has NEVER been written is reported as never-fired, never skipped and never merged into stale"
      proof: "unit test: W1-T3236: an absent marker is reported never-fired, not skipped"
    - claim: "a rung paced slowly is judged on its own interval, so one global age cannot fire on it"
      proof: "unit test: W1-T3236: a slow rung within its own interval is fresh while a fast one at the same age is stale"
