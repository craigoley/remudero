- id: W1-T3236
  title: "NOT ONE OF THE NINE CADENCE MARKERS HAS A LIVENESS ALARM — `state/last-retro.json` sat frozen for six days while the fleet merged 28-40 runs a day, and the only thing that noticed was an operator asking why the board had gone quiet"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  risk: high
  origin: "operator-session#six-days-of-silence-2026-09-09"
  plan_refs: ["W1-T3229", "W1-T2988", "W1-T2270"]
  files: [src/lib/status-board.ts, test/a-cadence-marker-that-stops-advancing-is-reported.test.ts]
  status: queued
