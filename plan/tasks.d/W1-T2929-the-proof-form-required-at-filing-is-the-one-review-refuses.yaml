- id: W1-T2929
  title: "THE PROOF FORM REQUIRED AT FILING IS THE ONE REVIEW REFUSES — a shard must cite `unit test: test/foo.test.ts` so an unbuilt task's proof resolves under judgeCriterion's not_yet_built carve-out, and the semantic reviewer then downgrades that exact form as non-responsive once the task IS built: 38 downgrades across 11 tasks, and nothing migrates the pointer"
  repo: remudero
