  rationale: |
    TWO GATES DISAGREE ABOUT THE SAME STRING, AND BOTH ARE RIGHT ON THEIR OWN TERMS.

    AT FILING, the pure-path form is effectively mandatory. `judgeCriterion`'s `not_yet_built`
    carve-out (W1-T456) needs `!nameFiltered` AND the path present in the shard's `files:`; a task
    whose test does not exist yet therefore MUST cite the path, because a TITLE resolves to zero
    candidates and grades `no-match` — test theatre. CLAUDE.md states this as a rule.

    AT REVIEW, once the task is built, that same string is what the semantic reviewer refuses. The
    deterministic lane passes it — MEASURED on the live ledger, every one of these rows carries
    `executed_pass`, and several also carry "re-run against the PR's merge-base and did NOT pass
    there; the proof discriminates" — and the semantic lane then downgrades it with
    "reviewer judged the proof non-responsive (semantic downgrade)". THE REVIEWER IS RIGHT: running
    a whole ten-test file is not evidence for one specific claim, and a compound claim citing one
    file is weaker still.

    MEASURED 2026-09-05 on the live ledger:
      semantic non-responsive downgrades ............... 38
      distinct tasks affected .......................... 11
      (W1-T2653, W1-T2670, W1-T2675, W1-T2803, W1-T2809, W1-T2831,
       W1-T2857, W1-T2862, W1-T2905, W1-T2908, W1-T2915)
    THE PROOF THAT THE AXIS IS SPECIFICITY AND NOT THE DIALECT is inside W1-T2831's own shard: its
    four `grep:` proofs name specific phrases and ALL PASSED, while its single pure-path
    `unit test:` proof was the only criterion downgraded. Same PR, same reviewer, same run.

    THE REPAIR IS ALREADY KNOWN AND IS BEING DONE BY HAND, WHICH IS THE ARGUMENT FOR THIS TASK.
    #4116 (W1-T2908, W1-T2831) and #4119 (W1-T2915) repoint the proof at the test TITLE and split
    compound claims so each part cites the test that proves it. Every repointed title resolved to
    exactly one test against a control resolving to zero, and nothing was weakened — a split claim
    is strictly more demanding. Three of eleven are done; the other eight will each cost an operator
    a plan-only PR, a merge-up of the build branch, and a full CI cycle.

    WHAT IS MISSING IS A MIGRATION, NOT A NEW RULE. The pure path is correct while the test does not
    exist and wrong once it does, and no gate notices the transition. The cheapest shape that closes
    it: the LINTER already reads every shard and can already see whether a declared test file exists
    in the tree — so once it does, a criterion still citing the bare path is a finding that names the
    titles inside that file as the candidates. Advisory first (`proof-resolvability` is demoted to
    `warn` at dispatch and never reaches lint-plan's exit code), because promoting it to blocking
    while eleven tasks are already in this state would stall the queue — the SAME reason W1-T2503
    reports Rule 19 span rather than refusing it.

    DO NOT "FIX" THIS BY WEAKENING THE SEMANTIC LANE. Its objection is correct and is the only gate
    that catches a claim certified by a file it barely touches. And do NOT re-green a downgraded PR
    with `rmd review`: that verb is deterministic-only (`spawnReviewer: false`), so it posts PASS by
    SKIPPING the objection rather than answering it. That happened on #4101 and #4102 in this
    session, and both merged on an override nobody had read.
  acceptance:
    - claim: "a criterion citing a bare test path whose file now exists in the tree is reported"
      proof: "unit test: W1-T2929: a bare path whose test file now exists is reported"
    - claim: "the same criterion is silent while the file is absent, so filing an unbuilt task stays legal"
      proof: "unit test: W1-T2929: a bare path is silent while the test file is absent"
    - claim: "the finding names the titles inside the file as candidates rather than only refusing"
      proof: "unit test: W1-T2929: the finding names the candidate titles"
    - claim: "the check is advisory and cannot change lint-plan's exit code while the backlog is unmigrated"
      proof: "unit test: W1-T2929: the check is advisory and never fails the linter"
