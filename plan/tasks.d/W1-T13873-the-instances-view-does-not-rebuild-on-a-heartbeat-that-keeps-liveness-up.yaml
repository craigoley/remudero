  acceptance:
    - claim: "A daemon heartbeat that keeps every instance up leaves the instances body skipped, restamps its ledger source at the new beat, and its data equals a skip-disabled build"
      proof: "grep: W1-T13873 criterion 1 in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
    - claim: "invariant:liveness-change-rebuilds — a heartbeat that brings a down instance back up still changes the instances fingerprint and equals a full build"
      proof: "grep: W1-T13873 liveness in test/console-api/read-model/a-view-that-declares-its-rows-is-skipped-when-only-other-rows-moved.test.ts"
  rationale: |
    WHY: on the host with the Console Inbox open (OBSERVED 2026-11-19 19:58-20:10Z, read_model.view_builds rows,
    serve e5ab3b458, which includes W1-T13835), the fast-lane instances view built 254 times in 10 minutes at about
    278 ms of CPU each: 70.5 s, 0.12 cores, half of all read-model view CPU. 198 of those builds had not_skipped
    "inputs". The container averaged 0.895 cores against a 0.3 goal. W1-T13835 removed the projector generation
    from the view's inputsFingerprint (src/lib/instances-view.ts createInstancesView), but the fingerprint still
    holds each instance's raw instance_heartbeat last_ms. Every projected daemon.* row moves it, a few times a
    minute per instance, so the view rebuilds on each beat. The body reads the heartbeat only through
    instanceLiveness (up, or down since the beat), which is already a fingerprint input computed against now. Its
    ledger source's asOf comes from the view's ledgerReads, and a skip restamps that (read-model-worker.ts restamp),
    which is what W1-T10076 relies on to judge freshness. W1-T13835 is merged (#19711); this task removes the
    heartbeat input it left in place, and touches nothing it changed.
  design: |
    instances-view.ts: inputsFingerprint drops the raw instance_heartbeat last_ms from each instance's tuple and
    keeps state.instance, state.lease, the lease presence and instanceLiveness(db, now). ledgerReads is unchanged,
    so W1-T10076's heartbeat read declaration and its freshness judgment are untouched. INSTANCES_VIEW_VERSION and
    INSTANCES_QUALIFICATION_GENERATION are unchanged: the body is the same, only the rebuild trigger changes.
    The W1-T11975 criterion 3 case that moved the heartbeat with the instance up now first crosses the liveness
    bound, so a beat that changes liveness is still shown to be an input.
    INVARIANT liveness-change-rebuilds: a heartbeat that changes an instance's liveness (down to up, or a new
    down-since) changes the fingerprint and rebuilds.
  falsifier: |
    Put the raw last_ms back in the fingerprint: criterion 1 fails (the view rebuilds on the beat). Drop
    instanceLiveness from the fingerprint as well: criterion 2 fails (a beat after the bound no longer rebuilds).
