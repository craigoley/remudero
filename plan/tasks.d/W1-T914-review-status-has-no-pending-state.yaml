      proof: "unit test: test/review-pending-status.test.ts"
    - claim: "THE STARVATION FALSIFIER — a head whose only remudero-review is a pending whose owning run is gone is still dispositioned post-review, and the W1-T176 zero-runs discriminator still fires on it"
      proof: "unit test: test/sweep-review-pending.test.ts"
    - claim: "the pending is recorded on its own ledger step, so priorReviewVerdictFromLedger still recovers the last real verdict and the arm path reads no non-verdict"
      proof: "unit test: test/review-pending-status.test.ts"
    - claim: "the status board's read model carries review-in-flight as its own state and never collapses it into green"
      proof: "unit test: test/status-board-review-pending.test.ts"
    - claim: "the pending poster is a named export the detection paths call"
      proof: "grep: postReviewPending( in src/lib/review.ts"
