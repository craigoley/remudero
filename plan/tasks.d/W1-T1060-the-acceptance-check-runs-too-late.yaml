  note: |
    RULE 25 RE-DERIVED BY RUNNING THE REAL `INSTRUMENT_SURFACE` EXPORT, NOT BY READING IT, WITH FOUR
    CONTROLS. `.github/workflows/ci.yml` MATCHES, so this task is instrument-entangled and THE
    IMPLEMENTING PR RIDES ALONE. `scripts/acceptance-author-gate.mjs` does NOT match — the script
    pattern is `-ratchet.mjs`, not an arbitrary script; `test/acceptance-author-gate.test.ts` does
    not match; `src/lib/review.ts` does not match. Positive control: `scripts/coverage-ratchet.mjs`
    DOES match, so the predicate was live when the three negatives were taken.

    `src/lib/review.ts` IS DELIBERATELY NOT DECLARED. The predicate is REUSED, not modified — this
    task adds a caller, and declaring the file it calls would widen scope for no edit. If an
    implementer finds `acceptanceAuthorTimeCheck` must change to serve the job, that widening must
    be ratified before it is made rather than taken silently.

    PROOF DIALECT UNIFORM AND DELIBERATE. Every criterion forward-references through `unit test:`. A
    forward-referencing `grep:` at an EXISTING path is a HARD refusal on a filing PR: the path is
    greppable, the symbol is not yet there, the proof executes, returns zero, and `executed_fail`
    overrides keyword coverage. Two filing PRs were refused that way inside half an hour on
    2026-08-20 before the pattern was named.

    ID PROVENANCE — PRE-MINTED, READ BACK, AND THE ANCHOR'S AUTHORSHIP CHECKED RATHER THAN ASSUMED.
    The reservation resolves to the sha the operator's mint printed. Its anchor commit carries the
    operator's own session identity, matching the identity and process field on the operator's other
    recent mints; the fleet's block allocator writes a DIFFERENT subject shape entirely, and two
    neighbouring reservations carry that machine form — which is the distinction this check exists
    to make. Six surfaces swept with a live control on each: the reservation; shard FILENAMES via
    `git ls-tree -r`; a `plan/` grep; open PR text; a grep across `src/ test/ deploy/`; and live
    `run-` branches. THE SURFACES ARE RE-SWEPT IMMEDIATELY BEFORE PUSHING.
