  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: blast-radius
  budget_usd: 8.00
  files: [scripts/test-tier-manifest.mjs, hooks/pre-push, test/a-new-test-file-tiers-itself.test.ts]
  origin: "operator-session#daemon-health-2026-09-10"
