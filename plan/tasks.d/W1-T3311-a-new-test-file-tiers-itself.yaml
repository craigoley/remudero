  title: "NOTHING TIERS A NEW TEST FILE, SO EVERY WORKER THAT ADDS ONE IS REFUSED AT PUSH — `hooks/pre-push`'s W1-T3205 admission demands an entry in scripts/test-tier-manifest.json and NO code path anywhere runs `--seed`, so the remedy exists only in the refusal's own prose and only a human ever performs it"
  repo: remudero
  depends_on: []
