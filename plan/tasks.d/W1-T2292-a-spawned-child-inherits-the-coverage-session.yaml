- id: W1-T2292
  title: "A TEST THAT SPAWNS A NODE CHILD UNDER A COVERAGE SESSION SILENTLY ENROLS IT, AND THE ONE FORM THE REPO USES TO OPT OUT IS A NO-OP — `delete env.NODE_V8_COVERAGE` leaves the child pointed at the parent's coverage directory, so the child's own function table merges into the parent's report keyed on the absolute path; ten test files strip `NODE_TEST_CONTEXT` from a child env and NONE of them blanks the coverage session, while the one file that tries uses the form that does nothing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
