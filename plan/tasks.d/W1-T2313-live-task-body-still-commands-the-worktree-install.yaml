    THE PREMISE IS FALSE AND THE SENTENCE IS AN INSTRUCTION. `linkWorktreeNodeModules`
    (src/lib/worker.ts) symlinks every worker worktree's `node_modules` to the canonical tree on
    purpose, and `worktreeAdd` calls it unconditionally — so "fresh worktrees have no node_modules"
    has been false since that landed. An install whose cwd is the worktree follows the link, and its
    CLEAR PHASE empties the SHARED tree under every other live run. That is the observed outage
    pair: shared emptied at 21:54, W1-T362's real directory created at 21:55, W1-T361's still a
    symlink.

    WHY THIS SENTENCE AND NOT THE HEADER. The `plan/tasks.yaml` BINDING-RULES header carried the
    same instruction and IS CORRECTED IN THE PR THAT FILES THESE TASKS — that part is already done
    and is not this task. What is left is the copy inside W1-T65's `design:` body. A header comment
    is prose in a YAML file; a `design:` body is RENDERED INTO THE WORKER'S PROMPT. W1-T65 is
    `status: queued` with `attempts: 0`, so the next dispatcher pass hands that sentence to a worker
    as an instruction. Correcting the header and leaving this is precisely the Law 4 failure
    CLAUDE.md's own header describes: sharpening wording somewhere that does not bind.

    RE-DERIVE, DO NOT TRUST THE LINE NUMBER. The occurrence sits near plan/tasks.yaml:9073 inside
    W1-T65's `design:` block at this sha, but find it with
    `git grep -nEi 'npm (ci|i|install)' -- plan/` rather than seeking to a line. The sweep at filing
    time found exactly ONE live instructional occurrence; if the re-derivation finds more, correct
    each, and say so in the report.

    WHAT MUST NOT BE REWRITTEN, NAMED SO THE SWEEP DOES NOT OVERRUN. (a) The withdrawn/retired
    entries near plan/tasks.yaml:5829 and :5854 QUOTE the old criterion as the history of a
    retirement — they are records, not instructions, and rewriting them falsifies a gravestone.
