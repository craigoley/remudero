    test and NO `src/` path. That is also why #4872 cannot carry the fix itself — adding this
    instrument to a PR that changes four `src/` files is Standing rule 25 entanglement.
    THE PROOFS ARE PURE-PATH `unit test:` ON A FILE ABSENT AT BASE — the forward-referencing case
    the `not_yet_built` carve-out exists for (path declared in `files:`, absent on origin/main as
    VERIFIED 2026-09-09, no title filter). A `grep:` proof cannot discriminate before the work
    exists.
    SIBLING: the `process-boundary` directive-vocabulary filing, from the same session. They touch
    the same instrument and should not be built concurrently; whichever lands second rebases.
