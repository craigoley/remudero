      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
    - claim: "the records adjudicated as waiting still carry NO retirement ruling — the falsifier proving the pass adjudicated per record rather than blanket-marking the bucket, with the known counter-examples named"
      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
    - claim: "no task's status, acceptance, files or depends_on changed in this pass — only the retirement field and prose beside it"
      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
    - claim: "the blocked exclusion is unmoved — a blocked task carrying the field and one without it are still refused dispatch identically"
      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
    - claim: "the starvation census after this pass reports as recoverable only records that are genuinely waiting on a human, and reports no recoverable blocker for a queue whose remaining blockers are all retired"
      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
    - claim: "no id was deleted and no record became unresolvable, so no trailer degrades to a bare body claim"
      proof: "unit test: test/every-tombstone-names-its-disposition.test.ts"
  note: |
    verify: human IS LOAD-BEARING, NOT DECORATIVE, and it is the same construction W1-T391 uses for
    the same reason: `isDispatchEligible` refuses a non-auto task before the linter is consulted, so
    this cannot be handed to a worker who would infer rulings from prose — which is the specific
    failure that withdrew W1-T391's first implementation. Do not flip it to auto to make it
    dispatchable.

    budget_usd 20.00 IS NOMINAL. A verify:human task is never auto-dispatched, so the figure is a
    tripwire shape rather than an allowance, carried for schema completeness.

    ISSUE #3207 WILL NOT GO TO ZERO, AND THAT IS THE CORRECT OUTCOME. If every remaining blocked
    record after this pass is one a human genuinely must act on, the escalation should keep naming
    them — that is the detector working. A pass measured by whether the issue closes would be
    optimising for silence, which is how the original bound came to fire on a healthy condition in
    the first place.

    SEQUENCING WITH W1-T2634 IS SOFT, DELIBERATELY. W1-T2634 makes the docket derivable and keeps it from
    regrowing, so running it first is the convenient order — but it is NOT a hard edge here, because
    hitching the step that actually quiets the escalation to a linter change would strand it if that
    change stalls. The hard edge is W1-T2481 alone, and that one is unavoidable rather than chosen.
  queue_note: |
    NOT PROMOTED. Filed as a shard and therefore sorted after every tasks.yaml entry; position is the
    operator's dial. Note that shard position matters less than usual here — verify:human means the
    drain will refuse it regardless, so this task is picked up by an operator, not by a queue.
