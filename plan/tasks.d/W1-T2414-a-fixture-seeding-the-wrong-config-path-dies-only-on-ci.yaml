  falsifier: |
    If a sweep of `test/` finds no fixture that redirects HOME, reaches `loadConfig`, and seeds its
    config anywhere other than `configPath()`'s own output — measured the way this shard measured it,
    by RUNNING the candidates with every PATH entry holding a `claude` executable removed and comparing
    failure SETS rather than counts against a run with the binary present — then no fixture is at risk
    today and only remedy (c) has standing, since (a) and (b) would be guarding an empty set. That is
    already the state on `4d0d0ccc`: the at-risk count is ZERO, and the case for this task rests on the
    class recurring rather than on a live instance.

    SEPARATELY DECISIVE: if `configPath()` stops resolving `~/.config/remudero/config.json`, or if
    `loadConfig`'s `created` branch stops calling `resolveClaudeBin`, the chain described here is gone
    and the finding must be re-derived rather than trusted.
