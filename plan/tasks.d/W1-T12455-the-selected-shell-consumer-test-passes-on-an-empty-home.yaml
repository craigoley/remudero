      proof: "grep: W1-T12455 criterion 1 in test/selected-registry-shell-consumers.test.ts"
    - claim: "Every file the test and its children read is made under the fixture's own temp root: the fixture's docker stub answers `inspect --format {{json .Mounts}}` with a mount list that names the fixture's state and repos folders, so the serve replace reads a known placement and does not refuse"
