  rationale: |
    The operator chose the private overlay repository as the home repository (the Home Repo pattern, MASTER-PLAN
    §4I) and asked that operator-only material leave public core in steps that disrupt no running process. Plan records already move to the overlay through the task-move path. Other files are read by code today:
    for example the Console's repository picker needs a row in core's `.remudero/daemon-instances.yaml`, and
    `.remudero/managed-repos.json` lists managed repositories. Deleting either before its readers move would break a
    live read.
  design: |
    1. Find candidates: `.remudero/*`, `deploy/mac/*`, operator guides and any file naming one operator's machines or
       instances. For each, list its readers (`git grep` for the path and its basename across src/, scripts/, deploy/
       and .github/) and whether a host, serve or the Console reads it at run time.
    2. Say for each: stays in core (a product default or example a customer needs), moves to the home repository, or
       splits (a public example in core, the real values in the home repository).
    3. Give the move order inside this agreed sequence:
       Phase 0 (in flight): core's overlay catalog read works again (W1-T13705 names why it fails); the overlay merges
       non-plan changes through the fleet reviewer (W1-T13733, W1-T13599, then one operator step); the overlay's
       instance goes live (W1-T13700 and its host step).
       Phase 1: the plan-record movers (W1-T13680, W1-T13681) start only after core's overlay read works.
       Phase 2: the overlay's pointer file lands first. Then one task per file, in three steps: copy it to the overlay
       and point its reader at the overlay copy with core's copy as fallback; prove it from a fresh session or a fresh
       daemon start; delete core's copy. Order: unread files (docs, skills), then session tooling, then daemon readers.
       A reader that fetches from GitHub waits for core's overlay read; `.remudero/daemon-instances.yaml` goes last,
       after the overlay instance is live.
       Phase 3: retire each core copy only after its reader has run on the overlay copy for a day.
       Name the check that proves each step changed no read.
    Write the report with the three headings the proofs name, each on its own line, label claims OBSERVED or INFERRED,
    and add it to docs/docs-index.json. Name no secret, host path or ledger row in the report; it is public.
