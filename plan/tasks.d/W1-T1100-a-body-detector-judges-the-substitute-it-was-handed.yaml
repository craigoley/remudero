  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH, AND NO PROOF SHELLS GIT. Every criterion uses the
    pure-path `unit test:` form naming `test/review-evidence-provenance.test.ts`, declared in
    `files:`, so on the filing PR it resolves through W1-T456's `forwardReferenceFiles` carve-out to
    `not_yet_built`. The falsifier is a pure predicate over an evidence object and needs no
    subprocess.

    `risk: high` IS SET UP FRONT AND IT IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses two
    `src/` modules and `test/`, so `subsystemsOf` (`src/lib/task-linter.ts`) derives more than one
    tag. The diff is one field, one guard at each of two consumers, and the wiring that sets it.

    BOTH FILES MUST BE DECLARED BECAUSE THE TWO HALVES SIT IN DIFFERENT MODULES: the substitution
    happens in `runTaskBody` (`src/run-task.ts`) and every consumer lives in `src/lib/review.ts`. A
    provenance flag that only one side knows about is the same defect with an extra field.
    `src/run-task.ts` is declared per DECISIONS.md's 2026-08-18 W1-T471 ruling rather than avoided.

    THE SWEEP WAS RUN WITHOUT REST FOR THE SURFACES REST COULD NOT ANSWER. The account's REST budget
    was exhausted mid-recon, so the open-PR and merged-trailer queries returned an error payload;
    those were recorded as UNMEASURED rather than as zero, and the open-PR surface was then closed a
    stronger way — every remote head was fetched over git protocol and its TREE inspected for a
    W1-T1100 shard, which reads actual files rather than body text. Live control: the same scan
    finds a known shard on main.

    ID PROVENANCE. `refs/rmd-id/W1-T1100` resolves to b8efffc2b1838abbb0f5b85a5a2e3213504e86a2, read
