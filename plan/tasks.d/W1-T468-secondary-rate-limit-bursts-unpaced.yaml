    implementation leaves untouched (`inverseScopeUntouchedFiles` fails a declared-but-untouched path
    just as `scopeViolationFiles` fails an undeclared one).
    `plan_refs` IS DELIBERATELY EMPTY AND THE NEAR NEIGHBOUR IS NAMED HERE INSTEAD. W1-T372 owns
