  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — daemon-loop captures stage for the per-poll async sweep instead of landing inline; what is captured, upstreamed and finally landed is unchanged
  band_meaning: span
  origin: "operator session 2026-10-15: the rest of W1-T9660's runInTree row once W1-T9695 converts the boot sweep and landContent"
  plan_refs: [W1-T9615, W1-T9660, W1-T5460, W1-T5525, W1-T5628, W1-T530, W1-T5689]
  files:
    - src/lib/feedback.ts
