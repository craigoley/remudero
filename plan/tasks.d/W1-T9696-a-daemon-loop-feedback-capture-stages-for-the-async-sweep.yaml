- id: W1-T9696
  title: "EVERY DAEMON-LOOP FEEDBACK CAPTURE STILL LANDS INLINE THROUGH THE SYNCHRONOUS PLAN-PR PREFLIGHT — W1-T9615 moved only the SRE lane to stageFeedbackCapture; captureFeedback's inline landFeedback (landPending -> syncPreflightOf -> runInTree's spawnSync checks) still runs on the loop for the issue intake, the ops alert poll, the issue-revalidation garden, the gardens' handoff, the evidence-coverage filer and the repair-feedback capture, so runInTree's census row cannot be deleted"
  repo: remudero
