- id: W1-T4022
  title: "THE OBJECT REAPER'S THREE REFUSALS ARE ALL NEAR-PERMANENTLY TRUE ON A WORKING FLEET, SO THE OBJECT STORE IS NEVER COMPACTED — each refusal is individually correct, and their conjunction is a gate that a busy host can never pass"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  priority: 2
