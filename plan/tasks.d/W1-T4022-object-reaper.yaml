  risk: high
  band_meaning: span
  origin: "measured 2026-09-22 on both hosts while clearing worktrees by hand — 1.51 GiB of loose objects on Azure, and the reaper had never been able to run"
  plan_refs: [W1-T3092]
  files: [src/lib/object-reaper.ts, src/run-task.ts, test/the-object-reaper-rung-runs.test.ts, scripts/test-tier-manifest.json]
