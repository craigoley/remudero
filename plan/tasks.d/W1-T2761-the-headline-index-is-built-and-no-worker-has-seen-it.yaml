- id: W1-T2761
  title: "THE HEADLINE INDEX IS BUILT AND NO WORKER HAS SEEN IT — W1-T2508 shipped parseRuleHeadlines, renderHeadlineOnlyIndex and a degrade-to-full-rule retrieval path with twelve real tests, its source says in terms it is not wired into implementPromptParts, and on the corrected premise a dispatched worker today receives no rule at all; add the headline index as a policy-gated prompt part in the stable prefix, point the worker at the body on disk, and give the wipe test a rules factor so the first worker to see a rule is measured"
  repo: remudero
  depends_on: [W1-T2759]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    RE-DERIVED AT 7775b9977 (2026-09-03).

    (1) WHAT EXISTS. src/lib/learnings.ts exports `parseRuleHeadlines`, `buildHeadlineIndex`,
    `renderHeadlineOnlyIndex`, `retrieveRuleBody`, `retrieveRuleBodyOrDegrade` and
    `renderProgressiveRuleContext`; src/run-task.ts exports `retrieveRuleBodyOnDemand`.
    test/a-rule-body-loads-only-when-its-headline-is-taken.test.ts holds twelve tests over them.
    `retrieveRuleBodyOnDemand`'s own doc: "NOT wired into implementPromptParts/renderImplementPrompt:
    making a worker's stable prefix carry headlines instead of CLAUDE.md's current whole-file inject
    is a follow-up switch-over, not this task's acceptance". No shard files that switch-over; the
    only match for it in plan/ is W1-T2508 itself.

    (2) THE PREMISE, CORRECTED BY W1-T2759. There is no whole-file inject to switch FROM: a Claude
    worker is spawned with `settingSources: []` and receives six prompt parts, none of them a rule.
    So the index would not replace 43 KB with 6 KB; it would add roughly 15 percent of CLAUDE.md
    (W1-T2508's own measure of the headline share) to a prompt that carries none of it. That is a
    different decision, with a different cost and an unmeasured benefit — which is why it ships OFF
    and measured, never as a default.

    (3) WHY HEADLINES AND NOT BODIES, AND WHY MEASURED. The literature this scan read is one-sided:
    IFScale (2025) measured instruction-following falling with instruction count across twenty
    models, with a bias toward EARLIER instructions; Anthropic's memory guidance says longer files
    reduce adherence. Neither says a worker with zero rules does better or worse than one with
    fifty-eight headlines. The wipe test (W1-T2512) is this repo's instrument for exactly that
    question and today knows two factors, `learnings` and `recon` (src/lib/wipe-test.ts). A third
    factor is additive on a harness that already refuses to average across factors.

    (4) THE RETRIEVAL PATH IS THE POINTER PATTERN THIS PROMPT ALREADY USES. `taskRecordContextLine`
    tells the worker its record is on disk and to read it first; the plan index reaches recon, never
    the plan. A headline's body lives in CLAUDE.md in the worktree the worker already has, so the
    pointer is one line, and `retrieveRuleBodyOnDemand` stays the harness-side resolver for the
    post-compaction anchor.
  design: |
    (i) THE ROW. `PolicyValues.workerRuleHeadlines.enabled` in src/lib/policy.ts, OPTIONAL and
    absent-means-off in the `autoTriage.enabled` shape; plan/policy.yaml is not edited by this task
    (a verify:auto task never declares it — the row ships absent, the W1-T2579 shape).

    (ii) THE PART. With the row on, `implementPromptParts` gains `rule_headlines`: the
    `renderHeadlineOnlyIndex` of CLAUDE.md's bullets followed by one pointer line naming where a
    body is read from. It sits in the STABLE prefix directly after `doctrine` (W1-T35: stable
    first, volatile last), so `prompt.manifest` records it as a part and the byte cost is visible
    per run. With the row absent or off the rendered prompt is byte-identical to today's.

    (iii) THE ANCHOR. `renderAnchorBlock` re-injects the index unchanged after a compaction,
    resolved through `retrieveRuleBodyOnDemand`'s degrade path so an unreadable source yields the
    full rule and never silence — the W1-T2508 hazard, honoured at the seam it names.

    (iv) THE FACTOR. `WipeTestFactor` gains `rules`; `wipeTestFactorMasksRules` masks the part and
    nothing else, in the shape `wipeTestFactorMasksLearnings` already has; `resolveWipeTestFactor`
    names the new member in its refusal; aggregates stay one factor wide.

    (v) WHAT DOES NOT CHANGE. CLAUDE.md. The learnings injection, its budget and its order. What a
    worker may do. W1-T2659's clock, which this task neither adds nor promises.
  acceptance:
    - claim: "with the row absent or off the implement prompt is byte-identical to today's rendering"
      proof: "unit test: test/the-worker-gets-the-headlines.test.ts"
    - claim: "with the row on the prompt carries headlines and no bodies, in the stable prefix before the volatile tail"
      proof: "unit test: test/the-worker-gets-the-headlines.test.ts"
    - claim: "a wipe-test pair under the rules factor masks the headline part and nothing else"
      proof: "unit test: test/the-worker-gets-the-headlines.test.ts"
    - claim: "the anchor block repeats the index and degrades to the full rule when the source is unreadable"
      proof: "unit test: test/the-worker-gets-the-headlines.test.ts"
    - claim: "the factor is a named member with its own mask decision"
      proof: "grep: wipeTestFactorMasksRules( in src/lib/wipe-test.ts"
    - claim: "the part is named in the prompt assembly"
      proof: "grep: rule_headlines in src/run-task.ts"
