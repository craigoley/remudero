  title: "A DESIGNED ABSENCE IS REPORTED IN THE VOCABULARY OF REFUSAL — `loadGlobalArtifact` returns SEVEN distinct failure reasons of which exactly ONE (`not found`) is the ruled-on deferred state and six are real problems including the tamper signal, and `status-board.ts` renders all of them under the single word `refused:`, so the operator's own board reports an expected absence and a hand-edited artifact in the same words"
