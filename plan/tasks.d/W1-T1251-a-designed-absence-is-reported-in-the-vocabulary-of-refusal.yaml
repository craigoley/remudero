    Whether a discharged entry should advance is the intake lane's call, not this task's.

    NOT PROPOSED, PER THE RULING: making the absence fatal, merging the global layer into the
    project corpus, changing the three-layer precedence, or reducing the per-spawn field to
    once-per-boot. Each is refused above with its reason rather than merely omitted.
