- id: W1-T5695
  title: "A POSTED GATE NEVER SHARES A NAME WITH A WORKFLOW JOB — three producers name a check `commitlint` on every head (ci.yml's always-green job, the API-posted AND of commitlint and rule-checks, pr-title-lint.yml's job), so on #8905 an API-posted failure was masked by a later title-lint success under name-only dedupe and ci-gate's jq"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — every posted gate report carries a name and identity no job shares
  band_meaning: blast-radius
  origin: "operator session 2026-10-04: research/flow/report.md (change-aware flow) item 7, distinct names for API-posted gate reports; workflow edits are an operator build (W1-T5351)"
  plan_refs: [W1-T5694, W1-T5368, W1-T3720, W1-T5351, W1-T4399, W1-T5515]
  files: [.github/workflows/ci.yml, .github/workflows/ci-gate.yml, .github/workflows/pr-title-lint.yml, test/a-posted-gate-never-shares-a-name-with-a-job.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a. ci.yml's `commitlint` job ends by posting ~16 gate
    check runs through `gh api repos/…/check-runs` with `external_id=job:${POSTING_JOB_ID}`; one of
    them is named `commitlint` and carries the AND of `commitlint=` and `rule-checks=`. W1-T3720
    (#8747) and W1-T5368 (#8918) changed only its TITLE. The same name is also ci.yml's own job
    (green by construction, continue-on-error steps) and pr-title-lint.yml's job, which re-runs on
    `edited`. GitHub files each posted run in an arbitrary Actions check suite, so suite identity
    misattributes it too. MEASURED (GraphQL dumps, 471 heads): mostly 3, up to 6 `commitlint` runs
    per head; 62 of 395 fix-dispatch targets named `commitlint` (59 were real rule-check census reds
    with a test-path signature); 28 `not-metadata` metadata-repair detours on 14 PRs. Masking: #8905
    head 30f6aabe, posted FAILURE 16:37, title-lint SUCCESS 16:39 — both the sweep's name-only dedupe
    and ci-gate.yml's `group_by(.name) | map(max_by([.started_at, .id]))` read green. #8813 head
    c17487c9: the posted failure sat beside two successes and a 10-03T03:41 fix.dispatch targeted
    `commitlint` for a citation-anchor-census red. Workarounds that exist only for the collision:
    `METADATA_RED_CHECKS` includes "commitlint" and `titleOnlyCommitlintRed` parses the log.
  design: |
    (i) ci.yml posts the rule-checks half under its own name `rule-checks` (an `if: false` stub job
    of that name, the W1-T4399 pattern, keeps test/every-pr-check-is-required-or-advisory.test.ts
    deriving it from a real job) and ci-gate.yml's REQUIRED names it; `commitlint` then means the
    commit-message lint alone.
    (ii) pr-title-lint.yml's job gets its own `name:` (`pr-title`).
    (iii) The posted `external_id` carries run id and attempt (`run:<id>:<attempt>:job:<id>`) and the
    checkJobId reader accepts both forms.
    (iv) ci-gate.yml's jq groups by that identity before taking the newest.
    The matching `CI_PARITY_TABLE` row (src/lib/ci-parity.ts) and dropping "commitlint" from
    `METADATA_RED_CHECKS` follow in a src PR; standing rule 25 refuses them beside a workflow edit.
  acceptance:
    - claim: "no check name is produced both by an API post in ci.yml and by a job in any workflow, rule-checks is posted under its own name and listed in ci-gate's REQUIRED, and ci-gate's grouping reads the #8905 pair (posted failure, later same-name job success) as failing"
      proof: "unit test: test/a-posted-gate-never-shares-a-name-with-a-job.test.ts"
  falsifier: |
    Post rule-checks under `commitlint` again: the name census finds the collision and the #8905
    fixture reads green through ci-gate's jq; the test fails.
