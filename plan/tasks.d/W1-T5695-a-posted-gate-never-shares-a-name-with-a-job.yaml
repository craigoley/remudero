  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a. ci.yml's `commitlint` job ends by posting ~16 gate
    check runs through `gh api repos/…/check-runs` with `external_id=job:${POSTING_JOB_ID}`; one of
    them is named `commitlint` and carries the AND of `commitlint=` and `rule-checks=`. W1-T3720
    (#8747) and W1-T5368 (#8918) changed only its TITLE. The same name is also ci.yml's own job
    (green by construction, continue-on-error steps) and pr-title-lint.yml's job, which re-runs on
    `edited`. GitHub files each posted run in an arbitrary Actions check suite, so suite identity
    misattributes it too. MEASURED (GraphQL dumps, 471 heads): mostly 3, up to 6 `commitlint` runs
    per head; 62 of 395 fix-dispatch targets named `commitlint` (59 were real rule-check census reds
    with a test-path signature); 28 `not-metadata` metadata-repair detours on 14 PRs. Masking: #8905
    head 30f6aabe, posted FAILURE 16:37, title-lint SUCCESS 16:39 — both the sweep's name-only dedupe
    and ci-gate.yml's `group_by(.name) | map(max_by([.started_at, .id]))` read green. #8813 head
    c17487c9: the posted failure sat beside two successes and a 10-03T03:41 fix.dispatch targeted
    `commitlint` for a citation-anchor-census red. Workarounds that exist only for the collision:
    `METADATA_RED_CHECKS` includes "commitlint" and `titleOnlyCommitlintRed` parses the log.
    RE-PLANNED 2026-10-05 on origin/main b790deee. A build of the first design (WIP fc8b5770) could
    not go green, for four reasons. (1) Its `rule-checks` stub job key is pinned in both directions
    by `CI_PARITY_TABLE` (src/lib/ci-parity.ts) and by gate-posture.ts's `ci:<key>` declarations.
    Rule 25 refuses those src rows beside a workflow edit. The W1-T3171 carve-out
    (`mandatoryRegistrationPaths`, src/lib/review.ts) admits only ci.yml + ci-gate.yml, so the
    pr-title-lint.yml edit already took it out of reach. No src-first or workflow-first order kept
    both PRs green. W1-T5802 derives posted names in `derivePrCheckCandidates`, so no stub is
    needed. (2) `checkJobId` (src/lib/sweep.ts) reads only `^job:(\d+)$`, so a run-scoped
    external_id would blind the sweep's rerun and failure-log reads. W1-T5802 lands that reader
    first. (3) Renaming pr-title-lint.yml's job breaks two things. W1-T3781's title edit could no
    longer clear a title red: ci.yml never fires on `edited`, so its posted `commitlint` would stay
    red. W1-T4402's census (test/an-edit-reruns-only-what-reads-the-body) justifies ci-gate.yml's
    `edited` trigger only while REQUIRED names every title reader's check, so an ADVISORY
    `pr-title` fails it. (4) About a dozen existing tests pin the old shape, and the old `files:`
    listed none of them. W1-T351 (ci.yml's live title read, pinned by test/ci-title-lint) is not
    redone here. This task only moves those pins to pr-title-lint.yml's identical step, because it
    removes ci.yml's copy of the title lint.
  design: |
    ONE PRODUCER PER NAME. The title verdict has exactly one producer. Everything ci.yml posts has
    a name that no runnable job registers.
    (i) ci.yml's `commitlint` job (the W1-T4399 bundling job; its KEY stays `commitlint`, so
    CI_PARITY_TABLE, gate-posture and every `needs:` are untouched) changes its `name:` to
    `light-gates` and drops its PR-title lint step. Its reporter stops posting `commitlint` and
    posts `report "rule-checks" "${OUTCOME_RULE_CHECKS}"` under that name. Add no stub job:
    W1-T5802 derives the name from the `report` line. ci-gate.yml's REQUIRED gains `rule-checks`.
    ADVISORY gains `light-gates`, with a comment saying it is green by construction
    (continue-on-error steps) and that each gate it runs is posted under its own REQUIRED name.
    (ii) pr-title-lint.yml is NOT edited. Its job, `name: commitlint`, becomes the only producer of
    `commitlint` and stays REQUIRED. A title edit re-runs it on `edited`, which keeps W1-T3781's
    clearing of a title red. W1-T4402's census still finds every title reader's check in REQUIRED.
    So `commitlint` means the PR-title lint alone, and there is no `pr-title` name. (This settles the
    open call in favor of REQUIRED. It also rejects an ADVISORY second name for the same verdict.)
    METADATA_RED_CHECKS keeps "commitlint", which is now title-only by construction.
    (iii) Each post's `external_id` is `run:${{ github.run_id }}:${{ github.run_attempt }}:job:<id>`.
    W1-T5802's `checkJobId` reads it.
    (iv) ci-gate.yml's jq groups by name AND PRODUCER CLASS before it takes the newest. The class is
    "posted" when external_id matches `^(run:[0-9]+:[0-9]+:)?job:[0-9]+$` and "job" otherwise. Group
    by the class, never by the full external_id: a rerun of the posting job must still supersede its
    own earlier post (W1-T123), and a full-identity group would keep that stale failure. A name is
    not-ready while any of its groups is incomplete. A skipped `if: false` stub beside a post never
    fails.
    (v) Update the tests that pin the old shape, all listed in `files:`: the reporter's posted names,
    titles and external_id; the ci.yml title-lint pins in ci-title-lint and commitlint-mode, which
    move to pr-title-lint.yml's step; the REQUIRED fixture in ci-gate-required-format; and
    fast-lane-classifier acceptance 8's ci.yml job-name list (`commitlint` becomes `light-gates`).
    Regenerate MASTER-PLAN.md with `npm run capability-snapshot`. These must pass UNMODIFIED:
    title-edit-commitlint-workflow, an-edit-reruns-only-what-reads-the-body,
    every-pr-check-is-required-or-advisory, push-ci-on-main, preflight-ci-parity. If one of them
    needs an edit, the design is wrong: stop and record needs-design. Do not widen `files:`.
    (vi) The new test's name check compares the names the reporter POSTS (its `report "<name>"`
    lines) with the `name:`s of runnable jobs (not `if: false`) in every workflow. Do not compare
    against `derivePrCheckCandidates`' output: after W1-T5802 that output includes the posted
    names, so every post would read as a collision.
    No src/ edit, so rule 25 cannot refuse this PR. If W1-T5802 has not merged, stop and record
    needs-design. A later src cleanup can drop `titleOnlyCommitlintRed`'s posted-log arm, which
    goes dead here; it is harmless until then.
