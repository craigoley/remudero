  note: "THIS IS HALF THE FIX AND MUST NOT BE REPORTED AS THE WHOLE ONE. Its acceptance criteria are
    deliberately written about DOCUMENT SELF-CONSISTENCY and say nothing about the incident W1-T392
    was filed for, because this half cannot detect it — the rationale re-derives why at 0503802.
    W1-T410 is the half that can. A reviewer reading a PR body on this task that claims to close the
    plan-state gap should refuse it on that ground alone.
    DEPENDENCY DIRECTION: NONE, established rather than assumed. This task reads MASTER-PLAN.md
    against ITSELF; W1-T410 reads MASTER-PLAN.md against GitHub merge state. Neither consumes the
    other's output and neither needs the other to be correct, so both carry depends_on: [] and either
    may ship first. There IS a shared piece — the small phrase extractor for the not-shipped
    vocabulary — and the obligation on whichever ships SECOND is to reuse the first's exported
    extractor rather than duplicate it. That is a reuse obligation, not an ordering constraint, and
    encoding it as depends_on would park a dispatchable task behind an unrelated one.
    RECOMMENDED ORDER, which is not a dependency: W1-T410 first, because it is the half that closes
    the incident. If only one of the two ever ships, shipping this one leaves the gap open.
    risk:medium is honest here rather than defensive. Rule 19 counts concerns and this shard spans
    exactly one: plan/claims.yaml is discounted as a plan-data artifact by isDataArtifact, and the
    runner and its suite share a module id. The sibling W1-T410 is risk:high for the opposite reason,
    stated in its own note.
    budget_usd 45 — below W1-T392's 70 because the retro half and its measurement work leave with
    W1-T410, and below its sibling because everything here is pure text over one file with no
    resolver, no injection seam and no live state.
    verify:auto — every criterion is decidable in-process against a fixture plan file. No network,
    nothing spawned, no operator present.
    files: declares the suite because a proof naming a path outside files: is a proof-scope warning at
    filing and a scope-guard REFUSAL after the work is done."
