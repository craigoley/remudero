- id: W1-T5741
  title: "THE ASYNC ARM PATH READS GITHUB OFF THE LOOP — W1-T5284's `realArmDepsAsync` awaits the arm, disarm, merge, enqueue and merge-queue calls but spreads `realArmDeps`' synchronous `headSha`, `isMerged`, `readMergeFacts`, `updateBranch`, `readPlanTouch` and `stackPrerequisite` REST reads into it, and its `sleepSync` blocks the thread for 2 s through `Atomics.wait` on every unsettled-merge retry"
  repo: remudero
  depends_on: [W1-T5284]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: medium
  origin: "operator session 2026-10-04: found while building W1-T5284 (#9159)"
  plan_refs: [W1-T5284, W1-T5689, W1-T5615, W1-T2855]
  files: [src/lib/arm-auto-merge.ts, test/the-async-arm-path-reads-github-off-the-loop.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-04 on #9159 (W1-T5284, open, head e186f087). `realArmDepsAsync`
    (src/lib/arm-auto-merge.ts) is `{ ...realArmDeps(loadConfigImpl), armAuto, mergeDirect,
    disableAuto, mergeQueue, enqueue }` with those five awaited on `ghTextAsync`/`ghJsonAsync`. The
    spread keeps `realArmDeps`' synchronous readers: `headSha` (`readHeadShaRest`), `isMerged`
    (`isPrMergedNow`), `readMergeFacts` (`fixRebaseMergeFactsFromRest`), `updateBranch`
    (`ghUpdateBranch`), `readPlanTouch` (`planTouchFromRest`) and `stackPrerequisite`
    (`stackPrerequisiteFromRest`), and its `sleepSync`, an `Atomics.wait` called with
    REST_MERGE_UNSETTLED_RETRY_INTERVAL_MS (2_000) on each unsettled-merge retry. The async
    `attemptArm` and the direct-merge preflight therefore still block the daemon loop on every
    REST read they make. Batch-10's W1-T5689 (#9155, open) baselines such sites; it does not
    convert them.
  design: |
    Give `ArmDeps<true>` Promise-returning forms of the six readers over `ghJsonAsync`/the async
    REST helpers, and an awaited `sleep` in place of `sleepSync`, and have the async drivers
    (`attemptArmAsync`, the direct-merge preflight and `attemptPlanPrMerge` under the async driver)
    await them; the sync `realArmDeps` stays for CLI callers. Outcomes, ledger rows and refusal
    strings are unchanged.
  acceptance:
    - claim: "an async arm attempt that reads the head, the merge facts and the plan touch, and waits out an unsettled merge, lets a timer fire during each read and during the retry wait, and returns the same outcome as the sync driver"
      proof: "unit test: test/the-async-arm-path-reads-github-off-the-loop.test.ts"
  falsifier: |
    Keep the spread of `realArmDeps`' sync readers: the timer fires only after each read settles and
    the test fails.
