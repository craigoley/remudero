  rationale: |
    The author preflight runs every suite for a change to a deploy/ file or a json file, because no read map is ever passed to it.
    READ at origin/main 6cf453f7a:
    - src/lib/affected-suites.ts:112-119 `fullRunTrigger`: a deploy/ or json path (READ_MAPPED, :108) forces a full run unless
      `readMapUsable` is true. `selectAffectedSuites` (:445-455) sets it from `readMapProblem(input.readMap)`, which answers
      "no read map supplied" when `readMap` is absent (:216).
    - `readAffectedSuitesInput` (:843) never sets `readMap`, and `authorSelection` (scripts/preflight-author.mjs:326) calls
      only that reader. `readReadMapInput` (:207), `readReadMap` (:190), `readReadRecords` (:175) and `buildReadMap` (:152)
      (W1-T6084) have no caller under src/, scripts/ or bin/.
    - No workflow produces a map. test/setup/read-map.ts records each suite's non-code reads when RMD_READ_MAP_DIR is set;
      scripts/read-map-corpus.mjs is an operator-only collector that by design "never emits a consumption-ready read map".
    - coverage-nightly.yml:206-222 already builds and uploads the `test-impact-map` artifact (W1-T6107), and ci.yml:1829-1850
      fetches it with `gh run download` for the shadow selector. The read map can use the same path.
    MEASURED by the operator session over about four days: 22 author runs fell back to the full suite; 15 of them named a
    deploy/ path with "no read map supplied". The Azure ship lane's own preflight logs on 2026-11-13 hold 11 such lines
    (deploy/recycle-container.sh 7, deploy/rmd-host-cleanup.sh 2, deploy/install-host-units.sh 1, deploy/host-recycle-lock.sh 1).
    W1-T9953 cuts a full fallback to a partial set, but that set follows only the import graph, so a shell script or a json
    file has no readers in it.
    AMENDED 2026-11-13 (the hand build found this before it wrote code): `readMapProblem` (:219) refuses the WHOLE map when
    any suite has unknown descriptor coverage, and test/setup/read-map.ts marks a suite unknown, for good, on any
    exec/execFile/spawn/fork call. MEASURED at ecd94c0da: a static grep finds at least 2,376 of 4,628 suites that spawn,
    directly or through a helper, and 64 of the 74 suites that name deploy/recycle-container.sh spawn it. Two deploy readers
    run through the real preload (test/git-author-commissioning.test.ts, which read 33 deploy/ files, and
    test/repositories-from-the-read-model.test.ts, which spawns nothing itself) both wrote `unknownDescriptors: true`.
    So a map built from a full run is always refused, and the first design would only change the fallback's reason.
    The operator session chose per-path narrowing: the unknown suites that may read the changed path are selected, and
    the map speaks for the rest. MEASURED on the real tree with every suite unknown: the naming rule of design step 4
    selects 642 of 4,629 suites for deploy/recycle-container.sh (236 name the path or deploy/; the file name and the
    quoted "deploy" segment add the rest). Walking the src/ import closure instead reaches 4,076, no narrower than the
    full run, because src/lib/daemon.ts and src/lib/config.ts name deploy/ files.
    W1-T12536 closes the residual gap: it records child processes' reads into the parent suite's record.
    CHECKED for overlap on origin/main plan/tasks.d and open pull request heads: W1-T10435 (queued) is a parked research
    report on platform-aware shadows; W1-T11916 (queued) adds run-time tree walkers to the narrow arm. Neither produces or
    reads a read map. No open pull request files a task on this subject.
  design: |
    1. MOVED to W1-T13164 on 2026-11-19 (see the note): add scripts/build-read-map.mjs: read the record directory with `readReadRecords`, build with `buildReadMap(records, { sha })`,
       write the map. It exits non-zero when any record problem is found, so no partial map is written.
    2. MOVED to W1-T13164 (see AMENDED below): the two coverage-nightly.yml jobs that record each suite's reads, run
       step 1's script and upload the `read-map` artifact.
    3. In scripts/preflight-author.mjs, only when a changed path is a read-mapped path (`isReadMappedPath`), fetch the
       newest `read-map` artifact of a successful coverage-nightly run on main (the `gh run list` and `gh run download`
       calls ci.yml:1838-1844 makes, issued through the transport seam of step 10) into a cache under the author's tmp dir, bounded to 60 s in all. Pass
       `readReadMapInput(root, mapPath, base)` into `readAffectedSuitesInput`'s `extra` as `readMap`; a fetch failure
       is a `mapProblem`. Add `readMap` to that `extra` type in src/lib/affected-suites.ts. The receipt carries
       `readMapSha` when the map spoke, and `readMapFallback` when it did not.
    4. PER-PATH, in src/lib/affected-suites.ts. `readMapProblem` keeps its whole-map refusals (missing, malformed, not an
       ancestor, past the staleness bound) and no longer refuses the whole map because some suite has unknown descriptor
       coverage. A new `readMapPathProblem(map, path)` refuses one changed path: a root-level path, or one with a
       dot-directory segment, while any suite has unknown coverage (a child tool reads such files, such as package.json,
       without naming them). `fullRunTrigger` takes a per-path test. For each other changed read-mapped path the
       selector picks, beside the observed readers and listers and the existing absent, changed-since-map and spawner
       rules, every suite with unknown coverage (on the map's `unknownDescriptorSuites`, or a spawner) whose text, or the
       text of a test/ file it imports, names the path, its file name, or a directory above it (as `dir/` or as a quoted
       segment).
    5. Update the doctrine sentence that says configuration and fixture changes fall back to every suite, for deploy/ and json.
    6. test/read-map-descriptors-are-lifecycle-bound.test.ts and test/read-map-unobserved-descendants.test.ts assert the
       whole-map refusal by `readMapProblem`; they assert the per-path refusal instead. Their record and hook assertions
       do not change.
    7. MOVED to W1-T13164 on 2026-11-19 with step 1: scripts/build-read-map.mjs is a script a workflow runs, so test/instrument-surface-completeness.test.ts asks for
       it in src/lib/review.ts. It goes in INSTRUMENT_SURFACE_EXCLUSIONS with its reason (no CI gate reads the read map),
       with no new comment lines (review.ts has a comment cap).
    8. The author preflight fetches the map only when a changed read-mapped path is nested and has no dot-directory
       segment: the nightly map always holds unknown suites, so it can never narrow a root-level or dot-directory path.
    9. (AMENDED 2026-11-19) THE MAP SPEAKS ONLY WHERE TODAY RUNS EVERYTHING. The map, and step 4's naming rule, apply
       only to a changed path that `fullRunTrigger(changed, false)` names, that is one that forces a full run without
       a map (deploy/ files, and json outside the modelled trees). Any other changed path, a json file under src/,
       scripts/ or test/ among them, keeps today's selection untouched. The weaker remedy, skipping the directory
       forms `src/`, `scripts/` and `test/` in the naming rule, is not enough on its own unless the replay of
       criterion 8 still selects no more than today's floor.
    10. (AMENDED 2026-11-19) THE FETCH GOES THROUGH THE TRANSPORT. The default fetch of step 3 is a generic
       `fetchNightlyArtifact({ root, artifact, file, spawn, cacheDir })` whose run listing and artifact download go
       through `ghExec` in src/lib/github-transport.ts (the module that owns every `gh` spawn, and routes a read
       through a live broker), never a `gh` spawn or `gh` argv literal of its own in scripts/preflight-author.mjs.
       Find the seam with `git grep -n "ghJsonAsync\|rmd gh" -- src scripts` and `git grep -n "export function ghExec"`.
    11. (AMENDED 2026-11-19) NO TEST SPAWNS gh. The default fetch is off under the test runner (`process.env.NODE_TEST_CONTEXT`
       set) and reports a `mapProblem` naming that; a suite that wants a fetch injects one. So the existing suites
       that run the author `main` or `authorSelection` on fixtures that change a nested json or deploy/ path
       (test/author-low-footprint.test.ts, test/author-low-footprint-native.test.ts,
       test/a-moved-test-keeps-its-tier-and-flake-history.test.ts,
       test/infra/the-author-disk-reserve-is-sized-to-its-workload.test.ts) neither change nor reach GitHub.
    INVARIANT read-map-never-widens-past-the-floor: the read map never selects more suites than today's floor for a
    path that does not force a full run.
    INVARIANT read-map-only-narrows-the-author: the read map changes only the author preflight's selection; ci.yml's
    selection and every required check run as before.
    INVARIANT no-narrowing-past-unknown-reader: a suite whose reads are unknown and that names the changed path, its file
    name or a directory above it, itself or through a test/ file it imports, is never left out of that path's selection.
    NOT IN SCOPE: test/helpers, .remudero and hooks paths (a separate task); the impact arm; any change to CI's selection;
    recording child processes' reads (W1-T12536).
    AMENDED 2026-11-16 (operator session): step 2 (the `read-map-shards` and `read-map` jobs in coverage-nightly.yml),
    the workflow half of criterion 1 and the falsifier sentence about the nightly job moved to W1-T13164, and
    `.github/workflows/coverage-nightly.yml` left `files:`. Why: the daemon never dispatches a task whose `files:`
    names a path under .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a
    workflow file), so this whole task waited for an operator build that nothing announced. An operator session
    hand-builds W1-T13164, which depends on this task because its job runs step 1's script.
    WHAT STAYS HERE: steps 1 and 3 to 8 and criteria 2 to 6, unchanged, and criterion 1 cut down to what step 1 already
    promises for scripts/build-read-map.mjs. The script stays on this side because it needs no workflow to be built
    or tested: it calls `readReadRecords` and `buildReadMap`, both on main, over a directory of records a test can
    write. Step 7's exclusion stays with it: the completeness check only looks up paths a workflow or package.json
    already names (`findUnexplainedGaps`, scripts/lib/instrument-surface-census.mjs), so the entry is inert until
    W1-T13164 lands and then already present, which leaves that diff a workflow and its test.
    WHAT THIS TASK DELIVERS ALONE: until a nightly run has uploaded a `read-map` artifact, the fetch of step 3 finds
    none, which is criterion 4's named `mapProblem` and today's selection. The narrowing of criterion 3 reaches a
    real author run only after W1-T13164 is merged and one nightly run has succeeded.
    READ at origin/main ef8b74910f, so neither half is done: scripts/build-read-map.mjs does not exist;
    `git grep -n -e 'read-map'` finds no line in .github/workflows/coverage-nightly.yml, whose jobs are `shards`,
    `merge` and `notify`; and `readReadMapInput` appears under src/, scripts/ and bin/ only where it is declared
    (src/lib/affected-suites.ts:214 `export function readReadMapInput(`).
  falsifier: |
    Drop the `readMap` argument and criterion 3 must fail. Drop the unknown-coverage naming rule and criterion 6 must fail.
    Let a root-level json path narrow past an unknown suite and criterion 4 must fail. Let scripts/build-read-map.mjs
    write a map when a record is not a read record and criterion 1 must fail. Restore and require all six to pass.
    (Criterion 1 and its falsifier sentence moved to W1-T13164 on 2026-11-19; criteria 2 to 9 stay here.)
    AMENDED 2026-11-19: let the naming rule speak for a path that does not force a full run, and criteria 7 and 8
    must fail (the replay of #19578, scripts/test-tier-manifest.json, selects 1,841 suites where today selects 279).
    Turn the default fetch on under the test runner, or spawn `gh` from scripts/preflight-author.mjs in place of the
    transport, and criterion 9 must fail. Restore and require criteria 2 to 9 to pass.
  note: |
    AMENDED 2026-11-19 (operator: paused until a nightly read map exists). Operator ruling, 2026-11-19: "Pause the
    chain, amend the records". The hand build of this task (kept local and unpushed, a4cddf305c) found four things:
    1. NO MAP EXISTS YET. No nightly run uploads a `read-map` artifact; W1-T13164 (queued, an operator build because
       it edits .github/workflows/coverage-nightly.yml) is the task that produces it. Until it has merged and one
       nightly run has succeeded, everything this task builds can only fall back. Added `depends_on: W1-T13164`, so
       this task (and W1-T12508, which depends on it) does not dispatch before a map exists. W1-T12507 and W1-T12536
       also depend on this task, so they pause with it.
       THE MAP BUILDER MOVES TO THE MAP PRODUCER (operator, 2026-11-19). W1-T13164 depended on this task because its
       job runs scripts/build-read-map.mjs, so the new dependency made the two wait on each other. To break the cycle,
       design step 1 (scripts/build-read-map.mjs), step 7 (its INSTRUMENT_SURFACE_EXCLUSIONS entry in
       src/lib/review.ts), criterion 1 and its falsifier sentence moved to W1-T13164, whose proof now names its own
       suite; both files left this task's `files:`, and W1-T13164 no longer depends on this task. The AMENDED
       2026-11-16 paragraph of the design, which kept the script here, is superseded on that point.
    2. THE NAMING RULE WIDENED A COMMON CASE. MEASURED with the half-built selector and a nightly-shaped map in which
       every suite has unknown reads (the worst case): #19578, the daily scripts/test-tier-manifest.json pull request
       (cb13ffce5d), went from 279 selected suites to 1,841, because a json path under scripts/ is read-mapped but
       does not force a full run today, and the naming rule (the path, its file name, or a directory above it such
       as `scripts/`) added 1,562 unknown-coverage suites (279 + 1,562 = 1,841). The same
       map narrowed the two deploy/ diffs it was built for: #19506 (5fc91ae0e0) from the full 5,013 to 2,990, and
       #19168 (e746d8ffa6) from 5,013 to 4,582. Added design step 9, criteria 7 and 8 and the falsifier lines;
       criterion 6 now names the paths step 9 leaves to the map.
    3. THE WIRED FETCH WOULD SPAWN THE REAL gh IN TESTS. Existing suites run the author `main` or `authorSelection`
       without injecting a fetch on fixtures that change a nested json or deploy/ path (the four step 11 names).
       Added design step 11 and criterion 9.
    4. THE AUTHOR-SIDE FETCH WAS REFUSED BY THE DENY-FLOOR HOOK. The build's edit to scripts/preflight-author.mjs
       held `gh` `run list` and `run download` strings, and the hook read the code as a GitHub call. So the fetch is
       not written in the half-build (its suite names `fetchNightlyArtifact`; the script does not define it). The
       builder routes the fetch through the existing transport (`ghExec` in src/lib/github-transport.ts, the broker
       path) rather than a raw `gh` spawn, which also satisfies the hook: design step 10.
