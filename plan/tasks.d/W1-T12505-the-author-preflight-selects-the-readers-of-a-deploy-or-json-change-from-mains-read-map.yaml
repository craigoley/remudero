  acceptance:
    - claim: "When a changed path is a read-mapped path, scripts/preflight-author.mjs reads the newest `read-map` artifact of a successful coverage-nightly run on main into a cache file, within a bounded time, and passes `readReadMapInput(root, mapPath, base)` to the selector as `readMap`. This is the first production caller of `readReadMapInput`"
      proof: "grep: W1-T12505 criterion 2 in test/ci/the-author-preflight-selects-the-readers-of-a-deploy-or-json-change-from-mains-read-map.test.ts"
    - claim: "With a map in which suites have unknown descriptor coverage (the corpus today: a suite that starts a child process is unknown), a change to deploy/recycle-container.sh selects the suites the map records as its readers, the unknown-coverage suites that name the path, its file name or a directory above it, plus the changed tests and the modelled rest. The receipt selection is not `full-fallback` and names the map's sha"
      proof: "grep: W1-T12505 criterion 3 in test/ci/the-author-preflight-selects-the-readers-of-a-deploy-or-json-change-from-mains-read-map.test.ts"
    - claim: "A map that is missing, cannot be fetched, is not an ancestor of the base, or is past IMPACT_MAP_STALENESS_BOUND gives the selection of today, and the receipt names the reason from `readMapProblem`. A changed root-level or dot-directory path, while any suite has unknown coverage, forces a full run, and the reason from `readMapPathProblem` names the path"
