  rationale: |
    The author preflight runs every suite for a change to a deploy/ file or a json file, because no read map is ever passed to it.
    READ at origin/main 6cf453f7a:
    - src/lib/affected-suites.ts:112-119 `fullRunTrigger`: a deploy/ or json path (READ_MAPPED, :108) forces a full run unless
      `readMapUsable` is true. `selectAffectedSuites` (:445-455) sets it from `readMapProblem(input.readMap)`, which answers
      "no read map supplied" when `readMap` is absent (:216).
    - `readAffectedSuitesInput` (:843) never sets `readMap`, and `authorSelection` (scripts/preflight-author.mjs:326) calls
      only that reader. `readReadMapInput` (:207), `readReadMap` (:190), `readReadRecords` (:175) and `buildReadMap` (:152)
      (W1-T6084) have no caller under src/, scripts/ or bin/.
    - No workflow produces a map. test/setup/read-map.ts records each suite's non-code reads when RMD_READ_MAP_DIR is set;
      scripts/read-map-corpus.mjs is an operator-only collector that by design "never emits a consumption-ready read map".
    - coverage-nightly.yml:206-222 already builds and uploads the `test-impact-map` artifact (W1-T6107), and ci.yml:1829-1850
      fetches it with `gh run download` for the shadow selector. The read map can use the same path.
    MEASURED by the operator session over about four days: 22 author runs fell back to the full suite; 15 of them named a
    deploy/ path with "no read map supplied". The Azure ship lane's own preflight logs on 2026-11-13 hold 11 such lines
    (deploy/recycle-container.sh 7, deploy/rmd-host-cleanup.sh 2, deploy/install-host-units.sh 1, deploy/host-recycle-lock.sh 1).
    W1-T9953 cuts a full fallback to a partial set, but that set follows only the import graph, so a shell script or a json
    file has no readers in it.
    AMENDED 2026-11-13 (the hand build found this before it wrote code): `readMapProblem` (:219) refuses the WHOLE map when
    any suite has unknown descriptor coverage, and test/setup/read-map.ts marks a suite unknown, for good, on any
    exec/execFile/spawn/fork call. MEASURED at ecd94c0da: a static grep finds at least 2,376 of 4,628 suites that spawn,
    directly or through a helper, and 64 of the 74 suites that name deploy/recycle-container.sh spawn it. Two deploy readers
    run through the real preload (test/git-author-commissioning.test.ts, which read 33 deploy/ files, and
    test/repositories-from-the-read-model.test.ts, which spawns nothing itself) both wrote `unknownDescriptors: true`.
    So a map built from a full run is always refused, and the first design would only change the fallback's reason.
    The operator session chose per-path narrowing: the unknown suites that may read the changed path are selected, and
    the map speaks for the rest. MEASURED on the real tree with every suite unknown: the naming rule of design step 4
    selects 642 of 4,629 suites for deploy/recycle-container.sh (236 name the path or deploy/; the file name and the
    quoted "deploy" segment add the rest). Walking the src/ import closure instead reaches 4,076, no narrower than the
    full run, because src/lib/daemon.ts and src/lib/config.ts name deploy/ files.
    W1-T12523 closes the residual gap: it records child processes' reads into the parent suite's record.
    CHECKED for overlap on origin/main plan/tasks.d and open pull request heads: W1-T10435 (queued) is a parked research
    report on platform-aware shadows; W1-T11916 (queued) adds run-time tree walkers to the narrow arm. Neither produces or
    reads a read map. No open pull request files a task on this subject.
  design: |
    1. Add scripts/build-read-map.mjs: read the record directory with `readReadRecords`, build with `buildReadMap(records, { sha })`,
       write the map. It exits non-zero when any record problem is found, so no partial map is written.
    2. In coverage-nightly.yml, after the merge job: a `read-map-shards` job runs ci.yml's eight shards (`--select-all
       --shard n/8`) without coverage, with RMD_READ_MAP_DIR and RMD_READ_MAP_ROOT set (the existing hook,
       test/setup/read-map.ts, loaded by test/setup/tmp-hygiene.ts). A shard whose suite exits non-zero uploads no
       records, so its suites are absent from the map and the selector picks them for every read-mapped change. A
       `read-map` job downloads the records, builds the map within a 5-minute bound and uploads `read-map` (retention 14
       days, if-no-files-found: ignore). Both jobs are continue-on-error; a failed or late build is reported in the step
       summary. The `shards`, `merge` and `notify` jobs do not change.
    3. In scripts/preflight-author.mjs, only when a changed path is a read-mapped path (`isReadMappedPath`), fetch the
       newest `read-map` artifact of a successful coverage-nightly run on main (the `gh run list` and `gh run download`
       calls ci.yml:1838-1844 makes) into a cache under the author's tmp dir, bounded to 60 s in all. Pass
       `readReadMapInput(root, mapPath, base)` into `readAffectedSuitesInput`'s `extra` as `readMap`; a fetch failure
       is a `mapProblem`. Add `readMap` to that `extra` type in src/lib/affected-suites.ts. The receipt carries
       `readMapSha` when the map spoke, and `readMapFallback` when it did not.
    4. PER-PATH, in src/lib/affected-suites.ts. `readMapProblem` keeps its whole-map refusals (missing, malformed, not an
       ancestor, past the staleness bound) and no longer refuses the whole map because some suite has unknown descriptor
       coverage. A new `readMapPathProblem(map, path)` refuses one changed path: a root-level path, or one with a
       dot-directory segment, while any suite has unknown coverage (a child tool reads such files, such as package.json,
       without naming them). `fullRunTrigger` takes a per-path test. For each other changed read-mapped path the
       selector picks, beside the observed readers and listers and the existing absent, changed-since-map and spawner
       rules, every suite with unknown coverage (on the map's `unknownDescriptorSuites`, or a spawner) whose text, or the
       text of a test/ file it imports, names the path, its file name, or a directory above it (as `dir/` or as a quoted
       segment).
    5. Update the doctrine sentence that says configuration and fixture changes fall back to every suite, for deploy/ and json.
    6. test/read-map-descriptors-are-lifecycle-bound.test.ts and test/read-map-unobserved-descendants.test.ts assert the
       whole-map refusal by `readMapProblem`; they assert the per-path refusal instead. Their record and hook assertions
       do not change.
    7. scripts/build-read-map.mjs is a script a workflow runs, so test/instrument-surface-completeness.test.ts asks for
       it in src/lib/review.ts. It goes in INSTRUMENT_SURFACE_EXCLUSIONS with its reason (no CI gate reads the read map),
       with no new comment lines (review.ts has a comment cap).
    8. The author preflight fetches the map only when a changed read-mapped path is nested and has no dot-directory
       segment: the nightly map always holds unknown suites, so it can never narrow a root-level or dot-directory path.
    INVARIANT read-map-only-narrows-the-author: the read map changes only the author preflight's selection; ci.yml's
    selection and every required check run as before.
    INVARIANT no-narrowing-past-unknown-reader: a suite whose reads are unknown and that names the changed path, its file
    name or a directory above it, itself or through a test/ file it imports, is never left out of that path's selection.
    NOT IN SCOPE: test/helpers, .remudero and hooks paths (a separate task); the impact arm; any change to CI's selection;
    recording child processes' reads (W1-T12523).
  falsifier: |
    Drop the `readMap` argument and criterion 3 must fail. Drop the unknown-coverage naming rule and criterion 6 must fail.
    Let a root-level json path narrow past an unknown suite and criterion 4 must fail. Fail the nightly job on a build
    error and criterion 1 must fail. Restore and require all six to pass.
