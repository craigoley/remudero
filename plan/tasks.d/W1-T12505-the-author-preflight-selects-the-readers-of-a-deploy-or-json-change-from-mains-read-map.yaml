      proof: "grep: W1-T12505 criterion 5 in test/ci/the-author-preflight-selects-the-readers-of-a-deploy-or-json-change-from-mains-read-map.test.ts"
    - claim: "invariant:no-narrowing-past-unknown-reader — a suite with unknown descriptor coverage that names a changed read-mapped path, its file name or a directory above it, itself or through a test/ file it imports, is always selected, for each changed read-mapped path that forces a full run without a map"
      proof: "grep: W1-T12505 criterion 6 in test/ci/the-author-preflight-selects-the-readers-of-a-deploy-or-json-change-from-mains-read-map.test.ts"
    - claim: "invariant:read-map-never-widens-past-the-floor — the read map never selects more suites than today's floor for a path that does not force a full run: the map and its unknown-suite naming rule speak only for a changed path that forces a full run without a map, and every other path keeps today's selection"
