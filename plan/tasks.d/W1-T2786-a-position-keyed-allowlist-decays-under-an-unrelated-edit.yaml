  rationale: |
    THE KEY DECAYS; NOTHING FAILS. `hooks/mkdtemp-allowlist.txt` records each exemption as
    `<file>:<line>`. Insert one line anywhere above an allowlisted callsite and the entry no
    longer names it, so a callsite that has been exempt for months is refused as though it were
    new. MEASURED 2026-09-03: #3834 (merged 17:45:32Z) and #3831 (17:55:13Z) each inserted a line
    above an allowlisted site and three entries drifted by exactly one —
    `test/open-prs-rest.test.ts` allowlisted :443 / actual :444, `test/retro.test.ts` :453/:454
    and :491/:492. None of those callsites is new; they date from #808, #1398 and #1412. The hook
    did not fail and nothing bypassed it.

    WHY THIS IS URGENT RATHER THAN TIDY. The refusal lands on whatever PR shifted the line, so it
    blocks an author who has nothing to do with temp directories and no reason to recognise the
    failure — it surfaces as the opaque `W1-T2773 programmatic and CLI boundaries preserve the
    scanner's success and failure contracts`. And repairing the drifted entries fixes only those
    entries: the remaining 995 stay armed, each one a latent red waiting for the next edit above it.

    REPRODUCED ON A GREEN MAIN, INDEPENDENT OF TODAY'S DRIFT. At `1d71fb15` the checker reads
    `clean — 646 tracked .ts/.mjs file(s) with a mkdtempSync callsite, 998 allowlisted`. Inserting
    ONE unrelated comment line at the top of a file carrying an allowlisted callsite immediately
    produced `(1 refused; 998 on hooks/mkdtemp-allowlist.txt)` naming
    `test/a-permanently-uncreditable-head-is-re-dispatched-forever.test.ts:47: mkdtemp prefix
    'terminal-head-gh-'`; reverting the insertion returned the checker to clean. The defect is the
    KEY, not any particular day's drift.

    WHETHER MAIN IS GREEN IS AN OBSERVATION, NOT A DESIGN INPUT. Today's three drifted entries were
    already cleared by the time this task was scoped. Building toward "make main green" would shape
    the fix around one day's drift instead of the keying defect, so this shard is written against
    the defect and any effect on main's colour is reported afterward as a measurement.
  design: |
    RE-KEY ON `<file>` + `<prefix>`, DROPPING THE LINE ENTIRELY. Sites in one file sharing a prefix
    collapse to a single entry — desirable, not a loss: they would want allowlisting together
    anyway, and a collapsed entry cannot half-decay.

    THE PREFIX MUST BE READ FROM THE ACTUAL CALLSITE, NEVER INFERRED FROM THE ENTRY TEXT. Inferring
    it would encode the same staleness in a new shape. And a subtler version of the same trap:
    resolving `<file>:<line>` against the current tree to find the prefix reads the WRONG LINE for
    exactly those entries that have already drifted, then makes that wrong prefix permanent and
    invisible under the new key. So the migration derives from OBSERVATION — run the scanner with
    the allowlist empty and take its own refusal set (file, prefix) as the generated entries. That
    is self-correcting for every hypothesis about today's state: new drift, entries left dangling
    by a callsite that has since been migrated to `${RMD_TMP_PREFIX}`, or an incomplete prior
    repair all resolve the same way, with no need to pick between them in advance.

    ONE PREFIX EXTRACTOR, SHARED. The key computation and `formatRefusal`'s display must read the
    prefix through the SAME function. Two extractors over the same input is the drift class this
    task exists to remove, reintroduced one layer down (the same reason W1-T2784 extracted
    `hashInstallInputs` rather than copying it).

    VARIABLE-PREFIX CALLSITES NEED A DEFINED KEY TOO. A callsite classified `unresolvable` (a
    variable, a call, a spread) has no static prefix — `scripts/recovery-drill.mjs` is the live
    example. Those key on the file plus an explicit sentinel rather than being dropped from the
    scheme, so every refusable classification remains expressible and the checker never silently
    loses the ability to exempt one.

    THE FILE HALF OF THE KEY STILL CARRIES MEANING. Dropping the line must not accidentally drop
    the file: an allowlisted prefix appearing in a DIFFERENT file must still refuse, or the
    allowlist would become a global prefix amnesty.

    THE NEW PROOFS GO IN A NEW FILE, `test/mkdtemp-allowlist-rekey.test.ts`, AND THAT IS A
    DISCRIMINATION DECISION RATHER THAN AN ORGANISATIONAL ONE. W1-T362 extended `executed_stale` to
    `unit test:` proofs, so a proof reading the same at head and at base substantiates nothing.
    Pointing these six at the EXISTING `test/mkdtemp-callsite-check.test.ts` would have graded
    exactly that way: MEASURED 2026-09-03, a pristine `origin/main` worktree at `9e2f5e90` runs
    `node scripts/mkdtemp-callsite-check.mjs` CLEAN (`648 tracked .ts/.mjs file(s) …, 998
    allowlisted`, exit 0) now that #3840 has merged, so that suite passes at base and would pass
    identically at head. A path that does not exist at base CANNOT pass at base, so the new file
    discriminates BY CONSTRUCTION instead of by the current colour of main — which is another
    lane's merge to move, exactly the dependency this shard's rationale refuses elsewhere.

    `test/mkdtemp-callsite-check.test.ts` STAYS IN `files:` because the re-key genuinely breaks it:
    its `W1-T2773 main: an allowlisted <file>:<line> bypasses the rule (the migration parking
    mechanism)` case asserts the OLD key format directly, seeding a fixture allowlist with
    `test/bare.test.ts:2`. That test must be rewritten to the new key. No criterion cites it — it
    is declared because it is edited, not because it proves anything here.
  acceptance:
    - claim: "an unrelated line insertion above an allowlisted callsite does not refuse — the regression that exists today under `<file>:<line>` keying is gone"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
    - claim: "a genuinely new bare-prefix callsite is still refused, so the re-keying did not make the rule soft"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
    - claim: "an allowlisted prefix appearing in a DIFFERENT file is still refused — the file half of the key keeps its meaning"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
    - claim: "a callsite whose prefix cannot be statically resolved keys on the file plus an explicit sentinel and remains exemptible, rather than being dropped from the scheme"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
    - claim: "the key computation and the refusal message read the prefix through one shared extractor, so the two cannot drift apart"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
    - claim: "the migrated allowlist leaves the checker clean on an unmodified tree, and every generated entry names a prefix that actually occurs in the file it names"
      proof: "unit test: test/mkdtemp-allowlist-rekey.test.ts"
