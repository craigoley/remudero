    THE GENERAL RULE IS RECORDED IN `learnings/` AS PART OF THE IMPLEMENTATION PR, earned by this
    fix rather than asserted: an assertion anchored to POSITION, or validated against a
    HAND-MAINTAINED SIDE TABLE, decays silently under a legitimate edit that had no way to know —
    anchor on content, or derive from observation. Six instances measured in one session, and the
    sixth is the sharpest because it caught the author inside the fix that records the rule:
