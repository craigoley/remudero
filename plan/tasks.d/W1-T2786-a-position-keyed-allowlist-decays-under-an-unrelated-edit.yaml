    THIS FILING CARRIES NO `Remudero-Task:` TRAILER, DELIBERATELY, and its branch is `plan/…`
    rather than `run-W1-T2786-<digits>`. A trailer on a filing would credit the task through the
    authoritative path, so W1-T2786 would read as SHIPPED before any code exists — CLAUDE.md names
    the weaker form of this ("unioning COMMIT SUBJECTS over-credits: `chore(plan): file W1-T411`
    names a task the filing never implemented"), and a trailer turns that known subject-scan
    artifact into an authoritative false credit. The branch name matters for the SAME reason and is
    the half that is easy to miss: `findMergedByHeadBranch` credits a merge purely from a
    `run-<taskId>-<digits>` head, with no trailer involved, so a run-shaped filing branch
    over-credits through the other door. #3833 (`plan/file-w1-t2755-isolation-reason`) is the model
    this follows.

