- id: W1-T3017
  title: "THE LOCAL GATE FETCHES THE BASE IT THEN DIFFS AGAINST BY NAME — `refreshOriginMain` moves `origin/main` and every one of six diff sites re-reads that same moving ref, so a concurrent fetch by any other worktree sharing the clone silently changes what counts as an added line MID-RUN, and the run's own verdict stamp records a `behind` count but never the base sha it measured against"
