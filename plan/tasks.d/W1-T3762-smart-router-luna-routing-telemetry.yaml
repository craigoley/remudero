- id: W1-T3762
  title: "Make eligible balanced Codex routing Luna-first and expose assignment-to-receipt telemetry, so subscription capacity and fallback outcomes can be measured rather than guessed"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high
  band_meaning: blast-radius
  origin: human
  plan_refs: ["operator direction 2026-09-18: Smart Router Optimization"]
  files:
    - .remudero/mounts.yaml
    - src/lib/analytics-route.ts
    - src/run-task.ts
    - test/analytics-route.test.ts
    - test/mounts-wiring.test.ts
    - docs/model-routing.md
    - docs/README.md
    - docs/docs-index.json
    - plan/tasks.d/W1-T3762-smart-router-luna-routing-telemetry.yaml
  status: queued
  attempts: 0
  rationale: |
    OBSERVED in the read-only, rotation-safe production-ledger census (2026-09-18): 326 retained
    `worker.assignment` records from 2026-09-11 through 2026-09-17 selected Claude 208 times and
    Codex 118 times; Codex selected GPT-5.5 80 times, Terra 28, Luna 9, and Spark 1. The same
    census found 229 terminal `verdict` rows, but none carried `selection_assignment_id`. The
    analytics route therefore could not join a routing choice to its final worker outcome, tokens,
    latency, cost, or fallback evidence.

    The user directs Luna-first use for Codex subscription work and commodity work off subscription.
    The committed cash ladder already owns task-shape and per-request-cost choices; changing it
    without a fresh, comparable measurement would reverse an existing measured ordering. This
    task therefore changes only eligible Codex balanced ordering, retains Terra as immediate
    fallback, retains Sol for frontier work, and makes the outcome measurable before a broader
    reallocation is proposed.
  design: |
    (i) `capabilities.codex.balanced` is Luna-first for every effort, then Terra. Frontier stays
    Sol-first. The policy lives in the committed mount table, not an unreviewed runtime toggle.

    (ii) Every terminal `verdict` with a worker result logs that result's
    `selection_assignment_id`, token envelope, measured duration when available, reported cost,
    and worker-level success. `routingTelemetry` is then a bounded `routing-v1` aggregate in the
    existing analytics scan. It joins assignment to terminal evidence by ID; it sends aggregates,
    never raw prompts, account labels, capacity snapshots or ledger excerpts.

    (iii) An unjoined assignment and an unjoined terminal receipt are separately counted. No
    branch turns either into a success, a provider receipt, or a zero-cost observation.

    (iv) Monthly-dollar savings stay unmeasured until a production ledger baseline exists. The
    route supplies the comparable inputs — task type, model, outcome, tokens and duration — and
    cash cost where the provider reports it.
  acceptance:
    - claim: "a terminal worker receipt joins its immutable pre-execution routing assignment and preserves success, token, duration and cost evidence"
      proof: "grep: W1-T3762 criterion 1 in test/analytics-route.test.ts"
    - claim: "incomplete assignment and terminal evidence remains explicit rather than being converted into fabricated operational figures"
      proof: "grep: W1-T3762 criterion 2 in test/analytics-route.test.ts"
    - claim: "the operator policy and rollback criteria are documented beside the mount table"
      proof: "grep: W1-T3762 criterion 3 in test/mounts-wiring.test.ts"
  falsifier: |
    Restore a direct terminal-only aggregation and the first criterion loses its selected policy
    provider/model evidence. Treat an unmatched terminal as a completed call and the second
    criterion fails because the counts no longer distinguish missing evidence. Put Terra back
    first and the documented Luna-first policy no longer matches the committed source of truth.
