- id: W1-T11774
  title: "THE PROGRESS WATCHDOG GETS A NARROWED READ-ONLY HOST CREDENTIAL — W1-T9669 hands GH_APP_ID, GH_APP_INSTALLATION_ID and the host key path only to host_alert's child. read_progress_verdict starts `rmd progress-watchdog` with RMD_SELF_SYNC_DONE and RMD_REVIVAL_LOG and no GitHub variable, so W1-T11750's live inventory can never authenticate on the real host"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern (delivering a read-only host credential to the watchdog launcher)
  band_meaning: span
  origin: architect
  plan_refs: [W1-T11750, W1-T9669, W1-T9625, W1-T6361, W1-T9800, W1-T5688]
  files:
    - deploy/install-host-units.sh
    - src/lib/launcher-host-alerts.ts
    - test/the-launcher-host-alert-carries-the-app-credential.test.ts
    - test/deploy/the-progress-watchdog-reads-github-with-the-host-read-credential.test.ts
  status: queued
  priority: 2
  attempts: 0
  acceptance:
    - claim: "the rendered read_progress_verdict hands rmd progress-watchdog the same App id, installation id and host key path host_alert gets, through one shared launcher helper, and the container's own key path is unchanged"
      proof: "unit test: test/deploy/the-progress-watchdog-reads-github-with-the-host-read-credential.test.ts"
    - claim: "host_alert still receives exactly the W1-T9669 environment after the helper is shared"
      proof: "unit test: W1-T9669: an explicit host key path is what host_alert passes"
      kind: guard
    - claim: "both launcher children build their credential argv from one named helper"
      proof: "grep: host_github_cred_args in deploy/install-host-units.sh"
  rationale: |
    ORIGIN: the operator's 2026-11-08 follow-up from the PR #17211 recovery and run W1-T11750, item (1).
    PR #17416 (https://github.com/craigoley/remudero/pull/17416, head run-W1-T11750-1794159061177) implements
    W1-T11750. W1-T11750's design step 4 said: "The builder confirms from the host unit (W1-T9669) that one is
    present; if none is, stop and report." The source shows none is present, and the run changed code anyway.
    READ in this worktree (symbols, not lines):
    - deploy/install-host-units.sh read_progress_verdict runs
      `RMD_SELF_SYNC_DONE=1 RMD_REVIVAL_LOG="$REVIVAL_LOG" timeout 120 "$rmd" progress-watchdog --json --state-root ...`.
      It builds no `cred` array. host_alert (render_host_alerts) builds one from HOST_ALERT_GH_APP_ID,
      HOST_ALERT_GH_APP_INSTALLATION_ID and HOST_ALERT_GH_APP_PRIVATE_KEY_PATH (host_alert_key_path), and only
      host_alert passes it.
    - src/lib/launcher-host-alerts.ts hostGithubToken exchanges the configured App key for an installation token
      at /app/installations/<id>/access_tokens, else uses GH_TOKEN, else throws "no host credential". The exchange
      requests no `permissions` narrowing, so its token carries every permission the App holds. That is right for
      host-alert, which posts issues, and too much for a read.
    - The watchdog timer is OnBootSec=5min / OnUnitActiveSec=5min (render_watchdog_timer), and the verb runs under
      `timeout 120`. W1-T9800 kills a tick past its deadline. W1-T6361 skips node work when nothing changed.
    Settled by lookup: is this already filed or already decided? -> No. W1-T9669 (merged) covers host_alert only.
    W1-T11750 (queued, PR #17416 open) adds readLiveOpenPrInventory but names the credential as a prerequisite to
    confirm, not to deliver. No other shard names read_progress_verdict's environment (grep of plan/ for
    read_progress_verdict and HOST_ALERT_GH_APP).
    Settled by lookup: does an open PR already do this? -> No. Of the 12 open PRs on 2026-11-08, only #17416 touches
    the watchdog, and its body names src/run-task.ts, src/lib/progress-watchdog.ts and a test/daemon file, not
    deploy/install-host-units.sh (https://github.com/craigoley/remudero/pulls).
    Settled by lookup: can a token be limited to read without a new credential? -> Yes. The installation-token
    request accepts `permissions` and `repositories`, which can only narrow the installation's grant. The token
    expires after one hour (https://docs.github.com/en/rest/apps/apps#create-an-installation-access-token-for-an-app).
    So this reuses the host's existing App key through the existing exchange: no new App, key, PAT or stored token,
    and no write permission on the token.
    Settled by lookup: does the read cadence fit GitHub's limits? -> Yes. An installation gets at least 5,000
    requests per hour, and REST reads cost 1 secondary-limit point of 900 per minute
    (https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api). One exchange, ceil(open/100)
    list pages and one control read every 5 minutes is about 36 to 48 requests per hour.
    This task is an independent prerequisite. W1-T11750 must depend on it and use its narrowed token helper; the
    host credential path has to be proven before the live-inventory implementation can begin.
  design: |
    1. ONE LAUNCHER HELPER. In render_host_alerts' literal block, `host_github_cred_args` emits the
       `GH_APP_ID=... GH_APP_INSTALLATION_ID=... GH_APP_PRIVATE_KEY_PATH=...` words from the rendered HOST_ALERT_*
       values, skipping any that are empty, exactly as host_alert builds `cred` today. host_alert and
       read_progress_verdict both call it, and only their rmd children get the variables. The renderer must
       define the HOST_ALERT_* assignments and the helper before the first call to read_progress_verdict in the
       rendered script; the test proves the order. The launcher never reads, copies or checks the key.
    2. READ-NARROWED TOKEN. `hostGithubReadToken(repo)` in src/lib/launcher-host-alerts.ts reuses
       hostGithubToken's App exchange with the body `{"repositories":["<repo>"],"permissions":{"pull_requests":"read"}}`.
       If the exchange fails or the App variables are absent, it falls back to the host's GH_TOKEN only when one is
       set, as hostGithubToken does. The token lives in process memory and is never written or logged. Do not add
       watchdog consumption of this helper here; that belongs to dependent W1-T11750.
    3. TESTS. The new file renders the launcher with a fixture CLAUDE_DIR and runs read_progress_verdict against a
       stub rmd that prints its environment, asserting the three variables. Extend the existing W1-T9669 file with
       `test("W1-T11774 criterion 2 preserves host_alert's W1-T9669 environment", ...)`, proving the shared helper
       leaves host_alert's child environment byte-for-byte unchanged. The new file covers the narrowed exchange body
       and repository; missing credentials and exchange failures return no token and make no request; no secret is
       logged or returned.
    NOT IN SCOPE: minting or storing any new credential, any write call, changing host-alert's own token,
    modifying progress-watchdog verdicts or consuming the read token in the watchdog, W1-T11750's IDLE/STALLED
    decision rules, the timer cadence or the 120 s timeout.
  falsifier: |
    At origin/main, render the launcher and run read_progress_verdict against a stub rmd that prints GH_APP_ID: it
    prints nothing, so the first criterion fails. If the narrowed exchange still returns a token that can write
    pull requests or issues, the narrowing is wrong. If GitHub rejects `permissions` for this App, this task must
    be re-planned, not widened to the full token. W1-T11750 remains blocked until this task is merged.
