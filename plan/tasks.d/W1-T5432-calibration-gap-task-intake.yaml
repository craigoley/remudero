  design: |
    Add one typed, validated reader for the current instance's readiness gap sidecar and
    feed it into the EXISTING opportunity intake, with repository/instance, trial, gap
    identity, observed source anchor, freshness and availability. Preserve machine versus
    operator authority and dedupe against existing task, proposal, feedback and PR evidence.
    Do not create another timer, a new automatic permission or a competing triage lane.
    A source record or feedback PR is recorded/pending-triage, not a filed implementation
    task. Claim filed only with the resulting task ID and plan PR/source receipt; retain
    rejected, held, unavailable and already-covered outcomes explicitly. A failed or
    unavailable judgement leaves resumable evidence, not a new needs-human preference.
    Drive a positive gap through actual reader, candidate collection and existing governed
    task-producing triage seams in a disposable fixture. Prove resulting task identity and
    receipt, not merely a new feedback file. Restart and unavailable-source paths remain
    observable; no unknown evidence becomes empty. Do not consume another repository's gap
    under this instance's identity. Update the generated core CLI reference if its maintained
    command text changes. W1-T5433 separately owns atomic producer admission; this task owns
    the downstream delivery and truthful states. No paid activation, routing change, ordinary
    PR hold, public publication or new arbitrary data/sample ceiling belongs to this task.
  acceptance:
    - claim: "a sourced readiness gap reaches the existing task-producing intake with a resulting task receipt"
      proof: 'grep: calibration gaps reach governed task triage in test/benchmark-readiness-intake.test.ts'
    - claim: "recorded evidence and pending or failed triage never claim a filed task"
      proof: 'grep: calibration gap recording is not task filing in test/benchmark-readiness-intake.test.ts'
    - claim: "resumption reuses existing work and rejects foreign repository identity"
      proof: 'grep: calibration gap intake resumes without duplicate or foreign work in test/benchmark-readiness-intake.test.ts'
    - claim: "the production opportunity collector invokes the readiness source adapter"
