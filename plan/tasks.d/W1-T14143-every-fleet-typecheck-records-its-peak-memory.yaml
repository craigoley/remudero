- id: W1-T14143
  title: Every fleet typecheck writes one typecheck.peak ledger row naming its entry point, whether its buildinfo was usable at start, how many files it rechecked if tsc reports it, and its peak resident memory
  repo: remudero
  depends_on: []
  priority: 0.8
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high # a new ledger row on four typecheck spawn paths (Rule 19 sizing: span)
  band_meaning: span
  origin: operator-session#memory-thrash-2026-11-21
  plan_refs: [W1-T7392, W1-T9951]
  files:
    - src/lib/typecheck-buildinfo.ts
    - src/lib/typecheck-run.ts
    - src/lib/merge-probe.ts
    - src/lib/commit-message.ts
    - src/lib/worker-provider.ts
    - test/ci/gates/every-fleet-typecheck-records-its-peak-memory.test.ts
  status: merged
  attempts: 0
  rationale: |
    OBSERVED 2026-11-21 12:49Z on the Azure host (read-only): load 216/215/171, 43 tasks in D state, memory PSI some
    99.9% / full ~60%, 27 of 31 GiB used, 7 GiB swap, the daemon container at 22.2 of 25.5 GiB. The largest users were
    four concurrent `tsc -p tsconfig.json --noEmit --incremental` in worktrees/sweep-W*, RSS 3.6 + 3.2 + 2.7 + 1.6 =
    11.1 GiB, each about 25 min old.
    OBSERVED in code at dd829e355: every fleet typecheck entry point admits only a cold check, and a warm one spawns
    with no admission: src/lib/typecheck-run.ts runTypecheck (`if (cold) slot = acquireTestSlot(...)`),
    src/lib/worker-provider.ts (typecheck:bwrap, a slot only when the buildinfo is unusable), src/lib/merge-probe.ts
    (typecheck:merge-probe, the same), src/lib/commit-message.ts (typecheck:preflight, W1-T9951 admitStaticWork, only
    when cold). src/lib/typecheck-buildinfo.ts sets TYPECHECK_WARM_PEAK_BYTES = TYPECHECK_COLD_PEAK_BYTES / 2 =
    1.625 GiB from a 2026-10-20 measurement. W1-T7392 (merged) chose "a warm check runs exactly as today" on warm
    measurements of 1,345-1,377 MB; 3 of the 4 observed checks were above the warm estimate and two were at or above
    the cold estimate (3.25 GiB).
    INFERRED: the four were warm or warm-labelled checks, since a cold one would have taken a slot. NOT W1-T13901
    (heartbeat container CPU) or W1-T13902 (reviewer-regression blame clearing).
    This task measures first (healthy-condition-bound, replay-then-audit); W1-T14145 builds the admission on it.
  design: |
    One shared helper in src/lib/typecheck-buildinfo.ts that all four entry points call after tsc exits, writing one
    typecheck.peak row: entry, warm (buildinfo usable at start), rechecked file count when tsc reports it, and
    peak_rss_bytes. On Linux read the child's peak from /proc/<pid>/status VmHWM (poll while it runs and keep the
    last read), or the cgroup memory.peak where the check has its own cgroup. On darwin, unknown is acceptable. One
    test really spawns a short child and reads a non-zero peak (cover the real default), and one test covers each
    catch arm.

    INVARIANT no-false-zero: an unreadable peak is written as unknown, never 0, and a failed read never fails the check.
  acceptance:
    - claim: "Each of the four entry points writes typecheck.peak with entry, warm, and peak_rss_bytes after tsc exits"
      proof: "grep: W1-T14143 criterion 1 in test/ci/gates/every-fleet-typecheck-records-its-peak-memory.test.ts"
    - claim: "invariant:no-false-zero — an unreadable peak is written as unknown, never 0, and a failed read never fails the check"
      kind: guard
      proof: "grep: W1-T14143 criterion 2 in test/ci/gates/every-fleet-typecheck-records-its-peak-memory.test.ts"
    - claim: "typecheck-buildinfo writes the typecheck.peak row"
      proof: 'grep: "typecheck\.peak" in src/lib/typecheck-buildinfo.ts'
  falsifier: |
    Remove the helper call at any one entry point: that entry's test finds no typecheck.peak row and fails.
  note: |
    Validation after deploy: rmd ledger-grep typecheck.peak shows rows from all four entries within a day (at least
    one per entry), with the warm p50/p95 reported.
