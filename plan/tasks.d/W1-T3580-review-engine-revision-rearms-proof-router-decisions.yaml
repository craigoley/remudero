- id: W1-T3580
  title: "A REVIEW-ENGINE PROOF-ROUTER CHANGE MUST REARM A STALE SAME-HEAD DECISION — bump the semantic revision after W1-T3564 so an old capped console review cannot replay instead of executing newly routable proofs"
  repo: remudero
  depends_on: ["W1-T3564"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 45.00
  files: [src/lib/review.ts, test/review-engine-revision-rearm.test.ts]
  origin: "operator-session#console-pr-12-review-replay-2026-09-14"
  plan_refs: ["W1-T3564", "W1-T2872", "W1-T2722"]
  status: merged
  attempts: 0
  rationale: |
    Core PR #5542 / W1-T3564 added the private console's tests/ Vitest proof profile. In an
    isolated checkout at that merged commit, both CONSOLE-T2 acceptance titles parsed as Vitest
    proofs and passed against console PR #12's exact head. Yet the first normal re-review replayed
    its older capped terminal result without executing either proof. The decision cache is correctly
    keyed by REVIEW_ENGINE_REVISION, but W1-T3564 changed proof-execution semantics without advancing
    that revision, so the old v1 digest remained an exact cache hit.

    This is not a reason to disable replay or hash every core commit into a review identity: identical
    review inputs under an unchanged contract must still deduplicate. It is a material semantic-engine
    revision omission. The one-time body normalization that allowed PR #12 to re-review is a bridge,
    not the durable repair.
  design: |
    (i) Advance REVIEW_ENGINE_REVISION from its current v1 value to a deliberate v2 value that names
    the changed proof-routing contract. That revision is already included in both reviewInputDigest
    and reviewDecisionDigest, so a stale v1 terminal cannot suppress execution under v2.

    (ii) Extend the existing review-engine rearm coverage with the observed shape: seed a v1 terminal
    for a fixed console head and its two CONSOLE-T2 proof titles, then prove the v2 decision digest
    acquires a fresh owner and can execute rather than replaying the capped terminal. Also prove a
    second v2 request replays, so this does not turn ordinary repeated sweeps into duplicate reviews.

    (iii) Preserve the cache's material-input boundary: do not include boot SHA, arbitrary core commit
    SHA, provider/model sampling, schedule time, comments, labels, or unrelated operational churn in
    either digest. Do not change a console task contract, edit a PR body, weaken proof execution, or
    add a manual merge path.
  acceptance:
    - claim: "a terminal review cached under the former v1 engine revision cannot replay after the v2 proof-routing revision"
      proof: "unit test: W1-T3580 console proof router rearm"
    - claim: "an identical second review under the unchanged v2 engine revision still replays instead of spawning duplicate work"
      proof: "unit test: W1-T3580 v2 decision repeats replay"
    - claim: "the review engine advertises the v2 semantic revision that review input and decision identities consume"
      proof: "grep: REVIEW_ENGINE_REVISION = \"reviewer-scope-context-v2\" in src/lib/review.ts"
  falsifier: |
    Close without implementation if the current main already has a v2 REVIEW_ENGINE_REVISION, or if
    reviewDecisionDigest does not consume REVIEW_ENGINE_REVISION. At filing, src/lib/review.ts declares
    reviewer-scope-context-v1 and its digest includes that revision, while W1-T3564 changed the closed
    suite registry without advancing it.
  note: |
    This task repairs the shared reviewer contract used by the private site and console cells only.
    It does not schedule the public core repository, change domain routing, or create a browser-side
    credential path.
