  note: |
    THE SHARD ASKS NOTHING BECAUSE THE RANKING WAS DECIDED BEFORE FILING, AND THE DECISION WENT
    AGAINST THE BRIEF'S FRAMING. The brief asked whether the arm discards a computed distinction or
    never reaches it, and named those as different fixes. The measured answer is NEITHER: the arm
    reaches it and honours it. A shard that filed the question would have spent a dispatch
    discovering that, and an implementer who trusted the framing would have changed the arm.

    `test/review.test.ts` IS THE DECLARED TEST HOME DELIBERATELY, NOT BY DEFAULT. It is the only
    suite on main that imports `cappedAnnotation` and `floorDegradedAnnotation`, and a sweep for
    those names across `test/` returns exactly that one path. `planOnlySummary` is NOT in that
    list and NOT exported — see design (iv), which rules on what follows from that. A new test
    FILE would add a second concern tag to the sizing check while proving nothing the existing
    suite cannot, and the existing capped assertions this task must not delete already live
    there.

    `src/run-task.ts` IS DECLARED BECAUSE THE CALL SITE IS THERE and the annotation cannot receive
    a fact nobody passes it. DECISIONS.md's 2026-08-18 W1-T471 ruling governs that declaration and
    says a new shard should simply declare it. `src/lib/review.ts` holds `cappedAnnotation` itself.
    No other path is declared, and the shard's own path is absent.

    RISK IS `high` AND THE BAND IS RULE 19's SPAN, NOT BLAST RADIUS — RECORDED HERE BECAUSE THE TWO
    READ DIFFERENTLY. The change is one parameter, one call site and one conditional. But `files:`
    names stems the sizing check reads as distinct concerns, and Rule 19 refuses that span at
    `risk: medium`. Decomposing is not the alternative: the parameter and the argument that fills
    it are one edit, and splitting them would file a task for a signature nobody calls.

    ONE FIGURE IN THE RATIONALE IS DELIBERATELY A QUERY RATHER THAN AN ANSWER. The three PRs'
    status-to-merge latencies are stamped with their timestamps because they are historical facts
    about fixed shas. Every count — the `openTaskTitles` sweep, the declaration totals, the test
    suite match — moves within the hour and must be re-run, not quoted.
