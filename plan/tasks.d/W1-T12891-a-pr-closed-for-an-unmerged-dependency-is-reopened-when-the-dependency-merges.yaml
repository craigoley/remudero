    - claim: "invariant:only-a-resequence-close-is-reversed — a pull request closed for any other reason (its task already merged, a retirement, a person's close, a close with no marker) is never reopened by this path, and a close the sweep made that a person later re-closed is left closed"
      proof: "grep: W1-T12891 criterion 2 in test/sweep/a-pr-closed-for-an-unmerged-dependency-is-reopened-when-the-dependency-merges.test.ts"
