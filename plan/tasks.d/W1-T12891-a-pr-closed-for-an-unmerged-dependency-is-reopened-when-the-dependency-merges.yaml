    - claim: "A reopen is attempted once per close: a reopen GitHub refuses, or a head branch that is gone, writes one sweep.resequence_close_reverse_failed row with the cause and is not retried on later passes"
      proof: "grep: W1-T12891 criterion 4 in test/sweep/a-pr-closed-for-an-unmerged-dependency-is-reopened-when-the-dependency-merges.test.ts"
  rationale: |
    OBSERVED 2026-11-15 by the operator session, read-only (daemon ledger union and the GitHub issue events of both pull requests):
    - The sweep closed #18581 (W1-T12214) at 2026-11-14T23:03Z and #18570 (W1-T12213) at 23:59Z. Both carried the comment "task ... is unmet dependency in the current plan: W1-T12209 — the plan resequenced after this PR was admitted, current dispatch will not rebuild it ... closing the leftover implementation PR".
    - W1-T12209 merged at 2026-11-15T02:41Z (#18534).
    - Neither pull request had a sweep row after its pr.terminal row. Both stayed closed for 13.5 hours until an operator session reopened them by hand at 16:20Z.
    READ src/lib/sweep.ts:
    - The W1-T3585 disposition row closes such a PR as "stale" and names the close reversible.
    - The branch is kept for that reason (PLAN_RESEQUENCE_CLOSE_MARKER; the head is not deleted).
    - No code reopens the PR, so the reversal depends on a person noticing that the dependency landed.
    The sweep's open-PR list no longer contains a closed PR, so this needs its own read of the closes it made.
  design: |
    1. src/lib/sweep.ts: when the resequence close acts, keep the PR number, task id, named dependencies and head ref in the sweep's state (the close row already carries them).
    2. On a full pass, for each kept close whose dependencies all read merged through the pass's merged-task set, with the task itself unmerged: check that the head ref exists, reopen the PR, write sweep.resequence_close_reversed and drop the entry. On a refusal or a missing head, write sweep.resequence_close_reverse_failed and drop the entry.
    3. Before reopening, read the PR's last close event. If a person closed it after the sweep's close, drop the entry without acting.
    INVARIANT only-a-resequence-close-is-reversed: the path acts only on closes this sweep made with the resequence marker, and never on a PR a person closed afterwards.
    NOT IN SCOPE: closes for retirement or an already merged task, rebasing the reopened head (the conflict round owns that), and plan-filing PRs.
  falsifier: |
    Remove the reopen and criterion 1 must fail. Reopen a PR closed with no marker and criterion 2 must fail. Reopen while a dependency is indeterminate and criterion 3 must fail. Retry a refused reopen on the next pass and criterion 4 must fail. Restore and all pass.
