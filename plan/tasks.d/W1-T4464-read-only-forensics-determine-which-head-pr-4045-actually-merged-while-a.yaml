  falsifier: |
    File no implementation successor if the timeline proves no stale merge occurred, or if the
    ruled-in mechanism is already fully owned by an existing task above. The diagnostic artifact
    still records that negative result because it resolves the proposal without turning an ambiguous
    incident into merge-path code.
  note: |
    `depends_on` is deliberately empty. W1-T2866 is a run/amendment label, not a task record in the
    current merged plan, and the six existing tasks cited above are comparison owners rather than
    prerequisites for reading the incident. A hard edge would delay the evidence needed to determine
    whether any of them already closes the class.

    The grep proofs establish the forensic report's required structure, not the truth of its
    conclusions. Truth comes from the source-linked timeline, candidate disposal, positive controls
    and explicit NOT DETERMINABLE bucket; that is the appropriate verification shape for a read-only
    diagnosis with no code deliverable.
