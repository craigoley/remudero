  rationale: |
    FOLLOW-UP HARVEST from run W1-T2866 (DAEMON-1788584618629, PR #4045) reports that
    `remudero-fleet[bot]` merged a stale head while a review-gate fix worker was actively in flight.
    That report names a merge-safety race but does not yet establish what "stale" means. GitHub may
    have merged an obsolete remote head, the current remote head while a newer fix existed only
    locally, a head whose checks described an older base or PR body, or a head carrying a verdict
    superseded by an in-flight repair. Those are different mechanisms with different remedies.

    THE NEAR NEIGHBOURS ARE ALREADY DECIDED AND MUST NOT BE RE-FILED BY TITLE. W1-T230 binds an arm
    to the orchestrator's exact-head ledger verdict. W1-T1215 records a best-effort withdrawal losing
    to GitHub's merge queue. W1-T2677 gives repairs an atomic cross-agent claim but explicitly makes
    that claim evidence rather than a lock and does not connect it to merge admission. W1-T2722 owns
    contradictory semantic verdicts for one decision input. W1-T2851 owns a success status certifying
    an older PR body, and W1-T2855 owns direct merge against checks computed on an older base. The
    reported overlap is new work only if its mechanism survives those dispositions.

    MASTER-PLAN §12.3B says an armed auto-merge is safe because GitHub's required-check contract,
    rather than runner timing, decides the merge. PR #4045 either exposes a missing input to that
    contract, a runner-side merge path outside it, or imprecise incident language. Guessing which
    would turn a research proposal into an ungrounded merge-gate change.
  design: |
    Run one bounded, read-only forensic pass and write
    `docs/audits/pr-4045-stale-head-fix-race-2026-09.md`. Reconstruct a single UTC event timeline
    from immutable GitHub PR commits/events, status and check attempts, auto-merge enablement and
    merge records, joined to the complete ledger union for the originating run, sweep disposition,
    fix dispatch, worker lifecycle, review posts, arm/disarm attempts, pushes and terminal outcome.
    Every row carries the PR number, remote head SHA where available, actor or run id, timestamp and
    evidence source. An unavailable source is marked UNREAD, never treated as an empty history.

    Classify the incident into exactly one evidence-supported stale-head meaning: obsolete remote
    head merged; current remote head merged while a newer fix was only local; stale base; stale PR
    body; stale review verdict; or NOT DETERMINABLE. State the remote head immediately before merge,
    the resulting merge SHA, every fix-worker observed/base/result SHA, and whether any claimed
    newer commit was ever successfully pushed. Do not call an unpushed local commit the PR head.

    Trace every production path capable of arming, directly merging, withdrawing an arm, dispatching
    the relevant fix and pushing its result. For each candidate mechanism, mark RULED IN, RULED OUT
    or UNDECIDED with the source symbol and event that decides it. Explicitly test whether an active
    fix dispatch or W1-T2677 repair claim is visible to the mergeable disposition, whether the fix
    path posts a required pending state before spending, whether a previously armed PR can become
    mergeable during the repair, and whether a direct-merge fallback participated.

    Measure recurrence over a named, bounded ledger/GitHub window: count same-PR intervals where a
    fix worker was active while auto-merge was armed or a merge completed, partitioned into confirmed
    safe, confirmed race and NOT DETERMINABLE. Prove each query can see its corpus with a positive
    control and report the newest timestamp in each corpus so an old archive cannot manufacture zero.

    Ship no source change and preselect no remedy. The audit maps its finding to W1-T230, W1-T1215,
    W1-T2677, W1-T2722, W1-T2851 and W1-T2855 criterion by criterion. If none owns the ruled-in
    mechanism, record one narrowly scoped SUCCESSOR FILING with the required invariant and production
    insertion point; if an existing task owns it completely, name that task and file nothing.
