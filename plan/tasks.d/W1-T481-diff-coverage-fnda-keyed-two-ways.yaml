  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    `>=2 subsystems while risk<high`, and `files:` spans `scripts/` and `test/`. The band is Rule 19's
    SPAN, not blast radius — the runtime effect is one gate reading one line differently.

    THE ACCEPTANCE IS THE FALSIFIER, NOT THE SYMPTOM, AND THIS IS THE POINT MOST LIKELY TO BE GOT
    WRONG. A gate fix that proves only that the false positive is gone is INDISTINGUISHABLE FROM
    SWITCHING THE GATE OFF. The implementer must demonstrate BOTH DIRECTIONS ON A SAME-TREE PAIR: the
    patched script reads OK on a real lcov and diff, AND still BLOCKS genuinely-uncovered added lines.
    The `unit test:` criterion above is the file that already carries four FNDA assertions, including
    the UNENTERED case that must keep blocking.

    BUILD THE LCOV AND THE DIFF FROM THE SAME TREE, AND NAME THE SHA. A session voided a whole re-run
    by reusing artifact filenames across a session while `origin/main` moved: its lcov and its diff no
    longer described the same tree and every number it produced was meaningless. This shard's own
    figures come from `/tmp/full-7c4067c.lcov`, built from 7c4067c in the filing session, and the sha
    is named for exactly that reason. A stale artifact from 2026-08-11 was rejected here rather than
    reused, because it held 108 SF records — a SCOPED run, not the merged full-suite lcov the census
    needs — and would have under-reported the duplicate census by two orders of magnitude.

    `files:` IS DERIVED BY INVOCATION, NOT BY MENTION, and is kept to four paths because
    `partitionByFileOverlap` blocks on declared paths. 25 test files MENTION diff-coverage; only
    `test/diff-coverage.test.ts` carries the FNDA assertions this change alters (four of them), so it
    is the one existing test declared. `src/run-task.ts` is DELIBERATELY NOT DECLARED — at 19,588 lines
    every task naming it serialises against every other that does (W1-T471), and this change does not
    touch it. The shard's own path is NOT declared either: adding it converts the endemic proof-scope
    warnings into one hard `rule15-filing` violation."
