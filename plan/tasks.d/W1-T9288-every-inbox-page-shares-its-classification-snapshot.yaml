  files: ["test/a-failed-human-judge-is-visible-as-triage.test.ts","src/lib/inbox-responder.ts","test/serves-main-thread-never-classifies-the-inbox.test.ts","test/every-view-body-matches-its-schema.test.ts","src/lib/fleet-lane.ts","src/lib/read-page.ts","src/lib/views.ts","src/lib/service.ts","src/lib/console-snapshot-cache.ts","test/the-inbox-and-feedback-views-answer-from-memory.test.ts","test/human-gate-classification.test.ts","test/human-gate-surface-counts.test.ts","src/lib/inbox-view.ts","src/lib/panel-graph.ts","openapi/daemon.yaml","packages/api-client/src/schema.d.ts","test/every-inbox-page-shares-its-classification-snapshot.test.ts"]
  status: queued
  attempts: 0
  rationale: |
    Issue #8446 shows that generatedAt and independently retained source asOf values cannot prove equal-count pages belong to one classification. buildAttentionCensus already creates a content-derived snapshotKey. The operator approved reusing that identity, not starting reader-triggered classification.
  design: |
    Compute/reuse the attention census snapshotKey once for a completed classification and stamp it on every Inbox page and section from that classification. Embed the same key in cursors. Refuse a cursor from a different classification with an explicit snapshot-changed/restart outcome; never splice equal-count rows from different snapshots. Preserve cache/ETag efficiency, 64 KiB page bounds and truthful unavailable/partial/stale states. Readers only read maintained materialization. Document additive fields and cursor behavior in OpenAPI and regenerate the API client. The console pagination follow-up pins this key after the producer merges; existing count/page-shape guards remain useful but are not snapshot equality proof.
  acceptance:
    - claim: "a changed classification invalidates an otherwise plausible cursor"
      proof: "grep: test(\"equal-count inbox pages cannot mix classification snapshots\" in test/every-inbox-page-shares-its-classification-snapshot.test.ts"
    - claim: "one classification identity is reused across maintained sections and pages"
      proof: "grep: test(\"all inbox sections retain one classification key without reader-triggered work\" in test/every-inbox-page-shares-its-classification-snapshot.test.ts"
  falsifier: |
    Change rows between page reads without changing counts. Dropping the cursor snapshot check or independently recomputing page identities must make the mixed-snapshot fixture fail.
