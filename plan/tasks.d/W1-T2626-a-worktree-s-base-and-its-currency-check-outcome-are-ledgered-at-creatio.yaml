  note: |
    FILED 2026-09-01 alongside W1-T2625 from the same follow-up harvest, but justified INDEPENDENTLY
    of whatever that audit concludes: the three facts in the rationale are true at this sha whether
    the 1553-commit base turns out to be a fail-open read, an upstream that was itself stale, or the
    known primary-checkout drift. In all three worlds the ledger cannot currently tell them apart,
    and that is what this task fixes.
    risk:high is a RECORDED JUDGEMENT, not sizing pressure. Two reasons, both honest: the Rule 19
    atomic-coupling exit (one invariant across worker.ts and run-task.ts, unsatisfiable piecewise —
    the W1-T240/W1-T250/W1-T253 precedent), and blast radius — this edits the dispatch path every
    run passes through, where the dangerous direction is a change that turns the unreadable branch
    into a refusal and stalls the fleet on a transport blip. The fifth criterion, pointed at the
    EXISTING W1-T405 suite, is the guard against exactly that and is load-bearing rather than
    ceremonial.
    NOT IN SCOPE, deliberately, each with its owner: the boot fetch failing open onto a stale tree
    is W1-T2501; stale git lock reclamation is W1-T1036; a merged change to an image-baked path
    shipping nothing is W1-T496; the primary-checkout drift recorded in MASTER-PLAN's standing
    operational note (1) is an operational fact this task makes VISIBLE at dispatch, not one it
    repairs. This task adds no refusal, no policy and no repair — only the record that makes all
    four answerable.
