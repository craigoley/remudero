- id: W1-T5732
  title: "A LANDED CAPTURE STAYS VISIBLE UNTIL THE CHECKOUT HOLDS IT — `acknowledgeLandedFeedbackQueue` drops a queued record as soon as FETCHED origin/main carries it, but serve lists feedback from its checkout's working tree, which takes the record only at the next self-sync, so between the ack and that refresh the entry is in neither place and vanishes from every feedback read"
  repo: remudero
  depends_on: [W1-T5627]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: medium
  origin: "operator session 2026-10-04: follow-up audit (research/audit/followups.md) item 90, from #9158 (W1-T5628) review"
  plan_refs: [W1-T5627, W1-T5628, W1-T5525, W1-T5460]
  files: [src/lib/feedback-landing.ts, test/a-landed-capture-stays-visible-until-the-checkout-holds-it.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 70bb29f8. `landPendingSteps` (src/lib/feedback-landing.ts) runs
    `git fetch origin` and then `acknowledgeLandedFeedbackQueue`, which `unlinkSync`s each queued
    record whose `origin/main:<rel>` blob `decideFeedbackStage` reads as `keep-upstream`. Every
    feedback reader on serve (`listFeedback(root)` in GET /v1/feedback, the overlay through
    `readQueuedFeedbackRecords`, the feedback view) reads the checkout's WORKING TREE plus the queue;
    a fetch moves only the remote-tracking ref, so the working tree gains the file only when the
    checkout is next synced. In that window the record is in neither source. Today a console
    capture also leaves an untracked copy in the checkout, which hides the gap for captures (not for
    status flips, whose checkout copy is the OLD status until the sync); #9158 (W1-T5628, open at
    this sha) removes that copy, so after it merges a fresh capture disappears outright until the
    sync. serve-plan-reload.ts reloads only plan/tasks paths and does not refresh plan/feedback.
  design: |
    Acknowledge a queued record only when the checkout serve lists from already holds the landed
    bytes in its working tree (`hash-object` of `<checkout>/<rel>` equals the `origin/main:<rel>`
    blob; the checkout is the sweep's own `root` when serve and the daemon share one, else an
    explicit served-root option measured and named in the PR), the same proof
    `acknowledgeLandedQueueCopies` uses for untracked copies; otherwise keep it queued (the overlay
    keeps serving it) and let a later pass ack it. Name the kept-for-checkout count in the landing
    result so a checkout that never syncs is visible, not an ever-growing silent queue.
  acceptance:
    - claim: "a queued record that fetched origin/main carries but the checkout's working tree does not is kept and still listed, and is acknowledged on the first pass after the checkout holds its bytes"
      proof: "unit test: test/a-landed-capture-stays-visible-until-the-checkout-holds-it.test.ts"
  falsifier: |
    Ack on the origin/main read alone: the record is unlinked while the checkout lacks it, the
    listing misses it, and the test fails.
