  rationale: |
    OBSERVED 2026-10-29: Dependabot #15176 ("bump node from 24.21.0-bookworm-slim to 24.22.0", head d017fa762) changes only deploy/Dockerfile, to FROM node:24.22.0-bookworm-slim@sha256:91acba91b842bec0bf7ea6f5e09c644c7ccad72c4996ed9616d861d1c7cd60d4. It has been red on ci, ci-gate and ci-shard (3/8) and (5/8) since 2026-10-28.
    - The dep-review lane's in-lane pin sync (syncNodePinForImageBump, from W1-T6064) refused it at 2026-10-28T14:41:44.076Z: dep-review.node_pin_refused, reason unreadable, "deploy/Dockerfile, .nvmrc or the head ref could not be read".
    - dep-review.decided then escalated: "semver level could not be determined from the PR title/body — fail closed, treated like a major" (issue 15210).
    OBSERVED on origin/main: 24.21.0 is pinned in .nvmrc, package.json engines (">=24.21.0"), package-lock.json's root engines, and deploy/Dockerfile.
    - scripts/coverage-merge-ratchet.mjs carries "Node 24.21.0's private mapRangeToLines line write", a copy of Node-internal coverage code that must match the runtime.
    - scripts/lib/read-map-platform-outcomes.mjs accepts only runtime node "v24.21.0", and test/ci/read-map-platform-outcomes.test.ts builds its fixture at v24.21.0.
    INFERRED: a Dockerfile-only bump cannot pass, because the pin, the engines range and these copies must move with it. W1-T6064's sync covers only .nvmrc, and it refused here.
  design: |
    Move every pin listed in files: to 24.22.0 in one PR. Re-read Node 24.22.0's lib/internal/test_runner/coverage.js (mapRangeToLines and the lcov writer) and update the copy in scripts/coverage-merge-ratchet.mjs if it changed. Say in the PR body whether it changed.
    Comments that record a measurement made on 24.21.0 stay as written, since they name what was measured.
    #15176 may close as superseded once this merges. Do not edit or close it from this task.
  falsifier: |
    If the coverage run on 24.22.0 shows a line-count drift between the merged lcov and Node's own reporter, the private-copy claim fails and the copy must be updated before merge.
