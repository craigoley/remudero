    THE ID WAS PRE-MINTED AND READ BACK BEFORE ANYTHING WAS WRITTEN. `refs/rmd-id/W1-T1222`
    resolves to 54680d222f80f29e270ca47a45dc9a6bc5f93fff; the negative control
    `refs/rmd-id/W1-T999999` reads 0 and the namespace holds 252 refs. EIGHT ID SURFACES WERE SWEPT,
