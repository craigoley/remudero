- id: W1-T1222
  title: "W1-T915 gave `resolveServeHosts` a container-network carve-out and the deploy recipe never uses it — `host-update.sh` prints a `remudero-serve` invocation with no published port and no bind-host passthrough, so the console still binds loopback inside its own namespace and seven merged features arrive on a surface with no address"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  risk: high
  principles: {tdd: strict}
  budget_usd: 35.00
  rationale: |
    RE-DERIVED AT origin/main 42e449f IN A SCRATCH WORKTREE ON HOST `vm` UNDER /usr/bin/bash. Every
    zero below carries a control taken with the same tool against the same surface.

    (1) W1-T915 SHIPPED AND MUST NOT BE RE-FILED. `src/lib/serve.ts` carries `resolveServeHosts`
    with a container-network carve-out gated on `CONTAINER_NETWORK_ENV = "RMD_SERVE_NETWORK"` and
    `CONTAINER_NETWORK_VALUE = "container"`; `test/serve-reachability.test.ts` carries all four of
    that task's acceptance tests by exact title and runs 4/4 on main today. Falsified rather than
    trusted: the anchor `const allowContainerWildcard = env[CONTAINER_NETWORK_ENV] === …` is unique
    at one occurrence, disabling it moved the file's sha256 from 1bb673d3399a21f2 to
    bdd84db1e91c9f43 and reddened criterion 1 ALONE, and the restore returned the original sha. It
    merged as #1985 under `chore(serve): wip - add container-network bind carve-out to
    resolveServeHosts`, with no `Remudero-Task:` trailer and no id in the subject, which is why
    both credit paths read zero and the task still reads `status: queued`. THAT IS A CREDIT DEFECT,
    NOT A MISSING IMPLEMENTATION, and this shard does not re-open it.

    (2) THE DEPLOY RECIPE NEVER EXERCISES THE CARVE-OUT. `deploy/host-update.sh` prints a
    `remudero-serve` invocation carrying `--restart=unless-stopped`, `--user 1000:1000`, the state
    bind mount and `./bin/rmd serve` — and NO `--publish`, NO `RMD_SERVE_HOST` and NO
    `RMD_SERVE_NETWORK`. Word-bounded counts at that head: `RMD_SERVE_HOST` reads 7 in
    `src/lib/serve.ts` and 0 across `deploy/`; `RMD_SERVE_NETWORK` reads 2 and 0; `remudero-serve`
    reads 1 in `deploy/host-update.sh` and 3 in `src/lib/serve.ts`; `STATE_MOUNT_DEST` reads 4 in
    the recipe, so the file is being read. Control: `routeSpecialists` reads 0 in all four files,
    so the zeros discriminate rather than reflecting a broken query. The bind is therefore
    `DEFAULT_SERVE_HOST` = 127.0.0.1 inside a namespace nothing else joins.

    (3) THE LIFECYCLE FORK IS ALREADY DECIDED, IN THIS REPO, AGAINST THE SUPERVISOR — SO THE HARD
    QUESTION IS NOT OPEN. `host-update.sh`'s own comment above the block states it: serve "returns
    0 on a clean shutdown and must come back from EVERY exit, so it takes unless-stopped, not
    on-failure", and "launchd.ts records daemon-independence as a requirement: stopping the fleet
    must never blind the operator, which is why this is not folded into the container above." The
    daemon container runs `./bin/rmd daemon` under tini and treats `DAEMON_EXIT_STALE=75` as a
    restart, so a serve process supervised inside it would inherit every freshness restart and be
    down whenever the fleet is stopped — the precise coupling that comment refuses. A supervisor
    would REVERSE a recorded decision; this shard proposes its own container, which is what the
    recipe already prints, and changes only what that recipe omits.

    (4) WHAT COULD NOT BE MEASURED HERE AND IS THEREFORE NOT ASSERTED. The container-side readings
    — `docker port remudero-daemon`, `HostConfig.PortBindings`, `NetworkSettings.Ports`, whether
    `rmd serve` appears in the container's process table, and the date on
    `state/service-tokens.json` — all need docker. On this host `/var/run/docker.sock` does not
    exist, `docker info` fails against it, `DOCKER_HOST` is unset, `ssh` is absent and
    `/home/craigoleyagent` does not exist. Those five readings are NOT re-derived and NOT carried
    as facts by this record. The defect above is established from the tracked recipe alone, which
    is sufficient: a recipe that publishes no port cannot produce a published port.

    (5) THE CONSEQUENCE IS THE ARGUMENT. W1-T507 (#1886), W1-T1006 (#2162) and W1-T283 (#1080) all
    merged onto the console surface. Whatever they render, they render at an address that resolves
    from nowhere, so the work is shipped and undelivered.
  design: |
    ONE CONCERN: the printed `remudero-serve` invocation must start a console that has an address.
    Not the bind logic, not the queue, not the tunnel.

    (i) THE CHANGE, STATED MECHANICALLY. The `remudero-serve` block in `deploy/host-update.sh`
    gains a published port bound to the HOST's loopback and passthroughs for the two names
    `src/lib/serve.ts` already reads, and `deploy/runtime-env-vars.sh` declares those names so the
    passthrough has something to pass. Nothing else in the block moves.

    (ii) DO NOT WIDEN THE BIND TO A WILDCARD. The refusal in `assertBindableHost` is deliberate
    (R-5) and stays exactly as it is. The shape is a host-loopback-published port plus an explicit
    bind host — the arrangement `src/lib/serve.ts`'s own doc already describes — never `0.0.0.0`.

    (iii) `src/lib/serve.ts` IS NOT IN SCOPE AND NEEDS NO FURTHER CHANGE. W1-T915 owns it and has
    shipped (rationale 1). A change there would be re-implementing a merged task.

    (iv) THE SUPERVISOR OPTION IS OUT OF SCOPE BECAUSE IT IS ALREADY REFUSED, not because it is
    hard — see rationale (3). An implementer who adds a process supervisor to the daemon container
    has reversed a recorded decision and re-coupled the console to the daemon's restart loop.

    (v) STILL OPERATOR ACTS, UNCHANGED FROM W1-T915's OWN DESIGN (vi): the Cloudflare tunnel, the
    DNS record and the Access application. This task makes the origin reachable on the host; it
    does not publish a hostname and must not try to.

    (vi) THE FALSIFIER MUST BIND TO THE OMISSION, NOT THE PRESENCE. A test that only asserts the
    recipe CONTAINS a publish flag passes just as well if the daemon block grew one by accident.
    The assertions must be scoped to the serve block, and the daemon block must be pinned unchanged
    in the same run, or the test cannot tell a fixed console from a leaked port.
  acceptance:
    - claim: "the printed serve recipe publishes its port bound to the host loopback"
      proof: "unit test: W1-T1222: the printed serve recipe publishes a loopback-bound port"
    - claim: "the printed serve recipe passes the bind host and network mode through"
      proof: "unit test: W1-T1222: the printed serve recipe passes the bind host through"
    - claim: "the daemon recipe is left byte-identical by the serve change"
      proof: "unit test: W1-T1222: the daemon recipe is unchanged by the serve publish"
    - claim: "serve keeps its own container and its own restart policy"
      proof: "unit test: W1-T1222: serve keeps its own restart policy and its own container"
