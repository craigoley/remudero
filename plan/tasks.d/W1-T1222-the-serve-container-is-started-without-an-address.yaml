    stems and a test suite, which the sizing check reads as distinct concerns and refuses at
    `risk: medium`. The blast radius is genuinely narrow: a printed invocation and two declared
    variable names. Decomposing the recipe from the declaration that feeds it would file a task for
    a passthrough with nothing to pass.

    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT AT 42e449f, NOT GUESSED. `remudero-serve`
    reads 1 in `deploy/host-update.sh`; `STATE_MOUNT_DEST` reads 4 there, so the file is being read
    rather than missed. `RMD_SERVE_HOST` reads 7 and `RMD_SERVE_NETWORK` reads 2 in
    `src/lib/serve.ts` and 0 in both deploy files, which is the omission this task closes. Control:
    `routeSpecialists` reads 0 in all four files.

    `test/host-update-reclaim.test.ts` IS THE DECLARED TEST HOME DELIBERATELY. It already reads
    `deploy/host-update.sh`'s text and carries docker-run assertions, so the recipe falsifier lands
