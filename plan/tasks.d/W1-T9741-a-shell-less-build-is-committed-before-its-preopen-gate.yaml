- id: W1-T9741
  title: "A SHELL-LESS BUILD IS COMMITTED BEFORE ITS PRE-OPEN GATE, SO THE GATE AND THE PUSH JUDGE THE SAME TREE — the dispatch runs the pre-open gate on the worker's uncommitted edits and only then calls harnessCommitForShellLessWorker, so the gate judges a dirty tree the push never sees, and W1-T9602's push-gate reuse (keyed by tree) is skipped on most builds"
  repo: remudero
  depends_on: [W1-T9602]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern, the order of the harness commit and the pre-open gate; what is committed and what the gate runs are unchanged
  band_meaning: blast-radius
  origin: 'operator approval 2026-10-15 (verbatim: "go ahead - do as much as you can in parallel"; earlier: "innovate; lean into automation and self improvement"): W1-T9619/W1-T9602 builder report, item S'
  plan_refs: [W1-T9602, W1-T9619, W1-T3696, W1-T8920]
  files:
    - src/run-task.ts
    - test/a-shell-less-build-is-committed-before-its-preopen-gate.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ at origin/main 6bdb26420 (src/run-task.ts, the implement dispatch; symbols, not lines):
    - The dispatch computes `preopenGate` (runPreopenGate) and runs it on worktreePath when the worker reported no
      PR. A failing gate goes back to the worker once.
    - Only after that block does it call harnessCommitForShellLessWorker, which commits a shell-less worker's edits
      (implement.harness_commit / implement.harness_commit_refused).
    - So for a harness-owns-git worker the gate judges uncommitted edits, and the tree it judged is not a commit the
      push or CI will see.
    OBSERVED (core ledger union, every rotation 2026-10-13T23:46Z to 2026-10-15T13:52Z plus the live file, from
    W1-T9602's PR body): 84 implement.preopen_gate rows and 74 implement.harness_commit rows in the same window.
    INFERRED: most gates run on a dirty tree. W1-T9602 (queued; build in flight) records a push-gate verdict keyed by
    the committed tree and skips a dirty one, so on these builds its reuse cannot fire. Committing first lets the
    pre-open gate, the push gate and the push key one tree. The size of the saving is unknown until W1-T9602's rows
    exist.
  design: |
    1. For a harness-owns-git (shell-less) worker, harnessCommitForShellLessWorker runs BEFORE the pre-open gate, with
       the same subject rules, refusals and declared-path checks it has today. The gate then runs on a clean,
       committed tree.
    2. When the gate fails and the worker is sent back once, its new edits are committed again by the same call after
       it returns, as a second commit; the gate's fail-back text and the one-retry rule are unchanged.
    3. A refused harness commit (nothing to commit, missing MERGE_HEAD, missing subject) is decided before the gate,
       so no gate is spent on a build that cannot become a PR. Its rows are unchanged.
    4. implement.preopen_gate gains `tree_committed: true|false` so the fleet can count dirty-tree gates per day.
    5. Shell-capable workers that commit themselves are unchanged.
    Tests go in test/a-shell-less-build-is-committed-before-its-preopen-gate.test.ts, titled verbatim as in the
    proofs, driving the implement dispatch with injected spawn, gate and git seams over a real temp repo.
  acceptance:
    - claim: "for a shell-less worker the pre-open gate sees a clean worktree whose HEAD is the harness commit"
      proof: 'grep: test("W1-T9741: the pre-open gate judges the harness commit, not a dirty tree" in test/a-shell-less-build-is-committed-before-its-preopen-gate.test.ts'
    - claim: "a worker sent back by a failing gate has its new edits committed again before the push"
      proof: 'grep: test("W1-T9741: edits after a failed gate are committed again before the push" in test/a-shell-less-build-is-committed-before-its-preopen-gate.test.ts'
    - claim: "a build whose harness commit is refused spends no pre-open gate"
      proof: 'grep: test("W1-T9741: a refused harness commit spends no gate" in test/a-shell-less-build-is-committed-before-its-preopen-gate.test.ts'
  falsifier: |
    On origin/main, a gate seam that records `git status --porcelain` and `git rev-parse HEAD` sees the worker's
    edits uncommitted and HEAD at the base, so the first test fails. Commit before the gate but skip the second commit
    after a fail-back: the push carries only the first commit and the second test fails.
