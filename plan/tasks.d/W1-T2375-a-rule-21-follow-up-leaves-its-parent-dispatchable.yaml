  note: |
    WHAT MUST NOT CHANGE.

    RULE 21 STAYS. A merged task's CLAIMS are frozen, and `criteriaAdded` remains the ONLY blocking
    arm in `postMergeAmendmentViolations`. This task adds a condition to that arm's existing escape
    hatch; it must not add a second blocking arm, and it must not touch the report-only checks beside
    it, whose `warn` severity W1-T2248's ruling protects.

    THE RETIREMENT RULING STANDS AND IS NOT REOPENED. The `retirement:` field, value `retired`, reason
    in prose, never deletion. Nothing here proposes a new vocabulary, and nothing here proposes
    changing what a retirement means.

    NOTHING AUTO-RETIRES. A retirement is an operator act. This check REFUSES SILENCE; it never writes
    a disposition, never infers one, and never picks between the full and partial cases. A build that
    sets a parent's `status` on the filer's behalf has answered a different question and is wrong.

    THE DUPLICATE-DISPATCH CLASS IS OWNED ELSEWHERE. W1-T1268 owns duplicate dispatch as a class. This
    shard owns only the MISSING COUPLING AT FILING TIME — the moment a PR gives criteria a second home
    without addressing the first. A build that widens into dispatch-side dedupe is in W1-T1268's
    scope, not this one's.

    NOTHING PACES, THROTTLES OR SLEEPS. The check is a pure predicate over objects the §5C pass has
    already resolved: no git read, no network call, no timer, no retry.

    THE FIGURES ARE QUERIES, NOT NUMBERS TO CARRY. 835, 161, 6, 2-of-646 and the 12h37m gap are stamped
    with the sha and date they were read at and will move. Re-run them rather than quoting them; no
    acceptance criterion asserts any of them, deliberately.

    RULE 19 BAND. `risk: high` is set UP FRONT for the SPAN of the declared `files:` — one module and
    its test — and carries no claim about blast radius, which is one predicate on one existing arm.

    THE FORWARD REFERENCE IS DELIBERATE. The declared test file does not exist yet; it is named in
    `files:` so the pure-path proofs resolve under the forward-reference carve-out and read
    `not_yet_built` until the build lands. Every proof is pure-path `unit test:`, so this shard
    carries no `grep:` pattern at all.
