  rationale: |
    The W1-T11458 census found three daemon callers that acknowledge before synchronous delivery:
    quarantineReporter adds its reported key before reportQuarantined (run-task.ts ~27142);
    createMemoryReadTracker sets open.escalated before its sink (~dispatch-governor.ts:414);
    runWorkerStallDetectorRung writes the episode's dedup row before tryEscalate (~run-task.ts:32930).
    Refusing a cadence wait there would lose the only notification, so W1-T11458 retains legacy
    synchronous escalation delivery as its brief explicitly permits and files this follow-up.
    host-escalation-spool.ts already durably queues and asynchronously retries notifications, but
    its entries and delivered keys carry no target repository; run-task's drain supplies the fleet
    gateway. Sending arbitrary target-repository alerts through it unchanged would misroute them.
    The same audit found a fourth producer: publishLightPassReviewDemand consumes takeCapacityDecisions
    before its callback (src/lib/sweep.ts ~25500); memoryCapacityEscalation uses synchronous delivery.
    A failed callback loses that queued observation because the shortfall tracker already raised it.
  design: |
    Reuse the existing host escalation spool and normal drain cadence, with no new timer or bound.
    Add an explicit qualified repository to target-specific entries and include it in pending and
    delivered identities. Resolve that route to its same-repository async issue gateway on drain.
    An invalid or unavailable explicit route stays pending with a visible failure; never fall back
    to the fleet repository. Preserve the established fleet lane for legacy unqualified entries.
    Quarantine, sustained-memory, stalled-worker and capacity-decision producers synchronously enqueue
    their complete notification before acknowledging the episode. Reuse queueCapacityDecision to
    retain a consumed capacity observation when its durable write fails; no new queue or threshold.
    A failed durable write leaves the episode
    eligible for the next pass, while successful enqueue may acknowledge without inventing an issue
    URL. Observe actual GitHub delivery separately; retain failed delivery across process restart.
    Wire each producer from its already qualified daemon target. Keep standalone CLI behavior.
    These four migrated production paths use the durable handoff and no longer need synchronous
    escalation delivery. Retain the legacy exemption for other unverified synchronous clients;
    custom injected gateways retain their declared contract.
    Test the real spool on disk and the real producer adapters, with private fake async transport.
    Use two repositories with identical task and summary to expose cross-route key collisions.
