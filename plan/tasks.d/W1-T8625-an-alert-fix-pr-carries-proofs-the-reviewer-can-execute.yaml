- id: W1-T8625
  title: "AN ALERT-FIX PR CARRIES PROOFS THE REVIEWER CAN EXECUTE — alertFixPrompt asks for `- <claim> | <proof>` bullets and never names a dialect, the shape that failed main-repair PR #11096 on proof-discrimination, and the dispatcher's own body check passes a prose proof because acceptanceAuthorTimeCheck only reports an inert proof"
  repo: remudero
