  rationale: |
    READ on origin/main 32360d06a. Symbols, not lines.
    THE PROMPT. `alertFixPrompt` (src/run-task.ts) tells the worker the body "MUST include: an `Acceptance:` block of
    `- <claim> | <proof>` bullets covering the fix". It never names a dialect. review.ts executes a proof only when it
    opens with `unit test:` or `grep:`; any other proof is prose and caps the verdict. W1-T8572 found the same line in
    `mainRepairFixPrompt` after #11096 failed proof-discrimination, and reported this sibling instead of fixing it.
    THE SHARED GRAMMAR DOES NOT FIT AS IT IS. `ACCEPTANCE_PROOF_GRAMMAR` (src/lib/proof-grammar.ts) is the shared copy,
    but it is written for FILING: "You are FILING work, so its test does not exist yet", "DEFAULT TO THE WHOLE-FILE
    `unit test:` FORM", and YAML `proof: "..."` lines. `RETRO_ACCEPTANCE_BLOCK_GRAMMAR`'s doc in run-task.ts already
    says not to reuse that constant verbatim outside filing. An alert fix changes code in the same PR. A whole-file
    `unit test:` on a test file that already passes on main passes at base too. W1-T362 grades that as stale, so the
    proof discriminates nothing and proof-discrimination still fails.
    THE CHECK THAT EXISTS. `dispatchAlertFixRun` already runs `deps.checkAcceptance` on the opened PR (W1-T952).
    Through `checkAlertFixAcceptance`, that is `acceptanceAuthorTimeCheck`. It ledgers `alert-fix.acceptance_defect`
    only when `!check.ok`. `acceptanceAuthorTimeCheck` returns `ok: true` for a block whose proofs have no dialect: it
    counts them (`inert`) and adds a note to `message`, because W1-T2544 made that signal advisory on the required
    acceptance-author-gate. So today a prose-proof alert-fix body ledgers nothing.
    SIBLING, NOT THIS TASK. W1-T8572's design 3 relied on the same `deps.checkAcceptance` result for the main-repair
    no-test-file case, so it had the same gap. #11120 amends W1-T8572 to depend on this task, use its grammar and reuse
    its inert-proof count.
    AMENDMENT 2026-10-12, READ on origin/main 8139a0d18. Probed with `node --import tsx` on ea41dc50e:
      - THE TRAILER ARM. Called with no `expectedTaskId` and no `trailerResolves`, as `checkAlertFixAcceptance` calls
        it, `acceptanceAuthorTimeCheck` returns `ok: true` ("criteria resolve from plan/tasks.yaml") for any body with a
        `Remudero-Task:` line, before it reads the block. Every alert-fix body ends with one, from the prompt and from
        `ensureTaskTrailer`. So today's check never looks at an alert-fix body's proofs at all, and its `inert` count is
        never reached.
      - THE LEGACY BARE-PATH MATCH. `parseWhitelistedProof("test/a-spent-check-requeue-survives-ledger-rotation.test.ts
        passes")` returns a test proof through its W1-T65 legacy shape (`TEST_PATH_RE`), reached when a proof has no
        dialect label. So `parseWhitelistedProof(...) === null` alone does not catch prose that names a test path, which
        is the shape #11096 carried.
    NOT MEASURED: how often the alert-fix lane opens a PR. #8881 records one that failed commitlint after it opened. No
    open `alert-fix-*` head exists on origin as of 2026-10-12 15:19Z.
  design: |
    1. A PR-BODY GRAMMAR BESIDE THE FILING ONE. Add a sibling constant to src/lib/proof-grammar.ts for a worker that
       writes a PR body for the change it makes. Reuse `ACCEPTANCE_PROOF_GRAMMAR`'s dialect lines where the words are
       the same: the BRE metacharacter rule, the ` in ` rule, and "grep what your change ADDS". It teaches:
       - `- <claim> | <proof>` bullets, contiguous, one per physical line;
       - the bare proof after the pipe, with no `proof:` label and no quotes or backticks;
       - `unit test: <exact title of a test this change adds>` or `grep: <pattern> in <path>` of text the diff adds;
       - each proof must FAIL on the PR's base and pass on its head, so a test file that already passes on main proves
         nothing.
       Each example proof in it parses under `parseWhitelistedProof`, and each example bullet under
       `parseAcceptanceBlock`.
    2. THE PROMPT USES IT. `alertFixPrompt` spreads that constant where it now asks for the bare bullet shape.
       Everything else in the prompt stays as it is: the commit contract, the title rule, `origin: alert#<id>` and the
       last-line `Remudero-Task:` trailer.
    3. THE DISPATCHER CALLS AN INERT PROOF A DEFECT (amended 2026-10-12, see the AMENDMENT paragraph). After the open,
       `dispatchAlertFixRun` parses the opened body's block itself with `parseAcceptanceBlock`. It does not take the
       proofs from `deps.checkAcceptance`, whose trailer arm returns before the block is read. A proof is inert when
       `!isDialectPrefixed(p) || isDemonstrationProof(p) || parseWhitelistedProof(p) === null`, the prefix test
       `src/lib/plan-proposals.ts` already uses for a falsifier. `parseWhitelistedProof(...) === null` alone is not
       enough: its legacy bare-path match accepts prose that names a test path. When any proof is inert, the dispatcher
       ledgers `alert-fix.acceptance_defect` with `defect: "inert-proofs"`, the count and the inert proof texts.
       Write the count as one exported pure helper. W1-T8572 depends on this task and reuses it for the main-repair
       lane rather than writing a second. `acceptanceAuthorTimeCheck`'s `ok` semantics, and the required gate it backs,
       do not change. Its existing defects are ledgered as they are now.
    4. Unchanged: which alerts the lane acts on (plan/alert-policy.yaml), the worktree, spawn and teardown, and every
       other lane's prompt.
