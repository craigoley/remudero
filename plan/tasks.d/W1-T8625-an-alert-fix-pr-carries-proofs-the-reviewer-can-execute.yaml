    - claim: "a prose proof that names a test path, which parseWhitelistedProof accepts through its legacy bare-path match, is still counted as inert"
      proof: 'grep: test("W1-T8625: a prose proof naming a test path is still an inert proof" in test/an-alert-fix-pr-carries-proofs-the-reviewer-can-execute.test.ts'
    - claim: "an alert-fix body with a Remudero-Task trailer and a prose proof is still ledgered, though acceptanceAuthorTimeCheck returns ok at its trailer arm"
      proof: 'grep: test("W1-T8625: a trailered alert-fix body with a prose proof is still ledgered" in test/an-alert-fix-pr-carries-proofs-the-reviewer-can-execute.test.ts'
    - claim: "a body whose proofs all execute ledgers no defect"
      proof: 'grep: test("W1-T8625: an alert-fix body whose proofs all execute ledgers no defect" in test/an-alert-fix-pr-carries-proofs-the-reviewer-can-execute.test.ts'
    - claim: "the inert-proofs defect is written by the alert-fix dispatcher"
      proof: 'grep: inert-proofs in src/run-task.ts'
  falsifier: |
    Restore the old bare bullet line in alertFixPrompt, and the prompt test finds no dialect in the prompt text. Remove
    the inert-proof count from dispatchAlertFixRun, and a body of `- the alert is fixed | the build passes` ledgers no
    defect. Count inert proofs with `parseWhitelistedProof(...) === null` alone, and a body of
    `- the alert is fixed | test/x.test.ts passes` ledgers no defect. Take the proofs from `deps.checkAcceptance`'s
    result instead of parsing the body, and the same body with a `Remudero-Task:` line ledgers no defect. Break one
    example proof in the new grammar, and the example-parse test fails.
  note: |
    EFFECT, measured after merge from the core ledger with no fixed pass mark: per `alert-fix.pr_opened` PR, whether
    proof-discrimination passed on the first head, and the count of `alert-fix.acceptance_defect` rows with
    `defect: "inert-proofs"`. Healthy shape: none of those rows, and no alert-fix PR red on proof-discrimination.
