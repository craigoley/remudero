  status: queued
  attempts: 0
  note: "verify:auto — a pure predicate over text plus a fixture table, no operator present.
    risk:high — this edits the gate that blocks merges. Widening it strands correct PRs (the observed
    failure); narrowing it too far removes a tripwire that has caught real false bodies twice.
    budget_usd 70 — above the plan-filing tasks because the fixture table must be preserved wholesale
    and the discrimination rule has to be argued, not just coded.
    NOT A DUPLICATE OF W1-T308, and the distinction is load-bearing: that task strips QUOTED regions
    (blockquotes and fences) so a body citing another PR's failing claim is not judged as asserting it.
    #1249's sentence was unquoted prose in its own follow-up section, so the quoted-region strip ran
    and correctly left it in scope. Different cause, different fix.
    W1-T274 built this checker; W1-T307 keeps fix-rung bodies from going stale against it. Neither
    addresses which claims it should read as changeset-scoped."
