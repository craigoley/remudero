  rationale: |
    READ 2026-10-06 on origin/main .github/workflows/ci.yml, the Test step: the W1-T3207 skip fires only
    when `CLASS = SOURCE` and `GITHUB_EVENT_NAME = pull_request`; on merge_group the same SOURCE diff falls
    through to `test-tier-manifest.mjs --run fast --shard N/8`, while W1-T4406 runs the coverage shards'
    full instrumented suite on merge_group too. MEASURED (research-coverage): ~3,480 runner-seconds per
    queued PR. W1-T1041 (closed) asked the general two-harness question; this is the one duplicate it left.
    W1-T5940 (queued, operator build) re-scopes what the merge group runs as a whole; this is the cheap,
    separable half and does not decide W1-T5940's selection.
  design: |
    Extend the W1-T3207 guard so a merge_group SOURCE run skips ci's fast-tier step exactly when the
    coverage lane in the same run executes the full suite, with the same log line and step-summary entry
    naming W1-T3207 and the event. Any merge_group run where coverage is narrowed or skipped keeps the
    fast tier. The workflow guard mutation step (W1-T3220) must still distinguish the new guard.
  acceptance:
    - claim: "on merge_group a SOURCE diff whose coverage lane runs the full suite skips ci's fast-tier step with a W1-T3207 summary line, and keeps it when coverage does not run in full"
      proof: "unit test: test/the-merge-group-runs-the-fast-tier-once.test.ts"
  falsifier: |
