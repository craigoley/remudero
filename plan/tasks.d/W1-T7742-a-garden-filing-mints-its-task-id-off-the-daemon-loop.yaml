      proof: 'grep: test("W1-T7742: a runGardenAsync pass reserves its task id through the async minter and never the sync one" in test/a-garden-filing-mints-its-task-id-off-the-daemon-loop.test.ts'
    - claim: "each named gardener (ci-friction, hot-file, flow-remedy, gate, flow, host-resource, scout) files with the id from the async minter while the sync minter throws"
      proof: 'grep: test("W1-T7742: every minting gardener files with the async-minted id while the sync minter throws" in test/a-garden-filing-mints-its-task-id-off-the-daemon-loop.test.ts'
    - claim: "a reservation that outlives its bound is abandoned, the pass files nothing, and a garden mint_timed_out row names the elapsed time and the bound"
      proof: 'grep: test("W1-T7742: a mint past its bound is abandoned and writes a mint_timed_out row naming the elapsed time and the bound" in test/a-garden-filing-mints-its-task-id-off-the-daemon-loop.test.ts'
    - claim: "the mint bound is derived from observed mint durations and the poll interval, not a constant"
      proof: 'grep: test("W1-T7742: the mint bound scales with observed mint durations and starts from the poll interval" in test/a-garden-filing-mints-its-task-id-off-the-daemon-loop.test.ts'
  falsifier: |
    Leave `spec.apply` calling `sources.mintTaskId(ws.branch)`: a sync minter that throws fails the first two tests.
    Leave the `.async` child with no timeout: a never-resolving fake push hangs, and the third test never sees
    `garden.mint_timed_out`. Replace the derived bound with a constant: the fourth test sees no change in the
    bound after the recorded durations change.
