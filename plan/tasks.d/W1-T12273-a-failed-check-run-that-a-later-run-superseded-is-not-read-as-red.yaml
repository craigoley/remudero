  rationale: |
    OBSERVED 2026-11-11 on plan pull request #17793, head 14b8062.
    - `ci-gate` FAILURE at 01:50:03Z. A body edit ran the gate again on the same head: `ci-gate` SUCCESS at 01:53:04Z.
    - 02:06:53Z and 02:14:29Z on the core ledger: `sweep.disposed`, disposition `refused-escalate`, blocker `plan-proof-unrunnable`, reason "plan-only PR is red on ci-gate". The view of the first row was 7.6 seconds old, so it was read after the green run.
    - The pull request stayed held until a person ran the failed run again by hand.
    MEASURED 2026-11-11 through the REST reads the tick makes (check runs, workflow runs, jobs of each attempt).
    - The failed `ci-gate` is check run 130260991771: the `ci-gate` job of workflow CI (`ci.yml`, workflow id 312964904), run 42938819109, attempt 1. It started 01:39:30Z and failed 01:50:03Z. It failed because `acceptance-author-gate` (run 42938818774, check run 130255414818) had failed at 01:25:58Z.
    - The body edit ran `acceptance-author-gate` again (run 42942010284, check run 130265807114): SUCCESS, started 01:52:11Z.
    - The passing `ci-gate` is check run 130265811120: the job of workflow CI gate (`ci-gate.yml`, workflow id 313901555), run 42942011505. That workflow runs only on `edited`.
    - At 02:25 a person re-ran run 42938819109 (attempt 2). Its `ci-gate` passed and the pull request moved.
    - Through `rollupFromRest`, the two `ci-gate` entries have the producer keys `["check","workflow:312964904","ci-gate"]` and `["check","workflow:313901555","ci-gate"]`. `dedupeRollupByLatestAttempt` keeps both, and `checksStateFromRollup` reads `red`.
    READ at origin/main 78dbf66c3, src/lib/sweep.ts.
    - The red reading is right. Two workflows produced the two runs, and the rule of #14160 (test/a-superseded-runs-rerun-never-overrides-the-newest-run.test.ts) pins this exact shape as red: GitHub still enforces CI's failure.
    - The gap is in the action. The blocked-CI path of `runSweep` reads a fresh rollup, finds the stale gate with `staleCiGateTransition`, and re-runs the failed producer's own `ci-gate` job once through `reaggregateCiGate` (W1-T1275), bounded by `sweep.ci_gate_reaggregated` rows. The plan-only arm (the `isPlanFiling` branch before the disposition switch) never reaches that path. It sets `refused-escalate` at once with "plan-only PR is red on ci-gate".
    CHECKED for overlap: W1-T4908, W1-T9913, W1-T3652 and W1-T1275 (all merged) made the rule of today. No queued task covers a run that a body edit starts.
  design: |
    Keep the rule of #14160: a run of another workflow never clears a failure. `rollupProducerKey`, `dedupeRollupByLatestAttempt` and `classifyRollupSupersession` do not change.
    In the plan-only arm of `runSweep` (src/lib/sweep.ts), before `tryPlanRepair`, read a fresh rollup through `deps.readCiGateRollup` and pass it to `staleCiGateTransition`. Skip this when a pending judgment or a plan conflict round decides the arm.
    - When it finds a transition, treat it the way the blocked-CI path does: re-run the failed producer's `ci-gate` job once through `deps.reaggregateCiGate`, with the existing bound (`ciGateReaggregateKey`, `ciGateReaggregateDecision`, the `sweep.ci_gate_reaggregated` row written before the call). The disposition is `wait`, the reason names the stale verdict, and no escalation is filed. A pass that finds the row already written also waits.
    - On a dry run or a pass where `blocked-fixable` is not actionable (the light pass), do not re-run. Wait with the reason "its re-run waits for a full sweep pass".
    - When there is no transition, the arm runs as today. A re-run that fails again has a `ci-gate` attempt newer than the sibling's success, so `staleCiGateTransition` finds nothing and the current escalation stays.
    Move the bounded re-run of the blocked-CI path into one module-private function that both sites call, so the two paths cannot drift. Add no export.
    The five listed tests pin the rule of today. They must pass without a change.
  falsifier: |
    Remove the stale-gate branch from the plan-only arm, and criteria 1, 2 and 5 must fail (the sweep escalates). Let the newest run of a name win across workflows, and criterion 3 must fail. Drop the ledgered bound, and criterion 2 must fail. Restore and require all six to pass.
  note: |
    OUT OF SCOPE: `ci-gate.yml` runs on `edited` and posts its own `ci-gate`, but it does not re-run the `ci-gate` job of `ci.yml`. So a body repair leaves CI's failed `ci-gate` in place until the sweep or a person re-runs it. A change to the workflow so that an edit re-runs CI's gate is a separate task.
    AMENDED 2026-11-11: the first design asked for the two-workflow rollup to read green. The measured fixture shows that this would break the rule of #14160, so the task now re-runs CI's gate instead.
