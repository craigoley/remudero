  note: |
    risk:high SET UP FRONT, AND THE BAND IS RULE 19's SPAN, NOT BLAST RADIUS. The `files:` list
    crosses three concerns that cannot be decomposed without breaking the deliverable: the REST
    producer, the disposition row it feeds, and the completeness gate that fails the build the
    moment a producer appears. Splitting them would land a producer whose only consumer still
    reads an empty list, or an allowlist removal with nothing wiring the field — each individually
    red. Blast radius is deliberately LOW: with the flag off, disposition is byte-identical.

    `files:` DERIVED FROM SOURCE, NOT GUESSED. `mergeStateFromRest` and the hydration cap live in
    `src/lib/open-prs-rest.ts`, which is where the sibling field was wired by #1082;
    `buildOpenPrViews` (`src/run-task.ts`) is where a producer is ASSIGNED, the same seam W1-T435
    used for `pendingAnswer`; `DISPOSITION_RULES`, `ConflictFileDiff`, `isPureConcurrentAddition`
    and `DEFAULT_SWEEP_POLICY` are all in `src/lib/sweep.ts`; the allowlist is in
    `src/lib/producer-completeness.ts`. Each declared source file has its owning suite declared
    beside it. `plan/policy.yaml` is deliberately NOT declared — design (iv) keeps the default a
    literal, the choice W1-T932 already recorded. `src/lib/escalate.ts` is NOT declared: the
    escalation string is built from the disposition reason inside `sweep.ts` and needs no edit
    there, and declaring an untouched file fails `inverseScopeUntouchedFiles`.

    ONE PROOF IS A GREP NAMING A SYMBOL THAT DOES NOT EXIST YET in that file (`mergeConflict` in
    `src/lib/open-prs-rest.ts`, which reads 0 today against a `mergeState` control of 6). That is
    the point: it stays red until a producer genuinely lands in the module where the sibling field
    was wired, which is the minimum this task owes. The remaining proofs run whole existing suite
    files rather than naming titles, so they parse today and execute whatever the implementation
    adds — the same form W1-T981 used and merged.

    THIS TASK DELIBERATELY SHIPS A CHANGE THAT ALTERS NO BEHAVIOUR. That is not an oversight and a
    reviewer should not ask it to prove a behavioural delta. The measured position is that the
    evidence is missing (rationale 1-2) AND that the predicate which would consume it is wrong for
    the only shape it would admit (rationale 5-6). Wiring evidence while declining to act on it is
    the only move that improves the artifact a human reads without betting on an untested refusal.
    A worker that turns the flag on to make the diff feel substantial has inverted the task.
