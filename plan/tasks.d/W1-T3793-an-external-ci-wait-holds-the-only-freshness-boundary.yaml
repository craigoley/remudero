  rationale: |
    OBSERVED ON THE LIVE CORE DAEMON, 2026-09-19. After an operator-authorized restart, the
    process booted at `160f4d1b`. Origin then advanced materially to `9823e84b` (`src/lib/skill-
    workshop.ts` and `src/run-task.ts`). The production freshness predicate, invoked directly in
    the running checkout, returned `status:"assessed", dirty:false` and
    `daemon:{stale:true,oldSha:"160f…",newSha:"9823…"}`. A review then correctly refused to post
    a terminal verdict because its reviewer code was materially stale.

    THE PROCESS COULD NOT ACT ON THAT TRUE READING. Its only live lock was a daemon-owned
    `fix-branch` lock, and process inspection found no `codex exec` worker nor worker child—only
    the daemon and a Codex app server. The task's retained phase was `run.awaiting_external`
    with `waiting_on:"ci"`. `runTaskBody` awaits `waitForCiGreen` after opening a PR; that polling
    loop yields JavaScript timers but does not settle `runTask`. `runDaemon` awaits every `runOne`
    in its dispatch `Promise.allSettled`; its normal self-freshness boundary is above the next
    dispatch cycle. The light sweep remains active while that promise waits, which is why the
    queue looked alive, but it cannot cause the main loop to re-enter its freshness decision.

    W1-T1211 deliberately made the same retained phase sufficient to admit a repair beside an
    in-flight run, because it means GitHub—not a worker—is the blocker. W1-T2379 separately
    detached a sweep fix wait so the light ticker is not CI-bound. Neither makes the DAEMON'S
    original dispatch wait safely relinquish control for a freshness restart. Treating those
    shipped fixes as if they solved this would be a false credit.

    The immediate operator restart was safe and booted `9823e84b`, proving that the blocked action
    did not need to survive in-process: the ordinary sweep re-derives the PR queue after boot.
    It is not a durable fix. Repeating that manual judgment whenever source advances is precisely
    the ROI loss this task owns.

    OVERLAP RULING. W1-T12a, W1-T143, W1-T147, W1-T151, W1-T160, W1-T249, W1-T254, W1-T988 and
    W1-T3116 all declare the same two orchestration files. That is a file-level scheduling overlap,
    not evidence they own this mechanism. This task neither changes their status, repository,
    install, dispatch, or maintenance decisions nor retires any of them. Its exclusive question is
    whether a currently safe, already-recorded external wait may voluntarily return so the existing
    freshness restart can occur. W1-T1211, W1-T2379, W1-T2865 and W1-T3756 are the direct semantic
    predecessors; the broader references make this conflict visible to the dispatcher instead of
    hiding it by narrowing the declared files.
  design: |
    Add a cooperative, daemon-only freshness interruption to the external CI-wait boundary. It
    may be checked only after the run has entered `run.awaiting_external` and at a stable point
    before a new CI poll can proceed to review, repair, or another worker. When the daemon's own
    freshness read is materially stale, the wait returns one named non-terminal outcome; `runTask`
    releases its normal in-flight/branch claims and returns that outcome. The next daemon cycle
    then follows its existing `stopForFreshness` path, including the bounded detached-action drain
    and entrypoint re-sync.

    This is deliberately cooperative, not a `Promise.race` that kills `runTask` underneath a
    future worker. A live implementation, review, or fix worker remains non-interruptible and
    continues to completion; a CI response that becomes green before the safe checkpoint follows
    the ordinary review and auto-merge path. The interruption is unavailable to manual `rmd`,
    retro, plan, and triage waits: only the daemon supplies the callback. Ledger the named yield
    with its SHA pair so a future reader can distinguish a voluntary safe handoff from a CI stall
    or a worker abandonment.

    Do not reduce the poll interval, add a second ticker, age out locks, restart on degraded or
    dirty freshness, or loosen W1-T2865's drain. Those would either re-open the relaunch storm or
    interrupt work that is actually producing a PR. The task replaces exactly the unproductive
    external-wait state, not the worker-safety boundary.

    FILES NOTE (W1-T3730): the build adds its new test after this filing. It is omitted from
    `files:` so the plan-only PR does not claim to resolve a future test filename.
  acceptance:
    - claim: "a materially stale daemon yields only from an already-recorded external CI wait and reaches the existing freshness restart path"
      proof: "unit test: W1-T3793: a stale daemon yields an external CI wait"
    - claim: "the daemon-only freshness callback is confined to the already-recorded external CI wait, so a live worker cannot reach the new handoff boundary"
      proof: "grep: const freshness = deps[.]externalWaitFreshness[?][.][(][)]; in src/run-task.ts"
    - claim: "a yielded external wait releases its ordinary run claims and leaves a named SHA-pinned ledger record"
      proof: "unit test: W1-T3793: external wait handoff releases claims with freshness evidence"
  falsifier: |
    Remove the cooperative external-wait callback and restore the unbounded `waitForCiGreen` await.
    The first and third tests and the new call-site proof must fail because the daemon cannot return
    to its ordinary freshness exit while CI remains pending. The retained live-worker test is an
    unchanged safety invariant, not acceptance evidence: it passes at the merge base because the
    old daemon also did not interrupt live workers. Re-introducing it as a proof would re-create
    the same non-discriminating acceptance failure.
