  rationale: |
    Replaces W1-T3805 and the breakdown half of W1-T3806. Existing retained evidence can classify
    terminal outcomes and work categories, but cannot claim post-merge reverts or follow-up fixes
    without W1-T3795's attributed producer. The breakdown producer and its real top-level route
    caller must be verified together.
  design: |
    Add bounded outcome and work-category aggregators, then compose dimensions and drilldowns as
    top-level GET /v1/analytics fields. Keep missing terminal receipts and unknown categories as
    named denominator-bearing buckets; never relabel worker/proof failure as success, revert, or
    follow-up fix. Empty, unreadable, unauthorized, and not-collected states remain explicit and
    do not become empty measured arrays. Do not change routing policy or expose credentials.
