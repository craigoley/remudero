  acceptance:
    - claim: "before a recorded recovery's mutating action (fix dispatch, update-branch, rerun, escalation filing) the sweep re-reads the PR from GitHub and acts only when repo, number, head SHA and base SHA equal the record's evidence and that evidence was observed at that same pair; a moved head, moved base, closed or merged PR, or an unreadable read takes no action and writes a named stale or unobservable reason"
