      proof: "unit test: test/sweep/a-recovery-action-is-fenced-by-a-fresh-read-and-leaves-one-verified-receipt.test.ts"
    - claim: "no recovery deadline, age or wake closes or rebuilds a PR; a close stays with W1-T11077's verify human route and its seven-day loop.decision shadow evidence"
      proof: "unit test: test/sweep/a-recovery-action-is-fenced-by-a-fresh-read-and-leaves-one-verified-receipt.test.ts"
