  title: "A PR RECOVERY ACTION IS FENCED BY A FRESH GITHUB READ OF ITS EXACT (REPO, PR, BASE SHA, HEAD SHA) AND LEAVES ONE IDEMPOTENT OPERATION RECEIPT THAT IS TERMINAL ONLY AFTER ITS POSTCONDITION IS RE-OBSERVED — W1-T11751/W1-T11752 give each (PR, head, class) an owner, wake and deadline, but the action the owner takes still runs on the pass's snapshot, writes no receipt a replay can see, and calls itself done without reading back what it changed"
