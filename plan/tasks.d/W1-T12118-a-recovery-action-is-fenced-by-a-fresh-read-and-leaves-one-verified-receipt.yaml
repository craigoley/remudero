      proof: "grep: fencedRecoveryAction( in src/lib/sweep.ts"
  rationale: |
    THE ASK (operator brief, run PLAN-expand-1794323791989): each PR gets a bounded exact-head recovery lifecycle
    keyed by repo, number, base SHA and head SHA, with one route, owner, wake/deadline, evidence freshness, an
    idempotent operation receipt and terminal verification. Webhooks may wake it. GitHub is re-read before an
    action. A periodic reconciler stays. Nothing closes or rebuilds on age alone.

    RESEARCH (https://docs.github.com/en/webhooks/using-webhooks/best-practices-for-using-webhooks): a missed
    webhook must be redelivered, and a redelivery reuses the same X-GitHub-Delivery id. So a webhook is a wake, not
    a source of truth. The periodic pass must still reconcile, and an action must be idempotent across a repeated
    delivery.

    READ in this worktree:
    - src/lib/github-event-wake.ts already verifies signatures, dedups by delivery id
      (createPersistentDeliveryDedupStore) and only writes a sweep wake marker. The sweep is the periodic
      reconciler. WEBHOOK WAKE AND THE RECONCILER ALREADY EXIST, AND THIS TASK ADDS NEITHER.
    - src/lib/pr-blocker.ts PR_BLOCKERS / PR_BLOCKER_OWNERS give each blocker exactly one owner (the route).
    - W1-T11751 (queued) records (repo, PR, head SHA, failure class) with owner, action, wake_at, deadline_at and a
      terminal receipt, in shadow. W1-T11752 (queued) lets the escalation site defer, wake or escalate on that
      record. Neither fences the action on a fresh read, keys an operation receipt, or verifies a postcondition.
    - src/lib/action-reconciliation.ts reconcileExternalEffect already models a postcondition-checked external
      effect (applied/refused/pending/stale/unobservable). This task reuses it and adds no second effect model.
    - W1-T11611 (queued) measured the race this fences in one place: applyStrikeLadder read the head, spent a
      model call, then closed with no second read.

    Settled by lookup: is this already filed or already decided? -> In part. Owner, route, wake and deadline are
    W1-T11751/W1-T11752's, and the webhook wake and its dedup are github-event-wake.ts's. The rebuild close's own
    fence is W1-T11611's. W1-T8912 (successful unchanged-PR observations survive restart) and W1-T9125 (review
    status re-evaluation for stale body mismatches) cover observation and review freshness, not actions. The
    fenced action, operation receipt and verified terminal are unfiled (plan/tasks.d/W1-T11751-*, W1-T11752-*,
    W1-T11611-*, W1-T8912-*, W1-T9125-*).
    Settled by lookup: does base SHA join the record key? -> No. W1-T11751 keys (repo, PR, head, class), and a
    main advance would otherwise supersede ownership on every merge. Base SHA enters as evidence freshness and
    as part of the operation receipt key, so a moved base stales the evidence without resetting the owner.
    Settled by lookup: may a deadline close or rebuild a PR? -> No. W1-T11077 is verify: human and is released
    only after seven days of W1-T11076 loop.decision rows and an operator spot-check (plan/tasks.d/W1-T11077-*).
    Settled by lookup: must this auto-trigger the semantic review? -> No new trigger. The review lane already
    spawns the semantic reviewer for tasked PRs (W1-T3387, merged), and the unfiled-PR gap is W1-T5865 (filed).
    An awaiting-review blocker's owner is review-lane, so this task only fences that lane's action like any other.
  design: |
    1. fencedRecoveryAction(record, { readPr, act, readPostcondition, priorReceipts, nowMs }) in
       src/lib/pr-recovery-record.ts. readPr returns {state, headSha, baseSha} from GitHub at call time. It refuses
       unless state is open, the head and base equal the record's evidence pair, and the evidence observed_at
       pair is the same pair.
    2. Receipt: pr.recovery.operation {key, base_sha, action, transition_id, phase: pending|applied|refused|stale|
       unobservable}. A pending or applied receipt for the same key short-circuits the call. The pending row is
       appended before act().
    3. Terminal verification goes through reconcileExternalEffect with the action's postcondition (for example, a
       dispatch lands a fix.dispatch row at this head, an update-branch moves the head, or an escalation issue
       exists). Only an applied result writes W1-T11751's terminal receipt. A pending result is left for the next
       periodic pass.
    4. The sweep routes the W1-T11752 `wake` arm's rung through fencedRecoveryAction. Close and rebuild are not
       actions this entry point accepts.
    5. The pr.recovery.operation step joins the rotation-retained set alongside W1-T11752's pr.recovery steps.
    6. Tests: a matching fresh read acts once; a replay acts nothing; a moved head, a moved base and an unreadable
       read each act nothing with a named reason; an unobserved postcondition stays pending, then goes terminal
       on the pass that observes it; and a close request is refused.
  falsifier: |
    Remove the re-read: the moved-head fixture acts on the stale head and criterion 1 fails. Append the receipt
    after act() instead of before: a crash between the two replays the action, and the replay case fails.
