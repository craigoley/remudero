  rationale: |
    OBSERVED 2026-11-17 in the host ledger for #19122 (task W1-T13352, head e1493c7):
    16:44:25Z sweep.disposed acted=true, dispatching the fix rung to repair the PR body (blocker plan-proof-unrunnable).
    16:54:37Z and 17:00:19Z sweep.disposed acted=false: "duplicate fix-dispatch key (W1-T13352@e1493c7...) already claimed
    this pass — a concurrent sweep is already dispatching this PR's fix rung". All three rows are from the same daemon
    (pid 151, run DAEMON-1794931579534-7), on different passes, so the reason text is false.
    17:01:44Z sweep.fix_capacity for run work-fix-dispatch-W1-T13352-1794933172319 (epoch = 16:32:52Z): the child started
    about 29 minutes after its envelope, with 5 of 8 workers active and pressure tier fits. No row between 16:44 and 17:01
    shows the child queued, spawned or refused. The operator merged #19122 by hand at 17:01:01Z.
    OBSERVED at origin/main 43941cf: claimFixDispatch in src/lib/sweep.ts refuses when inFlightFixKeys has the key and
    falls back to the "already claimed this pass" literal when detachedFixHolder finds no holder. hostFixDispatch hands the
    key to the work host's registry, which holds it until the child settles.
    INFERRED, not traced line by line: the key stays claimed while the host child waits in the host queue, and nothing
    registers that wait as a holder or bounds it.
  design: |
    OBSERVED at origin/main 43941cf: hostFixDispatch awaits host.spawnFix while this pass's claim holds the key, and
    spawnRunChild waits for a reservation inside that await (reserveWhilePending). Nothing registers that wait as a holder,
    so a later pass's claimFixDispatch finds the key with no detached holder and prints the same-pass literal.
    1. run-child.ts spawnFix passes an onPending hook through to spawnRunChild (it already exists on SpawnRunChildInput).
    2. sweep.ts records a pending holder per fix key while host.spawnFix waits: since-ms, and once onPending fires, the
       child run id and its abort. It writes one ledger row (sweep.fix.child_queued) with the PR, fix key and run id, and
       claimFixDispatch reports the holder ("waiting for the work host to admit run R for Ns").
    3. Past a named bound, a later pass aborts the pending wait. reserveWhilePending's existing abandon path carries the
       wait's start forward, hostFixDispatch releases the claim and ledgers sweep.fix.dispatch_failed, and the next pass
       may dispatch again. The sweep also ledgers the release with the wait.
    4. The "already claimed this pass" literal stays for a claim with no recorded holder.
    INVARIANT same-pass-race-unchanged: a same-pass duplicate claim is refused exactly as today.
  falsifier: |
    At origin/main, a fixture that queues a host fix child and runs two more sweep passes before it starts logs the
    "already claimed this pass" reason on both and never releases the key.
  note: |
    Reserved with rmd next-task-id --count 2 --branch claude/project-thread-7ycldf on the operator's Mac mini
    (2026-11-17 17:04Z).
