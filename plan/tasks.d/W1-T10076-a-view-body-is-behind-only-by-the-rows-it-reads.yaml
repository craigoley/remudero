  rationale: |
    READ at origin/main a1343d257 (symbols):
    - read-model-worker.ts READ_MODEL_LEDGER_STALE_MS = 10_000, documented "A projector whose last good tick is
      older than this makes its ledger:<i> source stale"; view-freshness.ts LEDGER_BUDGET_MS = 10_000 says the
      same. The projector ticks every READ_MODEL_TICK_MS = 250 ms.
    - builtLedgerSource (added by #10435, 2026-10-09): once the projector's newestTs passes the body's built asOf,
      lagMs = now - builtAsOf, and past READ_MODEL_LEDGER_STALE_MS the source reads stale with the reason the
      console showed ("built from the ledger as of X, N s old (budget 10 s); the projector has newer rows").
      Every new ledger row counts, whatever the view reads, and core appends rows every few seconds.
    - instances-view.ts createInstancesView: the body's only ledger input is instance_heartbeat (k = 'daemon'),
      judged against INSTANCE_LIVENESS_BOUND_MS (minutes). Its capability contract (servedCapabilities ->
      instanceInboxCapabilities(stateDir)) reads state-dir files, not the ledger. Yet its sources are
      registry:repo plus ledger:<i> for every projected instance, so any instance's unrelated row makes the whole
      catalogue stale, and the console withholds conversation actions on stale.
    OBSERVED 2026-10-17 17:04-18:59Z, core live ledger, read_model.slow_view rows: now@core 124 builds, 1,759 s in
    total, max 73,423 ms; now@console 58, 205 s; workstreams 33, 124 s; repositories 24, 93 s. 660 rows;
    read_model.materialize_deferred named now@core 171 times, workstreams 150, instances 5. So a cheap body waits
    behind multi-second builds and is re-read tens of seconds apart, against a 10 s budget.
    The console's second half of the banner ("the live instance catalogue could not be reached") is a read that
    timed out while serve's loop was blocked; that is W1-T10074.
  design: |
    1. A read-model view may declare what it reads from the ledger: `ledgerReads(db)` returns the newest projected
       instant among the rows that can change its body (the instances view: instance_heartbeat.last_ms for
       k = 'daemon'). The worker stamps each body's ledger source with that instant as `asOf`.
    2. builtLedgerSource judges a body by its view's declared reads when it has them: the body is behind only when
       the projector holds a NEWER row of those reads than the body was built from, and then by that row's age
       against the projector budget. A view with no declaration keeps today's judgement exactly.
    3. The projector's own tick freshness (ledgerSource: failures, catching up, warming, tickedAt older than the
       budget) still makes every body stale, so a stalled projector is never hidden.
    4. The instances view declares its heartbeat read. Its capability contract keeps registry:repo as its own
       source; no new source name, field or route is added, so the console needs no change to pin.
    5. TESTS in test/a-view-body-is-behind-only-by-the-rows-it-reads.test.ts, test( titles verbatim as below.
