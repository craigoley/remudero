- id: W1-T9845
  title: "THE BENCHMARK COHORT CHECKPOINT IS NEVER READ OR WRITTEN SYNCHRONOUSLY ON THE DAEMON LOOP — runBenchmarkCohortPass's readCheckpoint (readFileSync + JSON.parse) and writeCheckpoint (JSON.stringify + writeFileSync) run on the daemon's own thread over a 37.15 MB file that keeps growing, and on 2026-10-16 readCheckpoint was the top frame of a 14.4-min loop freeze (lag 863,946 ms: a 328 s readFileSync plus 221 s of GC) that ended in a watchdog recycle: the daemon's cohort pass runs in a worker thread"
  repo: remudero
