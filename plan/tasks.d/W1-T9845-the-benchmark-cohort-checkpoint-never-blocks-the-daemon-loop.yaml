  budget_usd: 6.00
  risk: high  # Rule 19: one concern — which thread the daemon's cohort pass runs on; the pass's computation and checkpoint format are unchanged
  band_meaning: blast-radius
  origin: "daemon.loop_stall_profile 2026-10-16T06:10:39Z (operator-approved P1 raise recorded on W1-T8876); coordinator fan-out 2026-10-15 brief B21"
