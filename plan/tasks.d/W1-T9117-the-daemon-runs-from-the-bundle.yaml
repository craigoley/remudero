    - claim: "a demotion marker from a failed bundled boot makes the next boot take tsx"
      proof: 'grep: test("W1-T9117: a failed bundled boot demotes the next boot to tsx" in test/the-daemon-runs-from-the-bundle.test.ts'
    - claim: "auto promotes only after a shadow boot cycle no worse than tsx on the same boot"
      proof: 'grep: test("W1-T9117: auto promotes on a shadow cycle no worse than tsx" in test/the-daemon-runs-from-the-bundle.test.ts'
    - claim: "the bundle script resolves the daemon argv for the launcher"
      proof: "grep: daemonEntryArgv( in scripts/build-child-entries.mjs"
    - claim: "ADR 0006's daemon carve-out is superseded by a new ADR, not rewritten"
      proof: "grep: Superseded in part by in docs/adr/0006-precompiled-daemon-child-entries.md"
  falsifier: |
    Ignore the worker check and the stale-worker test gets a bundle argv for a daemon whose read-model worker has no
    bundle. Skip the marker and the demotion test boots the bundle again after a failed boot. Promote on a count of
    boots and the auto test promotes a cycle whose probe peaked above the tsx boot.
  note: |
    SHADOW-VALIDATE, BEFORE AND AFTER, from the core ledger union and host, with no numeric pass mark: boot time
    (`daemon.boot` to first `daemon.tick_phases`), daemon RSS and VmHWM (`daemon.alive`, first 10 minutes and
    10-30 minutes of uptime, as ADR 0007 split them), and tsx cache churn (bytes written under the daemon's tsx cache
    directory per hour, read by `du` and mtime on the host, against ADR 0006's ~700 MB/h fleet figure). Healthy shape:
    the bundled boot is no slower and no larger than the tsx boot of the same sha, and the daemon writes no tsx cache.
    ORDER: after W1-T8777 (worker bundles). W1-T8777's priority raise and W1-T9091 came in PR #11347, merged
    2026-10-13 before this filing was opened.
