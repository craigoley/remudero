  note: "verify:auto — every claim is decidable in-process against a synthetic checkout with an
    injected transport; no second machine and no live push are required to prove routing.
    risk:high is Rule 19's SPAN, set UP FRONT: files: crosses src/lib/feedback.ts, src/run-task.ts
    and a new suite, which the sizing check reads as several concerns. The band is NOT a claim that
    this is dangerous — the recon rates it days, not weeks, precisely because a reporting-only path
    needs no lock and no shared ledger. The genuine risk is scope creep INTO those, which is why the
    design names them as forbidden rather than merely out of scope.
    RULE 25 CHECKED BEFORE FILING: files: contains no INSTRUMENT_SURFACE path (no .github/workflows/,
    no scripts/*-ratchet.mjs, no scripts/*-baseline.json), so detectInstrumentEntanglement has
    nothing to refuse. W1-T386 cost three PRs and an operator ruling by tripping that at review time.
    budget_usd 80 — above W1-T396's 60: three design questions must be ARGUED rather than
    implemented (transport, unreachable-home behaviour, absent-pointer default), and each changes
    what an operator lives with.
    CREDENTIALS, ESTABLISHED SO THE SEQUENCING IS NOT GUESSED AT: worker credentials go through
    `ensureWorkerKeychain`/`unlockWorkerKeychain` — a macOS keychain copied per worker and stamped
    from the login keychain. That is machine-bound by construction and does not travel. It does NOT
    block this task: a reporting-only instance needs a GitHub push credential, not the Claude
    keychain, which is a materially smaller provisioning problem than a dispatching instance's.
    ON THE PROOFS. All four name test/upstream-feedback-routing.test.ts, which does not exist yet:
    a FORWARD REFERENCE TO A PATH, safe per CLAUDE.md, declared in files: so the worker creates it.
    NO depends_on: independent of W1-T396. They are the first two steps of one sequence but neither
    blocks the other."
