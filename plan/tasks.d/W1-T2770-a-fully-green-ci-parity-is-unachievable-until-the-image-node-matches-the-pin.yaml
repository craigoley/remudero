    FALSIFIERS, EACH HALF, PROVEN INDEPENDENTLY. Reverting the Dockerfile pin alone failed 1
    guard (the FROM-line assertion); reverting the cluster entry alone failed 3 guards (fires on
    drift, fires on opposite direction, names the exact file/count). Restoring both returned
    `# fail 0` on the standalone test file. The highest-value guards (informational contract,
    ci:test not gated) stayed green in both falsifier states — proving they are not accidentally
    coupled to either half, exactly as W1-T2769's PATH-inheritance guard is not.

    CALLER + CENSUS SWEEP: 9 files — every consumer of the touched symbols (`HostFacts`,
    `HOST_CAUSED_SUITE_REDS`, `hostCausedSuiteRedsStep`, `hostCausedSuiteRedsForFacts`,
    `computeHostFacts`, `detectHostFacts`), the Dockerfile-census suites
    (`binary-pin-rung.test.ts`, `entrypoint-boot.test.ts`, `fleet-heartbeat-image-sha.test.ts`,
    `image-drift.test.ts`, `recycle-container.test.ts`, `verify-image-probes.test.ts`), and
    `merge-lcov.test.ts` itself — ran together as `# tests 174 # pass 168 # fail 6`. The 6
    failures are exactly the merge-lcov Node-pin ones the cluster now annotates — they persist
    on THIS host until the image is rebuilt, and that IS the diagnosis this task publishes.

    THIS TASK DOES NOT DISPATCH `acr-build.yml`. That is the operator's action, and it happens
    AFTER this merges. Between this merging and the image landing, the cluster's
    `ci:host-caused-suite-reds` step tells `--ci-parity` runs on the host why those six are red
    without needing a human to re-derive the same investigation.

    THIS TASK DOES NOT ADVANCE `.nvmrc`. `22.22.3` is the pin the coverage-merge ratchet was
    written against; moving it is a distinct call and would touch a different set of assumptions
    (Node internals API stability), out of scope here.
