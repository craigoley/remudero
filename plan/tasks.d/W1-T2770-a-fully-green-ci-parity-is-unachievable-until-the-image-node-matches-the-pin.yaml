  note: |
    ID PROVENANCE: W1-T2770 was reserved and supplied directly by the operator. Both scope-time
    checks ran clean at branch-out: `git ls-remote --heads origin 'run-W1-T2770-*'` returned 0
    and the anchored trailer scan returned `[]`, each qualified by a positive control on
