  note: |
    FILED FROM followup:W1-T2458-1788035402626:2026-08-29T20:33:15.794Z:1 (run W1-T2458-1788035402626),
    which asked whether repos/remudero's main ref is genuinely stale or intentionally pinned. THAT
    QUESTION IS ANSWERED AND NO TASK RE-ASKS IT: MASTER-PLAN.md:3418 records the checkout as genuinely
    stale with a measured per-cycle series (85 -> 155 -> 278 -> 371), so the follow-up's research half
    is closed by citation, and only its unowned consequence is filed here. A future reader tempted to
    re-open the pinned-vs-stale question should start at that line.
    `risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, and independently because
    src/lib/worker.ts is the worktree-and-spawn path, where the honest failure direction is a
    measurement that throws and takes dispatch down with it. Acceptance claim 2 is the guard for
    exactly that and is load-bearing, not defensive.
    `verify: auto` — unlike W1-T494 and W1-T491, which rank no surface and correctly defer to the
    operator, this task's surface is already determined by the coupling it measures: the symlink site
    is the one place the system knows the deps source. Every criterion is provable in-process over an
    injected git runner, with no live fetch and no real worktree.
    EVERY CRITERION IS `unit test:` WITH A PURE PATH, deliberately. The pure-path form both lint-passes
    and EXECUTES the whole file, where a `unit test: <path> — <sentence>` shape parses as a
    name-filtered proof whose sentence matches zero test titles and caps the implementation at
    `proof_exec: 0/N` (the W1-T253 amendment, measured against the real executor after #901). An
    all-`grep:` shard naming its own path additionally draws a `proof-scope` warning that blocks in
    CI's changed-tasks pass.
    `files:` IS TWO PATHS. `src/run-task.ts` is NOT declared — nothing here touches it, and naming it
    serialises this task against every other that does (W1-T471). `scripts/fleet-heartbeat.sh` is NOT
    declared: that file is W1-T494's, and declaring it would both duplicate that task and trip
    file-overlap serialisation (W1-T171) for no edit.
    PROVENANCE. The `linkWorktreeNodeModules` call at src/lib/worker.ts:2803, its best-effort doc
    contract, the deny-floor's independent statement of the same coupling, the tasks.yaml
    refresh-the-canonical-checkout binding rule, W1-T494's NO-FETCH scope and its "the beat never asks"
    concession are ALL tree facts read at source while drafting. The commit distance and the
    #1485/#3273 PR gap are ASSUMED, carried from MASTER-PLAN:3418 and the originating follow-up — that
    drafting pass had no route to run git and does not pretend otherwise.
