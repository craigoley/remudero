- id: W1-T2570
  title: "THE SHARDED COVERAGE GATE BLOCKS A MODULE THAT COMPILES TO NOTHING — findMissingSourceCoverage refuses any changed src/**.ts with no SF record as a vacuous pass, but a PURE TYPE MODULE emits no SF record because there is nothing to instrument; MEASURED 2026-09-01: a synthetic type-only module produces no record while its consumer does, and four such files sit on main (workflow-run.ts, merge-state.ts, run-result.ts, supersession.ts), every one matching the gate's filter verbatim and every one existing deliberately to cut a dependency cycle"
  repo: remudero
