  design: |
    No cap, no sampling and no new bound: a row per full walk, nothing else changes.
    1. THE WALK REPORTS ITSELF. `fetchBoardPrsRest` and `fetchBoardPrsRestAsync` time the walk and, when the result's
       `mode` is `full` and it walked the closed half, append `github.closed_pr_full_walk` {caller, half, pages (the
       closed half's page count), rows, duration_ms, truncated}. The ledger adds actor, pid and run id as for every
       row, which is what attributes a walk made by a spawned `rmd` child. The sink is injectable and defaults to the
       ledger append the rest of status.ts uses; a failed append never fails the walk.
    2. THE CALLER IS NAMED, OR DERIVED. Both functions and `buildBatchedGithub` take an optional `caller` string, passed
       through to the walk. Each construction named in the rationale passes its own function name. A walk with no
       `caller` derives one from the stack: the first frame outside open-prs-rest.ts and status.ts, as `file:function`,
       so an unnamed construction (or a new one) is still attributed, never `unknown`.
    3. DELTA WALKS STAY SILENT. A `delta` walk writes nothing new; `board_gateway.fetch_bytes` already covers them.
    Tests go in test/every-full-closed-pr-walk-names-its-caller.test.ts, with `test(` titles verbatim as in the proofs
    below. Drive `fetchBoardPrsRest` with a fake fetcher that serves numbered pages and a recording sink.
