      - THE SHARED HELPER. `boardPrsWalk` (src/lib/open-prs-rest.ts), behind `fetchBoardPrsRest` and
        `fetchBoardPrsRestAsync`, is the only closed-PR walk in src/ that pages to the end of the closed set: its mode
