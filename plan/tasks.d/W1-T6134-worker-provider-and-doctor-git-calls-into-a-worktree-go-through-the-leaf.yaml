  rationale: |
    READ 2026-10-07 on origin/main f43378343 and the open W1-T6123 head (run-W1-T6123-1791348460000, 0ebe8b64d).
    Static reading only. W1-T6123's `WIDENED_SITE_EXCEPTIONS` gives src/lib/worker-provider.ts 8 ("WORKTREE
    (follow-up conversion, no owner yet)") and src/lib/report-commands.ts 7 ("WORKTREE (follow-up conversion)" for two
    of them). Counting its `widenedGitSites` per function at origin/main:
    WORKER-PROVIDER.TS. isGitWorktree 1 (`execFileSync("git", ["rev-parse", "--is-inside-work-tree"], { cwd })`),
    codexGitWritableRoots 1 (`rev-parse --path-format=absolute --git-dir --git-common-dir` with `{ cwd }`, whose
    answer becomes extra WRITABLE roots for the codex sandbox, so a rewritten pointer chooses what is granted, bounded
    only by the `isWithin(configRoot)` filter), and selectOpenWeightUnitTestSuites 5 (`run("git", …)` over the
    injected `PreflightSpawn`, defaulting to `defaultPreflightSpawn` in the worker worktree: `merge-base`, `diff
    --name-only`, `ls-files --others`, `diff -U0 … -- src scripts bin`, `ls-files -- src scripts bin test`); the two
    `diff` calls carry no `--no-ext-diff --no-textconv`, and `ls-files` and `diff` honour core.fsmonitor.
    codexExecArgs's `-C` is codex's own flag (NOT GIT), not this task.
    REPORT-COMMANDS.TS. defaultReadWorktreeHead (`rev-parse HEAD`, `{ cwd: worktreePath }`) and
    defaultIsWorktreeBaseAncestor (`merge-base --is-ancestor`, `{ cwd: worktreePath }`) are doctor's per-worktree
    reads (W1-T2627). The other five (reportOwnerRepo, readCheckoutDepth 2, statusCommand, learningsExportCommand)
    read the repo root: CHECKOUT, not this task.
  design: |
    (1) The seven WORKTREE sites run through `hostWorktreeGit` / `hostWorktreeGitAsync` (src/lib/worktree-git.ts):
    for selectOpenWeightUnitTestSuites, the DEFAULT `PreflightSpawn` routes a `git` call through the leaf while the
    seam's shape stays as is, so its tests keep injecting. (2) The answers keep their fail-closed meanings:
    isGitWorktree reads false and codexGitWritableRoots reads [] on a refused pointer; doctor's two reads keep
    W1-T2627's distinction (absent `undefined` vs undecidable), with a refused pointer reported as undecidable, never
    as `false`. (3) Lower `WIDENED_SITE_EXCEPTIONS` for both files to exactly what is left, each reason CHECKOUT or NOT
    GIT with its function named. (4) Argv and outputs otherwise unchanged.
  acceptance:
