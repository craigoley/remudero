  note: |
    `risk: high` WAS SET BY THE LINTER, NOT ASSERTED BY THE AUTHOR. A first draft filed at
    `medium` and `rmd lint-plan --base origin/main` refused it, exit 1, verbatim:
    *"[sizing] spans 3 distinct subsystems/concerns (operator-guide, recycle-container,
    runbook-coverage) at risk:medium — Rule 19: raise to risk:high or decompose into one task
    per concern"*. Raised on that refusal. Decomposition is the rule's other option and is
    declined with a reason: a script with no runbook section is undiscoverable, a section with
    no `REQUIRED_PROCEDURES` entry is ungated and rots (rationale 7), and an entry with no
    section fails its own check on the first run. The three are one procedure.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT, not by guess. `REQUIRED_PROCEDURES` reads 4 in
    `src/lib/runbook-coverage.ts` and 14 in `test/runbook-coverage.test.ts`; `checkRunbookCoverage`
    reads 5 and 12. Both are declared because the append and its fixture are one change. The script's
    own new path is declared because it is the deliverable. **`src/run-task.ts` IS NOT DECLARED** —
    it holds `COMMANDS` and is declared by 221 shards (W1-T471), and design (v) refuses the verb
    shape that would have required it. `deploy/entrypoint.sh` is NOT declared either: 11 shards name
    it, it is the BAKED path, and this task changes nothing in it.

    THE MEASUREMENTS ARE QUERIES. Re-derive with `git grep -woF <symbol> -- <path>`, `docker inspect
    --format '{{len .Mounts}}'`, and the real `detectInstrumentEntanglement` import — never from the
    numbers written above, which move.

    ONE PREMISE OF THE ORIGINATING BRIEF WAS WRONG AND IS CORRECTED IN RATIONALE (6) RATHER THAN
    CARRIED: W1-T978 was described as unbuilt; it merged today as #2117 and is live on the mount.
    The lock refusal survives that correction, but for a different reason — a host-side caller can
    never satisfy `defaultInContainer`, so the limitation is structural rather than pending.
