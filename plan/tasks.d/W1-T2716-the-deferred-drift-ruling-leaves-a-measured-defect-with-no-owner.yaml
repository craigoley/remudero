  rationale: |
    THIS AMENDS THE TASK BEFORE IMPLEMENTATION BECAUSE LIVE EVIDENCE FALSIFIED ITS PREMISE.
    W1-T2618 calls `recordCanonicalCheckoutDrift(repoDir, ref)` immediately after
    `linkWorktreeNodeModules(repoDir, worktreePath)`, but `linkWorktreeNodeModules` does not
    necessarily link from `repoDir`. `resolveNodeModulesSource` tries
    `<repoDir>/node_modules` first and then the running RMD install root. The detector discards
    which candidate actually won and unconditionally measures `repoDir` anyway.

    MEASURED 2026-09-02 IN THE RUNNING AZURE CONTAINER, READ-ONLY:
      - `/home/node/Remudero/repos/remudero` was 1,903 commits behind `origin/main` and had NO
        `node_modules` directory.
      - `/home/node/Remudero/remudero` was five commits behind after 21 observed entrypoint
        freshness cycles and DID own `node_modules`.
      - both live worker links inspected resolved to
        `/home/node/Remudero/remudero/node_modules`.
    Therefore the 1,903-commit warning names a real stale checkout but falsely calls it "the
    node_modules just symlinked into this worktree". Refreshing or refusing that cache would not
    change the dependency artifact a worker executes.

    COMMIT DISTANCE IS ALSO THE WRONG COMPATIBILITY TEST. Five source-only commits are harmless;
    one package.json/package-lock.json change can invalidate the dependency tree. W1-T151 already
    defines the correct content identity: SHA-256 over package.json + NUL + package-lock.json,
    persisted at `node_modules/.rmd-install-hash` after a successful install. Reuse that identity
    rather than treating every commit as dependency drift.

    THE SAFETY RULING. Capture the exact source selected for the symlink. Compare the worker
    worktree's install-input hash with the selected node_modules artifact's persisted install
    hash before a model starts. A match proceeds even when either checkout's HEAD is behind.
    A mismatch refuses or parks that dispatch with a named, ledgered dependency-source reason so
    the normal runtime freshness cycle can refresh the real owner safely; it never runs npm
    through a worker symlink and never mutates a shared dependency tree while workers are active.

    THE 1,903-COMMIT CACHE MAY STILL DESERVE HOUSEKEEPING, BUT IT IS NOT THIS DEPENDENCY DEFECT.
    `worktreeAdd` fetches and cuts code from current `origin/main`, so moving the local `main` ref
    in the cache is neither required for base currency nor evidence that dependencies changed.
  design: |
    Extract W1-T151's install-input hash and marker-path helpers from `src/run-task.ts` into the
    dependency-neutral `src/lib/install-inputs.ts`; both the service freshness gate and worker
    path consume the same implementation, never copies.

    Change node_modules linking to preserve the selected source path as structured evidence while
    retaining the existing best-effort link outcome. The compatibility check must examine the
    actual selected artifact, not `repoDir`, and ledger source, expected hash, installed hash and
    disposition with bounded hash prefixes rather than full file contents.

    Check compatibility after the worktree exists and the source is selected but before any
    worker/model spawn. A mismatch is deterministic and consumes no agent strike. It requests no
    package-manager action from the worker; runtime refresh remains owned by the entrypoint and
    service-freshness path.
  acceptance:
    # ⚠ EVERY PROOF HERE IS `unit test:`, AND THE WIRING CRITERION IS NOT AN EXCEPTION.
    # A `grep:` proof EXECUTES at review time. On an unbuilt task its symbol does not exist yet, so
    # it returns `executed_fail` — which OVERRIDES keyword coverage and FAILS the PR outright. A
    # `unit test:` proof naming a file declared in this shard's own `files:` grades `not_yet_built`
    # instead: a forward reference to work not yet written, which the reviewer states in as many
    # words is "not a failure". MEASURED on this shard: `grep: hashInstallInputs( in
    # src/lib/worker.ts` read `executed_fail` while the other six read `not_yet_built`, and that one
    # proof failed the PR on its own.
    #
    # THE WIRING REQUIREMENT IS UNCHANGED — only the dialect that carries it. The claim below still
    # demands that the PRODUCTION path call the helper, and the build must make the named suite
    # assert exactly that (an unwired helper is an unbuilt one). Asserting it inside the test is the
    # idiom this repo already uses for a producer/consumer census; what it must not be is a proof
    # that cannot pass until the code it describes exists.
    #
    # ⚠ AND THIS IS A KNOWN, MEASURED CONFLICT BETWEEN TWO GATES, NOT A PREFERENCE. `lint-plan`'s
    # [call-site] check WANTS the grep form for a new module and says so verbatim: "Add one of the
    # form: grep: <symbol>( in <the file that calls it>". `remudero-review` EXECUTES that grep and
    # fails the PR because the symbol cannot exist yet. MEASURED on this branch: with the grep
    # criterion, lint-plan reports the call-site warning ZERO times and the review posts FAILURE;
    # with this `unit test:` form, the review passes and lint-plan reports the warning ONCE. The two
    # gates cannot both be satisfied while the task is unbuilt.
    #
    # The trade is deliberate and made in this direction because the call-site check is a WARNING
    # ("0 failing"), while `executed_fail` BLOCKS. The build should restore the grep call-site
    # criterion once `hashInstallInputs` exists, when it can finally pass.
