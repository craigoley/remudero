  falsifier: |
    Close without implementation if `linkWorktreeNodeModules` is changed before this builds so it
    can prove the selected source is always repoDir on every production path, or if the two live
    worker symlinks no longer resolve to the runtime checkout. Commit distance alone does not
    falsify this amendment; dependency compatibility is content-addressed.
