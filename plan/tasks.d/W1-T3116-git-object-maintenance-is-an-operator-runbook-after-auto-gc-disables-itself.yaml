  rationale: |
    OBSERVED ON THE LIVE AZURE FLEET, READ-ONLY, AT 2026-09-08T03:37Z. The container runs Git
    2.39.5. Its daemon checkout reports `count: 18142`, `size: 277.74 MiB`, 13 packs / 52.26 MiB,
    one `tmp_obj_*` garbage entry, and a `.git/gc.log` last written at
    2026-09-07T05:16:44Z whose own message is `There are too many unreachable loose objects`.
    Disk is healthy (93 GiB free, 23% used), 12 worktrees are registered, none is prunable and none
    is locked. This is accumulated debt, not a disk emergency and not a reason to delay admission.

    THE CURRENT MAIN DETECTS BUT CANNOT RECOVER. W1-T2529 added the heartbeat's `gc_verdict`,
    deliberately as signal only. The container entrypoint repeats an operator recipe on every
    in-process freshness restart: remove `.git/gc.log`, then run `git gc --prune=now`. No production
    daemon path owns a safe action, records before/after object counts, backs off after a failure or
    verifies recovery. Routine object hygiene therefore becomes an SSH maintenance session after
    the failure has already made automatic GC self-sustainingly unavailable.

    TWO OPEN IMPLEMENTATION HEADS ATTEMPT THIS, AND THIS TASK CORRECTS RATHER THAN DUPLICATES THEM.
    W1-T3090 / #4527 head `520f9d8e` adds synchronous raw `git prune --expire=24.hours.ago`, removes
    `.git/gc.log` immediately BEFORE the child succeeds, refuses whenever ANY linked worktree is
    registered, and defaults its `openFileCount` seam to `() => 1`. W1-T3092 / #4532 head `26a53a22`
    wires that function into `logDiskReclaimRung`, called before EACH task worktree is added; the
    call injects no real open-handle reader, targets only the worker clone, and defaults the action
    off while still proposing a dry-run subprocess per eligible dispatch. The live canonical clone
    has 12 registered, non-prunable worktrees. Thus the open implementation cannot act even if its
    flag is armed, and its placement adds recurring work before useful queue work. Those are material
    head facts; the merged W1-T3090/W1-T3092 plan records are intent, not proof that recovery exists.

    DO NOT MERGE OR ARM THOSE OPEN HEADS UNCHANGED AND DO NOT ADD A THIRD REAPER. Keep
    `src/lib/object-reaper.ts` as the single module name, replacing its raw-prune contract if an old
    head lands first, or implementing the corrected controller there if neither does. The old PRs
    may be closed as superseded after this task is accepted; code worth retaining must first conform
    to this task's command, cadence, admission and verification contract.

    CURRENT GIT DOCUMENTATION CHANGES THE REMEDY. The Git 2.39 manual says `git maintenance`
    tasks take the repository object-database lock, recommends `git maintenance run --task=gc`
    instead of combining raw `git gc` with maintenance, and classifies `gc` as expensive and
    potentially disruptive because it deletes stale data. The incremental strategy instead runs
    commit-graph/prefetch hourly and loose-objects/incremental-repack daily; those tasks are designed
    for background concurrency, and `loose-objects` batches at 50,000. The fleet's exact installed
    binary confirms `maintenance run --task=<task>` is available. A scratch repository under that
    exact Git 2.39.5 binary also proved `git maintenance run --task=gc` returns zero and removes a
    pre-existing non-empty `gc.log` itself. The entrypoint's unconditional `--prune=now` and the open
    head's pre-success unlink are therefore the wrong primitives: the first removes Git's age safety
    margin and the second can erase the failure evidence without repairing anything.

    THE OPERATING GOAL IS ZERO ROUTINE OPERATOR WORK. Startup should publish the condition and admit
    queue work. A daemon-lifetime maintenance controller should compact ordinary growth on cadence,
    perform the heavier recovery only at a proven quiet boundary, and escalate only if its bounded
    retries cannot restore health. SSH remains incident recovery, never the normal path.
  design: |
    (i) ONE CONTROLLER, ONE CADENCE, NO PER-DISPATCH SUBPROCESS. Evolve `object-reaper.ts` into a
    repository-maintenance controller; remove or make unreachable the raw-prune API and the
    `logDiskReclaimRung` call. A pure decision consumes one repository survey (`git count-objects
    -v`, gc-log presence/content, last attempt state, active RMD lane count and disk verdict) and
    returns `healthy`, `incremental-due`, `full-gc-due`, `deferred` or `escalate`, with its reason
    and next eligible time. An unreadable survey never authorizes a destructive action.

    (ii) REMOVE MAINTENANCE FROM BOOT AND RUN ADMISSION. Boot may read and ledger the already-cheap
    failure signal, but starts no Git maintenance child and awaits no object census or cleanup. The
    controller is wired once on the daemon-lifetime cadence side after PR reconciliation and task
    admission have had their first chance. No review, fix or build call site invokes it. A busy queue
    defers heavy GC without resetting its due time; ordinary incremental work runs at most daily
    under the configured low-load policy. Maintenance can never make first review or first task
    admission slower.

    (iii) USE THE INSTALLED GIT CONTRACT. Ordinary cadence executes bounded, asynchronous
    `git maintenance run --task=commit-graph --task=loose-objects --task=incremental-repack`.
    A persistent failed-GC marker may select `git maintenance run --task=gc` only when the survey
    proves zero ACTIVE RMD workers/reviewers/fix lanes. The command's documented object-database
    lock is the authoritative cross-process exclusion; a contender fails and enters durable backoff.
    Registered but idle linked worktrees are not activity and never create a permanently false
    prerequisite. Never invoke raw `git gc`, `git prune`, `--prune=now`, `maintenance start`, cron
    or systemd; the daemon remains the one scheduler and Git remains the object-database lock owner.

    (iv) NEVER MANIPULATE GIT'S FAILURE MARKER. RMD does not unlink, truncate, rename or rewrite
    `gc.log`. The pinned Git binary proved that a successful explicit maintenance GC clears it.
    Therefore success requires BOTH child exit zero and a post-survey showing the marker absent and
    object state readable. Any non-zero exit, timeout, surviving/replaced marker or unverifiable
    post-survey is failure and enters backoff; RMD preserves Git's evidence byte-for-byte.

    (v) CADENCE AND FAILURE BOUNDS ARE POLICY DATA, NOT AN ARMING CEREMONY. The controller ships
    autonomous with conservative cadence, load and timeout limits; it does not wait for an operator
    to flip the W1-T3092 survey flag. Success records the next daily incremental window. Failure uses
    bounded exponential backoff with jitter and a fixed escalation threshold; a daemon restart reads
    durable state and continues the episode instead of retrying immediately. The child has a
    wall-clock bound and process-group teardown, so maintenance cannot become a hidden occupied lane.

    (vi) MAKE THE RESULT OPERABLE WITHOUT SSH. Ledger start/complete/defer/fail/escalate rows carry
    command kind, duration, before/after loose-object bytes/counts, gc-log verdict, active-lane count
    and next retry. The existing status/console projection exposes current verdict, last success or
    failure and whether an automatic retry is pending. Keep W1-T2529's off-box heartbeat signal; it
    becomes the independent detector for a controller that stopped making progress.
