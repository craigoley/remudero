  note: |
    THE STAKES, STATED PLAINLY. One PR reported a failed merge that may well have succeeded, and
    the arm's most-used leg is unaffected: `armed` is 602 rows against a single `direct-merged`.
    This is a narrow leg that fails in one environment, not a broken arm — the reason to fix it is
    that the fix is a deleted flag, and that the verdict it currently writes misleads every later
    diagnosis.

    `files:` WAS DERIVED BY WORD-BOUNDED INVOCATION COUNT, NOT GUESSED. In `src/` the affected
    symbols read `attemptArm` 7, `realArmDeps` 6, `mergeDirect` 5, `armAuto` 5 and
    `armFailureAction` 3 — all in `src/run-task.ts`, which is therefore the dominant site;
    `ghPrMergeSquash` is DEFINED in `src/lib/worker.ts`, which is why that module is declared
    alongside the arm's own file. On the test side only `test/live-write-guard-command-sites.test.ts`
    pins the argv, so it is the only test file declared. THE FIFTH CRITERION IS A TEST RATHER THAN A
    GREP DELIBERATELY: its first draft grepped `ghPrMergeSquash(`'s caller, which sits OUTSIDE
    `files:` and drew a `[proof-scope]` warning — a proof must not send the scope guard chasing a
    path the task never edits. The shard's own path is absent.

    RISK IS `high` UP FRONT AND THE BAND IS RULE 19's SPAN: two source modules plus a test whose
    assertion must be re-derived rather than deleted.

    EVERY FIGURE IS DATED 2026-08-20 AND WILL DRIFT — RE-RUN THE QUERY. Arm outcomes:
    `zgrep -h '"step":"automerge' <every ledger form> | sort -u`, then tally `outcome`, with a
    per-form file count as the coverage control — and read the `outcome` FIELD, never the step
    name, because a failed direct merge is filed under `automerge.arm_skipped`. Repository merge
    settings:
    `gh api repos/<o>/<r> --jq .delete_branch_on_merge`. Flag semantics: `gh pr merge --help`.
    THE ONE MEASUREMENT THIS SHARD COULD NOT TAKE is whether the merge landed before the cleanup
    failed, and it is UNTAKEABLE FROM THE LEDGER rather than merely untaken: there is no failure row
    to timestamp. Until the second concern in design note (v) is addressed, the only surviving
    evidence is the daemon's stdout.

    ID PROVENANCE — FIVE SURFACES, RE-SWEPT IMMEDIATELY BEFORE PUSHING, AND THE FOURTH ONE EARNED
    ITS PLACE TONIGHT. Pre-minted by the operator and read back against the sha he supplied:
    `refs/rmd-id/W1-T1050` -> e009240d1338ca085b4428c47344be7c39836f9b, matched exactly. The other
    four read 0: the shard FILENAME under `plan/tasks.d/` on origin/main, a declared `- id:` under
    `plan/` on origin/main, every open PR's title, branch AND changed-file list, and `git grep`
    across `src/`, `test/` and `deploy/` on origin/main. LIVE CONTROLS, same tools and corpus: the
    W1-T1044 filename reads 1 and its declared id reads 1; the open-PR listing is non-empty and
    three of its rows name a `plan/tasks.d/` shard; the source sweep reads 2 files for the id an
    earlier merged PR orphaned. AND THE OPEN-PR SURFACE IS NOT DECORATION — the id originally
    proposed for this shard was claimed by a PR opened while this recon was running, and that
    surface is what caught it before a byte was written. A reservation ref cannot distinguish
    `reserved and free` from `reserved and in use right now`.
