  note: |
    THE HOLD SET IS NOT TOUCHED AND NOTHING AUTO-DELETES. 55 of the 74 currently held carry exactly
    ONE commit not in main (measured; the distribution is 55 at one, 8 at two, 8 at three, 2 at four,
    1 at seven), 39 are older than 30 days by tip commit date and the oldest is 41 days
    (`diag/resume-spawn-enoent`). For a branch with genuinely no PR that single commit may be the
    only copy of that work. This task moves branches between REPORTED buckets by reading their state
    correctly; it deletes none of them, and the six guarded stay guarded.

    THE MANIFEST STAYS ON STDOUT AND KEEPS PRINTING SHA WITH NAME. It is the only thing that makes a
    deletion reversible, and `state/` is gitignored — "where 29 cited reports went to die". Do not
    move it to a file, and do not drop the sha to shorten the output.

    AND THE RISK IS NOT NEAR ZERO, WHICH CORRECTS THE OBVIOUS READING. Of the 56 currently offered as
    deletable, only 24 are merged PR heads; 31 are CLOSED-UNMERGED, whose commits are in main
    NOWHERE, and exactly 2 of the 56 have a tip that is an ancestor of `origin/main`. So "deletable"
    does not mean "recoverable from main" for most of the set — recovery runs through the manifest
    sha. That is an argument for keeping the manifest and against ever deleting unattended, not an
    argument for deleting sooner.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (branch-backlog-reaper, status) at risk:medium
      — Rule 19: raise to risk:high or decompose into one task per concern `sizingViolation` returns `undefined` on its first line at
    `risk: high`, so that refusal is the only scoring of this span this shard will ever get. The real
    blast radius is a pure classifier and its falsifier.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/branch-backlog-reaper.test.ts`, declared in `files:` and absent
    from this tree, so on the filing PR each resolves through W1-T456's forward-reference carve-out.
