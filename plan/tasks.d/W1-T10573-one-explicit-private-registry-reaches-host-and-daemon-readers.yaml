  design: |
    1. Reuse the existing explicit selection and bounded file/binding contracts at
       the actual daemon path/default-reader composition and actual recycler/serve
       launch argument assembly. Add no second generic registry loader, permissive
       YAML grammar, inbox scanner, daemon, scheduler or blocking daemon adapter.
       Census the real callers/catches before changing shared helpers; a fixture-only
       port or observer does not prove the daemon uses the chosen file. A synchronous
       seam cannot claim fresh asynchronous authority. Amend scope normally before
       a demonstrated consequential change outside these forty-two existing paths.
    2. Genuine absence preserves the exact legacy reader, rendered arguments and
       supported old launcher/image behavior. Presence is not truthiness: empty,
       relative, missing, unreadable, symlink, malformed, oversized, unsupported,
       stale or revised explicit input stays refused/unknown for the selected target,
       never silently replaced by healthy public bytes, cache or another instance.
       Recheck actual file/repository/instance and host/container binding at adoption;
       retain immutable original identity/digest through waits and argument snapshots.
       Unknown cannot age into live, trusted or permission. If existing catch/fallback
       callers require an undeclared change, stop for a companion scope amendment.
    3. A host path is not a container path. Bind only the selected regular config
       read-only at one explicit supported container location outside the mutable
       Git checkout and forward its container selection only to trusted daemon/serve
       readers. Use fail-on-missing bind syntax, not implicit source-directory creation;
       qualify the Docker daemon's actual source namespace rather than assuming the
       client path is local to it. Do not add private files to a blanket worker mount/env list, expand
       buildWorkerEnv allowlisting, leak raw operational values/paths into prompts,
       untrusted child arguments, logs or public projections, or treat readonly as
       secrecy. Test actual shell argv and hostile/revised paths with recording
       transports. Do not assume an old image supports new optional semantics.
    4. Configuration plumbing never grants actor admission, publication, deployment
       or release permission. Existing policies and selected observations remain
       opt-in SHADOW ONLY. PAUSE/STOP, independently authenticated owner/admin
       override, trusted flows, configured human/service scopes, instance-only holds
       and every CI/security/review requirement remain independent. No live/private
       configuration is installed or selected and no scheduler/settings/infra changes
       belong here. Do not turn an observation timeout into a new global trusted hold.
    5. Extend only the existing declared tests. Exercise production defaults with
       real disposable regular files and shell children, each catch, exact no-config
       bytes, supported mixed versions, invalid/changed binding, same-named different
       instances and owner holds. Trap Docker/Azure/GitHub/systemctl/installer effects;
       no live configuration, credential or worker is touched. Test that ordinary
       worker env/prompt/argv and public projection contain no selected private path
       or operational data. Add a usable synthetic installation example to the existing
       public contract, preserving the complete Apache implementation and currently
       consumed public registry. Public-data removal is a later cutover decision.
    6. Freeze assertions, delete actual default selection/launch forwarding and final
       binding checks independently, record real behavioral failures, restore exact
       committed bytes, and prove all four acceptance titles resolve literally.
       Commit before measuring; verify physical paths, explicit child tsx/tmp preload,
       shipped host slots and source-mapped coverage for every changed source SF.
       One ordinary author run per distinct committed repair; reproduce every actual
       failed title on that run's unchanged pinned base before attribution/repair.
       Retain failed/setup/capacity receipts and UNKNOWN causes. No detector exemption,
       baseline widening, unchanged retry into unexplained green or fake full PASS.
    7. Refresh both scope-time checks, all open-head subjects, actual main, merged
       trailer/run-branch credit, package runnableCandidates and ordinary ownership
       before build/publication. No competing W9794-W9796 implementation, claim
       reclamation, extra review, auto-arm, force/admin merge or replacement SHA to
       clear stale CI. Normal plan merge precedes source implementation; normal
       current-head author, hosted tests/coverage/security/proof/automated review
       and ordinary merge remain required, with GitHub STORED-body parser/proofs.
    8. SOURCE PUBLICATION HOLD: deployer.ts and config-schema.ts trigger ACR image
       build on main and existing supervisors may recycle for published image drift.
       Before source publication/merge, qualify the real release hold and automatic
       build/recycle path. If worker-affecting release is not demonstrably protected,
       obtain the operator's separate exact release decision first; this task grants
       no build/recycle release, worker stop/restart, hold clear or live cutover.
       Workers continue for isolated source/tests. Any later exact-instance rollout,
       drain, rollback and shared-writer compatibility decision require separate human
       approval; no fleet-wide stop is requested or inferred from this source approval.
