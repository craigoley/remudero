- id: W1-T264
  title: "THE RETRO CADENCE IS STILL SOURCE CONSTANTS, NOT POLICY DATA — retroTriggerCheck calls evaluateRetroTrigger with no policy argument, so the live thresholds are retro.ts's 25/7 literals and plan/policy.yaml carries no retro row; lift the two constants into the P37 substrate and pass the loaded policy at the one call site"
  repo: remudero
  depends_on: [W1-T252]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: "THE RESIDUAL OF W1-T201, split out when that task was closed as already-satisfied by W1-T160
    (PR #853). Five of W1-T201's six acceptance criteria are satisfied by shipped, live code — the retro has
    fired unattended twice (2026-07-29T16:04:27Z at 94 merges, 2026-07-31T00:00:24Z at exactly the 25-merge
    threshold, each followed by a marker advance). Its criterion 4 — 'the cadence condition is DATA, tunable
    without a source change' — is the one thing that did NOT ship, and it is a two-constant lift rather than a
    task's worth of work. MEASURED at 2c8dff2: src/run-task.ts:5243 calls
    `evaluateRetroTrigger(mergesSinceMarker, marker?.ts, now)` with NO fourth argument, so the parameter
    defaults to `defaultRetroTriggerPolicy()` (src/lib/retro.ts:2315), which returns the source literals
    DEFAULT_RETRO_MERGES_THRESHOLD = 25 (retro.ts:2299) and DEFAULT_RETRO_DAYS_THRESHOLD = 7 (retro.ts:2304);
    plan/policy.yaml has no retro key at all. Retuning the fleet's retro cadence therefore requires a source
    edit and a deploy, which is exactly what P37 exists to end."
  design: |
    THE SEAM ALREADY EXISTS — this is a data lift and one argument, not a refactor. `evaluateRetroTrigger`
    (src/lib/retro.ts:2341) already takes `policy: RetroTriggerPolicy = defaultRetroTriggerPolicy()` as its
    fourth parameter (retro.ts:2345) and reads `policy.mergesThreshold` / `policy.daysThreshold` from it.
    Nothing in production ever supplies it.
    (1) plan/policy.yaml gains a `retro:` row in the same bounded shape its peers use (`value` / `origin:
    "lifted:<file>:<line>"` / `min` / `max`), carrying mergesThreshold and daysThreshold. Follow fixStrikeCap
    and sweep.staleDays for the row shape; the `origin` strings must name retro.ts's two constants so the lift
    is traceable back to what it replaced.
    (2) src/lib/policy.ts's loader gains the matching schema entry + bounds validation, exactly as W1-T252
    established for every other row — a value outside its declared bound must fail validation loudly.
    (3) src/run-task.ts's `retroTriggerCheck` (:5228) passes the loaded policy as the fourth argument at :5243,
    the same way `drainCommand` already reads `loadPolicy(policyPath(repoRoot)).values.drain.max` (W1-T253).
    The default parameter STAYS — it is what keeps every existing unit test and every non-daemon caller working.
    VERIFY FROM SOURCE before wiring (distrust these coordinates, they drift): the call site line, the two
    constant declarations, and whether policy.ts's validator needs a nested-object rung for a two-field row.
  acceptance:
    - claim: "the retro cadence thresholds are POLICY DATA — plan/policy.yaml carries a bounded retro row naming both thresholds"
      proof: "grep: retro: in plan/policy.yaml"
    - claim: "the live trigger reads the loaded policy rather than retro.ts's source literals"
      proof: "unit test: W1-T264 acceptance 2 — retroTriggerCheck passes the loaded policy to evaluateRetroTrigger"
    - claim: "changing the policy value changes the firing decision with no source edit — the P37 point"
      proof: "unit test: W1-T264 acceptance 3 — a policy fixture with a lower mergesThreshold fires earlier"
    - claim: "an out-of-bound retro threshold fails policy validation loudly, like every other bounded row"
      proof: "unit test: W1-T264 acceptance 4 — a retro threshold outside its declared bound fails validation"
  risk: high
  origin: architect
  plan_refs: ["§8", "§4"]
  files: [plan/policy.yaml, src/lib/policy.ts, src/run-task.ts, test/policy.test.ts]
  status: queued
  attempts: 0
  note: "FILED 2026-07-31 as the residual of W1-T201's already-satisfied closure (see DECISIONS.md, the
    2026-07-31 W1-T201 entry). NOT an amendment to W1-T252 or W1-T253: both are already merged (#901 and #921,
    both 2026-07-30), and postMergeAmendmentViolations (src/lib/task-linter.ts:735, W1-T180) blocks amending a
    merged task's acceptance criteria — an amendment there would sit in the plan looking authoritative and never
    be dispatched, reviewed, or proven. Hence a new task rather than an append.
    ID DERIVATION: max across plan/tasks.yaml and every plan/tasks.d/*.yaml shard is W1-T262, and zero PRs were
    open when this was filed, so the repo's max+1 rule (and `rmd next-task-id`) both yield W1-T263 — but
    W1-T263 is HISTORICALLY USED: it was filed in commit 02ded70, reused in 2a568e7, and folded into W1-T191 by
    PR #961, whose note still cross-references it by that id. Reusing it would collide with live plan prose and
    merged PR history, so this task takes W1-T264 (zero hits in git history, plan/, DECISIONS.md, or any PR).
    RISK GRADE: high, matching Rule 19 (src/lib/task-linter.ts:154 exempts risk:high) and the P37 lineage —
    W1-T252 and W1-T253 are BOTH risk:high, and W1-T252's files list is nearly identical to this one. `high`
    here reads 'spans more than one concern' (policy substrate + the one call site), not 'dangerous': the work
    itself is a two-constant lift, which is what budget_usd 40 reflects.
    The proofs deliberately use the suffixed `<taskid> acceptance N — <description>` form: the bare form is a
    BARE-NAME shape, and on a zero match judgeCriterion (src/lib/review.ts:1338-1345) mints executed_fail and
    FAILS the PR rather than capping it — the #466/W1-T183 false-hard-block class."
