  rationale: |
    THE PROPOSAL THIS SHARD WAS RATIFIED FROM CANNOT EVER GO STALE, AND THAT IS A MECHANISM RATHER
    THAN AN OPINION. `board-review:escalation:#3199` was minted with `evidenceAnchors: []` — the
    literal in `buildBoardReview`'s registry update, src/lib/board-review.ts. Three consequences
    follow mechanically from an empty anchor set, each re-derivable in src/lib/inbox.ts:
      (a) THE READINESS PREDICATE'S EVIDENCE ARM PASSES VACUOUSLY. `classifyProposal` computes
          `const driftedAnchors = proposal.evidenceAnchors.filter(a => !ctx.grepAnchorTrue(a))`.
          Over an empty array that is empty, so the `evidence_anchors` reason is never pushed and the
          proposal is INCAPABLE of being classified evidence-drifted.
      (b) THE CACHED DRAFT NEVER GOES STALE. `isDraftStale` compares `anchorFingerprint`s, and
          `anchorFingerprint([])` is the empty string, a constant — so `draftStale` is permanently
          false for every such proposal.
      (c) THE DAEMON NEVER RE-DRAFTS IT. `draftAttemptKey` is
          `${anchorFingerprint(anchors)}::${reframeHistory.length}`, which for an anchor-less,
          never-reframed proposal is the constant `::0`, so the attempt cache suppresses every later
          attempt for the life of the proposal.
    So a finding whose condition has since evaporated — the PR merged, its escalation closed — still
    classifies READY and still offers the draft cached while the condition was live. The invalidation
    machinery W1-T110 built is INERT for exactly the proposals a machine mints, which are the ones no
    human curated in the first place.

    A CENSUS, AND A CORRECTION TO THIS SHARD'S OWN FIRST READING, recorded rather than hidden. The
    first pass here claimed rule-efficacy anchors its proposals and board-review is the lone outlier,
    on the strength of `evidenceAnchors: anchors` in `escalateRepeatingRules`. Reading a few lines up
    REFUTES it: `const anchors: EvidenceAnchor[] = []` and nothing is ever pushed onto it. That is
    the same zero laundered through a named local that reads as though evidence had been assembled —
    worse than the inline literal, not better. Of the three MINTING paths audited: board-review zero
    (inline literal), rule-efficacy zero (via the empty local), and the feedback docket ONE REAL
    ANCHOR (`{ description: "<referent> is still an open referent", pattern: winnerReferent }`,
    src/lib/feedback-docket.ts, handed to the registry by run-task.ts's docket rung). The third is
    the control and it is what makes this a defect rather than a design gap: the vehicle works, is
    used, and two miners skip it.
    RE-RUN THE CENSUS, DO NOT INHERIT IT. Further `updateProposalRegistry` call sites exist
    (src/lib/panel-graph.ts, and three in src/run-task.ts) and were NOT audited for this claim —
    several mutate an existing entry rather than mint a new one. The builder re-derives the minting
    set with `grep -rn "evidenceAnchors:" src/` and decides the fix's width from that, never from a
    figure quoted here.

    WHY AN ANCHOR IS AWKWARD HERE, STATED PLAINLY RATHER THAN WISHED AWAY. `EvidenceAnchor` is a
    REPO-TEXT predicate — `{ description, pattern, path? }`, resolved by `gitGrepAnchorTrue(cwd, ref,
    anchor)`. A board finding is about LIVE GitHub state, and no grep on main can answer whether a PR
    still carries an unhandled escalation. The two anchor-less miners did not forget to fill a field;
    the existing vocabulary cannot express their condition. That is the actual gap, and it is why
    this is a design decision rather than a one-line patch.
  design: |
    THE INVARIANT, and it is the only thing this shard owes: A PROPOSAL WHOSE PRODUCING CONDITION HAS
    ENDED MUST NOT REACH READY. Everything below is subordinate to it.
    TWO ROUTES, both legitimate — THE IMPLEMENTER CHOOSES WITH EVIDENCE FROM SOURCE and does not take
    this note's framing on faith:
      (A) A SECOND ANCHOR KIND, CALLER-RESOLVED. The precedent already exists one field over:
          `ProposalTrigger.fired` is documented as resolved by the CALLER, with the module never
          guessing whether the condition holds. A condition anchor takes the same shape — the miner
          NAMES the condition, the caller RESOLVES it — which keeps inbox.ts pure and gives the two
          anchor-less miners something true to emit. Costs a vocabulary widening.
      (B) MINER-SIDE RE-CHECK. Each miner, on its own next fire, re-evaluates its open findings and
          LABELS the ones whose condition no longer holds, through the same single writer. Costs no
          vocabulary change; costs a miner that must run before anything is noticed.
    BINDING ON EITHER ROUTE, and these four are not the implementer's to trade away:
      1. AN EMPTY ANCHOR SET IS NOT EVIDENCE. Whatever ships, `classifyProposal` must stop treating a
         zero-length anchor list as a SATISFIED evidence arm. The honest classification is not-ready
         with a named reason, never ready by absence.
      2. NOTHING IS DELETED AND NOTHING IS DECIDED FOR THE HUMAN. An invalidated proposal is LABELLED
         and KEPT — W1-T1257's ruling on the adjacent queue, verbatim: a discharged entry is
         LABELLED, never retired, and nothing is closed on a human's behalf. Rule 15 is untouched:
         this shard files no task, mints no id and ratifies nothing.
      3. CANNOT-OBSERVE MEANS WAIT (W1-T130), and inbox.ts ALREADY carries the shape to copy — its
         `deps_observable` arm renders that GitHub could not be read and that this is NOT a claim the
         dependency is unmerged. An unreadable condition read classifies not-ready-as-unobservable,
         never READY and never a silent drop.
      4. THE SINGLE WRITER SURVIVES. Every registry write still rides `updateProposalRegistry`
         (W1-T240) — never a hand-rolled JSON write, never a second writer, so the lost-update and
         torn-file hazards that helper exists to close stay closed.
    VERIFY FROM SOURCE BEFORE EDITING: the predicate, the fingerprint and the attempt key were read
    on 2026-08-28 and this note may be stale against the installed version.
