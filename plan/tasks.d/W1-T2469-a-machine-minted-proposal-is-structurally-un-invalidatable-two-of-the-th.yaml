    - claim: "both anchor-less minting paths emit a real condition for their findings — asserted per miner, so the class fix cannot land half-applied"
      proof: "unit test: test/proposal-invalidation.test.ts"
  note: |
    FILED from the registry proposal `board-review:escalation:#3199`, which is the fixture: that
    proposal is un-invalidatable today by the three mechanisms named in the rationale.
    NOT A RE-DECISION of W1-T1257 (the feedback INBOX's missing discharge path, on
    `plan/feedback/*.yaml` entries and the closed `FEEDBACK_STATUSES` enum) — this is the PROPOSAL
    REGISTRY, a different artifact with a different vocabulary and no shared write path. W1-T1257's
    ruling that a discharged item is LABELLED rather than retired is INHERITED as a binding
    constraint above, deliberately, so the two queues do not diverge in posture.
    OUT OF SCOPE, named so it is not silently inherited: (1) AUTO-RETIRING or auto-deciding a
    proposal is refused above with its reason; whether an invalidated proposal should be hidden from
    the inbox stays the ratification lane's call. (2) A sixth `FEEDBACK_STATUSES` member is not
    proposed here and is not this task's to add. (3) The board-review rung's trigger, thresholds,
    cadence and read-only posture are untouched.
    RULE 19 BAND, recorded as a regrade rather than a workaround: `risk: high` for the SPAN. The
    invariant is unsatisfiable piecewise — a widened vocabulary with no miner emitting into it
    invalidates nothing, and a miner emitting a kind the predicate cannot read changes nothing — so
    the predicate and at least one miner must land together. The SECOND anchor-less miner is the same
    one-line shape and is FOLDED IN rather than split, because splitting one defect by instance is
    fragmentation rather than decomposition. That last part is a judgement, stated so it can be
    argued with, not a claim of physical inseparability.
