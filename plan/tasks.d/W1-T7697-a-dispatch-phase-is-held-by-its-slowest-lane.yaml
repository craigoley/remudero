    - claim: "freed lanes keep refilling past the old fixed 20 min bound while one slow lane holds the phase"
      proof: 'grep: test("W1-T7697: freed lanes keep refilling while one slow lane holds the phase" in test/a-dispatch-phase-is-not-held-by-its-slowest-lane.test.ts'
    - claim: "the refill bound follows observed run lengths, so two different histories give two different bounds"
      proof: 'grep: test("W1-T7697: the refill bound follows observed run lengths" in test/a-dispatch-phase-is-not-held-by-its-slowest-lane.test.ts'
