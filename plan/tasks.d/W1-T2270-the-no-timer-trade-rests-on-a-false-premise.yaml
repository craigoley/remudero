      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
    - claim: "a task with no held claim produces no such report, so a clear fleet still reads clear"
      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
    - claim: "an unreadable remote is reported as undetermined rather than as a held claim"
      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
    - claim: "an unreadable remote is likewise never reported as no claim held"
      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
    - claim: "the report names the ref and the holder so the operator arm has what it needs to act"
      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
    - claim: "nothing in the change releases a claim it reports"
      proof: "unit test: test/dispatch-claim-stranded-visibility.test.ts"
