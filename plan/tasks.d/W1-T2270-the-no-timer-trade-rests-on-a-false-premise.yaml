  note: |
    THE THREE RELEASE ARMS STAY: HOLDER, EVIDENCE, OPERATOR. Rendering a hold is NOT authority to
    release it and must never become a fourth arm. The whole point of the operator arm is that
    cross-host liveness is undecidable, and a surface that could see a claim would be no better placed
    to judge whether its lane is alive than the module that already refused to guess.

    `rmd status` STAYS READ-ONLY AND CHEAP. Its own help says it "writes nothing, spawns nothing,
    always exits 0", and it is the verb an operator runs first precisely because of that. A remedy
    that makes it slow or stateful has broken the surface it was trying to improve.

    AND NO TIMER IS ADDED BY THIS SHARD. Design (i)(c) raises revisiting the trade as a QUESTION for
    the ruling, with its own danger stated; it is not this task's conclusion and a build must not read
    it as one.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (dispatch-claim-stranded-visibility,
      status-board) at risk:medium — Rule 19: raise to risk:high or decompose into one task per
      concern The real blast radius is one read-only board section; no gate, no
    merge path and no dispatch decision reads it.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/dispatch-claim-stranded-visibility.test.ts`, declared in `files:`
    and absent from this tree, so on the filing PR each resolves through W1-T456's forward-reference
    carve-out.
