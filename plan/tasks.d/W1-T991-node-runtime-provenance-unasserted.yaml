    (exec of node_modules/.bin/tsx, a shebang script), launchd.ts:70 DEFAULT_LAUNCHD_PATH (no nvm entry) and
    launchd.ts:296-305 (EnvironmentVariables is a closed PATH+HOME allowlist), env.ts:89 ALLOWLIST copies
    PATH into the child, env.ts:229-260 assertCleanBoot/BootAssertion, daemon.ts:1605-1610 the daemon.boot
    log line, FINDINGS.md:15 (node v22.22.3 at /opt/homebrew, pinned in .nvmrc + engines).
    ANSWERS THE FEEDBACK'S STANDING QUESTION DIRECTLY: NO, the fleet should not take a new dependency on a
    node installed under the agent account. The runtime it is SUPPOSED to use is already named by the plist's
    PATH and pinned twice in-repo; the observed nvm node is drift from that intent, produced by a hand-start,
    not by any resolution the code performs. The gap is observability, so the fix is a boot-time reading and
    a named drift reason — not new plumbing.
    risk:high is Rule 19's arithmetic, not this change's danger — env.ts plus daemon.ts plus a new test file
    spans two subsystems and a test, the same count that graded W1-T310 up. The behaviour added is two
    ledger fields and one advisory string.
    NOT URGENT and filed unpromoted: latent by construction, and it should not displace live-queue work. It
    becomes live the moment that nvm install is pruned or upgraded, at which point every spawn fails together
    — so the cheap boot line is worth having BEFORE that, which is the whole case for filing it at all."
