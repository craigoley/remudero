  acceptance:
    - claim: "Each installer writes a record beside the files it installs: the checkout it ran from and the layout it installed (`HOME/bin`, the shared root, or the Application Support folder)"
      proof: "grep: W1-T12268 criterion 1 in test/deploy/the-installed-mac-janitor-copies-refresh-themselves.test.ts"
    - claim: "A scheduled pass whose installed file differs from the same file at `origin/main` of the recorded checkout installs the files of `origin/main` after its own work, and prints the old and the new hash of each file it replaced"
      proof: "grep: W1-T12268 criterion 2 in test/deploy/the-installed-mac-janitor-copies-refresh-themselves.test.ts"
    - claim: "The refresh reads the files from the `origin/main` ref. It never copies a file from the working tree of the checkout, and it runs no `git fetch`"
      proof: "grep: W1-T12268 criterion 3 in test/deploy/the-installed-mac-janitor-copies-refresh-themselves.test.ts"
    - claim: "When the record, the checkout or the ref cannot be read, or the source set at `origin/main` is not complete, the pass keeps every installed file, prints one line with the cause and finishes its own work"
      proof: "grep: W1-T12268 criterion 4 in test/deploy/the-installed-mac-janitor-copies-refresh-themselves.test.ts"
