  rationale: |
    Audit recon-2026-09-05 R-41 (OBSERVED). At f7ceb86: `git grep -hoE 'function
    [a-zA-Z]*(Repo|Checkout|Clone|Worktree|Bare)[A-Za-z]*\(' -- 'test/*.test.ts' | sort -u | wc
    -l` reads 62; 218 `git init` sites sit in 130 files; 70 distinct fake-GitHub builder names
    appear in 129 files (`function fakeGitHub(` alone in 41); 81 files write their own `gh`
    PATH shim; 26 distinct ledger helpers exist. `test/helpers/` holds seven modules
    (`captured-console`, `declared-routes`, `import-sweep`, `mutant-module`,
    `mutation-sandbox`, `triage-proof-needle`, plus a licence check) and none is a fixture
    builder. CLAUDE.md's ledger-and-evidence rule "a fixture shelling git PLUMBING fails on every
    CI runner and passes on every dev machine" (#1971, after #1964 failed the same way) is the
    cost of 130 hand-rolled copies: the identity-env fix had to be found twice because there was
    no one fixture to fix.

    THE FIX: four shared builders under `test/helpers/` — `gitRepo()` (identity env set, tmp
    hygiene shim honoured, optional bare/worktree/remote shapes), `fakeGitHub()` (the recording
    gateway shape the daemon and review tests need, with the seven domain-gateway methods),
    `ghShim()` (a PATH-shim `gh` that answers from a scripted table and records argv), and a
    ledger fixture (`writeLedger(rows)`, rotation forms included). Each builder has its own test.
    Migrate ENOUGH callers to prove the builders cover the real shapes — the worker picks the
    files with the highest copy counts and reports the count migrated. The census test scans
    `test/*.test.ts` for the copy signatures the audit counted and compares per-signature totals
    against `scripts/fixture-copy-baseline.json`, refusing growth; the baseline is captured
    post-migration in this PR so it only ever moves down.
