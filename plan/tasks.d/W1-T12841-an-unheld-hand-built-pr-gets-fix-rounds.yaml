- id: W1-T12841
  title: "A hand-built pull request whose session no longer holds its branch gets the fix lane's rounds for a red check or a failed review"
  repo: remudero
  depends_on:
    - W1-T12840
  priority: 0.7
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # a fix round pushes to a branch a person may still be working on; the hold test is the only thing between the fleet and a live session
  band_meaning: blast-radius
  origin: "operator-session#self-improvement-audit-2026-11-15"
  plan_refs:
    - W1-T11170
    - W1-T12707
    - W1-T12836
  files:
    - src/lib/sweep.ts
    - src/cli/commands/fix.ts
    - test/sweep/an-unheld-hand-built-pr-gets-fix-rounds.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A PR whose head is run-<taskId>-<epoch> for a real plan task, authored by a non-fleet login, whose dispatch claim reads unheld by the same test the conflict round uses (sessionBranchUnheld), and whose blocker is own-red or review-failed, is accepted for a fix round under that task's strike and review key"
      proof: "grep: W1-T12841 criterion 1 in test/sweep/an-unheld-hand-built-pr-gets-fix-rounds.test.ts"
    - claim: "invariant:a-held-session-branch-is-never-pushed — while the claim is held or renewed inside its gap, or the hold cannot be read, no fix round is dispatched to the head and the existing stand-down row is written"
      proof: "grep: W1-T12841 criterion 2 in test/sweep/an-unheld-hand-built-pr-gets-fix-rounds.test.ts"
    - claim: "The first fix round on such a head writes one sweep.fix.session_head_adopted row with the PR, the task and the claim's last renewal time"
      proof: "grep: W1-T12841 criterion 3 in test/sweep/an-unheld-hand-built-pr-gets-fix-rounds.test.ts"
    - claim: "A run branch that names a different task than the PR's trailer stays refused as on origin/main"
      proof: "grep: W1-T12841 criterion 4 in test/sweep/an-unheld-hand-built-pr-gets-fix-rounds.test.ts"
  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - Human-login sessions merged 423 of the 824 PRs to main in 7 days. Their branches are run-<taskId>-<epoch>, the same shape as a fleet dispatch.
    - READ src/lib/sweep.ts fixHeadAcceptable: for a non-synthetic task it accepts only the fleet's own run branch. A hand-built head with a plan task id is refused, and the PR is escalated "cannot be repaired from its non-fleet head" only when foreignHeadIsStuck.
    - So a session PR that fails review or goes red after its session ended waits for a person. By 2026-11-15T02:48Z the review-failed PRs #18449, #18542, #18543 and #18515 were all cao825 session branches.
    - W1-T11170 already gives an unheld session branch the conflict round, with sessionBranchUnheld as the test of "the session has let go". The fix round has no such path.
  design: |
    1. sweep.ts: where the fix dispatch declines an uncreditable head, admit a non-fleet run branch for the PR's own task when readSessionOwnershipViaGit and sessionBranchUnheld report it unheld, for the own-red and review-failed blockers only.
    2. Keep the fix command's branchAuthorshipStandDownReason (src/cli/commands/fix.ts) for a head that moved under a round, stand down for a held branch, and treat an unreadable hold as held.
    3. Write sweep.fix.session_head_adopted once per PR head lineage.
    INVARIANT a-held-session-branch-is-never-pushed: a held, renewing or unreadable claim always stands the fix lane down.
    NOT IN SCOPE: the conflict round, plan-proof repairs, synthetic and unfiled heads, and changing the claim's renewal gap.
  falsifier: |
    Refuse every non-fleet head and criterion 1 must fail. Dispatch to a held branch and criterion 2 must fail. Accept a branch naming another task and criterion 4 must fail. Restore and all pass.
  note: |
    reservation hand-off: run-unfiled-1794756420518 -> run-unfiled-1794756420518
    Reserved with rmd next-task-id from the operator checkout. Check refs/rmd-dispatch/W1-T12841 and any run branch before building. The test folder is the one rmd test-place computed for a stub with this test's imports; confirm it once the file exists.
