  title: "A CI SHARD THAT HANGS IS INDISTINGUISHABLE FROM ONE THAT BROKE — the job timeout kills it, GitHub labels the kill `cancelled`, the sweep reads `cancelled` as a required-check FAILURE, and the aggregator then fails for a missing artifact, so a hang is reported to the operator as a red diff"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 20.00
  files:
    - .github/workflows/ci.yml
