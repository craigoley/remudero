  rationale: |
    MEASURED 2026-09-08 over the ledger union at the daemon state root (450 gz archives + 2 plain
    rotations + the live file; 4,131,278 run-tagged rows -> 915 distinct runs; newest row
    2026-09-08T01:15:28.635Z).

    (1) THE LANE IS THE LARGEST IN THE FLEET. `inbox.draft_synthesized` is 1,436 runs and $4,486
    notional — 45% of all metered spend, larger than `implement.done` ($3,429 across 668 runs),
    which is the lane that actually ships code.

    (2) ALMOST NONE OF IT IS EVER CONSUMED. Those 1,436 runs cover 659 distinct `proposal_id`s.
    `ratify.approved` carries 44 distinct `task_id`s across 7 plan PRs on 3 days (38 of them in one
    `APPROVE-BATCH` on 2026-09-02). So 44 of 659 drafted proposals were ever ratified — 6.7%, or
    about $102 of drafting per ratification. `ratify.reframed` and `ratify.refused` are BOTH ZERO
    across the whole union: the reframe path whose invalidation semantics motivate re-drafting has
    never once fired in production.

    (3) THE ONE EXCLUSION THE DRAFTING PREDICATE APPLIES IS INERT. `proposalsNeedingDraft` filters
    exactly one thing — `if (p.trigger && !p.trigger.fired) return false`. Reading
    `state/inbox-proposals.json`: 147 live proposals, `withTrigger: 0`. The filter has nothing to
    filter. Every live proposal is therefore due, forever, and `inbox.draft_batch` rows confirm the
    steady state is a permanent backlog draining at the cap (`eligible: 6, drafting: 3, deferred: 3`).

    (4) THE INFORMATION TO DECLINE MOST OF THEM ALREADY EXISTS, DETERMINISTICALLY AND WITHOUT A
    SPAWN. `classifyProposal` (same module) resolves FIVE terminal-or-never-READY states before it
    ever looks at a draft: `ctx.isRatified`, `ctx.isDeclined`, `resolveBoardReferent` -> `retired`,
    the trigger gate, and — in its AND-clause — `evidence_anchors` (`ctx.grepAnchorTrue` over the
    PROPOSAL's own anchors, not the draft's) and `no_conflict` (`ctx.openProposalIds`). Only
    `deps_merged`/`deps_observable` and `lint_clean` genuinely need the drafted fragment. A
    proposal failing any of the former can never be READY no matter how good the draft is, so
    drafting it is provably wasted spend.

    (5) THE GATE HAS NEVER REJECTED A DRAFT ON CONTENT, WHICH IS WHY (4) IS THE WHOLE LEVER. Across
    468 retained `inbox.classified` rows: 169 `ready`, 299 `not_ready`, and ALL 299 failed on
    exactly one predicate — `drafted` ("no drafted candidate available yet"). Zero `lint_clean`,
    zero `deps_merged`, zero `evidence_anchors`, zero `no_conflict`. Drafting is not a filter; it is
    a formality applied to everything.

    (6) NOT THE ALREADY-FIXED FAILURES. The boot re-open storm is FIXED (W1-T2566, merged
    2026-09-05): repeat-draft spend fell from 50% of the lane to 12%, $364/day to $210/day. The
    43-86% `no FRAGMENT/STAMP markers` spike was 2026-08-30..09-01 and has run 1-6% since 09-02.
    Neither is what this task is about; both were checked before filing so this rationale does not
    re-litigate a closed defect.
  design: |
    (i) EXTEND THE PURE PREDICATE, DO NOT ADD A SECOND ONE. `proposalsNeedingDraft` stays the ONE
    shared predicate `rmd inbox`'s manual force and the daemon rung both consult (its own doc's
    stated property). It gains the never-READY exclusions from (4), supplied through an injected
    context of the SAME shape `classifyProposal` already takes — never re-derived, never a second
    source of truth about readiness.
    (ii) EXCLUSIONS ONLY, NEVER A NEW ADMISSION. A proposal this predicate cannot PROVE is
    never-READY stays draftable, so an unreadable GitHub referent or an unrunnable anchor grep
    forgoes the saving rather than silently dropping a proposal — the same conservative direction
    `deriveTaskClass` takes for an ambiguous class.
    (iii) `rmd inbox` KEEPS ITS UNTHROTTLED FORCE. The manual path must still be able to draft a
    named proposal on demand, since a filtered-out proposal is precisely what an operator may want
    to look at. The exclusion applies to the DAEMON's selection, not to an explicit ask.
    (iv) RANK THE REMAINDER SO THE CAP SPENDS ON WHAT IS CLOSEST TO SURFACEABLE.
    `DAEMON_DRAFT_BATCH_CAP` currently slices an arbitrary order; with the registry permanently
    over cap, WHICH three are drafted is the whole decision and today it is unspecified.
    (v) NO CHANGE TO `classifyProposal` ITSELF. Its verdicts are what the console and `rmd approve`
    read; this task changes only what gets DRAFTED, never what counts as READY.
