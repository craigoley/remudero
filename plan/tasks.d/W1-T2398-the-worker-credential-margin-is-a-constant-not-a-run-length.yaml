  falsifier: |
    If the container's own ledger shows `fallback_push.cause` rows with `cause: credential_expired`
    at the SAME rate before 2026-08-27 as on it, then three-in-a-day is the standing rate rather
    than a new condition, and the urgency this shard implies is wrong even though the margin defect
    is real. The measurement to run is the one this host could not: the three-form union of the
    CONTAINER's `state/ledger*` for `step == "fallback_push.cause"`, per-form coverage control, with
    the query shown to find the three instances of 2026-08-27 before any zero is believed.

    SEPARATELY FALSIFYING: if the affected runs' turn counts and costs are indistinguishable from
    the unaffected population, the credential died LATE and the cost really is zero — in which case
    option (2) alone is the remedy and option (1) is over-engineering a non-problem.
