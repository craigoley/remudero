    open-PR bodies 0; head branches 0 of 91 live `run-*` heads; merged trailers 0 of 2,414 merged
    bodies; merged subjects 0 of 2,449. THE OPEN SET WAS ENUMERATED FIRST (3 PRs) and every control
    drawn from what it actually holds: W1-T2397 fires 1 on refs and titles, W1-T2387 1 on filenames
    and ids, W1-T2345 1 on bodies, W1-T2392 2 on trailers and subjects.

    ONE CONTROL COULD NOT COME FROM THE OPEN SET AND THAT IS RECORDED RATHER THAN PAPERED OVER: no
    open PR carries a `run-*` head today, so surface 6's control is drawn from the LIVE head
    namespace on origin (91 heads), which is the same surface. It fires 8 on W1-T1. The anchor was
    proved DISCRIMINATING on a POPULATED band, not merely quiet: `W1-T2` reads anchored 1 against
    unanchored 242, `W1-T23` 1 against 57. Probing `W1-T2398` itself reads 0 vs 0 and proves
    nothing, which is why a populated band was used instead.

    ── Q3 FIRST, BECAUSE IT IS THE ONE QUESTION THIS HOST CAN ANSWER ─────────────────────────────

    THE CREDENTIAL DOES CARRY AN EXPIRY AND THE CODE DOES READ IT. `extractCredentialExpiryMs`
    (`src/lib/worker-home.ts`) pulls `claudeAiOauth.expiresAt` out of the secret;
    `ensureWorkerKeychain` writes it to a sidecar at `WorkerKeychainPaths.expiryPath`;
    `deriveProvisionGate` reads that sidecar back and runs `classifyCredentialSidecar` against
    `nowMs` plus `DEFAULT_CREDENTIAL_EXPIRY_SKEW_MS`. Nothing is missing from the chain.

    THE DEFECT IS THE MARGIN, AND ITS OWN DOC OVERCLAIMS. `DEFAULT_CREDENTIAL_EXPIRY_SKEW_MS` is
    `5 * 60 * 1000` — FIVE MINUTES — and its comment reads "a stored token AT OR WITHIN this window
    of its recorded `expiresAt` is treated as already stale, SO A SPAWN NEVER RACES A TOKEN THAT
    EXPIRES MID-RUN". A five-minute constant cannot deliver that sentence. The gate answers "is this
    credential expired NOW", never "will it still be valid when this run ENDS", so a spawn holding
    six minutes of credential passes and loses it six minutes in. The three runs the brief names
    sit among the longest of the day, which is exactly the population a fixed margin fails on.

    THE REPO ALREADY HAS THE OTHER SHAPE, FOR A DIFFERENT CREDENTIAL. `nextRefreshDelayMs`
    (`src/lib/github-app.ts`) computes `expiresAtMs - REFRESH_MARGIN_MS - now` and SCHEDULES a
    refresh ahead of expiry for the GitHub App installation token. So "derive the margin from the
    thing being protected" is established practice here; the worker credential simply never got it.

    ── Q1. THE RATE IS UNMEASURABLE FROM THIS HOST, AND THE ZERO IS VOID ─────────────────────────

    THE HONEST ANSWER IS "CANNOT BE MEASURED HERE", NOT "ZERO", AND THE CONTROL IS WHAT SAYS SO.
    The brief requires that a query finding none historically be shown to find today's three. IT
    CANNOT, ON TWO INDEPENDENT GROUNDS, both measured:

      (a) WRONG HOST. The fallback push is ledgered — `log("fallback_push.cause", { branch, cause,
      detail })` (`src/run-task.ts`) — but a three-form union of this host's ledger (666 `.gz` + 6
      plain + live, 4,374,132 lines, newest row 2026-08-27T17:09:53Z, so the corpus IS current)
      carries ZERO `fallback_push*` rows of any cause. And it carries no row at all for W1-T2324,
      W1-T2379 or W1-T2387. Everything this host logged today is 718 rows, of which 714 are
      `cli.invoked` from this very session and 4 are `next_task_id.reserve`, all stamped
      `Craigs-Mac-mini`. THE THREE AFFECTED RUNS EXECUTED ELSEWHERE — the escalation issues name
      host `1abc274530a9` — and that host's ledger is not readable from here.

      (b) THE STEP IS TWO DAYS OLD. `fallback_push.cause` was introduced by `cdfa85e2` (#2879,
      2026-08-25, "name the orchestrator fallback push's cause, not just that it fired"). Even on
      the right host, a fortnight of history could not carry it.

    A FIRST QUERY WAS WRONG AND IS RECORDED SO NOBODY REPEATS IT. Searching the union for the bare
    string `credential_expired` returns 191 rows — which look like a rate until they are read: they
    are `containment.probe` rows spanning 2026-08-03 to 2026-08-12, a DIFFERENT mechanism
    (`spawn_credential_expired`, the preflight's fail-closed refusal), and not one of them is from
    2026-08-27. A rate quoted off that query would have been an artefact of a homonym.

    SO "IS IT NEW?" IS OPEN, AND THAT IS THE FINDING. The event became ledgerable only two days ago
    and the ledger that would hold it is off-host. Whether three-in-a-day is new or has always been
    the rate is UNANSWERABLE from here, and this shard does not guess.

    ── Q2. WHAT THE WORKER LOST IS ALSO UNMEASURABLE FROM HERE, AND THE SHARD SAYS SO ────────────

    The brief asks for the three affected runs' turn counts and costs against the unaffected
    population. Those figures live in `implement.done`/`run.start` rows on the container's ledger,
    and (a) above establishes this host holds none of them. NO COMPARISON IS OFFERED RATHER THAN AN
    UNCONTROLLED ONE. What can be said from source alone is the SHAPE of the exposure: the
    credential is provisioned ONCE per run (`ensureWorkerKeychain`, called from `worker.ts` and
    `run-task.ts`) and never re-checked during it, so if it dies early the worker spends the rest of
    the run unable to authenticate anything — push, `gh pr view`, `gh api`, a fetch of origin alike
    — and the only survivor is the orchestrator's own fallback, which runs OUTSIDE the sandbox with
    the orchestrator's credential. THE FALLBACK RESCUES THE PUSH AND NOTHING ELSE.

    ── WHAT THIS PROPOSES, AND WHAT IT REFUSES TO PROPOSE ────────────────────────────────────────

    THE RECORD IS THE FIRST DELIVERABLE AND MAY BE THE WHOLE ONE. Nothing here re-authenticates
    mid-run: that touches the credential chain, which took four PRs to stabilise this week, and the
    brief forbids proposing it unpriced. Two bounded options, in order of cost:

      (1) DERIVE THE MARGIN INSTEAD OF FIXING IT. `DEFAULT_CREDENTIAL_EXPIRY_SKEW_MS` becomes a
      floor rather than the whole margin, and the gate compares the recorded expiry against
      `now + expectedRunMs` — a number the dispatcher already has in the task's own `budget_usd`
      and the mount's turn cap. A spawn whose credential cannot outlive its own run is then
      refused BEFORE it starts, which is the same fail-closed direction the preflight already
      takes. Cost: one comparison, no new fetch, no re-authentication.

      (2) IF (1) IS TOO STRONG, MAKE IT OBSERVABLE OFF-HOST. The gate records the observed headroom
      (`expiresAt - now`) on the row it already writes, so the question this shard could not answer
      becomes answerable next time from any host that can read the beat.

    THE MARGIN'S OWN DOC MUST BE CORRECTED EITHER WAY. "so a spawn never races a token that expires
    mid-run" is false as written and is the kind of adjacent false claim this repo repairs on sight.

    ALREADY OWNED ELSEWHERE, RECORDED SO THIS DOES NOT RE-FILE IT: the fallback push itself is
    W1-T2318's lane, and the token-exchange chain is #2972/#3014/#3025. THIS SHARD OWNS ONLY THE
    MID-RUN EXPIRY — the margin that lets a run start with a credential too short to finish it.

    RISK BAND. `risk: high` is set UP FRONT and is RULE 19'S SPAN, NOT BLAST RADIUS: `files:` reads
    as two concerns, the `worker-home` stem and this task's own test stem, which `lint-plan` refuses
    at `risk: medium`. The blast radius is one comparison in a gate that already runs.

    ── AMENDED 2026-08-27: THE INSTRUMENT UNDER-COUNTS, SO Q1 IS UNANSWERABLE IN PRINCIPLE ───────

    Q1 ABOVE SAYS THE RATE IS UNMEASURABLE FROM THE OPERATOR HOST AND IMPLIES THE CONTAINER'S LEDGER
    WILL EVENTUALLY ANSWER IT. MEASURED ON THAT LEDGER, IT WILL NOT. `fallback_push.cause` carries
    EXACTLY TWO rows, both from 2026-08-27 and both `credential_expired`:
    `W1-T2379-1787840674939` at 15:09:40.503Z and `W1-T2387-1787845578879` at 16:32:53.012Z.

    BUT THREE FALLBACKS FIRED. W1-T2324 logged `fallback push firing for
    run-W1-T2324-1787823430981 — cause: credential_expired` at roughly 11:20Z, was rescued by the
    orchestrator push, and opened #3063. IT WROTE NO LEDGER ROW. So the instrument under-counts the
    day by a THIRD — two rows for three events.

    ROTATION DOES NOT EXPLAIN IT, AND THAT IS THE LOAD-BEARING CHECK. The union reaches back to
    2026-08-25 and BOTH surviving rows are from LATER THE SAME DAY than the missing one, so a
    retention cap that dropped 11:20Z would have dropped 15:09Z and 16:32Z first. The row was never
    written, not rotated away.

    WHAT THAT DOES TO Q1. The question "is three-in-a-day new?" cannot be answered from this surface
    EVEN AFTER ENOUGH TIME PASSES, because the surface LOSES INSTANCES rather than merely lacking
    history. Q1 above is therefore stronger than it states: it is not "unmeasurable today, wait for
    the rows", it is "this row is not a reliable denominator". Any future rate taken off
    `fallback_push.cause` is a LOWER BOUND of unknown tightness, and must be reported as one.

    WHY THE ROW WAS NEVER WRITTEN IS UNEXPLAINED AND DELIBERATELY NOT PROPOSED HERE. Establishing it
    is a separate investigation — a `log` call that did not fire, a run that took a different branch
    through the fallback, or a write that failed — and this section is a RECORD, not a fix. It is
    named as open rather than guessed at.

    AND THE MEASUREMENT HAZARD THAT ALMOST HID IT, WHICH IS THE SAME CLASS THIS SHARD ALREADY
    RECORDS ONCE. A bare `grep -c fallback_push` over the union returns THREE, not two — and the
    third is a `report.followups` row whose PROSE mentions the fallback, not a fallback event at
    all. That reads as "three rows for three events, nothing missing" and would have closed the
    investigation with the defect intact. It is the identical homonym class Q1 already records for
    the bare string `credential_expired` matching 191 `containment.probe` rows: SECOND INSTANCE ON
    ONE SHARD. THE RULE BOTH TEACH: anchor on the `step` FIELD, never on the bare string, and treat
    a count taken any other way as an artefact until the step is checked.

    Q3 IS UNAFFECTED AND IS NOT REOPENED. `DEFAULT_CREDENTIAL_EXPIRY_SKEW_MS` being a fixed five
    minutes against the day's longest runs stands on SOURCE — `deriveProvisionGate` comparing a
    recorded expiry to `now` and never to the run's expected length — and nothing about the ledger's
    under-counting bears on it. The margin defect is real whether the rate is two, three or unknown.
