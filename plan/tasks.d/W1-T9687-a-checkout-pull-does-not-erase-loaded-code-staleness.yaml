  design: |
    1. The daemon's assessment baseline is its immutable loaded-code SHA, captured once from the module checkout at boot.
       Carry it explicitly through daemonFreshnessReads into the awaited assessment; do not re-read mutable HEAD as the
       baseline of the running process. Reuse daemonLoadedCodeSha rather than introducing a second independently timed
       capture. Compute changedPaths, commits and touched declarations from that baseline to freshly fetched origin/main.
    2. Other service/CLI callers retain their existing checkout-HEAD semantics. An explicit missing, malformed or unreadable
       daemon baseline yields an unassessed/degraded answer with a reason; it never silently substitutes disk HEAD or
       starts an automatic restart. Keep all local Git awaited on the daemon path.
    3. Preserve tracked-dirty refusal, materiality, restart scoring, age pressure, quiet coalescing, lane holdouts, drain,
       STOP/PAUSE and existing host ownership. A material loaded-code advance remains visible after a disk pull and reaches
       those same guards; this does not command an immediate restart or change any timing/threshold.
    4. Exercise the real Git default in a private fixture: capture A, advance origin to B, fast-forward the checkout to B,
       retain loaded A, and prove the assessment still names A..B. Also prove loaded B is fresh, immaterial changes remain
       immaterial, dirty trees remain refused, and bad/unavailable baseline evidence remains named uncertainty.
       Assert real daemon wiring passes the once-captured SHA; an isolated helper test alone does not prove adoption.
    5. Include the existing freshness and caller/census suites this diff joins. A self-sync.ts change is a baked runtime
       input: after normal merge/build/recycle, separately verify image identity, boot-source ancestry and a natural
       freshness decision. Do not manually restart, deploy or bypass gates as part of this task.
