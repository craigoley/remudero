  risk: medium # the relint loop's lint widens to the push gate's own; the loop, its bound and the verdicts are unchanged
  origin: operator-session#wreckterra-pr6-lint-recon-2026-11-03
  plan_refs:
    - W1-T4423
    - W1-T4038
  files:
    - src/run-task.ts
