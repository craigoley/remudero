    Settled by lookup: must the new row be registered for retention? -> No. Rotation keeps every non-retained line verbatim in the dated archive, and nothing live reads this row (src/lib/ledger.ts:1596-1607).
    Settled by lookup: is W1-T10620 related? -> No. It is the machine-filed armed-idle blocker, a full-pass path (plan/tasks.d/W1-T10620-flow-armed-idle-review-success-required-checks-green.yaml).
  design: |
    1. `sleepIdleWithReviewDemand` writes one `daemon.idle_sleep.decision` row per idle sleep, when that
       sleep ends. Fields: `reason`, `eligible`, `cadence_ms`, `median_review_ms`, `pushes_per_pr_hour`,
       `poll_interval_ms`, `passes`, and `ended` (timeout, wake or stop). A field with no observed value
       is omitted, not written as zero.
    2. `reason` is one of: `light_pass_unwired`, `demand_unreadable`, `no_review_demand`,
       `cadence_unobserved`, `cadence_not_below_poll`, `run`. A `run` sleep with `passes: 0` is the wake
       case, so a reader never has to infer it.
    3. `readIdleLightCadence` reports the derived cadence at zero eligible once a review or push has
       been observed, so `no_review_demand` rows carry a cadence. With nothing observed it still returns
       undefined. The sleep's own gate reads `eligible > 0` as today.
    4. This task changes what is written, never what runs. Sleep lengths, the pass count and the gate
       stay as they are. Keep `daemon.idle_light_pass` and `daemon.idle_light_pass.demand_unreadable`
       unchanged, and keep the W1-T7734 idle tests passing as they stand.
    5. Add a characterization test with a mergeable PR and no review demand. It pins what a truly idle
       tick does: no idle light pass, a `no_review_demand` row, and the next tick's full pass as the only
       route to the arm, including the `daemon.sweep.skipped_concurrent` case. The PR body states the
       result in words, because W1-T11516 depends on it.
    No new timer, constant or cadence. The row rate is at most one per idle sleep.
  acceptance:
    - claim: "Every idle sleep writes exactly one daemon.idle_sleep.decision row naming its eligible count, cadence and reason, on each of the six reason branches"
      proof: "unit test: W1-T11515 criterion 1"
    - claim: "A sleep that decided to run and was woken before its first pass reads reason run with passes 0 and ended wake, not a silent absence"
      proof: "unit test: W1-T11515 criterion 2"
    - claim: "With zero eligible demand the row still carries the derived cadence once a review or push was observed, and the sleep still runs no pass and sleeps the whole poll interval"
      proof: "unit test: W1-T11515 criterion 3"
    - claim: "A characterization test pins a truly idle tick with a mergeable PR: no idle light pass, a no_review_demand row, and the next tick's full pass as the only route to the arm"
      proof: "unit test: W1-T11515 criterion 4"
    - claim: "The decision row is written by the idle sleep itself"
      proof: 'grep: daemon\.idle_sleep\.decision in src/lib/daemon.ts'
  note: |
    verify:auto, because every row and the characterization are assertable with an in-process daemon
    fixture. risk:high because it edits the daemon loop and sweep.ts. The change is one concern, so its
    budget stays low. The builder names each criterion test with the marker "W1-T11515 criterion N".
    After merge, read the rows with `rmd ledger-grep daemon.idle_sleep.decision`. Compare their count
    with `daemon.sweep.started` over the same window: few decision rows means the idle branch itself is
    rarely reached, which would clear the cadence gate as the cause. W1-T11516 stays held until that
    reading exists.
  falsifier: |
    Drop the row on any one branch: the criterion 1 case for that reason fails. Write the row at sleep
    start: the run-with-wake case cannot report passes 0 and ended wake, and criterion 2 fails. Let the
    reader report eligible above zero when none exist: the criterion 3 no-pass assertion fails. Open
    the arm on the idle pass here: the characterization fails, because that belongs to W1-T11516.
