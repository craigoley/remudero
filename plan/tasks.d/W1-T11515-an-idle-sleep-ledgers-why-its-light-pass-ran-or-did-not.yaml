  rationale: |
    Operator ruling 2026-11-06: file this narrowed, as cover for missed events.

    THIS DID NOT CAUSE THE PR #16962 DELAY. That delay came from 13 interphase-review stand-downs
    (W1-T11510) and selected-registry timeouts (W1-T11463). Nothing here claims to shorten it. This
    task is step 1 of 2. It measures a pass that has never been seen running, and W1-T11516 is step 2.

    EVIDENCE, supplied by the operator and not re-run for this filing, because the architect lane has
    no ledger access. `daemon.idle_light_pass` and `"light_pass_scope":"idle"` have 0 rows across 391
    archives plus the live ledger. The control `"light_pass_scope":"drain"` has 2,671 rows over the
    same corpus. So the idle pass has never been observed running. W1-T11445 recorded an earlier zero
    for this query as inconclusive for lack of a positive control; the drain count is that control.

    MECHANISM IN SOURCE. `sleepIdleWithReviewDemand` (src/lib/daemon.ts:6296) runs a pass only when
    `demand.eligible > 0` and `demand.cadenceMs < pollIntervalMs` (60 s). `readIdleLightCadence` and
    `deriveIdleLightCadenceMs` (src/lib/sweep.ts:18359-18391) count only eligible review demand and cap
    cadence by median review time and half the mean push gap. That cadence gate is the suspected
    reason for the zero. It is INFERRED, NOT MEASURED. Below 60 s it needs a median review under 60 s,
    or more than 30 pushes per PR-hour. Three other causes are equally unmeasured, and no current row
    can tell them apart:
    - The idle sleep may rarely be reached. It runs only when the tick selected nothing
      (src/lib/daemon.ts:7108-7156).
    - `readIdleLightCadence` returns undefined at zero eligible, so the most likely branch has no
      cadence to report.
    - A sleep that decided to run returns with no pass if a wake lands in its first chunk
      (src/lib/daemon.ts:6315).

    WHAT AN IDLE TICK DOES TODAY, read from source and not yet pinned. The code comment says the next
    tick's full pass follows the sleep. `runGatedSweep` starts once per loop iteration
    (src/lib/daemon.ts:6181), and it declines with `daemon.sweep.skipped_concurrent` while an earlier
    pass still runs. An ordinary or full pass reaches the guarded `mergeable` arm in
    src/lib/sweep.ts:21908. A review-only idle pass does not, because `lightPassActionable` receives
    `armAllowed` false from src/cli/commands/sweep.ts:1189. This task pins that behaviour in a test.

    Settled by lookup: is this already filed or decided? -> Not as measurement. W1-T7734 built the idle pass and has no row for a sleep that runs none; W1-T9569 named the scope only (plan/tasks.d/W1-T7734-the-sweep-sees-a-new-head-in-the-same-pass.yaml, plan/tasks.d/W1-T9569-a-review-only-light-pass-names-its-scope.yaml).
