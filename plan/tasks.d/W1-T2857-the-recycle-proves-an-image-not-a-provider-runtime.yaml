    This task does not claim the repository script caused the 2026-09-05 replacement; mount evidence
    proves only that the supported launch contract was not present. W1-T2858 separately makes this
    runtime drift visible off the shell. Neither task authorizes a recycle.

    SCOPE AMENDMENT 2026-09-05: the runtime verifier becomes a postcondition of the existing
    recycle script, so that script's established stub must emit the mount inspection the new
    postcondition consumes. Without `test/recycle-container.test.ts` in scope, every existing
    successful recycle regression would stop at an unmodelled empty mount list and the task
    could not prove that image verification, pause/drain sequencing, authentication, reclaim
    and the Claude-only fallback remain unchanged. This adds the existing regression harness
    only.

    This scope amendment does not broaden the production surface or authorize a recycle: it
    files no code, adds no production subsystem, and grants no operator permission to run the
    recycle lifecycle. It only widens `files:` to include the existing regression harness
    already required by the unchanged-lifecycle acceptance criterion above.

    SCOPE AMENDMENT 2026-09-05 (W1-T2866): GitHub's four Linux shards falsified the first
    amendment. Seven older focused suites each carry an independent Docker fixture for the real
    recycle script. Their successful-path fixtures model image, credential, drain, reclaim,
    worktree and wait contracts, but none modeled the newly mandatory Mounts inspection. The new
    postcondition therefore failed closed before those unchanged assertions could run. Add only
    the seven deterministically failing fixture files named above so each successful replacement
    reports the state and Claude mount tuples selected by that same test invocation. Keep drift
    fail-closed; do not add a test-only bypass or treat empty/unreadable mounts as healthy.

    The new verifier suite also resolves a Bash-4-capable test binary once and uses it for every
    deploy-script spawn. That preserves the existing macOS host-parity completeness gate without
    registering avoidable Bash-3 failures as permanent host debt. No production behavior or
    lifecycle authority is added by this amendment.

    SCOPE BOUNDARY (W1-T2866): this scope amendment itself files neither
    `deploy/container-runtime-contract.sh` nor `test/container-runtime-contract.test.ts` — it
