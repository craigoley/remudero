  rationale: "MEASURED FROM SOURCE at bce8338, this filing session — AFTER W1-T316 (#1257) and
    W1-T317 (#1259) merged: grepping src/ scripts/ bin/ .github/ for checkQueueGovernor or
    logQueueGovernorDeferral returns only their definitions and doc cross-references in
