    serial dispatch. Reconciling the two step names (or retiring one implementation) is part of
    this task's report, not a silent choice. (2) wipLimit IS already a plan/policy.yaml row
    (unlike dailyCostCeilingUsd before W1-T317), so this is wiring only — no policy migration."
  design: |
    GIVE THE EXISTING PREDICATE A CALLER, mirroring the SHAPE THAT JUST LANDED: W1-T317's #1259
    wired checkCostGovernor via an optional dep on DrainDeps consulted on the NEW-dispatch path,
    supplied by BOTH real dep-object construction sites in src/run-task.ts (drain and daemon),
    with the deferral ledgered so a held fleet is distinguishable from an idle one, and a
    regression lock asserted against the dep objects the commands actually build. Read that
    landed diff (commit c020040) before writing anything and mirror it — including its
    drainage-is-never-gated scope rule: at or over wipLimit NEW dispatch defers; sweep, heal,
    arm and merge at ANY depth are never gated.
    LEDGER DISCIPLINE: if the wiring introduces or first-emits a step name any decision reads,
    register it in DECISION_RELEVANT_LEDGER_STEPS (src/lib/ledger.ts) in the SAME change — the
    W1-T316(iv) rule; a rotation dropping a decision-read line re-arms its behaviour forever.
    VERIFY THE CALL SITES FROM SOURCE before wiring — distrust this note; symbol names drift.
    EXPLICITLY NOT IN SCOPE: the wipLimit VALUE, laneDispatchBudget's own behaviour on the drain
    lanes path (reconcile step NAMES, do not rewrite the lane budget), and any change to
    checkQueueGovernor's predicate semantics.
