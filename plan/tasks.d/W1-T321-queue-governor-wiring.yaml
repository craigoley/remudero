    which makes this the LAST shipped-but-unasked dispatch governor. test/queue-governor.test.ts
    covers the predicate, so this is the tested-but-inert shape, third and final instance.
    TWO COMPLICATIONS the worker must know, both re-verified at bce8338: (1) W1-T172's
    laneDispatchBudget (src/lib/drain.ts) re-implemented the WIP throttle inline for the hand-run
    drain lanes path, ledgering dispatch.wip_deferred — a DIFFERENT step name than this governor's
