  rationale: |
    SPLIT from W1-T10957 on 2026-11-04 by operator ruling ("Split the native backend"). MEASURED at #16606 head 7a883fd1c5: diff-coverage listed 842 added lines with no covering test.
    - About 760 of them are native-only: model-canary-systemd-bwrap-backend.ts 587, model-canary-native-profile-probe.ts 174, plus the coding adapter (34) and host bridge (24).
    - GitHub's runners provide no user systemd session and no bwrap, so the one real-path test skips ("native Linux profile prerequisites unavailable") and nothing downstream executes: unit lifecycle, cgroup and namespace readback, control runs.
    - The probe reads /usr/bin/systemd-run, /usr/bin/systemctl and /usr/bin/bwrap at fixed paths, and only the real backend may issue a qualified coding profile. So fake tools or a test-issued profile would either be impossible or open a test-only door into the sandbox boundary.
    - Fakes cannot prove isolation: the claim is that the kernel and systemd contain filesystem and credential effects and reap descendants, which only a real host can show.
    - MOVED HERE 2026-11-04 from W1-T10957 (#16606's 19:05Z review FAILed both): the claims that the real default production path invokes scoreCodingControl and codingLedgerSave. Without a native profile source the default composition defers before it constructs the coding execution port, and that port is this task's (createCodingCanaryExecutionPort). Only this task can make the default path reach the scorer and the ledger save. The claim text is unchanged; the proofs are tests through the real default composition on a qualified host, because a grep for the call site already matches once W1-T10957 merges and so could not miss at this task's base.
  design: |
    1. Coverage route: first PROVE, in a throwaway workflow run on a scratch branch, that an ubuntu-24.04 runner can run bwrap unprivileged (sysctl kernel.apparmor_restrict_unprivileged_userns=0) and a user systemd session (loginctl enable-linger plus XDG_RUNTIME_DIR), and that test/routing/model-canary-native-session.test.ts then executes instead of skipping.
       - Only then add those preparation steps to the coverage job in .github/workflows/ci.yml (verify: human, because it edits a workflow and runner security settings).
       - If GitHub's runners cannot, fall back to a host-run coverage lane on the Azure host whose receipts the coverage gate accepts, which is itself an operator decision. Record the throwaway run's result in the PR either way.
    2. Restore the native modules removed from W1-T10957's build (#16606), add createCodingCanaryExecutionPort back to model-canary-coding-adapter.ts (W1-T10957 keeps only its worker request port there), and wire qualifiedLinuxCodingProfileForCurrentHost as the command's default native profile source. W1-T10957 ships with no native source, so it always defers.
    3. Re-add the native-only exports W1-T10957's build dropped as callerless:
       - CanarySlotOwner.resolveClaimedCodingSlot and ClaimedCodingRequestBinding (model-canary-owner.ts), used by the host bridge;
       - unavailableCodingAttempt (model-canary-coding.ts), used by createCodingCanaryExecutionPort;
       - the production worker runtime in replayPrivateCli (loadConfig plus benchmarkNonDispatchSpawn("model-canary-coding")), which W1-T10957 requires to be injected.
    4. Move the native-only tests listed in files, plus the host-bridge chmod declaration in test/host-capability-fixtures.test.ts and the RMD_CODING_* and RMD_PROFILE_PARENT_SENTINEL envEntries in config-schema.ts, which name the backend.
  falsifier: |
    At origin/main after W1-T10957, no native coding backend is wired, the coding command always defers with coding-native-profile-unavailable, and no CI job executes a systemd/bwrap sandbox.
