    - claim: "a terminal carrying real lint findings cannot retry, and also stays replayed when its reason is any ran false reason other than the exited-with-no-summary shape"
      proof: "grep: W1-T11390: real lint findings never retry in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "a malformed terminal, a capped or keyword-only terminal, an absent recorded base, or a missing checkout refuses with the prior terminal replayed"
      proof: "grep: W1-T11390: a malformed terminal or missing checkout refuses in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "a changed head or base, whether seen at admission or by the re-check at publication, refuses and posts nothing"
      proof: "grep: W1-T11390: a changed head or base refuses in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "failing, incomplete or unreadable checks, and an unpinned or unusable review App identity, each refuse before any lint runs"
      proof: "grep: W1-T11390: failing checks or an unpinned identity refuse in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "a concurrent owner stands the request down, whether it holds the decision lock or has a live pending claim from another run"
      proof: "grep: W1-T11390: a concurrent owner refuses in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "a second incomplete lint posts nothing, reaches no conflict status, keeps the previous failure as the terminal, and refuses any further request for that head, base and digest"
      proof: "grep: W1-T11390: a second incomplete retry keeps the prior failure in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "with no retry request the same terminal replays exactly as before and W1-T3835's capped keyword-only reopening is unchanged"
      proof: "grep: W1-T11390: without a request the terminal still replays in test/plan-only-review-runs-lint-plan.test.ts"
    - claim: "each request ledgers its own attempt row under one step"
      proof: "grep: review\\.plan_lint_retry in src/lib/review.ts"
    - claim: "the whole plan-only review suite still passes, so W1-T4423's withholding and the fail-closed lint parser are preserved"
      proof: "unit test: test/plan-only-review-runs-lint-plan.test.ts"
      kind: guard
  falsifier: |
    At origin/main, seed a review.posted row whose decision_verdict is a plan-only failure with planLint
    { ran: false, reason: "lint-plan exited 1 with no summary" }, capped false and keywordOnly false, and call
    claimReviewDecision with a materialized checkout. It returns replay, and no option can change that. At head,
    the same call with an explicit request and matching facts returns owned, and a clean fresh outcome posts
    success while the seeded row remains unchanged.
    Remove any one guard from the admission list and its named test reddens. Widen the reason match to any
    ran false reason and "real lint findings never retry" reddens. Drop the admitted-row bound and "a second
    incomplete retry" reddens. Route an incomplete outcome through the conflict arm and the same test reddens
    on the unexpected post.
  note: |
