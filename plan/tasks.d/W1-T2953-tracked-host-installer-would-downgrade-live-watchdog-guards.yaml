      proof: "unit test: test/host-units-install.test.ts"
    - claim: "removing any one load-bearing mount, ordering, persistence or heap guard makes check mode report the exact artifact drifted"
      proof: "unit test: test/host-units-install.test.ts"
    - claim: "heap sizing is an explicit validated input and never inferred from an already-installed launcher or silently downgraded to 4096 on the current 32 GiB host"
      proof: "unit test: test/host-units-install.test.ts"
    - claim: "STOP refusal, unmounted-state refusal, live-daemon idempotence and revival recording remain present in the rendered launcher"
      proof: "unit test: test/host-units-install.test.ts"
    - claim: "default check mode writes nothing and a temp-root install remains atomic without invoking systemctl"
      proof: "unit test: test/host-units-install.test.ts"
    - claim: "the operator guide requires a green check and explicit operator approval before any live install, and this change performs no host lifecycle action"
      proof: "grep: explicit operator approval in docs/operator-guide.md"
    - claim: "restoring the pre-W1-T2953 renderer makes the captured-live-host fixture fail on at least the fleet service, watchdog service, reaper service and reaper timer"
      proof: "mutation test: test/host-units-install.test.ts"
  falsifier: |
    Close without implementation if a read-only check using the current 8192 MiB host input already
    reports all seven installed artifacts matching, or if the installed extra guards are proven
    harmful and deliberately scheduled for removal. The six drift reports and semantic diffs
    falsify the first; no reviewed removal decision exists for the second.
