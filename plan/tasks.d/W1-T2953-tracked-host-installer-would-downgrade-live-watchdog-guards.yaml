  rationale: |
    OBSERVED READ-ONLY ON AZURE AT 2026-09-06T10:06Z. Running the tracked
    `deploy/install-host-units.sh` in its default check mode reported six of seven artifacts
    DRIFTED; only `rmd-fleet-watchdog.timer` matched. The installed fleet service, watchdog service
    and both timers are enabled, both timers are active, and the watchdog last fired within five
    minutes, so this is a live recovery surface rather than unused debris.

    THE DIFFERENCES INCLUDE LOAD-BEARING SAFETY, NOT ONLY COMMENTS. Against a renderer supplied the
    live host's 8192 MiB heap value, the installed fleet and watchdog units additionally require
    `/var/lib/containerd`; the installed stray-reaper service orders after Docker and requires
    `/mnt/rmd`; and its timer is persistent across downtime. The installed launcher carries
    `NODE_OPTIONS=--max-old-space-size=8192`, while the repository default still renders 4096. The
    reaper binary's remaining drift is comment-only, but the installer's byte comparison makes all
    six artifacts one red check.

    THIS SUPERSEDES THE DEPLOYABLE CONTENT OF W1-T2877, NOT ITS ARCHITECTURE. That task correctly
    put the hand-installed watchdog under source control, made check mode read-only and kept
    lifecycle installation explicit. Later incident hardening changed the live units without
    returning those changes to the renderer. W1-T2932 independently made `NODE_OPTIONS` a declared
    runtime variable, but did not update this installer's current-host default. W1-T2856 established
    that containerd and Docker data-root mount ordering are part of the host safety boundary.

    APPLYING `--install` NOW IS UNSAFE: it would make the files match by removing several live
    protections. This task repairs the source of truth only. Commissioning the reviewed result on
    Azure remains an explicit operator-approved operational step.
  design: |
    Reconcile the renderer with the stronger installed semantics: preserve containerd mount
    ordering on the fleet and watchdog units, Docker and `/mnt/rmd` ordering on the stray reaper,
    and persistent missed-run recovery on the reaper timer. Retain the STOP, state-volume,
    idempotence and revival-record guards byte-for-byte in effect.

    Make heap sizing one explicit host input across check and install. Keep the current Azure
    default at 8192 MiB only if the implementation re-verifies the VM memory class; otherwise
    require `RMD_NODE_MAX_OLD_SPACE_MB` and make omission a named refusal rather than silently
    rendering 4096. Do not derive a desired value from the currently installed launcher, because
    that would make drift self-ratifying. Continue to render the value through the declared
    `NODE_OPTIONS` path W1-T2932 protects.

    Add captured installed-unit fixtures that prove check mode recognizes the reconciled host and
    flags deletion of each mount/order/persistence/heap guard. Preserve the existing temp-root
    install tests and the default no-write check mode. Update the operator guide with the exact
    read-only check and explicit install preconditions, but do not run install, daemon-reload,
    enable, start, stop, restart, recycle or deploy from this task.
  acceptance:
