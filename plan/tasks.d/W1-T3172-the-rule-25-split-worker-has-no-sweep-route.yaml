      proof: "grep: W1-T3172 exact structural verdict reaches blocked-fixable in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "the cold fix-rung reconstruction carries instrumentEntangled and both exact path sets into W1-T2436's existing prerequisite-worker arm"
      proof: "grep: W1-T3172 cold reconstruction preserves both entanglement path sets in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "the first effect for that cold route is a prerequisite spawn with zero ordinary fix strikes, not an in-place gate-fix worker"
      proof: "grep: W1-T3172 prerequisite spawn precedes every ordinary strike in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "a stale head, changed input digest, missing or malformed path set, or non-entanglement failure cannot launch the split worker"
      proof: "grep: W1-T3172 incomplete structural evidence fails closed in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "Standing rule 15 and a genuinely empty unexplained failure remain blocked-ambiguous, while ordinary unmet criteria retain their existing fix route"
      proof: "grep: W1-T3172 unrelated review routes stay byte-identical in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "strike exhaustion still wins before the split route and no prerequisite is merged or rebased before its independently green merge state"
      proof: "grep: W1-T3172 exhaustion and prerequisite safety still win in test/entanglement-split-sweep-reachability.test.ts"
    - claim: "removing the producer, disposition, or cold-rung threading link reproduces PR #4559's blocked-ambiguous no-spawn state"
      proof: "grep: W1-T3172 three-link falsifier reproduces the PR 4559 stall in test/entanglement-split-sweep-reachability.test.ts"
  falsifier: |
    Close without implementation if a current-main board view built from #4559's exact ledger row
    already derives `blocked-fixable` and its first cold fix effect is
    `renderPrerequisitePrPrompt` with both recorded path sets. Current main at db770194 drops the
    structured fields and the live sweep twice emitted blocked-ambiguous, directly falsifying that
    alternative.

    Prove each link load-bearing independently. Neuter the ledger projection while leaving routing
    and the rung intact: the fixture must fail closed. Neuter only the disposition row: it must
    return to contradictory blocked-ambiguous. Neuter only cold-rung threading: no prerequisite
    spawn may be observed. A test that stays green after any of those mutations proves only a
    helper, not the production chain.
