  rationale: |
    OBSERVED ON PR #4559 AT 2026-09-08T13:23:28Z. Its authoritative `review.posted`
    row records `state: failure`, `failure_class: instrument_entangled`, an empty
    `unmet_criteria` array, and both exact path sets under
    `decision_verdict.instrumentEntanglementPaths`. The review summary correctly says to land the
    instrument change in its own PR and then rebase. At 13:31:00Z and 13:35:12Z the sweep instead
    disposed the same head as `blocked-ambiguous` with "no actionable unmet criteria
    (contradictory)" and dispatched no prerequisite worker.

    THE FULL LOSS CHAIN IS IN CURRENT MAIN. `reviewLedgerReasons` adds a structural fallback only
    for `changesetContradictions`, so a pure instrument-entanglement verdict ledgers `reasons: []`.
    `actionableGateFailuresFromLedger` therefore returns none, and the disposition table's normal
    review-fix row cannot match. The final failure row calls the verdict contradictory. Even if
    the board were routed manually, `buildFixRungDispatchArgs` reconstructs only criteria and
    summary: it drops both `instrumentEntangled` and `instrumentEntanglementPaths`. W1-T2436's
    special arm checks that boolean before spending a strike, so the prerequisite builder remains
    unreachable and an ordinary worker would be sent an in-place repair it cannot honestly make.

    THIS IS NOT A REQUEST TO WEAKEN RULE 25. W1-T527 correctly classifies gate-conflict as a
    condition an in-place patch cannot satisfy. W1-T2436 later supplied a different effect: open a
    separate prerequisite PR, wait for its own CI, park the original, and rebase only after the
    prerequisite merges. The missing work is the typed connection from the authoritative review
    record, through the board disposition, into that existing arm. W1-T3029's rule-15 refusal must
    remain blocked-ambiguous because no equivalent sanctioned worker exists for editing task
    criteria; the two structural failures must not be generalized together.
  design: |
    Recover one head-and-input-bound structural review record from the same `review.posted` ledger
    scan that already builds the board. Match the current task key, exact `head_sha`, and exact
    `review_input_digest`; last matching record wins, and a success or another class clears the
    entanglement projection. Accept only `failure_class === instrument_entangled` with two
    non-empty arrays of bounded strings under the already-recorded
    `decision_verdict.instrumentEntanglementPaths`. Missing, malformed or stale evidence is no
    authority to launch a split and preserves today's blocked-ambiguous result.

    Add typed optional fields to `OpenPrView` for the structural failure class and the two path
    sets. Add one disposition row after strike exhaustion but before ordinary review-fix routing:
    exact structured entanglement with usable path evidence is `blocked-fixable`, with a reason
    that names W1-T2436's prerequisite path and explicitly says zero ordinary strikes. Do not turn
    the summary text marker or generic `reasons` array into dispatch authority.

    Thread the same structured fields through `buildFixRungDispatchArgs` so its cold
    `initialReview` has `instrumentEntangled: true` and the exact path sets. Then the existing
    W1-T2436 arm must be the first effect: it dispatches the prerequisite worker before
    `strikes++`, uses `fix.prerequisite_opened` as its idempotency memory, waits for green, and
    parks/rebases through the existing shared helper. Do not reimplement any of those effects in
    sweep, spend an ordinary fix strike, merge a prerequisite, or infer paths from prose.

    The test must drive the full cold path: a ledger row shaped exactly like #4559 becomes a board
    view, derives `blocked-fixable`, builds a cold rung carrying both path sets, and reaches the
    prerequisite spawn with zero ordinary fix dispatches. Negative controls cover stale head,
    changed body digest, malformed/missing path data, rule 15, ordinary unmet criteria, and strike
    exhaustion. Deleting any one of the producer, disposition or cold-rung threading links must
    restore the observed blocked-ambiguous/no-spawn failure.
