- id: W1-T6109
  title: "THE SELECTOR GARDENER COUNTS THE IMPACT ARM — W1-T6083's shadow record now carries an `impact` verdict per failure and an impactSize per run, but selector-shadow-gardener.ts parses, folds and judges only `floor` and `narrow`, so the impact arm's misses and savings are dropped on read and nothing can ever say it is safe"
  repo: remudero
  depends_on: [W1-T6083]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the gardener's readiness reading includes the impact arm
  band_meaning: span
  origin: "operator session 2026-10-06: follow-up found while building W1-T6083 (PR #9760)"
  plan_refs: [W1-T6083, W1-T4439, W1-T4764, W1-T4406]
  files: [src/lib/selector-shadow-gardener.ts, test/the-selector-gardener-counts-the-impact-arm.test.ts]
  status: queued
  priority: 2 # operator-2026-10-09: self-improvement: the selector gardener still drops the impact arm (no impact field read in selector-shadow-gardener.ts)
  attempts: 0
  rationale: |
    READ 2026-10-06. On the PR #9760 head src/lib/affected-suites.ts's shadow scorer emits
    `impactSize`, `impactFallback` and a per-failure `impact: "selected" | "missed" | "flake"`. On
    origin/main src/lib/selector-shadow-gardener.ts `parseSelectorShadowLines` rebuilds each record from
    `floor`/`narrow` fields only, so the impact fields are silently discarded. The fold loops over
    `["floor", "narrow"] as const`, `selectorShadowUnattributedReason` reads only floor and narrow misses,
    and the readiness verdict names only the narrow arm. PR #9742 (merged) added the rule that a miss counts
    only when the diff plausibly caused it; it applies per arm and must apply to the impact arm too.
  design: |
    Parse the optional `impact`/`impactSize`/`impactFallback` fields with the same validation as `narrow`
    (present together or absent together; a malformed row is refused, not half-read). Add `impact` to the
    fold and the report beside `narrow`: verdicts, median size, flakes and unattributed misses, using
    `selectorShadowUnattributedReason` unchanged so #9742's attribution rules apply. Count runs where the
    arm fell back separately (by `impactFallback` reason), never as selections, so a run of fallbacks
    cannot look like a cheap safe arm. The readiness sentence names each arm's own evidence; it does not
    clear the impact arm on narrow's record.
  acceptance:
    - claim: "a shadow line carrying impact verdicts is parsed with them, the report folds the impact arm's selected and missed failures and median size beside the narrow arm, a miss the diff did not plausibly cause is unattributed for the impact arm as for the others, and a fallback run is counted as a fallback rather than a selection"
      proof: "unit test: test/the-selector-gardener-counts-the-impact-arm.test.ts"
  falsifier: |
    Leave the fold's arm list as floor and narrow: the impact arm's missed failure is absent from the
    report and the second test fails.
  note: |
    Depends on W1-T6083 (#9760, open at filing) for the record shape. The arm stays shadow; this only
    makes its record readable. Without W1-T6107 producing a map every run is a fallback, which this task
    reports as such.
