  note: |
    **NO PROOF IN THIS SHARD GREPS ITS OWN PATH.** All five criteria use the pure-path `unit test:`
    form naming `test/fix-rung-unchanged-tree-stand-down.test.ts`, which is declared in `files:`, so
    `judgeCriterion`'s `not_yet_built` carve-out applies at filing time. A `grep:` proof naming this
    shard would be out of scope by construction — a `verify: auto` task cannot declare its own plan
    record in `files:` — and would draw `lint-plan`'s `proof-scope` warning about
    `scopeGuardOutOfScopeFiles` refusing the branch after the work is done.

    **RISK BAND IS RULE 19 SPAN, NOT BLAST RADIUS.** `files:` crosses `src/` and `test/`, so the SPAN
    reading is `high`. `high` EXEMPTS `sizingViolation` rather than clearing it — it returns
    `undefined` outright at that band — so a clean lint is NOT evidence the span was vetted. The blast
    radius is narrower: a third reason source composed into one existing gate. The danger is the
    CONDITION'S WIDTH, which is why criteria 2, 3 and 5 all exist to hold it narrow; a change passing
    criterion 1 and failing any of those has built "stop fixing PRs".

    **THE FALSIFIER, STATED SO IT CAN BE RUN.** Falsified if a strike that WOULD have made progress is
    refused — observable as a rung standing down while the previous strike's push actually changed
    tracked or untracked content. Also falsified if rung spend does not fall on the repeat path, or if
    any gate's verdict is ever reported without the gate having run.

    **MEASUREMENT PROVENANCE.** Clone checked NOT shallow (`--is-shallow-repository` false, 2059
    commits) BEFORE any history query. `src/run-task.ts` is 1,490,268 bytes — over the Contents API's
    1 MB cap, where it returns `encoding: "none"` and greps to a clean zero — so every source figure
    was read through git objects in a worktree proven equal to `origin/main` by sha. Step names and
    symbol names were taken from source, never guessed. The external precedent was re-derived by
    cloning `PrimeIntellect-ai/prime-agent` and reading `e319a66d`'s blob, not from memory of it.

    **ID PROVENANCE.** `refs/rmd-id/W1-T1284` reserved 2026-08-23T20:24:38Z and confirmed still held
    and unused. Eight surfaces swept, each with a control qualified for that surface and none
    disqualified: the reservation ref (1, against a namespace of 316); shard filenames on main 0
