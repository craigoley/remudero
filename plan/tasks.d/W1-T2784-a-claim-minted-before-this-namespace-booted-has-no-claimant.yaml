  rationale: |
    THE MEASURED INCIDENT. `refs/rmd-dispatch/W1-T2631` was minted `490780@5670f73af4f4` at
    2026-09-03T03:52:05.691Z. Its run reached recon, built a prompt, spawned an implement worker
    (`worker.state` rows through 04:02:47Z) and then stopped — no verdict row, no claim release.
    The daemon container restarted at 11:37:56Z under the SAME id, so pid 490780 was gone while
    the hostname the anchor named still matched. Every later lane read a live-looking holder and
    took the operator arm. FOUR refusals followed (11:45, 15:25, 16:47 on W1-T2631; 11:45 on
    W1-T2636), each one AFTER two preflight workers had already spawned — $2.3421 of preflight
    burned on refusals alone, 17.4% of that day's total preflight spend. W1-T2631 and W1-T2636
    together: 173 cost rows, $37.6891, 60 `blocked_containment` + 62 `blocked_isolation`, zero
    completions. The operator cleared four refs by hand.

    THE OPERATOR ARM IS CORRECT AND IS NOT WEAKENED. "Cross-host liveness is not decidable" is
    true whenever the anchor names a host this process is not — the same reason `isHolderStale`
    (W1-T396) refuses to widen into a cross-host question at all. This task does not attempt
    general cross-host liveness and must not be read as a step toward it.

    THE ONE DECIDABLE CASE. A process cannot outlive the PID namespace containing it. When the
    anchor's host equals this process's own hostname AND the claim's minted-at predates this
    namespace's init start, the claimant provably cannot exist. No liveness guess, no timer, no
    elapsed-time threshold — two recorded facts compared against each other, never against "now".

    WHY BOOT TIME IS PRIMARY AND PID ABSENCE ONLY CONFIRMS. Pid liveness alone carries a reuse
    hazard: a recycled pid reads ALIVE and errs safe, but reading a pid as ABSENT is only sound
    if that number could not have been reused — which a namespace restart guarantees and nothing
    else does. So the boot comparison carries the proof and `pidPresent` must AGREE; both hold or
    the arm declines. A pid that reappeared under a recycled number after the restart therefore
    BLOCKS the release, leaving the operator arm to handle it. That false negative is the stuck
    claim persisting — today's behaviour — and is the safe direction; a false positive is the
    duplicate dispatch W1-T1265 measured at 53.776 seconds apart.
  design: |
    TWO OF THE THREE SIGNALS THE BRIEF SUGGESTED ARE WRONG, MEASURED BEFORE BUILDING — the brief
    asked for this check explicitly and it changed the implementation:

      - `/proc/uptime` IS NOT NAMESPACED. Read inside the daemon container it returned 27884.08s
        against the host's 27884.02s — the HOST's boot (10:52:57Z), not the container's start
        (11:37:56Z). A predicate built on it compares a claim against the wrong epoch entirely.
      - `stat -c %y /proc/1` IS NOT PROCESS START. It read 17:27:50Z for a container started at
        11:37:56Z — proc-entry access time, ~6h off.

    THE CORRECT READING is `/proc/stat`'s `btime` plus `/proc/1/stat` field 22 (starttime, in
    CLK_TCK ticks). MEASURED: reconstructs docker's own `StartedAt` to 11:37:55Z against
    11:37:56.73Z — the one-second rounding of integer ticks. It is namespace-correct for free,
    because `/proc/1` resolves to whatever init THIS namespace has: host boot on the host,
    container start inside the container, with no branch on which one we are.

    FIELD 22 IS INDEXED FROM AFTER THE COMM, NOT FROM THE LINE START. `/proc/<pid>/stat` field 2
    is free-form inside parentheses and may contain spaces AND parentheses, so a whitespace split
    mis-indexes every later field. `readNamespaceBootMs` slices after the LAST `)` and indexes
    from there; its own guard builds the fixture positionally rather than hand-spacing it, because
    a hand-written version of that row got the count wrong on the first attempt.

    A FOURTH ARM, ORDERED AFTER holder AND evidence, BEFORE operator. Both new inputs are OPTIONAL
    and LAST on the existing parameter objects, so every existing caller and every pre-existing
    test fake keeps today's three-arm behaviour byte-for-byte: no probe supplied ⇒ no anchor
    identity ⇒ the arm declines to `operator`. The probe is a THUNK and is called only once an
    anchor has actually parsed, so arms 1 and 2 still cost no `/proc` read and no git round trip.

    THE DROP PINS ITS LEASE. The dead-claimant arm drops with `--force-with-lease` against the sha
    it JUDGED, so a claim re-minted between the read and the push — a live lane legitimately
    taking it — fails the lease and survives. That is the one race a proof-of-death cannot see,
    closed by git rather than by a guess.

    NO CLOCK ANYWHERE IN THE DECISION. W1-T2446's guard forbids `Date.now`/`new Date(`/timers
    inside `decideDispatchClaimRelease`, and that guard is protecting a real property. The
    identity and probe types therefore carry `mintedAtIso`/`namespaceBootIso` — preformatted at
    the seam — so the reason string can name both instants without constructing a `Date`. The
    forbidden list in that guard passes unmodified.

    LOUD ON BOTH CHANNELS. The arm DELETES a lock a peer might believe it holds, so the reason
    names the ref, the anchor's pid@host, the minted-at, the namespace boot it lost to, and the
    pid-absence confirmation — and `run-task.ts` says it on stdout as well as ledgering it, because
    a ledger row alone is a record nobody is watching live.
