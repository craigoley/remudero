- id: W1-T2969
  title: "THE CENSUS MAP NAMES FOUR SUITES AND NO VERB READS IT — `censusSuiteMembership` was built so a diff can be told which population-walking suites it joins, but `KNOWN_CENSUS_SUITES` holds four entries and nothing on the command line reaches it, so four census failures in one session were each found by CI instead; widen the table to the registry-shaped censuses and put the derivation behind a verb"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 12.00
  files:
    - src/lib/ci-parity.ts
    - src/run-task.ts
    - test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts
  origin: "operator-request#daily-ci-failure-learning-loop-2026-09-06"
  plan_refs: ["W1-T2523", "W1-T2478", "W1-T2905", "W1-T374", "W1-T47"]
  status: queued
  attempts: 0
  rationale: |
    W1-T2523 ALREADY DIAGNOSED THIS AND BUILT HALF THE ANSWER. `censusSuiteMembership` and
    `censusSuiteMembershipFor` (src/lib/ci-parity.ts) answer "given these changed paths, which
    census suites do I enter", and that suite's own header states the gap: "`git grep -l <symbol>`
    — the caller sweep this repo mandates before a PR — cannot find a census suite."

    MEASURED 2026-09-06 ACROSS #4283 AND #4290. Four CI failures, every one a census baseline, and
    not one of them references a symbol either diff touched:
      - `census:bound-kind` (CI_LEARNING_MINT_CEILING undeclared)      — IN the table
      - `BASELINE_COMMAND_NAMES` 67 -> 68 (test/help-renders-…)        — NOT in the table
      - policy.test.ts `expectedTopLevelKeys` + `NET_NEW`              — NOT in the table
      - W1-T2905's source-text-read ratchet                            — NOT in the table
    So the derivation would have named ONE of four. `KNOWN_CENSUS_SUITES` covers the four
    `census:*` npm scripts and stops there, while the suites that actually bit are the
    REGISTRY-shaped ones: a fixed list of COMMANDS names, a fixed list of policy keys, a per-file
    count of source-text reads.

    AND NOTHING READS IT FROM A TERMINAL. `git grep -n censusSuiteMembership -- src/run-task.ts`
    returns nothing: the derivation is reachable only from ci-parity's own internals and its
    falsifier. A tool that answers the question but cannot be asked is, at the moment an author
    needs it, the same as no tool.
  design: |
    (i) WIDEN THE TABLE BY WHAT A SUITE WALKS, NOT BY WHAT IT IS NAMED. The four current entries
    are the `census:*` scripts; the misses are suites that pin a REGISTRY. Add entries keyed on the
    population each walks — the COMMANDS registry (src/run-task.ts), the policy key set
    (src/lib/policy.ts + plan/policy.yaml), and the source-text-read baseline (any added test/
    file). `unknownCoverage` already exists to name what the derivation cannot place; a widened
    table must not shrink it silently.

    (ii) A VERB, BECAUSE PROSE IS UNENFORCED. CLAUDE.md's own header: a rule stated only there
    "can be violated silently and repeatedly", and the fix is to make something refuse it. This
    session violated the caller-sweep rule four times with the rule in context the whole time.
    `rmd census-membership [--base <ref>]` printing the suites a diff joins is the smallest thing
    that turns the rule into an answer.

    (iii) REPORT-ONLY, AND SAY SO. The verb names suites; it does not run them and does not gate.
    A wrong answer must cost a reader nothing but a second, which is also why it belongs on the
    command line rather than inside a blocking step.

    (iv) THE ZERO IS THE DANGEROUS ANSWER. A diff that joins no census must be distinguishable from
    a derivation that could not read its corpus — P48's no-naked-zero clause, and the exact failure
    mode this repo's investigation-discipline section documents four separate instruments for.

    (v) NOT IN SCOPE: making the verb a gate, and auto-running the named suites. Both are follow-on
    decisions that need a measured cost first.
  acceptance:
    - claim: "a change to the command registry is told it joins the suite that pins the command name list"
      proof: "unit test: test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts"
    - claim: "a change to the policy surface is told it joins the suite that pins the policy key set"
      proof: "unit test: test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts"
    - claim: "a new test file is told it joins the suite that ratchets source text reads"
      proof: "unit test: test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts"
    - claim: "a diff joining no census is reported as a measured absence, distinguishable from a derivation that could not read its corpus"
      proof: "unit test: test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts"
    - claim: "the derivation is reachable from the command line and reports without running or gating anything"
      proof: "unit test: test/the-census-map-names-four-suites-and-no-verb-reads-it.test.ts"
  falsifier: |
    THE REGRESSION CASE IS THE EXISTING FOUR. Assert the four entries already in the table still
    resolve exactly as they do today — a widening that reshuffles them has broken the thing that
    already worked.

    THE REAL TEST IS THE FOUR MEASURED FAILURES. Feed the derivation the actual changed-path sets
    from #4283 and #4290 and require it to name the suite each one tripped. Anything less is a
    table that fits its own examples.

    AND PROVE IT LOAD-BEARING: delete a new entry and the corresponding test must redden. A suite
    asserting only that the verb prints something would pass over an empty table.
  note: |
    FILED 2026-09-06 from the operator's approval of recommendation 3, after four census failures
    in one session. MEASURED AT d4004806: KNOWN_CENSUS_SUITES holds four entries (bound-kind,
    catch-erasure, negative-reachability, no-shallowing); src/run-task.ts contains zero references
    to censusSuiteMembership.

    risk:high / band_meaning:span, RULE 19 SIZING: the linter refused risk:medium because the
    declared set spans two concerns (ci-parity and the command surface). Both edits are small and
    they are one concern in substance — a derivation and the verb that reads it — so the honest
    answer is the band that admits the span, not a decomposition that would ship a table nothing
    can be asked about.
