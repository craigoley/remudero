- id: W1-T8946
  title: "A CANCELLED LIGHT GATE IS POSTED AS CANCELLED, NOT FAILURE — ci.yml's commitlint-job reporter maps every step outcome other than success/skipped to a `failure` check run, so a cancelled rule-checks step reads as a red the fix lane spends a ci-log round on instead of a re-run"
  repo: remudero
  depends_on: [W1-T13186]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.50
  risk: high # .github/workflows/ci.yml's gate reporter posts the required check runs
  band_meaning: blast-radius
  origin: "operator session 2026-10-13: PR-flow re-measure (~/Remudero-notes/flow-remeasure-2026-10-13/rc-out.txt); operator: go with all of your recommendations"
  plan_refs: [W1-T4399, W1-T5858, W1-T5802, W1-T2283]
  files: [.github/workflows/ci.yml, test/infra/a-cancelled-light-gate-is-posted-as-cancelled-not-failure.test.ts]
  status: queued
  priority: 1.5
  attempts: 0
  rationale: |
    MEASURED 2026-10-08..12 (PR-flow re-measure): of 110 rule-checks check runs posted on failing build PRs, 11 rows
    on 9 PRs (#9948, #10221, #10344, #10350, #10482, #10628, #10948, #11049, #11176) carry the summary
    "W1-T4399: reported by this job's rule-checks step(s) (outcome(s): cancelled)" with conclusion failure
    (e.g. gh api commits/3153f3ebf/check-runs?check_name=rule-checks → "failure … (outcome(s): cancelled)").
    The cause is the reporter step of ci.yml's commitlint job (W1-T4399, `report()`): any constituent outcome other
    than success or skipped sets conclusion="failure". GitHub's own `cancelled` conclusion is lost, so the sweep's
    cancelledRequiredChecks (src/run-task.ts, which already reads a posted gate's run-scoped job id, W1-T5802) never
    sees a cancellation it would re-queue, and fetchCiFailures hands a ci-log fix round a "red" that has no failing
    test. Doctrine already treats CANCELLED as not-red (cancelled-is-not-red); the reporter erases it.
  design: |
    In ci.yml's commitlint-job reporter `report()`: a constituent outcome of `cancelled` (and no constituent `failure`)
    posts conclusion `cancelled`; any `failure` still posts `failure`; success/skipped unchanged; a failed setup still
    fails every gate (W1-T5858 unchanged). The output title names the cancelled step. ci-gate keeps treating a
    cancelled REQUIRED check as not-passing (no merge-gate change).
    INVARIANT a-failure-is-never-softened: a failed constituent still posts failure, beside a cancelled one too, and
    a failed setup still fails every gate.
    AMENDED 2026-11-16 (operator session): this task now depends on W1-T13186 and MUST NOT LAND BEFORE IT. The hand
    build stopped at its measure-first step because a reader in src/ depends on the mapping this task changes.
    READ at origin/main ef8b74910f:
    - the reporter is unchanged: .github/workflows/ci.yml:1465-1474, `report()` sets `conclusion="failure"` for any
      constituent outcome that is not `success` or `skipped`, and :1490 posts the summary
      `W1-T4399: reported by this job's ${check_name} step(s) (outcome(s): $*)`;
    - 88f649588f (#13538, 2026-10-22, nine days after this task was filed) made the sweep's reader link a posted gate to
      its cancelled producer job only when the gate reads `FAILURE` with that exact cancelled summary
      (src/lib/tick-read-worker.ts:1576-1578 in `cancelledRequiredChecks`; src/lib/sweep.ts:22773 re-confirms it before a
      re-queue). So the rationale's sentence that the sweep "never sees a cancellation it would re-queue" is no longer
      true on a plan-filing pull request.
    MEASURED by the builder with the real `cancelledRequiredChecks` and `runSweep` and a stub re-queue
    (~/Remudero-notes/handoff-1115/logs-8946/): with a gate posted as `CANCELLED`, one cancelled job with N posted
    gates becomes N+1 cancelled checks carrying one job id (2 for one gate, 4 for three), each re-queued under its own
    name, and none carries a run attempt, so a producer already on attempt 2 is re-queued again where today it is
    escalated. W1-T13186 teaches the reader both shapes; with it merged, this change is safe in either order of deploy.
    The merge gate is not at risk either way: ci-gate.yml:378 fails a required check that is `cancelled`.
    STILL TRUE AND STILL THIS TASK'S REASON: on a build pull request a cancelled light gate posted as failure earns a
    ci-log fix round today (#13538 covered only the plan-filing arm).
    The operator session holds this task's claim (refs/rmd-dispatch/W1-T8946, 2026-11-16T14:21:29Z) and builds it once
    W1-T13186 is merged. `.github/workflows/ci.yml` stays in `files:`: this is the operator-built half and is not cut.
    The suite moved to test/infra/, the folder `rmd test-place` computes for a suite shaped like the harness the
    falsifier names (same helpers, ci.yml read the way that suite reads it); the base name is unchanged. The INVARIANT
    line above and the `invariant:` prefix on the second criterion are new, for the lint rule design-invariant-proof;
    they restate this design's own second sentence and add no behaviour.
  acceptance:
    - claim: "a cancelled gate step is posted as a cancelled check run, not a failure"
      proof: 'grep: test("W1-T8946: a cancelled gate step posts a cancelled check run" in test/infra/a-cancelled-light-gate-is-posted-as-cancelled-not-failure.test.ts'
    - claim: "invariant:a-failure-is-never-softened — a failed constituent still posts failure even beside a cancelled one"
      proof: 'grep: test("W1-T8946: a failed constituent still posts failure beside a cancelled one" in test/infra/a-cancelled-light-gate-is-posted-as-cancelled-not-failure.test.ts'
  falsifier: |
    Run the reporter step's real bash body (the harness test/a-failed-gate-setup-fails-every-gate-it-reports.test.ts
    already uses: parse ci.yml, stub node, gh shim recording posts) with OUTCOME_RULE_CHECKS=cancelled and a
    successful setup. At origin/main the rule-checks post has conclusion failure; with the change, cancelled. With
    outcomes "a=cancelled" "b=failure" the post is failure at both.
