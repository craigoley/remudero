- id: W1-T3535
  title: "The shared run-unfiled sentinel is mistaken for task ownership, so one unrelated ad-hoc PR can falsely supersede and close another"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 25.00
  files: [src/run-task.ts, scripts/test-tier-manifest.json, test/unfiled-prs-do-not-supersede-each-other.test.ts]
  origin: "operator-session#pr-queue-2026-09-13"
  plan_refs: ["W1-T3388", "W1-T920", "W1-T2384", "W1-T2846"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED ON THE LIVE PR QUEUE ON 2026-09-13. PR #5411 and PR #5412 were independent
    repairs on conforming `run-unfiled-<epochMs>` branches. `resolveReviewTaskId` recovered the
    literal id `unfiled` from both branches. `buildOpenPrViews` then grouped every recovered id
    in `byTask`, so the higher-numbered #5412 marked #5411 `supersededBy: 5412`. The sweep closed
    #5411 despite distinct changed files and task intent. `unfiled` is a branch-shape sentinel,
    not an owned task, so it cannot establish duplicate-work ownership.
  design: |
    Keep `unfiled` available as the review and ledger attribution fallback: no review identity,
    history, or branch-contract behavior changes. Restrict only supersession grouping and lookup
    to attributable task ids. The literal `unfiled` must never enter `byTask`, produce a
    supersession evidence hydration, or populate `OpenPrView.supersededBy`. A real task id from a
    trailer or `run-<taskId>-<epochMs>` branch remains grouped and the older duplicate remains
    superseded by the highest-numbered peer. Do not add a second ownership parser or alter
    plan-only filing behavior.
  acceptance:
    - claim: "two open run-unfiled branches have no supersededBy relationship merely because they share the sentinel"
      proof: "unit test: W1-T3535 criterion 1"
    - claim: "only the literal unfiled sentinel is excluded from supersession ownership; review and ledger attribution remain unchanged"
      proof: "grep: taskId !== \"unfiled\" in src/run-task.ts"
    - claim: "two open PRs that claim the same real task still mark only the lower-numbered PR superseded"
      proof: "grep: const peers = isSupersessionOwnerTaskId in src/run-task.ts"
  falsifier: |
    Remove the sentinel exclusion and run the focused suite: the two-unfiled case must fail by
    reporting the newer unrelated PR as `supersededBy`. Conversely, making the exclusion reject
    all branch-derived ids must fail the real-task duplicate control. Reject this task if the
    live source already distinguishes the sentinel before constructing `byTask`; at filing,
    src/run-task.ts grouped every non-empty recovered id.
  note: |
    The live worker that owns #5412 remains single-writer. This change prevents the unrelated
    false closure class; it does not edit, reopen, or replace that active repair.
    reservation hand-off: main -> run-W1-T3535-1789316450411
