  design: |
    1. Re-census actual current-main callers, including served and cold routes,
       onboarding readiness/go-live composition, topology/liveness and independent
       repository/dashboard/benchmark/inbox discovery. Bind each observation to
       its actual operation and instance/repository, not only buildRegistryRoute
       or a fixture-only producer. Do not claim pure parser coverage is wiring.
    2. Reuse the existing bounded asynchronous selected reader and explicit
       selectedRegistryMode mode: shadow opt-in. Add one shared typed observation
       adapter observeSelectedRegistry only where these consumers need it; its
       real serve composition must invoke it, not merely import it. No dummy
       production call or text satisfies the behavioral obligation. No parallel registry parser,
       service, scanner, scheduler or implicit environment-only activation.
       Genuine absent configuration performs no selected read/receipt and keeps
       all legacy defaults, cached bodies and effects unchanged. An explicit
       selected failure cannot borrow healthy legacy/cache evidence for its
       observation. Distinguish unknown from known absence and retired identity.
    3. Capture input/ports/required capabilities before awaits. Preserve immutable
       original digest and real target identity, and recheck at actual request,
       cached-view adoption or liveness observation rather than trusting boot
       text. Changing a revision cannot silently retarget a pending observation.
       A synchronous-only seam reports unknown fresh authority; do not add a
       blocking adapter or critical-loop scan. Use existing asynchronous/off-loop
       composition and bounded receipt deduplication with shutdown ownership.
    4. Observe the independent ACTUAL legacy result/exception without replacing,
       blocking or rerouting it. A rejected receipt sink is unrecorded evidence,
       not success or permission. Never change a public response's data source,
       mount private data into untrusted readers, clear an owner hold or activate
       onboarding. Publication permission is always not-granted. Redact private
       paths, bytes, state roots and secrets from public bodies, receipts and
       worker/proof inputs. Preserve scoped services and trusted PR flow.
    5. Test actual composition and real asynchronous filesystem defaults with
       disposable selected and healthy-legacy traps; cover every new catch,
       explicit empty/unreadable/malformed/unsupported inputs, current revisions,
       mutation during awaits, stale served data, non-owner/public projection and
       owner/configured-human/service/no-config controls. Delete actual forwarding,
       recheck and snapshot fixes, observe failures, restore exact green. Commit
       before verified-path, tsx/tmp-preloaded shipped-host-slot tests; instrument
       every changed source SF in same-tree mapped diff coverage.
    6. Before build AND publication refresh exact anchored merged Task trailer OR
       run-branch credit, task claim/run refs, actual main and ALL OPEN-head subject
       blobs/real own diffs with positive/window controls, and package selector.
       Never reclaim a contested holder or compete with a normal fix round.
       Normally merge an evidenced files-only amendment BEFORE out-of-scope edits.
       No baseline/exemption/primitive rename, gate waiver, extra reviewer or
       unchanged-failure retry. Reproduce every native failed title on that run's
       actual unchanged pinned base with complete TAP before attribution/repair.
    7. This qualifies SHADOW evidence only. It does not certify lifecycle shells,
       detached child transport, private staging, deployment or live uptake.
       WORKERS CONTINUE for isolated source/tests; no schedule or live config
       write. Compatible live replacement needs separate human exact-instance
       drain; incompatible shared state/claims/credentials/config/access needs
       approved FULL AFFECTED WRITER STOP, ALL only if ALL are actually affected.
       Preserve complete public Apache core and independent owner/admin override.
