    - claim: A single declared minimum gh version, with the flag that needs it recorded beside it, is compared with the installed version before the first gh call of a runner, and an older gh fails the runner with both versions and the flag named
      proof: "unit test: test/a-runner-refuses-a-gh-older-than-the-code-needs-and-names-the-flag.test.ts"
    - claim: An installed version at or above the minimum, or an unreadable version string, never blocks a runner; the unreadable case is recorded as unknown, not as old
      proof: "grep: W1-T11927 criterion 2 in test/a-runner-refuses-a-gh-older-than-the-code-needs-and-names-the-flag.test.ts"
    - claim: The check runs once per process and adds no gh call beyond the version read
      proof: "grep: W1-T11927 criterion 3 in test/a-runner-refuses-a-gh-older-than-the-code-needs-and-names-the-flag.test.ts"
  rationale: |
    OBSERVED 2026-11-09: a review run on the Azure host died on "unknown flag: --slurp". The host has gh 2.45.0 and the daemon container 2.63.2; the code had begun using --slurp for the status history read. The code has since been fixed (c18574b948 reads page by page), but nothing stops the next flag from doing the same, and the failure surfaced as a stuck pending check on a PR, not as a version problem.
    - A declared minimum turns a drift between hosts into one named refusal at the start of a run.
  design: |
    - Declare the minimum beside the transport and name the flag that set it. Read `gh --version` once per process.
    - NOT IN SCOPE: upgrading gh anywhere, the credential resolver (its own task), and what any gh call does.
  falsifier: |
