      proof: "unit test: test/preflight-fast-mode.test.ts"
    - claim: "a report with a resulting file of at least 1,000 lines and either at least 250 added lines or at least 20 percent growth produces one feedback entry naming the exact measurements and requesting priority 1 decomposition work"
      proof: "unit test: test/source-size-followup.test.ts"
    - claim: "small deltas, small resulting files, malformed or oversized payloads, non-source paths, stale summary heads and unknown schema versions file nothing and return a named reason"
      proof: "unit test: test/source-size-followup.test.ts"
    - claim: "all material files in one report are grouped into one entry and an exact prior signature in the ledger union suppresses a duplicate while a changed signature files again"
      proof: "unit test: test/source-size-followup.test.ts"
    - claim: "the filed receipt is retained as decision-relevant telemetry and contains policy version, signature, source task, source PR or branch when known, and feedback id without prompt text or credentials"
      proof: "unit test: test/source-size-followup.test.ts"
    - claim: "the implementation worker path consumes a current successful preflight summary before worktree removal, and a filing failure is reported without changing the worker verdict"
      proof: "unit test: test/preflight-summary.test.ts"
    - claim: "the new source-size follow-up module has a production call site in the implementation worker path rather than being reachable only from its own tests"
      proof: "grep: consumeSourceSizeFollowup( in src/run-task.ts"
    - claim: "deleting the classifier threshold or the worker-path consumer makes the focused suite fail, while restoring each makes it pass"
      proof: "unit test: test/source-size-followup.test.ts"
  falsifier: |
    Close without implementation if current main already carries a production caller that parses
    successful `source-size-signal-json` evidence and creates a deduplicated high-priority
    feedback/task obligation. The repository-wide search at ab669883 found the marker only in the
    producer and its own tests; successful `shellOut` explicitly discards stdout, and the only
    preflight-summary consumer reports failures.
