  rationale: |
    OBSERVED ON MAIN AT ab669883. W1-T2734's `source-size-signal` prints a schema-versioned JSON
    report containing path, before lines, after lines, delta lines and delta percent. The fast
    preflight runner executes it, but `shellOut` deliberately reduces every successful command to
    `PASS — npm run --silent source-size-signal`; the JSON payload reaches neither
    `PreflightSummary` nor another caller. A repository-wide search finds no parser or consumer of
    `source-size-signal-json` outside the producer's own tests. The task's stated decomposition
    consumer therefore does not exist in material state.

    THE OPERATOR'S POLICY REQUIRES BOTH HALVES. Source growth alone must not block the feature PR,
    but a material maintainability hotspot must create separate, high-priority decomposition work.
    Removing the obsolete block without consuming the signal would improve throughput by silently
    accepting unbounded structural debt. Reinstating the baseline would preserve debt visibility by
    serializing unrelated delivery. The correct loop is measure, pass the current PR, enqueue one
    durable follow-up, deduplicate it, and let the normal auto-triage and plan-review pipeline judge
    the proposed refactor.

    DO NOT FILE ON EVERY POSITIVE DELTA. A one-line change in a large file is not evidence of a new
    decomposition need, and one proposal per file would flood the same queue the signal is meant to
    improve. Classify a material hotspot from the report's existing measurements: the resulting
    file must be at least 1,000 lines and the change must either add at least 250 lines or increase
    the file by at least 20 percent. Group all material files from one exact report into one feedback
    entry. These initial cuts are explicit, versioned policy inputs rather than hidden magic; actual
    outcome data can later tune them without changing the report schema.

    THE FOLLOW-UP MUST RIDE THE EXISTING PIPELINE. File one `plan/feedback/` entry through
    `captureFeedback`, marking the requested task as `priority: 1` and naming every triggering file
    plus its measurements. The existing feedback landing and auto-triage rungs turn that durable
    entry into a reviewed task shard. Do not write a task shard directly and do not auto-merge or
    auto-deploy anything from this consumer.
  design: |
    Extend the fast-step descriptor with an explicit retain-success-output flag used only by the
    source-size signal. Carry its bounded stdout in that step's durable summary rather than changing
    `shellOut` globally. Parse only the named `source-size-signal-json:` line and require the current
    schema version, finite non-negative counts, repo-relative `src/**/*.ts` paths and a summary head
    matching the worktree's current HEAD. Invalid, oversized or stale evidence files nothing and
    emits a named telemetry reason; it never guesses.

    Add a pure classifier and feedback renderer in `source-size-followup.ts`, plus one orchestration
    entry point that reads the ledger union, deduplicates by the sorted material-hotspot signature,
    files through `captureFeedback`, and appends a decision-relevant
    `source_size.followup.filed` receipt. Register that receipt for ledger retention. The exact same
    file set and threshold-policy version must not file twice; a changed set or materially changed
    measurement may file again.

    Invoke the consumer once after an implementation worker returns and before its worktree is
    removed, next to the existing preflight-summary read. The follow-up is best-effort with explicit
    telemetry: inability to file must not rewrite the implementation verdict or block its PR. The
    current PR remains governed only by correctness and integrity gates; the new feedback entry is
    the maintainability obligation.
  acceptance:
