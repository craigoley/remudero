  title: "THE STRIKE LADDER READS ITS OWN MERGE BASE AND CLIMBS PAST A CONFLICT — `decideStrikeLadderRung` holds 'merge base unreadable' because `currentMergeBaseSha` is hydrated only for review-orphaned PRs, and a refresh that conflicts holds forever instead of rebuilding: 140 holds and zero ladder actions since W1-T5536 shipped, while #9066/#8954 sat red for hours"
  repo: remudero
