  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/arm-failure-classification.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.
    `armFailureAction` is already a pure function over a string, so its falsifier needs no
    subprocess and no live PR.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. The change alters whether the sweep RE-ATTEMPTS a
    merge against a live repository, so a mistake spends real API calls on real PRs rather than
    failing an assertion. Claiming Rule 19 forced the band would be a false claim in the direction
    that flatters the filing.

    BOTH `src/` FILES MUST BE DECLARED BECAUSE THE TWO HALVES SIT APART: the classifier is
    `armFailureAction` in `src/run-task.ts`, and the `acted` disposition that decides whether the
    head stays gated is the `mergeable` arm in `src/lib/sweep.ts`. Design (ii) is explicit that
    changing only the classifier fixes nothing.

    A SEPARATE OBSERVATION, DELIBERATELY UNSCOPED AND FOR THE OPERATOR TO MINT: the daemon
    restarted 16 times on freshness in one night, every summary reading `attempted: (none)` and
    `idle ticks: 1`. A fast merge cadence means main advances before a tick completes, so the
    daemon spends its time re-booting rather than dispatching. That is a different concern with a
    different owner and is named here only so it is not lost.

    ID PROVENANCE. `refs/rmd-id/W1-T1117` resolves to 12d0b114fa732e0d90047806adc4e1d1270e475a,
    read back over git protocol; live control, `refs/rmd-id/W1-T999999` exits 2. THE ANCHOR MESSAGE
    WAS NOT JUDGED. Six id surfaces were swept plus a subject sweep, and the check covered the
    shard FILENAME and the declared `- id:` inside every shard on main, not the reservation ref
    alone — 443 declarations scanned, zero naming this id.
