    `risk: high` is the rule-19 span: one concern crosses HTTP auth, daemon lifecycle, policy data,
    deployment wiring and operator documentation. The file list names that span up front rather
    than discovering it during implementation. The new `github-event-wake.ts` module owns HMAC,
    event filtering, delivery dedup and marker format so neither `serve.ts` nor `daemon.ts`
    reimplements GitHub vocabulary.

    Deliberate non-overlap: `.github/workflows/ci.yml` is not declared. Repository webhooks are
    delivered by GitHub directly and, unlike an Actions `check_run` workflow, are not the
    self-triggering workflow pattern already rejected in `ci-gate.yml`. Branch protection,
    `commitlint`, CI sharding and provider selection are separate concerns.
