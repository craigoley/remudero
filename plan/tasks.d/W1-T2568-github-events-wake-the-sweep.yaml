  falsifier: |
    Close this task without implementation if a live trace at current main shows GitHub check/title/
    push events already causing `deps.sweep` before the next timer tick through a production-wired
    event source. A plan record, workflow event or console SSE update is not that evidence; the
    falsifier is an observed daemon sweep causally preceding its scheduled timer after an external
    GitHub event.

    Re-design rather than build if the production containers stop sharing a local filesystem, if
    the public endpoint cannot preserve the raw request bytes through Cloudflare, or if a
    path-specific Access application cannot be made more specific than the protected console root.
    Those invalidate the transport/auth premises. They do not justify a broad Access bypass, a
    shared console token, polling faster than the current bound, or a Docker-socket backdoor.

