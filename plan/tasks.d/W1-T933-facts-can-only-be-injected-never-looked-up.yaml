  note: "`risk: medium` IS SET UP FRONT. This adds a read-only primitive and refactors one existing
    caller onto it; it changes no gate, no disposition and no policy. The declared span is one module
    and its own suite, so Rule 19 sizing holds at this band. It is not `low` because
    `src/lib/skill.ts` is the registry contract every skill entry is read through.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT (`git grep -cw`) AT 2ff63cb. `grounding_sources`
    scores `src/lib/panel-skill-run.ts` 12, `test/panel-skill-run.test.ts` 7, `test/skill.test.ts` 5;
    `loadSkill` scores `test/skill.test.ts` 6, `src/lib/panel-skill-run.ts` 5, `src/lib/skill.ts` 2.
    The primitive belongs in `src/lib/skill.ts` because that is where the registry entry is loaded and
    where `grounding_sources` becomes a contract rather than a caller's private read.
    **`src/lib/panel-skill-run.ts` IS DELIBERATELY NOT DECLARED** even though it scores highest: this
    task's change there is the one-line substitution of the shared primitive for its inline copy, and
    declaring it would widen the span to two modules at a band Rule 19 sizes tightly. If the refactor
    turns out to need real edits there, that is a second shard, not a widened `files:`.
    **`src/run-task.ts` IS NOT DECLARED** — 103 of 277 shards declare it and it serialises every task
    naming it (W1-T471), and nothing about this primitive lives there.

    **ID PROVENANCE, AND THE RESERVATION DID NOT TAKE.** Four surfaces swept at 2ff63cb: `refs/rmd-id/*`
    max 929 over 40 refs; shard FILENAMES on origin/main max 932 over 313 files (control: W1-T932
    appears exactly once); every OPEN PR's TITLE (1 open PR, #2011, no id in its title); and every OPEN
    PR's FILE LIST (6 files, no shard paths; extractor control returns 932 on a synthetic shard path).
    Tree max across `plan/tasks.yaml` and every shard is 932, so 933. The `refs/rmd-id/W1-T933` push was
    attempted with a unique orphan commit over the EMPTY TREE carrying nonce
    `vm-12002-1786928418644223329`, the refspec variable braced, and the exit status captured into a
    variable rather than read through a pipe: it FAILED with exit 1, and the readback confirms the ref
    is ABSENT on origin while the positive control `refs/rmd-id/W1-T929` reads 1 line. This host cannot
    write non-branch refs. **SO THIS ID RESTS ON THE FOUR-SURFACE SWEEP ALONE AND COULD STILL COLLIDE
    WITH A CONCURRENT MINT.**

    PROOF NOTES: all four proofs are NAME-FILTERED titles, never pure paths. Each is under 100
    characters with no comma, so `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail it,
    and each matches ZERO files today against a control matching exactly one.

    **WHAT THIS SHARD DOES NOT CLAIM.** It does not claim workers cannot search — they hold `Grep` and
    `Glob` in every lane and can scan the tree today. It does not claim the byte ceiling is wrong; the
    ceiling is a reasonable response to injection-only delivery, and the honest reading is that it is a
    SYMPTOM of that constraint rather than a virtue in itself. And it does not claim a retrieval layer
    would let the cap rise — a lookup makes carrying OPTIONAL, which is a different and smaller claim.

    **AND ONE ADJACENT QUESTION IS RECORDED AS UNDETERMINED RATHER THAN ANSWERED.** Whether a spawned
    worker can invoke a SKILL is NOT settled by the tool arrays. `Skill` appears in none of them
    (positive control: the literal Read entry appears in 3 files), but the Agent SDK doc for its own
    `skills` option says that is the single place to turn skills on and that adding Skill to
    `allowedTools` is unnecessary — and that OMITTING the option means CLI defaults still apply and
    is explicitly NOT skills-off. Remudero never passes that option, while it does pass explicit
    tool arrays at spawn sites in `escalate.ts`, `feedback.ts`, `flight-judge.ts` and `isolation.ts`.
    So per-lane skill availability is UNRESOLVED FROM SOURCE and needs a spawn-time probe rather than
    another reading of the arrays. Anyone building on this must not inherit the stronger claim."
