    - claim: "the existing clarify grounding path uses the primitive rather than its own copy"
      proof: "unit test: W1-T933: the clarify path calls the shared lookup"
    - claim: "a source a skill does not declare is never searched"
      proof: "unit test: W1-T933: an undeclared source is never searched"
    - claim: "the lookup makes no model call and reads only declared paths"
      proof: "unit test: W1-T933: the lookup stays deterministic and offline"
