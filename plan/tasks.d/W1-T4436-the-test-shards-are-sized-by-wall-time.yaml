- id: W1-T4436
  title: "THE FINAL CI RUN'S LONG POLE IS FOUR ~20-MINUTE COVERAGE SHARDS WHILE RUNNERS SIT IDLE — runner queueing is negligible, so doubling the ci and coverage shards roughly halves the slowest stage; make the shard count one value every consumer derives, and set it to 8"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1
  budget_usd: 25.00
