  rationale: |
    THE OPERATOR HAS NOW RAISED THIS TWICE, AND THE FIX FOR IT IS ALREADY ON MAIN.

    2026-09-09, verbatim on W1-T3306: "why would it review something and fail to act?! ... rmd
    should not be able to refuse to act! The whole point is for it to act!"
    2026-09-16: "#5683 looks ready to merge. Why hasn't it auto-merged?" — and then, minutes later,
    "Another lane just merged it because rmd wasn't doing it."

    W1-T3306 IS IMPLEMENTED. `sweep.ts` cites it by name at the capped-routing block, carries 33
    `capped` references, and `test/a-capped-verdict-stalls-a-pr-with-no-actor.test.ts` passes 8/8
    on main. The route from a capped-green arm refusal into the existing bounded fix rung exists.

    IT HAS NEVER EXECUTED. MEASURED over the deduped ledger union (three-pattern glob: live, plain
    rotations, gzipped rotations):

        capped arm refusals ....... 98
        capped dispatches ......... 0

    Ninety-eight times the fleet has correctly refused to arm a capped verdict, and zero times has
    anything acted on the refusal. That is W1-T1019's shape exactly -- "shipped unwired and has
    never once executed" -- in the path that decides whether a green PR ever merges.

    THE LIVE INSTANCE, #5683 (W1-T3610). Its ledger trail is
      automerge.arm_skipped — CAPPED verdict (zero proofs executed) — refuses to arm auto-merge
    on a PR whose checks were green and whose branch was clean. No rung followed. It sat until a
    human merged it.

    WHAT THIS TASK MUST NOT ASSUME. The routing block has FOUR preconditions and this task exists
    because which one blocks is not yet known:

      1. `disposition === "mergeable"` -- and `postReviewFailureHistoryDisposition` runs FIRST and
         can override the disposition before the capped block is ever reached.
      2. no `automergeHoldFromLedger` hold.
      3. `cappedProofDiscriminationFromLedger(pr, ledgerLines)` returns a grade.
      4. `!decideSweepArm(pr, ledgerLines).arm`.

    ROTATION IS A CANDIDATE, NOT A CONCLUSION. Both (3) and (4) read `ledgerLines`, and W1-T3471
    records that `decideSweepArm` "reads the live file alone". MEASURED: the live ledger holds 211
    `review.posted` rows against 82,574 in the union across 361 rotated archives -- 0.26%. BUT the
    live file spans 2026-09-08 to now, and #5683's verdict was posted hours before its refusal, so
    it SHOULD have been in the window. Rotation does not explain this instance on its own and must
    not be written up as the cause until a probe shows which precondition is false.

    THE DIAGNOSIS IS THE DELIVERABLE. Drive the real `deriveDisposition` + capped block against a
    captured #5683-shaped input and report WHICH of the four is false, with the reading that proves
    it. A fix that moves a precondition without knowing which one was blocking is how a second
    shipped-but-unwired route gets added beside the first.

    THE ARM REFUSAL REMAINS THE CONTROL. W1-T3306's own falsifier says it and it still binds: a
    capped verdict must STILL refuse to arm after any change here. Relaxing that gate would
    auto-merge uncertified work, which is far worse than a PR that waits for a human.

