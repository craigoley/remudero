  acceptance:
    - claim: "classifyGardenerStep classifies flow.filing_failed, flake_incident.filing_failed, evidence_coverage.filing_failed, host_resource.file_failed, issue_revalidation.failed, issue_revalidation.action_failed, <name>.landing_refused and <name>.garden_dispose_failed as failure kinds for their garden, so the pass exits non-zero and the overseer's ladder sees them"
      proof: "grep: W1-T12843 criterion 1 in test/gardeners/the-overseer-notices-every-garden-failure-step.test.ts"
    - claim: "invariant:a-clean-pass-stays-clean — every step origin/main classifies keeps its kind, a step that is not failure-shaped is not classified as one, and a pass that logs no failure row exits 0"
      proof: "grep: W1-T12843 criterion 2 in test/gardeners/the-overseer-notices-every-garden-failure-step.test.ts"
    - claim: "A census over the ledger step literals written by garden modules fails when a step ending in _failed or _refused is neither classified nor on a named list with a reason"
      proof: "grep: W1-T12843 criterion 3 in test/gardeners/the-overseer-notices-every-garden-failure-step.test.ts"
  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - garden.pass rows for 7 days: 4,033 passes. 1,352 were deferred (admission-rank 999, memory-budget-shortfall 353).
    - Exit 1 by garden: review-replay 160 of 420, queue-judge 74 of 210, selector-shadow 55 of 347, gate 46 of 194, redesign 22 of 229, flow-remedy 22 of 103, fix-lane 16 of 87, scout 14 of 83.
    - READ gardener-overseer.ts classifyGardenerStep: failure kinds are matched by a suffix list. flow.filing_failed, flake_incident.filing_failed, evidence_coverage.filing_failed, host_resource.file_failed, issue_revalidation.failed and action_failed, <name>.landing_refused and garden_dispose_failed do not match it. A pass that wrote one exits 0, garden.pass counts it as a pass, and the overseer never notices.
  design: |
    1. gardener-overseer.ts: extend the classification to the listed steps, and add the named allow list for failure-shaped literals that are deliberately unclassified.
    2. The census reads the garden modules' step literals the way the existing ledger-literal census does and compares them with the classifier.
    INVARIANT a-clean-pass-stays-clean: no currently classified step changes kind and no non-failure step becomes a failure.
    NOT IN SCOPE: the cross-garden class for a shared refused check (W1-T12834), admission deferrals, and each garden's own failure causes.
  falsifier: |
    Remove one listed step from the classifier and criterion 1 must fail. Classify a scorecard row as a failure and criterion 2 must fail. Add an unclassified _failed literal and criterion 3 must fail. Restore and all pass.
