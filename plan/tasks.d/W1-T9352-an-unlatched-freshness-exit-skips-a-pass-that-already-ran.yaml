  design: |
    Operator rulings: no hard thresholds (no fixed wait, age or count below), lean into automation.
    1. ANCHOR THE TICK-TOP EXIT ON THE ADVANCE. The tick-top exit passes the daemon's `staleSinceMs` (the first
       observation of the advance this restart is for) to `stopForFreshness`. The exit then skips the fresh
       `runGatedSweep` when a full pass completed after that moment. `pre_exit_pass` gains a fourth value,
       `"skipped_ran_since_stale"`, so a latch skip and an advance skip can be told apart.
       AMENDED 2026-11-10 (hand build, origin/main aa0902d33): the pre-admission exit with an empty dispatch set
       is not anchored, because the code cannot reach it. Its condition in src/lib/daemon.ts is
       `refetchedFreshness?.stale && dispatchSet.length === 0`. `dispatchSet` is assigned only before the idle
       branch `if (dispatchSet.length === 0)`, and every path of that branch continues or returns. The comment
       above the condition has said "always false" since 2026-09-16. An idle daemon (no task to dispatch) that
       reads its own tree stale exits at the top of its next tick, so the tick-top exit is the exit it takes.
    2. W1-T1272'S GUARANTEE HOLDS. A background pass still running at exit is awaited, as today. With no full pass
       completed since the advance, or with `staleSinceMs` unset, the bounded pass runs, as today.
    3. The stale-reviewer idle exit keeps today's pass. Its staleness is the reviewer's code, not an observed advance
       of main, so it has no anchor here. The exit for a requested restart keeps its pass too. The latched exit is
       unchanged.
    4. On an exit that passes the advance, `daemon_selfrestart_for_freshness` also carries `stale_since_ms` and
       `last_pass_completed_ms` (the last full pass that completed before the exit began; null when none), so the
       arm that ran can be checked against its evidence. The row of every other exit keeps its three fields:
       test/a-latched-restart-exits-when-its-last-lane-settles.test.ts compares the whole row of a latched exit.
    5. TWO EXISTING TESTS CHANGE, and both files are in `files`.
       - test/a-latched-restart-exits-when-its-last-lane-settles.test.ts, "an idle freshness exit keeps its full
         pass without a dispatch latch", says "the boot pass cannot replace an idle exit's pass". Design 1 makes
         that false: a boot pass that completes after the advance replaces it. The fixture still runs 2 passes
         only because its fake clock does not move, so the boot pass completes at the instant of the advance and
         not after it. The test keeps its fixture and its count. Its title and message change to say that an idle
         exit keeps its full pass when no pass completed after the advance.
       - test/the-pre-exit-pass-runs-beside-the-restart-drain.test.ts (W1-T9812), "an exit with no dispatch latch
         keeps the pass before the drain", uses a tick-top exit after a boot pass. With design 1 that exit starts
         no pass. The fixture's boot pass now fails, so the exit still runs its own pass and the test still shows
         the order of pass and drain. Build this task after W1-T9812 has merged.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive runDaemon with an injected sweep,
    checkFreshness and a fake clock, as test/a-latched-restart-exits-when-its-last-lane-settles.test.ts does.
