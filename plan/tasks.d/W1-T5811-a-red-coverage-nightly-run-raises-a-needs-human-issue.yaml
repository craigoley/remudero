  rationale: |
    READ 2026-10-05 on #9246's head 1a17b439 (W1-T5704, open) and origin/main b790deee. The new
    workflow declares `permissions: contents: read`, runs eight shards, the merge and the
    absolute-floor ratchet, and uploads an artifact; a failure ends as a red run on a schedule
    nobody watches. The four scheduled jobs that alarm do it through scripts/needs-human-issue.mjs
    (raise on failure, `--resolved --source` on success), and
    test/a-recovered-scheduled-job-leaves-its-escalation-open-forever.test.ts's "every workflow that
    RAISES also RESOLVES" case lists exactly those four and asserts the count. Workflow files are an
    operator build (W1-T5351).
  design: |
    coverage-nightly.yml gains `issues: write` and, after the merge job, a step that raises a
    needs-human issue through scripts/needs-human-issue.mjs when the run failed (naming the failing
    shard or the floor) and resolves it with `--resolved --source coverage-nightly` on success,
    never on a pull_request event. The raiser census adds coverage-nightly and its count becomes five.
  acceptance:
    - claim: "parsing coverage-nightly.yml, it grants issues write, raises through needs-human-issue.mjs on failure and resolves on success, and the raiser census lists five raisers including coverage-nightly"
      proof: "unit test: test/a-red-coverage-nightly-run-raises-a-needs-human-issue.test.ts"
  falsifier: |
