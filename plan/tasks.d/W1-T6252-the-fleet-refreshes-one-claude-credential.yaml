- id: W1-T6252
  title: "THE FLEET REFRESHES ONE CLAUDE CREDENTIAL, NOT DIVERGING COPIES OF ONE OAUTH LINEAGE — each container forks the owner credential into a container-local ~/.claude-fleet once while site uses the owner's ~/.claude directly, so any holder's refresh rotates the refresh token out from under the others; core's fork was emptied 10:27Z-15:38Z on 2026-10-07 and every Claude spawn and the usage probe refused"
  repo: remudero
  depends_on: []
  dispatch_hold: true
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 14.00
  risk: high
  band_meaning: blast-radius
  origin: "operator session 2026-10-07: core's credential fork emptied during the Node 24 rollout"
  plan_refs: [W1-T505, W1-T4348, W1-T4863, W1-T6095, "PR #8940 (shared fleet-auth/claude store)", "PR #9902 (run-unfiled: an emptied .claude-fleet fork heals from a usable owner credential; no task id)"]
  files: [src/lib/worker-home.ts, src/lib/worker.ts, src/run-task.ts, test/the-fleet-refreshes-one-claude-credential.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-07 on origin/main d7f1f6d5 and on the host (read-only):
    - src/lib/worker-home.ts:90-132 seedClaudeFleetCredentials copies <realHome>/.claude/.credentials.json into
      <realHome>/.claude-fleet once, unless the shared child exists (:98). workerClaudeCredentialDir (:1119-1130)
      prefers sharedClaudeCredentialDir = <realHome>/.claude/fleet-auth/claude (:1115-1117, added by #8940), then
      .claude-fleet, then .claude. Its own comment says the shared child "shares both the credential and native
      primary/legacy refresh locks".
    - Host: core, site and console all bind host ~/.claude at /home/node/.claude; ~/.claude/fleet-auth does not
      exist. Core and console each hold a container-local /home/node/.claude-fleet/.credentials.json (not a bind
      mount, so it dies with the container); site has none and uses the owner's mounted ~/.claude. That is three
      refreshing copies of one OAuth lineage: a refresh by any holder rotates the refresh token and the other
      copies stop renewing.
    - PR #9902 (open, run-unfiled branch) makes an emptied fork heal from a usable owner credential at spawn and
      at the usage probe (seedClaudeFleetCredentials returns "healed"). That is the symptom fix; the copies still
      diverge. It is also unledgered: worker.ts writes no ledger rows ("this module writes none", :706), so a heal
      leaves no record of how often the lineage split.
  design: |
    OPERATOR RULING NEEDED on the mechanism, then build:
      (a) provision the shared store #8940 already reads: <host>/.claude/fleet-auth/claude/.credentials.json, one
          file under the existing ~/.claude bind mount, so every container's workers and the usage probe resolve
          the same file and the Claude CLI's own refresh lock serialises renewals. Seeding creates it once from
          the owner credential (exclusive create, as seedClaudeFleetCredentials does today) and never forks again;
          an existing .claude-fleet is left for recovery, as today. Site moves onto it with the others.
      (b) a dedicated long-lived fleet token (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`) held in the
          cash-secret directory and exported to workers, so the fleet never refreshes the owner's lineage at all.
    Either way, record the observation: the usage-probe sink (ledgerUsageProbeFailure's neighbour in
    run-task.ts) writes one `usage.credential_healed` row when a heal ran, naming the store and the prior verdict,
    so the split's frequency is measurable before and after the root fix.
  acceptance:
    - claim: "with the shared store provisioned, every worker and the usage probe resolve the same credential file and no fork is created"
      proof: 'grep: test("W1-T6252: every fleet Claude process resolves the one shared credential" in test/the-fleet-refreshes-one-claude-credential.test.ts'
    - claim: "a heal is recorded as a usage.credential_healed ledger row"
      proof: 'grep: test("W1-T6252: a credential heal writes one ledger row" in test/the-fleet-refreshes-one-claude-credential.test.ts'
  falsifier: |
    Keep seeding a private fork per container: the fixture's two simulated containers resolve different
    credential files and the first test fails.
  note: |
    DISPATCH HOLD: changes production credentials for core, site and console. Operator build, after an operator
    ruling between (a) the shared fleet-auth/claude store and (b) a dedicated fleet token. Depends on #9902's
    heal by reference only (it carries no task id). Host half for (a): create ~/.claude/fleet-auth/claude
    (mode 700, service user) from a fresh owner credential, recycle each instance, verify a worker and the usage
    probe reach Claude on each.
