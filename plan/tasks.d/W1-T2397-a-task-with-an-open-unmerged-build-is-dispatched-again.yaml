  falsifier: |
    Re-run the 72-hour population measurement. If the STRICT predicate — a dispatch opened while
    another PR was open and touching a path in the dispatched task's own declared `files:` — finds
    NO instance, the loop this task observes is not occurring and the task must be closed rather
    than implemented. The measurement is the same one: enumerate every PR over REST with an
    enumeration control, take every `run-<taskId>-<digits>` head opened in the window, and for each
    ask which PRs were open at its creation timestamp, intersecting their changed files with the
    task's declared list. Control both directions: the query must still find W1-T2387/#3102 ->
    #3109, and must still return the 101 dispatches that have no open sibling at all.

    SEPARATELY DECISIVE: if `ownsBranch` (`src/lib/status.ts`) is no longer the sole attribution
    used by `corroborateOpenByBranch`, the asymmetry described here has already been closed by
    something else and this shard must be re-derived rather than trusted.
