- id: W1-T3733
  title: "EVERY SUPERVISOR READS CORE'S IMAGE — `IMAGE_SHA_CONTAINER` is the hardcoded literal `remudero-daemon`, so the site and console recycle ticks measure a container that is not theirs, read no drift, and have left both daemons on a 24-hour-old image"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED ON THE LIVE HOST 2026-09-17T13:45Z, via `docker inspect` and `docker exec cat
    /etc/rmd-build-sha` on each running container:

      remudero-daemon          up 13:16 TODAY      build-sha d83d60cbb
      remudero-site-daemon     up 13:15 YESTERDAY  build-sha 6549523aa
      remudero-console-daemon  up 13:15 YESTERDAY  build-sha 6549523aa

    And the drift each of those images actually carries, against origin/main:

      d83d60cbb: baked-path commits behind = 0    (total behind 33)
      6549523aa: baked-path commits behind = 1    (total behind 230)

    So site and console ARE image-stale by the supervisor's own measure — one baked-path commit,
    230 commits of tree — and have been for a day. Their recycle tick has asked every 5 minutes
    and concluded there is nothing to do, every time.

    (1) IT IS ASKING ABOUT THE WRONG CONTAINER, AND THE CONSTANT SAYS SO OUTRIGHT:

          src/lib/deployer.ts:150   export const IMAGE_SHA_CONTAINER = "remudero-daemon";
          src/lib/deployer.ts:1304  sha = exec("docker", ["exec", IMAGE_SHA_CONTAINER, "cat", IMAGE_BUILD_SHA_PATH]).trim();

        One literal, no parameter, one call site. `realDeployDeps` already knows which deployment
        it is (`stateRoot`), and `imageBakedCommitsBehind` ignores that and reads core's.

    (2) SO THE READING IS CORE'S DRIFT, REPORTED AS THEIRS. Core is currently 0 baked-path commits
        behind, so all three ticks read 0 and all three decline. When core IS stale all three would
        read stale and all three would try to recycle — the same wrong answer in the other
        direction. The number is never about the daemon being asked.

    (3) THE RECYCLE TICK IS THE ONLY ACTOR FOR THIS, by the fleet's own design. `rmd-site-relaunch.sh`
        states it: "RECYCLE (image-side) has no other actor: nothing INSIDE a container can replace
        the image it is running on, and this script is the only thing outside it that runs on a
        cadence." The daemon's own freshness exit (W1-T3245) handles MOUNT staleness and cannot see
        an image at all — W1-T3240 records exactly that: all three shas can agree while the image
        is months old.

    (4) THIS IS THE SAME SINGLE-DAEMON ASSUMPTION AS W1-T3732, ONE LAYER UP. That task fixes the
        RESTART (the supervisor named no `--instance`, so `recycle-container.sh` refused). This one
        is the DECISION that precedes it: on site and console the restart is never even attempted,
        because the drift read says there is nothing to restart for. Both locks are on the same
        door and the door is the two non-core daemons.

    (5) WHAT IT COSTS. A merged change to `deploy/Dockerfile` or `deploy/entrypoint.sh` — the two
        paths the image bakes — reaches core and never reaches site or console. Their entrypoints,
        their freshness loop, their credential handling all stay on whatever shipped a day, a week
        or a month ago, and no signal anywhere says so.
  design: |
    (i) READ THE CONTAINER THE REGISTRY NAMES FOR THIS DEPLOYMENT. `.remudero/daemon-instances.yaml`
        already records `container_name` beside the `state_dir` W1-T3732 matches on, so the SAME
        resolution that yields the `--instance` flag yields the container to read. One lookup, one
        source of truth, and a fourth daemon is answered without touching this code.

    (ii) UNRESOLVED IS THE EXISTING LITERAL, NOT A GUESS. An absent, unreadable or unmatched
         registry leaves the read exactly where it is today (`remudero-daemon`), so nothing about
         the core deployment changes and no fault can silently point the read at nothing. That is
         the same fail-closed direction W1-T3732 takes for the restart, deliberately matched.

    (iii) AN UNREADABLE SHA STAYS UNKNOWN, NEVER ZERO. `imageBakedCommitsBehind` already returns
          `undefined` when the `docker exec` fails, and `decideDeployTrigger` already treats
          `undefined` as NOT stale (the crash-loop case W1-T3240 named). Untouched: pointing the
          read at the right container must not convert a down container into a restart storm.

    NOT IN SCOPE: the `--instance` restart refusal (W1-T3732, already in flight), and whether the
    site and console supervisors should write to their own ledgers rather than core's — a real
    observation from the same measurement, filed separately.
  acceptance:
    - claim: "the image build sha is read from the container the registry names for this deployment's state root, not from a fixed one"
      proof: "unit test: the image sha is read from this deployment's own container"
    - claim: "a state root the registry does not name reads the same container as before, so the core deployment is unchanged"
      proof: "unit test: an unresolved deployment keeps reading the default container"
    - claim: "a container whose sha cannot be read is unknown rather than current, so a container that is down is never restarted into a storm"
      proof: "unit test: an unreadable image sha reports unknown drift"
  falsifier: |
    Derive the container by string-building it from the instance name (`remudero-<name>-daemon`) and
    the first assertion still passes for site and console while `core` — whose container is
    `remudero-daemon`, not `remudero-core-daemon` — silently reads a container that does not exist;
    the registry's recorded `container_name` is the only spelling that is true for all three. Fall
    back to the first declared instance instead of the literal default and the second goes red. Make
    an unreadable sha read as 0 and the third goes red, which is the direction that restarts a
    container that is down.
