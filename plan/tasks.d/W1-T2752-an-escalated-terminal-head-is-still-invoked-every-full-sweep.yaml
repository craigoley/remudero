- id: W1-T2752
  title: "AN ESCALATED TERMINAL FIX HEAD IS STILL INVOKED ON EVERY FULL SWEEP — W1-T2723 stops the repeated GitHub head lookup and duplicate issue, but its delivered terminal cache is private to buildSweepEffects, so runSweep records acted:true eleven more times for the unchanged PR head and reports work the lane immediately declined"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 16.00
  files:
