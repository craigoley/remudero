      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "FORCE_COLOR enables colour even when the stream is not a terminal"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "every escape sequence in the coloured output comes from a semantic wrapper"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "the ten section rules derive from one helper rather than ten literals"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "a narrow declared width never yields a rendered line wider than that width"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "an unreadable terminal width falls back to a stated default and never throws"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "the json projection of the same model is unchanged by any rendering change"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "no state word the board prints today is replaced by colour alone"
      proof: "unit test: test/tty-layer-and-status-board-rendering.test.ts"
    - claim: "the status board actually calls the new layer rather than shipping it unreached"
      proof: "grep: sectionRule( in src/lib/status-board.ts"
