  rationale: |
    OBSERVED 2026-11-02 (coordinator brief) on #15532 (W1-T10573), head dd024de:
    - remudero-review FAILED at 2026-11-02T20:22Z with two unmet criteria.
    - Criterion 2's proof test/shadow-instance-safety.test.ts, subtest "…: real owner CLI", failed at :1658 `assert.equal(paused.status, 2)` with `null !== 2`. spawnSync hit its `timeout: 30000` (:1648): each cold `node --import tsx` start of run-task.ts takes 20–30 s on the CPU-saturated host, and the test spawns about 8 in series.
    - Criterion 1's proof hit an exec_error at the bwrap invocation, and the verdict fell back to keyword matching.
    - On the Mac all 10 proof subtests pass in 15.5 s ("real owner CLI" 7 s, against 92 s on the host). Hosted CI is green.
    - The fix lane has run 12 rounds (fix.progress_judged 20:50:03Z: change-approach, round_count 12), repeatedly marking FIXED, because no round can reproduce the failure off-host.
    - Host load (efficiency findings, 2026-10-27 and the 11-02 handoff): load 24–30, then 34–47, CPU PSI 50–79%.
    READ at origin/main 12783785a: review.ts's ProofExecOutcome (:341-360) has `exec_error` (threw or timed out), which leaves the keyword floor, and `executed_fail`, which overrides it. A unit-test proof whose test file runs and fails on an internal spawn timeout is executed_fail, a conclusive red, whatever load it ran under. No load is recorded beside a proof result.
    AMENDED 2026-11-03 (operator session, the hand build stopped before any code):
    - Arm (b), "hosted CI passed the same file", has no data source in src/lib/review.ts. GitHub-side inputs reach the review only through ReviewEvidence, which src/cli/commands/review.ts fills. So this task adds the optional ReviewEvidence.hostedCiFilePassed seam (absent = arm (b) off) and W1-T11200 fills it.
    - Criterion 2's re-run needs the sweep. A pending review.posted is retried only for named causes (incompletePromiseHarvestFromLedger / promiseHarvestRetryView, src/lib/sweep.ts:14699-14720; host-gap re-reviews, isHostGapCriterion at :439), and otherwise "one exact-input post refusal stops retries" (:11568). So src/lib/sweep.ts joins files for a load-gated retry route modelled on promiseHarvestRetryView. Risk is raised to high (Rule 19 sizing, two subsystems).
    - The pending state follows the existing cannot_evaluate precedent (src/lib/review.ts:5815).
    - Arm (a) alone does not catch #15532: its test runner completed and only a child it spawned timed out. W1-T11200 is what closes that case.
    NOT COVERED: W1-T10742 (queued) makes an inconclusive proof at PR OPEN a harness outcome, in the pre-open gate rather than the review. W1-T227 (merged) narrowed the glob for the same idle-vs-loaded split. W1-T10252 (queued) names host load on a runaway refusal.
  design: |
    Record /proc/loadavg (1-min) and the cgroup's cpu.pressure some avg10 at each proof's start and end, on the proof's CriterionVerdict, so they reach review.posted's decision_verdict without a CLI change. Add a ProofExecOutcome `inconclusive_load` for a unit-test proof whose run (a) ended by timeout, signal or exec_error, or (b) failed while ReviewEvidence.hostedCiFilePassed (an optional seam, filled by W1-T11200) says the same file passed at that head. It leaves the keyword floor like exec_error and is excluded from unmet criteria, so it triggers no fix round. An inconclusive proof makes the verdict pending. The sweep re-reviews a head whose only pending cause is inconclusive_load in the first pass whose own host load sample is below the recorded one, and the re-run's conclusive outcome replaces it. Coordinate with W1-T10742 so both name the same outcome.
  note: |
    Filed 2026-11-02 on the coordinator's request (item 17, p1, filed after the two CPU tasks). Its part (b), the progress judge's harness signal, is a separate module and filed as its own shard. Part (c), host load beside each proof result, is folded into this design because the re-run needs it.
