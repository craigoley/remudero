  note: |
    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (src/lib/task-linter.ts) exempts only `risk === "high"` and fires at two or more concerns; this
    record names four (the reviewer, the autonomy report, and their two dedicated suites), so no
    smaller band can pass while `files:` still covers both readers. The blast radius is genuinely
    narrower: two reason strings and one classifier branch, with the ordinary path pinned unchanged
    by criterion 3.

    verify: auto IS DELIBERATE AND IS NOT AN ARMING-POLICY CHANGE. Nothing here alters WHETHER a PR
    arms — design (i) fixes the `arm` value of that branch at true and design (ii) forbids any new
    refusal. What changes is what the decision reads and what it records, which is mechanical and
    machine-checkable end to end.

    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT AT 0b33362, NOT GUESSED.
    `decideAutoMergeArm`: src/lib/review.ts=18, src/lib/autonomy.ts=6, src/run-task.ts=11,
    src/lib/sweep.ts=4. `resolveAutoMergeArm`: src/lib/review.ts=4, src/run-task.ts=2,
    src/lib/sweep.ts=1. `verdictClassOf`: src/lib/autonomy.ts=2 and nowhere else.
    `CURRENT_ARMING_POSTURE`: src/lib/autonomy.ts=4, test/autonomy-ratchet.test.ts=3.
    `partiallyExecuted`: src/lib/review.ts=9, test/unexecutable-proof-visibility.test.ts=6, 0 in
    every other file under src/ and test/. Control: `routeSpecialists` reads 0 in both source
    modules and both test suites, so the counts discriminate.

    src/run-task.ts AND src/lib/sweep.ts ARE DELIBERATELY NOT DECLARED. Both call the arm decision
    and neither needs editing: widening a `Pick` with OPTIONAL fields leaves every existing call
    site compiling byte-for-byte, and the reason those modules ledger is the RETURN VALUE of the
    function this record changes. Declaring src/run-task.ts would also serialise this task against
    the 221-of-361 shards that already name the monolith (W1-T471) for no diff.

    THE TEST HOMES ARE THE TWO DEDICATED SUITES, NOT test/review.test.ts. `decideAutoMergeArm`'s
    general fixtures live there (21 mentions) but the partial-execution suite is
    test/unexecutable-proof-visibility.test.ts, which is where W1-T305 put every assertion about
    these three fields. Keeping the new assertions there also honours the standing rule against
    appending coverage-load-bearing tests to a large shared file.

    WHAT THIS DOES NOT FIX, STATED SO IT IS NOT MISTAKEN FOR THE WHOLE ANSWER. It does not make a
    mismatched proof title resolve, and it does not stop a partial PR merging. A partially certified
    merge stays a legitimate outcome; what stops is the fleet recording it as a full one. The 184
    merges carrying no review status at all are a separate defect this record deliberately leaves
    alone.

    THE ID IS PRE-MINTED AND WAS READ BACK BEFORE ANYTHING WAS WRITTEN.
    refs/rmd-id/W1-T1020 resolves to 9f8145bbfe3c38b3960fd304e4f4f19ce640abb6. Controls on the same
    query: refs/rmd-id/W1-T1016 reads 1 and refs/rmd-id/W1-T999999 reads 0. The four-surface sweep
    then confirmed nobody took the id since: shard FILENAMES 0 (the existence test, not a content
    grep), id lines in the plan tree 0, refs/rmd-id/* 1 and that one is the pre-mint itself, and 0
    across every open PR's file list with coverage asserted at two captured of two enumerated.
    Controls read 1 in every case and the id-line scan saw a true maximum of 1019. The shard `- id:`
