    - claim: "a fully executed PASS keeps its existing reason unchanged in the same run"
      proof: "unit test: W1-T1020: a fully executed pass keeps its reason unchanged"
    - claim: "the ledger reconstruction carries the recorded partial flag back to the decision"
      proof: "unit test: W1-T1020: the ledger reconstruction carries the partial flag"
    - claim: "an autonomy row recorded as partially executed no longer classifies as a full pass"
      proof: "unit test: W1-T1020: a partially executed row does not classify as a full pass"
    - claim: "reverting the reason change fails the partial-reason test with the file sha read either side"
      proof: "unit test: W1-T1020: reverting the reason change fails the partial reason test"
