    - claim: "a fragment whose only ids are NEW-1a and NEW-1b is minted, not passed through unchanged"
      proof: 'grep: test("W1-T9292: a fragment declaring only suffixed placeholders is still minted" in test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts'
    - claim: "materialization refuses when an unminted id or a NEW- token survives substitution"
      proof: 'grep: test("W1-T9292: materialization refuses a fragment that still holds an unminted id" in test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts'
    - claim: "lint-plan fails an added shard whose id is not a minted task id, and only warns for one already on the base"
      proof: 'grep: test("W1-T9292: lint-plan fails an added unminted id and warns for one already on the base" in test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts'
    - claim: "the new test file passes"
      proof: "unit test: test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts"
  falsifier: |
