  design: |
    1. EVERY DECLARED PLACEHOLDER IS MINTED. In src/lib/inbox.ts the declaration pattern captures the whole
       placeholder token, `NEW-` followed by letters and digits (NEW-1, NEW-1A, NEW-1a, NEW-12b), so each
       distinct declared token gets its own reserved id in declaration order. Substitution replaces whole
       tokens only, so NEW-1 never rewrites part of NEW-1A or NEW-10, and NEW-1a and NEW-1A stay distinct.
    2. NOTHING UNMINTED SURVIVES. After substitution, materializeDraftTaskIds checks the fragment and stamp: any
       remaining `NEW-` token (a declaration or a dangling depends_on reference), or any declared `- id:` that is
       not a minted id shape, returns `{ ok: false, reason }` naming each offending token. The zero-placeholder
       path runs the same check, so a fragment with only unrecognised ids is refused instead of passing through.
       The caller already treats `ok: false` as "write nothing, open no PR".
    3. LINT-PLAN REFUSES AN UNMINTED ID ON AN ADDED SHARD. A task that the diff adds (lintPlanCommand's
       `newTaskIds` under `--base`) and whose id is not `[A-Z][A-Z0-9]*-T<digits>` with an optional single letter
       fails lint with a rule naming the id and the expected shape. Tasks already on the base are reported as a
       WARN only, so the four shards above never redden main or an unrelated PR. Without `--base` the rule
       WARNs for every unminted id. The shape is one exported constant, shared with the materializer's check.
    4. THE FOUR SHARDS ON MAIN ARE NOT RENUMBERED BY THIS TASK. NEW-1A and NEW-1B are retired gravestones:
       renumbering them changes nothing that dispatches and would rewrite W1-T9168's depends_on for no gain.
       NEW-1a and NEW-1b are queued but depend on retired work (W1-T60, W1-T77), so nothing can dispatch them,
       and the plan gardener's retire pass is their natural owner. The WARN in step 3 keeps all four visible. If
       the operator wants W1-T5760's automation filed under real ids, that is a fresh `rmd approve` after this
       task merges. W1-T9167 stays an unused reservation; `rmd next-task-id --audit` reports it, and reclaiming
       it is an operator decision.
    Tests go in test/a-suffixed-draft-placeholder-is-minted-and-an-unminted-id-never-lands.test.ts: drive
    materializeDraftTaskIds with fake mint and reserveBlock deps over the #11378 fragment shape (NEW-1A,
    NEW-1B, NEW-2 with NEW-1B depending on NEW-1A and NEW-2 on both) and the #11402 shape (NEW-1a, NEW-1b only),
    and drive the lint over a git fixture whose base holds one unminted shard (NEW-1A) and whose head adds a NEW-9 shard.
  acceptance:
