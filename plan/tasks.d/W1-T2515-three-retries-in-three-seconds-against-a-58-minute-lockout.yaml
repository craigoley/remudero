    - claim: "an ordinary network transient still retries, under a bounded backoff that never grows without limit"
      proof: "unit test: test/three-retries-in-three-seconds-against-a-lockout.test.ts"
    - claim: "the retry bound is still MAX_TRANSIENT_RETRIES and is not raised by this change"
      proof: "unit test: test/three-retries-in-three-seconds-against-a-lockout.test.ts"
    - claim: "a task's own build failure still strikes, never absorbed into a usage-limit verdict"
