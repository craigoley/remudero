    - claim: the heavy-band bound and its strictly-below-WAIT_CAP_SECONDS check survive the step being replaced or removed
      proof: "unit test: test/workflow-job-timeouts.test.ts"
    - claim: both playwright-carrying jobs are changed together under this task, recorded beside the step itself
      proof: "grep: W1-T1034 in .github/workflows/ci.yml"
    - claim: the workflow records that apt left the critical path rather than merely became more patient
      proof: "grep: critical path in .github/workflows/ci.yml"
