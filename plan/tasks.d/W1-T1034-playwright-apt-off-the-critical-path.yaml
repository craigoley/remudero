- id: W1-T1034
  title: "the playwright install blocks itself: `timeout 360` signals only `npx`, so attempt 1's own root `apt-get` survives holding the dpkg lock and attempts 2 and 3 die against it in ~2 seconds — the 3-attempt retry has an effective N of 1, and the `flock` wait #2211 added to fix it cannot see an `fcntl` lock at all"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  rationale: "READ FROM ONE JOB'S LOG, NOT INFERRED. Every timestamp, pid and byte count below is
    quoted from the raw log of job 96091145430 (`coverage-ratchet`, PR #2207, head 0edf83e3b094,
    46,430 bytes fetched whole). #2211 — the apt-lock wait — merged at 2026-08-19T13:38:54Z as
    13a266cc51ec9d288cefee0922103082dc15ff74. This job started that step at 13:47:56Z, NINE MINUTES
    LATER, carrying the fix, and still ended `playwright install failed after 3 attempts`.

    (1) THE RETRY HAS AN EFFECTIVE N OF 1. The three attempts, verbatim and in order:
      13:47:56.4457278Z ::notice::waiting up to 300s for the apt/dpkg lock ...
      13:47:57.2245794Z Switching to root user to install dependencies...
      13:47:57.3460355Z Get:1 ... through Get:34, apt-get update COMPLETES at 13:48:03
      13:53:56.4696844Z ::warning::playwright install attempt 1/3 failed or hung past 360s
      13:53:56.4700320Z ::notice::waiting up to 300s ...
      13:53:58.6819221Z E: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 2725 (apt-get)
      13:53:58.6839473Z Error: Installation process exited with code: 100
      13:53:59.4931990Z Switching to root user to install dependencies...
      13:54:00.9670065Z E: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 2725 (apt-get)
    Attempt 1 spans 360.02s from its notice to its warning — exactly the `timeout 360`. Attempt 2
    fails 2.21s after its notice; attempt 3 fails 2.26s after its own. SAME PID BOTH TIMES: 2725.
    So a bound advertised as 3 x 6m = 18m of independent tries is, whenever attempt 1 times out,
    one try plus four and a half wasted seconds.

    (2) 2725 IS ATTEMPT 1'S OWN ORPHAN, and the log proves it rather than suggesting it. Attempt 1
    was never blocked: it printed `Switching to root user`, ran a full `apt-get update` to
    completion, resolved the dependency tree, and began downloading. It HELD the lock. It then died
    at the timeout with the download in flight. `timeout 360` signals only its direct child —
    `npx` — while `--with-deps` has already re-executed `apt-get` under root, outside that signal's
    reach. The root process survives its parent, keeps /var/lib/dpkg/lock-frontend, and is the
    holder both later attempts name. A pre-existing holder would not appear only AFTER attempt 1
    ran to its cap, and would not carry one pid across both.

    (3) THE WAIT CANNOT SEE THE LOCK. Each notice is followed 2.2s later by `Could not get lock`.
    A `flock -w 300` genuinely blocked on a held lock does not return in 2.2 seconds; it returns in
    up to 300. The wait succeeded instantly while apt still held the file, because `flock(1)` takes
    a `flock(2)` open-file-description lock and apt takes an `fcntl(2)` record lock on the same
    path — two independent lock spaces on Linux, neither visible to the other. `2>/dev/null || true`
    then discards anything that might have hinted at it. THE 2.2s IS THE MEASUREMENT; the mechanism
    is the explanation for it and is stated as such.

    (4) THE TRIGGER IS A MIRROR STALL, not contention, and everything else is wreckage from it.
    Where attempt 1's 360 seconds went:
      13:48:03.7601489Z Need to get 21.1 MB of archives.
      13:48:04.6935557Z Get:2 ... fonts-ipafont-gothic all 00303-21ubuntu1 [3513 kB]
      13:50:39.3874799Z Get:3 ... fonts-freefont-ttf all 20211204+svn4273-2 [5641 kB]
      13:53:56.4696844Z ::warning::attempt 1/3 failed or hung past 360s
    A 154.7s gap and then a 197.1s gap, both BETWEEN package `Get:` lines on the archive host. The
    mirror delivered essentially nothing for 352 of the 360 seconds. So this one log carries BOTH
    failure modes: the stall the retry was built for, and the self-inflicted lock collision the
    retry's own kill creates.

    (5) AND IT CORROBORATES W1-T1027 (4) FROM A FAILING RUN. That shard established from a GREEN
    job that apt is there only for fonts. This failing job says the same thing independently: every
    Chromium shared library reads `is already the newest version` (libasound2t64, libatk1.0-0t64,
    libcairo2, libcups2t64, libdrm2, libgbm1, libglib2.0-0t64, libnspr4, libnss3, libpango-1.0-0,
    libx11-6, libxcb1, libxkbcommon0, xvfb, libfontconfig1, libfreetype6, fonts-liberation and the
    rest), and the 9 NEW packages are fonts-freefont-ttf, fonts-ipafont-gothic, fonts-tlwg-loma-otf,
    fonts-unifont, fonts-wqy-zenhei, xfonts-cyrillic, xfonts-encodings, xfonts-scalable,
    xfonts-utils. 21.1 MB of glyphs is the entire contended dependency.

    (6) #2211 PREMISE NOT WHAT THIS RUN SHOWS, recorded without rewriting history. Its comment in
    ci.yml states the holder is `the runner IMAGE's OWN background apt-get (cloud-init/unattended-
    upgrades on a fresh VM)` and that `That holder always finishes on its own`. On THIS run the
    holder is the job's own orphan and it does not finish on its own — it outlived both remaining
    attempts. EARLIER FAILURES MAY GENUINELY HAVE HAD A PRE-EXISTING HOLDER: W1-T1027 (2) quotes
    job 96018816644 naming `process 2418` on /var/lib/apt/lists/lock, which is a different lock file
    and a different pid, and this task does not reclassify it. #2211 is superseded on its remedy,
    not convicted of inventing its cause.

    (7) THE FIX DID REACH BOTH COPIES — that hypothesis is refuted, not left open. 13a266c adds
    `wait_for_apt_lock` to the `ci` job and to `coverage-ratchet`, and
    test/workflow-playwright-install.test.ts asserts the two `run:` blocks stay byte-identical. The
    duplication hazard W1-T1027 (5) names is closed. What shipped is insufficient on its merits."
  design: "REMOVE APT FROM THE CRITICAL PATH. Findings (1)-(4) are three separate defects — an
    orphaned root process, a wait that observes nothing, and a slow mirror — and only the third is
    the actual trigger. A remedy that closes the first two leaves CI failing on the third.

    (0) DROP `--with-deps`. THE MEASUREMENT SETTLES IT, AND THIS CLAUSE REVERSES THIS SHARD'S FIRST
    RECOMMENDATION. As filed, this task led with the container image and priced it in detail;
    clause (viii) admitted it had not answered W1-T1027 design (i), the fonts precondition upstream
    of every lighter option. That precondition has since been ANSWERED BY RUNNING THE SUITES, and
    the answer removes the need for the container entirely.

    THE EXPERIMENT, on a Linux host stripped to the runner's PRE---with-deps baseline: the nine
    Chromium shared libraries the runner already carries were installed and all nine of the font
    packages `--with-deps` adds were confirmed ABSENT, as was `fonts-noto-color-emoji`, which the
    runner's base image does have — so the environment is strictly LEANER than the runner, and a
    pass on it is a stronger result than a pass there. Then `npx playwright install chromium`, with
    no `--with-deps`, no `sudo` and no apt of any kind, and the browser suites run against it:
      243 tests across 21 files, 243 pass, 0 fail, 0 skipped, 0 cancelled
    including the two the question was actually about — the axe accessibility scan (zero critical or
    serious violations, the Lighthouse-equivalent bar) and the 390px/1440px no-horizontal-overflow
    assertion, both of which executed and passed with real per-test timings.

    THE NEGATIVE CONTROL, because a green run over absent fonts proves nothing unless the fonts were
    genuinely absent. Canvas advance widths at 100px sans-serif, measured in the same browser that
    ran the suites: `AAA` reads 200.10 (real glyphs), while `日本語` and `あいう` both read 225 —
    IDENTICAL to a private-use codepoint with no glyph anywhere. CJK renders as tofu on that host and
    the suites passed anyway. `Мир` reads 194.78, so Cyrillic resolves to real glyphs from the base
    image's `fonts-liberation`; `xfonts-cyrillic` is an X11 bitmap set Chromium never consumes, so
    Cyrillic was never at risk in the first place.

    AND IT CANNOT FAIL STRUCTURALLY, which is the corroboration that makes one run enough: the
    console has no CJK to render. Zero CJK codepoints across `src/`, `plan/` and `test/`, against
    positive controls of 122, 520 and 610 files respectively that DO carry non-ASCII, so the scan is
    live rather than silently matching nothing. Zero Cyrillic in the same three trees. And zero
    visual-snapshot tests anywhere in 552 test files — no `toMatchSnapshot`, no `toHaveScreenshot`,
    no pixel comparison — so no assertion in this repo is sensitive to which glyph a fallback picks.

    SO THE FLAG CLOSES ALL THREE FINDINGS AT NO INFRASTRUCTURE COST. The orphan goes because there is
    no root phase at all to orphan. The dead wait goes with the step that carried it. The mirror
    stall goes because the archive host leaves the critical path completely; what remains is the
    `cdn.playwright.dev` download the step ALREADY performs today, after apt. No container, no digest
    pin, no Node re-base, no `runs-on` change — one line, applied identically to both copies.

    (0a) WHAT `--with-deps` STILL BOUGHT, recorded because dropping it is not free. It was insurance
    against a future `ubuntu-latest` image dropping a Chromium shared library: today it drops none —
    the failing job's own log shows every one reading `is already the newest version` — but if one
    ever went missing, apt would have silently repaired it, and without the flag the same event
    surfaces as a cryptic browser-launch error inside an unrelated suite. THE CHEAP MITIGATION IS A
    LAUNCH SMOKE-CHECK WITH A LEGIBLE MESSAGE: a test that calls `chromium.launch()` in the same CI
    job that installed it, so a missing library fails BY NAME instead of as an unexplained shell-ux
    error. #2226 ALREADY DOES THIS — its falsifier carries `chromium launches from an install that
    never ran apt`, plus a second test rendering the console's real font stack and asserting a
    measurable width, so a zero-glyph fallback collapsing to the container cannot quietly make the
    390px overflow assertion vacuous. That is the shape this clause requires; it is not a new ask.

    (i) THE CONTAINER OPTION, PRICED FROM THE REGISTRY — NOW THE FALLBACK, NOT THE LEAD. Kept in full
    because the pricing is real work and stays correct if clause (0) is ever refuted, and because it
    is the answer if a future base image genuinely stops carrying the Chromium libraries. Nothing
    below argues for adopting it today. `mcr.microsoft.com/playwright:v1.62.1-noble`
    was read anonymously over the v2 API rather than assumed. Index digest
    sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e; amd64 manifest
    sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac, 7 layers,
    949,411,114 bytes compressed. Its config blob's build history shows, verbatim:
      apt-get install -y --no-install-recommends git openssh-client
      npm exec --no -- playwright-core install-deps
      npm exec --no -- playwright-core install chromium   (then firefox, then webkit)
      ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      ARG NODE_VERSION=24
    and a base labelled org.opencontainers.image.version=24.04 — the same Ubuntu noble the hosted
    runner uses today. The fonts and libs are baked; the browsers are baked; the install step
    disappears entirely rather than being made more patient.

    (ii) TWO OF THREE, NOT THREE OF THREE — the container's honest score, and the reason clause (0)
    beats it. The orphan (1)/(2) goes: there is no apt invocation, so nothing to orphan.
    The dead wait (3) goes with the step that carries it. The MIRROR STALL (4) is RELOCATED, not
    removed: a ~0.95 GB compressed image pull enters the critical path where a 21.1 MB apt download
    left it. Two things make that trade plausibly good and neither is proven here — the pull holds
    no lock, so a failure is clean and a re-run is a real retry rather than a collision; and it is
    one dependency instead of an archive host plus a CDN. DROPPING THE FLAG SCORES THREE OF THREE
    AND ADDS NO NEW DEPENDENCY AT ALL, which is the whole argument: the container trades one network
    dependency for another and pays the costs in (iii) to do it, while clause (0) removes the
    dependency outright. If the container is ever adopted anyway, the pull time must still be
    reported across several runs and one green run must still not be treated as the answer
    (W1-T1027's own A GREEN RERUN IS NOT A FIX applies unchanged).

    (iii) WHAT THE CONTAINER COSTS, each item derived from this tree:
      - `runs-on`/`container:` change on TWO jobs (`ci`, `coverage-ratchet`); the other twelve jobs
        in ci.yml stay on `ubuntu-latest` and are untouched.
      - A DIGEST PIN IS MANDATORY and WILL ROT. scorecard.yml runs PinnedDependencies, and
        semgrep.yml is the precedent — `semgrep/semgrep@sha256:...` pinned by W1-T66 in #323. That
        digest has NEVER been bumped since: three Dependabot actions-group PRs (#533, #1345, #1626)
        edited that same file without moving it, and its trailing comment still reads 1.167.0.
        .github/dependabot.yml configures `npm` and `github-actions` and NO `docker` ecosystem, so
        nothing bumps a container image here. This is measured, not feared.
      - AND THE PIN IS COUPLED TO A DEPENDENCY DEPENDABOT DOES MOVE. package.json carries
        `playwright: ^1.62.1`, so the resolved version lives in package-lock.json and the weekly
        npm-minor-and-patch group bumps it without touching any workflow file. A drifted image
        makes playwright refuse to launch its browsers. The coupling needs its own assertion — a
        test reading the image reference in ci.yml against package-lock's resolved playwright
        version — or it breaks silently on the first bump. Mitigating datum: that resolved version
        has not moved since #376 on 2026-07-20, so the coupling is slow, not absent.
      - TOOLCHAIN RE-BASE, exactly: the image ships NODE_VERSION=24 and .nvmrc pins 22.22.3. Either
        keep `actions/setup-node` with `node-version-file: .nvmrc` inside the container (it works,
        and re-downloads node) or move the repo to 24 as a separate, separately-argued task. DO NOT
        bundle a Node major bump into this changeset.
      - GIT IS PRESENT and this was checked because it would have been fatal: 77 of this repo's 552
        test files shell out to `git` directly, and `fetch-depth: 0` plus test/recon-gaps-relayed
        .test.ts need a real .git rather than actions/checkout's tarball fallback. The image's build
        history installs `git openssh-client` explicitly, so the option survives this check.
      - `sudo` disappears (a container job runs as root). Its only uses in this repo are the four
        flock lines being deleted, so nothing else regresses.

    (iv) THE NARROW FIX LEAVES THE STALL, which is why it is recorded as the fallback and not the
    remedy. `setsid` plus a process-GROUP kill (or a `pkill` of the apt subtree between attempts)
    closes (1) and (2): attempts 2 and 3 stop colliding with attempt 1's leftovers and the effective
    N goes from 1 to 3. It does nothing about (4). Attempt 1 still burns 360s against a mirror that
    delivered ~8 seconds of useful transfer in 360, and three such attempts against that mirror are
    not obviously enough. IT IS NOW THIRD CHOICE, behind clause (0) and behind the container: it is
    the only one of the three that leaves the actual trigger in place. Reach for it only if clause
    (0) is refuted AND the container's pull cost measures badly under (ii), and ship it knowing CI
    can still go red on the same trigger.

    (v) A LONGER WAIT IS REFUSED, and so are two of its cousins. A larger `-w`, a fourth attempt,
    and `-o DPkg::Lock::Timeout` are all aimed at how an invocation WAITS. The failing invocation
    never gets control back to wait — it is killed mid-download and never reaches a lock at all.
    None of the three can change this run's outcome, and a builder proposing one has not read (2).
    THE 3-ATTEMPT BOUND IS THE ONE CLAUSE (0) SUPERSEDES, and this shard's first draft had it wrong.
    W1-T1027 (3) is right that the bound is the only thing making a STILL-CONTENDED apt finite — but
    under clause (0) there is no apt call to contend, so the retry and the wait both exist to survive
    something that no longer happens and must go WITH the flag rather than outliving it. Keep the
    bound only on a remedy that still invokes apt; a bare `npx playwright install chromium` needs
    neither, and re-adding either would rebuild exactly the orphan class finding (2) measured.

    (vi) THIS IS AN INSTRUMENT-ONLY CHANGESET AND IT RIDES ALONE. `.github/workflows/ci.yml`
    matches INSTRUMENT_SURFACE's first entry, so Rule 25's `detectInstrumentEntanglement` forces the
    verdict to failure — unsuppressibly — on any diff also carrying a src/ product path. Workflow
    plus test/ is the sanctioned shape (#2160 and #2189 both shipped exactly that). Nothing else may
    ride with it, and nothing may ride with anything else.

    (vii) TWO EXISTING SUITES BREAK ON PURPOSE AND MUST BE REWRITTEN, NOT DELETED. Removing the
    install step is not a silent edit:
      - test/workflow-playwright-install.test.ts — every one of its five tests keys on the step
        existing: it asserts `flock`, a named lock path, `for attempt in 1 2 3`, `timeout 360`, and
        byte-identical `run:` blocks across the two jobs. Under the container option none of those
        properties has anything left to describe. The suite's PURPOSE survives — no job may reach
        apt on the critical path — and it must be re-expressed as that, per job, matched by content.
      - test/workflow-job-timeouts.test.ts — `jobsCarryingPlaywrightInstall` selects jobs by
        searching their `run:` for `playwright install`, and the WAIT_CAP_SECONDS test asserts
        `playwrightJobs.length > 0`. THIS BREAKS UNDER THE CONTAINER ONLY, AND THE FIRST DRAFT SAID
        IT BREAKS EITHER WAY — WRONG. A bare `npx playwright install chromium` still contains the
        substring `playwright install`, so under clause (0) the selector still matches both jobs,
        `playwrightJobs.length > 0` still holds, and the file needs NO edit (#2226 ran it against
        that tree: 4 tests, 4 pass). It is still declared in `files:` because the container fallback
        would break it. Under the container, W1-T1009's heavy-band bound stays correct for both jobs
        and only the selector is wrong: re-anchor the selector, keep the bound, and do not weaken the
        strictly-below-WAIT_CAP_SECONDS check.

    (viii) THE FONTS QUESTION IS ANSWERED — 243 TESTS, 0 FAILURES, GLYPHS PROVEN ABSENT. W1-T1027
    design (i) requires establishing from the browser suites which fonts are actually needed before
    dropping `--with-deps`. Clause (0) establishes it by running them on a host where the nine font
    packages are absent and CJK is proven to render as `.notdef`, so the precondition is discharged
    rather than deferred, and it is discharged in the direction that makes the container unnecessary.
    THE FIRST DRAFT OF THIS CLAUSE SAID THE OPPOSITE — that the question was still open and that only
    the container made it moot. It is superseded here rather than quietly rewritten."
  acceptance:
