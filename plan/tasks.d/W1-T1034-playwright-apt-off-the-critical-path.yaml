  note: "THIS IS NOT W1-T1027 RE-FILED, and the boundary is worth stating because the two are one
    keystroke apart. W1-T1027 is the FILED CAUSE — it measured the step's cost across the Actions
    API (18 of 69 failed/cancelled jobs in 48h) and left its remedy options DELIBERATELY UNRANKED.
    It is `status: queued` still. This task consumes evidence that did not exist when that shard was
    written: #2211 shipped one of those options at 13:38:54Z and a job carrying it failed at
    13:47:56Z, and the log of that failure eliminates the whole lock-directed branch of W1-T1027's
    option list. W1-T1027 stays the parent and is cited, not superseded; #2211 is the attempt this
    supersedes. If the Architect judges the two indistinguishable, the correct merge is to fold this
    into W1-T1027 as a round 2 — not to file a third.

    `risk: high` IS SET UP FRONT, for the same reason W1-T1027 sets it: `sizingViolation` exempts
    only `risk === 'high'` and `files:` spans `.github/` and `test/`. Rule 19's band is SPAN, and
    the runtime blast radius is one setup step in one workflow.

    `files:` IS DERIVED. ci.yml holds both copies of the step. Both declared test files are files
    this change genuinely breaks, shown above in design (vii) rather than asserted — one asserts the
    flock/retry shape being removed, the other selects jobs by the step being removed and asserts
    that selection is non-empty. `src/run-task.ts` is NOT declared: nothing here touches it, and
    every task naming the monolith serialises against every other that does (W1-T471). The shard's
    own path is not declared, which would turn the endemic proof-scope warnings into a hard
    rule15-filing violation.

    THE ACCEPTANCE POINTS AT THE IMPLEMENTATION, NOT AT THIS FILE, and that is a deliberate
    departure from the sibling shape. Self-referential `grep:` proofs (a criterion satisfied by the
    shard's own prose, which already exists) name a path outside `files:` and earn one [proof-scope]
    warning apiece — W1-T1027 carries six of them. Rewriting them to the whole-file `unit test:`
    form ACCEPTANCE_PROOF_GRAMMAR calls the default, plus two forward-referencing greps on ci.yml,
    leaves `rmd lint-plan --base origin/main` at 0 failing AND 0 warnings, and leaves each criterion
    something an implementer must actually do. The claims about what this SHARD records are proved
    on the filing PR's own body instead, which is where they belong.

    THE IMAGE FIGURES WERE FETCHED, NOT RECALLED. The manifest index, the amd64 manifest and the
    config blob for v1.62.1-noble were read anonymously from mcr.microsoft.com's v2 API during
    recon; the layer total, the NODE_VERSION, PLAYWRIGHT_BROWSERS_PATH and the `git openssh-client`
    install line are quoted from that config's build history. WHAT WAS NOT MEASURED, said plainly:
    the actual pull time on a GitHub-hosted runner. Compressed layer bytes bound it; they do not
    predict it, and design (ii) makes measuring it an implementer obligation rather than carrying a
    guess forward.

    ID PROVENANCE. W1-T1034 was swept free on four surfaces before minting, each with a positive
