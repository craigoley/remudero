- id: W1-T9563
  title: "THE FULL-SWEEP WALL-CLOCK BOUND IS LEARNED FROM PASSES THAT COMPLETED, AND AN ABANDON NO LONGER CLOSES THE PASS'S REVIEW POOL — `sweepWallClockBoundMs` (559 s) was derived from full passes of 61.8 s median and 111.8 s p90, but on 2026-10-14 12-24Z full passes completed in 6.6-35.3 min (p50 16.6 min), 21 were abandoned against 20 completed, and each abandon closed that pass's review admissions"
