- id: W1-T9049
  title: "THE GATE GARDENER FILES AGAINST A GATE THAT FIRED WRONGLY — a refusal cleared only by editing the gate's own baseline, by rebuilding a token at runtime or by renaming a symbol to dodge its regex is the gate's defect, not the PR's, and today it is filed nowhere"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — classifying a gate refusal's repair; spans the gate gardener and the precheck registry
  band_meaning: span
  origin: "operator session 2026-10-13: gardener loop audit (operator ruling 2026-10-09: a hand-fixed PR is a bug in rmd)"
  plan_refs: [W1-T4116, W1-T6092, W1-T7421]
  files: [src/lib/gate-gardener.ts, scripts/census-precheck.mjs, test/a-gate-that-fired-wrongly-is-filed-against-the-gate.test.ts, "src/lib/ci-parity.ts", "src/lib/rule-suites.ts", "test/the-tree-walk-recognizer-admits-by-what-a-suite-executes.test.ts"]
  status: queued
  priority: 1.5
  attempts: 0
  rationale: |
    OBSERVED 2026-10-12, PR #10787. The census recognizer pulled in a test that merely mentioned `ls-files`. The parity
    baseline scripts/census-precheck-parity-baseline.json is shrink-only, so registering it was refused, and the green
    repair was a token dodge (`["ls", "files"].join("-")`). Three tests now carry that dodge. Clock-signature and
    Deps-interface census ratchets forced pure renames the same week.
    VERIFIED: `CENSUS_POPULATION` (src/lib/ci-parity.ts) holds 38 `refusedForPredicate` hand exclusions against 8
    admitted members, mostly "ls-files only in a comment / fixture / test/ only".
    No gardener sees any of this:
    - gate-fire-rates.json counts per check context, so a census inside the `ci` job is invisible as its own gate.
    - fix-lane's `fix-swapped-red-for-census` files only against the fix lane.
    - the gate gardener only demotes gates that never fire.
    The data is there: `collectCiFailureCorpus` pairs carry `redSha`, `greenSha` and `repairFiles`, which is the repair
    delta.
  design: |
    1. `classifyGateRepair(pair, repairDiff, ownFiles, gateRegex)` returns one of:
       - `baseline-only`: repair files ⊆ the gate's own files
       - `token-dodge`: a removed line matched the gate regex; the added line rebuilds the token from string literals
       - `rename-dodge`: a pure identifier rename where the old name matched and the new one does not
       - `off-subject`: the PR's diff before the repair fails the gate's trigger
       - `genuine`
       Ledger `gate.false_positive_suspected` for every non-genuine repair.
    2. Each census-precheck.mjs `PRECHECK_TRIGGERED_SUITES` entry declares `ownFiles` (its baseline, registry and
       allowlist paths) instead of leaving them in prose.
    3. A new gate-gardener class `false-positive` renders a machine shard against the gate's RECOGNIZER, never the PR, with
       origin `gate-false-positive:<gate>`, one open at a time. Its effect is the gate's suspect rate after the remedy
       merges.
  acceptance:
    - claim: "a repair that only edits the gate's own baseline is a suspected false positive"
      proof: "grep: test(\"W1-T9049: a repair that only edits the gate's own baseline is a suspected false positive\" in test/a-gate-that-fired-wrongly-is-filed-against-the-gate.test.ts"
    - claim: "a token rebuilt at runtime to dodge a gate's regex is a suspected false positive"
      proof: "grep: test(\"W1-T9049: a token rebuilt at runtime to dodge a gate's regex is a suspected false positive\" in test/a-gate-that-fired-wrongly-is-filed-against-the-gate.test.ts"
    - claim: "a repair that changes the gated code is genuine and files nothing"
      proof: "grep: test(\"W1-T9049: a repair that changes the gated code is genuine\" in test/a-gate-that-fired-wrongly-is-filed-against-the-gate.test.ts"
  falsifier: |
    Classify #10787's repair: a red census on a test that names `ls-files` in a fixture string, cleared by
    `["ls", "files"].join("-")`. At origin/main nothing classifies or files it; with the change it is `token-dodge` and
    the gate gardener drafts one shard against `censusCandidateWalks`.
