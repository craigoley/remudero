  rationale: |
    OBSERVED 2026-11-04:
    - Two recycles ran: RECYCLE-3315651, invoked 12:26:41Z from a human SSH terminal, and RECYCLE-3864750, invoked 13:04:08Z by the progress watchdog.
    - The ledger union holds a recycle.invoked row for each and nothing about how either ended.
    - The second recycle's refusal ("REFUSING — 0 lane-holding and 2 lane-less worker(s) still in flight after 3000s" plus recycle-blockers-json naming a retro of 6,929 s and a review of 103 s) exists only in the launcher's captured stdout, the systemd journal, and one line in ~/rmd-revivals.log.
