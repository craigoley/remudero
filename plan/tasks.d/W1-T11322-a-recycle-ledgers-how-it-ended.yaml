    - recycle-container.sh ledgers only recycle.invoked, hung_worker_passed, control_timeout, cadence_child_killed and git_author_commission.
  design: |
    Install an EXIT handler beside the existing cleanup that appends one recycle.ended JSON row to LEDGER_FILE: run_id RECYCLE-<pid>, outcome from the exit path (replaced on success, refused on a refusal exit, aborted on a signal), rc, the final reason line, wait_s, wait_source, waited_s, and blockers when a refusal printed recycle-blockers-json.
    It reuses the script's existing ledger-append form (the hung_worker_passed row). A failed append never changes the exit status.
    Mark it with a comment naming W1-T11322.
    NOT IN SCOPE: any refusal rule, the wait, and the launcher.
