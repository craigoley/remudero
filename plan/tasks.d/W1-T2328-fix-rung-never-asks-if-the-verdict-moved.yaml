  note: |
    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS - AND HERE THE SPAN IS A STEM ARTIFACT. The
    linter derives concerns from file STEMS, so src/run-task.ts and test/fix-rung-verdict-
    unchanged.test.ts read as two (run-task, fix-rung-verdict-unchanged) even though the change is
    one concern: a pure comparison beside detectReviewFalseBlock plus its falsifier. Decomposing
    would mean either a test with no subject or renaming the test to test/run-task.test.ts, which
    the house rule forbids for a coverage-load-bearing test because that file crashes at FILE level
    under coverage instrumentation and would zero this test's own record. Raised to high and
    recorded rather than worked around.

    NEITHER NEIGHBOUR IS RE-FILED. W1-T2317 owns the negative-reachability ratchet for instruments;
    this is the same principle one layer up, at the fix rung, and cites it. W1-T2298 shipped the
    annotation reader this proposal depends on and is cited as the enabling capability, not
    revisited.

    WHAT WAS NOT MEASURED. Whether a given check publishes annotations at all varies by check, and
    no census of that was taken. The design does not need one: the absent case is already a named
    outcome in CiAnnotationFallback and the rule on it is to abstain and strike, so an unmeasured
    distribution cannot turn into a wrong stand-down.

    THE INSTANCE IS ON AN IN-FLIGHT BRANCH, NOT MAIN. ledger-replay.ts and its pattern constant
    live on the open run branch named in the rationale. If that PR changes shape before this task
    is built, the instance is still valid as the thing that was observed, but the line number is
    not durable and should be re-derived rather than quoted.
