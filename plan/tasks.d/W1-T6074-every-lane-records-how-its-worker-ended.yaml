- id: W1-T6074
  title: "EVERY LANE RECORDS HOW ITS WORKER ENDED — since W1-T6027 a WorkerResult carries `exit` (exit, signal or unobserved), but only the fix rung reads it; workerLedgerFields writes no exit field, so implement.done, recon.done and review.reviewer cannot tell a worker ended by a signal from one that crashed, and reviewerOutcome returns the raw subtype, so 28 floor-only review.posted rows read `reviewer_outcome: error_exit_null` beside 29 `error_exit_1` crashes"
  repo: remudero
  depends_on: [W1-T6027, W1-T6073]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — where every lane's worker row records the typed WorkerExit; three src files read it
  band_meaning: span
  origin: "operator session 2026-10-06: follow-up of #9682 (W1-T6027), named out of scope in its design"
  plan_refs: [W1-T6027, W1-T5999, W1-T6028]
  files: [src/lib/worker.ts, src/lib/review.ts, src/run-task.ts, test/every-lane-records-how-its-worker-ended.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-06 at origin/main a76291b3. The only readers of WorkerResult.exit in src/ are
    run-task.ts fixWorkerEndedBySignal (`result.exit?.kind === "signal"`) and the W1-T5999 row's
    `worker_exit_signal: fixResult.exit.signal`.
    WHERE EACH LANE CLASSIFIES A WORKER'S END TODAY:
    - REVIEW. run-task.ts sets `reviewerSubtype = reviewer.subtype`, logs review.reviewer with
      `subtype: reviewer.subtype` and `...workerLedgerFields(reviewer)`, then calls src/lib/review.ts
      reviewerOutcome, which ends `return opts.subtype ?? "unknown";`. review.posted writes that as
      `reviewer_outcome`. The floor still posts a binding verdict, so a signal-ended reviewer becomes a floor-only
      review.
    - IMPLEMENT (and recon, resume). failOnWorkerError calls workerErrorVerdict, which returns null for
      `!r.isError || r.subtype === "success"`, `blocked_budget` for `error_max_budget_usd`, and otherwise
      `failed` with `reason: worker error at <stage>: <subtype>`. It never reads `exit`.
    - workerLedgerFields (src/lib/worker.ts), the shared row shape for implement.done, implement.resumed,
      recon.done, review.reviewer, census_push.strike and, through fixWorkerReceipt, fix.done, has no exit field.
    CORPUS (ledger union: 402 .gz rotations, 0 plain rotations, live ledger.ndjson):
    - review: 33 review.reviewer rows with `subtype: error_exit_null` (2026-09-24 to 2026-10-06T11:21:28Z), 15 of
      them within 10 s of an orphan-sweep row (the worker_orphan_* step, 129 rows). Distinct review.posted rows with a failed
      reviewer: 28 `error_exit_null`, 29 `error_exit_1`, 7 `error_codex`, all `state: success` from the floor.
      A sweep or deploy ending the reviewer cannot be told from a reviewer that crashed.
    - implement: of implement.done, implement.resumed and recon.done rows, 0 have `error_exit_null`, 3 have
      `error_codex` (implement.done, 2026-09-07) and 1 has `error_exit_1`. This lane has not been observed
      ending by a signal through a returned result (a Claude worker the SDK ends before its envelope throws instead).
    TWO CONCERNS, NOT ONE, with the dispatchFix catch follow-up: that one reads a THROWN error in sweep.ts; this
    one reads a RETURNED WorkerResult in the lanes' own rows.
  design: |
    (1) src/lib/worker.ts workerLedgerFields: add `worker_exit` (`r.exit.kind`), plus `worker_exit_signal` for a
    signal and `worker_exit_code` for an exit. All three are absent, never undefined, when `r.exit` is absent
    (hand-built test fixtures; `exit` is optional on WorkerResult). This puts the fields on every lane's worker
    row with one edit.
    (2) src/lib/review.ts reviewerOutcome takes `exit?: WorkerExit` and returns `"signal_terminated"` for a signal
    before it falls back to the subtype. run-task.ts passes `reviewer.exit`. The floor's verdict and the posted
    state do not change. judge-calibration already excludes any outcome that is not "success", and
    review-flow-observation counts the new value under `failed`.
    (3) src/run-task.ts workerErrorVerdict: for `exit.kind === "signal"` the reason names the signal
    (`worker ended by signal <SIG> at <stage>`) and the ledger carries the (1) fields. The verdict stays `failed`:
    the implement lane has no observed population, so this records and does not decide.
    (4) This depends on the fall-through follow-up: once (1) lands, every fix.done row carries `worker_exit`, and
    the routing learner must already exclude a signal row only when it pushed nothing.
    Out of scope, for the operator: whether a signal-ended reviewer should be re-run rather than posted
    floor-only (28 such posts measured above).
  acceptance:
    - claim: "a worker result with exit kind signal, exit or unobserved is ledgered by workerLedgerFields with worker_exit and its signal name or exit code, and with no such fields when exit is absent; a reviewer that ended by a signal yields reviewer_outcome signal_terminated while one that exited 1 still yields error_exit_1; an implement worker that ended by a signal is still verdict failed, with a reason that names the signal"
      proof: "unit test: test/every-lane-records-how-its-worker-ended.test.ts"
    - claim: "the reviewer outcome names a signal end"
      proof: "grep: signal_terminated in src/lib/review.ts"
    - claim: "the shared worker row carries the exit"
      proof: "grep: worker_exit in src/lib/worker.ts"
  falsifier: |
    Leave reviewerOutcome on the subtype: a reviewer fixture with `subtype: "error_exit_null"` and
    `exit: {kind: "signal", signal: "SIGTERM"}` yields `error_exit_null`, and the test fails. Drop the
    workerLedgerFields fields: an implement fixture's implement.done fields carry no worker_exit, and the test fails.
