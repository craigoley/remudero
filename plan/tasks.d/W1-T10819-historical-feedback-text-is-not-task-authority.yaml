  rationale: |
    The already captured operator continuation on issue #14638/comment 6430660829 contains a formerly reserved task name in immutable quoted reply text. The ordinary feedback landing preflight refuses the entire landing because that historical name is no longer currently reserved or declared. Preserve the original public reply and captured record; an old name in quoted input is not a new task reservation, declaration, dependency or dispatch grant.
    At captured main ab1bf69140e730321977a3083ebe19548ced45c4, scanCitedIds walks every physical text line under src/deploy/plan and evaluateIds accepts a current reservation OR a declaration. The captured 473 advertised heads have 10 gate blob versions with byte-identical scanner and existence decision functions. The source/subject scan retained all 291 plan trees and 417 matching record blobs; existing related tasks concern general existence, plan coverage, holder/collision checks or asynchronous landing, not this raw-data boundary. Fresh subject, open-head, claim and merged-source checks still apply before filing or building.
    Craig explicitly approved only the narrow feedback-text boundary on 2026-10-27: ignore task IDs only inside the raw text scalar of a strictly validated canonical feedback record. Every other field, source file, plan declaration, reservation and collision check stays checked; malformed records remain strict. No original answer bytes, reservation refs, claims, business rulings or production state are changed.
