  falsifier: |
    If a reading of the FLEET corpus shows that the sweep's post-review dedup has ever been cleared
    on an unchanged sha WITHOUT an operator running a verb by hand, then row 3.6 is reachable on its
    own stated case and there is no tension to rule on — the composition already resolves itself and
