  note: |
    THIS IS THE PROMOTE-TO-INSTRUMENT THE PROPOSAL WAS REACHING FOR, built against observed evidence
    rather than an activity count. The rule stays prose; what changes is that its central question —
    has the separated population ever been observed — becomes a command instead of a dig repeated by
    hand, badly or not at all. Seven shards cite one measurement; after this, none of them has to.
    depends_on W1-T4271 IS A REAL DEPENDENCY AND ALSO A SERIALIZATION. Real: the census is defined over
    ACTIVITY-kind signatures, which W1-T4271 introduces, and its output is the evidence that could later
    promote one back to VIOLATION. Serialization: both edit `src/lib/rule-efficacy.ts`, and the
    pre-dispatch overlap check would serialize them regardless, so the edge makes the order explicit
    rather than incidental.
    risk:high, BOTH READINGS RECORDED. Rule 19's SPAN scores `files:` as two stems (`rule-efficacy`,
    `bound-fire-outcome`) and decomposing is wrong — a census cannot ship without the positive control
    that proves its join could see the corpus, which is the whole difference between this and the
    figure it replaces. BLAST RADIUS is bounded: read-only over the ledger union, no bound's value
    moves, no emission changes, and the census draws no verdict of its own.
    verify:auto — the join, the episode collapse and the control are functions over fixture ledgers
    with the remote read injected at the same seam `resolveLedgerUnion` already uses; nothing spawns
    and no live host is required.
    PROOF NOTES: the five `unit test:` proofs use the PURE-PATH form naming a file this shard's own
    `files:` declares; the grep forward-references a new identifier into an EXISTING file, the
    no-third-option form.
