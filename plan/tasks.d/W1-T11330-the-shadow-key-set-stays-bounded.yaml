- id: W1-T11330
  title: "The shadow comparator's streak key set stays bounded by the keys sampled within the last day, instead of growing by every raw request key (snapshot cursors included) until a real diff, so the plain inbox counter's 919,723 stored keys and the 382 MB shadow store stop growing and loads stop GROUP-BY-scanning them"
  repo: remudero
  depends_on: [W1-T11329]
  priority: 0.8
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern, the lifetime of a shadow streak's key membership; it spans the comparator that records keys and the store that loads and counts them
  origin: operator-session#serve-cpu-profile-2026-11-04
  plan_refs:
    - W1-T5362
  files:
    - src/lib/view-shadow.ts
    - src/lib/view-shadow-store.ts
    - test/console-api/read-model/the-shadow-key-set-stays-bounded.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: A streak's key membership retires a key that has not been sampled for a full day, so a stream of distinct one-off request keys (new snapshot cursors) keeps the stored membership bounded by the keys sampled in the last day; the cadence owed by keys still requested is unchanged, and a real diff still resets the set
      proof: "unit test: test/console-api/read-model/the-shadow-key-set-stays-bounded.test.ts"
    - claim: Loading the shadow store counts each view's keys without a full GROUP BY scan of shadow_key on every load, and the first save after upgrade prunes an existing oversized membership in bounded batches
      proof: "grep: W1-T11330 criterion 2 in test/console-api/read-model/the-shadow-key-set-stays-bounded.test.ts"
  rationale: |
    MEASURED 2026-11-04 (~/Remudero-notes/serve-cpu-profile-2026-11-04.md; read-model/view-shadow.json.sqlite, read-only):
    - the store is 382 MB, and its shadow_key table holds 942,620 rows;
    - 919,723 of those rows belong to the plain inbox counter, which has 2,661,599 samples since 10-05 and no real diff since.
    The mechanism:
    - src/lib/view-shadow.ts appends every newly sampled raw request key to state.streakKeys and persists it (the "if (!keys.has(key))" push), and only a real diff resets the set;
    - inbox request keys embed a snapshot cursor, so every new snapshot mints new keys forever;
    - src/lib/view-shadow-store.ts runs "SELECT view, count(*) … FROM shadow_key GROUP BY view" over the whole table when it loads without an active-qualification filter.
    In the live profile, worker 7 spends 10.9% in withWriteTransaction and 6.1% in saveShadowCounter.
  design: |
    Record each key's last-sampled ms in shadow_key: a migration adds the column, defaulting to the load time. On save, delete keys unsampled for more than a day, in bounded batches. Keep per-view key counts in shadow_counter's state, or a small count table, instead of GROUP BY on load.
    Test against a real store in a tmp dir:
    - 10,000 one-off keys sampled across simulated days stay bounded;
    - a key re-sampled daily stays;
    - a real diff empties the set;
    - loading does not scan the whole table, checked with EXPLAIN QUERY PLAN for an index-only plan.
  falsifier: |
    At origin/main a shadow streak's key membership only grows until a real diff, and each load GROUP-BYs all of shadow_key.
  note: |
    reservation hand-off: plan-file-1793804074000 -> plan-file-1793804074000. Reserved with rmd next-task-id --branch plan-file-1793804074000 from the operator session's ops worktree. Evidence was gathered live with the operator's approval (a SIGUSR1 inspector CPU profile of serve, plus read-only reads of read-model/view-shadow.json.sqlite) and is recorded in ~/Remudero-notes/serve-cpu-profile-2026-11-04.md. W1-T11328, W1-T11329 and W1-T11330 all edit src/lib/view-shadow.ts, so depends_on chains them to keep parallel builds off one file.
