- id: W1-T9039
  title: "A DRAFTED TASK IS LINTED WITH THE PUSH FLOOR'S REPO FACTS BEFORE IT IS CACHED READY — the draft and approve floors lint without the base facts lint-plan --base supplies, so call-site, blocked-task-disposition and proof-grep-already-true fire only at the plan-PR preflight after the shards are written: 26 approve pushes refused since 2026-10-08, and no inbox approve has opened a plan PR since 2026-10-08T03:42Z"
