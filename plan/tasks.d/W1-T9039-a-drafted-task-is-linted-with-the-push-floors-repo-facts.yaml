  falsifier: |
    Leave the draft options without `moduleExists`, and the first test reads no violation for a draft that adds
    src/lib/ledgerCaller.ts proven only by a grep of itself, as ledgerRowActor's cached draft reads clean today. Leave
    `blockedDisposition` out and skip the status normalization, and a draft shaped like W1-T5060's (two tasks at
    `status: blocked`, no retirement) is cached READY and then refused by the push preflight, as at 06:56:57Z.
    Normalize a task that declares a legal retirement, and the declared-retirement case fails.
