    - claim: "a drafted task at status blocked with no retirement is cached as queued and lints clean"
      proof: 'grep: test("W1-T9039: a drafted blocked task is cached queued" in test/a-drafted-task-is-linted-with-the-push-floors-repo-facts.test.ts'
    - claim: "a stored draft held only on its blocked status is ready on the next pass without a redraft"
      proof: 'grep: test("W1-T9039: a stored blocked draft becomes ready without a redraft" in test/a-drafted-task-is-linted-with-the-push-floors-repo-facts.test.ts'
    - claim: "a draft dirty only on a sizing violation the approve repair fixes is classified ready"
      proof: 'grep: test("W1-T9039: a draft the approve repair fixes is not held not ready" in test/a-drafted-task-is-linted-with-the-push-floors-repo-facts.test.ts'
    - claim: "the approve relint refuses what the draft lint refuses, with the same repo facts"
      proof: 'grep: test("W1-T9039: the approve relint applies the draft floor repo facts" in test/a-drafted-task-is-linted-with-the-push-floors-repo-facts.test.ts'
    - claim: "the shared draft lint passes the blocked-disposition base fact"
      proof: "grep: blockedDisposition: { baseTask: undefined } in src/lib/inbox.ts"
    - claim: "the redraft guidance names the already-true grep check"
