- id: W1-T3208
  title: "EXCLUDE A GREP PROOF'S OWN CRITERION LINE FROM ITS MATCH SET — 167 of 168 self-naming proofs certify themselves because the pattern is by construction a substring of the line carrying it, and the anchoring fixes are all blocked by proof-grep-safety"
  repo: remudero
