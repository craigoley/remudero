  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/settings.test.ts`, declared in `files:` and already existing.

    `risk: high` IS RULE 19'S SPAN. `files:` names two stems. The blast radius is one guard module
    and its suite — but the band is honest for a second reason: criterion 2 is the one that decides
    whether this task closes anything. A parser that silently returns an empty set and passes
    reproduces the exact defect being fixed, one layer down, and would be indistinguishable from
    success on the day it mattered.

    THE TWO ALTERNATIVES WERE MEASURED, NOT ASSUMED, AND BOTH ARE CLOSED. The runtime object is not
    exported (29 exports, none matching `/[Ss]chema/`, control `query` present). The type-level map
    is vacuous: `SandboxSettings` resolves — assigning `keyof SandboxSettings` to `number` errors
    TS2322 — but a bogus string assigns to `keyof SandboxSettings` cleanly, so the key type has
    widened to `string`. That was falsified in BOTH directions, by removing a member and by adding
    a bogus one; both compiled at exit 0 under the project's own `tsconfig.json`. Recorded because
    a future reader will otherwise propose the type-level map as the obvious clean fix, and it
    would ship a check that cannot fail.

