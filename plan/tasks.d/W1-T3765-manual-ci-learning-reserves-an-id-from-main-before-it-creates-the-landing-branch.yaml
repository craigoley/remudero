    cannot match the later filing branch. The command catches that refusal as a best-effort landing
    failure, so the operator receives exit 0 and the draft is never staged.

    The landing destination is already deterministic: `CI_LEARNING_LANDING_BRANCH`. Reserve with
    that actual future filing branch as the anchor identity, while retaining the existing remote
    atomic reservation, collision advance, and fail-closed transport behavior. Do not weaken the
    general prohibition on reservations made from main.
