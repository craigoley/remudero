  rationale: |
    OBSERVED at cd33f6fcd1ad689d4e627a9f64e8e3c3132d349f on 2026-09-18. The exact
    W1-T3542 control runs `ciLearningCommand(["--force"])` on a checkout whose branch is main.
    It returns success but leaves zero files in `state/ci-learning-pending`.

    The causal chain is direct. `ciLearningCommand` at `src/run-task.ts:19228` creates its minter
