  design: |
    MEASURE FIRST: no change to the daemon, the deployer or any deploy/ script.
    1. scripts/core-boot-causes.mts: a pure `classifyCoreBoots(rows)` and a CLI over the ledger union (the existing
       ledger-union reader, all three forms, with a per-form file count as the coverage control). Each daemon.boot
       gets one cause: in-container after a freshness, heap or memory exit; new container after a deploy.kickstart
       (with its drain_handoff recycle kind); new container with only a recycle.checkout_placement row; new
       container with no recycle row. For each new container it also reports the outgoing run's last freshness
       decision (action, reason, age) and whether a latch drain was open, and flags a boot under 30 min after the
       previous one. Output: per-boot rows and per-day counts.
    2. docs/research/core-container-recycles.md: the measured table (window, method, newest row), a read of every
       caller of recycle-container.sh and whether it leaves a ledger row naming itself, the 10-17 freshness/recycle
       coincidences resolved or left open, and "## Smallest change": options for one recycle absorbing a pending
       freshness restart (e.g. a recycle that finds a latched freshness restart takes its drain and supersedes it; a
       freshness restart whose advance is an image input waits for the recycle) and for naming the unledgered caller.
       Every constant (how close a recycle must be to absorb, how long a freshness restart may wait for one) is listed
       as an OPERATOR DECISION, not chosen.
    3. TESTS in test/every-core-boot-is-attributed-to-its-trigger.test.ts on fixture rows, `test(` titles verbatim
       as in the proofs.
