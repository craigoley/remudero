      lifetimes the freshness exit and a container recycle are the same event, but which one caused the other is
      unknown. The 13:28Z and 14:52Z exits the same day stayed in-container.
    - Back to back: 14 of the 36 came less than 30 min after the previous boot; 11 of them 1.2–14.4 min after an
      in-container freshness self-restart (one merge restarting the process, then recycling the image). The hand-fix
