  falsifier: |
    Keep the argv as the key: the two filters make two upstream calls and the first test fails.
    Key a field file by its path: the second read is hit-fresh with the first query's answer and the second test fails.
    Drop the repository from a placeholder read's key: the second repository gets the first one's answer and the
    third test fails.
    Leave gh's cache directory in place on invalidation: the read after a write replays the stale body and the fourth
    test fails.
