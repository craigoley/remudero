- id: W1-T10310
  title: "THE READ BROKER'S CACHE KEY IS THE ARGV, NOT THE REQUEST — two `--jq` filters on one URL each go upstream, while two different queries in one `-F query=@file` path, or one `repos/{owner}/{repo}` URL read from two repositories, share one entry and the second caller gets the first caller's answer; key on the request gh sends, and let gh itself filter the shared body"
  repo: remudero
  depends_on: [W1-T10279]  # fixes the key W1-T10279 (#13204) built; the write rule it relies on landed in #13248
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: medium  # Rule 19: one concern, what one brokered read is keyed and cached on; pacing, routing and writes are unchanged
  band_meaning: span
  priority: 2  # two of the three cases serve a WRONG answer today; the third wastes an upstream call per filter
  status: queued
  attempts: 0
  origin: "operator session 2026-10-20: an agent measured two reads of one URL with different --jq going upstream twice"
  plan_refs: [W1-T10279, W1-T10302, W1-T3275]
