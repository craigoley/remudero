  design: "(i) THE COLLISIONS ARE REAL, NOT BOOKKEEPING — AND THIS IS THE FINDING THAT MATTERS,
    BECAUSE IT KILLS THE CHEAP FIX. Over-declaration is real but it is in the WRONG PLACE to help.
    RE-COUNTED over ten trailered merges at fb49c2f0 (GitHub + the plan tree, host-independent):
    **16 of 55 declared paths untouched = 29%** — the same rate the commissioning brief measured on a
    different sample (13 of 45). BUT THE SPLIT IS DECISIVE: **13 of those 16 are TEST files.** Declared
    `src/` paths are touched **15 of 17 (88%)**, and on the hot files themselves `src/run-task.ts` is
    4/5 and `src/lib/review.ts` 1/1.
    **SO TRIMMING DEFENSIVE `files:` RECOVERS PARALLELISM ONLY AT THE MARGINS.** It would not have
    unblocked the two deferred lanes, because their collisions are on source files those tasks
    genuinely edit. Anyone proposing a `files:` audit as the remedy should be shown this line first.
    (ii) THE CENSUS, AND A CORPUS TRAP THAT ALMOST PRODUCED A FALSE CORRECTION. On THIS host (the
    mini) `dispatch.serialized` has **30 distinct rows** spanning 2026-08-05..2026-08-12 (10 on 08-05,
    2 on 08-06, 18 on 08-12), all `reason: file-overlap`, over 20 distinct task pairs. Parsed from the
    `paths` array rather than grepped: **`src/run-task.ts` in 21 of 30 (70%)**, `src/lib/escalate.ts`
    4, `test/escalate.test.ts` 4, `src/lib/status.ts` 4, and `src/lib/review.ts` and `src/lib/sweep.ts`
    in **ZERO**. Positive control on the same corpus: `sweep.pass` 1,897; negative control: a
    non-existent path matches 0.
    **THE AZURE CENSUS REPORTS THE SAME TOTAL — 30 — AND A DIFFERENT POPULATION** (`review.ts` 15,
    `run-task.ts` 13, `escalate.ts` 0, dated 08-10/08-11, which are days this host has NO rows for).
    Two fleets, two ledgers, one coincident total. CONSEQUENCE, AND THE SHARD OWES IT PLAINLY: the
    earlier claim of `four rows, all src/lib/escalate.ts` WAS NOT REFUTED — it is CORROBORATED here
    (4 rows, `escalate.ts`, 08-05), and the Azure `refutation` compared across corpora. A count is
    only a claim about the corpus it was taken from.
    (iii) WHETHER A SPLIT IS EVEN POSSIBLE — MEASURED, BECAUSE IT DECIDES EVERYTHING DOWNSTREAM AND IT
    IS CHEAP. The file carries ELEVEN text-bearing section banners (three more `// ──` lines are
    closers, and TWO OF THE ELEVEN ARE THE SAME BANNER TEXT — `CLI entry ... Kept tiny` appears
    twice). Assigning every top-level definition to its enclosing section gives 368 owned symbols, and
    counting identifier references that cross a section boundary (comment lines skipped) gives:
      **640 cross-section references. 128 of 368 symbols (35%) are referenced from outside the
      section that defines them.** `main`, `repoRoot` and `ledgerPathFor` are each referenced from
      SEVEN of the ten other sections; `USAGE` from six; `waitForCiGreen` and `runReview` from five.
      Exactly ONE section has no traffic in either direction, AND IT OWNS ZERO DEFINITIONS — it is a
      banner sitting above the fix-rung taxonomy, not a separable concern.
    **SO THE BANNERS DO NOT CORRESPOND TO SEPARABLE CONCERNS. THE FILE IS GENUINELY INTERWOVEN.** A
    split along the banner lines is not a filing exercise; it would have to break 640 references and
    re-home a shared foundation that seven of ten sections call. CONTROL: the three most cross-cutting
    symbols were confirmed to be real declarations in the file, not identifier noise.
    (iv) NOT IN SCOPE, DELIBERATELY AND EXPLICITLY. **THIS SHARD DOES NOT PROPOSE SPLITTING THE FILE.**
    A 19,489-line file with 254 exports is load-bearing, and (iii) shows a split is a large judgement
    rather than a mechanical one. The operator's three options — split it, re-scope tasks so fewer
    declare it, or accept one effective lane — are recorded here with their evidence and NOT ranked."
