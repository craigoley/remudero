    Root cause, OBSERVED by the operator recon of 2026-10-29 (PR #15065, W1-T10781, head 7c6f773):
    - terminalFixDesignHandoff (src/lib/sweep.ts) needs the round's fix.dispatch and its completed fix.done (fix_outcome NEEDS_DESIGN) beside the fix.needs_design row. It reads only the live ledger file.
