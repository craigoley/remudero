  design: |
    No new bound and no timer. Both changes are moved only by a change in what the lint says, or by the replay's own
    re-offer, on the fleet lane pass that already calls the replay.
    1. AN ENTRY WITH NO OUTCOME IS JUDGED ON ITS CACHED RE-DRAFT. In `replayPass`, when `ledgerOutcome` and the
       superseded check give nothing for an entry that already has `invalidatedAt`, re-lint its cached draft with
       `relintCached`. No cached draft means the re-draft is still due, so it waits as today. Clean: leave it to the
       fleet lane, as today. Dirty:
       a. its judgement (checks plus guidance fingerprint) differs from the stored `offered`, or none is stored: drop
          the draft and attempt key through the same `invalidateDrafts` call the open-outcome path uses, set `offered`
          to this judgement and write `inbox.replayed` outcome `reoffered` with the reason "violations changed" or
          "guidance changed", once per change;
       b. it equals `offered`: the re-draft under today's lint and guidance came back dirty, so record
          `redraft_not_ready` with `judged` and the violation messages as `unresolved_violations`, and escalate through
          the existing `escalate` path (one delivery per proposal per violation set).
       From then on the existing open-outcome path owns it.
    2. A RE-OFFER RELEASES THE LANE'S HOLD FROM THE DRAFT IT REPLACED. In `triageFleetLaneSteps`, a `file` decision
       whose `ts` is older than the replay entry's latest `reofferedAt` or `invalidatedAt` (read with
       `readBandMeaningReplayStore`) does not hold the proposal. That decision judged a draft the replay dropped. A
       decision made after the re-offer holds exactly as today. Proposals outside the replay store are untouched.
    Tests go in the new file test/the-band-replay-judges-a-re-draft-that-never-got-an-outcome.test.ts, with `test(`
    titles verbatim as in the proofs below. Drive `replayBandMeaningRefusals` over a fixture state dir with an injected
    `lint`: a store entry with `invalidatedAt` and no outcome whose cached draft is dirty with no `offered`; one dirty
    with an equal `offered`; one clean. Drive `triageFleetLane` with a decision store holding a `file` decision older
    than the entry's `reofferedAt`, and one newer.
