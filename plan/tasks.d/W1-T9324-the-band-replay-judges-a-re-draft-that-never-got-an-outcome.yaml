  falsifier: |
    Keep the `if (entry.invalidatedAt === undefined) toInvalidate.push(id); continue;` exit as the only path for an
    entry with no outcome, and the dirty fixture with no `offered` is never re-drafted and the pass writes no row, as
    the 10 live entries show. Escalate on the first dirty read instead of comparing with `offered`, and a draft that
    the lint change alone made dirty escalates before it was ever re-drafted under today's guidance. Release every
    `file` decision instead of only those older than the re-offer, and a proposal the lane just handed over is handed
    over again on the next pass.
