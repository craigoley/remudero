    WHY THE 10 NEVER MOVE, read on origin/main bbab8894f (symbols, not lines). In `replayPass` (src/lib/inbox-replay.ts)
    an entry with no outcome reaches only `ledgerOutcome`, which answers `refused` on a fresh `approve.error` and
    `redraft_not_ready` on an `inbox.drafted` row with `lint_clean: false`. Otherwise the loop does
    `if (entry.invalidatedAt === undefined) toInvalidate.push(id); continue;`. W1-T9041's re-lint (`relintCached`,
    `reofferReason`) runs only `if (entry.outcome)`. So an entry with no outcome is never re-linted. Two routes put the
    10 there:
      - its re-draft was written as `inbox.drafted` with `lint_clean: true` before W1-T9039 (#11338, merged 15:35Z,
        live in the draft rung by 16:50Z) added call-site and proof-grep-already-true to the draft lint: 00:16Z to
        00:57Z for MAX_STRIKES, ledgerRowActor, DAEMON-1789296090167, DAEMON-1789659915335 and W1-T5689; and after a
