        W1-T3109;
      - W1-T9041's "cleared by a lint change" re-offer at 14:25:09Z deleted the outcome without dropping the draft
        (DAEMON-1789651008429, verify-human-automate:W1-T216), and W1-T9039 then made that draft dirty again.
    The approve that does reach one of them writes `ratify.approve_refused` with `state: not_ready` (W1-T216 at
    15:41:52Z, DAEMON-1789296090167 at 18:15:32Z, both [call-site]), which `ledgerOutcome` does not read. The draft rung
