  note: "verify:auto — the whole thing asserts in-process against an injected DeployDeps with a fake
    clock and a temp state root; `runDeployCycle` is already fully seam-injected and
    test/deployer.test.ts already covers the idle gate and the ceiling.
    risk:high — NOT Rule 19 span this time: it is two files and one concern. The band is BLAST
    RADIUS. This is the code path that decides whether a merged change ever reaches the running
    fleet, and the failure directions are both bad and both quiet — leave the clear too early and
    deliveries keep being dropped invisibly; move it too far and the clock never resets, forcing a
    SIGKILL restart every cycle into `reconstructOrphan`, a path never exercised in production. That
    is why criterion 2 exists and why the falsifier is specified in both directions.
    budget_usd 45 — the edit is a few lines; the cost is the two-direction falsifier against the
    PERSISTED value (not a spy on the function) plus reading the three `clearDeferredSince` call
    sites carefully enough to move exactly one.
    WHY THIS OUTRANKS THE LANE QUESTION IT WAS FOUND UNDER: the N=3 experiment could not run because
    its own flip could not be delivered. A fleet that cannot deploy itself cannot be measured, and
    every future timing conclusion rests on this path working."
