    - claim: "restoring the bare unawaited tick() makes the ordering assertion fail — the falsifier is load-bearing"
      proof: "unit test: test/the-first-board-read-waits-for-the-first-mint.test.ts"
    - claim: "a host with no GH_APP_* names still returns armed false and waits for nothing"
      proof: "unit test: test/the-first-board-read-waits-for-the-first-mint.test.ts"
    - claim: "a mint that REJECTS does not hang the daemon — it proceeds and the failure is logged, not swallowed"
      proof: "unit test: test/the-first-board-read-waits-for-the-first-mint.test.ts"
    - claim: "the refresh timer is still armed for subsequent renewals, exactly as before"
      proof: "unit test: test/the-first-board-read-waits-for-the-first-mint.test.ts"
