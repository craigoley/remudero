  note: "verify:auto — similarity scores, refusal messages and severity routing are all
    fixture-decidable; the one judgment (the cutoff) is bound by design (ii) to a measurement the
    PR must carry, which the operator reviews like any calibration.
    risk:high — it changes what intake refuses. Too low a cutoff and it fires on the healthy
    sibling-title population (the trap design (ii) exists for); too high and it catches neither
    live recurrence class. The blocking/advisory split is the containment.
    budget_usd 70 — a small pure module, two consumer wirings, and the distribution measurement.
    PROOF NOTES: all three criteria share the forward PATH proof (the W1-T387-merged shape; the
    file is declared in files: and design (v)'s falsifier asserts the pointer message inside it).
    `possible duplicate of` deliberately echoes Stack Overflow's close-reason phrasing and stays
    the load-bearing string, asserted by test rather than by grep because the module it lands in
    does not exist at filing time — a grep at a not-yet-existing path is exec_error, measured.
    NO depends_on: strengthens W1-T419 (unsplit citation signal) but needs nothing from it."
