    - claim: "no relocated symbol changes its signature, and no call site is rewritten to accommodate the move"
      proof: "unit test: test/cli-plumbing-extraction.test.ts"
    - claim: "the layering rule still refuses a core module that reaches back to the entrypoint, and the cycle count does not rise"
      proof: "unit test: test/cli-plumbing-extraction.test.ts"
