- id: W1-T2260
  title: "FOUR LOCALLY-DECLARED CLI SYMBOLS PIN THE MONOLITH TOGETHER AND NO IMPORT SCAN CAN SEE THEM — an extraction plan built from a dependency graph reads imported bindings, these are declared in the file being emptied, and the compiler refuses before the cycle exists to be detected"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  rationale: |
    **MEASURED BY BUILDING AN EXTRACTION AND LETTING `tsc` ADJUDICATE, NOT BY READING IMPORTS.**
    Moving the branch-reaper cluster out of `src/run-task.ts` produces exactly four type errors, all
    inside `reapBranchesCommand`, and all four resolve to symbols DECLARED IN `run-task.ts` ITSELF.
    Re-derived on this head:

      symbol             declared at         in-code refs   present in src/lib
      repoRoot           run-task.ts:1195     165            0
      resolveOwnerRepo   run-task.ts:1203      57            0
      unknownArgError    run-task.ts:23429     44            0
      commandSyntax      run-task.ts:27159     17            0

    **NONE OF THE FOUR EXISTS ANYWHERE IN `src/lib/`.** The declaration lines match the operator's
    reading exactly. The COUNTS differ and the measured ones are used: the brief's 219 / 52 / 48 / 18
    are raw token occurrences; excluding comment and doc-comment lines the figures are 165 / 57 / 44 /
    17. The two arg-parsing counts are within one of each other; `repoRoot` diverges most because 58
    of its 223 raw occurrences are inside prose comments explaining why it is module-level.

    **Q1 — TWO CONCERNS, BUT NOT TWO SYMMETRIC MODULES, AND THE ASYMMETRY IS THE ANSWER.**

    REPO-LOCATION PLUMBING, 222 in-code references, is genuinely one cluster and is internally
    coupled: `resolveOwnerRepo` shells `execFileSync("git", ["-C", repoRoot, ...])`, so it cannot move
    without `repoRoot`. **AND IT IS THREE SYMBOLS, NOT TWO** — `repoRoot` is initialised by
    `resolveRepoRoot(process.argv.slice(2), process.cwd())`, and `resolveRepoRoot` is ALSO declared in
    `run-task.ts` and ALSO absent from `src/lib/`. A plan that moves two symbols discovers the third
    at compile time, exactly as this task's own measurement discovered the four.

    ARGUMENT-PARSING PLUMBING, 61 in-code references, **DOES NOT HOLD TOGETHER AS A PAIR.**
    `unknownArgError` is already `export`ed and depends on nothing local — it is separable today.
    `commandSyntax` is not: it calls `commandSpec(name)`, which reads the `COMMANDS` registry, and
    that registry IS the CLI's identity. So the honest decomposition is ONE cluster of three
    (repo-location), ONE separable symbol (`unknownArgError`), and ONE anchored symbol
    (`commandSyntax`) — not two tidy modules.

    **Q2 — THE HEADLINE CALL-SITE NUMBER IS MISLEADING, AND A RE-EXPORT STILL DOES NOT SAVE IT.**
    A pure move plus a re-export changes ZERO call sites by construction, so 337 (or the measured 283)
    is not the cost of relocation. It would be the cost only of a redesign nobody is proposing. But
    two things specific to these four defeat the re-export, and they are different in kind:

    (i) **`repoRoot` IS MODULE-LEVEL STATE, NOT A FUNCTION.** It is a `const` whose initialiser reads
    `process.argv` and `process.cwd()` AT IMPORT TIME. Today that evaluation is scoped to the CLI
    entrypoint, which is the only module that legitimately owns argv. Relocating the declaration into
    `src/lib/` relocates the EVALUATION: every importer of that lib module — including a test that
    imports it for an unrelated symbol — would parse argv on import. A re-export preserves the NAME
    and not the EVALUATION LOCUS, so this is a behavioural change wearing a move's clothing.

    (ii) **`commandSyntax` IS ANCHORED TO THE REGISTRY.** Moving it drags `commandSpec` and `COMMANDS`
    into `src/lib`, or requires passing a spec in — and that is a signature change, which Q3 forbids.

    **AND THE THIRD ROUTE IS CLOSED BY AN ENFORCED RULE, NOT MERELY BY GRAPH SHAPE.** Importing these
    back from `src/lib` is not just "a cycle": `.dependency-cruiser.cjs`'s `lib-no-spike-or-cli` runs
    at **`severity: "error"`** with `from: ^src/lib`, `to: ^src/(spike|run-task)\.ts$`. A lib module
    reaching back to the entrypoint fails a REQUIRED check outright. So all three routes the operator
    named are closed, and one of them is closed by a gate that already exists rather than by taste.

    **THE DETECTION GAP IS THE GENERALISABLE PART, AND IT IS WHY THIS IS A PREREQUISITE.** A pre-move
    dependency scan enumerates IMPORTED BINDINGS. These four are DECLARED in the file being emptied,
    so they carry no import statement and appear in no import graph — the scan reads clean and the
    move still fails. `depcruise` cannot cover the gap either: the compiler refuses before any cycle
    exists to be detected, so there is nothing for a cycle rule to see. **ANY FUTURE EXTRACTION PLAN
    DERIVED FROM AN IMPORT GRAPH WILL HIT THIS THE SAME WAY**, which is why the remedy is to relocate
    these declarations FIRST rather than to discover them once per attempted extraction.

    **Q3 — WHAT MUST NOT CHANGE.** NO SIGNATURE CHANGES AND NO REDESIGN: this relocates declarations,
    it does not improve them. `unknownArgError` keeps its four-parameter shape, `resolveOwnerRepo`
    keeps returning `{owner, repo}`, and nothing gains a config object or an injectable seam as part
    of this work. **AND THE CYCLE COUNT MUST NOT RISE.** Baseline on this head, by traversing the
    import graph directly: 15 back-edges resolving to 14 canonical module-sets across a 22-module
    knot, with `src/run-task.ts` ITSELF inside that knot — confirmed, not assumed. The operator's 40
    paths reducing to 24 canonical is the same structure counted in dependency-cruiser's units rather
    than in back-edges; the 22-module figure is common to both and is the one to hold. A relocation
    that lowers the count is a bonus; one that raises it has failed regardless of what it tidied.
