  note: |
    **WHY THE PROOF PATH DOES NOT EXIST YET, AND HOW THE FALSIFIER DISCRIMINATES.**
    `test/cli-plumbing-extraction.test.ts` is absent from the tree, and `files:` is a BARE SINGLE-LINE
    list so `SHARD_FILES_LINE_RE` matches and the forward-reference exemption applies — a block-style
    list would silently forfeit it. **A NON-EXISTENT CONTROL PATH DOES NOT DISCRIMINATE**: it reads
    `hits: 0` and `verdict: fail` exactly as the declared target does, so it proves nothing. The
    discriminating control is an EXISTING path, which resolves to real tests while the declared one
    cannot.

    **`files:` IS DRAWN AGAINST THE DEFECT.** The four declarations all live in `src/run-task.ts`, so
    that file is where the relocation is performed regardless of where the symbols land. The
    destination modules are not enumerated because naming files that do not exist would be a guess,
    and an under-drawn declaration confines a fix (#2519) as surely as an over-drawn one invites
    scope creep.

    **RISK BAND — BOTH READINGS.** SPAN: `files:` crosses `src/` and `test/`, so Rule 19's span reading
    is `high`. The band EXEMPTS the sizing check rather than clearing it — `sizingViolation` returns
    `undefined` outright at `high` — so a clean lint is not evidence the span was vetted. BLAST RADIUS:
    wider than a typical relocation, because `repoRoot` alone carries 165 in-code references and its
    initialiser reads process state at import time. That is the whole reason this is filed as a
    prerequisite rather than folded into an extraction.

    **THE FALSIFIER.** Falsified if a relocation lands and a subsequent extraction attempt still
    produces locally-declared-symbol errors — that would mean the set was larger than four and the
    measurement was taken too narrowly. Also falsified if any relocated symbol's signature changed, if
    any call site was rewritten, or if the canonical cycle count rose above its baseline.

    **MEASUREMENT PROVENANCE.** Host `vm`, `/usr/bin/bash`, uid 0. Scratch worktree at a fresh path,
    `HEAD == origin/main` proven by sha, `--is-shallow-repository` false (2182 commits) checked before
    any history query, removed after. `src/run-task.ts` is 1,542,304 bytes — over the Contents API's
    1 MB cap, where it returns an empty body that greps to a clean zero — so every figure came from
    the sha-proven worktree, never that API. Fetched `refs/rmd-id/*` verified at 379 local against 379
    remote BEFORE sweeping. Declaration lines were read BY LINE NUMBER, not from grep output.

    **ID PROVENANCE — UNUSED, NOT OWNED.** The reservation ref exists against a namespace of 379; its
    anchor was deliberately NOT checked, since the id was minted by the operator and its anchor cannot
    match this host. What was verified is that the id is UNUSED on all eight surfaces, each control
    pre-qualified on its own surface: reservation ref 1 of 379; shard filenames 0 (control `W1-T2241`
    = 1); `- id:` lines 0 (control = 1); open-PR titles 0 (control `W1-T` = 1 across 5 open PRs);
    open-PR head branches 0 (control `run-*` = 87); open-PR file lists 0 across 5 of 5 heads
    enumerated and captured, control 8 file entries; anchored merged trailers 0 (control `W1-T2235`
    = 1); merged subjects 0 (control `(W1-T2241)` = 1 across 2182). THE SUBJECT WAS SWEPT TOO:
    `locally-declared` and `extraction.*prerequisite` read 0 across `plan/tasks.d/`, and the six shards
    mentioning `unknownArgError` were each opened and are unrelated tasks that merely name the symbol —
    against a control of 386 shards mentioning `run-task.ts`. Nothing is already filed.
