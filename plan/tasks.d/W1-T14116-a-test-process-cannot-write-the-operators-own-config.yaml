  rationale: |
    WHY: a test run overwrote the real Remudero config on the Azure host twice in five days. Host-side
    rmd commands (claims, id reservation, lane checks) read that file, so each clobber breaks the host
    until someone restores it by hand.
    OBSERVED, read-only, on the Azure host (account craigoleyagent):
    - 2026-11-21T03:00:42Z: ~/.config/remudero/config.json became
      {"root":"/tmp/rmd-ops-offer-offer-default-axpjhv","claudeBin":"/bin/true"} (kept as
      config.json.clobbered-20261121). /tmp/rmd-ops-offer-offer-default-F7XgoH (02:57Z) and -axpjhv
      (03:01Z) are the tmp(`offer-default`) roots of offeredRun() in
      test/github/a-run-child-for-an-ops-task-starts-with-the-parents-verified-ops-blobs.test.ts
      (W1-T13691, #19452). The dirs are in /tmp itself, not under a per-run TMPDIR.
    - The runs: a hand builder in /mnt/scratch/rmd/hand/wt-19691 (W1-T13785) ran
      `node --import tsx --test --test-concurrency=4 ...` at 02:55:20Z and
      `node --import tsx --test test/github/a-run-child-for-an-ops-task-...test.ts` at 03:00:01Z.
      Neither passed `--import ./test/setup/tmp-hygiene.ts`. The author preflights in wt-19691 and
      wt-19871 at that time did not run the test (wt-19871's stopped at census-precheck at 02:59:06Z;
      wt-19691's started 03:03Z), and every repo runner (package.json test scripts, ship.sh quick mode,
      census-precheck, review.ts, ci-parity.ts) passes the setup.
    - 2026-11-16T21:03Z: the same thing (config.json.clobbered-20261116), from a bare `npx tsx --test`
      of test/github/a-run-child-reads-the-instance-registry-its-daemon-read.test.ts (W1-T13179).
    CAUSE, in code on origin/main:
    - The tests write the file themselves: `writeFileSync(configPath(), JSON.stringify({ claudeBin:
      "/bin/true", root }))` (ops-blobs test lines 400, 480, 530; registry test line 105;
      installation-share test line 91). configPath() (src/lib/config.ts) is
      join(homedir(), ".config", "remudero", "config.json") and has no guard.
    - These tests rely on test/setup/tmp-hygiene.ts to set process.env.HOME to a scratch
      rmd-test-home-* dir. A bare `node --test` or `npx tsx --test` does not load it, and nothing in
      the repo can force it: Node 24 reads no default config file without a flag, and NODE_OPTIONS is
      not set by the repo.
    - src/lib/live-write-guard.ts already guards the ledger the same way (W1-T4923/W1-T6029:
      assertLedgerPathNotLive uses NODE_TEST_CONTEXT, which the runner sets however it is invoked,
      and operatorHomeFrom, which a HOME redirect cannot move), but nothing guards the config file.
    CENSUS (rough, origin/main): 27 test files call configPath(); 9 write it; 6 of those 9 set
    process.env.HOME themselves; the 3 that do not are the files in this task. 2 test files build the
    path by hand (join(homedir(), ".config", ...)) and both set HOME. Production writers of the file
    (loadConfig's first-run create, `rmd init`) all go through configPath().
  design: |
    INVARIANT no-test-writes-the-operator-config: no process running node's test runner, however it was invoked, can resolve configPath() to the account home's config.json.
    INVARIANT one-resolver-guards-every-path: the refusal lives in configPath(), the one resolver every reader, writer and test uses, so no caller has to remember it.
    CHOICE: guard the resolver, not the invocation. Making every invocation load tmp-hygiene is not
    possible: a builder can always type a bare `node --test` or `npx tsx --test`, and both incidents
    were exactly that. A guard in configPath() fails loudly in that case and writes nothing. Rejected:
    - Only loading the setup through package.json or a runner config: the incidents bypassed both.
    - Refusing only when HOME is outside os.tmpdir(): tmpdir and HOME are both under the test's
      control, and on the host TMPDIR was /tmp; comparing with the account home is exact.
    - A new env var to name the account home: it would be a switch that turns the guard off.
    1. src/lib/live-write-guard.ts: add "instance-config" to LiveWriteBoundary and a message branch for
       it in LiveWriteBlockedError ("REFUSED instance-config under the node test runner — <detail>.
       This run did not give the test a scratch HOME; run it with --import ./test/setup/tmp-hygiene.ts
       or set HOME in the test"). Export
       assertConfigPathNotLive(path, env = process.env, { operatorHome = () => operatorHomeFrom(osUserInfo, HOME_AT_LOAD), argv1 = process.argv[1] } = {}).
       It returns when neither isTestRunner(env) nor a basename(argv1) matching /\.test\.[cm]?[jt]sx?$/
       holds. Otherwise it compares canonicalCandidate(path) with
       canonicalCandidate(join(operatorHome(), ".config", "remudero", "config.json")) and throws
       LiveWriteBlockedError("instance-config", "W1-T14116: <path> is the operator's own config")
       when they are equal. RMD_ALLOW_LIVE_WRITES does not exempt it (as ledger-append). No new env
       var, constant or config key.
    2. src/lib/config.ts: configPath() builds the path as today, calls assertConfigPathNotLive(p) and
       returns p. config.ts gains one import of ./live-write-guard.js; live-write-guard.ts imports no
       repo module, so no cycle.
    3. The three test files: at module top, mkdtemp a `${RMD_TMP_PREFIX}<name>-home-` dir, save
       process.env.HOME, set HOME to the dir, and restore and remove it in the existing after(). Add a
       one-line comment naming W1-T14116. Their spawned children already take {...process.env}, so
       they inherit the scratch HOME. No other change to their assertions.
    4. Tests in test/live-write-guard.test.ts (it already holds the ledger-append guard tests), titled
       "W1-T14116 criterion N: ...". Criteria 1 and 2 call assertConfigPathNotLive with an injected
       operatorHome (a scratch dir), env and argv1. Criterion 3 mocks os.userInfo with
       t.mock.method(os, "userInfo", ...) and calls syncBuiltinESMExports(), then restores both.
       Criterion 7 is a static scan of test/**/*.test.ts. No test may set HOME to, or compare
       against, the real account home: never test this guard by writing the real config.
    Hosted CI loads tmp-hygiene (HOME is a scratch dir), so the guard never fires there; a suite that
    fails after this change was reading the account home's config and must get a scratch HOME.
  falsifier: |
    At origin/main configPath() has no guard: criterion 3 finds S/.config/remudero/config.json
    written. Guard only on NODE_TEST_CONTEXT: criterion 1's argv1 *.test.ts case with an empty env
    does not throw. Compare with the current HOME (homedir()) instead of operatorHomeFrom: every
    test's scratch path then equals the compared path, so criterion 2's scratch-HOME control throws.
    Let RMD_ALLOW_LIVE_WRITES exempt it: criterion 1's override case does not throw. Leave any of the three test files without its HOME line: criterion 7 names it.
