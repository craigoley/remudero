- id: W1-T2704
  title: "PROVIDER ROUTING EXISTS ONLY IN WORKER STDERR — `worker.provider.selected` records Claude and Codex windows, the selected provider, concrete Codex model and effort, but no durable reader or console surface exists, so the operator cannot see which subscription has headroom or why routing stopped"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 55.00
  files: [src/lib/provider-routing-status.ts, src/lib/worker.ts, src/run-task.ts, src/lib/serve.ts, test/provider-routing-console.test.ts]
  origin: "operator-session#console-provider-routing-2026-09-02"
  plan_refs: ["W1-T2572", "W1-T2573", "W1-T2577", "W1-T2592", "W1-T2434", "W1-T2660"]
