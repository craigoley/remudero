      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "a successful multi-provider selection atomically publishes the exact capacities, selected provider, concrete Codex model and effort already used by the worker"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "an all-providers-blocked selection publishes the refusal before preserving and throwing the selector's original error"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "snapshot failure never changes routing or worker outcome, and the legacy single-Claude spawn path performs no new capacity probe"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "the fixed snapshot is bounded and redacted, and absent, malformed, unreadable, not-probed and stale states never render as zero or healthy"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "the real read-scoped route and console panel render provider windows, reset, reserve, selected model/effort, refusal and as-of from `fleetControlRoot`"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "the production console calls the shared provider-routing snapshot reader rather than leaving the new module reachable only from tests"
      proof: "unit test: test/provider-routing-console.test.ts"
    - claim: "the console neither invokes provider capacity readers nor receives new provider credential or durable-config mounts"
      proof: "structural assertion: test/provider-routing-console.test.ts"
  falsifier: |
    Close without implementation if current main has a bounded durable provider-routing state
    under the shared fleet root and the real console renders both providers' last capacity
    observation, selected concrete model/effort, refusal, as-of and staleness. Transient stderr,
    after-call ledger attribution, or the Anthropic-only account strip does not falsify the task.
