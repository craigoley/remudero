- id: W1-T2970
  title: "THE LEARNING RUNG DRAFTS SHARDS IT HAS NO PATH TO FILE — ciLearningCommand prints every draft and writes nothing, and the separate operator step its comment names does not exist as a command, so a daily loop's whole output is a screenful an operator must retype; give it a filing path that judges each draft and stamps the ruling on the record"
  repo: remudero
  depends_on: [W1-T2969]
  type: implement
