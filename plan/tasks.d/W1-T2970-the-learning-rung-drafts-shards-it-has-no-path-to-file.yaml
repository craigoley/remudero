      proof: "unit test: test/a-drafted-shard-is-filed-only-with-its-ruling.test.ts"
    - claim: "one firing never files more than the existing mint ceiling and every excluded finding is named in the report rather than dropped"
      proof: "unit test: test/a-drafted-shard-is-filed-only-with-its-ruling.test.ts"
    - claim: "a finding whose deterministic pr and gate id already names a shard on disk is refused rather than filed twice, so a re-run after a partial failure cannot double-file"
      proof: "unit test: test/a-drafted-shard-is-filed-only-with-its-ruling.test.ts"
    - claim: "the report-only path remains reachable by name and writes nothing, so the operator can see the loop before it files"
      proof: "unit test: test/a-drafted-shard-is-filed-only-with-its-ruling.test.ts"
    - claim: "every filing writes a ledger line naming the finding, the ruling and the resulting verify level"
      proof: "unit test: test/a-drafted-shard-is-filed-only-with-its-ruling.test.ts"
  falsifier: |
    Close without implementation if ciLearningCommand already writes plan records, or if W1-T2969
    is withdrawn and Law 5 stays unconditional — with an unconditional gate every filed record
    parks, and the filing path buys nothing a report does not. A path that files without a ruling,
    or that drops a finding the ceiling excluded, does not satisfy this task.
