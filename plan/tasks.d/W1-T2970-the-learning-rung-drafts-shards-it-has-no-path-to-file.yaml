  rationale: |
    THE RUNG'S OUTPUT HAS NO CONSUMER BUT A HUMAN'S EYES. `ciLearningCommand` (src/run-task.ts)
    states it plainly: "REPORTS THE DRAFTS; DOES NOT WRITE THE PLAN … Filing is deliberately a
    separate operator step". That separate step is described in prose and shipped nowhere — there
    is no verb, no flag and no path that turns a draft into a shard. So the daily rung W1-T2959
    paced can, at best, print findings an operator must transcribe by hand, which is the
    "correct code that nothing calls" shape this plan has now named repeatedly.

    THE SAFETY ARGUMENT FOR REPORT-ONLY WAS SOUND AND IS NOW SUPERSEDED. The comment's reasoning —
    "a rung that both concluded and committed would be that argument's only weak point" — held
    while Law 5 was unconditional, because a filed record could only ever be parked. W1-T2969
    replaces that binary with a judged one, so the question is no longer whether a machine may
    write into the plan but under what ruling. This task is the writer; W1-T2969 is the gate it
    must satisfy, which is why it depends on it and must not land first.

    THE CEILING AND THE IDEMPOTENCY KEY ARE ALREADY BUILT. The rung caps a firing at
    `CI_LEARNING_MINT_CEILING` drafts "as a PRIMARY control", NAMES every finding the ceiling
    excluded rather than dropping it, and keys idempotency on a deterministic pr+gate id. A filing
    path inherits all three rather than inventing bounds, so a loop that runs daily cannot flood
    the plan and cannot file the same finding twice.
  design: |
    (i) THE JUDGE RUNS ONCE PER DRAFT, AT FILING TIME. Each draft's change shape is passed to
    `assessRisk` (src/lib/risk-judge.ts) through the deps seam the rung already uses, and the
    returned `{verdict, reasons, confidence}` plus `planRiskJudgeAction`'s kind is stamped onto the
    record as W1-T2969's `risk_ruling`, pinned with `canonicalRiskJudgeInputKey`. The judge is
    INJECTED, so every test drives a fake and no suite spends money or opens a socket.

    (ii) A JUDGE THAT CANNOT ANSWER STILL FILES — AT `verify: human`. assessRisk falls back to
    escalate on spawn error, timeout or an unparseable response, and an escalate ruling means the
    record is filed parked, exactly as today. The loop therefore degrades to its current behaviour
    rather than to silence: the operator still gets the finding, they just get it parked.

    (iii) THE CEILING IS A FILING CEILING, NOT ONLY A DRAFTING ONE. `CI_LEARNING_MINT_CEILING`
    bounds what one firing may WRITE, and every finding above it is named in the report rather than
    dropped — the existing control, now load-bearing against a path that persists.

    (iv) IDEMPOTENCY IS CHECKED AGAINST THE PLAN, NOT ONLY THE MARKER. Before writing, the rung
    refuses a draft whose deterministic pr+gate id already names a shard on disk, so a re-run after
    a partial failure cannot double-file.

    (v) `--dry-run` KEEPS TODAY'S BEHAVIOUR AND IS THE DEFAULT FOR THE VERB. The operator asked to
    see the loop work before it writes; report-only stays reachable by name forever, and the
    cadence opts into filing explicitly rather than inheriting it.

    (vi) EVERY WRITE IS LEDGERED with the finding id, the ruling and the resulting verify level, so
    "what did the machine file today, and on whose ruling" is answerable from the ledger union
    without reading the plan's git history.
  acceptance:
