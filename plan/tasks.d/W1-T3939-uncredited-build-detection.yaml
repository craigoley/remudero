- id: W1-T3939
  title: "A REPORT-ONLY UNCREDITED-BUILD WARNING MUST FOLLOW THE DISPATCHER'S REFUSAL — remove stale NEEDS-ME rows for blocked tasks without hiding live queued-task detection or changing disposition"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 15.00
  risk: low
  band_meaning: blast-radius
  origin: "operator-follow-up#needs-me-stale-blocked-2026-09-21"
  plan_refs: [W1-T2392, W1-T3934, W1-T3938]
  files: [src/lib/status.ts, test/uncredited-build-detection.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on origin/main 96a76ef0 after W1-T3938's plan filing. The live status board still
    reports 26 uncredited-build rows, but 18 belong to tasks whose plan status is already
    `blocked` (including explicit retirement/withdrawal records). `src/lib/drain.ts` rejects
    every such task before dependency resolution, while `src/lib/status-board.ts` renders the
    warning as if the task remains dispatchable until a credit surface appears. That message is
    false and creates operator work without changing any decision.

    W1-T3934 correctly made the warning scope-aware; this task is the next narrow routing fix.
    The existing dispatcher refusal is the authority: suppress only the advisory projection for
    `status: blocked`, preserving the warning for queued or otherwise live tasks. Do not infer
    credit, alter task state, close PRs, or add a gate. This is a cleanup of the operator surface,
    not a new admission rule.

    The task is filed separately because W1-T3938 is already merged and its acceptance cannot be
    amended without orphaning new criteria (Standing rule 21). It therefore depends on no plan
    task and carries the implementation scope directly.
  design: |
    (i) In `deriveStatus`, leave the W1-T3934 source/scope/fail-open predicate unchanged for
    every task that is not plan-blocked.

    (ii) Skip attaching `uncreditedBuild` when `task.status === "blocked"`. This covers both
    ordinary blocked records and the existing retirement subtypes because the dispatcher uses the
    same status refusal. Do not change `projection.status`, merge credit, dispatch eligibility,
    PR disposition, or plan records.

    (iii) Add three controls: blocked plus overlapping source build is quiet; an otherwise
    identical queued task still warns; the warning remains report-only and leaves disposition
    unchanged. Retain W1-T3934's out-of-scope, overlap, and unscoped controls.
  acceptance:
    - claim: "a blocked task with an overlapping uncredited source build is quiet"
      proof: "grep: W1-T3939: blocked uncredited build is suppressed in test/uncredited-build-detection.test.ts"
    - claim: "an otherwise identical queued task still reports the overlapping uncredited source build"
      proof: "grep: W1-T3939: queued uncredited build still warns in test/uncredited-build-detection.test.ts"
    - claim: "the report-only warning remains disposition-neutral"
      proof: "grep: W1-T3939: warning remains report only in test/uncredited-build-detection.test.ts"
  falsifier: |
    Remove the blocked-status guard and the blocked control must fail. Change the guard to
    suppress queued tasks or all scoped tasks and the queued control or W1-T3934 controls must
    fail. Any change to dispatch, credit, PR state, retirement, or merge behavior is out of scope.
