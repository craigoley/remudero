    - claim: "a claim-decline hold lifts in the pass where the owner becomes reclaimable"
      proof: 'grep: test("W1-T7998: a backstop hold re-asks the owner decision and lifts when it is reclaimable" in test/a-dead-dirty-fix-owner-at-the-current-head-is-reclaimed.test.ts'
  falsifier: |
    Keep the `localSha !== remoteSha` conjunct. The current-head snapshot then still reads keep/dirty_worktree and
    the reclaim test fails, which is the 10-11 #10829 stall. Return keep for a null bound, and the no-history test
    reads keep. Leave fixDispatchHoldAtHead holding on the decline count and path alone. A ledger with three
    declines and an owner that has since become reclaimable then still returns a hold, so the backstop test fails.
