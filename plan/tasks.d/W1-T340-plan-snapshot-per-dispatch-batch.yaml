  note: "verify:auto — a mid-batch reload and two dispatch decisions, both assertable in-process.
    risk:high — it touches the dispatch hot path of the persistent loop, and the failure it prevents is
    SILENT, so a wrong fix is not self-announcing. Rule 19: one subsystem plus its test, but the
    silent-failure class is what sets the band.
    budget_usd 55 — a value capture and a comment correction; the cost is the falsifier, which must
    fail against the current code to be worth anything.
    NO depends_on: correct and provable at N=1, so it lands before lanes rather than with them. That
    ordering is deliberate — bundling it into the lane wiring would make the wiring PR carry a silent
    correctness change, which is how a regression hides inside a feature.
    THIS NARROWS W1-T326's BLOCKER (2). The entry said the invariant 'is simply false' at N>1 and would
    'break SILENTLY'. Both true. What the source adds is that only leg (b) fails, that reassignment
    (not mutation) bounds the blast radius to lanes re-reading the live binding, and that the fix is a
    value copy rather than a locking or ordering change."
