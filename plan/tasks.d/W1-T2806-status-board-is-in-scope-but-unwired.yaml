      proof: "unit test: test/status-board-operator-message.test.ts"
    - claim: "an incomplete projection marks the row and still renders it, never hides or holds it"
      proof: "unit test: test/status-board-operator-message.test.ts"
    - claim: "a checker failure cannot reach the operator, mirroring the escalation path's safe wrapper"
      proof: "unit test: test/status-board-operator-message.test.ts"
    - claim: "no existing board message text changes as a result of the wiring"
      proof: "unit test: test/status-board-operator-message.test.ts"
    - claim: "the wiring introduces no readability, length or vocabulary score"
      proof: "unit test: test/status-board-operator-message.test.ts"
