  note: |
    RISK BAND IS RULE 19'S SPAN, NOT BLAST RADIUS - AND HERE THE SPAN IS A STEM ARTIFACT. The
    linter derives concerns from file STEMS, so src/lib/status-board.ts and
    test/status-board-operator-message.test.ts read as two (status-board,
    status-board-operator-message) even though the change is one concern: a projection beside the
    board's render plus its falsifier. Decomposing would mean a test with no subject, and naming the
    test after the module's own stem would append coverage-load-bearing assertions to a shared
    suite, which the house rule refuses. Raised and recorded rather than worked around.

    THE STANDARD IS CITED, NOT RESTATED. docs/operator-message-standard.md carries the reasoning and
    the ISO 24495-1 principles; this shard names the gap and the wiring only.

    WHAT WAS MEASURED. On this tree the checker has one consumer (escalate.ts) and status-board.ts
    cites the standard zero times against nine NextActionRule references. Both figures are from the
    working tree rather than recalled.
