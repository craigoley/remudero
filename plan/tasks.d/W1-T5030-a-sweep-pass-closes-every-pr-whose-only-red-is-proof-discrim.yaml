  falsifier: |
    Delete the counter check and the first test reddens (three PRs, three closes); remove the `break` after the deferral and
    the second test reddens (the deferred PR reaches `dispatchFix`). Make the counter count only successful closes and the
    throwing-close case inside the first test reddens. The preserved-control test stays green under all three, which is what
    shows the cap binds only above 2 and leaves W1-T4957's behaviour alone at or under it.
  note: |
    bound-kind census: a name containing MAX must declare its kind, and this one does in the doc comment above the `export
