  design: |
    INVARIANT one-clock-scan-per-snapshot: the lifetime tallies of one pass read the ledger clock and each task's rows from the snapshot's index, never by a full scan per task.
    INVARIANT same-tally: the indexed tally equals today's unindexed tally on the same rows.
    INVARIANT same-failure-rule: an unavailable lifetime index still gives undefined and the live-only fallback; a missing or foreign index falls back to today's scan.
    1. Let lifetimeHistory's refresh pass the supplied snapshot's index through with its rows when the snapshot
       has one (the Pick at :25563 and :25573 widens to include index), and keep the self-read path's
       readLedgerSnapshot index too.
    2. In lifetimeAccounting().tallyFor take that index: call orphanedRunIds(rows, taskId, index), which already
       uses index.latestTsMs when index.rows === rows, and build the visible set from index.byTask for the task
       instead of rows.filter. When there is no index, or index.rows !== rows, keep today's code.
    3. Change nothing else: not the orphan rule, DEFAULT_LIVENESS_BOUND_MS, the record path, the replay window,
       effectiveLifetimeDispatches, the per-task cache at :25818, or the dispatch order. No env var, config key,
       time bound or new cache.
    4. The test builds rows in memory and a temporary ledger under a tmp HOME loaded with test/setup/tmp-hygiene.ts;
       it counts element reads with a Proxy over the rows array and reads ledgerIndexBuildCount (status.ts:1306).
  falsifier: |
    Drop the index from the orphanedRunIds call: criterion 1 counts at least one full pass per task. Build the
    visible set from the index but forget the run ids of rows without task_id handling: criterion 2 differs
    for one task. Make a foreign index trusted: criterion 3 gives a different clock and tally.
