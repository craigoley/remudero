      rows: 56.8 s of lag, max 23.3 s (03:49:05Z), about 48.8 s (6.7 percent of all lag) by inclusive share.
    - In those rows the self time of latestLedgerTsMs (caller orphanedRunIds), orphanedRunIds (caller tallyFor)
      and tallyFor is 18.2 s of samples; scaled to lag that is about 19.6 s, 2.7 percent of all lag. The rest
      of those rows is the open-head GitHub read with its blocking retry sleep, which W1-T2318 covers.
    READ at origin/main b79ad9e16d:
    - src/run-task.ts:25539 lifetimeAccounting; :25547 tallyFor; :25549 orphanedRunIds(rows, taskId) with no
      index; :25550 the visible set from rows.filter over every row.
    - src/run-task.ts:25566 lifetimeHistory; :25615-25618 its tallyFor hands accounting the supplied
      snapshot's lines but not its index.
    - src/run-task.ts:25775 the gate reads one readLedgerSnapshot per pass; :25818-25824 lifetimeCapExceededFor
      calls auditedLifetimeHistory.tallyFor(taskId, snap) once per task and caches only per task.
    - src/lib/status.ts:1080 readLedgerSnapshot returns index: buildLedgerIndex(lines); :1254 byTask; :1264
      latestTsMs; :1497 latestLedgerTsMs; :1515 orphanedRunIds; :1523 it reuses index.latestTsMs when
