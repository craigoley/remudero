  rationale: |
    WHY: each dispatch decision asks isLifetimeCapExceeded for each candidate task (src/lib/drain.ts:770, inside
    isDispatchEligible at :672). That reaches lifetimeAccounting().tallyFor, which calls orphanedRunIds with no
    index, so latestLedgerTsMs reads every ledger row to find the ledger clock, and then filters every row again
    for the task's run ids. That is two full passes over the live ledger per candidate task, on the daemon loop.
    The snapshot already carries a LedgerIndex with the clock and per-task rows, and orphanedRunIds already
    accepts it; the lifetime path does not pass it.
    MEASURED on the Azure host, 2026-11-18, one nice'd pass over the daemon.loop_stall_profile rows since the
    03:23:47Z boot (9b4f43779d; a 04:09:18Z boot at 04f6dd8235 changed none of these paths), in
    ~/rmd-state2/state/ledger.ndjson and the ledger.2026-11-18T*.ndjson.gz archives, deduplicated on ts, step
    and command: 163 rows, 725.4 s of loop lag in 62.5 minutes.
