- id: W1-T11421
  title: "A slow crash loop is reported: the daemon's crash-loop check counts abnormal exits against the instance's own learned lifetime, not more than 5 boots in a fixed 10 minutes — on 2026-11-05 core aborted on its heap limit about every 25 minutes, booted 29 times from 06:00 to 15:07Z, killed 28 of 49 review runs in flight, and the check never fired"
