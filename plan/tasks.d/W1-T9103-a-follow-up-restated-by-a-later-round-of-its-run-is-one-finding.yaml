  design: |
    No new bound and no word-overlap cutoff. A model judges sameness, and only for pairs the structure already pairs.
    Steps 1 to 3 cover a run's restatements; step 4 applies the same rule to follow-ups that share only a task id.
    1. A FOLLOW-UP'S SOURCE. For a `followup:` proposal whose id gives `findingSubject` no subject, the lane reads the
       run id and PR URL from the minted summary, in `routeFollowupsToRegistry`'s shape ("— from <task> (run <run>,
       <pr>)"). Reuse the shape `stripMintedFollowupAffix` (followup-dedup-census.ts) already parses rather than a
       second regex. Two open follow-ups with the same source and a DIFFERENT report row (the `<ts>` part of the id)
       are candidates. Entries of one report row are distinct by construction and are never compared. Follow-ups whose
       id carries a task id keep today's kind|task subject. Every other kind is unchanged.
    2. SAMENESS. A candidate pair whose texts name the same first repo path (the path rule `findingSubject` already
       applies) is one finding. Otherwise the lane asks a new `sameFinding` port in `FleetLaneDeps` whether the later
       text restates the earlier. It sends both texts with the minted affix stripped, and the answer is "same",
       "distinct" or "unavailable". The production port (run-task.ts, the `fleetLane:` deps) spawns the question
       through `benchmarkNonDispatchSpawn` on the existing `inbox-draft` lane, the lane that drafts these findings, so
       no routing row is added. The pass awaits it, as `triageFleetLaneAsync` already awaits `mergedLastDay`.
    3. ONE JUDGEMENT PER PAIR, AND A PLAIN RECORD. The verdict is kept in the lane's own store
       (`fleet-lane-decisions.json`), keyed by the ordered pair, so a pair is never asked twice. "unavailable" stores
       nothing, and both members stay unmerged this pass, as today, with a `fleet_lane.sameness_unavailable` row. On
       "same", the lane keeps the LATER report's finding, which was written with more of the run's evidence, and
       declines the earlier through the existing `decide(..., "merge", { into })` and `panel.proposal_declined` path
       with the plain merge reason. A pair where one member is already decided is not re-judged.
    4. A SHARED TASK ID IS A CANDIDATE, NOT A MERGE (operator ruling 2026-10-13). For a `followup:` proposal, the
       kind|task subject no longer merges by itself. Two open follow-ups whose ids name the same task, from different
       report rows (any run of that task), are a candidate pair, judged exactly as in steps 2 and 3: the same first
       repo path in their texts merges them with no judge call, otherwise the `sameFinding` port decides, with the
       verdict stored once per ordered pair in `fleet-lane-decisions.json`. "distinct" and "unavailable" leave both
       as separate items; on "same" the later report's finding is kept. Entries of one report row stay distinct
       here too. Other kinds keep today's subject: a non-follow-up id such as `proof-debt:<task>` is one finding per
       task by construction, and the path and codeql-quality subjects are untouched.
       Change "W1-T4089: two findings with the same subject become one task" in
       test/the-fleet-triages-its-own-findings.test.ts, citing the ruling in a comment that contains "operator ruling
       2026-10-13": its two same-task follow-ups, whose texts share no path and which no judge calls the same, now
       stay two items (no merge, and the drafted one is filed). Its same-file and different-kind assertions stay.
    Tests go in test/a-follow-up-restated-by-a-later-round-is-one-finding.test.ts, with `test(` titles verbatim as in
    the proofs below. Drive `triageFleetLaneAsync` over a fixture state dir (inbox-classified.json,
    inbox-proposals.json, inbox-drafts.json, an empty store) and ledger, with a fake `sameFinding` that records its
    calls. Use the #6382 and #6874 summaries and the one-report-row #6562 pair above as fixtures.
