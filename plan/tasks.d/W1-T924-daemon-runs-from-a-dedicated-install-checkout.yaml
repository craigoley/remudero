      proof: "unit test: test/install-root.test.ts"
    - claim: "a configuration whose state root resolves INSIDE the install root, or whose install root equals the operator checkout, is refused rather than silently accepted"
      proof: "unit test: test/install-root.test.ts"
    - claim: "arbitrary dirt in the operator checkout — untracked, tracked-modified, or a feature branch — changes neither the resolved install root nor the deploy decision"
      proof: "unit test: test/install-root.test.ts"
    - claim: "an unresolvable or unfit install root makes the deploy cycle a no-op with a named reason and never falls back to the invoking checkout"
      proof: "unit test: test/install-root.test.ts"
    - claim: "the resolver is actually wired into the deploy path rather than exported unused"
      proof: "grep: resolveInstallRoot( in src/run-task.ts"
