  note: |
    verify:auto, and the contrast with W1-T446 is deliberate. That task is verify:human because it
    RELAXES a safety guard. This one relaxes nothing: it gives an existing operation a correctly
    resolved target, and every branch of it is a refusal or a no-op that a test can falsify against
    real repos. The operator asked for this structure in writing, with acceptance criteria.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance
    text and this set crosses `src/`, `src/lib`, `test/` and `docs/`, and the acceptance text hits
    the `daemon` tag. Raised up front — the W1-T400/W1-T407 lesson.
    `docs/cli-reference.md` IS DECLARED because it is GENERATED from the COMMANDS registry
    (`scripts/generate-cli-reference.mjs`, W1-T47) and committed — adding a verb without
    regenerating it leaves the checked-in file stale (the W1-T907 precedent).
    `src/run-task.ts` IS DECLARED AND THE COST IS ACKNOWLEDGED: W1-T490's shard refuses to declare
    it because it serialises against every other task naming it (`partitionByFileOverlap`,
    W1-T471). It is unavoidable here — the defective line and the verb registry both live there —
    and W1-T925 declares it too, which is why that task carries `depends_on: [W1-T924]` rather than
    racing this one.
    `src/lib/deployer.ts` IS DELIBERATELY ABSENT. `DeployDeps` ALREADY takes `installPath` as an
    injected option; the defect is entirely in what the CALLER passes. If the implementation finds
    it must change deployer.ts, that is a scope-guard flag and a re-file — W1-T443 is queued
    against that module and `inverseScopeUntouchedFiles` fails a declared-but-untouched path just
    as `scopeViolationFiles` fails an undeclared one.
    THE FALSIFIER MUST DRIVE REAL GIT REPOS (a real origin, a real install clone, a real operator
    checkout), as `test/self-sync.test.ts` and `scripts/recovery-drill.mjs` both already do —
    `recovery-drill.mjs` builds exactly this fixture shape today (`installDir = join(dir,
    "install")`, cloned from a real origin and reset one commit behind). A separation proven only
    against a stubbed git runner would pass while the real `-C <path>` still pointed at the
    operator's tree, which is the defect one level down.
    AND ASSERT THE REFS, NOT THE STATUS: after a cycle, the INSTALL head must have advanced and the
    OPERATOR head must be byte-for-byte where it was, dirt included. A test that only checks
    `reason !== "dirty-tree-conflict"` passes for an implementation that cleaned the wrong tree.
    NO DATE, SHA OR COUNT HERE SHOULD BE QUOTED FORWARD: the three groundings, the ~16:09Z
    crash-loop and `LastExitStatus=256` are the FEEDBACK's observations of 2026-07-23/24 on the
