  rationale: |
    FOLLOW-UP of W1-T12271, filed by the sweep (W1-T12709) from https://github.com/craigoley/remudero/pull/19672 at d38730d94c62e568d2c97873183fd1db62644f87: 1 of the task's 4 criteria need operator input; they move to a held follow-up task and the pull request merges on the rest.
    FINDINGS of the pull request:
    - An unreadable rotated file gives the answer of today for an unread history. A head is never reported as free because its file could not be read: proof executed and PASSED on the PR head (grep: W1-T12271 criterion 3 in test/sweep/the-sweep-effects-read-terminal-heads-from-the-slice-store.test.ts) — NOTE: reviewer judged the proof non-responsive (semantic downgrade): When a rotation starts returning EIO during worktree checkout, a sibling sweep detects unread history and holds dispatch, but the in-flight `dispatchFix` still calls `runFixRung` and returns without a hold. Its last history check is after head lookup, before checkout.
    FOUND 2026-11-11 in the startup and recycle research: `buildSweepEffects` reads every rotated ledger file each time a new process builds it.
    READ at origin/main 0953736f0, src/lib/sweep.ts.
    - Line 2665: `buildSweepEffects` calls `terminalUncreditableHeads(ledgerPath)` while it is built.
    - Line 1099: that function calls `resolveLedgerUnion` on the state directory with one pattern. The call is synchronous and decompresses each rotated file.
    - The state directory of the core instance held 40 rotated ledger files for three days on 2026-11-11.
    - Line 28000: `createEscalationTriageHistoryReader` reads a slice of each rotated file once and keeps it in a store with a shared snapshot. W1-T12235 (queued) uses that store for the lifetime history and exports what a second user needs.
    The first sweep after a restart, the review command and the fix command each build the effects in a new process. Each pays the full read.
    CHECKED for overlap: W1-T12235 covers the lifetime history only. W1-T12236 (queued) covers the open pull request reads at a restart.
  design: |
    NO-INVARIANTS: This amendment names the files needed to meet existing parity and unread-history criteria; it adds no independent guarantee.
    Give `terminalUncreditableHeads` its rows from a reader that `createEscalationTriageHistoryReader` builds for a new slice:
    - a holder name of its own, the steps that the pattern of today matches, `sharedSnapshot: true`;
    - a `project` function that keeps only the fields that the function reads.
    Preserve the legacy raw-line filter as well as the parsed `step` filter. The caller's `resolveLedgerUnion` regex is whitespace-sensitive, so the slice's compacted rows must not accept a spaced `"step": "..."` line that the legacy query would omit. The incremental reader's cache identity includes an optional raw pattern without changing digest versions for slices that do not set one.
    Update the union-retention census and its regression when these two steps move from a full-corpus query to the terminal-head slice.
    Keep the function's result type and its callers. Keep the answer for an unread history.
    The builder must confirm with the test of criterion 2 that the reader gives the same heads as the union read. If it cannot, stop and report the difference.
    An unreadable rotation is unknown history: keep dispatch held rather than treating a missing cached head as free. Preserve the legacy answer only when the relevant history was read completely.
    NOT IN SCOPE: the other `resolveLedgerUnion` calls in src/lib/sweep.ts (lines 18742, 19374 and 19685 read for one pull request at action time), and the store itself.
  falsifier: |
    Call `resolveLedgerUnion` again and criterion 1 must fail. Drop the rows of the live file or accept a spaced `"step": "..."` row that the legacy raw regex misses, and criterion 2 must fail. Return no heads for an unreadable file and criterion 3 must fail. Restore and require all four to pass.
