- id: W1-T3782
  title: "RAW PAGINATED GITHUB ISSUE READS USE NODE'S 1 MiB DEFAULT INSTEAD OF THE TRANSPORT'S BOUNDED 16 MiB DEFAULT — an ENOBUFS makes escalation dedup unreadable and repeats the same blocked work every tick"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  band_meaning: blast-radius
  budget_usd: 12.00
  origin: "operator-session#all-daemons-healthy-2026-09-19"
  plan_refs: ["W1-T2912", "W1-T181", "W1-T3297"]
  files:
    - src/lib/github-transport.ts
    - test/github-transport.test.ts
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on the console daemon, 2026-09-19: `escalation.dedup_unreadable` repeatedly
    records `spawnSync gh ENOBUFS`. That makes W1-T2912 correctly refuse to create a duplicate
    issue, but leaves a fresh read failing on every blocked pass.

    `ghIssueGateway` delegates its paginated REST issue read to `ghExec` with only `encoding` and
    `stdio`. `ghExecFile` passes that through `ghOptionsWithDefaultTimeout`, which adds a timeout
    but no `maxBuffer`. Node therefore uses its 1 MiB child-output default. The same module's
    `ghJson` already gives JSON calls `DEFAULT_GH_MAX_BUFFER = 1 << 24`; the raw paginated form
    cannot use `ghJson` because it reassembles multiple JSON pages itself.

    The live ledger error plus this missing option establishes the failure class. A response that
    crosses the default ceiling is the remaining causal mechanism; the implementation must prove
    it with a real child process, rather than treating a mocked ENOBUFS as transport coverage.
  design: |
    Make `ghOptionsWithDefaultTimeout` also supply `DEFAULT_GH_MAX_BUFFER` when a caller omits
    `maxBuffer`. This repairs every raw `ghExec` caller through the existing one transport choke
    point, while preserving a caller's explicit smaller or larger cap. Keep the 60-second timeout,
    cadence application, command arguments, and failure classification unchanged. Do not make the
    issue reader unbounded, add a retry loop, or treat an unread dedup read as an empty issue set.

    Add a real-default regression in the existing transport test: a child writing more than 1 MiB
    must complete under the default wrapper, and an explicit small cap must remain effective. The
    test must use `ghExecFile`'s default implementation so removing the transport default fails
    with Node's actual ENOBUFS outcome.
  acceptance:
    - claim: "the default GitHub transport captures a child response larger than Node's 1 MiB default without ENOBUFS"
      proof: "unit test: W1-T3782: default gh transport captures output past Node's 1 MiB ceiling"
    - claim: "an explicit caller maxBuffer remains the cap rather than being silently widened"
      proof: "unit test: W1-T3782: an explicit gh transport buffer remains authoritative"
  falsifier: |
    Reject this task if `ghOptionsWithDefaultTimeout` already supplies `maxBuffer` and the live
    console issue reader has a different failure. The source currently returns only `{ ...opts,
    timeout }`, and the ledger names ENOBUFS. Delete the new default and require the real
    over-1-MiB child regression to fail; restore it and require both transport cases to pass.
  note: |
    reservation hand-off: run-unfiled-1789817701000 -> plan/W1-T3782-gh-transport-buffer-1789818959000

    This is a transport-boundary successor to the console escalation loop, not a change to
    W1-T2912's fail-closed dedup policy. The plan record itself is intentionally omitted from
    `files:` so its filing PR stays plan-only.
