    `plan/tasks.d/*.yaml` record alongside a path outside plan scope at `verify: auto` is refused,
    because the mixed diff destroys the `planOnly` carve-out `judgeReview` needs to review a record
    edit — and a dispatched worker gets ONE PR and cannot split it. This half therefore declares NO
    plan path at all.
    DEPENDENCY IS CORRECTNESS, NOT TASTE: this guard lands red if it lands before W1-T2615's edit.
