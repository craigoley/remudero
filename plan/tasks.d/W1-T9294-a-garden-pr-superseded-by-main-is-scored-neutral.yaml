  falsifier: |
    Leave gardenPrState returning `closed` for every unmerged close: the fixture's superseded PR adds one beta
    to the class and its targets to declinedTargets, and the first two tests fail. Score every closed PR
    neutral: the clean decline no longer debits, and the third test fails. Treat unread evidence as superseded:
    the fourth test sees no debit and fails.
