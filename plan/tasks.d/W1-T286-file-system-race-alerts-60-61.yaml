  note: "WITHDRAWN AS FILED — see rationale. Refused at drain.ts:127 before the dependency check, and
    assertRunnable (plan.ts:386) throws quoting this note, so a console Run refuses loudly.
    ★ THE CODE FIX SHIPPED IN PR #1106 STANDS AND MUST NOT BE REVERTED. Only this task's PREMISE was
    wrong. PR #1106 (merged 2026-08-02) added `createOrReadExclusive` in src/lib/fs-race-safe.ts with a
    bounded 3-attempt retry (CREATE_OR_READ_ATTEMPTS) that closes a GENUINE check-then-act window:
    `openSync(path, 'r')` on the EEXIST fallback resolves the path a SECOND time, so a peer unlinking
    between the exclusive-create attempt and that read made the helper throw ENOENT out of the very
    function meant to make the sequence safe. That window was real, CodeQL #84 was right about it, and
    the retry is the fix. Reverting it would reintroduce a real defect in pursuit of undoing a filing
    error. The withdrawal is of the TASK, not of the code.
    ONE PIECE REMAINS UNBUILT and is deliberately NOT carried forward here: criterion 4 asked for ONE
    shared catch-ENOENT helper, and `readFileIfExists` is still defined twice on main —
    src/lib/fs-race-safe.ts:104 (shared, imported by run-task.ts) and src/lib/panel-graph.ts:457 (still
    a private copy). Collapsing the second into the first is a few lines; it does not justify keeping a
    risk:high, budget_usd:60 task alive on a refuted premise, so it is named here for cheap re-filing
    rather than smuggled into a withdrawal.
    THE FIVE WITHDRAWN CRITERIA, PRESERVED VERBATIM so a future re-filing needs no archaeology (none was
    removed for being satisfied; they are withdrawn because the premise was false):
      1. claim: 'each of alerts #60 and #61 is accounted for by API evidence — either its flagged site is
         fixed in this diff, or the alert is shown already-closed and dropped'
         proof: 'unit test: test/fs-race-alerts.test.ts'
