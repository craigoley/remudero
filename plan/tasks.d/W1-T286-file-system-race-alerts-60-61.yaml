      3. claim: 'the EEXIST branch reads the existing file instead of clobbering it, and the ENOENT branch
         reports absence instead of throwing'
         proof: 'unit test: both branches asserted for each site this PR touched'
      4. claim: 'the catch-ENOENT read is ONE shared helper, not a fourth open-coded copy'
         proof: 'unit test: test/fs-race-alerts.test.ts'
      5. claim: 'single-process behavior is unchanged — contents, file mode, and any created/existed
         return flag'
         proof: 'unit test: test/fs-race-alerts.test.ts'
    Criteria 2, 3 and 5 were satisfied by PR #1106; criterion 1 is satisfied by the dismissal evidence
