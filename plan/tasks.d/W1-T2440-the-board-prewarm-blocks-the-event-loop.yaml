- id: W1-T2440
  title: "THE BOARD PRE-WARM SHELLS ITS PR WALK SYNCHRONOUSLY AND PARKS THE ONLY THREAD WHILE IT RUNS — `warm?(): void` returns void by signature and both gateways reach `gh` through `execFileSync`, which `status.ts` already documents as parking the process for the call's duration, so every other request the console makes waits behind a walk it did not ask for; the cadence is not the defect and the bound is correctly sized"
