    - claim: "the zero viewer gate still stops the timer when the last client leaves"
      proof: "unit test: test/board-prewarm-does-not-block.test.ts"
    - claim: "the fields the board reads from a walked row are unchanged"
      proof: "unit test: test/board-prewarm-does-not-block.test.ts"
    - claim: "nothing added introduces a second cache or a wall clock staleness rule"
      proof: "unit test: test/board-prewarm-does-not-block.test.ts"
  falsifier: |
    If a measurement on the host that actually serves the console shows the pre-warm's walk
    completing well inside one poll interval — so no request ever waits behind it — then the
    synchronous shell costs nothing observable there and this task should be closed rather than
    implemented. The measurement must time the WARM ITSELF against concurrent request latency on
    the same process, not the walk in isolation: a walk that takes 18–22 s (W1-T2323's own figure)
    against a 3 s poll is six polls deep, and only a same-process observation shows whether they
    queued.

    SEPARATELY DECISIVE: if `GitHub.warm` ever returns a promise, or if either gateway stops
    reaching `gh` through `execFileSync`, the mechanism named here is gone and the finding must be
    re-derived rather than trusted.
