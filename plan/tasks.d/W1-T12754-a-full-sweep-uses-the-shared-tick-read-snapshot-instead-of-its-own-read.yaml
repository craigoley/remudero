  rationale: |
    WHY: a full sweep that cannot use the published tick read starts its own read. The read plane runs reads one after another, so that read waits behind the tick's read already in flight and then runs again. The full pass waits 5 to 30 minutes before it disposes any PR.
    OBSERVED on the Azure host core ledger, window 2026-11-12T22:31Z to 2026-11-14T22:31Z:
    - 133 `sweep.full_prelude` rows: tick_read_source served 51 (tick_read stage 0 to 2 s), own_read 71, none 11.
    - The 71 own_read passes spent 29,680 s in tick_read: minimum 86 s, median 319 s, maximum 1,910 s. 52 of them took 200 s or more.
    - 2026-11-14: 18:50:11Z tick_read 752 s, 21:14:13Z 713 s, 22:22:59Z 768 s (elapsed 1,025 s). In each of these the snapshot the pass was served was published within 1 s of the pass start, so it was the pass's own read, not a shared generation.
    - 16 of the 71 have a `tick_read.stale_refused` row with consumer full_sweep (age over max_age_ms 300,000). The other 55 have no row that says why the published generation was not used. Across all consumers, stale_refused rows carry read_ms of median 323 s and maximum 1,070 s: the shared read itself takes 5 minutes or more.
    READ at origin/main 7c409f905:
    - src/lib/read-plane.ts:398 onePassPerGeneration serves a published generation to one full pass only (consumed), and only while freshReadGeneration (:335) accepts its age; otherwise it calls read() for a new generation.
    - src/lib/read-plane.ts:479-481 startReadPlane chains every read on `tail`, so a second read starts only after the first settles. A full pass that misses the published generation while the tick's read is running waits for that read and then for its own.
    - src/cli/commands/daemon.ts:2702 wires the full sweep's tickReadFor as servedTickRead(onePassPerGeneration(...)). src/cli/commands/sweep.ts:1017-1020 writes tick_read_source served when the facts were published before the pass started, else own_read, and records no reason for a miss.
  design: |
    INVARIANT one-generation-one-pass: a read generation answers at most one full pass, whether it was published or joined (the rule from DAEMON-1791151532775 stays).
    INVARIANT fresh-or-own: a pass is never served facts older than TICK_READ_MAX_AGE_MS by the age rule of W1-T9704; a joined read that fails that rule is not served.
    1. Measure: onePassPerGeneration returns, beside the facts, why the published generation was not used (consumed, stale, unpublished, no_plane) and how long the pass waited for a read that started before its own. sweep.ts adds tick_read_miss and tick_read_wait_ms to sweep.full_prelude, and tick_read_source joined for criterion 2. Read the rows on the live host for 6 hours after deploy and record the counts in the why-file.
    2. startReadPlane exposes the read in flight (its generation id and its settling promise), read-only. No second queue, no new cap.
    3. onePassPerGeneration: when the published generation is consumed or stale and a read is in flight whose generation no full pass has consumed, await that read and serve it (mark it consumed). Only when nothing is in flight does it call read() for its own generation.
    4. servedTickRead stamps a joined generation with that read's publishedAtMs, so sweep.disposed snapshot_age_ms stays true.
    NOT IN SCOPE: making the shared read itself faster (W1-T12530 for open-PR views, W1-T12531 for the gh transport); the light pass's views (W1-T12755).
  falsifier: |
    Drop the join and criterion 2 must fail with two worker requests. Mark a joined generation unconsumed and criterion 3 must fail. Serve a joined read past its age bound and criterion 4 must fail. Stamp a joined read with the pass start and criterion 5 must fail on snapshot_age_ms. Restore and require all to pass.
