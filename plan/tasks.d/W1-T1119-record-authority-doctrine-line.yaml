  note: "verify:auto — string assertions over a pure renderer, fully in-process. This task is NOT
    ruling-shaped: it writes a prompt constant, not a ruling, and its files: exclude DECISIONS.md, so
    rulingVerifyViolation correctly does not fire.
    risk:medium, argued: the diff is one constant and one rendered line in ONE file, which argues low;
    it reads medium only because the preamble is injected into EVERY implement prompt fleet-wide and
    an edit here busts the prompt cache once for every worker rendered after it (the renderer's own
    header says this block must change rarely). No behavioural gate changes, so the failure directions
    are a wasted cache warm-up or an ignored sentence — never blocked work.
    budget_usd 40 — one constant, one render line, three assertions; below W1-T353's 55 because there
    is no check table, no severity registration and no dispatch path involved.
    OVERLAPS, cited not duplicated: W1-T941 (knowledge budget) explicitly excludes 'the two
    always-injected doctrine lines' from its cap, so a third line does not disturb its arithmetic —
    the implementing PR should say so; W1-T352/W1-T353 are the two shipped gates this complements;
    W1-T355 owns the permanent record of the same ruling and is verify:human by design.
    PROOF NOTE: the grep pattern is new text this change ADDS (zero hits at the merge base, verified),
    so it discriminates rather than reading executed_stale; plain word characters and underscores
    only, no BRE metacharacters, and the pattern contains no ' in ' to mis-split the path clause."
