  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, and it is also honest about size: this task
    genuinely reaches the rung (`src/run-task.ts`) and the disposition that feeds it
    (`src/lib/sweep.ts`), plus a test home. DECOMPOSITION IS DECLINED at the task level but INVITED at
    the delivery level: design (i) lands the three capabilities in an order where each is separately
    shippable, so an implementer who runs out of budget stops at a coherent point rather than
    half-way through one change.

    `test/fix-rung-no-task.test.ts` IS AN EXISTING HOME and is declared rather than a new file, so the
    concern count is not inflated by a filename — the correction `lint-plan` forced on W1-T1068,
    W1-T1069, W1-T1078 and W1-T1079.

    THE 49% IS NOT A VERDICT ON THE RUNG'S QUALITY. It resolves what it can reach. The 21
    dispatched-but-never-resolved tasks are the ones whose remedy was never reachable from inside
    their own diff, and this shard is about that reach — not about making the rung try harder.

    THE MEASUREMENTS ARE QUERIES. Re-derive the outcome counts from the per-form ledger union with a
    coverage control taken first; re-derive each missing capability by grepping `src/` for its
    symbols against a control that is known present; re-derive the strike cap from
    `plan/policy.yaml` rather than from source, since the value was lifted there.
