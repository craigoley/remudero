  status: blocked
  retirement: closed
  rationale: |
    The original filing misattributed W1-T4580 to PR #7350; that PR implemented
    W1-T4457. PR #7405 then merged the actual W1-T4580 implementation, including
    this follow-up's four acceptance claims: the caller census, auxiliary attempt
    receipts, distinct cash-ladder rung assignments, and fail-open receipt handling.
    Each claim below names that merged PR as its satisfaction evidence. This retires
    duplicate implementation work, not the separate runtime-coverage audit or
    publication review; those remain independent before any public comparison.
  design: |
    Preserve #7350's authoritative worker.assignment producer and add metadata-only
    worker.attempt receipts at the same boundary. Keep assignment ID, run, lane,
    requested/selected/served model, error class, duration, tokens, API cash and
    subscription notional as separate fields with explicit unknown reasons. Each
    actually-called cash fallback rung must have its own assignment and attempt;
    a retry is never an independent verified task success. Cover direct and injected
    review/fix, triage, inbox, judge, specialist and sweep callers with a source
    census and named coverage-debt output for any unclassified caller. The census
    is advisory and creates follow-up work; it must not fail an unrelated PR.
    Failed writes and malformed optional result telemetry never change routing,
    retries, worker outcomes, review results, or PR flow. Keep IDs and raw content
    out of public metric labels. Reconcile actual runtime coverage separately in
    the cohort gardener before publishing comparisons.
  acceptance:
    - claim: "a source census detects an unclassified direct or injected model worker caller"
      proof: "unit test: benchmark worker caller census catches an unclassified spawn"
      satisfied_by: "https://github.com/craigoley/remudero/pull/7405"
    - claim: "cash, review, triage and judge model calls get attempt receipts or named coverage debt"
      proof: "unit test: non-dispatch benchmark attempts cover cash review triage and judge lanes"
      satisfied_by: "https://github.com/craigoley/remudero/pull/7405"
    - claim: "cash fallback rungs keep selected model and cost on distinct assignments, not task wins"
      proof: "unit test: cash ladder fallback attempts keep each selected model and cost on its own assignment"
      satisfied_by: "https://github.com/craigoley/remudero/pull/7405"
    - claim: "receipt failure preserves the worker, cash retry and existing assignment callback"
      proof: "unit test: non-dispatch benchmark receipt failure preserves normal flow"
      satisfied_by: "https://github.com/craigoley/remudero/pull/7405"
  falsifier: |
    A cash fallback inherits the first rung's model label; a reviewer attempt is
    counted as verified task completion; an unclassified caller silently disappears;
    or a telemetry sink failure changes a worker or PR outcome.
