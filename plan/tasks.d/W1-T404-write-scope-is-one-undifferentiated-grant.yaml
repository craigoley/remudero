  note: "AMENDED 2026-08-11 — TWO OF THE THREE BLOCKING RULINGS ARE NOW RECORDED, AND THE PARK
    STAYS FOR THE THIRD. The prior note said to flip to auto once BOTH design (i) and design (iv)
    were answered. (i) is answered — three tiers, with the assignment of all 20 routes written out.
    (iii)'s enforcement mechanism is answered and re-derived from source. (iv), THE SECOND FACTOR,
    IS NOT: the operator ruled on the tier count and the enforcement mechanism and explicitly
    withheld this one. So the flip condition as this shard itself states it is NOT met, and
    `verify: human` is left in place deliberately rather than by neglect.
    WHAT WOULD MAKE IT DISPATCHABLE — exactly one ruling, on design (iv): a separately-issued
    high-tier token, a time-boxed elevation, or a server-issued action-bound confirm nonce. Nothing
    else in this shard now needs the operator. When that lands, flip `verify:` to auto; no other
    field needs to change, because every acceptance claim below holds under all three second
    factors, and the two encodings in (i-a) are both already covered by `files:`.
    `isDispatchEligible` refuses a task whose verify is not auto BEFORE the linter is consulted, so
    the park also keeps a worker from rediscovering the W1-T391 wall in the meantime.
    risk:high is Rule 19's SPAN, not blast radius — the file set crosses src/ and test/ and touches
    the single authorization choke point. The band is raised deliberately rather than shipped as a
    sizing violation, which is the W1-T400 lesson. THE AMENDMENT DID NOT MOVE THE BAND: this
    amendment adds two acceptance criteria (5 to 7) and nine paths (11 to 20), and `sizingViolation`
    (`src/lib/task-linter.ts`) returns early at risk high before `subsystemsOf` is ever consulted —
    the Rule 19 exemption already covers whatever the widened criteria text and `files:` now span,
    so the band was already correct rather than newly earned. Measured: this shard raised ZERO lint
    violations before the amendment and zero after.
    The four panel modules are declared because option (ii) puts a tier on each route ENTRY, and the
    entries live in the modules that build them. Under a variant that keeps the table entirely in
    the service module they would be untouched — declaring them costs nothing, whereas omitting one
    would have the scope guard refuse the branch AFTER the work was done.
    ALL SEVEN proofs are PATH references, never symbol ones: a path forward-reference is safe, a
    symbol one is a guess, and a grep proof naming an existing symbol would match the merge base as
    well as the head and be downgraded to a stale proof that discriminates nothing. Six are forward
    references to files that do not exist yet. THE SEVENTH IS DELIBERATELY NOT — the api-client
    criterion names `test/api-client-drift-check.test.ts`, which EXISTS TODAY, because the contract
    it guards exists today too and the implementation must change that file's assertion rather than
    add a parallel one. In the pure-path form a `unit test:` proof executes the whole file, so it
    discriminates on the amended assertion; it is not a grep and so cannot go stale against the
    merge base.
    The ledger is UNMEASURED throughout — the host is down and no figure in this shard is read from
    it. Every count here is from source at 8a2f3eb."
