- id: W1-T404
  title: "one `write` grant reaches all 20 write-scoped routes, so the credential that adds an operator note is the credential that spends the daily budget, executes a skill against the operator's checkout and halts the fleet — and the obvious second factor does not exist server-side"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 95.00
  rationale: "RECON 2026-08-07 (state/recon-hosted-console-auth.md), RE-DERIVED AT 8a2f3eb.
    THAT RECON ESTABLISHED THE ORDER for a hosted console — move the fleet, differentiate write
    scope, build the verifier, bind publicly. This is step 2, and it is the ONLY one buildable now:
    the verifier needs an identity-provider decision, binding needs both, and the fleet move needs a
    credential. This step needs neither.
    AND IT IS WORTH DOING WITHOUT ANY OF THAT, which is the part a reader should not skip. On the
    tailnet TODAY, one grant covers everything: the same credential adds a note, raises the spend
    ceiling, dispatches paid work, executes a skill against the operator's own checkout, and stops
    the fleet. Hosting is what makes this urgent; it is not what makes it wrong.
    THE FOUR MEASURED FACTS, EACH RE-DERIVED AT THIS SHA:
    (1) `Scope` is exactly the union of read and write, with TWO grant sets — a read-only set and a
    read-plus-write set. There is no third tier and no per-route capability.
    RE-DERIVED AT 0b9d564, AND THE CONSUMER SET IS COMPLETE AND SMALL — this is the ripple a third
    VALUE would have to cover, all six sites in `src/lib/service.ts` and nowhere else: the `Scope`
    type declaration itself; the `scope` field on `Route`; the `scope` field on `SseRoute`; the
    READ_ONLY grant set; the READ_WRITE grant set; and `grantedScopes`'s declared return type. The
    enforcement site is a seventh, reading the resolved route's scope and answering 403 with it. The
    ONLY other whole-word hit anywhere in src/ or test/ is a markdown heading in
    `src/lib/project-init.ts` and two test COMMENTS, neither of which is a consumer.
    (2) 22 scope declarations across 20 DISTINCT write-scoped route paths.
    (2a) RE-MEASURED AT 0b9d564 AND UNCHANGED SINCE THE RECON — this was checked rather than
    assumed, because the amendment brief expected routes to have been ADDED. They have not. The
    query, named so it can be re-run rather than quoted: `git grep -c 'scope: \"write\"' <sha> --
    src/lib`, run at BOTH 8a2f3eb and HEAD, returns byte-identical per-file counts
    (panel-actions 10, panel-graph 7, panel-skill-run 1, operator-notes 1, serve 3). The raw 22
    OVER-COUNTS by two: of serve.ts's three hits exactly one is a route entry, the other two being a
    doc comment and a response BODY that echoes the string. So 20 real entries across 20 distinct
    paths, and the recon's 5/9/6 split still partitions them exactly — every path is accounted for
    once, which is why design (i) can assign all 20 without a residue.
    NO COUNT HERE SHOULD BE QUOTED FORWARD; re-run the query.
    (3) `grantedScopes` has EXACTLY ONE call site, inside `createService`'s dispatcher, with
    enforcement two lines later — a missing grant answers 401 and an insufficient one answers 403.
    It already composes identity-then-bearer with a documented fall-through, and BOTH branches
    return the same optional scope-set type. So a tier check has ONE place to live and a new
    credential source would slot in beside the existing two rather than replace them.
    (4) THE OBVIOUS SECOND FACTOR DOES NOT EXIST. Searching `panel-actions.ts`, `panel-graph.ts`,
    `service.ts` and `fleet-control.ts` for a nonce, a confirm token, a challenge, a reauth or a
    step-up returns ZERO files for every one of those terms. The arm-then-confirm interaction is
    CLIENT-SIDE ONLY: it is a mis-click guard, and anything speaking HTTP directly bypasses it. It
    cannot be promoted to a second factor, it has to be built.
    THE POPULATION DOES NOT SPLIT CLEANLY, AND THAT IS THE FINDING. Classified by CONSEQUENCE —
    what is the worst outcome of one unintended call — rather than by verb:
      POLE A, spends money or moves code, five routes: drain run, drain kick, skills run, manual
      approve, inbox approve. Costly or effectively irreversible.
      POLE B, bookkeeping, nine routes: operator-notes add, feedback, feedback decision, feedback
      preview, questions answer, escalation mark-handled, drain feedback, inbox reframe, and the
      auth scope probe. Trivially reversible.
      THE CONTESTED MIDDLE, six routes: control stop, pause and resume, quiet hours, and the two
      daily-cost-ceiling routes. Every one is REVERSIBLE — a stop can be resumed, a ceiling can be
      lowered again — but every one is either disruptive or a force multiplier for pole A. Raising
      the ceiling does not spend anything; it removes the thing that would have stopped the
      spending.
    So this is NOT a continuum and NOT a clean two-way split: it is two clear poles with a third of
    the population genuinely arguable between them. That is why the tier model is posed as options
    below rather than asserted.
    (5) THE EXISTING TESTS THAT ASSERT THE SHAPE THIS CHANGES, swept at 0b9d564 and split by
    INVOCATION COUNT rather than by mention, because declaring a file that merely names a symbol
    draws a permanent advisory. FOUR files carry REAL assertions that a third tier breaks:
      - `test/service.test.ts` and `test/panel-actions.test.ts` each assert the 403 body's
        `required_scope` equals write, TWO real assertions apiece, and BOTH do it against
        POST /v1/control/pause — which design (i) places in the MIDDLE tier. These do not merely
        need updating; they are the tests that would go red first.
      - `test/tailnet-identity-scope.test.ts` asserts an allowlisted identity 200s on that SAME
        middle-tier route with no bearer token at all, so it also pins what tier an identity grant
        resolves to — a question the migration in (v) must answer.
      - `test/api-client-drift-check.test.ts` asserts the generated two-value union verbatim by
        regex; see design (vi-a).
    TWO more construct TYPED route literals and are encoding-dependent per design (i-a) —
    `test/api-client-client.test.ts` (a typed Route array plus an SseRoute array) and
    `test/serve-prewarm-clientgate.test.ts` (one SseRoute) — both read-scoped only, so they break
    under a REQUIRED new field and not under a widened union. Declared for the same reason the panel
    modules are: declaring costs nothing, omitting has the scope guard refuse after the work.
    TWO ARE DELIBERATELY NOT DECLARED, and this is the invocation-count split doing real work:
    `test/route-wiring.test.ts`'s only `Scope` hit is a SECTION COMMENT and its actual assertion —
    a read token is refused on nine write routes — is tier-agnostic and survives all three tiers;
    `test/route-registration.test.ts` imports the Route TYPE but never constructs one, and asserts a
    read token is refused on a LOW-tier route. Both keep passing unchanged.
    A MEASUREMENT HAZARD THAT COST TIME AND WILL RECUR: `src/lib/task-linter.ts`,
    `src/lib/flight-signals.ts`, `test/gate-properties.test.ts` and `test/property-parsers.test.ts`
    are classified by `file` as data, not text, so plain `grep` treats them as BINARY and reports
    NOTHING while exiting 1 — a positive control for a string known to be present returned zero.
    Use `grep -a` or `rg`. None of them is in this task's route or scope surface, so no count above
    is affected; it is recorded because a silent zero here reads exactly like a real absence.
    ONE ROUTE MAY SIMPLY BE MIS-SCOPED TODAY, recorded because it is cheap to check and would
    shrink the surface: the auth scope route is declared write-scoped but its only job is to answer
    whether the caller HAS write scope — the shell probes it to decide whether to render write
    controls at all. Whether it needs write to answer that question is worth settling in passing."
  design: "(i) RULED 2026-08-11 — THREE TIERS, option (c). The operator has ruled; this is no longer
    posed. The tiers are LOW (bookkeeping), MIDDLE (reversible-but-disruptive) and HIGH (spends
    money or moves code), and the ruling's own reasoning is recorded because it is the rule for what
    a fourth tier would have to be: forcing the contested six into either pole is what made a
    two-tier model arbitrary, and RAISING A CEILING SPENDS NOTHING — it removes the thing that would
    have stopped the spending. That is a distinct CONSEQUENCE CLASS, not a boundary case, and a
    fourth tier would need to name a consequence class these three do not cover.
    THE ASSIGNMENT, all 20 write-scoped routes, re-measured at 0b9d564 (see rationale fact (2a)):
      HIGH, 5: POST /v1/drain/run, /v1/drain/kick, /v1/skills/run, /v1/manual/approve,
        /v1/inbox/approve.
      MIDDLE, 6: POST /v1/control/stop, /v1/control/pause, /v1/control/resume, /v1/quiet-hours,
        /v1/policy/daily-cost-ceiling, /v1/policy/daily-cost-ceiling/clear.
      LOW, 9: POST /v1/operator-notes/add, /v1/feedback, /v1/feedback/preview, /v1/feedback/decision,
        /v1/questions/answer, /v1/escalation/mark-handled, /v1/drain/feedback, /v1/inbox/reframe,
        and GET /v1/auth/scope.
    (i-a) THE ENCODING IS NOT RULED and is the implementer's call, because the ruling fixes the tier
    COUNT and not its spelling. Two encodings satisfy every criterion below: WIDEN the `Scope` union
    (rationale fact (1) enumerates all six consumption sites, so the ripple is bounded and known), or
    add a SEPARATE tier field to `Route`/`SseRoute` and leave `Scope` at two values. The measured
    difference is blast radius on test route literals: a REQUIRED new field breaks every typed route
    literal in `test/` including read-only ones (rationale fact (5)), an optional field or a widened
    union breaks only the write ones. Both are declared in `files:` so either choice is buildable.
    (ii) TIERS MUST BE DECLARED, NOT DERIVED — established rather than assumed. Consequence is not
    recoverable from the handler: a single module declares routes at BOTH poles (inbox approve and
    feedback preview and the cost ceiling all come from the same one), so any module-level or
    grep-shaped signal scores them identically. Declaring is therefore the only honest option.
    (iii) RULED 2026-08-11 — A DECLARED LIST PLUS A DRIFT CHECK, IN THE SHAPE `ci-parity:drift`
    ALREADY USES. A new route with no tier FAILS the way an unregistered ci.yml job fails. FOLLOW
    THAT MECHANISM RATHER THAN INVENTING A SECOND SPELLING; it is re-derived here from
    `src/lib/ci-parity.ts` at 0b9d564 so the implementer copies a shape that exists:
      - A declared table, `CI_PARITY_TABLE`, one entry per job. Its doc comment states the contract:
        the drift step fails the moment `parseCiJobNames` finds a job the table does not name at
        all, and a listed non-mirrored job is a considered, reasoned exclusion, not a gap.
      - `runCiParity` derives the LIVE set from source rather than from a second list, then computes
        the missing set as the live jobs not present in the table's job set.
      - It PREPENDS one named step, `ci-parity:drift`, whose ok is exactly the missing set being
        empty, and whose FAIL detail NAMES the entries with no parity entry. PASS states the count
        it checked, so a vacuous pass over an empty live set is visible in the message itself.
      - `excludedStep` renders a listed exclusion with its recorded reason, defaulting to a literal
        no-reason-recorded string — an exclusion cannot be silent either.
    THE SAME SHAPE IS AVAILABLE HERE because `buildServeRoutes` (`src/lib/serve.ts`) already returns
    the real assembled table as ONE array and every entry carries its `method`, `path` and `scope`.
    So: walk that array, and fail on any write-scoped route with no tier. A new route must be unable
    to default quietly, and a deliberately-LOW route must be a declared entry with a reason rather
    than an omission.
    (iii-a) THE PRECEDENT TO IMPROVE ON, NOT COPY, IS W1-T402's. It shipped a completeness alarm for
    `INSTRUMENT_SURFACE` (`src/lib/review.ts`) THIS WEEK, paired with an exclusions map and
    `test/instrument-surface-completeness.test.ts`, deriving candidates from the live tree and
    failing when one is neither covered nor excused. Its own doc comment records the limit that
    matters here: THAT ALARM NEVER BLOCKS A PR BY ITSELF — only the constant does. It is a TEST.
    `ci-parity:drift` is stronger because it runs inside the product function and fails the caller.
    Prefer the ci-parity shape for that reason; W1-T402 is cited as the reason a bare comment asking
    a future reader to re-check membership is NOT sufficient, which is what the surface had before
    it.
    (iv) STILL OPEN — THE SECOND FACTOR IS THE ONE REMAINING OPERATOR RULING, AND IS DELIBERATELY
    NOT ANSWERED HERE. The 2026-08-11 rulings settled the tier COUNT (i) and the enforcement
    MECHANISM (iii) and explicitly did not settle this. It is what keeps `verify: human` in place;
    see the note. The options below are unchanged and none is preferred by this amendment.
    THE SECOND FACTOR MUST BE SERVER-ENFORCED OR IT IS THEATRE, and the ergonomics constraint
    is measured rather than assumed: the operator already re-pastes the write token constantly
    because paste-once lives in session storage and dies with the tab. A design that adds a SECOND
    thing to paste makes a known friction worse. Options, with that constraint applied:
      (a) A SEPARATELY-ISSUED HIGH-TIER TOKEN. Simplest server-side; worst ergonomically, because it
          is exactly the second paste the friction finding argues against.
      (b) TIME-BOXED ELEVATION. One credential, exchanged at an elevate endpoint for a short-lived
          high-tier grant. Good ergonomics; needs server-side session state the service does not
          have today, and a decision about what expiry means for an SSE stream already open.
      (c) A SERVER-ISSUED, ACTION-BOUND CONFIRM NONCE. The server issues a nonce naming the specific
          action, and the write is refused without it. No new secret to store or paste, binds to the
          action rather than to a window, and is the true version of the affordance the client
          already pretends to offer. Costs one round trip per high-tier action.
    (v) THE MIGRATION MUST DEFAULT TO THE LOW TIER, and this is the sharpest requirement in the
    task. Every existing client holds one write token; if an existing token defaults to the HIGH
    tier, the change ships as a no-op that silently grants everything and nobody notices for months.
    Defaulting LOW is a deliberate, visible break: the existing credential keeps bookkeeping and
    loses the dangerous routes until the operator does something about it.
    (vi) THE BLAST RADIUS IS SMALL ON THE CONSOLE AND WAS MEASURED. The console shell holds the
    token in session storage and already PROBES its own scope before rendering write controls, so a
    tier-aware probe has an existing seam to slot into; the console-url verb prints the write token
    for pasting. NO SCRIPT UNDER scripts/ POSTS TO THE API AT ALL, so there is no script fleet to
    migrate.
    (vi-a) CORRECTION, 2026-08-11 — (vi) MISSED A PUBLISHED CONTRACT, and it is the sharpest
    files: consequence in this amendment. `required_scope` is not private to the service: it is a
    declared field of the Error schema in `openapi/daemon.yaml`, carrying an ENUM of exactly the two
    current values. That spec is the source for a GENERATED client, `packages/api-client`, whose
    checked-in schema declares the same two-value union as an optional field. THE CHAIN IS
    CI-ENFORCED: the package.json script `api-client:check` runs the generator in check mode, that
    script is a mirrored `CI_PARITY_TABLE` entry under the job name `api-client-drift`, and
    `test/api-client-drift-check.test.ts` asserts the generated union VERBATIM by regex. So a third
    tier is a spec change and a regeneration, not just a service change, and omitting either path
    from `files:` has the scope guard refuse the branch after the work is done — the W1-T407 failure
    mode this shard is being amended to avoid.
    ONE CONSUMER IS DELIBERATELY NOT DECLARED: `packages/daemon-client-smoke` reads the field as a
    string to build a message, and its own header comment says it is a tripwire for a property
    rename/removal and for an enum member rename/removal on the ERROR code — not on this field.
    WIDENING an enum breaks neither, so it needs no edit; it is named here so a future reader does
    not re-derive that and mistake the omission for an oversight."
  acceptance:
