  rationale: |
    OBSERVED 2026-11-13 on the Azure host, core ledger (~/rmd-state2/state, archives ledger.2026-11-13T11-17-48-407Z and ledger.2026-11-13T12-17-23-649Z):
    - 11:08:36Z the sweep decided a fix for W1-T11168 (PR 18281). The run id work-fix-dispatch-W1-T11168-1794568116590-623c carries that time.
    - 11:08:40Z `run_child.spawned` for that run (pid 1950091); 11:08:42Z `run_child.launch_segments`.
    - 11:10:12Z the deploy tick started a bounded recycle handoff with a wait of 2,827 s. 11:10:46Z the recycle wrote its PAUSE (`recycle.phase` pause).
    - 11:24:57Z the first row of the child after launch: `sweep.fix_capacity`, the admission grant (fixes_admitted 1). The child wrote no row for 16 min 15 s before that.
    - 11:25:22Z the child took its fix-branch claim (claim id ...:fix-claim:18281:1794569122486) and `sweep.fix.prepare_timing`.
    - 11:26:53Z `sweep.fix.child_phase` worker; 11:26:55Z `worker.assignment`. The worker ran inside the PAUSE until `worker.attempt` at 11:39:08Z. The round then pushed and kept its fix-branch claim until `inflight.recycle_yield` at 12:03:46Z.
    - The recycle counted that claim as work in flight (`daemon.recycle_wait.review_admitted` rows at 11:28:00Z and 11:59:04Z name it). The lane ended at 12:03:47Z (`run_child.settled`), 92 s before the wait ran out.
    - 12:05:19Z `deploy.restart_refused`: "REFUSING — 0 lane-holding and 1 lane-less worker(s) still in flight after 2827s". The last blocker was a review worker 55 s old. This task does not change review admission. It stops the fix round that started inside the PAUSE and held its claim for 38 min.
    READ at origin/main 479944844.
    - src/lib/sweep.ts:18128 `recheckFixDispatch` reads `ports.hold()` first. Then it awaits `readLivePr` and calls `readTask`. In the child (src/run-task.ts:44296) `readTask` syncs the plan and projects it through GitHub. These reads ran between the hold read and the grant; they write no row.
    - src/lib/sweep.ts:18168 `runFixDispatchChild` then calls `claimFixAdmission`, builds the dispatcher, and calls `dispatchFix`, which takes the fix-branch claim (`acquireFixRoundClaim`, src/lib/sweep.ts:4783) and starts the worker. None of these steps reads the hold again.
    - src/lib/worker.ts:2579 the W1-T11336 re-read at worker start runs only when `currentRunChildReservationId()` is undefined. A fix child runs inside `withRunChildReservation` (src/lib/run-child-reservation.ts:52), so its fix workers skip it.
    - The run-child re-read of W1-T10001 (src/lib/run-child.ts, `run_child.spawn_withheld`) runs once, before the child process spawns. Here that was at 11:08:40Z, before the PAUSE.
    - The child's hold reader (src/run-task.ts:44283-44288) reads STOP, then `checkSharedPause`, which returns the local recycle PAUSE (src/lib/fleet-control.ts:602 and :617). The worker's reader `workerAdmissionHold` (src/lib/worker.ts:2213) reads `stopDetail` and `pauseDetail`. Both see a recycle PAUSE.
    CHECKED for overlap: W1-T11336 (merged) covers in-process fix starts only and says so. W1-T11559 (merged) makes the first shared-PAUSE read of a fresh child complete before it decides. W1-T9114 (merged) made the recheck. W1-T11383 settled that the later re-reads need no heap hold. W1-T8141 (queued) ends a fix worker's round that is already running; it does not stop a start. No queued task changes `runFixDispatchChild` or the W1-T11336 condition.
  design: |
    1. In `runFixDispatchChild` (src/lib/sweep.ts), read `deps.hold()` again directly before `deps.claimFixAdmission(envelope.pr)`. When it names a hold, log `sweep.fix.child_refused` with the reason `worker admission is held: <hold>` and throw `fix dispatch refused: <reason>`, as the recheck does. When the read throws, refuse with a reason that names the failed read.
    2. Read `deps.hold()` again after `deps.dispatcher()` and directly before `effects.dispatchFix(...)`. Refuse in the same way. The existing `finally` releases the grant. `dispatchFix` is not called, so no fix-branch claim is taken.
    3. In `spawnWorker` (src/lib/worker.ts), apply the W1-T11336 re-read to every start of worker class `fix`, also inside a run child: remove the `childReservationId === undefined` part of the condition. For a run child, `admission` is undefined, so `admissionAbandoned()` releases nothing that the daemon holds. `runFixRung` already stands down on `admission-abandoned` with no strike, and the round exit releases the fix-branch claim.
    4. Keep the W1-T11336 comment and add `W1-T12497` to it. Add no other comment lines to src/lib/sweep.ts or src/lib/worker.ts; both have a comment cap test (test/sweep/compress-src-lib-sweep-ts.test.ts, test/worker/spawn/compress-src-lib-worker-ts.test.ts).
    5. The test for criteria 1 to 3, 5 and 6 drives `runFixDispatchChild` with ports in the way of test/reviews-and-detached-actions-run-as-run-children.test.ts: a hold port whose answer changes while `readTask` runs, or after the grant. The test for criterion 4 calls `spawnWorker` inside `withRunChildReservation` with a real PAUSE flag under a temp root and no injected hold reader. Neither test imports `#src/run-task.js`.
    INVARIANT no-fix-start-past-a-hold: a fix child never takes its admission grant, never calls `dispatchFix`, and never starts a fix worker when a STOP or PAUSE is in place at the read directly before that step.
    NOT IN SCOPE: review and plan-review admission during a recycle wait, the derived recycle wait, the bounded handoff (src/lib/deployer.ts), a fix worker that is already running (W1-T8141), and how fast `readTask` is.
  falsifier: |
    Remove the read before `claimFixAdmission` and criterion 1 must fail. Remove the read before `dispatchFix` and criterion 2 must fail. Let a throwing hold read pass and criterion 3 must fail. Put back `childReservationId === undefined` in src/lib/worker.ts and criterion 4 must fail. Read the hold in a way that refuses a clear hold and criterion 5 must fail. Restore and require all six to pass.
