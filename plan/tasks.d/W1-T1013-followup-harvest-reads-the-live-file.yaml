- id: W1-T1013
  title: "THE FOLLOW-UP HARVEST DELIBERATELY UN-SCOPES FROM THE MARKER WINDOW AND THEN READS THE LIVE LEDGER FILE ALONE, SO ROTATION DESTROYS BOTH ITS CORPUS AND ITS OWN DEDUP MARKS — 1231 declared entries and 549 marks sit in the archives while the live file holds 0 of each, and a retro run today would mine nothing: give mineFollowups the ledger UNION that resolveLedgerUnion already builds"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    THE BRIEFED DEFECT IS REAL AND IT IS SECOND. `mineFollowups` (`src/lib/retro.ts`) does key on
    `entryId = ${runId}:${index}`, and recon, implement and the fix rung do each call
    `harvestFollowupsFromReport` under one `run_id` restarting the index at 0 — four call sites in
    `src/run-task.ts` against a control of one doc mention elsewhere. What the measurement changes is
    the ORDER: a perfect key on a corpus of zero recovers nothing, and the corpus really is zero.

    (1) THE CORPUS READ, RE-DERIVED AT origin/main 39efeddb. `retroCommand` builds the gather's only
    ledger input as `existsSync(ledgerPath) ? readFileSync(ledgerPath, "utf8") : ""` — `ledgerPathFor`
    resolves the LIVE FILE, and nothing on that path consults `resolveLedgerUnion`,
    `ledgerRotationEntries` or `ledgerCorpusFiles`. `buildGather` parses that one string and hands the
    records to every miner. So `mineFollowups`' corpus is the live file, and only the live file.

    (2) AND THE MODULE'S OWN DESIGN NOTE MAKES THAT THE EXACT WRONG READ. The call site says it in
    terms: "the FULL ledger, never `scoped` — a followup must survive past the marker window
    (idempotency comes from the followup.harvested/deduped marks mineFollowups reads back, not from
    marker-scoping)". Un-scoping from the marker is the deliberate act; the un-scoping buys nothing when the corpus is the live file, because rotation
    truncates that file per step long before the marker ever would. Both halves die together — the
    declarations AND the marks that make the pass idempotent.

    (3) THE MEASUREMENT, OVER THE RETAINED UNION, PER-FORM COVERAGE CONTROL FIRST (666 gz, 6 plain, 1
    live; `report.followups` matches per form 365 / 173 / 0; deduped on the FULL LINE, 538 raw and 538
    distinct, so the forms are disjoint here rather than overlapping). The live form's ZERO is real
    absence and not an unreadable file: the same live file scores 200 `verdict` and 200 `run.start`
    rows across 8,860 lines. 538 `report.followups` rows, 333 distinct runs, 1,231 entries passing
    `mineFollowups`' own type/text filter. `followup.harvested` per form: 395 / 157 / 0, and
    `followup.deduped` 2 / 0 / 0 — 549 distinct mark rows, ALSO none in the live file.
    SO A RETRO RUN RIGHT NOW MINES 0 OF 1,231. Not because the entries were harvested: because the
    only file it opens no longer holds them.

    (4) WHAT WAS ACTUALLY LOST, AND IT IS NOT THE KEY. 170 of the 333 runs that declared a follow-up
    received NO mark of any kind — 51%. Only 6 runs were harvested INCOMPLETELY, losing 8 entries
    between them. Marks total 549 against 1,231 entries declared, so at most 549 were ever surfaced
    and 682 (55%) never were. The dominant loss is runs the harvester never saw at all, which is the
    corpus, not the key.

    (5) AND THE KEY'S REAL SIGNATURE IS THE OPPOSITE OF UNREACHABILITY ON THE FIRST PASS. 132 entry
    ids carry more than one mark, up to four. Every one of the 145 consecutive re-mark gaps is 0.0
    seconds — SAME PASS, not a race between passes and not rotation. The mechanism is visible in the
    loop: `processed` is built once from the ledger and nothing is added to it while minting, so two
    entries sharing an id both mint. 130 of those 132 ids carry DIFFERENT texts, which is the proof
    that the first pass surfaces them rather than dropping them; only 2 duplicate one entry. The
    permanent skip the briefing describes is the SECOND pass, and it bites only entries that arrive
    after their run's id was first marked.

    (6) THE CADENCE IS NOT THE BINDING CONSTRAINT AND THE BRIEFING'S FIGURE DOES NOT HOLD HERE. The
    retro is automated, not operator-run: `evaluateRetroTrigger` (`src/lib/retro.ts`) fires on
    merges-since-marker >= `retro.mergesThreshold` (25) OR days-since-marker >= `retro.daysThreshold`
    (7), whichever crosses first, both schema-bounded in `plan/policy.yaml`. This host's union holds
    EIGHTEEN distinct `RETRO-*` runs between 2026-07-14 and 2026-08-12, about one every 1.7 days —
    not five all-time. Cadence is deliberate, reviewed and adequate.

    (7) A CAVEAT ON WHERE THESE ROWS LIVE, STATED RATHER THAN GLOSSED. The briefing's worst case
    `W1-T513-1786818104512` reads ZERO across all three forms on this host, and no `W1-T513` run
    exists here at all — while the same query shape finds `DAEMON-1784929088440` in all three
    (376/72/12). This host's `report.followups` rows stop at 2026-08-12T23:51Z and its marks at
    2026-08-12T12:30Z, the same day as its last retro, so the recent lane is running against a ledger
    this host does not hold. Every figure above is this host's retained union and is stated as such.

    (8) WHY THIS ORDERING IS CHEAP AND THE OTHER IS NOT. Changing the KEY invalidates every existing
    mark, so all 404 marked entry ids stop matching and are re-proposed once. Changing the CORPUS
    changes no key at all: the 404 marks are read back from the archives and every one keeps
    suppressing exactly what it always suppressed. Nothing is re-proposed, nothing is backfilled, and
    no ledger row is rewritten — the rows are append-only and already on disk.
