  note: |
    THE GREP PROOF MATCHES RATIONALE PROSE, NOT ITS OWN DECLARATION. The phrase sits on ONE PHYSICAL
    LINE inside rationale (2), is not on line 2 of the file, and reads 0 files across the whole tree
    at the merge base against a control phrase from `buildGather`'s own comment that reads 1 — so it
    discriminates head from base and cannot be downgraded to `executed_stale`.

    SCOPE IS THE CORPUS, NOT THE KEY, AND THE KEY IS NOT FOLDED IN. One concern per shard, and these
    are two: this task changes WHICH ROWS the miner sees; a phase discriminator in `entryId` changes
    WHAT A ROW IS CALLED. Rationale (5) records everything a later filing needs — the 132 doubly
    marked ids, the 0.0-second gaps, the 130-of-132 differing texts, and the missing
    `processed.add(entryId)` — and rationale (8) records why the key must come SECOND: it invalidates
    404 marks and re-proposes them once, which is only tolerable on a harvester that can already see
    its corpus. THE DISCRIMINATOR IS AVAILABLE AT BOTH ENDS WHEN THAT TASK IS FILED:
    `harvestFollowupsFromReport` already holds `ctx.label` (recon / implement / the fix rung) and
    spends it only on the `say()` line, and the ledger row carries `ts` today — measured keys on a
    real row are exactly `entries, pr_url, run_id, step, task_id, ts`.

    src/run-task.ts MUST BE DECLARED AND THE W1-T471 SERIALISATION COST IS ACCEPTED IN WRITING. It is
    declared by 224 of 363 shards, so this task serialises against most of the pool under
    `overlappingPaths`. It is unavoidable: the live-file read is `retroCommand`'s own line and there
    is no other site that composes the gather's ledger input.

    src/lib/retro.ts IS DECLARED (18 shards) BECAUSE THE NARROW FIX NEEDS IT. Handing `buildGather` a
    union-backed string wholesale would silently re-corpus every other miner it feeds, including
    `mutationGateLifetime`, which also reads the FULL records; a second, explicit input consumed only
    by `mineFollowups` keeps the marker-scoped miners on the corpus they already read, which
    criterion 3 pins. src/lib/ledger-grep.ts is NOT declared: `resolveLedgerUnion` and
    `ledgerRotationEntries` are already exported and already correct, and declaring an unchanged file
    to look thorough pays a serialisation cost for nothing.

    NO SIGNAL IS ADDED. `report.followups` and `followup.harvested` both already exist and both
    already have a reader; this changes a READ, writes no new step, and needs no
    `DECISION_RELEVANT_LEDGER_STEPS` entry — which is worth stating, because neither mark is in that
    set today (control: `run.start`, `review.posted` and `sweep.absent_repush` all are). Adding them
    there is the OTHER available repair and is deliberately not proposed: it would pin two unbounded
    step families in the never-rotated core to fix a reader that should simply read the archives, and
    `resolveLedgerUnion` exists precisely so a reader can.

    NOTHING IS ROUTED INTO plan/feedback/. `captureFeedback`'s origin is a closed enum plus
    `issue#`/`alert#`/`repair#`, and `followup` reads 0 in `src/lib/feedback.ts` against a control of
    40 `origin` occurrences in that same file. The terminus staying a list a human reads is the
    DESIGN: `harvestFollowupsFromReport` says "Rule 15 stays intact: this ledgers raw declarations, it
    never files a task itself" and `renderFollowupCandidates` heads its output "PROPOSAL CANDIDATES,
    never auto-filed (rule 15)". No intake is raised and no threshold is moved.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (`src/lib/task-linter.ts`) exempts only risk high, and `subsystemsOf` derives subsystems from the
    acceptance text as well as from `files:`; the criteria name a corpus resolution, a degrade path, a
    scoping invariant and a dedup lifetime.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
