  acceptance:
    - claim: A static record on the waiter's own host and pid namespace whose writer pid is gone, or whose pid now has a different kernel start time, is removed by the admitStaticWork scan, its peak is not counted, and one test_slot.static_record_removed line names the record, its label, its pid and the rung own-namespace
      proof: "grep: W1-T12822 criterion 1 in test/ci/suites/a-static-admission-record-whose-writer-is-proven-dead-is-removed.test.ts"
    - claim: A waiter in the initial pid namespace (a single NSpid entry) on the same boot id removes a static record from any other host name or pid namespace when a complete scan of /proc/<pid>/stat finds no process whose start time equals the record's processStart, logging the rung boot-start-scan
      proof: "grep: W1-T12822 criterion 2 in test/ci/suites/a-static-admission-record-whose-writer-is-proven-dead-is-removed.test.ts"
