    - claim: "the denial is observed rather than assumed, by the same three-state verdict the write arm uses"
      proof: "unit test: test/containment.test.ts"
    - claim: "a worker's read of an ordinary state path it legitimately uses still succeeds"
      proof: "unit test: test/containment.test.ts"
    - claim: "the settings file still validates and its existing deny entries are unchanged"
      proof: "unit test: test/settings.test.ts"
    - claim: "the token file's mode is unchanged and nothing in this change rotates a token"
      proof: "unit test: test/settings.test.ts"
