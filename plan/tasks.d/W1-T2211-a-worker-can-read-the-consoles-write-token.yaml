  note: |
    THE TOKEN'S VALUE APPEARS NOWHERE IN THIS RECORD. Every claim about it is by path, mode,
    ownership or route table: mode 600, uid 1000, gid 1000, size 160, visible in the worker mount
    at `/home/node/Remudero/state/service-tokens.json`. The file was never opened.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/containment.test.ts` or `test/settings.test.ts`, both declared in `files:`
    and both already existing.

    `risk: high` IS RULE 19'S SPAN. `files:` names four stems. The blast radius is narrower than
    that suggests — one deny entry, one probe arm, two suites — but the band is honest for a second
    reason: a deny drawn one path too wide breaks the lanes that legitimately read the state tree,
    which is why design (i) names the single file and criterion 3 pins that ordinary state reads
    still succeed.

    THE CONTROL THAT COULD NOT BE PRODUCED IS RECORDED AS A RESULT, NOT OMITTED. Rationale (5): the
    brief asked for a path `denyRead` demonstrably blocks, and this tree has none — the only
    `denyRead` references in `test/` are shape assertions in `test/settings.test.ts`. That absence
    is why design (ii) makes the proof, not the declaration, the load-bearing half of the remedy.

