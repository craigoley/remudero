- id: W1-T9615
  title: "THE SRE LANE'S INCIDENT FILING HOLDS THE DAEMON LOOP ~110 S A TIME — runSreLanePass files through captureFeedback, whose landFeedback drives the SYNC driveLanding/planPrPreflightAtCommit path (plan-pr-emitter runInTree spawnSync: lint-plan-precheck ~28 s, task-id-existence-check ~22 s, shard census), so from the lane's first start at 03:43Z on 2026-10-15 the core loop was held 60-190 s every ~2 min, 17 App token refreshes timed out and the daemon ran 27 min on a dead token"
