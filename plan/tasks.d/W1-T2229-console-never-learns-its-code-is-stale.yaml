  title: "THE CONSOLE NEVER LEARNS THAT ITS OWN CODE IS STALE, SO A MERGED FIX REACHES IT ONLY WHEN A HUMAN RESTARTS IT — both signals already exist and neither is a timer; the whole design is what makes exiting safe while a write is in flight"
