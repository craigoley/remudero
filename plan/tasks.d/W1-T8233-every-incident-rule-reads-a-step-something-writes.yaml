    - claim: "every runbook incident name has an emitter or a listed debt entry, and the debt list only shrinks"
      proof: 'grep: test("W1-T8233: every runbook incident name is emitted or listed as debt" in test/every-incident-rule-reads-a-step-something-writes.test.ts'
    - claim: "dispatch-stall fires on the 2026-10-11 recycle-hold replay"
      proof: 'grep: test("W1-T8233: dispatch-stall fires on the recycle-hold replay" in test/every-incident-rule-reads-a-step-something-writes.test.ts'
    - claim: "no-merges-with-green-queue fires on awaiting-arm dispositions with no verdict.merged"
      proof: 'grep: test("W1-T8233: no-merges fires on awaiting-arm with no verdict\.merged" in test/every-incident-rule-reads-a-step-something-writes.test.ts'
    - claim: "each rule declares the steps it reads"
      proof: 'grep: INCIDENT_RULE_INPUTS in src/lib/incident-invariants.ts'
  falsifier: |
    Leave both rules on their current inputs. The census then names queue.priority_snapshot and queue.merge_ready
    as inputs with no writer, and both replay tests read no finding, because the rules see no queued-priority count
    and no merge-ready count in rows the fleet actually writes.
