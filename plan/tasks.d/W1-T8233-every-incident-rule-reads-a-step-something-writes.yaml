- id: W1-T8233
  title: "THE FLEET-STALL PAGE CAN NEVER FIRE — sre-governor's \"fleet built nothing for hours\" fast burn is the dispatch-stall and no-merges-with-green-queue invariants, which read queue.priority_snapshot, queue.merge_ready and pr.merged; nothing writes the first two and pr.merged had no row in 24 h, so neither rule fired through a 52-minute recycle stall or four core pauses on 2026-10-11"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — every incident rule and runbook is reachable from something the fleet writes
  band_meaning: span
  origin: "2026-10-11 detection research: the SRE pipeline has links that no writer feeds"
  plan_refs: [W1-T4384, W1-T4386, W1-T4390, W1-T5651, W1-T5355]
  files: [src/lib/incident-invariants.ts, test/incident-invariants.test.ts, test/every-incident-rule-reads-a-step-something-writes.test.ts]
  status: queued
