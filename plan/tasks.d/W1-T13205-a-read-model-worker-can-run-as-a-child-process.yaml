- id: W1-T13205
  title: "Behind RMD_READ_MODEL_PROCESS=on, serve runs its read-model worker as a child process instead of a thread, so view builds, the projector and their garbage collection stop sharing serve's heap and memory lock"
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # moves a long-lived worker across a process boundary; behind a default-off switch, the thread path is unchanged
  band_meaning: span
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T10290
    - W1-T9754
  files:
    - src/lib/read-model-worker.ts
