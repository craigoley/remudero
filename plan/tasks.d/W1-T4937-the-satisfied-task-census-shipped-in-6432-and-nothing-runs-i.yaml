  plan_refs: [W1-T3961, W1-T1053, W1-T2477, W1-T4111, W1-T4861, W1-T4904, W1-T3558]
  files: [src/run-task.ts, docs/cli-reference.md, test/proof-queue-audit-names-a-task-whose-proofs-pass.test.ts]
