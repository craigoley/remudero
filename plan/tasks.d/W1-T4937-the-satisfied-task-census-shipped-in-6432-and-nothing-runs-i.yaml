  falsifier: |
    Remove the `censusSatisfiedTasks` call from `proofQueueAuditCommand` and the first test sees no `passes-at-main` block for a
    fixture reproducing W1-T3558 (three name-filtered proofs, all passing): it fails. Make the audit exit non-zero on a hit and
    the fourth test fails.
