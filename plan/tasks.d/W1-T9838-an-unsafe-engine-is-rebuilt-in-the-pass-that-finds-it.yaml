- id: W1-T9838
  title: "AN UNSAFE ENGINE IS REBUILT IN THE PASS THAT FINDS IT, NOT ONE PASS LATER — buildEngine still answers `present` for an engine whose recorded sourceHash matches even when W1-T9738 judges its node_modules link dangling or untrusted, so the rebuild waits a full pass for the prune to remove it; on 2026-10-16 ~12:08Z all 16 core engines linked into run worktrees (15 dangling, 1 into a live worktree)"
  repo: remudero
