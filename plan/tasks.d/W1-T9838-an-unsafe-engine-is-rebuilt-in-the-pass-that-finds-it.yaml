  rationale: |
    OBSERVED 2026-10-16 ~12:08Z on the Azure host by the W1-T9738 builder, by readlink only
    (logs-8864/9738-live-readlink.txt): /home/craigoleyagent/rmd-state2/state/engines holds 16 engine trees. Every
    `node_modules` link names /home/node/Remudero/worktrees/run-W1-T*/node_modules. 15 of the 16 target worktrees
    are gone; one, run-W1-T9097-1792149779855, is live.
    READ at W1-T9738's head 9ec691674 (PR 12345, open; src/lib/engine-tree.ts; symbols, not lines):
    - buildEngine returns `{ kind: "present" }` as soon as `readRecord(final)?.sourceHash === sourceHash`. It never
      calls engineModules, so a published engine whose link is dangling or untrusted is still `present`, and no
      engine is built.
    - newestCurrentEngine skips that engine (`engine.candidate_skipped`, reason `node-modules-<kind>:`).
    - pruneEngineTrees keeps the newest engine only while its modules are safe, and removes an unsafe one unless a
      live run names it (namedByLiveRuns). The engine directory is keyed by sourceHash, so only after that removal
      does the next store fill build it again.
    INFERRED from the code, not measured: for a revision whose engine is unsafe, run children get no current engine
    for one whole pass (until prune, then the next fill). After W1-T9738 deploys, all 16 live engines are in that
    state at once.
  design: |
    1. buildEngine judges a present engine's modules with engineModules (the recorded nodeModulesTarget and the same
       worker-writable roots). A safe engine stays `present`.
    2. An unsafe engine that no live run names (the namedByLiveRuns answer the prune uses) is removed through
       removeEngineDir and rebuilt in the same call. The engine.built row says it replaced an unsafe engine (its
       node-modules-<kind> reason).
    3. An unsafe engine that a live run names, or a pass where the live-run answer is undecidable, is left in place.
       The call returns a typed failure (`engine.build_failed`, reason naming the kind and that it is held). It is not
       `present`. The prune's existing rule then decides it.
    4. A concurrent call still joins the one in flight (ensureEngineTree's inFlight key). No new constant.
    Tests go in test/an-unsafe-engine-is-rebuilt-in-the-pass-that-finds-it.test.ts, titled verbatim as in the
    proofs. Use a real state root: a published engine whose node_modules link dangles, and one linked under the
    worktrees root.
  acceptance:
    - claim: "a present engine whose node_modules link dangles or resolves into a worktree, named by no live run, is rebuilt in the same call and linked to the install"
      proof: 'grep: test("W1-T9838: an unsafe engine no run names is rebuilt in the same pass" in test/an-unsafe-engine-is-rebuilt-in-the-pass-that-finds-it.test.ts'
    - claim: "an unsafe engine a live run names is left in place and reported as a held failure, not present"
      proof: 'grep: test("W1-T9838: an unsafe engine a live run names is held, not present" in test/an-unsafe-engine-is-rebuilt-in-the-pass-that-finds-it.test.ts'
    - claim: "a present engine with a trusted link is still present and not rebuilt"
      proof: 'grep: test("W1-T9838: a safe present engine is not rebuilt" in test/an-unsafe-engine-is-rebuilt-in-the-pass-that-finds-it.test.ts'
  falsifier: |
    At W1-T9738's head, publish an engine with the matching sourceHash and a dangling node_modules link, then call
    ensureEngineTree. It returns `present` and builds nothing, so the first test fails. It also returns `present` for
    an unsafe engine a live run names, so the second fails. The third passes before and after; it guards against a
    fix that rebuilds every present engine.
