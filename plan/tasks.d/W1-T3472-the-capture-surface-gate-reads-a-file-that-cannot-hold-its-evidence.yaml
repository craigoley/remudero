    - claim: "below CAPTURE_MIN_FIRES the check still declines to judge and still says so, so a fresh host is never failed on an unobserved population"
      proof: "unit test: test/the-capture-surface-gate-reads-a-file-that-cannot-hold-its-evidence.test.ts"
