    - claim: "a background pass still running at exit is awaited"
      proof: 'grep: test("W1-T8170: a running background pass is awaited at exit" in test/a-latched-restart-exits-when-its-last-lane-settles.test.ts'
    - claim: "the restart row names which pre-exit pass arm ran"
      proof: 'grep: test("W1-T8170: the restart row names its pre-exit pass" in test/a-latched-restart-exits-when-its-last-lane-settles.test.ts'
  falsifier: |
    Keep stopForFreshness as on main: in the first test the injected sweep is called once more after the last lane
    settles although a pass completed after the latch. Skip the pass unconditionally: the second test sees a stale
    exit with no full pass since the latch and no sweep call.
