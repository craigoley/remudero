  title: "A loop-available deadline still expires when the loop is held at every one of its firings: the late-firing re-arm keeps its intent (a child is never charged for time the loop stole) but its total grace is bounded by the deadline's own budget, so the gh/git child bounds hold exactly when core's loop is held for minutes"
