- id: W1-T978
  title: "A REPLACED CONTAINER CAN NEVER RECLAIM ITS OWN ABANDONED LOCK — isHolderStale's rung 1 returns not-stale for any host that is not this one, and os.hostname() inside a container IS the container id, so every restart mints a new identity and the previous instance's drain.lock reads as a foreign machine's live lock forever: the daemon refused every boot until a human deleted the file"
  repo: remudero
  risk: high
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    MEASURED DURING A LIVE OUTAGE ON THE AZURE HOST, 2026-08-18, origin/main 8257809.

    (1) THE PREDICATE. `isHolderStale` (src/lib/fs-race-safe.ts) opens with rung 1, added by
    W1-T396: `if (held.host !== myHost) return false;` — "unverifiable from here, so not stale".
    Its own comment explains the ordering: every rung below reasons about THIS machine's process
    table, which describes the recorded holder only when the recorded holder ran here.

    (2) THE IDENTITY IT COMPARES IS PER-CONTAINER, NOT PER-MACHINE. `acquireDrainLock`
    (src/lib/drain-lock.ts) records `host: opts.info?.host ?? hostname()`. Inside a container
    `os.hostname()` returns the CONTAINER ID. VERIFIED DIRECTLY: `hostname` run inside the
    long-running `remudero-serve` container prints `6d7656019997`, which is that container's own
    id. Docker mints a new id on every container replacement, so the daemon's identity changes
    under it while `state/` — a bind mount — keeps the old lock.

    (3) THE OUTAGE, AS OBSERVED. state/drain.lock held
    `{"pid":46,"host":"5efb86ede91b","startedAt":"2026-08-18T02:04:23.465Z"}`. Container
    `5efb86ede91b` returned ZERO matches in `docker ps -a` — it no longer existed. The replacement
    container was `eae16667008a`. Rung 1 compared `5efb86ede91b` against `eae16667008a`, found
    them different, and returned NOT STALE. Every boot then printed
    "rmd daemon REFUSED — a drain/daemon is already running (pid 46 on 5efb86ede91b …)" and
    exited. It never self-cleared, and could not have: the comparison can only ever fail again.

    (4) AND THE FAILURE SPENT THE WRONG BUDGET. The refusal exits 1, not the freshness code 75, so
    the entrypoint's in-container freshness loop — which absorbs routine restarts precisely so
    they do not spend docker's allowance — never applied. Every attempt went straight to docker's
    count. `RestartCount` reached 5 of `on-failure:5`, docker stopped restarting, and the fleet
    stayed down until an operator removed the file by hand.

    (5) IT CANNOT HAPPEN ON THE MINI, WHICH IS WHY IT SURVIVED. Under launchd the hostname is
    stable (`Craigs-Mac-mini`), so a relaunched daemon compares its own identity against itself,
    rung 1 passes through, and rungs 2 and 3 adjudicate normally. The defect is reachable only
    where the recorded host is ephemeral — that is, only in a container.

    (6) THE REPO ALREADY KNOWS HOW TO ASK THIS QUESTION. `resolveHostPole`
    (src/lib/host-parity.ts) takes `inContainer: boolean` as an INJECTED input — "Injected rather
    than stat'ed here so this module never touches the filesystem; the runner passes the real
    check" — keyed on Docker's own `/.dockerenv` marker. So a container-aware discriminator is
    established prior art in this codebase, not a new idea.
  design: |
    (i) WHAT THE FIX MUST NOT DO — REMOVE OR WEAKEN RUNG 1. The foreign-host caution is CORRECT
    for real machines and W1-T396 added it deliberately: this machine's process table says nothing
    about a pid that ran somewhere else, and asking it anyway is how a live holder on another host
    gets its lock stolen. Rung 1 must keep returning not-stale for a genuinely different machine.
    Criterion 2 is that falsifier and must fail if the check is simply dropped.

    (ii) AND IT MUST NOT SIMPLY FALL THROUGH TO PID LIVENESS IN A CONTAINER. This is the
    attractive wrong fix. A container has its OWN PID NAMESPACE and pids restart from 1 — MEASURED
    HERE: the abandoned lock named pid 46 and the replacement daemon came up as pid 49. So a
    stale lock's recorded pid very plausibly names a LIVE, UNRELATED process in the new container,
    and rung 2 would report it alive; worse, in the other direction, skipping straight to rung 2
    would let a lock be reclaimed on the strength of a pid that means nothing across the boundary.
    Rung 3 (`startedAt` vs the pid's real start time) narrows this but cannot carry it alone: it
    returns `null` when the probe is indeterminate and the function then falls through to
    not-stale. Criterion 3 is the falsifier for this arm.

    (iii) WHAT IS NEEDED IS A DISCRIMINATOR THAT SEPARATES "ANOTHER MACHINE" FROM "A REPLACED
    CONTAINER SHARING THIS STATE DIRECTORY". The two cases are indistinguishable from `held.host`
    alone, which is the whole defect. The substrate that actually distinguishes them is the one
    the lock already lives on: `state/` is a bind mount, so a holder that wrote into THIS state
    directory was, by construction, this cell — whatever container id it happened to carry. An
    implementer may key on that, or on a stable cell identity persisted beside the lock, or on
    `/.dockerenv` plus the state root; what the choice must satisfy is criteria 1 through 3
    together, which no single-rung shortcut does.

    (iv) THE SEAM ALREADY EXISTS AND IS ADDITIVE. `IsHolderStaleOpts` already carries optional
    injected `getProcessStartTime` and `hostname`, each documented as injectable so a test can
    simulate a condition it cannot create for real. A further optional input follows that shape
    exactly, defaulted to the real probe so no call site changes. That default is what keeps this
    change to two files — see the note.

    (v) THE MODULE MAY DO ITS OWN PROBE, UNLIKE host-parity.ts. `resolveHostPole` injects
    `inContainer` because that module has NO imports and values purity. `fs-race-safe.ts` already
    imports `node:fs` (`statSync`, `readFileSync`, `openSync`) and `node:os`, so a defaulted probe
    here costs nothing this module was not already paying. Criterion 4 covers the default arm,
    because a seam every test injects ships its real implementation unexercised.

    (vi) EXPLICITLY OUT OF SCOPE.
      - `src/lib/inflight-lock.ts` AND `src/lib/review.ts`, which record `host` the same way and
        share the exposure. Because (iv) makes the new input DEFAULTED, both inherit the corrected
        predicate without being edited. If an implementer finds they must be touched, they must
        amend this shard to declare them first rather than overrunning.
      - THE EXIT CODE. Rationale (4) is a real compounding factor — a refusal exiting 1 spends
        docker's budget where 75 would not — but changing which code the refusal exits with is a
        different decision with a different blast radius, and it does not fix the lock. Named here
        so it is not silently absorbed.
      - THE DOCKER RESTART POLICY (`on-failure:5`). The operator's, deliberately left alone; the
        entrypoint's own header explains why an unbounded policy is not wanted.
      - HOST IDENTITY ON LEDGER ROWS AND ESCALATION BODIES — that is W1-T972, the sibling. See the
        note for how the two relate.
  acceptance:
    - claim: "a lock left by a replaced container that wrote into this same state directory is reclaimed rather than read as foreign"
      proof: "unit test: W1-T978: a replaced container's own abandoned lock is reclaimable"
    - claim: "a lock recorded by a genuinely different machine is still never reclaimed so the foreign-host caution survives"
      proof: "unit test: W1-T978: a lock from a genuinely different machine is still never reclaimed"
    - claim: "a live unrelated process that happens to reuse the recorded pid does not by itself make the lock reclaimable"
      proof: "unit test: W1-T978: a live process reusing the recorded pid does not make a lock reclaimable"
    - claim: "the discriminator runs its real probe when nothing is injected so the default arm is exercised"
      proof: "unit test: W1-T978: the container discriminator runs its real probe when nothing is injected"
