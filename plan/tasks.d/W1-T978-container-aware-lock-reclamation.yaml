  note: |
    W1-T972 IS THE SIBLING, NOT THE DUPLICATE, AND THIS IS THE SAME ABSENCE SEEN FROM A THIRD
    SURFACE. W1-T972 (open as #2098) files that a ledger row and an escalation body carry no host
    identity at all. This one is narrower and worse: the lock DOES carry a host field, and the
    value it carries is ephemeral, so the field actively misleads a predicate that depends on it.
    Neither subsumes the other — W1-T972 adds an identity where none exists, this one makes an
    existing identity usable across a container boundary — and the two share no declared file.

    FILES ARE TIGHT BECAUSE THE NEW INPUT IS DEFAULTED. `isHolderStale` is DECLARED in
    src/lib/fs-race-safe.ts, which is where the rung-1 comparison lives; word-bounded invocation
    counts put its consumers at src/lib/inflight-lock.ts = 9, src/lib/status.ts = 5,
    src/lib/worker.ts = 4, src/lib/drain-lock.ts = 3 and src/run-task.ts = 1, and design (iv)
    keeps every one of them unedited. The suite is test/stale-lock-host-ordering.test.ts — it is
    named for rung 1 and carries 38 host-rung references against 22 in
    test/lock-holder-identity.test.ts, which owns a different question. src/run-task.ts is NOT
    declared: nothing about this change reaches it, and declaring it would serialize this task
    against the 103 of 277 shards that already name it (W1-T471) for no benefit.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `moduleIdFromPath` strips
    the `.test` segment, so the two declared paths resolve to the distinct subsystem ids
    `fs-race-safe` and `stale-lock-host-ordering` — two, which is `sizingViolation`'s threshold,
    so no file list satisfying this task's own scope passes at risk:medium. Blast radius argues
    DOWN: one added optional input and one narrowed branch, with every existing call site
    untouched by construction.

    THE MEASUREMENT IS REPRODUCIBLE WITHOUT RE-BREAKING ANYTHING. `hostname` inside any container
    on this host prints that container's id — checked against `remudero-serve`, which printed
    `6d7656019997` matching `docker inspect --format '{{.Id}}'`. The live drain.lock written by the
    recovered daemon reads `{"pid":49,"host":"eae16667008a",...}`, the CURRENT container id, so the
    pattern is visible in a healthy fleet and needs no outage to confirm.

    PROOF NOTES. All four criteria use the NAME-FILTERED `unit test:` form with a bare title, never
    the pure-path form — a path proof against test/stale-lock-host-ordering.test.ts would pass on
    any of that suite's existing rung-1 tests and prove nothing about this change. Each title is
    plain prose under 100 characters with ZERO commas, no `"; "` and no regex metacharacter, so
    `looksLikeScenarioNarrative` cannot fail proof-resolvability, and the executor compiles a bare
    title as an ESCAPED LITERAL so no character in them acts as a wildcard. All four were checked
    with `grep -rlF` over test/ to match 0 files today against a control title matching 1 — forward
    references to titles this task creates, and titles rather than symbol names, so nothing here
    guesses an identifier. THERE IS DELIBERATELY NO `grep:` CRITERION: the only tokens that would
    discriminate head from base are identifiers this task has not written yet, and a `grep:` naming
    this shard's own path is refused by `proof-scope` as outside the declared `files:`.

    ID PROVENANCE — FOUR SURFACES, EACH CONTROLLED, PLUS A RESERVATION MINTED WITH THE PLAIN
