  rationale: |
    WHY: a filing PR stayed red for hours on a refusal whose exact cure the gate itself prints.
    #19604 (head run-unfiled-1795065953000, opened 2026-11-19 05:32:43Z) added three shards whose ids were
    reserved for branch run-unfiled-1795065820000 (refs/rmd-id/W1-T13787 records `holder
    branch=run-unfiled-1795065820000 ... started_at=2026-11-19T05:24:07.232Z`). That branch has no head on
    origin. task-id-existence refused the ids as "HELD by a different reservation holder" and printed the
    remedy line for each one.
    WHAT THE FLEET DID (ledger): the sweep classed it "plan-only PR is red on task-id-existence — the
    code-fix lane cannot stage outside a plan filing, so no fix is dispatched; the plan violation needs a
    plan repair". The parked-PR remedy fix-on-pr was taken twice at head bc2b0c6 (06:10:18Z and earlier
    05:44:24Z) and "left the head, the body and the red checks unchanged". No plan round row and no fix
    worker row exist for the PR. A needs-human issue opened at 06:14:03Z. The PR stayed red until a hand
    commit added the three `reservation hand-off: run-unfiled-1795065820000 -> run-unfiled-1795065953000`
    lines at 11:13:50Z; it merged at 11:35:05Z.
    WHY THE EXISTING RUNG DID NOT ACT: decidePlanRepair's held-task-id rung renumbers, and only on a fleet
    machine-lane head with a fleet author. A hand filing is neither. Renumbering a hand filing would also
    change ids the author may have quoted elsewhere; the hand-off keeps them.
    SCALE: 82 commits on origin/main since 2026-11-05 add a `reservation hand-off:` line under plan/tasks.d.
    SAFETY: the reservation guard stops two filers using one id. W1-T6026 already lets any reserver take
    over a holder whose branch is absent past RESERVATION_PUSH_GRACE_MS (2 h). Handing off under the same
    proof is no weaker than that reclaim. On #19604 it would have acted near 07:24Z, not 11:13Z.
  design: |
    INVARIANT only-the-gates-line: the repair writes only the hand-off line task-id-existence printed, for this PR's own head as filer.
    INVARIANT holder-is-abandoned: no hand-off while the holder branch exists, heads an open PR, or its reservation is younger than RESERVATION_PUSH_GRACE_MS.
    INVARIANT one-line-per-shard: the edit adds one note line per named shard and nothing else.
    INVARIANT once-per-head: at most one hand-off attempt per PR head.
    1. PlanRepairDecision gains `{ signature: "held-task-id-handoff"; action: "handoff"; check:
       "task-id-existence"; handoffs: { id; holder; filer; files: string[] }[] }`. A parser beside
       heldTaskIdsFromCiFailures reads the HELD section's `<id> -- ...`, its `<file>:<line>` lines and the
       printed `reservation hand-off: X -> Y` line (scripts/task-id-existence-check.mjs prints it alone on its
       line, W1-T3648).
    2. decidePlanRepair returns it, before the fleet-lane renumber rung, for any plan-only head whose
       parsed filer equals pr.headRefName, when no `${head}@held-task-id-handoff` key is in history.
       The renumber rung for fleet lanes keeps its order after it only when this rung does not apply.
    3. repairPlanPr's real wiring gets a `handoff` branch, handOffHeldPlanPrIds: for each holder, read
       `git ls-remote --heads origin <holder>` (empty required), the open-PR list's head refs (no match
       required), and the reservation ref's holder line started_at (older than RESERVATION_PUSH_GRACE_MS,
       read with the sweep's clock). Any failed or unreadable test returns outcome "stood-down" with the
       reason. Else cut a worktree of the PR head as renumberPlanPrIds does, add the line to each named
       shard's note with the yaml Document API, commit "chore(plan): record the reservation hand-off for
       <ids>" and push with a lease on pr.headSha. The outcome row is the existing sweep.plan_repair row.
    4. No new constant, env var or config key. src/lib/sweep.ts has a comment cap
       (test/sweep/compress-src-lib-sweep-ts.test.ts). Re-run the existing plan-repair suites in test/sweep/.
  note: |
    files: amendment 2026-11-20, operator grant (Craig 14:30Z, approving the recommendation on #19856): the fix round on #19701
    at ae4602406 found that the gate prints the standalone hand-off remedy only for a `branch=unknown` holder, so a named holder
    gets a refusal with no pasteable line, though the gate already accepts a matching note. scripts/task-id-existence-check.mjs
    prints that existing remedy for a named holder too; what the gate accepts does not change.
    test/a-reservation-names-its-holder.test.ts pins exactly one remedy block and now pins one per handable holder.
