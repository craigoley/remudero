- id: W1-T968
  title: "THE ARM REPORT ANSWERS ABOUT THE CALL WHILE THE OPERATOR IS ASKING ABOUT THE PR — armReportPhrase is a pure function of one enum, so a PR the review lane armed three seconds earlier prints NOT armed the moment the redundant second gh pr merge --auto returns arm-error-ignored: consult the arm the ledger already recorded for this head before choosing the phrase"
  repo: remudero
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    FILED FROM A RECON RE-DERIVED AT origin/main 3d91969 (six commits past the b316693e the
    briefing read). EVERY CLAIM BELOW WAS RE-READ AT 3d91969; three briefing claims did NOT
    survive and are corrected in the note.

    (1) THE PHRASE IS A PURE FUNCTION OF ONE ENUM. `armReportPhrase` (src/run-task.ts) is a
    single expression — `armOutcomeArmed(outcome) ? "armed (…)" : "NOT armed (…)"` — with no
    ledger read, no PR read and no argument other than the outcome of the call that just
    returned. It has five call sites, all the same shape: the dep-review lane, `retroCommand`,
    `triageCommand`, the plan lane and `rmd approve`. VERIFIED: six word-bounded hits in
    src/run-task.ts and zero in src/lib/ledger.ts, src/lib/sweep.ts, src/lib/status.ts and
    src/lib/analytics-route.ts, against a control symbol reading zero in all five.

    (2) THE MECHANISM, READ FROM SOURCE RATHER THAN INFERRED. In `triageCommand` the sequence is
    `waitForCiGreen` then `reviewCommand(prNum)` then `armAndLogOutcome(prUrl, taskId, log)` then
    the `say` carrying `armReportPhrase`. `reviewCommand` reaches `runReview`, whose body calls
    `armIfVerdictPermits`; on a full PASS that already arms and already ledgers through
    `logArmAttribution` with `lane: "review"`, `head_sha`, `task_id`, `pr_number` and `pr_url`.
    The later `armAndLogOutcome` therefore issues a SECOND `gh pr merge --auto` against a PR that
    is already armed. `attemptArm` catches the resulting error, `armFailureAction` classifies it
    as not the clean-status case, and the branch returns `arm-error-ignored` — glossed in
    `armOutcomeReason` as treated as transient and left for the next sweep pass. `armOutcomeArmed`
    (src/lib/sweep.ts) is TRUE only for `armed` and `direct-merged`, so the phrase renders NOT
    armed for a pull request that is armed.

    (3) THE DISTINCTION IS THE WHOLE DESIGN, AND IT IS NOT A BUG IN `armOutcomeArmed`. That
    predicate is correct: `arm-error-ignored` genuinely means THIS CALL armed nothing, and the
    sweep depends on that reading to retry. The defect is that the console line describes the CALL
    while the operator reading it is asking about the PULL REQUEST. Nothing else changes.

    (4) THE REPORTING PATH CAN REACH THE LEDGER, AND THE COST WAS MEASURED. All five sites live in
    src/run-task.ts and each already holds `ledgerPath` as a local — every one builds a lane
    closure of the form `appendLedger(ledgerPath, …)`. `readLedgerLines` (src/lib/status.ts) is
    already imported into that module and already invoked on this exact path: `realArmDeps`
    supplies `ledgerLines: () => readLedgerLines(ledgerPathFor(loadConfig()))`, which
    `armAutoMerge` calls before it ever reaches `attemptArm`. So the marginal cost is ONE
    additional full read of the LIVE ledger file per lane invocation — `readLedgerLines` reads the
    live path only and JSON-parses every line, measured on this host at 8055 lines and 2254162
    bytes. It is PER CALL, not per pass; but each of the five sites runs once per command
    invocation rather than inside a per-PR loop, so it is not a hot path in the sweep sense.

    (5) THE WINDOW IS THE HEAD SHA, NOT A CLOCK, AND THERE IS ONE MEASURED OBSTACLE. Keying on the
    head is the repo's own idiom — `decideArmFromLedgerVerdict` and `cappedOverrideFromLedger`
    both take `headSha` — and it needs no recency bound: a prior arm on THIS head is the fact, and
    a new head genuinely deserves a fresh attempt. THE OBSTACLE: the row the operator lanes write
    carries NO head sha. `armAndLogOutcome` passes `{ outcome }` as its whole extra, while
    `armIfVerdictPermits` passes `head_sha` explicitly; and `armAutoMerge` resolves the head
    internally through `deps.headSha` and DISCARDS it. The reporting site must therefore obtain
    the head itself. `readHeadShaRest` is exported from the same module and its own doc states it
    reads over REST and never `gh --json`, which is the call to use.

    (6) `arm-error-ignored` IS NOT THE ONLY OUTCOME WITH THIS SHAPE. `armOutcomeArmed` maps five
    outcomes to false. `head-unavailable` has the SAME shape: it is returned when `deps.headSha`
    throws, before any arm is attempted, and a failed head read says nothing whatever about
    whether the pull request is armed — a PR the review lane armed seconds earlier reports NOT
    armed. The remaining three do not: `ledger-refused` fires only when no `review.posted` matches
    the current head, which cannot co-occur with a review-lane arm ON that head; `no-task-id`
    returns before any attempt and every one of the five sites passes the same task id it used
    moments earlier; and `direct-merge-failed` arises from the clean-status branch, a different
    state. Both lying outcomes are corrected by the same read, which is why this task scopes to
    the read and not to an outcome list.

    (7) THE REGISTRATION IS A HARD BUILD CONSTRAINT, MEASURED. `DECISION_RELEVANT_LEDGER_STEPS`
    (src/lib/ledger.ts) does NOT contain `automerge.armed` today — it carries
    `automerge.capped_override_granted` and nothing else from that family. And
    test/ledger-rotation.test.ts re-derives the expected set from a `consumerFiles` list that
    INCLUDES `../src/run-task.ts`, scanning it with a regex over `.step === "…"`. So the moment
    this task writes such a comparison in src/run-task.ts, that test fails unless the step is
    registered. Two consumers already read the step without it being registered —
    src/lib/autonomy.ts and src/lib/verdict-calibration.ts — so the gap predates this task; this
    task must not inherit it silently.
  design: |
    THE SHAPE: one predicate over lines the ledger already carries, consulted at the five sites
    that already print the phrase. No new mechanism, no new ledger step, no console route.

    (i) ONE EXPORTED PREDICATE, PURE OVER LINES. Something of the form
    `priorArmOnHead(lines, prUrl, headSha)` — given already-read ledger lines, does a
    `automerge.armed` row exist for this pull request on this head. PURE and EXPORTED so the
    falsifiers assert on the predicate rather than on a mock's call count, exactly as
    `armReportPhrase`'s own doc says it was made pure for that reason.

    (ii) THE PHRASE GAINS THE FACT, NOT A SECOND RULE. `armReportPhrase` keeps its enum argument
    and gains the prior-arm fact as an additional input. It must NOT re-derive which outcomes
    count as armed — that rule lives in exactly one place, `armOutcomeArmed`, and this task does
    not touch it. A builder who edits `armOutcomeArmed` has changed what the sweep retries and is
    no longer building this task.

    (iii) THE KEY IS THE PULL REQUEST PLUS THE HEAD. `pr_url` is present on every row
    `logArmAttribution` writes; `head_sha` is present on the review-lane row, which is the row
    that matters because it is the one that actually armed. Matching on `pr_url` alone would claim
    arming across a re-head, which criterion 3 exists to refuse.

    (iv) THE HEAD IS READ OVER REST. `readHeadShaRest` is already exported from src/run-task.ts.
    A builder must not substitute `gh pr view --json`: that path is GraphQL, and this account's
    GraphQL budget has been exhausted repeatedly.

    (v) THE STEP MUST BE REGISTERED IN THE SAME CHANGE. See rationale (7). Criterion 5 tests the
    registration directly rather than leaving it to be discovered when the rotation test reddens.

    (vi) THE FALSIFIER IS A TRIPLE AND MUST RUN IN ONE INVOCATION. A function that always answers
    armed passes criterion 1 and fails criterion 2; one that never answers armed does the reverse;
    one that ignores the head passes both and fails criterion 3. All three must run in the same
    suite invocation or the pair is unverified.

    (vii) OUT OF SCOPE, WITH REASONS. src/lib/sweep.ts is NOT declared: `armOutcomeArmed` lives
    there and must not move. The `lane` field having exactly one reader across src/ is ADJACENT
    and deliberately left alone — see the note. And no new ledger step is introduced; this task
    reads what the arm already writes.
