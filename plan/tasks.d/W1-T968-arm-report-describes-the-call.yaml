    - claim: "a ledger carrying no prior arm still makes the phrase report not armed"
      proof: "unit test: W1-T968: no prior arm reports not armed"
    - claim: "a prior arm recorded against a different head sha still makes the phrase report not armed"
      proof: "unit test: W1-T968: a prior arm on a different head reports not armed"
    - claim: "the head-unavailable outcome is corrected by the same read rather than left lying"
      proof: "unit test: W1-T968: head unavailable with a prior arm on this head reports armed"
    - claim: "the step the new read consults is registered so a rotation cannot archive the evidence"
      proof: "unit test: W1-T968: automerge armed is registered in the decision relevant ledger steps"
    - claim: "the phrase must answer about the pull request rather than about the call"
      proof: "grep: the phrase must answer about the pull request rather than about the call in plan/tasks.d/W1-T968-arm-report-describes-the-call.yaml"
