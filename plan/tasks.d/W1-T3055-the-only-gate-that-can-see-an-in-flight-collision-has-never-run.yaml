- id: W1-T3055
  title: "THE ONE CHECK THAT CAN SEE AN IN-FLIGHT ID COLLISION HAS NEVER RUN — `task-id-existence`'s open-PR half shells `gh api` from the only `gh`-using job in `ci.yml` that passes no token, so every run since it shipped has logged SKIPPED and exited 0, and an unreadable surface is rendered as a clean gate"
  repo: remudero
