  rationale: |
    W1-T11423 adds ledgerRowsFor and seeds the census allowlist with every reader in its inventory that still asks a keyed question by scanning the whole union, or streams whole history with no digest. This task moves each one, so the allowlist is left with only whole-history aggregates that reduce each immutable archive once (ledgerRotationDigests). The 2026-11-05 core OOMs (4.0 GB under readLedgerUnionRecordsSync from dep-review proposalProgress) and the 11-04 hung reviews (priorPostedReviewRow) were both keyed questions. proposalTaskLedgerRows, which powers dep-review's proposalProgress, lives in src/lib/dep-review.ts and is the keyed task-id reader named by the design. impossibleCanaryCommand also reads the full union but retains only the two impossible_canary.* step kinds to seed per-model cadence; its rows have exact step keys the W1-T11423 index can select, so it belongs in this migration and the census allowlist should not keep it. The controlled field-trials reader also refuses malformed source rows; ledgerRowsFor lives in src/lib/ledger-union.ts, so include that module to add a malformed-row callback and preserve the existing refusal contract during keyed reads. The index must also remember torn rows in skipped archives: src/lib/ledger-key-manifest.ts builds that manifest, and without its torn flag a strict keyed read could incorrectly succeed.
    pr-state clarification (PLAN-clarify-1794147351964). On Azure, a fresh `rmd pr-state` read printed nothing and exited 134 after about 58 s, at V8's 4 GB heap limit. prStateCommand calls openLedgerUnion with no `where`, `step` or `dedupe` option, so the union's whole-corpus `seen` Set keeps every unique raw ledger line, even though fold() keeps only requested-PR rows and sweep.pass timestamps.
    Settled by lookup: is the pr-state memory bound already filed or decided elsewhere? -> No. It appears only here (item 2 listed pr-state as a digest reader) and on the census allowlist as pr-state.ts#<module>. No other plan task, LEARNINGS or DECISIONS entry names it (plan/tasks.d, LEARNINGS.md, DECISIONS.md).
    Settled by lookup: is the projection idempotent enough for `dedupe: false`? -> No. put() and the head_sha switch accept a row whose ts is >= the current as_of. A replayed row X folded again after a distinct same-PR row Y with an equal ts overwrites Y, and on a head change it also deletes checks, mergeability, review and auto-merge. Base dedupe drops X's replay, so `dedupe: false` changes output on ties (src/lib/pr-state.ts put/fold).
    Settled by lookup: can the existing keyed reader ledgerRowsFor serve it? -> No. Its query ANDs `steps` with keys, so one query cannot ask for requested PRs OR sweep.pass. Two queries would change row order and with it the tie semantics. It also passes no onMalformedRow or onUnreadDirectory hook, and it materialises the rows (src/lib/ledger-union.ts ledgerRowsFor, src/lib/ledger-key-manifest.ts ledgerRowMatchesKeys).
    Settled by lookup: what is the existing narrowest bound? -> openLedgerUnion's `where` option, applied after parsing and malformed-row reporting but before the replay Set. It is documented "so the replay Set holds only the rows this read keeps" (src/lib/ledger-union.ts OpenLedgerUnionOptions.where and the filter-before-dedupe block).
    Settled by lookup: does `where` discharge the census? -> No. Callback properties cannot bound a call (test/ledger/no-long-lived-code-reads-the-whole-ledger-union.test.ts, W1-T11423 criterion 3), so pr-state's passthrough seam stays allowlisted with a reason that names this bound.
    Settled by lookup: does a test observe the Set? -> Yes, indirectly. With dedupe on and no per-step window, openLedgerUnion calls onAcceptedRecord exactly once per line it adds to `seen`, so an accepted count equals the Set's size (src/lib/ledger-union.ts).
  design: |
    1. Keyed readers: proposalProgress (task ids of the proposal's tasks), priorPostedReviewRow (the PR number, plus step review.posted), human-gate measureFeedbackAge (its feedback steps), field-trials readControlledLedgerRows and routing-experiments (their steps), and impossibleCanaryCommand (steps impossible_canary.attempt and impossible_canary.cheating_event, then latest timestamp per model). Each calls ledgerRowsFor with the narrowest key it has. Each keeps its refusal and unread contracts, and an unindexed archive still counts as read in full.
    2. Whole-history readers (the pr-owner projection, retro, the analytics snapshot, benchmark-cohort, field-trials readFieldTrialsLedger; pr-state is NOT one, see 4) pass a ledgerRotationDigests hook with a reducer equal to their own filter, so each archive is decompressed once per holder and reducer version, not once per pass.
    3. Each migrated reader leaves the census allowlist; the census test asserts that no keyed reader remains on it. The impossible-canary reader keeps only the two emitted step kinds before deriving latest-run timestamps per model; it never reads canary prompts or holdouts from the ledger.
    4. pr-state memory bound (the narrowest fix; no other pr-state change). In prStateCommand's existing readLedger call, keep every current option (onUnreadArchive, onUnreadLive, onUnreadDirectory, onMalformedRow) and add `where: row => row.step === "sweep.pass" || answers.has(rowNumber(row))`. Use pr-state's own rowNumber(): pr_number first, then the pr_url fallback. Do not use ledgerRowPrNumbers, which matches either field and would admit rows that base assigns to a different PR. Do NOT pass `dedupe: false`, do not switch to ledgerRowsFor, and change nothing in fold(), put(), the freshness and maxAge logic, the broker read, render() or the exit code. The union runs `where` after parsing and malformed-row reporting but before its replay Set (src/lib/ledger-union.ts openLedgerUnion), so: malformed and unread findings are unchanged; a requested PR's invalid-timestamp row is still admitted and still adds its error; dedupe keeps its exact base semantics over the admitted lines; and the Set's size is the number of distinct admitted lines, not the corpus's. Out of scope: heap-limit flags, process killing or restarts, shared deadlines, GitHub broker or routing, consent, and rebounding sweep.pass retention.
       pr-state test (test/ledger/pr-state-reader-memory-bound.test.ts). Synthetic, bounded rows in a temp state dir only, with no provider or field-trial data. (a) Equivalence: one gzip rotation plus a live file. The live file replays archived lines byte for byte, including row X (PR 7, ts T, review_state "a") replayed after a distinct row Y (PR 7, ts T, review_state "b"). The test also carries many rows for unrequested PRs and unrelated steps. The full rendered output and exit code of `pr-state 7` must equal the run over the same corpus with the replays removed: every field, as_of and source. (b) Bound: the test injects readLedger as `(dir, opts) => openLedgerUnion(dir, { ...opts, onAcceptedRecord: () => accepted++ })`. With dedupe on and no per-step window, onAcceptedRecord fires exactly once per line added to the union's Set. Over M unrelated rows plus K distinct admitted lines, accepted must equal K, and K must be far smaller than M. The test also asserts opts.dedupe !== false. (c) Refusal: a truncated gzip rotation prints `ledger unread:`, and a non-JSON line prints `ledger malformed:`. Each forces the broker read and prints STALE with the same reason text as base.
    Tests: for each keyed reader, a state dir where its key lives in k of N archives; the reader opens exactly those k, with the same result as at base. At base, every reader opens all N. The canary case uses both emitted step kinds in separate rotations and unrelated rotations, and proves the selected rows preserve each model's latest timestamp.
  falsifier: |
    At origin/main (with W1-T11423 merged), proposalProgress, priorPostedReviewRow, the human-gate measurement, field-trials' controlled read or impossibleCanaryCommand still open every archive for a keyed question, and the census allowlist still names a keyed reader.
    pr-state: at origin/main, the test's onAcceptedRecord count over M unrelated rows plus K requested-PR and sweep.pass lines equals every distinct line (K+M), not K. After the change, the fix fails if any of these holds: (1) the count exceeds K; (2) the duplicate and tie corpus renders differently from its deduplicated twin, which is what `dedupe: false` would cause; (3) a torn or malformed source no longer prints STALE with its `ledger unread:` or `ledger malformed:` reason.
