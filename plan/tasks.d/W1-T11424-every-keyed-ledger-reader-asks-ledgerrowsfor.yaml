  rationale: |
    W1-T11423 adds ledgerRowsFor and seeds the census allowlist with every reader in its inventory that still asks a keyed question by scanning the whole union, or streams whole history with no digest. This task moves each one, so the allowlist is left with only whole-history aggregates that reduce each immutable archive once (ledgerRotationDigests). The 2026-11-05 core OOMs (4.0 GB under readLedgerUnionRecordsSync from dep-review proposalProgress) and the 11-04 hung reviews (priorPostedReviewRow) were both keyed questions. proposalTaskLedgerRows, which powers dep-review's proposalProgress, lives in src/lib/dep-review.ts and is the keyed task-id reader named by the design. impossibleCanaryCommand also reads the full union but retains only the two impossible_canary.* step kinds to seed per-model cadence; its rows have exact step keys the W1-T11423 index can select, so it belongs in this migration and the census allowlist should not keep it. The controlled field-trials reader also refuses malformed source rows; ledgerRowsFor lives in src/lib/ledger-union.ts, so include that module to add a malformed-row callback and preserve the existing refusal contract during keyed reads.
  design: |
    1. Keyed readers: proposalProgress (task ids of the proposal's tasks), priorPostedReviewRow (the PR number, plus step review.posted), human-gate measureFeedbackAge (its feedback steps), field-trials readControlledLedgerRows and routing-experiments (their steps), and impossibleCanaryCommand (steps impossible_canary.attempt and impossible_canary.cheating_event, then latest timestamp per model). Each calls ledgerRowsFor with the narrowest key it has. Each keeps its refusal and unread contracts, and an unindexed archive still counts as read in full.
    2. Whole-history readers (the pr-owner projection, retro, the analytics snapshot, pr-state, benchmark-cohort, field-trials readFieldTrialsLedger) pass a ledgerRotationDigests hook with a reducer equal to their own filter, so each archive is decompressed once per holder and reducer version, not once per pass.
    3. Each migrated reader leaves the census allowlist; the census test asserts that no keyed reader remains on it. The impossible-canary reader keeps only the two emitted step kinds before deriving latest-run timestamps per model; it never reads canary prompts or holdouts from the ledger.
    Tests: for each keyed reader, a state dir where its key lives in k of N archives; the reader opens exactly those k, with the same result as at base. At base, every reader opens all N. The canary case uses both emitted step kinds in separate rotations and unrelated rotations, and proves the selected rows preserve each model's latest timestamp.
  falsifier: |
    At origin/main (with W1-T11423 merged), proposalProgress, priorPostedReviewRow, the human-gate measurement, field-trials' controlled read or impossibleCanaryCommand still open every archive for a keyed question, and the census allowlist still names a keyed reader.
