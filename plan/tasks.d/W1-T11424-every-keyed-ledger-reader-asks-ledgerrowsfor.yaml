    - claim: Dep-review proposalProgress, the review prior-verdict lookup, the human-gate measurement and field-trials' controlled read answer their task, PR or step questions through ledgerRowsFor, opening only the archives that hold their keys
      proof: "unit test: test/ledger/keyed-ledger-readers-ask-ledgerrowsfor.test.ts"
    - claim: The whole-ledger census allowlist holds no keyed reader; each remaining whole-history reader passes a rotationRecords digest, so a repeat pass decompresses no archive it has already reduced
      proof: "grep: W1-T11424 criterion 2 in test/ledger/no-long-lived-code-reads-the-whole-ledger-union.test.ts"
  rationale: |
    W1-T11423 adds ledgerRowsFor and seeds the census allowlist with every reader in its inventory that still asks a keyed question by scanning the whole union, or streams whole history with no digest. This task moves each one, so the allowlist is left with only whole-history aggregates that reduce each immutable archive once (ledgerRotationDigests). The 2026-11-05 core OOMs (4.0 GB under readLedgerUnionRecordsSync from dep-review proposalProgress) and the 11-04 hung reviews (priorPostedReviewRow) were both keyed questions.
  design: |
    1. Keyed readers: proposalProgress (task ids of the proposal's tasks), priorPostedReviewRow (the PR number, plus step review.posted), human-gate measureFeedbackAge (its feedback steps), field-trials readControlledLedgerRows and routing-experiments (their steps). Each calls ledgerRowsFor with the narrowest key it has. Each keeps its refusal and unread contracts, and an unindexed archive still counts as read in full.
    2. Whole-history readers (the pr-owner projection, retro, the analytics snapshot, pr-state, benchmark-cohort, field-trials readFieldTrialsLedger) pass a ledgerRotationDigests hook with a reducer equal to their own filter, so each archive is decompressed once per holder and reducer version, not once per pass.
    3. Each migrated reader leaves the census allowlist; the census test asserts that no keyed reader remains on it.
    Tests: for each keyed reader, a state dir where its key lives in k of N archives; the reader opens exactly those k, with the same result as at base. At base, every reader opens all N.
  falsifier: |
    At origin/main (with W1-T11423 merged), proposalProgress, priorPostedReviewRow, the human-gate measurement and field-trials' controlled read still open every archive for a keyed question, and the census allowlist still names them.
