  rationale: |
    OVERLAP: W1-T10913 (queued) also edits src/run-task.ts and docs/cli-reference.md, for the field-trials flags only. This task adds a different verb; the two touch different entries of the command registry.
    WHY: W1-T12414 scores answers per model, but live shadow rows accrue slowly. A replay of the existing judge corpora gives each candidate a first record offline, at batch price.
    READ 2026-11-12 in the operator's decision-model handoff and re-read on the vendor pages (handoff phase 2):
    - Message Batches cost 50% of the standard price on the Anthropic API. Microsoft Foundry does not support Message Batches. The Haiku 5.5 rows are $0.10 input and $0.50 output per 1M tokens up to 100K.
    - Haiku 5.5 is eligible for zero data retention, BUT Message Batches are NOT zero-retention: batch prompts are kept for 29 days. The corpora must hold nothing sensitive, and the replay says so in its output.
    - OpenAI Decisions is not a Batch endpoint, so the Decisions candidates cannot go through any batch. They replay through W1-T12416's single requests instead, at their own price.
    READ 2026-11-12 at origin/main f93618eab: package.json has only @anthropic-ai/claude-agent-sdk (no @anthropic-ai/sdk). src/lib/env.ts uses an Anthropic API key only for the overflow valve. src/lib/secret-boundary.ts (W1-T2699) keeps sentinels in workers and swaps in the real token in the daemon proxy, with boundary.request rows; MODEL_HOST_DEFAULT is api.anthropic.com. risk-judge-eval.ts replays the risk fixtures (test/fixtures/risk-judge-dispositions/, 9 YAML) with no model call.
  design: |
    Add src/lib/judge-replay-batch.ts with `replayJudgeCorpus(config, {model, corpus})`. It builds one batch of cases, reserves the batch cost, sends it from the daemon through the boundary proxy, polls with the daemon's clock until the batch ends, settles from each result's usage and writes one recorded typed answer per case. Add `rmd judge-replay --model <id> --corpus <name>`.
    OPERATOR DECISION, recorded here: the official Anthropic SDK versus raw HTTP through the budgeted transport. Recommendation: the budgeted transport, so the reservation and the boundary rows stay one mechanism. The builder asks before adding the SDK.
    NOT IN SCOPE: any live judge, any gate, and the Decisions candidates (no batch).
  falsifier: |
    Send the key from a worker environment and criterion 2 must fail. Send before the reservation and criterion 3 must fail. Restore and require both to pass.
  note: |
    Ids reserved for run-unfiled-1794493022000 with ~/rmd-work/bin/reserve-id.sh. Priority below the other decision-model tasks. The fleet builds it after W1-T12414 merges.
