- id: W1-T5782
  title: "A PLAN PR PAST ITS REFRESH BOUND ASKS THE OPERATOR — W1-T5748's `plan_pr_refresh_bound` escalation is only an `automerge.plan_pr_held` ledger row and a log line, so a plan PR whose merged plan stays unprovable after 3 refreshes waits unarmed with nothing on a needs-you surface"
  repo: remudero
  depends_on: [W1-T5748]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: medium
  origin: "operator session 2026-10-05: W1-T5748 (#9205) follow-up"
  plan_refs: [W1-T5748, W1-T8, W1-T5373]
  files: [src/lib/sweep.ts, test/a-plan-pr-past-its-refresh-bound-asks-the-operator.test.ts]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main f0452a82. In `directMergePreflightSteps`
    (src/lib/arm-auto-merge.ts) a `decidePlanPrMergeSafety` escalate verdict says
    `automerge.plan_pr_refresh_escalated ... left for the operator, never updated again` and returns
    `plan-pr-held` with `reason: "plan_pr_refresh_bound"`, `planMergeUnsafe` and `refreshedHeads`.
    `logArmAttribution` writes that as its arm-skip row and an `automerge.plan_pr_held`
    rows. No `needs-human` issue is opened and no human-gate source reads those rows, so "left for the
    operator" reaches the operator only through the ledger. The design of W1-T5748 asked to
    "escalate to the operator naming the heads".
  design: |
    In the sweep's arm closure, a `plan-pr-held` result whose preflight reason is
    `plan_pr_refresh_bound` opens a MANUAL escalation through `tryEscalate` (deduped per PR by
    `findDuplicateEscalation`), naming the PR, the refreshed heads and `planMergeUnsafe`, with the
    options "direct-merge after checking the merged plan" and "close and re-file". A later pass at
    the same state opens nothing new.
  acceptance:
    - claim: "a sweep arm returning plan-pr-held with reason plan_pr_refresh_bound opens one MANUAL escalation naming the PR and its refreshed heads, a second pass opens none, and plan-pr-held for any other reason opens none"
      proof: "unit test: test/a-plan-pr-past-its-refresh-bound-asks-the-operator.test.ts"
  falsifier: |
    Drop the escalation call: the fake issue gateway records no create and the test fails.
