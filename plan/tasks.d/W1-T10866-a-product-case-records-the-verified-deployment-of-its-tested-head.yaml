  rationale: >-
    Filed for issue #14864 by plan-only run PLAN-clarify-1793116565507. This is step 2 of 3 of the product-case
    receipt producer sequence. It has its own prerequisite: the verified project binding is W1-T10616's, not the
    run ledger. OBSERVED at main 13037885: ProductDeploymentService (src/lib/product-deployment.ts) persists only a
    project binding (operationId pdeploy_<digest>, provider project id, team and bound repository) in its own journal.
    Its receipt fixes deployed:false, playable:false, sourceSha:null, deployment "none" and servedRoute and
    physicalDevice "unverified". The provider port offers config/read/create of a PROJECT only. No code reads a
    deployment, its source commit, its target or its served URL. The case "deploy" channel has no producer.
    Settled by lookup: is this already filed or already decided? -> no. W1-T10616 defers "source SHA, deployment
    status, served route and physical-device playthrough" as independent evidence fields
    (plan/tasks.d/W1-T10616-*.yaml). No other shard, DECISIONS.md, LEARNINGS.md or MASTER-PLAN.md entry produces
    them. Settled by lookup: does a Wreckterra Vercel project exist or get created here? -> not asserted, and this
    task never creates, adopts or buys one. With no persisted verified binding, the outcome is an explicit unknown.
    Settled by lookup: may a client supply deployment evidence? -> no. recordEvidence is trusted-only by design, and
    the HTTP union exposes no evidence writer (src/lib/product-case.ts).
  design: >-
    Add ONE server-derived observation to the existing case command union. Its input is only productId, the
    expected revisions, and the persisted deployment binding operationId. The client supplies no URL, SHA, state or
    outcome, so this is not a generic evidence POST. (1) Binding. Re-read the stored ProductDeploymentService
    receipt for that operationId. It must name this product and its verified repository id, the configured team, and
    the provider project id. Any mismatch is a named refusal. (2) Provider read. Extend the existing Vercel provider
    port with one bounded, read-only deployment read for that project id and team, through the existing config and
    fetch transport. Take the deployment's source repository, commit SHA, target (production vs preview), ready
    state and URL from the provider's own response, never from a creation reply. Derive the real response fields
    from the provider's documented API at implementation time; do not invent fields. (3) Source binding. The
    deployment's repository must equal the product repository id. Its commit must equal a head that carries a
    current-objective succeeded hosted receipt from W1-T10865, or that receipt PR's verified default-branch merge
    commit. Any other SHA is stale or foreign and never current success. (4) Served readiness. Only a ready
    deployment is probed: one bounded HTTPS GET of its provider-reported URL, with a timeout, a byte cap and no
    cross-host redirect. 2xx is succeeded. An access-protected response is blocked. A provider error or cancelled
    state is failed. Building or queued is running. An unreadable provider, missing config or truncated list is
    unknown. (5) Receipt. Record a "deploy" receipt with the W1-T10865 typed outcome and deterministic id, carrying
    the actor, product, objective, repository, project, deployment id, target, commit, URL and outcome. Preview and
    production stay distinct in the id and the projection. Earlier failed or stale receipts stay stored. Replay,
    restart, two instances and concurrent revisions follow W1-T10865's rules. Declare the new union member and any
    new failure code in openapi/daemon.yaml and in the route status map, then regenerate the client. Out of scope:
    project creation or adoption, a domain, DNS, a purchase or plan upgrade, OleyArcade catalog edits, the physical
    phone (W1-T10867), and live Wreckterra receipts. First gameplay stays signed-in Console C4. TEST. One whole file
    at test/plan/product-case-deploy-receipts.test.ts. Confirm it with rmd test-place from the actual imports, and
    use aliases. Drive buildProductCaseRoutes' default handler over a real product store and deployment journal,
    with a controlled fetch at the provider and served-URL boundary.
    Typed receipt follow-through: extend the strict optional receipt metadata in src/lib/product-intent.ts for
    this channel and its actual bounded project/deployment/source/target/URL fields. Extend the deploy reply
    projection with outcome, exact source and preview/production target, not only id and URL.
    Declare the exact stored and served types and regenerate the maintained API client. Preserve legacy records,
    existing byte/collection limits and the same-objective binding. No packed command/opaque JSON in labels or URLs.
    Prove reconstruction from durable typed data through the actual served reply after a new service instance and
    restart, with stale/foreign/replayed/concurrent controls. A reference label alone is not a structured identity or
    outcome proof. Existing budgets, claims, holds and source owners are unchanged.
  acceptance:
    - claim: "an observation through the served case route records a deploy receipt only from the persisted verified binding and the provider's own deployment read, bound to the product repository, a hosted-tested head, and a served URL that answered"
      proof: "unit test: test/plan/product-case-deploy-receipts.test.ts"
    - claim: "preview and production deployments stay distinct, and a foreign project, team or repository, an untested or stale commit, a protected, building, errored or cancelled deployment, and missing config or an unreadable provider each record an explicit non-success outcome or refusal"
      proof: "unit test: test/plan/product-case-deploy-receipts.test.ts"
    - claim: "replay after response loss, restart and a concurrent product revision change converge on one deploy receipt per deployment and keep earlier failed receipts"
      proof: "unit test: test/plan/product-case-deploy-receipts.test.ts"
  falsifier: >-
    Remove each mechanism on its own: the binding re-read, the repository-id equality, the hosted-tested-head
    equality, the readiness probe's 2xx requirement, and the preview/production split. Each removal must make a named
    test in test/plan/product-case-deploy-receipts.test.ts fail against the same real-file fixture, and the test must
    pass once that piece is restored. A project binding alone never reads as deployed or playable.
