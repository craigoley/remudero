  rationale: |
    OBSERVED 2026-11-04, remudero-daemon:
    - Both of today's container recycles refused on it. RECYCLE-3864750 refused at 14:00:25Z: "0 lane-holding and 2 lane-less worker(s) still in flight after 3000s". One was a retro (run-task.ts retro, PID 2031531), 6,929 s old at refusal.
    - RETRO-1793795675454 started at 12:34:37Z, synthesized at 12:59:19Z and regenerated orientation at 12:59:21Z. It then wrote no row of its own while its child (PID 2343080, plus a grandchild) ran Node in worktrees/run-RETRO-1793795675454 from about 13:24Z.
    - That child held /tmp/rmd-pool-run-*/tally.json open, a test pool, still running at 14:06Z.
    - runRetroPrepublishPreflight (src/lib/retro-preflight.ts) ledgers only its end (retro.preflight_passed / retro.preflight_failed), so the gate is invisible while it runs.
    - deploy/recycle-container.sh counts a retro as busy at any age (W1-T4766), which is right when nothing says what it is doing. The fleet stayed paused from 12:26:41Z to 14:00:25Z behind it, with no recycle.
  design: |
    Before the preflight spawn in runRetroPrepublishPreflight, ledger retro.preflight_started with run_id, task_id, changed_files (count), pool (the suite selection it will run) and started_at.
    Register the step wherever ledger steps are declared, or in the ledger-literal census if it requires it.
    The two existing suites that pin the exact row list (test/retro-prepublish-validation.test.ts, test/learning/scout-retro-preflight-failed.test.ts) filter retro.preflight_started out before their row-list assertions; their other assertions are unchanged.
    NOT IN SCOPE: changing how a recycle classifies a retro. That needs this row's evidence first, then a predicate filed separately.
