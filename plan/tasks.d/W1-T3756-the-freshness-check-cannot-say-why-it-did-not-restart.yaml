  rationale: |
    MEASURED ON THE LIVE FLEET, 2026-09-18. The daemon process ran from 00:35 to 05:50 UTC.
    `cc12d9169` — a `src/` change, and the very fix that unblocks the squeeze — merged at
    00:46:42, ELEVEN MINUTES after that process booted. It should have self-restarted on the next
    tick. It did not, for five hours, and `daemon_selfrestart_for_freshness` appears ZERO times in
    the last 40,000 ledger rows. The fleet spent the whole squeeze running code that could not
    divert, while the code that could sat on disk.

    THE MECHANISM IS NOT OBVIOUSLY BROKEN. Tested in the live container against the live config:

        plan only          material=false -> stale=false     (correct)
        src change         material=true  -> stale=true      (correct)
        src + plan         material=true  -> stale=true      (correct)
        unreadable/empty   material=true  -> stale=true      (correct, fails toward restarting)

    And every cheap cause was ELIMINATED, each by direct observation rather than reasoning:
      - `RMD_SELF_SYNC_DONE` absent from the daemon's process environment (read from /proc).
      - `CI`/`GITHUB_ACTIONS` absent, so `isCiEnv` is false.
      - the checkout was `git status --porcelain -uno` CLEAN, so the `dirty` arm was not taken.
      - `daemon.pause` rows: 0, and no PAUSE/STOP lever on the state volume, so the
        `if (paused) { ... continue; }` arm above the check was not skipping it.

    SO THE ROOT CAUSE IS STILL UNKNOWN, AND THAT IS THE ACTUAL DEFECT THIS TASK FIXES.
    `daemonFreshnessFromService` has FOUR distinct ways to answer "not stale":

        svc.status !== "assessed"   -> guarded (self-sync env) OR degraded (fetch/rev-parse FAILED)
        svc.dirty                   -> a tracked modification in the daemon's own tree
        !svc.behind                 -> genuinely up to date
        !advanceIsMaterial(...)     -> behind, but by nothing this process would load

    All four return the identical `{ stale: false }`, and NONE of them ledgers a row. So "I am
    fresh" and "I could not tell whether I am fresh" are byte-indistinguishable to every reader,
    including an operator staring at the ledger — which is exactly the failure class this repo
    names in CLAUDE.md: a check that passes while comparing nothing.

    THE DEGRADED ARM IS THE ONE THAT MATTERS, because it is the only one that can be TRANSIENT and
    invisible at once. `checkServiceFreshness` runs `git fetch --quiet origin` and returns
    `degraded` on failure. This host authenticates as a GitHub App and mints a fresh installation
    token roughly hourly; a fetch attempted while that credential is absent or expired fails, maps
    to `degraded`, and the daemon silently keeps its boot sha forever. That is a HYPOTHESIS, not a
    finding — it fits every observation above and none of them proves it, which is precisely why
    the logging must come first.

    THE FIX, IN ORDER:
      (1) LEDGER THE REASON on every non-stale answer — one row naming which of the four arms was
          taken, and for `degraded` the underlying error string. This is what makes the next
          occurrence diagnosable in one grep instead of a five-hour outage plus a session of
          elimination.
      (2) ONLY THEN decide whether `degraded` should keep failing closed. It probably should NOT
          fail silent: an unreadable freshness check that persists across N consecutive ticks is
          itself a reason to restart, because a process that cannot tell whether its code is
          current is in exactly the state the restart exists to end.

    SIBLING, NOT A DUPLICATE — W1-T3755 (#5974), filed independently by the fleet the same night.
    That one is about the fleet REPORTING staleness wrongly: `readLatestBootSha` returns undefined,
    so `rmd status` prints a STALE line that is false and `deploy.skip` says the running head is
    "not recorded". This one is about the daemon DECIDING not to restart and leaving no record of
    why. They are the two halves of one blindness — nothing can say what code the daemon is
    running, and the daemon cannot say why it kept running it — and they are worth fixing together
    even though neither subsumes the other. Whoever takes the second should read the first's
    evidence: an unrecorded boot sha is a candidate input to this silence, not obviously unrelated.

    DO NOT "FIX" THIS BY MAKING EVERY NON-ASSESSED READING RESTART. That reopens W1-T936's relaunch
    storm, which the current shape exists to prevent. The bound belongs on REPEATED unreadability,
    not on a single one.

