- id: W1-T5885
  title: "A CHEAP VIEW NEVER WAITS BEHIND AN EXPENSIVE ONE — the read model builds every view unit on one view thread (`runReadModelViewWorker`), so a cheap view whose source moved waits behind any in-flight per-instance `now` build (about 2.7 s, up to 6.66 s): repositories waited 6,191 ms and read-model 4,461 ms on the host"
  repo: remudero
  depends_on: [W1-T5884]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — a unit over the solo budget never delays a unit under it
  band_meaning: span
  origin: "operator session 2026-10-05: SSE push-latency measurement on the host (extracts in the session scratch push-latency/, with #9344 and #9338 open)"
  plan_refs: [W1-T5884, W1-T5066]
  files: [src/lib/read-model-worker.ts, test/a-cheap-view-never-waits-behind-an-expensive-one.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main 0b8d2a21. `runReadModelViewWorker`
    (src/lib/read-model-worker.ts, #8324) runs one `createReadModelTicker` with `viewsOnly`, and
    its `materialize` builds due units serially; a unit whose cost exceeds `soloMs` runs first in a
    pass of its own, and after each build `unit.dueAt = finished + costMs / READ_MODEL_VIEW_SHARE`
    (0.4). Nothing else on the thread runs while that build does.
    MEASURED 2026-10-05 on the host (view.emitted rowTs to emittedAt): push latency is dominated
    by head-of-line blocking on this thread. `now@core` costs about 2.7 s per build (47 builds
    over 2.5 s in 18 min, one 6.66 s, its `board` stage 5,942 ms once), and cheap views
    (read-model, repositories, nav-badge) waited behind it: repositories 6,191 ms, read-model
    4,461 ms. Target event-to-screen is under 5 s; the console relay adds about 0 and the console
    refetch about 0.7 s, so the view thread is the budget.
    BEFORE/AFTER MEASUREMENT: #9344 adds per-stage now timings (`stages` on
    `read_model.slow_view`) and `prevRowTs`/`buildStartedAt` on `view.emitted`; compare the cheap
    views' rowTs-to-emittedAt distribution before and after this lands. Build after W1-T5884,
    whose self-feeding now rebuild loop otherwise dominates the measurement.
  design: |
    Give the view side two lanes (two tickers on the thread, or a second view worker): units
    whose measured cost exceeds `soloMs` (per-instance `now` today) run on a heavy lane; all
    other units run on a fast lane that ticks every READ_MODEL_TICK_MS, so a cheap view's
    row-to-wire is bounded by about one tick plus a projector tick whatever the heavy lane is
    doing. A unit that crosses `soloMs` in either direction moves lanes on its next build. This
    touches the worker kinds (READ_MODEL_VIEWS_KIND), `threadViews` (spawn, relay, respawn
    backoff per lane), its build watchdog (READ_MODEL_STALL_MS judged per lane) and the
    `view_unit` start/end heartbeat (which lane is building what); serve-memory's per-thread
    heap sampling (W1-T5480) must name the new thread if one is added. The existing view-thread
    suites (test/read-model-worker.test.ts and its siblings) keep passing; they are not a proof
    here because they pass at base.
  acceptance:
    - claim: "while a fake view unit whose cost exceeds soloMs is mid-build, a cheap unit whose source moved is built and published within one READ_MODEL_TICK_MS tick, and the heavy unit still completes and publishes"
      proof: "unit test: test/a-cheap-view-never-waits-behind-an-expensive-one.test.ts"
  falsifier: |
    Keep one serial view lane: the cheap unit waits for the slow unit's build to finish and the
    test sees it published only after the slow build's duration.
