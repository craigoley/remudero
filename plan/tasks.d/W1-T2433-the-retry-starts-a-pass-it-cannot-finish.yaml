  falsifier: |
    If a `coverage-ratchet` run is observed ending GREEN at a two-pass duration, the claim in (6)
    is void and the retry has rescued a flake at least once — the population must then be re-taken
    and the remedy re-argued against a mechanism that sometimes works. The measurement to repeat
    is the duration census by conclusion over the last 56 runs, whose single-pass maximum of 1414s
    is what makes a two-pass run identifiable at all.

    SEPARATELY FALSIFYING: if the cancellations are ever observed scattering rather than clustering
    within seconds of the bound, they are not the timer and (4) is wrong — a hang or a natural
    overrun would produce a spread, and the four observed differ by six seconds total.

    AND IF `timeout-minutes` is raised again, the arithmetic in (3) moves and the remedy may become
