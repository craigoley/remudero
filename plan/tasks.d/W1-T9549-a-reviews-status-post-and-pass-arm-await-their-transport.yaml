  design: |
    No new bound; the same argv, the same gates, the same outcomes.
    1. An awaited `armIfVerdictPermitsAsync` with the same gate order and ledger rows as `armIfVerdictPermits`; its
       default arm is `armAutoMergeDetailedAsync` over `realArmDepsAsync`, so `gh pr merge --auto`, the plan
       merge-safety git and the direct REST merge are awaited. `runReview` awaits it. The sync form stays for the CLI
       (`rmd review <pr>` run by hand is not on the daemon loop) and `requireExplicitArmSeam` still refuses a real arm
       reached from a test.
    2. `postReviewStatus`' default exec awaits the gh transport (`ghTextAsync` with the reviewer-token env), keeping
       its transient classification and retry, and `postReviewStatusGuarded`'s lifecycle read in `runReview` awaits
       `ghJsonAsync`. The repair-lease status post follows the same exec.
    3. Rows of SYNC_SPAWN_LOOP_BASELINE (test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts) whose
       loop-reachable count changes are lowered or deleted in the same PR, as the census requires.
    Tests go in test/a-reviews-status-post-and-pass-arm-await-their-transport.test.ts, with `test(` titles verbatim as
