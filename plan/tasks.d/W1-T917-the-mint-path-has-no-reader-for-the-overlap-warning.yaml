  rationale: "MEASURED ON THE MAC MINI AT origin/main, 2026-08-16, over REST throughout.

    (1) **THE BOUNDARY, FIRST, SO THIS IS NOT READ AS A REBUILD. W1-T533 OWNS THE SCORING; THIS OWNS
    THE CALL SITE.** The rarity-weighted predicate shipped as #1968 — `rareOverlapWarnings`,
    `declarationCountsByPath`, `OverlapWarningPolicy`, `DEFAULT_OVERLAP_WARNING_POLICY`,
    `RareOverlapWarning` and `OpenPrFileScope` are all exported from `src/lib/dispatch-overlap.ts` on
    main. **NOTHING HERE CHANGES THAT PREDICATE.** W1-T533's own note excludes `src/run-task.ts` by
    design ('the 37% hub this task exists to ignore'), which is precisely why the reader could not be
    wired there and why this task exists.

    (2) **THERE IS NO READER, MEASURED WITH A WORKING CONTROL.** `rareOverlapWarnings` has ZERO
    callers outside `src/lib/dispatch-overlap.ts` across `src/`, `bin/` and `scripts/`, and in `test/`
    only its own suite touches it. POSITIVE CONTROL, same query shape: its sibling
    `partitionByFileOverlap` returns 18 hits outside that file, with real imports in
    `src/lib/daemon.ts`. So the query sees callers elsewhere when they exist; the zero is a
    measurement.

    (3) **WHICH MAKES IT THE FIFTH OF A MEASURED FAMILY, AND W1-T533's DESIGN (iv) FORBIDS EXACTLY
    THIS**: 'this must print where a filer already reads, or it is not worth building —
    `daemon.tree_dirty`, `daemon.stale_code`, `CiFailure.outsidePrRange` and `dh-rate-limit` are four
    measured fired-and-unread signals. DO NOT ADD A FIFTH.' A correct, tested, uninvoked predicate is
    that fifth signal.

    (4) **THE PROVENANCE FINDING THAT MAKES THE WIRING WORTH DOING — THIS IS THE DESIGN'S FOUNDATION.**
    `OpenPrFileScope` is `{ id: string; files?: readonly string[] }` — AGNOSTIC ABOUT WHERE THE PATHS
    CAME FROM. It takes a path list, not a shard. So it can be fed a pull request's ACTUAL CHANGED
    FILES from `pulls/{n}/files` over REST rather than a shard's declared `files:`. **THAT DISTINCTION
    IS THE WHOLE VALUE**: both measured races were TRAILERLESS `fix/…` branches with NO SHARD AT ALL —
    #1873/#1874 (byte-identical titles, identical file lists, created 74 SECONDS apart) and #1975
    behind #1969 (a second symbol for the same rung, 32 MINUTES later while the first was open). **A
    SCOPE BUILT FROM DECLARED `files:` WOULD SEE NEITHER.** Fed from the diff, it sees both.

    (5) **AND THE COST IS ONE REST CALL PER OPEN PR, ON THE HEALTHY BUCKET.** `nextTaskIdCommand`
    (`src/run-task.ts`) already sweeps open PRs through `openPrMintTexts`, but fetches TEXTS for id
    mining rather than files. The addition is `pulls/{n}/files` per open PR — CORE budget, NOT
    GraphQL, which has been exhausted six times in two days. Core sits near its ceiling; GraphQL does
    not."
  design: |
    (i) THE CALLER ONLY. `nextTaskIdCommand` gains the warning; the predicate is imported and called
    unchanged. No edit to `src/lib/dispatch-overlap.ts` — declaring it would fail
    `inverseScopeUntouchedFiles`, and W1-T533 owns it regardless.
    (ii) FEED IT THE DIFF, NOT THE DECLARATION. Build each `OpenPrFileScope` from the open PR's actual
    changed files over REST. Rationale (4) is why: declared paths cannot see either measured race.
    (iii) WARN, NEVER REFUSE — W1-T533's design (iii) carried forward verbatim. The verb prints each
    warning naming the OPEN PR and the SHARED RARE PATH, then returns its normal exit code. It does not
    refuse a mint, does not change the id it reports, and does not gate anything. A false block on
    legitimately adjacent work would be worse than the duplication it prevents.
    (iv) AND IT MUST DEGRADE, NOT THROW. The open-PR file read is network I/O on a budget that has been
    exhausted repeatedly; a failed read must print no warning and leave the mint's own output byte-
    identical, exactly as the existing reservation notice already degrades ('no readable reservation
    store ⇒ report the mint alone'). An advisory that can break the verb it advises is worse than none.
    (v) FALSIFIER, BOTH DIRECTIONS, AND THE SECOND IS THE WHOLE DESIGN. A candidate sharing a rare path
    with an open PR is reported; a candidate sharing ONLY `src/run-task.ts` — declared by 103 of 277
    shards — is NOT. And the #1873/#1874 file pair (`src/lib/plan.ts`, `test/plan-sharding.test.ts`)
    must be driven through the real caller and shown to report, since that is the one duplicate we can
    name.
    (vi) NOT IN SCOPE. The predicate itself, its threshold and its scoring (W1-T533/#1968). The
    hub-path-under-any-spelling assertion — a separate, smaller task against the merged predicate,
    deliberately not mixed in here so what is being reviewed stays legible. The same-id dispatch gap
    (W1-T534) and the `hasPushedRunBranch` supplier gap: both are correct for the SAME-ID case and
    NEITHER is motivated by these two instances, so nobody should re-rank them on a rate they do not
    own. Wiring this into `drain`/dispatch, which would make it blocking.
