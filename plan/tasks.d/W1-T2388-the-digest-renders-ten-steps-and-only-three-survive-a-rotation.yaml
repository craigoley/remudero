  falsifier: |
    If a fresh measurement over the rotation stamps shows rotations are RARE relative to the digest
    cadence — inter-event gaps mostly EXCEEDING `digestCadence.minIntervalMinutes` rather than the
    measured 3.3% — then the exposure is theoretical and this task must be closed rather than built.
    The measurement to re-run is the same one: parse the rotation stamp out of every archive
    FILENAME across all three forms with a per-form coverage control, cluster stamps within 60 s into
    events because one rotation writes several files, and compare the event gaps against the live
    `minIntervalMinutes`, not against an assumed daily clock.

    SEPARATELY FALSIFYING: if a bounded union's WORST-CASE window is cheap — not the median, the tail
    — then the bimodality recorded in (3) is wrong and the design question it raises is moot.
