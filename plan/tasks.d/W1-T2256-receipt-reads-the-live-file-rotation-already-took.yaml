  note: |
    THE MODULE NEVER FABRICATES, AND THAT IS NOT NEGOTIABLE HERE. Every leaf stays either `{ value }`
    or `{ value: null, reason }`; a missing row stays ABSENT-WITH-REASON and is never defaulted,
    never zero-filled, and never inferred from a neighbouring line. A receipt with null leaves is an
    honest receipt — the defect this task fixes is that the leaves are null when the evidence EXISTS,
    not that nulls appear at all.

    DETERMINISM STAYS. Same ledger in, byte-identical bytes out: no wall-clock, no random ids, no
    generation timestamp anywhere in the payload. A scoped union read must not introduce ordering
    that varies between calls, which is the one way this change could quietly break the property it
    must preserve — two calls over one corpus must still `JSON.stringify` identically.

    NOTHING ABOUT SIGNING IS IN SCOPE. The unbanking test for that rung is that a NAMED CONSUMER
    OUTSIDE THIS REPO READS A RECEIPT AND REJECTS IT FOR BEING UNSIGNED, and no such consumer exists:
    the predicate type is a namespace nothing consumes, the command posts nowhere, and no signing
    dependency or key material is present. Signing an artifact whose leaves are null proves nothing
    to anyone, which is the ordering argument for doing this first and is not an argument about
    Sigstore.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (receipt-corpus-and-branch, run-task) at
      risk:medium — Rule 19: raise to risk:high or decompose into one task per concern The real blast radius is one read-only verb and one ledger
    field; no gate, no merge path and no dispatch decision reads either.

    NO PROOF GREPS ITS OWN PATH AND NONE NAMES AN EXISTING FILE. Every criterion uses the pure-path
    `unit test:` form naming `test/receipt-corpus-and-branch.test.ts`, declared in `files:` and absent
    from this tree, so on the filing PR each resolves through W1-T456's forward-reference carve-out.
