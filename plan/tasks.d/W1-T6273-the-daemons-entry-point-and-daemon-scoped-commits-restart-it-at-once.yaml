    - claim: "a commit scoped (daemon|drain|dispatch|sweep) is full weight wherever its files are"
      proof: 'grep: test("W1-T6273: a daemon-scoped commit is full weight wherever its files are" in test/the-daemon-entry-point-and-daemon-scoped-commits-restart-it-at-once.test.ts'
    - claim: "an unrelated src change still waits for an idle moment"
