  rationale: |
    MEASURED 2026-10-07 in the core daemon's ledger: after #9927 merged (683f762c0) every
    daemon.freshness_decision read "busy, and pressure N (change 2 + staleness M) < 18: wait for an idle
    moment" until 20:38:42Z, when the upper-age horizon forced it (pressure 34). READ on origin/main:
    `freshnessAdvanceWorth` (src/lib/deploy-judge.ts) returns 18 only when a file starts with a
    DAEMON_SELF_PATH_PREFIXES entry (src/lib/daemon, drain, dispatch-, ledger, self-sync.ts, bin/,
    package*.json, tsconfig.json); otherwise `deterministicDeployWorth` floors any src/ change at 1.
    src/run-task.ts, where daemonCommand, the tick and the lane gateways live, is not on the list. The
    advance's commit subject is already carried (daemonFreshnessFromService) but unused.
  design: |
    Add src/run-task.ts and src/lib/sweep to DAEMON_SELF_PATH_PREFIXES, and give full weight to a
    commit whose conventional scope names the daemon's machinery (daemon, drain, dispatch, sweep), so a
    new daemon-side module is covered by how its author scopes the commit rather than by editing a list.
    Every other src change keeps the floor of 1 and still waits for an idle moment.
  acceptance:
