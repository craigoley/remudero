      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "the remote reservation is taken before the prompt is built, and the local block still gates spending before any worker is started"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "no identifier bound to an advisory-derived value is named as though it were reserved"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "the linter and the relint loop grade against the same list the worker was prompted with"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "a run that files an id outside the reserved block is reported, and the report names both lists"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "the report is advisory and changes no decision, refuses no run and opens no escalation"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "a ledger row distinguishes reserved-versus-advisory from local-versus-advisory rather than conflating them"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
    - claim: "a run that never reaches propose is bounded in how many permanent remote ids it can hold"
      proof: "unit test: test/triage-files-under-the-reserved-id.test.ts"
