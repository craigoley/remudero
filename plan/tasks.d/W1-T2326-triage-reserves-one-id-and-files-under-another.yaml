  note: |
    Q3 — THE DIVERGENCE, SIZED WITHOUT OVERSTATING IT, AND ONE HALF OF IT IS SMALLER THAN IT LOOKS.
    Against origin/main at the filing sha: 439 reservation refs, 864 distinct filed ids, 328 carrying
    both. 111 RESERVED-BUT-NEVER-FILED (25% of refs) and 536 FILED-BUT-NEVER-RESERVED (62% of filed).

    THE NEWEST ORPHANS ARE LEGITIMATELY IN FLIGHT AND MUST NOT BE COUNTED AS DRIFT. The top of the
    reserved-but-unfiled tail is 2255, 2256, 2285, 2307, 2308, 2309, 2319, 2320, 2321, 2322, 2323 and
    this task's own id — nine at or above 2300, including this shard, an id whose filing PR is open,
    and both blocks the two degraded runs of 2026-08-26 took and discarded.

    BUT 536 IS ALMOST ENTIRELY A PRE-MECHANISM BACKLOG, AND SAYING OTHERWISE WOULD OVERSTATE IT.
    Split by era, using the ledger's own contemporaneous ceilings as the boundary: 498 of the 536 sit
    below the id current when remote refs first landed (W1-T509, 2026-08-15, ceiling 503); 38 sit in
    the window where only the FIRST id of a block took a ref; and **ZERO sit above the ceiling
    current when every minted id began taking one (2026-08-19, ceiling 1019)**. Since that date every
    filed id carries a reservation. FILING IS NOT RUNNING BESIDE THE RESERVATION LAYER TODAY, and the
    claim that it has been doing so for weeks does not survive the split.

    THAT MAKES THE BACKLOG A SEPARATE OBSERVATION AND EXPLICITLY OUT OF THIS TASK'S SCOPE — it is
    historical, it is closed, and nothing here proposes reconciling it. It also strengthens this
    task rather than competing with it: the reservation layer is now UNIVERSAL, which is precisely
    why being unread is the entire remaining defect.

    WHAT MUST NOT CHANGE.

    THE EIGHT-SURFACE OPERATOR CHECK STAYS. It caught this while the refs were working and the
    advisory was not, and it is the only reader that spans reservations, shards, open PRs and
    history at once. Nothing in this task replaces it, and a build that argues the check is now
    redundant has misread which layer failed.

    THE FLEET KEEPS FILING. An intake rung that stops on a budget shortfall is a worse failure than
    a rare collision. Contention must keep ADVANCING rather than refusing, per
    `reserveTaskIdRemote`'s own doctrine, and no arm added here may turn a divergence into a refusal.

    NOTHING PACES, THROTTLES OR SLEEPS — W1-T1066. This task changes WHICH NUMBER a worker is given
    and WHEN the remote block is taken; it adds no wait, no retry cadence and no rate control.

    W1-T2324 IS NOT AMENDED BY THIS. It is correct within its own layer: it fixes how the mint
    DERIVES a ceiling when the open-PR surface is refused. This task fixes what happens to the
    reservation AFTER a number exists. The two are adjacent, not overlapping, and neither subsumes
    the other — a perfectly derived advisory that nothing reserves against still gets filed, and a
    perfectly read reservation still starts from whatever ceiling the mint found. THEY DO SHARE
    `src/run-task.ts` IN `files:`, so `partitionByFileOverlap` will serialize them; that is correct
    and expected, not a reason to widen or merge either.

    W1-T2315 IS CITED AS THE ADJACENT READ-VERSUS-WRITE SHAPE — two resolvers deciding one thing with
    nothing reconciling them — and is NOT re-filed here. Neither is W1-T2324.

    THE FORWARD REFERENCE IS DELIBERATE. `test/triage-files-under-the-reserved-id.test.ts` does not
    exist yet; it is declared in `files:` so the pure-path proofs resolve under the forward-reference
    carve-out and read `not_yet_built` until the build lands.

    RULE 19 BAND. `risk: high` is set UP FRONT for the SPAN of the declared `files:` — one module and
    its test — not for blast radius. The edit is an ordering change inside one function plus one
    ported report call.
