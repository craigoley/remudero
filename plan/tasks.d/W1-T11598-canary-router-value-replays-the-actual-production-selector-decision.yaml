- id: W1-T11598
  title: Canary router evidence freezes and replays the actual production worker selector decision
  repo: remudero
  depends_on: [W1-T11597, W1-T11117, W1-T11118, W1-T11432]
  plan_refs: [W1-T11119, W1-T11597, W1-T5535, W1-T11432]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12
  risk: high
  band_meaning: span
  priority: 2
  status: queued
  attempts: 0
  origin: architect
  files:
    - src/lib/model-canary-router-decision.ts
    - src/lib/worker.ts
    - test/routing/model-canary-router-decision-replay.test.ts
  rationale: >-
    Plan-only replacement for the router-replay slice of held PR #17194. PR #17194 was made conflicting
    by merged plan amendment PR #17193, which changed the W1-T11119 shard (widened files, folded criteria
    15-27); this replacement carries that latest W1-T11119 shard forward and uses fresh reserved ids
    because W1-T11593, W1-T11594 and W1-T11595 are still declared by the open PR. W1-T11119 criterion 14
    was refused because no durable producer joins frozen pre-outcome router decisions to canary outcomes.
    RouteLLM (ICLR 2025,
    https://proceedings.iclr.cc/paper_files/paper/2025/hash/5503a7c69d48a2f86fc00b3dc09de686-Abstract-Conference.html)
    and RouterEval (Findings of EMNLP 2025, https://aclanthology.org/2025.findings-emnlp.208/) judge a
    router by the decision it makes from pre-outcome inputs against fixed single-model choices; that is
    only valid when the evaluated decision is the one production actually made. The Claude Agent SDK
    TypeScript reference (https://code.claude.com/docs/en/agent-sdk/typescript) fixes which spawns reach
    a provider (W1-T11597), so replayed decisions join only to real exchanges.
    Settled by lookup: is this already filed or decided? -> no; only open PR #17194 (W1-T11594) declares
    captureRouterDecision, and no main shard captures replayable selector inputs (grep of plan/tasks.d).
    Settled by lookup: what is the exact production selector? -> src/lib/worker.ts calls
    selectWorkerProvider(capacities filtered to auction.policy.routableProviders, reservePercent, draw,
    fixLearning.mixing) when the fix learner applied, otherwise selectWorkerProviderForPolicy(capacities,
    auction.policy, draw); selectWorkerProviderForPolicy lives in src/lib/provider-routing-policy.ts and
    selectWorkerProvider in src/lib/worker-provider.ts.
    Settled by lookup: is routingPool production? -> no; routingPool and selectFromRoutingPool
    (src/lib/worker-provider.ts, src/lib/model-pool.ts) are optional and unwired at the worker decision site.
    Settled by lookup: which inputs are effective? -> the post-learner capacities from applyFixLearner,
    the draw (providerRouting.draw or the auctionDrawSeed key read BEFORE the learner per W1-T5535) and
    the learned mixing and weights.
    Settled by lookup: ordering -> depends on W1-T11597 and W1-T11432 to serialise src/lib/worker.ts,
    and on W1-T11117/W1-T11118 for matrix and case identity; it depends on none of W1-T11119, W1-T11120,
    W1-T11213, W1-T11264 or W1-T11265, so the graph stays acyclic.
  design: >-
    At the real worker.ts decision site, call captureRouterDecision( after the fix learner runs and
    before execution. It freezes the post-learner effective selector inputs: the effective capacities
    (after applyFixLearner and after the routableProviders filter on the learned branch), auction policy
    and preference, reserve, capability, candidate and model identity, draw unit and seed, learned mixing
    and weights, the exact selector branch that ran (selectWorkerProviderForPolicy or selectWorkerProvider
    after learned mixing), its selection and preference-bypass outcome, and the exact downstream routed
    model identity. It binds to the worker-spawn attempt and the W1-T11597 run and canary binding. A new
    module exports a pure replay that calls the same selector the captured branch used with only frozen
    inputs, reads no live capacity, health, credential or clock state, and returns verified only when the
    replayed branch, selection and downstream model identity equal the captured ones. Unrepresentable
    branches (the blocked-auction cash fallback, error paths, unknown preference), unserialisable or
    unverifiable inputs and any replay mismatch yield unavailable router evidence, never an estimate.
    The deterministic production decision is the primary estimand. Propensity weighting is a
    preregistered diagnostic emitted only when the selector genuinely reported draw probabilities. A
    selectFromRoutingPool replay may appear only as a separately labelled, unavailable, non-production
    counterfactual and is never presented as the production route. Tests use zero transport and zero spend.
  note: >-
    Grants no routing-policy change, promotion, schedule, consent, native-owner, admission,
    source-qualification or spend release, and changes no privacy control. The first live pilot keeps its
    separate USD 25 total cap with no retries or top-ups. This plan and its offline tests make no provider
    calls. W1-T11119's owner, branch and status are untouched; no source task is dispatched by this filing.
  acceptance:
    - claim: Replay from frozen post-learner inputs reproduces the exact selector branch, selection and downstream model identity the production site ran, including learned mixing
      proof: 'unit test: test/routing/model-canary-router-decision-replay.test.ts'
    - claim: Replay reads no live capacity, health, credential or clock state
      proof: 'grep: W1-T11598 criterion 2: replay reads no live capacity health credential or clock in test/routing/model-canary-router-decision-replay.test.ts'
    - claim: An unrepresentable branch, unverifiable input or any branch, selection or model identity mismatch makes router evidence unavailable
      proof: 'grep: W1-T11598 criterion 3: unrepresentable branch unverifiable input or identity mismatch yields unavailable router evidence in test/routing/model-canary-router-decision-replay.test.ts'
    - claim: A routing-pool counterfactual is labelled non-production and unavailable, and never substitutes for the actual route
      proof: 'grep: W1-T11598 criterion 4: pool counterfactual is labelled non-production and never substitutes for the actual route in test/routing/model-canary-router-decision-replay.test.ts'
    - claim: Propensity weighting is emitted only as a diagnostic, and only from genuinely captured selector probabilities
      proof: 'grep: W1-T11598 criterion 5: propensity diagnostic requires genuinely captured probabilities in test/routing/model-canary-router-decision-replay.test.ts'
    - claim: The production worker decision site captures the frozen decision before execution
      proof: 'grep: captureRouterDecision( in src/lib/worker.ts'
  falsifier: >-
    Capture decisions from both the selectWorkerProviderForPolicy branch and the learned-mixing
    selectWorkerProvider branch at the real site, then replay them. Mutating any frozen input (capacity,
    reserve, draw seed, mixing), capturing pre-learner capacities, swapping the downstream model, or
    replaying through the other branch must mismatch under criterion 1 and read unavailable under
    criterion 3. Injecting a live capacity, health, credential or clock read must fail criterion 2.
    Presenting a pool decision as the route must fail criterion 4. Removing the probability guard must
    fail criterion 5.
