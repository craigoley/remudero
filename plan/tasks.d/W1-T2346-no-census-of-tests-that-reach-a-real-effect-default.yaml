  note: |
    THE FALSIFIER WAS RUN BEFORE THIS WAS FILED, AND IT IS RECORDED BECAUSE IT PARTLY SUCCEEDED. The
    feedback offered an exit — if the default already refuses without a token, only the fixture is at
    fault. It does not refuse (rationale 1), so the exit is closed. But the guard DID hold at the
    write leaves (rationale 2), so the honest claim is narrower than the report's: no money was spent
    and no PR was merged. What was reached was a live REST read and the machine's own config. File
    the smaller true thing.

    `risk: medium` IS RULE 19'S SPAN AND ALSO THE BLAST RADIUS. ONE declared path, ONE stem, no `src/`
    change, and the deliverable is a static read that cannot itself reach an effect. Arguing it up to
    `high` because the SUBJECT is auto-merge would be flattering the filing; the artefact is a test
    file that reads two directories.

    EVERY PROOF IS THE PURE-PATH `unit test:` FORM NAMING A FILE THAT DOES NOT EXIST ON THIS TREE, so
    each resolves through W1-T456's forward-reference carve-out to `not_yet_built` on the filing PR
    and EXECUTES once the file lands. No proof greps its own declared path, and none names an
    existing test file — a pure-path proof aimed at an existing home would pass today and discriminate
    nothing.

    `files:` IS THE ONE FILE THIS TASK WRITES. Every `src/` and `test/` path the check READS is
    deliberately undeclared: a declared-but-untouched path fails `inverseScopeUntouchedFiles`
    (`src/lib/review.ts`) exactly as an undeclared one fails `scopeViolationFiles`.

    THE COUNTS ARE DATED TO THIS TRIAGE AND ARE QUERIES. 18 `runReview(` sites in 10 files; five
    `deps ... = realArmDeps()` defaults; a five-verb `LiveWriteBoundary`. Re-derive all three; the
    number is not the finding, the derivation is.
