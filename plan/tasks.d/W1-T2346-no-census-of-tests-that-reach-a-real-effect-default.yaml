      proof: "unit test: test/operator-gated-default-reachability.test.ts"
    - claim: "a test that calls an entry point without supplying the seam is reported as reaching that entry point's production default"
      proof: "unit test: test/operator-gated-default-reachability.test.ts"
    - claim: "each reachable default is classified as write-fenced or unfenced and a live read counts as unfenced"
      proof: "unit test: test/operator-gated-default-reachability.test.ts"
    - claim: "a default that reaches loadConfig or the ledger path counts as reaching ambient machine state"
      proof: "unit test: test/operator-gated-default-reachability.test.ts"
    - claim: "an exclusion carrying no stated reason does not excuse a candidate"
      proof: "unit test: test/operator-gated-default-reachability.test.ts"
    - claim: "the check completes without running a suite spawning a process or touching the network"
      proof: "unit test: test/operator-gated-default-reachability.test.ts"
