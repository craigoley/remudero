    - claim: "a protected branch missing from the declared list fails rather than being swept silently"
      proof: "unit test: test/branch-reaper-dry-run.test.ts"
    - claim: "the dry run deletes nothing and issues no delete call at all"
      proof: "unit test: test/branch-reaper-dry-run.test.ts"
