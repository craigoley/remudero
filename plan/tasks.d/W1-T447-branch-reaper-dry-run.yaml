  note: "verify:human — TWO rulings are needed and neither is an engineering call. FIRST, whether the
    fleet may ever delete a remote branch autonomously; this task builds only the dry run, so the
    ruling can wait, but the second version cannot start without it. SECOND, the 46 no-PR branches:
    the evidence says they are abandoned attempts of tasks that all shipped, and the failure
    diagnosis is in the ledger rather than the branch, SO THE RECOMMENDATION IS TO DELETE THEM AFTER
    A 30-DAY WINDOW MEASURED FROM LAST COMMIT — 30 days because the oldest is 29 days and the median
    24, so a 30-day window sweeps none of today's and still drains the backlog as it ages. That is a
    recommendation, deliberately not split down the middle, and it is the operator's to accept.
    `test/sweep.test.ts` IS DECLARED AND THE REASON IS MEASURED, not defensive: it invokes the sweep
    62 times (`git grep -c` on the invocation, not prose mentions), against 8 in
    `sweep-pass-heartbeat`, 7 in `sweep-arm-parity` and 6 in `sweep-absent-repush`. It is the suite
    that moves when the sweep gains a pass. FIVE tasks were refused at push this week for a `files:`
    omitting exactly such a suite, and a sixth was corrected mid-flight.
    `src/lib/status.ts` is declared because the branch-ownership predicates the reaper must reuse
    rather than respell — `ownsBranch`, `isBareRunBranch`, `isOwnedSlugBranch` — live there, and a
    fourth spelling of what a run branch looks like is the defect this repo keeps re-filing.
    IT MAY BE RIGHT TO STOP AT THE REPORT. If the drift check needs hand-maintenance anyway, a
    periodic report the operator acts on in one command still gets him out of GitHub, which is the
    actual goal — and it is strictly safer. Whoever builds this should be willing to conclude that
    the dry run IS the product.
    NO COUNT HERE SHOULD BE QUOTED FORWARD — 105/55/51/46/16 and the 4 protected were true at
    2026-08-12T22:00Z, on a repo whose branch list changes hourly. Re-measure."
