- id: W1-T5666
  title: "EVERY HARNESS ENV NAME A SOURCE FILE READS IS REGISTERED, HOWEVER IT IS SPELLED — env-var-registry's `ENV_LITERAL` matches only a QUOTED literal, so nine names read as `process.env.RMD_X` or `env.RMD_X` (RMD_WORKER_EGRESS, RMD_GH_CACHE_HOME, …) are absent from ENV_REGISTRY while the census reads green"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high  # Rule 19: one census — the env registry and the scan that holds src to it
  origin: "operator session 2026-10-04: watch log, the ENV_REGISTRY census scans src only and RMD_SCRATCH_ROOT is unregistered"
  plan_refs: [W1-T5631]
  files: [src/lib/config-schema.ts, test/env-var-registry.test.ts, test/every-env-name-a-source-file-reads-is-registered.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 284015b9. test/env-var-registry.test.ts scans `git ls-files
    src/**/*.ts` with `ENV_LITERAL = /(["'\`])(RMD_[A-Z0-9_]+|REMUDERO_[A-Z0-9_]+)\1/g`, a quoted
    literal only. Nine names are read by dot access and unregistered: REMUDERO_PROCESS_ACTOR,
    REMUDERO_SESSION_ID, RMD_GH_CACHE_HOME (src/lib/config.ts `env.RMD_GH_CACHE_HOME`),
    RMD_GH_TRANSPORT_FLOOR, RMD_OPERATOR_MCP_URL, RMD_PROVIDER_AUTH_PROFILES,
    RMD_RESOURCE_POLICY_CONTAINER, RMD_RESOURCE_POLICY_ROLE, RMD_WORKER_EGRESS (src/lib/worker.ts
    `process.env.RMD_WORKER_EGRESS`). RMD_SCRATCH_ROOT itself is read only by deploy/scratch-mounts.sh
    and scripts/fleet-heartbeat.sh; whether ENV_REGISTRY should also hold the ~151 shell-only knobs is
    an operator decision and NOT THIS TASK. W1-T5631 touches only test/setup/no-live-remote.ts.
  design: |
    Widen the census to also match `<identifier ending env>?.RMD_X` / `.REMUDERO_X` reads, and
    register the nine names in ENV_REGISTRY (src/lib/config-schema.ts) with purpose and readBy.
  acceptance:
    - claim: "a dot-access RMD_ or REMUDERO_ env read in src is held to ENV_REGISTRY exactly like a quoted literal, and the nine names are registered"
      proof: "unit test: test/every-env-name-a-source-file-reads-is-registered.test.ts"
  falsifier: |
    Remove one of the nine registry entries; the census names it and the test fails.
