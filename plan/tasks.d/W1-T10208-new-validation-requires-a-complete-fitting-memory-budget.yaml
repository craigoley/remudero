  design: |
    Add a validation-only typed entry point backed by the SAME maintained evaluator, queue,
    priority/aging order, lock, backoff and reservation ports. Leave awaitMemoryAdmission's
    existing signature, outcomes, worker/garden policy and legacy tiers unchanged. No parallel
    admission loop, post-return snapshot reread, withLock interception, new threshold or model
    switch. This task supplies the shared prerequisite, NOT parent wiring or class activation.

    Inside the locked evaluation, BEFORE opening/publishing a reservation, marking a PSI start,
    updating rung state or emitting an admission, distinguish a supported complete fitting budget
    from unavailable evidence. Name the essential host/container generation and pressure inputs,
    host-scope ledger and ownership/walk completeness, serve/daemon allowance and actual class
    measurement basis. An optional typed basis may be carried from existing native measurements;
    do not infer it from a numeric estimate, median, prior, zero placeholder or an absent field.
    Do not change the existing estimator or turn synthetic fixture records into live evidence.

    A complete supported fit may publish one visible own handle atomically, with the normal
    estimate/visibility checks. Known measured shortfall with accounted live work uses the
    existing ranked async wait and original cancellation/deadline. Error, missing/reset/partial
    essential evidence, incomplete fits and non-fit legacy escape tiers return an explicit
    validation-only not-started/unavailable result, never accepted, undefined, skipped or PASS.
    A measured shortfall with no accounted work to wait for refuses rather than claiming ready.
    Existing worker positive controls retain their current named escape behavior unchanged.

    Shadow/off, hosted CI and non-daemon callers retain their existing behavior and must not be
    described as enforced budget qualification. Abort races settle only this start's unbound own
    handle through the native lifecycle; never release a foreign or live tree, rewrite ownership,
    reclaim a claim from age, double-charge nested work or forward daemon authority into a
    sandbox. Add no provider/model call, retry, credential, permission, threshold, hard limit,
    spending setting, service operation or hosted-gate change.

    Drive real maintained default lock/publication/read catch paths using private stores and
    harmless local children, not all-fake tests. Contrast new validation with the existing worker
    semantics; test missing basis, generous-but-incomplete fits, errors before/after publication,
    no-work shortfall, ranked wait then fit, publication/visibility/estimate refusal, cancellation
    and held-descendant controls. No running production worker or ledger is a fixture.

    Qualify the committed head with physical whole-file summaries, caller/census checks, type
    checks, instrumented same-head full diff coverage, production-removal falsifiers, normal
    author/review/current-head hosted gates. Representative calibration of the actual parent
    test/check-proof/push shapes and separate reviewed parent wiring remain required before the
    approved NEW-class activation. This foundation changes no classModes or live setting and is
    not evidence that Azure's memory root cause or the console's data problems are resolved.
