- id: W1-T2800
  title: "a Codex worker inherits the operator's real HOME, so an rc file sourced inside the worker re-exports ANTHROPIC_API_KEY past two exclusions written to stop it, and the leak is invisible to the instrument that reports billing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 32.00
  risk: high
