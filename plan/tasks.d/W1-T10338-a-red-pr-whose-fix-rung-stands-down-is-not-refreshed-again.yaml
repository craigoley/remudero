  rationale: |
    OBSERVED, core ledger on host remudero (rmd-state2, read-only; rotations from 2026-10-18 plus the live file, newest
    row 2026-10-21T10:31Z; rows deduplicated by ts):
    - Refreshes of #13218 (`branch.update_requested` outcome updated): 23:30:29Z on 660d92ce9 (`sweep.update_branch`,
      "ambiguous overlap: the judge ruled overlap"); 00:07:11Z on 7ed190c76 (`sweep.base_fixed.refresh`, "CI in flight;
      a refresh would cancel or duplicate the run: the judge ruled overlap"); 03:21:05Z on 2f835beef
      (`sweep.update_branch`, "overlap: main changed 1 of this PR's files"); 04:34:44Z on dd63fd77f
      (`sweep.base_fixed.refresh`, "repair: the refresh clears a fault the head cannot clear itself"). The first three
      refreshes' `sweep.refresh.outcome` rows read `red` (01:44Z twice, 04:05Z); the fourth's reads `left-open-set`
      (05:33Z).
    - Over 21:42Z..04:53Z, 28 `fix.stood_down` rows (site `rung.strike`) on PR-13218 cite an open escalation:
      #13219 (3), #13246 (3), #13250 (12), #13288 (9), #13293 (1). Each refresh's new head got its own metadata-only
      escalation: #13246 at 23:34Z (7ed190c76), #13250 at 00:12Z (2f835beef), #13288 at 03:24Z (dd63fd77f), #13293 at
      04:38Z (bfda2ea6c). The red that held the PR, acceptance-author-gate on the body, is one a refresh cannot change.
    - Cost (INFERRED from the doctrine's ~16 min of CI per refresh): about 64 min of CI and four escalation issues, with
      no step toward green.
    READ at origin/main 16f4c28fc (symbols, not lines): the update-branch slot (`selectUpdateBranchDecision` behind
    W1-T7735's value gate) spends one refresh per (PR, head) via `sweep.update_branch.attempted`, and the base-fixed
    arm (`BASE_FIXED_REFRESH_STEP`) presses a refresh when a trial merge clears the failing test files. A refresh makes a
    new head, so the per-head spend never bounds a sequence, and neither arm reads whether the fix rung is standing down
    or whether the last refresh came back red.
    NOT COVERED ELSEWHERE: W1-T10314 (queued, #13307) lets a strike past a metadata-only escalation for a code red it
    never named; it changes stand-downs, not refreshes. W1-T9585 (queued) does the same for stalled-stage escalations.
    W1-T7735 (merged) asks whether one refresh is worth a CI run, without history. Swept origin/main plan/tasks.d and
    every open PR head's plan tree for update_branch, base_fixed.refresh and refresh.decided: no shard bounds this.
  design: |
    1. A refresh candidate (the update-branch slot and the base-fixed arm alike) is not admitted when, at its current
       head, the fix rung's newest row is a stand-down on an open escalation (`fix.stood_down` naming an issue, or
       site `rung.needs_design`), AND the refresh that produced this head ended `sweep.refresh.outcome` red. The skip is
       written on the existing `sweep.refresh.decided` row (decision skip, reason naming the escalation and the red
       refresh), once per head.
    2. The bound releases when the escalation closes, a head arrives that no refresh produced (a person's or the fix
       lane's push), or the PR's red set changes. A PR with no stand-down, or whose last refresh went green, keeps
       today's behaviour.
    3. No new config key, constant or env var. "One red refresh per stand-down" is structural; changing it is an
       operator decision.
