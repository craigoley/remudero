- id: W1-T11432
  title: "A review re-admitted after its reviewer reported UNABLE is spawned on a provider other than the one that was unable, when another provider is eligible"
  repo: remudero
  depends_on: [W1-T11428]
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern, which provider a re-admitted review's reviewer is routed to; it spans the auction, the sweep and the review command
  band_meaning: span
  origin: operator-session#review-infra-fail-as-fail-2026-11-05
  plan_refs:
    - W1-T11428
    - W1-T100
  files:
    - src/lib/worker.ts
    - src/lib/sweep.ts
    - src/cli/commands/sweep.ts
    - src/cli/commands/review.ts
    - src/lib/run-child.ts
    - src/run-task.ts
    - test/worker/spawn/a-review-re-admitted-after-an-unable-reviewer-avoids-that-provider.test.ts
    - test/worker/a-review-child-start-is-attributed-and-starts-from-a-bundle.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: The worker auction accepts a set of providers to exclude and never selects an excluded provider while another candidate is eligible; with no eligible alternative it selects as today and records that the exclusion could not be honoured
      proof: "unit test: test/worker/spawn/a-review-re-admitted-after-an-unable-reviewer-avoids-that-provider.test.ts"
    - claim: A review re-admitted after a cannot-evaluate whose prior review.reviewer row named a reviewer-unavailable provider spawns its reviewer with that provider excluded
      proof: "grep: W1-T11432 criterion 2 in test/worker/spawn/a-review-re-admitted-after-an-unable-reviewer-avoids-that-provider.test.ts"
  rationale: |
    Split from W1-T11428 (operator-approved, 2026-11-05). W1-T11428 makes an unable reviewer's review cannot-evaluate instead of a FAILURE, but the existing re-admission spawns the next reviewer through the same auction, which routed the 17:13Z #16758 review to codex while Claude was below its reserve; under the same pressure the retry lands on the same unable provider. The W1-T11428 builder found no exclude-provider mechanism anywhere in src: the reviewer is spawned at src/cli/commands/review.ts ~:849-890 with mountProvider, and the provider is chosen in src/lib/worker.ts (selectionPath "auction" ~:2867, ~:3390).
    The CLI sweep adapter in `src/cli/commands/sweep.ts` carries the excluded provider through the
    existing re-admission dispatch into the reviewer spawn seam, so this adapter belongs in scope.
    W1-T100 owns generic blocked_ci to ci-log fix dispatch; this shard addresses the distinct UNABLE-review re-admission route, excluding the prior reviewer provider and preserving that exclusion through detached and fresh/healed child routes, so it adds the owning propagation seams `src/lib/run-child.ts` and `src/run-task.ts`.
  design: |
    1. src/lib/worker.ts: the auction input gains excludeProviders (a set). Candidates whose provider is in it are ineligible while any other candidate is eligible. With none left, the auction selects as today and the assignment records exclusion_unhonoured with the reason, so a single-provider host still reviews. No fixed thresholds.
    2. src/lib/sweep.ts: on re-admitting a head whose last review was cannot-evaluate with reviewer-unavailable criteria (W1-T11428's marker on review.posted / review.reviewer), carry the provider named on that run's review.reviewer row into the re-admitted review's spawn.
    3. src/cli/commands/review.ts: the reviewer spawn passes excludeProviders through, and review.reviewer records the exclusion and whether it was honoured.
    Tests: an auction with two eligible providers and one excluded selects the other; with only the excluded one eligible it selects it and records exclusion_unhonoured; a re-admission after an UNABLE review spawns with the prior provider excluded (at base the option does not exist, so the file cannot link). The detached and fresh/healed child-route regression is added to the existing reviewer child-start suite because `rmd test-place` places its production-boundary imports under `test/worker/`.
  falsifier: |
    At origin/main, a review that went cannot-evaluate because its codex reviewer could not launch its sandbox is re-admitted and routed to codex again by the same auction pressure, and is unable again.
  note: |
    reservation hand-off: plan-file-1793901101000 -> plan-file-1793901101000
    Reserved with rmd next-task-id from the operator session's ops worktree.
