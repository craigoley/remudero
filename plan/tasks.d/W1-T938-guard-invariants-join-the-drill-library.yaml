  design: |
    ADD ENTRIES TO THE EXISTING TABLE. DO NOT BUILD A SECOND DRILL, A SECOND WORKFLOW OR A SECOND
    SCHEDULER. `RECOVERY_PATHS` is already the growth mechanism the feedback asked for: `runDrill(paths)`
    is pure and total over whatever table it is handed, so a new fault costs one entry plus one
    exerciser. W1-T366's design (i) says in terms 'do not invent a second scheduling idiom', and the
    weekly workflow already executes the whole table — which is also why the feedback's 'ONE fault per
    cycle from a ROTATING library' is DECLINED AS SPECIFIED: rotation would drill each fault a quarter as
    often and add cross-run state to a stateless instrument. If total runtime ever forces rotation, that
    is a measured argument to make in the PR body with numbers, not a starting assumption.
    THE QUALIFICATION CRITERION IS W1-T366'S, UNCHANGED, AND EACH CANDIDATE MUST BE CONFIRMED AGAINST IT
    FROM SOURCE: a path qualifies when it (a) exists to survive a failure, (b) is not exercised by the
    ordinary success path, and (c) has an observable outcome that can be asserted. A candidate that fails
    (c) is a FINDING TO REPORT, not an entry to fake. The table's labels and the script header's
    population note must be widened honestly if guards join it — the instrument stops being 'recovery
    paths' and becomes 'the paths that carry a failure', and a header that still says otherwise is a lie
    the next reader inherits.
    WHAT 'HEALTHY' AND 'SABOTAGED' MEAN FOR A GUARD, stated once because it is the whole design. HEALTHY
    = the fault is injected into the fixture and the guard fires with its NAMED reason and its BOUNDED
    recovery (refuse-with-a-reason, or proceed-and-ledger — whichever the shipped guard actually does;
    read it, do not assume). SABOTAGED = the fault is injected AND the seam the guard depends on is made
    to misjudge (the probe answers wrong, the read silently drops the torn line, the gateway failure
    arrives as an empty-but-successful result), so the guard goes quiet or reports a false clean. An
    entry PASSES only on healthy→healthy and sabotaged→unhealthy, per the orchestrator that already
    exists. The sabotage lives in the FIXTURE, never in a source edit.
    THE CANDIDATE LIST, FROM THE FEEDBACK, EACH TO BE RE-DERIVED FROM SOURCE BEFORE IT IS BUILT:
      1. BINARY HUSK. A real 500-byte non-executable `claude` written into a temp dir (the shape
         test/toolchain-refusal-errno.test.ts already builds), asserting the preflight refuses with the
         reason class that distinguishes an EACCES husk from a binary that runs and crashes. Sabotage:
         the executability probe made to swallow its errno — the `catch { return false }` shape W1-T901
         was filed to end — so both faults render as one indistinguishable string.
      2. TORN LEDGER TAIL. A real fixture ledger whose last line is truncated mid-JSON, asserting the
         projection reports `indeterminate` (DO NOT ACT) rather than a false `clear`. CHECK FIRST FOR
         DUPLICATION: `exerciseCircuitBreakerReset` already sabotages with a torn read. If the shipped
         entry already covers this fault at this layer, say so in the report and drop the entry rather
         than shipping a second copy — a drill with two entries for one fault overstates its own
         coverage.
      3. GH 500s / EMPTY VIA THE INJECTABLE GATEWAY. A gateway stub returning 500s, then an empty body,
         asserting the degrade-don't-die path names the read as undecided (the `unavailableReason` /
         `githubUnobservableSince` family) and never renders 'no PR' as fact. Sabotage: the failure
         surfaced as a successful empty read.
      4. DIRTY DAEMON TREE. A throwaway git checkout dirtied in one shape, asserting the freshness
         predicate LEDGERS `daemon.tree_dirty` AND PROCEEDS. Sabotage: the predicate made to refuse, which
         must be caught — a refusal here is the nonzero exit that `KeepAlive{SuccessfulExit:false}` turns
         into the crash loop. SCOPE FENCE: W1-T924/W1-T925/W1-T926 own the operator-dirt TOPOLOGY and its
         five dirt shapes; this entry owns ONE shape exercised ON A CADENCE, and must not rebuild their
         table or edit `scripts/operator-dirt-drill.mjs`.
      5. SIGKILL MID-RUN. A real throwaway child process, started against a fixture state dir, killed
         with SIGKILL, asserting the invariant that carries the fleet past it (the crash-loop detector
         over `daemon.boot` timestamps, and/or the liveness/orphan classification of the killed run —
         establish which from source). A real child is consistent with the drill's existing posture: git
         and the filesystem are real there, only host-touching commands are faked. IF A FIXTURE CANNOT
         FAITHFULLY REPRODUCE THIS ON A CI RUNNER, SAY SO IN THE REPORT AND DROP IT — W1-T366's design
         (iii) demands exactly that, and the unattended live version is already filed as W1-T147.
    NEVER TOUCHES A LIVE FLEET, and this is the reason the feedback's `drill.executed` ledger line is NOT
    built here. The drill runs in CI against throwaway fixtures with `contents: read`; there is no live
    ledger to append to and injecting these faults into the running daemon would trade one outage class
    for another (W1-T366 design (iii)). The drill's per-cycle record is its report artifact plus the
    needs-human issue on failure — the delivery path that already exists. A ledgered `drill.executed` on
    the real fleet is a DIFFERENT instrument and belongs to W1-T147's operator-run drill, not here.
    OUT OF SCOPE, EXPLICITLY: changing any guard's behaviour (an entry that finds a guard broken is a
    finding, and its fix is its own task), the cadence/cron/workflow polarity, rotation state, W1-T147's
    unattended live drill, and the incident→drill growth rung (filed as its own shard).
