- id: W1-T11929
  title: A delivered review verdict whose status context reads pending is settled by re-posting the delivered state, not skipped as a duplicate and not re-reviewed
  repo: remudero
  depends_on: []
  priority: 1.1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # Rule 19: one concern, how the sweep resolves a delivered verdict against a pending status; admission order, capacity and the 60 minute pending ceiling are unchanged
  origin: operator-session#github-access-1109
  plan_refs:
    - W1-T5866
  files:
    - src/lib/sweep.ts
    - test/a-delivered-verdict-settles-a-pending-status-by-reposting-its-state.test.ts
    - test/console-api/board/a-status-regressed-to-pending-on-a-delivered-head-is-restored.test.ts
  status: merged
  attempts: 0
  acceptance:
    - claim: When the ledger shows a verdict delivered for an input key and the head's remudero-review context reads pending, the sweep re-posts the delivered state under the same description and writes a review.settled row
      proof: "unit test: test/a-delivered-verdict-settles-a-pending-status-by-reposting-its-state.test.ts"
    - claim: A pending status whose input has no delivered verdict, or whose delivered verdict was for another head, is left to the existing paths
      proof: "grep: W1-T11929 criterion 2 in test/a-delivered-verdict-settles-a-pending-status-by-reposting-its-state.test.ts"
    - claim: A context that already reads the delivered state causes no post
      proof: "grep: W1-T11929 criterion 3 in test/a-delivered-verdict-settles-a-pending-status-by-reposting-its-state.test.ts"
  rationale: |
    OBSERVED 2026-11-09: #17485 received a delivered FAIL from the fleet reviewer at 21:12Z (the status history shows failure at 21:12:03 and 21:12:18), then two stale-claim takeovers wrote pending over it at 21:20 and 22:08. From then the sweep logged, for the same input key, "a verdict was already DELIVERED for input [...] - the action-time re-read deduped the re-post", and "remudero-review pending 106m (>= 60m ceiling) - re-running the review lane" with acted false, 18 times. The two rules together are a deadlock: the re-run is deduped because a verdict exists, and the verdict is not re-posted because it is the dedupe.
    - A required check pending forever on a PR with a delivered verdict is the stuck PR this system exists to prevent.
  design: |
    - At the sweep's dedupe point, when a delivered verdict for the exact input key exists and the head's context disagrees, post the delivered state instead of returning a no-op.
    - NOT IN SCOPE: the takeover rule, review admission, the pending ceiling, and the content of any verdict.
  falsifier: |
    Leave the dedupe a no-op: criterion 1 must fail. Re-post a verdict for another head: criterion 2 must fail. Post when the state already agrees: criterion 3 must fail. Restore and require all three.
  note: |
    reservation hand-off: run-unfiled-1794267225693
    Success is no PR with a delivered verdict and a pending required check beyond one sweep pass.
