- id: W1-T2222
  title: "THE BOARD'S INDEX WALK RE-READS THE WHOLE CORPUS EVERY CYCLE AND THE ISSUE HALF HAS NO DELTA MODE AT ALL — the cold PR half already stops at a known `updated_at`, the hot half and the issue fetch stop at nothing, and all of it shares one account budget with an unpaced per-row storm"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 30.00
  rationale: |
    RE-DERIVED 2026-08-24 in a scratch worktree with `HEAD == origin/main` (caa79046) PROVEN before
    any reading; the clone was checked and already full (2,109 commits). Ledger gate FIRST:
    archiveCount 23, ok true, with the control `"step":"risk_judge.decision"` reading 173. THE
    REF COUNT WAS VERIFIED AGAINST THE REMOTE BEFORE SWEEPING and was one short — 339 local against
    340 remote — so the sweep ran on refetched refs.

    (1) THE OPERATOR'S MEASUREMENT RE-DERIVES EXACTLY, SCOPED TO THE SERVE CONTAINER. In
    2026-08-24 11:00–12:59Z, host `e5afe226f001`: 17 PR fetches totalling 100,949,656 B and 13
    issue fetches totalling 39,509,681 B — **140,459,337 B parsed on one thread in two hours** —
    with the cold walk at 11:46:35.157Z reading 45,111,796 B over 23 REST calls. Every figure
    matches. TWO CORRECTIONS ARE RECORDED RATHER THAN SMOOTHED OVER, BOTH NARROWING THE CLAIM.

    (2) CORRECTION A: THE FIGURE IS SERVE-SCOPED, AND THE FLEET-WIDE NUMBER IS 3.2x LARGER. Across
    ALL hosts in the same window the same steps read 382,401,045 B of PR fetches and 72,945,335 B
    of issue fetches — 455,346,380 B — because the daemon runs its own gateway instance beside
    serve's. The 140 MB is what ONE console cost; the account pays the larger number.

    (3) CORRECTION B: `issue_fetch_bytes` IS NOT CONSTANT. Within serve it reads 3,036,532 B seven
    times, 3,042,139 B five times and 3,043,262 B once; across all hosts there are EIGHT distinct
    values spanning 3,035,602–3,046,196 B. `issueCount` moves 523 → 524 across the window. So the
    payload is ~3.04 MB and tracks the issue set; it is not a fixed number. THE POINT SURVIVES AND
    IS STRONGER STATED CORRECTLY: one issue changed in two hours and the fetch re-read ~3 MB
    THIRTEEN TIMES to notice it.

    (4) THE COLD PR HALF ALREADY HAS THE DELTA — THE HOT HALF DOES NOT. `fetchBoardPrsRest`
    (`open-prs-rest.ts`) walks a `state=open` half and a `state=closed` half, each bounded by
    `BOARD_MAX_PAGES = 50`. The COLD loop carries a real short-circuit: `if
    (known?.get(row.number)?.updatedAt === row.updated_at) { reachedKnown = true; break; }`, and
    its own doc proves the stop sound — the walk is sorted `updated_at` descending, so the first
    matching row means every row below it is unchanged. THE HOT LOOP HAS NO SUCH TEST: it re-maps
    every open row every cycle and exits only on a short page. `mode` is `delta` whenever `known`
    is non-empty and `full` otherwise, and it selects only the PAGE SIZE
    (`BOARD_DELTA_PAGE_SIZE = 30` against the full size), never whether a half is walked.

    (5) SO THE 45 MB IS A COLD-CACHE COST, AND THE CONSOLE PAYS IT PER BOOT. Both `mode=full`
    fetches in the window are cold walks — 45,111,796 B at 11:46:35 and 45,328,064 B at 12:47:25,
    each over 23 REST calls — and the second one follows the serve restart at 12:33. Steady-state
    delta fetches in the same window run 639,748–763,880 B over 2 calls. A restart therefore costs
    roughly 45 MB and 23 calls before the console can render anything.

    (6) THE ISSUE SIDE HAS NEITHER A DELTA NOR A NOTION OF ONE — ABSENT, NOT BROKEN.
    `fetchAllIssues` (`status.ts`) is one line: `run(labelledIssuesRestArgs(slug,
    NEEDS_HUMAN_LABEL, "all"))`, and that helper (`escalate.ts`) returns `["api",
    "repos/<slug>/issues?labels=<label>&state=all&per_page=100", "--paginate"]`. THERE IS NO
    `known` PARAMETER, NO `since`, AND NO `updated_at` COMPARISON ANYWHERE ON THIS PATH. Its cache
    (`issueIndex`) is a pure TTL: `if (!issueCache || now() - issueCache.at >= ttlMs)` re-fetches
    the WHOLE list. There is nothing to repair — the mechanism was never written.

    (7) AND THE SOURCE'S OWN SIZING ASSUMPTION IS WRONG BY THREE ORDERS OF MAGNITUDE. The comment
    above that fetch says it is "Scoped to `--label needs-human` ... so this stays one small,
    bounded fetch (dozens of rows) rather than every issue in the repo." MEASURED: 523–524 rows and
    ~3.04 MB. The scoping is real and the bound it was expected to produce is not; a reader
    trusting that comment would not look here at all.

    (8) THE COUPLING, AND IT IS WORSE THAN A SHARED BUDGET. Both halves of the walk wait their turn
    on ONE pacer — `paceGhEntry(pacer, isGhRateLimitError, fetchAllIssues)` for issues and the
    identical shape for PRs. BUT THE PER-ROW CALL DOES NOT: `reviewState` runs
    `run(combinedStatusRestArgs(owner, repo, headRef))` DIRECTLY, with no `paceGhEntry` wrapper.
    So the walk paces itself against a budget the per-row storm spends without pacing. OBSERVED
    CONSEQUENCE: `board gateway: batched PR fetch failed (rate_limit)` repeated from 22:08 to
    23:31Z on 2026-08-22 before the container was stopped — the paced caller is the one that
    visibly failed.

    (9) THIS IS NOT W1-T2217, WHOSE SHARD IS ALREADY ON MAIN AND IS ONLY CITED HERE. That task owns
    the per-row `combinedStatusRestArgs` storm on a cold memo. THIS TASK OWNS THE WALK THAT FEEDS
    THE INDEX, which runs on its own TTL regardless of whether any memo is warm — the two are
    separable, they are separately measurable (`fetch_bytes`/`issue_fetch_bytes` against the
    per-row calls), and (8) is precisely the reason they must not be merged: fixing either alone
    still leaves the other spending the same budget.

    (10) THE SWEEP CAUGHT A COLLISION AND THAT IS RECORDED AS A RESULT. The obvious id, W1-T2221,
    was reserved 17 minutes before this brief and looked like the intended one; the open-PR
    surfaces showed it ALREADY CLAIMED by `origin/plan/plan-only-carve-out-gated-on-execution` on a
    different subject. The id was not guessed — the operator supplied W1-T2222, whose reservation
    (2026-08-24T13:58:18Z) was then verified present, absent from main, and unclaimed by any live
    branch against a control of 1 for W1-T2221.
    (11) THE FIELD HAS AN ANSWER TO THIS EXACT WALK, AND IT WAS READ RATHER THAN SUMMARISED.
    `github.com/Untrivial-ai/agent-orchestrator`, cloned at `c7a22bb` (2026-08-25T01:23:44+05:30),
    runs an ETag-guarded SCM observer at `backend/internal/observe/scm/observer.go`, whose header
    describes a "polling loop, ETag/cache checks, semantic diffing, DB persistence". Its guard
    interface takes the validator as an argument — `RepoPRListGuard(ctx, repo, etag)` and
    `CommitChecksGuard(ctx, repo, headSHA, etag)` — and its cache holds `RepoPRListETag` and
    `CommitChecksETag` as bounded maps with FIFO eviction. THE SHAPE IS THE ONE THIS SHARD'S ISSUE
    ARM LACKS: a validator per endpoint, held beside the facts, sent on the next poll.

    (12) AND ITS RESULT TYPE ALREADY SOLVES THE THING (iii) BELOW WORRIES ABOUT.
    `ports.SCMGuardResult` is `{ ETag string; NotModified bool }`, documented as "an ETag-style
    cache guard result. NotModified maps to HTTP 304 for providers that support it." Separately,
    `SCMObservation.Fetched` is documented as "true ONLY when the provider refresh succeeded and
    the nested facts are authoritative for this poll." THOSE TWO FIELDS CARRY THREE STATES —
    unchanged (304), refreshed-and-authoritative, and read-failed-so-not-authoritative — WHICH IS
    EXACTLY THE SPLIT AN ETag MISS NEEDS AND THE ONE A BARE BOOLEAN DESTROYS.

    (13) Q1, PRIMARY LIMIT — GITHUB'S OWN DOCS, NOT A BLOG. The REST best-practices page states:
    "Making a conditional request does not count against your primary rate limit if a `304`
    response is returned and the request was made while correctly authorized with an
    `Authorization` header", and separately that "each `304 Not Modified` response is fast and does
    not use your rate limit". So on the primary limit the answer is yes, conditionally on being
    authorized — which this fleet always is.

    (14) Q1, SECONDARY LIMIT — THE DOCS DO NOT SAY, AND I COULD NOT MEASURE IT. The same page
    mentions secondary limits only in other contexts (avoiding concurrent requests, pausing between
    mutative ones) and gives NO guidance connecting conditional requests to them. I ATTEMPTED THE
    MEASUREMENT AND IT IS CONFOUNDED: `x-ratelimit-used` moved +14 across roughly eleven
    conditional requests that all returned 304, but the control moved +9 across three unconditional
    reads plus two measuring reads, so background traffic from the daemon and serve — which share
    this token and poll continuously — is of the same order as the signal. NOTHING HERE ESTABLISHES
    WHETHER A 304 SPARES THE SECONDARY LIMIT, AND THAT IS THE LIMIT THAT HAS ACTUALLY BEEN BLOCKING
    READS. The remedy's headline benefit is therefore proven for the wrong limit.

    (15) Q2 — `gh api` CAN SEND ONE, AND THE 304 ARRIVES AS A THROW. MEASURED DIRECTLY: `gh api`
    exposes `-H, --header key:value`, and re-requesting with `If-None-Match:` set to a previously
    returned validator produces `HTTP/2.0 304 Not Modified` with `X-Ratelimit-Resource: core` on
    the response. BUT `gh` EXITS 1 ON THAT 304. The gateway shells `gh` through `execFileSync`,
    which throws on a non-zero exit, so a 304 would land in the SAME `catch` a real failure lands
    in — and that catch is the one this repo has now filed three times as the
    unreadable-input-as-finding class. The status line is visible with `-i`, so the information is
    RECOVERABLE, but only by a caller that tolerates exit 1 and parses the status rather than
    trusting the exit code.

    (16) SO THE TRANSPORT QUESTION IS REAL BUT SMALLER THAN IT LOOKS, AND THE BOUNDARY IS STATED.
    A different transport is NOT required: `-i` plus an exit-code-tolerant reader is enough to tell
    304 from failure. What IS required is that the reader stop treating `execFileSync`'s throw as
    proof of failure on this one call, which is a change to how the issue fetch is invoked rather
    than to what invokes it. IF A FUTURE READING SHOWS `-i` CANNOT DISAMBIGUATE A 304 FROM A
    TRANSPORT ERROR ON A REAL FAILURE, THEN THE REMEDY NEEDS A DIFFERENT TRANSPORT AND THAT IS
    LARGER THAN THIS SHARD — said plainly rather than discovered later.

    (17) WHAT THE ARITHMETIC WOULD HAVE BEEN. Rationale (3)/(6): the issue arm re-read ~3.04 MB
    thirteen times in two hours across eight distinct byte values while `issueCount` moved 523 to
    524 — ONE changed issue. A validator that held across the unchanged polls would have answered
    TWELVE OF THOSE THIRTEEN with a 304 and no body. That is the size of the prize, and (14) is why
    it is not yet bankable against the limit that actually bites.
  design: |
    ONE CONCERN: the index walk must stop reading rows it already holds. Not the per-row calls, not
    the TTL, not what the board displays.

    (i) THE COLD HALF IS FOR CLOSED AND MERGED WORK, AND ITS ROWS ARE IMMUTABLE. Its own doc says
    so outright: "a merged PR's number, url, state, head ref, body, title and auto-merge record are
    all frozen at merge", and "ROWS THE WALK NEVER REACHES KEEP THEIR CACHED VALUES. That is the
    point." So the 50-page bound is a RUNAWAY GUARD ("50 pages is 5,000 PRs at the full size"),
    never a requirement — on a warm cache the cold half already stops at page 1. What is missing is
    a bound on the COLD-CACHE case, which is the only one that walks all 23 pages.

    (ii) WHAT A RECENCY BOUND WOULD COST, STATED HONESTLY. Bounding the cold walk by recency means
    the board can no longer name a PR that closed before the horizon. `changedFilesByUrl`
    (`status.ts`) IS the in-tree precedent for the other half of this — it is a per-URL map with no
    TTL at all, and the sibling `reviewStateCache` is documented as "DELIBERATELY NOT a
    forever-memo like `changedFilesByUrl`" because an OPEN PR's review state changes while a
    merged PR's file list does not. That distinction is exactly the one this task needs: immutable
    rows may be held past a TTL; live rows may not.

    (iii) THE ISSUE DELTA WOULD KEY ON `updated_at`, THE SAME FIELD THE COLD PR HALF ALREADY USES.
    The current shape is `--paginate` over `state=all`; the REST issues endpoint accepts `since`,
    and the rows carry `updated_at`. Either a `since` parameter or the PR half's stop-at-known-row
    test would work, and reusing the PR half's proven rule is worth more than a second mechanism —
    its soundness argument (sorted descending, first match means all below are unchanged) transfers
    verbatim, and a `since` bound would additionally need a rule for issues that were CLOSED rather
    than updated.

    (iv) WHAT MUST NOT CHANGE, PINNED BY CRITERIA. `DEFAULT_BOARD_POLL_TTL_MS = 150_000` STAYS —
    this task makes each poll cheaper, never rarer, and lengthening the TTL is the move that trades
    freshness for bytes rather than removing waste. THE BOARD STILL SHOWS CLOSED WORK: a bound that
    silently drops merged rows from the board is a regression, not a saving. AND NOTHING CACHES A
    LIVE VALUE PAST ITS TTL — the exemption in (ii) is for rows frozen at merge and for nothing
    else, which is the precise line `reviewStateCache`'s own comment already draws.

    (v) THE PACER GAP IS NAMED AND NOT FIXED HERE. Rationale (8): the per-row `reviewState` call
    bypasses the pacer the walk obeys. Correcting that changes W1-T2217's surface, and folding it
    in would make this change's own proof ambiguous — a fall in bytes could then be credited to
    either edit. It is recorded so the next reader does not mistake the walk's pacing for the
    gateway's.

    (vi) NOT IN SCOPE, NAMED: the per-row `combinedStatusRestArgs` storm (W1-T2217's); pacing the
    per-row call (v); raising or lowering the TTL; `BOARD_MAX_PAGES` as a runaway guard, which
    stays; and what the board renders, which this task must leave identical.
