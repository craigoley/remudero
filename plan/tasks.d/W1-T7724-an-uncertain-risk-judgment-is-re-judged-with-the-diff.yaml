  falsifier: |
    Leave planRiskJudgeAction as the only decision: the re-judge test sees one judge call and an escalation at low /
    0.60, which is #10339's outcome. Drop the patch in changeViewFromRows: the change-view test finds no patch, and the
    diff tier has nothing to show. Keep evidenceQualifiedReason's single form: the diff-tier escalation still says "no
