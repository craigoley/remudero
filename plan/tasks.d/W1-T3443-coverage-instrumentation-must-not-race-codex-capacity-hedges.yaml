  rationale: |
    OBSERVED IN GITHUB ACTIONS ON 2026-09-12. Two otherwise unrelated PRs became red in
    coverage shards after W1-T3435 landed. #5246's coverage-shard (1/4) ran criterion 3
    at test/codex-capacity-singleflight.test.ts:185 with timeoutMs: 5 and received only
    the primary timeout diagnostic: the 60%-of-timeout hedge timer did not run before the
    primary deadline. #5256's coverage-shard (2/4) ran the pre-existing forceRefresh case
    at :356 with the same 5ms timeout and observed two spawns where the completed primary,
    hedge, and forced-refresh exchange require three. Both failures are test-scheduler
    races under coverage instrumentation, not a production capacity-routing regression.

    The direct falsifier was checked locally against #5256's exact head: the complete
    singleflight suite passed 25/25 under Node experimental coverage. That makes the CI
    failures timing-sensitive rather than deterministic, and proves that re-driving the
    affected PRs without widening their synthetic window is not a durable repair.
  design: |
    Widen only the two synthetic stalled-exchange timeoutMs values from 5ms to 20ms:
    W1-T3435 criterion 3 and the forceRefresh failure-backoff section. Preserve their
    existing primary/hedge diagnostics, child-count, cache-boundary, and cleanup
    assertions. Do not change src/lib/worker-provider.ts, the production ten-second
    timeout, the six-second production hedge ceiling, provider selection, cache policy,
    or any runtime behavior.
  acceptance:
    - claim: "criterion 3 deterministically observes both bounded synthetic exchanges before asserting fail-closed hedge diagnostics and ordinary failure backoff under coverage"
      proof: "grep: W1-T3435 criterion 3 in test/codex-capacity-singleflight.test.ts"
    - claim: "the forceRefresh failure-backoff case deterministically observes the primary, hedge, and forced-refresh children under coverage without changing its cache-boundary assertion"
      proof: "grep: forceRefresh bypasses success in test/codex-capacity-singleflight.test.ts"
    - claim: "the repair changes no production capacity-routing code"
      proof: "grep: timeoutMs: 20 in test/codex-capacity-singleflight.test.ts"
  falsifier: |
    Do not implement this task if either failed GitHub Actions log names a different test or
    production capacity-routing behavior, or if the existing 5ms synthetic windows reliably
    produce their required hedge observations under coverage. The current #5246 and #5256
    logs directly falsify those conditions. Reject any patch that changes production timeout,
    hedge, cache, or provider-selection behavior; this task owns test scheduling only.
  note: "W1-T3443 was atomically reserved at refs/rmd-id/W1-T3443 before this filing."
