      proof: "grep: This is an emergency bootstrap repair filed and implemented together in plan/tasks.d/W1-T2854-two-post-merge-impossible-falsifiers-poison-main.yaml"
  falsifier: |
    Close without change if both focused tests pass at origin/main 6eb5432b, or if removing each
    shipped implementation still leaves its positive behavioral test green. The first condition is
    false with the exact 17/19 reproduction above; the existing positive tests are the mutation
    controls and fail when their subject disappears.
  note: |
    ID PROVENANCE: `rmd next-task-id --reserve` reported W1-T2854 as RESERVED on the first attempt
    and created `refs/rmd-id/W1-T2854` after reading W1-T2853 as the maximum.

    `verify: human` is deliberate: the plan linter's Rule 15 correctly refuses an auto task whose
    own filing record and implementation files share a PR. The operator remains the merge gate for
    this explicit bootstrap exception; no worker may infer it as a reusable bypass.

    The normal filing-before-implementation sequence is impossible while main's suite contains the
    two failures this task removes: the filing PR would inherit and reproduce them. Keeping the
    task record in this same narrowly scoped bootstrap repair is the smallest reviewed exception;
    the PR body must name the exception and the unchanged production surface.
