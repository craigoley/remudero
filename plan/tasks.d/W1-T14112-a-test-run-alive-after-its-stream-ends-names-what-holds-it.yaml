- id: W1-T14112
  title: A test run still alive after its reporter stream ends names what holds it open
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  origin: operator-session#coverage-hang-2026-11-21
  plan_refs: [W1-T11020, W1-T11049, W1-T1009]
  files:
    - scripts/pool-run-tally.mjs
    - test/a-test-run-alive-after-its-stream-ends-names-what-holds-it.test.ts
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-11-21 on #19830, run 44857960277, coverage-shard (6/12), job 136704868151: at 03:15:29Z the
    shard printed "# pass 3732 / # fail 0", then ERR_SOURCE_MAP_MISSING_SOURCE for a deleted
    /tmp/rmd-serve-worker-tree-*, then the RMD-TEST-FILE-DIAGNOSTIC phase "stream-ended". Nothing more was printed
    until the 48-minute ceiling cancelled the job at 03:40:16Z. Cleanup then killed orphan processes 2634 and 2663
    (MainThread) and 2635 (tee). The backlog thread counts 5 or more sightings of this shape, none filed.
    INFERRED: a leaked child process or open handle keeps the test process alive after its stream ends, and nothing
    after "stream-ended" is bounded or observed, so each sighting costs a whole shard ceiling and names no cause.
    NOT W1-T11020 / W1-T11049: those are friction-gardener rows for two specific coverage-shard failures (both
    blocked); they mention stream-ended in passing and do not observe what outlives it.
  design: |
    OBSERVE ONLY; no bound, ceiling or gate changes. In scripts/pool-run-tally.mjs, when the diagnostics opt-in is
    on and the event stream ends, arm one unref'd timer (60 s). If the process is still alive when it fires, write a
    single RMD-TEST-FILE-DIAGNOSTIC phase "alive-after-stream-end" line naming what holds it: the
    process.getActiveResourcesInfo() kinds with counts, and the pids and command names of its live child processes
    (read from /proc on Linux; omitted where unreadable). The timer is unref'd, so a process that exits normally
    never waits for it, and the line is written at most once.

    INVARIANT names-without-holding: the observation never keeps a process alive and is written at most once per run.
  acceptance:
    - claim: "A run whose reporter stream ended but which a test-held child process keeps alive prints one alive-after-stream-end line naming that child's pid"
      proof: "grep: W1-T14112 criterion 1: in test/a-test-run-alive-after-its-stream-ends-names-what-holds-it.test.ts"
    - claim: "invariant:names-without-holding — a run that exits normally right after its stream ends prints no alive-after-stream-end line and its exit is not delayed by the observation"
      kind: guard
      proof: "grep: W1-T14112 criterion 2: in test/a-test-run-alive-after-its-stream-ends-names-what-holds-it.test.ts"
  falsifier: |
    Remove the timer: criterion 1's held run prints no alive-after-stream-end line. Make the timer ref'd: criterion
    2's normal run waits 60 s to exit.
