  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 14 merges came from gardeners and 7 from the machine-filing judge.
    - Each gardener gets a checkout from `gardenCheckout` or `gardenCheckoutAsync` in src/run-task.ts. All 8 call sites are in that file. `daemonGardenWorkspace` passes `repoDir`, `owner` and `repo` of the public repository.
    - `gardenLandSteps` commits, runs the preflight, pushes to `origin` of that checkout and opens the pull request.
    - Users: the machine-filing judge, the queue judge, and the gardeners for CI friction, config, host resources, flow, flake incidents, selector shadow and opportunity intake, and the repair of a task file.
    - This is one of five writer tasks. Each one waits for the readers of both catalogs, so that no task goes where no reader sees it.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. Removing `task` from the kinds turns this kind off.
  design: |
    In `daemonGardenWorkspace` and the other call sites, call `resolvePlanDestination("task")` when the gardener files a new task, and pass its checkout, owner and name.
    A gardener knows whether it adds or changes a file only when it lands. So choose the repository in the land step: all paths new and under plan/tasks.d go to the destination; a changed file goes to the repository that holds it; a mix is refused with a message.
    The preflight takes the code root from the earlier task of this filing.
    The shared landing keeps one queue of staged task files under the state root for every repository. A landing call for
    the destination would read the files that wait for the public repository: a new public file would land in the
    destination, and a public edit would be set aside because the destination's main does not hold it. The reverse call
    would push a new ops file to the public repository. So the queue keeps each file with the repository it was staged
    for, and a landing call lands, waits on or sets aside only the files of its own repository. A file staged before
    this change names no repository; it belongs to every repository except the named destination, because no landing
    went to the destination before this task.
    INVARIANT one-queue-per-repository: a landing call reads, lands, waits on or sets aside only the staged task files
    that were staged for its own repository.
    NOT IN SCOPE: the gardener modules themselves. Each one takes its checkout as an argument.
  falsifier: |
    Push a new task file to the public repository with the kind on and criterion 1 must fail. Move a changed task file to the destination and criterion 2 must fail. Send a docs change to the destination and criterion 3 must fail. Let a landing read every staged file whatever its repository and criterion 7 must fail. Restore and require all seven to pass.
  note: |
    AMENDED 2026-11-14: the shared landing for task files keeps one queue per repository.
    The landing of W1-T12199 stages every file under one directory of the state root and a landing call reads all of it.
    With a second repository, a call for one repository would carry, or set aside, the files that wait for the other.
    A new ops file could reach the public repository. The task now lists src/lib/feedback-landing.ts and criterion 7.
