    - claim: "The test goes through `daemonGardenWorkspace`, the production caller that builds the checkout of each registered gardener"
      proof: "grep: W1-T12212 criterion 6 in test/gardeners/a-gardener-files-a-new-task-in-the-plan-destination.test.ts"
  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 14 merges came from gardeners and 7 from the machine-filing judge.
    - Each gardener gets a checkout from `gardenCheckout` or `gardenCheckoutAsync` in src/run-task.ts. All 8 call sites are in that file. `daemonGardenWorkspace` passes `repoDir`, `owner` and `repo` of the public repository.
    - `gardenLandSteps` commits, runs the preflight, pushes to `origin` of that checkout and opens the pull request.
    - Users: the machine-filing judge, the queue judge, and the gardeners for CI friction, config, host resources, flow, flake incidents, selector shadow and opportunity intake, and the repair of a task file.
    - This is one of five writer tasks. Each one waits for the readers of both catalogs, so that no task goes where no reader sees it.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. Removing `task` from the kinds turns this kind off.
  design: |
    In `daemonGardenWorkspace` and the other call sites, call `resolvePlanDestination("task")` when the gardener files a new task, and pass its checkout, owner and name.
    A gardener knows whether it adds or changes a file only when it lands. So choose the repository in the land step: all paths new and under plan/tasks.d go to the destination; a changed file goes to the repository that holds it; a mix is refused with a message.
    The preflight takes the code root from the earlier task of this filing.
    NOT IN SCOPE: the gardener modules themselves. Each one takes its checkout as an argument.
  falsifier: |
    Push a new task file to the public repository with the kind on and criterion 1 must fail. Move a changed task file to the destination and criterion 2 must fail. Send a docs change to the destination and criterion 3 must fail. Restore and require all six to pass.
