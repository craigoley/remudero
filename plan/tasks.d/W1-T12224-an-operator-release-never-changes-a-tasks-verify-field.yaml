- id: W1-T12224
  title: "An operator one-task release authorizes DISPATCH only — it never rewrites `verify: human` to `verify: auto`, and its pin binds the record's actual `verify:` value so any verification-mode change needs fresh approval"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high  # Changes what an operator release authorizes; it only narrows that authority (fail-closed), and the PR rides ci-gate + remudero-review.
  band_meaning: blast-radius
  budget_usd: 30.00
  origin: architect
  plan_refs: ["W1-T3206", "W1-T10348", "W1-T11175", "W1-T5406", "W1-T5717", "W1-T10976"]
  status: queued
  priority: 1.2
  attempts: 0
  files:
    - src/lib/machine-filing-judge.ts
    - src/lib/operator-release.ts
    - test/an-operator-release-preserves-the-verify-field.test.ts
    - test/triage/operator-releases-pin-the-approved-contract.test.ts
