- id: W1-T3019
  title: "THE CREDIT BACKFILL ACTS ON AN ABSENCE ITS OWN READER SAYS IT DID NOT PROVE — `readMergeCreditedTaskIds` returns `complete`/`filesRead` and `runCreditBackfill` destructures only `.credited`, so a correction written after the walk ran out of ROTATION BUDGET is indistinguishable in the ledger from one written after it read every file and found nothing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 12.00
  files: [src/lib/sweep.ts, src/lib/status.ts, test/credit-scan-completeness-is-measured.test.ts, test/slug-branch-task-resolution.test.ts]
  origin: "operator-session#ledger-recon-2026-09-07"
  plan_refs: ["W1-T150", "W1-T119", "W1-T103", "W1-T2629"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED ON THE LIVE CORPUS 2026-09-07, union of the live ledger plus 297 rotations
    (2,822,845 rows; positive control 344 distinct steps):

      verdict.merged rows in the month          : 70,371
      distinct (task_id, pr_number) pairs        :  1,232   -> 57.4 rows per pair
      distinct task ids ever carrying credit     :  1,227
      verdict.merged rows retained in LIVE file  :    200   (MAX_RETAINED_LINES_PER_STEP)
        => tasks whose credit is ONLY in rotations: 1,027, re-walked every pass

    THE CAP IS NOT THE DEFECT, AND THAT WAS THE FIRST HYPOTHESIS. At the full candidate set the
    walk reports filesRead 25, complete FALSE, and TWO unresolved ids (W1-T403, W1-T493) whose
    credit provably exists deeper (found at filesRead 277). So CREDIT_SCAN_MAX_ROTATIONS = 24
    resolves 1,225 of 1,227; raising it would force a ~277-file walk on every pass to buy two
    tasks. Widening the cap is the wrong direction and is explicitly NOT proposed here.

    WHAT IS ACTUALLY WRONG IS THAT NOBODY CAN TELL. `readMergeCreditedTaskIds` already computes
    `complete` and `filesRead`; `runCreditBackfill` takes `.credited` and drops both. Its own doc
    says of an exhausted walk: "those get re-credited, which is today's behaviour". So the ledger
    cannot distinguish a correction that REPAIRED a genuinely missing credit from one that
    re-credited a task whose credit the walk simply did not reach — and the module header claims
    the second class was closed in 2026-08-13.

    `complete` ALONE IS THE WRONG DISCRIMINATOR, which a first pass at this got wrong: it is false
    whenever ANY candidate is unresolved, including a brand-new merge nothing has credited yet —
    and crediting that one is the rung working correctly. The discriminator is whether the walk ran
    out of BUDGET (filesRead reached the cap) or out of CORPUS.
  acceptance:
    - claim: "the summary reports whether the credit walk exhausted its rotation budget, how many files it read, and how many candidates it left unproven"
      proof: "unit test: test/credit-scan-completeness-is-measured.test.ts"
    - claim: "a new merge, which never resolves and so reads complete:false, is NOT counted as unproven — the budget test and not `complete` is the discriminator"
      proof: "unit test: test/credit-scan-completeness-is-measured.test.ts"
    - claim: "each correction row carries the same discriminator, so a re-credit loop is attributable to a task from the ledger alone"
      proof: "unit test: test/credit-scan-completeness-is-measured.test.ts"
    - claim: "no correction is added, removed or changed by this task — dry-run, unmerged candidates and rotation-resolved credits all behave exactly as before"
      proof: "unit test: test/credit-scan-completeness-is-measured.test.ts"
  note: |
    TWO LIVE TASKS SHARE THIS SURFACE AND NEITHER SUPERSEDES THIS ONE (lint-plan duplicate-surface,
    advisory). W1-T103 declares [status.ts, sweep.ts] and is about `checksState` — whether a green
    REQUIRED context set decides mergeability — touching neither the credit walk nor the backfill
    rung. W1-T2629 declares [status.ts, slug-branch-task-resolution.test.ts] and is about reading a
    task id out of a branch name that lacks the `run-` prefix. This task touches only
    `readMergeCreditedTaskIds`'s return shape and `runCreditBackfill`'s reading of it. THE OVERLAP
    IS STILL REAL FOR THE DISPATCHER: W1-T2629 declares BOTH files this task added, so if the fleet
    builds them concurrently their PRs conflict in `status.ts`. Sequence them rather than running
    both.

    SCOPE INCLUDES `src/lib/status.ts` BECAUSE THE DISCRIMINATOR CANNOT LIVE ANYWHERE ELSE. A
    caller sees only `filesRead`, and that number is identical whether the walk opened every file
    that exists or stopped short of a deeper corpus — so a caller-side test of it misreports in
    BOTH directions. Measured: a corpus of exactly the cap, and a walk resolving its last candidate
    on the final allowed rotation, both read `cap + 1`; and a corrupt rotation spends a budget slot
    without incrementing the count at all. Only `readMergeCreditedTaskIds` knows whether it left
    files unopened, so it returns `budgetExhausted` and the rung reads that.
    `test/slug-branch-task-resolution.test.ts` is in scope for the one stub of that return type.

    TELEMETRY ONLY, DELIBERATELY. The bulk of the 70,371 rows is NOT explained by the two-task leak
    this measures, and no behaviour change should be made to a crediting path on an unexplained
    number. These three figures are what turn "corrected: N" into an answer about whether N is
    repair or churn; the fix, if one is warranted, should be sized on them.

    ID PROVENANCE: `rmd next-task-id --reserve` atomically reserved refs/rmd-id/W1-T3019 against
    tasks.yaml, shards, open PRs, remote plan and history before this shard was written.
