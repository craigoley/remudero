    src/run-task.ts IS DECLARED RELUCTANTLY AND THE CHANGE GENUINELY LIVES THERE. W1-T471 records
    that naming it serialises every task that does. It is declared because `RiskJudgeInput` is a
    caller-populated literal and the identifiers exist only in the caller's scope - `prUrl` in the
    same literal, `review.headSha` a few statements earlier - and because the operator-override flag
    pair is parsed there. THERE IS NO VERSION OF THIS TASK THAT OMITS IT: deriving a PR number by
    parsing it back out of `change.description`, which today holds `${task.title} - ${prUrl}`, would
    be exactly the guessed key #1931 shipped. An implementer who finds a supply path that does not
    touch run-task.ts MUST AMEND THIS SHARD rather than silently narrowing.

    src/lib/ledger.ts IS DECLARED AND IS NOT OPTIONAL. See design (ii): omitting it leaves every
