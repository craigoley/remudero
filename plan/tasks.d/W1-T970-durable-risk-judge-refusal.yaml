    from ACCEPTANCE-CRITERIA TEXT as well as from `files:`, and five criteria naming arming,
    identifiers, override and per-PR scoping can only raise it.

    FILES DERIVED BY INVOCATION COUNT WITH WORD BOUNDARIES AT 3d919695b, NOT GUESSED.
    `priorActionsFromLedger`: sweep.ts=11, risk-judge.ts=0, run-task.ts=0 - the read has one home.
    `alreadyDone`: sweep.ts=13, 0 in both others - so does the refusal point.
    `runRiskJudge`: risk-judge.ts=5, run-task.ts=2, sweep.ts=0 - the emit has one home and one
