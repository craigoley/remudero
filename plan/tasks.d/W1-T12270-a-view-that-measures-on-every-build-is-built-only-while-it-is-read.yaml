  rationale: |
    MEASURED on the Azure host in the serve research of 2026-11-10: the `now` view took 1,614 s of 2,371 s of measured view-build time. Serve used 1 to 2.8 cores while few readers were connected.
    - The `now` view measures on every build: it runs `git`, runs `gh api rate_limit`, reads free disk and reads files. Its inputs are not ledger rows, so the unchanged-input skip cannot skip it.
    - W1-T11974 (merged) adds to each `read_model.view_builds` row why a due build was not skipped. Those rows confirm the split before this task is built.
    READ at origin/main 0953736f0, src/lib/read-model-worker.ts.
    - Line 2137: the `now` view is the one view with `readPaced: true`, one unit for each instance.
    - Line 1547, `paced`: a read-paced unit that nobody has read for `READ_MODEL_READ_HOT_MS` (2 minutes) doubles its wait after each build, up to `READ_MODEL_IDLE_STRETCH_MAX` (32). It never stops. The comment at line 123 gives the result: `now@core` then builds about every 6.4 minutes for nobody.
    - Line 411: the needs-you view takes the `now` view as a source.
    - Line 2280, `endIdle`: the heavy lane already ends after 10 minutes with no read (W1-T11937). The `now` unit is on the other lane and keeps building.
    CHECKED for overlap: W1-T11937 (merged) ends the heavy lane. W1-T11975 and W1-T11976 change what a build costs. W1-T5896 (merged) does not build a view whose switch is off. None stops an unread unit.
  design: |
    In `paced`, a read-paced unit that was not read during the unread window gets no next due time. A read gives it one at once.
    - Count as a read: a read of the unit, a read of the whole view, and a read of a view that names it as a source in the consumer table at line 411.
    - The unread window is the largest wait of today: the cost divided by the share, times `READ_MODEL_IDLE_STRETCH_MAX`. Until then the doubling stays, so a short gap between two readers costs nothing new.
    - The answer to the first read after a stop must not show the old body as current. Read how serve answers a read of a unit with no fresh body today and use that path. State the limit of the wait in the code as a bound with its reason.
    - The `read_model.view_builds` row keeps its fields. A stopped unit has no calls in the window.
    Before the build, list every reader of the `now` view under `src/` that is not an HTTP read: a daemon, an alert, a gate, a badge. If one needs a fresh body with no reader connected, stop and report it; do not build around it.
    The two listed tests assert the doubling and the read that restores the cadence. Change only the assertions that say an unread unit keeps building at the largest stretch.
    NOT IN SCOPE: what the `now` view measures, the cost of one build, and the heavy lane.
  falsifier: |
    Keep building at the largest stretch and criteria 1 and 5 must fail. Ignore a read of the needs-you view and criterion 2 must fail. Answer the first read with the old body as current and criterion 3 must fail. Stop a unit that a connected reader reads and criterion 4 must fail. Restore and require all five to pass.
