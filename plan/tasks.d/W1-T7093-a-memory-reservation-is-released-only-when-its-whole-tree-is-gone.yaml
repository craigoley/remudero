- id: W1-T7093
  title: "NO HOST-WIDE RECORD SAYS WHICH WORKER TREES ARE STILL HOLDING MEMORY — add a shared, bookkeeping-only reservation ledger: each worker start records its class and estimate under its instance and container generation, is bound to its root process by pid AND start time, follows that process's descendants, and is released only on VERIFIED termination of the whole tree; uncertain ownership stays reserved and is reported. Report-only: nothing reads it to delay, refuse or interrupt work"
  repo: remudero
  depends_on: [W1-T6782]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 15.00
  risk: high  # Rule 19: one concern — the ledger's ownership and release semantics. High for blast radius: it wraps every worker start, so a throw there would fail real work
  band_meaning: blast-radius
  origin: "operator session 2026-10-09: host memory capacity outage; operator approved a REPORT-ONLY host-wide budget, enforcement separately"
  plan_refs: [W1-T6782, W1-T6090, W1-T6597, W1-T2931, W1-T3209, W1-T5347, W1-T147]
  files: [src/lib/host-memory-ledger.ts, src/lib/worker.ts, src/lib/daemon.ts, src/run-task.ts, test/a-memory-reservation-is-released-only-when-its-whole-tree-is-gone.test.ts, test/a-missing-memory-ledger-never-reads-as-empty.test.ts, test/daemon-host-memory-reservation-sweep.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED 2026-10-09 (Azure host, 16.8 GB RAM):
    - Three daemon containers (core, site, console) each have --memory 9.25 GB + 4 GB swap: 27.7 GB of limits before serve.
    - Every worker-admission gate counts only its own process: hostWorkerBudget via activeWorkerCount, the memory
      governor's memoryFloorMib, adaptive review width. Nothing on the host knows what the OTHER instances have started.
      The test slot (W1-T6090) is the only host-wide gate, and it covers test runs only.
    - Worker trees are large and outlive their bookkeeping: a tsc child of one worker held 2.1 GB with 136 threads;
      children totalled 0.5-4.6 GB per instance.
    - When a parent exits, its children are reparented to the container's init, so ancestry alone cannot attribute them.
    - W1-T147 overlaps only in the daemon wiring files: it injects failures and checks recovery rows; this task adds
      the ordinary, report-only heartbeat reconciliation of host-memory worker trees, which W1-T147 does not do.
    A budget cannot be computed, even counterfactually, until the host knows which trees are live. This task is the
    record only. The shadow evaluator (W1-T7094) and review priority (W1-T7095) consume it. Enforcement is out of scope for all
    three and needs a separate operator approval; nothing here activates on a timer.
  design: |
    (1) STORE: a host-memory/ subdirectory INSIDE the test slot's directory (RMD_TEST_SLOT_DIR, same resolution order). That
        directory is the only path shared into all three daemon containers today (verified 2026-10-09:
        /mnt/scratch/rmd/test-slots is mounted in each); a sibling would not be shared and needs no new mount. One file per reservation, written atomically (fs-race-safe writeAtomic); no global lock is
        needed to add or remove one. If the directory resolves to a container-local fallback, every reading says
        scope: "local" and is never presented as host-wide.
    (2) RECORD: withWorkerOccupancy (worker.ts) opens a reservation at claim time with instance (state root name),
        container generation (container id plus its pid-1 start time), worker class (review, fix, implement), the
        estimate it used and the estimate's source ("measured" with sample count, or "default-unmeasured"). The spawn
        seam inside the operation binds the root process as (pid, /proc start time); pid alone is never an identity.
    (3) TREE: on each daemon.alive tick the owning instance walks /proc for descendants of every bound (pid, start time)
        and of every descendant recorded earlier. It adds each new one as (pid, start time), so a grandchild survives its
        parent's exit even after reparenting. The walk is bounded (entries and wall time); an incomplete walk is reported
        as incomplete, never as empty.
    (4) RELEASE: only on verified termination. (a) The occupancy is released AND every recorded (pid, start time) is gone,
        or its pid now carries a different start time (pid reuse). Checked by the owner in the same container generation.
        (b) The owner observes that the recorded container generation ended: a new container id, or a new pid-1 start time
        for the same container. The old pid namespace's processes are gone with it. (c) Spawn never bound a process (the
        start failed before spawning), and the occupancy released. Missed heartbeats, a stale file mtime or entry age
        NEVER release an entry. Another instance never releases an entry it cannot verify; it reports it as "uncertain"
        with the owner and age.
    (5) READ: a pure reader returns the live entries plus counts of uncertain, incomplete-walk and local-scope entries, for
        W1-T7094. Every ledger operation is best-effort: a write or walk failure is logged as a deduplicated diagnostic and
        never fails, delays or alters the worker start or the heartbeat.
    (6) MISSING IS NEVER EMPTY. Storage facts verified 2026-10-09:
        - The directory lives on /mnt/scratch, an ephemeral Azure local NVMe disk that is wiped when the VM is deallocated.
        - The local fallback /tmp/rmd-test-slots is swept by the host janitor's TMP_ROOTS (idle 6 h) and by tmpfiles (30 d).
        - test-slot.ts reclaims only slot-<n>.json.
        - The janitor protects /mnt/scratch/rmd by name and does not descend into it.
        So the ledger can vanish, and an empty read must not be mistaken for "nothing reserved":
        - The ledger directory carries a sentinel file with a random creation id, written once when the directory is made.
        - The reader returns one state: "present" (sentinel read; entries may be zero), "missing" (no directory or no
          sentinel), "unreadable" (an I/O error, named) or "reset" (the sentinel id differs from the one this process last
          read, so earlier entries may have been erased).
        - Each owner keeps an in-memory copy of its own open reservations. A file it wrote that has gone is reported as
          own-entry-missing and rewritten. It is never treated as a release.
        - The test-slot code never deletes, renames or globs anything under host-memory/.
  acceptance:
    - claim: "a reservation survives its root's exit while a recorded descendant lives, and is released once every recorded (pid, start time) is gone; a reused pid with a new start time does not hold it; a crashed worker whose tree is gone is released by its owner; a new container generation releases the previous generation's entries; a start that fails before spawning releases on occupancy release; two overlapping starts get two distinct entries; a missed heartbeat or old mtime never releases; another instance reports an unverifiable entry as uncertain and leaves it in place; and a throwing ledger write leaves the worker start unchanged"
      proof: "unit test: test/a-memory-reservation-is-released-only-when-its-whole-tree-is-gone.test.ts"
    - claim: "a deleted ledger directory reads as missing and a replaced sentinel as reset, never as an empty ledger; an owner whose own entry file vanished reports own-entry-missing and rewrites it without releasing; a full test-slot acquire, release and stale reclaim cycle leaves every host-memory entry intact; and an unwritable or full store leaves the worker start unchanged"
      proof: "unit test: test/a-missing-memory-ledger-never-reads-as-empty.test.ts"
    - claim: "worker occupancy opens a ledger reservation"
      proof: "grep: openMemoryReservation( in src/lib/worker.ts"
    - claim: "each daemon.alive heartbeat runs the best-effort reservation sweep, and daemonCommand wires it to the shared host-memory ledger"
      proof: "unit test: test/daemon-host-memory-reservation-sweep.test.ts"
  falsifier: |
    Release on root-pid exit alone: the surviving-descendant case fails. Compare pids without start time: the pid-reuse
    case fails. Release on lease age: the missed-heartbeat case fails. Let a ledger write throw through: the
    worker-start-unchanged case fails.
