- id: W1-T8861
  title: "THE JANITOR DELETED A CLONE THAT HOSTED 40 LINKED WORKTREES AND UNPUSHED BRANCHES — sweep_worktree judges a standalone clone saved by its HEAD alone, so on 2026-10-11 03:12Z a live janitor pass rm -rf'd ~/rmd-work/core while it was the git dir of 33 worktrees and held a local-only keep/ branch, and the pass left no trace in any log: a clone that hosts linked worktrees or carries any unsaved ref is never removed, and every removal leaves a durable audit line"
