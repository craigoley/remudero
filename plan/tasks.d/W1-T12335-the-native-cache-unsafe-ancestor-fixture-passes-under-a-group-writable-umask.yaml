  design: |
    All changes are in test/worker/spawn/codex-native-cache.test.ts. Touch no other file.
    1. Move the body of "native cache refuses unsafe ancestors and existing public namespaces without changing their modes"
       into a local function `assertUnsafeAncestorRefusals(home: string)`. Keep the existing title, which now calls
       `cacheFixture(assertUnsafeAncestorRefusals)` under the ambient umask.
    2. In that function, replace `mkdirSync(root, { recursive: true })` with an explicit two-step creation:
       `mkdirSync(join(parent, "remudero"), { mode: 0o700 })`, then `mkdirSync(root, { mode: 0o755 })`. Keep
       `chmodSync(root, 0o755)` so the leaf really is public whatever the umask. Every assertion stays exactly as it is:
       the 0777 `.cache` raising /untrusted directory/ with its mode kept and no `remudero` created; the 0755 leaf raising
       /private to its writer/ with mode 0755 kept; the 0500 leaf raising /private to its writer/ with mode 0500 kept.
    3. Add a new top-level test with exactly this title:
       "native cache unsafe-ancestor refusals hold under umask 0002 and 0022"
       For each mask in [0o002, 0o022]: `const prior = process.umask(mask)`, then inside try/finally run the following and
       restore with `process.umask(prior)`.
       (a) Positive control so the run is not vacuous: in a fresh mkdtemp dir, a plain `mkdirSync(probe)` must have
           `mode & 0o777` equal to `0o777 & ~mask` (0775 for 0002, 0755 for 0022). Remove the dir afterwards.
       (b) `cacheFixture(assertUnsafeAncestorRefusals)`.
       The test must be synchronous so no other test runs while the umask is changed.
    UNCHANGED: src/lib/worker-native-cache.ts and its guard, every other test in the file, test/setup/tmp-hygiene.ts, the
    operator's umask, host permissions and generated environments. No test is skipped or marked todo.
