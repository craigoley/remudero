      proof: "unit test: test/worker/spawn/codex-native-cache.test.ts"
      kind: guard
    - claim: "the suite carries the new top-level test that runs the unsafe-ancestor fixture under both forced umasks"
      proof: "grep: native cache unsafe-ancestor refusals hold under umask 0002 and 0022 in test/worker/spawn/codex-native-cache.test.ts"
    - claim: "the fixture creates the intermediate .cache/remudero directory with an explicit 0700 mode before creating the public leaf"
      proof: 'grep: mkdirSync(join(parent, "remudero"), { mode: 0o700 }) in test/worker/spawn/codex-native-cache.test.ts'
  falsifier: |
    At base fbc78512 the fixture calls `mkdirSync(root, { recursive: true })`. With the new title added and no other fix,
    its 0002 iteration throws "untrusted directory: .../.cache/remudero" where /private to its writer/ is expected, and
    the grep reads 0. The repair is wrong if, after it lands, any of these holds: the 0002 iteration fails; the 0002
    control dir is not 0775, so the run proves nothing; any /untrusted directory/ or /private to its writer/ assertion in
    the unsafe-ancestor body is removed or weakened; or src/lib/worker-native-cache.ts changes.
