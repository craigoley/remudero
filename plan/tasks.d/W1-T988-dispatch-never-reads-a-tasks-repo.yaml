    - claim: "the refusal is counted in the row that already carries every other decline"
      proof: "unit test: W1-T988: the repo refusal is counted in the daemon idle reasons row"
    - claim: "this guard is not multi-repo support and must not be read as routing"
      proof: "grep: this guard is not multi-repo support and must not be read as routing in plan/tasks.d/W1-T988-dispatch-never-reads-a-tasks-repo.yaml"
