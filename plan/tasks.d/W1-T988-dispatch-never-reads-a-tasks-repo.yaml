- id: W1-T988
  title: "THE DISPATCHER NEVER READS WHICH REPO A TASK BELONGS TO AND A CROSS-REPO TASK IS ALREADY IN THE PLAN — drain.ts and daemon.ts read a task's repo 0 times against controls of 61 and 37 id reads, while repo is required and validated on all 617 tasks: add one eligibility predicate so a foreign-repo task is refused instead of handed to a worker in the wrong checkout"
  repo: remudero
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    THIS IS A SAFETY GUARD ON A SINGLE-TARGET DAEMON, NOT MULTI-REPO SUPPORT, AND NOT THE ROUTING
    STAGE 2 NEEDS. Saying so is the first clause because the shape invites the wrong build. The
    architecture path the recon actually found is a SECOND DAEMON WITH ITS OWN `config.root` —
    nearly free today, because `config.root` already parameterises every global thing (the ledger
    path, `state/`, the locks, the reservation store). THAT IS THE OPERATOR'S DECISION AND NOT THIS
    TASK'S. This task makes the CURRENT daemon refuse work that is not its own.

    RE-DERIVED AT origin/main cc008b7a, in a scratch worktree of that sha rather than a session
    checkout. Every figure below was re-taken; two came back different and are corrected in the
    note.

    (1) THE DISPATCH PATH IS BLIND TO `repo`. `src/lib/drain.ts` reads a task's `repo` ZERO times —
    zero for `t.repo`/`task.repo` AND zero for the bare word anywhere in the module — against
    controls of 61 id reads and 1 verify read in the same file. `src/lib/daemon.ts` is likewise
    ZERO against a control of 37 id reads. A deliberately absent symbol scores 0 in the same
    window, so the zeros discriminate.

    (2) `isDispatchEligible` (`src/lib/drain.ts`) GATES ON FIVE THINGS AND REPO IS NOT ONE OF THEM:
    `isMerged(t.id)` → `already-merged`; `opts.excludeIds?.has(t.id)` → `continued-this-pass`;
    `t.verify !== "auto"` → `verify-not-auto`; `t.status === "blocked"` → `blocked`; and
    `unmetDependencies(...)` → `unmet-deps`. Each returns false through `opts.onFiltered?.(t,
    reason)`.

    (3) YET `repo` IS REQUIRED AND VALIDATED ON EVERY TASK. `src/lib/plan.ts` declares
    `repo: string` and enforces it with `req(e.repo, "repo", id)`. Across 617 tasks: `remudero`
    615, `remudero-site` 1, `none` 1. THE PLAN IS ALREADY THE FLEET'S PLAN, NOT THIS REPO'S.

    (4) SO THE FAILURE IS A PLAUSIBLE-LOOKING PULL REQUEST, NOT AN ERROR. A `remudero-site` task
    handed to a worker whose worktree is a `remudero` checkout edits the wrong tree and opens a
    pull request against the wrong repository, and nothing on the path flags it. The only reason it
    has not happened is that `W12-T1` carries `verify: human`, which parks it before the linter is
    ever consulted. 57 of 617 tasks are `verify: human` — A PROPERTY OF THOSE TASKS, NOT A FENCE.

    (5) THE TARGET IS ALREADY KNOWN AND ALREADY RECORDED. The live daemon runs
    `./bin/rmd daemon --repo remudero --allow-self-target`. `resolveDaemonTarget` (`src/run-task.ts`)
    returns `DaemonTarget { owner, repo, planPath, isSelf, dryRun }` — its own doc calls it PURE and
    unit-testable precisely so a guard can be tested — and `daemonCommand` ledgers
    `daemon.target` with `repo: target.repo` beside `gateway: owner/repo`. That row appears 155
    times in the ledger.

    (6) THE TWO SPELLINGS ARE THE ROW'S TWO FIELDS, NOT A DATA DEFECT, AND THE CANONICAL FORM IS
    MEASURED. The ledger's 1,073 bare `remudero` values come from `repo:` and the 5
    `craigoley/remudero` values from `gateway:` — the same row carries both. THE PLAN IS 100% BARE:
    zero slug-form `repo:` entries across `plan/tasks.yaml` and every shard, against a control of
    349 files carrying the bare form. So the BARE REPO NAME IS CANONICAL, and normalisation means
    reducing a slug to its last path segment before comparing — never the reverse, because a task
    never carries an owner to compare against.

    (7) DAEMON.TS DOES NOT CURRENTLY KNOW THE TARGET, WHICH IS WHY THREE MODULES ARE IN SCOPE.
    `resolveDaemonTarget` scores 5 in `src/run-task.ts` and ZERO in both `src/lib/daemon.ts` and
    `src/lib/drain.ts`; `daemon.ts` carries no reference to `DaemonTarget`, `target.repo` or a
    `targetRepo` of any spelling. The value is resolved in `run-task.ts` and must cross into the
    opts `daemon.ts` already builds for the drain.
  design: |
    THE SHAPE: one predicate inside the gate that already exists, one value threaded to it, one new
    refusal reason. Additive and removable.

    (i) NOT MULTI-REPO SUPPORT — SEE RATIONALE'S FIRST CLAUSE. A builder who starts routing work to
    a second checkout, partitioning the ledger, or scoping credentials has left this task. Those
    three are each named irreversible-ish by the recon and each is its own ruling.

    (ii) ONE PREDICATE IN `isDispatchEligible`, ORDERED WITH THE OTHERS. A task whose normalised
    `repo` does not equal the daemon's normalised target is not eligible, refused through the SAME
    `opts.onFiltered?.(t, reason)` channel every other decline already uses.

    (iii) NORMALISE BEFORE COMPARING, BARE FORM CANONICAL. Rationale (6). A guard that compared raw
    strings would strand every task the moment an operator passed `--repo owner/name`, which
    `resolveDaemonTarget`'s own doc documents as an accepted input. The normaliser is a pure
    function and belongs beside the predicate so the falsifier can reach it directly.

    (iv) ABSENT TARGET MUST MEAN NO GUARD, NOT REFUSE-ALL. The opts field is OPTIONAL: when the
    caller supplies no target the predicate must not fire at all, so every existing caller —
    `runnableCandidates`, the panel, every test that builds opts by hand — keeps byte-identical
    behaviour. A guard that defaults to refusing is the shape that stops the fleet.

    (v) THE LOSER STAYS ELIGIBLE FOR A DIFFERENTLY-TARGETED DAEMON. Not marked done, no strike, no
    escalation, no status change — a refusal here is exactly as inert as `verify-not-auto` is
    today.

    (vi) THE READER IS THE ROW THAT ALREADY EXISTS, AND THE PANEL IS DELIBERATELY NOT TOUCHED.
    `daemon.ts` feeds `idleReasons.onFiltered` and ledgers `daemon.idle_reasons` with
    `idleReasons.snapshot()`; `src/lib/idle-reasons-panel.ts` reads that row. THE PRECEDENT FOR
    ADDING A REASON WITHOUT TOUCHING THE PANEL IS ALREADY IN THE TREE: `DispatchFilterReason`
    carries FIVE members while `IDLE_REASON_ORDER` lists only FOUR — `continued-this-pass` is in
    the union and not in the panel's order, and nothing breaks. THAT ASYMMETRY IS LOAD-BEARING AND
    MUST BE PRESERVED: the panel iterates `IDLE_REASON_ORDER` and returns `kind: "unknown"` the
    moment any listed key is missing from a row, so adding the new key to that order would make
    EVERY HISTORICAL ROW unreadable. The new reason goes in the union and the snapshot; the panel's
    order is left alone.

    (vii) NO NEW STEP AND NO NEW SIGNAL. Nothing is minted. Ten measured mechanisms have merged
    green with no reader — `billing_mode` the most recent at 36 write sites, 0 comparisons and
    every value `subscription` — and a `dispatch.wrong_repo` step nobody reads would be the
    eleventh.

    (viii) `--allow-self-target` IS UNTOUCHED AND CRITERION 3 PINS IT. That flag lives in
    `src/lib/launchd.ts` and gates the daemon targeting its OWN repo; `DaemonTarget.isSelf` is a
    separate axis from "does this task belong to my target". The fleet runs with the flag, so a
    guard that interacted with it would take the fleet down.
