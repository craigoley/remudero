  rationale: |
    OBSERVED on PR #5544 / W1-T3567 at head 1c0632d (2026-09-14). All CI checks passed and
    the semantic reviewer completed successfully at 14:45:07Z, executing both proofs. The
    guarded poster then correctly withheld its terminal success at 14:45:24Z because that worker
    had loaded bf2d9e6 while origin/main was 3dbaa648, whose diff included src/lib/review.ts.
    `review.post_refused` recorded both SHAs and left the required status pending.

    The later sweep diagnosed the owner as dead and selected post-review, but did not act. In
    `src/lib/sweep.ts`, `priorActionsFromLedger` recognizes that stale freshness refusal as
    retryable, and `reviewerCodeFreshnessBackoffReason` applies `pendingCeilingMinutes` (60) to
    it exactly like a thrown transport attempt. The daemon had already reached the fresh review
    source by the time the incident was investigated: a new one-shot review loaded 3dbaa648,
    classified the following plan-only advance to d7c2f30 as immaterial, posted success at
    15:55:04Z, armed auto-merge at 15:55:07Z, and remudero-fleet[bot] merged #5544 at 15:55:06Z.

    The safety refusal is correct: an old reviewer must not certify a PR after a material
    review-engine change. The recovery schedule is not. The daemon already records the SHA its
    process loaded on daemon.boot specifically so consumers can distinguish running code from a
    checkout that another process has fetched. W1-T2753's 60-minute backoff remains correct when
    that proof is missing or older; it should not delay a re-review once a daemon has demonstrably
    loaded the source revision the refusal required.
  design: |
    (i) Preserve the target SHA on a stale reviewer-code refusal while folding prior review actions.
    Keep unreadable freshness and malformed/missing provenance on the existing bounded backoff;
    neither proves a safe new reviewer.

    (ii) Capture the daemon process's loaded module SHA once, using the existing module-relative
    boot-SHA mechanism rather than cwd or a live checkout read. Thread a narrow, injectable
    ancestry predicate into the daemon's full and light sweep paths. A pre-ceiling stale refusal
    is re-admitted only when that loaded SHA is proven equal to or descended from its recorded
    origin-main target. Git ancestry unreadable, a missing boot SHA, and an older/divergent loaded
    SHA all retain the current backoff. Do not manufacture capacity, fake telemetry, or treat an
    on-disk HEAD as evidence of loaded code.

    (iii) Re-admission invokes the existing post-review lane and its ordinary exact-input mutex,
    pending-status ownership, semantic review, guarded status poster, and auto-merge arm. It does
    not write a terminal status directly, erase the refused row, bypass the reviewer-source guard,
    lower pendingCeilingMinutes, or retry unreadable source provenance. The original pending
    status remains the visible guard until the fresh lane itself posts a terminal verdict.

    (iv) Keep W1-T3580 separate. Its review-engine revision bump re-arms an already-posted stale
    terminal cache. This task handles the earlier state where a verdict was never posted because
    its source was withheld; neither task changes the other's identity contract.

    The source overlap with W1-T77, W1-T78, W1-T100, W1-T150, W1-T168 and W1-T176 is the shared
    sweep/run-task composition root, not duplicate work: those records own existing reconciliation,
    fix, credit and review flows. This task only carries loaded reviewer-source provenance through
    that already-existing post-review recovery edge; it changes none of their predicates or effects.
  acceptance:
    - claim: "a pending review withheld for stale reviewer code is re-admitted before the 60-minute ceiling only after the daemon has proved it loaded the refusal's required reviewer-source revision or a descendant"
      proof: "unit test: W1-T3581 fresh loaded reviewer code releases withheld pending review"
    - claim: "a missing, unreadable, older, or divergent loaded-code provenance retains the existing bounded freshness-recovery backoff and starts no review"
      proof: "unit test: W1-T3581 unproved loaded reviewer code keeps withheld pending review bounded"
    - claim: "the real daemon passes its module-loaded SHA and a fail-closed ancestry check to both full and light review-sweep paths rather than inferring freshness from the mutable checkout"
      proof: "unit test: W1-T3581 daemon wires loaded reviewer provenance into both sweep paths"
  falsifier: |
    Close without implementation only if a replay of #5544's exact stale-freshness refusal plus a
    daemon process proven to have loaded 3dbaa648 invokes postReview before the 60-minute ceiling,
    while the same fixture with an older or unreadable loaded SHA remains stood down. At filing the
    existing fold has only a refusal timestamp and every stale/unreadable source refusal is held
    by reviewerCodeFreshnessBackoffReason until pendingCeilingMinutes elapses.

    The implementation test must delete the loaded-SHA ancestry release and turn the fresh-code
    fixture from one postReview call to zero; restoring it must restore exactly one call. A fake
    current checkout HEAD, a new PR head, a manual status write, or a lowered ceiling does not
    satisfy the falsifier.
  note: |
    reservation hand-off: main -> chore/file-reviewer-freshness-recovery-1789402000000

    Scope is deliberately limited to automatic recovery after a withheld terminal review. This
    task does not weaken review freshness, rework provider routing, change review-engine revision,
    alter branch protection, or authorize a merge. The immediate #5544 recovery was a fresh
    `rmd review` run from code 3dbaa648; the normal daemon path must achieve the same safe result
    without waiting for an operator.
