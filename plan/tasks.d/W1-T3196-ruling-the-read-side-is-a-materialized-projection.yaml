  rationale: |
    OPERATOR QUESTION 2026-09-08, verbatim: "are we sure this is the right setup for fetching the
    backend data? Should we use CQRS patterns or make the API more industry standard and have the
    data it fetches be more readily accessible?"

    THE ANSWER IS NO, AND THE SHAPE IS ALREADY HALF-BUILT. This system is event-sourced in all but
    name: `state/ledger.ndjson` is an append-only log (3.9 MB, 7 682 live lines, 579 gz archives),
    the daemon is the command side, and `DECISION_RELEVANT_LEDGER_STEPS` already declares which
    events matter. What is missing is the other half of the pattern — a materialized read model.

    WHAT HAPPENS ON A READ TODAY (src/lib/status.ts, src/lib/board.ts):
      - `projectPlan` recomputes a `StatusProjection` for EVERY task in the plan — 1 550 of them
      - it reads the whole ledger once and builds an index once, per call
      - it reads a 20 MB prior-projection file (`state/cache/board/…ndjson`) for W1-T179's
        monotonic-under-darkness guarantee
      - `/v1/status` then serialises 881 619 bytes
    THAT IS "REPLAY THE LOG ON READ", which is the shape event-sourcing literature names as the one
    materialized views exist to replace.

    THE PATH HAS BEEN PATCHED TWICE ALREADY, WITHOUT CHANGING SHAPE, and the comments record it:
      W1-T187  "deriveStatus parses the WHOLE ledger per call and the loop calls it once PER TASK —
                clocked at 5-8s per projection against the console's <2s budget"
      R-23     "reading once was half the fix — the ten per-task helpers each still walked the whole
                array, so an N-task plan scanned it ~10N times"
      W1-T2919 folded the cache fingerprint incrementally so a hit costs one pass over new lines
    Each fix was correct and each left the recompute in place. A third optimisation of the same loop
    is the predictable next step and it will not hold either.

    AND THE CACHE MISSES ON THE FLEET'S OWN CADENCE. The key is a fingerprint over
    decision-relevant rows; `sweep.disposed` is one of them and appears 28 times per 500 ledger
    lines. The fleet appends decision-relevant events continuously, so the board is invalidated
    roughly as fast as it is asked for — and each miss pays the full 1 550-task recompute,
    synchronously, on the same event loop serving the operator's browser.

    THE MEASURED CONSEQUENCE (W1-T3192): the same 319 418-byte shell at 0.022s, 3.0s, 9.9s, 32.7s,
    53.3s, 85.1s and once past 60s; `/v1/recent` at 0.009s on one sample and 71.562s on another for
    identical bytes. The 0.009s reading is the important one — it proves the work is not the
    endpoint's, it is queueing behind whatever recompute holds the loop.
  design: |
    (i) A PROJECTOR MAINTAINS THE READ MODEL INCREMENTALLY. Each appended ledger row updates the
    affected records; nothing recomputes the population. The write side is unchanged — the ledger
    stays the source of truth and this ruling does not propose replacing it.
    (ii) THE READ MODEL IS REBUILDABLE FROM THE LOG, ALWAYS. It is a cache in the strict sense:
    deletable, reconstructible, never authoritative. If a projection and the ledger disagree, the
    ledger wins and the model is rebuilt — otherwise a derived store quietly becomes a second source
    of truth, which is the failure mode this pattern is most often criticised for.
    (iii) THE API BECOMES CONVENTIONAL over that model: resource-shaped, FILTERABLE and PAGED, with
    conditional requests (ETag / If-None-Match) so an unchanged board costs a 304 rather than 881 KB.
    "More industry standard" in the operator's words is precisely this — a board asking for the rows
    it renders, not a projection of everything (W1-T3193).
    (iv) STALENESS IS STATED, NEVER GUESSED. Every response carries how current it is. An
    eventually-consistent read model that cannot say how far behind it is turns a latency problem
    into a trust problem, and this operator's console already had one confident-but-wrong indicator
    (W1-T189's freshness contradiction).
    (v) W1-T179'S MONOTONIC-UNDER-DARKNESS GUARANTEE SURVIVES. A projection must not regress when a
    source is unreadable; today that is bought by reading a 20 MB prior-state file per call. In a
    maintained read model it is the natural behaviour — the last good value simply persists — but it
    must be asserted, not assumed.
    (vi) INCREMENTAL, NOT ETERNAL. Rebuild cost is bounded and measured, so a cold start on a
    579-archive ledger has a known, tested bound rather than an unknown one.
  acceptance:
    - claim: "DECISIONS.md records the ruling: the read side is an incrementally-maintained materialized projection over the ledger, and the ledger remains the sole source of truth"
      proof: "grep: THE READ SIDE IS A MATERIALIZED PROJECTION in DECISIONS.md"
    - claim: "the record states the measurement that motivated it — the recompute-per-miss shape over a projection of every task in the plan"
      proof: "grep: 1550-task projection in DECISIONS.md"
    - claim: "the record names what is NOT changing: the ledger stays authoritative and the command side is untouched"
      proof: "grep: the write path is untouched in DECISIONS.md"
    - claim: "the record names the two prior in-place optimisations and why a third would not hold"
