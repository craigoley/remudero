  falsifier: |
    CLOSE IF a materialized read model already exists: list `state/` and read what
    `state/cache/board/` is for.
    MEASURED 2026-09-08: `state/cache/board/craigoley_remudero-….ndjson` is 20 MB and exists for
    W1-T179's MONOTONIC-UNDER-DARKNESS correctness guarantee — a memo of the PREVIOUS projection so
    a value cannot regress when a source goes dark. It is not read to SERVE a request; `projectPlan`
    recomputes regardless. A correctness memo is not a read model.
    POSITIVE CONTROL for "recompute on every miss", because a claim about a hot path needs one: the
    source states it — W1-T187 records "5-8s per projection" and R-23 records "an N-task plan
    scanned it ~10N times". Both are fixes TO the recompute, which is evidence the recompute is what
    is there.
    DO NOT satisfy this ruling by adding a third optimisation to `projectPlan`. Two already landed
    and the shape survived both; a ruling that ends in "make the loop faster" has answered a
    different question than the one asked.
    DO NOT let the read model become authoritative. The moment a projection is trusted over the
    ledger, a rebuild becomes lossy and the append-only log stops being the record — which is the
    single most common way this pattern fails in practice.
    DO NOT couple this to W1-T3173. The React console and the read model are INDEPENDENT: a SPA over
    today's endpoints inherits every stall, and a read model behind today's server-rendered shell
    fixes the stalls without any front-end change. Either can ship first.
  note: |
    THREE PROOFS WERE REWRITTEN BEFORE FILING, and the reasons are recorded because two of them
    would have graded green while proving nothing. `lint-plan` refused "MONOTONIC UNDER DARKNESS"
    (proof-grep-unmatchable — the file says "MONOTONIC under darkness"; grep does not case-fold, so
    it could NEVER match) and "71.562" (proof-grep-safety — an unescaped `.` is any-character in a
    BRE). The third it did not catch: "W1-T187" ALREADY APPEARS in DECISIONS.md, so that criterion
    would have passed at base and graded on prose. All three now name strings this ruling must
    itself add, verified absent at filing time.
    Rule 25 CHECKED: `DECISIONS.md` is documentation.
    THIS IS `verify: human` BECAUSE IT IS AN ARCHITECTURAL DIRECTION with real costs — a derived
    store to keep consistent, a rebuild path to test, and an eventual-consistency window to explain.
    No test establishes that the trade is worth making; that is the operator's call, and he asked
    the question that prompted it.
    W1-T3195 IS THE SMALL INDEPENDENT PIECE and can ship first regardless of how this rules: the
    board cache key currently calls `github.listOpenHeadBranches()` on every request, so even a
    cache HIT pays a network round-trip. That is worth removing whether or not a read model is ever
    built.
    CAVEAT WITH EQUAL WEIGHT: an incremental projector is NOT free. It introduces a component that
    can silently drift from the log, and drift in a board an operator trusts is worse than latency
    he can see. Design (ii) and (iv) exist for that reason and are the parts most likely to be
    skipped under time pressure.
    SECOND CAVEAT: the measurements motivating this were taken on one afternoon under live sweep
    load, and W1-T3192 has not yet attributed the 85-second tail to a specific call. This ruling
    argues from the SHAPE of the read path — recompute-per-miss over an append-only log, invalidated
    at the fleet's own write rate — which is visible in the source independent of any timing. If a
    profile later shows the tail is dominated by something else entirely, that finding does not
    rescue recompute-on-read; it just means there are two problems.
