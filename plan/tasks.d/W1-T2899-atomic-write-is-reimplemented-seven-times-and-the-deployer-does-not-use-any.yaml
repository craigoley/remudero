- id: W1-T2899
  title: "ATOMIC WRITE IS RE-IMPLEMENTED SEVEN TIMES AND THE DEPLOYER MARKERS USE NONE OF THEM — a private writeFileAtomic in ledger.ts, four private write*Atomic under onboard/, writeSweepWakeMarkerAtomic, and inline writeFileSync+renameSync in ten files, while fs-race-safe.ts (the module that owns the lock primitives) exports no writeAtomic: lift one, route the copies through it, and make the deployer markers atomic"
