- id: W1-T9929
  title: "DEP-REVIEW HOLDS A DEPENDABOT PR ON A RED ADVISORY CHECK — `redChecks` counts every red check except remudero-review, so the non-required Semgrep `Scan`, red on main and every PR while mcp stays 1.30.0, holds every Dependabot PR; hold only on checks branch protection or ci-gate requires, and name the advisory red"
  repo: remudero
  depends_on: [W1-T9828, W1-T9913]  # both in flight (#12398, #12413) and both edit depReviewCommand and dep-review.ts's result path; W1-T9828 reads result.redChecks for commitlint
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — which red checks a dep-review hold counts; no gate, scanner, check list or security config changes
  band_meaning: span
  origin: "operator ruling 2026-10-16: \"dep-review holds only on required checks\" — a red advisory check no longer holds the lane; it stays visible and is named; not a waiver, every security gate untouched"
  plan_refs: [W1-T54, W1-T103, W1-T1131, W1-T2399, W1-T3244, W1-T4056, W1-T9828, W1-T9913, W1-T9818]
  files:
    - src/lib/dep-review.ts
    - src/run-task.ts
