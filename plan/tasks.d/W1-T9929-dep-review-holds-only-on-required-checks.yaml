    - claim: "an unreadable required set keeps today's hold-on-all and names the fallback"
      proof: 'grep: test("W1-T9929: an unreadable required set holds on every red and names the fallback" in test/dep-review-holds-only-on-required-checks.test.ts'
    - claim: "the dep-review command arms past an advisory red, ledgers advisory_red and judged_against, and the remudero-review description names it"
      proof: 'grep: test("W1-T9929: the dep-review command arms past an advisory red and ledgers advisory_red" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
  falsifier: |
    At origin/main, on a Dependabot minor-bump fixture whose checks are ci-gate SUCCESS, commitlint SUCCESS and Scan
    FAILURE, with ci-gate.yml's REQUIRED readable and protection requiring ci-gate and remudero-review: `decideDepReview`
    returns `hold` with "required check(s) not green: Scan", and `depReviewCommand` posts no review and arms nothing.
    At head the same fixture arms, ledgers `advisory_red: ["Scan"]` and `judged_against: "required"`. Adding a
    commitlint FAILURE holds in both. An unreadable protection read holds on Scan at head too, with `required_fallback`
    ledgered.
