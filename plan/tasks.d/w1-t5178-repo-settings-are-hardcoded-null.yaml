  title: "EVERY REPOSITORY'S SETTINGS READ 'NOT REPORTED' BECAUSE CORE HARD-CODES THEM NULL — repo-dashboard-route.ts types proofpolicy, workerpoolsize and alertthreshold as null and always returns null, although the proof policy, lane count and alert thresholds exist in config and policy"
  repo: remudero
