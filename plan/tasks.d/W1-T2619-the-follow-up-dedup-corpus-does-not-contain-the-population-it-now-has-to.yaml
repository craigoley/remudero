  note: |
    RATIFIES the routed follow-up `followup:W1-T2458-1788035402626:2026-08-29T20:43:52.284Z:0` — a
    proposal minted BY the very mechanism it asks about, which is itself one of the 317 rows this task
    measures. TWO CORRECTIONS to the proposal's framing are carried in the rationale rather than
    silently applied: the defect is the CORPUS as much as the predicate (`openTitles` excludes
    `state/inbox-proposals.json`, verified at `run-task.ts`'s `buildGather` call), and scoring proposal
    SUMMARIES would inflate every pair on the shared minted affix — the hazard `inbox.ts` already
