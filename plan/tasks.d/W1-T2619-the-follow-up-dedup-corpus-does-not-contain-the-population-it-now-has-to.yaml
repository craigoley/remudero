    NO MECHANISM IS FILED AS A SUCCESSOR, AND THAT IS THE POINT. The proposal asked whether the check
    is WORTH adding; filing its implementation alongside would answer the question before measuring it
    and would leave a zombie to withdraw if the verdict is DECLINE (the W1-T324 sweep's whole subject).
    The successor is a DECISION the census's own verdict makes, in the shape W1-T171 used for its
    banked rung 2 and W1-T52 for its unminted golden.
    depends_on IS EMPTY DELIBERATELY. `routeFollowupsToRegistry` and `followupProposalId` are present
    in `src/lib/retro.ts` at head, so W1-T2458's routing is built; its shard nonetheless still reads
    `status: queued`, and a hard edge onto a task whose derived credit is uncertain fails the linter
    closed — the same reasoning W1-T233 recorded when it expressed its W1-T232 relationship as
    sequencing. The relationship is real and is stated here instead: this measures the population
    W1-T2458's routing creates and W1-T2563's retirement drains.
    budget_usd 25.00 is a RUNAWAY TRIPWIRE, not an allowance, set above the follow-up family's
    15.00-20.00 because the census may re-run over a corpus growing toward 2,115 entries — never
    lowered toward the work's expected cost, which is the failure W1-T3 recorded at $3.57 against a
    guessed $4 cap.
