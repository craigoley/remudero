  design: |
    1. ONE TALLY (src/lib/sweep.ts, beside `fixLedgerRowsForHead`). `fixRoundTally(lines, taskId, headSha,
       regime)` returns `{ strikes, refusals: {reason, round_id}[], repeatedRefusal?: string }`.
       - Pair each `fix.dispatch` with its outcome by a new `round_id` field. For legacy rows with no
         `round_id`, pair by the next `fix.commit_refused` / `fix.done` row for the same task, head and strike.
       - A round is a STRIKE iff `isRealStrike({workerRan, judgmentPosted})` holds, where:
         - `workerRan` = it has a `fix.done` that is not `commit_refused`;
         - `judgmentPosted` = it pushed a new head, or a `fix.review` row exists for its strike.
         This puts ledger.ts:125's dormant conjunction to work.
       - A refused round is a REFUSAL, never a strike.
       - A retrigger is neither (it already logs `fix.retrigger`, not `fix.dispatch`).
       - A proof-amendment identity row stays excluded (W1-T5032).
       - `repeatedRefusal` = a reason that occurs twice at this head.
    2. BOTH READERS USE IT.
       - `priorStrikesFor` (run-task.ts:37835) returns `fixRoundTally(...).strikes`.
       - `freshFixDispatchCount` (sweep.ts:9858) is deleted, and the claim gate (sweep.ts:10612) reads
         `fixRoundTally(freshLines, …).strikes` under the claim.
       - The regime amnesty (keyword_only under executed) applies inside the tally, unchanged.
    3. ROUND IDENTITY (run-task.ts). `runFixRung` mints `round_id = <runId>:<attempt>:<spawn start ms>` once
       per round, and stamps it on that round's `fix.dispatch`, `fix.commit_refused`, `fix.done`, and
       `fix.review` rows.
    4. EARLIER STOP ON A REPEATED REFUSAL. `OpenPrView` gains `repeatedFixRefusal?: string`, from the tally.
       The exhaustion predicate becomes `priorStrikes >= cap || repeatedFixRefusal !== undefined`, and the
       reason reads `fix rounds refused twice at this head (<reason>) — no strike spent — no further round can
       add information`. `describeCiFailures` is kept, so W1-T186's named-check reason survives. When
       W1-T5536 lands, its ladder consumes this same predicate.
    5. RENDERED RATIOS. Every `strike N/ceiling` string reads the tally's `strikes`. A refused round is
       rendered as `refused (N at this head)` and never as a strike number, so "3/2" cannot recur.
