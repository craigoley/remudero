  rationale: |
    THREE DEFINITIONS OF A STRIKE, AND THE FIX RUNG USES NONE OF THEM CONSISTENTLY. Verified at main 71fbcc6fe.
    (a) `priorStrikesFor` (src/run-task.ts:37835) counts every `fix.dispatch` ROW that `fixLedgerRowsForHead`
        (src/lib/sweep.ts:9807) selects for the head. It feeds `OpenPrView.priorStrikes` (run-task.ts:38323,
        :42468), and through that the exhaustion row (sweep.ts:7125) and `fixDispatchBudget` (sweep.ts:8273).
    (b) `freshFixDispatchCount` (sweep.ts:9858) counts DISTINCT `strike` numbers. It is the under-claim gate
        (sweep.ts:10612).
    (c) `isRealStrike` (src/lib/ledger.ts:125) is "a worker ran AND a judgment was posted" (W1-T127). It is
        exported and referenced in a comment at run-task.ts:11075, but nothing calls it.

    WHY THEY DIVERGE.
    - `runFixRung` numbers strikes locally from 0 on every call (`attempt = strikes + 1`, run-task.ts:11078),
      and the sweep calls it once per pass with the REMAINING budget (W1-T2452).
    - A round whose harness commit is refused still logs `fix.dispatch` with `strike: 1`, then
      `fix.commit_refused` (run-task.ts:11440), then returns `stood_down` without pushing (run-task.ts:11509).
    - So two refused passes at one head leave two rows that both say strike 1. Reader (a) says 2/2,
      exhausted. Reader (b) says 1/2 and admits a third dispatch.

    MEASURED, week-rows extract 2026-09-26..2026-10-03.
    - 226 `fix.dispatch` rows and 103 `fix.commit_refused` rows (46%). Refusal reasons: "the worker changed
      nothing" 61, "no anchored COMMIT_MESSAGE line" 33, "outside its declared files" 9.
    - All 16 exhausted PRs (#7313 #7335 #7451 #7561 #7830 #7844 #7983 #7998 #8029 #8053 #8613 #8684 #8713
      #8868 #8886 #8920) reached "2/2" from exactly two `fix.dispatch` rows at the exhausting head.
      Every row was numbered strike 1, every row was followed by a `fix.commit_refused`, and none moved the
      head or reached a verdict.
    - Under "a strike is a round that changed the head or reached a verdict", all 16 exhaustions were
      premature, with 0 counted strikes at the head.
    - #8868 at 73dd194: three refused rows. The disposition read 3/2 while the claim gate read 1/2.
    - The refusals themselves are real signal, but a different signal from a failed fix. The refusal that
      repeats is the one to act on, and W1-T5334 (queued) prices "the worker changed nothing" as the
      ci-friction gardener's top cause (470.9 PR-minutes, 133 rounds).

    NOT A LONGER LEASH.
    - Refused rounds stay bounded. They just stop masquerading as strikes.
    - A refusal at a head is re-tried once, with the refusal named (W1-T4207's `lastCommitRefusalPromptLines`,
      run-task.ts:39955, already feeds it to the next worker).
    - The same refusal reason twice at the same head is "no further round can add information". That
      routes to the same exhausted state the cap does, with its own reason, so W1-T5536's ladder picks it
      up, rather than spending a third round.
    - This mirrors the existing earlier-stop row for identical unmet criteria (`fixRungRepeatsIdenticalFailure`,
      sweep.ts:5840; DISPOSITION_RULES sweep.ts:7172-7183).

    Rule 19: the single tally and both readers in sweep.ts, plus `priorStrikesFor` and the round identity on
    the three fix.* rows in run-task.ts, are two production files for one concern. So the band is high, with
