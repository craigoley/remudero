  falsifier: |
    Three reverts, each turning a named case red:
    - Make `priorStrikesFor` count rows again: the first case reads 2 strikes from two refusals.
    - Restore `freshFixDispatchCount`'s distinct-number count at the claim gate: the readers disagree on
      the #8868 fixture (1 vs 2), and a third dispatch is admitted.
    - Drop the repeated-refusal arm: two identical refusals leave the PR blocked-fixable, and a third round
      dispatches.
