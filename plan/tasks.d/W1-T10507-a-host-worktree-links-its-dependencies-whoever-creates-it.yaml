- id: W1-T10507
  title: "A HOST WORKTREE LINKS ITS DEPENDENCIES WHOEVER CREATES IT — a tracked `hooks/post-checkout` sees a NEW linked worktree (old HEAD is the null sha) of a checkout whose hooks path holds it and runs `remudero-dependencies prime` on it, so a raw `git worktree add` of the host's operator checkout gets read-only seed links (2 MB measured) instead of a 511-537 MB `npm ci`; the installer keeps the hook reachable from the host's live checkouts"
  repo: remudero
  depends_on: []
