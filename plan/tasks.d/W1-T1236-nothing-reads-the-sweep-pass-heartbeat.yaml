  note: |
    RULE 19 / #588 MERITS TEST, RECORDED. The one-record filing spanned five concerns (doctor,
    ledger, ledger-render-retention, sweep, sweep-pass-liveness). It does NOT merit risk:high: no
    criterion asserts a cross-file invariant unsatisfiable piecewise — every proof below runs
    against doctor.ts and its own suite alone. So it is DECOMPOSED, one task per concern, with an
    explicit depends_on spine (W1-T1236 -> W1-T1237 -> W1-T1238), budgets resized per piece, and
    `origin: feedback#fb-1785937739950-070a87` preserved verbatim on all three.

    ORDER IS FORCED, NOT PREFERRED. The reader must land FIRST because W1-T1237's derived-from-
    consumers lock retains what a consumer demonstrably reads — registering `sweep.pass` before any
    reader exists is precisely the "hardcoded second list" that test exists to refuse.

    FILES ARE TWO AND MATCH W1-T1209 EXACTLY (`[src/lib/doctor.ts, test/doctor.test.ts]`), the
    repair-stall arm this one is modelled on. The new tests go in the existing doctor suite beside
    its siblings, not in a new file.

    CALL-SITE. `src/lib/doctor.ts` already exists, so the linter's call-site check does not fire
    here (it polices modules a task CREATES). The `grep: judgeSweepLiveness( in src/lib/doctor.ts`
    criterion is carried anyway, with the open paren, because the failure it guards against is real
    for an arm too: a judge function fully tested and never added to `buildDoctorReport`'s `checks`
    array ships green and unreached. `SWEEP_LIVENESS_STEPS\.has(` is escaped for BRE — the executor
    runs a regex, and an unescaped `.` is a widening metacharacter.

    verify:auto — every derivation is a pure fold over injected ledger lines against an injected
    now, the seam test/doctor.test.ts already uses for every sibling arm: no daemon process, no
    filesystem, no network.

    risk:medium, and the grade is blast radius rather than size: a false OK reproduces a
    23.5-minute blind window nobody notices, and a false non-OK on a healthy quiet fleet trains the
    operator to ignore the one instrument that would catch it — the same argument W1-T1209 made for
    the repair arm. It argues DOWN from high because doctor is READ-ONLY (`--fix` is refused by
    name) and this arm dispatches nothing.

    budget_usd 35.00 of the original 60.00 — one pure judge function, one fold, one Set literal and
    the doctor-suite tests. The remaining 25.00 goes to W1-T1237 (20.00) and W1-T1238 (8.00); the
    small overshoot is the per-task fixed cost of three PRs instead of one.
