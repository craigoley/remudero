  rationale: |
    WHY: reviewing #19812 (the first W1-T13905 design) on 2026-11-20, the reviewer found, by in-memory replay, three ways a
    board extended by new rows holds different run activity stand-ins from a fresh cold load of the same store:
    (1) a fact with the same stamp as an older stand-in on another run of the same task drops a stand-in a cold load
    keeps; (2) a strictly newer repeated sweep.disposed fact withdraws the task's winning older stand-in, and the repeat
    cannot fill the changed-activity slot; (3) a cached fact deleted under the board (the consistency oracle's heal)
    leaves the deleted fact's time in effect, and a second deletion between the reset's reads does too. These come
    from the board's retention and stand-in rules on main (W1-T9436), not from W1-T13905's index, and the board oracle
    only audits them every 10 minutes. The fleet's fixes on #19812 (commits aa0ae670, 32f6f6ce, 64c7461b, a08e3a6e,
    reachable from refs/pull/19812/head at ee4612d04; their branch was deleted when #19812 closed) are a starting
    point: they order rows at one instant as a cold load does
    (ts, kind, seq), keep a fallback per task slot, and replay activity after a reset.
  design: |
    INVARIANT cold-load-parity: after every update, the extended board's run activity stand-ins equal those of a fresh
    board that cold-loads the same store at the same seq.
    1. Rows at one instant are ordered as a cold load orders them: facts, worker stand-ins, activity stand-ins, each by
       store seq, replacing the insertion counter.
    2. Each task-activity retention slot keeps a fallback, so a withdrawn stand-in's slot goes back to the newest row a
       cold load would hold there.
    3. A detected deletion or rewind re-derives the run activity stand-ins from the store, re-reading once more if the
       store moved during the reset.
    4. A property test drives random appends and deletions and compares with a cold load after each update.
  falsifier: |
    Restore the insertion counter: criterion 1 fails. Drop the slot fallback: criterion 2 fails. Skip the re-read
    after a moving reset: criterion 3 fails.
