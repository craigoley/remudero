- id: W1-T3144
  title: "THE WIP GOVERNOR COUNTS PLAN PROJECTIONS INSTEAD OF THE OPEN BOARD — PRs whose task shard is not on main are invisible, so the daemon admits fresh builds after the board reaches its configured ceiling"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 20.00
  files:
    - src/lib/drain.ts
    - src/lib/status.ts
    - src/run-task.ts
    - test/queue-governor.test.ts
  origin: "operator-session#queue-lag-2026-09-08"
  plan_refs: ["W1-T121", "W1-T172", "W1-T321", "W1-T342", "W1-T2397"]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on the Azure fleet at 2026-09-08T10:24Z. GitHub reported twelve open PRs while
    `plan/policy.yaml` set `sweep.wipLimit.value: 10`. The daemon nevertheless emitted
    `dispatch.concurrent_set` for W1-T2895 and W1-T2907. Immediately before that row its candidate
    walk emitted only five `dispatch.skipped reason=open-pr` rows. Source explains the mismatch:
    both `drainCommand` and `daemonCommand` implement `openPrCount` by counting OPEN entries in
    `lastProj`, and `lastProj` is the Map returned by `projectPlan`, which contains one entry per
    task in the plan loaded from main. A PR carrying a new task shard cannot be in that plan until
    it merges, so the queue governor cannot see a large part of the queue it exists to bound.

    This is not a request for another GitHub read. `projectPlan` already calls
    `GitHub.listOpenHeadBranches()` once per projection, and `buildBatchedGithub` answers it from
    the same open-only REST snapshot used for task corroboration. Expose that one observation to
    the caller while it is in hand, then make both command paths count the complete open-board
    snapshot. A failed board read must fail the queue observation closed through the existing
    W1-T342 unreadable-governor path. Gate only new dispatch; sweep, repair, review, update and
    operator merge authority stay untouched.
  acceptance:
    - claim: "drain dispatch admission counts every open board PR even when current main cannot attribute those PRs to plan tasks"
      proof: "unit test: test/queue-governor.test.ts"
    - claim: "daemon dispatch admission counts every open board PR even when current main cannot attribute those PRs to plan tasks"
      proof: "unit test: test/queue-governor.test.ts"
    - claim: "the complete board count is captured from projectPlan's existing listOpenHeadBranches read and adds no GitHub request"
      proof: "unit test: test/queue-governor.test.ts"
    - claim: "an unreadable complete-board observation fails dispatch admission closed through the existing queue-governor error path"
      proof: "unit test: test/queue-governor.test.ts"
    - claim: "queue pressure still gates only new dispatch and never sweep drainage"
      proof: "unit test: test/queue-governor.test.ts"
  falsifier: |
    Delete the complete-board observation from `projectPlan` or change either command's
    `openPrCount` back to a count over `lastProj`. The W1-T3144 tests must then report the projected
    count of one instead of the complete-board count at the WIP limit. A recorder around
    `listOpenHeadBranches` must also prove exactly one call per projection; two calls would falsify
    the no-extra-request claim.
  note: |
    ID provenance: `rmd next-task-id --reserve` returned W1-T3144 after scanning main, open PRs,
    history, task shards and remote reservations, then wrote `refs/rmd-id/W1-T3144` on origin.
