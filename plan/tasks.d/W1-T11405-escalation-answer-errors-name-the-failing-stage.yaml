  design: |
    All code goes in src/lib/escalation-answers.ts. Keep readEscalationAnswers' signature, its result shape and
    its rejection: an unexpected throw still rejects, and the caller still writes its row.

    1. VOCABULARY. Export a const tuple ESCALATION_ANSWER_STAGES holding exactly:
       refusal_history_read (the awaited reader call), refusal_history_fold (copying and scanning the returned
       rows), recorded_origins, answer_parse (everything in the per-issue and per-comment/reaction walk outside
       landing), answer_landing (landAnswer), feedback (the deps.feedback block), refusal_alarm
       (raiseRefusalAlarms). A TypeScript union derived from the tuple types the cursor, so a stage outside the
       vocabulary does not compile. Stage text never comes from data.

    2. BOUNDARY. Keep the listOpen try/catch exactly as it is, before the boundary. Enclose everything after it
       in one try/catch with a local mutable stage cursor, set before each section and set back to answer_parse
       after each landing. The reader's steps run one at a time, so a local cursor is enough. The catch throws one new
       Error and never retries, resumes, counts or writes.

    3. MESSAGE. The new Error's message is exactly
       "escalation answers failed at stage <stage>: <class>". <class> is decided only by code:
       the literal Maximum call stack size exceeded when the throw is a RangeError with that exact message;
       otherwise RangeError, TypeError, SyntaxError or Error by instanceof; otherwise non-Error. Read no other
       property of the thrown value: not its other message text, name, stack, code or cause. Do not attach
       the original as cause and add no message truncation, because no unowned text enters the message.

    4. TESTS go in test/dispatch/escalation-answer-errors-name-the-failing-stage.test.ts and write first, red,
       against the current reader. Each drives an injected fault with no network, using a temp root:
       Use five distinct top-level node:test cases with literal title prefixes W1-T11405 criterion 1 through
       W1-T11405 criterion 5, matching the five unit-test proofs below. Criterion 1 covers all seven stage
       throws; criterion 2 covers the real overflow and sweep row; criterion 3 covers disclosure; criterion 4
       preserves deliberate unreadable behavior; criterion 5 covers no-fault behavior, idempotency and no retries.
       - refusal_history_read: deps.history rejects, with a set gateway.refusalIssues.
       - refusal_history_fold: deps.history resolves ok with a rows value whose iterator throws.
       - recorded_origins: plan/questions.ndjson is a directory.
       - answer_parse: an accepted comment whose body getter throws.
       - answer_landing: deps.writeLedger throws on step panel.question_answered.
       - feedback: deps.writeLedger throws on the escalation_answer.feedback_ row written after
         applyGrilledFeedbackAnswer returns, on a TRIAGE-<id> issue.
       - refusal_alarm: seeded refused history reaches the threshold and deps.writeLedger throws on step
         escalation_answer.refusal_alarm.
       The stack overflow case uses a real recursive overflow at each of refusal_history_read and
       refusal_history_fold. The disclosure case throws messages built from answer text, issue body text, a raw
       JSON response, a credential-shaped string and a 100,000-character string, plus a non-Error object, and
       asserts the whole message equals the expected constant string. One test goes through buildSweepHook
       (the runSweepWith shape in test/an-operator-reply-reaches-the-fix-rung.test.ts) so the assertion lands on
       the real escalation_answers.error row, and the unreadable row stays absent.

    NOT IN SCOPE, AND NEVER DONE BY THIS TASK OR ITS BUILD:
    - repairing, guessing at or working around the recursive cause;
    - src/cli/commands/sweep.ts, any new row, field or ledger step;
    - any human authority or config change, including operatorGithubLogins (the repository operator already
      authorized cao825 there);
    - posting a comment, running the reader against a real repository, or any provider or model call;
    - spend, routing changes, or dispatching any matrix task.
