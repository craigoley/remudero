      proof: "unit test: W1-T11405 criterion 2"
    - claim: "answer text, issue body text, a raw response, a credential-shaped string, a stack and a 100,000-character message never enter the row, whose text comes wholly from the code-owned stage and class vocabularies"
      proof: "unit test: W1-T11405 criterion 3"
    - claim: "listOpen, listComments and listReactions read failures still resolve with their existing unreadable counts, and the feedback_unreadable and refusal_alarm_unreadable rows are still written with no error thrown"
      proof: "unit test: W1-T11405 criterion 4"
    - claim: "a pass with no fault returns the same counts, issue writes, answers and ledger rows, a second pass lands no duplicate answer, and a stage failure rejects once with no retry of any gateway or store call"
      proof: "unit test: W1-T11405 criterion 5"
    - claim: "the stage vocabulary is one exported finite constant"
      proof: "grep: ESCALATION_ANSWER_STAGES in src/lib/escalation-answers.ts"
    - claim: "the reader throws the one code-owned message shape"
      proof: "grep: escalation answers failed at stage in src/lib/escalation-answers.ts"
  falsifier: |
    Delete the fix: remove the boundary and let the original throw through. The stage tests redden, because
    readEscalationAnswers rejects with the raw message and the real sweep row reads the generic stage-less
    Maximum call stack size exceeded again, exactly what the 56 ledger rows show.
    Interpolate the original message into the new one and the disclosure case reddens on the first injected
    secret-shaped string. Convert the rejection into a counted unreadable and the sweep test reddens on the
    unexpected escalation_answers.unreadable row. Move the listOpen catch inside the boundary, or remove an inner
    catch, and the preservation claim reddens. Leave one cursor assignment out and that stage's test reddens
    on the neighbouring stage name.
  note: |
    verify:auto: every stage is reached by an injected fault over a temp root and a fake gateway, so nothing
    needs a live repository, GitHub or a provider.
    risk:medium: a single concern in one reader, but the boundary encloses answer acceptance.
    No depends_on, and priority 2 is deliberate so the W11119 model matrix stays ahead.
    The stage split between refusal_history_read and refusal_history_fold is deliberate. Line 618 spreads the
    returned rows into history.push, and JavaScript engines raise this same RangeError message when a spread
    passes the argument limit. That is an UNVERIFIED candidate only, not a finding: nothing here measured the row count,
    and the cause stays UNKNOWN. The split exists so the next row can rule it in or out, and this task must not
    change that line.
