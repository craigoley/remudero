      `fails`/`passes`/`absent`/`unrunnable`, cached per (sha, file) in the ledger and serialized through
      `baseReproductionQueue`. The sweep uses it to verify a base-red claim. The repair lane never does.
    OVERLAP, swept 2026-10-16 over plan/ on origin/main and the 16 open PR heads for local attribution, a local test
    bisect or a repair-lane reproduce seam: none.
  design: |
    No new constant, no new policy key, and no retry cap: every bound below is a reading.
    1. `MainRepairLane` gains an optional `reproduceAt(sha, testFiles)` returning the base probe's per-file outcomes.
       `mainRepairLaneFor` (src/run-task.ts) wires it to `buildBaseReproductionProbe` over the target's managed
       checkout, so it shares the sweep's queue, its ledger cache and its host memory budget.
    2. `locateOffender`: when the span is non-empty and `baseReproductionFiles(ctx.failures)` names test files, the
       planned commits are probed LOCALLY before any CI probe. A local probe starts without being awaited (the rung never
       blocks on it). It is written to a `main.repair.bisecting` row with `method: local-test` and ref
       `local-test/<sha>`, and it concludes in a `main.repair.probe_concluded` row with `method: local-test`, the files
       and their outcomes. Its verdict: any file `fails` → red; every file `passes` or `absent` (the test did not exist
       there, so this red could not) → green; anything else → inconclusive.
    3. Cancelled commits are exactly the span; a local probe needs no CI run, so cancellation does not touch it.
    4. A `local-test/` probe the ledger shows in flight that this process is not running (a restart) is dropped from
       in-flight and planned again. It is never left in flight forever.
    5. An inconclusive local verdict hands that commit to the CI probe; with no CI probe runnable either, the
       `first-red-unattributed` fix-forward applies. A commit is never re-run locally by rote.
    6. A culprit proven by local verdicts is located as `bisected-first-red`: `probe_runs` cite the local evidence
       (sha, verdict, files), and `proveCulprit` accepts it only when the culprit fails and its first parent passes the SAME
       files that this repair's red names.
    Tests go in test/a-red-main-is-attributed-by-its-failing-tests-run-locally.test.ts, titled verbatim as in the
    proofs, driving the real rung with the W1-T7760 fake world and a fake `reproduceAt`.
  acceptance:
    - claim: "a red whose failing test files are known is bisected by running them locally at the cancelled commits, and the first commit where they fail is located with no CI probe dispatched"
      proof: 'grep: test("a red main is attributed by running its failing tests locally at the cancelled commits" in test/a-red-main-is-attributed-by-its-failing-tests-run-locally.test.ts'
    - claim: "a local probe never blocks the rung, and one the ledger shows in flight but no process runs is planned again"
      proof: 'grep: test("a local probe runs off the rung and one lost to a restart is planned again" in test/a-red-main-is-attributed-by-its-failing-tests-run-locally.test.ts'
    - claim: "an inconclusive local verdict hands the commit to a CI probe, and a culprit proven locally is reverted only when its parent passes the same files"
      proof: 'grep: test("an inconclusive local probe falls to CI and a local proof names its files" in test/a-red-main-is-attributed-by-its-failing-tests-run-locally.test.ts'
  falsifier: |
    At origin/main the lane has no local seam. A red with a two-commit cancelled span dispatches a CI probe on its
    first pass and names nothing until that run concludes, so the first test's assertion that `main.repair.located`
    names the failing commit after one local pass with no `/dispatches` request fails.
