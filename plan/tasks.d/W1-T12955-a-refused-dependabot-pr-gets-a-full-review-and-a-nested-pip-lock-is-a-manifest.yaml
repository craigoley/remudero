  rationale: |
    WHY: a Dependabot PR that the dep-review lane refuses waits for the operator for good. The lane refuses a PR
    whose diff touches a file outside the manifest allowlist, opens a needs-human escalation issue and posts no
    review. The sweep keeps disposing the PR to the dep-review lane, which refuses it again. The operator's rule is
    that no PR waits on the operator: fix and land it, file held follow-ups, or close it and file a held rebuild.
    MEASURED, core ledger (~/rmd-state2/state), 2026-11-14 18:15Z to 2026-11-15 18:16Z, PR #18405 (setuptools
    84.0.0 to 84.1.0 in .github/semgrep/build-requirements.txt, plus two test files that pin the version):
    - 11 dep-review.decided rows, all refuse, reason "diff touches file(s) outside the manifest/lockfile
      allowlist", offendingFiles .github/semgrep/build-requirements.txt and the two test files.
    - 10 dep-review.refused_path.not_proposed rows, reason foreign-commit: the head carries repair commits, so the
      W1-T9797 owned-build proposal is not filed.
    - 223 sweep.disposed rows with disposition dep-review and blocker awaiting-review; 6 pr.stuck rows.
    - GitHub at about 18:25Z: #18405 OPEN, MERGEABLE, created 2026-11-13 22:56Z (over 43 h). Issue #18409
      ("[BLOCKED] dep-review-refused-PR18405 ...") is open with needs-human, escalation-blocked and
      needs-question. Issue #18412 (a stage-stall clarification for the same PR) is open.
    READ at origin/main 57ca3bba9:
    - src/run-task.ts:12686 calls reconcileDependabotRefusedPath (src/lib/dep-review.ts:2321), which returns
      not-proposed for a foreign commit; the refuse branch then opens the escalation (dep-review.ts:2297, task id
      dep-review-refused-PR<n>).
    - src/lib/sweep.ts:11996 disposes every Dependabot PR to dep-review, whatever the last decision was.
    AMENDED 2026-11-15 (the build, at origin/main 3db8c428a): the first draft also widened MANIFEST_PATTERNS so a
    nested pip requirements lock was a manifest. That weakens a safety check the code keeps on purpose:
    - test/review/semgrep-dependency-bumps-14094.test.ts (W1-T12492) asserts that
      .github/semgrep/build-requirements.txt is not a dependency declaration path: "do not widen Dependabot's
      general dependency-file allowlist for this reviewed repair".
    - test/a-refused-dependabot-path-becomes-a-fleet-build.test.ts (W1-T9797) says the remedy for a refused
      Semgrep lock is the owned-build proposal, "never a wider allowlist", and its fixtures refuse on
      .github/semgrep/requirements.txt.
    - scripts/head-identity-gate.mjs reads the same isManifestPath, so the widening also widens that gate's
      dependency-bump exemption.
    With the widening, the dep-review lane alone would arm a Dependabot change to the Semgrep runtime locks on
    green checks. The route this task adds does not need it: #18405 also touches two test files, so it is refused
    either way, and the route sends a refused PR to the full review. The amendment drops the widening and adds
    criterion 6, which keeps the allowlist as it is.
    SCOPE: W1-T100 routes blocked CI to the ci-log fix path and never touches the dep-review lane or Dependabot
    PRs. W1-T12709 (queued) removes the needs-human stand-down for the fix lane; it does not change the
    dep-review refuse branch. W1-T12956 lands #18405's change by hand.
    FALSIFIER: if, after this lands, a refused Dependabot PR still has an open dep-review-refused-PR<n> issue and
    no review verdict after two full passes, the route is not wired in production.
  design: |
    INVARIANT review-gates-unchanged: routing changes who judges, not what merges; the full review and the
    required checks still gate the merge.
    INVARIANT owned-build-first: W1-T9797's owned-build proposal keeps precedence when it is captured.
    INVARIANT allowlist-unchanged: MANIFEST_PATTERNS and isManifestPath do not change.
    1. src/run-task.ts refuse branch: when reconcileDependabotRefusedPath returns not-proposed, write a second
       dep-review.decided row with decision refuse and route review, and do not open the dep-review-refused
       escalation. When the sweep passes --dependabot-review-failed (below), write no route row: the newest row
       then has no route, and the PR is a plain refuse.
    2. src/lib/dep-review.ts: reconcileDependabotRefusedPath takes reviewFailed. When it is true, a foreign commit
       does not stop the proposal; a non-Dependabot author or an unkeyed title still does.
    3. src/lib/sweep.ts:
       - DispositionFacts gets dependabotReviewRouted: the newest dep-review.decided row for dep-review-PR<n> at
         the PR's head has route review. runSweep reads it off the ledger lines it already holds.
       - Three rows above the dep-review row, for a routed Dependabot PR only: mergeable when checks are green,
         the review is success and the review verdict is delivered; post-review (blocker awaiting-review, owner
         review-lane) when no verdict is delivered and the review is none, or pending with a dead owner or past
         the ceiling; wait when the review is pending. Every other routed state (a failing verdict, or a pass with
         checks not green) keeps the dep-review row.
       - The sweep's depReview effect passes --dependabot-review-failed when the PR's review state is failure,
         and returns route-review for a routed refuse. route-review is not a terminal outcome, so the dep-review
         row runs again after a failing verdict and files the proposal; that run writes a plain refuse, which is
         terminal.
       - A new effect retireDepReviewRefusedAsk (built in buildSweepEffects over the sweep's issue gateway): once
         per PR head, when a routed PR's verdict is delivered, close each open needs-human issue whose
         **Task:** line is dep-review-refused-PR<n> with a comment that names the review state and head, and log
         dep-review.refused_ask.retired with the closed issue URLs (empty when none).
    4. The fix lane never pushes onto a Dependabot branch: a routed PR with a failing verdict stays on the
       dep-review row, above every fix row (the rule at sweep.ts:11990).
    5. One focused test file for criteria 1 to 6. A Dependabot PR body carries no Acceptance block, so the full
       review usually fails closed; the usual end of the route is then the owned-build rebuild, which is what the
       operator's rule asks for.
    NOT IN SCOPE: widening the manifest allowlist for any ecosystem; landing #18405 (W1-T12956); the fix lane's
    needs-human stand-down (W1-T12709).
  falsifier: |
    Open the escalation again on not-proposed: criteria 1 and 4 must fail. Keep the dep-review disposition after a
    routed refuse: criterion 2 must fail. Arm a routed PR on a failing verdict, or drop the reviewFailed bypass of
    the foreign-commit stop: criterion 3 must fail. Widen MANIFEST_PATTERNS to nested pip locks: criterion 6 must
    fail. Restore and require all to pass.
