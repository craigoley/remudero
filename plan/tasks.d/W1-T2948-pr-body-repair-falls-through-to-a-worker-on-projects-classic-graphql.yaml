      proof: "unit test: test/pr-body-rest-write.test.ts"
    - claim: "the trailer stamp and retro body repair reuse the same REST writer rather than retaining independent gh pr edit call sites"
      proof: "unit test: test/pr-body-rest-write.test.ts"
    - claim: "the REST argv carries PATCH, the exact owner repository and PR number, and the complete body as one argument"
      proof: "unit test: test/pr-body-rest-write.test.ts"
    - claim: "a malformed or non-pull-request URL fails before gh is invoked, so no repository or PR target is guessed"
      proof: "unit test: test/pr-body-rest-write.test.ts"
    - claim: "a write failure preserves each caller's existing error or fallback behavior and remains ledgered with its existing reason"
      proof: "unit test: test/pr-body-rest-write.test.ts"
    - claim: "the change adds no worker dispatch, commit, merge, provider-selection, timer, polling, or lifecycle action"
      proof: "unit test: test/pr-body-rest-write.test.ts"
