  design: |
    1. A RE-DERIVED TASK READS ITS ROWS FROM THE STORE. `project()` hands projectPlan a ledger index whose task and
       step buckets are answered on demand from the read model and released at the end of the update (the 10-minute
       no-reuse oracle reads task by task), with the same `get` surface deriveStatus's helpers use today
       (indexedTaskRows/indexedStepRows; widen LedgerIndex in status.ts to a read interface if it must be a Map):
       - a task's bucket: its `fact` rows by the fact_task index, plus the rows whose `task` alias names it from a new
         `fact_alias(task, seq)` table the projector writes for a fact row whose `task` differs from its `task_id`
         (backfilled once from fact bodies when the table is created, never by re-reading the ledger), plus its
         run_activity and run_worker stand-ins built exactly as ingest builds them now, in the order `rows` holds them
         today (by ts_ms, a late row placed by its time, a stand-in after the rows of its instant);
       - the cross-task lookups in (a) above through a new `fact_step(step, ts_ms)` index.
       The per-run maps (activityRows, workerRows, newestFactMs) go; the per-task stamp maps stay.
    2. THE ROWS THE NOW VIEW WALKS ARE THE ROWS A RULE KEEPS. BOARD_ROW_RETENTION declares, per step, the keys whose
       newest row (or reader window) the now view's readers in (b) read; ingest keeps a row while some rule holds it
       and drops it the moment every rule that held it is superseded. `rows()` returns the kept rows in today's order,
       so every reader runs unchanged. A window rule (UTC day, ISO week) is the reader's own definition of "today's
       spend", not a retention bound: no new time window, count cap or threshold. The recent feed takes each ingested
       row once (or reads the existing recent projection), never a cursor into an array that now loses rows.
    3. FAIL CLOSED. A census test runs the now view over every row with a recording proxy and fails when a reader
       outside the derive reads a step BOARD_ROW_RETENTION names no rule for, so a later reader of a new step reddens
       instead of reading nothing.
    4. The intern table holds only kept rows' values (rebuilt from the kept rows after an update that dropped any).
    5. An option keeps every row (today's behaviour), used only as the equality test's reference arm, as
       `internStrings: false` is for W1-T6467. size() keeps W1-T9403's shape (rows kept, their source bytes): THE EFFECT
       MEASURE is serve.memory's holds after deploy — board:core entries tracking distinct tasks, PRs, PR heads and
       today's runs, flat across samples while those keys are, against 663,486 at 12:26:41Z; and the heavy lane's used
       heap against 908 MB. Both are read, not asserted.
