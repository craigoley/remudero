  rationale: |
    READ at origin/main 3f9003ebf (2026-10-15).
    - `skillEvalVerdict` (src/lib/skill-eval.ts:195) passes a draft when every held-out task is measurable, the mean
      with-skill minus without-skill pass rate is above 0, and no task regressed. The operator ruled on 2026-10-13:
      K = 3 held-out tasks and R = 2 trials per arm.
    - At that size, 6 of 6 with the skill against 3 of 6 without passes. The exact one-sided p of those pooled counts
      (hypergeometric: C(9,6)·C(3,0)/C(12,6) = 84/924) is about 0.091. The best possible result, 6 of 6 against 0 of 6,
      is 1/924, about 0.0011.
    - Two trials of one task are not independent, so the pooled p is optimistic. At the task level, three tasks can
      never go below 1/8 on a sign test.
    - The `skill_eval.result` row (SKILL_EVAL_STEPS, :133) reports the delta and nothing about chance, and it is what
      the operator reads before approving a draft.
    Found while reading anthropics/claude-quickstarts (managed-agents knowledge-wiki notebook): identical configurations
    move by several points run to run, so a single-run gain is noise until it repeats.
    THE 2026-10-13 RULING STANDS: this adds numbers to the row and changes no verdict.
  design: |
    1. src/lib/skill-eval.ts gains a small exact one-sided Fisher (hypergeometric) test over two pass counts, built
       on a log-factorial table as src/lib/benchmark-aa.ts already does (`lnFactorials`, :313). It stays inside
       skill-eval.ts so this task touches one module.
    2. `SkillEvalVerdict` and the `skill_eval.result` row gain `pValueOneSided` (pooled with-skill passes against
       pooled without-skill passes), `tasksImproved` and `tasksMeasured`. A result with no measurable task carries no
       p-value.
    3. The verdict logic is unchanged.
    New tests go in test/a-skill-eval-result-names-its-exact-p-value.test.ts, with `test(` titles exactly as in the
    proofs below. The first pins 84/924 for 6-of-6 against 3-of-6, and 1/924 for 6-of-6 against 0-of-6.
  acceptance:
