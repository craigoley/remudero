  acceptance:
    - claim: "With a merged archive over the decompressed ceiling present, a pass still merges a same-day run of other candidates that fits within the ceiling"
      proof: "grep: W1-T13385 criterion 1 in test/ledger/a-compaction-pass-is-not-stalled-by-an-oversized-archive.test.ts"
    - claim: "An oversized archive is never selected alone, is left byte-for-byte intact, and is counted among the deferred archives in the report"
      proof: "grep: W1-T13385 criterion 2 in test/ledger/a-compaction-pass-is-not-stalled-by-an-oversized-archive.test.ts"
    - claim: "invariant:no-write-without-reduction — a pass whose only candidates are oversized or unpairable writes nothing"
      proof: "grep: W1-T13385 criterion 3 in test/ledger/a-compaction-pass-is-not-stalled-by-an-oversized-archive.test.ts"
  rationale: |
    WHY: found while building W1-T13370 and W1-T13371 (2026-11-17). LATENT: no archive on the host is over the
    ceiling today (OBSERVED: merged archives measure 45-65 MB decompressed against the 64 MiB ceiling).
    READ at origin/main, selectLedgerCompactionSources (src/lib/ledger-compact.ts): when any eligible merged archive
    measures over maxArchiveBytes, the repair branch puts it first and the walk admits it ALONE
    (oversizedOnlySource). ledgerCompactCommand then splits it into two or more outputs, and the no-reduction check
    (outputs >= sources) declines it. test "a legacy oversized merged archive is left intact when its selected split
    cannot reduce the count" (test/no-union-read-decompresses-a-million-row-archive.test.ts) pins that decline.
    OBSERVED in a W1-T13370 test (criterion 3): with one oversized merged archive and five small same-day rotations,
    the pass selects the oversized archive alone and reports no-reduction. Nothing else changes between passes, so
    every later pass repeats the same choice: one oversized archive stops all compaction for good. W1-T13370's day
    packing is skipped in the repair case, so it does not help.
    A lone oversized source can never reduce the count, so the repair as written can never succeed.
  design: |
    INVARIANT no-write-without-reduction: the no-reduction refusal and the 64 MiB ceiling are unchanged.
    1. Drop the repair preemption: an oversized archive is never admitted alone, by the repair branch or by the walk's
       first-entry case. Treat it like any candidate that overflows: skip it and count it in sizeSkippedCount.
    2. Selection then proceeds as for any corpus (the walk, then W1-T13370's day packing).
    3. Keep W1-T13371's measurement reuse, so skipping an oversized archive does not re-measure it every pass.
    4. The pinned decline test must keep passing unchanged: its archive is still left intact.
  falsifier: |
    Restore the lone oversized admission and criterion 1 fails (the pass selects the oversized archive alone and
    declines). Let packing take the oversized archive and criterion 2 fails.
