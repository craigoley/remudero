- id: W1-T9812
  title: "THE PRE-EXIT PASS RUNS BESIDE THE RESTART DRAIN, NOT BEFORE IT — prepareFreshnessExit awaits a running background pass or runs a fresh full pass, and only then calls drainBeforeRestart, so a latched restart waits pass time plus drain time (B17 episode 2, 2026-10-15 20:08: latch to drain 3.6 min), and the reviews and fixes that pass admits get the exit's whole bound on top"
  repo: remudero
  depends_on: [W1-T9808, W1-T9352]  # W1-T9808 adds the latch admission predicate; both edit prepareFreshnessExit
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the latched exit's drain starts with its pre-exit pass instead of after it; which pass arm runs (W1-T8170, W1-T9352) and the drain's bound (W1-T8172) are unchanged
  band_meaning: span
  origin: "operator session 2026-10-16 filing agent Q3 lead 7 (B17): W1-T8172 (#12249) build lead (3), the pre-exit sweep delays the drain; ~/Remudero-notes/tracker-2026-10-15.md B17 lines"
  plan_refs: [W1-T8170, W1-T8172, W1-T9352, W1-T1272, W1-T4998, W1-T5721, W1-T9114]
  files:
    - src/lib/daemon.ts
    - test/the-pre-exit-pass-runs-beside-the-restart-drain.test.ts
  status: queued
  priority: 2.5  # every lane is idle for the pass's length on each latched exit that takes the awaited or ran arm; full pass p50 18.7 min, p90 49.7 (F5, 10-16)
  attempts: 0
  rationale: |
    EVIDENCE: B17 measured episode 2 on 2026-10-15 (core ledger): latch to drain 3.6 min at 20:08, spent in the
    pre-exit pass. The F5 census (10-16) puts a full pass at p50 18.7 min, p90 49.7, max 107.
    READ at origin/main db88033a3 (2026-10-16), src/lib/daemon.ts:
      - `prepareFreshnessExit` runs, in order: `if (backgroundSweep) { preExitPass = "awaited_in_flight"; await
        backgroundSweep; }`, else the W1-T8170 skip (`skipped_ran_since_latch`), else `await runGatedSweep(...)`.
        Only then: `await drainBeforeRestart("daemon.freshness_drain", dispatchLatchAtMs);`.
      - `drainBeforeRestart` is where the waiting happens. W1-T8172's `beginLatchDrain` only snapshots what is in
        flight at the latch and logs `.started`; the bound runs from the latch, but nothing is awaited until the pass
        above has settled. So on the "awaited_in_flight" and "ran" arms the exit costs the pass plus the drain's rest.
      - The pass is a full `runGatedSweep`. Its `continueReviewAdmissions` reads only stop and pause, so it admits
        reviews and fix dispatches that then join the drain with the exit's whole bound (W1-T8172's `afterLatch`
        reviews get `sweepWallClockBoundMs`).
      - W1-T9808 closes the second point (no admission the drain would abandon). This task removes the
        serial wait.
    NOT COVERED ELSEWHERE: W1-T8170 (merged) skips the pass when one completed since the latch. W1-T9352 (queued)
    skips it for the unlatched exits. Neither changes the order of pass and drain on the arms that still run a pass.
    Swept plan/tasks.d on origin/main and the open heads updated since 10-12 for prepareFreshnessExit, pre_exit_pass
    and "pre-exit"; only merged tasks' stale run branches touch them. Control: pre_exit_pass reads 2 shards on main
    (W1-T8170, W1-T9352).
    DEPENDENCIES: W1-T9808 adds the latch admission predicate the pass runs under, and W1-T9352 edits the same
    function's pass arms. Serialized after both.
  design: |
    Operator rulings: no hard thresholds (no fixed wait, age or count below), lean into automation.
    1. START THE DRAIN WITH THE PASS. On the latched exit, `prepareFreshnessExit` starts `drainBeforeRestart` at the
       same moment it starts awaiting the background pass or running the gated pass, and awaits both. The exit costs
       the longer of the two, not their sum.
    2. W1-T1272'S GUARANTEE HOLDS. The exit still returns only after the pass settles (or reaches its learned bound,
       as today), so no stale exit leaves the full sweep unreached and a pass mid-merge is never cut.
    3. WHAT THE PASS ADMITS IS STILL WAITED ON. After the pass settles, reviews or detached actions it admitted are
       drained within the time left in the latch's bound (W1-T8172's deadline), not a fresh whole bound. Under the
       W1-T9808 predicate the pass admits only work that fits.
    4. The unlatched exits and the memory drain keep today's order.
    5. Observability: `daemon.freshness_drain.completed` gains `pre_exit_pass` and `pass_overlap_ms` (how long the
       drain ran beside the pass), and `daemon_selfrestart_for_freshness` keeps `pre_exit_pass`.
    6. Tests (new file, `test(` titles verbatim as in the proofs below; drive runDaemon with an injected sweep,
       runOne, review registry and fake clock, as test/a-latched-restart-exits-when-its-last-lane-settles.test.ts
       does):
       - a review in flight at the latch is drained while the pre-exit pass is still running;
       - the exit returns only after the pre-exit pass settles;
       - work the pass admits is drained within the latch's remaining bound, not a fresh one.
  acceptance:
    - claim: "the restart drain waits on in-flight work while the pre-exit pass is still running"
      proof: 'grep: test("W1-T9812: the restart drain starts before the pre-exit pass settles" in test/the-pre-exit-pass-runs-beside-the-restart-drain.test.ts'
    - claim: "the exit still returns only after the pre-exit pass settles"
      proof: 'grep: test("W1-T9812: the restart still waits for the pre-exit pass to settle" in test/the-pre-exit-pass-runs-beside-the-restart-drain.test.ts'
    - claim: "work the pre-exit pass admits is drained within the latch's remaining bound"
      proof: 'grep: test("W1-T9812: what the pre-exit pass admits keeps the latch bound" in test/the-pre-exit-pass-runs-beside-the-restart-drain.test.ts'
  falsifier: |
    At origin/main, a latched exit with a background pass that settles 10 min after the last lane and a review in
    flight at the latch calls `drainInFlightReviews` only after the pass resolves, so the first test sees no drain
    activity while the pass runs. A review the pass admits at origin/main is given `sweepWallClockBoundMs` from the
    exit, so the third test fails.
