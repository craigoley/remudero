  note: |
    RATIFIED AT THE CLASS, NOT THE INSTANCE. The proposal's literal ask — promote the prose rule to an
    instrument on the strength of 31 recurrences — is NOT filed as asked, because the count is an
    activity count and the rule's failure is therefore unproven. What IS ratified is the mechanism that
    made that unearned conclusion reachable. W1-T4272 carries the promote-to-instrument the proposal was
    reaching for, done against observed evidence.
    risk:high, BOTH READINGS RECORDED. Rule 19's SPAN is the band's proximate cause: `files:` crosses
    two stems as `sizingViolation` counts them (`rule-efficacy`, `rule-efficacy-signature-kind`), and
    decomposing is wrong — a semantics change cannot ship without the two-direction falsifier that
    proves it damped one conclusion and preserved the other. BLAST RADIUS is genuinely non-trivial too:
    this edits what the escalation writes into the proposal registry, and the failure direction is
    asymmetric — too permissive re-mints unearned proposals, too strict silences a rule that really is
    failing. Criterion 2 is what stops the fix overshooting into never-escalating.
    verify:auto — every deliverable is a pure function over fixture signature tables and fixture ledger
    rows plus a registry write, decidable in-process with no network and nothing spawned.
    PROOF NOTES: the four `unit test:` proofs use the PURE-PATH form naming a file this shard's own
    `files:` declares — the only form a forward reference resolves in, because `judgeCriterion` gates
    its carve-out on `!whitelisted.nameFiltered` (W1-T1266's recorded finding). The grep forward-
    references a new identifier into an EXISTING file, the no-third-option form: a grep at a
    not-yet-existing path is exec_error, not a forward reference.
