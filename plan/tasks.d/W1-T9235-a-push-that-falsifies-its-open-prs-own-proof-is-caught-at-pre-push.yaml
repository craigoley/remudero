    - claim: "the same push with only a cached body is reported and not refused, and a proof already failing at the old tip is reported only"
      proof: 'grep: test("W1-T9235: a cached body or an already failing proof only reports" in test/a-push-that-falsifies-its-open-prs-own-proof-is-caught-at-pre-push.test.ts'
    - claim: "a first push of a new branch reads nothing, and a busy read floor with no cache reads nothing and names the skip"
      proof: 'grep: test("W1-T9235: a first push or a busy floor makes no GitHub read" in test/a-push-that-falsifies-its-open-prs-own-proof-is-caught-at-pre-push.test.ts'
    - claim: "hooks/pre-push runs the open-PR body precheck"
      proof: 'grep: test("W1-T9235: hooks/pre-push runs the open-PR body precheck" in test/a-push-that-falsifies-its-open-prs-own-proof-is-caught-at-pre-push.test.ts'
    - claim: "the new test file passes"
      proof: "unit test: test/a-push-that-falsifies-its-open-prs-own-proof-is-caught-at-pre-push.test.ts"
  falsifier: |
    Compare only the new tip (no old-tip run): the second test's already-failing proof is refused. Read GitHub whenever
    the old sha is non-zero, ignoring the floor: the third test's busy-floor arm records a read. Remove the hook call:
    the fourth test, which reads hooks/pre-push for the script call, fails.
