- id: W1-T9235
  title: "A PUSH THAT FALSIFIES ITS OPEN PR'S OWN BODY PROOF IS CAUGHT AT PRE-PUSH — on 2026-10-13 a push to #11328's shards broke that PR's own ## Acceptance grep proof and it surfaced only as review-failed about 20 minutes later; the pre-push proof precheck reads plan criteria only and SKIPs a plan-only filing, so nothing re-runs a stored body's proofs before the push lands"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # the pre-push hook runs on every operator, agent and worker push; a wrong refusal strands a push, and the body read must stay inside the shared gh read floor
  band_meaning: span
  origin: "operator session 2026-10-13: #11328's follow-up push falsified its own body proof; the miss cost a review round"
  plan_refs: [W1-T4921, W1-T3222, W1-T3059, W1-T3275, W1-T1066]
  files:
    - hooks/pre-push
