      proof: "grep: an unreadable /proc is named on the row in test/console-api/serve/serve-names-every-worker-thread-and-reads-every-os-thread.test.ts"
  rationale: |
    WHY: serve's steady CPU goal is under 0.3 cores; it measured 1.33-1.43 on 2026-11-17. OBSERVED on the Azure host at
    17:20Z (60 s /proc per-thread sample of serve's generation): one WorkerThread at 0.516 cores and main at 0.756, but
    the serve.thread_load row named only threads 0, 2, 4, 6 and 14, the workers serve's main thread spawned itself. The
    hot thread was a worker's worker, and every unnamed worker reads "WorkerThread" in /proc, so neither row could name
    it. A 30 s inspector profile then showed it was the read-model slow lane (fixed by W1-T13442).
    MEASURED in the cloud container on Node 24.22.2 (serve's runtime): new Worker(..., { name }) sets the OS thread's
    comm (cut at 15 bytes), nested workers included.
  design: |
    INVARIANT unread-is-not-idle: a thread list that could not be read is never an empty list.
    1. New leaf src/lib/thread-names.ts: THREAD_NAMES, one unique name of at most 15 bytes per spawn site, and
       threadName(site), the lookup every spawn site calls.
    2. Every new Worker / startWorker call in src passes name: threadName("<site>") (tick-read-worker's construct
       forwards given.name). A census test fails on any spawn site without one.
    3. serve-thread-load.ts reads /proc/self/task each sample (procSelfThreads) and adds os_threads to the row,
       grouped by comm, per-tid deltas; a tid reused under another name counts from its own start.
    4. serve-supervisor.ts adds threads (every consumer at or over 0.005 cores) beside the unchanged top three.
  falsifier: |
    Drop the name from one spawn site: criterion 1's census fails. Return [] instead of os_threads_error when /proc
    throws: the guard fails. Cut threads to three: criterion 3 fails.
