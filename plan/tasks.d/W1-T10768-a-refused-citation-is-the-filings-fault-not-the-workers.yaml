    'repository-source-health-followup-20261026.json; https://github.com/…/app/live-view-actions.ts'`.
    - The first run wrote `report.followups` from its RECON at 13:24:12.680Z, 0.3 s before the verdict,
      and the verdict carries `cost_usd` 0.288. So a worker DID run before the refusal: the recon. The
      refused prompt was the IMPLEMENT prompt.
    - The breaker tripped at 14:04Z (console escalation #2288). The operator released it at 15:19Z.
    - Console #2285 (merged 13:50:55Z) replaced that `context[].src` with the bare https URL. The diff
      touches only plan/tasks.d/CONSOLE-T152-repository-health-recheck.yaml.

    WHERE THE GATE IS, AND WHY NOTHING EARLIER CATCHES IT.
    - src/lib/prompt-render.ts:1201-1203 `implementPromptParts` renders each shard `context` entry as
      `- <claim> [src: <src>]` inside `# CONTEXT`.
    - src/cli/commands/run-task-verb.ts:6307 `assertProvenance(prompt)` runs on the rendered implement
      prompt, AFTER recon.
    - src/lib/provenance.ts:27-29 `ACCEPTED_KIND` admits only recon#, plan#, PR#, learnings#, operator#,
      commit#, an http(s) URL or a bare sha. :114-115 refuses anything else as `unrecognized source kind`.
    - plan.ts:209 and :781 load `context` with a bare cast: no shape or kind check.
    - task-linter.ts's only `provenance` check (:2514 `provenanceViolation`) checks for a missing
      `origin:`. No lint check reads `context[].src`.
    - The pre-dispatch linter runs before the inflight lock and before recon
      (run-task-verb.ts:4766 `assertLintClean`). A refusal there is `blocked_illformed`, a zero-cost
      admission refusal (status.ts:3695 reads it as `admission_refused`), and W1-T3657's repair lane
      takes it. A context-citation check there would have cost CONSOLE-T152 nothing.
    - The console's own CI (.github/workflows/ci.yml) runs only scripts/check-plan-dependencies.mjs. It
      does not run core's lint-plan, so a consumer filing reaches dispatch unlinted for this.

    WHY IT STRIKES.
    - run-task.ts:10720-10730 `runErrorCause` has no arm for a ProvenanceError, so it returns
      `run-error`.
    - non-worker-verdict.ts:24-29 INFRASTRUCTURE_THROWN_STAGES has no `run.error`, and :50-53
      `streakRefusal` returns undefined. So the W1-T7742 breaker counts it.
    - stranded-task-detector.ts:66-80 `nonWorkerVerdictClass` returns undefined, so the W1-T8241 runbook
      reads it as the worker's.

    THE SAME DEFECT IS QUEUED IN CORE TODAY (measured). Loading origin/main's plan and testing every
    `context[].src` against `ACCEPTED_KIND` gives: 4,740 tasks, 2 with context, 4 claims, and 1
