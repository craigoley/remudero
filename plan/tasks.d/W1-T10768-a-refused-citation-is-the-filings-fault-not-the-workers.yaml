    THE INCIDENT. CONSOLE-T152 has five `verdict` rows, all `verdict: failed`, `stage: run.error`, `cause:
    run-error`. Their runs are -1793018634158 (13:24:12Z), -1793021236051 (13:28:44Z), -1793021490404
