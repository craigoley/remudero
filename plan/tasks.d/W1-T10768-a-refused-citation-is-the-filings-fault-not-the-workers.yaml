    NOT COVERED ELSEWHERE. Swept plan/tasks.d on origin/main for `provenance gate`, `unrecognized
    source kind`, `ACCEPTED_KIND` and `context-citation`: no task checks a context citation's kind.
    - W1-T10742 (queued, `proof_inconclusive`) and W1-T10749 (queued, `push_auth_refused`) each add a
      class to the same `streakRefusal` and `nonWorkerVerdictClass`. There is no depends_on: whichever
      lands second merges the arms side by side.
    - W1-T3657 (merged) owns the repair lane this reuses.
    - lint-plan's duplicate-surface advisory names W1-T120 (tasks.yaml, no status) for sharing
      src/lib/task-linter.ts and src/run-task.ts. That task makes a gate prove which plan file it read.
      It shares two hot files and no concern: this task adds one lint check and one error cause.
    - Read the 14 open core PRs' titles at 22:15Z: none touches provenance or these classifiers. No run-
      branch for this id exists.
  design: |
    1. ONE PREDICATE. provenance.ts exports `citationKindRefusal(src)`: undefined for an accepted kind,
       else the same `unrecognized source kind '<src>'` text `lintPrompt` writes. `lintPrompt` calls it,
       so the gate and the linter cannot drift. Never write a second copy of `ACCEPTED_KIND`.
    2. A LINT CHECK, BLOCKING, AT FILING AND PRE-DISPATCH. task-linter.ts adds check `context-citation`,
       severity block.
       - Each `context[]` entry whose `src` the predicate refuses is one violation, naming the task, the
         entry's index and the predicate's text.
       - It runs everywhere `lintTask` runs. That is lint-plan on a plan PR (filing), and `assertLintClean`
         before recon in run-task.
       - So a consumer repo's shard, which its own CI never lints with core's rules, is still refused as
         `blocked_illformed` before recon spends anything. W1-T3657's repair lane carries the verdict.
       - Before enabling it, run the predicate over every repo plan the fleet dispatches, at least core
         and the console, and list each refused task in the PR body. Today that is W1-T10573 in core.
         Report each one, and never edit another task's shard in this PR.
    3. A PROVENANCE REFUSAL THAT STILL REACHES THE GATE IS THE FILING'S, NOT THE WORKER'S.
       - That covers a recon, learning or operator-note part, or a shard the linter missed.
       - `runErrorCause` returns a new cause, `provenance-refused`, for a ProvenanceError (checked by
         class first). Add it to `RunErrorCause` in run-task-verb.ts.
       - non-worker-verdict.ts `streakRefusal` returns `provenance_refused` for a `failed` verdict at
         stage `run.error` with that cause. For rows written before the cause existed, it also matches
         cause `run-error` whose `reason` starts `provenance gate blocked dispatch`. So CONSOLE-T152's
         five rows stop counting.
       - It goes in the streak arm only, never in `lifetimeInfrastructureRefusal`, the way the harness
         checkpoint reasons are. A run that spent a recon still counts for lifetime judgment, which keeps
         a refusal that recurs every dispatch bounded.
       - stranded-task-detector.ts `nonWorkerVerdictClass` maps it to `provenance_refused`, never
         `toolchain`.
    4. Nothing else. No breaker bound, `ACCEPTED_KIND` member, repair-lane or other class changes.
