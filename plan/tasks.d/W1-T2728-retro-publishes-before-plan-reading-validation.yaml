- id: W1-T2728
  title: "A RETRO CAN PUBLISH A PLAN CONTRADICTION BEFORE THE PLAN-READING SUITES RUN — #3705 introduced DR-28 without Standing rule 28, so the first deterministic diagnosis arrived five minutes later from public CI instead of inside the producing run"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 35.00
  risk: high
  origin: "queue-hygiene#3705-retro-prepublish-validation-2026-09-02"
  plan_refs: ["DR-28", "W1-T136", "W1-T2428", "Standing rule 28"]
  files:
    - src/run-task.ts
