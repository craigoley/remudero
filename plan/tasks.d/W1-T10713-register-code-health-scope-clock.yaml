    Do not change source production code, discovery, refusal logic, existing rows, consumers, margins,
    population baselines, exclusions, known-uncovered entries, waiver handling or policy thresholds.

    Prove that the real table covers an explicit scope parse, removing this row restores the missing
    field refusal, a stale source anchor still refuses, a near-future fixed asOf fixture reaches its
    actual cutoff, and an unrelated consumer is not attributed to this view-specific rule. In the
    existing cached-view refusal test, derive its clock from Date.now once and its stale reading one
    hour earlier. Retain all original missing-scope, stale-scope, requested-build, foreign-repository
    and configured-roster assertions. Do not hide a fixture with an exemption or move a fixed date.
    Run the actual census and its verified physical suites through normal admission.
  falsifier: >-
    Keep the tests and remove only the new asOf registration: the registration regression must fail.
    Restore it and obtain a complete passing test summary. Do not claim this changes production
