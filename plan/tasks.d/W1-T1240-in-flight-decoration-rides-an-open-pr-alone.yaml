  note: |
    EVERY PROOF USES THE PURE-PATH `unit test:` FORM naming a file this task declares in `files:` and
    which does not exist yet, so on the FILING PR each resolves to `not_yet_built` rather than
    executing. No `grep:` proof is used: the marker's field name is the implementer's call under
    design (ii), and a grep naming a symbol nobody has chosen yet would either mis-execute now or
    pin a name the design deliberately leaves open.

    `risk: high` IS RULE 19's SPAN, NOT BLAST RADIUS, and the distinction is recorded so a reader does
    not over-read it. The linter scores `files:` as two subsystems (status, board) and offers
    raise-or-decompose; decomposing is WRONG here — a projection field with no reader is the exact
    unwired-ship defect design (iv) exists to prevent, so the field and its one carry-through must
    land together. The actual blast radius is narrow: the change is ADDITIVE and sparse, it moves no
    row between statuses, and falsifier 3 is what proves that.

    budget_usd 40 — the edit is a few lines plus a carry-through; the cost is the five-direction
    fixture, all of which is decidable against `DeriveDeps` injection (`inflightHolder`, `isPidAlive`,
    `now`, `livenessBoundMs` are all already injectable), which is why `verify: auto`.

    NO depends_on. W1-T368 makes `hasLiveLock` TRUSTWORTHY and this task makes its ABSENCE VISIBLE;
    either can land first and neither changes the other's seam. Stalling this behind an unmerged
    shard would buy nothing.

    THE RECON THAT PRODUCED THIS ASKED FOR A REORDER. It does not get one, and rationale (1) is
    written at length precisely so the next reader does not re-derive the same wrong fix from the
    same `||`.
