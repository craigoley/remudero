  rationale: |
    The reported attention flag now has prepared read/reply source, but existing Inbox list/detail
    producers select proposal identities. A separate reading page does not make engineering asks
    discoverable in the mailbox or remove an answered ask from Action required. The operator says
    archive when the agent needs no more input, while work can continue, and reopen on a new question.
    A fresh sweep at main 542d312490d43b2825427a8134a833ff5cdf3a4e covered all 17 open Core PR heads.
    API head SHAs matched git ls-remote for all 17. Each head had zero overlap with this task's
    nine implementation and test paths, zero changed plan files matching the mailbox-index subject,
    and zero added index-route signatures. The positive control returned four task/index matches
    from main, confirming the search terms resolved in the repository corpus.
    W1-T10572 shares the OpenAPI and generated-client files but only documents the already-existing
    AnalyticsView gardener-spend source. This task adds repository-scoped escalation thread routes,
    their schemas, and the conversation-index tests; the two declaration changes are in separate
    sections. Normal branch reconciliation still applies if both tasks reach review at once.
  design: |
    Add one authenticated, repository-scoped, bounded GET /v1/escalation/threads index in the real
    serve assembly and generated contract. Mount the index and existing conversation read/reply
    contract for each supported selected instance over its own repository, ledger and thread store;
    never forward an unknown instance to core or share a different repository's message store.
    Preserve unsupported or unreadable instance capabilities explicitly. Reuse the existing native thread store, current board,
    immutable source-bound reply/import receipts and W1-T11103 correspondence outcomes. Add no new
    store, executor, model call, scheduler or bulk GitHub fan-out. A list read never writes messages.
    Preserve current native issue URLs for initial flags without saved history; mark their identity
    or correspondence unknown until positively verified rather than inventing a class or destination.
    Verified saved conversations retain the original canonical issue URL and exact native identity
    after their original issue closes or disappears from the board. Deduplicate that issue/thread
    across sources; reject conflicting mappings rather than silently choose a different discussion.
    Use one shared correspondence projection with the detail reader: saved answer means waiting for
    agent; explicit no-more-input means archived even while work runs; a later question means needs
    input on the same thread. An open source flag cannot resurrect an already answered ask. Issue
    disappearance, a successful capture or empty interpreter rules cannot archive correspondence.
    Publish source kind, short source facts, canonical issue/thread identity, last activity and
    correspondence state with source time and coverage. Do not invent unread state or expose proposal
    approval/triage controls for an engineering row. Detail revalidation still owns reply capability.
    Bound item/preview/response size and pagination. Bind cursors to repository and snapshot version;
    a changed snapshot requires refresh, not an inconsistent merged page. Missing, corrupt, partial
    or truncated history remains visible as incomplete/unknown coverage. Counts name the same unit
    (unique conversations) and their complete scope; a partial page or unreadable source cannot claim
    an empty folder, zero asks, complete history or a verified global total. Keep loaded counts distinct.
    Add dedicated real-store index tests and an assembled-service test. Cover healthy and legacy
    source-only rows, exact native issue binding, a saved answer while the board flag remains open,
    archive while work runs, reopen, closed-origin preserved history, page changes, duplicate or
    conflicting source rows and absent, corrupt or oversized sources. Use new test files so this
    plan-only filing names forward proofs that discriminate the later implementation. Prove the
    repository-prefixed read through the assembled authenticated service, including foreign-scope
    refusal, bounded reads and no source fan-out or live fixture write.
  acceptance:
    - claim: the real Serve assembly calls the native index route
      proof: 'grep: buildEscalationConversationIndexRoute( in src/lib/serve.ts'
    - claim: the repository-scoped index is served through authenticated service reads
      proof: 'unit test: test/inbox/escalation-conversation-index-serving.test.ts'
    - claim: saved answers and agent follow-ups keep one thread with honest archive and reopen states
      proof: 'unit test: test/inbox/escalation-conversation-index.test.ts'
    - claim: incomplete or conflicting sources and pagination cannot fabricate complete folder counts
      proof: 'unit test: test/inbox/escalation-conversation-index-coverage.test.ts'
  falsifier: |
    Restore the open flag as Action required after a saved answer, archive on capture, substitute a
    foreign issue/thread, remove the actual mount, or count a partial page as the whole mailbox:
    named tests must fail. Keep control/mutant/restored receipts and verify served adoption separately.
