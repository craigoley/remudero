    Held until W1-T11096 and W1-T11103 are merged/served and current source custody is reconciled.
    A separate console consumer must pin this actual served index before mailbox/folder adoption.
    Existing proposal inbox, W1-T8887 execution and CONSOLE-T128 scope remain with their native owners.
