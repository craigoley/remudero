    - claim: "a reviewer line with no trailing clause leaves the parse result and the criterion outcome exactly as they are today"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
    - claim: "an affirmative reviewer line gains no clause and still defers to the deterministic floor"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
    - claim: "the semantic arm remains unable to raise a criterion the floor did not substantiate"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
    - claim: "an unparseable reviewer output still yields a defer-to-floor result for every criterion"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
    - claim: "the suppression condition keeps every one of its conjuncts, so a first review of a head is never suppressed"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
    - claim: "an overlong or multi-line clause is bounded before it reaches the reason rather than carried whole"
      proof: "unit test: test/downgrade-names-the-remedy.test.ts"
