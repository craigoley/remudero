  rationale: |
    OBSERVED 2026-11-12: `rmd next-task-id --branch <b>` exits 1 after a reservation that succeeded. Its output has a `RESERVED W1-T<n>` line. Callers that read the exit code think the reservation failed. The operator's wrapper `~/rmd-work/bin/reserve-id.sh` works around it: "Success is a RESERVED line, whatever the exit code: rmd can exit 1 on a degraded-but-completed reservation."
    READ at origin/main 12047b93a.
    - src/run-task.ts:17593 `nextTaskIdCommand`. The reserve path (:17770 to :17849) prints a RESERVED line for each held id (:17833). After the try block, :17850 is `return mint.degraded.length ? 1 : 0;`. So any degraded mint source gives exit 1, also when the id is held.
    - Only the open-PR surface stops a reservation (`openPrSurfaceOutage`, :17589, returns 2 before any claim). The other sources (shards, local-plan, remote-plan, reservations) degrade and the claim goes on. src/lib/task-id.ts:407 adds a `local-plan` degradation whenever the checkout's plan ceiling is below the reservation namespace. That is the normal state while ids are reserved and not yet filed, so most reservations exit 1.
    - The degraded notes go to stdout in the mint line (src/lib/task-id.ts:457, ` — DEGRADED: ...`).
    - src/lib/gate-gardener.ts:777 to :783 is a production caller. Without an injected minter it runs the verb with `execFileSync`, which throws on exit 1. The id is then held on origin, but `prepareGardenTaskIds` never records it, so no release path frees it.
  design: |
    1. In `nextTaskIdCommand`, when the reserve path held at least one id and no error was thrown, return 0, whatever `mint.degraded` holds.
    2. In the reserve path, write the degraded notes to stderr (one `### rmd next-task-id: DEGRADED <source>: <reason>` line each) and keep them out of the stdout mint line. Keep the print-only path's output and exit code as today.
    3. Keep exit 2 for every refusal: open-PR outage, push refused, contention past max-scan, and a partial --count.
    4. Check every reader of the verb's output (gate gardener, reserve-id wrappers, tests that match `DEGRADED`) and move a match on stdout DEGRADED text to stderr.
    5. test/mint-open-pr-surface-is-rest.test.ts asserts the old reserve output: a DEGRADED note on stdout and exit 1
       after a held id. Its degraded-shards test moves that note to stderr and expects exit 0.
    6. The new test imports src/run-task.ts, and the importer count of that file is at its limit (1010).
       test/a-green-pr-that-can-never-merge-asks-once.test.ts imports only terminalArmRefusal from it,
       which src/lib/tick-read-worker.ts defines. That test imports it from there, so the count stays at its limit.
    NO-INVARIANTS: the task changes the reserve path's exit code and moves its notes to stderr on purpose;
       criteria 3 and 4 pin the behavior that stays (refusal exit codes and the print-only output).
    NOT IN SCOPE: which sources count as degraded, the open-PR refusal, the --prefix path.
  falsifier: |
    Restore `return mint.degraded.length ? 1 : 0` for the reserve path and criteria 1 and 5 must fail. Print the notes on stdout and criterion 2 must fail. Return 0 after a refusal and criterion 3 must fail. Restore and require all five to pass.
  note: |
    Id reserved for run-unfiled-1794528010000 with ~/rmd-work/bin/reserve-id.sh. The fleet builds it.
    The test reaches the degraded path with an injected mint source that lags the reservation namespace; it calls `nextTaskIdCommand` in process, not through a child that imports src/run-task.ts.
