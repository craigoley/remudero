    risk:high — this is the concurrency guard that stands between the fleet and a double dispatch, and both
    directions of a wrong fix are severe: too weak leaves the double-run, too strong deadlocks a lock nobody
    can ever reclaim after a crash. It also spans four call sites in three files by necessity (the whole
    point is ONE primitive), which Rule 19 grades up rather than decomposed — splitting it per-lock would
    let one green third certify the other two.
    budget_usd 75 — above the recent 50-60 band because the deliverable is a FORCED-interleaving test with
    an injection seam, not a straight-line diff; the fix itself is small.
    verify:auto — every claim is a unit test over injected interleavings or a grep for the shared symbol.
    LATENT, NOT OBSERVED IN THE WILD: no incident is attached. It is filed at high anyway because the
    trigger (a crashed run leaving a stale lock, then two retriers) is the ordinary post-crash path, and
    because the failure is SILENT — there is no signal that would have told us it already happened.
