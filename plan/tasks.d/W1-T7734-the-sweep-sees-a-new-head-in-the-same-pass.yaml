      proof: 'grep: test("W1-T7734: a full pass that finds a moved head re-derives that PR from a fresh single-PR read in the same pass" in test/the-sweep-sees-a-new-head-in-the-same-pass.test.ts'
    - claim: "a re-derived post-review head is admitted to review in the same pass when the width allows"
