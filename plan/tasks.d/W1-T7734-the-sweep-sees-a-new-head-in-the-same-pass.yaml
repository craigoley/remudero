    - claim: "a failed single-PR re-read stands down and names the read error in its reason"
      proof: 'grep: test("W1-T7734: a failed single-PR re-read stands down naming the read error in its reason" in test/the-sweep-sees-a-new-head-in-the-same-pass.test.ts'
    - claim: "an idle daemon runs a light pass when eligible review demand exists, at a cadence derived from observed review duration and head churn"
      proof: 'grep: test("W1-T7734: an idle daemon runs a light pass when eligible review demand exists" in test/the-sweep-sees-a-new-head-in-the-same-pass.test.ts'
    - claim: "a disposed row records the snapshot's age at act time"
      proof: 'grep: test("W1-T7734: a disposed row records the snapshot age at act time" in test/the-sweep-sees-a-new-head-in-the-same-pass.test.ts'
  falsifier: |
    Leave the guard as a bare stand-down: the same-pass test finds `sweep.head_moved` and no second
    `sweep.disposed` row for the new head, and the admission test finds no `sweep.review_admitted` for it.
    Make the re-read's catch return the snapshot view: the failure test finds no read error in the reason.
    Keep `stopInterphaseReviewClock()` ahead of the idle sleep with no demand check: the idle test sees zero
    light passes while a post-review PR waits.
