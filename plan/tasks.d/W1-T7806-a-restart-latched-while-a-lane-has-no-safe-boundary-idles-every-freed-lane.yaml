  design: |
    Operator rulings: no hard thresholds (nothing below adds a fixed cap or constant), lean into automation.
    W1-T7697 design 3: a freed lane keeps refilling on the old code until the restart is actually ready.
    1. Replace the at-latch AGE cohort with a LIVE reading. When the restart latches, every lane then in flight is
       a holdout. A holdout stops holding the restart when it settles OR when it reaches a yield boundary since
       the latch (with a restart pending it yields there and settles as handed_off). While any holdout remains,
       a freed lane is not closed with "stale code"; it refills through the same gates as today. Delete
       `restartSlowLanes` / the `slowLane` test inside `latchRestart`, so the decision no longer depends on lane
       age or on whether run history exists.
    2. A refill admitted while the restart is latched is NOT a holdout and cannot renew the hold (the existing
       "new runs cannot renew it" property stays). It yields at its first safe boundary: the daemon makes the
       latched restart visible to that run's boundary check, so a refilled run reads the pending restart at
       `yieldAtWorkerBoundary` even if its own freshness read would not (one predicate, the latch, not two
       readings that can disagree). If boundary arrival needs a report from the run to the daemon to make the
       reading live, add it as a run option threaded from the daemon's runOne (src/run-task.ts), not a ledger
       scrape.
    3. Keep W1-T6274 for the common case: once no holdout remains (every lane in flight at the latch has settled
       or reached a boundary), refill closes as "stale code" and no new run starts. Keep the in-flight-read
       re-check in `conclude` reading the same predicate.
    4. Observability: `dispatch.lane_refilled` under a latch names the holdouts it waits on (today `waiting_on:
       [...restartSlowLanes]`), and `daemon.freshness_restart_waiting` marks which in-flight lanes are holdouts
       and which were admitted under the latch, so the restart's wait is attributable.
    Tests (new file, `test(` titles verbatim as in the proofs below), driving runDaemon with an injected runOne,
    checkFreshness and fake clock as test/a-dispatch-phase-is-not-held-by-its-slowest-lane.test.ts does:
    three lanes, measured mean 16 min; the restart latches at minute 5 while lane A (2 min old, inside its
    first worker) is in flight; lanes B and C free at minutes 6 and 8.
