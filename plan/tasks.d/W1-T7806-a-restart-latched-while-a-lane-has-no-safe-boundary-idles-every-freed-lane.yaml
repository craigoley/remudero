  rationale: |
    DEPENDENCY. Open PR #10741 (run-unfiled, "park a phase-bound lane until a sibling outlives the measured run
    length", head 3fb4aab41, NOT merged into origin/main d57884498 at filing) rewrites the same block of
    runDaemon: it splits refillLane into refillLane + decideRefill, adds phaseBoundHolds and parkedLanes, and wakes
    parked lanes after a restart latches. Build this task on a main that carries #10741; if #10741 is closed
    unmerged, build on main as it stands, since the defect below is the same in both trees.
    READ on origin/main d57884498 (src/lib/daemon.ts, inside runDaemon's dispatch phase):
      - `latchRestart` (:5441) records the restart and, ONLY on the first latch, copies every in-flight lane for
        which `slowLane(t)` holds (age past `refillBoundMs`, the measured mean run length, :5427) into
        `restartSlowLanes`. Its own comment: "Only the cohort that already delayed the restart grants refill; new
        runs cannot renew it."
      - `restartStillWaitingOnSlowLane` (:5440) is the only thing that keeps refill open under a latched
        restart. refillLane closes refill with "stale code" when it is false (:5463, :5474), the in-flight read
        re-checks it in `conclude` (:5509), and `actOnDispatchFreshness` closes it at latch time (:5568).
      - `slowLane` returns false whenever `measuredRefillBound` is false, so with no run history the cohort is
        always empty and a latched restart always closes refill.
    So the cohort is a snapshot of lane AGE at latch time. A lane younger than the mean when the restart latches
    is not in it, refill closes as "stale code" at once, and every lane that frees afterwards idles until that
    young lane settles, however long it then runs.
    WHY A YOUNG LANE CAN RUN FAR PAST THE MEAN WITHOUT YIELDING. A run yields to a pending restart only through
    `yieldAtWorkerBoundary` (src/run-task.ts:19427, W1-T7697), and every call site comes after a worker returns:
    "decision" :19701, "checkpoint" :19757 and :19776, "worker" before the pre-open gate :19805,
    "preopen_gate" :19811 and "worker" before PR open :19839. Nothing yields while the FIRST implement worker
    runs (the spawn in attemptImplement, :19453/:19466, driven by runDiagnoseThenRetry :19583). A lane inside its
    first worker is therefore unyieldable for as long as that worker lasts.
    OBSERVED 2026-10-10 (core daemon ledger, read from the fleet host read-only by the operator session): no
    run.start from 19:35Z to 20:33Z while W1-T7734 (run W1-T7734-1791660796008, worker.assignment 19:35:18Z) sat
    in its first implement worker, which hung in its own wait loop from ~19:47Z (W1-T7807, filed in the
    same PR). On that day the first idle stretch was the one-way "phase bound"
    closure that #10741 fixes. By the 20:01Z restart W1-T7734 was already past the measured mean (16.3 min from
    163 observed runs, per #10741), so it sat in the cohort. The residual this task closes is the same shape one
    step earlier: had the restart latched before W1-T7734 crossed the mean, the cohort would have been empty,
    refill would have closed as "stale code", and the freed lanes would have idled until W1-T7734 ended (the
    restart waited about 55 min on it).
    RELATED, already merged: W1-T7697 (yield at worker boundaries, adaptive refill bound, and this
