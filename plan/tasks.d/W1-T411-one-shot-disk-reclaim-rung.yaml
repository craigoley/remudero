  design: |
    ONE RUNG, THREE EXISTING SWEEPS, NO NEW PREDICATE. This is a CALL SITE change in the same sense
    W1-T406's is: it introduces no age arithmetic, no liveness probe and no destruction criterion of
    its own. Every reap decision stays inside the sweep that already owns it.

    (i) WHERE IT GOES, AND WHY THE POINT ALREADY EXISTS. `runTask` (src/run-task.ts) already calls
    `pruneStaleRuns` under a comment describing it as reclaiming debris from crashed prior runs,
    placed deliberately BEFORE the run adds its own worktree so leftovers cannot block it. That is
    the same moment, the same justification and the same failure posture these three want. Put the
    rung beside it. Every container start is the cadence, so the rung fires exactly as often as work
    happens and needs neither an operator nor a poll loop.

    (ii) NO NEW POLICY FLAG, AND THIS IS THE DELIBERATE DIVERGENCE FROM W1-T406. That task ships its
    reaper survey-only because `reapStaleWorktrees` has a measured destruction history and can
    destroy uncommitted work. These three have neither property: all three ALREADY RUN ARMED
    wherever they run today, each is guarded by a name prefix plus a 24h-class age ceiling, and the
    clone reaper additionally requires an open-file probe to come back clean. Calling an armed,
    unchanged predicate at a new TIME is not a new destruction criterion, and adding a flag that
    ships false would reproduce the dark-organ shape — a reaper that is wired but reclaims nothing.
    If the reviewer disagrees, the cheap answer is a flag defaulting TRUE, not one defaulting false.

    (iii) EACH SWEEP IS INDEPENDENTLY GUARDED AND MUST STAY THAT WAY. A throw inside any one of the
    three must not block the dispatch and must not prevent the other two from running. Follow
    `logCloneReapSurvey`'s shape: best-effort, its own try/catch, never rethrows. Three separate
    guards, not one wrapping all three — a single try means the first failure silently cancels the
    rest, which is the accumulation this task exists to stop.

    (iv) READ THE ROOTS THE SWEEPS THEMSELVES DEFINE, never a second notion of where things live.
    `cloneReapRoots()`, `tmpdir()` via the sweep's own default, and `workerHomeDir(config)`. The
    clone reap additionally reads `scratchReap` from policy, exactly as `logCloneReapSurvey` does;
    reuse that helper rather than opening a second read path to the same policy field.

    (v) ONE LEDGER LINE, SUMMARISING WHAT THE RUNG RECLAIMED. Follow the daemon's existing steps
    rather than inventing a shape. This line is NOT a decision input, so it must not be added to
    `DECISION_RELEVANT_LEDGER_STEPS` — nothing reads it to decide anything, and adding it would make
    every rotation carry it forever for no consumer.

    (vi) THE LEDGER IS UNTOUCHABLE, AND THE GUARDS THAT MAKE THAT TRUE ARE ALREADY PRESENT — verify
    them rather than adding new ones. `state/ledger.ndjson` and its gzipped rotations hold history
    that exists nowhere else; `rotateLedger` keeps only the newest entries per step in the live file
    and archives the remainder, so a large majority of the record survives only in those archives and
    deleting one destroys unique evidence. None of the three can reach them: `sweepStaleTempDirs`
    skips any entry not starting with the rmd prefix AND any entry that is not a directory;
    `sweepStaleWorkerHomes` scans the worker-home root's PARENT but skips any entry not starting with
    the worker-home prefix and any non-directory; `reapStaleClones` scans only the scratch roots and
    requires a standalone git clone of this repo. Ledger files fail every one of those tests twice
    over — wrong name, and a file rather than a directory. Assert it rather than asserting it is
    obvious.

    (vii) COORDINATE WITH W1-T406 RATHER THAN RACING IT. That task adds its own rung at this same
    call site and also edits `src/run-task.ts`. There is NO ordering dependency — this task needs
    none of its policy flag, none of its start-time liveness work, and touches neither
    `src/lib/worker.ts` nor `src/lib/policy.ts`. Whichever lands second folds into the first's rung
    rather than adding a second adjacent one. That is a merge obligation, not a `depends_on`.

    DELIBERATELY LEFT OUT, each with its reason, so a reader does not re-file them:
      - `sweepStaleInflightLocks` — BOUNDED (one small lock file per task id, measured in bytes) and
        its staleness test is already start-time aware through `isHolderStale`. Not a disk leak.
      - `sweepOrphanWorkers` — reclaims PROCESSES, not disk, and needs injected candidate/kill/
        run-active deps the dispatch path does not have. In a one-shot container the process tree
        dies with the container, so the leak it addresses does not exist there.
      - `sweepStaleWorkerScratch` — ALREADY on the one-shot path via `worktreeRemove`. Not a leak.
      - `reapStaleWorktrees` — W1-T406's subject, and its pid-liveness and destruction history make
        it a genuinely different mechanism. Bundling it here is the shape W1-T392 died of.
