    reaped by `reapWorkerHome` on a normal exit and left behind on every abnormal one). Two do not.
    `sweepStaleInflightLocks` reclaims at most one small lock file per task id — bounded by the id
    space and measured in bytes, not a disk leak. `sweepOrphanWorkers` reclaims PROCESSES rather
