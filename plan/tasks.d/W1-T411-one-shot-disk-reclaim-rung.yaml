  note: "risk:high IS RULE 19'S SPAN, NOT BLAST RADIUS, set up front rather than shipped as a
    violation. `subsystemsOf` counts two concerns here — the dispatcher gaining the call site and its
    suite — so risk:medium would fail sizing on the first lint. The blast radius is small and
    bounded: three already-armed, already-guarded sweeps run at a new time, and the worst failure is
    a caught exception plus a ledger line.
    ONE CONCERN, AND THE COUNT OF SWEEPS IS NOT THE COUNT OF MECHANISMS. All three are pure
    age-ceilinged filesystem scans with no pid test, no injected process deps, no ordering between
    them and no shared state. They differ only in which root they walk. Bundling them is ONE call
    site for ONE mechanism applied three times; the design lists four sweeps deliberately excluded
    precisely because each of those IS a different mechanism.
    NO depends_on, established rather than assumed — see design (vii). W1-T406 touches
    src/lib/worker.ts, src/lib/policy.ts and plan/policy.yaml, none of which appear here; the only
    overlap is src/run-task.ts and it is a merge obligation, not an ordering constraint.
    verify:auto — every criterion is decidable in-process with injected roots and injected sweep
    doubles. Nothing spawned, no network, no operator present.
    files: declares the suite because a proof naming a path outside files: is a proof-scope warning
    at filing and a scope-guard REFUSAL after the work is done. It does NOT declare plan/policy.yaml
    or src/lib/policy.ts, and that omission is the point of design (ii).
    budget_usd 55, below W1-T406's 60: no new predicate, no policy pair, no start-time liveness work
    — three call sites and their guards.
    RE-DERIVE THE REACHABILITY BEFORE ACTING. Every call-site claim here was resolved at 60cdb5b by
    walking each file and attributing each hit to its enclosing function; a first attempt using a
    `src/**/*.ts` pathspec silently dropped `src/run-task.ts`, which sits one level up, and reported
    several sweeps as having no invocation at all. If a later reader re-runs that check, assert the
    file index contains src/run-task.ts before believing any negative result."
