- id: W1-T411
  title: "three UNBOUNDED disk leaks have call sites only inside daemonCommand, so a one-shot container reclaims none of them: give stale temp dirs, per-spawn worker homes and abandoned review clones the same start-of-run rung pruneStaleRuns already occupies"
