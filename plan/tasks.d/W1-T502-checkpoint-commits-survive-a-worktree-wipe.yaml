    avoided as a home because CLAUDE.md records it intermittently zeroing coverage at file level.

    PROOF NOTES: three name-filtered titles, each verified at cfaa6b5 to match ZERO test files
    today (`grep -rlF` over test/, control title matching exactly one) — the legitimate forward
