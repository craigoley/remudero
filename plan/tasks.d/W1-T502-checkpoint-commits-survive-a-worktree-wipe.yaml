    (src/lib/task-linter.ts) blocks at >=2 subsystems below that band — the band is Rule 19's SPAN,
    not blast radius: this is prompt text plus its falsifiers, zero behavioral surface. budget_usd
    40 — contract lines, one stale-claim correction, and render-level tests.

    `files:` IS TWO PATHS AND BOTH WILL BE TOUCHED. The contract text lives in
    src/lib/compaction.ts BY THAT MODULE'S OWN DESIGN — its header explains the shared-constant
    rationale (one literal, rendered by both the turn-0 prompt and the post-compaction anchor, so
    the two can never drift). src/run-task.ts is DELIBERATELY NOT DECLARED and that is a
    measurement, not an avoidance: `outputContractLines` and `commitMessageContractLines` are
