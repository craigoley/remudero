- id: W1-T4884
  title: "Retain verify-human Inbox history and require positive scoped resolution"
  repo: remudero
  depends_on: [W1-T4853]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 18.00
  risk: high
  origin: "operator Inbox gardener audit 2026-09-30; live core attention census found 24 stale verify-human asks for verify:auto tasks"
  note: "reservation hand-off: unknown -> file/inbox-gardener-stale-auto-20260930"
  plan_refs: [W1-T4738, W1-T4742, W1-T4853]
  files: [src/lib/inbox.ts, src/lib/inbox-responder.ts, test/a-released-human-ask-leaves-the-inbox.test.ts, test/operator-attention-census.test.ts]
  status: merged
  attempts: 0
  rationale: |
    A retained verify-human proposal can still be classified as a live operator decision
    after its current plan task is verify:auto and has no dispatch hold. The 2026-09-30
    live core census exposed 24 such rows. They are not evidence of 24 outstanding human
    judgments. The registry and thread must remain auditable; a read-side classification
    change is safer than deleting records or fabricating a release receipt.
  implementation_notes: |
    W1-T9284 (operator-authorized 2026-10-16) supersedes the original verify:auto-alone
    retirement rule with positive scoped resolution. The historical rationale and origin
    above are retained. A verification-mode change does not answer an unrelated human ask;
    current holds and untyped or changed-purpose asks stay visible. No historical source
    receipt, release, producer purpose or operator consent is fabricated as a migration.
  design: |
    Keep an unanswered verify-human ask visible when its task changes to verify:auto.
    A maintained producer-owned exact verification ask may become history only from its
    same-family explicit release with present task ownership, unchanged proposal purpose,
    no current hold and no restored-for-review lifecycle. Mechanical asks instead use
    W1-T9284's positive scoped terminal receipt and reversible journal. A missing or
    unavailable source never proves resolution. Preserve registry and thread history,
    expose source-qualified history for a proven release, and keep partial evidence and
    verified counts distinct. No machine approval or dispatch authority is introduced.
  acceptance:
    - claim: "verify:auto alone preserves an unanswered human ask and its registry history"
      proof: 'grep: test("W1-T4884: verify-auto alone preserves an unanswered human ask without erasing the registry" in test/a-released-human-ask-leaves-the-inbox.test.ts'
    - claim: "a held or unverified unanswered task ask remains visible without exact release evidence"
      proof: 'grep: an ID without producer purpose cannot borrow the exact release in test/a-released-human-ask-leaves-the-inbox.test.ts'
    - claim: "a positively released exact ask remains source-qualified history with honest partial counts"
      proof: 'grep: the exact typed release supplies authority in test/operator-attention-census.test.ts'
  falsifier: |
    Seed a normal producer-owned verify-human ask whose task is now verify:auto and an
    unanswered held or untyped human ask. Without an exact release both remain visible.
    An exact same-family release moves only the normal unchanged ask into history; a
    copied purpose, missing task or current hold remains visible. Registry and thread
    records stay intact and partial history is not a verified count. Reintroducing the
    old verify:auto-alone override must fail the unanswered-ask preservation fixture.
