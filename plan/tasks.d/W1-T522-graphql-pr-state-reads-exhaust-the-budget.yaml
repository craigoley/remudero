    respectively, both already served by an EXISTING tested mapping, and it leaves every other
    site alone with a table saying which could move later and which never can."
  design: |
    THE SHAPE: two call sites move to the existing REST mapping. No new mapping, no retry, no
    new ledger step, no cadence change.

    (i) `fetchPrLifecycle` (src/lib/review.ts) — THE ONE THAT IS ACTUALLY FAILING. It shells
    `gh pr view <prUrl> --json state`, upper-cases, and returns `{merged: state === "MERGED",
    closed: state === "CLOSED"}`. REST serves both fields directly: `.merged` is already a
    boolean and `.state === "closed"` is the closed test. Reuse `liveStateFromRest`
    (src/lib/open-prs-rest.ts) and derive the pair from its three-valued answer, so there is
    exactly one place where REST's two-valued state is composed with `merged`.

    THE TWO-VALUED FOLD IS BENIGN HERE AND FATAL THERE, and an implementer must not generalise
    from this site. At `fetchPrLifecycle` a naive `.state`-only swap would mislabel a MERGED PR
    as `closed`, and `decideReviewStatusPost` refuses on merged OR closed — so the bug would be
    invisible. At `terminalStateReason` (src/lib/sweep.ts) the same fold is not survivable:
    it treats ANY value other than the literal "OPEN" as terminal, so a lower-cased "open"
    makes `rmd fix` refuse every live PR. `prStateFromRest`'s own doc already states this and
    forbids simplifying it to `state.toUpperCase()`. Do not restate that reasoning as new; cite
    it and reuse the function.

    (ii) `ghLiveStateByNumber` (src/run-task.ts) — FOLDED IN, NOT FILED SEPARATELY. It is
    A BUDGET COST NOT A CORRECTNESS BUG: it returns GraphQL's three-valued `state` unchanged,
    so it is right today and merely expensive. A session claimed it was returning a wrong value
    and retracted that; do not re-derive the retracted claim. Its three call sites all pass a
    number and a repo, so the REST target is `repos/{owner}/{repo}/pulls/{number}` with no URL
    parsing at all.

    (iii) WHAT MUST NOT CHANGE. `LiveStateResult` is `{ok, state?}` and `ok: false` means an
    INDETERMINATE read — explicitly NOT `state: "UNKNOWN"`, which `terminalStateReason` treats
    as terminal. A conversion that collapses those two ships a silent behaviour change: every
    rate-limited read would start reading terminal and stand the fix rung down. `ghLiveState`
    already keeps them apart post-W1-T511; the new sites must too, and the suite must pin it.

    (iv) THE SITE TABLE, DERIVED NOT GUESSED, at 659fe5a with word boundaries. src/ carries 21
    `["pr","view",...]` sites and 7 `["pr","list",...]` sites against 25 `["api",...]` sites —
    28 versus 25, NOT the 108-versus-32 the brief carried. That figure came from a bare
    substring over all tracked files, which reads 124 versus 168 and REVERSES the imbalance.
    The word-boundary lesson reproduces exactly on the named example: `ghLiveState` bare = 11,
    word-boundary = 6, `ghLiveStateByNumber` = 5.

    field set                                  n   REST-able
    statusCheckRollup                          3   NO — CheckRun/StatusContext union
    state,statusCheckRollup                    1   NO — the rollup half blocks it
    body                                       4   yes — .body
    state                                      2   yes — .state + .merged (the two sites here)
    headRefName                                2   yes — .head.ref
    files                                      2   yes — /pulls/{n}/files
    state,mergeable,url                        1   yes — .mergeable may be null while computing
    number,url,state,title                     1   yes
    number,url,state,mergeCommit               1   yes — .merge_commit_sha
    headRefOid,headRefName,body,url,number     1   yes — .head.sha
    headRefOid,commits                         1   yes — needs a second call, /pulls/{n}/commits
    headRefName,body                           1   yes
    autoMergeRequest                           1   yes — .auto_merge
    pr list: number,url,state,headRefName      3   yes — already done by fetchOpenPrsRest
    pr list: number,url,state                  2   yes
    pr list: url                               1   yes
    pr list: title,body,headRefName            1   yes

    ONLY the four rollup-bearing rows are genuinely stuck on GraphQL. Everything else could
    move; this task moves two and the table is the record for whoever moves the next one.

    (v) TWO SHARDS NOT ONE — THE SPLIT IS RECOMMENDED AND THIS IS THE FIRST HALF. NOTHING READS
    THE REMAINING HEADER: `x-ratelimit` and `X-RateLimit` each match ZERO files under src/ and
    test/, against a positive control (`isGhRateLimitError`, 2 src files) and a negative
    control at 0. `GhCallPacer` exists but is REACTIVE SPACING, not a floor — it widens 1.5s to
    10s only AFTER a call is classified rate-limited, and it guards THREE sites
    (src/lib/status.ts twice, src/run-task.ts once) all of which are REST. The GraphQL sites
    that actually exhaust are unguarded entirely. A proactive floor — read the remaining
    budget, stand down above a threshold — is a real and probably larger task, and it belongs
    in its own shard because it shares a cause with this one and nothing else: different files,
    different falsifiers, and it must cover callers this conversion never touches.

    DO NOT PROPOSE A RETRY. The failure class is exhaustion; retrying against an exhausted
    budget deepens exactly what it reacts to, and the live sample above shows failed calls
    still increment `used`.

    AND DO NOT SWEEP LESS OFTEN WITHOUT COSTING IT. The cadence is what keeps time-to-review at
    a 7.3s median once a PR is reached. Today ran 1,731 `sweep.pass` rows against 916 on 08-13
    and 957 on 08-14 — the cadence roughly DOUBLED today and that deserves its own look, but
    the sweep's reads are REST, so slowing it would not return one GraphQL point.

    WHAT MUST NOT BE BUILT: a retry or backoff loop; a new ledger step (`daemon.tree_dirty` and
    `daemon.stale_code` already fire unconsumed, W1-T494/#1833); a second REST state mapping
    beside `prStateFromRest`; a change to the sweep cadence; any conversion of a
    rollup-bearing site; and the budget floor itself, which is the sibling shard.
