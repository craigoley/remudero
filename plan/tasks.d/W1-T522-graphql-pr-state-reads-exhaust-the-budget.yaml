    STILL INCREMENTS `used` (7,499 to 7,517 happened entirely at remaining 0), so an
    unthrottled fleet keeps paying for calls that return nothing.
    WHAT THIS TASK IS WORTH, STATED HONESTLY: it does not stop exhaustion. It takes the fleet's
    review-posting critical path OFF the budget that is exhausted, so the rung survives an
    exhaustion somebody else caused. That is the whole claim.
    NOT A REPEAT OF W1-T511's REFUSAL. That shard refused a bulk conversion because a wrong
    field shape breaks the reviewer for every PR at once. This one does not re-argue that: it
