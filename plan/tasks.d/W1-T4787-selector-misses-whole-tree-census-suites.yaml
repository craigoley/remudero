      test/deps-interface-census.test.ts: floor and narrow, runs 36499053634 and 36503850915 (W1-T4735, W1-T4736, W1-T4740, W1-T4741)
      test/fast-gate-admits-the-census-class.test.ts: narrow, runs 36495528731 and 36497528005 (W1-T4733, W1-T4734)
      test/cycle-ratchet.test.ts: narrow, run 36506282002 (W1-T4737)
      test/a-gate-run-leaves-the-tracked-tree-clean.test.ts: narrow, run 36525454210 (W1-T4754)
      test/source-size-baseline-is-enforced.test.ts: narrow, run 36525454210 (W1-T4755)
    Those nine shards are withdrawn as duplicates of this one. Teach the census selection to
    recognise a suite that enumerates the tree through a helper rather than naming these files;
    each run's changed paths are in the withdrawn shards' notes. Later misses of these suites are
    ledgered by the gardener as selector-shadow.miss_evidence rows.
