    CONTRACT RECONCILIATION 2026-10-18, source 350a59d4dc273c65628bbb95be9d1416b6c678c2:
    The original design below could not safely be implemented as an indefinite synchronous wait. Since W1-T9443,
    pruneOrphanedDraftsAsync holds this same lock across awaited reads. updateProposalRegistry's default sleep is
    execFileSync("sleep", ...): a sync contender in that process prevents its async holder from releasing the lock.
    The same starvation prevents a timer-based cancellation from running. Pid liveness does not imply progress.
    A bounded real-default reproduction at private evidence commit 9e5161793b6aac89e03fb72cf90ed5493add9b47
    exercises a real prune holder and a synchronous contender with an explicit 80ms deadline: the holder's ready
    release and cancellation callbacks cannot run until the contender throws. The asynchronous contender control
    lets the same real holder release and completes. Two tests, zero failures, 256 MiB admitted low-footprint
    scratch; this proves the contract hazard, not a production fix or full hosted qualification. Scratch was removed.
    Node documents that execFileSync blocks the event loop: https://nodejs.org/api/child_process.html#synchronous-process-creation.
    Today's actual retro failed at 10:54:51Z waiting for the parent daemon's live registry lock, not from OOM.
    Its current retry backoff and cadence remain authoritative. The separate publication-before-acknowledgement
    repair is PR #12799; coordinate with that bridge rather than reintroducing an early harvest acknowledgement.
