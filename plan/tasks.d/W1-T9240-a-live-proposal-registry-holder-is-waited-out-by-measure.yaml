  design: |
    1. PRESERVE THE LOCK AND SINGLE WRITER. Reuse the existing async acquisition and identity-checked dead-holder
       reclamation, and share the existing locked read/modify/atomic-write body. Add an asynchronous registry update
       entry point, not a second registry, parser or unsynchronised writer. Never steal a live lock or treat age as
       proof of death. Existing synchronous callers retain a bounded compatibility path; do not remove its deadline.
    2. WAIT WITHOUT STARVING THE HOLDER. The async entry point awaits between attempts. A same-process async holder
       must be able to finish while a contender waits. A synchronous call that detects its own live process holding
       the lock refuses with a typed retryable busy outcome rather than polling indefinitely. Do not convert that
       refusal to success or silently discard the update.
    3. REAL DEADLINE AND CANCELLATION. An async caller must supply a finite caller-owned wait budget or an owned
       cancellation signal with a terminal lifecycle; an unbounded, uncancellable pairing refuses before polling.
       Cancellation/deadline expiry must run while waiting, leave the holder's lock untouched, and prevent the update
       callback from running. A canceled/expired waiter must never acquire later or acknowledge unpublished findings.
       Derive the retro caller's budget from its real attempt lifetime, not a guessed larger version of 2000ms.
    4. OBSERVABILITY IS NOT LIVENESS. Preserve the measured-hold sidecar as bounded evidence (one small record, no
       history accumulation); crossing its observed hold range emits one proposal_registry.lock_wait_long row per
       waited lock identity. A long-wait, busy, cancellation or deadline row names the actual holder and decision.
       No reading of that sidecar may authorize lock deletion or extend the caller's deadline. Missing/unreadable
       measurements are explicit, not fabricated zero-duration holds.
    5. REACH THE FAILED CALLER. Thread the async writer through retro follow-up publication and await it at the real
       command site, composing with #12799's publish-before-acknowledge bridge. Only a successful publication flushes
       harvest/remeasurement acknowledgements; cancellation and acquisition failure keep the source retryable.
       Do not migrate unrelated writers in this PR or change retry cadence, the retro marker, spend, caps or policy.
    Tests go in test/a-live-proposal-registry-holder-is-waited-out-by-measure.test.ts. Include the real default async
    acquisition/sleep and a real filesystem holder; fake-clock-only liveness tests cannot establish event-loop
    progress. Test dead-holder reclamation, explicit deadlines, cancellation, same-process progress and publication
    failure with the real writer. Keep every existing atomicity and identity-race suite passing.
