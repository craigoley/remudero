    READ on origin/main 6732a7690 (symbols, not lines), src/lib/inbox.ts:
      - `updateProposalRegistry` sets `const maxWaitMs = opts.maxWaitMs ?? 2000`. Its doc comment justifies the number:
        "every critical section takes microseconds, so a lock held after 2s means a crashed holder, not contention".
      - That premise no longer holds. Since W1-T2490 the section calls `readProposalShards` (every shard file), parses
        the blob, runs the caller's `update`, writes one shard file per new or sharded proposal and rewrites the whole
