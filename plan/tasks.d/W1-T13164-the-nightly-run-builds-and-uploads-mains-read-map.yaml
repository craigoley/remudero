  rationale: |
    This is the workflow half of W1-T12505 ("the author preflight reads main's read map"), cut out on 2026-11-16 so the fleet can build the rest. The daemon never dispatches a task whose `files:` names a path under .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a workflow file), so W1-T12505, at priority 1.3, waited for an operator build that nothing announced. Its script, selector and author-entry work needs no workflow edit. This record is the part that does, and an operator session hand-builds it.

    WHY IT MATTERS. W1-T12505 teaches scripts/preflight-author.mjs to fetch the newest `read-map` artifact of a successful coverage-nightly run on main, and to narrow a deploy/ or json change to the suites that read it. No workflow produces that artifact. Until one does, every such fetch ends in the named `mapProblem` and the author run is the full suite, as today: W1-T12505's rationale counts 22 full-fallback author runs in about four days, 15 of them for a deploy/ path with "no read map supplied".

    READ at origin/main ef8b74910f:
    - .github/workflows/coverage-nightly.yml has three jobs, `shards` (:39), `merge` (:127) and `notify` (:243). `git grep -n -e 'read-map'` finds no line in it.
    - Its `merge` job already builds and uploads a map of the same kind for the impact arm: :206 `if npm ci && timeout 10m node --import tsx scripts/coverage-merge-ratchet.mjs --impact-map test-impact-map.json \`, with the artifact named at :221 `name: test-impact-map` (W1-T6107). The read map follows that shape.
    - The recording hook exists: test/setup/read-map.ts writes one record per suite when RMD_READ_MAP_DIR is set, and `readReadRecords` (src/lib/affected-suites.ts:182) and `buildReadMap` (:159) merge them (W1-T6084). scripts/build-read-map.mjs, which calls them, does not exist yet: W1-T12505 adds it, which is why this task depends on it.
  design: |
    BUILD ORDER: build after W1-T12505 is merged (its pull request's merge state, not the shard's `status:`), and confirm two things on main first: scripts/build-read-map.mjs exists, and `INSTRUMENT_SURFACE_EXCLUSIONS` in src/lib/review.ts names it (W1-T12505 step 7). test/instrument-surface-completeness.test.ts asks for that entry the moment a workflow names the script. If the entry is missing, stop and amend `files:`: do not add src/lib/review.ts to this diff unannounced.

    In coverage-nightly.yml, after the merge job (moved from W1-T12505 step 2):
    - a `read-map-shards` job runs ci.yml's eight shards (`--select-all --shard n/8`) without coverage, with RMD_READ_MAP_DIR and RMD_READ_MAP_ROOT set (the existing hook, test/setup/read-map.ts, loaded by test/setup/tmp-hygiene.ts). A shard whose suite exits non-zero uploads no records, so its suites are absent from the map and the selector picks them for every read-mapped change.
    - a `read-map` job downloads the records, builds the map with scripts/build-read-map.mjs within a 5-minute bound and uploads `read-map` (retention 14 days, if-no-files-found: ignore).
    - Both jobs are continue-on-error; a failed or late build is reported in the step summary. The `shards`, `merge` and `notify` jobs do not change.

    THE SUITE, test/ci/the-nightly-run-builds-and-uploads-mains-read-map.test.ts (the folder `rmd test-place` computes). It parses the workflow with the `yaml` package and RUNS the new steps' `run:` bodies under `bash -e` with stand-in executables first on PATH, the way test/main-builds-the-test-impact-map-the-shadow-arm-reads.test.ts drives the merge job's steps. Root through `#test/helpers/repo-root.js`, fixtures through `#test/helpers/owned-fixture-dir.js`.
    - criterion 1: `read-map-shards` is a matrix of eight shards whose test step sets RMD_READ_MAP_DIR and RMD_READ_MAP_ROOT and carries no coverage flag (`--experimental-test-coverage`, NODE_V8_COVERAGE); `read-map` needs it, runs scripts/build-read-map.mjs with the tested commit's sha, and uploads an artifact named `read-map`.
    - criterion 2: run the shard's test step with a stand-in suite that exits non-zero and show the records upload does not follow it (its condition, or the directory it would upload, is empty); run the build step with a stand-in for scripts/build-read-map.mjs that fails, and with a stand-in `timeout` that reports the bound passed, and show each time that no map file is left to upload and the step summary names what happened. The upload sets `if-no-files-found: ignore`.
    - criterion 3: both new jobs set `continue-on-error: true`, and the `needs` of `shards`, `merge` and `notify` name neither.
    INVARIANT the-floor-run-does-not-wait-on-the-read-map: no outcome of the two read-map jobs (red shard, failed build, late build, no artifact) changes whether the floor run, its ratchet or the notify job runs or what they conclude.
    NOT IN SCOPE: scripts/build-read-map.mjs, the author preflight's fetch and the selector (W1-T12505); ci.yml's selection; recording child processes' reads (W1-T12536).
  falsifier: |
    Moved from W1-T12505: fail the nightly job on a build error (drop `continue-on-error` from the `read-map` job) and criterion 3 must fail. Added here: upload the records of a shard whose suite exited non-zero and criterion 2 must fail; run a shard under the coverage flags and criterion 1 must fail; make `notify` need `read-map` and criterion 3 must fail.
    GUARD that held at base and must still hold: the suites that already read this workflow (test/the-instrumented-suite-runs-nightly-on-main.test.ts, test/main-builds-the-test-impact-map-the-shadow-arm-reads.test.ts, test/a-red-coverage-nightly-run-raises-a-needs-human-issue.test.ts, test/ci/coverage/nightly-artifact-chunks.test.ts and test/ci/coverage/the-live-coverage-flip-requires-a-fresh-nightly-floor.test.ts). Restore and require every criterion and the guard to pass.
