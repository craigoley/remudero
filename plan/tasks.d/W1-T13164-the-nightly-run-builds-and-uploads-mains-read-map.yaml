    The test folder is the one `rmd test-place` computed on 2026-11-16 (test/ci/, ci-parity, high) for a stub that parses the workflow, imports test/helpers/repo-root.ts and test/helpers/owned-fixture-dir.ts, and runs step bodies under bash. A first stub that only parsed the workflow and ran nothing computed test/rules/, which the lint rule new-shard-rule-suite refuses without a PRECHECK_PARITY row; criterion 2 needs the steps run, so the second stub is the suite this design describes. If the built suite ends up running no step, it is a rule suite and this record must be amended, not the suite moved.
    Why the script is not here: the fleet can build and test scripts/build-read-map.mjs with no workflow, so it stayed in W1-T12505 with its exclusion, and this diff is a workflow and its suite. READ 2026-11-16 with `detectInstrumentEntanglement` (src/lib/review.ts, file list only, no diff): this workflow with its suite reads not entangled; the same list with src/lib/review.ts added reads entangled. A workflow diff rides alone (W1-T297).
    The first scheduled run after the merge is the evidence that the jobs work on a runner: the operator session that merges this reads that run and records, on the pull request, whether it uploaded a `read-map` artifact and how long the eight shards took.
