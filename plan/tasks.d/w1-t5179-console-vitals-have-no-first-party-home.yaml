  note: "reservation hand-off: plan-console-audit-core-1790887256000 -> plan-console-audit-core-1790887256000 When this merges, file ONE console shard pinned to the merged route and payload (the console's app/_components/console-web-vitals.tsx already computes route_group and the metric; it adds a first-party send beside the GA one)."
  plan_refs: [W1-T4611]
