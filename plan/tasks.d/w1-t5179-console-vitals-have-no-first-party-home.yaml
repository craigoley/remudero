  # operator ruling 2026-10-02: retire W1-T5179 — the console's existing GA4 path covers it. Its
  #   console_web_vital events (route group only, consent-gated) are live; on 2026-10-02 the GA4 property
  #   "Remudero Console" registered route_group / metric_name / metric_rating as event dimensions and
  #   metric_value as a custom metric. Per route group, a share of "good" >= 75% is the same pass/fail as p75.
  #   Not carried over, by decision: a core-side read to gate a change on vitals. File it if a gate needs it.
  attempts: 0
  rationale: |
    OBSERVED 2026-10-01: remudero-console app/_components/console-web-vitals.tsx sends LCP/INP/CLS/FCP/TTFB only via
    gtag, only when the GA consent key is "granted", and only as a route group (never a repository, query or task).
    Nothing first-party stores them, so Core Web Vitals cannot be read per route, trended, or used to judge a
    console change; a browser audit of a backgrounded tab cannot measure paint metrics at all. The console is the
    operator's own instrument, so a first-party, route-group-only vitals record carries no third-party exposure.
  design: |
    A write-scoped POST route (same token class as the fleet-control writes) accepts a small batch of
    {metric, value, rating, routeGroup, navigationType}, validates names, ranges and route groups against an allow
    list, and appends one ledger row per metric (console.web_vital). Ingest is paced per source so a burst
    coalesces. A read route returns p75 per (route group, metric) over a trailing window, with sample counts. No
    user, repository, query or URL ever enters a row.
  acceptance:
    - claim: "a vital is ingested as a route-group-only ledger row"
      proof: 'grep: test("W1-T5179: a vital is ingested as a route-group-only ledger row" in test/console-vitals-are-ingested-by-route-group.test.ts'
    - claim: "the read returns p75 per route group and metric with its sample count"
      proof: 'grep: test("W1-T5179: the read returns p75 per route group and metric with its sample count" in test/console-vitals-are-ingested-by-route-group.test.ts'
    - claim: "a payload carrying a repository or URL is refused"
      proof: 'grep: test("W1-T5179: a payload carrying a repository or URL is refused" in test/console-vitals-are-ingested-by-route-group.test.ts'
    - claim: "serve routes the vitals ingest"
      proof: 'grep: ingestConsoleVitals( in src/lib/serve.ts'
  falsifier: |
    Drop the allow-list check and the third test sees a URL stored in the ledger.
