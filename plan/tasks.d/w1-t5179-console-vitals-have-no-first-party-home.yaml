- id: W1-T5179
  title: "THE CONSOLE'S CORE WEB VITALS LEAVE ONLY FOR GOOGLE ANALYTICS, AND ONLY WITH CONSENT — there is no first-party LCP/INP/CLS history to gate a change on; give core a route-group-only vitals ingest into the ledger and a p75 read per route group"
  repo: remudero
