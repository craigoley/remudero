    Rule 19's SPAN, not blast radius; the behavioral containment is the empty-window no-op
    direction. Rule 25: touches src/run-task.ts (instrument-adjacent) with nothing else
    entangled. budget_usd 90 — five reader integrations, docket renderer, the scheduled
    rung, the inbox-proposal filing leg, two-direction fixtures. PROOF NOTES:
    `buildFeedbackDocket` is 0 hits across src/ AND plan/ at the branch tree apart from
    this shard's own declarations (measured, case-sensitive); the open-paren form greps the
    CONSUMER (src/run-task.ts), distinct from the defining module, per the call-site lint;
    unit-test proof is the pure-path form against a declared file. LEDGER: UNMEASURED (mini
