  note: |
    risk:high is Rule 19's SPAN (src/lib + src/ + test/, the W1-T310 grade), and here the blast radius
    argues UP too: `collectWorkerResult` is the reduce loop EVERY worker and brain-plane call passes
    through, so a throw introduced in that loop takes the whole fleet down. Hence the design's
    best-effort, never-fatal contract for both the observer and the tail write.
    budget_usd 110 — the derivation is small; the cost is the fixture stream matrix (text / tool_use /
    silence / synthetic result-only), the exit-retention path, and re-deriving the spawn call sites
    from source rather than assuming one.
    THE TEST PATH IS DECLARED IN files: (W1-T310) — every proof above names a declared path, so the
    scope guard cannot refuse this run after the work is done. If the exit-retention edit turns out to
    need the reaper module, DECLARE IT and drop any declared path left untouched
    (inverseScopeUntouchedFiles fails a declared-but-untouched path exactly as scopeViolationFiles
    fails an undeclared one).
