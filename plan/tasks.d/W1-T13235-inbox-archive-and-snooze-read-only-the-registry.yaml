  rationale: |
    WHY: after W1-T13188 a write classifies only its own proposal, but it still loads the plan, projects it and reads the
    live ledger first. MEASURED in serve.demand on 2026-11-16 after the deploy: /v1/inbox/snooze max 11,002 ms (18:50:45Z
    window) and /v1/inbox/archive 2,913 ms (18:45:43Z), with a stall profile at 18:46:22Z (11.0 s) whose frames are
    classifyAllProposals under inbox-verdict-command.ts. Before W1-T13187/13188 one Decline took 887 s.
    READ at origin/main, src/lib/panel-graph.ts buildInboxVerbActions: archive and snooze use only `proposals` from
    classifyAllProposals (an existence check), then write state/inbox-triage.json and one ledger row.
  design: |
    INVARIANT decisions-keep-their-classification: only archive and snooze change.
    1. Add a small helper inboxRegistryHas(deps, id): parseProposalRegistry(readFileIfExists(inboxInputPaths(deps).registryPath))
       .some((p) => p.id === id).
    2. archive and snooze call it instead of classifyAllProposals. Everything after the check is unchanged.
    3. Tests in the new file, built like test/the-operator-can-archive-or-snooze-an-inbox-item.test.ts. W1-T13188's test
       expects archive and snooze to classify one proposal; update it to expect none for those two routes.
  falsifier: |
    Keep classifyAllProposals in archive or snooze: criterion 1 fails (the plan is read). Read a different registry path:
    criterion 2 fails. Route decline through the registry check: criterion 3 fails.
  note: |
