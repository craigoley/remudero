  note: |
    OPERATOR RULING 2026-09-15: "instead of calling it openweight ladder, let's call it something
    like non-subscription model ladder."

    THE NAME IS ALREADY WRONG IN THE TREE, and that is the argument. PR #5610 proposes leading
    this ladder with `gpt-5-nano`, which is a PROPRIETARY OpenAI model -- not open-weight at all.
    It belongs on the ladder anyway, because what the ladder actually selects is "a deployment
    billed per token against dailyCapUsd, outside the Claude and Codex subscriptions". A reader
    who trusts the key name must conclude either that gpt-5-nano is open-weight or that it does
    not belong -- both wrong, and the second one is a decision NOT to save money.

    THE REST OF THE CODE ALREADY USES THE RIGHT VOCABULARY, which is why `cash` is proposed
    rather than a newly invented word: src/lib/config.ts refuses with "cash-billed runs must be
    hard-capped"; worker-provider.ts documents "Attributable cash fields for the ledger. Money,
    not prompts"; W1-T3575 shipped as "make dailyCapUsd a runtime hard cash cap".
    `metered` was CONSIDERED AND REJECTED: worker.ts already says "the run is metered against the
    subscription", so metered is ambiguous in exactly the distinction this rename exists to draw.

    THE CATEGORY DEFINITION IS PART OF THE DELIVERABLE, not just the identifier. A one-paragraph
    statement of what qualifies a deployment for this ladder must land beside the block, so the
    next gpt-5-nano question is answered by a written rule instead of by a name.
  rationale: |
    THE FOUR DUPLICATE-SURFACE ADVISORIES ARE RULED, NOT IGNORED. This record declares a superset
    of W1-T3547, W1-T3567, W1-T3569 and W1-T3575 because the rename crosses every file the
    open-weight arc built. Three of those four cannot collide: W1-T3567 shipped in #5544 and
    W1-T3575 in #5599, so neither is dispatch-eligible, and W1-T3547 (the triage WebSearch bridge)
    is deliberately deferred until the routed lane has a measured verdict. The ONE live overlap is
    W1-T3569, and `depends_on: [W1-T3569]` orders it -- this task cannot dispatch until that route
    has merged. Narrowing `files:` would hide the overlap rather than rule on it.

    Cheap capacity only gets used if the routing table says plainly what it is for. A misnamed
    category silently narrows the candidate set to models that satisfy the NAME rather than the
    billing property the fleet actually cares about, which is the opposite of the subscription
    relief this whole arc exists to buy.
  design: |
    SEQUENCING IS PART OF THE TASK: this must land AFTER W1-T3569's route. Both edit
    `.remudero/mounts.yaml`, and delaying the measured trial to do a rename would trade money for
    tidiness.

    FIVE WIRE SURFACES CARRY THE ID AND EACH NEEDS A DEPRECATED ALIAS, because a live host is
    configured with the old spelling and a rename that refuses the running config takes the fleet
    down at the next boot:
      1. `WORKER_PROVIDER_IDS` (src/lib/config-schema.ts) -- canonical becomes the new id.
      2. `workerProviders.openweightEndpoint` (config-schema.ts) -- new field, old accepted.
      3. `OPENWEIGHT_API_KEY_ENV` (worker-provider.ts) -- new env name, old read as fallback.
         Both names must be declared in deploy/runtime-env-vars.sh for the whole deprecation
         window or a recycle refuses (W1-T3603).
      4. `capabilities.openweight` (.remudero/mounts.yaml) -- ladder key.
      5. `provider:` on a mount row -- accepted under either spelling.
    NORMALISE AT THE READ BOUNDARY, ONCE, never by sprinkling `|| "openweight"` at call sites:
    one function maps a read spelling to the canonical id, and everything downstream sees only the
    canonical one. The ~28 internal `OPENWEIGHT_*` / `OpenWeight*` symbols are a mechanical rename
    with no compatibility burden and must NOT be given aliases.

    THE ALIAS IS A DEPRECATION, NOT A PERMANENT FORK: it must be dated in a comment naming the
    condition for removal (the live host's config no longer carrying the old spelling), or the
    fork becomes the new steady state.
  acceptance:
    - claim: "a host config written with the old provider spelling still loads, and resolves to the canonical non-subscription id"
      proof: "unit test: a legacy openweight config spelling still resolves to the cash provider"
    - claim: "the ladder documents the billing property that admits a deployment, so a proprietary pay-per-token model is admissible by a written rule rather than by its name"
      proof: "grep: non-subscription in .remudero/mounts.yaml"
  falsifier: |
    Delete the alias normaliser and the legacy-config test must fail to load a config the live
    host is currently running. Delete the category paragraph from the mounts block and the grep
    proof must read zero. If the legacy test passes with the normaliser removed, it is not
    exercising the read boundary and the task is unmet.
