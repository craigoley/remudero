  falsifier: |
    Allow a child to write outside its parent, accept a handoff without recipient scope, let a board
    entry authorize execution or completion, retain unbounded content, or map stale/unavailable
    coordination to healthy truth. The corresponding proof must fail.
  note: "This is structured sibling-run coordination, not chat or global memory. reservation hand-off: run-W1-T3956-17899977143N -> run-W1-T3956-1789997714300"
