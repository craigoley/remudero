  status: queued
  attempts: 0
  rationale: |
    Kilo Swarm gives child sessions a shared board for findings and handoffs, while Agent Manager
    makes sibling sessions and their isolated worktrees visible together. RMD already dispatches
    parallel lanes and records operator activity, learning transport, and human handoff, but a lane
    cannot currently publish a small, typed finding for its siblings without either burying it in a
    worker transcript or prematurely promoting it into durable global memory.

    The useful parallel is not an agent chat room. It is a short-lived coordination artifact that
    lets one lane say "this constraint is observed", "this path is blocked", or "take this handoff"
    while the parent flow remains the authority. That should shorten duplicate investigation and
    improve automated flow without allowing one worker to widen another worker's grants or turn an
    unverified suggestion into a system fact.

    Kilo's official Swarm description is the inspiration:
    https://blog.kilo.ai/p/swarm. RMD should keep its own stronger provenance, freshness, redaction,
    and human-control boundaries.
  design: |
    Add a versioned `coordination-board-v1` projection scoped to one parent flow, repository, and
    bounded run window. A child may append only typed entries: `finding`, `constraint`, `handoff`,
    `blocked`, or `done`. Each entry carries author/session identity, parent run, target lane when
    relevant, created/observed time, freshness/expiry, confidence, evidence reference, and a bounded
    redacted summary. The board is append-only; corrections supersede an entry with a new linked
    record rather than editing history.

    Enforce parent scope, recipient acceptance for handoffs, entry and byte caps, TTL, idempotency,
    and read-after-write provenance. Never copy raw prompts, credentials, transcripts, arbitrary
    model prose, or hidden browser state. A board entry informs selection or a human decision but
    never authorizes an action, changes a capability grant, marks a task complete, or replaces the
    authoritative ledger. If the board is unavailable or stale, sibling runs continue with an
    explicit unavailable signal and the operator can still inspect the parent activity projection.

    The contract should compose W1-T3852's workstream projection, W1-T3883's bounded delegation,
    W1-T3897's handoff semantics, and W1-T425's learning transport. It must not become a second
    global memory corpus or a hidden source of dispatch truth.
