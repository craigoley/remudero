  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/sweep-age-clamp.test.ts`, declared in `files:`, so on the filing PR it resolves
    through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    THE WHOLE RECON WAS READ-ONLY AND THAT WAS A CONSTRAINT, NOT A PREFERENCE. The suite,
    `clock-sweep` and every `runSweep` test were left unrun; the eleven closes are the operator's
    measurement and the source analysis is this shard's. Rationale (6) records exactly what reading
    could NOT settle rather than inferring it.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. The change sits in front of every sweep disposition
    against a live repository; a mistake either suppresses real staleness or leaves the closes
    reachable.

    BOTH `src/` FILES ARE DECLARED BECAUSE THE FIELD AND THE ARITHMETIC ARE APART: `OpenPrView` and
    the disposition rules live in `src/lib/sweep.ts`, and the two projection sites that populate
    `lastActivityAt` from `pr.updatedAt` live in `src/run-task.ts`. A clamp added without the
    creation field has nothing to clamp against.

    `scripts/clock-sweep.mjs` IS DELIBERATELY NOT DECLARED — design (iv) and (vi). It is a
    different failure mode with its own falsifier, and it is NOT instrument surface under
    `INSTRUMENT_SURFACE`, so the separation is a scoping choice rather than a Rule 25 obligation.

    ID PROVENANCE. `refs/rmd-id/W1-T1201` resolves to 10902f148a9970a18afdf979ab6a08c14b8a2739,
    read over git protocol; live control, `refs/rmd-id/W1-T999999` exits 2. THE ANCHOR MESSAGE WAS
    NOT JUDGED. Eight id surfaces plus a subject sweep across open-PR heads and trees, and every
