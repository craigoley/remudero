    The gateway allows `refs/heads/*` and refuses every other namespace. The build must mint the
    claim itself if it runs somewhere that can, and the `run-W1-T2810-<epochMs>` branch remains the
    other, independent visibility path (`projectPlan` attributes an open PR by `headRefName`, never
    by the claim), so in-flight work is still visible to dispatch without it.

    WHAT WAS OBSERVED IN SOURCE AT HEAD adcdc764, so the build does not re-derive it:
      - `preflightCommand` prints exactly two verdict lines (PASS / FAIL) and neither names a sha.
      - `PreflightSummary.headSha` already exists and is already populated by
        `readHeadShaForSummary()`, whose injectable-`exec`-appended-last shape and catch-arm
        rationale are the pattern the two new readers should copy.
      - `HostFacts` / `computeHostFacts` / `factsLine` in `src/lib/ci-parity.ts` are the sibling
        precedent, including the never-guess-a-zero rule stated in their own docs.
    WHAT WAS MEASURED IN THIS CHECKOUT:
      - `git rev-list --count HEAD..origin/main` = 0 at a current head; exit 128 with empty stdout
        against a missing ref.
      - a `git clone --depth 1` carries no `refs/remotes/origin/main` (only `HEAD`).
      - `origin/main` ref fetched 13:13:13Z vs its tip commit's date 13:10:19Z.
      - `os.loadavg()` = [0.69, 2.37, 2.29] on `os.cpus().length` = 4, taken moments after a heavy
        run was stopped.
    WHAT IS THE OPERATOR'S MEASUREMENT, NOT THIS FILING'S: the 465-commit-behind checkout and its
    "60965 bytes (cap 61046) OK" line, the three merges inside one ~40-minute gate run, and the
    two suites observed going red under a loaded gate.

    risk:high with band_meaning:span, DECLARED RATHER THAN DODGED: `subsystemsOf` counts
    `src/lib/ci-parity.ts` and `src/run-task.ts` as two concerns and both are genuinely needed —
    the readers and the renderer belong beside `HostFacts` in the first, the verdict line lives in
    the second. Moving the verdict line into the library to score one subsystem would be a refactor
    invented to satisfy a linter, and is refused. The test file's basename matches this shard's
    slug, so it is discounted as this task's own falsifier.

    ON THE PROOFS: criterion 1 is the pure-path `unit test:` form and earns the `not_yet_built`
    carve-out on this plan-only head — `judgeCriterion` requires `kind === "test"`, `!nameFiltered`,
    the path present in this shard's flow-style `files:`, and the file ABSENT at head; all four
    hold. The other four are `grep:` anchors into that same falsifier so each criterion
    discriminates independently on the build PR. No pattern contains `*`, `.`, `^`, `$` or `[`, and
    none contains the substring " in ", which `DIALECT_GREP_PATH_RE` would split on before reaching
    the real path.
