  note: |
    THE SEVEN RETIREMENTS ARE NOT THIS TASK'S WORK — they land in the pull request that files this
    record, which is plan-only. What is filed here is the part that does not exist yet: a check that
    stops the NEXT retired surface stranding its own tasks the same way.
  rationale: |
    MEASURED ON THE LIVE HOST 2026-09-16:

        RMD_CONSOLE_BUILD_ROOT   unset
        GET /console/            404
        apps/dashboard/          present on disk, with its own CI job, typecheck and
                                 contract-coverage ratchet running on every pull request

    remudero-site#36 retired the in-daemon console and forwards `/console` to app.remudero.com,
    which is the dedicated Next.js console in craigoley/remudero-console. `apps/dashboard` is a
    React app that no operator reaches.

    SEVEN TASKS STAYED POINTED AT IT, ALL risk:high, ALL queued and dispatch-eligible:

        W1-T153   console shell UX overhaul
        W1-T156   live-state UI + TRUST indicators
        W1-T157   FIND layer — fuzzy search, facets, cmd+K
        W1-T158   DETAIL + JOURNEY — task card, dep chain, run history
        W1-T159   GLANCE — summary strip + daemon-health widget
        W1-T3177  stand up apps/dashboard as React 19 + Vite
        W1-T3296  the apps/dashboard header consumes a phone screen

    THE COST IS NOT HYPOTHETICAL. W1-T159's own acceptance reads "the daemon-health widget shows
    last poll, a next-poll countdown, disk free, and rate-limit remaining". That surface was built
    independently on the dedicated console in remudero-console#44, by an operator session that did
    not know W1-T159 existed. The same feature, nearly twice, on two surfaces, one of which 404s.

    WHERE EACH SURVIVING IDEA WENT, so retirement drops nothing live:

        W1-T153   superseded — the dedicated console's board shipped as CONSOLE-T12
        W1-T156   the liveness half survives as CONSOLE-T14 (SSE, and a `live` claim the page can lose)
        W1-T157   NOT COVERED anywhere — re-filed as remudero-console CONSOLE-T17
        W1-T158   survives as CONSOLE-T16, the evidence surfaces
        W1-T159   SHIPPED on the dedicated console in remudero-console#44
        W1-T3177  the dedicated console IS the new stack, on Next.js, already serving app.remudero.com
        W1-T3296  the lesson carries (a header must not consume a phone screen, asserted at phone
                  width); the surface does not

    WHY A TEST AND NOT ONLY A SWEEP. Retiring these by hand fixes today and nothing else: the next
    surface this project retires will strand its own tasks the same way, and the only signal was an
    operator noticing the plan still talked about a console that had moved. A retired surface should
    not be able to hold a dispatchable task silently.

    W1-T1287's mechanism is what the sweep uses — `status: blocked` plus `retirement: retired`,
    which `unmetDependencies` then drops, so anything parked behind these unparks by mechanism
    rather than by a second edit.
  acceptance:
    - claim: "no dispatchable task declares a file under a surface that is unreachable, and the check names the surface rather than a list of ids"
      proof: "grep: function dispatchableTasksUnderUnreachableSurfaces in test/a-retired-surface-keeps-no-dispatchable-task.test.ts"
    - claim: "returning any one of the retired tasks to a dispatchable status is caught, so the check is load-bearing rather than a snapshot of today"
      proof: 'grep: test("a task returned to queued against an unreachable surface is caught" in test/a-retired-surface-keeps-no-dispatchable-task.test.ts'
  falsifier: |
    Return any one of the seven to `status: queued` and the first test must fail, naming that id and
    the unreachable surface. Point the check at an ids list instead of at the surface and it passes
    while the next retired surface strands its tasks unnoticed — which is the defect, not the fix.
