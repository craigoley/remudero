  rationale: |
    ── WHY THIS IS A PREREQUISITE AND NOT A NICETY ─────────────────────────────────────────────

    W1-T2564 CHANGED WHAT THE CAP BOUNDS, AND THAT IS THE WHOLE ARGUMENT. Before it, a refused draft
    wrote a `DraftAttemptCache` key and was never retried — the work was silently LOST (267 of 353
    proposals were retired that way, measured). After it, a refusal writes no key, stays due, and
    RETRIES ON THE NEXT POLL. That fix is correct and stays.

    ITS CONSEQUENCE IS THAT DURING A LIVE ACCOUNT OUTAGE `DAEMON_DRAFT_BATCH_CAP` (3) BECAME THE
    ONLY THING BOUNDING THAT RETRY — in precisely the condition that produced 494 refusals in seven
    hours. So raising the cap for recovery throughput would raise the storm ceiling with it. THE
    CAP MUST NOT BE RAISED UNTIL THIS LANDS; after it, raising it is a separate, safe decision.

    ── THE INSTANT IS ALREADY THERE AND NOTHING READS IT ───────────────────────────────────────

    `detectUsageLimitRefusal` (lib/classify.ts, W1-T2515) already recovers the reopen instant from
    the provider's OWN refusal text, and W1-T2564 already carries it out of the worker seam as
    `resetsAtMs` on the outcome and `usage_resets_at` on the ledger row. MEASURED against the real
    captured string: `2026-09-01T11:50:00.000Z` — the reset the API actually stated, and MORE
    ACCURATE than the headroom governor's own belief (`12:00:00.000Z`) at that same instant.

    So this task adds no new detector, no new probe, and no new source of truth. It reads a number
    the fleet already has and declines to spend against a window that number says is shut.

    ── ⚠ THE TWO WAYS THIS GOES WRONG, BOTH PINNED BY THEIR OWN TEST ──────────────────────────

    (a) AN ABSENT RESET MUST NOT DEFER AT ALL, and it is a common-enough case rather than a corner.
        `resetsAtMs` is present ONLY when the refusal stated a time AND that time carried an
        explicit UTC marker — a bare clock time in an unknown zone is deliberately never converted,
        because guessing the operator's zone would produce a confident wrong resume time. A
        deferral with no stated end is AN OUTAGE THAT NEVER ENDS. A zone-less refusal therefore
        falls through to today's behaviour: retry next poll, bounded by the cap.

    (b) DEFERRING TO THE EARLIER OF TWO STATED RESETS resumes into a door still shut for the other.
        Two refusals in one batch can name different instants when a retry crosses a window
        boundary, so the LATEST wins — the only choice that cannot under-wait.

    AND THE DEFERRAL IS SELF-LIMITING BY CONSTRUCTION, which is what makes it safe to write from an
    unattended rung: it is an INSTANT, not a duration or a latch. Past it the rung runs again with
    no operator action and no expiry sweep, so the W1-T1067 failure (a stranded marker suppressing a
    rung forever) has nothing to strand. A corrupt file fails soft to NO deferral for the same
    reason — the expensive failure direction is a rung wedged shut, not one poll of extra spend.

    ── PLACEMENT ──────────────────────────────────────────────────────────────────────────────

    The gate is checked FIRST — before W1-T2569's lock and before the registry is read — so a
    deferred poll costs nothing at all: no lock churn, no spawn, no Architect. It is ledgered with
    the remaining wait and the refusal that caused it, because a rung that goes quiet must be
    distinguishable from one that has stopped firing.

    NOT IN SCOPE: raising the cap (a separate decision this unblocks), the re-entrancy guard
    (W1-T2569, shipped), the attempt-key semantics (W1-T2564, shipped), and `detectUsageLimitRefusal`
    itself, which is reused verbatim rather than extended.

