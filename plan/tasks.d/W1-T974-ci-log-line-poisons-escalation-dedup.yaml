    NO ACTUALLY-SUPPRESSED ESCALATION HAS BEEN OBSERVED AND THE SHARD SAYS SO TWICE. Rationale (2)
    records what issue #1965 actually carries — 2 U+FEFF, 4 tabs, and none of the three line
    terminators — and rationale (7) states the accidental path is essentially unreachable. The
    correctness claim rests on a measurement constructed against the real exported
    `renderIssueBody`, not on an incident. A reader who cites this as a production failure has
    overstated it.

    PROOF NOTES. Four criteria use the name-filtered `unit test:` form rather than a whole-file
    path. Every title was measured against test/ with `grep -rlF` and matched ZERO files, against a
    control title lifted from the real escalate suite that matched one. Each is plain prose under
    100 characters with no comma, no semicolon-space and no regex metacharacter, so
