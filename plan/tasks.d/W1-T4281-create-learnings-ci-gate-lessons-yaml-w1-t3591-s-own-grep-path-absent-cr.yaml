    already resolves (the file now exists with this entry, landed a different way), this task is
    CONSUMED and should close without a diff rather than duplicate the entry or mint a second one for
    the same finding.

    AND THE FACT MUST NOT INVENT A ROOT CAUSE THIS SESSION DID NOT MEASURE. The coverage-shard (N/4)
    job has a documented history of reds that are infrastructure/timing flakes, not diff defects
    (W1-T3345 cancelled/hung shards, W1-T3194 an artifact-upload 403-while-finalizing race, W1-T3307 a
    day-cost clock-crossing bug, W1-T3599 a 2ms hedge/timeout margin race — all grep-confirmed against
    `coverage-shard` in `plan/tasks.d/`). A fact claiming "this gate fails because <specific mechanism>"
    where that mechanism is not evidenced by the 16 PRs this finding actually names must not ship;
    state the measured repeat-repair-file pattern and the known-flake caution, not a fabricated
    diagnosis.

    AND THE INDEX MUST BE REGENERATED BY THE SCRIPT, NEVER HAND-EDITED. `learnings/index.json` is
    machine-generated (`npm run learnings-index`); a hand-written index entry that happens to look
    right will diverge from a real regeneration, and `test/learnings-index.test.ts`'s freshness check
    (over the REAL committed corpus, the same one CI runs on every PR) will catch it.
