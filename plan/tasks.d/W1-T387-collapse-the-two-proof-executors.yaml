  note: "verify:auto — every claim is an assertion over two executors' agreement on fixture proofs,
    decidable in-process with no operator present.
    risk:high, and NOT because the diff is large. This changes what the verb every author trusts
    REPORTS. Get it wrong in the permissive direction and authors keep shipping capped proofs while
    believing the tool agrees with the reviewer — the exact defect being fixed, re-created with a
    louder claim to correctness behind it. Design (ii) and (iii) are where that risk is managed.
    budget_usd 90 — the cost is the survey of 66 proofs and the both-directions divergence inventory,
    not the one-line call. Above W1-T386's 70 on investigation depth.
    files: DECLARES src/lib/review.ts even though the collapse may end up read-only there — the
    diagnostics in design (i) may need `execWhitelistedProof` to expose what it observed rather than
    only a three-value verdict, and a path a worker writes must be declared. Also declares CLAUDE.md
    per design (vii), which is legal here precisely because this PR carries src/ already, and
    plan/claims.yaml per design (vi). Declaring plan/claims.yaml does NOT trip W1-T384's proposed
    filing-time refusal: that trigger is the literal entry plan/tasks.yaml, not any plan-scoped path.
    ON THE PROOFS. Three name test/check-proof-executor-parity.test.ts, which does not exist yet:
    that is a FORWARD REFERENCE TO A PATH, which CLAUDE.md records as safe (unlike forward-referencing
    a symbol name, which is a guess), and the path is declared in files: so the worker creates it. The
    fourth names an EXISTING file so at least one proof executes at filing time, and
    test/claims-check.test.ts is DECLARED because that proof names it — a proof pointing outside
    files: is a warning now and a scope-guard REFUSAL after the work is done.
    THE MEASUREMENTS ARE AT 946f281: 969 open-task parseable proofs (60 grep, 592 pure-path, 317
    name-filtered), of which 66 resolve to files and 251 to absent; and the fixHeadAcceptable proof
    reading exit 0 / hits 17 locally against no-match at review. Re-derive before acting — the
    population moves with every filing.
    NO depends_on: independent of W1-T386. They share only the ruling that filed them."
