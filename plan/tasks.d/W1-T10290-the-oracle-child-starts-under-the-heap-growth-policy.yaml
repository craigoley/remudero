    - claim: "the flag reaches the read-model worker thread through its data, not a module variable"
      proof: "unit test: W1-T10290: the read-model worker thread receives the children's heap flags in its data"
    - claim: "serve records its children's growth percent without changing its own heap flags"
      proof: "unit test: W1-T10290: serve sets its children's growth percent and leaves its own unchanged"
  falsifier: |
    At origin/main faefe0655 `oracleChildExecArgv` adds no growth flag, so the first test fails. Add a one-line
    `childHeapPolicyArgs()` call inside `oracleChildExecArgv` instead of design 1: in the worker thread it returns [],
    and the second test fails.
  note: |
