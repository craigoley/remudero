  rationale: |
    This is the workflow half of W1-T10751 ("the beat judges gc on the trees the fleet mounts"), cut out on 2026-11-16 so the fleet can build the rest. The daemon never dispatches a task whose `files:` names a path under .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a workflow file), so W1-T10751, filed 2026-10-26 at priority 2, waited three weeks for an operator build that nothing announced. Its beat work needs no workflow edit. This record is the part that does, and an operator session hand-builds it.

    WHAT W1-T10751 LEAVES FOR THIS TASK. After it, scripts/fleet-heartbeat.sh publishes one line per git store the running containers mount, with a verdict of `ok`, `first-seen`, `UNHEALTHY` or `unknown`. `UNHEALTHY` is the beat's own finding that a gc.log or a leftover lock was still there, unchanged, on a later beat. Nothing reads those lines. W1-T10751's rationale records what that silence cost on 2026-10-26: a gc.log in four daemon trees with 630 to 862 MB of loose objects each, and a managed repo holding 1.66 GB behind a crashed repack, while the beat published `gc_verdict=ok` and the watcher had no gc rule.

    READ at origin/main ef8b74910f:
    - .github/workflows/fleet-heartbeat-watch.yml does not contain the string `gc` in any case. Its judging loop extracts six verdicts, one sed line each (:323-328, for example `reaper_verdict=$(printf '%s\n' "$payload" | sed -n 's/^session_reaper_verdict=//p' | tail -n 1)`), and classifies one liveness kind per branch in a first-match `elif` chain. Delivery files one record per host, `--source "fleet-heartbeat:${branch}"` (:479), and resolves it at :474.
    - The workflow runs hourly and sees one beat: each beat is a force-pushed parentless commit, so the branch keeps no history. "Unhealthy across consecutive beats" is therefore carried by the beat's own verdict, never by a count the watcher keeps.
    - scripts/fleet-heartbeat.sh holds no `gc_tree_` line yet (:1449 still judges `${INSTALL_DIR}/.git/gc.log` alone).
    NOT A DUPLICATE OF W1-T13163 OR W1-T13177, which add other records to the same workflow: W1-T13163 (cut out of W1-T10756, filed the same day) raises a beat that runs stale code, from `beat_code_verdict`; W1-T13177 raises a spent restart budget, from `restart_verdict`; this one raises a git store that cannot gc, from the per-tree gc lines. Three payload fields, three sources, one shape.
    READ on origin's heartbeat-azure branch at b0adbc2db4 (2026-11-16T14:30:05Z, heartbeat.txt): `gc_verdict=ok`, `gc_disabled_reason=none`, and no per-tree line. A watcher built from this task today would read nothing, resolve the gc record on every run and look healthy. That is the reason for the build order below.
  design: |
    BUILD ORDER, checked before the first commit and stated in the PR body. Build this only when BOTH hold:
    - W1-T10751 is merged (its pull request's merge state, not the shard's `status:`);
    - a live beat shows the per-tree lines: `git fetch -q origin heartbeat-azure && git show FETCH_HEAD:heartbeat.txt | grep -n '^gc_tree_'` prints at least one line, on a beat newer than that merge.
    Then READ the merged scripts/fleet-heartbeat.sh and that live payload for the exact line shape. W1-T10751 gives `gc_tree_<n>=<host path> mounters=<names> verdict=<V> ...` as an example, not a contract. If it shipped another name or shape, amend this record's check command and wording first. Landing early would not raise a false record (a missing line raises nothing), but the arm would be written against lines that do not exist and would compare nothing.

    THE WATCHER RAISES A GC ISSUE OF ITS OWN (moved from W1-T10751 part (c)).
    - Extract the per-tree lines in the judging step. A host with any `UNHEALTHY` tree gets its own record, `--source "fleet-heartbeat:<branch>:gc"`, outside the liveness `elif` chain, so it neither masks nor is masked by BEAT_STALE, CRASH_LOOP and the rest.
    - Title: "fleet-heartbeat (<branch>): a git store cannot gc". The body names each unhealthy tree, its mounters, its persistent markers and its trend.
    - The first beat that reads every tree `ok`, `first-seen` or absent resolves that record. A beat that is `unknown` for a tree neither opens nor resolves it, and says so in the report.
    - `first-seen` alone never raises. That is the "consecutive heartbeats" rule, carried by the beat's own evidence and not by a count the watcher keeps.
    - Add the new arm to the workflow's self-check step: a fixture beat with a persistent leftover must read as gc-unhealthy, and a first sighting must not.

    THE SUITE, test/daemon/the-heartbeat-watcher-raises-a-git-store-that-cannot-gc.test.ts (the folder `rmd test-place` computes). Extract the judging, delivery and self-check steps from the committed workflow the way test/fleet-heartbeat.test.ts does (`watchStepScript`, `deliverStepScript`), and run them against payload fixtures with stand-ins for `gh` and `node scripts/needs-human-issue.mjs` that record their arguments. Import through `#test/*` and `#src/*`. Build the payload fixtures from lines copied out of a real beat of the merged script, not typed by hand.
    - criterion 1 (the test titled `W1-T13176: the watcher raises a gc issue for a tree unhealthy across consecutive beats`): a payload with an `UNHEALTHY` tree on `heartbeat-azure` raises `fleet-heartbeat:heartbeat-azure:gc`; a `first-seen` payload raises nothing; an all-ok payload resolves the record.
    - criterion 2: the same UNHEALTHY payload, otherwise healthy, leaves the liveness record `fleet-heartbeat:heartbeat-azure` resolved (a FRESH kind beside the gc record); a payload the chain raises as BEAT_STALE keeps that kind with ok, UNHEALTHY and unknown trees alike.
    - criterion 3: a payload with one `unknown` tree and no UNHEALTHY one produces neither a raise nor a resolve for the gc source, and the report line names the tree.
    - criterion 4: run the extracted self-check step as committed (it passes), then with the gc arm's predicate replaced by one that never raises and by one that raises on `first-seen` (it must fail both times).
    INVARIANT the-gc-record-stands-beside-liveness: the gc record and the liveness record of one host are two sources; neither a raise nor a resolve of one changes the other.
    NOT IN SCOPE: scripts/fleet-heartbeat.sh and what the beat judges (W1-T10751); the in-daemon maintenance controller and its own issue (W1-T10750); any existing liveness arm; running or scheduling any git maintenance.
