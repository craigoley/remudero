  falsifier: |
    If a later run of `rmd reap-branches` ever reports a branch in `hold` whose per-head PR state is
    `closed`, then `planBranchReap`'s ordering has changed and the brief's original mechanism is
    live after all — the closed arm would no longer be reached before the hold arm, and this
    record's leading correction would be wrong.

    SEPARATELY DECISIVE: if a deletion path appears in `src/` — any `push --delete`, `:refs/heads/`
    refspec or `deleteRef` call — then candidate B stops being "build the execute half" and becomes
    a gate on something real, and its pricing here is obsolete. And if the dispatch-blocking count
    ever reads above zero for a branch with NO open PR, the reporting gap has become a throttle and
    the question stops being a preference.
