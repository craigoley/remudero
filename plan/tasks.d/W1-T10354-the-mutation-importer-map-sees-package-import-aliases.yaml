    - claim: 'on the real tree every test that imports src through #src is in the importer map'
      proof: 'grep: test("W1-T10354: on the real tree every test that imports src through #src is in the importer map" in test/ci/gates/the-mutation-importer-map-sees-package-import-aliases.test.ts'
  falsifier: |
    At origin/main, deriveDirectImporters reads only RELATIVE_IMPORT_RE, so a `#src/lib/a.js`
    import yields no edge, a literal `import("../src/lib/a.js")` yields no edge, and fixture text
    `from "../src/lib/a.js"` inside a template string DOES yield one. --nightly-plan exits 0 on an
    unresolvable `#src/lib/missing.js`. Every new test fails at base. The real-tree test is
    load-bearing only if the code that reads package.json "imports" is deleted and it goes red,
    not just if its population is non-empty. It asserts that population is non-zero before it compares.
