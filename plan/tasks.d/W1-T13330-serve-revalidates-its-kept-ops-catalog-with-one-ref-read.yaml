- id: W1-T13330
  title: "Serve's ops-catalog refresh keeps its last whole read and revalidates it with one ref GET while the branch still names the same commit, instead of spawning gh for every tree and blob every two minutes"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # when serve's catalog pool reuses its last read; a reused read is revalidated against the branch's current commit
  band_meaning: span
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T13304
  files:
    - src/lib/ops-catalog-source.ts
    - src/lib/serve-plan-reload.ts
    - test/serve-revalidates-its-kept-ops-catalog-with-one-ref-read.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A catalog refresh past BOARD_CATALOG_REFRESH_MS whose branch still names the kept commit makes exactly one GET (the branch ref) and answers the same Plan as the whole read before it"
      proof: "grep: W1-T13330 criterion 1 in test/serve-revalidates-its-kept-ops-catalog-with-one-ref-read.test.ts"
    - claim: "invariant:revalidated-or-reread — a moved branch, or a failed ref GET, rereads the whole catalog (trees and blobs) and answers the new Plan"
      kind: guard
      proof: "grep: W1-T13330 criterion 2 in test/serve-revalidates-its-kept-ops-catalog-with-one-ref-read.test.ts"
    - claim: "A changed selection (even the same repository with other kinds) drops the kept read, so returning to the earlier selection reads in full"
      proof: "grep: W1-T13330 criterion 3 in test/serve-revalidates-its-kept-ops-catalog-with-one-ref-read.test.ts"
  rationale: |
    WHY: Craig on 2026-11-17: "serve should not need this much cpu". MEASURED from serve's runtime.loop_stall_profile
    rows over the hour to 04:03Z: 114 main-thread stalls, 140 s in total, 53 over 1 s. Child-process `spawn` called from
    ops-catalog-source.ts was 877 ms of self time inside those stalls (the second largest self frame), and a 10 Hz ps
    sample at 01:05Z saw about 200 short-lived children in serve's container.
    READ at origin/main, src/lib/ops-catalog-source.ts: defaultOpsCatalogApi runs `gh api <path>` (one child) for every
    request; readBlob fetches `git/blobs/<sha>` for every shard (up to OPS_CATALOG_MAX_SHARDS, 500) on every read, with
    no cache; serve-plan-reload.ts refreshes the catalog every BOARD_CATALOG_REFRESH_MS (120 s) while a client watches.
    The daemon's shadow source already revalidates a kept snapshot with one ref GET (W1-T13052); serve's pool does not.
  design: |
    INVARIANT revalidated-or-reread: a reused catalog is one whose branch still names the commit it was read at.
    1. serve-plan-reload.ts's pool entry keeps {selection, repository, branch, commit, plan} after a whole read.
    2. On a refresh, if the kept read matches the selection and repository, one readBranchSha GET (exported from
       ops-catalog-source.ts) decides: the same commit answers the kept plan; a moved branch or a failed GET clears it and
       runs the whole read, exactly as before.
    3. A changed selection clears the kept read before anything else.
    (A blob cache in the default api was tried first: its module-level state made two board-catalog suites depend on
    test order, because they share serve's one parentCatalogApi.)
  falsifier: |
    Reread every refresh: criterion 1 fails. Reuse the kept plan after a moved branch or a failed ref GET: criterion 2
    fails. Keep the read across a selection change: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794892389000 with ~/rmd-work/bin/reserve-id.sh.
    Proof that counts in production: serve's gh children for the catalog drop to one ref GET per refresh, and spawn
    frames from ops-catalog-source.ts leave serve's loop_stall_profile rows.
