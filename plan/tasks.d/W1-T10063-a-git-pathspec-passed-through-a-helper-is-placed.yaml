  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern, which suites the source-text reader derivation places when a git pathspec arrives through a helper's argument; the census suites, the precheck and the membership report's shape are unchanged
  band_meaning: span
  origin: "operator session 2026-10-17 filing agent F17 item 1, from the hand fixes of #12582, #12601, #12604 and #12600 (16:40-18:15Z)"
  plan_refs: [W1-T9864, W1-T9757, W1-T9806, W1-T2969, W1-T2809, W1-T10064]
  files:
    - src/lib/source-text-readers.ts
