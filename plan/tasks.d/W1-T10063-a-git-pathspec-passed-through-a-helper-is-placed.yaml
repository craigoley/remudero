- id: W1-T10063
  title: "RMD CENSUS-MEMBERSHIP NAMES A CENSUS WHOSE GIT PATHSPEC REACHES GIT THROUGH A HELPER — the W1-T9864 subpath-alias census (test/a-test-imports-through-the-subpath-alias.test.ts) walks test/ with `git grep` and `git diff --name-only` whose `-- test` pathspec is passed in by its caller, so source-text-readers places it as a plain text reader of package.json and two fixture paths, no added test file joins it, and on 2026-10-17 #12582, #12601, #12604 and #12600 each went red on it in CI after a pre-push census run that could not see it"
  repo: remudero
