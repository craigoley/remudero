- id: W1-T9816
  title: "RUN-CHILD MODE AUTO DECIDES FROM A LIVE LEDGER THAT ROTATION HAS ALREADY PRUNED — W1-T9087 seeds its evidence tracker from readLedgerLines(ledgerPath), the live file only, but no run_child.* step and no run_child.mode_decision is retained by rotateLedger, and daemon.start outlives a rotation only by the 30-min render window. So a boot can promote shadow -> on over a window whose lost child was rotated away, and a daemon up longer than 30 min forgets the previous boot and holds forever with 'no whole boot cycle'"
  repo: remudero
