  note: "verify:auto — every claim is decidable in-process. The parity assertion spawns the
    project's own commitlint binary, which test/commit-message.test.ts already does today; nothing
    reaches the network and no operator is present.
    RULE 19 SIZING CHECKED BEFORE FILING, and this is why the test lives in an EXISTING file.
    `moduleIdFromPath` folds a `.test` suffix away, so src/lib/commit-message.ts and
    test/commit-message.test.ts both resolve to the module id `commit-message` — ONE subsystem, so
    risk:medium is honest rather than a band that will be raised at the gate. A new
    test/commitlint-parity.test.ts would have resolved to a SECOND id and forced risk:high for a
    change confined to one module, which is why it is not declared. `SUBSYSTEM_LEXICON` adds
    nothing here: no criterion names a daemon, launchd or crash-recovery concern.
    RULE 25 CHECKED BEFORE FILING: neither declared path is an INSTRUMENT_SURFACE entry (no
    workflow, no *-ratchet.mjs, no diff-coverage.mjs, no *-baseline.json, no
    mutation-relevant-paths.json, no stryker.conf.json), and src/lib/commit-message.ts is not in
    USER_VISIBLE_SURFACE_RE either — that regex names bin/, run-task, spike, config/settings/mounts,
    review/task-linter, run-result/status/ledger/flight-judge, plus the instrument arm. So this
    change trips neither the entanglement gate nor the cli-reference drift check.
    FILES: CAN CONTAIN THE DESIGN, checked deliberately because tasks this week could not.
    `checkCommitMessage`, `shapeCommitMessage`, `CONVENTIONAL_LIMITS`, `readRangeCommitMessages`,
    `emitterChecksStep`, `commitlintStep` and `runPreflight` ALL live in src/lib/commit-message.ts;
    the real-CLI harness lives in test/commit-message.test.ts. Both are declared and nothing else
    needs editing. src/run-task.ts is named in design (v) as EVIDENCE about the PR title and is
    deliberately NOT declared — nothing there changes.
    ON THE PROOFS. Three are `grep:` with an explicit path, and each names a symbol that does NOT
    exist anywhere in src/ or test/ today, so none can match the merge base and be downgraded to
    executed_stale. Those three names are therefore BINDING on the implementer rather than a guess
    about what it will call things: CONVENTIONAL_RULE_COVERAGE for the rule table,
    EMITTER_COMMITLINT_PARITY for the shared corpus, splitRangeCommitMessages for the pure splitter.
    None of the three patterns contains a regex metacharacter or the ` in ` sequence that
    `parseDialectGrep` splits on. The fourth is the pure-path `unit test:` form against an existing
    file, which lint-passes and executes the whole file.
    budget_usd 45 — the cost is design (iv)'s corpus, which must contain a case per rule in (i) plus
    a valid control, not the rule table itself."
