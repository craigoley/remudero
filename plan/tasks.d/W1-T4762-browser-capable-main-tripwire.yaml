- id: W1-T4762
  title: "Withdraw conditional Chromium install after #7772 fixed the red tripwire"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high
  origin: "2026-09-29 tripwire failure on #7757, subsequently fixed by #7772; optimize without reopening that failure"
  plan_refs: [W1-T1027, W1-T4472]
  files: [.github/workflows/main-tripwire.yml, scripts/tripwire-browser-requirement.mjs, src/lib/review.ts, test/main-tripwire-browser-requirement.test.ts]
  status: blocked
  retirement: withdrawn
  attempts: 0
  rationale: |
    The per-merge tripwire selected a Chromium-launching suite and turned main red while full
    CI passed. PR #7772 already repaired the missing browser setup with an unconditional
    Chromium install; its merged main-tripwire check passed. This task now removes that cost
    from ordinary merges while preserving the repaired browser-test path. The selected-suite
    detector is itself a gate instrument and must receive the same review protection.
  design: |
    Replace #7772's unconditional install after selecting touched and affected test files;
    detect whether any selected file requires
    Playwright Chromium. Install only the pinned Chromium browser before the test step when it
    does; do not invoke apt or --with-deps, and keep the tripwire's bounded budget. Detection
    should derive from selected test source rather than a hand-maintained list of three names,
    fail closed on unreadable candidates, and have a positive control for every current
    browser-launching test. Keep browser tests in the tripwire, not skipped or downgraded to
    green. Do not alter the required full CI coverage behavior.
  acceptance:
    - claim: "a selected browser test requests Chromium before the tripwire runs it"
      proof: 'grep: test("W1-T4762: selected Playwright suite requires Chromium" in test/main-tripwire-browser-requirement.test.ts'
    - claim: "ordinary selected tests avoid the extra browser install and unreadable paths refuse"
      proof: 'grep: test("W1-T4762: ordinary suites avoid install and missing suites refuse" in test/main-tripwire-browser-requirement.test.ts'
  falsifier: |
    Select the touched W1-T1027 browser suite on a clean runner: the conditional install must
    run and chromium.launch must succeed. Select an ordinary unit suite: no browser download.
    An unreadable selected test file must not answer that no browser is needed.
  note: |
    Operator follow-up audit, 2026-09-29: #7772 merged before this task was filed and its
    main-tripwire check passed with the real Chromium-launching suite. The unconditional browser
    install took nine seconds in that run. Conditional static-import detection would save that
    time on ordinary merges but could miss a future browser suite using an indirect helper and
    recreate false-red main health. The original root cause is already fixed; this optional
    optimization is withdrawn, not claimed as built or satisfied. No implementation PR was pushed.
