- id: W1-T11865
  title: A required-check set whose only member is remudero-review judges every reported non-review check, instead of reading pending forever, so a repository like wreckterra shows green CI as green and its plan-lint retry guard can pass
  repo: remudero
  depends_on: []
  priority: 0.5
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # checksStateFromRollup gates auto-merge and the retry guard for every repository; only a required set holding nothing but the review changes, and mixed sets and unreadable protection keep today's results
  band_meaning: blast-radius
  origin: operator ruling 2026-11-09 "File and hand-build"
  plan_refs:
