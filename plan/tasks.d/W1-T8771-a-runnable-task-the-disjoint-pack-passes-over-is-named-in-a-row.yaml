  falsifier: |
    The queue in dispatch order is [P1 X (a.ts, b.ts), P1 Y (b.ts), P2 Z (c.ts)] with two lanes. Today the pack is
    [X, Z]: Y is passed over for b.ts and nothing names it. With the fix, a `dispatch.passed_over` row names Y with
    holder X, paths [b.ts] and passed_for [Z]. Remove the callback from `packDisjointFirst`, and the first test sees no
    row. Name every uncollected candidate, and the second test sees a row for a task behind the cut. Drop the dedupe
    key, and the third test sees one row per pass instead of one per state.
  note: |
    EFFECT, measured after merge from the core ledger union with no numeric pass mark: for each `dispatch.lane_refilled`
    and `dispatch.concurrent_set` row, check that every runnable task of equal or higher priority that the pass did not
    start has a `dispatch.passed_over` row or a `dispatch.serialized` row in its current state. A W1-T8502-shaped
    pass-over, a P1 left out while a P1.2 starts, then reads from the ledger instead of being reconstructed by hand.
