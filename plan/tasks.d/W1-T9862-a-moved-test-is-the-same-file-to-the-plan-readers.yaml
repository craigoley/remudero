      proof: 'grep: test("W1-T9862: a moved test path mints no proof debt and an absent one still does" in test/a-moved-test-is-the-same-file-to-the-plan-readers.test.ts'
    - claim: 'a synthetic item citing a moved test is kept, and one citing an absent test is rejected'
      proof: 'grep: test("W1-T9862: a synthetic item citing a moved test is kept" in test/a-moved-test-is-the-same-file-to-the-plan-readers.test.ts'
    - claim: 'a moved flake-incident, selector-shadow or expiring-fixture finding dedups against the open task'
      proof: 'grep: test("W1-T9862: a moved finding dedups against the open task" in test/a-moved-test-is-the-same-file-to-the-plan-readers.test.ts'
    - claim: 'two tasks naming the old and the new path of one test overlap for dispatch'
      proof: 'grep: test("W1-T9862: two tasks naming the old and new path of one test overlap" in test/a-moved-test-is-the-same-file-to-the-plan-readers.test.ts'
    - claim: 'dispatch overlap compares test paths through sameTestFile'
      proof: 'grep: sameTestFile( in src/lib/dispatch-overlap.ts'
    - claim: 'proof-queue-audit resolves test paths before calling them absent'
      proof: 'grep: resolveTestPath( in src/lib/proof-queue-audit.ts'
  falsifier: |
    On origin/main proof-queue-audit calls existsSync on the cited path, so a moved test reads grep-path-absent and the
    first test fails. The origin keys compare whole strings, so a moved finding files a duplicate. overlappingPaths
    intersects exact paths, so the old and new paths do not overlap. The remaining tests fail the same way.
