      proof: 'grep: test("W1-T6354: helper files are never probed as tests" in test/base-reproduction-probes-only-test-files-once-per-head.test.ts'
    - claim: "an unchanged base sha is probed once, not once per sweep"
      proof: 'grep: test("W1-T6354: a base sha is probed once per file" in test/base-reproduction-probes-only-test-files-once-per-head.test.ts'
  falsifier: |
