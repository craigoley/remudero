  plan_refs: []
  files: [src/run-task.ts, test/base-reproduction-probes-only-test-files-once-per-head.test.ts]
  status: queued
  priority: 1.5 # operator-2026-10-09: sweep churn: 570 uncached base-reproduction probes (6,097 s of test time) in 21 h, #10296 probed 25x on head 305ae61
  attempts: 0
  rationale: |
    MEASURED 2026-10-08 (core ledger): W1-T6153's sweep.base_reproduction rows at 06:28, 06:48, 07:00, 07:12 and
    07:23Z each report outcome passes for the real test plus outcome unrunnable "Error: unexecutable test path:
    test/helpers/wall-clock-bound.ts" and "…test/helpers/delegation-profile-fixture.ts". READ on origin/main: the
    probe in src/run-task.ts parses each candidate as `unit test: <file>` and throws for a non-test path; nothing
    filters helper files before probing, and nothing remembers the answer for the same head.
  design: |
    Filter the probe's candidates to files the proof dialect can execute as tests (the *.test.ts set the selector
    already knows) before probing, so helpers never reach it; and memo the base outcome per (base sha, file) so an
    unchanged head does not re-probe each sweep. A genuinely missing or unreadable test file keeps its current outcome.
  acceptance:
