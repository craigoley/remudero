- id: W1-T10389
  title: "A FOREIGN PID THE CWD CENSUS CANNOT READ DOES NOT HOLD A DEAD FIX ROUND'S WORKTREE — `readBoundedProcessCwdCensus` (src/run-task.ts) answers `unknown`/`cwd_unreadable` on the FIRST pid whose `/proc/<pid>/cwd` readlink fails with anything but ENOENT, and `decideRegisteredFixOwnerRecovery` then keeps the dead round's worktree (`process_cwd_probe_unreadable`); 18 `sweep.fix.checkout_claim_declined` rows across 12 PRs from 2026-10-21T08:49Z to 10-22T01:20Z, #13317 at 12:18Z among them, and #12894 declined the same way from 12:20Z to 18:23Z on 10-19"
