    - claim: "the fix-owner capture in src/run-task.ts names the census probe through the extracted src/lib/process-cwd-census.ts"
      proof: "grep: describeProcessCwdProbe( in src/run-task.ts"
  falsifier: |
    Return unknown on every non-ENOENT error again, and the foreign-pid fixture keeps the dead round's worktree.
