  note: |
    ── Q1. THE FULL ESCAPE SET, FIELD BY FIELD, WITH ITS CONSUMER ──────────────────────────────

    (i) GUARDED TODAY: `acceptance`, and only against an ADDED or REWORDED CLAIM. Nothing else in
    the type is inspected at all.

    (ii) UNGUARDED WITH A LIVE CONSUMER THAT A POST-MERGE EDIT WOULD POISON. `status:` feeds
    dispatch eligibility — `src/lib/drain.ts:510` branches on `t.status === "blocked"` — so
    flipping a merged task back to queued re-arms a dispatch the fleet already paid for.
    `files:` feeds W1-T171's overlap serialization through `partitionByFileOverlap`
    (`src/lib/dispatch-overlap.ts`, wired at `drain.ts:594` and `:1819`), so a narrowed
    declaration silently un-serializes two runs that must not touch the same paths at once.
    `depends_on` feeds the DAG. `priority` feeds the dispatch comparator at `drain.ts:355-356`.
    `risk`, `verify`, `type`, `principles` and `budget_usd` each steer a lane, a gate or a spend
    cap. `retirement` feeds the board's bucketing. THESE ARE THE FIELDS WORTH REPORTING.

    (iii) UNGUARDED AND NOT WORTH GUARDING, NAMED AS SUCH RATHER THAN LEFT IMPLICIT.
    `hand_built` has exactly TWO mentions in the whole of `src/`, both in `plan.ts` — the
    interface declaration at `:141` and the loader's own copy at `:254` — and ZERO consumers,
    against a control of 26 mentions for `budget_usd`. A field nothing reads cannot be poisoned,
    and a check that reports it manufactures noise. `note`, `rationale` and `title` are prose an
    amendment is EXPECTED to change; reporting them would make the check fire on every legitimate
    rationale amendment and it would be turned off within a week.

    (iv) SO THE CHECK MUST BE SCOPED BY CONSUMER, NOT BY IMMUTABILITY. The question a build must
    ask of each field is "does anything read this after the task merges", not "is this field
    conceptually final". That is the line between a useful report and a nuisance.

    ── Q2. WHETHER A GUARD IS EVEN THE REMEDY, AND HOW W1-T2248 STILL HOLDS ────────────────────

    (v) W1-T2248's RULING IS BINDING HERE AND THIS TASK MUST NOT CONTRADICT IT. That shard states
    that a merged `files:` can be provably wrong and must stay correctable, and that "THE
    RESOLUTION IS NOT A GATE BUT AN EVIDENCE REQUIREMENT". It owns the documentation half. CITED,
    NOT RE-FILED, AND NOT REOPENED.

    (vi) BOTH HOLD, AND THE RECONCILIATION IS THAT THIS TASK BUILDS A DETECTOR AND NOT A LOCK.
    W1-T2248 argues about whether a change is PERMITTED. This task is about whether a change is
    VISIBLE. A report that names which fields moved on a merged task does not forbid moving them;
    it makes the correction W1-T2248 wants into a declared act instead of an invisible one, which
    is precisely the evidence requirement that ruling asks for, generalised past `files:`.

    (vii) THE ESCAPE HATCH ALREADY HAS A SHAPE IN THIS FILE AND SHOULD BE COPIED, NOT INVENTED.
    The acceptance guard's own `ctx.followUpFiled` is an explicit, in-PR declaration that makes an
    otherwise-blocking change legitimate. A field report should work the same way: the amendment
    declares which fields it changes and why, and a declared change passes. NOTHING NEW IS
    INVENTED and no field becomes unreachable.

    (viii) IF THE TWO CANNOT BE HELD TOGETHER, W1-T2248 WINS AND THIS TASK NARROWS. If a build
    finds itself unable to report a `files:` change without also blocking it, the correct outcome
    is to drop `files:` from this check and keep the rest, NOT to override that ruling. Say so in
    the PR rather than resolving it silently.

    ── Q3. WHAT MUST NOT CHANGE ────────────────────────────────────────────────────────────────

    (ix) THE ACCEPTANCE GUARD STAYS EXACTLY AS IT IS AND KEEPS ALL FIVE EARLY EXITS. Verified
    live, each applied to the firing control: no context supplied returns EMPTY;
    `statusResolvable: false` returns EMPTY; `merged: false` returns EMPTY; no delta against the
    base returns EMPTY; `followUpFiled: true` returns EMPTY. All five must still return EMPTY
    after this task.

    (x) `fail OPEN on an unreadable derived status` IS THE ONE MOST AT RISK AND IS PINNED HERE.
    A guard that failed CLOSED on an unreadable input would block every amendment during a
    GitHub outage or a token failure — the same class of incident that has already stamped the
    board unreachable this week. Any new check must inherit that fail-open discipline, not just
    the existing one.

    (xi) NOTHING SELF-APPLIES A CORRECTION. W1-T15. This check REPORTS a changed field; it must
    never rewrite one back to its base value, and it must not offer to. The detector's output is
    for a human, and Craig gates the merge.

    (xii) AND IT IS A REPORT, NOT A NEW TERMINAL STATE. Rule 21's meaning is unchanged: MERGED
    stays terminal, an amendment still does not re-queue a task, and this adds no path that
    would.

    (xiii) RULE 19 BAND. `risk: high` is set UP FRONT because `files:` spans two source stems and
    Rule 19 sizes on SPAN. THE BAND IS THE SPAN READING AND NOT A BLAST-RADIUS JUDGEMENT: the
    context object gains a field the call site already has resolved, one function reads it, and
    no existing predicate or threshold moves.
