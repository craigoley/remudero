  design: |
    `consumer_kb` reads docker's real data root (`docker info --format '{{.DockerRootDir}}'`, falling
    back to daemon.json, then /var/lib/docker), /var/lib/containerd, the live worktrees path (the
    bind source when the underlay is shadowed), the coverage scratch dirs, /mnt/rmd/tmp and the
    /mnt/rmd top level; each published consumer carries the device it lives on. An unreadable root
    publishes an explicit unknown, never 0.
  acceptance:
