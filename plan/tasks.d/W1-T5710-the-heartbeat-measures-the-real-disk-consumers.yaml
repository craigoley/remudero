  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a and the host, read only. scripts/fleet-heartbeat.sh
    `consumer_kb` measures ${RMD_ROOT}/worktrees, ${RMD_ROOT}/state, /var/lib/docker (Linux only),
    /tmp/claude* + ${RMD_ROOT}/tmp, ~/.claude/projects + ~/.codex, ~/.npm. On this host
    /etc/docker/daemon.json sets data-root /mnt/rmd/docker, /var/lib/docker does not exist, and
    /var/lib/containerd is a mount of the /mnt/rmd device (27.2 G of images); RMD_ROOT/worktrees
    (~/rmd-state2/worktrees) is the shadowed underlay holding 1.4 G of September trees while the live
    worktrees are bind-mounted from /mnt/scratch/rmd/rmd-state2/worktrees. Never measured: containerd,
