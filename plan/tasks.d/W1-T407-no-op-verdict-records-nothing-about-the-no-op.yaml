  note: "ALL THREE FIELDS GO ON THE VERDICT ROW, AND THE OBVIOUS PLACE FOR THE FIRST ONE IS WRONG.
    The brief that produced this task named `implement.done` as the row missing the commit count.
    That is where the count would naturally go and it must NOT go there. `implement.done` is
    DELIBERATELY EXCLUDED from the never-rotated decision-relevant ledger set, and the exclusion is
    argued rather than incidental: the set's own doc lists it among the steps read ONLY to label a
    cosmetic phase and elapsed time for the board, and states those never gate a real decision. So
    a count written there is subject to ordinary rotation, which keeps only the newest lines per
    step and archives the rest — the forensic answer would evaporate exactly as history accumulates,
    which is the one condition under which anyone wants it. Adding the step to the retained set to
    compensate would contradict that set's stated rationale and force a cosmetic phase transition
    into the never-rotated core.
    The verdict step is already IN that set, so a field written there survives indefinitely. That
    settles both the placement and the scope: all three facts belong on ONE ledger write, produced
    by ONE function, at ONE call site.
    SCOPE, ARGUED RATHER THAN ASSUMED. The candidate split was to make the report capture its own
    task, on the grounds that it introduces a new KIND of payload — free-form model text with a size
    surface the other two do not have. That argument is answered by precedent rather than waved off:
    the size question is already solved in this codebase. A failed spawn's stderr is persisted
    through a named cap constant and a helper that returns UNDEFINED for a clean spawn, with the
    explicit reasoning that a clean spawn must not spam the ledger with an empty excerpt. The report
    excerpt is that mechanism applied to a different string, not a new design problem. Against that,
    splitting would put the SAME verdict-shaping function into two shards that a concurrent drain
    could dispatch at once, which is the merge-conflict shape this repo has already paid for.
    ONE TASK. THE CONDITION THAT WOULD CHANGE THAT: if the report text needed REDACTION beyond a
    length cap — a secret-shaped scan, or a policy about model prose in a committed record — that is
    a genuinely separate concern with its own falsifiers, and it should be split out at that point
    rather than absorbed here.
    THE PRECEDENT SAYS THIS IS CHEAP, AND NAMES THE SHAPE. An earlier task threaded the child's env
    key list and the account label through the worker result purely so that a blocked verdict could
    DERIVE its billing mode instead of hardcoding a literal — no behaviour change, a strictly better
    record, and the new parameters appended LAST so no existing positional caller shifted. That is
    the same change at the same layer, and the same append-last discipline applies here.
    DO NOT ADD A NEW CONTRACT EXIT, AND THE REASONING IS RECORDED HERE SO IT IS NOT RELITIGATED. It
    is tempting to give a worker a sanctioned way to say I RAN AND PRODUCED NOTHING, beside the
    existing decision-request and already-satisfied exits. It should not exist. A contract exit is a
    way for a worker to SAY something, and a worker that produced nothing has nothing to convey
    beyond that it did not manage the task. An exit for it would let a worker DECLARE ITS OWN NO-OP
    LEGITIMATE, which is strictly worse than the fleet catching it mechanically and refusing to
    credit it — the arrangement that already works. Neither existing exit fits either: the
    already-satisfied exit asserts the acceptance is already true upstream, which is false here and
    would be refused by the verifying gateway anyway, and the decision-request exit asserts a choice
    is needed, which auto-chooses and RESUMES rather than exiting.
    A DIFFERENT HOLE, NOTED AND NOT FILED HERE: a separate feedback item argues there is no exit for
    WORK DONE BUT PREFLIGHT WILL NOT GO GREEN. That shape has a REAL ARTIFACT that cannot be
    certified, and any exit for it would carry a diff and ask for a human judgement about the gate.
    This one has no artifact at all. One exit could not serve both, and folding them together would
    lose the distinction that makes either tractable.
    RISK HIGH IS THE SIZING RULE'S SPAN, NOT BLAST RADIUS. The file set crosses the dispatcher that
    shapes the verdict and the worker module where the capped-excerpt helper's sibling already
    lives, plus their tests. The behaviour change is nil by construction: the guard's predicate, the
    verdict it returns, the worktree removal and the drain halt are all untouched, and a reviewer
    should treat any diff that alters them as out of scope for this task."
