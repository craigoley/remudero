      proof: "unit test: test/no-pr-verdict-commit-count.test.ts"
    - claim: "the no_pr reason distinguishes a worker that declined from one that produced nothing, instead of one fixed sentence for both"
      proof: "unit test: test/no-pr-verdict-reason.test.ts"
    - claim: "the worker's own closing report rides the row as a capped excerpt, and is absent rather than empty when there is nothing to carry"
      proof: "unit test: test/no-pr-verdict-report-excerpt.test.ts"
    - claim: "every new field is appended so no existing positional caller shifts, and the row stays within the never-rotated retention class"
      proof: "unit test: test/no-pr-verdict-shape.test.ts"
