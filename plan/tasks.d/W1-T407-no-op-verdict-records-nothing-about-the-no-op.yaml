- id: W1-T407
  title: "the silent-no-op guard computes the commit count, branches on it, and throws it away — so the verdict row it writes cannot afterwards distinguish a worker that declined from one that burned thirty turns and produced nothing"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: "MEASURED ON AZURE 2026-08-08, RE-DERIVED FROM SOURCE AT 0ecf1e6. An implement worker
    ran 30 turns, spent $1.29, reported subtype success with no api error and no permission denials,
    and produced NO CODE — the run branch survived with an empty diff against the merge base.
    Verdict no_pr. A later run of the same task succeeded and opened a PR, so the failure is
    INTERMITTENT.
    THIS TASK CHANGES NO BEHAVIOUR, AND THAT IS THE POINT. THE DETECTION IS NOT MISSING. runTask
    (src/run-task.ts) carries a guard its own comment calls the SILENT NO-OP GUARD: it fires when
    the worker reported no PR AND `commitsAhead(worktreePath, \"origin/main\")` is zero, and
    `commitsAhead` shells `git rev-list --count` and returns 0 on any throw — fail-closed toward
    nothing-to-PR. `no_pr` IS that detection's output. `noPrVerdict`'s own doc names the precedent
    it was built for: run W1-T12a-1784117152056, subtype success, num_turns 10, no pr.opened. The
    guard worked, refused to credit the run, removed the worktree, and halted the drain rather than
    looping — every one of those is the designed behaviour and none of it is in scope here.
    WHAT IS IN SCOPE IS WHAT THE ROW REMEMBERS. Three facts exist at that moment and none is
    written down.
    (1) THE COMMIT COUNT IS COMPUTED AND DISCARDED. The guard calls `commitsAhead` purely as a
    predicate. No ledger step anywhere in src/ carries a commit count — grep for one returns only
    the two call sites and the test export. So a row cannot separate WROTE NOTHING from WROTE
    SOMETHING THAT COULD NOT BE PUSHED without re-deriving it from a worktree that `worktreeRemove`
    has already deleted by the time anyone reads the row.
    (2) THE REASON IS A FIXED STRING. `noPrVerdict` sets `reason` to the same sentence on every
    no_pr it has ever written. It is true and it discriminates nothing.
    (3) THE WORKER'S OWN REPORT IS IN SCOPE AND UNUSED. A local `fullText` closure over the
    worker result is already built at that site and already parsed three times — for a decision
    request, for a PR url, and for an already-satisfied claim. The text that might have said WHY is
    read and dropped.
    THE BUCKET IS PURER THAN IT LOOKS, WHICH IS WHY THE MISSING FIELDS MATTER RATHER THAN A NEW
    CLASSIFIER. Three of the four benign explanations never reach this row at all: a decision
    request is auto-chosen to the recommended option and the worker is RESUMED; a verified
    already-satisfied claim gets its own credited verdict and returns merged; a non-success subtype
    returns earlier through the worker-error path. Only an UNVERIFIED already-satisfied claim falls
    through, and it leaves its own refusal marker on the way past. So what remains under no_pr is
    close to two populations — a correct decline and a silent no-op — separable today only by
    inference from turns and cost, which is a query nobody runs rather than a field anyone reads."
  acceptance:
