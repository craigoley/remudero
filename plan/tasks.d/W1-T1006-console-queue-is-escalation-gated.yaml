      proof: "unit test: W1-T1006: a disposed PR with no escalation issue reaches the console queue"
    - claim: "each blocked PR row carries its own disposition and reason verbatim from the ledger line"
      proof: "unit test: W1-T1006: a blocked PR row carries its disposition and reason verbatim"
    - claim: "a candidate whose live state could not be checked renders the withheld note and a checkable one renders its reason in the same run"
      proof: "unit test: W1-T1006: an unverified candidate renders withheld and a checkable one renders its reason"
    - claim: "the escalation group and the verify human group keep their own rows and affordances unchanged"
      proof: "unit test: W1-T1006: the escalation and verify human groups keep their rows unchanged"
    - claim: "a blocked PR row offers no card affordance for an id the plan does not hold"
      proof: "unit test: W1-T1006: a blocked PR row offers no card link for a cardless id"
    - claim: "the board wire names the blocked PR kind so the queue reads one snapshot rather than a second derivation"
      proof: "grep: blocked_pr in src/lib/board.ts"
  risk: high
  origin: "oper#console-decision-queue-2026-08-18"
