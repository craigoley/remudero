  note: |
    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS — the declared paths reach
    two distinct concerns (board, serve), which `sizingViolation` refuses at medium. Decomposition
    is the rule's other option and is declined with a reason: the wire that lacks the field and the
    renderer that lacks the row are one defect, and splitting them would file a supplier with
    nothing to supply and a renderer with nothing to render.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT, not by guess. `computeBoardSnapshot` reads 7
    in `src/lib/board.ts` (its home) and 1 in `src/lib/task-card.ts`; `renderNeedsMe` and
    `needsMeTaskRowHtml` live only in `src/lib/serve.ts`. `src/lib/status-board.ts` is NOT declared
    because nothing in it changes — `buildStatusBoard`, `BlockedPrBlocker` and `BlockersSection` are
    already exported — and declaring an unchanged file would serialize the 15 shards that name it
    for no reason. **`src/run-task.ts` IS NOT DECLARED**: it holds 6 of the 12 `buildStatusBoard`
    references, but the symbol's HOME is `src/lib/status-board.ts`, so the marker is reachable
    without it, and 217 shards already declare `src/run-task.ts` (W1-T471) — every one of which this
    task would serialize against. `src/lib/serve.ts` is declared by 47 shards and is accepted in
    writing: the queue cannot be changed without it.

    THE MEASUREMENTS ARE QUERIES, NOT NUMBERS TO CARRY. Every count above is re-derivable over the
    ledger union (`zgrep -h '<pat>' state/ledger.*.ndjson.gz state/ledger.*.ndjson state/ledger.ndjson`,
    all three patterns, per-form file counts as the coverage control) and by word-bounded `git grep`
    on the named symbols. They will move; the symbol names are the check.

    ONE CONSUMER IS REJECTED AND THAT IS RECORDED RATHER THAN GLOSSED. Read at origin/main:
    `fb-1784770111145-cf7c24` is **accepted** (translate/summarize/separate — the directive (ii)
    serves), `fb-1784988460437-9daa9b` is **accepted** (write-actions on UP NEXT — out of scope per
    (vii)), and `fb-1784756096314-a6f58b` (needs-me decision-queue UX) is **rejected**, with no
    reason recorded in the file and 0 ledger rows naming it against a control of 0 for cf7c24 —
    so the ledger simply does not carry either decision. IT IS NAMED, NOT ABSORBED, AND ITS CLAUSES
    ARE NOT SMUGGLED IN: its ask (a) grouping by arc, (c) one-tap batch close, and (d) inline
    options are all absent from this design on purpose. Its clause (b) — derive live resolution
    state per escalation — is what W1-T306 already built and (iii) inherits. An implementer must not
    read this task as reviving a rejected item.
