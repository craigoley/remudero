  design: >-
    Add pure private post-processing helpers over immutable manifests and existing canary and
    field-trial evidence contracts. Preserve observational versus registered randomized
    field-trial design, assignment probabilities and audit provenance; neither may be silently
    relabeled or pooled with descriptive benchmark cohorts. Match serving configuration, scaffold, corpus/scorer pins,
    role and observation window. Keep benchmark and observational denominators separate and
    label unmatched/unknown evidence. Resample paired independent task/incident families,
    carrying repeats and variants together with a pinned deterministic analysis seed and
    bounded work. Predeclare endpoints/comparison families and withhold unsupported uncertainty
    or small-sample claims; never count repeats as new independent cases. Keep first-attempt,
    all-repeat and best-of-k outcomes distinct. Compare frozen router decisions made from
    pre-outcome features with development-selected qualified static baselines; any empirical
    per-case oracle is explicitly an optimistic diagnostic. Derive private proposal drafts
    from repeated failure signatures with source evidence, a falsifiable hypothesis, bounded
    scope, unmeasured outcome and rollback/verification requirements. Do not write field-trial
    counts, ledger events, new tasks, schedules, routing policy or promotion state. Reuse the
    existing proposal/experiment contract only where compatible; otherwise return unavailable.
    Add bounded private analysis and proposal-export modes to the existing offline command that
    call all three helpers directly. Serialize these command edits after W1-T11118.
    OWNER EVIDENCE (criteria 15-17): the analysis evidence adapter reads only EXISTING
    CanarySlotOwner terminal receipts, read-only. It never imports or fabricates rows and never
    creates, claims or terminates a slot. It binds receipts to one digest-verified ModelCanaryMatrixPlanV1
    shard by schedule digest and slotMappings. The expected set is every slotMapping of that shard.
    Every absent cell is an explicit named missing block, exactly one of never-claimed,
    started-not-terminal, unavailable-grade, coding-native-profile-unavailable, binding-conflict
    or shard-absent. The output reports expected, observed and missing denominators, and
    uncertainty is withheld for every comparison a missing block touches. Receipts with no
    slotMapping are extras: excluded and named, never counted.
    FIELD PROVENANCE (criteria 18, 26, 27): projectFlowRow whitelists only the pre-execution
    worker_assignment.routing.experiment fields id, assignedArm, assignedProbability, servedArm and
    crossover, and nothing else from that object. servedTrialCohorts carries them into a bounded,
    private, assignment-keyed cohort output, and the native field evidence reader consumes that output.
    The recorded assignedProbability is preserved exactly. Nothing calls experimentIntentionToTreat
    or experimentArmForTask, or recomputes an arm or probability. Malformed or absent provenance
    stays observational or unavailable and is never inferred as randomized. A recorded
    registered-epoch receipt is an alternate randomized source only when it is actually
    verifiable (the loadPaidPilotProtocol version, pilotId and revisions match). Otherwise the
    randomized comparison is unavailable.
    GRADER FAILURES (criterion 19): proposal failure signatures map only from recorded terminal
    grader reasons that carry owner-receipt provenance. A missing trace, scorer error or
    unavailable grade is a named evidence gap, never a failure.
    FROZEN ROUTER DECISIONS (criteria 20, 22, 24): at prepare time, freezeCanaryRouterDecisions
    (src/lib/model-canary-router-decision-receipt.ts) decides from a CLOSED pre-outcome feature
    schema. Any non-schema or outcome-bearing field is refused. It writes exclusive-create
    receipts in the private canary directory, bound to manifest, policy and feature digests.
    evaluateCanaryRouterValue replays only those durable receipts plus owner outcomes. It
    validates the digests and refuses missing, altered or overwritten receipts, and it never
    re-decides after outcomes exist.
    STATIC BASELINE (criteria 21, 23): qualifyCanaryStaticBaseline
    (src/lib/model-canary-static-baseline.ts) qualifies a static baseline from development-split
    owner receipts only and records the manifest digest, family digest and selection rule. It
    rejects any overlap between the development and evaluation splits. With no qualified
    baseline it returns unavailable. The per-case empirical oracle is never a fallback and stays
    labelled an optimistic diagnostic.
    LIMITS: every existing privacy and no-side-effect limit holds. The only new write is the
    private exclusive-create decision receipt. No ledger, task, schedule, policy, promotion,
    budget or provider-call side effects. Adapter integration tests stay in scope.
