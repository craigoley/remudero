  rationale: >-
    The approved benchmark must measure router value without treating observational model win
    rates as a randomized comparison. Existing paired analysis is descriptive and supplies no
    uncertainty estimate. Repeated attempts are not independent cases. Failure patterns can
    inform a bounded improvement proposal without executing that proposal.
    Settled by lookup: is this already filed or decided? -> No other task owns the analysis-side
    producers; W1-T11117 owns the matrix manifest, W1-T11118 the trace receipt, W1-T10957 the
    coding contract, W1-T11313 native coding execution, W1-T11120 the benchmark bundle/report
    (plan/tasks.d). No DECISIONS.md, LEARNINGS.md or MASTER-PLAN.md entry names router value or
    static baselines.
    Settled by lookup: what native producer supplies trusted execution provenance? -> the existing
    CanarySlotOwner terminal row, whose receipt carries slot, run (with run.trial scheduleDigest,
    blockId and plannedSlotIds), grade, privateTrace and coding fields, read read-only like
    readOwnedPrivateTraceReceipt and assertExistingCanaryOwnerV1 (src/lib/model-canary-owner.ts,
    src/lib/model-canary-schedule.ts).
    Settled by lookup: must analysis wait for a production coding execution port? -> No. That port
    belongs to W1-T11313 (verify human, needs a systemd+bwrap host); until it merges, coding cells
    are named missing blocks, and a test-only coding factory is not a receipt producer
    (plan/tasks.d/W1-T11313, W1-T10957 amendment).
    Settled by lookup: where does shard identity come from? -> ModelCanaryMatrixPlanV1.shards, each
    with schedule.digest and slotMappings nativeSlotId to matrixSlotId/configId/replicateId
    (src/lib/model-canary-matrix-plan.ts). No new owner column is needed, and owner DDL is
    exact-match checked.
    Settled by lookup: what makes a field row randomized? -> a pre-execution worker.assignment row
    carrying routing experiment ITT with assignedProbability (src/lib/worker.ts,
    src/lib/routing-experiments.ts experimentIntentionToTreat), or a registered controlled epoch
    (src/lib/field-trials-flow.ts W1-T10843). The plain snapshot is observational
    (causalEffect observational-only-no-randomized-allocation).
    Settled by lookup: is an unavailable grade a model failure? -> No (W1-T11118 criterion
    "missing traces and scorer errors remain unavailable").
    Settled by lookup: does this need a new budget or a split? -> No. The operator focus for PR
    #17132 asks to widen this held task in place. budget_usd stays 12 and no task is filed.
  design: >-
    Add pure private post-processing helpers over immutable manifests and existing canary and
    field-trial evidence contracts. Preserve observational versus registered randomized
    field-trial design, assignment probabilities and audit provenance; neither may be silently
    relabeled or pooled with descriptive benchmark cohorts. Match serving configuration, scaffold, corpus/scorer pins,
    role and observation window. Keep benchmark and observational denominators separate and
    label unmatched/unknown evidence. Resample paired independent task/incident families,
    carrying repeats and variants together with a pinned deterministic analysis seed and
    bounded work. Predeclare endpoints/comparison families and withhold unsupported uncertainty
    or small-sample claims; never count repeats as new independent cases. Keep first-attempt,
    all-repeat and best-of-k outcomes distinct. Compare frozen router decisions made from
    pre-outcome features with development-selected qualified static baselines; any empirical
    per-case oracle is explicitly an optimistic diagnostic. Derive private proposal drafts
    from repeated failure signatures with source evidence, a falsifiable hypothesis, bounded
    scope, unmeasured outcome and rollback/verification requirements. Do not write field-trial
    counts, ledger events, new tasks, schedules, routing policy or promotion state. Reuse the
    existing proposal/experiment contract only where compatible; otherwise return unavailable.
    Add bounded private analysis and proposal-export modes to the existing offline command that
    call all three helpers directly. Serialize these command edits after W1-T11118.
    NATIVE PRODUCTION PATHS (clarified 2026-11-07, PR #17132). (1) Execution provenance. The
    analysis evidence adapter reads terminal rows from the existing private CanarySlotOwner
    directory, through a strictly read-only owner reader beside readOwnedPrivateTraceReceipt that
    first passes assertExistingCanaryOwnerV1. It never creates, migrates or claims anything. It
    trusts no imported JSON, self-reported origin or test-only factory. Non-terminal (started)
    rows stay owned and unavailable, never free or failed. (2) Shard identity. Join each receipt to
    the private digest-bound matrix manifest written by the W1-T11117 prepare path: its
    run.trial.scheduleDigest must equal exactly one shards[].schedule.digest, and its slot id must
    resolve through that shard's slotMappings to replicateId/caseId/configId/aaLabel. A receipt
    whose binding, suite hash or digest conflicts is rejected with a named reason. (3)
    Expected-matrix completeness. The expected set is every slotMapping of every manifest shard.
    Each expected cell is either an observed terminal receipt or a named missing block, with one
    of these reasons: never-claimed, started-not-terminal, unavailable-grade,
    coding-native-profile-unavailable, binding-conflict or shard-absent. Receipts outside the
    manifest are reported as unexpected and excluded. A family with any missing block in a
    compared pair withholds confirmatory uncertainty for that comparison, and the denominators
    disclose expected, observed and missing counts. Coding cells stay
    coding-native-profile-unavailable until W1-T11313's production port merges. (4) Field
    design provenance. The native field reader classifies a row as registered-randomized only
    when either of these was recorded before execution: a worker.assignment row whose routing
    experiment ITT carries an assignedProbability, or a registered controlled epoch. It copies that
    recorded probability, never recomputes it or assumes 1/arms, and keeps crossover from the
    recorded served arm. Every other row is observational, and a missing probability is never
    filled in. The reader goes through the existing read-only readFieldTrialsLedger and
    projectFlowRow, with no new ledger writer. (5) Grader failure evidence. Failure signatures
    come from the owner receipt's recorded reasons (privateGrade.reason such as
    unauthorized-action, the legacy grade reason, codingGrade.reason), each carrying its receipt
    slot id and digest. Unavailable grades, scorer errors and missing traces are evidence gaps and
    never failures. (6) Durable pre-outcome router decision. A new pure helper freezes router
    decisions at prepare time, before any slot can be claimed. It applies the same parsed routing
    policy the census consumes to a closed pre-outcome feature schema (case id, family, role, task
    class, risk, split). Any outcome-bearing key is refused. It writes a private exclusive-create
    receipt bound to the manifest digest, the policy source digest and the feature digest.
    Replay recomputes the decision and refuses a mismatched, missing or overwritten receipt.
    (7) Static baseline. A new pure helper selects the static baseline under a predeclared rule
    from development-split owner receipts only. Its private receipt records the development
    manifest digest, the family-set digest and the rule. Replay refuses any baseline whose
    families intersect the evaluated split, or that lacks a receipt. Router value then returns
    unavailable rather than falling back to the per-case oracle. evaluateCanaryRouterValue reads
    only these two receipt kinds plus owner outcomes. The offline command's private prepare and
    analysis modes call both helpers. Their only writes are private artifacts in the
    operator-supplied output directory. The command makes no provider call and acquires no lease,
    and it writes no ledger rows, tasks, schedules, policy, promotions or budget changes.
