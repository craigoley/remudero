  falsifier: >-
    Use paired positive controls and known missing/mismatched inputs. Duplicate repeats within
    each family and require the independent-family count to stay fixed. Remove identity/split
    guards or replace family resampling with attempt resampling and require named controls to
    fail. Remove the inert-proposal guard and require the no-side-effects control to fail.
    The whole-pipeline control builds a real matrix manifest with planCanaryMatrix. It runs real
    executeCanarySchedule into a real CanarySlotOwner in a private temporary directory, through
    an injected transport that counts calls and must end at zero real provider invocations. It
    then runs the command's analysis mode. Hand-written owner rows and fabricated receipts are
    forbidden. Each of the following is a separate discriminating check and must fail its named
    criterion. Delete one terminal row (17 must report never-claimed). Leave one row started (17
    must report started-not-terminal). Alter a receipt's scheduleDigest (16). Feed an imported
    JSON receipt (15). Strip assignedProbability from a worker.assignment row (18 must report
    observational). Turn an unavailable grade into a failure signature (19). Add an outcome key to
    the router feature input, or overwrite a decision receipt (20). Draw the baseline from
    evaluation-split families (21). Fall back to the oracle when a receipt is missing (24).
    Restore each change and require complete verified-file TAP with zero failures.
