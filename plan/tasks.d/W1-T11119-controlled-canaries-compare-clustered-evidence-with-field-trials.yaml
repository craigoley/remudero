  rationale: >-
    The approved benchmark must measure router value without treating observational model win
    rates as a randomized comparison. Existing paired analysis is descriptive and supplies no
    uncertainty estimate. Repeated attempts are not independent cases. Failure patterns can
    inform a bounded improvement proposal without executing that proposal.
    The 2026-11-07 refusals of criteria 8, 10 and 14 were outside-declared-files: no durable
    producer of frozen router decisions, qualified static baselines, or recorded field assignment
    existed inside the old file set, so the files are widened and the producers are named.
    Settled by lookup: is this already filed or decided? -> no; no other task declares
    model-canary-router-decision-receipt, model-canary-static-baseline, or a routing.experiment
    whitelist in projectFlowRow (grep of plan/tasks.d). Its proposed criteria exist only in closed
    unmerged PRs #17189 and #17192, folded in here as the operator directed for PR #17132.
    Settled by lookup: where is real field assignment provenance recorded? -> worker_assignment.routing.experiment,
    typed ExperimentIntentionToTreat {id, unit, assignedArm, assignedProbability, servedArm,
    crossover} (src/lib/worker.ts routing.experiment; src/lib/routing-experiments.ts).
    Settled by lookup: does projectFlowRow carry it today? -> no; it reads worker_assignment
    requested/selected/stack only (src/lib/field-trials-flow.ts projectFlowRow).
    Settled by lookup: how does the expected matrix bind? -> ModelCanaryMatrixPlanV1 shards carry
    schedule and slotMappings {nativeSlotId, matrixSlotId, replicateId, caseId, configId, aaLabel}
    (src/lib/model-canary-matrix-plan.ts).
    Settled by lookup: what is a terminal owner receipt? -> canary_slots_v1 rows with
    phase terminal read by readOwnedPrivateTraceReceipt, which reports
    canary-owner-terminal-receipt-missing otherwise (src/lib/model-canary-owner.ts).
    Settled by lookup: is a registered-epoch receipt verifiable? -> only when loadPaidPilotProtocol
    returns the matching version, pilotId and revisions (src/lib/field-trials-flow.ts
