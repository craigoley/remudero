  falsifier: >-
    Use paired positive controls and known missing/mismatched inputs. Duplicate repeats within
    each family and require the independent-family count to stay fixed. Remove identity/split
    guards or replace family resampling with attempt resampling and require named controls to
    fail. Remove the inert-proposal guard and require the no-side-effects control to fail.
    Whole pipeline: build a real manifest and a real CanarySlotOwner in a private temp dir. Use an
    injected transport that asserts zero real provider calls. Prepare, run, analyse and export,
    then do each of the following one at a time on a fresh copy, and require the named criterion
    to fail or return the named unavailable state:
      delete a terminal receipt (15/17 never-claimed or started-not-terminal block);
      alter the shard schedule digest (16 shard-absent/binding-conflict);
      add an unmapped receipt (17 named excluded extra);
      corrupt or drop routing.experiment, or change assignedProbability (18/26/27 observational or unavailable, probability never recomputed);
      replace a grader reason with a missing trace or scorer error (19 evidence gap);
      delete, alter or overwrite a decision receipt (20/24 refused);
      drop the development split or overlap the splits (21/23 unavailable, no oracle fallback).
    Every run asserts no ledger, task, schedule, policy, promotion, budget or provider-call
    effects, and removes its temp dir afterwards.
