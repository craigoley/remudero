      proof: 'grep: test("W1-T9619: a gate run sees no credential environment variables" in test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
    - claim: "a gate run never executes bin/rmd or a run-task bundle from the worktree, and runs the harness code with --repo-root"
      proof: 'grep: test("W1-T9619: a gate run never executes bin/rmd from the worktree" in test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
    - claim: "a preflight-summary.json written inside the worktree is not trusted: it cannot turn the gate's verdict into a pass"
      proof: 'grep: test("W1-T9619: a worker-written preflight summary is not trusted" in test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
    - claim: "a gate that cannot be contained reports unmeasured with its reason and never a pass"
      proof: 'grep: test("W1-T9619: a gate that cannot be contained is unmeasured, never a pass" in test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
    - claim: "a core worktree and a consumer worktree are both still measured, and a failing step is still handed back"
      proof: 'grep: test("W1-T9619: core and consumer worktrees are both still measured" in test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
    - claim: "the new suite passes"
      proof: 'unit test: test/the-preopen-gate-runs-trusted-code-with-a-scrubbed-environment.test.ts'
  falsifier: |
    Restore execFile's inherited environment. A fixture parent environment holding a sentinel credential variable
    then reaches the child, which records it, and the first test fails. Restore preopenGateLaunch's
    existsSync(<worktree>/bin/rmd) branch, and a fixture worktree whose bin/rmd records that it ran is executed,
    and the second test fails. Restore readGateSummary over preflightSummaryPath(worktreePath), and a fixture whose
    harness-observed run fails but whose worktree holds a fresh passing summary reads as pass, and the third test
    fails. Fall back to an uncontained run when the sandbox probe fails, and the fourth test reads pass and fails.
