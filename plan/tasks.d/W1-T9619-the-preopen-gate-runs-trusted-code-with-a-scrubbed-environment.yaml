- id: W1-T9619
  title: "THE PRE-OPEN GATE RUNS TRUSTED CODE WITH A SCRUBBED ENVIRONMENT: for a core build, defaultRunGate starts the worktree's own bin/rmd or that worktree's run-task bundle, which is code the worker just wrote, before any review, in the daemon process's full environment and outside any sandbox; runPreopenGate then takes its verdict from coverage/preflight-summary.json inside that same worker-writable tree. Run the gate from trusted harness code with the worktree as data, give it an allowlisted environment with no credentials, contain it the way proof children are contained, and take the verdict only from what the harness itself observes"
