      proof: "unit test: test/console-merge-hold-control.test.ts"
    - claim: "engage and release call the existing merge-hold writer with bearer-derived actor, mandatory reason and exact fleet or PR scope rather than appending a console-only decision"
      proof: "unit test: test/console-merge-hold-control.test.ts"
    - claim: "the route is high-tier and a missing or stale confirmation nonce performs no write"
      proof: "unit test: test/console-merge-hold-control.test.ts"
    - claim: "malformed action, reason, PR or task scope is refused before any ledger append, while releasing an already-clear scope is an idempotent no-op"
      proof: "unit test: test/console-merge-hold-control.test.ts"
    - claim: "the UI confirmation names action, scope and reason and refreshes from the read-back snapshot rather than assuming the write succeeded"
      proof: "unit test: test/console-merge-hold-control.test.ts"
    - claim: "the console adds no auto-merge arm, merge-method selection, GitHub merge, branch-protection bypass, daemon lifecycle or deploy action"
      proof: "unit test: test/console-merge-hold-control.test.ts"
  note: |
    W1-T2581 already shipped the supported writer, W1-T1000002 already shipped enforcement, and
    W1-T1000003 already shipped the status-board read. This task wires those existing mechanisms
