- id: W1-T2719
  title: "THE DURABLE MERGE HOLD IS ENFORCED AND CLI-WRITABLE BUT THE CONSOLE CANNOT SEE OR OPERATE IT — expose the existing refusal as a nonce-protected fleet or PR control without giving the dashboard a new merge primitive"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 60.00
  files:
    - src/lib/board.ts
    - src/lib/panel-actions.ts
    - src/lib/serve.ts
    - test/console-merge-hold-control.test.ts
    - scripts/source-size-baseline.json
  origin: oper#console-operator-merge-override-2026-09-02
  plan_refs: ["P22", "W1-T2581", "W1-T1000002", "W1-T1000003"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED AT origin/main 4cc3efde. `rmd merge-hold engage|release` already calls
    `applyOperatorMergeHold`, appends an attributable durable decision, reads it back through
    `automergeHoldFromLedger`, and is enforced by every auto-merge path. `buildStatusBoard` already
    derives the currently-standing fleet and PR holds into `needsMe.mergeHeld`. The console mounts
    no merge-hold route, renders no standing hold, and offers no engage/release control. An
    operator using the dashboard therefore has to leave it for the CLI at exactly the moment a PR
    queue needs an override.

    REUSE THE EXISTING DECISION AND WRITER. Project `needsMe.mergeHeld` into the existing atomic
    `BoardSnapshot` from the same `buildStatusBoard` result and same already-parsed ledger lines
    `board.ts` uses for blocked PRs. Do not re-derive hold state from check, review or UI state.
    Add one exact-match write route accepting `action: engage|release`, mandatory non-empty
    `reason`, optional positive `prNumber`, and optional matching `taskId` only for PR scope. The
    authenticated bearer-derived actor is the `by` value; the browser never supplies or spoofs an
    identity. The handler calls `applyOperatorMergeHold` and returns its read-back result.

    THIS IS HIGH CONSEQUENCE. Register the route at the existing high tier so the service requires
    the same fresh confirmation nonce used by other high-tier console controls. Malformed input,
    missing reason, invalid PR/task scope, stale nonce or read-back mismatch writes nothing. An
    already-clear release remains the existing idempotent no-op. Render a fleet control plus one
    action on each live PR queue row; every confirmation names the exact scope, action and reason.

    PRESERVE THE OPERATOR OVERRIDE BOUNDARY. Engaging a hold withdraws or prevents daemon auto-merge
    only because the existing sweep reader already does so. Releasing it merely removes that
    refusal and lets the next ordinary sweep re-derive the PR. This route never arms auto-merge,
    selects a merge method, bypasses branch protection, presses GitHub merge, starts or stops the
    daemon, or deploys anything. Manual squash stays an operator action through the PR link, which
    preserves the users stated escape hatch when the queue is stuck.

    RULE 19: risk is high for span and consequence. The change crosses the board projection,
    panel write route, inline console and proof, but delegates the material decision to the
    existing production writer and reader rather than making a parallel control plane.
  acceptance:
