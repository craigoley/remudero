    READ at origin/main:
    - decideMemoryPressure (src/lib/daemon-memory-policy.ts): at share >= restartShare it first sets the tightest
      percent, TIGHTEST_HEAP_GROWING_PERCENT 10. On the next reading, still at or above restartShare with 10 in
      force, it returns tier restart. Nothing compares the reading with what the process held at boot.
    - createDaemonMemoryGovernor keeps only inForce and tier between steps. The daemon loop (src/lib/daemon.ts,
      the W1-T3335 block after memoryGovernor.step()) takes tier restart to daemon.heap_pressure_exit, then
      drainBeforeRestart, then summary("heap_pressure"). daemonExitCode maps heap_pressure to 75.
    - The daemon's governor is built in src/run-task.ts as createDaemonMemoryGovernor({ policy }). daemon.ts falls
