  design: |
    1. The governor records a boot baseline: rss plus swap at its first reading after boot. Read it with the same
       reader it already uses, through the existing read port, so tests inject it.
    2. When the share is at or above restartShare and charged is at most k x baseline, a restart cannot get the
       daemon below the line. The governor then holds: no restart, a named hold tier or flag, and no
       heap_pressure exit. It ledgers daemon.memory_restart_futile with baseline_bytes, charged_bytes, line_bytes
       (restartShare x budget), share, restart_share, the margin k, budget_bytes and budget_source. It ledgers that
       once when the hold begins and again only when the hold ends or changes, never every tick.
    3. When charged rises above k x baseline, the restart path is unchanged: the tightest factor first, then
       restart. A daemon whose first reading was under the line (core) behaves exactly as today.
    4. While held, if heap_used is under a share H of charged, the governor keeps the policy's own growth percent
       instead of TIGHTEST_HEAP_GROWING_PERCENT, because a tighter GC cannot reach bytes outside the heap. It ledgers
       heap_share on the futile row. Outside the hold, tightest-first is unchanged, so core's restart path is too.
       The governor's default reads its own heap statistics, so the wiring in src/run-task.ts does not change.
    5. OPERATOR DECISIONS, open at filing. The build ships each as a named, exported constant and its PR names them
       for a ruling:
       - k, the baseline margin. Suggested 1.25. It must sit above a boot's own early growth and below core's
         effective-restart ratio.
       - H, the heap share below which the tightest factor is skipped while held. Suggested 0.4. The site p90 at
         boot is 0.41.
       - An optional cross-boot backstop: stop after N consecutive heap_pressure exits within M ticks. It is not in
         this task, because the baseline hold ends the loop in-process. It is named as the fallback if the hold
         proves insufficient.
    6. This task changes no threshold. restartShare, tightenShare, heapGrowingPercent, the V8-limit backstop
       (heapPressureDetail, HEAP_PRESSURE_RESTART_FRACTION), exit codes and the drain stay unchanged. A V8-limit
       exit is never held.
    7. Update the existing loop test's fixture so it grows from a first reading under the line, and keeps proving
       that a real growth restarts.
