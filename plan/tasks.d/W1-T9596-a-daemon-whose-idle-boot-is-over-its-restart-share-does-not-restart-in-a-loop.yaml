    - test/the-daemon-heap-stays-proportional-to-its-live-set.test.ts "the daemon loop drains and restarts on the
      cgroup share" feeds one constant over-the-line reading from the first tick and expects a restart. Under this
      design that fixture is the futile case, so its fixture must grow from a lower first reading.
    INFERRED:
    - A restart cannot bring a daemon below what it is charged at idle boot. When the first reading is already over
      the line, every restart is futile and the loop never ends.
    - About three quarters of the charged bytes are outside the V8 heap (heap_used 0.26 of rss+swap). So growth
      percent 10 adds GC CPU and frees little.
    - Console sits at its line (0.48-0.50 at boot). If the tuner shrinks console to its 2048 MiB floor, its line
      becomes 1024 MiB, below its idle boot, and console enters the same loop.
    RELATED TASKS:
