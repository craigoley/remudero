- id: W1-T12523
  title: "A test's child processes record their reads into the parent suite's read-map record"
  repo: remudero
  depends_on: [W1-T12505]
  priority: 1.1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the read hook decides which suites a read-mapped change selects; a lost child read narrows a run that must be wide
  band_meaning: blast-radius
  origin: operator-session#checking-off-the-author-path-2026-11-13
  plan_refs:
    - W1-T6084
    - W1-T12505
  files:
    - test/setup/read-map.ts
    - test/setup/tmp-hygiene.ts
    - src/lib/affected-suites.ts
    - test/a-tests-child-processes-record-their-reads-into-the-parent-suites-read-map-record.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "When RMD_READ_MAP_DIR is set, a node child process a suite starts loads the read hook and writes its reads and listings into a record credited to the parent suite, and the parent's merged record holds them"
      proof: "grep: W1-T12523 criterion 1 in test/a-tests-child-processes-record-their-reads-into-the-parent-suites-read-map-record.test.ts"
    - claim: "A suite whose every child was a node process that loaded the hook and flushed its record keeps `unknownDescriptors: false`; a child that is not node, does not load the hook, drops the environment, or exits without a record leaves the suite unknown"
      proof: "grep: W1-T12523 criterion 2 in test/a-tests-child-processes-record-their-reads-into-the-parent-suites-read-map-record.test.ts"
    - claim: "invariant:unknown-stays-unknown — a child read the hook cannot credit never turns a suite from unknown to known"
      proof: "grep: W1-T12523 criterion 3 in test/a-tests-child-processes-record-their-reads-into-the-parent-suites-read-map-record.test.ts"
  rationale: |
    W1-T12505 narrows a read-mapped change per path, but a suite that starts a child process has unknown descriptor
    coverage, so the selector must pick every unknown suite that names the changed path. MEASURED at ecd94c0da: at least
    2,376 of 4,628 suites spawn, and two deploy readers run through the real preload both wrote `unknownDescriptors: true`.
    test/setup/read-map.ts marks a suite unknown on any exec/execFile/spawn/fork call (`installReadMap`), because a
    child's reads are not observed. A child read that is not observed is the residual gap W1-T12505 names: a child that
    runs src/ code which reads a deploy/ file the suite never names.
  design: |
    1. When RMD_READ_MAP_DIR is set, pass the preload (test/setup/tmp-hygiene.ts through NODE_OPTIONS --import),
       RMD_READ_MAP_DIR, RMD_READ_MAP_ROOT and a parent-suite variable to node children the suite starts.
    2. In a child, `installReadMapFromEnv` credits the record to the parent suite named by that variable, writes its own
       record file, and the parent merges child records into its own at flush.
    3. The suite stays unknown unless every child it started was a node process that wrote a record. A non-node child, a
       child whose environment dropped the variables, or a missing record keeps it unknown.
    INVARIANT unknown-stays-unknown: a child read the hook cannot credit never turns a suite from unknown to known.
    NOT IN SCOPE: non-node children (git, bash); the selector's per-path rule (W1-T12505).
  falsifier: |
    Drop the child's record from the parent's merge and criterion 1 must fail. Mark a suite known when one child wrote no
    record and criterion 3 must fail.
  note: |
    Id W1-T12523 reserved for run-W1-T12505-1794590412000 with ~/rmd-work/bin/reserve-id.sh.
