      proof: "grep: W1-T13676 criterion 4 in test/console-api/serve/a-fresh-serve-supervisor-spaces-its-first-handoff-from-its-own-boot.test.ts"
  rationale: |
    WHY: OBSERVED in the host ledger union 2026-11-18: a fresh serve container was ready at 06:01:29Z (cold_start_ready)
    and handed off again at 06:21:51Z (serve.handoff_done, checkout_behind): a second restart 20 minutes after a boot,
    each a cold fold of the ledger. The supervisor's lastDoneAt is undefined at boot, so W1-T13303 criterion 2 lets a
    supervisor with no handoff yet hand off at once.
    DECISION: Craig chose "Yes, seed spacing from the ledger" on 2026-11-18 11:54Z ("a new container counts its own
    boot as the last restart, so it won't hand off again minutes later"). The boot is the restart serve's own ledger
    records (serve.supervisor_ready), so the seed is the boot time the supervisor already knows; no ledger read is added.
    SCOPE: this changes serve's production supervisor only, through a new option. W1-T13303 criterion 2 stays true of
    a bare createServeSupervisor (its test is unchanged), and that is what criterion 4 here guards; for production it
    is superseded by this task.
  design: |
    INVARIANT seam-default-unchanged: without spaceFromBoot nothing changes.
    1. ServeSupervisorOptions gains spaceFromBoot. When true and spacingBaseMs > 0, start() sets lastDoneAt to the
       clock right after serve.supervisor_ready. Pressure is not raised, so the wait is the base window.
    2. serve-supervisor-main.ts runServeSupervisor passes spaceFromBoot: true.
  falsifier: |
    Drop the seed: criterion 1 fails. Drop the production option: criterion 3 fails. Seed regardless of the option:
    criterion 4 fails.
  note: |
