    - claim: "Serve's production supervisor (runServeSupervisor) passes spaceFromBoot: true beside the production spacing base"
      proof: "grep: W1-T13676 criterion 3 in test/console-api/serve/a-fresh-serve-supervisor-spaces-its-first-handoff-from-its-own-boot.test.ts"
    - claim: "invariant:seam-default-unchanged — a createServeSupervisor without spaceFromBoot still hands off its first ask at once"
