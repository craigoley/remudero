  rationale: |
    At main a9eb76ff103a plan-pr-merge-safety.ts:228-229 fixes STDOUT_CAP_BYTES at 1<<26.
    readPlanMergeSafetySteps at :444-461 requests the monolith and every YAML shard in ONE
    cat-file --batch output, then reads/parses that entire output under the cap. The new file
    descriptor transport prevents held-loop pipe stalls but keeps this aggregate size limit.
    Measured using git ls-tree -rl sizes (not expanded working copies): 2026-10-06 main7bc018043e58
    has3014 shards/18,963,857 bytes; 2026-10-30 main6f907f51a9e0 has4649/27,929,826;
    2026-11-06 main202ec738c748 has4933/29,298,448. Including monolith, exact SHA-1 batch
    headers and trailing newlines gives20,191,285;29,243,614;30,627,014 bytes respectively.
    Month-to-current growth336,644 bytes/day projects cap in108.4 days; last-week197,661/day
    projects184.6 days. These are linear hypotheses, not promised arrival dates or live failures.
    Both are within months; preserve measurements and recalculate before implementation.
  design: |
    Keep the current output cap and fail-closed plan validation. Request immutable blob IDs
    in deterministic byte-bounded groups derived from their ls-tree sizes, the batch framing
    overhead and existing STDOUT_CAP_BYTES. Do not guess a fixed shard-count chunk size or raise
    the cap. A blob that cannot itself fit the existing bound yields an explicit unreadable
    refusal. Parse each response against exactly its requested IDs, sizes and order; include
    every monolith/shard once in mergedPlanState. An empty, omitted, truncated, corrupt or
    reordered response must never produce a safe merge. Preserve conflict and unsafe-plan
    outcomes, native git errors, descriptor cleanup, off-loop writes and existing cancellation.
    Expose the existing byte bound through a test seam so scaled fixtures cross it without
    allocating tens of MiB. Exercise the real native Git transport on a small private repo,
    plus fake error and framing cases. No host/container probe or real merge in tests.
  acceptance:
