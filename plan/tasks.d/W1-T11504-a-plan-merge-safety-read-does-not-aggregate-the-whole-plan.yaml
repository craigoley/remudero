    - claim: "An individually oversize blob, missing or reordered response, truncation, corrupt framing, git failure or conflict stays explicit unreadable/unsafe/conflict and cannot authorize a merge"
      proof: "grep: W1-T11504 criterion 2 in test/plan/a-plan-merge-safety-read-does-not-aggregate-the-whole-plan.test.ts"
