  rationale: |
    The feedback reports an unavailable product field being coerced to false in another
    repository. That incident is second-hand evidence, not a reproduced Remudero outage
    or an operator ruling. Its count of 74 defaults is historical and must be remeasured.
    Grounding found local absent-value rules and fixes, not a systematic boundary inventory:
    W1-T528 preserves draft uncertainty; W1-T1280 distinguishes unknown mergeability;
    W1-T10270 supplies recorded-review replay, not external endpoint contract coverage.
    learnings/architecture.yaml says an absent check has not passed. None establishes that
    every omitted external field is invalid or that all readers need one error policy.
    In particular, open-prs-rest.ts documents that mergeable and mergeable_state are
    intentionally absent from list responses, and its module contract excludes alarms.
    The standing recurrence-is-a-class-signal doctrine requires bounded observation before
    class-wide repair. Establish which boundaries actually collapse required-field absence,
    and which omissions are legitimate, before changing runtime decisions or adding a gate.
  design: |
    NO-INVARIANTS: This adds an offline observation tool and report, with no prior tool output or receipt contract to preserve and no production behavior changes.
    Prior-behavior inventory: existing production output buckets, legacy receipts, defaults,
    error/unknown paths and public side effects remain owned by their existing readers.
    In particular, preserve draft uncertainty, legitimate list-response mergeability
    omissions, and caller-visible unknown states; observation must not rewrite those
    dispositions or emit runtime alerts, ledger rows, network requests or provider calls.
    The new tool's complete/incomplete outcomes and report schema are new behavior,
    covered by the acceptance criteria below rather than inherited invariants.

    Ship an explicit offline observation script and a checked-in machine-readable report.
    This is a one-shot source/fixture observation at the implementation's named committed
    SHA, not a daemon job or a claim about live drift frequency. Read src/ and test/ in
    that tree; enumerate all files opened, unreadable files, and candidate counts. Bound
    the run to that checkout with explicit file/byte limits; incomplete or truncated input
    is an incomplete observation, never a complete zero. Do not read host state or ledger.

    Enumerate nullish and logical fallback reads of payload fields, including false, empty
    collections and empty strings, and related Boolean coercions. Publish the supported
    syntactic forms and limitations rather than claiming exhaustive semantic dataflow.
    Classify candidates external, internal, or unresolved using inspectable evidence;
    lexical matches alone cannot assert an external boundary. Unknown remains unknown.
    Produce a bounded manually reviewed cohort of at most 24 sites, at most six per family:
    GitHub REST, GraphQL, gh CLI JSON, and model-provider responses. Name the selection
    rule, denominator, exclusions, and uncovered families. Include open-prs-rest.ts's draft
    and mergeability readers and worker-provider.ts's JSON event readers as controls;
    trace actual GraphQL and gh JSON callers from source rather than assuming filenames.

    Each reviewed row names transport/endpoint or CLI argv, production reader and caller,
    field path, source location, evidence for required/optional/conditionally absent status,
    and the different outcomes of absent, null, false, empty, and wrong-type values.
    Record existing test paths, whether payloads are recorded or author-written, and any
    existing missing-field signal and its consumer. An unavailable payload or unknown
    contract is an evidence gap, not a successful contract test. Preserve all existing
    per-site dispositions. The hypothesis is falsified for a site when omission is valid
    or the caller already exposes uncertainty safely; report those rows alongside hazards.

    Inventory available recorded payloads with provenance and redaction status; do not
    manufacture recordings, fetch new payloads, or make provider/model calls. Use only
    already checked-in non-sensitive artifacts. The report must identify which production
    reader can replay each recording and where no usable recording exists.

    End the report with evidence-based recommendations for the requested capability:
    a small recorded-payload pilot per supported family, bounded refresh ownership and
    stale/unavailable states, field-specific missing-value semantics and caller-visible
    drift signals, and an external-default census with measured precision. Name exact
    proposed files and dependencies for any later work, or recommend no change where
    evidence does not support it. A universal throw/nonzero policy must not be assumed:
    normal optional omissions and daemon uncertainty need different handling from invalid
    required fields. Runtime helpers, migrations, alerts, refresh scheduling and enforcement
    wait for this report and separate reviewed plan filings; this task adds none of them.

    Test the script against a small seeded source tree with labelled external, internal,
    unresolved and legitimate-omission cases. Exercise its real CLI with a temporary root,
    including unreadable/malformed input and an exceeded bound. A known external positive
    control must be seen before a zero can be reported. Verify new test placement from
    imports with rmd test-place; use package aliases and the shared repository-root helper.
  acceptance:
    - claim: "The offline census reports corpus coverage, supported forms and external/internal/unresolved candidates, and sees a labelled positive control"
      proof: "unit test: W1-T12821: census reports coverage and classifications with a positive control"
    - claim: "The real CLI distinguishes incomplete input and exceeded bounds from a complete zero and never needs network or host state"
      proof: "unit test: W1-T12821: offline CLI separates incomplete input and exceeded bounds from complete zero"
    - claim: "The report schema preserves per-site absence semantics, evidence gaps, fixture provenance, cohort limits and separate recommendations without turning valid omissions into hazards"
      proof: "unit test: W1-T12821: report schema preserves per-site evidence and rejects unsupported completeness"
    - claim: "The committed observation artifact includes the reviewed cohort and follow-up recommendations"
      proof: "grep: follow_up_recommendations: in plan/external-payload-observation.yaml"
  note: |
    One bounded observation concern; no production behaviour or required-check change.
    The report validator must reject empty reviewed cohorts, missing family dispositions,
    missing source SHA and unsupported completeness claims, not merely check section keys.
    The wider contract-test/refresh/helper/alert/census programme waits for this measurement;
    lack of a shared helper alone is not evidence that existing readers are unsafe.
