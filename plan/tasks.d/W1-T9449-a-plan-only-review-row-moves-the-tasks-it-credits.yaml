- id: W1-T9449
  title: "A PLAN-ONLY REVIEW ROW MOVES NO TASK ON THE BOARD PROJECTION — boardDirtForRow treats daemon.boot and a plan_only pr.opened as cross-task, but not a plan_only review.posted or its rotation marker review.plan_only_reviewed, though isPlanOnlyFilingPr and hasPlanOnlyReviewForPr read both whole-ledger for another task's credit; the marker carries review_task_id, not task_id, so it dirties nothing at all and only the 10-minute oracle heals the task"
  repo: remudero
  depends_on: []  # W1-T9436 (filing PR #11664, not on main at filing time) rewrites how the derive reads these rows but keeps the dirty-set; land in either order, rebasing on whichever merges first
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium  # Rule 19: one concern — the board projection's dirty-set rule for plan-only review rows; one src file and one new test
  band_meaning: span
  origin: "operator session 2026-10-14: found by the W1-T9436 filing agent while reading the board projection's cross-task lookups"
  plan_refs: [W1-T6253, W1-T6369, W1-T5552, W1-T3996]
  files:
    - src/lib/board-projection.ts
    - test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ on origin/main 5fa4c003e. Symbols, not lines.
    THE RULE. src/lib/board-projection.ts's header says a cross-task row moves every task "because
    environmentChangedSince, lifetimeDispatchTally and isPlanOnlyFilingPr read them whole-ledger".
    BOARD_CROSS_TASK_STEPS is `new Set(["daemon.boot"])`, and boardDirtForRow adds one special case:
    `row.step === "pr.opened" && row.plan_only === true` returns `{ all: true }`. Every other row moves only the
    tasks named in its `task_id` or `task`.
    THE READERS. src/lib/status.ts computeLedgerIndex builds planOnlyReviewedHeads from every row whose step is
    review.posted or PLAN_ONLY_REVIEW_MARKER_STEP ("review.plan_only_reviewed", src/lib/ledger-carry.ts) with
    plan_only true. derivePrPrecedence reads it through hasPlanOnlyReviewForPr (durable-credit revalidation,
    W1-T3996/W1-T5552) and isPlanOnlyFilingPr with a head sha (the trailer and head-branch credit rungs). Those
    calls ask about the PR a task's CREDIT points at, which is a plan-only filing PR, so the reader is the credited
    task, not the task the review row names.
    THE GAP. A plan_only review.posted row moves only the task in its own task_id. The rotation marker
    (planOnlyReviewMarkers, src/lib/ledger-carry.ts) is written as { pr_url, head_sha, plan_only, review_task_id,
    reviewed_at }: no task_id and no task, so boardDirtForRow names no task and the row moves nothing. Either way
    the credited task keeps its reused projection until the no-reuse oracle (BOARD_ORACLE_INTERVAL_MS, 10 min)
    diffs, heals and reports it. The oracle is a measurement of the dirty-set rules, not one of them.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and the plan/ trees of all 369 readable origin heads for
    BOARD_CROSS_TASK_STEPS, plan_only_reviewed and boardDirtForRow. Main has 0. The one head hit is W1-T9436
    (plan-file-1791981352331, PR #11664), which names these rows among "five narrow cross-task lookups" the
    derive will read from the store; its design changes what a re-derived task reads, not which tasks are
    re-derived, and its acceptance has no dirty-set criterion. No head modifies src/lib/board-projection.ts.
    Positive control: the same sweep finds `^- id: W1-T9436$` on that head only.
  design: |
    1. In boardDirtForRow, beside the plan_only pr.opened case, treat a plan_only review.posted row and every
       review.plan_only_reviewed marker as cross-task (`{ all: true, reason }`), under the same `rules.crossTask`
       switch. Name the readers in the header comment's cross-task line (isPlanOnlyFilingPr,
       hasPlanOnlyReviewForPr).
    2. If measuring the fixture shows the all-task re-derive is the cost, a narrower rule is acceptable instead:
       move the tasks whose held projection credits that row's pr_url. Whichever rule is chosen, the oracle must
       read zero mismatches for it in the test below.
    Tests go in the new file, `test(` titles verbatim as in the proofs below. Build the projection over a fixture
    plan with a task credited by a plan-only filing PR, append the review row (and separately the marker), update
    WITHOUT an oracle pass, and compare the reused projection with a no-reuse derive.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts"
    - claim: "appending a plan_only review.posted row re-derives the task credited by that PR before any oracle pass"
      proof: 'grep: test("W1-T9449: a plan-only review row re-derives the task its PR credits" in test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts'
    - claim: "appending a review.plan_only_reviewed marker with no task_id re-derives that task too"
      proof: 'grep: test("W1-T9449: a plan-only review marker with no task id re-derives the task its PR credits" in test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts'
  falsifier: |
    Against main, append the marker row: boardDirtForRow returns `{ all: false, tasks: [] }`, the credited task keeps
    its reused projection, and it differs from the no-reuse derive, so the marker test fails. Drop only the
    review.posted half of the rule and the first test fails the same way.
