  rationale: |
    READ on origin/main 5fa4c003e. Symbols, not lines.
    THE RULE. src/lib/board-projection.ts's header says a cross-task row moves every task "because
    environmentChangedSince, lifetimeDispatchTally and isPlanOnlyFilingPr read them whole-ledger".
    BOARD_CROSS_TASK_STEPS is `new Set(["daemon.boot"])`, and boardDirtForRow adds one special case:
    `row.step === "pr.opened" && row.plan_only === true` returns `{ all: true }`. Every other row moves only the
    tasks named in its `task_id` or `task`.
    THE READERS. src/lib/status.ts computeLedgerIndex builds planOnlyReviewedHeads from every row whose step is
    review.posted or PLAN_ONLY_REVIEW_MARKER_STEP ("review.plan_only_reviewed", src/lib/ledger-carry.ts) with
    plan_only true. derivePrPrecedence reads it through hasPlanOnlyReviewForPr (durable-credit revalidation,
    W1-T3996/W1-T5552) and isPlanOnlyFilingPr with a head sha (the trailer and head-branch credit rungs). Those
    calls ask about the PR a task's CREDIT points at, which is a plan-only filing PR, so the reader is the credited
    task, not the task the review row names.
    THE GAP. A plan_only review.posted row moves only the task in its own task_id. The rotation marker
    (planOnlyReviewMarkers, src/lib/ledger-carry.ts) is written as { pr_url, head_sha, plan_only, review_task_id,
    reviewed_at }: no task_id and no task, so boardDirtForRow names no task and the row moves nothing. Either way
    the credited task keeps its reused projection until the no-reuse oracle (BOARD_ORACLE_INTERVAL_MS, 10 min)
    diffs, heals and reports it. The oracle is a measurement of the dirty-set rules, not one of them.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and the plan/ trees of all 369 readable origin heads for
    BOARD_CROSS_TASK_STEPS, plan_only_reviewed and boardDirtForRow. Main has 0. The one head hit is W1-T9436
    (plan-file-1791981352331, PR #11664), which names these rows among "five narrow cross-task lookups" the
    derive will read from the store; its design changes what a re-derived task reads, not which tasks are
    re-derived, and its acceptance has no dirty-set criterion. No head modifies src/lib/board-projection.ts.
    Positive control: the same sweep finds `^- id: W1-T9436$` on that head only.
    AMENDED 2026-10-17 (batch1017 filer, coordinator brief item 4). READ at origin/main 2f93023e5, where W1-T9719
    (PR #12493) has merged. Symbols, not lines.
    - W1-T9719 replaced "a cross-task row moves every task" with recorded reads: recordingCrossReads wraps the
      derive's ledger index and records each ask of a BOARD_CROSS_TASK_STEPS step (`step:<name>`) and of
      planOnlyFilingPrUrls (`filing:<url>`, or `filing:*` for a whole-set read). Each task's keys persist in
      task_cross_read, and crossDigestOf folds their current answers into the task's stamp.
    - Its planOnlyReviewedHeads getter returns index.planOnlyReviewedHeads UNRECORDED, and noteCrossRow counts only
      daemon.boot and plan_only pr.opened rows. So the defect above still stands at main, and a plan_only
      review.posted or review.plan_only_reviewed row still re-derives no task but the one its task_id names.
    - With W1-T9719 merged, the all-task rule of this shard's first design would re-derive every task on each
      plan-only review, the cost W1-T9719 just removed for filings. The narrower rule this shard already allowed
      (design step 2 before the amendment) is now one more recorded read.
    Not claimed and not shipped at amendment: no refs/rmd-dispatch/W1-T9449 and no run-W1-T9449-* head
    (logs-8864/batch1017-W1-T9449-ls-remote.txt, 2026-10-17 04:46Z), no `Remudero-Task: W1-T9449` trailer on
    origin/main, and no remote head's plan diff touches this shard (436 heads, 2 objects unreadable:
    heartbeat-azure and run-W1-T9284-1792167647465).
  design: |
    AMENDED 2026-10-17: build on W1-T9719's recorded cross-task reads instead of making these rows dirty every task.
    1. Record the read. recordingCrossReads wraps planOnlyReviewedHeads as it wraps planOnlyFilingPrUrls: `get(url)`
       and `has(url)` record `reviewed:<url>`, and any other access (iteration, size) records `reviewed:*`. This is
       the read isPlanOnlyFilingPr (with a head sha) and hasPlanOnlyReviewForPr make for a credited task.
    2. Count the row. A plan_only review.posted row, and every review.plan_only_reviewed marker (it carries
       review_task_id, not task_id), is noted like a plan_only pr.opened row: a per-url reviewed-heads answer (the
       url's head count, or its newest seq) plus a whole-map count and seq for `reviewed:*`. crossAnswer answers the
       `reviewed:` keys from them. A review.posted row still also dirties the task its task_id names, as today.
    3. A task with no record keeps W1-T9719's rule: any cross-task row moves it. boardDirtForRow's `{ all: true }`
       for these rows is only the "unrecorded" fallback, under the same rules.crossTask switch. Name the readers
       (isPlanOnlyFilingPr, hasPlanOnlyReviewForPr) in the header comment's cross-task line.
    4. Bump BOARD_PROJECTION_VERSION, since the stamp's cross part gains keys, and report these rows in
       `cross_task` on read_model.board_oracle as W1-T9719 reports filings.
    Tests go in the new file, `test(` titles verbatim as in the proofs below. Build the projection over a fixture
    plan with a task credited by a plan-only filing PR and an unrelated task. Append the review row (and separately
    the marker), update WITHOUT an oracle pass, and compare the reused projection with a no-reuse derive. The
    credited task must re-derive and the unrelated task must be reused (count derives through the update's
    cross_task).
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts"
    - claim: "appending a plan_only review.posted row re-derives the task credited by that PR before any oracle pass"
      proof: 'grep: test("W1-T9449: a plan-only review row re-derives the task its PR credits" in test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts'
    - claim: "appending a review.plan_only_reviewed marker with no task_id re-derives that task too"
      proof: 'grep: test("W1-T9449: a plan-only review marker with no task id re-derives the task its PR credits" in test/a-plan-only-review-row-moves-the-tasks-it-credits.test.ts'
  falsifier: |
    Against origin/main 2f93023e5, append the marker row. boardDirtForRow names no task, noteCrossRow is never
    reached, and the credited task's recorded keys hold no `reviewed:` entry, so its stamp is unchanged and it keeps
    its reused projection. That differs from the no-reuse derive, so the marker test fails. A plan_only
    review.posted row naming a different task fails the first test the same way. Recording the read but not
    counting the row (or the reverse) still fails both.
