  design: |
    No new count, timer or fixed bound. The operator's ruling: no hard thresholds.
    1. PROGRESS, READ FROM WHAT THE HOLD ALREADY HOLDS. Each dep-review pass computes a hold fingerprint: the head
       sha, the sorted red check names with each one's newest attempt identity (the selected rollup's run/attempt
       id and completion time), the refresh record for this head (requested, delivered), and the proposal registry
       entry covering this PR's bumps (feedback id). The state file stores the fingerprint and when it last changed.
    2. A REMEDY IN FLIGHT holds the ask: a refresh requested for this head and not yet answered by a new head, or a
       captured owned-build proposal whose task has not reached a terminal outcome. While one is in flight and its
       own evidence keeps moving, no ask is made.
    3. ESCALATE ON NO PROGRESS. The hold asks once per head when two successive passes read the same fingerprint
       and no remedy is in flight, so a red nothing will re-run is asked about on the next pass, not after a day.
       A remedy in flight whose evidence has not moved for longer than the longest gap that remedy kind has shown
       on holds that later recovered (learned from the state files' own history) asks too. With no such history
       yet, the ask waits for that remedy's own terminal signal.
    4. Delete DEP_REVIEW_HOLD_AGE_MS. The issue body names the evidence (fingerprint unchanged since <ts>, remedy
       state) in place of the age. Retirement, once-per-head asks and the corrupt-state refusal are unchanged.
    5. Tests (new file, `test(` titles verbatim as in the proofs below), driving `depReviewCommand` over the existing
       held-escalation fixture shape; update W1-T5022's aged-hold test to the new rule:
       - a hold whose red check is never re-run and has no remedy asks on the second unchanged pass;
       - a hold whose red check gets a new attempt, or whose refresh is in flight, does not ask while that moves;
       - a hold with no recovered history keeps an in-flight proposal un-asked until its task is terminal.
  acceptance:
