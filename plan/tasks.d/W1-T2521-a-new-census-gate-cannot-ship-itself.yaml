  rationale: |
    OBSERVED TWICE IN ONE WEEK, ON TWO PRs THAT DIFFER ONLY IN A FILENAME.

      #3331 (W1-T2488)  scripts/source-size-ratchet.mjs   + src/lib/ci-parity.ts (+10, registration)
                        -> `^scripts/[^/]*-ratchet\.mjs$` matches, so the script is INSTRUMENT the
                           moment it exists. detectInstrumentEntanglement refuses the PR. Remedy:
                           a two-PR split (#3345 lands the instrument, then main is merged into
                           #3331's head so its diff drops the instrument paths).
      #3335 (W1-T2491)  scripts/worker-branch-shape.mjs   + src/lib/ci-parity.ts (+9, registration)
                        -> matches no blocking pattern, so instrument-surface-completeness derives
                           it as a gate-rule-like path that is declared NOWHERE and fails `ci`
                           (1 of 11589). Remedy: an INSTRUMENT_SURFACE_EXCLUSIONS entry.

    Same shape, same week, two different refusals and two different remedies — selected by whether
    the author happened to put "-ratchet" in the filename. Neither author did anything wrong.

    THE CIRCULARITY, STATED PLAINLY. A census gate is only real once `src/lib/ci-parity.ts` knows
    about it, and that registration is a `src/` edit. Its rule logic is a `scripts/` file. Rule 25
    exists to stop a diff changing an instrument and the code it measures together — a good rule —
    but a gate's FIRST commit is inherently both. There is no ordering that satisfies it directly:
    ship the script alone and the completeness alarm fires (or, once promoted, nothing measures it);
    ship both and entanglement fires.

    THE EXISTING ESCAPE IS REAL BUT REACHABLE ONLY BY ACCIDENT. `INSTRUMENT_SURFACE_EXCLUSIONS`
    already documents the right answer as its second shape — "KNOWN GAP, WIDENING DEFERRED: the
    candidate genuinely IS gate-rule logic … Adding these to the BLOCKING INSTRUMENT_SURFACE list
    widens what refuses a PR, which W1-T402's design (clause v) requires measuring against real
    merged diffs first" — and it is never read by `detectInstrumentEntanglement`, so an entry clears
    the alarm without widening what blocks. That is exactly the path #3335 could take. #3331 could
    not: its filename had already made the script blocking, and no exclusion un-blocks it.

    WHAT THIS TASK SHOULD DECIDE (and the shard deliberately does not pre-judge): whether a gate's
    OWN INTRODUCING COMMIT is carved out of `detectInstrumentEntanglement` — the diff that first
    creates a script and first registers it is not the diff Rule 25 was written to catch, which is a
    LATER change moving an instrument and the thing it measures together. A carve-out keyed on "this
    path is NEW in this diff AND its registration is NEW in this diff" is narrow, checkable, and
    would have let both PRs through unmodified; the risk is that it also lets a genuinely entangled
    first commit through, which is what the test must pin.

    NOT IN SCOPE: promoting either script to INSTRUMENT_SURFACE (W1-T402 clause (v) wants that
    measured against merged diffs first), and the two PRs' own remedies, which are already applied.

    THE RISK BAND IS BLAST RADIUS: one src stem plus a test, but this edits the predicate that
    refuses PRs for entanglement — too wide a carve-out silently retires Rule 25.
