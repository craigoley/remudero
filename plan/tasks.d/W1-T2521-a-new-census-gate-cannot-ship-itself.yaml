- id: W1-T2521
  title: "A NEW CENSUS GATE CANNOT SHIP ITSELF, AND WHICH WALL IT HITS IS DECIDED BY ITS FILENAME — registering one requires editing `src/lib/ci-parity.ts` (src) while shipping `scripts/<name>.mjs`; if the name matches `^scripts/[^/]*-ratchet\\.mjs$` it is INSTANTLY an INSTRUMENT_SURFACE path and Rule 25 refuses the PR for entanglement with its own registration (#3331), and if it does not match, instrument-surface-completeness refuses it as undeclared (#3335) — two gates filed the same week, opposite refusals, same underlying circularity"
