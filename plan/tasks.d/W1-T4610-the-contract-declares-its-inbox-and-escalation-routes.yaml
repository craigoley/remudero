  rationale: |
    MEASURED 2026-09-27: scripts/openapi-route-baseline.json names 48 /v1 paths the daemon serves
    (declaredConsoleRoutes, W1-T4579's census) that openapi/daemon.yaml does not declare. W1-T4579
    made that baseline SHRINK-ONLY but filed nothing that shrinks it, so the spec has stayed at 43
    declared paths. remudero-console's CONSOLE-T84 audit pins this spec and baselines 36 console
    calls that are served but undeclared, so every one of them can be removed or reshaped by core
    with nothing on either side noticing, and packages/api-client — generated from this document,
    and by its own description the ONLY way a client talks to the daemon — cannot call them at all.
    This task declares the inbox and escalation routes: /v1/inbox, /v1/inbox/approve,
    /v1/inbox/decline, /v1/inbox/digests, /v1/inbox/reframe, /v1/inbox/restore, /v1/inbox/thread,
    /v1/inbox/thread/read, /v1/inbox/thread/reply, /v1/inbox/threads, /v1/escalation/answer,
    /v1/escalation/confirm, /v1/escalation/reply.
  design: |
    For each path, declare every method the route table serves
    (declaredConsoleRoutes/assembledRoutes), with the scope (read or write) and tier the route
    registers, its request body and query parameters, and a response schema derived from the
    handler's actual payload builder — never a bare `type: object` standing in for a shape the code
    defines. Regenerate packages/api-client with scripts/generate-api-client.mjs so the drift check
    stays green, and remove exactly these paths from scripts/openapi-route-baseline.json. A path
    whose payload is genuinely open-ended says so in its description. No route's behaviour changes.
    Sequenced after W1-T4609 so the chain never edits the spec, the generated client and the
    baseline concurrently.
  acceptance:
    - claim: "the inbox and escalation routes are declared in the daemon contract and have left the undeclared-route baseline"
      proof: "grep: /v1/inbox/threads: in openapi/daemon.yaml"
    - claim: "/v1/escalation/reply is declared too, so the census has removed it from the baseline"
      proof: "grep: /v1/escalation/reply: in openapi/daemon.yaml"
  falsifier: |
    Leave /v1/inbox/threads undeclared: the served-route census still lists it in the baseline and
    the grep for its path entry in openapi/daemon.yaml finds nothing.
