  design: |
    1. Reuse the existing once-captured validated closedSeed as a READ-ONLY cost-admission hint.
       Compute cached credit with the existing shippedSince/P9 logic and the same runless units,
       not unique PRs and not an old hybrid count plus a number of recent merges. Share the input
       representation between sync and async gateways; keep the existing snapshot's board writer sole.
       No new projection, supervisor, per-tick API request, full archive read or snapshot write.
    2. A cached count may open the existing refreshed credit pass; it may NEVER certify a retry.
       In both sync and async trigger paths, evaluate the unchanged backoff predicate on the final
       authoritative shipped-plus-runless count before returning a trigger. A cached overestimate
       must be refused after refresh. Reuse the existing candidate/P9/merge-time semantics, including
       explicit unreadable/degraded behavior. Do not assume a later backoff gate already exists.
    3. A missing or unreadable seed preserves the current backed-off zero-extra-GitHub-cost refusal.
       Never turn an absent seed into permission to fetch or retry. Keep marker corruption,
       GitHub degradation, resource admission, cadence, integrity, open-retro and dispatch locks intact.
       Delay, doubling, mergesThreshold=25, daysThreshold=7, budgets and caps are unchanged.
    4. The backoff row names the actual count and basis that produced its refusal, including a
       final-count refusal after an optimistic cached hint. Evidence must not describe the cached
       count as the authoritative outcome. No unbounded row payload or new ledger reader.
    5. Tests use real maintained credit reducers and a real temporary snapshot read at least once;
       cover default missing/invalid snapshot arms, missing merge times, foreign branch ownership,
       changed marker, and both trigger paths. Prove deletion falsifiers for the new positive hint,
       final authoritative refusal and decision evidence, without changing their assertions.
       Preservation-only boundaries belong in the suite, not as base-passing acceptance proofs.
