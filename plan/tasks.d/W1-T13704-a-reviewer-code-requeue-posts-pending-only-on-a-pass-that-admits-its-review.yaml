  risk: high # one sweep function (reviewerCodeRequeue): when the W1-T11847 requeue may post its pending; the review itself is unchanged
  band_meaning: span
  origin: "operator-session#review-claim-stall-2026-11-18"
  plan_refs:
    - W1-T11847
