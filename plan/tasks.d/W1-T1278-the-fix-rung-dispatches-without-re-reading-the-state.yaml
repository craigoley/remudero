  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 30.00
  rationale: |
    MEASURED 2026-08-23 ON THE DAEMON HOST, in a scratch worktree proved equal to `origin/main` at
    8e8b331e before any reading; the clone was checked and already full (2,044 commits), and
    `src/run-task.ts` is over the contents-API cap so every per-head read used git objects. Ledger
    figures come from `resolveLedgerUnion` over 21 archives, `ok:true`, `unread:0`, with the
    control `"step":"risk_judge.decision"` reading 152. NOTHING BELOW IS CARRIED — every figure
    was re-derived in this pass, and where it differs from the brief the measured value is used.

    (1) CONDITION A, RE-DERIVED OVER 2026-08-22T18:16Z → 2026-08-23T18:16Z (27,007 rows). Sixteen
    `blocked_ci` verdicts totalling $102.06. Their reason strings split 9 "ci red before review",
    6 "required check red: coverage-ratchet", 1 "ci timeout before review" — so CI REALLY WAS RED
    AT THE READ in fifteen of sixteen, and this is not a bound firing on a healthy condition.

    (2) AND THIRTEEN OF THOSE SIXTEEN MERGED AFTERWARDS — $73.02 of the $102.06 — at a MEDIAN 104
    MINUTES after the run declared them blocked. The full gap set, in minutes: 33, 35, 46, 60, 69,
    102, 104, 148, 150, 165, 175, 182, 198. The verdict was terminal; the state it described was
    not.

    (3) WHAT THAT VERDICT DISPATCHES IS THE RUNG, AND THE RUNG'S BILL IS THE RECOVERABLE PART. In
    the same window: 14 runs entered the rung, spending 32 strikes and $70.09 — 7 converged, 3
    exhausted, 3 mixed, 1 neither — alongside 13 `escalation.issue_opened` rows, every one class
    `BLOCKED`. The PRs those strikes were spent on are the same PRs that merged in (2).

    (4) CONDITION B, RE-DERIVED ON #2605. `mergeable=false`, `mergeable_state=dirty`, and
    `git merge-tree --write-tree origin/main <head>` returns rc=1 listing a real three-way content
    conflict — stages 1, 2 and 3 all on `src/lib/wipe-test.ts`. A conflicted PR registers no new
    check runs, so a correct repair and a wrong one produce the identical observation and the
    strike buys no information. #2605 is also one of the three blocked_ci PRs from (2) that did
    NOT merge — condition A's exception is condition B's instance.

    (5) Q1 — THE INSERTION POINT ALREADY EXISTS AND IS ALREADY THE RIGHT SHAPE. `runFixRung`
    (`src/run-task.ts:5533`, spanning to :6589) opens every round with
    `const preStrikeStandDown = await fixRungStandDownReason(...)` at :5790 — BEFORE `strikes` is
    incremented and before `fix.dispatch` is logged — and already returns
    `{ outcome: "stood_down", reason, standDownReason }`, already choosing between escalating a
    decidable question and ledgering a settled one (`fix.stood_down`, site `rung.strike`). There
    is no new seam to invent.

    (6) AND WHAT IT HAS IN HAND THERE IS NEITHER OF THE TWO THINGS IT NEEDS, MEASURED WITH A
    CONTROL SO THE ZERO MEANS ABSENCE. `mergeable_state` occurs ZERO times inside the rung's span;
    the controls on that same span are `readLiveState` 6, `ciFailures` 7 and `mergeConflict` 3 —
    all dispositions the rung demonstrably does consult — so the scan reaches and the absence is
    real. `LiveStateResult` is `{ ok, state? }` (`src/lib/sweep.ts:3203`), which carries the PR's
    OPEN/CLOSED/MERGED lifecycle and not its mergeability. And `CiFailure`
    (`src/lib/sweep.ts:234`) carries exactly `name`, `logTail`, `sha?`, `outsidePrRange?` — no
    `started_at`, no attempt id, nothing that could distinguish a red with a later attempt running
    from a red that is final.

    (7) THE REPO ALREADY OWNS THE PREDICATE — IT JUST DOES NOT REACH THE RUNG. `mergeFactsFromRest`
    (`src/run-task.ts:5340`, W1-T1095 capability 3) reads exactly the right thing:
    `mergeable === false || mergeable_state === "dirty"` is the DEFINITE conflict reading, and
    everything GitHub has not computed stays `UNKNOWN` rather than resolving toward action. It sits
    193 lines ABOVE `runFixRung` and is not called from inside it.

    (8) THE FOUR NEAREST RELATIVES ARE CITED AND NONE OF THEM STOPS THE RUNG DISPATCHING, WHICH IS
    THIS TASK'S WHOLE SUBJECT. W1-T1219 owns the fix-spawn BOUND — how long a strike may run, not
    whether it should start. W1-T1275 owns the required ROLLUP that never recomputes — it would
    clear the gate sooner, and the rung would still have dispatched first. W1-T1223 owns REQUEUING
    the cancelled check — it explains why 6 of the 16 read `coverage-ratchet`, and again the rung
    still dispatches. W1-T1269 owns the missing PROGRESS test. Every one of them is on main and
    none is re-filed here.
  design: |
    ONE CONCERN: a strike must not be spent on a state that already contradicts the reason for
    spending it. Not the bound, not the cap, not the escalation.

    (i) BOTH CHECKS GO AT THE EXISTING GATE. `fixRungStandDownReason` / `preStrikeStandDown`
    (rationale 5) is the one insertion point: it already runs before `strikes` is incremented, it
    already has the vocabulary for a named stand-down, and it already distinguishes escalate-worthy
    from ledger-only. Nothing new is introduced anywhere else in the rung.

    (ii) CONDITION A'S STAND-DOWN IS DELIBERATELY NARROW: THE ONLY RED REQUIRED NAME HAS A LATER
    ATTEMPT ALREADY IN FLIGHT. Both halves matter. "The ONLY red" — if any other required name is
    red with nothing pending, the rung proceeds, because there is real work to do. "ALREADY IN
    FLIGHT" — an attempt that EXISTS on this same head with a later `started_at` and a
    non-terminal status. That is an OBSERVED fact about a run that is executing right now, and it
    is what separates this from "will probably be re-run", which is a prediction and must never
    stand a strike down. One notch wider — "a red that might clear", "a check that has failed
    before" — becomes "never fix a red PR", the exact opposite of the rung's purpose.

    (iii) THE INPUT FOR (ii) DOES NOT EXIST YET AND MUST BE ADDED HONESTLY. Rationale (6):
    `CiFailure` carries no attempt information, so the check-run set the sweep already reads must
    carry enough of it — a per-name latest-attempt status — for the gate to answer the question.
    An implementation that infers "in flight" from a name, a timestamp on the failure, or a retry
    count is inferring, and design (ii) forbids exactly that.

    (iv) CONDITION B'S STAND-DOWN DEFERS TO THE CONFLICTED DISPOSITION; IT DOES NOT RETRY AND DOES
    NOT HOLD. A PR whose `mergeable_state` is `dirty` cannot be observed making progress, so the
    rung declines the strike and hands the PR back to the sweep's own `conflicted` disposition,
    which owns merge-conflict mode already (`mergeConflict` evidence, rationale 6's control). If
    that disposition is unavailable to the caller, the stand-down escalates rather than looping —
    an open-ended hold on a conflicted PR is the shape that produces a silent stall, and a retry is
    the shape that produced this task.

    (v) NOTHING AUTO-RESOLVES A CONFLICT. The rung declines; it never rebases, never merges main
    in, never edits the branch to make the conflict go away.

    (vi) WHAT MUST NOT CHANGE, PINNED BY CRITERIA: `strikeCap` keeps its value and its meaning; the
    escalation at the ceiling still fires with the same class; and A GENUINELY-RED PR WITH NO
    PENDING ATTEMPT STILL GETS ITS RUNG, which is the criterion that stops this task from becoming
    the wider condition (ii) refuses.

    (vii) NOT IN SCOPE, NAMED: the spawn bound (W1-T1219), the rollup recompute (W1-T1275), the
    cancelled-check requeue (W1-T1223) and the progress test (W1-T1269) — all cited in rationale
    (8), none re-filed, and none of them prevents the dispatch this task is about.
