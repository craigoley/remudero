  title: "THE FIX RUNG SPENDS A STRIKE WITHOUT RE-READING THE STATE THAT WOULD TELL IT NOT TO — it holds failing check NAMES and the PR's lifecycle state, and neither the attempt set that shows a red already being superseded nor the `mergeable_state` that shows the outcome cannot be observed at all"
