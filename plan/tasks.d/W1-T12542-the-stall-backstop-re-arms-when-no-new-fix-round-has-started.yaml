  rationale: |
    WHY: the stage-stall backstop is the alarm for a PR that the fleet stopped repairing. Today one fix round anywhere in a
    stage silences it for the rest of the stage. A PR that got one round and then nothing is never reported.
    OBSERVED in the 48 h ledger research (2026-11-11 21:45Z to 2026-11-13 21:45Z): 42 stalled episodes lasted more than
    1 hour. 21 of them had no fix round in their first hour, and 13 never had a fix round.
    READ 2026-11-13 at origin/main d41354cdd:
    - src/lib/sweep.ts:7411-7417 sets the bounds: own-red 45 minutes, conflict 30, awaiting-review 30.
    - src/lib/sweep.ts:19772-19773 reads the time the fleet held the stage (`fleetWithheldStageMs`) and returns while the
      stage is younger than its bound.
    - src/lib/sweep.ts:19786-19790 returns (no report) for an own-red or conflict stage when a repair started this pass,
      a round is in flight, or ANY `fix.dispatch` or pushed `fix.done` row exists since the stage began. Nothing compares
      that row's time with now.
    - src/lib/sweep.ts:19763-19767 already limits reports to one per PR, head and blocker per STAGE_STALL_RENOTIFY_MS.
    - W1-T10736 (queued) makes the stage clock exclude paused, held and down time. It does not change which rows silence
      the report. W1-T11032 (queued) is a machine stub for the own-red cost class with no design. This task changes the
      silence rule itself: an old round no longer silences the backstop.
  design: |
    INVARIANT stalled-repair-is-reported: an own-red or conflict stage with no fix round in flight and no round ended within
    its bound reaches the stage-stall report.
    1. In src/lib/sweep.ts add `lastFixRoundEndedAt(stageRows)`. It returns the newest ts of a `fix.dispatch` row or of a
       `fix.done` row with a `pushed_head_sha`, or undefined.
    2. At :19786, keep the silence for `repairStarted` and `roundInFlight`. Replace the "any row since the stage began" test
       with: the last round ended less than the stage's bound ago, after subtracting the held time of the rows since that
       end (`fleetWithheldStageMs` on those rows). Keep the head-moved arm as it is.
    3. When the report fires on this path, add `last_fix_round_ended_at` to the pr.stuck row and to the shown reason.
    NOT IN SCOPE: the bounds themselves; the stage clock of W1-T10736; what the stall report does after it is filed.
  falsifier: |
    Restore the "any row since the stage began" test and criterion 1 must fail. Drop the in-flight arm and criterion 2 must
    fail. Ignore held time and criterion 3 must fail. Restore and require all to pass.
  note: |
