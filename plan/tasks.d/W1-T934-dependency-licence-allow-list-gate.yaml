  status: queued
  attempts: 0
  note: "verify:auto — nothing here needs an operator ruling. The allow-list VALUE is named by the
    feedback and constrained by MASTER-PLAN §6A's existing Apache-2.0 commitment; design (vi)
    requires the current lockfile's distribution to be REPORTED rather than used to widen the list
    silently, which is the only place an operator judgement could be smuggled in.
    ONE FILING FROM A SIX-ITEM ENTRY, and the five NOT filed are recorded here so a later intake
    does not re-file them:
      (2) OSV-SCANNER SKIPPING — already decided and wired. `scan-pr / osv-scan` IS in ci-gate.yml's
          REQUIRED array, and osv-scanner-pr.yml carries `fail-on-vuln: true` with the Dependabot
          actor exemption REMOVED and the reason written into the file (W1-T211). The advisory
          `skipping`-shaped job the filing likely observed is osv-scanner.yml, which is the
          push/schedule SARIF scan, `fail-on-vuln: false` BY DESIGN and not the PR gate.
      (3) PERF-BUDGET RATCHET — `no performance gate exists` is false as stated. BOTH hot paths the
          filing names already carry ABSOLUTE, CI-executed budgets: test/w1-t187-benchmark.test.ts
          asserts projectPlan over the production-scale corpus under a hard 500 ms ceiling, and
          test/serve.first-paint.test.ts asserts the <2 s first-paint-to-data budget through a real
          browser. Both ride the REQUIRED `ci` job, so a 10x projection regression already reds the
          PR. What is genuinely absent is a RATCHET with a tolerance band — and W1-T187's own suite
          documents why that is a live design hazard rather than a missing chore: the ceiling had
          to be skipped under coverage instrumentation after PRs #474/#475 flaked it while touching
          zero source. Generalising a timing gate is a real proposal; it is not this filing's
          premise, and filing it on a false premise would have been the wrong shape.
      (4) CONSOLE A11Y — already SHIPPED. test/serve.shell-ux.test.ts imports AxeBuilder from
          @axe-core/playwright (already a devDependency), scans the booted shell, fails on any
          critical/serious violation and additionally asserts an approximate score >= 90. It runs
          under the REQUIRED `ci` job, so it already blocks.
      (5) DOCS GATE — already SHIPPED, and in the exact registry-derived form the filing asks for.
          checkVerbCoverage (test/docs-claims.test.ts, W1-T213) derives its obligation from the
          COMMANDS registry in src/run-task.ts, so a verb added later is caught automatically;
          it is wired as claim `docs-verb-coverage` in plan/claims.yaml and executed by the
          REQUIRED `claims` check. The named first customers are already covered — console-url and
          status appear in docs/operator-guide.md's command table.
      (6) SECRETS-AT-REST — the DOCTRINE is already ratified as MASTER-PLAN Standing rule 24, and
          both fixtures the filing gestures at are closed: R-5 (both bearer tokens in a 0644
          serve.log, WRITE token in the console URL) was fixed and the tokens ROTATED in #473, and
          R-31 (undocumented rotation path) was documented in the same PR. A fresh open-ended recon
          enumeration is not obviously additive over a ratified rule with its fixtures closed, and
          filing an unbounded recon on top of settled doctrine is the padding failure mode.
    RISK:HIGH — RULE 19 / #588 MERITS TEST = YES, ONE LINE: criterion 5 asserts ONE cross-file
    invariant that is unsatisfiable piecewise — a single assertion reads the job NAME out of
    dependency-review.yml and the REQUIRED array out of ci-gate.yml and demands they agree, so
    neither file alone can satisfy it and the two must land in the same commit.
    WHY NOT DECOMPOSED (the alternative was worked, not waved off): the linter's span here is
    dependency-review (the new licence-only job), ci-gate (the REQUIRED entry that makes it await)
    and dependency-licence-policy (the suite asserting both). A depends_on spine cannot order these
    safely, because BOTH intermediate states are worse than the status quo, by this repo's own
    measured failure classes: job-first leaves an unlisted check that ci-gate RACES rather than
    awaits — precisely the W1-T211 finding this task exists to close, i.e. a gate that merges green
    and never gates; REQUIRED-first puts a name in the array with no job behind it, which is the
    synthwatch #102 deadlock class named in ci-gate.yml's own header and would wedge EVERY PR in the
    fleet until reverted. The third `concern` is the single suite that proves the coupling, which
    cannot be split from either half without ceasing to assert the invariant. The span is real and
    it is the task: risk:high is the honest label, not a smaller lie.
    THE ORIGINAL risk:medium ARGUMENT, kept because it is still true and still not enough: the span
    is two workflow files plus one suite, with no src/ path. It argued UP from low because a wrong
    check-run name in REQUIRED deadlocks every PR (design (v)) — a fleet-stopping failure mode
    rather than a local one. That same fleet-stopping mode is what makes the pieces unsplittable,
    so the argument lands at high rather than medium.
    RULE 25 CHECKED BEFORE FILING: `.github/workflows/` IS instrument surface, so this diff must
    carry NO isProductPath src/ path or judgeReview forces the review to failure, unsuppressibly.
    `files:` is therefore deliberately src/-free and the acceptance is a config-assertion suite in
    the shape test/scanner-gate-config.test.ts already uses — `test/` is excluded from
    isProductPath, so workflows-plus-test is a legal changeset. An implementer who finds they need
    a src/ seam has misread the design.
    COORDINATE ON ci-gate.yml: W1-T211 also declares that file, and REQUIRED is a folded-scalar
    JSON array with one name PER LINE precisely so two concurrent additions append lines instead of
    colliding on one. Append; do not reflow the array.
    budget_usd 60 HELD AT THE RISK RAISE — risk:high here buys ATOMICITY, not volume: the work is
    the same two workflow edits and one suite it was at medium, so the figure does not move.
    No product code and no algorithm to discover; the real cost is design (iii)'s
    unknown-licence direction and design (v)'s live check-run-name derivation, both of which must be
    verified against the pinned action and a real PR rather than reasoned about."
