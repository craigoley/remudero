- id: W1-T934
  title: "no dependency-licence policy exists — nothing in the gate wall reads what LICENCE a newly introduced package ships under, so a copyleft dependency enters the tree of an Apache-2.0 product with every check green"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: "FROM feedback fb-1785237573352-6c7b7e item (1), the ONE item of six that grounding
    did not already find answered. The other five are recorded in the note below as NOT filed,
    with what already answers each, so this task is not re-opened as a six-part programme.
    WHAT WAS VERIFIED ABSENT, from the tree rather than assumed. A sweep of plan/tasks.yaml, every
    plan/tasks.d/ shard, DECISIONS.md and .github/workflows/ for licence terms returns exactly two
    things, NEITHER of which is a dependency-licence policy. (a) W1-T439 pins THIS REPO's OWN
    licence identity — that LICENSE, package.json and README keep agreeing on Apache-2.0. It reads
    three declarations about remudero itself and says nothing whatever about node_modules. (b) The
    2026-08-11 DECISIONS.md entry (PR #1599) is an options memo on whether the HARNESS relicenses,
    explicitly `not a ruling`. Neither reads the lockfile. The inbound direction — what licence
    arrives WITH a dependency — is unguarded, and that is the direction that can contaminate.
    THE GATE WALL GENUINELY DOES NOT COVER THIS, checked scanner by scanner rather than by
    reputation. osv-scanner-pr.yml scans for VULNERABILITIES (`fail-on-vuln: true`), not licences.
    dependency-review.yml runs actions/dependency-review-action v5 but passes it only
    `comment-summary-in-pr: always` under `continue-on-error: true` — no `allow-licenses`, no
    `license-check`, and a step-level continue-on-error yields a SUCCESS job conclusion, so even
    the summary it comments is advisory by construction. CodeQL, Semgrep, depcruise, jscpd,
    leak-grep and the ratchets read source, never package metadata.
    WHY IT MATTERS HERE SPECIFICALLY, and this is not a generic best-practice filing. MASTER-PLAN
    §6A commits the core to Apache-2.0 as a `one-way door, accepted knowingly`, with the BSL/SSPL
    escape hatch CLOSED. A product under that commitment is exactly the product for which a
    strong-copyleft dependency is a genuine problem rather than a paperwork nuisance, and W1-T439's
    own measured lesson applies unchanged: a licence change rode 21-of-22 green and only a human
    reading the diff stopped it. A dependency bump is a WEAKER review surface than that, because
    the dep-review lane auto-arms minor/patch bumps unattended (docs/dep-review.md) — no human
    reads those diffs at all, by design."
  design: |
    (i) THE MECHANISM IS THE EXISTING dependency-review-action, NOT A BESPOKE LOCKFILE WALKER, and
    the reason is that the action is already SHA-pinned in this tree and is inherently DIFF-SCOPED.
    `allow-licenses` fails a PR that INTRODUCES a dependency whose licence is not on the list, and
    considers only dependencies the PR adds. That IS the feedback's `CI-blocking on new deps only`
    clause, with no grandfathering machinery to build and no baseline file to drift — existing
    dependencies are never re-litigated because the action never looks at them. A hand-rolled
    lockfile scan would need its own allow-list, its own baseline and its own ratchet, and is
    explicitly NOT the chosen route.
    (ii) USE `allow-licenses`, NEVER `deny-licenses`. The two are MUTUALLY EXCLUSIVE (supplying
    both raises an error), and `deny-licenses` is DEPRECATED upstream for possible removal in the
    next major. A deny-list is also the wrong shape for the ask: it fails open on every licence
    nobody thought to enumerate, whereas the feedback asks for an ALLOWED-list with copyleft
    flagged as the consequence, not as the enumeration.
    (iii) THE UNKNOWN-LICENCE HOLE IS THE PART THAT NEEDS CARE — a gate that passes what it could
    not read reproduces the defect class this repo already refuses (ci-gate fails closed on an
    unreadable check-runs API precisely because `does not know` must never read as `yes`). Verify
    against the pinned action version before wiring: an unresolvable licence is NOT covered by
    `allow-licenses` alone, `fail-on-unknown-license` is the switch that closes it, and
    `allow-dependencies-licenses` is the per-package exemption valve for the packages that must
    then be excused BY NAME with a reason. Note also that a non-SPDX `OTHER` is normalised to
    `LicenseRef-clearlydefined-OTHER`, so any list entry intending to name it must use that
    spelling. Whatever is chosen, an introduced dependency whose licence cannot be determined must
    fail or be exempted by name — never pass silently.
    (iv) A SECOND, LICENCE-ONLY JOB — do NOT make the existing advisory job blocking. That job's
    vulnerability arm would become blocking too, which overlaps osv-scanner-pr and reverses
    W1-T211's deliberate per-scanner advisory/blocking ruling as a side effect. Add a dedicated job
    running the same pinned action with the licence check on and the vulnerability check off,
    leaving the existing warn-only summary job exactly as it is.
    (v) IT MUST BE UNCONDITIONAL TO BE REQUIRED. Adding the new job's name to ci-gate.yml's
    REQUIRED array is what converts it from a raced check into an awaited gate (W1-T211's finding),
    and ci-gate.yml's own header states the hard constraint: a required check that CAN be skipped —
    job `if:`, path filter, or a skipped reusable caller — is the synthwatch #102 deadlock class.
    No path filter, no `if:`, no actor exemption. DERIVE THE CHECK-RUN NAME FROM A LIVE PR's
    check-runs API rather than reading it off the yaml: the existing job in this file declares
    `name: Review`, so the registered name is not the job id, and `scan-pr / osv-scan` is already
    in REQUIRED as a name that had to be verified live rather than inferred. A wrong name in
    REQUIRED deadlocks every PR.
    (vi) THE ALLOW-LIST IS DATA WITH A RECORDED DERIVATION. Seed it from the permissive family the
    feedback names (MIT / Apache-2.0 / BSD-2-Clause / BSD-3-Clause / ISC and the like), but MEASURE
    the licence distribution of the CURRENT lockfile first and record it in the PR body. If a
    currently-installed dependency sits outside the seeded list, that is information the operator
    needs — it does not block this task (the gate is diff-scoped and will not fire on it), and it
    must not be silently widened away by adding its licence to the list without saying so.
    (vii) NOT IN SCOPE, named so it is not inferred: this repo's own licence (W1-T439 owns it);
    the relay's licence (undecided, and this task takes no position); any change to
    osv-scanner-pr.yml or to the advisory/blocking status of any OTHER scanner (W1-T211's ruling
    stands); and a transitive-licence audit of the installed tree, which is a different task with a
    different shape from a diff-scoped PR gate.
  acceptance:
    - claim: "a PR that introduces a dependency under a strong-copyleft licence turns the gate red, and the failure names the package and the licence"
      proof: "unit test: test/dependency-licence-policy.test.ts"
    - claim: "a PR that introduces a dependency under a permissive licence on the allow-list passes, so the gate is not red on arrival"
      proof: "unit test: test/dependency-licence-policy.test.ts"
    - claim: "an introduced dependency whose licence cannot be determined FAILS or is exempted by name with a reason, never passes silently"
      proof: "unit test: test/dependency-licence-policy.test.ts"
    - claim: "the gate is diff-scoped — an already-installed dependency outside the allow-list does not fail a PR that did not introduce it"
      proof: "unit test: test/dependency-licence-policy.test.ts"
    - claim: "the licence job DEFINED in .github/workflows/dependency-review.yml is listed in .github/workflows/ci-gate.yml's REQUIRED array under that same check-run name, and carries no continue-on-error, no path filter and no if: condition — one assertion reading BOTH files, unsatisfiable by either alone"
      proof: "unit test: test/dependency-licence-policy.test.ts"
  risk: high
  origin: feedback#fb-1785237573352-6c7b7e
  plan_refs: ["§5", "§5C", "§6A"]
