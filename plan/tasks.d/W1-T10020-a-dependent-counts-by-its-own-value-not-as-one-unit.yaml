  falsifier: |
    At origin/main, and after W1-T9968, the P1 enabler of 21 chained P2 waves multiplies by (1 + 21) = 22. Against a
    lone P1 one tier unit old (urgency 2) it scores 22 to 2, sorts first, and the within-tier test fails.
    With the fix it scores 1 + (1/2)(1/2 + 1/4 + ...), under 1.5, and the lone P1 goes first.
    Ways to break it, and the test that catches each:
    - Weight by tier only, with no depth discount: the chain adds 21 halves, and the convergence test fails.
    - Take the max over dependents instead of the sum: the fan test fails.
    - Count only dependents in the enabler's own tier: the control holds, but the ready-row test, which expects the
      P2 waves' positive dependent value computed from the test's own inputs, fails.
    - Walk without a cycle guard: the termination test hangs and times out.
