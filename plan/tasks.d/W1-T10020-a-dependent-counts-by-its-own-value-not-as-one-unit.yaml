  design: |
    No fixed count, cap or weight (standing operator rule). Every weight comes from `priorityTiers`,
    `dispatchUrgency` and the tier unit W1-T9967 measures.
    1. LEVEL. `level(x)` is the length of the longest chain of OPEN dependencies under x, 0 when x is ready.
       - Compute it by a memoized depth-first walk over `depends_on`, restricted to `openTaskIds`. A dependency that is
         merged or outside the plan adds nothing.
       - An id met again while still on the walk's stack is a cycle. Its members get no level, contribute nothing, and
         are named (see 4). So the walk terminates on any plan, and visits each edge once.
    2. DEPENDENT VALUE (a helper named `dependentValue`, src/lib/dispatch-value.ts).
       - For each open task t, sum over its open transitive dependents d, each counted once (the set
         `openDependentFanout` already walks):
         `dispatchUrgency(tierOf(d) + level(d) - level(t), waits(d))`.
       - `tierOf` is `priorityTiers` over the open queue, and `waits(d)` is d's age in its own tier unit, exactly as
         d's own urgency reads them.
       - So a dependent counts at its own priority and its own cost of delay. A dependent that cannot start until k
         more merges land sits k tiers further from the head: `dispatchUrgency`'s own rule that each tier halves the
         weight. A dependent 20 hops away adds about 2^-20 of its value, because it is not unblocked now.
       - The level, not the path, sets the depth, so a dependent that also waits on a long unrelated chain is
         discounted by that chain too. A wave that lists the enabler directly and also follows 15 earlier waves is
         at least 16 merges away.
       - The sum is the recursion: d's dependents are t's dependents. A chain of P2 waves under t adds at most
         `u(P2) * (1/2 + 1/4 + ...)`, under one P2 unit, for any length. A fan of k ready P2 dependents adds k times
         a half P2 unit, so parallel work still counts per task.
    3. SCORE. In `costOfDelayContext`, replace `(1 + fanout) * urgency` with `urgency + dependentValue(t)`.
       - A task with no open dependents scores exactly as today.
       - W1-T9968's within-tier sort reads this product in place of `(1 + fanout)`. Its slot assignment is unchanged.
       - `openDependentFanoutByTaskId` keeps the raw count for `compareDispatch`'s tiebreak, the backlog gardener's
         evidence and W1-T9325's `open_dependents`.
    4. THE READY ROW. `dispatch.cost_of_delay.ready` (`costOfDelayReadyRow`) gains:
       - `dependent_value`: one entry per open task with at least one open dependent, ordered by id:
         `{ id, open_dependents, own_urgency, dependent_value }`. A reader sees the lift as own plus dependent value.
       - `dependent_cycle`: the ids step 1 found on a cycle, when there are any.
       - The row's key stays per plan tree, as W1-T9967 made it, so each tree logs it once.
       - W1-T9325's per-pick row: `DispatchScoreInputs` gains `dependent_value`, and `explainDispatchScore` reports it
         beside `open_dependents`, so each pick explains its lift too.
    5. Unchanged: `openDependentFanout`, `dispatchUrgency`, `priorityTiers`, the tier units, the validity share,
       `compareDispatch`, the fallback order, eligibility and the pack.
    6. TESTS. A new file, test/a-dependent-counts-by-its-own-value-not-as-one-unit.test.ts, with `test(` titles
       verbatim as in the proofs. It uses `buildDispatchValueContext` plus `dispatchOrder` on injected tasks and rows
       with fixed timestamps, as the W1-T9323 file does.
       - The 10-16 replay: a P2 enabler with 21 chained P2 waves under it, against an independent P1 of the same
         filing age. The P1 dispatches first and its `costOfDelayByTaskId` is the larger. When the enabler is filed
         early enough that its OWN urgency exceeds the P1's, the enabler goes first. At base the enabler multiplies
         by 22.
       - The within-tier residual: a fresh P1 enabler of 21 chained fresh P2 waves against a lone P1 one P1 tier
         unit old (urgency 2). The lone P1 is first; at base the enabler scores 22 against 2.
       - The control: a P1 enabler of P1 dependents still outranks a lone P1 of the same age.
       - Convergence: lengthening the chain from 21 to 42 P2 waves raises the enabler's score by less than one P2
         wave's own urgency. A plain or tier-weighted count adds 21 units or more.
       - Fan: an enabler of three ready P1 dependents scores above an enabler of one. A max over dependents fails it.
       - Termination: a `depends_on` cycle returns a ready context, scores the tasks outside it, and names the cycle
         in the ready row.
       - The ready row carries `dependent_value` with `open_dependents`, `own_urgency` and `dependent_value` for the
         enabler, the last equal to the sum in step 2 computed from the test's own inputs. `explainDispatchScore` for
         the enabler reports the same `dependent_value`.
       - Amend test/new-work-is-ordered-by-cost-of-delay.test.ts "W1-T4064: open fanout adds impact and measured cost
         per merge changes the share". Its exact `2 *` ratio is the one-unit count. Assert parent above peer, and the
         parent's score equal to `urgency + dependentValue` from the test's own inputs.
