- id: W1-T13135
  title: "When main's push run history window holds no green run, the red-main repair lane reuses the culprit it already located for the same red instead of stopping, so a long red keeps its repair"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # decides whether the repair lane acts on an older location; a wrong match would repair the wrong merge
  origin: "operator-session#main-red-13h-2026-11-15"
  plan_refs:
