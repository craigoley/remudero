    THE ENFORCEMENT FLOOR SAYS IT IS NOT THE BOUNDARY. `hooks/deny-floor.sh:5-9`, verbatim: "This is
    the deterministic floor that must hold even under bypassPermissions. It is a tripwire, NOT a
    sandbox — the OS sandbox (§4A) is the real boundary; this catches a small, explicit set of
    never-do operations". MASTER-PLAN.md:131 names that boundary: "workers are OS-sandboxed to their
    worktrees".

    THE SANDBOX BINARIES ARE PRESENT AND BAKED. `deploy/Dockerfile:106` — "REQ 8: the sandbox
    binaries — bubblewrap and socat" — installs `bubblewrap socat procps lsof jq` (:116) and
    verifies with `bwrap --version` (:118). CORRECTING A LIKELY MIS-CITATION: `bubblewrap` appears
    ZERO times in `hooks/deny-floor.sh` (`grep -cin "bubblewrap\|bwrap"` -> 0); the floor is the
    Dockerfile's REQ 8, not the hook. Anyone citing a bubblewrap floor in the deny-hook is reading
    the wrong file, and this shard says so rather than repeating it.

    SO THE MATERIAL EXISTS AND THE PHASE SPLIT DOES NOT. `bwrap` can remove a network namespace;
    nothing today asks it to, because install and implement are one phase and install genuinely
    needs the network.
  design: |
    THE OPERATOR RULES BETWEEN THREE SHAPES. This task builds none of them; it records the choice.

    (a) NETWORK OFF DURING IMPLEMENT. Phase 1 installs online with credentials present; phase 2
    re-enters the worktree with the network namespace removed and NO token in env. Strongest: an
    implement turn cannot exfiltrate, cannot push, and cannot silently depend on a fetch. Cost: any
    legitimate mid-implement network need becomes a hard failure, and `gh`-shaped steps must be
    hoisted out of the implement phase or fail — which is a real behaviour change for every lane
    that shells `gh` today via `excludedCommands`.

    (b) ALLOWLIST PROXY ONLY. Both phases keep a network, but egress is confined to an allowlist.
    Weaker than (a) — a compromised turn can still reach an allowlisted host — but it does not
    require classifying which steps need the network, and it degrades to a diagnosable proxy denial
    rather than an ENETUNREACH deep inside a tool.

    (c) STATUS QUO — one phase, token in env, `gh` outside the sandbox.

    NO RECOMMENDATION IS OFFERED, DELIBERATELY. (a) and (b) trade a real capability against a real
    exposure, and this shard has NOT measured how many implement turns actually touch the network —
    that measurement is the first thing whoever takes this should produce, because it converts the
    trade from a preference into a number. A recommendation made without it would be a guess wearing
    a rank.
