  rationale: |
    OBSERVED at a0b6ba81e. This is a RULING, not a build.

    THE CREDENTIAL AND THE IMPLEMENT PHASE SHARE ONE ENVIRONMENT. W1-T2914's title states it:
    "the worker env allowlist carries GH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN, gh runs outside the
