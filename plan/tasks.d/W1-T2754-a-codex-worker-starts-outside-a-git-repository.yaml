- id: W1-T2754
  title: "a Codex worker whose cwd is not a git repository exits 0 with no output, so every Codex-routed isolation probe returned an empty transcript and the queue stalled on `blocked_isolation — the probe's alias/function counts could not be parsed`"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: medium
  files:
    - src/lib/worker-provider.ts
    - test/a-codex-worker-starts-outside-a-git-repository.test.ts
  origin: "oper#codex-isolation-probe-stall-2026-09-03"
  plan_refs: ["W1-T17", "W1-T238", "W1-T1112", "W1-T2750"]
  status: queued
  attempts: 0
  rationale: |
    THE QUEUE STALLED AND THE VERDICT NAMED THE WRONG CAUSE. Every dispatch died at
    `blocked_isolation — the probe's alias/function counts could not be parsed — isolation
    UNPROVEN`, eight times in 24h on the Azure daemon. The standing hypothesis was that
    `isolationProbePrompt()` is written for Claude Code ("use ONLY the Bash tool", the
    `CLAUDE_CODE_TOOL_WRAPPERS` exclusion) and that under Codex the `REPORT` block never reaches
    the transcript, so `parseIsolationReport` yields NaN. That hypothesis is REFUTED. The probe
    never runs at all.

    THE COST FIELD IS THE FALSIFIER. Every failing `isolation.probe` row carries `cost_usd: 0`;
    every passing one carries ~0.09. A Codex worker that ran but emitted a differently-shaped
    report would still bill for the turn. Zero cost means no turn happened. The real reason was
    already in the same row, in a field the verdict does not consult:
    `"stderr_excerpt": "Not inside a trusted directory and --skip-git-repo-check was not
    specified."` — Codex's own startup refusal.

    THE MECHANISM, EACH LINK MEASURED. `workerProviders.enabled` was `["claude","codex"]`.
    `probeIsolation`'s `defaultExecutor` (src/lib/isolation.ts) builds its probe cwd with a bare
    `mkdirSync(join(config.root, "tmp", "isolation-probe-<Date.now()>"))`, which is not a git
    repository and not a configured trusted directory. `codexExecArgs` never passed
    `--skip-git-repo-check` (a repo-wide grep for the flag returned zero). Codex therefore refused
    to start — and it refuses by EXITING 0 WITH NO OUTPUT, reproduced verbatim in the daemon
    container — so `probe.text`, `probe.blocks` and `probe.stderr` concatenate to an empty
    transcript, `parseIsolationReport` returns null, both counts become NaN, and `assessIsolation`
    correctly fails closed. The fail-closed posture is right and is not touched here.

    WHY IT LOOKED PROVIDER-CORRELATED AND INTERMITTENT RATHER THAN STRUCTURAL. A real task worker's
    cwd IS a git worktree, so it satisfies the trust check and Codex runs normally. The isolation
    probe is the only Codex worker whose cwd is a bare `mkdir`. The failure therefore tracked
    provider routing exactly while every other Codex spawn succeeded, which is what pointed the
    investigation at the prompt and the parser instead of at the argv.

    THE PROMPT AND THE PARSER NEED NO CHANGE, MEASURED. Running the EXACT production prompt under
    Codex in a non-repository cwd with `--skip-git-repo-check` added produced, verbatim:
    `REPORT / aliases: 0 / functions: 0 / alias_names: - / function_names: -`. Feeding that raw
    transcript to the UNMODIFIED `parseIsolationReport` and `assessIsolation` returned
    `{isolated: true, reason: "worker reports 0 aliases and 0 functions inherited"}`. Codex ran all
    four commands through `/bin/bash -lc`; the Claude-Code-specific wording is portable as written.
  design: |
    ONE ELEMENT IN `shared`, INSIDE `codexExecArgs`. `shared` feeds both the fresh argv and the
    `exec resume` argv, so a single entry covers both paths and there is no second hand-copied
    list to drift. For a worktree cwd the flag is a no-op, so task workers are unaffected.

    THE FLAG WAIVES THE TRUST PROMPT, NOT THE SANDBOX. `--skip-git-repo-check` only suppresses
    Codex's "is this a repository I am allowed to run in" gate. `--sandbox read-only` /
    `workspace-write` and the `codexGitWritableRoots` grants are computed separately and are
    unchanged, so the containment guarantee is identical before and after. The test asserts the
    sandbox bound on the same argv it asserts the flag on, so a future widening into
    `--full-auto` or `--dangerously-bypass-approvals-and-sandbox` fails rather than passing
    quietly.

    TESTED THROUGH THE EXISTING SEAM, NOT A NEW ONE. `codexExecArgs` is private; the argv is
    already observable through `args.containment.spawn`, which `test/a-codex-worker-uses-a-private-
    temporary-root.test.ts` uses for the same purpose. The new test records `options.args` from a
    spawn whose cwd is a bare `mkdtemp` directory — the probe's own cwd shape — and asserts the
    flag on both the fresh and resumed paths. The fixture supplies `tools: ["Bash"]` because
    `readOnly` is derived from that list and an absent list would silently select
    `workspace-write`.
  acceptance:
    - claim: "a fresh Codex spawn carries --skip-git-repo-check so a non-repository cwd cannot return an empty transcript"
      proof: "unit test: test/a-codex-worker-starts-outside-a-git-repository.test.ts"
    - claim: "a resumed Codex spawn carries the same flag from the shared argv rather than a second copy"
      proof: "unit test: test/a-codex-worker-starts-outside-a-git-repository.test.ts"
    - claim: "the sandbox bound is still declared on the same argv and no approval-bypass flag is introduced"
      proof: "unit test: test/a-codex-worker-starts-outside-a-git-repository.test.ts"
  note: |
    ID PROVENANCE: W1-T2754 was reserved and held by the operator and supplied directly. The
    mint's advisory line printed W1-T2752 twice and is stale; this shard uses the reserved id.

    SCOPE-TIME CHECKS, BOTH RUN. `git ls-remote --heads origin 'run-W1-T2754-*'` returned 0 and the
    anchored merged-PR trailer scan returned `[]`. Both were qualified with a positive control on a
    known-merged id (W1-T2749 -> [3773,3771,3768]), because a newly minted id reads zero against
    every surface for query-shape reasons alone.

    THE FALSIFIER WAS RUN. Deleting the flag and re-running the new test moved `# fail 0` to
    `# fail 1`; restoring it returned `# fail 0`. The 11 caller suites (`git grep -l` on
    `spawnCodexWorker`/`worker-provider` across `test/`) were run together with the new file:
    `# tests 109 # pass 103 # fail 6`. All six failures are in `test/merge-lcov.test.ts`, are
    IDENTICAL on a clean tree (`# tests 9 # pass 3 # fail 6`, same six names) and in the daemon
    container against origin/main, and are a Node pin mismatch unrelated to this diff:
    `coverage-merge-ratchet: raw coverage merge requires the repository-pinned Node 22.22.3;
    running 22.23.2`. Reported, not fixed here.

    NOT FIXED HERE, FILED SEPARATELY AS W1-T2755: when the probe spawn itself errored,
    `probeIsolation` still reports "counts could not be parsed" while the actual cause sits unused
    in `stderr_excerpt`. That reporting gap is what sent this investigation at the prompt and the
    parser for a day; it is a distinct defect from this argv omission and is scoped to its own task
    rather than widened into this one.

    NOT EVIDENCE: "codex" was removed from `workerProviders.enabled` during the investigation, so
    `blocked_isolation` stops appearing regardless of this change. That is the provider being
    absent, not the fix working. The unit test and its falsifier are the evidence.
