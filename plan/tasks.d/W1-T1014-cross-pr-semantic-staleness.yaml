- id: W1-T1014
  title: "TWO PRs WITH NO PATH OVERLAP CAN EACH BE GREEN AND JOINTLY RED, AND NOTHING IN THE FLEET LOOKS FOR IT — #2155 added a test asserting a contract #2157 replaced eleven minutes later, neither could have run the other's evidence, six PRs inherited a red main for up to an hour with no escalation; MEASURE the three remedies and rule, do not let a shard pick one"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED 2026-08-18/19 AT origin/main 6495ebe8 AND ON THE LIVE BRANCH PROTECTION. No
    `/rate_limit` call was made.

    (1) THE INSTANCE, WITH ITS TIMESTAMPS.
      - #2155 (W1-T999) merged 21:39:02Z and ADDED `test/serve-board-pacer-wiring.test.ts`, whose
        third case asserts `paceGhEntry`'s then-current contract: a rate-limited call is RETHROWN,
        the board gateway marks `readFailed() === true`, and the NEXT call waits the pacer gap.
      - #2157 (W1-T1007) merged 21:50:30Z and REPLACED exactly that contract. Its own doc states
        it: a `rate_limit`-classified refusal "no longer just widens the gap for LATER calls and
        rethrows THIS one: it retries THIS SAME call."
      Eleven minutes and twenty-eight seconds apart. Both green on their own merge refs.

    (2) NEITHER COULD HAVE CAUGHT IT, AND THAT IS THE POINT RATHER THAN AN EXCUSE.
    #2157's base sha is 57479141 and `git cat-file -e 57479141:test/serve-board-pacer-wiring.test.ts`
    FAILS — the test file did not exist in its base, so its CI never ran the assertion its change
    inverts. #2155 could not have run #2157's change for the mirror reason. The conflict exists in
    NO DIFF: it is a proposition about two diffs that were never composed before merge.

    (3) THE BLAST RADIUS WAS MEASURED, NOT ESTIMATED. Six PRs (#2159, #2160, #2161, #2162, #2163,
    #2164) each failed `ci` on EXACTLY ONE test — `# fail 1` in all six, the same test — for up to
    an hour, with no escalation raised by anything. Two of the six (#2161, #2164) are plan-only:
    their entire diff is one YAML shard and cannot reach a pacer, which is what identifies the
    failure as base-caused rather than six independent defects. Repaired by #2167 (test-only).

    (4) IT IS A FAMILY, NOT AN INSTANCE — THREE SIBLINGS, CITED AND NOT ABSORBED.
      (i) `partitionByFileOverlap` (`src/lib/dispatch-overlap.ts`) serialises candidates purely on
          DECLARED FILE PATHS via `overlappingPaths`. W1-T999 declares
          `[src/run-task.ts, src/lib/serve.ts, test/serve-board-pacer-wiring.test.ts]`; W1-T1007
          declares `[src/lib/open-prs-rest.ts, test/open-prs-rest.test.ts]`. ZERO overlap, declared
          OR actual (#2155 touched 3 files, #2157 touched 3, intersection empty). The partitioner
          would have admitted both to one batch — CORRECTLY, by its own contract. THIS SHARD DOES
          NOT PROPOSE WIDENING IT; that is a design question and this task is a measurement.
      (ii) W1-T985 files the overlap advisory that three of the four minting lanes never reach
          (`triageCommandLocked`, `planCommand`, `approveCommand` score 0 for every advisory
          symbol; the only reader is an operator typing `rmd next-task-id`). Even the advisory
          that DOES exist for path overlap is unread on three lanes.
      (iii) A PLAN-FILING PR's DIFF NEVER CONTAINS THE IMPLEMENTATION FILES IT DECLARES. A shard
          declaring `src/lib/open-prs-rest.ts` ships a diff touching only `plan/tasks.d/*.yaml`.
          So no reviewer of a filing PR — human or `judgeReview` — is looking at the code the task
          will later change, and no path-based check can see the future collision at filing time.
      THE COMMON SHAPE: every guard this repo owns reads ONE changeset. The defect is a relation
      BETWEEN two changesets, and nothing computes that relation before either merges.
  design: |
    THE DELIVERABLE IS A MEASUREMENT AND A RULING, NOT A CHOICE MADE HERE. Three remedies are
    recorded below with their measured cost. THIS SHARD RANKS NONE OF THEM.

    (i) THE MEASUREMENT INPUTS, ALL RE-DERIVABLE.
      - MERGE RATE, per UTC day on origin/main: 08-09=26, 08-10=29, 08-11=42, 08-12=86, 08-13=58,
        08-14=71, 08-15=89, 08-16=73, 08-17=54, 08-18=63.
      - INTER-MERGE INTERVAL over the last 200 merges (a 70.5-hour span): min 1s, p10 17s,
        MEDIAN 775s, p90 3036s, max 15268s, mean 1275s. Heavily bursty — the p10 and the max
        differ by four orders of magnitude, so a Poisson approximation understates the bad case.
      - RE-VALIDATION WALL-CLOCK, max(completed) − min(started) across every check-run on a merged
        PR head, deduped to the latest attempt per name, n=58: p50 754s, p75 919s, p90 1282s,
        p95 1377s, max 3435s (#2150, the 44-minute Playwright stall — an outlier with a known,
        separately-filed cause in W1-T1009).
      - BILLABLE COST OF ONE RE-VALIDATION, summing job durations (median 23 check-runs per head),
        billed ceil-per-job: p50 57 min, p90 73 min, max 85 min.
      - CONCURRENTLY OPEN PRs, sampled every 10 minutes over 7 days (n=1008 samples, 300 PRs):
        p50 1, p90 4, p99 9, max 12, mean 1.5.

    (ii) THE DEADLOCK QUESTION, ANSWERED DIRECTLY: NOT A PERMANENT DEADLOCK, BUT A THROUGHPUT
    CEILING THE FLEET HAS ALREADY EXCEEDED. Median re-validation (754s) sits at 0.97x the median
    inter-merge interval (775s) — the boundary, essentially exactly. At the p90 window (1282s) the
    ratio is 1.65x, and there a PR IS invalidated faster than it re-validates. THAT CASE IS NOT
    HYPOTHETICAL: over the same 58 heads, 33 (57%) had at least one merge land on main DURING
    their own check window, median 1, p90 3, max 5. It does not deadlock permanently only because
    the merge process is bursty and leaves long quiet stretches (max observed gap 4.2 hours).
    The binding consequence is the SERIALISED CEILING: under strict, merges become one per
    re-validation window — 115/day at the p50 window, 67/day at the p90 window. Observed demand
    reached 86, 71, 89 and 73 on four of the last eleven days, so the p90 ceiling is BELOW the
    observed rate on 4 of 11 days. Any ruling that turns strict on is accepting that ceiling.

    (iii) OPTION (a) — `required_status_checks_strict: true`. The operator ALREADY HAS THIS SETTING
    AND IT IS OFF: the live protection on `main` reads `required_status_checks: {strict: false,
    contexts: ["remudero-review","ci-gate"]}`. Turning it on costs ZERO engineering. It costs the
    ceiling in (ii), plus one extra full re-validation per invalidated PR — at 57 observed
    invalidations per 100 check windows and 57 billed CI-minutes each, roughly 32 extra CI-minutes
    per merge at today's concurrency. IT WOULD HAVE CAUGHT THIS INCIDENT: #2157 would have been
    forced to re-validate against a main containing #2155's test.

    (iv) OPTION (b) — RE-RUN CI ON EVERY OPEN PR WHEN MAIN ADVANCES. Same arithmetic, different
    bill, and it is entirely CI-minutes rather than latency: open PRs x merges/day x 57 billed
    minutes. At p50 concurrency (1) that is ~3,600 CI-min/day (60 h); at p90 (4) ~14,400
    (239 h); at p99 (9) ~32,300 (539 h); at the observed max (12) ~43,100 (718 h). It imposes NO
    throughput ceiling and needs no protection change, but it DETECTS rather than PREVENTS — the
    red arrives after the merge that caused it, so the six-PR blast radius still happens and is
    merely surfaced sooner. Whether that is enough is part of the ruling.

    (v) OPTION (c) — GITHUB'S MERGE QUEUE. THE PRIOR ANALYSIS DID NOT CONSIDER THIS AND IT IS THE
    ONLY OPTION THAT TESTS THE COMPOSITION RATHER THAN RE-TESTING THE PARTS. The queue builds a
    speculative branch (main + the queued PR, and optionally the ones ahead of it) and runs the
    required checks THERE, so #2155 and #2157 would have been composed before either landed.
    ADOPTION COST, MEASURED RATHER THAN ASSUMED, AND IT IS NOT SMALL:
      - `merge_group` appears ZERO times across all workflow files (positive control: `pull_request`
        appears in 12 of them). Every required workflow needs the trigger added. `.github/workflows/`
        is `INSTRUMENT_SURFACE`, so that change must RIDE ALONE under Rule 25 — no `src/` beside it.
      - THE BLOCKER IS `remudero-review`, AND IT IS SPECIFIC TO THIS REPO. It is a COMMIT STATUS
        POSTed to `repos/<o>/<r>/statuses/<sha>` by this fleet's own review lane, which the sweep
        runs over OPEN PRs. A merge-queue entry is not a PR and its speculative branch carries a
        different sha, so `remudero-review` would never exist on the sha the queue is gating —
        a required context that can never go green. Adopting the queue therefore requires either
        re-homing the review onto the merge_group event or removing it from the required set, and
        BOTH are rulings in their own right.
      - No merge queue is configured today (`repository.mergeQueue` is null).

    (vi) WHAT THIS TASK MUST NOT DO.
      - IT MUST NOT PICK ONE. The operator asked for the arithmetic; three defensible options with
        very different failure modes are exactly the shape that needs a ruling and not a default.
      - IT MUST NOT PROPOSE WIDENING `partitionByFileOverlap` — rationale (4)(i). That partitioner
        is CORRECT on its own contract and the change would be a design question, not a measurement.
      - IT MUST NOT ABSORB W1-T985 OR THE FILING-DIFF GAP. They are cited as family members with
        their own ids and their own scope; folding them in here would hide three separate decisions
        behind one.
  acceptance:
