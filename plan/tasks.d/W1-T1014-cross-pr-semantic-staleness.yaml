  note: |
    THIS TASK IS SATISFIED BY ITS OWN TEXT ON MERGE, AND THAT IS DELIBERATE RATHER THAN A DODGE.
    The operator asked for a measurement of the remedies, not for one to be built. The measurement
    IS the deliverable, so all five criteria are `grep:` proofs against this file and pass the
    moment it lands. WHAT REMAINS AFTER THAT IS THE RULING, and `verify: human` is the mechanism
    that parks it for the operator: `isDispatchEligible` (`src/lib/drain.ts`) returns false at
    `t.verify !== "auto"` before the linter is consulted, so no lane can pick this up and pick an
    option on his behalf. This is the same shape as W1-T484 and it is named here so a later reader
    does not mistake it for an unimplemented task.

    `files:` DECLARES ONLY THIS SHARD, WHICH IS THE HONEST LIST. The deliverable is this text; no
    `src/` file changes. That also keeps the task out of every other lane's way —
    `partitionByFileOverlap` will serialise it against nothing, which is correct for a record.
    NOTE THE IRONY AND DO NOT MISREAD IT: declaring a plan path means `rule15FilingViolation` would
    fire if this were `verify: auto` with an out-of-plan-scope path beside it. It is neither.

    THE MEASUREMENT IS RE-DERIVABLE AND THE COMMANDS ARE THE POINT, NOT THE NUMBERS.
    Merge rate / interval: `TZ=UTC git log origin/main -200 --format=%ct`.
    Re-validation wall-clock and billable minutes: `gh api repos/<o>/<r>/commits/<sha>/check-runs`
    per merged head, deduped to the latest attempt per name (the same `group_by(name) |
    max_by(started_at)` rule `.github/workflows/ci-gate.yml` already applies).
    Concurrency: `gh api "repos/<o>/<r>/pulls?state=all"` and sample open intervals.
    Live protection: `gh api repos/<o>/<r>/branches/main/protection`.
    Merge queue: `gh api graphql -f query='{repository(...){mergeQueue{id}}}'`.
    EVERY FIGURE HERE IS DATED 2026-08-18/19 AND WILL DRIFT; re-run the query rather than quoting
    the number, exactly as the ledger-union rule requires.

