  rationale: |
    READ at origin/main 8c1ad448e (2026-10-26).
    - The transcript miner (W1-T4668, src/lib/workflow-mining.ts) feeds `skill-workshop.ts` the steps that every
      first-attempt-success run of a task type took and that no repaired run took. `toolStepsForRun` reads each
      `worker.activity` row's bare `tool_name`. Every implement run calls `Bash`, `Read` and `Edit`, so the
      repaired side holds every name the clean side does. The distinguishing set is then empty, and design clause
      (iii) correctly mines nothing.
    - Since 2026-10-13 each tool-call row also carries `tool_signature` (src/lib/tool-step-signature.ts):
      `Bash:<program> [<subcommand>]`, `<FileTool>:<repo-relative path>`, `<outside>` or the bare name.
    - #14473 added `rmd procedures` (src/lib/procedure-census.ts) and put its step reader in workflow-mining.ts,
      beside `toolStepsForRun`. `normalizeProcedureStep` coarsens a signature so that one file is not one step
      (`Read:src/lib/review.ts` becomes `Read:src/lib/*.ts`), and `procedureStepsForRun` reads a run's steps that
      way, falling back to the bare name on rows from before 2026-10-13. The census reports per-type step shares
      and the lift of clean over repaired. It compiles and drafts nothing.
    THE HOLD IS THE MEASUREMENT. Lift dispatch only once `rmd procedures --since <30 days>` on the host shows (a)
    signature coverage above 90% of tool rows, and (b) at least one task type with a clean-run share of 0.8 or more
    on a step whose repaired share is 0, the same all-or-nothing test the miner applies. If no type shows one, this
    change would still mine nothing. Record that in the plan and close the task instead.
  design: |
    1. `toolStepsForRun` returns `procedureStepsForRun(records, runId)`, which already lives in the same module.
       `mineTranscriptWorkflows`' rules (threshold, at least one repaired run, and clause (iii)) are unchanged; only
       the step unit changes. No other module changes, and the census keeps reading the same function.
    2. `renderTranscriptWorkflowSteps` already prints each step in backticks. A normalized step reads as what it
       is, for example "- Call `Bash:git push` — observed in every first-attempt-success transcript…". No wording
       change is needed. Prove the rendered line with a test.
    New tests go in test/learning/the-transcript-miner-compares-tool-signatures-not-tool-names.test.ts (folder from
    `rmd test-place`). Import through `#src/*`, and use `test(` titles exactly as in the proofs below.
  acceptance:
