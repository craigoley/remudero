- id: W1-T3268
  title: "THE CRASH-LOOP SIGNATURE COUNTS A TRAILING RUN WITH NO RECENCY BOUND, SO A RESOLVED INCIDENT STAYS ARMED FOREVER — `crash_loop_signature` read `88 1` on a fleet host whose daemon had been healthy for 25 minutes, and the first ordinary `exit 1` revival next month will make it 89 and raise DAEMON_CRASH_LOOP on a single transient"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 8.00
  files:
