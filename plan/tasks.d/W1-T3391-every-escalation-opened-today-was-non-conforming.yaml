  rationale: |
    SIXTEEN OUT OF SIXTEEN. MEASURED over the full rotation union for 2026-09-11: every
    `escalation.issue_opened` row carries `operator_message_ok: false` with
    `operator_message_missing: ["consequenceOfInaction"]`. Not a sample — the entire day, across
    BLOCKED and MANUAL classes and across ten distinct task ids.

    THE GAP WAS MADE VISIBLE AND THEN NOTHING CLOSED IT. `toOperatorMessage` in `escalate.ts` projects
    an escalation onto the four presence slots, and its own comment says `consequenceOfInaction` is
    the part most producers omit and that making the gap visible is the point. Visibility worked; it
    has been 100 percent visible and 100 percent unfixed. `consequence` is optional on the
    `Escalation` interface, `null` is an explicit nothing-follows and counts as present, and no
    producer sets either.

    WHY IT MATTERS MORE NOW. W1-T3390 makes a human the LAST rung rather than the second, which means
    the issues that do reach a person are the ones automation could not solve. An escalation that omits
    what happens if nobody acts is worst precisely when it is rarest, because the reader has no
    standing context for it.

    SCOPE. Make every escalation producer supply `consequence`, explicitly `null` where nothing
    follows from inaction, so the slot is answered rather than omitted. Keep `checkOperatorMessage`
    best-effort at the raise site: a checker failure must never stop an escalation being raised.
    Change no escalation class, no dedup key and no issue routing.

