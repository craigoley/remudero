- id: W1-T3825
  title: "A CLEAN ABANDONED RUN WORKTREE BLOCKS ITS PR'S FIX RUNG — registered-owner recovery recognizes only sweep-<task>-<epoch> paths, so the daemon calls its own run-<task>-<epoch> worktree foreign before it can preserve divergence and retry"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 12.00
  files: [src/run-task.ts, test/fix-branch-checkout-serialization.test.ts]
  origin: "fleet-incident#console-pr-1349-clean-abandoned-run-owner-2026-09-19"
  plan_refs: ["W1-T2952", "W1-T3170", "W1-T3822"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on the console Azure daemon on 2026-09-19. PR #1349 is green on
    `console-ci` and `ci-gate` but has no posted semantic review. The sweep
    repeatedly logs `sweep.fix.checkout_claim_declined` with
    `owner_recovery_reason: "foreign_worktree_path"`. Its registered owner is
    `/home/node/Remudero/worktrees/run-AGENT-T3-1789861688164`: it is a clean,
    inactive Git worktree, attached to that exact branch, with no matching
    inflight claim and no process whose cwd is that path. The current PR head
    has advanced beyond the owner's local head, so W1-T3170's existing
    divergence-preservation path is the safety mechanism needed before a fresh
    review or repair can use the branch.

    The refusal is caused by the classifier itself. `captureRegisteredFixOwnerSnapshot`
    accepts only a basename beginning `sweep-${taskId}-`, while fleet task
    workers correctly create branches and worktrees named `run-${taskId}-`.
    The early `foreign` return therefore suppresses every later exact-branch,
    clean-tree, claim, process, remote, and ancestry check. The directory is
    daemon-created and registered by Git; it is not foreign in the sense the
    W1-T2952 boundary intends to protect.

    W1-T3822 overlaps only at the shared recovery seam: it preserves tracked
    dirty changes after a worktree is already proven managed. This task preserves
    that refusal and makes no mutation path reachable for a dirty tree; it only
    gives a clean daemon-owned `run-` worktree access to the existing checks.
  design: |
    Make the managed-path predicate recognize exactly the two daemon-owned
    fix-owner basename forms under the already-realpathed configured worktrees
    root: `sweep-<taskId>-<epochMs>` and `run-<taskId>-<epochMs>`. Keep the
    existing one-directory containment proof, numeric epoch suffix, exact
    symbolic branch check, clean-tree requirement, remote-head observation,
    ancestry classification, claim read, and process-cwd census unchanged.

    A clean `run-` owner may then reach W1-T3170's existing ordinary outcomes:
    reclaim when contained, publish when locally ahead, or preserve a divergent
    local head before removal. It must still refuse a wrong task id, nonnumeric
    suffix, nested path, symlink escape, detached or other branch, dirty or
    unreadable tree, unreadable or changed remote observation, live claim, or
    live/unknown process census. Do not expand the recovery root, force-remove a
    worktree, overwrite or delete a recovery ref, treat an arbitrary `run-`
    directory as managed, or add a new recovery mechanism.
  acceptance:
    - claim: "a clean exact run-task worktree under the configured root reaches the existing registered-owner recovery checks instead of foreign_worktree_path"
      proof: "grep: isManagedFixOwnerWorktreeName in src/run-task.ts"
    - claim: "only numeric run and sweep worktree basenames for the exact task are eligible for the existing recovery path"
      proof: "grep: managedFixOwnerWorktreePrefixes in src/run-task.ts"
  falsifier: |
    Construct the existing temporary Git fixture with a registered, clean
    `run-W1-T500-<epochMs>` worktree on the exact task branch, clear claim and
    process census, and a divergent local head. Before the predicate change it
    must return `foreign_worktree_path`; after the change it must reach
    `preserve-diverged`, preserve the local head in the existing recovery ref,
    remove the owner through the ordinary path, and permit one bounded retry.
    Delete the new `run-` recognition and the focused test must fail. Repeat
    with a wrong task id, nonnumeric suffix, nested path, dirty tree, live claim,
    and live process; any classification as managed or recovery side effect is a
    failure.
  note: |
    reservation hand-off: unknown -> chore/file-run-worktree-identity-1789864865000

    reservation holder is this filing branch, verified by `rmd next-task-id`
    reserving W1-T3825 on origin before this shard was written; no hand-off is required.

    This is intentionally separate from W1-T3822: that task preserves a tracked
    dirty managed owner. This task changes neither dirty-tree handling nor the
    recovery effects; it makes the already-safe clean-owner checks reachable for
    the fleet's own run branch form.
