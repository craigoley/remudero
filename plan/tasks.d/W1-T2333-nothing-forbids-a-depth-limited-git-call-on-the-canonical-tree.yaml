  note: |
    `risk: medium` — ONE declared file, test-only, no production behaviour changes and no path the
    fleet executes at run time. It argues down toward low and up only because a ratchet that is
    wrong in the permissive direction is worse than none; medium is the honest middle.

    `verify: auto` — every criterion is a pure scan over supplied source text or over the tracked
    tree, provable with no network, no host and no live checkout.

    `budget_usd 30` — one test file with a fixture-driven negative arm and a table. Deliberately
    below W1-T2332's 45: this ships no production code.

    THE FORWARD REFERENCE IS DELIBERATE. `test/no-shallowing-of-the-canonical-checkout.test.ts` does
    not exist yet; it is declared in `files:` so the path-form proofs resolve under the
    forward-reference carve-out and read `not_yet_built` until the build lands.

    WHAT THIS TASK DOES NOT CLAIM. It does not claim the canonical checkout was shallowed by
    anything in this repository — rationale (1) says the opposite on the evidence available by
    reading. It claims that the property keeping that true is unwritten and ungated, which is the
    difference between being safe and being kept safe.

    NO `depends_on` on W1-T2332 and no file overlap with it, so the two can batch rather than
    serialise: this task declares one test file and W1-T2332 declares three modules and two other
    tests.

    RENUMBERED `W1-T2328` -> `W1-T2330` -> `W1-T2333`, AND THE SECOND HOP IS WHY THERE IS A THIRD.
    This shard was filed against a base where `W1-T2328` was free; by the time this branch's CI ran,
    `#2992` had already merged a DIFFERENT `W1-T2328` ("the fix rung re-runs the failing check and
    never asks whether the verdict moved", `src/lib/ledger-replay.ts`) onto main, so a merge would
    have handed `loadPlan` a duplicate id. The first fix round moved this shard to `W1-T2330`, an id
    this run does hold a reservation ref for but which sits in a block reserved seconds before the
    filing commit, so ownership of it reads ambiguously from the refs alone. `W1-T2333` is reserved
    to the operator's own host and is unambiguous. Renumbering is the only change either round makes
    — no acceptance criterion, no `files:` entry, and no line of design text has moved. `lint-plan`
    ALSO flags this task as a `duplicate-title` candidate against the merged `W1-T2328` (a
    title-similarity heuristic, k=2) — the two are unrelated: that task is fix-rung re-verification
    after a re-run, this one is a source-scan ratchet against depth-limiting git flags. Advisory
    only, cited here per the check's own instruction.
