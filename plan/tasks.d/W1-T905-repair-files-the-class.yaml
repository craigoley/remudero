    - claim: "a second pass over the same recurring surface files nothing new — the deterministic id is the whole dedup and no second store exists"
      proof: "unit test: test/sweep-repair-filing.test.ts"
    - claim: "the entry carries the observed evidence read off the existing sweep.disposed rows (PR numbers, disposition reason, failing check names) and is a feedback entry with status new, never a task"
      proof: "unit test: test/sweep-repair-filing.test.ts"
    - claim: "a capture or landing failure leaves the repair and the rest of the sweep pass unchanged — filing is best effort and never blocks a repair"
      proof: "unit test: test/sweep-repair-filing.test.ts"
    - claim: "the machine origin is a first-class term in the closed origin grammar so a filed entry traces back to the surface that produced it"
      proof: "grep: repair# in src/lib/feedback.ts"
