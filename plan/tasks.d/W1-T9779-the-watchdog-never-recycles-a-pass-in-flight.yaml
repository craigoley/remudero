  design: |
    Operator rulings: no new fixed threshold, one concern, automated flow.
    1. READ THE MARKER. PROGRESS_WATCHDOG_READ_STEPS adds `daemon.sweep.started`, `daemon.sweep.settled`,
       `daemon.sweep.abandoned` and `daemon.pulse`. The verb is unchanged: it already reads whatever the list names.
    2. A PASS IS IN FLIGHT when the newest `daemon.sweep.started` row S meets all four conditions:
       - no `daemon.boot` or `daemon.paths` row is newer than S (S belongs to this generation);
       - no `daemon.sweep.settled` or `daemon.sweep.abandoned` row with S's run_id is at or after S;
       - S carries a finite positive bound_ms and now - S.ts <= bound_ms. The bound is the daemon's own, learned from
         completed passes. A row with no bound_ms is never in flight;
       - a `daemon.pulse` row with S's run_id is newer than both S and now - STALL_DIAGNOSE_AFTER_MS. That is an
         existing calibrated bound, so a frozen loop is never read as a waiting pass.
    3. ACT ON IT. Where the stale-progress branch would return `recycle` and a pass is in flight, the verdict is
       state `IN_PASS` with action `capture-diagnostics`. The bundle keeps its at-most-one-per-15-min rule. The reason
       names the pass's start, its age, its bound and the progress age. Below the recycle bound the verdict is
       unchanged. CRASH_LOOP, the pre-node rule, UNKNOWN, IDLE and the generation-boot rule keep their order and win
       first. The launcher acts only on action=recycle, so it needs no change.
    4. STILL RECYCLES. A pass past its own bound_ms with no abandoned row has a wedged bound timer, so it is not in
       flight, and the existing STALLED recycle applies. An abandoned pass is not in flight, so the existing age rule
       applies from there.
    The progress-watchdog COMMANDS detail in src/run-task.ts names IN_PASS, and docs/cli-reference.md is regenerated. Tests go in a new file, with `test(` titles
    verbatim as in the proofs below. They replay the 10-16 rows (06:10:59 started, 06:15:10 sweep.pass full, a 06:45
    pulse, now 06:45:28) and cover the pass past its bound, a settled pass, an abandoned pass, a pass from an earlier
    generation and a pass whose daemon stopped pulsing.
