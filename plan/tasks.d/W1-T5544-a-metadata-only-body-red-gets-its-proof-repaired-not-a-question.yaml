  falsifier: |
    Four reverts, each turning a named case red:
    - Restore the escalate-and-break for a proof-discrimination-only red: the routing case sees `deps.escalate`
      called and no proof-repair dispatch.
    - Drop the divergence cure: a trailer/body divergence fixture escalates "no deterministic acceptance repair".
