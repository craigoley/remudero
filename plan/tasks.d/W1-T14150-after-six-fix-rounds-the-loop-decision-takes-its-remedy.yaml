- id: W1-T14150
  title: After six fix rounds, the loop decision takes its remedy instead of asking the progress judge again
  repo: remudero
  depends_on: [W1-T13944]
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high # changes what the sweep does with a PR that has looped six fix rounds
  band_meaning: span
  origin: operator-session#decision-quality-2026-11-21
  plan_refs: [W1-T7243, W1-T12709, W1-T12710, W1-T13944]
  files:
    - src/lib/sweep.ts
    - src/lib/loop-decision.ts
    - test/sweep/after-six-fix-rounds-the-loop-decision-takes-its-remedy.test.ts
    - test/sweep/a-looping-pr-is-routed-push-through-rebuild-or-split-in-shadow.test.ts
  status: queued
  attempts: 0
  rationale: |
    READ at origin/main dd829e355 (2026-11-21).
    - src/lib/loop-decision.ts routes a looping PR to push-through, split or close-and-rebuild when its completed fix rounds reach 6
      (:92). It is shadow only (:45): logged as loop.decision with shadow:true (src/lib/sweep.ts:24326-24341) and never acted on.
    - Each further round asks the LLM progress judge (resolveFixProgress, src/lib/fix-progress-judge.ts:701-722; its prompt says
      "There is no hard round ceiling", sweep.ts:2570) and spends a worker.
    - The operator ruled on 2026-10-09, "I hate hard ceilings" (W1-T7243). So this is a remedy trigger, not a ceiling: the PR keeps
      moving by another route, the way fix.stallRounds does (takeStallRemedy, sweep.ts:14857-14914).
    - The remedy machinery exists: takeParkedPrRemedy and remedyStalledCriterion (src/lib/parked-pr-remedy.ts:225-290, :526-535).
    - W1-T13944 (in flight) changes parked-pr-remedy.ts and the sweep's follow-up claims, so this task follows it.
  design: |
    1. In the sweep's blocked-fixable askProgress closure (sweep.ts:26349-26414), after the progress input is built and before
       resolveFixProgress is called (:26384): when loopDecision for the PR reads its six-round trigger with a route, take that route.
       - split-follow-up and close-and-rebuild go through takeParkedPrRemedy, with cause `loop-decision`.
       - push-through goes through its existing path.
       Skip the judge call, and log loop.decision with shadow:false and the route taken.
    2. A PR the judge has already escalated, or one with an open operator question, is unaffected.
    3. runFixRung's own loop is unchanged, so test/every-fixed-repair-budget-defers-to-the-progress-judge.test.ts still holds.
    4. Update the shadow test that pins shadow:true for this trigger.

    INVARIANT a-remedy-not-a-ceiling: a PR past six rounds always gets a route that keeps it moving, never a stop.
  acceptance:
    - claim: "A PR with six completed fix rounds takes the loop decision's route and the progress judge is not called for that pass"
      proof: "grep: W1-T14150 criterion 1: in test/sweep/after-six-fix-rounds-the-loop-decision-takes-its-remedy.test.ts"
    - claim: "The route taken is logged on loop.decision with shadow:false"
      proof: "grep: W1-T14150 criterion 2: in test/sweep/after-six-fix-rounds-the-loop-decision-takes-its-remedy.test.ts"
    - claim: "A PR the judge escalated, or with an open operator question, is unaffected"
      proof: "grep: W1-T14150 criterion 3: in test/sweep/after-six-fix-rounds-the-loop-decision-takes-its-remedy.test.ts"
    - claim: "invariant:a-remedy-not-a-ceiling — every route taken keeps the PR moving: push-through, split-follow-up or close-and-rebuild"
      kind: guard
      proof: "grep: W1-T14150 criterion 4: in test/sweep/after-six-fix-rounds-the-loop-decision-takes-its-remedy.test.ts"
  falsifier: |
    Leave the decision in shadow and criterion 1 must fail. Stop the PR instead of routing it and criterion 4 must fail. Restore
    and require all to pass.
