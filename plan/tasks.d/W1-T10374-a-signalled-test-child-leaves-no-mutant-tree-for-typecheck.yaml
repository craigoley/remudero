- id: W1-T10374
  title: "A TEST CHILD KILLED AT ITS BOUND LEAVES NO `test/mutants-*` TREE BEHIND FOR THE TYPECHECK — `writeMutantModule` (test/helpers/mutant-module.ts) removes its `test/mutants-<rand>/` copies only in a `process.on(\"exit\")` handler, which a SIGTERM from a census-precheck child's 60 s bound never runs, and tsconfig.json's `include` (`test/**/*.ts`) has the next typecheck in the same preflight read the stray copies"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 3.00
  risk: high  # Rule 19: one concern, a mutant copy outliving its process (the helper's signal cleanup and the typecheck exclusion are its two halves); where the copy is written is unchanged
  band_meaning: span
  origin: "coordinator brief f1021b item 12 (2026-10-21), observed by the #13282 builder: a census-precheck child killed at its 60 s bound left test/mutants-<rand>/ directories that a later typecheck in the same preflight read"
  plan_refs: [W1-T5028, W1-T10332, W1-T10253]
  files:
    - test/helpers/mutant-module.ts
    - tsconfig.json
    - test/ci/a-signalled-test-child-leaves-no-mutant-tree-for-typecheck.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    REPORTED by the #13282 builder (coordinator brief f1021b item 12): after a census-precheck child was killed at its
    60 s bound, stray `test/mutants-<rand>/` directories stayed in the worktree, and a later typecheck in the same
    preflight read them. That builder's log is not retained, so the first falsifier step reproduces it.
    READ at origin/main 5ed301f42 (symbols, not lines):
    - `writeMutantModule` (test/helpers/mutant-module.ts) writes each copy with `mkdtempSync(join(TEST_DIR,
      "mutants-"))` and removes them in `process.on("exit", …)`. Node does not run `exit` handlers when a signal kills
      the process, and the census bound kills with SIGTERM. The helper's own comment names `.gitignore`'s
      `test/mutants-*/` as "the backstop for a run killed outright", which keeps git clean but not tsc.
    - tsconfig.json `include` is `["src/**/*.ts", "test/**/*.ts", "packages/*/src/**/*.ts"]` with `exclude`
      `["node_modules", "dist"]`, so a stray copy is type-checked as a test file.
    - The copy must stay INSIDE the tree: the helper's header records 14 measured runs in which a tmpdir copy destroyed
      unrelated modules' coverage (`LH:533` vs `LH:109`). So "isolate it outside the tree" is ruled out by that
      measurement, and this task keeps the destination.
    - W1-T10332 (this filing) changes how the fix rung REPORTS a timed-out census child; it does not clean up after one.
    NOT COVERED ELSEWHERE: swept origin/main plan/tasks.d and every open PR head's plan tree for mutant-module,
    writeMutantModule and test/mutants: no shard covers the killed-run case.
  design: |
    1. `writeMutantModule` also removes its copies when the process receives SIGTERM or SIGINT: a handler registered
       once removes every created directory, then re-raises the signal with the default action so the exit status a
       killer observes is unchanged.
    2. tsconfig.json excludes `test/mutants-*` beside `node_modules` and `dist`, so a copy left by SIGKILL (which no
       handler sees) is never type-checked. The copies are never imported by other test files, so nothing loses type
       coverage.
    3. No change to where the copy is written or how it resolves its siblings.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/ci/a-signalled-test-child-leaves-no-mutant-tree-for-typecheck.test.ts"
    - claim: "a child that wrote a mutant and is sent SIGTERM leaves no test/mutants directory and still exits by that signal"
      proof: "grep: W1-T10374: a mutant writer sent SIGTERM removes its copies and exits by the signal in test/ci/a-signalled-test-child-leaves-no-mutant-tree-for-typecheck.test.ts"
    - claim: "the typecheck configuration excludes the mutant copies"
      proof: "grep: test/mutants- in tsconfig.json"
  falsifier: |
    Remove the signal handler and the fixture child (writes a mutant, then is sent SIGTERM) leaves its
    `test/mutants-<rand>/` directory. Drop the tsconfig exclusion and the grep proof reads 0.
