  rationale: |
    OPERATOR DIRECTION, 2026-09-07: raise the review lanes. This records what justifies it and what
    does not, because the row's own prose demands "the measurement that justifies it rather than
    restoring on optimism".

    MEMORY — JUSTIFIES IT. The ceiling's reasoning was sized against "7.75 GiB total + 4 GiB
    swapfile", measured 2026-08-20. `free -h` on this host today: 31 GiB total, 19 GiB free,
    29 GiB available, swap untouched. The live `review.capacity` telemetry agrees —
    `mem_available_mib: 29838`, `cpu_psi_some_avg10_pct: 0`, `memory_psi_some_avg10_pct: 0`.
    dispatchLanes stays 2, so the host sum this row warns about goes 4 -> 5 against a ~1.33 GiB
    per-worker peak and a 1.5 GiB reserve.

    COST — DOES NOT. The hold is conditioned on "burn per run is down" against $0.63/run for REVIEW
    runs. Measured off the authoritative `verdict` rows, 2026-09-07: 18 costed runs, $102.89 total,
    p50 $1.68, p90 $20.89, max $23.95 — and NO review run carried cost in the readable window, so
    the populations are not comparable. The restore is therefore taken on operator direction and on
    the memory measurement, NOT on the condition the hold names.

    WHY THIS ROW IS LOAD-BEARING AT ALL. W1-T2853 shipped an adaptive widener meant to EARN lane
    three on a healthy window. It has fired 718 times since 2026-09-05 and granted it ZERO times;
    59% of refusals are missing telemetry rather than pressure (W1-T3025). Until that is fixed this
    committed value is the only way a third lane exists.

    W1-T1049's EQUALITY WAS NEVER THE INVARIANT. `reviewLanes === dispatchLanes` held only while
    the two values coincided; the split exists precisely so review can move without dispatch. This
    is the first time an operator has used it, and the test is corrected to pin the two rows
    independently rather than to each other.
  acceptance:
    - claim: "the committed review budget is three and the dispatch budget is unmoved at two, each pinned as its own literal so an unintended change to either still reddens"
      proof: "grep: reviewLanes and dispatchLanes are INDEPENDENT rows in test/review-lane-budget.test.ts"
    - claim: "the policy row records both measurements, including the cost condition that is NOT met"
      proof: "grep: COST, WHICH DOES NOT in plan/policy.yaml"
    - claim: "the admission bound still refuses a build in excess of the configured lanes, demonstrated with one more build than there are lanes"
      proof: "grep: the FOURTH build is not smuggled into the cheap lane in test/plan-filing-admission-bound.test.ts"
    - claim: "every suite that reads reviewLanes passes against the new value"
      proof: "unit test: test/review-lane-budget.test.ts"
  note: |
    risk:high IS RULE 19's SPAN, NOT BLAST RADIUS, and is set deliberately. `sizingViolation`
    derives concerns from `files:`, and this task's five test files read as five subsystems. They
    are not: this is ONE policy value moving, plus the four suites that pin it as a literal
    tripwire and one that fixtures against it. Every edit is mechanical and every one is forced by
    the same number. Same shape W1-T2733 and W1-T999 record on their own bands.

    REVERSIBLE, exactly as the 3 -> 2 hold was: this is a committed plan-data value, not a src edit,
    and Rule 26 override floors are untouched.

    THREE IS THE ROW'S MAX. Going beyond it needs `max` raised too, which is a larger decision than
    a retune: `max: 3` was sized on the 7.75 GiB host, and the memory measurement above would
    support more — but the host sum with dispatchLanes is the real exposure and nothing here has
    measured a 6-worker peak.

    NOT CLAIMED: no measurement here says three lanes will make reviews faster. The observed
    bottleneck on 2026-09-07 was CI latency and conflict churn, not lane starvation — zero reviews
    were deferred for want of a lane. This raises the ceiling; it does not demonstrate the ceiling
    was binding.
