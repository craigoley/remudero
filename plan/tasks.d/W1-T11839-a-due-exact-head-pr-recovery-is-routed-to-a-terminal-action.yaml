  rationale: |
    ORIGIN: the operator's 2026-11-08 request after PR #17389/#17394: PRs must flow, receive an exact same-PR fix, gain an owned follow-up, or use the existing gated rebuild path.

    INCIDENT EVIDENCE: the current report in docs/forensics/triage-incident-901cace1adefcf4b.md
    predates its archive correction. Direct reads of /home/craigoleyagent/rmd-state2/state/
    ledger.2026-11-08T14-55-52-853Z.ndjson.gz and ledger.2026-11-08T16-15-19-627Z.ndjson.gz
    confirm run 1 released refs/rmd-triage/incident-901cace1adefcf4b at 14:46:25.881Z with
    arm=holder and dropped=true while #17389 was open. Run 2 acquired that same ref at
    14:59:46.934Z with proceed=true and stale_released=false, before #17389 merged at 15:05:05Z.
    This proves premature holder release enabled the duplicate triage. The precise reason
    auto-triage's open-PR guard did not prevent run 2 remains unproven. W1-T12018 owns the
    evidence-cited report correction, and W1-T6117 already owns the crash-safe post-PR claim
    lifecycle fix. This task addresses the separate missing consumer for durable stuck-PR
    recovery records. Do not change issue #17393; it remains an open needs-human question.

    CURRENT ARCHITECTURE: W1-T11751 records recovery state, W1-T11750 supplies positive-controlled live PR inventory, W1-T11752 governs the owner/wake/escalation lifecycle, and W1-T11168 owns a distinct exact-head fix-dispatch hold. W1-T11031 owns the one-question-per-stalled-PR policy. W1-T11076/T11077 own loop disposition and the separately human-gated rebuild/split close path. This task consumes the recovery record only for same-PR repair; it does not duplicate the question or close/rebuild paths. The shared sweep file is integration wiring, not a second implementation of those owners.

    The consumer adds no new blocker taxonomy, age threshold, duplicate-triage theory, direct plan mutation, issue closure or bypass of the existing worker, review, acceptance, CI, security or human-release gates. A repair refusal or unresolved blocker remains open, owned and actionable.
  design: |
    1. Add a pure disposition planner beside the T11751 recovery record. It accepts the durable record, W1-T11750's positive-controlled inventory, and the exact PR head/blocker; it yields one repair intent or a held/unknown result.
    2. In the sweep, revalidate repository, PR number, full head SHA, current blocker and positive-control result immediately before the effect. A moved head supersedes the old input; a cleared blocker resolves it; unreadable/incomplete evidence makes no write and preserves the owner/deadline.
    3. Route only repairable current blockers through the existing fix-worker dispatcher with exact failure evidence and same PR/head. Key the receipt on the existing recovery key so overlapping sweeps and restart cannot create duplicate attempts.
    4. Treat refusal, no-op, missing files and still-red exact head as nonterminal. Preserve owner/deadline and do not re-dispatch unchanged input outside the existing policy-permitted rung.
    5. Record resolution only after a fresh exact-head observation proves the blocker cleared or the PR merged. Keep needs-human issues open; rebuild/split and source closure remain exclusively behind W1-T11076/T11077's existing human gate.
  falsifier: |
    Replay one due input twice; more than one fix attempt or terminal receipt falsifies idempotence. Move the PR head or clear the blocker between planning and effect; any stale-head effect falsifies revalidation. Make the inventory/control unreadable or keep a needs-human issue open; any PR/issue close falsifies fail-closed ownership.
