  rationale: |
    ORIGIN: the operator's 2026-11-08 request after PR #17389/#17394: a PR must flow, receive an exact same-PR fix, gain a filed follow-up, or close only after a linked rebuild plan exists.

    CURRENT EVIDENCE: PR #17389 and PR #17394 published conflicting semantic verdicts for the same feedback item. The read-only investigation in W1-T11812 and merged PR #17447 returned `unknown`: the positive-control row proves the ledger corpus was visible, but the two disputed runs lack claim/release and entry-point receipts. Do not infer that the triage claim was bypassed or released early, and do not change issue #17393; it remains an open `needs-human` question.

    Settled by lookup against current origin/main: W1-T11751 writes durable per-(repo, PR, exact head, failure class) recovery records in shadow; W1-T11752 gates owned wake/escalation and deliberately adds no human-question close; W1-T11168 handles a distinct exact-head fix-dispatch hold. W1-T11076 chooses a loop disposition, and W1-T11077 is the separately human-gated rebuild/split path that requires child filing on origin/main before source closure. W1-T4458 through W1-T4462 repair conflict-worker mechanics and related same-head routing, but do not consume the new recovery record. These are components to join, not work to copy.

    W1-T11031 owns only the one-question-per-stalled-PR policy; W1-T11839 preserves that question and adds exact-head repair/rebuild routing from durable recovery records, it does not create another question family.

    This task is the action consumer only. It adds no new blocker taxonomy, age threshold, duplicate-triage theory, direct plan-file mutation, or bypass of the existing worker, review, acceptance, CI, security or human-release gates. The dependency on T11077 is intentional: the existing seven-day observation and operator spot-check remain mandatory before the rebuild/split close path is released. `unknown` remains a named, owned state; it never becomes permission to close.
  design: |
    1. Add a pure disposition planner beside the T11751 recovery record. Its input is the durable record plus W1-T11750's positive-controlled live PR inventory plus the exact PR head, blocker class, required checks and any existing loop decision. Its outputs are a single idempotent action intent or a held/unknown result; it does not invent new classes or SLOs.
    2. In the sweep, revalidate the PR number, repository, full head SHA, current blocker, and positive-control result immediately before executing an intent. A moved head supersedes the old recovery record; a cleared blocker resolves it; any unreadable/incomplete read holds it with the existing owner/deadline and makes no write.
    3. For a repairable current blocker, route through the existing fix-worker dispatcher with the exact failure evidence and same PR/head. Key the action receipt on the T11751 recovery key so replay, overlapping sweeps and restart cannot create a duplicate attempt. Keep the current author/CI/review/security gates intact.
    4. A worker refusal, no-op, commit refusal, missing files or still-red exact head is not `fixed` or terminal. Preserve the owner and deadline and feed the existing judge/rung path; an unchanged failure cannot silently reset its age or re-dispatch without a new policy-permitted action.
    5. Route rebuild/split only through the existing T11076/T11077 decision path after its human release gate. Before close, verify every replacement is filed and visible on origin/main and the source PR durably links it. If filing/linking or that verification fails, keep the source PR open and owned.
    6. Write one terminal receipt only after the exact postcondition is observed: `resolved`, `merged`, `superseded_by_head`, `closed_after_replacement`, or `escalated_to_human`, with head, action, evidence and linked replacement identifiers. Preserve all earlier transitions; identical input produces no new effect or receipt.
    7. Keep issue/question disposition separate from PR disposition. A needs-human issue remains open until its existing authorized revalidation garden resolves it; this consumer may file/link an actionable question but never closes it.
  falsifier: |
    Replay the same due input twice; more than one fix attempt or terminal receipt falsifies idempotence. Move the PR to a different head after record creation; any old-head effect falsifies revalidation. Remove the on-main replacement or source-link check; the source-close test must fail. Make the inventory/control unreadable or preserve a needs-human question; any PR/issue close falsifies fail-closed ownership.
