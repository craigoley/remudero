- id: W1-T5042
  title: "Refuse a self-crediting plan filing before its first push, while its branch can still be changed"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 8.00
  files:
    - hooks/pre-push
    - scripts/worker-branch-shape.mjs
    - test/prepush-self-crediting-plan-filing.test.ts
  origin: "operator-session#plan-only-credit-correction-2026-10-01"
  plan_refs: ["W1-T3994", "W1-T3996", "W1-T5016", "W1-T5017"]
  status: queued
  priority: 1
  rationale: |
    OBSERVED 2026-10-01: plan-only PRs 8212 and 8213 were pushed and merged from
    their own run-shaped branches. Both only added a plan shard, yet the live
    merge-credit store counted each as an implementation. W1-T3994 already
    detects the exact plan-filing-run-credit shape in worker-branch-shape.mjs,
    but hooks/pre-push does not invoke that detector. A required check after
    the PR opens would leave its immutable head ref stuck; the useful time to
    refuse this known-bad shape is before the first push.
  design: |
    Add a narrow mode to the existing branch-shape script that refuses only
    plan-filing-run-credit: an added plan shard whose task id equals the
    pushed run-<id>-<epochMs> head, with a nonempty plan-only diff. Invoke it
    from hooks/pre-push using the remote ref already parsed for the advisory
    head-identity check. Do not promote every branch-shape finding to a block.
    A missing merge base, unreadable diff, or unparseable head must report
    unknown and leave the push alone; never reinterpret it as a clean check.
    Keep non-run filing branches and real implementation branches flowing.
    Do not add a required post-PR check for this immutable-branch error.
  acceptance:
    - claim: "an exact self-crediting plan filing is refused before its first push"
      proof: "grep: self-crediting plan filing is stopped before its first push in test/prepush-self-crediting-plan-filing.test.ts"
    - claim: "ordinary filing and implementation branches still push"
      proof: "grep: non-crediting filings and implementation branches remain pushable in test/prepush-self-crediting-plan-filing.test.ts"
    - claim: "unreadable local evidence warns but does not block the fleet"
      proof: "grep: unreadable branch-shape evidence cannot strand a push in test/prepush-self-crediting-plan-filing.test.ts"
    - claim: "the existing branch-shape script exposes a narrow self-credit-only mode"
      proof: "grep: selfCreditOnly in scripts/worker-branch-shape.mjs"
  falsifier: |
    In a fixture repository, add one plan/tasks.d shard for the id named by
    the pushed run branch. Without the hook call, git push succeeds; with it,
    the exact filing is refused. Change only the pushed ref to a non-run
    filing branch or add a source file to the diff: both must pass. Make the
    merge base unreadable: the hook must warn and leave the push available.
  note: |
    Filed from the non-crediting reservation holder
    codex/file-plan-credit-push-1790818995480. Implementation belongs in its
    own PR after this plan-only filing, never on this branch.
