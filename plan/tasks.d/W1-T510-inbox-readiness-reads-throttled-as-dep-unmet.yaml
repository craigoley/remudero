  note: "verify:auto — `classifyProposal` is a PURE function over an injected context, so every claim
    is decidable in-process against seeded projections. No network, nothing spawned, no operator present.
    risk:high IS RULE 19'S SPAN, DECLARED UP FRONT rather than shipped as a violation: the contract
    lives in src/lib/inbox.ts and its only producers are the four injection sites, which Rule 19 counts
    as three further subsystems. Splitting the contract from its callers would leave a widened
    ReadinessContext nothing supplies — a dead field, which is the failure mode this repo files tasks
    about. The blast radius is smaller than the band suggests; the part worth reviewing is design (ii),
    because a version that flips an unobservable dep to READY ratifies against a dependency that may
    not exist.
    budget_usd 65 — the cost is design (iii)'s per-site absence ruling and the both-directions fixture
    of criterion 2, not the optional field, which is a few lines.
    ON THE PROOFS: test/inbox-deps-unobservable.test.ts does not exist yet — a forward reference to a
    PATH, and it is declared in files: so the worker creates it. The three grep proofs name
    `depsUnobservable`, which exists NOWHERE in src/ today (verified at filing), so none of them can
    pass before the work is done; they are the injection AUDIT the report asked for, one per path.
    WHAT THIS TASK DOES NOT RE-DERIVE: that the injected resolvers are production derivation. All four
    were read at filing and all four are. A worker that spends budget re-auditing that has been sent
    to the wrong place — the rationale records the refutation so it is not relitigated a third time.
    NO depends_on: the `indeterminate`/`unavailableReason` fields this consumes shipped with W1-T119
    and are live in src/lib/status.ts today. W1-T415 would widen WHEN indeterminate fires (truncation);
    it is a plan_ref, not an edge, because this fix is correct with or without it."
