  falsifier: |
    At origin/main, the fixture's pooled survivor median of about 10 h divides every age. A 12 h P2 has urgency
    0.5 * (1 + log2(2.2)) = 1.07 against the fresh W1-T9926's 1, so the P2 sorts first and the first test fails.
    With the fix, the P2 ages in the P1 tier's own wait of about 24 h: 0.5 * (1 + log2(1.5)) = 0.79 < 1, so W1-T9926
    leads, and at 30 h, 0.5 * (1 + log2(2.25)) = 1.08, the P2 leads again.
    Ways to break it, and the test that catches each:
    - Drop the censored observations: the 2/3/4 h + three-at-20 h tier reads 3 h, and the censoring test fails.
    - Use each tier's own wait without the envelope: the short-wait P2 tier closes on P1 early, and the envelope test fails.
    - Delete the amended W1-T9323 case: the grep on its message reads 0.
