  design: |
    No fixed count, interval or cap (standing operator rule). Every wait is measured, and the ready row reports it.
    1. A TIER'S OWN WAIT, CENSORING-AWARE (`costOfDelayContext`, src/lib/dispatch-value.ts).
       - A tier is one declared priority value among the plan's tasks. An absent priority is its own tier, as in
         `priorityTiers`. A historical task's tier is its shard's current priority.
       - Per tier, build a Kaplan-Meier sample over the evidence window:
         - an EVENT for each task with a first start: `firstStart - filedAt`, exactly the pairs `waits` uses today;
         - a CENSORED observation for each dated, open, never-started task: `nowMs - filedAt`.
       - A task filed before the window's earliest row is left out of the sample. A start the window cannot see must
         never read as a wait still running.
       - The tier's wait is the smallest event time at which its survival falls to one half or below
         (`censoredMedianWaitMs`).
       - A tier whose curve never crosses one half borrows the POOLED curve over every tier, built the same way.
       - If the pooled curve never crosses one half either, its longest event time is used as a lower bound, and the row
         says `bound: lower`.
       - With no event at all, the context is refused `no-wait-evidence`, as today.
    2. THE UNIT THAT CLOSES A GAP. A task in tier t ages in `unit(t)`: the largest tier wait at t or at any higher tier
       (any smaller declared priority).
       - So the envelope never shortens going down the tiers.
       - Against a fresh higher-tier task, a 1-tier gap closes only once the lower task's age passes `unit(t)`. That is
         at least the higher tier's own wait.
       - `urgency = dispatchUrgency(tierOf(task), age / unit(tier(task)))`. `dispatchUrgency` itself, `priorityTiers`,
         the validity share, the fan-out term, the stride pass and `compareDispatch` are unchanged.
       - Update `dispatchUrgency`'s doc comment to say the wait is the tier's own unit.
    3. VISIBLE. `costOfDelayReadyRow` gains `tier_waits`, deduped per plan tree as `imputed` is. Each entry holds
       `{priority, wait_ms, events, censored, source}`, where `source` is `own`, `pooled` or `pooled-lower-bound`.
    4. W1-T9323'S ACCEPTANCE TEST IS AMENDED, NOT DELETED.
       - In test/dispatch-orders-by-a-cost-of-delay-score-with-priority-as-one-input.test.ts, the test
         "W1-T9323: a lower-priority task that has waited past the median wait outranks a fresh higher-priority task"
         keeps its title byte for byte. W1-T9323's merged grep proof reads that title, and Rule 21 leaves a merged
         shard to its follow-up, which is this task.
       - Its body keeps the existing case. There the P1 and P2 tiers have no events of their own, so both borrow the
         pooled 2 h wait and the 5 h P2 still leads.
       - It ADDS the case the ruling is about. Give the P1 tier its own history with a measured wait longer than 5 h:
         the same 5 h P2 no longer outranks the fresh P1, with the assertion message
         "W1-T9967: inside the higher tier measured wait the fresh task still leads". Then age the P2 past that wait
         and assert it leads again.
       - The comment above it changes from the additive `1 + 5h/2h` arithmetic to the tier-unit arithmetic.
       - Every other test in that file, and in test/priority-weights-dispatch-urgency-so-age-cannot-swamp-intent.test.ts,
         passes UNCHANGED. Their history tasks are outside `tasks`, so they are pooled, and their open tasks have no
         events. If one does not pass, the PR body names it and why.
    5. TESTS. New tests go in test/a-lower-tier-overtakes-only-after-the-higher-tiers-own-measured-wait.test.ts, with
       `test(` titles verbatim as in the proofs. Build injected plans and evidence rows with fixed timestamps, using
       `buildDispatchValueContext` and `dispatchOrder` exactly as the W1-T9323 file does. No live ledger, no git and no network.
       - The falsifier pair: W1-T9926 (P1, fresh) against an old P2. The fixture's pooled survivor median is about 10 h,
         and the P1 tier's censoring-aware wait is about 24 h. A 12 h P2 sorts AFTER W1-T9926, and a 30 h P2 sorts before it.
       - A tier with three started tasks (2 h, 3 h, 4 h) and three still waiting at 20 h reads its wait as 4 h, not
         3 h: the censored tasks hold the curve up. A survivor-only median gives 3 h.
       - A tier with no crossing borrows the pooled wait, and the ready row names `source: pooled`.
       - The envelope: a P2 tier whose own wait is SHORTER than P1's still closes its gap on P1's wait.
