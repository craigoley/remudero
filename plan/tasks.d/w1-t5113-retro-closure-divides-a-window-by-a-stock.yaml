- id: W1-T5113
  title: "THE RETRO'S CLOSURE-BY-CLASS RATE DIVIDES A WINDOW'S MERGES BY THE WHOLE OPEN BACKLOG AND UNDER-CREDITS THE MERGES — src read 0.000-0.020 across 14 snapshots (merged 0-13 over a denominator of ~650 open tasks), while GitHub merged 10 run-W1 PRs in a window credited 4, and 15 in a window credited 0"
  repo: remudero
