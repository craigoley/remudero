  title: "THE ARTIFACT RECLAIMER SCANS A DISK THAT CAN FILL — `sweepReclaimableArtifacts` defaults its scan root to `join(config.root, \"..\")`, which in the daemon container is /home/node, reads that filesystem's free space against 6 GiB, and logs `headroom-ok` every tick: the research count was 1,046 passes and 0 reclaimed, while the coverage and node_modules it was built for sit on host disks it never reads"
  repo: remudero
  depends_on: [W1-T3528]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the artifact reclaimer reads the disks it can reclaim
  band_meaning: span
  origin: "operator session 2026-10-04: research/flow/report.md janitor gaps, follow-up audit (research/audit/followups.md) section B"
  plan_refs: [W1-T3528, W1-T5707, W1-T5709, W1-T5712]
  files: [src/lib/disk-artifact-reclaim.ts, src/lib/config.ts, test/the-artifact-reclaimer-scans-a-disk-that-can-fill.test.ts, "src/lib/config-schema.ts"]
  status: merged
  priority: 3
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 70bb29f8 and the live ledger, read only. W1-T3528's
    `sweepReclaimableArtifacts` (src/lib/disk-artifact-reclaim.ts, called each daemon tick through
    run-task.ts) takes `scanRoot` = `join(config.root, "..")` and returns at once when
    `freeBytes(scanRoot) >= DEFAULT_RECLAIM_BELOW_BYTES` (6 GiB). Every row in the current daemon
    ledger is `disk_artifact.sweep.kept` with path "/home/node", reason "headroom-ok", freeBytes
    12194226176 (4 of 4 rows; 8,102 step rows read as the control); research/flow/report.md counted
    1,046 passes and 0 reclaimed. The hand checkouts and coverage scratch the module's header names
    live on host disks (/mnt/rmd, /mnt/scratch) that this root never reaches. Batch-10's disk tasks
    (#9155, open) do not touch it: W1-T5707 reaps /mnt/rmd's top level from the host janitor,
    W1-T5709 moves coverage scratch, W1-T5712 hard-links installs.
  design: |
    Take the scan roots from config (a list; each root read for its own filesystem's free space),
    defaulting to the parent of `config.root` as today, and name the deployed host roots the
    container can see in the deploy config, measured and listed in the PR. When a root's
    filesystem is not the one the host janitor watches, log that once per boot as
    `disk_artifact.sweep.root_unwatched` so an inert sweep is visible. Keep every refusal (dirty
    tree, grace, in-use) unchanged. If no host root is visible to the container, say so in the PR
    and retire the per-tick call rather than keep logging `headroom-ok` on the wrong disk.
  acceptance:
    - claim: "with two configured scan roots on fixture filesystems, the sweep reads each root's own free space, reclaims a stale artifact under the root below its mark, and keeps the other root at headroom-ok"
      proof: "unit test: test/the-artifact-reclaimer-scans-a-disk-that-can-fill.test.ts"
  falsifier: |
    Keep the single parent root: the fixture's second root is never scanned and the stale artifact
    survives, and the test fails.
