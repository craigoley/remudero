- id: W1-T3289
  title: "THE DETERMINISTIC RATCHET REPAIR IS RATIFIED BUT UNREACHABLE — `recordableRatchetRepairEnabled` is an optional SweepPolicy field that DEFAULT_SWEEP_POLICY never populates and policy.yaml has no row for, so there is no value anyone can set to turn it on"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
