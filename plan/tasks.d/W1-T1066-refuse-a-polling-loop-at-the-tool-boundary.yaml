  status: queued
  attempts: 0
  note: |
    RENUMBERED FROM THE ID THIS SHARD FIRST CARRIED, WHICH THE OPERATOR ASSIGNED TWICE IN
    ERROR. Two open PRs filed the same integer; `loadPlan` throws `duplicate task id` on that
    shape, so both merging would refuse every plan-reading verb on origin/main. The other PR
    claimed it first and is untouched. W1-T1055 (#2281, merged) is the filed defect behind it:
    the printing verb reserves nothing, so two callers can hold the same integer with neither
    at fault.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `lint-plan` counts two
    concerns here — deny-floor and settings — and refuses that at medium. DECOMPOSITION IS DECLINED
    WITH A REASON: a refusal rule nothing loads is the ships-unwired shape this repo already has a
    floor for (`test/ships-unwired-floor.test.ts`), and the settings file is the only thing that makes
    the rule reach the population that polled. Splitting them ships a gate that refuses nothing, then
    a config that points at a rule which may not exist yet. The rule and its reachability are one
    change.

    THE ONE OUTCOME THAT WOULD KILL THIS TASK WAS CHECKED AND DID NOT HAPPEN. If neither interactive
    lanes nor workers could be reached by a hook, the shard would be undeliverable and should be
    dropped rather than built. Workers are reached today (`settings/worker.json`); interactive lanes
    are reachable at the cost of one un-ignored path (rationale 2 and 3). Both populations are
    therefore addressable, and the task stands.

    THE MEASUREMENTS ARE QUERIES, NOT QUOTED NUMBERS. Re-derive the loop inventory with
    `git grep -nE '(while|until|for)[^#]*;[[:space:]]*do\b' -- deploy/ scripts/ .github/workflows/ bin/`,
    the ledger figures with the per-form union read (control first), and the byte budget with
    `npm run --silent claude-md-budget-ratchet`.
