  title: "A MERGED DEPLOY CONTRACT HAS NO LIVE COMMISSIONING PROOF — W1-T3245 is merged and the renderer's watchdog tick runs `deploy-run`, yet the Azure host was observed 2026-09-20 with only a heartbeat cron and `host-update.sh --reclaim-only`, and remudero-serve on baked 089af54c while origin/main was efdd3169"
