  rationale: |
    OBSERVED 2026-11-16 on the operator Mac by the operator session. Three hand-built pull requests were refused by the author preflight for failing tests that were not in the change's files:
    - W1-T12945 as #18881: 1 failing of 8,552 tests;
    - W1-T13146 as #18893: 11 failing of 12,806;
    - W1-T13051 as #18894: 1 failing of about 11,000.
    Each time the operator session did the attribution by hand: it ran the failing suites on a tree equal to main (all but one failed there identically), ran the remaining one alone on the branch (it passed), wrote the table into the pull request body, and asked the operator for a one-PR waiver. Four of the suites that fail on a tree equal to main on that Mac are filed beside this task (W1-T13211, W1-T13212, W1-T13213, W1-T13214).

    READ scripts/preflight-author.mjs on origin/main (2d69d3780c):
    - The run knows its base and its diff: `receipt.baseSha = git(['rev-parse', 'origin/main']).trim();` and `git(['diff', '--name-only', '-z', `${receipt.baseSha}...${receipt.headSha}`])`.
    - It knows what failed: the affected-tests stage is a judged TAP run (`const tests = runStep(testsName, child.args, child.file, judged.env, AUTHOR_STEP_RUNTIME_MS, slot.heartbeat);`) summarised by `testSummary`.
    - `authorPushEligibility` answers no for any failure: `` return answer(false, `${failed.name} failed${failed.testSummary?.fail ? `: ${failed.testSummary.fail} failing test(s)` : ''}...`) ``. `concludeAuthorRun` prints `author verdict:` and `author push-eligible:`, and since W1-T12842 (merged 2026-11-16, #18867) one verdict row per run goes to the ledger. W1-T13147 (queued) adds refusal classes to that row.
    - Nothing in it compares a failure with the base. The preflight has the failing files, the merge base and the host; the comparison is the part a person does today.
  design: |
    1. After an affected-tests stage (whole or subset) that reported failing tests, and only then: resolve the merge base of the head and origin/main, create a scratch worktree at it under the run's own temp root, and run the failing FILES there with the same runner arguments, in the test slot the run already holds (one after the other with the head run, never beside it: the Mac's memory headroom is thin).
    2. The base run's bound is the time those files took at the head, taken from the head run's own durations, with the stage's existing ceiling as the backstop. No new fixed number.
    3. The scratch worktree uses the head's installed dependencies only when the lockfile is identical at the base and the head. Otherwise the base run is not attempted and every failure is unattributed, with that reason. A failing file the base does not hold is the change's by definition and is not run.
    4. Print one line per failing test: file, test title, and `also red at the base on this host`, `red only at the head`, or `unattributed: <reason>`. Then one summary line with the four counts. The verdict row carries the counts, in fields that sit beside W1-T13147's class.
    5. Remove the scratch worktree through git in a finally step, and say so if that fails. It must not be left for a janitor.
    6. `authorPushEligibility` is not edited. A run with failures is not push-eligible, exactly as today, and the exit code does not change.
    INVARIANT a-failure-the-change-caused-is-never-pre-existing: "also red at the base" is printed only for a test title that was reported failing in a completed base run of the same file; every doubt is unattributed or the change's.
    NOT IN SCOPE: turning "every failure is also red at the base" into a pushable verdict. That is a separate operator decision: this task produces the evidence a waiver is asked on, and changes no rule. Also not in scope: the census precheck's own reds; the hosted checks; fixing the suites that are red at the base.
  falsifier: |
    Skip the base run and criterion 1 must fail. Label a test pre-existing when the base run was cut short and criterion 2 must fail. Drop a count from the row and criterion 3 must fail. Label a test that passes at the base as also red there, or make a run with failures push-eligible, and criterion 4 must fail. Restore and all pass.
