    - claim: "Replayed through fixSeedRead as a later run than the seed's, the recorded #15108 rows read as ended, not live. The rows are the seed sweep.disposed (acted, blocked-fixable, head 6416e8d, 2026-10-29T03:21:06.706Z); fix.dispatch at 03:31:31.971Z; fix.done at 03:32:34.559Z with subtype push_failed, worker_exit exit, worker_exit_code 0 and no pushed_head_sha; fix.strike_refunded (push-not-landed); and the later run's boot and adoption pass, which adopted 2 live children of other tasks. The same rows with the push landed (subtype success and a pushed_head_sha that differs from the head) keep their current reading, and a rung still in flight (a fix.dispatch with no fix.done) still reads live"
