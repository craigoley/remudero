    `files:` IS DECLARED AS THE HONEST SPAN AND ONE PATH MAY GO UNUSED — the model may already reach serve.ts
    through src/lib/board.ts alone, in which case src/lib/panel-graph.ts is an `inverse_scope` ADVISORY, not
    a gate. DROP an unused path rather than editing a file to satisfy the list (the W1-T463 precedent). It is
    declared because the projection route is the plausible seam for the combined-status value and a
    scope_guard refusal mid-run costs a whole dispatch.
    SOURCE-VERIFIED AT FILING: `reviewState` has zero occurrences under src/lib/serve.ts, src/lib/board.ts and
    src/lib/panel-graph.ts; src/lib/board.ts's entry interface carries prNumber/prUrl/prTitle and no review
