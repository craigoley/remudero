  note: |
    risk:high is Rule 19's SPAN (three src/lib modules plus test/), the W1-T310 grade. Blast radius
    argues DOWN: one optional field and one text span; the worst failure is a wrong word on a card.
    budget_usd 60 — close to W1-T929's 55 for the same shape (one derivation, one render site) plus
    the client-side ageing tick.
    depends_on W1-T942 because there is nothing to render until worker.state rows exist; shipping the
    render first would put a permanent "state unknown" on every row, which is W1-T323's ships-unwired
    shape wearing an honest label.
    SERIALISATION, STATED RATHER THAN DISCOVERED: W1-T945 also declares src/lib/serve.ts, so these two
    cannot batch. That is the partitioner working correctly on a real shared file, not a filing
    defect. Neither declares src/lib/worker.ts, so both stay clear of W1-T942's own lane.
