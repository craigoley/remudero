  rationale: A complete Today/Yesterday report must survive Recent feed truncation, read-model scratch deletion,
    browser closure and restart. Existing Analytics collection is view-switch dependent, existing windows are
    UTC, and current open PRs do not reconstruct yesterday midnight. Operators need each repository and the
    authorized whole fleet with truthful coverage.
  design: >-
    Implement daily-progress-v1 from W1-T10558 as an independently owned core read-model collection unit.
    Reuse the existing complete paginated PR collector, cached authoritative mergedAt and exact Remudero-Task
    trailer UNION run-branch delivery joins; retain current collection success/truncation/error receipts, not
    only last-good file mtimes. Exclude known non-fleet PRs and surface unknown attribution outside confirmed
    fleet counts. Reuse ledger projection/union for observed activity with explicit retention/parse coverage;
    never claim complete history from compacted views.


    Persist canonical events, report revisions and due/job receipts under durable state outside
    RMD_READ_MODEL_DB_DIR. Atomic committed publication and owner-epoch fencing prevent stale/overlapping
    writers and success before persistence; corrupt history refuses and stays available for diagnosis.
    Pagination bounds response evidence, not stored/count populations. Hourly collection works with no browser
    and Analytics off; local midnight changes Today/Yesterday pointers independently of closing
    reconciliation; restart catches up missed hourly/closing work and bounded late-event corrections create
    immutable source-date revisions. Retain last-good report with its actual cutoff/failure on source errors.
    Derive local calendar days in one explicit IANA zone, initially America/New_York, including DST 23/25-hour
    days; do not add 24 elapsed hours. History remains identified by its original zone/date when settings
    change.


    Serve the new authenticated cached /v1/views/daily-progress contract with bounded known
    repository/zone/date/page/revision parameters and server-owned registry scope; filter scope before
    aggregate counts and coverage. Do not trust browser daemon URLs or path fragments. No per-user ACL
    capability is assumed beyond actual service/console authorization. Register the route in the existing
    contract/OpenAPI/view wiring, preserve shadow/activation policy and verify served adoption independently.
    Use deterministic summaries; distinguish merged work, independently evidenced releases, observed day
    activity and present open work. No request-time scans, second GitHub fetcher, paid summarizer, cron,
    daemon restart, gate change or borrowed test slot.
  falsifier: Keep the new tests and independently remove durable retention, calendar arithmetic, expected scope
    or ownership fencing. The >200/restart, DST, missing-source and stale-writer tests respectively must fail.
    Use a real filesystem persistence failure, browser-closed worker integration, known fleet/non-fleet PR
    controls and zero-work complete-corpus control. Restore and prove exact summaries. No source or CI receipt
    claims deployment.
  acceptance:
