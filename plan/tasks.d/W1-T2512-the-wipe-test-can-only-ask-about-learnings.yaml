    - claim: "the learnings factor's arm A and arm B behave byte-identically to today"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "the aggregate can be taken per factor, and never mixes two factors into one report"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "a ledgered pair predating this change still aggregates as a learnings pair"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "both zero-work backstops still refuse a pair neither arm measured, for every factor"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
    - claim: "the sandbox-only refusal still fires for every factor, not only for learnings"
      proof: "unit test: test/the-wipe-test-can-only-ask-about-learnings.test.ts"
