- id: W1-T2512
  title: "THE WIPE TEST CAN ONLY EVER ASK ABOUT LEARNINGS — `WipeTestArm` is `\"A\" | \"B\"` where B means one hard-coded thing (mask injection), so the harness that exists to make overhead falsifiable cannot be pointed at the LARGEST per-task overhead there is: the RECON SPAWN, a whole worker per dispatch capped at 20 turns; and the masked arm needs no new code path because W1-T299 already ships and exercises the degrade-to-implement-without-recon behaviour"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 18.00
  files: [src/lib/wipe-test.ts, src/run-task.ts, test/the-wipe-test-can-only-ask-about-learnings.test.ts]
  origin: "operator-brief#reduce-the-overhead-and-tokens-per-task-2026-08-30"
  plan_refs: ["W1-T86", "W1-T299", "W1-T2241", "W1-T1253", "W1-T1252"]
  status: queued
  attempts: 0
  rationale: |
    THE HARNESS IS RIGHT AND ITS APERTURE IS ONE FACTOR WIDE. `src/lib/wipe-test.ts`'s own header
    states the design cleanly: W1-T19 injects learnings into every implement prompt and "nothing
    measures whether that injection changes an outcome — the claim 'memory helps' was
    unfalsifiable". The wipe test is that falsifier, and everything expensive about building one is
    already built: paired A/B dispatch of the SAME task, `computeWipeTestDelta` over
    turns/cost/strikes/verdict/proof_exec, `aggregateWipeTestPairs` (pairs, avgTurnsDelta,
    avgCostDelta, avgStrikesDelta, verdictChangedCount, verdictChangedRate), the pairing discipline
    that treats a single pair as an anecdote, `resolveWipeTestTarget`'s sandbox-only refusal,
    `generateSandboxTask`'s subject supply (W1-T1253), and TWO independent zero-work backstops
    (W1-T1252) so a pair neither arm measured is never ledgered.

    WHAT IT CANNOT ASK. `export type WipeTestArm = "A" | "B"` — the arm is a POSITION, and the thing
    arm B masks is hard-coded at `computeMatchedLearningsForArm` and carried into `runTask` as the
    single boolean `opts.maskLearnings`. There is no seam for a second factor. MEASURED, and this is
    the whole filing, run with `git grep` (never the harness `grep`, which injects `-I`):

      git grep -n -E 'skipRecon|noRecon|reconOff|--no-recon|maskRecon' -- src/   => 0 lines
      git grep -n 'maskLearnings' -- src/                                       => 6 lines

    Zero seams for a recon arm — no arm, no flag, no opt, nothing — against a POSITIVE CONTROL run
    with the SAME tool over the SAME corpus that finds the sibling factor at every site it lives:
    the opt declaration (run-task.ts:10007), the arm dispatch (10896), the ledgered `masked` field
    (10923), and `wipeTestCommand`'s own arm wiring (27534) — which is precisely the line a second
    factor has to generalise.

    RECON IS THE FACTOR WORTH ASKING ABOUT, BY COST. Every dispatch pays recon -> implement -> review.
    Recon is a full worker spawn routed through `routes.recon` with `RECON_MAX_TURNS = 20`, and its own
    doc records the calibration honestly: over 18 recons on 2026-08-03, 11 died on the cap and the
    successes ran 5-8 turns on sonnet. That is a real, recurring, per-task cost, and unlike learnings
    injection — which is text in a prompt — it is an entire additional model session with its own
    latency. Its VALUE has never been measured against a run without it. "Recon helps" is exactly as
    unfalsifiable today as "memory helps" was before W1-T86, and it is the more expensive claim.

    THE MASKED ARM COSTS NO NEW BEHAVIOUR, WHICH IS WHY THIS IS CHEAP. W1-T299 already changed a
    second recon error from fatal to a DEGRADE: "the run still reaches implement with an explicit
    absent-context note — rather than ending the dispatch". So "implement without recon context, and
    say so in the prompt" is a path this repo already ships, already exercises in production, and
    already names in the ledger via `reconDegradedSubtype`. A recon arm B does not invent a code path;
    it ENTERS an existing one deliberately instead of only by accident. That is the same discipline
    arm B already keeps for learnings — MASK, never delete; the artifact store and
    `reconArtifactValid`'s reuse check must be untouched, so a masked arm reads nothing and writes
    nothing.

    WHY GENERALISE RATHER THAN ADD A SECOND BOOLEAN. A `maskRecon?: boolean` beside `maskLearnings?:
    boolean` would work once and rot immediately: the next factor anyone wants to price — the review
    spawn, the fix rung's strike budget, learnings LAYER by layer — adds a third boolean, and the
    ledger's `wipetest.pair` rows stop being comparable because nothing in them says WHICH factor the
    pair varied. Name the factor in the arm and in the ledger row, so an aggregate can be taken per
    factor and old rows (which varied learnings) keep meaning what they meant.

    THIS IS THE MEASUREMENT THAT PAYS FOR PARALLELISM. The operator's ask is fewer tokens and less
    overhead per task WITHOUT losing effectiveness, so more lanes fit in the same budget. Static
    context is already known not to be the lever — CLAUDE.md plus learnings is a low single-digit
    percentage of a task's spend. A whole worker spawn per dispatch is a different order of magnitude.
    This task does not remove recon and must not: it builds the instrument that could justify removing
    it, narrowing it to a subset of tasks, or keeping it with evidence.

    NOT IN SCOPE, EXPLICITLY: any decision about recon itself — no default changes, no routing
    changes, no cap changes; running the experiment (an operator action under Rule 18, exactly as
    W1-T86's header already records for learnings); and `--rerun` passthrough, which W1-T1252's
    design note (iv) already declined for a stated reason that is unchanged here.

    WHY BOTH SRC STEMS ARE ONE CONCERN. A factor seam in `wipe-test.ts` that `runTask` never consults
    measures nothing — it would be a type with no instrument behind it, and the harness's whole
    complaint is about unfalsifiable claims. So the arm model and the one `runTask` opt it drives ship
    together. THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: blast radius is genuinely small (the
    harness is sandbox-only by `resolveWipeTestTarget`'s refusal and is never on a dispatch path), but
    the file list spans two stems and the band is set high up front rather than argued down.
  acceptance:
