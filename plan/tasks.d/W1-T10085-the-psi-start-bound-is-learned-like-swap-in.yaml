  design: |
    Operator rulings honoured: no hard threshold, never raise core memory.max, the 2,048 MiB host reserve unchanged.
    REUSE the swap-in mechanism: the same store, windows, history span, minimum sample count and noise. No new
    constant, interval or count.
    1. THE RECORD. The state/container-pressure.json store gains a `psi` series of [at, fullAvg10, admitted, oomKill]:
       one entry per verdict, `admitted` 1 when that verdict's start was admitted on any tier (fits, uncertain,
       nothing-to-wait-for, aged, W1-T10069's own-tail, or a shadow-mode class that always starts), `oomKill` the
       cumulative /proc/vmstat oom_kill read beside pswpin (null when unread). It is pruned and capped like `swap`.
       `awaitMemoryAdmission` marks the admitted bit under the admission lock it already holds.
    2. THE OUTCOME. A start admitted at time t is HARMED when, within SWAP_STALL_WINDOW_MS after t, the oom_kill count
       rose, or a later verdict read host PSI full avg60 past the PRIOR (policy.psiFullAvg10Max). The outcome is defined
       by the prior and never by the learned bound, so the bound cannot train itself loose; the swap-in `stalled` bit
       and the container arm keep the prior too.
    3. THE RELATION (beside `swapStallRelationOf`, same shape). Over closed windows within SWAP_STALL_HISTORY_MS, for a
       candidate level v above the prior: the share of ADMITTED starts with fullAvg10 in (prior, v] that were harmed,
       against the share of ALL verdicts in the same band followed by harm, noise 2*sqrt(p(1-p)/n). The band, not the
       whole history, is the baseline, so a start is judged against the pressure it was admitted into. The learned
       bound is the largest admitted fullAvg10 v with at least SWAP_STALL_MIN_SAMPLES admitted starts in (prior, v],
       whose lift does not exceed the noise and none of which was followed by an OOM kill. The bound only rises above
       the prior, as swap-in only stops counting; it never tightens below it.
    4. FAIL CLOSED. Store unread or unparseable, oom_kill unread on every sample in the band, or fewer than
       SWAP_STALL_MIN_SAMPLES admitted starts above the prior: the bound is the prior, and the basis says which
       ("the prior 2: 12 of 30 admitted starts above it with a closed window").
    5. APPLIED. `evaluateShadowMemory` names "psi" when fullAvg10 passes the LEARNED bound (someAvg10 against
       psiSomeAvg10Max unchanged). W1-T10069's own-tail hard stop reads the same reason, so it inherits the bound.
    6. LEDGERED. Every memory_budget.shadow and enforce_* row's numbers carry `psiFullAvg10Bound` {bound, prior, basis,
       samples, afterAdmitted, afterBand, noise, ooms}, so each decision is recorded with its inputs.
    TESTS in test/the-psi-start-bound-is-learned-like-swap-in.test.ts, `test(` titles verbatim as in the proofs, with
    the pure relation and `evaluateShadowMemory` over fixture histories: 30+ admitted starts at fullAvg10 2.1-6.0 with
    closed windows, none harmed, against a band harm share of 10%; a start at fullAvg10 4.0 whose claims fit.
