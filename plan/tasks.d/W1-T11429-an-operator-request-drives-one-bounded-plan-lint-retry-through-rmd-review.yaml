    - claim: "the request reaches the single existing claimReviewDecision call as its planLintRetry option"
      proof: "grep: planLintRetry: in src/cli/commands/review.ts"
    - claim: "a caller that could not capture the head or base ledgers its own refusal row and replays"
      proof: "grep: review\\.plan_lint_retry_not_requested in src/cli/commands/review.ts"
    - claim: "absence of the flag replays the old failure with no retry row; one flag at matching facts makes exactly one admitted attempt that publishes through postReviewStatusGuarded; a repeat is refused; mismatched head, unreadable base, failing or incomplete checks, missing checkout, unpinned publisher and shadow reviews all replay"
      proof: "unit test: test/an-explicit-plan-lint-retry-request-drives-one-bounded-review.test.ts"
    - claim: "the no-flag guard remains explicit in the integration suite"
      proof: "grep: W1-T11429 no flag preserves prior terminal in test/an-explicit-plan-lint-retry-request-drives-one-bounded-review.test.ts"
      kind: guard
  falsifier: |
    At origin/main, seed the lint-incomplete plan-only failure and run the review twice, with and without
    --plan-lint-retry <head>. Both replay, because no caller passes the option. At head, the run without the flag
    still replays and writes no review.plan_lint_retry row. One run with the flag writes exactly one admitted row
    and posts the fresh result. A second identical run writes a refused row and posts nothing. If the flag is
    forwarded by reviewOptionFlags, or a shadow consumes the attempt, the named test reddens. The same happens
    if the post is reached for a refused claim, or if the default call's arguments change.
