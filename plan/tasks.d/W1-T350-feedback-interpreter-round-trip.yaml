    assert in-process with an injected expander; the few-shot register needs no operator to judge.
    risk:high — this rewrites the operator's words on an operator-facing write path: the laundering
    failure (filing an unseen rewrite) is the audit-class hazard, which is why the read-back confirm
    is acceptance-level; and a model call joins an interactive flow.
    budget_usd 85 — three surfaces (expander seam, route, console control) held to one concern by the
    existing idioms; the cost is the falsifiers and the few-shot prompt.
    NO depends_on: the operator->machine direction is independent of the escalation-side arc and
    lands value alone.
    ONE CONCERN: the round trip — expand, show, confirm, store. Triage's consumption of richer
    entries needs no change to accept it; making triage EXPLOIT the structure (e.g. auto-running
    RECON directives) is a follow-up once entries carrying the skeleton exist."
