  note: |
    `risk: medium` IS THE HONEST BAND. One file, one bullet added and one folded; `subsystemsOf`
    reads a single concern, so Rule 19 does not force a raise and inflating it would be theatre.

    CRITERION 5 IS A FOLD PROOF AND IT INVERTS. `grep: Both defects are FIXED in CLAUDE.md` must
    match TODAY and MISS after the implementing diff, because the fold removes that bullet. That
    is deliberate: it is the only proof shape that makes the payment observable rather than
    promised, and an implementer who adds the rule without folding leaves it matching. Read it as
    "this text must be gone", and expect `check-proof` to report it as a match on the base and a
    miss on the head — the reverse of every other criterion here.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five name `CLAUDE.md`, which is the file the
    implementing diff actually changes, so each discriminates on the diff that will be judged
    rather than going `executed_stale` the way a self-path grep does (W1-T1070).

    EVERY FIGURE IS A QUERY. Re-derive the population with a `@babel/parser` walk over `src/`,
    classifying a catch by whether its handler references the caught binding AND reads something
    discriminating off it, and by whether its returns are all success-shaped literals. Re-derive
    the discriminator's blindness by testing the reasoning vocabulary against a hand-classified
    sample and checking specifically that `loadLearningsCorpus` lands on the reasoned side. The
    counts will move as `src/` moves; the SHAPE of the failure is what this task rests on.
