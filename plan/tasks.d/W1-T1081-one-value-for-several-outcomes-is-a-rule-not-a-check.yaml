- id: W1-T1081
  title: "SIX CATCH-OR-CLASSIFIER CONFLATIONS IN THIRTY HOURS LOOK LIKE A CLASS THAT WANTS A GATE, AND THE MEASUREMENT SAYS OTHERWISE — of 648 `catch` clauses in `src/` only 145 return a success-shaped literal without inspecting the error, a hand sample puts roughly a third of THOSE in the defect shape, and the only cheap static discriminator (does the author's prose reason about the collapse) reads CORRECT on two of three hand-judged defects INCLUDING `loadLearningsCorpus`, one of the six; write the rule, name the fold that pays for it, and add no check"
