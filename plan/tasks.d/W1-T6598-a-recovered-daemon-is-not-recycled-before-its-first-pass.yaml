- id: W1-T6598
  title: "A SUCCESSFUL STALL RECYCLE IS RECYCLED AGAIN BEFORE THE NEW DAEMON'S FIRST PASS — the progress verdict ages progress from the newest sweep.pass/review.posted/verdict.merged row across every generation, so a fresh boot inherits the dead generation's hours-old evidence and reads STALLED at once; and the launcher's 30-min recycle gap is stamped when an attempt STARTS, so a recycle that spent its 3000 s drain wait leaves no gap behind it"
