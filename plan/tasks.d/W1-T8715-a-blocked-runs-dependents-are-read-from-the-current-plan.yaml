  design: |
    No new bound and no timer. The fix only widens the safety set.
    1. DEPENDENTS ARE READ FROM BOTH PLANS. In `processDispatchResult`, the dependents behind the block disposition are
       the union of `transitiveDependents` over the admission snapshot and over the daemon's current plan binding
       (`plan`, which `reloadPlanBinding` refreshes at each tick and lane refill). This adds no git read of its own. A
       union can turn an independent failure into a genuine blocker and never the reverse, so the "never continue into
       the gap" rule cannot weaken. Every other judgement in the lane still reads its admission snapshot, as W1-T340
       requires. This one question asks about the DAG the next dispatch will act on.
    2. THE ROW NAMES THE PLAN IT ASKED. `dispatch.blocked_independent` and `daemon.blocked` carry `snapshot_plan_tasks`
       and `current_plan_tasks` (task counts). `daemon.blocked` also carries `late_dependents`, the dependents only the
       current plan named, so a reader can see when the admission snapshot was stale.
    Tests go in a new file, test/a-blocked-runs-dependents-are-read-from-the-current-plan.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive the daemon loop with fakes, as the existing block-path suites do. Admit a task
    under a plan with no dependent. Have `reloadPlan` return a plan that adds one before the run settles, and settle the
    run `failed`.
