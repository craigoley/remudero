  rationale: |
    WHAT "INDEPENDENT" MEANS, READ on origin/main 40b391682 (symbols, not lines). It means no dependents. It does not
    mean a failure unrelated to the task. `reasonAboutBlock` (src/lib/block-reason.ts, W1-T46) returns
    `independent_failure` exactly when `transitiveDependents(plan, taskId)` (src/lib/plan.ts) is empty. The daemon's
    comment at that branch gives the safety argument: "nothing in the plan transitively depends on this task, so skipping
    it cannot leave a dependent building on a gap". A non-empty set gives `genuine_blocker` instead. `processDispatchResult`
    (src/lib/daemon.ts) then writes `daemon.blocked` with the dependents, calls `escalateBlock`, and parks the task. The
    next tick re-arms the park on `no-open-pr`. An independent failure instead writes `dispatch.blocked_independent`. The
    W1-T7533 latch then holds the task behind a back-off, and nothing is escalated.
    THE PLAN IT ASKS IS THE ADMISSION SNAPSHOT. `processDispatchResult` is called with `snapshot.plan`, the
    `planForBatch` (or lane-refill snapshot) captured when the lane was admitted (W1-T340, W1-T4416). A run can last
    longer than several plan reloads. The dependents question is then answered against a plan that main has already
    replaced.
