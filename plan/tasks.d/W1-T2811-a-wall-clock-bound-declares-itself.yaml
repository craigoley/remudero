  note: |
    THE CENSUS IS CRITERION 1 AND IT CARRIES AN ABANDONMENT FLOOR. This task may close as
    "measured, too small, no action" on its own evidence, and that is a SUCCESS, not a failure to
    deliver. Measure before building; do not justify the build after doing it.

    MEASURED 2026-09-04 at 3a7c20a5, in a throwaway worktree. Membership predicate — an assertion
    putting a REAL-clock elapsed value under an UPPER bound, which is the only shape that fails
    when the machine is slow:

      git grep -nE 'assert[^\n]*(elapsed[A-Za-z]*|Date\.now\(\)[[:space:]]*-[^\n]*)[[:space:]]*<[[:space:]]*[0-9]' -- 'test/*.test.ts'

    **7 files, 9 assertion sites**, out of 1030 tracked test files (112 of which read a real clock
    at all). The bounds span two orders of magnitude:

      test/run-task.test.ts                        < 50ms    (tightest; hrtime, synchronous path)
      test/worker-containment.test.ts              < 100ms
      test/worker-credential-expiry-margin.test.ts < 200ms
      test/review-status-gate.test.ts              < 1000ms
      test/console-write-entry.test.ts             < 2000ms
      test/poll-rollup-over-rest.test.ts           < 5000ms
      test/worktree-reap-liveness.test.ts          < 1 minute (3 sites, mtime age)

    TWO MEMBERS WERE SPOT-CHECKED RATHER THAN TRUSTED TO THE GREP, because the predicate must not
    count an INJECTED clock: `run-task.test.ts` uses `process.hrtime.bigint()` and
    `worker-credential-expiry-margin.test.ts` uses `Date.now()` — both real. The same read
    excluded the deterministic look-alikes the grep surfaces on a wider pattern: `board.test.ts`,
    `status.test.ts`, `deployer.test.ts`, `headroom-park-ceiling.test.ts` and
    `open-prs-rest.test.ts` all assert on a FAKE clock's value and are correctly not members.
    LOWER-bound assertions (`>= 2_000` in an-operator-stop-is-undone-by-the-restart-policy,
    `>= 15` in sweep-wall-clock-bound, `>= 30` in retro-sweep-ticker) are also not members: load
    makes those MORE likely to pass, not less.

    THE FLOOR, STATED BEFORE THE WORK. Re-run the predicate at build time. If it reports **fewer
    than 3 distinct files, or fewer than 4 assertion sites**, CLOSE THIS TASK UNBUILT with the
    measurement recorded — a seam plus a census plus seven migrations is not worth carrying for
    two call sites, and the honest disposition is that the class is too small to express. Today's
    7/9 clears that floor with room; the floor exists because the population may shrink before
    anyone builds this, and because a task that cannot close on its own evidence will always find
    a reason to proceed.

    A SOFTER, WIDER POPULATION EXISTS AND IS DELIBERATELY OUT OF SCOPE: 36 test files perform a
    REAL `setTimeout`/`sleep`/`delay` wait without asserting any duration. Those are load-sensitive
    by construction but have no bound to declare, so the seam has nothing to attach to. Naming them
    here so a later reader does not mistake the 7 for the whole class.

    THE CENSUS PREDICATE ABOVE IS ITSELF AN ENUMERATIVE GREP WITH EXACTLY THE BLINDNESS W1-T2790
    RANKS LAST, AND THAT IS THE ARGUMENT, NOT AN EMBARRASSMENT. It keys on the literal spellings
    `elapsed…` and `Date.now() -`; a test timing with `process.hrtime` into a differently-named
    variable is invisible to it (today's members escape that only because they happen to name a
    variable `elapsedMs`). A grep is the right tool to SIZE the population once. It is the wrong
    tool to MAINTAIN it, which is precisely why the deliverable is a seam that the members declare
    through rather than the roster this grep would produce.

    AND THAT IS NOT A HYPOTHETICAL — TWO LANES GREPPED FOR THIS SAME CLASS AND AGREED ON ONE FILE.
    A second census was taken independently on the other lane, over two axes: real wall-clock
    BUDGET assertions in 5 files (`test/serve.first-paint.test.ts`, `test/serve.test.ts` at two
    sites, `test/status-board-reads-rotations.test.ts`, `test/w1-t187-end-to-end.test.ts`, and
    `test/worker-containment.test.ts` at `elapsed < 100`, the most load-fragile site either census
    found), plus spawned-process WAIT WINDOWS in 4 more files — union ~9. This shard's own census
    names 7. **The two lists intersect in exactly ONE file: `test/worker-containment.test.ts`.**

    Two mechanical greps, aimed at one class, on one tree, on one day, overlapping by one of
    seven. Neither is wrong; they key on different spellings of the same idea, and the union is
    larger than either. THIS IS THE STRONGEST ARGUMENT FOR THE SEAM THAT EXISTS: a roster derived
    by grep is a function of WHO GREPPED, so any roster this class ever gets would encode its
    author rather than its membership — and the disagreement is invisible until someone takes a
    second census, which nothing schedules. A declaration at the call site has no such degree of
    freedom: the member says so itself, in one place, and two readers cannot disagree about it.

    THE BUILD SHOULD THEREFORE TAKE THE UNION, NOT THIS SHARD'S SEVEN. Re-run both axes at build
    time — the upper-bound predicate above AND a spawned-process wait-window pass — and migrate
    every member found. `files:` below declares the seven this census names; a union member outside
    that list is a scope widening to be recorded in the PR body and the source comment, never by
    editing this shard, exactly as the design section already requires.

