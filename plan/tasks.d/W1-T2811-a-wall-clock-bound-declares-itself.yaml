  falsifier: |
    THE CENSUS CAN END THIS TASK, AND THAT IS THE POINT. Re-run the predicate in the note. Under 3
    distinct files or under 4 assertion sites, close unbuilt with the measurement recorded. Do not
    build a seam for a population that does not exist.

    THE SEAM MUST BE FALSIFIED IN THE POSITIVE DIRECTION. Revert one migrated member to a bare
    `assert.ok(elapsed < N, …)`: the census test must FAIL and NAME that file. A census that cannot
    be made to fail is measuring nothing — the same standard W1-T2791 and W1-T2776 were held to.

    THE MIGRATION MUST NOT WEAKEN ANYTHING. Verify that each of the seven still fails when its
    bound is genuinely exceeded: temporarily tighten one bound to an impossible value and confirm
    a red. A helper that swallowed a real breach would convert seven live assertions into
    decoration, which is a worse outcome than the inexpressible class this task set out to fix.

    CLOSE WITHOUT CODE if W1-T2810 has, by build time, shipped something that already makes each
    of these seven assertions declare its own wall-clock dependence at the assertion site. That
    would be legibility having grown into expression, and two mechanisms would then be covering one
    problem — the exact overlap the boundary above exists to prevent.
