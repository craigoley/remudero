  rationale: |
    THIS IS THE FIRST INSTANCE OF THE W1-T2790 ORDERING, AT SMALL SCALE, ON A BOUNDED POPULATION.
    That recommendation ranks (1) self-declaring at one seam above (2) derived-and-committed above
    (3) hand-written prediction. The obvious version of this task — "identify the wall-clock tests
    and exclude them" — is shape (3): a fourth hand-maintained list of test names, alongside
    HOST_CAUSED_SUITE_REDS, HOST_PARITY_BASELINE and CENSUS_POPULATION, and it would rot the same
    way for the same reason. This shard is deliberately the shape (1) version.

    ITS SECOND VALUE IS AS A TEST OF THE RECOMMENDATION ITSELF. W1-T2790 proposes an ordering that
    nothing in this repo has yet built against. Seven migrations is cheap enough to do before the
    derived-registry work and concrete enough to find out whether self-declaration is actually
    pleasant to write. IF SELF-DECLARATION TURNS OUT TO BE AWKWARD FOR EVEN TWO OF THE SEVEN, SAY
    SO IN THE PR — that is evidence about the ordering, arriving before anyone commits to building
    a generator on the strength of it, and it is worth more than a clean migration report.

    WHY THE CLASS IS INEXPRESSIBLE TODAY. `HOST_CAUSED_SUITE_REDS` keys on cheap host FACTS —
    platform, bash version, procfs, node-vs-pin — and load is not a host fact, so the predictive
    registry cannot key on it. `HOST_PARITY_BASELINE` observes a real run, but its `confirm` hook
    re-runs an undeclared failure's own file ALONE, and a load-caused failure does not reproduce
    on an idle re-run — so it is filtered out as unconfirmed. The net effect is that the
    observational mechanism degrades to SILENCE on this category rather than flapping. Silence is
    a better failure than instability, and it is also exactly why the class needs its own
    expression: a mechanism that reliably says nothing about a category is not covering it.

    THE SEAM. One helper — `test/helpers/wall-clock-bound.ts` — exporting the assertion the seven
    members call instead of a bare `assert.ok(elapsed < N)`. The DECLARATION IS THE CALL SITE:
    nothing is registered, nothing is listed, and a member that stops being one stops declaring by
    deleting its own call. The recognizer becomes ONE query — which test files import that helper —
    and is therefore EXACT rather than approximate, unlike `censusPopulationDrift`'s own
    self-described "approximate by construction" text match. Because the bound now passes through
    one function, a later task can annotate, relax or skip the whole class centrally without
    touching seven files again; this task does not build that, it only makes it possible.

    BOUNDARY WITH W1-T2810 — STATED SO THE TWO DO NOT HALF-COVER ONE PROBLEM. **W1-T2810 owns
    LEGIBILITY: it makes a load-caused red interpretable, so a reader can see that the run was
    loaded.** It is cheaper and more general — it applies to every red on a loaded run, declared or
    not. **This task owns EXPRESSION: it lets a test state that its own contract is wall-clock
    dependent.** It is surgical and applies only to the declared members. Neither subsumes the
    other: legibility is a property of the RUN's context, expression is a property of the TEST's
    contract, and a red is best diagnosed with both. Shipping both without saying which does what
    is how two mechanisms end up half-covering one problem, so the split is recorded here.
    W1-T2810 IS UNFILED AS THIS SHARD IS WRITTEN (no shard on origin/main, no open PR, id reserved
    only), so this boundary is stated from its commissioning intent and must be re-checked against
    its shard text once that exists.

    WHAT THIS DOES NOT DO. It does not skip, relax or quarantine any test — every one of the seven
    keeps asserting exactly the bound it asserts today, and a genuine regression still reds. It
    does not add a registry, a roster, or an `appliesTo` predicate. It does not touch
    HOST_CAUSED_SUITE_REDS or HOST_PARITY_BASELINE. It does not attempt the 36-file soft
    population above.
  design: |
    ORDER OF WORK, AND THE FIRST STEP CAN END THE TASK. Re-run the census predicate from the note.
    Record the count in the PR body. If it is under the floor, close unbuilt and ship nothing.

    The helper takes the measured elapsed value, the bound, and the message the call site already
    carries, and asserts the same comparison the member asserts today — so a passing suite stays
    passing and a real regression still fails. Its failure message must additionally NAME the
    wall-clock dependence, so a red at that assertion is self-explaining without a reader having to
    know this class exists. Keep the helper free of any skip, retry or tolerance behaviour: this
    task establishes the seam and nothing else, and a tolerance added here would silently weaken
    seven real assertions.

    The census test re-runs the recognizer over the tree and asserts ZERO undeclared members — a
    file matching the wall-clock predicate that does not import the helper fails by name, with a
    message naming the helper as the remedy. It must be falsified in the positive direction: revert
    ONE member to a bare `assert.ok(elapsed < N)` and the census test must FAIL naming that file.

    Migrate all seven members in this diff, or the seam has no declarers and the census test cannot
    be green. `test/run-task.test.ts` is one of them: EDIT its existing assertion in place, never
    append a new test to that file — it crash-loops at file level under `--experimental-test-coverage`
    (CLAUDE.md's own coverage trap), and a new test there would zero the lcov.

    IF THE RE-MEASURED POPULATION NAMES A FILE NOT IN `files:` ABOVE, that is a scope widening and
    must be recorded in the PR body and the source comment — never by editing this shard, which
    `rule15-filing` refuses for a `verify: auto` task.
