- id: W1-T3956
  title: "MAKE AUTOMATION TRIGGERS FIRST-CLASS — named scheduled, webhook, and manual starts with policy resolution, idempotency, bounded concurrency, pause, replay, and honest run history"
  repo: remudero
  depends_on: [W1-T3855, W1-T3879, W1-T3898]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 90.00
  risk: high
  band_meaning: blast-radius
  origin: "research:kilo-ai-cloud-agents-and-agent-manager-2026-09-21"
  plan_refs: ["§Self-improvement", "§7B", "W1-T2568", "W1-T2923", "W1-T3855", "W1-T3879", "W1-T3898"]
  files:
    - src/lib/automation-trigger.ts
    - src/lib/automation-action.ts
