  status: queued
  attempts: 0
  rationale: |
    Kilo's Cloud Agents make scheduled and webhook starts visible as named triggers with activation
    state, runtime environment profiles, manual invocation, run history, pause, and queue/in-flight
    limits. Its Agent Manager then gives those starts a reviewable session/worktree context. RMD
    already has individual cadence and event wake mechanisms (W1-T2568 and W1-T2923), and W1-T3855
    owns the action boundary, but there is no single durable contract answering: what may start this
    flow, which repository/instance and policy profile apply, what happened to the run, and how do
    we safely replay or stop it?

    This task adds the registry and lifecycle contract, not a second scheduler. Existing timer and
    webhook paths remain level-triggered reconciliation inputs; they submit a named trigger request
    into this contract, and a missed event is recovered by the normal cadence. The contract must be
    useful for automation and self-improvement without becoming a generic remote shell or silently
    granting a browser, webhook sender, or model authority.

    Primary inspiration and constraints are the official Kilo Cloud Agents and Agent Manager docs:
    https://kilo.ai/docs/code-with-ai/platforms/cloud-agent and
    https://kilo.ai/docs/automate/agent-manager. These are product research inputs, not a claim that
    RMD should copy Kilo's hosted execution model.
  design: |
    Add a versioned `automation-trigger-v1` envelope for a named flow. It records trigger id and
    immutable activation mode, source (`schedule`, authenticated webhook, or manual), repository and
    instance scope, timezone/DST policy when scheduled, resolved environment/policy profile id,
    idempotency key, event/delivery identity, requested-at time, expiry, concurrency key, and the
    bounded run reference. A trigger may start only a registered flow whose action contract and
    capability grants already exist; it cannot carry a command, credential, raw prompt, or arbitrary
    model instruction.

    The registry exposes explicit `active`, `paused`, `refused`, `queued`, `in-progress`, `success`,
    `failed`, `expired`, `cancelled`, `stale`, and `unknown` states. It enforces per-trigger queue and
    in-flight limits, deduplicates a delivery/idempotency key, resolves profiles at execution time,
    and preserves the source, observed time, freshness, refusal reason, and linked action receipt.
    Manual run and replay create a new bounded run linked to the original; they never rewrite history.
    Pause prevents new admission but makes already-running work visible. An unavailable scheduler,
    profile, ledger, or external source remains unavailable rather than becoming an empty success.

    Compose W1-T2568's authenticated event wake and W1-T2923's cadence policy rather than creating
    parallel policy knobs. The first implementation may expose a registry and adapter seam before
    enabling every trigger source in production. High-risk actions remain approval-gated and the
    registry must not bypass W1-T3855, W1-T3899, W1-T3900, or the human handoff path.
  acceptance:
    - claim: "a named trigger records immutable activation mode, source, scope, profile, timezone policy, expiry, idempotency, and a linked bounded run"
      proof: "grep: W1-T3956 criterion 1 in test/automation-trigger-registry.test.ts"
    - claim: "schedule, authenticated webhook, and manual starts enter one versioned trigger contract and never carry commands, credentials, raw prompts, or arbitrary model instructions"
      proof: "grep: W1-T3956 criterion 2 in test/automation-trigger-registry.test.ts"
    - claim: "duplicate delivery or idempotency keys do not start a second run, and queue/in-flight limits refuse excess work explicitly"
      proof: "grep: W1-T3956 criterion 3 in test/automation-trigger-history.test.ts"
    - claim: "active, paused, queued, in-progress, success, failed, expired, cancelled, stale, refused, and unknown states remain distinguishable with source, freshness, and reason"
      proof: "grep: W1-T3956 criterion 4 in test/automation-trigger-history.test.ts"
    - claim: "manual replay creates a linked new run without rewriting the original receipt, and a paused trigger admits no new run"
      proof: "unit test: test/automation-trigger-replay.test.ts"
    - claim: "the public daemon contract names automation-trigger-v1 and its bounded run-history states"
      proof: "grep: automation-trigger-v1 in openapi/daemon.yaml"
    - claim: "the serving path calls the trigger registry rather than leaving the new module test-only"
      proof: "grep: submitAutomationTrigger( in src/lib/serve.ts"
  falsifier: |
    Let a webhook invoke an unregistered flow, turn an unavailable profile into success, admit a
    duplicate delivery, exceed the in-flight bound, mutate a completed run during replay, or allow a
    trigger payload to carry authority or credentials. The corresponding proof must fail.
  note: "This is the missing registry/lifecycle layer above W1-T2568 and W1-T2923, not a second scheduler or action engine. reservation hand-off: run-W1-T3956-17899977143N -> run-W1-T3956-1789997714300"
