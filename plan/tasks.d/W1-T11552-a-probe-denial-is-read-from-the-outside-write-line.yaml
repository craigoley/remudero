  rationale: |
    OBSERVED 2026-11-06:
    - OS_DENIAL_RE in src/lib/containment.ts matches a bare "sandbox" and a bare "denied".
    - 5 of 603 Codex-served Azure probes after onset passed while the sandbox could not deny the write (W1-T11550).
    INFERRED: the egress arm's error text, which says "current sandbox mode", is not stripped, so a model echoing the token could pass without a real denial. Pass rows carry no excerpt, so those 5 passes are unconfirmed.
