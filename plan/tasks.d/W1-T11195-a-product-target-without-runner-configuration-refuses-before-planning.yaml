  design: |
    (1) Name absence truthfully. In src/lib/mounts.ts, add a MountsMissingError subclass of
    MountsError that loadMounts throws only when the read fails with a confirmed ENOENT. Its
    message names the missing path as absent runner configuration. Every other read or parse
    failure keeps today's MountsError text and type. Every existing `catch (MountsError)` and
    fallback (resolveWorkerCapabilities, machine-filing-judge) behaves exactly as before. The
    native `rmd plan` verb therefore still refuses before plan.start, but with a named cause.
    (2) One bounded reader. Add src/lib/product-target-config.ts and export
    readTargetRunnerConfig(checkout, head). It reads `.remudero/mounts.yaml` from the committed
    tree at the exact frozen head (git ls-tree / cat-file through the existing
    hostWorktreeGitAsync helper), never from the working tree. It returns:
    - present, with a sha256 digest, when the blob validates through validateMounts. That
      includes the G-17 Tier Invariant.
    - absent, only when a successful tree read at a valid commit lacks the path.
    - invalid, when the path is a symlink, a non-blob or a blob that fails validation.
    - unreadable, on any git or transport failure. A failure never becomes absent.
    Mirror W1-T10621's confirmed-absence discipline.
    (3) Preflight before freezing. In ProductPlanOperationService.propose, call it after the
    checkout resolves and verifies, and before the journal commit, stage-evidence append or
    handOff. absent refuses runner_config_missing. invalid refuses runner_config_invalid.
    unreadable refuses target_unreadable. A refusal writes no journal record, product record,
    ID block or ledger handoff. Retrying the same saved command after the configuration lands
    starts exactly one plan. Replay of an already-journaled operation is unchanged and never
    re-reads or retargets.
    (4) Recoverable served state. Map both new codes to 409 in src/lib/product-routes.ts. Declare
    them in the plan-proposal failure schema in openapi/daemon.yaml, and regenerate
    packages/api-client/src/schema.d.ts with the maintained generator. The Console can then show
    "runner configuration missing/invalid at <head>" as a distinct state the operator can act
    on, never a generic unavailable.
    Tests use real local Git fixtures with fixture-local author identity, a real mounts table
    copied from this repo's validated fixture, and no model or network spend. Cover: a target
    without the file, a malformed table, a G-17 violation, a symlinked path, a failed git read,
    a dirty working-tree file absent from the committed head, and a present valid table that
    reaches the existing handoff once. Exercise the served route through the existing product
    route suite. Confirm test placement with rmd test-place on final imports.
    Out of scope: creating or proposing configuration (W1-T11196, W1-T11197), any install-root
    fallback, any change to the rmd plan verb's gates, hold releases, budgets, access and
    Console UI source.
