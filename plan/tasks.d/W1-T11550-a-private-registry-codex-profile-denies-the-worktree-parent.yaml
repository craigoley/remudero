  acceptance:
    - claim: For reader, writer and review intents, when no other grant lies beside the worktree, both surfaces of the private-registry Codex profile deny the worktree's parent, never grant it read, and keep the root deny
      proof: "grep: W1-T11550 criterion 1 in test/deploy/a-private-registry-codex-profile-can-start-its-own-sandbox.test.ts"
    - claim: When a granted path lies under the worktree's parent but outside the worktree, the parent is not denied, because a parent deny hides a nested grant, and that grant keeps its read
      proof: "grep: W1-T11550 criterion 2 in test/deploy/a-private-registry-codex-profile-can-start-its-own-sandbox.test.ts"
    - claim: The suite carries a real-binary regression, skipped where codex is not on PATH, that asserts a write beside the worktree fails with a read-only file system error and a write inside it succeeds. Review judges that this test states those assertions; the reviewer is not asked to run a nested sandbox, and the recorded real-binary run is in the PR's Checks
      proof: "grep: W1-T11550 criterion 3 in test/deploy/a-private-registry-codex-profile-can-start-its-own-sandbox.test.ts"
  rationale: |
    OBSERVED 2026-11-06:
    - Every fleet build has ended verdict blocked_containment since about 2026-11-05T17:00Z: 237 rows on 11-06 against 1 to 3 a day before, with reason "containment UNPROVEN: no OS-denial was observed for the outside-cwd write", observed write-never-attempted. The last handed_off verdicts were in hour 16 on 11-05.
    - Onset: core's first selected-registry container (RECYCLE-2822248, 11-05 16:57:39Z). A selected registry makes runtimeInstanceRegistryPrivateFile() defined, which puts Codex workers on withPrivateRegistryCodexProfile with :root denied.
    - Ledger, Azure probes served by Codex: 7 of 7 contained before onset; 597 of 603 not contained after. Mac probes with no selected registry: 13 of 13 contained.
    - Phase 1, 17:16 to 20:40Z, was the bwrap execvp failure #16909 fixed. Phase 2, from 20:43Z: 501 rows report rc=0 for the outside write with no host file, and 65 report the model declining the write.
    - Reproduced with codex-cli 0.166.0 (the deployed pin) on a worktree layout with the git dir elsewhere. Deployed shape: `touch ../tok` exits 0, no host file, no error text. With the parent denied: "Read-only file system", rc 1, no host file, git dir and node_modules readable, sibling unreadable, inside write succeeds.
    - The probe reads an OS denial from the transcript. A write that silently lands on a tmpfs leaves nothing to read, so the check fails closed. The check is right and is not changed here. The boundary held in the reproduction.
    - A parent deny hides grants nested under it: with the git dir under the denied parent, it became unreadable in the same reproduction. Hence the guard.
    INFERRED: the reproduction ran on the host, without /etc/codex/requirements.toml. The container's behaviour is inferred from the matching ledger symptom, so the proof that counts is containment.probe rows after this ships.
  design: |
    In withPrivateRegistryCodexProfile (src/lib/worker-provider.ts), after the filesystem map is built, set dirname(cwd) to deny unless cwd is its own parent or some grant root lies under that parent and outside cwd. The map feeds both the profile file and the inline overrides, so both surfaces carry it.
    NOT IN SCOPE:
    - src/lib/containment.ts and the gate's strictness;
    - the grandparent, where a write can still exit 0 and vanish;
    - the roughly 11 percent of probes where the model declines the write.
  note: |
    Criterion 3 was reworded on 2026-11-07: a sandboxed Codex reviewer cannot start bubblewrap inside its own sandbox, so #17117's review reported UNABLE and escalated #17120 although nothing in the change was in doubt.
    Read containment.probe rows after this reaches the daemon; a healthy result is contained true on Codex-served probes.
