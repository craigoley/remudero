    The defect is still real: had the PAUSE cleared at 09:13Z, the claim would have refused W1-T9409 for 2 h, and
    W1-T7740/W1-T8877 are refused today with no end.
    WHY NOT EVIDENCE ON ORIGIN ALONE. W1-T8777 shows a live holder can go 9 h with nothing on origin. A rule that
    reclaims on origin silence alone would have duplicated that build. So the holder must say it is alive, and
    silence is judged only against what the holder said.
