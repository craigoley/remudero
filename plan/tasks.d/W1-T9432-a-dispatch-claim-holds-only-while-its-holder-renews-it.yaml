  rationale: |
    READ on origin/main 478c3ddde. Symbols, not lines.
    THE MECHANISM. A claim is an orphan empty-tree commit pushed create-if-absent to refs/rmd-dispatch/<id>, message
    `rmd-dispatch claim <pid>@<host> <iso>` (`gitDispatchClaimReserver.mintAnchor`, src/lib/dispatch-claim.ts).
    `claimCommand` (src/run-task.ts, verb `rmd claim`, W1-T5859) mints it with the CLI's own pid and exits, so every
    host claim names a pid that is gone within a second. Nothing renews a claim: no lease, heartbeat or renewal
    exists anywhere in the tree. A lane meeting a foreign claim (runTask's `claimOutcome === "taken"` arm) runs
    `decideDispatchClaimRelease`: arm 1 holder, arm 2 landed-work evidence, arm 3 dead-claimant (W1-T2784: same
    host and minted before this pid namespace booted; W1-T5047: this instance's own daemon minted it in a replaced
    container), else arm 4 operator. A Mac or Azure-host claim never matches arm 3, so an unmerged task's host
    claim holds until a human drops it. `staleDispatchClaimEscalations` (status-board) only escalates past the fixed
    24 h `DISPATCH_CLAIM_STALE_THRESHOLD_MS`, and drain's eligibility never reads claims: the task is selected, the
    lane spends a run.start, and is refused `blocked_inflight` every time it reaches the head of the queue.
    MEASURED 2026-10-14 ~12:05Z, `git ls-remote origin 'refs/rmd-dispatch/*'` from the Mac, each anchor fetched:
