  design: |
    No fixed TTL. A claim is alive while its holder renews it; silence is measured in this fleet's own build times.
    1. RENEWAL ON THE REF. Add `renewDispatchClaim` to src/lib/dispatch-claim.ts (sync and async reservers). It
       mints a commit whose PARENT is the current anchor, keeps the anchor's first line verbatim (so
       `parseClaimAnchorMessage` still decodes the original pid@host and mint time), and adds a line
       `renewed <pid>@<host> <iso>`. It pushes with `--force-with-lease=<ref>:<expected sha>`, so a renewal never
       recreates a claim that was reclaimed or dropped, and never overwrites another holder's claim. It returns
       renewed | lost | unreachable. The claim's LAST SIGN OF LIFE is the newest of: the tip's renewal time (the
       mint time when never renewed), and the newest commit time on any origin `run-<id>-*` branch.
    2. EVERY HOLDER RENEWS WHILE IT LIVES.
       - `rmd claim <id> --hold` takes the claim (or adopts this host's existing one), then stays in the foreground,
         renews on a pacing interval, prints one line per renewal, and drops its own claim (pinned with
         --force-with-lease) on normal exit, SIGINT, SIGTERM and SIGHUP. A session runs it in the background, so
         the claim dies with the session. A `lost` renewal exits 1 naming the new holder.
       - `rmd claim <id> --renew` renews once, only a claim whose anchor host is this host.
       - runTask renews its own claim on the same pacing while the run lives, and stops in the existing `finally`
         that releases it.
       The pacing interval is a write cadence, not a decision bound: the judge below never reads it.
    3. THE JUDGE, IN runTask's `taken` ARM, beside W1-T2784's probe. Add a pure `decideClaimSilence` in
       dispatch-claim.ts. Inputs: the decoded anchor, the last sign of life (1), whether this instance's ledger holds
       the claim's own `dispatch.claim created` mint row (`findClaimMintRow`; such a claim is a fleet lane of this
       instance and is left to arms 3/W1-T8176), and the window W.
       - W is the 90th percentile of this instance's measured claim-to-verdict durations (dispatch.claim `created`
         to the same run_id's verdict) over the ledger union for `DISPATCH_VALUE_WINDOW_MS`, as W1-T9323 measures
         its median wait. No samples: refuse to judge (`no-duration-evidence`) and fall to arm 4.
       - Silence of W or more: the TIER-1 answer. Write `dispatch.claim_unrenewed` once per judged anchor sha
         (holder pid@host, minted, last sign of life and its source, W and its sample count). Keep the claim.
       - Silence of 2W or more: the TIER-2 answer. Reclaim: drop with --force-with-lease pinned to the sha judged,
         write `dispatch.claim_reclaimed` with the same fields plus `dropped`, say it on the console as arm 3 does,
         then retry the claim CAS once in this run so the lane that judged builds the task. A lost lease writes
         `dropped: false` and refuses as today.
       - Unreadable anchor, unreadable branches or an unreachable origin: no verdict, arm 4 as today.
    4. Unchanged: arms 1-3, the boot sweep, W1-T8616's tick sweep, and the status board's 24 h escalation, whose
       population shrinks once these claims are reclaimed.
    5. docs/cli-reference.md and docs/operator-guide.md describe --hold and --renew, and drop "No release verb is
       needed": a hand-build that does not hold or renew its claim is reclaimed after 2W of silence.
    Tests go in the new file, `test(` titles verbatim as in the proofs below. Drive the reserver with an injected
    git `run` over a bare fixture remote (gitRepo()), the judge with injected rows and clocks, and --hold as a real
    child process that is signalled.
