        was 9 h old with nothing on origin, yet its holder was working.
      - ABANDONED: W1-T7740 (2754295@Remudero, minted 2026-10-13T10:38Z, 25.5 h) and W1-T8877
        (2886778@Remudero, 2026-10-13T15:26Z, 20.7 h). No run-<id>-* branch, no PR, no host worktree or branch,
