  falsifier: |
    Against main, push a host claim minted 25 h ago with no branch and feed the taken arm 152 measured runs: the
    lane refuses `blocked_inflight` forever and no row names the holder, so the reclaim test fails. If the judge
    reads origin silence without the renewal, a claim renewed a minute ago but with no branch is reclaimed and the
    renewed-claim test fails. If a renewal pushes without the lease, it recreates a reclaimed claim and that test
    fails. Kill --hold with SIGTERM and the claim stays on main, so the hold test fails.
