    MEASURED, fleet build durations: across the 12 newest ledger archives on the host (152 runs whose own
    dispatch.claim was `created` and which reached a verdict, 2026-09-25..10-14), claim-to-verdict median 23 min,
    p75 43, p90 73, max 211.
    THE 10-14 TIMELINE, CORRECTED. Core dispatch was held by the recycle PAUSE (W1-T9409's own subject) from
    08:21Z to the 10:57Z boot; the ledger has `daemon.pause` rows each minute and ZERO dispatch.claim attempts on
