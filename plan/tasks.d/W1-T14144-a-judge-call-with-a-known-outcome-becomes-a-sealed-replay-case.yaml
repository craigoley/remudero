- id: W1-T14144
  title: A judge call whose outcome later shows the right answer becomes a sealed replay case, and the shadow pool is scored on those cases
  repo: remudero
  depends_on: [W1-T14142]
  priority: 1.1
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high # a new private capture of judged inputs and a new accuracy bar on the shadow pool
  band_meaning: span
  origin: operator-session#decision-quality-2026-11-21
  plan_refs: [W1-T12421, W1-T12422, W1-T14142, W1-T12425]
  files:
    - src/lib/judge-outcome-harvest.ts
    - src/lib/judge-shadow.ts
    - src/lib/judge-replay-batch.ts
    - src/lib/measurement-cadence.ts
    - src/lib/ledger-steps.ts
    - test/routing/a-judge-call-with-a-known-outcome-becomes-a-sealed-replay-case.test.ts
  status: queued
  attempts: 0
  rationale: |
    READ at origin/main dd829e355 (2026-11-21).
    - The judge replay corpora are 10 machine-filing probes and the risk-judge disposition fixtures (src/lib/judge-replay-batch.ts:118-205).
      Their expected answer is "what the current judge path is pinned to give" (:252-257), so a replay measures agreement with the
      incumbent, not correctness.
    - JUDGE_SHADOW_POOL_BAR (src/lib/judge-shadow.ts:505) admits a pool member on its rejected share and median cost only
      (judgeReplayPoolRefusal, :548-559). No accuracy is checked.
    - Ledger rows hold no judged prompt (shadow_judge.paired; risk_judge.decision), so a case can only be built if its input is
      captured when the judge runs.
    - A live outcome takes up to the 14-day revert window (src/lib/verdict-calibration.ts:415-422). A replay case costs about $0.003.
      So a labelled replay set judges a new candidate in minutes, not weeks.
    - W1-T14142 defines, per role, which recorded outcome makes an answer right.
  design: |
    1. When shadowJudgeCall runs for a role that has an outcome map, store the judged input in a bounded state-dir capture file:
       decision key, role, head sha, question, options, and the prompt scrubbed with the corpus scrub filter and capped at 16 KiB.
       It never goes to the ledger or git, and captures older than 30 days are dropped.
    2. A harvest pass in the measurement cadence joins captures to verdict_calibration.outcome by head through the W1-T14142 map.
       It appends sealed cases to the state file judge-outcome-corpus.ndjson. Each case carries:
       - case id, role, question, options and input;
       - expected, the outcome-derived answer;
       - provenance: head, merge sha, outcome kind, window and source timestamp.
       A case is written once and never derived again. A case whose outcome is ambiguous is not written.
    3. JUDGE_REPLAY_CORPORA gains an `outcome-harvest` member that reads that file. A replay on it reports accuracy against expected.
    4. For a role with at least 30 harvested cases, the pool bar refuses a member whose accuracy on them is below the incumbent's.
       A role with fewer keeps today's bar.
    5. Register the harvest step in src/lib/ledger-steps.ts.

    INVARIANT expected-comes-from-outcomes: a harvested case's expected answer is derived from its recorded outcome, never from a judge's answer.
  acceptance:
    - claim: "A shadow judge call for a mapped role captures its scrubbed input, capped at 16 KiB, in a state-dir file that drops captures older than 30 days"
      proof: "grep: W1-T14144 criterion 1: in test/routing/a-judge-call-with-a-known-outcome-becomes-a-sealed-replay-case.test.ts"
    - claim: "A capture whose head gets an outcome becomes one sealed case with its provenance, written once and never derived again"
      proof: "grep: W1-T14144 criterion 2: in test/routing/a-judge-call-with-a-known-outcome-becomes-a-sealed-replay-case.test.ts"
    - claim: "invariant:expected-comes-from-outcomes — a harvested case's expected answer follows its outcome even when the incumbent answered otherwise"
      kind: guard
      proof: "grep: W1-T14144 criterion 3: in test/routing/a-judge-call-with-a-known-outcome-becomes-a-sealed-replay-case.test.ts"
    - claim: "With at least 30 harvested cases, the pool refuses a member less accurate on them than the incumbent"
      proof: "grep: W1-T14144 criterion 4: in test/routing/a-judge-call-with-a-known-outcome-becomes-a-sealed-replay-case.test.ts"
    - claim: "The measurement cadence runs the harvest"
      proof: "grep: harvestJudgeOutcomeCases( in src/lib/measurement-cadence.ts"
    - claim: "The replay corpora include the harvested cases"
      proof: "grep: outcome-harvest in src/lib/judge-replay-batch.ts"
  falsifier: |
    Take expected from the incumbent's recorded answer and criterion 3 must fail. Re-derive the corpus on a second pass and
    criterion 2 must fail. Admit a less accurate member and criterion 4 must fail. Restore and require all to pass.
