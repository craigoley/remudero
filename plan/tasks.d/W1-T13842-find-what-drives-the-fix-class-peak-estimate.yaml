    Recompute the learner's p50 and p90 from those samples (learnEstimate with ESTIMATE_LEARNING) and check that they
    match the row's 7154 and 2048. Name the five largest samples and what those fix runs did (for example a full
    suite run inside the fix tree). Say whether the tail is a few outliers, too few samples, or a real peak, and
    what it means for host headroom. Write the report to docs/forensics/fix-peak-estimate-drivers.md with
    "## Fix peak samples", "## Verdict" and "## Recommended remedy" headings, each claim labeled OBSERVED or INFERRED.
    NO-INVARIANTS: a read-only investigation that writes one report and changes no behavior.
