- id: W1-T5051
  title: "THE AGENT PAGES FOLD PANEL FACTS PER REQUEST AND THE CONSOLE RUNS A SECOND PROPOSAL ENGINE — add the agent view family (?part= proposals, history, settings, experiments, delegations, capabilities, follow-ups, promotions, actions, consequences, intent-plans) over panel.* facts with a persisted incremental fold per instance, so core is the only engine"
  repo: remudero
