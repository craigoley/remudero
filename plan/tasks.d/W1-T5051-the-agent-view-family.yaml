  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-10-01: after #8127 the operator-agent GETs answer in 4 to 59 ms, but each is still a
    per-request fold with a live-file parse, and the agent pages read about 4N routes across N instances.
    The console keeps its own proposal engine (src/lib/agent.ts) beside core's nav-badge fold (#8033), so
    the proposal list exists twice. The ranking puts this below inbox, feedback and workstreams: the gain is
    one engine and one read per page, not latency.
  design: |
    agent?part=<part>&instance= from panel.operator_agent_{proposal,decision,outcome,settings,...} facts
    (isFactStep keeps every panel. step) plus the analytics source_snapshot per instance for proposals and
    settings. The fold state is persisted per instance (agent_fold(instance, last_seq, state_json)) and only
    fact rows with seq > last_seq are folded, in chunks bounded by the pass budget, so a large delta spreads
    across passes. The nav-badge fold reuses it. Register it in read-model-worker.ts. /context stays a direct
    keyed GET.
    Commit agent_fold state and its consumed fact position atomically through the existing fenced
    SQLite adapter. A last observed sequence is not a consumed watermark; gaps, duplicates, interrupted
    commits and lost writer leases must not discard earlier facts. Reuse the fold in the nav badge so
    its count cannot claim newer decisions than the agent page. Persisted analytics/settings input
    comes from W1-T5055; unknown source windows remain explicit and never become confident proposals.
    Preserve repository/instance identity and current-account authorization at each serving boundary.
  acceptance:
    - claim: "each agent view part equals its operator agent route over the same ledger"
      proof: 'grep: test("W1-T5051: each agent view part equals its operator agent route over the same ledger" in test/agent-view.test.ts'
    - claim: "a large panel fact delta is folded across passes within budget"
      proof: 'grep: test("W1-T5051: a large panel fact delta is folded across passes within budget" in test/agent-view.test.ts'
    - claim: "the worker registers the agent view"
      proof: 'grep: createAgentView( in src/lib/read-model-worker.ts'
  falsifier: |
    Re-fold from seq 0 every pass: a 50k-row delta exceeds the pass budget in one unit and the second proof
    fails. Drop a part: its parity check fails against the route.
