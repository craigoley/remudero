  rationale: |
    WITHDRAWN AS ALREADY SATISFIED BY PR #5899, opened in the same session that found it. Filed as a
    record rather than as work, so the reserved id has a readable holder and the finding survives.

    THE DEFECT. `spawnWorker`'s blocked-auction fallback judges eligibility on
    `args.cashTools ?? args.tools`, and ONLY the implement lane ever passed `cashTools` (two call
    sites, both in the implement dispatch). Every other lane therefore handed the auction its CLAUDE
    surface, which names `Bash` -- the one tool `cashCanServeToolSurface` refuses by construction --
    so `cashFallbackRefusal` answered "not implementable by cash" for recon and diagnose.

    `DISPATCH_LANE_TOOL_BOUNDS` has declared open-weight equivalents for recon, diagnose and retro
    since W1-T3656. The table was correct the whole time; nothing read it on the divert path. This
    is the W1-T3656 shape exactly: a declared capability that no caller consults.

    MEASURED ON THE LIVE FLEET 2026-09-17, from state/provider-routing-status.json:

        claude   readable=true    weekly 86%   session(5h) 19%
        codex    readable=FALSE

    The auction ceiling is `100 - reservePercent` = 95%, so Claude was nine points from blocking
    with the weekly window not resetting until 2026-09-22. At the ceiling only implement would have
    carried on -- WITHOUT RECON, which is what feeds it.

    SCOPE SHIPPED: recon and diagnose only. Both are read-only by prompt ("Read-only, so no
    Write/Edit"; "Do NOT modify, commit, or push ANYTHING"), so the shell-less swap is honest --
    `RunCheck` carries the pinned read-only `git log/status/diff/remote` of `OPENWEIGHT_CHECKS` that
    their prompts actually name. retro and alert_fix are EXCLUDED because both commit; that is
    W1-T3727.

