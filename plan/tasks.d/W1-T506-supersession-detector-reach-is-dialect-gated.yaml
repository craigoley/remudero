  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, so `sizingViolation`
    (`src/lib/task-linter.ts`) returns early before `subsystemsOf` is consulted. THE BAND IS THE SPAN,
    NOT THE BLAST RADIUS: `supersededBy` is sparse and additive, nothing gates on it, and design (v)
    forbids giving it a consumer.
    `files:` WAS DERIVED BY INVOCATION COUNT ON THE THREE SYMBOLS THAT CHANGE, measured at 24d27da1.
    `proofGrepTargets(`, `findSupersessionEvidence(` and `buildGitLogSupersessionSearch(` appear in
    TWO files between them: `src/lib/status.ts` (2 / 2 / 1) and `test/status.test.ts` (1 / 5 / 4).
    Nothing else in `src/` or `test/` invokes any of the three, so that is the whole declared set.
    `src/run-task.ts` IS DELIBERATELY NOT DECLARED — nothing here touches it, and at ~19,900 lines
    `partitionByFileOverlap` (W1-T471) serialises every task that names it.
    NO NEW TEST FILE IS DECLARED. The existing detector tests live in `test/status.test.ts` and pin
    the predicate this task changes, so that file is touched either way; adding a second declared
    suite risks `inverseScopeUntouchedFiles` (`src/lib/review.ts`) if the implementer keeps the new
    assertions beside the old ones, which is where they belong.
    RULE 25 IS NOT ENGAGED: `src/lib/status.ts` matches no `INSTRUMENT_SURFACE` pattern and `test/`
    is excluded from `isProductPath`, so this changeset reads `entangled: false`.
    EVERY CRITERION IS A NAME-FILTERED `unit test:` TITLE, NOT A PURE PATH — a pure path would run
    `test/status.test.ts` whole and couple every criterion to unrelated failures in a large shared
    suite. Each of the four titles was checked to match zero files under `test/` today against a
    positive control matching one, and each is under 100 characters with no comma, so
    `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them.
    EVERY NUMBER HERE IS DATED 2026-08-15 AND IS A QUERY, NOT A CONSTANT. The 530/75/101/119/44
    counts, the 478-id union, the 9 unmerged-reachable tasks, the zero yield, the eight unguarded
    hits and both timings move whenever a shard is filed, a proof is rewritten or a PR merges — three
    of them moved during the session that took them. RE-DERIVE BEFORE BUILDING, and re-run the
    timings on a quiet host rather than trusting these."
