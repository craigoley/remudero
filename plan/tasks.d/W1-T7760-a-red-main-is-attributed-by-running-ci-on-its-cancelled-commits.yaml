    - claim: "a red main with cancelled commits since the last green dispatches CI for those commits, newest first, each on its own ref"
      proof: 'grep: test("W1-T7760: a red main dispatches CI for the cancelled commits since the last green, newest first, each on its own ref" in test/a-red-main-is-attributed-by-running-ci-on-its-cancelled-commits.test.ts'
    - claim: "no probe runs in main's concurrency group: a probe never re-runs the cancelled push run and never dispatches at ref main"
      proof: 'grep: test("W1-T7760: a probe never re-runs a cancelled push run and never dispatches at main" in test/a-red-main-is-attributed-by-running-ci-on-its-cancelled-commits.test.ts'
    - claim: "main.repair.located names the bisected first red, a completed red whose first parent has a completed green, with the probe runs as evidence"
      proof: 'grep: test("W1-T7760: main\.repair\.located names the bisected first red, proven by completed runs" in test/a-red-main-is-attributed-by-running-ci-on-its-cancelled-commits.test.ts'
    - claim: "probes in flight follow observed runner availability and run cost, not a constant"
      proof: 'grep: test("W1-T7760: probes in flight follow observed runner availability and run cost, not a constant" in test/a-red-main-is-attributed-by-running-ci-on-its-cancelled-commits.test.ts'
    - claim: "the located writer refuses a sha with no completed red run and writes main.repair.unlocated instead"
      proof: 'grep: test("W1-T7760: the located writer refuses a sha with no completed red run" in test/a-red-main-is-attributed-by-running-ci-on-its-cancelled-commits.test.ts'
  falsifier: |
    Leave CANCELLED in the first-red walk's failure set: the first test returns C1, a commit with no completed run.
    Re-run the cancelled push run, or dispatch at `ref=main`: the third test sees a request into main's concurrency
    group. Write the located row from the run history alone: the fourth test names a cancelled commit or the later
    red R instead of the bisected first red. Fix the probe count as a constant: the fifth test sees the same count
    under an idle and a saturated runner reading. Drop the writer's check: the sixth test appends a located row for
    a cancelled commit.
