- id: W1-T12838
  title: "A released machine task still in the queue is retired when its symptom has stopped, and a retired remedy's cause can be filed again when it costs anew"
  repo: remudero
  depends_on:
    - W1-T12833
  priority: 0.6
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # retiring a queued task removes work from the plan; a wrong zero would retire a live remedy
  band_meaning: blast-radius
  origin: "operator-session#self-improvement-audit-2026-11-15"
  plan_refs:
    - W1-T12835
    - W1-T12551
  files:
    - src/lib/machine-filing-judge.ts
    - src/lib/mechanical-rulings.ts
    - src/run-task.ts
    - src/lib/ci-friction-gardener.ts
    - src/lib/flow-remedy-gardener.ts
    - test/dispatch/a-queued-machine-task-is-retired-when-its-symptom-has-stopped.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "The mechanical rulings pass applies rule 2 (cause stopped) to a queued, released (verify auto) machine task whose family has a symptom reader: with 0 occurrences across the rule's window it is retired with the same retirement note rule 2 writes today"
      proof: "grep: W1-T12838 criterion 1 in test/dispatch/a-queued-machine-task-is-retired-when-its-symptom-has-stopped.test.ts"
    - claim: "invariant:a-task-with-no-reading-is-untouched — a queued machine task whose family has no symptom reader, or whose reading is unavailable or incomplete, keeps its status, and a zero is trusted only when the reader's corpus covers the whole window"
      proof: "grep: W1-T12838 criterion 2 in test/dispatch/a-queued-machine-task-is-retired-when-its-symptom-has-stopped.test.ts"
    - claim: "A cause whose remedy task was retired by rule 2 or withdrawn reads as open again to the ci-friction ladder and the flow-remedy ladder once new cost is recorded after the retirement date, so a fresh remedy can be filed"
      proof: "grep: W1-T12838 criterion 3 in test/dispatch/a-queued-machine-task-is-retired-when-its-symptom-has-stopped.test.ts"
    - claim: "A task that is claimed, in flight or has an open PR is never retired by this pass"
      proof: "grep: W1-T12838 criterion 4 in test/dispatch/a-queued-machine-task-is-retired-when-its-symptom-has-stopped.test.ts"
  rationale: |
    MEASURED 2026-11-15 by the operator session, read-only, over the daemon ledger union (~/rmd-state2/state, 2026-11-08T00:00Z to 2026-11-15T15:00Z) and origin/main d5722e1fe.

    - Of the gardeners' filed tasks on origin/main, 338 carry a retirement: 130 ci-friction, 61 selector-shadow-miss, 59 ci-learning, 37 selector-shadow, 19 scout, 17 flow-blocker. At least 56 ci-friction and 12 scout tasks were retired by operator ruling, many on the gardener rulings page (2026-10-21) with the reason "0 rows in 3 d; the symptom has stopped".
    - READ machine-filing-judge.ts decideMechanically (the rules are in mechanical-rulings.ts): rule 2 is evaluated only for tasks awaiting a ruling or parked. A released task waiting in the queue is never re-measured, so with the standing dispatch share (W1-T12835) a remedy for a symptom that stopped weeks ago would be built.
    - READ ci-friction-gardener.ts ciFrictionCauseState and flow-remedy-gardener.ts ladderOf: a cause whose top task is retired reads "retired" and is not filed again. The withdrawal note (machine-filing-judge.ts unansweredWithdrawalReason) says it may be re-filed.
  design: |
    1. machine-filing-judge.ts decideMechanically (and mechanical-rulings.ts where rule 2's population is defined): include queued, released machine tasks in the population rule 2 reads. Skip any task with a live claim, an open PR or a run in flight.
    2. run-task.ts productionMechanicalPort: no new reader is added here; the existing scout and ci-friction readers serve the new population.
    3. ci-friction-gardener.ts and flow-remedy-gardener.ts: a retired or withdrawn top task counts as retired only until cost is recorded after its retirement date.
    INVARIANT a-task-with-no-reading-is-untouched: no reader, an unreadable reading or a corpus that does not cover the window leaves the task exactly as it is.
    NOT IN SCOPE: readers for fix-lane, flow and flow-remedy families, the backlog gardener, and rules 1, 3 and 4.
  falsifier: |
    Exclude queued released tasks and criterion 1 must fail. Retire on an unavailable reading and criterion 2 must fail. Keep a retired cause closed after new cost and criterion 3 must fail. Retire a claimed task and criterion 4 must fail. Restore and all pass.
  note: |
    reservation hand-off: run-unfiled-1794756420518 -> run-unfiled-1794756420518
