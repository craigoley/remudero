  title: "the fleet's largest human-owed queue reaches no human surface — every `verify: human` site in src/ is an EXCLUSION, `needsHuman` is set ONLY from an open escalation issue, and the weekly docket gathers five channels of which the plan is not one, so 31 tasks wait on a person who is never told"
