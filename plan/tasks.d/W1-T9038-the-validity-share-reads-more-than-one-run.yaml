    - claim: "the share is the same for the same samples in any input order, and ties at the k-th distance are all included"
      proof: 'grep: test("W1-T9038: the neighbourhood share is order-independent and includes ties at its edge" in test/the-validity-share-reads-more-than-one-run.test.ts'
    - claim: "dispatch-value.ts exports the neighbourhood share"
      proof: 'grep: validityShareNearAge in src/lib/dispatch-value.ts'
  falsifier: |
    Production-shaped corpus: 25 dated runs at distinct millisecond ages around age A. The run nearest A is stale and the
    other 24 are valid. Today the task at age A scores with probability 2 x prior / 3, the value one stale run gives. With
    the fix it scores near the neighbourhood's share. Two same-tier tasks X and Y, where a lone stale run lies nearest Y's
    age at nowMs but not at nowMs + 60 s: today X sorts first at nowMs and Y at nowMs + 60 s. With the fix the order holds.
    Revert to the single nearest key and the first two tests go red. Drop the tie rule and the third test reads a
    different share for a reversed input.
  note: |
