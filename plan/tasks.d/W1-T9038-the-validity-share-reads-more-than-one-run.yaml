  rationale: |
    READ on origin/main e7975fca6, against the core ledger union on host remudero (~/rmd-state2/state: 512 rotations
    plus the live file, read 2026-10-13 ~10:55Z). Symbols, not lines.
    THE DESIGN W1-T4064 FILED. "P(still valid | age) is LEARNED from this ledger: by filing age at dispatch, the share
    of dispatches that ended already-satisfied, no-op, or refused as merged."
    WHAT THE CODE COMPUTES. `costOfDelayContext` (src/lib/dispatch-value.ts) builds `ages`, a Map from
    `start.at - filedAt` (milliseconds) to a `{ valid, total }` tally. A task's probability is
    `(nearest.valid + DISPATCH_VALUE_PRIOR_WEIGHT * prior) / (nearest.total + DISPATCH_VALUE_PRIOR_WEIGHT)` over the ONE
    key nearest its age. Two runs share a key only if they started at the same millisecond offset from their filings.
    MEASURED over the union's run.start, verdict and dispatch.refused_already_merged rows (3,899 starts): 2,453 dated
    samples, 2,453 keys, 0 keys holding more than one run. The fleet prior is 2,134/2,453 valid, about 0.870, so every
    task's probability is (1 + 2 x 0.870) / 3 = 0.913 when the single nearest run was valid, or 2 x 0.870 / 3 = 0.580 when
    it was stale. Nothing between. The "share" W1-T4064 designed is never computed.
    WHY THE TEST DID NOT CATCH IT. test/new-work-is-ordered-by-cost-of-delay.test.ts gives its 20 history runs exactly
    two ages (10 at 1 day and 10 at 30 days, all started at the same `ts`), so its tallies hold 10 runs each. Production
    writes no two runs at the same millisecond age.
    WHAT IT DOES TO ORDER. Within a priority tier, `compareDispatch` orders by `stridePassByTaskId`, which is
    `(1 + counted starts) / score`, and `score` is that probability times impact and class terms. In one tier, with equal
    impact and class, a 1.57x swing in score is decided by which unrelated historic run happens to lie nearest the task's
    age, and that changes as `nowMs` moves. A replica of the probability term over the union, stepped one minute at a time
    from 09:30Z on 2026-10-13, flipped the nearest outcome for W1-T8514, W1-T7957 and W1-T8863 22 times in 60 steps.
    At 10:37:04Z W1-T8514's nearest run was W1-T2500-1788186263945, refused as merged on 2026-08-31 (0.580). W1-T8863's
    was W1-T2314-1787791393347, merged on 2026-08-27 (0.913).
    THE CASE THAT SURFACED IT. W1-T8514 (P1; src/lib/drain.ts, src/lib/daemon.ts) handed off at 03:06:18Z with a live
    receipt for run-W1-T8514-1791858550379 at cbc58a6a0. It logged `dispatch.lifetime_pressure` at every one of 16
    selection passes after that and no skip, filter or serialized row, so it was eligible throughout. From 03:33Z to
    08:32Z it lost to P0.9 W1-T8927 holding src/lib/daemon.ts in flight. That is priority-correct, and W1-T8771 names
    that silent pass-over. From 08:32Z its files were free, and it lost each pass on same-tier order: the 08:33:49Z refill
    took W1-T8868, the 09:10:08Z and 09:42:38Z ticks took W1-T8238 and W1-T7957, and the 10:37:09Z refill took W1-T8863
    although W1-T8514 shared no file with in-flight W1-T9001 or W1-T7957. INFERRED, NOT REPRODUCED: the replica above
    does not reproduce the daemon's exact order at 09:42Z (the daemon's `nowMs` and union tail are not recorded), so this
    task does not claim the estimator alone decided those picks. It claims the term that ranks one tier is one run's
    outcome, which the code and the corpus show directly.
    NOT COVERED: W1-T8166 changes which starts spend a stride (the numerator). W1-T7534 contains an undatable task. W1-T8514
    reserves files against strictly lower priority. W1-T8771 names a pass-over. None touches the age-validity estimate.
  design: |
    1. THE SHARE, IN src/lib/dispatch-value.ts. Export a pure `validityShareNearAge(samples, age)` that takes the sorted
       `[age, { valid, total }]` samples `costOfDelayContext` already builds and returns `{ valid, total }` summed over the
       NEIGHBOURHOOD of `age`: the k samples nearest in absolute age difference, where k = ceil(sqrt(n)) and n is the
       number of dated runs. k grows with the corpus, so no fixed count is written (the operator's no-hard-thresholds
       rule). Every sample at the same distance as the k-th is included, so the result does not depend on input order.
       `costOfDelayContext` then computes `(share.valid + DISPATCH_VALUE_PRIOR_WEIGHT * prior) / (share.total +
       DISPATCH_VALUE_PRIOR_WEIGHT)` from that share instead of from one key. With no dated samples it keeps `prior`.
    2. UNCHANGED: `prior`, `DISPATCH_VALUE_PRIOR_WEIGHT`, the stride numerator and `streakRefusal` (W1-T7742, W1-T8166),
       impact and fanout, class estimates, W1-T7534's unscored handling, `compareDispatch`, and W1-T4064's invariant that
       the order is a pure function of (plan tree sha, calibration snapshot). A corpus whose tallies already hold many runs
       at one age, like the existing fixture, keeps its ranking.
    Tests go in the new file test/the-validity-share-reads-more-than-one-run.test.ts, with `test(` titles exactly as in
    the proofs below. Build production-shaped corpora: every run at its own millisecond age. Call
    `buildDispatchValueContext` with an explicit `nowMs` and filing snapshot, as test/new-work-is-ordered-by-cost-of-delay.test.ts
    does. Use no live ledger, no wall clock and no network.
