  rationale: |
    OBSERVED 2026-11-10 (core ledger, 2026-11-09T16:00Z to 2026-11-10T05:00Z): agent.built 1,043 rows and workstreams.built 1,029 rows, 27 percent of the 7,781 rows written by every actor in that window, all from serve's views thread.
    - Each row is appended to the ledger every projector folds and every digest keys on, so serve's own bookkeeping is a steady source of the change that makes its views rebuild.
    - read_model.view_builds already gives builds per view per window.
  design: |
    Keep a tally per instance in each view and flush it on the same window the view_builds row uses (or every 10 minutes when that is not in reach), writing the first build immediately.
    Two existing tests (test/workstreams-view.test.ts, test/workstreams-projection-reuse.test.ts) count builds through the workstreams.built row; they keep that by asking the view for a zero window, the one seam this adds.
    NOT IN SCOPE: view_builds itself and any reader of these rows; grep shows no reader that needs one row per build, and the test pins the fields the tally keeps.
  falsifier: |
    Write a row per build and criteria 1 and 2 must fail; write an empty window or hold back the first build and criterion 3 must fail. Restore and require all three to pass.
