- id: W1-T3194
  title: "A SUCCESSFUL ARTIFACT UPLOAD THAT 403S ONLY WHILE FINALIZING STALLS THE WHOLE QUEUE — two independent GitHub Actions runs uploaded every byte and then failed `FinalizeArtifact` through an intermediary, but Remudero treated both as product defects: one PR stayed red and main health opened a manual incident instead of re-running the exact failed job once"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 12.00
