- id: W1-T3745
  title: "EVERY PULL REQUEST FROM THE fix-<slug>-<epochMs> LANE IS BORN RED ON A REQUIRED CHECK — head-identity-gate recognises `run-<taskId>-<epochMs>`, `run-unfiled-<epochMs>`, a Remudero-Task trailer or a filing-shaped subject, and that lane's branches are none of the four, so the refusal is structural and arrives before any reviewer reads a line"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: low
  origin: "observed 2026-09-17 on the live board — #5952 and #5953, opened 8 minutes apart, both refused by head-identity-gate for the same structural reason"
  plan_refs: [W1-T3388, W1-T1004]
  files: [scripts/head-identity-gate.mjs]
  status: queued
  attempts: 0
  note: |
    reservation hand-off: unknown -> file-t3745-fix-lane-born-red
  rationale: |
    MEASURED 2026-09-17 on the live board, two pull requests eight minutes apart:

      #5952  feat(review): let the acceptance reviewer divert to cash under a squeeze
             branch fix-reviewer-cash-divert-1789676196    head-identity-gate: REFUSED
      #5953  fix(sweep): give the review-reuse decision the producer it never had
             branch fix-review-reuse-producer-1789676673   head-identity-gate: REFUSED

      head-identity-gate: REFUSED — this head matches neither conforming form and carries no
      valid Remudero-Task trailer.

    (1) THE REFUSAL IS STRUCTURAL, NOT A MISTAKE IN THE WORK. The gate accepts four things: a
        `run-<taskId>-<epochMs>` branch, a `run-unfiled-<epochMs>` branch, an anchored
        `Remudero-Task:` trailer, or a filing-shaped subject (W1-T1004). `fix-<slug>-<epochMs>` is
        none of them, and no amount of correct code changes that. Every PR this lane opens is red
        on a REQUIRED check the moment it exists.

    (2) THE COST IS PAID ON GOOD WORK. #5952 is not marginal: it fixes the review lane being
        undivertable under a squeeze, which is why the board went all-red — `remudero-review` is
        required, so with that lane stuck NOTHING can merge, however well every other lane repairs
        itself. That fix sat behind a branch-name refusal.

    (3) A PR CANNOT BE REPOINTED. GitHub does not allow changing an open PR's head ref, so the
        remedy for each affected PR is either an amend that adds a trailer (which needs a filed id
        the work may not have) or close-and-reopen on a conforming branch. Both are manual, and
        both are paid once per PR rather than once.

    NOT A CASE FOR WIDENING THE GATE. W1-T3388 gave it these forms deliberately: the point is that
    a head is attributable to a task or explicitly declares it has none. Adding `fix-*` as a fifth
    accepted shape would restore the green without restoring the attribution, which is the thing
    the gate exists for.
  design: |
    (i) THE LANE EMITS A CONFORMING BRANCH. Whatever opens these branches names them
        `run-unfiled-<epochMs>` when the work has no filed task and `run-<taskId>-<epochMs>` when
        it does. This is the whole fix; everything below is about not paying for it twice.

    (ii) THE REFUSAL NAMES THE REPAIR THAT ACTUALLY WORKS. Today's message lists the conforming
         forms, which reads as "rename your branch" — advice a PR author cannot take, because the
         head ref of an open PR is fixed. It should say so, and name the amend-a-trailer route as
         the one that works on an EXISTING pull request.

    (iii) REFUSE AT PUSH, NOT AT CI. The pre-push hook already runs head-identity-gate and prints
          OK for conforming heads; a non-conforming one should be caught there, before a PR exists
          and while renaming is still free.

    NOT IN SCOPE: widening the set of accepted shapes, and repairing #5952/#5953 themselves — each
    needs a human decision about which task id it belongs to.
  acceptance:
    - claim: "a head that matches no conforming form is refused before the push, not after a pull request exists"
      proof: "grep: refuses at push in scripts/head-identity-gate.mjs"
    - claim: "the refusal names the amend-a-trailer repair, because an open pull request's head ref cannot be renamed"
      proof: "grep: cannot be renamed in scripts/head-identity-gate.mjs"
    - claim: "the four accepted shapes are unchanged — this adds no fifth"
      proof: "grep: run-unfiled- in scripts/head-identity-gate.mjs"
  falsifier: |
    Add `fix-*` to the accepted shapes and the third assertion must go red — that is the change
    this task exists to refuse. Leave the message naming only the branch forms and the second goes
    red. Catch the non-conforming head only in CI and the first goes red, which is the difference
    between a free rename and a closed pull request.
