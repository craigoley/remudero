  rationale: |
    MEASURED 2026-09-10 over the ledger union (919 archives + live file), exact-step queries with
    controls. The console is demonstrably in use — 51 `panel.*` rows and 44
    `"step":"ratify.approved"` — and yet:
      panel.question_answered          0
      operator_note.added              0
      plan/operator-notes.ndjson       never created (checked at the REAL host path; it is
                                       gitignored, so absence in a checkout would prove nothing)
    `rmd approve <P##>` is the ONE touchpoint that fires, and it accepts no free text by design
    ("one bit ratifies through the gate").

    THE GAP IS NOT MISSING WIRING — IT IS FRICTION, AND THE EVIDENCE IS ALREADY IN THE LEDGER.
    `rmd reframe <P##> --feedback "<text>"` ALREADY captures operator words verbatim into
    `ratify.reframed`, which IS the docket's first capture surface, fully wired end to end. It has
    been used ZERO times (`"step":"ratify.reframed"` = 0 across the union, against a control of 44
    on `ratify.approved`). A capture path that costs a flag is a capture path that does not get
    used. Building a third path with the same friction would repeat that result, not fix it.

    NOT A DUPLICATE. The only shard naming `plan/operator-notes.ndjson` is W1-T3348, whose design
    note (v) explicitly defers this as the successor and forbids shipping it without the gate.
    That gate MERGED as #5014 before this was built, so capture no longer ships ahead of the thing
    that refuses.
  design: |
    (i) THE TEXT IS POSITIONAL. `rmd note <id> <text...>` — an id and the sentence you were going
    to type anyway. No `--feedback`-shaped flag, for the reason the rationale measures.

    (ii) ONE WRITER, SHARED. `recordCliOperatorNote` stamps and appends for BOTH `rmd note` and
    `rmd approve --note`, so the two surfaces cannot drift in stamp, store, or ledger step.
    `appendOperatorNote` refuses an unstamped entry and never throws, so a filesystem failure is a
    reported `false`, never a crash mid-ratification.

    (iii) OPTIONAL, AND ONLY AFTER SUCCESS. Absent `--note`, approve is byte-for-byte the one bit
    it documents. Present, it chains AFTER the ratification lands — on both the proposal path and
    W1-T3216's task-release path. Guidance attached to a refused approve would describe a state the
    plan was never in, and that is the falsifier the suite drives.

    (iv) NO `--author` FLAG. `operator-notes.ts` states this deployment has no per-human identity,
    so an author flag would offer precision the system cannot back. The note's accountability is
    the SURFACE it arrived on, recorded in its own ledger step (`operator_note.added` for the CLI,
    `panel.operator_note_added` for the console).

    (v) THE REGISTRY WORK A NEW VERB OWES, done rather than worked around: docs/cli-reference.md
    regenerated by its own generator, the operator-guide command table, the reviewed command-name
    inventory (77 -> 78), and the console-parity map — where `note` maps to its REAL route,
    POST /v1/operator-notes/add, which writes the same store through the same `appendOperatorNote`.
    That is genuine parity, not a cli-only carve-out, and classifying it as one would have been the
    easy wrong answer.

    (vi) NOT A GATE. This is capture, which reaches only the injected-learning rung. The refusing
    rung is W1-T3348's `capture-surfaces` doctor check, already on main. This task exists to give
    that gate something true to report.
  acceptance:
    - claim: "rmd note writes one provenance-stamped note that the docket's own read side accepts"
      proof: "unit test: test/an-operator-note-reaches-the-docket-from-the-cli.test.ts"
    - claim: "a note with no id or no text is a usage error that writes nothing at all"
      proof: "unit test: test/an-operator-note-reaches-the-docket-from-the-cli.test.ts"
    - claim: "a refused approve records no note, and an approve without --note writes none"
      proof: "unit test: test/an-operator-note-reaches-the-docket-from-the-cli.test.ts"
    - claim: "a succeeding approve chains the note verbatim, scoped to the id it approved"
      proof: "unit test: test/an-operator-note-reaches-the-docket-from-the-cli.test.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION if a CLI verb already writes `plan/operator-notes.ndjson` — proven
    by driving it, not by a grep. MEASURED at filing: `appendOperatorNote` has exactly one caller,
    the console HTTP route, and `rmd --help` lists no note verb.

    EACH ARM LOAD-BEARING, PROVEN BY DELETION: chaining the note BEFORE approve's validation must
    redden the refused-approve test; deleting the task-path chain must redden the success test;
    accepting empty note text must redden the usage test; dropping the whitespace flattening must
    redden the verbatim assertion.

    AND THE MEASUREMENT MUST SURVIVE ITS OWN ENVIRONMENT: this host prunes `.git/worktrees/*` under
    the fleet's sweep churn, which fails every git-dependent test at once and once produced a
    57-test phantom regression here. Assert the worktree gitdir still exists AFTER a suite run
    before believing its failure set.
