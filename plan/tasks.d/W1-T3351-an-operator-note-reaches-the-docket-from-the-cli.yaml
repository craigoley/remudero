  title: "THE OPERATOR'S OWN WORDS REACH NO SURFACE THE DOCKET READS — `rmd approve` is the one operator touchpoint that fires (44 times) and takes no free text at all, while the surface that DOES capture words (`rmd reframe --feedback`) reads zero because it costs a flag; give the operator a positional note verb and let approve chain it optionally"
