  design: |
    No LLM and no new fixed bound. Runs once per (head, run_id), on the hold-state file the refresh records already use.
    1. A PURE SELECTOR in src/lib/dep-review.ts: `supersededRedReruns(runs, liveReadingChecks)`.
       - It takes the head's workflow runs and their failed jobs.
       - It returns the old FAILURE runs whose failed job is a live-reading check (`commitlint` from pr-title-lint.yml,
         `ci-gate` from ci.yml) and whose newest same-name check run at the head passed. That is the same notion of
         "superseded and now passing" that `supersededRedsNowPassing` in src/lib/sweep.ts already uses.
       - For each run it returns `rerun-failed-jobs` when every failed job in that run is such a check. Otherwise it
         returns the per-job `actions/jobs/{job_id}/rerun` (W1-T1223).
       - The live-reading set is one exported constant. A test reads both workflow files, so if either check moves to
         reading the event payload, the test turns red.
       - A superseded red in any other check is never selected.
    2. THE EFFECT, in `depReviewCommand` (src/run-task.ts), on a Dependabot head whose raw rollup carries a superseded
       red (`supersededRedsNowPassing`):
       - It runs in the `arm` branch BEFORE the guarded post and the arm. It does not depend on whether the head is
         armed or BLOCKED, because mergeability can read "unknown" for hours.
       - It runs on the pass after `reconcileDependabotTitle` returns "retitled".
       - It reads the head's runs once (`actions/runs?head_sha=`, plus each selected run's jobs), then POSTs each
         selection.
       - It records `{ headSha, runId, attempt }` and ledgers `dep-review.superseded_red.rerun_requested` (check,
         run_id, job_id, endpoint). It never re-runs the same run_id at the same head twice.
       - Order: `commitlint` before `ci-gate`. The aggregator waits on pending required checks, and its 22:55Z edited
         run passed beside the old FAILURE, so it already judges each check by its newest run.
       - Then it continues to the ordinary post and arm, so auto-merge lands once the old suites turn green.
       - A thrown POST ledgers `dep-review.superseded_red.rerun_failed` and is retried on the next pass, because the
         record is not marked done.
    3. W1-T9913'S STALE-EVENT PATH re-runs instead of recreating. The second sighting at an armed, BLOCKED head uses
       step 2's effect instead of commenting `@dependabot recreate`. If a re-run for this head was already requested and
       the head is still blocked, it escalates once through the existing `buildDepReviewStaleEventEscalation` and
       `escalate()` dedup. A superseded red that is not live-reading (step 1) escalates directly and is never re-run.
    4. CONFIRM IT on a later pass: a re-run attempt (`run_attempt` > 1) that concluded success ledgers
       `dep-review.superseded_red.rerun_verified` (check, run_id, attempt). An attempt that failed again ledgers
       `dep-review.superseded_red.rerun_red` and goes to step 3's escalation, never to a second re-run.
    5. UNCHANGED: `fitDependabotTitle` and the REST retitle, pr-title-lint.yml, ci-gate.yml, ci-gate's lists,
       `decideDepReview`, the sweep's dedup and `depReviewDedupStandsAside`, and W1-T9994's command/update-branch handling.
    6. TESTS go in the new file, which must not import src/run-task.ts. The command-level test updates
       test/an-armed-dependabot-head-blocked-by-a-stale-event-is-recreated.test.ts, whose recreate expectation this
       replaces. Use the #11968 runs fixture: runs 38934326485 and the ci.yml run failed at 16:44Z, and 38978493953 and
       38978493967 succeeded at 22:54Z. The proofs name the `test(` titles verbatim.
