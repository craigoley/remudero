  design: |
    Operator rulings: no fixed threshold, and a non-worker cause is the harness's to fix.
    1. NON-WORKER INTERRUPTIONS. A terminal verdict counts as non-worker when it is a freshness or recycle yield or
       handoff, restart_checkpoint_failed, a claim race ("already claimed by another lane"), a toolchain or
       node_modules refusal, a harness output-budget failure (stage worker.bounded_output), or a run the lock sweep
       proved orphaned. `dispatch.lifetime_pressure.infra_only` rows are first-class evidence. The classifier lives
       in this module, and test fixtures pin each class to a 2026-10-11 row.
    2. TWO SIGNALS, each against the fleet's own history (`ownHistoryBound`, W1-T8236):
       a. STRANDED. Time since the task's first start of the current episode with no `pr.opened` or merge, while every
          terminal verdict since then is non-worker. Bound: the p90 of start-to-PR spans of tasks that reached a PR.
       b. PASSED OVER. Fresh implement starts of tasks at equal or lower plan priority while this task was resumable
          (its last verdict a handoff or yield) or its breaker was tripped on non-worker evidence only. Bound: the
          p90 pass-over count of resumable tasks that did resume.
    3. THE FINDING. `stranded-task` with subjects `task=`, `since=`, `causes=` (counts per non-worker class),
       `breaker=tripped|clear`, `passed_over=`. A task with any attributable worker failure is out of scope. The
       breaker and the lifetime judge own that case.
    4. REGISTER in FLEET_FLOW_DETECTORS. Its inputs join the census.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Replay W1-T7742, W1-T7837 and a
    control task whose second verdict is a real worker failure.
