- id: W1-T7954
  title: "THE LEARNINGS STORE MERGES WITHOUT CONFLICT — every new lesson is appended to the tail of one shared learnings/ci.yaml and regenerates the committed learnings/index.json, so two lesson PRs open at once always conflict on both; #10829 conflicted again after its 09:45Z repair when #10831 appended at 10:04Z, and was escalated at about 11:16Z"
  repo: remudero
  depends_on: [W1-T7955]  # shares src/lib/sweep.ts
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 14.00
  risk: high  # Rule 19: one concern — the learnings store's on-disk layout is merge-friendly for additions
  band_meaning: span
  origin: "operator approval 2026-10-11: file the recommended follow-ups (learnings/*.yaml causes repeated merge conflicts)"
  plan_refs: [W1-T33, W1-T4680, W1-T3827, W1-T7899, W1-T7900]
  files: [learnings/index.json, .gitignore, scripts/lib/learnings-files.mjs, scripts/generate-learnings-index.mjs, scripts/learnings-budget-ratchet.mjs, scripts/learnings-assert-check.mjs, scripts/learnings-derive-symbols.mjs, src/lib/learnings.ts, src/lib/knowledge-gardener.ts, src/lib/measurement-cadence.ts, src/lib/plan.ts, src/lib/sweep.ts, test/learnings-index.test.ts, test/the-learnings-store-merges-without-conflict.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ on origin/main cb58d3155 (2026-10-11). The PR heads were read with `git fetch origin refs/pull/<n>/head`.
    THE CONFLICTS ARE ALL ONE SHAPE: TWO ADDITIONS AT THE SAME TAIL.
      - #10829 (W1-T7899, head 3874a188b). It appends `coverage-session-blanking-env-form` after the last entry of
        learnings/ci.yaml (hunk @@ -499,3 +499,26 @@). It also inserts 5 lines into learnings/index.json's
        sorted `entries` and `files` lists. Its conflict round landed at 09:45:20Z. Then 3b9bf3811 (#10831,
        W1-T7900) appended to the same tail at 10:04:12Z, and the PR conflicted again.
      - #10069 shipped a commit titled "fix(ci): resolve concurrent ci learning additions" (0091613ae).
      - #10287 shipped one titled "fix(ci): preserve both gate lessons across merge conflict" (f550a5abf).
      - Each of the three adds exactly one entry to learnings/ci.yaml and edits learnings/index.json.
    HOW LEARNINGS ARE WRITTEN.
      - A ci-learning task's whole file list is learnings/ci.yaml. `CI_LEARNING_LESSONS_FILE`
        (src/lib/measurement-cadence.ts:3338) is used in the filed shard (:3314, :3324) and in its proof
        (:3327). The machine-narrow shape rule requires it (src/lib/plan.ts:433).
      - On main since 2026-10-04, learnings/ci.yaml took 24 commits: 16 lesson additions and 7 gardener folds.
      - The knowledge gardener edits and retires entries in place (`applyLearningActions`,
        src/lib/knowledge-gardener.ts:745).
      - learnings/index.json is derived. scripts/generate-learnings-index.mjs builds it, and
        test/learnings-index.test.ts:16 requires it to be fresh on every PR. So every addition also rewrites
        sorted lists in it.
      - The runtime never needs it: `loadLearningsForTaskFiles` (src/lib/learnings.ts:1842) falls back to a full
        `loadLearningsCorpus` scan when the file is absent (:1847-1848). Its doc says correctness never depends on
        the index (:1839). The whole corpus is about 100 KB.
    WHY NOT A UNION MERGE DRIVER. `merge=union` in .gitattributes is honoured by a local git merge. GitHub does not
    document honouring merge drivers for PR mergeability, so the PR could still read dirty and need a round.
    Where hunks overlap, union keeps both sides. That resurrects a line the gardener deleted and can write
    duplicate ids or broken YAML. It also does nothing for the sorted lists in index.json.
    CHOSEN: ONE FILE PER NEW ENTRY, AND NO COMMITTED INDEX. Two additions then touch two different new paths and
    cannot conflict anywhere. plan/tasks.d already works this way: 3,330 one-task shards in place of one list.
    WHAT WOULD RE-OPEN MIGRATING THE EXISTING SHARDS. This task leaves existing entries where they are. If a
    conflict round's only conflicting path is an in-place gardener edit of learnings/<shard>.yaml, move the
    remaining entries to per-entry files too. The gardener's fold PRs and their conflict rounds are the count to read.
  design: |
    1. ONE ENUMERATION. Add `learningsSourceFiles(dir)` to the new scripts/lib/learnings-files.mjs. It returns
       every `<dir>/*.yaml` shard and every `<dir>/<shard>.d/*.yaml` entry file, sorted, each tagged with its shard
       name. Each entry file is a one-element YAML list in today's entry schema.
       Every reader uses it, or a TypeScript twin that a test pins to the same output:
       - `loadLearningsCorpus` and `buildShardStandingBriefs` (src/lib/learnings.ts:588, :617);
       - scripts/generate-learnings-index.mjs (:79), scripts/learnings-budget-ratchet.mjs (:98),
         scripts/learnings-assert-check.mjs (:149) and scripts/learnings-derive-symbols.mjs (:123);
       - the knowledge gardener's `applyLearningActions` and pass reader (src/lib/knowledge-gardener.ts:750, :1026).
       So an entry in `ci.d/` is injected, budgeted, asserted, briefed and gardened exactly as a shard entry is.
       Ids stay unique across both forms.
    2. NEW LESSONS ARE NEW FILES. `CI_LEARNING_LESSONS_FILE` becomes a per-finding path, `learnings/ci.d/<slug>.yaml`.
       The slug is the finding's own kebab slug, as feedback-landing already derives one
       (src/lib/feedback-landing.ts:1681). The filed shard's `files:`, its `grep:` proof and the narrow-shape rule
       (src/lib/plan.ts:433) accept that path.
    3. THE INDEX IS DERIVED, NEVER COMMITTED. Delete learnings/index.json and add it to .gitignore.
       `loadLearningsForTaskFiles` takes the full-scan path it already has. The generator keeps `--out` for local
       inspection. Its `--check` mode now checks that the corpus builds an index, with no committed file to
       compare, so `npm run learnings-index:check` and the unwired-gate rows that name it stay valid. Drop the
       "learnings/index.json" row from the sweep's path-to-gate map (src/lib/sweep.ts:5208), and update
       test/learnings-index.test.ts's freshness case.
    4. PROVE IT MERGES. In a gitRepo() fixture, two branches each add a lesson the new way to the same base. Both
       merge into the base with no conflict, and the merged corpus holds both ids.
    Tests go in the new file test/the-learnings-store-merges-without-conflict.test.ts, with `test(` titles exactly as
    in the proofs below. The existing learnings, budget-ratchet, assert-check and knowledge-gardener suites must stay
    green.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/the-learnings-store-merges-without-conflict.test.ts"
    - claim: "two branches that each add a lesson merge with no conflict and the merged corpus holds both"
      proof: 'grep: test("W1-T7954: two concurrent lesson additions merge without conflict" in test/the-learnings-store-merges-without-conflict.test.ts'
    - claim: "an entry file under a shard's .d directory is loaded, budgeted, asserted and gardened like a shard entry"
      proof: 'grep: test("W1-T7954: every learnings reader sees a per-entry file" in test/the-learnings-store-merges-without-conflict.test.ts'
    - claim: "a ci-learning filing names a per-finding file under learnings/ci.d, never learnings/ci.yaml"
      proof: 'grep: test("W1-T7954: a ci-learning filing writes its own entry file" in test/the-learnings-store-merges-without-conflict.test.ts'
    - claim: "task-file learnings selection is unchanged with no committed index"
      proof: 'grep: test("W1-T7954: selection without a committed index matches the indexed selection" in test/the-learnings-store-merges-without-conflict.test.ts'
  falsifier: |
    Keep `CI_LEARNING_LESSONS_FILE` as learnings/ci.yaml. The two-branch fixture then appends both lessons at one
    tail and `git merge` stops with a conflict on learnings/ci.yaml, as #10829 did, so the first test fails. Keep a
    committed learnings/index.json, and the same merge conflicts on it. Let the budget ratchet keep its own
    `readdirSync` of `*.yaml`, and a `ci.d/` entry escapes the budget, so the reader-census test fails.
