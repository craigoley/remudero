- id: W1-T5513
  title: "THE HOST JANITOR REAPS THE SCRATCH DISK'S TOP LEVEL — `rmd-host-cleanup.sh` sweeps /tmp-style roots and /mnt/scratch/worktrees but never /mnt/scratch itself, where ~510 idle gate workspaces and leaked test dirs hold ~120 GB and the disk sits at 87-89%"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: "operator session 2026-10-03: /mnt/scratch at 89% with ~120 GB of idle top-level entries no sweep reaches"
  plan_refs: [W1-T4770, W1-T3378, W1-T4804, W1-T5547, W1-T5548, W1-T5518, W1-T5550]
  files: [deploy/rmd-host-cleanup.sh, deploy/rmd-tmp-sweep.sh, test/helpers/host-cleanup-fixture.ts, test/host-root-disk-janitor.test.ts, test/a-top-level-scratch-workspace-idle-for-12-hours-is-removed.test.ts, test/a-scratch-workspace-holding-unpushed-commits-is-bundled-before-removal.test.ts, test/a-workspace-parent-root-is-never-removed-and-its-children-are-judged.test.ts, test/two-janitor-passes-cannot-run-at-the-same-time.test.ts]
  status: queued
  priority: 1
