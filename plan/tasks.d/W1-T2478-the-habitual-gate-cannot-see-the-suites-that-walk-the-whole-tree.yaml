    - claim: "every previously admitted fast step is still admitted and still passes"
      proof: "unit test: test/fast-gate-admits-the-census-class.test.ts"
    - claim: "the per-step bound is documented as a primary control and never as a backstop"
      proof: "grep: PRIMARY CONTROL in src/lib/ci-parity.ts"
    - claim: "a failing census step names which suite failed rather than a bare non-zero exit"
      proof: "unit test: test/fast-gate-admits-the-census-class.test.ts"
    - claim: "removing the census steps makes the omission pass a fast run again"
      proof: "unit test: test/fast-gate-admits-the-census-class.test.ts"
