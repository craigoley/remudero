- id: W1-T4333
  title: "close the three CodeQL js/useless-assignment-to-local quality alerts (#116, #125, #145) — verify each from the API, remove the dead store, preserve every other side effect"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 70.00
  files: [src/lib/*.ts, src/*.ts, scripts/*.mjs, test/useless-assignment-alerts.test.ts]
  origin: architect
  plan_refs: ["§5", "§5D"]
  status: queued
  attempts: 0
  rationale: |
    THE PROPOSAL, VERBATIM (auto-generated by src/lib/codeql-quality-intake.ts's proposalSummary,
    which is the ONLY producer of a `codeql-quality:` proposal id — reconcileCodeqlQualityProposals
    partitions open code-scanning alerts tagged BOTH "quality" and "maintainability" by rule and mints
    one proposal per rule): "CodeQL quality debt for rule js/useless-assignment-to-local: 3 open
    alerts tagged quality and maintainability (#116, #125, #145). Propose one bounded cleanup task for
    this rule; do not auto-fix or dismiss alerts."

    THIS IS A DIFFERENT DEFECT CLASS FROM W1-T68, NOT A DUPLICATE. W1-T68 turned on
    noUnusedLocals/noUnusedParameters, which catches a local DECLARED and never read anywhere.
    js/useless-assignment-to-local catches the opposite shape: a WRITE to a local whose value is never
    read before the next write or the end of scope — a dead store, e.g. `count = 0; count = total();`
    where the first assignment is discarded, or a variable written in one branch and unconditionally
    overwritten before any branch reads it. tsc's noUnusedLocals does not and cannot flag this — the
    variable IS read somewhere, just not the write being flagged — so W1-T68's gate leaves this class
    completely open, which is exactly why CodeQL still has 3 live alerts for it.

    LOCATIONS ARE UNKNOWN TO THIS FILING, AND THAT IS DELIBERATE, NOT AN OVERSIGHT. The intake
    mechanism partitions and tracks alerts by id/rule only (CodeqlQualityAlert extends RawAlert with
    just {ruleId, toolName, ruleTags}); W1-T286's own recon already established the reason a step
    further upstream — ops.ts's normalizeCodeScanningAlert drops most_recent_instance.location.path,
    so nothing in this repo's own alert pipeline can name the flagged file/line before a live API read.
    Guessing a file list here would be exactly the distrust-the-prompt failure the design's STEP 1
    exists to prevent (the W1-T286 precedent, "the flagged paths are not knowable from the feedback
    entry, and a guessed file list would be exactly the distrust-the-prompt failure step 1 existed to
    prevent"). `files:` above is therefore scoped to the surface CodeQL actually analyzes for this repo
    (`.github/codeql/codeql-config.yml`: "CodeQL analyzes the SHIPPED attack surface (src/)... paths-
    ignore: test/**"; codeql.yml's javascript-typescript matrix has no further path restriction, so
    scripts/*.mjs is in scope too) rather than three guessed exact paths.

    WHY THIS NEEDS AN ARCHITECT-DRAFTED TASK RATHER THAN THE UNATTENDED ALERT-FIX LANE (W1-T90,
    ratifying P20): plan/alert-policy.yaml's act_severities only ever auto-acts on `medium`/`low`
    SECURITY severities read off the alert; a quality/maintainability-tagged CodeQL finding carries no
    comparable severity the lane's policy reads, so it would escalate rather than act even if routed
    there — the codeql-quality-intake mechanism exists precisely to route this class to a human-
    approved, normally-gated task instead, which is what "do not auto-fix or dismiss alerts" in the
    proposal text is asking for. This task is that gated path: implement -> the normal remudero-review
    + ci-gate, exactly like any other filed task, never a blind mechanical rewrite.
  design: |
    STEP 1 — READ ALL THREE ALERTS BEFORE TOUCHING ANY CODE (distrust this filing's assumptions):
      gh api repos/craigoley/remudero/code-scanning/alerts/116
      gh api repos/craigoley/remudero/code-scanning/alerts/125
      gh api repos/craigoley/remudero/code-scanning/alerts/145
    For EACH, record in the PR body and in the regression fixture (STEP 4): its current `state`,
    `rule.id` (expected `js/useless-assignment-to-local` — if the API reports a different rule for any
    of the three, fix what the API says and say so; the alert is the authority, not this task text),
    `most_recent_instance.location` (path + start_line/end_line), and `most_recent_instance.message.text`
    (names the specific dead variable/assignment CodeQL flagged).

    STEP 2 — AN HONEST NO-OP PER ALERT IS AN ALLOWED OUTCOME. If the API reports an alert as
    `fixed`/`dismissed`/`closed` by dispatch time, it is OUT OF SCOPE for this diff — drop it and paste
    the API response as evidence in both the PR body and the fixture. If all three are already closed,
    close this task as a no-op with that evidence and change no source file; do not manufacture a diff.
    NEVER dismiss an alert by hand as part of this task (the proposal's own instruction) — a live alert
    is closed only by fixing the code and letting CodeQL's own next scan confirm it, or it stays open
    and is reported as such.

    STEP 3 — FIX EACH LIVE SITE, BEHAVIOR-PRESERVING, NO NEW LINT TRADED FOR THE OLD ONE:
      - a right-hand side with NO side effect (a literal, a pure expression, a read of another local)
        -> delete the whole dead assignment statement.
      - a right-hand side WITH a side effect (a function/method call, an increment, an await) -> keep
        the call/expression as a bare statement and drop only the `x = ` / `x += ` part — deleting a
        side-effecting call to silence a lint is precisely the unreviewed auto-fix this proposal warns
        against, and is never acceptable here.
      - if removing the dead write leaves the local's declaration with zero remaining reads or writes
        anywhere in its scope, remove the now-dead declaration too, so the fix does not trade one
        CodeQL alert for a fresh `noUnusedLocals`/`noUnusedParameters` compile error (W1-T68's gate,
        already live in tsconfig.json) — typecheck must report zero NEW violations either way.
      - a dead write to a function PARAMETER is fixed the same way at the assignment only; the
        parameter itself is never removed.
    Every other observable effect at each touched site — control flow, return values, remaining side
    effects — is byte-identical to before the fix.

    STEP 4 — LEAVE THE EVIDENCE WHERE THE NEXT READER CAN FIND IT. test/useless-assignment-alerts.test.ts
    is a documentation-as-test fixture, one record per alert: {id, rule, verified pre-fix location,
    message text, disposition: "fixed-in-this-diff" | "already-closed"}, plus the literal line
    `// alert-dismissed-by-hand: none` in its header, asserting the STEP 2 discipline held. No new
    CodeQL config or alert-lane policy change is needed or wanted here — `.github/codeql/codeql-
    config.yml`'s existing `on: pull_request` re-scan is the authoritative closer for each fixed alert
    on the next run; this task does not touch that workflow or plan/alert-policy.yaml.

    EXPLICITLY OUT OF SCOPE: sweeping the codebase for further useless-assignment patterns CodeQL has
    not yet flagged; touching `.github/codeql/codeql-config.yml` or its `paths-ignore`; widening
    `plan/alert-policy.yaml`'s `act_severities` to cover quality alerts (that is a routing-policy
    decision for a separate proposal, not smuggled into a three-alert cleanup).
  acceptance:
    - claim: "each of alerts #116, #125 and #145 is accounted for by live API evidence recorded in the fixture — either its flagged assignment is fixed in this diff, or the alert is shown already-closed and dropped"
      proof: 'grep: test("W1-T4333: each of alerts #116, #125 and #145 is accounted for by live API evidence" in test/useless-assignment-alerts.test.ts'
    - claim: "no useless assignment remains at any site this PR fixed — the dead store, and its now-unused declaration where nothing else reads it, is removed, while any side-effecting right-hand expression is preserved as a bare statement"
      proof: 'grep: test("W1-T4333: no useless assignment remains at a fixed site and side-effecting expressions are preserved" in test/useless-assignment-alerts.test.ts'
    - claim: "observable behavior at every touched site is unchanged — the full existing test suite passes and typecheck reports zero NEW noUnusedLocals/noUnusedParameters violations introduced by the removal"
      proof: 'grep: test("W1-T4333: observable behavior at every touched site is unchanged" in test/useless-assignment-alerts.test.ts'
    - claim: "no alert is dismissed by hand — every disposition is a code fix left for CodeQL's own next scan to close, or a pre-existing closure evidenced from the API, never a manual won't-fix"
      proof: "grep: alert-dismissed-by-hand: none in test/useless-assignment-alerts.test.ts"
  note: "risk:high / band_meaning:blast-radius set UP FRONT, not a sizing workaround: the three flagged
    locations are unknown until STEP 1's live API read (ops.ts's normalizeCodeScanningAlert drops
    most_recent_instance.location.path, per W1-T286's recon), so `files:` is intentionally scoped by
    directory-wildcard (src/lib/*.ts, src/*.ts, scripts/*.mjs) rather than three guessed exact paths —
    a dead store could land in a control-plane file (status.ts, review.ts, ledger.ts, daemon.ts) as
    easily as anywhere else, which is genuine blast-radius uncertainty, not a multi-concern span (this
    is ONE concern: close three instances of one CodeQL rule). Mirrors W1-T286's own risk:high
    reasoning for the same unknown-location-in-a-control-plane-heavy-repo shape. NO auto-fix, NO manual
    dismissal — the proposal's own instruction is carried into STEP 2/STEP 4 as binding acceptance
    criteria, not left as prose. Quality/maintainability alerts stay outside W1-T90's unattended
    alert-fix lane by design (plan/alert-policy.yaml's act_severities covers security severities only)
    — this Architect-drafted, normally-gated task is that lane's deliberate absence, filled."
