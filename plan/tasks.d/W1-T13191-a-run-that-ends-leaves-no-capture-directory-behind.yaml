  rationale: |
    AMENDED (2026-11-21): files adds test/ci/a-rejected-census-measurement-retains-its-complete-capture.test.ts. The
    fix now removes capture directories with fs.rmdirSync, so that test's cleanup-fault injection must hook rmdirSync
    instead of rmSync (PR #19890).
    COUNTED 2026-11-16 on the operator Mac and the fleet host, by the operator session and the builder of W1-T13146.

    - Before that day's reboot the Mac's temp root held 1,190 `rmd-*` / `remudero-*` entries: 506 `rmd-containment-test-*`, 450 `rmd-census-capture-*`, 63 `rmd-cow-wt-*` and others. The reboot emptied it. Seventy minutes later it held 234: 110 `rmd-containment-test-*`, 100 `rmd-census-capture-*`. So the leak runs at about three entries a minute while author preflights run.
    - The fleet host's /tmp held 140 the same day, 31 of them `rmd-census-capture-*`.
    - The containment suite's share of that count is W1-T13194; this task is the precheck's captures.
    - A janitor for such leftovers on a Mac exists (W1-T12257, merged that day), with an age window; on the operator Mac the installed copy dated from 2026-11-11 and did not yet carry it.
    - READ scripts/census-precheck.mjs: `runCensusChild` makes `rmd-census-capture-*` per child; a complete capture goes through `completeCensusCapture`, a failed custody read through `retainFixture`. Which of the two the 100 leftovers came from is not known.
    - Each leftover is small, but every beat measures each one (W1-T13190), and on the Mac that made one suite take 179 s and stopped four author preflights at the census bound (W1-T13146, W1-T13189).
  design: |
    MEASURE FIRST: on the Mac, list the `rmd-census-capture-*` leftovers with what each holds (a complete result, a stop, a rejection) and say which path left them; do the same for the `rmd-cow-wt-*` entries and name their producer. Put the counts in the PR body. A producer found here that is outside this task's files is reported, not changed.

    1. census-precheck.mjs: a complete capture's directory is removed once its result is read; the stopped, rejected and custody-unknown cases keep theirs, as today.
    2. The new suite drives the capture path with an injected child through each of the three endings and counts the directories under a temp root of its own.
    INVARIANT evidence-of-a-stopped-run-is-kept: nothing retained on purpose is removed, and nothing is removed by name pattern across the temp root.
    NOT IN SCOPE: a reaper for old leftovers (the test setup's dead-owner reaper is the place for one; report whether its prefix list covers these names); the beat's cost (W1-T13190).
  falsifier: |
    Keep a complete capture and criterion 1 must fail. Drop a stopped or rejected one, or keep two, and criterion 2 must fail. Remove a retained capture, or remove by pattern across the temp root, and criterion 3 must fail. Restore and all pass.
  note: |
    reservation hand-off: run-unfiled-1794841356902 -> run-unfiled-1794841356902
