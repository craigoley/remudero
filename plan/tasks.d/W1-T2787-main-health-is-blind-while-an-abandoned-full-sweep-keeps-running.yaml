  rationale: |
    OBSERVED on the Azure ledger during DAEMON-1788456619440: the full sweep began while main
    was still green, then origin/main advanced to red sha 990b1e98. Signed `check_run:completed`
    and `status` deliveries continued reaching Serve, and the daemon emitted
    `github.wake.check_settled`, followed by `daemon.sweep.retriggered` and
    `daemon.sweep.skipped_concurrent` because the earlier sweep was still executing. No later
    `main.health.observed` row judged 990b1e98 during that interval.

    The source explains the measurement. `buildSweepHook` invokes `mainHealthRung` only inside
    the full-sweep closure. `runGatedSweep` returns at its earlier `liveness.inFlight` guard, so
    the event wake that most needs the observer never reaches it. W1-T2656 correctly preserves
    the durable wake for a later accepted sweep, but preservation is not timely observation: a
    legitimate long worker or proof run can keep the prior sweep alive for tens of minutes.

    FALSIFYING evidence would be a `main.health.observed` row for the new red sha between a
    `github.wake.check_settled` row and the matching concurrency refusal, without an accepted
    full sweep. The live ledger contains the settle and refusal but no such observation.
  design: |
    Keep the observer daemon-side. Serve remains a signed, bounded marker writer and performs no
    GitHub reads. Add one optional callback at the daemon-side check/status burst settlement seam
    in `wireSweepWakeToDaemon`; invoke the SAME `buildMainHealthRung` closure that the ordinary
    full sweep already uses. A settled GitHub check/status burst can then observe default-branch
    health independently of the full-sweep liveness mutex, while structural PR events retain
    their current wake-only behavior.

    The shared observer must be single-flight and briefly fresh-cached using the already-resolved
    `githubEventWake.checkSettleMs` policy value. The event callback and the immediately awakened
    full sweep therefore share one read rather than doubling GitHub calls. A failed read is not
    cached: the normal full sweep may retry, and every error remains named and fail-soft.

    Do not add a Serve token, Serve polling, a second main-health decision, an auto-revert, a
    queue pause, or a lifecycle action. The existing `mainHealthFromRollup`, escalation, dedup,
    and automatic resolution rules remain the only decision path.
  acceptance:
    - claim: "a settled check/status webhook burst invokes main-health observation even while the ordinary full sweep is still in flight and therefore refuses its wake"
      proof: "integration test: test/main-health-event-wake.test.ts"
    - claim: "the event callback and the immediately awakened ordinary full sweep share one observer read, so the new path does not double GitHub API spend"
      proof: "unit/integration test: test/main-health-event-wake.test.ts"
    - claim: "Serve still performs zero GitHub reads and structural pull-request wakes do not invoke the main-health observer"
      proof: "unit test: test/main-health-event-wake.test.ts"
    - claim: "observer failures are not cached or propagated, so the ordinary full sweep can retry and PR reconciliation remains live"
      proof: "unit test: test/main-health-event-wake.test.ts"
  falsifier: |
    Hold the full-sweep liveness flag true, deliver and settle a signed check/status wake for a
    newly red main sha, and do not allow an accepted full sweep. Before the fix there is no
    `main.health.observed` call. After the fix exactly one daemon-side observation occurs; a
    structural pull-request wake still produces zero observations. Then release the sweep and
    invoke the ordinary observer within the settlement freshness window: the GitHub fetch count
    must remain unchanged. Make the first observation throw and invoke the ordinary path: it must
    fetch again and neither error may escape.
  note: |
