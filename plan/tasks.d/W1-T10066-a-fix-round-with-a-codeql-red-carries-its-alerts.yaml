- id: W1-T10066
  title: "A FIX ROUND WHOSE RED INCLUDES A FAILED CODEQL CHECK CARRIES THE HEAD'S ALERTS, NOT A BLANK ENTRY — on 2026-10-17 #12570's ordinary fix rounds at 12:27Z and 13:45Z were sent ci_failures whose `CodeQL` member had signature null and excerpt null while the head's alert #429 (js/file-system-race, src/lib/test-slot-mutation.ts:239) was already read; the worker and the progress judge acted only on the members that had text (coverage-ratchet), and each round changed only a test file"
  repo: remudero
  depends_on: [W1-T10065]  # same file (src/lib/sweep.ts) as W1-T10065; serialize, never parallel
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern, the evidence a failed CodeQL check contributes to an ordinary fix round when the head's alerts are already read; the code-scanning judge, its own fix path, the hydration and the policy are unchanged
  band_meaning: span
  origin: "operator session 2026-10-17 filing agent F17 item 2, from the hand fix of #12570 (X1, 16:40-17:48Z)"
  plan_refs: [W1-T5633, W1-T9731, W1-T9297, W1-T9928, W1-T10065]
  files:
    - src/lib/sweep.ts
    - src/lib/tick-read-worker.ts
    - test/a-fix-round-with-a-codeql-red-carries-its-alerts.test.ts
  status: merged
  priority: 1  # a round sent to fix a source alert with no alert text can only fix the other members, so the alert outlives every round
  attempts: 0
  rationale: |
    OBSERVED on the core ledger (12:49Z and 14:46Z archives, read-only, niced, streamed to the Mac), #12570 (W1-T9928):
    - fix.dispatch 12:27:10Z (head a4f26f8c1) ci_failures: rule-checks, coverage-shard (4/8), coverage-shard (3/8)
      with excerpts, then `{"check":"CodeQL","signature":null,"excerpt":null,"tail_source":null}`, Scan, and
      security-merge-policy with null excerpts. The diff it produced touched two test files.
    - fix.dispatch 13:45:03Z (head d898a9592) ci_failures: coverage-ratchet (diff-coverage excerpt) and the same bare
      `CodeQL` entry. The round changed one test file (172 insertions).
    - fix.progress_judged rows at those heads carried red_class `CodeQL+Scan+coverage-ratchet+...` and reasoned "The
      active red is coverage-ratchet" (13:40:41Z): only that member had evidence. The judge does not choose what the
      worker edits; the worker is given every ci_failure, and the CodeQL one said nothing.
    - The alert was known: sweep.disposed rows from 14:17Z name "alert #429 js/file-system-race at
      src/lib/test-slot-mutation.ts:239: The file may have changed since it was checked." (W1-T9731's hold).
    READ at origin/main 70b15edf7 (symbols, not lines):
    - src/lib/tick-read-worker.ts hydrates `codeqlHeadAlerts` for a head whose `CodeQL` check failed
      (`codeqlAlertsReadDue`, W1-T5633/W1-T9731), and builds `ciFailuresByPr` from the check rollup and job logs; the
      `CodeQL` results check has no job log, so its entry has no tail.
    - src/lib/sweep.ts uses the alerts only in `codeScanningGateForHead` on the `mergeable` arm
      (`codeScanningFixCiFailures`). A blocked-fixable PR with other reds never reaches it, so its rounds get the bare
      entry.
    WHY THIS IS NOT ANOTHER TASK: W1-T5633/W1-T9731 (merged) handle a head that is otherwise mergeable. W1-T9297
    (queued) gives the progress JUDGE the red's evidence; this gives the WORKER's dispatch the alert, which the judge
    input would then also carry. W1-T10065 stops the code-scanning round being swapped for a base refresh. Swept
    origin/main plan/tasks.d for codeqlHeadAlerts, codeScanningFixCiFailures, "CodeQL alert #" and code-scanning
    alert, and the 3 open PR heads (18:26Z): none.
  design: |
    1. Where the fix dispatch's ci-log evidence for a PR is assembled, a failed `CodeQL` check is replaced by one entry
       per alert in `pr.codeqlHeadAlerts` read at THIS head: name `CodeQL alert #<n> (<rule>)`, and a logTail carrying
       rule, severity, path:line and message under the existing UNTRUSTED SCANNER EVW1-T10067NCE label, with the existing
       instruction not to dismiss alerts or add suppression comments. Reuse the line builder `codeScanningFixCiFailures`
       uses; do not write a second copy.
    2. Alerts read at another head, or unread, leave an entry whose tail SAYS so ("CodeQL failed at this head; its
       alerts were not read: <why>"), never a null tail.
    3. The `fix.dispatch` row's ci_failures then show the alert names, so the progress judge's red set and the ledger
       name the alert, not the bare check.
    4. TESTS in test/a-fix-round-with-a-codeql-red-carries-its-alerts.test.ts, `test(` titles verbatim as in the
       proofs: #12570's 13:45Z shape (coverage-ratchet plus a failed CodeQL check, one high alert read at the head)
       dispatches evidence naming alert 429, its path:line and message; alerts read at an older head give the
       "not read" tail; a PR with no CodeQL failure is unchanged (control).
  acceptance:
    - claim: "a fix round whose red includes a failed CodeQL check is sent the head's alerts by number, rule and location"
      proof: 'grep: test("W1-T10066: a mixed red with a failed CodeQL check dispatches the head alerts" in test/a-fix-round-with-a-codeql-red-carries-its-alerts.test.ts'
    - claim: "a CodeQL failure whose alerts were not read at this head says so instead of a blank entry"
      proof: 'grep: test("W1-T10066: unread alerts give a CodeQL entry that says they were not read" in test/a-fix-round-with-a-codeql-red-carries-its-alerts.test.ts'
  falsifier: |
    At origin/main the 13:45Z shape dispatches ci_failures whose CodeQL member has no logTail, so the first test fails.
    Dropping the "not read" tail fails the second. Deleting the fix gives `# fail N`, restoring it `# fail 0`.
  note: |
    Shares src/lib/sweep.ts with W1-T10065 (a different function, decideRedBaseRefresh); build them in either order, not in
