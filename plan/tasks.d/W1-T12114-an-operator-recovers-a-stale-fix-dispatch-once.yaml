  rationale: |
    ORIGIN: architect create run PLAN-create-1794328578391 (2026-11-10). This is the effect half of the
    stale-fix-dispatch recovery: W1-T12113 decides, this verb gathers, preserves and records, W1-T12115 reads.
    READ in this worktree:
    - `pr-owner` is a read-only verb: it is in READ_ONLY_FRESHNESS_EXEMPT_VERBS (src/run-task.ts ~42860) and is an
      allowed precondition read (src/lib/plan.ts ~253). A verb that writes must not inherit either exemption, so
      recovery is a separate verb, `pr-owner-recover`, registered beside it (~42330 and ~43252).
    - The fix branch claim is an O_EXCL inflight lock keyed by fixBranchClaimKey (src/run-task.ts ~31900; W1-T2609
      closed the concurrent-dispatch race with it). Holding that claim for the length of the verb means no fix
      round can start on the PR mid-recovery, and a second apply loses the same race a second dispatch would.
    - Preservation already exists: preserveTrackedDirtyPatch and the fix-owner recovery arms (W1-T6362, W1-T7719)
      write immutable refs/rmd-recovery commits, and publishRecoveryRefs (src/lib/recovery-refs.ts) pushes them
      create-only. A name origin holds at another sha is a conflict, never an overwrite. That conflict is
      preservation_failed here.
    - Decision-relevant steps must be in DECISION_RELEVANT_LEDGER_STEPS (src/lib/ledger.ts ~549; W1-T8621) or a
      rotation can drop the receipt and make the PR OWNED again.
    Settled by lookup: is this already filed or already decided? -> No. No verb, step or shard releases fix.dispatch
      ownership (grep of src for pr-owner and of plan/tasks.d for recovery receipt; W1-T4209, W1-T6362, W1-T11751
      read in W1-T12113's rationale).
    Settled by lookup: what may clear a human-held state? -> Only a matching operator receipt; a machine cannot
      reapprove, and unreadable history is a hold (src/lib/operator-release.ts qualifyReleaseEvidence). The
      authorization record follows that rule. Its actor must not satisfy isFleetAutomationActor
      (src/lib/operator-interventions.ts).
    Settled by lookup: does the darwin host have a cwd census? -> Not yet. It answers unknown until W1-T11753 lands,
      so on the Mac host apply holds with cwd_unknown. That is the intended fail-closed result. No dependency is
      added.
  design: |
    1. src/lib/stale-fix-dispatch-recovery-apply.ts (new). All I/O goes through injected ports: ledger read
       (readPrOwnerLedgerProjection plus the run's rows), PR read (head, base, branch, repo through the existing gh
       broker read), inflight lock read, isHolderStale, a descendant census over the recorded pid (the /proc ppid
       walk readProcessCwdCensus already performs), readProcessCwdCensus on the run's worktree, the
       refs/rmd-dispatch claim read, fix branch claim acquire and release, the preservation arm and recovery ref
       publisher, a create-only file writer, and the ledger append.
    2. --authorize: validate every flag (full-hex head and base; obtain the actor with rmd gh -- api user, then require rmd gh -- api repos/{owner}/{repo}/collaborators/{login}/permission to report admin for this exact repo; unreadable or non-admin is a refusal with no authorization row. The PR number must be the one in the newest
       fix.dispatch row's pr_url, or that row's task's sweep join). Read the live PR tuple before choosing the claim key; require the supplied --branch to equal the PR's observed canonical head branch, then derive the claim key only from that verified branch. Acquire the same per-PR fix branch O_EXCL claim used by apply, with a fresh authorization invocation run_id shaped as PR-OWNER-AUTH:<tuple_hash>:<nonce>. Use the strict stale-claim comparison described in the apply step: reclaim only a valid exact prior dispatch holder or a dead same-host authorization holder for this tuple; never reclaim malformed, foreign-host, mismatched or unknown locks. Acquire before reading authorization or release history. Re-read the PR tuple, newest dispatch, auth rows, and release history under the claim; recheck admin permission for the same authenticated login immediately before append. Refuse without a row if claim acquisition fails, if an unconsumed authorization already exists, if a valid release exists, or if any evidence is unreadable. Append pr_owner.recovery_authorized {authorization_id = sha256(tuple, actor, ts), the tuple, actor, reason, ts} while holding the claim, then release it in finally. After a held apply, reuse its still-unconsumed authorization. Concurrent authorization and apply operations serialize on this claim.
    3. --apply --authorization <id>, in this order:
       a. Read the authorization row only to derive the candidate tuple hash and recovery_id; do not make a decision from this unlocked read, and verify the complete row again under the claim. Acquire the same fix branch claim with a fresh recovery invocation run_id shaped as PR-OWNER-RECOVER:<recovery_id>:<nonce>. If absent, create with O_EXCL. If occupied, strictly parse it and permit reclaim only for the exact prior dispatch run_id, a dead same-host matching recovery invocation for this recovery_id, or a dead same-host authorization invocation for this tuple hash. For a prior dispatch holder, derive the expected stored lock run_id using the production `fixRoundClaimId(priorDispatch.run_id, prNumber, priorLock.startedAt)` helper and require exact equality; never use a broad prefix match. This explicitly maps the dispatch run_id to the existing composite branch-lock identity. Test with real helper output for the same dispatch, another round, another PR and another timestamp. Then prove original pid dead (a live or reused pid holds), descendants absent and cwd census clear before compare-and-reclaim. Call reclaimStaleLock with a strict predicate that rejects malformed, foreign-host, changed-run and unknown holders. Because reclaimStaleLock treats a null parse as reclaimable, map malformed bytes to a non-stale sentinel so they are held; use its inode-plus-raw-bytes delete check and capture the reclaimed holder. Then win a fresh O_EXCL create; any competing create is re-read and judged, never unlinked by pathname. If acquisition fails, do not append a durable held receipt: return a transient branch_claim_held result without consuming authorization or changing the pr-owner projection, then re-read authorization and receipt history; if the matching release now exists, return that receipt. A waiter must never append a held row after a winner's release, because T12115 correctly treats a later/equal hold as unresolved.
       b. Under the claim, read the authorization. If it is missing, duplicated, unreadable, already consumed, or names a different tuple, refuse without writing. If one valid released receipt already matches this exact dispatch, return that receipt without writing; if release history conflicts, hold. The claim serializes this read with concurrent authorization and apply operations.
       c. First read of all facts, read back the acquired claim and pass its exact stored run_id as recoveryInvocationRunId, then call decideStaleFixDispatchRecovery. The decision may accept only this exact claim run_id; every other held claim is a competitor. Before writing a held receipt, check for the canonical recovery file. If it exists, append no hold row: validate and replay the exact stored release only when current evidence decides recover; otherwise return transient UNKNOWN so a later replay cannot be poisoned by a newer hold.
       d. Preserve: run the existing preservation for the worktree (dirty, untracked, ahead or diverged) and
          publish create-only. If the tree is clean and its head is contained in the PR head, record
          nothing_to_preserve. Never reset, remove or prune.
       e. Second read of all facts with the preservation result, then decide again. Any change from (c), or a hold,
          writes a held receipt. Before release, require the live nowIso to be strictly later than the prior dispatch
          and every matching held receipt regardless of authorization_id. If the clock is tied or behind, do not
          create a released file or row; retain the authorization and return receipt_time_not_after_prior_evidence
          so a later retry can succeed only after real time advances.
       f. Recover: inspect <stateDir>/pr-owner-recoveries/<recovery_id>.json before any durable hold or release write. If absent, after the second live read decides recover, create it with flag "wx" and mode 0600 in an owner-only mode 0700 directory, then append the released ledger row. If present, validate file type/owner/mode, canonical bytes and exact authorized identity. A matching released file with no ledger row is replayed byte-for-byte only when the second live read still decides recover; if current evidence is held or unknown, return transient receipt_replay_pending and append no held row. A malformed, mismatched, unreadable or permission-mismatched file returns UNKNOWN and is never overwritten. An identical ledger receipt is an idempotent no-op; conflicting rows hold.
       g. Release the fix branch claim in finally.
       Held receipts are ledger rows only (pr_owner.recovery_receipt, outcome held) and never create the file. A later fully matching released receipt may supersede older held rows only by strict timestamp order; T12115 keeps ownership held or unknown for a later/equal hold or any conflict.
    4. Add pr_owner.recovery_authorized and pr_owner.recovery_receipt to DECISION_RELEVANT_LEDGER_STEPS. W1-T12047 owns the same ledger file, so this task depends on it and cannot overlap its rotation-list edit.
    5. Register `pr-owner-recover` in the command table and USAGE. Do not add it to
       READ_ONLY_FRESHNESS_EXEMPT_VERBS or to the plan precondition allow-list.
    6. Tests use injected ports and temp dirs, and remove them in finally:
       - authorize then apply releases;
       - a fleet actor is refused;
       - a non-admin identity, an unreadable identity lookup, an unreadable permission lookup and a permission revoked before the under-lock append each refuse without writing an authorization row;
       - --authorize derives its branch claim key from the verified live PR branch and rejects a supplied branch mismatch before acquiring a branch-keyed claim;
       - stale branch-lock reclaim accepts only the exact production `fixRoundClaimId` for the prior dispatch, PR and timestamp; output for another round, PR or timestamp holds;
       - a mismatched flag per identity field holds;
       - a head push, a newer fix.dispatch, a claim appearing and a pid becoming live between reads each hold;
       - a live, unknown and dead pid, and a live descendant;
       - a stale matching fix.dispatch lock is compare-and-reclaimed only after same-host dead original pid, no descendant and clear cwd proof; live, reused, foreign-host, malformed, changed-run and unknown lock evidence holds;
       - a stale prior recovery lock is reclaimed only for this recovery_id with same-host liveness and exact inode/raw-byte checks; unrelated stale claims hold;
       - a publish conflict holds;
       - two applies racing on one claim produce exactly one released receipt; the loser appends no held row before or after release and returns the existing release if present;
       - two --authorize calls race for one tuple: exactly one appends an unconsumed authorization and the other refuses; authorize racing with release cannot append an authorization after release;
       - tied or backwards nowIso relative to the dispatch or any matching hold writes no released file or row, keeps authorization reusable, and succeeds only when a later real timestamp is observed;
       - a canonical release file with no ledger row, an unknown retry, then a valid retry replays identical bytes and is not poisoned by a later held row;
       - a repeated apply is a no-op;
       - crash completion;
       - a plan-only PR fixture;
       - a recorded-argv check that no destructive git verb ran and no fix.done row was appended.

  falsifier: |
    Skip the second read (e): the "head pushed between reads" fixture releases and the test fails. Drop the fix
    branch claim acquire: two authorizations both append, or authorize appends after release. Allow a release at a
    tied/backwards timestamp: the reader cannot order it after the dispatch/hold and keeps ownership unresolved.
    Append a held receipt after a failed claim acquire: the schedule where the loser observes the winner's claim,
    then appends after the winner's release makes pr-owner OWNED and the race test fails. Write held receipts to
    the receipt file: a held attempt blocks the later valid release and the crash-completion case fails.
