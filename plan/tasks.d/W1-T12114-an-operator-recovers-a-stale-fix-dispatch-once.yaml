    - claim: "`rmd pr-owner-recover <pr> --authorize` with --repo, --task, --run, --round, --head, --base, --branch and --reason records one pr_owner.recovery_authorized row only after the authenticated login has admin permission on the exact repository; the row names that tuple, login and authorization_id. Authorization acquires the same per-PR O_EXCL fix-branch claim used by apply and may compare-and-reclaim only the exact same-host dead prior dispatch lock or this tuple's dead authorization lock; it then re-reads authorization and release history under the claim; concurrent authorize calls cannot create two unconsumed rows, and authorize racing with release cannot append after the release. It refuses a second unconsumed authorization for the same dispatch and refuses new authorization after a valid release; after a hold the operator reuses the existing authorization. Any failed or unreadable identity or permission lookup refuses without writing; tests prove non-admin, identity lookup failure, permission lookup failure, and permission revocation before the locked append each leave no authorization row; a fleet-automation actor is refused; `--apply --authorization <id>` rechecks admin permission and refuses unless exactly one unconsumed authorization names the same tuple and the same authenticated login. If a valid released receipt already matches that exact dispatch, apply returns the existing receipt without writing another, regardless of authorization; conflicting release history holds"
