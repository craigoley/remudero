    ── CORROBORATION ON DISK AND IN THE BURST SHAPE ──────────────────────────────────────────

    BOTH BRANCHES OF `perRunWorkerHomeDir` ARE LIVE RIGHT NOW. The config root holds three worker
    homes: two named by UUID (`worker-home-19a95c78-...`, `worker-home-1acbb8f0-...`, the
    no-runId branch) and one named by run (`worker-home-DAEMON-1787887636875`, the runId branch).

    THAT DAEMON-NAMED HOME IS THE EXHIBIT. Its mtime is 2026-08-28 04:31:56.241Z. The LAST child
    SIGKILL on that same run is 2026-08-28T04:31:48.923Z — the directory was written 7.3 SECONDS
    AFTER the kill, and it still holds the child's whole HOME: `.claude/`, `.claude.json`,
    `.gitconfig`, `.bashrc`, `.cache`. Something was still using it after a sibling died in it.

    THE KILLS BURST. The tightest three-kill window on a single `run_id` is 721 MILLISECONDS —
    `DAEMON-1787921830251`, 13:25:16.140Z to 13:25:16.861Z. No per-worker OOM and no per-worker
    deadline produces three deaths inside three quarters of a second; a single shared resource
    disappearing underneath all three does.

    ── THE FALSIFIER IS UNCLOSED, AND THAT IS WHY THE FIRST BUILD IS INSTRUMENTATION ──────────

    THE FALSIFIER: a `worker-home-DAEMON-<runid>` removal OBSERVED racing a live sibling spawn —
    a reap and a still-running child on the same path, both timestamped. Everything above is
    consistent with it and none of it IS it.

    IT IS NOT CHECKABLE TODAY, for two reasons that are themselves the work:
      (i)  `reapWorkerHome` ALREADY COMPUTES the answer. worker-home.ts:573 declares
           `WorkerHomeReapResult` as `{reaped, target, reason}` and worker-home.ts:587 returns it
           populated on all four arms — `guard-rejected`, `absent`, reaped-true, and a caught
           error. src/lib/worker.ts:1178 CALLS IT IN STATEMENT POSITION AND DISCARDS THE RESULT.
           `grep -acE "=\s*reapWorkerHome\(" src/lib/worker.ts` reads 0: nothing anywhere assigns
           it. The one fact needed — WHICH path was removed, WHEN, and by which spawn — is
           computed and thrown away.
      (ii) The daemon's own stdout is not on disk. `state/logs/daemon.out.log` does not exist at
           the config root, so there is no second surface to reconstruct it from.

    SO THE FIRST BUILD IS INSTRUMENTATION, NOT THE FIX. Surface the discarded
    `WorkerHomeReapResult` at the call site and make the reap observable with its target, its
    reason and its spawn identity. Then the falsifier becomes a query rather than a guess.

    ⚠ DO NOT SHIP THE REMEDY IN THIS TASK. Do not make the home unique again, do not add locking,
    and do not refcount spawns. A defect fix shipped inside instrumentation destroys the evidence
    that would have proved it was the right fix — and the operator has NOT RULED on the remedy.
    The instrumentation must leave the defect firing.

    ── OWNED ELSEWHERE, SO THIS TASK DOES NOT CLAIM IT ────────────────────────────────────────

    The spawn marker (`runId`/`taskId` on `fixArgs`) is W1-T2261's and stays as it is. The orphan
    sweep is W1-T2407's: `worker_orphan_killed` reads 3 rows ALL-TIME and each lands AFTER its own
    run's kills, so it is sweeping debris rather than causing it. The other two failure classes
    inside `sweep.fix.error` — the GraphQL rate-limit refusal and the rest — are their own task and
    are not in scope here.

    RISK BAND. `risk: high` is set UP FRONT and the band is RULE 19'S SPAN, NOT BLAST RADIUS: the
