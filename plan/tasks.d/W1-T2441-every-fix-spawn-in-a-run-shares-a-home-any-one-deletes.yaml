    ── THE DEFECT, BY SYMBOL ──────────────────────────────────────────────────────────────────

    (1) `spawnWorker` DECLARES the invariant this breaks, in its own doc at src/lib/worker.ts:920:
    "`env.home` -> a worker-home dir UNIQUE to this call (W1-T170: `perRunWorkerHomeDir`,
    preferring `args.runId` when supplied), materialized fresh and reaped in a `finally`
    regardless of outcome — the pre-W1-T170 singleton `<root>/worker-home` does not survive two
    overlapping spawns (WS-2)." UNIQUE TO THIS CALL is the property that is now false.

    (2) `perRunWorkerHomeDir` (src/lib/worker-home.ts:549) returns `${workerHomeRoot}-${id}` where
    `id` is `runId` when non-empty and a fresh `randomUUID()` otherwise. Keyed on the RUN, the
    directory is unique per run — not per call. Two fix spawns inside one daemon run receive the
    SAME path.

    (3) src/lib/worker.ts:952 binds it: `const workerHome = perRunWorkerHomeDir(workerHomeRoot,
    args.runId);` — and src/lib/worker.ts:1178, inside the outer `finally`, runs
    `reapWorkerHome(workerHomeRoot, workerHome);`, which `rmSync(target, {recursive: true, force:
    true})`s the directory (worker-home.ts:587). The comment above it says the reap covers "every
    exit path, including a thrown error", which is exactly the property that makes this fire: the
    FIRST sibling to finish, for any reason, deletes the home the others are still living in.

    (4) `fixArgs` (src/run-task.ts:7756) began supplying `runId: opts.runId` at src/run-task.ts:7779
    in commit 51db5367 (#2862, W1-T2261, merged 2026-08-25T18:58:53Z). That commit's purpose was
    the reclaim marker, not the home; the home change is a downstream consequence of the same
    field. BEFORE it, `args.runId` was absent on this path and the `randomUUID()` branch gave every
    spawn its own directory, satisfying the invariant by accident.

