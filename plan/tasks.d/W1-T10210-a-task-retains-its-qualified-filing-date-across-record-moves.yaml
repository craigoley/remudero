    In a private committed variant, remove only the production record-history resolution while
    leaving every fixture/assertion, old unknown-versus-zero adapter, lifetime fallback and policy
    code intact. The embedded/move/rename regressions must fail for their intended assertions;
    unknown/zero/fallback/provenance/age-band controls must still execute and pass. Restore the fix
    and require actual physical paths/titles and TAP tests/fail summaries on the exact tree.
    Setup/import errors, a missing-path wrapper, no summary, capacity refusal or static reports
