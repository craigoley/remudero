  plan_refs: ["W1-T2748", "W1-T3727"]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED ON THE LIVE CONSOLE FLEET, 2026-09-19. The API-T28 implementation PR #455 failed
    semantic review only because two acceptance-proof titles differed from the task's literal
    titles. Its fix rung selected Codex with a non-empty resume session. The transcript records:

        Blocked by round sandbox: filesystem is read-only and apply_patch was rejected.
        needed fix only in tests/unit/repo-dashboard-route.test.ts.
        rerun with write access.

    The requested fix surface was not read-only: `runFixRung` passes `permissionMode:
    "bypassPermissions"` and `FIX_WORKER_TOOLS` includes Read, Write, Edit, Grep, Glob and Bash.
    `codexExecArgs` in `src/lib/worker-provider.ts` correctly constructs fresh writable workers
    with `exec --sandbox workspace-write`, `-C <cwd>`, and bounded Git writable roots. But its
    early `resumeSessionId` return constructs `exec resume ...` before that fresh-worker path, so
    it sends none of those containment arguments.

    The pinned production CLI is `codex-cli 0.152.0`. Its live `codex exec --help` advertises
    `--sandbox`, `-C`, and `--add-dir`; its `codex exec resume --help` advertises none of them.
    Official OpenAI Codex documentation confirms that `codex exec` defaults to read-only unless
    `--sandbox workspace-write` is selected. Thus the adapter has no way to make a resumptive
    process honor the caller's write-capable request, even though it has the evidence needed to
    make a fresh, bounded one.

    HYPOTHESIS BOUNDARY: persistent session state may explain the exact observed read-only error,
    but it cannot make the adapter's omitted write/cwd/root arguments safe. The live transcript
    falsifies the weaker claim that the existing resume form performs the requested repair.

    This is a fleet ROI defect: it turns mechanically small acceptance repairs into stalled PRs
    precisely when provider capacity is available. It must not be solved with an unrestricted
    sandbox or a wider filesystem boundary.
  design: |
    When a Codex call has `resumeSessionId` and a write-capable tool surface, deliberately start a
    fresh `codex exec` invocation through the existing fresh-worker argv path. That preserves the
    ordinary `workspace-write` sandbox, requested cwd, and bounded Git writable roots. The fix
    prompt already includes the task, review evidence, and predecessor transcript; it does not
    rely on hidden session context.

    Preserve `exec resume` byte-for-byte for read-only continuations, including the disposable
    reviewer path fixed by W1-T2748. Keep a write-capable worker outside a permitted Git
    worktree fail-closed. Never substitute `dangerously-bypass-approvals-and-sandbox`, an
    external sandbox, or an unbounded writable root. Unit-drive the adapter argv with the real
    capability classification; do not spend a paid model call in CI.

    FILES NOTE (W1-T3730): the build adds its new test file after this filing. It is omitted here
    so the plan-only PR cannot claim to resolve a future unit-test filename.
  acceptance:
    - claim: "a write-capable Codex worker carrying a resume session uses the ordinary fresh workspace-write invocation rather than exec resume"
      proof: "unit test: W1-T3792: writable Codex resume retains workspace-write sandbox"
    - claim: "the same write-capable invocation retains its requested cwd and bounded Git writable roots"
      proof: "unit test: W1-T3792: writable Codex resume keeps fresh containment roots"
    - claim: "read-only resumed reviewers remain on exec resume and a write-capable non-repository worker remains fail-closed"
      proof: "unit test: W1-T3792: Codex resume preserves read-only and non-repository boundaries"
  falsifier: |
    Restore the early `resumeSessionId` return for a write-capable request. The first two tests
    must fail because argv again contains `exec resume` and lacks the fresh workspace-write,
    cwd, and bounded-root configuration. Restore the implementation and require all three tests
    to pass. If a non-repository write-capable request starts instead of refusing, the third test
    must fail.
