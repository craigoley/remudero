  depends_on: []
  priority: 0.9
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the reading that decides whether Claude is eligible for every worker; a wrong reading must never read as headroom
  band_meaning: blast-radius
  origin: operator-session#model-choice-2026-11-10
  plan_refs:
    - W1-T11072
    - W1-T417
  files:
    - src/lib/headroom.ts
    - src/run-task.ts
    - test/routing/the-usage-probe-reads-the-current-usage-output.test.ts
    - src/lib/daemon.ts
