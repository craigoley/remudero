  rationale: |
    MEASURED 2026-09-24 over the fix.done rows since 2026-09-23T15:59Z: 62 of 65 fix rounds ended commit_refused ($73.51). Reasons: 37 missing COMMIT_MESSAGE line and 9 regenerable-baseline edits refused (both W1-T4450), 12 'the worker changed nothing', 8 'the task declares no files'.
    OBSERVED: #6807, #6804, #6803 ($9.55) and #6879 (lint-plan reds) made real edits with valid COMMIT_MESSAGE lines,
    discarded as "the task declares no files"; #6836 (unfiled) and #6905 (RETRO) staged merges that were discarded; #6916
    (W1-T4413) went synthetic because the sweep's plan snapshot predated the shard's filing (#6910). W1-T4351's gate
    (sweep.ts, isBlockedCi) covers plan filings at a red, not merge conflicts or stale snapshots. sweep.fix.synthetic_task and
    daemon.plan_reloaded have zero rows in the live ledger, so these causes were invisible.
  design: |
    (i) fixRungTaskFor gives a synthetic task the PR's own changed paths as its surface (for RETRO / PLAN / APPROVE / unfiled
    PRs), so an edit inside the PR's footprint commits. (ii) When a PR's task id is not in the plan snapshot, the plan is
    re-read once before falling back to a synthetic task. (iii) The W1-T4351 no-dispatch gate also covers a merge conflict on a
    synthetic task with no derivable surface. (iv) The two step names above reach the ledger (register them where the step
    allowlist requires it) so the next diagnosis can see them.
  acceptance:
