  title: "THE CI FIX ARM ACTS ON ITS FRESH ROLLUP, NOT A RED IT READ 48 MINUTES EARLIER — runSweep's blocked-fixable arm reads a fresh rollup (`readCiGateRollup`) but consults it only for `staleCiGateTransition`, then re-queues `pr.cancelledRequiredChecks` and dispatches on `pr.ciFailures` from the pass snapshot: on #9124 a pass clocked 16:57:27Z re-ran a superseded run's cancelled ci-gate and spent strike 1/2 on coverage-ratchet, green since 17:24Z"
