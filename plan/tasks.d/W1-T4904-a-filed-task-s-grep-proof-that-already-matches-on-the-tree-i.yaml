  rationale: |
    MEASURED 2026-09-30 at origin/main 074249863; nothing here is carried from an earlier session.

    (1) THE DEFECT. W1-T4550's fifth criterion was `grep: a target is never re-derived from a bare repo name lacking
    its owner in plan/tasks.d/W1-T3529-run-review-evidence-target.yaml` — text that is present and unchanged in the
    target, so `proof-discrimination` (a proof must FAIL at the merge base and PASS at head) could never pass it, and
    its row in scripts/proof-discrimination-baseline.json is 0. Replayed at the filing commit ad7596980 with the
    reviewer's own invocation `grep -arn -- <pattern> <path>`: criteria 1-4 exit 1 with 0 hits, criterion 5 exits 0
    with 1 hit. `rmd check-proof '<proof>' --base HEAD` at that tree prints `executed_stale`, exit 5. The fix cost a
    build PR (#7882) that could not go green plus an operator amendment (#7894).

    (2) LINT-PLAN SAW NOTHING. `rmd lint-plan --base ad7596980^` on that same filing reports 3 tasks checked, 0 failing,
    2 warnings, both `sizing` on other tasks. `proofGrepUnmatchableViolations` and `proofGrepSelfCertifyingViolations`
    (src/lib/task-linter.ts) read the target's text and call classifyGrepZeroHit, but stay silent on `matched` by
    design ("already matching today (`executed_stale`'s business, W1-T273)"). The gate that owns that business first
    sees a shard's proofs on the BUILD pull request, because criteriaForReview resolves them from the trailer there.

    (3) THE POPULATION. 899 first-parent commits since 2026-09-01 added a plan/tasks.d shard: 1,708 dialect `grep:`
    proofs on 810 tasks, each executed against the tree of its own filing commit. 125 proofs on 68 tasks already
    matched (33 of them a task grepping its own shard's prose, which W1-T4818 addresses). Of the 125 that were later
    built and joined by task and pattern, 15 graded `executed_stale` at build and 1 discriminated. CONTROL: 1,583 of the
    1,708 did not match, and 950 of the 965 that joined a build discriminated. THE OBVIOUS EXEMPTION IS USELESS: 111 of
    the 125 name a file in the task's own `files:`, so a rule "unless files: includes the target" would have stayed
    silent on W1-T4550 as well.

    (4) THE LIVE QUEUE. Of 176 queued tasks carrying a `grep:` proof, 52 already match on main. 43 of those have a
    merged build (status lag, CLAUDE.md "a shard's status: field is not a completion signal"), 2 more merged after the
    merged-PR list was cut (#7925, #7942), 4 are verify: human records, and three unbuilt verify: auto tasks remain — W1-T3547, W1-T3745, W1-T3759 — each of which the gate will
    refuse when built. This task does NOT touch them; it stops the count growing.

    (5) THE ALLOW-LIST ALREADY EXISTS. W1-T4419 shipped `kind: guard` on the gate side
    (scripts/proof-discrimination-gate.mjs skips it for the head-versus-base comparison; review still requires it to
    pass at head). W1-T4550's fifth criterion was exactly a guard — "the rewrite touched only proof lines" — and nobody
    knew to write it as one. The lint must name `kind: guard` in its message. plan.ts does not type the field (its half of
    W1-T4419 never landed), so read it as the gate does: `criterion.kind === "guard"`.
  design: |
    New check `proof-grep-already-true` in src/lib/task-linter.ts, inside lintTask, next to proofBaseDiscriminationViolations.
    For each criterion of a `verify: auto` task that is not `satisfied_by`, not `kind: guard`, and is NEW or has a CHANGED
    proof relative to `opts.baseAcceptance` (criteriaProofChanged / criterionKey; a task with no base record treats every
    criterion as new): parse with parseWhitelistedProof; for a dialect `grep:` whose target exists per
    `opts.readGrepProofFile`, take the file text minus the task's own acceptance block (ownPlanRecordOutsideAcceptance) and
    report when classifyGrepZeroHit(pattern, text) === "matched". Silent on an absent target (a forward reference), on
    `unit test:` proofs (proofBaseDiscriminationViolations owns the path form), on `verify: human`, and on an unchanged
    inherited criterion, so amending an old shard never trips it. SEVERITY: warn everywhere; add the check to
    PLAN_ONLY_NEW_TASK_DIAGNOSTIC_CHECKS so a plan-only filing that INTRODUCES one is refused (W1-T3814's existing
    promotion), and to BUILD_VERIFICATION_CHECKS so a retired record downgrades it. src/run-task.ts sets
    `opts.baseAcceptance` from oldById in the changed-tasks pass, the one place that already wires readGrepProofFile.
    The message names the remedy: re-anchor the pattern on text the build ADDS, or declare `kind: guard` when
    preservation is the point.
  acceptance:
