      proof: 'grep: test("W1-T4904: a grep proof that already matches its target is reported on a new task" in test/a-grep-proof-that-already-matches-is-refused-at-filing.test.ts'
    - claim: "a criterion declared kind guard is not reported as already matching"
      proof: 'grep: test("W1-T4904: a criterion declared kind guard is not reported as already matching" in test/a-grep-proof-that-already-matches-is-refused-at-filing.test.ts'
    - claim: "an unchanged inherited criterion is not reported when an old task is amended"
      proof: 'grep: test("W1-T4904: an unchanged criterion on an amended task is not reported" in test/a-grep-proof-that-already-matches-is-refused-at-filing.test.ts'
    - claim: "a plan-only filing that introduces an already matching grep proof is refused"
      proof: 'grep: test("W1-T4904: a plan-only filing that introduces an already matching grep proof is refused" in test/a-grep-proof-that-already-matches-is-refused-at-filing.test.ts'
  falsifier: |
    Remove the check and a new shard whose grep names text already present in a different record's shard, the W1-T4550
    shape, lints clean again: the first criterion's test then fails.
  note: |
    NOT IN SCOPE: the three live unbuilt tasks above, the 5,368 whole-file `unit test:` proofs grandfathered in
    scripts/proof-discrimination-baseline.json, and any change to the gate or the reviewer. Retiring or repointing those is
    a separate operator amendment. W1-T120 and W1-T3730 share task-linter.ts/run-task.ts as a surface, not a behaviour: the first is
    a read-identity assertion, the second is the filing/test-file declaration rule; this adds one check beside them.
    THE PROOF FORM: the criteria use the `grep: test("..." in <test file>` idiom because W1-T3730 is still open, so a title-form
    `unit test:` proof is refused at filing for a task that declares its own test file. The builder must write the test titles
    with DOUBLE quotes and verbatim — the quote form #7792 tripped on.
