    - claim: "a failing run whose output prints a nested passing TAP summary first, plus a truncated coverage report, exits non-zero with no FLAKE-RETRY-RECOVERED line"
      proof: 'grep: test("W1-T8585: a nested passing summary before a real failure never takes the coverage recovery" in test/a-coverage-recovery-never-greens-a-failing-run.test.ts'
    - claim: "a run whose failing test is named is never recovered by dropping a coverage file, whatever its summary lines say"
      proof: 'grep: test("W1-T8585: a named failing test keeps the run red after a coverage rebuild" in test/a-coverage-recovery-never-greens-a-failing-run.test.ts'
    - claim: "a genuinely all-pass run with a truncated report still sets it aside and exits 0"
      proof: 'grep: test("W1-T8585: an all-pass run with a truncated report still recovers" in test/a-coverage-recovery-never-greens-a-failing-run.test.ts'
  falsifier: |
    Reproduce #11085's shard 8 in a fixture: a test that prints a passing nested TAP summary, a failing test after it, and a
    truncated `coverage-<pid>-<epochMs>-<n>.json` in the raw dir. On main the wrapper prints FLAKE-RETRY-RECOVERED and exits
    0. Restore `count`'s first-match read, and the nested-summary test goes green-exit again. Drop the `firstNames` guard
    and use a fixture whose final summary is mangled, and the named-failure test exits 0.
  note: |
    EFFECT, measured after merge with no fixed pass mark: per PR coverage shard, count FLAKE-RETRY-RECOVERED "dropped
