  rationale: |
    WHY: a fleet fix round added a gate exclusion to a managed repo's PR that its owner had asked it not to touch.
    The operator's rule (doctrine/ci-and-merging/no-unapproved-waivers.md) is that no advisory ignore, scanner
    exclusion, baseline row or other gate loosening lands without the operator's explicit yes, and that a
    session reads ALL of a PR's comments before it pushes to that PR. Nothing in the fix lane enforces either half.
