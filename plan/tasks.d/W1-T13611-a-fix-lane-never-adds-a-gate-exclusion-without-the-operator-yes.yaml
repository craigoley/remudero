  design: |
    INVARIANT refusal-holds-in-every-managed-repo: no fix-lane push in any managed repo adds a gate exclusion or baseline entry that is not a tightening.
    INVARIANT tightening-still-lands: a round that only tightens, or touches no exclusion or baseline file, is pushed as before.
    1. New module src/lib/fix-round-gate-loosening.ts:
       - gateLooseningRefusal({ diffFiles, diff }): for each changed file that matches INSTRUMENT_SURFACE
         (src/lib/review.ts, reused, not copied) or the scanner-ignore set (osv-scanner.toml anywhere,
         .github/semgrep/**, .semgrepignore, .gitleaksignore, .trivyignore), call classifyInstrumentChange;
         any result other than "tightening" is a finding. Returns undefined or { reason: "gate-loosening",
         files, detail } where detail says the operator's yes is needed and names W1-T11030's route.
       - ownerFixLaneInstructions({ prAuthor, body, comments }): the PR body plus each comment whose author is the
         PR author or has author_association OWNER, MEMBER or COLLABORATOR and is not a bot, kept only when it
         addresses the fix lane ("fix lane", "fix round", "fix worker") with a refusal ("do not", "don't",
         "never", "please do not"). Returns the verbatim lines and, where one names a path or a kind of change
         (baseline, exclusion, ignore, waiver), the paths or kinds it refuses.
       - readPrConversation(prUrl, gh = ghJson): `gh pr view --json author,body` plus
         `gh api repos/<o>/<r>/issues/<n>/comments --paginate`; an unreadable read returns { unreadable }.
    2. src/cli/commands/fix.ts:
       - Before the first strike of a run, read the conversation once (deps.readPrConversation, default the
         module's reader) and pass ownerFixLaneInstructions into renderFixPrompt.
       - landRoundPush: after filingRoundRefusal, compute the round's diff (git diff review.headSha..headSha in
         the worktree, the same runner filingRoundRefusal uses) and call gateLooseningRefusal; then refuse a
         diff that touches a path or kind an owner instruction refuses (reason owner-refusal). Either refusal
         logs fix.commit_refused { site, head_sha, reason, files } and fix.done subtype commit_refused and
         returns stood_down, exactly like the filing refusal. No new ledger step.
       - The refusal does not depend on the task's files list or design: an author's design is not the
         operator's yes. The operator's yes is out of scope here; until W1-T11030 lands, the operator makes
         such a change by hand.
    3. src/lib/prompt-render.ts renderFixPrompt: an optional ownerInstructions field renders, inside the
       existing fence and envelope (it is external text), an "OWNER INSTRUCTIONS (from the PR body and
       comments; they override the task design)" block after the constraint block, in every mode.
    4. One test file drives runFixRung's push path through the house fakes (test/helpers/git-repo.ts,
       fake-github.ts), one test per criterion titled "W1-T13611 criterion <k>": a core PR and a consumer
       (remudero-console) PR adding a baseline row; a ceiling-lowering round; an owner comment refusing the
       baseline change.
