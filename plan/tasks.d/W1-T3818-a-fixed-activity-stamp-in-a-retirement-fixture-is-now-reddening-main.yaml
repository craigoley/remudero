  rationale: |
    OBSERVED from the failed main CI run 35475615764 on 2026-09-19. The required
    `expiring-fixture-census` reports `lastActivityAt="2026-09-12T16:59:00.000Z"`
    in `test/retired-task-open-pr-disposition.test.ts` at lines 60 and 97, and blocks
    main because that production-shaped fixture now falls within the seven-day warning
    window before `DEFAULT_SWEEP_POLICY.staleDays`. The test fixes `NOW` at
    2026-09-12T17:00:00.000Z, so the activity stamp needs to be fresh relative to
    that test clock, not fresh relative to wall time.

    This is a test-fixture maintenance repair, not a change to stale-PR policy or to
    the census. W1-T3655 correctly makes main observe the census; weakening it would
    only hide the next time bomb. The exact falsifier is available locally: restoring
    either fixed stamp makes the new production-view regression fail, and the census
    again reports the line as expiring.
  design: |
    Define one activity timestamp from the test's existing `NOW`, safely inside the
    stale threshold, and use it in both fixtures that model GitHub `updated_at` and
    `OpenPrView.lastActivityAt`. Strengthen the existing W1-T3445 production-shaped
    retirement regression to assert both resolved activity instants remain fresh
    relative to `NOW` before the retirement disposition is evaluated.

    Do not change `DEFAULT_SWEEP_POLICY.staleDays`, the census margin, its exemptions,
    the retirement disposition, or another test file. Do not replace the date with a
    helper invisible to the census; use an explicit value derived from the fixture's
    own frozen clock.
  acceptance:
    - claim: "both retirement-fixture activity paths remain fresh relative to their fixed test clock, so main cannot rot solely as wall time advances"
      proof: "unit test: W1-T3445 criterion 1"
  falsifier: |
    Restore the old literal timestamp in either the `updated_at` fixture or the
    direct `lastActivityAt` fixture. The focused regression must fail by naming the
    stale instant; a real census run must again report that literal as an expiring
    fixture. Reintroducing either stale path is not a passing repair.
  note: |
    reservation holder is this filing branch, verified by `rmd next-task-id` reserving
