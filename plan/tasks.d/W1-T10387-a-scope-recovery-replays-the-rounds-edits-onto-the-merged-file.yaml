  rationale: |
    OPERATOR RULING 2026-10-22: a recovery must never overwrite a file with a stale whole-file snapshot.
    READ at origin/main 32887fe4d (symbols, not lines): `saveScopeAmendmentWork` stores each declared path's full
    bytes and mode (`scopeWorkFiles`) when the round asks for scope. The run-task.ts scope-amendment resume merges
    the amendment and main locally, then calls `restoreScopeAmendmentWork`, which writes those full bytes back. Any
    hunk the merge brought into the file since the save is dropped without a conflict.
    OBSERVED (core ledger, read-only):
    - `fix.scope_amendment` on PR 13324 at 09:38:41Z: outcome created, recovery_status saved.
    - At 10:05:41Z: outcome amendment_merged, merge_sha 5cede6166, recovery_status restored, restored_paths
      [src/lib/sweep.ts, src/lib/tick-read-worker.ts].
