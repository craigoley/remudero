    Neither touches how saved work is restored. Swept origin/main 32887fe4d plan/tasks.d and all 18 open PR heads'
    plan trees for restoreScopeAmendmentWork, saveScopeAmendmentWork and scope-amendment: no other shard.
  design: |
    1. SAVE THE EDIT, NOT JUST THE RESULT. The saved record keeps, per path, the bytes at the head the round started
       from (the BASE, read from git at that head) beside the round's edited bytes. Its identity and digest checks
       still verify both. A record written before this change, which has no base, is restored by step 3's refusal
       rule, never by whole-file overwrite.
    2. REPLAY BY THREE-WAY MERGE. Restore runs `git merge-file` semantics per path: ours is the post-merge file in
       the worktree, base is the saved base, theirs is the saved edit. A clean merge writes the result. Main's hunks
       survive and the round's hunks land. A path that was absent at the base and is added by the round is written
       only when the merged tree also lacks it.
    3. CONFLICT STOPS, IT NEVER PICKS A SIDE. Any conflicting path, or a legacy record without a base, leaves that
       file as the merge produced it. Recovery_status reads `conflicted` (or `unavailable`) with the paths, and the
       round's evidence tells the next round to re-apply its change to those paths. No whole-file overwrite remains
       on any path.
    4. Tests (new file, titles verbatim as in the proofs): a saved edit plus a main hunk merged since the save keeps
       both hunks. An overlapping edit reads `conflicted` and leaves the merged file byte-identical. A legacy
       record without a base is not written over the merged file.
  acceptance:
    - claim: "a recovery keeps the hunks main brought in after the save and applies the round's own"
      proof: "unit test: W1-T10387: a scope recovery keeps main's hunks and replays the round's edit"
    - claim: "an overlapping edit is reported conflicted and the merged file is left untouched"
      proof: "unit test: W1-T10387: a conflicting scope recovery leaves the merged file untouched"
    - claim: "a legacy whole-file record never overwrites the merged file"
      proof: "unit test: W1-T10387: a legacy scope record never overwrites the merged file"
  falsifier: |
