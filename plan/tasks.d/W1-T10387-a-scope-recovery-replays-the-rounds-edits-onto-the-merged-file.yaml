      below".
    - Head e706d2e8a (08:55Z), the one the round saved from, lacks #13318.
    - Merge 5cede6166 (10:04:33Z) has #13318 as an ancestor and holds the line.
    - The next head, 3dca3cda1 (10:30:23Z), and every head through 355244c8e (18:05Z) have #13318 as an ancestor
