  design: |
    No fixed thresholds and no strike cap. Every bound comes from the gardener's own measured history.
    1. ONE PURE MODULE, src/lib/mechanical-rulings.ts.
       - `mechanicalRuling(task, evidence)` returns one of:
         - `{ rule, verdict: "retire" | "release" | "hold", evidence }`
         - `{ escalate: reason }`
         - `undefined`, meaning the rules cannot decide.
       - It is evaluated in this order:
         a. Operator-released (operator-releases.json or an operator `ratify.approved`): undefined. Never touched.
         b. RULE 1, retire:
            - A merged PR on main carries `Remudero-Task: <id>`.
            - Or the operator declined the record's ask: `panel.proposal_declined` for `machine-judge:<id>` or
              `verify-human:<id>`, with no later `rmd restore`.
            - This applies whatever the path class, because the person already decided.
         c. PRIVILEGED, escalate. Either condition:
            - Any declared path in W1-T10350's privileged classes, read through its exported classifier: .github/,
              .claude/, settings/, root deploy/, infra/ and docker/, Dockerfiles, plan/policy.yaml, DECISIONS.md,
              CLAUDE.md, merge-policy paths, and deploy, secrets, token, auth or permission machinery.
            - The record's cause is a GATE, so its remedy could weaken the gate. The gate class is the security
              scanners (CodeQL Analyze, Semgrep Scan, OSV), the code-scanning merge policy and adapter, the ratchets
              (coverage, mutation, authority), and CI_AGGREGATOR_FAMILIES.
            - This includes a judge disagreement on such a record.
         d. NO MEASURABLE SYMPTOM: undefined. The family has no reader in item 2.
         e. RULE 2, retire. The symptom had zero occurrences across the gardener's own window, or the gardener's own
            state says the cause is gone (the flow-remedy ladder reads "retired", or a flow stage is not regressed
            against its own baseline).
         f. RULE 4, hold. Either condition:
            - The symptom recurs, but below the median current count of its family's live parked records.
            - It recurs at a lower rate than the record's own filing evidence recorded.
         g. RULE 3, release. The symptom recurs, the record is not banded `risk: high`, and no path is privileged.
            A `risk: high` record is undefined: it stays with the risk judge.
    2. THE SYMPTOM READER IS A PORT, wired in run-task.ts from the ledger union and the gardeners' own state.
       - scout: rows of the record's step across SCOUT_WINDOW_MS.
       - ci-friction: rounds matching `parseCiFrictionOrigin(origin).key` across CI_FRICTION_HALF_LIFE_MS, and the
         cause state.
       - flow-regression: the latest flow report's `regressed`.
       - flow-blocker: the flow-remedy ladder state, plus the sweep rows for the blocker.
       - flake-incident and selector-shadow-miss: retries for the named test.
       - The filing-time rate comes from the record's own priced or filing evidence.
       - A family with no reader yields undefined.
    3. THE MACHINE-FILING JUDGE APPLIES THE RULES FIRST. In `runMachineFilingJudge` and the re-ask path,
       `mechanicalRuling` runs before `judgeMachineShard` or any re-ask.
       - Retire (rules 1 and 2):
         - Rendered with `renderRetiredShard`. The comment names the rule and its evidence (count, window, last seen).
         - Lands through the one judge PR, with a LANDED_NOTE entry and its grep acceptance.
         - Never deleted.
       - Release (rule 3):
         - The judge lands a recorded ruling `{ verdict: "rule-3-low-privilege", action: "proceed" }` through the
           same PR. This replaces the standing escalate pin, so W1-T10348's rule (no machine release over a standing
           escalation) holds because the escalation is settled, not overruled.
         - The same pass writes `ratify.approved` through `approveParkedTask`. Its provenance is
           `{ released_by: "mechanical-rule", rule: "rule-3-low-privilege", author_class: "machine", evidence }`,
           and every guard of that writer stands.
       - Hold (rule 4):
         - No model call, no reasked row and no inbox ask.
         - The record is re-checked when its symptom count moves.
       - Escalate: the record goes to the existing judge path unchanged, which escalates.
       - Ledger: every decision writes `machine_judge.mechanical_ruling { task_id, rule, verdict, evidence }`.
    4. THE VERIFY-HUMAN CADENCE DEFERS TO THE RULES. A shard the rules decide is neither judged nor released by
       `verifyHumanCadence`, and no inbox ask is staged for it. It writes `verify_human.mechanical_ruling`, and the
       machine-filing judge's landing owns the write. A privileged record whose two judges disagree is staged to
       the operator, as today.
