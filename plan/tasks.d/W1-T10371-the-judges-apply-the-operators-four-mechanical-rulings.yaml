  rationale: |
    READ 2026-10-21 at origin/main 814225f7c (after #13418).
    Evidence:
      - Decision data: ~/Remudero-notes/verify-human-decisions-2026-10-21.json and .md.
      - Liveness: the core ledger on host remudero, 10-18T14:00Z to 10-21T13:52Z.
