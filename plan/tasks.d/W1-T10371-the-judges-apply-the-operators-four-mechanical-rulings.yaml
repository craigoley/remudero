  falsifier: |
    - Skip the rules in runMachineFilingJudge: the stub judge is called and nothing retires or releases, and the first
      four tests fail.
    - Write only the ratify.approved row for rule 3: the record keeps its escalate pin, and the third test fails.
    - Escalate a thin record: an inbox ask is staged, and the fourth test fails.
    - Leave verifyHumanCadence unchanged: it judges a rule-decided shard, and the fifth test fails.
    Regression guards, kept by the same file:
    - Every privileged class still escalates, whatever its symptom: .github/workflows/ci.yml, deploy/x.sh,
      src/lib/code-scanning-merge-policy.mjs, scripts/merge-queue-canary.mjs, and a CodeQL, Scan or coverage-ratchet
      cause.
    - A `risk: high` record is never released by rule 3, and approveParkedTask's guards are unchanged.
    - An operator-released record is never touched.
    - A retirement is a `renderRetiredShard` edit through the judge PR, never a deletion.
    - A family with no symptom reader is undecided and keeps today's judge path.
    - No fixed bound: the test varies the family's live counts and the record's filing rate, and the hold/release
      verdict follows them.
    - W1-T9043's 30-day withdrawal and W1-T9694's main-inherited retirement are unchanged.
