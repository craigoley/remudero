    THE OPERATOR'S CLEARANCE, 2026-10-21. 104 queued verify:human tasks, every one escalated by a judge. He ruled:
      - Retire 38: 37 in #13418, plus W1-T7271 in #13406.
      - Approve 33: 30 by rmd approve; W1-T6372, W1-T7736 and W1-T9523 were already released.
      - Build 2: W1-T10171 and W1-T10217.
      - Defer 31.
    In the session he stated the rulings as four rules, and the judges should apply them:
      1. ALREADY SHIPPED OR ALREADY DECLINED -> retire.
      2. CAUSE STOPPED -> retire. The symptom had zero occurrences across the gardener's own window, and the task
         touches no privileged path.
      3. LIVE AND LOW-PRIVILEGE -> release. The symptom still recurs, and the task's files are only tests, docs or
         non-privileged src.
      4. TOO THIN -> leave queued, with no escalation, until it recurs.
    Only what the rules cannot decide goes to a person: a privileged path class, a remedy that could weaken a gate,
    and a judge disagreement on privileged scope.
    THE CODE TODAY.
      - machine-filing-judge.ts `runMachineFilingJudge`:
        - Judges each due record with `judgeMachineShard`: the deterministic backstop first, then the risk-judge model.
        - `reaskParkedEscalations` re-asks parked escalations. That loop is W1-T10349's.
        - It already retires through `renderRetiredShard` (status: blocked, `retirement: retired  # <reason>`):
          W1-T9694's main-inherited flakes, and W1-T9043's 30-day `withdrawn` path. Both land through the one judge PR
          (`ws.land`, `machineJudgePrBody`, `LANDED_NOTE`).
        - It never asks whether the record's own symptom has stopped, shipped or been declined.
      - measurement-cadence.ts `verifyHumanCadence` (the verify-human cadence):
        - Judges each due shard. An `automate` verdict goes through `applyAutomateVerdict` to the release hook, and
          `needs_operator` stages an inbox ask.
        - The release hook is run-task.ts's `releaseAutomatedShard` wiring. It calls a SECOND risk judge
          (`buildFilingRiskJudgeInput`) and writes `ratify.approved` through `approveParkedTask` with
          `MachineReleaseProvenance`.
      - run-task.ts `approveParkedTask`:
        - Refuses machine provenance on a `risk: high` record.
        - Writes only a ledger row. Since W1-T10348 (#13387), dispatch ignores a machine release while the record
          carries a current-pin `risk_ruling` with `action: escalate`.
    MEASURED COST OF THE GAP.
