  design: |
    1. TAKE OVER A PROVEN-DEAD CLAIM INSIDE THE TTL. In `postReviewPending`, when the prior same-input
       pending record is inside `REVIEW_LOCK_TTL_MS` and `assessPendingReviewOwner` returns "dead", fall
       through to the takeover. Do not no-op. The new post names what it took over from, and its
       description says the prior owner is proven dead, not that the claim is ">= 42m old". The
       `review.pending_posted` row carries this process's owner identity (`owner_pid`, `owner_started_at`,
       host), as every new writer does.
    2. THE SHARED-STATUS ARM AGREES. A foreign `owned by run X` status inside the TTL is taken over when the
       ledger's latest pending record for run X on this head is proven dead by the same assessment.
       Otherwise it holds, as today.
    3. "unknown" STILL HOLDS. A record with no owner identity, a foreign host, or an unreadable age keeps
       W1-T3647's no-op.
    4. THE NEXT PASS READS THE TRUTH. After the takeover, `lastPendingReviewStatusFromLedger` returns the
       re-run's record and `assessPendingReviewOwner` reads it "active". The sweep then derives `wait`
       ("a review is already in flight"), not "owner proven dead — re-running".
    Thread the owner assessment through `PostReviewPendingOpts` as an optional seam, defaulting to
    `assessPendingReviewOwner`, so tests inject "dead", "active" and "unknown" without a real pid.
    Tests go in the new file test/a-re-run-review-takes-over-a-dead-owners-pending.test.ts, with `test(` titles
    exactly as in the proofs below. test/review-status-pending.test.ts and
    test/a-review-lock-older-than-its-ttl-is-reclaimable.test.ts must stay green.
