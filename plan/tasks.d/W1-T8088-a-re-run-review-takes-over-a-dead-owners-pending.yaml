    THE PATH, read on origin/main 363991c2a (symbol names, not line numbers):
      - `buildOpenPrViews` (src/run-task.ts) sets `reviewPendingOwnerDead` when
        `assessPendingReviewOwner` (src/lib/review.ts, W1-T2844) proves the latest pending record's owner
