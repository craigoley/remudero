  rationale: |
    MEASURED 2026-11-03 ~00:30Z over the 7-day conflict rows of the core ledger union (~/Remudero-notes/conflict-findings-2026-11-03.md,
    evidence in ~/Remudero-notes/conflict-evidence-1103/, read-only). Code read at origin/main c0a6f1c74.
    - 42 PRs went dirty. 26 were cleared by the sweep's merge-conflict round, 1 by the dirty-fleet rebase, 4 by another push and
      7 by close or merge. 1 was hand-fixed (#15520), and 3 are still conflicted.
    - Longest continuous conflict per PR: median 0.54 h, p90 13.8 h. Tail: #15532 49.6 h, #15679 49.2 h, #15551 36.5 h, #16044
      22.1 h, #14176 13.8 h.
    - Open and conflicted at ~00:30Z: #16201 (src/cli/commands/daemon.ts), #15638 (src/run-task.ts), #15602 (rename skew, clean
      locally, dirty on GitHub) and #15532, which the operator's thread is hand-fixing. None of these files is regenerable.
    - Every tail PR was held by a different mechanism: hysteresis that ignores main moving, the handoff deadlock, a dead
      daemon's seed, a count backstop, a non-run head, light-pass deferral, or a compare capped at 300 files. Each is its own
      filed task (items 1-6 of the findings). A backstop is needed because the next unanticipated wedge will hold a PR the same
      way.
    GARDENERS TODAY:
    - None acts on a conflict. pr.stuck escalates once a stage-stall passes the 30-minute backstop.
    - The flow gardener filed W1-T11062: "cleared by its owner without manual intervention", verify human, rated high risk, no
      mechanism named.
    - The hot-file gardener filed W1-T10603 and W1-T10743, which are preventive.
    - The fix-lane and queue-judge gardeners only read.
    Operator ruling 2026-11-02 (in chat): automatic conflict resolution "should absolutely be included to ensure automated
    flow. If rmd doesn't effectively do it, a gardener should." So this gardener ACTS; it does not only escalate.
    PATTERNS IT FOLLOWS:
    - The fix-lane gardener (W1-T7421): ledger-union evidence, classes priced in blocked PR-hours, no fixed threshold gating an
      act.
    - The SRE runbooks and their independent governor (W1-T4386, W1-T4390): act only on a live verdict computed from the
      ledger alone, with tiers live, slow, shadow and stopped, self-healing, evidence that ages out, and the daemon
      re-evaluating the verdict every tick.
    - Operator ruling 2026-10-13 (W1-T9035): a gardener's bound is earned from its record.
    SUPERSEDES W1-T11062, which is withdrawn in this same filing.
  design: |
    1. DETECT (src/lib/conflict-gardener.ts). Read open PRs from the sweep's snapshot reader and the ledger union.
       - Episode duration: from the first dirty sweep.disposed row, or the first probe conflict row, at a head, to the row
         that cleared it. The p90 over the trailing window is the staleness bar. With fewer than 2 episodes there is no bar,
         and every conflicted PR qualifies.
       - Skip a PR with a live fix claim (claimFixDispatch's key), an in-flight sweep action, or an operator merge hold, and
         name the skip in the report.
       - Rank by blocked PR-hours (episode age). Ties go to the PR with more dependent queued tasks.
    2. ACT, in tiers. Each tier exports from or calls into src/lib/sweep.ts. Nothing is reimplemented.
       (i) Deterministic: the no-worker arms of the conflicted disposition: regenerateConflictViaGit in every mode it has, and
           take-main on a redundant path (isRedundantRefixConflict).
       (ii) A round: dispatchFix in merge-conflict mode. Its prompt (prompt-render.ts, the merge-conflict arm) gains an intent
            section: the PR body, and for each conflicted file `git log --format=%s%n%b <merge-base>..<main> -- <file>`, capped
            by the prompt's existing budget.
       (iii) Wedge clearing: re-read the PR through fixSeedRead and fixDispatchHoldAtHead with this pass's ledger. If either
             reads stale (orphaned or ended, or a hold whose recorded cause no longer stands), call the sweep's conflicted arm
             for that one PR, which writes its own settlement rows. The gardener never deletes a claim ref or a ledger row.
    3. VERIFY. On the next pass, for each act with a new head, read mergeable_state and the required check rollup through the
       read broker's gateway, and write conflict_garden.verified with the outcome verified, pending, still-dirty or ci-red.
    4. JUDGE. After each round (tier ii or iii), resolveFixProgress (fix-progress-judge.ts) with the PR's conflict_garden.act
       history as remedyHistory. continue: the next pass may act again. change-approach: carry the constraint into the next
       round's prompt. escalate: one needs-human issue per (PR, head) through escalate(). unavailable: nothing.
    5. GOVERN (src/lib/conflict-gardener-governor.ts, a leaf like sre-governor.ts). conflictGardenGovernorVerdict(tier,
       receipts, controls) is computed from conflict_garden.act and conflict_garden.verified rows only. Harm is a verified head
       whose CI went red where its parent's was green, or a reverted push. Backoff and memory derive from the receipts' own
       spacing. The core daemon evaluates it each tick and pauses the gardener on stopped, as stepSreGovernor does (src/lib/daemon.ts).
    6. REGISTER in garden-registry.ts as conflictGardenPass, beside flowGardenPass, with the existing pacing (gardenPacingDueAsync). The gardener opens no PR of its own, so
       it adds no MACHINE_LANE_HEAD_RE name. The acts per pass start at the W1-T9035 earned-bound default and move with its
       verified record.
    Tests go in the new file, titled verbatim as in the proofs, over the real gardener pass with injected snapshot, ledger,
    git, GitHub and judge seams, and the real governor.
  falsifier: |
    At origin/main no module lists conflicted PRs or acts on them, so the first test's import fails. If the tier order is dropped
    (a round before the deterministic tier), the clean-merge fixture dispatches a worker and the second test fails. If the
    gardener escalates on a count with the judge unavailable, the third test fails. If a tier acts on a shadow or stopped
    verdict, the fourth test fails.
