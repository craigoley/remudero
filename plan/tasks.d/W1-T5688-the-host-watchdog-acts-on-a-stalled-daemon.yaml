- id: W1-T5688
  title: "THE HOST WATCHDOG ACTS ON A STALLED OR CRASH-LOOPING DAEMON INSTEAD OF REVIVING IT INTO THE SAME INPUT — rmd-relaunch.sh revives only a stopped container, its `refresh_deploy_code || exit 0` ends the tick whenever workers are in flight, and on 2026-10-03 it revived 14 times into one crash and raised CRASH LOOP 3h44m in, a marker nothing reads"
  repo: remudero
  depends_on: [W1-T5687]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the host launcher's action ladder on the W1-T5687 verdict
  band_meaning: blast-radius
  origin: "operator session 2026-10-04: research/flow/report.md (change-aware flow) item 1, the action-ladder half"
  plan_refs: [W1-T5687, W1-T5651, W1-T3268, W1-T2585, W1-T5519]
  files: [deploy/install-host-units.sh, test/fixtures/azure-host-units/rmd-relaunch.sh, test/the-host-watchdog-acts-on-a-stalled-daemon.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a and the live host (crontab, systemctl timers,
    ~/rmd-revivals.log), read only. `rmd-fleet-watchdog.timer` runs the launcher `render_launcher`
    renders (deploy/install-host-units.sh) every 5 min. It revives only a container that is not
    running; on a healthy one it calls `refresh_deploy_code '<name>' || exit 0` and then `rmd
    deploy-run --image-drift-only`, so with workers or inflight locks present the tick exits before
    anything else runs. A wedged-but-running daemon is never acted on. In the 10-03 crash loop
    (#8872 + #8871 duplicate `priority:` key, 09:14Z to #8877 at 14:50Z) the log holds 14 revivals
    10:10-14:40, each `prev_exit=1 prev_restarts=5` (docker's on-failure:5 already spent);
    `crash_loop_signature` first announced CRASH LOOP at 13:30 (count=5) because CRASH_LOOP_GAP_S=1800
    reset the run after an 11:40->12:20 gap, and the DAEMON_CRASH_LOOP marker has no reader outside
    the installer. deploy/recycle-container.sh exists (pull, replace, four refusals including
    workers still running past a bounded wait); its only in-daemon caller, the
    `recycle-stale-container` runbook, refuses in-container and so cannot act on a stalled daemon.
    The duplicate-key class itself is now survived at boot (#8878 quarantine) and repaired by its
    own PR (W1-T5519, #8991), so this task needs no plan last-good boot; it stops the revive loop
    from spending boots on an unchanged input.
  design: |
    (i) The launcher runs `rmd progress-watchdog --json` (W1-T5687) BEFORE `refresh_deploy_code`,
    so a tick with workers in flight still reads the verdict.
    (ii) capture-diagnostics: the verb's bundle is the whole action; the launcher appends one
    revival-log line naming the verdict.
    (iii) recycle: run deploy/recycle-container.sh at most once per 30 min (a timestamp marker under
    the state dir). A refusal (workers still running, failed pull, digest mismatch) is logged with
    its reason and retried on a later tick, never in the same one.
    (iv) hold-revive: while the verdict is CRASH_LOOP, the revive branch does not start the
    container again until its input changes — origin/main's sha or the image digest differs from
    the one recorded when the loop was named — and writes one digest line (failed-boot count, the
    last ledger step before each exit, the recorded sha and digest) to the revivals log and the
    DAEMON_CRASH_LOOP marker.
    Regenerate the rendered fixture test/fixtures/azure-host-units/rmd-relaunch.sh.
  acceptance:
    - claim: "with a fake rmd and docker, a STALLED/recycle verdict runs recycle-container.sh once and not again within 30 minutes, a CRASH_LOOP verdict starts no container while origin/main's sha is unchanged and starts it once the sha moves, and a tick with workers in flight still reads the verdict"
      proof: "unit test: test/the-host-watchdog-acts-on-a-stalled-daemon.test.ts"
  falsifier: |
    Move the verdict read back after `refresh_deploy_code || exit 0`: the workers-in-flight fixture
    never reads the verdict and the test fails. Drop the input-changed check: the CRASH_LOOP fixture
    revives on every tick, as it did 14 times on 10-03.
