- id: W1-T406
  title: "reapStaleWorktrees never runs on a one-shot container dispatch — both its call sites need a daemon or a PR-disposition verb, and the pid probe that would gate it answers in a pid namespace that restarts with every container"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: "MEASURED ON AZURE 2026-08-08, RE-DERIVED FROM SOURCE AT 0ff3e8f. One state directory
    on the container host accumulated 3.0 GB across a day of one-shot dispatches, several of which
    left orphaned worktrees behind after failing — including runs killed mid-implement, whose trees
    survive carrying uncommitted work. #1486 (deploy/host-update.sh) recommended this shard and
    deliberately did not file it.
    BOTH CALL SITES ESTABLISHED, EXHAUSTIVELY. `runWorktreeReapRung` (src/lib/worker.ts) is called
    from exactly two places in src/run-task.ts — the daemon's per-poll sweep hook, and
    `sweepCommand`. Neither is reachable from `docker run ... rmd run-task <id>`:
    (1) THE DAEMON POLL requires a running daemon, and a one-shot container has none.
    (2) `rmd sweep` IS NOT A DISK VERB. Its own registered usage string names its primary action as
    arming auto-merge on mergeable PRs and closing stale ones, so running it to reclaim disk would
    take PR actions as a side effect. The obvious dodge does not exist either: `sweepCommand` guards
    the reap with `if (!dryRun)`, so `rmd sweep --dry-run` takes no reap at all.
    BUT IT IS NOT TRUE THAT NOTHING REAPS ON THE RUN PATH, AND SAYING SO PRECISELY IS PART OF THIS
    FILING. `pruneStaleRuns` IS called inside `runTask` (and inside `retroCommand` and
    `triageCommandLocked`). It enumerates git's own `worktree list --porcelain` and removes
    registered `run-*` worktrees whose runs are not live. What a one-shot container never runs is
    `reapStaleWorktrees`, and the difference is exactly the three holes run-task.ts's own sweep-rung
    comment names: git-INVISIBLE directories (never registered, or whose registration was lost),
    detached-HEAD `sweep-*` orphans that write no lock at all, and WIDOWED `.lock` files whose
    worktree directory is already gone. Those three are what accumulate.
    THE PRECEDENT IS THE SHAPE, NOT THE CALL SITE — AND THE BRIEF THAT PROPOSED IT HAS THIS HALF
    WRONG. `logCloneReapSurvey` is described as a boot rung and IS one, but its only call site is
    inside `daemonCommand`. So it is a DAEMON boot rung and is ALSO unreachable from a one-shot
    container. Following `reapStaleClones`' wiring therefore CANNOT mean calling this from where
    that one is called. What transfers is its SHAPE, which this task adopts point for point:
    best-effort with a try/catch returning null so it never blocks boot, injectable deps appended
    LAST so no positional caller shifts, one ledger line summarising what it found, and DRY BY
    DEFAULT behind a policy flag. What changes is the call site: the one-shot dispatch path, beside
    the `pruneStaleRuns` call that already runs there.
    THE CADENCE ARGUMENT IS THE WHOLE JUSTIFICATION. On the mini a poll loop supplies the cadence.
    In a one-shot container world every container start IS the cadence — the rung fires exactly as
    often as work happens, needs no operator, and needs no daemon."
  acceptance:
    - claim: "a one-shot run-task dispatch runs the worktree reap rung at boot, so the three coverage holes pruneStaleRuns leaves are closed without a daemon"
      proof: "unit test: test/worktree-reap-boot-rung.test.ts"
    - claim: "a run lock naming a pid that is alive only because the container pid namespace restarted is judged stale, using the startedAt the lock already records"
      proof: "unit test: test/worktree-reap-pid-reuse.test.ts"
    - claim: "the rung deletes nothing while its policy flag is off, surveying and ledgering what it would reclaim"
      proof: "unit test: test/worktree-reap-boot-survey.test.ts"
    - claim: "a failure anywhere in the rung is caught and never blocks the dispatch that invoked it"
      proof: "unit test: test/worktree-reap-boot-nonblocking.test.ts"
