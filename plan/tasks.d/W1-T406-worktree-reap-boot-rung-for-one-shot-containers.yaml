  note: "FOUR DECISIONS, MADE HERE RATHER THAN LEFT TO THE IMPLEMENTER.
    (i) IT MUST NOT RE-IMPLEMENT AN AGE CHECK — IT CALLS THE EXISTING REAPER. `reapStaleWorktrees`
    age-gates on `newestActivityMs`, the W1-T378 DEEPEST-ACTIVITY walk, and the reason is measured:
    a directory's mtime advances only when an entry is added to or removed from THAT directory, and
    `git commit` in a linked worktree writes to `<parent>/.git/worktrees/<name>/index` — outside the
    tree entirely. So the root's mtime is frozen at checkout and a root-mtime age gate degrades to
    'reap unconditionally'. W1-T350 measured the cost: a run that was actively committing had its
    worktree destroyed 40 minutes in. This rung is a CALL SITE. It introduces no age arithmetic of
    its own and no new destruction criterion; the only thing it changes is WHEN the existing
    predicate runs.
    (ii) THE LOCK IS THE AUTHORITY — AND THE HAZARD IS THE OPPOSITE OF THE ONE PROPOSED. The brief
    for this filing warned that `isHolderStale`'s host-first rung (W1-T396) would make a boot rung
    see the previous boot's locks as foreign and unreclaimable, because a container's hostname
    changes on every restart. THAT RUNG IS STRUCTURALLY INAPPLICABLE HERE. `reapStaleWorktrees`
    never calls `isHolderStale`; it calls `isPidAlive` directly. And `RunLockInfo` (src/lib/worker.ts)
    is `{pid, run_id, startedAt}` with NO host field at all, so there is nothing for a host rung to
    read. The host-first rung governs `HolderIdentity`, whose `host` is written by the inflight,
    drain, review and task-id-reservation locks — a different lock family.
    THE REAL CONTAINER HAZARD RUNS THE OTHER WAY AND IS WORSE THAN THE ONE FEARED. `defaultIsPidAlive`
    (src/lib/drain-lock.ts) is `process.kill(pid, 0)`, which answers in THIS container's pid
    namespace. Every container boot restarts pids at 1, so a previous boot's lock naming a low pid
    will very often find that pid ALIVE as an entirely unrelated process — and `reapStaleWorktrees`
    then takes the `live-pid` keep branch and never reaps it. The failure is not destruction, it is
    PERMANENT NON-RECLAMATION, which is exactly the shape of the 3.0 GB that accumulated.
    THE DISCRIMINATOR ALREADY EXISTS AND IS ALREADY RECORDED. `RunLockInfo.startedAt` is written on
    every acquire and `reapStaleWorktrees` ignores it. `isHolderStale`'s third rung is precisely
    this comparison: a pid that started AFTER the lock claims cannot be the holder that wrote it.
    So this task threads a start-time-aware liveness predicate into the reap opts rather than
    inventing one, and the comparison is STRONGER in a container than on the mini — every process
    in a fresh boot started after any previous boot's lock was written, so the question is almost
    always decidable rather than almost always deferred.
    DO NOT ADD A `host` FIELD TO `RunLockInfo` AS PART OF THIS. It would import the exact hazard the
    brief feared instead of fixing it: `isHolderStale`'s own doc states that a machine whose
    hostname changes between acquire and reclaim sees its OWN older locks as foreign and therefore
    permanently unreclaimable, recoverable only by deleting the lock file. A container's hostname is
    its container id by default and changes on every `docker run`, so recording one here would
    convert a decidable question into an undecidable one. If a stable identity is ever wanted, that
    is the separate changeset `isHolderStale`'s doc already describes.
    UNMEASURED: the actual value of `os.hostname()` inside this image, because no agent container
    has a docker daemon. It is not needed for the decision above — that rests on `RunLockInfo`
    having no host field at all — but what would settle it is two runs of
    `docker run --rm --entrypoint bash --user 1000:1000 <image> -lc 'hostname'` compared against
    each other, and against the same command with `--hostname` passed.
    (iii) IT MUST NOT FIRE ON A HEALTHY RESTART, AND THE ANSWER IS TO SHIP IT DRY. This repo has
    four bounds that fired on healthy conditions — ci-gate's wait cap sized under the real check
    wall-clock (W1-T312), a deploy ceiling consumed by a dry run that delivered nothing (W1-T380), a
    check-wait bound where every booked PR later merged (W1-T382), and the idle-gate ceiling. A
    reaper that fires wrongly does not merely stall a queue; it destroys uncommitted work.
    WHAT 'LEGITIMATELY HOLDS WORK' MEANS WHEN THE PREVIOUS PROCESS IS DEFINITELY GONE: the existing
    predicate already answers it and this rung must not weaken any part of it. A registered branch
    still live upstream is kept regardless of age; an incomplete activity probe keeps as
    `activity-unknown` because an ambiguous signal must never destroy; and recent activity rescues a
    tree unless its own lock names a pid confirmed dead (W1-T381). Those keeps stay exactly as they
    are.
    ON TOP OF THAT, THE RUNG SHIPS SURVEY-ONLY, following `logCloneReapSurvey`, whose flag is false
    by default so it ledgers what it WOULD reclaim and deletes nothing. The ledger line is what
    earns the flag being turned on: an operator can read several boots' worth of dispositions before
    anything is destroyed. A reaper that has never been observed deciding is not ready to delete.
    (iv) THE LEDGER IS NOT IN SCOPE, AND NO REAPER MAY EVER TOUCH IT. `state/ledger*` — the live
    file and every gzipped rotation — is outside this task and outside any successor. `rotateLedger`
    keeps only the newest 200 lines per step in the live file and archives the rest, so roughly 63%
    of `run.start` history exists ONLY inside those archives and there is no second copy. Deleting
    any of them destroys unique evidence. This rung reaps WORKTREES under the worktrees root and
    widowed `.lock` siblings, and nothing else under the state root.
    RISK:HIGH IS RULE 19's SPAN, NOT BLAST RADIUS. The file set crosses the reaper's own module, the
    dispatcher that gains the call site, and the policy pair that carries the flag — plus their
    tests. The behaviour change while the flag is off is a ledger line and nothing else, which is
    the cheapest possible failure.
    REPORTED, NOT FILED: deploy/host-update.sh deliberately does NOT clean state, and its header
    carries a standing instruction not to add it. IF THIS RUNG LANDS, THAT INSTRUCTION STAYS
    CORRECT and the two must not grow into each other — the fleet reaps its own state from inside,
    where the live-pid, live-branch and activity predicates are available; the operator script
    reclaims DOCKER's disk from outside, where none of them are."
