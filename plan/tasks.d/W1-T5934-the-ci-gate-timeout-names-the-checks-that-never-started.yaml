- id: W1-T5934
  title: "THE CI-GATE TIMEOUT NAMES THE CHECKS THAT NEVER STARTED — W1-T5921 classifies the timed-out shape from the gate's annotation, but the ::error:: annotation carries only the TIMED OUT line, and the `  - <check>` not-ready list lives only in the job log, so the stand-down and escalation usually read '(unnamed in the gate's annotation)' and the operator cannot see which check never got a runner"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium  # Rule 19: one concern — the evidence the timeout stand-down names; the classification is unchanged
  band_meaning: span
  origin: "operator session 2026-10-05/06: follow-ups found while building the stall fixes ('ensure all follow ups are being addressed')"
  plan_refs: [W1-T5921, W1-T312]
  files: [src/lib/sweep.ts, test/the-ci-gate-timeout-names-the-checks-that-never-started.test.ts]
  status: queued
  priority: 3
  attempts: 0
  rationale: |
    Found 2026-10-06 while building W1-T5921 (#9434, merged). .github/workflows/ci-gate.yml's wait
    loop (W1-T312) prints "TIMED OUT waiting for required check(s) to complete" and then the not-ready
    checks, one `  - <check>` line each, to the job log; only the first line reaches the ::error::
    annotation. The sweep reads annotations first, so classifyCiTimeoutNoVerdict's not-ready list is
    usually empty and its reason falls back to the hung aggregates or "(unnamed in the gate's
    annotation)". Live (#9388, 21:30Z) the log named `rule-checks`.
  design: |
    When the timeout shape is classified and the annotation carries no not-ready list, fill the list
    from the fresh required-check rollup (the checks still queued or never started at that head), which
    the sweep already reads, rather than fetching the job log. Name the source on the row (annotation or
    rollup). The classification itself is unchanged.
  acceptance:
    - claim: "a classified ci-gate timeout whose annotation lacks the not-ready list names the never-started checks from the fresh rollup and says so, while an annotation that carries the list is used as is"
      proof: "unit test: test/the-ci-gate-timeout-names-the-checks-that-never-started.test.ts"
  falsifier: |
    Keep the annotation as the only source: the stand-down reads "(unnamed in the gate's annotation)"
    while the rollup shows rule-checks never started, and the test fails.
