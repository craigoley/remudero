- id: W1-T9690
  title: "THE FIRST-RED BOUNDARY TAKES ANY WORKFLOW'S GREEN WHEN MAIN'S HEAD IS ITSELF THE COMPLETED RED — the walk back is the only place the main-health rung learns which workflows carry the required checks, and it runs only when the head is inconclusive, so after a boot (or a changed required set) a red head leaves workflowEvidence empty, enrichMainHealthObservation passes no requiredWorkflows, and mainHealthFirstRedCommitFromRunHistory reads the whole run history: a CodeQL green on a commit whose CI was cancelled becomes the last green"
  repo: remudero
  depends_on: []  # W1-T9678 (filed in #12091, not on main at filing) belongs here: a dependency on an id main lacks fails the plan load
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — which runs may be the first-red boundary's last green; the span (W1-T9678), the probe ladder and the fix ladder are unchanged
  band_meaning: span
  origin: "operator session 2026-10-15: the boundary half of the 10-15 misattribution; W1-T9678 filters only the span"
  plan_refs: [W1-T9678, W1-T7760, W1-T6403, W1-T6023]
  files: [src/lib/main-health-rung.ts, src/lib/sweep.ts, test/the-first-red-boundary-never-takes-a-non-required-green.test.ts]
  status: queued
  priority: 1  # operator-2026-10-15: a wrong boundary names the wrong merge and sends fix rounds after a commit that cannot be the cause, as on 10-15
  attempts: 0
  rationale: |
    READ at origin/main 03269ad67 (2026-10-15):
    - src/lib/main-health-rung.ts keeps `workflowEvidence` (carries / carriesNone) in the rung's closure. It is
      filled in ONE place, the walk back, which runs only under `mainHealthHeadInconclusive(observation)`, that is
      `observation.state === "undetermined"` (src/lib/sweep.ts). A head whose own required checks completed red
      never walks back, so on that pass nothing is learned.
    - The red path then calls `enrichMainHealthObservation(observation, { ...(workflowEvidence &&
      workflowEvidence.carries.size > 0 ? { requiredWorkflows: workflowEvidence.carries } : {}), runHistory })`.
      With the set empty (a fresh daemon generation, or a ci-gate required-set change, which resets it), no
      requiredWorkflows is passed.
    - src/lib/sweep.ts `mainHealthFirstRedCommitFromRunHistory` says why the filter exists ("CodeQL going green on
      a commit whose CI was cancelled is not a green main"), but with no set it falls back to `allHistory`. Its
      oldest-first scan sets `greenSha` from ANY run whose conclusion is SUCCESS. CodeQL, Semgrep, Scorecard and
      main-tripwire finish minutes before CI and sit outside ci.yml's cancel-pending concurrency group (the
      rung's own comment above `workflowEvidence`), so on a run of cancelled CI commits the newest of them that
      carries a green CodeQL run becomes `afterGreenSha`.
    - `firstRedCommit.afterGreenSha` bounds everything downstream: W1-T9678's span is the first-parent commits
      strictly between it and `headSha`. A too-new green shortens the span and can drop the real culprit from it,
      whatever the span's own run filter does. W1-T9678 (built on run-W1-T9678-1792084186402) filters only the
      span's verdict runs, and with the set unknown it treats none as a verdict. The boundary keeps the gap.
    - The 10-15 incident (W1-T9678's rationale) is this shape: a red head, CI cancelled on 131248633, and non-CI
      workflows completing there. Fix the span alone and the boundary can still put the last green above the
      real cause.
    REPRODUCED at 03269ad67, in a throwaway script over that history (newest first: head CI FAILURE, parent CodeQL
    SUCCESS, parent CI CANCELLED, grandparent CI SUCCESS): with no requiredWorkflows the boundary is
    {headSha: head, afterGreenSha: parent}; with requiredWorkflows {CI} it is {headSha: head, afterGreenSha: gp}.
  design: |
    0. ORDER. Build after W1-T9678. Both edit the rung's use of the learned set, and this task's tests assume W1-T9678's
       span filter. W1-T9678 is filed in #12091, which was not on main when this was filed, so it is named here and in
       plan_refs rather than in depends_on.
    1. LEARN FROM THE RED HEAD. When the head's own required checks completed red and the set is unlearned for the
       current required key, the rung reads the jobs of the head's own completed runs. It uses the walk's jobs
       read, its `runHistoryCache.jobsByRunId` cache and its carries/carriesNone rules, factored so that the walk
       and this step share one learner. That fills `workflowEvidence` before `enrichMainHealthObservation` runs.
       It costs no extra read when the set is already learned.
    2. AN UNKNOWN SET NAMES NO GREEN. When the set is still empty (jobs unreadable, or no head run held a required
       job), `mainHealthFirstRedCommitFromRunHistory` takes no SUCCESS as the last green. It returns no boundary,
       and the observation carries a named enrichment failure ("the workflows carrying required checks are
       unknown, so no first-red commit is named"). The repair lane's existing no-boundary path then decides. It
       never falls back to a non-required workflow's green. A run with no workflowName keeps today's treatment
       only when the set is known.
    3. Tests (new file, `test(` titles verbatim as in the proofs below):
       - Replay the 10-15 shape with an empty learned set. The head has a red CI run. The parent has a cancelled
         CI run and a green CodeQL run. The grandparent has a green CI run. The boundary's afterGreenSha must be
         the grandparent, never the parent.
       - With the head's jobs unreadable, no first-red commit is named and the reason says why.
       - Positive control: with the set already learned, nothing new is read and the boundary is unchanged.
  acceptance:
    - claim: "the first-red boundary never takes a non-required workflow's green as main's last green"
      proof: 'unit test: test/the-first-red-boundary-never-takes-a-non-required-green.test.ts'
    - claim: "a red head with an unlearned required set learns it from the head's own runs, so a codeql green on a cancelled-ci commit is not the boundary"
      proof: 'grep: test("W1-T9690: a red head learns the required workflows from its own runs, so a codeql green is not the last green" in test/the-first-red-boundary-never-takes-a-non-required-green.test.ts'
    - claim: "with the required workflows unknown, no first-red commit is named and the observation says why"
      proof: 'grep: test("W1-T9690: an unknown required set names no first-red commit" in test/the-first-red-boundary-never-takes-a-non-required-green.test.ts'
  falsifier: |
    At origin/main, a rung with no learned workflowEvidence observing a red head over the history [head: CI
    FAILURE, parent: CI CANCELLED + CodeQL SUCCESS, grandparent: CI SUCCESS] calls enrichMainHealthObservation with
    no requiredWorkflows, so firstRedCommit.afterGreenSha is the parent and the first test fails.
