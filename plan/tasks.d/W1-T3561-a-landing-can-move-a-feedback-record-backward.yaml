- id: W1-T3561
  title: "A LANDING CAN MOVE A FEEDBACK RECORD BACKWARD — `landPending` decides what to stage by blob INEQUALITY (`remoteSha !== localSha`), which encodes \"mine differs, therefore mine wins\" and carries no ordering at all, so a stale local copy overwrote a record that had already advanced to `grilling` on origin/main, erased the transition and broke `replyTo`: make a landing monotonic in the §7B status lifecycle and refuse-and-surface a regressing write instead of merging it"
  repo: remudero
  depends_on: ["W1-T3560"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 65.00
  files:
    - src/lib/feedback-record-merge.ts
    - src/lib/feedback-landing.ts
    - test/feedback-record-monotonic.test.ts
  origin: architect
  plan_refs: ["W1-T3559", "W1-T3560", "W1-T2278", "W1-T530", "W1-T191", "§7B"]
  status: queued
  attempts: 0
  rationale: |
    (1) MEASURED AND REPORTED, feedback#fb-1789304804534-e29e68 (2026-09-13): PR #5382 merged
    `fb-1789282068794-2f0b7d` at `status: grilling`; feedback-landing PR #5383 merged commit
    `61c494f` and changed that same record back to `status: new`. The bridge landed a stale local
    copy as authoritative, which erased the triage transition and caused `POST /v1/feedback`
    `replyTo` to refuse — §7B's `answered` route checks that the entry is parked at `grilling`, so
    a record silently reset to `new` makes the operator's own reply unroutable.

    (2) THE MECHANISM IS A MISSING ORDER, NOT A MISSING FETCH. `landPending` computes
    `unlanded` by hashing each local file and comparing it to `origin/main:<rel>`, keeping every
    path where `remoteSha !== localSha`. Inequality is symmetric: "the upstream record is NEWER
    than mine" and "my record is newer than upstream" are the same value to this predicate, and the
    local blob is then staged over the upstream one. The module fetches origin every call — the
    defect is not staleness of the fetch, it is that nothing compares the two records' POSITION in
    the lifecycle before choosing a winner.

    (3) THE LIFECYCLE IS ALREADY DECLARED, SO THE ORDER IS AVAILABLE. §7B fixes the status set
    `new | grilling | proposed | accepted | rejected | answered` and W1-T2278 ratified `answered` as
    the sixth member with `answered_by`, `reply_to` and the thread walkable from both ends. A record
    that has acquired `answered_by`, `reply_to`, `thread_id`, `proposal_pr`, `summary` or
    `expansion` upstream carries strictly more history than a capture-time copy that has none.

    (4) AND A UNION OF PATHS DOES NOT FIX IT. W1-T3560 makes two roots' DISJOINT records coexist;
    this is the SAME path written by two sources at different lifecycle positions, which no
    path-level union can adjudicate. Both are needed.
  design: |
    (i) A PURE, SEPARATELY TESTABLE RECORD MERGE. Put the decision in its own module —
    `src/lib/feedback-record-merge.ts` — as a pure function over (upstream record bytes, local
    record bytes) returning one of: take-local, keep-upstream, or REFUSE-as-regressing. No git, no
    network, no filesystem. The landing path calls it; it does not reimplement it.

    (ii) THE RULE. A landing may only advance a record. `new` may become anything; a record that
    has advanced upstream may never be returned to an earlier position by a landing, and transition
    metadata present upstream and absent locally is never dropped. Where the two copies differ in
    fields that are NOT ordered (raw text, attachments), state the chosen rule explicitly rather
    than leaving it to whichever call ran last.

    (iii) REFUSE, SURFACE, DO NOT ARM. A regressing record is EXCLUDED from the landing tree, named
    in a ledger line and on the returned result, and must not ride into an auto-merged PR. If a
    landing's only pending content is regressing, it lands nothing — and says so — rather than
    opening an empty or a silently-reduced PR. This composes with W1-T3560's arm gate: a head that
    is not the owner's complete, non-regressing union is not armed.

    (iv) THE DETERMINISTIC FIXTURE THE REPORT ASKED FOR. Source A holds the record at `new`; source
    B advances it to `grilling` with answer metadata and lands; A then attempts its landing. Final
    origin/main must retain `grilling` AND the answer metadata, A's attempt must be visibly refused,
    and nothing may auto-merge on the strength of A's tree.

    (v) AND THE WRITE SITE THAT ALREADY BYPASSES DISK MUST OBEY THE SAME RULE.
    `landFeedbackStatusContent` (the console's `POST /v1/feedback/decision` path) lands an
    already-serialized record through `landContent`, which skips only content identical upstream —
    it has the same no-ordering hole and must go through the same predicate.

    (vi) NOT IN SCOPE. Changing the status set or adding a seventh member; changing who may cause a
    transition (§7B pins that an operator's own reply is the only cause of `answered`); the
    cross-root path union (W1-T3560); reconciling records already damaged (W1-T3562).
  acceptance:
    - claim: "a landing whose local copy sits at an earlier lifecycle position than origin/main does not overwrite the upstream record"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "with source A at new and source B advanced to grilling, A's landing leaves origin holding grilling together with its answer metadata"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "a refused stale landing is reported on the result and in the ledger rather than being swallowed"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "a refused stale record never reaches an armed auto-merge pull request"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "a genuinely newer local record still lands exactly as it does today, so the monotonic rule does not stall the normal path"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "the console decision write path lands through the same monotonic predicate as the disk-scanning path"
      proof: "unit test: test/feedback-record-monotonic.test.ts"
    - claim: "the landing path calls the pure record-merge predicate rather than re-deciding inline"
      proof: "grep: mergeFeedbackRecord( in src/lib/feedback-landing.ts"
  falsifier: |
    CLOSE IF a landing already compares lifecycle position before staging a record. As of this
    filing the only test applied is `remoteSha !== localSha` in `landPending`, and `landContent`'s
    equivalent is `remoteSha === blobSha` — both pure inequality, neither ordered, and PR #5383 is
    the measured regression they produced.
    DO NOT satisfy this by comparing file mtimes or the `ts:` capture timestamp alone: `ts` is the
    CAPTURE time and does not move when a status advances, so it orders the wrong thing.
  note: |
    risk:high — the failure mode already reached production and broke an operator-facing route, and
    it is silent. `band_meaning: span`: the declared span is the new pure predicate plus the landing
    module that must call it (`feedback-record-merge`, `feedback-landing`), and the two are one
    invariant — a predicate nothing calls would leave the measured PR #5383 regression exactly where
    it is, which is why criterion 7 greps the call site in a DIFFERENT src file from the new module. The new module keeps the ordering rule out of `feedback-landing.ts`'s git plumbing
    so it can be exhaustively tested as a table over the six §7B statuses. depends_on W1-T3560
    because both edit `src/lib/feedback-landing.ts`'s tree-building path and the arm gate this
    composes with is filed there.
