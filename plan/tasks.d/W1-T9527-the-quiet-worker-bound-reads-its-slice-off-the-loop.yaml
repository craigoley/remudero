  design: |
    No time window and no cap. The bound stays the same quantile over every quiet episode the ledger holds.
    1. ONE SLICE READER PER DAEMON START. src/run-task.ts declares the slice `{ holder: "run-task.quiet-worker-bound",
       steps: ["worker.state", "worker.assignment"] }` and builds one `createEscalationTriageHistoryReader({ slice })`
       at module scope or daemon start, shared by every `watchDispatchSpawn`. Its durable digest means a restart or a
       run child (W1-T9085) loads only rotations it has not seen.
    2. THE HISTORY IS AWAITED. `QuietWatchdogOptions.history` returns rows or a promise of rows, and `tick` awaits it
       before `deriveQuietBound`. `watchDispatchSpawn`'s default awaits the reader (unseen rotations load off the
       loop) and returns its rows. The `busy` flag already keeps a second tick out while it waits.
    3. SAME ANSWER. An unreadable slice (`ok: false`) gives the empty history it gives today, so the bound falls back
       to the policy row and says `no_history_fallback`. A fixture corpus gives the same provider gaps, quantile and
       samples through the reader as through the whole-union read.
    4. NO SYNC UNION READ ON THE TICK. The default path never calls readLedgerUnionRecordsSync. The `readRows` seam
       stays for tests only.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Inject the reader's readFile as a
    deferred promise and spy the sync union read.
  acceptance:
    - claim: "a bound derivation whose rotation load has not resolved yet does not block a concurrent timer, and makes no synchronous union read"
      proof: 'grep: test("W1-T9527: a slow quiet-bound history read does not block a concurrent timer" in test/the-quiet-worker-bound-reads-its-slice-off-the-loop.test.ts'
    - claim: "the slice reader yields the same bound, source and samples as the whole-union read over a fixture corpus, and an unreadable slice still falls back"
      proof: 'grep: test("W1-T9527: the slice gives the same quiet bound as the whole union" in test/the-quiet-worker-bound-reads-its-slice-off-the-loop.test.ts'
    - claim: "a second spawn's bound loads no rotation the first already loaded"
      proof: 'grep: test("W1-T9527: a second spawn reloads no rotation" in test/the-quiet-worker-bound-reads-its-slice-off-the-loop.test.ts'
    - claim: "watchDispatchSpawn reads through the named slice"
      proof: 'grep: run-task\.quiet-worker-bound in src/run-task.ts'
  falsifier: |
    Restore the default `history` to readLedgerUnionRecordsSync: the first test's timer fires only after the deferred
    load and its spy counts one sync union read. Drop the durable digest by building a reader per spawn: the third
    test counts every rotation loaded twice. Let the reader keep a step the bound does not read, or drop
    `worker.assignment`: the second test's samples or provider differ from the whole-union read.
  note: |
    EFFECT, measured after deploy from the core ledger with no fixed pass mark: the gap from each spawn's `worker.state quiet`
    row to its `worker.quiet_bound` row falls from today's 12-38 s toward the 5 s poll. No stall row names parseObject
    or concat with a bound derivation inside its block, and `daemon.alive` loop_delay_max_ms in intervals holding a
    bound derivation is no larger than in intervals without one.
