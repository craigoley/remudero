    READ at origin/main 07a425844, src/lib/main-health-rung.ts:
      - `repairRedMain` writes `main.repair.unlocated` with the "names no first red merge" reason when
        `observation.firstRedCommit` is absent and no bisection is pending. That is the 18:28 path.
