  design: |
    Operator rulings: no hard thresholds (no fixed span, probe count or time cap), lean into automation.
    1. TWO LOCAL METHODS, TRIED IN ORDER, BEFORE `unlocated` IS WRITTEN. They run when no first red is read, or when
       the CI probe locator returns unlocated. They also run beside CI probes when local evidence is cheaper.
       a. NAMED-PATH ATTRIBUTION. Take the paths and identifiers the failing assertions print (the `+`/`-` lines and
          the error message of each `not ok` block, which the repair lane already holds), plus the failing test
          files. For each, find the newest first-parent merge in the candidate range that added or removed the string
          (`git log --first-parent -S<string>` over the range, in the daemon's managed checkout). The range is from
          the last green when one is known. Otherwise it runs back from the head until the failing test file is
          absent or passes (see b). A merge named by every printed string, and by no other merge, is a candidate, but
          not yet a verdict.
       b. LOCAL SINGLE-FILE BISECT. Run only the failing test files, with the CI test flags, at merge commits in a
          detached worktree. The rung has no git or test seam today (`MainHealthRungDeps` holds only fetch, issues
          and ledger readers), so it gains two injected seams, `searchHistory` for (a) and `runFilesAt(sha, files)`
          for (b). src/run-task.ts, where `buildMainHealthRung` is wired, gives them defaults on the daemon's
          managed checkout and a worker worktree under the existing worker sandbox, never the host shell. Probe the named-path candidate and its first parent first. When no candidate exists, bisect the
          range. With no green bound, step back by doubling from the head until the files pass, then bisect. Each
          probe is priced at the file's own measured duration from the failing run's log. The number of probes
          follows the range size (log2), never a fixed cap. A proof is a red at X and a green at X's first parent,
          on the same files. A file that fails at both, or passes at both, proves nothing and is named.
    2. THE EXISTING BACKSTOP JUDGES IT. The local verdicts go into `probeVerdicts` with the evidence kind `local-file`,
       so `locatedWriterRefusal` accepts a sha only with a proven red/green pair. A named path with no local proof is
       written as `main.repair.suspect` with the method and its inputs, and never names an offender.
    3. THEN THE NORMAL PATH. `main.repair.located` is written with method `named-path-bisect` or `local-bisect`, and
       the lane proceeds to its fix PR, or to the revert proposal when the fix fails, exactly as for `first-red-run`.
    4. LEDGER THE METHOD AND ITS INPUTS: the strings searched, the range and how it was bounded (`last_green` or
       `stepped_back`), each probe (sha, files, verdict, duration) and the proven pair. A new
       `main.repair.local_probe` row per probe joins the rotation-retained steps, so a rotation never re-runs one.
    5. FALL BACK, NAMED. When both methods fail, `main.repair.unlocated` is written as today, with a `local_reason`
       naming why: the failing file is absent at the range start, no probe ran, the probes disagree, or the sandbox
       was unavailable.
    6. Tests (new file, test titles verbatim as in the proofs below; drive the rung with a fake git, a fake local
       test runner and the existing probe and fetch fakes, as the W1-T7760 suite does):
       - the 2026-10-16 shape: no first red read, a six-merge range in which merge 5 adds the printed path, and a
         local runner red at merge 5 and green at merge 4. `main.repair.located` names merge 5 with method
         `named-path-bisect`. At origin/main the same input writes `main.repair.unlocated`;
       - every CI probe dispatch throws, and the local bisect still locates the culprit;
       - a named path whose local probes pass at both the candidate and its parent writes `main.repair.suspect`,
         and `main.repair.unlocated` with a `local_reason`, never `located`;
       - with a green boundary and a dispatchable CI probe, the W1-T7760 path is unchanged (positive control).
