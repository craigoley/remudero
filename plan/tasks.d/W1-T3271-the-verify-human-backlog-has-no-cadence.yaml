  title: "THE VERIFY-HUMAN BACKLOG IS JUDGED ONLY WHEN A HUMAN REMEMBERS TO ASK — 53 shards sit parked, the judge that sorts them has no schedule, and 30% of the first real sweep needed no operator at all"
