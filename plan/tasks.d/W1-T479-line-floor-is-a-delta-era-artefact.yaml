  note: "`risk: high` — MEASURED, NOT PREDICTED, AND THE REFUSAL IS RECORDED HERE RATHER THAN LEFT
    FOR THE IMPLEMENTER TO REDISCOVER. This shard was first written at `medium`, reasoning that it
    spans ONE subsystem — the coverage instrument. `rmd lint-plan` REFUSED IT: `[sizing] spans 2
    distinct subsystems/concerns (coverage-baseline, coverage-ratchet) at risk:medium — Rule 19:
    raise to risk:high or decompose`. The band is Rule 19 SPAN across two declared instrument paths,
    NOT blast radius — the blast radius is one number in one JSON file.
    automated run can choose.
    `files:` IS TIGHT ON PURPOSE. `partitionByFileOverlap` blocks on DECLARED paths, so every extra
    entry serialises this task against others naming it; `src/run-task.ts` is the fleet's
    serialisation point and is NOT declared here because this task does not touch it. `files:` IS NOT
    EMPTY, which matters: `overlappingPaths` returns the OTHER side's entire list when one side is
    empty, so an undeclared task blocks every candidate.
    RULE 25 CHECKED WITH CONTROLS, NOT ASSUMED. `scripts/coverage-baseline.json` and
    `scripts/coverage-ratchet.mjs` are both INSTRUMENT_SURFACE; this changeset is instrument + test
    and reads NOT entangled (control: adding any `src/` path flips it to ENTANGLED). So the
    implementation must not pick up a `src/` fix along the way.
    `test/coverage-ratchet.test.ts` is declared as the assertion suite; note it invokes the ratchet as
    a SUBPROCESS rather than importing it (measured: 0 direct invocations of `evaluateRatchet` across
    all of test/, 4 mentions in that file, against a positive control of 127 test files mentioning
    `coverage`), so a falsifier here is a fixture, not a unit call. DROP ANY DECLARED PATH THE
    IMPLEMENTATION DOES NOT TOUCH.
    PROVENANCE. The 17-reading CI figure is from GitHub job logs and is host-independent. The ~98,872
    `LF` used only to convert points into lines is from a LOCAL mini run and is marked as such. The
    two hosts keep separate ledgers with no SSH route between them; nothing here rests on either."
