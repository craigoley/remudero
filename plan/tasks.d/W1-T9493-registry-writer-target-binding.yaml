    - claim: The selected Git file identity and current revision are verified before effects
      proof: 'unit test: registry writer checks regular file identity and revision before writes'
    - claim: Proposal effects bind only the chosen repository path branch and file SHA
      proof: 'unit test: registry writer targets only chosen repo path and file SHA'
    - claim: The actual authenticated route snapshots its target without weakening confirmation
      proof: 'unit test: registry writer route snapshots target without weakening operator confirmation'
    - claim: Partial failure never becomes a success receipt or unexplained repeated effect
