- id: W1-T3245
  title: "THE DEPLOY SUPERVISOR HAS NEVER BEEN SCHEDULED ON THE FLEET HOST — it exists as a launchd plist for the retired Mac mini, `install-host-units.sh` renders seven systemd units and none of them is it, and the one cron job that could pull runs `--reclaim-only`, which by contract does not"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  risk: high
  origin: "operator-session#no-image-has-ever-been-deployed-on-a-schedule-2026-09-09"
  plan_refs: ["W1-T3200", "W1-T3240", "W1-T2877", "W1-T2953", "W1-T3233"]
  files: [deploy/install-host-units.sh, docs/operator-guide.md, test/host-units-install.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED READ-ONLY ON THE AZURE HOST, 2026-09-09. `systemctl list-units` names exactly three
    rmd units: `rmd-fleet.service`, `rmd-fleet-watchdog.timer` and `rmd-reap-stray.timer`.
    `deploy/install-host-units.sh` renders SEVEN artifacts — launcher, fleet service, watchdog
    service + timer, reaper bin + service + timer — and its own suite asserts that count
    ("install must render all seven units"). NONE OF THEM IS THE DEPLOY SUPERVISOR.

    IT EXISTS, FOR THE WRONG HOST. `src/lib/launchd.ts`'s header: "Builds launchd .plist TEXT for
    the daemon, serve, digest and deploy-supervisor units". launchd is macOS — the Mac mini. When
    the fleet moved to Azure and systemd, the daemon, the watchdog and the reaper were ported and
    the deploy supervisor was not.

    SO NOTHING ON THIS HOST HAS EVER PULLED AN IMAGE ON A SCHEDULE. The crontab is two lines: the
    five-minute heartbeat, and `deploy/host-update.sh --reclaim-only` at 04:17 daily.
    `--reclaim-only` is documented in that script as reclaiming disk and prints "(no pull, no
    restart under --reclaim-only)". Every image this fleet has ever run was deployed by hand.

    THE WATCHDOG IS WHAT RECREATES THE CONTAINER, AND IT PULLS NOTHING — BY DESIGN. MEASURED
    2026-09-09: the running container was created at 10:15:01.930Z and the revival log carries
    `2026-09-09T10:15:01Z revive boot=0 prev_status=exited prev_exit=1 prev_restarts=5` at the same
    instant. `rmd-relaunch.sh` reaches `docker run` with NO `docker pull` anywhere in it, so every
    revival recreates the container from the LOCALLY CACHED image. The 11:14Z build published a new
    `:latest` an hour later and nothing has fetched it; the container's own
    `/etc/rmd-build-sha` still reads c6baa842, the 2026-09-06 build.

    AND THAT OMISSION SHOULD NOT BE "FIXED" BY ADDING A PULL TO THE LAUNCHER. A watchdog's job is
    reviving a crash-looping fleet, and adopting a freshly built, untested image MID-CRISIS is the
    wrong instinct: during a crash loop the known-good cached image is exactly what you want. The
    launcher is right to pull nothing. What is missing is a SEPARATE, SCHEDULED path that deploys
    deliberately when the fleet is healthy — which is what the supervisor is and what this task
    installs.

    THE TOOL IS ALREADY CORRECT AND ALREADY THERE. `deploy/recycle-container.sh` pulls, and REFUSES
    on a failed pull rather than falling through to a `docker run` on whatever is cached — the
    2026-08-18 incident is written into its header. Its only executing caller in the repo is
    `src/lib/deployer.ts`'s recycle backend, reached through `runDeployCycle` and `rmd deploy-run`.
    MEASURED: nothing under /etc/systemd/system, /etc/cron*, /var/spool/cron or root's crontab
    references it, and no workflow deploys — `acr-build.yml` says "THIS BUILDS. IT DEPLOYS NOTHING."
    SO THE GAP IS THE TRIGGER, NOT THE TOOL.

    AND THE CAPABILITY WAS FIXED FOR THIS HOST FIVE HOURS AGO. W1-T3200 (#4720, merged
    2026-09-09) exists because "the deploy supervisor kickstarted the daemon only via `launchctl`,
    which is ABSENT on the fleet's actual Linux host — the automatic restart path never ran there,
    indistinguishable from 'nothing needed restarting'". It added a `recycle-container` restart
    backend selected by PROBED capability, specifically so the supervisor works on this host. THE
    BACKEND SHIPPED AND THE SCHEDULE NEVER DID. That is the partial-fix-reads-as-complete shape
    W1-T3239 files, and it is the fourth instance in one session.

    THIS IS THE PREREQUISITE FOR W1-T3240, NOT A DUPLICATE OF IT. W1-T3240 makes
    `decideDeployTrigger` able to SEE image drift, which it cannot today. Both are needed and
    neither is sufficient: a trigger that can see drift still never fires if nothing invokes it,
    and a scheduled supervisor that cannot see drift reports `up-to-date` over a stale image
    forever. W1-T3240 is already built; this is the half that makes it reachable on Azure.

    OPERATOR RULING 2026-09-09, AFTER RESEARCH: FOLD IT INTO THE WATCHDOG'S EXISTING TICK, DO NOT
    ADD A SECOND TIMER. The controller literature is unambiguous that reconciliation must be
    LEVEL-TRIGGERED — a loop that reads observed state and converges, correct "regardless of how
    many intermediate updates were missed", with edge-triggering permitted only as an optimisation.
    The watchdog ALREADY IS that loop: every five minutes it observes "is the daemon running" and
    converges. Asking "is the image current" is the SAME loop asking a second question about the
    same desired state, and a separate timer would be a second reconciler over one subject — the
    thing the pattern exists to avoid.

    TWO DECISION FUNCTIONS IN ONE TICK, NEVER ONE WEIGHTED SCORE. A restart and a recycle are
    different in KIND, not degree:
      RESTART  mount-side, tens of commits a day, seconds, no preconditions, costs churn when wrong,
               and is ALREADY HANDLED — the daemon's own freshness check exits 75 and the entrypoint
               re-fetches. This task does not touch it.
      RECYCLE  image-side, ~1 baked-path commit a day, minutes, and gated on credentials, an idle
               fleet, a successful pull and a digest match — every one of which took the fleet down
               once, which is why `recycle-container.sh`'s four refusals exist. Costs stranded
               workers and a wrong image when wrong.
    Collapsing them into one pressure number would average a cheap frequent action with an
    expensive rare one, and the number would be DOMINATED BY THE CHEAP FREQUENT SIGNAL — precisely
    backwards. THE THRESHOLD IS NOT THE DIFFERENTIATOR EITHER: one baked-path commit already
    warrants a recycle, and there is no useful "accumulate five" rule when baked commits are rare
    and each one matters. What differs is which REFUSALS must pass first.

    WHERE THE PRESSURE INSTINCT DOES APPLY IS DEFERRAL, AND THAT MACHINERY EXISTS. `daemonIsIdle`
    plus `DEPLOY_IDLE_DEFER_CEILING_MS` already say "wait for quiet, but not forever". Nothing new
    is needed and nothing new should be invented.

    WHY A SYSTEMD TIMER AND NOT A GITHUB ACTION. `acr-build.yml` states that it stores "no Azure
    secrets in the repo; only the non-sensitive client/tenant/subscription IDs are repo vars", and
    that property is deliberate. Deploying from Actions needs a credentialed path INTO the VM,
    which trades that property away for something a local timer already has for free — the host
    already runs `rmd`, already has docker, and already schedules three other units the same way.

    THREE TASKS NOW SHARE `install-host-units.sh` AND THEY ARE DIFFERENT WORK, RULED ON RATHER THAN
    NARROWED AWAY. W1-T2953 RECONCILES the renderer with units already installed on Azure — it adds
    no unit and changes no behaviour, it stops `--install` from downgrading the host. W1-T3233 adds
    a READER to the existing launcher so a repeated identical revival is counted and announced.
    THIS TASK ADDS A UNIT THAT DOES NOT EXIST IN ANY FORM ON THIS HOST. They touch one file because
    that file renders every host unit; that is the renderer's job, not an overlap. THE ORDER IS
    W1-T2953 FIRST — until it lands, `--install` cannot safely be run for either of the others, so
    both of them land in the renderer and wait. `files:` stays as declared; narrowing it would hide
    the convergence from the dispatcher rather than rule on it.

    COMMISSIONING IS BLOCKED BY W1-T2953 AND THAT MUST BE STATED, NOT DISCOVERED. Installing any
    new unit means running `install-host-units.sh --install`, and W1-T2953 measured that doing so
    TODAY would DOWNGRADE the live host — the installed units carry stronger mount ordering, timer
    persistence and an 8192MiB heap ceiling the renderer does not yet reproduce. So this task
    lands the unit in the renderer; commissioning it waits on W1-T2953. It is the third thing this
    session to queue behind that task.

