    - claim: "the rendered unit invokes the supervisor rather than restarting the daemon directly, so the idle gate, health check and rollback all still apply"
      proof: "unit test: W1-T3245: the deploy unit runs the supervisor, never a bare restart"
    - claim: "the STOP lever still outranks it, so a halted fleet is never deployed into"
      proof: "unit test: W1-T3245: a STOP marker refuses the scheduled deploy"
