  rationale: |
    READ 2026-10-06 on the PR #9778 head (bfcd880b4, W1-T6106's build, open at filing). Its census
    (test/every-host-git-spawn-into-a-worktree-uses-the-hardened-leaf.test.ts `RAW_SITE_EXCEPTIONS`) allows, outside
    src/run-task.ts: src/lib/sweep.ts 11, src/lib/worker.ts 10, src/lib/retro.ts 6, src/lib/orientation.ts 4,
    src/lib/relint.ts 2, src/lib/composition-root.ts 1, src/lib/review-worktree-reclaim.ts 1, src/spike.ts 1. Counting
    its `WORKTREE_TARGET` pattern per enclosing top-level function at that head: sweep.ts buildSweepEffects 6,
    readBaselineRatchetWorktreeState 3, headIsInWorktree 1; worker.ts worktreeAddAsync 6, worktreeAdd 3,
    excludeNodeModulesFromGit 1; retro.ts stampCitationsAndCommit 4, defaultFreshShardTextReader 2; orientation.ts
    regenerateOrientation 4; relint.ts newMonolithIdsAgainstBase 2; composition-root.ts realReviewWorktree 1;
    review-worktree-reclaim.ts defaultReadHeadSha 1; spike.ts main 1. The census reason for worker.ts says
    worktreeAdd/worktreeAddAsync "cut and wire the worktree (before any worker runs)" — a HARNESS-only tree at that
    moment — while the sweep's fix rounds and the retro's commit address trees a worker or a PR head wrote.
  design: |
    The same classification W1-T6121 applies to src/run-task.ts: (1) class every raw git site in these eight files,
    whatever its `-C` target is named, as WORKER, REVIEWER or HARNESS by what wrote the tree it addresses; (2) convert
    every WORKER and REVIEWER site to `hostWorktreeGit` / `hostWorktreeGitAsync`; (3) record each remaining HARNESS
    site in the census exception with its class and reason and lower each count to exactly what is left; (4) argv,
    outputs and error shapes are unchanged. A site whose tree's writer cannot be decided from the code stays raw only
    with a reason that says so, never silently.
  acceptance:
    - claim: "every raw git -C argv left in the eight files carries a recorded harness-only class and reason, the sweep's fix-round reads and the retro's citation commit run through the hardened leaf, and on a fixture worktree whose .git pointer names a planted gitdir with a core.fsmonitor marker neither writes the marker"
      proof: "unit test: test/the-remaining-host-git-calls-into-a-worktree-go-through-the-leaf.test.ts"
  falsifier: |
