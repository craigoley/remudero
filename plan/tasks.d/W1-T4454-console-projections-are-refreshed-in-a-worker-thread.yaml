  rationale: |
    W1-T4451 moves refresh off the request stack, but a synchronous projection still blocks the loop for its
    whole duration whenever it runs, so every other route (tunnel health check, writes, SSE) waits on it. The
    pattern to fix this already exists in core: src/lib/status.ts and src/lib/repo-dashboard-route.ts spawn a
    worker_threads worker with a documented synchronous fallback. W1-T4075 moves the DAEMON tick's reads off its
    loop; this task is the gateway (serve) side and does not touch the daemon.
  design: |
    (1) A new src/lib/console-projection-worker.ts exports startConsoleProjectionWorker and runs the feedback, status and operator-activity projections in a
    worker thread that owns its own incremental ledger tail (bounded by window, never the full rotation union per
    refresh) and posts the finished JSON as a string. The main thread only swaps the buffered body in the W1-T4451
    cache. On worker spawn failure or crash it falls back to the synchronous build and logs a reason-carrying
    ledger line, exactly as status.ts does. (2) Background refresh: while gatePrewarmOnClients.noteRead has seen a
    reader within the last minute, each cached path refreshes on its own minRefreshMs cadence off the request path;
    with no viewer nothing runs (the W1-T154 quota rule). serve.ts: zero net comment lines. Out of scope: watchInstanceLiveness and
    fleet-liveness.ts; another agent is fixing that stall now.
