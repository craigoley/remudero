  rationale: |
    OBSERVED at origin/main 948173f3: src/lib/verdict-calibration.ts:399-553 already computes
    verdict-class totals, revertedCount, followupFixedCount, and refusal reasons over a stated
    attribution window and minimum population floor. The current console-v1 projection does not
