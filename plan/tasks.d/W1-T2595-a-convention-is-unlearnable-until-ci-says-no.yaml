- id: W1-T2595
  title: "FOUR CENSUS SUITES ENFORCE AUTHOR-TIME CONVENTIONS THAT A WORKER CANNOT LEARN UNTIL CI IS RED — bound-kind-declared, catch-erasure-ratchet, config-reader-seams and route-scope-matrix each refuse a shape (an undeclared bound, a reasonless catch, an unseamed policy read, an unswept route) that nothing checks before a push; MEASURED 2026-09-01: three PRs in one evening reddened this family and every one of the seven causes was a convention the author had no way to discover, while `rmd preflight --ci-parity` — the gate that exists to shell CI's own commands — runs none of them"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 8.00
  files: [src/lib/ci-parity.ts, test/fast-gate-admits-the-census-class.test.ts, test/a-convention-is-unlearnable-until-ci-says-no.test.ts]
  origin: "operator-brief#census-family-unlearnable-2026-09-01"
  plan_refs: ["W1-T294", "W1-T338", "W1-T1266"]
