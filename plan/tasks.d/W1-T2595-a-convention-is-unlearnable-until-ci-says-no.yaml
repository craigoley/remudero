  rationale: |
    ── MEASURED, ONE EVENING, THREE PULL REQUESTS ──────────────────────────────────────────────

      #3535  all four suites — an undeclared bound x2, four reasonless catches, an unseamed
             policy read, a route the scope matrix had never been taught about
      #3542  catch-erasure-ratchet — one new catch in a parse helper
      #3541  catch-erasure-ratchet — two capability catches in a brand-new file

    SEVEN causes, every one an author-time convention, every one discovered only when a shard went
    red. In each case the reasoning the check wanted ALREADY EXISTED in the diff — in a function's
    doc comment, in the constant's own JSDoc — just not in the position the census reads.

    ── WHY THIS IS THE EXPENSIVE SHAPE, NOT MERELY AN ANNOYING ONE ─────────────────────────────

    CLAUDE.md's own framing: "a rule stated ONLY here can be violated silently and repeatedly,
    which is why several of these bullets exist at all". These four ARE enforced — that is not the
    gap. The gap is WHEN. A convention that first speaks after a full sharded CI cycle costs the
    whole cycle plus a fix push, per occurrence, forever, and it teaches nothing durable because
    the next worker starts with the same blank slate.

    ⚠ AND THE COST IS PAID BY EVERY PR THAT ADDS SOURCE, not by careless ones. A new `export const
    SOMETHING_MAX`, a new `catch`, a new policy read, a new route — that is ordinary work. The
    census population is "PRs that add code", so the toll is structural.

    ── THE GATE THAT SHOULD CARRY THEM ALREADY EXISTS ──────────────────────────────────────────

    `rmd preflight --ci-parity` (`src/lib/ci-parity.ts`, W1-T294) shells CI's OWN commands, one
    entry per `.github/workflows/ci.yml` job, and CLAUDE.md already instructs every lane to run it
    before a first push. It is the right place by construction: no new mechanism, no second copy of
    the rules, and a worker that runs the shipped gate as instructed learns at author time.

    ⚠ THE DANGEROUS DIRECTION IS MAKING THE GATE SLOW ENOUGH TO SKIP. These four suites are source
    scans, not spawns — they must be measured, and the entry must stay inside the bound the census
    already holds `runPreflightFast` to. A gate that doubles in wall-clock is a gate lanes stop
    running, which would trade a visible CI failure for an invisible one.

    ⚠ AND IT MUST NOT BECOME A SECOND COPY OF THE RULES. The parity entry runs the SUITES; it does
    not re-implement their predicates. A reimplementation drifts from the census and then certifies
    green against a rule CI no longer enforces — the vacuous-pass family, one layer up.

    ── THE COUNT THIS TASK MUST MOVE LIVES OUTSIDE ITS ORIGINAL `files:` (added 2026-09-04) ─────

    MEASURED at origin/main: `FAST_GATE_STEPS` holds 13 entries, 4 of them census (bound-kind,
    catch-erasure, negative-reachability, no-shallowing) and 9 non-census, while `CENSUS_POPULATION`
    — the roster W1-T2521's successor introduced so the set is named rather than numbered — carries
    FIVE members. So a fifth is already recognised and unwired, and admitting any further census
    suite changes the wired count.

    `test/fast-gate-admits-the-census-class.test.ts` still pins that count BY HAND, twice:

        assert.equal(CENSUS_STEPS.length, 4, "the task admits exactly four of the six measured census suites")
        assert.equal(NON_CENSUS_STEPS.length, 9, ...)

    Neither is derived, so adding an entry reddens that suite — and it was NOT in this task's
    `files:`, which named only `src/lib/ci-parity.ts` and this task's own test. A builder would
    have shipped a green scoped run and a red `ci`, then discovered the wall at review. This is the
    census-suite blind spot CLAUDE.md records as hazard (j): `git grep -l <symbol>` cannot find a
    suite that asserts a POPULATION SIZE rather than naming your symbol.

    RULE 19 FOLLOWS FROM THAT, AND DECOMPOSING WOULD RE-CREATE THE WALL. With the second test
    declared the linter reads "spans 2 distinct subsystems (ci-parity, fast-gate-admits-the-census-
    class) at risk:medium — raise to risk:high or decompose". Splitting the count away from the
    entries it counts is precisely the shape that made this invisible, so the band is `high` with
    `band_meaning: span`, at which the linter reports and does not refuse (W1-T2503). The budget is
    deliberately left at its filed figure — a spend decision is the operator's to record, not an
    amendment's.

    The path is added to `files:` so the count can move with the entries it counts. Deriving it
    from `CENSUS_POPULATION` instead of re-pinning a larger literal is the better fix and is left to
    the builder's judgement; either satisfies this task, and neither is a change to what any census
    ACCEPTS.

    ⚠ EVERY ACCEPTANCE CRITERION BELOW IS ALREADY SATISFIED ON origin/main (measured 2026-09-04),
    AND THE PREMISE THIS SHARD RESTS ON IS FALSE. RECOMMEND CLOSING WITHOUT IMPLEMENTATION.

    W1-T2478 admitted the census class to the habitual gate on 2026-08-30 (868ff027). Read back
    from the shipped module today, `FAST_GATE_STEPS` carries all four as entries that SPAWN each
    suite — not a re-implemented predicate — every one inside the shared bound:

        bound-kind-census             script=census:bound-kind             measured  470ms
        catch-erasure-census          script=census:catch-erasure          measured  803ms
        negative-reachability-census  script=census:negative-reachability  measured 1201ms
        no-shallowing-census          script=census:no-shallowing          measured  526ms
        FAST_GATE_CENSUS_BOUND_MS = 2000

    That is criterion 1 (the gate runs them), criterion 2 (it invokes the suites rather than
    re-implementing them — each entry's script is `census:<name>`), and criterion 3 (all four
    measure under the bound), with nothing left to build. W1-T2643 later made the set a DERIVED
    projection of `CENSUS_ADMITTED_MEMBERS`, so a hand-added step beside it cannot occur.

    THE DATES ARE WHAT SETTLES IT, AND THEY WERE NOT CHECKED WHEN THIS WAS FILED. The three PRs
    the rationale measures — #3535, #3542, #3541 — all merged 2026-09-01, TWO DAYS AFTER the
    admission. So the gate already ran these four suites when those PRs were authored, and they
    hit CI anyway. The evidence does not support "the gate does not run them"; it refutes it.

    ⚠ THE REAL GAP THE SAME EVIDENCE DOES SUPPORT, stated so it is not lost with this task: the
    conventions are reachable at author time ONLY through `rmd preflight --fast`, and CLAUDE.md's
    "Before you push" rule names `rmd preflight --ci-parity` instead. Measured: NONE of the four
    census jobs appears in `CI_PARITY_TABLE`, and `preflightCommand`'s own doc says `--ci-parity`
    "shells the FULL `npm run test:ci` suite ... and is therefore not a mode a worker can run
    habitually". So a lane following CLAUDE.md literally either pays minutes or learns nothing.
    Whether the fix is a doc change, a mode change, or admitting the census entries to the parity
    table is a separate decision, on evidence this task's rationale collected and its own remedy
    would not have addressed.

    NOT IN SCOPE: changing what any of the four census suites accepts (W1-T2596 covers their escape
    hatches), and the shard/summary reporting question (W1-T2597).

