    - claim: "an unreadable depth measurement omits the fields rather than recording a guessed value, and the boot continues either way"
      proof: "unit test: test/daemon.test.ts"
    - claim: "a shallow checkout is recorded and the boot still completes rather than refusing to start"
      proof: "unit test: test/daemon.test.ts"
    - claim: "a health check reports a shallow checkout as a failure naming the reachable commit count and the remedy command"
      proof: "unit test: test/doctor.test.ts"
    - claim: "a depth measurement that could not be taken reports as unreadable rather than as healthy"
      proof: "unit test: test/doctor.test.ts"
    - claim: "a full checkout still prints its reachable commit count so the horizon is legible when it is fine"
      proof: "unit test: test/doctor.test.ts"
    - claim: "the new arm is report-only: it repairs nothing, fetches nothing and changes no exit path other than its own verdict"
      proof: "unit test: test/doctor.test.ts"
    - claim: "the verdict is a pure function over measured inputs, callable with no git and no live process"
      proof: "grep: judgeCheckoutDepth( in src/lib/doctor.ts"
    - claim: "the measurement is taken by the caller that already resolves the boot head sha, not inside the module that must touch no filesystem"
      proof: "grep: readCheckoutDepth( in src/run-task.ts"
