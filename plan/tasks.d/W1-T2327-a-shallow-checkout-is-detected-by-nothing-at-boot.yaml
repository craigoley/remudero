  note: |
    `risk: high` IS SET UP FRONT for the SPAN, per Rule 19 and `sizingViolation`
    (`src/lib/task-linter.ts` L200-L212): the declared `files:` cross three code modules, which
    refuses `medium` by construction. The edit itself is small in each — one trailing parameter and
    two record fields, one pure judge plus one line in a composition list, one measurement closure
    beside an existing one and one seam in the check inputs.

    `verify: auto` IS HONEST HERE. Every deliverable is a pure function over supplied numbers or a
    field on a record a test already asserts — no live checkout, no network and no daemon is needed
    to prove any acceptance criterion. The one thing a test cannot prove is that the canonical
    checkout on any given host is deep, which is not what this task claims.

    `budget_usd 45` — three small edits plus their fixtures, sized against W1-T2326's 45 for a
    comparable multi-seam change in one module and its test.

    NO `depends_on`. W1-T2328 asks what CAN shallow the checkout; this asks whether anything would
    NOTICE. Either can ship first and neither weakens the other — a detector with no cause found is
    still a detector, and a cause found with no detector is still silent next time.

    WHY THIS IS NOT ALREADY COVERED, CHECKED BEFORE FILING. `MASTER-PLAN.md`, `LEARNINGS.md` and
    `DECISIONS.md` contain the string "shallow" ZERO times each. The plan corpus contains it only in
    provenance blocks (a human's hand-run check), in W1-T472 design (v) as a NAMED TRAP inside a
    different task's scope, and in W1-T1260's rationale as an observation that the whole-plan lint
    signal was byte-identical shallow and unshallow except for the one clause that refused. No task
    owns proactive detection.

    THE FALSIFIER FOR THIS TASK'S PREMISE, STATED SO IT CAN FAIL: if a boot-time depth field would
    duplicate a fact some existing row already carries, this is redundant. It does not — the eleven
    doctor arms and the six `daemon.boot` fields are enumerated in the rationale with their line
    numbers, and none of them is about history depth.
