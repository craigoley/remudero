- id: W1-T2327
  title: "A SHALLOW CANONICAL CHECKOUT BREAKS EVERY HISTORY READ SILENTLY AND NOTHING PROACTIVE ASKS — the boot record carries env, node path, node version and head sha but never the horizon those reads are computed over, `rmd doctor` has eleven arms and no depth sibling, and the only detector in the fleet is one linter's refusal that fires when it happens to need history"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  rationale: |
    FILED FROM SOURCE READING ONLY, in the triage worktree — no command was run, no ledger was read,
    and every figure below is a TREE FACT with its file and line named so the implementer re-derives
    rather than trusts. The incident that prompted it is feedback fb-1786001088591-dbf763.

    (1) THE INCIDENT, AND WHY IT IS A DETECTION FINDING RATHER THAN A GIT FINDING. The canonical
    checkout answered `--is-shallow-repository` true holding 208 commits against a repo with 980,
    with a normal `remote.origin.fetch` refspec and no partial-clone filter. It surfaced only because
    #1407's merge-evidence split REFUSES on a shallow clone BY NAME — `src/run-task.ts` around
    L14508-L14517, "shallow clone — truncated history would misread absent commits as absent
    evidence". That guard is correct and earned itself; it is also an ACCIDENTAL detector, because it
    only speaks when a linter that needs history happens to run.

    (2) THE ASYMMETRY, WHICH IS THE WHOLE ARGUMENT. A shallow clone breaks READS and breaks nothing
    LOUDLY. Every history-shaped answer stays plausible and is computed over a fraction of the
    corpus: `git log -S` symbol archaeology, merge-base checks, `git log --follow`, and the
    implementing-commit evidence recons rest on. `docs/operator-guide.md` L450-L457 already MEASURED
    this class — a 120-commit clone answered ZERO deletions for a file deleted before its horizon and
    zero for any path, while the obvious "does this query return rows" control passed loudly at 1,495
    additions. Its remedy is a HUMAN DISCIPLINE ("unshallow before asking anything about history, and
    report `git rev-list --count HEAD` alongside the answer"). A discipline is not a detector.

    (3) THE FLEET'S EXISTING SHALLOW HANDLING IS PER-READER AND SPLIT DOWN THE MIDDLE, so no single
    reader's posture generalises. REFUSE-BY-NAME: `src/run-task.ts` L14508-L14517 and L13425-L13437,
    `src/lib/measurement-cadence.ts` L641-L649. FAIL-OPEN-BY-DESIGN, each for its own stated and
    defensible reason: `src/run-task.ts` L14646-L14647 returns `undefined` on shallow, L14842 fails
    open on a shallow checkout, `src/lib/image-drift.ts` L37-L38 and L140 resolve to "unmeasurable",
    `src/lib/proof-queue-audit.ts` L341 fails open. NOTHING IS WRONG WITH EITHER POSTURE — what is
    missing is the one place that asks the question when nobody needed an answer.

    (4) THE BOOT RECORD ALREADY CARRIES EVERY SIBLING FACT AND NOT THIS ONE. `daemonBoot`
    (`src/lib/daemon.ts` L1943-L1950) logs `daemon.boot` with `env_clean`, `billing_mode`,
    `node_path`, `node_version`, optional `node_drift` and optional `head_sha` — the identity of the
    code, the runtime and the billing mode, and no statement of the HISTORY HORIZON those readers
    will compute over. The precedent for adding one is exact and in the same function: W1-T991's node
    provenance, and `bootHeadSha`, which the CALLER measures (`src/run-task.ts` L19489-L19498,
    `git rev-parse HEAD` in a try/catch, omitted rather than guessed on failure) because
    `src/lib/daemon.ts` never touches the filesystem by its own header.

    (5) `rmd doctor` HAS ELEVEN ARMS AND NO DEPTH SIBLING. `buildDoctorReport`
    (`src/lib/doctor.ts` L710-L722) composes: ledger-freshness, dispatch-stall, repair-stall,
    dispatch-liveness, sweep-liveness, pause-honoured, lock-vs-process, lane-less-workers, git-locks,
    disk-headroom, memory. `git-locks` is the closest kin — it already reports a REPO-STATE fault
    (`judgeStaleGitLocks`, L489-L497) and stops there. A checkout-depth arm is the same shape at the
    same layer, and the reader seam beside it already exists (`readGitLocks` wired at
    `src/run-task.ts` L20985).

    (6) THE COST OF HAVING NO RECORD IS ALREADY PAID, AND IT IS THE FEEDBACK'S OWN OPEN QUESTION.
    "UNKNOWN: when it became shallow and what did it." Nothing anywhere writes the depth of the
    canonical checkout at any time, so there is no series to difference and the question is
    unanswerable after the fact — not hard, unanswerable. A `commit_count` on every `daemon.boot` row
    turns the next occurrence into a bounded interval between two boots.

    (7) THE CONVENTION THIS REPLACES IS REAL, MANUAL AND REPEATED. At least six shards record a
    hand-run depth check in their provenance blocks before trusting any history query —
    W1-T2201 L123, W1-T2204 L153, W1-T2241 L141, W1-T2260 L125, W1-T2261 L146, W1-T1284 L136, plus
    W1-T1258 L68-L69 which states outright that a shallow clone would have made one of its paths a
    false negative WITH A PASSING CONTROL. Every one of those is a human remembering. This task does
    not remove that discipline; it stops the fleet depending on it.
  design: |
    (i) MEASURE AT THE CALLER, RECORD AT BOOT, JUDGE IN A PURE FUNCTION — the three-way split this
    repo already uses for node provenance and the head sha. The caller reads
    `git rev-parse --is-shallow-repository` and `git rev-list --count HEAD` exactly where it already
    reads `bootHeadSha` (`src/run-task.ts` L19489-L19498): best-effort, in a try/catch, OMITTING the
    fields rather than inventing them when git is unavailable. `daemonBoot` takes them as a TRAILING
    parameter — that function's own "no positional caller shifts" discipline is explicit at
    `src/lib/daemon.ts` L1911-L1932 — and records them on the existing `daemon.boot` row. NO NEW
    LEDGER ROW; the boot record is the boot record.

    (ii) A SHALLOW CHECKOUT MUST NOT HALT THE BOOT. T197 doctrine, restated in this same function for
    the keychain rung (`src/lib/daemon.ts` L1969-L1976): the daemon sleeps through problems, the
    fault is ledgered with its named class, and boot continues. A daemon that refuses to come up on a
    shallow tree converts a silent read fault into a total outage, and the readers that MUST NOT
    compute already refuse for themselves (rationale (3)).

    (iii) THE DOCTOR ARM, `checkout-depth`, AS A PURE JUDGE. `judgeCheckoutDepth(...)` in
    `src/lib/doctor.ts` beside `judgeStaleGitLocks`, added to `buildDoctorReport`'s list, taking
    already-measured inputs so every verdict arm is reachable from a test with no git and no daemon
    — that file's header (L31-L33) requires exactly this.
      - shallow ⇒ FAIL, measured as the reachable commit count, threshold "full history", detail
        naming the remedy `git fetch --unshallow` in the operator-guide's own words. FAIL RATHER THAN
        WARN IS DELIBERATE: the fault is invisible by construction and the remedy is one command.
      - unreadable (no git, not a repository, a throw) ⇒ WARN "unreadable", NEVER OK. A read that
        FAILED reported as a read that SAID NO is the eighth instance of a class this repo has
        measured seven times (W1-T472 design (v) names the count).
      - full ⇒ OK, measured as the commit count, so the horizon is printed even when it is fine —
        that is the operator-guide's own prescription, applied where a reader already looks.

    (iv) REPORT ONLY, AND NOTHING UNSHALLOWS ANYTHING. `rmd doctor` refuses `--fix` BY NAME with a
    stated reason (`src/lib/doctor.ts` L732-L738: a second actor mutating state a live daemon depends
    on). An automatic `git fetch --unshallow` at boot is exactly that second actor, on a possibly
    metered link, fetching the whole history at the least convenient moment. THE ARM PRINTS AND
    STOPS.

    (v) EXPLICITLY NOT IN SCOPE, each with its reason.
      - Changing any existing refuse-by-name or fail-open reader. Both postures are defensible per
        reader and rationale (3) makes no argument against either.
      - Unifying the three duplicated refusal strings into one shared helper. Real, small, and a
        different concern; it would widen this task's span for no detection gain.
      - A per-WORKTREE depth check. A worker's worktree shares the canonical object store, so it is
        the same fact measured twice; if that stops being true it is a new finding, not this one.
      - Deciding WHAT made the checkout shallow. That is W1-T2328, which this task does not depend
        on and does not answer.
  acceptance:
