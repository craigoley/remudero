  rationale: |
    OBSERVED 2026-10-14 on the core ledger, read-only:
      - 09:40:46Z #11629 went own-red (blocker_owner fix-lane) on head 1ccf26c. 09:54:14Z the sweep's own
        base-fixed refresh moved it to 3b421f3; the stage kept blocker_since 09:40:46Z.
      - From 09:46Z every sweep.disposed row for it reads "NOT DISPATCHED this pass: fleet PAUSE hold: PAUSE
        requested: container recycle" or "deferred to full sweep (light pass)". An orphaned recycle PAUSE held
        core from 08:12Z to 10:57Z (W1-T9409/W1-T9410). No fix.dispatch row exists for the PR in that window.
      - 10:26:38Z pr.stuck {blocker own-red, bound_minutes 45, bound_kind BACKSTOP, diagnosis "unknown
        signature"}; 10:27:15Z escalation.issue_opened MANUAL #11639 "own-red for 45 minutes".
      - After the PAUSE lifted: fix.stood_down at 11:07:48Z, 11:14:38Z and 11:18:09Z, each "a needs-human
