        closed, the head moves, or the task contract changes". The red was infrastructure (a cancelled CI
        attempt, then a hung leak-locate probe, W1-T9426), and a plain re-run of the failed jobs turned every
        check green. No repair was ever attempted by the fleet.
    READ on origin/main c3753e8f8, src/lib/sweep.ts, the `reportStuckStage` closure in runSweep: the backstop
    fires when `blocker_age_ms` exceeds `policy.stageBackstops[blocker].minutes`, measured from blocker_since.
    It skips only when `standDownReason` names MERGED or CLOSED, or when a fix.dispatch has happened since
    blocker_since. A pass that stood down because the fleet itself withheld the repair (a fleet PAUSE, a
    dispatch hold, capacity) still counts toward the bound, so a long PAUSE escalates every red PR it held.
  design: |
    No new constant. The backstop measures how long the stage's OWNER had the chance to act.
    1. When a pass's stand-down reason is a hold the fleet placed on itself (a fleet PAUSE or STOP hold, a
       dispatch hold, a capacity or light-pass deferral), that pass does not count toward the stage's
       backstop. Measure the stage's age as the time since blocker_since minus the time those passes covered,
       read from the stage's own sweep.disposed rows. Do not keep a separate in-memory clock.
    2. The pr.stuck row keeps blocker_since and adds `held_ms` (the excluded time), so the escalation text
       and the ledger say how much of the age was the fleet's own hold.
    3. Nothing else changes. A red that stays undispatched while the fleet is NOT holding itself still
       escalates at the same bound.
    Tests go in the new file, titled verbatim as in the proofs. Drive runSweep with the existing sweep test
    helpers and a ledger whose disposed rows carry a PAUSE stand-down.
