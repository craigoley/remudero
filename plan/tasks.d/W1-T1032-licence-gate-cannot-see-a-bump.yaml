    anchor. NEGATIVE CONTROL, the identical plain refspec carrying a different sha at the taken
    refs/rmd-id/W1-T1031: rc=1, `! [rejected] … (fetch first)`, that ref still 9b3b65d5. `could not
    read Username` 0 and `403` 0 on BOTH pushes. THE REFS WERE RE-SWEPT IMMEDIATELY BEFORE MINTING.
    SURFACES — AND ONE OF THEM COULD NOT BE READ, WHICH IS SAID RATHER THAN GLOSSED. Refs (max 1031;
    W1-T1032 = 0), shard FILENAMES via `git ls-tree -r` (W1-T1032 = 0, control W1-T1027 = 1 — THE
    FILENAME IS THE EXISTENCE TEST, and the `- id:` line is unindented), and ids under plan/
