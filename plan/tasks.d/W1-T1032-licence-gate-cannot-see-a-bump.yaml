    at the merge base against a control (`never exemptable`) that reads 1 — so it discriminates head
    from base and cannot be downgraded to `executed_stale`.

    THIS RIDES ALONE AND TOUCHES NO INSTRUMENT PATH. `.github/workflows/dependency-review.yml` is on
    `INSTRUMENT_SURFACE` (`^\.github/workflows/`) and is deliberately absent from `files:`: the
    predicate lives in `test/helpers/check-dependency-licences.mjs` and its contract in
    `test/dependency-licence-policy.test.ts`, neither of which is on the surface, so
    `detectInstrumentEntanglement` has nothing to entangle. The workflow's env block already passes
    `ALLOW_LICENSES` and `LICENSE_EXEMPTIONS` and needs no edit for this change; if an implementer
    finds it does, that widening must be ratified before it is made and shipped as its own PR.

    THE MEASUREMENTS IN RATIONALE (1) ARE REPRODUCIBLE WITHOUT GITHUB. `readLockAtRef` takes a git
    ref, so the whole comparison runs from local objects: fetch `refs/pull/<n>/head`, use 95751a57 as
    the base, and re-key `diffAdded`'s output by package name. That is how they were taken — the REST
    API was rate-limited at the time and was not used.

    risk: high IS RAISED ON A MEASURED REFUSAL AND THE REFUSAL IS QUOTED. Authored at `risk: medium`
    — the change is one predicate and its own test, with no source module, no workflow and no policy
    data touched — and `rmd lint-plan` refused it in these words: *"[sizing] spans 2 distinct
    subsystems/concerns (check-dependency-licences, dependency-licence-policy) at risk:medium —
    Rule 19: raise to risk:high or decompose into one task per concern."* The band is Rule 19's SPAN,
    not blast radius: a predicate and the test that pins its contract are not decomposable into two
    tasks, since shipping either alone is how an unenforced rule gets written.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form; each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from test/dependency-licence-policy.test.ts that matched
    one. Each is plain prose under 100 characters with no comma, no `; ` and no regex metacharacter,
    because a bare title is compiled through `escapeRegExp` and matched literally. The fifth is
    doc-shaped and takes a `grep:` with an explicit path.

    ID PROVENANCE — MINTED THIS SESSION OVER GIT PROTOCOL, PLAIN REFSPEC, EVERY VARIABLE BRACED. An
    orphan anchor over the empty tree (0 parents, 0 tree entries) naming host, pid and a nanosecond
