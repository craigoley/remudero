- id: W1-T7092
  title: "THE DAEMON'S 4 GB IS OUTSIDE ITS MAIN HEAP AND NO ROW SAYS WHERE — W1-T6782 shows the core main process at 4.3-4.65 GB rss within 2-4 min of boot while its main V8 heap is 0.45-0.60 GB; the process runs four worker_threads whose isolates process.memoryUsage() does not count; add each live worker thread's heap, by spawn site, to daemon.alive using the existing worker-heaps registry, so the remainder that is native memory is named, not guessed"
  repo: remudero
  depends_on: [W1-T6782]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — attributing the daemon's off-main-heap memory on the heartbeat. High for blast radius: daemon.alive is the watchdog's row
  band_meaning: blast-radius
  origin: "operator session 2026-10-09: targeting the daemon baseline from W1-T6782's production rows before any replay"
  plan_refs: [W1-T6782, W1-T5355, W1-T5480, W1-T3335, W1-T147]
  files: [src/lib/daemon-memory-telemetry.ts, src/lib/daemon.ts, src/run-task.ts, test/the-daemon-heartbeat-names-its-worker-thread-heaps.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED 2026-10-09 from W1-T6782's daemon.alive rows (134 core rows, 06:49-11:26Z, five generations), read only:
    - Within 2-4 min of every boot the core main process's rss is 4.30-4.65 GB, while heap_total_bytes is 0.45-0.60 GB and
      external_bytes 0.02-0.12 GB. About 3.8-4.0 GB of the process is outside the main isolate's heap from the start.
    - The console daemon is the same shape: 1.74 GB rss against a 0.31 GB heap.
    - Over a generation the remainder stays 0.7-5.1 GB as the cgroup swaps it in and out; swapped pages count in
      vm_swap_bytes.
    - /proc for that process (11:30Z): 15 threads, including 4 "WorkerThread"; 1.50 GB anon resident + 3.95 GB swapped;
      file-backed under 0.07 GB.
    - Each worker thread is its own V8 isolate. process.memoryUsage() reports only the main one, and the process-wide
      --max-old-space-size=8192 bounds each thread spawned without resourceLimits.
    - W1-T6782's sampler cost: p50 497 us, p99 2.1 ms; it adds about 574 bytes to each row.
    The candidates are the worker isolates' heaps or native allocations (allocator arenas, addon memory), and the next
    reduction depends on which. serve already measures its threads this way (worker-heaps.ts, W1-T5355/W1-T5480); the
    daemon does not. This settles it from production at heartbeat cost, before any large isolated replay.
    W1-T147 (the overnight chaos drill) shares src/lib/daemon.ts and src/run-task.ts only because both are the daemon's
    wiring files. Neither task supersedes the other.
  design: |
    (1) Register the daemon's threads with worker-heaps.ts's spawn-site tracking (the worker_threads diagnostics channel)
        at daemon startup, exactly as serve does.
    (2) On each daemon.alive tick, start the thread heap read (worker.getHeapStatistics, bounded by WORKER_HEAP_TIMEOUT_MS)
        AFTER the row is written. The next row carries the completed reading:
        - worker_heaps: per spawn site, its thread count and total and used heap bytes. Cardinality is bounded by spawn
          sites.
        - worker_heap_total_bytes;
        - worker_heap_age_ms: the reading's age;
        - native_remainder_bytes: rss + vm_swap - heap_total - external - worker_heap_total, labelled as an inferred
          remainder.
        A thread that did not answer is named unsized, and the remainder is then marked a lower bound. The heartbeat never
        awaits the read.
    (3) Payload-free and passive: sizes and spawn sites only. No heap snapshot, inspector session, gc call, resourceLimits
        or heap-flag change.
  acceptance:
    - claim: "daemon.alive carries per-spawn-site worker heap totals from the previous tick's read, an unanswered thread is named unsized and makes the remainder a lower bound, the heartbeat is written without awaiting the read, and the sampler module references no heap snapshot, inspector or gc entry point"
      proof: "unit test: test/the-daemon-heartbeat-names-its-worker-thread-heaps.test.ts"
    - claim: "the daemon wires the worker heap reading into its telemetry"
      proof: "grep: workerHeapReadings( in src/lib/daemon-memory-telemetry.ts"
  falsifier: |
    Await the thread read inside the tick: the heartbeat-not-awaited case fails. Treat an unanswered thread as 0 bytes:
    the lower-bound case fails.
