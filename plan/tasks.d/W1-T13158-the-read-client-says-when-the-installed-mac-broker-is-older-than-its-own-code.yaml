  rationale: |
    FOUND 2026-11-16 by the builder of W1-T12938 (merged as #18834), then READ on origin/main by the operator session.

    - deploy/mac/install-gh-read-broker.sh copies the checkout's committed tree at HEAD to `~/Library/Application Support/remudero/gh-read-broker/<sha>/` and records that sha in `current`. Its launchd agent is `KeepAlive` and `RunAtLoad` only. Nothing compares the serving copy with main afterwards, so the broker runs the code of the day it was installed until someone remembers to reinstall. The repository has met this class before: a reviewer clone that sat behind origin/main refused reviews for hours on 2026-11-15.
    - hooks/deny-floor.sh adds its "installed for this account is DOWN" line only inside `if [ -f "$gh_broker_dir/heartbeat" ]`. A broker directory with no heartbeat file (an install that never produced a beat, or a cache that was cleared) gets the bare floor and no restore command.
    - The agent's PATH (`/usr/local/bin:/opt/homebrew/bin:...`) resolves Node 24.21.0 on the operator Mac while `.nvmrc` pins 24.22.2; `engines` allows it. Recorded, not changed here.
    - The operator's rule is that no remudero service runs on the Mac beyond the approved broker, so a scheduled reinstaller is not proposed: the client that every session already calls says what is stale and how to fix it.
  design: |
    1. The installer writes, beside `current`, the list of source paths the copy was made from that the broker serves from (the paths `rmd gh-broker serve` loads; name them once, in one exported list the installer and the client both read).
    2. The `rmd gh` verb (src/lib/gh-read-broker.ts; the narrow client entry src/gh-read-broker-client-main.ts must keep answering exactly as `gh` does and is not touched) compares `current`'s commit with its own checkout's HEAD over those paths (`git diff --quiet <installed> <head> -- <paths>`, bounded, and silent when either commit is unknown to the checkout). On a difference it prints one stderr line, prefixed `rmd gh:`, with both short commits and `bash <checkout>/deploy/mac/install-gh-read-broker.sh`, once per calling commit (a stamp file under the broker's cache directory).
    3. The hook's DOWN line also fires for an existing broker directory with no heartbeat file, with "no heartbeat was ever written" in place of the age.
    INVARIANT routing-and-the-floor-unchanged: no call changes class, and nothing here starts, stops or reinstalls anything.
    NOT IN SCOPE: a scheduled refresh; the agent's Node version; Linux installs.
  falsifier: |
    Print nothing for a differing copy, or print on every call, and criterion 1 must fail. Drop the DOWN line for a directory with no heartbeat file and criterion 2 must fail. Print for a matching copy, or route a call differently, and criterion 3 must fail. Restore and all pass.
  note: |
