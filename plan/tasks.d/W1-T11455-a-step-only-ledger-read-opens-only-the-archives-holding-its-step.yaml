  rationale: |
    A live CPU profile of core on 2026-11-06 recorded one 206 s event-loop hold. About 122 s of
    it, plus most of 68 s of garbage collection, was a single call chain:
    routeAdaptiveLifetimePressure, then rowsWithArchivedVerifyHumanVerdicts (src/run-task.ts
    ~:36724), then readLedgerUnionRecordsSync(dir, { step: [VERIFY_HUMAN_JUDGED_STEP] }), then
    scanLedgerBuffer / parseObject, then zlib inflate. A step filter limits which rows are KEPT, but
    the union still inflates and scans every one of the ~394 archives (~692 MB gz) synchronously,
    to find a handful of verify_human.judged rows. Two callers reach it: the lifetime-pressure hook
    (~:36604) and the verify-human sweep (~:21591, ~:37028).
    ledgerClassTier (src/lib/escalate.ts ~:1535) does the same with step
    panel.escalation_marked_handled, synchronously, on every escalation it judges: 14.6 s of
    hold time in one 300 s profile window.
    W1-T11423 adds a per-archive key manifest whose ledgerManifestMayHold already skips an
    archive when query.steps names no step in manifest.steps, and ledgerRowsFor /
    ledgerRowsForSync to read through it. Neither reader uses them yet. W1-T11424's census also
    counts a step option as a bound, so neither reader is flagged (see W1-T11456). The current
    ledgerRowsForSync API supports refuseIncomplete but exposes no torn-row callback or matching torn
    evidence. The key-manifest builder currently discards malformed rows as unkeyed, so adding only
    an onTorn callback in src/lib/ledger-union.ts could still skip an archive whose sole evidence is a
    torn line naming panel.escalation_marked_handled. Preserve the refusal without reopening every
    clean archive: version the per-archive key manifest with a hasTorn bit, and make synchronous keyed
    reads that request onTorn open every torn archive so the raw line reaches the caller. Add scoped
    support in src/lib/ledger-union.ts and src/lib/ledger-key-manifest.ts; do not weaken the refusal.
  design: |
    1. rowsWithArchivedVerifyHumanVerdicts reads through ledgerRowsForSync with
       steps [VERIFY_HUMAN_JUDGED_STEP]. It returns the same rows in the same order (archived first,
       live last), and keeps its documented partial-read behaviour.
    2. The key manifest records whether each archive contains any torn line; a missing, old-version,
       or unreadable manifest still causes that archive to be opened. When ledgerRowsForSync receives
       onTorn, it opens all archives marked hasTorn as well as those whose indexed keys match, and
       forwards each raw malformed line. ledgerClassTier reads through ledgerRowsForSync with steps
       ["panel.escalation_marked_handled"], refuseIncomplete and the same bounded substring check; it
       throws "escalation precision history is unreadable" for an unreadable archive that may hold the
       step or a torn row that names it. Clean unrelated archives remain skipped. Confirm those paths
       and say so in the PR.
    3. Neither caller adds a cache or a constant. The manifest is the whole bound.
    W1-T10767 (queued) edits ledgerClassTier's neighbourhood for snoozes. Keep this change to the read.
  acceptance:
    - claim: "rowsWithArchivedVerifyHumanVerdicts and ledgerClassTier open only archives whose manifest holds their step, plus torn archives when the caller requests onTorn evidence, and return the same rows as an unbounded read"
      proof: "grep: W1-T11455 criterion 1 in test/ledger/a-step-only-ledger-read-opens-only-the-archives-holding-its-step.test.ts"
    - claim: "ledgerClassTier still refuses when a torn row names its step, including one in an otherwise-unmatched archive discovered through the key manifest's torn evidence; an unreadable archive that may hold its step also refuses, and an archive with no manifest is still read"
      proof: "grep: W1-T11455 criterion 2 in test/ledger/a-step-only-ledger-read-opens-only-the-archives-holding-its-step.test.ts"
  note: |
    Tests use a real state dir with N rotated archives (built with the ledger's own rotation, so
    manifests are written), where the step lives in k of N. Criterion 2 also places a torn row naming
    the precision step in an otherwise-unmatched archive and proves the manifest marks it for opening;
    an unrelated torn archive remains bounded to onTorn's caller policy. Count archive opens through
    the injection point W1-T11423's own tests use. At base both readers open all N. The builder names
    each criterion test with the marker "W1-T11455 criterion N".
  falsifier: |
    Revert either reader to readLedgerUnionRecordsSync. Criterion 1 must then fail, because all N
    archives are opened. Remove the hasTorn manifest evidence while keeping the keyed skip: criterion
    2 must fail because ledgerClassTier would miss the torn target-step row in an unmatched archive.
