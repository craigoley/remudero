    `files:` WAS DERIVED BY INVOCATION COUNT, NOT PROSE MENTION. Measured at 592beb65:
    `test/auto-triage-rung.test.ts` 13 invocations / 16 mentions and it asserts the
    `auto_triage.skipped` STEP twice; `test/auto-triage-wiring.test.ts` 0 invocations / 8 mentions but
    it is the REACHABILITY suite (it captures `DaemonDeps` and asserts `checkAutoTriage` is wired).
    DELIBERATELY EXCLUDED: `test/triage-inflight-dedup.test.ts` (5 invocations),
    `test/auto-triage-daily-cap.test.ts` (2) and `test/auto-triage-policy-seam.test.ts` (3) assert
    dedup, cap and policy behaviour — none asserts PLACEMENT. DROP ANY DECLARED PATH THE
    IMPLEMENTATION DOES NOT TOUCH.
    AND THE PLACEMENT IS ASSERTED BY NOTHING TODAY: zero test files match `idle branch` or
    `inside the idle`, against a positive control of 54 test files mentioning `idle` at all. The line
    that makes the rung silent is load-bearing and unguarded.
    WHAT THIS SHARD MUST NOT BE USED TO ARGUE — the queue is a STANDING POOL, NOT A RISING TIDE.
    Intake is bursty and HAS STOPPED: 20+27 on Jul 22-23, 46 across Aug 3-5, then 2, 2, 2, 1 on
    Aug 7-11, and NOTHING SINCE 2026-08-11. That removes the urgency argument without making the pool
    cheap. The pool is real: 88 `status: new` of 147, 123 of them `origin: cli` operator captures, and
    yield over the 57 decided entries is 25 accepted (43.9%) / 32 rejected (56.1%) — roughly a
    coin-flip, NOT `mostly already decided`. Draining costs: 73 `triage.synthesized` rows, total
    $78.17, mean $1.07, median $1.02, max $2.86, all Opus — so 88 entries is about $94 at the mean and
    ~$252 worst case. Cost per SURVIVING task is $3.72, because 47 mint events produced only 21
    distinct `minted_id`s (RETRY CHURN — W1-T388 and W1-T298 each minted five times).
    TWO RETRACTED METRICS, CARRIED AS WARNINGS BECAUSE BOTH LOOKED SOUND. (1) `17 of 25 accepted
    entries mention a W1-T id` is NOT yield — it measured OPERATOR PROSE, and the control killed it:
    63% of UNTRIAGED entries mention one too. (2) A first `minted_id` sweep returned a FALSE ZERO
    because `task_id` on those rows holds the TRIAGE RUN id (`TRIAGE-fb-…`), with the task in
    `minted_id`; checking the row's keys caught it. Both are the query-shape false-zero class this
    repo has now measured ten times this week. SHIPPED, RECORDED 2026-09-02 (evidence only). THIS TASK IS BUILT: a merged commit on origin/main carries its own Remudero-Task trailer -- 1eaf6381 fix(auto-triage): gate the rung on a deferred pairing, not on idleness (W1-T469) (#1822). status: queued and verify: human are BOTH left alone: the status field is decorative by documented design and the operator ruled LEAVE THEM on 2026-08-05, and the human gate is this shard's own deliberate parking choice, not this block's to revoke. Nothing mechanical was misled either, since isDispatchEligible refuses a non-auto task before any probe. This record exists because a READER picking build candidates was misled, not a machine."
