- id: W1-T3329
  title: "RULE 25 GUARDS WHERE GATES USED TO LIVE — INSTRUMENT_SURFACE contains no `src/` path at all, so `src/lib/review.ts` (the judge that refuses every PR) gets NO entanglement protection, while `src/lib/ci-parity.ts` (a registration table that grades nothing) counts as PRODUCT and makes every new ci.yml job an entanglement failure by construction"
  repo: remudero
  depends_on: []
