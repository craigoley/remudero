  rationale: |
    Proof policy, worker pool size, and alert threshold are per-repo controls. They must be edited
    from a repo-specific route and must state whether a value is local draft or persisted, because
    a settings form is not evidence that the daemon accepted a write.
  design: |
    Use a typed settings hook over the store today and keep the persistence route named as a
    placeholder. The form validates numeric bounds in the browser and reports local-only saves
    explicitly until a generated write method exists in the api-client.
