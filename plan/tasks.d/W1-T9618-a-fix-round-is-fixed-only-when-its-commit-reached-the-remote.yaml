    - claim: "a round that did not land refunds its strike and reads as a no-op round to the progress judge"
      proof: 'grep: test("W1-T9618: a round that did not land refunds its strike and the judge reads it as a no-op" in test/a-fix-round-is-fixed-only-when-its-commit-reached-the-remote.test.ts'
    - claim: "the routing learner excludes a round whose commit never reached the remote"
      proof: 'grep: test("W1-T9618: the routing learner excludes a round that never reached the remote" in test/a-fix-round-is-fixed-only-when-its-commit-reached-the-remote.test.ts'
    - claim: "the default remote read sees a landed push in a real git remote"
      proof: 'grep: test("W1-T9618: the default remote read sees a landed round in a real remote" in test/a-fix-round-is-fixed-only-when-its-commit-reached-the-remote.test.ts'
  falsifier: |
    Drive runFixRung with a worker that reports FIXED and commits, and a push that throws
    FixRoundPushError("git-push-failed", undefined, "fatal: could not read Username ..."). On origin/main the
    fix.done row reads fix_outcome FIXED, subtype success, no push field; no strike is refunded; and the learner
    scores the round `accepted`. With the change it reads subtype push_failed, fix_outcome NOT_LANDED and
    push_outcome failed, with the reason, and a fix.strike_refunded row follows. Remove the ls-remote comparison
    and the second test goes red. Drop the refund and the third goes red.
