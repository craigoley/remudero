  rationale: |
    OBSERVED 2026-11-20 (host ledger, core): on export-gardener PR #19731 (taskless, key PR-19731) the fix child
    work-fix-dispatch-PR-19731-1795126594679-79b3 wrote fix.stood_down "PR diff unreadable: spawnSync gh ETIMEDOUT"
    at 2026-11-19 22:31Z and settled fulfilled with verdict=no_pr. Fourteen hours later the sweep still disposed
    "fix already dispatched for this head (682168d) — awaiting its outcome before spending another strike"
    (12:19:31Z). coverage-shard stayed red for the whole time on a one-line import fix (hand-fixed in 200ae5ee0).
    INFERRED from code (sweep.ts fixSeedRead/readFixRungEnd): this stand-down is not read as an ended rung, so
    dispatchedThisHead keeps the head deduped forever. A transient gh timeout must cost one round, not the PR.
  design: |
    INVARIANT live-rung-dedups: only a rung that can still produce a head keeps its head deduped.
    1. In readFixRungEnd (or fixSeedRead), treat a fix.stood_down whose reason is a read failure of the PR itself
       (diff or view unreadable) followed by the child's settlement with verdict no_pr as an ended rung.
    2. Do not touch the W1-T10339 hold: a stand-down whose recorded inputs all still stand remains held.
    3. Fixture: the exact #19731 rows (fix.dispatch, fix.stood_down, settlement no_pr), then a sweep pass at the
       same head: one fix dispatch, no dedup reason.
  falsifier: |
    Without the change criterion 2's pass disposes "fix already dispatched for this head" and dispatches nothing.
