  note: |
    **`files:` IS DRAWN AGAINST THE DEFECT, NOT THE DIFF I EXPECT.** The organ spans more than one
    file and the declaration says so: `recon.done` is logged from `src/run-task.ts`, the recon prompt
    is rendered there, and the OBSERVED/INFERRED/COULDN'T-VERIFY contract is parsed in
    `src/lib/worker.ts` — a change that persists those bands cannot be confined to the dispatcher.
    W1-T2237 measured 138 of 301 merged diffs exceeding their declaration, and #2519 shows the
    opposite failure: a fix CONFINED by an under-drawn one. Declaring the parser alongside the
    dispatcher costs nothing if untouched and prevents the confinement.

    **THE PROOF PATH DOES NOT YET EXIST, WHICH IS THE POINT.**
    `test/recon-artifact-reuse.test.ts` is absent from the tree, and `files:` is a BARE SINGLE-LINE
    list so `SHARD_FILES_LINE_RE` matches and the forward-reference exemption applies — a block-style
    list would silently forfeit it. **THE FALSIFIER FOR THAT EXEMPTION MUST DISCRIMINATE:** a
    `check-proof` run against a NON-EXISTENT control path reads `hits: 0` exactly like the target, so
    it proves nothing; the discriminating control is an EXISTING path such as `test/plan.test.ts`,
    which resolves to real tests, against the declared path which does not.

    **RISK BAND — BOTH READINGS.** SPAN: `files:` crosses `src/` and `test/` and names two source
    files, so Rule 19's span reading is `high`. The band EXEMPTS the sizing check rather than clearing
    it — `sizingViolation` returns `undefined` outright at `high` — so a clean lint is not evidence
    the span was vetted. BLAST RADIUS: narrower — one artifact written at the end of recon, one read
    at dispatch, one invalidation predicate. The danger is Q3's, not the span's.

    **MEASUREMENT PROVENANCE.** Host `vm`, `/usr/bin/bash`, uid 0. Scratch worktree at a fresh path
    outside `/tmp`, `HEAD == origin/main` proven by sha, `--is-shallow-repository` false (2140
    commits) checked before any history query, removed after. Fetched `refs/rmd-id/*` verified at
    363 local against 363 remote BEFORE sweeping. `src/run-task.ts` is 1,533,033 bytes — over the
    Contents API's 1 MB cap, where it returns an empty body that greps to a clean zero — so every
    figure from it was read through git objects. MASTER-PLAN lines were read BY LINE NUMBER, not by
    grep output. Every GitHub read was guarded on curl's exit code and a non-null JSON body, never a
    size floor.

    **ID PROVENANCE — UNUSED, NOT OWNED.** `refs/rmd-id/W1-T2241` exists against a namespace of 363.
    **ITS ANCHOR WAS DELIBERATELY NOT CHECKED**: the id was minted through the allocator on another
    host, so its anchor cannot match this one, and refusing on that basis is how four lanes stalled
    against valid reservations today. What was verified is that the id is UNUSED on all eight
    surfaces, each control pre-qualified on its own surface: reservation ref 1 of 363; shard
    filenames on main 0 (control `W1-T2204` = 1); `- id:` lines 0 (control = 1); open-PR titles 0
    (control `W1-T` = 2 across 4 open PRs); open-PR head branches 0 (control `run-*` = 89); open-PR
    file lists 0 across 4 of 4 heads enumerated and captured, control 11 file entries; anchored
    merged trailers 0 (control `W1-T2219` = 1 across 98 merged); merged subjects 0 (control
    `(W1-T2204)` = 2 across 2140). THE SUBJECT WAS SWEPT TOO: `recon.*artifact`, `recon.*cache`,
    `plan_sha.*head_sha`, `recon.*re-dispatch` and `progress artifact` all read 0 across
    `plan/tasks.d/`, against a control of 323 shards mentioning `recon`. Nothing is already filed.
