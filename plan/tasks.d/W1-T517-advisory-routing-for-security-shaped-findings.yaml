    is warn-only by construction. Rule 25 (W1-T297): src/lib/task-linter.ts is instrument
    surface, so this diff rides alone and its two-file files: enforces that by construction.
    PROOF NOTES: both unit proofs are name-filtered titles verified to match ZERO files under
    test/ at 3cac8ce (control: a known-real title substring matched 1) — the implementing test
    must carry each title as ONE verbatim string literal, never assembled across a
    concatenation seam (impl-AG). The grep proof names a NEW load-bearing symbol at an
    EXISTING path — 0 hits at 3cac8ce via the executor's own argv (grep -arn --), so it misses
    the merge-base and cannot land executed_stale (W1-T273).
    MINT NOTE: the id was swept free (TAKEN=0, control W1-T516=3) at 3cac8ce, but the
    refs/rmd-id/W1-T517 reservation could NOT be taken from the filing session — its push proxy
