  rationale: |
    OPERATOR RULINGS 4 AND 7 (2026-10-16):
    - The tree is 21 subsystem folders plus rules/: console-api, worker, ci, inbox, rules, review, daemon, plan, github,
      deploy, learning, ledger, sweep, gardeners, fix-lane, routing, dispatch, memory, triage, infra and sre.
    - console-api, worker and ci get second levels.
    - No folder is named census, ratchet or baseline.
    - The map is reusable for a later src/lib split.
    THE SEED, committed with this filing under plan/seeds/test-restructure-2026-10-16/:
    - subsystem-map.json holds module_subsystem (599 modules), subsystem_seed_rules, helper_subsystems, name_keywords,
      module_name_tokens, the scoring weights and formula, the second-level families and folder_of_subsystem;
    - proposed-map.tsv holds the reviewed assignment of all 3,640 tests at the a323d87ed snapshot;
    - taxonomy.md section 1 describes the method.
    MEASURED at the snapshot:
    - confidence: 1,876 high, 1,324 medium, 425 low, 15 none;
    - 723 tests value-import 3 or more subsystems, so about 26% ambiguity is the floor for any single-parent layout;
    - modularity is 0.236 for the seeded map against 0.457 for Louvain;
    - a folder is recoverable from the test's name alone for only about 27% of tests (taxonomy.md section 7), so
      placement must read imports.
  design: |
    1. DATA. Copy subsystem-map.json to scripts/test-placement/subsystem-map.json. Copy proposed-map.tsv (path, folder,
       kind, confidence) to scripts/test-placement/test-folders.tsv. Code reads only these copies, never plan/seeds;
       the seed directory stays as provenance.
    2. src/lib/test-placement.ts exports:
       - extractTestFeatures(path, text): value, type-only and helper imports of src/ and scripts/ modules (helper
         imports followed through test/helpers|setup|lib), repo path strings, imported symbol names and name tokens.
         It uses a comment-aware scanner, NOT a regex comment stripper: taxonomy.md section 1.1 records a regex
         stripper eating real code.
       - placeTest({ imports, name, kind? }) returns { folder, confidence, primary, runnerUp, reasons }. It reproduces
         taxonomy.md section 1 step 3 from the JSON:
         - the reach weight times (IDF + 0.1) times the symbol factor, plus the name and prefix bonus;
         - infra damping;
         - per subsystem, the best module plus 0.3 times each other module;
         - the run-task hub's symbol and name token vote;
         - rule kind sends the test to rules/;
         - second levels come from the family regexes.
         IDF is taken over the CURRENT test population and computed once per tree SHA, never per call.
         A src module missing from module_subsystem is placed by subsystem_seed_rules (first regex wins); a test with
         no signal at all goes to infra/ with confidence none.
    3. `rmd test-place <path...>`, registered in src/run-task.ts as testPlaceCommand, prints the folder, the confidence
       and the reasons for each file. Builders and minters use it.
    4. AGREEMENT IS MEASURED, NOT ASSERTED AGAINST A CONSTANT. A test runs placeTest over every row of test-folders.tsv
       at head and reports agreement by confidence band. The TSV's header records the high-band agreement measured at
       commit. The test fails only if high-band agreement falls below that recorded value; it may rise when the map
       improves (W1-T9901).
    5. A test asserts that no folder or second-level name matches RULE_SUITE_NAME_RE (src/lib/ci-parity.ts).
    New test flat in test/.
