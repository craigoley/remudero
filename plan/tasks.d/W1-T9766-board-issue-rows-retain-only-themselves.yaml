  rationale: |
    OBSERVED offline by the W1-T9647 build (PR 12231), census 27d1f36d8d59 on 2026-10-15 over a synthetic production-scale corpus (369 rotations x 8,900 rows, 18,000 live rows, 12,000 closed PRs, 600 issues; plan at 4,112 tasks); evidence logs-8864/9647-census/census-27d1f36d8.{json,md}. Live set 867 MiB, filing threshold 43.4 MiB (min of 5% of the live set and 50 MiB). The per-step shares are INFERRED.
    OBSERVED, census runs in logs-8864/9647-census/: `board snapshot cache, issue rows (rows().issues)`, 600 entries,
    retained 37 MiB in run1, run4 and run5 (36.6 MiB, ~64 KB/row), and 0 MiB in run2 and 0.2 MiB in run6 (303
    bytes/row). The closed-PR rows (rows().closed, 12,000 entries) read 36.6-37 MiB in the same runs.
    INFERRED, untraced: the issue rows (or the object the census drops to measure them) share a closure or a container
    with the closed rows, so dropping the issue holder sometimes frees the closed rows too and sometimes does not,
    depending on what else holds them. Either the census's drop order mis-attributes (a measurement defect) or the
    issue rows pin the closed bodies (a real retention). The mechanism is not traced.
  design: |
    1. Trace it offline (W1-T9647's census process, heap snapshot allowed there only): take retainer paths for the issue
       rows in a run that reads 37 MiB and one that reads 0.2 MiB, and name what links them to the closed rows.
    2. If it is a real pin, cut it in src/lib/board-snapshot-cache.ts so issue rows retain only themselves; if it is the
       census's drop order, correct the census's measurement instead (in W1-T9647's script) and say so in the PR.
    3. The finding goes in the PR body with the retainer paths, OBSERVED.
    No new constant.
    Tests go in test/board-issue-rows-retain-only-themselves.test.ts, titled verbatim as in the proofs.
  acceptance:
