- id: W1-T13901
  title: "The fleet heartbeat publishes each daemon container's CPU over the beat (cores, user and system share, throttled time) beside its memory figures, so a host-load report names the container that used the CPU from recorded data"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # spans the heartbeat script and daemon container cgroups; a new read-only probe in the 5-minute heartbeat; it reads cgroup cpu.stat and writes new keys only
  band_meaning: span
  origin: "operator-session#console-daemon-load-2026-11-19"
  plan_refs:
    - W1-T13837
  files:
    - scripts/fleet-heartbeat.sh
    - test/the-beat-publishes-each-containers-cpu.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "Per daemon container the beat publishes cpu_<c>_cores, cpu_<c>_system_share and cpu_<c>_throttled_s, from cpu.stat counter deltas over the beat interval"
      proof: "grep: W1-T13901 criterion 1 in test/the-beat-publishes-each-containers-cpu.test.ts"
    - claim: "invariant:no-false-zero — a first beat, a counter that went backwards (container restart) or an unreadable cpu.stat publishes unknown, never 0"
      kind: guard
      proof: "grep: W1-T13901 criterion 2 in test/the-beat-publishes-each-containers-cpu.test.ts"
    - claim: "The heartbeat script reads usage_usec from each daemon container's cpu.stat"
      proof: "grep: usage_usec in scripts/fleet-heartbeat.sh"
  rationale: |
    WHY: on 2026-11-19 a session reported the console daemon at 340% CPU and the host at load 40 to 70. Recon found
    the console daemon averaged 0.5 cores and the fleet daemon used 4.3; the report had read the wrong row of a
    one-off `docker stats`. Nothing on the host keeps CPU history per container, so the claim could not be checked
    after the fact and a thread spent an hour building samplers by hand. The heartbeat already publishes each daemon
    container's memory and IO deltas every 5 minutes (the mem_<c>_* and io probes); CPU is the missing figure.
  design: |
    INVARIANT no-false-zero: an unmeasured CPU figure is published as unknown, never as 0.
    Extend the per-container probe that writes mem_<c>_* (same container list, same cgroup directory, same
    RMD_CGROUP_ROOT and RMD_HEARTBEAT_DOCKER seams). Keep the previous beat's usage_usec, system_usec and
    throttled_usec per container in the heartbeat's existing delta state, as the io probe does. Publish
    cpu_<c>_cores = delta usage_usec / (interval_s * 1e6), cpu_<c>_system_share = delta system / delta usage, and
    cpu_<c>_throttled_s, plus cpu_interval_s. A first beat, a counter that went backwards or an unreadable file
    publishes unknown.
  falsifier: |
    No cpu keys: criterion 1 fails. A restart reads as 0 cores: criterion 2 fails.
  note: |
    Id reserved for run-unfiled-1795138766000 with ~/rmd-work/bin/reserve-id.sh.
