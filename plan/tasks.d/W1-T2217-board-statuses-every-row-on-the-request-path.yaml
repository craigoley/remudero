- id: W1-T2217
  title: "the board makes ONE SYNCHRONOUS `gh` call per row on the `GET /v1/status` request path, and N is board rows carrying a `prUrl` — a population fed by a COLD `state=closed` walk, so every PR the fleet merges makes the console permanently slower, and the module's own doc already prices this exact shape at ~0.4s x N"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  rationale: |
    Filed by reading only, from a scratch worktree PROVEN equal to origin/main (behind-count 0,
    clone shallow-checked). `src/run-task.ts` is 1,531,586 bytes and was read through git objects,
    never the Contents API. No suite, no spawning verb. Every line below was re-derived at
    `a932f055`, not carried from the brief.

    (1) THE CALL, PER ROW, ON THE REQUEST PATH. `src/lib/board.ts:301` maps every `BoardRow`
    (`const tasks: BoardRow[] = [...byId.values()].map((p) => {`) and `board.ts:326` calls
    `deriveReviewState(p.prUrl, deps.github)` for every row carrying a `prUrl`. That resolves to
    `src/lib/status.ts:4379`, `run(combinedStatusRestArgs(owner, repo, headRef))` — KEYED ON THE
    HEAD BRANCH NAME, NOT A SHA, and deliberately: "the combined-status endpoint's `:ref` accepts
    any git ref, and this gateway never fetches a PR's `headRefOid` at all."

    (2) IT IS SYNCHRONOUS, AND THE MODULE SAYS WHAT THAT COSTS. `status.ts:4098` is
    `execFileSync("gh", args, { …, maxBuffer: 1 << 26, timeout: GH_CALL_TIMEOUT_MS })`, and the
    module header reads: "Both gateways shell `gh` through `execFileSync`, which is SYNCHRONOUS: a
    call that never returns does not merely stall the sweep, it parks the daemon's only thread…
    with nothing logged, because a hang is not an error." So this is a FROZEN PROCESS, not a slow
    page — which is why `curl` to `remudero-serve:4317/` returned `000` at an 8-second timeout with
    the connection ACCEPTED, `ps` sampled five times showed a different
    `gh api …/commits/<ref>/status` each time, and a restart answered `401` in 3 ms (operator-
    measured 2026-08-24T12:31Z; attributed, not re-derived from this host).

    (3) N IS NOT WHAT IT LOOKS LIKE, AND THAT IS THE FINDING. It is board rows carrying a `prUrl`.
    `fetchBoardPrsRest` (`src/lib/open-prs-rest.ts:989-1016`) walks a HOT `state=open` half AND a
    COLD `state=closed` half, each to `BOARD_MAX_PAGES = 50`. So a PR merged on 2026-07-31 is still
    a row and still gets statused, and the ENGINE OF THE GROWTH IS MERGED PRs ACCUMULATING IN THE
    COLD WALK. MEASURED: 86 `run-*` heads, 802 plan tasks, 3 open PRs — NONE of them is N, and
    DELETING STALE `run-*` HEADS WOULD NOT HELP.

    (4) THE REPO ALREADY PRICED THIS SHAPE, IN THE DOC OF THE THING BUILT TO FIX IT.
    `buildBatchedGithub`'s own header: "…on the board's `GET /v1/status` request path that is
    ~0.4s x N — at 183 tasks, ~74s, and the browser hangs at 'loading…'." That paragraph describes
    the defect `buildBatchedGithub` REMOVED for `findMergedByTrailer`, and W1-T914's `reviewState`
    reintroduced the same shape on the same path.

    (5) THE SHARED BUDGET IS WHY SATURDAY'S OUTAGE IS THE SAME EVENT. The per-row status calls and
    the index walk share ONE account budget through ONE pacer, so a large N drains the quota the
    index walk then needs. `board gateway: batched PR fetch failed (rate_limit)` is
    `status.ts:4260`; it repeated from 22:08 to 23:31 UTC on 2026-08-22 before the container was
    stopped. The log window is the operator's; what is re-derived here is the emitter, its
    classification path, and the coupling.
    (6) IT SHIPPED, ITS CRITERIA HOLD, AND THE STORM STILL RUNS. Measured 2026-08-24 against #2734
    (`ac2b625c`, merged 17:15:03Z) with `remudero-serve` cold at 17:17:54 and no `board_gateway.*`
    rows: a cold `/v1/status` returned HTTP 200 in 218,788 ms and a WARM one in 195,403 ms — ELEVEN
    PERCENT FASTER — both reporting `tasks=820, withPrUrl=751, withReviewState=751`. THE TIMINGS ARE
    OPERATOR-ATTRIBUTED; the code below is re-derived here.

    (7) THE GUARD IS PRESENT AND CORRECT FOR THE CASE IT WAS WRITTEN FOR, AND UNREACHABLE FOR THE
    ONE THAT DOMINATES. `status.ts:4391-4393` reads `const terminal = entry.state !== "OPEN"; const
    cached = reviewStateCache.get(prUrl); if (cached && (terminal || now() - cached.at < ttlMs))
    return cached.state;`. IT REQUIRES A CACHED ENTRY. `reviewStateCache.set(...)` sits on the
    SUCCESS path only (`:4411`), and the `catch` at `:4413` returns `undefined` and caches nothing.
    So terminality is knowable from `entry.state` alone, yet the guard consults it only AFTER a
    cache hit it can never get.

    (8) AND THE CALLS FAIL BY CONSTRUCTION, WHICH IS WHY THE CACHE NEVER FILLS.
    `combinedStatusRestArgs(owner, repo, sha)` (`open-prs-rest.ts:506-508`) is called with
    `entry.headRefName` (`status.ts:4384`) — A BRANCH NAME, NOT A SHA, and the parameter's own name
    says `sha`. A merged PR's branch is deleted. VERIFIED DIRECTLY: `run-W1-T331-1785884370235`
    reads 0 on origin and `gh api repos/craigoley/remudero/commits/run-W1-T331-1785884370235/status`
    exits 1 with `{"message":"Ref not found","status":"404"}`. So every terminal row whose branch is
    gone 404s, is never memoised, and is re-requested on every paint forever. The index holds
    `prCount 2206` against 136 LIVE REMOTE HEADS, and the review-state histogram reads `none: 733`.

    (9) THE SAMPLING, AND WHAT IT CANNOT SAY. 34 bounded samples across both passes caught a call in
    flight EVERY TIME, EVERY REF DISTINCT — 24 in the cold pass, 8 more in the warm pass with ZERO
    OVERLAP, spanning 2026-07-15 to 2026-08-23. Expected N was 3; observed is the full historical
    population. THE HONEST LIMIT: THE EXACT `gh` CALL COUNT PER PAINT WAS NOT ESTABLISHED. Sampling
    shows the calls continuous and serial for ~200 s but cannot count them; a per-call ledger row or
    a before/after `core.used` snapshot would settle it, and the "before" reading was not taken.

    (10) AND AN IMMUTABLE KEY IS NOT AVAILABLE WITHOUT A NEW FIELD — recorded so the obvious remedy
    is not costed wrongly. `BatchedPr` (`status.ts:3903-3912`) carries `number, url, state,
    headRefName, body, autoMergeRequest` and NO `headRefOid`; `:4382` says outright that this
    gateway "never fetches a PR's `headRefOid` at all". Keying the status call on a sha would
    therefore widen the batched fetch, which is a different change from the one the follow-up
    proposes.

    (11) THE FOLLOW-UP OWNS ALL OF THIS AND THE BOUNDARY IS EXPLICIT. W1-T2235 carries (6)-(10). The
    ~14 s cold index walk measured in the same request — 45,919,114 B across 24 REST calls at
    `prCount 2206`, plus a 3,048,634 B issue re-read — IS W1-T2222'S, WHICH IS FILED AND QUEUED. The
    other ~200 s is this task's territory and the follow-up's. THEY MUST NOT BE FOLDED.
  design: |
    (i) THE STORM IS A COLD CACHE, WHICH IS WHY IT IS INTERMITTENT AND WHY THE REMEDY IS TRACTABLE.
    `reviewStateCache` is a per-URL memo held at GATEWAY scope and TTL-matched to `index()`, so a
    steady-state refresh is NOT N calls. It fires on first paint after a restart, and on the first
    tick after the TTL expires with a changed row set. AND THE EXPIRIES SYNCHRONISE: entries written
    during one render share an `at`, so they lapse in the same tick rather than amortising — a
    thundering herd once per TTL, not a trickle. Any remedy that only shortens the storm without
    reducing N leaves that herd intact.

    (ii) A MERGED PR's COMBINED STATUS CANNOT CHANGE, AND THE INDEX ALREADY KNOWS WHICH ROWS THOSE
    ARE — FOR FREE. `BatchedPr` carries `state` (`status.ts:3907`) on the SAME batched fetch, and
    `prStateFromRest` folds the merge signal into it. `reviewState` reads
    `index().byUrl.get(prUrl)?.headRefName` and never consults `.state`. So the discriminator needs
    no new call, no new field and no second fetch. THIS ALONE COLLAPSES N: from every row with a
    `prUrl` to rows whose PR can still change — against a board fed by up to fifty pages of closed
    PRs, that is the whole difference.

    (iii) AND IT COSTS THE BOARD NOTHING IT CANNOT GET BACK, BUT THE DISTINCTION MUST BE DRAWN
    CAREFULLY. A terminal row's status is IMMUTABLE, so it needs fetching at most ONCE — not once
    per TTL. The memo's own doc forbids caching "past `ttlMs`" for a reason it scopes explicitly to
    live values: "an open PR's `remudero-review` context is exactly the value this feature exists to
    keep LIVE (pending -> success/failure WHILE THE ROW STAYS OPEN)". A forever-memo for a TERMINAL
    row is therefore not the thing that rule forbids — and `changedFilesByUrl`, in this same
    gateway, is already exactly that shape for an immutable value. THE IMPLEMENTER MUST GET THIS
    DISTINCTION RIGHT OR NOT TAKE IT: if the terminal-immutability argument is not accepted, the
    fallback is to skip the call for terminal rows and render no review state for them, which is
    cheaper but shows less.

    (iv) MOVING THE CALLS OFF THE REQUEST PATH IS THE OTHER AXIS AND IS NOT REQUIRED BY THIS TASK.
    Rationale (2)'s real severity is that the calls are on a REQUEST path at all; even a small N of
    synchronous `gh` calls parks the thread. Reducing N per (ii) makes the page usable; hoisting the
    work into the poll loop would make a request never block on `gh`. This task must not be read as
    settling that — it is named so a later reader knows the smaller fix was chosen deliberately.

    (v) REFUSED BY NAME. `DEFAULT_BOARD_POLL_TTL_MS = 150_000` (`src/lib/serve.ts`) STAYS — W1-T999
    derived it from the sweep distribution and it bounds how often a sweep STARTS, not what one
    COSTS. The board STILL SHOWS CHECK STATE. NOTHING CACHES A LIVE STATUS PAST ITS TTL. No second
    cache layer. No deleting `run-*` heads — rationale (3) shows they are not the population.

    (vi) NOT IN SCOPE, NAMED: `status.ts:3710` is the OTHER `execFileSync` gateway and carries
    `timeout` but NO `maxBuffer`, so Node's 1 MiB default still applies there — W1-T181's fix landed
    at 4098 and not at 3710. It is NOT this incident's path and is named as a sibling, not folded
    in. Also out: the pacer's own policy, the COLD walk's page bound, and `GH_CALL_TIMEOUT_MS`.
