  rationale: |
    THIS IS THE SURFACE THE OTHER THREE EXIST FOR, AND IT IS DELIBERATELY LAST. W1-T2494 gives a
    thread, W1-T2495 gives it a sender a human recognises, W1-T2496 gives it a reply. None of that
    is worth anything until an operator can open it, and rendering it before the model settled
    would have meant rebuilding the view twice.
    SURFACE 1 real browser suites already covering console DOM = 10
    SURFACE 2 lines in the console renderer = 5916
    SURFACE 3 src files where the token unread means message read-state = 0
    SURFACE 4 console routes shipped today = 40
    SURFACE 5 modules that raise an escalation = 14

    READ-STATE HAS TO BE BUILT, NOT FOUND, AND THE GREP THAT SAYS OTHERWISE IS THE TRAP. `unread`
    appears across 21 files and in every one of them describes a ledger archive that could not be
    read — coverage, not correspondence. A session that greps the word and builds on what it finds
    will wire a mailbox to an I/O failure counter.

    WHAT MAKES IT READ LIKE CORRESPONDENCE IS SPECIFIC AND TESTABLE, WHICH IS WHY THE CRITERIA PIN
    IT RATHER THAN THE ADJECTIVE: threads ordered by their latest message, an unread count that is
    a count of threads rather than events, each thread showing every message in order with the
    sender's display name, a reply box that posts to the reply route, and a resolved state that
    hides a thread without deleting it. Ten Playwright suites already exercise this DOM, so each of
    those is an assertion rather than a matter of taste.

    IT IS ADDITIVE TO A CONSOLE THAT MUST STAY LEGIBLE WHEN THINGS ARE BROKEN. The console's value
    is highest exactly when the fleet is unhealthy, so the mailbox loads no script or stylesheet
    over the network and degrades to the existing rows if the thread store is unreachable — the
    same rule W1-T2489 sets for the graph drawing, and for the same reason.

    THE BACKTICK HAZARD APPLIES HERE TOO. `serve.ts`'s client JS lives inside a backtick template
    literal, and a single backtick in client code or its comments terminates the outer template with
    a parse error naming no cause. This file has been bitten before; the criteria pin that the
    rendered shell still parses.

    NOT IN SCOPE: the graph drawing, which W1-T2489 owns on these same two files and will therefore
    serialize against this by `overlappingPaths`; the terminal status board, which W1-T2475 owns;
    and any new route beyond what W1-T2496 ships.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: two src stems plus a test, carrying two
    independent acceptance concerns — the mailbox rendering and its degradation path.
