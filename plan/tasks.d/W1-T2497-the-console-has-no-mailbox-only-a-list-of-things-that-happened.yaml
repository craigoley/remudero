- id: W1-T2497
  title: "THE CONSOLE HAS NO MAILBOX, ONLY A LIST OF THINGS THAT HAPPENED — ten real browser suites already cover its DOM and forty routes already feed it, but nothing renders a thread, nothing tracks what an operator has read, and the token `unread` means an UNREADABLE LEDGER ARCHIVE in all 21 files that use it"
