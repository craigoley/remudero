  rationale: |
    READ 2026-10-05 on origin/main f0452a82 and #9216 (W1-T5649, open). `DaemonDeps.checkRetroTrigger`
    (src/lib/daemon.ts) is `() => RetroTriggerDecision | undefined` and the tick does `decision =
    deps.checkRetroTrigger()` in a try. #9216's `buildRetroDaemonHooks` sets the hook to
    `retroCheckOffLoop(retroTriggerCheckAsync, () => fired)`: each call returns the decision the
    previous call started (once) and starts the next, drops a decision begun before a fire, and
    rethrows a failed check on the following call. A due retro therefore fires one poll interval
    late, and a thrown check is ledgered as `daemon.retro_trigger.check_failed` a tick after it ran.
    W1-T3104 (queued) removes the per-run GitHub reads from the trigger; this task is only the hook's
    shape.
  design: |
    Let `checkRetroTrigger` return a Promise and have the tick await it (the loop function is async);
    `buildRetroDaemonHooks` returns `retroTriggerCheckAsync` directly and `retroCheckOffLoop` is
    deleted. The ledger-pressure deferral, the already-detached refusal and the crossing key are
    unchanged. If W1-T5649 has not merged, stop and record needs-design. Add no comment lines to
    src/run-task.ts.
  acceptance:
    - claim: "with an async check that resolves fire on a timer, the same daemon tick that awaited it writes retro_triggered, and a rejected check is ledgered as check_failed on that tick"
      proof: "unit test: test/the-daemon-awaits-the-retro-check.test.ts"
  falsifier: |
    Keep `retroCheckOffLoop`: the fire lands on the next tick and the test fails.
