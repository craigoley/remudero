  falsifier: |
    Spawn approve in the daemon's checkout without the env, and the first test's real `checkCliFreshness` returns
    `refused` with reason off-main, as 1,171 approve logs read. Set `RMD_SELF_SYNC_DONE=1` but keep `cwd` at the
    behind checkout, and the plan-read test classifies against the stale plan. Leave `main`'s `log` unset, and the
    refusal test reads no `self_sync.refused` row. Keep the lane fire-and-forget, and the retry test sees the
    finding held for a day with its hand-off counted as filed, as ledgerRowActor was twelve times.
