    - claim: "Every step that walks the shards walks all twelve: the premapped merge, the raw impact-map build, the summary's exit loop, the red-shard exit gate and the delivery verdict"
      proof: "grep: W1-T13342 criterion 2 in test/ci/coverage/the-nightly-runs-twelve-coverage-shards.test.ts"
