  rationale: |
    MEASURED 2026-11-17 (Actions jobs API, run 44033818223, workflow_dispatch on main cfa8df39d), the first nightly
    after #19009 (W1-T13275) added the premap step to each of the 8 nightly shards: shards 4/8 and 6/8 were
    cancelled at their 45-minute ceiling. Their test steps took 2159 s and 2334 s, compaction 153 s and 197 s, and
    the premap was still running. The other six succeeded at 31 to 44 minutes, with premap steps of 321 to 466 s.
    The merge never ran, so the floor was not measured that day.
    W1-T13275 design step 3 named this branch: "If the slowest shard would pass 42 minutes, also move the nightly
    matrix to CI_COVERAGE_SHARD_COUNT (12, W1-T13270) and update scripts/coverage-floor.mjs NIGHTLY_SHARD_COUNT to
    match." #19009 merged before that measurement could be taken (the main-only guard refuses a branch dispatch).
    ci.yml's 12-shard coverage lane runs the same selection plus a premap, and its slowest shard took 30 to 34 minutes
    in its first three runs (44012761466, 44013600271, 44018783043).
    WHY NOT A HIGHER CEILING: the test step alone grows with the suite (test files +16% in 20 days); more shards
    divide it, a higher bound only moves the wall.
  design: |
    1. .github/workflows/coverage-nightly.yml: the shard matrix becomes [1..12]; the job name and each
       `--shard ${{ matrix.shard }}/N` and error text read /12. The merge names coverage-shard-1..12/premapped and the
       impact-map build coverage-shard-1..12/raw, both with --shard-count 12. The summary's `n <= N` loop, the
       red-shard exit gate's and the delivery verdict's `for SHARD in ...` loops walk 1..12, and the verdict names
       a shard as k/12. A comment above timeout-minutes records run 44033818223.
    2. scripts/coverage-floor.mjs: NIGHTLY_SHARD_COUNT = 12, so the nightly producer's provenance expects 12 shard
       exits (a run that records 8 reads as partial).
    3. The four suites that pinned 8 derive the width from NIGHTLY_SHARD_COUNT and keep their titles, so existing
       proofs still resolve: test/a-red-coverage-nightly-run-raises-a-needs-human-issue.test.ts,
       test/the-instrumented-suite-runs-nightly-on-main.test.ts,
       test/main-builds-the-test-impact-map-the-shadow-arm-reads.test.ts and the nightly fixtures (only) of
       test/ci/coverage/the-live-coverage-flip-requires-a-fresh-nightly-floor.test.ts.
    4. New suite test/ci/coverage/the-nightly-runs-twelve-coverage-shards.test.ts parses coverage-nightly.yml with the
       `yaml` package: criteria 1 to 3 above. Root through `#test/helpers/repo-root.js`.
    INVARIANT ceiling-unchanged: the shard job keeps timeout-minutes 45 and the merge job 30.
  falsifier: |
    Set NIGHTLY_SHARD_COUNT back to 8 and criterion 1 fails. Leave any one shard loop at 8 and criterion 2 fails.
    Raise timeout-minutes instead and criterion 3 fails. VALIDATION AFTER MERGE: a dispatched coverage-nightly run
    on main has all 12 shards finish under 42 minutes and the merge step under 10 minutes, and the next three
    scheduled nightlies conclude success, closing #18813.
  note: |
    An operator session hand-builds this task: the daemon holds any task that names a workflow path (W1-T5351). A
    workflow diff rides alone (W1-T297). Build PR: #19055.
