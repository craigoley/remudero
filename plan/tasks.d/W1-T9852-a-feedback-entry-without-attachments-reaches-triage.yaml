    - claim: "a non-list attachments value is refused by name"
      proof: 'grep: test("W1-T9852: a non-list attachments value is refused by name" in test/a-feedback-entry-without-attachments-reaches-triage.test.ts'
  falsifier: |
    Leave readFeedbackEntry casting unchecked, and the prompt test throws the live TypeError, "Cannot read properties
    of undefined (reading 'length')", as all 15 fires did.
  note: |
