    - claim: "an advance with no baked difference restarts in place as today"
      proof: 'grep: test("W1-T8171: a mount-only advance still restarts in place" in test/one-boot-per-advance.test.ts'
    - claim: "past the measured image-delivery latency with no recycle, the daemon restarts in place and names the latency"
      proof: 'grep: test("W1-T8171: a recycle that never comes falls back to the in-place restart" in test/one-boot-per-advance.test.ts'
    - claim: "an unreadable or unknown build sha reads as not pending"
      proof: 'grep: test("W1-T8171: an unknown build sha reads as no recycle pending" in test/one-boot-per-advance.test.ts'
  falsifier: |
    Keep the decision as on main: in the first test the 09:57-shaped advance (src/lib/ledger.ts changed against the
    image's build sha) latches an in-place restart and no `daemon.freshness_deferred_to_recycle` row is written.
    Make the deferral unbounded: the third test sees no restart after the measured latency passes.
