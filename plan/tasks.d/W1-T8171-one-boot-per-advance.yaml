  rationale: |
    MEASURED 2026-10-11 (core daemon ledger, copied read-only to ~/Remudero-notes/restart-churn-2026-10-11/ledger-copy).
    Four boots were followed within 1-3 min by a recycle onto the SAME install sha, each costing a second boot and
    boot gate (~95 lane-min):
      - 05:12:13 freshness boot 21545cbaf; 05:12:46 `deploy.drain_handoff` recycle image, blockers ["boot-settling"],
        workers 0; 05:13:06 `deploy.kickstart` to 21545cbaf; 05:13:24 boot 21545cbaf.
      - 06:34:29 recycle boot 193af0ce7; 06:35:09 `deploy.drain_handoff` recycle image, blockers ["boot-settling"];
        06:35:43 kickstart; 06:36:08 boot 193af0ce7 (a recycle repeated onto its own sha).
      - 09:57:45 freshness restart 773ac6a31..a7e85faef, an advance touching src/lib/ledger.ts (an IMAGE_BAKED_PATHS
        file); 09:58:08 boot; 10:00:33 `deploy.pulled` a7e85faef -> a7e85faef; 10:00:50 kickstart; 10:01:07 boot.
      - 16:04:00 freshness restart 0e3350da2..975275e4d, also touching src/lib/ledger.ts; 16:04:27 boot; 16:05:55
        `deploy.drain_handoff` recycle image, blockers ["boot-settling"]; 16:06:11 kickstart; 16:06:38 boot.
    Five of the day's nine freshness advances touched a baked path (04:08 config-schema.ts and fleet-control.ts,
    08:30 deployer.ts, 09:57 and 14:01 and 16:04 ledger.ts).
    WHY W1-T6598 DID NOT HOLD IT: W1-T6598 is the progress watchdog's STALL recycle (src/lib/progress-watchdog.ts) and
    never gated deploy recycles. The boot-settling guard is W1-T5764's, and the image path bypasses it. READ on
    origin/main 233304449, src/lib/deployer.ts runDeployCycle: a decision carrying `recycle` selects a backend that
    drains itself (:1850-1851, W1-T6249), and `if (!gate1.proceed && drainHandoff) handOff("pre-pull", ...)` (:1873,
    and :1907 pre-kickstart) only LOGS the idle gate's blockers, boot-settling included, then kicks.
    W1-T6282 (:852-855) makes every published-image recycle carry `recycle: "image"`, so every image recycle takes that
    handoff. deploy/recycle-container.sh's own drain counts workers and locks and never reads boot settling. Restoring
    the guard alone would only delay the second boot until lanes are busy again, so the fix is upstream: avoid the
    first in-place restart.
    WHY THE DAEMON RESTARTS IN PLACE FOR AN IMAGE ADVANCE: src/lib/deploy-judge.ts freshnessAdvanceWorth (:359) falls
    through to deterministicDeployWorth, which scores an IMAGE_BAKED_PATHS change 18 (:126-131) with the reason "image
    input changed: only a recycle onto the rebuilt image delivers it". 18 is the whole restart threshold, so the
    in-place restart fires for exactly the advance it cannot deliver. The container knows its own image's build sha:
    deploy/Dockerfile writes /etc/rmd-build-sha (:215-217).
    DEPENDENCY: W1-T8170 edits stopForFreshness in src/lib/daemon.ts. Serialized after it.
    OVERLAP. lint-plan reports W1-T147 (the overnight chaos drill) as sharing src/lib/daemon.ts and src/run-task.ts.
    That is the whole-file surface only: W1-T147 injects faults and checks recovery rows, and does not touch the
    freshness decision or the recycle, so neither shard supersedes the other (the ruling W1-T7806 recorded).
  design: |
    Operator rulings: no hard thresholds (no fixed wait below), lean into automation.
    1. IMAGE-PENDING READ. For the sha the daemon would restart onto, it reads whether any IMAGE_BAKED_PATHS file differs
       between its own image's build sha (/etc/rmd-build-sha) and that sha. It is a local `git diff --name-only` and
       needs no network. A difference means the recycle tick will recycle this container onto a rebuilt image for this
       advance. Make it an injected daemon dep, wired where the daemon's other freshness reads are (src/run-task.ts).
       An unreadable or `unknown` build sha reads as not pending, which is today's behaviour.
    2. When an image recycle is pending, the freshness decision does not restart in place. It ledgers
       `daemon.freshness_deferred_to_recycle` with build_sha, target_sha and the baked files, and keeps dispatching on
       its current code: no latch, no drain. The recycle drains itself (W1-T6249) and boots onto the new mount too, so
       it is the one restart for the advance.
    3. ESCAPE, MEASURED: if the recycle has not replaced the container within the observed image-delivery latency (a
       baked advance's merge to its `deploy.kickstart`, from recent ledger rows), the daemon restarts in place as today
       and ledgers the measured latency it waited on. With no measured history it restarts in place at once.
    4. Report in the PR, as its own item, why the 06:35:09 tick still read image drift right after the 06:34:29
       recycle boot onto the same sha (host watchdog journal, read-only). It is not fixed here.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive the freshness decision and runDaemon with an
    injected image-pending read, checkFreshness and fake clock.
