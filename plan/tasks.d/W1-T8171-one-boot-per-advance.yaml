  risk: high  # Rule 19: one concern — a freshness restart and an image recycle for the same advance are one restart
  band_meaning: span
  origin: "operator approval 2026-10-11 (Craig: go with your recommendations): restart-churn measurement, ~/Remudero-notes/restart-churn-2026-10-11"
  plan_refs: [W1-T5764, W1-T6249, W1-T6282, W1-T6093, W1-T6598, W1-T4945, W1-T3240, W1-T147]
