- id: W1-T8171
  title: "ONE BOOT PER ADVANCE — an advance that touches an image-baked path is delivered only by the image recycle, yet the daemon also restarts in place for it, so on 2026-10-11 a recycle to the SAME sha followed a boot within 1-3 min four times (05:12/05:13, 06:34/06:36, 09:58/10:01, 16:04/16:06; ~95 lane-min), and the recycle's drain handoff kicks a boot that is still settling"
  repo: remudero
