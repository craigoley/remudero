  note: |
    verify: human IS SET DELIBERATELY AND UP FRONT. This is arm-adjacent review machinery and
    design item (i) requires a JUDGEMENT — populate or remove — before any edit. A judgement is
    exactly the shape `isDispatchEligible` must not auto-dispatch at, and the same predicate
    W1-T923 records: one remedy form is automatable, a choice is not. risk:medium is Rule 19's
    span (one source module plus its suite), not blast radius; blast radius is bounded because the
    path is unreachable today, so nothing observable can regress from touching it.

    files: DERIVED BY READING THE SOURCE, NOT GUESSED, at b736b41. `testingTrigger`,
    `SpecialistTaskMetadata`, `routeSpecialists` and the field declaration are ALL in
    src/lib/specialist-panel.ts — one module. Its only exercising suite is
    test/specialist-panel.test.ts, which is where the hand-built literals live. No third path is
    declared because rationale (2) establishes there is no construction site to name yet;
    identifying or creating one is design item (i)'s job, and a builder choosing outcome (a) will
    need to widen this list at that point. src/lib/review.ts is DELIBERATELY NOT DECLARED — the
    `tddStrict` hits there are the W1-T229 parameter, which rationale (5) puts out of scope.
    src/run-task.ts is not declared either: it imports SPECIALIST_TOOLS from this module but never
    the router, and W1-T471 records that declaring the monolith serialises every task naming it.

    THE ID RESTS ON THE SWEEP ALONE, AND ONE SURFACE IS PROVABLY INCOMPLETE. The gated push to
    refs/rmd-id/W1-T948 was attempted with a unique orphan payload over the empty tree
    (4b825dc6) carrying a host-pid-nanosecond nonce, the refspec braced, and the exit code
    captured in a variable rather than read through a pipe. It returned HTTP 403 — the same
    credential limit W1-T518 files — so the readback found no ref and the reservation does not
    exist. The four-surface sweep is therefore the whole basis: W1-T948 read 0 against the plan
    tree (both id lines and shard filenames), 0 against refs/rmd-id/*, 0 across every open PR's
    file list, and 0 across every open PR's title. Highest id claimed on ANY surface was 947, from
    an open PR's file list.

    AND CONTROL A FAILED, WHICH IS ITSELF A FINDING. `refs/rmd-id/W1-T945` reads 0 while W1-T945
    is unambiguously taken — its shard file exists (control B read 1). So refs/rmd-id/* does NOT
    hold a reservation for every taken id, and a sweep that trusted it alone would mint a
    collision. That is why all four surfaces were swept and why the tree, not the ref namespace,
    is the authority here.
