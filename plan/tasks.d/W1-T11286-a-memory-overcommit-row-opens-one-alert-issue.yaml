  rationale: |
    The operator ruled on 2026-11-03 (AskUserQuestion on #16468): memory.max is never below a container's own learned peak. When the shared-budget formula undercuts a peak, the host is overcommitted, and that is surfaced rather than enforced by OOM.
    W1-T11130 (amended) appends host.memory_max.overcommitted from deploy/resource-policy.sh. Without a reader, the row is invisible.
    Live 2026-11-03T23:00Z, the 32,086 MiB host would be overcommitted today: its learned peaks total 31,364 MiB, so core and serve would both log a deficit.
  design: |
    1. Follow src/lib/deploy-refusal-escalation.ts (W1-T6062): src/lib/memory-overcommit-escalation.ts exports memoryOvercommitEscalation(rows, { issues, ledgerPath, runId, spool }).
       - It groups the newest row per container.
       - It escalates with class BLOCKED, taskId MEMORY-OVERCOMMIT-<container>, and a stable title, because escalate dedups on the title.
       - It withdraws the alert when the newest recycle note for that container carries no deficit.
    2. src/run-task.ts: rmd deploy-run calls it once per pass, next to refusalEscalationOrNone, with the same gateway and spool wiring.
    3. Test it with an in-memory IssueGateway and a ledger fixture containing real rows in the shape W1-T11130's writer appends.
  falsifier: |
    At origin/main nothing reads host.memory_max.overcommitted; no issue is opened for an overcommitted host.
