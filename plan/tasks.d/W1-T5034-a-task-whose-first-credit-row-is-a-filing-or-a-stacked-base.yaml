- id: W1-T5034
  title: "A TASK WHOSE FIRST CREDIT ROW IS A FILING OR A STACKED-BASE MERGE NEVER RECONCILES, BECAUSE `deriveStatus` RETURNS THE LEDGER'S LAST `pr.opened` THE MOMENT IT READS MERGED (rung (a), no plan-only or readability test) AND `creditCandidatesFromProjection` JUDGES THAT ONE PR ONLY — W1-T3376 (credit row #5088, a `chore(plan)` filing; the build is #6455) and W1-T3763 (credit row #6019, merged into a stacked base so no `(#6019)` commit exists; the build reached main as #6020) sat `status: queued` until #8193 hand-flipped them; let the reconcile read ask whether ANOTHER merged PR carrying the task's anchored trailer reached main as a build, and keep every other consumer of the credit row exactly as it is"
