  falsifier: |
    Delete the `creditHasOtherBuildMerge === true` clause from `creditIsReconcilable` and the first two tests redden (the
    filing-first and stacked-first tasks are refused again) while the preserved controls stay green. Drop the `creditIsReconcilable`
    gate inside the later-PR search (qualify on the trailer alone) and the stacked-base-only test reddens (#6019 would credit a
    task whose code never reached main), as does the unknown-path test. Drop the MERGED check and the unmerged test reddens.
    Write the new flag over `creditIsImplementation` instead of beside it and the destructive-fields test reddens (the
    supersession close would now act on the later PR). BOTH directions are needed: a test that only reddens on removal pins that the flag
    exists, not what it decides.
