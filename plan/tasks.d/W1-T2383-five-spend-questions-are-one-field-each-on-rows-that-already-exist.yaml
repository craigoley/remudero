    - claim: "the compaction count is populated rather than declared and left empty"
      proof: "unit test: test/spend-observability-fields.test.ts"
    - claim: "the recon turn cap is unchanged by this task, since observability is not tuning"
      proof: "grep: export const RECON_MAX_TURNS = 20 in src/run-task.ts"
    - claim: "the risk judge still resolves the cheapest configured tier, since measuring a floor is not moving it"
      proof: "grep: export function resolveRiskJudgeMount in src/lib/risk-judge.ts"
    - claim: "nothing added paces or throttles or sleeps a call"
      proof: "unit test: test/spend-observability-fields.test.ts"
  falsifier: |
    If a reader can already price a risk-judge decision and tell an exhausted fix run from a long
    one using only rows the fleet writes today, then the questions this task exists to unblock are
    already answerable and it must be closed rather than implemented. The check is direct: a
    risk_judge row carrying a cost, and a fix.done row carrying the cap beside its turn count.
