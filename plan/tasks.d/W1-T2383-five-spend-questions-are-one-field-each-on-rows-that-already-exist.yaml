- id: W1-T2383
  title: "FIVE QUESTIONS ABOUT THE FLEET'S OWN SPEND ARE UNANSWERABLE AND FOUR OF THEM ARE ONE FIELD ON A ROW THAT ALREADY EXISTS — 276 risk_judge rows carry no cost so a deliberately cheap tier's spend cannot be read, max_turns is absent on 233 of 233 fix.done rows against 629.99 US dollars of fix-rung spend, every one of 544 run.start rows reads implement so triage and retro cost nothing observable, and no recon reuse row exists so the invalidation rate has no denominator"
