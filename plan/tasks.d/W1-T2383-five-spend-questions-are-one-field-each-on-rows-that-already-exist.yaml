  rationale: |
    MEASURED 2026-08-27 over 499 verdict rows, 544 run.start rows and 1,103 phase rows spanning
    2026-08-08 to 2026-08-27, read off the live ledger file together with 36 rotations sorted
    before reading rather than globbed.

    THE CORPUS IS COMPLETE, AND THE REASON IS NOT THE ONE FIRST GIVEN. `verdict` and `run.start`
    ARE members of `DECISION_RELEVANT_LEDGER_STEPS`, so those two survive rotation by
    registration. THE PHASE FAMILY IS NOT: `implement.done`, `recon.done` and `fix.done` are all
    absent from that Set, and an earlier statement that they were registered was WRONG and is
    corrected here rather than carried. What makes the phase corpus complete anyway is a
    measurement, not a membership: 398 of 499 verdicts carry an `implement.done` row, the 101 that
    do not are 94 `blocked_containment` plus 4 `blocked_isolation`, 2 `pr_attribution_failed` and
    1 `failed`, and ZERO of them are merged, blocked_ci or no_pr. Coverage reads 100 percent on the
    OLDEST days and dips only on the newest, which is the opposite of what rotation pruning does.
    The gap is runs that never reached a phase, not rows that were dropped.

    ── Q1. THE FIVE, RANKED, AND FIELDS SEPARATED FROM STEPS ──────────────────────────────────

    THEY ARE NOT EQUAL AND MUST NOT BE PROPOSED AS THOUGH THEY WERE. Four are FIELDS on rows the
    fleet already writes. One is a NEW STEP. The costs differ and so does what each buys.

    (1) FIELD, AND THE ONLY ONE GATING A LIVE DESIGN QUESTION. `cost_usd` on
    `risk_judge.decision`. There are 276 risk-judge rows, 249 decisions and 27 escalations, and
    ZERO carry a cost; none carries a mount either. `resolveRiskJudgeMount` DELIBERATELY takes the
    cheapest configured tier at a floor, and that is a designed choice whose consequence nobody can
    read: whether the cheap tier is producing verdicts worth their price is not derivable from
    anything on disk. Every other item on this list buys an accounting line; this one buys the
    answer to a question the code was written to raise.

    (2) FIELD. `max_turns` on `fix.done`, absent on 233 of 233 rows. The fix rung spent 629.99 US
    dollars over the window, on a surface the verdict rows do not contain at all: only 16 of 109
    fix run ids also carry a verdict, so fix spend is invisible to any reader who joins on
    verdicts. The turn count IS recorded; the cap it ran under is not, so NOBODY CAN TELL WHETHER A
    FIX RUN EVER HIT ITS CAP. This matters beyond accounting because W1-T2344 records that an
    exhausted budget has a readable signature — a run one turn over its cap — and that signature is
    only visible when the cap sits beside the count. W1-T2238 already established the discipline:
    the cap is carried as an INPUT so a historical row stays checkable after the constant moves.

    (3) ROWS ON AN ALREADY-REGISTERED STEP. A `run.start` for the triage and retro lanes. All 544
    run.start rows read `type: implement`, and triage and retro emit neither a run.start nor a
    verdict, so THEIR COST IS INVISIBLE and only the within-run phase split can be measured today.
    The volume is small and measured: 91 distinct triage task ids and 16 retro run ids over the
    window, 5.6 runs a day between them.

    (4) FIELD. `compaction_events` on `implement.done`. The key is declared and reads empty on
    every row, so it could not be ranked as a cost predictor at all when turns, mount tier and
    recon turns were. Ranked LAST of the four fields because turns already explain 82 percent of
    cost variance, so the headroom this could occupy is small by construction.

    (5) A NEW STEP, WHICH IS WHY IT IS SEPARATE. `recon.reused`. There is no reuse row of any kind.
    CONTROLLED: `recon.absent` reads 77 and `recon.invalidated` reads 7 on the same corpus, so the
    family IS emitted and the absence is a missing member rather than a search that could not see.
    Without a reuse row the invalidation count has NO DENOMINATOR, so 7 invalidations cannot be
    turned into a rate. Ranked last overall: the invalidation cost is already measured at roughly
    0.38 US dollars a discarded recon, about 2.66 US dollars across every invalidation on record,
    so the denominator would most likely confirm a non-problem.

    ── Q2. THE LEDGER GROWTH, PRICED BEFORE ANYTHING IS PROPOSED ──────────────────────────────

    THIS FILE IS ON THE DISPATCH PATH AND ON EVERY CONSOLE POLL, so every retained step makes
    `readLedgerLines` slower and the delta is priced here rather than waved at.

    THE FOUR FIELDS ADD ZERO LINES. A field on a row already being written costs a few bytes on
    that row and no new line at all, so items 1, 2 and 4 have no line delta and need no retention
    decision. That is the whole reason they rank above the step.

    THE ONE ROW ADDITION IS 5.6 LINES A DAY. Triage and retro run.start rows join a step that is
    ALREADY registered, taking `run.start` from 28.7 to 34.3 rows a day, still far under the 200
    newest per step that retention keeps. Rotation runs at a measured 7.03 hour median interval
    against a median rotated file of 11,970 lines, so 5.6 a day is 1.6 lines resident per window,
    which is 0.014 percent of a file.

    THE NEW STEP NEEDS A RETENTION DECISION AND THE RECOMMENDATION IS NOT TO RETAIN IT. Bounded
    above by the recon rate of 23.3 a day, an unretained `recon.reused` is 6.8 lines resident per
    rotation window, 0.057 percent of a median file. It should stay OUT of the never-rotated core
    because it is a rate statistic and not a decision input, which is the same rule that keeps
    `panel.escalation_marked_handled` out: a step belongs in that Set only while a real deciding
    reader consults it.

    ── Q3. WHAT THIS IS NOT ───────────────────────────────────────────────────────────────────

    THIS PROPOSES NO CAP CHANGE, NO MOUNT CHANGE AND NO TUNING OF ANY KIND. The efficiency
    measurement it follows concluded the run process is ALREADY EFFICIENT: volume more than doubled
    while cost per run fell 28 percent, turns explain 82 percent of cost variance against 2.5
    percent for the mount tier, and the 400-turn implement budget is correctly generous with zero
    of 422 runs reaching it and exactly one getting within 20 percent.

    WHAT THIS BUYS IS THE ABILITY TO ANSWER, NOT A CHANGE. It should be said plainly and up front
    that the answers may all be "nothing to change" — a cheap risk-judge tier that turns out to be
    earning itself, a fix rung that never approaches its cap, triage and retro that cost very
    little. An observability task that discovers nothing is a task that did its job; the defect it
    fixes is that today the question cannot be put at all.

    ── WHAT IS OWNED ELSEWHERE AND IS NOT THIS SHARD'S ────────────────────────────────────────

    THE CI-RELIABILITY HALF IS NOT HERE. Measured at 46.7 percent of all fleet spend, of which 97.4
    percent was work that later merged, it is the largest single line in the budget and it is
    already owned: #3074 and #3071 are open against it. Nothing here touches it and nothing here
    should be read as an alternative to it. The probe's one-turn-over property belongs to W1-T2344
    and the uncredited-merge re-dispatch belongs to W1-T458; both are cited, neither is re-filed.

    ── WHAT MUST NOT CHANGE ───────────────────────────────────────────────────────────────────

    NOTHING PACES, THROTTLES OR SLEEPS — W1-T1066 records a polling loop that locked the operator
    out of his own repository for ninety minutes. NO GATE IS WEAKENED AND NO BOUND IS TUNED. THE
    FAIL-CLOSED CONTAINMENT VERDICT STAYS, and a run refused by the probe must keep being refused
    whatever its spend turns out to be. Adding a cost field must never become a reason to spend
    differently without a separate, measured decision the operator gates.

    RISK BAND. `risk: high` is set UP FRONT and is Rule 19's SPAN rather than blast radius:
    `files:` crosses two source stems, the risk judge and the dispatch entrypoint. The blast radius
    is separately LOW — every change is an added field or an added row on a path that already runs,
    and no predicate, cap or verdict is touched.
