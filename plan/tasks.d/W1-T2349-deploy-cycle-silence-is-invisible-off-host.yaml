  note: |
    `risk: high` IS SET UP FRONT, ON RULE 19 SPAN AND NOT ON BLAST RADIUS — `files:` covers
    `scripts/`, `.github/` and `test/`, and `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    >=2 subsystems below `high`. This is the same band and the same argument W1-T483 carries for the
    same three paths. Nothing here gates a PR, changes a restart policy or blocks a dispatch.

    RULE 25 IS ENGAGED AND IS NOT A SURPRISE. `.github/workflows/` matches `INSTRUMENT_SURFACE`
    (`src/lib/review.ts`), so `detectInstrumentEntanglement` sees this changeset. It is named here
    rather than discovered in review. NO `src/` PATH IS DECLARED, deliberately: design (viii) forbids
    touching the on-host renderer, and declaring an untouched path trips
    `inverseScopeUntouchedFiles`. `src/run-task.ts` is not declared either — nothing here touches it,
    and naming a 19,000-line file serialises this task against every other that does (W1-T471).

    THE TEST IS A NEW FILE, FOR W1-T494'S REASON. `test/fleet-heartbeat.test.ts` already carries two
    DECLARED host-parity divergences (`HOST_PARITY_BASELINE`, `src/lib/host-parity.ts`) over the
    BSD/GNU `date` split; a new file keeps this task's coverage off that fault line. This shard's own
    path is NOT in `files:` — adding it converts `proof-scope` warnings into a hard `rule15-filing`
    violation (measured on W1-T464).

    FILE OVERLAP IS EXPECTED AND IS NOT A DEPENDENCY. W1-T483 and W1-T494 also declare
    `scripts/fleet-heartbeat.sh`, so `partitionByFileOverlap` will not co-dispatch them with this —
    that is serialisation, not blocking, and there is no ordering requirement in either direction:
    this field derives from the `deploy.` prefix, W1-T494's from `daemon.stale_code`, W1-T483's from
    `docker inspect`. `depends_on: []` is therefore correct. Whichever lands second rebases one
    heredoc.

    THE PROOFS ARE PURE-PATH FORWARD REFERENCES for the three `unit test:` criteria — the file does
    not exist yet, and a path parses now where an invented test title would match zero tests forever.
    Criterion 4 is a `grep:` on purpose: it is the one assertion that the FIELD REACHED A CONSUMER,
    which is the difference between this task and a field nobody reads.

    EVERY MEASUREMENT ABOVE IS A QUERY, NOT A QUOTED NUMBER. Re-derive the payload's current field
    list from the heredoc in `scripts/fleet-heartbeat.sh`, the `deploy.*` step names from
    `runDeployCycle` (`src/lib/deployer.ts`), and the interval from the installed unit — never from
    this record.
