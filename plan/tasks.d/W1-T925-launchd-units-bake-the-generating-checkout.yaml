    text, this set crosses `src/` / `src/lib` / `test/`, and the acceptance text hits both the
    `daemon` and `launchd` tags. Raised up front.
    `test/launchd.test.ts` IS DECLARED AND THE REASON IS STRUCTURAL, not defensive: it is the suite
    that pins the CURRENT generator contract, so it is the one that moves the moment a fifth
    refusal exists. This is the recurring correction W1-T442/T443/T444/T445 each had to make after
    filing — made up front here.
    ACCEPTANCE WORDING AVOIDS THE HEADLESS LEXICON ON PURPOSE (Rule 18): every criterion is about
    the TEXT this generator produces, which is a pure function of its arguments and assertable with
    no live service anywhere. Anything that requires a real unit to be loaded is W1-T926's, and
    that task is `verify: human` for exactly that reason.
    THE MEASURED PRODUCTION READING (both services on
    `/Users/craigoleyagent/Remudero/remudero/bin/rmd`) IS W1-T446's, DATED 2026-08-14 ON THE MINI,
    and is quoted as provenance rather than as a current fact — re-derive it before building. The
