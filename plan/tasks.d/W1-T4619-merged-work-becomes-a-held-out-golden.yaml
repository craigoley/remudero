  rationale: |
    MEASURED 2026-09-27 over the three fleets' full ledger unions (core 773,650 / console 356,871 /
    site 269,728 rows, 2026-09-20..27) and origin/main 12baa03. The golden-replay leg
    (src/lib/replay-harness.ts, W1-T2689) is opt-in and bounded but its corpus is a small hand-
    seeded set with almost no production runs. Meanwhile review.posted records per-criterion
    proof_exec for every PR (core: 2,100 executed_pass, with W1-T362 discrimination against the
    merge-base), so every merged task whose proofs failed at base and passed at head is a graded,
    repository-specific, post-training-cutoff task with an executable scorer. Static public coding
    benchmarks are contaminated (SWE-rebench); these items are fresh by construction and dated. The
    console and site fleets spend hours in idle quiet mode (W1-T4601).
  design: |
    (i) Derive a golden corpus from merged tasks whose every executable proof discriminated (failed
    at base, passed at head): record task id, base sha, shard acceptance and the merge date; hold
    items out of any worker prompt. (ii) A bounded, opt-in replay runs a sample on a pinned stack
    across a model x effort matrix only when the fleet is idle (quiet mode) and headroom is
    measured, never competing with dispatch, and records replay results with the corpus item's
    freshness. (iii) Scores are the task's own proofs; a proof that cannot execute is unmeasurable,
    never a pass. Paid arms stay inside W1-T4603's envelope.
  acceptance:
