  acceptance:
    - claim: "host-update.sh takes `CRED_DIR` from `claude_host_directory` in deploy/claude-directory.sh, so `RMD_CLAUDE_DIR` and `HOME` give the same path as in recycle-container.sh and serve-container.sh"
      proof: 'grep: test("W1-T12360: host-update takes the Claude directory from the shared function in test/deploy/host-update-uses-the-shared-claude-directory.test.ts'
    - claim: "When the account file from `claude_host_account_file` exists, the printed `docker run` for the daemon container mounts it read-only at `/home/node/.rmd-claude-account.json`, the path deploy/entrypoint.sh copies from"
      proof: 'grep: test("W1-T12360: the printed daemon command mounts the account file read-only in test/deploy/host-update-uses-the-shared-claude-directory.test.ts'
    - claim: "When the account file is missing, the printed command has no account file mount and host-update prints one line that says so"
      proof: 'grep: test("W1-T12360: with no account file the printed command has no account mount in test/deploy/host-update-uses-the-shared-claude-directory.test.ts'
  rationale: |
    FROM THE CODE, 2026-11-11, origin/main 401c10db9 and the W1-T12293 hand build.
    - W1-T12293 (in the lane; code in /mnt/scratch/rmd/hand/wt-T12293) adds `claude_host_account_file` to deploy/claude-directory.sh. deploy/recycle-container.sh uses it to mount the host account file read-only at `/home/node/.rmd-claude-account.json`, and deploy/entrypoint.sh copies it in when the container's own file is missing or thin. recycle-container.sh and serve-container.sh already take the directory from `claude_host_directory`.
    - deploy/host-update.sh sets `CRED_DIR="${RMD_CLAUDE_DIR:-${HOME:-/root}/.claude}"` itself (about line 179). It does not source deploy/claude-directory.sh.
    - Does host-update recreate daemon containers? No. It starts no container. It prints a `docker run -d --name remudero-daemon` command (about line 500) that "the operator re-runs by hand" (its own comment, about line 490). That printed command mounts `${CRED_DIR}` and no account file.
    - So a daemon container made from the printed command gets no account file seed, which is the defect W1-T12293 fixed for the recycle. And if the shared derivation changes, host-update keeps the old path: it checks `${CRED_DIR}/.credentials.json` (about line 402) and reclaims `${CRED_DIR}/projects` (about line 1518) on a path the containers may not use.
  design: |
    1. In deploy/host-update.sh, source deploy/claude-directory.sh (the same way it sources deploy/runtime-env-vars.sh) and set `CRED_DIR="$(claude_host_directory)"`. Keep every later use of `CRED_DIR` as it is.
    2. Set the account file with `claude_host_account_file`. When the file exists, add the line `-v <account file>:/home/node/.rmd-claude-account.json:ro` to the printed daemon `docker run`, beside the `CRED_DIR` mount, in the same way the printed command adds `CODEX_MOUNT_LINE`. When it is missing, add no line and print one note line, in the words recycle-container.sh uses.
    3. Do not add the mount to the printed serve command: serve-container.sh is the real launcher there and the printed serve block has no secret-file mount (W1-T2568).
    4. Keep the backtick escape and the credential mount mutant in test/host-update-reclaim.test.ts passing. Change that file only if the new line changes what it counts.
    5. Add the test file named in `files`, one test per criterion with the exact titles in the proofs. Run the real script in its print mode with a temp `HOME` (the `printWithPaths` way of test/host-update-reclaim.test.ts) and assert the printed text, not the script source. For criterion 1, run a copy of host-update.sh beside a copy of deploy/claude-directory.sh whose `claude_host_directory` gives a path no default gives, and expect that path in the printed mount.
    NOT IN SCOPE: deploy/recycle-container.sh, deploy/serve-container.sh, deploy/entrypoint.sh, and making host-update start a container.
    BUILD ORDER: build after W1-T12293 is on main.
  falsifier: |
    Put back the local `CRED_DIR` default and criterion 1 must fail: the test's copy of deploy/claude-directory.sh gives another path, and the printed mount does not follow it. Remove the account file line and criterion 2 must fail. Print the line without the file check and criterion 3 must fail.
