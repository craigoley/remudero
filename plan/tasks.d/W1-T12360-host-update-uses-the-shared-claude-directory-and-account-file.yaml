  depends_on: [W1-T12293]
  priority: 1.3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # spans host-update and its reclaim test; changes the credential path host-update checks and reclaims
  band_meaning: blast-radius
  origin: operator-session#hand-build-follow-ups-2026-11-11
  plan_refs:
    - W1-T12293
    - W1-T1069
  files:
    - deploy/host-update.sh
    - test/host-update-reclaim.test.ts
