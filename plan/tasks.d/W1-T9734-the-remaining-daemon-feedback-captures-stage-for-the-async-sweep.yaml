  rationale: |
    READ at origin/main 5d62727bf and at run-W1-T9696-1792093598744 (e02b93474, #12180 open), 2026-10-15:
    - W1-T9696's head rewrites the runInTree row in test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts:
      "Still sync: captureFeedback from coverage-improvement, hand-run census, source-size follow-up, grilled reply,
      dep-review, the CLI sweep's repair capture; recordDecision, setFeedbackStatus, landFoldDebt, gardenCheckout; by
      name only, the planPrPreflight option and the sweepFeedbackLanding dep". This task takes the first group.
      W1-T9735 takes the sync landings, and W1-T9736 the by-name reaches and the row.
    - The callers on main, by enclosing function:
      - src/lib/coverage-improvement.ts `injectCoverageImprovementTask`: `deps.capture ?? captureFeedback`. It is
        the measurement cadence's producer (src/lib/measurement-cadence.ts, `opts.producer ?? injectCoverageImprovementTask`);
      - src/lib/hand-run-census.ts `handRunCensus`: captureFeedback, run from the measurement cadence;
      - src/lib/source-size-followup.ts `consumeSourceSizeFollowup`: `args.capture ?? captureFeedback`, from
        src/run-task.ts `reportWorkerSourceSizeFollowup`;
      - src/lib/panel-graph.ts `captureFeedbackReply`: captureFeedback, called by src/lib/escalation-answers.ts
        `applyGrilledFeedbackAnswer` as well as by serve's panel route;
      - src/run-task.ts `depReviewCommand`: the migration capture `captureFeedback(a.root, { ..., origin:
        "repair#dep-review" })`, reached from the sweep's dependabot path (src/lib/sweep.ts, `depReviewCommandImpl`);
      - src/run-task.ts `captureRepairFeedbackWithPriorVerdict`, wired as the sweep's `captureRepairFeedbackImpl`:
        it lands inline when no landing state root is set.
    - Each lands through `captureFeedback` > `landFeedback` > `syncPreflightOf` > `planPrPreflightAtCommit` >
      `defaultPreflightChecks` > `runInTree` (spawnSync).
  design: |
    1. Each daemon-path caller above captures through `stageFeedbackCapture(root, stateRoot, opts)` with the daemon's
       state root, as W1-T9615 and W1-T9696 do. Dedup reads `feedbackCaptured`, so a queued id is not captured twice.
       A caller with no state root in hand gets one from its wiring. It never falls back to an inline landing on the
       loop.
    2. Serve's panel route and the operator CLI verbs keep `captureFeedback`. Serve is another process, and a CLI verb
       is not the loop. `captureFeedbackReply` takes the capture as a seam so that each caller chooses.
    3. Re-measure at the build's base. Update the runInTree row's comment to drop each converted caller. The row itself
       is W1-T9736's to delete.
    4. Tests (new file, `test(` titles verbatim as in the proofs below):
       - the coverage-improvement producer and the hand-run census, run from the measurement cadence with a state
         root, stage their entries, and a throwing sync preflight is never called;
       - the grilled-answer reply and the sweep's repair capture stage the same way;
       - serve's panel reply still captures inline (positive control).
  acceptance:
