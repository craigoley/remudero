  rationale: |
    The plan (operator ruling 2) moves test/ one folder per PR, and every move must be a pure rename. A content
    edit above about 1,000 files makes git report adds instead of renames, and a rewritten short file that main
    moved gives a branch a modify/delete conflict (W1-T9864's rationale).
    This batch runs W1-T9864's codemod over the tests that the reviewed map
    (plan/seeds/test-restructure-2026-10-16/proposed-map.tsv, committed as scripts/test-placement/test-folders.tsv by W1-T9874) assigns
    to these folders. The batches are grouped in move order, so each wave's prerequisite lands early.
    MEASURED at 889966ea5: files in these folders with a relative import: worker 342, ci 265, review 240, about 847 in total. That stays under the
    plan's bound of about 900 files per content edit.
    Representative files, each verified to import a src module relatively today:
    - worker: test/a-balanced-squeeze-diverts-to-foundry-sonnet.test.ts imports ../src/lib/clock.js
    - ci: test/a-clock-sweep-runs-as-shards-and-merges-one-report.test.ts imports ../src/lib/ci-control-plane.js
    - review: test/a-dead-containers-claim-does-not-outlive-it.test.ts imports ../src/lib/review.js
    SHARED FILES: the codemod and the guard test are written by W1-T9864 and run by all four batches. Each batch
    covers different folders, and depends_on serializes them, so no two batches build at once.
  design: |
    1. Regenerate against current origin/main: run `node scripts/test-location-codemod.mjs --folder worker --folder ci --folder review` and commit its
       output as ONE content-only commit. Never rebase an old diff.
    2. Include tests added since the snapshot that W1-T9874's placeTest assigns to these folders.
    3. Do not move any file; the waves move them, starting with W1-T9880.
    4. List in the PR body every shape the codemod reported but did not rewrite. If one blocks a later pure move,
       fix the codemod here rather than hand-editing one file.
    5. W1-T9864's guard must show the location-relative count falling.
    6. The batch depends on W1-T9863 (repoRoot), because both edit the same files. It is serialized after the
       previous batch, because the batches share the codemod and the guard.
    Prove it is load-bearing: restore one rewritten file with `git show origin/main:<path>`, see the guard's count
    rise and the rep grep miss, then put the file back.
  acceptance:
    - claim: 'a worker test imports src through the alias'
      proof: 'grep: from "#src/lib/clock\.js" in test/a-balanced-squeeze-diverts-to-foundry-sonnet.test.ts'
    - claim: 'a ci test imports src through the alias'
      proof: 'grep: from "#src/lib/ci-control-plane\.js" in test/a-clock-sweep-runs-as-shards-and-merges-one-report.test.ts'
    - claim: 'a review test imports src through the alias'
      proof: 'grep: from "#src/lib/review\.js" in test/a-dead-containers-claim-does-not-outlive-it.test.ts'
    - claim: 'the location-relative count falls at this batch, measured by W1-T9864''s guard'
      proof: 'grep: test("W1-T9864: location-relative test files never rise above the merge base" in test/a-test-imports-through-the-subpath-alias.test.ts'
      kind: guard
  falsifier: |
    On origin/main each representative above imports `../src/lib/<module>.js`, so each `#src` grep misses.
