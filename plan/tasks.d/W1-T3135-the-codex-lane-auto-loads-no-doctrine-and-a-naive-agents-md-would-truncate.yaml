- id: W1-T3135
  title: "THE CODEX LANE AUTO-LOADS NO REPOSITORY DOCTRINE — Codex's native project-doc reader looks for AGENTS.md and this repo has none, `codexExecArgs` passes `--ignore-user-config` with no `project_doc_*` override, so the ONLY route to any rule is one unenforced sentence in the spawn prompt; and the obvious remedy is a trap, because CLAUDE.md at 43685 bytes exceeds Codex's 32 KiB `project_doc_max_bytes` default and a copy would be SILENTLY TRUNCATED"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 16.00
  files: [src/lib/worker-provider.ts, test/the-codex-lane-auto-loads-no-doctrine.test.ts, scripts/test-tier-manifest.json]
  origin: "operator-session#context-modularization-2026-09-08"
  plan_refs: ["W1-T2759", "W1-T2508", "W1-T2761"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-08 at origin/main (1ee2b5ff).

    (1) THE THREE FACTS THAT COMPOSE THE HOLE.
      a. `git ls-files | grep -i '^agents\.md$'` returns NOTHING — this repo tracks no AGENTS.md.
      b. Codex's native project-doc reader loads AGENTS.md (plus `project_doc_fallback_filenames`)
         up to `project_doc_max_bytes`, whose documented default is 32 KiB.
      c. `codexExecArgs` (src/lib/worker-provider.ts) passes `--ignore-user-config` and sets no
         `-c project_doc_max_bytes` and no `-c project_doc_fallback_filenames`, so no user-level
         config can supply either.
    Together: the Codex lane's native doc injection loads NOTHING from this checkout.

    (2) THE ONLY SURVIVING ROUTE IS PROSE. `spawnCodexWorker` prepends "Before acting, read and
    follow the repository instruction files present in the checkout, including CLAUDE.md and
    AGENTS.md." That is an instruction the model may follow, skip, or partially satisfy — exactly
    the class CLAUDE.md's own header calls out: a rule stated only in prose "can be violated
    silently and repeatedly". It names a file that does not exist, and its compliance is unobserved.

    (3) THE OBVIOUS FIX IS THE WRONG ONE. Copying or symlinking CLAUDE.md to AGENTS.md puts 43685
    bytes in front of a 32768-byte default cap. Codex stops accumulating at the cap, so the TAIL is
    dropped — here that is "Ledger and evidence discipline", "Investigation discipline" and "Code
    traps", the sections carrying the control/zero-measurement rules. A truncation at that boundary
    is silent: no error, no warning, and the file looks present.

    (4) WHY GENERATED, NOT HAND-WRITTEN. This repo already runs three generator+drift-check pairs
    (`generate-cli-reference.mjs`, `generate-proof-dialect.mjs`, `generate-docs-index.mjs`), each
    with a `--check` mode reached through `npm test` rather than a workflow step. A second
    hand-maintained doctrine file would drift from CLAUDE.md within days and nothing would say so.
    (4) MEASURED 2026-09-09 IN THE RUNNING IMAGE (codex-cli 0.152.0), four probes, each prompted
    with "Do not read or open any files" so a correct answer proves AUTO-INJECTION rather than
    tool use:
      CONTROL   CLAUDE.md present, no AGENTS.md, no flags ................. reply "UNKNOWN"
      TREATMENT + -c project_doc_fallback_filenames=["CLAUDE.md"] ......... reply "ZEBRA-4417"
      REAL SANDBOX  same flags under --sandbox workspace-write ............ reply "DELTA-77"
      TRUNCATION    71938-byte doc, default cap .... HEAD=ALPHA-1, TAIL=MISSING
                    same doc, -c project_doc_max_bytes=262144 .... HEAD=ALPHA-1, TAIL=OMEGA-9
    The default cap was BRACKETED, not assumed: a 32313-byte doc keeps its tail, a 33019-byte doc
    loses it — the documented 32768 (32 KiB), confirmed by measurement.

    (5) THE SIZES THAT MAKE BOTH FLAGS MANDATORY. CLAUDE.md is 43685 bytes at 2a22ebcf and
    `scripts/claude-md-budget-baseline.json` permits growth to `capBytes: 44000`. Both exceed the
    32768 default, so the fallback flag ALONE ships a silently truncated doctrine.

    (6) THE BINARY, NOT THE DOCS, IS THE AUTHORITY. The vendored codex binary contains
    `project_doc_fallback_filenames` (18 hits) and `project_doc_max_bytes` (18), and does NOT
    contain `experimental_instructions_file` (0) — so that third route does not exist here.

  design: |
    REFRAMED 2026-09-09 ON OPERATOR DIRECTION, and the direction is what unblocks it: design (v)
    below previously scoped OUT any `-c project_doc_*` flag because widening the Codex argument
    surface was the operator's call to make. It has now been made, and the measurements in
    rationale (3) show the flag route is both smaller and strictly safer than the generator.

    (i) TWO FLAGS ON THE EXISTING SURFACE, NO SECOND FILE. `codexExecArgs` (worker-provider.ts)
    already passes EIGHT `-c` flags; this adds two more to the same `shared` segment:
        -c project_doc_fallback_filenames=["CLAUDE.md"]
        -c project_doc_max_bytes=<a named constant above the CLAUDE.md ratchet cap>
    No AGENTS.md, no generator, no package.json entry, no drift gate — because there is no second
    copy that can drift. CLAUDE.md stays the single source of truth.

    (ii) BOTH FLAGS OR NEITHER, AND THE TEST MUST PIN THAT. The fallback alone is WORSE than the
    status quo: it loads CLAUDE.md and silently truncates it at 32768 bytes against a 43685-byte
    file, so a worker would act confidently on three quarters of the doctrine with no signal that
    the rest was cut — and the cut lands mid-rule, at a byte offset. Rationale (3) measures both.

    (iii) THE CAP IS PINNED TO THE RATCHET, NOT HAND-TYPED. `scripts/claude-md-budget-baseline.json`
    declares `capBytes: 44000`; the constant here must exceed it, and a test must fail if CLAUDE.md
    (or that cap) ever grows past the Codex cap. Otherwise this silently re-breaks the day the doc
    budget is raised — the exact shape of defect this repo keeps recording.

    (iv) THE PROSE SENTENCE STAYS, AND STOPS LYING. `spawnCodexWorker`'s prelude
    (worker-provider.ts) names AGENTS.md, a file this repo does not have and — under this design —
    never will. Keep the nudge, drop the false filename.

    (v) NOT IN SCOPE: renaming CLAUDE.md, changing what Claude Code loads, `settingSources`, the
    CLAUDE.md budget cap itself, or generating AGENTS.md. The Claude-worker lane still does not
    load CLAUDE.md (`settingSources: []`) and this task does not change that — it closes the CODEX
    lane only, and the resulting asymmetry is stated rather than hidden.
  acceptance:
    - claim: "the Codex spawn passes a project-doc fallback naming CLAUDE.md, so the lane auto-loads repository doctrine"
      proof: "unit test: test/the-codex-lane-auto-loads-no-doctrine.test.ts"
    - claim: "the spawn also pins an explicit project-doc byte cap, and the cap exceeds the committed CLAUDE.md ratchet ceiling"
      proof: "unit test: test/the-codex-lane-auto-loads-no-doctrine.test.ts"
    - claim: "removing either flag fails the suite, so the fallback can never ship without its cap"
      proof: "unit test: test/the-codex-lane-auto-loads-no-doctrine.test.ts"
    - claim: "the Codex prelude names only instruction files this repository actually contains, so the nudge cannot point at a missing one"
      proof: "unit test: test/the-codex-lane-auto-loads-no-doctrine.test.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF `codexExecArgs` already carries a `project_doc_` flag:
    `grep -n project_doc src/lib/worker-provider.ts`. MEASURED 2026-09-09 at 2a22ebcf: zero hits.
    CLOSE ALSO if Codex stops honouring the option — the binary is the authority, not the docs:
    `grep -ac project_doc_fallback_filenames <the vendored codex binary>` returned 18 on
    codex-cli 0.152.0 in the running image.

    THE CAP ASSERTION MUST BE ABLE TO FAIL, and the earlier version of this shard was right about
    why: assert the constant against the value read from `scripts/claude-md-budget-baseline.json`,
    never a hand-typed number, and prove it bites by feeding a baseline whose capBytes exceeds the
    Codex constant and watching the test go red. A size test that can only pass proves nothing.

    PROVE THE FLAGS ARE LOAD-BEARING, NOT MERELY PRESENT: drop `project_doc_max_bytes` and the
    third criterion must fail. Presence-only assertions would pass against a build that ignores
    the option entirely.

    DO NOT ASSERT THAT CLAUDE CODE READS CLAUDE.md IN A WORKER. It does not: `spawnWorker` passes
    `settingSources: []`. This task is about the CODEX lane only, and that asymmetry survives it.
  note: |
