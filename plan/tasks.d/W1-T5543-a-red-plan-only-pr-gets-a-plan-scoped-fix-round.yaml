  design: |
    1. LADDER ORDER for a red plan filing on a machine-lane head authored by the fleet App:
       (a) W1-T5349's `tryPlanRepair`, unchanged.
       (b) The deterministic body cures: `acceptanceGateBodyRepair` for `no-header`/`empty-proofs`, plus
           W1-T5544's wrapped-pattern unwrap, plus a new `files-and-credits-the-same-task` cure that removes
           the body's `Remudero-Task:` trailer naming a task the filing itself introduces. The cure is
           validated by re-running `acceptanceAuthorTimeCheck` on the new body.
       (c) The PLAN-SCOPED ROUND (below).
       (d) The exhausted state, which W1-T5536's ladder handles. A lane PR is not requeueable, so it goes
           to the per-cause digest.

       A base red named by main's latest run (W1-T5349's `wait`) or by W1-T5490 still waits and never
       dispatches. Operator-authored plan PRs keep today's `refused-escalate`.
    2. PLAN-SCOPED ROUND (run-task.ts).
       - Before dispatch, run `planPrPreflight` at the PR head (a detached tree, as
         `planPrPreflightAtCommit` does). Feed its findings to the worker, plus the `ci` test failures from
         the existing `fetchCiFailures` tails, which W1-T4461 renders as failing tests.
       - The stageable set is EXACTLY the PR's changed paths that satisfy `isInPlanScope`
         (src/lib/plan-scope.ts:45); the synthetic task's `files` comes from `fixRungTaskFor`'s
         `changedPaths`, filtered to plan scope. Any other path refuses the commit.
       - No `src/` or `test/` file is ever staged, which is what keeps Rule 15 intact.
       - For a shard whose task already exists on main, the commit is also refused if it changes a
         `claim:`/`proof:`/`satisfied_by:` line the PR had not already changed (reuse `criterionFieldTampered`
         over the round's own diff against the PR's prior head).
       - The worker may also return a structured `PR_TITLE:` / `PR_ACCEPTANCE:` block. The parent applies
         these only through the REST metadata write, and only when the new title/body pass the same
         preflight.
       - The parent pushes only if `planPrPreflight` on the round's commit and metadata returns ok. Otherwise
         the round is a refusal (W1-T5542), with the preflight's first failing line as its reason.
    3. NEW FIX MODE `plan-gate` in `FIX_MODE_RULES` (prompt-render.ts:307), ahead of `ci-log`, chosen when the
       evidence carries `planGateFindings`. Its prompt names the stageable plan paths, the preflight findings
       verbatim, the self-credit rule (W1-T3231), and that a proof must discriminate head from base.
    4. LEDGER. `sweep.plan_round.dispatched`, `.pushed` (with the preflight verdict), and `.refused`. All carry
       pr_number, head_sha, the lane head class, and the checks. A pushed round's new head re-enters the
       ordinary flow.
