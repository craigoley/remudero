  falsifier: |
    Four reverts, each turning a named case red:
    - Restore the `refused-escalate` rewrite after a failed `tryPlanRepair`: the first case sees `deps.escalate`
      and no plan round.
    - Widen the stageable set to the synthetic task's full `changedPaths`: a fixture PR whose round touches
      `test/x.test.ts` commits it.
    - Skip the post-round preflight: a round whose commit still fails lint-plan is pushed.
    - Drop the self-credit cure: the files-and-credits fixture dispatches a worker.
