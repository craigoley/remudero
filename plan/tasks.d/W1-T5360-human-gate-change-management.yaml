- id: W1-T5360
  title: "Keep machine PR repair and standing merge holds out of the human decision Inbox"
  repo: remudero
  depends_on: [W1-T5332]
  priority: 2
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 15.00
  risk: medium
  band_meaning: blast-radius
  origin: "2026-10-02 operator approved the human-gate implementation follow-ups"
  plan_refs: [W1-T5021, W1-T3186]
  files: [src/lib/human-gate.ts, src/lib/now-view.ts, test/human-gate-change-management.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at 6a539e9bcb3a6a45a58742797b9a0c6b17af0d73: nowActions projects
    blocked PR dispositions and operator merge holds, while the approved W1-T5021
    design specifies separate Inbox and change-management ownership. This is slice 3.
  design: |
    Feed source-qualified nowActions into the shared human-gate projector. A repairing
    disposition is machine work and produces no human gate. An exhausted repair becomes
    an Inbox ask with its failed attempts, source evidence and one available resolution verb.
    An unknown disposition preserves uncertainty and evidence instead of presenting success.
    A blocked-but-repairable PR and an operator's standing merge hold belong to separately
    labelled change management, not the Inbox badge. Derive hold removal from hold_released
    for the correct PR and instance. Deduplicate repeated snapshots by source condition.
    Reuse existing source-owned actions; never create a new approval, dispatch or merge hold.
    Do not alter repair capacity, strike policy, auto-merge policy or accepted operator rulings.
  acceptance:
    - claim: "a PR with an active automated repair never becomes a human decision"
      proof: 'grep: a repairing PR produces no human gate in test/human-gate-change-management.test.ts'
    - claim: "exhausted repair and a standing hold have distinct ownership"
      proof: 'grep: exhausted repair is an Inbox ask while a merge hold is change management in test/human-gate-change-management.test.ts'
    - claim: "hold release removes only the matching source-owned gate"
      proof: 'grep: hold release removes the matching instance and PR gate in test/human-gate-change-management.test.ts'
  falsifier: |
    Count a repairing PR in the Inbox, let a standing hold inflate its badge, or release
    another instance's hold: the corresponding ownership fixture fails.
