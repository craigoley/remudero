    Run against 9f7adfe — the commit BEFORE #1026 implemented the task — that pattern returns TWO hits: an
    import line and an unrelated daemon rung. It would have exited 0 on completely unbuilt work.
    THE WORK WAS REAL; THE PROOF PROVED NOTHING. #1026 genuinely fixed the probe's credential store, and the
    review executed criterion 5 and recorded it as substantiated — on a pattern that could not have failed.
    THE DISCRIMINATING PATTERN EXISTED: `home: workerHome` returns ZERO hits at 9f7adfe and ONE on today's
    main. So the difference between a proof and a decoration was one token, and nothing in the gate noticed.
    WHY THIS IS WORTH A GATE RATHER THAN A HABIT: the same class already cost this repo elsewhere. A proof is
    supposed to discriminate between done and not-done; one that passes on the merge-base discriminates
    nothing, and the review's `executed_pass` POSITIVELY OVERRIDES the keyword floor, so a non-discriminating
    proof is strictly worse than a prose one."
  design: |
    THE CHECK. For a criterion whose proof parses as `grep:` (parseDialectGrep, src/lib/review.ts), run the
    same pattern against the PR's MERGE-BASE as well as its head. A pattern that matches on BOTH is
    non-discriminating: it cannot distinguish the work having been done from its not having been done.
    THE VERDICT IS A DOWNGRADE, NOT A HARD FAIL, and that distinction is load-bearing. Mapping this to
    `failure` would red every PR whose proof happens to be broad, halting the fleet over an authoring gap —
    the same reasoning `capped` already uses. Record it as a distinct, rendered outcome that removes the
    proof's positive override and drops the criterion back to the keyword floor, so a real defect is visible
    without the gate becoming a tripwire.
    THE MERGE-BASE IS ALREADY REACHABLE: the review runs against a real checkout of the PR head, so the base
    ref is one `git merge-base` away — no new gateway and no new network call.
    EXPLICITLY NOT IN SCOPE: `unit test:` proofs. A forward-referencing test path legitimately matches nothing
    before the work and everything after, so the same rule does not apply to them and must not be extended
    there by analogy.
