- id: W1-T999
  title: "THE SERVE PROCESS'S BOARD GATEWAY IS THE ONE UNPACED CONSTRUCTION AND IT EXHAUSTED GITHUB'S SECONDARY LIMIT FOR TWO HOURS — serveCommand builds buildBatchedGithub without the pacer the daemon threads, at a 15s TTL, and 423 of 423 board fetches in the log failed while it retried into a limit it was holding open: thread the existing pacer and derive the TTL from the sweep distribution"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    THE INCIDENT, AND WHY IT IS URGENT. This is the first measured cost of the console being
    always-on rather than loopback-bound. It took the fleet down for over an hour, `remudero-serve`
    was stopped by hand and is still stopped — `Exited (137)` — and THE OPERATOR CANNOT RESTART IT
    UNTIL THIS LANDS. Re-derived from the stopped container's own logs, which persist after
    `docker stop`, at origin/main eb60b55c.

    (1) THE CADENCE AND THE TWO CALLS, MEASURED. `docker logs remudero-serve` holds 1,277 lines.
    The board gateway makes exactly two reads per poll:
      repos/craigoley/remudero/pulls?state=open&sort=updated&direction=desc&per_page=30&page=1   (212 occurrences)
      repos/craigoley/remudero/issues?labels=needs-human&state=all&per_page=100 --paginate --slurp (211 occurrences)
    212 PR-fetch attempts across 15:30:39Z–17:30:11Z (119.5 minutes). BUSIEST 30-MINUTE WINDOW: 76
    polls, one every 23.7 seconds. Inter-poll gap median 22s, minimum 15s, maximum 1,337s.

    (2) EVERY BOARD FETCH IN THAT LOG FAILED. 423 board-gateway lines and ZERO of them lack the word
    `failed` — measured as 0 non-failing lines against a control of 423 total. `rate_limit` appears
    on 423 lines; `board_gateway.fetch_ok` and `fetch_bytes` appear ZERO times. It retried into a
    limit it was itself holding open for two hours.

    (3) THE FINDING, IN ONE LINE: the mechanism already exists and the serve process bypasses it.
    THE MECHANISM ALREADY EXISTS AND THE SERVE PROCESS BYPASSES IT. `buildBatchedGithub`
    (`src/lib/status.ts`) already paces both reads — `paceGhEntry(opts.pacer, isGhRateLimitError,
    fetchAllIssues)` and the same wrapper around `fetchAll` — and reports back through
    `GhCallPacer.recordResult`. But `pacer?` is OPTIONAL, and that option's own doc says it plainly:
    "OPTIONAL and omitted by every existing caller/fixture: absent ⇒ both reads fire with no gap,
    exactly the pre-W1-T468 behavior. The daemon's real wiring (run-task.ts's `buildSweepHook`) is
    the only caller that constructs and threads one through."
    MEASURED, counted with `-l` so a zero is visible, and controlled: `pacer`, `GhCallPacer`,
    `createGhCallPacer` and `paceGhEntry` all read ZERO in `src/lib/serve.ts`, against a control of
    `createService` reading 1 in that same file. `createGhCallPacer()` has ONE call site in src/ and
    it is inside `daemonCommand`. And the two board-gateway constructions in `src/run-task.ts` differ
    exactly here: the one inside `buildSweepHook` passes `{ log, pacer }`; the one inside
    `serveCommand` passes `{ log }`. SO THE UNPACED CONSTRUCTION IS THE SERVE ONE, AND IT IS THE ONE
    POLLING EVERY 15 SECONDS FROM AN ALWAYS-ON CONSOLE.

    (4) THE INTERVAL IS ONE DEFAULT AND IT IS ALREADY CONFIGURABLE. `buildBatchedGithub` opens with
    `const ttlMs = opts.ttlMs ?? 15_000;`. Nothing in the serve construction overrides it, and
    `src/lib/serve.ts` carries `DEFAULT_BOARD_PREWARM_MS` whose own comment says it "Matches
    buildBatchedGithub's own default TTL". 15 seconds against a full sweep whose median is 2.6
    minutes means THE BOARD CANNOT CHANGE FASTER THAN THE THING IT WATCHES — it re-asks roughly ten
    times per sweep and can only ever learn the same answer.

    (5) THE RETRY IS WHAT TURNED A LIMIT INTO AN OUTAGE, AND THE CLASSIFICATION IS NOT THE PROBLEM.
    The gateway DOES classify: `classifyGhFailure` reads 12 times in status.ts, the reason is stored
    in `lastFetchFailureReason`/`lastIssueFetchFailureReason`, ledgered as
    `board_gateway.fetch_failed`, AND READ BACK — `readFailed()`'s accessor returns it, so this is
    NOT a twelfth built-and-unread label. WHAT IS MISSING IS BACKOFF: `retry-after`, `Retry-After`
    and `retryAfter` all read ZERO in both `src/lib/status.ts` and `src/lib/open-prs-rest.ts`,
    against a control of `classifyGhFailure` reading 12 in status.ts. NOTHING ON THIS PATH HONOURS
    GITHUB'S OWN RETRY HEADER. The pacer is where the waiting already lives — `sleep` reads 7 times
    in open-prs-rest.ts and `setTimeout` once — which is why reusing it beats building a second
    mechanism and is why this shard is small.

    (6) THE `state=all` COST IS REAL, GROWS FOREVER, AND IS NOT A FREE FIX. `labelledIssuesRestArgs`
    (`src/lib/escalate.ts`) builds `labels=…&state=…&per_page=100` with `--paginate --slurp`, and
    `src/lib/status.ts` calls it with `"all"` while `src/lib/escalate.ts` calls it with `"open"`.
    MEASURED THIS FILING: page 1 of the `state=all` query returns 100 rows of which 98 ARE CLOSED and
    2 are open, AND THE RESPONSE CARRIES A `rel="next"` LINK — so `--paginate` walks at least two
    pages, at least three requests per poll rather than two, to surface two open items. THE OPEN
    QUEUE IS 2 ISSUES, BOTH ONE DAY OLD. But `state=open` is NOT free: `GitHub.issueByUrl` returns
    `{ state: string }` and the escalation-lifecycle read in status.ts consumes it to tell a HANDLED
    (closed) escalation from an unresolvable one, FAILING CLOSED when it cannot. Dropping the closed
    rows would blind that read. RECORDED AS MEASURED AND SCOPED OUT — see design (v).

    (7) CONDITIONAL REQUESTS ARE POSSIBLE WITH THE INSTALLED TOOL, WHICH THE BRIEFING FOR THIS FILING
    DID NOT EXPECT — AND THEY DO NOT FIX THIS INCIDENT. `gh` is 2.63.2 in the image and `gh api
    --help` carries THREE relevant flags: `--cache duration` ("Cache the response"), `-H,
    --header key:value`, and `-i, --include` ("Include HTTP response status line and headers"). So an
    ETag CAN be captured with `-i` and replayed with `-H 'If-None-Match: …'` — conditional requests
    do NOT require replacing `gh` with a real HTTP client. BUT THE GUARANTEE IS NARROWER THAN THE
    PROBLEM: GitHub's documentation exempts a 304 from the PRIMARY rate limit and says NOTHING about
    the SECONDARY limit, and the secondary limit is what this incident hit — the log never once names
    `secondary`, it only says `rate_limit`, 423 times. A 304 IS STILL AN HTTP REQUEST. ETAGS WOULD
    NOT HAVE PREVENTED THIS. Scoped out — design (v).

    (8) WEBHOOKS ARE THE EVENTUAL ANSWER AND ARE NOT THIS TASK. GitHub recommends them over polling
    and they would genuinely fix it, but they need a public endpoint and the console only became
    reachable today. Named, left.
  design: |
    THE SHAPE: two arguments at ONE call site, both of which the gateway already accepts. No new
    mechanism, no new signal, no new ledger step, and the board is made cheap rather than turned off.

    (i) THREAD THE EXISTING PACER INTO `serveCommand`'S CONSTRUCTION. `buildBatchedGithub` already
    takes `pacer?: GhCallPacer` and already calls `paceGhEntry` around both reads; `createGhCallPacer`
    already exists in `src/lib/open-prs-rest.ts`. The serve construction passes `{ log }` and must
    pass a pacer too. THIS IS A REUSE, NOT A BUILD — rationale (3).

    (ii) ONE INSTANCE PER PROCESS, MATCHING THE DAEMON'S OWN DISCIPLINE. The pacer's value is a
    SHARED gap across call sites, so the serve process constructs one and threads it, exactly as
    `buildSweepHook` does. Constructing one per request would pace nothing.

    (iii) DERIVE THE TTL FROM THE SWEEP DISTRIBUTION, NOT A ROUND NUMBER. The sweep's median is 2.6
    minutes and its p90 is 17 minutes. A TTL at or just under the MEDIAN means the board is never
    more than one sweep behind while re-asking roughly once per sweep instead of ten times:
    150_000 ms. THE LATENCY THE OPERATOR PAYS IS THE HONEST HALF OF THIS — a board fact can be up to
    2.5 minutes stale, against an underlying sweep that changes every 2.6 minutes at the median, so
    the staleness is bounded BELOW the rate at which the watched thing moves. The p90 of 17 minutes
    is the reason NOT to go further: a TTL past the median would still be correct but would make the
    board feel dead during the long tail. Choose the value against that distribution and say so.

    (iv) THE BACKOFF IS THE PACER'S, NOT A NEW ONE. `GhCallPacer.recordResult` already exists to be
    told a call was rate-limited, and the sleeping already lives in that module. The failure path
    must report through it rather than immediately re-polling on the next tick. A builder who writes
    a fresh retry loop, a fresh timer, or a `retry-after` parser in status.ts has built the second
    mechanism this task exists to avoid.

    (v) OUT OF SCOPE, EACH WITH ITS MEASURED REASON. `state=all` → rationale (6): the closed rows
    feed `issueByUrl`'s state read and dropping them blinds a fail-closed consumer; a separate
    ruling. ETag/`--cache` → rationale (7): possible with the installed `gh`, but exempt only from
    the PRIMARY limit, so it does not address this incident; a separate shard if wanted. Webhooks →
    rationale (8). AND NOT THIS: disabling the board, removing the poller, or reducing what the
    needs-me queue renders. The operator wants the console working; this makes it cheap.

    (vi) THE DAEMON PATH MUST NOT MOVE. `buildSweepHook` already threads its own pacer and already
    works. Criterion 4 pins it: whatever the serve wiring gains, the daemon's instance and its
    behaviour stay as they are.

    (vii) NO NEW SIGNAL. `board_gateway.fetch_failed` already carries the reason and
    `readFailed()` already surfaces it — rationale (5). Eleven measured mechanisms have merged green
    with no reader, `cloudflareAccessIdentityProvider` the most recent at 0 src calls against controls
    of 2, and a "pacer engaged" row nobody reads would be the twelfth.
