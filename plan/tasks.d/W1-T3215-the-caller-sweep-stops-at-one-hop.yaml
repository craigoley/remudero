  title: "THE MANDATED CALLER SWEEP IS ONE HOP, SO A SUITE THAT NAMES THE CHANGED SYMBOL'S CALLER IS INVISIBLE — `git grep -l <changed symbol>` returned 0 for the very suite that went red, while the in-file caller it does name returned 22"
  repo: remudero
  depends_on: []
