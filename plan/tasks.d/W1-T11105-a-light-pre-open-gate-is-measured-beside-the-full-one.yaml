- id: W1-T11105
  title: A fleet build's pre-open gate derives in shadow what a light gate (census counts plus every fast-gate step but census suites and rule-checks) would have decided, from the full gate's own per-step log, and ledgers both verdicts and durations, so the switch to the light gate is decided on measured misses at no extra gate cost
