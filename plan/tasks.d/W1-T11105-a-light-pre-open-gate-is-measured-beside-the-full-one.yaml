  rationale: |
    MEASURED 2026-11-02, implement.preopen_gate rows in the core ledger union from 2026-11-01T12Z (about 26 h):
    - 54 gates took 23 worker-hours: median 24 min, p90 38 min, max 139 min.
    - 32 (59%) ended unmeasured: "fast gate exceeded its backstop" at about 38.6 min (measured-p95-plus-iqr), with no readable summary. 16 of them named "environment: rule-checks". 11 of those runs opened their PR anyway, and 10 handed off.
    - 10 passed (median 10 min). 12 failed fast: 8 on project:unavailable (environment), 4 on census-precheck.
    - Inside an author static run on 2026-11-02, census-precheck took 1,896 s and rule-checks 924 s of 3,085 s. CI runs both before merge.
    Operator ruling 2026-11-02 (AskUserQuestion): "Shadow first, then switch". The gate runs everything for 48 h while recording what the lighter gate would have decided, then the switch happens on the operator's yes, against the hit/miss numbers.
  design: |
    1. ci-parity's fast-gate run accepts a skip set (job names). rmd preflight exposes it as --skip-step <job> (repeatable). Absent, nothing changes.
    2. preopen-gate runs the light gate first: the same contained launch with --skip-step census-precheck --skip-step rule-checks, plus census-precheck --counts-only. Its bound is the light gate's own measured p95 plus IQR once 20 rows exist, 10 min before that. Then the full gate runs exactly as today.
    3. implement.preopen_gate gains light_result, light_failed, light_duration_ms and light_miss (full failed on census-precheck or rule-checks only, and light passed). It also gains light_would_save_ms (full duration minus light duration) when the full gate passed or was unmeasured.
    4. Promotion (a separate operator-approved change): after 48 h of rows, report light_miss count against the full gate's real catches, and the total would-save hours.
