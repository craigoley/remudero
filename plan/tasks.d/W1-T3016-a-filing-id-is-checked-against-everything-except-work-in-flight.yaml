- id: W1-T3016
  title: "A NEW SHARD'S ID IS CHECKED AGAINST EVERYTHING EXCEPT THE WORK IN FLIGHT — `loadPlan` fails loud on a duplicate only once BOTH shards are on main, and `next-task-id` reads open PRs only when `gh` exists, so a filer who picks an id off a directory listing collides with another open PR and nothing refuses it until the second one merges"
  repo: remudero
