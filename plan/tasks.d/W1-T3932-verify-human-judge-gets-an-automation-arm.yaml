- id: W1-T3932
  title: "VERIFY-HUMAN JUDGE NEEDS AN AUTOMATION ARM — the LLM can now decide whether a parked shard needs the operator or can enter the self-improvement flow, while failures still surface to a human and no task is silently released"
  repo: remudero
  depends_on: [W1-T3921]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: high
  band_meaning: blast-radius
  origin: "operator-follow-up#verify-human-automation-2026-09-21"
  plan_refs: [W1-T3188, W1-T3921, W1-T3906]
  files: [src/lib/verify-human-judge.ts, src/run-task.ts, test/a-verify-human-shard-is-judged.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED on origin/main after W1-T3188 and W1-T3921: `VerifyHumanDecision` has exactly two
    arms, `needs_operator` and `backlog`. The real `rmd verify-human-sweep` callsite sends the
    first arm to an inbox proposal and the second arm only to a ledger row. It has no way to say
    "this is not a human judgment call; hand it to the self-improvement machinery".

    That distinction matters now. The current machine-authored CI-learning population is deliberately
    parked as `verify: human` by `isParkedCiLearningProposal` in `src/lib/plan.ts`: it may be
    admitted for judgment, but it is not released into `runnableCandidates` unless an operator
    ratifies it. The live sweep therefore has three materially different outcomes hiding behind two
    labels: a policy/budget/intent question for the operator, a mechanical candidate an agent can
    work, and a proposal that should remain visible but wait for dependencies or better evidence.

    OPERATOR DIRECTION 2026-09-21: use an LLM judge to determine whether a verify-human item needs
    human escalation or can be automated; lean into automated flow and self-improvement; do not add
    hard ceilings or floors; do not introduce blocks that strand PRs. The existing proposal registry
    and inbox draft rung are the safe automation handoff: they already accept proposal-shaped input,
    preserve provenance, and keep plan edits and merge decisions outside the judge.
  design: |
    (i) ADD A THIRD JUDGE VERDICT, `automate`, alongside `needs_operator` and `backlog`. Extend the
    machine-readable prompt and parser so the model must choose exactly one of the three. The judge
    remains advisory classification only; it cannot write a plan record, change `verify:`, close or
    retire a task, create a release row, or alter branch protection.

    (ii) ROUTE THE AUTOMATION ARM INTO THE EXISTING SELF-IMPROVEMENT FLOW. An `automate` verdict
    stages a deterministic, idempotent inbox proposal whose summary names the source shard, the
    judge reason, and that it is an automation candidate. The existing inbox/draft machinery then
    owns the agent work and its normal PR/gate path. Do not invent a second registry, do not dispatch
    a `verify: human` task directly, and do not mint `ratify.approved` or add the task to
    `releasedIds`; an automated candidate must never silently become a runnable plan task.

    (iii) KEEP THE THREE ROUTES DISTINCT. `needs_operator` keeps the current human-facing proposal;
    `automate` gets the automation-candidate proposal; `backlog` remains a visible ledgered no-ask.
    Use distinct deterministic proposal ids so a later observed-state change can update the route
    without duplicating the same candidate. Existing settled-state caching must recognise all real
    verdicts, while a failed or unparseable judge remains fail-open to `needs_operator` and is never
    cached as settled.

    (iv) TEST THE SAFETY POLARITY AND THE PRODUCTION WIRE. The fixture must prove all three arms,
    exact proposal ids/summaries, idempotent staging, fail-open parsing, and zero writes to
    `plan/tasks.d/` or `plan/tasks.yaml`. The production command must pass the new route through its
    existing `stageProposal` seam. No required status check, merge gate, PR admission rule, or
    operator release path changes; this is a routing improvement that can only add work to the
    existing self-improvement inbox.

    (v) NO FIXED POPULATION CEILING OR FLOOR. The observed-state key and the resumable batch/yield
    behavior from W1-T3921 determine what is due. The automation arm is not a rate limit and must not
    turn a provider outage into a silent skip; transport, malformed output, or missing state keeps
    the shard on the human arm for the next pass.
  acceptance:
    - claim: "the LLM prompt and parser admit exactly the three routing decisions, including the automation arm"
      proof: "grep: VERIFY_HUMAN_DECISION: <needs_operator|automate|backlog> in src/lib/verify-human-judge.ts"
    - claim: "an automate verdict is routed through the existing production proposal seam rather than directly releasing a verify-human task"
      proof: "grep: decision === \"automate\" in src/run-task.ts"
    - claim: "the three routes have distinct deterministic proposal identities and the automation summary preserves judge provenance"
      proof: "unit test: an automate verdict stages one idempotent proposal and preserves the judge reason"
    - claim: "a failed or unparseable judge still fails open to needs_operator and never becomes an automated or settled decision"
      proof: "unit test: malformed verify-human output fails open to needs_operator and remains due"
    - claim: "the automation route cannot edit plan records or manufacture an operator release"
      proof: "unit test: an automate verdict never writes plan files or a ratify release row"
  falsifier: |
    Remove `automate` from the parser or prompt and the positive automation fixture must stop routing
    through the proposal seam. Replace the proposal handoff with a `verify:` edit, a
    `ratify.approved` ledger row, or a direct `releasedIds` insertion and the no-plan/no-release
    fixture must fail. Make malformed output settle as automation and the fail-open test must expose
    the unsafe suppression. Run the exact same observed state twice and the proposal registry must
    contain one deterministic automation proposal, never two.
  note: |
    This is deliberately one consolidated follow-up for the machine CI-learning queue, not a new
    human question per W1-T3587/W1-T3589/W1-T3590/W1-T3591/W1-T3592/W1-T3594/W1-T3624/W1-T3630/
    W1-T3713/W1-T3714/W1-T3715/W1-T3717/W1-T3750/W1-T3751/W1-T3752/W1-T3770/W1-T3771/W1-T3827/
    W1-T3828/W1-T3829/W1-T3831/W1-T3833/W1-T3834. Those records retain their individual evidence
    and policy choices; this task supplies the missing routing arm. Mechanical low-risk entries can
    flow to an agent, while policy-bearing entries remain `needs_operator` and fail-open behavior
    prevents a model or provider outage from hiding a decision.
