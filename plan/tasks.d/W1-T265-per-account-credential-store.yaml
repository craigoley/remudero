- id: W1-T265
  title: "the worker credential store becomes IDENTITY-AWARE and per-account — ensureWorkerKeychain's !exists gate provisions once ever and never notices the login keychain changed identity underneath it, so logging the fleet user into a second subscription does NOT switch the fleet; the only working switch today is an undocumented, unledgered manual file move"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 150.00
  rationale: "OPERATOR NEED (2026-07-31): the operator moved this host from one Anthropic subscription to a second
    one BY HAND — /logout + /login as the fleet user, then moving state/remudero-worker.keychain-db aside so the
    next boot re-provisions. It worked, and it is the ONLY thing that works, and nothing about it is supported.
    OBSERVED at 07e5861: workerKeychainPaths(stateDir) (src/lib/worker-home.ts:406) is a pure function of the state
    dir and takes NO account parameter, so exactly one worker credential store can exist. ensureWorkerKeychain
    (src/lib/worker-home.ts:454) gates the whole copy branch on `if (!exists(opts.keychainPath))`
    (src/lib/worker-home.ts:475) — file existence, never identity, never expiry. It is called PER SPAWN
    (src/lib/worker.ts:590), so every spawn since provisioning has skipped the branch and only unlocked. The
    failure this creates is silent and is the worst direction available: log the fleet user into account #2 without
    clearing the store and every worker keeps spending account #1 while the meter watches account #2. Nothing
    anywhere compares the two. MEASURED over the unioned ledger (662 files, 4,160,926 lines): daemon.worker_keychain
    carries provisioned:false on EVERY boot from first record through 2026-07-31T15:16:23.417Z, and exactly ONE
    line in the entire history reads provisioned:true — 2026-07-31T16:39:00.582Z, the boot after the manual move.
    That single line is the whole of the switch's audit trail. SIBLING FILING: fb-1784749981468-a531e5 (status:new)
    names the same !exists gate from the EXPIRY angle — a copied token that expires with no re-read. Same gate, same
    remedy shape; this task makes the gate content-aware and that filing's clause (b) rides on it."
  design: |
    THREE changes, all at the one seam that already exists.
    (1) PER-ACCOUNT STORE PATH. workerKeychainPaths gains an OPTIONAL account label and returns
        `remudero-worker-<label>.keychain-db` + `worker-keychain-password-<label>` when given one, and the
        legacy unlabelled pair when not — so an unconfigured install is byte-for-byte unchanged. The label is a
        NAME chosen by the operator or derived from the login item's `acct` attribute (already parsed at
        src/lib/worker-home.ts:498). It is NEVER a token, and it never leaves the name domain — the same
        secret-free discipline billingMode(childEnvKeys) already uses (src/lib/env.ts:173).
    (2) IDENTITY-AWARE PROVISIONING. The `!exists(opts.keychainPath)` gate becomes: provision when the store is
        ABSENT, or when the store's `acct` attribute DIFFERS from the login keychain's. A mismatch re-provisions
        rather than silently reusing the stale copy. Comparison is attribute-to-attribute (names), never
        secret-to-secret — the secret is read only on the provisioning path, exactly as today.
    (3) A LEDGERED, DOCUMENTED SWITCH. WorkerKeychainSummary gains `account_label` and a `reason` naming why it
        provisioned (`absent` | `identity-changed` | `skipped`), so the existing daemon.worker_keychain line stops
        being a bare boolean and becomes the switch's audit record. docs/operator-guide.md gains the procedure the
        operator performed by hand, written against the rmd down / rmd up verbs W1-T169 (#987) shipped.
    THE COVERAGE TRAP THIS TASK MUST NOT FALL INTO (CLAUDE.md, #977/#978): every existing test of this module
    injects its own SecurityRunner and `exists`, so the DEFAULT implementations and each catch arm are unreachable.
    Append any new injectable parameter LAST so no positional caller shifts, and add a leaf test that exercises the
    real default runner rather than only a recorder.
    NOT IN SCOPE: which account a given run SHOULD use. Nothing selects an account today and this task does not
    decide it — that is W1-T266, deliberately a separate ruling.
  acceptance:
    - claim: "a login keychain whose acct attribute differs from the worker store's RE-PROVISIONS rather than silently reusing the stale copy"
      proof: "unit test: test/worker-keychain-account.test.ts"
    - claim: "a MATCHING acct attribute does not re-provision — the steady-state spawn path still costs one unlock and no secret read"
      proof: "unit test: test/worker-keychain-account.test.ts"
    - claim: "workerKeychainPaths returns a distinct store path per account label and the legacy unlabelled pair when given none"
      proof: "unit test: test/worker-keychain-account.test.ts"
    - claim: "the keychain summary carries an account LABEL and a provisioning reason and no credential value appears in either"
      proof: "grep: account_label in src/lib/worker-home.ts"
    - claim: "the DEFAULT SecurityRunner is exercised by a leaf test rather than only through an injected recorder"
      proof: "unit test: test/worker-keychain-account.test.ts"
    - claim: "the operator guide documents the account switch end to end and names the store artifact the switch replaces"
      proof: "grep: remudero-worker in docs/operator-guide.md"
  risk: high
  origin: architect
  plan_refs: ["§9"]
  files: [src/lib/worker-home.ts, src/lib/worker.ts, docs/operator-guide.md]
  status: queued
  attempts: 0
  note: "verify:auto — every seam is already injectable (SecurityRunner and `exists` are constructor parameters of
    ensureWorkerKeychain), so an identity mismatch is provable headlessly against a recorded argv with no real
    keychain, no real credential and no spawn. risk:high — this decides which credential EVERY worker spawns with;
    the asymmetric failure is a wrong re-provision that leaves the whole fleet unauthenticated, or a missed
    re-provision that spends the wrong account silently, which is worse because nothing surfaces it.
    budget_usd 150 — above the 100 house default because the diff is three files and the test matrix has to cover
    absent/matching/mismatched identity AND pay off the all-fakes coverage debt with a real-default leaf test,
    which is the specific shape that cost #977 and #978 an extra CI round trip each.
    HARD START DATE for any accounting built on top of this: 2026-07-31T16:39:00.582Z, the sole
    daemon.worker_keychain provisioned:true line in the unioned ledger. Before that instant no line in 4,160,926
    can be attributed to an account, because no line carries one."
