- id: W1-T9281
  title: "THE GH READ FLOOR JUDGES ONLY A gh COMMAND, NOT THE WORD gh IN AN ARGUMENT — deny-floor's invokes_gh strips quoted text one LINE at a time, so a multi-line `git commit -m \"... gh read floor ...\"` and a plain `echo the gh read floor` are refused as a read-shaped gh call; a filing agent's commit was refused this way on 2026-10-13"
  repo: remudero
