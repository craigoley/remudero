  band_meaning: span
  origin: "operator session 2026-10-13: a filing agent's `git commit -m` naming the gh read floor was refused as \"a read-shaped gh call 37s after the last\""
  plan_refs: [W1-T3275, W1-T1066, W1-T5670, W1-T9238, W1-T4915]
  files:
    - hooks/deny-floor.sh
