      - W1-T6153 at 2026-10-12T11:42:50Z, source_branch run-W1-T6153-1791670097134.
    Neither source branch exists on origin any more. The fleet itself deleted both, while live receipts named them:
      - Receipts: `run.freshness_handoff` rows on 10-10 22:10:35Z (verdict handed_off, reason freshness_yield),
        carried at boot on 10-11 14:01:47Z (`carried: true`). The head_sha values are dc5d0d2c5 (W1-T7703) and
        9dba39b36 (W1-T6153).
      - Deleter: the daemon's automatic branch reap, run DAEMON-1791749825942. Its `branch_reap.dry_run` row at
        10-11T20:51:29Z classified all three receipt-named heads `tip_in_main`: run-W1-T7703-1791665606208,
        run-W1-T6153-1791670097134 and run-W1-T7650-1791670097134. `branch_reap.pruned` at 20:51:38.717Z then
        logged `deleted_branches: ["run-W1-T7703-1791665606208"]`. GitHub's events API shows remudero-fleet[bot]
        deleting that ref at 20:51:39Z.
      - The same row withheld run-W1-T6153-1791670097134 only on tip age. Its tip, 9dba39b36, was committed
        10-10 22:06:38Z, under the 24 h bound. Run DAEMON-1791756003074 then deleted it, with
        run-W1-T7650-1791670097134, at 10-11T22:16:07Z. That is the first pass after the bound expired.
    Both receipts point at a plain main commit, because each worker yielded before committing anything. W1-T6153
    yielded 45 s after its anchor was built. The branch tip is therefore an ancestor of main, `tip_in_main` holds,
    and the reaper has no reason to keep the branch.
    READ on origin/main 62e0d5efe:
      - src/run-task.ts:25424 `reapBranchesSteps` removes only W1-T4633's reversibly closed heads from
        `plan.deletable`. Nothing there consults a handoff receipt.
      - src/lib/branch-reaper.ts:745 `withholdActiveBranches` judges `tip_in_main` by tip AGE alone (`minAge`, 24 h,
        :753). A receipt can outlive any age bound: these two waited 33 h and more. Age is the wrong evidence.
        The ledger already holds the right evidence: src/lib/daemon.ts:247 `pendingWorkerBoundaryHandoffs`, the
        exact set the restore reads at src/run-task.ts:19428.
      - src/run-task.ts:5141 `restoreBoundaryCheckpoint` compares `ls-remote` output to the receipt's head
        (:5147). An ABSENT ref yields "", so a deleted branch reports as "remote head moved", which is untrue.
      - src/lib/daemon.ts:256: a `restart_checkpoint_restore_failed` verdict consumes nothing (W1-T7806). So a
        receipt whose branch is gone stays pending forever, and every dispatch of the task ends at the same
        refusal with no worker run. W1-T7703 has burned two dispatches so far, and W1-T6153 one.
    NOTHING IS LOST THIS TIME. Both head shas are ancestors of origin/main (`git merge-base --is-ancestor`), so the
    restore would have been a no-op (`base === checkpoint.headSha` returns main). The next receipt can carry
    real commits, though, and the same deletion would then destroy paid work.
    W1-T147 (the overnight chaos drill) shares src/run-task.ts and src/lib/daemon.ts with this task only because
    both are large shared files. It injects faults and touches neither the reap keep nor the restore.
  design: |
    1. THE RECEIPT IS THE AUTHORITY FOR ITS BRANCH. In `reapBranchesSteps`, next to `keepReversiblyClosedHeads`,
       remove from `plan.deletable` every branch that `pendingWorkerBoundaryHandoffs` names over the ledger this
       pass already reads (`opts.creditLedgerPath ?? opts.ledgerPath`). Apply this whatever the classification
       reason (tip_in_main, patch_id_equivalent, closed_unmerged, merged). The set must be computed by the same
       function the restore uses at src/run-task.ts:19428, so the two can never disagree about which branches
       are live. List the kept names in the `branch_reap.dry_run` row as `kept_handoff_receipt_branches`. When no
       ledger is configured, keep nothing (today's behaviour). When the ledger exists but cannot be read, keep
       every `run-<id>-<epoch>` head in deletable, because a live receipt cannot be ruled out. This keep needs no
       age bound and no count bound: it lasts exactly as long as the receipt is pending. Once a receipt is
       consumed (a later verdict, or step 3's drop row), its branch becomes reapable again on the ordinary rules.
    2. AN ABSENT BRANCH IS NOT A MOVED BRANCH. `restoreBoundaryCheckpoint` tells three cases apart: an `ls-remote`
       that failed (it throws, which is transient, and keeps today's restore_failed), a ref that is absent (empty
       output), and a ref at a different sha (the real moved-head refusal, unchanged). For an absent ref:
       a. If the receipt's head is already an ancestor of the fresh worktree's HEAD, the run resumes on main.
          `implement.checkpoint_restored` records it with `source_branch_absent: true`. This is the W1-T7703 and
          W1-T6153 case.
       b. Otherwise, try `git fetch origin <head_sha>`. If the fetched object resolves to head_sha, recreate
          `refs/heads/<source branch>` at that sha. Use a create-only push (an empty-expect
          `--force-with-lease`, never a bare force), so a concurrent recreate cannot be overwritten. Then restore
          by the existing merge path, and log `implement.checkpoint_branch_recreated` with the branch and sha.
       c. Otherwise (the object is no longer on origin), log ONE `implement.checkpoint_dropped` row (task,
          source_branch, head_sha, reason) and continue the SAME run fresh from main. Write no no_pr verdict, so
          no dispatch is burned.
    3. A DROPPED RECEIPT IS CONSUMED. `pendingWorkerBoundaryHandoffs` treats an `implement.checkpoint_dropped`
       row whose branch and head match the pending receipt as replacing it. The receipt stops being pending,
       `handoffReceiptsToCarry` stops re-carrying it, and the next dispatch never sees it. The W1-T7806 rule (a
       failed restore consumes nothing) still holds for transient failures and for a genuinely moved head.
       Retain the drop row in `DECISION_RELEVANT_LEDGER_STEPS` so ledger rotation cannot resurrect the receipt.
    Tests go in a new file, test/a-live-handoff-receipt-keeps-its-run-branch.test.ts, with `test(` titles
    verbatim as in the proofs below. Use a real gitRepo() fixture with a bare origin for the restore cases: delete
    the source ref and keep or drop its object. Use the reap's injected exec for the keep cases. Give every
    fixture a local git identity (the CI runner has none) and use neutral helper names.
