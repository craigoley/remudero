- id: W1-T13211
  title: "The object reaper reads the namespace start through the shared reader, so its boot-evidence suite passes on a Mac and the repo has one reading of when this pid namespace started"
  repo: remudero
  priority: 1.0
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # boot evidence gates the reaper's deletion of store leftovers, and on macOS it changes from never readable to a derived value
  band_meaning: span
  origin: "operator-session#mac-reds-on-a-tree-equal-to-main-2026-11-16"
  plan_refs:
    - W1-T10750
    - W1-T12356
