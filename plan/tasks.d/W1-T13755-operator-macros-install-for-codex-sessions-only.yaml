  rationale: |
    W1-T13726 (docs/research/operator-macros-for-codex-sessions.md, codex-cli 0.169.0) found Codex scans
    .agents/skills from the project root to cwd, $CODEX_HOME/skills and $HOME/.agents/skills, never .claude/skills,
    and ignores Claude's disable-model-invocation. Workers share CODEX_HOME but get a redirected HOME, so the
    operator's own $HOME/.agents/skills reaches the operator's Codex sessions and no worker. Today Craig's Codex
    sessions have none of the eleven macros.
  design: |
    1. scripts/generate-macro-skills.mjs gains --codex-home[=<dir>] (default $HOME/.agents/skills) and --check:
       renderCodexMacroSkill builds on renderMacroSkill, drops the $ARGUMENTS line, and writes
       <dir>/<name>/agents/openai.yaml with policy.allow_implicit_invocation: false.
    2. It refuses a target under $CODEX_HOME or inside any git worktree, before writing anything.
    3. package.json gains a macro-skills:codex script.
    4. isOperatorOnlyMacroTable also requires every row's Codex render to be explicit-only, through the generator's
       own renderer.
    5. The census test asserts the four criteria and joins rmd census-membership beside
       test/a-repo-skill-no-worker-can-reach.test.ts.
    INVARIANT no-worker-sees-a-macro: no file a dispatched worker's Codex scans (its worktree's .agents/skills, $CODEX_HOME/skills) gains a macro.
  falsifier: |
    Delete the refusal of a $CODEX_HOME target: criterion 2 fails. Drop the openai.yaml write: criterion 4 fails.
