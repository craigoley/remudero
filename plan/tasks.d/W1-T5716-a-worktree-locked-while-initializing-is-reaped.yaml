  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a and the state checkout (read only). The admin dir
    state2/remudero/.git/worktrees/machine-judge-garden-1790870097951/ holds `locked` =
    `initializing` and an empty `index.lock`: the 10-01 15:55 container recycle killed
    `gardenCheckout` -> `worktreeAdd` mid-add. `executeWorktreeRemoval` (src/lib/worker.ts) runs `git
