    cases and is unchanged.
  design: |
    Before removal, read the admin dir's `locked` file: when its reason is exactly `initializing`,
    remove with `-f -f`; any other lock reason keeps the tree under a new `locked` keep reason and
    is never force-removed. A removal that still fails records git's stderr on the keep row.
  acceptance:
    - claim: "a worktree whose admin record is locked with reason initializing is removed through git and its admin record is gone, while a worktree locked with any other reason is kept as locked"
      proof: "unit test: test/a-worktree-locked-while-initializing-is-reaped.test.ts"
