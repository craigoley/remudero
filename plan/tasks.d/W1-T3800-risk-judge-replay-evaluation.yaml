  rationale: |
    FILED FROM CURRENT MAIN at 91505089d. The disposition corpus already exists under
    `test/fixtures/risk-judge-dispositions/` and its tests exercise `planRiskJudgeAction` and
    `decideGatePosture` (`test/risk-judge-disposition-goldens.test.ts:28-85`). The fixture README
    explicitly says the cases do not spawn an LLM, spend money, change live routing, or yet run as
    a bounded replay (`test/fixtures/risk-judge-dispositions/README.md:20-22`).

    THAT IS A REAL SELF-IMPROVEMENT GAP, NOT A REQUEST TO BUILD THE JUDGE AGAIN. The controller
    has the four consequences — LAND, REPAIR, LAND+DEBT and STOP — and the healthy/recoverable
    cases are intentional so the policy does not learn that every uncertainty is danger. What is
    missing is a repeatable report answering: did the controller choose the expected disposition,
    did it use fallback, did it select the intended side effect, and are new fixtures increasing
    false stops or false proceeds?

    PRIVACY IS PART OF THE DELIVERABLE. The risk-judge boundary now scrubs cloned input and
    verdict reasons, and credential findings force STOP (`src/lib/risk-judge.ts:249-293,
    676-699`). An evaluator that accepts raw prompts, ledger excerpts, emails, paths, or
    credentials would create a new AIUC-1 A006/A008 exposure while claiming to measure the old one.
  design: |
    (i) OFFLINE AND SIDE-EFFECT FREE. The evaluator runs the existing pure/controller functions
    against versioned fixtures. It must not spawn an LLM, call the network, file a debt task,
    repair a worktree, change a ledger, alter production routing, or spend provider credits.
    Side effects are represented as observed intents in the report only.

    (ii) SCRUB BEFORE EVALUATION, THEN REFUSE RAW FIXTURES. Every input and expected reason passes
    the same deterministic scrub boundary used by the judge. A fixture containing credential- or
    PII-shaped material is refused with a named finding, not silently admitted as evaluation data.
    The report carries hashes, stable identifiers, and counts — never raw prompt text or secrets.

    (iii) REUSE THE CONTROLLER. Do not copy the consequence table into a second implementation.
    Run `planRiskJudgeAction` and `decideGatePosture`, inject no-op repair/debt callbacks, and
    compare the resulting outcome, action, fallback, and side-effect intent with the fixture's
    expected values.

    (iv) MEASURE, DO NOT OPTIMIZE THE THRESHOLD. Emit deterministic counts for total fixtures,
    expected/observed disposition agreement, false STOP, false proceed, fallback use, side-effect
    agreement, and refused-sensitive-fixture count. Do not change production thresholds or make a
    passing report an approval gate.

    (v) POSITIVE CONTROLS AND CORPUS COVERAGE. The test suite must include a healthy control and a
    deliberately failing positive control for the evaluator's fixture discovery and sensitivity
    checks. A zero result without a positive control is not evidence. The report must also state
    which fixture files were read and which were refused.

    (vi) NO HUMAN LOOP. This task produces evidence for the risk-judge process and a machine-readable
    regression report. It does not park normal work, require operator approval, or add a production
    escalation path.
