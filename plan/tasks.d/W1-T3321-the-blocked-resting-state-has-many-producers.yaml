    THE CENSUS IS THE DELIVERABLE, NOT THE CONVERSIONS. Converting a gate is that gate's own task,
    sized and reviewed on its own evidence (W1-T3311 was one; W1-T3319 and W1-T3320 are two more).
    What does not exist is the LIST — which surfaces can refuse, and which of the three postures each
    one's remedy actually admits. Without it, "stop blocking" is applied wherever someone last got
    stung, which is how the tier gate survived four daemon crashes before anyone looked at it.
  rationale: |
    THE RULING (W1-T3318) IS UNAPPLIABLE WITHOUT AN INVENTORY. It says a gate REPAIRS, ROUTES, or
    CLOSES, and that a resting block is not an outcome. Nothing in the repo enumerates the surfaces
    that can refuse, so nothing can say which ones already comply.

    FOUR MEASURED PRODUCERS OF THE RESTING BLOCK, found by accident rather than by any census:

      1. `hooks/pre-push`'s test-tier admission. Refused a computable remedy its own message named.
         Cost: two operator pushes and FOUR daemon crashes in one day, zero defects caught. Converted
         by W1-T3311 — after the fact.
      2. `daemonExitCodeForSummary`. One task's throw exits the whole daemon; five occurrences took
         RestartCount to 4 of 5. W1-T3319.
      3. The doctrine byte caps. Refuse a rule and the knowledge dies with the PR — twice measured,
         and raising the cap does not touch the per-PR net rule that actually refuses. W1-T3320.
      4. `blocked_ci` re-dispatch. W1-T2923, W1-T2924 and W1-T2962 each ended blocked_ci TWICE in one
         night, W1-T3274 was attempted three times, and the cost-anomaly detector fired 18 times
         alongside — W1-T2924 at $11.37 against a $2.90 median. Re-running a task into the same block
         is the resting state with a spend attached.

    A FIFTH, DIFFERENT IN KIND AND WORTH THE CENSUS SEEING: `verify: human`. W1-T3206 measured 60
    such shards, 45 still queued, the oldest parked seven weeks — "a one-way park with no release"
    until `rmd approve` shipped. That is a resting block on WORK rather than on a PR, and it shows
    the census must cover surfaces that stop a task, not only surfaces that stop a diff.

    A SIXTH, AND IT FAILS IN THE DIRECTION NOBODY IS WATCHING: a lane can CREDIT UNBUILT WORK AS
    DONE. MEASURED 2026-09-10 on this repo's own filing PR #4960. Its commit body says, in as many
    words, "FILING ONLY: no Remudero-Task trailer, and this branch is not run-<id>-<epoch>." A
    background lane then pushed `chore(plan): align W1-T3322 shard slug` onto that branch, and the
    squash carried two `Remudero-Task:` lines onto main — four lines BELOW the sentence forbidding
    them. W1-T3322 was at least genuinely built; W1-T3323 was not built at all, and is now credited.

    WHY THIS BELONGS IN A CENSUS OF BLOCKING SURFACES even though it blocks nothing: it is the same
    class inverted. A blocking gate stops work loudly and someone notices. This marks work DONE
    silently — `isDispatchEligible` returns false at its `already-merged` arm, so the fleet will
    never dispatch W1-T3323, and every credit check reports the migration finished. The census must
    therefore count surfaces that decide a task's STATE, not only surfaces that refuse a diff; a
    census seeing only refusals would report this repo compliant while a filed, unbuilt task sits
    marked complete.

    AND THE SANCTIONED CORRECTION DOES NOT FIT. `rmd correct <task-id> --pr <n>` writes a
    `correction.provenance` line, but `applyCorrection` REQUIRES a resolving `prRef` and always
    records an `actual_pr_url` — it expresses "the credit named the wrong PR", never "the credit is
    false and there is no true PR". A wrongly-credited UNBUILT task has no sanctioned way back.

    AND ONE THAT MUST BE JUDGED, NOT ASSUMED: `hooks/deny-floor.sh`'s 180s read floor. It refused
    roughly eight operator reads in a single session — but the limit it models is real, and it was
    written after four secondary-limit 403s in that same session. Its defect is SHAPE, not existence:
    a flat 180s cannot tell GitHub's search bucket (~30/min) from core (5000/hour), so it over-refuses
    the cheap case and under-protects the expensive one. The census should record it as REPAIR-able
    (pace the call rather than refuse it) rather than as a harm bar.
  design: |
    (i) DERIVE THE POPULATION, NEVER HAND-ENUMERATE IT. A hand list goes stale by DROPPING coverage,
    which is the failure INSTRUMENT_SURFACE already recorded (W1-T402). Find refusal surfaces from
    the tree — non-zero exits in `hooks/`, `scripts/*-check.mjs` and `*-ratchet.mjs`, ci.yml jobs,
    and the verdicts that halt a drain — and require every one found to carry a declared posture.
    (ii) A DECLARED POSTURE, NOT AN INFERRED ONE. The census cannot decide whether a remedy is
    computable; a human can. Each surface declares REPAIR / ROUTE / CLOSE with a reason, and the
    census fails on an UNDECLARED surface — the same shape as ci-parity's "every real job has an
    entry, mirrored or excluded with a reason".
    (iii) REPORT, DO NOT ENFORCE THE CONVERSION. This task must not change any gate's behaviour. It
    makes the posture visible and the gaps countable; converting is each gate's own task, on its own
    evidence. A census that also converts cannot be reviewed for either job.
    (iv) THE COUNT IS NOT THE ANSWER. Report each surface BY NAME with its declared posture and
    whether it currently complies. A bare "N surfaces, M non-compliant" is the technically-true
    aggregate this repo has already been misled by once (`lint-plan`'s failing-split).
    (v-a) AND COVER STATE-DECIDING SURFACES, which is the sixth finding's lesson: anything that can
    mark a task merged, credited, released or parked belongs in the census, because a surface that
    silently says DONE removes work from the fleet more completely than any refusal. The two credit
    paths (`Remudero-Task:` trailer, `run-<id>-<epoch>` head ref) and whatever can write them are in
    scope; so is the absence of a correction path for a credit that is simply false.
    (v) COVER TASK-STOPPING SURFACES, not only diff-stopping ones. `verify: human` and `blocked_ci`
    re-dispatch stop WORK without ever touching a PR, and a census that sees only hooks and CI jobs
    would report the fleet compliant while its most expensive resting block is untouched.
