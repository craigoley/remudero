  falsifier: |
    CLOSE THIS WITHOUT IMPLEMENTATION if the repo already enumerates its refusal surfaces with a
    declared posture. MEASURED 2026-09-10: `INSTRUMENT_SURFACE` lists gates that GRADE other PRs (a
    different question), `CI_PARITY_TABLE` lists ci.yml jobs (a subset), and neither records whether
    a gate's remedy is computable.
    PROVE THE DERIVATION LOAD-BEARING: plant a synthetic refusal surface with no declared posture and
    require the census to name it; a hand-maintained list will not see it. That planted control is
    the whole difference between this and a list someone has to remember to edit.
    RUN THE OVER-COUNT CONTROL TOO: a script that exits non-zero for a REASON THAT IS NOT A REFUSAL —
    a usage error, a missing argument — must not be counted as a gate, or the census reports noise
    and gets ignored within a week.
    DO NOT convert any gate in this task. A census that also changes behaviour cannot be reviewed for
    either job, and the conversions each need their own measured evidence.
    DO NOT resolve this by deleting refusal surfaces. The ruling narrows WHEN a gate may stop work;
    it does not say a gate may not check.
