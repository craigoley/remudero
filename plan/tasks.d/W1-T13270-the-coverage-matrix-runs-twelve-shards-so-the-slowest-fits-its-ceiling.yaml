- id: W1-T13270
  title: "The coverage-shard matrix runs twelve shards instead of eight, on its own count apart from ci-shard's eight, so the slowest instrumented shard fits its 49-minute ceiling with room for the suite's growth"
  repo: remudero
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # it changes the required coverage matrix, ci-gate's REQUIRED list and the aggregator's merge inputs together
  band_meaning: span
  origin: "operator-session#coverage-shard-timeouts-2026-11-16"
  plan_refs:
    - W1-T4436
