- id: W1-T11787
  title: The gh read broker's boot parses at most a declared heap-sized byte bound of its cache, newest first, and evicts the rest unparsed, so a cache that outgrew its heap cannot crash-loop the broker
  repo: remudero
  depends_on: []
  priority: 1.2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the broker is every session's GitHub read path; the change only bounds what boot reads, and read results are unchanged
  band_meaning: blast-radius
  origin: operator-session#broker-down-2026-11-08
  plan_refs:
    - W1-T10279
