  status: merged
  attempts: 0
  acceptance:
    - claim: When the cache directory holds more bytes than the declared boot parse bound, boot keeps the newest entries by modification time that fit the bound and evicts the rest, before parsing any entry, whatever the disk-share budget says
      proof: "grep: W1-T11787 criterion 1 in test/github/every-mac-session-reads-github-through-one-broker.test.ts"
    - claim: A cache within its budget boots with every entry loaded, exactly as today
      proof: "grep: W1-T11787 criterion 2 in test/github/every-mac-session-reads-github-through-one-broker.test.ts"
    - claim: Boot parses entries one at a time and keeps only each entry's key, size and subjects, never its body
      proof: "grep: W1-T11787 criterion 3 in test/github/every-mac-session-reads-github-through-one-broker.test.ts"
    - claim: A boot that evicted writes one bounded broker log row naming the entry count and bytes evicted
      proof: "grep: W1-T11787 criterion 4 in test/github/every-mac-session-reads-github-through-one-broker.test.ts"
  rationale: |
    OBSERVED 2026-11-08 on the Azure host: remudero-gh-read-broker.service restarted 15,000+ times. After the checkout self-sync refusal was cleared (see W1-T11788), every start died 19 s in with "FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory" at about 250 MB, exit 134. The cache directory held 2,628 entries (127 MB on disk, newest 2026-11-05). The unit sets MemoryMax=640M.
    - Mechanism: the GhReadBroker constructor reads every file under cache/ through readEntry and statSync and keeps its subjects, with no bound. The eviction budget (cacheShareOfFree * freeBytes) only runs when a new entry is stored, never at boot, so a cache that grew while the broker was down is loaded whole.
    - Effect: with the broker down, deny-floor falls back to the 180 s floor and every session's GitHub read slows; an operator renamed the cache aside by hand to recover.
  design: |
    MEASURED 2026-11-08 (second crash, the correction to this task's first draft): after an operator moved the cache aside the broker ran about two hours and then crash-looped again, 93 starts in the 23:00Z hour, with only 264 entries and 80 MB (21 entries of 1 to 5 MB, none over 4 MB). Boot parsing amplifies bytes several times in the V8 heap, so the failing threshold is roughly 60 to 80 MB of cache against a heap of about 250 MB under MemoryMax=640M. The disk-share budget the store path uses is gigabytes, so a boot cap at that budget would never fire; the bound must be sized to the heap.
    In the constructor, before parsing, list the cache directory with sizes and mtimes (one statSync per entry, no reads). Keep the newest entries by mtime whose cumulative bytes fit BROKER_BOOT_PARSE_BYTES (a declared constant, 24 MiB, a third of the measured failing size), and evict the rest unparsed using the existing eviction routine so subjects and invalidations stay consistent. Then parse the kept entries one at a time, keeping only key, bytes and subjects. When anything was evicted, append one broker log row with the count and bytes. The broker's running cache still grows to its disk-share budget; only boot is bounded. No change to request keys, TTLs or served results.
    NOT IN SCOPE: the unit's restart policy (host config), the self-sync refusal (W1-T11788), serving without an identity (W1-T11789).
  falsifier: |
    Remove the boot-time bound and criterion 1 must fail (the kept bytes stay above the bound); set the bound to the disk-share budget and criterion 1 must fail on a cache between the two. Make boot retain bodies and criterion 3 must fail. Restore both and require all four to pass.
