    THE PROPOSAL BUILDER IS NOT THE CAUSE. `automationProposalFromJudgedShard` builds a summary with no shard and no
    risk field. The shard is written later by the inbox drafter, and its lint and the approve lint disagree.
    WHY, READ on origin/main 40b391682 (symbols, not lines):
      - `sizingViolation` (src/lib/task-linter.ts) is silent on risk:high with no band_meaning unless the caller passes
        `riskTransition`. With `riskTransition: { baseTask: undefined }` it blocks.
      - `lintDraftedFragment` (src/lib/inbox.ts) calls `lintTask(task, { knownRepos })` with no `riskTransition`. The
        draft rung's self-lint (`runDraftRung`) therefore caches such a fragment READY.
      - `relintRatificationFragment` (inbox.ts), reached from `writeRatificationShards` at approve, lints with
        `riskTransition: { baseTask: undefined }` and `proofSelfPath: "block"`. Its mechanical sizing repair (W1-T4352)
        runs only when `task.risk !== "high"`. A draft that is already risk:high with no band is not repaired. It is
        refused, and the refusal is thrown as `approve.error`.
      - `relintGuidanceLines` (src/lib/relint.ts) tells the redrafting model to "raise that task to risk:high" and
        never mentions band_meaning. The drafter did what it was told.
