  design: |
    No new bound. One lint contract for both floors.
    1. THE DRAFT FLOOR LINTS AS A FILING. Hold the approve floor's lint options in one exported constant in
       src/lib/inbox.ts: `riskTransition: { baseTask: undefined }` and `proofSelfPath: "block"`. A drafted task is new
       by definition. `lintDraftedFragment` and `relintRatificationFragment` both pass that constant to `lintTask`, so
       they cannot drift apart again. The draft rung's bounded self-lint then sees the band block and redrafts with it
       in hand. A fragment still dirty after the existing bound is cached NOT-READY with its violations named in
       `inbox.drafted unresolved_violations`. That is the named refusal, and no approve run spends an id on it.
    2. THE GUIDANCE NAMES THE BAND. The `[sizing]` paragraph of `relintGuidanceLines` says to raise the task to
       risk:high AND declare `band_meaning: span`, with the one-line rationale. It names `band_meaning: blast-radius` as
       the alternative for a change dangerous regardless of span.
    3. THE APPROVE REPAIR COVERS AN ALREADY-HIGH DRAFT. `relintRatificationFragment`'s mechanical repair also fires for
       a task at risk:high with no band_meaning. It inserts `band_meaning: span` after the risk line, the declaration
       that admits a span and exempts nothing. A task that declares either band is untouched. The 40 proposals cached
       READY before this change then file on their next approve instead of being refused again.
    4. A ONE-SHOT REPLAY OF THE LOST PROPOSALS (amended 2026-10-12). Add `src/lib/inbox-replay.ts`. It re-drafts and
       re-approves each lost proposal through the ordinary inbox path (drafter, relint, approve). It never writes a
       shard, a plan file or a ratification row itself.
       a. THE POPULATION, MEASURED, NOT LISTED. Read from the ledger union with the incremental reader
          (`createIncrementalLedgerUnion`, src/lib/ledger-union.ts), filtered to the approve.* steps, never from the live
          file alone. A proposal is in the population when its LATEST approve outcome (`approve.error` or
          `approve.shards_written`, by ts) is an `approve.error` carrying "risk:high with no band_meaning declared", and
          no `approve.shards_written` row ever names it. Attribute a row by `task_id`. A `task_id: "BATCH"` row is
          attributed by its `proposal_ids`, or for an error by the proposal id its text names. Family is
          `inboxKind(id)`. NO COUNT CAP: the population is the bound, 40 when measured. An incomplete union read
          (`ok: false`) or a read with zero approve.* rows (the positive control) seeds nothing. It writes one
          `inbox.replay_deferred` row with the reason, and the next pass tries again.
       b. ONE-SHOT AND IDEMPOTENT. The seeded population and each proposal's outcome live in the replay's own store,
          `state/inbox-replay-band-meaning.json`, never in the live ledger, for the reason fleet-lane.ts gives. A store
          that exists is never re-seeded. A proposal with a stored outcome is never handled again. The outcome is stored
          BEFORE its row is written, so a restart cannot write a second row for it. Once every seeded proposal has an
          outcome, a pass reads only the store and returns.
       c. SUPERSEDED IS CHECKED FIRST. A seeded proposal is `skipped_superseded`, and is not re-drafted, when any of
          these holds: its `readClassificationSnapshot` state is `ratified`, `declined` or `retired` (the
          `classifyProposal` checks above); it is no longer in the registry (`parseProposalRegistry`); or a replay
          approve is refused with `draftedDuplicateRefusal`'s text. Each records the reason it matched: the state, or
          the duplicate's filed id. It stays in the registry as a record and is never deleted.
       d. RE-DRAFT, THEN THE FLEET LANE FILES IT. For each live proposal, the replay drops its cached draft
          (`invalidateDraft`) and its draft-attempt key, merged onto the on-disk caches as `mergeDraftCaches` does, so the
          draft rung re-drafts it under design 1's lint. The fleet lane's FILE step then hands it to `rmd approve`
          unchanged, one a pass, at its own pace, when the snapshot reads it `ready`. The replay calls no approve itself.
       e. ONE NAMED ROW PER PROPOSAL. `inbox.replayed` with `proposal_id`, `family` and `outcome`, written once when
          the outcome is known: `refiled` (an `approve.shards_written` row names it after the seed),
          `skipped_superseded` (with `reason`), `refused` (a later `approve.error` other than a duplicate, with its
          text), or `redraft_not_ready` (the new draft was cached NOT-READY, with `inbox.drafted unresolved_violations`).
       f. WHERE IT RUNS. The module exports `replayBandMeaningRefusals(deps)`, called as one step at the head of each
          `triageFleetLaneSteps` pass, which already has `stateDir` and `ledgerPath`. No new timer and no run-task.ts
          wiring.
    Tests go in a new file, test/a-drafted-task-raised-to-risk-high-declares-its-band.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive `lintDraftedFragment` and `relintRatificationFragment` with a fragment shaped
    like verify-human-automate:W1-T8502's attempt-3 draft: two subsystems, risk:high, no band_meaning. Drive the replay
    over a fixture state dir: a ledger whose approve rows give one proposal per outcome, a registry, a classification
    snapshot and draft caches.
