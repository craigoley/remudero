  falsifier: |
    Leave `lintDraftedFragment` without `riskTransition`, and the first test reads no violation for the W1-T8502-shaped
    draft, as `inbox.drafted lint_clean true` did at 15:08:14Z. Keep the repair's `task.risk !== "high"` guard, and the
    second test is refused with "[sizing] risk:high with no band_meaning declared", as `approve.error` was at
    15:10:20Z. Overwrite a declared band, and the third test fails.
    For the replay, select by ANY band refusal rather than the LATEST outcome, and a fixture proposal that later reached
    approve.shards_written is replayed and filed twice. Skip the supersede check, and a proposal whose task referent
    merged is re-drafted. Key idempotence on the live ledger instead of the store, and a pass after a fixture rotation
    writes a second `inbox.replayed` row. Seed on an `ok: false` union, and the fixture with an unreadable rotation
    seeds a partial population.
  note: |
    EFFECT, measured after merge from the core ledger with no numeric pass mark. Count approve.error rows carrying "no
    band_meaning declared" after the merge sha deploys. Healthy shape: none. Count the 40 proposals above that reach
    approve.shards_written.
    REPLAY EFFECT: the `inbox.replayed` rows grouped by `outcome` and `family`. Healthy shape: one row per seeded
    proposal, and none still without an outcome once its re-draft has run. The replay's store must hold the same set.
