  design: |
    No new bound. One lint contract for both floors.
    1. THE DRAFT FLOOR LINTS AS A FILING. Hold the approve floor's lint options in one exported constant in
       src/lib/inbox.ts: `riskTransition: { baseTask: undefined }` and `proofSelfPath: "block"`. A drafted task is new
       by definition. `lintDraftedFragment` and `relintRatificationFragment` both pass that constant to `lintTask`, so
       they cannot drift apart again. The draft rung's bounded self-lint then sees the band block and redrafts with it
       in hand. A fragment still dirty after the existing bound is cached NOT-READY with its violations named in
       `inbox.drafted unresolved_violations`. That is the named refusal, and no approve run spends an id on it.
    2. THE GUIDANCE NAMES THE BAND. The `[sizing]` paragraph of `relintGuidanceLines` says to raise the task to
       risk:high AND declare `band_meaning: span`, with the one-line rationale. It names `band_meaning: blast-radius` as
       the alternative for a change dangerous regardless of span.
    3. THE APPROVE REPAIR COVERS AN ALREADY-HIGH DRAFT. `relintRatificationFragment`'s mechanical repair also fires for
       a task at risk:high with no band_meaning. It inserts `band_meaning: span` after the risk line, the declaration
       that admits a span and exempts nothing. A task that declares either band is untouched. The 40 proposals cached
       READY before this change then file on their next approve instead of being refused again.
    Tests go in a new file, test/a-drafted-task-raised-to-risk-high-declares-its-band.test.ts, with `test(` titles
    verbatim as in the proofs below. Drive `lintDraftedFragment` and `relintRatificationFragment` with a fragment shaped
    like verify-human-automate:W1-T8502's attempt-3 draft: two subsystems, risk:high, no band_meaning.
