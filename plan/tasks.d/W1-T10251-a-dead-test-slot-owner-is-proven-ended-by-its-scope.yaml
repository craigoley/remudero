- id: W1-T10251
  title: "A DEAD OWNER'S HOST-WIDE TEST SLOT IS NEVER FREED, BECAUSE THE DEFAULT TREE PROBE CAN NEVER RETURN `ended` — src/lib/test-slot.ts `probeReservedTree` answers `live` or `unknown` only; on the Azure host a reservation whose owner pid was gone held slot 1 against every preflight, withheld as \"49 process(es) started since the owner could not be read (EACCES on /proc/<pid>/environ)\" until a builder moved the file by hand; prove the reservation's tree ended from a record the owner leaves (its dedicated cgroup scope), not from reading other users' environments"
