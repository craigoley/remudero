  origin: "coordinator brief file1020 item 2 (2026-10-20); evidence from the W1-T10048 and W1-T10046 builders (logs-8864/10048-stale-test-slot-1.json, logs-8864/10046-preflight2.log)"
  plan_refs: [W1-T9928, W1-T9541, W1-T8047, W1-T9952]
