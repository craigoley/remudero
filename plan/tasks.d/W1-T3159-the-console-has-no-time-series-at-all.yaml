- id: W1-T3159
  title: "THE CONSOLE HAS NO TIME SERIES AT ALL — every daemon-health field is a SCALAR (`last poll …`, `disk free …`, `rate limit …`, `spend today $198.831`), `grep -c '<svg|sparkline|chart|polyline' src/lib/serve.ts` returns ZERO, so an operator can read the current value of everything and the trend of nothing"
