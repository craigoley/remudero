- id: W1-T11926
  title: Every gh spawn resolves its GitHub credential through one resolver that tries a per-repo reference, then a remudero-wide one, then the ambient GH_TOKEN, then gh's own stored login, and names every source it tried when none answers
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # Rule 19: one concern, which credential a gh call uses and what is said when there is none; the token values, the app-token mint, the read cadence and the write classification are unchanged
  origin: operator-session#github-access-1109
  plan_refs:
    - W1-T236
    - W1-T258
  files:
    - src/lib/github-credential.ts
    - src/lib/github-transport.ts
    - src/run-task.ts
    - test/the-github-credential-resolver-names-every-source-it-tried.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: The resolver returns the first credential source that answers, in the order per-repo reference, remudero-wide reference, ambient GH_TOKEN, gh's own stored login, and returns only the source's name to its caller, never the value
      proof: "unit test: test/the-github-credential-resolver-names-every-source-it-tried.test.ts"
    - claim: When no source answers, the error names every source tried and why each failed, writes one github.credential_missing ledger row carrying names only, and never surfaces gh's own "gh auth login" text as the cause
      proof: "grep: W1-T11926 criterion 2 in test/the-github-credential-resolver-names-every-source-it-tried.test.ts"
    - claim: A reference is a scope (all repos, or owner/repo) plus a kind (env, file or app) and a name, so a console can write one later with no code change; a reference to an unreadable file counts as that source failing, not as success
      proof: "grep: W1-T11926 criterion 3 in test/the-github-credential-resolver-names-every-source-it-tried.test.ts"
    - claim: The one place github-transport spawns gh calls the resolver, so no gh call bypasses it
      proof: "grep: resolveGithubCredential( in src/lib/github-transport.ts"
  rationale: |
    OBSERVED 2026-11-09: two PRs (#17485, #17494) sat with a green CI and a required remudero-review check stuck pending for hours. One host-side review run at 22:49 computed PASS and then failed to post it with gh's "To get started with GitHub CLI, please run: gh auth login" (no GH_TOKEN in that process), after earlier host-side runs failed on a module that was mid-update and on a gh too old for a flag the code used.
    - The daemon container carries its identity as an ambient GH_TOKEN (env.ts allowlist, W1-T236/T258); a process started from a shell on the host carries nothing, because non-interactive shells skip ~/.bashrc and a host with no gh login has no other source. The same failure cost this session hours: every non-interactive gh call on the Azure host failed until the token was exported by hand.
    - Today there is no single place that decides which credential a call uses, so each runner finds out by failing, with a message that names no cause. A resolver with a named order and a named failure fixes the class, and a reference-based shape lets the console set remudero-wide and per-repo tokens later without a second mechanism.
  design: |
    - A new module reads a references file in the state directory (references only, never values), then the ambient environment, then gh's stored login, and returns the first that answers as {source, env overlay}. The overlay is applied at the one place github-transport spawns gh.
    - The resolver reports the source name only. No value is returned to a logger, a ledger row or an error message.
    - NOT IN SCOPE: minting or rotating a credential, the console UI that writes references, the GitHub App mint path, read pacing, and any change to which calls are writes.
  falsifier: |
    Return the value to the caller: criterion 1 must fail. Surface "gh auth login" text, or skip the ledger row: criterion 2 must fail. Treat an unreadable file as a hit, or hard-code the scope: criterion 3 must fail. Restore and require all three.
  note: |
    reservation hand-off: run-unfiled-1794267225693
    Success is a host-side or container-side runner either authenticating or failing once with every source named, and no review computed and then lost for want of a token.
