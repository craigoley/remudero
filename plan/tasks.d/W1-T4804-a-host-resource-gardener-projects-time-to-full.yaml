- id: W1-T4804
  title: "HOST DISK, SWAP AND INODES ARE SEEN ONLY AFTER THEY RUN OUT — the Mac hit ENOSPC on 2026-09-24 and each host's janitor logs its result to a file nobody reads; track per-host trends from the heartbeat and the janitor logs, project time-to-full, act and escalate in tiers before space runs out, and attribute the growth to its consumer"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 35.00
  risk: high
  band_meaning: span
  origin: "operator direction 2026-09-29 (closing the self-improvement loop): fold the host janitors into observable fleet health"
  plan_refs: [W1-T4770, W1-T2767, W1-T3528, W1-T4385]
  files:
    - scripts/fleet-heartbeat.sh
    - src/lib/host-resource-gardener.ts
