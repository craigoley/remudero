    - claim: "each host's samples accumulate from its heartbeat branch only when the beat is new"
      proof: 'grep: test("W1-T4804: a heartbeat sample is appended only for a new beat" in test/host-resource-gardener.test.ts'
    - claim: "a falling series projects a time to full and an outlier sample does not move it"
      proof: 'grep: test("W1-T4804: a falling series projects time to full robust to an outlier" in test/host-resource-gardener.test.ts'
    - claim: "the response tier follows the projection relative to the host's own janitor cadence"
      proof: 'grep: test("W1-T4804: the tier follows the projection relative to janitor cadence" in test/host-resource-gardener.test.ts'
    - claim: "growth is attributed to the consumer that explains it and a persistent grower is filed once"
      proof: 'grep: test("W1-T4804: a persistent consumer is attributed and filed once" in test/host-resource-gardener.test.ts'
    - claim: "the daemon runs the host-resource gardener"
      proof: "grep: startHostResourceGardener( in src/run-task.ts"
  falsifier: |
    Fit an ordinary least-squares line: the outlier sample moves the projection and that test
    fails. Tier on a fixed free-GB floor: a slowly filling large disk escalates early and a fast
    filling small one late, and the cadence test fails. Report an unreadable swap as 0: the
    heartbeat test fails.
