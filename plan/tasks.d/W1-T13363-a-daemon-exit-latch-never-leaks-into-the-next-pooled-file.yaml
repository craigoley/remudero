  rationale: |
    OBSERVED 2026-11-17 (W1-T13352 recon, done in the filing session): in ci-shard first attempts on both runner images
    (main 44006635512 on 24.04, 44012529966, 44019350709 and 44022915015 on 26.04), W1-T6595, W1-T9212 and W1-T12059
    failed with "expected direct-merged, got direct-merge-preflight-refused" and passed on the flake retry.
    Shard 8/8's pool for main cf7db0e was rebuilt locally with the repo's own partitionPool (308 files, matching CI's
    "308/308 file(s)"). The pooled run reproduced the three failures. Bisecting the other 307 files named
    test/a-freshness-restart-lets-a-running-review-finish.test.ts. Instrumenting the armer printed
    directMergePreflight.reason "freshness_latch": that file's runDaemon stops for freshness, which calls
    closeDirectMergeAdmissions("freshness_latch"). runDaemon reopens it on entry, but a test that never starts a daemon
    never reopens it. A second leak of the same shape: drainInFlightReviews closes light-pass refills, so
    test/daemon/a-recycle-wait-admits-a-review-that-ends-before-the-wait-does.test.ts failed 3 tests after
    test/a-no-pr-branch-of-an-ended-run-stops-blocking-dispatch.test.ts (bisected from 71 files). The pool's own
    leak probe named a different file each run because each probe ran a different prefix of the pool.
    241 test files call runDaemon, so refusing them from the pool would cost the pool much of its saving.
  design: |
    1. src/lib/process-exit-latches.ts: registerProcessExitLatch(name, reopen) and reopenProcessExitLatches(), held on a
       globalThis Symbol.for registry so one registry serves every module copy.
    2. arm-auto-merge.ts registers "direct-merge-admissions" (openDirectMergeAdmissions); sweep.ts registers
       "light-pass-refills".
    3. test/setup/tmp-hygiene.ts: the pooled-run beforeEach (already used for setTestFileSlotScope) reopens every latch
       when context.filePath changes.
    INVARIANT isolated-runs-unchanged: production never calls reopenProcessExitLatches; an isolated test run and the
    tests inside one pooled file see each latch exactly as before.
  falsifier: |
    At origin/main a pooled run of the freshness-restart file then the W1-T6595 file fails 2 tests with
    direct-merge-preflight-refused (reason freshness_latch).
  note: |
    Reserved with rmd next-task-id --count 1 --branch claude/project-thread-7ycldf on the operator's Mac mini
    (2026-11-17 12:16Z).
