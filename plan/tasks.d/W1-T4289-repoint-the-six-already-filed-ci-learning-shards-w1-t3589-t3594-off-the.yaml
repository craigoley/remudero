    person decides what guidance changes"). Each carries exactly one acceptance criterion whose proof
    targets `learnings/ci-gate-lessons.yaml`, a path confirmed absent from disk and absent from
    learnings/index.json (see W1-T4288's rationale). Left alone, no human review of these six can ever
    satisfy their criterion — the target cannot hold a matched, injectable entry no matter what is
    written into it, because nothing indexed ever reads it.

    SCOPE, DELIBERATELY NARROW: this task repoints the DATA (each shard's `files:` entry and its
    acceptance proof's target path) to `learnings/ci.yaml` — the same file W1-T4288 makes the producer's
    canonical target, chosen independently here too so the two tasks agree regardless of dispatch order.
    It does NOT author the substantive lesson content for any of the six findings — that remains the
    parked, verify:human, "a person decides what guidance changes" step the tasks were always designed to
    require, and it needs domain knowledge of each incident's specific repair (the ci_learning_prs lists
    on each shard) that a proof-debt-remediation pass is not the place to invent. This task only makes
    each criterion CAPABLE of eventually resolving; a person still writes the lesson.

    ATOMIC COUPLING, RE-RISKED RATHER THAN DECOMPOSED (Rule 19 exit): the fix is ONE concern — retire the
    proof-debt this SAME producer bug generated across its whole filed cluster — but it is unsatisfiable
    piecewise. Repointing one of the six leaves five still permanently unresolvable, which is the exact
    defect being fixed; the invariant only holds once all six agree. Six plan/tasks.d/*.yaml touches for
    one indivisible correction is the W1-T240/T241/T242 shape, not a sizing violation to be split.

    NO SRC TOUCHED. Every file this task edits is a plan/tasks.d/*.yaml record — a plan-data correction,
    not a code change. depends_on is deliberately [] rather than W1-T4288: this task needs no diff from
    W1-T4288 to be correct (the target file is specified directly here too, not derived), the two tasks'
    files: are fully disjoint, and a hard gate would strand this plan-data fix behind an unrelated src PR
    if that PR ever stalled — the same reasoning this plan applies repeatedly to companion pairs
    (W1-T121/W1-T122, W1-T177/W1-T178/W1-T179).
