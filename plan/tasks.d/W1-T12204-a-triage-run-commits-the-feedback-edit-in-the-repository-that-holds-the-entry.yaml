  rationale: |
    OBSERVED 2026-11-10: a triage `propose` pull request edits the feedback file and adds a task file in one commit.
    - Its proof is `grep: status: <status> in plan/feedback/<id>.yaml`, from `triageAcceptanceProof` in src/lib/triage.ts. That path does not exist in the public repository when the ops repository holds the entry.
    - `diffCitesFeedback` in src/lib/triage.ts refuses a proposal whose diff does not cite the feedback.
    - The claim release reads merged commit subjects of the public repository, and after the first interim task it reads the status on origin/main of the public repository.
    - This is the last task of stage 1. After it, the operator may turn on `decision` and `feedback`.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. This task adds no kind. It makes the triage command correct when `feedback` is on.
  design: |
    In `triageCommandLocked`, find the repository that holds the entry before the worker starts.
    For an entry in the ops repository, give the worker the text of the feedback in its prompt, as today, and keep the feedback file out of the lane worktree. Land the status through the landing of the earlier task.
    Add a proof for a proposal that searches the new task file for its id. Keep `triageAcceptanceProof` for an entry in the public repository.
    Order the two writes so that a failure leaves a state the next pass can read: land the task file first, then the status.
    NOT IN SCOPE: the destination of the new task file. It stays public until the writer task for the Architect merges.
  falsifier: |
    Commit the feedback edit in the lane worktree for an ops entry and criterion 1 must fail. Keep the status proof for an ops entry and criterion 2 must fail. File again after a failed status write and criterion 5 must fail. Split the commit for a public entry and criterion 6 must fail. Restore and require all seven to pass.
