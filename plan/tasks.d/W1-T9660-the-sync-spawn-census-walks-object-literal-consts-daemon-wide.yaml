  rationale: |
    MEASURED 2026-10-15 at PR #12030's head af4448050 (W1-T9615), in a throwaway copy of
    test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts:
    - The census's walk (topLevelFunctions, seeded from daemonCommand) reads only column-0 functions and arrow consts.
      A column-0 object-literal const such as plan-pr-emitter's `defaultPreflightChecks = { lintPlan: (...) => runInTree(...) }`
      is not a node, so nothing it names is ever reached through it.
    - #12030 added `topLevelFunctions({ objectLiterals: true })` and `codeOnly` (strings and comments blanked), but uses them
      ONLY in its SRE-lane test. The daemon-wide census still runs the function-only walk.
    - The same walk seeded from daemonCommand, with object literals, finds 11,723 declarations and reaches 7,290 of them.
      The function-only walk reaches 7,132. Six sync spawners are reached and hold NO row (count, file, shortest path):
        runInTree 1, src/lib/plan-pr-emitter.ts — daemonCommand > feedbackLandingSweepRungs > sweepFeedbackLandingAsync >
          planPrPreflight > defaultPreflightChecks > runInTree. Its real reach is the SYNC drivers: the boot sweep
          (daemon.ts sweepFeedbackLanding at boot), landContent (e.g. recordDecision, landFoldDebt), and
          landCiLearningShards; every one runs driveLanding with syncPreflightOf.
        captureImportedModule 1, src/lib/prevention-source-evidence.ts — daemonCommand > runTask > workerBoundaryStack.
        executingHarnessRevision 1, src/lib/benchmark-run.ts — daemonCommand > runTask > workerBoundaryStack.
        checkAlertFixAcceptance 1, src/run-task.ts — daemonCommand > mainRepairLaneFor > dispatchMainRepairFixRun >
          REAL_MAIN_REPAIR_FIX_DEPS > REAL_ALERT_FIX_DISPATCH_DEPS.
        readAlertFixPrBody 1, src/run-task.ts — the same path, through checkAlertFixAcceptance.
        realGitRemoteDeps 1, src/lib/onboard/inventory.ts — daemonCommand > realDeps > composeRealDeps.
    - Every existing row keeps its count under the object-literal walk. With `codeOnly` too, five rows read 0
      (assertOpenWeightToolBoundary, imessageChannel, listRuleSuites, readPushedRunBranchesOutput,
      readRunBranchClosedPrsOutput): the loop "reached" them only through an identifier-shaped word in a string or a
      comment.
    The reach is name-based, so it is an upper bound, which is what the census has always been.
  design: |
    1. The daemon-wide census walk (refusals, and the positive-control test) uses W1-T9615's object-literal reading and
       its `codeOnly` stripping, the same walk #12030's SRE-lane test uses. One walk, so the two tests cannot disagree
       about reach. If #12030 changed shape before merging, take its merged helpers; never fork a second copy.
    2. Record the walk's exact result in SYNC_SPAWN_LOOP_BASELINE in this PR, the census's existing EXACT contract:
       - add one row for each of the six names above at its measured count, each with a trailing comment naming the
         path that reaches it and the task that converts it, if there is one. runInTree's comment names its sync drivers
         (boot sweep, landContent, landCiLearningShards), plus W1-T9615 (the SRE capture) and W1-T9638 (the per-poll
         landing's local git verbs) as the conversions already filed.
       - delete the rows the code-only walk reads at 0 (the five above), as the census's shrink refusal already demands.
       Re-measure at the build's base: rows changed since this filing are taken at the base's real count, never copied
       from this rationale.
    3. A new positive control: the census walk reaches runInTree from daemonCommand, and the function-only walk does
       not, because every path to it passes through an object-literal const (defaultPreflightChecks). So a regression
       that drops the object-literal reading reddens by name.
    4. No src/ change. Converting a site is its own task; the row is what keeps that site from growing meanwhile.
  acceptance:
    - claim: "the daemon-wide census walk passes through an object-literal const, so runInTree is reached from daemonCommand and holds an exact row"
      proof: 'grep: test("W1-T9660: the daemon-wide census reaches a sync spawner named only inside an object-literal const" in test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts'
    - claim: "a row reached only through string or comment text reads 0 under the code-only walk and is deleted"
      proof: 'grep: test("W1-T9660: the daemon-wide census ignores an identifier that appears only in a string or a comment" in test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts'
  falsifier: |
    At origin/main, add the first test and revert the walk change: refusals() seeded from daemonCommand does not reach
    runInTree, so the test's reach assertion fails. Restore the walk without adding the six rows: refusals() names all
    six as "not in SYNC_SPAWN_LOOP_BASELINE", so the existing exact-census test fails until the rows are recorded.
