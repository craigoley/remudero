      proof: 'grep: test("W1-T9584: no update-branch rung selects a Dependabot head" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
    - claim: "a held Dependabot head red for a stale base gets exactly one rebase request per head, and recreate when the head was edited"
      proof: 'grep: test("W1-T9584: a stale held Dependabot head asks Dependabot to rebase once per head" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
    - claim: "a held Dependabot head red for its own reason gets no command"
      proof: 'grep: test("W1-T9584: an own red on a Dependabot head posts no command" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
  falsifier: |
    Remove the isDependabot filter: the fixture's Dependabot PR behind main by 22 is selected for update-branch.
    Remove the refresh request: the stale held fixture records no dep-review.refresh_requested and no comment.
