  rationale: |
    MEASURED 2026-09-10 on #4915. The reviewer refused two acceptance criteria, both citing
    `apps/dashboard/src/__tests__/series.test.tsx` as "proof executed and FAILED on the PR head —
    overrides any keyword coverage". THE SAME SUITE, SAME COMMAND, SAME HEAD, PASSES 11/11 once the
    dependencies are installed. The only difference between the two runs is `npm ci`.
    THE CHAIN, EVERY LINK OBSERVED ON THIS HOST:
      1. `ensureDeps` (src/lib/review.ts:1179) returns early when `node_modules` EXISTS:
           if (!existsSync(join(cwd,"package.json")) || existsSync(join(cwd,"node_modules"))) return;
      2. a worktree's `node_modules` IS a symlink to the shared tree, and src/run-task.ts:37730 calls
         that "the NORMAL worktree state". OBSERVED live:
           run-W1-T3283-.../node_modules -> /home/node/Remudero/remudero/node_modules
      3. `existsSync` FOLLOWS symlinks. MEASURED on that exact path: true. So (1) returns early and
         `npm ci` never runs.
      4. the shared tree does not carry the dependency. MEASURED: `vitest`, `react` and
         `@vitejs/plugin-react` are ABSENT from it.
      5. `pinnedVitestCli` (src/lib/review.ts:618) does no existence check — it joins a path and
         returns it. `node <missing>/vitest.mjs` exits NON-ZERO, so the proof grades `fail`, NOT
         `not_executable`.
    SO A MISSING TOOLCHAIN AND A FAILING ASSERTION ARE THE SAME OBSERVATION, and the verdict states
    the stronger of the two: "executed and FAILED ... overrides any keyword coverage". No amount of
    correct code clears it.
    THIS CLASS OF BUG IS ALREADY DOCUMENTED TWENTY LINES AWAY, in `requiredChromiumDirs`' own comment:
    "TRAP: `ci` installs before every test job and the review host never did, so #863's bump posted
    `executed_fail` on passing code (#892)." That was fixed for Playwright's browsers specifically.
    The general case — a declared dependency the review host does not have — was not, and the first
    workspace to need one hit it.
    WHY THE OBVIOUS REMEDY IS WRONG. "Just run `npm ci`" is refused on purpose: src/run-task.ts:37745
    refuses an install through a symlinked `node_modules` because the clear phase would EMPTY THE
    SHARED TREE the link points at — the 2026-07-29 outage. The early return is therefore protecting
    something real. What it must not do is protect it SILENTLY.
  design: |
    (i) THE GUARD DECIDES ON THE DEPENDENCY, NOT ON THE DIRECTORY. `node_modules` existing is not
    evidence that this proof's runner is present. The question `ensureDeps` should answer is whether
    the runner this proof will execute actually resolves.
    (ii) AN ABSENT RUNNER GRADES `not_executable`, NEVER `fail`. `fail` is a claim about the CODE.
    A missing binary is a claim about the HOST, and the two must not collapse. This alone fixes the
    false refusal, because `not_executable` does not override keyword coverage.
    (iii) THE VERDICT SAYS WHICH ONE IT WAS. A criterion whose proof could not run reads as "the
    runner was absent", naming it — not as a bare grade the operator has to reverse-engineer.
    (iv) NEVER INSTALL THROUGH THE SYMLINK. The 2026-07-29 mechanism stands. Refusing loudly is the
    remedy; emptying a shared tree is not, and no part of this task may weaken that guard.
    (v) FAIL CLOSED AND STAY QUIET OTHERWISE. A proof whose runner IS present behaves exactly as
    today, byte for byte. The addition can only reclassify a run that could not have happened.
    (vi) OUT OF SCOPE: installing workspace dependencies on the review host, and #4915's own stale
    `test/dashboard-loads.test.ts` fixture. Both are real; neither is this task.
