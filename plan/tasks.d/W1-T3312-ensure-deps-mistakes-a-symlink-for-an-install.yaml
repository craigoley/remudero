      proof: "unit test: test/ensure-deps-mistakes-a-symlink-for-an-install.test.ts"
    - claim: "W1-T3312 criterion 4: an install is still never attempted through a symlinked node_modules, and a present runner behaves exactly as before"
      proof: "unit test: test/ensure-deps-mistakes-a-symlink-for-an-install.test.ts"
  falsifier: |
    CLOSE IF an absent runner ALREADY grades `not_executable`. MEASURED 2026-09-10 that it does not:
    #4915 carries two criteria refused as "proof executed and FAILED on the PR head" whose suite
    passes 11/11 with the dependency installed, and `pinnedVitestCli` performs no existence check.
    THE PRESENT-RUNNER CONTROL, because "grade not_executable when something is missing" is trivially
    satisfiable by grading everything not_executable: a proof whose runner IS installed must still
    grade exactly as today — `pass` on passing code and `fail` on a genuinely broken assertion. A
    change that cannot still fail real code has removed the gate, not fixed it.
    THE SYMLINK CONTROL: an install must still NEVER be attempted through a symlinked `node_modules`.
    If a test can drive this code into `npm ci` on a symlinked tree, the 2026-07-29 outage has been
    rebuilt and the task is worse than not doing it.
    DO NOT FIX THIS BY INSTALLING. Making the review host carry every workspace dependency would hide
    the defect rather than repair it — the next undeclared runner grades `fail` on passing code again,
    and the operator has no way to see that it happened.
