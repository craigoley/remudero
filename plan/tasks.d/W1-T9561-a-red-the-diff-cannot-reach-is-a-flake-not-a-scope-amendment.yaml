  design: |
    Decide a NEEDS_SCOPE by the red's attribution, from evidence, not by a count. One pure decision, wired at both
    call sites.
    1. src/lib/fix-outcome.ts: add `redAttribution(input)`. It returns `{ kind: "diff-reaches" | "diff-cannot-reach" |
       "unknown", reached: string[] }` from: the failing test files (`failingTestFilesFromCiFailures`), the PR's
       changed paths (merge base to head), the failing tests' import closure (`ImportClosureRead`), `isCiHarnessPath`,
       and the base verdict for those files at main. A changed path REACHES the red when it is a failing test file, a
       member of a failing test's closure, a CI harness path, or a root-level file. A test/ helper or fixture reaches
       it only when a failing test's closure contains it or a file in that closure names its directory (for example
       `fixtures/golden-verdicts`). A blanket test/ rule would have counted #11702's own fixture against it.
       `diff-cannot-reach` needs all three: a readable diff, every failing file's closure known, and every failing file
       recorded `passes` at main. Anything missing gives `unknown`.
    2. `decideFixOutcomeAction` takes the attribution as a fact. A NEEDS_SCOPE whose attribution is
       `diff-cannot-reach` becomes `{ kind: "rerun-once" }`, the existing FLAKE arm. `diff-reaches` and `unknown` keep
       today's `scope-needed`, so an unreadable input can never reroute a real PR-caused red.
    3. src/run-task.ts computes the attribution before each `decideFixOutcomeAction` call, from inputs it already has.
       It writes `fix.scope_rerouted` with `{ paths, attribution, reached, failing_test_files, head_sha }` when it
       reroutes, and the reason travels into the flake arm's `flake_claim`. After the rerun, write one
       `test.flake_retry` row per failing file in the shape `selectorShadowFlakeLedger` writes, with `source:
       "fix-round"`, `retry_outcome` recovered or also_failed from the requeue's CI, `pr_numbers` and `head_sha`. Then
       W1-T6406's flake-incident gardener counts the flake across unrelated PRs through its own tiered policy, with
       no new threshold. Keep the worker's diagnosis: put the report's first paragraph and the saved out-of-scope
       paths on `fix.scope_rerouted` so the incident it feeds carries the root cause. Never commit those edits to
       this PR.
    4. src/lib/prompt-render.ts, the fix footer's NEEDS_SCOPE line: NEEDS_SCOPE is for a red this PR's diff causes. A
       red in a file the diff does not touch or reach, which passes at main, is FLAKE. The harness enforces this in
       step 2 either way, and the line only stops the worker spending the round on an edit it cannot land.
    A wrong `diff-cannot-reach` costs one requeue and no strike refund (the flake arm refunds only on green), and the
    next round runs as today. That self-correction is why the decision needs no tuning threshold.
