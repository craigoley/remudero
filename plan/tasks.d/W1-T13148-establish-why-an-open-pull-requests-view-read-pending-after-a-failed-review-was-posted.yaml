  acceptance:
    - claim: "The cause is established from rows and code, not assumed: the test replays the recorded sequence of #18701 (a refusal, a pending post, a failure post, then three passes) through the real view producer and shows which input made the view read pending with a pending stamp at or before the refusal"
      proof: "grep: W1-T13148 criterion 1 in test/sweep/a-view-reads-the-review-state-github-holds-for-its-head.test.ts"
    - claim: "With the cause fixed, a view built after a terminal review status exists for the head reads that state, and its pending stamp is the newest pending post for the head or absent"
      proof: "grep: W1-T13148 criterion 2 in test/sweep/a-view-reads-the-review-state-github-holds-for-its-head.test.ts"
    - claim: "invariant:a-live-pending-is-still-pending — a head whose newest review status is a pending post with a live owner still reads pending with that post's time, and a head with no review status reads none"
