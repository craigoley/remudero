  band_meaning: span
  origin: "operator session 2026-10-04: research/restart/report.md (restart efficiency) P6"
  plan_refs: [W1-T5718, W1-T5720, W1-T5721]
  files: [src/lib/daemon.ts, src/lib/measurement-cadence.ts, test/the-measurement-cadence-runs-out-of-process.test.ts]
  status: merged
