  attempts: 0
  rationale: |
    THE HARD PART IS DONE AND NOTHING CONSUMES IT. W1-T2279 wrote a structural contract grounded in
    ISO 24495-1:2023 — relevant, findable, understandable, usable — and a four-part structure, and
    its own header does the crucial work of separating what a MACHINE can check from what only a
    READER can judge. Its suite then reads the document and asserts over the document. No message
    any producer emits is measured against any of it.
    SURFACE 1 bytes in the operator message standard = 8942
    SURFACE 2 src modules that check a message against it = 0
    SURFACE 3 suites asserting over a message a producer emitted = 0
    SURFACE 4 modules that raise an escalation = 14
    SURFACE 5 AI writers already composing escalation prose = 5

    STRUCTURE IS CHECKED, PROSE IS NEVER JUDGED, AND THE DOC DREW THAT LINE FIRST. The checker
    asserts the four parts are PRESENT and identifiable — who is speaking, what happened, what is
    being asked of the reader, and what follows from doing nothing. It never scores tone, length or
    clarity, because those are the reader's judgement and a gate that pretends otherwise becomes a
    style argument that reddens honest messages.

    IT MAKES A GOOD WRITER OF AN EXISTING ONE RATHER THAN ADDING A SECOND. Five AI writers already
    compose escalation prose; this gives them the shape to fill and refuses what comes back without
    it. A producer whose message already has the four parts is unaffected, which is what keeps this
    from being a rewrite of fourteen call sites.

    THE FALLBACK IS THE HAZARD AND IT FAILS TOWARD DELIVERY. A message that cannot be made to meet
    the structure must still REACH the operator, annotated as non-conforming — never dropped, never
    held. An escalation is raised because something needs a human; a comprehension gate that can
    swallow one has traded a badly-worded warning for no warning, which is strictly worse.

    IT IS THE INBOUND HALF OF A PAIR. W1-T2499 is the interpreter on the way back and depends on the
    thread this attaches to; both exist so a message and its answer are each intelligible to the side
    receiving them.

    NOT IN SCOPE: rewording any existing message, which would redden W1-T2279's own verbatim-quote
    suite; judging prose quality; and the reply direction, which W1-T2499 owns.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: two src stems plus a test, carrying two
    independent acceptance concerns — the structural check and the non-conforming fallback.
