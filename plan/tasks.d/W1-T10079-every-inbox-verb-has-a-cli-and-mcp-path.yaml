    - inbox-verdict-command.ts proposalVerdictCommand serves rmd decline and rmd restore through
      applyProposalVerdict, the same decision as the HTTP routes; rmd reframe is what POST /v1/inbox/reframe runs.
    - operator-mcp.ts: with a write token the only write tool is answer_question.
