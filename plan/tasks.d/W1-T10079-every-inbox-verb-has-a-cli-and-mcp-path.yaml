  rationale: |
    READ at origin/main a1343d257 (symbols):
    - panel-graph.ts buildArchiveProposalRoute and buildSnoozeProposalRoute (W1-T8831) write
      state/inbox-triage.json and ledger inbox.archived/inbox.snoozed; no CLI calls setInboxArchived or
