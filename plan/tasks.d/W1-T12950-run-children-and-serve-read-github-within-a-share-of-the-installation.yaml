  rationale: |
    WHY: the GitHub App installation allows 15,000 core reads an hour, shared by every process that holds its
    token. W1-T12553 gave each daemon a share of what is left, but only the daemon process sets the budget. A run
    child and the serve process read with the same installation token and no share and no write reserve, so they
    can spend the reads the daemons hold back, down to 0.
    READ at origin/main 57ca3bba9:
    - configureGithubInstallationBudget has two production callers: startDaemonInstallationBudget
      (src/cli/commands/daemon.ts:3071, called from :1328) and the daemon's read worker thread
      (src/lib/status.ts:4708, which joins the daemon's SharedArrayBuffer state). No other process sets it.
    - With no budget set, githubInstallationBudget() (src/lib/github-transport.ts:620) makes a budget with
      consumers undefined, which has no allowance and no reserve check.
    - src/run-child-main.ts:299 and src/lib/serve.ts:2898 start the installation token refresh, so both read
      as the installation.
    - installationConsumers (src/lib/instance-registry.ts:305) counts live instances plus one hand-run share.
    MEASURED, core, site and console ledgers, 2026-11-14 18:15Z to 2026-11-15 18:16Z:
    - github.budget.configured rows: 30, all with actor daemon and lane daemon (core 11 configured, 2
      unconfigured; site 9 and 5; console 10 and 2). No row from a run child or from serve.
    - board_gateway.fetch_bytes and issue_fetch_bytes REST calls in the core ledger by actor: run_child 7,524,
      daemon 2,524, service (serve) 62. These are the board reads alone; the run children's other reads are not
      counted in any row.
    - daemon.quota rows with bucket core and remaining 0: console 84, site 82, core 5. Most fall from
      2026-11-15 09Z to 14Z (console 79 of 84). github.budget.throttled rows with reason refused (GitHub
      refused a read for its rate limit): core 8, site 4, console 5.
    - The operator's read audit of the same day counted at least 8,700 reads an hour: core 3,812, site 1,858,
      serve 1,234, console 797, broker 694 (not stored on main).
    - docker inspect at 18:20Z: the core, console and site daemon containers and the serve container all
      have GH_APP_INSTALLATION_ID in their environment (names only were read, no values).
    EXPECTED: run children and serve stop their reads at the write reserve, so merges and reviews keep their
    reads in a drained hour, and the run children of an instance read at most one share between them.
    FALSIFIER: if the next 24 h after this lands still show daemon.quota remaining 0 rows in the same number,
    with run children and serve now throttled at the reserve, the drain comes from a consumer outside this
    budget (the Mac read broker or a hand run), and the next task is that consumer, not a smaller share.
  design: |
    INVARIANT writes-keep-their-reserve: unchanged from W1-T12553 in every role; writes never wait.
    INVARIANT no-budget-when-unconfigured: an unconfigured role reads exactly as today, and its row says why.
    One shared start: the daemon, a run child and serve set the budget through one function, so the registry
    read, the consumer count and the row shape cannot drift apart.
    1. New module src/lib/installation-budget-start.ts: export startProcessInstallationBudget({ role,
       readRegistry, env, log, clock, targetRepo, maxWaitMs, shareDivisor }). Move the body of
       startDaemonInstallationBudget into it. role is "daemon", "run_child" or "serve" and goes on the row.
       The daemon keeps its SharedArrayBuffer worker input (daemonInstallationBudgetWorkerInput); the other roles
       have no worker thread to share with. Reuse the existing registry reader (daemonInstallationRegistry);
       declare no new ...Deps interface.
    2. src/lib/instance-registry.ts: export RUN_CHILD_INSTALLATION_SHARES = 1 and SERVE_INSTALLATION_SHARES = 1,
       and add both to installationConsumers' count. Each daemon's share then shrinks from 1/4 to 1/6 of what is
       left; that is the intended trade.
    3. src/lib/run-child.ts: when the daemon spawns a run child, pass the host worker budget it already uses
       (host_worker_budget on sweep rows) in the child's environment as the share divisor. A run child's
       allowance is floor(share / divisor). src/run-child-main.ts calls startProcessInstallationBudget after the
       token refresh arms.
    4. src/lib/serve.ts: call startProcessInstallationBudget with role serve where it starts the app refresh.
    5. src/lib/ledger-steps.ts: the github.budget.configured writer list names startProcessInstallationBudget and
       its meaning names the three roles.
    6. Add the focused test file for criteria 1 to 5. Drive runChildMain and the serve start through their
       production entries with a fake registry file and a gh shim (test/helpers/gh-shim.ts).
    NOT IN SCOPE: the Mac read broker; hand runs (they keep the hand-run share); the ETag cache (W1-T12892); the
    run children's cold board walk (W1-T12893).
  falsifier: |
    Remove the run child's call: criteria 1 and 7 must fail. Let a write call claimRead: criterion 3 must fail.
    Drop the two new shares from installationConsumers: criterion 4 must fail. Throw on an unreadable registry
    in a run child: criterion 5 must fail. Restore and require all to pass.
