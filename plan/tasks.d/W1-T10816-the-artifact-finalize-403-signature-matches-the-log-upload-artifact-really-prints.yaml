- id: W1-T10816
  title: "THE ARTIFACT-FINALIZE 403 SIGNATURE MATCHES THE LOG UPLOAD-ARTIFACT REALLY PRINTS — W1-T3194's ARTIFACT_FINALIZE_INTERMEDIARY_403 requires the line `artifact upload completed successfully` before `Finalizing artifact upload`, a line actions/upload-artifact never prints (it prints `Finished uploading artifact content to blob storage!`), so the signature has matched nothing in seven weeks: zero sweep.ci_infrastructure_requeue rows since it shipped on 2026-09-08"
  repo: remudero
  depends_on: []  # W1-T3194 (merged, #4697) owns the signature; W1-T9932 (merged, #12637) added the job-log read and the transport-reset entry and left this entry unchanged on purpose
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 10.00
  risk: high  # Rule 19: one concern, one anchor in one classifier entry. A too-wide anchor re-runs a real failure, so every fail-closed shape W1-T3194 and W1-T9932 pinned must still return undefined
  band_meaning: blast-radius
  priority: 1  # the shipped re-run for a proven artifact-service 403 is dead on both surfaces: a PR's red costs a fix round, and main health opens a manual incident (the W1-T3194 incident hit main's Scorecard run)
  status: queued
  attempts: 0
  origin: "investigator V62, 2026-10-27, re-verifying a 2026-10-17 lead from agent B50 (#12637 / W1-T9932) at origin/main ab1bf6914"
  plan_refs: [W1-T3194, W1-T9932, W1-T10379, W1-T8038]
  files:
    - src/lib/sweep.ts
    - test/sweep/the-artifact-finalize-403-signature-matches-the-log-upload-artifact-really-prints.test.ts
  rationale: |
    READ 2026-10-27 on origin/main ab1bf6914, by symbol.

    THE ORIGINAL LEAD (B50, 2026-10-17) said the 403 signature never matched because fetchCiFailuresAsync used a
    job's annotations as its log tail, and a finalize failure annotates only the error line. W1-T9932 (#12637) has
    since fixed that half: when every annotation is a `Failed to FinalizeArtifact:` line or the self-hosted-runner
    hint, fetchCiFailuresAsync (src/lib/tick-read-worker.ts) goes on to read the job log region
    (annotationFallback `artifact-finalize-only`), and that region does carry the upload step's lines.

    THE SIGNATURE IS STILL DEAD, for a different reason. classifyCiInfrastructureFailure (src/lib/sweep.ts) returns
    ARTIFACT_FINALIZE_INTERMEDIARY_403 only when `artifact upload completed successfully` comes before
    `finalizing artifact upload`, which comes before the 403 `Error from intermediary` line. actions/upload-artifact
    does not print that first line. Every real log this repository holds prints
    `Finished uploading artifact content to blob storage!` there instead:
    - the #12415 transcript W1-T9932 copied into
      test/a-plan-only-pr-red-only-on-a-ci-infrastructure-step-is-re-run.test.ts (run 38955270104, 2026-10-16);
    - the PR #13385 `scan-pr / osv-scan` log in the fix.dispatch row of 2026-10-21T16:02:50Z
      (a 404 finalize, quoted in W1-T10379's rationale).
    The `artifact upload completed successfully` wording appears only in W1-T3194's own synthetic fixtures
    (test/failed-ci-infrastructure-requeue.test.ts, test/main-health-wiring.test.ts and three others). W1-T9932's
    transport-reset entry already accepts both wordings (finalizeResetAfterPassingSummary); the 403 entry does not.

    PROBE at ab1bf6914 (tsx, classifyCiInfrastructureFailure on the #12415 upload lines with the reset line
    replaced by `##[error]Failed to FinalizeArtifact: Received non-retryable error: Failed request: (403)
    Forbidden: Error from intermediary ...`): real wording -> undefined; the same log with the upload line swapped
    for W1-T3194's synthetic wording -> artifact-finalize-intermediary-403.

    LEDGER, the host union (state/ on the Azure host, 611 files: every gz rotation from 2026-09-07 on plus the live
    file, niced). Positive control: run.start rows span 2026-09-07T00:40Z to 2026-10-27T10:41Z. Result: ZERO
    sweep.ci_infrastructure_requeue rows, ZERO main.health.ci_requeued rows, and ZERO rows carrying
    `artifact-finalize-intermediary-403` or `artifact-finalize-transport-reset`, in the whole window. Real finalize
    failures did happen in it: PR #6396 (W1-T3615) on 2026-09-21 had a `FinalizeArtifact` 403 on
    `scan-pr / osv-scan`, and its worker wrote report.followups asking a person to "re-run the failed job";
    PR #13385 on 2026-10-21 spent a ci-log fix round on a finalize 404.
  design: |
    Widen ONE anchor. In classifyCiInfrastructureFailure the 403 entry's upload position accepts
    `Finished uploading artifact content to blob storage!` as well as the existing
    `artifact upload completed successfully`. That is the same pair finalizeResetAfterPassingSummary already
    accepts, so share one pattern between the two entries rather than writing it twice. Nothing else changes:
    the order (upload, then finalizing, then the 403 line), the `Error from intermediary` requirement, the
    exclusions (permission wording, AssertionError, TAP `not ok`, `# fail` above 0, `error TS`) and the FAILURE
    conclusion requirement all stay. ciInfrastructureMatchedError and ciInfrastructureFailedStep are untouched.
    Do not rewrite W1-T3194's synthetic fixtures; they keep proving the old wording still classifies.
  acceptance:
    - claim: "a FinalizeArtifact 403 through an intermediary, in the log lines actions/upload-artifact really prints, classifies as the intermediary-403 infrastructure signature both as a region and through fetchCiFailuresAsync's finalize-only annotation path"
      proof: 'grep: test("W1-T10816: a real upload-artifact log that 403s while finalizing classifies as infrastructure" in test/sweep/the-artifact-finalize-403-signature-matches-the-log-upload-artifact-really-prints.test.ts'
    - claim: "the widened anchor stays fail-closed: no upload line, the 403 before the upload, a generic 403 with no intermediary, a 404, permission wording, a failing count or a CANCELLED conclusion all return undefined"
      proof: 'grep: test("W1-T10816: a real-wording finalize log without the proven 403 shape stays a genuine red" in test/sweep/the-artifact-finalize-403-signature-matches-the-log-upload-artifact-really-prints.test.ts'
  falsifier: |
    At base the first case fails: the real-wording log returns undefined from classifyCiInfrastructureFailure.
    - Accept any `Failed to FinalizeArtifact` 403: the generic-403 and 404 shapes classify, and the second case fails.
    - Drop the upload anchor instead of widening it: the no-upload shape classifies, and the second case fails.
    - Widen only the region path and not the annotation path: the fetchCiFailuresAsync assertion fails.
    GUARDS that held at base and must still hold:
    - test/failed-ci-infrastructure-requeue.test.ts
    - test/a-plan-only-pr-red-only-on-a-ci-infrastructure-step-is-re-run.test.ts
    - test/main-health-wiring.test.ts
