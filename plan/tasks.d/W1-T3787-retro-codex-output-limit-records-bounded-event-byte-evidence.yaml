- id: W1-T3787
  title: "THE RETRO'S CODEX JSONL OUTPUT CAP TERMINATES WITHOUT EVENT-BYTE EVIDENCE — a 1 MiB limit is correctly enforced, but the next recovery decision cannot tell agent prose from tool-output volume"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 12.00
  origin: "operator-session#all-daemons-healthy-2026-09-19"
  plan_refs: ["W1-T3502", "W1-T2981", "W1-T2988", "W1-T192"]
  files:
    - src/lib/worker-provider.ts
    - src/run-task.ts
    - test/worker-provider.test.ts
    - test/run-task.test.ts
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on the live remudero daemon, 2026-09-19: the detached automated
    retro ended non-zero after `retro.error` recorded `Codex worker stdout output
    exceeded its 1048576-byte retention budget (1048791 bytes observed)`. The
    marker therefore did not advance. The core daemon continued sweeping and
    reviewing, so this is a retro-lane failure, not daemon liveness failure.

    The source establishes why no corrective action can yet be selected honestly.
    `spawnCodexWorkerInPrivateTemp` in src/lib/worker-provider.ts increments the
    raw stdout byte count and tears down the process before pushing the over-limit
    chunk into `CodexJsonlAccumulator`. The accumulator parses event types and
    item kinds, but exposes no byte aggregate. `CodexWorkerOutputLimitError`
    carries only stream, limitBytes, and observedBytes; runRetro's outer catch in
    src/run-task.ts logs only `String(error)`. We therefore cannot distinguish a
    transcript dominated by agent prose, command output, other protocol events,
    malformed JSONL, or one large unfinished line. Raising the cap, retrying, or
    changing the retro prompt from this one aggregate would be guesswork.

    W1-T192 is a merged inbox-drafting implementation (ee617c9e / #457) whose
    stale record still advertises src/run-task.ts and test/run-task.test.ts. Its
    draft hook does not reach runRetro or this catch; this task owns only the
    retro output-limit evidence path and does not alter inbox scheduling.
  design: |
    Preserve both existing stdout/stderr limits and the immediate process-group
    teardown. Extend the bounded Codex JSONL accumulator with a fixed allowlist of
    event-kind counters that sums bytes only for complete, already-retained JSONL
    lines before the cap: event type plus `item.type` where present, a named
    malformed bucket, and a named other bucket. Bound the map by construction;
    retain no raw event text, command, prompt, tool output, or unbounded key.
    Carry the aggregate and the pre-cap pending-line byte count on a typed
    bounded-output error.

    At runRetro's existing outer catch, recognize that typed error and append the
    structured stream, limit, observed-byte, event-byte aggregate, and pending
    byte count to `retro.error`. The ordinary error text remains for compatibility.
    Other workers and generic runTask handling are unchanged. Do not increase a
    ceiling, redact or retain a transcript, add a retry, alter marker advancement,
    or make a generic retro execution error escalate in this PR. The next policy
    task must begin from one or more deployed structured rows.

    Add synthetic JSONL regressions proving that two distinct complete event kinds
    produce distinct bounded byte buckets, an unfinished final line remains named,
    and the same typed data reaches the retro error ledger through the real catch
    path. The default production containment path must be exercised; a fake error
    injected only at runRetro is insufficient coverage for the producer. This is
    risk:high because the bounded producer and durable consumer are one atomic
    diagnostic property: changing either half alone leaves the next policy
    decision as blind as today.
  acceptance:
    - claim: "a capped Codex stdout error carries a fixed-size event-byte breakdown rather than only total observed bytes"
      proof: "grep: event_bytes_by_kind in src/lib/worker-provider.ts"
    - claim: "the automated retro ledger records bounded-output event-byte evidence without retaining raw transcript text"
      proof: "grep: event_bytes_by_kind in src/run-task.ts"
    - claim: "the Codex output-cap regression proves distinct JSONL event kinds remain distinguishable at the producer"
      proof: "grep: W1-T3787 event bytes distinguish retained JSONL kinds in test/worker-provider.test.ts"
    - claim: "the retro catch regression proves typed bounded-output evidence reaches retro.error"
      proof: "grep: W1-T3787 retro error carries output-limit evidence in test/run-task.test.ts"
  falsifier: |
    Delete the aggregate from CodexWorkerOutputLimitError: the producer regression
    must fail because the two synthetic event populations become indistinguishable.
    Restore a string-only retro catch: the catch-path regression must fail because
    the `retro.error` row lacks the typed fields. Make the accumulator use raw
    event strings as map keys: the bounded-key assertion must fail. If any variant
    still passes, the new diagnostic is decorative.
  note: |
    reservation hand-off: unknown -> plan/retro-output-cap-evidence-1789827887000

    This is measurement before policy. It deliberately does not decide whether a
    later repair should shrink prompts, constrain tool output, change the model,
    retry from a cursor, or alter a byte ceiling. Those choices have different
    safety and cost properties, and no current ledger field distinguishes them.

    W1-T192 is cited solely to clear the plan overlap advisory. Its daemon-side
    inbox drafting hook shipped in ee617c9e / #457 despite the record's stale
    `status: queued`; its historical src/run-task.ts and test/run-task.test.ts
    surface is unrelated to this task's runRetro catch. No draft scheduling,
    proposal cache, or inbox behavior is changed here.
