  acceptance:
    - claim: "invariant:fix-acts-on-exact-head-evidence — When the sweep's fresh head read gives a head other than the one it judged, the dispatch re-reads that PR at the new head. If the PR is open and still fixable there with readable exact-head evidence, the dispatch continues at the new head with that evidence and logs sweep.fix.head_adopted. It writes no sweep.fix.checkout_claim_declined row with head_identity_changed"
