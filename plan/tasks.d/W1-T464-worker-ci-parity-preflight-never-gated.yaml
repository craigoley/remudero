    blocks at `>=2 subsystems while risk<high`, and `files:` spans `src/lib/`, `src/` and `test/`. The
    band is Rule 19's SPAN, not blast radius: the blast radius is one exported function returning two
    prompt lines, its one spread site, and the suite that asserts its shape.
    THREE `proof-scope` WARNINGS ARE EXPECTED ON THIS SHARD AND ARE DELIBERATELY LEFT. The proofs are
    `grep:` patterns against this shard rather than the house forward-referencing `unit test:` form,
    because a forward reference cannot EXECUTE on the FILING PR — it would cap this review at
    `proof_exec: 0/3`, whereas a `grep:` with an explicit path executes and can earn a full PASS on a
    plan-only diff. `proofScopeViolations` (`src/lib/task-linter.ts`) then warns that the proof path is
    outside `files:`.
    ITS OTHER REMEDY WAS TRIED AND IS WORSE, MEASURED: adding this shard's path to `files:` alongside
    the src/test paths turns the three WARNINGS into one BLOCK — `rule15-filing`, because a record edit
    beside code at `verify:auto` puts `criteriaTampered` in a position to refuse the implementation PR
    outright. Open-failing went 165 -> 166. `proofScope` defaults to `warn` and NO caller overrides it
    (`opts.proofScope`), so these three never block. Leave them.
    `files:` WAS OTHERWISE DERIVED BY INVOCATION, not by prose mention. `ciParityContractLines` is defined in
    `src/lib/compaction.ts`, spread into the implement contract in `src/run-task.ts`, and asserted by
    `test/ci-parity-contract.test.ts` — which pins the literal command, the before-the-push wording,
    and the ORDER (`parityIdx < pushIdx`), so it fails the moment the contract changes and MUST be in
