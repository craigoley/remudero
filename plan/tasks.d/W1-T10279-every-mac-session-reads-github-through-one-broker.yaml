  falsifier: |
    Drop the cross-process in-flight map: three clients reading one key cause three upstream calls, and the first test
    fails.
    Ignore max-age and always revalidate: the fresh-hit case makes an upstream call. Send no If-None-Match: the stale
    case gets a 200 where the fake returns 304 only to a conditional request. Either way the second test fails.
    Serve FIFO across classes: the interactive read waits behind the agents, and the third test fails.
    Replace the adaptive pacer with a fixed gap: the retry-after hold and the narrowing after success are not
    observed, and the fourth test fails.
    Leave rule 10 flooring every `gh` token: `rmd gh` is refused 180 s after a read, and the fifth test fails.
    Skip the invalidation append: a read after `gh pr edit` is served from cache, and the sixth test fails.
