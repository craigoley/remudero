    - claim: "the async add ledgers the same worktree.add row as the sync add"
      proof: "unit test: the async worktree add ledgers the same row as the sync add"
    - claim: "the async add still refuses a stale base"
      proof: "unit test: the async worktree add still refuses a stale base"
    - claim: "runTaskBody awaits the async add"
      proof: "grep: await worktreeAddAsync( in src/run-task.ts"
  falsifier: |
    CLOSE IF a week of core ledger shows no `daemon.loop_lag` row within 60 s after a `worktree.add` row, or if
    W1-T4075's read plane has already moved dispatch off the main thread.
