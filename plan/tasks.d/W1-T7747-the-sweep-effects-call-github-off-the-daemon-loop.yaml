- id: W1-T7747
  title: "THE SWEEP'S EFFECTS CALL GITHUB OFF THE DAEMON LOOP — `buildSweepEffects` still reaches `gh` through the synchronous `ghJson`/`ghExec`, including the armed-idle direct merge through `mergeDirectViaRest`, although `mergeDirectViaRestAsync` and `ghJsonAsync` exist: on 2026-10-10 `ghExecFile` held the loop 13 times (worst 5.1 s) and `mergeDirectViaRest` up to 2.7 s"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the transport the sweep's effects use for GitHub; it includes a merge write
  band_meaning: blast-radius
  origin: "operator session 2026-10-10: core daemon loop-stall investigation (daemon.loop_lag 07:50-09:57Z), operator asked for flow improvements"
  plan_refs: [W1-T5284, W1-T5492, W1-T5615, W1-T6591, W1-T5689, W1-T1255, W1-T7734, W1-T7735]
  files: [src/lib/sweep.ts, src/lib/arm-auto-merge.ts, test/the-sweep-effects-call-github-off-the-daemon-loop.test.ts]
