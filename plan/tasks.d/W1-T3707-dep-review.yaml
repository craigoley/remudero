  note: |
    MEASURED 2026-09-16 while diagnosing why #5757 had no review.

    THE LEDGER NAMES IT:

      18:15:21  dep-review.decided
                diff touches file(s) outside the manifest/lockfile allowlist:
                apps/dashboard/package.json

      19:47:44  sweep.dispose.not_open
                dependency review already reached a TERMINAL outcome at this head (b4381df)
                -- a hold would have re-run instead
      19:47:44  sweep.disposed  dependabot PR -- dep-review lane (checks green, review none)

    So the refusal is TERMINAL: #5757 sits checks-green, review-none, and nothing will re-derive
    it. It is not queued behind anything -- it is unreachable.

    THE TWO PREDICATES, AND THE REPOSITORY'S OWN DECLARATION:

      root package.json  "workspaces": ["packages/*", "apps/*"]

      path                                       dep-review   head-identity   correct
      package.json                                   admit        admit         admit
      apps/dashboard/package.json                    REFUSE       admit         admit
      packages/api-client/package.json               REFUSE       admit         admit
      test/fixtures/onboard/repo/package.json        REFUSE       ADMIT         refuse
      .github/workflows/ci.yml                       admit        admit         admit

    `src/lib/dep-review.ts`'s `MANIFEST_PATTERNS` are all `/^...$/` -- root-anchored, so every
    workspace manifest is refused. `scripts/head-identity-gate.mjs`'s `isDependencyManifestPath`
    matches on BASENAME, so it admits a manifest anywhere, INCLUDING a test fixture.

    EACH IS WRONG IN THE OPPOSITE DIRECTION, and neither reads the workspace list the repository
    already publishes.
  rationale: |
    THIS IS W1-T3680'S UNFINISHED HALF, AND THE AUTHOR'S OWN ERROR. That task admitted a manifest-only
    dependency bump at head-identity-gate and deliberately matched by basename so
    `apps/dashboard/package.json` would pass -- the PR body called that choice load-bearing, because
    #5757 carries exactly that path. What it missed is that `dep-review` keeps a SECOND allowlist for
    the same concept. Fixing one of two sources of truth moved the blockage rather than removing it:
    #5759 (workflow files only) merged; #5757 (a workspace manifest) did not.

    BASENAME MATCHING IS ALSO TOO LOOSE, and this is the more serious half. `test/fixtures/onboard/
    repo/package.json` is a FIXTURE, and head-identity-gate currently calls it a dependency manifest.
    A `dependabot/`-named head with a `chore(deps)` subject editing only that file would be admitted
    without a task credit. That is precisely the credit hole W1-T3680's own path constraint exists to
    prevent, reintroduced by the matcher meant to enforce it.

    THE REPOSITORY ALREADY PUBLISHES THE ANSWER. `package.json`'s `workspaces: ["packages/*",
    "apps/*"]` is the declaration of which nested manifests are real. Reading it is evidence-based
    rather than a hand-maintained path list, it needs no upkeep when a workspace is added or removed,
    and it distinguishes `apps/dashboard/package.json` from `test/fixtures/.../package.json` without
    either being enumerated anywhere.

    ONE PREDICATE, NOT TWO AGREEING ONES. A second copy that currently agrees is a copy that will
    disagree later; that is exactly how this defect arose. The fix is a single exported predicate
    both callers import.
  design: |
    (i) ONE EXPORTED PREDICATE. `src/lib/dep-review.ts` owns it -- its pattern list is the richer of
        the two (Gemfile, go.mod, Cargo, requirements.txt, yarn/pnpm locks) and it already lives in
        `src/lib`. `scripts/head-identity-gate.mjs` IMPORTS it and deletes its own copy, the same way
        it already imports `LINT_FILING_SUBJECT_RE` and `extractTaskTrailerId` rather than re-spelling
        them.

    (ii) NESTED MANIFESTS ARE ADMITTED ONLY UNDER A DECLARED WORKSPACE. The predicate reads the root
         `package.json`'s `workspaces` globs and admits `<workspace>/package.json` and its lockfile.
         A manifest outside every declared workspace -- a fixture, a scratch directory -- is REFUSED,
         restoring the constraint basename matching dropped.

    (iii) NO DECLARED WORKSPACES MEANS ROOT-ONLY, which is today's dep-review behaviour exactly. A
          repository without a `workspaces` field loses nothing and gains no new admissions.

    (iv) AN UNREADABLE ROOT MANIFEST REFUSES NESTED PATHS rather than falling back to basename. The
         safe direction when the declaration cannot be read is the narrow one; root paths still
         match, because those need no declaration.

    (v) THE WORKFLOW RULE IS UNCHANGED -- `.github/workflows/*.y{a,}ml` stays admitted by prefix, and
        no existing root pattern is narrowed.

    NO ALLOWLIST OF DIRECTORIES IS INTRODUCED. The one list that governs nesting is the repository's
    own `workspaces` field, which is maintained for other reasons and cannot go stale without the
    build noticing first.

    THE BAND RECORDS WIDTH, NOT DANGER: the predicate lives in `src/lib/dep-review.ts` and the caller
    that must stop re-spelling it lives in `scripts/`, and the defect IS that those two disagree.
  acceptance:
    - claim: "a manifest inside a declared workspace is admitted by both the dependency-review lane and the head-identity gate, so a workspace bump is not refused by one and admitted by the other"
      proof: "unit test: test/one-manifest-predicate-reads-the-declared-workspaces.test.ts"
    - claim: "a manifest outside every declared workspace is refused, so a test fixture is no longer treated as a dependency manifest"
      proof: "unit test: test/one-manifest-predicate-reads-the-declared-workspaces.test.ts"
    - claim: "a repository declaring no workspaces admits root manifests only, so today's dependency-review behaviour is unchanged where there is nothing to declare"
      proof: "unit test: test/one-manifest-predicate-reads-the-declared-workspaces.test.ts"
    - claim: "an unreadable root manifest refuses nested paths rather than falling back to basename matching"
      proof: "unit test: test/one-manifest-predicate-reads-the-declared-workspaces.test.ts"
    - claim: "the head-identity gate resolves manifests through the shared predicate rather than a copy of its own"
      proof: "grep: isManifestPath( in scripts/head-identity-gate.mjs"
  falsifier: |
    Refuse a declared-workspace manifest in either caller and the first test fails. Admit a fixture
    manifest and the second fails. Admit a nested path with no workspaces declared and the third
    fails. Fall back to basename on an unreadable root manifest and the fourth fails. Leave a second
    predicate in the gate script and the fifth fails.
