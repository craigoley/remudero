- id: W1-T3707
  title: "TWO INDEPENDENT MANIFEST ALLOWLISTS DISAGREE — dep-review anchors every pattern to the repo root and refuses a workspace manifest, head-identity-gate matches by basename and admits a TEST FIXTURE, and #5757 is terminally stuck between them with green checks and no review"
