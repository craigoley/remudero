    - claim: "the dispatch-base check and the pre-push check agree on every grep proof they both judge"
      proof: 'grep: test("W1-T8759: the dispatch check and certainStaleProofs agree on the base side" in test/a-queued-task-whose-proof-already-passes-at-base-is-not-built.test.ts'
    - claim: "the pre-dispatch stale-proof row has a named step"
      proof: 'grep: "dispatch\.proof_stale_at_base" in src/lib/proof-base-stale.ts'
    - claim: "the pre-dispatch guard calls the check"
      proof: 'grep: staleAtDispatchBase( in src/run-task.ts'
  falsifier: |
    Remove the `staleAtDispatchBase` call from the §5C guard, and the first test sees a worker spawn on a task whose proof
    matches at origin/main, as W1-T8533's three builds did. Put the base sha in the violation message, and the third test
    sees a new repair dispatch each time main moves instead of one escalation. Treat an unreadable target as a match, and
    the second test sees a refusal with no evidence. Let the dispatch check skip `kind: guard` differently from
    `certainStaleProofs`, and the agreement test names the criterion they disagree on.
  note: |
    EFFECT, measured after merge from the core ledger with no numeric pass mark: count `dispatch.proof_stale_at_base`
    rows by task, and `pr.open_refused` rows with `refusal_class: "stale-proof"`. Healthy shape: a stale-proof PR-open
    refusal happens only when main satisfied the proof after the dispatch-time check, and no task is built twice
    against the same stale proof.
