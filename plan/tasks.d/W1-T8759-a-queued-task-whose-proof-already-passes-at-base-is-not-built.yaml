  rationale: |
    READ on origin/main 639ed54a8. Symbols, not lines.
    THE CASE. W1-T8533 was filed in #11089 (7ad208f57, 2026-10-12T13:31:40Z) with the proof
    `grep: "refresh\.clearance" in src/lib/ledger.ts`. #11049 (5ec079f75, 14:05:49Z) and #11097 (939dee0ad, 14:32:42Z)
    each added `"refresh.clearance"` to `DECISION_RELEVANT_LEDGER_STEPS` for their own reasons. From then on the proof
    matched at every merge base, and `rmd check-proof --base origin/main` reports it `executed_stale` (exit 5). The fleet
    still built the task three times: run-W1-T8533-1791815680124 (14:34:40Z), -1791818151153 (15:15:51Z) and
    -1791822945025 (16:35:45Z). All three branches are on origin. The newest was refused at PR open with
    `openPullRequestChecked: W1-T8533 proof did not pass against merge base (grep: "refresh\.clearance" in
    src/lib/ledger.ts) … executed_stale`. A worker may not edit its own task's proof (Rule 15), so no build could have
    passed it. Only a plan amendment could, and it was filed by hand.
    WHAT EXISTS, AND WHY NONE OF IT RUNS BEFORE A BUILD:
      - Filing time: `proofGrepAlreadyTrueViolations` (src/lib/task-linter.ts, W1-T4904) warns when a grep proof
        already matches. It judges only criteria the filing diff adds or changes (`criteriaAdded`,
        `criteriaProofChanged` against `baseAcceptance`), so a proof that main satisfies after filing is never judged
        again. It is a warning, and it needs `readGrepProofFile` and `baseAcceptance`, which only `lint-plan --base`
        supplies.
      - Pre-dispatch: the §5C guard in `runTask` calls `assertLintClean(task, { proofResolvability: "warn" })` with no
        `readGrepProofFile` and no `baseAcceptance`, so `proofGrepAlreadyTrueViolations` returns nothing there.
        W1-T2835 kept its "file exists at base" check off this call site on purpose, because that check is a heuristic
        and a queued task's proof may name a test its own PR will add. A grep that already matches at origin/main is not
        a heuristic: it is the result review uses (`preexistingProofHits`, W1-T273) to grade the proof stale.
      - Pre-push: `runPreflightProofs` and scripts/proof-resolve-precheck.mjs call `certainStaleProofs`
        (src/lib/proof-base-stale.ts, W1-T4921). That runs after the build.
      - PR open: `openPullRequestChecked` (src/lib/pr-open.ts) refuses a stale proof as `stale-proof`, and
        `recordRefusedPrOpen` raises a BLOCKED escalation, or `pr.open_satisfied_by_main` for a test-only build. That
        also runs after the build, and it did not stop the second and third builds.
      - Review: `executed_stale` (W1-T273, W1-T362) runs after the PR opens.
    THE REPAIR PATH ALREADY EXISTS. A pre-dispatch lint refusal goes to `repairRefusedTask` (src/lib/dispatch-repair.ts,
    W1-T3657). The first refusal writes one `dispatch.repair.dispatched` row. A second refusal with the same verdict text
    raises one BLOCKED escalation whose option is `restructure-task`, and later identical refusals are held. A changed
    verdict counts as progress. That is the plan-repair route a stale proof needs, so this task adds a check, not a lane.
    NOT MEASURED: how many other queued tasks carry a grep proof main already satisfies. The design's row makes that
    countable.
  design: |
    1. THE PREDICATE, IN src/lib/proof-base-stale.ts. Export `staleAtDispatchBase(criteria, repoDir, baseRev, deps)`,
       returning `{ stale: StaleProofRow[]; unknown: string[] }`. Use the same criteria as `certainStaleProofs`:
       `visibleCriteria`, skipping `satisfied_by`, `kind: guard` and any proof `isDialectGrepProof` rejects. Do not run the
       proof at a head: no build has run yet, and the tree the build starts from is the base. Put each target in a tree at
       `baseRev` with `materialiseBaseGrepTree` and classify it with `preexistingProofHits`, as `certainStaleProofs` does.
       Share that base half with `certainStaleProofs` so the two cannot disagree, and do not change what
       `certainStaleProofs` returns. A target in `unreadable` or `needsCheckout` goes in `unknown`, never in `stale`.
       `unit test:` proofs are not run, because a test run at the base is not cheap; review's W1-T362 arm still covers
       them. Also export `PROOF_STALE_AT_DISPATCH_STEP`, written on one line as
       `export const PROOF_STALE_AT_DISPATCH_STEP = "dispatch.proof_stale_at_base";`.
    2. THE CALL, IN `runTask`'s §5C PRE-DISPATCH GUARD (src/run-task.ts). Inside the same `try`, after
       `assertLintClean(task, preDispatchLint)`, resolve `origin/main` to a sha in the managed checkout
       (`join(config.root, "repos", task.repo)`, the repo `worktreeAddAsync` later cuts the worktree from at
       `origin/main`) and call `staleAtDispatchBase(task.acceptance ?? [], repoDir, sha)`.
         - Any stale row: log `PROOF_STALE_AT_DISPATCH_STEP` with `task_id`, `base_sha`, `proofs` (claim, proof, why) and
           `unknown`, then throw `new TaskLintError(taskId, violations)`, one violation per stale proof with check
           `proof-stale-at-dispatch-base` and severity `block`. The message names the proof and its target path and says
           to amend the shard. It does NOT name the base sha. The W1-T3657 verdict text must stay the same while main moves,
           so the second refusal escalates and later ones are held, rather than reading as progress.
         - The existing catch arm then does what it does for every lint refusal: `lint.blocked`, `repairRefusedTask` and
           the `blocked_illformed` verdict. No lock is taken, no worktree is made and no worker is spawned.
         - A sha or tree that cannot be read: log the same step with `outcome: "unreadable"` and dispatch as today. An
           environment gap never refuses a task.
         - No stale row: dispatch as today, with no row.
       An amendment that replaces the proof clears the finding on the next dispatch.
    3. UNCHANGED: `openPullRequestChecked`'s stale-proof refusal and escalation, which still catches a proof main
       satisfies between this check and the PR open; review's `executed_stale`; filing-time `proof-grep-already-true`;
       `certainStaleProofs`'s results; and every other lint check's severity at this call site. Nothing here uses a timer,
       a count or a cap: the check runs once per dispatch attempt and asks the reviewer's own question.
    4. TESTS. Use `gitRepo()` with a local git identity, a temp state dir, and no network or live ledger. Name the fixture
       helpers neutrally, which the fixture-copy census requires. The fixture repo has a shard whose grep proof matches at
       `origin/main`, a second that misses, a `kind: guard` criterion that matches, and a target whose read is made to
       fail. Drive the guard through `runTask` the way test/task-linter-wiring.test.ts does, with every seam faked except
       the predicate.
  acceptance:
