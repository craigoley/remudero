- id: W1-T8759
  title: "A QUEUED TASK WHOSE GREP PROOF ALREADY PASSES AT ORIGIN/MAIN IS NOT BUILT — the dispatcher never asks whether a filed proof still misses at the base it will build from, so W1-T8533 took three builds (2026-10-12 14:34Z, 15:15Z, 16:35Z) after #11049 made one of its proofs pass on main, and each was refused at PR open as executed_stale; check the grep proofs before dispatch and route a stale one to the pre-dispatch repair path with a named row"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — a queued task is not built while a filed grep proof already passes at its base; a false finding refuses dispatch of a buildable task
  band_meaning: blast-radius
  origin: "operator direction 2026-10-12 (\"continue with follow-ups, fix at the root\"); found while amending W1-T8533"
  plan_refs: [W1-T8533, W1-T3657, W1-T4904, W1-T4921, W1-T2835, W1-T273, W1-T362, W1-T1070, W1-T4818]
  files:
