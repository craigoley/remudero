  plan_refs: [W1-T5918, W1-T5974, W1-T3822, W1-T76, W1-T100]
  files: [src/run-task.ts, src/lib/sweep.ts, test/a-dead-fix-owners-staged-work-is-preserved-and-its-checkout-reclaimed.test.ts]
  status: merged
