      proof: 'grep: test("W1-T3547: a cash triage run is counted apart from a Claude one" in test/triage-lane-outcomes.test.ts'
    - claim: "a triage run with no terminal row is censored, never scored accepted or failed"
      proof: 'grep: test("W1-T3547: a triage run with no terminal row is censored, never scored" in test/triage-lane-outcomes.test.ts'
    - claim: "a missing cost reads unknown, never zero, and cash cost stays apart from subscription notional"
      proof: 'grep: test("W1-T3547: a missing cost is unknown, never zero" in test/triage-lane-outcomes.test.ts'
    - claim: "fewer than twenty terminal runs on a provider is an insufficient sample, never a verdict"
      proof: 'grep: test("W1-T3547: fewer than 20 terminal runs is an insufficient sample, never a verdict" in test/triage-lane-outcomes.test.ts'
    - claim: "the ledger is read through the three-form union and refuses an incomplete read rather than counting a partial corpus"
      proof: "grep: refuseIncomplete: true in src/lib/triage-lane-outcomes.ts"
    - claim: "the fold is reachable as an operator verb"
      proof: "grep: foldTriageLaneOutcomes( in src/run-task.ts"
    - claim: "the verb is registered and documented"
      proof: "grep: rmd triage-outcomes in docs/cli-reference.md"
  falsifier: |
    Score a run that has no terminal row as failed and the censored test must go red. Report a missing cost as 0
    and the unknown-cost test must go red. Return a verdict for 19 terminal runs and the insufficient-sample test
    must go red. Any diff to `.remudero/mounts.yaml`, `TRIAGE_WORKER_TOOLS`, or a `mountProvider` argument at the
    triage spawn is a boundary violation even if every test passes.
