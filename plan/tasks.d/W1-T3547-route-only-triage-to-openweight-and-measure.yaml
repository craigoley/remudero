  note: |
    REWRITTEN 2026-09-30 (operator ruling): the original scope, a static mount flip of `synthesis.triage`
    to cash, is withdrawn. Its premises are gone or false: W1-T3570's verdict was STOP (cash gpt-5-nano drafted
    lint-clean 25%, and #8017 reverted the Luna lead after 38 of 39 fragment-contract errors); the ladder for a
    sonnet/low mount leads with gpt-5-nano, never the gpt-oss-120b the old title named; the WebSearch bridge the
    old dependency edge waited for already exists (#5804, cash-web-bridge.ts) and W1-T3749 ruled WebSearch stays
    off the cash surface because triage reads untrusted inbound text; and a `provider: cash` triage mount without a
    `tools:` change throws on every run, because the spawn still declares WebSearch.
    This task changes NO mount, NO provider, NO config and NO spawn. A later routing task is filed only from
    this report's numbers.
  rationale: |
    Triage's deterministic gates (`decideTriage`, `runRelintLoop`, `assertProposedPlanLoads`) refuse a malformed
    or self-contradicting output; they cannot tell a wrong ALREADY_DECIDED from a right one, and a green plan-only
    triage PR is armed for auto-merge. So the only honest evidence that a weaker model is safe here is a
    per-provider count of terminal outcomes, attempts and relints beside the Claude baseline over the SAME window,
    with unknown cost reported as unknown. The lane already writes every row this needs: `triage.start`,
    `triage.synthesized` (provider, model, total_cost_usd, billing_mode per attempt), `triage.relint`,
    `triage.relint_refused`, `triage.error`, `triage.grill_opened` and `pr.opened`. A blocked-auction divert
    already runs triage on cash without WebSearch (TRIAGE_CASH_TOOLS, W1-T3749), so cash rows may exist today.
  design: |
    Add `foldTriageLaneOutcomes(rows)` in a new module: join the rows above by run_id, group by provider and
    model, and report per group the runs, terminal outcomes (propose, no_task, grill, error, relint_refused),
    attempts per run, relints, and cost with api-billed cash and subscription notional kept apart and a missing
    cost reported as unknown, never zero. A run with no terminal row is censored, never scored. A group with fewer
    than 20 terminal runs reads as an insufficient sample and never yields a verdict. Read the three-form ledger
    union with `refuseIncomplete: true`, as cash-trial.ts does. Register `rmd triage-outcomes [--json]`,
    read-only, and regenerate docs/cli-reference.md. It never declares a winner and changes no routing.
    The report is observational, not randomized: a squeeze divert lands on whatever feedback arrives while both
    subscriptions are blocked, so it names that confound instead of hiding it.
  acceptance:
