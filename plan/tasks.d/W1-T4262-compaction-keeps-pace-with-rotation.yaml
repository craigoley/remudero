      proof: 'grep: test("W1-T4262: a flood of same-day rotations is compacted while over bound" in test/ledger-compaction-keeps-pace-with-rotation.test.ts'
    - claim: "a pass does not re-open the compactor's own output while rotations remain"
      proof: 'grep: test("W1-T4262: a pass does not re-open the compactor.s own output while rotations remain" in test/ledger-compaction-keeps-pace-with-rotation.test.ts'
    - claim: "compaction runs sooner when arrivals outpace retirements"
      proof: 'grep: test("W1-T4262: compaction runs sooner when arrivals outpace retirements" in test/ledger-compaction-keeps-pace-with-rotation.test.ts'
