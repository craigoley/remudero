- id: W1-T3191
  title: "THE PLAN FAST LANE LEAVES THREE PAID SHARDS IDLE — a plan-only PR runs every one of 257 dependency-conservative suites on ci-shard 1 while shards 2–4 exit after checkout and install; duration-balance the identical candidate set across the existing matrix without weakening the fail-closed fallback"
  repo: remudero
  depends_on: [W1-T2904]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 30.00
  files:
    - .github/workflows/ci.yml
    - scripts/test-tier-manifest.mjs
    - test/plan-reading-fast-lane-sharding.test.ts
  origin: "operator-session#queue-lag-2026-09-08"
  plan_refs: ["W1-T2428", "W1-T2904"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED ON PR #4657. The plan-only `ci-shard (1/4)` started at 15:07:48Z and
    completed at 15:17:38Z: 590 seconds. The current classifier enumerates 257
    plan-reading suites. `.github/workflows/ci.yml` starts all four matrix members and pays
    checkout plus dependency installation four times, then explicitly exits members 2–4 and
    gives the complete conservative suite set to member 1. W1-T2428 measured 94 suites when it
    introduced the lane; the selected set has grown 2.7x. This is a distribution defect, not
    evidence that its dependency-conservative selection may be narrowed safely.

    W1-T2904 already owns the adjacent source-CI rewrite and the same workflow file. It introduces
    a recorded-duration manifest and longest-processing-time shard balancer for fast and slow test
    tiers. Depend on that task and generalize its one scheduler rather than adding a competing
    file-count or hash scheduler. For a proven plan/docs classification, enumerate today's exact
    `diff-class.mjs --list-plan-reading-suites` candidate set, validate every path, and
    duration-balance that complete set across the four matrix members. Source PR behavior remains
    exactly W1-T2904's fast-tier matrix plus required slow-tier job.

    W1-T2904 adds a separately required slow-test job. For plan/docs PRs, the matrix already runs
    every candidate, including candidates whose recorded duration places them in the slow tier;
    the slow job must still register successfully but must not execute those files a second time.
    It may skip duplicate execution only after the same fail-closed classifier and candidate
    validation have established the exact plan/docs matrix. A classifier, enumerator, manifest,
    or validation error falls back to W1-T2904's ordinary full source path; it never produces an
    empty success. Do not add runners, jobs, GitHub API calls, workflow path filters, or a second
    sharding algorithm.

    Emit a job summary per shard with candidate count, assigned count, recorded predicted duration,
    and the fallback decision. W1-T2904's measured-duration artifact then supplies a feedback loop:
    later runs update the schedule from actual suite cost instead of a hand-tuned static partition.
    The first production comparison is plan-only critical-path time before and after this task;
    do not call the lane faster until that measurement moves.
  design: |
    Extend the W1-T2904 manifest CLI with one fail-closed mode that accepts a newline-delimited exact
    candidate-file set and returns the duration-balanced subset for shard N/4. Reject absolute paths,
    traversal, duplicates, unknown tests, missing manifest membership, and a zero-candidate result.
    The four subsets must be disjoint and their union byte-for-byte equal the normalized candidate
    set. Preserve deterministic path tie-breaking for equal durations.

    In `ci.yml`, all four already-created matrix members classify and enumerate plan/docs changes,
    then invoke that shared selector. The plan/docs path runs only the returned subset through the
    existing retry wrapper. The source path retains W1-T2904's tier behavior. The required slow job
    repeats the cheap local classification so it remains parallel; it records an explicit
    duplicate-suppression summary only when the exact plan/docs candidate matrix was established.
    Any ambiguity takes the source path and runs both tiers. Keep `ci-required` and `ci-gate`
    topology and names stable.
  acceptance:
    - claim: "all four plan/docs matrix members receive a non-empty duration-balanced subset rather than assigning the complete set to shard one"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "the normalized union of the four subsets exactly equals the conservative plan-reading candidate set with no duplicate or omitted suite"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "recorded durations drive longest-processing-time assignment with deterministic path tie-breaking"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "source PRs retain W1-T2904's fast-matrix and required-slow-job behavior"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "classification, enumeration, candidate validation, or manifest failure selects the full source fallback and can never yield an empty successful test run"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "the required slow job suppresses duplicate plan/docs execution only after the exact candidate matrix is established and still registers in every workflow path"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
    - claim: "each matrix member reports candidate count, assigned count, predicted duration, and fallback decision"
      proof: "grep: plan-reading shard summary in .github/workflows/ci.yml"
    - claim: "the current repository integration enumerates 257 plan-reading candidates and assigns a non-empty subset to each of four shards"
      proof: "unit test: test/plan-reading-fast-lane-sharding.test.ts"
  falsifier: |
    Remove the candidate-set shard selector and three current-main matrix members must again receive
    no plan-reading tests. Drop or duplicate one fixture candidate and the union invariant must fail.
    Corrupt or omit its duration record and the workflow decision must become the full W1-T2904
    source fallback, not a partial or empty green. After deployment, compare a representative
    plan-only PR's slowest required check with #4657's 590-second `ci-shard (1/4)` observation; if
    the critical path does not improve, keep the coverage-preserving implementation but file the
    measured remaining bottleneck rather than claiming success.
  note: |
    ID PROVENANCE: `rmd next-task-id --reserve` reported RESERVED W1-T3191 and created
    `refs/rmd-id/W1-T3191` after one attempt.

    One concern only: distribute the existing plan-reading lane across already-paid CI shards after
    W1-T2904 lands. Narrowing the conservative suite set and changing runner capacity are outside
    this shard.
