  note: |
    risk:high, band_meaning: blast-radius -- the span is one module and one suite, but this
    changes the admission rule of the gate every worker runs before pushing, so a wrong
    relaxation is invisible until something ships past it. The existing suite
    (test/fast-gate-admits-the-census-class.test.ts) is W1-T2478's and stays its own; the new
    behaviour gets its own file so the measurement above is pinned as a falsifier.
