- id: W1-T2545
  title: "THE FAST GATE'S CENSUS BOUND IS BELOW ITS OWN MEASURED COST, SO THE HABITUAL GATE IS RED ON MAIN AND THE BOUND WILL EJECT EVERY ENTRY IT ADMITTED — a census suite's cost grows with the population it walks, and a breach REFUSES the step rather than warning, silently restoring the blindness W1-T2478 was built to remove"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 24.00
  rationale: |
    (1) MEASURED, ON MAIN, NOT ON A BRANCH. `rmd preflight --fast` at origin/main 05dcb050:

        negative-reachability-census: BOUND EXCEEDED -- took 2509ms, over the fast gate's
        2000ms PRIMARY CONTROL bound (own result: would have PASSed)
        ### rmd preflight: FAIL -- see the named step(s) above; do not push until every step passes

    The gate a worker is told to run before its FIRST push is FAILING on main, for a reason no
    change caused. Repeated timings in one container: negative-reachability 2386/2461/2524/2615ms,
    catch-erasure 2344ms, bound-kind 1128ms, no-shallowing 960ms. TWO of the four entries are over.

    (2) AND IT IS ALREADY REDDENING CI. `test/fast-gate-admits-the-census-class.test.ts` asserts
    every census entry measures under the bound on THIS head, so the breach is a test failure, not
    just a local annoyance. Measured on GitHub runners: 2268ms (#3423) and 2250ms (#3421) against
    the 2000ms bound. main's own `ci` passed at the same corpus, which means the distribution
    STRADDLES the bound -- a coin flip per run, not a property of any diff. Four PRs were red on it
    in one evening.

    (3) THE STRUCTURAL DEFECT, WHICH IS NOT "THE NUMBER IS TOO SMALL". A census entry qualifies for
    the fast gate iff it walks the tracked `src/` population and asserts over EVERY file it walks.
    Its cost is therefore a MONOTONIC FUNCTION OF THE CORPUS, and the corpus only grows. A fixed
    wall-clock ceiling against a monotonically growing cost is a gate designed to eject its own
    entries over time. Worse, ejection is SILENT in the direction that matters: `runPreflightFast`
    refuses the step, so the fast gate stops running a census suite that CI still enforces --
    restoring exactly the blindness W1-T2478 existed to close (its own rationale: "the fast gate
    could not see the one suite built to catch exactly that shape", #3304).

    (4) WHY THIS IS THE REPO'S NAMED RECURRING DEFECT. CLAUDE.md: "a bound that fires on a HEALTHY
    condition is this repo's recurring defect -- before tuning the number, check the population it
    is meant to separate has ever been observed." The refusal message itself says
    `own result: would have PASSed`. The population this bound is meant to separate -- a census
    entry that is genuinely too expensive for a habitual gate -- has never been observed; every
    breach so far is a healthy suite that simply got bigger. Prior instances: ci-gate's wait cap
    (W1-T312), the deploy ceiling (W1-T380), the check-wait bound (W1-T382).

    (5) OUT OF SCOPE, NAMED. (a) Making any census suite faster -- a real option, but a separate
    task per suite, and it does not remove the ratchet-vs-growth collision. (b) Which suites
    qualify as census entries (W1-T2478's predicate) is untouched. (c) Telling a worker which
    census suites its change joins is W1-T2523, already filed. (d) The fast gate's total budget.
  acceptance:
    - claim: "a census entry that runs over its bound but passes is reported and still counted as run, never silently refused"
      proof: "unit test: test/the-census-bound-ejects-the-suites-it-admitted.test.ts"
    - claim: "the bound is derived from the measured population rather than a constant a growing corpus outgrows"
      proof: "unit test: test/the-census-bound-ejects-the-suites-it-admitted.test.ts"
    - claim: "an entry whose own command FAILS is still a hard failure, so the cost relaxation never weakens the gate"
      proof: "unit test: test/the-census-bound-ejects-the-suites-it-admitted.test.ts"
    - claim: "a genuinely runaway entry is still separated from a merely-grown one, so the bound retains a population to refuse"
      proof: "unit test: test/the-census-bound-ejects-the-suites-it-admitted.test.ts"
    - claim: "the fast gate passes on a tree whose census entries all pass, which it does not today"
      proof: "unit test: test/the-census-bound-ejects-the-suites-it-admitted.test.ts"
  risk: high
  band_meaning: blast-radius
  origin: incident
  plan_refs: ["W1-T2478", "W1-T2523", "W1-T312", "W1-T380", "W1-T382"]
