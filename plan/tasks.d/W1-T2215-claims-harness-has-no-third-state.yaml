  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/claims-harness-third-state.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS. The change decides what a REQUIRED gate says when it fails, and
    design (v) deliberately ADDS reds on a currently-blind path — a mistake here either accuses the
    plan of lying when it did not, or keeps a gate silent that should fire.

    THE COUNT IN RATIONALE (3)/(4) WAS MEASURED, AND ITS METHOD IS RECORDED SO IT CAN BE RE-TAKEN.
    A whole-harness perturbation is NOT the instrument: pointing the worktree's `node_modules` at an
    empty directory kills `claims-check.mjs` itself (it imports `yaml`) before any claim runs, so it
    discriminates nothing. The per-shape probes are what settle it — `grep` returning 2 on a missing
    file, `! grep` turning that 2 into 0, `test` having no third state, and `node --test` returning 1
    for an unresolvable loader.

