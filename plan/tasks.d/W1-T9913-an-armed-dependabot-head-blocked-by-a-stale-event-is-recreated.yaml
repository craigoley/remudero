  design: |
    No LLM and no new fixed bound. Each step is once per head, and "act on the second sighting" is the W1-T9586
    pass-one-records, pass-two-acts precedent.
    1. PURE VERDICT in src/lib/dep-review.ts: `dependabotStaleEventVerdict(input)`. Its input is structural:
       mergeStateStatus, autoMergeArmed, whether remudero-review is SUCCESS at the head, and the names of required
       checks that carry a superseded red (from sweep's `classifyRollupSupersession` over the RAW rollup: a FAILURE whose
       newest same-name run passed). It returns `{ kind: "stale-event", checks }` only when the head is armed and
       BLOCKED, remudero-review is posted, and at least one superseded red remains. Otherwise it returns `{ kind: "none" }`.
    2. THE EFFECT, `reconcileDependabotStaleEvent` (src/lib/dep-review.ts), on the hold-state file the refresh and
       own-red records already use:
       a. first sighting at a head: record `staleEvent: { headSha, firstSeenMs }`, ledger `dep-review.stale_event.observed`;
       b. second sighting at the same head: write-ahead a `refreshes` record (command `@dependabot recreate`, cause
          `stale-event`, delivered false), comment it, mark it delivered, and ledger `dep-review.stale_event.recreate_requested`
          with pr_number, head_sha and the stale checks. A thrown comment ledgers `dep-review.stale_event.failed` and is
          retried next pass, because the record is undelivered;
       c. when a DELIVERED stale-event recreate already exists for an EARLIER head of this PR, do not recreate again.
          Escalate once per head through the existing `buildDepReviewArmUnreachableEscalation` and `escalate()` (its
          (taskId, PR, headSha, cause) dedup bounds it), and ledger `dep-review.stale_event.escalated`.
       Own-red's `survived-refresh` basis ignores `stale-event` records: a fresh event is not a base-red refresh.
    3. WIRING in `depReviewCommand` (src/run-task.ts):
       - add `mergeStateStatus,autoMergeRequest` to the `gh pr view --json` fields;
       - inside `if (result.decision === "arm")`, before the guarded post, compute the verdict from the raw
         `view.statusCheckRollup` and the selected checks;
       - on `stale-event`, run step 2, print the outcome and return 1, posting and arming nothing.
       The `DepReviewPrMutations.comment` seam carries the command, so tests stay offline.
    4. THE SWEEP, in src/lib/sweep.ts, through a small exported pure helper `depReviewDedupStandsAside(pr)`: the
       terminal dep-review dedup does not apply while `pr.autoMergeArmed === true && pr.mergeableState === "blocked"`.
       The lane runs again at that head and sees step 1. `depReviewed` stays `pr@head`-keyed, so the recreated head
       re-earns its review, gets W1-T9828's retitle on its first pass, and re-arms through the ordinary verdict.
    5. Unchanged: ci-gate's REQUIRED/ADVISORY lists, pr-title-lint.yml, commitlint.config.mjs, `decideDepReview`,
       W1-T8620's armed-idle path for fleet PRs, and the hold, refresh, own-red and refused-path effects.
    6. Tests. Pure tests go in the new file, which must not import src/run-task.ts (the-affected-suite-reach-ratchet
       holds direct importers flat). Command-level tests go in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts.
       The proofs below name the `test(` titles verbatim.
