      passing runs' suites (105032690199, 105032687419), and GitHub kept counting the stale FAILURE. A plain re-run
      replays the original event payload. The sweep's dep-review dedup then stood down on every pass: "dependency
      review already reached a TERMINAL outcome at this head".
    - `@dependabot rebase` at 16:38Z produced head 676bed09 at about 16:44Z, and dependabot[bot] renamed the title back
      to its 162-character original at 16:44:30Z (issues/11968/events). Read at 18:10Z: armed, BLOCKED, commitlint
      FAILURE (run 38934326485, started 16:44:39Z), ci-gate FAILURE (run 38934327039, ci.yml, 17:06:23Z). So a refresh
      brings Dependabot's over-long title back, and W1-T9828 must retitle the new head before the verdict.
    - WHY NOTHING ACTS TODAY. In src/lib/sweep.ts, `runSweep`'s `case "dep-review"` sets
      `alreadyDone = prior.depReviewed.has(pr@head)`. `priorActionsFromLedger` adds every non-hold dep-review outcome
