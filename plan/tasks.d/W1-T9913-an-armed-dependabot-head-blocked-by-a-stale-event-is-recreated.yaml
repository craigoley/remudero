      DISPOSITION_RULES (`when: pr.isDependabot === true`) outranks `mergeable`, so W1-T8620's stale-check re-run
      (`actOnMergeRefusal`, armed-idle only) never reaches a Dependabot PR. W1-T9584's `reconcileDependabotRefresh`
      acts only on a `hold` whose red is main's. W1-T9689/W1-T9798 select the latest attempt, so the lane reads the
      head green, which is correct for the verdict but blind to GitHub's block.
    - A NEW HEAD ALREADY RE-EARNS: depReviewed is keyed `pr@head` (W1-T514), so a recreated head is reviewed again.
      This task pins that with a test rather than changing it.
    - SWEEP: plan/tasks.d on origin/main for dep-review/Dependabot shards naming terminal dedup, recreate, stale or
      fresh events (W1-T1110, W1-T2427, W1-T3244, W1-T3707, W1-T9584, W1-T9797, W1-T9818, W1-T9828). None covers an
