    - claim: "the dep-review command posts no review and arms nothing on a stale-event block, and comments @dependabot recreate through its mutation seam"
      proof: 'grep: test("W1-T9913: the dep-review command recreates an armed head blocked by a stale event instead of re-posting" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
  falsifier: |
    At origin/main, `dependabotStaleEventVerdict`, `reconcileDependabotStaleEvent` and `depReviewDedupStandsAside` do not
    exist, so the new file fails to import. On the #11968-shaped fixture (armed, BLOCKED, remudero-review SUCCESS,
