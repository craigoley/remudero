  note: "verify:auto — every claim is a predicate over an injected projection plus a ledger line, assertable
    with no operator present and no live GitHub.
    risk:high — it gates DISPATCH, and by Rule 19's count it spans run-task, run-result, retro and the MAST
    mapping. A guard wired too broadly refuses legitimate work; wired not at all leaves the by-id kick
    paying full price for a determined failure. The --rerun escape hatch is what bounds the downside.
    budget_usd 60 — the projection, the resolver and the refusal precedent (daemon.ts's kick loop) all
    already exist; the real work is the verdict's registry wiring and the regression lock.
    NO depends_on: W1-T260 (the daemon-side sibling guard) is already shipped, and nothing else blocks this.
    FILE OVERLAP with W1-T316 and W1-T317, which also write src/run-task.ts — a dispatch-overlap concern for
    the scheduler, not a dependency: all three touch disjoint regions of the file.
    THE FALSIFIER, if a reviewer wants to check the premise cheaply: assertRunnable (src/lib/plan.ts) has
    exactly three refusals — blocked, verify:human, unmerged dependencies — and none of them reads the
    target task's own merged state, while daemon.ts's console-kick loop refuses precisely that case."
