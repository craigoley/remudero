  title: "THE WORKER GIT-CREDENTIAL BOUNDARY IS TEST-ONLY — W1-T2699 built a per-request scoped-token socket and worktree helper, but no daemon starts it or supplies its handle to a production spawn, so every fix worker still inherits a fixed GH_TOKEN"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 48.00
  files: [src/lib/secret-boundary.ts, src/lib/worker.ts, src/run-task.ts, test/daemon-worker-git-credential-boundary.test.ts, test/secret-boundary.test.ts]
  origin: "operator-session#worker-git-push-reliability-2026-09-12"
  plan_refs: ["W1-T62", "W1-T94", "W1-T1024", "W1-T2522", "W1-T2554", "W1-T2699", "W1-T2800"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at origin/main 51ba5926d6ad72ff3b38bf945ae03101452e4981 on 2026-09-12. W1-T2699
    added `startCredentialHelperSocket` (src/lib/secret-boundary.ts:295) and the opt-in
    `SpawnWorkerArgs.secretBoundary` / `wireCredentialHelperSocket` path (src/lib/worker.ts:968,
    :1715, :2670). The only call sites for the socket starter are its unit tests; `rg` finds no
    runtime caller in src/. Likewise, no production spawn passes `secretBoundary`. The helpers
    therefore exist but are dark. The live daemon ledger's retained segment contains zero
    `boundary.request` rows, consistent with that source result; the source call-site result, not
    the retained-row zero, is the deciding evidence.

    The daemon correctly refreshes its own App credential before its first board read
    (src/run-task.ts:26113-26123, W1-T2554), but github-app.ts:12 states the remaining limit:
    a worker copies GH_TOKEN at spawn and that copy cannot rotate. This is not just theoretical.
    The first #5283 fixture-repair worker completed its scoped changes but `git push origin HEAD`
    failed with `Invalid username or token`; the daemon's transcript records that direct failure.
    A later retry reached a GitHub-connector fallback and updated the PR, so that incident alone
    does NOT prove token expiry. It does prove the current normal git push has an availability
    hole and that fallback success is not a substitute for reliable worker transport.

    W1-T2522 carried the worker's own git/gh failure evidence into the ledger; it deliberately
    did not alter the credential path. W1-T2699 built the narrower mechanism but its acceptance
    only proved worker.ts's opt-in code, not a daemon owner. Neither task wires the production
    path this task owns.

    The linter reports W1-T62 and W1-T94 because both historic records name worker.ts and
    run-task.ts. They are not duplicate work: W1-T62 is PR-attribution parsing and ownership
    validation, while W1-T94 is fix-rung failure-mode selection and prompt input. This task leaves
    both semantics unchanged and owns only daemon lifetime plus Git credential transport.
  design: |
    Wire only the Git credential half of the existing boundary into daemon-dispatched workers.
    Do not activate or redesign the model-token proxy in this task. After the daemon's existing
    first App-token readiness barrier has settled, start one daemon-lifetime credential-helper
    socket under the daemon state root, owner-readable/writable only. Its mint callback must use
    `mintScopedToken` for the repository requested by git; it must request no broader credential
    when `credential.useHttpPath` is absent or malformed. Reuse the existing value-free
    `boundary.request` ledger rows and preserve their no-secret contract.

    Thread the socket handle through the real daemon construction to every daemon-dispatched
    worker path, including ordinary task runs and sweep `dispatchFix` workers. The worker must
    install the existing per-worktree helper so Git asks for the owner/repo path and the socket
    supplies a fresh scoped token at request time. It must not use a process-global mutable
    handle, a token file, an environment token copied into a worker, or a second credential
    helper protocol. The direct CLI and an App-unconfigured host remain byte-for-byte on their
    current ambient-credential behaviour; the new boundary is daemon/App-gated.

    Decouple the Git-only handle from the model boundary's required sentinel fields. A socket-only
    handle must configure Git without stripping or replacing model credentials; a model-boundary
    handle retains its current behavior. Close the socket and remove its path on normal daemon
    shutdown; a stale path from an interrupted process is removed only by the existing start
    routine before its new bind. Do not change git-push fallback, worker retries, App refresh
    cadence, GitHub permissions, model/provider routing, or any review/merge admission rule.
  acceptance:
    - claim: "an App-configured daemon starts one owner-only credential socket only after its first App-token readiness barrier settles"
      proof: "unit test: daemon credential socket starts after App readiness"
    - claim: "a daemon-dispatched ordinary task worker and a sweep dispatchFix worker both receive the same socket path and install the existing per-worktree helper"
      proof: "unit test: daemon worker git credential boundary wiring"
    - claim: "a Git credential request for owner/repo receives a newly minted scoped token while the worker environment contains no new token value or credential file"
      proof: "unit test: daemon worker git credential boundary request"
    - claim: "an unconfigured daemon and direct rmd run-task keep their ambient-credential behavior and create no socket"
      proof: "unit test: daemon worker git credential boundary unconfigured control"
    - claim: "a socket-only handle leaves the model credential environment unchanged, while the existing model-boundary test remains green"
      proof: "unit test: secret-boundary Git-only handle"
    - claim: "a missing owner/repo path, a mint refusal, or a helper-wiring failure is explicit and never broadens credentials or reports a successful push"
      proof: "unit test: daemon worker git credential boundary failure controls"
    - claim: "the socket closes and its path is absent after normal daemon shutdown"
      proof: "unit test: daemon credential socket closes on shutdown"
  falsifier: |
    At filing, `rg 'startCredentialHelperSocket\\(' src` and `rg 'secretBoundary:' src` produce
    declarations but no production caller; a live daemon worker worktree also has the ambient
    GH_TOKEN credential helper rather than the socket helper. If a production daemon call site
    already starts the socket, threads it into both runTask and sweep dispatchFix, and a fresh
    worker worktree is configured with that socket, close this task without implementation.

    Mutation: remove the daemon-to-spawn handle threading and require the ordinary-task and
    sweep-fix assertions to fail. Remove `credential.useHttpPath` and require the scoped-request
    assertion to fail rather than mint an installation-wide token. Replace the socket mode with a
    world-writable mode and require the owner-only assertion to fail.
  note: |
    Reservation W1-T3456 was atomically held by the fleet allocator on origin before this filing.
