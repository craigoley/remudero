  rationale: |
    OBSERVED 2026-11-12: at 15:22:39Z and again at 15:26:29Z an agent session ran `bin/rmd --repo-root <root> pause` to READ the pause state. Each run paused instance 'core'. The ledger shows the fleet.pause rows. Nobody saw the hold for some minutes, and core spawned nothing in that time. A verb whose bare form stops the fleet for two hours is a trap for any caller that guesses the read form.
    READ at origin/main 04d0e48d6.
    - src/run-task.ts:34192 `pauseCommand`. It has no read path. :34195 reads `--reason` with `flagValue`, so a missing reason is `undefined` and nothing refuses it. Without --fleet it resolves the target (:34224, `pauseTargetOrRefuse`, which falls back to the instance whose registry state_dir is config.root) and calls `requestPause(target.root, reason, ...)` at :34228. It appends a fleet.pause row with `reason: reason ?? null` (:34229 to :34242) and prints "is PAUSED (drain-and-hold)" (:34244).
    - pauseCommand never calls `unknownArgError`, unlike deploy (:28972) and release (:41717). So `rmd pause --status` or any other guessed flag also pauses.
    - src/lib/fleet-control.ts:163 `requestPause` calls `resolvePauseExpiry` (:129). With no --until it uses `PAUSE_DEFAULT_TTL_MS[classifyPauseReason(reason)]` (:111). A missing reason is class `other`, which is 2 hours (:115).
    - The --fleet branch (:34196 to :34221) has the same shape: no reason is needed, and it pushes refs/rmd-pause/hold for every instance on every host.
    - The read helpers already exist: `isPaused` (fleet-control.ts:208), `pauseDetail` (:244) and `pauseActor` (:239). The daemon and the panel use them (src/cli/commands/daemon.ts:1600, src/lib/panel-actions.ts:315). No CLI verb prints them.
    - Registry help: src/run-task.ts:42579 to :42584 gives the syntax `rmd pause [--instance <name>] [--reason <text>]`, so the reason reads as optional.
    - Overlap: W1-T10913 (queued) also edits src/run-task.ts and docs/cli-reference.md, for the field-trials registry text. This task changes only the pause entry and pause handler, so the two edits sit in different parts of those files.
    - `--reason` is the existing flag name, also on stop, deploy and release. release already refuses without it (:41724). Keep that name.
  design: |
    1. In `pauseCommand`, check arguments first with `unknownArgError("pause", rest, ["--instance", "--reason"], ["--fleet", "--status"])` or the shape that helper takes. An unknown flag returns 2.
    2. Read mode: when `rest` is empty or has --status, resolve the target as today (a target refusal still exits 2) and print the state: for the instance, `isPaused`, `pauseDetail`, `pauseActor` and the flag's expires_at; for the fleet-wide hold, the state the status board already reads for refs/rmd-pause/hold. Write no flag, no ledger row and no ref. Exit 0. --status wins over --reason.
    3. Write mode needs a non-empty --reason. Without it, `--instance <name>` or `--fleet` refuses: `### rmd pause — REFUSED: a hold needs --reason <text>; nothing was changed.` plus the usage. Exit 2.
    4. Keep the instance and fleet write paths, ledger rows and messages as today. The row's reason is now always the given text.
    5. Update the registry syntax and detail to `rmd pause [--instance <name>] [--status] | rmd pause [--instance <name>] --reason <text> | rmd pause --fleet --reason <text>` and say that a bare `rmd pause` only reads. Regenerate or edit docs/cli-reference.md, and update docs/control-surface.md and docs/operator-guide.md to match.
    6. Add --reason to the existing tests that pause without one (a-pause-holds-only-the-instance-it-targets, a-fleet-pause-records-who-really-set-it). Keep their refusal cases.
    7. Amendment (build of W1-T12457): three more tests run a write-mode `rmd pause` with no reason and expect a hold.
       test/w1-t143-diff-coverage.test.ts calls main() with `pause` and `pause --fleet`; test/shadow-instance-safety.test.ts
       spawns `pause` against a selected registry and expects a PAUSE file; test/the-sre-lane-runs-on-the-primary-instance.test.ts
       runs `pause` and expects its selected-registry receipt. Each now passes --reason, so it still drives the write path.
    INVARIANT reasoned-hold-unchanged: a pause given a non-empty --reason, for one instance or with --fleet, writes the same
    PAUSE flag, fleet.pause ledger row, shared ref and message as before, and the row and flag carry that reason.
    NOT IN SCOPE: the TTL classes, `rmd resume`, the panel's pause action (src/lib/panel-actions.ts), deploy/recycle-container.sh's own PAUSE write.
  falsifier: |
    Restore the write on a bare `rmd pause` and criteria 1 and 2 must fail (a PAUSE file appears). Let --status fall through to the write path and criterion 3 must fail. Drop the reason check and criterion 4 must fail. Drop `unknownArgError` and criterion 6 must fail. Restore and require all seven to pass.
