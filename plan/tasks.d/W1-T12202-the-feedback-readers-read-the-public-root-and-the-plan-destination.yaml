  rationale: |
    OBSERVED 2026-11-10: no build reads a feedback file, but about 40 source files read feedback through a few loaders.
    - Loaders: `listFeedback`, `readFeedbackEntry` and `readLandedFeedbackEntry` in src/lib/feedback.ts.
    - Auto-triage: `refreshFeedbackFromMain` and `newFeedbackIdsOldestFirst` in src/lib/auto-triage.ts.
    - Other readers go through the loaders: the panel, serve, the docket, the backlog gardener and the issues intake.
    - A reader must see a feedback file in the ops repository before any writer puts one there. So this task comes before the writer task.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. The readers read both roots while the file names a repository, also after `feedback` is removed from the kinds, because files that went to the ops repository stay there.
  design: |
    Change the loaders, not their 40 callers. Each loader takes the second root from `planDestinationRepository`.
    List every caller that reads `plan/feedback` without a loader, and change it or name it in the pull request.
    The readers run on the host and in the console, which are private surfaces. No reader in this task writes to a public pull request.
    NOT IN SCOPE: the writers of feedback files and the triage command.
  falsifier: |
    Read one root and criteria 1 and 3 must fail. Let the destination copy win without a message and criterion 2 must fail. Return an empty list for an unreadable checkout and criterion 4 must fail. Add a git call with no host file and criterion 5 must fail. Restore and require all six to pass.
