- id: W1-T533
  title: "the retro's PR body is true when written and false when read — the Architect opens the PR after editing MASTER-PLAN.md, then the harness regenerates two more files into that same PR, so a one-file claim the worker could not have got right fails bodyContradictsDiff every cycle"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60
  risk: high
  rationale: "MEASURED at fa6e8d7. FOUR INSTANCES, all the identical three-path shape
    (MASTER-PLAN.md, docs/ORIENTATION.md, plan/plan-index.json), re-derived from main by
    `git show --stat`: #974 (merged PRE-GATE), #1685 (refused, later repaired and merged),
    #1943 and #1944 — the last two filed 23 MINUTES APART with a BYTE-IDENTICAL failure
    message, `body contradicts its own diff: claimed \"exactly one file\", actual changed
    files: MASTER-PLAN.md, docs/ORIENTATION.md`.
    THE ORDERING IS THE DEFECT, AND IT INVERTS THE OBVIOUS FIX. `retroCommand`
    (src/run-task.ts) spawns the Architect worker, which edits MASTER-PLAN.md, pushes, and
    OPENS THE PR — writing its body. AT THAT INSTANT THE CLAIM IS TRUE: the diff really is
    one file. Only AFTER the worker returns does the harness call `regenerateOrientation`
    and `regeneratePlanIndexAndCommit` and push those commits into the PR the worker already
    opened. run-task.ts says so in its own words at that call site: 'ORIENTATION.md/
    plan-index.json were regenerated AFTER the worker's own push'. So 'compute the changeset
    at render time' CANNOT fix it — the two extra files DO NOT EXIST in the diff when the
    body is written, and the author is not the party that made the claim false. The harness
    invalidates a true body by its own subsequent action, so the repair belongs where the
    widening happens.
    THE THREE-FILE CHANGESET IS CORRECT AND MUST NOT BE NARROWED. `docs/ORIENTATION.md`
    carries its own 'MAINTAINED BY rmd retro — regenerated <timestamp>' banner and
    `plan/plan-index.json` is a heading/line-number index that reds `plan-index:check`
    post-push if left stale (#287's exact failure). Both are HARNESS-OWNED and droppable only
    by shipping a stale index. ONLY THE COUNT SENTENCE WAS EVER WRONG.
    AND `isInPlanScope` IS NOT IMPLICATED. A session ran the predicate rather than asserting
    it: TRUE for all three paths, FALSE for src/run-task.ts as a control. 'plan-only' was
    always accurate; nothing about scope needs changing."
  design: |
    (i) a PURE reconciler in src/lib/plan-pr-emitter.ts — the module that already owns every
    plan-PR body primitive AND regeneratePlanIndexAndCommit, so the repair joins the module
    that owns the question. Takes the body and the paths the caller already computed; returns
    the corrected body, or nothing when the body already agrees. No git, no network, no I/O.
    (ii) IT REPAIRS THE TWO ARMS bodyContradictsDiff ACTUALLY KEYS ON, never prose in general
    — that function's own doc forbids guessing at natural language, and a checker that did
    would be worse than the gap. Arm (a): a count claim whose number disagrees with the real
    changeset or whose enumeration names a path the diff lacks. Arm (b): a `no <path>` denial
    for a path the diff DOES carry, which is what #1943 tripped by writing 'No
    docs/ORIENTATION.md' while carrying it.
    (iii) THE REPLACEMENT NEVER WRITES THE WORD 'exactly'. Arm (a) fires only on that literal,
    so a recomputed count would re-arm the tripwire the moment a later run changes the file
    count again. The canonical section ENUMERATES PATHS AND STATES NO COUNT — there is no
    number left to go stale. A hardcoded three would be the same defect wearing a new number.
    (iv) A TRUTHFUL DENIAL SURVIVES. `no src/` is TRUE for a retro and is the reader's
    assurance it carried no code; only a denial the diff refutes may be dropped.
    (v) THE CALL SITE SHIPS WITH IT, beside repairRetroAcceptanceBlock (src/run-task.ts) —
    same seam, same position, same best-effort contract that a retro never fails because a
    body repair failed. Shipping the predicate unwired would be the exact defect
    test/producer-completeness.test.ts caught on #1931 this week.
    (vi) FALSIFIER, BOTH DIRECTIONS: the PRE-CHANGE body is contradicted by the real diff and
    the reconciled one is not (a reconciler that changed nothing material fails this), AND a
    body that already agrees yields NO edit (one that rewrote every pass would pass the first
    and fail this — the false-positive containment).
    (vii) NOT IN SCOPE, each for a stated reason: `isInPlanScope`, which the predicate run
    above shows is correct; bodyContradictsDiff itself, which caught all four instances and is
    working; the Architect's retro prompt, because the author cannot know what the harness
    writes after it returns; and narrowing the three-file changeset, which would ship a stale
    plan-index.
  acceptance:
    - claim: "the reconciled body names every path the run actually wrote and no others"
      proof: "unit test: W1-T533: the reconciled body names every path the run wrote and no others"
    - claim: "the pre-change body is contradicted by the real diff and the reconciled one is not"
      proof: "unit test: W1-T533: the pre-change body is contradicted by the real diff and the reconciled one is not"
    - claim: "a run writing a different number of files is reconciled just as well, so a hardcoded three cannot pass"
      proof: "unit test: W1-T533: a run writing a different number of files is reconciled just as well"
    - claim: "a body that already agrees is left alone rather than rewritten every pass"
      proof: "unit test: W1-T533: a body that already agrees is left alone rather than rewritten"
