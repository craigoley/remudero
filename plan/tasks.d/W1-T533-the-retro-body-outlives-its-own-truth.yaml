    repository, so every criterion is decidable with no network and no spawn.
    risk:high IS SET UP FRONT and is Rule 19's SPAN, not blast radius: the files span three
    subsystems (plan-pr-emitter, run-task, retro-changeset-claim) because a pure predicate
    without its call site is an unwired mechanism — the defect a producer gate caught on #1931
    days ago — so the wiring is not separable from the fix.
    FILES DERIVED BY WORD-BOUNDED INVOCATION COUNT: plan-pr-emitter.ts already exports
    renderAcceptanceBlock/ensureJudgeableBody/bodyNeedsAcceptanceRepair AND
    regeneratePlanIndexAndCommit (src=5, test=10), so it owns both the body primitives and one
    of the two regenerations that cause this; run-task.ts holds repairRetroAcceptanceBlock
    (src=2, test=9), the proven post-PR body-edit seam this sits beside. THE TEST IS ITS OWN
    FILE rather than appended to test/plan-pr-emitter.test.ts, per the rule that a
    coverage-load-bearing test must not share a file that can crash at file level.
    PROOF NOTES: the four proofs are the NAME-FILTERED `unit test:` form, never a pure path,
    so each names the behaviour it proves rather than a file that would pass on any test in
    it. THESE RESOLVE TODAY rather than forward-referencing, because this shard is FILED AND
    BUILT IN THE SAME RUN — the zero-match rule exists to stop a guess at a symbol that may
    never exist, and there is nothing to guess at when the tests ship in the same diff.
    KNOWN RESIDUE, stated rather than left for a reader to find: loose prose such as 'edits
    MASTER-PLAN.md and nothing else' SURVIVES the reconcile. It trips neither arm, so the gate
    passes, and rewriting it would be the natural-language guessing bodyContradictsDiff's own
    doc forbids. The canonical enumeration sits directly below it.
