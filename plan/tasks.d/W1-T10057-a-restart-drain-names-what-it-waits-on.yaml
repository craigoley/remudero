  design: |
    MEASURE FIRST: what the drain awaits, its bounds and its admission rules are unchanged.
    1. sweep.ts: the review registry keeps, per review, the PR and its admission time; a read-only
       `restartDrainInventory()` returns each awaited review and detached action as {what: review | detached, kind,
       task_id, pr, phase, admitted_at_ms}.
    2. daemon.ts: daemon.freshness_drain.started and .completed carry `waited_on`, one entry per awaited item with
       admitted relative to the latch (before_latch | after_latch), and on .completed settled_after_ms or abandoned.
       The list is bounded to the items present (no cap is added; it is a handful per drain today).
    3. daemon.freshness_exit (and the memory exit's row) gains `phases_ms`: decision_to_latch, holdouts (latch to
       last lane settled), pre_exit_pass, drain, total, each measured on the daemon clock; an unmeasured phase is
       absent, never 0.
    4. No count, bound, threshold or env var is added. The follow-up (bound, overlap or adopt) is filed from a week
       of these rows; its constants are OPERATOR DECISIONS.
    5. TESTS in test/daemon/a-restart-drain-names-what-it-waits-on.test.ts, `test(` titles verbatim as in the proofs,
       driving the drain with fake reviews and detached actions on an injected clock.
