  note: |
    verify:auto — every arm is decidable in-process: `readDiskFreeBytes` takes an injected `statfs`,
    the daemon's clock and issue gateway are already injectable (`escalateCrashLoop` takes an
    `issues?: IssueGateway`), and no test needs a real filesystem at a real fill level.

    risk:high IS RULE 19's SPAN, NOT BLAST RADIUS. The change is additive and surfaces only — it
    gates nothing, deletes nothing and dispatches nothing — but it touches the daemon poll path, an
    escalation path and the ledger retention set across five source files, and a mis-sized dedup
    turns a signal into a wall of issues, which is the failure that mutes an alarm permanently.

    budget_usd 55 — the reading and the judgement are small and already written; the cost is the
    episode/re-arm falsifier in both directions plus the rotation-survival proof.

    WHY THIS IS NOT A RE-DECISION OF ITS OWN FEEDBACK'S OTHER TWO ASKS: both are already closed and
    are cited rather than re-derived — `scratchReap.enabled: true` (PR #1250) for the abandoned
    review clones, and `rmd ledger-grep`/`resolveLedgerUnion` (W1-T379, stream-never-materialise)
    for the 2.7 GB per-session union scratch files. This shard exists only for the third ask, which
    no task, policy row or decision in the corpus answers today.

    NO depends_on: `readDiskFreeBytes`, `judgeDiskHeadroom`, `startInFlightTicker`,
    `escalateCrashLoop` and the retained-step set are all on main.
