    READ at origin/main 70b15edf7 (symbols, not lines), src/run-task.ts `commitWorkerEdits`:
    - With `priorHeadSha` set (every fix round), the tree is built by `temporaryIndexTree(...)` in a private index, the
      commit is `commit-tree <tree> -p <priorHeadSha>` and the branch moves by `update-ref <roundRef> <sha>
      <priorHeadSha>` (W1-T4072, #9108, so a stale shared index never enters the tree).
    - Only `if (mergeHead !== undefined) { merge --quit; read-tree <sha> }` refreshes the worktree's own index. The
      non-merge path, the common one, leaves it at the prior head.
    WHY THIS IS NOT ANOTHER TASK: W1-T7998 (P1, filed 2026-10-11, claimed refs/rmd-dispatch/W1-T7998 at 18:16:37Z
    2026-10-17, unbuilt at filing) changes the RECOVERY decision for a dead dirty owner at the current head; it does
    not stop the commit making the owner dirty. W1-T4072 (merged) built the private-index commit and is kept. Swept
    origin/main plan/tasks.d for temporaryIndexTree, read-tree, stale index and commit-tree, and the 3 open PR heads
    (18:26Z): none names the worktree index after the commit.
  design: |
    1. In `commitWorkerEdits`, after `update-ref` succeeds on the non-merge path, set the worktree's own index to the
       new commit's tree, as the merge path already does (`read-tree <sha>`, index only; the working tree is not
       touched). Undeclared worker edits stay as unstaged or untracked changes, exactly as the worker left them.
    2. A refused `update-ref` (branch moved) leaves the index alone, as today.
    3. W1-T4072's guarantee is unchanged: the tree is still built from the private index on the prior head; the
       refresh happens only after the commit exists.
    4. TESTS in test/a-fix-commit-leaves-its-worktree-index-at-the-commit.test.ts, `test(` titles verbatim as in the
       proofs, over a temp repo built with the gitRepo() fixture (local identity set in the fixture): a round with
       priorHeadSha that adds one declared file and edits another leaves `git status --porcelain` empty for both; an
       undeclared edit beside them still reads as an unstaged change; a branch that moved under the round leaves the
       index as it was (control).
  acceptance:
