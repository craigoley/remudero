  note: |
    VERIFY IS HUMAN BECAUSE THE SCOPE OF A NORMATIVE DOCUMENT IS THE OPERATOR'S. A lane that widened
    the standard on its own would be re-scoping a document every later surface cites. The falsified
    premise is a measurement and belongs in the record; the answer is a ruling and does not.

    EVERY COUNT HERE IS A QUERY AND NOT A NUMBER TO CARRY. The 0-versus-84, the 106 call sites, the
    9 declarations and the 71 lines of headroom are all recorded with the command that produced
    them, because each moves with the tree. Re-run them; do not quote them forward.

    THE MEASUREMENT SURVIVED ITS OWN HAZARDS. The mawk trap fired live during this recon: a
    backslash-b form read 0 over a range where the POSIX form read 1. Every count here uses POSIX
    classes. The adversarial verification pass that was supposed to check these numbers died on a
    session limit, so the two load-bearing claims were re-derived by hand instead, each with its
    control, and that is why only those two carry a control in the text above.
