- id: W1-T2817
  title: "THE OPERATOR MESSAGE STANDARD EXCLUDES ITS LARGEST SURFACE ON A PREMISE THE CODE FALSIFIES — the doc puts process stdout out of scope because its lines are the forensic record every retro greps, and no code anywhere reads the content of an out.log while the identical query for the ledger returns 84 files"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: medium
  budget_usd: 10.00
  rationale: |
    **THE EXCLUSION AND ITS STATED GROUND.** docs/operator-message-standard.md is NORMATIVE. Its
    heading "Out of scope: the daemon's stdout" excludes that surface and gives a reason: the lines
    are "the forensic record that every retro greps", so restating any of it in the standard's terms
    "would invalidate the searches that depend on its current wording".

    **ZERO READERS AND A CONTROL OF EIGHTY-FOUR.** Measured on origin/main: no code in the repo
    reads the CONTENT of any out.log. The query
    `git grep -naE '(readFileSync|readFile|createReadStream|tail|zgrep|grep)[^ ]*out\.log' -- src/
    scripts/ test/ deploy/ .github/` returns 0, and the IDENTICAL query with `ledger` substituted
    for `out.log` returns 84 files — same tool, same flags, same corpus, so the zero is absence and
    not a blind read. The only 15 references to out.log anywhere are path construction, the rotation
    roster, and prose in comments. retro.ts contains no stdout read at all; its forensic union is
    `resolveLedgerUnion` (src/lib/ledger-grep.ts) over the LEDGER.

    **THE CODE STATES THIS HIERARCHY BACKWARDS FROM THE DOC.** src/lib/log-rotation.ts puts
    daemon.out.log on ROTATED_LOG_FILES — newsyslog, LOG_ROTATION_COUNT 5, size and age ceilings,
    compressed — while state/ledger.ndjson is NEVER_ROTATE_FILENAME, and generateNewsyslogConfig
    THROWS a LogRotationConfigError if the ledger ever appears in the rotation roster. Stdout is the
    channel this repo bounds and discards by design. The ledger is the one it refuses to lose. The
    doc's stated ground has the two exactly the wrong way round.

    **WHY THAT MATTERS RATHER THAN BEING A WORDING NIT.** The excluded surface is the largest
    operator-facing surface the repo has: 106 call sites across 5 modules, against 323 console.log
    calls in the same sweep. The standard governs the status board, the console rows, an escalation
    body, and now the narrative half of generated commit and PR text (W1-T2806, W1-T2807). It
    governs none of this. A NORMATIVE document excluding its biggest surface is a defensible
    position; excluding it on a reason its own repo falsifies is not, because nobody re-examines an
    exclusion that reads as already justified.

    **OPERATOR RULING, 2026-09-04 — THE EXCLUSION STAYS AND THE REASON IS CORRECTED.** Answer (a) of
    the two this shard parked. The surface does not come into scope; the stated ground does change,
    because it was false and an exclusion nobody re-examines is exactly what a false justification
    buys. The correction lands in docs/operator-message-standard.md and is not re-decided here.

    **TWO CORRECTIONS TO THIS SHARD'S OWN EVIDENCE, RECORDED RATHER THAN QUIETLY FIXED.** (i) The
    zero above is stated without a qualifier and should carry one: no PRODUCTION code reads an
    out.log's content, but FOUR test suites do. install-symlink-refusal and serve-service-boot each
    readFileSync a serve.out.log and assert on literals run-task.ts prints, and
    resolver-divergence-detector and serve slice run-task.ts's SOURCE TEXT by banner literal. The
    conclusion is unchanged and the argument is stronger for it: the wording IS load-bearing, just
    for tests rather than for retros, so rewording still costs something real. (ii) The query
    published above anchors the read verb adjacent to the path on one line, which misses a read
    whose path was assigned to a variable first. It found the right answer for production and is
    not a general instrument; do not copy it forward.

    **AND THE TEST THAT GUARDED THIS PASSAGE WAS CHECKING FOR TWO WORDS, NOT A REASON.**
    checkSurfacesInScopeAndStdoutExclusion's fourth requirement read
    /(forensic record|retro greps)/i under the label "gives a reason for the stdout exclusion". It
    therefore stayed GREEN through a correction that reversed the claim beneath it, because the
    corrected paragraph quotes the retired phrase. Measured, not inferred: the corrected doc passed
    the old requirement unchanged. The requirement now anchors on the code the reason cites, and a
    falsifier pins the case that used to pass.

  design: |
    **ONE HUNDRED AND SIX CALL SITES CARRY NO AUDIENCE.** There is no exported `say` to change.
    `say` is a per-lane LOCAL CLOSURE redeclared 7 times — 5 in src/run-task.ts, one each in
    src/lib/operator-sync.ts and src/lib/self-sync.ts — and threaded as a dep field through 9
    declarations. EVERY one of the 9 is `(msg: string) => void`. No channel, level or audience
    parameter exists at any of them. That, not the absence of a split, is the mechanical gap.

    **THE SPLIT ALREADY EXISTS AS A SIBLING SYMBOL.** Every lane declares
    `const log = (step, extra) => appendLedger(...)` immediately above its `const say = ...`, and
    buildSweepEffects passes both as adjacent deps fields. `log` is forensic, `say` is narration.
    A second, orthogonal distinction exists undeclared at the fd level: 7 sinks on stdout, 4 on
    stderr. So the concept is present twice already and neither is expressible at a call site.

    **THIS SHARD DOES NOT DECIDE THE SCOPE QUESTION.** It records a falsified premise and parks the
    ruling. Two answers are open and they are not equivalent:

    (a) THE EXCLUSION SURVIVES ON DIFFERENT GROUNDS — volume, and the fact that stdout is bounded
    and discarded, are honest reasons to leave it out. Then the doc's stated reason is corrected and
    the exclusion stands. Cheap, and it makes the standard's own reasoning true.

    (b) THE SURFACE COMES INTO SCOPE, because the reason for keeping it out was the only one given
    and it is false. Then a later filing does the work, and the sizing below is what it inherits.

    **WHAT A BUILD WOULD COST, SO (b) IS PRICED RATHER THAN GUESSED.** Threading a channel argument
    through run-task.ts's 98 call sites runs into 71 lines of source-size headroom — the baseline
    records 36500 and the file measures 36429 — so it forces a deliberate baseline raise, and
    evaluateSourceSizeRatchet writes a too-high value back DOWN, so pre-raising separately does not
    work. checkDocsAwareness names `^src/run-task\.ts$` in USER_VISIBLE_SURFACE_RE, so a docs/ file
    or a stated reason is mandatory. Two test suites slice run-task.ts's SOURCE TEXT by literal and
    break on a call-site rewrite even when output is byte-identical:
    test/resolver-divergence-detector.test.ts and test/serve.test.ts. Six more assert output
    literals. The additive shape — a third symbol beside the existing two — touches only what it
    reclassifies and costs none of that.

    **WHAT MUST NOT CHANGE.** (i) No operator message is reworded by this shard; it records and
    parks. (ii) The standard's prohibition on adding any readability, length or vocabulary score
    carries over unchanged to whatever answer is taken. (iii) The ledger stays the forensic record
    and NEVER_ROTATE_FILENAME stays as it is; nothing here proposes routing narration into it.
    (iv) The two source-text anchors above are not to be "fixed" by rewording the tests — they are
    evidence of coupling, and a build that trips them has learned something.
