      proof: "grep: THE SPLIT ALREADY EXISTS AS A SIBLING SYMBOL in plan/tasks.d/W1-T2817-stdout-exclusion-rests-on-a-false-premise.yaml"
    - claim: "the shard settles nothing itself and parks the scope ruling for the operator"
      proof: "grep: THIS SHARD DOES NOT DECIDE THE SCOPE QUESTION in plan/tasks.d/W1-T2817-stdout-exclusion-rests-on-a-false-premise.yaml"
