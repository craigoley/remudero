- id: W1-T9590
  title: "THE LEARNED SWEEP BOUND LEARNS ONLY FROM PASSES THAT DID WORK — W1-T9563 bounds the next full pass at 3x the p90 of the last 40 settled passes, so a run of near-instant passes (a GitHub quota outage, an empty board) shrinks the bound to seconds and healthy passes are abandoned until slow passes widen the sample again"
  repo: remudero
  depends_on: [W1-T9563]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern, which settled passes W1-T9563's learner may sample; high for span: the learner in daemon.ts, the work count the real sweep closure in run-task.ts returns, #11879's suite and one new test
  band_meaning: span
  origin: "operator session 2026-10-14: follow-up found while reviewing #11879 (W1-T9563); operator approved it 2026-10-14 (\"go with all recommended follow ups\"). Standing ruling: no hard thresholds or floors, so the fix is a mechanism"
  plan_refs: [W1-T9563, W1-T1044, W1-T2582, W1-T4002, W1-T9554, W1-T147]
  files:
    - src/lib/daemon.ts
    - src/run-task.ts
    - test/the-full-sweep-bound-is-learned-from-passes-that-completed.test.ts
    - test/a-sweep-bound-learns-only-from-passes-that-did-work.test.ts
