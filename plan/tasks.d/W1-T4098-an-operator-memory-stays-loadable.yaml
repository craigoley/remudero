      proof: 'grep: test("W1-T4098: a memory that repeats a doctrine rule is reported with the rule" in test/an-operator-memory-stays-loadable.test.ts'
    - claim: "fix never deletes a memory file"
      proof: 'grep: test("W1-T4098: fix never deletes a memory file" in test/an-operator-memory-stays-loadable.test.ts'
    - claim: "the CLI runs the lint"
      proof: 'grep: lintMemoryDir( in src/run-task.ts'
