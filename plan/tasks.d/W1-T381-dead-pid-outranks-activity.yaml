  note: "verify:auto — `WorktreeReapOpts` already injects `isPidAlive`, `newestActivity` and `now`,
    so both directions assert in-process against a temp dir with no real process and no clock skew.
    risk:high IS SET BY RULE 19's SPAN, NOT BY BLAST RADIUS, and the distinction is recorded so a
    later reader does not over-read it. The linter scores `files:` as two concerns (worker,
    worktree-reap-liveness) and offers raise-or-decompose; DECOMPOSING IS WRONG HERE — the change is
    one ordering constraint and the three-direction falsifier that proves it, and an ordering
    constraint cannot ship without the test showing it bites one way and holds the other two.
    THE ACTUAL BLAST RADIUS IS NARROW, by the fail-direction argument: this only ever WITHDRAWS a
    rescue the activity guard would have granted — it grants none, and it does not touch the
    `live-pid` keep above it. The population it newly reaps is exactly `lock present, pid dead`,
    i.e. runs that have already exited. What genuinely earns caution is that it deletes directories
    and the predecessor task here (W1-T378) exists precisely because a reaper destroyed live work —
    which is what falsifier directions 2 and 3 are for.
    budget_usd 40 — the edit is an ordering constraint of a few lines; the cost is the
    three-direction falsifier and reading the reap block carefully enough to move exactly one gate.
    WHY THIS IS NOT A W1-T378 REGRESSION: W1-T378 flipped the fail direction to KEEP and that was
    correct. This does not flip it back. It says only that a lock naming a dead process is stronger
    evidence than a file mtime, because an mtime records THAT a write happened and never WHO made
    it — which is exactly the ambiguity the observed incident turned on."
