- id: W1-T11101
  title: A new worktree's first typecheck starts warm from a buildinfo seeded off the operator checkout, so a cold tsc no longer opens every hand-build preflight
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # one script, one concern: seeding tsc's own incremental cache; tsc still validates every file
  origin: operator-session#preflight-throughput-2026-11-02
  plan_refs:
    - W1-T10739
    - W1-T10740
  files:
    - scripts/typecheck.mjs
    - test/ci/gates/a-new-worktree-typechecks-warm-from-a-seeded-buildinfo.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: A worktree with no buildinfo copies the seed checkout's buildinfo when the seed's tsconfig and TypeScript version match, then runs the same tsc with the same diagnostics and exit code, and records seeded true with the seed's path
      proof: "unit test: test/ci/gates/a-new-worktree-typechecks-warm-from-a-seeded-buildinfo.test.ts"
    - claim: A mismatched tsconfig, a different TypeScript version, an unreadable seed or an existing local buildinfo is never seeded over
      proof: "grep: W1-T11101 criterion 2 in test/ci/gates/a-new-worktree-typechecks-warm-from-a-seeded-buildinfo.test.ts"
  rationale: |
    MEASURED 2026-11-02 over 12 author preflight receipts (progress.json under each worktree's coverage/rmd-author-*):
    - Wall time per run 45-90 min. census-precheck alone took 536-2,336 s, static-preflight 828-3,120 s, the affected subset 699-937 s.
    - The same census step took 536 s on 2026-10-30 and 2,336 s on 2026-11-02 at load average 34-47 on 8 cores: three author preflights and the fleet ran at once.
    - scripts/typecheck.mjs is incremental against a per-worktree buildinfo. A hand-build worktree is new by construction, so its first typecheck is always cold (TYPECHECK_COLD_PEAK_BYTES admission), inside a static-preflight that took 14-52 min today.
    - tsc's buildinfo records file versions and re-checks every changed file, so a seed from a nearby commit is a cache, never a source of truth.
    - W1-T10739 (a proof-grade dependency install in one command) and W1-T10740 (the run-task.ts selector) are the other two cold-start costs. They are filed and unbuilt; this task does not overlap them.
  design: |
    In typecheck.mjs, before tsc: if this checkout's buildinfo is absent and RMD_TYPECHECK_SEED (default: the operator checkout named by the existing host layout, when it differs from this checkout) has a buildinfo whose tsconfig.json bytes and typescript package version equal this checkout's, copy it in and log typecheck.seeded. Otherwise log why not. Never overwrite an existing buildinfo.
  note: |
    reservation hand-off: run-unfiled-1793629687846 -> run-unfiled-1793629687846
    Reserved with rmd next-task-id from the operator checkout (W1-T11098..W1-T11102 on run-unfiled-1793629687846). Operator ruling 2026-11-02: "go with all of your recommendations" on the preflight throughput plan.
