- id: W1-T11754
  title: "A REPLAYED FLEET BRANCH PROVES ITS INTENDED CHANGE AND ANCESTRY SURVIVED BEFORE IT IS FORCE-PUSHED — rebaseDirtyFleetBranchViaGit runs `git rebase origin/main` and then force-pushes the new HEAD with only a lease check, so a replay that silently drops a commit (already-upstream patch, emptied commit) or loses a path's change still publishes, and the PR's head no longer carries the change its task claims"
  repo: remudero
