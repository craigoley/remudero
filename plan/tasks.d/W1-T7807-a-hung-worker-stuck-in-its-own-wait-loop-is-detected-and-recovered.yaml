  design: |
    Operator rulings: no hard thresholds (the quiet bound is derived from observed data, with tiers, never a new
    fixed constant); lean into automation; an LLM judge decides the remedy, not a rule table.
    1. ADAPTIVE QUIET BOUND. Derive the bound per worker provider (the run's worker.assignment mount provider)
       from that provider's observed quiet-gap distribution: the length of each `worker.state quiet` episode
       that ended with the worker speaking again, read from the ledger (union, per the ledger rules), e.g. a
       high quantile of the recent episodes. Two histories must give two bounds. With no history for a provider,
       fall back to the policy `workerStall` row and record `bound_source: "no_history_fallback"`. Ledger the
       bound once per worker spawn (`worker.quiet_bound`, with sample count and source).
    2. INSPECT, THEN JUDGE. When a worker is quiet past its bound, read its process tree under the bound root
       pid. Classify the leaf: a POLL LOOP (a shell whose command carries a loop keyword with sleep, grep, test
       or similar) and what it awaits: a file whose content already shows a finished run (an exit marker such
       as `[exited with code N]`, or a runner summary) or a file/pid that has not changed across two reads (no
       progress); versus a process that is progressing (CPU time or output growing). Only a poll loop that is
       finished-but-waiting or making no progress goes to the judge; a progressing process is left alone and
       re-checked at the next bound.
    3. THE LLM JUDGE DECIDES, from the evidence (quiet time, bound and its source, leaf argv, awaited path and
       its tail, exit marker, the worker's last activity): `nudge` (tell the worker what the harness saw, where
       the SDK session accepts streamed input; otherwise this degrades to `wait` and says so), `kill_poll_child`
       (signal only the poll shell, never the worker, so the tool call returns and the worker resumes with its
       result), `end_round` (stop the worker and take the W1-T7697 checkpoint path so the work is pushed and
       resumable), or `wait`. A judge that cannot answer takes no action and records `judge_unavailable`; the
       W1-T943 escalation and the W1-T1045 clock bound remain the backstops, unchanged.
    4. LEDGER EVERY DECISION as `worker.quiet_judged` with the evidence above, the verdict, the reason, and what
       was done (pid signalled, checkpoint sha). This relaxes W1-T943 design note iv for the judged case only;
       the detector itself is unchanged.
    5. PREVENT THE SHAPE. Add one line to the implement worker's prompt contract (beside
       IMPLEMENT_REFUSAL_REPORT_CONTRACT, src/run-task.ts:271): a wait on a background test run waits on the
       runner's exit (the process, or the `[exited with code N]` marker), never on a reporter-specific line.
       A deny-floor rule for local wait loops is NOT in scope (hooks/ is a containment path); if the judge rows
       show the shape recurring, file it separately.
    Put the bound, the classifier and the rung in a new module src/lib/quiet-worker-watchdog.ts, exported as
    `runQuietWorkerWatchdog`, called from src/run-task.ts where the clock bound is attached, with injectable
    process-listing, kill, judge and clock seams. Tests (new file, `test(` titles verbatim as in the proofs below)
    replay 10-10: a fixture output file ending `tests 179 / pass 179 / fail 0` and `[exited with code 0]`, a leaf
    `sleep 15` under the `until grep -q "^ℹ duration_ms" ...` shell, the worker quiet past its bound.
