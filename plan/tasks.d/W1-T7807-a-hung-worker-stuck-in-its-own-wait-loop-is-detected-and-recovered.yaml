      - src/run-task.ts `findStalledWorkers` (:46809) / `runWorkerStallDetectorRung` (:46875, wired in
        buildSweepHook at :47220) append `worker.stalled` and escalate once a run is quiet past policy
        `workerStall` (plan/policy.yaml:114, a fixed 3600000 ms, `DEFAULT_WORKER_STALL_MS` :46778). By its own
        design note iv it NEVER acts on the run: no kill, no signal.
      - src/lib/worker.ts `createWorkerClockBoundWatchdog` (:3529) aborts the SDK stream with
        `WorkerAbandonedError` (:3504) once quiet passes policy `workerAbandon` (plan/policy.yaml:138, a fixed
