      - hooks/deny-floor.sh rule 6 (comment :252, predicate :260) refuses a loop + sleep + `gh` poll, and by
        design ALLOWS a loop that waits on a local file (W1-T1066 (4)), which is exactly this loop's shape.
    So a worker blocked in a local wait that can never end is invisible for 60 min, escalated to a person at
    60 min, and killed outright at 2 h. Nothing reads what the worker is actually waiting on.
