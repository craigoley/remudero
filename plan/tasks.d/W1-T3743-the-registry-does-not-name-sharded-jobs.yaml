- id: W1-T3743
  title: "THE PARITY REGISTRY DOES NOT NAME THE SHARDED JOBS IT MEANS TO COVER — `ci-shard` and `coverage-shard` run as `ci-shard (1/4)` and are entered under their unsharded names, so a locality lookup reads a live required job as unregistered"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  rationale: |
    SURFACED BY W1-T3740'S OWN FIRST RUN, 2026-09-17, against the real registry:

      refusal-locality: 7 of 14 refusal(s) were already catchable at home
        …
        unknown-job: 2 — ci-shard, …
        NOTE: an unknown job is registry DRIFT, not a backlog entry

    `ci-shard` is a live, required CI job. It appearing as `unknown-job` is the drift signal that
    classification exists to raise, on its very first use.

    (1) THE NAMES DIFFER BY THE MATRIX SUFFIX. GitHub reports a matrix job as `ci-shard (1/4)`,
        `coverage-shard (3/4)`; the registry and `ci-parity:drift` reason about `ci-shard` and
        `coverage-shard`. Both spellings are correct for their own purpose and neither is wrong —
        they simply never have to agree today, because nothing joined a REFUSAL to the registry
        until W1-T3740.

    (2) SO THE SCOREBOARD UNDERSTATES ITSELF, IN THE DIRECTION THAT MATTERS. A sharded refusal
        lands in `unknown-job` instead of the class it belongs to, and the already-catchable count
        — the one number the retro is for — reads lower than the truth. A metric whose first
        failure mode is flattering itself is worse than none.

    (3) THIS IS NOT A REGISTRY GAP. `ci-parity:drift` reports every pull-request job has an entry,
        and it is right: the ENTRIES exist. What is missing is that a refusal's observed job name
        and a registry key are not the same alphabet, and nothing said so.
  design: |
    (i) NORMALISE AT THE LOOKUP, NOT IN THE REGISTRY. The registry's unsharded keys are correct for
        every other reader, and rewriting them to carry matrix suffixes would break
        `ci-parity:drift`'s own comparison and invent one entry per shard. The join strips the
        suffix; the tables are untouched.

    (ii) THE STRIP IS EXACT AND NARROW: a trailing ` (<n>/<m>)`, nothing else. A general "take the
         first word" rule is what W1-T3740's own falsifier already caught — `coverage-shard` and
         `coverage-ratchet` are DIFFERENT jobs and a prefix match calls the unregistered one
         mirrored.

    (iii) A NAME THAT NORMALISES TO NOTHING REGISTERED IS STILL `unknown-job`. This narrows what
          counts as drift; it must not abolish it, or the signal W1-T3740 exists to raise is gone.

    NOT IN SCOPE: whether the sharded jobs SHOULD be mirrored locally — that is a wall-clock
    decision on W1-T3737's measurements, and this task only makes the question askable.
  acceptance:
    - claim: "a refusal reported with a matrix suffix is classified as the job the registry names"
      proof: "unit test: a matrix-suffixed job resolves to its registry entry"
    - claim: "a job whose name merely shares a prefix with a registered one is still unknown, so the strip is not a fuzzy match"
      proof: "unit test: a shared prefix is not a match after normalising"
    - claim: "a name that normalises to nothing registered is still reported as drift"
      proof: "unit test: an unregistered job survives normalisation as unknown"
  falsifier: |
    Strip on the first space, or take the first hyphenated word, and the second assertion goes red —
    `coverage-shard` against a registered `coverage-ratchet` is the case W1-T3740's own falsifier
    already needed, and a loose strip re-opens it. Add per-shard entries to the registry instead and
    `ci-parity:drift`'s comparison sees jobs its workflow scan does not report. Make an
    unnormalisable name fall back to any registry entry and the third goes red.
  risk: low
  band_meaning: blast-radius
  origin: human
