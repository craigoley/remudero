  rationale: |
    Main's branch protection is not strict, so a pull request is checked against its own base, not against the main it lands
    on. A merge queue checks the group commit, which is the tree that lands. The queue is built and wired, but disabled.
    READ on GitHub and at origin/main 6cf453f7a:
    - The ruleset 24525891 "main merge queue (W1-T5515/W1-T5522)" has enforcement disabled. It sets SQUASH, ALLGREEN grouping,
      up to 4 entries, a 60-minute check timeout, and requires ci, coverage-ratchet and test-slow.
    - Branch protection requires remudero-review, ci-gate and security-merge-policy, strict false.
    - ci.yml:43 triggers on merge_group; .github/workflows/ci-gate.yml:20-27 documents MERGE_GROUP_REQUIRED (W1-T4406, W1-T5515);
      .github/workflows/merge-queue-review-attest.yml reports remudero-review on a group commit (W1-T11847);
      security-merge-policy.yml triggers on merge_group checks_requested.
    - src/lib/arm-auto-merge.ts:629 has a `mergeQueue` port and :870 caches the reading per pull request.
    - ci.yml:28 says W1-T5940 narrows a group to its affected suites, so the group run is a selection, not the full suite.
    WHY verify: human: enabling the ruleset changes how every pull request merges, and only the operator can set a ruleset's
    enforcement. The builder ships the rehearsal and the guide; the operator decides whether and when to enable it.
    CHECKED for overlap: no queued or blocked task names the ruleset or its enforcement. W1-T11434 (queued) is a plan-merge
    shadow lane, not the merge queue.
  design: |
    1. scripts/merge-queue-rehearsal.mjs: read the ruleset and branch protection with `gh api` (read only), parse the workflows,
       and print one line per required check: the workflow and job that reports it on merge_group, or REFUSED with the reason.
       Exit 1 on any refusal. Also read `mergeQueue` for one open pull request through the sweep's own port.
    2. docs/operator-guide.md: a short "merge queue rehearsal" section in plain words.
    3. The script writes nothing to GitHub. Enabling is an operator step.
    INVARIANT read-only-rehearsal: the rehearsal never writes to GitHub; the ruleset changes only by the operator's hand.
    NOT IN SCOPE: changing the ruleset's parameters; making branch protection strict.
  falsifier: |
    Add an `if: github.event_name == 'pull_request'` to a fixture ci-gate job and criterion 1 must refuse. Restore and require
    criteria 1 and 2 to pass.
  note: |
