      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
    - claim: "a body carrying exactly one anchored trailer resolves identically to today at all three sites, so the overwhelming majority of bodies see no behaviour change"
      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
    - claim: "a body carrying no anchored trailer is unchanged — the gate's exemption still does not apply, the resolver still returns empty criteria without touching a git object, and the extractor still returns undefined so the caller falls through to the body's own Acceptance block"
      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
    - claim: "a mid-prose quotation of the trailer format never outranks the genuine anchored final line — W1-T70's original regression stays closed at every site, including the two that previously read first-wins"
      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
    - claim: "the question 'which single id does this body name' has exactly ONE implementation, review.ts remains the leaf module, and no import of run-task.ts is introduced into it"
      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
    - claim: "the deliberately different trailer questions are untouched — the branch-shape scan still returns EVERY id a branch claims as a union rather than a single winner, and the credit-surface check still answers any-id existence"
      proof: "unit test: test/trailer-tiebreak-one-spelling.test.ts"
  note: |
    SIZING BAND: risk:high is Rule 19's SPAN, not blast radius — the same reading W1-T441's note
    records. `files:` crosses src/lib, src/ and test/, which `subsystemsOf` counts as >=2 subsystems
    and which would be a sizing violation at any lower band, so it is raised UP FRONT rather than
    shipped as one (the W1-T400/W1-T407 lesson). The actual change is one predicate and three call
    sites.

    AND THE HONEST VERSION OF THE COUPLING, since the atomic-coupling exit is easy to overclaim: the
    BEHAVIOURAL divergence could be closed in review.ts alone, because run-task.ts is already
    correct. What needs both files is the INVARIANT the fifth criterion states — one implementation,
    not two that happen to agree today and drift tomorrow. That is the reason both are declared, and
    it is a weaker claim than "unsatisfiable piecewise". Stated plainly so a reviewer can hold the
    task to the right standard.

    WHAT MUST NOT CHANGE.

    LAST-WINS IS NOT RE-LITIGATED HERE. W1-T70 already decided it against the prompt contract, and
    the harness's own append-at-end stamper produces it. A build that "unifies" on first-wins would
    be reversing a ratified ruling inside a follow-up, and would additionally make the orchestrator's
    own trailer the one that loses.

    THE GATE KEEPS ITS FAIL-OPEN CONTRACT ON AN UNREADABLE PLAN. `trailerResolves` OMITTED must stay
    byte-for-byte the pre-#2934 verdict — that omission is a deliberate contract, and the
    plan-load-vs-line-scan reconciliation is W1-T2315's, not this task's. This change adds no second
    refusal.

    NO MERGED PR IS RE-REVIEWED and no merged acceptance record is amended (Rule 21). If the
    measurement in design (iv) finds merged bodies that were judged under the wrong id, that is
    evidence of exposure and nothing more.

    NOTHING PACES, SLEEPS, RETRIES OR BACKS OFF on any review path — W1-T1066 stands.

    SEQUENCING, RECORDED RATHER THAN HARD-EDGED. W1-T2315 also edits the reviewer's resolution site
    in src/run-task.ts, so these two overlap under W1-T171's declared-files serialization and should
    not run in the same pass. Expressed as sequencing rather than a `depends_on` edge deliberately:
    every symbol this task touches is already on main, W1-T2315 is queued at risk:high, and a hard
    edge would strand a cheap correctness fix behind a large one for a prerequisite that does not
    exist. Whichever lands second re-reads the other's call site rather than re-introducing a second
    tie-break.

    THE DECLARED TEST SUITES ARE DELIBERATE, NOT DEFENSIVE. `acceptance-author-gate`,
    `acceptance-gate-plan-resolver`, `review-resolves-criteria-at-the-prs-own-head` and
    `trailer-exemption-must-resolve` each construct PR-body fixtures and assert on trailer-derived
    verdicts, so they are the suites a tie-break change turns red; a `files:` omitting them is the
    refusal-at-push that cost W1-T407 three dispatches. Verify by invocation before trusting this
    list — it was derived by symbol search at filing, and the suite set moves.

    ALL SIX PROOFS NAME ONE FORWARD-REFERENCED PATH. A path forward-reference is safe; a symbol one
    is a guess, and a `grep:` proof naming an existing symbol would match the merge base as well as
    the head and be downgraded as stale.
