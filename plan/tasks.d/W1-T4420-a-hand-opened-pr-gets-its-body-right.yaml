- id: W1-T4420
  title: "AUTOMATED PR OPENERS MUST CHECK THE BODY BEFORE POST — use one shared library seam for existing openers so task credit and acceptance proofs are valid before the REST write, without adding a CLI verb"
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: high
  band_meaning: span
  origin: "follow-up audit 2026-09-24 (operator: improve automated flow and self-improvement)"
  plan_refs: ["W1-T1060", "W1-T4415"]
  files:
    - src/lib/pr-open.ts
    - src/run-task.ts
    - test/a-pr-opens-with-a-judgeable-body.test.ts
  status: blocked
  retirement: closed
  # plan gardener: retire W1-T4420 — Every acceptance proof now holds on main, and did not when it was filed.
  attempts: 0
  rationale: |
    OBSERVED 2026-09-24: three operator-session PRs (#6915, #6916, #6917) failed acceptance-author-gate `no-header`
    because the Remudero-Task trailer was only in the commit, and each needed a body PATCH plus a close and reopen
    (the gate replays the event payload). The PRs also hand-assembled REST create bodies, leaving plan agreement and
    proof discrimination to later gates. The current implementation of this task added a new `rmd pr open` command,
    a CLI-only parity entry, and a new `PrOpenDeps` shape; the operator explicitly declined that surface and chose a
    shared checked library function called by existing PR openers instead (PR #7165 operator comment, 2026-09-25).
    Research found four existing automated open sites in `src/run-task.ts` (implement, retro, triage, plan), all
    already pass through `ghPrCreateFillCommand` before the REST writer. That common builder is the bounded seam:
    validate/derive the body there, then retain the existing REST transport. This keeps author-time checks before
    the irreversible create event, avoids close/reopen repair, and adds no new command or dependency interface.
  design: |
    `ghPrCreateFillCommand` is the existing shared pre-POST seam used by all four automated openers. Add a library
    function in `src/lib/pr-open.ts` that prepares and validates the exact body this seam will send: run branches get
    their `Remudero-Task: <ID>` trailer before the POST; the Acceptance block must agree with the filed task; and
    proofs that can be checked locally must discriminate against the merge base. Refuse before any REST call when
    the body is absent, divergent, or non-discriminating; do not rely on the later event-driven gate to repair it.
    Keep the existing REST writer and route every current opener through the shared library check. Keep the no-draft
    invariant. Do NOT add `rmd pr open`, a `COMMANDS` row, generated-help/console-parity changes, a CLI-only baseline
    entry, or a new `*Deps`/dependency-object type; reuse the existing opener inputs and narrow positional seams.
    Operator constraint, 2026-09-25: Do not add a new CLI verb or dependency-object interface.
  acceptance:
    - claim: "a run branch receives its task trailer before the existing REST create is called"
      proof: "grep: run branches receive the Remudero-Task body trailer before REST pull creation in test/a-pr-opens-with-a-judgeable-body.test.ts"
    - claim: "a plan-divergent or non-discriminating Acceptance block is refused before any REST POST"
      proof: "grep: the shared PR opener refuses a stale or plan-divergent acceptance block before POST in test/a-pr-opens-with-a-judgeable-body.test.ts"
    - claim: "every existing automated PR opener uses the same checked library seam, without adding a CLI or dependency object type"
      proof: "grep: openPullRequestChecked( in src/run-task.ts"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF all four existing opener paths already invoke the same library validator before
    the REST POST and the validator rejects a body that the acceptance-author gate would reject. A new command is
    not an acceptable substitute: it does not protect the existing automated openers and was explicitly declined.
