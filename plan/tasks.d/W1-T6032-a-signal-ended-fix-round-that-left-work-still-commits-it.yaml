  rationale: |
    MEASURED 2026-10-06 (ledger rotation 2026-10-04, read-only): W1-T4283's fix round dispatched at 01:06:47Z,
    implement.harness_commit fired at 01:06:47Z (W1-T5325 derives the subject when a shell-less worker leaves
    edits), and fix.done at 01:06:57Z carried worker_subtype error_exit_null with pushed head a77eedf9. PR #8973
    then went through review, automerge arming and verdict.merged. #9528's two rounds (2026-10-06 09:50/10:02Z)
    differ: their workers left no edits, so they were refused. W1-T5999's check (runFixRung, src/run-task.ts,
    fixWorkerEndedBySignal) runs right after the spawn, before the harness commit, so the #8973 shape would now
    stand down with its edits discarded. A follow-up under W1-T5999 cannot pass proof-discrimination: that
    task's file proof became true on main when #9566 merged (#9589 refused executed_stale, closed and held).
  design: |
    Record signal_terminated only when the signal-ended worker left NO work: no uncommitted edits
    (worktreeHasUncommittedChanges false) and no commits ahead of roundStartSha (when defined). Otherwise fall
    through to the normal harness-commit-and-push path exactly as before W1-T5999. The existing build is commit
    7b31026c on branch run-W1-T5999-1791296617622; re-home it under this id with its two
    added cases moved into the new test file (W1-T5999's own file proof is already true on main). W1-T5999 is
    merged (#9566); this task only narrows its stand-down, so the shared src/run-task.ts surface is intended.
  acceptance:
    - claim: "a signal-ended fix worker that left edits, or committed on its own, has its work committed and pushed and is never recorded signal_terminated, while one that left no work still stands down without a refusal"
      proof: "unit test: test/a-signal-ended-fix-round-that-left-work-still-commits-it.test.ts"
  falsifier: |
    Keep W1-T5999's unconditional stand-down: the fixture worker's edits are never committed, the round reads
