  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`. Blast radius is one
    completeness guard plus a test; the enforcement path itself is already correct and this task must
    not rewrite it.
    `verify: human` — design (i) fixes the ratchet's shape but the operator is minting these four
    steps ONE AT A TIME, deliberately, and should see the audit's findings before step two is scoped.
    `files:` IS TWO PATHS. `src/lib/serve.ts` is declared because `buildServeRoutes` and its existing
    `writeRoutesMissingTier` guard live there, and the completeness guard belongs beside them.
    `src/lib/service.ts` is DELIBERATELY NOT DECLARED: `createService`'s enforcement was measured
    correct and fail-closed, so the implementation should not need to touch it — and declaring a file
    the implementation never edits trips `inverseScopeUntouchedFiles` (`src/lib/review.ts`). IF the
    implementer finds a real enforcement defect there, declare it THEN and say why.
    `src/run-task.ts` IS NOT DECLARED and must not be: at 19,588 lines every task naming it serialises
    against every other that does (W1-T471), and nothing here touches it.
    EVERY CRITERION IS `unit test:` ON PURPOSE — a shard whose proofs are all `grep:` against its own
    path caps its implementation at `proof_exec: 0/N` and needs an operator override (that happened to
    #1812), and such a proof additionally draws a `proof-scope` warning that BLOCKS in CI's
    changed-tasks pass. The titles are written to resolve to ONE file, because `check-proof` now warns
    on a `unit test:` title matching zero or many tests (W1-T488).
    WHAT THIS TASK MUST NOT BECOME. It is an audit and a ratchet. If the audit finds the surface
    already correct — which the measurements in the rationale suggest it largely is — THE RIGHT
    OUTCOME IS A PASSING TEST THAT CANNOT SILENTLY ADMIT ROUTE 37, not a redesign. A large diff here
    is evidence of scope creep, not thoroughness."
