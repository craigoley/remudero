  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/promotion-judge-supplied.test.ts`, declared in `files:`, so on this filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19'S SPAN — two files, one concern, and the linter
    accepts the band either way. The change starts UNATTENDED model spawns inside the retro, on a
    cadence nobody watches; a mistake in the bound spends per active corpus entry per cycle, which
    is the exact cost the writer refused to take on itself.

    THE RULING IS RECORDED AS A RULING. Rationale (3) quotes the refusal verbatim and says the
    operator's decision takes it. A later reader must not find this shard and conclude the writer
    was careless — the writer reserved the decision correctly and named it as a follow-up, which is
    what this is.

    ONE ZERO IS LABELLED AS COVERAGE RATHER THAN LET STAND AS EVIDENCE. The three `promotion.*`
    ledger steps read zero, and that would corroborate the finding beautifully if the corpus could
    see the wired period. It cannot: no retro in it starts after the wiring merged, and this host's
    ledger stopped taking fleet rows nine days before. Rationale (4) states both, with the controls
    that establish the scan itself is sound.

    THE COST QUESTION IS ANSWERED WITH A MOUNT, NOT A DOLLAR FIGURE, BECAUSE THE LEDGER DOES NOT
    CARRY ONE. Rationale (6). An estimate here would be the flattering kind of invention this
    repo's briefs keep having to correct.
