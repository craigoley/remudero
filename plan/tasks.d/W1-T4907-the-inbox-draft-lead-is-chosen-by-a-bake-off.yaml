  files: [src/lib/inbox-bakeoff.ts, src/run-task.ts, docs/cli-reference.md, docs/operator-guide.md, scripts/console-parity-ratchet.mjs, scripts/console-parity-baseline.json, test/the-inbox-draft-lead-is-chosen-by-a-bake-off.test.ts, test/help-renders-a-summary-not-a-paragraph.test.ts, test/inbox-bakeoff-command.test.ts, test/inbox-bakeoff-is-preregistered-as-cli-only.test.ts]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-30 (fleet ledger): cash gpt-5-nano on the slim prompt drafted 49 of 200 terminal drafts
    clean (25%), with about 52% of syntheses erroring (docs/recon/openweight-inbox-draft-trial.md). #7963 moved
    the lead to gpt-6-luna on price and generation alone, and in 03:18Z..10:03Z Luna produced 38 draft errors in
    39 syntheses ("output carrying NEITHER marker — it answered in prose instead of the fragment contract",
    ~269-character replies); #8017 reverted it. The adapter forces tool-enabled gpt-6-luna to
    reasoning_effort none, which plausibly explains it. No lead has ever been chosen by replaying the same
    proposals through the candidates.
  design: |
    `rmd inbox-bakeoff` (new module, CLI verb) replays a fixed sample of recent real inbox proposals through
    each candidate lane with the production prompt and lint: cash gpt-5-nano, gpt-oss-120b, gpt-6-luna with tools,
    gpt-6-luna without tools (reasoning allowed), and subscription claude-sonnet-5-5. For each it records
    fragment-contract errors, lint-clean drafts, cash cost and wall time, writes one bakeoff row per candidate,
    and prints the ranking by clean drafts per dollar with Sonnet's subscription cost shown separately. It never
    changes routing; the operator picks from the table.
  acceptance:
