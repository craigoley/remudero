- id: W1-T9821
  title: "A WORKER SPAWN NAMES ITS SITE WITHOUT PARSING SOURCE MAPS — worker-heaps.ts trackWorkerThreads formats Error.captureStackTrace into spawnSite(site.stack) on every worker spawn in the daemon and in serve, and under tsx's source maps a formatted stack parses and keeps the map of every module on it for the life of the isolate: the leak class W1-T9720 removed from the sync-spawn meter (main +17.0 MiB and 5 maps for 90 metered spawns, the fix +0.2 MiB and 0 maps)"
