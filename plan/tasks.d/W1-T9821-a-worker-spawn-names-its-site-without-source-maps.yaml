  rationale: |
    OBSERVED offline by the W1-T9720 builder (PR 12326, commit 56a9b76dd on base ec0eb2ce2; logs-8864/9720-bench.log,
    script 9720-bench/bench.mjs). Method: a process it started under tsx with --expose-gc --expose-internals loads
    the daemon's graph, meters 90 real sync spawns, reads heapUsed after two forced GCs, and counts maps parsed by
    wrapping Node's internal SourceMap class. 3 interleaved rounds per variant:
    - main's read-plane callerFrame (formatted `.stack`): 5 maps parsed, heapUsed +17.0 MiB (99.3 -> 116.3 MiB).
    - W1-T9720's rawCallSites (scoped Error.prepareStackTrace and stackTraceLimit, restored in finally): 0 maps,
      +0.2 MiB.
    - W1-T9647's census bound for the whole cache: 587 maps x 240,549 B = 134.7 MiB. The W1-T9091 builder measured
      +134.5 MiB for all maps.
    READ at origin/main (src/lib/worker-heaps.ts; symbols, not lines):
    - trackWorkerThreads subscribes to the worker_threads diagnostics channel. On every spawn it runs
      `Error.captureStackTrace(site)` and then `spawnSite(site.stack)`. Reading `.stack` formats it, and with source
      maps on (tsx calls process.setSourceMapsEnabled(true), per W1-T9647) Node parses each frame's map and keeps it.
    - The daemon (run-task.ts calls workerThreads() at boot), serve (serve.ts, serve-memory.ts) and the read-model
      worker (read-model-worker.ts) all track spawns this way.
    - daemon-memory-census.ts sourceMapCacheHolder's comment already names "worker-heaps.ts spawnSite" as one of the
      two formatters that fill the cache.
    INFERRED, not measured for this site: each worker spawn parses the maps of the modules on its spawn stack that are
    not parsed yet, so this adds to the source-map cache in the same way. The size depends on which modules spawn
    workers; the builder measures it with the same bench shape.
  design: |
    1. trackWorkerThreads captures the spawn stack as raw V8 call sites, never as a formatted `.stack` while maps are
       on. Use the scoped capture W1-T9720 built in read-plane.ts (rawCallSites / siteText), extracted to one shared
       helper, `rawCallSites` in src/lib/raw-call-sites.ts, that both modules import, not a second copy. Restore the exact
       ambient formatter and limit on success and failure. Preserve worker capture's effective frame budget and
       eligible-frame order; the helper's own frame consumes no eligible slot. Keep read-plane's existing capture
       depth, siteText/caller/chain output and leaf filtering unchanged.
    2. The tracked kind is canonical RAW/RUNTIME `<module>:<function>`: moduleName of the unmapped runtime file,
       or the existing bundledModule header at its raw runtime line; function is the unmapped V8 frame's function
       clause, or `<module>` when absent. Keep the same node:/worker-heaps/spawn-helper skips and bundle-header
       lookup; never infer an original-source module from source-map metadata.
       When no eligible frame exists, retain literal `unknown` and never omit a worker.
       Keep spawnSite's existing string/undefined entry-point behavior.
       Explicit reviewed difference: mapped nameless top-level and mapped anonymous callback sites formerly named
       `anonymous-worker:<anonymous>` are `anonymous-worker:<module>`; unmapped module-level `<module>` stays unchanged.
       Named-function, method and bundle controls remain exact. Enumerate/test any additional alias/receiver,
       constructor/async/eval or original-module remapping differences before review; unenumerated differences,
       helper-depth drift or new aggregation collisions HOLD qualification, not a formatted-stack fallback.
       Retain current IDs, tracked population, exit/stop/subscription, sizing/unsized/pending/nested semantics,
       counts, bytes, used-byte omission, holds/age/basis/reasons/residuals and grouping arithmetic. No new DTO
       field, identity suffix, grouping algorithm, constant or map lookup. A label change must not hide changed
       per-thread parts/accounting or merged buckets. Preserve all then-current unrelated holds/lifetime work.
    3. Measure the saving offline with the 9720 bench shape: N real worker spawns under tsx with maps on, maps parsed
       and heapUsed, main against head. Report it in the PR, OBSERVED with the method named.
    4. No new constant.
    Tests go in test/memory/a-worker-spawn-names-its-site-without-source-maps.test.ts, titled verbatim as in the proofs.
    This folder is computed from the representative's actual import/body text with the maintained placement data;
    before implementation is published, re-run literal rmd test-place on the final physical test and current corpus.
    Retain real imports and controls if it differs; reconcile scope through review, never force a bucket or flat test.
    One test runs a real child node with --enable-source-maps and --import tsx, spawning a Worker from a module that
    ships a map. A formatted `.stack` in the same module is the positive control, so a zero is a measurement.
  acceptance:
    - claim: "tracking a worker spawn parses no source map, and a formatted stack in the same child does (positive control)"
      proof: 'grep: test("W1-T9821: a tracked worker spawn parses no source map" in test/memory/a-worker-spawn-names-its-site-without-source-maps.test.ts'
    - claim: "the tracked kind names its canonical raw runtime module and function, including a bundle frame; mapped nameless sites use the reviewed <module> spelling without changing tracked identities or accounting"
      proof: 'grep: test("W1-T9821: the spawn site still names its module and function" in test/memory/a-worker-spawn-names-its-site-without-source-maps.test.ts'
    - claim: "trackWorkerThreads captures its spawn stack through the shared rawCallSites helper in src/lib/raw-call-sites.ts"
      proof: 'grep: rawCallSites( in src/lib/worker-heaps.ts'
  falsifier: |
    On origin/main, run the child: trackWorkerThreads formats `site.stack`, Node parses the spawning module's map,
    and the first test fails on a non-zero count with the same child's real-map positive control. In the naming
    test, invariant named-function/method/unmapped-module/bundle controls pass on main and head; the two explicit
    canonical mapped-nameless expectations fail on legacy main and pass at head. They do not assert universal
    mapped-label equality. Add frame-budget and per-thread accounting/collision controls so lost workers,
    helper-depth changes, new bucket merges or unreviewed label differences cannot pass as canonicalization.
    Removing only mapped-capture prevention fails the map assertion; removing only canonical nameless handling
    fails the named label assertions. Restore exact source and require all controls to pass; no guard/test waiver.
