- id: W1-T3063
  title: "THE SUPERSESSION RUNG CLOSES A REAL BUILD ON A CREDIT EARNED BY A PLAN-ONLY FILING — W1-T2794 shipped a rung that closes an open PR whose task reads merged, and the refusal meant to stop a filing earning that credit is keyed on a `pr.opened` row carrying `plan_only: true`, so for any PR whose row predates that field or has rotated out of the live ledger the refusal FAILS OPEN: #4461, a validated implementation, was closed against #3195, a `chore(plan)` touching one shard"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 15.00
