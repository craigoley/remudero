      (B) READ THE UNION IN THE FOLD — CONTRAINDICATED BY ITS OWN DOC, so never a real candidate.
          `readLedgerUnionBounded` states that every rung it serves reads the NEWEST ROW of a step,
          NEVER A COUNT, so stopping early cannot under-count anything. This fold reads a COUNT — a
          consecutive run — which is exactly the shape that early exit is documented as not
          serving, so it would under-count SILENTLY. The unbounded alternative puts an archive walk
          on the path every open PR takes every tick.
      (C) CORRECT THE PROMISE — SHIPPED. #3136 rewrote the guarantee at six sites: four in
          `src/lib/sweep.ts` (`SweepPolicy.repeatDispositionBound`'s doc, which had claimed
          "exactly once (never again until the head moves)"; `repeatDispositionStreaksFromLedger`'s
          doc; `RepeatDispositionRun.escalated`'s field doc; and the `repeatAlreadyEscalated`
          call-site comment) and two in `test/sweep.test.ts`. The stated guarantee is now ONCE PER
          HEAD PER ROTATION WINDOW, with the mechanism named — PASS 3 prefers the last `acted: true`
          row while the trip's flag rides an `acted: false` one, so the evidence is SELECTED
          AGAINST rather than shed by chance — and with the window recorded as BYTE-DRIVEN at the
          4 MiB ceiling rather than clock-driven, which means it is SHORTEST EXACTLY WHEN THE FLEET
          IS BUSIEST.

    ONE RENAME WAS REFUSED, AND THAT REFUSAL IS PART OF THE RULING. `test/sweep.test.ts` carries a
    W1-T2345 test whose TITLE states the false guarantee, and W1-T2345's own merged shard cites
    that title verbatim as a `unit test:` proof. Renaming it would break a merged task's proof in
    order to fix a comment, so the title stands and a comment above it now records what the test
    actually pins — true WITHIN a rotation window — and why its never-rotated fixture is
    structurally blind to this defect.

    (Q2) THE WORK IS NOT DONE, AND THIS RETIREMENT IS NOT A COMPLETION. THE COUNTER STILL RESETS AT
    EVERY ROTATION. #3136 changed no behaviour whatsoever; what changed is that the documentation
    no longer claims otherwise. The mechanism described above is intact and every measurement in
    this shard remains reproducible against it.

    THE RESIDUAL COST, RESTATED SO NOBODY RE-DERIVES IT: about 5 to 6 re-fires per day per stuck
    head, against roughly 543 full-weight derivations a day for the same head with no counter at
    all — so ABOUT 99 PERCENT OF THE INTENDED REDUCTION IS STILL DELIVERED. The marginal cost of
    one extra fire was measured directly and is one ledger row plus one comment appended to an
    already-open issue; on the digest side it is ZERO, because #3085's reader deduplicates on PR
    number and a second trip for the same PR renders no second line.

    ⚠ #3136 DID NOT SATISFY CRITERIA 1 AND 2, AND WAS NOT MEANT TO. Those two assert that a
    rotation does not reset the streak and that the marker survives a rotation. BOTH DESCRIBE
    OPTION (A)'s BEHAVIOUR. Option (C) changes no behaviour by ruling, so both remain unsatisfied
    by construction. A reader who takes this retirement for a completion has misread it: the
    guarantee was CORRECTED, not RESTORED.

    (Q3) WHAT WOULD RE-OPEN THIS. Two conditions, either alone sufficient:

      1. THE RE-FIRE RATE RISES MATERIALLY above the 5-to-6-per-day-per-stuck-head measured here.
         Rotation is byte-driven, so a busier fleet rotates sooner and re-fires more often; the
         rate is the thing to watch, not the mechanism, which is already understood.
      2. A CONSUMER APPEARS THAT DEPENDS ON THE MARKER SURVIVING A ROTATION. Today nothing reads
         `repeat_escalated` across a rotation boundary. The moment something does, the marker's
         destruction stops being a redundant row and becomes a CORRECTNESS FAULT.

    Under either condition option (A) becomes worth its blast radius, and this shard should be
    re-filed against `src/lib/ledger.ts` with the criteria below reinstated as written.

