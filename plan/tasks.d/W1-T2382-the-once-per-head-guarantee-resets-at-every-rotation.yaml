  falsifier: |
    If a fresh window shows no PR escalating twice on one unchanged head — in particular if
    `sweep.repeat_escalated` rows sharing a `pr_number` and a `head_sha` never appear on both sides
    of a rotation timestamp — then the reset this task describes is not occurring at the measured
    rate and the task must be closed rather than implemented. The measurement to re-run is the same
    one: read every `sweep.repeat_escalated` row over the three-form ledger union with a per-form
    coverage control, group by PR and head, and compare each pair's timestamps against the mtimes of
    the dated rotation archives.

    SEPARATELY DECISIVE: if `rotateLedger`'s PASS 3 no longer collapses `sweep.disposed` to one line
    per `pr@head`, or no longer prefers an `acted: true` row, the mechanism named here is gone and
    the finding must be re-derived rather than trusted.
