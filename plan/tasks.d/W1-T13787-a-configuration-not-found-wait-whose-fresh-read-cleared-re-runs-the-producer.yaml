  rationale: |
    WHY: a CodeQL configuration-not-found hold stayed for 58 minutes after GitHub had already cleared it.
    PR 19489 (head 41a67e1, opened 2026-11-18 20:12Z). The CodeQL workflow ran all three languages:
    actions done 20:14:26, python 20:14:49, javascript-typescript 20:20:26. GitHub's one trusted CodeQL
    check (github-advanced-security, id 135100777654) reads "N configurations not found" until every
    category on main has an upload for the PR. The producer's last trigger, the workflow_run completed
    event, ran at 20:20:41, before GitHub re-judged the last upload, and posted
    `unknown: codeql-configuration-not-found`. GitHub later re-judged the check in place (it now reads "No
    new alerts in code changed by this pull request"), but no event ran the producer again.
    At 21:18:21 the operator account re-ran CodeQL (attempt 2; no fleet ledger row). Its requested event
    ran the producer, which posted `safe` at 21:18:53, before attempt 2 had uploaded anything (first job
    done 21:19:20). So the check had already refreshed; only the wake was missing.
    THE FLEET SAW IT. W1-T13470's observeCodeqlConfigurationWarning (src/lib/sweep.ts) ran on six full
    sweep passes between 20:42 and 21:31Z. It wrote no capture row and its reasons carried no notes. That
    means the fresh read at this head did not see the warning: a throw or another head would have added
    a note. The function then does nothing.
    MEASURED over the week (final heads of 1,000 PRs created since 2026-11-11, statuses read with gh):
    11 heads had the neutral CodeQL state (9 under the older reason security-analysis-failed-or-unrecognized,
    2 under the new name). 10 cleared by themselves in 46 s to 5 min 44 s, when a later CodeQL event re-ran
    the producer. Only 19489 stuck.
    NOT COVERED: W1-T13470 (merged) captures; W1-T13663 (merged 2026-11-19, #19510) escalates once when
    GitHub never re-judges. Both act only while the fresh read still shows the warning. W1-T11776 (queued)
    adds a check_run trigger to the producer; its falsifier says GitHub may not send that event when a
    completed check is updated in place. This task needs no GitHub event.
  design: |
    INVARIANT stale-status-wakes-the-producer: when the posted status reads configuration-not-found but the trusted fresh read at the same head no longer does, the sweep asks the trusted producer to run again for that PR.
    INVARIANT once-per-head: the sweep dispatches the producer at most once per PR head.
    INVARIANT no-dispatch-without-evidence: the sweep never dispatches on a read that failed, answered another head, or still shows the warning, and it never writes the security status or grants a merge itself.
    1. Add an optional SweepDeps seam `dispatchSecurityMergeProducer?: (pr: OpenPrView) => Promise<void>` next
       to readSecurityMergeObservation, listed in the same two key lists (W1-T13470's entries). Its real wiring
       in buildSweepEffects is one gh call through the existing ghRunImpl: `api -X POST
       repos/<owner>/<repo>/actions/workflows/security-merge-policy.yml/dispatches -f ref=main -f
       inputs[pr_number]=<n>`. The producer's workflow_dispatch branch (scripts/security-merge-producer.mjs)
       already takes pr_number and re-derives everything from trusted metadata.
    2. In observeCodeqlConfigurationWarning, after the head check: if `warning === undefined` and
       observed.decision.reason !== CODEQL_CONFIGURATION_NOT_FOUND and there is no security.producer_redispatched
       row for this PR and head in `lines`, write that row first (so a crash cannot repeat it), then call the
       seam. A thrown dispatch is named in the reason and not retried at this head.
    3. Declare the step in src/lib/ledger.ts beside the two W1-T13470 steps.
    4. No time bound, env var or config key. The producer workflow, classifier and adapter do not change.
    5. src/lib/sweep.ts has a comment cap (test/sweep/compress-src-lib-sweep-ts.test.ts): add as few comment
       lines as possible. Re-run W1-T13470's and W1-T13663's suites in test/github/.
  falsifier: |
    At origin/main criterion 1 fails: the function returns the plain wait reason and dispatches nothing.
    Dispatch whenever the posted status reads the reason, without the fresh read: criterion 3 sees a
    dispatch while the warning still stands. Key the guard on the PR only: criterion 2's new head
    dispatches nothing.
    GUARDS: test/github/a-codeql-configuration-not-found-warning-is-captured-and-re-observed-not-fixed.test.ts
    and test/github/a-codeql-configuration-not-found-head-github-never-re-judges-is-escalated-once.test.ts
    pass unchanged.
