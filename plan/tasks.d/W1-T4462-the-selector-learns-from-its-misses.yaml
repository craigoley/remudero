  rationale: |
    MEASURED 2026-09-24: the W1-T4404 shadow selector's first day of records (see the rationale below).
    MEASURED 2026-09-24 over 159 shadow records from 40 PR runs: floor median 1,702 / 1,876 suites (~9% saved), narrow
    median 458 (~75% saved); 20 distinct real failures, 3 missed by narrow: clock-signature-census on #6967 (a real regression
    — sre-lane.ts added new Date( calls; the census imports scripts/clock-signature-ratchet.mjs, whose walk censusSuiteFiles
    cannot see), and two flakes (cold-status-reads timing, boot-fetch ref-lock) that --recent-failures would have kept
    selected.
  design: |
    (i) A test that imports a scripts/ module which walks a population (ls-files, readdir, glob) is a census suite
    too. (ii) A diff that ADDS a src/ file selects every suite that walks src/ unfiltered. (iii) CI passes --recent-failures
    built from the flake-retry evidence the jobs already write. (iv) A shadow miss on a file that a later push on the same
    branch passes is labelled a flake, not a miss, in the record W1-T4439's gardener reads.
