- id: W1-T5114
  title: "EVERY GARDENER PASS RUNS ON THE DAEMON'S EVENT LOOP — startGarden calls the fully synchronous runGarden on a 60 s setInterval inside the daemon process, so each pass (inventory reads over the ledger union, git, gh) blocks admission for its whole duration: on 2026-10-01 gardener passes took ~1,620 s of the 4,344 s that 11 ticks spent reaching admission, and boot to first admission ran 423-1,235 s"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1
