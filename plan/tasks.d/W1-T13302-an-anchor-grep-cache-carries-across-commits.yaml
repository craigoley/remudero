- id: W1-T13302
  title: "The inbox's evidence-anchor grep cache carries across main commits, re-grepping only the anchors a changed file can affect, so serve stops re-running about 1,300 whole-tree git greps every time main moves"
  repo: remudero
  depends_on: []
  priority: 0
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # which anchor answers are reused across commits; every answer still equals a fresh grep at the new commit
  band_meaning: span
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T4261
  files:
    - src/lib/inbox.ts
    - src/lib/panel-graph.ts
    - test/inbox/an-anchor-grep-cache-carries-across-commits.test.ts
  status: merged
  attempts: 0
  acceptance:
    - claim: "When the cache moves from commit A to commit B, an anchor whose path scope holds no file in `git diff --name-only --no-renames A B` keeps its answer with no grep; a counting grep seam sees greps only for anchors a changed file can affect"
      proof: "grep: W1-T13302 criterion 1 in test/inbox/an-anchor-grep-cache-carries-across-commits.test.ts"
    - claim: "invariant:carried-equals-fresh — on a real repository, after commits that add, edit, delete and rename files under and outside anchor paths, every carried answer equals a fresh git grep at B"
      kind: guard
      proof: "grep: W1-T13302 criterion 2 in test/inbox/an-anchor-grep-cache-carries-across-commits.test.ts"
    - claim: "A diff that fails, or that names more than ANCHOR_CARRY_MAX_CHANGED_FILES (2,000) files, empties the cache as today"
      proof: "grep: W1-T13302 criterion 3 in test/inbox/an-anchor-grep-cache-carries-across-commits.test.ts"
  rationale: |
    WHY: serve's container averaged 1.58 cores over 5 minutes at 01:05-01:10Z on 2026-11-17, while serve's own process
    accounted for 1.16; the rest is short-lived children. A 10 Hz ps sample of serve's container over 2 minutes saw about
    200 git processes, 61 of them `git grep -I`. The registry holds 2,367 proposals with 1,322 distinct evidence anchors;
    one whole-tree `git grep -q` at origin/main costs about 0.8 s of CPU on the host (5 runs in 7.8 s). Main moved 28
    times in the 3 hours before 01:15Z.
    READ at origin/main, src/lib/inbox.ts resetAnchorGrepCacheFor: "A new sha empties the cache", so every main advance
    re-greps every anchor (warmAnchorGrepCache, 4 at a time), although most commits touch none of the anchored files.
  design: |
    INVARIANT carried-equals-fresh: a carried answer is always what a grep at the new commit would answer.
    1. On a move A -> B, run `git diff --name-only --no-renames -z A B` once. Keep every answer (true or false) whose
       anchor path holds no changed file: a grep of an unchanged path answers the same. A path-less anchor, or a
       pathspec with glob or magic characters, is affected by any changed file. Every other anchor is re-grepped at B.
       MEASURED 2026-11-17 in the production registry: 1,321 of 1,322 distinct anchors name one file, so recording the
       matching files of each anchor would keep nothing more.
    2. Fall back to emptying the cache when the diff fails or exceeds ANCHOR_CARRY_MAX_CHANGED_FILES.
    3. The async warm path (warmAnchorGrepCache) and the sync path share the same carry. panel-graph.ts's Inbox cache
       (serve) passes the changed-files reader, and its warm pass also snapshots the carried answers.
  falsifier: |
    Empty the cache on every new sha: criterion 1 fails (every anchor is re-grepped). Keep a false answer when a changed
    file under its path now matches: criterion 2 fails. Carry across a failed diff: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794878208000 with ~/rmd-work/bin/reserve-id.sh.
    Proof that counts in production: the ps sample of serve's container shows git grep processes only right after a
    main move, in proportion to the anchors it touches, and the container's steady CPU falls by about 0.4 core.
