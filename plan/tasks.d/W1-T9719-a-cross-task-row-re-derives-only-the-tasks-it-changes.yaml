    OBSERVED, core ledger, de-duplicated across rotation overlap: daemon.boot 17 rows on 2026-10-14 and 12 on
    2026-10-15 to 19:17Z; pr.opened with plan_only true 2, 7, 8 and 9 on 2026-10-11..14.
    INFERRED: ~20-26 full re-derives a day on core from these two rules, ~25-30 GB of reads a day, plus the board
    stage time each one takes on the views thread.
  design: |
    1. Record the cross-task reads. While a task derives, the three readers report what they consulted from the
       cross-task rows (for example the newest daemon.boot ts at or after the task's window, the tally inputs, the
       plan-only filing answer for each PR url asked), as recordingGithub does for GitHub reads, and the answers are
       kept with the task's projection (and persisted beside task_github_read).
    2. On a cross-task row, re-derive only the tasks whose recorded cross-task answers change when replayed
       against the new rows. A task with no recorded cross-task read is reused. Any reader that cannot be replayed
       keeps the whole-board rule for that row and names why.
    3. The board oracle is unchanged and audits the result (no-reuse derive vs reused board, A/A).
    4. BoardUpdate already reports `rederived` and `full`; add `cross_task: {rows, rederived, reused}` to the board
       stage's row so the fleet sees each boot's cost before and after.
    5. No new constant.
    Tests go in test/a-cross-task-row-re-derives-only-the-tasks-it-changes.test.ts, titled verbatim as in the proofs,
    over createBoardProjection with a real in-memory fact store.
