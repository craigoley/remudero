    - claim: "recorded cross-task reads survive a restart, so the first boot row after one is not a full re-derive"
      proof: 'grep: test("W1-T9719: recorded cross-task reads survive a restart" in test/a-cross-task-row-re-derives-only-the-tasks-it-changes.test.ts'
  falsifier: |
    On origin/main, build a board of 50 tasks, one of them under an independent-failure block, and append a
    daemon.boot row: update() reports full true and 50 re-derived, so the first test fails. Record the reads but
    replay only the boot step, not the window bound the task read: the blocked task is reused with a stale answer,
    its projection differs from a full re-derive, and the first test fails on the equality.
