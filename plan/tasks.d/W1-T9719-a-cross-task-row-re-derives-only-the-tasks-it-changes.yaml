  rationale: |
    READ at origin/main 6bdb26420 (symbols, not lines):
    - src/lib/board-projection.ts boardDirtForRow returns `{all: true}` for any step in BOARD_CROSS_TASK_STEPS
      (daemon.boot) and for a `pr.opened` with plan_only true. The header names why: environmentChangedSince,
      lifetimeDispatchTally and isPlanOnlyFilingPr (src/lib/status.ts) read those rows whole-ledger.
    - Whether a task's derivation consults them depends on the task: environmentChangedSince matters only to a
      task held by an independent-failure block, and isPlanOnlyFilingPr only to a task with an open or merged PR.
      A task that did not consult them cannot change when one is appended.
    - W1-T6016 solved the same shape for GitHub: each task's GitHub reads are recorded (recordingGithub) and
      replayed against the new gateway, and only a task whose answers moved re-derives (githubDigest).
    - Persisted reuse already survives a serve restart (task_projection with stamps). A serve deploy still
      re-derives everything through codeVersion in the global stamp; that is correct for a code change and is
      not this task.
