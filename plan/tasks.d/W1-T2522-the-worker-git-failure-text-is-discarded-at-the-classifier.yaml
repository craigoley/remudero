  rationale: |
    SUPERSEDES W1-T2518'S REMEDY, WHICH WAS WRONG AND WOULD HAVE SHIPPED GREEN. That shard priced
    "wire `expectedRunMs` at the keychain call site". Its ONLY consumer, `ensureWorkerKeychain`, is
    called inside `if (platform === "darwin")` (worker.ts:1042) and the fleet runs in a LINUX
    container, so the fix could not have touched a single one of the incidents it was filed from.
    W1-T2518's other half — that `expectedRunMs` has zero callers — remains true and unaddressed;
    it is simply not the cause. This task carries the part that is actionable now.

    TWO MORE HYPOTHESES DIED THE SAME WAY, RECORDED SO NOBODY RE-DERIVES THEM:
      "the worker never gets a token"  — refuted: env.ts:89's ALLOWLIST includes "GH_TOKEN".
      "the token expired mid-run"      — refuted by the daemon log: the ORCHESTRATOR's fallback push
                                         SUCCEEDS with the SAME GH_TOKEN, in the same minute,
                                         immediately after the worker's push failed. A token that
                                         works for one process is not expired for the other.
    And the non-darwin branch is explicit that it does not gate on expiry at all: "An EXPIRED token
    is reported and ALLOWED THROUGH … refusing there would be a bound firing on a healthy
    condition." That reasoning is about the CLAUDE credential; the failure is git/gh.

    SO THE CAUSE IS SOMETHING ABOUT GIT/GH INSIDE THE WORKER SANDBOX, AND NOTHING RECORDS IT. The
    credential helper is set `--global` by the entrypoint and resolves HOME-relatively, while every
    worker's HOME is redirected to a scratch directory; `.gitconfig` IS granted into that home, so
    the helper line probably travels — whether the `!f() { … }` function then executes under the
    worker's isolated shell is exactly what nobody has checked. That is a fifth hypothesis, and it
    deserves the same treatment as the four before it: measurement, not argument.

    THE SEAM, AND WHY THIS IS CHEAP. run-task.ts:11328 writes
    `log("fallback_push.cause", { branch, cause: pushCause.cause, detail: pushCause.detail })`.
    `cause` is a class and `detail` is a FIXED string per class ("the worker's own transcript/stderr
    carries a git/gh authentication failure") — the same sentence on all 15 rows. The classifier has
    ALREADY read the worker's transcript and stderr to decide the class; the evidence is in hand at
    the moment it is thrown away. This is the fourth instance of that pattern this session, after a
    parsed-but-unread reset time, an `apiError` that never reaches the dispatch loop, and
    `fallback_push.cause` itself having no consumer.

    RE-DERIVE RATHER THAN TRUST THE 15: `rmd ledger-grep 'fallback_push.cause'` over the union,
    filtered to `"cause":"credential_expired"`. The step does not exist before 2026-08-25T22:54Z
    (W1-T2267 introduced it), so an earlier zero is a query-shape zero, not an onset.

    IT MUST NOT LEAK A CREDENTIAL. The whole value here is a verbatim failure message, and git/gh
    failures can echo a URL carrying a token. The carried text must be bounded and must be scrubbed
    the same way every other ledgered excerpt in this repo is, or this trades an unknown cause for a
    secret in a file the console renders.

    NOT IN SCOPE: fixing the credential path — nothing yet establishes what breaks it, and a fix
    aimed at the wrong one ships green and closes the finding. That is W1-T2518's lesson, paid once.
