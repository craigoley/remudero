  note: |
    FILED 2026-09-01 by an Architect plan PR, from the follow-up harvest of run
    W1-T2460-1788054755234 (proposal followup:...:2026-08-30T01:56:15.532Z:1, which asked why a fresh
    worktree's base e9454618 sat 1553 commits behind main and whether that is systemic). The harvest
    asked a research question; this ratifies it as a MEASUREMENT, because the honest answer to "why"
    is that the record does not say, and a second dig would leave the third instance equally blind.
    NO HARD depends_on ON W1-T405, deliberately, and the reason is worth recording. W1-T405's mechanism
    is LIVE IN SOURCE at this sha — assertWorktreeBaseCurrent, recordWorktreeBase and
    WorktreeBaseStaleError all cite it by name in worker.ts — while
    plan/tasks.d/W1-T405-stale-base-is-only-detected-after-a-full-run.yaml still reads status: queued.
    A hard edge would therefore strand this task behind a CREDITING artifact rather than behind unbuilt
    work, which is the W1-T75 bootstrap seam in a new place. Expressed as a source citation instead
    (W1-T233's own precedent for exactly this). Whether that shard is a crediting zombie is a separate
    question and is deliberately NOT smuggled into this filing.
    HYPOTHESIS CHECKED AND REJECTED RATHER THAN FILED, recorded so nobody re-derives it: the container
    entrypoint's sync_tree (deploy/entrypoint.sh) REFUSES to sync on any tracked modification and then
    continues, and the freshness/blocked/environmental restart loops re-enter that same refusal — so a
    single tracked edit in the bind-mounted checkout can pin the container's CODE indefinitely while
    every boot reports a checkout line. That is a real hazard and the entrypoint's own comments already
    name the shape. It is NOT this defect: worktreeAdd fetches and cuts from the remote-tracking ref, so
    a pinned checkout does not by itself produce a stale worktree base. If the ledger line this task
    adds ever shows base == local_ref_head with both behind the remote head, THAT is when the
    provisioning path becomes the suspect — which is the whole point of recording it.
    risk:high is Rule 19's span (worker.ts + run-task.ts), recorded as a regrade rather than worked
    around: the assertion and the distance belong in the worktree helper, the ledger call sites belong
    in the dispatcher, and splitting them yields a sensor that measures with nowhere to write and a
    ledger line with nothing to write. Same atomic-coupling exit as W1-T240/W1-T250. The behaviour
    change itself is additive fields on lines that already exist.
