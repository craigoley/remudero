- id: W1-T3013
  title: "THE LOCAL COVERAGE GATE PASSES VACUOUSLY ON A DIFF IT FAILED TO COMPUTE — `mergeBaseDiffText` returns `res.stdout` without reading `res.status`, and `diff-coverage.mjs` prints OK on an empty diff, so `preflight --ci-parity` reports `diff-coverage: OK` for a PR CI then blocks; `runPreflightCoverage` ALREADY refuses that exact condition and the ci-parity entry does not"
