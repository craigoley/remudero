  rationale: |
    ── THE REQUEST WAS TO RAISE THE CAP. MEASUREMENT SAYS THAT DELIVERS NOTHING ────────────────

    `DAEMON_DRAFT_BATCH_CAP` is widely read — including in the request that prompted this — as a
    CONCURRENCY limit on in-flight Architect spawns. IT IS NOT. `runDraftRung` (lib/inbox.ts) is

        for (const proposal of toDraft) { ... await deps.spawn(proposal, prompt) ... }

    a strictly sequential for-await, and `draftProposalBatch` materialises ONE worktree that every
    proposal in the batch is drafted against. So a batch of N costs N x the per-draft duration END
    TO END, and the number of drafts finished per hour is set by DURATION ALONE.

    MEASURED 2026-09-01 over the three-form union, on the 28 real drafts since the refusal fix
    (the earlier population is unusable — those returned in ~2s because they were session-limit
    refusals, not work):

        median draft duration ............ 320s   (p90 464s, max 593s)
        observed throughput .............. 7.7 drafts/hour over 3.63h
        SEQUENTIAL ceiling at 320s ....... 11.2 drafts/hour — AT ANY CAP
        observed / ceiling ............... 69%

    RAISING THE CAP MOVES NEITHER NUMBER. At cap 3, 6 or 12 the ceiling is 11.2/hour; only the
    batch gets longer. That is the whole finding, and it is why this task is filed instead of a
    one-line constant change being made.

    ── ⚠ AND AFTER W1-T2582 IT IS ACTIVELY HARMFUL, WHICH IS A CONSEQUENCE OF OUR OWN FIX ──────

    `await draftHook()` sits INSIDE `buildSweepHook`'s closure, so the draft batch is part of
    `deps.sweep()`. W1-T2582 makes `runGatedSweep` DECLINE a new pass while a previous one is still
    executing — correct, and it is what stops the duplicate passes that cost $123.30. Its
    consequence is that a slow sweep-borne rung now BLOCKS every other one instead of being
    duplicated by it:

        cap 1:   320s of sweep occupancy   (under the 559s wall-clock bound)
        cap 3:   961s                      (1.7x the bound — today's setting)
        cap 6: 1,922s                      (32 minutes with dispose/review/fix stalled)

    So raising the cap converts a no-op on throughput into a linear tax on the disposition, review
    and fix rungs. ⚠ SEQUENCING, CORRECTED WHILE THIS WAS BEING FILED: at first drafting W1-T2582
    was UNMERGED, so this was a PREDICTION. It merged at 2026-09-01T21:28:09Z (7 `SweepLiveness`
    references now on main), so the starvation is LIVE, not predicted — today's cap of 3 already
    occupies the sweep for 961s per batch. The prediction and its confirmation are both recorded
    because a reader who finds this after the fact should be able to tell which parts were derived
    and which were observed.

    ── WHAT THE ACTUAL LEVER IS, AND WHY IT IS NOT A ONE-LINER ────────────────────────────────

    Concurrency. Three drafts in parallel finish in ~320s rather than 961s: 3x the rate AND a batch
    that fits under the sweep bound, removing the starvation instead of adding to it. 282 proposals
    drain in ~8 hours instead of ~25.

    ⚠ IT NEEDS A WORKTREE DECISION FIRST, AND THERE IS NO PRECEDENT HERE TO COPY. Every draft in a
    batch currently shares ONE worktree on ONE per-attempt branch. Concurrent workers in a shared
    cwd is unprecedented in this repo — `specialist-panel.ts` and `flight-judge.ts` both spawn one
    worker at a time, and a sweep of `src/` finds no `Promise.all` over `spawnWorker` anywhere. So
    "the workers only read, sharing is fine" is an ASSUMPTION, and the workers run under
    `bypassPermissions`. Either give each concurrent draft its own worktree, or prove the shared
    one is safe; do not assume it.

    THE THIRD OPTION, NAMED SO IT IS NOT REDISCOVERED: reduce per-draft duration. That is the mount
    /model half and belongs to W1-T2559, not here.

    NOT IN SCOPE: the batch cap's VALUE (raising it is what this task shows to be pointless), the
    re-entrancy guard (W1-T2569), the exclusion (W1-T2582) and the refusal deferral (W1-T2590), all
    of which are correct and none of which this changes.

    ── CRITERIA 1 AND 3 SHIPPED ELSEWHERE ON 2026-09-02; CRITERION 2 IS OPEN AND NOW LOAD-BEARING
       (measured 2026-09-04) ─────────────────────────────────────────────────────────────────

    `perf(inbox): parallelize capped draft batches` (#3588, W1-T2664) landed the day after this
    was filed and replaced the sequential for-await this rationale measures. `runDraftRung`
    (lib/inbox.ts) now runs an indexed worker pool — `Promise.all` over `concurrency =
    Math.min(DAEMON_DRAFT_BATCH_CAP, toDraft.length)` lanes — whose own comment states the goal in
    this task's words: "makes elapsed time approach the slowest proposal instead of their sum".
    That is criterion 1, and criterion 3 with it (the sweep-bound crossing was #3588's own
    motivating evidence). This task carries no `Remudero-Task:` credit for either.

    ⚠ CRITERION 2 IS NOT SATISFIED, AND PARALLELISING WITHOUT IT IS WHAT MAKES IT MATTER.
    `draftProposalBatch` (run-task.ts) still materialises ONE worktree per batch —
    `createDaemonLaneWorktree(...)` — and the `spawn` closure it hands to `runDraftRung` passes
    that single `worktreePath` as `cwd` for every lane. So up to `DAEMON_DRAFT_BATCH_CAP`
    concurrent workers now share one checkout where before exactly one ran at a time.

    THE SHARING IS ASSERTED SAFE, NOT SHOWN SAFE — THE DISTINCTION THIS CRITERION EXISTS FOR.
    `inboxDraftPrompt` tells the worker: "You have NO Write/Edit/Bash tools — you cannot touch a
    file or run git." That is PROSE IN A PROMPT. Measured against what the harness enforces:
    `settings/worker.json` carries `allow: []` and a `deny` list of exactly four READ paths
    (ssh, aws, remudero config, service-tokens) — nothing about Write, Edit or Bash — and the
    spawn passes `permissionMode: "bypassPermissions"`. Worker HOMES are already isolated
    (`perRunWorkerHomeDir(..., { perSpawn: true })`); the `cwd` is not.
    A model that ignores one sentence can write into a checkout N-1 siblings are reading.

    TWO ROUTES CLOSE IT AND THE CHOICE IS NOT THIS RECORD'S TO MAKE:
      (a) ENFORCE the claim the prompt already makes, so the sharing becomes provably read-only.
          The plan text is passed IN the prompt (`inboxDraftPrompt(proposal, currentPlanText,
          runId)`) and the outcome is parsed from the TRANSCRIPT, so a draft worker has no
          established need to touch the tree at all.
      (b) GIVE EACH LANE ITS OWN WORKTREE. Correct, and it multiplies checkout disk by the cap on
          a host that hit 100% full on 2026-09-01 (W1-T2585) — a cost worth naming before paying.

    (a) is cheaper and matches what the prompt already promises; (b) is stronger. RECOMMEND (a)
    unless an operator wants the stronger isolation.

