  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`. Blast radius is one
    assignment plus whatever design (iv) rules; the check itself is unchanged and cannot block.
    `verify: human` — design (i) versus (iii) is a cost-and-value ruling about spending ~320
    subprocesses per PR to surface ~15 warnings into a stream of 598. No linter can settle that.
    `src/run-task.ts` IS DECLARED AND IS GENUINELY TOUCHED — the assignment goes beside
    `opts.moduleExists` in `lintPlanCommand`, and there is nowhere else it can go. The cost is
    recorded rather than hidden: at 19,588 lines it serialises this task against every other naming
    it (W1-T471), which is why `files:` is held to TWO paths and why the new suite gets its OWN file
    rather than an append to `test/run-task.test.ts` (which crashes at FILE level under
    `--experimental-test-coverage`). `src/lib/task-linter.ts` is deliberately NOT declared: the check
    is already correct and needs no edit, and declaring a file the implementation never touches trips
    `inverseScopeUntouchedFiles`.
    EVERY CRITERION IS `unit test:` ON PURPOSE — a shard whose proofs are all `grep:` against its own
    path caps its implementation at `proof_exec: 0/N` and additionally draws a `proof-scope` warning
    that blocks in CI's changed-tasks pass.
    A SEPARATE FINDING FROM THE SAME REVIEW WAS DELIBERATELY NOT FILED, and is recorded here so it is
    not re-raised as new. `LITERAL_ONLY_METACHARS_RE` (`src/lib/task-linter.ts`) hand-mirrors
    `escapeRegExp`'s character class — but that class is NOT a pair. MEASURED: the identical class
    (sha256 prefix e5ad1302f6 on the extracted literal) appears in `review.ts`, `status.ts`,
    `reachability.ts`, `verdict-calibration.ts`, `task-linter.ts` and TWICE inline in `run-task.ts`,
    plus `scripts/learnings-assert-check.mjs` and about twenty test files, with FOUR independent
    local `escapeRegExp` definitions. It is the canonical escape idiom, identical everywhere, and at
    the task-linter site it is detection-only — used to NAME which metacharacter a title contains,
    never to decide resolution. A test pinning two of seven copies would be theatre; the only
    coherent remedy is a shared constant across seven files including `src/run-task.ts`, which is a
    much larger change than the risk justifies. NOTHING IS BROKEN THERE TODAY."
