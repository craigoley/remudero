    same module, so nothing else is owed.

    `test/stale-git-config-lock.test.ts` DOES NOT EXIST at 2e7956a3 — a forward-referenced PATH,
    never a guessed symbol — and is a new file because the house rule keeps a coverage-load-bearing
    test out of a shared suite.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text, and this set
    crosses `src/` and `test/`. Blast radius argues DOWN in one direction and UP in the other, and
    both belong on the record: the reclaimer touches one file class in one directory, but a
    predicate loosened toward reclamation corrupts `.git/config`, which is why design (ii) forbids
    it in terms rather than leaving it to judgement.

