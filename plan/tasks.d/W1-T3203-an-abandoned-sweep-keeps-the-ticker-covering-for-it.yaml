- id: W1-T3203
  title: "THE WALL-CLOCK BOUND STOPS THE IN-FLIGHT TICKER AT THE EXACT MOMENT IT BECOMES THE ONLY REVIEW PATH — `liveness.inFlight` is cleared on SETTLE so a detached pass excludes the next one, but `stopSweepTicker()` sits in a `finally` that runs on ABANDON, so from abandon to settle there is no `sweepLight` anywhere and no pass may start: review throughput goes to zero for the whole window"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 12.00
  files: [src/lib/daemon.ts, test/an-abandoned-sweep-keeps-the-ticker-covering-for-it.test.ts]
  origin: "operator-session#daemon-review-throughput-2026-09-08"
  plan_refs: ["W1-T2582", "W1-T2981", "W1-T463", "W1-T1272"]
