- id: W1-T3626
  title: "AGENT CONVERSATION HISTORY FILLS THE ROOT DISK AND WEDGES THE WHOLE HOST — ~/.codex and ~/.claude hold 6.7 GiB with no retention of any kind, growing ~580 MiB/day, and on 2026-09-16 the host reached No space left on device, stopped forking sshd, dropped the tunnel and kernel-panicked"
  repo: remudero
