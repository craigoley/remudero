  falsifier: |
    Against main, the drop test exits 1 with "not by this host (Host.local)" and the ref stays; the lock test reads
    "not stale". If `sameHost` compared first labels in every case, `foo.a.example` and `foo.b.example` would match
    and the table test fails. If a site kept its `===`, its census case in the test fails.
