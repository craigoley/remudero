- id: W1-T12301
  title: "One reader gives the effective CPU capacity a test-slot admission may count: the allowed online CPUs, capped by the cgroup v2 cpu.max quota when it can be read, and UNKNOWN parts named rather than guessed"
  repo: remudero
  depends_on: []
  priority: 1.4
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: low # a new pure reader with injected file reads; nothing consumes it until W1-T12303
  band_meaning: blast-radius
  origin: architect
  plan_refs:
    - W1-T9952
    - W1-T12004
    - W1-T12303
  files:
    - src/lib/effective-cpu-capacity.ts
    - test/the-test-slot-reads-effective-cpu-capacity-from-allowed-cpus-and-the-cgroup-quota.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "With an affinity mask of 8 CPUs and cpu.max reading 400000 100000, the capacity is 4 cores with basis cgroup-quota; with cpu.max reading max it is 8 with basis allowed-cpus"
      proof: "unit test: test/the-test-slot-reads-effective-cpu-capacity-from-allowed-cpus-and-the-cgroup-quota.test.ts"
    - claim: "An unreadable or malformed cpu.max leaves the allowed-CPU count in force and names the quota as UNKNOWN; it is never read as unlimited and never as zero"
      proof: "unit test: test/the-test-slot-reads-effective-cpu-capacity-from-allowed-cpus-and-the-cgroup-quota.test.ts"
    - claim: "The reader is a named export the test slot can consume"
      proof: "grep: readEffectiveCpuCapacity in src/lib/effective-cpu-capacity.ts"
  rationale: |
    Initiative (operator, 2026-11-11): empty-pool suite admission must judge capacity from the CPUs the run may actually use.
    readHostLoad in src/lib/test-slot.ts uses availableParallelism(), which follows the affinity mask but ignores a cgroup CPU quota. A container capped at 4 cores on an 8-core host is then priced as 8.
    Settled by lookup: is this already filed? -> no. W1-T9952 sizes the pool from cores and load1; W1-T12004 adds CPU pressure to static stages; neither reads a quota (plan/tasks.d/W1-T9952-*, plan/tasks.d/W1-T12004-*).
    Settled by lookup: does any reader of cpu.max already exist? -> no. A grep of src/ for cpu.max finds nothing; review-capacity.ts reads only cpu.pressure, and lane-governor.ts reads only the cpu.weight share (src/lib/review-capacity.ts:712, src/lib/lane-governor.ts:394).
    Settled by lookup: which online-CPU reading is in use? -> availableParallelism() from node:os, which follows sched_getaffinity (src/lib/test-slot.ts:185).
  design: |
    readEffectiveCpuCapacity(read?, allowed?) returns { cores, allowedCpus, quotaCores?: number, basis: "cgroup-quota" | "allowed-cpus", unknown: string[] }.
    allowed defaults to availableParallelism(). The quota is the first cpu.max that can be read: /sys/fs/cgroup/cpu.max, which is the process's own cgroup in a cgroup namespace. "max" means no quota. A quota is quota/period, rounded down, at least 1. cores is the smaller of allowedCpus and quotaCores.
    File reads are injected, so the tests need no host. No constant is added.
    NOT IN SCOPE: changing readHostLoad or any admission rule (W1-T12303 wires this in), cgroup v1, and the cpu.weight share.
  falsifier: |
    Ignore cpu.max and criterion 1 must fail. Read an unreadable cpu.max as max, or as 0, and criterion 2 must fail. Restore and require both to pass.
  note: |
    Filed by PLAN-create-1794411017336 from the reserved ids, in order.
