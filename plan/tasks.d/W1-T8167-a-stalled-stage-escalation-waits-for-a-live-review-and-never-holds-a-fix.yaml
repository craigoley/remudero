  falsifier: |
    Leave the awaiting-review backstop blind to a live review: the #10848 fixture escalates at 33 minutes with a review
    admitted and unposted, and "a review still running is not escalated" fails. Escalate the stall with no cause, or
    with "review": the fix rung's probe matches the stall issue and stands down, and "an open stall issue does not
    stand a fix round down" fails. Suppress every awaiting-review escalation: the no-owner stage never escalates, and
    "an awaiting-review stage with no live owner still escalates" fails.
