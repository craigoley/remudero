- id: W1-T3853
  title: "SELF-IMPROVEMENT NEEDS A FALSIFIABLE EXPERIMENT RECORD — tie each proposed change to a hypothesis, baseline, observation window, measured outcome, and rollback path instead of calling acceptance success"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  risk: high
  band_meaning: blast-radius
  origin: "research:self-improving-systems-2026-09-20"
  plan_refs: ["§Self-improvement", "W1-T3795", "W1-T3800", "W1-T3852"]
  files: [src/lib/operator-agent.ts, src/lib/serve.ts, openapi/daemon.yaml]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED on public main 089af54ccefc4a38c3666c632e1a8a3eb93d6992: `operator-agent.ts` already
    records bounded proposals, operator decisions, later outcomes, and scoped settings. W1-T3795
    catalogs measured revert/follow-up outcomes, W1-T3800 adds replay calibration for a risk judge,
    and W1-T2925 records measurement deltas. Those are valuable pieces, but no one durable record
    currently states the hypothesis, the exact intervention, the baseline it is compared with, the
    observation window, and the rule that would roll the change back.

    The strongest self-improvement systems do not treat a recommendation being accepted as proof
    that it helped. Sentry ties resolution/regression to a newer release; Datadog turns an incident
    timeline into a postmortem and follow-up actions; Temporal makes the event history and external
    signals durable. Remudero should adopt the discipline while keeping the human approval and git
    review boundary: the system may propose and measure, but it must not silently change production
    policy because a model sounded confident.
  design: |
    Extend the durable operator-agent contract with a versioned `experiment-v1` record stored in
    the existing ledger source of truth. An experiment names:

    - a falsifiable hypothesis and the bounded intervention/plan or PR it proposes;
    - repository, task, lane, provider/model-policy scope, and evidence anchors;
    - baseline metric(s), denominator, comparison population, and observation window;
    - explicit states such as proposed, approved, observing, succeeded, neutral, regressed,
      rolled_back, expired, and unmeasurable;
    - the rollback/refusal path and the authoritative receipt or PR that proves what happened.

    Acceptance is only an operator decision. Promotion requires a later observed outcome; an
    absent denominator, mixed attribution, stale source, or insufficient window is
    `unmeasurable`, never success. A rollback is a new durable event linked to the experiment, not
    deletion or mutation of its history. Keep the contract bounded and redacted: no raw prompts,
    credentials, account identifiers, or arbitrary model prose in the experiment index.
  acceptance:
    - claim: "an experiment validates hypothesis, intervention, scope, baseline, denominator, observation window, and rollback metadata before it can be approved"
      proof: "unit test: self-improvement experiment refuses an incomplete hypothesis baseline window or rollback"
    - claim: "operator acceptance remains distinct from measured success and cannot create a helped outcome at decision time"
      proof: "unit test: accepting a self-improvement experiment leaves outcome unmeasured until a later observation"
    - claim: "missing attribution, below-floor populations, stale sources, and mixed lanes become unmeasurable rather than a favorable result"
      proof: "unit test: self-improvement experiment reports unmeasurable instead of a success rate"
    - claim: "regression and rollback append linked durable events and preserve the original experiment history"
      proof: "unit test: a regressed self-improvement experiment records rollback without rewriting history"
    - claim: "the experiment projection is bounded, versioned, redacted, and read from the ledger union across rotation"
      proof: "unit test: self-improvement experiment history preserves version redaction and rotated evidence"
  falsifier: |
    Mark an experiment helped when the operator merely accepted it; omit a denominator or observation
    window and return a percentage; overwrite the original record during rollback; or let a raw
    prompt, credential, account id, or unbounded model explanation enter the index. Each change must
    make the corresponding criterion fail.
  note: "This is the measurement contract for self-improvement, not an automatic policy mutator. Existing proposal, approval, replay, and outcome tasks remain the producers and consumers."
