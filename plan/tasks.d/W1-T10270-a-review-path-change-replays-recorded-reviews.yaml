  falsifier: |
    Restore #12954's required-semantic-review.ts and its run-task.ts gate with `git show
    8b37a0a1b:<path>`. The second test must go red on the bootstrap sample's posted rows without
    budget_usd, and on any recorded all-PASS row. Leave the metadata gate inline in reviewCommand
    instead of in classifyReviewOutcome. The replay then cannot see the setup refusal, and the
    routing test fails. Let the refresher keep rows from a regressed sha. The 10-20 withholds then
    become the expected class, and the refresher test fails.
