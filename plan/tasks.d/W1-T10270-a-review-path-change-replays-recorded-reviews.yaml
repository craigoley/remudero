  rationale: |
    READ on origin/main 04ed915a7 (2026-10-20).

    #12954 PASSED CI AND BROKE EVERY REVIEW. It changed src/run-task.ts (reviewCommand's metadata
    gate at :23313-23340 and runReview's refusal at :8683) and added
    src/lib/required-semantic-review.ts. It also edited three review tests
    (event-driven-semantic-review, an-untasked-pr-silently-skips-the-semantic-reviewer and
    codex-reviewer-production-wiring) to expect the new behaviour. The suite therefore agreed with
    the change by construction. Production did not: see W1-T10269's measurements. All 271
    `review.semantic_incomplete` rows carry reviewer_outcome=success, and 379 setup refusals
    landed on shards without budget_usd.

    THE EVIDENCE THAT WOULD HAVE CAUGHT IT IS NOT KEPT.
      - The reviewer's REVIEW_VERDICT lines are parsed (parseReviewerVerdicts, src/lib/review.ts:7225)
        and then thrown away.
      - `review.reviewer` rows carry subtype, model and tokens. `review.reviewer.materialized`
        carries head_sha and node_modules. No row carries the verdict lines.
      - state/transcripts holds fix and implement transcripts, not reviewer ones.
    So "replay recent real reviews" needs a recorder first.

    THE DECISION IS SPREAD ACROSS TWO FUNCTIONS. The setup refusal lives in reviewCommand and the
    semantic refusal in runReview. A replay that drives only one of them misses half of #12954. A
    replay is only as good as the seam it drives, so the decision has to become one pure function
    that production calls.

    THE REVIEW-PATH FILE LIST HAS A HOLE. REVIEW_MATERIAL_ADVANCE_PATHS (src/lib/self-sync.ts:865)
    does not list src/lib/required-semantic-review.ts. A change confined to that module would not
    count as a review-path change.
  design: |
    1. ONE PURE DECISION (src/lib/review-outcome-class.ts, new).
       - classifyReviewOutcome(input) returns the verdict class: posted, withheld or refused, plus
         the reason. The input is: plan_only, required-semantic, criteria_count, risk present,
         budget present, untasked, reviewer_outcome, and the reviewer transcript's verdict lines.
       - It composes the HEAD's own parseReviewerVerdicts, requiredSemanticRefusal and the
         head-task-metadata gate. reviewCommand and runReview both call it at their existing
         decision points, so production cannot decide outside it.
       - A wiring test asserts the two production call sites route through it.
    2. THE RECORDER. Every terminal review appends `review.replay_input` with the fields above.
       - verdict_lines are the transcript's lines matching `REVIEW_VERDICT <n>: <TOKEN>`, verbatim
         and bounded per criterion, with clauses dropped. They are extracted by a plain line scan,
         NOT by parseReviewerVerdicts: the recorded evidence must not depend on the code under test.
       - The row also carries the class it produced, reviewer_code_sha (W1-T10269) and an input
         digest. It holds no transcript prose and no secrets.
    3. THE SAMPLE IS DERIVED, NEVER HAND-PICKED (src/lib/review-replay-sample.ts, new).
       - `rmd review-replay refresh` reads `review.replay_input` rows from the ledger union.
       - It drops rows from reviewer code shas that a W1-T10269 incident marked regressed, so a bad
         window cannot become the expected answer. The 10-20 withholds would otherwise be recorded
         as truth.
       - It keeps every distinct input shape (deduped by input digest) in the retained window, so
         there is no count knob.
       - It writes test/fixtures/review-replay/sample.ndjson with a header naming the window, the
         generator revision and the classes observed.
       - It refuses to write a sample that drops a class the window observed.
       - A garden registered in src/lib/garden-registry.ts runs the refresh. It opens a
         chore(test) PR when the derived sample differs.
       - The test rejects a sample whose rows fail the header's digest, which catches a hand edit.
    4. THE REPLAY GATE (test/review/a-review-path-change-replays-recorded-reviews.test.ts).
       - Every sample row is fed through the HEAD's classifyReviewOutcome. Its class must equal
         the recorded class. On a mismatch, the test names the row's PR, its recorded class, the
         head's class and the reason.
       - The test fails on an empty sample, and on one missing a class its header says was
         observed. It never passes while comparing nothing.
       - selectAffectedSuites (src/lib/affected-suites.ts) maps the review path to this suite. The
         review path is REVIEW_MATERIAL_ADVANCE_PATHS plus the src/lib modules the review-path
         units import, transitively. So a change to any of them, including
         required-semantic-review.ts, always runs it.
    5. BOOTSTRAP. The implementation PR seeds the sample with the refresher from rows the ledger
       already has.
       - The setup-gate inputs are reconstructable now from review.reviewer.skipped,
         review.reviewer.untasked_defaults and review.posted. Shards without budget_usd were
         reviewed and posted on 10-16..10-19.
       - Rows whose verdict lines were never recorded are marked `verdict_lines: unrecorded`. They
         are replayed only through the setup gate.
       - The garden's first refresh after deploy adds recorded semantic rows. Until then, the test
         prints which classes are covered by recorded verdict lines.
    Tests use `test(` titles exactly as in the proofs below and no real reviewer spawn.
