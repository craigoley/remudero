      proof: 'grep: test("W1-T9243: the drain closed read stops at the oldest pushed run branch" in test/the-drain-and-status-closed-pr-reads-stop-where-their-question-ends.test.ts'
    - claim: "an unparseable run branch epoch makes the drain read walk to the short page, never stop early"
      proof: 'grep: test("W1-T9243: an unparseable run branch walks to the short page" in test/the-drain-and-status-closed-pr-reads-stop-where-their-question-ends.test.ts'
    - claim: "the status gateway's merged list returns merged rows past the old 1000-row cap, and with a snapshot pages only the delta"
      proof: 'grep: test("W1-T9243: the status merged list is complete and reads only the delta" in test/the-drain-and-status-closed-pr-reads-stop-where-their-question-ends.test.ts'
    - claim: "the fixed drain page cap is gone"
      proof: "grep: oldestPushedRunBranchEpoch in src/run-task.ts"
    - claim: "the new test file passes"
