- id: W1-T9243
  title: "THE DRAIN'S AND STATUS.TS'S CLOSED-PR READS STOP WHERE THEIR QUESTION ENDS, NOT AT A FIXED PAGE CAP — readRunBranchClosedPrsOutput walks up to RUN_BRANCH_CLOSED_PR_MAX_PAGES 8 pages on every drain pass, and ghGateway's listMergedHeadBranches reads listPullsByState(\"closed\", 1000), silently dropping every merged PR past the newest 1000 of about 11,300 closed"
  repo: remudero
  depends_on: []
