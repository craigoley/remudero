  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern, the two fixed-cap closed reads take derived bounds; it spans the drain's reader (run-task.ts), the unbatched gateway (status.ts) and one new test, and the drain read decides whether a duplicate build starts
  band_meaning: span
  origin: "operator session 2026-10-13: W1-T9113 and W1-T9100 both name these two fixed caps as follow-ups and file neither"
  plan_refs: [W1-T9113, W1-T9100, W1-T9121, W1-T1207, W1-T2323, W1-T257, W1-T916]
