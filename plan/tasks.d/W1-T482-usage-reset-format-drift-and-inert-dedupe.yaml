    `files:` IS DERIVED BY INVOCATION COUNT, COUNTING OCCURRENCES RATHER THAN LINES, and is kept to
    three paths. `src/lib/daemon.ts` holds BOTH the parser and the emitter, so it is genuinely
    touched. `test/daemon.test.ts` invokes `parseResetInstant(` 6 times and `resolveHeadroomLimitPct(`
    8 — the heaviest parser coverage. `test/usage-reset-unrecognised.test.ts` is the ONLY file
    invoking `priorUnrecognisedResetStrings(` (twice) and is where the dedupe change must be proven.
    DELIBERATELY EXCLUDED, with reasons: `test/headroom-past-dated-ceiling.test.ts` (10
    `resolveHeadroomLimitPct(` but only 1 `parseResetInstant(`) asserts the negative-hours clause, and
    `test/headroom-resetless.test.ts` (5 and 1) asserts the null-instant fallback — this task makes
    that fallback fire LESS OFTEN but does not change what it returns, so neither file's assertions
    move.

    DECLARING `src/lib/daemon.ts` IS EXPENSIVE AND IS DONE WITH EYES OPEN: 36 tasks already declare it
    in `files:`, so `partitionByFileOverlap` will serialise this task against every one of them that
    is eligible at the same tick. It is declared anyway because the parser and the emitter both live
    there and cannot be fixed without it. The shard's own path is NOT declared — adding it converts
    the endemic proof-scope warnings into one hard `rule15-filing` violation."
