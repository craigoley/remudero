  principles: {tdd: strict}
  budget_usd: 4.00
  risk: high  # Rule 19: one concern, whether a refusal from an older contract revision may still become an amendment; a refusal on the live contract drafts exactly as today
  band_meaning: blast-radius
  origin: "coordinator brief f1021b item 6 (2026-10-21), from the #13039 builder's root-cause work (logs-8864/s13039-*, RESUME-1019 10-21 ~05:45Z); builds on PR #13318 (merged 08:34Z, commit 8b83ad0dc), which records `contract_revision` on `fix.needs_design`"
  plan_refs: [W1-T4838, W1-T5531, W1-T9792, W1-T3579, W1-T9265]
  files:
    - src/lib/refusal-amendment.ts
