- id: W1-T10337
  title: "A WORKER REFUSAL MADE AGAINST A SUPERSEDED TASK CONTRACT IS NEVER DRAFTED AS AN AMENDMENT — #13235 (merged 2026-10-20T23:09Z) stamped W1-T9265's 20:30Z fix-round refusal onto a shard the operator's #13214 had already corrected at 20:59Z, and held the task again, because `noPrVerdictRowsFromLedger` reads no contract revision off a `fix.needs_design` row and `draftRefusalAmendments` never compares one with the live task"
  repo: remudero
  depends_on: []
