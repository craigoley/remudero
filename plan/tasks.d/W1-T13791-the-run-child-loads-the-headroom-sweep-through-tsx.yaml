- id: W1-T13791
  title: "The run child loads the mount headroom sweep through tsx's tsImport, as the config gardener does: since run-child mode went live on 2026-10-16 every mount exploration fails with \"TypeScript parameter property is not supported in strip-only mode\", because a plain import() of scripts/mount-headroom-sweep.mjs runs src/lib/retro.ts through Node's strip-only mode, and no run has ever explored a mount"
