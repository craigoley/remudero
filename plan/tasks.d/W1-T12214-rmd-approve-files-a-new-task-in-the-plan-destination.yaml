  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 9 merges were ratifications from `rmd approve`.
    - `approveCommand` and `approveBatchCommand` in src/run-task.ts make a worktree with `addApproveWorktree` and open a pull request with `createPlanPrRest`. The owner and the name are those of the public repository.
    - The command runs `planPrPreflight` on its worktree before it pushes.
    - This is one of five writer tasks. Each one waits for the readers of both catalogs.
    - The switch is the host file `<state dir>/plan-destination.json`. If the file is absent, the switch is off and the behaviour is byte-identical to today. Removing `task` from the kinds turns this kind off.
  design: |
    In both commands, call `resolvePlanDestination("task")` for an approval that adds a task file. Pass its checkout to `addApproveWorktree` and its owner and name to `createPlanPrRest` and to the probe.
    For an approval that changes a task file, find the repository that holds it with `findTaskInCatalogs`.
    The preflight takes the code root from the earlier task of this filing.
    NOT IN SCOPE: the inbox, and the proposals that an approval reads.
  falsifier: |
    Open the pull request in the public repository with the kind on and criteria 1 and 2 must fail. Probe the public repository for an approval that goes to the destination and criterion 4 must fail. Restore and require all six to pass.
