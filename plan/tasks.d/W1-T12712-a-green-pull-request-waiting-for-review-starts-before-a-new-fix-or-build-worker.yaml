  rationale: |
    WHY: a green pull request is one review away from merge. Today a fix or build worker that starts first takes the budget
    lane, and the green pull request waits.
    MEASURED read-only on the Azure host, ledger and rotated archives 2026-11-11 20:25Z to 2026-11-14 20:25Z:
    - 709 heads became review-eligible; 585 got a posted verdict. Eligible to posted: p50 0.13 h, p90 1.06 h, max 3.77 h.
      By day, p50 0.06, 0.08, 0.13, 0.26 h and p90 0.15, 0.55, 1.23, 1.21 h: the wait is growing.
    - 839 review.capacity rows. Width was 1 to 4 (base 4, max 8) and never above base: 0 rows.
    - In the 277 rows with a review queue of 3 or more: mean width 2.7, mean active workers 5.1, of which 1.7 reviews
      (cpu_phase_in_flight plus judge_phase_in_flight) and 3.4 other workers. Reason host-worker-budget in 154 of 277.
    - Reasons over all rows: backlog-not-sustained 391, host-worker-budget 341, healthy-window 37, review-history-insufficient
      22, cpu-pressure 21, cpu-pressure-not-review 19. Queue depth reached an hourly mean of 9.5 on 2026-11-14 19Z.
    READ at origin/main 5d1670adc:
    - src/lib/review-capacity.ts:567-572: the host-worker-budget arm compares all active workers plus one to the budget, and
      restoreBase (:405) leaves only budget minus active workers.
    - Fix capacity (src/lib/sweep.ts, the fix_capacity row) and the daemon's build dispatch take lanes from the same budget
      first come, first served.
    OPEN RELATED WORK, not duplicated: W1-T2989 (#18501) counts only local-CPU workers against the budget, so reviews waiting
    on the model stop counting; W1-T12535 (#18515) retries a refill held at bound 0; W1-T12534 (#18533) queues a head by its
    CI-green time; W1-T12529 (merged) restores base width under CPU pressure that is not review's. None of them decides who
    gets a freed lane when a review and a new fix or build both want it.
  design: |
    INVARIANT no-starvation: precedence holds a new fix or build only while a green head waits longer than one cadence.
    INVARIANT in-flight-untouched: running workers are never stopped.
    The budget value does not change. This orders who starts next; it adds no limit.
    1. src/lib/review-precedence.ts (new): export pure `reviewPrecedence({ waitingGreenHeads, cadenceMs, nowMs, widthReason })`.
       It returns yield or proceed. reviewPrecedence lives in a new module because review-capacity.ts is over its
       source-size ceiling and W1-T2989 changes it; the new module leaves that file unchanged.
       The module also reads the inputs: a waiting green head is a green head whose newest sweep.disposed row has
       blocker awaiting-review at the same head (its blocker_since is when the wait began), and the width reason is
       the reason of the newest review.capacity row. The sweep records each pass's reading in the module, and the
       daemon's build dispatch decides on the newest reading. A reading older than two cadences holds nothing.
    2. src/lib/sweep.ts: before the fix lane admits a new round, read the last width decision and the waiting green heads
       (the review queue the light pass already holds) and call reviewPrecedence. On yield, do not start the round; write
       sweep.budget_yield once per held spell. A fix round for a pull request whose own red blocks its review is not held:
       that pull request is not waiting for review.
    3. src/lib/daemon.ts: the build dispatch makes the same call before it starts a worker. Add no comment lines to
       daemon.ts (it is at its comment cap); explanations go in the why-file. The call sits in the worker admission
       hold as a REVIEW hold, read only by the dispatch and lane-refill surfaces; intake, retro, triage and the
       wipe test are never held.
    4. Declare sweep.budget_yield in src/lib/ledger-steps.ts.
    Build after W1-T2989, which changes the same budget arithmetic.
    NOT IN SCOPE: the budget value; review width growth above base; provider-phase counting (W1-T2989).
  falsifier: |
    Return proceed always and criteria 1 and 2 must fail. Hold dispatch after the wait clears and criterion 3 must fail.
    Stop a running worker and criterion 4 must fail. Change a decision with no review waiting and criterion 5 must fail.
    Restore and all must pass.
