    - claim: "a newer commit with required checks still running over older green evidence reads undetermined, never green, and its reason names the pending commit and the older green commit"
      proof: 'grep: test("W1-T7757: a newer commit with required checks still running reads pending, never green, and names the older evidence" in test/main-health-judges-a-newer-commit-by-its-concluded-required-checks.test.ts'
    - claim: "a required check still running never decides red, and an older completed red stays red while a newer commit is still running"
      proof: 'grep: test("W1-T7757: a running required check never decides red, and an older concluded red stays red beside it" in test/main-health-judges-a-newer-commit-by-its-concluded-required-checks.test.ts'
    - claim: "the 2026-10-10 15:03:50Z shape replays: 916e5ced0 with ci green and its run in progress decides over f76df1f45's completed red"
      proof: 'grep: test("W1-T7757: the 15:03:50Z replay decides from 916e5ced0, not from the older red at f76df1f45" in test/main-health-judges-a-newer-commit-by-its-concluded-required-checks.test.ts'
  falsifier: |
    Restore the `run.status !== "completed"` drop in `mainPushRunHistoryFromResponse`: the in-progress run never reaches
    the walk, the older completed red decides, and the first, second and fifth tests fail. Treat a running required
    check as passing: the third test reads green. Let a pending commit replace an older red: the fourth test reads
    undetermined where it expects red. Walk in run-creation order instead of first-parent order: the replay fixture,
    whose older red run was created after the newer commit's run began, decides from the wrong commit.
