  rationale: |
    MEASURED 2026-11-16 on the operator Mac by the builder of W1-T13146.

    - Since #18545 (W1-T12258, merged 2026-11-15) a beat of scripts/fleet-heartbeat.sh measures every `rmd-*` and `remudero-*` entry of its TMPDIR, one `du` and one `df` each. This suite's `fixture()` starts the scripts with the host's TMPDIR, which held 1,190 such entries that day.
    - An xtrace of one beat in the fixture's environment took 129 s at load 55 to 89; 117 s of it was in `consumer_kb`'s per-path loop, 1,127 `du` calls. Four of the suite's tests run a beat (five beats), which is the 82.6, 42.7, 41.7 and 11.6 s measured for them.
    - The same 15 tests: 179.4 s with the host's TMPDIR (load 5.9); 24.5 s with TMPDIR pointed at an empty directory (load 55 to 87); 15.2 s with a five-line fixture change, host TMPDIR still at 1,190 entries (load 44). All 15 pass each time.
    - That runtime is why the census precheck's 120 s child bound stopped this suite in four author preflights, and why two pull requests needed a one-PR waiver (W1-T13146 raises the bound from history; this removes the cause for this suite).
    - The fixture change exists: one commit, 3e87df0742, held by the operator session on a local branch. It adds `const temp = join(root, "tmp"); mkdirSync(temp);` to `fixture()` and `TMPDIR: temp` to the environment of the scripts it starts. Mutations made then on the real scripts and restored: `deploy/acr-login.sh` recording a failed login as ok gave fail 1; `deploy/serve-container.sh` no longer logging in before its pull gave fail 3.
  design: |
    1. `fixture()` creates a temp directory under its own root and passes it as TMPDIR to every script it starts.
    2. One new test in the suite reads the environment a started script saw (the fixture's existing stubs record their calls) and asserts its TMPDIR is under the fixture root.
    3. One new test names the two mutations above as the suite's guard: it runs the existing mutant path and asserts it still fails.
    INVARIANT the-suite-still-catches-what-it-tests: no existing assertion or expected value changes.
    NOT IN SCOPE: scripts/fleet-heartbeat.sh (W1-T13190); test/fleet-heartbeat.test.ts, which W1-T13157 changes; reaping the leftovers (W1-T13191).
  falsifier: |
    Pass the host's TMPDIR to the scripts again and criterion 1 must fail. Change an expected value so the mutant passes and criterion 2 must fail. Restore and both pass.
