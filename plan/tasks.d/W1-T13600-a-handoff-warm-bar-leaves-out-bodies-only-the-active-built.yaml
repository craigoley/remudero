- id: W1-T13600
  title: "A serve handoff's warm bar counts only the active's bodies the store still holds, so a standby that loads the whole store is not refused for bodies only the active built"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # one concern across three serve files (Rule 19): the standby readiness bar; an active on older code keeps the old bar
  band_meaning: span
  origin: "operator-session#serve-recycle-2026-11-18"
  plan_refs:
    - W1-T13534
  files:
    - src/lib/read-model-worker.ts
    - src/lib/serve-generation.ts
    - src/lib/serve-supervisor.ts
    - test/console-api/serve/a-handoff-warm-bar-leaves-out-bodies-only-the-active-built.test.ts
