    READ at origin/main (symbols, not lines):
    - run-task.ts `runErrorCause` is a closed set of harness causes. A module-resolution throw falls to the generic
      `run-error`, the same cause a defect in the run's own path takes.
    - status.ts `isEnvironmentalBlock` reads only ENVIRONMENTAL_BLOCK_VERDICTS and ENVIRONMENTAL_BLOCK_STAGES
