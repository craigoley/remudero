  design: |
    A DESIGN CALL, recorded here for the builder and the reviewer. The rule: a module the HARNESS process fails to load
    is the environment's, because worker code never runs in the harness process.
    1. run-task.ts `runErrorCause` gains `harness-module-unresolved` for an error whose code is MODULE_NOT_FOUND or
       ERR_MODULE_NOT_FOUND, checked before the generic arm. The verdict row is unchanged apart from `cause`.
    2. status.ts: `isEnvironmentalBlock` also accepts a `failed` verdict whose cause is in a new
       ENVIRONMENTAL_BLOCK_CAUSES set ({harness-module-unresolved}). It is re-offered on W1-T4597's existing
       environment-changed rule (a later daemon.boot on other code, another host, or the cooldown), never as a strike.
    3. run-child-contract.ts: a child failure with either code, and a lost child whose stderr tail shows either code
       before it wrote status.json, settle as `spawn_infra_blocked` (reasonClass blocked_toolchain). The daemon's
       `isSpawnInfraBlocked` then defers the lane, and the daemon keeps running. The run-child mode evidence still
       counts the child as lost, so the mode demotes exactly as it did on 2026-10-16.
    Tests go in a new file, test/a-harness-module-that-cannot-load-is-an-environment-failure.test.ts, with `test(`
    titles verbatim as in the proofs below, using the live messages above as fixtures.
