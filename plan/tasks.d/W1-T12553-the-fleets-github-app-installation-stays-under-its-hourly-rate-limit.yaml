  acceptance:
    - claim: "The installation budget reads the remaining count, the limit and the reset time from each response's x-ratelimit headers. An instance's read allowance until the reset is the remaining count less the write reserve, divided by the number of consumers that share the installation (the registry instances with the same gh_app_installation_id, plus one share for hand runs)"
      proof: "grep: W1-T12553 criterion 1 in test/github/the-fleets-app-installation-stays-under-its-hourly-rate-limit.test.ts"
    - claim: "An instance that has spent its allowance since the latest reading waits for the reset before its next read: the async path awaits a timer and the synchronous path raises the pacer's stand-down error. A newer reading with a larger remaining count gives a new allowance"
      proof: "grep: W1-T12553 criterion 2 in test/github/the-fleets-app-installation-stays-under-its-hourly-rate-limit.test.ts"
    - claim: "invariant:writes-keep-their-reserve — reads stop while the remaining count is at or below GITHUB_WRITE_RESERVE_FRACTION of the limit, and a write (a merge, a review post, a comment, a status) never waits on the budget"
      kind: guard
