    - claim: "Each throttle writes one github.budget.throttled ledger row per consumer and reset window, with the instance, the remaining count, the limit, the reset time, the allowance and the consumer count. A rate-limit refusal from GitHub also writes the row, with reason refused"
      proof: "grep: W1-T12553 criterion 4 in test/github/the-fleets-app-installation-stays-under-its-hourly-rate-limit.test.ts"
    - claim: "With no reading yet, an unreadable registry or no rate-limit headers, the budget gives no allowance limit and the pacer behaves as today. The daemon's start builds the budget from the host registry and every pacer in the process uses it"
