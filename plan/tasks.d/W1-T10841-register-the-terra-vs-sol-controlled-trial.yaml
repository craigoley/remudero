  design: |
    (i) POPULATION. Codex balanced low and medium work as the router actually dispatches it (eligible tasks whose
    selected provider is codex, tier balanced, effort low or medium), frozen through the existing readiness population
    path. Frontier, economy, high effort and every cash or Claude row are out of scope.
    (ii) A/A FIRST. Register a prospective A/A with both labels on gpt-6.1-sol at the task's effort, on one pinned
    stack, subscription only, through `runProspectiveAa` / the readiness path — no new framework.
    (iii) PRE-REGISTRATION, written before any A/B assignment and hashed into the protocol: randomization unit = task;
    arms {codex, gpt-6.1-sol, effort} (control, the lead) and {codex, gpt-6.1-terra, effort} (treatment); primary
    outcome = verified completion (intention-to-treat); guardrails = the existing named ones the pilot already reads
    (for example reopened or reverted merges, repair rounds, wall time, Codex usage share) — reuse, do not invent
    numbers; stopping rule = the pilot's fixed horizon with no interim winner. The pilot request cites #7418 as its
    approval reference.
    (iv) GATES. The A/B registration refuses, by name, without a passing A/A receipt for the same population and stack
    within the pilot's receipt age; and refuses unless the Codex model catalog (`readCodexModelCatalog`) lists
    gpt-6.1-terra at registration time. Any API-billed attempt reserves inside the pilot's $100 ceiling and 7-day
    window; subscription attempts spend no cash.
    (vi) CALL SITE. src/lib/codex-balanced-trial.ts exports registerCodexBalancedTrial, reached from an rmd verb in
    src/run-task.ts (an operator-run registration, the same shape as the existing prospective A/A verb).
    (v) This task REGISTERS; it does not assign live work — W1-T10842 consumes the registration. Sol stays the lead.
