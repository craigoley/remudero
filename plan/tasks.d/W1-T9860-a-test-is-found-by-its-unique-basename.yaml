  rationale: |
    OPERATOR RULING 5 (2026-10-16): a test's unique basename is its identity. A census keeps basenames unique, and every
    path-keyed reader falls back to a basename lookup. Merged proofs are not rewritten, and open proofs need no
    re-pointing. This task is the resolver and the proof executors. W1-T9861 and W1-T9862 move the other readers onto it.
    MEASURED at origin/main a323d87ed (plan/seeds/test-restructure-2026-10-16/taxonomy.md section 7, coupling-inventory.md section A):
    - 3,640 flat test/*.test.ts files, and 3,640 of 3,640 basenames are unique;
    - 9,748 of 14,397 plan proofs name a test path; 147 open tasks cite 202 existing test files.
    Citations re-verified at origin/main 889966ea5 (2026-10-16).
    - scripts/acceptance-author-gate.mjs (~line 597) calls lintTask with `moduleExists: (path) => existsSync(join(REPO_ROOT, path))`
      and keeps only `credited-test-path` violations (creditedTestPathViolations, src/lib/task-linter.ts). This is a
      required BLOCK. A credited task naming test/x.test.ts after x moved is refused, and Rule 15 forbids the worker from
      amending the shard.
    - src/lib/review.ts parseWhitelistedProof turns `unit test: test/x.test.ts` into `node --test ... <path>`, and a
      `grep: ... in test/x.test.ts` into a grep argv on that exact path. judgeCriterion grades it. A ghost path grades
      executed_fail or exec_error, which means FAIL and fix rounds.
    - src/lib/check-proof.ts (--base), scripts/proof-discrimination-gate.mjs (runCheckProof,
      evaluateProofDiscrimination) and scripts/proof-resolve-precheck.mjs (proofResolveVerdict) execute the same proofs.
    INFERRED: without a resolver, every open task built after its tests move goes red on a path. The alternative is
    about 5,850 plan amendments.
  design: |
    1. src/lib/test-path-resolver.ts exports resolveTestPath(pathOrBasename, { root, tree }), returning
       { path, how: "exact" | "basename" } or { unresolved: "absent" | "ambiguous", candidates }.
       - The exact path is tried first, in the tree being judged.
       - Otherwise the basename `<name>.test.ts` is looked up in an index of `git ls-files -- 'test/**/*.test.ts'`
         for that tree. test/fixtures/ is excluded, because it holds a fixture test/existing.test.ts.
       - Only test/**.test.ts shapes are eligible. Any other path resolves exactly or not at all.
    2. LOOKUP COST. The index is built ONCE per tree SHA (`git rev-parse <rev>^{tree}`) and cached in-process in a Map.
       There is never a per-call walk of ~4k files. When check-proof judges base and head, each tree gets its own index,
       so a base proof resolves against base.
    3. FAIL CLOSED.
       - Zero hits is `absent` and two or more is `ambiguous`; neither is ever guessed.
       - Every caller keeps today's outcome for an unresolved path: executed_fail or exec_error, the credited-test-path
         BLOCK, or the precheck refusal.
       - A caller that used the fallback says so in its output (`resolved test/x.test.ts -> test/<folder>/x.test.ts by
         basename`), so a reviewer can see it happened.
    4. CALLERS. These resolve through resolveTestPath instead of a bare path or existsSync:
       - review.ts parseWhitelistedProof / judgeCriterion, for whole-file `unit test:` and `grep: ... in test/...` proofs;
       - check-proof.ts, at base and at head;
       - proof-discrimination-gate.mjs;
       - proof-resolve-precheck.mjs;
       - acceptance-author-gate.mjs's credited-test-path moduleExists.
       Title-only `unit test: <title>` proofs already search recursively and are left alone.
    5. UNIQUENESS CHECK, test/every-test-basename-is-unique.test.ts.
       - It walks `git ls-files -- 'test/**/*.test.ts'` (recursive, fixtures excluded) and fails naming both paths when
         two tests share a basename.
       - It asserts that the inspected count is > 0 and equals an independent `find test -name '*.test.ts'` count with
         fixtures excluded. A check that compares nothing must go red.
       - Its name avoids census|ratchet|baseline, so RULE_SUITE_NAME_RE (src/lib/ci-parity.ts) does not enrol it by name.
    6. No proof text under plan/ is rewritten (ruling 5).
    New tests stay flat in test/: this phase-0 task lands before the readers are recursive, and the move waves place
    them later. Prove each new test is load-bearing by deleting the fix and watching it go red.
