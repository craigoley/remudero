      proof: 'grep: test("W1-T9860: two tests sharing a basename are refused by name" in test/every-test-basename-is-unique.test.ts'
    - claim: 'review resolves cited test paths through the shared resolver'
      proof: 'grep: resolveTestPath( in src/lib/review.ts'
    - claim: 'check-proof resolves cited test paths through the shared resolver'
      proof: 'grep: resolveTestPath( in src/lib/check-proof.ts'
