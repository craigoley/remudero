  falsifier: |
    On origin/main no resolver exists, so every grep above misses. A proof naming test/x.test.ts after x moved to
    test/<folder>/x.test.ts hands node --test a ghost path and grades executed_fail. acceptance-author-gate's existsSync
    returns false and the credited-test-path BLOCK fires. Two files sharing a basename are not detected.
