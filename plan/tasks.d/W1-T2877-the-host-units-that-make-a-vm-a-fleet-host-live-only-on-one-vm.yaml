    - claim: "the rendered launcher keeps the STOP refusal, the unmounted-state refusal and idempotence"
      proof: "unit test: W1-T2877: the rendered launcher refuses on STOP and on an unmounted state root"
    - claim: "host-specific values are inputs, and the installer refuses rather than guessing when one is unresolvable"
      proof: "unit test: W1-T2877: an unresolvable host value is refused rather than guessed"
