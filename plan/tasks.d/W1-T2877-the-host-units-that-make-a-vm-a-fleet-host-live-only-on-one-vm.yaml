- id: W1-T2877
  title: "THE HOST UNITS THAT MAKE A VM A FLEET HOST EXIST ONLY ON ONE VM — the daemon launcher, its boot unit, the crash-recovery watchdog, the stray-container reaper and the heartbeat cron were all installed by hand and are in NO tracked file, so a second instance provisioned from this repo comes up without reboot survival, without crash recovery, without a heap ceiling and without a beat"
