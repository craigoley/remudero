  rationale: |
    OBSERVED 2026-11-10: the proof run of pull request #17671 (W1-T11769) failed in the fleet's container because a test crossed the memory limit of its host.
    - `runDaemon` in src/lib/daemon.ts takes `deps.memoryGovernor ?? createDaemonMemoryGovernor({})`. The default reads the process memory, /proc/self/status and the cgroup files memory.high and memory.max.
    - In the fleet's container a test process of 250 to 380 MB can cross a tier of the governor, or exit, in the middle of a case.
    - The three test/daemon/ops-catalog-shadow-*.test.ts files now fix these readings in a local `hostPins` function. Each file has its own copy.
    - Still not fixed: test/daemon.test.ts (99 runDaemon calls) and the W1-T11768 daemon cases in test/github/ops-catalog-source-redaction-read-only.test.ts.
    - Counted by grep at main 7fbfd3ae8: 211 test files call `runDaemon(`, and 200 of them pass no `memoryGovernor`.
  design: |
    Move `hostPins` from test/daemon/ops-catalog-shadow-revision.test.ts to test/helpers/daemon-host-pins.ts as `hostIndependentDaemonDeps()`. The three shadow suites import it.
    Spread it into the dependencies of each runDaemon call in test/daemon.test.ts and in the daemon cases of the ops catalog suite. A case that tests the governor keeps its own.
    The census reads the test tree as text. Its baseline is the measured count of files after this change, written in the new test with the date.
    NOT IN SCOPE: the production default in src/lib/daemon.ts, and the other test files. The census names them, and later tasks lower the count.
  falsifier: |
    Remove the memory governor from the helper and criterion 2 must fail. Add a test file that calls runDaemon with no governor and criterion 3 must fail. Restore and require all to pass.
  note: |
    The other files can move in groups by folder. The census makes each group a small, safe change.
