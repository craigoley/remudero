- id: W1-T9034
  title: "AN IMPLEMENT-STAGE WORKER ERROR RELEASES ON PROVIDER RECOVERY, AS EVERY OTHER WORKER STAGE DOES — W1-T8676 recognises a worker error by its reason text, but at the `implement` stage `failOnWorkerError` writes the retry driver's reason (\"strikes exhausted (2)\"), so that latch reads as task-caused and never takes the provider_recovered release"
  repo: remudero
  depends_on: [W1-T8676]  # merged (#11224, ae9ff3169); this task changes how its latch classifies a worker error
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — the independent-failure latch classifies a worker error by its structured verdict fields; it spans the latch (status.ts), the stage set's call sites (run-task.ts) and W1-T8676's fixture, and no release rule changes
  band_meaning: span
  origin: "operator approval 2026-10-13 (\"go\"): the gap W1-T8676's builder reported, filed as its own task"
  plan_refs: [W1-T8676, W1-T7533, W1-T8677, W1-T2515]
  files:
    - src/lib/status.ts
    - src/run-task.ts
