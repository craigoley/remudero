- id: W1-T2493
  title: "THE DAEMON'S PROCESS-LIFETIME RUN ID IS REUSED AS A PER-WORKTREE BRANCH NAME, SO THE DAEMON LANE CAN CUT EXACTLY ONE WORKTREE PER BOOT — `runId = DAEMON-${Date.now()}` is minted once at startup and `worktreeAdd` shells `git worktree add -b`, which refuses an existing branch, so every later daemon-lane worktree dies on `fatal: a branch named 'run-DAEMON-<epochMs>' already exists`"
  repo: remudero
