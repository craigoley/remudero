  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, recorded up front rather than shipped as a
    lint refusal. `subsystemsOf` reads several concerns off this `files:` list (reachability,
    review, the dispatcher module, its suite) and `lint-plan` refuses that below high — the same
    correction already forced on W1-T1017, W1-T1086 and W1-T1101. THE ACTUAL DIFF IS ONE COUNT
    THREADED THROUGH AN EXISTING RETURN AND ONE KEY ON AN EXISTING ROW; no gate, policy value,
    severity or verdict field moves.

    `files:` DERIVED BY READING THE CHAIN, not guessed: `scanUnreachedExports` and
    `addedExportedFunctions` live in src/lib/reachability.ts; `unwiredAdvisoriesFor` and the
    `ReviewVerdict.unwiredAdvisories` field live in src/lib/review.ts; the `log("review.posted", …)`
    call and the `review.unwired_advisory` loop live in src/run-task.ts; every SHIPS-UNWIRED
    assertion lives in test/ships-unwired-floor.test.ts, which EXISTS today, so the whole-file proof
    form executes on day one. src/lib/retro.ts is DELIBERATELY ABSENT — the retro consumer is P40(iv)'s
    argument and widening into it is how one observability field becomes a population re-definition.

    ON THE GREP PROOF. `reachability_scanned` reads ZERO in src/run-task.ts at head, so it
    DISCRIMINATES against the merge base rather than landing `executed_stale`, and it is stated
    positively — it greps text the change ADDS. The pattern carries no bracket, star, caret, dollar
    or the words ` in `, so `parseDialectGrep` splits it at the single ` in ` before its path, and
    its path is declared in `files:` (W1-T310). The remaining four criteria take the whole-file
    `unit test:` form deliberately: they are BEHAVIOURAL distinctions, and a grep cannot express
    "these two cases render differently".

    verify:auto — every criterion is decidable in-process against the diff/checkout/report fixtures
    the suite already builds. Nothing spawned, no network, no operator judgement.

    budget_usd 30 — above W1-T1101's 12 (one template string over data the row already holds)
    because the count does not exist yet and must be threaded out of the scan; far below W1-T322's
    100, which built the scan and both consumers.

    NO depends_on, ESTABLISHED RATHER THAN ASSUMED. W1-T1017 (the retention half) is shipped.
    W1-T323 is `verify: human` and gated on an operator reading; it consumes this field's output but
    nothing here waits on it, and this task must not be blocked behind a calendar fact. W1-T365 and
    W1-T1086 overlap on paths only — file-overlap serialisation at dispatch is the correct and
    sufficient interlock.

    RE-READ THE GATE BEFORE ACTING RATHER THAN QUOTING THIS SHARD. Every claim above was read off
