    NOT COVERED ELSEWHERE: swept origin/main plan/tasks.d and every open PR head's plan tree for commentMaskByLine and
    matchedLinesAreAllComments. W1-T3210 (merged) built the comment-only grade; W1-T7821 (queued) makes `rmd check-proof`
    call the same predicate and so inherits this fix; no shard changes the mask itself.
  design: |
    1. `commentMaskByLine` takes the matched file's path and picks the comment grammar from its extension:
       JS/TS family (.ts, .tsx, .js, .mjs, .cjs) keep today's `//` and `/* */` rules with string quotes; YAML
       (.yaml, .yml) masks from an unquoted `#` to end of line (a `#` inside a quoted scalar is not a comment);
       shell-like files with a `#` grammar may share the YAML rule; Markdown (.md) and any extension with no known
       grammar mask nothing.
    2. `matchedLinesAreAllComments` passes the path it already holds. Every caller of the mask (the reviewer's
       grading and #13397's amendment validator) gets the same reading, never a second copy.
    3. No grading rule changes beyond which characters count as a comment; a YAML `#` comment line is still capped.
  acceptance:
