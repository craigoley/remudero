  rationale: |
    The operator enabled the merge queue on 2026-10-05 on the session's recommendation, with only the
    happy path proven, and disabled it two hours later after re-enqueueing PRs by hand ("next time don't
    have me enable something that won't work"). The gaps were each fixed in isolation: W1-T5909 (#9392
    stranded), W1-T5911 (#9391 risk-held), W1-T5920 (requeue 403s), W1-T5921 (ci-gate timeout). The proof
    that the queue is now safe to re-enable is one scenario that drives a PR through the whole failure
    sequence with real runSweep passes and a GitHub fake.
  design: |
    One test file, using the existing sweep harnesses and the gh-shim helper, drives these sequences
    across consecutive runSweep passes (full and light):
    (a) a sweep-armed PR is enqueued, its group's checks are cancelled, GitHub ejects it and disables
        auto-merge; the next pass re-arms it within W1-T5909's bound, and it merges when green;
    (b) the same with a risk-held head that the operator enqueues by hand (W1-T5911);
    (c) a requeue refused with 403 "already running" is deferred and retried after the run concludes
        (W1-T5920);
    (d) a ci-gate timeout gets a new head (W1-T5921);
    (e) an ejection on every attempt escalates once at the bound instead of looping.
    A failing sequence is a defect to file, not a test to loosen.
    Every scenario test title starts with `W1-T5941:`.
  acceptance:
