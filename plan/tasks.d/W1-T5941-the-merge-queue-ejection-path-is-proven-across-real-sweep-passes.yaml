  plan_refs: [W1-T5909, W1-T5911, W1-T5920, W1-T5921, W1-T5922, W1-T4405, W1-T5940]
  files: [test/the-merge-queue-ejection-path-is-proven-across-real-sweep-passes.test.ts]
  status: merged
