  note: |
    MEASURED by hand on the Azure fleet host 2026-09-13, which was at 3.6GiB free / 88% and had
    escalated issue #4831. Reclaimed 2.5GiB; the two largest objects were:

      379 MB  /home/craigoleyagent/wt4844/coverage        build output, regenerable
      836 MB  /home/craigoleyagent/rmd-pf/node_modules    regenerable via npm ci

    CORRECTION TO THIS RECORD'S FIRST DRAFT, WHICH SAID THE FLEET HAS NO RECLAIM PATH AT ALL. It
    has THREE, all merged, and they are not in question here:
      - `logDiskReclaimRung` (W1-T411, src/run-task.ts) sweeps stale rmd temp dirs, abandoned
        review clones and per-spawn worker homes, ARMED, at start of run.
      - `runAdhocLaneReapRung` (W1-T2847, src/lib/worker.ts) reaps ad-hoc lanes, survey-first,
        refusing on live pid, live upstream branch, incomplete probe and a 14-day ceiling.
      - `object-reaper.ts` (W1-T3090) reclaims unreachable git objects.
    The first draft's framing was wrong and is retracted. The gap below is narrower and real.

    NEITHER OBJECT IS REACHABLE BY ANY EXISTING REAPER, for two structural reasons rather than an
    oversight — every one of those rungs removes a WHOLE TREE under a MANAGED ROOT:
      - `sweepStrandedReviewWorktrees` (W1-T3378) says it outright: "SCOPE IS EXACTLY `review-PR*`.
        The name pattern is the only filter: `coverage/`, `rmd-*` temp dirs and any hand-cut lane
        never match it and are never even considered, let alone touched."
      - `pruneStaleRuns` walks REGISTERED worktrees; both live in hand-made checkouts in $HOME.
      - W1-T1082 shipped the daemon's disk reading as "additive and surfaces only - it gates
        nothing, deletes nothing".
      - W1-T175 (queued) reaps `~/Remudero/worktrees/`, which on this host is on /mnt/rmd with 65G
        free. It would not have caught either object.

    SO THE TWO MISSING CAPABILITIES ARE PRECISELY THESE, AND NEITHER IS A DUPLICATE OF THE ABOVE:

    (1) ARTIFACT-LEVEL RECLAIM INSIDE A TREE THAT MUST BE KEPT. Every existing rung's unit is the
        whole tree, so each must refuse a checkout that is live or dirty — correctly. `rmd-op` held
        45 uncommitted files AND 546MB of `node_modules`; whole-tree reaping is right to refuse it,
        and the regenerable half is therefore unreclaimable by ANY current rung. No existing code
        can express "delete the artifact, keep the tree", and that is the capability this adds.
    (2) STANDALONE CLONES OUTSIDE EVERY MANAGED ROOT. `rmd-pf` is a clone, not a worktree, sitting
        in $HOME. No worktree reaper can reach it by construction — it has no registration to read.

    THE PRESSURED FILESYSTEM IS NOT THE ONE THE FLEET WATCHES. `/` is 29G at 88%; the state volume
    `/mnt/rmd` is 126G at 46%. Docker's data root is `/mnt/rmd/docker`, so its 8.8GB of images were
    never part of the pressure. A reclaimer that assumes the state volume is the scarce one will
    free nothing.
  rationale: |
    THE RECLAIM RUNGS ARE REAL AND THIS TASK DOES NOT SECOND-GUESS THEM. W1-T411, W1-T2847 and
    W1-T3090 all ship and all work; the objects they own are temp dirs, worker homes, review
    clones, ad-hoc lanes and loose git objects. What none of them owns is a regenerable artifact
    INSIDE a tree that must be kept, because their unit is the tree. On 2026-09-13 that distinction
    cost 1.2GiB on a host at 88%: #4831 escalated, a human read it, and a human ran `rm` — on two
    objects every rung was correct to leave alone.

    THIS IS NOT `doctor --fix`, AND MUST NOT BECOME IT. `rmd doctor` refuses `--fix` BY NAME, on
    the stated ground that "every repair path already has an owner and a second actor mutating
    state a live daemon depends on is the measured hazard". That reasoning is sound and this task
    accepts it: the reclaimer is owned by the DAEMON's own tick, the same single actor that already
    owns `sweepStrandedReviewWorktrees`, and is reachable no other way.

    THE HAZARD IS REAL AND WAS OBSERVED THIS SESSION. Three separate would-be reclaims had to be
    refused by hand on live evidence: `rmd-op` held 45 uncommitted files and 3 open file handles;
    `/tmp/tsx-1000` had 14 open handles and had been written 30 seconds earlier; and a host-side
    `git worktree prune` would have deleted metadata for worktrees that are ALIVE inside the
    container, because they register under the container's `/home/node/...` paths which do not
    exist on the host. An automated reclaimer that lacks any one of those three refusals is more
    dangerous than the disk pressure it relieves.
  design: |
    (i) FOLLOW `review-worktree-reclaim.ts` EXACTLY — it is the shipped precedent for this shape.
    An out-of-process sweep invoked once per daemon tick, a pure + injectable module, wired as a
    zero-arg optional dep declared in src/lib/daemon.ts and supplied from src/run-task.ts. Read that
    module first and mirror its structure rather than inventing a second idiom. THE EXPORTED SWEEP
    IS NAMED `sweepReclaimableArtifacts` — an acceptance criterion greps for its CALL SITE in
    src/run-task.ts, so a different name fails the gate. Wiring it is not optional polish: a module
    reached only by its own tests is the `unwired-gate` defect this repo already refuses.
    (ii) THE SCOPE IS AN ARTIFACT ALLOWLIST, NEVER A DIRECTORY WALK FOR BIG THINGS. Only names whose
    contents are REGENERABLE qualify — `coverage/` and `node_modules/` are the measured two. Size is
    never a reason to delete anything; the precedent refuses size by design and so must this.
    (iii) EVERY TARGET NEEDS THREE INDEPENDENT REFUSALS, all of which fired for real this session:
    an open file handle anywhere beneath it; a non-empty `git status --porcelain` in its enclosing
    checkout; and a recent access time. All three are seams and must be INJECTED, so the tests need
    no real filesystem at a real fill level (the same contract W1-T1082 used for `statfs`).
    (iv) IT MUST STATFS THE FILESYSTEM IT IS ABOUT TO FREE, not the state root. On this host those
    are different devices and the state volume has 65G free; reclaiming against the wrong one is a
    no-op that reports success.
    (v) NEVER `git worktree prune`, AND SAY SO IN THE CODE. From the host, live container worktrees
    read as `prunable` because their registered paths are container-side. Encode that as a comment
    at the refusal, so the next reader does not "fix" the omission.
    (vi) LEDGER EVERY RECLAIM with the path, the bytes freed and the predicate that allowed it, the
    way `worktree.reaped` does. A reclaimer whose work is invisible cannot be audited after it
    deletes the wrong thing.
    (vii) PREFER COMPRESSION WHERE THE DATA IS NOT REGENERABLE. The third reclaim this session was
    1.3GB of Codex rollout `.jsonl` older than 3 days, which was GZIPPED rather than deleted because
    it is forensic history, not build output. If this task covers that class at all, it compresses;
    it does not delete. Say which classes are in scope.
  acceptance:
    - claim: "a regenerable artifact in a clean, idle checkout is reclaimed and the freed bytes are ledgered"
      proof: "unit test: a regenerable artifact in a clean idle checkout is reclaimed"
    - claim: "a target whose enclosing checkout has uncommitted changes is refused, so unpushed work is never destroyed"
      proof: "unit test: a target in a dirty checkout is refused"
    - claim: "a target with an open file handle beneath it is refused, so a live worker's tree is never reclaimed"
      proof: "unit test: a target with an open file handle is refused"
    - claim: "age alone never authorises a reclaim, mirroring the review sweep's own refusal of age and size as sufficient"
      proof: "unit test: age alone does not authorise a reclaim"
    - claim: "the sweep is actually WIRED into the daemon tick and not reachable only from its own tests"
      proof: "grep: sweepReclaimableArtifacts( in src/run-task.ts"
  falsifier: |
    RE-MEASURE BEFORE BUILDING. The 88% reading is from 2026-09-13 and I freed 2.5GiB by hand the
    same day; if `/` is now comfortable, confirm the pressure recurs before building a reaper for it.
    The recurrence claim is the premise, and it is checkable: `df -h /` on the fleet host.
    PROVE EACH REFUSAL BY DELETING IT. Three tests must each go red when its own guard is removed —
    dirty checkout, open handle, recency. A reclaimer whose guards are untested is the failure mode
    this task exists to avoid, and "it passed" is not evidence that a guard fired.
    DO NOT WIDEN THE ALLOWLIST TO "LARGE DIRECTORIES". The moment size authorises deletion, this
    becomes a tool that can eat an operator's working tree. `rmd-op` was 546MB of node_modules
    beside 45 uncommitted files; size would have selected it and the dirty check is the only thing
    that saved it.
    DO NOT MOVE THIS INTO `rmd doctor`. `--fix` is refused there by name and for a stated reason;
    re-litigating that belongs in its own task with its own argument, not as a side effect of this
    one.
    A SWEEP THAT NEVER FIRES IS THE EXPECTED FAILURE. Assert the positive case on a fixture that
    really does qualify, or this ships as a no-op that reports healthy forever — the vacuous-pass
    shape this repo has hit repeatedly.
