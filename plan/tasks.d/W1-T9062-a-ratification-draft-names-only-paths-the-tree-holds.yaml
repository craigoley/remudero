  rationale: |
    OBSERVED 2026-10-13 (operator-delegated inbox clear). The operator's 11 reframes (`rmd reframe`, direction text
    from ~/Remudero-notes/inbox-brief-2026-10-13/brief.json) produced 10 redrafts that classified READY by 11:15Z:
    standing-debt:4, standing-debt:5, machine-judge W1-T5309 / W1-T6107 / W1-T6372 / W1-T7271 / W1-T7739 and
    verify-human W1-T204 / W1-T216 / W1-T5717. Read one by one against origin/main (notes per draft in
    ~/Remudero-notes/inbox-brief-2026-10-13/redrafts/*.txt):
      - 9 of 10 name `files:` paths that exist neither in the checkout nor on main: src/lib/fixWorker.ts,
