    - claim: "a parked-task proposal's draft prompt carries that shard's files and offers releasing it"
      proof: 'grep: test("W1-T9062: a parked-task proposal prompt shows the shard files and offers the release" in test/a-ratification-draft-names-only-paths-the-tree-holds.test.ts'
    - claim: "rmd approve of a parked task id loads the plan from the repo, not the config root"
      proof: 'grep: test("W1-T9062: approve of a parked task id reads the plan from the repo root" in test/a-ratification-draft-names-only-paths-the-tree-holds.test.ts'
  falsifier: |
    Keep `blockingLintMessages` without an existence fact and the first test fails: a fragment declaring
    src/lib/fixWorker.ts in a fixture tree without it classifies READY. Allow every missing path and the first test
