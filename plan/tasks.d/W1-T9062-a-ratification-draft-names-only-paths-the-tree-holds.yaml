      - The 10th (verify-human:W1-T5717) greps `#8650` / `#8671`, which already match on main, so it proves nothing.
      - 4 of the 10 are about a parked shard that is already sound and matches the operator's direction (W1-T6107,
        W1-T5717, W1-T6372, W1-T7271). The faithful action is to release that shard; the drafter invented new tasks.
      - That release, `rmd approve <taskId>`, crashes in the core container: `PlanError: ENOENT
        /home/node/Remudero/plan/tasks.yaml`.
    WHY, READ on origin/main 9ee45e15f (symbols, not lines):
      - `blockingLintMessages` (src/lib/inbox.ts) lints the merged fragment with `lintPlan(merged, () => ({}), ids)`:
        no `moduleExists`, no `pathExistsAtBase`, no existence fact of any kind. Nothing at the draft floor or at
        readiness (`classifyProposal`) refuses a `files:` path the tree does not hold.
      - The only check that does, "declares file path(s) that exist in neither the checkout nor the base tree"
        (`machineFilingAdmissionViolations`, src/lib/plan.ts), applies only to machine filings, never to an inbox draft.
      - `inboxDraftPrompt` shows the drafter a plan INDEX (id/title/status/type/depends_on) but never the `files:` of
        the parked task a `machine-judge:` / `verify-human:` proposal names, and never asks it to confirm a path exists.
        It has Read/Grep/Glob and still guessed.
      - `approveCommand`'s task-id branch (W1-T3216, `approveParkedTask`) loads `join(config.root, "plan", "tasks.yaml")`.
        In the core container `config.root` is /home/node/Remudero, not the checkout, so the branch cannot run there.
        The proposal branch of the same command reads `repoRoot` and works.
    RELATED, NOT DUPLICATED: W1-T9039 (open plan PR #11312 at filing, not yet on main) gives the draft and approve
    floors `lint-plan --base`'s facts, so call-site, blocked-task-disposition and proof-grep-already-true fire before
    READY. It does not refuse a nonexistent declared path, ground the prompt in the parked shard, add the release
    candidate, or fix the release crash. Both edit src/lib/inbox.ts; whichever merges second rebases. W1-T8828 (stamp),
    W1-T8926 (message quality) and W1-T8950 (recommendations) are different concerns.
  design: |
    No new bound.
    1. ONE PATH-EXISTENCE PREDICATE. Extract the existence check from `machineFilingAdmissionViolations` into an
       exported helper in src/lib/plan.ts (declared paths that exist neither in the checkout nor at the base tree,
       minus allowed new paths). Machine-filing admission keeps its exact behaviour through the helper.
    2. THE DRAFT FLOOR AND READINESS REFUSE A MISSING PATH. `blockingLintMessages` (draft self-lint and
       `classifyProposal`) adds a `[draft-path-missing]` blocking message for every drafted task path the helper
       reports, resolved against the same checkout the draft is linted in and origin/main. Allowed new paths: a test
       file under test/ named after the drafted task's slug, and a path the task's `design:` declares on a line
       `CREATES: <path>`. A dirty draft goes back through the existing bounded redraft with the message in hand; a draft
       still dirty after the bound is cached NOT-READY with the message, never surfaced as READY.
    3. THE DRAFTER IS GROUNDED IN THE PARKED SHARD. For a proposal whose id names a parked task (`machine-judge:<id>`,
       `verify-human:<id>`, `verify-human-automate:<id>`), `inboxDraftPrompt` pastes that task's title, `files:` and
       acceptance, and says: every `files:` path must exist (confirm with Glob before listing it), a new file is either
       a slug-named test or declared on a `CREATES:` line, and a proof must fail on main.
    4. RELEASE FIRST. For those proposals the prompt asks first whether releasing the parked shard as it stands
       satisfies the proposal and every reframe round. If it does, the drafter emits the existing structured lifecycle
       action for a release (the READY item's lifecycle-action form) naming the task id, not new tasks. Approve of
       that item releases the shard through `approveParkedTask`.
    5. THE RELEASE PATH RUNS IN THE CONTAINER. `approveCommand`'s task-id branch loads the plan from `repoRoot`, like
       its proposal branch, so `rmd approve <taskId>` works wherever `rmd approve <proposalId>` does.
    Tests go in test/a-ratification-draft-names-only-paths-the-tree-holds.test.ts with the titles below verbatim.
