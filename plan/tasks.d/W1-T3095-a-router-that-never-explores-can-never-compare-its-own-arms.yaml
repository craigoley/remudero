  rationale: |
    MEASURED 2026-09-08 by running `recommendMounts` over `buildMountHeadroomSweep`'s own cells
    against the committed `.remudero/mounts.yaml` (the exact call shape `runMountRecommenderRung`
    makes), at the live daemon state root:

        outcomes: { "REFUSAL:insufficient-sample": 24, "REFUSAL:unmatched-arms": 6,
                    "REFUSAL:tier-invariant": 1, "REFUSAL:quality-regression": 2 }

    Zero recommendations. Every retained `mount_recommendation.swept` row agrees and always has:
    `filed: 0, refused: 33, cells: 10`, 959 rows, unchanged for a month.

    THE REFUSALS ARE CORRECT AND THAT IS THE POINT — the module's own header says "refuse more often
    than recommend" and it is honouring it. What is broken is the POPULATION it is refusing over,
    and the cause is the routing policy itself:

    (1) THE POLICY MANUFACTURES ITS OWN SAMPLE STARVATION. `routes.implement.medium.src` and
    `routes.implement.high.src` are the IDENTICAL mount (`sonnet`/`high`), `reviewer` is `high` at
    all three risk bands, and `diagnose` is `high` at all three. Measured spawn efforts:
    `implement.done` is 642 `high` against 4 `medium`; `review.reviewer` is 947 `high` against 0.
    One arm gets ~95% of the traffic BY CONSTRUCTION, so no runner-up arm reaches n=30, so the
    recommender refuses, so the policy never changes, so the runner-up never gets traffic.

    (2) IT IS NOT A THRESHOLD PROBLEM AND MUST NOT BE FIXED BY LOWERING THE FLOOR. In cell
    `implement::high::src` the arms are n=59 / n=3 / n=13 / n=490 / n=103. Lowering the floor would
    license a recommendation off n=3. The missing thing is VARIATION, not permission.

    (3) THE ONLY TWO ARMS THAT DO CLEAR THE FLOOR CANNOT BE COMPARED, FOR A REASON W1-T3080 OWNS.
    `claude::claude-sonnet-5::high` (n=59) and `unknown::unknown::high` (n=490) are the sole
    floor-clearing arms in the fleet's biggest cell, and the second is refused
    `tier-invariant`: "served_model 'unknown' does not resolve in mounts.yaml's 'tiers' table, so
    the Tier Invariant (G-17) cannot be verified for it — refusing rather than assuming it is safe."
    So the largest population in the corpus is unusable. This task DEPENDS ON W1-T3080 rather than
    duplicating it: without the served model on the terminal row, exploration would generate
    variation the recommender still could not read.

    (4) THE CROSS-PROVIDER ARMS ARE MEASURED IN INCOMPARABLE UNITS. Every codex row reads
    `cost_usd: 0` (codex is unmetered), and `routing-objective.ts` is explicit that WINDOW SHARE, not
    the notional dollar, is the correct objective on a subscription install. Every arm in the live
    sweep reports `window=unreadable/completed-task; coverage=0/N; unreadable=N;
    reasons=missing-window-consumption`. The objective that module was built to compute has never
    once been computed in production — and `objective_fallbacks: 0` on every swept row shows the
    loud fallback is not even being reached.

    (5) THE STAKES ARE THE WHOLE POINT OF THE TABLE. Because capability is a lookup on the requested
    Claude model and nearly every mount is `sonnet`/`high`, the codex side resolves
    `balanced/high` -> `gpt-5.5` for 147 of 277 spawns and `frontier/*` -> `gpt-5.6-sol` for 104,
    while the ENTIRE economy rung (`gpt-5.6-luna`, `gpt-5.3-codex-spark`, `gpt-5.4-mini`) has been
    selected ZERO times: it requires a `haiku` mount, and `haiku` appears only at
    `implement x {docs,plan-lint}`, `review x low` and `manual x {low,medium}` — classes that are
    3 and 4 runs of 820 in the measured census. Three quarters of the ladder is unreachable and
    nothing measures whether it should be.
  design: |
    (i) A PURE MODULE THAT PROPOSES A PERTURBATION, NEVER ONE THAT ROUTES. `src/lib/mount-exploration.ts`
    decides, for an already-resolved mount, whether THIS dispatch is an exploration dispatch and what
    the runner-up arm in its own cell is. Same discipline as `mount-recommender.ts`: pure, no I/O, the
    caller owns every read and the spawn.
    (ii) BOUNDED, DECLARED, AND LEDGERED — the three properties that keep this from being a silent
    quality tax. A small explicit fraction, a POLICY DATA constant with a declared kind (the
    `DAEMON_DRAFT_BATCH_CAP` precedent), and a ledger row naming the cell, the on-policy arm, the
    explored arm and the reason, so an exploration dispatch is never mistaken for a routing decision.
    (iii) EXPLORE THE RUNNER-UP IN THE SAME CELL, NEVER ACROSS CELLS. W1-T2574's whole finding is
    that a cross-cell comparison reports difficulty rather than model; exploration must generate
    within-cell variation or it generates confounded variation, which is worse than none.
    (iv) NEVER EXPLORE WHERE THE COST OF BEING WRONG IS UNBOUNDED. `risk: high` cells and the
    Architect/judge lanes are excluded outright — the Tier Invariant is not a knob, and a high-risk
    implementation is not the place to sample.
    (v) THE OBJECTIVE STAYS THE ONE §9 DECLARES. Exploration feeds `windowShare` evidence, which is
    what `routingObjectiveFor` needs and never receives; it does not introduce a second objective.
