  rationale: |
    MEASURED 2026-11-03 ~00:30Z over the core ledger union (~/Remudero-notes/conflict-findings-2026-11-03.md, evidence in
    ~/Remudero-notes/conflict-evidence-1103/, read-only). Code read at origin/main c0a6f1c74.
    The stale-seed dedup held 182 of 1,096 conflict-disposed passes (16.6%) across 6 PRs in 7 days.
    #15532 (W1-T10573, head 25fec8e):
    - The seed was an acted conflicted sweep.disposed at 2026-10-30T23:03:38Z by DAEMON-1793398033232.
    - Its only later rung row is fix.scope_amendment outcome resumed at 23:07:05Z, from the same run.
    - 169 stand-downs read "fix already dispatched for this head (25fec8e) at 2026-10-30T23:03:38.473Z by DAEMON-1793398033232 —
      awaiting its outcome" until 2026-11-01T14:52Z, under several later daemon runs. Then pr.stuck, issue #16028, and the
      operator's thread.
    #15602 (W1-T10722, head ee01645), with a seed at 2026-10-31T00:39:06Z by the same DAEMON-1793398033232:
    - 94 sweep.fix.seed_orphaned rows (reason owner-run-ended) from 2026-11-01T01:33Z to 2026-11-02T18:05Z.
    - Under DAEMON-1793601275855 (06:55Z) and again under DAEMON-1793643571744 (18:38Z-21:02Z) the same seed read live: "fix
      already dispatched for this head (ee01645) at 2026-10-31T00:39:06.809Z by DAEMON-1793398033232".
    ROOT CAUSE, READ:
    - For an earlier run's seed with a rung row, fixSeedRead returns orphaned only through continuationEndedAtEmptyBoot.
    - That predicate takes the NEWEST daemon.boot and needs its run_child.adoption_pass to read live, adopted, unreadable and
      misidentified all 0. That is fleet-wide: one adopted child of any task anywhere keeps every dead seed live.
    - The verdict is re-derived on each pass from whichever boot is newest, so it flips with each boot.
    - The sweep.fix.seed_orphaned row it writes (FIX_SEED_ORPHANED_STEP) has no reader in src/. A settlement is never read
      back, and the row repeats on every pass.
    - W1-T10991's own recon (#15108, 2026-10-29) observed this predicate false because boots adopted 1-2 other tasks'
      children, and fixed only the push_failed rung end. Its shard says the other four PRs "need their own reading before a
      class claim". #15532 and #15602 are that reading.
    NOT COVERED ELSEWHERE: W1-T10991 (merged, #15606) ends a seed whose push failed. W1-T10339 (merged, #14284) is a stood-down
    hold with unchanged inputs. W1-T9999 introduced the read. The sibling item 5a, W1-T11168, is the count backstop, a different
    hold. #15532 is being hand-fixed in the operator's thread, and this task does not touch that PR.
  design: |
    1. PER-TASK ADOPTION. Replace continuationEndedAtEmptyBoot's fleet-wide zero test with a per-task one. For each daemon.boot
       after the seed by a run other than the seed's, read that boot's run_child.adoption_pass and the run_child.adopted,
       adoption_unreadable and adoption_misidentified rows naming this task. The continuation ended when some such boot's pass
       was readable and adopted nothing for this task. An unreadable census for this task, or any adoption of it, keeps it live.
       Look for an existing per-task field on the adoption row first. If the pass lists no task ids, add them to the row in the
       same change.
    2. STICKY SETTLEMENT. Before deriving, fixSeedRead reads the newest FIX_SEED_ORPHANED_STEP row for (PR, head, seed_ts). When
       one exists and no fix.dispatch for this task at this head follows it, return orphaned with no further derivation. A later
       dispatch starts a new seed and a new read.
    3. WRITE ONCE. The dedup arm appends sweep.fix.seed_orphaned only when no row for that (PR, head, seed_ts) exists.
    4. Nothing else changes: the ordinary owner and checkout claims still gate the redispatch that follows an orphaned read.
    Tests go in the new file, titled verbatim as in the proofs, over fixSeedRead from #test/helpers/sweep-test.js and the real
    dedup arm, with ledger fixtures cut from #15532's and #15602's rows (ids and shas kept, other fields minimal).
  falsifier: |
    At origin/main, #15532's fixture with a later boot that adopted another task's child reads live, because
    continuationEndedAtEmptyBoot needs every adoption count to be 0, and the first test fails. #15602's fixture read orphaned
    under one boot flips to live when a newer boot with an adopted child is appended, so the second test fails. If the
    per-task census is replaced by "any later boot", a fixture whose boot adopted THIS task's child reads orphaned and the third
    test fails.
