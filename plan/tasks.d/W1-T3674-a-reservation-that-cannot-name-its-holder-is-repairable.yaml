- id: W1-T3674
  title: "A TASK-ID RESERVATION CAN BE LOST FOUR DIFFERENT WAYS AND NOTHING REPAIRS ANY OF THEM — burned by a test run, minted from a detached HEAD as `unknown`, unclaimable from a container that cannot push the ref, or invalidated by renaming the branch that holds it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  files: [src/lib/task-id-reservation.ts, test/a-reservation-that-cannot-name-its-holder-is-repairable.test.ts]
  origin: oper#pr-queue-sweep-2026-09-16
  plan_refs: ["W1-T3640", "W1-T3648", "W1-T3091"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED IN ONE EVENING, 2026-09-16. Four lanes lost an id, each a different way, and in every
    case the system DETECTED the problem and nothing repaired it:

      1. BURNED BY A TEST RUN. Reading the refs directly:

           W1-T3631  branch=run-W1-T3091-1789525530000  02:45:58Z
           W1-T3633  branch=run-W1-T3091-1789525530000  03:15:14Z
           W1-T3636  branch=unknown  host=Craigs-Mac-mini  03:15:15Z
           W1-T3642  branch=unknown  host=Craigs-Mac-mini  03:15:33Z

         Sequential ids seconds apart. #5715's own commit message names the cause: "three tests
         called nextTaskIdCommand with neither a reserver stub nor an opt-out, so with reserving as
         the default they pushed REAL reservations to origin on every run". That run merged without
         filing any of them. The reservations outlive it and refuse every later filer.

      2. MINTED FROM A DETACHED HEAD, recording `branch=unknown` -- rows 3 and 4 above. The holder
         is unnameable, so the hand-off remedy has nothing to hand off FROM except a literal.

      3. UNCLAIMABLE. A container that cannot push refs/rmd-id/* (`send-pack: unexpected
         disconnect`) can MEASURE a free id but never claim one, so every sweep it performs reads a
         corpus that changes underneath it. Four races in one session on that account alone.

      4. INVALIDATED BY A RENAME. #5741 reserved W1-T3649 as holder `lane-auto`, renamed its branch,
         and task-id-existence then refused its own reservation: the holder no longer matched the
         filer. Its commit names the trap: "rmd next-task-id records the CURRENT worktree branch as
         the holder, so reserve-then-rename silently invalidates the reservation."

    THE COST IS RENUMBERING, REPEATEDLY, UNDER A GATE THAT IS RIGHT TO REFUSE. Each of these is a
    correct refusal of a genuinely unusable claim. What is missing is that nothing turns a detected
    unusable reservation back into a usable one, so the remedy is always manual and always a fresh
    CI round. Between 10:52 and 11:56 the fleet consumed ids 3649 through 3669 -- twenty in an hour
    -- so the window in which a swept-but-unclaimed id stays free is now minutes.
  design: |
    A RESERVATION IS A CLAIM WITH A HOLDER, AND THE FOUR FAILURES ARE ALL THE HOLDER GOING STALE.
    Treat holder drift as one condition with one repair rather than four incidents:

      - a holder naming a branch that no longer exists, or a merged run, is ABANDONED;
      - a holder recorded `unknown` is UNATTRIBUTABLE;
      - a holder naming a branch that exists but is not the filer is HELD;
      - no holder readable at all is UNREADABLE.

    Only the last two may block. The first two are reclaimable BY THE NEXT FILER, the same way
    W1-T3647 reclaims a review lock whose run died: take it over, record what was taken over from,
    and never delete the original claim.

    NOTHING HERE MAY INFER AN OPERATOR ACT. A hand-off between two LIVE holders stays an operator
    decision; this reclaims only a claim whose holder is provably gone. That line is the whole
    safety story, and getting it wrong means one lane silently taking an id another is about to use.

    FIX THE SOURCE OF (1) IN THE SAME CHANGE OR IT REFILLS: a test that mints must not reserve. The
    default flipped in W1-T3091 and the suites were patched then, but the burned ids are still on
    origin and still refusing filers, so the repair must cover the reservations already stranded,
    not merely stop new ones.

    (3) IS NOT FIXABLE HERE and must not be pretended otherwise -- a container that cannot reach the
    ref namespace cannot claim anything. What this task CAN do is make the failure legible: a filer
    that could not claim says so, rather than filing an unclaimed id that looks reserved.
  acceptance:
    - claim: "a reservation whose holder branch no longer exists is reclaimable by the next filer, which records what it took over from"
      proof: "unit test: test/a-reservation-that-cannot-name-its-holder-is-repairable.test.ts"
    - claim: "a reservation whose holder is a LIVE branch other than the filer still refuses, so no lane can take an id another is about to use"
      proof: "unit test: a live holder still refuses the filer"
    - claim: "a filer that could not push its claim reports that it is unclaimed rather than filing an id that looks reserved"
      proof: "unit test: an unpushable claim is reported, not silently filed"
    - claim: "holder drift is one named condition with one classifier, not four incident-specific branches"
      proof: "grep: reservationHolderDrift in src/lib/task-id-reservation.ts"
  falsifier: |
    Reconstruct each of the four measured rows. A reservation held by a merged run must be
    reclaimable and must say what it reclaimed from; one held by a live foreign branch must still
    refuse -- delete that arm and the second test fails, which is the arm that prevents one lane
    stealing another's id. Mint from a detached HEAD and the `unknown` holder must classify as
    unattributable rather than as a live holder. Make the unpushable case file silently and the
    third test fails.
