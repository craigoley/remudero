  rationale: |
    THE CONSTANT, READ at origin/main d186326b7: DEFAULT_SWEEP_POLICY.planFilingAdmissionBound is 3
    (src/lib/sweep.ts). The same value plays two roles:
    - it is the missCap that openPrViewSteps (src/run-task.ts) gives hydratePlanFilingFilesSteps
      (src/lib/open-prs-rest.ts), so a light pass reads at most 3 uncached PR file lists;
    - it is the light pass's plan-filing admission count (availablePlanFilings, sweep.ts).
    Neither role is learned from anything the daemon measures.
    MEASURED by agent Q1 over the core ledger union, 10-15T14:12Z to 10-16T14:12Z (12 of 12 forms read, deduplicated):
    - Of 309 heads classified, 132 started unread, and 90 were still unread at the end of the window.
    - Plan filings admitted while unread (n=20) waited p50 38.4 min, against 0.2 min for read ones (n=68).
    - A plan-only review is never charged to memory admission (0 memory_budget rows across 116), and runs p50 0.9 min.
    W1-T9820 (#12336) reorders the reads so unattributed heads go first, but it deliberately leaves the bound at 3.
    This task removes the constant. The operator ruling (no hard thresholds; tiered, self-healing responses)
    applies, and the operator approved this task on 2026-10-16.
  design: |
    Operator rulings: no new fixed threshold, no new interval constant.
    1. The per-pass read budget is derived each pass from what the daemon measures:
       - the uncached head backlog this pass;
       - the measured cost of a file-list read (its latency, from the existing hydration timings);
       - the read plane's available budget (the existing gh cadence and quota readers).
       It reads as many uncached heads as fit, and always at least one when any head is uncached, so the
       backlog always makes progress.
    2. The plan-filing admission count follows the measured cost of a plan-only review (no memory charge,
       its p50 duration) against the pass's remaining time, not a fixed 3.
    3. Each pass ledgers one row naming the bound it chose and each input with its source. An unreadable
       input falls back to today's 3 and says so in the row.
    4. Classification and the reader are unchanged: only how many reads and admissions a pass takes moves.
