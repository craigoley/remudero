  band_meaning: span
  origin: "operator approval 2026-10-16 ('go with all of your recommendations'): agent Q1's finding that planFilingAdmissionBound and its read cap are fixed numbers"
  plan_refs: [W1-T9820, W1-T2864, W1-T2439, W1-T9780]
  files: [src/lib/sweep.ts, src/run-task.ts, src/lib/open-prs-rest.ts, test/the-plan-filing-bound-is-learned-not-fixed.test.ts]
