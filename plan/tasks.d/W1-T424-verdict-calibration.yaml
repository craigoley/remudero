  attempts: 0
  note: "verify:auto — the join, the rates, the refusal floors and both falsifier directions are
    all fixture-decidable offline.
    risk:high — a wrong attribution rule manufactures evidence against a healthy reviewer (the
    over-attribution arm in design (v) is the trap: fix-typed merges land hourly here); the
    policy-as-data rule and the minimum-population floor are the containment.
    budget_usd 80 — the two miners and the attribution fixtures are the cost; the arithmetic is
    trivial.
    PROOF NOTES: two unit criteria share the forward PATH proof (W1-T387-merged shape, file
    declared in files:); both greps target EXISTING files where their strings must land (0 hits
    at 3b18d95, verified) — never a not-yet-existing path (exec_error, measured).
    NO depends_on: composes with W1-T418 (shared ledger idiom) and W1-T423 (the goldens lock what
    this measures the prediction quality OF), but needs neither merged first."
