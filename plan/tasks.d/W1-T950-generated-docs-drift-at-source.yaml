    PROOF NOTES, AND ONE HONEST GAP. All four proofs are `grep:` with an explicit path, each under
    100 characters with at most one comma and no `"; "`, so `looksLikeScenarioNarrative`
    (`src/lib/task-linter.ts`) cannot fail them, and each was verified to match ZERO today with a
    control confirming the stale form present (`ci, remudero-review] gate` reads 2 in both
    `src/run-task.ts` and `docs/cli-reference.md`). **TWO REQUIRED DELIVERABLES HAVE NO FORM IN THIS
    DIALECT AND ARE STATED IN `design` INSTEAD: the whitespace-collapsing post-regeneration scan, and
    the regeneration run itself.** The dialect can express "this string is present in this file"; it
    cannot express "re-run the generator, then scan". Forcing those into `unit test:` proofs would
    produce titles matching zero tests and cap the review — the exact theatre the dialect gate
    exists to stop. That gap is a further reason this shard is `verify: human`: the operator observes
    the regeneration. **A `grep:` PROOF OVER `docs/ORIENTATION.md` WAS DRAFTED AND DELIBERATELY
    REMOVED** — that file is CORRECT today (post-#2044) and will only go wrong AFTER retro runs, so
    such a proof passes today for the wrong reason and would substantiate nothing.
