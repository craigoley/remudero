- id: W1-T950
  title: "A CORRECTION APPLIED TO A GENERATED ARTIFACT REVERTS ON THE NEXT GENERATION, SILENTLY — the required-checks contract was fixed in docs/ORIENTATION.md and left stale in MASTER-PLAN §12 that regenerates it, so the next `rmd retro` restores the wrong text and nothing reports the regression"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: |
    THIS IS A CLASS, NOT TWO INCIDENTS. The repository's required status check contexts are exactly
    two — `remudero-review` and `ci-gate`. `ci` is not a required context; it gates transitively via
    `.github/workflows/ci-gate.yml`, which aggregates fourteen checks including `ci` and
    `coverage-ratchet`. The migration is recorded independently at `docs/review-gate.md:72`, which
    names the prior gate as `["ci", "remudero-review"]`.

    Several surfaces carried the stale pre-migration claim and were corrected one at a time: #2043
    fixed two comments in `src/run-task.ts`, #2044 fixed `docs/ORIENTATION.md`, #2046 fixed
    `docs/plan-sync.md` (THREE sites, one of which wraps across a line break and is invisible to any
    single-line grep) and `docs/alert-lane.md`.

    TWO OF THOSE CORRECTED SURFACES ARE GENERATED, SO THE FIXES ARE NOT DURABLE.

    (1) `docs/ORIENTATION.md` states at its own line 3 that it is regenerated by `rmd retro` and that
    hand edits are overwritten; its rule-list heading says the invariants are extracted VERBATIM from
    MASTER-PLAN §12. The generator is `src/lib/orientation.ts`, whose `REL_PATH` is
    `docs/ORIENTATION.md` and which calls `extractStandingRules(readFileSync(join(worktreePath,
    "MASTER-PLAN.md")))`. MASTER-PLAN.md still carries the stale rule 3B. So the merged #2044 fix is
    expected to be REVERTED by the next retro run, restoring the wrong contract with no failing check
    and no notice — the regression arrives as a routine retro-sync PR.

    (2) `docs/cli-reference.md` carries the stale pair twice inside the `rmd alert-fix` entry. Its
    header reads `AUTO-GENERATED -- DO NOT EDIT BY HAND`; it is produced by
    `scripts/generate-cli-reference.mjs` from the `COMMANDS` registry in `src/run-task.ts`, and
    `npm run cli-reference:check` fails CI on drift. Hand-editing it is therefore both forbidden and
    futile; the registry string is the only durable place to fix it.

    THE GENERAL DEFECT IS THE ONE WORTH FIXING: a correction applied downstream of a generator passes
    review, merges green, and is silently undone the next time the generator runs. Nothing in the
    repository detects that a generated artifact has been hand-corrected against its source.
  design: |
    (i) SCOPE ITEM ONE — CORRECT EACH STALE CLAIM AT ITS GENERATING SOURCE, never in the artifact.
    For `docs/ORIENTATION.md`: correct MASTER-PLAN §12 rule 3B so the extracted text is right at
    source. For `docs/cli-reference.md`: correct the `rmd alert-fix` entry in the `COMMANDS` registry
    in `src/run-task.ts`, then regenerate with `npm run cli-reference` and commit the regenerated
    file — regenerating is correct, hand-editing is not.
    (ii) SCOPE ITEM TWO — ENUMERATE, DO NOT ASSUME. Audit which files under `docs/` are GENERATED and
    from what source, and report the inventory as a table of artifact -> generator -> source of
    truth. THE TWO NAMED ABOVE ARE NOT ASSUMED TO BE THE COMPLETE SET; the deliverable is the
    enumeration itself. `scripts/` currently holds five `generate-*.mjs` scripts and
    `src/lib/orientation.ts` writes a sixth artifact, so a survey that stops at the two known cases
    has not done the task. For each generated doc found, state whether it carries a claim that was
    corrected downstream rather than at source.
    (iii) THE SCAN MUST COLLAPSE WHITESPACE. A single-line grep UNDER-REPORTS and this is measured,
    not theoretical: the third stale site in `docs/plan-sync.md` spanned lines 7-8 and was invisible
    to every single-line sweep run before #2046. The acceptance scan must normalise whitespace across
    line boundaries before matching, and must carry a positive control on a pattern known present so
    a zero is a measurement rather than an empty query.
    (iv) THE REGENERATION PROOF IS THE POINT. A fix that reads correctly BEFORE regeneration and
    wrongly AFTER is precisely the defect being closed, so the evidence must be taken from a tree
    where the generator has actually run: regenerate `docs/ORIENTATION.md` through the real
    `src/lib/orientation.ts` path and re-run the scan against the REGENERATED artifact. Reading the
    committed file proves nothing about what retro will produce.
    (v) EXPLICITLY OUT OF SCOPE: any further hand-edit of a generated artifact — that is the defect,
    not the remedy — and any change to `docs/review-gate.md`, which is already correct and is the
    corroborating source for the whole contract. Do not touch branch protection.
    (vi) WHY `verify: human`. This edits MASTER-PLAN.md, the plan surface, which is Architect
    territory under standing rules 15/16 and must never auto-dispatch. `isDispatchEligible`
    (`src/lib/drain.ts`) refuses any task whose `verify` is not exactly `auto`, so this shard cannot
    be selected by the fleet.
  acceptance:
    - claim: "MASTER-PLAN rule 3B names the two required contexts rather than the pre-migration pair"
      proof: "grep: ci-gate` AND `remudero-review` in MASTER-PLAN.md"
    - claim: "the alert-fix command registry names the aggregated gate at source"
      proof: "grep: ci-gate, remudero-review] gate in src/run-task.ts"
    - claim: "the regenerated cli-reference carries the corrected naming rather than the stale pair"
      proof: "grep: ci-gate, remudero-review] gate in docs/cli-reference.md"
    - claim: "the inventory of generated docs and their generators is recorded rather than assumed"
      proof: "grep: generated docs and their generators in MASTER-PLAN.md"
  risk: high
  origin: oper#generated-docs-drift-source-2026-08-17
