    THE W1-T950 MINT WAS ATTEMPTED TOO, AND FAILED THE SAME WAY. Same shape: orphan commit
    `fd743b4e11c88424c4cb68b902eeccf50fe00f63` over the empty tree
    `4b825dc642cb6eb9a060e54bf8d69288fbee4904`, nonce `vm-2043-1786969326358230300`, refspec braced,
    exit status captured into a variable. It exited 1 with this stderr, VERBATIM:
    `error: RPC failed; HTTP 403 curl 22 The requested URL returned error: 403` /
    `send-pack: unexpected disconnect while reading sideband packet` /
