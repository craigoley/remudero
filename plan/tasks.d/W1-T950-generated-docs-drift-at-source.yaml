  note: |
    `verify: human` IS DELIBERATE AND IS NOT NEGOTIABLE. The diff edits MASTER-PLAN.md — the plan
    surface — which standing rules 15/16 reserve to the Architect. `isDispatchEligible`
    (`src/lib/drain.ts`) returns false for any task whose `verify` is not exactly `auto`, before any
    dependency or circuit-breaker probe, so this shard is unselectable by the fleet by construction.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. The declared files span
    three concerns — the plan surface, `src/`, and a generated doc under `docs/`. The pair is not
    decomposable: correcting the registry string without regenerating its artifact leaves
    `npm run cli-reference:check` red, so the source edit and the regenerated file are one change.
    The actual blast radius is prose plus one regenerated artifact; no gate, disposition or policy
    value moves.

    `files:` DETERMINED BY READING THE SOURCE AT `fa064893f28f51590af0f8c61575a9d17f878368`, not
    guessed. What was read: `MASTER-PLAN.md:3437` carries the stale rule 3B text
    (`` `ci` (typecheck+tests) AND `remudero-review` ``); `src/run-task.ts:20656` is the `COMMANDS`
    registry entry for `rmd alert-fix` carrying `[ci, remudero-review]`, and `src/run-task.ts:19379`
    carries the same stale pair in `alertFixCommand`'s own JSDoc — a THIRD site in that file which
    #2043 did not touch, since #2043 corrected the two merge-gate comments rather than the alert-lane
    ones. `src/lib/orientation.ts` is the ORIENTATION generator: `REL_PATH = "docs/ORIENTATION.md"`
    and it calls `extractStandingRules` over the worktree's own `MASTER-PLAN.md`.
    `docs/ORIENTATION.md` IS DELIBERATELY NOT DECLARED — it is regenerated by the retro lane in its
    own PR, and hand-editing it is the very defect this task closes.

    ID PROVENANCE — THIS SHARD WAS FILED AS W1-T949 AND RENUMBERED TO W1-T950 AFTER A COLLISION.
    THE ORIGINAL FILING, AT `fa06489`: four surfaces swept with three positive controls —
    `refs/rmd-id/*` max 946 over 46 refs; shard FILENAMES on origin/main max 947 over 326 files; ids
    in the `plan/` tree max 947; every OPEN PR's TITLE (3 open, no id in any title); and every OPEN
    PR's FILE LIST, which was the only surface that saw W1-T948 (#2042's
    `plan/tasks.d/W1-T948-specialist-tddstrict-trigger-unreachable.yaml`). Controls: `refs/rmd-id/`
    read 1 for the known-taken W1-T946; the shard-filename surface read 1 for the known-taken
    W1-T947; the file-list extractor read W1-T948 out of #2042.
    **THE RESERVATION WAS NOT OBTAINED** — and it is kept on ONE LINE here deliberately, because
    this shard's own design clause (iii) is about single-line greps under-reporting across a wrap,
    and an earlier draft of this very note split that phrase in two and broke the PR proof that
