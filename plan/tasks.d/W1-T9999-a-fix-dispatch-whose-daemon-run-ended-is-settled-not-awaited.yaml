  design: |
    No new fixed bound (standing operator rule). Liveness is decided by process identity and ledger order, not by time.
    1. RECORD THE SEED. `priorActionsFromLedger` keeps, beside `fixed`, the newest seeding row per `<pr>@<head>`:
       its `ts` and `run_id`.
    2. READ ONLY THE SEED'S OWN RUNG. In the conflicted/blocked-fixable dedup, the stall read takes only rows of the
       PR's fix key written at or after the seed's `ts`. Rows before the seed belong to an earlier rung and never speak
       for this dispatch, so an earlier rung's handed_off stand-down cannot hold a later dispatch's head.
       `fixRungStalledWithoutNewHead`'s semantics for the rows it is given are unchanged (its existing tests stand).
    3. A SEED WITH NO RUNG ROW YET.
       - Seeded by THIS daemon run (`run_id === deps.runId`): live. The in-process claim (W1-T2520) and the detached
         registry (W1-T9969) own it, and the dedup is unchanged.
       - Seeded by an EARLIER daemon run: its detached dispatch died with that process. The pass writes one
         `sweep.fix.seed_orphaned` row (pr_number, head_sha, seed_ts, seed_run_id, run_id) and does not dedup, so the
         existing claim, strike ladder and progress judge decide a fresh round from fresh evidence.
       - When W1-T9114 lands, a seed whose dispatch a run child adopted is live, read from that adoption's row.
    4. A SEED WHOSE OWN RUNG HANDED OFF. A handed_off stand-down after the seed stays a live wait only until the sweep,
       its owner, has disposed that same head after the hand-off. Reaching this dedup arm (conflicted or blocked-fixable)
       at the handed-off head on a later pass is that receipt: the CI wait it handed over has resolved, so the rung
       reads ended and the pass may dispatch.
    5. The stand-down text for a held seed names the seed: "fix dispatched at <ts> by <run_id> for this head (<sha>)",
       so a reader can tell a live wait from an orphan.
    6. TESTS. A new file, test/a-fix-dispatch-whose-daemon-run-ended-is-settled.test.ts, with the `test(` titles
       verbatim as in the proofs. Drive `runSweep` with fakes and an in-memory ledger shaped like the #12390 timeline;
       fixed timestamps, no network.
