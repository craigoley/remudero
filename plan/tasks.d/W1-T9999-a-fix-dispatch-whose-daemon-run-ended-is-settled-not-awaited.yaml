  falsifier: |
    The #12390 timeline in miniature: fix.dispatch, fix.done and a rung.ci_handoff handed_off stand-down at head H by
    run A; sweep.disposed post-review and mergeable at H by run B; sweep.disposed conflicted acted true at H by run B;
    then a pass by run C with H conflicted. At origin/main that pass stands down "fix already dispatched for this head",
    so the ended-run and earlier-hand-off tests fail. With the fix it writes sweep.fix.seed_orphaned and dispatches.
    Ways to break it, and the test that catches each:
    - Settle every seed with no rung row, whatever run wrote it: the this-run test fails (W1-T2520's double dispatch).
    - Keep reading rows before the seed: the earlier-hand-off test fails.
    - Drop the hand-off as a live wait outright, before the sweep has received it: the existing
      test/a-stood-down-fix-rung-re-derives-its-remedy.test.ts title "a hand-off to the sweep is still a live wait,
      not a stall" still holds for the bare stall read, and the received-hand-off test pins the receipt rule.
  note: |
    EFFECT, measured after merge from the core ledger: count heads with three or more consecutive "fix already
    dispatched for this head" stand-downs whose seeding sweep.disposed row has a run_id other than the daemon run
    writing them. Healthy shape: none, and each sweep.fix.seed_orphaned row is followed by a fix.dispatch for the
