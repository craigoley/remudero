  note: "verify:auto — every deliverable is a function over fixture ledgers and a registry write,
    decidable in-process; the operator's judgment enters at the INBOX, where it already lives.
    risk:high — the escalation writes to the proposal registry, and a wrong signature table
    manufactures evidence against innocent rules; the falsifier's before/after-date arms are where
    that risk is managed. Rule 19 span (src + docs + test) is one concern: a metric, its verb, and
    the reference the verb regenerates.
    budget_usd 80 — the signature table's initial population and the idempotent-escalation tests
    are the cost; the join is small.
    PROOF NOTES: two criteria share the forward PATH proof (the W1-T387-merged shape; the file is
    declared in files:); the grep forward-references the metric name into docs/cli-reference.md —
    an EXISTING file where the regenerated help line must land, 0 hits at db22bd8 (verified), the
    no-third-option form. A grep at a not-yet-existing path is exec_error, not a forward
    reference — measured while filing, which is why none is used here. LEDGER UNREACHABILITY NOTE: filed while the daemon host is down —
    every ledger figure in the rationale cites prior measured reports, and the worker needs no
    live ledger (fixtures drive every test).
    NO depends_on: lib/ledger-grep.ts and the inbox helper are both on main."
