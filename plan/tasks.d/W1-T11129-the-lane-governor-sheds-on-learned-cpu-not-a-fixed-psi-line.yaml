  rationale: |
    MEASURED 2026-10-27 02:31–02:46Z on the Azure host, 8 vCPU (source: ~/Remudero-notes/efficiency-findings-2026-10-27.md, re-filed 2026-11-02):
    - The box is CPU-bound: load 24–30, sar idle 2.9%, CPU PSI some 65–83 against memory 0.3–0.8 and io about 1–2. Core used 423% CPU and serve 222%.
    - `review.capacity` shed on `cpu-pressure` to an effective width of 1 of 4, with 10 queued. The trigger was core's cgroup CPU PSI full of 36–44 against the fixed `cpuPsiHighPct` of 20.
    - cpu.weight is 303 for serve and 59 for each daemon, so a daemon's PSI full rises with serve's share and does not measure the daemon's own overload.
    - By 11-02 (Azure handoff), load was 34–47 with CPU PSI 50–79% and review width was still 1, holding 10 PRs.
    READ at origin/main d04469fa2: review-capacity.ts:281 sheds when cpuPsiFullAvg10Pct >= policy.cpuPsiHighPct (plan/policy.yaml:665, value 20). lane-governor.ts (W1-T9097) is memory-only and in shadow mode; its only CPU input is `bounds.push([Math.floor(inputs.cpuCount), "cpu"])` (:119). Memory admission does not bind.
    NOT COVERED: W1-T9097 (merged) built the memory arm. W1-T2985 moved the shed from PSI some to full; W1-T3025 and W1-T2989 (blocked) are about the widener and the host worker budget.
  design: |
    1. The governor reads each lane class's CPU use from cgroup cpu.stat usage_usec deltas over the lanes it ran (the run-child rows already name the class), keeps a running median per class, and learns the non-lane baseline from the same counter while no lane runs. CPU bound = (host CPUs − baseline) / per-lane median. No constant: an unlearned class or unread counter falls back to today's CPU-count cap.
    2. Review capacity replaces the fixed `cpuPsiHighPct` comparison with the governor's CPU verdict. PSI full is judged against the container's own weight share (weight / sum of running containers' weights), so contention the weight itself predicts is not overload. An unread or stale share holds: nothing is shed on PSI alone, and nothing is added on it. The shed and restore cadence are W1-T11150's (one review per overloaded sample, restore in proportion to relief, and its effect check); healthy-window widening is untouched. This task adds no halve tier and no stepped grow-back.
    3. Remove `cpuPsiHighPct` from plan/policy.yaml once nothing reads it. The governor's own lane count keeps its current mode (shadow until enforced); the review shed reads the learned verdict in either mode, since it replaces a live fixed line.
  note: |
    Amended 2026-11-04 (operator ruling ~20:20Z, "Narrow W1-T11129"): W1-T11150's one-step shed and proportional restore stand. W1-T11129 contributes only the share-relative PSI verdict, the governor's CPU verdict and learned bound, the hold on an unread or stale share, and the retirement of cpuPsiHighPct. Criterion 2 and design 2 dropped "tiered (hold, shrink one, halve)" and the stepped grow-back: with a share known, those tiers took W1-T11150's second shed 3 -> 1 where it asserts 3 -> 2, and held width at 1 where it restores 2 -> 3 -> 4; they also blocked healthy-window widening. With the tiers removed, the sibling suites keep their own assertions; only their fixtures gain a learned share.
    Amended 2026-11-04 (hold rule for #16523): an unread or stale cpu.weight share HOLDS and never sheds on PSI alone, and cpuPsiHighPct is retired from plan/policy.yaml and its loader in src/lib/sweep.ts (REVIEW_CAPACITY_FIELDS and the low-below-high check). The 18:56Z review of #16523 failed the fallback to the fixed line while the share is unread, which criterion 2 forbids ("with no fixed cpuPsiHighPct"). That contradicts the earlier amendment below ("keeps today's fixed line"); the criterion wins, as does the operator's standing rule of no fixed thresholds. Nine sibling review-capacity suites build observations with no share and expect a CPU shed (W1-T11150, W1-T2985, W1-T3031's falsifier and others), so they join files: their fixtures gain a learned cpu.weight share so the shed they assert is still driven by real contention, never weakened (made possible by the ruling above, which removed the tiers). W1-T11150's suite is shared with that task only for this fixture change: W1-T11150 owns the shed's effect check, and this task changes none of it.
    Amended 2026-11-04 (scope for #16523): deploy/memory-high-tuner.sh and its suite join files. Criterion 2 judges PSI against the container's cpu.weight SHARE, but a container reads only its own /sys/fs/cgroup/cpu.weight (core 59); its siblings' weights (serve 303, console 59, site 59) are visible only from the host under system.slice/docker-<id>.scope. The host-side tuner already resolves each container's cgroup scope on every tick and writes learned values into each instance's state dir, so it records every fleet container's cpu.weight there as well, and the daemon's lane-governor reader computes the share from that file. An unreadable file keeps the share unread, which keeps today's fixed line.
    Filed 2026-11-02 from the 2026-10-27 efficiency findings, item 2 (p1, CPU). The operator's standing rules apply: no hard thresholds, and tiered, self-healing responses.
