  status: blocked
  retirement: retired
  # plan gardener: retire W1-T3958 — It depends on W1-T3762, which will never be built.
  attempts: 0
  rationale: |
    Kilo Auto Model is a useful product parallel because it turns model choice into a measured,
    session-aware pool: candidate model-plus-thinking pairs are benchmarked, only Ready candidates
    are eligible, and a fixed cost-effective fallback remains when routing evidence is unavailable.
    RMD already has the ingredients in separate tasks: W1-T167 and W1-T250 define class-aware policy
    and headroom, W1-T3576 supplies replayable raw probe evidence, and W1-T3762 supplies assignment-
    to-receipt telemetry. What is still missing is the bounded selection contract that closes that
    loop without making an opaque router the new authority.

    Official Kilo references: https://kilo.ai/docs/code-with-ai/agents/auto-model and
    https://blog.kilo.ai/p/the-router-inside. RMD should borrow the readiness and evidence model,
    not assume Kilo's benchmark corpus or hosted model catalog is transferable.
  design: |
    Add a versioned `routing-pool-v1` record for each eligible task class and capability tier. Each
    candidate names provider/model/effort, adapter and tool profile, benchmark corpus/version, last
    probe time, success/quality/cost/latency aggregates, and readiness state `benchmarking`, `ready`,
    `failed`, or `unavailable`. Only ready candidates enter selection. Selection is deterministic
    for a session given the same pool snapshot, task class, budget, and capability requirements; it
    records the route reason, pool revision, candidate set, chosen pair, fallback, and terminal join
    key in the existing routing receipt.

    Keep a fixed reviewed baseline per task class as the fallback. Do not route on aggregate quality
    without a comparable corpus, infer cost from missing data, or silently manual-switch providers
    when a pool is unavailable. A session may remain pinned to its chosen route unless a declared
    capacity or safety refusal invokes the bounded fallback. Promotion of a newly ready candidate is
    policy/review work, not a benchmark side effect. Unknown, stale, or unjoined evidence remains
    visible and non-promotable.
  acceptance:
    - claim: "candidate model-plus-effort records expose benchmarking, ready, failed, and unavailable states with corpus and observation provenance"
      proof: "grep: W1-T3958 criterion 1 in test/model-pool-readiness.test.ts"
    - claim: "selection admits only Ready candidates and is deterministic for an identical session, task class, pool revision, budget, and capability profile"
      proof: "grep: W1-T3958 criterion 2 in test/model-pool-selection.test.ts"
    - claim: "a stale, failed, unavailable, over-budget, or unjoined pool selects the fixed reviewed baseline or refuses explicitly and never invents a quality or cost result"
      proof: "grep: W1-T3958 criterion 3 in test/model-pool-fallback.test.ts"
    - claim: "the route receipt preserves pool revision, candidate set, chosen model and effort, reason, fallback, and terminal assignment join key"
      proof: "grep: W1-T3958 criterion 4 in test/model-pool-selection.test.ts"
    - claim: "the public daemon contract names routing-pool-v1 and its readiness/fallback states"
      proof: "grep: routing-pool-v1 in openapi/daemon.yaml"
    - claim: "the provider path calls the routing pool rather than leaving the new module test-only"
      proof: "grep: selectFromRoutingPool( in src/lib/worker-provider.ts"
  falsifier: |
    Select a failed candidate, use an incomparable benchmark to promote a model, impute missing cost
    or quality as zero, change a session's route without a declared refusal, or hide the baseline
    fallback. The corresponding proof must fail.
  note: "This layers a selection contract over W1-T167/W1-T250/W1-T3576/W1-T3762; it does not replace class policy, probe evidence, or assignment telemetry. reservation hand-off: run-W1-T3956-17899977143N -> run-W1-T3956-1789997714300"
