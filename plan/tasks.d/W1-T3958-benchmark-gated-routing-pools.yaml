- id: W1-T3958
  title: "ROUTE FROM BENCHMARK-READY MODEL POOLS — session-aware model-plus-effort selection with outcome/cost evidence, explicit readiness, and a fixed baseline fallback"
  repo: remudero
  depends_on: [W1-T167, W1-T250, W1-T3576, W1-T3762]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 90.00
  risk: high
  band_meaning: blast-radius
  origin: "research:kilo-ai-auto-model-2026-09-21"
  plan_refs: ["§Headroom", "§Self-improvement", "W1-T167", "W1-T250", "W1-T3576", "W1-T3762"]
  files:
    - src/lib/model-pool.ts
    - src/lib/worker-provider.ts
    - src/lib/analytics-route.ts
    - openapi/daemon.yaml
    - test/model-pool-readiness.test.ts
