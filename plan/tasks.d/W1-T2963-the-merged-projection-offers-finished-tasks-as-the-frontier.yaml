  attempts: 0
  rationale: |
    MEASURED 2026-09-06 against a trailer-built merged set of 796 ids over the whole commit history
    of origin/main. The selector's top candidates, and what is actually on disk:
      W1-T122  PLAN SHARDING (plan/tasks.d/) ...... 1141 shards exist ......... UNCREDITED
      W1-T126  DAEMON SELF-FRESHNESS .............. checkFreshness x3 in daemon.ts . UNCREDITED
      W1-T121  QUEUE GOVERNOR ..................... queue_governor in daemon.ts .... UNCREDITED
      W1-T123  ci-gate dedupe-by-name ............. present in ci-gate.yml ......... UNCREDITED
    All four shipped. All four are what `runnableCandidates` offers next. 586 of 1405 tasks read as
    uncredited, and the ones at the FRONT are done — so the queue's head is phantom and the fleet
    will rebuild finished work the moment dispatch resumes (W1-T2960).

    THE CAUSE IS COVERAGE, NOT A BROKEN QUERY. CLAUDE.md already records that the trailer set
    under-credits and must be unioned with `findMergedByHeadBranch`'s `run-<id>-<digits>` head-ref
    path — #1657 carries ZERO trailers and is credited only by its head. These four predate the
    trailer convention AND their branches are long deleted, so neither path reaches them: GitHub
    deletes a head on merge, which CLAUDE.md's own clause (d) names as a zero that means "completed"
    rather than "never started".

    A THIRD PATH IS THEREFORE NEEDED AND ITS SHAPE IS ALREADY IN THE REPO. `scripts/task-id-existence-baseline.json`
    is the precedent: a small, WRITTEN-REASON baseline for ids that resolve to neither surface because
    they predate the surface. The same shape credits a pre-trailer task once, by hand, with a citation
    a human can check — never a heuristic that guesses from file contents, which would silently
    credit unfinished work and is strictly worse than the current under-credit.

    DO NOT "FIX" THIS BY MAKING THE SELECTOR SKIP OLD IDS. Age is not evidence of completion, and a
    rule that skipped low ids would hide genuinely unbuilt early tasks forever. The remedy must credit
    what is DONE, not filter what is OLD.
