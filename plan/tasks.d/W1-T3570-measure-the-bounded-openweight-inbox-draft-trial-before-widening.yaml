  attempts: 0
  note: |
    reservation hand-off: chore/file-openweight-output-contract-1789389121907 -> chore/file-openweight-resequence-1789389121907

    This is the required decision record before any second lane. It reads durable
    receipt/classification evidence only after W1-T3569's real, capped production
    trial. It neither changes a mount nor opens an Azure request. W1-T3558 explicitly
    depends on this verdict: the deferred WebSearch bridge is not a substitute for
    demonstrating that this adapter repays its own retry cost on inbox drafts.
  rationale: |
    Token prices are not the outcome. runDraftRung records each attempt and its
    `inbox.classified` readiness result; the relevant numerator is accepted drafts,
    with relints and abandoned drafts charging against the same cash envelope. The
    current historical Claude lane is the comparison population, not a prompt-only
    probe. Twenty terminal drafts is a minimum sample for an admission decision, not
    proof that every future proposal will behave identically.
  design: |
    Write one committed report with its query, time window, receipt identities, and
    both positive controls for the live and rotated ledger forms. For at least 20
    terminal inbox-draft proposals, report first-lint acceptance count, relints used
    against MAX_RELINT_ATTEMPTS, abandoned count, total Azure cash, accepted drafts per
    dollar, and the matching Claude baseline. Treat missing/unreadable receipts as
    unmeasurable, never as zero cost or an accepted draft. End with exactly one
    recommendation: widen to the next lane, hold, or stop. A relint pattern that
    exhausts MAX_RELINT_ATTEMPTS is a stop result even when per-token cost is lower.
  acceptance:
    - claim: "the report identifies at least 20 terminal inbox-draft outcomes with receipt-backed acceptance, relint, abandonment, and Azure-cash totals"
      proof: "grep: terminal inbox-draft outcomes in docs/recon/openweight-inbox-draft-trial.md"
    - claim: "the report compares accepted drafts per dollar against a stated Claude baseline and ends with one widen, hold, or stop verdict"
      proof: "grep: Recommendation: in docs/recon/openweight-inbox-draft-trial.md"
  falsifier: |
    Remove the terminal-outcome identities or the cash denominator from the report and its
    acceptance proof must no longer resolve. A report with fewer than 20 terminal outcomes, a
    missing positive control, or a recommendation that is not one of widen/hold/stop is not a
    measured verdict and must remain unmerged.
