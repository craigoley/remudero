  rationale: |
    Token prices are not the outcome. runDraftRung records each attempt and its
    `inbox.classified` readiness result; the relevant numerator is accepted drafts,
    with relints and abandoned drafts charging against the same cash envelope. The
    current historical Claude lane is the comparison population, not a prompt-only
    probe. Twenty terminal drafts is a minimum sample for an admission decision, not
    proof that every future proposal will behave identically.
  design: |
    Write one committed report with its query, time window, receipt identities, and
    both positive controls for the live and rotated ledger forms. For at least 20
    terminal inbox-draft proposals, report first-lint acceptance count, relints used
    against MAX_RELINT_ATTEMPTS, abandoned count, total Azure cash, accepted drafts per
    dollar, and the matching Claude baseline. Treat missing/unreadable receipts as
    unmeasurable, never as zero cost or an accepted draft. End with exactly one
    recommendation: widen to the next lane, hold, or stop. A relint pattern that
    exhausts MAX_RELINT_ATTEMPTS is a stop result even when per-token cost is lower.
  acceptance:
