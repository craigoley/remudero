- id: W1-T3737
  title: "THE LOCAL CI MIRROR IS ALREADY BUILT AND NOBODY RUNS IT — `preflight` checks 3 of 42 by default and says 'the push may proceed', while `--fast` checks 20 in 29 seconds with no false reds; the cheapest process improvement available is changing which tier is the default"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED 2026-09-17, on worktrees cut from origin/main.

    (1) THE DEFAULT GIVES A GREEN ON A DIFF CI WILL REFUSE. Reproducing the exact shape that
        blocked #5928 — one comment line added to a file sitting at its recorded ceiling:

          $ rmd preflight            -> PASS in 12s: "the push may proceed"
          $ rmd preflight --fast     -> FAIL in 35s: comment-load-ratchet BLOCKED

        Same tree, same second. The default does not check it; the flag does.

    (2) THE FLAG IS FAST AND CLEAN. On an UNMODIFIED main checkout, `--fast` ran TWENTY checks in
        29 seconds with zero false reds: cli-reference, claims, learnings-budget-ratchet, jscpd,
        comment-load, depcruise, api-client-drift, no-hand-rolled-fetch, source-size, lint-plan:fast,
        six censuses, worker-branch-shape. `FAST_GATE_STEPS` carries 17 entries and every one is
        runnable. Nothing needs building.

    (3) THE SUMMARY LINE UNDER-REPORTS EVEN WHEN THE FLAG IS PASSED. After those twenty checks it
        still prints, verbatim:

          ### rmd preflight: PASS — commitlint, typecheck, and emitter checks are all clean;
              the push may proceed

        Three named, twenty run. So the one sentence a builder reads is wrong in BOTH directions:
        it over-claims on the default path and under-claims on the flagged one. This repo's own
        standing rule is that a check reporting its own success is the most dangerous failure mode;
        this is that rule, in the tool every builder trusts most.

    (4) THE NEXT TIER UP IS NOT DEFAULTABLE, AND THE MEASUREMENT SAYS SO. `--ci-parity` took 556s
        (9.3 min) and produced TWO local-environment false reds on a clean checkout (a missing
        `@vitejs/plugin-react` for `dashboard:ci`, and a coverage shard). Published guidance puts
        the commit-level loop bound at ten minutes before developers route around it, and a mirror
        that reds on a clean tree gets abandoned faster than that. So this task moves ONE tier.

    (5) WHAT IT WOULD HAVE COST TODAY. Of roughly thirty refusals worked through this session,
        about twenty were locally detectable in seconds and cost a full CI round instead — a code
        PR's cycle measured 20.3 min. Four were comment-load alone, which `--fast` catches in 29s.

    (6) WHY "ADD A RULE" HAS NOT WORKED, AND CANNOT. `spawnWorker` passes `settingSources: []`, so
        NO DISPATCHED WORKER READS CLAUDE.md — this repo already ruled on that in the ci-learning
        rung's own text. Every instruction-shaped improvement has been invisible to the agents it
        was written for. Published work on agentic coding says the same from the other side: agents
        "follow the permissiveness of your design rather than unstated conventions", so the lever is
        the default path, not the documentation.
  design: |
    (i) MOVE THE DEFAULT, DO NOT MOVE THE CHECKS. `runPreflightFast` and `FAST_GATE_STEPS` are
        untouched; `preflightCommand` runs the fast tier unless told not to. The escape is
        `--no-fast`, because a bound with no escape is a wall and an operator on a slow host must
        still be able to push. `--fast` keeps working and becomes a no-op, so every existing call
        site and every worker prompt that passes it is byte-identical.

    (ii) THE SUMMARY LINE NAMES WHAT IT RAN AND WHAT IT DID NOT. Composed from the step table
         actually executed, never a sentence hand-written beside it — that is exactly how the
         current line came to name three checks while twenty ran. It states the mirrored count
         against the 42 pull-request jobs `ci-parity:drift` already enumerates, so a green says how
         much of CI it speaks for and a reader can never mistake it for all of CI.

    (iii) NEITHER TIER BECOMES A CEILING. `--ci-parity` stays opt-in on its 9.3-minute measurement;
          this task does not widen it, and does not add a gate anywhere.

    NOT IN SCOPE: the two local-environment false reds `--ci-parity` showed (a real finding, filed
    separately — a mirror that reds on a clean tree is why nobody runs the deeper tier), and the
    payload-driven gates `acceptance-author-gate` / `proof-discrimination`, which both accept
    `--event-path` and could be mirrored from a synthesized payload. That is the next tier and it
    needs its own measurement.
  acceptance:
    - claim: "the default preflight run executes the fast gate, so a builder who types the documented command gets the checks that refuse most pull requests"
      proof: "unit test: the default preflight run includes the fast gate steps"
    - claim: "an operator can still decline the fast tier, because a bound with no escape is a wall"
      proof: "unit test: --no-fast returns the previous three-step run"
    - claim: "the summary line is composed from the steps that actually ran, so it can never name fewer checks than were performed"
      proof: "unit test: the summary names every step tier that ran"
    - claim: "a green states how much of the pull-request surface it speaks for, so it cannot be read as all of CI"
      proof: "unit test: the passing summary names its mirrored coverage"
  falsifier: |
    Hand-write the new summary sentence instead of composing it from the executed step table and
    the third assertion goes red — that hand-written sentence is precisely how the current line
    came to name three checks while twenty ran, so a fix that repeats the shape is not a fix. Make
    `--fast` an error rather than a no-op and every existing call site breaks, which the second
    assertion catches by still exercising the flag. Drop `--no-fast` and the second goes red. Widen
    the default to `--ci-parity` and the 9.3-minute measurement in the rationale is the argument
    against it; no assertion here would catch that, so it is stated rather than pinned.
  risk: medium
  band_meaning: blast-radius
  origin: human
  plan_refs: [W1-T2810, W1-T2646, W1-T3099]
  files: [src/run-task.ts]
  status: queued
  attempts: 0
  note: |
    reservation hand-off: unknown -> file-t3737-the-mirror-nobody-runs

    `files:` names no test path, deliberately: `proof-unit-test-unresolvable` refuses a filing that
    declares one until W1-T3730 lands. The build adds it back.

    Research consulted before filing, and it moved the design twice: the ten-minute commit-loop
    bound is why `--ci-parity` is NOT the default, and the policy-as-code pattern of running the
    SAME executable locally and in CI is why this moves a default rather than adding a check.
