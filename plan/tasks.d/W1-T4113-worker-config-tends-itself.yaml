- id: W1-T4113
  title: "WORKER CONFIGURATION IS SET ONCE AND NEVER JUDGED — declared budget_usd has median $30 and p90 $80 across 1,831 shards against an observed implement median $4.08 and p90 $10.30, .remudero/mounts.yaml grew from 10.2 KB to 38.2 KB, the learnings character budget was derived once (2026-08-23), mount recommendations wait for approval, and cost-anomaly.ts 'NEVER ACTS': add a worker-config gardener that recalibrates budgets, adopts mount recommendations and re-derives caps through canaries it judges"
  repo: remudero
  depends_on: [W1-T4110]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  band_meaning: blast-radius
  origin: "operator ask 2026-09-23; research over origin/main d7b569e0d"
  plan_refs: [W1-T4110, W1-T3146]
  files: [src/lib/config-gardener.ts, src/lib/experiment-promotion.ts, src/run-task.ts, test/worker-config-tends-itself.test.ts]
  priority: 2
  status: queued
  attempts: 0
  rationale: |
    READ 2026-09-23 (research): `recommendMounts` sends to the inbox; `declaredBudgetSanityWarning` warns; `cost-anomaly.ts`
    reports only; `experiment-promotion.ts` already has shadow → canary → promote with guardrails and rollback, used
    only by the operator agent. Nothing in src/ judges a configuration change after it is applied.
  design: |
    (i) Classes: RECALIBRATE-BUDGET (queued shards per task class, from the observed cost distribution — no fixed floor),
        ADOPT-MOUNT (a recommendation with enough evidence), RE-DERIVE-CAP (the learnings character budget).
    (ii) Every change goes through experiment-promotion's canary with its guardrails; the class is judged by merge rate
         and cost per merged task in the canary cohort against the rest, and a guardrail breach rolls back and debits.
  acceptance:
    - claim: "a budget recalibration runs as a canary and rolls back on a guardrail breach"
      proof: 'grep: test("W1-T4113: a budget recalibration runs as a canary and rolls back on a guardrail breach" in test/worker-config-tends-itself.test.ts'
    - claim: "the daemon wires the config gardener"
