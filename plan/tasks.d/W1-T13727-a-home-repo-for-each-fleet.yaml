  rationale: |
    aihero.dev "The Home Repo Pattern" (updated 2026-11-12): one private repository holds the skills, the agent
    instruction file and shared docs, with one pointer line per working repository ("Clone from ... if missing") and
    no submodules; code stays in each repository. It suits a mix of public and private repositories. A customer
    running a fleet over many repositories has the same problem: an operator session started in one repository sees
    none of the others' rules or tools. Onboarding (Connect existing / Start new) could create that home repository
    for them.
  design: |
    1. Read the pattern at source and state it with the date read.
    2. List what a fleet's home repository would hold (pointers to every managed repository, operator macros,
       steering files) and what it must not (secrets, ledger state, private plan records), and how it differs from
       the instance registry.
    3. Recommend build, park or refuse, and name the onboarding step it would change.
    Write the report with the three headings the proofs name, each on its own line, label claims OBSERVED or INFERRED,
    and add it to docs/docs-index.json.
