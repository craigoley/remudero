  design: |
    1. COUNT A ROUND THAT LANDED NOTHING. For each (PR, head, alert-number set), a `code_scanning.fix_dispatch`
       counts as an EMPTY round when it is followed by `fix.commit_refused`, `fix.refused`, or a `fix.done` with no
       new head, or when no fix row follows it within the fix lane's existing round bound. The count lives on the
       existing rows the sweep already reads; there is no new state file.
    2. ONE EMPTY ROUND, THEN ESCALATE ONCE. With one empty round at this (head, alerts), the next pass neither
       re-judges nor re-dispatches. It escalates once through W1-T5633's existing unfixable-alert escalation,
       naming each alert (number, rule, path:line), each empty round's outcome, and the head. A new head or a
       changed alert set starts over. "One empty round" is structural: changing it is an operator decision.
    3. THE SINGLE-PR RUNG ROUTES THE HOLD. #13468 (merged 2026-10-22, 779e7f32f) already turns a mergeable PR with a
       FAILED CodeQL check and head alerts into `blocked-fixable` in `rmd fix` (its `securityFix` branch). Extend that
       same branch to a head whose newest arm row is a `security merge blocked` refusal (`securityArmRefusalAtHead`,
       W1-T9731's case: CodeQL not failed), so it does not refuse for want of block evidence. Add no second path.
    4. sweep.ts sits at its comment ceiling: add no new comment lines there.
    5. Tests (new file, titles verbatim as in the proofs): a commit_refused round at a head makes the next pass
       escalate once and not dispatch. A dispatch with no follow-up row inside the round bound counts as empty. A
       new head re-arms the path. The single-PR rung dispatches on a security-alert-hold.
  acceptance:
