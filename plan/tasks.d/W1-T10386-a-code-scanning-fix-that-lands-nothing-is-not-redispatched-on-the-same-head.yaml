  rationale: |
    OPERATOR RULING 2026-10-22: a code-scanning merge block sends a fix round or escalates once, and does not loop.
    PREMISE CORRECTED (OBSERVED, core ledger 10-21T08:49Z..10-22T01:20Z, read-only): fix rounds WERE dispatched,
