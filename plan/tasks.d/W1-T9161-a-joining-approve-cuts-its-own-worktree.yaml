- id: W1-T9161
  title: "A JOINING APPROVE CUTS ITS OWN WORKTREE AND BRANCH — joinRatificationBranch and completeRatificationBranch run `git worktree add -b <the open plan PR's branch>` at that branch's shared path, so any second approve while the first still holds it fails 'a branch named ... already exists': 4 of the 17 fleet approves started from 14:10Z to 14:29:30Z on 2026-10-13, and a retry hits it again"
