  rationale: |
    OBSERVED 2026-10-13 on host remudero, read-only and niced: the core ledger's live file (rotated 13:58Z; positive
    control: 3,943 rows stamped 14:xx) and state/logs/approve-*.log.
      - 17 fleet approves started from 14:10Z to 14:29:30Z (`ratify.cli_started`). 14 took the W1-T4437 join path
        into one of two open ratify PRs:
        #11361, on run-APPROVE-proof-debt-W1-T6372-1791900424090-5b011df233d1, and later the PR on
        run-APPROVE-followup-DAEMON-1789492764199-...-4b13226dc725.
      - 4 died at the add itself, at 14:10:55, 14:12:33, 14:14:29 and 14:23:23Z. Each died with "fatal: a branch named
        'run-APPROVE-...' already exists" from `git -C /home/node/Remudero/repos/remudero worktree add -b
        run-APPROVE-<X> --no-track /home/node/Remudero/worktrees/run-APPROVE-<X> origin/run-APPROVE-<X>`.
      - In each of those runs, its own `worktree.prune` row lists worktrees/run-APPROVE-<X> under `skipped`. A live
        run held it: the PR's original approve (pid 739090, in ci.polling from 14:10:05Z to 14:17:13Z) or another
        joiner. A branch checked out in a live worktree cannot be created again, so `-b` fails.
      - When no live run holds it, `pruneStaleRuns` deletes the leftover local branch first (14:11:56Z, 14:16:26Z,
        14:21:06Z and later rows list it under `branches`), and the add succeeds. So the failure depends on timing,
        and a retry fails again for as long as any approve holds the path.
      - The JOIN-VS-MERGE race: pid 776761 joined #11361 at 14:16:28Z. At 14:17:13Z the PR's original approve wrote
        "automerge.clean_status_direct_merge (already green — merged now)". 776761 then died of the shared-path
        teardown (W1-T9153) before pushing. Had it pushed, its shard would have landed on a branch that was already merged.
    WHY, READ on origin/main c226da0bb (symbols, not lines):
      - `joinRatificationBranch` and `completeRatificationBranch` (the RatifyGateway in `approveCommand`,
        src/run-task.ts) set `worktreePath = join(worktreesDir(config), branch)`, with `branch` being the open PR's
        branch. They call `addLockedRunWorktree(dir, worktreePath, branch, origin/<branch>, ...)`. `worktreeAdd`
        (src/lib/worker.ts) always runs `worktree add -b <branch>`. So every approve that joins one PR claims the
        same path and the same local branch name: the one the PR's creating run also used.
      - `findJoinablePr` takes the newest `ratify.approved` row (`mostRecentApprovePr`, src/lib/inbox.ts), confirms
        the PR is open, and skips it only when `priorArmOnHead` finds an arm row for its head. A PR whose own
        approve is still in its CI wait, and about to direct-merge, reads as joinable.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and all 383 origin heads (fetched 14:31Z) for
    joinRatificationBranch, findJoinablePr, approveRunBranch and addLockedRunWorktree. No head reads more than main.
    Main's one joinRatificationBranch hit is W1-T4706, which is merged and is about the joined PR's body. The control
    term W1-T9124 was read on all 383 heads. W1-T9153 (filed in the same PR) stops a failed add from destroying another
    run's tree. It does not make this add succeed.
  design: |
    No new bound and no retry count. The outcome is decided by git's own fast-forward rule and by a process's
    liveness, never by a timeout.
    1. EACH JOIN AND RESUME CUTS ITS OWN TREE. `joinRatificationBranch` and `completeRatificationBranch` add their
       worktree at this run's own path and local branch, `approveRunBranch(runId)`, cut from `origin/<PR branch>`
       through the unchanged `addLockedRunWorktree`. They never use `-b <PR branch>` or `worktrees/<PR branch>`. A
       leftover local branch named for the PR, from its creating run or from a crashed join, can no longer collide,
       and two joiners never share a path.
    2. THE PUSH NAMES ITS DESTINATION. `gitPushRunBranch` (src/lib/git-push.ts) gains an optional `destination`. The
       join pushes HEAD to `refs/heads/<PR branch>` as a plain fast-forward: no force, no lease override, and the
       existing guards apply to the destination. Every other caller passes none and pushes exactly as today.
    3. A LOST RACE OPENS ITS OWN PR. If that push is rejected as a non-fast-forward, another approve moved the tip
       first. The run releases the ids it reserved (`idBlock.releaseAll()`) and files through
       `createRatificationBranch`'s path instead: a fresh origin/main tree and its own PR, which is the pre-W1-T4437
       shape. It never retries the join, so no attempt count is needed.
    4. NO JOIN INTO A PR WHOSE OWN APPROVE IS STILL DECIDING. `mostRecentApprovePr` also returns the
       `ratify.approved` row's `actor_pid` and `host`. `findJoinablePr` skips a candidate whose approving process is
       alive on this host (`defaultIsPidAlive`), because that run may still merge the PR or arm it. A dead or
       foreign-host pid keeps today's behaviour.
    Tests go in a new file, test/a-joining-approve-cuts-its-own-worktree.test.ts, with `test(` titles verbatim as in
    the proofs. Use a real temporary origin and clone (`gitRepo()` with a fixture identity) so `worktree add` and the
    push are git's own. Drive the gateway methods through `approveCommand`'s `deps` seams.
