    - claim: "two concurrent joins of one PR both file: one joins and the loser opens its own PR"
      proof: 'grep: test("W1-T9161: the join that loses the push opens its own PR" in test/a-joining-approve-cuts-its-own-worktree.test.ts'
    - claim: "a PR whose approving process is still alive is not joined"
