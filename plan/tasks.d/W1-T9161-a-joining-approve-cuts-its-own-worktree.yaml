  falsifier: |
    Keep `addLockedRunWorktree(dir, join(worktreesDir, branch), branch, origin/<branch>)` in the join, and the
    second and third tests fail with git's own "a branch named ... already exists", as at 14:12:33Z. Retry the join
    after a non-fast-forward instead of opening a PR, and the fourth test's loser's shard never reaches any PR within
    the test, or reaches it only by a forced push the test refuses. Drop the actor_pid check, and the fifth test
    joins a PR whose approve fixture is a live child process.
