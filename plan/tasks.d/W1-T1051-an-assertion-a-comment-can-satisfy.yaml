  note: |
    RULE 25 RE-DERIVED WITH FOUR CONTROLS, RUN AGAINST THE REAL `INSTRUMENT_SURFACE` EXPORT RATHER
    THAN READ FROM IT. `.github/workflows/ci.yml` MATCHES, so this task is instrument-entangled and
    THE IMPLEMENTING PR RIDES ALONE. `scripts/assertion-discrimination-check.mjs` does NOT match —
    the script pattern is `-ratchet.mjs`, not `-check.mjs`; `src/lib/review.ts` does not match; and
    `test/…` does not match. Positive control: `scripts/coverage-ratchet.mjs` DOES match, so the
    predicate was live when the three negatives were taken. Note the baseline file DOES match
    (`scripts/<name>-baseline.json`), which only reinforces the ride-alone requirement.

    PROOF DIALECT CHOSEN BEFORE WRITING, AND DELIBERATELY UNIFORM. Every criterion forward-references
    through `unit test:`. A forward-referencing `grep:` at an EXISTING path is a HARD refusal on a
    filing PR — the path is greppable, the symbol is not yet there, the proof executes, returns zero,
    and `executed_fail` overrides keyword coverage. Two filing PRs were refused that way within half
    an hour on 2026-08-20 before the pattern was named, so criterion 6 in particular carries the
    CI-wiring claim as a named test rather than a workflow grep. Sixteen test files already parse
    `.github/workflows/ci.yml` and assert on it, so a test is the house form for that claim.

    THE CHECK IS NARROWER THAN THE PROBLEM AND THAT IS THE POINT. It cannot see a test that pins a
    call instead of a property in any other way, it cannot see the step-name mismatch in (5), and it
    cannot see a fixture that carries the field it claims to prove. Those need their own tasks or
    their own reviewers. A gate that catches only the cheap instance would not be worth its weight —
    this one catches the instance that cost a full day.

    ID PROVENANCE — PRE-MINTED AND READ BACK BEFORE FILING. The reservation resolves to the sha the
    operator's own mint printed. Five surfaces swept over git and source with no GitHub call beyond
    the ref and open-PR reads: the reservation (present, control a sibling id also present); shard
    FILENAMES via `git ls-tree -r` (zero, control a filed id one); ids mentioned under `plan/`
    (zero, control one); open PR text (zero, control one); and `git grep` across `src/ test/
    deploy/` (zero, control W1-T1046 which reads two — the fifth surface exists because that id was
    claimed there while four surfaces read it free). Live `run-` branches for this id read zero
    against a control that reads one. THE SURFACES ARE RE-SWEPT IMMEDIATELY BEFORE PUSHING.
