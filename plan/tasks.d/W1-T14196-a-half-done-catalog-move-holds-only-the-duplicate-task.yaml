- id: W1-T14196
  title: While a catalog move is half-done, the board and the Inbox hold only the duplicate task id instead of refusing the whole ops catalog
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high # changes a fail-closed catalog read; a wrong hold could show a private task twice or hide one
  band_meaning: span
  origin: operator-session#console-update-failed-2026-11-21
  plan_refs: [W1-T13749, W1-T14114, W1-T13680]
  files:
    - src/lib/serve-plan-reload.ts
    - src/lib/status.ts
    - test/console-api/serve/a-half-done-catalog-move-holds-only-the-duplicate-task.test.ts
  status: queued
  attempts: 0
  rationale: |
    OBSERVED 2026-11-21 21:28Z, live probe of serve's own inputs (/mnt/project-files/live-probe-out.txt): every
    board-catalog reply was refused as unreadable, reason duplicate_task_id, so W1-T14114's ops referents never got a
    plan and the core Inbox stayed partial (#19691, #19728, #19721 referentUnverified). The one colliding id is
    W1-T13601: ops #248 (0d1b490, 20:42Z) copied it into the ops catalog, and the public removal (#20072) had not
    merged yet. composeBoardCatalog (src/lib/serve-plan-reload.ts:269) and statusCatalogContext (src/lib/status.ts:79)
    refuse the WHOLE ops catalog when any id is in both catalogs, so every move window blanks the board's and the
    Inbox's ops view. The daemon's task lookup (W1-T13749) holds only the duplicate copies.
  design: |
    In composeBoardCatalog and statusCatalogContext, apply W1-T13749's rule: an id present in both catalogs, or twice
    in one, is held (left out of the combined plan, with its id named in the composed context's reason), and every
    other id composes as today. A read that cannot tell which copy is which, or a duplicate that is not a pure move
    (the ops copy differs from the public one beyond its moved_from line), keeps today's whole-catalog refusal. The
    held ids are named, never their private fields (W1-T12211).

    INVARIANT hold-only-the-duplicate: a duplicate id holds only itself; every other ops task still reaches the board and the Inbox, and a non-move duplicate still refuses the whole catalog.
  acceptance:
    - claim: "With one id in both catalogs as a pure move, the board and the Inbox compose every other ops task and name the held id"
      proof: "grep: W1-T14196 criterion 1: in test/console-api/serve/a-half-done-catalog-move-holds-only-the-duplicate-task.test.ts"
    - claim: "invariant:hold-only-the-duplicate — a duplicate whose ops copy differs from the public one beyond its moved_from line still refuses the whole catalog, and no held task's private field reaches the composed reason"
      kind: guard
      proof: "grep: W1-T14196 criterion 2: in test/console-api/serve/a-half-done-catalog-move-holds-only-the-duplicate-task.test.ts"
  falsifier: |
    Keep the whole-catalog refusal: criterion 1's other ops tasks are missing and the test fails. Hold any duplicate
    without the pure-move check: criterion 2's differing copy composes and the test fails.
