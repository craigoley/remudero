  acceptance:
    - claim: "After the first retryable post-review throw on an unchanged review input, the sweep admits that review again once 5 minutes have passed, not only after the pending ceiling"
      proof: "grep: W1-T13257 criterion 1 in test/sweep/a-review-that-threw-is-retried-before-the-stall-backstop-fires.test.ts"
    - claim: "Each further throw on the same review input doubles the wait (5, 10, 20 minutes and so on), and the wait never exceeds policy.pendingCeilingMinutes"
