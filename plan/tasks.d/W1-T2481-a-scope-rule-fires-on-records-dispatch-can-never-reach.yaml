    - claim: "a blocked task that does declare a scope is unaffected in either direction"
      proof: "unit test: test/declared-scope-exempts-what-dispatch-cannot-reach.test.ts"
    - claim: "editing a tombstone that has no declared scope no longer fails a changed-tasks pass"
