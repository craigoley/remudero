    - claim: "no other linter check changes behaviour for any task in either state"
      proof: "unit test: test/declared-scope-exempts-what-dispatch-cannot-reach.test.ts"
    - claim: "deleting the exemption restores the failure on the blocked record"
      proof: "unit test: test/declared-scope-exempts-what-dispatch-cannot-reach.test.ts"
