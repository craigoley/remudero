    (`stampLineViolations` checks only the prefix and the `->` id list). W1-T5541 (queued, same file)
    covers prose-less shards and directory `files:`; this task does not duplicate those. Adding the
    mounts-row census to `planPrPreflight` is an operator decision; refusing `type: review` at the
    floor closes the same hole for drafts.
  design: |
    Draft-only checks in the W1-T4700 floor, each a block, so no shard on main regresses: a title
    containing the task's own id or `NEW-n`; a `unit test:` label shaped like a path (a `/` and an
    extension) outside `test/`; a `files:` entry whose top directory does not exist in the worktree
    (an existence predicate injected from `fileRatificationDraft`); a `type:` outside the dispatched
    set; a stamp label made only of ids.
