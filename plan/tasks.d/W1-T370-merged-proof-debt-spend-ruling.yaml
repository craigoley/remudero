  note: "verify:human is the load-bearing choice, not a formality. The question is whether to SPEND an
    implementer on 391 rewrites for shipped work, and this repo's standing rule (fb-1785882211812-bafd8f)
    is that an agent may recommend 'no' but may never record it. `isDispatchEligible` refuses
    verify:human at `t.verify !== \"auto\"` BEFORE the linter is consulted, so this task can never
    auto-dispatch and its own proofs can never stall the queue.
    The `demonstration:` proofs are legal ONLY on verify:human and are W1-T277's intended use — an
    operator action on the record. Verified: W1-T323 carries the same shape and lints clean at cdf885a.
    They are deliberately NOT rewritten into `unit test:` form, which is design clause (iv) of W1-T369
    applied to this task itself.
    risk:low — nothing ships. The failure mode is that no ruling is recorded and the task sits, which is
    the status quo it was filed to end.
    budget_usd 40 — the adjudication and the record, not the rewrites. If the ruling is (b), the
    rewriting work is sized separately at that point rather than pre-budgeted here for an outcome that
    may not be chosen.
    NO depends_on. It is readable and rulable today; the preference that W1-T369 land first is stated in
    design (iv) rather than encoded as an edge, so a ruling of (a) or (c) is not gated behind work it
    would make unnecessary."
