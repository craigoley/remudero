  rationale: |
    OBSERVED 2026-11-10 on Azure Serve: eight read_model.now_view_failed rows at
    05:06-05:17Z carry Cannot read properties of undefined (reading map).
    The real listFeedback reader and landing overlay retain 823 entries, including
    one unresolved grilling incident whose summary is a string. It has no proposal
    PR; pure reconciliation retains it without a GitHub read. Calling the exported
    feedbackQuestionContext and projectFeedbackGates on it reproduces that exception.
    The mapped instance=core now API serves Nov6 source timestamps while status is fresh.
    Mechanism: human-gate.ts feedbackQuestionContext assumes every truthy summary has
    options.map. The reader does not validate or normalize this persisted summary.
    A structured-input control preserves the same raw and summary text and produces
    its answer gate; this is diagnostic evidence, not source qualification or proof
    that every frontend timeout has this cause.
    Before filing, main 4a5d3a2d and all seven captured open PR head trees retained
    the unguarded formatter and contained no scalar/string-summary subject task.
  design: |
    In the shared feedbackQuestionContext formatter, preserve a string summary as
    plain text before the existing structured-summary branch. Keep raw question
    context and structured option labels/consequences unchanged. Use no new imports
    in the formatter. Do not coerce malformed object summaries to empty options.
    Append regressions only to the existing human-gate-feedback test: exercise the
    real persisted-entry reader, both exported production consumers, and a real
    createNowView materialization with synthetic incident text. Preserve every
    existing test input, assertion, expected value, timeout, title and skip.
    Existing source-unavailable and uncalibrated evidence must retain their state.
    Do not edit feedback records, statuses, answer routes, gate classification/count
    policy, credentials, providers, registry policy, pacing or runtime configuration.
  falsifier: |
    Remove only the scalar compatibility branch and the persisted scalar-reader
    and real now-view regressions must fail with the map exception. Restore it and
    require them to pass; structured and absent-summary controls must remain exact.
