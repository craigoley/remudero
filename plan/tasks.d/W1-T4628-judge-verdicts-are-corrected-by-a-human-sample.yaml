- id: W1-T4628
  title: "THE JUDGES THAT GRADE FIELD-TRIAL OUTCOMES ARE THEMSELVES UNGRADED — a small operator-labelled random sample yields judge agreement and prediction-powered bias-corrected rates with valid intervals"
  repo: remudero
  depends_on: []
