- id: W1-T13330
  title: "Serve's ops-catalog read keeps every blob it fetched by its sha, so a catalog refresh fetches only the shards that changed instead of spawning gh for every shard every two minutes"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # which catalog reads are answered from memory; a cached blob is content-addressed, so its text never changes
  band_meaning: span
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T13304
  files:
    - src/lib/ops-catalog-source.ts
    - test/the-ops-catalog-reads-only-blobs-it-has-not-seen.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "Two catalog reads in a row over the same tree make one `git/blobs/<sha>` request per distinct blob in total; a second read whose tree changed one shard requests only that shard's new blob, and both reads return the same Plan a cold read returns"
      proof: "grep: W1-T13330 criterion 1 in test/the-ops-catalog-reads-only-blobs-it-has-not-seen.test.ts"
    - claim: "invariant:content-addressed — a cached blob is used only for a request of the same repository and the same blob sha; a blob that failed its checks (malformed, oversized) is never cached and the read refuses as before"
      kind: guard
      proof: "grep: W1-T13330 criterion 2 in test/the-ops-catalog-reads-only-blobs-it-has-not-seen.test.ts"
    - claim: "The cache holds at most OPS_CATALOG_BLOB_CACHE_MAX_BYTES (16 MiB) of decoded text and drops the least recently used blob past it"
      proof: "grep: W1-T13330 criterion 3 in test/the-ops-catalog-reads-only-blobs-it-has-not-seen.test.ts"
  rationale: |
    WHY: Craig on 2026-11-17: "serve should not need this much cpu". MEASURED from serve's runtime.loop_stall_profile
    rows over the hour to 04:03Z: 114 main-thread stalls, 140 s in total, 53 over 1 s. Child-process `spawn` called from
    ops-catalog-source.ts was 877 ms of self time inside those stalls (the second largest self frame), and a 10 Hz ps
    sample at 01:05Z saw about 200 short-lived children in serve's container.
    READ at origin/main, src/lib/ops-catalog-source.ts: defaultOpsCatalogApi runs `gh api <path>` (one child) for every
    request; readBlob fetches `git/blobs/<sha>` for every shard (up to OPS_CATALOG_MAX_SHARDS, 500) on every read, with
    no cache; serve-plan-reload.ts refreshes the catalog every BOARD_CATALOG_REFRESH_MS (120 s) while a client watches.
  design: |
    INVARIANT content-addressed: a blob's text is a function of (repository, blob sha) alone.
    1. A module-level LRU map keyed by `${repo}\0${blobSha}` holds each blob's decoded text after readBlob's checks pass.
       readBlob answers from it first and still adds the bytes to counts, so the total-bytes backstop is unchanged.
    2. Bound it by OPS_CATALOG_BLOB_CACHE_MAX_BYTES (16 MiB), dropping the least recently used.
    3. Tree and ref reads stay uncached (they are mutable); only blobs are cached.
  falsifier: |
    Fetch every blob on every read: criterion 1 fails. Key on sha without the repository, or cache a refused blob:
    criterion 2 fails. Never evict: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794892389000 with ~/rmd-work/bin/reserve-id.sh.
    Proof that counts in production: spawn frames from ops-catalog-source.ts leave serve's loop_stall_profile rows.
