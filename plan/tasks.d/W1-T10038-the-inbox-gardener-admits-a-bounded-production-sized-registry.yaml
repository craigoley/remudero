  status: merged
  attempts: 0
  rationale: |
    A read-only production check on 2026-10-17 parsed all 1400 core proposals from a
    1346339-byte registry. The maintained 524288-byte reader refused that regular file
    before default capture could advance its own ledger index. The separate 2048-item
    bound was not exceeded. A real maintained-stamp predicate control passed, while no
    production proposal qualified as mechanical. The byte refusal and absent eligible
    candidate are separate findings: admitting the registry cannot grant legacy purpose.
    All 435 advertised branch trees were subject-swept against main, and the four open
    PR heads had no edits to this implementation or its canonical suite at the snapshot.
  design: |
    Set an explicit two-MiB BACKSTOP for the registry's single-descriptor bounded read,
    sized above the observed valid production population rather than relaxing candidate
    or effect limits. Retain the independent 2048-proposal limit, descriptor identity and
    growth checks, regular-file requirement and symlink refusal. All existing plan,
    registry, GitHub, ledger and thread source qualification remains required.
    Use the real maintained producer and default capture in a representative 1400-record
    fixture above one MiB. In shadow mode one genuinely stamped, positively proven
    mechanical control can be observed; legacy human-purpose, held security and unanswered
    asks remain protected. Registry admission must not re-stamp, delete, truncate or
    fabricate proposals, and it must not treat a partial evidence index as complete.
    A valid registry above two MiB, an excess item count, a changed identity, symlink or
    growth remains unqualified before proof/judge/retirement effects. This task does not
    migrate legacy asks, initialize the live index, enable gardener, write live Inbox state,
    deploy, restart or change judge/candidate/proof/retirement bounds.
  acceptance:
    - claim: "The maintained producer and capture admit the representative large registry in shadow while preserving protected purposes and source identity, and refuse excess bytes or counts before proof, judgment or retirement effects"
      proof: "unit test: test/the-inbox-gardener-admits-a-bounded-production-sized-registry.test.ts"
  falsifier: |
    Restore only the old 512-KiB registry limit with the new representative fixture intact:
    the positive capture/admission assertion must fail. Restore the two-MiB backstop and
    require the same tests to pass, including oversized valid JSON, count, ownership and
    protected-purpose controls. A mocked capture or a test that only mirrors a constant
    is not the acceptance proof. Keep raw summaries and the exact tested committed tree.
