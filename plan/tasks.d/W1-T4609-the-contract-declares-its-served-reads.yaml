  title: "THE DAEMON SERVES 14 READS ITS OWN CONTRACT NEVER DECLARES — declare them in openapi/daemon.yaml, regenerate packages/api-client, and shrink scripts/openapi-route-baseline.json"
  repo: remudero
  depends_on: []
