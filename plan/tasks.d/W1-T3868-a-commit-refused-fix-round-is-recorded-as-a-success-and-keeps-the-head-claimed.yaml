- id: W1-T3868
  title: "A FIX ROUND WHOSE HARNESS COMMIT WAS REFUSED IS RECORDED AS A SUCCESS AND KEEPS THE HEAD CLAIMED FOREVER — `harnessCommitForShellLessWorker` logs `implement.harness_commit_refused` when the report carries no anchored COMMIT_MESSAGE, the fix rung DISCARDS its return value, the round still writes `fix.dispatch` + `fix.done` with `subtype: success`, nothing is pushed, and every later sweep pass stands down on `fix already dispatched for this head`"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 40.00
  files: [src/run-task.ts, src/lib/sweep.ts, src/lib/ledger.ts, test/a-commit-refused-fix-round-is-not-a-success.test.ts]
  origin: architect
  plan_refs: ["W1-T1110", "W1-T1127", "W1-T3727", "W1-T3849", "W1-T127"]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED LIVE. A shell-less (harness-commits) fix worker returned a report with no anchored
    COMMIT_MESSAGE line. The run ended in `implement.harness_commit_refused`, nothing was
    committed, no head was pushed — and the round was nonetheless recorded as a successful fix.
    The PR has been standing down on every sweep pass since with `fix already dispatched for this
    head`, so the repair rung is closed against an unchanged head that nothing will ever move.
    THE THREE SITES THAT PRODUCE IT ARE ALL READABLE IN SOURCE.
    (1) `harnessCommitForShellLessWorker` (src/run-task.ts, near the file's shell-less commit
    helper) parses the worker report; when `parseReport(input.report)?.commitMessage` is
    `undefined` it logs `implement.harness_commit_refused` with reason `no anchored COMMIT_MESSAGE
    line in the report` and RETURNS THE COUNT UNTOUCHED. It reports the refusal honestly. It is
    the only place that knows.
    (2) The fix rung calls it as a STATEMENT, not an expression — `harnessCommitForShellLessWorker({
    harnessOwnsGit: fixHarnessOwnsGit, commitCount: 0, ... })` with no assignment, unlike the
    implement site which does `commitCount = harnessCommitForShellLessWorker({...})`. So the fix
    round cannot see that its worker produced nothing. `readRoundCommits` then returns an EMPTY
    round, which is classified as an ORDINARY repair (not a retrigger), `strikes = attempt` is
    committed, `fix.dispatch` is written, and `fix.done` is written with `subtype` taken verbatim
    from the worker envelope — `success`, because the MODEL exited cleanly. The transcript archive
    and `deps.push` then run over a worktree with nothing new on it.
    (3) THE CLAIM IS SEEDED BY INTENT AND CLEARED ONLY BY OUTCOME ROWS THIS PATH NEVER WRITES.
    `priorActionsFromLedger` (src/lib/sweep.ts) seeds `fixed` with `${prNumber}@${headSha}` from
    any `sweep.disposed` row with `acted: true`. The `blocked-fixable`/`conflicted` arm then
    computes `alreadyDone = dispatchedThisHead && !fixRungStalledWithoutNewHead(ledgerLines,
    pr.taskId)`. `fixRungStalledWithoutNewHead` recognises exactly four steps: `fix.dispatch`
    (clears stalled), `fix.ci_not_green` (sets it), `fix.review` (sets it unless
    `state === "success"`) and `fix.resolved` (clears it). A commit-refused round's LAST recognised
    row is `fix.dispatch`, so `stalled` is false, `alreadyDone` is true, and the stand-down repeats
    on every pass for as long as the head does not move. W1-T1110 built that re-arm for a rung that
    ran and CONCLUDED; this round concludes in a vocabulary the re-arm cannot read.
    WHY THIS IS NOT W1-T1127 AND NOT W1-T3849. W1-T1127 (merged) closed the case where the
    DISPATCH threw before a worker started, so no `fix.*` row existed at all. Here the worker ran,
    was billed, and wrote a full, well-formed set of rows — every one of which says it succeeded.
    W1-T3849 (queued) repairs `commitWorkerEdits` ENUMERATION, a different cause with the same
    smell; it does not touch how a refusal is recorded or how the per-head claim is released.
    THE EVIDENCE ROT MATTERS HERE. `fix.ci_not_green`/`fix.resolved` are already members of
    `DECISION_RELEVANT_LEDGER_STEPS` (src/lib/ledger.ts) precisely because
    `fixRungStalledWithoutNewHead` decides on them, and `test/ledger-rotation.test.ts` re-derives
    that set from its consumers. A new row the sweep DECIDES on that is not a member would be
    archived away while the claim it releases is retained indefinitely — the same asymmetry
    W1-T1127 recorded against `sweep.fix.error`.
  design: |
    (i) A REFUSED COMMIT IS A NON-SUCCESS ROUND, AND THE RUNG MUST BE ABLE TO SEE IT. The fix
    rung must consume `harnessCommitForShellLessWorker`'s answer instead of discarding it, the
    same way the implement site already does. A round in which the harness owned git and refused
    to commit — for a missing anchored COMMIT_MESSAGE or any other refusal reason the helper
    already reports — must not reach `fix.done` carrying the worker envelope's `success` subtype
    unqualified. The round's recorded outcome must say that nothing was committed.
    (ii) ONE NAMED LEDGER ROW, AND THE NAME IS PART OF THIS DESIGN: `fix.commit_refused`, written
    by the fix rung for this round, carrying the helper's own refusal reason and the head sha the
    round was dispatched against. It is a `fix.*` row for the same reason its four siblings are:
    the sweep's re-arm keys on that family, and an `implement.`-prefixed row written from the fix
    lane is invisible to it. The existing `implement.harness_commit_refused` row is NOT renamed or
    removed — it is the helper's own evidence and other readers may depend on it.
    (iii) THE CLAIM BECOMES RECLAIMABLE FOR THE SAME UNCHANGED HEAD. `fixRungStalledWithoutNewHead`
    must treat `fix.commit_refused` the way it treats `fix.ci_not_green`: the rung ran and ended
    without landing a head, so a later pass may re-dispatch the SAME head rather than standing down
    forever. Nothing about the sha-keyed seed, the `sweep.disposed` writer, or the
    `dispatchedThisHead` membership test changes — the release is a read of an outcome row, never a
    rewrite of a row already written.
    (iv) THE RELEASE IS BOUNDED BY THE STRIKE CAP THAT ALREADY EXISTS, and this clause is the one a
    careless implementation drops. A head that is reclaimable must still exhaust `opts.strikeCap`
    and escalate; a worker that refuses its commit on every round must reach the cap, not loop. A
    release that also resets, skips or re-earns strike accounting converts a stuck PR into an
    unbounded spender, which is strictly worse than the defect.
    (v) A VALID COMMIT IS UNCHANGED, EXACTLY-ONCE. A round that DID commit and DID push must spend
    its one strike, write `fix.dispatch`/`fix.done` as it does today, write NO refusal row, and
    remain deduped against its own head. The retrigger arm (`fix.retrigger`, which deliberately
    spends no strike) is untouched.
    (vi) TRANSCRIPT EVIDENCE IS PRESERVED, NOT TRADED FOR THE REPAIR. `archiveWorkerTranscript`
    still runs for the refused round, still keyed on that round's own `attempt` so a retry never
    overwrites it, and the follow-up harvest still reads the same transcript. The report that
    lacked the anchored line is the only record of WHY the round produced nothing; a repair that
    loses it makes the next occurrence undiagnosable.
    (vii) DECLARE THE NEW STEP WHERE THE SWEEP CAN STILL READ IT LATER. `fix.commit_refused` joins
    `DECISION_RELEVANT_LEDGER_STEPS` with a comment naming its consumer, because
    `test/ledger-rotation.test.ts` derives that set from consumers and because a claim retained
    indefinitely must not be released by a row rotation can archive.
    EXPLICITLY NOT IN SCOPE: changing what `commitWorkerEdits` stages (W1-T3849 owns that), making
    the worker prompt more likely to emit the anchor, retroactively clearing heads already stuck,
    and any change to `priorActionsFromLedger`'s seeding rule.
  acceptance:
    - claim: "a fix round whose harness commit was refused for a missing anchored COMMIT_MESSAGE is recorded as a non-success round rather than inheriting the worker envelope's success subtype"
      proof: "unit test: W1-T3868: a refused harness commit is recorded as non-success"
    - claim: "after a commit-refused round with NO new head, a later sweep pass over the same unchanged head re-dispatches instead of standing down on fix already dispatched"
      proof: "unit test: W1-T3868: an unchanged head is re-dispatched after commit refusal"
    - claim: "after a round that committed and pushed a valid head, a later sweep pass over that same head still stands down and does not re-dispatch"
      proof: "unit test: W1-T3868: a committed head remains deduplicated"
    - claim: "a reclaimable head still exhausts the existing strike cap and escalates, so repeated commit refusals cannot loop unbounded"
      proof: "unit test: W1-T3868: repeated refusals exhaust the strike cap"
    - claim: "the refused round still archives its worker transcript and still ledgers the refusal reason, so the evidence survives the repair"
      proof: "unit test: W1-T3868: refusal evidence keeps its transcript and ledger reason"
    - claim: "the sweep re-arm reads the fix-lane commit-refusal row by name"
      proof: "grep: fix.commit_refused in src/lib/sweep.ts"
  falsifier: |
    CLOSE IF a commit-refused fix round already releases its head: drive the fix rung with a worker
    report carrying no anchored COMMIT_MESSAGE, then run two sweep passes over the unchanged head
    and read the second pass's disposition. Today the second pass stands down with
    `fix already dispatched for this head (<sha>) — awaiting its outcome before spending another
    strike`, and it will do so on every pass for as long as the PR is open.
    POSITIVE CONTROL, AND IT IS THE ARM THAT FAILS A LAZY FIX, because "the head is always
    re-dispatchable" satisfies the first claim perfectly: the suite must ALSO show a round that
    committed and pushed a real head STILL being deduped on a second pass. Without that arm the
    repair is indistinguishable from deleting `prior.fixed`, which is the unbounded re-dispatch
    W1-T1127 design note (8) rejects by name.
    THIRD ARM, on spend: a worker that refuses its commit every round must reach `strikeCap` and
    escalate within the cap's own count. A suite that only proves "it retries" cannot tell a
    bounded retry from a loop that spends a worker per sweep tick forever.
    DO NOT clear the claim on liveness, elapsed time, or the ABSENCE of a row. `dispatchFix` is
    awaited to completion, so a liveness read returns not-live for every gated PR on every pass —
    W1-T1127 design note (8) measured exactly this and it degenerates into no gate at all. The
    release must key on a row this round POSITIVELY writes.
    DO NOT rewrite, backfill or suppress the `fix.dispatch`/`fix.done` rows the refused round
    already wrote. No repair rewrites a ledger row already written; the fix is an ADDITIONAL row
    and a reader that understands it.
    DO NOT resolve this by renaming `implement.harness_commit_refused`. Other readers may key on
    it, and the rename would leave the fix lane with the same problem under a new spelling.
  note: |
    Rule 25 CHECKED: none of `src/run-task.ts`, `src/lib/sweep.ts`, `src/lib/ledger.ts` is an
    instrument surface.
    `risk: high`, `band_meaning: blast-radius` — NOT span. The diff is small, but it decides
    whether a fix-rung strike is recorded as spent and whether live PRs are re-dispatched against
    real repositories. A mistake either re-introduces the deadlock or spends a worker per tick.
    THREE SOURCE FILES, ONE CONCERN, AND EACH IS LOAD-BEARING: `src/run-task.ts` is where the
    refusal is currently discarded and where the new row is written, `src/lib/sweep.ts` is the only
    reader that can release the claim, and `src/lib/ledger.ts` is where a decision-relevant step
    must be declared or rotation will archive it — `test/ledger-rotation.test.ts` derives that set
    from its consumers, so omitting it would redden this PR on a suite it did not touch.
    HONEST LIMIT: this stops the claim from STICKING. It does not clear heads already stuck — that
    is an operator action — and it does not make a shell-less worker more likely to emit the
    anchored COMMIT_MESSAGE in the first place, which is a prompt-side question this shard does not
    open.
