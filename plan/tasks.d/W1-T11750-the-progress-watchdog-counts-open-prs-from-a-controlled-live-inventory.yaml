  design: |
    1. LIVE READ. `readLiveOpenPrInventory(owner, repo, fetch)` in src/lib/progress-watchdog.ts walks the open-PR
       list (openPrsRestArgs, every page to the end) and returns `{ state: "read", count, numbers }` only when the
       page walk is complete. In the same invocation, a POSITIVE CONTROL reads one closed PR of the same repo
       (state=closed, per_page=1) and must get back one row with an integer `number`. That proves the credential and
       route can see PRs, so a 0 is a seen 0. A failed control returns `{ state: "control_failed" }`. A thrown read or
       an incomplete walk returns `{ state: "unknown", reason }`.
    2. KEPT APART. The verdict carries `liveOpenPrInventory` ({state, count?, control}) beside the existing
       `openPrCount` and `openPrCountSource`, which still mean the last full pass. The two are never merged into one
       number. renderProgressWatchdogVerdict prints both:
       `open_prs_live=<n|unknown> (control <ok|failed>) open_prs_last_full_pass=<n> (<source>)`.
    3. DECISION. IDLE requires live state "read" with count 0. A live count > 0 replaces a ledger 0 or undefined for
       the age-based STALLED judgment, since the board has work the ledger does not show. A non-read live state
       never yields IDLE: if the ledger also says 0 or undefined, the verdict is UNKNOWN with action none. Otherwise
       today's ledger path decides. Recycle, restart and diagnostics actions are not widened: a live count can only
       turn IDLE into UNKNOWN or into the existing age path.
    4. CREDENTIAL AND COST. The repo comes from the instance config the verb already loads. Use the host credential
       propagation and `hostGithubReadToken(repo)` seam delivered by W1-T11774; it narrows the existing App grant to
       pull-request read for this repository. Do not proceed with a host live read unless that prerequisite is
       merged. Mint no credential and add no write. One list walk plus one control read per tick, and W1-T6361's
       nothing-changed skip still applies.
    5. TIME BUDGET. Start one 45 s deadline at verb entry and pass it through token exchange, every list page and
       the control read, with a 10 s timeout per request. Do not start a request past the deadline; return UNKNOWN
       with reason `live-read-deadline`. Leave the remaining part of the launcher's 120 s for the ledger read and
       diagnostics. W1-T6361's nothing-changed skip still applies.
    6. Tests (new file) over injected fetch: a complete walk of 0 with the control passing is IDLE; a 0 with the
       control failing is UNKNOWN; a truncated walk is UNKNOWN; live 3 beside ledger 0 is judged by age; ledger 31
       with live unknown keeps today's path; the rendered line names both counts. A request timeout or exhausted
       45 s deadline returns UNKNOWN and never IDLE.
  falsifier: |
    At origin/main, a ledger whose newest full pass enumerated 0, with the live board holding open PRs, makes
    decideProgressWatchdog say IDLE without any live read. The first test's "a 0 with the control failing is
    UNKNOWN" case fails because no control exists. If GitHub's closed-PR read can return 0 rows on a healthy
    credential for this repo, the control is wrong and must be replaced, not dropped.
