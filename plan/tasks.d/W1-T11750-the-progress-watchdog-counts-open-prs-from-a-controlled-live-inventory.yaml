    worktree confinement hook refused a Read outside the assigned worktree. Its figures are therefore NOT restated
    here. The facts below come from the source and from GitHub.
    READ in this worktree (symbols, not lines):
    - progressWatchdogCommand (src/run-task.ts) reads 24 h of ledger rows and calls openPrCountReadingFromRows
      (src/lib/progress-watchdog.ts). That function returns the newest full-surface sweep.pass `enumerated`
      ("full_pass"), raised by a newer light row ("full_pass_raised"), or the window max ("max_over_window").
      Every source is a row the daemon itself wrote, so the count says what the last pass saw, not what is open now.
    - decideProgressWatchdog returns IDLE, action none, as soon as openPrCount === 0. It reads no progress age.
    - The verb's only outside reads are docker and ps (readLiveRecyclePausePid, the diagnostics bundle). It never
      reads GitHub, so nothing checks the ledger count against the real board.
    - src/lib/open-prs-rest.ts already has openPrsRestArgs / fetchOpenPrsRest for the same open-PR list the sweep
      enumerates.
