    Settled by lookup: does an open PR already do this? -> No. The 10 open PRs on 2026-11-08 (#17404, #17403, #17397,
    #17394, #17386, #17367, #17354, #17348, #17322, #17229) touch none of progress-watchdog's open-PR count
