  falsifier: |
    THE 09:50Z SHAPE: allowance committed $24.95, cap $25.00, a cash-fallback spawn whose reservation is about $0.51.
    At origin/main the first test's fake cash spawn IS called. The third test reads `apiError: true` /
    `openweight_error`. The fourth test records 4 attempts, sleeps of 1000/2000/4000 ms and one judge call, and its
    reason is "absent or unparseable fix progress verdict; re-ask next pass". With the fix: no cash spawn, one
    attempt, no sleep, no judge call, and the reason contains "cash daily allowance exhausted until
    2026-10-18T00:00:00.000Z". Dropping the accessor's `fleetCapUsd` or squeezed-cap term makes the first two tests
    disagree with `reserveOpenWeightBudget` on a fixture where those caps bind.
  note: |
    EFFECT, measured after merge from the core ledger on a day the cap is reached: after the first
    `OpenWeightAllowanceExhaustedError`, `worker.provider.cash_fallback_refused` rows name "cash daily allowance
    exhausted until". No later run-task run shows more than one cap-refused attempt, and no `verdict` row carries
    "absent or unparseable fix progress verdict" for a cap-refused run. Healthy shape: the refused-attempt count per
    run after the first refusal is at most 1.
