- id: W1-T5520
  title: "A TASK WITH AN OPEN PULL REQUEST NEVER GETS A SECOND ONE — on 2026-10-02 the fleet opened #8797 (run-W1-T5343-1790980010581) at 23:28Z while a hand-built #8782 (run-W1-T5343-1790978745655, opened 22:32Z) was still open for the same task; the implement path's PR open looks only for a PR on its OWN head, so it never saw the sibling, and #8797's CI and fix round were wasted until the sweep closed it as a leftover at 00:10Z"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high
  band_meaning: span
  origin: "operator session 2026-10-03: root-cause program for the 28-PR backlog; live ledger read of run W1-T5343-1790980010581 on the Azure host"
  plan_refs: [W1-T534, W1-T1268, W1-T4466, W1-T2794, W1-T3979]
  files: [src/run-task.ts, src/lib/pr-open.ts, test/a-task-with-an-open-pull-request-never-gets-a-second-one.test.ts]
  status: queued
