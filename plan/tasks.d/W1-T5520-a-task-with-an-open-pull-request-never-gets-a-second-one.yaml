      proof: "grep: test(\"W1-T5520: a trailer-only match outside plan/ defers the open in test/a-task-with-an-open-pull-request-never-gets-a-second-one.test.ts"
    - claim: "the run's own branch, another task's PR, a run-unfiled PR, and a phantom run-W1-T1-build-<epoch> id never defer, and the create proceeds exactly as before"
      proof: "grep: test(\"W1-T5520: its own branch and other tasks never defer in test/a-task-with-an-open-pull-request-never-gets-a-second-one.test.ts"
    - claim: "an unreadable open-PR list ledgers pr.open_existing_check_unreadable and opens the PR as today"
      proof: "grep: test(\"W1-T5520: an unreadable list opens as before in test/a-task-with-an-open-pull-request-never-gets-a-second-one.test.ts"
    - claim: "the implement path calls the lookup before its REST create"
      proof: "grep: readOtherOpenPrForTask( in src/run-task.ts"
  falsifier: |
    Remove the call from `runTaskBody`. The first test's fixture, with #8782's shape (an open
    run-W1-T5343-1790978745655) beside this run's run-W1-T5343-1790980010581, reaches the REST create shim
    and writes `pr.opened`. That is the #8797 duplicate. Drop the trailer arm, and a sibling opened on a
    non-run branch with `Remudero-Task: <id>` is missed. Drop the plan/ filter, and a shard amendment PR
    blocks the build it describes.
