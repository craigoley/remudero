    - claim: resolveRepairs closes an open repair PR as redundant only when some commit between the offending sha and the green head touched one of the record's failing test files or a source file they import; when none did, the red was intermittent and the PR stays open with a main.repair.flake_kept row naming the failing tests and the commits read
