  priority: 1.0
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # serve's CPU weight on the next relaunch; equal weight, not lower, so the console is not starved
  band_meaning: blast-radius
  origin: operator-session#review-capacity-2026-11-13
  plan_refs:
    - W1-T4102
