    network, nothing spawned, no operator present: `deriveStatus`'s gateway is already an interface
    with fixtures across the suite, which is why the new read is OPTIONAL. risk:high IS RULE 19'S
    SPAN, NOT BLAST RADIUS, and it is set up front rather than shipped as a violation: files: names
    two concerns (status, trailer-credit-plan-only). The blast radius is real but narrow — this
    changes what counts as MERGED, which decides dispatch, so clause (vi)'s fail-direction is the
    part most worth reviewing. RULE 25 CHECKED BEFORE FILING: neither path is INSTRUMENT_SURFACE
    (no workflow, no *-ratchet.mjs, no diff-coverage.mjs, no *-baseline.json, no
    mutation-relevant-paths.json, no stryker.conf.json). FILES: CAN CONTAIN THE DESIGN, checked
    deliberately because two tasks this week could not: the predicate (`deriveStatus`,
    `creditsByAnchoredTrailer`), the `GitHub` interface, `ghGateway` and `buildBatchedGithub` all
    live in src/lib/status.ts, and `isInPlanScope`/`outOfPlanScopeFiles` are CALLED, not edited —
    their current signatures already take a path and a path list, so no caller needs re-threading.
    That last check is the one W1-T392 failed. budget_usd 55 — the cost is clause (iv)'s
    measurement over GitHub bodies and clause (i)'s control, not the predicate. ON THE PROOFS: all
    three use the pure-path form against test/trailer-credit-plan-only.test.ts, which does not
    exist yet — a forward reference to a PATH, safe per CLAUDE.md, and declared in files: so the
    worker creates it. SEQUENCING, a preference and deliberately NOT a depends_on edge: nothing
    blocks this, but a reviewer should know W1-T395 is the live instance and will read as merged
    until this lands or its trailer is debunked."
