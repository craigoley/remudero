- id: W1-T2769
  title: "CLAUDE.md's first rule prescribes `rmd preflight --ci-parity` before a first push, but on a feature branch the bare invocation is refused by `main()`'s freshness gate and the documented workaround (`RMD_SELF_SYNC_DONE=1`) crosses into `ci:test`'s own child suite and turns 45 of its self-sync tests red"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high  # Rule 19: two subsystems (commit-message, run-task) span the same defect — the
              # exemption in run-task.ts removes the NEED for the guard var; the scrub in
              # commit-message.ts removes the RISK of it regardless. Reverting either half leaves
