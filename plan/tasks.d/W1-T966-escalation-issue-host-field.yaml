- id: W1-T966
  title: "AN ESCALATION ISSUE CANNOT NAME THE MACHINE THAT OPENED IT — renderIssueBody writes Class, Task, Run, Head and Cause and no host, so on a multi-host fleet an issue reaching the operator is unattributable to a unit and cross-issue timestamp analysis cannot be pinned to one respawn clock: add a Host line sourced from os.hostname()"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    FILED FROM A RECON AT origin/main 1ca2ba5. Every path and count below was READ ON THAT
    COMMIT, not inherited from the brief.

    (1) THE FIELD IS ABSENT, AND THAT WAS MEASURED RATHER THAN ASSUMED. `renderIssueBody`
    (src/lib/escalate.ts) builds its header block as `**Class:**`, `**Task:**`, and the three
    optional lines `**Run:**`, `**Head:**`, `**Cause:**` — nothing else. A scan for an existing
    host-shaped line (`**Host:**`, `**Machine:**`, `**Node:**`) over that module returns 0, against
    a same-invocation control of `**Class:**` reading 2. The zero is real, not a failed query.

    (2) THE COST IS ATTRIBUTION, AND IT IS CONCRETE. The fleet runs on more than one host. An
    escalation issue arriving in front of the operator therefore names the task, the run and the
    head sha, but never the unit that produced it. The downstream consequence is that timestamp
    analysis ACROSS escalation issues cannot be pinned to a single unit — respawn-interval
    reasoning over those timestamps is unsound, because two issues minutes apart may be two
    machines rather than one machine relaunching.

    (3) THE INGREDIENT ALREADY SHIPS SIX TIMES OVER, SO THIS IS ADDITIVE AND CHEAP. `hostname` is
    imported from `node:os` by EXACTLY SIX modules today — src/lib/drain-lock.ts,
    src/lib/fleet-control.ts, src/lib/fs-race-safe.ts, src/lib/inflight-lock.ts,
    src/lib/review.ts and src/lib/task-id-reservation.ts. COUNTED by the import form itself, not by
    the bare word: src/lib/worker.ts and src/lib/relay-client.ts mention "hostname" and do NOT
    import it, which is why a word-only scan would have reported eight. src/lib/escalate.ts imports
    `node:os` 0 times, so this task adds the repo's OWN established import, not a new dependency.

    (4) THE DEDUP KEY IS NOT AT RISK, AND THIS IS THE ONE THING THAT COULD HAVE MADE THE CHANGE
    UNSAFE. `escalate()`'s dup search does NOT compare rendered bodies; it parses named lines back
    out of a candidate open issue with TASK_LINE_RE, CLASS_LINE_RE, HEAD_SHA_LINE_RE and
    CAUSE_LINE_RE, and combines them through `matchesOptionalDimension`. A new body line that has
    no readback regex is therefore invisible to dedup by construction. See design (iv) for the
    constraint this places on the implementer.
  design: |
    THE SHAPE: one line added to one rendered block, one injectable reader, no behaviour change
    anywhere else.

    (i) ONE LINE IN THE EXISTING HEADER BLOCK. `renderIssueBody` gains a `**Host:** <hostname>`
    entry in the same `lines` array that already carries Class/Task/Run/Head/Cause, following the
    established `**Field:** <value>` shape those five use. Placement within the block is the
    implementer's call; what is NOT open is the shape, because the whole point is that a reader
    already scanning that block finds it where the others are.

    (ii) UNCONDITIONAL, UNLIKE Run/Head/Cause. Those three render only when the caller set the
    field, and that discipline exists so un-migrated callers produce byte-identical issues. Host
    has no caller to migrate — it is a property of the process doing the rendering, always
    available — so it renders on every issue. An optional Host is worse than none: an absent line
    would be indistinguishable from an old issue and would defeat the cross-issue analysis in
    rationale (2).

    (iii) THE READER MUST BE INJECTABLE AND MUST DEFAULT TO THE REAL ONE. Take an optional
    hostname reader defaulted to `hostname()` from `node:os`, appended LAST so no positional
    caller shifts. This repo's own rule applies directly: when every test injects a fake, the
    default implementation is unreachable and ships uncovered — so criterion 4 exists to execute
    the DEFAULT arm with nothing injected, separately from the injected-value criterion.

    (iv) THE HOST LINE MUST NOT BECOME A DEDUP DIMENSION. Do NOT add a HOST_LINE_RE, and do not
    extend the composite key. Rationale (4) establishes that dedup parses only named lines, so an
    unread line is inert. If Host were made a dimension, one escalation condition seen by two
    hosts would open two issues instead of being deduped into one — a regression of the exact
    #178/#180 duplicate that W1-T104 put dedup in the transport to fix.

    (v) HOW A REVIEWER CONFIRMS IT AGAINST A REAL RENDERED ISSUE. This is recorded here rather than
    as an acceptance criterion on purpose: this task is `verify: auto`, and Rule 18's
    headless-fitness lexicon is applied to the acceptance criteria of auto tasks, so a criterion
    written as a human-confirmation procedure is the wrong instrument. The procedure is: take any
    escalation issue opened after this lands, read its body back over the REST API
    (`gh api repos/craigoley/remudero/issues/<n> --jq .body`), and confirm the `**Host:**` line is
    present and equals the `hostname` of the unit whose ledger carries the matching `run_id` — the
    `**Run:**` line already on that same issue is the join key that makes the comparison possible.
    A reviewer wanting a pre-merge check instead renders a body in-process and reads the line back;
    that is what criteria 1 and 4 already execute.

    (vi) EXPLICITLY OUT OF SCOPE, EACH WITH ITS REASON.
      - src/lib/daemon.ts — NOT declared and NOT to be touched. W1-T936 already claims that module
        together with test/daemon-freshness.test.ts, and two shards claiming one file cannot batch.
        This task needs nothing from it: the hostname is read at render time, not at start-up.
      - BOOT-PATH ORDERING — out of scope entirely. Nothing here runs at boot, and no start-up
        sequence is read, moved or depended upon.
      - ESCALATION TRIAGE AND ROUTING — out of scope. Which escalations open, where they are
        routed, how they are labelled and how they are reconciled are all untouched; this task
        changes what ONE renderer emits and nothing about who receives it.
      - THE DEDUP KEY — see (iv). Adding a dimension is a different task with a different risk.
  acceptance:
    - claim: "the rendered escalation body carries a Host line and its value is the real hostname"
      proof: "unit test: W1-T966: the rendered escalation body carries a Host line with the hostname"
    - claim: "the Host line renders the injected reader's value rather than a hardcoded string"
      proof: "unit test: W1-T966: the Host line renders the injected hostname not a fixed string"
    - claim: "the Host line renders on an escalation carrying none of the optional Run or Head or Cause fields"
      proof: "unit test: W1-T966: the Host line renders when every optional field is absent"
    - claim: "the default reader with nothing injected produces a non-empty host so the default arm is executed"
      proof: "unit test: W1-T966: the default hostname reader runs and yields a non-empty value"
    - claim: "every line the renderer already emitted is unchanged so existing issues stay parseable"
      proof: "unit test: W1-T966: the existing rendered lines are byte-identical beside the new one"
    - claim: "the module reads the hostname from node os rather than reconstructing it"
      proof: "grep: hostname in src/lib/escalate.ts"
  risk: medium
  origin: "oper#escalation-host-field-2026-08-18"
  plan_refs: ["§4", "W1-T104", "W1-T195", "W1-T345"]
