  attempts: 0
  note: |
    FILES DERIVED BY READING, NOT GUESSED. `renderIssueBody` is declared at src/lib/escalate.ts and
    is exported from there and nowhere else — a tree-wide search for the symbol returns hits in
    src/lib/escalate.ts (declaration plus its own doc references), src/run-task.ts (two comment
    references only, no call), and four test files. The corresponding suite is
    test/escalate.test.ts: it is the module's own suite at 1729 lines with 8 `renderIssueBody`
    references, the highest of any test file. test/decision-summary.test.ts (6 refs) and
    test/triage.test.ts (4 refs) also import the symbol but are each scoped to another task's
    behaviour, so neither is declared — an implementer who finds a genuine need to touch one must
    amend this shard to declare it rather than overrunning.

    risk: medium IS CORRECT AND WAS CHECKED AGAINST THE RULE, NOT ASSUMED. `sizingViolation`
    (src/lib/task-linter.ts) exempts only `risk: "high"` and blocks at two or more subsystems.
    `moduleIdFromPath` strips the `.test` segment, so src/lib/escalate.ts and test/escalate.test.ts
    BOTH resolve to the single id `escalate` — one subsystem, not two. `subsystemsOf` also adds a
    tag per SUBSYSTEM_LEXICON hit over the acceptance claim and proof text, and that lexicon holds
    exactly three patterns: daemon, launchd/launchctl, and chaos-drill/crash-recovery. None appears
    in any criterion above, which is deliberate — this shard is explicitly out of scope for
    src/lib/daemon.ts, and naming it in a criterion would ALSO have raised the tally to two and
    forced the band to high for no real widening of scope.

    depends_on IS EMPTY BECAUSE NO UNMET DEPENDENCY WAS FOUND, NOT BY DEFAULT. The change needs
    only `hostname` from `node:os`, which six modules already import today (rationale (3)), and the
    render site itself, which exists and ships. W1-T936 was checked SPECIFICALLY because it is the
    nearest neighbour: it claims src/lib/daemon.ts and test/daemon-freshness.test.ts, is
    `verify: human` and `status: queued`, and intersects this shard's file list in ZERO files. It
    is not a dependency and it is not a conflict — the two can be built in either order.

    PROOF NOTES. Five criteria use the NAME-FILTERED `unit test:` form with a bare title, never the
    `path::title` form the executor cannot match, and never the whole-file path form — a path proof
    against test/escalate.test.ts would pass on any of that suite's 1729 lines and prove nothing
    about this change. Every title is plain prose under 100 characters with zero commas, no `"; "`
    and no regex metacharacter, so `looksLikeScenarioNarrative` cannot fail proof-resolvability and
    the executor's escaped-literal match has nothing to mishandle. All five are FORWARD REFERENCES
    to titles this task creates, which is legitimate for an unimplemented task — what must hold
    today is that they PARSE, and they are titles rather than symbol names, so nothing here is a
    guess about an identifier.

    THE GREP PROOF DISCRIMINATES, AND THAT WAS MEASURED WITH THE EXECUTOR'S OWN INVOCATION.
    `grep -arn -- 'hostname' src/lib/escalate.ts` returns 0 on merge-base 1ca2ba5, against a
    same-invocation control `grep -arn -- 'renderIssueBody' src/lib/escalate.ts` returning 11. The
    pattern therefore MISSES the base and can only match on head, so it cannot be downgraded to
    `executed_stale` under W1-T273. The pattern carries no `" in "` and the proof names an explicit
    path, so `parseDialectGrep` splits it correctly.

    CRITERION 4 EXISTS BECAUSE OF THIS REPO'S OWN COVERAGE TRAP, NOT AS PADDING. Criteria 1, 2, 3
    and 5 can all be satisfied with an injected reader, which would leave the DEFAULT `hostname()`
    arm unexecuted and uncovered — the shape CLAUDE.md names as "when every test injects a fake,
    the seam's default implementation is unreachable". Criterion 4 runs it with nothing injected.
    It asserts NON-EMPTINESS rather than a literal, because a test pinning a specific machine name
    would pass on one unit and fail on every other — the precise unattributability this task exists
    to fix would otherwise be re-introduced inside the suite.

    ID PROVENANCE — FOUR SURFACES, EACH WITH ITS OWN POSITIVE CONTROL. W1-T966 read 0 on all four
    at 1ca2ba5: ids declared anywhere under plan/ (0, control W1-T965 = 11), shard FILENAMES under
    plan/tasks.d/ (0 of 334, control W1-T965 = 1), refs/rmd-id/* on origin (0, control
    refs/rmd-id/W1-T946 = 1), and the file list of every OPEN PR. SURFACE 4'S ZERO IS CONTROLLED
    RATHER THAN ASSUMED: there is exactly ONE open PR (#2093), the same query returned its file
    list non-empty, and that list holds a single plan/feedback/ entry and no shard — so the empty
    set is real rather than a failed query. The tree max across plan/tasks.yaml and every
    plan/tasks.d/ shard is 965, so 966 is both free and the next contiguous id.

    NO RESERVATION REF WAS PUSHED. This shard rests on the four-surface sweep above alone. Refs are
    blocking-but-not-authoritative in the absent direction in any case — they cover a small
    fraction of declared ids, so a ref reading absent proves nothing on its own and the tree
    remains the authority.
