    blast radius: this changes what an UNATTENDED destructive act does to a branch, and getting the
    direction backwards would either strand branches (regressing W1-T447) or keep destroying work the
    W1-T919 ruling assumes survives. budget_usd 35 — one flag and a pinned argv assertion.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT. `src/run-task.ts` scores `delete-branch` 5 and
    holds `buildSweepEffects` (18) where the close closure lives, so THE CHANGE GENUINELY LIVES THERE
    and the serialisation cost W1-T471 describes is ACCEPTED rather than dodged — the flag cannot be
    removed from anywhere else. `test/live-write-guard-command-sites.test.ts` already imports
    `buildSweepEffects` and is the GUARDED SITE suite, which is why the falsifier goes there and NOT in
    `test/run-task.test.ts` — that file intermittently crashes at FILE level under
    `--experimental-test-coverage` and would make a coverage-load-bearing assertion nondeterministic.
    `src/lib/sweep.ts` is NOT declared: it holds the `stale` predicate and the `deps.close` call but
    neither changes, and declaring an untouched path fails `inverseScopeUntouchedFiles`
    (`src/lib/review.ts`).

    ID PROVENANCE, AND THE SWEEP HAS A HOLE THIS FILING MEASURED. `refs/rmd-id/*` was swept alongside
    tracked shards and the shard FILENAMES inside every open pull request's diff. **W1-T919 READ 0
    ACROSS ALL THREE AND IS TAKEN** — #1987 claimed it in its TITLE while touching only `DECISIONS.md`,
    so an id asserted in prose with no shard file and no reservation is invisible to every sweep; the
    positive control that caught it was probing a known-taken id and getting zero. **AND W1-T920 WAS
    LOST BETWEEN SWEEP AND PUSH**: the gated push was REJECTED with exit code 1 captured into a
    variable rather than read through a pipe, a fresh re-read showed another lane's commit on that
    ref, and this took 921 behind a second gated push whose host-pid-nanosecond nonce was RE-READ off
    origin and matched.

    PROOF NOTES: all three proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
    file and one unrelated failure fails every criterion. Each is under 100 characters with no comma so
    `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them."
