  title: "THE API CONTRACT COVERS 13 OF THE 38 ROUTES ITS OWN CONSOLE CALLS — `openapi/daemon.yaml` declares 13 paths, `renderShellHtml`'s client calls 38, and `no-hand-rolled-fetch-check.mjs` (CI-gated, walks `apps` and `packages`) forbids `apps/dashboard` from reaching the other 27 any other way"
  repo: remudero
