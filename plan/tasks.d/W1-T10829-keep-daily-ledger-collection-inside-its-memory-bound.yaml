    observation; concurrent work means the in-flight label alone is not a proven root cause.
    The first collection includes seven civil days for late corrections; preserve that full
    window and the existing targeted catch-up range. The earlier ~32h sample is a lower bound,
    not a complete population or heap root-cause measurement. The activity reader currently asks the ledger union to retain exact raw replay lines for
    all steps before selecting the small displayed activity population. It then retains only
    projected event fields. Test that retention hypothesis before changing code. The shared
    slow-lane heap is 1024 MiB and must remain unchanged. The dependency serializes this collector
    path after the root-owned Effects integration; do not duplicate or overwrite that work.
  design: >-
    Reproduce the retention failure with the actual collector and gzip/plain/live ledger forms,
    known valid displayed activity, replayed rows and large unrelated and selected-step payloads.
    Use bounded compressed fixtures and an admitted child no larger than the existing slow-lane
    heap. Keep the full source population, complete totals and every actual event; never solve
    this by shortening history, truncating sources, inventing zeroes or raising memory/time limits.
    If the hypothesis is confirmed, stream the native union without retaining its raw-row Set.
    Use the existing onAcceptedRecord normalized raw record seam and fingerprintLedgerLine to
    keep compact replay identities only for rows eligible for displayed activity. Preserve
    exact raw replay accounting independently within each source root. Keep the existing
    100000 selected replay-row ceiling BEFORE final semantic event reconciliation; raw key-order
    variants and copies across the native and isolated roots must retain their old cap accounting.
    Do not replace that guard with a 100000 unique projected-event ceiling. Preserve the exact
    existing stable event identity bytes and complete gap/availability semantics.
    The native reader catches exceptions from onAcceptedRecord as source-read gaps. That callback
    must only hand off the current trimmed raw line; perform eligibility, hashing, compact replay
    deduplication and the existing cap refusal in the consumer loop, outside that catch. A cap
    refusal must reach the caller before any publication, never become a partial successful read.
    Keep the reader's source filtering and malformed/torn-tail handling unchanged. Public reader
    order is parse/malformed audit, source filters, replay dedupe, callback and yield; preserve
    that ordering's evidence semantics. Nonselected valid rows may be counted for availability,
    but must not acquire a retained raw payload or an unbounded replay-key inventory.
    Preserve all original title, identity, timestamp, repository and attribution rules and the
    merged Effects observation/deduplication behavior. Preserve unread-directory/archive/live,
    malformed-row and optional-source gap reporting, ownership epoch cancellation, durable
    publication and prior history. If another cause is measured, report it through the native
    fix/scope path instead of broadening this repair. No ledger archive edits, new scheduler,
    view activation, service restart/deploy, worker termination, ownership/claim reset, admission,
    spending, scanner or review guard changes. Actual subsequent native collection, hourly due
    clocks, civil-midnight closure and authenticated repository/consolidated reads remain separate
    runtime readiness evidence; do not release Console holds on a fixture or source merge.
  falsifier: >-
    Restore raw ledger replay retention while keeping the production workload fixture: the
    unchanged bounded child must fail and the repaired version must finish with the same
    complete source/event population. Independently remove compact raw replay deduplication and
    source-gap preservation and require their dedicated controls to fail. Prove the cap with more than 100000 distinct normalized raw key-order variants of one semantic event: it must still refuse before publication, as before. A missing child summary,
    skipped physical file, OOM, absent positive event or shortened fixture is not a passing result.
    The >100000-row guard scenario must observe the original cap exception at the collector caller
    and unchanged prior publication; it must also catch an implementation that throws the cap
