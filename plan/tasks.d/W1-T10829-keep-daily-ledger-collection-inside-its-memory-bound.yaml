  rationale: >-
    Authenticated live verification at serving source ed6b5c4c02533dd6008901aacf14585d2acc99c7
    identified PID49671, fresh read-model status and held core/site/console leases. The maintained
    durable reader still returns generation0, no days and no jobs. Native serve rows at
