  acceptance:
    - claim: "With CPU PSI full above the low watermark but not over what the weight share predicts, memory PSI quiet, more PRs queued than the width, and the host load less the review lane's CPU-phase children above the core count, a width shed to 1 returns to base (or to the room the host worker budget leaves) in one sample, with reason cpu-pressure-not-review"
      proof: "grep: W1-T12529 criterion 1 in test/review/review-width-returns-to-base-when-the-cpu-pressure-is-not-reviews-own.test.ts"
    - claim: "invariant:width-bounded-by-base-and-max — that restore never takes the width above base or above max, and lanes above base are still earned only by the healthy window on calm PSI"
      proof: "grep: W1-T12529 criterion 2 in test/review/review-width-returns-to-base-when-the-cpu-pressure-is-not-reviews-own.test.ts"
    - claim: "invariant:own-pressure-still-sheds — when the review lane's own CPU-phase children explain the load (host load less those children at or below the core count), the width does not return to base, and when the CPU verdict is a shed the width still drops one lane with reason cpu-pressure"
      proof: "grep: W1-T12529 criterion 3 in test/review/review-width-returns-to-base-when-the-cpu-pressure-is-not-reviews-own.test.ts"
    - claim: "An unread host load, core count, review child count or weight share, or memory PSI above its low watermark, never restores the width: the decision is the one origin/main makes"
