- id: W1-T463
  title: "a restricted light sweep already ticks every 60s during an in-flight dispatch and is allowed to do nothing but post reviews — yet a PR sat 21-green and unreviewed for ~15 minutes, so DIAGNOSE THAT before giving reviews a second lane"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  risk: high
  origin: oper#review-lane-budget-2026-08-13
  principles: {tdd: strict}
  budget_usd: 40
  files:
