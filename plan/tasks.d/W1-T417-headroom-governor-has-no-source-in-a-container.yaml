- id: W1-T417
  title: "the headroom governor has NO working source in a container: `claude -p \"/usage\"` no longer emits an account panel, `cachedUsageUtilization` is absent from `~/.claude.json`, and `daemon.headroom` needs a daemon — so the drain stops a healthy run at its fourth miss and no credential change fixes it"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 70.00
  rationale: "SUPERSEDES THIS SHARD'S ORIGINAL PREMISE, WHICH WAS WRONG AND IS CORRECTED HERE
    RATHER THAN QUIETLY EDITED. As filed (#1546) this task claimed the probe FAILS TO AUTHENTICATE
    because `buildWorkerEnv`'s ALLOWLIST strips the container's credential vars. THE LEDGER REFUTES
    THAT, twice: `{step: usage.probe_failed, stage: parse, reason: no 'Current session:' line in
    /usage output}`. `stage` is PARSE, not SPAWN. `readUsageSnapshot`'s spawn arm is an
    `execFileSync` that throws on a non-zero exit, so reaching the parse arm PROVES the probe ran and
    exited 0. And the probe was re-run in the image WITH A REAL TOKEN and still returned no panel, so
    the credential is not the cause by direct measurement rather than by inference. The ALLOWLIST
    finding stands as an observation and is NOT a defect this task should act on.
    WHAT `-p` ACTUALLY RETURNS, quoted from the image: `Total cost: $0.0000`, `Total duration (API):
    0s`, `Total code changes: 0 lines added`, `Usage: 0 input, 0 output` — Claude Code's session cost
    footer, with NO assistant text and NO account-window panel at all.
    THE PARSER WAS NOT WRONG WHEN WRITTEN. lib/headroom.ts's header says it is the parser for
    `claude -p \"/usage\"`, CONFIRMED MACHINE-READABLE HEADLESS IN WS-0, and
    test/fixtures/usage/usage-resetless-weekly.txt is a real captured panel carrying `Current
    session:`, both weekly windows and the contributing-usage section. So `-p \"/usage\"` DID emit
    the panel once. It no longer does. The image pins CLAUDE_CODE_VERSION 2.1.220 (deploy/Dockerfile).
    THIS IS A CLIENT BEHAVIOUR CHANGE, NOT A MODE DIFFERENCE THAT WAS ALWAYS TRUE.
    SO NO PARSER CHANGE HELPS. Accepting a second format is impossible when the second output
    contains none of the required information — there is no window figure in it to read.
    AND THE TWO FALLBACK SOURCES ARE ALSO DEAD HERE, both measured in the container:
    `~/.claude.json` HAS NO `cachedUsageUtilization` KEY AT ALL (its `oauthAccount` is present, so
    the file is a real config, not a stub); account-usage.ts's own header explains why — the block is
    a CACHE only Claude Code writes, nothing in remudero can force it, and a host whose Claude Code
    activity never refreshes it never gets one. `USAGE_CACHE_MAX_AGE_MS` is 30 minutes, so even a
    populated block would be refused most of the time here.
    `daemon.headroom` rows in this container's ledger: ZERO. It is written per TICK and a container
    runs one-shot drains with no daemon, so a freshness-bounded read of it returns nothing rather
    than something stale — the two objections account-usage.ts already records (it freezes when the
    daemon sleeps, and a 77% line survived a switch to a 2% account) are not even reached.
    THE COST: THREE consecutive drains stopped `headroom_degraded`, each surrendering a `--max 6`
    budget after three or four dispatches.
    THE LEDGER IS OTHERWISE UNREACHABLE — the Mac mini is down. The two `usage.probe_failed` rows and
    the `-p` output above are the operator's report, named as such; every source-level fact is
    re-derived at db22bd8. WHETHER THE PROBE STILL WORKS ON THE MINI IS UNMEASURED, not established."
  design: |
    THIS IS NOW A RULING, NOT AN IMPLEMENTATION, WHICH IS WHY `verify: human`. Every source the
    governor could read has been measured dead in this mode, so what remains is a policy choice that
    belongs to the operator. `isDispatchEligible` (src/lib/drain.ts) declines a task at
    `verify !== "auto"` BEFORE the linter is consulted, so this parks safely while a drain runs
    rather than dispatching a worker at a problem no code change in its declared scope can solve.

    (i) THE OPTION THAT NEEDS NO CODE. `opts.headroomEnabled` already exists in the drain, and the
    operator ruling behind it (fb-1784894405468-a4153e) already says that with the governor DISABLED
    an unreadable read is ABSENT TELEMETRY, never a hold — the counter is reset and dispatch
    proceeds. If the answer is that a container should run with the governor off, that is a
    configuration decision available today and this task closes with no diff. Weigh it against what
    is lost: the drain still has `--max` and the per-task budget tripwire, but nothing watching the
    account window.

    (ii) IF THE GOVERNOR MUST WORK, FIND A SOURCE FIRST — DO NOT WRITE A PARSER. The precondition is
    an invocation that actually emits window figures headlessly on the pinned client. Establish that
    BEFORE any code: if none exists, no amount of parsing helps and (i) or (iii) is the answer.
    DO NOT spend account quota sweeping invocations; one measured attempt, reported.

    (iii) THE DISTINCTION THE BOUND CANNOT MAKE, and it is a real defect independent of the source.
    `consecutiveUnreadable` starts at zero every invocation, so a host where the signal has NEVER
    been available is indistinguishable at the bound from a host that had readings and lost them.
    The first is a governor that does not exist in this mode; the second is a governor in trouble.
    A drain that has never once read the signal is not degrading — it is unmonitored, and stopping
    at the fourth miss forever is the shape this repo has hit four times (W1-T312's wait cap,
    W1-T380's deploy ceiling, W1-T382's check-wait bound, the idle-gate ceiling). Whether that
    warrants different behaviour is the ruling; naming the distinction is not.

    (iv) WHAT MUST NOT CHANGE, WHATEVER IS RULED. `readUsageSnapshot`'s no-signal polarity is
    ratified and is not this task's to change. The `headroom_degraded` MESSAGE was corrected
    separately (#1545) and needs no further work.

    NOT IN SCOPE, AND EXPLICITLY WITHDRAWN FROM THIS TASK: the `buildWorkerEnv` ALLOWLIST widening
    this shard originally asked for. The premise was refuted — the probe authenticates — so widening
    a credential surface would spend a security decision on a non-defect. If a container worker turns
    out to need those vars for some OTHER reason, that is a new task with its own evidence.
  acceptance:
