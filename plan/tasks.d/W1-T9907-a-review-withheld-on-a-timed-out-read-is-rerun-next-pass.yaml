    - claim: "the withheld review.post_refused row carries the review input digest"
      proof: 'grep: test("W1-T9907: the withheld review row carries the review input digest" in test/a-review-withheld-on-a-timed-out-read-is-rerun-next-pass.test.ts'
    - claim: "a review withheld because a reservation fetch failed still waits as before"
      proof: 'grep: test("W1-T9907: a review withheld on a failed reservation fetch still waits as before" in test/a-review-withheld-on-a-timed-out-read-is-rerun-next-pass.test.ts'
    - claim: "timed-out withholds on one unchanged input escalate at the existing strike cap"
      proof: 'grep: test("W1-T9907: repeated timed-out withholds on one input escalate at the strike cap" in test/a-review-withheld-on-a-timed-out-read-is-rerun-next-pass.test.ts'
  falsifier: |
    At origin/main the withheld row has no digest, so it folds into `reviewRefused` under `PR-<n>@<head>`, and
    `refusedCurrentPending` is false. The 13-min pending PR matches the `wait` row "a review is already in flight,
    waiting", so the first test fails. The row builder does not exist, so the second fails. Timed-out withholds are
    not counted toward the strike cap, so the fourth fails. The third passes before and after; it guards against a
    fix that retries every unknown read.
