  rationale: |
    READ at origin/main c73ab052d. Symbols, not lines.
    - src/lib/review.ts `reviewTaskIdEvidenceAsync`: a `ReviewGitTimeout` in the base read returns every added id as
      `unknown` with reason `base-unreadable: <message>` (or `baseline-unreadable:` for the baseline read).
      `failSummary` renders "id <id> reservation unreadable (UNKNOWN): base read timed out — verdict withheld"
      (W1-T9674 named the step; it did not change what happens next).
    - src/run-task.ts `runReview`, the `verdict.taskIdOwnershipWithheld` branch, logs `review.post_refused` with
      head_sha, pr_url, reason and unknown_reservations, and returns `verdictWithheld`. It posts no terminal status,
      so the `review.pending_posted` status stays on GitHub. The row has no `review_input_digest`, although
      `inputDigest` is in scope there and the posted row carries it.
    - src/lib/sweep.ts `priorActionsFromLedger` keys `review.post_refused` with `reviewOutcomeKey(task_id, pr_url,
      head_sha, review_input_digest)`. With no digest that is the legacy `<task>@<head>` key. The row is not a
      retryable throw, a host gap or a freshness refusal, so it falls to the last arm and enters `reviewRefused`.
    - In `runSweep`, `refusedCurrentPending` sets `reviewPendingOwnerDead` only for a freshness or host-gap refusal
      (W1-T7850) on the view's exact-input key after the current pending post. Neither applies, so the pending PR
      matches the `wait` row "a review is already in flight, waiting" until `reviewPendingIsStale` (the 60-min
      `pendingCeilingMinutes`) or a new boot proves the owner dead.
    OBSERVED 2026-10-16, core ledger (V1's corpus; #12362 traced on the Mac):
    - #12362: review_admitted 16:39:43Z, pending_posted 16:40:04Z, post_refused 16:44:19Z ("id W1-T9845 reservation
      unreadable (UNKNOWN): base read timed out — verdict withheld"; unknown_reservations reason "base-unreadable: git
      cat-file timed out after 120000ms and was killed"). `sweep.disposed` then read "remudero-review pending 13m ..
      26m (< 60m ceiling) — a review is already in flight, waiting" at 16:54, 17:00 and 17:06Z. Boot 3 took it over
      "owner proven dead" at 17:16:41Z, posted at 17:20:57Z and merged at 17:21:17Z.
    - The same for #12363, #12367, #12369 and #12370: all five were withheld on base-read timeouts at 16:44-17:01Z
      and redone at 17:19-17:25Z, 25-43 min end to end. Plan-filing eligible-to-posted p90 was 41.6 min (n=20).
    - post_refused in 15:10-17:12Z: 5, all base-read timeouts. 07:40-15:07Z: 1.
    The reviews were admitted after the 16:30:23Z restart latch, while the host was loaded. W1-T9808 (P1) stops
    admissions after a latch; this task makes a timed-out read come back on the next pass wherever it happens.
    NOT IN SCOPE, named so the builder does not widen the diff: why `git cat-file --batch` over the base shards took
    over 120 s (host load during a drain); the ReviewGitTimeout bound; unknown reads with any other reason.
    OVERLAP (lint duplicate-surface): W1-T100 routes blocked_ci to the ci-log fix path and W1-T9748 traces declared
    files to the staging step. They share sweep.ts and run-task.ts as broad files only; neither touches the withheld
    review row or how the sweep folds it.
    NOT COVERED ELSEWHERE: swept plan/tasks.d on origin/main and open heads updated since 2026-10-11 for
    base-unreadable, ReviewGitTimeout, "reservation unreadable" and "already in flight, waiting". Only W1-T9674
    (merged) matches.
  design: |
    1. src/run-task.ts: the withheld `review.post_refused` row in `runReview` also carries `review_input_digest`
       (the `inputDigest` already in scope), so the sweep keys it to the PR's exact current input. Extract the row's
       fields into one exported function (for example `withheldReviewRefusalRow`) so a test reads them directly.
    2. src/lib/sweep.ts `priorActionsFromLedger`: a `review.post_refused` row whose `unknown_reservations` is
       non-empty and whose every reason starts `base-unreadable:` or `baseline-unreadable:` is a TIMED-OUT READ.
       It does not enter `reviewRefused`. It is kept with its time, as the W1-T7850 host-gap refusal is, and it
       counts toward `reviewRetryableThrowCounts`, so the existing `strikeCap` escalation in
       `postReviewFailureHistoryDisposition` bounds a read that keeps timing out. It does not enter
       `reviewRetryableThrows`, whose backoff is the pending ceiling.
    3. `refusedCurrentPending` in `runSweep` also reads it: a timed-out read on the view's exact input, at or after
       the current pending post, proves the owner finished, so the post-review row re-runs on the next pass.
    4. Unchanged: an unknown read with any other reason (ls-remote, fetch or log failed; no head ref or checkout)
       folds as today; the verdict is still withheld and never passes; legacy rows without a digest fold as today.
       No new constant.
    5. Tests go in the new file, `test(` titles verbatim as in the proofs. Drive the sweep from ledger rows shaped
       like #12362's: `review.pending_posted` at T and a `review.post_refused` at T+4m with the base-unreadable
       reason and the view's digest, and a green PR whose remudero-review is pending 13 min. Drive it the way
       test/a-review-refused-because-its-worktree-vanished-is-re-reviewed.test.ts drives the host-gap refusal.
