- id: W1-T9910
  title: "A SETTLED RUN CHILD NEVER PINS ITS ENGINE OR PLAN SNAPSHOT — a probe or run child that ends before writing status.json leaves a spec-only run directory that classifyRunDir reads as unreadable forever, and pruneEngineTrees, prunePlanSnapshots and pruneProbeRunDirs all keep what a non-terminal directory names; on 2026-10-16 50 such directories (49 probes, oldest 10-14T21:51Z) pinned all 17 non-newest engine trees (2.2 GB) and 22 plan snapshots (471 MB): the settler records the end it observed, and a boot settles the backlog the ledger proves settled"
