  attempts: 0
  note: "verify:auto — the whole change is inside one test file and the proof is that file going
    green; no human ruling is pending (rationale (3) settles the deliberate-vs-oversight question
    against the suite's own adjacent test).
    risk:low — ONE file, `test/` only, no `src/` path, no dispatch or spend path touched.
    budget_usd 12.00 — a save/restore helper plus one assertion message.
    `files:` IS DELIBERATELY JUST `test/daemon.test.ts`. `src/lib/daemon.ts` and `src/lib/env.ts` were
    checked and are NOT declared: nothing here changes what `env_clean` means, and declaring them
    would trip `inverseScopeUntouchedFiles` (a declared-but-untouched path fails review exactly as an
    undeclared one does) while needlessly serialising this against every daemon task.
    THE PROOF IS THE WHOLE FILE, and here that is the right form rather than a concession: the defect
    IS 'one test in this file is red on this host', so the criterion is the file going green in an
    environment that exports the variable. A name-filtered proof would run only the repaired test and
    could not catch a scrub that broke a sibling by restoring the env wrongly.
    FOR WHOEVER IMPLEMENTS: verify by EXPORTING `ANTHROPIC_BASE_URL=https://example.invalid` in the
    shell that runs the suite and watching it go green, then unsetting it and watching it stay green.
    A run without the variable exported proves nothing — that is the configuration in which the bug
    was always invisible."
