      proof: "unit test: test/an-operator-verdict-releases-a-parked-task.test.ts"
    - claim: "an unknown, non-human, blocked or already-released id is refused BY NAME and writes nothing"
      proof: "unit test: test/an-operator-verdict-releases-a-parked-task.test.ts"
    - claim: "a released task is dispatch-eligible through the REAL drain path while an identical unreleased task is still refused"
      proof: "unit test: test/an-operator-verdict-releases-a-parked-task.test.ts"
    - claim: "the released set is computed once per dispatch pass, not per task, so no disk read enters the per-task filter"
      proof: "unit test: test/an-operator-verdict-releases-a-parked-task.test.ts"
    - claim: "the writer has a production call site — approveCommand reaches it, not only its own tests"
      proof: "grep: approveParkedTask( in src/run-task.ts"
    - claim: "the reader has a production call site — the drain computes the released set, not only its own tests"
      proof: "grep: releasedTaskIds( in src/lib/drain.ts"
  falsifier: |
    CLOSE IF a task id can already be released end to end on main: grep `releasedTaskIds(` and
    `releasedIds` across src/, and read the five `assertRunnable`/`nextRunnable` call sites.
    MEASURED 2026-09-08 on 31d8e8324: `releasedTaskIds(` returns ONLY its own definition;
    `releasedIds` returns ONLY its two declarations and two reads; all five call sites omit it.
    POSITIVE CONTROL, because "the door is missing" is unfalsifiable without a denominator: the
    census must report the whole corpus, not one bucket — MEASURED over plan/tasks.d +
    plan/tasks.yaml, 74 `verify: human` shards {queued 56, blocked 6, merged 10, done 2} across
    1,583 tasks. W1-T3206 recorded 60 {queued 45, blocked 5, merged 10} three weeks earlier.
    RE-MEASURE; do not quote either number.
    PROVE IT LOAD-BEARING THROUGH THE REAL PATH. The suite needs a released task and an identical
    unreleased one whose dispatch eligibility DIFFERS *through the drain*, not through a direct
    call to `assertRunnable` with a hand-built set. A suite that only calls the predicate directly
    is what let the unwired version ship, and would let it ship again.
    DO NOT ship the writer alone. That is (i)(a) without (i)(b) and reproduces this exact defect.
    DO NOT widen this into the judge. Deciding WHICH parked shards deserve release is W1-T3188;
    this shard builds the door and the corridor, and nothing walks through them by itself.
