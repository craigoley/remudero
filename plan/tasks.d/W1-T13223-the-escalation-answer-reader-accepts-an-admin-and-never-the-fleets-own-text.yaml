  rationale: |
    OBSERVED 2026-11-16 via the GitHub REST API: craigoley is an organization, so a comment from Craig's login cao825 on craigoley/remudero carries author_association MEMBER, never OWNER. Escalation #17274 (opened 2026-11-08 from host Mac-mini) reports cao825 refused on 27 distinct comments with reason not-owner; with no operatorGithubLogins configured, operatorRefusal in src/lib/escalation-answers.ts accepts only OWNER. The Azure config was fixed by hand on 2026-10-08 (W1-T6407's rationale), but every new or rebuilt instance repeats the gap.
    The operator RULED 2026-11-16 17:44Z: cao825 and craigoley are the same owner and admin of everything, and nothing should refuse either.
    Also OBSERVED: fleet automation posts as cao825. Reading the first page of comments since 2026-11-01 on each open issue, at least 105 "Another escalation observed the same condition" comments and 13 issue-revalidation refreshes were authored by cao825. Where cao825 is a configured operator, the reader would take those as operator answers; admitting admins without the fleet-authored rule would spread that to every instance.
  design: |
    1. EscalationAnswerGateway gains optional isRepoAdmin(login): Promise<boolean>. The gh gateway reads repos/{owner}/{repo}/collaborators/{login}/permission once per login per pass and caches it.
    2. Before the authority check, a comment whose body matches the fleet's own text (the escalation footer line from renderIssueBody, "Another escalation observed the same condition", or "(issue-revalidation garden, W1-T8864)") is refused as fleet-authored. It is ledgered once like a bot refusal and excluded from refusal alarms.
    3. Otherwise a comment refused as not-owner or not-configured-operator is re-checked with isRepoAdmin. Admin accepts it with authority repository-admin. A failed read counts as unreadable and skips that comment this pass without a ledger row.
    INVARIANT reactions-unchanged: the reaction channel's authority rule is exactly as before.
    Two existing suites move with it: the W1-T6407 real-gateway fixture answers the new permission read (a MEMBER holding write, still refused), and the W1-T11405 parse-reset fixture counts the one extra body read.
    NOT IN SCOPE: changing which login the fleet posts as (filed separately as a RECON), config.json on any host, the revalidation garden's operator-spoke-last guard.
  falsifier: |
    Drop the admin re-check and criterion 1 must fail. Drop the fleet-authored rule and criterion 2 must fail. Treat a failed read as a refusal and criterion 3 must fail. Admit an admin's reaction and criterion 4 must fail.
  note: |
    Reserved with rmd next-task-id from the operator checkout (refs/rmd-id/W1-T13223). rmd test-place computed test/inbox/.
