  design: |
    Establish explicit immutable identity for each newly captured conversational input and reframe,
    scoped to repository, proposal and thread. Reuse an existing trustworthy input identifier where
    available; assign a fresh identity at genuine new capture otherwise. Distinct identical-text
    inputs remain distinct. Validate scope and uniqueness at every handoff; foreign, ambiguous or
    missing references cannot acknowledge an input. A digest may verify a snapshot but is not an
    input identity inferred from text. Preserve the verbatim feedback and explicit supersession.

    Capture the consumed snapshot before any asynchronous decision or draft work: exact input ids,
    their immutable feedback, scope, and explicit supersession state. Carry it through the real
    responder/reframe callbacks, queued draft work, cache candidate, action receipt, ledger outcome
    and appended completion. A completion may acknowledge only inputs in that snapshot. A later
    reframe must remain pending when an older draft finishes; an older cache write must neither
    replace its newer draft nor mark the newer generation attempted. Re-read current scoped state
    before merging completion, preserving unrelated writers and existing retry/refusal semantics.

    Keep three identities distinct: incoming delivery deduplication, mirrored-action event keys,
    and response/action completion deduplication. Persist enough scoped execution outcome before
    acknowledgement that duplicate or restarted callbacks do not repeat an executed action if
    appending its answer fails. Resume the missing acknowledgement from the durable outcome;
    an indeterminate action remains explicitly unknown and is not replayed speculatively. Preserve
    the existing action-state checks, question bounds and approval confirmation tier at execution.

    Derive pending direction and response claims from validated links, never from matching text,
    clocks, append order or current history length. Presentation may retain chronological ordering,
    but an old completion or historical backfill cannot consume a later reply or reframe. Two replies
    arriving during a decider call both remain pending unless the captured snapshot actually includes
    them; avoid a last-message-only queue that loses either one. Genuinely linked delivery advances
    only its inputs. Keep approval/hold precedence and existing classification gates intact.

    Legacy records without links remain explicitly unknown. Do not retrofit identity using text,
    timestamps, history position or a current proposal; do not rewrite/delete legacy history, retire
    proposals, or treat an unknown historical draft as written with later feedback. Make unknown
    linkage distinguishable from a validated completion in the existing thread read composition.
    Preserve PR #13175's recorded-event exclusion and W1-T194's explicit retraction semantics.

    Use real private thread/registry/draft/ledger stores and the production default callback and
    draft-completion composition. Fake only provider work; never substitute the causal handoffs
    under test. Exercise source reply routes, direct CLI reframe and instance-local reframe capture
    as applicable to their existing scopes. Confirm test/inbox/ placement with rmd test-place from
    the final imports before adding the test. Run caller and census suites for the changed surfaces.
    Do not add model calls, synthetic production inputs, automatic approvals or Inbox retirement.
    Change no provider, model, retry, permission, billing/budget, service or CI-infrastructure setting.
    Azure memory and Field Trials remain outside this task.
