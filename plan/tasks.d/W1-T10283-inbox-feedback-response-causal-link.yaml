    - claim: "Equal timestamps historical backfill two replies during a decider call and a newer reframe during an older draft never falsely acknowledge or overwrite newer direction; genuine linked completion advances only consumed inputs"
      proof: "unit test: inbox causal completion cannot consume or overwrite newer concurrent direction"
    - claim: "Duplicate and restarted completion callbacks and action-success followed by answer-append-failure resume acknowledgement without repeating the action; incoming and mirrored-event deduplication remain separate"
      proof: "unit test: inbox causal restart resumes a failed acknowledgement without repeating an executed action"
    - claim: "The production composition preserves recorded-action exclusion explicit supersession approval and hold precedence and all existing action gates while exposing unknown versus linked completion"
      proof: "unit test: inbox causal composition preserves approval hold supersession and recorded-event gates"
