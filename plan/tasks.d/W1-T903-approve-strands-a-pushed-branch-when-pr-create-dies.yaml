    PROOF NOTES: all five proofs are the WHOLE-FILE path form over
    test/approve-resumable-rest.test.ts, which does not exist yet — a FORWARD REFERENCE TO A PATH,
    which CLAUDE.md records as safe, unlike forward-referencing a symbol name. The path is declared
    in files: so the implementer creates it. No `grep:` proof is used, so the line-based and
    basic-regex traps do not arise and no proof-scope warning is raised against this shard.

    PLATFORM FACT, CHECKED RATHER THAN ASSUMED: GitHub's REST create-a-pull-request endpoint is
    `POST /repos/{owner}/{repo}/pulls` taking `title`, `body`, `head` and `base`, and its response
    carries both `number` and `html_url` — so design (i)'s read-back needs no second call and
    design (v)'s `pr_number` comes from the same response.

    NO depends_on: this needs neither W1-T525's meter nor W1-T529's floor. Those bound the burn;
    this removes one caller from the burning budget, and either is useful without the other.
