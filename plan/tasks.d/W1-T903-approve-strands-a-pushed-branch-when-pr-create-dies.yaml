    `ratify.approved` against a PR that is not this ratification, which permanently marks a
    proposal ratified. Design (iii) and (iv) are where that risk is managed.

    budget_usd 75 — a transport swap with an explicit body already in hand, a REST head-branch
    probe, a three-outcome resume, and a falsifier that must count invocations rather than
    behaviour.

