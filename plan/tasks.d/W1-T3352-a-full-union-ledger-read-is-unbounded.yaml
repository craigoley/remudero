  rationale: |
    THIS REPLACES THE ORIGINAL DAEMON-OOM SCOPE. The fleet outage named by the old title ended after
    compaction, and its hot-path union scan was removed by the merged projection work. PR #5057 then
    made `/v1/analytics` stream the rotation union rather than materialise it, which fixed the
    in-process `rows[]` allocation. Fleet delivery proved that retention was not the remaining
    problem: ownership and cancellation were.

    MEASURED ON THE LIVE AZURE HOST 2026-09-11. One authenticated GET timed out at the client after
    60 seconds. The server-side scan continued after disconnect, held about one core, grew from
    1.61 GiB to 2.07 GiB RSS, and was still running when stale-code exit ended the process about
    117 seconds after the request began. A later serve generation exited normally after 1,177
    seconds and restarted; three minutes into the replacement generation the Node process was again
    at 1.51 GiB RSS and about one core. No request log exists, so that second generation is supporting
    pressure evidence, NOT proof that analytics caused it.

    THE SOURCE EXPLAINS THE FIRST MEASUREMENT. `buildAnalyticsRoute` invokes
    `deriveAnalyticsSnapshotFromLedger` inside each GET. `buildServeRoutes` deliberately leaves
    `/v1/analytics` outside the generic bounded-read cache. The HTTP ceiling races the response but
    has no AbortSignal, so losing the race neither stops `openLedgerUnion` nor closes its current
    read/gunzip/readline chain. Multiple clients can therefore start overlapping full-history scans.

    CURRENT CORPUS CONTROL: 515 rotation files and 288,128,676 compressed bytes plus the live file.
    The isolated streaming reducer has completed in about 17 seconds on this compacted corpus, so a
    successful scan is viable as background work. The harmful shape is tying that scan to request
    count and letting abandoned work survive, not the aggregate itself.
  design: |
    (i) ONE PROCESS-OWNED SNAPSHOT. Add a specialised analytics cache, not another generic route
    cache. It owns exactly one immutable `AnalyticsSnapshot`, one in-flight refresh promise, one
    timer and one AbortController. `GET /v1/analytics` reads the current snapshot synchronously and
    NEVER starts, joins or awaits a union scan. Two simultaneous refresh requests collapse to the
    same promise.

    (ii) AN HONEST COLD VALUE. Change `AnalyticsSnapshot.asOf` to `string | null`. Before the first
    successful refresh, return the complete existing schema with empty collections, zero counts and
    `asOf: null`. Do not invent `staleAsOf`, and do not stamp the current time onto evidence that was
    never read. Repository search found no checked-in consumer of this route, so there is no local
    client migration to hide; the nullable field is the explicit API change.

    (iii) REFRESH AFTER COMPLETION, NEVER BY INTERVAL OVERLAP. Start the first refresh after the
    server begins listening. After a refresh settles, arm an unref'ed 15-minute timeout for the next
    one. Fifteen minutes is a COST POSTURE, not a freshness claim: even a refresh that reaches the
    120-second safety ceiling can occupy at most about 12% of one core in steady state. Make the
    delay injectable so tests use no wall clock. A failure or timeout retains the last successful
    snapshot; cold stays cold.

    (iv) CANCELLATION REACHES THE FILE DESCRIPTOR. Thread an optional AbortSignal through
    `deriveAnalyticsSnapshotFromLedger`, `deriveAnalyticsSnapshotFromStream` and `openLedgerUnion`.
    Under the repository's pinned Node 22.22.3, attach the signal to the active readable stream and
    close/destroy the readline, gunzip and file stream in `finally`. An abort is re-thrown rather than
    swallowed by the corrupt-archive best-effort catch, and no later rotation is opened. Ordinary
    corrupt archives remain best-effort exactly as today.

    (v) ONE 120-SECOND SAFETY CEILING. The cache aborts a refresh that has not settled at 120
    seconds, records a named timeout and retains the prior snapshot. This is not a success SLA; it is
    the point after which an analytics reduction may no longer consume a long-lived serve process.

    (vi) SHUTDOWN OWNS CLEANUP. `server.close` stops the timer and aborts the refresh. The stale-code
    exit path invokes the same stop hook before `process.exit`, because a direct process exit does
    not emit the server's close event. The timer is unref'ed and the cache never holds serve open.

    (vii) TELEMETRY IS OBSERVATION ONLY. Record refresh start, completion, failure and timeout with
    duration and retained-snapshot `asOf`. No queue, review, merge, worker or health decision may
    consume this state. Do not compact, delete archives, add a new projection, or spawn a child
    process in this task. If post-merge RSS still exceeds the host's measured headroom with
    single-flight and cancellation proved, process isolation is a separate task with new evidence.
  acceptance:
    - claim: "W1-T3352 criterion 1: a GET returns the cold or last successful snapshot without starting, joining or awaiting a ledger scan"
      proof: "unit test: analytics request returns from cache while refresh is blocked"
    - claim: "W1-T3352 criterion 2: cold state has the complete analytics schema and `asOf: null`, while a failed or timed-out refresh retains the last successful snapshot"
      proof: "unit test: cold and failed refreshes never manufacture analytics evidence"
    - claim: "W1-T3352 criterion 3: concurrent refresh requests are single-flight and the next refresh is scheduled only after the current one settles"
      proof: "unit test: analytics refresh is single-flight and schedules only after settlement"
    - claim: "W1-T3352 criterion 4: timeout, server close and stale-code exit each abort the active union read, close its resources and prevent the next rotation from opening"
      proof: "unit test: every analytics lifecycle exit aborts the active union source"
    - claim: "W1-T3352 criterion 5: a corrupt archive is still skipped best-effort, but an AbortSignal is never collapsed into that corrupt-archive path"
      proof: "unit test: abort is not a corrupt archive and corrupt archives remain best effort"
  falsifier: |
    CLOSE THIS TASK if the route already returns from process-owned state without starting or joining
    a scan. It does not at origin/main `5eb6aa33`: `buildAnalyticsRoute` calls the real ledger reader
    from the GET handler, and `/v1/analytics` is outside `CACHED_BOUNDED_READ_PATHS`.

    DELETE THE CACHE READ in the test and restore request-owned `readSnapshot`; the request test must
    remain unresolved behind the injected blocked reader. Remove the single-flight latch; two
    refresh calls must produce two reader calls. Stamp cold `asOf` with the clock; the cold-schema
    assertion must fail. Swallow an abort in `openLedgerUnion`; the multi-rotation fixture must prove
    a second source opens and fail.

    DO NOT ACCEPT `Promise.race` AS CANCELLATION. The production symptom is work continuing after the
    response bound. Acceptance requires the AbortSignal to reach an active source and the next
    rotation to remain unopened.

    DO NOT USE `setInterval`. A refresh slower than its cadence would overlap by construction. The
    next timer may be armed only in the settled path, and it must be unref'ed.

    DO NOT CALL `/v1/analytics` DURING HOST VALIDATION. The background refresh must produce its own
    start and terminal evidence. Post-merge proof is one successful refresh with request latency
    remaining bounded, or one named 120-second abort with serve still responsive and RSS returning
    toward its pre-refresh level. Local tests prove the lifecycle; only the fleet proves the cost.
  note: |
    The filename deliberately remains unchanged. W1-T3352 is already on main, and renaming its shard
    would re-issue the id. The old OOM evidence is superseded, not denied: it established why a
    materialised union is unsafe. This revision records the residual defect observed after #5057
    removed that allocation.

    Node behavior was checked against the pinned v22.22.3 API: readable async-iterator early exit
    destroys the stream; readline async iteration closes on break/throw/return; `stream.addAbortSignal`
    destroys a stream on abort. The implementation still owns explicit cleanup because the current
    per-file catch would otherwise erase the abort and continue to the next archive.
