  acceptance:
    - claim: "On darwin the census enumerates pids, ppids and uids with ps and same-uid cwds with lsof, answers clear only when the lsof output includes the census's own pid at its own realpath cwd (the positive control) and every same-uid pid still alive has a cwd; a pid at or below the owner path's realpath is occupied; a missing tool, non-zero exit, failed control, unparseable field, same-uid pid with no cwd, or overrun bound answers unknown with a named darwin reason; foreign-uid pids are skipped and counted under W1-T10389's rule; linux /proc behaviour is unchanged"
      proof: "unit test: test/fix-lane/the-fix-owner-cwd-probe-reads-darwin-processes.test.ts"
