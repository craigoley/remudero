  rationale: |
    OBSERVED 2026-11-04:
    - At 19:09Z, a test process in #16240's semantic review grew to 19.2 GiB. The reviewer's census run (`node --test --test-concurrency=2` over 647 tests) reported that file as "not ok 73 - test/worker/spawn/compress-src-lib-worker-ts.test.ts", a file-level failure once the operator approved stopping it.
    - The review's clone had a 10-16 origin/main (W1-T11343 has the mechanism), so compressionPinBase compared worker.ts at HEAD (51,281 tokens) against worker.ts at the 10-16 base (43,242 tokens), and `assert.deepEqual(executableTokens(source), executableTokens(before), …)` failed.
    - Measured in this session, a failing assert.deepEqual over two prefixes of those same arrays:

      | Tokens | Peak RSS | Time | Message |
      |---|---|---|---|
      | 2,000 | 546 MiB | 0.9 s | 29 KB |
      | 5,000 | 1,642 MiB | 2.0 s | 43 KB |
      | 10,000 | 9,217 MiB | 14.6 s | 123 KB |

      The tokenizer itself takes about 0.1 s and 100 MiB on either version.
    - So any real failure of these five pins ends as a runaway that is killed, not a test failure. That includes a compression PR that really did change code, and a stale base anywhere.
    - The other pins compare digests (assert.equal on a token or AST digest) and are not affected.
  design: |
    - Add assertSameTokens<T>(actual: readonly T[], expected: readonly T[], message: string) to test/helpers/compression-pin.ts. It finds the first index whose entries differ (comparing each entry with isDeepStrictEqual), or the shorter length when one is a prefix of the other. It then throws an AssertionError with the message, the index, both lengths, and at most 10 entries before and after it from each side.
    - Replace the whole-array assert.deepEqual in each of the five pins with it. Their small fingerprint control tests keep their own assertions.
    - In the PR-pins census, refuse a pin whose text matches assert.deepEqual( followed by two executableTokens( calls, and add the detector's positive and negative controls.
    - In renderCommentCompressionShard's design text (src/lib/gate-gardener.ts), add "compare the token streams with assertSameTokens from #test/helpers/compression-pin.js".
  note: |
