  rationale: |
    READ 2026-10-04 on #9124's head 0704ab90 (merged 3f934073) over origin/main 284015b9. `readMergedPathsByPr`
    (src/run-task.ts) scans `MERGED_PATHS_SCAN_LIMIT = 4000` first-parent commits, today back to
    #3678 (2026-09-02). #9124's `reviewHead(pr)` waives `isPlanOnlyFilingPr` only when
    `mergedPathsByPr` proves a plan-text delivery; outside the window it passes the head sha and a
    plan-only review row refuses the credit before the `changedFiles` fallback (which does use
    `refusesAsPlanOnly`) is reached. W1-T2648's #3896 sits at first-parent position 3831, so it
    leaves the window after about 170 more merges. Latent today: W1-T2648 holds an unquarantined
    durable entry.
  design: |
    When no local paths exist for the PR and a plan-only review row would refuse, call
    `github.changedFiles(pr.url)` once and apply `isPlanTextDeliverable` to it. The call is gated on
    that ledger row, so it is rare.
  acceptance:
    - claim: "a plan-text delivery whose PR is outside the local merged-paths window and carries a plan-only review row is credited from one changedFiles read, while a filing PR in the same position is still refused"
      proof: "unit test: test/the-plan-text-waiver-reads-past-the-local-window.test.ts"
  falsifier: |
    Drop the changedFiles fallback; the out-of-window delivery is refused and the test fails.
