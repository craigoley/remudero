    - claim: "the ratchet still passes on the committed CLAUDE.md at the new cap, and a file one byte over it is refused"
      proof: "unit test: test/the-doctrine-cap-tracks-the-index.test.ts"
    - claim: "the superseded W1-T2507 rationale survives the change that supersedes it, dates and all"
