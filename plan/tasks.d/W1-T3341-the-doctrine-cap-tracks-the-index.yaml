    - claim: "this PR touches no src/ path, so Standing rule 25 reads entangled false on its own diff"
      proof: "unit test: test/the-doctrine-cap-tracks-the-index.test.ts"
  falsifier: |
    CLOSE THIS WITHOUT IMPLEMENTATION if `capBytes` already tracks the index — MEASURED 2026-09-10
    it is 44000 against a 15501-byte file.
    DO NOT PICK THE NUMBERS BY FEEL. Re-measure the per-rule cost on the LIVE index before
    committing to 17000/18400: `renderHeadlineOnlyIndex(parseRuleHeadlines(CLAUDE.md))` over the
    rule count gives the headline half, and the pointer half is the mean length of
    `-> doctrine/<section>/<rule>.md` across the index. If the file has grown since this was filed,
    the headroom is what moves, never the arithmetic.
    DO NOT ADD A `src/` FILE. The entire reason this is its own task is that a `src/` path beside a
    `scripts/*-baseline.json` is an unsuppressible rule 25 failure. A task that needs one has
    discovered a different task.
    DO NOT lower `capBytes` below the committed file to force a fold. The ratchet fails closed and
    would take main red for a reason no PR caused.
