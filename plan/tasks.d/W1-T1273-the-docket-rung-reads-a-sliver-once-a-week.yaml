      2026-08-12T23:20:46.774Z, window since 2026-08-05T23:20:46.710Z
        {"reframe":0,"operator_feedback":0,"rejected_feedback":0,"question_answer":0,"operator_note":0}
      2026-08-20T00:48:15.333Z, window since 2026-08-13T00:48:15.274Z
