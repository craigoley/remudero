  rationale: |
    ★ CLOSED UNBUILT. THE UNBLOCKING MEASUREMENT WAS TAKEN AND IT CLOSED THE TASK RATHER THAN
    OPENING IT. `status: blocked` is retained deliberately: it is this plan's established way to
    retire a task unbuilt (W3-T3 carries the same pairing of a RETIRED title with `status:
