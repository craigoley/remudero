    auto-triage's 'record the fire first' discipline: a crash mid-file still costs one skipped
    week, never a re-gather storm on the next poll." So every attempt costs a full week whether it
    finds anything or not. That is the intended trade, not an oversight.
  design: |
    (i) Q1 — NEITHER CAUSE "DOMINATES", AND THE BRIEF'S TWO-CAUSE FRAME NEEDS ONE CORRECTION EACH.
    THE MARKER IS NOT A DEFECT: seven days is the designed cadence and "record the fire first" is a
    deliberate anti-storm discipline. Nothing here changes it, and no fix to it is indicated.
    THE CORPUS STARVATION IS REAL BUT PARTIAL. The docket has FIVE capture surfaces, and only TWO
    of them come from the ledger:
      reframe            <- inputs.ledgerLines      STARVED (live file only)
      operator_feedback  <- inputs.ledgerLines      STARVED
      rejected_feedback  <- listFeedback(plan/feedback/)   full fidelity
      question_answer    <- readQuestionsNdjson             full fidelity
      operator_note      <- readOperatorNotesNdjson          full fidelity
    Three of five surfaces were never starved and still yielded nothing, so the corpus cannot by
    itself explain an empty docket.

    (ii) THE BLAST RADIUS OF THE CORPUS FIX IS AT MOST ONE SURFACE, AND THIS IS THE SHARPEST FACT
    IN THE TASK. Of the two starved surfaces, `reframe` is built from `ratify.reframed` rows — and
    the operator's OWN prior measurement over the union put `ratify.reframed` at ZERO across the
    whole corpus. So `reframe` contributes nothing whether it reads the live file or all 21
    archives. That leaves `operator_feedback` as the ONLY surface a union read could change.
    THE ORDER THE BRIEF ASKS ABOUT THEREFORE RESOLVES: fixing the marker alone would mean finding
    nothing more often, exactly as the operator predicted; fixing the corpus alone can widen one
    surface out of five; and if that surface is empty over the union too, neither fix produces
    anything and this task should close.

    (iii) Q2 — WHAT THE RUNG IS SUPPOSED TO PRODUCE, AND WHY A LOW RATE IS CORRECT. Its own doctrine
    is that "empty windows file nothing — a loop that files something every cycle is a loop that
    files noise". A weekly cadence that has produced nothing in three days is not evidence of a
    fault. This task does not treat zero output as a defect; it treats ONE READ SHAPE as a defect
    and leaves the rate alone.

    (iv) THE FIX, SCOPED TO ITS PROVEN EXTENT. `runFeedbackDocketRung`'s ledger input moves to the
    union so that `reframe` and `operator_feedback` see the same corpus every other union reader
    sees. The three non-ledger surfaces are untouched. No new instrumentation is added, because —
    see (v) — it already exists.

    (v) THE CLOSING MEASUREMENT ALREADY EXISTS AND NOBODY READ IT. `buildFeedbackDocket` already
    computes `countsBySource` AND `emptySources`, the latter documented as "Sources with ZERO items
    in this window — named, not silently omitted (design i)". And the rung already emits
    `log("feedback_docket.empty", { window, counts_by_source: docket.countsBySource })`. So the TWO
    `feedback_docket.empty` rows the operator counted ALREADY CONTAIN the per-surface answer.
    THE UNBLOCKING CONDITION, EXACTLY: read those two rows' `counts_by_source` over the union.
      IF `operator_feedback` is 0 there, the union read changes nothing that can be observed and
        THIS TASK SHOULD BE CLOSED UNBUILT with that figure recorded — the operator's Q2 outcome.
      IF it is non-zero, the live-file read was hiding real items and the fix in (iv) is justified.
    Record the number and the date in this shard before unblocking it.

    (vi) Q3 — WHAT MUST NOT CHANGE, REFUSED BY NAME RATHER THAN OMITTED.
      NO AUTO-FILING WITHOUT THE OPERATOR. The rung proposes; it never ratifies.
      THE EMPTY-WINDOW REFUSAL STANDS. An empty docket still files nothing.
      THE MARKER'S PURPOSE STANDS. It still prevents a 300-second re-fire, and its seven-day
        interval and its write-before-the-check ordering are both left exactly as they are.
      AND EXPLICITLY NOT PROPOSED: deleting the marker, lowering the cadence, or seeding the
        registry by hand.

    (vii) THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS. `lint-plan` reads `src/run-task.ts` and
    the new test file as two concerns. The change itself is one call site's input.
