    `operator_feedback` IS THE ONE SURFACE WHERE THE LIVE-FILE READ COULD STILL HIDE SOMETHING.
    What makes that residual risk small rather than zero: the window is SEVEN DAYS, and a seven-day
    lookback is precisely the case a live ledger file most plausibly covers in full. Small is not
