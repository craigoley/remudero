  rationale: |
    OBSERVED 2026-11-17: GitHub moved ubuntu-latest from ubuntu-24.04 (image 20261111.370.1) to ubuntu-26.04
    (20261111.196.1) between main runs 44006635512 (green) and 44008977154 (red). The 26.04 image ships bwrap and
    24.04 did not, so the proof sandbox now runs in CI. bwrap 0.9.0 always sets PWD to its --chdir target, so
    test/proof-spawner-env-isolation.test.ts saw PWD outside PROOF_ENV_ALLOWLIST and failed every ci-shard run.
    The red-main lane opened #19011 with the right fix and the dispatcher-written proofs
    "unit test: test/proof-spawner-env-isolation.test.ts" and "unit test: test/containment.test.ts".
    The required proof-discrimination gate graded both executed_stale: inside the proof sandbox the suite passes at the
    merge base too (reproduced locally with rmd check-proof --base: exit 5). Allowance for main-repair ids is 0, so the
    gate failed and main stayed red until a session swapped the proofs for greps by hand (body edit 04:32Z).
    W1-T11291 assumed a red suite "fails at the base by construction". That holds only when the red does not depend on
    the environment the proof executor runs in. The revert lane (#19020, #19028) wrote the same unit test proofs.
  design: |
    1. src/lib/main-repair-acceptance.ts: withoutStaleRepairProofs({ body, diffText, grade, readFile }) grades every proof
       with an injected BaseProofGrader. Stale proofs are dropped; diffAnchor's grep (never a comment line) is added when
       it is not already there. No safe anchor and no survivor: the body is returned unchanged with the reason.
    2. src/lib/repair-proof-grader.ts: checkProofBaseGrader(worktree, mergeBase) spawns the worktree's own check-proof
       entry with --base, the same child scripts/proof-discrimination-gate.mjs runs, and maps exit 5 to stale, 0 to
       discriminates, anything else to unknown.
    3. src/run-task.ts: openCheckedRepairPr (fix and alert-fix lanes) and openMainRepairRevertPr grade the assembled body
       before the REST open. The grader is an injectable dep; the default reads the worktree's merge base with origin/main
       and ledgers <lane>.proofs_ungraded when it cannot.
    INVARIANT discriminating-body-unchanged: a body whose every proof grades discriminates or unknown opens byte for
    byte as before; an ungraded body (merge base unreadable) also opens as before. Only an executed_stale proof is
    ever removed, and the PR is never refused by this step.
  falsifier: |
    At origin/main the dispatcher opens #19011's body with its two unit test proofs unchanged, and proof-discrimination
    reports "2 proof(s) pass at both PR head and merge base".
  note: |
    Reserved with rmd next-task-id --count 3 --branch claude/project-thread-7ycldf from a detached origin/main worktree
    on the operator's Mac mini (2026-11-17 11:40Z). Not covered by: the run-worker-opened path, where a worker opens
    its own PR before the dispatcher sees the body.
