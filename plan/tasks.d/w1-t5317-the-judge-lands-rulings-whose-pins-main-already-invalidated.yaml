  title: "THE MACHINE-FILING JUDGE LANDS RULINGS WHOSE PINS MAIN HAS ALREADY INVALIDATED — 2026-10-02 it pinned W1-T5270 and W1-T5277 at 15:55:58Z, operator PR #8689 retired both, then judge PR #8687 merged the stale pins on top and every-shard-on-main-is-lintable went red on main for every PR until #8700"
