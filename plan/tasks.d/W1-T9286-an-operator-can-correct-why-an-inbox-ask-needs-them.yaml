- id: W1-T9286
  title: "Let the operator correct why an Inbox ask needs them without implying approval"
  repo: remudero
  depends_on: ["W1-T9282"]
  priority: 1.75
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 35.00
  risk: high
  band_meaning: blast-radius
  origin: "2026-10-13 operator-approved follow-up; issue #7708"
  plan_refs: ["W1-T4742","W1-T4853","W1-T5339"]
  files: ["src/lib/inbox-responder.ts","src/lib/panel-graph.ts","src/lib/instance-inbox-contract.ts","src/lib/fleet-lane.ts","openapi/daemon.yaml","packages/api-client/src/schema.d.ts","test/an-operator-can-correct-why-an-inbox-ask-needs-them.test.ts"]
  status: queued
  attempts: 0
  rationale: |
    The source-qualified census already emits whyMe and sourceFacts, but issue #7708 still needs a reversible operator correction. The operator approved fleet-can-handle and still-need-me feedback as a distinct task, preserving security and approval authority.
  design: |
    Offer source-qualified why-me evidence and two reversible corrections: fleet can handle this, or still need me. Bind the correction to operator, repository/instance, proposal and observed snapshot with an idempotent receipt. Reject stale or foreign scope before writing. Record feedback and later outcomes for the existing judgement/fleet lane; a correction is input, never a ratification, execution permission or authority downgrade. Keep the original explanation/history and show any mismatch between a verified ruling and operator feedback. A W1-T216-like held security ask remains held after fleet-can-handle feedback. Extend the public contract additively; the console follow-up consumes the receipt only after the producer schema is pinned.
  acceptance:
    - claim: "a correction cannot release a held security decision"
      proof: "grep: test(\"a why-me correction is source-bound reversible feedback rather than approval\" in test/an-operator-can-correct-why-an-inbox-ask-needs-them.test.ts"
    - claim: "stale or repeated corrections cannot create duplicate side effects"
      proof: "grep: test(\"a why-me correction refuses a changed snapshot and replays one receipt\" in test/an-operator-can-correct-why-an-inbox-ask-needs-them.test.ts"
  falsifier: |
    Join corrections by task id alone, infer release from fleet-can-handle, or remove snapshot/idempotence checks. The held-security, foreign-instance and changed-replay fixtures must fail.
