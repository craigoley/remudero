  files: ["src/lib/inbox-freshness.ts","src/lib/nav-badge-view.ts","src/run-task.ts","src/lib/verify-human-judge.ts","src/lib/inbox-why-me.ts","src/lib/inbox-view.ts","src/lib/inbox-responder.ts","src/lib/panel-graph.ts","src/lib/instance-inbox-contract.ts","src/lib/fleet-lane.ts","openapi/daemon.yaml","packages/api-client/src/schema.d.ts","test/an-operator-can-correct-why-an-inbox-ask-needs-them.test.ts","test/a-verify-human-shard-is-judged.test.ts","test/helpers/why-me-world.ts","scripts/generate-api-client.mjs","test/api-client-drift-check.test.ts","test/every-served-route-is-in-the-contract.test.ts"]
