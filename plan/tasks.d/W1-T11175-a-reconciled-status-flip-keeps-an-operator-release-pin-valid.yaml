  rationale: |
    MEASURED 2026-11-03 (read-only; the core ledger union on the Azure host, /mnt/rmd/state2/state, 408 archives from 2026-10-24
    plus the live file, read niced and streamed back to the Mac; origin/main read at the time of filing).
    THE CADENCE. `rmd plan-reconcile`'s landing runs only inside the daemon's measurement cadence: runMeasurementCadence ->
    buildPlanReconcileProductionInput -> planReconcileCadence -> planReconcileLanding, branch plan-reconcile-landing. It lands only
    when drift reaches the threshold (10). A refused landing throws, and the cadence logs measurement_cadence.run_failed.
    WHAT IT DID SINCE #14125:
    - The last successful run (measurement_cadence.ran) was 2026-10-25T09:15Z, and it landed #14125 at 09:37Z. No ran row
      since.
    - 8 runs, 2026-10-27T04:12Z through 2026-10-30T21:56Z, reached the landing and failed: "plan-PR preflight refused the
      plan-reconcile-landing push: [shard-census] not ok 2 - W1-T3086: violating shard files cannot grow past the recorded
      baseline".
    - 34 runs, 2026-10-27 and 2026-10-31 through 2026-11-03, ended "exited without a result" with "FATAL ERROR: ... JavaScript
      heap out of memory" after 1,172-6,519 s. 17 also logged "board gateway: batched PR fetch failed (auth) ... gh: Bad
      credentials (HTTP 401)". 2 others timed out in updateProposalRegistry.
    ROOT CAUSE OF THE REFUSAL, REPLAYED:
    - On a scratch worktree at origin/main, every shard whose task merged since 2026-10-25T09:30Z (a Remudero-Task trailer on
      main, 257 ids) was flipped queued to merged: 251 flips.
    - `rmd lint-plan --all` went from 53 to 61 failing. The 8 new failures are exactly the 8 operator-released shards in the
      flip set (W1-T10431, W1-T10787, W1-T10829, W1-T10874, W1-T10898, W1-T10917, W1-T10942 and W1-T10970), each
      "[operator-release-contract] task ... changed its operator-approved contract; explicit reapproval required".
    - operatorReleasePin (src/lib/operator-release.ts, #13992, merged 2026-10-24T23:35Z) hashes the loaded task minus
      sourcePath, attempts and risk_ruling. status is in the hash. So the control plane's own status flip, which W1-T3043 and
      W1-T3226 made the reconciler's job, reads as a changed approved contract. 9 shards on main carry an
      operator_release_pin.
    - The landing is all or nothing: one refused flip throws away the other 243, so each run lands nothing.
    WHY IT MATTERS: plan status is what builders and the duplicate checks read. With W1-T9578 queued since 2026-10-25 and
    W1-T11071, W1-T10742, W1-T11076, W1-T9114 and W1-T10870 merged but still marked queued, every filing and pre-build check
    in the last 8 days had to re-derive merges from trailers by hand (the agent preamble's "a shard's status: queued lags merges
    by hours"). A filing session on 2026-11-03 found W1-T9578 shipped only by reading main's log.
    NOT COVERED, REPORTED SEPARATELY: the measurement cadence child itself ran out of heap on 34 of the last runs, which blocks
    every cadence product, plan-reconcile included, and its board read hit HTTP 401. This task makes the landing succeed when the
    cadence reaches it, but nothing lands until the cadence child completes. W1-T10233 (a scout task, queued) names
    measurement_cadence.run_failed without a cause and is the existing home for that. The fixed drift threshold of 10 is left
    as it is here.
  design: |
    1. PIN. operatorReleasePin excludes status, the control plane's lifecycle bookkeeping, as it already excludes attempts. New
       pins are written in the status-free form under a "v2:" prefix. For an unprefixed (legacy) pin,
       operatorReleaseContractChanged compares it against the legacy hash recomputed with status set to each value plan.ts's
       status set allows. It reads unchanged when any one matches, so every pin already on main stays valid without a hand
       recompute. Every other field stays in the hash.
    2. LANDING. In buildPlanReconcileProductionInput's land, before the landing bridge: lint the plan as it would be after the
       writes, with lintPlan over the loaded plan and the replaced shard texts. Drop any write whose task newly gains a blocking
       violation. Land the rest. Return the held ids and rules so planReconcileCadence's result carries them as held:
       [{taskId, rule}] on the plan_reconcile row. Zero landable writes is status reported, not a throw. Any other landing
       refusal still throws (W1-T9695).
    3. src/run-task.ts is near its comment-load ceiling. Keep its change to the call.
    Tests go in the new file, titled verbatim as in the proofs. They use the real operatorReleasePin and lintPlan, real shards
    read from plan/tasks.d via REPO_ROOT, and an injected landing bridge. rmd test-place computes test/plan/ for these imports.
  falsifier: |
    At origin/main, W1-T10431's shard with status set to merged makes operatorReleaseContractChanged return true, so the first
    test fails. The replayed flip set adds 8 operator-release-contract blocks, so the second test fails. A write set with one
    violating flip makes the land seam throw for all of them, so the third test's "lands every other flip" fails.
