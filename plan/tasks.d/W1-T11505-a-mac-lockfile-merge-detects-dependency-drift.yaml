  plan_refs: [W1-T10507, W1-T10257, W1-T11468]
  files: [hooks/post-merge, deploy/DEPENDENCY-SEEDS.md, test/review/a-mac-lockfile-merge-names-the-supported-prime-remedy.test.ts]
  priority: 3
