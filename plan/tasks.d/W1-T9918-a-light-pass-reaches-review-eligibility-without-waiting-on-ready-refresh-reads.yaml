  design: |
    Operator ruling: no new fixed threshold, no new interval or cap.
    1. MEASURE FIRST. Each light pass ledgers one row (`sweep_light.pre_review_timing`) with the wall ms of each phase
       before the first batch starts: open-PR views, ready-set compare reads (count, and ms per read), the ready
       refresh's ledger read, its Actions read, the value gate, the update itself, and the refresh admission. The row
       also carries the synchronous on-loop ms the pass spent. The PR reports these numbers from a fixture and, after
       merge, from the host.
    2. The compare reads use the async gh transport and never block the loop. A compare result is memoized by
       (head sha, main sha): an unchanged head against an unchanged main is not read again. The memo holds counts and
       file lists, not rows, and is bounded by the open-PR set it is keyed on.
    3. A PR outside the ready set never waits on the ready refresh or the admission. Only the ready PRs, whose arm
       W1-T7214 holds until their distance is known, wait. This keeps W1-T7214's guarantee: no ready PR is armed on a
       base main has left. If step 1's numbers show a different phase dominates, the builder takes THAT phase off the
       path by the same two means (async, memoize by its input), names it in the PR, and does not grow the task
       further.
    4. Which PR is refreshed, the refresh's value gate, and the admission's decisions are unchanged.
    Tests go in test/a-light-pass-reaches-review-eligibility-without-waiting-on-ready-refresh-reads.test.ts, titled
    verbatim as in the proofs. Drive the real buildSweepLightHook with injected readers whose ready-refresh read is
    held open on a deferred promise. Assert that a non-ready PR's `sweep.review_eligible` is written WHILE the read is
    still pending; its absence is the defect. Positive control: a ready PR's arm still waits for its distance.
  acceptance:
