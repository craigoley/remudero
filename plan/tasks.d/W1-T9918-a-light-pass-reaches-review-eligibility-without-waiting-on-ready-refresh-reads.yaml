    - claim: "a non-ready PR reaches review eligibility while the ready refresh's read is still pending, and a ready PR still waits for its distance"
      proof: 'grep: test("W1-T9918: a non-ready PR is review-eligible before the ready refresh settles" in test/a-light-pass-reaches-review-eligibility-without-waiting-on-ready-refresh-reads.test.ts'
    - claim: "an unchanged head against an unchanged main reuses its compare, and no compare read runs synchronously on the loop"
      proof: 'grep: test("W1-T9918: an unchanged head and main reuse their compare off the loop" in test/a-light-pass-reaches-review-eligibility-without-waiting-on-ready-refresh-reads.test.ts'
  falsifier: |
    At origin/main, holding the ready refresh's read open leaves every batch unstarted. No `sweep.review_eligible` is
    written for the non-ready PR until the read resolves, so the second test fails. A second pass over the same
    head and main calls `ghJson` compare again, synchronously, so the third test fails.
