  rationale: |
    OBSERVED 2026-09-28: golden-corpus.ts admits only real merged tasks whose proofs discriminate base from head; nothing
    generates tasks. SWE-smith (https://arxiv.org/abs/2504.21798) produced 50k test-breaking tasks from 128 repos and lifted a
    32B model to 40.2% on SWE-bench Verified (+33 points). rmd's own proofs are the validity check SWE-smith had to build.
  design: |
    (i) For a merged run PR with unit-test proofs, build the candidate by reverse-applying its non-test hunks onto main.
    (ii) Keep it only when the task's own proof goes red on the candidate and green on main (the discrimination rule).
    (iii) Emit a sealed synthetic task record (never a plan shard, never dispatched to production) for W1-T4626/W1-T4627/W1-T4665.
    (iv) Pilot first: 30 merged tasks, report the keep rate.
