  rationale: |
    The signed-in operator's Products page failed on deployed Console396fcd6a on October28. Five actual Vercel warnings at 02:10:00-02:10:01 report upstream response-header timeouts at 5000-5002ms, with the existing 5000ms bound. The tunnel independently observed those actual /v1/products requests reaching remudero-serve:4317 and being canceled. A local /v1/version read returned 200 in136ms; a Products read without the required operator identity correctly refused403 in9ms. Those controls do not establish successful protected Products reads.
    Captured runtime.loop_stall_profile rows positively identify the serving hostname685b8f10164d and service process319241. A02:10:49 profile has18463ms event-loop lag and local assessGatewayCheckout/execFileSync frames; another has10167ms and status.readLedgerLines/incident-invariants/GC frames. The observed local Git frame is a verified blocking mechanism, not proof that it caused every timed-out request or every serving stall. Retain the independent incident-monitor and read-model candidates in the backlog.
    At inspected producer02855f7 and filing baseb3eae3fcf, assessGatewayCheckout's fetch is asynchronous but its default local git closure calls execFileSync without a timeout. checkServiceFreshness then invokes that local closure synchronously on the serving loop. self-sync.ts already exports asyncGit and awaits local assessment in checkServiceFreshnessAsync. Reuse the existing asynchronous child mechanism rather than adding a second subprocess executor. The full shared freshness checker has different material-path and loaded-revision semantics; preserve the gateway's existing behavior instead of replacing its decisions blindly.
    Subject audits at captured main efef4f666 and b3eae3fcf read all ten open heads plus main, with277 matching task records per head as the corpus control, and found no new equivalent task or open serve.ts source diff. W1-T10074's executable acceptance shipped a profiler, not this off-loop source correction; the daemon freshness task is a different caller. A private owner checkout was then discovered and is explicitly retained below; open-head absence is not global source freedom.
  prompt: |
    Keep the gateway freshness read off the serving event loop through its actual default subprocess path. Await local rev/status/count/diff reads serially as needed and carry their failed or unavailable results explicitly. Use existing cancellation, child-lifetime and output bounds; do not introduce an uncalibrated timeout or let an awaited wrapper hide synchronous child execution. Capture and recheck checkout identity when asynchronous steps could observe different revisions; a mixed assessment must not publish a healthy result or request a handoff based on invented evidence.
    Preserve checkServiceFreshness's reentrancy and CI guards, supervised-generation behavior, dirty-tree refusal, unknown values, behind counts, target identity, reloadPlanAt, serveRestartRelevant and all existing handoff/drain decisions. This repair changes the responsiveness of the evidence read, not those policies. Keep the existing network fetch, request timeout, resource limits, provider/billing settings, access checks, mounts, service configuration and deployment workflow unchanged. A source merge is not runtime adoption or proof that Products works.
    Extend the existing physical gateway suite. Test the actual default child path in a private real repository with a controlled executable/barrier, not only injected git fakes. While a local read is held, an unrelated HTTP request and scheduled callback must complete before that child is released. Arrange barrier release and server/child cleanup independently so the synchronous-base falsifier cannot strand a test. Retain all original assertions. Cover the existing guarded, clean-current, clean-behind, dirty, fetch-failed, missing-repository and malformed-count outcomes, plus an identity change between awaited reads and child failure. New imports use the maintained package aliases and root helper.
    Remove only the asynchronous default and observe the responsiveness boundary fail; restore exactly and require the same control to pass. Commit before measuring coverage; positively prove each changed source is instrumented and reject a targeted zero in that source's own SF block. Run the actual joined census suites, full types, the canonical stored executable proofs, native author/resource admission, hosted test/coverage/security checks, genuine governed review and protected merge. Keep every failed receipt and distinguish focused tests from full qualification, merge, runtime adoption and signed-in acceptance.
