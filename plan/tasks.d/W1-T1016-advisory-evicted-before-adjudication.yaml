  note: |
    `risk: high` WAS SET BY THE LINTER, NOT ASSERTED. A first draft at `medium` was refused,
    exit 1, verbatim: *"[sizing] spans 2 distinct subsystems/concerns (ledger, ledger-rotation)
    at risk:medium — Rule 19: raise to risk:high or decompose into one task per concern"*. Raised
    on that refusal. Decomposition is declined with a reason: registering the step without the
    assertion that it is registered is precisely the shape the W1-T316(iv) rotation rule exists to
    stop, so the constant and its test are one change.

    THE `grep:` PROOF ESCAPES ITS DOT ON THE LINTER'S OWN ADVICE — `[proof-grep-safety]` warned
    that `review.unwired_advisory` has an unescaped `.` matching ANY character in a BRE. The escape is invalid inside a
    double-quoted YAML scalar (`YAMLParseError: Invalid escape sequence \.`), so the pattern drops
    the dot instead: `unwired_advisory`, which is equally distinctive and needs no escaping.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT. `DECISION_RELEVANT_LEDGER_STEPS` reads 9 in
    `src/lib/ledger.ts` (its home) and 11 in `test/ledger-rotation.test.ts` (the highest of any test
    file); `MAX_RETAINED_LINES_PER_STEP`, which design (iii) requires the falsifier to exercise,
    reads 5 in the same source file. **`src/run-task.ts` IS NOT DECLARED** even though it holds 13
    `DECISION_RELEVANT_LEDGER_STEPS` references and the emitter comment this task corrects: the
    constant's HOME is `src/lib/ledger.ts`, the change is one entry in that constant, and 221 shards
    already declare `src/run-task.ts` (W1-T471). If an implementer finds the emitter comment must
    also change, that is a one-line doc edit and the right move is to say so rather than widen the
    declaration silently.

    THE MEASUREMENTS ARE QUERIES. Re-derive with a per-form read of `state/ledger.*.ndjson` and
    `state/ledger.ndjson` (0 `.gz` files on this host), full-line deduped, and word-bounded
    `git grep`. They move; the symbol names are the check.

    THE PREMISE WAS TESTED BEFORE FILING, AND ONE CANDIDATE EXPLANATION WAS REJECTED. The obvious
    reading — that `MAX_RETAINED_LINES_PER_STEP` trimmed the old rows — is WRONG: the step holds 87
    rows, well under the 200 cap, so that bound has never bitten it. The eviction is categorical
    (not in the retained set), not quantitative. Recording that here so a later reader does not
    re-derive the wrong mechanism from the same symptom.
