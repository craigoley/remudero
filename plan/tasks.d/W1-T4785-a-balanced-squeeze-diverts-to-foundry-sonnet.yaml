  rationale: |
    OBSERVED 2026-09-29: synthwatch-foundry now serves claude-sonnet-5-5 (GlobalStandard, version 2). A live
    POST to the daemon's own RMD_FOUNDRY_CLAUDE_ENDPOINT + /v1/messages returned 200 with model claude-sonnet-5-5;
    claude-opus-5-5 answered the same probe as the control. But the source serves only Opus: FOUNDRY_OPUS_PRICE is
    the one price row (worker-provider.ts `deployment === "claude-opus-5-5"`), the reservation cap filters to
    claude-opus-5-5 rows, spawnFoundryOpusWorker refuses any `selection.model !== "claude-opus-5-5"`, and only the
    subscription_only (frontier) branch of spawnWorker sets cashOpusEmergency. A squeezed balanced task takes
    `cash-fallback`, and selectOpenWeightModel promotes Luna. The operator ruled on 2026-09-29 that the balanced
    squeeze should run on Sonnet 5.5, with routine cash staying on the measured nano/OSS/Luna rows.
  design: |
    (i) Generalize the Foundry Claude adapter over a deployment -> price table: claude-opus-5-5 keeps its row, and
    claude-sonnet-5-5 gets its own ($2 input / $10 output per million, Anthropic's list price 2026-09-29; re-read
    Microsoft's Foundry rate and record readAt). The spawn gate admits either deployment only on a squeeze.
    (ii) The daily ceiling becomes a FOUNDRY CLAUDE cap. It keeps the {normal 5, squeezed 10} values and is summed
    over reservations of BOTH deployments, still inside the shared cash dailyCapUsd.
    (iii) In spawnWorker's non-subscription_only capacity-blocked arm: when the requested model resolves to the
    `balanced` capability and the Foundry Claude endpoint and key are present, divert first with a new routing rule
    `cash-sonnet-fallback` to claude-sonnet-5-5. A refusal before transport (cap exhausted, absent credentials,
    unsupported tool surface) falls through to today's `cash-fallback` Luna path, so the squeeze never holds a task
    that runs today. Economy and non-squeezed cash are unchanged.
