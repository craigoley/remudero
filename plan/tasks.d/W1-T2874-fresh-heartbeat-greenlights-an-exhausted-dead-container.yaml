      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "a running container at 5 of 5 produces AT_LIMIT, a running container below its cap produces ok, and an uncapped policy produces unlimited rather than an exhausted verdict"
      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "a clean exited container is reported as operator_stopped and does not become a crash or exhausted-retry finding"
      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "missing and malformed runtime answers omit numeric and state readings, publish a bounded unknown reason and never synthesize a healthy or exhausted value"
      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "one docker inspect supplies state, running flag, exit code, restart count, maximum and policy without a second runtime call or container exec"
      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "the off-host watcher treats AT_LIMIT and STOPPED_RETRY_EXHAUSTED on a fresh beat as per-host findings, evaluates every configured host and drives the existing idempotent needs-human delivery"
      proof: "unit test: test/fleet-heartbeat.test.ts"
    - claim: "beat-age, deploy-supervisor, broken-install and ledger-derived daemon verdict behavior remain independent, including W1-T484's refusal to alarm solely on a stale daemon ledger timestamp"
      proof: "regression test: test/fleet-heartbeat.test.ts"
    - claim: "removing either the container-state parse or the workflow restart-verdict predicate makes the exact 2026-09-05 dead-container regression fail"
      proof: "mutation test: test/fleet-heartbeat.test.ts"
  falsifier: |
    Close without implementation only if current main already makes a fresh `heartbeat-azure`
    carrying Docker's exited 134, 5-of-5 state fail the off-host watcher and reach the idempotent
    needs-human path. It does not: the 08:40 beat was fresh, its subject said live, and the workflow
    source parses only `supervisor_verdict`.

    Re-design rather than ship if distinguishing a crash requires ledger age, a Docker log scrape,
    container command inspection, node/tsx, a second runtime call or lifecycle authority. Docker's
    structured inspect state is the only accepted source for this verdict.
