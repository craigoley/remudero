  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. All five criteria use the pure-path `unit test:`
    form naming `test/claude-md-budget-ratchet.test.ts`, which is declared in `files:` and already
    exists, so they resolve against a real file rather than a forward reference.

    `risk: medium` IS HONEST IN BOTH DIRECTIONS. Two files, one concern, and the blast radius is a
    gate that currently passes on every baseline in the repository — the change adds a refusal
    where there is none, so a mistake reddens CI loudly rather than passing something bad silently,
    which is the direction a ratchet should fail in. It is not `high` because nothing here touches
    a workflow, a job, a required-check name, or any `src/` path.

    THE TASK IS SMALLER THAN THE DEFECT IT SERVES, DELIBERATELY. W1-T1227 (#2550) owns the general
    case: the fix rung is never told the PR's declared scope, so it cannot know that the only
    repair available to it is out of scope. This task does not fix that. It removes ONE standing
    reason a repair must reach for an instrument — the most frequent one, since CLAUDE.md drifts by
    a few bytes whenever anyone edits it — and leaves the class where it was filed.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN.
    `refs/rmd-id/W1-T1231` resolves on origin against a namespace of 262 such refs; the reservation
    existing is not evidence a shard does. EIGHT ID SURFACES WERE SWEPT, each against a control
    pre-qualified for THAT surface — and ONE CONTROL WAS RE-QUALIFIED MID-SWEEP RATHER THAN
    TRUSTED: W1-T1227 was the obvious control for the main-tree surfaces and reads 0 on both,
    because its own shard is still in an open PR, so the shard-filename and `- id:` surfaces were
    re-controlled on W1-T1222 and W1-T1213, which read 1 each. Shard filenames 0; plan `- id:`
    lines 0; the reservation 1, which is the pre-mint; open PR titles 0 against W1-T1227 at 1; open
    PR head branches 0 against `run-W1-T` heads at 2; open PR file lists 0 with coverage at five
    captured of five enumerated, against `plan/tasks.d/` paths at 2 across the same heads; merged
    trailers 0 against `Remudero-Task: W1-T1085` at 1; merged subject credit 0 against W1-T1213
    at 1, with `run-W1-T1231-*` at 0 against a namespace of 83 `run-*` branches.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE, NOT A PRESENCE TEST. Three
    markers were counted in `scripts/claude-md-budget-ratchet.mjs` and one in
    `test/claude-md-budget-ratchet.test.ts` at every one of the five open PR heads and at main:
    `measuredBytes`, `violations.push`, `evaluateRatchet`, and `measuredBytes` in the test. Main
    reads 0 / 1 / 3 and 4; every head reads exactly 0 / 1 / 3 and 4. No head moves any marker, and
    the non-zero markers being equal is the control that the reader worked — the script's own
    `measuredBytes` count of 0 is the defect itself, identically absent everywhere.

    ── OPERATOR RULING, 2026-08-23: THE Q1 REMEDY IS SUPERSEDED ─────────────────────────────────
    THE FILED DESIGN MOVED THE EQUALITY INTO `evaluateRatchet`. THAT IS WITHDRAWN. Moving it
    relocates the collision rather than removing it: a stored figure pinned to a file's byte length
    reddens on every edit to that file, wherever the comparison is evaluated. `design:` above is
    rewritten to the ruling — derive at check time, drop the stored field — and this note records
    what changed and what it costs.

    THE COLLISION IS MEASURED ON MAIN, AND SHARPER THAN THE RULING'S OWN SUMMARY. Re-measured
    rather than carried: #2536 and #2537 merged 7 minutes 28 seconds apart (23:02:02Z and
    23:09:30Z), not ninety seconds; and main was red for 54.2 minutes, not ~3 hours
    (23:09:29Z → 00:03:40Z). The mechanism is worse than a race. Under the OLD invariant
    (`capBytes === measuredBytes`) main was green on every commit sampled before #2537 — nine of
    them, all reading 62733/62733. #2537, THE COMMIT THAT INTRODUCED THE NEW INVARIANT, INTRODUCED
    IT ALREADY VIOLATED: it recorded `measuredBytes: 62725` while `CLAUDE.md` at that same commit
    measured 62,732, because 62725 is the length the file had BEFORE #2536 grew it seven minutes
    earlier. A capture taken against a tree another PR had already superseded.

    AND THE RED WINDOW WAS NOT IDLE. Four commits landed inside it — #2540, #2541, #2523 and
    finally #2544, which cleared it. Then a THIRD lane spent a strike on the same repair inside
    #2545 (`3d38a009`, 00:40:34Z) — 37 minutes after main was already green — and that repair
    tripped Standing rule 25 and falsified #2545's body file count, escalating as #2548. The
    operator also reports an unpushed `0c57910` racing #2544 on the same fix; that object is not
    present in this repository's store, so it is recorded here as the operator's observation and
    NOT as something this shard verified.

    THE Q1 MEASUREMENTS ARE CARRIED FORWARD BECAUSE THEY REMAIN TRUE AND USEFUL, EVEN THOUGH THE
    REMEDY THEY SUPPORTED IS WITHDRAWN. `baseline.measuredBytes` is already in scope at the exact
    line a comparison would occupy, so the relocation was mechanically free — which is precisely
    why "it is easy" was not a sufficient argument for doing it. `violations.push` appears exactly
    once, at `scripts/claude-md-budget-ratchet.mjs:72`. And the CLI accepts `{"measuredBytes": 1}`
    against the committed 62,732-byte file, which is the behavioural proof that the script never
    reads the field — now the reason the field can simply go, rather than the gap to be closed.

    ⚠ THE ACCEPTANCE CRITERIA AS FILED ENCODE THE SUPERSEDED REMEDY, AND ARE LEFT BYTE-IDENTICAL BY
    THIS RULING. This is recorded rather than repaired because a worker may never edit a task's
    acceptance criteria (Standing rule 15), and the ruling holds `acceptance:` fixed. Under the
    amended design, criteria 1 and 3 cannot be satisfied — both require a DECLARED measured figure
    to be judged, and there is no longer one to declare — and criterion 5, which requires the
    committed baseline to "declare both figures", contradicts the change outright. Criteria 2 and 4
    survive but become vacuous. AN IMPLEMENTER MUST NOT PROCEED ON THESE CRITERIA: the reviewer
    fails closed on unmet criteria, so a build against this record earns a refusal no matter how
    correct the work is. The Architect needs to re-issue `acceptance:` under this design, or this
    task needs re-filing under a fresh id with the ruling's criteria written in from the start.
