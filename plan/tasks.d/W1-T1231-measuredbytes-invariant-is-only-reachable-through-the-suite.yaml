- id: W1-T1231
  title: "THE `measuredBytes` INVARIANT IS ENFORCED ONLY IN THE SUITE, SO A STALE CAPTURE SURFACES AS A RED REQUIRED CHECK WHOSE ONLY REMEDY IS AN INSTRUMENT EDIT — and an instrument edit from inside a `src/` PR trips Standing rule 25 by construction; `evaluateRatchet` already holds both figures and never compares them"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  risk: medium
  rationale: |
    MEASURED 2026-08-23 in a scratch worktree proved equal to `origin/main` at 50353ccd before any
    reading. The suite was NOT run; the ONE declared test file and the ratchet CLI were driven
    directly. Every zero carries a control qualified for its own surface.

    (1) THE INVARIANT IS LIVE AND CORRECT AND THIS TASK DOES NOT PROPOSE REMOVING IT.
    `test/claude-md-budget-ratchet.test.ts:88-93` asserts
    `baseline.measuredBytes === readFileSync(join(REPO_ROOT, "CLAUDE.md")).length` with the message
    "measuredBytes must be the real byte length of the committed CLAUDE.md, not a stale capture".
    `git log -S` on that message returns exactly one commit: `fb6c5485` (#2537), which retired the
    zero-headroom `capBytes === measuredBytes` invariant and REPLACED it. That test runs under the
    `test/**/*.test.ts` glob both `test` and `test:ci` use (package.json), so it runs inside the
    `ci` job, which `ci-gate` lists as required.

    (2) THE SCRIPT NEVER READS THE FIELD, RE-DERIVED FROM BEHAVIOUR RATHER THAN FROM READING THE
    CODE. Driving the real CLI with a baseline of `{"capBytes": 65536, "measuredBytes": 1}` against
    the committed 62,732-byte CLAUDE.md prints `OK` and exits 0. In source, `evaluateRatchet`
    (scripts/claude-md-budget-ratchet.mjs:68-75) carries one condition,
    `actualBytes > baseline.capBytes`; control on that claim: `violations.push` appears exactly
    ONCE in the whole file, at :72, and the file's only other non-zero exits are the unreadable-file
    path (:91) and the print-the-violations path (:109).

    (3) THE COST IS MEASURED, NOT HYPOTHESISED. At `69e04eb1` — a live branch on 2026-08-22 —
    `CLAUDE.md` measured 62,732 bytes while that tree's `measuredBytes` read 62,725, so the test at
    (1) was RED. The only file that could clear it is `scripts/claude-md-budget-baseline.json`, an
    instrument, so the fix-rung repair `3d38a009` had to edit an instrument from inside a `src/` PR:
    it tripped Standing rule 25, falsified #2545's body file count, and escalated as #2548. THE
    REPAIR WAS NECESSARY AND MISPLACED, NOT STALE. That distinction is recorded because an earlier
    reading of this same ground concluded "stale" — it exercised the ratchet SCRIPT three ways and
    never ran the ratchet's TEST, and the script is precisely the half that stopped reading the
    field.

    (4) Q1, THE MECHANICAL HALF: THE EQUALITY CAN MOVE WITH NO NEW INPUT AND NO NEW I/O.
    `evaluateRatchet(actualBytes, baseline)` already receives the measured length of the real file
    AND the whole baseline object, so `baseline.measuredBytes` is already in scope at the exact
    line the comparison would live on. The function is exported and pure — its own header says the
    pure functions are exported "so the falsifier fixture test can exercise the CLI process directly
    ... as well as the measurement/comparison logic in isolation".

    (5) Q1, THE HALF THAT DECIDES WHETHER IT WEAKENS: THE EXISTING GUARD SHAPE MUST NOT BE COPIED.
    `capBytes` is read behind `typeof baseline.capBytes === "number" &&`, and that guard is a
    fail-open. MEASURED, three ways against the real 62,732-byte file: a baseline with NO
    `capBytes` prints `cap unset` and exits 0; a baseline whose `capBytes` is the STRING `"1000"`
    prints `cap 1000 bytes` — a log line ASSERTING a cap — and still exits 0; and the control, a
    numeric `capBytes` of 1000, prints BLOCKED and exits 1 naming the 61,732-byte overage. So the
    two zeros are real fail-opens and not a broken probe. A `measuredBytes` comparison written in
    that same shape would be laundered by a typo.

    (6) AND ABSENCE CANNOT SIMPLY BE MADE FATAL, BECAUSE THE CLI'S OWN FIXTURES DECLARE NO MEASURED
    FIGURE. All three fixture baselines under `test/fixtures/claude-md-budget-ratchet/` carry
    `capBytes` and nothing else — `at-cap-baseline.json` is `{"capBytes": 172}`,
    `over-cap-baseline.json` is `{"capBytes": 165}`, and `no-cap-baseline.json` declares neither.
    A fail-closed-on-absence rule inside `evaluateRatchet` would redden the three CLI tests that
    drive them, one of which (`:52`) exists precisely to pin that a baseline with no `capBytes`
    produces "no crash, no false block". Absence and staleness are therefore different states and
    the remedy must treat them differently.

    (7) Q3, ANSWERED AND FAVOURABLE: THE MOVE CANNOT REQUIRE TOUCHING `src/lib/ci-parity.ts`.
    Word-bounded, `claude-md` reads 0 in that file; controls on the same file, `learnings-budget`
    reads 4, `coverage` reads 70, and it holds 21 `runStep` entries — so the file does name scripts
    and the zero discriminates. `ci.yml`'s own comment states why: `CI_PARITY_TABLE` is asserted
    against `ci.yml` BY JOB NAME in both directions (`test/preflight-ci-parity.test.ts`, via
    `parseCiJobNames`) and NOTHING asserts a job's step list, which is why the ratchet rides as a
    step of `learnings-budget-ratchet` (`ci.yml:425`, step at :488) rather than as a job. This task
    adds no job and no step and changes no workflow — it changes a script's internals and its test
    — so the pairing that comment guards against cannot arise. The fidelity gap it accepts
    (`rmd preflight --ci-parity` does not mirror the step) is left exactly as it is.

    (8) THE ARGUMENT IS REACHABILITY. In the script, a stale capture is the ratchet's own named
    verdict, visible to any lane that runs `npm run claude-md-budget-ratchet` before a PR exists.
    In the suite, it is a red required check discovered after a PR is open, whose only remedy is an
    instrument edit — the exact trap W1-T1227 (#2550) files as a class. W1-T1227 owns the rung-side
    half (the rung is never told the PR's declared scope); this task removes one of the standing
    reasons a repair must reach for an instrument at all. Neither W1-T1227 nor W1-T297 (Standing
    rule 25) is re-filed here.
  design: |
    ONE CONCERN, RESTATED UNDER THE OPERATOR'S RULING OF 2026-08-23: STOP STORING A FIGURE THAT IS
    PINNED TO A MOVING FILE. The remedy this shard was filed with — move the equality into
    `evaluateRatchet` — is SUPERSEDED. It relocates the collision instead of removing it: wherever
    the comparison lives, a stored figure pinned to a file's byte length reddens on every edit to
    that file, so any two PRs touching `CLAUDE.md` collide by construction and any two lanes that
    notice will both write the same repair.

    (i) DERIVE AT CHECK TIME AND DROP THE STORED FIGURE. `evaluateRatchet` already receives the
    real length as `actualBytes`, measured from the file on this run, so the honest comparison is
    the one it already makes: `actualBytes > baseline.capBytes`. `measuredBytes` is REMOVED from
    `scripts/claude-md-budget-baseline.json` and from every reader of it, so nothing pins a stored
    number to a file that legitimately changes.

    (ii) `capBytes` STAYS DECLARED AND STAYS FALSIFIABLE, AND THAT IS THE WHOLE POINT. It is
    compared against a FRESHLY MEASURED file on every run, which is exactly the property #2537's
    own comment says the replacement exists to protect: the cap stays "the DECLARED round boundary
    rather than drifting upward silently", and a raise still has to change a constant deliberately
    and say why. Nothing about the ceiling, its value, or its fail-closed behaviour moves.

    (iii) WHAT IS GIVEN UP, SAID RATHER THAN GLOSSED. Nothing will record the file's size at the
    moment the cap was last moved. That figure has a real use — it is the evidence a later reader
    needs to judge whether a proposed raise is proportionate — and after this change it exists
    nowhere a gate can read. If it is wanted, it belongs in `bumpRationale` AS PROSE, beside the
    dated reason already recorded there, where it is a record and not an invariant and cannot
    redden anything.

    (iv) THE TEST ASSERTS THE CAP STILL BLOCKS AGAINST A FRESHLY MEASURED FILE, WITH ITS NEGATIVE
    CONTROL. The prove-it-still-blocks shape is unchanged in kind, only in subject: a file over the
    declared cap blocks and names the overage in bytes; the same file under it exits clean; and a
    baseline carrying a stale or absent measured figure changes NO verdict, which is the assertion
    that pins the field's removal rather than merely deleting a line. The direct
    `measuredBytes === readFileSync(CLAUDE.md).length` assertion goes with the field it guards —
    not because the invariant was wrong, but because there is no longer a stored value that could
    drift out of agreement with anything.

    (v) NOT IN SCOPE, NAMED. The cap's VALUE, an operator decision on the record. `capBytes`' own
    string-guard fail-open (rationale (5)) — a real defect, measured here, deliberately not fixed
    by this task. `src/lib/ci-parity.ts` (rationale (7)): this still adds no job and no step.
    And W1-T1227's rung-side remedy, which is a different lane's work.
