    - claim: "the same baseline corrected to the file's real length exits clean"
      proof: "unit test: test/claude-md-budget-ratchet.test.ts"
    - claim: "a declared measured figure that is not a number blocks rather than being silently skipped"
      proof: "unit test: test/claude-md-budget-ratchet.test.ts"
    - claim: "a baseline that declares no measured figure still neither crashes nor false-blocks"
      proof: "unit test: test/claude-md-budget-ratchet.test.ts"
    - claim: "the committed baseline is still required to declare both figures and a dated written reason"
      proof: "unit test: test/claude-md-budget-ratchet.test.ts"
