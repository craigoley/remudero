  title: "THE COST TRIPWIRE FIRES ON ORDINARY VARIANCE, NOT RUNAWAYS — `costAnomaly.multiplier: 3` flags 5.1% of settled implement runs (537 `cost.anomaly` rows retained) against a policy comment that names ~10x as the INCIDENT signature and admits its own 3 was chosen 'without inventing a number this fleet has not yet ledgered enough class-scoped runs to measure directly'; those runs now exist"
