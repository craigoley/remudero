    - claim: "the committed value satisfies the row's own declared min and max, or the bound is moved in the same change with a stated reason"
      proof: "unit test: test/a-cost-tripwire-fires-on-runaways-not-ordinary-variance.test.ts"
    - claim: "minSamples is unchanged, so the thin-class rule is not altered by a threshold edit"
      proof: "unit test: test/a-cost-tripwire-fires-on-runaways-not-ordinary-variance.test.ts"
    - claim: "the policy still loads and still refuses a multiplier outside its committed bound"
      proof: "unit test: test/a-cost-tripwire-fires-on-runaways-not-ordinary-variance.test.ts"
  falsifier: |
    CLOSE THIS TASK if the current threshold already discriminates runaways: MEASURED 2026-09-08,
    multiplier 3 flags 33 of 647 settled implement runs (5.1%) and the corpus retains 537
    `cost.anomaly` rows at a p50 flagged cost of $16.37 against a $4.23 median. CLOSE IT ALSO if
    the row was ever set from class-scoped data: its own comment says the opposite in as many words.
    PROVE IT LOAD-BEARING: hold the fixture distribution fixed and re-run at the old value — the
    first criterion's flag count must differ, or the edit moved nothing.
  note: |
