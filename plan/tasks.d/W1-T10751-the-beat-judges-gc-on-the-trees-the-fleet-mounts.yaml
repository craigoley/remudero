  falsifier: |
    - Point the probe back at `${INSTALL_DIR}/.git`: the mounted-tree case must fail.
    - Join `<state_dir>/remudero` from the registry instead of reading the mounts: the
      mounted-tree case must fail, because the stub's Source differs from the literal path.
    - Drop the previous-beat comparison, so any marker is UNHEALTHY at once: the first-seen half of
      the persistence case must fail.
    - Ignore mtime, so any marker present twice is UNHEALTHY: the live-writer half must fail.
    - Add any fixed loose-size limit: the growth-alone half of the trend case must fail.
    - Map an unreadable tree to ok: the unreadable case must fail.
    - Put the gc arm inside the liveness `elif` chain, or drop it: the watcher case must fail.
    GUARDS that held at base and must still hold:
    - the beat never runs gc, prune or any object-writing git command, and never removes a file in
      a judged tree (W1-T2529's suite);
    - `gc_disabled_reason` is git's own first line;
    - every existing liveness arm still classifies as before (test/fleet-heartbeat.test.ts).
    Each guard's existing case must fail when its production branch is removed, and pass again with
    zero failures once it is restored.
