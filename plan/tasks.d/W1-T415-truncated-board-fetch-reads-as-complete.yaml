  title: "a TRUNCATED board fetch presents as a COMPLETE short list — `fetchBoardPrsRest` returns `truncated`, `buildBatchedGithub` logs it into `board_gateway.fetch_bytes` and then returns the rows anyway with `lastFetchFailed` still false, so every consumer reads a partial view as the whole repo"
