  rationale: |
    independentFigures is async, but reader-agreement.ts:212 selects readLedgerUnionRawLinesSync
    and its readRows helper executes that windowed union synchronously for figure steps, halted
    task rows, and queued-task projection rows. runSweep awaits checkReaderAgreement in its full
    prelude, so that work still occupies the daemon loop. The final handoff reports about 13 s in
    one CPU-profile window; that duration is historical evidence, not a new measurement here.
    W1-T9981 filters rows before parsing and preserves independent reducers. W1-T6246 moves only
    the independent GitHub/plan projection off-loop. Neither changes this remaining raw union
    read. readLedgerUnionRawLinesAsync already uses libuv reads/decompression and yields between
    slices under the existing LEDGER_ROTATION_LOAD_LINES_PER_TURN policy.
    MEASURED 2026-11-17 (operator session, core daemon.loop_lag rows): checkReaderAgreement was the
    first named frame in 28 loop-stall rows holding 892 s of lag that day, 66 s in one row after the
    16:06Z deploy. The cause is readLedgerUnionRawLinesSync, selected at reader-agreement.ts:212.
  design: |
    On origin/main 673c28bbee independentFigures (reader-agreement.ts:211) selects
    readLedgerUnionRawLinesSync at :212, and readRows (:215) runs it for the three independent
    corpus reads: the figure steps, the halted tasks' rows, and the queued-task projection rows.
    Move that default to the existing async raw-union reader (readLedgerUnionRawLinesAsync in
    src/lib/ledger-union.ts), awaiting each dependent reduction.
    Accept existing synchronous injected corpus fixtures as well as promises; retain every window,
    minRotations, keep filter, order, replay dedupe, incomplete/unreadable behavior and scan count.
    Keep the board and independent corpora and reducers separate; never copy board results into
    the independent figure. Do not change figures, disagreement decisions, cadence or bounds.
    The board's own read (boardFigures through readLedgerUnionBounded) is not in this task.
    Prove a timer can run while an independent corpus read remains pending, then prove the caller
    awaits that read before publishing figures. Also exercise the real default on a temporary
    live-plus-gzip state directory, compare complete figures with the old sync fixture corpus,
    and cover unreadable archives, malformed rows, halted-task and queued-plan branches. No
    network, worker/model spend, loop-time threshold, extra reader store or new fixed constant.
    INVARIANT same-figures: on the same corpus the async default and the synchronous reader give the same figures, lines scanned, rows kept and refusals (incomplete corpus, malformed row).
