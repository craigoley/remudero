- id: W1-T2552
  title: "THE GIT CREDENTIAL HELPER IS INSTALLED ONLY WHEN THE BOOT ENV ALREADY CARRIES A TOKEN, AND SINCE W1-T2311 IT NEVER DOES — deploy/entrypoint.sh gates the install on a non-empty GH_TOKEN at boot, W1-T2311 deliberately boots with it empty under App auth, so no helper is ever written; the daemon then mints a valid installation token into its own process.env, every git child inherits it, and git ignores it because nothing declared it a credential — every ref-CAS write dies could not read Username while reads keep working, because this repo is public"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 20.00
  files: [deploy/entrypoint.sh, src/lib/dispatch-claim.ts, src/run-task.ts, test/dispatch-claim-names-its-cause.test.ts]
  origin: "operator-brief#app-auth-dispatch-claim-refuses-2026-08-30"
  plan_refs: ["W1-T2311", "W1-T1268", "W1-T509", "W1-T1132"]
  status: queued
  attempts: 0
  rationale: |
    ── WHAT WAS MEASURED, NOT INFERRED ──────────────────────────────────────────────────────────

    The fleet moved to GitHub App auth. Reads worked — github_app.token_refreshed present,
    board_gateway.fetch_ok climbing, zero auth errors — and every dispatch refused with
    "cannot reach origin to claim refs/rmd-dispatch/<taskId>".

    THREE CANDIDATES WERE PUT TO A SINGLE DISCRIMINATING PROBE: (a) the env is not reaching the git
    child, (b) App tokens cannot write outside refs/heads, (c) a permissions gap. A token minted by
    the repo's OWN refreshInstallationToken pushed an existing sha to BOTH refs/heads/<probe> and
    refs/rmd-dispatch/<probe>, each exit 0, each deleted on success. THAT KILLS (b) AND (c)
    TOGETHER: the App can write a custom ref namespace and its Contents permission is sufficient.

    ⚠ THEN THE LEADING HYPOTHESIS WAS KILLED TOO, AND THIS RECORD KEEPS IT KILLED. The suspicion was
    that mintAnchor returns an empty anchor, making attempt() push ":refs/rmd-dispatch/<id>" — a
    DELETE of a nonexistent ref, which would classify as unreachable. Reproducing mintAnchor and
    attempt VERBATIM against the production repoDir printed every step:

      hash-object -t tree /dev/null   status=0  stdout=4b825dc642cb6eb9a060e54bf8d69288fbee4904
      commit-tree <tree> -m <msg>     status=0  stdout=6b864cf8f83f2529ec5ed3135f7dfb915fcdd66e
      push origin <anchor>:<ref>      status=128
        stderr: fatal: could not read Username for https github com : No such device or address

    The anchor is a real sha. The refspec is well-formed. THE CAUSE IS THE STDERR, AND NOBODY HAD
    SEEN IT BECAUSE THE GATE DISCARDED IT.

    ── THE ROOT CAUSE, BY SYMBOL ────────────────────────────────────────────────────────────────

    deploy/entrypoint.sh installs git's credential helper inside `if [ -n "${GH_TOKEN:-}" ]`. The
    helper's entire design is that it reads $GH_TOKEN AT CALL TIME — it is written with the
    variable UNEXPANDED precisely so a rotation needs no rewrite — so whether the variable holds
    anything AT BOOT says nothing about whether it will when git runs. W1-T2311 then made the boot
    env carry an EMPTY GH_TOKEN on purpose, to stop a stale personal token being re-booted as the
    fleet's default. Those two decisions are individually correct and jointly fatal: the gate is
    false on every boot, so the helper is never written at all.

    CONFIRMED IN THE LIVE CONTAINER, not only in source: `git config --global --get
    credential.helper` reads ABSENT, `--local` reads ABSENT, and a fresh shell's GH_TOKEN is length
    0. refreshInstallationToken (src/lib/github-app.ts) mutates process.env.GH_TOKEN in the daemon
    process; dispatchClaimReserverFor (src/run-task.ts) spawns git with no `env` option so the child
    inherits it — the token really is present in the child. Git simply had never been told that
    variable is a credential, so it fell through to prompting and died.

    ⚠ AND THE SPLIT THAT MADE THIS READ AS A PERMISSIONS PROBLEM FOR AN HOUR IS EXPLAINED, NOT
    HAND-WAVED: this repository is PUBLIC. An anonymous `git ls-remote` against it exits 0. So every
    git READ kept working with no credential of any kind, while every WRITE needed one and had none.
    Reads-fine-writes-dead looks exactly like a scope problem and is not one.

    ── THE TWO CHANGES ──────────────────────────────────────────────────────────────────────────

    (1) THE HELPER IS INSTALLED UNCONDITIONALLY. Installing it against an empty GH_TOKEN is safe and
    is the point: it answers with an empty password, which is what an unauthenticated push would
    have done anyway, and the moment the App token lands in the environment the SAME helper starts
    answering with it. Nothing reaches disk but the helper script, which holds $GH_TOKEN unexpanded.
    The boot log now distinguishes "installed" from "the variable is empty at boot", which under App
    auth is expected rather than a warning.

    (2) THE REFUSAL CARRIES GIT'S OWN STDERR. classifyPushFailure (src/lib/task-id-reservation.ts)
    collapses auth, DNS, proxy and timeout into the single word "unreachable" — deliberately, and
    that stays — but decideDispatchClaim then rendered only the category and threw the message away.
    gitDispatchClaimReserver now holds the failing attempt's stderr in a closure, clears it on the
    next success so it can never describe an older attempt than the outcome beside it, and exposes
    it through an OPTIONAL lastAttemptStderr() so every existing fake satisfies the interface
    unchanged. A gate that says "cannot reach origin" while holding the sentence that says why is
    what turned a one-line diagnosis into an hour of bisection.

    ⚠ WHAT IS DELIBERATELY NOT DONE HERE. classifyPushFailure's collapse is not widened — the
    outcome vocabulary is load-bearing for the contention arm and a second classification is a
    second thing to drift. auto-triage.ts's sibling refusal carries the identical shape and is NOT
    touched: one concern per PR, and it is named here so the next reader finds it rather than
    rediscovering it.

    ── ⚠ THE FIX DOES NOT SHIP ON MERGE, AND THAT MUST BE SAID PLAINLY ─────────────────────────

    deploy/entrypoint.sh is IMAGE-BAKED (COPY into /usr/local/bin/rmd-entrypoint), not mount-read.
    Per CLAUDE.md's own mount-versus-image table it sits inert in a merged, green commit until an
    operator triggers .github/workflows/acr-build.yml and the new image is deployed. There is no
    mount-side path today: a tree-wide sweep for credential.helper / GIT_ASKPASS across src/ returns
    ZERO, so this one line in the entrypoint is the ONLY place git credentials are wired at all.

    THE IMMEDIATE UNBLOCK IS AN OPERATOR ACTION, NOT A CODE CHANGE, and it is deliberately not taken
    unilaterally here because it mutates live container state that diverges from the image.

  acceptance:
