      proof: "unit test: test/dispatch-claim-names-its-cause.test.ts"
    - claim: "the reserver clears a recorded cause on the next success so a refusal cannot cite an older attempt"
      proof: "unit test: test/dispatch-claim-names-its-cause.test.ts"
    - claim: "a reserver that omits the optional stderr seam still yields the previous wording unchanged"
      proof: "unit test: test/dispatch-claim-names-its-cause.test.ts"
    - claim: "the entrypoint installs the credential helper without gating it on a non-empty boot token"
      proof: "unit test: test/dispatch-claim-names-its-cause.test.ts"
