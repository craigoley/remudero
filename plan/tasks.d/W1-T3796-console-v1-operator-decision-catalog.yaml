- id: W1-T3796
  title: "OPERATOR STYLE NEEDS DECISION EVENTS — expose approval and hold outcomes by task class without treating auto-arming as human approval"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 65.00
