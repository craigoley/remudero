  plan_refs: ["§7", "§7B"]
  files: [src/lib/operator-agent-decisions.ts, test/operator-agent-decisions.test.ts]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED at origin/main 948173f3: panel-actions.ts:407-434 writes panel.manual_approved for
    explicit operator check-offs, while run-task.ts:15200 and arm-auto-merge.ts:907-917 write
    automerge arm/direct-merge events. Those are different actors and decisions. The operator agent
    currently lists approval-patterns as unsupported because no cross-repository projection joins
    the explicit decision rows to task class.
    A proposal such as "always merge chores" is unsafe if it counts daemon auto-arming as operator
    approval. The projection must name the event source and preserve unknown task classes.
  design: |
    Build a pure, read-only, bounded decision-event adapter over supplied ledger rows. Count explicit
    panel/inbox approval, rejection or hold events separately from automatic arm/merge events, join
    only where task identity and task class are present, and report incomplete joins as unmeasured.
    W1-T3794 owns HTTP projection composition; this task owns no route or panel write changes. The
    console agent may use explicit operator decisions for preference learning; it must not use
    automatic merges as a proxy for human approval.
  acceptance:
    - claim: "explicit operator decisions and automatic merge events are separate projection populations"
      proof: "grep: W1-T3796 criterion 1 in test/operator-agent-decisions.test.ts"
    - claim: "approval rates carry a denominator and refuse a rate when task class or actor identity is missing"
      proof: "grep: W1-T3796 criterion 2 in test/operator-agent-decisions.test.ts"
    - claim: "the projection preserves task-class identity for accepted and rejected decisions"
      proof: "grep: W1-T3796 criterion 3 in test/operator-agent-decisions.test.ts"
