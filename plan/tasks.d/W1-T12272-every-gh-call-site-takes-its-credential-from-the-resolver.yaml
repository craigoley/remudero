  rationale: |
    W1-T11926 (merged) made one resolver choose the GitHub credential of each gh spawn: a reference for the repository, then one for remudero, then the ambient token, then the stored login of gh. It names every source it tried when none answers.
    FOUND 2026-11-10 in the review of that change, READ again at origin/main 0953736f0: three call sites spawn gh without it.
    - src/lib/gh-read-broker.ts:1382, `runGhDirect`: `spawn("gh", args, { stdio: "inherit" })`. This is the direct path of `rmd gh`.
    - src/lib/pr-state.ts:119, `brokerRead`: its direct read calls `execFileRouted("gh", ...)` with the environment of the caller.
    - scripts/open-pr-body-proof-precheck.mjs:117, `readOpenPrBody`: `spawnSync("gh", ["api", ...])`. The pre-push hook runs it.
    And two entry points install no missing-credential sink, so a missing credential there writes no row: src/spike.ts and scripts/merge-queue-canary.mjs.
    The resolver is `resolveGithubCredential` (src/lib/github-credential.ts:266). The sink is `installGithubCredentialMissingSink` (line 232). src/run-task.ts installs it for the commands.
    CHECKED for overlap: no queued task names these sites. W1-T11789 (queued) changes when the broker in src/lib/gh-read-broker.ts binds its socket. It does not change `runGhDirect`. The two tasks share that file and one test file, so they must not be built at the same time.
  design: |
    - At each of the three sites, build the environment of the spawn with the function that the other gh spawns use (src/lib/github-transport.ts imports the resolver). Do not write a second resolver.
    - A script under `scripts/` that cannot import the TypeScript module takes the credential through a small command of the CLI, or runs under the same loader as the other scripts that import `src/`. Choose the one that the pre-push hook can afford: it has a 20-second read today.
    - Install the sink in the two entry points, with the same row as src/run-task.ts.
    The two listed tests cover `rmd gh` and the pre-push precheck. Change an assertion only where it pins the bare environment.
    NOT IN SCOPE: the order of the sources, the broker, and gh spawns that already use the resolver.
  falsifier: |
    Spawn with the bare process environment at one site and its criterion (1, 2 or 3) must fail. Start gh when no credential was found and criterion 4 must fail. Remove a sink and criterion 5 must fail. Restore and require all five to pass.
