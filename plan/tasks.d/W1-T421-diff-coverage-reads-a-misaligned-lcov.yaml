  note: "verify:auto — every deliverable is decidable in-process, with no network and no operator.
    The one live measurement clause (i) needed is a full-suite coverage run, which is a local command.
    RULE 19, AND THE BAND IS SPAN AS WELL AS BLAST RADIUS. The four declared paths resolve to four
    module ids (moduleIdFromPath folds a `.test` suffix away): mutant-module, changeset-shorthand-anchor,
    trailer-credit-plan-only, architecture-fitness. `subsystemsOf` therefore sees four subsystems and
    risk:medium would be a sizing violation — risk:high is set deliberately, and it is BOTH: the span
    above, and the blast radius of a change that decides what a required merge gate is allowed to see.
    The span is not decomposable here. The helper and its two call sites are one edit — a helper
    landed without them changes nothing, and a call site changed without the helper is the very
    duplication that let this defect exist in two places. The fleet-wide guard belongs with them
    because a fix that does not refuse the next instance is a fix with a half-life.
    RULE 25 IS NOW MOOT RATHER THAN ANSWERED. The original filing declared scripts/diff-coverage.mjs,
    an INSTRUMENT_SURFACE entry, and design (v) reasoned about entanglement on that basis. The
    measurement moved the fix entirely into test/, so no instrument path is touched at all and
    `detectInstrumentEntanglement` has nothing to fire on. Design (v)'s split condition — a fix
    needing a src/ change — did not occur: no src/ file is modified.
    FILES: the declared set IS the changeset. test/helpers/mutant-module.ts is the one construction,
    the two suites are its only callers, and test/architecture-fitness.test.ts is the repo's existing
    home for fleet-wide anti-pattern guards (it already carries the Playwright teardown-race guard in
    the same shape). scripts/diff-coverage.mjs and test/diff-coverage.test.ts were DECLARED AT FILING
    and are deliberately no longer declared, because the measurement exonerated the gate.
    ON DIFF-COVERAGE FOR THIS PR, STATED RATHER THAN CLAIMED: every changed path is under test/, which
    ci.yml excludes from coverage instrumentation (`--test-coverage-exclude=\"test/**\"`). The gate
    therefore has no added instrumented line to judge — a vacuous pass, said out loud, not a result.
    ON THE PROOFS: two `grep:` with explicit paths and two `unit test:` naming bare titles that exist.
    Both grep patterns are absent from the merge base — `define:import.meta` and `writeMutantModule`
    each appear nowhere in src/, test/ or scripts/ before this change — so neither can be downgraded
    to executed_stale. The proofs were re-written when the measurement re-scoped the task; the four
    names the original note called BINDING (MISALIGNMENT SOURCE, lcovLineAlignmentAnomalies,
    SCOPED_AGREEMENT, STILL_BLOCKS_UNCOVERED) all named tokens inside scripts/diff-coverage.mjs, a
    file this task must not touch, and are withdrawn with the theory that produced them."
