  note: "verify:auto — every deliverable is decidable over fixture lcov documents and fixture diffs,
    in-process, with no network and no operator. The one live measurement clause (i) needs is a
    full-suite coverage run, which is a local command.
    RULE 19: both declared paths resolve to the module id `diff-coverage` (moduleIdFromPath folds a
    `.test` suffix away), so `subsystemsOf` sees ONE subsystem and there is no sizing violation.
    risk:high is BLAST RADIUS, NOT SPAN, and that distinction is the point: this changes a REQUIRED
    merge gate, and a version that mis-corrects it lets untested code through every future PR while
    looking greener than before. Design (vi)'s second arm is where that risk is managed.
    RULE 25 CHECKED BEFORE FILING and answered in design (v) rather than left as a hazard:
    scripts/diff-coverage.mjs IS an INSTRUMENT_SURFACE entry, but the entanglement predicate needs a
    PRODUCT path too and `isProductPath` excludes `test/` by design. Instrument + its own test does
    not entangle, so one changeset holds this.
    FILES: CAN CONTAIN THE DESIGN. The mapping from diff hunks to `DA:` records lives in
    scripts/diff-coverage.mjs, and test/diff-coverage.test.ts already exists as that instrument's
    fixture home — the file W1-T212 shipped for precisely this purpose. `.github/workflows/ci.yml`
    is named in design (i)/(v) as a CANDIDATE and deliberately NOT declared: if the measurement
    lands there, that is a re-scope with evidence rather than a path quietly held in reserve.
    budget_usd 80 — the cost is clause (i)'s layer measurement and clause (ii)'s sweep, either of
    which can change the task. The mapping fix itself is likely small.
    ON THE PROOFS: all four are `grep:` with an explicit path into scripts/diff-coverage.mjs, which
    EXISTS — so each returns a clean no-match today rather than the `exec_error` a grep at a
    not-yet-existing path produces, which a session measured on 2026-08-10 and which is why no proof
    here points at a file that does not exist. Each names a string absent from src/, test/ and
    scripts/ at filing, so none can match the merge base and be downgraded to executed_stale, and
    none names an existing symbol. The four names are BINDING on the implementer rather than a
    guess: MISALIGNMENT SOURCE for the named layer, lcovLineAlignmentAnomalies for the sweep,
    SCOPED_AGREEMENT for the discriminator in design (iii), STILL_BLOCKS_UNCOVERED for the
    enforcement arm in design (vi)."
