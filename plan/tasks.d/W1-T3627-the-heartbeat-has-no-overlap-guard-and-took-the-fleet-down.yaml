  rationale: |
    MEASURED, ON A FLEET THAT WAS DOWN FOR 75 MINUTES.

    The Azure host stopped answering at 22:20:49Z on 2026-09-15 (its last heartbeat). It was not
    paused, not stale and not OOM-killed. It was THRASHING: SSH could not complete a banner
    exchange, and the Azure guest agent could not run a script. Azure's own metric series, read
    off-host:

        21:45-22:00   ~7-8 GiB available
        22:05          4.10 GiB
        22:30          1.20 GiB
        22:35-23:35    ~0.90 GiB, FLAT for an hour

    ZERO OOM KILLS in dmesg. The kernel never reclaimed; it paged forever against 4 GiB of swap.

    THE PROCESS TABLE, captured in a brief SSH window before the reboot landed:

        71 node    66 git    63 socat    56 zgrep    29 esbuild    22 bwrap    81 bash
        load average 191 / 216 / 221 on 8 cores
        two `npm ci` at 527MB and 385MB RSS, ELAPSED 4846s and 4295s

    56 CONCURRENT zgrep IS THE TELL, AND IT NAMES ITS OWN CAUSE. `scripts/fleet-heartbeat.sh` is
    the only zgrep caller in the tree. It runs two zgreps over LEDGER_UNION_GLOB -- on this host
    359 files and 271 MB -- and the crontab is:

        */5 * * * * ... scripts/fleet-heartbeat.sh >/dev/null 2>&1

    No flock. No lock file. Nothing in the script either. MEASURED on an idle box, one scan is
    7.2s, which at a 5-minute cadence is a 2.4% duty cycle and entirely fine.

    THE FEEDBACK LOOP IS THE DEFECT, NOT THE SCAN COST. Once anything slows the box, a scan
    stretches past 5 minutes; cron fires regardless; two concurrent scans are slower than one, so
    the next one overlaps too. 56 zgreps is roughly 28 instances alive at once -- cron kept firing
    for about 2.3 hours while not one of them finished. That is why available memory went FLAT
    rather than sawtoothing: nothing ever completed and released.

    WHAT IT IS NOT, SO THE WRONG FIX IS NOT SHIPPED.
      NOT a 16 GiB problem. A 32 GiB host takes longer to fill and dies the same way; resizing buys
      time and fixes nothing. The operator pushed back on resizing and was right to.
      NOT worker over-dispatch. The deduped ledger shows THREE dispatched runs in the whole
      20:00-23:59 window, all ended cleanly, the last at 20:24:30 -- 1.5 hours BEFORE the collapse.
      NOT 22 concurrent workers. `bwrap`+`socat` are Claude Code's own Bash sandbox, so those are
      sandboxed tool calls inside a few workers, not workers.
      NOT the existing reaper's job. `rmd-reap-stray.timer` reaps stray CONTAINERS hourly; it has
      no view of a process inside one.

    A RAW CROSS-ARCHIVE LEDGER COUNT WOULD HAVE MISLED, and nearly did. Reading the union glob
    without deduping returned 51 `run.start` rows for this window because live and rotated files
    overlap; the same row appeared 14 times with an identical timestamp and run id. Deduping on
    (ts, step, run_id) gives the true answer, 3.

  acceptance:
    - claim: "a second heartbeat invocation refuses while one is already running, so a slow scan skips a beat instead of stacking"
      proof: "unit test: a second heartbeat run refuses while the first still holds the lock"
    - claim: "the guard lives in the script, not in the crontab, so it survives a host re-provision and protects every invocation however it is scheduled"
      proof: "grep: flock in scripts/fleet-heartbeat.sh"
    - claim: "the lock is an fd lock the kernel drops when the holder exits, so a lock file left on disk never wedges a later beat and no stale-lock recovery is needed"
      proof: "unit test: a heartbeat lock file left by an ended run does not block the next beat"
