    RULE 19 / #588 MERITS TEST, RUN AFTER lint-plan FLAGGED THIS TASK (sizing, block). The linter
    counted TWO subsystems — `project-init` and `project-init-dotnet` — because `subsystemsOf` keys
    on a path's module stem and folds `test/<x>.test.ts` into `<x>` (task-linter.test.ts:55-58).
    The second stem was NOT a second subsystem: it was a new test file I named after the PROFILE
    instead of after the MODULE under test, so `test/project-init-dotnet.test.ts` minted a phantom
    module id for a task whose only product file is src/lib/project-init.ts. Fixed at the root by
    putting the assertions in the generator's own test file; files: is now one module + its
    co-located test, the 1-subsystem shape W1-T92 ACCEPTANCE 1 pins (task-linter.test.ts:92-100).
    NEITHER PRESCRIBED BRANCH WAS TAKEN, AND WHY. Decompose: impossible and dishonest here — both
    defects are edits to the SAME file (:111 and :409-413), so 'one task per subsystem' would have
    to split one file's diff across two PRs with a depends_on spine invented to sequence them, and
    the second task would own no product file at all. Raise to risk:high: that would launder a test
    filename into a risk signal and contradict this note's own sizing argument; the change did not
    get riskier because I renamed a test. The honest move was to delete the false boundary.
    risk:medium — ONE module by Rule 19's count, and it is generator output rather than a dispatch or
    spend path. It argues UP because the output is inherited by every repo onboarded afterward and a
    broken generated ci.yml is discovered on someone else's repo, and DOWN because nothing already
    onboarded is touched by this change; medium is the honest middle.
    budget_usd 60 — the pin is a constant swap; the cost is (B)'s aggregator interaction and its fixture.
    NOT A REGRESSION OF THE :106-110 REASONING — that comment is right that an INVENTED pin is worse than
    an honest gap. This task resolves the tag from upstream instead of inventing, which is the option the
    comment did not take.
