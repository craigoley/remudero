  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 60.00
  rationale: "From a read-only comparison with nanocoai/nanoclaw, whose scripts/skill-conformance.test.ts discovers every skill and enforces invariants with no per-skill test file. RE-VERIFIED at current main: two skills carry applies-to: (proof-preflight, ci-state-forensics, both applies-to: implement), each with its own hand-written test (test/a-proof-preflight-skill-is-selectable-and-bounded.test.ts, test/a-ci-state-forensics-skill-is-selectable-and-bounded.test.ts). A third skill gets no test unless its author writes one. LINE DRIFT since the entry was read at efd226b50: TASK_TYPES is now src/lib/plan.ts:124 (not 105) and scanSkillDraft is src/lib/skill-workshop.ts:308 (not 307); DEFAULT_KNOWLEDGE_BUDGET_CHARS is still src/lib/learnings.ts:49 (8148); observeSkillSelection is skill-workshop.ts:712. NOTE: no skill carries when-paths: today, so the glob check is vacuous on the live tree and is proven by the fixture."
  design: |-
    Name the census test "every applies-to skill satisfies the discovery invariants" and the fixture test
    "discovery rejects malformed applies-to and dead when-paths by skill name".
    ADD test/rules/every-applies-to-skill-is-selectable-and-bounded.test.ts. It globs .claude/skills/*/SKILL.md, keeps
    those whose frontmatter has applies-to:, and per skill asserts: (1) applies-to is a TASK_TYPES member;
    (2) every when-paths glob matches at least one tracked file (skip cleanly when absent); (3) the skill body alone
    fits DEFAULT_KNOWLEDGE_BUDGET_CHARS; (4) observeSkillSelection selects it for a matching task type and excludes
    it for every other TASK_TYPES member; (5) it passes scanSkillDraft's allowlist. Failure messages NAME the skill.
    FALSIFIER FIXTURES: the check logic is a function taking a skill directory, and the test runs it against fixture
    skills with applies-to: implemnt and with a when-paths glob matching nothing, asserting each fails naming the skill.
    Retain the two existing hand-written tests unchanged; add only the discovery test and its required census catalog registration in src/lib/rule-suites.ts. The suite remains in normal rule checks and full CI. Register the suite in PRECHECK_PATH_TRIGGERED_SUITES in scripts/census-precheck.mjs so the existing real child executor asks it on every nonempty diff and PRECHECK_PARITY records that route; any tracked-file change can alter a when-paths witness. Update only the existing parity fixtures in test/every-ci-census-is-asked-before-the-push.test.ts to require this named skill census alongside their original structural/birth-gate assertions, and prove empty diffs start no child. Align only the unchanged-import fixture in test/a-suite-that-walks-an-import-closure-joins-its-diffs.test.ts to require the named always-on skill census while retaining its exact no-baked-closure-read assertions. Do not grow the CI-only baseline or change limits.
    Do not change selection or scan behaviour."
     Align the six coupled existing census fixtures to assert the mandatory skill census separately while preserving their original population, error, real-child and runtime-policy checks. Fixture compatibility only; no production logic, limit, baseline or exclusion changes.
