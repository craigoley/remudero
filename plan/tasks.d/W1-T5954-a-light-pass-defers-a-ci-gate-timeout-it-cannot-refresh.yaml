- id: W1-T5954
  title: "A LIGHT PASS DEFERS A CI-GATE TIMEOUT IT CANNOT REFRESH — when fixRungAllowed is true (any idle fleet) lightPassActionable admits blocked-fixable, but buildSweepLightHook wires updateBranch: undefined, so W1-T5921's applyCiTimeoutRefresh escalates 'update-branch is not wired' and every later full pass reads 'already escalated at this head'; the PR never gets the new head the lane exists to give it"
  repo: remudero
  depends_on: [W1-T5921]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: high  # Rule 19: one concern — the ci-timeout lane on a surface without updateBranch; it spends escalations
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: W1-T5941 queue-safety proof (the gate before re-enabling the merge queue) failed sequences (c) and (d) on main"
  plan_refs: [W1-T5921, W1-T5922, W1-T5941]
  files: [src/lib/sweep.ts, test/a-light-pass-defers-a-ci-gate-timeout-it-cannot-refresh.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    FOUND 2026-10-06 by W1-T5941's multi-pass scenario (sequence d). Pass 2 (light) wrote
    sweep.ci_timeout_refresh.escalated (why "update-branch is not wired"); passes 3-4 (full) read
    "already escalated at this head — no requeue or fix strike" and never called update-branch. With
    fixRungAllowed false the light pass stands down and the full pass refreshes the head normally, so the
    lane works; only its behaviour on a surface without updateBranch is wrong. Live on main since
    W1-T5921 merged.
  design: |
    In applyCiTimeoutRefresh, an unwired updateBranch is not a reason to escalate: stand down with
    "deferred to full sweep (update-branch not available on this pass)" and leave the decision to a pass
    that has it. Escalation stays reserved for a real refresh failure or the BACKSTOP. A pass that had
    already escalated only for "not wired" is not treated as escalated.
  acceptance:
    - claim: "a pass without updateBranch defers a ci-gate timeout to a pass that has it instead of escalating, and the next full pass refreshes the head, while a real refresh failure still escalates at the bound"
      proof: "unit test: test/a-light-pass-defers-a-ci-gate-timeout-it-cannot-refresh.test.ts"
  falsifier: |
    Keep escalating on an unwired updateBranch: the light pass escalates and the full pass never refreshes,
    and the test fails.
