  rationale: |
    On 2026-11-05 PR #16523 (W1-T11129) head 90be1a69eaea5510184cf6eec69f7c72afd13c39 received
    remudero-review FAILURE at 22:11:12Z from core (run review-PR16523-1793916123475). Its finding
    carried an executed reproduction: "an in-memory runDaemon replay adopting a review child in
    shadow mode throws ReferenceError at daemon.ts:4218". At 22:31:12Z an operator-machine local
    review of the SAME unchanged head (Mac-mini, run review-PR16523-1793917858782, poster cao825)
    posted SUCCESS at 22:33:28Z and took the clean-status direct merge at 22:33:44Z. The known
    crash reached main.
    Two gaps let that happen. First, verdict stability (applyVerdictStability, W1-T178) is
    one-directional: it suppresses a later semantic FAIL after a prior PASS on an unchanged head,
    but nothing protects a prior FAIL from a later PASS. Second, the prior verdict comes only from
    the local ledger (priorReviewVerdictFromLedger). An operator-machine ledger never holds core's
    review.posted rows, so a local review cannot see a FAIL core posted, and the reverse holds too.
    GitHub's commit-status history for the remudero-review context is the only record every
    reviewer shares.
