  design: |
    Before posting a terminal SUCCESS for a head, read that head's remudero-review status history
    from GitHub (the statuses list, not only the combined current state) and join each FAILURE to
    its ledger or PR-review finding where one is readable. A prior FAILURE on the identical head
    whose finding names an executed reproduction or counterexample makes the head's verdict
    sticky: the new review may post SUCCESS only when its reviewer was handed that prior finding
    verbatim and its verdict clause for the affected criterion explicitly addresses it, for example
    by re-running the reproduction and recording that it no longer fails. Otherwise the review posts
    the FAILURE again, citing the prior finding, never SUCCESS, and the head must change.
    A prior FAILURE without a reproduction (an unexplained downgrade, or a reviewer that could not
    inspect) keeps today's behaviour. An unreadable status history fails closed: it withholds the
    SUCCESS as pending with a named reason, and never posts it blind. This extends W1-T178's rule
    to both directions and to every poster without adding a store. No fixed thresholds.
  acceptance:
    - claim: "A PASS computed on the same head as a prior FAILURE whose finding carried a reproduction posts FAILURE citing the prior finding unless its reviewer explicitly addressed that reproduction; the prior FAILURE is read from GitHub status history, so a FAILURE another machine posted is honoured"
      proof: "unit test: test/ledger/a-reproduced-fail-is-not-overturned-on-the-same-head.test.ts"
    - claim: "A prior FAILURE without a reproduction keeps today's behaviour, and an unreadable status history withholds SUCCESS as pending with a named reason"
      proof: "unit test: test/review/an-unreproduced-fail-or-unreadable-status-history-keeps-its-rule.test.ts"
