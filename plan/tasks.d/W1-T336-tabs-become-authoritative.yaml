  attempts: 0
  note: "verify:auto — four claims, each a real Chromium assertion against the shipped shell.
    risk:high — it is the restructure itself. Its real danger is silent regression of W1-T156's
    in-place patching or W1-T262's freshness story, which is why preserving those is a criterion
    rather than a note.
    budget_usd 90 — the largest of the three, and deliberately below W1-T314's 100 because two thirds
    of that task's surface has moved to W1-T334 and W1-T335.
    files: FIVE PATHS, not eleven. The eight-suite sweep belongs to W1-T335; this shard writes only the
    four suites carrying its own criteria plus serve.ts. If it finds it must edit a suite outside that
    list, that is a signal W1-T335 left the harness incomplete and it should be reported, not absorbed
    — absorbing it is how W1-T314 grew to eleven files and took two scope_guard refusals.
    depends_on W1-T335 IS HARD: the whole ordering exists so this shard's restructure meets suites that
    already tolerate it. Running this before W1-T335 reproduces the exact preflight cliff that killed
    W1-T314 six times, which makes this the least defensive edge in the plan."
