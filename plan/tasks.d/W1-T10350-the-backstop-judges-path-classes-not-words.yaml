  design: |
    A path is classed by WHERE it sits before any word in it is read. No new threshold.
    1. PRIVILEGED CLASSES ESCALATE AS TODAY, WHATEVER ELSE THE PATH CONTAINS.
       - Every path under .github/ (workflows and scripts), .claude/ and settings/.
       - Repo-root deploy/, infra/ and docker/, and every Dockerfile.
       - plan/policy.yaml, DECISIONS.md and CLAUDE.md.
       - Every MERGE_POLICY_PATH match outside tests and prose.
       - Source or config whose module is deploy, secrets, credential, token, auth or permission machinery (for
         example src/lib/deployer.ts, src/lib/arm-auto-merge.ts).
    2. NON-PRIVILEGED CLASSES ARE NOT ESCALATED FOR A WORD IN THEIR NAME.
       - A test file (under test/, or named *.test.*), docs/**, and markdown prose under plan/.
       - plan/*.yaml, plan/policy.yaml, DECISIONS.md and CLAUDE.md are not prose here.
       - `machineShardRisk` uses the same classifier.
    3. TEXT RULES.
       - The secrets/auth rule and the irreversible-action rule stay deterministic for every record.
       - The merge-policy and deletion rules stay deterministic for a record that declares any path outside item 2's
         classes, or no path at all.
       - For a record whose declared paths are all in item 2's classes, a merge-policy or deletion hit is handed to
         the risk judge as a named concern in its input, not as an automatic escalation. The judge still applies
         MACHINE_JUDGE_ESCALATE_ONLY_IF.
    4. ONE CLASSIFIER. Export the path-class function so the judge input, the backstop and the risk band read one answer.
