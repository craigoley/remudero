- id: W1-T8139
  title: "A LATCHED FRESHNESS RESTART ENDS A WORKER ROUND THAT HAS NO BOUNDARY — open PR #10925 lets a pending container recycle end an implement round on the end_round checkpoint path, but the daemon's own freshness restart still waits for the first implement worker to return, for as long as that worker runs"
  repo: remudero
  depends_on: [W1-T7806, W1-T8008]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — a latched daemon restart is not held by a lane inside a worker that cannot yield
  band_meaning: span
  origin: "operator approval 2026-10-11: follow-ups from the recycle-stall fix (hand PR #10925)"
  plan_refs: [W1-T7697, W1-T7806, W1-T7807, W1-T8008, W1-T4662]
  files: [src/run-task.ts, src/lib/quiet-worker-watchdog.ts, test/a-latched-restart-ends-a-worker-round-with-no-boundary.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    READ on origin/main 8bcbc3e10, src/run-task.ts:
      - yieldAtWorkerBoundary (:19688) yields to a pending daemon restart (`opts.externalWaitFreshness`) or a
        recycle PAUSE (`opts.externalWaitRecycle`), but only at boundaries reached AFTER a worker returns
        (W1-T7697). W1-T7806's rationale records the gap: "Nothing yields while the FIRST implement worker runs ...
        A lane inside its first worker is therefore unyieldable for as long as that worker lasts."
      - W1-T7806 (queued, in flight) fixes the REFILL half: freed lanes keep refilling while such a lane holds the
        restart. Its design 2 also threads the daemon's restart latch into the run as one predicate. It does not
        end the long worker's round, so the restart itself still waits for it.
    OPEN PR #10925 (run-unfiled, head 7a479923c, NOT merged at filing) adds a `recyclePending` option to
    runQuietWorkerWatchdog (src/lib/quiet-worker-watchdog.ts) and wires it at the watchDispatchSpawn call
    (:17528 on main) to `opts.externalWaitRecycle` only. A pending recycle then ends the round through the
    W1-T7807 `endRound` checkpoint path, with a `run.freshness_handoff` receipt. The daemon's own freshness restart
    is not wired, so on #10925's head the restart half is still open.
    DEPENDENCIES: W1-T7806 provides the latch predicate this task reads. W1-T8008 (queued) edits the same
    `endRound` checkpoint in watchDispatchSpawn. Both edit src/run-task.ts. If #10925 has merged when this is
    built, extend its `recyclePending` seam. If #10925 was closed unmerged, add the same seam here, since the
    defect is the same in both trees.
  design: |
    Operator rulings: no hard thresholds; lean into automation.
    1. ONE PENDING-YIELD PREDICATE. The value the watchdog reads to end a round mid-worker is "a recycle PAUSE is
       pending OR the daemon's restart latch is set". Read the latch through the predicate W1-T7806 threads from
       the daemon's runOne (cheap, in-process). Never call `externalWaitFreshness` on every watchdog poll; it can
       fetch.
    2. Same path as the recycle: the `endRound` checkpoint (commit, push, QuietRoundEndedError), a trigger naming
       which one fired (`recycle` or `restart`), and the same `run.freshness_handoff` receipt with waiting_on
       worker_round, so the next run restores the checkpoint (pendingWorkerBoundaryHandoffs).
    3. A round end that fails (a refused checkpoint) is ledgered as `worker.recycle_yield` with decision
       action_failed, as #10925 does, and the run continues to its next boundary. The restart waits for it as
       today.
    4. Only implement workers (the existing `endRound` guard). Fix-rung workers are a separate task filed with
       this one.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive watchDispatchSpawn with injected seams,
    as #10925's test does: a latched restart and no recycle PAUSE, an implement worker mid-stream.
