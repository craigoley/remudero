    - claim: "the round end writes a worker_round receipt with trigger restart"
      proof: 'grep: test("W1-T8139: a restart round end writes a worker_round receipt" in test/a-latched-restart-ends-a-worker-round-with-no-boundary.test.ts'
    - claim: "with neither a latch nor a recycle PAUSE the round is not ended"
      proof: 'grep: test("W1-T8139: no latch and no recycle leaves the round running" in test/a-latched-restart-ends-a-worker-round-with-no-boundary.test.ts'
    - claim: "the watchdog never calls the fetching freshness read on a poll"
      proof: 'grep: test("W1-T8139: the pending-yield read never calls the freshness fetch" in test/a-latched-restart-ends-a-worker-round-with-no-boundary.test.ts'
  falsifier: |
    Wire only the recycle PAUSE, as #10925 does: under a latched restart the first test sees the worker keep
    running and no checkpoint commit. Read `externalWaitFreshness` on each poll: the last test's spy counts calls.
