  risk: high  # Rule 19: one concern, which required names the fix-progress judge is told have not reported, spanning the contract read (ci-gate-required.ts), the classifier (sweep.ts) and its one producer (tick-read-worker.ts). It feeds judge input only; no merge, arm or fix decision reads it
  band_meaning: span
  priority: 2  # the judge's input is wrong for the length of every light-gates run, but nothing acts on pendingRequiredChecks except the judge prompt
  status: queued
  attempts: 0
  origin: "investigator V62, 2026-10-27, re-verifying a 2026-10-17 lead from agent B59 (#12669 / W1-T10067) at origin/main ab1bf6914"
  plan_refs: [W1-T10067, W1-T4399, W1-T5695, W1-T5802, W1-T2599]
  files:
    - src/lib/sweep.ts
    - src/lib/tick-read-worker.ts
