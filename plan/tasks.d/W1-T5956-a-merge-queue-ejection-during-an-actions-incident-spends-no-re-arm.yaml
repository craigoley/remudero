- id: W1-T5956
  title: "A MERGE-QUEUE EJECTION DURING AN ACTIONS INCIDENT SPENDS NO RE-ARM — W1-T5939 holds CI-spending lanes while GitHub Actions is degraded, but a PR the merge queue ejects because its group's checks never got a runner goes through W1-T5909's re-arm lane, which counts every re-arm against MAX_REARMS_AFTER_DISARM_PER_HEAD (3) and then escalates, so a long outage exhausts the bound and escalates PRs that did nothing wrong"
  repo: remudero
  depends_on: [W1-T5909, W1-T5939]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high  # Rule 19: one concern — the re-arm bound during an incident; it sits in front of auto-merge and escalation
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: found while keeping the board green after the stall fixes shipped"
  plan_refs: [W1-T5909, W1-T5939, W1-T5941, W1-T5940]
  files: [src/lib/sweep.ts, test/a-merge-queue-ejection-during-an-actions-incident-spends-no-re-arm.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    Found 2026-10-06 while building W1-T5939 (#9453, merged): its hold covers blocked-fixable reds only.
    On 2026-10-05 the merge queue ejected #9391, #9392, #9388 and #9390 during the Actions incident
    because group checks were cancelled after ~15 min without a runner; with W1-T5909 live, each ejection
    is a disarm the sweep re-arms and counts, so an outage longer than three group cycles escalates every
    queued PR. This must hold before the merge queue is re-enabled (W1-T5941's gate).
  design: |
    While classifyActionsIncident reads degraded or major_outage, a disarm-after-ejection re-arms (or waits)
    without incrementing the per-head re-arm count, and the BACKSTOP escalation is not raised for
    ejections that happened during the incident window; once Actions is operational the count resumes.
    An unreadable status counts as operational for this purpose only if it has been unreadable for longer
    than W1-T5939's hold BACKSTOP, so a stuck read cannot hide a real ejection loop forever.
  acceptance:
    - claim: "an ejection during an Actions incident re-arms without counting against the per-head re-arm bound and never escalates for that reason, while ejections after Actions is operational count and escalate at the bound as before"
      proof: "unit test: test/a-merge-queue-ejection-during-an-actions-incident-spends-no-re-arm.test.ts"
  falsifier: |
    Count every re-arm regardless of the incident: three ejections during an outage escalate and the test
    fails.
