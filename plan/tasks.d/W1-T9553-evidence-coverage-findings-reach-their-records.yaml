  rationale: |
    OBSERVED 2026-10-14 (host gardener state evidence-coverage-gardener.json, last pass 18:46Z): the gaps
    containment/servedModel and containment/cost were last filed at 51%, feedback-summary/servedModel and
    feedback-summary/cost at 55%. On origin/main 699dbec37 the records still read their first filing:
    plan/feedback/evidence-coverage-containment-served-model.yaml and -containment-cost.yaml "49/61 ... (80.3%)",
    -feedback-summary-served-model.yaml "43/50 ... (86.0%)", -feedback-summary-cost.yaml "44/51 ... (86.3%)".
    `git log` shows no gardener write to any of the four since 2026-09-29/30 (#7805, #7941); every later
    commit is triage. evidence-coverage-containment-cost reads `status: rejected` since #10976 ("already
    decided, no task") while the gardener still measures its gap open.
    READ at origin/main (src/lib/evidence-coverage-gardener.ts):
    - `runEvidenceCoverageGardener`'s `fileOnce` stamps `open.filedDigest` as soon as `deps.file` returns, and
      the dedup is that LOCAL state digest, not what the record on main says.
    - `feedbackEvidenceCoverageFiler` calls `landFeedbackStatusContent(...)` (src/lib/feedback-landing.ts) for an
      existing record and DISCARDS its `LandFeedbackResult`: a `{ landed: false, error }` returns normally, the
      digest is stamped, and the update is never retried. Whether the four updates were refused there or lost
      later is for the builder to establish from the gardener's `evidence_coverage.filed` rows and the landing
      rows; the discarded result is the seam where a loss reads as success.
    - The filer writes `raw` only and never looks at `status`, so a closed record is silently updated in place
      (or not at all) and stays closed.
  design: |
    1. A landing that neither landed nor queued is a failure: the filer throws on a `LandFeedbackResult` with
       `landed: false` and no `queued`, so `fileOnce` leaves the digest unset and the next pass retries (the
       existing `evidence_coverage.filing_failed` path).
    2. The update is judged against the RECORD, not only the local digest: on each pass, for every open gap, the
       gardener reads the record's current `raw` (checkout or queued landing) and lands an update whenever the
       measured coverage line it would write differs from the one the record holds, so a lost landing heals on
       the next pass instead of being remembered as done.
    3. Reopen with evidence: when a gap is measurably open (below its floor or baseline, over a sufficient
       denominator) and its record's status is closed (`rejected`, or `accepted`/`answered` with no open task
       naming the record), the gardener sets the record back to `new` and appends a dated evidence line (the
       measured coverage, the window, the closing status it overrides and the PR that closed it when known). It
       does this once per closing, not every pass: a record reopened and closed again with the gap unchanged is
       reopened only when the measured value moves.
    4. A `grilling` record keeps `grilling`; only its measured value is updated (the grill reads the live number).
    5. It still never gates: no merge, review or dispatch path reads any of this.
    6. Bounded shared-policy amendment: only canonical evidence-coverage lane/field records carrying a
       validated evidence_coverage_revision may update measured raw evidence at the same status or reopen
       under point 3. Preserve every other record field and all non-measurement human raw history. Generic
       lifecycle rules, including all original status-pair assertions, remain unchanged. No generic backward
       transition, deleted-record resurrection, baseline/denominator/floor increase, or merge arm is granted.
    7. Prepare records and the complete plan (tasks.yaml AND tasks.d) from one immutable fetched main SHA;
       never use served-checkout status or a local digest as completion truth. Accepted/answered eligibility
       requires complete API search evidence plus actual exact-repository PR state joined by exact task trailer
       OR run-task branch. Missing, incomplete, malformed or unreadable evidence remains UNKNOWN. An open
       matching PR dominates a merged duplicate. No referenced tasks is eligible only in the complete plan.
    8. Pin the whole expected record and both plan sources in each revision. Both landing writers and pending
       branch carry revalidate those expectations; concurrent human changes, plan changes and record deletion
       refuse explicitly. No merge-time atomicity across Git and GitHub is claimed: task facts are observed at
       preparation; the immutable plan/record expectation is checked when staging. Normal PR review/CI remain.
    9. The daemon's existing injected repoRoot must reach its gardener context. Qualify the old self-hosting
       gardener fixture with its own complete local Git source corpus; preserve every original assertion.
       The programmatic gardenCommand entry receives the same optional source-root seam so its existing
       CLI framing test also uses a complete local Git corpus. Original assertions stay byte-identical;
       no CLI flag or production default changes. No refusal-stub exemption.
    10. Retain the last reopened coverage value through closing and raw updates; equal coverage stays closed
       even if its denominator grows. New value may reopen only under point 3. Keep existing cadence, filing
       count, window, floors, denominator, drop tolerance, budget and all original acceptance/falsifier text.
