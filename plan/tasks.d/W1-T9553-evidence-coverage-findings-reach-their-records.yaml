  falsifier: |
    Seed a record reading 80.3% and a landing that returns `{ landed: false, error }`. At origin/main the pass
    reports it updated, stamps the digest, and a second pass writes nothing: the record stays at 80.3%. With
    the change the second pass lands 51%. Seed the record `status: rejected` with a 51% gap: at origin/main it
    stays rejected; with the change it reads `new` with the evidence line.
    Additional shared-policy controls: remove the exact revision branch from mergeFeedbackRecord and the
    real direct/disk and shared-predicate cases fail; remove the registered production context wiring and
    the actual ledger-to-queue reopening fails. Both plan inputs moving, missing API evidence, deleted
    records, concurrent human history, equal-value reclosure and stale queued revisions must stay refused
    or closed as specified, while every original generic lifecycle assertion remains unchanged.
