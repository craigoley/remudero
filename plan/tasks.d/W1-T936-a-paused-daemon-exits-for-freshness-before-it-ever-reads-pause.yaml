  note: "**`risk: high` IS SET UP FRONT, AND THE BAND IS RULE 19'S *SPAN*, NOT BLAST RADIUS.** The
    linter classes `src/lib/daemon.ts` and `test/daemon-freshness.test.ts` as two distinct concerns
    (`daemon`, `daemon-freshness`) and refuses that pair at `risk:medium` — measured, not predicted:
    the first lint of this shard returned exactly one violation, `[sizing] spans 2 distinct
    subsystems/concerns (daemon, daemon-freshness) at risk:medium`. The pair is NOT decomposable,
    because a guard and the suite that proves the guard are one concern in every sense but the
    linter's. The actual blast radius is one reordering of two adjacent checks that both already exist
    in that loop: no gate, disposition or policy value moves.

    `files:` DERIVED BY WORD-BOUNDED INVOCATION COUNT (`git grep -cw`) AGAINST origin/main at 1c44f93.
    `checkPause` scores `src/lib/daemon.ts` 4; `checkFreshness` scores `src/lib/daemon.ts` 5;
    `daemon_selfrestart_for_freshness` scores `src/lib/daemon.ts` 3. `test/daemon-freshness.test.ts`
    is the only suite scoring top on both freshness symbols (`checkFreshness` 10,
    `daemon_selfrestart_for_freshness` 5) and it drives `runDaemon` directly 10 times, so the ordering
    assertion belongs beside the STOP-vs-freshness test it already carries.
    **`src/run-task.ts` IS DELIBERATELY NOT DECLARED**: it only WIRES `checkPause`/`checkFreshness`
    into the deps object and the ordering being changed is not there — 103 of 277 shards declare it and
    it serialises every task naming it (W1-T471). `src/lib/self-sync.ts` is NOT declared either: the
    predicate is correct and is not being touched.

    **THE COVERAGE GAP THAT LET THIS SHIP.** `test/daemon-freshness-wiring.test.ts` (54 `stale`
    mentions) and `test/daemon-freshness.test.ts` (53) contain ZERO `pause` mentions, and the one
    ordering assertion in `-wiring` pins only that an in-flight dispatch completes before the restart.
    No test anywhere pins pause-against-freshness, which is why a reorder can be proved by a new test
    rather than by re-reading the loop.

    **ID PROVENANCE — FOUR SURFACES SWEPT AT 1c44f93, EACH WITH A KNOWN-TAKEN POSITIVE CONTROL.**
    `refs/rmd-id/*` max 934 over 41 refs (control `refs/rmd-id/W1-T934` reads 1); shard FILENAMES on
    origin/main max 934 over 315 files (control `W1-T933` reads 1); every OPEN PR's FILE LIST (#2018
    adds `plan/tasks.d/W1-T935-...yaml`, #2013 adds 5 non-shard files); and every OPEN PR's TITLE —
    **THE TITLE SWEEP IS WHAT FOUND W1-T935**, which #2018 holds and which neither the local shards nor
    `refs/rmd-id/*` know about. Tree max is 934 and 935 is taken, so 936.
    **THE RESERVATION DID NOT TAKE.** The `refs/rmd-id/W1-T936` push used a unique orphan commit over
    the EMPTY TREE (4b825dc642cb6eb9a060e54bf8d69288fbee4904) carrying nonce
    `vm-19269-1786933078230009356`, the refspec braced, and the exit status captured into a variable
    rather than read through a pipe: it FAILED with `HTTP 403`, exit 1. The readback confirms the ref
    is ABSENT and does not carry our nonce, while the positive control `refs/rmd-id/W1-T934` reads 1
    line. This host cannot write non-branch refs. **SO THIS ID RESTS ON THE FOUR-SURFACE SWEEP ALONE.**

    PROOF NOTES: all three proofs are NAME-FILTERED titles, never pure paths, each under 100 characters
    with ZERO commas and no `\"; \"` so `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot
    fail them, and each matches ZERO files today (`grep -rlF` over `test/`) against the control
    `a hard STOP still wins outright over a pending freshness restart`, which matches exactly 1.

    **WHAT THIS RECORD DOES NOT CLAIM.** It does not claim the freshness exit is wrong — it is right,
    and removing it is explicitly out of scope. It does not claim the crash-loop detector failed: it
    fired nine times and was correct every time. And it does not claim the five-day boot total is
    known — `daemon.boot` is a health step retained only `HEALTH_STEP_RETENTION_WINDOW_MS` (15 minutes)
    at rotation (`src/lib/ledger.ts`), so a live-file count of 252 is a FLOOR bounded by the last
    rotation, not a five-day total, and the real figure needs the rotation union."
