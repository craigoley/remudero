- id: W1-T936
  title: "a paused daemon exits for freshness before it ever reads state/PAUSE, so KeepAlive relaunches it into the same flag forever — PAUSE sits on the wrong side of the line STOP is already on"
  repo: remudero
  type: implement
  verify: auto
  risk: high
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: "**THE PAUSE NEVER TOOK EFFECT BECAUSE THE FRESHNESS EXIT IS READ FIRST.** In `runDaemon`
    (`src/lib/daemon.ts`) the tick order is `checkStop` -> `reloadPlan` -> the daily-cost-ceiling
    reload -> `checkFreshness` -> `checkPause`. `deps.checkFreshness?.()` returning `{stale: true}`
    logs `daemon_selfrestart_for_freshness` and RETURNS `summary(\"stale\")`; `daemonExitCode(\"stale\")`
    is `DAEMON_EXIT_STALE` = 75. The `checkPause` block sits BELOW that return and is never reached.
    Re-derived from source at 1c44f93 — the diagnosis is CONFIRMED, not assumed.

    **THE CODE ALREADY KNOWS THIS IS WRONG, FOR STOP.** The freshness block's own comment says it is
    placed 'directly after STOP — a hard STOP still wins outright, a deliberately halted fleet never
    self-restarts for freshness — and before PAUSE/headroom/dispatch'. So the ordering is DELIBERATE
    and PAUSE was deliberately left below it. The comment on the PAUSE block, eight lines later,
    describes the exact outcome that placement now produces: 'PAUSE is an IN-PROCESS idle, never an
    exit (the 2026-07-22 relaunch storm: returning here exited nonzero, and
    KeepAlive{SuccessfulExit:false} relaunched into the same flag every ~10s until bootout)'. **THAT
    STORM HAS RETURNED THROUGH A DIFFERENT DOOR.** The July fix stopped PAUSE itself from exiting; it
    did not stop an earlier check from exiting while PAUSE was set.

    **AND THE PREDICATE'S OWN STATED PRINCIPLE IS THE ONE BEING VIOLATED.**
    `daemonFreshnessFromService` (`src/lib/self-sync.ts`) already refuses to report stale on a DIRTY
    tree, and says why in terms: 'Restarting is only correct when a restart can actually CLEAR the
    condition, and on a dirty tree it provably cannot.' A paused daemon on a checkout nothing
    fast-forwards is the SAME family and was not enumerated: the restart cannot clear staleness
    either, so the exit is a no-op that only pays the boot cost again.

    **WHY THIS BITES ONE HOST AND NOT THE OTHER.** On the container, `deploy/entrypoint.sh` checks out
    origin/main on EVERY boot, so a restart really does clear the condition and the loop self-limits.
    On the mini nothing in the daemon's own boot fast-forwards its checkout: `serviceFreshnessGate`
    (`src/run-task.ts`) only LEDGERS `daemon.stale_code` and runs `ensureInstallFresh` — it never
    exits and never moves a ref — and `runDeployCycle` (`src/lib/deployer.ts`) fast-forwards only
    behind a deploy trigger and an idle gap. So the condition persists and the exit repeats.

    **THE ESCALATION SIDE WAS CORRECT NINE TIMES.** `detectDaemonCrashLoop` +
    `escalateCrashLoop` opened nine `[BLOCKED] DAEMON` issues since 2026-08-14 — #2015, #2014, #2009,
    #2007, #1915, #1884, #1818, #1809, #1806 — verified open via REST. #2015 records 40 boots inside
    10 minutes at ~17s spacing. **THIS IS NOT A MISSING SIGNAL AND MUST NOT BE ANSWERED WITH ONE.**"
  design: |
    (i) SCOPE: ONE concern — move the PAUSE read ABOVE the freshness read in `runDaemon`, so a
    deliberate hold is honoured before a restart decision is taken. NOT a change to the freshness
    predicate, NOT a new ledger step, NOT a supervisor change, NOT a launchd change.
    (ii) THE FRESHNESS EXIT IS NOT REMOVED AND NOT WEAKENED. It exists because a daemon ran stale for
    ~13 hours reporting itself fresh. Under this change it is DEFERRED while paused and fires on the
    first tick after `rmd resume` deletes the flag — the daemon still never dispatches on stale code,
    because a paused daemon dispatches nothing at all.
    (iii) THE ARGUMENT IS CONSISTENCY, NOT PREFERENCE. STOP and PAUSE are both deliberate operator
    holds. STOP is already above the freshness exit and the comment there defends that placement. This
    puts PAUSE on the same side, which is the smallest change that makes the two holds behave alike.
    (iv) RANKED ALTERNATIVES, REJECTED, RECORDED SO THEY ARE NOT RE-PROPOSED. Suppressing the freshness
    exit inside `daemonFreshnessFromService` reaches the same outcome but teaches a pure predicate
    about fleet-control state and splits the hold logic across two modules. Teaching the deploy
    supervisor about PAUSE is strictly larger — `src/lib/deployer.ts` references PAUSE zero times
    against a control of 12 in `src/lib/fleet-control.ts` — and would not stop the daemon exiting on
    its own. Neither is proposed here.
    (v) THE ADJACENT DEFECT, NAMED AND NOT FILED HERE: an escalation cannot say WHICH HOST it
    describes. `renderIssueBody` (`src/lib/escalate.ts`) emits Class/Task/Run/Head/Cause and no host
    field, so #2015 carries only `Run: DAEMON-1786929845245` while counting boots from a different
    machine's corpus. `os.hostname()` is already imported in six modules, so the absence is a choice
    rather than a limitation. That is a SEPARATE concern and is deliberately out of this shard.
    (vi) NAME THE CONSUMER OR DO NOT EMIT. This proposes no new emitter, no new route, no new queue and
    no new ledger step. The consumer of this change is the daemon's own loop.
  acceptance:
    - claim: "a daemon whose checkout is behind origin/main idles instead of exiting while PAUSE is set"
      proof: "unit test: W1-T936: a paused daemon never exits for freshness"
    - claim: "the pause read is consulted before the freshness read on every tick"
      proof: "unit test: W1-T936: PAUSE is read before the freshness check"
    - claim: "the freshness restart still fires once the pause flag is gone"
      proof: "unit test: W1-T936: clearing PAUSE lets the freshness exit fire"
