  origin: "operator session measurement 2026-10-23 ~18:20Z; re-verified by the filing agent the same day on origin/main a85543a73 and read-only on `ssh remudero`"
  plan_refs: [W1-T10380, W1-T10381, W1-T10511, W1-T6252, "PR #13602 (W1-T10380)", "PR #13593 (W1-T10381)"]
  files:
    - src/lib/worker-home.ts
