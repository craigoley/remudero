  falsifier: |
    Remove the identity write from replaceClaudeFleetCredential: the carry case fails on the new email and
    uuid. Merge oauthAccount key by key instead of replacing it: the carry case fails on the old tier key that
    survives. Overwrite the whole store `.claude.json` with the staged one: the carry case fails on the lost
    keys. Write the identity when the staged file has no oauthAccount, or rewrite an unparseable store file:
    the cannot-carry case fails on the bytes. Restore the first-character label: the label case fails.
    GUARDS that held at base and must still hold: a staged credential that is not `usable` leaves the store
    byte-identical, an ended session writes nothing, and the host's own `.credentials.json` and `.claude.json`
    are never touched (the W1-T10380 suite); W1-T10381's labels and episode keys are unchanged
    (test/daemon/a-fleet-store-on-an-exhausted-account-is-named-and-escalated.test.ts). Remove each guard's
    production branch in turn: its case must fail. Restore and require zero failures.
