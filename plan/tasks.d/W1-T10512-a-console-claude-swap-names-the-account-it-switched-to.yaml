- id: W1-T10512
  title: "A CONSOLE CLAUDE SWAP NAMES THE ACCOUNT IT SWITCHED TO — replaceClaudeFleetCredential renames only `.credentials.json`, so the fleet store's `.claude.json` keeps the previous account's `oauthAccount` (measured live 2026-10-23: the new token's profile is craigoleyagent, the store still says craigoley, and a later `claude -p` on the store did not fix it); and the completed login's label is `c***@gmail.com` for both accounts, so the operator cannot tell which one the swap chose"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 10.00
  risk: high  # Rule 19: one concern, the identity a console Claude swap leaves behind (the store's oauthAccount and the redacted label); the credential write, its locks and the projection's shape are unchanged
  band_meaning: blast-radius
