  rationale: |
    W1-T13727 (docs/research/a-home-repo-for-each-fleet.md) recommends a small staged build of Pocock's Home Repo
    pattern for each fleet: a private repository of pointers, a worker-safe instruction file and operator docs. Codex
    workers read a repo's CLAUDE.md (CODEX_DOCTRINE_PRELUDE), so operator powers belong in a linked doc.
    .remudero/home-repo.json already means the feedback upstream target (loadHomeRepoPointer, W1-T397), so this
    feature uses no file of that name.
  design: |
    1. src/lib/fleet-home.ts: buildFleetHome(registry) from projectRegistry returns {CLAUDE.md, docs/home/operator.md,
       pointer lines}; writeFleetHome(payload, dir) creates files and refuses any that exist, mirroring
       project-init.ts and project-init-write.ts.
    2. src/run-task.ts registers `rmd fleet-home init --write <dir>`; docs/operator-guide.md's command table gains the
       row.
    3. Console wizard wiring stays parked until a second fleet has used the generator.
    NO-INVARIANTS: a new verb that writes only to a directory the operator names; no existing command's output,
    default or side effect changes.
  falsifier: |
    Remove the exists check in writeFleetHome: criterion 3 fails.
