  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across four `src/lib` modules plus `src/` and
    `test/`, so `sizingViolation` (`src/lib/task-linter.ts`) returns early before `subsystemsOf` is
    consulted. The band is the SPAN; the edit itself is a field name and one explanatory line per
    prompt.
    `files:` WAS DERIVED BY INVOCATION COUNT ON THE PROMPT SYMBOLS THAT CHANGE, at 044cd793:
    `inboxDraftPrompt(` and `inboxDraftRelintPrompt(` — `src/lib/inbox.ts` (2 and 2);
    `triagePrompt(` — `src/lib/triage.ts` (1); `planArchitectPrompt(` —
    `src/lib/plan-architect.ts` (1); `filedTaskRelintPrompt(` — `src/lib/relint.ts` (2);
    `buildSynthesizeTasksYamlPrompt(` — `src/run-task.ts` (2). Those are the definition sites and
    they are the whole declared source set.
    **`src/run-task.ts` IS DECLARED BECAUSE THE CHANGE GENUINELY LIVES THERE** — the onboarding
    seed prompt is defined in that file, not merely called from it — and the cost is accepted
    explicitly: at ~19,900 lines `partitionByFileOverlap` (W1-T471) serialises this task against
    every other declaring it. There is no smaller honest declaration that still fixes that lane.
    THE EXISTING PROMPT SUITES ARE DELIBERATELY NOT DECLARED. `test/inbox-approve.test.ts` (5),
    `test/plan-architect.test.ts` (9), `test/triage.test.ts` (7) and the others INVOKE these
    prompts but design (v) measured that none asserts the schema field list, so none needs
    touching; a declared-but-untouched path fails `inverseScopeUntouchedFiles`
    (`src/lib/review.ts`) exactly as an undeclared one fails `scopeViolationFiles`. The new
    assertions go in ONE new file for the same reason.
    RULE 25 IS NOT ENGAGED: no declared `src/` path matches an `INSTRUMENT_SURFACE` pattern and
    `test/` is excluded from `isProductPath`.
    EVERY CRITERION IS A NAME-FILTERED `unit test:` TITLE, NOT A PURE PATH — a pure path runs the
    whole file and couples every criterion to unrelated failures in it. Each of the four titles was
    checked to match zero files under `test/` today against a positive control matching one, and
    each is under 100 characters with no comma and no regex metacharacter.
    EVERY FIGURE HERE IS DATED 2026-08-15 AND IS A QUERY, NOT A CONSTANT — the five prompts, the
    zero-mention count with its greppability control, the tool grant, the type histogram and the
    schema-phrase absence all move as the code moves. RE-DERIVE BEFORE BUILDING, especially the
    property-name artefact in rationale (1), because a naive `grep -c 'files:'` will reproduce the
    misleading 2 and 3."
