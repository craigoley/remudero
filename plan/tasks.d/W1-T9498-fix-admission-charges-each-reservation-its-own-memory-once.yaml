  design: |
    Operator rulings: no hard fixed threshold, never raise core memory.max, lanes come from the memory governor.
    1. ACCOUNT IN MiB. With a pressure reading, headroom is `availableMib - floorMib` of the binding pool (as today).
       A fix claim is admitted when the headroom left after every outstanding charge covers one fix at the fix class's
       learned estimate (`classEstimate("fix")`, the class default when unmeasured, said so on the row).
    2. EACH RESERVATION AT ITS OWN ESTIMATE. A review reservation is charged at the review class's learned estimate,
       not a fix slot. An admitted fix is charged at the fix estimate.
    3. RESERVATIONS ARE READ LIVE, AND CHARGED ONCE. The controller reads its reservations on each refresh, not a count
       fixed at construction: a review reservation ends when its review settles. A reservation whose worker is running
       is charged only its unrealized part, max(0, estimate - its tree's current rss+swap), the shadow budget's rule.
       A reservation whose worker has not started, or whose residency cannot be read, is charged its whole estimate.
    4. The stand-in path (no pressure reading) keeps `hostWorkerBudget - activeWorkers` worker counting. The
       `nothing-to-wait-for` tier still admits one. An unreadable pressure still admits none.
    5. `sweep.fix_capacity` adds `headroom_mib`, `review_charge_mib`, `fix_charge_mib`, `fix_estimate_mib` and its
       source, so a refusal row shows the arithmetic it refused on. The refusal reason names MiB, not slot counts.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below, using the 08:46:34 and 04:48:14
    rows above as fixtures with injected estimates and residency.
