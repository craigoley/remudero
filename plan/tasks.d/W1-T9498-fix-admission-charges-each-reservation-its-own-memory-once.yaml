    READ on origin/main f07a85601 (symbols):
      - `createSweepFixAdmissionController`, `refresh`: `free = pressureWorkers(pressure, DEFAULT_ESTIMATE_MIB.fix)`,
        i.e. floor((availableMib - floorMib) / 2048), then `available = free - input.reviewReservations -
