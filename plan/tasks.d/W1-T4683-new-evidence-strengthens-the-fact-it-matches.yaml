  title: "THE RETRO MINTS A NEAR-DUPLICATE INSTEAD OF STRENGTHENING THE FACT — when new evidence matches an existing learning, append it as evidence and raise the fact's proof count (a Beta pseudo-count, not a cutoff), using a similarity pass plus a merge-or-keep check that keeps changed numbers, negations and names apart"
