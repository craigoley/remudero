  acceptance:
    - claim: Under --run each rule-suite child prints one timing line naming the suite and its start-to-exit milliseconds
      proof: "grep: timedSuiteRun( in scripts/list-rule-suites.mjs"
    - claim: A measure mode starts the same suite child N times one after another and prints the median and the spread of their start-to-exit times
