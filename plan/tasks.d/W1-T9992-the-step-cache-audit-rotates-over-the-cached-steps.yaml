- id: W1-T9992
  title: "THE STEP-CACHE AUDIT ROTATES OVER THE CACHED STEPS — W1-T9718 made the board oracle audit one slice of the plan's tasks per pass, but W1-T9604's auditStepCache still compares every cached step bucket and both plan-only sets against a full uncached read on every pass, so each oracle pass re-reads every cached step in full; in W1-T9718's bench that is the floor of a pass, about 200 MB rchar at 12 slices"
  repo: remudero
  depends_on: [W1-T9718]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium  # Rule 19: one concern, which cached steps one oracle pass audits; what an audit does on a mismatch is unchanged
  band_meaning: span
  origin: 'W1-T9718 build (PR #12483) follow-up named in its PR body; coordinator brief batch1017 item 3'
