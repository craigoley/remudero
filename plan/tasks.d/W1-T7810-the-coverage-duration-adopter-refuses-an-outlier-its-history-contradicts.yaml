  design: |
    1. HISTORY, NOT ONE RUN. The fold keeps a short per-file history of RAW instrumented observations (the
       last N runs, N = `DURATION_WINDOW_RUNS`), carried in the proposal artifact beside the folded value.
    2. OUTLIER JUDGED AGAINST ITS OWN HISTORY. An observation is folded only when it lies within the
       file's own recent spread: |log(obs) - median(log history)| <= k x 1.4826 x MAD(log history).
       k comes from the fleet-wide noise band `settleDurationRows` already measures, never a fixed ratio.
       With fewer than three observations, the fleet band stands in for the file's own spread.
       A refused observation is kept in the history, so a real, sustained shift is adopted once it becomes
       the median. It is never folded on its own, and the proposal lists it under `outliers` with the
       median and band it was judged against.
    3. A COMMITTED ROW THE HISTORY CONTRADICTS DECAYS TO THE MEDIAN. `settleDurationRows` judges the
       committed value against the median of the RAW observations, not of EWMA-folded proposals. A row
       outside the whole raw envelope by more than the band moves to that median in one adoption, so a bad
       row is not halved once a day.
