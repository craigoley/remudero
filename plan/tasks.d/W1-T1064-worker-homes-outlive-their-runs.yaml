    - claim: "a home whose run is still live is kept however old it is, so age alone can never reap a working run"
      proof: "unit test: worker home reap: a live run's home is kept regardless of age"
    - claim: "a home whose run id resolves to nothing falls back to the age ceiling rather than being removed outright"
      proof: "unit test: worker home reap: an unresolvable run id falls back to age"
    - claim: "every removal names the home and the evidence that judged it dead, so a discard is never silent"
      proof: "unit test: worker home reap: every removal names its evidence"
    - claim: "a pass that removed nothing still reports, so silence no longer reads the same as never having run"
      proof: "unit test: worker home reap: a pass that removes nothing still reports"
