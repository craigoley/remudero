- id: W1-T10920
  title: "THE PRE-OPEN GATE HAS NOT PASSED SINCE 2026-10-19 BECAUSE ITS OWN SANDBOX FAILS TYPECHECK — 115 of the gate's fails since then name typecheck while the worker's own `tsc -p tsconfig.json --noEmit` exits 0 on the same tree and CI's typecheck is green, and nobody could say why because the gate keeps only step NAMES; the gate records each failed step's bounded detail, classifies a step its sandbox broke as unmeasured (never handed to the worker as a code fault), and the sandbox is repaired so a clean tree passes"
