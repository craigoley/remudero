    sweep.merge_probe with verdict and conflict_paths. W1-T4914's design made that row "observation" with "No
    disposition changes", and nothing reads conflict_paths today (git grep finds no consumer outside
    merge-probe.ts). Its target order also puts a PR first only when `mergeableState === "dirty"` (dirtyFirst),
    so a PR whose mergeable_state reads `unknown`, the exact one waiting on evidence, gets no priority.
