  design: |
    No new wait bound. A dirty PR's evidence comes from the probe the pass already runs.
    1. PROBE THE PR THAT IS WAITING. probeOpenPrMerges puts first a PR whose mergeState is dirty or whose
       mergeable_state is `unknown` (today only `mergeableState === "dirty"`), and a PR in the conflict wait is
       re-probed when its head or main moved, as today.
    2. THE PROBE RETURNS EVIDENCE, NOT ONLY A ROW. For a `conflict` verdict, build MergeConflictEvidence for the
       conflicting paths from the same clone: per path, the deletions on each side from `git diff --numstat` of the
       merge base (`git merge-base <head> <main>`) to the head and to main, and the ours/theirs logs as the compare
       path builds them. probeOpenPrMerges returns it per PR; the row keeps its fields.
    3. THE PASS USES IT. src/run-task.ts sets `mergeConflict` from the probe for any PR whose compare evidence is
       absent, before runSweep, and the disposition row records which source supplied it. Compare evidence, when
       present, wins; the probe is the fallback, so no PR that dispositions today changes. With evidence captured,
       the PR reaches the existing `conflicted` row and its bounded worker, or the existing refusal causes
       (conflictRefusalCause), never the evidence-missing escalation.
    4. UNREADABLE STAYS UNREADABLE. A probe that is `unreadable` supplies nothing, and the W1-T5908 wait and its
       escalation behave as today.
    5. src/run-task.ts is near its comment-load ceiling: keep the wiring to a call, with no new comment prose there.
    Tests go in the new file, `test(` titles verbatim as in the proofs below. Drive probeOpenPrMerges against a real
    throwaway repo (gitRepo()) where main and the head both edit one line of one file.
