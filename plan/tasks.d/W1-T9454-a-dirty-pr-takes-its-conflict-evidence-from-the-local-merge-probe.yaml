    head conflicts, yet nothing turns that into evidence.
    THE EVIDENCE ALREADY EXISTS IN THE SAME PASS. src/run-task.ts calls probeOpenPrMerges (src/lib/merge-probe.ts,
    W1-T4914) right before runSweep. It fetches main and refs/pull/<n>/head into the sweep clone and runs
