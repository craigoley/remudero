  rationale: |
    READ on origin/main 7f7f0ea6b. Symbols, not lines.
    WHERE CONFLICT EVIDENCE COMES FROM. OpenPrView.mergeConflict is filled only by
    hydrateMergeConflictEvidenceSteps (src/lib/open-prs-rest.ts, W1-T984): two GitHub compare calls per PR already
