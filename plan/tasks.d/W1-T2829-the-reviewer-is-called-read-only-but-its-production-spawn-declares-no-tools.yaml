  rationale: |
    OBSERVED LIVE BEFORE AND AFTER A VERIFIED GRACEFUL RECYCLE. PR #3944 first selected Codex
    GPT-5.5 for semantic review, then returned in 252 ms with an empty session, zero tokens and
    stderr `Not inside a trusted directory and --skip-git-repo-check was not specified.` After the
    daemon was drained, recycled onto the verified image and booted at current main c2fe3ebb, PR
    #3946 reproduced the exact stderr in 141 ms with the same empty session and zero tokens. This
    falsifies restart or image freshness as the remedy and reproduces the caller-to-adapter gap on
    the current production path.

    OBSERVED AT HEAD. `runReview` describes the semantic worker as read-only and creates its
    intentionally non-repository `withTempDir("review", ...)` cwd, but its production
    `spawnWorker` call passes no `tools`. `codexExecArgs` defines read-only as an actual tool array
    containing no write tool. Missing is therefore write-capable, so W1-T2748's narrow bypass is
    correctly withheld. Its test supplies `[Read, Grep, Glob, Bash]` directly to
    `spawnCodexWorker`; it never drives `runReview`, so it proves the adapter under an input the
    production reviewer does not send.
  design: |
    Make the semantic reviewer's real `spawnWorker` call declare the existing shared read-only
    inspection list: Read, Grep, Glob and Bash, with no Write/Edit/NotebookEdit/MultiEdit. The prompt
    tells the reviewer to fetch the PR diff and run proofs, so an empty list would silently disable
    Claude review work; the inspection list preserves that behavior while remaining read-only for
    the Codex adapter. Preserve the disposable non-repository cwd and every proof, verdict,
    finality and cleanup rule.

    Add an injectable `spawnWorker` seam to `runReview`, defaulting to the production function, so
    a test can drive the real call site without a paid model. The test must observe the cwd while it
    exists, prove it is not a Git repository, capture the exact inspection-only tool list, and pass that same
    shape through `spawnCodexWorker`'s containment recorder to prove the argv contains
    `--skip-git-repo-check`. This closes the caller-to-adapter gap W1-T2748's synthetic test missed.
  acceptance:
    - claim: "the production `runReview` spawn passes the explicit inspection-only tool list from its non-repository semantic-review scratch directory"
      proof: "unit test: test/codex-reviewer-production-wiring.test.ts"
    - claim: "that exact production shape makes the Codex adapter emit `--skip-git-repo-check` and read-only sandboxing"
      proof: "unit test: test/codex-reviewer-production-wiring.test.ts"
    - claim: "the test drives `runReview` through an injected worker boundary rather than calling only the provider adapter"
      proof: "unit test: test/codex-reviewer-production-wiring.test.ts"
    - claim: "the semantic reviewer still receives its mount model, effort, turn cap, prompt and disposable cleanup contract"
      proof: "unit test: test/codex-reviewer-production-wiring.test.ts"
    - claim: "removing the production tool declaration reproduces the no-bypass argv and fails the suite"
      proof: "unit test: test/codex-reviewer-production-wiring.test.ts"
  falsifier: |
    Close without implementation if the current production `runReview` call already supplies a
    read-only tool list, or if a live Codex semantic review on current main starts a thread from the
    scratch cwd. Both were checked: the call omits `tools`, and the live row has no session/tokens
    and the exact trust-gate refusal.
  note: |
    ID PROVENANCE: `rmd next-task-id --reserve` printed advisory W1-T2828 but found that reservation
    already held, then atomically held `refs/rmd-id/W1-T2829`; the held id is authoritative.

    This is not a request to recycle or rebuild the container. No Dockerfile or dependency changed
    between the running image revision and main, and a process restart cannot manufacture the
    missing call-site argument. The fix must merge first; the daemon's existing self-freshness
    restart can then load it from the mounted checkout.
