  rationale: |
    At b6a1855751aed8fdfb8f52d755574e6b94216079, reviewCommand defaults fetchView
    to synchronous ghJson re-exported by worker.ts and calls it before reading the
    qualified PR state. W1-T11162 keeps plan-only review in-process, so W1-T11458's
    loop marker can reach this default. A private pinned-Node native TAP diagnostic
    proves the real reviewCommand default throws actual GhPaceWouldBlockError before
    its private CLI child on a pending shared gap. Opening only the gap reads one
    valid closed PR and returns the existing decline code 2, without materialization
    or head fetch. One test passes with literal TAP summary, no skip or cancellation.
    The three relevant review/worker/transport blobs are identical on fresh main
    657b1e80a303e98f259b9839f5ac3bb4ac203f6f. Evidence is in Remudero-notes/sol/
    S5-review-startup-probe.tap.log and S5-review-view-source-reconciliation.json.
    Live positive ledger rows for #17227 record post-review refusal at 22:17:08Z
    with a 25ms pacer gap, then retryable backoff at 22:29:31Z. Those rows prove
    a transport refusal blocked that attempt, but do not pin its exact read site;
    the isolated default-call control supplies this task's source counterexample.
    Main plus fourteen captured open-head plan trees were searched with W1-T11458
    positive controls on every head. No distinct initial-review-view migration was
    added by those heads. W1-T4970 supplies awaited transport; W1-T11459 changes
    review-worktree Git, not this GitHub read. W1-T11628's clone leaves and W1-T11629's
    daemon lane boundary are separate. The earlier inventory followed transport and
    worker-facade bindings at direct calls; this default function reference was not
    a direct call. Default-reference tracking is an explicit audit extension.
  design: |
    Make exactly reviewCommand's initial qualified PR-view read use the existing
    awaited GitHub transport and await its result before raw state, mapping or body
    access. Preserve dependency injection for existing synchronous fixtures while
    allowing async readers. Preserve owner/repository/PR qualification, REST versus
    branch normalization, closed-before-fetch refusal, auth/rate-limit/error provenance,
    cadence/broker admission and every later review/claim/worktree/status guard.
    Add no retry loop, fixed wait, retry-ceiling change, status bypass or false empty
    result. A denied or malformed read cannot materialize, spawn, spend, claim, post
    pending/terminal status, comment or arm. This task does not convert other reads.
    Exercise the real default seam using contained private CLI/cache/local fixtures.
    A heartbeat must run while admission waits; exactly one child runs after genuine
    admission, with the original target. Test numeric and branch view normalization,
    safe closed decline and auth/malformed-read failures. Keep every existing test
    input, assertion, expected value, timeout and skip unchanged. New tests use
    repository aliases and shared repo-root helpers. rmd test-place computed test/review/.
    Preserve the active W1-T11459 owner and reconcile any overlapping source work
    before building; a filing does not transfer ownership or authorize competing edits.
