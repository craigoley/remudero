  rationale: |
    WHY: the inbox draft lane is 66% of all produced spend ($2,258.5 of $3,400.75 subscription notional,
    2026-11-05 to 2026-11-19), and part of it drafts proposals again.
    OBSERVED (ledger union): 101 draft rows, $152.04 ($3.90 paid), came after an earlier row for the same proposal
    with subtype success. That count includes relint retries inside one run, where a worker success failed the
    plan lint, so it is an upper bound for this task's waste.
    UNVERIFIED: counting every second-or-later draft row of a proposal gave $2,160 (63.5% of all spend), and an
    averaged count gave $247. The gap is probably $0 Codex first drafts followed by Claude redrafts. The recheck was
    not run. Criterion 1's draft_input_key makes the true number countable.
    OBSERVED in code (inbox.ts): proposalsNeedingDraft skips a proposal only while the drafts cache holds a draft
    with the same anchor fingerprint. draftAttemptKey includes the lane's deployment and effort, so a lane change
    makes every uncached proposal due again ("old lanes become due once"). pruneOrphanedDraftsAsync and
    evictRefusalPoisonedKeys can remove cache and attempt entries, and the ledger is never asked whether a clean
    draft at the same input already exists.
  design: |
    INVARIANT one-clean-draft-per-input: at most one lint-clean draft is paid for per proposal and draft input
    (anchor fingerprint plus reframe count); a new input always drafts.
    1. inbox.ts: draftInputKey(proposal) = anchorFingerprint plus reframe count. Write it as draft_input_key on
       inbox.draft_synthesized and inbox.drafted rows.
    2. cleanDraftInputKeys(ledgerRows) maps proposal id to the draft_input_key of its newest lint_clean
       inbox.drafted row. draftsDueOnDaemon takes it and leaves out a proposal whose current draftInputKey is in it,
       whether or not the cache or the attempt key still holds that draft. A missing cache entry for such a proposal
       is logged once as inbox.draft_cache_missing (declared in ledger-steps.ts) and is not redrafted.
    3. The lane identity stays in draftAttemptKey for failed attempts only; a clean draft is never redone for a lane
       change. The manual rmd inbox force path is unchanged.
  falsifier: |
    Drop the cleanDraftInputKeys filter: criterion 2's fixture, with an empty cache and a clean ledger row, drafts
    the proposal again and the test fails.
