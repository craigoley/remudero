  falsifier: |
    Revert `|| cancelled()` and the first test reddens (the cancelled arm is skipped again). Point the fan-out back at `--source clock-sweep` and the
    second reddens (one comment, no issue). Drop `anyLabel` and the third reddens (a relabelled thread is duplicated). Put `0` back out of the ladder
    and the +0 test reddens while the shifted-fuse control stays green. The no-new-drift and unchanged-default tests stay green in all four, which is what
    shows each change fires only on its own shape.
  note: |
    RISK BAND: `high` / `band_meaning: span` is Rule 19 SIZING (a workflow and three scripts read as more than one subsystem at `medium`), not
    danger: a weekly non-required job. SEQUENCING WITH W1-T5027, which also edits scripts/clock-sweep.mjs: THE TWO ARE INDEPENDENT BY DESIGN (this one
    touches only the ladder constant and one report line) BUT BOTH MEET THE COMMENT-LOAD CEILING: clock-sweep.mjs is at 153/153, so W1-T5027's
    SWEEP_BUDGET_MS doc comment and UNREACHED block cannot land as drafted without removing an equal number of comment lines from that file
    (recording a LOWER count, never raising the row); whoever lands second merges origin/main. W1-T5027 also makes the sweep red every week at
    today's population, so the per-suite fan-out is what turns that red into named, separately tracked work.
    DECISIONS FOR THE OPERATOR, stated so they are not made by accident: (a) per-suite issues are NOT auto-closed on recovery (no resolver keyed by prefix: the
    fixing PR closes the issue, and the preamble says so); a prefix resolver that closes a suite's issue once a COMPLETE later run no longer names it is the
    follow-up, and needs W1-T5027's 'unreached' list to know a run was complete. (b) The aggregate thread keeps its label-filtered lookup, so a
    relabelled aggregate is still replaced by a new one (#7059 after #5513); this task fixes that for per-suite issues only. (c) No Chromium install:
    add one (`npx playwright install chromium`, no --with-deps, per W1-T1027) the day a browser-launching suite enters the derived population; until then
    it would be dead time in a job that already overruns its cap. (d) `workflow_dispatch` cancelled by a human also opens an issue; its preamble says
    `cancelled`.
    scripts/ changes are diff-coverage-gated in CI even though `rmd preflight`'s scoped check says 'nothing to prove' on a scripts-only diff: run
    `npm run diff-coverage:local -- <tests>` on a committed tree and confirm `grep -c '^SF:scripts/clock-sweep-deliver.mjs$' <lcov>` is non-zero.
    Editing the workflow and scripts/clock-sweep.mjs fires clock-sweep.yml's own pull_request trigger: that run is not required, takes the full sweep,
    will be cancelled at 30 minutes (as 09-30's was), and delivers nothing because the `pull_request` event is excluded.
