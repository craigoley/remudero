  rationale: |
    THE CLASS (#11985, f0ccd8548, merged 2026-10-15 13:09Z). When a held loop resumes, Node runs due timers before it
    processes I/O. A child that has already exited still has its exit and its last stdout waiting in the pipe. Two
    things then go wrong:
    - execFile/exec with its own `timeout` option: the timer calls execFile's internal kill(), which DESTROYS stdout and
      stderr and signals a process that is already gone. The pending exit is code 0 with no signal, so the call
      RESOLVES with whatever it had read, often nothing. On 2026-10-15 `git config --list` resolved empty this way,
      and three pushes (W1-T9047 04:10:39Z, #11939 and #11918 07:36:46-47Z) ran with no credential helper and died on
      "could not read Username".
    - a hand-rolled `setTimeout(() => child.kill())`: the timer marks the call timed out and kills a child that had
      finished, so a complete, good result is reported as a timeout.
    #11985 added `loopAvailableDeadline` (src/lib/clock.ts) and `execFileLoopBounded` (src/lib/worktree-git.ts), and
    #11962 bounds the App-token exchange the same way. Only those three sites use it.
    MEASURED at origin/main dea228455 (2026-10-15 ~13:20Z), with the walk from
    test/no-daemon-loop-path-reaches-a-synchronous-spawn.test.ts: top-level functions, comments stripped, name-based
    reach seeded from daemonCommand (11,416 functions, 7,123 reached). Population: a body that makes an ASYNC child
    call (execFile, exec, spawn, or a promisify(execFile) alias) AND either passes a `timeout` option or arms a
    setTimeout/AbortSignal.timeout that kills the child. Five sync-only hits were removed by hand (mergeDirectViaRest,
    ghJson, ensureDeps, refreshProofToolchain, runSuiteShifted: a sync child does not race the loop). The reach is
    name-based, so it is an upper bound.
    34 daemon-reachable sites remain, besides execFileLoopBounded itself.
