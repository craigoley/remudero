  design: |
    1. ONE MECHANISM. Move execFileLoopBounded out of worktree-git.ts into src/lib/loop-bounded-child.ts, and keep a
       re-export so worktree-git's callers do not change. Beside it, add `boundChildByLoopTime(child, budgetMs, opts)`
       for a callback execFile or a spawn. Both arm loopAvailableDeadline (src/lib/clock.ts), which is unchanged:
       a firing that is late by at least a twentieth of its budget re-arms for the held time. That bound is relative
       to the call's own budget, so it adds no new fixed threshold (operator rule).
       The kill uses child.kill(signal), never execFile's internal kill(), so a pending exit keeps its stdout.
       The SIGKILL escalation (withGhKillEscalation, killAfterGrace) is armed by the same deadline.
    2. A KILLED CHILD IS A FAILURE. When the deadline expires, the helper records it. The call then REJECTS with a
       named LoopBoundedChildTimeout (callback forms: reports timedOut), even if the child traps the signal and
       exits 0. A killed child never resolves as a success with empty or partial stdout. Callers that already
       map a timeout to their own refusal (gitClaimRunnerAsync, gitReservationRunnerAsync, planSyncGitRunnerAsync,
       gitBlobRunnerAsync, defaultProofRunnerAsync, runBounded) keep those refusal shapes.
    3. ROUTE EVERY SITE ABOVE through the helper. Each call keeps its budget value. A site that is not a child
       process, or not on the loop, is not changed.
    4. CENSUS: test/no-daemon-loop-path-arms-a-wall-clock-child-timeout.test.ts. Reuse the sync census's walk
       (topLevelFunctions, stripComments, loopReachable seeded from daemonCommand). Export it from a shared test
       module, or import it, but never fork a second copy that can drift. Population: a reached function whose body
       makes an async child call with a `timeout` option, or arms a setTimeout/AbortSignal.timeout whose callback
       kills a child. The table is EXACT, like SYNC_SPAWN_LOOP_BASELINE, and EMPTY once this PR lands: a new site is
       named and refused. It carries a positive control (a planted execFile with `timeout:` in a reached function is
       named), and a sync call with `timeout:` must not count.
    5. A held-loop test drives the real helper: a child that exits at once while the loop is held past its budget
       resolves with its full stdout. A child that outlives its budget on a free loop is killed and rejects. This
       follows the fixture of test/a-host-git-call-keeps-its-credential-helper-through-a-held-loop.test.ts.
