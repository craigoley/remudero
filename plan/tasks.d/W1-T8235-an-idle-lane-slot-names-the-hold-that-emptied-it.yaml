    WHY, on origin/main 25067fc89:
      - src/lib/idle-lane-accounting.ts:80 `idleLaneCauseOf` returns null whenever `busyLanes > 0`. Two empty lanes
        beside one busy lane are "not idle".
      - src/lib/daemon.ts:5536 samples `sampleIdleLane(admitted.length, ...)` once per dispatching tick. The tick
        then awaits its lanes, often for an hour. Lanes that free and are held from refill inside that wait are
        never sampled.
      - IDLE_LANE_CAUSES (:19) has one `pause`, and `idleLaneCauseForStep` (:138) maps only `daemon.pause`, the wip
        and queue governor, value refusals, admission and headroom. An operator's pause, a recycle drain, a
        freshness restart latch, a phase bound and a boot gate are indistinguishable or unknown.
      - Nothing is charged while no daemon process exists (between an exit and the next boot's first dispatch).
  design: |
    No threshold is involved. This task only measures, and the detector that judges it is a separate task.
    1. THE UNIT IS A LANE-SLOT MINUTE. Idle slots = the lanes the daemon would fill right now (its own dispatch
       capacity for this tick, the same figure the refill path uses) minus implement lanes in flight, while
       dispatchable work exists. A busy lane never hides an empty one.
    2. SAMPLE AT EVERY LANE CHANGE: a lane frees, a refill starts, a refill is held (with its reason), a tick
       dispatches, a pause tick. Pass the in-flight lane count, not the tick's admitted count.
    3. NAMED HOLDS. Causes grow to: operator_pause (a PAUSE whose reason is not the fleet's own automation),
       recycle_drain (PAUSE "container recycle"), freshness_drain (stale code or a restart latch), phase_bound,
       boot_gate, governor (wip, queue, cost, headroom), claim_race, value_refusal, selection_empty, restart, and
       unknown. Map each from the step or refill-held reason the daemon already writes. Keep `unknown` unfolded.
    4. RESTART IS CHARGED. At boot, the interval from the previous process's last idle sample in the ledger union
       to this process's first dispatch is charged to `restart` (or `boot_gate` once the gate is up), at the
       previous sample's busy count.
    5. THE ROW. `lane.idle_summary` keeps its fields and meaning for display. It adds `capacity`,
       `slot_minutes_by_cause` and `holds` (for each pause-type cause: reason, setter pid, session id and actor as
       recorded on the PAUSE flag; W1-T7839 adds verified actor evidence later), so a detector can name the hold.
    6. TRANSITIONS ARE ROWS. When the (cause, idle slots, hold) triple changes, ledger one `lane.idle_changed`
       {cause, idle_slots, capacity, dispatchable, hold} row. Write it on change only, never per tick, so a detector
       can measure any window exactly without hourly granularity.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Replay the 16:16-17:08 shape:
    three lanes, one worker runs through, two free at 16:18 and 16:24, and refill is held by the recycle PAUSE
    until 17:08.
