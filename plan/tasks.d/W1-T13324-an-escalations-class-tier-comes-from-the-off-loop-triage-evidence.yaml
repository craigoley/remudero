- id: W1-T13324
  title: "An escalation's class tier comes from the off-loop triage evidence: triageRoute no longer reads the whole ledger union synchronously for a tier that the production evidence then replaces, so raising an escalation no longer stalls the daemon loop (four stalls of 112 s to 196 s in six hours on 2026-11-17)"
  repo: remudero
  depends_on: []
  priority: 1
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the tier decides whether an escalation reaches the operator or is demoted to a digest; a wrong or missing tier hides an escalation, and the rule that unreadable evidence delivers to needs-human must hold
  origin: "operator-session#loop-lag-2026-11-17"
  plan_refs:
    - W1-T12753
