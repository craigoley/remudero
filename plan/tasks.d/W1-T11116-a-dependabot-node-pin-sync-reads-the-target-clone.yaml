  rationale: |
    OBSERVED 2026-11-02, PR #15176 (Dependabot: node 24.21.0-bookworm-slim -> 24.22.0-bookworm-slim in deploy/Dockerfile):
    - Red since 2026-10-28 on ci-shard 3/8 (W1-T2770) and 5/8 (W1-T5883). Both require deploy/Dockerfile's Node version to equal .nvmrc, and Dependabot edits the FROM line only (cao825's PR comments, 10-28).
    - W1-T6258 exists for exactly this: the dep-review lane commits a synced .nvmrc on the Dependabot head. Every pass since logs dep-review.node_pin_refused "deploy/Dockerfile, .nvmrc or the head ref could not be read" (07:46Z, 14:29Z, 16:52Z), then dep-review.decided hold on red checks.
    - depReviewCommand passes config.root to defaultNodePinSyncIo, whose readAtHead runs git show <sha>:<path> there. config.root is /home/node/Remudero (host: ~/rmd-state2), which is not a git repository ("fatal: not a git repository"). repos/remudero under it is the target clone, and it holds the PR head d017fa762.
    - The W1-T6258 suite passes a git checkout to defaultNodePinSyncIo directly, so it never exercised this wiring.
