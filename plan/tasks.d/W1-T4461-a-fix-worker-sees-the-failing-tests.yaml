  rationale: |
    MEASURED 2026-09-24 over the fix.done rows since 2026-09-23T15:59Z: 62 of 65 fix rounds ended commit_refused ($73.51). Reasons: 37 missing COMMIT_MESSAGE line and 9 regenerable-baseline edits refused (both W1-T4450), 12 'the worker changed nothing', 8 'the task declares no files'.
    OBSERVED 2026-09-24: fix reports for W1-T4413, W1-T4416, W1-T4431, W1-T4404, W1-T4350 and #6807 say the log tail held only
    "Process completed with exit code 1" and the runner-image notice. fetchCiFailures takes annotations first
    (tailSource "annotations") and falls back to the log tail only when there are none.
  design: |
    (i) When a failing job's annotations name no test (only the exit line), read the job log and extract the TAP
    `not ok N - <title>` lines with their error/expected/actual blocks and the FLAKE-RETRY lines (the shape W1-T4398's coverage
    wrapper already prints), bounded per job. (ii) tailSource names which source was used; the prompt says so. (iii) The
    annotation path is kept for checks whose annotations DO carry the finding (lint-style gates).
  acceptance:
    - claim: "a test failure''s fix prompt names the failing test and its error"
      proof: 'grep: test("W1-T4461: a test failure''s fix prompt names the failing test and its error" in test/a-fix-worker-sees-the-failing-tests.test.ts'
  falsifier: |
    Keep annotations first and the test finds only the exit-code line in the prompt.
