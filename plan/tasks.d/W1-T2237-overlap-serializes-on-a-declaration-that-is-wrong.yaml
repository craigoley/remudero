  note: |
    NO REFUSAL, AND THE ARITHMETIC IS WHY. At 45.8% a refusal on scope overrun would block roughly
    half of all merged implementation work. W1-T434 already removed one refusal on this exact path
    because it destroyed the evidence separating a phantom revert from an under-declared `files:` —
    the two shapes produce an identical file list — at roughly $29 of already-completed work per
    firing, while the class it targeted merged anyway through the worker's own sandbox push. Its own
    comment says the guard "could never contain a worker". Nothing in this shard reintroduces a
    refusal at any rung: not at dispatch, not at push, not at review.

    THREE THINGS STAY EXACTLY AS THEY ARE. `declaredScopeViolation` (`src/lib/task-linter.ts`) keeps
    firing only on an absent or empty `files:` and keeps exempting `verify: human` — W1-T1030
    already found it blocking records the dispatcher can never reach, and widening it is not the
    answer here. The review-side advisory stays OUT of `state` and `floorState`; `src/lib/review.ts`
    says in terms that it folds into neither, and this shard does not make an advisory binding. And
    the fix rung's own pre-strike gate (W1-T1227) keeps its two regimes and keeps declining to
    re-flag what it inherited.

    A TEST FILE A WORKER LEGITIMATELY NEEDS MUST STILL BE ADDABLE. That is the single hardest
    constraint here and it is what rules out every refusal-shaped remedy: 123 of the 301 comparable
    merges overran onto a `src/` or `test/` path, and a large share of those are a worker adding the
    test that makes its own change reviewable. The remedy is a declaration the author updates or a
    report they read, never a gate that forces a worker to ship untested.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS, AND THE BAND WAS MEASURED RATHER THAN CHOSEN.
    Filed at `medium` first; `rmd lint-plan --base origin/main` exited 1 with, verbatim:

      [sizing] spans 2 distinct subsystems/concerns (dispatch-overlap, overlap-uses-observed-scope)
      at risk:medium — Rule 19: raise to risk:high or decompose into one task per concern

    Rule 19 derives the concern from each declared path's STEM, so a source file and the new test
    that falsifies it read as two concerns whenever the test is not named after the source.
    Decomposing a predicate from its own falsifier is not a real decomposition. AND THE BAND EXEMPTS
    RATHER THAN CLEARS: `sizingViolation` (`src/lib/task-linter.ts`) returns `undefined` on its
    first line at `risk: high`, so that refusal is the only scoring of this span this shard will
    ever get — recorded here because nothing downstream re-derives it.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH, AND NONE NAMES AN EXISTING FILE. Every criterion uses
    the pure-path `unit test:` form naming `test/overlap-uses-observed-scope.test.ts`, declared in
    `files:` and absent from this tree, so on the filing PR each resolves through W1-T456's
    forward-reference carve-out to `not_yet_built`. Falsified in the other direction: the same form
    naming an existing path executes and is graded on its result — the shape that red-lined #2707.
