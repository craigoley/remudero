- id: W1-T2647
  title: "THE CENSUS DENOMINATOR WAS NEVER WRITTEN DOWN — W1-T2478's rationale counted six census suites and five under the bound, head admits FOUR, the fifth candidate (test/enforcement-data-carveout.test.ts, ~2.1s alone) straddles the 2000ms bound and the sixth was never named: ship the QUERY that enumerates the census population from the live tree and give every derived member a recorded disposition, instead of a count nobody can reproduce"
