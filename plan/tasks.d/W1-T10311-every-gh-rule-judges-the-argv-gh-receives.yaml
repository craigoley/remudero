  design: |
    No new thresholds: the floor window, the broker routing, the exemptions and every rule's verdict stay as they are.
    1. ONE gh ARGV PER SEGMENT. From each `hr_tokens` segment, take the words gh will receive:
       - after a `gh` or `*/gh` word;
       - after `rmd gh [--class c] [--fresh] --` in any path spelling (`rmd`, `./bin/rmd`, `*/rmd`), as `gh_norm`
         already reads it.
       The words come de-quoted (hr_tokens already removes quotes), and an inline `-XPOST`/`--method=POST` is read the
       way `gh_api_is_write` reads it. A heredoc body word (`\036…`) or a redirection is not argv.
    2. EVERY gh RULE READS THAT ARGV.
       - Rule 2: an `auth login|logout|refresh|token|setup-git` argv.
       - Rule 4: a `gh api` argv that `gh_api_is_write` calls a write, aimed at a `repos/…/statuses/…` endpoint.
       - Rule 5 (worker lane only, unchanged): a `pr merge` argv, a `gh api` write to `repos/…/pulls/N/merge`, or a
         merging GraphQL mutation.
       - Rule 10: the porcelain write list, the `api rate_limit`/`auth status` exemption, and the invalidation's
         `<repo|*> <number>`.
       Each rule keeps its raw-text check too, so nothing it refuses today passes.
    3. LOCAL gh COMMANDS ARE NOT READS. `gh --version`, `gh version`, `gh help …` and any argv with `--help` make no
       GitHub call. Rule 10 neither routes nor floors them.
    4. FAIL OPEN AS TODAY. With no jq the hook has no `cmd` split and these rules keep their raw-text greps. A parse
       that yields no words changes no verdict.
    5. LEAVE `invokes_gh` AND RULE 7 ALONE (W1-T5670, W1-T9281). Correct rule 10's comment to call the polling-loop
       refusal rule 7.
    Tests drive the hook as test/gh-read-cadence-floor.test.ts does: RMD_GH_CACHE_HOME at a temp directory with a fresh
    heartbeat, and `--confine-file-tools` for the worker cases. Each case is paired with today's control. The file goes
    in test/github/every-gh-rule-judges-the-argv-gh-receives.test.ts, or the folder `rmd test-place` computes.
