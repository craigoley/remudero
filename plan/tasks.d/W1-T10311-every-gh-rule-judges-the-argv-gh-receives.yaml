- id: W1-T10311
  title: "THE DENY FLOOR'S gh RULES GREP QUOTED TEXT, SO A QUOTED VERB CHANGES THE VERDICT — `gh 'pr' 'comment' 1` is routed as a read, and `gh pr 'merge' 1` in a worker and `gh 'auth' 'logout'` miss the merge and auth refusals; judge every gh rule on the de-quoted argv gh will receive"
  repo: remudero
