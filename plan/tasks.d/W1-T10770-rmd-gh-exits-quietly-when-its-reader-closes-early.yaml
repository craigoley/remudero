- id: W1-T10770
  title: "`rmd gh` EXITS QUIETLY WHEN ITS READER CLOSES EARLY, INSTEAD OF DYING ON AN UNHANDLED EPIPE — ghCommand writes the broker's answer with a bare process.stdout.write and no stream error listener, so `rmd gh -- … | paste -s` (a reader that exits first) prints a Node stack trace, `Error: write EPIPE` at gh-read-broker.ts:1357/:1359/:1400, on every call"
