  rationale: |
    WHY: serve's projector thread (rmd-read-model) rose to about 0.10 cores on the Azure host on 2026-11-18, while its
    caught_up rows show it applies ledger rows at 12,873 rows in 861 ms. A 30 s inspector CPU profile of the thread
    at about 05:03Z (serve pid 25641) put consistencyCheckDue at 2,169 of 4,715 sampled ms inclusive (46%), all of it in
    history(): SELECT ... FROM consistency_run ORDER BY id with no LIMIT, mapped to objects, plus a share of the
    762 ms of GC. read-model-worker.ts tickSlot asks it on every tick of every instance.
    consistency_run is never pruned. Read-only counts on the host: console 11,714 rows, site 7,635, core 5,911, ops 3,
    all since 2026-10-01, growing by about 120-250 a day per instance. So the cost grows every day.
    consistencyCheckDue uses only history(db).at(-1), the newest row by id.
  design: |
    INVARIANT schedule-unchanged: due with no run, ORACLE_AGREE_INTERVAL_MS after an agreement, ORACLE_DRIFT_INTERVAL_MS
    after anything else, judged from the newest run by id.
    1. consistencyCheckDue reads `SELECT at_ms, outcome FROM consistency_run ORDER BY id DESC LIMIT 1`, after the same
       sqlite_master existence check history() makes.
    2. history() and its two callers in runConsistencyCheck are unchanged: they run once per check, not per tick.
    3. A new test counts the statements the due check reads through a recording ReadModelDb proxy.
    Not in scope: pruning consistency_run, and history()'s use inside a check.
  falsifier: |
    Restore history(db).at(-1): criterion 1 fails (an all() over 5,000 rows). Order by at_ms or drop DESC: criterion 2
    fails.
  note: |
    Id reserved for run-unfiled-1794978381246 with ~/rmd-work/bin/reserve-id.sh.
