  rationale: |
    OBSERVED TWICE ON THE AZURE FLEET ON 2026-09-08. Repair admission for PR #4522
    (W1-T2902) and PR #4618 (W1-T2907) emitted
    `sweep.fix.checkout_claim_declined` with `owner_recovery_reason:
    local_commit_not_contained`. In each case the registered `sweep-<task>-<epoch>` worktree
    later had no surviving worker process, but the PR remained red and no replacement fixer
    could own the branch. This is not a review-width problem: the repair lane classified the PR
    as fixable and then declined before spawning its worker.

    W1-T2863 preserves a surviving registered owner across daemon freshness changes, while
    W1-T2952 deliberately reclaims only a clean dead owner whose local HEAD is already contained
    by the exact remote PR head. That safety floor is correct, but its `ahead_or_diverged` state
    returns before reading the independent branch-claim and process-cwd signals. Therefore a
    worker that dies after `git commit` but before `git push` is preserved forever, and the
    level-triggered sweep repeats the same refusal forever. W1-T2839 already provides the
    non-destructive primitive for the harder case: it preserves an unheld divergent local tip
    under `refs/rmd-recovery/fix/...` before moving the branch back to the remote head.

    THE REMEDY IS SALVAGE, NEVER DISCARD. Extend the bounded owner snapshot so `ahead` and
    `diverged` are distinct and so a clean, exact owner still has its live-claim and process-cwd
    signals measured. When every abandonment signal is clear and local HEAD is a strict
    descendant of the exact observed remote PR head, push that exact local SHA as an ordinary
    fast-forward guarded by the remote SHA already observed, then re-read the remote ref. Only a
    verified exact match permits the ordinary W1-T2952 reclaim path to continue. This lets CI
    judge the dead worker's committed repair instead of paying a second model to recreate it.

    A diverged tip must never be pushed over the PR head. Under the same clean/dead/exact-owner
    proof, preserve the exact local SHA under W1-T2839's recovery namespace before removing the
    abandoned registration; verify the recovery ref, then let the existing checkout path reset
    the local branch to the exact remote head and dispatch one replacement fixer. Dirty trees,
    live or unreadable process/claim probes, changed remote heads, failed pushes, failed remote
    verification, failed recovery-ref writes, and ambiguous ancestry all keep the owner and emit
    a named reason. No force push, commit synthesis, stash, kill, branch deletion, or merge is
    allowed.
  design: |
    Keep the pure decision separate from effects. Replace `ahead_or_diverged` with an explicit
    ancestry state (`contained`, `ahead`, `diverged`, `unknown`) and continue the snapshot through
    claim/process census for both non-contained states after path, attachment, tree and remote
    identity have passed. The pure decision returns one of three actions: reclaim-contained,
    publish-ahead, or preserve-diverged; every ambiguous or occupied signal remains a named keep.

    Add injected effect seams to the registered-owner recovery bundle. The ahead publisher takes
    branch, local SHA and observed remote SHA, performs a non-force fast-forward push of the exact
    object, and verifies the remote ref equals local SHA before returning. The divergence
    preserver calls the existing recovery-ref primitive or a shared extracted wrapper and verifies
    the exact object before any worktree removal. After either effect, re-read the registered owner
    and remote/ref facts before proceeding. A compare-and-swap race or any unreadable verification
    stands down for the next sweep with all work still named.

    Telemetry must distinguish `checkout_owner_ahead_published`,
    `checkout_owner_divergence_preserved`, and the bounded failure reason, carrying PR/task/branch,
    twelve-character SHA prefixes and the recovery ref where applicable. Never log command output,
    credentials, or an unbounded path. Reuse the existing branch claim, canonical `git worktree
    remove`, checkout recovery, repair dispatch and cleanup paths; do not add a timer or reaper.
  acceptance:
    - claim: "a clean managed dead owner whose local HEAD is strictly ahead of the exact remote PR head is fast-forward pushed by exact SHA, remotely verified, reclaimed, and the same poll does not strand the branch"
      proof: "grep: W1-T3170 ahead owner is published before reclaim in test/fix-branch-checkout-serialization.test.ts"
    - claim: "an ahead publish uses no force push and fails closed when the remote changes, the push fails, or the post-push remote ref does not equal the local SHA"
      proof: "grep: W1-T3170 ahead publish fails closed in test/fix-branch-checkout-serialization.test.ts"
    - claim: "a clean managed dead owner whose tip diverges from the exact remote PR head is preserved under refs/rmd-recovery/fix before removal, then one replacement repair proceeds from the remote head"
      proof: "grep: W1-T3170 diverged owner is preserved before reclaim in test/fix-branch-checkout-serialization.test.ts"
    - claim: "ahead and diverged ancestry are distinguished, and both are measured through the existing live-claim and bounded process-cwd proof rather than returning before abandonment is known"
      proof: "grep: W1-T3170 ancestry continues through abandonment probes in test/fix-branch-checkout-serialization.test.ts"
    - claim: "a dirty tree, live claim, process in the owner, changed remote head, foreign path, wrong attachment or unreadable probe preserves the owner without push, recovery-ref write, removal, checkout or worker spawn"
      proof: "grep: W1-T3170 unsafe owner salvage refuses effects in test/fix-branch-checkout-serialization.test.ts"
    - claim: "successful salvage emits bounded action-specific telemetry and reuses the existing exclusive branch claim, canonical worktree removal and fix dispatch paths"
      proof: "grep: W1-T3170 salvage telemetry and dispatch are single-path in test/fix-branch-checkout-serialization.test.ts"
    - claim: "deleting the ahead/diverged salvage arm reproduces the permanent local_commit_not_contained stand-down and fails the focused suite"
      proof: "grep: W1-T3170 falsifier deletes salvage and restores permanent stand-down in test/fix-branch-checkout-serialization.test.ts"
  falsifier: |
    Close without implementation if current main already proves a registered ahead/diverged fix
    owner abandoned, publishes or preserves its exact local tip, and resumes repair without an
    operator. The source at 66fcc49a returns `local_commit_not_contained` before claim/process
    census and has no owner-salvage effect; the two fleet ledger rows are the production
    counterexamples.
