  rationale: |
    READ 2026-10-09 at origin/main 500b53676: src/lib/read-model-worker.ts:1623 marks only `now` readPaced. The
    factories at :1620 (repositories), :1627 (workstreams) and :1629 (host) carry no flag, so `paced` (:1203) keeps
    them on cost / share whatever their readers do. #10411 introduced read pacing and #10435 made serve judge a paced
    body stale by the build that made it, so pacing no longer risks serving a stale body as fresh.
    OBSERVED over 45 h on the fleet host: workstreams was read once, host twice, repositories 33 times. Low value:
    these views cost far less than `now`, so this is a tidy-up, not a fix.
  design: |
    Add `readPaced: true` to the repositories, workstreams and host factories. Keep host's own 60 s re-probe if a
    reader depends on it; nothing else changes.
  acceptance:
    - claim: "the repositories, workstreams and host view units stretch their cadence while unread"
      proof: 'grep: test("W1-T7394: repositories, workstreams and host are read-paced" in test/rarely-read-views-are-paced-by-their-readers.test.ts'
  falsifier: |
    Leave the factories unflagged: an unread unit keeps its unstretched due time and the test fails.
