- id: W1-T11810
  title: "An aged UNKNOWN test-slot hold is surfaced without being cleared — `rmd doctor` reads the slot dir and WARNs `test-slot-holds` on each aged hold with W1-T11809's fields and verbatim recovery command, so the hold reaches the owner lane from a host-level surface instead of only a stalled preflight's stderr"
  repo: remudero
  depends_on: [W1-T11809]  # reuses judgeTestSlotHoldAge; never re-derives the aged judgment
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19 merits test YES: one invariant (`rmd doctor` reports test-slot-holds) needs the doctor.ts judge AND its doctorCommand input gather together; report-only, no release path
  band_meaning: span
  origin: architect
  plan_refs: [W1-T11809, W1-T11808, W1-T6261]
  files:
    - src/lib/doctor.ts
    - src/lib/report-commands.ts
    - test/doctor-surfaces-an-aged-unknown-test-slot-hold.test.ts
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ at this worktree's HEAD: today an aged hold shows up only in the waiting preflight's own stderr
    (`test_slot.waiting` once, then `test_slot.wait_bound_exceeded` at 45 min). No host-level surface reads
    the slot dir. src/lib/doctor.ts has report-only judges for inflight locks (`judgeLockDivergence`, W1-T6261's
    per-namespace judgment) and git locks (`judgeStaleGitLocks`), but none for test slots. Their inputs are gathered
    in src/lib/report-commands.ts `doctorCommand` (`gitLocks: readGitLocks(...)`), which is the seam this check follows.
    W1-T10251 records what the missing surface cost: the hold was found only after a builder's preflight stalled, and
    the file was moved by hand.
    Rule 19 merits test (#588): the acceptance asserts ONE cross-file invariant: `rmd doctor` emits a
    `test-slot-holds` check. A doctor.ts judge with no doctorCommand input is unreached (the call-site rule), and an
    input with no judge reports nothing. Neither half can be satisfied alone, so this is risk:high with band_meaning: span.
    DECOMPOSED OUT: an earlier draft also had the daemon append a deduplicated `test_slot.aged_hold` ledger row on its
    ticker (src/cli/commands/daemon.ts). That is a separable concern (merits test NO), so it is not in this task. It
    needs its own follow-up filing that depends on this task. The shard filename keeps its original slug because the
    reserved id and path were already allocated.
    Settled by lookup: is a test-slot doctor check already filed? -> no (plan/tasks.d sweep for doctor
      with test-slot, aged_hold, owner_aged).
    Settled by lookup: may surfacing clear a hold? -> no. Doctor's contract is report-only ("doctor reports and
      stops", judgeStaleGitLocks), and the brief says surface/route aged unknown holds "without clearing them".
  design: |
    1. INPUT. report-commands.ts `doctorCommand` lists `slot-*.json` in `resolveTestSlotDir()` (read-only, bounded,
       link-refusing; an unreadable dir is UNKNOWN, never "no holds") through an injectable `deps.readTestSlotHolds`.
       It hands the parsed records to a new doctor.ts judge `judgeTestSlotHolds(records, facts, now)`. That judge
       calls W1-T11809's `judgeTestSlotHoldAge` once per record, using this process's host, boot, pidNs and cgroupNs.
    2. DOCTOR CHECK `test-slot-holds`. OK when no hold is aged. WARN per aged hold, naming slot, label, host, namespaces,
       age, missingEvidence and the verbatim recovery command. UNKNOWN when the dir is unreadable. Detail line: "doctor
       reports only; the owner lane releases via scripts/test-slot-owner-release.mjs".
    3. The check never unlinks, renames or rewrites a slot record or mutation guard. It never signals a process and
       never reads another process's environ.
    4. TESTS go in the new file, with an injected slot-dir reader and clock: an aged foreign-namespace hold WARNs with
       its recovery line and the record is byte-identical afterwards; a fresh hold is OK; an unreadable dir is UNKNOWN;
       `doctorCommand` with an injected reader includes the `test-slot-holds` check.
  acceptance:
    - claim: "doctor WARNs on an aged unknown hold with its recovery command, reports a fresh hold OK and an unreadable slot dir UNKNOWN, and leaves every record unchanged"
      proof: "unit test: test/doctor-surfaces-an-aged-unknown-test-slot-hold.test.ts"
    - claim: "the doctor judge reuses the shared aged-hold judgment"
      proof: "grep: judgeTestSlotHoldAge( in src/lib/doctor.ts"
    - claim: "rmd doctor's command path calls the new test-slot judge"
      proof: "grep: judgeTestSlotHolds( in src/lib/report-commands.ts"
  falsifier: |
    At HEAD doctor has no `test-slot-holds` check, so the test fails. If the check deletes the aged record, the
    byte-identical assertion fails. If report-commands.ts drops the call, the call-site grep misses.
