- id: W1-T2660
  title: "THE FLEET MEASURES ITSELF FOUR TIMES A DAY AND NO SURFACE SHOWS IT — measurement_cadence.ran rows carry rule efficacy, verdict calibration, autonomy, adoption, proof debt and the verb census, and serve.ts, board.ts, status-board.ts and the digest read none of them; render the latest measurement per verb on the console with its as-of, its previous value and its refusals as refusals"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: |
    RE-DERIVED AT 74e130251 (2026-09-02).

    (1) THE PRODUCER RUNS; THE CONSUMER DOES NOT EXIST. plan/policy.yaml's `measurementCadence`
    row reads `enabled: true`, `minIntervalMinutes: 360`, `maxPerDay: 4`, so
    `runMeasurementCadenceReport` (src/lib/measurement-cadence.ts) writes up to four
    `measurement_cadence.ran` rows a day, each carrying every verb's `status: "measured" |
    "refused"` and figures — rule-efficacy, verdict-calibration classes, the autonomy rate, the
    adoption report (W1-T2266), the proof-queue audit, the verb census (W1-T2485), the board review
    (W1-T2304). Readers of those rows at this sha: `git grep -nE
    'calibration|autonomy|efficacy|adoption|measurement_cadence' -- src/lib/serve.ts
    src/lib/board.ts src/lib/status-board.ts` reads 0 (control: the same pattern over
    src/lib/measurement-cadence.ts reads dozens). src/lib/digest.ts mentions the verbs twice, both
    in comments. The only place a human can read the fleet's own health measurements is the raw
    ledger, on the fleet host, with a grep.

    (2) THIS IS THE SHAPE THE 2026-09-01 SYNTHESIS NAMED. "Correct code that nothing calls, warned
    about each time": the producers were built with cadence and care, the consumer was a follow-up
    in prose, and prose follow-ups evaporate. W1-T2579 will be the first machine consumer (the arm
    gate reading calibration bands); nothing is scheduled to be the first human one. The operator
    runs a board sweep by hand while the board omits the four numbers that say whether the system
    is getting better.

    (3) STANDING RULE 22 DECIDES THE RENDERING. Claimed versus evidenced state, applied to pixels: a
    verb whose latest row says `refused` is rendered as a refusal with its reason, never as a zero
    or a blank; a verb with no row at all renders "never measured", never 0%; every figure carries
    its as-of time and the previous row's figure so the reader sees direction without a chart. The
    console's ledger-first doctrine (W1-T184) applies: the rows come from the ledger union
    (`resolveLedgerUnion`), never the live file alone, because `measurement_cadence.*` rows rotate
    like any other step and a live-file read would show "never measured" the day after a rotation.
  design: |
    (i) ONE READER, IN THE VERBS' OWN MODULE. `latestMeasurementRows(stateDir, n)` in
    src/lib/measurement-cadence.ts: the last `n` `measurement_cadence.ran` rows from the ledger
    union, newest first, parsed into the report's own result type (the row is built from that type,
    so the reader inverts the writer rather than re-describing it). A union that reads `ok: false`
    returns an `unreadable` result, never an empty list — the W1-T119 distinction.

    (ii) ONE PANEL. `renderSelfMeasurement` in src/lib/serve.ts beside `renderDaemonHealth`: one
    row per verb — name, latest figure or refusal reason, as-of, previous figure — plus the cadence
    row's own next-fire time from the marker, so a stalled cadence is visible as such. Wipe-test
    pairs join this panel when W1-T2659 lands; the panel renders whatever verbs the row carries and
    hides nothing it does not recognise.

    (iii) TESTED THE WAY THE HOUSE TESTS serve.ts: a fixture ledger with measured, refused and
    absent verbs, rendered deterministically and exercised in a real Chromium via Playwright
    (test/serve.*.test.ts is the pattern), asserting the refusal text, the never-measured text, and
    the as-of.

    (iv) WHAT DOES NOT CHANGE. No measurement is computed here. No cadence, no policy, no
    threshold. The rows' shape is the writer's; this task reads it.
  acceptance:
    - claim: "the console renders the latest measurement of each cadence verb with its as-of and previous figure, read from the ledger union and not the live file alone"
      proof: "unit test: test/serve-self-measurement.test.ts"
    - claim: "a verb whose latest row is a refusal renders the refusal reason, and a verb never measured renders as never measured rather than zero"
      proof: "unit test: test/serve-self-measurement.test.ts"
    - claim: "an unreadable ledger union renders as unreadable, never as an empty panel"
      proof: "unit test: test/serve-self-measurement.test.ts"
    - claim: "the panel renders deterministically from a fixture ledger in a real browser"
      proof: "unit test: test/serve-self-measurement.test.ts"
    - claim: "the console calls the reader that inverts the cadence writer"
      proof: "grep: latestMeasurementRows( in src/lib/serve.ts"
