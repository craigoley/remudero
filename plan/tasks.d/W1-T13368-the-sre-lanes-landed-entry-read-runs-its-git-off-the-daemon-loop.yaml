  rationale: |
    WHY: before it files an incident, the SRE lane asks git whether origin/main already holds that incident's
    feedback entry. The question is a synchronous `git show`, once for each feedback root, and it runs on the
    daemon loop for each candidate the pass looks at. The staging of a new filing is synchronous too.
    MEASURED on the core ledger (~/rmd-state2/state), one pass over the live file on 2026-11-17,
    daemon.loop_stall_profile rows of the newest boot (ba5bd4f639 at 09:40:09Z), 12:06:52Z to 12:28:57Z:
    - runSreLanePass is in the top inclusive frames of 16 of 115 stall rows (85.6 s of 817.9 s of lag).
    - Each of those 16 rows has synchronous spawn time attributed to one caller chain that ends in runStepsSync:
      32 calls and 4.49 s in total, two calls in each row. `spawn` through execFileSync is 3.2 s of self time
      in 15 of the rows.
    READ at origin/main cfbace2640:
    - src/lib/sre-lane.ts:406: `readLanded` is `deps.readLandedEntry` or readLandedFeedbackEntry(deps.root, id). The
      daemon's input (:469) sets no readLandedEntry. :409-410: worstOpenIncident takes a synchronous test that
      calls landedIncidentOpen (:201) for a candidate that is not open in the working tree.
    - src/lib/feedback.ts:593 readLandedFeedbackEntry runs readLandedFeedbackEntrySteps (:597) through runStepsSync
      with SYNC_CAPTURE_IO (:739), whose git is execFileSync (:728). :597-604 reads each host feedback root and
      refuses two copies with different bytes (:587 assertOneFeedbackCopy). :614: a git failure returns null.
    - src/lib/feedback.ts:740 ASYNC_CAPTURE_IO runs the same steps over hostWorktreeGitAsync, and :1013
      stageFeedbackCaptureAsync (W1-T13183) is the awaited form of stageFeedbackCapture.
    - src/lib/sre-lane.ts:419 still calls the synchronous stageFeedbackCapture.
    NOT COVERED: W1-T13183 (merged) made the sweep's capture awaited and did not change the SRE lane. W1-T9624
    (merged) added the landed-entry check. W1-T13367 moves the lane's ledger reads. W1-T13334 (queued) covers
    `listFeedback`. Swept plan/tasks.d and plan/tasks.yaml for readLandedFeedbackEntry and stageFeedbackCaptureAsync,
    and the 11 open pull requests on 2026-11-17: no other filing.
  design: |
    INVARIANT no-synchronous-git-in-a-pass: the landed-entry read and the staging of a filing run no synchronous child process on the daemon thread.
    INVARIANT a-landed-open-incident-is-never-filed-again: an incident whose entry is open on origin/main is passed over, and a git failure reads as absent.
    1. src/lib/feedback.ts: export readLandedFeedbackEntryAsync(root, id). It runs readLandedFeedbackEntrySteps
       through runStepsAsync with ASYNC_CAPTURE_IO. The steps do not change, so the two-root rule and the
       failure rule are the same code.
    2. src/lib/sre-lane.ts: `readLandedEntry` may return a promise; the default is the new function. The choice
       of the worst incident becomes awaited: walk the candidates in the order worstOpenIncident ranks them
       and ask the landed question only for a candidate that is not already open in the working tree, as
       today. Keep the answers of one pass in a map so a fingerprint is asked once. Do not read every
       candidate ahead of time: that would run more git than today.
    3. The filing calls stageFeedbackCaptureAsync and awaits it.
    4. An injected synchronous readLandedEntry (the present tests) still works.
    5. TESTS use real git and a local bare remote for criterion 2, in the shape of
       test/a-landed-incident-is-never-re-captured-with-new-bytes.test.ts. Do not import that file. Count
       synchronous child processes as test/the-sre-lanes-suspect-commit-read-runs-off-the-loop.test.ts does. Load
       test/setup/tmp-hygiene.ts so no test reads or writes the host's config or state.
  falsifier: |
    At origin/main the pass calls execFileSync for each landed read and the 20 ms timer does not fire while git
    is held: criterion 1 fails. Treat a rejected git promise as present: criterion 3 fails. Read every
    candidate's landed entry before ranking: criterion 4 fails.
