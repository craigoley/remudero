  rationale: |
    OBSERVED 2026-09-30: src/run-task.ts parkedVerifyHumanShards filters `task.status !== "queued"` and computes
    depsAllMerged as `plan.byId.get(d)?.status === "merged"`. deriveStatus (src/lib/status.ts) credits `pr:` and
    counts `done` as landed, and the queue consults neither. The judge re-ruled W1-T3102 and W1-T3103 on 09-28 and
    09-29, six days after both were executed and credited; the operator then read them in the 18-item review.
  design: |
    The queue and its depsAllMerged read the same credited status the dispatcher and board use (deriveStatus or
    the merge-credit projection), so a credited or done shard is never queued for judgement and a done dependency
    counts as landed.
