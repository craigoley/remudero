    THE FALSIFIER WAS RUN, WHOLE-FIX. Reverting the detection block in `src/lib/worker.ts` to the
    pre-W1-T2777 4-line return-linked-or-failed shape moves the new suite from `# fail 0` to
    `# fail 5` (guards a, b, c, e, f — every one except the three pre-existing-outcome guards).
    Restoring returns `# fail 0` and preserves the pre-existing 14 tests in `test/worktree-node-
    modules.test.ts` unchanged. The three (d) guards stay green in both states — proving they
    are not accidentally coupled to the new detection.

    CALLER + CENSUS SWEEP: 8 files — every consumer of `linkWorktreeNodeModules`,
    `hashInstallInputs`, `installHashMarkerPath`, `NodeModulesLinkOutcome` — plus the new file,
    ran as `# tests 384 # pass 384 # fail 0`. Typecheck clean.

    NOT IN SCOPE, PER OPERATOR DIRECTIVE. Fixing repoDir's refresh cycle. Wiring the mismatch
    outcome to a caller-side escalation (worktreeAdd currently discards the return; a future
    task can decide what a mismatch means for dispatch). Bumping to a throwing failure — the
    file's own "never a throw" contract holds.

    NOT REPRODUCED HERE, DELIBERATELY: the failure the incident actually produces (a worker
    running `import`/`require` on a missing dep). Reproducing that would need a real worker
    spawn on a real npm-resolvable dep, cost real spend, and prove the same thing this
    detection prevents — that the worker never gets that far when the mismatch is loud at
    symlink time. Guard (a) is the closer of the two proofs.
