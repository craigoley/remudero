- id: W1-T2777
  title: "linkWorktreeNodeModules symlinks node_modules from a repoDir that may sit arbitrarily far behind the worktree's own origin/main HEAD, and a worker sees `Cannot find module` inside its own test as an apparent defect in its own diff — the drift bites BEFORE the code that would report it runs"
  repo: remudero
