- id: W1-T12185
  title: "The real ops reader preserves public dependency references for shadow composition while ordinary plan reads stay strict"
  repo: remudero
  depends_on: [W1-T11768, W1-T11769]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high
  band_meaning: span
  origin: architect
  plan_refs: [W1-T11768, W1-T11769, W1-T11770]
  priority: 1
  status: queued
  attempts: 0
  files: [src/lib/plan.ts, src/lib/plan-revision-store.ts, src/lib/ops-catalog-source.ts, test/plan/ops-catalog-source-cross-catalog-dependencies.test.ts, test/plan/ops-catalog-shadow-real-reader.test.ts, test/plan/ops-catalog-shadow-invalid-edges.test.ts, test/plan/ops-catalog-source-strict-defaults.test.ts]
  rationale: |
    W1-T11768 shipped the real pinned reader in #17485. Its module-level snapshotStore uses
    createPlanRevisionStore({ strict: true }); adopt calls mergePlanBlobs, whose validatedPlan rejects
    every dependency not present in the ops catalog alone. Thus a legitimate ops task depending on a
    public task arrives as malformed before the composer sees it. W1-T11769 shipped #17671 with the
    explicit known limit recorded in Decisions: its tests use hand-built plans, while the reader is
    unchanged. Its composer already permits ops-to-public dependencies, rejects the reverse direction
    and dangling IDs atomically, and resolves public IDs through the primary merged set.
    This was verified on main 3682565000518ba0f9835c273a3761376567a467 on 2026-11-10.
    W1-T11769 is already merged and credited; its later scope amendment #17722 is not an implementation
    of this gap. W1-T11770's three-file scope cannot repair the reader, so it gains this prerequisite.
    The source scope is unchanged; seven paths carry four distinct behavioral test-file proofs.
    The initial 15-head tree sweep found three subject records per head and no added subject lines.
    A refreshed 18-head sweep at 22:39Z found one related record in #17745: W1-T12163 isolates daemon
    tests from host memory and does not change this reader. No head overlaps these seven paths or
    files a competing reader implementation. Main e7eabfea has no intervening change in this scope.
  design: |
    1. Add an explicit opt-in parse/store mode that retains well-formed dependency identifiers not
       resolved within this catalog. Reuse parseTasksFromYaml's field validation. Scope the opt-in
       to the private ops reader; ordinary loadPlan/mergePlanBlobs and revision stores retain their
       existing strict dependency checks. Keep malformed YAML/fields and duplicate IDs refusing.
       Do not introduce global permissive state, invented dependency tasks or a placeholder merged set.
    2. Enable that mode only in ops-catalog-source.ts. Preserve pinned repository/ref/commit/blob
       identity, byte verification, bounded GET-only reads, frozen snapshots, refusal codes and
       private-data redaction. An unresolved ID at this stage is retained evidence for composition,
       never proof that the dependency exists or has merged.
    3. Feed the actual readOpsCatalogSnapshotAsync result into the existing shadow composer in tests.
       Do not replace it with a hand-built Plan. Prove a real ops-to-public edge blocks until the
       public dependency merges. The composer must still reject reverse and dangling edges atomically;
       dispatch candidates, claims, worker spawns and non-shadow ledger effects remain identical.
       The composer is unchanged and outside this task's source scope.
    4. Put reader/default-validation tests in
       test/plan/ops-catalog-source-cross-catalog-dependencies.test.ts and real-reader/composer tests
       in test/plan/ops-catalog-shadow-real-reader.test.ts. These paths were computed from the three
       source modules by computedTestFolder and approved by the operator. Use #src imports and the
       existing recording GET-only fixture pattern. Pin daemon memory governor, heap statistics,
       clock and boot-checkout state if driving the real loop, as W1-T11769 does.
       Put criterion 3 in test/plan/ops-catalog-shadow-invalid-edges.test.ts and criterion 4 in
       test/plan/ops-catalog-source-strict-defaults.test.ts. Use one whole-file proof per criterion,
       with independent assertions and deletion/restoration controls. Retain malformed, duplicate,
       dangling and reverse-edge negatives
       plus healthy public/ops controls. No test may query a private live catalog.
    5. This is source-only and SHADOW-only. No CLI flag/default target, selector activation, task
       movement/deduplication rule, allocator, credential/config, launcher, image, deployment, recycle,
       schedule or cutover change. Preserve owner STOP/PAUSE and operator override. W1-T11770 remains
       the separate opt-in producer stage and needs fresh selector/ownership checks after this merges.
  acceptance:
    - claim: "A well-formed public dependency ID survives the real pinned ops reader instead of making the snapshot malformed"
      proof: "unit test: test/plan/ops-catalog-source-cross-catalog-dependencies.test.ts"
    - claim: "The actual reader output resolves an ops-to-public dependency through the public merged set and blocks until that dependency merges"
      proof: "unit test: test/plan/ops-catalog-shadow-real-reader.test.ts"
    - claim: "Reverse and dangling edges refuse atomically with dispatch, claims and worker effects unchanged"
      proof: "unit test: test/plan/ops-catalog-shadow-invalid-edges.test.ts"
    - claim: "Ordinary plan reads stay strict and malformed or duplicate ops records still refuse"
      proof: "unit test: test/plan/ops-catalog-source-strict-defaults.test.ts"
  falsifier: |
    Remove the ops reader opt-in and criterion 1 becomes malformed and criterion 2 cannot compose.
    Apply permissive parsing to ordinary readers and criterion 4 must fail its unresolved-ID refusal.
    Bypass field/duplicate validation and criterion 4 fails its malformed/duplicate cases. Remove the
    existing composer edge checks in a disposable control and criterion 3 must fail. Restore each
    removed part and rerun the same verified tests. No passing hand-built Plan fixture substitutes
    for the real reader path or qualifies production activation.
