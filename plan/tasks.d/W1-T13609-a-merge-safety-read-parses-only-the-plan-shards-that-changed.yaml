    - claim: "invariant:same-merged-state — for the same blobs, the cached read and an uncached mergePlanBlobsQuarantiningDuplicates give the same MergedTreePlan: loads; quarantined with the same ids for a duplicate id across two shards and for an invalid shard; and a later read with the duplicate removed gives loads again"
