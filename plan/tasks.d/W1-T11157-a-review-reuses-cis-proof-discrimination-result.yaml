  type: implement
  verify: human
  principles:
    tdd: strict
  risk: high # Rule 19: one concern, where the review's proof outcomes come from; it spans the CI gate that publishes them and the review that consumes them, and it moves trust from the host executor to a hosted run
  band_meaning: blast-radius
  origin: operator-session#review-lane-findings-2026-11-02
  plan_refs:
