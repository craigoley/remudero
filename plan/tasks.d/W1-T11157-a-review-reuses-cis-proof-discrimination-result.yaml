- id: W1-T11157
  title: "A review reuses CI's proof-discrimination result for a head when the PR leaves the proof executor and its workflow untouched, instead of running every proof at head and base again on the loaded host — needs operator trust decision before build: the proof-discrimination check already runs each proof at the head and its merge base on a hosted runner, and the review spends 22.3 lane-hours a week on proofs, 44% slower under CPU pressure"
  repo: remudero
