    new build of W1-T13179 because PR #18956 is open. The 23:59Z "continue" did get a child at 00:03:58Z.
    Proof that counts in production: in the 3 days after the merge, no sweep.disposed row says "a concurrent
    sweep is already dispatching" while a sweep.fix.child row for the same fix key has no settle before it.
