      proof: "grep: W1-T12162 criterion 3 in test/worker/spawn/a-review-re-admitted-after-an-unable-reviewer-avoids-that-provider.test.ts"
  rationale: |
    OBSERVED 2026-11-10 on the Mac agent account, on unchanged main: three suites fail there and pass in hosted CI.
    - test/a-quiet-worker-round-end-is-resumed-from-its-checkpoint.test.ts fails 2 of 6 cases. The assertion "the dead claim is dropped from origin" finds refs/rmd-dispatch/W1-T10838, a real claim ref.
    - test/ledger/pr-state-answers-from-the-ledger-before-github.test.ts fails 1 of 17 cases: "the real broker client sends a single agent revalidation and writes no ledger rows". A read broker runs on that account.
    - test/worker/spawn/a-review-re-admitted-after-an-unable-reviewer-avoids-that-provider.test.ts fails 1 of 10 cases: "W1-T11432 criterion 1: overflow fallback retains an excluded Claude mount and records the unhonoured exclusion". Which host reading it takes is not established.
    - The ship pipeline on that account compares each failure with unchanged main, so these three do not block a push. They do cost a rerun on every preflight that selects them.
  design: |
    For each suite, first find the reading that leaves the fixture: run the failing case on the Mac agent account and record the command or the path in the pull request.
    Then fix that reading in the test: a fixture remote, a fixture socket path, or injected provider capacity.
    Add one case per suite that fails when the reading leaves the fixture. For example, point the real origin or the real cache directory at a path that fails on any read.
    NOT IN SCOPE: production code. If a suite can be fixed only through a new injection point in src, stop and report it; that is a separate task.
  falsifier: |
    Restore the host reading in each suite and its new case must fail. Restore the fix and require all three to pass on the Mac agent account and in hosted CI.
  note: |
    The same class on the Azure host is already in an open filing for the memory budget suite. This task covers the Mac.
