  design: |
    MEASURE FIRST (operator ruling): no change to ~/.codex, no daemon change, no new ledger step.
    1. scripts/codex-home-read-attribution.mjs: a pure `attributeCodexHomeReads(samples, attempts, opts)` and a
       `sample` subcommand with injected read ports. Per codex pid it records the read_bytes delta (/proc/<pid>/io),
       start time (/proc/<pid>/stat), parent pid, NSpid (/proc/<pid>/status) and the seconds it held a ~/.codex
       sqlite fd (fd readlink only). It never opens /proc/*/cmdline, environ or cwd.
    2. Each pid is joined to a codex worker.attempt (⋈ worker.assignment) by start time within a tolerance, with its
       lane; a pid with no match (a probe) is reported unjoined, never folded into a run. Bytes count as ~/.codex reads
       only in seconds the pid held such an fd. Totals are lower bounds (read_bytes spans devices; short pids and the
       last period are missed), and the report says so.
    3. docs/research/codex-home-read-options.md: measured bytes per run by lane and per probe, with window and
       method; the retention or relocation settings found in the pinned 0.162.1 docs (read from the image, e.g. a
       `docker exec … cat` the operator approves, never by running codex); and, under "## What each option loses", what
       pruning sessions, VACUUM, deleting or rebuilding state and thread_history, a per-instance CODEX_HOME and moving
       the files would each lose, given that ~/.codex is shared by three containers and the host CLI and holds the
       login. It ends with options for the operator, not a choice.
