    THE FAMILY BOUNDARY. W1-T1014 owns the cross-PR staleness that PRODUCES a collision and is under
    a standing instruction not to pick a remedy; #4313 already appended this instance to it, priced
    branch protection against it, and recorded the near-miss where the first repair took an id the
    fleet already held. None of that is re-filed here. W1-T2676 is duplicate SURFACE not duplicate
    id; W1-T2685 and W1-T2710 are the mint's own reporting. This shard begins after the collision
    exists and asks only where its repair belongs.

    THE DATES AND SHAS ARE A WINDOW, NOT A CONSTANT. The four commits, the two merged repair PRs and
    the ten-entry instrument surface were read at c51d944e on 2026-09-06. Re-derive before acting;
    a number carried forward from here is a claim about a tree that has moved. One figure in the
    first draft had already drifted while this was being written — the blocked-review issue opened
    against #4298 was still open during the recon and had closed at 21:06:43Z before filing — which
