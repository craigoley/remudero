    - claim: "The shard records rule 25's blindness as an executed predicate result with a blocking control, not as an assertion about a constant"
      proof: "grep: RULE 25 CANNOT SEE A PLAN RENAME in plan/tasks.d/W1-T2982-a-renumber-repair-has-no-home.yaml"
    - claim: "The shard distinguishes the rule that exists (who renumbers) from the rule that does not (where the renumber lands)"
      proof: "grep: THE CONVENTION SETTLES WHO RENUMBERS AND NOT WHERE in plan/tasks.d/W1-T2982-a-renumber-repair-has-no-home.yaml"
    - claim: "The shard states the outage-window objection that any ride-alone remedy must answer before it can be adopted"
      proof: "grep: THE ONE HARD QUESTION A REMEDY MUST ANSWER in plan/tasks.d/W1-T2982-a-renumber-repair-has-no-home.yaml"
    - claim: "The shard parks the decision rather than picking a remedy, and names the family boundary against W1-T1014"
      proof: "grep: THIS SHARD PICKS NO REMEDY AND MUST NOT BE READ AS PROPOSING ONE in plan/tasks.d/W1-T2982-a-renumber-repair-has-no-home.yaml"
