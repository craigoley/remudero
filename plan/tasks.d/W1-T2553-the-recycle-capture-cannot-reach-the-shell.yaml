- id: W1-T2553
  title: "WHEN A CONTAINER EXISTS THE RECYCLE READS CREDENTIALS ONLY FROM docker inspect AND THE SHELL FALLBACK IS UNREACHABLE — it lives in the else branch taken only when NO container exists, so since W1-T2311 began creating containers with an empty GH_TOKEN on purpose the captured value is empty forever, every recycle after the first refuses, and exporting the variable cannot help because that branch never looks there; the refusal then prints and this shell has none either without having read the shell at all"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 15.00
  files: [deploy/recycle-container.sh, test/recycle-capture-falls-back-to-the-shell.test.ts]
  origin: "operator-brief#app-auth-dispatch-claim-refuses-2026-08-30"
