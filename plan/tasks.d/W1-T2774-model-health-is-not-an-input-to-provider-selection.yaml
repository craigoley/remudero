- id: W1-T2774
  title: "provider selection measures subscription headroom but ignores live model health, so a known-degraded Claude model keeps receiving paid work even when a healthy same-capability Claude or assigned Codex route exists"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 48.00
  risk: high
  files:
