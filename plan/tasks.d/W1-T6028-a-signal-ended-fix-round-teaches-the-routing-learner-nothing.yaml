- id: W1-T6028
  title: "A SIGNAL-ENDED FIX ROUND TEACHES THE ROUTING LEARNER NOTHING — fixArmEvidence (src/lib/fix-routing-learner.ts) scores every fix.done row that is not commit_refused and has no red pushed head as accepted, so W1-T5999's signal_terminated row credits its arm a full acceptance, where before it scored a refusal; a process ended from outside (orphan sweep, deploy, OOM) says nothing about whether that arm's rounds commit"
  repo: remudero
  depends_on: [W1-T5999]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 2.00
  risk: medium  # Rule 19: one concern — which fix.done rows the fix-routing learner scores
  band_meaning: blast-radius
  origin: "operator session 2026-10-06: W1-T5999 (#9566) builder loose end (b)"
  plan_refs: [W1-T5535, W1-T5999, W1-T5998, W1-T6032]
  files: [src/lib/fix-routing-learner.ts, test/a-signal-ended-fix-round-teaches-the-routing-learner-nothing.test.ts]
  status: merged
  priority: 2
  attempts: 0
  rationale: |
    MEASURED 2026-10-06 13:47Z by replaying fixArmEvidence over the learner's own corpus
    (readFixRoutingRows: steps fix.done + fix.ci_not_green, 14-day read, 72 h half-life, prior weight 2)
    across the 396 .gz rotations and the live ledger.ndjson. 9 attributed fix.done rows had a codex worker
    end with error_exit_null: codex/gpt-6-sol 5 of 42 rounds, codex/gpt-6.1-sol 4 of 152. Posterior means:
      today (7 scored refused, 2 accepted):  gpt-6-sol 0.528, gpt-6.1-sol 0.387, prior 0.522
      signal rows excluded:                  gpt-6-sol 0.598, gpt-6.1-sol 0.398, prior 0.535
      as W1-T5999 writes them (accepted):    gpt-6-sol 0.659, gpt-6.1-sol 0.415, prior 0.547
    Claude arms carry no such row. Today the gpt-6-sol arm reads 7 points low; after W1-T5999 it reads 6
    points high. The live fix.routing_decision at 11:20:54Z (applied: true, gpt-6-sol rounds 41,
    accepted_weight 6.49) agrees with the replay. The reward is
    `row.subtype === "commit_refused" ? refused : pushed red ? ciNotGreen : accepted`, so every subtype
    other than commit_refused falls through to accepted.
    Differs from W1-T6032, which decides whether a signal-ended round COMMITS its leftover work; this task only
    decides how such a round is SCORED by the routing learner.
  design: |
    In fixArmEvidence, after the attribution check, a fix.done row whose `worker_exit` is "signal"
    (W1-T5999's field) is added to no arm and not to the pooled prior. The same goes for a pre-W1-T5999
    row whose subtype or worker_subtype is "error_exit_null"; the newest such row leaves
    FIX_ROUTING_READ_WINDOW_MS on 2026-10-20, so that check can be removed then. Count both in a new
    FixArmEvidence.signalExcluded, and have fixRoutingDecisionFields write it as `signal_excluded` beside
    `unattributed_excluded`. Never pool them into an arm or a "signal" pseudo-arm.
  acceptance:
    - claim: "a fix.done row whose worker ended by a signal, in W1-T5999's shape or the earlier error_exit_null shape, adds to no arm's weight and not to the pooled prior and is counted as signal_excluded on fix.routing_decision, while a commit_refused row from a worker that exited normally still scores refused"
      proof: "unit test: test/a-signal-ended-fix-round-teaches-the-routing-learner-nothing.test.ts"
  falsifier: |
    Score signal_terminated like any other row that is not refused: the fixture arm's accepted weight rises by
    the row's decay weight, signal_excluded is 0, and the test fails.
