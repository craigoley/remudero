  design: |
    1. PROMPT. In the fix footer's NEEDS_DESIGN line (src/lib/prompt-render.ts), say what to do when the unmet
       criterion cannot be met as written: put the categorized `REFUSED:` block above the FIX_OUTCOME line, in the
       implement contract's exact grammar (`N. [class] evidence`, classes from REFUSAL_REASON_CLASSES). Use one shared
       literal so the two prompts cannot drift.
    2. ROW. On the hand-off arm, runFixRung adds `report_excerpt` to `fix.needs_design`: the REFUSED block lines from
       the worker transcript, bounded, and present only when `extractRefusal` finds one. Build it with a helper
       exported from src/lib/refusal-amendment.ts (`refusalExcerptFromFixReport`) so the run-task change is one call.
    3. NOMINATION. In src/lib/refusal-amendment.ts, a fix round's newest `fix.needs_design` row per task that carries
       `report_excerpt` becomes a candidate beside the no_pr verdicts:
       - its source_run_id is the round's run id;
       - it gets the same REFUSAL_AMENDMENT_STEP dedupe, the same max-age backstop and the same `amendmentSettled`
         main-moved retry (W1-T5531);
       - runSweep's existing W1-T4838 block drafts it unchanged: ONE pointer PR per task, reviewed and judged like any
         plan PR.
       A row with no categorized block is never a candidate, so it keeps today's escalation.
    4. NOTHING ELSE MOVES. The escalation path, the progress judge and the triage policy are untouched. This task
       only gives the fleet's own amendment drafter the account the fix worker already wrote.
    Tests go in test/a-fix-rounds-refused-criterion-becomes-a-plan-amendment.test.ts. They import
    src/lib/refusal-amendment.ts and src/lib/prompt-render.ts, never src/run-task.ts (the affected-reach ratchet),
    and drive the fold over a ledger shaped like #12043's round 2.
