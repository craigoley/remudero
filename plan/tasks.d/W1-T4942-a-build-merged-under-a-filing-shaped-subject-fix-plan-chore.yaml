    - claim: "a plan-only filing, and a DECISIONS.md-only close, under a filing-shaped subject are still refused"
      proof: 'grep: test("W1-T4942: a plan-only filing under a filing-shaped subject is still refused" in test/a-build-under-a-filing-shaped-subject-earns-reconcile-credit.test.ts'
    - claim: "an unknown or empty path list never earns reconcile credit, so a failed git read cannot flip a shard"
      proof: 'grep: test("W1-T4942: an unknown or empty diff never earns reconcile credit" in test/a-build-under-a-filing-shaped-subject-earns-reconcile-credit.test.ts'
    - claim: "a prerequisite-only body is refused even when its diff touches source"
      proof: 'grep: test("W1-T4942: a prerequisite-only merge is refused despite a code diff" in test/a-build-under-a-filing-shaped-subject-earns-reconcile-credit.test.ts'
    - claim: "the supersession close still declines a filing-shaped subject even with a code diff, so the destructive consumer is unchanged"
      proof: 'grep: test("W1-T4942: the supersession close still declines a filing-shaped subject" in test/a-build-under-a-filing-shaped-subject-earns-reconcile-credit.test.ts'
    - claim: "the real credit builder reads the merge's paths from a real git log, not only an injected map"
      proof: 'grep: test("W1-T4942: the real credit builder reads merge paths from git" in test/a-build-under-a-filing-shaped-subject-earns-reconcile-credit.test.ts'
    - claim: "the new flag has a production call site in the credit builder"
      proof: "grep: creditHasBuildDiff in src/run-task.ts"
  falsifier: |
    Delete the `creditHasBuildDiff === true` clause from `creditIsReconcilable` and the first test reddens (a `fix(plan)` merge touching
    src/lib/plan.ts is refused again) while the plan-only test stays green. Make the path predicate return true for a plan-only diff and
    the second test reddens (a `chore(plan): file ...` merge would credit the task it merely files, the #3195/#4461 incident). BOTH
    directions are needed: a test that only reddens on removal pins that the flag exists, not what it decides.
  note: |
    THE TWO EXISTING PINS THIS MUST NOT MOVE: `test/a-filing-credit-must-never-close-a-build.test.ts` (W1-T3063 criterion 1, the #4461
    incident, and criterion 4, the vocabulary) stays green because the subject path is untouched, and
    `test/a-plan-only-filing-cannot-earn-a-merge-credit.test.ts` (W1-T3067 criteria 1 and 2, `isPlanOnlyChangeset` splits the #3195
    shape from a src diff) already states the diff boundary this task reuses.
    THE duplicate-surface ADVISORY names W1-T77/T78/T100/T150/T168 (monolith records) and W1-T4902: each declares src/lib/sweep.ts and
    src/run-task.ts as this task does, none edits `creditSubjectIsImplementation`, `creditCandidatesFromProjection` or
    `creditIsReconcilable`; they are cited in plan_refs for that reason and not narrowed away.
    NOT THIS TASK: W1-T3376 and W1-T3763 are NOT refused by the subject (both read `creditIsImplementation: true` in a clean replay), so
    this fix does not flip them. Both credit and dispatch are already correct for them; what stops the reconcile write is a credit row pointing at a PR the subject scan cannot read (a stacked PR merged into a non-main base, or a filing PR), which needs the daemon's ledger and merge-credit.json to confirm.
    RISK: high because a wrong `true` writes `status: merged` onto a shard whose work did not ship; the one-way rule, the
    retirement guard and the PR review of every reconcile landing bound it, and the plan-only case is the falsifier.
