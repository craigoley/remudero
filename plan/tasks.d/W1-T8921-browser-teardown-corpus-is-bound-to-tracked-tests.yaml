  design: |
    1. Extract a small test-only trackedBrowserTestSources reader into
       test/lib/browser-test-corpus.ts. Enumerate Git-tracked test/*.test.ts recursively
       with a NUL-delimited git ls-files listing, then read the actual working-tree
       bytes. Include newly tracked nested suites and changed bytes. Do not walk
       untracked fixture directories, use a fixed allowlist, or read stale HEAD bytes
       instead of the source under test. Exclude only the existing guard's own path
       from launch-text selection. Keep corpus floor and all teardown assertions.
    2. Empty or unreadable Git corpus, missing/unreadable tracked file, NUL-containing
       source or unavailable repository must visibly refuse, never count as healthy
       empty evidence. Do not catch arbitrary errors as a successful empty array,
       silently suppress stderr, skip real browser tests, alter their launch/close
       contracts, or widen any baseline. Real unknowns remain unknown.
    3. In a disposable Git fixture outside the live test tree, test real default Git
       enumeration and reads with nonempty browser controls, a tracked nested suite,
       changed working-tree content and untracked transient-directory creation/removal.
       Test deterministic missing and unreadable real-source failures and a tracked
       browser teardown regression. Inject narrow read/transport failures only where
       needed for deterministic error arms; real-default tests remain mandatory.
       Include empty/failed listing and filenames needing NUL-safe parsing.
    4. Retain the original guard's real zero-match nested-run timing test unchanged.
       Prove load-bearing deletion: restoring recursive transient-tree scanning must
       fail the new corpus-boundary test, and swallowing a tracked-source read error
       must fail the unavailable-evidence test; restoration must pass both. Commit
       before measurement, verify paths/tsx/tmp preload, use shipped host admission,
       then one native per distinct committed tree. Attribute every new native failed
       title on THAT run's actual unchanged pinned base with complete TAP; no retries
       of unchanged failing source into unexplained green.
    5. Only after this separate source actually normally merges may W8801 inherit it
       through normal rebase and justify distinct validation. Preserve all original
       failed receipts and unknown attribution. No changes to SDK/production auth,
       admission SHADOW behavior, owner/admin override, public core, trusted PR flow,
       services, live policy/config, scheduler, infrastructure, credentials or schedules.
