- id: W1-T2280
  title: "A TASK IS CREDITED MERGED ON PROVENANCE AND NEVER ON SATISFACTION, AND NO INSTRUMENT CAN SEE THE DIFFERENCE — `deriveStatus` credits an anchored `Remudero-Task:` trailer on a merged, ownership-asserted PR and reads `acceptance` zero times in its 124 lines; `isDispatchEligible`'s OPENING rung at `drain.ts:487` makes that terminal for 783 of 859 tasks; and `proofQueueAudit`, the one instrument that resolves a task's proofs against the real checkout, is scoped to OPEN+UNMERGED at `run-task.ts:13976` and exempts whole-file test paths by construction at `proof-queue-audit.ts:164` — an exemption that is correct for a queued task and wrong for a credited one"
