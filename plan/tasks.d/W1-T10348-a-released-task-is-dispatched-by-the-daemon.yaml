  falsifier: |
    - Drop `releasedIds` from the daemon's dispatchOpts: the released task is filtered as verify-not-auto and the
      first test fails.
    - Read only the ledger: a release present only in operator-releases.json stays parked and the second test fails.
    - Keep `onFiltered` tally-only: no dispatch.released_filtered row is written and the third test fails.
    - Test `settled` before the release branch: the judge writes nothing for the release and the fourth test fails.
    Regression guards, kept by the same file:
    - An unreleased verify:human task is still filtered as verify-not-auto.
    - A released task whose files: touch .github/workflows/ still routes to operator-build (W1-T5351).
    - A released task still meets dispatch_hold, unmet depends_on, an open PR and a pushed run branch.
    - A machine release with no escalate ruling dispatches.
    - The ledger is read once per tick, not once per candidate (W1-T6358).
    - No reader wired yields an empty set.
    - The console-kick path keeps admitting an operator release.
