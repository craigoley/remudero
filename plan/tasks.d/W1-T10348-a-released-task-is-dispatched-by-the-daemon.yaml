- id: W1-T10348
  title: "A RELEASED verify:human TASK IS DISPATCHED BY THE DAEMON — runDaemon's selection never passes releasedIds, so drain.ts files every verify:human task under verify-not-auto however it was released, and the machine-filing judge's durable route is masked by its own settled map; 18 released tasks sat 8 days with zero dispatch rows"
