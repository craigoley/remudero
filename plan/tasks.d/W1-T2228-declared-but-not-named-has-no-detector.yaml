  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/declared-guard-drift.test.ts`, declared in `files:`, so on this filing PR it
    resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` names the pure planner
    (`src/lib/status.ts`), the verb that reports its answer (`src/run-task.ts`) and one new test;
    the predicate and its reporting arm cannot be decomposed from each other, and Rule 19 sizes that
    span at `risk: medium` as a violation. The blast radius is genuinely small — the signal is
    reported, nothing is deleted.

    THE BRIEF'S UNREACHABILITY PREMISE IS CORRECTED, NOT CARRIED — see design (i). The correction
    matters because it changes the remedy: if `duplicateTitleViolations` were merely unwired, wiring
    it would look like a candidate fix, and it is not one. It is wired, and it is structurally blind
    to code PRs regardless.

    ID PROVENANCE, AND WHY THIS ID RATHER THAN THE ONE NAMED. The operator named W1-T2227. At the
    moment of filing, `refs/rmd-id/W1-T2227` already resolved — reserved by another host at
    2026-08-24T14:50:08.455Z, THIRTY-FIVE SECONDS before the sweep read it, with W1-T2225 and
    W1-T2226 minted nine minutes earlier and W1-T2223/W1-T2224 3.8 s apart; the fleet was minting
    live. Taking it would have been the double-mint that has refused `loadPlan` on origin/main twice
    (W1-T488, and W1-T533+W1-T534 renumbered to W1-T911/W1-T912). W1-T2228 was therefore reserved by
    the repo's OWN mechanism before this shard was written — an orphan `commit-tree` over the empty
    tree pushed with a PLAIN refspec, mirroring `gitRemoteRefReserver`, so a second writer is
    structurally a non-fast-forward. It CREATED on the first attempt, which is the evidence the id
    was free. Sweeps: shards on main 0, whole tree on main 0, all 138 origin refs 0, remote head
    names 0, commit messages on main 0 — each with a control pre-qualified for its own surface
    (`W1-T2222` for the shard and tree reads, `refs/rmd-id/W1-T2226` for the reservation read, the
    138-head total for `ls-remote`, `W1-T2219`'s two commits for the message read). W1-T2223 is
    recorded here as a live counter-example to "reserved implies filed": it has been reserved since
    14:14:07.871Z with no shard, no branch and no PR, and nothing releases a remote reservation.

    A CORRECTION TO AN EARLIER SESSION REPORT, RECORDED SO IT IS NOT RE-DERIVED. That report stated
    #2720 had not merged. It has — `84728d8d` — and #2723 has not. Rationale (4) is the git-side
    re-derivation, and it is the reason the near-miss is stated as order-dependent rather than as a
    defect that shipped.
