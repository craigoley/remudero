  rationale: |
    MEASURED 2026-11-10 in the core instance's ledger, 2026-10-27 to 2026-11-10: the experiment `sol61-vs-sonnet55` ran on 326 tasks and changed no routing.
    - By assigned arm, build runs merged in 68.6% (24 of 35) for sonnet and 49.1% (26 of 53) for sol61. No part of the fleet acts on that.
    - The config gardener's adopt-mount path takes one kind of evidence: the mount headroom sweep, read by `recommendMounts`. That sweep is observational, and its own notice says so.
    - `mountCandidate` skips a recommendation whose two arms are on different providers. Every live experiment compares two providers.
    - A randomised result is stronger evidence than the sweep, and it has no path to the table.
    SCOPE AMENDED for the write-only ledger-step ratchet (W1-T14149, #20045), read at origin/main e5b163730 on #20120's merge:
    - The ratchet's baseline lists `routing.experiment.result` and `routing.policy.estimate` as write-only debt. This task is
      their first reader outside their writers, so both entries go stale, and the ratchet requires the PR that adds the
      reader to remove them (the debt list only shrinks).
    - The task writes two steps nothing else reads: `config.randomised_finding`, the operator-facing finding (the gardener
      re-reads it only to write each once), and `config.randomised_recommendations_unread`, the diagnostic for an evidence
      read that failed. Each is a record, so each needs a `recordOnly` entry with its reason.
    - Both edits are in scripts/write-only-ledger-step-baseline.json, so the file joins the task's scope. No criterion, proof
      or falsifier changes.
  design: |
    Add a second source beside `mountRecommendationSource`: the newest `routing.experiment.result` row for each experiment, from W1-T12142.
    Map a concluded result to the `MountRecommendation` shape so `mountCandidate` and the canary code stay one path. Mark its evidence as randomised, and leave out the observational notice for it.
    Where the winner is on another provider, edit the row only if its schema allows a provider. If it does not, write a finding that names the routing setting that holds the choice.
    INVARIANT randomised-evidence-only: a candidate comes only from a concluded randomised source (an experiment result, or an auction-weighted estimate) and always goes through the canary.
    NOT IN SCOPE: a change to the auction (W1-T12148), and any new experiment.
  falsifier: |
    Accept a running result and criterion 4 must fail. Skip the canary for an experiment candidate and criterion 3 must fail. Drop the interval from the reason and criterion 2 must fail. Restore and require all to pass.
  note: |
    The canary measures the change again on live work, so a wrong experiment result is caught before the change stays.
    AMENDED 2026-11-21 (operator session, decision-quality program), from a read of origin/main dd829e355. The experiments need 392
    tasks per arm (src/lib/routing-experiment-result.ts:57-68), and the rationale above counts 35 and 53 build tasks in two weeks,
    so they will rarely conclude. W1-T14146 estimates the same provider choice from the headroom auction's logged probabilities
    over all routed traffic, with the experiments' decision rule. This task also accepts its concluded cells as a second
    randomised source (criterion 5), so a winner reaches the table in weeks, not quarters. Priority 1.2 → 1.
