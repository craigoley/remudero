  design: |
    1. MainRepairFixRequest carries `mergesSinceGreen`: every first-parent merge after first.afterGreenSha up to the red
       head. Each entry has its sha, its PR number and subject, and its changed files. They come from the rung's existing
       awaited readers (the span walk and MainHealthMergeReader / findMetPrs' PR-files read). Nothing new runs
       synchronously on the loop. fixRequestFor and inheritedFixRequest both fill it.
    2. Each entry is marked `reachesFailingTests` when its changed files meet the failing test files' import closure.
       Compute this with the affected-suites selection (src/lib/affected-suites.ts selectAffectedSuites over the
       awaited readAffectedSuitesInputAsync input): the merge reaches a failing test when its files select that test
       file. A merge that ADDS the failing test also counts. If the input is unreadable, the brief says so; it never
       claims there is no overlap.
    3. Tiered detail, no fixed cap: a reaching merge carries its unified diff, and every other merge carries its diff
       stat. When the text outgrows the budget the log excerpt already uses, the brief cuts whole non-reaching merges
       first and says how many it omitted (W1-T9301's bounded-tail-with-omission form).
    4. mainRepairFixPrompt renders a "Merges since the last green main" section with the reaching merges first.
       - When two or more merges reach the failing tests, it says the red may be a COLLISION of those merges, each
         green on its own base, and that the repair fixes their interaction.
       - When the located merge reaches no failing test, the "Fix EXACTLY ONE thing" line names the reaching merges
         instead of the located one.
       - The PR body, its Acceptance block and its trailer are unchanged (W1-T8572).
