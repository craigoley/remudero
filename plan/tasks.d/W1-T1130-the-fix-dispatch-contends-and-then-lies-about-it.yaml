  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/sweep-fix-dispatch-contention.test.ts`, declared in `files:`, so on the filing PR
    it resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. Both halves change what the sweep does to a live
    repository — whether a dispatch runs at all, and whether a head stays gated — so a mistake
    either stalls every fix or re-dispatches in a loop.

    `src/run-task.ts` IS THE ONLY `src/` FILE DECLARED because both halves live in it: the
    `checkout -B` and the `catch` that swallows its failure are the same function. `worktreeAdd`
    (`src/lib/worker.ts`) writes the same config from the worker lane and is deliberately NOT
    declared — design (v) — because widening this into a second lane would put two independently
    falsifiable claims in one diff.

    THE PREMISE WAS CHECKED AGAINST THE RECORD RATHER THAN ASSUMED. The reachable corpus contains
    nine `checkout -B` failures and zero config-lock ones, and rationale (3) states why that is a
    window limit rather than a contradiction. An implementer working on the fleet host should
    re-derive the message split there before assuming either failure dominates.

