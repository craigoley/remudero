  rationale: |
    THE LOOP-LAG SAMPLER NAMED IT. MEASURED 2026-09-22 ON THE LIVE DAEMON (pid 645931, running #6598).

    (1) THE TWO OVERRUNS IT REPORTED. `daemon.loop_lag` rows at 18:20:42Z (sweep, 99,153 ms late) and
        18:28:41Z (sweep, 145,763 ms late). The second lines up with a 137.0 s window in which the
        daemon wrote NO ledger row at all: from `ci_learning_cadence.skipped` at 18:26:23.476Z to
        `board_review.skipped` at 18:28:40.515Z. In src/lib/daemon.ts the only code between those
        two log calls is `boardDecision = deps.checkBoardReview();` — a synchronous call.

    (2) WHY IT BLOCKS. `buildBoardReviewDaemonHooks`'s `check` (src/run-task.ts) calls
        `defaultBoardReviewItems`, which pages `fetchOpenPrsRest(owner, repo, ghJson)` and runs
        `projectPlan` against `buildBatchedGithub`. `ghJson` (src/lib/github-transport.ts) is
        `execFileSync("gh", …)`. Every call holds the event loop for its whole duration: no heartbeat,
        no review clock, no sweep. (The read cadence is advisory by default, so pacing is not the cost —
        (5) below measures the call count instead.)

    (3) IT IS NOT RARE. Every `ci_learning_cadence.*` row paired with the next `board_review.*` row from
        the same daemon pid, 2026-09-21 and 2026-09-22 (`rmd ledger-grep`, the union):

            312 checks   p50 24 ms   p90 134.6 s   max 298.3 s   116 over 60 s

        The distribution is bimodal: the fast mode is a read that returned nothing quickly, and the slow
        mode is a read that worked. Recent slow checks: 139.7, 143.0, 162.7, 140.9 (13:33:17Z, inside the
        13:05-13:40Z outage window), 152.9, 141.8, 138.8, 148.9, 143.7, 155.0, 137.0 and 148.3 s. Most of
        them end in `board_review.skipped`: the loop froze for over two minutes to decide to do nothing.

    (4) THIS CORRECTS W1-T4046, WHICH NAMED THE WRONG PHASE. The measurement cadence was
        `measurement_cadence.skipped` at both fires in the window (18:26:23Z and 18:37:56Z), so it caused
        neither overrun. Its synchronous union reads are real, but they are not what the sampler caught.
        W1-T4046 is withdrawn with that correction recorded.

    (5) WHERE THE 140 s GOES, MEASURED BY STAGE. The check's read was replayed in the daemon container
        against the live checkout, with a copy of state/status.json as the projection cache, under a
        CPU profile and a child-process spy:

            fetchOpenPrsRest       10.4-11.5 s    21-23 gh calls (1 list + 2 rollups per open PR)
            loadPlan                1.0 s
            projectPlan           118-122 s       2,102 projections; 126 of 130 sampled s in spawnSync
              gh api --paginate pulls/N/files      213 calls   70.6 s
              gh api pulls?state=closed (pages)     55 calls   33.8 s
              gh api issues?labels=needs-human      15 calls    9.3 s
              check-runs / status per open head     20 calls   10.5 s

        A single `gh api` call costs ~210 ms in the container, so the cost is the COUNT, not pacing.
        The count is a cold gateway: `defaultBoardReviewItems` constructs `buildBatchedGithub(owner,
        repo)` on EVERY check, with no `snapshotCache`, so its lifetime memo of changed files (which
        is correct for merged PRs, whose file lists never change) and the board's delta enumeration
        are both empty every time. Meanwhile `daemonCommand` already derives the same projection once
        per tick, on ONE warm, snapshot-backed gateway (`refreshMerged` → `lastProj`, R-24/W1-T2509),
        and `isOpenPr`, `isCreditIndeterminate`, `openSiblingObservation` and `openPrCount` all read
        it with the stated rule "never a second GitHub read path". The board review is the reader
        that breaks that rule.

    (6) THE SAMPLER UNDER-REPORTS, AND THAT IS STATED RATHER THAN FIXED HERE. `reportLoopLag` fires
        only past one whole interval (60 s), so a 40-55 s block is invisible to it. The sweep shows a
        recurring 40-51 s silent gap after every `sweep.plan_filing_classified` row. Whether those gaps
        are blocks or awaits is not established. They are named so the next measurement looks at them;
        they are not in this task's scope.
  design: |
    THE INVARIANTS THAT MUST SURVIVE, all documented at `buildBoardReviewDaemonHooks`:
      - one read serves both the reconciler and the cadence decision (the depth arms need items);
      - reconciliation runs on quiet ticks too (W1-T2464);
      - an outage never retires anything.

    (i) `buildBoardReviewDaemonHooks` takes two optional providers, `projection: () => Map<string,
        StatusProjection> | undefined` and `plan: () => Plan`. When given, the default items read passes
        them to `defaultBoardReviewItems` as its `projectPlan`/`loadPlan` seams — no new code path, the
        existing BoardReviewItemsIo bundle already carries both. `daemonCommand` wires them to `lastProj`
        and `activePlanRef.current`, exactly as the readers beside it do.
    (ii) NO PROJECTION IS NOT AN EMPTY BOARD. If the tick has not derived one, the provider throws into
         the existing inner catch, which degrades only the escalation/origin arms — the same behaviour a
         failed projection has today. The open-PR list still decides reconciliation.
    (iii) Callers that pass neither provider (CLI, tests) keep today's behaviour byte for byte.
    (v) test/board-review-wiring.test.ts pins the daemon call site as the literal `buildBoardReviewDaemonHooks({ config })`;
        that one assertion is widened to accept the added providers. Its property (daemonCommand CONSTRUCTS the
        hooks) is unchanged and still reddens when the construction is removed.
    (iv) OUT OF SCOPE, NAMED: the remaining open-PR read (1+2N synchronous calls, ~11 s at 11 open PRs)
         could reuse the sweep's own read of the same rows; that needs a freshness contract between two
         phases and is a separate task. So are the other `buildBatchedGithub(owner, repo)` constructions
         without a snapshot cache (run-task.ts ~13500, ~26220, ~26416, ~37141), which are not on the
         daemon's timer path as far as measured.
  acceptance:
    - claim: "given the tick's projection and plan, the board-review check derives no projection and loads no plan of its own"
      proof: 'grep: test("W1-T4051: the board-review check reuses the tick projection and plan" in test/the-board-review-check-reuses-the-tick-projection.test.ts'
    - claim: "escalations reach the board items from the tick's projection"
      proof: 'grep: test("W1-T4051: escalations come from the tick projection" in test/the-board-review-check-reuses-the-tick-projection.test.ts'
    - claim: "a tick with no projection degrades the escalation arm only, and a quiet tick still retires a departed referent"
      proof: 'grep: test("W1-T4051: no projection degrades escalations, not reconciliation" in test/the-board-review-check-reuses-the-tick-projection.test.ts'
    - claim: "the daemon hands the board review its own projection and plan"
      proof: 'grep: test("W1-T4051: the daemon wires the board review to its tick projection" in test/the-board-review-check-reuses-the-tick-projection.test.ts'
  falsifier: |
    Leave `defaultBoardReviewItems` calling `projectPlan` on a fresh gateway and the first assertion goes
    red: the projectPlan spy is called. Drop the provider's escalation join and the second goes red. Let
    a missing projection throw out of the items read (or read as an empty board) and the third goes red:
    the departed referent is no longer retired. Drop the wiring in `daemonCommand` and the fourth goes red.
