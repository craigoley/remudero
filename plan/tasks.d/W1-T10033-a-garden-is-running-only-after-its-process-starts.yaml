  design: |
    Only a verified child spawn begins running.
    1. Keep the existing runtime phases, public schema and pass identity. Move the existing start notification
       from boundedGardenPassSpawn's pool acquisition to childGardenPassSpawn's successful child spawn event.
       Node's spawn event occurs only after successful process creation; error without spawn is not execution
       (https://nodejs.org/api/child_process.html#event-spawn). A created process is not proof of model work,
       progress, successful completion, complete SDK coverage or an invoice.
    2. While pool or memory admission is pending, retain queued and executionMs unknown. Queue timing ends at
       the successful process start; execution timing begins there. Notify once only, preserving the same
       passId in runtime events and garden.pass. No fallback from elapsed time or pool ownership to execution.
    3. Preserve explicit no-execution outcomes for memory deferral, cancellation and failure before spawn.
       A successful spawn followed by failure is distinct from failing to create the child. Retain release,
       observer-error, pass settlement, prior-success, pacing, interruption and backpressure controls.
    4. Existing controlled lifecycle producers must explicitly simulate successful process creation, not inherit
       it from pool admission. Keep their original queue/execution, pass identity, completion, deferral and
       cancellation assertions; do not weaken them or replace real default-path controls with injected fakes.
    No memory policy, worker width or provider changes.
    No admission arithmetic, reservation ownership, timers, priority, permissions, billing, service settings,
    model calls or live recovery changes. Do not change host-memory-admission.ts to make this test pass.
    Use strict TDD with source-only removal/restoration, the real default child and failed-spawn controls,
    source-instrumented coverage, caller and mapped-census sweeps, exact-head author validation, stored-body
    acceptance proof, governed review and hosted CI. Verify merge, adoption and natural live usage separately.
