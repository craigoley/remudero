  note: "verify:human REQUIRED BY W1-T353, not chosen for convenience: this task's deliverable is a
    RULING — an amendment to a standing rule — and W1-T353's linter refuses a ruling-shaped task that
    is not verify:human. The gate half is machine-checkable; the rule half is a judgement about what
    the fleet is permitted to accept as proof, and that is the operator's to confirm.
    risk:high — it changes what the review floor REFUSES, on a shape with a population of two. Too
    broad and it fires on the append-last idiom the codebase uses deliberately; too narrow and it
    catches neither live instance.
    budget_usd 70 — a rule amendment, one refusal shape, an answerable exemption and its tests.
    ON THE GREP PROOF BEING A FORWARD REFERENCE. `rmd check-proof` reports 0 hits for it TODAY,
    because the amended rule text does not exist yet. That is unavoidable and is not the W1-T229
    dead-proof class: for a task whose deliverable is ADDING text, a grep either forward-references
    the new text (0 today, resolves on the work) or matches text already on main (executed_stale,
    which discriminates nothing). There is no third option. This is the same construction W1-T326
    used and merged on, which is why the load-bearing string is declared in design (i) rather than
    left to the implementer to invent.
    NO depends_on: nothing blocks it. The two live instances are separate known work and this task
    does not fix them — it stops the third."
