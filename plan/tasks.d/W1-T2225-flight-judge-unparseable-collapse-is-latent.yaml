  design: |
    ONE CONCERN: an unreadable flight-judge output must not be storable as a classification.

    (i) THE UNPARSEABLE ARM IS NOT A VERDICT — the shape W1-T2212 established, applied here. What
    `parseJudgeVerdict` returns when it cannot read the output must be a distinct value that
    `planJudgeAction` cannot confuse with `off_track`, so a consumer that fails to handle it does
    not compile.

    (ii) AND THE THIRD STATE MUST REACH `risk-score.ts`'s METADATA TYPE. Rationale (8): stopping at
    `JudgeVerdict` leaves `flightJudgeState?: JudgeState` accepting the collapsed value, which
    relocates the defect rather than removing it.

    (iii) WHAT MUST NOT CHANGE — Q3, AND THIS IS THE CONSTRAINT AN IMPLEMENTER MAY NOT SOFTEN. An
    unparseable verdict STILL BLOCKS. The escalation STILL FIRES. Nothing proceeds on a verdict it
    could not read. The change is what the value is CALLED and what the type ADMITS, never whether
    the run is allowed to continue — `halt_and_escalate` remains the outcome.

    (iv) SEQUENCING, STATED SO NOBODY BUILDS DEAD CODE: this lands WITH W1-T360's wiring, or is
    retired with the module. Rationale (7). Building it against an unreached stack buys nothing and
    adds a test to a path no run executes.

    (v) NOT IN SCOPE, NAMED: `risk-judge.ts`'s own collapse (W1-T2212) and its discarded evidence
    (W1-T478); `learnings.ts`, which W1-T2212 names beside this file; the wire-or-retire decision
    itself (W1-T360); and the claims harness, where W1-T2215 showed the remedy does not carry.
