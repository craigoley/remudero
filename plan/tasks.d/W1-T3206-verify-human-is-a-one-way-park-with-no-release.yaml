  falsifier: |
    CLOSE IF a release path already exists:
      `grep -rniE "verify.?human" src/ --include=*.ts | grep -iE "approve|release|unblock|promote|flip"`
    MEASURED 2026-09-08: ZERO matches.
    POSITIVE CONTROL, because a grep finding nothing looks the same as a broken grep: the same
    expression WITHOUT the second filter must find the refusal sites — `drain.ts:418`,
    `task-linter.ts:426`, `plan.ts:644`, `status.ts:2536`. MEASURED: it does. The refusals exist;
    only the release is missing.
    PROVE IT LOAD-BEARING: the fixture needs the SAME task twice — once with a recorded verdict and
    once without — and dispatch eligibility must differ. A suite testing only the released case
    proves nothing about the wall still standing.
    DO NOT satisfy this by flipping `verify:` to `auto` on release. That erases the record that a
    human was required, and a worker editing a plan criterion is exactly what rule 15 refuses.
    DO NOT satisfy this by making `verify: human` dispatchable by default with an opt-out. The 45
    parked shards were parked for reasons nobody has re-read; releasing them wholesale is not a fix,
    it is the largest unreviewed dispatch in this repo's history.
  note: |
    DUPLICATE-SURFACE: FOUR OVERLAPS, ONE CAUSE, RULED ON AS A CLASS. Adding `src/run-task.ts`
    (where `approveCommand` lives) took the warning count from one to four — W1-T80, W1-T148,
    W1-T172 and W1-T245 all share `drain.ts`, `plan.ts` or `run-task.ts` with this task. THE
    OVERLAP IS STRUCTURAL, NOT CONCEPTUAL, and W1-T471 names the cause outright: `src/run-task.ts`
    is 19 489 lines and 21% of all src, so almost any dispatch-adjacent task collides with almost
    any other. Narrowing `files:` would hide that and leave the dispatcher just as blind, which the
    linter explicitly refuses.
    WHAT THIS TASK DOES THAT NONE OF THEM DOES: it lets a PARKED shard reach the ratification
    pipeline. W1-T245 is about `syncPlanFromOrigin` being shard-blind; W1-T148 and W1-T172 are
    dispatch-loop concerns; W1-T80 is a review/dispatch RACE. None of them touches the admission
    question — whether a `verify: human` record can be named to `rmd approve` at all — and none
    would move a single one of the 45 parked shards.
    SEQUENCING IF SEVERAL ARE IN FLIGHT: W1-T80 first (a release path built on a racing gate
    inherits the race), then this. The rest are independent.
    ORIGINAL W1-T80 NOTE, PRESERVED: (lint-plan flagged W1-T80, sharing
    `src/lib/drain.ts` and `src/lib/plan.ts`). THEY ARE DIFFERENT WORK: W1-T80 is a 2026-07-16
    live-incident task about `rmd review` posting success and the drain starting seconds later — a
    RACE between review and dispatch. This task is about a class of shard the dispatcher refuses
    OUTRIGHT and can never be told to stop refusing. Neither subsumes the other and the overlap is
    two files rather than a shared concern. IF BOTH ARE IN FLIGHT, W1-T80 should land first: it
    changes when dispatch may proceed, and a release path built on top of a racing gate inherits the
    race.
    Rule 25 CHECKED: `src/lib/drain.ts` and `src/lib/plan.ts` are ordinary src.
    THIS IS THE MECHANISM W1-T3188 ASSUMED EXISTED. That shard proposes judging the verify:human
    backlog so only the real ones reach the operator — but a judged verdict has nowhere to land
    either. Without this task, W1-T3188 can demote a shard off the board and STILL leave it
    undispatchable forever. They should ship together or this one first.
    THE OPERATOR'S OWN FRAMING, 2026-09-08, and it is why W1-T3188 should ship WITH this rather than
    after it: "This is why i want an llm as a judge working through verify human first? All of your
    recommendations are always good. And any that are borderline just need a push in one direction
    or another or a judgement call. it seems like many of these can be solved without me." The
    release path is the mechanism; the judge is what makes 45 of them tractable without him reading
    each one.
    CAVEAT WITH EQUAL WEIGHT: this makes a verdict RELEASABLE. It does not decide any of the 45
    parked tasks, and it must not be read as licence to sweep them. Several are genuinely stale —
    W1-T926 wants a live launchd restart on a host that has no launchctl — and deciding them is
    W1-T3188's job or the operator's, one at a time.
    SECOND CAVEAT: no measurement here establishes that a release surface would be USED. The
    operator has been deciding in conversation and the decisions have been landing as hand-filed
    auto shards; a verb nobody invokes is the same dead end wearing a different label.
