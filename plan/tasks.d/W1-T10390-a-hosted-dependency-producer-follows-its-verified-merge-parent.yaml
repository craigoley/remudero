  design: |
    For pull_request only, use the actual two-parent merge checkout's first parent as protected
    producer source and sealed base. Keep the event base as ancestry evidence, never a diff or
    source attribution base. Require full immutable event-base, PR-head and checkout SHAs; main
    as the target; a refs/pull/<positive-number>/merge ref; HEAD equal to GITHUB_SHA; exactly two
    parents; second parent equal to the event PR head; event base ancestor of first parent; and
    first parent ancestor of the fetched protected origin/main ref. Missing or contradictory
    witnesses fail closed before archive, install or API work. Unsupported events remain refused.
    Preserve the existing merge_group base path, protected git archive, implementation loader,
    schema, same-run digest, bounded observation, read-only permissions and UNKNOWN fallback.
    Add only DEPENDENCY_HEAD_SHA to the producer's existing metadata environment. Amend the
    existing moving-base fixture's exact allowlist and assert every new provenance witness;
    retain all stale diff, wrong-step, altered-env, archive and scheduling negative controls.
    Update the existing merge-queue job fixture to supply the real default Actions identity
    environment and explicit SHA/parent outputs for its Git seam, pin every new producer identity
    command in order, and refuse its unavailable archive without minting evidence. Retain all
    literal gate, absent digest, reporter, queue-base and unsupported-expression assertions.
    Use real Git fixtures with explicit identity and no global/system Git configuration to prove
    both a healthy advanced parent and rejection of foreign heads/parents/refs, direct checkouts,
    missing protected refs, extra parents and unsupported events. Execute the shipped YAML prefix,
    not a second predicate. Prove removal of the production protections and qualification witness
    check fails, then restore and rerun. No durable dependency credit is created or seeded; the
    filed W1-T10160 record, its dependency, rulings and accounting stay unchanged. No scheduling,
    capacity, provider, security-policy, host or merge-rule change is included.
