- id: W1-T963
  title: "THREE TRIAGE PRs MERGED WITH AN EMPTY DIFF AND ALL THREE PASSED REVIEW — the generated triage proof greps the feedback entry's POST-FIX state, so it is satisfied identically whether this PR made the change or a sibling already did, and nothing downstream refuses a diff that is empty against its own declared scope"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 85.00
  rationale: |
    FILED FROM direct diff inspection of the #2075/#2077/#2078/#2082 sequence. Branch cut at
    5c3d15a; every file:line and every invocation count below was re-read on that tree.

    (1) WHAT HAPPENED, AS DIFFS. Four triage PRs were opened for ONE feedback entry,
    `plan/feedback/fb-alert-craigoley-remudero-code-scanning-82.yaml`. All four merged. Exactly
    ONE changed anything: d46d0a0 (#2082) carries `-status: new` / `+status: rejected` plus
    `+summary: null`, numstat 2 added 1 removed. The other three — b460421 (#2075), 612f05c
    (#2077), cc98ad7 (#2078) — each produce NO OUTPUT from `git show <sha> -- plan/feedback/`.
    Empty against that path. Confirmed a second way rather than inferred from the empty diff:
    `git show b460421:plan/feedback/fb-alert-craigoley-remudero-code-scanning-82.yaml` reads
    `9:status: rejected`, so the file ALREADY said rejected when that commit was made. Squash
    merges rewrite committer dates, so `git log` order does not establish which ran first; the
    file contents do.

    (2) THE PROOF CANNOT DISCRIMINATE, AND ITS OWN DOC ASSERTS THAT IT CAN. `triageAcceptanceProof`
    (src/lib/triage.ts:495) returns `grep: status: ${status} in ${feedbackEntryRepoPath(feedbackId)}`,
    reached from `triageCommitMessage` at :548, :567 and :585, which `run-task.ts:18282` calls. The
    comment directly above it (src/lib/triage.ts:492-494) says: *"IT DISCRIMINATES. The entry reads
    `status: new` on the merge base and the flipped value on the head, so the grep MISSES the base."*
    That holds ONLY when this PR is the one that flips the entry. When a sibling already flipped it,
    the base and the head both read `rejected`, the grep matches both, and the criterion is satisfied
    by a state the PR did not produce. The machinery to catch exactly this already exists and did not
    fire: `executed_stale` (src/lib/review.ts:2150, W1-T273, extended to `unit test:` by W1-T362)
    downgrades a proof matching head AND base. Determining why it did not fire here is design item
    (i) and is NOT assumed by this shard.

    (3) THE SECOND GAP IS INDEPENDENT, AND EITHER ALONE WOULD HAVE STOPPED ALL THREE MERGES.
    Nothing refuses an empty diff at merge. `bodyContradictsDiff` (src/lib/review.ts:2696, called
    from src/run-task.ts:1984) is TRIVIALLY SATISFIED when there is no diff to contradict — it
    tests claims AGAINST `diffFiles`, so an empty `diffFiles` contradicts nothing. This is not a
    defect in that function; it is a hole nothing else covers. The two gaps are filed as ONE
    concern because closing either one alone closes the observed hole, so a fix that addresses
    only one and declares the defect closed is untestable against the incident that produced it.

    (4) THE COST IS HISTORY, NOT MINUTES. An empty merge credits work twice: the trailer and the
    head-branch credit path both attribute the entry to a PR that changed nothing, and any later
    reconstruction of "who did this" reads four PRs where one acted. It also pollutes `main` with
    commits whose acceptance evidence is real, executed, green, and about someone else's change.

    (5) THIS CLASS IS ALREADY BEING CLOSED BY HAND, WHICH IS THE COST THIS TASK REMOVES. d63d835,
    *"docs: close W1-T413 re-dispatch as already-satisfied (no-op)"*, is a human doing this
    adjudication manually. The `chore(feedback): land pending filings` commits ef0d949, 14d2fe3
    and 1c44f93 are the same manual counterpart on the feedback side.
  design: |
    THE SHAPE: make the generated proof discriminate, AND refuse an empty diff, AND close rather
    than merge a triage PR whose work is already done. Two determinations first, both from source.

    (i) DETERMINE FROM SOURCE WHERE THE TRIAGE PROOF IS EMITTED AND WHY `executed_stale` DID NOT
    FIRE, BEFORE CHOOSING AN APPROACH. The emitter is named in rationale (2) and is not in doubt;
    what IS in doubt is the evaluation path. `executed_stale` exists precisely to catch a proof
    matching head and base, and it did not catch these three. Read the proof-execution path in
    src/lib/review.ts and establish whether the base comparison was skipped (no `baseCwd` — see
    the note at :2295-2299, which records that `judgeCriterion` is structurally never stale when
    `baseCwd` is absent), disabled for this lane, or evaluated and passed. The answer decides
    whether the fix belongs in the emitter, the executor, or the lane that wires them. A builder
    who patches the emitter without settling this may leave the executor blind to every other
    generated proof.

    (ii) DETERMINE WHERE THE MERGE GATE EVALUATES A DIFF. `bodyContradictsDiff` receives
    `diffFiles` at src/run-task.ts:1984 and `judgeReview` receives `evidence.diff`
    (src/lib/review.ts:3093). Establish which of these — or which caller above them — is the
    point where "this PR's diff is empty against its declared scope" can be decided, and state
    why the others are wrong. `nonPlanFilesInDiff` (src/lib/triage.ts:423) and `diffCitesFeedback`
    (:433) already inspect a triage diff and are the closest existing precedent.

    (iii) DELIVERABLE A — THE GENERATED PROOF MUST DISCRIMINATE. A triage proof must FAIL at the
    merge base and PASS at the head. A proof satisfied by the post-fix state alone is the defect,
    so asserting the flip rather than the destination state is the shape to beat; any alternative
    must be justified against that bar.

    (iv) DELIVERABLE B — REFUSE AN EMPTY DIFF. A PR whose diff is empty against its declared scope
    must not merge. Scope here means the paths the PR claims to touch, not the whole tree: a PR
    that changes only its own body is empty for this purpose.

    (v) DELIVERABLE C — CLOSE, DO NOT MERGE. When a triage PR's work is found already done, the
    lane must CLOSE it rather than merge it. Merging an empty PR is not a harmless no-op; per
    rationale (4) it credits the work twice and pollutes history. A refusal that leaves the PR
    open forever is not the outcome either — the disposition must be terminal.

    (vi) A REFUSAL TEST ALONE PROVES NOTHING, AND THIS IS THE TRAP THIS SHARD IS ABOUT. An
    implementation that refuses EVERY PR satisfies "an empty-diff PR is refused" perfectly, and a
    proof-checker that fails every proof satisfies "the proof fails at base" perfectly. Both
    positive controls must run in the SAME suite invocation as their refusals, so one run carries
    both directions and neither can pass vacuously. This shard is about a non-discriminating
    proof; its own acceptance must not repeat the defect.

    (vii) AND THE MUTATION CHECK MUST BE FILE-SHA BRACKETED. A no-op mutation is indistinguishable
    from a surviving mutant from the result alone. Read the sha256 of the edited file, remove the
    discrimination, read it again and require it to DIFFER, run the suite and require the base-side
    test to FAIL, restore, and require the sha to return to the original.

    (viii) OUT OF SCOPE, TO BE FILED SEPARATELY. The re-dispatch and supersession behaviour that
    opened FOUR PRs for one feedback entry. That governs HOW MANY are opened; this task governs
    whether an empty one may merge. They are genuinely independent — fixing dispatch would have
    reduced the count without making any of the three refusable, and fixing this makes the extra
    PRs harmless without reducing their number. Not to be absorbed here, and not a reason to
    widen this task.
