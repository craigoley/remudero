- id: W1-T2740
  title: "A TIMEOUT THAT RETURNS STATUS ONE IS CALLED A FAILING PROOF — a partial Node TAP stream with passing subtests but no final summary hard-blocks a green PR as `executed_fail`"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 12.00
  files:
