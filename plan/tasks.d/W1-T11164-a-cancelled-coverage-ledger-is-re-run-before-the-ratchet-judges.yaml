- id: W1-T11164
  title: A coverage-ledger job cancelled at its ceiling is re-run once at the same head before coverage-ratchet's red reaches a fix round, because the job had finished its own steps in 19 s and was cancelled in finalization, on code and plan pull requests alike
  repo: remudero
  depends_on: [W1-T13175]
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # changes CI gating; security gates unchanged. Rule 19: one concern, a coverage-ledger cancellation is a non-result that is re-run, not a red that is fixed
  band_meaning: span
  origin: "operator decision 2026-11-02 (in chat), relayed: file the real cause of the coverage-ratchet reds"
  plan_refs:
    - W1-T9448
    - W1-T5892
    - W1-T1223
    - W1-T3345
    - W1-T11161
  files:
    - src/lib/sweep.ts
    - test/sweep/a-cancelled-coverage-ledger-is-re-run-before-coverage-is-judged.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: A pull request whose red at its current head is that named coverage-ledger cancellation is re-run once through the sweep's existing rerunFailedChecks gateway (rerun-failed-jobs on that workflow run) before any fix worker is dispatched for it, and the claim row keeps a second pass from re-running the same head again
      proof: "grep: W1-T11164 criterion 2 in test/sweep/a-cancelled-coverage-ledger-is-re-run-before-coverage-is-judged.test.ts"
    - claim: "invariant:one-rerun-per-head — A second coverage-ledger cancellation at the same head after that re-run is not re-run again; it reaches the ordinary blocked-CI path with the cancellation named, so a persistently cancelling job is visible rather than retried forever"
      proof: "grep: W1-T11164 criterion 3 in test/sweep/a-cancelled-coverage-ledger-is-re-run-before-coverage-is-judged.test.ts"
  rationale: |
    MEASURED 2026-11-02/03 over the last 30 completed pull_request runs of ci.yml (GitHub REST through the broker; read-only),
    32 coverage-ledger job attempts:
    - 30 succeeded. Job wall from started_at to completed_at was 9-30 s (median 14 s), one 59 s. Setup job 1-2 s, checkout 2-4 s,
      setup-node 4-6 s, every ledger step 0-9 s.
    - 2 were CANCELLED: run 41538944616 (#16322, plan-only) at 106 s and run 41538195834 (#16212, run-W1-T10749, a code PR) at 95 s.
      In both, EVERY step including "Complete job" had concluded success within 19 s of the job's start (22:38:18 -> 22:38:37Z;
      22:32:59 -> 22:33:16Z). The job then stayed open until GitHub cancelled it at timeout-minutes: 1.
    - #16297's first attempt (run 41534926238) was cancelled at 69 s; its re-run finished in 30 s.
    So the cause is NOT a slow checkout or setup: the measured work plus setup is a fraction of the ceiling. The job is cancelled in its
    finalization tail after its work is done, and a cancelled prerequisite skips the coverage-shard matrix, which coverage-ratchet
    correctly refuses ("the shard matrix never ran").
    WHY A RE-RUN AND NOT A LARGER BOUND: the 1-minute bound is the remainder of ci-gate's WAIT_CAP_SECONDS budget
    (75 - 49 - 20 - 5, the comment above coverage-ledger; test/workflow-job-timeouts.test.ts enforces the sum). The finalization tail is
    censored by the cancel itself, so no measured job wall bounds it; raising the ceiling would take minutes from the shard or the
    aggregator without a measurement saying how many. A re-run costs one ~14 s job attempt plus the matrix, and both observed re-runs
    succeeded.
    READ at origin/main 7338c1fda: the sweep re-queues a CANCELLED REQUIRED check (W1-T1223, requeueCheck), but coverage-ledger is not a
    required context: the red reaches ci-gate as coverage-ratchet failure, so today it waits for a fix round, whose no-commit outcome
    then spends the one rerunFailedChecks receipt.
    SECURITY GATES ARE UNTOUCHED: security-merge-policy and CodeQL and their required contexts are not in files:.
  design: |
    1. MOVED to W1-T13175 (see AMENDED below): coverage-ratchet-required's skipped arm prints the coverage-ledger-cancelled line.
    2. The sweep's blocked-CI rung reads that token from the failing coverage-ratchet job's log tail, or from the job's failure
       annotations when the log is unreadable (amended 2026-11-16, second amendment below), and, when it is the only failing required cause at the current head, claims a sweep.disposed receipt
       (ledger_cancel_rerun_attempted) and calls rerunFailedChecks, the same gateway the no-commit rerun uses. It does this before fix
       dispatch, once per head.
    3. With the receipt present at that head, the rung does nothing new: the existing path runs and its stand-down names the cancellation.
    INVARIANT one-rerun-per-head: the rung re-runs a named coverage-ledger cancellation at most once per head; with its receipt present
    at that head it changes nothing, and the existing blocked-CI path decides.
    AMENDED 2026-11-16 (operator session): step 1 (the skipped arm of coverage-ratchet-required prints the coverage-ledger-cancelled
    line), the first criterion as filed and the falsifier's sentence about the never-ran text moved to W1-T13175, and
    `.github/workflows/ci.yml` left `files:`. Why: the daemon never dispatches a task whose `files:` names a path under
    .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a workflow file), so this whole
    task waited for an operator build that nothing announced. An operator session hand-builds W1-T13175.
    THE ORDER IS THE WORKFLOW HALF FIRST, so this task now depends on W1-T13175. Steps 2 and 3 read a token that only that
    step prints. Built before it, the rung is dormant: it matches nothing on any pull request, and its tests would prove
    a reader of text that no run produces. The two criteria that stay are the ones filed second and third; their proofs keep
    the names `W1-T11164 criterion 2` and `W1-T11164 criterion 3`.
    READ at origin/main ef8b74910f, so neither half is done:
    - .github/workflows/ci.yml:2120 already hands the gate step `LEDGER_RESULT: ${{ needs.coverage-ledger.result }}` (7dd14a2178,
      #16425, W1-T11161, 2026-11-03), but the `skipped)` arm (:2216) uses it only inside the PLAN_ONLY line and otherwise
      prints `coverage-ratchet: the shard matrix never ran (matrix result: skipped)` (:2222) whatever the ledger job's result.
    - `git grep -n -e 'coverage-ledger-cancelled' -e 'ledger_cancel_rerun_attempted'` finds no line outside plan/, and the
      suite this task names does not exist.
    - The sweep already reads coverage-ratchet's text from a failing check's log tail, for example src/lib/sweep.ts:6759
      `if (!/SHARD HANG\W+the matrix was cancelled/.test(tail)) return undefined;`, so a line the gate step prints is
      readable to step 2 without any new transport. W1-T13175 pins the exact text; read its record before writing the matcher.
    The INVARIANT line above and the `invariant:` prefix on the last criterion are new, for the lint rule
    design-invariant-proof; they restate step 3 and add no behaviour.
    AMENDED 2026-11-16 (operator session, second amendment): step 2 said the rung reads the token from "the failing
    coverage-ratchet check's output title", and the first amendment of the same day said the log tail. Only the second is true:
    an Actions job cannot set its check run's title by printing a line. Step 2 now says what the sweep can read. No criterion
    changes meaning.
    - READ src/lib/sweep.ts: the matcher this rung is modelled on tests the tail, `if (!/SHARD HANG\W+the matrix was cancelled/.test(tail)) return undefined;`.
    - READ src/lib/tick-read-worker.ts: the tail is the job's log, and when the log is unreadable or names nothing it is the check
      run's failure annotations (`tailSource = "annotations"`, read from `check-runs/<id>/annotations` and kept where
      `annotation_level === "failure"`; the type is `CiTailSource` in src/lib/sweep.ts).
    - W1-T13175 therefore prints the token on an `::error::` line, as the SHARD HANG line is printed, so it is in the log and in
      the annotations. Match the words after the prefix: a log line shows them after the runner's own error marker, and an
      annotation message holds them alone.
  falsifier: |
    At origin/main nothing re-runs a coverage-ledger job that was cancelled after its steps succeeded until a fix round has been
    dispatched and committed nothing. Take the receipt check out of the rung and the last criterion must fail: the same head is
    re-run a second time.
  note: |
    Reserved with rmd next-task-id --branch plan-file-1793665615994. Distinct from W1-T11161 (#16332): that task makes an evidenced
    plan-only diff not applicable; this one re-runs the cancelled prerequisite for every diff, code included.
