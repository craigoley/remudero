      proof: 'grep: test("W1-T10756: every fleet cron line converges to the install checkout with check lines" in test/deploy/the-fleet-cron-lines-converge-to-the-install.test.ts'
    - claim: "a crontab line that runs a repo script out of a checkout other than the converged install reads DRIFTED in check mode, naming that checkout"
      proof: 'grep: test("W1-T10756: a cron line that runs a frozen checkout reads drifted" in test/deploy/the-fleet-cron-lines-converge-to-the-install.test.ts'
    - claim: "the beat pushes from a checkout with no credential helper using GH_TOKEN, and leaves no objects in the checkout it runs from"
      proof: 'grep: test("W1-T10756: a beat pushes from the install and leaves no objects in it" in test/daemon/a-heartbeat-running-stale-code-says-so.test.ts'
    - claim: "the beat publishes its own script blob against the converged install's and reads STALE when they differ, current when they match, unknown when the install cannot be read"
      proof: 'grep: test("W1-T10756: the beat names stale code when its script differs from the converged install" in test/daemon/a-heartbeat-running-stale-code-says-so.test.ts'
    - claim: "fleet-heartbeat-watch.yml raises a per-host stale-code issue outside the liveness chain for a STALE verdict and for a fresh beat that carries no verdict at all, and resolves it on current"
      proof: 'grep: test("W1-T10756: the watcher raises stale code, including a beat that predates the field" in test/daemon/a-heartbeat-running-stale-code-says-so.test.ts'
  falsifier: |
    - Leave the heartbeat row out of the table: the installer case must fail on the frozen line.
    - Match the old line by the installed path only, the way the janitor's grep does: the frozen
      `<state>/remudero/...` line survives beside the new one, and the one-line count must fail.
    - Drop the census: the drifted-checkout case must fail.
    - Remove the push's own credential helper: the credential case must fail.
    - Write the beat's objects into `${INSTALL_DIR}/.git` again: the objects case must fail.
    - Compare the install's HEAD sha with itself instead of the running file's blob: the
      stale-code case must fail.
    - Raise only on an explicit STALE, so a beat without the field stays silent: the field-less
      half of the watcher case must fail.
    - Put the arm inside the liveness `elif` chain: the watcher case's FRESH-beside-code assertion
      must fail.
    GUARDS that held at base and must still hold:
    - W1-T4770's janitor tests in test/host-units-install.test.ts (exactly one cleanup entry,
      unrelated lines survive, DRIFTED on an edited line);
    - the beat never runs gc or prune and never touches a working tree or index (W1-T2529's
      suite);
    - every existing liveness arm still classifies as before (test/fleet-heartbeat.test.ts);
    - host-update.sh resolves its sibling files from the directory it runs in, so the reclaim
      can run from daemon-install.
    Each guard's existing case must fail when its production branch is removed, and pass again with
    zero failures once it is restored.
