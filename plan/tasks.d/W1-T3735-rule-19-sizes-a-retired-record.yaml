- id: W1-T3735
  title: "RULE 19 SIZES A RECORD THAT WILL NEVER BE BUILT — `[sizing]` blocks a `retirement: withdrawn` shard for spanning too many concerns, while `proof-shape` on the same record correctly downgrades itself because it will never run"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
  rationale: |
    MEASURED 2026-09-17 on #5901, one `rmd lint-plan --base origin/main` run over W1-T3726, a
    record carrying `status: blocked` and `retirement: withdrawn`:

      ✗ W1-T3726: [sizing] spans 3 distinct subsystems/concerns at risk:medium —
        Rule 19: raise to risk:high or decompose into one task per concern
      ⚠ W1-T3726: [proof-shape] criterion 1 has no observable proof — DOWNGRADED:
        this record is retired (withdrawn), so it will never be built and this proof will never run

    TWO CHECKS, ONE RECORD, OPPOSITE READINGS. `proof-shape` already knows the fact and states it
    outright. `sizing` blocks on it.

    (1) WHAT RULE 19 IS FOR IS DISPATCH. Its remedy — "raise to risk:high or decompose into one task
        per concern" — is advice to whoever will BUILD the task, about the blast radius of a change
        nobody is going to make. On a withdrawn record it is a demand to edit a field that changes
        nothing, and the repo's own linter says so one line later.

    (2) IT BLOCKS, AND THE ONLY EXIT IS COSMETIC. #5901 cleared it by setting `risk: high` and
        `band_meaning: span` on a record that will never be dispatched. That is a true statement
        about a surface nobody will touch, written only to satisfy a gate — the shape this repo
        refuses everywhere else.

    (3) THE PRECEDENT IS ALREADY IN THE FILE. `proofShapeViolations` takes exactly the disposition
        this asks for, with a stated reason, and names it in the message a reader sees. This is not
        a new policy; it is one check catching up with another.
  design: |
    (i) REUSE THE PREDICATE THAT ALREADY DECIDES THIS. `proof-shape`'s downgrade keys on the record
        being retired; `sizingViolation` consults the SAME reading rather than a second notion of
        "retired", so the two can never disagree about which records are live.

    (ii) DOWNGRADE, DO NOT DELETE. The violation is still reported, as a warning, with the reason
         named in its own message — exactly what `proof-shape` does. A retired record that a future
         operator un-retires must not silently inherit a clean bill; the observation stays on the
         page.

    (iii) A LIVE RECORD IS UNTOUCHED, and that is the assertion that matters: every `status` other
          than a retired one keeps today's blocking behaviour byte-for-byte.

    NOT IN SCOPE: every other check's treatment of a retired record — this task changes one, on the
    evidence of one measurement, and names the pattern for whoever measures the next.
  acceptance:
    - claim: "a retired record's sizing violation is reported as a warning rather than blocking, because it will never be dispatched"
      proof: "unit test: a withdrawn record's sizing violation does not block"
    - claim: "the downgraded message says why it was downgraded, so the observation is not silently lost"
      proof: "unit test: the downgraded sizing violation names the retirement"
    - claim: "a live record of the same shape still blocks, so the rule is not weakened for anything dispatchable"
      proof: "unit test: a live record with the same span still blocks"
  falsifier: |
    Drop the violation entirely for a retired record rather than downgrading it and the second
    assertion goes red — a record that is later un-retired would come back with no sizing
    observation at all. Key the downgrade on `status: blocked` rather than on the retirement and a
    blocked-but-live record stops being sized, which the third assertion catches.
  risk: low
  band_meaning: blast-radius
  origin: human
  plan_refs: [W1-T3099]
