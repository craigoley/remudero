  rationale: |
    OBSERVED 2026-11-10 on the first-parent history of main, 48 hours, 165 merges: 36 merges (22%) were one-record pull requests from machines.
    - 14 came from gardeners, 7 from the machine-filing judge, 6 from refusal amendments and 9 from triage outcomes. Sibling tasks in this filing cover the gardeners, the judge and the triage outcomes.
    - The refusal amendment opens a pull request on `refusal-amendment/<task id>` from `openAmendmentPr` in src/lib/sweep.ts.
    - The landing in src/lib/feedback-landing.ts already puts many files in one pull request on one fixed branch. `LANDING_BASES` has four families.
    OBSERVED 2026-11-10 in the code, by the first build attempt, which stopped:
    - The four families push again for each added file (`finishLanding`, `stageBranchPending`). Each push restarts CI and review. A sealed family needs its own path.
    - `findPendingLandingPrSteps` reads a failed listing as "no pull request". For a sealed branch that reading leads to a push over an open pull request.
    - `landContentSteps` writes the bytes of an input over the copy on main. An edit that waits while main changes the same file would undo the change on main.
    - `RefusalAmendmentIo.openAmendmentPr` in src/lib/refusal-amendment.ts must return `{ prUrl: string }`. An amendment that waits has no pull request.
    - `plan_amendment_pr` in src/run-task.ts (the escalation triage) throws when the result has no `prUrl`.
    - A gardener cannot use the family yet. `GardenCheckout.land` in src/lib/gardener.ts returns a URL or nothing, and "nothing" is a failed filing that releases the reserved id. The gate `task-id-existence` refuses a new id on a branch that is not its reservation holder (`evaluateReservationHolderConflicts` in scripts/task-id-existence-check.mjs). So this task takes only an edit of a file that origin/main holds. W1-T12221 and W1-T12222 add the gardeners.
    - In a test, `repoDir` in `buildSweepEffects` is the real checkout unless `localRepoName` differs. A landing that runs real git there under `withLiveWritesAllowed` would push to the real origin. The landing must use the injected git and gh of the sweep when a test injects them.
  design: |
    Add a family for task files to `LANDING_BASES` and its branch to `LEGACY_LANDING_REFS`. Export `landTaskFilesAsync` and a reader of the staged files.
    Stage: for each input, read the blob of the path on origin/main (the base). Refuse a path outside plan/tasks.d, and a path with no base. Refuse an input when another edit of the same path waits, and when the same bytes were set aside before. Run the plan preflight on a commit of main plus this one file. If it is red, do not stage, and return the failures and whether main alone has the same red (the W1-T5531 rule stays with the sweep). If it is green, write the file and a record of its base, claim and proof under `<state root>/state/task-files-landing-pending`.
    Land: if nothing is staged, make no call. Read the open pull requests of the branch. If the read fails, wait. If one is open, wait: that is the seal. Else fetch, drop each staged file whose bytes main holds, set aside each file whose base moved, and build one tree from main plus the staged files. Run the preflight on that tree unless the same tree passed at the stage. On a red, test each file alone: set aside the files that are red and that main does not cause, and land the others. Push with a lease on the branch tip that was read. A lost lease means wait. Open the pull request and write its URL into each record.
    Set aside: move the file and its cause to `<state root>/state/task-files-landing-refused` and log one row. A file whose landing pull request was closed without a merge is set aside too.
    In the sweep, `openAmendmentPr` stages through the family and needs no worktree. After the loop over the candidates the effect lands once, so that the amendments of one pass share one pull request. A new effect lands the waiting files on each full pass that drafted no amendment. The probe for an existing amendment reads the staged files and the open landing pull request, and still reads the old branch `refusal-amendment/<task id>`.
    In src/lib/refusal-amendment.ts, `openAmendmentPr` may return no `prUrl`, and the outcome `waiting` is added. The ledger row for the source run settles it, as every other outcome does.
    NOT IN SCOPE: gardeners, the machine-filing judge and the repair of a task file (W1-T12221), a new task id (W1-T12222), `rmd plan`, `rmd triage`, `rmd approve`, and any file outside plan/tasks.d.
  falsifier: |
    Push a second file to an open landing pull request and criterion 3 must fail. Read a failed listing as "no pull request" and criterion 4 must fail. Write a staged edit over a moved base and criterion 6 must fail. Let one refused file stop the batch and criterion 7 must fail. Remove the read of staged files from the probe and criterion 9 must fail. Restore and require all twelve to pass.
