  note: |
    `risk: high` IS RULE 19's SPAN, NOT THE BLAST RADIUS, AND IT WAS SET FROM THE LINTER RATHER
    THAN GUESSED. `sizingViolation` (`src/lib/task-linter.ts`) exempts `risk: high` outright and
    otherwise blocks at two or more subsystems; this `files:` list spans a new script, its data
    baseline, CI wiring and a test, which scores above that line. The verification is recorded
    with this filing: the same shard at `risk: medium` draws the sizing block naming those
    concerns, and at `risk: high` it does not. The real radius is small — the deliverable is a
    read-only checker plus its baseline, and it changes no runtime path.

    THE ID WAS PRE-MINTED AND READ BACK BEFORE ANYTHING WAS WRITTEN. Eight surfaces were swept,
    each against a control pre-qualified for THAT surface, under the rule that a surface whose own
    control reads zero is DISQUALIFIED rather than used to license the target's zero. Reservation
    ref present (the pre-mint, `efd08077`, minted 2026-08-23T13:49:10Z) against a namespace of 293
    refs and an absent-id control at 0; shard filename 0; plan `- id:` lines 0; any tracked
    mention 0 — the first three against W1-T1248 at 1, 1 and 3; live `run-W1-T1263-*` heads 0
    against an 84-branch `run-*` namespace; merged trailers 0; merged subjects 0; and a
    count-per-head sweep of 91 open heads read through git objects, 0.

    ONE CONTROL FAILED AND WAS REPLACED RATHER THAN LEANED ON. The merged-trailer surface was
    first controlled on W1-T1248, which reads 0 — because its PR has not merged, so it has no
    trailer on main. A zero control licenses nothing. It was re-qualified empirically on an id
    drawn from the trailers actually present on main, against 280 distinct ids carrying one.

    THE HISTORY QUERIES REQUIRED AN UNSHALLOW FIRST, AND THIS IS RECORDED BECAUSE IT SILENTLY
    INVALIDATES A SWEEP. The session container's clone arrived shallow at 108 commits with a
    horizon of 2026-08-17 — later than the 2026-08-05 document — so every history query returned
    a clean zero with a passing readability control. Unshallowed to 2223 commits back to the
    initial commit before anything below was measured. `src/run-task.ts` is 1,460,084 bytes, over
    GitHub's 1 MB contents cap, and was read through git objects for the same reason.

    THE CLAIM THAT W1-T1258 RECORDS THE FOUR CHECKED RECOVERY PATHS DID NOT HOLD AND IS NOT CITED
    HERE. W1-T1258 was swept on the same eight surfaces as this id and exists ONLY as a
    reservation ref (`2e807ccc`, minted 2026-08-23T13:29:44Z, twenty minutes before this one) —
    no shard, no mention on main, no open head, no trailer, no subject. Citing it would have shipped
    a pointer to a record that does not exist, which is this task's own defect in miniature. The
    recovery paths are cited from their real carriers instead: `710b18b5`'s commit message and the
    P48 entry in `MASTER-PLAN.md`.

    WHAT MUST NOT CHANGE, STATED SO A BUILDER CANNOT DRIFT INTO IT. `state/` stays gitignored and
    stays sweepable. Do not propose committing it, do not add carve-outs to `.gitignore`, and do
    not weaken, delay or exempt `sweepStaleTempDirs`, `scratchReap`, `reapStaleWorktrees` or the
    container's state mount. The `state/` gitignore entry is load-bearing for a reason recorded in
    W1-T256 — runtime exhaust the daemon writes into its own tree every run, which un-ignored reads
    as dirt in `git status --porcelain` and crash-looped the daemon before W1-T255 — and
    `state/service-tokens.json` lives there. The defect is not that scratch is scratch. It is that
    a durable record was written into scratch and then cited as authority.
