    opt-in per construction and one of sixteen gateway constructions opts in. THIS TASK FIXES WHAT
    HAPPENS AFTER A REFUSAL. A fleet where every gateway is paced still paces THROUGH a refusal at a
    fixed gap; a fleet that backs off correctly still leaves fifteen constructions unpaced. They
    compose and they do not overlap: W1-T1005 declares src/lib/status.ts and test/status.test.ts;
    this declares src/lib/open-prs-rest.ts and test/open-prs-rest.test.ts. NO DECLARED PATH IS SHARED,
    so the partitioner will not serialise them against each other.

