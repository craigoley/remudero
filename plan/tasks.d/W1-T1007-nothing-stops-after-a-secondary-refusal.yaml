- id: W1-T1007
  title: "NO CALL PATH CAN STOP AFTER A SECONDARY-LIMIT REFUSAL — recordResult arms the widening from `rateLimited` and the stand-down from `budget`, and the only production caller passes no budget at all, so the one stop that exists can never fire: honour retry-after when present and back off exponentially with jitter when absent, bounded, instead of pacing through a refusal at a fixed gap"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
  rationale: |
    RE-DERIVED 2026-08-18 AT origin/main c0e5f3378. No `/rate_limit` call was made — that endpoint is
    exempt from the primary limit but counts against the SECONDARY one, which is the limit at issue.

    (1) THE ANSWER TO "CAN ANYTHING STOP" IS NO, AND THE REASON IS ONE LINE PAIR. In
    `createGhCallPacer` (src/lib/open-prs-rest.ts) `recordResult` sets:
      gapMs     = rateLimited || lowWater ? rateLimitGapMs : minGapMs;
      standDown = budget !== undefined && budget.limit > 0 && budget.remaining <= budget.limit * floorFraction ? budget : undefined;
    THE WIDENING IS ARMED FROM `rateLimited`; THE STOP IS ARMED ONLY FROM `budget`. A refusal — the
    thing that actually happens when the secondary limit engages — can therefore only ever slow the
    next call to `DEFAULT_GH_PACE_RATE_LIMIT_GAP_MS` (10,000ms). It can never stop one.

    (2) AND THE STOP CANNOT FIRE AT ALL TODAY, WHICH IS WORSE THAN THE QUESTION ASSUMED.
    `paceGhEntry` is the ONLY production caller of `recordResult`, and it calls
    `pacer.recordResult(false)` and `pacer.recordResult(isRateLimited(err))` — with NO second
    argument. `budget` is declared `budget?: GhBudgetReading`, so it is `undefined` on every
    production call, so `standDown` is always `undefined`, so `wait()` never throws.
    `GhPaceFloorStandDownError` HAS A READER — src/lib/sweep.ts imports it and branches on
    `if (!(e instanceof GhPaceFloorStandDownError)) return undefined;` — but nothing can ever produce
    it. This is not a built-and-unread mechanism; it is a built-and-UNREACHABLE one, and W1-T529's
    floor is inert in production. NAMED HERE, NOT FIXED HERE — wiring the budget is a different
    change with a different falsifier, and it addresses the PRIMARY bucket, not this limit.

    (3) SPACING ALONE COULD NOT HAVE PREVENTED THE MEASURED INCIDENT. The board gateway's densest
    30-minute window carried 164 failures at a 1.8-second MEDIAN inter-arrival, every one classified
    `rate_limit`. Once the limit is engaged, a 1.5s or even 10s fixed gap is still a request stream
    into a refusal; what GitHub asks for is a wait proportional to the refusal, not a slightly wider
    metronome. W1-T468's own header states the doctrine already — the secondary limit is "a signal to
    SLOW DOWN, never to retry" — and this task is what implements the second half of that sentence.

    (4) NOTHING READS GITHUB'S OWN BACKOFF INSTRUCTION. MEASURED: `retry-after` (either case) reads 0
    across all of `src/`, and `x-ratelimit` reads 0, against a control of 26 `GhCallPacer` hits.

    (5) AND THE CLASSIFIER CANNOT TELL THE TWO LIMITS APART, WHICH BOUNDS WHAT THIS TASK CAN CLAIM.
    `isGhRateLimitError` (src/lib/status.ts) delegates to `classifyGhFailure`, which matches
    `/rate limit|quota|secondary rate limit/i` against STDERR TEXT and returns one class,
    `rate_limit`, for both. There is no header capture on the failing path — `gh api -i` reads 0 in
    src/lib/open-prs-rest.ts — so a `Retry-After` value is only available if it appears in the text
    the CLI already surfaces. THIS TASK MUST THEREFORE TREAT THE HEADER AS OPTIONAL BY CONSTRUCTION
    rather than assuming it is present; see design (ii).
  design: |
    (i) THE CHANGE IS A WAIT POLICY AT THE REFUSAL, IN THE MODULE THAT ALREADY OWNS THE REFUSAL.
    `paceGhEntry` already sees the thrown error and already classifies it. It gains a bounded
    retry-with-backoff around the guarded call for the `rate_limit` class ONLY: honour a
    `Retry-After` if one can be read from the error, otherwise wait a floor of at least one minute,
    then back off exponentially with jitter, and THROW after a bounded attempt count. Every other
    error class rethrows immediately exactly as today.

    (ii) THE HEADER IS OPTIONAL BY CONSTRUCTION, NOT ASSUMED. Rationale (5) establishes that the
    failing path surfaces stderr text, not headers. The extractor is therefore an injected function
    from the error to an optional seconds value, defaulted to a parse of what the CLI already
    surfaces. Criterion 1 proves the honouring path with an error that carries one; criterion 2
    proves the floor path when it does not. A design that only worked when the header was present
    would be untestable against today's production surface and would silently never fire.

    (iii) JITTER IS NOT DECORATION HERE. The measured failure is several independently-built call
    sites landing in the same wall-clock second — the exact reason `GhCallPacer` is one shared
    instance. Deterministic backoff re-synchronises them on the retry; jitter is what stops the
    second collision. Criterion 3 must assert spread, not merely growth.

    (iv) THE BOUND IS THE SAFETY. An unbounded wait-and-retry converts a refusal into a hang, and
    `execFileSync` is SYNCHRONOUS on this path — src/lib/status.ts's own timeout doc records that a
    call which never returns "parks the daemon's only thread". So the retry count is bounded and the
    last refusal THROWS, reaching the caller's existing handling. Criterion 4 is that falsifier.

    (v) NO EXISTING BUDGET IS WEAKENED, AND THIS IS A HARD CONSTRAINT. `MAX_TRANSIENT_RETRIES` (3, in
    src/lib/classify.ts) and `policy.values.*.strikeCap` are untouched: this backoff sits INSIDE one
    guarded call and is invisible above it. A refusal that exhausts the bound still surfaces as one
    failed call to the caller, which spends exactly the strike it spends today — not fewer, not more.

    (vi) EXPLICITLY OUT OF SCOPE.
      - CROSS-PROCESS HEALTH STATE. A stale marker parks the fleet, and W1-T978 establishes the
        `state/` substrate cannot be reclaimed safely yet. Not proposed.
      - WIRING `budget` SO THE EXISTING STAND-DOWN CAN FIRE. Real (rationale 2), separate falsifier,
        and it addresses the PRIMARY bucket rather than the secondary limit.
      - SPLITTING `classifyGhFailure`'s single `rate_limit` class into primary and secondary. Would
        let the two get different policies; it is a classifier change, not a wait policy.
      - WHO HOLDS A PACER AT ALL. That is W1-T1005, the sibling — see the note.
  acceptance:
    - claim: "a refusal that carries a retry-after value waits at least that long before retrying"
      proof: "unit test: W1-T1007: a refusal carrying a retry-after waits at least that long"
    - claim: "a refusal with no retry-after waits at least the one-minute floor before retrying"
      proof: "unit test: W1-T1007: a refusal with no retry-after waits at least the floor before retrying"
    - claim: "successive refusals grow the wait exponentially and spread it with jitter"
      proof: "unit test: W1-T1007: successive refusals back off exponentially with jitter"
    - claim: "the attempt count is bounded and the final refusal throws to the caller"
      proof: "unit test: W1-T1007: the retry count is bounded and the last refusal throws"
