      proof: "unit test: test/lint-grep-unmatchable.test.ts"
    - claim: "a proof naming a path not on disk and a proof whose text is absent in every form are both silent, so a forward reference stays legitimate"
      proof: "unit test: test/lint-grep-unmatchable.test.ts"
    - claim: "the check emits nothing when the caller supplies no file reader, so the linter stays pure"
      proof: "unit test: test/lint-grep-unmatchable.test.ts"
    - claim: "a task whose only violation is this one does not fail the lint run"
      proof: "unit test: test/lint-grep-unmatchable.test.ts"
    - claim: "the lint command supplies the reader, so the check ships with a caller instead of dormant"
      proof: "grep: proofGrepUnmatchableViolations( in src/run-task.ts"
