  design: |
    Operator rulings: no fixed threshold (no new constant here), automated flow, one concern.
    1. READ THE RESUME. `PROGRESS_WATCHDOG_READ_STEPS` adds `daemon.loop_lag`. A `daemon.loop_lag` row newer than the
       newest progress row and written by the current generation's pid is a RESUME. The block ended at its ts, and
       the row's lag_ms says how long the loop was blocked.
    2. A RESUMED LOOP IS AGED FROM ITS RESUME. W1-T6598 does this for a boot: a generation's stall age runs from its
       own boot. A resume is handled the same way. The stall age runs from the newest resume when that is newer than
       the newest progress row, and the existing STALL_* bounds apply from there. A daemon that resumes and then makes
       no progress is still recycled. A daemon that blocks again writes no new resume, so its age keeps running from
       the old one and the allowance is never open-ended.
    3. SAY SO. While a resume is inside its allowance, the verdict is `RECOVERING` with action none. Its reason names
       the block's lag_ms, the resume time and the progress age it replaced. The launcher acts only on
       action=recycle, so it needs no change. CRASH_LOOP and the boot rule are unchanged and still win.
    Tests (new file, `test(` titles verbatim as in the proofs below) replay the 10-14 rows: the boot, the 04:49:08
    progress rows, the 05:35:46 loop_lag and a 05:35:56 now. They also cover a resume followed by a second silence that
    passes the bound, and a loop_lag row from a previous generation's pid.
