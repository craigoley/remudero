  title: "TWO GATES PRINT THEIR OWN ESCAPE HATCH IN THE FAILURE TEXT, SO ANYTHING OPTIMISING FOR GREEN TAKES IT — config-reader-seams offers `or add an ALLOWED entry saying why it needs none` in the message a fix worker reads, and route-scope-matrix could be silenced by dropping a route from the sweep; MEASURED 2026-09-01 on PR #3535, taking the printed hatch would have satisfied the census while leaving `rmd serve` refusing to boot on any checkout without a plan/policy.yaml"
