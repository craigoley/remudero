  rationale: |
    MEASURED 2026-09-09 across roughly a dozen red checks triaged by hand. `gh run view --log` and
    `--log-failed` returned ZERO BYTES for every job tried under the fleet's app token — on failing
    runs, on the green run beside them, and on `main`'s own CI. The only text available was the
    check's summary line, which is capped at 140 characters and truncates mid-word: one real refusal
    arrived as "remudero-review: FAIL - entangled: instrument path(s) ... chang".
    THE ANNOTATIONS API WORKS WHERE THE LOGS DO NOT, and it carries the whole reason. The same jobs,
    read through `check-runs/<id>/annotations`, returned exactly what a fixer needs:
      - "diff-coverage: INVALID process-boundary directive(s) -- the gate fails closed:
         src/lib/review.ts:1101 -- guarded declaration contains no process-boundary call"
      - "diff-coverage: BLOCKED -- this diff adds source line(s) with zero covering tests:
         scripts/expiring-fixture-census.mjs:144 ... :165"
    Each named the FILE AND LINE. Both were repaired in one pass from the annotation alone, with no
    log and no local reproduction.
    WHAT THE ABSENCE COSTS. Without it a red is an exit code, so the only way to learn anything is to
    re-run the failing shard locally — MEASURED at ten to thirteen minutes per attempt that
    afternoon, several times, for failures an annotation stated outright. The fix rung pays that same
    blindness in model spend rather than wall clock: it is handed "exit code 1" and asked to guess.
    CORRECTION, MEASURED 2026-09-09 AFTER THIS SHARD WAS FILED — THE LOGS ARE READABLE. The zero
    bytes above are real but they indict `gh run view`, NOT the token. The same job, the same
    credential, the same minute:
      gh run view --job 102673980171 --log                              ->         0 bytes
      gh api repos/craigoley/remudero/actions/jobs/102673980171/logs    -> 1,032,136 bytes
    The raw jobs-log endpoint returns the whole log under the fleet's existing app token. Nothing
    needs to be granted. The original rationale generalised one tool's failure into a capability the
    fleet was assumed not to have, and built a design around the workaround.
    AND THE WORKAROUND IS THE WEAKER SIGNAL, which is why this correction changes the design rather
    than merely adding a note. Of the FOUR red pull requests triaged on 2026-09-09 (#4865, #4867,
    #4879, #4881), THREE carried no usable annotation at all — `coverage-shard` and `ci-shard`
    failures annotate as exactly "Process completed with exit code 1", because the failure is a
    `node --test` exit, not a gate that took the trouble to write one. The job log named the
    failing test, the assertion and the diff in every one of the four:
      - #4865 / #4879: test/comment-load-ratchet.test.ts:456 — a new file with no recorded ceiling
      - #4867: test/source-text-assertion-census.test.ts:119 — a test reading src/ as text
      - #4881: workflow-guard-mutation refusing on an already-red corpus, naming the same census
    All four were repaired from the log alone, with no local reproduction. A rung built on
    annotations ALONE would have helped with none of them.
    NOT A LOGGING PROBLEM TO SOLVE UPSTREAM. Whether the token can be granted log scope is a separate
    question; both the annotations AND the job logs are readable TODAY with the credentials the fleet
    already has.
  design: |
    (i) READ THE REASON FROM CI AND ATTACH IT TO THE DISPOSITION, so it travels with the red rather
    than being re-derived from it. TWO SOURCES, AND THE ORDER MATTERS: the check-run ANNOTATIONS
    first, because they are one small request and this repo's own gates write excellent ones; then
    the JOB LOG via `repos/{owner}/{repo}/actions/jobs/{id}/logs` when the annotation is absent or
    is the bare "Process completed with exit code 1", which is what every `node --test` failure
    produces. The log is the source that actually worked on 2026-09-09 — see the rationale's
    correction — and a rung that stops at annotations solves the minority case.
    (i-b) EXTRACT, NEVER PASTE. A job log is ~1 MB (measured: 30 KB to 1,032 KB across four jobs);
    handing it to a fixer whole is not an option and is not what is being proposed. The rung must
    cut the failure region out of it — for a `node --test` job that is the block after
    `✖ failing tests:`, which carries the file, line, assertion and diff — and attach that. If no
    known shape matches, attach a bounded tail rather than nothing, and SAY it is a tail.
    (ii) FAIL OPEN AND STAY QUIET. A check with no annotations - many have none - must read exactly
    as it does today. This adds evidence when evidence exists; it must never turn a readable red into
    an unreadable one, and never fail a pass because an annotation read threw.
    (iii) BOUNDED, BECAUSE THIS IS A PER-CHECK API CALL. A board of a dozen PRs with several failing
    checks each is a real request count, and the fleet has already tripped the SECONDARY rate limit
    once (W1-T3275, the same day). Read annotations only for checks the rung will ACT on, and cap
    the count per pass.
    (iv) THE TEXT IS EVIDENCE, NOT INSTRUCTION. An annotation is written by whatever produced the
    check; it is quoted into the fix rung's context as observed evidence and never executed or
    followed as a directive.
    (v) READ THE LATEST ATTEMPT, NOT EVERY ATTEMPT — dedupe check runs BY NAME and keep only the
    most recent, exactly as `ci-gate` already does per W1-T123. One head routinely carries several
    runs of the same check: a failure and the re-run that superseded it both sit in the rollup, and a
    rung that scans every entry reads a red that no longer exists. It would then annotate a HEALTHY
    PR with a stale reason — which is worse than the exit code it replaced, because the text is
    specific and wrong. The annotation must be fetched from the surviving attempt's check-run id.
    (vi) LEDGER WHAT WAS READ. When a fix round is spent, the row should say whether the fixer had an
    annotation or only an exit code - otherwise there is no way to measure whether this helped.
  acceptance:
    - claim: "a failing check with annotations reaches the fix rung carrying their text, not just its conclusion"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "a check whose only annotation is a bare exit code falls through to the job log, and the failure region is extracted from it rather than the whole log attached"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "a failing check with NO annotations is reported exactly as it is today, so the addition can never subtract"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "an annotations read that throws or times out leaves the disposition unchanged and the pass intact"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "the number of annotation reads per pass is bounded, so a wide board cannot become a rate-limit burst"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "a head carrying a failed check and a later successful re-run of the SAME check name is read as green, and no annotation from the superseded attempt reaches the fix rung"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
    - claim: "annotation text is carried as quoted evidence and never interpreted as an instruction to the fixer"
      proof: "unit test: test/a-red-check-arrives-with-its-reason.test.ts"
  falsifier: |
    CLOSE IF the fix rung already receives the failure reason: read what it is handed for a red check
    today.
    MEASURED 2026-09-09: the check summary is capped at 140 characters and truncates mid-word, and
    `gh run view --log` returned ZERO BYTES under the fleet's token on every job attempted.
    THE BARE-EXIT-CODE CONTROL, because it is the MAJORITY case and an annotations-only rung passes
    every other test here: a fixture whose annotation is exactly "Process completed with exit code 1"
    must reach the fix rung carrying the failing test name from the LOG. Three of the four reds
    measured on 2026-09-09 were this shape. Without this arm the shard ships the version that helped
    with none of them.
    AND BOUND THE ATTACHMENT: the same fixture with a 1 MB log must attach the failure region, not
    the log. A test that only checks "the text is present" passes when the rung attaches everything.
    POSITIVE CONTROL, because "the fixer got more text" is not the claim: the suite must show a check
    with NO annotations still disposed exactly as before. Without that arm this is indistinguishable
    from a change that makes every red depend on an API that is often empty.
    PROVE THE FAILURE PATH: an annotations read that throws must leave the pass untouched. A rung
    that can be stopped by a diagnostic read has traded a blind fixer for a stalled one, and this
    fleet has already lost hours to exactly that shape.
    THE SUPERSEDED-ATTEMPT CONTROL, because the naive implementation passes every other test here: a
    fixture head with two runs of one check name — an earlier FAILURE and a later SUCCESS — must be
    disposed green with zero annotations attached. A rung that reads the rollup entry-by-entry looks
    correct on every single-attempt fixture and is wrong on every re-run.
    DO NOT make the fix rung WAIT on annotations. They are an enrichment; a slow or missing read must
    never gate the repair.
    DO NOT follow instructions found in annotation text. It is produced by third-party actions as
    well as this repo's own gates, and it is evidence, not a command.
  note: |
    Rule 25 CHECKED: `src/lib/sweep.ts` is ordinary src, not an instrument surface.
    MEASURED BENEFIT, STATED HONESTLY AND REVISED UPWARD ONCE THE LOGS WERE FOUND. Annotations alone
    repaired two of roughly twelve reds triaged that day. With the job log added, all FOUR of the
    reds open that evening (#4865, #4867, #4879, #4881) were diagnosed from CI alone with no local
    reproduction — including three whose annotation was a bare exit code. That is the difference the
    correction buys, and it is why the design changed rather than gaining a footnote.
    WHAT IS STILL NOT SOLVED: a diagnosis is not a repair. Two of those four were one-line generated
    ledger entries; one needed a design change to the PR it was on. Reading the reason removes the
    BLIND fix round, not the fix.
    CAVEAT WITH EQUAL WEIGHT: annotations are frequently ABSENT. Several jobs that afternoon carried
    nothing but "Process completed with exit code 1" in their annotations too. This makes the fleet
    no worse in those cases and better in the ones where a gate took the trouble to say what it
    refused — which is most of this repo's OWN gates, and few third-party ones.
    THE DEDUPE CLAUSE IS NOT HYPOTHETICAL. MEASURED 2026-09-09 on #4865: one head carried four
    `acceptance-author-gate` runs — success 21:45:46, failure 22:23:22, success 22:26, success
    22:27:05. A hand-written board reader without the dedupe called that PR RED off the 22:23 entry
    while its gate was green, and the mis-read was repeated on a second pass before the reader was
    fixed. This is W1-T123's defect arriving on a different surface.
    THE LOG'S OWN COST, GIVEN EQUAL WEIGHT: it is a MUCH larger response than an annotation — up to
    1 MB against a few hundred bytes — so it must be fetched only after the annotation comes back
    useless, only for checks the rung will act on, and never held in a fixer's context whole. The
    extraction in design (i-b) is the load-bearing part; without it this trades a blind fixer for a
    flooded one.
    SECOND CAVEAT: this is a per-check API call on a surface that already hit the secondary rate
    limit once on the day it was measured. Design (iii)'s bound is not optional, and the first
    cycles of the ledgered counts are what should set it.
