  rationale: |
    The original native triage published this reservation in PR14599, but its proposed plan used three identical whole-file proofs and a nonexistent src/commands/serve.ts. The unchanged lint correctly refused; preserve that failure, the original feedback and the unpublished proposal_pr bookkeeping commit. Correct the existing reserved task rather than reserving a competing one. This draft removes the unapproved task-specific budget override and supplies existing paths, distinct executable test titles and an explicit machine-filing judgment boundary; it changes no configured worker budget.
    The observed accepted-note tuple was present in the prior serving generation but absent from the next generation and the separately sampled Core file. The original note is retained and must not be replayed or copied. Current source roots appendOperatorNote/loadOperatorNotesForTask in their supplied code-tree root, while route, native prompt, fix-lane, note CLI and docket callers supply or directly read different roots. Source discovery must use the actual current caller/config context rather than assuming repoRoot is always module-relative.
    Read-only metadata on October26 positively verified that Serve and Core already see the same writable persistent state directory: matching bind source, directory device/inode and runtime user, with no files written. This qualifies a possible common boundary, not every repository's routing or an injection acknowledgment. Before wiring it, verify the real default callers' configured state root and repository/instance identity. Pass a typed explicit store context through those defaults; do not infer another account, repository or store from the working directory. Preserve existing write tiers, authorization, attribution and read-only callers. An unverified context must refuse rather than silently fork into a generation directory.
    Keep this repair to operator guidance. A successful response may attest a completed durable append, never prompt delivery or consumption without a separate actual acknowledgment. Preserve existing response shapes; a new delivery API is not included. Retain already-used legacy history and its provenance without scanning retired generations, migrating, copying or automatically reinjecting old accepted notes. Preserve existing append semantics and task filtering; do not add new business approvals or reinterpret duplicate messages as new authority.
    All listed source paths exist. src/run-task.ts owns serveCommand, note CLI and the direct docket/recency reads; src/cli/commands/run-task-verb.ts owns the default native prompt read; src/lib/sweep.ts owns fix-lane note reads and writes; src/lib/serve.ts wires the existing routes. src/lib/operator-notes.ts is the shared note boundary. Use the three existing physical suites; new test code must use package aliases. High/span records this coupled caller breadth, not new operating authority.
    Test real private stores through the actual route and default reader composition across two synthetic immutable code roots sharing one explicitly scoped persistent context. Check true append/readback, task and foreign-repository refusal, missing/unwritable context, unchanged stamps/order/history and the default CLI/fix/prompt paths. Remove only the stable-context wiring, retain the tests, observe the generation-switch assertion fail, restore exactly and require success. Prove every executable changed source file has positive coverage instrumentation and run the population/caller census, types, canonical stored proofs and normal review/CI.
    The separately reported answer-question false-append behavior remains an unqualified follow-up; this task does not change question workflows, stored answers, rulings or their execution. Broader Inbox snapshot/contention and Analytics timeout work remain separately tracked. Existing source-owner PR14363 and other Serve changes must be reconciled, not overwritten.
    This filing authorizes no history migration, accepted-note replay, live root/mount/link/permission/service change, restart, provider/billing/budget change, deployment, CI-infrastructure or Azure-memory work. Source implementation, protected merge, actual runtime adoption and naturally observed prompt acknowledgment are separate receipts. If the qualified common boundary cannot be established under those constraints, preserve the task as held and surface the precise unresolved fact.
