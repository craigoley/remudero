  falsifier: |
    At base the first case fails: the review's union read carries no line filter, so every unrelated row is
    parsed and held in the dedupe Set.
    - Filter rows after openLedgerUnion yields them instead of before dedupe: the dedupe-population assertion
      fails.
    - Keep `|| row.selection_assignment_id` in the retain predicate: the activity-rows case fails.
    - Restore `set -e` around the routing review step: the partial-snapshot case fails.
    - Write the outcome row only on success: the all-failed half of the ledger case fails.
    GUARDS that held at base and must still hold:
    - test/daily-routing-review.test.ts (report shape, prior-day deltas, quarantine resolutions);
    - test/routing-quarantine-resolution.test.ts and test/ci-refresh-prevention.test.ts;
    - test/field-trials-flow.test.ts (snapshot families, release withholding).
    Each guard's existing case must fail when its production branch is removed, and pass again with zero
    failures once it is restored.
