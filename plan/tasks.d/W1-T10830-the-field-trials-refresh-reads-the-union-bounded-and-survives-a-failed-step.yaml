  rationale: |
    RE-VERIFIED 2026-10-27, read-only, on the Azure host and on origin/main 07dbdcc77.

    THE CRASH. The service user's crontab runs `17 4 * * * ~/.local/bin/rmd-field-trials-refresh`, a copy
    whose blob (ab84b6cd) equals main's deploy/field-trials-refresh.sh. Its log
    (~/.local/state/remudero/field-trials-refresh.log, 910 lines) shows a `Daily routing review` line every
    day 2026-10-03..2026-10-18, then NINE `FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap
    out of memory` blocks (one per day, 10-19..10-27), each after Mark-Compact at ~3990-4030 MB. The script
    runs `set -euo pipefail`, and the routing review is its first docker step, so the case-file and
    `rmd field-trials` steps never run. Newest outputs in rmd-state2/state/field-trials:
    field-trials-flow-v1.json 2026-10-18 04:28, field-trials-github-v1.json 04:25, case-files-latest.json
    04:24, routing-daily/2026-10-18.json 04:18. Nothing since; nothing in the ledger says so (the
    field-trials command's own help says it "writes no ledger line").

    THE MECHANISM (read at 07dbdcc77, by symbol). readSource in scripts/private-routing-daily-review.mjs
    calls openLedgerUnion(stateDir, { since: <earliest ROUTING_EXPERIMENTS startedOn> = 2026-09-24 }) with no
    step, pattern or keep filter. openLedgerUnion (src/lib/ledger-union.ts) parses every line and, with the
    default exact-line dedupe, adds every line that passes the since filter to `seen`, a Set of full line
    strings. MEASURED on the host: rotations cut since 2026-09-24 plus the live file hold 5,413,201 lines and
    3,256,524,328 bytes (593 gz files, niced zcat | wc). On 10-18 the review read 3,055,664 core rows and
    still finished; the corpus has grown every day since. Raising the heap is not a remedy: the memory budget
    is one shared host budget.
    A SECOND DEFECT rides on the same read. The review retains every row carrying selection_assignment_id, up
    to 100,000 rows, but evaluateRoutingExperiment (src/lib/routing-experiments.ts) reads only
    worker.assignment, verdict.merged, fix.dispatch and the worker.attempt / verdict / *.done receipts. Since
    late September selection_assignment_id also rides worker.activity and inbox.draft_synthesized rows.
    MEASURED: in ledger.2026-10-01T23-59-54-541Z, 4,340 rows (4.79 MB) match the retain predicate (2,308 of
    them worker.activity), against 227 rows (0.17 MB) in ledger.2026-09-20T23-59-59-117Z. The 10-18 core
    source already reported `ledger-retention-row-bound`, so every core experiment report read
    `source-incomplete; next action: repair-source-evidence` from a truncated retained set.

    NOTHING ELSE COVERS THIS. Swept plan/ and the 15 open PR heads (positive control: the same sweep finds 4
    hits on the commit that last touched the review script): no task or PR names routing-daily-review's
    memory, the refresh's set -e, or a refresh outcome row. W1-T10756 converges the cron LINE only.
  design: |
    1. BOUNDED READ. The routing review never holds the corpus. Give its union read a line filter (the
       openLedgerUnion `step` option, or a raw-line keep/pattern pre-check on the windowed reader) so only
       rows it retains enter the dedupe Set and get parsed; or reuse an existing bounded projection (the
       benchmark-cohort source records) if it already carries these rows. Narrow the retain predicate to what
       evaluateRoutingExperiment, observeReviewFlow and the self-improvement block actually read, so
       worker.activity and other assignment-stamped rows stop filling the retained set. The source-quality
       counters (rowsRead, malformed, future-dated, invalid timestamp, newestTs, quarantine findings) keep
       their meaning: count them while streaming, never by retaining lines. Do not raise
       --max-old-space-size or NODE_OPTIONS anywhere.
    2. INDEPENDENT STEPS. deploy/field-trials-refresh.sh runs each step (routing review, case files, field
       trials snapshot) to completion or failure without aborting the others, records each step's exit
       state, and still runs the snapshot step after a failed routing review. A failed case-file step falls
       back to the previous case-files-latest.json and says so. Argument validation and the lock stay fail
       closed.
    3. A PARTIAL SNAPSHOT NAMES ITS FAILED STEPS. The field-trials snapshot carries a refresh section listing
       each step with state ok / failed / skipped and its exit code, so a snapshot built after a failed step
       reads partial, never healthy.
    4. THE COLLECTOR LEDGERS ITS OWN OUTCOME. Every pass, including one where every step failed, appends one
       `field-trials.refresh` row to the core ledger through the existing ledger writer (no hand-rolled
       append). recordFieldTrialsRefresh in the new src/lib/field-trials-refresh.ts builds the row; the
       `rmd field-trials` command (fieldTrialsCommand) calls it, with a record-only mode the shell runs
       when the snapshot step itself failed (the help syntax in src/run-task.ts names the new flag).
       The row carries each step's state, the snapshot asOf it produced or null, the asOf of the last good
       snapshot, and the running script's own blob so a stale installed copy is visible. A step that failed
       on the previous pass and fails again raises one deduplicated alert through the existing escalation
       path (src/lib/escalate.ts); the next pass where that step succeeds resolves it.
    After merge the installed host copy differs from main until deploy/install-field-trials-refresh.sh
    --install runs; W1-T10756's convergence reports that drift. Report the exact install command for the
    operator; never run it from a session.
