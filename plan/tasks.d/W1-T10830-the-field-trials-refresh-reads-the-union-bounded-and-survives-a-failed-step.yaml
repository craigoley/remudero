    - claim: "a routing review that exits non-zero leaves the case-file and snapshot steps running, and the snapshot names the failed step"
      proof: 'grep: test("W1-T10830: a failed routing review still produces a partial snapshot naming it" in test/deploy/a-field-trials-refresh-step-failure-keeps-the-other-steps.test.ts'
    - claim: "every refresh pass, including one where every step failed, appends one field-trials.refresh row with each step state and the last good snapshot asOf"
      proof: 'grep: test("W1-T10830: every refresh pass ledgers its step states" in test/deploy/a-field-trials-refresh-step-failure-keeps-the-other-steps.test.ts'
    - claim: "the field-trials command builds the refresh outcome row through the new module"
