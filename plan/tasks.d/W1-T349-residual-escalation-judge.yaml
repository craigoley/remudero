  note: "verify:auto — routing decisions over injected judge deps plus a corpus-replay fixture, all
    in-process; the fixture build is a one-time mechanical derivation from the GitHub record.
    risk:high — an LLM sits between the fleet and the operator's attention: the false-negative
    direction hides work from a human, which is why demote-only, exemptions, fail-open and the
    zero-demotion holdout line are all acceptance-level, not advisory.
    budget_usd 90 — the largest in the arc: the judge itself is small but the corpus fixture and the
    two-direction falsifiers are the deliverable.
    depends_on IS REAL, BOTH EDGES: W1-T345 so the judge never spends on duplicates and the residue it
    sees matches the residue it was sized for; W1-T346 so demotion routing has the label vocabulary
    and the exemption rule has a typed field to key on.
    SEQUENCED LAST IN THE ARC DELIBERATELY: the deterministic stack (reconciler + referent coverage +
    W1-T114 + W1-T345) retires ~90% of historical volume without a model; this judge earns its spend
    only on what remains, and its own holdout replay is the evidence either way. If the residue after
    the deterministic stack proves too small to justify a model call, that is a finding for the
    operator to rule on — recorded as a question, never as a filed-away no (the decision-authority
    audit's rule)."
