  acceptance:
    - claim: "When the coverage-shard matrix is skipped and needs.coverage-ledger.result is cancelled, the coverage-ratchet aggregator fails with a distinct line naming coverage-ledger-cancelled and the run's head, not the generic never-ran text"
      proof: "grep: W1-T13175 criterion 1 in test/ci/a-cancelled-coverage-ledger-names-itself-in-the-coverage-gate.test.ts"
