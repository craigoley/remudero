    (amended 2026-11-16) THE SIBLING SUITE'S INPUTS CHANGE AND ITS ASSERTIONS DO NOT: test/ci/a-plan-only-diff-whose-coverage-matrix-was-skipped-passes-as-not-applicable.test.ts is in `files:` for one edit, the `LEDGER_RESULT: "failure"` of its nine criterion-2 cases. Change any assertion in it, or leave a criterion-2 case on a cancelled ledger, and this task is not done. Make the gate pass a skipped matrix behind a failed ledger and criterion 3 must fail, as must that suite's criterion 2.
    GUARD that held at base and must still hold, untouched: test/a-cancelled-shard-is-not-a-broken-diff.test.ts, which drives the same step.
