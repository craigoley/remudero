  rationale: |
    This is the workflow half of W1-T11164 ("a cancelled coverage ledger is re-run before the ratchet judges"), cut out on 2026-11-16 so the fleet can build the rest. The daemon never dispatches a task whose `files:` names a path under .github/workflows/ (W1-T5351, `workflowPaths` in src/lib/drain.ts: the fleet App cannot push a workflow file), so W1-T11164, at priority 2, waited for an operator build that nothing announced. An operator session hand-builds this half.

    THIS HALF COMES FIRST. W1-T11164's sweep rung re-runs a pull request whose only red is a coverage-ledger cancellation. It recognises that red by a token in the coverage gate's output, and nothing prints the token today, so W1-T11164 depends on this task.

    WHAT W1-T11164 MEASURED (2026-11-02/03, over 30 completed pull_request runs of ci.yml): 2 of 32 coverage-ledger job attempts were cancelled at the job's 1-minute ceiling after every step had concluded success within 19 s. A cancelled prerequisite skips the coverage-shard matrix, and coverage-ratchet then fails with the same text as any other skip.

    READ at origin/main ef8b74910f:
    - .github/workflows/ci.yml:1536, the coverage-ledger job still has `timeout-minutes: 1`.
    - :2120, the gate step ("Require every coverage shard to produce an artifact", id `coverage-gate`, in job coverage-ratchet-required) already receives `LEDGER_RESULT: ${{ needs.coverage-ledger.result }}` (7dd14a2178, #16425, W1-T11161) and `RUN_HEAD_SHA`.
    - :2216-2224, its `skipped)` arm asks `plan_only_evidenced` first and otherwise prints `coverage-ratchet: the shard matrix never ran (matrix result: skipped) — nothing was measured, so nothing is certified. Open the workflow run to see which upstream job gated it.` and exits 1. It does not look at `LEDGER_RESULT` outside the PLAN_ONLY line.
    - `git grep -n -e 'coverage-ledger-cancelled'` finds no line outside plan/.
    - test/ci/a-plan-only-diff-whose-coverage-matrix-was-skipped-passes-as-not-applicable.test.ts (W1-T11161) already runs this step's own bash with a controlled environment (`runStep(gate.run!, { …, SHARD_RESULT: "skipped" })`). The new suite drives the step the same way.
  design: |
    1. In the `skipped)` arm of the coverage gate step, after the `plan_only_evidenced` branch and before the generic line: when `LEDGER_RESULT` is `cancelled`, print
       `::error::coverage-ratchet: coverage-ledger-cancelled — the coverage ledger job was cancelled at its ceiling at <head>; the matrix never ran (W1-T11164)`
       with `<head>` from `RUN_HEAD_SHA`, and exit 1. The `::error::` prefix is the one the `SHARD HANG` line of the same step has (amended 2026-11-16, see below); the words after it are unchanged. The text is W1-T11164's, kept word for word because its sweep rung matches it; the id in it stays W1-T11164 for the same reason. Every other value of `LEDGER_RESULT`, an empty one included, falls through to today's line.
    2. New suite test/ci/a-cancelled-coverage-ledger-names-itself-in-the-coverage-gate.test.ts (the folder `rmd test-place` computes). It reads ci.yml with the `yaml` package, takes the step with id `coverage-gate` from job coverage-ratchet-required, and runs its `run:` body under bash with a controlled environment, as the W1-T11161 suite does. Root through `#test/helpers/repo-root.js`.
       - criterion 1: `SHARD_RESULT=skipped`, `LEDGER_RESULT=cancelled`, a SOURCE class and a 40-character `RUN_HEAD_SHA` exit 1; the output holds the token and that sha, and does not hold "the shard matrix never ran (matrix result: skipped)".
       - criterion 2: the same skip with `LEDGER_RESULT` set to `success`, `failure`, `skipped` and empty exits 1 with today's generic line and without the token; an evidenced PLAN_ONLY pull request with `LEDGER_RESULT=cancelled` still exits 0 with the not-applicable line (the W1-T11161 case); and `SHARD_RESULT` of `success`, `failure` and `cancelled` never print the token.
    3. In the PR body, name the token line as the contract W1-T11164 reads, so a later edit to its wording is seen as a change to that task.
    4. (amended 2026-11-16) A DELIBERATE CHANGE TO A SIBLING SUITE'S INPUTS, NEVER TO WHAT IT ASSERTS. In test/ci/a-plan-only-diff-whose-coverage-matrix-was-skipped-passes-as-not-applicable.test.ts, the nine cases of "W1-T11161 criterion 2: any other skipped matrix still fails with the never-ran message" that spread `PLAN_PR` add `LEDGER_RESULT: "failure"`. `PLAN_PR` itself keeps `LEDGER_RESULT: "cancelled"`, because criterion 1 of that suite asserts `coverage-ledger=cancelled` in the not-applicable line and must not move. No assertion in that suite is edited: every one of the ten cases still exits 1, still matches the never-ran message and still does not say not applicable. The one case that suite loses, a cancelled ledger on a diff that is not plan-only, is asserted in this task's own suite (criterion 1: exit 1 and the token). This task's suite also runs the same nine classes and events with a failed ledger (criterion 3), so the fail-closed reading is proved in two places.
       WHY `failure`: READ in ci.yml, the coverage-shard matrix (job `coverage-ratchet`) has `needs: [coverage-ledger]` and no `if:`, and the coverage-ledger job has no `needs:` and no `if:`. So the matrix is skipped exactly when the ledger job did not succeed, and the ledger job's result is then `failure` or `cancelled`: it cannot be `skipped`, and with `success` the matrix runs. `failure` is the only non-cancelled value the real job can hand the gate beside a skipped matrix.
    INVARIANT only-the-message-changes: for every input the gate step exits with the code it exits with today; the one change is which line a skipped matrix behind a cancelled ledger prints.
    NOT IN SCOPE: the sweep rung, its receipt and the re-run (W1-T11164); the coverage-ledger job's ceiling; any other arm of the step.
    AMENDED 2026-11-16 (operator session, second amendment). A builder sent to hand-build this task stopped at its measure step, correctly: the record contradicted itself. Its falsifier named the W1-T11161 suite as a guard that must still hold, `files:` did not list that suite, and that suite pins the opposite text for this task's own input.
    - READ test/ci/a-plan-only-diff-whose-coverage-matrix-was-skipped-passes-as-not-applicable.test.ts on origin/main: line 47 is `const PLAN_PR = { CLASS_EVENT: "pull_request", COVERAGE_CLASS: "PLAN_ONLY", COVERAGE_CLASS_COUNT: "1", LEDGER_RESULT: "cancelled" };`. The test "W1-T11161 criterion 2: any other skipped matrix still fails with the never-ran message" spreads it into nine of its ten cases, so they run the gate with the matrix skipped and the ledger cancelled on a diff that is not plan-only, and each asserts `/the shard matrix never ran \(matrix result: skipped\)/`.
    - MEASURED by the builder with origin/main's real step body under bash (~/Remudero-notes/handoff-1115/logs-13175/conflict-probe.log): at base all ten cases exit 1 with the pinned text. With step 1's branch applied, nine exit 1 with the token and without the pinned text, and the tenth (no evidence at all) is unchanged. The exit code is 1 everywhere, and the evidenced PLAN_ONLY case with a cancelled ledger still exits 0 with the not-applicable line.
    - DECIDED: step 4 above. The suite that pinned the old text for a cancelled ledger gets a ledger that failed, which is what "any other skipped matrix" meant, and the cancelled case is asserted where the token is.
    - THE LINE GAINS `::error::`. READ in ci.yml: the generic never-ran line is a plain `echo`, and the `SHARD HANG` line this one is modelled on is `echo "::error::coverage-ratchet: SHARD HANG — ..."`. READ in src/lib/tick-read-worker.ts: when a failing job's log is unreadable or names nothing, the sweep's tail falls back to the check run's failure annotations (`tailSource = "annotations"`; the type is `CiTailSource` in src/lib/sweep.ts), and only an `::error::` line becomes one. The existing grep proof for the token still matches a line that carries the prefix, so no proof text changed.
