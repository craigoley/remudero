    (1) THE DERIVATION IS EXACTLY AS DESCRIBED AND IS NOT AT ISSUE. `PROBE_TURN_ALLOWANCE = 3` at
    `containment.ts:514`, and `probeTurnBudget(prompt) = probeCommandCount(prompt) + 1 +
    PROBE_TURN_ALLOWANCE` at `:532-534`, wired at `:1009` as `maxTurns: probeTurnBudget(prompt)`.
    DRIVEN LIVE against the real `containmentProbePrompt`, the current numbers are
    `probeCommandCount = 6`, allowance 3, BUDGET 10. That derivation is W1-T2201's subject and this
    task keeps it.

    (2) THE ROW RECORDS THE OUTCOME AND NOT THE QUANTITY. `containment.probe` carries
    `turns_exhausted` as a BOOLEAN, set at `containment.ts:1218` from
    `evidence.turnsExhausted`, which is itself derived at `:1023` as `probe.subtype ===
    "error_max_turns"`. CENSUSED ACROSS ALL 391 `containment.probe` ROWS: the newest carries 33
    fields — including twelve per-arm observational booleans, `cost_usd` and `stderr_excerpt` — and
    ROWS CARRYING ANY TURN-COUNT FIELD (`num_turns`, `turns`, `max_turns`) NUMBER ZERO. CONTROL, on
    the same scan: `cost_usd` is present on 391 of 391, so the absence is an absence and not a
    failed read.

    (3) AND THE COUNT WAS AVAILABLE AND DISCARDED AT THAT EXACT SITE. `WorkerResult`
    (`worker.ts:87-131`) carries BOTH `numTurns` (the SDK's `num_turns`) and `maxTurns` (the cap the
    call was CONFIGURED with). The probe's extraction at `containment.ts:1023-1033` keeps
    `costUsd: probe.costUsd` and derives `turnsExhausted` from `probe.subtype` — AND KEEPS NEITHER
    `probe.numTurns` NOR `probe.maxTurns`. Nothing had to be plumbed; two fields already on the
    envelope were dropped one line away from the row that needed them.

    (4) Q1 — WHAT IS ACTUALLY COMPARABLE, AND THE ANSWER IS NOT `num_turns` ALONE. W1-T303's ground
    truth is recorded verbatim in `worker.ts:95-119`: `num_turns` is NOT guaranteed to count the
    same unit `maxTurns` bounds; measured over every `recon.done` row for 2026-08-03 under a single
    `maxTurns: 8`, ELEVEN `error_max_turns` failures every one landing at EXACTLY `num_turns: 9`
    (cap+1), and ONE CLEAN SUCCESS AT `num_turns: 17` — nearly double the cap, no error, no resume.
    The file's own conclusion: "`numTurns` alone cannot be reasoned about against a cap unless the
    cap it actually ran under rides the SAME row".

    (5) SO THE TWO PATHS DIFFER, AND THE ONE THIS TASK NEEDS IS THE UNUSABLE ONE. On the EXHAUSTION
    path `num_turns` is comparable — 11 of 11 landed at cap+1 — but it tells us nothing we did not
    already know from the subtype. On the SUCCESS path it is NOT comparable, and THAT is precisely
    the path whose distribution would say whether the allowance is tight. RECORDING `num_turns`
    ALONE WOULD THEREFORE NOT MAKE THE CAP TUNABLE. The pair `(numTurns, maxTurns)` on one row is
    the minimum honest record, and even then the success-path number must be read as a
    whole-session tally rather than as headroom.

    (6) WHAT IS COMPARABLE IS ALREADY ON THE ROW, IN THE RIGHT UNIT. The budget is derived from
    `probeCommandCount` — COMMANDS — and the probe already records per-arm completion in that same
    unit: `outside_write_attempted`, `os_denial_seen`, `inside_write_created`,
    `deny_floor_engaged`, `egress_blocked_reached`, `egress_allowed_reached`, `egress_denial_seen`,
    `token_read_succeeded`, `state_read_succeeded`, `token_read_denial_seen`,
    `operator_home_read_succeeded`, `operator_home_read_denial_seen`. HOW MANY ARMS REPORTED BEFORE
    EXHAUSTION IS A PROGRESS MEASURE IN THE SAME UNIT THE CAP IS BUILT FROM, and unlike `num_turns`
    it is comparable on BOTH paths.

    (7) THE RATE AND THE COST. OPERATOR-MEASURED: `turns_exhausted: true` reads 2 against 12 false —
    14% — up from 1 of 11 an hour earlier, and both exhausted runs retried and passed, so the cost
    is one lost dispatch slot per instance rather than a stall. RE-DERIVED HERE: of 391
    `containment.probe` rows only FOURTEEN carry `turns_exhausted` at all — the field is new, having
    arrived with W1-T2201 — and within those the split is 2 true / 12 false, the same 14%. The two
    are W1-T2220 at 2026-08-24T17:20:19.207Z and W1-T2222 at 19:16:29.251Z, MEAN COST $0.389
    (the attributed figure was ~$0.35). A 14% rate over fourteen observations is a wide interval and
    this shard does not treat it as a trend.

    (8) Q2 — WHAT THE FIELD IS FOR, STATED SO IT CANNOT BE MISREAD AS A REQUEST TO RAISE THE CAP.
    IT IS NOT TO RAISE THE ALLOWANCE. It is to make the next raise defensible. A distribution
    CLUSTERED AT THE CAP means the allowance is tight and a raise is evidence-backed. ONE MOSTLY
    WELL UNDER THE CAP WITH TWO OUTLIERS MEANS SOMETHING ELSE WENT WRONG IN THOSE RUNS, and raising
    the allowance would hide it — buying the outliers a pass while the real cause goes unnamed. The
    two readings call for opposite actions, and today NOTHING ON THE ROW DISTINGUISHES THEM.

    (9) THE HONEST LIMIT. This task cannot promise the distribution will be legible once recorded.
    Rationale (4)-(5) is the reason: if the success-path counter really is a whole-session tally
    across compaction, then even `(numTurns, maxTurns)` pairs may cluster meaninglessly, and the
    arm-completion count of (6) is what will carry the signal. WHICH OF THE TWO ACTUALLY
    DISCRIMINATES IS ITSELF A MEASUREMENT THIS TASK ENABLES AND DOES NOT PRE-JUDGE.
    ── ADDED 2026-08-24, RATIONALE ONLY, POST-MERGE OF #2750. THE RATE, AND WHAT IT IS NOT ─────

    (10) THE PROGRESSION IS THE OPERATOR'S AND IS ATTRIBUTED, BECAUSE THIS HOST'S CORPUS CANNOT SEE
    THE FIELD AT ALL. `turns_exhausted` is written on the `containment.probe` step
    (`src/lib/containment.ts` — `turns_exhausted: evidence.turnsExhausted`, itself set from
    `probe.subtype === "error_max_turns"`), and it arrived with W1-T2201, MERGED TODAY. Over the
    ledger union at the state dir (`archiveCount: 672`, `liveFileRead: true`, 1,280 matching rows):
    `containment.probe` reads 669 rows spanning 2026-07-14T16:41:21.392Z .. 2026-08-12T23:50:43.110Z
    and `isolation.probe` 611 rows to 2026-08-12T23:50:53.304Z — and **ZERO rows on either step carry
    `turns_exhausted`, because every one of them predates the field by twelve days.** THE ZERO IS
    CONTROLLED IN BOTH DIRECTIONS: 669 and 611 rows prove the STEPS read fine, and the live file
    carries zero `containment.probe` rows at all (control: the same grep on the same file, also
    zero) — the probe runs on the fleet host, not this one. So the readings below are RECORDED AS
    THE OPERATOR'S, not re-derived, and the newest row per step is stated so nobody mistakes this
    corpus for coverage of the window they were taken in.

    (11) AND THE RISE IS AN ARTEFACT OF THE ACCUMULATING DENOMINATOR, WHICH THE ARITHMETIC SETTLES
    OUTRIGHT. The four readings are 1/11 (9.1%), 2/14 (14.3%), 4/20 (20.0%), 5/23 (21.7%). They are
    NESTED — each denominator contains the last — so they are not four observations, they are one
    observation re-averaged three times. Differencing them gives the rate in each NEW window:
        1/11 -> 2/14 : 1/3 = 33.3%
        2/14 -> 4/20 : 2/6 = 33.3%
        4/20 -> 5/23 : 1/3 = 33.3%
    **EVERY INCREMENT IS EXACTLY ONE IN THREE.** The cumulative figure rises only because it started
    below that and is converging UP toward a constant. Nothing is getting worse. The first and last
    readings' 95% Wilson intervals — 9.1% [1.6%, 37.7%] and 21.7% [9.7%, 41.9%] — OVERLAP heavily, so
    even taken as independent samples the change is undetectable at this n.

    (12) BUT THE ARTEFACT RUNS IN THE DIRECTION THAT UNDERSTATES THE PROBLEM, AND THAT IS THE PART
    WORTH KEEPING. If every increment is one in three, the STEADY-STATE rate is ~33% (4/12 combined,
    95% Wilson [13.8%, 60.9%]) and 21.7% is a cumulative average still catching up to it. So the
    alarm is correct and its stated reason is not: the rate is not climbing, it has been about one
    probe in three since the field existed, and the headline number is the optimistic one. A sixth
    instance after the fourth reading is consistent with the same constant and is not further
    evidence of a trend.

    (13) THE COST SHAPE IS RECORDED BECAUSE IT BOUNDS THE ARGUMENT. Exhaustion is not a stall: every
    exhausted run retried on a later pass and proceeded — W1-T2223 exhausted, retried and merged for
    $3.42. The cost is one dispatch slot and about $0.389 per instance, paid before any work starts,
    which across the six observed instances is roughly $2.33. That is the number the "waiting has a
    cost" argument is actually made of, and it is small enough that it does not by itself force a
    raise.

    (14) SO THE DEADLOCK IS NOT ONE, AND THE TWO SEQUENCE CLEANLY. This shard's thesis — that
    `PROBE_TURN_ALLOWANCE` must not be raised without a recorded turn count — survives (11) and (12)
    intact, because neither says the allowance is right. They say the rate is FLAT AND HIGHER THAN
    ADVERTISED, which is an argument for measuring sooner, not for raising blind. Record the count
    first, raise on its evidence: rationale (8) already states why the same rate calls for OPPOSITE
    actions depending on the distribution — clustered at the cap means tight, mostly-well-under with
    outliers means something else went wrong and a raise would hide it. AND THE ARM-COUNT SIGNAL IS
    NOT A SHORTCUT PAST THAT. Design (6) says the count of arms that reported "is comparable on the
    success path where `num_turns` is not", and rationale (9) is explicit that WHICH of the two
    discriminates "is itself a measurement this task enables and does not pre-judge" — so acting on
    the arm count today would be acting on the signal this task exists to evaluate, before it has
    been evaluated. THE SEQUENCING IS THE ANSWER; THE SHORTCUT IS NOT.

    (15) AND NOTHING HERE MOVES A NUMBER. `PROBE_TURN_ALLOWANCE = 3` stands, the cap stays DERIVED as
    `probeCommandCount(prompt) + 1 + PROBE_TURN_ALLOWANCE` and never a literal — which is W1-T2201's
    whole subject — the probe still FAILS CLOSED on exhaustion, and `turns-exhausted` stays distinct
    from "the write may never have been attempted" (W1-T1281). This amendment records a rate and
    corrects its reading; it raises no bound and touches no acceptance criterion.

  design: |
    ONE CONCERN: an exhausted probe must record how far it got. Not the cap, not the derivation, not
    the failure behaviour.

    (i) RECORD THE PAIR, NEVER THE COUNT ALONE. `numTurns` without the cap it ran under is exactly
    the ambiguity W1-T303 diagnosed, and `worker.ts` already says so in as many words. Both fields
    are on `WorkerResult` at the probe's own extraction site, so this is a carry, not a plumbing
    change.

    (ii) AND RECORD ARM COMPLETION, BECAUSE IT IS THE ONE MEASURE IN THE CAP'S OWN UNIT. Rationale
    (6): the budget counts COMMANDS, the twelve per-arm booleans already report per command, and a
    count of arms that reported is comparable on the success path where `num_turns` is not. Adding
    it costs one reduction over fields the row already carries.

    (iii) OBSERVATIONAL, NOT A GATE — the same discipline the deny-floor, egress, token-read and
    re-anchoring arms already follow on this row, each recorded rather than gating precisely because
    its behaviour under the installed CLI is unmeasured. Nothing here changes a verdict.

    (iv) WHAT MUST NOT CHANGE, PINNED BY CRITERIA. THE CAP STAYS DERIVED — `commands + 1 +
    allowance`, never a literal, which is W1-T2201's whole subject and the reason a fifth command
    moves the cap by itself. THE PROBE STILL FAILS CLOSED ON EXHAUSTION. And `turns-exhausted`
    REMAINS DISTINCT from "the write may never have been attempted" — the two reasons name different
    states and collapsing them would undo W1-T1281's split.

    (v) NOT IN SCOPE, NAMED: the value of `PROBE_TURN_ALLOWANCE`, which this task deliberately does
    not move; the derivation itself; the retry behaviour that made both exhaustions recoverable; and
    W1-T303's compaction hypothesis, which that shard files as a follow-up and this one only cites.
