  rationale: |
    RE-DERIVED 2026-08-24 in a scratch worktree with `HEAD == origin/main` PROVEN BY SHA at
    b7a980e7; the clone was checked and already full. `resolveLedgerUnion` was pointed at the STATE
    DIR (`/home/craigoleyagent/rmd-state2/state`), never the checkout's: archiveCount 23, ok true,
    unread 0, with the control `"step":"risk_judge.decision"` reading 178. THE TIMINGS AND RATES
