  note: |
    verify: human IS SET UP FRONT. Design item (i) requires a JUDGEMENT that no test can make —
    whether leaving hand-REST and MCP-client PRs uncovered is acceptable or whether a server-side
    check is needed — and that judgement must be recorded before any edit.
    `isDispatchEligible` (src/lib/drain.ts) returns false at `t.verify !== "auto"` before the
    linter is consulted, so this shard can never be picked up by the drain.

    risk: high OVERRIDES AN EXPLICIT INSTRUCTION OF risk: medium, AND THE REASON IS MEASURED, NOT
    PREFERRED. Filed first at risk:medium exactly as instructed, `rmd lint-plan` returned ONE
    BLOCKING ROW against this record, verbatim:
      ✗ W1-T952: 1 violation(s)
          [sizing] spans 4 distinct subsystems/concerns (acceptance-block-diagnostics,
          plan-pr-emitter, review, run-task) at risk:medium — Rule 19: raise to risk:high or
          decompose into one task per concern
    `sizingViolation` (src/lib/task-linter.ts:193-204) exempts ONLY `task.risk === "high"` at :194
    and fires at `subsystems.size < 2` returning undefined — i.e. TWO concerns is the threshold,
    not four. So no `files:` list satisfying this shard's own scope can pass at risk:medium: the
    two modules it must name at minimum (the diagnostic and the emitter) are already two concerns.
    Raising the band is the remedy the gate itself names first and the one CLAUDE.md's standing
    rule prescribes. THE BAND IS RULE 19'S SPAN, NOT BLAST RADIUS — the blast radius really is
    medium: this adds a pre-open refusal and touches neither what the review decides nor when a
    verdict binds, both of which design item (vi) puts out of scope. An operator who wants
    risk:medium recorded must decompose this into one task per concern, which contradicts filing
    it as a single shard; that trade is the operator's to make and is flagged rather than buried.

