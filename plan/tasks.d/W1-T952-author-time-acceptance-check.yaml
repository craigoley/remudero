- id: W1-T952
  title: "A HAND-OPENED PR WITH NO ACCEPTANCE BLOCK FAILS REVIEW WITH EVERY CI CHECK GREEN — the diagnostic that would catch it exists and is reachable only from a manual verb no author is obliged to run, so the defect is discovered one full CI cycle and one wasted head after the body was written"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 55.00
  rationale: |
    FILED FROM the #2040/#2042/#2050/#2053 sequence. Branch cut at a34ceb8; every file:line and
    every invocation count below was re-read on this branch, and the cost figures are carried
    from that sequence rather than re-derived.

    (1) THE FAILURE PRESENTS AS THE WRONG THING. A PR body with no `## Acceptance` block and no
    `Remudero-Task:` trailer gives `reviewCommand` nothing to resolve criteria from, and it fails
    CLOSED — correctly. What the author sees is `remudero-review: FAIL` sitting beside a wall of
    green checks, so the failure reads as a diff problem when it is a body problem. Measured on
    #2042: 20 checks `success`, one `neutral`, two still running, ZERO failed, and the review
    refused with `no acceptance criteria to judge (fail closed)`.

    (2) THE COST IS A HEAD, NOT A MINUTE, AND THAT IS WHY IT IS WORTH GATING. A posted verdict is
    bound to its head sha and is never re-judged on the same one: the post-review row in
    `DISPOSITION_RULES` (src/lib/sweep.ts) fires at `reviewState` "none" or a stale pending, and
    `blockedStateFor` returns undefined once it is "failure". So repairing the body clears
    nothing — the fix is a NEW HEAD plus a full CI cycle. #2040 and #2042 each paid that. #2053,
    opened with the block already present, reviewed green on its first head.

    (3) THE EMITTER COVERS ONLY THE FLEET PATH. `renderAcceptanceBlock` (src/lib/plan-pr-emitter.ts,
    8 references in its own module and 12 in test/plan-pr-emitter.test.ts) is guaranteed to
    round-trip through the parser. Every PR opened around it — REST by hand, `gh pr create`, or an
    MCP client — carries hand-authored markdown that nothing checks before it is posted. That
    module's own doc at src/run-task.ts:8277-8282 already says so in terms.

    (4) THE MECHANISM EXISTS AND IS NOT UNROUTED — IT IS ROUTED TO THE WRONG PLACE, AND THE
    DISTINCTION MATTERS FOR THE FIX. `acceptanceBlockDiagnostics` (src/lib/review.ts:4568, 4
    references there) has EXACTLY ONE call site: `checkAcceptanceCommand` at src/run-task.ts:8299,
    the manual `rmd check-acceptance <body-file>` verb. That verb works and is not the defect. The
    defect is that it is OPT-IN — an author who does not already know the trap will not run it —
    and that NO PR-OPEN path calls it. A builder who reads "unrouted" and adds a first call site
    will have missed that the routing decision is about WHICH path, not whether one exists.

    (5) AND THE DIAGNOSIS, NOT THE DETECTION, WAS THE EXPENSIVE PART. `acceptanceBlockDiagnostics`
    already distinguishes absent header, dropped bullets, truncation and empty proofs
    (`AcceptanceBlockDiagnostics`, src/lib/review.ts:4527-4541). The review surfaces none of that
    — it reports only that criteria came to zero. Recovering the cause meant reading the parser.
  design: |
    THE SHAPE: move the existing check from opt-in to on-the-open-path, and make what it reports
    specific enough to act on. One determination first.

    (i) ENUMERATE THE AUTHORING PATHS BEFORE CHOOSING ANYTHING, AND STATE COVERAGE EXPLICITLY.
    Read from SOURCE every path by which a PR body is authored in this repo — at minimum
    `openPlanPr` (src/run-task.ts, 6 references), `ratifyPrCreateRestArgs`
    (src/lib/plan-pr-emitter.ts:368), `gh pr create` in src/lib/feedback-landing.ts:270, the POST
    at src/lib/feedback.ts:784, and the onboard opener in src/lib/onboard/synthesize.ts — then
    write down which the fix COVERS and which it CANNOT. This is the load-bearing item: an
    in-repo check cannot reach a PR opened by a human over REST, by `gh pr create` directly, or
    by an MCP client, because none of those execute repo code. The determination must state
    plainly whether leaving those uncovered is ACCEPTABLE, or whether a server-side check is
    required — and if acceptable, why. A fix that silently covers only the in-repo path and
    claims the defect closed is the failure this item exists to prevent.

    (ii) DELIVERABLE A — CALL IT AT AUTHOR TIME. On whichever paths (i) establishes as coverable,
    a block-less or unparseable body must be caught BEFORE the PR is opened, not after a CI cycle
    and a discarded head.

    (iii) DELIVERABLE B — NAME THE DEFECT, NOT THE FAILURE. The diagnostic must say WHICH of the
    four it is: no `## Acceptance` header, no `Remudero-Task:` trailer, proofs that do not parse,
    or proofs that are empty. Per rationale (5) the observed cost was diagnosis time, not
    detection time, so a generic refusal moves the cost rather than removing it.

    (iv) A REJECTION TEST ALONE PROVES NOTHING, AND THIS IS THE TRAP. An implementation that
    refuses EVERY body satisfies "a block-less body is rejected" perfectly. The positive control
    must run in the SAME suite invocation over a well-formed body and observe it ACCEPTED, so one
    run carries both directions.

    (v) AND THE MUTATION CHECK MUST BE FILE-SHA BRACKETED. A no-op mutation is indistinguishable
    from a surviving mutant from the result alone. Read the sha256 of the edited file, remove the
    diagnostics call, read the sha256 again and require it to DIFFER, run the suite and require
    the rejection test to FAIL, restore, and require the sha to return to the original.

    (vi) OUT OF SCOPE, ENUMERATED. Any change to `reviewCommand`'s fail-closed behaviour — it is
    CORRECT and this task depends on it staying that way; a body that resolves no criteria must
    keep failing. And any change to the sha-binding of posted verdicts. Neither is to be touched
    here, and neither is a reason to widen this task.
  acceptance:
    - claim: "every PR-authoring path is enumerated, with coverage stated for each"
      proof: "unit test: W1-T952: every PR-authoring path is enumerated with its coverage stated"
    - claim: "a body with no acceptance header is refused before the PR is opened"
      proof: "unit test: W1-T952: a body with no acceptance header is refused at author time"
    - claim: "a well-formed body is accepted, in the same run as the refusal above"
      proof: "unit test: W1-T952: a well-formed body is accepted in the same run"
    - claim: "removing the diagnostics call fails the refusal test, with the file sha read either side"
      proof: "unit test: W1-T952: removing the diagnostics call fails the refusal test"
    - claim: "the diagnostic names which of the four defects it found rather than failing generically"
      proof: "unit test: W1-T952: the diagnostic names the specific defect not a generic failure"
