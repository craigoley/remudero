- id: W1-T10738
  title: "A MANUAL APPROVE COUNTS AS AN ACTED ESCALATION — escalationClassPrecision counts only `panel.escalation_marked_handled` rows, so the `panel.manual_approved` check-off that IS the act for a MANUAL escalation is never a sample; on 2026-10-26 marking #14475-#14477 false_positive reported MANUAL precision 0, built only from false positives and blind to every real MANUAL resolution"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: { tdd: strict }
  budget_usd: 5.00
  risk: medium  # Rule 19: one concern, which ledger rows count as a MANUAL acted-on sample; tiers, NEVER_DEMOTE and every route are unchanged
  band_meaning: span
  priority: 3
