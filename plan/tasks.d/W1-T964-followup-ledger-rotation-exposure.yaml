- id: W1-T964
  title: "THE FOLLOW-UP HARVEST'S IDEMPOTENCY RESTS ON TWO LEDGER STEPS THAT ROTATE INDEPENDENTLY OF EACH OTHER — neither the source row nor its harvest mark is pinned, so whichever rotates first decides whether a declared follow-up is re-minted as a fresh candidate or lost outright, and the module's own doc asserts it must survive exactly that window"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 60.00
  rationale: |
    FILED FROM RECON at origin/main 478d7d0; branch cut at 55bf8c5. Every membership figure below
    was RE-DERIVED on the branch tree with the CORRECTED step names — see the note for why that
    correction matters.

    (1) THE HARVEST READS TWO STEPS TOGETHER AND NEITHER IS PINNED. `harvestFollowupsFromReport`
    writes ONE `report.followups` row per dispatched task carrying a `## Follow-ups` section
    (src/run-task.ts:4934). `mineFollowups` (src/lib/retro.ts:2139) reads every such row —
    filtering at :2154 on `r.step !== "report.followups"` — and skips any entry already named by a
    `followup.harvested`/`followup.deduped` mark, matched on `entryId` (`${runId}:${index}`).
    Those marks are written by `recordFollowupHarvest` (src/lib/retro.ts:2198) from
    src/run-task.ts:10736, with the step strings emitted at src/lib/retro.ts:2174 and :2177.

    (2) MEMBERSHIP, TESTED BOUNDED TO EACH SET BODY, WITH IN-SET CONTROLS. Against
    `DECISION_RELEVANT_LEDGER_STEPS` (src/lib/ledger.ts:377-499): `report.followups` 0,
    `followup.harvested` 0, `followup.deduped` 0, against controls `verdict` 1 and `run.start` 1.
    Against `RENDER_RELEVANT_LEDGER_STEPS` (src/lib/ledger.ts:551-651): all three 0, against a
    control `daemon.headroom` reading 1. And `isHealthOrDeployStep` (src/lib/ledger.ts:511)
    matches only `daemon.boot` or a `deploy.` prefix, which none of the three has. So all three
    fall to the DEFAULT cap, `MAX_RETAINED_LINES_PER_STEP = 200` newest per step
    (src/lib/ledger.ts:730), with everything older archived.

    (3) THE DEFECT IS THE INDEPENDENCE, NOT THE CAP. The cap is per-STEP, and the two steps have
    DIFFERENT VOLUMES: `report.followups` is written once per dispatched task that declares a
    section, while `followup.harvested`/`followup.deduped` are written once per ENTRY inside such
    a section, on a retro cadence rather than a dispatch cadence. Two independent counters against
    one shared cap means they cross the 200-row boundary at different times, in either order:
      - HARVEST MARK ROTATES FIRST, source row still live => `mineFollowups` no longer sees the
        skip marker and RE-MINTS the entry as a fresh candidate, so the Architect is shown work it
        already adjudicated.
      - SOURCE ROW ROTATES FIRST => the entry is unmineable and LOST, silently, with its mark left
        behind as an orphan.
    Neither direction errors, and neither is observable from the console.

    (4) THE MODULE'S OWN DOC ASSERTS THE PROPERTY THIS BREAKS. src/lib/retro.ts:2130-2134 states
    that a follow-up "must survive PAST the marker window (a discovery from three retros ago is
    still worth surfacing), so this module tracks it explicitly instead" of relying on
    marker-scoping. That explicit tracking IS the two ledger steps — so the mechanism chosen to
    outlive the marker window is itself unprotected against the rotation window, and the doc
    records the intent without anything enforcing it.

    (5) THIS IS A LIVE DEFECT IN SHIPPED CODE, INDEPENDENT OF ANY NEW FEATURE. It degrades the
    W1-T105 harvest that already runs on every retro today. It is filed on its own rather than as
    part of any research-agenda work precisely so it cannot be deferred behind a feature.
  design: |
    THE SHAPE: pin the three follow-up steps, but establish WHICH existing retention category is
    correct before touching anything, and land the fix with a measured before-figure.

    (i) DETERMINE THE CATEGORY FROM SOURCE — DO NOT ADD A FOURTH. Three categories already exist
    and each has an explicit doctrine: `DECISION_RELEVANT_LEDGER_STEPS` is retained FOREVER and
    src/lib/ledger.ts:527-531 warns in terms that a step added there "is retained FOREVER, not for
    as long as the console actually needs it"; `RENDER_RELEVANT_LEDGER_STEPS` is recency-bounded
    for console rendering; and `isHealthOrDeployStep` is window-bounded at
    `HEALTH_STEP_RETENTION_WINDOW_MS` (src/lib/ledger.ts:519). Read all three dockets and their
    doc blocks, then state IN THE PR which one the follow-up steps belong in and why the other two
    are wrong. A fourth category is the outcome to justify hardest, not the default: the W1-T275
    precedent recorded at src/lib/ledger.ts:524-531 is that widening the wrong set "would silently
    trade one failure for another".

    (ii) THE THREE STEPS MOVE TOGETHER OR NOT AT ALL. `report.followups`, `followup.harvested` and
    `followup.deduped` must land in the SAME category. Pinning the source row without its marks
    re-creates the re-mint direction of rationale (3); pinning the marks without the source row
    re-creates the loss direction. A fix covering two of the three is the defect with a smaller
    blast radius, not a fix.

    (iii) DELIVERABLE A — PIN THEM, SCOPED. After the change, a rotation that archives more than
    200 rows of each follow-up step must leave the harvest's idempotency intact: a re-mine yields
    the SAME candidate set it yielded before the rotation.

    (iv) DELIVERABLE B — REPORT THE LIVE EXPOSURE, SO THE FIX CARRIES A MEASURED BEFORE-FIGURE.
    Count `report.followups` against `followup.harvested` across the LEDGER UNION on the daemon
    host — both file forms, per CLAUDE.md's three-pattern idiom, or `rmd ledger-grep`, which
    `ledgerRotationEntries` (src/lib/ledger-grep.ts) makes the sanctioned in-process reader. The
    figure that matters is not either count alone but the count of `report.followups` entryIds
    with NO surviving mark, and the count of marks with NO surviving source row — the two
    directions of rationale (3), separately. A zero in either direction is only a result with a
    positive control proving the query could see its corpus. Report the numbers with the date and
    the host; do not carry them forward as a standing figure.

    (v) A MEMBERSHIP ASSERTION IS NOT AN ACCEPTANCE TEST, AND THIS IS THE TRAP. A test asserting
    the three steps appear in a retention list PASSES for a blanket "retain everything" change,
    which would fix this defect by deleting rotation and reinstating the unbounded growth the cap
    exists to prevent. Every criterion below is therefore PAIRED: the pinned behaviour and a
    CONTROL rotation on a NON-pinned step that still archives, both in the SAME run, so one
    invocation carries both directions and a blanket change fails the control half.

    (vi) AND THE MUTATION CHECK MUST BE FILE-SHA BRACKETED. A no-op mutation is indistinguishable
    from a surviving mutant from the result alone. Read the sha256 of the edited file, remove the
    pinning, read it again and require it to DIFFER, run the suite and require the idempotency
    test to FAIL, restore, and require the sha to return to the original.

    (vii) OUT OF SCOPE, TO BE FILED SEPARATELY, BOTH NAMED SO THEY CANNOT BE ABSORBED.
    FIRST, the INTRA-PASS DEDUP GAP: `mineFollowups` compares each entry only against
    `openTitles` (`followupMatchesTitle`, src/lib/retro.ts:2117, threshold at :2122), never
    against the other fresh candidates in the same pass, so two workers declaring the same
    follow-up in one cycle yield two candidates. That is a dedup defect, not a retention one, and
    fixing retention neither causes nor cures it.
    SECOND, the DUPLICATED FOLLOW-UP UNION: `FollowupEntry.type` at src/lib/worker.ts:1607 and
    `FollowupCandidate.type` at src/lib/retro.ts:2081 declare the same three kinds
    independently, with a third re-validation at src/lib/retro.ts:2159, and nothing ties them
    together. Adding a kind means editing all three. That is a drift hazard in the type system,
    orthogonal to rotation.
