- id: W1-T10384
  title: "A SONNET RUN STOPPED BY THE FOUNDRY CLAUDE CAP CONTINUES ON THE LUNA LADDER, AND THE REFUSAL NAMES THE CAP THAT BOUND — on 2026-10-22 ten squeezed cash runs (nine review.reviewer, one triage) ended `cash_allowance_exhausted` at \"would exceed the $10.00 dailyCapUsd\" while the configured squeezed cap was $25; the $10 is `FOUNDRY_CLAUDE_DAILY_CAP_USD.squeezed`, the Foundry-Claude sub-cap, and W1-T4785's Luna fallback re-enters only for a refusal before any money moved, so a run that billed one request and was refused on the next ended the review instead of moving to Luna"
  repo: remudero
  depends_on: []
  type: implement
