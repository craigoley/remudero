  risk: high  # Rule 19: worker.ts routes, worker-provider.ts names the cap; one concern, no cap value changes
  band_meaning: span
  origin: "operator ruling 2026-10-22, item 5 (mount-affinity cash work charged against the normal cap while both subscriptions are exhausted); premise corrected by the evidence below"
  plan_refs: [W1-T4785, W1-T3692, W1-T10040, W1-T10385, W1-T5451]
  files:
    - src/lib/worker.ts
