    - claim: "a failure that is not a ref lock is not retried"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
    - claim: "retries are bounded and never lengthen a boot without limit"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
    - claim: "an exhausted retry still starts the daemon rather than refusing the boot"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
    - claim: "an exhausted retry is reported as a named stale boot, not one log line"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
    - claim: "a successful first fetch makes no additional call"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
    - claim: "removing the retry restores the single-attempt behaviour and fails the lock case"
      proof: "unit test: test/the-boot-fetch-survives-a-transient-ref-lock.test.ts"
