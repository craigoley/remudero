    claim reports as delivered for this exact input counts as the completed exact-input attempt for
    `reviewStatusSupersedesLedgerAttempt` and for the arm's ledger gate, so the next pass arms,
    merges directly or updates a behind plan PR instead of re-disposing post-review. A post-review
    disposition stood down as delivered on consecutive passes at one head logs the stand-down once
    per head, not every pass.
