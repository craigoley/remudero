  rationale: |
    OBSERVED at merged main 8549501c, unchanged PR 8655 head e2228482: two real-boundary tests fail.
    During effectReading, creating a directory at the previously absent overseer state path causes
    its final atomic commit to fail. The effects file and effect_verdict success row already exist.
    Separately, foldGardenEffects folds 201 novel sequenced credits to alpha 204; replaying the
    first sequence after the bounded 200-ID cache turns alpha into 205. foldedEffectThrough is
    written but never consulted. Formal changes-requested review 5392913278 and post-merge comment
