    its producer-only 201-case test did not exercise this consumer replay boundary.
  design: |
    Persist the complete producer outbox and pending verdict identities before publishing effects
    or success-shaped effect/churn/scorecard telemetry. Persistence failure may log its failure,
    but must not claim successful delivery. A later healthy pass replays the same committed IDs.
    Validate existing effects/receipt/state before modifying evidence; preserve corrupt-state
    refusal, legitimate first boot, per-class outcome math, pending outcomes and every unacknowledged
    verdict. Reconcile delivery, acknowledgement, pruning and telemetry as separate durable steps.
    Make the consumer's durable watermark load-bearing in addition to its recent-ID cache. State
    what the watermark covers and enforce producer ordering/bounded-prefix semantics so out-of-order,
    duplicate, unknown-class or legacy effects cannot advance it past an unconsumed verdict. Preserve
    legacy idempotence explicitly; unavailable receipt history is not a measured empty population.
    Add real filesystem failure/restart tests, direct fold tests beyond 200 IDs, acknowledgement and
    failed-prune recovery, and a positive control that every novel verdict still applies exactly once.
    No blanket authority, automatic human decision, threshold weakening, model-routing change or
    worker/service recycle. Reconcile the concurrent CI-friction remedy PR 8657's new metrics and
    reason receipts; do not overwrite its independent work or push another owner's branch.
  acceptance:
