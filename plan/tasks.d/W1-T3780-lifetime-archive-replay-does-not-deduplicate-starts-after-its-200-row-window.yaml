  attempts: 0
  rationale: |
    OBSERVED on the fleet host at origin/main `5af79224b69066af509c12580c123d38601481d1`,
    2026-09-19. `auditedLifetimeTalliesFromArchives("/home/node/Remudero/state")` reports
    W1-T3722 as `{starts:40, capacityBlocked:10}` and therefore still capped. The required
    control was the archive callback itself: it found exactly ten distinct `run_id` values for
    W1-T3722, but each identical `run.start` raw line was accepted three times from rotations;
    the paired `daemon.spawn_infra_blocked` receipts were accepted once. All ten starts and all
    ten capacity receipts are from the 2026-09-18 squeeze window. The intended effective count
    is zero; the shipped projection derives thirty.

    The source explains the mismatch. `src/run-task.ts:26322` uses a raw-line Set capped to
    `MAX_RETAINED_LINES_PER_STEP` (200) for every step. A repeated start arriving after more
    than 200 other `run.start` rows has been evicted, so it is counted again. `run.start` has a
    durable semantic identity already: `(task_id, run_id)`. A daemon capacity receipt has a
    different schema and is not the duplicate observed here. This is not W1-T3523's task-owned
    orphan case: every observed duplicate belongs to a run that the daemon itself subsequently
    recorded as `daemon.spawn_infra_blocked` before a worker received a turn.

    W1-T3758's focused fixture proves one archive and a rolling 201-row distinct corpus. It
    does not reproduce an identical start replayed across rotations after the raw 200-row window
    advances, so its success is not evidence for this case.

    The repair is deliberately narrow. Replace the archive projection's raw replay identity for
    `run.start` with its durable `(task_id, run_id)` identity. It must use an explicit,
    documented identity ceiling derived from the archive projection's measured cardinality; if
    that ceiling binds or a historical start lacks either identity component, make the archive
    history unavailable and retain the existing live-only decision rather than silently clear a
    lifetime cap. Preserve raw bounded replay for rows that lack a durable identity and preserve
    every W1-T3758 unread-archive refusal. Do not weaken the cap, delete ledger evidence, infer
    a capacity block from a missing terminal row, or exempt a task-owned worker exit.

    This must repair the currently blocked population retrospectively: the projection reads
    immutable history, so the W1-T3722 control must return ten starts, ten capacity receipts,
    and an effective count of zero without changing the ledger.
