  title: "THE CAPACITY-OUTAGE RECOVERY RECOUNTS THE SAME run.start AFTER ITS 200-ROW REPLAY WINDOW — W1-T3758's archive projection records one capacity refusal but three copies of each start, so the attempted repair leaves squeeze victims lifetime-capped"
