  rationale: |
    Operator ruling 2026-11-04: "Use the plan-only set (Recommended)". A plan-only retro diff runs the author lane's plan-only selection, about 34 suites, locally, and hosted CI keeps the full set as the gate.
    OBSERVED 2026-11-04:
    - RETRO-1793795675454's two prepublish attempts each ran 272 suites at --test-concurrency=1, niced, for a PLAN_ONLY diff of 2 paths. retro.preflight_failed rows show suite_selection changed-paths, "diff class PLAN_ONLY", changed_path_count 2, broad_suite_count 778.
    - Attempt 1 ran 4,746,239 ms and failed tests_failed at 14:18:30Z. Attempt 2 ran 4,025,267 ms and failed process_timeout at 15:29:31Z. The failing tests were load-sensitive.
    - Each attempt held the shared host test slot and counted as a busy worker in deploy/recycle-container.sh's drain. Recycle #2 (13:04Z) refused after 3,000 s, recycle #3 (14:36Z deploy tick, derived wait 2,234 s) refused, and the fleet stayed paused behind them.
    - On origin/main 8b080aa8c, scripts/diff-class.mjs for a 2-shard plan-only change list prints 639 suites under --list-plan-reading-suites --changed-files and 34 under --list-plan-only-suites --changed-files. The second is planOnlySuiteFiles: suites that read a changed shard plus the plan-integrity suites. That is the selection the author lane uses (W1-T7809, src/lib/affected-suites.ts).
    - Hosted CI's plan-reading lane runs on the retro's PR regardless, so the full set still gates the merge.
  design: |
    In enumerateSuites (src/lib/retro-preflight.ts), when changedPathScope returns mode changed-paths for diff class PLAN_ONLY:
    - Run [--import, tsx, scripts/diff-class.mjs, --list-plan-only-suites, --changed-files <list>] instead of --list-plan-reading-suites. Keep the list file's lifetime and cleanup as today.
    - Record selection { mode: "plan-only", reason: "diff class PLAN_ONLY (author plan-only selection)", changedPathCount, broadSuiteCount }, where broadSuiteCount is the plan-reading count the old path would have run (one extra listing call, or the previous_count it prints).
    - Widen SuiteSelection.mode with "plan-only".
    - The existing preflight row keeps suite_selection, suite_selection_reason and suite_count, so the saving shows per retro.
    - Keep the freshness-exemption fixture within this task's accepted regression scope: install a stable test-local unhandled-rejection guard before mocked main calls, record escaped reasons, and fail file teardown if any escaped; do not suppress the runner failure or loosen the production guard.
    - If the plan-only listing fails or prints zero lines, fall back to today's --list-plan-reading-suites call with the same list, naming the fallback in the reason. Never run zero suites.
    - DOCS_ONLY and SOURCE diffs keep today's path.
    NOT IN SCOPE: DOCS_ONLY narrowing (the ruling covers plan-only diffs); hosted CI's plan-reading lane; the silence bound (W1-T2803); the slot heartbeat and start row, which are sibling tasks.
