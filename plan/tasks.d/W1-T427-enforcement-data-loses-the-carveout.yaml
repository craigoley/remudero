    deliverable (a category nothing polices is a comment). Rule 25: src/lib/review.ts IS
    instrument surface — this diff is a deliberate instrument change and must be filed alone,
    never entangled with unrelated src/, which its two-file files: enforces by construction.
    FILED ASSUMED, NOT MEASURED: no blunting incident exists; the shard says so plainly because
    implying an incident would be manufacturing evidence, and the reason to close it NOW is that
    an incident in this gap is self-concealing — the first one would not announce itself.
