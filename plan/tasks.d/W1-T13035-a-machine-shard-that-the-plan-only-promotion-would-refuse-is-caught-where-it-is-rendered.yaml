  rationale: |
    FOUND 2026-11-15 by the operator session while finishing W1-T12833, on origin/main 455ed55d92 and on the W1-T12833 branch (both give the same answer).

    - A plan-only filing promotes six lint warnings to blocks when its shard is new (`promoteIntroducedPlanOnlyDiagnostics`, W1-T3814, in src/lib/task-linter.ts: shared-proof, call-site, proof-scope, shard-shape, proof-grep-already-true, proof-test-only-discrimination).
    - Two machine templates render a record that carries one of those warnings every time, so every plan pull request they open is refused at the preflight:
      - selector-shadow miss (`selectorShadowMissTask`): its two acceptance claims share one proof, so `shared-proof`.
      - CI-learning draft (`ciLearningShardYaml`): its second proof greps the golden fixture path, which is not in the record's `files:`, so `proof-scope`.
    - Rendered from the census fixtures and passed through `lintTask` and then the promotion, the output is `selector-shadow miss#0: raw [warn:shared-proof] | promoted [shared-proof]` and `CI-learning draft#0: raw [warn:proof-scope] | promoted [proof-scope]`. Every other pure template promotes nothing.
    - W1-T12833 adds one shared lint for machine shards (`machineShardLintRefusal`) and a census that walks every template. That lint uses the changed-task option and does not apply the promotion, so the census cannot see this class.
    - Ledger side, from the 2026-11-15 audit of the self-improvement loop: 15 selector-shadow and 7 redesign filings were refused on `shared-proof` before the invariant lint landed.
  design: |
    1. `machineShardLintRefusal` applies `promoteIntroducedPlanOnlyDiagnostics(violations, undefined, true)` for the checks that need no checkout (shared-proof, proof-scope, shard-shape), and names the promoted check in its refusal.
    2. selector-shadow miss: the second claim gets its own proof (a second named test, or a `grep:` on the regression's `test(` line).
    3. CI-learning draft: the golden fixture path joins `files:`, or the second proof reads the lessons file the record already declares.
    4. The W1-T12833 census walks every template through the lint of step 1.
    INVARIANT every-machine-template-is-walked: no machine template is rendered for filing without passing the shared lint with the plan-only promotion applied, and the census names any template that would not.
    NOT IN SCOPE: the three promoted checks that need base files (call-site, proof-grep-already-true, proof-test-only-discrimination); the design-invariant declaration (W1-T12833); which warnings the promotion covers.
  falsifier: |
    Drop the promotion from the shared lint and criterion 1 must fail. Give the selector-shadow claims one proof again and criterion 2 must fail. Point the CI-learning proof back at the undeclared fixture and criterion 3 must fail. Leave a template out of the census walk and criterion 4 must fail. Restore and all pass.
  note: |
