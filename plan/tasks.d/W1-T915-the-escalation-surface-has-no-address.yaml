    implementation never edits fails `inverseScopeUntouchedFiles`.
    EVERY BEHAVIOURAL CLAIM WAS RE-DERIVED AGAINST THE TREE RATHER THAN TAKEN FROM THE BRIEF, because
    a prior instruction in this series named eight symbols that do not exist and two sessions
    correctly stopped. Controls used throughout: `renderNeedsMe` read 6 in serve.ts and `isBlockedCi`
