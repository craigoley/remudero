  note: "risk:high IS RULE 19'S SPAN, NOT BLAST RADIUS, and the band is set UP FRONT rather than
    shipped as a violation and raised later. subsystemsOf counts three concerns here — retro,
    run-task and the suite — and none of them is discounted, so risk:medium would fail sizing on the
    first lint. The blast radius is genuinely low: the rung reports, writes nothing, dispatches
    nothing and cannot alter a verdict. Splitting the pure half from its own wiring is not a real
    decomposition, so the band is the honest answer rather than a further split.
    DEPENDENCY DIRECTION: NONE, established rather than assumed. This task reads MASTER-PLAN.md
    against GitHub merge state; W1-T409 reads MASTER-PLAN.md against ITSELF. Neither consumes the
    other's output, so both carry depends_on: [] and either may ship first. The one shared piece is
    the small phrase extractor for the not-shipped vocabulary, and the obligation on whichever ships
    SECOND is to reuse the first's exported extractor rather than duplicate it — a reuse obligation,
    not an ordering constraint. THIS IS THE HALF THAT CLOSES THE GAP; if only one ever ships, it
    should be this one.
    budget_usd 70, unchanged from W1-T392, because this half inherited the retro wiring, the
    resolver seam and both controls. The pair now totals 115 against the original 70: that is not
    inflation, it is the original figure having been sized for a single dispatch which W1-T392's own
    design note predicted would ship the cheap clause and stop.
    verify:auto — every criterion is decidable in-process against a fixture plan file and an INJECTED
    merge resolver. No network, nothing spawned; the real GitHub read belongs to the caller.
    THE MEASUREMENTS ARE RE-DERIVED AT 0503802 AND WILL DRIFT — the 23 phrase-bearing lines, the
    three-with-a-task-id split, the six ids and the five false positives are all counts over a file
    that is edited every retro. They are recorded as the SHAPE of the problem, not as a target. Do
    not freeze any of them into a criterion; the acceptance above deliberately locks behaviours
    instead, and W1-T392's own frozen 282-against-93 had already moved to 332-against-109 by the time
    this split was written.
    files: declares src/run-task.ts because the wiring lives there and a path a worker writes must be
    declared; it declares the suite because a proof naming a path outside files: is a proof-scope
    warning at filing and a scope-guard REFUSAL after the work is done."
