    ambiguity/alias/syntax and budget refusal controls must still execute and pass. Restore the fix
    byte-for-byte and require passing physical-suite TAP summaries on the same candidate.
    A setup/import failure, ghost path, wrapper-only match, absent summary, capacity refusal,
    injected counterfactual or static report cannot qualify the production repair.

