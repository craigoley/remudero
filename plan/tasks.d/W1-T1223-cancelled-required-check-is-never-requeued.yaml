- id: W1-T1223
  title: "A CANCELLED REQUIRED CHECK IS INDISTINGUISHABLE FROM A FAILURE AND NOTHING RE-QUEUES IT — `REQUIRED_CHECK_FAIL` contains `CANCELLED`, so `checksStateFromRollup` returns `red` for an ABSENT verdict exactly as for a bad one, and the sweep has no re-queue action at all; measured 2026-08-22 on #2434 and #2444, where `coverage-ratchet` alone was cancelled while every sibling was success and a human re-queued it 47 minutes and 5h40m later"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 90.00
  files: [src/lib/sweep.ts, src/run-task.ts, test/cancelled-required-check-requeue.test.ts]
