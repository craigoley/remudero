  rationale: |
    RE-VERIFIED 2026-10-26 on origin/main 5e401e616 and remudero-console origin/main 5c12bf2. Ledger reads were
    read-only, niced and bounded on the host: the console instance's
    /mnt/rmd/remudero-console-state/state/ledger.ndjson.

    THE INCIDENT. CONSOLE-T127; the operator released its breaker at 17:50:32Z (dispatch.breaker_released).
    - Run -1793037108107 (17:51:52Z to 18:17:19Z):
