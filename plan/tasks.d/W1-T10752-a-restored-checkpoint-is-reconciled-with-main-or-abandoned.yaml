    - The checkpoint f537386 is a single harness commit "chore(checkpoint): yield at daemon restart" from
      2026-10-14T23:42Z on merge base 415faa0. Console main is 114 commits past it.
    - THE INSTALL WAS MAIN'S, MEASURED. sha256(package.json \0 package-lock.json), the `hashInstallInputs`
      formula, is 270a4361… at console 2200b28, 7202ea4 and 5c12bf2 (all vitest 5.0.5). At f537386 it is
      c1a59260… (vitest 5.0.3). Both runs reused the main-keyed tree, then reset the checkout onto f537386's
      lockfile.
    - THE CHECKPOINT IS NOT SUPERSEDED. Its proof test ("CONSOLE-T127: needs-you without a filter redirects to now
      with its repository scope") exists only at f537386 (tests/unit/needs-you-reads-status-once.test.tsx and
      now-is-the-one-needs-you-list.test.tsx). No file on console main carries it. f537386 does not touch
      package-lock.json, so a merge with main would have carried main's 5.0.5 pin.

    THE DEFECTS (core, origin/main 5e401e616).
    1. A CONFLICTING MAIN LEAVES THE RUN ON THE STALE BASE.
       - run-task-verb.ts `restoreBoundaryCheckpoint` (:1827): when `probeMerge` is not clean, it runs
         `git reset --hard <checkpoint>` (:1880) and returns base "checkpoint" with the conflicted paths. Its doc in
         src/run-task.ts says the conflict "reaches the PR, whose merge-conflict repair rounds resolve it". But a
         stale base can fail before any PR exists, as here.
       - The worker is never told. `mainConflicts` is read only by the ledger row (:5910). No prompt line names
         the conflict or the base, so the -1793040579425 worker ended with head_moved false.
       - Two tests pin the stale-base behaviour: test/a-live-handoff-receipt-keeps-its-run-branch.test.ts
         `W1-T8503: a recreated checkpoint keeps its own base when main conflicts`, and
         test/a-dispatch-phase-is-not-held-by-its-slowest-lane.test.ts `a restored checkpoint main conflicts with
         resumes on its own base instead of ending the run`.
    2. THE INSTALL IS KEYED BEFORE THE RESTORE.
       - `worktreeAddAsync(... "origin/main" ...)` (:5807) provisions node_modules through `provisionDependencyTree`
         (worker.ts:5100), keyed by `hashInstallInputs(worktreePath)` while the tree is still main.
       - The restore (:5904) then moves HEAD with `reset --hard`. Nothing re-keys or re-links the install.
       - proof-cache.ts:26 refuses the mismatch as exec_error. W1-T10742 (open, #14506) stops counting such an
         exec_error as a strike, but the run still cannot prove anything on that checkout.
    3. NOTHING ABANDONS A SUPERSEDED CHECKPOINT. The restore drops a checkpoint only when its object is gone from
       origin (:1844-1853) or main already contains its head (:1864). A checkpoint whose changes main already
       carries in other commits (a squash merge, a sibling task) is merged or reset onto as if it were live work.
    4. A RETURNED FAILED VERDICT CONSUMES THE RECEIPT SILENTLY.
       - The pr_open.refused arm (:7243-7266) says "branch … kept on origin" but writes no implement.checkpoint_kept.
       - Its `verdict` row deletes the pending receipt (daemon.ts `pendingWorkerBoundaryHandoffs`). Replayed over
         CONSOLE-T127's rows, the receipt is pending before 19:04:07.300Z and gone after.
       - So the pushed ref run-CONSOLE-T127-1793040579425 blocks dispatch as run-branch-already-pushed until its
         24 h orphan grace (drain.ts:150) ends at 2026-10-27T18:49:39Z. The next run then builds from main and
         drops f537386, which nothing ledgers as abandoned.
       - W1-T9815 (queued) covers the thrown exits and `failOnWorkerError`. W1-T10749 (queued) covers the
         push-auth throw. Neither covers the returned-verdict exits.

    NOT COVERED ELSEWHERE. Swept plan/tasks.d for restoreBoundaryCheckpoint, checkpoint_restored, restored
    checkpoint and checkpoint plus lockfile. Read the 20 open PRs' titles and the run-W1-T9815-*, -T8535-*,
    -T10749-* and -T10742-* refs (none exist). The neighbours:
    - W1-T8535 (queued) resolves a receipt whose branch head MOVED.
    - W1-T9482 (queued) releases a SPENT checkpoint branch on a requeue.
    - W1-T9815 and W1-T10749 keep the newest head on thrown exits.
    - W1-T10742 classes an inconclusive proof.
    None reconciles a conflicting checkpoint with main, re-keys the install after a restore, or abandons a
    superseded checkpoint.
    NOT IN SCOPE, reported separately: there is no sanctioned operator command that drops a pending checkpoint
    receipt. `implement.checkpoint_dropped` has one writer, the restore itself.
  design: |
    MEASURE FIRST, read-only, and put the findings in the PR body:
    - Replay design 1-2's classifier against console's f537386 and current console main. Expected: not superseded,
      conflict on lib/core-views.ts, so reconcile. Say if it is not.
    - Count implement.checkpoint_restored rows with base "checkpoint" in the core and console ledger union since
      2026-10-01. For each, record whether the run reached a PR, and whether the restored lockfile hash differed
      from the deps hash.
    No number from this changes the design. It is the effect baseline.

    1. A CONFLICTING CHECKPOINT IS MERGED WITH MAIN, AND THE WORKER RESOLVES IT.
       - When `probeMerge` reports a conflict or an unreadable merge, the restore checks out the checkpoint and
         runs a real `git merge --no-ff --no-commit <main>`. The conflict markers stay in the worktree and
         MERGE_HEAD is set. The checkpoint stays the first parent, so its shas are kept, as today.
       - The restore returns base "main" with `mainConflicts` naming the conflicted paths. The ledger row keeps
         `main_conflicts`, adds `reconciled: "merge"`, and never again writes base "checkpoint".
       - The implement prompt gains one line naming the merged main sha and every conflicted path. It says that
         resolving them is part of this task.
       - The harness commit (and a worker commit) completes the merge with both parents.
       - The pre-open gate refuses a tree that still has unmerged index entries or conflict markers in a named
         path. That refusal is an ordinary pre-open repair round, not a new verdict.
       - Lockfile or toolchain drift is reconciled the same way. If the merge leaves package.json or
         package-lock.json conflicted, the worker resolves them. Design 3 then provisions whatever lockfile the
         resolved tree carries.
    2. A SUPERSEDED CHECKPOINT IS ABANDONED WITH A LEDGERED REASON, BY EVIDENCE.
       Before any merge, the restore abandons the checkpoint and the run starts from main when either:
       - the checkpoint's own diff (merge-base to head) adds nothing main lacks: merge-tree's result tree equals
         main's tree, or every changed path's checkpoint blob already equals main's blob;
       - or main already carries this task's merge credit (`Remudero-Task: <id>` on a main commit dated after the
         checkpoint's head).
       - It writes `implement.checkpoint_dropped` {task_id, source_branch, head_sha, reason: "superseded",
         evidence: "tree-equal" | "blobs-equal" | "task-credited", main_sha}. That row is the one the receipt
         fold and the retained set already read, so rotation cannot revive it.
       - There is no age or commit-count gate. A conflicted checkpoint that is not provably superseded is
         reconciled (design 1), never abandoned.
    3. THE INSTALL ALWAYS MATCHES THE CHECKOUT'S OWN LOCKFILE.
       - Export from worker.ts one entry that re-reads `hashInstallInputs(worktreePath)` and relinks (or
         provisions) node_modules for that hash, using the same `provisionDependencyTree` path and lock.
       - Call it after the restore whenever HEAD moved, and again before the pre-open gate and the PR-open
         proofs whenever package.json or package-lock.json differ from the tree they were last provisioned for.
       - Ledger `deps.reprovisioned` {from_hash, to_hash, reason}.
       - A provisioning failure falls back exactly as `failDeps` does today and is ledgered. It never silently
         leaves the old link in place.
    4. A FAILED RUN THAT BUILT A NEWER HEAD KEEPS THE NEWER HEAD.
       - The returned failed-verdict exits after a restore (pr_open.refused and any other returned `failed`)
         write `implement.checkpoint_kept` right after their verdict.
       - The kept head is this run's own pushed tip when it is on origin and differs from the restored head.
         Otherwise it is the restored checkpoint. Read it while the worktree stands.
       - Use W1-T9815's keep helper if it has landed, or introduce that one helper here for W1-T9815 to reuse.
         Do not write a second predicate.
       - W1-T10749 owns the push-auth throw (an unpushed head). Leave that arm to it.
       - A run that opened a PR keeps nothing, and `blocked_budget` keeps nothing, as today.
       - The next run restores the kept head under designs 1-3, so a kept stale head is reconciled or
         abandoned, not rebuilt on its old base.
    Nothing else. No breaker bound, receipt fold, proof verdict, push path or orphan grace changes.
