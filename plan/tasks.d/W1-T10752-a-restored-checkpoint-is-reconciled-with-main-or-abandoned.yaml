    - Run -1793040579425 (18:49:43Z to 19:04:07Z):
      - worktree.add on console main 7202ea4, deps.reused the same hash 270a4361…, then the same
        checkpoint_restored row: base "checkpoint", main_conflicts [lib/core-views.ts].
