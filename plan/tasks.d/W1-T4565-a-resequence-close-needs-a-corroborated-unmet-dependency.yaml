- id: W1-T4565
  title: "THE SWEEP CLOSES A PR FOR AN UNMET DEPENDENCY THAT MERGED MINUTES EARLIER — the W1-T3585 resequence close reads only the daemon's lastProj, which lags a real merge by 13-28 minutes, and ignores the projection's own indeterminate flag; two builds were silently lost and a third PR was closed"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 25.00
