  rationale: >-
    From the 2026-10-26 proposal on verify-human-automate:W1-T9930, ratified via rmd approve:
  
    From the verify-human-automate:W1-T9930 proposal (judge decision: automate; observed_state
    W1-T9930:adaptive-lifetime=2:capacity=0:open=0:merged=0:last=verdict:blocked_inflight:2),
    ratified via rmd approve:
  
  
    The judge's own evidence string reads "attributable dispatches=2; capacity refusals=0; open PR
    evidence=0; merge evidence=0; last terminal verdict=blocked_inflight; attributable
    terminal-verdict history=none" -- every one of W1-T9930's recorded "verdict" rows is
    blocked_inflight, which streakRefusal (src/lib/non-worker-verdict.ts:50-52, via
    lifetimeInfrastructureRefusal and the LIFETIME_ONLY_REFUSAL_VERDICTS set at line 18-20) is
    built to EXCLUDE from being "attributable". taskAttributableLifetimeDispatches
    (src/lib/status.ts:1820-1844) builds exactly that exclusion set from the task's own "verdict"
    rows and subtracts their run_ids from its "starts" tally -- so a task whose entire terminal
    history is blocked_inflight should read attributableDispatches=0, not 2.
    routeAdaptiveLifetimePressure (src/run-task.ts:43097-43174) only skips a shard as "infra_only"
    when attributableDispatches === 0 (line 43124); W1-T9930 cleared that bar and was judged on a
    count its own "attributable terminal-verdict history=none" line cannot reconcile.
  
  
    run.start (run-task-verb.ts:5211) is logged AFTER the per-task inflight-lock acquisition
    (run-task-verb.ts:4850-4859, acquireInflightLock/InflightLockError); a dispatch REFUSED at
    that lock never logs its own run.start at all. So the 2 counted run.start rows and the 2
    blocked_inflight verdict rows may be disjoint: two earlier runs could have started, never
    reached a terminal "verdict" row (so excluded from neither the orphan set nor the
    infrastructure set, and counted as plain "starts"), and left their per-task inflight locks
    unreleased -- which is exactly what the later 2 attempts would then be refused against. This
    recon is read-only: pair the run_ids, and if they are disjoint, say why the stuck run(s) were
    never reclaimed as stale.
