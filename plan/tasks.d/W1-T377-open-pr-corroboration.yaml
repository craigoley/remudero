    - claim: "the rung is strictly below every merged rung and below the ledger's own association, and a foreign or closed branch never credits"
      proof: "unit test: test/open-pr-corroboration.test.ts"
    - claim: "the open slice costs zero extra fetches on the batched gateway, and a failed read returns null rather than an empty list"
      proof: "unit test: test/open-pr-corroboration.test.ts"
