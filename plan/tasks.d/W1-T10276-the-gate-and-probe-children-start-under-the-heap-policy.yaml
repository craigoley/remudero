  title: "THE PRE-OPEN GATE'S `preflight --fast` CHILD AND THE SHADOW-PROBE CHILD START UNDER THE DAEMON'S HEAP GROWTH PERCENT — PR #13138 puts `childHeapPolicyArgs()` on the run child's and the automated retro child's command lines only, so these two node children still grow at V8's default factor; and 65 of 69 pre-open gates are spawned from INSIDE a run child, where `childHeapPolicyArgs()` returns [] because only the daemon applies the policy"
  repo: remudero
