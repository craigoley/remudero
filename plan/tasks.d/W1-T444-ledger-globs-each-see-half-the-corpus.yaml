  note: "verify:auto — no operator ruling is needed. Which files exist is measured, and that both
    verbs should read all of them is not a policy question.
    risk:high is Rule 19's SPAN, not blast radius: `subsystemsOf` reads `files:` plus acceptance text
    and this set crosses `src/lib`, `src/` and `test/`. Raised up front — the W1-T400/W1-T407 lesson,
    and the W1-T442/W1-T443 lesson that a `files:` omitting the suite which already asserts the old
    behaviour costs a dispatch.
    `test/ledger-grep.test.ts` IS DECLARED AND THE REASON IS MEASURED: it already builds fixtures
    around the `.gz`-only filter, including one that writes `not gzip data` into a `.ndjson.gz` name
    to prove a corrupt archive is handled — so it is the suite that moves when the filter and the
    reader branch change.
    THE FALSIFIER HAS AN OBVIOUS WRONG FORM. Asserting a hit count over a mixed fixture passes for a
    reader that double-counts the same rotation twice; assert WHICH files were opened, and dedupe
    identity, not just the total.
    NO COUNT HERE SHOULD BE QUOTED FORWARD — 666/3/1 and the 8.3%/90.8% split were true at
    2026-08-12T18:30Z. The plain half GROWS with every rotation and the gz half only changes if
    someone runs a compression pass, so re-measure before relying on either figure."
