  rationale: |
    OBSERVED 2026-09-29: W1-T1258 and W1-T2982 each carried only acceptance proofs of the form `grep: <phrase> in
    <their own shard>`, every one already true, at verify: auto. Workers were dispatched repeatedly and either made
    tangential out-of-scope edits (W1-T1258) or refused ("I can't make the implementation within the task record's
    declared scope", W1-T2982) until each circuit breaker tripped. W1-T1258's own text said it should be verify: human;
    fixed by hand in #7905 and #7908.
  design: |
    A task whose acceptance proofs ALL grep its own plan/tasks.d shard has nothing for a worker to build. (i) The
    drain never dispatches such a task to a worker; it routes it to the verify-human judge path, logging
    dispatch.record_task_routed. (ii) The plan lint reports the shape as a WARNING that names both remedies
    (verify: human for a ruling or record, or real proofs for the implementation it implies) and never refuses.
  acceptance:
    - claim: "a task whose every proof greps its own shard is routed to the judge, never to a worker"
      proof: 'grep: test("W1-T4818: a task whose every proof greps its own shard is routed to the judge, never to a worker" in test/a-record-task-is-never-dispatched-to-a-worker.test.ts'
    - claim: "the plan lint warns on that shape and never refuses it"
