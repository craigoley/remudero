- id: W1-T4950
  title: "Reconcile an opportunity from proposal through deployed and measured outcome"
  repo: remudero
  depends_on: [W1-T4949]
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 2
  budget_usd: 24.00
  risk: high
  origin: "operator gardener follow-up 2026-09-30: learn whether accepted optimizations actually helped"
  note: "reservation hand-off: plan-opportunity-outcomes-1790799000001 -> plan-opportunity-intake-1790799000000"
  plan_refs: [W1-T4110, W1-T4802, W1-T4949]
  files: [src/lib/opportunity-outcomes.ts, src/lib/codeql-quality-intake.ts, src/lib/gardener-overseer.ts, src/lib/daemon.ts, test/an-opportunity-is-not-a-win-until-measured.test.ts]
  status: queued
  attempts: 0
  rationale: |
    A proposal accepted, a task filed, and a PR merged are different events from deployment
    and improvement. The gardener overseer already measures targeted PR effects, but source
    opportunity -> proposal -> task -> PR -> runtime effect is not one auditable receipt chain.
    CodeQL package counts can drift after ratification; rewriting a proposal summary alone
    does not reconcile the actual alerts the filed task promised to address.
  design: |
    Join stable candidate key and source IDs to proposal, ratified task, credited PR head,
    deployment receipt, and same-repo targeted before/after measurement. Expose distinct
    pending, filed, merged, deployed, measured-helped, measured-hurt, expired, and
    unavailable states; an absent join or denominator is never a zero or a win. For CodeQL,
    retain alert numbers/rule ID and scanner SHA at filing, and surface new open alerts as
    a delta candidate rather than silently altering an accepted task. Reuse gardener-overseer
    effect verdicts where they exist; measure change lead time, failure/rework, and the
    candidate's targeted cost in consistent units and windows. No new automatic policy change.
  acceptance:
    - claim: "a merged but undeployed proposal remains unmeasured"
      proof: 'grep: test("W1-T4950: merge without deployment is not a measured win" in test/an-opportunity-is-not-a-win-until-measured.test.ts'
    - claim: "a deployed improvement and regression are attributed to their source candidate"
      proof: 'grep: test("W1-T4950: same-repo before and after evidence decides help or harm" in test/an-opportunity-is-not-a-win-until-measured.test.ts'
    - claim: "CodeQL alert drift is surfaced as a delta rather than a rewritten ratified task"
      proof: 'grep: test("W1-T4950: post-ratification CodeQL alerts become a delta candidate" in test/an-opportunity-is-not-a-win-until-measured.test.ts'
    - claim: "missing source or denominator is explicitly unavailable"
      proof: 'grep: test("W1-T4950: missing outcome evidence is unavailable not zero" in test/an-opportunity-is-not-a-win-until-measured.test.ts'
    - claim: "the daemon actually reconciles settled proposal outcomes"
      proof: 'grep: reconcileOpportunityOutcomes( in src/lib/daemon.ts'
  falsifier: |
    Remove the deployment join: a merged-but-not-live fixture must fail the first test.
    Add a new alert after ratification: the source package identity remains, and a delta
    appears without editing the task it had already filed.
