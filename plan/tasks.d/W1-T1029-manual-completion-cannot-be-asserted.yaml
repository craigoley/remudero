  note: |
    THE GREP PROOF MATCHES RATIONALE PROSE, NOT ITS OWN DECLARATION. The phrase sits on ONE PHYSICAL
    LINE inside rationale (5), is not on line 2 of the file, and reads 0 files across the whole tree at
    the merge base against a control ("tasks executed by hand") that reads 1 — so it discriminates head
    from base and cannot be downgraded to `executed_stale`.

    NO NEW CONSUMER IS INVENTED. `deriveStatus` already reads ledger lines at rung (a) and already
    exposes a `pr-field` source; `isDispatchEligible`'s unmet-deps predicate (`src/lib/drain.ts`) is the
    ultimate reader and needs no change, which is why drain.ts is NOT declared. The whole task is that
    the projection reads one rung more widely.

    src/run-task.ts IS NOT DECLARED, AND THAT IS DELIBERATE. It carries 237 of 377 records, and
    DECISIONS.md's 2026-08-18 ruling accepts one effective lane as the standing cost of naming it — so
    avoiding it where the marker is reachable elsewhere is worth doing. Both halves live under
    `src/lib/`: the rung in status.ts (50 shards) and the step registration in ledger.ts (37 shards).
    If an implementer finds the assertion cannot be read without touching a run-task.ts call site, that
    widening must be ratified before it is made, not disclosed afterwards.

    THE FOUR-TASK CLASS IS NAMED IN plan_refs SO A LATER READER CAN CHECK THE SIZING RATHER THAN TRUST
    IT. W1-T12d, W1-T12e, W1-T13 and W12-T1 are the whole population at this sha; if the count grows,
    the sizing argument in rationale (2) is the thing to re-derive, not this shard's scope.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. The criteria name a cross-repo
    credit lookup, a new assertion source, a negative case and a rotation-retention registration across
    two lib modules; `sizingViolation` (`src/lib/task-linter.ts`) derives subsystems from `files:` plus
    the acceptance text and would refuse medium on that span.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form; each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from the ledger-rotation suite that matched two. Each is
    plain prose under 100 characters with no comma, no `; ` and no regex metacharacter, because a bare
    title is compiled through `escapeRegExp` and matched literally. The fifth is doc-shaped and takes a
    `grep:` with an explicit path.

    ID PROVENANCE — MINTED THIS SESSION, PLAIN REFSPEC, EVERY VARIABLE BRACED. An orphan anchor over the
    empty tree (0 parent lines, 0 tree entries) naming host, pid and a nanosecond nonce. Free id: rc=0,
    `* [new reference] 4fbd1cb0… -> refs/rmd-id/W1-T1029`, readback equal to the anchor. NEGATIVE
    CONTROL, the identical plain refspec carrying a DIFFERENT sha at the taken refs/rmd-id/W1-T1027:
    rc=1, `! [rejected] … (non-fast-forward)`, that ref still 96bd26dc…. `could not read Username`
    occurrences 0 and `403` occurrences 0 on BOTH pushes, so the gate proof is genuine rather than an
