      proof: "unit test: W1-T1029: a completion pr in another repo satisfies a credit based dependency"
    - claim: "a manual task that produces no PR at all can be asserted complete with actor and time"
      proof: "unit test: W1-T1029: a manual task with no pr at all can be asserted complete"
    - claim: "a task with no assertion still reads unmerged in the same run"
      proof: "unit test: W1-T1029: a task with no assertion still reads unmerged in the same run"
    - claim: "the completion step is registered so a rotation cannot re-park the tasks behind it"
      proof: "unit test: W1-T1029: the completion step survives a ledger rotation"
    - claim: "this widens an existing hand-execution rung rather than adding a channel"
      proof: "grep: the projection already reads a hand-execution rung and two of the four cases cannot express themselves in it in plan/tasks.d/W1-T1029-manual-completion-cannot-be-asserted.yaml"
  risk: high
  origin: "oper#manual-completion-cannot-be-credited-2026-08-19"
