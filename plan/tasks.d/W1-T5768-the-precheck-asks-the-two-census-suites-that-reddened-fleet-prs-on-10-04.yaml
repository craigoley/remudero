  design: |
    BUILD AFTER W1-T5692 (filed in batch 10, #9155, not on main when this was filed, so it cannot be
    a depends_on edge yet): if main has no `PRECHECK_TRIGGERED_SUITES`, stop and record needs-design
    rather than building a second trigger table.
    Two rows in W1-T5692's `PRECHECK_TRIGGERED_SUITES`: every-priced on a changed src/**/*.ts whose
    added lines write a ledger payload naming `pr_url` or `cost_usd` (the census's own three write
    idioms) or a change to src/lib/config-gardener.ts; host-capability-fixtures on a changed
    test/**/*.ts whose added lines carry a host-capability token (`chmod`, `process.platform`,
    `getuid`, `hostname`, `/usr/bin/`) — a textual prefilter, since the .mjs precheck cannot load
    the census's TS scanner; a false start costs one ~27 s child, a miss is caught by CI as today.
    Each gets a `census:*` package.json script and a PRECHECK_PARITY `{ run }` entry, every-priced
    joins the population via PRECHECK_EXTRA_CI_CENSUSES, and host-capability-fixtures leaves
    `ciOnly`.
