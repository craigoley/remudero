  title: "MEASURE WHY DISPATCH WAITS FOR THE FIRST FULL PASS AFTER EVERY BOOT, BEFORE CHANGING IT — boot to first dispatch cost ~16.5 lane-min per boot on 2026-10-11 (280 lane-min over 17 boots: 210 boot gate, 53 gate-to-first-run, 17 down), because tick 1 awaits W1-T5720's boot gate before it reaches dispatch"
  repo: remudero
