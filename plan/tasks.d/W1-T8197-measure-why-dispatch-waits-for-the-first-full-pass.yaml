  type: recon
  verify: auto
  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium  # Rule 19: one concern — evidence and a design choice for boot-to-dispatch; no source change
  band_meaning: span
  origin: "operator approval 2026-10-11 (Craig: go with your recommendations): restart-churn measurement, ~/Remudero-notes/restart-churn-2026-10-11"
  plan_refs: [W1-T5720, W1-T5724, W1-T4998, W1-T5722, W1-T7747, W1-T8170]
  files: [docs/recon/boot-to-first-dispatch.md]
  status: queued
