- id: W1-T5787
  title: "A GARDEN'S ASYNC CHECKOUT LANDS AND DISPOSES OFF THE LOOP — after W1-T5740 `gardenCheckoutAsync`'s `dispose` still runs the sync `worktreeRemove` (worker.ts has no async remove), its land opens the PR through the sync `ghJson` and retracts a branch through `execFileSync`, and the knowledge workspace's `refreshAssertions` runs two `execFileSync` children inside the in-process knowledge garden's apply"
  repo: remudero
  depends_on: [W1-T5740]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 10.00
  risk: high  # Rule 19: one concern — the daemon-reached garden checkout is async end to end
  band_meaning: span
  origin: "operator session 2026-10-05: W1-T5740 (#9214) follow-up"
  plan_refs: [W1-T5740, W1-T5284, W1-T5689, W1-T4095]
  files: [src/lib/worker.ts, src/run-task.ts, src/lib/knowledge-gardener.ts, test/a-gardens-async-checkout-lands-and-disposes-off-the-loop.test.ts]
  status: merged
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-05 on #9214 (W1-T5740, open). `gardenCheckoutAsync` (src/run-task.ts) awaits
    `worktreeAddAsync` and runs its git, docs-index and preflight as async children, but returns
    `dispose: async () => worktreeRemove(opts.repoDir, root)`: src/lib/worker.ts exports
    `worktreeAddAsync` and only the sync `worktreeRemove`. `gardenLandSteps` opens the PR with
    `createPlanPrRest(opts.fetcher ?? ghJson, ...)`, a sync REST write, and on failure builds an
    `execFileSync` git for `retractGardenBranch`, whose `probeExistingPlanPr` is sync too.
    `knowledgeGardenWorkspaceAsync` keeps `refreshAssertions: () => refreshKnowledgeAssertions(root)`,
    which `execFileSync`s scripts/learnings-assert-check.mjs and `git status`, and the knowledge
    spec's apply calls it (`ws.refreshAssertions()` in src/lib/knowledge-gardener.ts). The knowledge
    garden runs in the daemon process (`startKnowledgeGardener` in src/lib/daemon.ts, port
    `knowledgeGardenWorkspaceAsync`), as does the codeqlQuality intake's port, so each is on the
    loop. #9214's body names the dispose and retract follow-ups.
  design: |
    Add `worktreeRemoveAsync` to worker.ts (same steps and refusals as `worktreeRemove`) and use it
    in the async dispose; open the garden PR through the async REST transport; give
    `retractGardenBranch` an async form for the async land; make the async workspace's
    `refreshAssertions` return a Promise over async children and have the knowledge spec's apply
    await it. Rows, branch names and refusals are unchanged; the sync forms stay for CLI callers.
    Add no comment lines to src/run-task.ts.
  acceptance:
    - claim: "an async garden pass lets a timer fire while its worktree remove, its PR create and the knowledge assertion refresh are each in flight, and records the same rows as the sync form"
      proof: "unit test: test/a-gardens-async-checkout-lands-and-disposes-off-the-loop.test.ts"
  falsifier: |
    Keep `dispose: async () => worktreeRemove(...)`: the timer fires only after the remove settles
    and the test fails.
