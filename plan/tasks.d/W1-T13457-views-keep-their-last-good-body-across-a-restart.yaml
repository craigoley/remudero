    - claim: "A handle started over a state dir whose store holds committed bodies for repositories, instances, inbox and agent answers each of them at once, before the worker's first body, with stale true and a warming source reason"
      proof: "grep: W1-T13457 criterion 1 in test/views-keep-their-last-good-body-across-a-restart.test.ts"
    - claim: "The repositories view never publishes a body with an empty instances list over a committed non-empty one while an instance is warming (repositories-view.ts about :421)"
      proof: "grep: W1-T13457 criterion 2 in test/views-keep-their-last-good-body-across-a-restart.test.ts"
    - claim: "invariant:stale-says-so — a carried body is always judged stale until the worker posts a fresh one"
      kind: guard
      proof: "grep: W1-T13457 criterion 3 in test/views-keep-their-last-good-body-across-a-restart.test.ts"
  rationale: |
    WHY: Craig approved retiring serve's old read paths on 2026-11-17. The Console thread observed that after a serve
    restart the views answer 404 view_not_ready, or repositories answers an empty instances list (repositories-view.ts
    :421), and each of those sends the Console to its legacy fallback routes, which keeps them alive.
  design: |
    INVARIANT stale-says-so: a body carried across a restart is judged stale until the worker posts a fresh one.
    1. Confirm which views loadCommittedViewBodies already restores at boot and which do not; restore the rest.
    2. repositories-view.ts holds the last committed instances list while an instance warms, instead of publishing empty.
