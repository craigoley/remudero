  note: |
    DESIGN, IN THE ORDER AN IMPLEMENTER MEETS IT.

    (i) DETECTION ONLY. The module reads `GET /repos/{owner}/{repo}` and
    `GET .../branches/{branch}/protection/enforce_admins` and NOTHING ELSE. IT MUST NEVER CALL A
    WRITE ENDPOINT — not to set a capability, not to probe whether it could. The token 403s on the
    writes, so an attempt cannot succeed, but the prohibition is about intent rather than outcome:
    a future token with more scope must not silently turn this into a remediator.

    (ii) THREE STATES, AND THE MIDDLE ONE IS THE POINT. (a) OFF-AND-FREE: flag it. (b) OFF-AND-PAID:
    flag it ONCE, carrying the cost in the finding — GitHub Code Quality requires Team or Enterprise
    Cloud, bills per active committer, and adds AI credits for autofixes plus Actions minutes for its
    own CodeQL scans. FLAGGING A PURCHASE DECISION THE SAME WAY AS A FREE TOGGLE IS THE NOISE THAT
    KILLS A CHECK. (c) UNAVAILABLE-ON-THIS-TIER: never flag. A check that reports an impossible
    setting daily teaches the operator to ignore it, which is the failure the 63-item escalation
    backlog already had.

    (iii) THE ALLOWLIST IS DATA WITH REASONS, NOT A PATH LIST. Because the API's vocabulary is only
    `enabled`/`disabled` (measured, rationale (4)), state (c) cannot be derived at runtime. Follow
    `INSTRUMENT_SURFACE_EXCLUSIONS` (`src/lib/review.ts`), which pairs every excused entry with the
    reason it earns a pass and refuses an entry whose reason is empty. TODAY'S ALLOWLIST IS
    `secret_scanning_delegated_alert_dismissal` and `secret_scanning_delegated_bypass` — 0 of 14
    org repos have either on — plus Code Quality as an annotated paid entry that no API can report.
    Everything else currently off is state (a) and SHOULD flag.

    (iv) THE BASELINE LIVES BESIDE `last-seen.json`, NOT IN THE LEDGER. The ledger is append-only and
    rotates, so a prior-posture comparison cannot rest on it — that is the same defect
    `DECISION_RELEVANT_LEDGER_STEPS` exists to patch, and patching it here would be the wrong fix.
    `state/` already holds durable single-fact stores the daemon rewrites in place
    (`last-seen.json`, `last-auto-triage.json`, `last-retro.json`, `merge-credit.json`,
    `status.json`), and `src/lib/last-seen.ts` is the pattern to COPY rather than to edit — it is
    deliberately NOT in `files:`. `state/` is gitignored (`.gitignore`), which is correct and
    load-bearing; the baseline is runtime state, not a record, and the FINDING is what must be
    durable, not the snapshot.

    (v) CHANGE-ONLY, NEVER DAILY. A setting off today is off tomorrow. Emit when the posture
    DIFFERS from the recorded baseline and on the first read after the baseline is absent; emit
    nothing otherwise. THE FIRST TEST WRITTEN MUST BE THE UNCHANGED-POSTURE PATH.

    (vi) THE READER IS THE OPERATOR, SAID OUT LOUD. The finding is a ledger row and a line in the
    daemon summary, read by THE OPERATOR reading the ledger. That is a legitimate reader and it is
    named here because an unstated one is not. It is deliberately NOT an `escalate()` call: that
    path gates iMessage on `MANUAL || HARD_STOP` (rationale (10)) and a posture finding is neither —
    routing it there would make it invisible on the BLOCKED tier where nine crash-loop issues sat
    unread for five days. NO NEW NOTIFY CHANNEL, NO NEW VERB, NO CONSOLE SURFACE IS IN SCOPE.

    (vii) IT MUST NOT BLOCK. A posture finding never halts a dispatch, never fails a check, never
    changes a verdict. And an unreadable read reports NOTHING rather than a clean bill — a silent
    all-clear on a failed probe is the vacuous pass this repo has been bitten by repeatedly.

    (viii) CADENCE. At most once a day, reusing the interval shape the daemon already has
    (`minIntervalMinutes` and the `checkRetroTrigger`/`checkAutoTriage` rungs in `src/lib/daemon.ts`)
    rather than inventing scheduling. A per-dispatch call is waste against a budget exhausted six
    times today. FIVE SCHEDULED WORKFLOWS ALREADY EXIST (`clock-sweep.yml`,
    `fleet-heartbeat-watch.yml`, `mutation-nightly.yml`, `recovery-drill.yml`, `scorecard.yml`) and a
    sixth is NOT proposed — see (ix) for why the home is `src/`.

    (ix) WHY THE HOME IS `src/` AND NOT A WORKFLOW — RULE 25, RE-DERIVED WITH FOUR CONTROLS.
    `INSTRUMENT_SURFACE` (`src/lib/review.ts`) carries `^\.github/workflows/` as its FIRST entry, and
    `detectInstrumentEntanglement` was run against four file lists at 00a1f584:
    workflow + `src/` product => entangled TRUE; workflow alone => FALSE; `src/` + `test/` alone =>
    FALSE; workflow + `test/` only => FALSE. 4 of 4 behaved as specified. So a workflow-homed
    implementation would have to RIDE ALONE, and this task needs a module plus its daemon wiring in
    the same PR. Choosing the `src/` home is therefore a consequence of the measurement, not a
    preference.

    WHAT MUST NOT BE BUILT. NO SETTING IS CHANGED AND NO LICENCE IS BOUGHT — both are operator
    decisions and the token cannot make either. NO REMEDIATION PATH, not even behind a flag. NO
    RULESET IS CREATED: Code Quality's rulesets can block PRs on quality and coverage thresholds,
    which would be A NEW MERGE GATE on a fleet where `ci-gate` is already the required check and
    `enforce_admins` reads false and `GET .../rulesets` currently returns an empty list. THAT NEEDS
    THE SAME CARE AS THE `required_status_checks_strict` QUESTION AND IS NOT THIS TASK.

    SIBLING, NAMED AND NOT ABSORBED. `src/lib/project-init.ts` generates new-repo scaffolding — it
    emits `.github/workflows/` files, a `.github/dependabot.yml` adapted from this repo's own, and a
    security doc. IT CONFIGURES AT CREATION; THIS TASK DETECTS DRIFT AFTERWARDS. They are different
    things and neither subsumes the other: scaffolding cannot turn on a GitHub-side capability
    (that needs the write endpoints this token 403s on), and a drift check cannot bootstrap a repo
    that does not exist yet. It matters for the BYO-hosting direction recorded in `DECISIONS.md`,
    where customers get their own repos and inherit whatever posture the scaffolding leaves them.
    `src/lib/project-init.ts` is deliberately NOT declared in `files:`.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT. `src/lib/github-posture.ts` is the new module (the
    read, the three-state classifier and the allowlist). `src/lib/daemon.ts` carries the cadence
    rung and the `DaemonDeps` wiring — it scores 10 on a word-bounded count of the cadence symbols
    (`checkAutoTriage`, `checkRetroTrigger`, `minIntervalMinutes`, `readJsonFile`) against
    `src/run-task.ts` at 11 and every other file at 2 or fewer. `src/run-task.ts` IS DECLARED
    because the real gateway factories that turn an injected predicate into a live REST read live
    there beside `costGovernorGateFor` and `queueGovernorGateFor`; per DECISIONS.md's 2026-08-18
    W1-T471 ruling that file is not split and tasks are not re-scoped to avoid it, and the ruling
    states the ceremonial acceptance sentence is no longer required, so it is declared plainly and
    the serialisation cost is accepted.

    `test/github-posture.test.ts` DOES NOT EXIST at 00a1f584 — a forward-referenced PATH, never a
    guessed symbol — and is a new file because the house rule keeps a coverage-load-bearing test out
    of a shared suite.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text, and this set
    crosses three `src/` modules and `test/`. Blast radius argues DOWN — the finding blocks nothing
    and changes no verdict — and UP, because a check that flags an impossible setting daily trains
    the operator to ignore the channel, which is why (ii) and (iii) are stated as constraints rather
    than left to judgement.

    ID PROVENANCE — THE ID WAS PRE-MINTED AND READ BACK BEFORE FILING, NOT MINTED HERE.
    `refs/rmd-id/W1-T1040` resolves to 2dad93bed8cb94f7bd85b5ff9130ac2f96c821e8, matching the
    `2dad93be` prefix the brief named. Positive control: `refs/rmd-id/W1-T1038` reads 1. Negative
    control: `refs/rmd-id/W1-T999999` reads 0.

    THE CALL-SITE CRITERION NAMES A SYMBOL THAT DOES NOT EXIST YET, AND THAT IS DELIBERATE. The
    `call-site` linter refuses a task that creates a module without an acceptance criterion proving
    something calls it — "Eleven modules have merged green and unreached; this is the check that
    would have caught six of them." Satisfying it requires forward-referencing a SYMBOL rather than
    a path, which is normally a guess; here the linter mandates it, so the implementer is BOUND to
    the name: the exported reader MUST be `readGithubPosture` and `src/run-task.ts` MUST call it.
    Renaming it means amending this criterion in the same PR.
