- id: W1-T1040
  title: "NOTHING EVER READS WHETHER THE REPO'S GITHUB-SIDE PROTECTIONS ARE ON, SO AN AVAILABLE-AND-OFF CAPABILITY IS INVISIBLE UNTIL SOMETHING NEEDS IT — `dependabot_security_updates` reads `disabled` while eight sibling repos in the same org read `enabled`, and the status vocabulary carries no way to tell OFF from IMPOSSIBLE"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    MEASURED 2026-08-19 AT origin/main 00a1f584, on the Azure host. No `/rate_limit` call was made,
    no repository setting was changed, no write endpoint was called, and no paid feature was enabled.

    (1) THE GAP. `.github/workflows/` carries codeql, semgrep, osv-scanner, scorecard,
    dependency-review and mutation-nightly, and they run. NOTHING reads the capabilities that live in
    GitHub rather than in a workflow file. The posture below was read by hand today and by nothing
    else, ever.

    (2) WHAT IS OFF, READ FROM `GET /repos/{owner}/{repo}`. The `security_and_analysis` block
    carries 8 keys: `secret_scanning` and `secret_scanning_push_protection` read `enabled`;
    `dependabot_security_updates`, `secret_scanning_ai_detection`,
    `secret_scanning_non_provider_patterns`, `secret_scanning_validity_checks`,
    `secret_scanning_delegated_alert_dismissal` and `secret_scanning_delegated_bypass` read
    `disabled`. `GET /repos/{o}/{r}/automated-security-fixes` independently returns
    `{"enabled": false, "paused": false}` — the same fact through a second endpoint. And
    `GET .../branches/main/protection/enforce_admins` reads `enabled: false`. Dependabot VERSION
    updates demonstrably work; it is the SECURITY-update path that is off, so a CVE in a dependency
    would not auto-open a PR.

    (3) READ AND WRITE DIFFER, AND THE TOKEN SETTLES THE SCOPE. Six reads were confirmed on the
    fleet's own PAT today: `repos/{o}/{r}` 200, `automated-security-fixes` 200,
    `vulnerability-alerts` 204, `branches/main/protection` 200, `.../enforce_admins` 200,
    `languages` 200. The operator separately measured 403 `Resource not accessible by personal
    access token` on `PUT .../automated-security-fixes` and
    `POST .../branches/main/protection/enforce_admins`. **THE WRITES WERE DELIBERATELY NOT
    RE-ATTEMPTED HERE**, because a PUT that succeeded would have changed a setting this brief
    forbids changing — the read/write split is established from the read side plus the operator's
    measurement, never by probing a mutation. A CHECK BUILT ON A WRITE-CAPABLE ASSUMPTION WOULD FAIL
    SILENTLY, so this task is DETECTION ONLY and must never call a write endpoint.

    (4) THE API DOES NOT DISTINGUISH OFF FROM UNAVAILABLE — MEASURED, NOT ASSUMED. Across every
    repo the org exposes to this token (15 repos, 122 status observations) the vocabulary is
    EXACTLY TWO VALUES: `enabled` 57, `disabled` 65. There is no `unavailable`, no `not_set`, no
    third string. So the check CANNOT self-classify from the status field and MUST CARRY AN
    ALLOWLIST of expected-off capabilities.

    (5) AND THE ALLOWLIST IS DERIVABLE FROM THE SAME SWEEP, WHICH IS WHY IT IS NOT A GUESS. Sibling
    repos in this org prove availability: `dependabot_security_updates` reads `enabled` on 8 of them,
    `secret_scanning_ai_detection` on 4, `secret_scanning_non_provider_patterns` on 6,
    `secret_scanning_validity_checks` on 6. Those four are AVAILABLE AND OFF HERE. By contrast
    `secret_scanning_delegated_alert_dismissal` and `secret_scanning_delegated_bypass` read
    `disabled` on ALL 14 repos carrying them — no repo this account owns has ever had them on — which
    is the signature of a tier-limited capability rather than a toggle. THE ALLOWLIST FOR THIS REPO
    TO READ CLEAN TODAY IS THOSE TWO DELEGATED KEYS AND NOTHING ELSE.

    (6) THE TIER CANNOT BE READ ON THIS TOKEN. `GET /orgs/craigoley` returns `plan: null`, and
    `GET /repos/{o}/{r}` returns `plan: null` too. So the check cannot resolve which of the three
    states an unknown capability belongs to by asking; the allowlist is the ONLY mechanism available,
    and it must be data with a stated reason per entry rather than a bare path list.

    (7) CODE QUALITY HAS NO API SURFACE AT ALL. `repos/{o}/{r}/code-quality` and
    `repos/{o}/{r}/quality` both return 404, against positive controls of 200 on
    `code-scanning/default-setup`, `code-scanning/alerts`, `rulesets` and `dependabot/alerts` on the
    same token in the same call sequence. It is visible only in the settings UI. THEREFORE IT CANNOT
    BE PROBED AND MUST BE AN ANNOTATED ALLOWLIST ENTRY CARRYING ITS COST, never a live read.

    (8) ITS INCREMENT IS SMALLER THAN IT LOOKS, AND THE MEASUREMENT SAYS SO. `codeql.yml` already
    runs `queries: security-and-quality` — its own comment reads "security-extended queries +
    maintainability" — so the QUALITY QUERY HALF IS ALREADY RUNNING. `coverage-ratchet` already
    computes an aggregate floor and diff-coverage from `--experimental-test-coverage`, though in
    lcov: `cobertura` appears ZERO times in the repo against a control of 48 files containing
    `lcov`, so the coverage half would need a NEW REPORT FORMAT over an EXISTING MEASUREMENT. What
    is genuinely new is the AI-POWERED ANALYSIS ON RECENTLY CHANGED FILES. Language support is not
    in doubt: `GET .../languages` reads TypeScript 96.8% and JavaScript 1.7% — 98.5% of the repo —
    and `code-scanning/default-setup` lists `javascript-typescript` and `typescript` among its
    languages while reading `state: "not-configured"`.

    (9) WHY THE INCREMENT IS RELEVANT HERE SPECIFICALLY, RECORDED WITHOUT RECOMMENDING IT. GitHub's
    stated use case is a team adopting AI coding assistants that needs assurance generated code
    meets the same bar, with AI analysis catching what rule-based queries were not written for. This
    fleet opens 15-30 PRs a day and no human reads them line by line. THAT IS CONTEXT FOR A
    PURCHASE DECISION AND NOT A RECOMMENDATION TO MAKE IT.

    (10) THE WRONG ESCALATION TIER IS INVISIBLE, WHICH IS WHY THIS MUST NOT USE IT. `escalate()`
    (`src/lib/escalate.ts`) gates its only `notify()` call on `cls === "MANUAL" || cls ===
    "HARD_STOP"`, and `src/lib/notify.ts` says so in its own header: iMessage is "reserved for
    MANUAL + HARD_STOP escalations (MASTER-PLAN §4); BLOCKED and ..." are silent. Every daemon
    escalation measured today was BLOCKED. Nine crash-loop issues went unread for five days on
    exactly that tier.
