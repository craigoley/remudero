- id: W1-T4095
  title: "NOTHING PRUNES, MERGES OR RETIRES KNOWLEDGE UNLESS A PERSON DOES IT — MASTER-PLAN.md grew 87% in 30 days (705 KB), two forensics pages are ~600 KB, 11 doctrine headlines restate one idea, 39 of 67 links in the operator's memory index are dead, and no process measures whether the knowledge base is getting better: add a KNOWLEDGE GARDENER, a self-paced background pass that scores every knowledge item, takes tiered reversible actions through ordinary PRs, and judges its own past actions"
  repo: remudero
  depends_on: [W1-T4091]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 60.00
  risk: high
