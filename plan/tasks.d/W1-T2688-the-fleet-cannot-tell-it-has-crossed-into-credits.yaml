- id: W1-T2688
  title: "NOTHING TELLS THE FLEET IT HAS CROSSED FROM SUBSCRIPTION INTO USAGE CREDITS, AND THE PROMPT-CACHE LIFETIME COLLAPSES FROM AN HOUR TO FIVE MINUTES WHEN IT DOES — every worker's cache economics change under it, `account-usage.ts` reads window utilisation and knows nothing of the credit state, and no row records the transition"
  repo: remudero
