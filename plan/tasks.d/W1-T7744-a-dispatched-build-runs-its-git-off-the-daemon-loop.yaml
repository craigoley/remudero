- id: W1-T7744
  title: "A DISPATCHED BUILD'S GIT AND CENSUS CALLS RUN OFF THE DAEMON LOOP — the daemon runs each build in process, so its synchronous worktree git, census precheck, affected-suite listing, pre-push gate and filing-snapshot read freeze the whole loop: on 2026-10-10 `hostWorktreeGit` alone held it 36 times, worst 77.3 s"
  repo: remudero
