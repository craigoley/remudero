  rationale: |
    W1-T3801 was filed by PR #6122 on the reserved branch name run-W1-T3801-1789843200000,
    so its plan-filing merge already credits that task through the independent branch-credit
    path even though it did not implement the adapter. Its verify:human record must remain
    terminally unchanged; this follow-up owns the implementation and carries the operator's
    completed policy decision into an executable task.

    The implementation target is current main's existing gate-posture seam. The first pilot is
    ci:source-size: a deterministic, recoverable repository-hygiene finding with an existing
    idempotent follow-up consumer. The judge chooses only LAND, REPAIR, LAND+DEBT or STOP. A
    recoverable STOP becomes LAND+DEBT, judge outage and malformed output restore the old
    follow-up behavior, and no outcome blocks the feature PR. Credentials, destructive changes,
    tenant isolation, CI-red and merge-authority gates remain excluded.
  design: |
    (i) Preserve the deterministic source-size finding and pass only bounded paths and the
    existing consequence to the judge; the model never argues that the finding is false.
    (ii) Keep the feature flow autonomous: healthy source-size output does not spawn a judge,
    and a material hotspot produces at most one idempotent follow-up side effect.
    (iii) Ledger intent before the side effect and the final decision after it, with privacy-safe
    evidence. On outage, malformed consequence, or side-effect failure, restore the old behavior
    once rather than trapping the worker or retrying a failed write in a loop.
    (iv) Do not replace the existing candidate-change judge path or introduce a CI-red,
    merge-authority or human-approval gate.
    (v) Verify every decision arm with focused tests and retain the test-tier manifest entry so
    coverage shards cannot refuse the new test file as unclassified.
