  depends_on: []
  priority: 1.2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the read-model worker is serve's build engine; the change adds one number per build from a clock read and changes no build, schedule or body
  band_meaning: blast-radius
  origin: operator-session#serve-lightweight-2026-11-08
  plan_refs:
    - W1-T9604
