  rationale: |
    MEASURED 2026-10-07 21:42–21:48Z (360 s Profiler session on the live daemon): the longest busy run,
    39.9 s, was gardener.gardenPassSteps → knowledge-gardener → testPinnedLearnings (27.9 s inside it);
    readFileUtf8 was 62.7 s of self time across the window. READ on origin/main: `testPinnedLearnings`
    (src/lib/knowledge-gardener.ts) recursively readdirSyncs test/ and readFileSyncs every .js/.ts file to
    match quoted learning ids, on every call.
  design: |
    Key the scan on the test tree's identity — the git tree object id of test/ at HEAD
    (`git rev-parse HEAD:test`, one cheap call) — and reuse the pins while it is unchanged; an
    unresolvable tree id falls back to today's full scan rather than serving an answer of unknown age.
    The pin semantics (first file naming an id, fixtures skipped) are unchanged.
