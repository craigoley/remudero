  note: |
    RE-SCOPED 2026-09-04, operator-approved. THE WORLD MOVED UNDER THIS SHARD; the criteria below
    are not edited to match a diff. Everything in this block is a measurement taken on origin/main
    at 3bc15420, in a throwaway worktree, and each superseded criterion is RECORDED rather than
    deleted so a later reader can tell "this shipped elsewhere" from "we decided against this".

    CRITERION 1 IS SATISFIED — BY #3871, NOT BY THIS TASK, AND NOT DROPPED. As filed it read:

      claim: "the source-size gate invokes a mode that never writes, so a gate run cannot record a
              baseline entry no one asked for"
      proof: "grep: source-size-ratchet\\.mjs --check in package.json"

    That property now HOLDS on main. `1eb3b6ea` ("chore(instrument): split the source-size signal
    prerequisite", #3871) split the script into two invocations, and `src/lib/ci-parity.ts`
    registers `script: "source-size-signal"` — the bare form — for the `source-size` job. MEASURED:
    `node scripts/source-size-ratchet.mjs` exits 0 and leaves `git status --porcelain` EMPTY. The
    entry's own reason string says it outright: "The historical shared baseline is not read or
    written". So the gate can no longer record an entry nobody asked for.

    IT WAS SATISFIED BY A DIFFERENT MECHANISM THAN THE PROOF NAMES, which is why the proof must not
    survive: `grep -c 'source-size-ratchet\.mjs --check' package.json` reads 0 on main and would
    stay 0. `package.json:62-63` maps `source-size-signal` to the bare form and `source-size-ratchet`
    to `--baseline scripts/source-size-baseline.json`; neither names `--check`. Building to that
    proof would mean wiring a `--check` flag into a gate that already does not write — churn that
    changes no behaviour. The claim is true; the proof is stale.

    CRITERION 2 IS DROPPED, AND THE REASON IS A MEASUREMENT, NOT A SCOPE PREFERENCE. As filed it
    required `src/lib/install-hash.ts` to carry a recorded ceiling so that switching the gate to
    the non-writing mode would not redden main. MEASURED: `install-hash` still appears 0 times in
    `scripts/source-size-baseline.json`, so the entry is genuinely still absent — but the condition
    that made it necessary is gone. The gate no longer reads or writes that baseline at all, so
    there is no switch left to make and nothing to redden. Recording the entry now would be an
    unrelated bookkeeping edit riding under this task id, which is the exact failure this shard's
    own note complains about.

    THE BASELINE IS NOT INERT, AND THAT QUESTION WAS ASKED AND ANSWERED BEFORE RE-SCOPING. #3871
    converted the FAST-GATE STEP from blocking to advisory; it did NOT remove enforcement.
    Enforcement lives in `test/a-source-file-cannot-outgrow-its-baseline.test.ts`, which runs the
    ratchet as `--root <REPO_ROOT> --baseline <copy of the real baseline>` and asserts
    `gate.status === 0` against the REAL `src/` tree — so it blocks inside `npm run test:ci`, which
    is the ci-shard 4/4 red operators have been seeing. FALSIFIED DIRECTLY: growing
    `src/lib/isolation.ts` from 478 lines to 598, past its recorded ceiling of 500, turns that file
    from `# pass 24 / # fail 0` into `not ok 1 ... source-size-ratchet: BLOCKED -- 1 source file(s)
    grew past their recorded baseline`; restoring the file restores the pass. So the three lanes
    that maintained ceilings (417->478, 500->700, 1516->2000) were maintaining a live gate, and
    `--check` is NOT the only enforcing form — the enforcing form is the bare `--baseline`
    invocation the test drives.

    NEITHER #3871 NOR #3750 CARRIES A `Remudero-Task:` TRAILER, so both are cited here by PR number
    and sha. A trailer-only credit scan cannot see either — the same gap W1-T2776's implementation
    subject demonstrated on 2026-09-04.
  rationale: |
    WHAT SURVIVES IS THE DETECTOR, AND W1-T2650 MADE IT MORE NECESSARY RATHER THAN LESS. That is
    the whole argument for still building this, so it is stated first.

    The obvious reading of `e2a8947b` (W1-T2650, "exempt the size baseline from the scope
    guard/reviewer") is that it solved this shard's damage and left the cause. It did solve the
    damage: `SCOPE_EXEMPT_GENERATED_ARTIFACTS` (`src/lib/review.ts`) names
    `scripts/source-size-baseline.json` and is subtracted by BOTH `scopeGuardOutOfScopeFiles` and
    `scopeViolationFiles`, so the blocked_review that cost issue #3843 and the extra plan-only PR
    #3850 cannot recur.

    BUT THE SCOPE GUARD WAS THE THING THAT CAUGHT A STRAY BASELINE WRITE, LOUDLY, BY REFUSING IT BY
    NAME. Exempting the path removed the symptom, not the cause — and it removed the only mechanism
    that made the cause observable. The recording form still exits 0 while mutating: MEASURED,
    `node scripts/source-size-ratchet.mjs --baseline scripts/source-size-baseline.json` exits 0,
    leaves `M scripts/source-size-baseline.json`, and silently recorded `src/lib/install-hash.ts:
    53 lines` in the probe run. Before W1-T2650 that mutation would have been refused as
    out-of-scope; after it, the same mutation rides along with NO gate objecting at all. The
    detector is what replaces the guard that was removed.

    WHY THE DETECTOR MUST BE RETARGETED, NOT BUILT AS FILED. The original criterion asserted that
    "running the source-size gate" leaves the tree byte-identical. Pointed at the gate as it now
    stands, that assertion passes trivially and forever, because the gate runs `source-size-signal`
    and `source-size-signal` never writes — the exact vacuity this shard's own filing warned
    against. The property worth pinning is therefore the one the fast gate as a WHOLE must satisfy:
    no step on the gate path may leave the tracked tree dirty, with the recording form serving as
    the positive falsifier that the check can be made to fail.

    THE SECOND INSTANCE HAS ALREADY BEEN FIXED, INDEPENDENTLY, AND IT NARROWS THE CLASS RATHER THAN
    THIS TASK. `test/a-source-file-cannot-outgrow-its-baseline.test.ts` used to run the ratchet
    against the REAL baseline path and so dirtied the tracked tree on every suite run; its own
    header records the fix ("AGAINST A COPY, NEVER THE TRACKED FILE") and names the two 2026-09-02
    measurements that forced it. So the class this shard exists to catch has been shrinking by hand,
    one instance at a time, with nothing asserting the property — which is precisely the argument
    for a detector rather than a third hand-fix.

    THE DETECTOR MUST NOT BE VACUOUS. A check that runs a gate in a tree where nothing would drift
    passes trivially. It has to be falsified in the positive direction: with a deliberately
    unrecorded source file present, the RECORDING form dirties the tree and the check must FAIL
    naming the dirtied path; on the gate path as shipped, the same setup must leave it clean.
  acceptance:
    - claim: "a test runs the fast gate's own source-size step and asserts the tracked tree is byte-identical afterwards, comparing git status --porcelain before and after in-process rather than trusting the step's exit code"
      proof: "unit test: test/a-gate-run-leaves-the-tracked-tree-clean.test.ts"
    - claim: "the same test is falsified in the positive direction — pointed at the recording form with an unrecorded source file present it FAILS and names the dirtied path, so the check is not vacuous"
      proof: "unit test: test/a-gate-run-leaves-the-tracked-tree-clean.test.ts"
  falsifier: |
    BOTH DIRECTIONS, and the positive one is the one that matters. Point the new test at the
    RECORDING form (`--baseline scripts/source-size-baseline.json`) with an unrecorded source file
    present: it must FAIL, naming the dirtied path — a detector that cannot be made to fail is
    measuring nothing. Point it at the gate path as shipped (`source-size-signal`): it must pass
    with the tree byte-identical. Take `git status --porcelain` before and after in the same
    process rather than trusting an exit code, because the defect this guards is a mutation that
    exits 0.

    NEVER WRITE THE PROBE'S FIXTURE INTO THE TRACKED TREE. The suite this joins already refuses
    that (`test/a-source-file-cannot-outgrow-its-baseline.test.ts`'s header, and its own copy-the-
    baseline fix); a detector for tracked-tree mutation that itself mutates the tracked tree is
    self-refuting.

    CLOSE THIS TASK WITHOUT CODE if the recording form has by then stopped exiting 0 while writing,
    or if some other gate has taken over asserting the property — either would mean the detector
    guards nothing. Re-measure both forms before building rather than trusting this note: this
    shard has already been overtaken once by #3871, which is why the re-scope block above exists.
