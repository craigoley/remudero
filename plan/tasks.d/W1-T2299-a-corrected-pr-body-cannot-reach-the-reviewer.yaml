  title: "A CORRECTED PR BODY CANNOT REACH THE REVIEWER THAT JUDGED THE OLD ONE — the post-review row offers a head only at reviewState none or a stale pending, so a posted failure verdict makes that head permanently unofferable and a body edit that repairs the very input the verdict refused clears nothing; the same file already carries the reasoning for the stuck-pending case"
