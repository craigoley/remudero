      proof: "unit test: test/review-body-edit-reoffer.test.ts"
    - claim: "a head that has exhausted that budget is not offered again even when its body changes once more"
      proof: "unit test: test/review-body-edit-reoffer.test.ts"
    - claim: "the disposition reason names editing-after-a-verdict as its own cause, distinct from never-reviewed, orphaned-by-a-push and stuck-pending"
      proof: "unit test: test/review-body-edit-reoffer.test.ts"
    - claim: "a re-offered head is judged afresh and no prior verdict is carried forward, so the reviewer can still fail it and still downgrade a non-responsive proof"
      proof: "unit test: test/review-body-edit-reoffer.test.ts"
    - claim: "the admitting arm is recorded as detecting activity after a verdict rather than a body edit, because the payload carries no body-specific timestamp"
      proof: "unit test: test/review-body-edit-reoffer.test.ts"
