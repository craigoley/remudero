    - claim: "the report changes no dispatch decision and refuses no push"
      proof: "unit test: test/run-branch-claim-is-unenforced.test.ts"
    - claim: "nothing added reads the network or walks the ledger to produce the report"
      proof: "unit test: test/run-branch-claim-is-unenforced.test.ts"
  falsifier: |
    If a sweep of merged PRs finds no BUILD whose anchored `Remudero-Task:` trailer names a task while
    its head branch matches none of `ownsBranch`, `isBareRunBranch` or `isOwnedSlugBranch` — measured
    the way this shard measured it, by splitting the population by BUILDER and by KIND rather than
    counting non-`run` branches, since plan filings correctly use them — then the gap is not being
    exercised and this task should be closed rather than implemented. The rate measured here is ONE
    build in fifty-nine, from a classifier that could not attribute thirty-five of them, so a re-run
    that reads zero is a weak refutation and a re-run that reads several is a strong confirmation.

    SEPARATELY DECISIVE: if `projectPlan` stops attributing an open PR by `/^run-(.+)-\d+$/` on the head
    ref alone — for instance by consulting the anchored trailer the way the merged path already does —
    the mechanism described here is gone and the finding must be re-derived rather than trusted.
