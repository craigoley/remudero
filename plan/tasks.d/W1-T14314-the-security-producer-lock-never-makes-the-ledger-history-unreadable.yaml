  rationale: |
    WHY: one empty lock file has blinded the fleet's self-repair since 2026-11-21T08:53Z.
    - src/lib/sweep.ts:18557 (W1-T13787, #19649) opens a SQLite lock at `<ledger>.security-producer.lock.sqlite`.
      SQLite leaves that file in place. Nothing removes it.
    - listedLedgerFiles (src/lib/ledger-union.ts:305-331) reports every `ledger.*` name it does not know as
      unclassified. W1-T5763 and W1-T5807 exempted the sidecars that existed then. This one came later.
    - Each reader that requires an empty `unclassified` then refuses for as long as the file exists.
    OBSERVED, read-only, in the core ledger and its rotations:
    - The file was created at 2026-11-21T08:53:25Z with size 0.
    - sweep.arm_verdict_history_read was complete=true at 08:52Z and every time before it on 11-20 and 11-21. It is
      complete=false on every read from 08:54Z.
    - From 09:08Z to 2026-11-22T13:43Z all 51 reconcile rows are reconcile.unreadable, naming this file. The fleet
      reconciler repaired nothing for 28 hours.
    - About 100 rows read "refresh history is unreadable".
    READ in code at 51105aaa3, the other readers it blinds:
    - headContractRefreshHistory (sweep.ts:11419). lightPassHeadContractRefresh then returns without a candidate, so
      that path never refreshes a branch whose scope amendment merged.
    - readFixScopeHistory (fix-scope-history.ts:15), which throws.
    - the provider startup comparison (cli/commands/daemon.ts:307) and the reservation reap history (run-task.ts:17825).
    - cash-trial, now-view, retro, reader-agreement and triage-lane-outcomes.
  design: |
    INVARIANT unknown-ledger-files-still-refuse: a `ledger.*` file that is no rotation, no valid metadata sidecar and no named own lock stays unclassified, and strict readers still refuse on it.
    1. src/lib/ledger-path.ts gains LEDGER_SECURITY_PRODUCER_LOCK_SUFFIX = ".security-producer.lock.sqlite".
    2. sweep.ts builds the lock path from that constant. The path on disk does not change, so a file that already
       exists is covered without anyone moving or deleting it.
    3. The classifier accepts exactly that name, and SQLite's `-journal` form of it, as the ledger's own file. It is
       not read as rows and is not a rotation. Follow the rotation lock's exact-name exemption, never a wildcard.
    4. The class fix: the new suite reads src/ for file names built as the ledger path plus a literal or a named
       suffix constant, and fails when listedLedgerFiles would call one of them unclassified. The next sidecar then
       fails CI instead of silently blinding the fleet. Use the shared repository-root helper.
    NOT IN SCOPE: what any reader does when history really is incomplete.
