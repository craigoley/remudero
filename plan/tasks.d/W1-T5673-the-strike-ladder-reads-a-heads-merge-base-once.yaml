  rationale: |
    READ 2026-10-04 on origin/main 284015b9 (W1-T5635 merged bbc2d99a, #9112). `applyStrikeLadder`
    (src/lib/sweep.ts): `const currentMergeBaseSha = pr.currentMergeBaseSha ?? await
    effects?.readMergeBase(pr);`; `buildSweepEffects`' `readMergeBase` calls
    `readJsonImpl(compareRestArgs(owner, repo, "main", pr.headSha))`. The read runs before
    `decideStrikeLadderRung`, even when the decision would hold on `mainTip` alone, with no cap and
    no cache. The merge base of main and a fixed head cannot change while main advances, so
    `pr@headSha` is a sound key. W1-T5630 (main-health reads once per head) is the sibling pattern.
  design: |
    Memoise `readMergeBase` per `pr@headSha` in a process map pruned to the open set; cache only a
    defined sha so a failed read retries; skip the read when `mainRepair` is undefined.
