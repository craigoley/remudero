- id: W1-T4433
  title: "THE MOST FREQUENT PR REDS ARE ONE-SECOND RULE CHECKS THAT ONLY RUN 20 MINUTES INTO COVERAGE — clock-signature, fixture-copy, comment-load and Deps censuses redden PRs after a full instrumented run, and preflight does not run them; run every census and ratchet suite in a fast CI job and in the worker's pre-push preflight"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  priority: 1
  budget_usd: 30.00
  risk: high
  band_meaning: span
  origin: "operator ask 2026-09-24: get PRs through the process quicker — automated flow and self-improvement; research over the 150 most recent merged PRs"
  plan_refs: []
  # Scope ratified in a plan-only follow-up: these docs and regression suites shipped with #6980 and directly support the new rule-check gate.
  files:
    - .github/workflows/ci.yml
    - docs/cli-reference.md
    - scripts/list-rule-suites.mjs
    - src/lib/ci-parity.ts
    - src/lib/review.ts
    - test/fast-gate-admits-the-census-class.test.ts
    - test/preflight-coverage-mode.test.ts
    - test/preflight-fast-mode.test.ts
