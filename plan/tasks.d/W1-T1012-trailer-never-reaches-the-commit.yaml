  note: |
    THE GREP PROOF MATCHES RATIONALE PROSE, NOT ITS OWN DECLARATION. The phrase sits on ONE PHYSICAL
    LINE inside rationale (2), is not on line 2 of the file, and reads 0 across the entire tree at the
    merge base — so it discriminates head from base and cannot be downgraded to `executed_stale`.

    src/run-task.ts MUST BE DECLARED AND THE W1-T471 SERIALISATION COST IS ACCEPTED IN WRITING. It is
    declared by 223 of 362 shards, so this task serialises against most of the pool under
    `overlappingPaths`. It is unavoidable: `ghPrCreateFillCommand` is defined there and both
    implement-lane executors are there (word-bounded counts at 39efeddb — run-task.ts 8, git-push.ts 1
    and that one is a doc mention). src/lib/compaction.ts is declared by 12 shards and holds both the
    body-trailer instruction and `commitMessageContractLines`, the two literals this change keeps in
    sync. CONTROL: an absent path reads 0 shards.

    src/lib/autonomy.ts IS NOT DECLARED, DELIBERATELY, AND THIS IS THE SCOPE LINE. It is the biased
    consumer and would have been cheap (4 shards), but a write-side fix cannot repair the 373 merges
    already on the ref, and repairing them is reconciliation — explicitly out of scope. Making
    `zeroTouchMergeRate` report its own corpus completeness is a real and separate task; it is NOT filed
    here because one shard spanning the write and the reader fails Rule 19's span, and because the
    honest sequencing is that the record be correct before a figure is drawn from it.

    THE CONSOLE IS THE DOWNSTREAM CONSUMER AND THIS SHOULD LAND FIRST. W1-T437's own title puts the
    zero-touch rate "on the board and in retro". No console statistics are proposed here: a board that
    renders a rate computed over 31% of its population displays a wrong number beautifully, and the fix
    for that is upstream of the board.

    NO MOUNT, CAP OR THRESHOLD IS TOUCHED. The build lane runs one arm and there is nothing to compare.

    risk: high IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (`src/lib/task-linter.ts`) exempts only risk high, and `subsystemsOf` derives subsystems from the
    acceptance text as well as from `files:`; the criteria name a commit write, a prompt contract and a
    filing/implementation split.

    PROOF DIALECT CHOSEN BEFORE WRITING. Four criteria are mechanical and take the name-filtered
    `unit test:` form. Each title was measured against test/ with `grep -rlF` and matched ZERO files,
    against a control title lifted verbatim from test/commit-message.test.ts that matched one; each is
    plain prose under 100 characters, with no comma, no `; ` and no regex metacharacter, since a bare
    title is compiled through `escapeRegExp` and matched literally. The fifth is doc-shaped and takes a
    `grep:` with an explicit path.

    ID PROVENANCE — GIT SURFACES FIRST, GITHUB LAST AND SERIAL, `/rate_limit` NEVER CALLED. W1-T1012
    read 0 on all four surfaces: `refs/rmd-id/*` (104 enumerated; the three out-of-range sentinel
    reservations were excluded from the max by range, not by name), shard FILENAMES (max W1-T1011 —
    the filename IS the existence test), ids mentioned under plan/ (advisory only; its own control is
    that it returns a documented six-digit token from W1-T509's prose that is not an id at all), and
    the open-PR titles, heads and file lists. THE OPEN-PR SET WAS READ, NOT UNREAD: two open pull
    requests were enumerated (#2159, #2160) and both file lists fetched; their ids are W1-T1005 and
    W1-T1009, both below the frontier. THE REFS WERE RE-SWEPT IMMEDIATELY BEFORE PUSHING because a
    lane is minting and two collisions happened in two sessions.
    THE GATE PROOF IS GENUINE, NOT AN AUTH FAILURE. Plain refspec, no `+` and no lease. Free id:
    rc=0, `* [new reference] 39efeddb… -> refs/rmd-id/W1-T1012`. The IDENTICAL refspec at the taken
    refs/rmd-id/W1-T1011: rc=1, `! [rejected] … (non-fast-forward)`, that ref still 2d5b83f8…, and
    `could not read Username` occurrences: 0 on BOTH pushes.
