  rationale: |
    The first Flow and Quality producer can measure PR throughput and observed repair load from
    existing caches, but current green cannot reconstruct first-pass success, current open counts
    cannot reconstruct yesterday's backlog, and window spend divided by window merges is not
    attributable cost per delivered PR. These three graph families were explicitly approved by
    the operator and must not vanish when the first slice lands. Add bounded durable evidence at
    existing observation seams, leaving historical gaps unknown and all existing action authority
    unchanged. Do not rebuild W1-T8667, infer historical gardener parentage or revive factory UI.
  design: |
    Extend the existing repository-flow-v1 optional contract after W1-T8684. Capture compact
    source-owned evidence at existing PR publication/sweep/cache refresh seams; no new timer,
    GitHub walk, provider call, request-time history scan or browser measurement authority.
    Store bounded durable checkpoints/samples using the repo's atomic write/rotation machinery,
    exact repository and source generation. Distinguish data observed by the daemon from data
    merely discovered later. Capture no raw prompts, bodies, CI logs, credentials or identities
    beyond bounded PR/head/round/task/run references needed for existing scoped evidence links.

    First-pass success requires proof of the publication's initial head, the required-check set
    and policy snapshot, complete pagination and that head's latest check attempts. A later
    already-green discovery is not a first pass. Pending, cancelled, skipped, neutral, missing,
    expired and failed checks retain their own policy-aware states. Report evidenced eligible,
    passing and unknown counts with the denominator/cohort; include still-open PRs rather than a
    merged-only survivor cohort. Do not count repeated failures as separate broken PRs. Preserve
    code repair versus flake rerun versus infrastructure/conflict/unknown classifications only
    where exact source evidence permits; do not label a whole cancelled main run a code defect.

    Repair-to-green latency starts at an observed failing required-head snapshot and ends only
    at complete verified required-current-head green. Track head changes and exact repair round,
    keep pending/open episodes right-censored, expose sample count and p50/p90, and never substitute
    fix.done FIXED, a push timestamp, merge or a ledger backfill timestamp for green completion.
    Daily backlog uses the day's last complete observed scoped open-PR inventory sample with
    sample time and covered period: awaiting review, required checks red, conflict and blocked
    states plus oldest age. Preserve overlapping reasons without summing them into an invented
    distinct-PR total. No sample means a gap, not an empty queue; no fabricated pre-install history.

    Efficiency uses exact task/run/producer-receipt to delivered-PR joins, canonical raw producer
    dedup across rotation, known-priced subtotal and unpriced/unlinked counts with consistent PR
    cohorts/windows. Reuse W1-T8667's compact cost semantics when served; its incompleteness must
    not block independently valid first-pass/backlog graphs. Shared host/fleet costs and ambiguous
    shared daemon run ids are not assigned to a repo/PR. Distinguish provider cash, modeled cost,
    token accounting and actual operator effort. A useful rate may be partial with explicit
    coverage, never a fabricated cash total or causal ROI claim. Gardeners can consume the same
    comparable source evidence to propose a bounded follow-up; this task does not add automatic
    promotion, close an Inbox item, weaken a gate or enable new gardeners.

    Bound checkpoint size, identity sets, daily sample retention and projection output separately;
    dedup observations while retaining current source time, not renewing it on HTTP reads. Refuse
    genuine overflow by name while preserving valid independent graph families and ordinary
    Analytics. Cover cold restore, interrupted/failed atomic writes, legacy snapshots, malformed
    versions, two repos sharing PR numbers, required-policy changes, repeated retries, partial
    pages, no samples, cross-window merges, ambiguous joins and real-priced zero versus unknown.
    Default producer/writer/worker plus cached HTTP tests are required, not fake-only fold tests.
    Validate OpenAPI/API-client parity and published-head discrimination before normal review/CI.
