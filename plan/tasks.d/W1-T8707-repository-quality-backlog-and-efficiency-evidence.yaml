  falsifier: |
    Remove initial-head identity or page coverage, change fix.done into recovery evidence, renew
    missing backlog days to zero, attribute a shared run to its last PR, or omit atomic writer/
    worker wiring. The corresponding committed-tree physical test must fail. Restore source,
    require real TAP/native author/census, instrumented same-tree coverage, stored acceptance,
    current-head governed review/hosted CI, and separate merge/adoption/live-data receipts.
  note: |
    Research: https://dora.dev/guides/dora-metrics/ requires speed and quality in context rather
    than a volume target. https://docs.github.com/en/rest/checks/runs and
    https://docs.github.com/en/rest/pulls/pulls distinguish current commit checks, attempts and
    paginated PR history; those API clocks must not be replaced with application discovery time.
