      proof: "unit test: test/a-recon-cannot-propose-its-own-task.test.ts"
    - claim: "the refusal holds with no merged-state read available at all, so it covers the still-queued originating task the merged-signal retirement cannot reach"
      proof: "unit test: test/a-recon-cannot-propose-its-own-task.test.ts"

