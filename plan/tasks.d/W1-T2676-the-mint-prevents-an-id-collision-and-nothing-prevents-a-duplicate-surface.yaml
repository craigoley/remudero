    - claim: "the finding is a warning rather than a refusal, so a legitimate overlap is not blocked"
      proof: "unit test: test/the-mint-prevents-an-id-collision-and-nothing-prevents-a-duplicate-surface.test.ts"
    - claim: "a shard whose files overlap nothing is never reported, so the check is not vacuous"
      proof: "unit test: test/the-mint-prevents-an-id-collision-and-nothing-prevents-a-duplicate-surface.test.ts"
    - claim: "a shard already credited as merged is not counted as a duplicate of live work"
