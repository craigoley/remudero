- id: W1-T9043
  title: "AN ESCALATED MACHINE FILING NOBODY ANSWERS IS RESURFACED, THEN RETIRED — never left parked forever: 27 gardener filings sat 1-11 days with no aging, only the first 5 ids shown under NEEDS ME, and machine records excluded from the verify-human age bands"
  repo: remudero
  depends_on: [W1-T8830, W1-T9042]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 12.00
  risk: high  # Rule 19: one concern — what happens to a machine filing a person never rules on
  band_meaning: blast-radius
  origin: "operator session 2026-10-13: gardener loop audit; operator ruling the same day (silence: re-judge, then retire; silence never approves)"
  plan_refs: [W1-T8830, W1-T8829, W1-T8868]
  files: [src/lib/machine-filing-judge.ts, src/lib/status-board.ts, src/run-task.ts, test/an-unanswered-machine-filing-is-resurfaced-then-retired.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    MEASURED 2026-10-13: 27 machine-filed tasks are escalated to a person. The oldest (W1-T5309) was judged on 2026-10-02.
    VERIFIED on origin/main:
    - `machineJudgeProposal` stages ONE inbox proposal per record, deduplicated by id.
    - `deriveNeedsMe` (src/lib/status-board.ts) shows a count and the first 5 ids.
    - `Proposal` carries no timestamp.
    - `parkedVerifyHumanShards` (src/run-task.ts) excludes `author_class: machine`, so the 14/30/60-day verify-human re-asks
      (measurement-cadence.ts `VERIFY_HUMAN_AGE_BANDS`) never reach these records.
    W1-T8830 (queued) re-judges a parked record when its evidence moves, on a learned backing-off cadence. It does not
    say what a person sees, or what happens when nobody ever answers.
    OPERATOR RULING 2026-10-13: an unanswered escalation is re-judged with fresh evidence and resurfaced in ONE rolled-up
    digest. After 30 days with no operator ruling it is RETIRED, so its gardener re-files the cause from fresh evidence if
    it still costs. Silence NEVER approves or releases.
  design: |
    1. Every W1-T8830 re-ask that keeps `escalate` rolls the record into one NEEDS ME digest entry: count, ids, age since
       first escalation, family, priced cost. `deriveNeedsMe` lists every held machine record grouped by family, not only
       the first 5.
    2. `parkedVerifyHumanShards` admits machine records into the age bands, so they appear in the same re-ask cadence a
       person already reads.
    3. After 30 days escalated with no operator ruling, the judge retires the record in its own judge PR. The record
       becomes `status: blocked`, `retirement: withdrawn`, with a note naming the 2026-10-13 ruling. A ruling is
       `rmd approve`, `rmd release`, an operator edit to the record, or an operator note.
       Never delete the record: a landed receipt with no record holds a ci-friction cause forever (`ciFrictionCauseState`).
    4. Every resurfacing and retirement is ledgered with the record's age and the band that fired.
  acceptance:
    - claim: "every machine filing held for a person appears in one rolled-up NEEDS ME digest with its age"
      proof: "grep: test(\"W1-T9043: every machine filing held for a person appears in one rolled-up NEEDS ME digest with its age\" in test/an-unanswered-machine-filing-is-resurfaced-then-retired.test.ts"
    - claim: "an escalation unanswered for 30 days is retired, never released or approved"
      proof: "grep: test(\"W1-T9043: an escalation unanswered for 30 days is retired, never released\" in test/an-unanswered-machine-filing-is-resurfaced-then-retired.test.ts"
    - claim: "an operator ruling inside the window stops the retirement"
      proof: "grep: test(\"W1-T9043: an operator ruling inside the window stops the retirement\" in test/an-unanswered-machine-filing-is-resurfaced-then-retired.test.ts"
  falsifier: |
    Park three escalated machine records aged 2, 12 and 31 days with no operator ruling. At origin/main NEEDS ME shows a
    bare count and nothing ever changes. With the change, all three appear in one digest entry with their ages, and the
    31-day record is withdrawn in a judge PR while the other two stay parked.
