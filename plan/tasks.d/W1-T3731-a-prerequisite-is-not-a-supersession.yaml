- id: W1-T3731
  title: "THE SWEEP CLOSED A COMPLETE IMPLEMENTATION AS SUPERSEDED BY ITS OWN PREREQUISITE — `supersededBy` is 'the highest-numbered open peer sharing a task', and the `complementary` arm that exists to stop it only knows the rule-15 split, not the rule-25 one it ALSO forces"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  rationale: |
    MEASURED 2026-09-17, and recovered by hand.

      #5861  feat(cli): add rmd board to survey open pull requests across the fleet
             12 files: src/lib/pr-board.ts, src/run-task.ts, src/lib/config-schema.ts,
             3 test files, 2 docs, 4 baselines.  CLOSED 10:56 UTC.
             "Closed by rmd sweep: superseded-by #5886"
             Every check green at the moment of closing EXCEPT remudero-review, still PENDING.

      #5886  feat(console-parity): pre-register the board verb's cli-only reason
             2 files: scripts/console-parity-baseline.json, console-parity-ratchet.mjs
             Opened 10:51 UTC — FIVE MINUTES EARLIER. Its own body: "The src/lib/config-schema.ts,
             src/lib/pr-board.ts, and src/run-task.ts changes STAY WITH THE ORIGINAL PR (#5861)."

    #5886's two files are a SUBSET of #5861's twelve. The prerequisite closed the work.

    (1) THE ARITHMETIC IS "HIGHER NUMBER WINS" AND NOTHING ELSE. `run-task.ts:31278`: "supersededBy:
        the HIGHEST-numbered other open PR crediting the same task." Both PRs carried
        `Remudero-Task: W1-T3685`; #5886 was opened later; the sweep's `stale` row closed #5861
        (sweep.ts:5191-5194).

    (2) THE GUARD EXISTS AND DOES NOT COVER THIS SPLIT. `hydrateSupersessionVerdicts`
        (open-prs-rest.ts:1097) already refuses to let one stage erase another — but only for
        W1-T2779's shape: "one side wholly in plan scope while the other holds non-plan work". Here
        BOTH sides are non-plan (`scripts/**` against `src/**`), so the arm never fires.

    (3) THE SPLIT THE GUARD MISSES IS ONE THIS REPO MANDATES. Standing rule 25 (W1-T297) refuses a
        measurement-instrument path riding with a `src/` product path, and the `blocked_review` fix
        rung says so in as many words (prompt-render.ts:777). #5886 EXISTS because rule 25 demanded
        it. So the fleet instructs a worker to split, and then closes the half with the work in it.

    (4) THIS IS THE FOURTH RECORDED INSTANCE OF THE SAME ARITHMETIC. W1-T3535's own comment:
        "#5411 closed by #5412 (2026-09-13) and again on 2026-09-15, when #5632 — a /v1/status
        change sharing NOT ONE changed path — closed #5630 and #5631. The two gates contradicted
        each other: one mandates the name, the other punishes it." That task narrowed ONE symptom
        (the `unfiled` branch sentinel). The rule now bites through the trailer instead.

    (5) WHAT IT COSTS. #5861 was one pending review away from merging. Its branch survived, so this
        one was recoverable by reopening; nothing in the system noticed, and nothing would have.
        `authority.ts:248` grants `sweep-close-superseded-pr` the authority to close an unmerged PR
        on this verdict — the most destructive act the sweep can take, on the weakest evidence it
        holds.
  design: |
    READ THE PRODUCER BEFORE WRITING THE FIX — and it changes the fix. `fetchSupersessionVerdict`
    (open-prs-rest.ts) ALREADY answers this case correctly: #5861 shares 2 of its 12 changed paths
    with #5886, which is a partial overlap, and it returns `"indeterminate"` with the detail "a
    partial overlap supports neither finding". The producer was right. The DISPOSITION closed the
    PR anyway:

      sweep.ts:5191   when: (pr, policy) =>
                        pr.supersededBy != null &&
                        pr.supersessionVerdict?.status !== "complementary" &&
                        !(policy.conceptCoexistenceEnabled === true &&
                          pr.supersessionVerdict?.status === "unique"),

    So the row closes on the BARE ARITHMETIC and consults the verdict only to carve two exceptions
    out of it — one of which needs a policy flag that is OFF by default.

    (i) INVERT IT: CLOSE ONLY ON POSITIVE EVIDENCE. The row requires
        `supersessionVerdict?.status === "superseded"` — the verdict that means every one of this
        PR's changed paths is also changed by the newer one. Everything else — `indeterminate`,
        `unique`, `complementary`, or no verdict at all — leaves the PR open. This is the most
        destructive act the sweep can take (`authority.ts:248`), and it should need the strongest
        evidence the system holds, not the weakest.

    (ii) `unique` STOPS NEEDING A FLAG, which is the case W1-T3535 already recorded and could not
         close: "#5632 — a /v1/status change sharing NOT ONE changed path — closed #5630 and
         #5631." Sharing no path is the strongest possible evidence of NOT being superseded, and it
         was gated behind `conceptCoexistenceEnabled`, off by default. `policy` keeps the flag; it
         simply stops being what stands between a PR and deletion.

    (iii) THIS COVERS THE RULE-25 SPLIT WITHOUT NAMING IT, which is why it is the right altitude. A
          split that still shares the instrument files reads `indeterminate` (the #5861 shape); a
          split done properly, with the instrument files REMOVED from the product PR, reads
          `unique` — and today that one closes too, which would punish the correct split harder
          than the incomplete one. Both stay open here, and so does every future shape, without a
          predicate per incident.

    (iv) A GENUINE DUPLICATE IS STILL CLOSED. `superseded` is unchanged and still fires: every
         changed path also changed by the newer PR. That is the case the row exists for and it is
         not weakened by one PR.

    NOT IN SCOPE: `fetchSupersessionVerdict` itself, which was already correct here, and the
    separate `supersessionDisposalEnabled` row at sweep.ts:5121.
  acceptance:
    - claim: "a pull request is closed as superseded only on a verdict that positively found it superseded, never on the bare higher-number arithmetic"
      proof: "unit test: only a positive superseded verdict closes a pull request"
    - claim: "a verdict that could not decide leaves the pull request open, because the most destructive act needs the strongest evidence"
      proof: "unit test: an indeterminate verdict never closes"
    - claim: "a pull request sharing no changed path with its supposed superseder is left open without needing a policy flag"
      proof: "unit test: a unique verdict never closes without a flag"
    - claim: "a genuine duplicate, every changed path of which the newer pull request also changes, is still closed"
      proof: "unit test: a genuine duplicate is still closed"
  falsifier: |
    Keep the bare-arithmetic clause and merely ADD `indeterminate` to the exception list and the
    first assertion goes red — the row would still close a PR carrying NO verdict at all, which is
    what a failed hydration produces and is the fail-open direction that matters. Drop the
    `superseded` arm entirely and the fourth goes red: a real duplicate must still be closed or
    this is not a fix, it is a disabling. Leave `unique` behind `conceptCoexistenceEnabled` and the
    third goes red, which is the case W1-T3535 already measured twice.
