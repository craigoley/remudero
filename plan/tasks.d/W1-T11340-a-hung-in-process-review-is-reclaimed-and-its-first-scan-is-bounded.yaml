- id: W1-T11340
  title: "A first review's prior-verdict lookup reads only the ledger archives that rotated since its PR opened, and a stale pending held by an in-process review past its ceiling is aborted and re-admitted instead of standing down as already in flight, so a plan PR's review cannot hang for hours and escalate as a stage-stall"
