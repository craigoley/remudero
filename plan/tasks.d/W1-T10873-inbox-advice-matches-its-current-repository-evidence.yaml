  rationale: |
    A signed-in Core-to-Console header switch retained the Inbox route and selected Console correctly.
    Its stale read-only Console snapshot nevertheless showed verify-human:W1-T1015 with obsolete=true
    advice citing PR6377 and e8ee75935bb9fb16e3f05088de4d610ae7710543. GraphQL verified that PR and
    commit in Core, while Console returned NOT_FOUND. Both the179-task mounted Console plan and the
    actual216-task daemon plan contain only remudero-console tasks and do not declare W1-T1015.
    Distinct stable Console proposal and recommendation files actually contain that foreign task;
    this is not merely a renderer URL or inode-alias theory. Real Git resolved all three evidence
    forms in Core and none in Console, with positive shard inventories on both sides.
    At audited main aa90fdc4405e9e537ef04c80f58eebe566e3a0d9, daemon.ts wires the recommendation
    evidence and seed through code repoRoot instead of its already selected targetCheckoutRoot.
    The live non-self daemon process separately has the Core code checkout as its cwd. The reader
    recommendationFor compares sourceFingerprint against stored.shardBlob, not independently read
    current repository/task evidence, and served the observed cached advice in the default helper.
    This establishes two concrete source boundaries; it does not prove all timeouts, stale plans,
    foreign proposals or readiness deficits share that cause. The mounted-checkout repair remains
    with ops, and CI infrastructure plus Azure memory remain with their owners.
    Before reserving, every one of17 API-open immutable heads was compared against its merge base
    with main; all had positive subject controls and none changed this subject or four source paths.
    W1-T8950 already promises current task-blob advice, but its implemented reader self-checks the cache.
  design: |
    Generation uses the selected target repository for Git evidence, plan layout and seed reads.
    Use the already resolved target checkout and repository identity, retaining correct self-target
    behavior, the existing paced writer and configured provider. Do not repoint a registry or mount,
    rewrite a global seed, change cadence or induce a new live model/gardener pass as test evidence.
    Capture a fixed verified main commit before reading its tree, task text, history and cited evidence;
    do not mix multiple mutable origin/main reads into one recommendation. Recheck the selected source
    before storing or publishing, and explicitly refuse incomplete, changed or foreign source evidence.
    Cached advice requires independent current repository and task evidence from one captured pass.
    A stored fingerprint and its own stored blob cannot certify one another. Qualify task references
    using the selected repository's actual current task record, including monolith tasks; absent,
    changed, malformed, foreign or unavailable source evidence omits advice and its route. A legacy
    unproven entry must not acquire a repository just because that is what the user currently selected.
    Correct current advice, self-target behavior and non-task recommendations retain their meaning
    when their actual selected-repository source is qualified. Preserve raw historical records,
    proposals, threads, operator decisions, genuine asks and existing action/server permission checks.
    All cached Inbox projections use the same independently qualified captured evidence.
    Carry qualification through existing InboxStores and the persisted classification, then use it
    in legacy, materialized and continuation pages, including set-aside views. HTTP reads perform no
    Git, whole-ledger scan, model call or recommendation-store mutation. On failure preserve prior
    historical evidence explicitly rather than present it as current advice or fabricate a safe zero.
    Extend only the three existing physical suites. Drive the real daemon constructor far enough to
    exercise the actual non-self recommendation reader/seed ports; use two real temporary Git repos
    with distinct task blobs and citations and a positive self-target control. Isolate fixture config
    without assigning HOME or another common system option. New imports use package aliases and root
    helpers. Exercise the actual cached producer-to-legacy/materialized/page path, not only pure helpers
    or source-text greps. Include same task IDs in two repos, a moved task blob with unchanged summary,
    a missing/unknown source, legacy unqualified entries, monolith and non-task controls, valid matching
    advice, source drift during generation and unreadable evidence. Preserve existing assertion coverage.
    Both source-boundary regressions must fail with their own correction removed and pass restored.
    Qualify source-positive coverage, canonical stored acceptance, census, native author, governed
    semantic review, every hosted security/test check and protected merge. Filing records no risk
    verdict; only an actual native judge or operator ruling may release the machine-authored task.
    No automatic Inbox decisions, archive/readmark cleanup, captured-reply replay, provider or budget
    setting, permission, service/restart/deployment, guard, CI or Azure-memory policy change is included.
