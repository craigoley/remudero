- id: W1-T8136
  title: "A RECYCLE PAUSE ADMITS NO NEW REVIEW WORKER — the review-only light pass and the pause review clock admit reviews under EVERY PAUSE, so a recycle's drain waited on reviews admitted after it began (8 admitted 16:16-17:08Z on 2026-10-11; one, admitted 16 s before the refusal, was counted as a blocker)"
  repo: remudero
  depends_on: [W1-T8133]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: high  # Rule 19: one concern — work admitted after a recycle PAUSE never extends that recycle's drain
  band_meaning: span
  origin: "operator approval 2026-10-11: follow-ups from the recycle-stall fix (hand PR #10925)"
  plan_refs: [W1-T5804, W1-T5343, W1-T4429, W1-T4191, W1-T5127, W1-T8088]
  files: [src/lib/daemon.ts, test/a-recycle-pause-admits-no-new-review-worker.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED in the core daemon's live ledger (fleet host, read-only, 2026-10-11). A recycle PAUSE held from about
    16:16Z until the `deploy.restart_refused` row at 17:08:02Z. Between 16:16Z and 17:08Z the ledger holds 8
    `sweep.review_admitted`, 2 `sweep.review_started`, 15 `daemon.sweep_light.review_only` and 2
    `daemon.review_clock.pass` rows. The refusal listed a codex review of #10919 that was 5 s old (pids 173795 and
    173802) as an in-flight lane-less worker.
    READ on origin/main 5d117761b, src/lib/daemon.ts:
      - The FULL pass under a recycle PAUSE already closes review admission. W1-T5804 runs it with
        `recyclePause` (:2375), and its `continueReviewAdmissions` gate is false while checkPause is set (:2398).
      - The light pass does not. Under any PAUSE (`lightHalt`, :2274-2306) W1-T5343 runs ONE review-only pass while
        a lane is in flight (`daemon.sweep_light.review_only`). Its own comment says why it stops when the lanes
        drain: "one admitted after the lanes drain could stretch a recycle's wait". But while a slow lane is still
        in flight, each review it admits is a new worker the recycle must also wait for.
      - The pause review clock (startInterphaseReviewClock with scope "pause", started at :4282) skips the PAUSE
        check by design (:1777, `scope === "pause" ? undefined : deps.checkPause?.()`), so it too admits reviews
        under a recycle PAUSE.
    The two paths exist for a reason that still holds for an OPERATOR pause: 11 dispatch-phase pauses once held
    about 210 min with 0 reviews (W1-T5343). A recycle PAUSE is different. It exists only to drain, and it ends in
    a swap or a refusal, after which reviews run again.
  design: |
    DECIDED: a recycle drain admits no new review workers. The alternative (the recycle stops counting reviews
    admitted after its PAUSE began) is rejected. The recycle would then remove the container under a live review,
    losing its spend and leaving a dead owner's pending claim (the W1-T8088 class). And the host script has no
    admission time to tell those reviews apart without a ledger join it does not have.
    1. Under a PAUSE whose detail isRecyclePauseDetail accepts (the same reader W1-T5804 uses), the W1-T5343
       review-only light pass does not run. Log `daemon.sweep_light.held` with reason `recycle_pause`, so "nothing
       ran" keeps one meaning.
    2. The pause review clock passes the same predicate. Under a recycle PAUSE it runs no pass that can ADMIT a
       review worker. If the light pass can be split into admit and non-admit parts without a new mode, keep the
       non-admitting part (posting finished reviews' verdicts). Otherwise skip the pass and log why.
    3. Every other PAUSE reason keeps W1-T5343 and W1-T4429 exactly as they are.
    4. Reviews already in flight when the PAUSE begins are untouched. The drain still waits for them.
    5. When the recycle's PAUSE clears (a swap, or a refusal that removes its own PAUSE), admission resumes on the
       next pass with no extra state.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive runDaemon with injected checkPause,
    sweepLight and clock, as test/a-recycle-pause-holds-dispatch-not-merges.test.ts does: one lane in flight, a
    recycle PAUSE detail, and a sweepLight fake that records the reviewOnly passes it is asked to run.
  acceptance:
    - claim: "the new test file passes"
      proof: "unit test: test/a-recycle-pause-admits-no-new-review-worker.test.ts"
    - claim: "under a recycle PAUSE with a lane in flight the light pass runs no review-only pass and logs the hold"
      proof: 'grep: test("W1-T8136: a recycle pause runs no review-only light pass" in test/a-recycle-pause-admits-no-new-review-worker.test.ts'
    - claim: "the pause review clock admits no review worker under a recycle PAUSE"
      proof: 'grep: test("W1-T8136: the pause review clock admits no review under a recycle pause" in test/a-recycle-pause-admits-no-new-review-worker.test.ts'
    - claim: "an operator PAUSE still runs the review-only pass while a lane is in flight"
      proof: 'grep: test("W1-T8136: an operator pause still runs the review-only pass" in test/a-recycle-pause-admits-no-new-review-worker.test.ts'
    - claim: "reviews are admitted again once the recycle PAUSE clears"
      proof: 'grep: test("W1-T8136: reviews resume once the recycle pause clears" in test/a-recycle-pause-admits-no-new-review-worker.test.ts'
  falsifier: |
    Leave both paths as they are on main: under the recycle PAUSE the first test sees a reviewOnly sweepLight call,
    and the second sees the pause clock run one. Gate on any PAUSE instead of the recycle reason: the operator-pause
    test sees no review-only pass.
