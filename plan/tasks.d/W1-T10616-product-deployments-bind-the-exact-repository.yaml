  rationale: The operator authorized implementation, task filing and guarded Remudero builds of the Console new-product flow and mobile-first Central Park prototype, using existing public craigoley/wreckterra. Source/main and every open PR head were swept for subject overlap; no competing product-flow implementation was observed. Existing auth, nonce, admission, review and resource guards remain required. Hosted PR14208 proved every new served product operation also needs its public contract and actual route-wiring evidence. W1-T10572 shares only the contract and generated client files for an unrelated gardener description; this task adds the named product operation, and does not supersede that Analytics work.
  design: Inspect/adopt an existing Vercel project or create the authorized product project in the established team using server-held credentials and explicit repo binding. Persist operation/digest/provider IDs and reconcile lost responses before another mutation. Enforce existing resource limits and no domain purchase, transfer, DNS change, new paid service or plan upgrade. Domain/name availability is dated discovery, not reservation. Verify project GitHub identity on readback; source SHA, deployment status, served route and physical-device playthrough remain independent evidence fields. Future catalog target is cao825/oley-arcade; do not edit it before a verified playable deployment. Mount buildProductDeploymentRoutes from the existing serve composition; the route builder delegates to the named product operation rather than a test-only seam. For every newly served product operation, declare the authenticated route plus bounded request, response and explicit failure schemas in openapi/daemon.yaml, then regenerate packages/api-client/src/schema.d.ts through the maintained generator. Exercise the assembled HTTP operation with the real default transport and verified-actor guard in the existing test/console-api/serve/product-routes.test.ts, and register that actual proof in test/route-wiring.test.ts. No contract baseline, wiring-debt entry, host-capability waiver, or client-granted verification substitutes for those proofs.
