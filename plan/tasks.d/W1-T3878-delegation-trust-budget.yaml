- id: W1-T3878
  title: "GIVE EVERY DELEGATION A TRUST BUDGET — versioned scope, autonomy, approval, expiry, and human handoff profile"
  repo: remudero
  depends_on: ["W1-T3855", "W1-T3856"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 80.00
  risk: high
  band_meaning: blast-radius
