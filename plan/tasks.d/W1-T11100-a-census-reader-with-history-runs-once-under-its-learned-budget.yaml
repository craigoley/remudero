  rationale: |
    MEASURED 2026-11-02 over 12 author preflight receipts (progress.json under each worktree's coverage/rmd-author-*):
    - Wall time per run 45-90 min. census-precheck alone took 536-2,336 s, static-preflight 828-3,120 s, the affected subset 699-937 s.
    - The same census step took 536 s on 2026-10-30 and 2,336 s on 2026-11-02 at load average 34-47 on 8 cores: three author preflights and the fleet ran at once.
    MEASURED 2026-11-03 on the Mac, four full rmd preflight runs (476-535 s each):
    - census-precheck took 344-399 s (about 72%), rule-checks 90-134 s, and the other 26 steps about 30 s together.
    - One profiled census-precheck (422 s, 63 suites): calibration 222 s (53%), qualification 181 s. Suites run one after another, each twice.
    AMENDED 2026-11-03 (operator session, before any build): a history budget, not a context cache.
    - censusReaderContext hashes the whole tree (HEAD, the staged file list, the diff, untracked files, dependencies, loader, runtime). So a context-keyed cache, as first filed, hits only when the same tree is re-run, and never across commits.
    - Calibration (#12600) exists to price the qualification run's timeout from the reader's own runtime, replacing a fixed 2 s bound healthy readers exceeded.
    - Calibrating on the same tree cannot catch a diff that makes a reader slow: both runs are slow, and the second fits a budget priced from the first. A budget from the reader's history across commits can catch it.
    - So the budget's source becomes the reader's measured history, keyed by test file and runtime fingerprint. One run replaces two when history exists. No history, a corrupt history, or an overrun falls back to today's path, so the gate is never stricter than today and never skips an assertion.
    Operator ruling 2026-11-03 (in chat, "go with all of your recommendations"): shadow first with about a 48-hour window, then switch on the operator's yes, against the measured agreement. No fixed agreement bar: the report gives the agreement rate, the disagreeing readers and the saved hours, and the operator decides.
  design: |
    1. History: an account-owned file (beside the census snapshot cache, mode 0600, written by atomic rename) maps "<test file>|<node version>|<platform>|<arch>|<cores>" to that reader's newest measured qualification runtimes. Each accepted census-reader-runtime appends its measuredMs, and the list keeps only the newest N (N a named constant, the window the median is taken over). An unreadable or corrupt file reads as empty and is rewritten on the next accepted measurement.
    2. Shadow (the default): unchanged calibrate-then-qualify. When the reader has history, also compute historyBudgetMs = censusReaderBudget's rule over the floored median of that history, and print census-reader-history-shadow: {file, historyRuns, historyBudgetMs, qualificationMs, wouldFit, wouldSaveMs: calibration's elapsed}. With no history, print the line with reason "no history".
    3. Act (RMD_CENSUS_READER_HISTORY=act, only after the operator's yes): with history, run once under historyBudgetMs, and qualify that single run with the same inventory, completeness and pass checks. An overrun falls back to the full calibrate-then-qualify path, whose verdict stands.
    4. Promotion is a separate operator-approved change. After about 48 h of shadow lines from author preflights and pre-open gates, report the share of readers with history, the wouldFit agreement rate and the disagreeing readers by file, and the would-save hours.
