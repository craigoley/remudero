  design: |
    1. THE SHAPE. src/lib/proof-amendment.ts exports a pure `isCatalogTokenInsertion(diffText, isTrackedPath)`. It is
       true only when every hunk of the worker's diff of one file does one of two things:
       - adds whole lines, each holding exactly one path token (a YAML `- path` or `- "path"` item, or a bare token
         with an optional trailing `,` or `\`);
       - replaces lines whose whitespace-split tokens equal the new lines' tokens with some tokens removed.
       In both cases every inserted token must be a tracked path in the worker's tree. A removed or reordered token,
       any other changed byte, a rename or a mode change makes it false.
    2. THE REQUEST. `ScopeAmendmentRequest` gains an optional `instrumentDiffs: Record<path, diffText>`. The fix
       rung's `amendScope` (src/run-task.ts) fills it, for each requested path INSTRUMENT_SURFACE matches, from
       `git diff <roundStartSha or merge base> -- <path>` in the round's worktree. An unreadable diff leaves the
       entry absent.
    3. THE ARM. `requestScopeAmendment` refuses an instrument path as today unless all three hold:
       - the path is under `.github/workflows/`;
       - its `instrumentDiffs` entry is present;
       - `isCatalogTokenInsertion` is true for it.
       Every other INSTRUMENT_SURFACE path (ratchets, baselines, review.ts, gate scripts) is refused unchanged.
    4. THE AMENDMENT SAYS SO. The amendment PR body names each catalog-entry instrument path and the tokens it
       inserts, so the plan review and the risk judge see the instrument widening.
    5. Tests (new file, `test(` titles verbatim as in the proofs below):
       - #12289's acr-build.yml diff (the two hunks of 3d24f75dd as fixture text) on a task whose files lack it:
         the amendment is created, and its body names the inserted token;
       - a workflow diff that also changes a `run:` command, or removes a path token, is refused `instrument-path`;
       - a `scripts/*-ratchet.mjs` or `scripts/*-baseline.json` path is refused even as a token insertion;
       - a workflow path with no diff entry is refused (positive control for today's behaviour).
