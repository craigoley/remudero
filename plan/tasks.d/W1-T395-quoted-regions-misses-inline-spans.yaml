- id: W1-T395
  title: "`noClaimIsAboutChangeset`'s forward anchor is defeated by ANY closing delimiter — a `no <path>` claim followed by a backtick, paren or quote takes the \"the token IS the claim\" branch and fires, while the identical claim followed by an ordinary word is correctly suppressed, so the absence arm's behaviour turns on punctuation rather than meaning"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: "RE-SCOPED 2026-08-07 ON AN OPERATOR RULING. The original filing proposed extending
    `stripQuotedRegions` to inline backtick spans. THAT IS WITHDRAWN — see the ruling below — and
    what remains is a narrower, sharper defect measured at 3c63dd9 while re-deriving the withdrawal.
    THE RULING, AND ITS REASONING, RECORDED SO IT IS NOT RE-ARGUED. `stripQuotedRegions`'s own doc
    forbids the widening in as many words: it is DELIBERATELY NARROW, only blockquote lines and
    fences, because widening the exclusion to inline code spans would let a real contradiction hide
    behind a single backtick — strictly worse than today's over-firing. The operator ruled to keep
    the current behaviour: A FALSE FAILURE COSTS A REDRAFT; A FALSE PASS MERGES A BODY THAT LIES
    ABOUT ITS OWN DIFF. The two error costs are not symmetric and the checker is tuned accordingly.
    THE ORIGINAL FILING CITED THE WRONG DOC AS ITS AUTHORITY, which is why the conflict was not
    caught at filing. It justified the widening with `bodyContradictsDiff`'s contract that anything
    the checker cannot decide is silence rather than a verdict. That is a DIFFERENT FUNCTION'S doc.
    The function actually being changed carries the prohibition, and it governs.
    THE REGRESSION IS MEASURED, NOT PREDICTED. Simulating the proposed strip against the real
    predicate: a body reading `this pull request changes` followed by a backticked count that
    contradicts its diff FIRES today and goes SILENT after the strip. That is exactly the hole the
    prohibition names. The strip also cannot tell that case apart from a legitimate CITATION — both
    go silent — which is why no amount of care inside the strip resolves it.
    WHAT ACTUALLY SURVIVES, AND IT IS NOT A MARKUP PROBLEM. Re-deriving the third reported symptom
    against `noClaimIsAboutChangeset` and its caller (the `no <path>` arm of `bodyContradictsDiff`)
    showed the trigger is not backticks at all — it is ANY CLOSING DELIMITER. Measured, one variable
    moved, same diff of one src file: a claim followed by a backtick FIRES, by a paren FIRES, by a
    double quote FIRES, and the identical claim followed by an ordinary word is SILENT. The anchor
    is documented to look forward for the next word token and return true when it finds punctuation,
    end of line or end of input — on the reading that the token IS the claim. A closing delimiter
    hits that branch, so the anchor never evaluates and the claim is admitted unanchored.
    THE ANCHOR IS OTHERWISE CORRECT AND MUST NOT BE WEAKENED. The same claim followed by a genuine
    changeset word FIRES, correctly. And the sibling count arm correctly ignores a count about
    something other than files — a body stating it adds exactly one filed task stays silent. The
    defect is only that a delimiter is read as the end of the sentence.
    DIRECTION OF THE FIX, WHICH IS THE SAFE ONE. Teaching the anchor to look past a closing
    delimiter makes the delimited forms behave like the bare form: SILENT where the sentence is not
    about the changeset. That REMOVES false failures and adds none, so it sits inside the ruling
    rather than against it, and it touches neither `stripQuotedRegions` nor what counts as quoted."
  design: |
    (i) DO NOT TOUCH `stripQuotedRegions`. Not as a simplification, not as a side effect, not to
    make a test easier to write. Its narrowness is a ruling, and this task exists in its current
    form because the previous scope contradicted it. The fix belongs entirely inside
    `noClaimIsAboutChangeset`.

    (ii) SKIP CLOSING DELIMITERS, NOT ALL PUNCTUATION. The anchor's "punctuation means the token IS
    the claim" branch is right for a sentence that genuinely ends — a full stop, a semicolon, end of
    input. It is wrong only for a CLOSING delimiter, which ends a span and not a sentence. Enumerate
    which characters qualify and say why each one is in or out; a blanket "skip all punctuation"
    would swallow the sentence-end case and turn a true positive into silence, which is the ruling's
    forbidden direction.

    (iii) BOTH DIRECTIONS, OR THE TEST PROVES NOTHING. A delimited claim in a sentence NOT about the
    changeset must go silent; a delimited claim in a sentence that IS about the changeset must still
    fire. One direction alone is satisfied by a predicate that never fires at all.

    (iv) THE OPENING DELIMITER IS A SEPARATE QUESTION — establish it, do not assume it. The measured
    cases all carry the delimiter AFTER the claim, because that is where the anchor looks. Whether an
    OPENING delimiter before the claim also matters is unmeasured here; check it and report, and if
    it does, say whether it belongs in this task or a follow-up.

    (v) PROVE THE COUNT ARM AND THE HOUSE-SHORTHAND ARMS ARE UNMOVED. `bodyContradictsDiff` has
    several arms and only the `no <path>` one consults this anchor. Assert the others produce
    identical verdicts on bodies with and without delimiters, so the change is scoped to the anchor
    rather than to the checker's general sensitivity.

    NOT IN SCOPE, AND EXPLICITLY SO: extending the quoted-region strip in any form; the plan-scope
    adjective's vocabulary collision (see the note — a separate concern, deliberately not filed);
    the enumeration-item punctuation cleanup; the acceptance-criteria parser.
  acceptance:
    - claim: "a no-path claim followed by a closing delimiter is judged by the same forward anchor as the bare form, so a sentence that is not about the changeset stays silent in both"
      proof: "unit test: test/review-absence-anchor-delimiter.test.ts"
    - claim: "a no-path claim in a sentence that IS about the changeset still fires whether or not a delimiter follows it, so the anchor is narrowed without being weakened"
      proof: "unit test: test/review-absence-anchor-delimiter.test.ts"
    - claim: "the count arm and the house-shorthand arms return identical verdicts before and after, so the change is confined to the absence anchor"
      proof: "unit test: test/review-absence-anchor-delimiter.test.ts"
