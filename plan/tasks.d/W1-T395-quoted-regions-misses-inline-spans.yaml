    RULE 25 CHECKED: files: contains no INSTRUMENT_SURFACE path.
    budget_usd 45, down from 55: the scope is one predicate rather than a strip plus a three-symptom
    survey, and two of those three symptoms are now resolved (one withdrawn, one moved out).
    THE SEPARATE CONCERN, RECORDED AND DELIBERATELY NOT FILED. The plan-scope adjective fires on a
    body ABOUT plan scoping whether the phrase is delimited or bare — measured both ways at 3c63dd9
    — so it is a VOCABULARY collision and no anchor change here reaches it. What it needs is a
