    W1-T9583 (#11885) fixed the lane's head NAMES (run-main-repair-*); it never touched who pushes.
  design: |
    - One predicate for both lanes: the spawn's harness owns git when the worker it ran was a harness-committed writer
      (codexHarnessCommits for the selected provider, or the result's harnessCommit present). Read it from the
      WorkerResult, not from the requested mount: the router picks the provider after the mount is resolved.
    - Prompts: mainRepairFixPrompt and alertFixPrompt take that ownership and, when the harness owns git, say "save
      your edits, run no git or gh command, write your prose (and bullets) into the body file" — the implement lane's
      harnessOwnsGit wording — instead of push/open lines. Claude-routed workers keep today's prompt byte-for-byte.
    - Dispatch: after a harness-owned round whose harnessCommit is committed, the dispatcher pushes the worktree's
      branch from the host (as the implement lane's harness-owned path does; never from the worker sandbox), confirms
      by ls-remote that the remote ref names the committed sha (publishAbandonedFixOwnerAhead's check), then opens over
      REST: main-repair through openCheckedMainRepairPr with the
      checked body file (known test files keep their dispatcher-rendered Acceptance block); alert-fix with a
      dispatcher-written body carrying origin alert#, the worker's Acceptance bullets checked like main-repair's, and
      the Remudero-Task trailer last. nothing-to-commit and refused write main-repair.no_change / a named refusal row
      instead of the generic no_pr.
    - A body still holding MAIN_REPAIR_PROSE_PLACEHOLDER when opened gets a dispatcher sentence naming the offending
      sha and the failing tests, so no PR opens with a placeholder line.
    - Unchanged: the codex sandbox (no git-dir write), the identity gates, the revert path, the round budget.
