    - claim: "a codex-routed alert-fix worker's harness commit is pushed and opened with origin alert# and the Remudero-Task trailer last"
      proof: "grep: W1-T9667: a harness-committed alert-fix round is pushed and opened by the dispatcher in test/a-codex-routed-repair-worker-commit-is-pushed-and-opened.test.ts"
