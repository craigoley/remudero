  rationale: |
    WHY: the operator asked on 2026-11-12 that field trials and benchmarks take in the new decision models. One model id now has two surfaces. The text surface is a Responses or chat reply with output text. The decisions surface is a reply that gives a probability for each declared option, with no output text, at a different price. If rmd keys state or figures by model id alone, the two surfaces mix.
    OBSERVED 2026-11-12 about 15:40Z by the operator session (handoff-decision-models.md, probe 2): the operator deployed gpt-6-luna on the East US resource under the deployment name gpt-6-luna. A Decisions request answered 200 and its reply named model "gpt-6-luna". The default eastus2 resource also has a deployment named gpt-6-luna (1,000K tokens per minute), which serves worker Responses traffic. So the deployment name and the served model are the same string on both surfaces.
    READ 2026-11-12 in the source at origin/main 920669542:
    - src/lib/worker-provider.ts:4015 `openWeightAbsentUntil` is keyed by the deployment name alone. :4018 `markOpenWeightDeploymentAbsent` sets it and :4033-4039 `openWeightDeploymentReady` reads it, and cash selection passes over a deployment that is not ready. The mark lasts 30 minutes (:4014).
    - :1021 the learned per-minute limit is already "Keyed by resolved endpoint AND deployment id" (:1043 `cashCapacityKey`). That key is right as it is: both surfaces of one deployment share its quota.
    - W1-T12413 (queued, filed in PR #18175) makes `sendCashRequest` mark a deployment absent on a 404 and refuse a deployment known absent. W1-T12416 sends each decision request through it, with the deployment gpt-6-luna on the East US endpoint. So a 404 from the East US Decisions deployment would take the eastus2 worker deployment out of the economy and balanced cash rows (.remudero/mounts.yaml:285-287 and :295-297) for 30 minutes, and a worker 404 would stop decision requests.
    - W1-T12414 criterion 6 keys every figure "by role and model id". W1-T12417 lets a role name a decision model or "any configured cash deployment" as its shadow. A role can therefore hold gpt-6-luna Decisions answers and gpt-6-luna generated answers, and they would pool.
    - src/lib/field-trials-flow.ts:72 FLOW_STEPS and :74 GUARDRAIL_STEPS do not hold decision.answered, so no Decisions row enters the snapshot today. src/lib/field-trials-cohorts.ts:113-116 keys a cohort by model with no surface. Criterion 6 keeps that true; W1-T12423 gives judge rows their own family, keyed by surface.
    - NAME CLASH: src/lib/shadow-judge.ts:43 already writes a field named `surface` that means the judge role (review, risk, verify-human). This task names the new field `model_surface` so the two never mix.
  design: |
    1. In src/lib/worker-provider.ts add `export type ModelSurface = "text" | "decisions"` and `openWeightAbsenceKey(deployment, surface)`. Key `openWeightAbsentUntil` by it. `markOpenWeightDeploymentAbsent`, `openWeightDeploymentKnownAbsent` and `openWeightDeploymentReady` take an optional surface whose default is `text`, so every current caller keeps its behaviour (criterion 3). `sendCashRequest` takes an optional `surface` and passes it to the mark and the check.
    2. In src/lib/decision-model.ts (W1-T12416) pass `surface: "decisions"` to `sendCashRequest`, and add `model_surface: "decisions"` to each decision.answered row.
    3. In src/lib/typed-answer-scores.ts (W1-T12414) give each recorded answer a `modelSurface`, and key every figure with `typedAnswerKey(role, model, modelSurface)`. A decision.answered row with no `model_surface` field reads as decisions by its step. In src/lib/judge-calibration.ts the reader maps each shadow row with `modelSurface: "text"`.
    4. Add a short section "Model surfaces" to docs/model-routing.md: the two surfaces, the rule that state and figures are keyed by model id and surface, and the rule that calibration and any stored threshold belong to one model on one surface.
    NOT IN SCOPE: the per-minute limit key (already right); the field-trials judge family (W1-T12423); the bake-off key (W1-T12422); any change to which model serves a request.
  falsifier: |
    Key the absence mark by the deployment name alone and criteria 1 and 2 must fail. Default a caller with no surface to decisions and criterion 3 must fail. Pool two surfaces of one model in the scorer and criterion 5 must fail. Add decision.answered to FLOW_STEPS and criterion 6 must fail. Restore and require all to pass.
