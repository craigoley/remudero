  falsifier: |
    THE COMPRESSION CLAIM IS THE ONE THAT CAN BE FAKED, SO MEASURE IT RATHER THAN ASSERTING IT. Run
    both ratchets before and after and report all four numbers. The CLAUDE.md delta must be zero or
    negative; a positive delta that still fits inside 845 bytes SATISFIES CI and FAILS THIS TASK,
    because §8A asks for a fold, not for headroom to be spent.

    EACH IN-PLACE CORRECTION MUST BE VERIFIED GONE, NOT JUST ADDED. A `grep:` proof can only assert
    presence, so the acceptance criteria above cannot catch a correction APPENDED beside the wrong
    sentence with the wrong sentence left standing. Check the negative direction by hand and report
    it: after the edit, `grep -arn -- "Report them as needing a proof kind the dialect lacks"
    learnings/architecture.yaml` reads 0, and the unqualified "can never stall the queue" wording is
    gone. Both read 1 at head today — that is the control proving the check can see them.

    EVERY ANCHOR IN THE ACCEPTANCE CRITERIA WAS VERIFIED TO READ ZERO AT HEAD 3bc1542 with the
    executor's own invocation (`grep -arn -- <pattern> <path>`), against a positive control that
    read 1 (`not_yet_built` in CLAUDE.md, `no-rewriting-proofs-on-verify-human` in
    learnings/architecture.yaml). So every one discriminates head from base and none can degrade to
    `executed_stale`.

    ONE HAZARD THE BUILD MUST NOT WALK INTO, because it would redden its own criteria: a
    `grep:` pattern must match text on ONE PHYSICAL LINE, and the learnings entries are YAML FOLDED
    SCALARS (`fact: >-`) that WRAP. An anchor phrase placed across a wrap reads 0 at head with no
    error. Two of the six anchors target `- id:` lines for exactly this reason; the third
    (`the linter still blocks`) is short enough to place inside one physical line, and the build
    must confirm it does before pushing rather than after.

    AND THE SCHEMA IS ENFORCED: `scripts/generate-learnings-index.mjs` throws on a missing required
    field and on a duplicate id across shards, so a malformed new entry fails loudly rather than
    landing. Regenerate the index and let `test/learnings-index.test.ts` confirm it is fresh.

    THE AMENDED HALF CARRIES THE SAME OBLIGATIONS, AND ONE MORE. Every anchor added by this
    amendment must be verified to read ZERO at head with the executor's own invocation before
    pushing, exactly as the original six were — and the three CLAUDE.md anchors must be verified to
    sit on ONE PHYSICAL LINE, because CLAUDE.md wraps its bullets at roughly 100 columns and an
    anchor placed across a wrap reads 0 with no error.

    THE NEGATIVE DIRECTION FOR (12) IS THE ONE THAT CAN BE FAKED. The rate-limit correction must
    REPLACE the claim that GraphQL is the budget that dies while REST stays healthy, not sit beside
    it. After the edit, a grep for the surviving old wording must read 0, and the `gh pr create`
    REST-bypass advice in that same bullet — which is still true and still useful — must read 1. A
    correction that deletes the useful half while fixing the wrong half is a regression this task
    would otherwise ship silently.

    AND THE CLAUDE.MD DELTA IS NOW THE BINDING CONSTRAINT, NOT A COURTESY: 604 bytes of headroom
    against five edits. Report the before and after byte count. A positive delta that still fits
    under the cap SATISFIES CI AND FAILS THIS TASK.
