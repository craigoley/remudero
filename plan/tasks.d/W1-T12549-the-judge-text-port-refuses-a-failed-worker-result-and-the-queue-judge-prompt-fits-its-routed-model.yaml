  acceptance:
    - claim: "issueRevalidationJudgeText throws a JudgeWorkerFailedError that names the result subtype when the worker result is an error (isError, apiError, or a subtype other than success). It still records the attempt's spend first"
      proof: "grep: W1-T12549 criterion 1 in test/gardeners/the-judge-text-port-refuses-a-failed-worker-result.test.ts"
    - claim: "invariant:a-failed-judge-result-is-not-an-answer — A successful worker result still returns its text unchanged, so the issue-revalidation garden keeps its verdicts. A failed one closes, comments on and converts no issue"
      kind: guard
      proof: "grep: W1-T12549 criterion 2 in test/gardeners/the-judge-text-port-refuses-a-failed-worker-result.test.ts"
    - claim: "When the judge's worker fails, the queue judge logs queue_judge.unavailable with the reason \"judge spawn failed: worker result failed (<subtype>)\", never \"malformed judge answer\" with answer_chars 0"
      proof: "grep: W1-T12549 criterion 3 in test/gardeners/the-judge-text-port-refuses-a-failed-worker-result.test.ts"
