      proof: "grep: W1-T12549 criterion 4 in test/gardeners/the-judge-text-port-refuses-a-failed-worker-result.test.ts"
    - claim: "The queue judge declares its prompt bound"
      proof: "grep: QUEUE_JUDGE_PROMPT_MAX_CHARS in src/lib/queue-judge-gardener.ts"
  rationale: |
    WHY: the queue judge has not re-ranked the queue since 2026-11-12 12:06Z. Every pass reads an empty answer and calls it malformed. The real cause is that the worker attempt failed, and the port hides that.
    OBSERVED in the 48 h ledger research (2026-11-11 21:45Z to 2026-11-13 21:45Z):
    - 29 `queue_judge.unavailable` rows with `shape: "not-json"` and `answer_chars: 0`, the first at 2026-11-12 12:06:30.763Z.
    - Each pass has one `issue_revalidation.attempt_spend` row for run `issue-revalidation-0-*` (the queue judge calls the port with issue number 0) on the cash route, at about $0.083 to $0.084 since 2026-11-12 12:06:30.762Z. Before that the same pass cost about $0.001 to $0.01.
    - The research read the worker results of these attempts as success false after about 2 s. The same route and mount serve the issue-revalidation garden, which got answers (202 of 204 attempts).
    READ 2026-11-13 at origin/main d41354cdd:
    - src/lib/issue-revalidation-garden.ts:996 `issueRevalidationJudgeText` spawns the judge (:997, :1036) and at :1083 returns `result.text` without reading `isError`, `apiError` or `subtype` (src/lib/worker.ts:279-330 `WorkerResult`).
    - src/run-task.ts:28318-28322 builds the port on `mounts.escalation_judge`; :28329-28336 `queueJudgeRunTaskPorts` gives the queue judge the same port with issue number 0.
    - src/lib/queue-judge-gardener.ts:762 asks the judge with `judgePrompt` (:638), which writes every evidence pack with no size bound. :763-765 report a thrown spawn as "judge spawn failed". :768-770 report an empty string as "malformed judge answer" with `answer_chars: answer.length`.
    RELATED: W1-T12513 (queued) names the queue judge's "malformed judge answer" failures as not in its scope; it fixes the review-replay sample. No queued task covers the port or the prompt size.
  design: |
    INVARIANT a-failed-judge-result-is-not-an-answer: a worker result that failed is never read as a judge answer, so no garden closes, comments on, converts or re-ranks anything on it.
    1. In src/lib/issue-revalidation-garden.ts, after the spend is recorded and before :1083, throw `JudgeWorkerFailedError` (exported) when `result.isError`, `result.apiError`, or `result.subtype !== "success"`. Its message is "worker result failed (<subtype>)".
    2. The queue judge's existing catch at :763 then logs "judge spawn failed: worker result failed (<subtype>)". In the issue-revalidation garden the throw leaves `judge` (src/lib/issue-revalidation-garden.ts:962-973) before it parses; the builder checks that a thrown judge closes, comments on and converts no issue, and makes it so if not.
    3. In src/lib/queue-judge-gardener.ts add `QUEUE_JUDGE_PROMPT_MAX_CHARS`. Size it from the measured prompt of the last good pass and state the number and its source in a comment. Build the prompt from the packs in priority order (lowest number first) and stop adding packs when the next would pass the bound. Log `queue_judge.packs_left_out` with the count. A left-out pack is not judged this pass.
    4. The test drives `queueJudgeGardenSpec` through a garden pass with the production `issueRevalidationJudgeText` and a fake `spawn` that returns a failed result.
    NOT IN SCOPE: the model route or mount; the cash provider's failure; the queue judge's scoring and bounds.
  falsifier: |
    Return the failed result's text again and criteria 1 and 3 must fail. Throw on a successful result and criterion 2 must fail. Remove the prompt bound and criterion 4 must fail. Restore and require all to pass.
  note: |
    Id reserved for run-unfiled-1794610450000 with ~/rmd-work/bin/reserve-id.sh. The fleet builds it.
    The success false reading of the worker results comes from the research brief; the ledger rows above show only the spend and the empty answer. The builder confirms the failed result's subtype from the worker's result row before sizing the bound.
