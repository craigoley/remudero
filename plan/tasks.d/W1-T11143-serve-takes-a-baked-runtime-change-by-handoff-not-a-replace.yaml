  title: "serve takes a change to its baked runtime source by an in-container handoff, not a container replace — serve's container was replaced 23 times in a week for 'serve image drift' on its 32 baked runtime source files (BAKED_RUNTIME_SOURCE_PATHS), and each replace is a console UI outage, while the supervisor's slot handoff already moves serving between generations without dropping the socket"
