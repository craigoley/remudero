  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, and `src/lib/review.ts`
    is the highest-consequence file this could touch.
    `verify: human` — design (ii) offers three incompatible fixes with different `files:`, and the
    ruling changes which. THE DECLARED `files:` ASSUME THE SPAWNER OPTION, because it is the only one
    that makes the reviewer and CI agree. IF THE RULING IS THE HARNESS OPTION, `files:` MUST BECOME
    `test/entrypoint-boot.test.ts` PLUS THE NEW SUITE; IF IT IS THE CONVENTION, IT MUST BECOME
    `CLAUDE.md` AND NO `src/` PATH AT ALL. Correct it BEFORE dispatch —
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) fails a declared-but-untouched path exactly as
    `scopeViolationFiles` fails an undeclared one, and this shard would otherwise ship a `files:` list
    that is wrong for two of three outcomes.
    `src/run-task.ts` IS NOT DECLARED and nothing here touches it (19,588 lines; naming it serialises
    this task against every other that does — W1-T471).
    THE PROOFS ARE PURE-PATH, AND THAT IS A CONCESSION THIS SHARD OWES THE READER RATHER THAN A
    PREFERENCE. Name-filtering them would be better ON THIS TASK OF ALL TASKS — rationale (5) is
    exactly the argument for it — and it was tried. IT CANNOT BE DONE IN A FILING. CLAUDE.md is
    explicit: the `test/foo.test.ts::title` form `satisfies rmd lint-plan but the executor feeds the
    whole string to --test-name-pattern and matches zero tests`, and a BARE title cannot be written
    for a suite that does not exist yet. MEASURED: the `::` form drew two fresh `proof-dialect`
    warnings here, and a warning on a CHANGED task blocks in CI's changed-tasks pass. SO THE
    CONVENTION OPTION IN DESIGN (ii) IS NOT AVAILABLE TO A FORWARD-REFERENCING SHARD TODAY — it can
    only be adopted by the IMPLEMENTING PR, once the suite exists. That is a real constraint on
    option three and the operator should weigh it: the convention fix cannot be self-applied at
    filing time.
    A NOTE FOR WHOEVER IMPLEMENTS THE SPAWNER OPTION: the fix is NOT `env: {}`. These proofs run
    `node --test` in a fresh worktree and shell out to `npm ci`, `grep` and a pinned Playwright CLI —
    all of which need `PATH` at minimum. An allowlist that omits it turns every proof into
    `exec_error`, which degrades to the keyword floor and would look like the gate quietly relaxing."
