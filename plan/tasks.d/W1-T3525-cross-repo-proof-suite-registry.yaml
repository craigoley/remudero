- id: W1-T3525
  title: "THE PROOF DIALECT'S SUITE ROOTS ARE A CLOSED TWO-ENTRY LIST HARDCODED IN src/lib/review.ts — W1-T3178 added `apps/dashboard` as a second root alongside `test/`, but a THIRD target under a DIFFERENT repo (remudero-site's own `tests/`, its own checkout-local pinned Vitest) cannot be named without becoming a THIRD hardcoded arm; key the set on the resolved canonical owner/repo instead so an unregistered target refuses rather than silently inheriting a runner"
  repo: remudero
  depends_on: ["W1-T3178"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 60.00
  files: [src/lib/review.ts, src/lib/ci-parity.ts, test/cross-repo-proof-suite-registry.test.ts]
  origin: "feedback#fb-1789304800826-670f46"
  plan_refs: ["W1-T3178", "W1-T1062", "W1-T3073", "W1-T72"]
  status: queued
  attempts: 0
  rationale: |
    W1-T3178 (queued, not yet merged — this task DEPENDS on it) teaches the dialect exactly two
    suite roots: `test/` under `node --test`, and the dashboard's own suite root under its own
    runner, both inside THIS repo (`remudero`). Neither arm is keyed on which repo owns the target
    being reviewed — there is one checkout, so today that key is implicit and always the same.

    remudero-site (a SEPARATE repo — DECISIONS.md "W12-T1: THE SITE IS A SEPARATE REPOSITORY")
    needs its own registered suite: a root `tests/` directory, a Vitest pinned to that OTHER
    checkout rather than this one, and NO forced config path override. A third hardcoded arm in
    `review.ts` repeats W1-T3178's mistake one root later. The set must instead be a REGISTRY keyed
    on the resolved canonical `owner/repo` (W1-T1062 already establishes owner-qualified target
    resolution elsewhere in this codebase; this task reuses that resolution rather than re-deriving
    a second parser), each entry declaring its suite root, its runner invocation, and whether a
    forced config path applies.

    THE UNREGISTERED CASE MUST REFUSE, NOT INHERIT. A target repo not present in the registry must
    be refused with the dialect's own explainer — exactly the shape W1-T3073 established for `::`
    and W1-T3178 for an unknown root — never silently fall through to `node --test` or to another
    registered repo's runner.

    VITEST'S EXIT-CODE TRAP IS LOAD-BEARING FOR THE BARE-TITLE ARM SPECIFICALLY. Vitest 5.0.0 exits
    0 when every selected test is SKIPPED, not merely when none match a name filter. A bare-title
    proof against a Vitest suite must not read that zero exit as a pass: it must classify
    all-selected-skipped as NO-MATCH (mirrors W1-T72's `nameFiltered` guard, which already treats an
    unmatched name as test theater for the `node --test` arm), a selected non-skipped leaf that
    fails as FAIL, and truncated output as INCONCLUSIVE rather than either. This is runner-specific
    parsing that the `node --test` arm does not need and must not gain.
  design: |
    (i) THE REGISTRY IS CLOSED AND DECLARED, keyed on resolved canonical `owner/repo`, never a
    wildcard or a repo-name-only match (W1-T1062's `isSelf` note: a name match under the wrong owner
    is not the same target). Each entry: suite root path, runner command, and forced-config-path
    flag (remudero-site's Vitest is checkout-local and pinned; no forced config path per this
    feedback's explicit instruction).
    (ii) `craigoley/remudero`'s `test/` (`node --test`) and dashboard (`apps/dashboard/src/`) entries
    from W1-T3178 are PRESERVED BYTE-FOR-BYTE — this task adds a third registry entry and a keying
    layer around the existing two arms, it does not re-derive their argv. A regression there
    re-grades every proof in the corpus, exactly as W1-T3178's own note warns.
    (iii) THE RESOLVED TARGET PROFILE THREADS THROUGH: parsing (`parseTestTarget`), lint
    (`lint-plan`'s proof check), candidate discovery, base-proof copy, and execution all consult the
    SAME resolved registry entry rather than each re-deriving repo identity independently — the
    exact 27-call-site fragmentation W1-T1062 measured for owner resolution must not be repeated
    here for suite resolution.
    (iv) NO PATH TRAVERSAL on the new root, inherited from the existing arms' `..` refusal, tested on
    the new root too.
    (v) THE VITEST ALL-SKIPPED CLASSIFICATION is added ONLY to the Vitest-runner arm(s); the
    `node --test` arm's parsing and escaping are unchanged.
  acceptance:
    - claim: "a proof naming a direct remudero-site tests/ file resolves to that suite under its own checkout-local pinned Vitest, with no forced config path"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "a bare-title Vitest proof whose title exactly matches a selected, non-skipped leaf test passes"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "a bare-title Vitest proof whose title matches nothing selected is classified no-match on a zero exit code, never read as a pass"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "a bare-title Vitest proof whose selected leaf test fails is classified fail"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "truncated Vitest output is classified inconclusive rather than pass or fail"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "a target repo absent from the registry is refused with the dialect's own explainer rather than inheriting test/'s or the dashboard's runner"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
    - claim: "the existing craigoley/remudero test/ node --test argv and the dashboard Vitest argv are byte-for-byte unchanged by the registry's introduction"
      proof: "unit test: test/cross-repo-proof-suite-registry.test.ts"
  falsifier: |
    CLOSE IF the dialect already keys suite resolution on resolved owner/repo rather than two
    hardcoded arms: `grep -n 'TEST_PATH_EXACT_RE\s*=' src/lib/review.ts` and
    `grep -n 'owner' src/lib/review.ts`. As of this filing neither W1-T3178's second root nor any
    owner-keyed registry has merged — `review.ts` has zero owner-aware suite resolution.
    DO NOT satisfy this by adding a THIRD hardcoded arm string-matched on a path prefix; that
    repeats W1-T3178's exact anti-pattern one repo later and does not refuse an unregistered target.
    DO NOT satisfy this by relaxing W1-T72's `nameFiltered` guard or by treating Vitest's all-skipped
    zero exit as a pass anywhere in the bare-title arm.
    DO NOT move remudero-site's tests under this repo's `test/` to dodge a second registry entry —
    the feedback explicitly asks for NO global tests/ root shared across repos.
  note: |
    Rule 25 CHECKED: `src/lib/review.ts` is the proof dialect itself; the byte-for-byte argv
    preservation claims exist precisely to bound that blast radius.
    THIS TASK DOES NOT COVER re-running semantic review on remudero-site PR #8 or asserting
    `remudero-review=SUCCESS` there — that PR lives in a separate, private repository outside this
    plan's scope and is an operational follow-up once this registry ships, not a plan acceptance
    criterion here.
    DEPENDS ON W1-T3178 (queued, not merged): that task establishes the second-root mechanism this
    task generalises into a registry; building this first would re-derive its byte-for-byte
    preservation guarantee from scratch against a moving target.
