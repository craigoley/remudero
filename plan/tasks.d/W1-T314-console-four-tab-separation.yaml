  rationale: "WITHDRAWN AND DECOMPOSED 2026-08-04, on dispatch evidence, not on a judgement about the
    design. The design is inherited WHOLE by W1-T334, W1-T335 and W1-T336; nothing below is retracted.
    SIX DISPATCHES, NOTHING MERGED, AND THE FAILURE CHANGED SHAPE THREE TIMES — which is the signal
    that a task is too large rather than mis-specified: two scope_guard refusals (files: declared two
    paths for work touching eleven; since widened, and the sixth run was not refused); one review
    failure with a fix-rung strike and then required checks red; and finally a run ending
    `implement.done` at 179 turns, subtype success, with NO pr.opened and no gate step of any kind —
    the worker completed and did not push.
    THE MECHANISM, CONFIRMED FROM SOURCE RATHER THAN ASSUMED. `ciParityContractLines`
    (src/lib/compaction.ts) is spliced into `outputContractLines` BETWEEN 'stage the changed file(s),
    commit, then run' and 'Only once that passes: `git push origin HEAD`'. It reads: 'BEFORE THE FIRST
    PUSH, run `rmd preflight --ci-parity` (mirrors every CI job) and reach a PASS: fix whatever step it
    names — do not push to find out whether a required check is red.' That command's `ci:test` step
    shells `npm run test:ci`, the FULL suite. A four-tab DOM restructure turns the eight serve.* suites
    red, so the worker is instructed to fix eight suites before pushing and has no sanctioned exit:
    `outputContractLines`' only PR-less exits are DECISION_REQUEST and ALREADY_SATISFIED, and neither
    fits 'the work is done but preflight will not go green'. Ending without a push is the contract
    working exactly as written, on a task too large to satisfy it in one dispatch.
    THE SPLIT KEEPS MAIN GREEN BETWEEN HALVES, which was the standing objection to splitting and is
    correct. Established from source: `renderShellHtml` emits a FLAT `<main>` of sibling `<section>`
    elements with stable ids, and the same function already carries an append-last defaulted parameter
    (`idleReasonsHtml`) whose own comment gives the reason — 'so every existing caller and test is
    unaffected'. A tab bar can therefore be added as a further sibling with no section moved, and
    `recap` already ships with a bare `hidden` attribute, so a present-but-not-displayed section is a
    shape the suites already tolerate.
    THE ORIGINAL RATIONALE, PRESERVED BECAUSE THE SHARDS INHERIT IT: OPERATOR DIRECTIVE 2026-07-22
    (feedback fb-1784770111145-cf7c24, clause 3), with the same
    screenshot that produced W1-T313. VERIFIED AT SOURCE: the shell renders TEN stacked sections in one
    scroll — glance, recap, now, needs-me, accepted, up-next, recent, rest, controls, more (src/lib/serve.ts
    sections at :702, :769, :774, :783, :799, :808, :820, :829, :861, :890). W1-T153 chose that stack
    deliberately at v0 scale and it was right then; at today's scale the operator's two questions —
    'what needs ME' and 'what is the fleet doing' — are answered by rows separated by hundreds of pixels of
    unrelated rows, and the same surface also carries archaeology (`rest`, the find layer) that is only ever
    wanted deliberately. The 2026-07-22 fixture behind fb-1784756096314-a6f58b measured the cost: 31 needs-me
    items of which 26 were stale and 4 were genuine.
    THIS IS AN IA CHANGE, NOT A REWRITE. Every section already exists, already binds a live projection, and
    already patches in place (W1-T156). What is missing is the SEPARATION."
  design: |
    NOT TO BE BUILT AS ONE TASK. Left in the plan as a RECORD of the decomposition decision, not a
    work item. status: blocked so nextRunnable/assertRunnable never dispatch it — drain.ts's
    isDispatchEligible refuses `status === "blocked"` before any dependency or breaker check, and
    `withdrawn` is not one of plan.ts's TASK_STATUSES, so blocked is the equivalent this repo already
    established for a retirement record (precedent: W1-T229, and W1-T270/W1-T269 in PR #1027/#1030).
    THE WORK IS NOT WITHDRAWN — ONLY THIS CONTAINER FOR IT. The design below is inherited whole:
      W1-T334 adds the tab scaffold alongside the existing stack, removing nothing;
      W1-T335 makes the eight serve.* suites shape-agnostic through the shared harness (test-only);
      W1-T336 makes the tabs authoritative and moves the sections under them.
    Every constraint below belongs to one of those three; the per-criterion mapping is in note:.
    W1-T315 (the Plan view) declared depends_on [W1-T314] and is REPOINTED to [W1-T336] in the same
    change, because a dependency on a blocked task can never become runnable.
    THE ORIGINAL DESIGN, PRESERVED VERBATIM FROM HERE DOWN:
    FOUR TABS OVER THE EXISTING SECTIONS — the sections are MOVED, not rebuilt.
      DECISIONS — genuine operator decisions ONLY: the needs-me set, with already-resolved items FILTERED OUT
        rather than sorted down. CONSUME the existing verdicts, never a second derivation: W1-T257 owns
        'a proposal_pr that MERGED is no longer a pending decision', and the escalation-lifecycle reconciler
        (feedback fb-1784756088300-6a481e, src/lib/sweep.ts:2751) owns 'this escalation's referent resolved'.
        Where a verdict is not yet live, this tab renders exactly today's set — it must NOT invent a third,
        competing staleness rule.
      NOW — live runs + daemon + deploy state, bound to the ONE `rmd status` read model
        (src/lib/status-board.ts, W1-T279/W1-T280's --json, whose header already names this tab as its
        intended consumer). No second derivation of liveness in the console.
      PLAN — progress + frontier. W1-T315 fills it; this task creates the tab and, until then, it renders an
        honest 'not built yet' rather than a blank panel.
      FEED — the raw firehose, UNCHANGED: recent, rest, the find layer (W1-T157) and the recap keep working
        exactly as they do today. Archaeology is a first-class use, and nothing may be deleted to make room.
    WHAT DOES NOT MOVE: the GLANCE strip (W1-T159) stays PINNED above the tabs — it is the cross-tab answer to
    'is anything on fire' and putting it inside a tab hides it. Fleet CONTROLS keep their confirm discipline
    wherever they land, and the browser-tab needs-me badge must keep firing when Decisions is NOT the active
    tab (the alert must not depend on already looking at it).
    PRESERVE WHAT SHIPPED, EXPLICITLY. Verify from source before rewriting the shell: W1-T156's DOM-stable
    in-place patching and text-selection stability (a tab switch must not re-create rows or drop an
    in-progress selection), W1-T157's URL-persisted view state (tab selection joins it, so a tab is
    deep-linkable and survives reload), W1-T154's first-paint budget, and W1-T262's freshness story (each tab
    declares its own source's age; a STALE badge never co-displays with 'live').
    NO NEW FETCHES. Tabs are a projection of the SAME data the shell already receives — an inactive tab must
    not add a poll, a request, or a second gateway call. If anything, non-active sections may render lazily.
    HONEST EMPTINESS: an empty Decisions tab says 'nothing needs you' (and W1-T283's lesson applies — it must
    be able to say that only when it has actually looked at the whole set); no tab is hidden because it is
    empty, because a missing tab reads as a missing capability.
    OUT OF SCOPE: what a card SAYS (W1-T313), the Plan view's own content (W1-T315), grouping/batch-close of
    escalations (fb-1784756096314-a6f58b).
