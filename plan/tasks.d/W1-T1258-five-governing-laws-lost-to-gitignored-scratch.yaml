    **RULE 19 SPAN, AND THE OTHER READING RECORDED BESIDE IT.** `risk: medium` is set from the SPAN:
    `files:` is a single file under `plan/`, one directory, no `src/`—`test/` crossing — the same
    shape `W1-T1120` carries at `medium` for the same reason, and that shard is the sanctioned
    precedent for a ruling whose proofs grep its own text. **THE BLAST-RADIUS READING WOULD ARGUE
    HIGHER**, since the ruling governs 15 citations across 10 files including `src/lib/`, and a
    retirement executed carelessly would strip reasoning along with labels. Rule 19 keys on span, so
    span decides; the other reading is recorded here so a later reader sees it was weighed and not
    missed.

    **`verify: human`.** The deliverable is a ruling, not a behaviour: there is no test path to
    forward-reference, and its criteria are grep anchors against its own text — the W1-T1120 /
    PR #1344 shape. That also makes declaring its own plan record in `files:` legitimate, which
    `rule15-filing` refuses only for a `verify: auto` task.

    **WHAT THIS SHARD MUST NOT BE READ AS DOING.** It does not restore, reconstruct, renumber or
    supply the text of any law. It records what survives, what does not, and what the citations can
    and cannot license — and it recommends one remedy on the evidence rather than settling the
    vocabulary question by fiat.

