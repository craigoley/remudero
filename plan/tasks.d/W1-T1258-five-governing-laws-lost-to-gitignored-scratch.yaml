  title: "five governing constraints were written to gitignored scratch and are unrecoverable, but their citations outlived them — Law 4 survives only as three drifting paraphrases, Law 5's text survives nowhere while nine citations reason from it, and one citation now quotes the module Law 5 governs as the authority for Law 5"
