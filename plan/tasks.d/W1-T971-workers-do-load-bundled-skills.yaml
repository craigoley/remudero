    CITED RATHER THAN RE-FILED. W1-T935
    (plan/tasks.d/W1-T935-w1-t933-is-framed-as-shrinkage-when-the-measured-problem-is-access.yaml)
    states in writing that "UNTIL THAT DISPATCH IS RUN, BOTH THE MERGED SHARD AND THE
    GROUNDING-SOURCE STEP ARE BETS ON A SHELF NOBODY HAS CONFIRMED A WORKER CAN OPEN", and W1-T933
    (plan/tasks.d/W1-T933-facts-can-only-be-injected-never-looked-up.yaml) is the merged shard it
    corrects. NEITHER IS RE-FILED AND NEITHER IS EDITED. What this record supplies them is the
    implement-lane half: a worker CAN open the shelf. It supplies nothing about the thirteen
    tools-array lanes and nothing about a repo-resident skill, and W1-T933's own seam concerns
    `.remudero/skills/` — REMUDERO'S OWN YAML REGISTRY, A DIFFERENT NAMESPACE FROM A CLAUDE CODE
    SKILL — which is precisely the collision that produced two of the six prompts' misleading
