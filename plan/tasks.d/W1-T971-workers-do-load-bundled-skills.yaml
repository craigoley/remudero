    risk: high IS SET UP FRONT AND THE BAND IS RULE 19'S SPAN, NOT BLAST RADIUS. `sizingViolation`
    (src/lib/task-linter.ts) exempts only `risk === "high"`, and `subsystemsOf` derives subsystems
    from the ACCEPTANCE-CRITERIA TEXT as well as from `files:`. This shard's files span the
    decisions record and a new suite, and its criteria name worker-home grants, spawn options,
    tool arrays and tracked-file scope, so no list satisfying its own scope reaches clean at
    medium. The band is set where the rule requires rather than trimmed to look small.

    FILES ARE TIGHT AND OWN PATH IS ABSENT. DECISIONS.md is the durable prose home per design (i).
    test/worker-skill-surface-premises.test.ts is NEW and is declared as new; the existing
    worker-home suites are deliberately NOT declared, because appending a documentation pin to
    test/worker-home.test.ts would mix concerns and this repo's own rule sends a
    coverage-load-bearing test to its own file. src/lib/worker.ts and src/lib/worker-home.ts are
    NOT declared: the pin READS them and must not modify them — a builder who edits either has
    changed the premise instead of recording it, and must amend this shard first.

    NOTHING IS ADDED TO ANY WORKER TOOL ARRAY AND NO `skills` OPTION IS INTRODUCED. Design clause
    (iv) is load-bearing: the assertion that no lane grants `Skill` records the record's SCOPE and
    is not a prohibition. This repo carries eight measured mechanisms that merged green and nothing
    calls, and a pin misread as policy would be a ninth kind of dead weight.

    PROOF NOTES. Five criteria use the name-filtered `unit test:` form rather than a whole-file
    path, so each names the behaviour it proves. Every title was measured against test/ with
    `grep -rlF` and matched ZERO files, against a control title lifted from the real worker-home
    suite that matched one. Each is plain prose under 100 characters with no comma, no
    semicolon-space and no regex metacharacter, so `looksLikeScenarioNarrative` cannot fail them
    and `parseTestTarget`'s escaped-literal match has nothing to mishandle. The sixth is a
    single-line `grep:` with an explicit path, driven from the criterion's own text rather than a
    path slug, verified by hand with the executor's real invocation to read hits at head and zero
    at the merge base.

    ONE ADVISORY IS ACCEPTED KNOWINGLY. `rmd lint-plan` warns `proof-scope` because criterion 6's
    grep names this shard's own path while `files:` does not list it. It is advisory and never
    blocking. Both remedies are worse: declaring the shard's own path would place the filing inside
    its own implementation scope, and repointing the grep at a declared path would name a file this
    change does not touch, so the pattern would read zero at head and the criterion would fail
    executed rather than merely being unscoped.

    verify: human IS SET BY A GATE, NOT BY REFLEX, AND THE GATE IS NAMED. This shard was first
    filed at verify: auto and `rmd lint-plan` REFUSED IT BLOCKING with `[ruling-verify] task
    W1-T971 declares files: including DECISIONS.md at verify:auto — a ruling-shaped task must be
    verify: human — the operator judges rulings`. That is correct and is recorded rather than
    worked around by dropping DECISIONS.md from `files:`, which would have satisfied the linter by
    removing the durable home this record exists to create. The consequence is intended:
    `isDispatchEligible` (src/lib/drain.ts) returns false at `t.verify !== "auto"` BEFORE the
    linter is consulted, so this shard parks until an operator picks it up and can never be
    drained into a worker.

