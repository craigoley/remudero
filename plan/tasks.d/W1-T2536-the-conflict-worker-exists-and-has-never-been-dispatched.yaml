  note: |
    risk:high, band_meaning: blast-radius — NOT Rule 19 span. The span is one module and its own
    suite. The band is about what the change DOES: it lets the fleet dispatch workers onto
    conflicted PRs unattended for the first time. Rationale (4) is the argument that this is
    bounded, and it rests on a fact worth re-verifying rather than trusting from this shard:
    `remudero-review` is a REQUIRED, PER-SHA commit status, so a resolved head cannot merge on a
    stale verdict.

    `files:` DERIVED FROM SOURCE. `DEFAULT_SWEEP_POLICY`, `SweepPolicy`, `DISPOSITION_RULES`,
    `isPureConcurrentAddition` and the refusal row are ALL in `src/lib/sweep.ts`; its declared
    suite is `test/sweep-conflicted-disposition.test.ts`, which is where W1-T984 pinned the
    behaviour this task changes. Nothing in `src/run-task.ts` or `src/lib/open-prs-rest.ts` needs
    editing — the dispatch, the mode, the prompt and the producer are all already correct and are
    reached the moment the row admits.

    W1-T984's `acceptance 2` test PINNED the old default and is REWRITTEN here rather than left
    behind: its contract ("with the flag OFF, all five dispose blocked-ambiguous") is precisely
    what this task changes, so a stale pin would be a false green. Its three deletion cases are
    kept, asserting the same refusal at the NEW default.

    `scripts/source-size-baseline.json` IS DECLARED because the doc this change adds to
    `src/lib/sweep.ts` grows it past its recorded ceiling (8445 -> 8501), and the ratchet's own
    remedy text says recording is the ordinary outcome for deliberate growth. It is exempt from
    Standing rule 25's instrument-isolation rule per W1-T2526 — a size ledger records how long a
    file is and grades no falsifier. It adds no Rule 19 concern here either: this task's band is
    blast-radius, which does not compute span.
