      proof: 'grep: test("W1-T8203: stderr over the bound keeps the worker result" in test/a-codex-worker-over-its-stderr-budget-keeps-its-run.test.ts'
    - claim: "the retained stderr keeps the head and the tail and names the dropped bytes"
      proof: 'grep: test("W1-T8203: retained stderr keeps head and tail with the dropped count" in test/a-codex-worker-over-its-stderr-budget-keeps-its-run.test.ts'
    - claim: "the stderr truncation is recorded on the run's receipt"
      proof: 'grep: test("W1-T8203: the stderr truncation is ledgered" in test/a-codex-worker-over-its-stderr-budget-keeps-its-run.test.ts'
    - claim: "the worker process is not torn down for stderr volume"
      proof: 'grep: test("W1-T8203: stderr volume never tears the worker down" in test/a-codex-worker-over-its-stderr-budget-keeps-its-run.test.ts'
