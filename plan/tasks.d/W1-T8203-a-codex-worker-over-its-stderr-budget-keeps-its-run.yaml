  plan_refs: [W1-T6352, W1-T4595, W1-T3490, W1-T3502, W1-T3787, W1-T7806]
  files: [src/lib/worker-provider.ts, test/a-codex-worker-over-its-stderr-budget-keeps-its-run.test.ts]
