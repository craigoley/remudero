- id: W1-T2981
  title: "A FIRED RETRO HOLDS THE WHOLE TICK — the retro rung sits above the dispatch pick and awaits an unbounded run, so a marker 3.7 days and 446 merges behind produces ~11 consecutive retro-only ticks during which the fleet reviews, merges and builds NOTHING while every liveness signal stays green"
  repo: remudero
