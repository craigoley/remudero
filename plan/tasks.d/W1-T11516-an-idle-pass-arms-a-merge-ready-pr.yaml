  design: |
    Read W1-T11510's merged source first. This filing could read its record only on PR #17065, and it
    is the base for what follows. That task adds `lightPassArmAdmitted(scope)`.

    1. PERMIT ONLY THE IDLE SCOPE. Widen that predicate to `idle` by exact scope name. `reviewOnly`
       stays true on the idle pass, and every repair lane stays closed. Pause, drain and boot stay held.
       Interphase-review arming stays exactly as W1-T11510 left it.
    2. REUSE ITS GUARDS. W1-T11510's distance read, its hold on a head an ordinary pass would refresh,
       and its stand-down before any CodeQL fix or escalation all apply to `idle` too. Write no second
       path. An idle pass makes no update-branch call and starts no fix or requeue.
    3. COUNT MERGE-READY DEMAND. The passes that already publish idle demand also publish a separate
       `mergeReady` count, and `readIdleLightCadence` stays memory-only. Count an open, non-draft,
       unarmed head that is green with review success and still needs the guarded arm or merge decision.
       Leave out a head whose standing refusal holds at its unchanged head (operator hold, risk refusal,
       arm-decision refusal). Otherwise a refused head keeps idle passes running with nothing to do.
    4. ARMED HEADS ARE NOT LIGHT-PASS DEMAND. Armed-idle completion runs only on a full pass
       (src/lib/sweep.ts:21515), so an armed head stays with the full pass.
    5. CHECKS TURNING GREEN AFTER REVIEW. A reviewed head with pending checks is not counted. It joins
       the count when a later pass sees it green at the same head.
    6. CADENCE, WITH NO NEW LITERAL. Run merge-ready demand at the existing derived cadence when that
       is below the poll interval, otherwise once per idle sleep with `pollIntervalMs` as the bound.
       Relaxing the gate alone does nothing: a final chunk ends the sleep without a pass
       (src/lib/daemon.ts:6315), so a cadence equal to the poll interval still runs none. Decline while a
       full pass is in flight, because its own ticker already runs light passes. If W1-T11515's rows point
       at a better observed input, use that and name it in the PR body. Never add a constant.
    7. RECORD IT. `daemon.idle_light_pass` and `daemon.idle_sleep.decision` carry `merge_ready`.
    8. KEEP EVERYTHING ELSE. Exact-head re-reads, required-check and review gates, risk decisions,
       operator holds, arm dedup, repair and spend bounds, and the per-tick full pass stay authoritative.
       A missed event still converges through that full pass.
    9. REPLACE THE ONE ASSERTION. In test/daemon/an-interphase-review-pass-arms-a-ready-pr.test.ts, drop
       idle from the unable-to-arm scopes and leave pause, drain and boot in place. Change nothing else.
       Correct any comment this makes false, including `LightPassScope`'s "closes every lane but review"
       and the W1-T5922 note on `lightPassActionable`.
