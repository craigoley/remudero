  falsifier: |
    Leave `mergeReady` out of the idle gate: the merge-ready-only case sees no pass and criterion 1 fails.
    Relax the gate without handling the final chunk: criterion 1 still sees no pass. Widen the predicate
    to every review-only scope: the pause, drain and boot cases of criterion 4 arm and fail. Count a head
    with a standing hold: the criterion 3 demand assertion fails. Add a literal cadence: criterion 6 fails.
    Skip the distance read for idle: the unreadable-compare case of criterion 5 arms and fails.
