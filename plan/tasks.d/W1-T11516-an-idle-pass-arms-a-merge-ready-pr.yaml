      proof: "unit test: W1-T11516 criterion 5"
    - claim: "Merge-ready-only demand runs with no new timing literal, at most once per idle sleep past the derived cadence, declines beside an in-flight full pass, and leaves the per-tick full pass unchanged"
      proof: "unit test: W1-T11516 criterion 6"
    - claim: "The idle rows name the merge-ready demand"
