  rationale: |
    Operator ruling 2026-11-06: file this narrowed, as cover for missed events. This is step 2 of 2,
    after W1-T11515.

    THIS DID NOT CAUSE THE PR #16962 DELAY. That delay came from 13 interphase-review stand-downs
    (W1-T11510) and selected-registry timeouts (W1-T11463). This task exists so a merge-ready PR whose
    event was missed still converges. It is not the remedy for #16962.

    EVIDENCE, supplied by the operator and not re-run for this filing. `daemon.idle_light_pass` and
    `"light_pass_scope":"idle"` have 0 rows across 391 archives plus the live ledger, against 2,671
    `"light_pass_scope":"drain"` rows over the same corpus. The idle pass has never been observed
    running. The cadence gate is the suspected reason. That is inferred, not measured, until
    W1-T11515's rows are read.

    WHY BOTH HALVES ARE NEEDED. Idle demand counts review work only (`noteIdleReviewDemand`,
    src/lib/sweep.ts:18311), so a PR that is green and reviewed adds nothing to it and no idle pass
    starts for it. And an idle pass could not act on it anyway: `lightPassActionable` receives
    `armAllowed` false on every review-only pass (src/cli/commands/sweep.ts:1189).

