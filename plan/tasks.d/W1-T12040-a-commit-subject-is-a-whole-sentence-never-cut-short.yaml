- id: W1-T12040
  title: "A commit subject is 72 characters or fewer and is never cut short"
  repo: remudero
  depends_on: [W1-T12038]
  priority: 1.3
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # two concerns: what a worker is asked to write, and what the code does with a subject that is too long
  band_meaning: blast-radius
  origin: operator-session#plain-language-2026-11-10
  files:
    - src/lib/compaction.ts
    - src/lib/commit-message.ts
    - test/a-commit-subject-is-a-whole-sentence-never-cut-short.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "The implement output contract asks for a subject of 72 characters or fewer that is a whole sentence saying what is now true, and names the writing standard"
      proof: "grep: W1-T12040 criterion 1 in test/a-commit-subject-is-a-whole-sentence-never-cut-short.test.ts"
    - claim: "A subject over the limit is shortened at a word boundary to a whole clause when one fits, and is cut with an ellipsis only when none does"
      proof: "grep: W1-T12040 criterion 2 in test/a-commit-subject-is-a-whole-sentence-never-cut-short.test.ts"
    - claim: "The task id in brackets and the conventional type and scope are kept exactly in every shortened subject"
      proof: "grep: W1-T12040 criterion 3 in test/a-commit-subject-is-a-whole-sentence-never-cut-short.test.ts"
  rationale: |
    MEASURED 2026-11-10 on main at 2c6e743199, over the last 300 commit subjects: the mean is 79 characters, 60% are longer than 72, 24% are longer than 100, and 25% are cut off with "…".
    - Example: 'fix(arm): an already-clean plan pr whose direct merge github refuses with "base branch… (W1-T11259)'. The cut falls inside a quotation, before the verb.
    - The cut comes from shapeCommitMessage in src/lib/commit-message.ts. The output contract in src/lib/compaction.ts asks only for Conventional Commits form, lower case and 100 characters.
    - The operator reads these subjects in the pull request list and in the console.
  design: |
    Change the contract's wording to ask for 72 characters and a whole sentence. In shapeCommitMessage, when a subject is too long, drop trailing clauses at a comma, a dash or "so/because/when" until it fits, and fall back to today's ellipsis only when the first clause alone is too long. The machine-read parts keep their exact form.
    NOT IN SCOPE: commitlint's 100-character rule, which stays as the hard limit, and gardener pull request titles (a later task).
  falsifier: |
    Remove the 72-character request and criterion 1 must fail. Cut a subject that has a shorter whole clause and criterion 2 must fail. Lose the task id or the type in a shortened subject and criterion 3 must fail. Restore and require all three to pass.
  note: |
    src/lib/compaction.ts is on the prompt-surface gate's list, so the builder supplies the evidence that gate asks for.
