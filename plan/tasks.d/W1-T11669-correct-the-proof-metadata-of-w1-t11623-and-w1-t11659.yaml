  rationale: |
    The initiative asked for this task under "the reserved W1-T11668 id". The harness reserved
    five IDs for this filing run, not W1-T11668, and W1-T11668 appears nowhere in plan/. So this task
    uses W1-T11669, the first id actually reserved. Its scope is exactly what the initiative described.
    TWO PROOFS THAT CANNOT DISCRIMINATE, READ ON THIS TREE:
    - W1-T11623 criterion 1 is `unit test: test/author-preflight.test.ts`. Its own rationale records that the
      file passes when run bare (with no slot marker). The reviewer's proof run is not guaranteed to sit inside
      an author slot (W1-T11623 note), so the whole-file proof can pass on BASE. A whole-file proof over a file
      that already passes on main fails proof-discrimination (src/lib/proof-grammar.ts, the W1-T8625 comment
      citing #11096). The exact regression title in W1-T11623 design step 1 is absent on base and present on
      head, so it does discriminate.
    - W1-T11659 declares `test/ci/gates/a-verified-systemd-user-manager-does-not-block-cwd-census.test.ts` and
      proves its one criterion with a title grep inside that file. The `gates/` folder is not one `rmd test-place`
      can compute for this test (derivation below). The path-based `unit test:` proof on the corrected path reads
      a missing file on base (fails) and runs the new suite on head (passes).
    Settled by lookup: is this already filed or already decided? -> no. No shard or monolith task names
      W1-T11623 or W1-T11659 except those two shards, and W1-T11659 lists W1-T11623 only in plan_refs. LEARNINGS.md
      and DECISIONS.md say nothing about either task (plan/ grep; LEARNINGS.md; DECISIONS.md).
    Settled by lookup: which folder does `rmd test-place` compute for the W1-T11659 suite? -> test/ci/
      (src/lib/test-placement.ts placeTest; scripts/test-placement/subsystem-map.json). The test's only src
      import, process-cwd-census, matches no module_subsystem key and no subsystem_seed_rules regex, so no import
      scores. The fallback is a name keyword: "census" maps to ci-parity (weight 0.81), which folder_of_subsystem
      maps to "ci". With the keyword fallback primaryModule is undefined, so no ci second level (gates, suites,
      parity, coverage) can apply and the folder stays test/ci/. The existing sibling suite that imports the same
      module, test/ci/a-foreign-pid-whose-cwd-is-unreadable-does-not-hold-a-dead-fix-worktree.test.ts (W1-T10389),
      lives in test/ci/ for the same reason. `rmd test-place` refuses a path that does not exist yet (placePaths),
      so the derivation is recorded here, and the W1-T11659 implementer re-runs the verb once the file exists.
    Settled by lookup: will editing another task's claim:/proof: lines trip criteria tampering? -> not on a
      plan-only diff. judgeReview computes `criteriaTampered = !planOnly && criterionFieldTampered(diff)`
      (src/lib/review.ts:6098), and every path in files: is under plan/tasks.d/. The W1-T384 filing rule in
      src/lib/task-linter.ts fires only when a record file sits beside an out-of-plan-scope path, and none does here.
    Settled by lookup: what is the "existing skip behavior" for readable foreign UIDs? -> when the cwd read fails
      with EACCES/EPERM and the status Uid is readable but differs from the census owner's uid, the pid is counted
      in `skippedForeign` and the scan continues (src/lib/process-cwd-census.ts:137-141, W1-T10389). W1-T11659
      must leave that unchanged; its design only says "foreign UID handling ... unchanged" today.
    Settled by lookup: does this task's proof name its own shard (the self-path executed_stale trap)? -> no. Every
      proof greps one of the two TARGET shards, which this task's PR edits
      (src/lib/task-linter.ts self-path check).
