  note: "verify:auto — the function is a pure fold over an outcome list, decidable from fixtures
    with no spawn, no network and no runner. risk:medium is Rule 19's SPAN and it is honest:
    subsystemsOf folds a .test basename onto its source, so src/lib/host-parity.ts and
    test/host-parity.test.ts are ONE subsystem, and the blast radius matches — one new exported
    predicate plus its tests, adding no import to any other module and changing no existing
    behaviour. FILES DERIVED BY INVOCATION, NOT BY GUESS: host-parity.ts is where this repo
    already reasons about a test outcome that is not a defect, and it is the file that already
    names this very flake in prose, so the new predicate joins the module that owns the question
    rather than opening a new one. NOTHING under scripts/ or .github/ is declared because clause
    (v) puts the retry script and the workflow out of scope; if an implementer concludes the
    predicate belongs at a call site instead, THIS SHARD MUST BE AMENDED TO DECLARE THAT PATH
    FIRST rather than overrunning — #1869 shipped a 22-file overrun against a two-path
    declaration. PROOF NOTES: all three proofs are the NAME-FILTERED `unit test:` form, never the
    whole-file path form, so each names the behaviour it proves rather than a file that would pass
    on any test in it. Each title was verified to match ZERO files today via `grep -rlF` over
    test/, against a control string matching one, so every one discriminates head from base. Each
    is plain prose under 100 characters with no comma and no regex metacharacter, so
    looksLikeScenarioNarrative does not fire and proofNameResolutionViolations cannot either.
    Zero candidates today is the legitimate forward reference for an unimplemented task; what
    must hold now is that the proofs PARSE. NO depends_on: the check-run rollup, host-parity.ts
    and its suite are all on main at 3cac8ce."
