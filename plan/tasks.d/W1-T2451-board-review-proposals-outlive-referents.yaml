  note: "PROVENANCE: filed 2026-08-27 while drafting the ratification candidate for the board-review
    rung's own live proposal `board-review:escalation:#3039`. `origin: architect` because the schema's
    origin enum has no `proposal#` form and this is a hand-authored Architect filing; the full chain is
    board-review rung -> proposal board-review:escalation:#3039 -> this task.
    THE INSTANCE WAS DELIBERATELY REFUSED, and that refusal is the reason this task exists. Ratifying
    `board-review:escalation:#3039` as written would have filed a task about ONE PR — an instance, not a
    class, whose referent had already exhausted strike 2/2 before the proposal was ever read
    (fb-repair-blocked-fixable-2956.yaml). W1-T20d names that shape by name: mine for a CLASS pattern and
    propose ONE class-level fix rather than N per-task patches. The proposal is better read as EVIDENCE of
    a lifecycle gap than as a work item.
    depends_on IS DELIBERATELY EMPTY, and this is a judgement rather than an oversight. The machinery
    edited here — classifyProposalReadiness, isDraftStale, anchorFingerprint, updateProposalRegistry — is
    all LIVE IN SOURCE AND VERIFIED BY READING IT, while the tasks that describe it (W1-T110, W1-T111,
    W1-T240) still read `queued` in the plan. depends_on is a HARD gate, so citing them would strand a
    real fix behind an unclosed credit record for code that already exists. The relationship is recorded
    here instead.
    risk:high IS A RECORDED REGRADE ON THE MERITS, NOT A WORKAROUND. `files:` spans board-review.ts and
    inbox.ts, which the linter's mechanical subsystem count reads as two concerns at risk:medium. It is
    ONE invariant — a proposal whose referent resolved never renders READY — and it is unsatisfiable
    piecewise: a minter recording a referent nothing reads changes nothing, and a reader with no referent
    recorded has nothing to read. That is the atomic-coupling exit Rule 19 already grants
    W1-T240/W1-T250/W1-T253, applied on the same footing.
    NOT A RE-DECISION of W1-T162 (escalation ISSUES), W1-T257 (feedback ENTRY status), or W1-T190
    (registry-vs-ledger ratify sync). Those three own different artifacts and different triggers; each
    reconciles something an operator or the gate ACTED on, whereas this one governs a proposal whose
    referent dissolved with no operator action ever taken. The plan already draws these boundaries
    explicitly (W1-T257's own 'DO NOT WIDEN' note), and this filing keeps them."
