- id: W1-T3389
  title: "THE BODY-REPAIR RUNG SHIPS PROOFS IT NEVER RAN — it rewrote a PR body into four grep proofs that all graded exec_error, one of them the doubled dialect grep: unit test:, turning a two-criterion miss into a four-criterion failure"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 70.00
