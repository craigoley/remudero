  design: |
    No fixed count, cap or weight (standing operator rule).
    1. DEAL THE SLOTS OVER THE DISPATCHABLE SET. W1-T9968's slot assignment runs over the tasks the selector can
       actually dispatch in this pass, not over every open task.
       - Eligibility is per task, and its outcome does not depend on the order. So walk it once, then deal the slots
         over the eligible set, then sort that set.
       - The context therefore keeps each scored task's slot inputs (`pass0`, `passF`, tier). dispatch-value.ts
         exports a function that redeals `fanoutWithinTier` over a given id set and returns a context whose
         `stridePassByTaskId` covers that set.
       - `dispatchEligibleCandidates` walks `isDispatchEligible` once, as today. It then orders the eligible tasks
         with `dispatchOrder(eligible, <redealt context>, resumable)`.
       - `nextRunnable` takes the head of that same list, through a shared helper, so the two selectors cannot drift.
       - Do NOT run the eligibility walk twice. Its callbacks write ledger rows and tallies, and `readLiveState` is a
         live read. Do NOT build the eligible set inside `buildDispatchValueContext` either. The context is built
         before the pass, and eligibility needs the pass's own opts: in-flight, open PRs and exclusions.
    2. THE PICK ROW TELLS THE TRUTH. W1-T9325's `dispatch.pick` row (`captureDispatchFrontier` and
       `dispatchPickPayload`, src/lib/daemon.ts) records `rank`, `runner_up` and `explainDispatchScore`'s `stride_pass`.
       After this change, all three must be read from the redealt order and context the selector used. They must never
       come from the eligibility walk's order or the pre-pass context. Touch daemon.ts only as far as that needs.
    3. Unchanged: `costOfDelayByTaskId` (the full product, fan-out included), `openDependentFanout`, the urgency,
       `compareDispatch` and its tiebreak chain, the fallback and priority-first order, every eligibility arm, and
       `packDisjointFirst`. A reader that orders the whole plan rather than selecting, such as the panel's
       `dispatchOrder(plan.tasks)`, keeps W1-T9968's deal over every open task.
    4. TESTS. A new file, test/fan-out-slots-are-dealt-over-the-dispatchable-set.test.ts, with `test(` titles verbatim
       as in the proofs. It uses `buildDispatchValueContext` plus `runnableCandidates`/`nextRunnable` on injected plans
       and rows with fixed timestamps, as the W1-T9968 file does.
       - Falsifier: the W1-T9874 / W1-T9378 pair. W1-T9378 is a P2 with `verify: human`, no fan-out and the best P2
         pass0. W1-T9874 is a P2 with open dependents. Some eligible P1s have pass0 values between the two. W1-T9874
         must dispatch after those P1s.
       - The property: on a mixed queue of at least three tiers, mixing eligible tasks with ineligible ones (verify:
         human, retired, status blocked), the cross-tier order of every pair of ELIGIBLE tasks equals their order with
         every dependent removed.
       - The pick row: for the falsifier queue, the `dispatch.pick` payload's `rank` and `stride_pass` equal the
         selector's order and the redealt pass.
