  falsifier: |
    On PR #12587's head (W1-T9968 alone), W1-T9378's best P2 pass0 is dealt to W1-T9874, because both are in the P2
    unblocked group. W1-T9874 then sorts ahead of the P1s whose pass0 lies between the two P2 slots, and the first test
    fails. With the fix, W1-T9378 is not in the dispatchable set, so W1-T9874 gets the only P2 slot the eligible set
    holds, its own, which sits after those P1s.
    Ways to break it, and the test that catches each:
    - Filter after ordering, as today: the first test.
    - Exclude only `verify: human` from the deal: the property test, whose queue also holds retired and status-blocked
      tasks.
    - Redeal for the selector but write the pick row from the pre-pass context or the walk order: the third test.
