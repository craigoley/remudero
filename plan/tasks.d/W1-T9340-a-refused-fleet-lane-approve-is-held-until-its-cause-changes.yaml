  falsifier: |
    Keep `withinDay(d.ts) && !released.has(id)` as the hold for a settled `file` entry, and the race fixture refused
    an hour ago stays held after main moves, as burnRatePredicate and managedReposPath were on 2026-10-13. Free every
    refused entry on any main move instead of by signature, and the duplicate fixture is re-approved and refused
    again each pass. Drop `count` from rule d, and a deterministic failure classed `transient` is re-approved on every
    main move with no backoff.
  note: |
    EFFECT, measured after the merge sha deploys, from the core ledger union with no numeric pass mark: for findings
    refused by a race or a preflight check, the time from the refusal to the next `fleet_lane.decided` reads the next
    main move or re-draft, not ~24 h; `fleet_lane.hold_released` rows name a rule for every re-offer; and no
    `duplicate:` or `skill-file` finding is re-approved without its draft or its duplicate changing. Healthy shape: no
    finding classified ready sits behind a refusal whose signature's evidence has changed.
