  design: |
    No timer and no new constant. A refused hand-off is held by a record of its refusal, and freed by evidence that
    the refusal's cause changed. The pace (`mergedLastDay` minus filed) and one hand-off a pass are unchanged.
    1. RECORD THE REFUSAL. When `settleHandoffs` settles a `file` hand-off on an outcome row other than
       `ratify.approved`, store on the entry `refusal: { step, signature, sha, draftKey, count }`:
       - `signature`, a class read from the row: `duplicate:<duplicate_of>`; `lint:<checks>` for a
         `ratify.approve_refused` naming `[lint_clean]` or an `approve.error` "plan-PR preflight refused" naming
         `[<check>]`s (sorted check names); `skill-file` for a skill draft staged without its file; `transient`
         for a worktree race, a held run lock, a stale base, a fetch failure, `ratify.handoff_failed` and
         `self_sync.refused`; otherwise `other:<sha256 of the error text with shas, pids, paths and digits blanked>`;
       - `sha`, the tree the approve ran at (the `sha` of its `ratify.cli_started`/`ratify.cli_exited` gateway row),
         else `originMainSha()` at settle;
       - `draftKey`, a digest of the cached draft's `fragmentYaml` and `stampLine` the decision was made on, recorded
         by `decide` when it files;
       - `count`, one more than the entry's prior refusal when its signature is equal, else 1.
    2. RELEASE ON EVIDENCE. In `triageFleetLaneSteps`, replace the `withinDay(d.ts)` hold for a settled `file`
       entry with a check that frees it when ANY of these holds, read each pass:
       a. its cached draft's digest differs from `refusal.draftKey`: a re-draft, a W1-T9041 or W1-T9324 re-offer, or a
          skill re-stage changed what an approve would file (this subsumes W1-T9324 §2's replay-only release);
       b. `lint:` signature: re-linting the current cached draft in-process with the replay's `relintCached`
          (exported from src/lib/inbox-replay.ts, no model call) reports none of the refused checks;
       c. `duplicate:` signature: a first-parent commit since `refusal.sha` touched the named task's shard;
       d. `transient` and `other:` signatures: origin/main has advanced past `refusal.sha` by at least `count`
          first-parent commits. The backoff is the finding's own repeat count, learned from its refusal record: a
          race retries on the next main move, and a deterministic failure mislabelled transient waits longer each
          time it repeats at an unchanged cause.
       `skill-file` frees only by (a). A main that cannot be read frees nothing (as `releasedHandoffs` does). A
       `merge` entry, a pending hand-off and W1-T9065's unrecorded rule are untouched. An entry settled before this
       change, with no `refusal`, is judged as `transient` with count 1 at an unknown sha, so it frees on the first
       pass that reads main; the one-a-pass pace bounds that wave.
    3. SAY WHY. Each release writes `fleet_lane.hold_released` with the proposal id, the signature, and the rule
       (a to d) that freed it, so the next approve's outcome can be joined to the evidence that re-offered it.
    The main-history read is a new optional dep, `mainSince(sha) => { commits: number; files: string[] }` (first-parent
    count and touched paths since `sha`), wired in src/run-task.ts beside `originMainSha` with
    `hostWorktreeGitAsync`; absent, rules c and d free nothing.
    Tests go in the new file test/a-refused-fleet-lane-approve-is-held-until-its-cause-changes.test.ts, with `test(`
    titles verbatim as in the proofs below. Drive `triageFleetLane` over a fixture state dir with a decision store, a
    draft cache, a classification snapshot calling the findings ready, outcome rows in the ledger, and injected
    `originMainSha` and `mainSince`, all inside one day of the decisions.
