  design: |
    1. A LOCK RECORDS ITS HOLDER, AND IS NEVER VISIBLE WITHOUT IT. When prime or sweep takes `<key>.lock`,
       the lock carries a holder record: pid, the process start time, hostname, the machine's boot identity
       (Linux /proc/sys/kernel/random/boot_id; macOS `sysctl -n kern.bootsessionuuid`), the pid namespace
       (Linux readlink /proc/self/ns/pid; "host" on macOS), a random nonce, and the command (prime or sweep).
       Publish the lock complete, so no other process can observe a lock without its record. Note: POSIX
       rename() REPLACES an existing empty directory, so a plain directory rename would silently steal an
       empty legacy lock. Use an operation that fails when the lock exists (for example a holder file
       staged and then link()ed to the lock path, or an exclusive create).
    2. STALENESS IS DECIDED BY EVIDENCE, NEVER BY AGE. A lock is stale when any of these hold:
       a. it records no holder (the pre-change empty directories, like the host's three);
       b. its recorded boot identity is not this machine's current one: the holder ran on another host or
          an earlier boot. The store is account-local, and no container mounts it, so such a record cannot
          name a live holder;
       c. its pid namespace is the reclaimer's own, and its pid is dead or was reused (the live pid started
          after the recorded start time). Reuse the rungs of isHolderStale (src/lib/fs-race-safe.ts) where
          they fit. The standalone tool ships only dependency-seeds.ts and clock.ts, so either inline the
          predicate or add the file to the installer's tool set and version hash;
       d. its pid namespace is not the reclaimer's, and no process of this account remains in that namespace
          (Linux: no /proc/<pid>/ns/pid resolves to it).
       Otherwise it is LIVE (same namespace, pid alive, start time matches) or UNVERIFIABLE (another live
       namespace, or the evidence cannot be read). Neither is ever reclaimed.
    3. RECLAIM IS ATOMIC AND NAMED. A reclaimer moves the judged lock aside (rename to a unique
       `.reclaimed-*` name) and re-reads the moved record. If it is not the one it judged, it backs off and
       retries. Only then does it remove the moved copy. Release removes the lock only when the record still
       carries the releaser's own nonce. Residual risk to state in the doc: a still-running pre-change holder
       of an empty legacy lock would remove the new lock in its own `finally`. The installer converges every
       copy of the tool in this same change, and in-process callers run their checkout's own source.
    4. PRIME. On an existing lock, prime reads the record. A stale lock is reclaimed at once and acquisition
       retried, with no wait. A live or unverifiable lock is waited on as today; when the wait ends, the error
       names the holder (pid, host, verdict) instead of a bare EEXIST.
    5. SWEEP. sweepDependencySeeds also enumerates every `<64-hex>.lock`, with or without a seed directory,
       and reports one row per lock: `{ lock, action: "reclaim" | "keep", reason, holder }`. The reason
       names the evidence (no-holder, other-boot, dead-pid, reused-pid, namespace-gone, live, unverifiable).
       Without --apply nothing changes: a dry run reports `reclaim` but leaves the lock, and keeps its seed
       with the lock reason, as today. With --apply a stale lock is reclaimed first, and its generation is
       then judged by the unchanged GC rules (six idle hours, no consumer, open-file scan) in the same pass.
       The output stays one JSON array of rows with an `action` field, because deploy/mac/remudero-janitor.sh
       :1500-1504 counts `remove` and `keep` rows from it.
    6. THE HOST INSTALLER CONVERGES THE TOOL. deploy/install-dependency-seeds.sh gains a read-only check
       mode that prints the repo's TOOL_VERSION and the installed one, computed once in that script, not
       duplicated in install-host-units.sh. In the janitor block of deploy/install-host-units.sh, gated like
       CLEANUP_PATH (default host layout core instance, or an explicit test override env such as
       RMD_DEPENDENCY_TOOL_HOME, so temp trees never touch a real home):
       - check mode prints `install-host-units: MISSING <home>/.local/bin/remudero-dependencies` when the
         wrapper is absent, `install-host-units: DRIFTED dependency seed tool (installed <v> != repo <v>)`
         when the wrapper's tool version or any installed file differs from the repo, and
         `install-host-units: ok      dependency seed tool <v>` otherwise. MISSING and DRIFTED each count
         as drift;
       - --install runs deploy/install-dependency-seeds.sh AS the service account (runuser/sudo -u
         $SERVICE_USER when root, directly when already that user), with the host-node pin as RMD_SEED_NODE.
         It never runs as root into the account's home. The existing seed config is preserved: enable only
         writes when none exists.
    7. deploy/DEPENDENCY-SEEDS.md replaces "Busy locks are never stolen by age. Interrupted locks require
       operator investigation." with the evidence rule above, and says the host installer converges the tool.
