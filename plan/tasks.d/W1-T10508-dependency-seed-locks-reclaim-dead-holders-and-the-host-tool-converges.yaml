  rationale: |
    RE-VERIFIED 2026-10-23 on origin/main 344e6b501 and on `ssh remudero` (read-only, niced, bounded).

    DEFECT 1: A SEED LOCK NAMES NO HOLDER, SO A DEAD ONE IS NEVER RECLAIMED.
    - src/lib/dependency-seeds.ts:319 `const lock = join(root, \`${meta.key}.lock\`)`. :321 says "Never reclaim
      another installer's lock by timestamp". :323-328 loop on `mkdirSync(lock)`; on EEXIST they spin until
      `lockWaitMs ?? 120_000` and then rethrow EEXIST. The lock directory is empty: nothing records pid, host
      or start time, so nothing can ever prove the holder is gone.
    - The lock is taken BEFORE the ready.json check (:333), so even a fully built seed cannot be reused while
      its lock exists. Release is only the `finally` at :410-412.
    - THE MECHANISM THAT STRANDS IT. src/lib/worker.ts:4956-4960 runs `dependency-seeds.mjs prime` with
      `timeout: 120_000, killSignal: "SIGKILL"`. SIGKILL cannot run a `finally`, so a prime killed at its bound
      leaves the lock behind. A waiter's own wait is the same 120 s, so a waiter queued behind a slow holder
      is itself killed while holding nothing, or times out.
    - sweepDependencySeeds (:424-458) enumerates only 64-hex seed directories. A locked seed is kept with
      reason "installer or sweeper lock" (:431-433) on every pass, and a lock with no seed directory is never
      even listed. `sweep --apply` therefore cannot reclaim either the lock or the generation behind it.
    - deploy/DEPENDENCY-SEEDS.md says "Busy locks are never stolen by age. Interrupted locks require operator
      investigation." No such investigation path exists, and nothing alerts.
    HOST EVIDENCE, /mnt/scratch/remudero-dependencies/craigoleyagent:
    - Three empty lock directories:
        ed153d31….lock  2026-10-15 02:19:33  (seed ready, lastUsed 2026-10-14T21:23Z, 1 consumer)
        561e6680….lock  2026-10-15 17:04:41  (seed ready, lastUsed 2026-10-15T14:37Z, 1 consumer)
        cc6391d5….lock  2026-10-17 17:30:02  (seed ready, lastUsed 2026-10-17T17:30:02Z, 0 consumers)
      For cc6391d5 the lock time equals the lastUsed stamp: the holder published ready.json and died before
      its `finally`. All three generations are complete (ready.json present), and all three are unusable.
    - No process on the host runs dependency-seeds.mjs (0 in the process listing). No container mounts the
      store: the four daemon/serve containers' mounts were listed by Source/Destination only, and none names
      /mnt/scratch/remudero-dependencies. Every holder is therefore a host process of this account.
    - The account runs processes in 6 different pid namespaces and 6 mount namespaces. A bare pid is not
      evidence across them. A lock must also record the namespace its pid belongs to.
    - The host booted 2026-09-16 00:13:14, so these locks do not predate the boot. Boot evidence does not
      clear them; holder evidence is needed.
    - Not reproduced live, because the host is read-only. The 120 s wait-then-throw is :323-328 as written,
      and test/dependency-seeds.test.ts:203-208 already pins it with an empty lock and `lockWaitMs: 0`
