  rationale: |
    OBSERVED LIVE ON #3662 / W1-T2618, 2026-09-02. The run's `pr.polling` row at
    14:13:52.884Z listed every check terminal: required checks were `SUCCESS`, `osv-scanner` was
    `NEUTRAL`, and `remudero-review` was `SUCCESS`. The next terminal row at 14:14:23.717Z was
    `pr.stalled` with `pending: []`, immediately followed by `verdict: blocked_ci (no progress for
    5 consecutive polls)`. GitHub records the same already-armed head merged at 14:14:53Z, thirty
    seconds after the false block. No check failed and no check was pending.

    OBSERVED MECHANISM ON MAIN AT 7e563e61. `pollToGate` runs only after CI, review, the capped
    gate and risk judge passed and `armAutoMergeAtOpen` was called. It asks
    `checkWaitStalled` whether the last five rollups are unchanged. That predicate correctly
    reports a quiescent rollup as stalled and returns the still-pending names. The caller loses
    the distinction: when `pending` is empty, it still returns `merged: false`; `runTask` maps
    every non-merged `GateOutcome` to `blocked_ci`. Therefore "GitHub has not materialized the
    armed merge yet" and "CI cannot finish" share one terminal verdict even though the evidence
    already distinguishes them.

    THIS IS NOT A REQUEST TO CLAIM A MERGE EARLY. A green, armed, open PR is not merged, must not
    receive merge credit, must not release dependent tasks, and must stay visible to the sweep.
    It is also not a CI failure and must not spend the blocked-CI fix rung. The honest state is a
    distinct `awaiting_merge` run outcome: this worker has finished useful work, GitHub owns the
    already-authorized material transition, and the next ordinary projection/sweep will confirm
    whether that transition actually happened.

    KEEP THE PROGRESS BOUND. `STALL_WINDOW = 5` and `checkWaitStalled` are not widened. Five
    identical polls with a genuinely pending check still return `blocked_ci` naming that check;
    any terminal failure still returns `blocked_ci` immediately. Only the already-derived empty
    pending set after the post-arm poll changes class. This releases the expensive worker lane
    instead of waiting indefinitely on GitHub and avoids inventing a second time limit.

    THE NEW OUTCOME NEEDS END-TO-END SEMANTICS, NOT A STRING RENAME. It is non-crediting and
    non-halting. Drain must continue past it without re-offering the same task in that pass.
    Daemon block reasoning must neither retry the implementation nor spend a strike/fix worker;
    the next fresh open-PR/merged projection owns the disposition. If the PR later merges,
    existing W1-T976 merge-credit correction is the only authority that may promote it. If the
    PR later becomes red or loses its arm, the ordinary sweep sees that material state and acts.

    PRESERVE OPERATOR CONTROL. This task never force-merges, re-arms, disarms, closes, deploys,
    starts, stops or recycles anything. Manual squash/override remains available. The change is
    classification and lane release after an arm already passed every existing gate.
  design: |
    Extend `GateOutcome` so the stalled branch preserves whether any check is actually pending.
    In the post-arm `pollToGate` caller, an unchanged rollup with `pending.length === 0` returns a
    closed `awaiting_merge` outcome; a non-empty pending list and every red conclusion preserve
    today's blocked-CI outcome. Ledger the PR URL, head SHA, arm outcome, terminal check summary
    and the exact reason, bounded and credential-free.

    Add `awaiting_merge` to `RunResult` as a first-class non-merged verdict. Thread one explicit
    non-failure disposition through block reasoning, the single- and multi-lane drain paths and
    daemon result processing. It consumes no retry or fix strike, does not mutate the plan task to
    blocked, does not credit merge, and does not re-dispatch the same task in the current pass.
    The next tick re-derives open/merged state through the existing projection; no new GitHub read
    path is added. Include the verdict in the bounded run/retro vocabulary so telemetry can count
    it separately from real blocked CI.

    Keep all current fail-closed controls: a missing/unknown conclusion never becomes green, a
    genuinely pending quiescent rollup still stalls as blocked CI, a terminal red check still
    blocks immediately, and a closed-unmerged PR is not awaiting merge. Do not infer material
    merge from auto-merge being armed.
