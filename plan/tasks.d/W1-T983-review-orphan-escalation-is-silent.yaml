    THE GATE WAS PROVED ON THE SAME INVOCATION AS THE MINT, AND THE TWO OUTCOMES DIFFER. A fresh
    orphan pushed with a PLAIN refspec at the ALREADY-TAKEN refs/rmd-id/W1-T953 returned rc=1 with
    a real ref-level refusal, verbatim:
      ! [rejected]        31566816f1ebfc5c2cc5f89c61afdf9c0cbdf4ac -> refs/rmd-id/W1-T953 (fetch first)
    and that ref read fba95299cbd655085b504bd915612c57e6a8189e both BEFORE and AFTER — UNCHANGED.
    So the plain refspec's gate demonstrably refuses to clobber a taken id.
    THE MINT ITSELF WAS REFUSED FOR A DIFFERENT REASON, AND THE DIFFERENCE IS THE EVIDENCE. The
    push to refs/rmd-id/W1-T983 returned rc=1 with NO rejection line at all, verbatim:
      error: RPC failed; HTTP 403 curl 22 The requested URL returned error: 403
      send-pack: unexpected disconnect while reading sideband packet
      fatal: the remote end hung up unexpectedly
      Everything up-to-date
    The taken-ref probe reached a REF-LEVEL decision while this one died at the TRANSPORT, so the
    403 is the credential limit W1-T518 files and not evidence that 983 is taken. Readback returned
    0 lines and did not carry the nonce, while a control readback of refs/rmd-id/W1-T953 returned
    its sha — the query worked and the ref genuinely does not exist. The four-surface sweep is
    therefore the whole basis, and refs BLOCK only in the present direction: the namespace holds 80
    refs against 344 filed shards.
