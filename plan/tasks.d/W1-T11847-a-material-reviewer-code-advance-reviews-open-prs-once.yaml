- id: W1-T11847
  title: A material reviewer-code advance queues exactly one fresh review per affected open PR and prevents old reviewer-code evidence from gating merge
  repo: remudero
  depends_on: [W1-T11729]
  priority: 0.2
  type: implement
  verify: auto
  principles:
