      proof: 'grep: test("W1-T9828: an over-long Dependabot title is fitted keeping its dependency and versions" in test/an-over-long-dependabot-title-is-retitled.test.ts'
    - claim: "the fitted title parses to the same bump facts and semver level as Dependabot's original, so the lane's verdict is unchanged"
      proof: 'grep: test("W1-T9828: a fitted Dependabot title parses to the same bump facts as the original" in test/an-over-long-dependabot-title-is-retitled.test.ts'
    - claim: "the dep-review pass retitles the PR through the REST pulls endpoint, ledgers old and new titles with the PR, and holds without an own-red proposal"
      proof: 'grep: test("W1-T9828: dep-review retitles an over-long Dependabot PR and ledgers both titles" in test/an-over-long-dependabot-title-is-retitled.test.ts'
    - claim: "a title that cannot fit without cutting the dependency or a version is refused and ledgered, never truncated"
      proof: 'grep: test("W1-T9828: an unfittable Dependabot title is refused, never truncated" in test/an-over-long-dependabot-title-is-retitled.test.ts'
    - claim: "the title check re-runs on the edited title because pr-title-lint.yml fires on pull_request edited"
      kind: guard
      proof: "unit test: W1-T3781: title edits use a standalone commitlint workflow without widening the expensive CI trigger"
