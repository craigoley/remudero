  acceptance:
    - claim: "A question set is provider-neutral: yes/no, a choice of 2 to 255 typed options, or a score of 2 to 10 ordered levels, each with a name. A set outside those bounds, or with a duplicate name or option, is refused before any reservation"
      proof: "grep: W1-T12416 criterion 1 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "The OpenAI-shape backend sends the questions as an array and reads each answer in order: a yes/no probability, a choice distribution, a score distribution over its levels, or a native refusal. Typed option values keep their type"
      proof: "grep: W1-T12416 criterion 2 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "The Microsoft-shape backend sends the questions as an object keyed by name with a declared cannot-tell option, and reads the answers by name: the yes/no probability from its noul field, a choice from its probability map, and a score from its legend and index-keyed probabilities. A cannot-tell answer is an abstention"
      proof: "grep: W1-T12416 criterion 3 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "Each answer is a distribution over the declared options whose sum is inside TYPED_JUDGMENT_SUM_TOLERANCE, with its confidence, or an abstention, or a rejection with a reason. An out-of-set or badly summed answer is rejected and never coerced"
      proof: "grep: W1-T12416 criterion 4 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "A candidate is declared in the decision_models section of .remudero/mounts.yaml with its deployment name, request shape, price row and endpoint source. The endpoint source is the default cash endpoint and key, or the endpoint and key env of a named existing cashDeploymentEndpoints entry. The worker's own entry for the same deployment name is never read or changed"
      proof: "grep: W1-T12416 criterion 5 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "A candidate resolves with no new config keys: a config that has only today's keys resolves both declared candidates. A candidate whose named entry is missing, or whose key env is unset, is unavailable with a named reason and sends nothing"
      proof: "grep: W1-T12416 criterion 9 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "Each request reserves on its input size plus the small declared output margin, through sendCashRequest against the normal cap, and settles from the reply's usage at the candidate's own price row, which names its readAt and its source"
      proof: "grep: W1-T12416 criterion 6 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "Each request writes one decision.answered row: role, input digest, candidate, deployment, served model, latency, reserved and settled dollars, usage, question count, and each question's distribution, abstention or rejection. A refused or failed request writes the same row with its reason"
      proof: "grep: W1-T12416 criterion 7 in test/review/a-decision-model-answers-typed-questions-in-one-cash-request.test.ts"
    - claim: "rmd decisions probe sends one question set about one input to a named candidate and prints the row it wrote. Nothing else calls a decision model"
