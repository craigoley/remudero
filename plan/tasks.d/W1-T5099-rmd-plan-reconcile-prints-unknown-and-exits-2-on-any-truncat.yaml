- id: W1-T5099
  title: "`rmd plan-reconcile` PRINTS UNKNOWN AND EXITS 2 ON ANY TRUNCATED BOARD READ, BUT `fetchBoardPrsRest` (src/lib/open-prs-rest.ts) SETS `truncated` WHENEVER THE CLOSED WALK REACHES `BOARD_MAX_PAGES` (5000 rows) AND THIS REPO HAS 6582 CLOSED PRS, SO `creditProjectionWithReadState` (src/run-task.ts) REPORTS `unknownReason: truncated` ON EVERY COLD RUN AND THE VERB IS UNUSABLE SINCE W1-T5029; the walk is sorted by `updated_at` descending, so the oldest row it read is an exact coverage floor that costs no extra call — expose it as `closedFloor`, let the verb treat a closed-only truncation WITH a known floor as a named CAVEAT (exit 0) and withhold only the flips whose merged PR the board never read, while a FAILED read, a truncated OPEN half and a gateway that cannot name a floor stay UNKNOWN exit 2"
