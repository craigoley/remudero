  falsifier: |
    Delete the `closedFloor` assignment in the walk and the first, second and eighth tests redden (no floor), and the verb falls back to UNKNOWN on every run again, which is exactly the defect. Make the projection ignore the open half (`openTruncated`) and the open-half test reddens. Drop the `unreadPrIds` filter in `planReconcileCommand` and the --write test reddens on a write for the withheld shard. Make the accessor consult `readTruncated` first on the failed arm and the failed-read control reddens on its spy. Widen the exit code to 2 on a CAVEAT and the third and fourth tests redden on `code === 0`. The real-seam pair (the second and eighth tests) is the only place a real gateway walks 50 recorded pages, so a fake that returns `closedFloor` by hand cannot prove the walk produces it: both are needed. CLOSE IF the verb already treats a closed-only truncation as non-UNKNOWN, or if W1-T5100 or a snapshot-commit change has already made a cold truncated read unreachable on this repo.
  note: |
    RISK: high because src/run-task.ts holds the verb whose write is a one-way `status: merged` and src/lib/status.ts is the gateway every status reader shares. band_meaning is `span`, honestly: the build crosses three layers of ONE data path (the REST walk, the gateway accessor, the verb), but each layer gains one field or one reader of it and no layer changes another's behaviour; no subsystem outside that path is touched. The change loosens exactly one thing, a verb that always refused on a truncated read now proceeds on a closed-only truncation, and it pays for that by withholding the one detectable wrong-flip class and by naming the lower bound.
    The fixtures to copy: test/board-gateway-truncation.test.ts (the `fillerRow`/`creditingRow` REST rows, the pinned `FULL_PAGE_SIZE` 100 and `MAX_PAGES` 50, `fetchBoardPrsRest` with a fake `GhApiFetcher`, and a real `buildBatchedGithub` whose `exec` is the recorded-response seam serving `api repos/<o>/<r>/pulls?state=closed&sort=updated&direction=desc&per_page=100&page=N`), and test/plan-reconcile-fails-loud-when-its-github-read-fails.test.ts (`run` capturing stdout and stderr, `withLedgerRoot`, and the real-gateway projection test, whose `buildBatchedGithub("o", "r", { exec })` plus `creditProjectionWithReadState({ root }, root, builder, github)` is the default seam shape). Serve 50 full closed pages with strictly decreasing `updated_at`, one open page shorter than a page, and pass `commitTrailerIndex: () => new Map()` to the gateway so no git read happens; use a fake builder only to supply two reconcilable rows, one whose url is on a served page and one that is not, and let the REAL `prByRef` decide which is unread. Do NOT edit either fixture file; the new suite is its own file. Existing pins that must not move: test/plan-reconcile-fails-loud-when-its-github-read-fails.test.ts (its truncated case uses a gateway with no coverage accessor, so it must stay UNKNOWN, which is what the no-accessor arm preserves), test/board-gateway-truncation.test.ts, test/plan-reconcile-credit-parity.test.ts, test/the-plan-reconciler-runs-on-a-cadence.test.ts. docs/cli-reference.md is generated from the command registry and the one-line `detail` is NOT changed, so no regen.
    Use the literal phrase "the GitHub CLI" in any new comment or message; never the bare two-letter command name.
