  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-10-01 at origin/main 926efe8c2 by reading source with `git show origin/main:<path>` (src/lib/open-prs-rest.ts, src/lib/status.ts and src/run-task.ts are byte-identical between 03a0843dc and 926efe8c2). The GitHub-side figures (6582 closed PRs, 52 REST calls, a page-50 floor of 2026-08-18T02:49:29Z with about 1582 closed PRs unread) are the sibling draft W1-T5100's measurement through a GET-only REST shim and are used here as given; I could not re-run them (no network read of the board from this sandbox). W1-T5100 is a sibling draft with a provisional id; its WINDOW-SHORT report (merged shards whose git evidence fell outside the two git scan windows) is a different set and is not duplicated here.

    (1) THE DEFECT. `creditProjectionWithReadState` (src/run-task.ts) sets `unknownReason` to the gateway's failure reason when `readState()` is 'failed' and to the literal "truncated" when `readState()` is 'ok' and `readTruncated()` is true. In `fetchBoardPrsRest` (src/lib/open-prs-rest.ts) BOTH walks set `truncated = true` when `page === BOARD_MAX_PAGES` (50 pages of 100). A cold closed walk on a repo holding 6582 closed PRs always reaches page 50 with a full page, so `readTruncated()` is true on every cold read, and the projection builds a cold gateway with no `snapshotCache`. `planReconcileCommand` exits 2 on any `unknownReason`, so the verb prints UNKNOWN on every run, dry run and --write. A constant answer carries no information: it cannot tell a real gap from the healthy steady state. That is this repo's recurring defect (a bound that fires on a healthy condition).

    (2) WHAT THE BOARD READ IS ACTUALLY USED FOR IN THE CREDIT ROWS. I read `buildCreditCandidates`, `creditCandidatesFromProjection`, `creditEvidenceFor`, `creditIsReconcilable`, `deriveStatus` (src/lib/status.ts) and the batched gateway. The fields of a board row the credit path consumes are `number`, `url`, `state`, `headRefName` and `body` (PrRef via `asRef`); nothing else (`autoMergeRequest`, `headRefOid` are not credit inputs). The consumers are exactly these:
      (a) rung (a): `prByRef(<ledger pr.opened url>)` and rung (b): `prByRef(task.pr)`: both are a lookup in the board's `byUrl` index, there is NO per-PR fetch, so a PR the walk did not read returns null and the rung falls through;
      (b) rung (c): `mergedTrailerLookup` greps the merged rows' BODIES for an anchored `Remudero-Task:` line and, on a body miss, falls back to `commitTrailerFallback`, which is `buildCommitTrailerIndex` over the WHOLE of git history (no `-n`): a task with a trailer commit is `merged` whatever the board holds;
      (c) rung (c2): `mergedHeadBranches` / `findMergedByHeadBranch` over merged rows' `headRefName`;
      (d) in `buildCreditCandidates`: `mergeBodies` from `baseGithub.prByRef(prUrl)` feeds `prerequisiteOnlyMergeBody` (W1-T4078's subtract-only refusal), and `mergedCreditsFor` (`listMergedHeadBranches`) feeds `creditHasOtherBuildMerge`;
      (e) `creditIsImplementation` and `creditHasBuildDiff` come from the two LOCAL git reads (`MERGE_SUBJECT_SCAN_LIMIT`, `MERGED_PATHS_SCAN_LIMIT`), never from the board.
    Because the walk is `sort=updated&direction=desc`, a PR the walk did not read has `updated_at` at or before the last row read, hence `merged_at` at or before it. THE CONSEQUENCE, stated as the three ways a missing old row can matter: (A) a credit that only a body trailer, a head-branch match or a ledger/`pr:` lookup would have supplied is missed, so a shard that did ship is skipped as `not-credited-merged` (an UNDER-count, never a wrong flip); (C) the `creditHasOtherBuildMerge` rescue is missed (also an under-count); (B) a row whose credit arrived through the commit index has `mergeBodies` unset for its PR, so `prerequisiteOnlyMergeBody` returns undefined and cannot subtract: THIS is the one way a truncated read can produce a WRONG flip (a one-way `status: merged` write). Truncation in general is therefore a LOWER-BOUND problem for the printed count plus one narrow wrong-flip class that is exactly detectable per row (`prByRef(row.prUrl)` is null).

    (3) THE POPULATION, MEASURED FROM GIT (a script over `git ls-tree` of plan/tasks.d, `git show` per shard, `git log origin/main --diff-filter=A --name-only -- plan/tasks.d` for each shard's first-add commit and `git log origin/main --format='C %cI%n%B'` for each task's first anchored `Remudero-Task:` trailer commit; the script was a scratch probe, deleted afterwards): 221 queued, non-retired shards. Against the sibling's floor (2026-08-18T02:49:29Z): 204 were first added on or after it, 6 before it (W1-T239 2026-07-22, W1-T365, W1-T503, W1-T526, W1-T926, W1-T413), and 11 have lowercase file names my add-commit listing did not map (ids W1-T4791 and above, so recent by reservation order: NOT resolved by date). Of the 6 older shards, 5 have no commit trailer at all and W1-T413 is the one older trailered shard (its first trailer commit is 2026-08-10, merge #1602 is the docs close-out the credit declines). 43 queued shards carry a trailer commit (the sibling counted 44; I did not reconcile the one-shard difference), and only 1 of the 43 (W1-T413) has it before the floor. A first-add date is NOT a safe lower bound on a crediting merge by itself: 5 of 1632 shards that have both a trailer commit and a first-add commit were built up to roughly 7 hours BEFORE their shard's add commit (W1-T2532, W1-T2663, W1-T3029, W1-T3067, W1-T4569). The floor moves about one day per day (6582 closed PRs over 79 days is 82 a day; the sibling measured about 121 commits a day), so the 6 older shards become 6 + (every queued shard that ages past about 44 days) and grows with the healthy backlog.

    (4) THE THREE OPTIONS, DECIDED.
      (a) A floor accessor with UNKNOWN only when the floor is newer than the oldest queued shard the verb is judging. REJECTED AS THE EXIT GATE: the 6 pre-floor shards above (oldest 2026-07-22) make the floor newer than the oldest queued shard TODAY, so the verb would exit 2 on every run again, and the count of such shards rises with ordinary backlog age: a gate that fires on a healthy condition, with a date proxy that is itself unsafe (the 7-hour pre-add builds, and 11 shards whose add commit I could not map). THE ACCESSOR ITSELF IS KEPT, as the data the caveat and the safety check read.
      (b) A bounded raise or an incremental/snapshot read. REJECTED, for four measured reasons. `BOARD_MAX_PAGES` is one module constant shared by every board consumer, so a raise changes `readTruncated()` for the five other callers listed in (5) at once and loosens gates that are not this task's (a change of this size also cannot be proven per-caller here). The runway is short: 6582 closed PRs against a 10000-row cap at 82 to 121 a day is 28 to 42 days. The cost is paid on every cold read: 100 closed pages plus the open half is about 68 calls instead of 52, +16 calls at the transport pacer's 1500 ms minimum gap (src/lib/github-transport.ts) is about 24 more seconds per read, and `defaultCreditedMergedIds` (the cadence rung, `buildMeasurementCadenceDaemonHooks`) builds a cold gateway on every tick. And the snapshot route cannot start on this repo: `restFetchHalf` and `applyMergedOutcome` both skip `snapshotCache.commitClosed` when `truncated` is true, so a snapshot of a truncated walk is never committed and a delta never has a base. Lifting that guard is a serve-board change with its own risk and is out of scope.
      (c) A named CAVEAT with exit 0. CHOSEN, with (a)'s accessor as the mechanism. The reason it is sound is (2): truncation only OMITS rows, so for every shard whose evidence is a commit trailer (the repo's own durable record, read over all of history) or a PR the walk read, the printed decision is exact; for the others the count is a LOWER BOUND, which the verb now says in words instead of printing a bare count (before W1-T5029 it printed the same count silently), and the one wrong-flip class, (2)(B), is closed by withholding exactly the rows whose merged PR was not read.
    COST. The floor is the `updated_at` of the last row of the page that hit the cap, a value already in hand: ZERO extra REST calls, zero extra bytes (the cold read stays 52 calls, about 78 seconds at the 1.5 s pacer gap if each page is paced, which I did not verify). The rate-limit consideration is therefore unchanged: one cold read per verb run, the same shared transport read cadence (180 seconds in src/lib/github-transport.ts, advisory for multi-read sweeps), no hot re-read added.

    (5) EVERY CALLER OF `readTruncated()` (grep over src, scripts, hooks, bin, .github at origin/main), and what this task does to each: NONE CHANGES. `readTruncated()` keeps its OR of the two halves and its return value; the new accessor is a separate method consulted by exactly one caller.
      - src/lib/status.ts `deriveStatus`, durable-credit arm (`readFailed() || readTruncated()` marks `indeterminate` on an already-credited row): unchanged.
      - src/lib/status.ts `deriveStatus`, no-GitHub-evidence arm (the same pair defers an absence conclusion, W1-T415): unchanged; this is also why every UNproven task in the credit pass already carries `indeterminate` today, and the candidate rows are filtered to `merged` projections so the verb never reads it.
      - src/lib/trace.ts `undecidable` verdict (`readFailed() || readTruncated()`): unchanged, still undecidable under truncation.
      - src/lib/board.ts `safeQueueTruncated` (a throwing accessor reads as truncated): unchanged.
      - src/lib/console-projection-worker.ts (forwards `readTruncated` into the console's gateway view): unchanged.
      - src/run-task.ts `creditProjectionWithReadState`: THE ONE CALLER THAT CHANGES, and only on the arm "ok and truncated".
      The sweep (src/lib/sweep.ts) never calls `readTruncated()` itself; it reaches truncation only through `deriveStatus` inside `buildCreditCandidates`, rows 1 and 2 above. `defaultCreditedMergedIds`, the cadence rung's projection, reads only `.ids` and ignores `unknownReason` today; it is not changed (see design (v)). Also noted, not fixed: on this repo every one of those other consumers is on its truncated arm permanently (a finding of this analysis; not verified in production).

    (6) W1-T75 (the lint's duplicate-surface advisory): it shares src/lib/status.ts and src/run-task.ts only because it hoisted operator corrections inside `deriveStatus`; it touches no gateway accessor, no REST walk and no reconcile verb, and this task does not change `deriveStatus`. The advisory keys on `files:` only and ignores `plan_refs`, so it persists after this citation; it is an operator ruling on W1-T75 (retire it if it is already built), not something narrowing `files:` here would honestly clear.

    (7) NOT MEASURED, SAID PLAINLY. (a) The verb itself end to end (it needs the ledger, config and network) including that it exits 2 UNKNOWN on every run today: this follows from the source and the sibling's gateway probe. (b) How many of the 43 trailered queued shards, and of today's 38 reconcilable ones, rest on a PR whose `updated_at` is before the floor (a merge date is only a lower bound on `updated_at`); my git-side figure is 1 (W1-T413). (c) Whether any PR body on this repo carries a `Remudero-Task:` line that the squash commit's trailer lacks: that population is the (2)(A) under-count and is invisible without the board. (d) The pacer applying to each page.
  design: |
    (i) src/lib/open-prs-rest.ts: `BoardFetchResult` gains an optional `closedFloor?: string`. In `fetchBoardPrsRest`'s closed loop, in the same arm that sets `truncated = true` (`page === BOARD_MAX_PAGES` after a full page), assign a local `closedFloor` the `updated_at` of the LAST row of that page: the walk is `sort=updated&direction=desc`, so the last row is the oldest read. Return it only when set. The open loop never sets it, `mapBoardPr`, `BOARD_MAX_PAGES` and the page sizes are untouched, no extra call is made.
    (ii) src/lib/status.ts: the `GitHub` interface gains `readBoardCoverage?(): { openTruncated: boolean; closedFloor?: string }` beside `readTruncated?()`. The batched gateway keeps one more local, `lastClosedFloor`, written in `restFetchHalf`'s closed branch from `fetched.closedFloor` (cleared when the closed half is not truncated) and CLEARED in `applyMergedOutcome`, whose worker result carries no floor, so a worker-applied truncated read reports NO floor and the verb stays UNKNOWN rather than reading a stale one. The accessor calls `index()` first exactly as `readTruncated()` does (asking it first is still accurate) and returns `closedFloor` only when `lastClosedTruncated` is true and a floor is recorded. `readTruncated()` and `lastFetchTruncated` are not touched.
    (iii) src/run-task.ts `creditProjectionWithReadState`: the 'failed' arm is checked first and unchanged (`readTruncated` is still not asked on it). On 'ok', when `readTruncated()` is true the projection asks `gateway.readBoardCoverage?.()`. If that returns `openTruncated === false` and a `closedFloor`, there is NO `unknownReason`; the projection instead carries `boardFloor` (that value) and `unreadPrIds`: the ids in `ids` whose candidate `prUrl` the gateway's `prByRef` returns null for (the PR was never read; null-safe when a gateway has no `prByRef`). In every other truncated case (the accessor is absent, `openTruncated`, no floor) `unknownReason` stays the literal "truncated". Both new fields are omitted when absent, the same omit-when-absent shape `unknownReason` has, so every existing deep-equality assertion on the projection is byte-identical. `PlanReconcileDeps.creditedProjection`'s return type gains the same two optional fields; an injected `creditedMergedIds` has neither.
    (iv) `planReconcileCommand`: after the UNKNOWN arm, remove `unreadPrIds` from `credited` BEFORE `reconcilePlan` (so a withheld shard is never written, and a --write run writes exactly the judged remainder). After the stdout summary (printed byte-identically to today's renderer over the remaining ids) and when `boardFloor` is present, write one stderr line: `### rmd plan-reconcile: CAVEAT — the closed-PR board read stopped at its page cap: PRs last updated before <boardFloor> were not read, so the count above is exact for every shard credited by a commit trailer or by a PR read since then and a LOWER BOUND for any shard credited only by an older PR's body or branch`, followed, only when `unreadPrIds` is non-empty, by `; <N> flip(s) withheld because their merged PR was not read and its body could not be checked: <ids, at most 20, then (+K more)> — flip them by hand after reading the PR`. Log `plan.reconcile.board_floor` with the floor and the withheld count. The exit code is 0. The CAVEAT is not an UNKNOWN: every id it names is one the read could not prove, and none is written.
    (v) THE RULES THAT MUST SURVIVE, each pinned by a test: a FAILED read is still `UNKNOWN` exit 2 with nothing written (W1-T5029's control, with the failure reason, and without asking `readTruncated`); a truncated OPEN half, a gateway with no `readBoardCoverage`, and a truncated read with no floor are still `UNKNOWN (truncated)` exit 2; an untruncated readable read, and an empty readable projection, are byte-identical to today's (exit 0, empty stderr). `defaultCreditedMergedIds` still returns the plain `Set` of `.ids`, unreachable by the new fields: the cadence rung never consulted `unknownReason` and does not gain the withhold (it flipped on a truncated read before W1-T5029 too); giving it the withhold is a separate task and is named, not done.
    (vi) INTERACTION WITH THE SIBLING W1-T5100 (provisional id, the WINDOW-SHORT report). This task should land FIRST: until the verb can run at all on this repo, the sibling's output is unreachable, and the sibling's design (iv) already says its line must also print on the UNKNOWN arm because the verb is otherwise stuck behind it. `depends_on` is empty because either order is correct; after both land the sibling's UNKNOWN-arm clause stays (a failed read, an open-half truncation and an accessor-less gateway still produce UNKNOWN) but stops being the common path. The two edits sit in the same two functions: expect a mechanical merge (this task's CAVEAT block goes after the stdout summary and before the return; the sibling's WINDOW-SHORT block goes at the same place, so print CAVEAT first and let the sibling's exit-2 rule decide the code). The sets are disjoint: WINDOW-SHORT names merged rows with NO git evidence (`creditIsImplementation` and `creditHasBuildDiff` both undefined, so `creditIsReconcilable` is false); `unreadPrIds` names reconcilable rows whose PR the board did not read. Neither task changes a git scan window.
    (vii) COMMENT LOAD. src/run-task.ts is at its comment-load ceiling, and src/lib/status.ts and src/lib/open-prs-rest.ts each carry a row in scripts/comment-load-baseline.json: the edit ADDS NO NET COMMENT LINES in any of the three files. Any comment this adds is paid for by tightening one of the touched function's own, and the new exported names carry no doc block beyond one line. Run `node scripts/comment-load-ratchet.mjs` and `node scripts/source-size-ratchet.mjs` before the first push.
    (viii) NOT IN SCOPE, NAMED. Raising `BOARD_MAX_PAGES` or any page size; letting `commitClosed` run on a truncated walk (the snapshot route); listing the queued shards that predate the floor by name (a date proxy is unsafe, rationale (3)); the cadence rung's withhold; any change to a git scan window or to `reconcileShardStatus`; the permanent truncated arm of the other five consumers on this repo.
