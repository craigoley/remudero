  rationale: |
    READ 2026-10-07 on origin/main f43378343 and the open heads of W1-T6122 (run-W1-T6122-1791347357000, 6590df350)
    and W1-T6123 (run-W1-T6123-1791348460000, 0ebe8b64d). Static reading only; no hostile tree was built anywhere.
    W1-T6123's `WIDENED_SITE_EXCEPTIONS` (test/every-host-git-spawn-into-a-worktree-uses-the-hardened-leaf.test.ts at
    that head) gives src/lib/sweep.ts 7 and src/lib/worker.ts 28, and names the WORKTREE ones; W1-T6122's head leaves
    every one of them raw (it converts headIsInWorktree, readBaselineRatchetWorktreeState and excludeNodeModulesFromGit
    only). Counting W1-T6123's own `widenedGitSites` per top-level function at origin/main:
    SWEEP.TS. renumberPlanPrIds 1 (its `git = (cwd, args) => run("git", ["-C", cwd, ...args])` helper) cuts `wt` with
    `worktreeAdd(repoDir, wt, …, "origin/<headRefName>")`, i.e. at the PR's own head, then runs `mv`, `add -A`,
    `commit` and `push --force-with-lease` there. worker.ts `worktreeAdd` sets `config --worktree core.hooksPath
    hooks` on every tree it cuts, so that commit runs the PR's TRACKED hooks/pre-commit and hooks/commit-msg, and the
    push the PR's hooks/pre-push, as the daemon with its push credentials, outside any sandbox. planRepairGitRun 1
    (`spawnSync("git", args, { cwd })`) is the reservation runner reservePlanRepairTaskId binds to that worktree.
    rebaseDirtyFleetBranchViaGit 1 (`run(cwd, args)` over `defaultDirtyFleetRebaseGit`) cuts a raw `worktree add
    --detach <wt> <pr.headSha>` and runs `rebase origin/main`, `rebase --abort`, `push --force-with-lease` and
    `ls-remote` in it, all raw; that tree gets no `core.hooksPath` of its own, so its hooks are whatever the managed
    checkout's config names, resolved against the PR tree when relative — UNVERIFIED on the host (no host access at
    filing). buildSweepEffects's 4 address the managed checkout (CHECKOUT, not this task).
    WORKER.TS. wireCredentialHelperSocket 1 (its default `writeConfig` is `git -C cwd config --worktree …`) and
    credentialHelperSocketWired 1 (`spawnSync("git", ["-C", cwd, "config", "--worktree", …])`): W1-T5115 added the
    second because a later spawn lands in a worktree a worker ALREADY wrote, so both read and write config through
    whatever gitdir that tree's `.git` pointer names. laneWorkKeepReason 3 (`for-each-ref`, `rev-parse --git-dir
    --git-common-dir`, `rev-list` on `-C path`, then `--git-dir <dirs[1]>`, a path the pointer chose) and
    defaultLaneListGit 1 (`{ cwd }`) are the lane reaper's reads of trees an agent session wrote. The other 22
    worker.ts sites (worktreeAdd/worktreeAddAsync, worktreeRemove, pruneStaleRuns, branch reads) address the managed
    checkout and are W1-T6122's HARNESS record, not this task.
  design: |
    The builder owns the shape; constraints: (1) every site named above runs through `hostWorktreeGit` /
    `hostWorktreeGitAsync` (src/lib/worktree-git.ts) when it addresses the PR-head or worker tree, and stays raw only
    where the same helper addresses the managed checkout (`repoDir`), each such call recorded with that reason;
    a helper that serves both is split at the call, never classified as a whole. (2) A commit or push in a PR-head
    tree runs the HARNESS's hooks (the leaf's `HOST_HOOKS_DIR`, and the push leaf's harness pre-push gate), never the
    tree's tracked hooks/; rebaseDirtyFleetBranchViaGit's raw `worktree add --detach` either cuts through
    `worktreeAdd` so the leaf can pin a recorded gitdir, or relies on the leaf's unrecorded structural arm, and the PR
    says which. (3) The credential-helper writer and reader refuse a tree whose pointer the leaf refuses
    (`WorktreePointerRefusedError`) rather than writing config elsewhere; a refused reaper read KEEPS the lane
    (`work-undecidable`), never reaps it. (4) Lower `WIDENED_SITE_EXCEPTIONS` for both files to exactly what is left,
    each remaining reason CHECKOUT with its function named; argv, outputs and error shapes are otherwise unchanged.
  acceptance:
    - claim: "on a fixture plan PR whose head carries a hooks/pre-commit and hooks/pre-push that each write a marker, renumberPlanPrIds commits and pushes to a fixture bare remote without either marker being written, rebaseDirtyFleetBranchViaGit, on a fixture checkout whose config sets core.hooksPath=hooks, rebases and pushes without running the head's hooks, a credential-helper wiring call on a worktree whose .git pointer names a planted gitdir is refused without writing that gitdir's config, and the lane reaper keeps a lane whose pointer it refuses"
      proof: "unit test: test/sweep-and-worker-git-calls-into-a-pr-head-tree-go-through-the-leaf.test.ts"
  falsifier: |
    At the W1-T6123 head, renumberPlanPrIds' commit in the worktreeAdd-cut fixture runs the head's hooks/pre-commit
    (core.hooksPath=hooks) and writes the marker, and wireCredentialHelperSocket writes credential.helper into the
    planted gitdir's config.worktree, so the test fails.
  notes: |
