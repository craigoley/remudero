  design: |
    1. NEWEST-FIRST, STOP AT THE CAP. Read the live file first, then rotations in descending cut order, never a rotation
       cut before sinceTs. Rows inside one file keep their file order. Keep a file's newest rows that fit; once the byte
       or row cap is reached, open no further rotation. Emit the retained rows OLDEST-FIRST as today (every miner and
       `parseLedger` expect that order). Dedupe keeps the newest copy of an identical line, as today.
    2. SAME ROWS. On any corpus whose rotations sort by cut stamp, the new read returns byte-identical `ndjson` and the
       same `rowsKept` as the current oldest-first read; the test proves it against the current implementation kept as
       a reference in the test.
    3. HONEST TRUNCATION. A read that stopped early cannot count the rows it never opened. Keep `droppedRows` /
       `droppedBytes` for rows read and not kept, and add `unreadRotations` (count) and `unreadRotationBytes` (on-disk
       bytes) plus the oldest kept row's ts. `reportRetroLedgerTruncation` writes them on `retro.ledger_read.truncated`
       (existing fields unchanged in meaning), and `retroLedgerScopeNote` says "N older rotation(s) were not read", so the
       report never presents a cut window as complete (the W1-T3229 contract).
    4. ORDER YOU CANNOT PROVE, YOU DO NOT ASSUME. A rotation with no parseable cut stamp makes the pass fall back to the
       current oldest-first walk for that read and say so on the row (`order: "oldest-first-fallback"`, with the name).
    5. MEASURED IN PRODUCTION. Every retro read writes one row (step constant beside the truncation step, e.g.
       `retro.ledger_read`) with rotations_opened, unread_rotations, rows_read, rows_kept, bytes_read and ms, so the
       saving per retro is visible and a later task can tune from it. No new threshold, env var or cap: the caps stay
       RETRO_LEDGER_MAX_BYTES and RETRO_LEDGER_MAX_ROWS.
    6. TESTS in test/learning/the-retro-ledger-read-stops-at-its-cap-newest-first.test.ts (`rmd test-place` on a stub
       importing retro.ts and ledger-union.ts printed test/learning/ at medium confidence; re-run it on the real file),
       with gzip and plain rotation fixtures plus a live file, counting opened files through the union's io seam.
       `test(` titles verbatim as in the proofs.
