  rationale: |
    WHY: Craig approved the Inbox gardener in shadow mode, with act mode after a clean day of shadow rows. Its job is
    the finished-task asks stuck in the Inbox (verify-human, machine-judge, proof-debt ids). Today it can never reach them.
    OBSERVED on the host 2026-11-18 11:35Z, daemon on main with W1-T13586:
    - inbox.gardener_pass rows 07:27Z, 07:56Z, 09:46Z, 10:47Z: state pending, gaps [], evaluated 8 each, retired 0, judged 0.
    - state/inbox-gardener.json: 16 entries, every one an adoption: id, and cursor.after
      "adoption:script-no-invoker:scripts/credit-surface-gate.mjs:..." at position 9 of 2,429 sorted proposal ids.
    - The registry (state/inbox-proposals.json) holds 2,429 proposals: adoption 553, followup 461, verify-human 422,
      proof-debt 405, machine-judge 312, verify-human-automate 238, others 38.
    READ at origin/main, runInboxGardener: the cursor stores generation, a digest over every candidate's semantic input,
    and resumes only when the new pass's generation matches. Any one proposal change anywhere between passes resets the
    start to the first id. With passes about an hour apart and the registry changing within that hour, 32 evaluations
    touched 16 ids and the sweep never passes the adoption prefix.
  design: |
    INVARIANT cursor-past-end-wraps: when no candidate sorts after the cursor's id (the tail was removed), the pass
    starts at the first id, as it does today.
    1. Resume after cursor.after by id, whatever the stored generation. The generation stays in the cursor as a record.
    2. Nothing about a decision changes: each candidate's own digest (store.entries) still decides whether it is re-read,
       re-proven or re-judged, and every retirement still needs its fresh capture and proof.
    3. "complete" now means the sweep reached the last id. An id added behind the cursor mid-sweep waits for the next
       sweep, which starts at the first id. At 8 candidates a pass a full sweep is about 304 passes; the per-pass
       bound is unchanged here.
  falsifier: |
