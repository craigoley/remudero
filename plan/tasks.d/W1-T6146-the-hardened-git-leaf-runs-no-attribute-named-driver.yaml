- id: W1-T6146
  title: "THE HARDENED GIT LEAF RUNS NO ATTRIBUTE-NAMED DRIVER — HOST_GIT_CONFIG overrides fsmonitor, hooksPath, sshCommand, pager, protocol.ext and gpg, but not filter.<driver>.clean/smudge/process or merge.<driver>.driver; a tracked .gitattributes names the driver and the leaf deliberately keeps the pinned gitdir's own config, which a codex worker can write through its --add-dir git roots, so a leaf add, status, diff or rebase can run a command the worker chose, as the daemon"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — which config-defined programs a hardened host git call may execute
  band_meaning: span
  origin: "operator session 2026-10-07: raised by W1-T6121's builder (PR #9794); premise verified read-only on origin/main 0fffd033d and the W1-T6124 head before filing"
  plan_refs: [W1-T6106, W1-T6124, W1-T2754, W1-T2699, W1-T6133]
  files: [src/lib/worktree-git.ts, test/the-hardened-git-leaf-runs-no-attribute-named-driver.test.ts]
