  note: "verify:auto — real concurrent calls against real files, machine-checkable without an operator.
    risk:high — it guards the credential path every dispatch depends on. Lock too widely and every
    dispatch serializes; lock too narrowly and the store is recreated under a running lane, which
    presents as flaky auth rather than as a lock bug.
    budget_usd 60 — one lock around one branch, a converge-on-winner path, a stale-lock takeover and a
    real-concurrency falsifier.
    NO depends_on: this is independently correct and independently valuable — the provisioning race is
    reachable TODAY whenever a daemon boot overlaps a spawn, which the existing password-write comment
    already names. It does not wait on lanes.
    THIS TASK NARROWS W1-T326's BLOCKER (1) RATHER THAN CONTRADICTING IT. The entry said concurrent
    lanes 'would share one keychain' and that the failure 'would present as flaky auth'. Both remain
    true; what the source shows is that sharing is only dangerous across the provisioning branch, which
    is a lock, not a redesign."
