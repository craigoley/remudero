- id: W1-T12953
  title: "A full-fallback author run on the Mac is priced by what it runs, so a change the selector cannot model no longer needs 20 GiB free to run a static stage measured at 256 MiB"
  repo: remudero
  priority: 0.7
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # it changes when the local author gate admits a run; a reserve set too low lets a run fill the disk
  band_meaning: span
  origin: "operator ask 2026-11-15: \"How do we reduce the need for that much space? How do we make this more efficient?\""
  plan_refs:
    - W1-T10765
    - W1-T10947
    - W1-T12505
  files:
    - scripts/lib/mac-author-admission.mjs
    - scripts/preflight-author.mjs
