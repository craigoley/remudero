  falsifier: |
    Keep worker_lines as it is on main: the replay reports 1 lane-holding and 3 lane-less, and the first two tests
    count 2 and 1 where they expect 1 and 0. Attribute by ppid to the lock's pid instead of by cwd: the last test's
    review, whose parent is the lock's pid (the daemon), disappears from the census.
