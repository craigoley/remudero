  rationale: |
    OBSERVED in the core daemon's live ledger (/mnt/rmd/state2/state/ledger.ndjson on the fleet host, read-only,
    2026-10-11). The `deploy.restart_refused` row at 17:08:02.368Z (run DEPLOY-1791738482360, backend
    recycle-container) says "REFUSING — 1 lane-holding and 3 lane-less worker(s) still in flight after 3000s" and
    lists the lock W1-T8038.lock and three "lane-less" processes:
      - pid 31971, 3117 s old: `/usr/local/bin/claude --output-format stream-json ... --max-turns 400 --max-budget-usd
        10`. This is W1-T8038's own implement worker (its parent is the lane holder), already counted by the lock.
      - pid 173795, 5 s old: `node /usr/local/bin/codex exec ... -c default_permissions="rmd_review" ...
        -C /tmp/rmd-review-vCp2FT/checkout -`, a review of #10919.
      - pid 173802, 5 s old: `/opt/remudero-image-clis/node_modules/@openai/codex-linux-x64/vendor/.../bin/codex exec`
        with the same arguments. This is the native child of 173795, the same review.
    So 1 lane plus 1 review read as 1 + 3.
    READ on origin/main 8bcbc3e10, deploy/recycle-container.sh:
      - worker_lines (:1411-1420) is `ps -eo pid,etimes,args` filtered by
        `claude --output-format|codex exec|node .*run-task[.]ts[[:space:]]+retro`. It reads no ppid and no cwd, so
        it cannot tell a lane's own worker from a lane-less one, or a wrapper from its child.
      - The drain loop (:1775-1800) counts locks into `n` and then every worker_lines row that is not a frozen
        daemon child into `lane_less_busy`. oldest_inflight_age_s (:1722) and the refusal's listing (:1849) read the
        same rows.
    The double count does not change whether the drain waits (a lock alone keeps it waiting). It makes the
    refusal misreport what blocked it, and any adaptive wait or retry built on these counts (the sibling retry
    task filed with this one) would read inflated numbers.
    DEPENDENCY: W1-T7691 (queued, in flight on run-W1-T7691-1791725745046) edits the same script (the cadence-child
    record before `docker stop`). Serialized after it.
  design: |
    Operator rulings: no hard thresholds; nothing below adds a constant.
    1. ONE ROW PER WORKER TREE. worker_lines reads `pid,ppid,etimes,args`. A matching process whose parent chain
       (inside the container's process list) reaches another matching process is the same worker and is dropped,
       so a codex node wrapper and its native binary are one worker. Keep the outermost one, whose etimes is the
       worker's age.
    2. A LANE'S OWN WORKER IS THE LANE'S. A worker whose working directory (`/proc/<pid>/cwd`, read in the container)
       is inside the worktree of a lock this loop counted is that lane's worker. It is already counted in `n`, so
       it is not lane-less. Match the worktree with the same rule holder_worktrees (:1602) uses (`run-<key>-*`,
       `sweep-<key>-*`, `fix-branch--` keys), in the container's path space (STATE_MOUNT_DEST). Do NOT attribute by
       ppid to a lock's pid: a lock's pid can be the daemon itself (W1-T6597's fix claim was pid 110's own), and
       then every daemon child, reviews included, would vanish from the census.
    3. A worker that cannot be attributed stays lane-less busy, as today. The asymmetry stands: when in doubt, wait.
    4. The refusal names each worker once, with its attribution (`lane <taskId>` or `lane-less`), so the counts in
       the message add up.
    Tests (new file, `test(` titles verbatim as in the proofs below) drive the script with a fake `docker` on PATH,
    as test/a-stall-recycle-reclaims-only-what-a-frozen-daemon-holds.test.ts does. Replay 17:08:02Z: one
    W1-T8038.lock, a claude worker whose cwd is inside run-W1-T8038-<epoch>, and a codex node wrapper with its
    native child whose cwd is /tmp/rmd-review-<x>/checkout.
