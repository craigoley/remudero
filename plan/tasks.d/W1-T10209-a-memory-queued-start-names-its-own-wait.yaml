  rationale: |
    OBSERVED source at 7733faf8163295b9ad9ae1e9156f683b6e362c5b: awaitMemoryAdmission
    joins its maintained ranked waiting array before worker assignment. Only the ranked head
    enters the evaluation/lock branch that emits enforce_wait. A non-head waiter changes
    lastKey to queued and sleeps without an attributable row for its own run. Its later admit
    can split elapsed time by queued, but a still-pending start has no such terminal evidence.

    A private controlled diagnostic through the shipped test-run admission acquired host slot
    1/2 serially and completed 3 tests/3 pass/0 fail/skip/cancel/todo. It observed two entries in
    the actual maintained queue, one positive head wait row, no row for the second request,
    no reservation effects and exact own abort cleanup. Shadow and non-daemon controls left
    roots and queue untouched. This diagnoses an observability gap, NOT the cause of a live
    review delay, a committed regression fix or native/full-author assurance.

    PR12930's first normal review materialized at 13:04 UTC without a worker assignment in
    the bounded archive/live window. Normal daemon recovery reported its owner dead and
    posted a replacement pending review at 14:18:38 UTC; that review materialized at 14:19.
    Other runs have positive memory-pressure wait rows, but they do NOT establish either
    PR12930 run's cause. Presence, D-state or a mounted checkout hash is not worker health
    or proof of loaded code. Preserve the current normal review; never reclaim from age.

    Subject research parsed all 4445 main plan records and inspected actual subject blobs at
    main and all 12 captured OPEN heads with admission, spawn and W3969-title controls.
    W3969 bounds the already-started semantic worker; W9780/W9814 detach/respect held actions;
    W9969 identifies and cancels only a fix action's own admission; W10033 measures gardener
    process start. W10208 separately governs new-validation readiness, not queue attribution.
    Own source overlaps on PR12936 and PR12894 concern duplicate-unfiled classification and
    dependency credit, not this gap. No source ownership or universal absence is inferred.
    Refresh merged credit, every open-head subject and dispatch ownership before building.
  design: |
    Add diagnostic evidence at the EXISTING ranked admission transitions, not a new observer,
    queue, poll, scanner, provider call or live setting. A queued non-head request must name
    its own pre-spawn phase before sleeping, bound to real supplied run/task identity and a
    stable per-invocation discriminator. Missing identity is explicit unknown; do not invent
    a PR/head, credential or actor. Avoid prompts, content, secrets and extra host walks.

    Distinguish queued-behind-rank from the evaluating head's measured refusal or lock wait.
    Name only ordering facts available from the same existing rank calculation; do not copy
    the head's pressure reasons onto another request. Preserve the original wait start and
    existing reason-split accounting. Do not claim queueing means execution, provider work,
    healthy progress, a known root cause or permission to run.

    Emit once at entry/meaningful phase transition, not on every backoff tick; keep per-start
    state bounded and remove it on all existing outcomes. Repeated queued ticks must not grow
    a process-global history or produce unbounded duplicate rows. Telemetry failure remains
    diagnostic only: it must not become a fits verdict, fail-open start, extra reservation,
    changed wait or thrown admission failure. Exercise the maintained default private ledger
    writer and its real failure path, not only an all-fake log sink.

    Do not change class weights, ordering/aging, tiers, pressure estimates, backoff, locks,
    reservations, cancellation/deadline, fairness, uncertainty/error semantics or any bounds.
    Shadow/off and non-daemon starts retain their existing effects and no new root/queue read.
    Existing human owner/admin override, service scopes and trusted flow remain unchanged.
    No status posting, claim reclamation, duplicate review, worker stop/restart, latch clear,
    deployment, policy activation, required-gate waiver or scheduler belongs to this task.

    Freeze assertions and delete only the production queue-evidence change: actual non-head
    attribution must fail while head/order controls continue passing. Restore exact bytes and
    measure on a committed tree; verify every changed source SF and catch/default coverage.
    Record actual author/hosted outcomes separately. A future live effect needs exact loaded
    source and independent per-run evidence; merging this task alone cannot certify recovery.
