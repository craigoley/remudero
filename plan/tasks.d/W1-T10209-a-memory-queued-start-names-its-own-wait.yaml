    attribution. The real non-head evidence assertion fails, not a loader or missing-file wrapper.
    Emit the head's refusal reasons for the queued start or write every tick: truth/boundedness
    assertions fail. Make a failing writer alter the admission result: the failure-path control
    fails. Restore exact committed source and obtain complete verified-file summaries. Preserve
    every failed/setup receipt; unknown production causes remain unknown.
