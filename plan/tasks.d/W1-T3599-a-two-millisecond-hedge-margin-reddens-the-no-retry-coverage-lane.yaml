- id: W1-T3599
  title: "A 2ms HEDGE/TIMEOUT MARGIN IN ONE FIXTURE REDDENS THE LANE THAT HAS NO FLAKE RETRY — `codex-capacity-singleflight`'s `timeoutMs: 5` schedules the hedge spawn 2ms before the exchange aborts, so a late timer drops the second spawn and fails an assertion about something else entirely"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: low
  band_meaning: blast-radius
  budget_usd: 3.00
  files: [test/codex-capacity-singleflight.test.ts]
  origin: "operator-session#openweight-model-economics-2026-09-15"
  plan_refs: ["W1-T3207", "W1-T1041", "W1-T2904"]
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-15, not inferred from a single red.

    `test/codex-capacity-singleflight.test.ts`'s "failure backoff is capped at ten seconds even when
    the success cache is longer" fails intermittently at `assert.equal(spawns, 2)`, reading 1.

    THE MECHANISM, read from the source rather than guessed. The fixture passes `timeoutMs: 5`.
    `codexCapacityHedgeDelay` returns `Math.min(CODEX_CAPACITY_HEDGE_DELAY_MS, Math.max(1,
    Math.floor(timeoutMs * 0.6)))`, so the HEDGE spawn is scheduled at 3ms while the exchange aborts
    at 5ms — a 2ms window. The second spawn the assertion counts IS that hedge. Node guarantees no
    such timer precision, so under coverage instrumentation on a loaded runner the 3ms timer can fire
    after the 5ms abort has already resolved the exchange, and the hedge never spawns.

    RATES, same command, same fixture, arms differing only in that one literal:
      timeoutMs 5   (2ms margin)  -> 3/40 failures on origin/main's own blob; 5/88 cumulative
      timeoutMs 200 (80ms margin) -> 0/20 failures
    Positive control on every arm: `--test-name-pattern` reported `# tests 1`, so each run genuinely
    selected this test and a zero is a measurement rather than an empty query. The 0/20 arm is
    consistent with the diagnosis but is NOT by itself proof of a fix at that sample size; the
    implementation owes a larger arm.

    WHY IT COSTS MORE THAN ONE RED. `ci.yml` carries OPERATOR RULING 1 (2026-08-28), "NO FLAKE RETRY
    IN THIS JOB", for the coverage lane, with its reasoning recorded inline: the retry re-ran the
    whole suite and four of six two-pass runs were cancelled against the time bound, converting a
    `failure` that named the assertion into a `cancelled` that named nothing. That ruling is correct
    and this task does not touch it. The consequence, though, is that one flaky fixture reddens
    `coverage-shard (N/4)` AND `coverage-ratchet` on the first pass, with no second chance — and the
    ratchet's downstream message is `expected coverage-shard-N artifact metadata`, which reads as an
    infrastructure fault and has already cost two separate sessions a misdirected diagnosis.
  design: |
    (i) RAISE THAT ONE FIXTURE'S `timeoutMs` so the hedge/abort margin is far outside timer jitter.
    The measured arm used 200 (hedge 120ms, margin 80ms); any value whose `floor(t*0.6)` sits well
    below `t` will do, and the implementation should justify the number it picks rather than copy
    this one.

    (ii) THIS WEAKENS NOTHING, AND THE RECORD MUST SHOW WHY, because a raised number in a fixture is
    exactly what a relaxed bound also looks like. The assertion under test is the TEN-SECOND BACKOFF
    CAP, and that is driven by the fixture's INJECTED clock (`now = 9_999`, then `now = 10_000`),
    not by wall time. `timeoutMs` governs only the unrelated per-exchange abort. Every existing
    assertion — `spawns` 2 then 3, `kills` 3, `readable` false then true, and the `/failure backoff/`
    detail match — is preserved byte-for-byte. No assertion is deleted, no test skipped, no baseline
    moved.

    (iii) PROVE THE RACE IS GONE BY MEASUREMENT, not by one green run. Report a failure count over a
    stated number of repetitions on both the old and new margin, each with the `# tests 1` positive
    control, so the fix is evidenced the same way the defect was.

    (iv) OUT OF SCOPE: `codexCapacityHedgeDelay`, `CODEX_CAPACITY_HEDGE_DELAY_MS`, and every other
    production path in `src/lib/worker-provider.ts`. Making the hedge deterministically injectable
    would be a better long-run design and is deliberately NOT this task — the defect is that one
    fixture chose a timeout too small for its own hedge, and widening into production code to fix a
    fixture would trade a bounded change for an unbounded one.

    (v) EXPECT THE MARGIN CHECK TO JOIN `source-text-assertion-census`. Asserting the property means
    reading the suite's own `timeoutMs` literals, which is a source-text assertion and is censused.
    That is a recorded membership, not a reason to abandon the approach — but run
    `rmd census-membership --base origin/main` and the named census suite before pushing, rather than
    discovering it on a coverage shard.

    (vi) ALSO OUT OF SCOPE: adding flake retry to the coverage job. `ci.yml`'s operator ruling refuses
    it with recorded measurements, and a task that quietly re-added it would be overturning an
    operator decision under cover of a flake fix.
  acceptance:
    - claim: "the fixture's hedge spawn is scheduled a margin outside timer jitter from its own exchange abort, asserted as a property rather than left to a literal a later edit could silently shrink again"
      proof: "unit test: every singleflight capacity fixture leaves its hedge a margin outside timer jitter"
    - claim: "the margin is checked for every capacity fixture in the suite, not only the one observed failing, so a sibling fixture cannot reintroduce the same race unnoticed"
      proof: "unit test: the hedge-margin check reads every timeoutMs in the suite and not a single fixture"
  # NOTE ON PROOF SHAPE, for whoever builds this: neither criterion may be proved by the FLAKY test
  # itself. It passes at the merge base most of the time (measured 37/40), so a proof naming it
  # cannot discriminate and `proof-discrimination` would refuse the implementation PR. The claim
  # that survives is the MARGIN PROPERTY, which is deterministic and false at the base. The
  # "nothing else changed" half is a falsifier below, not a criterion, for the same reason: a
  # preservation claim is true at the base by construction and can never discriminate.
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF THE FIXTURE NO LONGER PASSES A SMALL `timeoutMs`. Re-run before
    building: `grep -n 'codex-singleflight-ten-second-cap' -A 1 test/codex-capacity-singleflight.test.ts`.
    A `timeoutMs` whose `floor(t*0.6)` already sits far below `t` means this was fixed elsewhere and
    the precondition is gone.

    AND THE FIX MUST BE SHOWN TO CHANGE THE RATE, NOT JUST TO PASS ONCE. A single green run is not
    evidence about an intermittent failure and must not be reported as one. State repetitions and
    failures for both margins.

    AND NO ASSERTION MAY BE REMOVED, RELAXED OR RETITLED. Diff the fixture: only the `timeoutMs`
    literal may differ. If `spawns`, `kills`, `readable` or the `/failure backoff/` match changed,
    the task has drifted from fixing a race into loosening a test, and must be reverted.

    AND DO NOT TOUCH THE COVERAGE JOB. If the implementation edits `.github/workflows/ci.yml`, it is
    the wrong change: this task removes a race in one fixture and asserts nothing about CI policy.
  note: |
    FILED 2026-09-15 from an OpenWeight session in which this fixture reddened `coverage-shard (4/4)`
    on PR #5601 and took `coverage-ratchet` down with it. It was measured rather than assumed: the
    same fixture was run 20 times against `origin/main`'s own `worker-provider.ts` blob and 20 times
    against the PR's, to establish that the flake is pre-existing and not the PR's doing.

    ID SWEEP: `rmd next-task-id --reserve` REFUSED in that container — it cannot enumerate open PRs
    without the GitHub CLI, and it declines to claim atomically while that surface is unreadable
    (the W1-T2316 reissue). Printing returned W1-T3599 as a floor across tasks.yaml, shards, remote
    plan and history. The open-PR surface was therefore swept by hand instead: 5 open PRs
    (#5598, #5592, #5590, #5587, #5586), highest id claimed W1-T3596, none claiming W1-T3599 or
    W1-T3600. No `refs/rmd-id/` ref was hand-forged to work around the refusal. If this id turns out
    to be contested, this record renumbers — the loser of a race renumbers, and the reservation is
    never deleted.
