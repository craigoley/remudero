- id: W1-T3319
  title: "ONE TASK'S THROWN EXCEPTION EXITS THE WHOLE DAEMON AS A CRASH — both `summary(\"error\")` sites in drain.ts wrap a single `runOne`, so EVERY drain-level error is already a per-task failure, and exit 1 is reachable by nothing else; MEASURED five times, taking RestartCount to 4 of 5"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 10.00
