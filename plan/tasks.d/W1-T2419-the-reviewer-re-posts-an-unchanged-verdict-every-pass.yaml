- id: W1-T2419
  title: "THE REVIEWER RE-POSTS AN UNCHANGED VERDICT AS A NEW COMMENT ON EVERY SWEEP PASS — the post-review row admits on `checksState green && reviewState none`, `reviewPostRefusedFor` deliberately checks only `review.post_refused` because a delivered post is assumed to flip the live rollup, and NOTHING anywhere compares the verdict about to be written against the one already standing; the commit status is last-write-wins and costs nothing to rewrite, but the comment APPENDS, so #3140 accumulated ten byte-identical failure comments in twelve minutes on one unmoved head"
