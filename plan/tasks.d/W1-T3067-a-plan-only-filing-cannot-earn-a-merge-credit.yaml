- id: W1-T3067
  title: "THE PLAN-ONLY CREDIT REFUSAL IS KEYED ON A LEDGER ROW THAT ROTATES AWAY, SO IT FAILS OPEN AND A FILING EARNS A MERGE CREDIT — `isPlanOnlyFilingPr` needs a `pr.opened` row carrying `plan_only: true`, the live ledger retains only 200 such rows, and older rows never carried the field at all; the MERGE COMMIT'S OWN CHANGED PATHS are ground truth, are local, and are already classified by `isInPlanScope`"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 18.00
  files: [src/lib/status.ts, test/a-plan-only-filing-cannot-earn-a-merge-credit.test.ts]
  origin: "operator-session#4461-closed-by-a-filing-credit-2026-09-07"
  plan_refs: ["W1-T413", "W1-T3063", "W1-T2794", "W1-T75"]
