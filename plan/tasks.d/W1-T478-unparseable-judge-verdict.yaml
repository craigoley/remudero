  design: "(i) **THE VOCABULARY ALREADY HAS ROOM, AND THE MODULE ALREADY CONTRADICTS ITSELF ABOUT
    WHICH NUMBER TO USE.** `src/lib/risk-judge.ts` has THREE fail-closed-ish paths and they do not
    agree:
      - `FAIL_CLOSED_VERDICT` (unparseable output) -> `{verdict: high, confidence: 1}`.
      - the catch branch inside `assessRisk` (judge unavailable, spawn error, timeout) ->
        `{verdict: high, confidence: 0}`.
      - `parseRiskJudgeVerdict` on a PARSEABLE verdict whose `RISK_CONFIDENCE` line is missing -> 0,
        and its own doc comment states the rule as \"never assume high confidence that was never
        stated\".
    Two of the three already report 0 for a confidence nobody stated, and the module's stated rule is
    the 0 rule. The unparseable path is the outlier against its own file. `test/risk-judge.test.ts`
    pins both sides today — one test asserts `confidence, 1` for unparseable output and another
    asserts `confidence, 0` for absent confidence.

    (ii) **THE CONSUMERS, ENUMERATED — THE BLAST RADIUS IS SMALL AND THE MEASUREMENT SAYS SO.**
    Outside `src/lib/risk-judge.ts` there is EXACTLY ONE consumer in the whole tree: `src/run-task.ts`
    (control: the same symbol grep over `scripts/`, `apps/`, `docs/` and `bin/` returns nothing, while
    `src/` returns 7 hits). `verdict` and `confidence` are read in exactly three places:
      - `planRiskJudgeAction` — branches on `verdict.verdict === \"high\"` FIRST and RETURNS, so for
        any high verdict `confidence` is NEVER consulted for the decision, only formatted into the
        `reason` string. The `confidence < threshold` branch is unreachable for a high verdict.
      - `run-task.ts`'s `escalate` callback — interpolates both into the issue `summary`, i.e. the
        title a human reads.
      - `runRiskJudge`'s `log(\"risk_judge.decision\", …)` — the ledger row.
    The dispatch call site branches ONLY on `riskJudgeResult.action.kind === \"escalate\"`; it never
    reads `verdict` or `confidence` at all. **SO CHANGING THE CONFIDENCE ON THE UNPARSEABLE PATH
    CHANGES NO CONTROL FLOW ANYWHERE — it still escalates, via the `high` branch, and the arm is
    still withdrawn.** That is a measured fact about this option, not a prediction.

    (iii) **THE OPTIONS. CHOOSE ONE; DO NOT BUILD MORE THAN ONE.**
      (a) KEEP `verdict: high`, REPLACE `confidence: 1` with a number that does not claim certainty
          (0 is what the sibling catch branch and the module's own doc already use). Cheapest by the
          measurement in (ii): no control flow moves, the issue title changes for free because it
          interpolates the field, and the ledger row stops asserting certainty. Costs: it makes the
          two fail-closed paths indistinguishable FROM EACH OTHER (both become high/0), and it leaves
          `verdict: high` still reading as a finding.
      (b) A DISTINCT OUTCOME (`unparseable`, `judge_error`) that STILL ESCALATES but is queryable
          apart from a genuine high-risk finding. Most honest and the only option that makes the
          ledger answerable by query rather than by string-matching a reason. Costs: it widens
          `RiskJudgeVerdictLabel` beyond `\"low\" | \"high\"`, which `VALID_VERDICTS` also gates, and
          `planRiskJudgeAction` needs a branch — small, but a real type change with tests pinned to
          the two-label shape.
      (c) LEAVE THE FIELDS, FIX ONLY THE ISSUE TITLE AND BODY so a human sees the cause first. Costs:
          it repairs the human path and leaves the LEDGER — the thing every later analysis reads —
          still asserting a maximum-confidence finding. **AND IT IS THE ONLY OPTION THAT REQUIRES
          TOUCHING `src/run-task.ts`** (see the `files:` note), which is an argument against it here
          beyond its merits.

    (iv) **THE CAPTURE, AND WHERE THE TEXT ACTUALLY IS.** The seam is `realRiskJudge`: it does
    `parseRiskJudgeVerdict(result.text)` and DROPS `result.text` on the same line. That is the only
    place the raw output exists. `parseRiskJudgeVerdict` is a pure text->verdict function that returns
    `FAIL_CLOSED_VERDICT` without the text, so the excerpt has to be carried either on the verdict
    shape or captured at `realRiskJudge`. Establish which; do not do both. **THE PRECEDENT TO COPY IS
    #1584's**: `REPORT_EXCERPT_CAP = 4000` and `capStderrExcerpt` in `src/lib/worker.ts`, plus its
    \"absent, never empty\" discipline — a truly empty response must carry NO field rather than an
    empty one, because an absent field and an empty one answer different questions. That distinction
    is the whole point here: an empty judge response and an off-contract prose response are the two
    hypotheses nobody can currently separate.

    (v) **REDACTION: ANSWERED — NO REDACTION IS NEEDED, AND THE REASON IS STRUCTURAL RATHER THAN A
    POLICY.** Verified at today's sha, not from memory: `RiskJudgeChange` has exactly two fields,
    `description: string` and `files?: string[]` — no diff, no patch, no hunks. The call site passes
    `description` as the task title plus the PR url, `files` as `task.files`, `gatesState` as review
    state / capped flag / ci / arm-decision reason, and `planContext` as task id, title and type.
    `buildRiskJudgePrompt` renders nothing else and states \"YOU ARE NOT SHOWN A DIFF\" in the prompt
    itself. **AND THE JUDGE HAS NO TOOLS**: `RISK_JUDGE_TOOLS` is `[]`, and `worker.ts` applies it
    (`if (args.tools) options.tools = args.tools` — an empty ARRAY is truthy, so the restriction is
    real and the judge cannot read the worktree it is spawned in). So the judge cannot obtain code it
    was never given, and everything it CAN echo is already public in the PR or already in the ledger.
    **THE BOUND IS INHERITED, NOT OWNED** — it holds only while `RiskJudgeChange` carries no patch and
    `RISK_JUDGE_TOOLS` stays empty. Record that in the code beside the excerpt, so a later change to
    either is confronted with the excerpt it would start leaking through.

    (vi) NOT IN SCOPE: whether the judge should be shown a diff (that is W1-T454's territory), the
    confidence threshold's value, the escalation's issue class, and whether an unparseable response
    should escalate at all — it should, and this task keeps that."
