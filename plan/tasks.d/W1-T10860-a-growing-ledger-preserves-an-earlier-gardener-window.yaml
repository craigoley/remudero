  design: |
    The collector keeps its declared through clock fixed for the entire capture.
    Both monetary and worker-call accumulation share that fixed window.
    Qualify ordinary valid arrivals later than that cutoff against a separately observed read clock,
    then exclude them from both accumulators before they can invalidate the earlier captured window.
    Do not slide or stretch the published window, borrow another generation, or turn missing prices
    into zeros. Genuine future timestamps relative to the read observation must still refuse; do not
    blanket-ignore every later timestamp. Preserve malformed and unreadable-source refusals, exact
    repository/generation/parent joins, cancellation, generation recheck, replay deduplication and all
    existing scan, identity and64KiB ceilings. Optional call coverage cannot crowd valid money out.
    Physical default-path controls qualify the append boundary and preserve true-future refusals.
    Use real temporary files, the default union/capture path and advancing clock controls for concurrent
    parent, price, assignment and attempt appends. Keep a frozen earlier positive window with known money
    and matched calls. Exercise ordinary no-append reads, malformed/unreadable/foreign/generation-change
    and cancellation negatives, unknown prices, duplicate receipts and existing size-boundary cases.
    Remove the source correction and require the append controls to fail, then restore and pass them.
    Extend the two existing physical suites; new code uses package aliases and the common root helper.
    Normal native author, stored acceptance, source-positive coverage, census, semantic review, hosted
    security/tests and protected merge gates remain. No new model or gardener pass may manufacture evidence.
    No provider, permissions, spending setting, action capability, service/restart/deployment, CI or
    Azure-memory policy change is part of this task. The original117/9 Inbox identities and captured
    original reply remain separate; do not replay or close them through this technical finding.
    Any release requires an actual recorded native ruling and all normal implementation gates.
