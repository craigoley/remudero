  rationale: |
    READ 2026-09-23 (research): state/adoption-latest.json lists unreferenced exports and the matching proposals retire
    themselves when the finding clears, but nothing deletes the export. Deleting code carries more risk than the other
    gardeners, so it is last, small-batch, and fully judged.
  design: |
    (i) One class, DELETE-UNREFERENCED-EXPORT: a symbol the scan has reported unreferenced across two scans, with no
