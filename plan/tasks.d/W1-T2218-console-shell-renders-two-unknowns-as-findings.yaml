  note: |
    RISK BAND FROM RULE 19's SPAN, AND THE BAND EXEMPTS THE CHECK RATHER THAN CLEARING IT.
    `sizingViolation` (`src/lib/task-linter.ts:196`) returns `undefined` at `risk: high` on its
    FIRST line — "Rule 19 exemption — high already assumes wide scope" — so the span was NEVER
    SCORED. Scored honestly it is TWO stems, `serve` and `console-shell-unknowns`, which is one
    source file and its co-located test and would not have tripped `risk: medium` either. The band
    is set from BLAST RADIUS: this is the surface an operator reads before dispatching, and a wrong
    fallback here misleads the person deciding whether to spend.

    NO PROOF GREPS THIS SHARD'S OWN PATH. All five criteria use the pure-path `unit test:` form
    naming `test/console-shell-unknowns.test.ts`, declared in `files:` and not yet existing — a
    forward reference to a PATH, never a guessed symbol.

    THE SWEEP'S COVERAGE GAP WAS FOUND AND CLOSED RATHER THAN REPORTED AS A CLEAN ZERO. A bulk
    fetch of every head created 95 refs against 134 on the remote, leaving 39 unswept; those were
    fetched explicitly and swept, giving 134 of 134. The subject reads zero on every head and on
    main, with a control on the same refs and the same query returning 41 hits for a subject that
    does exist.

    ONE ID SURFACE UNDER-CREDITS BY CONSTRUCTION AND IS LABELLED. The anchored trailer scan
    `^Remudero-Task:\s*<id>\s*$` reads 1 for W1-T1127, a BUILT task, and 0 for W1-T1289, a plan
    filing that is demonstrably on main — so a zero on that surface is evidence about builds, never
    about filings.
