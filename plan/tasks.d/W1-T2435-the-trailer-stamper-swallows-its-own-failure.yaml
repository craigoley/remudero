    - claim: "the stamp stays best effort and no caller fails because the trailer did not land"
      proof: "unit test: test/trailer-stamp-failure-is-recorded.test.ts"
    - claim: "no task id is derived from a branch name anywhere on this path"
      proof: "unit test: test/trailer-stamp-failure-is-recorded.test.ts"
  falsifier: |
    If a fresh sweep of `acceptance-author-gate` failures finds no plan-tracked `run-*` PR whose
    `no-header` failure persisted beyond the seconds a stamp needs to land — measured the way this
    shard measured it, by the GAP from the failing gate run to the next successful one on the same
    branch, and NOT by counting `no-header` failures, which over-counts by fourteen to one — then the
    stamp is not failing at a rate worth recording and this task should be closed rather than
    implemented. A count of gate failures is not a count of stamp failures, and treating them as the
    same number is the specific error this shard exists to have already made and corrected.

    SEPARATELY DECISIVE: if `ensureTaskTrailer` stops wrapping its read and write in a single bare
    `catch`, or if `acceptanceAuthorTimeCheck` stops short-circuiting on a trailer, the mechanism
    named here is gone and the finding must be re-derived rather than trusted.
