    `parts.distinct_tasks`; this task's saving is read there per generation.
  design: |
    1. One parsed plan per plan revision: the daemon keeps a single shared, frozen Plan for the current revision (keyed
       by the plan blob sha the loader already reads), and the boot, active, sweep-hook and lane readers take that
       instance instead of re-parsing or copying. A lane that needs a different revision gets that revision's one
       instance; an instance with no holder is released.
    2. The tick read never sends the plan: the worker loads (or receives once per revision) the plan by revision key
       and the request carries only the key, so read-plane.ts no longer structuredClones a Plan per request.
    3. Readers that mutated their plan copy (if the builder finds any) get an explicit copy at that site, named in the
       PR; the shared instance is frozen so a missed one throws in tests.
    4. Proof in production: daemon.memory `parts.distinct_tasks` p50 over one generation after the fix's boot_head_sha
       falls to about one plan's task count. No new constant.
    Tests go in test/the-daemon-holds-one-parsed-plan.test.ts, titled verbatim as in the proofs.
