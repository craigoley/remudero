    READ at origin/main 3ce249c80 (symbols, not lines):
    - src/run-task.ts's daemon command keeps `activePlanRef = { current: plan }`; the boot plan is also closed over by
      the sweep hooks; each in-flight lane keeps its own synced plan (runTask); the dispatch phase's snapshots hold one
