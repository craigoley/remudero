  rationale: |
    On 2026-11-05 the host registry, which is both the recycle catalog and (once a recycle passes
    RMD_INSTANCE_REGISTRY) the active selection, marked core `mode: shadow` (remudero-ops #3). A
    16:58Z recycle selected it, and so did later ones. From then until the 21:07Z live recycle,
    every arm and merge on core logged automerge.shadow_refused (sweep.ts ~:2977) and nothing else:
    no escalation, no Remudero issue, no status note. Operators saw green, reviewed PRs sit unmerged
    for hours and spent the session hunting other causes.
    W1-T11431 separates the catalog from the active selection, and W1-T11434 lets a deliberately
    shadow core still merge its one selected plan PR. Neither tells an operator that the PRIMARY
    instance is refusing merges, and shadow mode may be intended, so the signal must be one durable
    notice, not noise.
    Reviewer-required operator-path scope: review #5807754178 on source 573c8ada4d1
    (2026-11-06 22:15Z) found that projectPlan retains the original escalation.issue_opened
    task identity after the displayed digest changes, and the actual MANUAL action emits
    panel.manual_approved, which the channel does not consume. Include src/lib/status.ts for
    the published-digest projection and src/lib/now-decisions.ts to retain the issue's MANUAL
    action class when that projected task identity changes. Include src/lib/board-projection.ts:
    its W1-T9436 now-view retention contract discards rows without a reader retention rule.
    The published binding must survive a later ordinary row for the same task; test the actual
    retained projection as well as the direct board. The existing operator action writer
    remains unchanged; test its real route and consume its actual successful action event.
    A physical sketch with the existing closure imports plus the real projection, retained board,
    decision, service and panel-action imports computes test/console-api/ at high confidence
    (console-read-model, runner-up deploy-host). Move only that closure test's folder, retaining
    its basename, criterion markers, claims and existing assertions. Keep the budget and
    acceptance semantics unchanged. No production or test implementation changes in this amendment.
    Cadence clarification: review #5807178636 on source 920a3120cfc (2026-11-06 21:22Z)
    rejected DEFAULT_POLL_INTERVAL_MS as an unrelated idle-poll delay. The existing escalation
    module has no pre-existing body-edit timer to reuse. Define the intended mutation bound using
    the existing sweep pass lifecycle instead: immediate first notice, durable pending PR sets,
    one coalesced changed-body flush per pass, with failed work retried on the next ordinary pass.
    The acceptance claims, four-file scope, budget and recovery/acknowledgement semantics stay intact.
  design: |
    When the primary instance (registry `primary: true`) refuses an arm or merge because of shadow
    mode, open ONE escalation through the existing escalate.ts / Remudero Issues channel. It names
    the instance, the selection source (registry path and digest when readable, never secret
    values), the time the refusals began, and the count and list of refused PRs. Later refusals
    update that same escalation in place and never open another while that episode remains open.
    Coalesce body edits at the existing sweep pass boundary; unchanged content remains a no-op.
    The first notice attempt is immediate. Persist subsequent refused-PR observations before
    deferring their changed body to the pass boundary or the next ordinary pass. A failed or
    interrupted flush leaves durable pending work for the next pass, never a false delivery.
    Bound body-write attempts by this existing pass lifecycle, not by an idle-poll timer or a new
    duration. Keep the existing awaited gateway and serialized episode ownership.
    It closes itself, with a closing note, on the first pass where the primary
    instance is live or the refusals stop because W1-T11434's lane merged the candidate. An
    operator's existing mark-handled acknowledgement silences updates for the current selection
    digest only: a changed selection re-opens the alert. Non-primary shadow instances keep today's
    quiet row. No fixed thresholds: the escalation opens on the first refusal of a pass and its
    update cadence follows the explicit pass-boundary coalescing above. No new duration threshold,
    background timer or scheduler is introduced.
  acceptance:
    - claim: "A primary instance's first shadow-mode arm or merge refusal opens exactly one escalation naming the instance, selection source and refused PRs; later refusals update that one escalation, and a non-primary shadow instance opens none"
      proof: "unit test: test/deploy/a-primary-instance-in-shadow-mode-raises-one-alert.test.ts"
    - claim: "The escalation closes when the primary instance is live again, and a mark-handled acknowledgement silences it only for the current selection digest"
      proof: "unit test: test/console-api/a-primary-shadow-alert-closes-on-live-mode.test.ts"
  note: |
    The builder names each criterion test with the marker "W1-T11444 criterion N" so the reviewer can map tests to criteria.
  falsifier: |
    Keep only the quiet automerge.shadow_refused row. Criterion 1's test must then fail, because no
    escalation is opened for the primary instance.
    Remove pass-boundary coalescing: several distinct refusals in one pass cause repeated body
    writes and the cadence regression fails. Omit the later flush: the durable changed PR set never
    reaches the same issue on the next ordinary pass and its update regression fails.
