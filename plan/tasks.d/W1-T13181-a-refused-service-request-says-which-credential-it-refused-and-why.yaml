  rationale: |
    WHY: the console cannot mark an inbox thread read. Every read mark it sends is refused with 401, and the
    row that records the refusal says only the method and the path, so nobody can tell whether the console
    sent no credential, a stale token, or a token serve does not know.
    MEASURED, core ledger (2026-11-16 13:18Z to 14:35Z):
    - serve.demand: /v1/i/:instance/inbox/thread/read n 15, all 4xx; /v1/inbox/thread/read n 1, 4xx.
    - service.unauthorized rows: 17 for POST /v1/i/core/inbox/thread/read (13:28:25Z to 14:24:18Z), 1 for
      POST /v1/inbox/thread/read (13:18:38Z) and 2 for POST /v1/i/core/inbox/thread/reply (13:36Z, 13:37Z).
      These are 401 answers (src/lib/service.ts:1042-1044). No service.forbidden row in the window.
    - One thread/reply in the 13:48Z window answered 2xx, and inbox-intent-receipts holds a settled reply
      receipt from 13:48:28Z. Earlier read receipts (2026-11-07, 2026-11-08) are settled with status 200.
      So the instance-scoped write route works; the refused requests carry a credential serve does not accept.
    - The console sends both writes from one function with RMD_CONTROL_WRITE_TOKEN (remudero-console
      lib/repo-dashboard.ts:2240-2262). Why the read mark is refused and the reply was not cannot be read
      from the ledger.
    - /v1/views/agent also fails in the same rows, for a different cause (W1-T13180).
    READ at origin/main ef8b74910:
    - src/lib/service.ts:1039-1045 grantedScopes over the providers (operator session, bearer tokens, others);
      when none grants, it logs service.unauthorized with { method, path } and nothing else.
    - src/lib/instance-inbox-contract.ts:47 mounts inbox/thread/read as a write route; its own refusals
      (400, 403, 409) come after authentication and are not what the console gets.
  design: |
    INVARIANT no-secret-on-the-row: a refusal row names credential kinds, provider names and fixed reason words only.
    INVARIANT logging-grants-nothing: the status and body of every refused request are unchanged.
    1. Each provider in service.ts may return a refusal reason beside "not granted": no_credential,
       unknown_token, malformed_header, expired_session, unknown_session, unverified_access. The bearer
       provider says unknown_token when an Authorization bearer is present and matches no configured token.
    2. service.unauthorized gains presented (the credential kinds the request carried: bearer,
       operator_session, access, none) and refusals ([{ provider, reason }]). ledger-steps.ts documents the fields.
    3. No change to which requests are granted.
    4. Tests drive createService with the real providers and assert the row fields, and grep the row text for
       the test token values to prove none appears.
  falsifier: |
    Keep { method, path } only: criteria 1 and 2 fail. Put a token prefix or digest on the row: criterion 3
    fails. Grant a request that was refused: criterion 4 fails.
  note: |
    Id reserved for run-unfiled-1794838967000 with ~/rmd-work/bin/reserve-id.sh.
    The fix of the read marks themselves waits for this row: once a refused read mark says unknown_token or
    no_credential, the operator or a follow-up task fixes the console's credential or core's token set.
    Proof that counts in production: the next service.unauthorized row for /v1/i/core/inbox/thread/read
    names presented and a reason.
