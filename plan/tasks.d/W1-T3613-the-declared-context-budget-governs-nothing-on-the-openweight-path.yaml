- id: W1-T3613
  title: "THE DECLARED CONTEXT BUDGET GOVERNS NOTHING ON THE OPENWEIGHT PATH — inbox_draft declares context_budget 180000 and ships a 259,181-token prompt, which silently excludes every deployment with a smaller window"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: blast-radius
  budget_usd: 5.00
  files:
    - src/lib/worker-provider.ts
    - test/an-open-weight-provider-rides-the-capability-ladder.test.ts
  origin: "operator-session#openweight-trial-2026-09-15"
  plan_refs: ["W1-T3569", "W1-T3598", "W1-T3608", "W1-T3546"]
  status: merged
  attempts: 0
  note: |
    MEASURED 2026-09-15 against the live Foundry account, with the adapter's own request builder.

    `.remudero/mounts.yaml` declares `synthesis.inbox_draft` with `context_budget: 180000`.
    NOTHING READS IT on the openweight path: `contextBudget` appears nowhere in
    src/lib/worker-provider.ts or src/lib/inbox.ts, and the adapter performs no truncation. The
    prompt is built by `inboxDraftPrompt(proposal, currentPlanText, runId)` and
    `currentPlanText` is the WHOLE of plan/tasks.yaml, read at src/run-task.ts:35630.

        plan/tasks.yaml            1,029,974 bytes
        full inbox_draft prompt    1,026,154 chars -> 259,181 prompt_tokens as counted by Azure

    So the declared budget understates the real prompt by 44%, and the number in the mount is
    decoration rather than a bound.

    THE CONSEQUENCE IS A SILENT DEPLOYMENT FILTER, NOT A ROUNDING ERROR. Probed with the exact
    URL, api-version and body the adapter builds:

        gpt-5-nano     -> HTTP 200, prompt_tokens 259181
        gpt-oss-120b   -> HTTP 400
           "The input (259242 tokens) is longer than the model's context length (131072 tokens)."

    `gpt-oss-120b` therefore CANNOT serve this lane at all, and no reading of the mount says so --
    its `context_budget` claims 180000, which would fit inside 131072 only if it were enforced.
    W1-T3598's ordering (nano leading) is load-bearing for a reason its own record does not state:
    the demoted candidate is not a fallback here, it is unreachable.

    AND THE FALLBACK IS THEREFORE FICTIONAL. `selectOpenWeightModel` takes the first
    syntactically-valid candidate with no existence, context or compatibility check (W1-T3608), so
    the trailing `gpt-oss-120b` that W1-T3598 deliberately kept "reachable as a fallback" would, if
    ever reached, fail every request.

    A SECOND, ALREADY-CORRECTED SYMPTOM: deployment TPM was 200K against a 259K prompt, so every
    request would have exceeded the per-request ceiling regardless of model. An operator raised both
    deployments to 450K on the same day. That is rate, not context; it does not fix this.
  rationale: |
    A declared bound that nothing enforces is worse than no bound: it is read as a guarantee when
    choosing deployments, and it is the reason a candidate was added to the ladder that cannot run.
    Either the budget must bind the prompt, or the ladder must refuse a deployment whose context
    window is smaller than what the lane actually sends -- silently doing neither is what produced
    an unreachable fallback nobody noticed.
  design: |
    Make the mismatch IMPOSSIBLE TO SHIP SILENTLY. The minimum is a refusal before transport when
    the built request exceeds the selected deployment's declared context window, carrying both
    numbers -- the same shape as `OpenWeightUnpricedDeploymentError` and
    `OpenWeightUnshapedDeploymentError`, and keyed by a per-deployment context row exactly as price
    and temperature already are.

    DO NOT SILENTLY TRUNCATE THE PROMPT TO context_budget. A drafting lane fed a truncated plan
    produces a confidently wrong fragment rather than an error, which is strictly worse than a
    refusal; if truncation is ever wanted it is its own task with its own evidence.

    Whether `context_budget` should additionally bind is a SEPARATE decision this task does not
    make -- it records that today it binds nothing, and makes the ladder honest about which
    deployments can serve the lane.
  acceptance:
    - claim: "a request larger than the selected deployment's declared context window refuses before transport, naming both figures"
      proof: "grep: consideredWithWindows in src/lib/worker-provider.ts"
    - claim: "a considered deployment with no declared context window is named as undeclared in the refusal, so the gap is readable from the error text alone rather than only from the source"
      proof: "grep: no declared context window in src/lib/worker-provider.ts"
  falsifier: |
    Remove the pre-transport refusal and the first test must reach the fake transport with an
    oversized body. Drop one deployment's context row and the census test must fail; if it still
    passes it is not reading the price table's keys. Set a context window larger than the real
    prompt for gpt-oss-120b and the first test must stop refusing -- proving the assertion tracks
    the declared figure rather than the model name.
