    test/sweep.test.ts (216 tests that would make a whole-file proof uninformative about the new behaviour).
    risk: high by Rule 19's SPAN count — three source files, one of them the required merge gate's own poster.
    budget_usd 80 matches W1-T225, the nearest-shaped neighbour."
