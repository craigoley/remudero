  note: |
    Contract reconciliation 2026-10-19: the child owns the sandbox measurements, not the parent.
    At ac382304c, preopen-gate.ts launches the trusted preflight child with --summary-file, but the writer and the
    step dispatch live in preflightCommand in src/run-task.ts. Declare that producer and its small measurement leaf
    explicitly; changing only the parent cannot measure the child's private /tmp or its own process.resourceUsage().
    The maintained placeTest/newTestPath result for this subject is ci/gates (high confidence, preopen-gate import).
    Replace title-presence greps with executable literal-title proofs; retain the two original behavioral claims.
    This is a plan-only prerequisite, not implementation credit. No test, source, threshold or runtime setting is
    changed here. The 04:55Z core memcg OOM had about 2.2 GB shmem, but no receipt attributes it to this sandbox;
    this task measures a known gap and does not claim that fixing it resolves that distinct OOM.
  rationale: |
    READ at W1-T9619's build head ad81f6cfd (open PR #12122; symbols, not lines):
    - src/lib/preopen-gate.ts runs the gate child inside proofSandboxArgv (W1-T6124) plus its own binds. That argv
      mounts a fresh `--tmpfs` over /tmp, and the child gets a throwaway HOME removed when the gate settles.
    - tsx keeps its compile cache under the OS temp dir, so inside the sandbox it is empty at every gate start, and
      every file the gate's steps write to /tmp (test fixtures, temp checkouts) lives in RAM until the gate ends.
    OBSERVED by the W1-T9619 builder (one run each, varying box load): sandboxed gate 363 s wall, unconfined 413 s;
    CPU and memory were not measured. OBSERVED (core ledger, W1-T9602's PR body): 84 implement.preopen_gate rows
    2026-10-13 23:46Z to 10-15 13:52Z, mean 532 s, median 482 s.
    INFERRED, NOT MEASURED: the cold cache adds the full tsx transform of every module each gate loads, and a large
    fixture tree on tmpfs adds to the container's memory at the worst moment. This task measures before anyone
    changes either.
  design: |
    1. The gate's summary (the harness-owned --summary-file) gains, as the child measures them at exit: the peak
       bytes used on /tmp (statfs sampled by the child at each step boundary, and at exit), the tsx cache
       directory's file count and bytes at start and at exit, and process.resourceUsage() maxRSS and CPU.
       preopen-gate.ts explicitly requests this measurement from its trusted preflightCommand child; the child uses
       gate-sandbox-metrics.ts to observe the existing spawn boundaries without changing their commands or results.
       Name the scope: tmp_peak_bytes is the maximum of boundary samples, not an observed continuous high-water mark;
       max_rss_kb and cpu_ms describe the preflight process, not its subprocess tree. The cache's start sample is the
       first observed sample after the child loads, never an invented zero before tsx imported its modules. Count
       only the child's own tsx cache, without following symlinks or scanning other sandboxes. Bound enumeration and
       name unreadable, non-private-tmpfs, partial or over-budget measurements rather than publishing partial zeros.
    2. implement.preopen_gate carries them as `sandbox: {tmp_peak_bytes, compile_cache: {files_start, files_end,
       bytes_end}, max_rss_kb, cpu_ms}`, or `sandbox_unmeasured: <reason>`; never zero for unknown.
    3. NOT IN SCOPE, OPERATOR DECISIONS for a follow-up once the rows exist: a persistent read-only compile cache
       bound into the sandbox, and a disk-backed /tmp. Each needs the measured numbers this row produces.
    Tests go in test/ci/gates/the-sandboxed-preopen-gate-measures-its-tmp-and-compile-cache.test.ts, titled verbatim
    as in the proofs, with the sandbox and child seams the W1-T9619 suite uses. Exercise the real default filesystem
    and resource sampler, each failure arm and a real trusted child summary; an injected summary alone cannot prove
    that the producer is wired. Check that pass/fail/unmeasured verdicts and the injected-spawn summary-path guard
    are unchanged when measurement is missing. Delete producer and ledger propagation separately to prove the tests
    fail; deleting the unknown arm must fail the no-fabricated-zero case. Hosted full checks remain required.
  acceptance:
    - claim: "a sandboxed gate row carries the peak /tmp bytes, the compile cache's start and end size, and the child's max RSS and CPU"
      proof: 'unit test: W1-T9739: a sandboxed gate row names its tmp peak, compile cache and child cost'
    - claim: "a gate whose child wrote no measurement says why and never reports zero"
      proof: 'unit test: W1-T9739: an unmeasured sandbox is named, never zero'
