    non-empty forms were genuinely opened. A live-only read produced two false findings today.

    ── Q1. HOW MANY FIX DISPATCHES END IN A RETRIGGER-SHAPED COMMIT ────────────────────────────

    THE CLASSIFIER, STATED BEFORE THE NUMBER, AND IT IS A LOWER BOUND. A commit is RETRIGGER-SHAPED
    if EITHER (a) it changes ZERO files — an empty commit — OR (b) its SUBJECT LINE matches
    `re-?trigger`, or matches `flake|flaky|infra` together with `ci|check|coverage|run|rerun`. It is
    a lower bound by construction: a fix that changed one real line for the wrong reason is
    invisible to it, and so is a retrigger whose subject says nothing.

    THE MESSAGE ARM IS SUBJECT-ONLY, AND THE FIRST DRAFT WAS NOT. Matching the whole commit BODY
    swept up three commits that changed real lines, because their bodies discuss a flake; narrowing
    to the subject dropped two of the three. The remaining one is named below rather than hidden.

    THE POPULATION, AND WHY IT IS A SAMPLE. Over the union there are 237 `fix.dispatch` rows across
    111 run ids and 139 task ids, spanning 2026-08-12 to 2026-08-27. THE ROWS DO NOT CARRY A PR
    NUMBER — `fix.dispatch` has `run_id`/`task_id` and nothing else — and only 15 percent join to a
    `pr.opened` row, so a full census is not available from the ledger alone. 211 of the 237
    dispatches (89 percent) also run under a `DAEMON-…` pseudo run id with no branch of its own.
    The sample taken is therefore the 28 `PR-####` task ids the fix rung dispatched against, which
    name their PR directly and need no resolution, PLUS #3121 itself: 29 PRs, 72 commits.

    THE RESULT: 11 OF 72 COMMITS ARE RETRIGGER-SHAPED (15.3 percent), on 9 of the 29 PRs.
    The empty-commit arm alone reads 10; the subject-named arm reads 6; 5 satisfy both.

    BOTH DIRECTIONS CONTROLLED. It FINDS `cf21fb53` on #3121, the commit this task was filed from.
    And of the 62 commits that changed real lines, EXACTLY ONE is swept — `852b5c3a`,
    "test(w1-t187): retry the CI-flaky 500ms benchmark before failing", which is a genuine fix
    caught by the subject arm. So the message arm has a MEASURED false-positive rate of 1 in 62,
    and THE EMPTY-COMMIT ARM HAS NONE BY CONSTRUCTION: a commit that changed zero files cannot be a
    repair. A build should treat the empty arm as the signal and the subject arm as advisory.

    ── Q2. WHETHER A CHEAPER RUNG IS EVEN POSSIBLE — UNDETERMINED, AND THAT IS THE ANSWER ──────

    THE QUESTION IS NOT SETTLED FROM HERE, AND GUESSING IT WOULD DECIDE THE WHOLE SHAPE OF A BUILD.
    What is known: re-running a CONCLUDED RUN from the fleet's credential 403s, observed repeatedly
    on 2026-08-27, which is exactly why a fresh head is the current remedy; and the operator
    successfully re-ran a single JOB on #3089 with `POST .../actions/jobs/{id}/rerun`.

    THE TWO CANDIDATE CAUSES OF THAT 403 HAVE OPPOSITE ANSWERS AND THIS RECON COULD NOT SEPARATE
    THEM. Either (i) the fleet's token lacks `actions: write`, in which case the JOB endpoint fails
    identically, since GitHub gates both on the same permission — and the shard becomes "the empty
    commit is the only remedy", making the finding purely the strike accounting of (Q3); or (ii) the
    403 is endpoint semantics about re-running a run that has already concluded, in which case the
    single-JOB endpoint may well succeed and the rung has a remedy costing no worker at all.

    THE DISCRIMINATOR IS ONE OPERATOR-SIDE READ, NOT A PROBE: the fine-grained PAT's own permission
    list. A live `POST` would settle it too, but that is a MUTATION on someone's PR and this is a
    recon; it was not attempted. WHOEVER BUILDS THIS MUST SETTLE Q2 FIRST — a build that assumes (ii)
    and finds (i) has written a rung that 403s on every use.

    ── Q3. THE STRIKE QUESTION, WHICH IS SEPARATE FROM THE MECHANISM ───────────────────────────

    IT IS SEPARATE BECAUSE IT IS TRUE UNDER EITHER ANSWER TO Q2. Even if the empty commit stays the
    only remedy, the question is whether producing one should consume a strike. MEASURED IN THE SAME
    SAMPLE: 10 PR-shaped task ids exhausted their strikes, and FOUR OF THOSE TEN carry a
    retrigger-shaped commit — #2161, #2527, #2707 and #2877. So 40 percent of the exhaustions in
    this sample had at least one strike spent on infrastructure noise before escalating to the
    operator with no defect fixed.

    THAT IS THE COST STATED AGAINST THE ONE ALREADY MEASURED: `blocked_ci` is 1,593.44 US dollars,
    46.7 percent of all fleet spend over 19 days, and 148 of 152 blocked-CI tasks (97.4 percent)
    later earned merge credit — the work was right and CI was not. 81 of those 152 were touched by
    the fix rung at 453.06 dollars.

    A NON-CONSUMING RETRIGGER IS SAFE ONLY IF SOMETHING ELSE BOUNDS IT, AND THE BOUND MUST NOT BE A
    TIMER. `fixStrikeCap` is 2 and exists to stop a rung chasing a real defect forever; a retrigger
    for a check that is KNOWN flaky is a different thing, but "does not consume a strike" with no
    other bound is an unbounded loop, which is the shape this repo has refused before. The candidate
    bound is a SEPARATE, SMALL retrigger counter per head — the same once-per-head shape W1-T2345's
    disposition counter already uses — so a permanent flake stops after a stated number of
    retriggers on an unchanged head and escalates naming the check, while a real defect still spends
    real strikes. NOTHING SLEEPS, THROTTLES OR PACES (W1-T1066), and this proposes NO change to
    `fixStrikeCap` in either direction and no change to the CI wait cap.

    ── WHAT IS OWNED ELSEWHERE, RECORDED SO THIS DOES NOT RE-FILE IT ───────────────────────────

    The orphan-sweep flake itself is W1-T356 (#3074) — two of the retrigger commits above name it.
    The light-sweep tick variance is W1-T2379. The `coverage-ratchet` job cap is #3064's. THIS SHARD
    OWNS ONLY THE RUNG'S REMEDY AND ITS STRIKE ACCOUNTING; it does not diagnose any individual
    flake and must not grow to.

    RISK BAND. `risk: high` is set UP FRONT and is RULE 19'S SPAN, not blast radius: `files:` crosses
    the `run-task` fix-rung stem and this task's own test stem, which the sizing check reads as more
    than one concern and refuses at `risk: medium`. The blast radius is one accounting decision on a
    rung that already runs.
