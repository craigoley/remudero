- id: W1-T5740
  title: "A GARDEN'S CHECKOUT NEVER BLOCKS THE LOOP — `gardenCheckout` (src/run-task.ts) still adds its worktree with the sync `worktreeAdd` and commits and pushes through `execFileSync`, and every gardener's `openWorkspace` port is synchronous, so one intake pass held the 2026-10-04 19:20Z boot loop ~153 s (codeqlQuality, reconcileOpportunityOutcomes, gardenCheckout); W1-T5284's #9159 converts lane worktrees, pushes and arms but leaves this one"
  repo: remudero
  depends_on: [W1-T5284]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 20.00
  risk: high  # Rule 19: one concern — the garden checkout port goes async end to end
  band_meaning: span
  origin: "operator session 2026-10-04: restart report stall S2, found while building W1-T5284 (#9159)"
  plan_refs: [W1-T5284, W1-T5689, W1-T4477, W1-T5282]
  files: [src/run-task.ts, src/lib/gardener.ts, src/lib/opportunity-intake.ts, src/lib/config-gardener.ts, src/lib/selector-shadow-gardener.ts, src/lib/host-resource-gardener.ts, src/lib/machine-filing-judge.ts, test/a-gardens-checkout-never-blocks-the-loop.test.ts]
  status: merged
  priority: 1
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 70bb29f8 and #9159 (W1-T5284, open, head e186f087). On that head
    `gardenCheckout` calls `worktreeAdd(opts.repoDir, root, branch, "origin/main", ...)` (a sync
    fetch then `worktree add`) and drives its commit, docs-index regeneration and push through
    `execFileSync`. Its daemon callers reach it through synchronous ports: `GardenerDeps.openWorkspace:
    () => W` (src/lib/gardener.ts), `garden.openWorkspace()` in src/lib/opportunity-intake.ts,
    `deps.openWorkspace()` in config-gardener.ts and selector-shadow-gardener.ts,
    `fileConsumerVia(openWorkspace: () => GardenCheckout, ...)` in host-resource-gardener.ts and the
    optional `openWorkspace?: () => GardenCheckout` in machine-filing-judge.ts. The 2026-10-04
    restart report attributes ~153 s of boot stall S2 (19:20:35-19:28:45Z) to intake codeqlQuality
    -> reconcileOpportunityOutcomes -> gardenCheckout's worktree add and gh. W1-T5284's design (i)
    named gardenCheckout; its build converted the lane creators and left the garden port, because
    making it async changes seven modules' port types. Batch-10's W1-T5689 (#9155, open) is a
    growth ratchet over loop-reachable sync spawns: it baselines this site, it does not convert it.
  design: |
    Add `gardenCheckoutAsync` over `worktreeAddAsync` and async git for the commit and push, keeping
    the same branch naming, ledger rows and refusals; the sync form stays for CLI callers. Make
    every daemon-reached `openWorkspace` port return a Promise and await it through each gardener's
    pass. A garden pass that awaited a checkout must hold whatever claim the sync call held by
    blocking, as W1-T4477 required. Shrink W1-T5689's baseline if it has merged.
  acceptance:
    - claim: "a garden pass opening its workspace lets a timer fire while the checkout's git fetch is in flight, and opens the same branch and records the same rows as the sync form"
      proof: "unit test: test/a-gardens-checkout-never-blocks-the-loop.test.ts"
  falsifier: |
    Route the daemon's openWorkspace back to the sync gardenCheckout: the timer fires only after
    the fetch settles and the test fails.
