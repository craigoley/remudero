    6. ORDER ACROSS REPOS. The site-PR step for guidance runs only after PORTAL-T42 (the model-guidance-v1
       validator) and PORTAL-T48 (the importer stages model-guidance.json in the one import PR) have merged on
       site main. Until then the pass builds the
       candidate, records `site-guidance-stage-unavailable` in the field-trials.refresh row, and the field note
       proceeds alone.
  acceptance:
    - claim: "the committed golden fixture has the contract sha256 and the generator reproduces it byte for byte from fixture inputs"
      proof: 'grep: test("W1-T10878: the generator reproduces the golden model-guidance fixture" in test/routing/core-generates-model-guidance-for-the-site.test.ts'
    - claim: "a category with fewer than ten attributable units is suppressed and counted, and no exact count leaves core"
      proof: 'grep: test("W1-T10878: a small cell is suppressed and only buckets leave core" in test/routing/core-generates-model-guidance-for-the-site.test.ts'
    - claim: "copy with a digit, a comparative word or an internal token withholds that card without failing the release"
      proof: 'grep: test("W1-T10878: copy that fails the public lint withholds only its card" in test/routing/core-generates-model-guidance-for-the-site.test.ts'
    - claim: "published copy is carried unless the model is new or its status or categories changed, and the PR body says which"
      proof: 'grep: test("W1-T10878: published copy is carried unless the routing moved" in test/routing/core-generates-model-guidance-for-the-site.test.ts'
    - claim: "core stamps no review fields on the guidance and it rides in the one site import PR"
      proof: 'grep: test("W1-T10878: guidance rides in the one import PR and core stamps no review" in test/routing/core-generates-model-guidance-for-the-site.test.ts'
    - claim: "the field-trials command builds the guidance candidate"
      proof: 'grep: buildModelGuidance( in src/lib/field-trials-flow.ts'
  falsifier: |
    At base no generator exists, so every case fails.
    - Emit exact counts or an unsuppressed small cell: the small-cell case fails.
    - Skip lintPublicCopy, or let a lint failure fail the release: the copy-lint case fails one way or the other.
    - Redraft every model's copy on every pass: the carried-copy case fails.
    - Write reviewedBy, or open a second site PR for guidance: the one-PR case fails.
    - Change one byte of the fixture: the sha256 pin fails.
    GUARD that held at base and must still hold: test/field-trials-flow.test.ts (withheld without consent,
    revocation, refusal on a private join key) passes with the guidance path added.
