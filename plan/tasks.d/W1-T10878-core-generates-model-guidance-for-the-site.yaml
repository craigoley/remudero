- id: W1-T10878
  title: "THE PUBLIC FIELD-TRIALS PAGE'S PER-MODEL GUIDANCE IS HAND-TYPED AND GOES STALE — the site's router notes are a hard-coded array an owner edits, unconnected to what the router leads or measures; core generates a model-guidance-v1 candidate from the routing config, the guardrail table and the attributable ledger, under the closed public vocabulary and bucketed numbers (disclosure level B), and it rides in the ONE owner-reviewed site import PR"
  repo: remudero
  depends_on: [W1-T10875, W1-T10877, W1-T10832]  # attributable outcomes, the vocabulary and guardrail family, and the one site import PR
  priority: 2
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high  # public data and public copy: a leaked internal token, an unbucketed count or a ranking claim is a disclosure
  band_meaning: blast-radius
  origin: "operator ruling, Craig 2026-10-27: per-model guidance on remudero.com/field-trials at disclosure level B (cards from a closed public vocabulary, bucketed numbers, Wilson intervals, cells under 10 suppressed, a funnel plot instead of a ranking); CC BY 4.0 downloads; contract ~/Remudero-notes/field-trials/model-guidance-contract-v1.md (restated in design below)"
  plan_refs: [W1-T10831, W1-T10832, W1-T10843, W1-T10875, W1-T10876, W1-T10877, PORTAL-T41, PORTAL-T42, PORTAL-T48]
  files:
    - src/lib/field-trials-model-guidance.ts
