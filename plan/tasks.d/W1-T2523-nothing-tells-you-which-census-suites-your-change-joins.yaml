- id: W1-T2523
  title: "NOTHING TELLS YOU WHICH POPULATION-WALKING SUITES YOUR CHANGE JOINS, SO THE CALLER SWEEP THIS REPO MANDATES IS STRUCTURALLY BLIND TO THEM — `git grep -l <symbol>` cannot find a suite that walks `src/**` and asserts a property of the whole set; one PR tripped TWO of them (bound-kind-declared, negative-reachability-ratchet) and both were invisible to a correctly-run caller sweep, surfacing only from a 40-minute both-sides full-suite diff"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 14.00
  files: [src/lib/ci-parity.ts, test/nothing-tells-you-which-census-suites-your-change-joins.test.ts]
