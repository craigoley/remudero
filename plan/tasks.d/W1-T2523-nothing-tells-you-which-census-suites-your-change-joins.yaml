  attempts: 0
  rationale: |
    CLAUDE.md ALREADY NAMES THIS AND THE NAMING DID NOT PREVENT IT. Its own words: "A CENSUS TEST
    NAMES NONE OF YOUR SYMBOLS, SO THE CALLER SWEEP ABOVE CANNOT FIND IT — `git grep -l <symbol>` is
    blind to a suite that WALKS a population (`src/**`) and asserts its size." The remedy it offers
    is to "also run any suite that enumerates a population your file joins, found by what it walks
    rather than by name" — which asks an author to already know the answer. That is a prose rule
    with no instrument behind it, exactly the class CLAUDE.md's own preamble says gets violated
    silently and repeatedly.

    MEASURED ON ONE PR, 2026-08-30. A change adding two exported constants and one regex to
    `src/lib/classify.ts` tripped:
      test/bound-kind-declared.test.ts          (TRANSIENT_BACKOFF_BASE_MS / _CEILING_MS undeclared)
      test/negative-reachability-ratchet.test.ts (a new `_RE` validator with no both-arm fixture)
    The caller sweep was run — `git grep -l` over every changed symbol, plus every suite that
    mentioned them — and found NEITHER, because neither names any of those symbols. They surfaced
    only from a full-suite run on both the branch AND its parent, diffed as SETS: base 179 distinct
    failing names, head 226, of which 61 were an environmental Playwright mismatch and exactly 2
    were real. Roughly 40 minutes of wall clock to learn something a query could answer in a second.

    THE ANSWER IS ALREADY DERIVABLE. These suites are recognisable by what they DO: read the tracked
    tree (`git ls-files`), filter to `src/**`, and assert a property per file or over the whole set.
    `src/lib/ci-parity.ts` already knows this family exists — it carries a "census suite" class with
    its own reasoned entries and a wall-clock bound. So the population is enumerable from the same
    data the fast gate already keeps, and the missing thing is a QUERY over it: given a set of
    changed paths, name the census suites those paths enter.

    WHAT THIS MUST NOT BECOME. Not a new gate — there are enough, and a wrong derivation that
    REFUSED a PR would be the bound-fires-on-a-healthy-condition defect this repo keeps
    rediscovering. A report an author can run before pushing, and that the fast gate can print, is
    the whole ask. It also must not claim completeness it cannot have: a suite that walks the tree
    in some way this derivation does not recognise must be reported as UNKNOWN COVERAGE rather than
    silently omitted, or it rebuilds the same blind spot one layer up.

    RE-DERIVE RATHER THAN TRUST THE TWO: the query is `git grep -l 'ls-files' -- 'test/*.test.ts'`
    intersected with suites that filter on `src/`, which is an approximation and should be stated as
    one — the same posture W1-T2317's own ratchet takes about its text-proximity heuristic.

    NOT IN SCOPE: making either suite easier to satisfy, and the fast gate's own admission bounds.

    THE RISK BAND IS SET HIGH BECAUSE THE LINTER REFUSES A src+test PAIR AT medium (see W1-T2525);
    the sentence below is the honest description of the blast radius, not the reason for the band.
    THE RISK BAND IS RULE 19'S SPAN: one src stem plus a test is narrow, and the blast radius is
    genuinely small because the deliverable is a REPORT that refuses nothing.
  acceptance:
