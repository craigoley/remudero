  note: "verify:auto — dispatch counts and concurrency are assertable in-process against the real lane
    path.
    risk:high — it changes the dispatch shape of the persistent loop that spends the fleet's money.
    budget_usd 90 — the largest in the chain: it is the integration, and its falsifier needs a real
    two-lane fixture rather than a unit assertion.
    files: src/run-task.ts is declared because `daemonCommand` is where the policy value is resolved and
    threaded in — if the implementation finds it needs no change there, declaring it costs nothing,
    whereas omitting a written path is what refused five dispatches this week.
    EVERY depends_on EDGE IS A SAFETY PRECONDITION, not sequencing preference. W1-T339: a second lane
    can re-provision the shared keychain under the first. W1-T340: a second lane can be judged against
    a plan blob it was not selected under. W1-T341: two lanes make the deploy's quiet window rare and
    the wait is unbounded. W1-T342: one per-tick governor reading would admit both lanes. Each failure
    is silent, and each becomes reachable only when this task lands — which is exactly why they precede
    it rather than follow."
