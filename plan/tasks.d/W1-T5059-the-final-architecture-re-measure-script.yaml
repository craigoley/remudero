  rationale: |
    The Phase 4 design (§9) defines plan-complete targets measured over 7 days: view p99, stale share, reads
    per page, and correct counts by independent recount over the ledger union. The probe used so far
    (p4proto/gentle4.mjs) lives in a session scratch directory. House doctrine: a zero is not a measurement
    until a positive control proves the query could see its corpus, and each rotation form must be proven read.
  design: |
    scripts/arch-remeasure.mjs: (i) the gentle probe (sequential, 3 s gap, aborts on two consecutive loop-lag
    windows over 10 s); (ii) recounts over the ledger union in all three rotation forms: today's verdict.merged
    distinct by PR versus now.recent.mergedToday, running versus board.counts.running at the same asOf, open
    grill entries versus decisions of kind grill. Each recount prints its per-form file counts and exits
    non-zero naming oracle_blind when any form contributed zero files.
  acceptance:
