      proof: 'grep: test("W1-T5059: a recount refuses when one rotation form contributed zero files" in test/arch-remeasure.test.ts'
    - claim: "the script names the refusal"
      proof: 'grep: oracle_blind in scripts/arch-remeasure.mjs'
  falsifier: |
