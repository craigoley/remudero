- id: W1-T4483
  title: "A RELEASE TAG IS A FLEET-WIDE DEPLOY SWITCH THAT ANY WRITER COULD FLIP — add a tag ruleset so only the fleet GitHub App may create or delete release, ring and revoked tags"
  repo: remudero
  depends_on: [W1-T4479]
  type: manual
  verify: human
  principles: {tdd: strict}
  budget_usd: 0.00
  risk: medium
  origin: "session: 2026-09-24 release-tag design"
  plan_refs: ["W1-T4479", "W1-T4481"]
  files: [plan/tasks.d/W1-T4483-only-the-fleet-app-may-write-release-tags.yaml]
  status: queued
  attempts: 0
  rationale: |
    Once W1-T4481 ships, pushing refs/tags/ring/fleet/<id> tells every instance to deploy. Anyone with write access
    could do that by hand today. GitHub repository rulesets can target tag patterns with Restrict creations and
    Restrict deletions, and grant bypass to a GitHub App, so only the fleet App's mints succeed.
    This is an operator action in repository settings, so it is a manual task. Do it before W1-T4481 merges.
  design: |
    In craigoley/remudero settings, add a tag ruleset targeting refs/tags/release/*, refs/tags/ring/* and
    refs/tags/revoked/*, with Restrict creations, Restrict updates and Restrict deletions enabled, and the fleet
    GitHub App (remudero-fleet) as the only bypass actor. Leave refs/tags/image/* untouched.
  acceptance:
    - claim: "only the fleet App can create or delete release, ring and revoked tags"
      proof: "demonstration: operator shows the ruleset's target patterns and bypass list, and a manual tag push to refs/tags/release/test being refused"
