- id: W1-T1038
  title: "DISPATCH PRICES EVERY DRAW IN DOLLARS AND NONE IN BYTES — zero memory fields across 109,986 deduped ledger rows against 1,109 carrying `cost_usd`, so when the host stalled at 18:43 with three workers live nothing had ever recorded what one costs; the guard that would fix it must FAIL OPEN, which is the opposite of the arm it would join"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  rationale: |
    MEASURED 2026-08-19 AT origin/main 3b4dcf2e, on the Azure host that stalled. No `/rate_limit`
    call was made, no policy value was changed, and nothing was restarted by this recon.

    (1) THE GAP, RE-DERIVED. Across the full ledger union — per-form control first: 0 `.gz`, 9 plain
    rotations, 1 live, the `.gz` zero confirmed by `find -name '*.gz'` returning 0 under `state/`
    while the identical shape returns 9 for `ledger.*.ndjson` — deduped on the full line to 109,986
    rows, the count of fields whose name carries mem/rss/heap/swap/avail is ZERO. Positive controls
    on the same corpus: 1,109 rows carry `cost_usd` and 468 carry `num_turns`. The fleet has priced
    every dispatch in dollars and turns since the ledger began and has never once recorded a byte.

    (2) WHAT THAT COST. At 18:40:02 the box had 4.69 GiB available, 36% used, load 3.82. By
    18:43:54.955 — the ledger's last pre-restart row, W1-T1011's `worker.state` — it was
    unreachable. NOTHING WAS KILLED: zero `oom-kill`, `Out of memory`, `Killed process` and
    `oom_reaper` lines across `journalctl -k -b -1`, `/var/log/syslog` and `/var/log/kern.log`,
    each with its own positive control (18,833 kernel lines in the boot; 3,792 and 3,720 matching
    "kernel" in the two files), and the previous boot is fully available in a 306.7 MB persistent
    journal — a measured absence, not a lost log. With no swap the kernel could not page out
    anonymous memory, so it evicted executable pages and re-faulted them; reclaim livelock never
    arms the OOM killer. Three `Under memory pressure, flushing caches` events followed, ALL AFTER
    death. The container has NO memory limit — `memory.max` reads `max`.

    (3) THE SHAPE TO MATCH, NOT INVENT. `checkCostGovernor` (`src/lib/sweep.ts`) is a pure
    predicate — `dayCostUsd >= policy.dailyCostCeilingUsd` returning `{deferred, observed, ceiling}`
    — with `logCostGovernorDeferral` beside it writing one ledger line. `checkQueueGovernor` is the
    same shape against `wipLimit`. Both are composed by `checkDispatchGovernors`
    (`src/lib/dispatch-governor.ts`), which `runDaemon` and `runDrainLanes` both call, and whose own
    doc requires it be called AGAIN PER LANE rather than hoisted above the loop. That composition
    point is where a memory check belongs. Invocation counts, word-bounded, across `src/`:
    `checkCostGovernor` 45, `checkQueueGovernor` 35, `logCostGovernorDeferral` 8.

    (4) AND THE ARM IT WOULD JOIN FAILS CLOSED — THIS IS THE WHOLE DESIGN PROBLEM. The doc on
    `checkDispatchGovernors` is headed "FAIL-CLOSED ON AN UNREADABLE OBSERVATION" and states the
    rule in terms: "The safe answer to 'the reading could not be taken' is the SAME as a
    confirmed-over-ceiling reading — admit no further dispatch this batch". Its
    `DispatchGovernorVerdict` carries a shared `{kind: "unreadable"}` arm, and
    `governorDeferPayload` renders it as "governor observation unreadable — failing closed,
    admitting no further lane this batch". A memory check added naively INHERITS that arm and
    therefore inherits the wrong direction. THE SHARED UNREADABLE ARM FAILS CLOSED AND THIS CHECK
    MUST NOT USE IT.

    (5) WHY THIS ONE IS OPPOSITE. Three-lane dispatch is 100% of draws since 2026-08-14 — 51 sets,
    admitted mean 3.00, one failure in six days. A guard that refuses on a probe failure idles a
    fleet that is three-lane on every draw, converting a 2% event into a 100% outage. The two
    fail-closed patterns an implementer will find nearby are both correct FOR THEIR OWN REASONS and
    both wrong here: `defaultOpenFileCount` (`src/lib/clone-reaper.ts`) ends
    `return 1; // lsof missing or unrunnable — fail closed, treat as held`, and `isHolderStale`
    (`src/lib/fs-race-safe.ts`, 27 invocations in `src/`) treats an unreadable holder
    conservatively. COPYING EITHER HERE BUILDS THE WRONG THING.

    (6) THE PROBE IS SETTLED — VERIFY IT, DO NOT RE-DERIVE IT. Tested against the current published
    image as its own default uid 1000 (`node`): `free`, `ps`, `lsof`, `pgrep`, `top` and `vmstat`
    ALL PRESENT, and `/proc/meminfo` readable at `MemAvailable: 6923732 kB`. An earlier
    `spawnSync ps` → ENOENT observation is from an older build and DOES NOT REPRODUCE; it should not
    be repeated as a live constraint. The trap is which SOURCE is read, not whether a binary exists:
    because the container is unlimited, `/proc/meminfo` inside it reports real HOST figures — which
    is what this guard wants — while a cgroup read returns `memory.max = max`, i.e. unbounded, which
    would authorise every dispatch silently.
    READ MemAvailable FROM meminfo AND NEVER THE CGROUP LIMIT.

    (7) THE THRESHOLD IS NOT KNOWN AND MUST NOT BE GUESSED. The only retained observation is
    container-wide `memory.peak`, 3.99 GiB across two three-lane waves, NEITHER of which ran a
    concurrent `tsc --noEmit` or full suite — which is precisely the coincidence that froze the box
    (W1-T1011 died inside a single six-minute tool call).
    A PER-WORKER FIGURE IS NOT RECOVERABLE RETROSPECTIVELY: `find /sys/fs/cgroup -maxdepth 1 -type d` returns only
    the root, so every worker shares one flat cgroup and `memory.peak` is a single unattributable
    high-water mark. A LIVE sample taken during this recon does give a partial answer — three
    concurrent `claude --output-format` workers at 311, 301 and 286 MiB RSS, with the orchestrating
    `node` at 767 MiB and the container at 3.19 GiB current against 3.99 GiB peak — but the RSS that
    matters is the SPAWNED toolchain, not the agent, and a point-in-time sample misses it unless it
    lands mid-run. MEASURING IT IS THEREFORE PART OF THIS TASK, which is why the threshold ships
    disabled and the row ships unconditionally.

    (8) SWAP IS UNPROVEN AND THE INSTRUMENTATION IS WHAT WOULD SETTLE IT. 4 GiB was added and
    persisted; usage since is 0 MiB of 4,095. No swapping worker has been observed, so whether swap
    lets a worker FINISH or merely fail slower is undecided. A per-dispatch row carrying observed
    MemAvailable is the evidence that would decide it.
  acceptance:
