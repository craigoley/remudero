      proof: "unit test: W1-T1038: a dispatch is deferred below the memory floor"
    - claim: "an unreadable memory observation PERMITS the dispatch rather than refusing it"
      proof: "unit test: W1-T1038: an unreadable memory probe permits dispatch"
    - claim: "the floor ships disabled so no behaviour changes until an operator sets it"
      proof: "unit test: W1-T1038: the memory floor is inert at its shipped default"
    - claim: "the observation is ledgered on every dispatch including the ones it admits"
      proof: "unit test: W1-T1038: the memory observation is recorded when it admits"
    - claim: "a live worker over the floor keeps running and only the next dispatch is held"
      proof: "unit test: W1-T1038: a running worker is never killed by the memory floor"
    - claim: "the reading comes from meminfo rather than the unbounded cgroup limit"
      proof: "unit test: W1-T1038: the probe reads meminfo not the cgroup limit"
    - claim: "the check is re-consulted per lane rather than hoisted above the loop"
      proof: "unit test: W1-T1038: the memory check is consulted once per admitted lane"
    - claim: "an unreadable probe does not route into the shared fail-closed verdict arm"
      proof: "unit test: W1-T1038: an unreadable probe skips the fail-closed arm"
