  note: |
    DESIGN, IN THE ORDER AN IMPLEMENTER MEETS IT.

    (i) THE PREDICATE. A pure `checkMemoryGovernor(availableMib, policy)` in `src/lib/sweep.ts`,
    beside its two siblings and against the same policy table — same return shape as
    `checkCostGovernor`: the observation, the floor, and whether it defers. Pure and non-throwing,
    exactly as that contract already promises.

    (ii) THE COMPOSITION, AND ITS ONE CARVE-OUT. It joins `checkDispatchGovernors`
    (`src/lib/dispatch-governor.ts`) so it is re-consulted per lane rather than hoisted. But it MUST
    NOT route an unreadable observation into the existing `{kind: "unreadable"}` arm — that arm is
    documented fail-closed and its payload says so. FAIL OPEN, NOT CLOSED: an unreadable
    `/proc/meminfo` PERMITS the dispatch. This is the single place this task contradicts a
    neighbouring convention, and it is deliberate — three-lane dispatch is 100% of draws, so a
    probe failure that refused would idle the whole fleet to prevent an event measured once in six
    days. The implementer states the direction at the seam in a comment, not only in a test.

    (iii) DEFER AND NEVER KILL. A running worker that crosses the floor keeps running; only the
    NEXT dispatch is held. Killing a live worker destroys spend the ledger never sees — today's
    stall lost roughly fourteen minutes of W1-T1011's implement phase, and the four abandoned
    run_ids together recorded only $2.42 because no `implement.done` was ever written.

    (iv) THE ROW IS THE LARGER HALF, AND THE READER IS THE OPERATOR. Emit the observed MemAvailable
    on EVERY dispatch, including the ones it admits — a deferral-only row would sample exactly the
    population that never happens while the floor ships disabled. THE READER IS THE OPERATOR reading
    the ledger union; that is a legitimate reader and it is named here because an unstated one is
    not. No dashboard, no second consumer, no new verb is in scope.

    (v) ROTATION. Membership in `DECISION_RELEVANT_LEDGER_STEPS` (`src/lib/ledger.ts`, 58 entries) is
    required ONLY IF A DECISION READS IT BACK. `test/ledger-rotation.test.ts` derives its expectation
    by scanning consumer sources for `.step === "..."` reads, so the rule is mechanical, not a
    judgement call: an operator-read observation row needs no membership and must not take one,
    while any predicate that later reads this step MUST add it in the same PR. Measured precedent
    both ways at 3b4dcf2e: `daemon.cost_governor` IS in the set, `dispatch.lane_governed` and
    `dispatch_deferred_budget` are NOT.

    (vi) THE THRESHOLD SHIPS DISABLED. The `plan/policy.yaml` row lands with a value that defers
    nothing, copying the pattern `armSessionPrs` shipped with. The task's own output is the evidence
    needed to set it later; choosing a live number now would be the round guess this shard exists to
    avoid. THE FIRST TEST WRITTEN MUST BE THE INERT-DEFAULT PATH.

    WHAT MUST NOT BE BUILT. `dispatchLanes` STAYS AT 3 — measured 100% of draws since 2026-08-14,
    admitted mean 3.00, and dropping to 2 would cut total admissions from 211 to 160 across the
    observed sets. Nothing here may propose reducing it or depend on it being reduced. NO CONTAINER
    MEMORY LIMIT, NO VM RESIZE, NO REMOVING SWAP — setting `memory.max` converts a livelock into an
    OOM kill, which is arguably better and is a deploy-side ruling, not this task. NO KILL PATH. NO
    SECOND PROBE SOURCE. The stale-lock half is W1-T1036 and is NOT absorbed here.

    STALE FIGURES THAT MUST NOT BE REPEATED. The "21% of draws fill three lanes" figure predates
    2026-08-14 and is false of every draw since; the "2.04 admitted mean" is a COST ratio lifted
    from `plan/policy.yaml`, not a lane statistic. Both are in circulation and neither should be
    carried forward.

    SIBLING, NAMED AND NOT ABSORBED. W1-T1036 (#2235) is the stale `.git/config.lock` this same
    stall left behind, which blocked recovery across two daemon boots; it is a separate concern in
    a separate file and is cited, not re-derived. W1-T1028 is a FOURTH casualty of that lock
    failure, flagged `{"orphaned": true}` in `status.json` and not re-dispatched fifty minutes
    later. WHETHER THE ORPHAN FLAG MAKES IT INELIGIBLE IS A SEPARATE QUESTION AND IS NOT ANSWERED
    HERE.

    `files:` IS TIGHT AND ITS OWN PATH IS ABSENT, and it is ordered by what the change actually
    touches rather than by module size. `src/lib/sweep.ts` holds the two sibling predicates and the
    policy table; `src/lib/dispatch-governor.ts` holds the composition point and the fail direction;
    `src/lib/policy.ts` must parse a new bounded field or the YAML row cannot validate;
    `plan/policy.yaml` carries the row. `src/run-task.ts` IS DECLARED because
    `costGovernorGateFor` and `queueGovernorGateFor` — the real wiring that turns a pure predicate
    into a live reading — both live there, and a memory gate with no factory beside them would be
    the dead mechanism this shard's own criterion (iv) forbids. Per DECISIONS.md's 2026-08-18
    W1-T471 ruling that file is not split and tasks are not re-scoped to avoid it; the ruling states
    that the ceremonial acceptance sentence is no longer required and a new shard should simply
    declare it, so it is declared here plainly and the serialisation cost is accepted.

    `test/dispatch-memory-governor.test.ts` DOES NOT EXIST at 3b4dcf2e — a forward-referenced PATH,
    never a guessed symbol — and is a new file because the house rule keeps a coverage-load-bearing
    test out of a shared suite.

    `risk: high` IS SET UP FRONT AND IS RULE 19'S SPAN, NOT BLAST RADIUS: `subsystemsOf`
    (`src/lib/task-linter.ts`) derives its tags from `files:` plus acceptance text, and this set
    crosses four `src/` modules, a plan file and `test/`. Blast radius argues both ways and both
    belong on the record: the shipped default changes nothing observable, but the seam it edits is
    consulted on every lane of every draw, and a floor set too high would idle a fleet that fills
    three lanes on every one.

