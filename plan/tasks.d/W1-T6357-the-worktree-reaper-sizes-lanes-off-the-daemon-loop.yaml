  rationale: |
    MEASURED 2026-10-08 01:52-01:58Z: a 33.4 s busy run was runTaskBody → runAdhocLaneReapRung (27.0 s) →
    reapStaleWorktrees → laneSizeBytes 26.8 s. READ on origin/main: laneSizeBytes is
