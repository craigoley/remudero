    - claim: "the guarded call derives the budget from its own response rather than a separate probe"
      proof: "unit test: W1-T1008: the guarded call supplies a budget from its own response headers"
    - claim: "the existing sweep branch receives the stand-down it already knows how to handle"
      proof: "unit test: W1-T1008: the sweep branch receives the stand-down it already handles"
