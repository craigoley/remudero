  note: "`risk: high` IS SET UP FRONT — Rule 19 SPAN across `src/` and `test/`, and independently
    warranted: `ghGateway` is the read path every status projection, the sweep and the console all
    share, so a wrong decode does not fail loudly, it mis-states merge state fleet-wide. budget_usd 55
    — a transport swap behind one gateway, three named traps, and a transport-counting falsifier.

    `files:` IS TWO PATHS, DERIVED BY INVOCATION COUNT WITH WORD BOUNDARIES (in Python — the shell
    mangled `\\b` twice and the `ghJson` control caught it at 0 against a true 34). `src/lib/status.ts`
    scores `ghGateway` 15, `findMergedByTrailer` 15, `listMergedHeadBranches` 6 — the gateway and the
    batching it already does both live there, and the 788-call volume is entirely downstream of it.
    `test/status-rest-transport.test.ts` is NEW: `test/status.test.ts` is the gateway's existing suite
    by weight (36) but carries the whole derivation surface, and a transport falsifier that counts
    invocations wants its own file. `src/lib/open-prs-rest.ts` (`prStateFromRest` 10) IS DELIBERATELY
    NOT DECLARED — it is REUSED, not edited, and `inverseScopeUntouchedFiles` fails a declared path the
    implementation never reaches. `src/run-task.ts` IS NOT DECLARED: it carries 14 GraphQL-shelling
    sites and `ghGateway` 35, but they are CALLERS — converting the gateway serves them without
    touching a 19,943-line file that `partitionByFileOverlap` (W1-T471) serialises against every task
    naming it.

    W1-T511 (#1887) MOVED ONE CALL AND ITS SHARD DELIBERATELY REFUSED A BULK CONVERSION. THIS IS THE
    SYSTEMATIC VERSION AND IT DOES NOT RE-ARGUE THAT REFUSAL: what changed is the measurement — the
    per-field classification in rationale (3) and the 788-call volume in (1) did not exist when that
    refusal was made, and they are what makes the bulk case decidable rather than speculative.

    PROOF NOTES: all four proofs are NAME-FILTERED titles, not pure paths — a pure path runs the whole
    file and one unrelated failure fails every criterion. Each was verified to match ZERO files today
    against a control matching exactly one, and each is under 100 characters with at most one comma so
    `looksLikeScenarioNarrative` (`src/lib/task-linter.ts`) cannot fail them. No proof names this
    shard, so the implementation is not capped at 0/N by self-reference.

    ID PROVENANCE, AND A LIVE COLLISION CAUGHT BY THE GATE. origin/main's max is 519 by both
