  note: "verify:auto — elapsed-time bounds and counter states are pure decisions over injected inputs.
    risk:high — Rule 19 counts deployer and ledger as distinct subsystems, and this decides when a
    deploy may interrupt paid work. Bound too tight and it kills runs; too loose and the defect stands.
    budget_usd 65 — a bound, a visibility surface and a two-direction falsifier, plus the retention
    set if a ledger step lands.
    files: DECLARES src/lib/ledger.ts AND test/ledger-render-retention.test.ts because design (ii) may
    add a ledger step, and a rendered step implies the retention set AND the lock that re-derives it
    from consumer source. If the implementation surfaces the deferral without a new step, declaring
    them costs nothing; omitting a written path is what refused five dispatches this week.
    NO depends_on: the unbounded wait is a defect at N=1 today — nothing about it requires lanes. It is
    in this chain because lanes make it common, not because lanes cause it.
    THIS NARROWS W1-T326's BLOCKER (3) BY INVERTING ITS CONCLUSION. The entry's diagnosis — a
    conjunction over global counters, a rarer quiet window, a silent failure — is confirmed from
    source. What changes is that 'therefore do not add lanes' becomes 'therefore bound the wait', and
    the bound is worth having whether or not lanes ever ship."
