- id: W1-T2990
  title: "WARN AT FILING TIME WHEN A GREP PROOF ONLY MATCHES ITS OWN PROOF LINE, AND STOP THAT SELF-MATCH HIDING THE SIBLING CHECK — W1-T2983 measured the defect and the operator ruled advisory; this builds the warn-only sibling of proofGrepUnmatchableViolations and the two-line carve-out that lets the existing check see the line-seams its own proof lines currently mask"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 12.00
  rationale: |
    **WHAT W1-T2983 ESTABLISHED, AND WHAT THE OPERATOR RULED.** A `grep:` proof's pattern is
    everything before the trailing " in <path>" (`parseDialectGrep`), so when the target is the
    shard's own record the pattern is a literal substring of the very proof line that carries it and
    the criterion certifies itself. Measured plan-wide: 168 self-targeting proofs, 167 still matching
    with their acceptance block deleted, 23 matching nothing but their own criterion. The operator's
    ruling on 2026-09-06 was "lean into automation and not block unless required", so this ships
    WARN-ONLY. No blocking gate, no severity override, no change to `proof-grep-safety`.

    **THE SECOND HALF IS FREE AND COSTS AUTHORS NOTHING.** The self-match does not merely evade a
    check, it SUPPRESSES one. `proofGrepUnmatchableViolations` already knows how to report a pattern
    that can never match — including the line-seam case, where a wrap falls inside the phrase — but
    the proof line supplies a match, so `classifyGrepZeroHit` concludes "matched" and it stays
    silent. Stripping the task's own acceptance block before that classification unhides genuine
    line-seams with no author change to any shard at all.

    **WHY THE OBVIOUS RULE IS NOT THE ONE BEING BUILT.** "The pattern must not occur in the
    acceptance block" has no compliant form: every anchoring mechanism that would let a self-target
    pattern miss its own proof line — `^`, `$`, a bracket class — is already refused by
    `proof-grep-safety`, and weakening that gate trades a silent false pass for a silent false fail.
    The satisfiable restatement, and the one this task implements, is that such a pattern must match
    at least one line OUTSIDE the record's own acceptance block.
  design: |
    OWNERSHIP IS DECIDED FROM THE TARGET FILE'S OWN TEXT, NEVER FROM `files:`. The tempting
    conjunct — that the target also appears in `task.files` — is a silent total suppressor: Rule 15
    forbids a `verify: auto` task from declaring its own plan record, and the self-targeting
    population is overwhelmingly `verify: auto`, so gating on `files:` would yield approximately
    nothing while looking correct. Ownership is instead: the path is `plan/tasks.yaml` or a
    `plan/tasks.d/*.yaml`, AND the file carries this task's own YAML list-item id line. The list-item
    form matters — a two-space anchor reads zero corpus-wide and would disable the check silently
    while every fixture-supplied test still passed.

    THE SLICE UNDER-STRIPS BY DESIGN. The helper removes only the task's OWN acceptance block,
    bounded by the next top-level list item, so the monolith's several hundred records do not bleed
    into one another. Where the boundary is ambiguous it keeps text rather than dropping it: an
    over-strip invents warnings against prose that really exists, an under-strip merely stays quiet,
    and for an advisory check silence is the cheaper error.

    THE TWO CHECKS ARE KEPT DISJOINT. The new one cedes any criterion whose pattern is a line-seam
    or case-only match outside the block, because that is the sibling's diagnosis and the sharper
    one; it fires only where the pattern is genuinely absent outside the criterion. Both share one
    helper so the ownership rule cannot drift between them.

    WIRING, AND WHY IT IS NOT PLAN-WIDE. The check rides the existing injected file reader and is
    appended at the one changed-tasks call site, alongside the aggregate rather than inside it.
    Absent reader means silence, which gives whole-plan quiet for free. Running it over the whole
    plan would surface every historical instance on every lint; scoped to changed tasks it fires
    where it is wanted, on the record being filed.
  acceptance:
    - claim: "A grep proof whose target is the task's own plan record and whose pattern matches nothing outside that record's acceptance block yields exactly one warn-severity violation"
      proof: "unit test: test/a-self-certifying-proof-warns-at-filing-time.test.ts"
    - claim: "The same proof stays silent when its pattern also matches prose outside the acceptance block, and when the target is an ordinary source file"
      proof: "unit test: test/a-self-certifying-proof-warns-at-filing-time.test.ts"
    - claim: "Ownership is read from the record's own list-item id line, so a proof naming another task's shard is silent and the monolith strips only the task's own block"
      proof: "unit test: test/a-self-certifying-proof-warns-at-filing-time.test.ts"
    - claim: "The suppression carve-out lets proofGrepUnmatchableViolations report line-seams whose only single-line match was their own proof line, while a target outside plan/ behaves exactly as before"
      proof: "unit test: test/a-self-certifying-proof-warns-at-filing-time.test.ts"
    - claim: "The check never blocks: a task whose only violation is this one still lints ok, and the linter exposes no severity override for it"
      proof: "unit test: test/a-self-certifying-proof-warns-at-filing-time.test.ts"
