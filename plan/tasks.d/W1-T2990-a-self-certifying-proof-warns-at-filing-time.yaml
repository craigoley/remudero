  note: |
    THE OPERATOR RULING THIS IMPLEMENTS, VERBATIM: "I'd prefer to lean into automation and not block
    unless required." Recorded here because W1-T2983 deliberately left severity open and this task is
    where that question was answered. Advisory is not a soft start toward blocking; nothing in this
    task proposes a later flip, and the population it would refuse was never the argument for one.

    THE FIVE CRITERIA SHARE ONE PROOF PATH, WHICH W1-T2967 RECORDS AS A DEFECT. A filing shard must
    use the pure-path `unit test:` form or its criteria grade `no-match`, so all five name the one
    falsifier file. That is the house form and it is also the shape W1-T2967 says cannot answer
    several criteria separately. Named here rather than left for a reader to notice.

    THE COMMENT-LOAD BASELINE IS IN SCOPE ON PURPOSE. The two comments this check needs — why
    ownership cannot read `files:`, and why the id anchor must be the list-item form — push
    src/lib/task-linter.ts past its recorded comment ceiling. The gate's own words are that
    recording the growth is an ordinary, reviewed outcome rather than a defeat, so the baseline row
    moves 884 -> 899 in the same diff and is declared here rather than riding in unnamed.

    RISK IS HIGH FOR SPAN, NOT FOR DANGER — `band_meaning: span` SAYS WHICH. The task touches two
    concerns, the linter rule and the one line that wires it, and Rule 19 refuses two concerns at
    risk:medium. Dropping the call site to reach one concern would ship an export nothing calls,
    which this repo has a separate ratchet for; so the span is declared rather than engineered away.
    A warn-only advisory check is not dangerous, and nothing here should be read as saying it is.

    EVERY NUMBER IN THE RATIONALE IS A QUERY TAKEN AT c51d944e AND THE TREE HAS MOVED SEVERAL TIMES
    SINCE. Re-derive before acting on any of them; the design's own first draft carried a five-line
    source-size headroom that was 337 by the time the work started.
