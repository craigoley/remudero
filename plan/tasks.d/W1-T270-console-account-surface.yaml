- id: W1-T270
  title: "the console gains an account surface — headroom is not rendered in the console AT ALL today, so this is new surface and not an extension of an existing panel; the operator's ask is to CONTROL accounts from the console and control starts with being able to see which one is spending"
  repo: remudero
  depends_on: [W1-T268, W1-T269]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 150.00
  rationale: "WITHDRAWN AS FILED 2026-07-31 by the W1-T266 ruling (docs/account-selection.md, merged as PR #1024),
    which this task's own WITHDRAW-IF clause named as the deciding authority. That record rules PINNED SERIAL-SWITCH
    mode with no concurrency, and says in terms: 'W1-T270 (console account-control surface, gated on W1-T269) should
    be WITHDRAWN as filed.' Its follow-ups ask for exactly this bookkeeping edit — 'mark W1-T269 and W1-T270
    status: withdrawn (or equivalent) in their task files per this ruling'. `withdrawn` is not one of plan.ts's
    TASK_STATUSES, so the equivalent this repo already uses for a retirement record is status: blocked (precedent:
    the W1-T139-superseded native-shell task, plan/tasks.yaml — 'RECORD of the retirement decision, not a work item').
    WHY THE RULING KILLS IT. Every acceptance criterion below was written for a LIVE MULTI-ACCOUNT panel: one row per
    configured account label, each with the per-account reserve state W1-T269 would resolve and per-account spend
    buckets grouped by the ledger dimension W1-T268 would add. With one account live per host by ruling, that panel
    renders a set with one element. W1-T269, which supplies the reserve state, is itself withdrawn by the same record.
    WHAT IS ALREADY BUILT, so no later reader rediscovers it at $150. PR #1020 (merged 2026-07-31, commit e8b2186,
    'feat(console): show which Anthropic account the fleet spends and how much is left') shipped a SINGLE-ACCOUNT
    console strip: GET /v1/account-usage (src/lib/account-usage.ts, scope read), rendering the active account's email,
    the five-hour and seven-day windows with their resets, the headroom governor posture, and an as-of age, with
    src/lib/serve.ts carrying six au-* elements and test/account-usage.test.ts + test/serve.glance.test.ts covering it.
    That is NOT this task's product — it reads ~/.claude.json live for ONE account and aggregates no ledger spend at
    all — but it is why 'which account is spending' is already answerable in the console today. #1020 also made the
    daemon's headroom heartbeat symmetric, so an ARMED under-ceiling governor emits daemon.headroom every tick.
    REVERSIBLE ON EVIDENCE, not a permanent no: if the published one-account-per-machine promise in MASTER-PLAN.md is
    ever revisited, the multi-account panel becomes wanted again and the withdrawn criteria are preserved verbatim in
    this task's note for exact re-filing."
  design: |
    NOT TO BE BUILT. Withdrawn as filed by the W1-T266 ruling (docs/account-selection.md). Left in the plan as a
    RECORD of the withdrawal decision, not a work item. status: blocked so nextRunnable/assertRunnable never
    dispatch it (drain.ts's isDispatchEligible refuses `status === "blocked"` before any dependency or breaker check).
    THE SMALLER PRODUCT THAT MAY STILL BE WANTED IS NOT THIS TASK. The ruling's own follow-ups suggest considering a
    separate, non-gated task for a read-only HISTORICAL per-account spend view — grouped by the ledger label W1-T268
    would add and bounded by ACCOUNT_ATTRIBUTION_EPOCH. That is a different and smaller product than the live
    multi-account panel filed here, it is an operator decision to file, and it is deliberately NOT smuggled into this
    entry by rewording: reshaping a withdrawn task into new scope would hide a filing decision inside a bookkeeping edit.
    depends_on is left UNCHANGED at [W1-T268, W1-T269] on purpose. status: blocked already stops dispatch before the
    dependency check is reached, so editing the edge would change nothing observable while making the graph disagree
    with what was actually filed. W1-T269 is itself withdrawn by the same ruling and needs its own entry marked — that
    is a sibling edit, not this one's.
  acceptance:
    - claim: "this task is withdrawn as filed and never dispatched; the ruling that withdrew it is recorded"
      proof: "grep: should be WITHDRAWN in docs/account-selection.md"
  risk: high
  origin: architect
  plan_refs: ["§4"]
  files: [src/lib/serve.ts, src/lib/board.ts, src/lib/glance.ts]
  status: blocked
  retirement: withdrawn
  attempts: 0
  note: "THE FIVE WITHDRAWN CRITERIA, PRESERVED VERBATIM so a future re-filing needs no archaeology:
    (1) claim 'the panel renders one row per configured account label with its window reset reserve state and spend
    buckets' / proof 'unit test: test/serve-account-panel.test.ts';
    (2) claim 'spend older than the attribution epoch is excluded and the boundary is shown rather than silently
    summed from' / proof 'unit test: test/serve-account-panel.test.ts';
    (3) claim 'a single configured account renders as a named single account and is distinguishable from a missing
    one' / proof 'unit test: test/serve-account-panel.test.ts';
    (4) claim 'the rendered shell's client script still parses after the change so the template literal was not
    terminated' / proof 'unit test: test/serve-account-panel.test.ts';
    (5) claim 'the panel is read-only — it adds no write-scoped route and no console-initiated switch affordance' /
    proof 'unit test: test/serve-account-panel.test.ts'.
    MEASURED AGAINST #1020 BEFORE WITHDRAWING, so the withdrawal does not rest on the ruling alone: (1) UNTOUCHED —
    #1020 renders no account label, no reserve state and no spend buckets; (2) UNTOUCHED — ACCOUNT_ATTRIBUTION_EPOCH
    has zero occurrences in src/ and no ledger line in 4.1M carries an account key; (3) PARTIAL — #1020 does render a
    named single account distinguishable from a missing reading, but keyed on ~/.claude.json identity rather than a
    configured account label; (4) and (5) are hygiene constraints on whatever change the task makes, proven for
    #1020's own change and not transferable. So #1020 does NOT satisfy this task — it is withdrawn by ruling, not by
    supersession.
    ORIGINAL FILING NOTE, unchanged and still true of the withdrawn product: verify:auto because serve.ts DOM
    behaviour is covered by real headless Chromium tests; risk:high for three subsystems and the backtick-template
    hazard; budget_usd 150 for the slow Chromium suite and the epoch-boundary rendering.
    WITHDRAW-IF, now DISCHARGED: the original clause read 'W1-T266 rules for a serial switch AND the operator does not
    want a spend view per epoch'. W1-T266 ruled serial (PR #1024). The per-epoch spend view is left to the operator as
    a possible separate filing, per the ruling's own follow-ups — it is not built into this entry."
