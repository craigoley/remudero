  design: |
    No new constant, interval, count or byte threshold (operator ruling). Enforcement stays on.
    1. DUE INTERVAL, NOT COMPLETION GAP. A garden's real interval is how long it naturally goes between passes: from a
       completed pass to the FIRST ask of its next pass (the tick at which its due probe next said yes). Admission and
       pass-pool wait are excluded, so starvation cannot lengthen it. startGardenOffLoop records one interval per
       completed pass: the first-ask time of that pass's due period less the previous completion. Deferred re-asks of
       the same due period do not open a new one. gardenCadence takes the median of these intervals in place of the
       completion gaps.
    2. CARRIED ACROSS RESTARTS. gardener-runtime.json's entry gains the garden's measured due-interval median and its
       sample count. parseGardenerRuntime validates both and forwards them, and the snapshot keeps its existing
       GARDENER_RUNTIME_MAX_BYTES bound.
       - createGardenerRuntimeWriter seeds each entry's lastCompletedAt and the carried median from the previous
         generation's readable file, so one short-lived boot no longer erases them.
       - Once this process has two intervals of its own, its median stands, combined with the carried one weighted by
         sample count. Below that, the carried median stands with basis "carried".
       - Only with neither does the scheduled interval stand in, with basis "scheduled", as today.
    3. ROWS. enforce_defer and the aged enforce_admit rows keep cadence_ms and cadence_basis. The basis gains "carried",
       and the rows name the sample count.
    4. BOUNDARIES. No change to evaluateShadowMemory, plan/policy.yaml hostMemoryBudget modes or limits, the wait callers,
       the garden timers or their pacing, or the aged rung's other conditions.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Fixture: an injected clock, a garden
    whose due probe says yes every fourth tick, and a pass spawn that defers twice before admitting.
