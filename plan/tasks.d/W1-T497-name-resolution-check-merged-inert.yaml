    PURPOSE: the wiring site IS the deliverable, and a shard that omitted it would reproduce the
    exact defect being fixed. budget_usd 45 — one argument at one call site, one fixture, three
    assertions.

    `files:` IS TWO PATHS AND BOTH WILL BE TOUCHED. src/run-task.ts holds `lintPlanCommand`, the
    changed-tasks call site, and already supplies `opts.moduleExists` there, so the new argument
    lands beside an existing one. test/task-linter-wiring.test.ts is the established home for
    wired-not-merely-implemented assertions and already carries `lintPlanCommand`; the new cases
    join it rather than starting a suite. NOTHING ELSE IS DECLARED: src/lib/task-linter.ts is NOT
    touched — the check's logic is correct and this task must not edit it — and
    `inverseScopeUntouchedFiles` (src/lib/review.ts) would fail a declared path the implementation
    never reaches. test/run-task.test.ts is deliberately avoided as a home: CLAUDE.md records that
    it crashes at FILE level under --experimental-test-coverage, which would nondeterministically
    zero the coverage record for a wiring test.

    PROOF NOTES: all three proofs are the pure-path form against a file that ALREADY EXISTS, so
    each resolves to exactly one file and none can trip the zero-or-many warning W1-T488 added.
    No proof names this shard, so the implementation is not capped at 0/N by self-reference — the
    failure that needed an operator override on #1812.

    ID PROVENANCE: origin/main's max is 495 and open PR #1836 mints W1-T496, so a next-id derived
    from main alone would have collided — the shape that broke main for ~24 minutes on 2026-08-14.
    `rmd next-task-id` independently returned W1-T497, and the id was re-derived immediately before
    push."
