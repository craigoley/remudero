  origin: "operator ruling, Craig 2026-10-27: \"Second account in eastus now\" — the eastus Foundry account synthwatch-foundry-eus has its own key, which Craig adds to the host env"
  plan_refs: [W1-T1069, W1-T3603, W1-T10837, W1-T10839]
  files:
    - deploy/runtime-env-vars.sh
    - deploy/recycle-container.sh
