  acceptance:
    - claim: "In the daemon's light pass a build head that lacks its own task record, when that record is on main, enters the pass's whole-snapshot refresh selection and is refreshed once; it is not escalated before that refresh has been tried"
      proof: "grep: W1-T12945 criterion 1 in test/sweep/a-head-only-a-refresh-can-clear-is-refreshed-by-the-daemons-own-pass.test.ts"
    - claim: "In the light pass a head held as base-red whose failing check is green on main enters the same selection, and its disposition no longer reads that the branch refresh is unwired"
      proof: "grep: W1-T12945 criterion 2 in test/sweep/a-head-only-a-refresh-can-clear-is-refreshed-by-the-daemons-own-pass.test.ts"
    - claim: "A refresh that does not take, or the same miss on the head a refresh produced, keeps the escalation with its cause named, and one head and cause is pressed at most once"
