    - claim: "two arms that do not share a cell are REFUSED with the cell named, never silently compared"
      proof: "unit test: test/a-mount-comparison-across-unmatched-populations-is-not-a-measurement.test.ts"
    - claim: "every arm reports its own n, so a comparison resting on a handful of runs is visible as such"
