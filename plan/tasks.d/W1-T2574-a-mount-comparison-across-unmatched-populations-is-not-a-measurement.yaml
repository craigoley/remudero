    - claim: "each arm carries its pass, blocked_ci and re-dispatch split beside its cost"
      proof: "unit test: test/a-mount-comparison-across-unmatched-populations-is-not-a-measurement.test.ts"
    - claim: "an arm whose cost advantage disappears once re-dispatches are charged to it is reported as such"
      proof: "unit test: test/a-mount-comparison-across-unmatched-populations-is-not-a-measurement.test.ts"
    - claim: "the corpus newest timestamp is printed beside every comparison, so an answer about a window predating the second provider is visible"
      proof: "unit test: test/a-mount-comparison-across-unmatched-populations-is-not-a-measurement.test.ts"
