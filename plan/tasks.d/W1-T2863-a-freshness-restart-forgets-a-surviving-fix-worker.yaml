- id: W1-T2863
  title: "A FRESHNESS RESTART FORGETS A SURVIVING FIX WORKER — the branch claim records the daemon parent pid, so the next in-container process reclaims it while the detached child still owns the registered worktree and dispatches a duplicate repair that can only fail at git checkout"
  repo: remudero
  depends_on: [W1-T2609, W1-T2845]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 18.00
  files:
