- id: W1-T3369
  title: "THE OPERATOR CONSOLE SERVED A DELETED TASK BRANCH FOR ELEVEN HOURS — `rmd serve` freezes its code at boot from the SAME checkout the daemon moves 38 times in 40 reflog entries, so which code the console runs is decided by whichever branch the daemon happened to occupy at serve's boot instant"
  repo: remudero
  depends_on: []
