  note: |
    risk:high, band_meaning: blast-radius — honest on both axes, and recorded rather than exempted.
    BLAST RADIUS: widening what a fix worker may commit reaches every PR the rung touches, so the
    bounded-registry criterion and the unrelated-path falsifier are load-bearing, not defensive
    extras. SPAN: `subsystemsOf` also scores the two declared files (an instrument and its own
    falsifier suite) as two concerns because their basenames differ, which would flag [sizing] at
    medium; the change is one concern (a fix worker may apply the edit its gate printed) and is
    unsatisfiable piecewise — a prompt carve-out whose pre-strike gate still refuses is a trap, and a
    relaxed gate under a prompt that still forbids the edit changes nothing. Same regrade shape as
    W1-T2538 and W1-T2551.

    THE PROPOSAL'S LITERAL ASK IS NOT DROPPED, IT IS ANSWERED (Standing rule 16): both ceilings were
    verified already satisfied in the checkout this was drafted from — `src/lib/account-usage.ts` at
    740 lines against a recorded 740, `src/lib/worker.ts` at 3684 against a recorded 4000 — so no
    task is filed to perform an edit whose own gate would report it as a no-op, and the requested
    `3547` is stale against W1-T2539's bucketing. If a later tree disagrees, the check is one
    command: `node scripts/source-size-ratchet.mjs`.

    depends_on IS EMPTY DELIBERATELY. W1-T2532's automatic recording mode is a sibling, not a
    prerequisite: an automatic write still produces a diff a lane must be permitted to push, and its
    own design leaves the CI path never writing, so the fix-round case this task owns survives it.
    File-overlap serialization (W1-T171) applies — both declare `src/run-task.ts`.
