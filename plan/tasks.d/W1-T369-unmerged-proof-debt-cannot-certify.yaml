  design: |
    NOT TO BE BUILT. Withdrawn as already satisfied (#1418 + #1420). Left in the plan as a RECORD of
    the withdrawal, not a work item. status: blocked so nextRunnable/assertRunnable never dispatch it —
    `isDispatchEligible` (drain.ts) refuses `status === "blocked"` before any dependency or breaker
    check, and that is the one reader of the decorative yaml field W1-T367 rules must NOT be converted,
    precisely so retirement records stay undispatchable.

    WHY IT COULD NEVER HAVE MERGED AS A DISPATCHED TASK, recorded so a fourth session does not re-file
    this shape. Its `files:` are `[plan/tasks.yaml, test/plan-proof-debt.test.ts]`. The test file sits
    OUTSIDE `isInPlanScope`, so a single PR touching both makes `planOnly` FALSE. Rewriting a proof
    necessarily DELETES a `proof:` line, so `criterionFieldTampered(diff)` fires, and
    `criteriaTampered = !planOnly && criterionFieldTampered(diff)` (Standing rule 15, W1-T58) refuses
    the PR. #1416 carried both halves and was refused on exactly that, with 18 deleted `proof:` lines;
    the split into #1418 (plan-only, carve-out intact) and #1420 (test-only, nothing to tamper with) is
    what made it mergeable. A dispatched worker gets ONE PR per run and therefore cannot produce that
    split. THE GUARD IS SHAPE-BASED, NOT CONTENT-BASED: any task whose deliverable edits acceptance
    criteria AND ships a test in the same changeset is unmergeable as filed, however correct the work.
    Third occurrence in three days — W1-T324, #1334, #1416 — so the lesson is the FILING RULE, not the
    individual PRs: a criteria-editing task must be filed as two tasks, or as an operator plan change.

    WHAT REMAINS OPEN IN THIS AREA, stated rather than quietly absorbed. Five open, unmerged
    `verify: human` tasks carry 11 blocking `proof-dialect` violations between them — W2-T2 (1),
    W3-T4 (2), W12-T1 (2), W3-T7 (3), W1-T147 (3) — every one free prose. Design note (iv) below
    excluded them from the rewrite and that exclusion was right at the time, but its stated REASON is
    now stale and must not be inherited: it says to report them as needing "a proof kind the dialect
    lacks", and the dialect no longer lacks it. W1-T277 shipped `demonstration: <what the operator must
    do>` for exactly this class — a chaos drill, a device recording, a live deploy — legal and
    lint-clean on `verify: human`, refused outright on `verify: auto`. Their debt is therefore FIXABLE
    and is a separate filing against those five shards, not a permanent gap. It is not done here: it is
    outside this task's own scope by (iv), and it would touch five further shards, each of which CI's
    changed-tasks-only lint would then re-grade in full.

    ORIGINAL DESIGN BELOW, unchanged, as the record of what was intended.

    ONE FILE, PER CLASS, IN BULK — NOT ONE TASK PER PR.
    CLAUDE.md's measured anti-pattern is explicit: five separate PRs rewrote proofs one at a time, and
    a refused task is re-selected and re-refused every tick, silently. W1-T358's design says the same
    thing from the other side — batch corrective proposals per CLASS. Both point one way.

    (i) FIX BY CLASS, NOT BY TASK. [proof-dialect] (61) is a proof with no `unit test:`/`grep:` prefix
    or a body that reads as narrative; [proof-resolvability] (42) is a prefixed proof naming an artifact
    that resolves to nothing. They have different remedies and should be separate passes over the same
    file, each independently reviewable.

    (ii) EVERY REWRITTEN PROOF MUST BE VERIFIED THROUGH `rmd check-proof` BEFORE THE PR OPENS, and the
    PR body must report the parse kind and candidate count for each. That is the reviewer's own parser
    and executor; a proof that lint-passes but resolves to zero candidates is exactly the state being
    fixed and must not be re-created. `candidates: absent` is a failure, not a pass.

    (iii) A FORWARD REFERENCE IS LEGITIMATE AND MUST NOT BE "FIXED" INTO A GUESS. These are
    unimplemented tasks, so the named test does not exist yet. Forward-referencing a PATH is safe;
    forward-referencing a SYMBOL NAME is a guess that will resolve to zero. Prefer the pure-path form
    `unit test: test/<file>.test.ts`, which lint-passes and executes the whole file.

    (iv) DO NOT REWRITE PROOFS ON `verify: human` TASKS. `isDispatchEligible` refuses them at
    `t.verify !== "auto"` BEFORE the linter is consulted, so their dialect debt can never stall the
    queue. Forcing chaos drills, device recordings and live deploys into `unit test:` yields proofs that
    parse, match zero tests, and cap the review — the exact theatre the gate exists to stop. Report them
    as needing a proof kind the dialect lacks, and exclude them from the population with a count.

    (v) THE LOCK IS THE DELIVERABLE THAT OUTLIVES THE FIX. Add a regression lock asserting the
    open-and-unmerged blocking-violation count cannot grow, so this pool cannot silently refill. A
    RATCHET is the idiom this repo already uses for exactly this shape
    (scripts/learnings-budget-ratchet.mjs, scripts/diff-coverage.mjs) and it needs no network, which
    matters because `rmd lint-plan` is deliberately offline and deterministic (W1-T367 design (iii)).
    Write the lock FIRST and watch it fail at today's count (tdd:strict).

    (vi) THE POPULATION IS COMPUTED, NOT FIXED. It drifts as tasks merge and land. The implementer must
    RE-DERIVE it at implementation time rather than trusting the 39 here, and state the number they
    actually found. If it has moved materially, say so in the PR body rather than quietly fixing a
    different set.

    NOT IN SCOPE: the 136 merged tasks (W1-T370); changing what the linter checks; converting
    `isOpenLintTask` to a derived projection (W1-T367 ruled on that deliberately and it stands);
    and the retro sweep's wiring (W1-T358).
