    **`risk: high` UP FRONT** — Rule 19 span across `src/` and `test/`, and the blast radius is a
    live merge path: a fallback that fires too widely merges a PR GitHub refused on a fact.

    **RELATIONSHIP TO W1-T1235, AND A REFINEMENT OF ITS OWN WORDING.** W1-T1235 (shipped; trailer
    present on main) is the OBSERVABILITY task — its subject terms score `bucket` 21, `rmd status`
    4, `HEADROOM` 3 — and it says the arm *"CANNOT be substituted away"* because GitHub exposes
    auto-merge through `enablePullRequestAutoMerge`/`disablePullRequestAutoMerge` mutations only.
    **THAT REMAINS TRUE OF ARMING AND IS NOT CONTRADICTED HERE.** What that sentence did not
    separate is that ARMING and MERGING are different operations: there is no REST way to register
    deferred intent, and there has always been a REST way to merge a PR that is already clean.
    This task substitutes the second, never the first. Read together, the two shards say: the arm
    itself is stuck on GraphQL, and its fallback need not be.

    **DECLARED OVERLAP.** `src/run-task.ts` is contended; `overlappingPaths` will serialise this
