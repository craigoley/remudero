- id: W1-T3652
  title: "A CHECK KILLED BY ITS OWN SUCCESSOR REPORTS `failure`, INDISTINGUISHABLE FROM A REAL ONE — cancel-in-progress makes every superseded push emit failing check runs, and the sweep reads them as evidence a PR is broken"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 15.00
  files: [src/lib/sweep.ts, test/a-cancelled-run-is-not-a-failing-check.test.ts]
  origin: oper#pr-queue-sweep-2026-09-16
  plan_refs: ["W1-T3278"]
  status: merged
  attempts: 0
  rationale: |
    MEASURED 2026-09-16: FOUR of the CI failures surfaced during one board sweep were not failures
    at all. ci.yml groups by PR with `cancel-in-progress: true`, so every push cancels its
    predecessor mid-flight -- and the jobs killed that way publish `conclusion: failure`, not
    `cancelled`. The parent RUN says `cancelled`; the individual check runs do not.

        #5737  head-identity-gate   failure on a sha the next commit had already replaced
        #5739  head-identity-gate   failure, same shape
        #5739  coverage-ratchet     "expected coverage-shard-1 artifact metadata; refusing a
                                     missing or partial artifact" -- the shards never uploaded
                                     because the run was cancelled under them
        #5737  coverage-ratchet     reported failure ONE SECOND after its run was cancelled

    Each one reads exactly like a genuine red and cost a job-log fetch to dismiss. The
    coverage-ratchet case is the worst, because its message describes a real-sounding defect -- a
    missing artifact -- that is purely an artifact of cancellation.

    THIS IS NOT COSMETIC. The fix rung reads check-run evidence (failingTestFilesFromCiFailures,
    W1-T3278) to decide what to repair. A cancelled shard's "failure" is evidence of nothing, and
    dispatching a repair against it spends a worker on a PR that was never broken.
  design: |
    A check run carries `conclusion` AND the id of the run that produced it. The discriminator is
    the PARENT: if the parent workflow run concluded `cancelled`, none of its check runs is a
    verdict, whatever their own conclusion says.

    So the reader learns one rule -- a check whose parent run was cancelled is NOT EVIDENCE -- and
    every consumer that classifies CI failure goes through it. That is a classification change, not
    a new poll: the parent run id is already on every check-run payload.

    FAIL TOWARD TREATING IT AS REAL. If the parent's conclusion cannot be read, the check counts as
    a failure exactly as today. The cost of wrongly ignoring a real red is a PR that merges broken;
    the cost of wrongly keeping one is a wasted log read, which is what we have now.

    NOT A SUPPRESSION. A cancelled check must still be VISIBLE -- it is how you notice a PR whose
    runs are being cancelled faster than they can finish, which is its own pathology. It stops being
    evidence, not output.
  acceptance:
    - claim: "a check run whose parent workflow run concluded cancelled is not classified as a CI failure"
      proof: "unit test: test/a-cancelled-run-is-not-a-failing-check.test.ts"
    - claim: "a check run whose parent completed normally is classified exactly as it is today, so a real red still repairs"
      proof: "unit test: a failure under a completed run is still a failure"
    - claim: "a parent whose conclusion cannot be read leaves the check counted as a failure, so an unreadable parent never hides a real red"
      proof: "unit test: an unreadable parent conclusion still counts as a failure"
    - claim: "the rule is one named predicate every CI-failure consumer reads, not a condition repeated per call site"
      proof: "grep: cancelledRunCheckOutcome in src/lib/sweep.ts"
  falsifier: |
    Replay #5739's coverage-ratchet check run -- conclusion failure, parent run cancelled -- and the
    classifier must not call it a failure; the fix rung must dispatch nothing. Flip the parent to
    completed and the same payload must classify as a real failure and dispatch. Make the unreadable
    arm ignore the check and the third test must fail, because that arm is how a genuine red would
    disappear.
