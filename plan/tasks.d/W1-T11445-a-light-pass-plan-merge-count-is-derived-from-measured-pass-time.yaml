  plan_refs: [W1-T5901, W1-T9212, W1-T5748, W1-T5615, W1-T4405, W1-T11434]
  files: [src/lib/sweep.ts, test/ledger/a-ready-plan-pr-merges-on-the-next-pass.test.ts]
