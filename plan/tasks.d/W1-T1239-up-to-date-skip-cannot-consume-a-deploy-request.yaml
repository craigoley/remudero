- id: W1-T1239
  title: "the `up-to-date` skip is the ONE deploy outcome that is never revisited, and it is the one outcome that does not consume `state/DEPLOY_REQUESTED` — so an operator request made when the fleet is already on origin/main is unconsumable, and the level trigger it leaves behind silently pre-authorises the NEXT deploy"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  rationale: |
    FILED FROM feedback fb-1785954511635-a6c209 (2026-08-05T18:28Z), which is itself the ADDENDUM
    that answered its own parent's falsifying check. Every claim below was RE-DERIVED FROM SOURCE at
    filing rather than carried on the entry's word, because the entry is 18 days old and one half of
    it has since been fixed by other work (see "WHAT IS ALREADY FIXED" below).

    (1) THE MARKER HAS EXACTLY TWO CONSUMERS AND BOTH ARE ON THE DEPLOYING PATH.
    `deps.clearMarker()` is called at `src/lib/deployer.ts:796` (deploy succeeded + health-check
    passed) and at `:839` (health-check failed, rolled back). Those are the ONLY two call sites in
    the repo; the definition sits at `:1145` and unlinks `deployMarkerPath` = `state/DEPLOY_REQUESTED`
    (`:846`). Control on "only two": the identifier `clearMarker` occurs in `src/` exactly five
    times — `:542` (the `DeployDeps` field), `:796`, `:839`, `:1145` (the real impl), and nowhere
    else; `src/run-task.ts` reads 0.

    (2) THE SKIP BRANCH RETURNS BEFORE EITHER OF THEM AND TOUCHES NOTHING.
    `runDeployCycle`'s first branch, `src/lib/deployer.ts:675-679`, is
    `if (!decision.deploy) { deps.clearDeferredSince?.(); deps.log("deploy.skip", {...}); return ... }`.
    It clears the idle-deferral clock and logs `reason`, `install`, `origin`. It does not read the
    request marker and does not mention it.

    (3) THE `up-to-date` SKIP IS TERMINAL — WHICH IS WHY IT, ALONE, IS A DEFECT.
    Every other non-deploying outcome is retryable and correctly leaves the request in place:
    `dirty-tree-conflict` (`:687-693`), `not-idle` pre-pull (`:719-723`), `not-idle` pre-kickstart
    (`:752-760`) and `dry-run` (`:778-781`) all return with the marker intact so a later tick can
    honour it. The `up-to-date` return (`decideDeployTrigger`, `:150-160`) is different in kind:
    install HEAD == origin/main AND the running daemon is on it, so no later tick will do anything
    either. The request is SATISFIED, and there is no path that will ever say so. Measured by the
    reporter: the request sat from 18:22:58Z across two skip ticks (18:24:23Z, 18:26:24Z) with the
    verbatim reason `up-to-date (install HEAD == origin/main, daemon alive and running it)`,
    install fe5558925 == origin fe5558925, and had to be deleted by hand.

    (4) THE COST IS NOT ONLY NOISE — THE STRANDED MARKER IS A LEVEL TRIGGER THAT OUTLIVES ITS
    REQUEST. `decideDeployTrigger` reads it as `markerPresent` (`:41`, supplied at `:665` from
    `existsSync(deployMarkerPath(...))` at `:970`) and returns
    `if (i.markerPresent) return { deploy: true, reason: "operator marker present + " + why }` at
    `:161` — ABOVE both `autoMode` branches. So a marker left behind by a satisfied request does two
    things nobody asked for the next time origin/main moves: it deploys a fleet that is human-gated
    by default, which is the control `state/DEPLOY_AUTO` exists to be an explicit opt-in for
    (docs/deploy-supervisor.md, "Governance"); and because `:161` precedes the `alreadyFailed` arm
    at `:162-164`, it also overrides the auto-mode refusal to retry a head that already failed to
    deploy. A one-shot request becomes a standing order, and neither effect is visible anywhere.

    (5) AND THE VERB PROMISES THE THING THAT CANNOT HAPPEN. `src/run-task.ts:16992-16995` prints,
    unconditionally, "The supervisor will fast-forward + kickstart the daemon at the next idle gap,
    health-check it, and roll back on failure." When the install is already on origin/main there is
    nothing to fast-forward and nothing will be kickstarted, and the operator is told the opposite.
    That line is a plain `console.log` in `runDeploy`; it is NOT the `USAGE` text, so
    `docs/cli-reference.md` (generated by `scripts/generate-cli-reference.mjs` from `USAGE`) does not
    restate it and does not move. Control: the string `requested (state/DEPLOY_REQUESTED)` occurs in
    exactly one file in the repo, `src/run-task.ts`, and in zero tests.

    WHAT IS ALREADY FIXED AND MUST NOT BE RE-LITIGATED — the other half of the entry.
    The entry also asks for `state/DEPLOY_FAILED` to retract itself on the skip path. THE
    INSTRUCTION IT COMPLAINS ABOUT IS ALREADY RETRACTED, by work that merged after the entry was
    captured: `STATIC_LATCHES` in `src/lib/status-board.ts:937-942` drops the DEPLOY_FAILED
    `next action` as soon as origin/main is no longer the failed head (`sameCommit`), keeping the ROW
    and stating `superseded`, and `LATCHES_NEXT_ACTIONS:1108` gates the advice on `!r.superseded`.
    Both directions are pinned by `test/deploy-failed-latch-superseded.test.ts` and the ruling is
    recorded in W1-T443's rationale ("SUPERSESSION WORKS"). Against the reporter's own instance —
    failedHead 6222d055, origin fe55589 — today's board renders it superseded and issues no
    instruction. What remains is only whether the FILE should be deleted, and the shipped design
    answers that deliberately in the other direction: "the RECORD is kept — a deploy that failed is
    still a fact". Deleting it from the deployer would reverse a merged ruling, so it is OUT OF
    SCOPE here and is not re-filed.
  design: |
    ONE CONCERN: a deploy request that the supervisor has decided it will never act on must be
    consumed, or must say plainly that it cannot be.

    (i) CONSUME ON THE SATISFIED SKIP, AND ONLY THAT ONE. In the `!decision.deploy` branch
    (`deployer.ts:675`), consume `state/DEPLOY_REQUESTED` — via the existing `deps.clearMarker()`,
    not a new writer — when and only when the skip is the `up-to-date` one AND the daemon's liveness
    was OBSERVED. The condition must be carried as DATA from `decideDeployTrigger` (e.g. a field on
    `Decision` such as `satisfied: true`), never re-derived by matching the reason STRING: the two
    up-to-date wordings at `:157-158` differ by exactly the fact this turns on, and a substring match
    on English is the shape that breaks the next time the sentence is edited.

    (ii) THE FAIL-CLOSED DIRECTION IS THE ENTRY'S OWN "or say plainly that it cannot".
    `decideDeployTrigger` emits the second wording — "daemon liveness not observed" — for BOTH
    `daemonAlive === false` and `undefined` (`:156-158`), and a dead daemon under a STOP marker
    reaches that branch (`:146-149` only auto-restarts when no STOP is set). Consuming a request
    there would discard an operator's ask for a fleet that is not running. So: RETAIN in that case,
    and make the retention legible rather than silent.

    (iii) THE LEDGER ROW CARRIES THE VERDICT. `deploy.skip` already logs `reason`/`install`/`origin`;
    add a field stating what happened to the request — consumed, retained-with-its-reason, or none
    present. Do not invent a second event name: this is the same skip, better described. A skip with
    no marker on disk must claim nothing at all (no "consumed" for a request that never existed).

    (iv) THE VERB STOPS PROMISING WHAT THE UP-TO-DATE CASE CANNOT DELIVER. Extend the confirmation
    printed by `runDeploy` (`run-task.ts:16992-16995`) so it also states the satisfied case: if the
    fleet is already on origin/main there is nothing to fast-forward and the supervisor consumes the
    request without a deploy. The added sentence must contain the exact phrase
    `consumes the request without a deploy`, which is what this task's grep criterion executes.
    `USAGE` is NOT edited, so `docs/cli-reference.md` is not regenerated and is deliberately not
    declared in `files:`.

    (v) EXPLICITLY NOT IN SCOPE, EACH FOR A STATED REASON. Deleting `state/DEPLOY_FAILED` — already
    answered the other way, see the rationale. `state/DEPLOY_LAST_FAILED` (`:854`), a different file
    with a different job (auto-mode retry suppression), untouched. The idle gate, its ceiling and its
    deferral clock (W1-T341/W1-T380) — this task changes no gating and no timing. And the retryable
    skips at `:687`, `:719`, `:752`, `:778`, which must keep the request exactly as they do today;
    criterion 3 exists to hold that line.
  acceptance:
    - claim: "an up-to-date skip with the daemon observed alive consumes the deploy request"
      proof: "unit test: test/deploy-request-consumed-on-skip.test.ts"
    - claim: "an up-to-date skip whose daemon liveness was not observed retains the request and names the reason it cannot consume it"
      proof: "unit test: test/deploy-request-consumed-on-skip.test.ts"
    - claim: "a dirty-tree abort, a not-idle deferral and a dry-run all still leave the request in place for a later tick"
      proof: "unit test: test/deploy-request-consumed-on-skip.test.ts"
    - claim: "a skip that finds no request on disk consumes nothing and claims nothing"
      proof: "unit test: test/deploy-request-consumed-on-skip.test.ts"
    - claim: "the deploy.skip ledger row states what became of the request"
      proof: "unit test: test/deploy-request-consumed-on-skip.test.ts"
    - claim: "a deploy that succeeds or rolls back still consumes the request exactly as it does today"
      proof: "unit test: test/deployer.test.ts"
    - claim: "the rmd deploy confirmation states that an already-current fleet consumes the request without a deploy"
      proof: "grep: consumes the request without a deploy in src/run-task.ts"
  origin: feedback#fb-1785954511635-a6c209
  plan_refs: ["W1-T443", "W1-T341", "W1-T380"]
  files: [src/lib/deployer.ts, src/run-task.ts, test/deployer.test.ts, test/deploy-request-consumed-on-skip.test.ts]
  status: queued
  attempts: 0
  note: |
    `test/deployer.test.ts` IS DECLARED BECAUSE IT IS THE SUITE THAT GOES RED, not as a courtesy —
    the same reason W1-T443 declared `test/status-board.test.ts`. It already asserts the skip and
    marker behaviour this task changes: `:27` ("marker present + behind ⇒ deploy; up-to-date ⇒
    never"), `:222`/`:241` (the `clearMarker` call recorded on the deploying path), `:629`
    (`clearMarker` removes the request, and is idempotent when already gone) and `:940` (the
    up-to-date line no longer CLAIMS a daemon it did not observe — the very distinction criterion 2
    turns on). Criterion 6 points at that file deliberately: the existing consumers must keep
    working, and a change that moved consumption OUT of the deploying path would pass every new
    assertion while breaking the old contract.

    ONE grep CRITERION, AND IT GREPS WHAT THE CHANGE ADDS. The printed confirmation is a
    `console.log` inside `runDeploy` in a 17k-line CLI entrypoint with no existing harness capturing
    it, so a path-form unit-test proof would name a suite nobody is going to write; the phrase
    `consumes the request without a deploy` is new text this task introduces, reads 0 in the repo
    today, and is fixed by the design so the implementer cannot drift from it. It is stated
    POSITIVELY — it must MATCH after the change, never miss — and it carries no ` in ` inside the
    pattern, so the parser's split lands on the real path. Every other criterion is the whole-file
    `unit test:` form.

    risk:high IS RULE 19'S SPAN, NOT BLAST RADIUS. `files:` crosses `src/lib/deployer.ts` and
    `src/run-task.ts` (plus their tests), which is >=2 subsystems and a sizing violation at any lower
    band — raised up front rather than after `rmd lint-plan` refuses it (the W1-T400/W1-T407 lesson,
    re-learned by W1-T1234). Decomposing is the wrong answer: the verb's new sentence is a LIE until
    the deployer actually consumes, and the deployer consuming without telling the operator is the
    silent half of the same defect. The change itself is small — one field on an existing `Decision`,
    one call to an existing `clearMarker`, one extra ledger field, one sentence.

    verify:auto — the ruling this might have needed was made by the operator IN the feedback entry:
    "a skip that finds nothing to do has satisfied the request and should consume it, or say plainly
    that it cannot." Both arms are implemented, and which arm applies is decided by observed liveness
    rather than by preference.

    THE FALSIFIER THAT MATTERS IS CRITERION 3, NOT CRITERION 1. "Consume on skip" is trivially
    satisfiable by consuming on EVERY skip, which would throw away a request the moment a task is in
    flight or the tree is dirty — a strictly worse defect than the one being fixed, and one whose
    only symptom is a deploy that never happens. The retryable skips are asserted alongside the
    satisfied one for that reason.

    NO AGE, COUNT OR SHA FROM THE ENTRY IS QUOTED FORWARD as a current fact. The 18:22:58Z request,
    the two skip ticks and fe5558925 were true on 2026-08-05 and are cited as the measurement that
    produced this filing; the source line numbers above were re-derived at filing and are the claims
    a reader should check.
