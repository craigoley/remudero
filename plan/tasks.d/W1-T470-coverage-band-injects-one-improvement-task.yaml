  note: "`risk: high` IS SET UP FRONT. `sizingViolation` (`src/lib/task-linter.ts`) blocks at
    `>=2 subsystems while risk<high`, and `files:` spans `src/lib/`, `.github/workflows/` and
    `test/`. The band is Rule 19's SPAN, not blast radius — the producer is inert until its one-line
    step is wired, and the runtime blast radius is one `plan/feedback/` entry per red-band CI run.

    `files:` INCLUDES THE EXISTING TESTS THAT ASSERT THE SHAPES THIS TASK CHANGES, not only the new
    ones. `test/coverage-ratchet.test.ts` carries the two `coverage-ratchet CI wiring` tests that
    assert the coverage job's step wiring in `.github/workflows/ci.yml` — the exact job the producer's
    step is added to. `test/ledger-rotation.test.ts` re-derives
    `DECISION_RELEVANT_LEDGER_STEPS` from every consumer's source, so it fails the moment the
    producer's dedupe step is read without being registered there; that is a whole-suite check a
    scoped local run cannot catch. `src/lib/feedback.ts` is listed because the producer calls
    `captureFeedback` rather than writing YAML by hand, and `src/lib/ledger.ts` because the step
    constant lives there.
    `test/instrument-isolation.test.ts` is DELIBERATELY ABSENT: it asserts the W1-T297 entanglement
    rules in general, which this task obeys rather than changes.

    THE TWO-PR SPLIT IN (6) IS A CONSTRAINT ON THE IMPLEMENTER, NOT A SECOND TASK. `files:` spans
    both halves because one task owns them; the implementer must simply not put them in one diff.

    THE CALL-SITE CRITERION NAMES `injectCoverageImprovementTask` DELIBERATELY, and that name is a
    SPECIFICATION rather than a guess about existing code — the symbol does not exist yet, and the
    linter's `call-site` check requires a criterion of the form `grep: <symbol>( in <caller>` or the
    module can merge green and unreached, which it says has already happened to eleven modules. The
    caller is `src/run-task.ts` because the producer is reached as an `rmd` verb: the coverage job
    cannot invoke a `src/lib/` module directly without either a bare `tsx -e` incantation in the
    workflow or a second entry point. Forward-referencing the PATH is safe; the implementer must
    honour the SYMBOL or update this criterion in the same PR.

    THE SHARD'S OWN PATH IS DELIBERATELY *NOT* IN `files:`, AND THAT COSTS SEVEN `proof-scope`
    WARNINGS ON PURPOSE. Every content criterion greps this file, so `proof-scope` warns that
    `scopeGuardOutOfScopeFiles` (`src/run-task.ts`) would refuse a branch touching a path outside
    `files:`. ADDING THE PATH WAS TRIED HERE AND IS STRICTLY WORSE — MEASURED: it trades those seven
    WARNINGS for one HARD `rule15-filing` violation, because declaring a plan-scope path alongside
    `src/` paths at `verify: auto` destroys the reviewer's `planOnly` carve-out, so `criteriaTampered`
    refuses the PR however good the work is, and a dispatched worker gets ONE PR and cannot split it.
    The warning is the endemic shape rather than a novel defect: 357 such warnings already exist
    across the plan, and W1-T468 — filed the same day and MERGED GREEN — carries three of them with
    zero hard violations. The implementer must therefore not touch this shard on the
    implementation branch; if a criterion needs rewording, that is a separate plan-only edit.

    ONE FIGURE IS DELIBERATELY ABSENT FROM THIS SHARD: the per-file attribution percentages. Clause
    (5) explains why — the commissioning brief's own carried numbers failed to reproduce, and the
    producer computes them at run time from the job's lcov. The measurements quoted in (5) are
    provenance for THAT decision and must not be copied into the injected task."
