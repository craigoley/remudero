  rationale: |
    On 2026-11-11 the W1-T12192 author run at c3aeea580c6852b29373aa7db16b24246862a17c
    completed 2933 tests with one failure: the real broker client sends a single agent
    revalidation and writes no ledger rows. Its expected command result 0 was 1.
    Independent unchanged controls reproduced the same single failure at source merge-base
    2060175152b1781bdfce059a3f0aacd2cde8ff44, owner head c3aeea580c and freshly fetched main
    17745c6bfb684709919437f870595eb4c8fa9953. Captures were complete and child groups closed.
    The fixture, pr-state reader, ledger helper and dependency lock blobs match base and head.
    A new local diagnostic using the actual brokerRequest and owned ledger fixture connected
    successfully to the 94-byte socket path, while its 119-byte cache symlink alias returned
    EINVAL on Darwin/Node24.22.2 despite naming the same inode. This isolates a socket-address
    boundary, not a missing broker service or a coverage-mount production regression.
    The source PR discloses the baseline failure and retains hosted CI as its normal gate;
    this repair does not retroactively declare the failed author run successful.
    A 15-of-15 open-head tree census at main17745 found the same fixture blob in every head
    and no added matching broker/socket subject plan rows. Recheck before implementation.
    Durable receipts and the unapplied approved adapter are in the operator's handoff notes,
    runtime-continuation-20261110/W12192-broker-client-paired-controls.json,
    W12192-broker-current-main-control.json, W12192-broker-socket-alias-diagnostic.json and
    broker-client-socket-fixture-adapter-proposed.patch.
  design: |
    1. In this existing file only, import the existing ownedFixtureDir helper. Allocate only
       the real-broker case's ledger with writeLedger(..., { dir: ownedFixtureDir(t, "gh").dir }).
       Its registered ownership/cleanup remains active.
    2. Use that owned directory directly for RMD_GH_CACHE_HOME. Create remudero/gh-broker
       beneath it as the same owned symlink to the fixture. Remove only the redundant cache
       segment. Keep the real server/client, responses, requests and ledger checks unchanged.
    3. Preserve every existing assertion, expected value, title, timeout and skip. Do not
       introduce a fake broker reader, live GitHub access, production source change, global
       TMPDIR change, gate exclusion, allowance, registry edit or new shared helper.
    4. Verify unchanged-main versus candidate on the observed Mac account temp geometry,
       run the full existing fixture file and remove each adapter arm to establish its
       load-bearing role. Azure may replay the measured path geometry in private scratch;
       retain the native Mac consumer receipt as a separate platform control.
