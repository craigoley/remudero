- id: W1-T4338
  title: "RMD APPROVE CANNOT RATIFY A SKILL-WORKSHOP DRAFT — `approveProposal`/`RatifyGateway.createRatificationBranch` (src/lib/inbox.ts) know only ONE payload shape, a tasks.yaml fragment; a `skill-draft:<hash>` proposal's approval is described by W1-T2766/W1-T3101 as writing `.claude/skills/<name>/SKILL.md`, but nothing in inbox.ts or run-task.ts branches on that proposal shape, so approving one today would misfile a skill's markdown as a plan-task fragment instead of installing it"
  repo: remudero
  depends_on: [W1-T2766, W1-T3101]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  band_meaning: span
  budget_usd: 60.00
  files: [src/lib/inbox.ts, src/lib/skill-workshop.ts, src/run-task.ts, test/skill-draft-ratification.test.ts]
  origin: architect
  plan_refs: ["P25", "§7B"]
  status: merged
  attempts: 0
  rationale: |
    Verified at this checkout. `stageSkillDraft` (src/lib/skill-workshop.ts) stages a skill-draft
    candidate as an inbox proposal whose `summary` states, verbatim: "Approving this proposal drafts
    a plan PR that writes '.claude/skills/<name>/SKILL.md' — nothing writes under .claude/skills/
    outside that PR." W1-T2766's design clause (iii) and W1-T3101's rationale both assert the same
    mechanism: ratification writes the skill file directly.

    THAT MECHANISM DOES NOT EXIST. `approveProposal` (src/lib/inbox.ts) builds exactly ONE payload
    shape — `RatificationPayload { proposalId, fragmentYaml, stampLine }` — from
    `classification.draft.fragmentYaml`/`.stampLine`, and passes it to
    `RatifyGateway.createRatificationBranch`, whose own doc comment says it files "the fragment as
    one `plan/tasks.d/` shard per task." Grepping "skill" and "SKILL.md" across src/run-task.ts and
    src/lib/inbox.ts returns ZERO hits outside skill-workshop.ts itself. `Proposal` (inbox.ts) has no
    field carrying the drafted `SkillDraft`'s name/markdown through to approve-time — only the
    composed `summary` string lives in the registry, and nothing reads it back apart to recover a
    file path and body.

    THE CONSEQUENCE IS ALREADY OBSERVED BY A SIBLING SHARD. W1-T3379 (queued, filed 2026-09-11)
    states: "the current approved tree contains only the generated `grfp` and `tddr` macro skills...
    so no custom procedure is currently injectable" — in the entire lifetime of the skill-workshop
    mechanism, ZERO skill-workshop-drafted skills have ever reached `.claude/skills/`. This is the
    same shape this fleet has caught and fixed once already (W1-T3101: "the producer is uncalled") —
    here it is the CONSUMER of ratification that is uncalled, one step later in the same pipeline.

    NOT THE SAME GAP AS W1-T3137. That queued task is about whether a worker's NATIVE Skill-tool
    invocation can discover `.claude/skills/*` under `settingSources: []` — a real, separate SDK
    limitation, and this proposal's own `describeWorkerSkillReachability` line is honest about it.
    But W1-T3101 (merged) already built an INDEPENDENT route that sidesteps `settingSources`
    entirely: `loadInjectableSkills` reads `.claude/skills/<name>/SKILL.md` off disk directly at
    prompt-assembly time, and `renderSkillsPart` injects a skill's body as literal CONTEXT text for
    any task whose type matches the skill's `applies-to:` frontmatter — which this proposal's own
    draft already carries (`applies-to: implement`). So a WRITTEN
    `.claude/skills/implement-clean-single-strike-095bf3e6/SKILL.md` would reach implement-task
    prompts today via that route, entirely independent of `settingSources` — PROVIDED the file is
    ever written. Nothing writes it, because the approve-time write path this task builds is absent.
  design: |
    (i) `Proposal` (inbox.ts) gains an optional structured field alongside `summary` — e.g.
        `skillFile?: { name: string; markdown: string }` — populated by `stageSkillDraft`
        (skill-workshop.ts) from the `SkillDraft` it already renders, so approve-time recovers the
        exact target path and content without re-parsing the composed `summary` string.
    (ii) `approveProposal` (inbox.ts) branches on that field BEFORE building a `RatificationPayload`:
        when present, it calls a NEW `RatifyGateway.writeSkillFile(skillFile)` member — returning a
        branch name the same way `createRatificationBranch` does — instead of the fragment/stamp
        path. `openPlanPr` and the resume/adopt machinery (`findPushedBranch`/`findExistingPr`) run
        exactly as today, unconditionally on the returned branch, so no PR-open/resume logic is
        duplicated.
    (iii) The real gateway (run-task.ts) implements `writeSkillFile`: on a fresh branch, write
        `.claude/skills/<skillFile.name>/SKILL.md` with `skillFile.markdown` verbatim, commit, push —
        reusing the SAME clone/worktree/commit/push helpers `createRatificationBranch`'s
        implementation already calls, never a duplicated git-plumbing path.
    (iv) A proposal with NO `skillFile` (every existing P## task-filing proposal, and every proposal
        ratified to date) is COMPLETELY UNCHANGED — `createRatificationBranch` still receives the
        fragment/stamp payload exactly as today. This is the regression guard and the load-bearing
        claim: this task must not touch the path every non-skill ratification already relies on.
    (v) NOT IN SCOPE: widening `settingSources`, changing `describeWorkerSkillReachability`'s
        verdict, or improving `PROCEDURAL_STEP_TEXT`'s step wording — separate, independently
        arguable concerns. This task is the write-path wiring alone.
  acceptance:
    - claim: "a proposal carrying a skillFile payload routes approval to writeSkillFile and never to createRatificationBranch"
      proof: "unit test: a proposal carrying a skillFile payload routes approval to"
    - claim: "writeSkillFile writes the exact path .claude/skills/<name>/SKILL.md with the drafted markdown verbatim, on its own branch, before openPlanPr runs"
      proof: "unit test: writeSkillFile writes the exact path .claude skills <name> SKILL.md"
    - claim: "a proposal with no skillFile field is byte-for-byte unaffected — createRatificationBranch is invoked exactly as it is today"
      proof: "unit test: a proposal with no skillFile field is byte-for-byte unaffected"
    - claim: "stageSkillDraft populates the proposal's skillFile field with the SkillDraft's own name and markdown, not a re-parse of the composed summary string"
      proof: "unit test: stageSkillDraft populates the proposal s skillFile field with the"
  falsifier: |
    CLOSE WITHOUT IMPLEMENTATION IF `approveProposal` or `RatifyGateway` already special-case a
    `skill-draft:` (or otherwise `skillFile`-bearing) proposal shape. Re-check:
    `grep -n "skill" src/lib/inbox.ts src/run-task.ts` outside skill-workshop.ts imports/citations,
    and confirm the approved `.claude/skills/` tree still holds no skill beyond the generated
    `grfp`/`tddr` macros (per W1-T3379's own falsifier check). Measured at this checkout: zero
    non-import hits, and the approved tree unchanged.
  note: |
    Filed from a direct read of src/lib/inbox.ts + src/run-task.ts alongside skill-workshop.ts; not
    inherited from any existing task's text. risk:high / band_meaning:span is deliberate, matching
    this codebase's own precedent for genuinely atomic cross-file coupling: the branch point (ii) is
    only meaningful together with the field (i) and the real write (iii) — a field with no consumer,
    or a consumer with no populated field, proves nothing, so this is not decomposed further.

    Distinct from W1-T3137 (native Skill-tool discoverability under settingSources — untouched here)
    and from W1-T3379 (post-approval effectiveness measurement, which cannot begin until SOME skill
    reaches the approved tree — this task is that prerequisite, though W1-T3379 is left unedited and
    does not depend_on it).

    This proposal's own staged evidence (91 supporting merged implement runs for the
    clean_single_strike shape) is not re-litigated here — the fragment above is confined to the
    wiring gap that blocks EVERY skill-draft proposal, including this one, from ever being ratifiable
    as designed. Once this lands, the operator can re-approve `skill-draft:095bf3e60137974c` (still
    staged, untouched by this task) and it will actually write the file this task makes writable.
