    - claim: "the measured residue and its credit check are recorded alongside the ruling so the next reader does not re-derive them"
      proof: "demonstration: operator confirms the recorded entry carries the residue ids and the credit paths each was checked against"
    - claim: "if the ruling authorises no change, this task closes as a recorded decision rather than staying queued as work nobody intends to do"
      proof: "demonstration: operator confirms the task's terminal state matches the ruling"
