  rationale: |
    OBSERVED AT ORIGIN/MAIN 2026-09-05. W1-T2841 now starts `.github/workflows/acr-build.yml`
    automatically only when `deploy/Dockerfile` or `deploy/entrypoint.sh` lands on `main`. Both
    trigger modes publish `${GITHUB_SHA}` as an immutable ACR tag and stamp that SHA into the
    image. `deploy/recycle-container.sh` already accepts `--tag <sha>`, authenticates to ACR,
    pulls before pausing, waits for the existing drain, verifies the started image digest and,
    after W1-T2857, verifies the selected provider mounts. Those are the two durable halves of a
    deployment, but nothing joins them: `deploy.request`, `deployment.request` and
    `recycle.request` have zero source/test hits, and Serve has zero recycle/deploy routes.

    This is why an automatic build can finish while the fleet remains on the prior image until an
    operator notices drift, opens a shell and repeats a long procedure. The inverse is also unsafe:
    letting an always-on web process run Docker directly would give Serve the Docker socket and
    turn a browser request into an unbounded lifecycle action. W1-T2858 establishes the required
    observation boundary first: a host producer writes sanitized runtime health and Serve reads
    shared state only.

    Build detection should not spend GitHub budget. The immutable ACR SHA tag is the build receipt;
    the host already has Azure/Docker access, while Serve intentionally has neither. The steady
    state therefore needs no workflow polling, no GitHub token in Serve and no image pull merely to
    discover readiness. A failed or unfinished build is a visible pending/refused state, never
    permission to recycle onto `latest` or a cached image.
  design: |
    Add a small host-side deployment supervisor with an explicit check/install script for its
    systemd timer. On its bounded tick, derive the desired baked-path SHA from the mounted checkout,
    query ACR metadata for that exact immutable tag without pulling it, and atomically publish a
    sanitized deployment-readiness snapshot under shared state. Model `current`, `build_pending`,
    `ready`, `deploying`, `succeeded`, `failed` and `unknown` separately. For a missing tag, check at
    five minutes, again at five minutes, then use bounded backed-off intervals; persist
    `next_check_at` so restarts cannot reset the cadence into a hot poll. Unchanged ticks write no
    ledger or snapshot churn. Never query GitHub from this path.

    Extend Serve with a prominent deployment card fed only by W1-T2858's runtime-health snapshot
    and the supervisor snapshot. A high-tier authenticated operator must complete a two-step
    confirmation that names the exact SHA/digest. Confirmation atomically writes one bounded,
    replay-resistant request signed by a host-owned capability key mounted read-only into Serve but
    not the daemon. The request endpoint does not invoke a child process and does not itself start,
    stop, pause, recycle, build or deploy anything. Missing/stale/unknown readiness disables the
    action and explains why.

    The host supervisor is the sole consumer. Re-read the ACR tag, verify the signature, nonce,
    freshness, expected SHA and digest, and claim the request atomically. Then invoke the repository
    `deploy/recycle-container.sh --tag <sha>` exactly once and only from the host. Preserve every
    existing refusal: pull failure occurs before pause, active work drains within the existing
    bound, and a refused run clears its pause. After success, run `deploy/verify-image.sh` against
    the exact digest and consume W1-T2857's runtime-contract verdict. Publish a bounded terminal
    receipt that the console can render; redact command arguments, host paths, environment and
    credentials. A retry is a new confirmed nonce, never an automatic loop over lifecycle.

    Keep manual `recycle-container.sh` and `verify-image.sh` use available. The installed timer may
    observe readiness automatically, but it must never synthesize a deployment request: the
    operator remains the lifecycle authority. Default install mode is read-only check; only an
    explicit `--install` changes systemd state, and commissioning remains a separately approved
    operational step after this PR is reviewed and merged.
