  falsifier: |
    Close without implementation if current main already exposes a confirmation-gated Serve route
    whose host-side consumer pins and verifies the immutable ACR artifact. The source census found
    no deployment request vocabulary or Serve route, while the existing workflow/recycle scripts
    prove the producer and executor remain disconnected.

    Re-design rather than build if the action requires a Docker socket, Azure credential or GitHub
    token inside Serve; if the capability key is visible to daemon workers; if readiness can only
    be inferred by pulling `latest`; or if any timer can deploy without a fresh operator-signed
    request. Those erase the privilege, quota and lifecycle boundaries this task exists to keep.
