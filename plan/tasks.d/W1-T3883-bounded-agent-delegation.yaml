- id: W1-T3883
  title: "BOUND AGENT-TO-AGENT DELEGATION — signed capability handoffs, no transitive authority, expiry, and explicit recipient acceptance"
  repo: remudero
  depends_on: ["W1-T3878", "W1-T3880"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 90.00
  risk: high
  band_meaning: blast-radius
  origin: "research:instinct-automation-2026-09-20"
  plan_refs: ["§Self-improvement", "§Credential boundary", "W1-T3855", "W1-T3878", "W1-T3880"]
  files:
    - src/lib/automation-action.ts
    - src/lib/serve.ts
    - openapi/daemon.yaml
  status: queued
  attempts: 0
  rationale: |
    Personal agents are beginning to coordinate across people and services. That can remove tedious
    coordination work, but an agent must never smuggle authority from one principal, repository, or
    account into another. RMD should make delegation a signed, bounded capability handoff rather than
    a free-form message between workers.

    This task is intentionally later than the single-agent trust and secretless capability contracts.
    W1-T3855 owns one-agent action execution; it does not own agent identity or cross-principal
    delegation. This task provides the identity and permission rules needed for future multi-agent
    workflows while keeping production, financial, destructive, and credential actions human-gated.
  design: |
    Add a versioned delegation envelope that names sender and recipient identities, principal,
    purpose, exact capability references, resource scope, audience, expiry, nonce, parent receipt,
    acceptance state, and revocation path. The recipient must explicitly accept the envelope before
    acting. A recipient may narrow but never widen the grant; forwarding creates a new envelope with
    a new approval and never inherits transitive authority.

    Verification failures, replay, expiry, revoked parent grants, identity mismatch, and unavailable
    audit sources become explicit refusals. Preserve the original and child receipts so operators can
    reconstruct who authorized which side effect without storing raw prompts or secrets.
  acceptance:
    - claim: "a delegation envelope binds sender, recipient, principal, purpose, capability, scope, audience, expiry, nonce, and parent receipt"
      proof: "unit test: agent delegation refuses incomplete identity scope or parent receipt"
    - claim: "the recipient must explicitly accept before acting and may only narrow the granted capability"
      proof: "unit test: agent delegation requires acceptance and forbids capability widening"
    - claim: "forwarding, replay, expiry, revocation, identity mismatch, and unavailable audit sources refuse safely"
      proof: "unit test: agent delegation refuses replay expiry revocation identity mismatch and audit absence"
    - claim: "high-risk, destructive, financial, and credential actions remain human-gated across handoffs"
      proof: "unit test: agent delegation preserves human gates for high-risk actions"
    - claim: "parent and child receipts are linked and bounded without raw prompts, secrets, or transcripts"
      proof: "unit test: agent delegation records linked redacted receipts"
    - claim: "the operator-agent handoff path calls the bounded automation action module"
      proof: "grep: executeBoundedDelegation( in src/lib/operator-agent.ts"
  falsifier: |
    Let a recipient act before acceptance, widen a grant, forward authority transitively, replay a
    nonce, act after parent revocation, or hide the identity chain. The corresponding proof must fail.
  note: "This task is a protocol foundation only; it does not enable arbitrary external-agent federation or bypass human review. reservation hand-off: unknown -> run-W1-T3878-1789934131000"
