- id: W1-T11447
  title: An empty run directory never defers engine pruning forever, because the prune takes each engine's pin before removing it
  repo: remudero
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 5.00
  risk: high
  band_meaning: span
  origin: "2026-11-05 operator engine cut: engine.prune_deferred on run-W1-T9328-1792218295640-5526, an empty run directory from 2026-10-17"
  plan_refs: [W1-T9910, W1-T10000, W1-T9738]
  files: [src/lib/engine-tree.ts, src/lib/run-child.ts, test/an-empty-run-directory-never-defers-engine-pruning-forever.test.ts]
  status: queued
  attempts: 0
  rationale: |
    On 2026-11-05 an operator-run engine cut in core logged engine.prune_deferred: "run
    run-W1-T9328-1792218295640-5526 is unreadable and names no engine (missing: ENOENT ... spec.json)".
    Two directories under state/runs are completely EMPTY: run-W1-T9328-1792218295640-5526 and
    run-W1-T9864-1792210514811-04fd, both last modified on 2026-10-17. namedByLiveRuns
    (src/lib/engine-tree.ts) returns undecidable for any non-terminal directory that has neither a spec
    nor a status, so pruneEngineTrees has removed nothing since then and old engine trees pile up
    under state/engines.
    W1-T9910 settles SPEC-ONLY directories. An empty directory has no spec, so W1-T9910 never reaches it.
    Empty directories come from both run-dir creation sites in src/lib/run-child.ts (the probe at ~:419,
    the run at ~:852). Each calls mkdirSync(dir) and then awaits pinEngineForRun(..., writeSpec). When the
    pin returns unavailable (engine unpublished, or pin busy past its wait), or the process dies between
    the two calls, the directory stays empty forever.
    The undecidable rule exists for a real reason. pruneEngineTrees does NOT take the per-engine pin lock
    (tryAcquirePin) that pinEngineForRun holds while it writes the spec. So an empty directory inside that
    window is the only thing stopping a prune from removing the engine a run is pinning at that moment.
    Simply skipping empty directories would reopen that race.
  design: |
    1. Prune under the pin. For each engine pruneEngineTrees would remove, it takes that engine's pin lock
       with the same non-blocking tryAcquirePin that pinEngineForRun uses. If the lock is held, the
       engine is kept this pass and named in the engine.pruned / engine.prune_deferred row. If the lock is
       taken, it re-reads which run specs name that engine while holding it, removes the engine only when
       none does, then releases the lock. A spec can only name an engine by being written under that
       engine's pin, so a directory with no spec cannot be naming one, and no window is left open.
    2. With 1 in place, namedByLiveRuns skips a run directory that holds NO entries at all instead of
       returning undecidable, and the prune row counts the empty directories it skipped. A directory with
       some content but no spec and no status keeps today's undecidable answer, because its content is
       unknown.
    3. Forward: both creation sites in run-child.ts remove the directory they just created
       (rmdirSync, which only succeeds on an empty directory) when pinEngineForRun returns unavailable or
       throws before the spec is written. The run site also drops it from inFlightRunDirs.
    No new constant, no age or count bound. The pin lock and the directory's emptiness are the whole rule.
  acceptance:
    - claim: "An empty run directory no longer defers pruning: with one present, pruneEngineTrees removes an unnamed, unpinned engine, and an engine whose pin lock is held at prune time is kept that pass"
      proof: "grep: W1-T11447 criterion 1 in test/an-empty-run-directory-never-defers-engine-pruning-forever.test.ts"
    - claim: "A run directory with content but no spec and no status still defers the prune, and a probe or run whose engine pin comes back unavailable leaves no run directory behind"
      proof: "grep: W1-T11447 criterion 2 in test/an-empty-run-directory-never-defers-engine-pruning-forever.test.ts"
  note: |
    Tests use a real state root: a published newest engine, an older unnamed engine, and an empty
    runs/<id> directory, then run the real pruneEngineTrees. At base the older engine is kept
    (engine.prune_deferred). With the fix it is GONE; assert its absence. Pin-held case: take the older
    engine's pin lock in the test, prune, and the engine is kept. The builder names each criterion test
    with the marker "W1-T11447 criterion N" so the reviewer can map tests to criteria.
  falsifier: |
    Drop step 2, so empty directories stay undecidable. Criterion 1's test must then fail, because the
    unnamed engine is kept. Drop step 1's pin acquisition while keeping step 2. The pin-held case must
    then fail, because the pinned engine is removed.
