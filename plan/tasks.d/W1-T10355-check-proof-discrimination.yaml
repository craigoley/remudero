    This rung is structurally different: it changes the code path that publishes the PR.

    Settled by lookup: is this already filed or decided? -> No other task gates the pre-open create on a failing proof. W1-T11157 (plan_refs this task) reuses the hosted result inside review and owns the workflow edit. W1-T10742 decided inconclusive proofs open, and that ruling stands. W1-T10919 lists "an exit-1 proof still opens" as existing behaviour, not a ruling. This task supersedes only that one behaviour (plan/tasks.d/W1-T11157-*, W1-T10742-*, W1-T10919-*).
    Settled by lookup: where does the PR open on a failing proof? -> The claim that openPullRequestCheckedAsync defaults openOnFailingProof=true is imprecise. ghPrCreateFillCommandAsync defaults it to false (src/cli/commands/run-task-verb.ts:1812). The daemon's only build-open call passes `true` (run-task-verb.ts:7581). On an exit-1 PrOpenRefusedError carrying failingProof, the catch at :1820-1831 builds the create with bodyWithFailingProofAtOpen. That catch is the defect.
    Settled by lookup: does pre-open already parse the body and check discrimination? -> Yes. openPullRequestChecked (src/lib/pr-open.ts:441-514) refuses a malformed or diverged Acceptance block, adds the trailer and runs every filed proof through `rmd check-proof --base <merge-base>`. Exit 5 (passes at base) is already refused as stale-proof, and recordRefusedPrOpen escalates it as BLOCKED with amend-proof. Only an exit-1 failure is opened red. Nothing in the hosted workflow needs to change.
    Settled by lookup: can a metadata-only correction be applied to the build PR itself? -> No. A trailered PR's criteria are read from the PLAN at its head, not the body (scripts/proof-discrimination-gate.mjs criteriaForReview; src/lib/proof-amendment.ts header). The pre-open body must equal the filed criteria (pr-open.ts sameCriteria). A criterion edit on the build branch is refused by Rule 15 (scripts/rule15-precheck.mjs, criterionFieldTampered). So a correction can only reach the plan through the existing parent-owned amend-proof route, and the PR is created only after the pre-open check passes again against a plan that carries it.
    Settled by lookup: can a failing (exit-1) proof be corrected as metadata? -> No. A test that fails at head is a code defect. Narrowing the proof to a passing title would hide a red test, so exit 1 is never corrected and goes to the branch-gap path.
    Settled by lookup: what stops a refused build from being stranded (#10551, the reason opening red was added)? -> recordRefusedPrOpen ledgers pr.open_refused with branch and head. branch-gap is released for re-dispatch by the orphan-branch grace (#8145; pr-open.ts:283-288), and stale-proof escalates. This task must keep both routes and add the proof and its output to the evidence.
    Settled by lookup: does removing the workflow path change the risk band? -> No. risk: high, verify: human and the escalate ruling are preserved here. The ruling's pin drifts with this edit, so the machine-filing judge re-rules the record. verify: human still parks it for a person (task-linter.ts machineAuthorVerifyViolation).

    WHAT COUNTS AS A REMEDY: a change to the code path above so that this round is never dispatched, or is self-healed
