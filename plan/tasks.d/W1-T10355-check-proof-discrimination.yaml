  design: |
    SCOPE: the daemon's pre-open PR create path only. NOT IN SCOPE: .github/workflows/proof-discrimination-gate.yml and
    scripts/proof-discrimination-gate.mjs (unchanged; W1-T11157 owns them), review, approval, author qualification, the merge gates,
    and src/run-task.ts (keep ghPrCreateFillCommandAsync's exported signature, so its wrapper there is untouched).
    1. run-task-verb.ts ghPrCreateFillCommandAsync: a PrOpenRefusedError carrying failingProof (check-proof exit 1) is rethrown even
       under openOnFailingProof, so the create argv is never built. The flag keeps only W1-T10742's inconclusive open. Retire the
       pr.opened_with_failing_proof step. bodyWithFailingProofAtOpen may stay exported, but this path must not call it.
    2. The existing catch at run-task-verb.ts:7582-7621 then handles it: recordRefusedPrOpen, branch kept on origin, verdict failed with
       stage pr_open.refused and cause base-proof-refused. Add the proof and its bounded check-proof output to the pr.open_refused row,
       so the evidence is exact.
    3. DETERMINISTIC CORRECTION, stale-proof (exit 5) only, harness-derived and never worker-proposed. Candidates are literal (non-template)
       test titles in a test/ file the task's files: declares that exists at head. Each title must be unique across the head test corpus
       and absent at the merge base. Exactly one candidate must give `rmd check-proof "unit test: <title>" --base <merge-base>` exit 0.
       That candidate is named as the proposal in the existing BLOCKED amend-proof escalation, in the same way
       pr.open_guard_proof_amendment names guard proofs. It is never written to the PR body or the build branch. No claim is
       touched. Zero or several candidates, or a failing re-check, propose nothing, and the escalation stays as it is today.
    4. No PR is created until openPullRequestChecked passes against the filed plan. A corrected proof opens its PR only on a later
       run whose plan carries the amendment, through this same pre-open check.
    5. Tests: test/review/a-known-red-proof-never-opens-a-pr.test.ts, with criteria 2 and 3 titled `W1-T10355 criterion 2: ...` and
       `W1-T10355 criterion 3: ...`. Rewrite test/a-refused-pr-open-names-its-branch.test.ts:143-187 and the failing-proof cases in
       test/review/an-inconclusive-proof-at-pr-open-is-a-harness-outcome.test.ts:110-126 to assert the refusal, not the red open.
