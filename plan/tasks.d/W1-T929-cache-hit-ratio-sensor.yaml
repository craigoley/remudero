  status: queued
  attempts: 0
  note: |
    risk:high is Rule 19's SPAN, not blast radius — `files:` crosses `src/lib` and `test/`, the
    grade W1-T310's ruling established for any task carrying a src change plus its new test. The
    blast radius argues DOWN: nothing here gates dispatch, spends, merges or writes a ledger field;
    the worst failure is a wrong number on a report.
    budget_usd 55 — one pure derivation and two render sites, close to W1-T907's 55.
    THE TEST PATH IS DECLARED IN `files:` (W1-T310): every proof above names a path inside the
    declared list, so the scope guard cannot refuse this run after the work is done.
    NO depends_on. W1-T35 is queued and this task is correct in EITHER ordering: the columns it
    reads are already live in worker.ts today, and if W1-T35 later changes prompt assembly the
    ratio simply starts reading better — which is precisely the observation W1-T35 wants and
    currently has no instrument for. Deliberately does NOT declare src/lib/worker.ts, so the two
    can batch rather than serialise.
    SIBLINGS FROM THE SAME FEEDBACK: W1-T930 (turn-efficiency sensor, retro.ts) and W1-T931
    (cost-anomaly sentinel). W1-T931 also declares src/lib/status-board.ts and will therefore
    SERIALISE behind or ahead of this one — that is the partitioner working correctly on a real
    shared file, not a filing defect.
    THE FEEDBACK'S FOURTH ASK (a Batch API lane) IS REFUSED, NOT DEFERRED — see the MASTER-PLAN §9
    amendment this filing carries; it is a platform fact, not a preference.
