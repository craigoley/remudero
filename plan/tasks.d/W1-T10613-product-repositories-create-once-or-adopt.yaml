  rationale: The operator authorized implementation, task filing and guarded Remudero builds of the Console new-product flow and mobile-first Central Park prototype, using existing public craigoley/wreckterra. Source/main and every open PR head were swept for subject overlap; no competing product-flow implementation was observed. Existing auth, nonce, admission, review and resource guards remain required. Author qualification at dc443d44e48e46fc412df8d2a2de2ae04620ed5a observed that the new repository POST module is missing its required authority inventory row; a real admitted 44-test census rerun confirmed that failure and the two explicit optional-chain guards, while its unchanged request-path suite passed. The current eight open head trees were swept with authority-table positive controls and zero product-repository subject additions before extending this same task scope. Hosted PR14208 proved every new served product operation also needs its public contract and actual route-wiring evidence. W1-T10572 shares only the contract and generated client files for an unrelated gardener description; this task adds the named product operation, and does not supersede that Analytics work.
  design: Add a high-tier action-bound create/adopt operation to the product workflow, with an immutable payload digest, durable operation identity and exact GitHub owner/name/visibility/repository ID. Reuse the existing GitHub transport and capability checks. Read and reconcile the external outcome before retrying after timeout; never assume POST supports idempotency. Adoption of existing craigoley/wreckterra ID 1432832754 must perform zero create calls and retain the already-authorized public/name decision. Conflicting identity, denied organization creation, malformed metadata and unreadable outcomes refuse or remain outcome_unknown. No automatic repository deletion as compensation. Unit fixtures exercise lost HTTP response after real provider success plus concurrent duplicate requests and restart. Mount buildProductRepositoryRoutes from the existing serve composition; the route builder delegates to the named product operation rather than a test-only seam. For every newly served product operation, declare the authenticated route plus bounded request, response and explicit failure schemas in openapi/daemon.yaml, then regenerate packages/api-client/src/schema.d.ts through the maintained generator. Exercise the assembled HTTP operation with the real default transport and verified-actor guard in the existing test/console-api/serve/product-routes.test.ts, and register that actual proof in test/route-wiring.test.ts. No contract baseline, wiring-debt entry, host-capability waiver, or client-granted verification substitutes for those proofs. Name the actual create operation and its existing authenticated high-tier action-bound gate in src/lib/authority.ts, including the precise repository-create boundary and honest unmapped ledger evidence; this documents existing authorized behavior and grants no new authority. Preserve the authority census and its zero missing-module baseline.
