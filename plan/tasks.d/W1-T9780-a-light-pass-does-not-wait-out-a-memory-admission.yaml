  design: |
    Operator rulings: no new fixed threshold, no shorter interval, no second ticker.
    1. The light pass admits and RECORDS synchronously, exactly as today: sweep.review_admitted, the review-admission
       slot, the fix claim and the strike stay in the pass.
    2. The admitted action's memory wait and its worker run continue as a DETACHED sweep action, tracked by the
       registry #3095 built (drainDetachedSweepActions), so stop() and the freshness drain still wait for it and the
       daemon.alive row still counts it (detached_sweep_actions).
    3. The per-head claims keep a later pass from admitting the same head while the detached action waits. A later pass
       disposes that head `wait` and names the in-flight action.
    4. Nothing paces. The ticker's period returns to pollIntervalMs plus the pass's own reads.
    Tests go in a new file, with `test(` titles verbatim as in the proofs below.
