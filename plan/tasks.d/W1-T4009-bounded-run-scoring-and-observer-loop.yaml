  rationale: |
    Warp's scoring and observer material closes the loop that most agent products leave open: retain
    enough run trace and artifact evidence to score quality, efficiency, and verbosity; compare exact
    configurations on real tasks; then let an observer suggest a factory change. Its important
    governance detail is that scorers are scheduled against retained data and the observer proposes
    configuration improvements—the system is tuned through evidence rather than silently mutating
    itself.

    RMD has a trust-evaluation loop, bounded activity/artifacts, replay/shadow/canary policy, and
    outcome-to-plan follow-up. The missing bridge is a redacted scoring dataset and a reproducible
    observer projection that can distinguish a failed run from an unobserved run and turn a measured
    pattern into a human-reviewable experiment without retaining raw prompts or granting the scorer
    authority.

    Research references: https://www.warp.dev/blog/using-llm-as-a-judge-scoring-to-measure-your-software-factory
    and https://www.warp.dev/blog/warp-factory-benchmarks. Warp's benchmark results are not imported
    as RMD evidence.
  design: |
    Add a bounded `factory-score-bundle-v1` derived from the activity/workstream projection and
    factory-efficiency records. It may retain redacted tool/MCP event metadata, artifact identifiers
    and hashes, spec/conformance references, review and verification outcomes, scorer inputs, and
    bounded evidence links. It must exclude raw prompts, transcripts, credentials, full command
    arguments, hidden browser state, and unbounded model prose. Every bundle names retention,
    redaction, factory revision, source freshness, and the run or artifact joins it could not make.

    Define versioned scorers with dimensions, sampling strategy, corpus/window, judge identity,
    calibration or human-feedback provenance, and reproducible inputs. Scorer outage, insufficient
    sample, disagreement, and unavailable evidence remain explicit. An observer may group repeated
    failure modes or cost-quality regressions and emit one bounded proposal linked to the exact
    evidence and experiment baseline; it cannot change factory config, route a live run, approve an
    action, or promote a candidate. Human review and W1-T3853 promotion evidence remain required.
  acceptance:
