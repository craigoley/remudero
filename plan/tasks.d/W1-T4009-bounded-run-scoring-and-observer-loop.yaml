    - claim: "the public daemon contract names factory-score-bundle-v1 and non-authoritative observer proposals"
      proof: "grep: factory-score-bundle-v1 in openapi/daemon.yaml"
  falsifier: |
    Score an unobserved run as healthy, retain a raw prompt or credential, let an LLM judge invent
    missing evidence, propose a config change without a reproducible baseline, or apply an observer
    proposal to a live flow. The corresponding proof must fail.
