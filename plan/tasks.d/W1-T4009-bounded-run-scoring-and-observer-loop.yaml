      proof: "grep: W1-T4009 criterion 1 in test/factory-scoring.test.ts"
    - claim: "scorers declare dimension, version, sample, corpus/window, judge identity, and calibration or human-feedback provenance"
      proof: "grep: W1-T4009 criterion 2 in test/factory-scoring.test.ts"
    - claim: "raw prompts, transcripts, credentials, full command arguments, hidden browser state, and unbounded model prose are rejected or redacted"
      proof: "grep: W1-T4009 criterion 3 in test/factory-scoring.test.ts"
    - claim: "scorer outage, insufficient sample, disagreement, and unjoined evidence remain explicit and cannot become a passing score"
      proof: "grep: W1-T4009 criterion 4 in test/factory-scoring.test.ts"
    - claim: "the observer emits an evidence-linked bounded proposal without changing live factory configuration, capability, routing, or approval state"
      proof: "grep: scoreFactoryRun( in src/lib/operator-agent.ts"
    - claim: "the public daemon contract names factory-score-bundle-v1 and non-authoritative observer proposals"
      proof: "grep: factory-score-bundle-v1 in openapi/daemon.yaml"
  falsifier: |
    Score an unobserved run as healthy, retain a raw prompt or credential, let an LLM judge invent
    missing evidence, propose a config change without a reproducible baseline, or apply an observer
    proposal to a live flow. The corresponding proof must fail.
  note: "This is a bounded observer loop above W1-T3882 and W1-T3853, not autonomous self-modification or a transcript archive. reservation hand-off: run-W1-T4009-<epochMs>"
