  note: "verify:auto — every claim is decidable in-process. The refusals are pure resolution-time
    checks over a config object, and the default-path claim is an assertion that a resolver returns
    undefined. No second machine, no Tailscale, no network.
    risk:high IS RULE 19'S SPAN, SET UP FRONT rather than shipped as a violation, exactly as W1-T396
    did: files: reads as several concerns (the resolver, the config schema, the command that
    assembles them, three test files). The diff is plausibly small. What is genuinely risky is
    design (vi) — a guard on an opt-in path that accidentally reaches the default path would break
    every install that never wanted identity at all, which is nearly all of them.
    RULE 25 CHECKED BEFORE FILING: files: contains no INSTRUMENT_SURFACE path — no
    .github/workflows/ entry, no ratchet script, no baseline, no mutation-scope config — so
    detectInstrumentEntanglement finds no instrument half and has nothing to refuse.
    ON THE PROOFS. Three distinct paths, one per claim, none a substring of another, all pure-path
    form. That form lint-passes and executes the whole file, unlike the path-plus-title form which
    satisfies the linter and then matches zero tests. All three are FORWARD REFERENCES TO PATHS,
    which is safe; none forward-references a symbol name, which would be a guess. Each is declared
    in files: so the worker creates it.
    THIS IS A GUARD, NOT A REDESIGN, and design (ii) is the part most likely to be skipped: the
    obvious bind-list refusal is wrong in both directions and the task exists partly to stop a
    future session shipping it.
    NO depends_on: the two gates exist and are reachable today; nothing has to land first."
