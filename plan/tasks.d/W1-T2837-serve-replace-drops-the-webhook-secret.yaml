- id: W1-T2837
  title: "SERVE --replace DROPS THE LIVE GITHUB WEBHOOK SECRET UNLESS AN OPERATOR RETYPES ITS HOST PATH — the outgoing container is removed before its one-file mount is preserved, so a credential repair silently disables event-driven wakes"
  repo: remudero
  depends_on: [W1-T2834]
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: high
  budget_usd: 15.00
  files: [deploy/serve-container.sh, test/console-token-refresh.test.ts]
  origin: "operator-session#serve-replacement-webhook-regression-2026-09-04"
  plan_refs: ["W1-T2568", "W1-T2778", "W1-T2834"]
  status: queued
  attempts: 0
  rationale: |
    OBSERVED LIVE 2026-09-04. `remudero-serve` had a working read-only bind from the host webhook
    secret to `/home/node/.rmd-github-webhook-secret`. Running the tracked launcher with
    `--replace` and no repeated `RMD_GITHUB_WEBHOOK_SECRET_PATH` printed that the webhook would
    ship dark, stopped and removed the old container, and created a replacement without the mount.
    The route then had no secret and could only return `webhook_not_configured` until a second
    replacement supplied the same host path manually.

    This is not a missing provisioning step. The credential was already provisioned and mounted;
    the replacement operation discarded its own live launch record. The App key is recovered from
    daemon metadata and W1-T2834 owns decoupling that lookup. The webhook secret deliberately has
    no guessed default, so the existing Serve mount is the authoritative fallback when an operator
    requests replacement without an explicit override.
  design: |
    Before stopping the outgoing container, inspect its mounts for the exact webhook-secret
    destination. When `--replace` is set and no path was supplied, preserve that one regular host
    file as the new source. An explicit path keeps precedence. An absent or stale old mount still
    follows the existing graceful dark-start behavior. Never copy the secret, mount its directory,
    or print its contents.
  acceptance:
    - claim: "--replace with no repeated webhook path preserves an existing exact-destination one-file secret mount"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "the preserved secret remains read-only and RMD_GITHUB_WEBHOOK_SECRET_FILE still names the fixed container destination"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "an explicit RMD_GITHUB_WEBHOOK_SECRET_PATH keeps precedence over outgoing-container metadata"
      proof: "unit test: test/console-token-refresh.test.ts"
    - claim: "a genuinely absent secret still permits Serve to start with webhook_not_configured behavior"
      proof: "unit test: test/console-token-refresh.test.ts"
  falsifier: |
    Close without implementation if a real `--replace` already carries the outgoing container's
    webhook mount forward without the environment variable. The first authorized replacement was
    run without that variable and the launcher's own output plus Docker inspect both proved the
    new container had no webhook-secret mount; a second replacement with the explicit host path
    restored it and the external route moved from 503-class unconfigured behavior to signature
    validation.
  note: |
    ID PROVENANCE: `rmd next-task-id --reserve` read W1-T2836 from the working shard and atomically
    held `refs/rmd-id/W1-T2837` on its first attempt; the held id is authoritative.
