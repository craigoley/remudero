  rationale: |
    VERIFIED on authenticated app.remudero.com on 2026-09-19: timeSeries is empty, so all seven
    private-console trend cards are unavailable even though five scalar readings resolve. The
    existing console time-series code serves the legacy HTML shell and different signals; it does
    not populate the console-v1 analytics contract. analytics-route already streams the complete
    rotation union and observes run completion, tokens, cache usage, modeled cost, and duration.
  design: |
    Add a pure bounded time-series accumulator for the historical metric families already present
    in the analytics ledger stream. Every series names metric key, UTC window, bucket width,
    aggregation, coverage start, and points. A bucket may be zero only when the source was readable
    and collecting for that complete bucket; pre-collection, missing, partial, and unreadable
    intervals remain explicit gaps. Do not invent historical queue or allowance points from today's
    live scalar. Keep raw ledger rows and task identifiers out of the result.
  acceptance:
    - claim: "historical console-v1 metrics produce bounded ordered UTC buckets with named window and aggregation"
      proof: "unit test: test/analytics-timeseries.test.ts"
    - claim: "pre-collection, partial, missing, and unreadable buckets are gaps rather than zero points"
      proof: "unit test: test/analytics-timeseries.test.ts"
    - claim: "a live queue or allowance scalar never fabricates historical points"
      proof: "unit test: test/analytics-timeseries.test.ts"
    - claim: "the projection contains aggregates only and no raw ledger rows or task identifiers"
      proof: "unit test: test/analytics-timeseries.test.ts"

