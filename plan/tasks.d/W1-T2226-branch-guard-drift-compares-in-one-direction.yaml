    - claim: "the declaration block itself never counts as a citation of the name it declares"
      proof: "unit test: test/reap-branches-reverse-drift.test.ts"
    - claim: "a declared branch that is legitimately absent from the remote is not reported as a dangling citation"
      proof: "unit test: test/reap-branches-reverse-drift.test.ts"
    - claim: "the set of branches deleted and the set withheld are unchanged by the added report"
      proof: "unit test: test/reap-branches-reverse-drift.test.ts"
