    NO PROOF IN THIS SHARD GREPS ITS OWN PATH.

    `risk: high` IS RULE 19'S SPAN AND A BLAST-RADIUS STATEMENT. `files:` names two stems, so the
    linter would pass this at `medium`. It is filed at `high` because the artefact EXITS NON-ZERO
    ON DRIFT by its own contract, so a reverse check that over-fires reds every run of the verb —
    which is why design (iii) subtracts the declared set and (iv) keeps substring matching.

