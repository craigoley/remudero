  note: "verify:auto — every assertion is a deterministic judge over canned inputs.
    risk:high — NOT blast radius (zero src/ lines change) but consequence: these goldens become
    the fixed points every future review-floor PR must satisfy, so a golden encoding the WRONG
    intended verdict would block correct work; design (iv)'s per-case discrimination proof and
    the per-case rule citation are the containment.
    budget_usd 85 — six fixture cases each needing real-input construction plus the weakened-judge
    demonstrations; the test driver itself is small.
    PROOF NOTES: all three criteria share the forward PATH proof (the W1-T387-merged shape; the
    file is declared in files:, and fixtures land beside it under the declared README's
    directory). No grep proofs: the only existing file this task touches is none — a grep at a
    not-yet-existing path is exec_error, measured in the W1-T418 filing session, so the path
    proof carries the load alone.
    files: NOTE — test/fixtures/golden-verdicts/README.md stands for the fixture DIRECTORY in
    files: (the scope guard matches prefixes by path; the README is the directory's anchor file
    and the growth rule's home).
    NO depends_on: the judges it locks are all on main."
