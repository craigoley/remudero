  note: |
    risk:high, band_meaning:span — the producer module, the measurement report and the CLI verb
    are three concerns under Rule 19; the runtime blast radius is unchanged from W1-T470's own
    statement: one plan/feedback entry per red-band reading, deduped by the union read.

    UNTIL W1-T2662 MERGES THIS MEMBER REFUSES EVERY RUN, BY DESIGN, and the refusal says why
    ("no coverage-merged artifact on run <id>"). That is the correct order under Rule 25: the reader
    ships first and refuses honestly; the instrument step ships second and turns the refusal into a
    measurement. A refusal that names the missing half is the self-measurement panel's business
    (W1-T2660), not a silent zero.
