  rationale: |
    THE RULING (operator, 2026-10-21 ~05:45Z): a census child that the fix rung's own 60 s bound kills is "not measured",
    named by the child that timed out. It is never "this branch grows 1 census count". The pre-push hook and hosted CI
    still measure every census, so the branch is still checked before merge.
    OBSERVED, core ledger on host remudero (rmd-state2, read-only; 67 rotations from 2026-10-18 plus the live file,
    newest row 2026-10-21T10:31Z, rotation copies deduplicated by ts):
    - 2026-10-20T15:44:51Z and 17:39:12Z, task W1-T10070 (PR #13121), mode merge-conflict: `fix.census_check` outcome
      `refused`, then `fix.commit_refused` with "census-precheck: this branch grows 1 census count(s) CI will refuse:
      census-suite: test/the-affected-suite-reach-ratchet.test.ts fails — SIGTERM". Both rounds' merges were correct;
      PR #13121 then sat conflicted until a hand merge (it merged 04:06Z on 10-21).
    - Window 2026-10-17T22:42Z..2026-10-21T10:30Z: 177 `fix.census_check` rows, 170 `partially-measured`, 7 `refused`;
      the two above are the only refusals whose text names SIGTERM. Positive control: the query finds all 177 rows and
      both known incidents.
    READ at origin/main 16f4c28fc and 2107c092e (symbols, not lines). `fixCensusSnapshotSteps` (src/run-task.ts) runs
    scripts/census-precheck.mjs, then, if that printed no refusal, the reach suite, each with `timeout: 60_000`. Any
    `error` or `signal` on EITHER child, or a non-zero, non-2 precheck status, builds one refusal whose text always names
    the reach suite and whose reason is `precheck.error ?? precheck.signal ?? result.error ?? result.signal ?? output`.
    A precheck killed at 60 s is therefore reported as the reach suite failing. The async runner `spawnCensusChild`
    reports its own bound's kill as `error` (`bound.timeoutError`), the sync one (`spawnSync`'s `timeout`) as `signal`;
    both must read as a timeout. The round's commit is refused only on `censusCheck.refusal` (the `harnessCommit`
    closure in the fix rung); `unmeasured` is only logged (`fix.census_check` outcome `partially-measured`).
    PR #13305 (merged 2026-10-21T11:16Z, commit add51ce94) measures merge rounds from main, which removes this
    incident's cause (a changed set holding all of main's delta). It does not change how a timeout is read (re-read
    at origin/main 2107c092e: the refusal arm is unchanged); its body named that as this operator decision.
    NOT COVERED ELSEWHERE: W1-T10253 is the pre-push hook's census-precheck (bwrap, reader arm), not the fix rung's
    harness check. Swept origin/main plan/tasks.d and every open PR head's plan tree for fixCensusSnapshotSteps,
    census_check and the reach-suite path: no shard covers it.
  design: |
    1. In `fixCensusSnapshotSteps`, a child killed by its 60 s bound (a `signal`, or the bound's timeout `error`) is a
       TIMEOUT. It sets `unmeasured` to a line naming the child and its bound, for example
       "census-precheck: not measured — scripts/census-precheck.mjs timed out at 60 s (SIGTERM); CI and pre-push still
       measure". It never sets `refusal`.
    2. A precheck timeout does not stop the reach suite from running; the reach suite's own result is judged alone. A
       reach-suite timeout is reported the same way, naming the reach suite.
    3. A child that ran and failed keeps today's refusal, and its text names the child that failed (the precheck or the
       reach suite), never the other one.
    4. `fix.census_check` gains `timed_out_child` (the script or suite path) on a timeout, beside outcome
       `partially-measured`. No new ledger step, env var or bound; the 60 s bounds are unchanged.
    5. src/run-task.ts sits at its comment-load ceiling (W1-T9332): add no comment lines beyond what the change removes.
