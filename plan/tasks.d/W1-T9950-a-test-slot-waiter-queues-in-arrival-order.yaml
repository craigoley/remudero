  design: |
    No new fixed threshold. Every bound comes from a cadence the ticket records or from measured hold durations.
    1. A TICKET PER WAITER. A waiter that finds no free slot on its first poll creates
       `<slot dir>/queue/<arrival>-<nonce>.json` with `wx` (mode as the legacy slot record). `<arrival>` is a
       zero-padded epoch-ms plus a per-process sequence, so names sort in arrival order and the nonce breaks
       ties. The ticket records pid, host, bootId, pidNs, processStart, label, arrivedAt, heartbeatAt and
       `heartbeatIntervalMs` (the poll interval it really beats at).
       The waiter rewrites heartbeatAt each poll. It deletes its own ticket on acquire, on
       wait_bound_exceeded, on slot_unavailable, and from a process exit/signal handler.
    2. ONLY THE HEAD IS ADMITTED. Each poll lists the live tickets in name order. A waiter may try to create
       or reclaim a slot only while the number of live tickets ahead of it is smaller than the number of
       slots it found free or reclaimable on that poll. Otherwise it yields and does not touch a slot file.
       A run that finds a free slot and NO live ticket ahead takes it at once, with no ticket, exactly as today.
    3. DEAD TICKETS ARE REAPED, NEVER SIGNALLED. A ticket is dead when its holder would be stale by the same
       rules `testSlotHolderStale` applies to a slot record: same host and namespace -> pid and start time;
       foreign -> boot id, then `now - heartbeatAt` past a bound derived from the ticket's own
       `heartbeatIntervalMs` (the same multiple W1-T9928 derives for a slot record).
       Any waiter may unlink a dead ticket. It does this through `reclaimStaleLock` and logs
       `test_slot.ticket_reaped` with the ticket, pid, host, label and reason. No waiter kills a process.
    4. POSITION AND ETA, ON EVERY CHANGE. Whenever a waiter's position or the holder set changes, it logs
       `test_slot.queued` with position, ahead (label and pid of each), holders (label, pid, elapsed),
       etaMs and etaBasis. It also writes one human line to stderr, e.g.
       `test slot: 2nd in queue behind preflight-author (pid N); ~14 min (median of 6 measured preflight-author holds)`.
    5. ETA FROM MEASURED HOLDS. On release, a lease appends `{label, heldMs, concurrency, endedAt}` to
       `<slot dir>/hold-history.ndjson`. The estimate for a label is the median of that label's recorded
       holds. ETA simulates the queue: each live holder needs max(0, estimate - elapsed), each ticket ahead
       needs its label's estimate, and the slots are served FIFO. A label with no measured hold says so
       ("ETA unknown: no measured holds of <label>"). It never invents a number. History retention is
       per label, and the code names how the retention is derived. There is no bare cap.
    6. MIXED FLEET. An older checkout does not read the queue and can still take a slot out of turn. The
       `test_slot.acquired` row gains `ticketed: true|false` and `aheadAtAcquire`, so the remaining unfairness
       is measured, not assumed. private-capacity-v1 rules are unchanged: a ticket carries no authority over
       any slot record.
    7. Tests go in the new file, with an injected clock, isPidAlive, hostname and sleep. Two or more acquisitions
       interleave on one private slot dir. Include one test that runs the real default exit handler in a child
       process. The proofs below name the `test(` titles verbatim.
