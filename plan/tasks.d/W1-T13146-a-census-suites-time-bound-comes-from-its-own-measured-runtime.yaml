  acceptance:
    - claim: "A census suite child with a recorded history of completed runs on this host is bounded by a budget derived from that history, and a suite that completes inside it is measured, where the fixed backstop would have ended it as not measured"
      proof: "grep: W1-T13146 criterion 1 in test/ci/gates/a-census-suites-time-bound-comes-from-its-own-measured-runtime.test.ts"
    - claim: "A suite with no history, or one that overruns its history budget, falls back to the fixed backstop and to today's not-measured label, and the overrun is recorded so the next run's budget sees it"
      proof: "grep: W1-T13146 criterion 2 in test/ci/gates/a-census-suites-time-bound-comes-from-its-own-measured-runtime.test.ts"
