  falsifier: |
    Size the proposed capacity from a constant; treat a partial price-feed read as a model's absence; file a readiness
    task before the deployment answers its smoke test; write price rows into source from core instead of filing a task;
    or propose a Codex row's re-lead without a controlled trial.
