- id: W1-T9632
  title: "THE FULL-SWEEP BOUND KEEPS LEARNING ACROSS RESTARTS — W1-T9563's learner needs 5 settled passes, but its boot seed reads only the live ledger, so each hourly restart resets it; real passes take 23-83 min, it never reaches 5, and on 2026-10-15 every full pass was still abandoned at 559 s"
