  rationale: |
    OBSERVED 2026-11-10 during the operator-approved four-view auto pilot:
    104 exact read_model.now_view_failed rows for Site report ENOENT at
    /home/node/rmd-instances/site/repos/remudero-site/plan/tasks.yaml.
    Docker Mounts shows Serve binds /home/craigoleyagent/rmd-site-state at
    /home/node/rmd-instances/site read-only, plus its writable state subdirectory.
    That host root's repos/remudero-site/plan/tasks.yaml is absent. The running
    Site daemon additionally binds /mnt/scratch/rmd/rmd-site-state/repos at
    /home/node/Remudero/repos, and the actual plan exists there.
    serve-container.sh's foreign-instance loop mounts only the durable root and
    state directory, so it never exposes that separate managed-repositories source.

    Source read-only census at main24a645b8 and all eleven captured open PR heads
    found identical launcher and existing gateway-test blobs. None of their
    subject candidates adds this repository bind. Existing W1-T9519 records a
    generic Now failure recurrence and permits only its scout test; it does not
    name or repair this mount cause. W1-T9617 moves hot code checkouts, not other
    instances' managed repository exposure in Serve. Existing selected-registry
    and credential tasks remain separate. Recheck overlap and ownership before build.

    Now catches each instance independently. Console's Now body updated during
    the pilot while Core's remained old, so fixing Site is not claimed to explain
    or resolve Core's separate stale body. The failed pilot was rolled back to off.
  design: |
    Limit implementation to the two approved files. Extend the real shared-gateway
    launcher to resolve each other registered instance's effective managed-repos
    host source through the existing registry and scratch/mount qualification paths.
    When a running daemon's bind supplies the authoritative source, inspect only
    the relevant Mounts data; do not read container environment values or infer a
    host path from a code checkout or a guessed container name. Preserve cold and
    absent-instance handling with explicit availability, rather than stale guesses.

    Expose only the qualified repos directory read-only at that instance's existing
    namespaced repos destination. Keep its durable root read-only and state directory
    writable. Retain ordinary scratch-off behavior where the parent bind already
    exposes the qualified durable repos path. Do not bind another instance's whole
    scratch root, worktrees, worker homes, credentials or caches. Do not copy or
    mutate repository contents to make an absent source appear healthy.
    Unknown, contradictory, malformed or revised placement must be visible as
    unavailable or refuse before replacement; it must not silently choose a stale
    durable path. Reuse the launcher's existing read and replacement admission
    contracts; add no new global environment transport, policy or timeout value.

    Append contained fixtures only to the existing gateway test. Exercise the
    actual launcher's dry-run/Docker command boundary with private state and
    Docker fixtures, including scratch repositories and a misleading durable
    copy, ordinary scratch-off operation, unavailable or ambiguous inspection,
    source changes before launch and retained state permissions/instance selection.
    Preserve every byte of all pre-existing test inputs, expectations, assertions,
    titles, timeouts and skips. No real Docker replacement or host path mutation.
  falsifier: |
    On the same appended test bytes, restore the old launcher or remove only the
    qualified other-instance repos bind. The scratch plan/readability regression
    must fail. Remove source qualification or identity revalidation and the
    corresponding unknown/changed-source controls must fail. Restore the repair
    and require the unchanged existing suite plus all new cases to pass.
