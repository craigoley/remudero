- id: W1-T9583
  title: "EVERY RED-MAIN REPAIR LANE CUTS A HEAD BOTH IDENTITY GATES ADMIT — the lane's ratchet-record PR #11831 (head main-repair-ratchet-7d510a2ff698-1792017976611) could never merge: its commit has no Remudero-Task trailer, so the required head-identity-gate refuses it, and adding one makes worker-branch-shape refuse its non-run head; the revert and fix lanes cut the same non-run main-repair-* heads, and no lane-opened PR has merged since the lane shipped (#10712 and #11860 were hand fixes)"
