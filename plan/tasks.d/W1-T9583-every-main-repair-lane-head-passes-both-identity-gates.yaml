      proof: "grep: W1-T9583: a ratchet-record PR head passes head-identity-gate and worker-branch-shape in test/a-red-main-on-a-ratified-ceiling-records-itself.test.ts"
    - claim: "a revert PR the production opener pushes passes both gates and its commit names the body's id"
      proof: "grep: W1-T9583: a revert PR head passes head-identity-gate and worker-branch-shape in test/a-red-main-repairs-itself-fix-pr-then-revert-pr.test.ts"
    - claim: "a fix worker's head passes both gates with or without the dispatcher's trailer"
      proof: "grep: W1-T9583: a fix worker head passes head-identity-gate and worker-branch-shape, with or without its trailer in test/a-red-main-repairs-itself-fix-pr-then-revert-pr.test.ts"
    - claim: "the ratchet lane cuts its record branch on a run-shaped prefix"
      proof: 'grep: MAIN_RATCHET_RECORD_BRANCH_PREFIX = "run-main-repair-ratchet-" in src/run-task.ts'
  falsifier: |
    Restore origin/main's branch lines and the ratchet test reds with head-identity-gate's "REFUSED — this head matches
    neither conforming form" (the #11831 red); the revert test reds with worker-branch-shape's "REFUSED — this branch
    claims main-repair-revert-…"; the fix test reds on its run-shaped branch assertion. Drop the revert's amend trailer and
    its test reds because worker-branch-shape no longer judges a claim. All measured on the Mac before filing.
