    INFERRED:
    - A lifetime VmHWM includes a generation's own growth after the old generation has exited (drainMs is under
      1 s), so it is not the overlap. Sizing by it asks for 2-4x what an overlap measured.
    - A 180 s sample lands at a random point of a 10-60 s overlap, so a handoff's true overlap peak is at least
      the sampled figure, not equal to it. The supervisor's own in-window sampling (design 1) replaces this proxy.
    - Half (a) alone fits today (about 2.4-3.6 GB need against 3.3-4.2 GB free vs memory.max), but the standby
      would then boot through memory.high, where this container already throttles and swaps.
    - Half (b) alone makes it fit LESS. Free vs memory.high now is about 0.9 GB raw (5.91 - 4.96), or about
      1.9 GB once clean page cache is credited. That is below an overlap need of about 2.4-3.6 GB.
    - So this task lands after W1-T9508 (tier-2 shed of worker threads, in build at filing). W1-T9508 is expected
      to free about 2.0-2.3 GB, the coordinator's INFERRED figure from 15 clean thread exits of 500 MB or more
      returning about 91% to RSS, and read_model.worker_recycled rows on 10-14 freeing 1.1-2.2 GB.
      Shed plus overlap sizing plus memory.high is the combination that fits honestly.
  design: |
    1. Measure the overlap. During each planned handoff, from just before the fork until the old generation has
       exited, sample the container's free bytes with the same reader the supervisor judges with, at fork,
       during each readiness poll, at promote and after drain. overlapPeakBytes is the pre-fork free less the
       lowest free in the window. Ledger overlapPeakBytes and the sample count on serve.handoff_done.
       A handoff with no usable sample records none and is never a zero.
    2. The need is the largest overlapPeakBytes this supervisor has observed, times a named safety margin. The
       margin must cover the measured 1.34x of overlap over boot peak, for example 1.5x. It is a new constant,
       ledgered beside the need, and not a change to any existing threshold.
    3. Cold-start fallback, when no overlap has been observed yet: use the boot peak sampled at promotion
       (largestRss, which a cold start also samples) times the same margin. If neither is positive, keep today's
       named peak_unknown hold. Every deferral and admission names its basis: measured overlap, boot-peak
       fallback or unknown.
    4. The active generation's lifetime VmHWM stays ledgered as activePeakBytes, as evidence, but no longer sizes
       the need. This deliberately supersedes W1-T8378's estimator choice. The overlap measurement is the
       later-observed evidence that W1-T8378 asked for.
    5. Container free is judged against min(memory.high, memory.max), less the bytes that cannot be reclaimed,
       because the kernel throttles and reclaims at memory.high. When memory.high reads max or is unreadable, the
       ceiling is memory.max, as today. Change the supervisor's default reader only. cgroupFreeMemory's existing
       callers, serve-memory.ts relief and the serve.memory free_bytes figure, stay unchanged. If the builder
       finds memory.max is the right ceiling after all, the PR states why with evidence instead of changing it.
    6. The host admission (judgeServeUpgradeAdmission) receives the same need. Tier 1 and tier 2 shed, spacing,
       retry, the replace hold and every existing threshold are unchanged.
