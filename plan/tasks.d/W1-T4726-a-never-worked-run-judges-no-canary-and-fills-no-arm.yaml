  rationale: |
    W1-T4711 (merged, PR #7663) sets `RunSummary.neverWorked` in retro.ts's `gatherRuns` (via
    src/lib/never-worked.ts's `isNeverWorkedVerdict`) and excludes flagged runs from retro overrun
    mining, the mount-headroom per-class percentiles and the gardener's budget recalibration. Its
    build named three readers it left as they were:
    - config-gardener's canary judging — `splitCohort` / `cohortOutcome` (through `settledImplement`)
      still counts a never-worked run as a settled task, so a refused or thrown dispatch reads as a
      canary outcome;
    - mount-headroom-sweep's `computeArmSweep` per-arm cells still include never-worked runs;
    - `redispatchedRunIds` counts a refusal followed by a real run as a re-dispatch, marking the real
      run re-dispatched.
  design: |
    Each reader skips `neverWorked` runs (the flag W1-T4711 already sets; no second rule) and reports
    how many it skipped. For `redispatchedRunIds`, a never-worked prior run does not make its
    successor a re-dispatch. Runs that did work are judged exactly as before.
  acceptance:
    - claim: "a never-worked run neither enters a canary cohort's outcome nor a mount-headroom arm cell, and a real run after a refusal is not marked re-dispatched"
      proof: "unit test: test/a-never-worked-run-judges-no-canary-and-fills-no-arm.test.ts"
  falsifier: |
    A canary cohort of five real runs and five refused dispatches: the cohort outcome matches the
    five real runs alone, and the first real run after a refusal is not in the re-dispatched set.
