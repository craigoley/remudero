  rationale: |
    OBSERVED 2026-11-04:
    - From 12:26:41Z a recycle (RECYCLE-3315651) held state/PAUSE. Its own drain logic keeps the full pass running with worker spawns closed (W1-T5804), so no sweep.pass, review.posted or verdict.merged progress row appears while it waits.
    - The verdict climbed through RECOVERING (12:38, 12:44Z) to STALLED action=capture-diagnostics (12:49, 12:54, 12:59Z) to STALLED action=recycle at 13:04:08Z, progressAgeMs 2,595,011 (43 min).
    - The recycle it started proved the daemon was not frozen: "frozen-daemon ownership NOT proven, clause (b): pid 1684607 wrote a ledger row at 2026-11-04T13:04:09.938Z, inside the 1800s stall bound".
    - decideProgressWatchdog (src/lib/progress-watchdog.ts) has no input for PAUSE. Paused time counts as stall time, the same defect class W1-T9433 fixed for the stalled-stage backstop.
  design: |
    Add an optional input field to ProgressWatchdogInput: the recycle PAUSE writer's liveness, read by progressWatchdogCommand (src/run-task.ts, where the input is assembled today) from <state-root>/PAUSE with the pid, host and writerStart predicate W1-T9409 uses.
    In decideProgressWatchdog, when that input says a live recycle owns PAUSE, return verdict("IN_RECYCLE", "none", "a live recycle (pid …) owns PAUSE; its pause is not a stall") ahead of the STALLED branches.
    Add IN_RECYCLE to ProgressWatchdogState. The launcher ladder already treats any action other than recycle, hold-revive or capture-diagnostics as none.
    Mark it with a comment naming W1-T11319.
    NOT IN SCOPE: recycle-container.sh's own refusal (a separate task), and operator PAUSEs.
