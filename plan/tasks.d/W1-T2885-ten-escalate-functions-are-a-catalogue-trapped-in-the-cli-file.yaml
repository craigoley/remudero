  rationale: |
    Step 2 of the run-task.ts decomposition chain (audit recon-2026-09-05 T6; R-29). OBSERVED at
    f7ceb86: ten exported `escalate*` functions are defined in `src/run-task.ts` between lines
    22098 and 23092 — `escalateCircuitBreak`, `escalateLifetimeCapExceeded`, `escalateCrashLoop`,
    `escalatePostReviewStall`, `escalateHeadroomReserve`, `escalateDiskHeadroomBreach`,
    `escalateHeadroomParkCeiling`, `escalateQuotaExhaustion`, `escalateStarvation`,
    `escalateStarvationCleared` (MEASURED: `grep -cE '^export function escalate'` = 10). Each
    takes typed inputs plus an escalation gateway and produces one issue's title/body/label; the
    gateway itself already lives in `src/lib/escalate.ts`. The catalogue is the kind of leaf the
    audit calls "pure": it has no reason to be in the file that owns `main()`.

    THE FIX: move the ten functions and the private helpers only they use into
    `src/lib/escalation-catalogue.ts`; `src/run-task.ts` imports and RE-EXPORTS them by the same
    names so existing test importers resolve. The module may import `src/lib/escalate.ts` but not
    `src/run-task.ts` (the depcruise rule refuses the reverse). Lower the run-task.ts ceiling in
    `scripts/source-size-baseline.json` by the lines removed. The new test renders each catalogue
    entry through a recording gateway and asserts the title and label are byte-identical to the
    pre-move output captured from the same inputs — a golden test of the move, not of the prose.
