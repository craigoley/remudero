    Both scope-time checks were run before building: `git ls-remote --heads origin 'run-W1-T3348-*'`
    returned 0 against a control of 62 live `run-*` heads, and the merged-trailer scan returned 0
    against a control of 1 for W1-T3336.

    risk:high is BLAST RADIUS, not span: the diff is one pure function and its wiring, but it
    changes `rmd doctor`'s exit code, which is a gate. On the daemon host today the check reads
    FAIL — `3 counted fire(s) of 5 observed; 5 never, 0 stale` — which is the true state of the
    loop, not a false alarm.

    test/doctor.test.ts is in `files:` because two census assertions there pin the exact number of
    doctor arms and name every arm that has joined. Adding an arm requires updating that census by
    design; the count and the message were updated and nothing else in that file was touched.

    THE SHARED-PROOF WARNING IS ACCEPTED DELIBERATELY. `lint-plan` advises a distinct per-criterion
    test-title proof. In a PLAN SHARD the pure-path form is required instead: `judgeCriterion`'s
    `not_yet_built` carve-out needs `!nameFiltered`, a flow-style single-line `files:` containing
    the path, and the file NOT existing at that head — all true on the filing PR, none true of a
    name-filtered proof. A title-filtered proof here would resolve to zero candidates on a
    plan-only head and grade unexecutable. The build PR carries the same five claims against the
    real file, where every title does resolve.
