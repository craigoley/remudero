  rationale: |
    OBSERVED 2026-11-03 on the served generation /home/node/rmd-serve-gens/a (git b724e88eb, loading src/lib directly; /app is 0e933d77 and the mounted checkout 5340e3d65, neither serving):
    - serve's main event loop stalled 502, 737 and 561 s in the 11Z, 12Z and 13Z hours (runtime.loop_stall_profile rows). The per-minute runtime.loop_lag max ran p50 1.7-4.6 s, p90 11.4-12.2 s, max 18.1-23.7 s.
    - In the 12:33-13:33Z hour, readLedgerLines -> parseLedgerContent (status.ts) was the largest named frame (7.2 s self, 45 of 187 stalls) and incident-invariants rowTimeMs added 2.4 s. readLedgerLines' only serve.ts caller is startIncidentInvariantsMonitor's minute tick, which reads the whole live ledger (15.7 MB at 13:28Z) every 60 s.
    - Rotation renames a staged new live file into place (rotateLedger, ledger.ts), so the file identity changes on rotation.
    - Every rule reads rows by ts window, and the longest is 4 h (no-merges-with-green-queue). Rows only ever come from the live file.
    - Open PR heads swept 2026-11-03 (35): only #15532 touches serve.ts, with no monitor lines. No plan task owns this reader.
  design: |
    A new src/lib/live-ledger-tail.ts, createLiveLedgerTail(path, retainMs), returns a per-tick reader that keeps parsed rows, file identity (dev:ino), byte offset and 64-byte head/anchor fingerprints.
    - Each call reads only [offset, size). It parses complete lines with readLedgerLines' rules and keeps file order. A torn complete line is dropped and logged once. A trailing line with no newline is parsed for the call but not consumed.
    - It restarts from the top on a new identity, a size below the offset, or changed head/anchor bytes. A missing file reads as []. Any other error resets and is rethrown, so the monitor's existing evaluate_failed path logs it.
    - It drops rows with no parseable ts or older than nowMs - retainMs.
    - serve.ts uses it when deps.incidentInvariants.readLedger is absent, with retainMs = 2 x INCIDENT_LONGEST_WINDOW_MS, a new export of incident-invariants.ts. An injected readLedger keeps its current call.
    - No change to the rules, the profiler, the tick interval, other readers, analytics writes, workers or the generation cadence.
