    Design: publish bounded typed evidence from the actual current registry, mounted instance and readable conversation-contract observation, independently from heartbeat/ledger/liveness health. Bind exact registered repository, instance, route prefix, supported contract and the existing owned view/generation qualification. If any binding cannot be established, report unavailable; do not guess a generation or reuse foreign evidence.
