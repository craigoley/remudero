    A revoked/empty capability set is real negative evidence and must replace a previous positive observation. A disappeared, unreadable or malformed registry or contract cannot remain read-write through a last-good cache. Existing exact-prefix, read-model lease/publication, session, source snapshot, executable option and per-request server checks remain unchanged.
    Use existing source-clock and materialization machinery. Keep content identity stable when only observation time changes. Retain conservative version-one behavior for existing consumers; document any additive contract/version and regenerate the actual API client. Do not flip any read-model switch or add an action endpoint.
    Tests must drive the real default filesystem contract probe and ticker/materializer. Cover current contract plus stale heartbeat, absent/empty/revoked/malformed/unreadable contract, unmounted/foreign scope, actual scoped endpoint refusal, generation/lease loss, old envelope compatibility and source-clock/content identity. A fake-only capability array is not an integration proof.
    Remove only independent observation wiring and require the stale-health/current-contract assertion to fail while revocation controls remain green; restore source. Retain physical TAP, literal canonical proofs, caller/census, instrumented exact-tree coverage, native author, stored-body verification, governed review and complete current-head CI.
    Core source merge, qualified backend adoption, Console consumer merge/deployment and signed-in reply readiness are separate stages. This filing authorizes none of the live changes. Preserve Console #2235 per-message readiness; unrelated page failures cannot become a whole-mailbox gate again.
