      proof: 'grep: test("W1-T9092: a data file a closure module reads is material" in test/the-daemon-is-stale-only-when-its-own-closure-changed.test.ts'
    - claim: "an unreadable closure reads as material"
      proof: 'grep: test("W1-T9092: an unreadable closure is material" in test/the-daemon-is-stale-only-when-its-own-closure-changed.test.ts'
    - claim: "the closure contains every esbuild metafile input of the same entry"
      proof: 'grep: test("W1-T9092: the closure contains every metafile input" in test/the-daemon-is-stale-only-when-its-own-closure-changed.test.ts'
    - claim: "the daemon's freshness wiring reads the process closure"
      proof: 'grep: daemonProcessClosure( in src/run-task.ts'
  falsifier: |
    Keep `advanceIsMaterial`'s prefix list: the first test's source file that no closure module imports starts the
    clock.
