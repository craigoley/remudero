    - claim: "a PR with strikes left still gets its strike — this adds exclusion, never a refusal"
      proof: "unit test: test/the-fix-rung-strike-cap-does-not-bind.test.ts"
    - claim: "two DIFFERENT PRs still dispatch independently and neither blocks the other"
      proof: "unit test: test/the-fix-rung-strike-cap-does-not-bind.test.ts"
    - claim: "the existing stand-down reasons still fire unchanged ahead of any dispatch"
