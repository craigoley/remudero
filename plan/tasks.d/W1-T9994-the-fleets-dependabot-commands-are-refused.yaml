    - claim: "a refused command record no longer pins the head: the same head is refreshed through REST on the next pass"
      proof: 'grep: test("W1-T9994: a head whose command was refused is refreshed through REST on the next pass" in test/the-fleets-dependabot-commands-are-refused.test.ts'
    - claim: "a base-red refresh of a Dependabot head goes through the expected-head update-branch, once per head, and comments no command"
      proof: 'grep: test("W1-T9994: a base-red Dependabot refresh uses the guarded update-branch, not a command" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
    - claim: "an update-branch that is refused or does not apply escalates once, quoting any refusal reply"
      proof: 'grep: test("W1-T9994: a refused update-branch escalates once with the refusal quoted" in test/a-held-dependabot-pr-is-refreshed-by-dependabot.test.ts'
  falsifier: |
    At origin/main, `dependabotCommandAnswer` does not exist, so the new file fails to import. On the #11968 fixture, a
    delivered "@dependabot rebase" record at head 676bed09 plus a dependabot[bot] comment "Sorry, only users with push
    access can use that command.", `reconcileDependabotRefresh` returns "unanswered" and ledgers `refresh_unanswered`
    with `delivered: true`. On a base-red hold, it comments "@dependabot rebase" and calls no update-branch.
