- id: W1-T9994
  title: "THE FLEET'S @dependabot COMMANDS ARE REFUSED, AND THE LEDGER SAYS DELIVERED — Dependabot answers remudero-fleet[bot] 'Sorry, only users with push access can use that command', yet refresh_unanswered reads delivered:true for hours and the head is never refreshed; record the refusal, and refresh a base-red head through the guarded REST update-branch instead"
  repo: remudero
  depends_on: [W1-T9995]  # same files (dep-review.ts, run-task.ts); W1-T9995 clears #11968's blocking red, so it builds first and this one serializes behind it
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — a Dependabot command the fleet posts is known to be refused, and the base refresh it carried goes through REST; no gate, check list, arm verdict or App permission changes
  band_meaning: span
  origin: "operator ruling 2026-10-16 (Craig): #11968, a Dependabot bump, merges hands-free; on 2026-10-17 this refusal is one of the two reasons it still has not"
  plan_refs: [W1-T54, W1-T6404, W1-T9584, W1-T9818, W1-T9828, W1-T9913, W1-T9995]
  files:
    - src/lib/dep-review.ts
