- id: W1-T2606
  title: "THE OVERLAP ADVISORY CANNOT SAY IT DID NOT LOOK — `overlapWarningLinesFor`'s `catch { return [] }` renders a rate-limited open-PR read as 'no overlap', which is the one condition under which a filer most needs it, while the SAME command names that identical outage and REFUSES `--reserve` on it"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
