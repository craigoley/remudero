    TWO ADJACENT SURFACES ARE ALREADY OWNED AND ARE DELIBERATELY NOT RE-DECIDED HERE.
      W1-T2324  the ID half of this same outage — `openPrSurfaceOutage` + the `--reserve` refusal.
