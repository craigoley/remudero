    ⚠ AND ONE NAMED, DELIBERATELY-DEFERRED OPERATOR RULING IS FLAGGED, NOT SMUGGLED IN. W1-T985's
    design clause (ii) states plainly that it does not close the duplicate-WORK case: a filing PR's
    diff contains a feedback entry and a shard, never the implementation files the shard DECLARES, so
    two filings against the same module stay invisible to each other under the current scope source no
    matter where the call site sits. Making that pair visible means reading `files:` out of a shard
    inside an open PR's diff — the very provenance `openPrFileScopes` rejected — and W1-T985 records
    that as "a separate operator ruling, not a line of this task." THIS TASK DOES NOT CLOSE IT EITHER,
    and must not be read as doing so. It is surfaced for the operator because the W1-T2442 filing is
    now the second piece of evidence bearing on that ruling, and because an honest outage line makes
    the residue legible where prose in one shard's rationale never was.

    RULE 19 / risk:high IS SET UP FRONT AND IT IS SPAN, NOT BLAST RADIUS. `subsystemsOf` derives a
    module id per `files:` entry from the basename (`moduleIdFromPath`, `src/lib/task-linter.ts`), so
    three declared paths resolve to three ids and `sizingViolation` blocks any band below high. The
    change itself is additive: one failure arm, one exported type, one suppression notice.

    THE INVARIANT IS ATOMIC ACROSS THE THREE FILES AND UNSATISFIABLE PIECEWISE, which is why this is a
    re-risk rather than a decomposition (the W1-T240/W1-T250/W1-T253 exit). The advisory change alone
    leaves W1-T917's merged suite asserting the superseded silence and therefore red at its own gate;
    the test update alone asserts a contract no code produces; and a new test file alone proves
    nothing about the shipped one. One property, three files, one pass.

    src/run-task.ts IS DECLARED AND THE SERIALISATION COST IS ACCEPTED IN WRITING. It is the
    most-declared path in the plan, so this shard will serialise against a large share of the queue
    under `overlappingPaths` — including W1-T985, which is CORRECT because both touch this one
    advisory. That is the price of the advisory living where it lives, and it is recorded rather than
    dodged by under-declaring. `src/lib/dispatch-overlap.ts` is NOT declared: the predicate and its
    ratio policy are correct per W1-T985 rationale (6) and must not move.

    PROOF NOTES. Four criteria use the PURE-PATH `unit test: test/<file>.test.ts` form, which
    lint-passes and executes the whole file. The name-filtered sentence form was avoided deliberately:
    W1-T253's note records that `unit test: test/x.test.ts — <sentence>` parses as a name-filtered
    proof, matches ZERO test titles, and returns CAPPED at 0/N — which is exactly how sibling W1-T252
    burned a risk:high run on #901. The fifth criterion is a single-line `grep:` whose path IS declared
    in `files:`, because W1-T985's note records that a grep naming a file the changeset does not touch
    reads 0 hits and `executed_fail`, failing the review outright.

