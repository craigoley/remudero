  note: |
    `risk: high` IS RULE 19'S SPAN, NOT BLAST RADIUS. Rule 19 derives a concern from each declared
    path's stem, so a source file and a test not named after it trip it at `medium`. `files:` is one
    source file and one new test; the blast radius is a rendered label beside a number whose value
    does not move.

    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/spend-figures-name-their-channel.test.ts`, declared in `files:`, so on this filing
    PR it resolves through W1-T456's forward-reference carve-out to `not_yet_built`.

    THE FORWARD REFERENCE IS FALSIFIED WITH A DISCRIMINATING CONTROL. `rmd check-proof` on the
    declared path reads `exit: 1`, `hits: 0`, `verdict: fail`. The SAME verb on an EXISTING pure
    path, `unit test: test/glance.test.ts` — the test file for the very module this task declares —
    reads `exit: 0`, `hits: 40`, `verdict: pass`. The control file was confirmed to exist BEFORE the
    falsifier was believed: an earlier filing used a control path that did not exist and read `hits:
    0` exactly like the declared path, discriminating nothing.

    THE 5.2% FIGURE SUPERSEDES A 4.1% OF MY OWN, AND BOTH ARE RECORDED — see rationale (3). The
    earlier pass omitted one Architect lane and two worker steps. This is stated rather than
    silently corrected because a shard that quietly replaces its own prior number is the shape this
    task exists to object to.

