  rationale: |
    GitHub recommends avoiding concurrent requests and using webhooks instead of polling. The
    transport already has a shared cadence floor, but that floor alone cannot prevent two callers
    that wake together from both spawning the same allowed read. The first caller stamps the shared
    window; the second caller still becomes a redundant child process unless the transport joins it
    to the first promise.

    The production consumers are not one caller: `waitForCiGreen` and `pollToGate` are async, and
    the daemon/review/console can observe the same head during a wake boundary. Duplicate REST
    reads are especially expensive during a secondary-limit episode because they consume cadence
    and CPU even when every response is identical.

    The safe boundary is exact-request single-flight, not a speculative result cache. It shares only
    a currently-running real `gh` read keyed by its argv, removes the key on resolve or rejection,
    leaves injected executors independent for tests, and preserves the existing cadence decision
    before the first spawn. A failed request therefore never poisons a later retry.
  design: |
    (i) Add a process-local map of exact real async argv -> in-flight promise in `ghJsonAsync`.
        The first caller performs the existing cadence check and spawn; later identical callers
        await that promise and issue no child process of their own.
    (ii) Do not coalesce injected executors, writes, or budget probes. They are test/offline seams or
         have side effects, and the existing read/write/exempt classifications remain authoritative.
    (iii) Delete the entry in `finally` on both success and failure. Never turn this into a TTL cache;
          freshness remains the caller's responsibility and an error must remain retryable.
    (iv) Add a real subprocess-counting regression with two concurrent identical reads, plus a
         control proving a later call after settlement can spawn again.
  acceptance:
    - claim: "two concurrent identical real async reads share one promise and spawn gh exactly once"
