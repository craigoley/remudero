    - claim: "a rejected or settled request is removed so a later identical read is eligible to run"
      proof: "unit test: identical real async reads are single-flight and spawn gh once"
    - claim: "single-flight does not alter injected async executor behavior"
      proof: "unit test: ghJsonAsync adds the default timeout to the single async transport spawn"
    - claim: "the implementation is process-local promise coalescing, not an unbounded response cache"
      proof: "grep: asyncReadInFlight = new Map<string, Promise<unknown>>(); in src/lib/github-transport.ts"
  falsifier: |
    Delete the `asyncReadInFlight` lookup/set/finally and rerun the subprocess-counting test; it must
    observe two `gh` invocations. Then make the fake `gh` fail once and succeed on the next call; the
    second call after rejection must execute, proving a failed request does not poison the key.
