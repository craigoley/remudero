  design: |
    No new constant, cap or policy key. The snapshot a pass returns is unchanged.
    1. Sealed sources live in their own segment files under the state directory, one per source, named by the
       source's name and sha256. A segment is written once, when its source is first folded, and never rewritten.
       It is removed when its source leaves the manifest.
    2. The live source's rows go to an append-only segment keyed by the live file's identity (the audited prefix
       hash the pass already verifies). A pass appends the rows of the tail it read. A live file whose prefix no
       longer verifies (rotation, compaction) starts a new segment and drops the old one.
    3. A small index holds the version, the per-source metadata (name, form, size, mtimeMs, sha256, segment),
       sourceFaults, baselineSources and lastGood. It is rewritten atomically each pass and carries no per-row
       evidence.
    4. A pass that folds only a live-tail delta writes the index plus the appended rows. Its bytes written are
       proportional to the delta, not to the history. The pass ledgers how many bytes it read and wrote beside the
       existing `checkpoint_bytes`, so the saving is measured on the host after merge.
    5. A v1 checkpoint is migrated on its first read: its sealed sources become segments and its live rows become the
       live segment, with no rescan of the ledger, and the v1 file is then removed. A missing, torn or
       sha-mismatched segment rescans its source through the existing rescan path. It is never read as an empty
       source.
    6. Readers keep one entry point. benchmark-aa's in-process pass and the idle pass get the same result through
       the unchanged `runBenchmarkCohortPass`.
    The builder reports, from a profile on a fixture with history, whether the pass's remaining time sits in reading
    the segments or in `deriveSnapshot`'s whole-history `indexEvidence`. If it is the latter, the builder names that
    as a follow-up and does not grow this task.
    Tests go in test/the-cohort-checkpoint-rewrites-only-what-a-pass-changed.test.ts, titled verbatim as in the
    proofs. Use a real state directory with sealed .gz rotations and a live file. To show the sealed segments were not
    written, assert their inode and mtime are unchanged after a tail-only pass. Assert the bytes the pass wrote are
    below the sealed rows' bytes. Positive control: the first pass does write every segment.
