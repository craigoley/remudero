  falsifier: |
    At origin/main a second pass after ~100 KB of live growth calls writeCheckpoint, which re-serializes every
    sealed source's rows into benchmark-cohort-v1.json. There are no segment files, and the bytes written exceed the
    sealed rows' bytes, so the first test fails. The second test passes before and after. It guards against a layout
    change that alters the computed snapshot.
