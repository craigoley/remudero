    - claim: "a member added to the result appears in the row without editing the row"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "an absent optional member is distinguishable from one present and undefined"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "a member already reported by its own row is not duplicated"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "the four members named today keep their existing key names"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "what the cadence runs and when it fires are unchanged"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "a failure building the row never prevents the cadence from running"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
    - claim: "restoring the hand-enumerated row makes the added-member assertion fail"
      proof: "unit test: test/the-cadence-row-names-every-member.test.ts"
