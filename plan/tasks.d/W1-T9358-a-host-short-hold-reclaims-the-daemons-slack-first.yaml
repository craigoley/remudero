    sizes refill from the learned tails through the shadow budget's model.
  design: |
    No new constant, interval, count or byte threshold. The floor (`memoryFloorMib`) and the W1-T8401 pacing stay.
    1. RECLAIM BEFORE A HOST-SHORT HOLD. `reclaimBeforeHold` also acts on tier host-short: it asks the installed
       reclaimer once, then decides on the fresh reading `reread` takes. For a host-short reading the moved figure
       W1-T8401's pacing compares is the host's MemAvailable, not the container working set, so the reclaimer's
       evidence pacing ("freed nothing measurable, wait for the reading to move") applies to the binding pool.
    2. ONE RECLAIM PER READING. A reading that already reclaimed (a container-short first reading whose re-read came
       back host-short) is not reclaimed again; its row carries the one reclaim it had.
    3. The memory governor's host arm (`checkMemoryGovernor`'s callers) gets the same: reclaim once, re-read, then
       decide. The tiers, the floor and the nothing-to-wait-for arm are unchanged.
    4. The hold rows (`dispatch_deferred_wip`, `sweep.fix_capacity`, `dispatch_memory_observed`) carry
       `reclaimLedgerFields` for a host-short reclaim exactly as for a container-short one.
    Tests go in the new file, with `test(` titles verbatim as in the proofs below. Inject the readings, the reclaim
    and the re-read; use the 00:23:20 row (host 4669 MiB, floor 3072) as the fixture.
