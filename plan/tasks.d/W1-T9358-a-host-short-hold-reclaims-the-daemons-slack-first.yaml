    MEASURED 2026-10-14 (core ledger, daemon pid 1710758, boot head 08cbabc50; read from a local copy of the
    rotated archives, Azure host read-only):
      - `dispatch_deferred_wip` (task GOVERNOR) at 00:19:14, 00:23:20 and 00:28:11: measured_bound 0,
        pressure_binding host, pressure_tier host-short, pressure_available_mib 3477, 4669 and 2678,
        pressure_floor_mib 3072. None carries a `reclaim_*` field: no reclaim ran. Against the 2048 MiB unit the
        shortfalls were 1643, 451 and 2442 MiB. All 3 lanes were empty from 00:13:50 (`lane.idle_changed`
        idle_slots 3); from the first host-short hold at 00:19:14 to the freshness exit at 00:31:48 that is 38 lane-min.
      - In the same process, W1-T8401's reclaim ran 15 times between 23:36 and 00:29 (`sweep.fix_capacity`,
        `dispatch_wip_observed`), all outcome `reclaimed`, freeing 182,738,944 to 2,237,661,184 bytes each (00:18:23:
        container 6446 to 3637 MiB). Freed daemon memory is host memory too: the container's pages are the host's.
    READ on origin/main b102674b1 (src/lib/sweep.ts, symbols):
      - `reclaimBeforeHold` returns its first reading unchanged unless `first.tier === "container-short"`.
      - `readFixHostPressureOnce` returns tier host-short whenever the binding pool is the host
        (`pool.binding === "host"`), and also when the container is unbounded or unread (`hostTier`). So a host-short
        reading never reaches the reclaim, in both the WIP governor's pressure (`checkQueueGovernor` reads it through
        `pressureWorkers`) and the fix admission.
      - `checkMemoryGovernor`'s host arm (`availableMib < policy.memoryFloorMib` gives tier host-short) defers with no
        reclaim either.
    NOT COVERED ELSEWHERE: swept plan/ on origin/main and the 8 open PR heads (2026-10-14 01:28Z) for host-short,
