    DROPPED FROM THE APPROVED SCOPE, ON EVIDENCE: sizing the WIP governor by the learned implement estimate instead
    of `DEFAULT_ESTIMATE_MIB.implement`. The learned implement claim estimate (`memory_budget.shadow` claims,
