  note: "verify:auto — design (i) and (ii) both carry recommendations with their reasons, and clause
    (iii) states a hard constraint rather than leaving the outcome to taste. Nothing is parked on an
    operator ruling.
    `files:` WAS DERIVED FROM THE GATES, NOT THE CODE THE AUTHOR PICTURES — this week's lesson after
    SEVEN corrections, one of which `lint-plan` caught by reporting `scopeGuardOutOfScopeFiles` would
    refuse the branch. `src/lib/review.ts` carries `judgeReview` and the execution branch that mints
    `executed_fail`; `src/lib/sweep.ts` carries the fix rung and the already-declared `isPlanFiling`;
    `src/run-task.ts` carries `buildOpenPrViews`, the producer that must populate it.
    THE DECLARED SUITES ARE THE ONES THAT ASSERT THE SHAPES THIS CHANGES, and the implementer should
    RE-COUNT BY INVOCATION before trusting them — `test/review.test.ts` for the verdict path and
    `test/sweep.test.ts` for the disposition rows. DROP ANY PATH THE IMPLEMENTATION DOES NOT TOUCH:
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) fails a declared-but-untouched path just as
    `scopeViolationFiles` fails an undeclared one.
    RULE 19: `risk: high` set UP FRONT so `sizingViolation` (`src/lib/task-linter.ts`) returns early
    before `subsystemsOf` is consulted. The band is the SPAN — three `src/` modules because the two
    defects genuinely live in two of them plus their shared producer — not blast radius.
    RULE 25: no instrument entanglement; all three are product paths and nothing here touches
    `INSTRUMENT_SURFACE`.
    THE WORKAROUND IS NOT A REASON TO DEPRIORITISE THIS, BUT IT IS A REASON NOT TO RUSH IT. `grep:`
    proofs against the PR's own shard already land filings green, so nothing is BLOCKED today; what is
    broken is that it takes a human who knows the trick. Re-derive before building — especially
    W1-T453's status, since its implementation may land first and would change what defect B needs."
