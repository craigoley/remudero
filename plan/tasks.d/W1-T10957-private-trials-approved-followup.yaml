  rationale: The operator requested durable plan custody of the remaining approved
    smart-router/automation/resource follow-ups so the long-running chat can close without losing
    implementation or readiness work. Previously prepared proposals are f6e362e5 (foundation),
    ded7d76a (collector/accounting), 0f701b6d (private trials) and ad478451 (Janitor journal).
    Reconcile the relevant proposal only; historical merged-main deltas are not this task's
    implementation. Public source references are provenance, not provider-attested runtime adoption.
    PR15262 is a completed fixture prerequisite, not any broader qualification.
  design: "Integrate the approved private benchmark portion of 0f701b6d only after the real execution
    metrics are available. Extend the existing model-canary mechanism, not a new scheduler:
    deterministic equivalent single-call/structured-output/tool/coding tasks, same
    effort/context/cache cohorts, fixed seeds/order rotation and explicit eligibility. Bound native
    parent-plus-child CPU/memory/heap/scratch/output/clock; use a genuine serial lease and prove
    cancellation/descendant closure. Coding runs use an isolated non-Git sandbox with synthetic
    fixtures and no real auth, fleet state, paid tools, arbitrary install, host mount or network
    unless the exact existing contract authorizes it. Maintain separate author/refusal/partial,
    correctness, invocation, usage/cost and served-identity evidence. Keep execution unarmed until
    an owner qualifies and explicitly releases its existing controls; no new schedule or public
    publication is authorized. Make coding a first-class versioned case in the existing suite,
    runner and schedule contracts without casts or misleading review/tool family labels. Retain
    the native 128-slot and serial-owner bounds. Join actual coding resource observations through
    a separately scoped versioned metrics receipt; configured caps are not measured peaks and
    unsupported isolation or missing resource evidence remains refused or unavailable. Extend the
    completed census case validator with the native coding contract so first-class coding cases
    survive full matrix preparation; do not bypass validation or relabel their family. Integrate
    the first-class coding case into the validated private corpus and app-owned trace/scorer
    contracts after W1-T11118. Preserve distinct canary-attempt, worker-spawn and host-execution
    identities with an explicit native join. Consume each coding attempt and its source digest
    durably through the existing slot owner before host execution; a duplicate or lost reply
    remains owned until native cancellation and descendant closure are proved. Register the actual `MODEL-CANARY-CODING` ledger sender in the existing `producer-identity.ts` registry; do not rename or suppress the observed producer."
