- id: W1-T13206
  title: "The board snapshot cache writes one buffer per commit instead of one write call per row, and skips the 14,068-row closed digest when its rows are unchanged, so a commit stops costing serve's loop up to a second"
  repo: remudero
  depends_on: []
  priority: 2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: medium # how the same bytes reach disk; the file format, its digest and every read path are unchanged
  origin: "operator-session#serve-oom-2026-11-16"
  plan_refs:
    - W1-T11266
    - W1-T8912
  files:
    - src/lib/board-snapshot-cache.ts
    - test/a-board-snapshot-commit-writes-one-buffer.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A commitIssues of 4,000 rows through an injected BoardSnapshotIo calls io.write at most 4 times (one concatenated buffer, written in bounded chunks of at most 16 MiB) and fsyncs once, and the file it writes is byte-identical to the one origin/main's per-row writer writes for the same rows"
      proof: "grep: W1-T13206 criterion 1 in test/a-board-snapshot-commit-writes-one-buffer.test.ts"
    - claim: "recordClosedAttempt after an unchanged closed commit (sameVersions true) reuses the held rowsDigest without calling boardClosedRowsDigest again, and a changed closed commit recomputes it once"
      proof: "grep: W1-T13206 criterion 2 in test/a-board-snapshot-commit-writes-one-buffer.test.ts"
    - claim: "invariant:same-bytes-same-identity — dataIdentity's sha256 and byte count after a commit equal the hash and size of the file on disk, and a reader (createBoardSnapshotReader) reads back every row"
      kind: guard
      proof: "grep: W1-T13206 criterion 3 in test/a-board-snapshot-commit-writes-one-buffer.test.ts"
  rationale: |
    WHY: on 2026-11-16, 48 of serve's loop stalls of 4 s or more (415 s of 1,494 s, 07:16Z to 14:00Z) carry
    board-snapshot-cache.ts frames (commitIssues, commitClosed, writeFully, recordClosedAttempt).
    MEASURED: a benchmark on a copy of the host's 49.9 MB snapshot (4,704 issues, 14,068 closed PRs), in the serve
    container under nice 10: commitIssues 265 to 1,059 ms per commit, recordClosedAttempt 720 ms when the closed rows
    moved. board_snapshot.committed rows: 20 issues commits an hour.
    READ at origin/main (a388fde0e), src/lib/board-snapshot-cache.ts: commit() builds one Buffer per row (reusing
    unchanged rows' lines, W1-T11266), then calls writeFully once PER BUFFER, so a commit is about 18,800 write
    syscalls plus an fsync of 50 MB on the main thread. recordClosedAttempt recomputes boardClosedRowsDigest when
    `state.closed !== digestRows`, which a commit replaces with a new Map even when sameVersions says nothing changed.
  design: |
    INVARIANT same-bytes-same-identity: the file, its digest and its identity are byte for byte what they are today.
    1. In commit(), after the size pass, write `Buffer.concat(lines)` (chunked at 16 MiB through writeFully) and hash it
       once; keep the staged rename, fsync and identity steps as they are.
    2. In recordClosedAttempt, reuse the held rowsDigest when the closed rows are the same versions as the held ones
       (the same sameVersions test commit() already uses), not only when the Map object is the same.
    3. No change to the read path, the header/footer, OPEN_SNAPSHOT_RESAVE_MS or the observation sidecar.
    4. Tests in test/a-board-snapshot-commit-writes-one-buffer.test.ts with a counting BoardSnapshotIo.
  falsifier: |
    Keep one writeFully per row: criterion 1 fails (about 4,000 writes). Recompute the digest on every attempt:
    criterion 2 fails. Hash the buffers in a different order from the bytes written: criterion 3 fails.
  note: |
    Id reserved for run-unfiled-1794844054000 with ~/rmd-work/bin/reserve-id.sh.
    This lowers the cost; moving the board gateway off serve's request process entirely is the thin API plan's step 6.
