- id: W1-T2250
  title: "Both credential arms of the containment preflight are ANDs of two LITERAL phrases the SDK no longer emits — a probe whose stderr reads `401 OAuth access token has expired` matches neither conjunct of either arm, so it falls through to `unproven` and the two named reasons have never once been recorded"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 45.00
  risk: high
  rationale: |
    Filed by reading only, from a scratch worktree PROVEN equal to origin/main by sha, clone
    shallow-checked `false`. No suite, no poller, no spawning verb.

    (1) THE ARMS ARE REACHABLE. THEY ARE NOT GUARDED, SAMPLED OR CONDITIONAL. Inside
    `probeContainment`'s `if (!verdict.contained)` block (`src/lib/containment.ts`) the order is
    straight-line: `if (evidence.credentialExpired) throw …"spawn-credential-expired"`, then
    `if (evidence.credentialFailure) throw …"spawn-credential-failure"`, then the generic
    `classifyUnprovenState(evidence)` throw. Nothing sits in front of them. **SO THE REMEDY IS NOT
    A REACHABILITY FIX** — the predicate is consulted on every uncontained probe and answers false.

    (2) THE PREDICATE IS AN `AND` OF TWO LITERAL PHRASES, PER ARM, AND ALL FOUR ARE QUOTED HERE
    RATHER THAN PARAPHRASED:
        const CREDENTIAL_FAILURE_RE = /not logged in/i;
        const CREDENTIAL_LOGIN_HINT_RE = /run \/login/i;
        const CREDENTIAL_EXPIRED_RE = /oauth session expired/i;
        const CREDENTIAL_REFRESH_FAILED_RE = /could not be refreshed/i;
    and each flag is `r.isError === true && <first> && <second>`. The both-fragments-required shape
    is deliberate and correct — its own comment says "not 'any error' … so an unrelated error-result
    is never mislabelled a credential failure". THE CONSERVATISM IS NOT THE DEFECT; THE PHRASES ARE.

    (3) THE COUNTER-EXAMPLE, MATCHED AGAINST ALL FOUR LITERALS. The observed excerpt is
    `Failed to authenticate. API Error: 401 OAuth access token has expired`.
        /oauth session expired/i      -> NO. The text reads "OAuth access token has expired": no
                                          "session", and two words intervene before "expired".
        /could not be refreshed/i     -> NO. The phrase does not occur.
        /not logged in/i              -> NO. The phrase does not occur.
        /run \/login/i                -> NO. The phrase does not occur.
    All four miss, both ANDs are false, and the row falls to `classifyUnprovenState` and is recorded
    `unproven`. **THIS IS A MESSAGE-SHAPE MISMATCH, NOT AN UNREACHABLE ARM AND NOT A FLAG THE SDK
    NEVER SETS** — the flag is computed from the transcript this code reads, and the transcript no
    longer contains the words it looks for.

    (4) THE FLEET-WIDE ZEROS ARE THE OPERATOR'S AND ARE ATTRIBUTED; THIS HOST CORROBORATES THEM ON
    A LONGER, OLDER WINDOW. Over the ledger union at the state dir (`archiveCount: 672`,
    `liveFileRead: true`), the `containment.probe` step — the one that writes
    `credential_failure: evidence.credentialFailure` and `credential_expired: evidence.credentialExpired` —
    reads 669 rows spanning 2026-07-14T16:41:21.392Z .. 2026-08-12T23:50:43.110Z:
        credential_expired PRESENT on 187 rows, TRUE on 0
        credential_failure PRESENT on 249 rows, TRUE on 0
    The zeros are CONTROLLED by the presence counts — the fields exist and are read, and neither has
    ever been true across every row that carries it. The operator's window reads 406 rows with both
    fields present 406/406 and both true 0; the presence figures differ because the two fields were
    added at different times (W1-T237, then W1-T292), so "406/406" is a property of that window and
    not of the whole corpus.

    (5) AND THIS HOST CANNOT QUOTE THE COUNTER-EXAMPLE ROW, WHICH IS STATED RATHER THAN GLOSSED.
    A first pass here searched `stderr_excerpt` for auth/oauth/401/token text and read ZERO. THAT
    ZERO WAS BLIND, AND THE CONTROL SAYS SO: `stderr_excerpt` is PRESENT on 0 of the 669 rows and
    `observed` is absent on all 669 — this corpus predates both fields entirely, so it cannot carry
    that row by construction. The 401 excerpt is therefore ATTRIBUTED to the operator's reading, not
    re-derived, and the zero above is reported as unreadable rather than as absence.
  design: |
    (i) THE REMEDY IS THE PHRASES, AND IT KEEPS THE SHAPE THAT MAKES THEM SAFE. Each arm stays
    `isError === true` AND two independent fragments; what changes is which fragments, derived from
    the text the SDK actually emits rather than from the text it emitted when W1-T237 and W1-T292
    were written. A single-fragment arm would be a different and worse design — see (iii).

    (ii) Q2 — FIXING IT CHANGES NO OUTCOME TODAY, AND THE VALUE IS THE LABEL AND ONLY THE LABEL.
    Both credential arms throw `ContainmentError` and fail closed; so does the generic `unproven`
    throw. A correctly-firing arm refuses THE SAME RUN. The delta is the `check` symbol, and its
    reach is small but not nil: `run-task.ts` writes `check: e.check` onto the `verdict` ledger line,
    and `retro.ts` reads it back through `resolveGuardCheck`, keys a group on `${e.guard} ${e.check}`,
    and RENDERS it — `- ${r.guard}/${r.check}: ${r.count}x across …` — under a line that calls such a
    grouping "a HOST signal, not a task signal". **NOTHING BRANCHES ON IT.** A tree search finds the
    two symbols at their own throw sites and in `test/containment.test.ts`'s assertions, nowhere
    else; the control is `outside-cwd-denial`, which DOES appear in `retro.ts` as well, so the query
    can see a symbol that travels.

    (iii) SO IS IT WORTH BUILDING BEFORE SOMETHING READS IT? YES, AND THE REASON IS NOT THE READER.
    This is close to the W1-T329 shape — a correct symbol nothing consults — and that shape is
    normally a reason to wait. It is not here, for two reasons. FIRST, a reader already exists: the
    retro's host-vs-task grouping is exactly where a credential-dead run should not be counted as a
    containment finding, and today it is. SECOND, THE COST OF WAITING IS BORNE BY THE WRONG PARTY:
    every one of these runs is currently recorded as `unproven`, which reads as "the sandbox could
    not be shown to work" when the true state is "the worker never authenticated". That is a false
    signal about isolation, not merely a missing label, and it accumulates in the same corpus the
    retro reads. The task is small; the argument for it is the false reading, not the symbol.

    (iv) Q3 — WHAT MUST NOT CHANGE.
      **BOTH ARMS STILL THROW AND STILL FAIL CLOSED.** No relaxing, no sampling, no thresholding, no
      "n of m probes" tolerance. W1-T1265's discipline is untouched: a signal that was not observed
      stays UNOBSERVED and verdicts UNPROVEN, never "blocked".
      **`unproven` REMAINS CORRECT FOR ANYTHING THESE ARMS DO NOT CLAIM.** A widened arm that
      swallows genuine unknowns would be worse than one that never fires, because it would convert
      an honest "cannot tell" into a confident wrong answer — and unlike today's failure, that one
      would not be visible as a zero. The falsifier the new test must carry is exactly this: a
      transcript that is credential-shaped but NOT credential-dead must still classify `unproven`.
      **THE TWO SYMBOLS STAY DISTINCT.** `spawn_credential_expired` and `spawn_credential_failure`
      name different operator actions — re-mint a token versus log in from scratch — and the source
      comment already forbids sharing a symbol. Nothing here folds them.

    (v) THE SIBLING IS CITED, NOT RE-FILED. W1-T2249 proposes a THIRD arm of this same shape; if
    that arm is written against phrases chosen the same way, it inherits this defect on the day it
    ships. That is the argument for fixing the derivation, not just the two literals — but the third
    arm is W1-T2249's to file and this task does not pre-empt it. W1-T1265 is cited for the
    fail-closed discipline in (iv) and is likewise not re-filed.

    (vi) NOT IN SCOPE, NAMED: `classifyUnprovenState` and its four sub-states; the `observed` field;
    `stderr_excerpt`'s cap; the retro's grouping logic; any change to what fails closed; and the
    third arm W1-T2249 proposes.
