    - claim: "an unrecognised failure still fails towards failed rather than towards benign"
      proof: "unit test: test/disarm-lost-race-hard-stop.test.ts"
    - claim: "a refused verdict that merged anyway escalates as a hard stop"
      proof: "unit test: test/disarm-lost-race-hard-stop.test.ts"
    - claim: "the escalation carries the merge sha the verdict and the judge's reasons"
      proof: "unit test: test/disarm-lost-race-hard-stop.test.ts"
    - claim: "nothing reverts reopens or force-pushes on a lost race"
      proof: "unit test: test/disarm-lost-race-hard-stop.test.ts"
    - claim: "an ordinary successful withdrawal costs no extra request and is unchanged"
      proof: "unit test: test/disarm-lost-race-hard-stop.test.ts"
