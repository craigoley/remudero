    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/disarm-lost-race-hard-stop.test.ts`, declared in `files:`, so on the filing PR it
    resolves through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19 SPAN — the `files:` list is one module and its test.
    The change decides when the fleet declares a hard stop; too loose and every benign unarmed
    disarm pages an operator, too tight and an unattended merge stays invisible.

    WHAT IS ESTABLISHED FROM SOURCE VERSUS WHAT IS OBSERVED. Rationale (5) and (6) are read
    directly from `src/run-task.ts` at origin/main and are checkable without the fleet: the two
    bare `disarmAutoMerge(prUrl);` statements with an unconditional `automerge.disarmed` beside
    them, and `classifyDisarmFailure`'s mapping. Rationale (1)'s timestamps are GitHub's event and
    check-run records. The two console lines the operator quoted, and every ledger row, are NOT
    reachable from this checkout and were not asserted from it.

    THE CONTRADICTION IN RATIONALE (4) IS LEFT OPEN ON PURPOSE. A reading of source that the
    observed behaviour contradicts means the environment differs from the tree, not that one of
    them is wrong; the remedy is to re-take the measurement somewhere else — here, the container's
    own ledger — rather than to pick whichever explanation is more convenient. The implementer
    settles it first, because which site armed decides whether anything ALSO needs to change there.

