- id: W1-T3880
  title: "USE CAPABILITIES WITHOUT EXPOSING SECRETS — scoped credential references, one-time grants, and untrusted-content containment"
  repo: remudero
  depends_on: ["W1-T3855", "W1-T3878"]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 95.00
  risk: high
  band_meaning: blast-radius
  origin: "research:instinct-automation-2026-09-20"
  plan_refs: ["§Credential boundary", "§Self-improvement", "W1-T3855", "W1-T3878"]
  files:
    - src/lib/capability-grant.ts
    - src/lib/prompt-render.ts
    - src/lib/worker-provider.ts
    - test/capability-grant-scope.test.ts
    - test/capability-grant-secrets.test.ts
    - test/capability-grant-replay.test.ts
    - test/capability-grant-content.test.ts
    - test/capability-grant-receipts.test.ts
    - openapi/daemon.yaml
  status: merged
  attempts: 0
  rationale: |
    Broad personal-agent integrations make real work possible, but passing passwords, payment data,
    or browser credentials through model context makes every prompt-injection and logging mistake a
    credential incident. The safer pattern is a short-lived capability grant: the executor can use a
    narrowly scoped secret or operation without the model receiving the secret itself.

    RMD already treats raw credentials and untrusted text as boundaries. This task makes that rule
    usable for future browser, provider, and host actions without inventing a second credential
    store or allowing a connected document to widen its own authority.
  design: |
    Add `capability-grant-v1` with a non-secret grant reference, target identity, operation allowlist,
    repository or instance scope, audience, expiry, one-time or bounded-use limit, approval receipt,
    redaction policy, and revocation link. The provider or host adapter resolves the reference at the
    last responsible moment; the model, ledger, browser payload, and ordinary logs receive only the
    reference and redacted outcome.

    Treat email, documents, pages, tool output, and other external content as data, never as authority.
    The grant verifier must bind the requested operation to the issued scope and reject attempts to
    expand it through text, tool arguments, retries, or agent handoff.
  acceptance:
    - claim: "a capability grant is scoped to an operation, target, audience, expiry, use limit, approval receipt, and revocation link"
      proof: "unit test: test/capability-grant-scope.test.ts"
    - claim: "the model, browser, ledger, and ordinary logs receive no raw credential or secret value"
      proof: "unit test: test/capability-grant-secrets.test.ts"
    - claim: "expired, revoked, replayed, wrong-audience, and operation-expanding requests are refused"
      proof: "unit test: test/capability-grant-replay.test.ts"
    - claim: "untrusted external content cannot change the grant scope or approval decision"
      proof: "unit test: test/capability-grant-content.test.ts"
    - claim: "a successful use and a refused use both produce bounded, attributable receipts"
      proof: "unit test: test/capability-grant-receipts.test.ts"
    - claim: "the provider execution path verifies the capability grant before using it"
      proof: "grep: verifyCapabilityGrant( in src/lib/worker-provider.ts"
  falsifier: |
    Put a secret in model context or browser state, accept a grant after expiry or revocation, let a
    document widen its operation, reuse a one-time grant, or emit an unbounded provider response.
    The corresponding proof must fail.
  note: "This task is a capability boundary, not permission to connect production accounts. Secret provisioning and deployment remain separately approved. reservation hand-off: unknown -> run-W1-T3878-1789934131000"
