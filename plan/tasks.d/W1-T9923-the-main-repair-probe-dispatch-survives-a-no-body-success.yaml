    ROOT CAUSE, READ at origin/main 32dc6614f:
      - `restMainProbes(...).dispatch` (src/lib/main-health-rung.ts) creates the ref (POST git/refs answers 201 with a
        JSON body, which succeeds). It then POSTs `actions/workflows/ci.yml/dispatches`, which GitHub answers with
        204 No Content.
      - src/run-task.ts wires the rung's fetch as `(args) => ghJsonAsync(args)`, with no rate-limit reader, so
        `ghJsonAsync` returns `parseGhJsonBody(args, stdout)` on the bare stdout.
      - `parseGhJsonBody` (src/lib/github-transport.ts, #6129, 2026-09-19) runs `JSON.parse(body)` and wraps any throw
        in `GhJsonUnreadableResponseError`, whose message is exactly "gh api response body was unreadable".
        `JSON.parse("")` throws "Unexpected end of JSON input". An exit-0 `gh api` with an empty body is therefore
        reported as a transport failure.
      - `release` (DELETE git/refs, also 204) fails the same way, which is why the refs above were never released.
      - `locateOffender` then returns `unlocated` as soon as every dispatch in a pass throws and none is in flight.
        There is no retry and no deferral, so each pass repeats the same failure.
