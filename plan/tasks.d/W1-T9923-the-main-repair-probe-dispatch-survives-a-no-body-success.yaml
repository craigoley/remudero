  design: |
    Operator rulings: no hard thresholds (no fixed retry count, wait or span cap), lean into automation.
    1. A NO-BODY SUCCESS IS A SUCCESS. In src/lib/github-transport.ts, an `api` call whose process exits 0 with an
       empty or whitespace-only body returns `undefined` from `ghJson` and `ghJsonAsync`, instead of throwing
       `GhJsonUnreadableResponseError`. A non-empty body that does not parse still throws, which is #6129's case.
       When the `-i` header block is present, its status line must read 2xx. The test pins both the bare-stdout and
       the header paths. Every 204 caller gains from this (dispatch, ref DELETE). A census in the test lists the
       repo's `--method DELETE` and `/dispatches` call sites at head, so a new one inherits the case by construction.
    2. A TRANSIENT DISPATCH FAILURE DEFERS, AND NEVER ENDS IN UNLOCATED. A probe dispatch that fails transiently
       does not count toward "no probe could be dispatched". Transient means `classifyGhFailure` reads rate_limit,
       a 5xx, a timeout, or an unreadable body. The lane writes `main.repair.probe_dispatch_deferred` with the
       error, the attempt number and the next attempt time, then returns `probing`, so the lane still owns the red.
       The backoff is measured: the `Retry-After` or rate-limit reset when GitHub gives one, otherwise the measured
       interval between the rung's own recent passes, doubling per consecutive failure of the same probe. There is no
       fixed count. The deferral row joins the rotation-retained steps.
    3. IDEMPOTENT RE-DISPATCH. Before re-dispatching a probe whose earlier dispatch threw, the lane reads the ref's
       workflow runs (`probes.read`). A dispatch GitHub accepted, whose answer was lost, is adopted as in flight,
       never dispatched twice. The two refs already left on origin are reused by the existing "already exists" arm
       and released once their run concludes.
    4. UNLOCATED IS THE LAST RESORT, NAMED. It is written only for a non-transient refusal (a 4xx other than rate
       limit, a missing workflow, a ref that cannot be created) or when the fallback below cannot prove a pair. It
       carries `local_reason` and the probe's last error class.
    5. FALLBACK, KEPT FROM THE FIRST DRAFT: NO GREEN BOUNDARY, OR A NON-TRANSIENT PROBE REFUSAL.
       a. NAMED-PATH ATTRIBUTION. Take the strings each failing assertion prints (its `+`/`-` lines and message)
          and find the first-parent merges in the range that added or removed each one (`git log --first-parent
          -S<string>`). The range is from the last green when known; otherwise it steps back from the head.
       b. LOCAL SINGLE-FILE BISECT, to prove it. Run only the failing test files, with CI's flags, at the candidate
          and its first parent, then bisect the range when there is no candidate. Probe count follows the range size
          (log2). With no green, step back by doubling until the files pass. A proof is a red at X and a green at X's
          first parent on the same files.
       c. SEAMS. The rung has no git or test seam today, so `MainHealthRungDeps` gains `searchHistory` and
          `runFilesAt(sha, files)`. src/run-task.ts wires defaults on the daemon's managed checkout and a worker
          worktree under the existing worker sandbox, never the host shell.
       d. VERDICTS. Local verdicts enter `probeVerdicts` as evidence kind `local-file`, so `locatedWriterRefusal`
          still judges them. A named path with no proven pair is written as `main.repair.suspect`, never located.
    6. THEN THE NORMAL PATH. `main.repair.located` is written with method `bisected-first-red` (CI probe),
       `named-path-bisect` or `local-bisect`, with its inputs, and the lane proceeds to its fix PR or revert proposal
       as for `first-red-run`.
    7. Tests (new file, test titles verbatim as in the proofs below; drive `ghJsonAsync` with a fake exec, and the
       rung with the existing probe, fetch and ledger fakes the W1-T7760 suite uses):
       - an exit-0 `gh api` with an empty body resolves `undefined`, and a non-empty unparseable body still throws
         `GhJsonUnreadableResponseError` (positive control). At origin/main the first throws;
       - `restMainProbes` over a fetch that answers the dispatches POST with an empty body returns a handle, and
         `release` resolves;
       - a dispatch that fails transiently writes `main.repair.probe_dispatch_deferred` and returns probing, never
         `main.repair.unlocated`. A re-dispatch first reads the ref's runs and adopts one already started;
       - with no green boundary, a failing assertion naming a path that one merge added, and a local runner red there
         and green at its parent, the lane writes `main.repair.located` with method `named-path-bisect`.
