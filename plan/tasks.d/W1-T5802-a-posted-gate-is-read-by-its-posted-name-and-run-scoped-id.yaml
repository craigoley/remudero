- id: W1-T5802
  title: "A POSTED GATE IS READ BY ITS POSTED NAME AND ITS RUN-SCOPED ID — `checkJobId` (sweep.ts) accepts only `^job:(\\d+)$` and `derivePrCheckCandidates` (ci-control-plane.ts) names only job `name:`s, so W1-T5695's run-scoped external_id would blind the sweep's rerun and log reads, and its own-name `rule-checks` post would need a stub job plus ci-parity and gate-posture rows beside a workflow edit"
