  rationale: |
    THE ENFORCEMENT HALF ALREADY SHIPPED AND THAT IS PRECISELY WHY THIS GAP IS INVISIBLE. #2376
    (W1-T1000002) made an operator merge hold a LEDGERED REFUSAL rather than a disarm — the sweep
    withdraws an arm on the pass that observes a hold, a held PR is never armed at open, and a push
    does not lift the hold. #2541 (W1-T1000003) renders a held PR as its own NEEDS ME row. Both are
    on main. Every one of those behaviours keys off `automerge.hold_engaged`/`_released` rows in the
    ledger, and NOTHING WRITES THEM. The mechanism is complete, correct, and unreachable.

    SO THE MISSING PIECE IS A WRITER, AND IT IS NOT MERELY AN APPEND. A hold is a human decision
    that overrides an automated one, so the verb must be attributable (`--by`, `--reason` are not
    optional), must be scopeable to one PR or to the whole fleet, and must be verified: the row is
    read back THROUGH THE PRODUCTION READER every arm site already uses, and a write that does not
    become the current decision for that scope THROWS rather than reporting success. An operator who
    is told a hold is engaged and finds it was not is worse off than one told nothing.

    THE REFUSAL ARMS CARRY THE SAME WEIGHT AS THE HAPPY PATH HERE. An unattributed hold is not a
    hold anyone can audit, so a missing `--by` or `--reason` REFUSES with a nonzero exit and writes
    nothing; `--task` without `--pr` names a scope that does not exist and refuses rather than
    silently widening to the fleet; and releasing an already-clear scope is an idempotent no-op that
    exits 0 and appends NO row, because a release row for a hold that was never engaged is a false
    entry in exactly the audit trail this verb exists to produce.

    WHY THIS IS A SEPARATE TASK AND NOT AN AMENDMENT TO W1-T1000002. That task is MERGED — #2376
    carries both credit paths (`Remudero-Task: W1-T1000002` and the head ref
    `run-W1-T1000002-1787310737460`), and its eight criteria describe the sweep, ledger and
    feedback-landing surfaces it actually changed. A PR delivering a CLI writer cannot satisfy
    them: measured on 2026-09-01, `disarmAutoMerge(` in src/lib/sweep.ts reads 3 at head and 3 at
    base, `automerge.hold` in src/lib/ledger.ts reads 4 and 4, and test/automerge-hold.test.ts
    passes 17/17 identically either side. Those proofs discriminate nothing about a writer because
    the work they name shipped ten days earlier. Re-using a merged task's id makes the reviewer
    judge new work against old criteria, and the honest fix is a new id — never an edit to the
    criteria of a task that already merged (Standing rule 21's territory).

    THE RE-DISPATCH THAT PRODUCED THAT MISATTRIBUTION IS ITSELF WORTH RECORDING: W1-T1000002's
    shard still reads `status: queued, attempts: 0` on main despite #2376. CLAUDE.md names this
    exact trap — "a shard's `status:` field is not a completion signal — it stays `queued` on tasks
    that shipped" — and the credit projection (trailer union head-ref) is the only completion
    signal. This task does not fix that; it is named here so the next reader of either shard is not
    misled the same way.

    NOT IN SCOPE: changing any enforcement behaviour, the hold reader, the sweep's withdrawal, or
    the board row. All three shipped and are load-bearing. This adds the writer and nothing else.
