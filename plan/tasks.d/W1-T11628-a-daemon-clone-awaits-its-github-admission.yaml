    - claim: "The real in-process task clone awaits the same transport, and clone failure cannot start a claim, worktree, worker or paid attempt"
      proof: "grep: W1-T11628 criterion 2 in test/github/a-daemon-clone-awaits-its-github-admission.test.ts"
