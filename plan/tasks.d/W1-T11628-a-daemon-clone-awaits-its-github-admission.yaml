    Restore either synchronous clone: its actual caller's pending-gap test fails with
    the typed refusal or blocked heartbeat. Remove an await: the success continuation
    or downstream-action guard fails before the private clone settles. Preserve the
    wrong-owner, failing-clone and ordinary CLI controls unchanged.
