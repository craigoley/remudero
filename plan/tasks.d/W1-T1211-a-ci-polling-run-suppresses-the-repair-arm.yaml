  note: |
    NO PROOF IN THIS SHARD GREPS ITS OWN PATH. Every criterion uses the pure-path `unit test:` form
    naming `test/light-pass-ci-idle.test.ts`, declared in `files:`, so on the filing PR it resolves
    through W1-T456's `forwardReferenceFiles` carve-out to `not_yet_built`.

    `risk: high` IS BLAST RADIUS, NOT RULE 19. The change decides whether a worker-spawning lane may
    run beside an in-flight run; a mistake either keeps the repair arm suppressed or puts two
    workers on a host measured to fit about four while another lane is already spending.

    ONLY `src/run-task.ts` IS DECLARED because the light ticker's restriction is a WIRING decision —
    `actionable: (d) => d === "post-review"` is passed there. `src/lib/sweep.ts`'s gate is correct
    and unchanged: it applies whatever predicate it is handed, and widening the gate itself would
    change every caller rather than the one that is wrong.

    THE SIZING IS A PROXY AND SAYS SO. Rationale (5) reports what the reachable corpus can show over
    an EARLIER window and states plainly that the requested last-week fraction is unmeasurable from
    this host. An implementer on the fleet should re-derive it there before tuning anything to it.

    ID PROVENANCE. `refs/rmd-id/W1-T1211` resolves to 6cf17976fccdce4793cc4a5ea196533c77234d70,
    read over git protocol; live control, `refs/rmd-id/W1-T999999` exits 2. THE ANCHOR MESSAGE WAS
    NOT JUDGED. Eight surfaces were swept with a control PRE-QUALIFIED FOR EACH: an id with a shard
    file on main, one with a declared `- id:`, a live `run-W1-T*` head for the remote-head surface
    (a merged id's branch is deleted and would read zero), and an id that genuinely appears in a
    main commit subject for the `git log` surface (W1-T1110 does NOT, and was rejected as a control
    for that surface for exactly that reason).

    AMENDED 2026-08-22 — THE MEASUREMENT, TAKEN AFTER FILING, AND IT SAYS SOMETHING NARROWER AND
    WORSE THAN "A RUN HANGS".

    (a) THE SUPPRESSION IS EXACT. Between `state/inflight/W1-T1205.lock` being taken at 14:59:03Z
    and released at 15:40:11Z the daemon wrote 347 `sweep.pass` rows carrying `enumerated: 1` — the
    light pass, which fans out one row per pull request — and ZERO full sweeps. The last full pass
    was 14:46:46Z, BEFORE the lock. Control: 143 full sweeps were written across the day, so the
    zero is an absence and not a broken scan.

    (b) AND THE RUN WAS HEALTHY THROUGHOUT. `ci.polling` ran 11 rows from 15:23:20Z to 15:30:15Z,
    then `pr.polling` from 15:36 to 15:39, then `pr.merged` at 15:40:11Z followed immediately by
    `worktree.remove` and a `verdict`. It waited on CI, it waited on the merge, and it finished. No
    hang, no stall, no stranded lock, nothing to reap.

    (c) SO THE ARGUMENT IS NOT THAT A RUN HANGS — IT IS THAT A HEALTHY ONE IS ENOUGH. A normal
    41-minute run suppressed the repair arm for its entire duration, BY DESIGN: W1-T254 restricted
    the light hook to `actionable: d => d === "post-review"` precisely so the single-threaded lanes
    stay single-threaded while `runOne` is in flight, and dispatchFix/close/escalate/depReview/arm
    all stand down as "deferred to full sweep (light pass)". Nothing malfunctioned. That is the
    finding, and a reader who takes this shard as a lock-hygiene or stuck-run task has taken the
    wrong one.

    (d) WHICH FIXES THE SHAPE OF THE REMEDY. `state/inflight/` needs no reaper here and the lock
    released cleanly on its own; the change this task is about is WHAT THE LIGHT HOOK MAY DO WHILE A
    HEALTHY RUN WAITS, not how locks are cleaned up.

    (e) AND IT REPRODUCED WHILE THIS NOTE WAS BEING WRITTEN, WHICH IS THE STRONGEST FORM OF THE
    CLAIM. The moment the lock released, a full sweep ran at 15:41:58Z (`enumerated: 13`) — 107
    seconds later, the first in 55 minutes. Two further runs then took locks at 15:43
    (`W1-T1201.lock`, `W1-T1206.lock`), and the repair arm is suppressed again. So this is not one
    incident recovered from: it is the steady state of a busy board, and the earlier note's "empty
    again" reading describes one quiet moment rather than the condition.
