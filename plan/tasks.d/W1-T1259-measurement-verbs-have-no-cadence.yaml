      proof: "unit test: test/measurement-cadence.test.ts"
    - claim: "the cadence is paced by policy data with both an interval bound and a per-day bound, not by the raw poll interval"
      proof: "unit test: test/measurement-cadence.test.ts"
    - claim: "the default cadence writes nothing — rule-efficacy runs in its no-escalate form and the other two are read-only"
      proof: "unit test: test/measurement-cadence.test.ts"
    - claim: "the cadence never files a task or mints an id from a metric, and the escalating form remains opt-in and off by default"
      proof: "unit test: test/measurement-cadence.test.ts"
    - claim: "an unattended run with nothing measurable renders a refusal rather than a zero that reads as health"
      proof: "unit test: test/measurement-cadence.test.ts"
