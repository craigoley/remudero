- id: W1-T1259
  title: "the three verbs that would answer 'is this system getting better' have never run on a cadence — `rule-efficacy`, `verdict-calibration` and `autonomy-rate` are all merged, all host-side, and reachable only by an operator typing them on the right machine"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 30.00
  risk: high
  rationale: |
    (1) THE THREE VERBS ARE ON MAIN AND NOTHING CALLS THEM BUT CLI DISPATCH. `rule-efficacy`
    (#1605), `verdict-calibration` (#1614) and `autonomy-rate` (#1658) all registered and
    dispatched from `src/run-task.ts`. Re-derived here rather than carried: the importer sweep
    returns `src/run-task.ts` alone for `rule-efficacy.js` and `autonomy.js`, and
    `src/lib/autonomy.ts` plus `src/run-task.ts` for `verdict-calibration.js` — and `autonomy.ts`
    is itself imported only by `run-task.ts`, so that second importer is inside the same CLI-only
    island rather than a second entry point.

    (2) THE ORCHESTRATORS REFERENCE NONE OF THEM, WITH AN ORDERING CONTROL SO THE ZERO MEANS
    ABSENCE. `src/lib/retro.ts`, `src/lib/daemon.ts` and `src/lib/sweep.ts` carry zero matches for
    any of the three module names. The reader is not blind to those files: they hold 11, 17 and 8
    sibling `./` imports respectively. And the importer query itself is not blind: run against
    `./ledger.js` it returns a dozen `src/lib/` importers.

    (3) HOST-SIDE ONLY, WHICH IS WHAT MAKES THE GAP STRUCTURAL RATHER THAN AN OVERSIGHT.
    `rule-efficacy`'s own header says it: "HOST-SIDE, NOT A CI GATE: the ledger lives on the daemon
    host; nothing in CI can read it." So the cheapest-looking cadence — a scheduled GitHub
    Actions workflow — cannot run these AT ALL. The cadence has to live where the ledger is.

    (4) THE MARGINAL COST IS NOT DOLLARS, AND THE CONTROL FOR THAT CLAIM HAD TO BE RE-QUALIFIED.
    None of the three modules references `budgetUsd`, `spawnWorker` or `costUsd` — they read the
    ledger union and compute. The first control chosen for that query, `src/lib/auto-triage.ts`,
    reads 0 for the same symbols despite being the spending rung, so it was DISQUALIFIED rather
    than used to license a zero; re-qualified on `src/lib/containment.ts` and
    `src/lib/isolation.ts`, which do carry `budgetUsd`. Against that control the three modules
    read 0. This puts them in a different class from the auto-triage rung, whose median run spends
    $0.98 unsupervised and needs `maxPerDay`/`minIntervalMinutes` to bound spend rather than load.

    (5) TWO OF THE THREE ARE PURE READERS AND THE THIRD HAS A BUILT-IN ZERO-WRITE MODE.
    `verdict-calibration` and `autonomy` carry no write symbols at all (control: `src/lib/inbox.ts`
    reads 6 for the same query). `rule-efficacy` is the only writer, and its single write is the
    escalation described below.

    (6) THE ESCALATION WAS DESIGNED FOR A POLL CADENCE THAT WAS THEN NEVER BUILT.
    `escalateRepeatingRules`'s own doc says it is "IDEMPOTENT by rule id: a rule that already
    carries an open `rule-efficacy:<ruleId>` proposal is never re-drafted, so the daemon's own
    poll cadence (or a second manual `rmd rule-efficacy`) never duplicates it." The design named
    the daemon poll as the expected caller. No such caller exists.

  design: |
    ONE CONCERN: give the three measurement verbs a cadence on the host where their corpus lives.

    (i) THE SITE — THE DAEMON POLL WITH ITS OWN PACING BOUND, NOT THE RETRO TRIGGER AND NOT A
    SEPARATE UNIT. Three candidates were weighed and this task picks one rather than leaving it
    open:
      - THE RETRO TRIGGER (`evaluateRetroTrigger`, `retro.mergesThreshold: 25` OR
        `retro.daysThreshold: 7`, whichever crosses first) is the wrong grain. It can leave the
        instruments blind for a full week, and it couples a cheap ledger read to this repo's most
        expensive rung — so a retro that is skipped, deferred or fails takes the measurement with
        it. Its thresholds are also tuned for retro's cost, and re-tuning them to suit a free read
        would move a bound that means something else.
      - A SEPARATE UNIT (a launchd/systemd timer, a scheduled workflow) is what the CI-shaped
        instinct reaches for, and rationale (3) rules the CI half out entirely: nothing in CI can
        read the ledger. A host timer would work but adds a second scheduler to operate, one that
        can silently stop without the daemon noticing — the failure mode this task exists to end.
      - THE DAEMON POLL (`pollIntervalMs: 60000`) is where the design already pointed
        (rationale (6)), on the host that already holds the ledger, inside a process that is
        already supervised. 60s is far too frequent for a metric, so this adds its OWN pacing
        bound in `plan/policy.yaml` mirroring the shape `autoTriage` already uses
        (`minIntervalMinutes` plus `maxPerDay`) — policy data, not a source constant, so the
        cadence is retunable by a reviewed policy edit rather than a deploy.

    (ii) THE SAFE MODE IS THE DEFAULT, AND IT ALREADY EXISTS. The cadence runs
    `verdict-calibration` and `autonomy-rate` — both pure readers — and `rule-efficacy` with
    `--no-escalate`, which the verb's own doc describes as running "the report only, with zero
    writes." A cadence that writes nothing cannot launder anything, and it can be turned on
    without an operator decision about proposals. Whether the escalating form is ever enabled is a
    SEPARATE, opted-in policy flag, shipped OFF, exactly as the auto-triage rung was.

    (iii) IF THE ESCALATING FORM IS EVER ENABLED, ITS EXISTING BOUNDS ARE THE CONTRACT.
    `escalateRepeatingRules` drafts at most ONE proposal per REPEATING rule at
    `>= RULE_EFFICACY_ESCALATION_THRESHOLD` (2) post-rule recurrences, through
    `updateProposalRegistry` — the W1-T240 single-writer, never a hand-rolled JSON write —
    idempotent by rule id, returning null and touching no disk when nothing needs drafting. The
    cadence must not add a second write path, loosen the threshold, or bypass the single writer.

    (iv) WHAT MUST NOT CHANGE — LAW 5, IN THE VERB'S OWN WORDS. `escalateRepeatingRules`'s doc:
    "This verb PROPOSES; it never files a task itself — the inbox's own tiering and the operator's
    ratification own the proposal's fate from here (auto-filing tasks from a metric is exactly the
    laundering shape Law 5 forbids)." A CADENCE MUST NOT BECOME A FILING PATH. Running the metric
    automatically is legitimate; letting the metric mint work without a human ratifying it is the
    laundering shape, and running it on a timer makes that step easier to add by accident, not
    harder. This task adds no filing step and its criteria pin that absence.

    (v) AND THE NO-NAKED-ZERO CLAUSE SURVIVES THE CADENCE. P48: an empty or all-unmeasurable table
    must render a refusal, "not a false '0% repeat-incident rate' headline over nothing measured."
    On a timer this matters more, not less: an unattended run that quietly emits a healthy-looking
    zero is worse than one nobody ran, because it manufactures the reassurance the instrument was
    built to withhold.

    (vi) NOT IN SCOPE. Changing any of the three reports' CONTENT or thresholds; the retro
    trigger's own thresholds; enabling the escalating form; and any change to
    `bodyContradictsDiff`-style gates or to CI. This task wires a cadence and its bound; it does
    not touch what the instruments say.

  acceptance:
