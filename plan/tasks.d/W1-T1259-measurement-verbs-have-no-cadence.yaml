  note: |
    NO PROOF GREPS THIS SHARD'S OWN PATH. All five criteria use the pure-path `unit test:` form
    naming `test/measurement-cadence.test.ts`, which is declared in `files:`. That file does not
    exist yet — a legitimate forward reference, because a PATH is safe to forward-reference where
    a SYMBOL NAME would be a guess, and the criteria state what must hold rather than naming
    internals a builder may place differently.

    `risk: high` IS RULE 19's SPAN, NOT THE BLAST RADIUS, AND IT WAS SET FROM THE LINTER RATHER
    THAN GUESSED. The `files:` list spans the daemon, policy data and a new test, which
    `sizingViolation` scores as more than one concern; decomposing a cadence from the bound that
    paces it would produce a task that cannot be safely built alone. The real radius is bounded by
    design (ii): the default form writes nothing.

    THE ID WAS PRE-MINTED BY THE OPERATOR AND READ BACK BEFORE ANYTHING WAS WRITTEN. Eight id
    surfaces were swept, each against a control pre-qualified for THAT surface, and the rule
    applied was to DISQUALIFY a surface whose own control read zero rather than report the
    target's zero. Shard filenames 0 against W1-T1254 at 1; plan `- id:` lines 0 against W1-T1254
    at 1; the reservation 1, which is the pre-mint, against a namespace of 292 refs; open PR
    titles 0 against 3 titles carrying a `W1-T` id; open PR head branches 0 against 3 `run-W1-T`
    heads; open PR file lists 0 with coverage at five captured of five enumerated, against
    `plan/tasks.d/` paths at 2; merged trailers 0 against 51 carrying any trailer; merged subjects
    0 against 51; merged `run-*` head credit 0 against 35 structured heads, with
    `run-W1-T1259-*` at 0 against an 84-branch `run-*` namespace. No surface had to be
    disqualified — every control read non-zero.

    ONE CONTROL ELSEWHERE DID FAIL AND WAS REPLACED RATHER THAN LEANED ON: the spend-detection
    query in rationale (4) was first controlled on `src/lib/auto-triage.ts`, which reads 0 for
    `budgetUsd`/`spawnWorker`/`costUsd` despite being the spending rung. A zero control licenses
    nothing, so it was re-qualified on files that do carry those symbols.

    THE SUBJECT SWEEP IS A COUNT PER HEAD AGAINST MAIN'S BASELINE, READ THROUGH GIT OBJECTS
    BECAUSE THE CONTENTS API CANNOT SEE THE FILE. `src/run-task.ts` exceeds GitHub's 1 MB contents
    cap and comes back with empty content that greps to a clean zero at every head including main
    — a silent zero that has already cost one sweep. Read through git objects instead, main and
    all five open heads read identically: `rule-efficacy` occurrences in `src/run-task.ts` 15,
    orchestrator references across `retro.ts`/`daemon.ts`/`sweep.ts` 0, and the control marker
    `evaluateRetroTrigger` in `daemon.ts` 2. No open head is adding a rung, and the control being
    non-zero and equal is what makes the middle column's zero a measurement. A first pass at this
    table was discarded outright: a shell `grep -c ... || echo 0` emitted two values on a zero
    match and broke the arithmetic, and `grep -c` counts LINES where the corrected reading counts
    OCCURRENCES — which is why the figure here is 15 rather than the 14 that shell pass printed.
