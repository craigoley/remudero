  design: |
    1. PLAN-ONLY REACH. When every changed path is under plan/, the author selection is:
       - `npm run lint-plan:fast`;
       - the suites that read a changed shard by path or by id;
       - the plan-integrity suites, i.e. those whose subject is loading or linting the plan itself.
       It is not every suite that happens to call `loadPlan`. The builder derives the integrity set from
       code (for example, the suites that import the plan linter or loader as their subject), never from a
       hand list. The receipt names the arm (`plan-only`) and its size.
    2. SIZE BY HOST CAPACITY, NO FIXED NUMBER. Before running, price the selection:
       - per-suite durations from scripts/test-tier-manifest.json (unknown files priced at the manifest
         median, never zero), over the concurrency the acquired test slot grants;
       - compared with a budget derived from the host as measured now: free cores and memory headroom
         from the same readers test-slot.ts uses, and the author step runtime `AUTHOR_STEP_RUNTIME_MS`.
       A selection that fits runs as today. One that does not still runs the static preflight and the
       census precheck, and prints `affected-tests: NOT RUN — CI is the check` with the priced cost, the
       budget and the inputs to both. It exits with a distinct status the receipt records
       (`selection: over-capacity`). It is never reported as green tests.
    3. Tiered, not a cliff. Between "fits" and "over capacity", the builder may run the narrow subset that
       fits, ordered by reach (changed tests first, then direct importers). The receipt then names what was
       skipped. No fixed suite count appears anywhere.
