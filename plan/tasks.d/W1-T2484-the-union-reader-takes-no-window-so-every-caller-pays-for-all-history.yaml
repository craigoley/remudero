    - claim: "a windowed read never opens an archive whose name sorts below the window start"
      proof: "unit test: test/a-windowed-union-never-opens-an-archive-outside-it.test.ts"
    - claim: "a windowed read still returns every matching row at or after the window start"
      proof: "unit test: test/a-windowed-union-never-opens-an-archive-outside-it.test.ts"
    - claim: "the live ledger is always read regardless of the window"
      proof: "unit test: test/a-windowed-union-never-opens-an-archive-outside-it.test.ts"
    - claim: "an archive skipped for being outside the window is not reported as unread coverage"
      proof: "unit test: test/a-windowed-union-never-opens-an-archive-outside-it.test.ts"
    - claim: "an archive that genuinely cannot be read is still reported as partial coverage"
      proof: "unit test: test/a-windowed-union-never-opens-an-archive-outside-it.test.ts"
    - claim: "the converted consumer reports the same rate over a windowed read as over a full one"
