  rationale: |
    READ at origin/main dd829e355 (2026-11-21).
    - buildSkillEffectivenessReport decides its merge comparison by point comparison
      (src/lib/skill-workshop.ts:1262-1269):
      - `not-better-than-control` retires a skill when its optimistic merge rate is at or below the control's rate;
      - `favorable-comparison` passes it when its rate is above the control's optimistic rate.
    - The knowledge gardener re-reads the report every pass, with no correction for repeated looks. Noise alone can therefore
      stage a retirement.
    - Harm (a one-sided Fisher test) and cost (a seeded bootstrap) already carry uncertainty; the merge comparison does not.
    - No sequential test exists in src: a search for mSPRT, SPRT, always-valid or confidence sequence finds nothing. The positive
      control, wilsonInterval in src/lib/model-drift.ts, is found.
    - Always-valid inference from the mixture sequential probability ratio test stays valid under continuous monitoring (Johari,
      Pekelis, Walsh, "Always Valid Inference: Continuous Monitoring of A/B Tests", arXiv 1512.04922) and runs in production A/B
      platforms.
    - The reviewer known-answer pass (W1-T12145) reuses this module to stop spending once a comparison is decided.
    SCOPE AMENDED for a seventh pinned suite (read at origin/main 77d91a0c2 against #20129's head a5f09565d):
    - test/learning/a-withheld-arm-is-drawn-per-task.test.ts (W1-T14137) pins the `pending-shipment` basis and builds
      ten-run comparisons that the confidence sequence leaves undecided. Design step 4 names this change for six suites;
      this is a seventh, and acceptance-author-gate refuses #20129 for it (canonical-task-scope-exceeded).
    - Only its fixtures and expected basis text change, as step 4 allows, and every test title stays verbatim. No
      criterion, proof or falsifier changes.
  design: |
    1. Add src/lib/sequential-test.ts, a pure module. It holds an mSPRT for a difference of two proportions with a normal mixing
       distribution, whose variance τ² is a declared constant. It returns:
       - the always-valid p-value, min(1, min over looks of 1/Λ);
       - the anytime-valid confidence sequence for the difference obtained by inverting it.
    2. In buildSkillEffectivenessReport, keep the identification bounds for pending runs and decide on the confidence sequence:
       - not-better-than-control: the upper bound of selected minus control (pending runs counted as merged for the selected arm)
         is below SKILL_MIN_MERGE_BENEFIT (0.02);
       - favorable-comparison: the lower bound (pending runs counted as unmerged for the selected arm) is above 0;
       - otherwise INSUFFICIENT EVIDENCE, with the basis `undecided`.
       Harm and cost rules and their order are unchanged.
    3. The report prints the bounds and the always-valid p-value beside the merge rates.
    4. Six existing suites pin point-comparison verdicts on 10 runs per arm. A builder measured 15 of their tests changing
       verdict under this rule, as intended: 8/10 against 3/10 no longer decides, and pending-shipment becomes undecided.
       Update only their fixtures and expected basis text, to sizes the confidence sequence decides (for example 9/10 against
       1/10), and keep every test title verbatim. Two of the titles are W1-T3413's proofs.

    INVARIANT peeking-is-safe: under the null, the share of simulated runs that ever read decided, with a look after every run, stays at or below α plus simulation error.
