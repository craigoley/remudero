      proof: "grep: W1-T14147 criterion 3: in test/learning/an-always-valid-test-decides-the-skill-merge-comparison.test.ts"
    - claim: "A skill clearly no better than its control still reads not-better-than-control, and the harm and cost rules decide as before"
      proof: "grep: W1-T14147 criterion 4: in test/learning/an-always-valid-test-decides-the-skill-merge-comparison.test.ts"
