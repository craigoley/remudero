    - claim: "an extensionless enumerated path is no less visible than it is today"
      proof: "unit test: test/count-arm-diffstat-token.test.ts"
    - claim: "the quotation guard is unchanged and a fenced example is still silenced"
      proof: "unit test: test/count-arm-diffstat-token.test.ts"
