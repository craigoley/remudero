    `risk: high` IS BLAST RADIUS. The count arm is part of a REQUIRED review gate; a change here
    decides whether correct PRs are blocked and whether false claims still land.

    THE BRIEF'S CHARACTERISATION IS NARROWED HERE RATHER THAN REPEATED. "It reproduces with an ASCII
    hyphen too" is not what the measurement shows: the hyphen is incidental. A narrative `--stat`
    tail does NOT reproduce, because its items carry whitespace and the enumeration group is
    whitespace-free by construction. What reproduces is a COMPACT token carrying a dot or a slash.
    Reporting the wider claim would have made the eventual fix chase the wrong variable.

    THE ORIGINAL INCIDENT IS THE OPERATOR'S AND IS ATTRIBUTED. The 2026-08-24 body that was failed
    on a true claim was not re-read from this host; what is re-derived here is the mechanism, every
    reproducing and non-reproducing shape, both prior fixtures, and the live false negative.

