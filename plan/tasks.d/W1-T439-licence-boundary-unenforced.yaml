  attempts: 0
  note: "verify:auto — nothing here needs an operator ruling. The licence VALUE being asserted is
    not chosen by this task; it is read from what the repository already is and what the merged
    2026-08-11 entry already recommends. Every genuinely open licence question is excluded by
    design (vi).
    risk:medium, NOT high, and the band is argued rather than defaulted: `subsystemsOf` reads
    `files:` plus acceptance text, and this task declares ONE path in ONE subsystem (`test/`) with
    criteria that name no second module — so the Rule 19 span is 1 and `sizingViolation` does not
    fire below high. Raising it to high would be cargo-culting W1-T438's band onto a task with a
    quarter of its surface.
    files: IS ONE PATH AND THAT IS THE POINT, not an oversight. Design (iii) forces a test-only
    implementation, and design (i) reads `LICENSE`, `package.json` and `README.md` at RUNTIME
    through the tree rather than importing them, so none of the three is edited and none belongs in
    `files:`. If an implementer finds they must touch `src/`, that is a signal the design was
    misread — the gate has no product-code seam and adding one would re-open the Rule 25 problem
    design (iii) exists to avoid.
    All four proofs name ONE forward-referenced PATH, never a symbol: a path forward-reference is
    safe and a symbol one is a guess, and a `grep:` proof naming an existing symbol would match the
    merge base as well as the head and be downgraded to a stale proof that discriminates nothing.
    Four criteria share that file deliberately — they are four distinct assertions the same suite
    must carry, and in the pure-path form the proof executes the whole file.
    budget_usd 55 — below a normal implement task because there is no design to discover and no
    product code to touch; the cost is the four falsifier directions, of which the third
    (an undeclared second licence file) is the one that actually needs care, since it must fail on
    a file that does not exist yet and pass on today's single one.
    THE MEASURED FIGURE IN THE RATIONALE SHOULD NOT BE QUOTED FORWARD — re-run the check-runs query
    against 7af9c798 rather than trusting 21-of-22, and note that sha is on a force-pushed branch
    so it is reachable by SHA but is no longer an ancestor of any open PR."
