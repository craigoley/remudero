  rationale: |
    OBSERVED, `journalctl --user -u remudero-gh-read-broker.service` on host remudero, 2026-10-21 19:50Z..19:53Z:
    "### RUN-TASK ERROR / Error: ENOENT: no such file or directory, mkdir
    '/home/craigoleyagent/.cache/remudero/gh-broker/cache' at mkdirSync (node:fs) at new GhReadBroker
    (src/lib/gh-read-broker.ts:409:5) … at ghBrokerCommand", from pids 1671490 and 1674616. The unit has no sandbox
    settings (`systemctl --user cat`: WorkingDirectory and ExecStart only). At 20:1xZ `~/.cache` exists, created
    19:55Z, and `~/.cache/remudero/gh-broker` exists; the broker is serving.
    READ at origin/main b49411212 (symbols, not lines): the `GhReadBroker` constructor calls
    `mkdirSync(join(dir, "cache"), { recursive: true, mode: 0o700 })`, and `serve` calls the same on `dir`. So the
    brief's "non-recursive mkdirSync" reading is REFUTED for the code at main: the call is recursive, and still threw
    ENOENT. Node's recursive mkdir returns ENOENT when a component is a dangling symlink or vanishes mid-walk; which
    one happened here is not known (INFERRED candidates; `~/.cache` was missing until 19:55Z).
    A recursive mkdir also applies `mode` only to the directories it creates, and `serve` then `chmodSync`s `dir` alone,
    so `~/.cache` and `~/.cache/remudero` get the process umask (OBSERVED now: `~/.cache` is 0775).
    NOT COVERED ELSEWHERE: W1-T10279 (merged) built the broker; W1-T10310 (merged) fixed its cache key. Swept
    origin/main plan/tasks.d and every open PR head's plan tree for GhReadBroker and gh-broker: no shard covers startup.
  design: |
    1. Reproduce first: a fixture cache root whose parent is (a) missing, (b) a dangling symlink, (c) removed between
       components. Record which one yields ENOENT from a recursive mkdir.
    2. Startup creates the cache root one component at a time below the account's home (or the cache-home override):
       each missing component is made with mode 0700; an existing component is kept as it is (never chmod a directory
       the broker did not create, such as `~/.cache`); a dangling symlink or a non-directory component is refused with
       a message naming that component and exit 2, never an unhandled ENOENT.
    3. The `serve` uid and 0700 checks on the broker's own directory are unchanged.
