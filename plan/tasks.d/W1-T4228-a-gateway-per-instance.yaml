- id: W1-T4228
  title: "ONLY CORE HAS A GATEWAY, SO THE CONSOLE CANNOT SEE THE SITE OR CONSOLE DAEMONS — #6546 designed ports 4318 and 4319 but no site or console serve container was ever launched; read each instance's gateway port from the registry, have the host installer keep one serve container per registered instance, and report a registered instance with no running gateway"
  repo: remudero
  depends_on: [W1-T4227]
  priority: 1
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 40.00
  risk: high
  band_meaning: span
  origin: "operator-request#projects-repos-onboarding-2026-09-23"
  plan_refs: ["W1-T4227", "W1-T4102"]
  files:
    - deploy/serve-container.sh
    - deploy/install-host-units.sh
  status: queued
  attempts: 0
  rationale: |
    MEASURED 2026-09-23 on the fleet host: one serve container (remudero-serve, 0.0.0.0:4317, "repo
    craigoley/remudero"); cloudflared routes console.remudero.com to it; no gateway exists for the site or
    console instances, so /v1/status for those daemons is unreachable from the console. serve-container.sh
    already accepts --instance and hard-codes 4317/4318/4319. The operator's goal 1 is to manage core, site
    and console independently in the console.
  design: |
    serve-container.sh --instance <name> takes its port from the W1-T4227 registry (the hard-coded map stays
    as a fallback when the registry lacks a gateway field). install-host-units.sh installs and converges one
    serve container per registered instance, with the W1-T4102 resource policy (a gateway's memory reserve
    is per container — size it from the measured serve RSS so three gateways fit the host). A registered
    instance whose gateway container is not running is reported by name. Tunnel hostnames are an operator
    step in Cloudflare and stay out of this task; the registry's `hostname` records them once made.
  acceptance:
    - claim: "an instance's gateway port comes from the registry"
      proof: "unit test: an instance's gateway port comes from the registry"
    - claim: "the host installer converges one gateway per registered instance"
      proof: "unit test: the host installer converges one gateway per registered instance"
    - claim: "a registered instance with no running gateway is reported by name"
      proof: "unit test: a registered instance with no running gateway is reported by name"
