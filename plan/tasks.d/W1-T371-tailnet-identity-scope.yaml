    budget_usd 80 — an auth branch, an allowlist decision, a two-direction falsifier over interface
    and node identity, plus the documentation verification design (v) requires before any Funnel
    reasoning is written down.
    files: DECLARES test/service.test.ts because the fourth criterion asserts the existing scope
    boundary still holds and the worker will extend that suite; it also declares src/lib/serve.ts
    because that file holds the only real createService call site and must pass any new option.
    Omitting a written path is what refused five dispatches in one week.
    ON THE PROOFS. Three of the four name test/tailnet-identity-scope.test.ts, which does not exist
    yet: `rmd check-proof` reports 0 candidates for it today. That is a FORWARD REFERENCE TO A PATH,
    which CLAUDE.md records as safe — unlike forward-referencing a symbol name, which is a guess — and
    the path is declared in files: so the worker creates it. The fourth criterion deliberately names
    an EXISTING suite so at least one proof executes at filing time. It is a GUARD criterion and it
    passes at the merge-base BY DESIGN: its claim is that the boundary was not weakened, a property
    that must hold both before and after. `unit test:` proofs are structurally exempt from the
    executed_stale downgrade (review.ts records that they never produce that outcome), which applies
    to `grep:` proofs only. No `grep:` proof is used here, so the line-based and basic-regex traps
    that cost a filer two attempts yesterday do not arise."
