  design: |
    Record this caller's existing real worker results at their owning boundary; make no extra
    model/provider request and change no judgment, retry, mount, prompt, permission or budget.
    Prefer one bounded, explicitly owned monetary receipt per actual spawn attempt, not a
    shared accumulator reused across judgments. Reuse benchmarkWorkerAttemptResources and the
    existing worker accounting/attribution helpers rather than promoting numeric placeholders.
    Preserve provider, billing mode, reported monetary price and distinct notional price.
    An absent result, unavailable price, Codex zero placeholder, no-spawn/cache path, admission
    refusal or throw without measured usage stays explicit unknown/not-started, never measured
    free or a fabricated successful zero. A genuinely reported zero remains distinguishable.

    Successful, malformed/retried, failed and interrupted attempts must retain what was actually
    reported without changing the returned ruling or whether later attempts run. Emit a dedicated
    machine-judge producer identity if no semantically appropriate existing producer owns it;
    do not emit a synthetic risk_judge.decision implying the dispatch orchestrator ran. Register
    the real cost-bearing step in the canonical spend and ledger-step inventories. Preserve
    exact assignment/run/task and bounded gardener parent attribution in the private ledger.
    No prompts, result text, child environments, credentials or unbounded labels enter this row.
    Retain log-before-result ordering needed to account a paid malformed attempt, and prevent
    instrumentation failure from replacing the actual judgment outcome.

    The collector continues using its existing ONE union scan and exact parent/scope/fingerprint
    controls. Count each owned producer once across plain/gzip/live overlap. Assignment/attempt
    restatements and terminal verdicts cannot add a second dollar. Do not infer old parentage,
    turn known-priced subtotal into a complete total, relabel subscription notional as invoices,
    change existing producer totals, or make request-time HTTP reads scan ledgers. Existing
    call-coverage counts and the 64-KiB/identity/garden bounds remain unchanged.

    Tests must drive productionMachineFilingJudgePorts with the real default judgment composition
    and private default ledger writer/collector; fake only the provider result, never make a
    live paid call. Include multiple consecutive judgments and malformed retries to expose a
    cumulative shared-collector bug, failed and unstarted attempts, API/subscription/unknown
    billing, real zero versus unknown, replay and wrong-parent/generation controls. Remove only
    the new producer forwarding: calls still exist but the monetary join must fail. Promoting
    worker.attempt globally must fail the no-double-count control. Restore source and require
    real physical/TAP, caller/census, same-head instrumented diff coverage, full native author,
    stored canonical acceptance, governed review and current-head CI before normal merge.
    Verify source merge, loaded adoption, fresh cached API and signed-in UI separately; no
    service recycle, safety/limit changes, gardener activation or deployment is authorized here.
