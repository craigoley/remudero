    - claim: "A change under .github/, openapi/ (other than the contract file) or packages/ (other than the contract file) still forces the full run, as today"
      proof: "grep: W1-T12506 criterion 4 in test/ci/a-change-to-a-test-helper-a-remudero-file-or-a-hook-selects-the-suites-that-read-it.test.ts"
  rationale: |
    A change to a test helper, a .remudero file or a git hook runs every suite on the author path, although the selector can
    already find the suites that import or name such a file.
    READ at origin/main 6cf453f7a, src/lib/affected-suites.ts:
    - :104 MODELLED is `^(?:src|scripts|bin|test|docs|doctrine|plan)\/|^[^/]+\.md$`. .remudero/ and hooks/ are not in it, so
      `fullRunTrigger` (:112-119) forces a full run for them.
    - :117 a test/ file that is not a suite (`SUITE`, :100) forces a full run, so every test/helpers/ edit does.
    - :852 `readAffectedSuitesInput` already lists every tracked file under test/ with its content (TRACKED_CODE_ARGS, :868),
      so the import graph sees test/helpers/ files and the suites that import them. scripts/preflight-author.mjs:168
      `fullFallbackPartialSet` (W1-T9953) already walks those importers, but only to cut a run that is still labelled a full run.
    MEASURED by the operator session over about four days: of 22 author full fallbacks, 3 named a test/helpers/ file,
    2 a .remudero/ file and 1 hooks/. The Azure lane log on 2026-11-13 holds "full run: test/helpers/registry-shell-fixture.ts
    is outside what the selector models". On origin/main 75 files are tracked under test/helpers/, 130 suites name .remudero
    and 95 name hooks/.
    CHECKED for overlap: W1-T11916 (queued) adds suites that walk the source tree at run time; it does not model these paths.
    W1-T9922 (blocked) is about plan-only diffs. No open pull request files a task on this subject.
  design: |
    1. MODELLED gains `.remudero/` and `hooks/`. A non-suite code file under `test/helpers/` is modelled as code: the import
       graph (`buildAffectedSuitesGraph`) selects its importers. Other non-suite test/ files keep today's rule.
    2. For .remudero/ and hooks/ files, select suites by the named-path arm the selector already has (a suite whose text names
       the changed path), and by `readMapReaders` when the read map is usable (W1-T12505 supplies it; without it, the named-path
       arm alone).
    3. When a modelled path in this set has no reader at all, keep the full-run trigger, with a reason that says so. An empty
       reader set never becomes an empty selection.
    4. .github/, openapi/ and packages/ keep their full-run rule.
    5. Update the doctrine sentence that lists fixture and helper changes as full fallbacks.
    NO-INVARIANTS: this widens what the selector models; the unchanged full-run rule for paths with no reader is criterion 3.
    NOT IN SCOPE: the read map producer (W1-T12505); CI's own selection rules, which call the same selector and gain the same
    modelling only where ci.yml already uses the narrow arm.
  falsifier: |
    Leave test/helpers/ files unmodelled and criterion 1 must fail. Return an empty selection for a hook with no reader and
    criterion 3 must fail. Model .github/ too and criterion 4 must fail. Restore and require all four to pass.
  note: |
    Id W1-T12506 reserved for run-unfiled-1794582098000 with ~/rmd-work/bin/reserve-id.sh.
