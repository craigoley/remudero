  attempts: 0
  rationale: |
    MEASURED by running `cashCanServeToolSurface` over every declared tool surface in the tree
    (2026-09-17, during the live squeeze):

        TRIAGE_WORKER_TOOLS   REFUSED   [Read, Write, Edit, Grep, Glob, WebSearch]

    and, dropping each entry in turn, exactly one flips the answer:

        dropping WebSearch alone makes triage DIVERTABLE

    Every other tool it names is already implemented by the check-runner. So triage — unlike the
    fix, review and judge lanes repaired this session — is not blocked by anything structural. It
    is blocked by ONE entry in its list.

    THIS IS A DECISION, NOT A TYPO, WHICH IS WHY IT IS FILED RATHER THAN PATCHED. There are three
    honest answers and the task is to pick one on evidence:

      (a) TRIAGE GENUINELY NEEDS THE NETWORK. Then the lane stays subscription-only and this shard
          closes as `wont-fix` with the reason recorded — which is itself worth having, because
          right now nothing says WHY triage cannot divert.
      (b) TRIAGE NEEDS IT ONLY SOMETIMES. Then the divert surface drops WebSearch and a diverted
          triage runs degraded, which requires the prompt to SAY SO (the W1-T3696 coherence rule:
          a surface may only be offered where the prompt already matches it).
      (c) TRIAGE DOES NOT ACTUALLY USE IT. Then the Claude bound should lose it too.
          `WorkerResult.permissionDenials` is the evidence channel — a lane that never asks for a
          tool it is granted is the falsifier, and it needs no new code.

    START AT (c), because it is free to measure and the other two are guesses until it is answered.

    DO NOT SOLVE THIS BY ADDING WebSearch TO OPENWEIGHT_FUNCTIONS. W1-T210 bounded the fix rung
    specifically so an untrusted prompt payload could not reach the network, and triage reads
    UNTRUSTED INBOUND TEXT — it is the single lane where granting a cheap model web access is least
    defensible.

    FILES NOTE (W1-T3730): `files:` omits the test file the build will add, the only way past
    `lint-plan`'s `proof-unit-test-unresolvable` on a plan-only filing. The build must add it.

