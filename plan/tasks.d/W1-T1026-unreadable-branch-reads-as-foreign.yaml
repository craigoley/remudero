    - claim: "the run's own branch is still credited when the head ref reads correctly"
      proof: "unit test: W1-T1026: the run's own branch is still recognised as owned"
    - claim: "the unreadable path is exercised against a reader that fails the way the live transport fails"
      proof: "unit test: W1-T1026: the unreadable path is driven by a throwing reader"
