  rationale: |
    MEASURED 2026-09-30 (docs/recon/openweight-inbox-draft-trial.md, W1-T3570): cash gpt-5-nano, 09-16..09-30, 3,311
    syntheses, 1,392 relints, 200 terminal drafts, 49 lint-clean; 46 dirty drafts were YAML that failed to parse. The
    lane retries the same model until attempts are spent. #7963 moves the lead to gpt-6-luna, but any model's parse
    failure still costs a full retry cycle on that model.
  design: |
    (i) After a dirty relint, the next synthesis walks to the next candidate in the lane's ladder rather than the
    same model, recording inbox.draft_fellthrough {from, to, violations}. (ii) The draft is requested as structured
    data (a JSON schema for the fragment's fields) and rendered to YAML by the harness, so a parse failure cannot
    come from the model's formatting.
