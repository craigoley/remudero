  principles: {tdd: strict}
  budget_usd: 4.00
  risk: medium  # Rule 19: one concern, the ci-learning filer's record verdict runs the shared admission guard; the landing bridge, the shard text and admission itself are unchanged
  band_meaning: span
  origin: 'coordinator brief batch1017b item 2, design (a): the filer runs machineShardFilingRefusal before writing'
  plan_refs: [W1-T10027, W1-T7954, W1-T9450, W1-T8523, W1-T5995]
  files:
    - src/lib/measurement-cadence.ts
    - test/a-ci-learning-filing-passes-lint-plan-admission-before-it-is-staged.test.ts
