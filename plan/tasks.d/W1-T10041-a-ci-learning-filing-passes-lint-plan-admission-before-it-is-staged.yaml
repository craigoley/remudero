- id: W1-T10041
  title: "A CI-LEARNING FILING PASSES LINT-PLAN'S MACHINE-FILING ADMISSION BEFORE IT IS STAGED — the filer checks a record with lintTask alone, so a record lint-plan --base refuses is still written and lands as a red PR (#12290 on 2026-10-16, #12569 on 2026-10-17); with W1-T10027 making admission accept the lesson's own new file, the filer must run the same admission so the next mismatch is refused before any PR exists"
  repo: remudero
