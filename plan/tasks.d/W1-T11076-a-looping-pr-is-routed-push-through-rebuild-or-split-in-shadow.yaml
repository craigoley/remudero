  rationale: |
    Operator, 2026-11-01: "find way to innovate and improve this process ... instead of escalating, either push it through and file follow up tasks to fix things, or close it and submit a task to re-implement it the right way or break it down into multiple smaller tasks".
    OBSERVED, operator recon 2026-11-01 (2026-10-25 to 11-01):
    - In 266 of codex's 277 review fails (96 percent), every unmet criterion's proof had executed and passed; the fail was a semantic downgrade. Claude: 30 of 39.
    - Of 216 consecutive same-claim fails, 74 percent cited a different defect the second time. The pass chance of the next review falls with each same-claim fail: 42, 32, 27, 29 percent.
    - All 241 reviewer-unmet dispatches logged strike 1 of 2; nothing bounded the rounds (#14793: 37 rounds and 180M tokens; #15845: 20 rounds and 130M).
    - Replay (INFERRED, regex over truncated reasons): 77 PRs reach this decision point and then spent 1,176M tokens and 305 fix rounds. Push-through would have applied to 25 (22 merged anyway) and saved about 208M net of follow-up builds; split to 9, about 358M; close-and-rebuild to 43, cost-neutral in tokens but ending stalls.
    This task is the measurement half; W1-T11077 acts on rebuild and split, and push-through waits for a separate operator ruling on the merge gate.
