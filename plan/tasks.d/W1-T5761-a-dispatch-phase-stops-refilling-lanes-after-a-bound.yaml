- id: W1-T5761
  title: "A DISPATCH PHASE STOPS REFILLING LANES AFTER A BOUND — W1-T4416's lane refill keeps one daemon tick alive as long as some lane frees and a runnable task exists, so the 22:05Z boot on 2026-10-04 ran ONE daemon.tick for 89 min (refills 22:14, 22:37, 22:52, 22:54Z) and every top-of-tick read went stale: the retriggered full sweeps reused the 22:08 tick-read snapshot and acted on dead heads (#9188)"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — how long one dispatch phase may hold the daemon tick
  band_meaning: blast-radius
  origin: "operator session 2026-10-04: watch log 23:29Z (one tick lasting 70+ min), stale-head diagnosis #9188"
  plan_refs: [W1-T4416, W1-T5083, W1-T5366, W1-T5720, W1-T5345, W1-T1044]
  files: [src/lib/daemon.ts, test/a-dispatch-phase-stops-refilling-lanes-after-a-bound.test.ts]
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    READ 2026-10-05 on origin/main 9c38366f. In src/lib/daemon.ts the dispatch phase settles its
    admitted lanes and `refillLane` hands a freed lane the next disjoint runnable task through the
    same gates (W1-T4416/W1-T5083); refill closes only on a rejection, blocked_transient, max, STOP,
    PAUSE, a stale-code freshness decision or a governor. Nothing closes it on the phase's age, so the
    tick never returns to its top while work keeps arriving. MEASURED from the fleet ledger
    (DAEMON-1791151532775): `daemon.tick` 22:05:48Z, then no other tick until the 23:35:02Z boot;
    `dispatch.lane_refilled` 22:14:29, 22:37:58, 22:52:53, 22:54:11; `lane_refill_held: stale code`
    23:00:44 after the 22:56:55 restart decision; drain 23:24:29-23:34:21. Across 10-02..10-04, 39 of
    160 ticks lasted 30 min or more and held 3,442 of 4,100 tick-minutes (84%); the longest ran
    309 min (10-03 09:42Z). Everything the loop does once per tick waits behind that:
    `refreshMergedAsync` publishes the tick-read generation only at the top, so #9188 (merged
    00:01Z 10-05) had to stop retriggered sweeps reusing it, and `refreshMerged` during a refill
    still answers from that generation's projection.
  design: |
    Refill closes once the phase is older than a named BACKSTOP bound (e.g.
    `DISPATCH_PHASE_REFILL_BOUND_MS`, sized from the measured run length; 20 min is the starting
    point), logging `dispatch.lane_refill_held` with reason `phase bound` and the phase age. Lanes
    already in flight finish as today; the tick then ends and the next tick's top runs (freshness,
    tick read, cadences) before admitting again, so a busy fleet still dispatches every tick.
  acceptance:
    - claim: "with a fake clock and lanes that free every few minutes, refill hands out tasks until the phase is older than the bound, then holds with reason phase bound and the tick returns once the in-flight lanes settle"
      proof: "unit test: test/a-dispatch-phase-stops-refilling-lanes-after-a-bound.test.ts"
  falsifier: |
    Remove the age check: the fake lanes keep refilling past the bound, the tick never returns
    inside the test window, and the test fails.
