  rationale: |
    OBSERVED 2026-11-04T01:56Z to 2026-11-11T01:56Z in the ledger of the core instance: a start does its reads one after another, and the read that the first review needs is the last.
    - 45 starts. Median times, in order: 87 s for the lifetime history, 18 s for the claim sweep, 22 s from `daemon.start` to `daemon.boot`, 49 s from `daemon.boot` to the first `daemon.tick`, and then 84 s from that tick to `daemon.sweep.started`.
    - The 84 s are the first tick read. In the newest start it was 146 s: the worker thread started at 01:39:47, the board fetch ended at 01:40:27, and the sweep started at 01:42:04.
    - The read needs the token and the plan. It does not need the lifetime history, the daemon lock, the adoption or the boot sweeps.
    - The token mint took 0.1 s and the plan load a median of 4.5 s.
    READ at origin/main 17745c6bf.
    - `daemonCommand` builds the read plane after `daemonBoot`: `startTickReadWorker` and `planReaders.tickRead(readPlane.read)` (src/cli/commands/daemon.ts, lines 1690 to 1705).
    - The first tick awaits `deps.refreshMergedAsync(planForBatch)` (src/lib/daemon.ts:6666) before it starts the boot review (line 6708) and the sweep.
    - The token mint is awaited at src/cli/commands/daemon.ts:961 and the plan load at line 1003.
    NOT ESTABLISHED: how much of the 84 s the overlap saves on a host with a load average of 20 to 30 on 8 cores. The reads compete for a processor. The estimate is 60 to 140 s for each start.
    CHECKED for overlap: W1-T12236 gives the boot review the views of this read; this task depends on it. W1-T12235 and W1-T12238 shorten two of the steps that this read would run beside. W1-T9909 (merged) is about a daemon whose start fails: it must release what it started, and criterion 5 keeps that rule for the new worker.
  design: |
    In `daemonCommand`:
    - After the plan load, and after the dry-run return, build the read plane and call its read once. Keep the promise as `firstTickRead`.
    - Do not await it on the path to `daemon.start`.
    - Register the worker in the cleanup list at once, so that a refused lock, a STOP and a failed start close it.
    In `runDaemon`:
    - The first call of `refreshMergedAsync` awaits `firstTickRead` and uses its result, if the plan binding is the one the read was made for. In every other case it reads as today.
    - A rejected `firstTickRead` is not an error of the start: write one row and read as today.
    The read publishes its time. W1-T12236 uses a read only when it was published after the tick started. For the first tick, count the early read as the read of that tick: it is the newest read that exists, and a review still checks the head before it posts.
    Add `first_tick_read_ms` and `first_tick_read_overlap_ms` to the row that reports the first tick, so that the saving is measured.
    The row that reports the first tick read is `daemon.first_tick_read`, written once for each start, after the first tick has its read. Its `source` is `early` (the early read was used), `plan_changed`, `early_failed` (with `reason`) or `early_stale`. `first_tick_read_ms` is the time the first tick waited for its read. `first_tick_read_overlap_ms` is the time the early read ran before the first tick asked for it.
    An early read older than the tick read age bound (`freshReadGeneration`) is not used: a start held by PAUSE must not take a read from before the hold.
    A loop that ends before its first read gets no early read: a start with `--max 0`, or a start under STOP. The read plane is still built and the cleanup still closes it. Most daemon command tests start with `--max 0` and a loop that never reads, so they start no worker and make no GitHub read, as before.
    The cleanup list starts after the lock. So `daemonCommand` also stops the read plane in the finally that closes the lifetime history, and when the lifetime history read throws, unless the cleanup list already stopped it.
    The read plane now starts before the daemon lock, the event wake and the git credential socket. So in `test/a-daemon-whose-boot-fails-releases-its-watchers-and-exits.test.ts` a start that fails in `startReadPlane` has acquired nothing yet, and a start that fails in `wireSweepWake` or `startGitCredentialSocket` releases the read plane too. That test changes its expected releases for those three cases and nothing else.
    NOT IN SCOPE: the content of the tick read, a second early read, and the git credential socket.
  falsifier: |
    Build the read plane after `daemonBoot` again and criterion 1 must fail. Let the first tick ask for a second read and criterion 2 must fail. Leave the worker open after a refused lock and criterion 5 must fail. Restore and require all seven to pass.
  note: |
    After the merge, the time from the first `daemon.tick` to `daemon.sweep.started` is the measure. The median was 84 s over 45 starts.
