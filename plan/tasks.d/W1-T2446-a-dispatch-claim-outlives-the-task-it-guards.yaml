  rationale: |
    THE ID. Eight surfaces swept at base 0cbfdc47, anchored `W1-T2446([^0-9]|$)` with a `[0-9]`
    class and never `\d`. SURFACE 1 READS 1: `refs/rmd-id/W1-T2446` against 559 refs, control
