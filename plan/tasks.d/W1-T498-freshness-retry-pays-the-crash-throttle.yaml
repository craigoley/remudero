  note: "`risk: high` IS SET UP FRONT. `files:` spans TWO subsystems — `deploy/` and `test/` — and
    `sizingViolation` (`src/lib/task-linter.ts`) blocks at >=2 below that band. The band is Rule 19's
    SPAN, not blast radius; the blast radius is one new variable and ONE changed `sleep` line.
    **`files:` WAS DERIVED BY INVOCATION COUNT, NOT PROSE MENTION**, measured on `origin/main`:
    `deploy/entrypoint.sh` scores `RESTART_THROTTLE_S` **10** and `FRESHNESS_RESTART` **8** — highest
    on both, and it is the file that changes; `test/entrypoint-boot.test.ts` scores **16** and **1** —
    the highest `RESTART_THROTTLE_S` count of any file and the home of every existing throttle test.
    `deploy/host-update.sh` scores **3** and `test/host-update-reclaim.test.ts` **1**; both are
    DELIBERATELY NOT DECLARED per design (vi), because the new variable defaults and needs no
    plumbing. `src/lib/daemon.ts` scores **0** on both and is not declared — the exit code it owns
    already shipped. `src/run-task.ts` is NOT declared and must not be: nothing here touches it, and
    every task naming it serialises against every other that does.
    **THIS SHARD'S OWN PATH IS DELIBERATELY ABSENT FROM `files:`** — adding it converts the
    `proof-scope` warnings into a HARD `rule15-filing` violation.
    **THE ACCEPTANCE PROOFS ARE NAME-FILTERED, NOT PURE PATHS, AND THAT IS THE MOST LOAD-BEARING
    DECISION IN THIS FILING.** A pure `unit test: test/entrypoint-boot.test.ts` runs the file WHOLE,
    and that file currently fails two tests whenever `RMD_RESTART_THROTTLE_S` is present in the
    inherited environment — which would fail EVERY criterion of this shard for a reason unrelated to
    it. **THAT IS EXACTLY HOW #1830 DIED, TWICE.** The four titles above are forward references the
    implementer must create verbatim; each was checked to match **0** files on `origin/main` today
    (positive control on the same query: the existing title `an exit 0 is NEVER throttled` matches
