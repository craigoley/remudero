    EVERY NUMBER HERE IS AZURE-ONLY AND DATED 2026-08-14: the 16 freshness restarts, the 60 merges,
    the 25.6s boot median, the 20,236-row union, and the image build stamp. RE-DERIVE BEFORE BUILDING
    — and note that an image build closes none of this, it only makes #1825 live so that this change
