    - claim: "an unreadable branch read leaves the breaker deciding on the local count alone, so a network failure never changes a dispatch decision"
      proof: "unit test: test/breaker-reset-corroborated.test.ts"
    - claim: "the lifetime cap still refuses a task over its ceiling even when a corroborating branch exists"
      proof: "unit test: test/breaker-reset-corroborated.test.ts"
