  note: |
    verify:human IS THE POINT OF THIS SHARD, not a hedge. The fourth criterion names a live launchd
    restart, which `headlessFitnessViolations` flags on any `verify: auto` task and rightly so — a
    headless worker has no operator and no loaded unit. The plan's own remedy for that flag is
    "move to verify:human", and the drill precedents (W1-T147, W1-T214, W1-T12e) all sit there.
    The first three criteria ARE headless and are what the worker actually builds; the human step
    is running the live half once and recording what it showed.
    `depends_on: [W1-T924, W1-T925]` — drilling the invariant before the invariant exists would
    document today's defect at some length and prove nothing. No file overlap with either, so this
    serialises on the DAG only.
    risk:high is Rule 19's SPAN: `files:` crosses `scripts/`, `test/` and `docs/`, and the
    acceptance text hits the `daemon` and `launchd` tags. Raised up front.
    `scripts/recovery-drill.mjs` IS NOT DECLARED and must not be edited: it drills the deploy
    ROLLBACK path and is a working artifact of its own. It is the MODEL for the fixture shape, not
    a host for a second drill — `inverseScopeUntouchedFiles` and the single-concern rule both point
    the same way.
    THE PROOF IS A FORWARD REFERENCE TO A PATH, never to a symbol or a test title: the file does
    not exist yet, a path parses now and executes once it does, and a grep proof naming an existing
    symbol would match the merge base too and be downgraded to `executed_stale` (the W1-T443
    lesson).
    NOTHING HERE SHOULD BE QUOTED FORWARD AS CURRENT: the five hand-cleared PRs, the ~16:09Z
    2026-07-24 loop and `LastExitStatus=256` are the FEEDBACK's observations from the mini on
    2026-07-23/24, and the drill exists precisely to replace them with observations somebody chose
    to make.
