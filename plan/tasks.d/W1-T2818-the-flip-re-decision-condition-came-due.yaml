      proof: "grep: THE CONDITION IS DUE AND NOBODY HAS MEASURED IT in plan/tasks.d/W1-T2818-the-flip-re-decision-condition-came-due.yaml"
    - claim: "the measurement is taken over corpora that do not share a failure mode, each with a control"
      proof: "grep: ZERO USES ACROSS THREE INDEPENDENT CORPORA in plan/tasks.d/W1-T2818-the-flip-re-decision-condition-came-due.yaml"
    - claim: "the shard records that the marker suppression path has never been exercised, so the channel working is an assumption"
      proof: "grep: THE SUPPRESSION BRANCH HAS NEVER RUN UNDER TEST in plan/tasks.d/W1-T2818-the-flip-re-decision-condition-came-due.yaml"
    - claim: "the shard states both readings of zero adoption and declines to choose between them"
      proof: "grep: ZERO ADOPTION READS BOTH WAYS AND THIS SHARD PICKS NEITHER in plan/tasks.d/W1-T2818-the-flip-re-decision-condition-came-due.yaml"
    - claim: "the shard changes nothing about whether the advisory blocks"
      proof: "grep: THE ADVISORY STAYS ADVISORY UNTIL THE OPERATOR SAYS OTHERWISE in plan/tasks.d/W1-T2818-the-flip-re-decision-condition-came-due.yaml"
