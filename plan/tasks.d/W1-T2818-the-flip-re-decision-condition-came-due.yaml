- id: W1-T2818
  title: "THE OPERATOR SET A RE-DECISION CONDITION ON THE UNWIRED-EXPORT FLIP AND IT HAS COME DUE UNMEASURED — the 2026-08-27 ruling deferred the flip because the advisory had been invisible before PR 3021, and said the flip is re-decided on whether marker usage appears after that change; nine days on the advisory has fired on ten PRs and marker usage is exactly zero"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: medium
  budget_usd: 10.00
  rationale: |
    **THE CONDITION IS DUE AND NOBODY HAS MEASURED IT.** W1-T323's 2026-08-27 ruling deferred
    flipping the unwired-export advisory to blocking, on the express ground that authors could not
    see it: "PR 3021 rendered the unwired_export advisory into the PR comment... Before those, an
    author could satisfy every gate without ever seeing the advisory that asks for the marker. The
    flip is re-decided on whether marker usage appears AFTER that change." PR 3021 merged
    2026-08-26. This shard supplies the measurement that ruling asked for and nothing else.

    **ZERO USES ACROSS THREE INDEPENDENT CORPORA.** Marker usage after the change is zero, measured
    three ways that do not share a failure mode. (1) All 3105 commit messages on origin/main:
    WIRED_AT_RE matches 0 and SHIPS_UNWIRED_RE matches 0, against a control of 932 messages carrying
    an anchored Remudero-Task trailer across the whole range, and one literal WIRED-AT occurrence
    which is the feature's own landing commit describing the mechanism. (2) The 400 newest PR
    bodies, the exact corpus the reader scans: 0 match, against controls of 249 trailers, 311
    acceptance headers and 400 non-empty bodies read by the same scanner. (3) 862 PR comments:
    0, against 11 rendered advisories. The regex was proved live to match a real marker and to
    reject the angle-bracket doc template, so the three tree occurrences are templates, not uses.

    **AND THE ADVISORY DID FIRE, SO THE ZERO IS NOT FOR WANT OF OCCASION.** Over 2026-09-01 to
    2026-09-04 the rendered advisory appeared on 11 comments across 10 distinct PRs, 9 of which
    merged. Sibling calibration in the same corpus: scope_violation 138 PRs, inverse_scope 79,
    rubric 190. One author read the rendered advisory and acted on it (#3887) by wiring the symbol
    rather than declaring it — a deliberate decline of the channel, not a miss.

    **THE COUNT IS A FALSE-ZERO TRAP AND THAT IS WORTH RECORDING SEPARATELY.** The producer's reason
    code `unwired_export` and the rendered section header share no string: over the same 862
    comments the reason code reads 0 while the header reads 11. Anyone re-deriving this by grepping
    the reason code where the prose appears gets a clean, silent zero.
  design: |
    **THE SUPPRESSION BRANCH HAS NEVER RUN UNDER TEST.** WIRED_AT_RE has exactly one application in
    the repo, `wiredAtPairs`, reached only from `unwiredAdvisoriesFor` and given `evidence.report` —
    the PR body. No test file anywhere contains a string that regex would match, against a control
    of 5 sibling SHIPS-UNWIRED marker strings across 2 test files. So `wiredAtPairs` has never
    returned a non-empty set under test, and "a correctly written marker suppresses the advisory" is
    an assumption, not a covered behaviour. That matters to the ruling directly: zero adoption is
    weaker evidence if the channel was never proved to work.

    **A SECOND, SEPARABLE DEFECT FOUND WHILE MEASURING.** `unwiredAdvisoriesFor` reads
    `evidence.report` without consulting `reportIsSubstitute`, unlike two sibling consumers 17 and
    44 lines above it in the same function. When the body was never fetched, a real marker is
    invisible and the advisory fires anyway. Recorded here because it was found here; whether it
    belongs to the substitute-body contract rather than to W1-T322's is an open question below.

    **ZERO ADOPTION READS BOTH WAYS AND THIS SHARD PICKS NEITHER.** The ruling set the condition but
    not what each answer implies, and the result is genuinely ambiguous. It reads as "the sanctioned
    escape is available, visible, and nobody needs it, so the flip is safe"; it reads equally as
    "authors do not use the channel even when they see it, so a blocking gate would strand real work
    on a declaration nobody writes". The #3887 evidence cuts the second way. Settling that is the
    operator's, which is why this shard is verify:human, as W1-T323 and W1-T1120 both are.

    **THE DENOMINATOR IS STILL QUESTION ONE.** W1-T1120 says settling which rows count precedes
    everything, and it is still unsettled. This window offers three readings of the same 10 flagged
    PRs: 10 of 400 created (2.5%), 10 of 486 receiving any comment (2.1%), or 10 flagged with 0
    declared. This shard records all three rather than choosing, because choosing one is the
    adjudication W1-T1120 parked.

    **THE ADVISORY STAYS ADVISORY UNTIL THE OPERATOR SAYS OTHERWISE.** `unwiredAdvisories` appears
    in judgeReview only at its creation and its attachment to the verdict, never inside the `state`
    or `floorState` expressions — verified against a control symbol that DOES appear inside both, so
    the grep finds a fold when one exists. Nothing in this shard moves it. Flipping it would turn a
    heuristic firing on ~2.5% of PRs into a hard FAIL on roughly ten PRs every four days, nine of
    which merged fine, and would preempt an adjudication that is verify:human precisely so no lane
    can take it.

    **NOT IN SCOPE.** W1-T322's contract — the scan, the markers, the window, the threshold — is
    closed to this shard; renegotiating any of them is a new filing, and W1-T323's own design says
    so. The 2026-08-27 rulings stand as quoted and are not revised here. The retention registration
    of `review.unwired_advisory` stays as it is.
  acceptance:
