  note: |
    EVERY COUNT HERE IS A QUERY AND NOT A NUMBER TO CARRY. The 3105 commits, the 932-trailer
    control, the 10 flagged PRs and the three denominators all move with the tree and the window.
    Re-run them before acting; a figure quoted forward from this shard is a claim about the past.

    THE LEDGER WAS NOT USED AND THE REASON IS RECORDED. state/ is gitignored and absent off-host, so
    all three rotation glob forms return zero FILES — a ledger-derived count here would have been
    vacuous rather than small. The three corpora above are host-independent for that reason.

    WHAT THIS SHARD IS NOT. It is not the flip (W1-T323), not the denominator ruling (W1-T1120), and
    not a renegotiation of W1-T322's scan. It supplies one measurement a standing ruling asked for
    and parks the decision with the person who set the condition.
