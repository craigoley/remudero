  rationale: |
    OBSERVED on the fleet host 2026-11-18 (read-only, by the host lane): #19390 moved .nvmrc to 24.22.3 at 14:17Z.
    Every units converge since 14:20:16Z logged "E: Held packages were changed and -y was used without
    --allow-change-held-packages", then "host-node: apt-get install failed for 24.22.3-1nodesource1; staying on
    24.22.2, retried next converge". nodejs had been held by hand on 2026-11-15 15:15Z, right after a hand
    `apt-get install -y --allow-downgrades nodejs=24.22.2-1nodesource1` moved it DOWN from 24.22.3. apt-cache policy
    lists 24.22.3 as the candidate. unattended-upgrades is on and does not blacklist nodejs. Every full author preflight
    on the host refused "Node 24.22.3 required; got 24.22.2".
    INFERRED: unattended-upgrades took NodeSource's 24.22.3 while .nvmrc still pinned 24.22.2 (#16732, 2026-11-04 to
    2026-11-18), so the preflight refused the other way, and the hand downgrade and hold were the workaround.
    READ at origin/main 0888a2c: converge_host_node in deploy/install-host-units.sh installs with
    `apt-get install -y nodejs=<pin>-1nodesource1`, which a hold refuses and which cannot downgrade. It reports each
    failure and returns 0, so units still install. Nothing raises an alert. The watchdog's host_alert_raise path
    (src/lib/launcher-host-alerts.ts) has no condition for it. The preflight's node-version refusal names only the
    version pair.
  design: |
    INVARIANT host-node-never-blocks-units: every host-node outcome, including a failed install or a failed hold, is one
    reported line and returns 0, so the units still install (as W1-T6251 ruled); check mode still never calls apt.
    1. converge_host_node installs with `-y --allow-downgrades --allow-change-held-packages`. After a verified install,
       and on the in-step path, host_node_hold runs `apt-mark hold nodejs` unless `apt-mark showhold` already lists it.
       A failed hold is one reported line and never blocks units. The converge is the only thing that moves the package.
    2. launcher-host-alerts.ts gains `host-node-behind` with the refusal tiers (persisting, then escalated).
    3. The rendered launcher gains host_node_alert, run right after converge_host_units on a non-boot tick. It compares
       `node --version` with $CHECKOUT/.nvmrc. Off the pin, it prints one journal line and raises host-node-behind,
       naming an apt-mark hold when there is one. In step, it clears the alert (rmd spawns only while a run is open).
    4. The preflight's node-version refusal keeps its "Node <pin> required; got <actual>" prefix and adds the remedy:
       the units converge installs the pin and raises host-node-behind while it cannot.
