  risk: high # src/lib/test-slot-mutation.ts decides when a live test-slot guard may be unlinked; a wrong closed verdict risks a double mutation of the slot file
  band_meaning: blast-radius
  origin: operator ruling 2026-11-09 "fix the root cause too in parallel"
  plan_refs:
