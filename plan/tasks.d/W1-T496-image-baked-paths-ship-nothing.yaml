  note: "`risk: high` IS SET UP FRONT. `files:` SPANS THREE SUBSYSTEMS — `scripts/`, `test/` and a
    root doc — and `sizingViolation` (`src/lib/task-linter.ts`) blocks at >=2 below that band. The
    band is Rule 19's SPAN, not blast radius; the blast radius is one published field and one table.
    **`files:` WAS DERIVED BY INVOCATION COUNT, NOT PROSE MENTION**, measured at `0a1179a`:
    `scripts/fleet-heartbeat.sh` carries `head_sha` **3** and `install_head_sha` **3** while its
    `build[_-]sha|BUILD_SHA` count is **0** — it is the publisher and it has no build-sha concept, so
    it is where the field goes. `CLAUDE.md` scores **0** on
    `bind-mount|mounted checkout|image rebuild|baked` against a control of **11** for `node_modules`,
    so the table genuinely does not exist there.
    **`deploy/verify-image.sh` IS DELIBERATELY NOT DECLARED** even though it scores **13** on
    `BUILD_SHA` — the HIGHEST of any file. It is the existing READER and this task publishes FROM its
    idiom rather than changing it; declaring a path the implementer should not touch would fail
    `inverseScopeUntouchedFiles` (`src/lib/review.ts`) exactly as an undeclared one fails
    `scopeViolationFiles`. `.github/workflows/fleet-heartbeat-watch.yml` is likewise NOT declared:
    option (c) is argued and NOT recommended, and a declared-but-untouched workflow would fail the
    same check. `src/run-task.ts` is NOT declared and must not be — nothing here touches it, and every
    task naming it serialises against every other that does.
    **THIS SHARD'S OWN PATH IS DELIBERATELY ABSENT FROM `files:`** — adding it converts the
    `proof-scope` warnings into a HARD `rule15-filing` violation.
    **THE ACCEPTANCE PROOFS ARE PURE-PATH `unit test:` FORMS NAMING ONE FILE EACH, AND THAT IS
    DELIBERATE.** A shard whose proofs all point at its own yaml is self-referential and caps its
    implementation at `proof_exec: 0/N`; a pure path lint-passes today and executes the whole file
    once the implementation creates it. The file is NEW, matching the shape W1-T494 already uses
    (`test/fleet-heartbeat-stale-pin.test.ts`), so the fourth criterion's CLAUDE.md claim is asserted
    by that suite reading the doc — which is how `test/docs-claims.test.ts` already works — rather
    than by declaring a second test file this task would not otherwise touch.
    **OVERLAP, NAMED RATHER THAN DISCOVERED AT DISPATCH:** W1-T494 declares
    `scripts/fleet-heartbeat.sh` too, so `overlappingPaths` (`src/lib/dispatch-overlap.ts`) will
    serialise these two. That is correct — both add a field to the same publisher and a concurrent
    pair would conflict in the same emit block — but whichever lands second must re-read the file
    rather than assume the emit list it was filed against.
    EVERY NUMBER HERE IS AZURE-ONLY AND DATED 2026-08-14: the 124-commit gap, the 4 `deploy/`
    commits, `a25b3054` vs `0a1179a`, the jq absence, the 19 `acr-build` runs and inode 335487.
    RE-DERIVE BEFORE BUILDING — a single `acr-build.yml` dispatch closes the gap and changes every
    sha above, though it does not change the boundary or the missing field."
