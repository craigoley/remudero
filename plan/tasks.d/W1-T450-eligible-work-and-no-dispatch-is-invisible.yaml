- id: W1-T450
  title: "a fleet holding ELIGIBLE work and dispatching NOTHING renders identically to an idle one — QUEUE HEAD names the candidates and never asks how long it has been naming them, so a daemon failing every pass looks calm"
  repo: remudero
  depends_on: []
