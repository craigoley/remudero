  rationale: |
    READ at main 6a04d2f18: buildFeedbackInboxRoute (src/lib/panel-graph.ts, GET /v1/feedback) runs a
    synchronous listFeedback, reconcileFeedbackEntries and a fresh plan load on every request, measured on
    2026-09-15 at ~2.7 s of assembly for ~344 KB (comment in the console's getConsoleSummaryForTarget; not
    re-measured). GET /v1/operator-activity is async since #6953 but also uncached. Neither path is in
    CONSOLE_CACHED_READ_PATHS (src/lib/serve.ts), so every console summary read, including each 5 s poll,
    pays the full compute on serve's one thread. W1-T4451 builds the cache and its refresh rule for the five
    paths already cached; this task adds these two paths and the ETag / 304 answer, which W1-T4451 does not.
  design: |
    Add "/v1/feedback" and "/v1/operator-activity" to the cached-path set with their own minRefreshMs
    (feedback 10 s, operator-activity 15 s) in the W1-T4451 cache. Only the GET routes are wrapped; POST
    /v1/feedback stays uncached. Every cached body gets a strong ETag (a hash of the buffered body computed once per
    refresh, never per request). A request whose If-None-Match equals it gets 304 with no body and the same
    cache headers. Response bodies are otherwise byte-identical to today's. serve.ts: zero net comment lines.
    W1-T4444 (queued) changes operator-activity's composition, not its caching; whichever lands second keeps both.
