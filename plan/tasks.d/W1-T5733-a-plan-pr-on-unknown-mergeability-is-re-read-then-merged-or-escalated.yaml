- id: W1-T5733
  title: "A PLAN PR ON UNKNOWN MERGEABILITY IS RE-READ, THEN MERGED OR ESCALATED — `attemptPlanPrMerge` holds every `mergeable_state` but clean/behind, so while GitHub reports `unknown` (mergeable null) the PR is held pass after pass with no bound: batch-9 #9138 sat ~19:05-19:41Z on 2026-10-04 until an outside REST read made GitHub recompute"
  repo: remudero
  depends_on: [W1-T5615]
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 6.00
  risk: medium
  origin: "operator session 2026-10-04: watch log 19:36Z/19:41Z, follow-up audit (research/audit/followups.md) item 76"
  plan_refs: [W1-T5615, W1-T2855, W1-T5674, W1-T5726]
  files: [src/lib/arm-auto-merge.ts, test/a-plan-pr-on-unknown-mergeability-is-re-read-then-merged-or-escalated.test.ts]
  status: queued
  priority: 2
  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 70bb29f8. `attemptPlanPrMerge` (src/lib/arm-auto-merge.ts,
    W1-T5615) takes the direct path only when `facts.mergeableState` is `clean` or `behind`;
    anything else returns `plan-pr-held` with `remedy: "retry-later"` and the
    `automerge.plan_pr_held` say line. GitHub computes `mergeable` lazily and answers `unknown`
    with `mergeable: null` while it does; the documented client move is to read again shortly.
    One `readMergeFacts` per sweep pass reads the same `unknown` while checks churn, and nothing
    counts how long a head has been held on it: on 2026-10-04 #9138 (head b7ccb2dd) flip-flopped
    'mergeable — arming' / 'checks pending 31m' on `unknown` for ~36 minutes and went `clean` only
    after a read from outside the fleet. Batch-9 W1-T5674 (#9138, open) admits `unstable` and
    `has_hooks` only; batch-10 W1-T5726 (#9155, open) measures the pending-check flap, not
    mergeability. Neither bounds `unknown`.
  design: |
    (i) On `unknown` (or `mergeable` null), re-read the facts within the same attempt up to a
    small fixed count through the existing `sleepSync` seam (a BACKSTOP-tagged bound), and proceed
    as today if a re-read answers clean/behind. (ii) If it stays `unknown`, hold with a distinct
    remedy (`mergeability-unknown`) and record the head; once one head has been held on `unknown`
    past a bound across passes (read from the prior held rows), escalate it to the operator with
    the head and the elapsed time instead of holding silently. Never arm auto-merge on `unknown`.
    Build on W1-T5674's admit list if it has merged; the two touch the same branch of the function.
  acceptance:
    - claim: "a plan PR whose first fact read is unknown and whose re-read is clean merges in one attempt, one that stays unknown is held with remedy mergeability-unknown, and a head held on unknown past the bound is escalated, not held again"
      proof: "unit test: test/a-plan-pr-on-unknown-mergeability-is-re-read-then-merged-or-escalated.test.ts"
  falsifier: |
    Remove the re-read: the unknown-then-clean fixture is held on its first attempt and the test
    fails.
