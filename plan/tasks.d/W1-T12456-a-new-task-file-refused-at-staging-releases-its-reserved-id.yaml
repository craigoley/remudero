  priority: 0.5
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # a wrong release frees an id that a branch or a pull request still carries
  band_meaning: blast-radius
  origin: operator-session#root-cause-defects-2026-11-12
  plan_refs:
    - W1-T12199
