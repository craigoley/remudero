  design: |
    1. Run `rmd test-move infra` (W1-T9879) on current origin/main and open its PR as produced. Do not hand-edit moved
       files.
    2. If the tool refuses or misbehaves (a non-R100 pair, a file that is not location-free, a ghost key), put the
       refusal in the PR body and fix the TOOL under W1-T9879's follow-up. This wave is not the place for the fix.
    3. Low-confidence rows move as the map says. The placement gardener (W1-T9901) proposes corrections later, and
       measures how often the map was right.
    4. Skipped files stay flat. The next wave's run, or the gardener, picks them up when their PRs close.
    5. The PR's checks are the normal ones. Each moved file keeps its tier row, census rows and plan proofs through
       the re-key commit and W1-T9860's resolver.
