  note: "RETIREMENT RECORD, 2026-08-07 — THIS WORK IS DONE, and the shard is retired because it is
    finished rather than because it was wrong. Everything below is preserved verbatim so a future
    reader needs no archaeology.
    WHAT LANDED, and where: #1441 (ad5de23, `chore(ci): retire the never-run refactor-campaign
    instrument and both wirings`) shipped this shard's entire scope on 2026-07-26 — 47 files,
    1224 deletions. Its own commit body enumerates the same set this shard declares: it deletes
    scripts/refactor-campaign.mjs, plan/campaigns/refactor.yaml, docs/refactor-campaign.md,
    test/refactor-campaign.test.ts and its fixture tree, and the four campaign-exclusive baselines;
    removes the ci.yml job and the ci-gate.yml required-members entry together so neither wiring
    outlives the other; removes the dangling ci-parity.ts entry and the .gitignore comment; and
    updates the four dependent tests. Verified at eab4baa: EIGHT of this shard's fourteen declared
    files no longer exist.
    WHY IT WAS STILL BEING OFFERED, which is the durable lesson: #1441 carries NO `Remudero-Task:`
    trailer and no subject citation for this id, so the merged-evidence rule
    (classifyFailingMergeEvidence, and the trailer scan every frontier check uses) cannot credit it.
    isDispatchEligible therefore kept returning true and runnableCandidates kept offering a worker a
    job whose subject had been deleted twelve days earlier. This is the SECOND measured instance in
    one week of a task surviving its own completion because the merging PR did not cite it —
    W1-T369 was the first — which makes it a class, not an incident. A PR that implements a filed
    task must carry its trailer; nothing else can see the connection.
    THE FILING-SHAPE OBJECTION also stood and is recorded for completeness: the files: list spans
    INSTRUMENT_SURFACE (.github/workflows/, scripts/*-baseline.json) and a src/ product path
    (src/lib/ci-parity.ts), which detectInstrumentEntanglement refuses unconditionally, while the
    two halves were coupled in both directions and so could not be split either. That is moot now
    and is kept only so a re-filing does not rediscover it.
    ORIGINAL NOTE, UNCHANGED, follows.
    verify:auto — every claim is a deterministic assertion over workflow/parity/surface contents,
    decidable offline with no operator present.
    risk:high is Rule 19's SPAN, not blast radius, and the band is raised deliberately rather than
    shipped as a violation: the file set crosses scripts/, plan/campaigns/, docs/, .github/workflows/,
    .gitignore, src/lib/ and test/. The blast radius is genuinely LOW — the thing being removed has
    never executed to a verdict — but Rule 19 counts subsystems spanned, and pretending this is
    risk:medium would ship a sizing violation to save a word.
    budget_usd 70 — the work is a wide, careful deletion plus two non-obvious reference removals
    (design (iv)), not a straight-line diff. Below W1-T324's 100 because there is no per-entry
    archaeology.
    files: DECLARES `test/fixtures/refactor-campaign/**` implicitly through
    `test/refactor-campaign.test.ts`'s own tree — the worker deletes the fixture directory alongside
    its suite; a path a worker writes must be declared and omitting one is what refused five
    dispatches in a week, so if the scope guard objects, add the fixture root explicitly rather than
    working around it. It does NOT declare scripts/mutation-baseline.json or
    scripts/coverage-baseline.json, and that omission is the point of design (ii).
    All three proofs name EXISTING suites and execute today, so no criterion is a forward reference.
    test/ci-parity-contract.test.ts is DECLARED because criterion 2's proof names it: a proof pointing
    outside files: is a proof-scope warning at filing and a scope-guard REFUSAL after the work is done.
    THE FIGURES ARE MEASURED AT 946f281 BY EXECUTION — the dry-run's exit 1, the 5.6%/4.8% survival,
    6253 vs 1870, the eighth-place ranking, the zero-use label. Re-derive before acting: a stripper
    that gets fixed elsewhere, or a baseline recapture, would move all of them.
    NO depends_on: nothing blocks this and it blocks nothing."
