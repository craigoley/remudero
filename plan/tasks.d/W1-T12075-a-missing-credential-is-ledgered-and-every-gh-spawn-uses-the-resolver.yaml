- id: W1-T12075
  title: "A missing GitHub credential is ledgered, and every gh spawn uses the one resolver"
  repo: remudero
  depends_on: [W1-T11926]
  priority: 1.2
  type: implement
  verify: auto
  principles:
    tdd: strict
  risk: high # the remaining gh spawn sites across four files; a wrong environment breaks a GitHub call
  band_meaning: blast-radius
  origin: operator-session#github-connections-2026-11-10
  files:
    - src/run-task.ts
    - src/lib/pr-state.ts
    - src/lib/gh-read-broker.ts
    - src/gh-read-broker-client-main.ts
    - test/github/a-missing-credential-is-ledgered-and-every-gh-spawn-uses-the-resolver.test.ts
  status: queued
  attempts: 0
  acceptance:
    - claim: "A running command installs the ledger writer, so a gh call with no credential source writes one github.credential_missing row that names the sources tried and no value"
      proof: "grep: W1-T12075 criterion 1 in test/github/a-missing-credential-is-ledgered-and-every-gh-spawn-uses-the-resolver.test.ts"
    - claim: "The gh spawns in src/lib/pr-state.ts, src/lib/gh-read-broker.ts and src/gh-read-broker-client-main.ts take their environment from the resolver"
      proof: "grep: W1-T12075 criterion 2 in test/github/a-missing-credential-is-ledgered-and-every-gh-spawn-uses-the-resolver.test.ts"
    - claim: "With an ambient token or a stored gh login and no references file, each of those spawns receives the same environment as before"
      proof: "grep: W1-T12075 criterion 3 in test/github/a-missing-credential-is-ledgered-and-every-gh-spawn-uses-the-resolver.test.ts"
  rationale: |
    OBSERVED 2026-11-10 while building W1-T11926: that task adds one resolver for the GitHub credential and routes the spawns in src/lib/github-transport.ts through it. Two parts were outside its file list.
    - The row for a missing credential is written through a sink that nothing installs in production. The resolver cannot import the ledger: it would close an import cycle through config and github-transport. Until one line in src/run-task.ts installs the sink, the error is thrown and no row is written.
    - Four gh spawns bypass the resolver: src/lib/pr-state.ts line 119, src/lib/gh-read-broker.ts lines 473 and 1382, and src/gh-read-broker-client-main.ts line 21.
    - On 2026-11-09 a missing credential showed as a pull request stuck on a pending check, not as a credential problem. The row is what makes it visible.
  design: |
    Install the sink beside setGhReadActorResolver in src/run-task.ts. Route the four spawns through the resolver's childEnv. The broker's own spawns keep their pacing and cache behaviour.
    NOT IN SCOPE: the order of sources (decided in W1-T11926), the references file's writer, and the scheduled shell jobs that read ~/.gh-token.
  falsifier: |
    Leave the sink uninstalled and criterion 1 must fail. Leave one spawn on the process environment and criterion 2 must fail. Change the environment a spawn receives when nothing is configured and criterion 3 must fail. Restore and require all three to pass.
  note: |
    Follows W1-T11926.
