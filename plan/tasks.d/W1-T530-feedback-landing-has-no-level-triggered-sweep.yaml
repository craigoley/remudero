    wiring audit, one per site.
    WHAT THIS TASK DOES NOT RE-DERIVE: that `landPending` already scans the whole inbox and is
    idempotent, and that `landFeedback`'s only caller is `captureFeedback`. Both were read at source
    at filing. A worker that spends budget re-auditing them, or that 'fixes' the scan, has been sent
    to the wrong place — the defect is the TRIGGER, not the reconciliation.
    NO depends_on: the bridge it wraps shipped with W1-T243 (PR #599) and is live in
    src/lib/feedback-landing.ts today; W1-T243's remaining criteria are independent of this rung."
