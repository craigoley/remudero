    WHY NOT DECOMPOSED (the alternative was worked, not waved off): the linter's own span here is
    feedback-landing (the module), daemon + run-task (the two wiring sites) and feedback-landing-sweep
    (the new fixture path). A per-subsystem split cannot reach risk:medium in ANY arrangement — the
