    green-and-unreached failure this plan already ate eleven times. The span is real and it is the
    task: risk:high is the honest label, not a smaller lie.
    THE HIGH BAND IS EARNED ON SUBSTANCE TOO, not just to clear the check: the rung adds an autonomous
    push+PR path on a ~93-second cadence. It argues DOWN because it adds NO new push mechanism — it
