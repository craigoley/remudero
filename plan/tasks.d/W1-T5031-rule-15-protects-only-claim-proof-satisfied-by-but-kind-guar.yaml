      proof: 'grep: test("W1-T5031: a diff that only adds kind: guard under an existing criterion trips criterionFieldTampered" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "removing or changing a kind line, and a kind line with no acceptance context in the hunk, trip it too"
      proof: 'grep: test("W1-T5031: a removed kind line and a context-free added kind line trip it too" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "a non-plan-only PR that adds kind: guard is refused by checkSatisfiedByGuard and by judgeReview as criteriaTampered"
      proof: 'grep: test("W1-T5031: a builder PR that adds kind: guard to its own record is refused by the guard and the review" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "a plan-only human filing whose new record declares its own kind: guard still passes the guard, the preserved exemption"
      proof: 'grep: test("W1-T5031: a plan-only human filing that declares its own kind: guard still passes" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "bookkeeping lines in a record (attempts, status) and an added holdout line still do not trip it, so the protected set is not over-widened"
      proof: 'grep: test("W1-T5031: attempts and status bumps and an added holdout line do not trip it" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "the protected set is decided per field: claim, proof, satisfied_by and kind protected, holdout and status not"
      proof: 'grep: test("W1-T5031: every criterion field that exempts a criterion from a gate is protected and holdout is not" in test/rule-15-protects-the-criterion-kind-that-exempts-discrimination.test.ts'
    - claim: "the production predicate names kind in its protected set, so the pre-push refusal and the review read the same field list"
      proof: 'grep: "satisfied_by", "kind"]) in src/lib/review.ts'
  falsifier: |
    Revert the one added name and the first, second and third tests redden (the predicate is false again for every `kind` diff)
    while the preserved-filing, bookkeeping and per-field tests stay green, which is what shows the change moves only the `kind`
    diffs. Add `"holdout"` to the set instead and the bookkeeping test and the per-field table redden. CLOSE IF an acceptance
    criterion's `kind` is already protected by a check that is not `criterionFieldTampered` and refuses a builder's edit to it.
  note: |
    RISK: high because src/lib/review.ts is the reviewer and Rule 15's enforcement point, which the operator's brief puts in the high
    band; the change is one set member plus comments, and it can only make the guard refuse MORE builder diffs, never fewer.
    src/lib/review.ts carries a comment-load row in scripts/comment-load-baseline.json: keep the rewritten comment within the
    existing row's budget and do not raise or delete it.
    The fixture shape to copy is test/rule15-block-scalar-proof.test.ts (a synthetic multi-file diff string fed to
    `criterionFieldTampered`, `checkSatisfiedByGuard` and `judgeReview`); the new suite must not edit it.
    The `grep:` for the production proof is the literal tail of the new set, `"satisfied_by", "kind"])`, on ONE physical line; the
    builder must keep the set on one line so the proof matches (an array wrapped by a formatter would not).
