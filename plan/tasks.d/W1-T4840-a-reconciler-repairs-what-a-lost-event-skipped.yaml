  rationale: |
    OBSERVED 2026-09-29, four stalls with one shape: a push event GitHub never fired (30f3c7b58, 9b694d664) so CI and
    the image build never ran; the deploy tick then waited 3.5 h on an exact image tag no later build could satisfy;
    DEPLOY_FAILED latches sat 2-12 days past healthy deploys; a deploy tick ran deploy code older than main. Each was
    found by hand. W1-T4809 and W1-T4817 fix two of these individually.
  design: |
    reconcileFleetState (new module) holds a table of (desired, observed, repair) rows and the sweep runs it each
    cycle. Rows from W1-T4809 and W1-T4817 move into it rather than living as separate loops; each repair is recorded
    as reconcile.repaired with the gap it closed, and a gap that persists after its repair escalates once.
  acceptance:
