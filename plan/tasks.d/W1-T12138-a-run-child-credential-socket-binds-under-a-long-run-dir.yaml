- id: W1-T12138
  title: "A RUN CHILD'S GIT CREDENTIAL SOCKET BINDS UNDER A LONG RUN DIRECTORY — startRunChildGitCredentialSocket refuses when <runDir>/git.sock exceeds MAX_UNIX_SOCKET_PATH_BYTES, so a deep run directory fails credential startup as spawn_infra_blocked and the detached fix worker never starts; the daemon socket already falls back to a short owner-only /tmp directory"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern, where a run child's credential socket binds when its run directory is too deep
  band_meaning: blast-radius
  origin: architect
  plan_refs: [W1-T9083, W1-T5115]
  files:
    - src/lib/secret-boundary.ts
    - test/a-run-child-owns-its-github-token-and-credential-socket.test.ts
    - test/worker/sandbox/a-run-child-credential-socket-binds-under-a-long-run-dir.test.ts
  status: queued
  priority: 1
  attempts: 0
  rationale: |
    OBSERVED (initiative evidence, origin/main acb79124): `rmd ledger-grep` over 309 archive files returned 41 matches.
    #17394 has repeated `sweep.fix.dispatch_failed` and `run_child.settled` rows on 2026-11-08 carrying
    `credential startup failed: Error: run credential socket path exceeds the unix socket limit`. The detached fix
    worker never started, so the PR got no fix.
    READ on this checkout (symbols, not lines):
    - src/lib/secret-boundary.ts `startRunChildGitCredentialSocket` builds `join(resolve(opts.runDir), "git.sock")` and
      throws "run credential socket path exceeds the unix socket limit" when `Buffer.byteLength` exceeds
      `MAX_UNIX_SOCKET_PATH_BYTES` (src/lib/short-path-root.ts: 107 on Linux, 103 elsewhere).
    - In the same file, `daemonGitCredentialSocketPath` already calls `shortPathWhenTooLong`. It falls back to
      `/tmp/rmd-gc-<sha256(resolve(stateDir)) first 12 hex>/helper.sock`. `startDaemonGitCredentialSocket` creates that
      directory 0700, checks it with `ownedSocketDir` (lstat: a real directory owned by this uid), and removes both the
      socket and the short directory in `close`.
    - src/run-child-main.ts catches the throw and writes `failed` with reasonClass `spawn_infra_blocked`, message
      `credential startup failed: ...`. W1-T9083 design step 3 chose that fail-closed result, and this task keeps it.
    - Consumers read the bound path from `RUN_CHILD_SOCKET_ENV` (`process.env[RUN_CHILD_SOCKET_ENV] = socket.socketPath`;
      `runChildCredentialSocket`). Nothing re-derives `<runDir>/git.sock`, so a different bound path needs no consumer change.
    - test/a-run-child-owns-its-github-token-and-credential-socket.test.ts, test "the real socket thread answers and
      refuses a run directory that cannot bind", asserts that a `join(dir, "x".repeat(110))` runDir rejects with
      /unix socket limit/. That runDir does not exist, so after this change it would reject ENOENT or bind short. The
      assertion has to be rewritten, which is why that file is in `files:`.
    Settled by lookup: is this already filed or already decided? -> No. No task in plan/tasks.yaml or plan/tasks.d
      names the run-child socket path limit. W1-T9083 (merged) chose the refusal. W1-T9956 (merged) covers only a
      test's tsx pipe under a long TMPDIR. W1-T11851 covers planner credentials, not the run-child path.
      (grep "unix socket limit|git.sock|startRunChildGitCredentialSocket" over plan/, LEARNINGS.md, DECISIONS.md, MASTER-PLAN.md)
    Settled by lookup: is there a tested short-path pattern to reuse? -> Yes: `shortPathWhenTooLong` +
      `ownedSocketDir` + 0700 dir / 0600 socket, as `daemonGitCredentialSocketPath` / `startDaemonGitCredentialSocket`
      use them (W1-T5115, src/lib/secret-boundary.ts).
    Settled by lookup: does W1-T9083's contract allow the socket to leave the run directory? -> The contract is that
      the socket is per-run, owned by the child, never backed by a token on disk, and removed before the terminal
      status (W1-T9083 design 1-3). A private owner-only /tmp directory keyed on the resolved runDir keeps each of
      those. The one-line doc "an overlong path refuses rather than escaping that directory" was an implementation
      choice, not an acceptance claim. This task replaces it.
    Settled by lookup: is generic stale-dispatch recovery in scope? -> No. W1-T12113, W1-T12114 and W1-T12115 cover it.
  design: |
    1. Add `runChildGitCredentialSocketPath(runDir)` to src/lib/secret-boundary.ts, a sibling of
       `daemonGitCredentialSocketPath`. It returns `shortPathWhenTooLong(join(resolve(runDir), "git.sock"),
       (root) => join(root, "rmd-rc-<sha256(resolve(runDir)) first 12 hex>", "git.sock"), fits, existsSync)`, where
       `fits` is the same byte-length check against `MAX_UNIX_SOCKET_PATH_BYTES`. A runDir that fits gets
       `<runDir>/git.sock` unchanged.
    2. `startRunChildGitCredentialSocket` uses that path. When it is outside the run directory, the function:
       - creates the short directory with mode 0700;
       - refuses (throws) unless `ownedSocketDir` proves it is a real directory owned by this uid;
       - chmods it to 0700;
       - binds, then chmods the socket to 0600, as it does today.
       If even the short path does not fit, the existing "exceeds the unix socket limit" refusal still throws. The
       runDir is still chmodded to 0700 in both cases.
    3. `close` and the startup-failure path remove the socket and, when the short directory was created and proven
       owned by this call, `rmdirSync` it. That happens before the child writes its terminal status, matching what
       the daemon socket does. A directory not proven owned is never removed.
    4. Startup failures still throw. src/run-child-main.ts is unchanged and still writes `failed` /
       `spawn_infra_blocked`. No token reaches disk. `setHarnessCredentialSocket` gets the bound path.
    5. Tests, in the new test/worker/sandbox/a-run-child-credential-socket-binds-under-a-long-run-dir.test.ts, run against the REAL
       socket thread or a real `startCredentialHelperSocket` bind (no mocked listen). Their exact task-binding title
       prefixes are `W1-T12138 criterion 1`, `W1-T12138 criterion 2`, and `W1-T12138 criterion 3`, one per acceptance
       criterion below; do not reuse one test title as evidence for multiple claims:
       - A real existing runDir whose `<runDir>/git.sock` is longer than `MAX_UNIX_SOCKET_PATH_BYTES` binds. A
         credential request over the returned socketPath answers. The socket is 0600 and its directory is 0700, owned
         by this uid, outside the runDir. After `close()`, the socket and the short directory are both gone.
       - A short runDir still binds at exactly `<runDir>/git.sock`, and its runDir is not removed.
       - A pre-created short directory that this uid does not own, or that is a symlink, makes startup reject. The
         directory is left in place.
       - An end-to-end `runChildMain` probe with a long run dir and an armed refresh reaches `done`, not
         `spawn_infra_blocked`. The short directory is gone before the status is read.
       In the existing W1-T9083 test file, rewrite the `"x".repeat(110)` refusal assertion so it states the new
       behaviour. Its other assertions do not change.
    OUT OF SCOPE: generic stale fix-dispatch recovery (W1-T12113/14/15), PR lifecycle or review changes, token
    refresh or mint changes, the daemon socket path, and shortening run-directory naming.
  acceptance:
    - claim: "a run child whose <runDir>/git.sock exceeds the unix socket limit binds a real owner-only socket in a private short directory, answers a credential request, and removes both on close"
      proof: "unit test: W1-T12138 criterion 1"
    - claim: "a short run directory still binds at <runDir>/git.sock unchanged, and an unowned or symlinked short directory fails closed without being removed"
      proof: "unit test: W1-T12138 criterion 2"
    - claim: "W1-T9083's no-token-at-rest, child-owned socket lifecycle and terminal cleanup contract still hold on the long-path fallback"
      proof: "unit test: W1-T12138 criterion 3"
      kind: guard
    - claim: "the run-child socket path is derived through the shared short-path helper"
      proof: "grep: runChildGitCredentialSocketPath( in src/lib/secret-boundary.ts"
  falsifier: |
    On origin/main acb79124, the first new test's `startRunChildGitCredentialSocket` call with an existing runDir
    deeper than the limit rejects with "run credential socket path exceeds the unix socket limit". The runChildMain
    probe writes `failed` / `spawn_infra_blocked`, as #17394's ledger rows show.
