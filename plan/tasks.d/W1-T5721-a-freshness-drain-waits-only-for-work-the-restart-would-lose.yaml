  attempts: 0
  rationale: |
    READ 2026-10-04 on origin/main 3ae4a67a. On a freshness restart `runDaemon` logs
    `daemon.freshness_drain.started` and awaits `drainDetachedSweepActions` and
    `drainInFlightReviews` together, each bounded by the sweep wall-clock bound, then logs
    `daemon.detached_action_abandoned` per survivor. The registry (`detachSweepAction`,
    src/lib/sweep.ts) holds kinds `fix-dispatch` (including `detachFixWait`'s CI wait after a worker
    has pushed) and best-effort cadences registered by runDaemon: measurement-cadence,
    benchmark-cohort, ci-learning, retro, auto-triage. A cadence's work is redone by the next
    process, and a pushed fix's CI wait is re-derived from the PR on the next sweep, so awaiting
    them only delays the restart. MEASURED (restart report): freshness restarts 30 of 47 boots;
    drains 232 min since 10-02 (~82 min/day of dispatch hold); 13 ran to the bound and abandoned
    anyway (~63 min/day).
  design: |
    The drain releases at once every best-effort cadence kind and every fix-dispatch whose worker
    has exited (only its detached CI wait remains), logging each release with its kind and reason;
    it still awaits a fix-dispatch whose worker is running and every in-flight review, up to the
    bound, as today. The detached-action record gains the phase it needs to tell the two
    fix-dispatch cases apart.
  acceptance:
    - claim: "with a registry holding a retro cadence, a fix dispatch in its CI wait, a fix dispatch with a live worker and an in-flight review, the drain releases the first two at once and awaits the other two"
      proof: "unit test: test/a-freshness-drain-waits-only-for-work-the-restart-would-lose.test.ts"
  falsifier: |
    Await every registered action again: the drain holds for the retro fake's full duration and the
    test fails.
