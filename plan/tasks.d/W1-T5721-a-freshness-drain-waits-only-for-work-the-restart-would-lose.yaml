  title: "A FRESHNESS DRAIN WAITS ONLY FOR WORK THE RESTART WOULD LOSE — the drain awaits every detached sweep action to its bound, including best-effort cadences and fix dispatches that only wait on CI, so drains held dispatch 232 min since 10-02 and 13 ran to the bound and abandoned anyway"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 8.00
  risk: high  # Rule 19: one concern — which detached actions a freshness drain awaits
  band_meaning: span
  origin: "operator session 2026-10-04: research/restart/report.md (restart efficiency) P3"
  plan_refs: [W1-T2865, W1-T4053, W1-T2744, W1-T4998, W1-T5723]
  files: [src/lib/daemon.ts, src/lib/sweep.ts, test/a-freshness-drain-waits-only-for-work-the-restart-would-lose.test.ts]
  status: merged
