    - claim: "nothing added fetches twice or waits between resolving and judging"
      proof: "unit test: test/review-resolves-criteria-at-the-prs-own-head.test.ts"
  falsifier: |
    If a walk of `/commits/<head>/statuses` over a fresh window finds no `remudero-review` failure
    whose description is "no acceptance criteria to judge (fail closed)" on a PR whose stored body
    holds an anchored `Remudero-Task:` line, then the window is not being hit and this task should be
    closed rather than implemented. The measurement MUST walk status HISTORY and not the combined
    rollup: a verdict that later cleared leaves no trace in the rollup, so a rollup scan reads zero
    whether or not the defect occurred, and that zero is worthless.

    SEPARATELY DECISIVE: if `loadPlan` stops resolving shards relative to the plan file it is handed,
    or if the reviewer stops resolving criteria from the container's checkout, the mechanism named
    here is gone and the finding must be re-derived rather than trusted.
