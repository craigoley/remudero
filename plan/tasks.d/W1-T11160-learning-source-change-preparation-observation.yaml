  rationale: "OBSERVED at Remudero 1368db581715998e712a80ad6b0db9a87410e63c: computeCorpusChurn and computeEntryChurn exist, but the whole-src caller census finds no production computeCorpusChurn call; computeMatchedLearningsForArm calls renderMatchedLearnings(selected) without its optional corpusChurn argument. The default reader runs git log once per entry and returns zero on exceptions. A missing observation therefore neither reaches normal injection nor distinguishes unreadable history from measured zero. W1-T4681 already owns the source-churn algorithm and advisory note; W1-T4682 owns repair proposals for stale cited evidence. This task closes their concrete preparation/measurement gap, rather than refiling freshness or citation repair generally. Sources: https://www.infoq.com/articles/agentic-ai-context-memory-knowledge/ ; https://arxiv.org/abs/2410.10813v2 ; https://github.com/craigoley/remudero/blob/1368db581715998e712a80ad6b0db9a87410e63c/src/lib/learnings.ts#L798 ; https://github.com/craigoley/remudero/blob/1368db581715998e712a80ad6b0db9a87410e63c/src/lib/wipe-test.ts#L112 . Source churn is evidence about commits in an explicit window, not a probability of truth or observed live harm. Implementation credit is independently established by GitHub API state MERGED, exact Remudero-Task trailer and run branch for PR #7792 (merge 66fbca9fe2e626ab40186506ef842c3cbddc14da, W1-T4681) and PR #7771 (merge 8b5d41454f7b2b3c856930a70cca792432aeafbc, W1-T4682). PR #7792 changed only learnings.ts and its direct helper/render tests; it did not modify the actual computeMatchedLearningsForArm or runTaskBody injection caller. Its original task promised injected notes, but current source still has no production computeCorpusChurn caller and the committed reader conflates failure with zero. This is a repair of that credited delivery gap, bounded capture and annotation-budget correctness, not a second source-churn algorithm. PR #7771 owns reviewed stale-citation repair proposals