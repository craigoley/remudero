  design: |-
    Wire a bounded versioned source-change observation through the existing asynchronous run preparation boundary into computeMatchedLearningsForArm and renderMatchedLearnings. Reuse W1-T4681's per-fact source-change counting/rendering semantics where compatible, and W1-T4682's existing proposal path rather than creating another citation-repair engine. Perform any history capture asynchronously off the daemon's hot event loop, using the maintained bounded child/capture primitives and a shared batch or compatible cache; never add synchronous git log per learning at dispatch. Bound history work, output, concurrency and cache population through existing repository resource conventions. No new daemon, scheduler, network fetch, model judgment or paid experiment is created.
    Bind a cache/observation to the actual repository/source snapshot, relevant corpus and applicability revisions, anchor/window semantics, reader version and completeness. The existing cited field is last-cited time, so describe the measured window honestly; do not label citation recency as a verified earning date or claim current factual validity. A stale or missing observation, dirty/unresolved required source context, absent/invalid anchor, unreadable Git, timeout, output truncation or incomplete population is an explicit unknown/not-measurable reason, not zero and not a last-good result relabeled current. A complete observation with no matching commits is a measured zero. Do not silently turn per-layer ambiguity into another layer's measurement. Preserve bounded covered/unknown denominators and capture identity without raw private content or filesystem paths in ledger events.
    The real preparation consumer must receive the typed observation and expose advisory verify-first information only when it is compatible. Keep reviewed semantic learnings active unless existing lifecycle/authority changes them; no blanket age expiry, quarantine, ranking feedback, new retries, spending or rule promotion follows from churn. Preserve existing matching/ranking, selected and dropped IDs, propensity and masking behavior. Do not drop selected facts or enlarge the context cap to accommodate annotations: account for actual delivered bytes under the established knowledge budget, omit optional notes with a bounded reason when space is unavailable, and distinguish measured observation from delivered annotation. A healthy fixture with room must prove the real rendered worker context carries A's source-change note while unchanged B is a measured zero. Existing prompt manifests remain observational; record annotation format/source identity so later comparisons do not mistake a changed prompt treatment for a change in fact semantics. No new outcome estimator is part of this task.
    Extend the existing freshness and wipe-test physical suites through the production preparation seam. Use a real temporary Git repository for the default capture path and a refused/unreadable-path case, alongside deterministic bounded/cache seams. Control commit timestamps and the fixture observation window together; set Git identity inside the fixture, never skip CI behavior. New test code uses package aliases and the shared repo-root helper; a new standalone file, if needed, first uses rmd test-place's computed folder. Preserve prior assertions except where an explicitly demonstrated incorrect zero-on-failure contract is replaced by the truthful unknown case.
