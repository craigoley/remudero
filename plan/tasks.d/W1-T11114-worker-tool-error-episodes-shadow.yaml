  rationale: "OBSERVED: worker-tool-lineage.ts joins provider/stream/run/turn/call identities and classifies success/error/unknown. quiet-worker-watchdog.ts observes silence and shell polling; fix-progress-judge reasons between fix rounds. Neither is a measurement of an active worker repeatedly receiving tool errors inside one round. Omnigent safety policy detects exact repeated calls; its rolling error heuristic examines a result prefix. Sources: https://github.com/omnigent-ai/omnigent/blob/42ab304337a27c995f0875c681b4a85b811364ee/omnigent/policies/builtins/safety.py ; https://github.com/omnigent-ai/omnigent/blob/42ab304337a27c995f0875c681b4a85b811364ee/omnigent/policies/builtins/context.py . Adapt the observation using existing verified outcomes rather than raw output heuristics or another kill bound. Settled by lookup: is this amendment already filed or decided? -> no; the only W1-T11114 record is this shard and no plan/ledger text names worker.tool_lineage_shadow (grep plan/, src/, test/). Settled by lookup: does the durable closure summary collide with an undeclared suite? -> yes; test/worker-tool-lineage-wiring.test.ts asserts every default-sink ledger row is step worker.tool_lineage, exact per-event state arrays, and rows.at(-1) is the interrupted unfinished event, so an appended closure row breaks five of its tests (test/worker-tool-lineage-wiring.test.ts). Settled by lookup: can the summary be retracted or kept out of the ledger instead? -> no; the default sink is appendLedger (append-only) and the design requires a durable shadow ledger summary on closure (src/lib/worker-tool-lineage.ts; this design). Settled by lookup: does adding the file/proof bypass judgment? -> no; files and acceptance are inside taskRulingPin, so the stale risk_ruling pin forces machine re-judgment before dispatch (src/lib/task-linter.ts taskRulingPin; src/lib/machine-filing-judge.ts)."
  design: |-
    Extend existing metadata-only tool-lineage fold with bounded per-run/provider/tool-class consecutive-error episode observations. Only unique, unambiguous joined error results contribute. A joined success closes/resets the streak; unknown, duplicate, orphan, interrupted, ambiguous and unsupported events are separately counted and cannot establish either success or an error streak across an evidence gap. Define ordering and continuity explicitly per stream/run; never merge episodes across workers, provider streams, restarts or turns whose continuity is unknown. Cap memory/cardinality and emit an explicit incomplete/unknown summary on exhaustion or delivery failure.
    Emit a fixed-schema shadow ledger summary on existing worker closure, naming observed eligible results, error episodes/lengths, successes and excluded categories with window/completeness and bounded identifiers. Keep no tool arguments, raw outputs, paths, prompts, model prose or secrets. Existing tool result is not task outcome or permission. Healthy repeated checks with successful results are ordinary activity; do not label an episode root cause, nonprogress, model failure or wasted dollars without independent evidence. This measurement enables the existing flywheel/retro to price a later targeted remedy: no new scheduler, watchdog bound, kill, retry, denial, paid replay or policy action. Retain all original lineage events. The durable closure summary is exactly one additional default-sink ledger row with step worker.tool_lineage_shadow, appended after the per-event worker.tool_lineage rows (which keep their existing order, shape and content); a failed or blocked sink still never changes execution outcomes. Update only the exact-shape assertions in test/worker-tool-lineage-wiring.test.ts so they partition rows by step: per-event assertions apply to the worker.tool_lineage rows unchanged, and each consumed-stream path (Claude collect, spawnWorker, Codex JSONL, cash adapters, interruption) also asserts one worker.tool_lineage_shadow row whose summary is redacted, carries the run/provider attribution, and reports incomplete on interruption. Do not weaken its redaction, sink-failure or delivery-state assertions. Test interleaving, duplicate/replayed events, ambiguous results, success reset, gaps, caps and injected sensitive sentinels in existing suites; any later intervention requires its own observed population, proposal and normal gates.
  acceptance:
    - claim: only unique continuous joined errors form an episode and success or an evidence gap breaks its claim
      proof: "unit test: tool error episode shadow requires continuous unique joined error evidence"
    - claim: duplicate orphan replay ambiguous and unsupported observations are excluded and counted
      proof: "unit test: tool error episode shadow counts exclusions without inflating the streak"
    - claim: healthy repeated successful checks are not classified as tool error episodes
      proof: "unit test: tool error episode shadow preserves healthy repeated checks"
    - claim: bounded summaries preserve redaction incompleteness and observational authority
      proof: "unit test: tool error episode shadow stays bounded private and cannot stop or retry a worker"
    - claim: every wired worker stream durably appends one redacted closure summary after unchanged per-event lineage rows
      proof: "unit test: the consumed stream uses the default durable observer"
  falsifier: Count a duplicate result twice, bridge an unknown gap, merge two streams, or treat successful repeated checks as an error loop; each isolated change must fail a deterministic fixture. Independently disclose a sentinel argument/output to prove the summary redaction test fails. Restore all source; no live stuck rate or savings is claimed.
  note: Operator requested research, plan updates and task filing, not immediate product execution or paid experiments. Normal risk judgment, native capacity, source ownership, proof, review and merge gates remain. No installed Omnigent dependency, new scheduler, automatic guard change, model promotion or live capability proof is authorized by this record. This record is planning custody, not evidence of implementation or benefit. Because this amendment changes pinned task fields, it is parked for human review without a risk ruling; the explicit dispatch hold remains until a fresh native machine-filing ruling lands and a separate reviewed plan edit removes it.
