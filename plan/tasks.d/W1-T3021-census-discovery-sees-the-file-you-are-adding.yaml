- id: W1-T3021
  title: "THE CENSUS DRIFT GUARD IS BLIND LOCALLY TO THE FILE A PR IS ADDING — `discoverCensusCandidates` probes with `git grep`, which searches TRACKED content only, so a new census-shaped suite is invisible on the author's machine and visible in CI where the tree is committed: the guard prints a clean zero and then reds the PR that adds the suite"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  risk: medium
  budget_usd: 8.00
  files: [src/lib/ci-parity.ts, test/census-discovery-sees-the-file-you-are-adding.test.ts]
  origin: "operator-session#4380-census-drift-false-clean-2026-09-07"
  plan_refs: ["W1-T2643", "W1-T2809", "W1-T2849"]
  status: merged
  attempts: 0
  rationale: |
    OBSERVED, NOT INFERRED. PR #4380 failed all four ci-shards on `undisclosed census-shaped
    file(s): test/rule-citation-gate-engine-portable.test.ts` AFTER a local run of the same guard
    printed clean. The file was untracked at the moment of the local run; `git grep` searches only
    tracked content, so the probe could not see it. In CI the tree is committed and it could.

    THE ASYMMETRY, DEMONSTRATED ON BOTH ENGINES rather than assumed: in a throwaway repo with one
    committed and one untracked census-shaped suite, `git grep -lE …` returns ONE file and
    `git grep --untracked -lE …` returns BOTH — on git 2.39.5 (container/CI) and git 2.54.0
    (workstation) alike. A gitignored census-shaped fixture is NOT returned by either, so
    `--exclude-standard` is unnecessary and is deliberately not added.

    COSTS NOTHING WHERE THE GATE IS AUTHORITATIVE. A CI checkout carries no untracked files, so the
    discovered set there is byte-identical with and without the flag. This changes only what an
    author sees before committing — which is the entire defect.

    SCOPE, MEASURED RATHER THAN ASSERTED. An earlier reading of this claimed "8 gate scripts, none
    of which pass --others". That count was a `grep -l` over files MENTIONING `ls-files`, including
    prose in comments, and is wrong. The real tracked-only enumerators are five scripts
    (mkdtemp-callsite-check, state-citation-check, tracked-source-write-check, unwired-gate-check,
    comment-load-ratchet) plus this probe; `source-size-ratchet` uses a directory walk and is not
    affected at all. Only the probe is fixed here, because only the probe has a measured failure.
  acceptance:
    - claim: "an untracked census-shaped suite is discovered, so the drift guard names it before the commit rather than in CI"
      proof: "unit test: test/census-discovery-sees-the-file-you-are-adding.test.ts"
    - claim: "a gitignored census-shaped file is still NOT discovered, so scratch cannot enter the population"
      proof: "unit test: test/census-discovery-sees-the-file-you-are-adding.test.ts"
    - claim: "on a fully committed tree — CI's shape — the discovered set is identical with and without the flag"
      proof: "unit test: test/census-discovery-sees-the-file-you-are-adding.test.ts"
    - claim: "the probe still makes exactly one discovery call and the recogniser is otherwise unchanged"
      proof: "unit test: test/census-discovery-sees-the-file-you-are-adding.test.ts"
  note: |
    THE FIX CAUGHT ITS OWN AUTHOR, WHICH IS THE BEST AVAILABLE EVIDENCE THAT IT WORKS: with the
    widening in place, `censusPopulationDrift` flagged this task's OWN new falsifier while it was
    still untracked, in the lane, before any commit. Its CENSUS_POPULATION entry is in this PR.

    NOT FIXED HERE, AND NAMED SO IT IS NOT LOST: the five `git ls-files` gate scripts above have
    the same local blindness. None has a measured failure yet, `git ls-files` needs a different
    flag (`--others --exclude-standard`) than `git grep` does, and widening a ratchet's population
    is a different risk from widening a discovery probe. That is a separate task if a failure
    ever justifies it.

    ID PROVENANCE: `rmd next-task-id --reserve` atomically reserved refs/rmd-id/W1-T3021.
