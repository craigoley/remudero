- id: W1-T191
  title: "TWO WRITE PATHS DIRTY THE DAEMON'S OWN CHECKOUT AND SO DISABLE ITS AUTO-SYNC — decision.autochoose appends to that checkout's DECISIONS.md and the console's feedback-decision route flips `status:` in its plan/feedback/*.yaml, neither commits, and checkCliFreshness then refuses every non-exempt rmd verb while the checkout is both dirty and behind origin/main"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 130.00
  note: "ORIGINAL RATIONALE, UNCHANGED, for full context on why the fix needed two write sites and
    what the concurrent-append hazard was. OBSERVED 2026-07-20/21 while recording an operator decision: the operator checkout
    (~/Remudero/remudero) showed `M DECISIONS.md` with THREE machine-written entries present in the working tree
    and absent from origin/main:
      2026-07-20T20:36:14.454Z — W1-T156 (W1-T156-1784579460422)
      2026-07-20T22:31:09.231Z — W1-T128 (W1-T128-1784586484416)
      2026-07-21T01:18:25.612Z — W1-T136 (W1-T136-1784596357757)
    Committed HEAD carried 29 entries, the working tree 32. Each corresponds to a real `decision.autochoose`
    ledger line, so the DECISIONS were made and acted on — only the AUDIT RECORD of them never left the disk.
    WHY IT HAPPENS (verify from source before building): the worker runs in its own worktree under
    ~/Remudero/worktrees/, and its PR contains that worktree's diff. But the decision log is written against the
    OPERATOR CHECKOUT's path — the same repoRoot-is-the-install-path behaviour that makes `rmd` gate the main
    checkout's plan regardless of cwd. So the append lands in a tree that no PR is ever cut from, and nothing
    stages, commits or pushes it.
    WHY IT MATTERS. DECISIONS.md is the append-only provenance record for every DECISION_REQUEST the control
    plane auto-resolved — MASTER-PLAN §4 names it as the rollback pointer for those choices. Today that record
    exists on exactly one machine, uncommitted:
      - `git checkout -- DECISIONS.md` in the operator checkout destroys it silently, and that is a routine
        command someone runs to clean a dirty tree;
      - any PR that touches DECISIONS.md conflicts with it or, worse, overwrites it from a clean base;
      - a second operator machine has no record at all;
      - the file is the audit trail for decisions the fleet MADE AUTONOMOUSLY, which is the record most needed
        when reconstructing why an unattended run chose what it chose.
    IT IS ALREADY LOSSY. The three entries above survived only because a dirty-tree check happened to notice
    them. How many earlier resolutions were lost to a clean-up or a checkout is not knowable from here — which is
    itself the argument for fixing it rather than periodically rescuing it by hand."
  design: |
    Make the decision record reach the repo by the same path every other artifact does — a PR — rather than by an
    operator noticing a dirty tree.
    VERIFY FROM SOURCE FIRST which path writes DECISIONS.md and against which root (the decision.autochoose
    handler, and whatever resolves the file's location). Distrust this note's account of repoRoot: it is inferred
    from the observed symptom plus the known install-path behaviour, not read from the writer.
    Options to weigh, not a prescription:
      (a) WRITE IT IN THE WORKER'S WORKTREE so the entry rides the worker's own PR — the decision and the code it
          governed land together, which is the strongest provenance and needs no new commit path. Risk: concurrent
          workers each appending to their own copy produces merge conflicts on a shared append-only file, which is
          exactly the class W1-T122 solved for plan/tasks.yaml by sharding.
      (b) EMIT PER-DECISION FILES (a decisions.d/ shard per resolution, one file per run id) so concurrent writes
          cannot conflict by construction — the W1-T122 pattern applied to this log. DECISIONS.md then becomes a
          rendered view or an index.
      (c) DERIVE THE LOG FROM THE LEDGER. Every entry already corresponds to a `decision.autochoose` line that IS
          committed-adjacent and durable. If the ledger holds the full option text, DECISIONS.md can be generated
          rather than appended, and the whole class disappears. VERIFY whether the ledger line carries the options
          and the chosen rationale, or only a reference — that determines whether (c) is possible at all.
    (c) IS THE FIRST TO CHECK, because deriving beats storing for the same reason it did in W1-T190: two writes
        drift, one source does not.
    RESCUE THE EXISTING THREE either way. Whatever mechanism ships, the three entries observed above must end up
    in the repo — they are already preserved in the PR that files this task, so the fix must not assume an empty
    starting state.

    ── FOLDED IN 2026-07-30 (was W1-T263, PR #958 closed as a duplicate) ───────────────────────
    THERE IS A SECOND WRITE PATH, and it is the same defect with a different artifact. The console's
    POST /v1/feedback/decision route (src/lib/panel-graph.ts:353, handler at :371) calls
    setFeedbackStatus(deps.root, id, status), whose sole write is
    writeFileSync(feedbackEntryPath(root, id), ...) at src/lib/feedback.ts:301. deps.root is the same
    repoRoot the daemon uses, so an operator clicking Accept in the console leaves a TRACKED
    modification in the checkout the daemon and the console both run from. Verified at origin/main
    e9fa9ac; these coordinates drift, re-read them before building.

    THE CONSEQUENCE THAT MAKES BOTH URGENT — and it is not durability. checkCliFreshness refuses when
    the checkout is BOTH behind origin/main AND dirty (src/lib/self-sync.ts:175 returns
    {status: "refused", reason: "dirty"}), and src/run-task.ts:10843 turns that into process.exit(1)
    for every non-exempt verb. Main moves several times an hour, so `behind` is the steady state and a
    lingering modification makes the refusal effectively permanent. The auto-sync that would clear
    `behind` runs through the same gate, so THE DIRT SWITCHES OFF ITS OWN REMEDY.
    Observed 2026-07-29/30: the daemon's plan went stale so the reviewer read superseded acceptance
    criteria; `rmd deploy-run` failed 35 consecutive times over five days without completing a cycle;
    a $100-budget run (W1-T253) was nearly judged against the wrong criteria and needed a hand pull.
    RECURRENCE IS LIVE: after a `git reset --hard origin/main` produced a clean tree, the same seven
    plan/feedback status flips reappeared within the hour, unprompted; a further unprompted flip
    (fb-1784770185732-e025c1.yaml) was observed on 2026-07-30 after those seven had landed via #956.

    THE ASYMMETRY THE CODE ALREADY STATES: src/lib/self-sync.ts:243 says "DIRT NEVER BLOCKS A SERVICE"
    — daemon and serve are exempt precisely because the daemon dirties its own tree. So the SERVICE is
    protected from this dirt and the PLAN is not. Do NOT "fix" this by exempting more verbs or widening
    that carve-out: the gate is correct, the writers are the defect. The last acceptance criterion
    exists to pin that.

    THE MECHANISM EXISTS AND IS NOT WIRED. src/lib/feedback-landing.ts implements a commit bridge whose
    doc at :24-27 states it "NEVER touches the caller's own working tree, index, or local branches" —
    exactly the missing property. It force-pushes a branch rebuilt from origin/main's current tip to
    LANDING_BRANCH ("feedback-landing", :46). Its ONLY call site is feedback.ts:252, inside
    captureFeedback; setFeedbackStatus (feedback.ts:286-303) does not call it at all, which is why the
    status flips sit uncommitted.

    THE TWO SITES NEED DIFFERENT-SIZED FIXES — size the work accordingly, do not assume symmetry:
      - WRITE SITE 2 IS THE CHEAP HALF. plan/feedback/<id>.yaml is one file per entry, so entries never
        collide and the bridge's force-push-from-current-tip is already safe for them. This is close to
        wiring landFeedback into setFeedbackStatus.
      - WRITE SITE 1 IS THE EXPENSIVE HALF, and the existing "concurrent resolutions cannot conflict"
        criterion above is why. DECISIONS.md is ONE shared append target: two concurrent appenders each
        rebuild from the same tip, each add their own record, and the second force-push silently
        discards the first — trading a visible dirty tree for INVISIBLE RECORD LOSS, which is strictly
        worse than the defect. The bridge does NOT generalise to it. Resolve that explicitly (shard per
        decision, derive from the ledger's decision.autochoose lines, or a read-modify-write retry
        against origin/main's current tip) before wiring anything.

