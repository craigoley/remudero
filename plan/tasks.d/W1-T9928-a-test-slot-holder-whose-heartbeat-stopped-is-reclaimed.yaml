  rationale: |
    READ 2026-10-16 19:33Z on the operator Mac (read-only; nothing was signalled, edited or deleted):
    - /tmp/rmd-test-slots/slot-1.json (0644, owner craigoley, legacy writer): pid 70214, host Craigs-Mac-mini,
      startedAt 17:28:50.350Z, heartbeatAt 17:33:16.319Z, label preflight-author:static-and-affected, concurrency 2,
      memoryBytes 1073741824, and no recorded heartbeat cadence. slot-2.json held native-author-runtime:sample.
    - pid 70214 (ps STAT Ss, 0% CPU, up 2 h 04 m) is `node --import tsx scripts/preflight-author.mjs` in a Codex
      checkout under OS user craigoley. Its child 52484 (scripts/lib/author-step-capture.mjs) STARTED AT 17:33:16Z, the
      same second as the last heartbeat. Grandchild 52489 is `node --test --test-concurrency=1` over 3645 test files
      (a full-fallback selection), and its current suite child was at 108% CPU. So the holder was WORKING. It was
      not hung. Its record had stopped beating.
    - Waiters' first `test_slot.waiting` row named "slot 1: mutation pending; coordination UNKNOWN" and "private
      coordination encountered; private writer remains gated". F7 saw an orphaned /tmp/rmd-test-slots/.slot-1.json.mutation
      (uid craigoleyagent, mtime 18:42:53Z, no process holding it open). It was gone by 19:34Z.
    WHY THE HEARTBEAT STOPPED. It was not an unref'd timer, and it was not a stuck await. preflight-author has no
    heartbeat timer at all. `main` calls `slot.refresh()` once, just before the affected-tests step. `runStep` then
    calls `captureStepSync`, which runs the step through `spawnSync`, and that blocks the event loop for the whole
    child run, hours for a full fallback. A timer added beside that call would be starved the same way.
    src/lib/test-run.ts `runBoundedTest` is the only caller with a timer: `setInterval(slot.refresh,
    TEST_SLOT_LEASE_MS / 3)`, unref'd, beside an async spawn. That is correct there.
    WHY A LIVE PID KEEPS ITS SLOT. In src/lib/test-slot.ts, `testSlotHolderStale` sends a same-host holder in the same
    pid namespace to `isHolderStale` (src/lib/fs-race-safe.ts), which reads only host, boot, pid liveness and start
    time. heartbeatAt is read only for a foreign host/namespace, against the fixed 90-minute TEST_SLOT_LEASE_MS backstop.
    WHY AN ORPHANED GUARD BLOCKS FOREVER. src/lib/test-slot-mutation.ts `acquireSlotMutation` creates the guard with
    `wx` and says "An abandoned or unreadable guard is never aged, retried or stolen". The guard is empty, so it names
    no writer. A writer killed between open and release, such as an agent killing its own waiting preflight, leaves it
    behind for good.
    WHY THE WAITER STAYS GATED. In `testSlotAcquisition`, a busy guard sets `privateRequired = true`, and nothing
    clears it. From then on, `memoryShort` returns "private coordination encountered; private writer remains gated"
    for EVERY slot on EVERY later poll. A legacy (non-private) waiter therefore cannot reach the reclaim branch, even
    after the guard is gone. It ends at TEST_SLOT_WAIT_BOUND_MS as NOT_RUN. So reclaiming the guard alone would not
    unblock the waiter that saw it.
    SWEEP 19:35Z: plan/tasks.d on origin/main for test-slot, heartbeat, mutation guard, privateRequired and slot reclaim
    (W1-T6090, W1-T6111, W1-T7093, W1-T7392, W1-T7809, W1-T8047, W1-T8230, W1-T9102, W1-T9541). None judges a live
    pid by its heartbeat, ages a mutation guard, or clears the sticky gate. 443 origin heads were diffed against main
    for these files. The only open edit is run-unfiled-1792161817235 (a worker ceiling, a different hunk). The
    run-W1-T8047-* and run-W1-T9541-* heads are leftovers of merged tasks.
  design: |
    Bounds come from the holder's own record or from what the waiter measured. There is no new wall-clock age, no
    LLM, and no change to private-capacity-v1's cross-account rule.
    1. A RECORD STATES ITS CADENCE. `TestSlotHolder` gains an optional `heartbeatIntervalMs`. A lease writes it ONLY
       while it really beats on a live event loop. A record without it keeps today's pid judgment. That covers every
       pre-fix checkout and every sync caller that blocks its loop (sweep the `acquireTestSlot(` callers:
       typecheck-run, commit-message, ci-parity, calibrate-author-runtime). Adding the field never makes a working
       but blocked holder look stale.
    2. PREFLIGHT-AUTHOR BEATS WHILE A STEP RUNS. The lease beats on an unref'd interval and records that interval.
       The step must not block that loop. Either move the step to an async spawn that `main` awaits, or have the
       capture subprocess, which already spools asynchronously, beat through a lease-provided handle that writes
       under the mutation guard with the owner's nonce. Pick one and name it. The record stops beating only when
       the beating process stops.
    3. A SILENT HOLDER IS STALE. In `testSlotHolderStale`, a record with `heartbeatIntervalMs` is stale when
       `now - heartbeatAt` exceeds the bound DERIVED from that interval: three missed beats, multiplied from the
       record's own interval. This applies even while its pid is live. The same derived bound replaces
       TEST_SLOT_LEASE_MS for a foreign-host/namespace record that states a cadence. TEST_SLOT_LEASE_MS stays only
       for cadence-less records.
    4. RECLAIM ONLY, NEVER SIGNAL. The existing `reclaimStaleLock` path unlinks a legacy record. The waiter logs
       `test_slot.stale_heartbeat_reclaimed` with slot, pid, host, label, startedAt, heartbeatAt,
       heartbeatIntervalMs, the derived boundMs and the observed silence. No waiter kills or signals any process,
       of any user. A private-capacity-v1 record of another uid stays "owner-lane release required" and is logged.
       The reclaimed holder's next refresh reads `refresh_lost`, as it does today.
    5. AN ORPHANED GUARD IS RECLAIMED. `.slot-N.json.mutation` is orphaned when BOTH hold:
       (a) its age is past a bound derived from the guard holds this waiter has itself measured (its own acquire to
           release durations, kept per acquisition; with none measured yet, it judges no guard);
       (b) a bounded liveness probe positively shows that no process holds it open. The writer keeps its descriptor
           until release, so this is an open-file check: lsof on darwin, a /proc/<pid>/fd scan on linux, run as the
           guard's own uid.
       An unknown, failed or foreign-uid probe keeps the guard and logs `test_slot.mutation_guard_unproven`. A
       reclaim logs `test_slot.mutation_guard_reclaimed` with path, uid, mtime, age, boundMs and probe. Optionally,
       new guards may carry the writer's pid/processStart, so a pid probe can stand in for (b). An empty guard from
       an older writer must still be judged by (b).
    6. THE GATE IS RE-DERIVED EACH POLL. Guard contention seen on an earlier poll is that poll's evidence only.
       Each poll recomputes whether private coordination is present from what it observes then: a 0600 record, or
       a guard that is still busy. A waiter therefore acquires on the first poll after the guard is gone or
       reclaimed. A 0600 private record still gates a legacy waiter, exactly as today.
    7. Tests go in the new file, with injected clock, isPidAlive and probe seams, plus one test that runs the real
       default open-file probe (doctrine coverage-traps/cover-the-real-default). The proofs below name the `test(`
       titles verbatim.
