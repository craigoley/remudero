  falsifier: |
    SAFETY COUNTEREXAMPLE: applying the original design's three-missed-beats reclaim to a fixture with a delayed
    or exited parent and a still-running validation child admits a second waiter into the same capacity. That
    result must fail the amended safety test. The fixed design keeps the slot through silence, surviving or
    reparented descendants and unprovable identity; the real child completes normally. Positive controls then
    admit one waiter only after verified exact-tree quiescence or identity-checked owner-assisted release after
    work ends. Deleting that safety condition must reproduce forbidden double admission, not merely change prose.
    RETAINED LIVENESS COUNTEREXAMPLES: an empty proven-orphan `.slot-1.json.mutation` stays "mutation pending;
    coordination UNKNOWN" on current main. Removing it after the first poll still leaves "private coordination
    encountered; private writer remains gated" until TEST_SLOT_WAIT_BOUND_MS, which returns NOT_RUN. Fix those
    paths without treating heartbeat age, parent death or missing evidence as proof that capacity is free.
