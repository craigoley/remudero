- id: W1-T9928
  title: "A TEST-SLOT HOLDER WHOSE HEARTBEAT STOPPED IS RECLAIMED, AND SO IS AN ORPHANED MUTATION GUARD — a same-host holder is judged only by its pid, so a live pid with a heartbeat silent for 2 h keeps its slot; an empty .slot-N.json.mutation guard whose writer is gone is never aged; and one contended guard leaves a legacy waiter gated for its whole wait. Beat the record on a live loop, judge it by its own recorded cadence, reclaim with a logged row"
