    LIVE-WORK SAFETY AMENDMENT 2026-10-16, directly approved by Craig:
    A missed heartbeat measures missing progress reporting, not process-tree quiescence. The original parent
    blocked in synchronous capture while its test grandchild was working, then completed naturally at 19:35:55Z
    (32774 tests, 9 failures); other bounded waits ended NOT_RUN. The prior origin's claim that each agent killed
    its own run is not supported. Recovering the exact orphaned mutation guard was a separate, one-shot,
    owner-assisted action and did not release the live slot or authorize further recovery.
    PR #12422 filed this queued design; it did not implement it. The safety finding is recorded at
    https://github.com/craigoley/remudero/pull/12422#issuecomment-6223684599.
    Node child-process documentation distinguishes parent exit from descendant exit; Linux cgroup-v2's
    populated notification covers live processes throughout a known sub-hierarchy. Neither a parent's dead pid
    nor an empty current PPID walk proves an untracked or reparented descendant ended. These are design
    constraints, not permission to create cgroups, move processes, signal workers or change live guards.
    References: https://nodejs.org/api/child_process.html#subprocesskillsignal and
    https://docs.kernel.org/admin-guide/cgroup-v2.html#un-populated-notification.
  design: |
    Bounds come from the holder's own record or from what the waiter measured. There is no new wall-clock age, no
    LLM, and no change to private-capacity-v1's cross-account rule.
    1. A RECORD STATES ITS CADENCE. `TestSlotHolder` gains an optional `heartbeatIntervalMs`. A lease writes it ONLY
       while it really beats on a live event loop. A record without it keeps today's pid judgment. That covers every
       pre-fix checkout and every sync caller that blocks its loop (sweep the `acquireTestSlot(` callers:
       typecheck-run, commit-message, ci-parity, calibrate-author-runtime). Adding the field never makes a working
       but blocked holder look stale.
    2. PREFLIGHT-AUTHOR BEATS WHILE A STEP RUNS. The lease beats on an unref'd interval and records that interval.
       The step must not block that loop. Either move the step to an async spawn that `main` awaits, or have the
       capture subprocess, which already spools asynchronously, beat through a lease-provided handle that writes
       under the mutation guard with the owner's nonce. Pick one and name it. A stopped beat, including one
       caused by delayed scheduling, parent failure or a blocked event loop, is never proof that its work ended.
    3. SILENCE IS NOT QUIESCENCE. Three missed recorded intervals may trigger a bounded observation and a
       diagnostic, never reclaim, expiry or free capacity. Retain the reservation while any covered child or
       descendant remains live, even if the parent died or its PID was reused. For new reclaim behavior require
       positive, complete evidence that the exact reserved process tree ended or an identity-checked owner-assisted
       release. Bind evidence to host/boot/namespace, owner, process start and reservation nonce/generation; check
       the same reservation again under its mutation guard before release. A current PPID-only walk after parent
       death is insufficient: reparented or detached descendants must be covered by the recorded run identity.
       Unknown, incomplete, failed, unsupported or foreign-namespace probes keep capacity reserved and expose the
       reason. Missing legacy identity requires owner assistance, not an invented lease expiry. Do not introduce
       a shorter foreign-host/namespace lease or change cadence-less compatibility behavior in this task.
    4. RELEASE PROVEN CAPACITY, NEVER SIGNAL. Before unlinking a holder record, the reclaim path verifies the
       evidence from (3) for that exact record. Owner assistance is an identity-checked release after covered work
       has safely ended, not authority to free a live child's capacity. Log the decision's actual reason,
       reservation identity, probe coverage and terminal or owner-release evidence; heartbeat silence remains
       diagnostic context, not a `stale_heartbeat_reclaimed` justification. Identity drift or a late refresh holds
       the record for re-observation. Preserve today's lost-refresh fencing. No waiter kills or signals any
       process, of any user. A private-capacity-v1 record of another uid stays "owner-lane release required".
       This plan amendment changes no live claims, reservation limits, safety settings or protocol activation.
    5. AN ORPHANED GUARD IS RECLAIMED. `.slot-N.json.mutation` is orphaned when BOTH hold:
       (a) its age is past a bound derived from the guard holds this waiter has itself measured (its own acquire to
           release durations, kept per acquisition; with none measured yet, it judges no guard);
       (b) a bounded liveness probe positively shows that no process holds it open. The writer keeps its descriptor
           until release, so this is an open-file check: lsof on darwin, a /proc/<pid>/fd scan on linux, run as the
           guard's own uid.
       An unknown, failed or foreign-uid probe keeps the guard and logs `test_slot.mutation_guard_unproven`. A
       reclaim logs `test_slot.mutation_guard_reclaimed` with path, uid, mtime, age, boundMs and probe. Optionally,
       new guards may carry the writer's pid/processStart, so a pid probe can stand in for (b). An empty guard from
       an older writer must still be judged by (b).
    6. THE GATE IS RE-DERIVED EACH POLL. Guard contention seen on an earlier poll is that poll's evidence only.
       Each poll recomputes whether private coordination is present from what it observes then: a 0600 record, or
       a guard that is still busy. A waiter therefore acquires on the first poll after the guard is gone or
       reclaimed. A 0600 private record still gates a legacy waiter, exactly as today.
    7. Tests go in the new file, with injected clock, isPidAlive and probe seams, plus one test that runs the real
       default open-file probe (doctrine coverage-traps/cover-the-real-default). Add a real child-process control:
       delay or stop the fixture parent's beats while its test child remains active; a second waiter must not
       acquire the same capacity, and the child must finish normally. Cover parent exit with a surviving child,
       PID/start or nonce mismatch, partial/failed probes, and unknown owner identity as non-release controls.
       Positive controls prove exact-tree terminal evidence and identity-checked owner release admit a waiter
       only after covered work ends, with no signal sent by reclaim. Test both Linux and Darwin default evidence
       paths where supported; unsupported or insufficient evidence stays reserved, never silently skips safety.
       The proofs below name the `test(` titles verbatim.
