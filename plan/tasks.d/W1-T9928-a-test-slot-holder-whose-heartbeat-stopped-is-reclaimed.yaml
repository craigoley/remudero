    WHY THE HEARTBEAT STOPPED. It was not an unref'd timer, and it was not a stuck await. preflight-author has no
    heartbeat timer at all. `main` calls `slot.refresh()` once, just before the affected-tests step. `runStep` then
    calls `captureStepSync`, which runs the step through `spawnSync`, and that blocks the event loop for the whole
    child run, hours for a full fallback. A timer added beside that call would be starved the same way.
    src/lib/test-run.ts `runBoundedTest` is the only caller with a timer: `setInterval(slot.refresh,
