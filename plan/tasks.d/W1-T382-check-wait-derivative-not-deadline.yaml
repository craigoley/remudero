  note: "verify:auto — the predicate is pure over `RollupEntry[]`, so all three directions assert
    in-process with no network, no clock and nothing spawned.
    risk:high IS SET BY RULE 19's SPAN AND BY BLAST RADIUS BOTH, unusually. Rule 19 scores `files:`
    as two concerns (run-task, check-wait-progress) and decomposing would be wrong — a predicate
    cannot ship without the falsifier that proves it bites once and holds twice. But the radius is
    genuinely wide too: this decides whether a run abandons a PR, and the failure directions are
    asymmetric — too eager abandons healthy work (today's defect, 21 for 21), too patient leaves a
    worker polling a genuinely stuck PR until its own budget cap. Direction 1 of the falsifier is
    what stops the fix overshooting into never-concluding.
    budget_usd 55 — the predicate is small; the cost is the three-direction falsifier plus wiring it
    into BOTH `waitForCiGreen` and `pollToGate`, which carry the same bound and the same defect.
    WHY A NUMBER IS THE WRONG DELIVERABLE HERE, restated so it is not relitigated: the recon
    measured 21 of 21 booked PRs later merging. There is no observed `stuck` population, so there is
    no gap and no threshold. Raising `maxIters` changes how often the bug fires, not whether it is a
    bug — the same distinction W1-T380 had to draw about raising `pruneGraceMs`."
