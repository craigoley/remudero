  rationale: |
    MEASURED on origin/main bbab8894f, 2026-10-13. src/run-task.ts is 57,478 lines. Of 329 open tasks (no
    `Remudero-Task:` trailer on main, and a shard status that is not merged, retired, done or blocked), 105 declare it
    in `files:`, including 24 of the 48 dependency-met auto tasks at priority <= 1.5. It was touched by 713 of 4,523
    main commits in 30 days. The refill pool never overlaps a running lane's files (W1-T8502), so one build holding it
    serializes every other run-task.ts task. The diagnosis saw it held from 20:12Z to 22:00Z on 2026-10-13.
    CHURN, from `git log --since=30.days -p --unified=0 -- src/run-task.ts`, attributing each hunk to its enclosing
    top-level declaration: runTaskBody and runTask were changed by 149 of those 713 commits (109 and 40), with 2,020 changed lines. The split takes verbs in that churn order:
    W1-T9332 (run-task), W1-T9333 (daemon), W1-T9337 (fix), W1-T9338 (sweep) and W1-T9339 (review). This step moves runTaskBody (about 2,990 lines) and runTask (about 620).
    THE SEAM. W1-T2893 made `main()` dispatch through src/cli/registry.ts, but left every handler body in
    run-task.ts. A moved handler still reaches many run-task.ts helpers. W1-T9331 forbids importing them (a cycle with
    HANDLERS). So this step passes them in through one host parameter, the repo's existing `*Deps` pattern, instead of
    moving the whole reachable graph at once.
    The module is named run-task-verb.ts, not run-task.ts, so no path-suffix match on `run-task.ts` (the depcruise rule `^src/(spike|run-task)\.ts$`, scripts/rmd-help.mjs, census filters) can mistake it for the entrypoint.
    NOT IN SCOPE: re-pointing open shards that declare src/run-task.ts for this verb. A shard edit cannot ride a code
    PR (rule 15). The note names the plan-only follow-up.
  design: |
    1. Create src/cli/commands/run-task-verb.ts. Move runTask, runTaskBody into it, plus every top-level run-task.ts symbol whose references all lie inside
       the moved set. Find that set with a reference census over run-task.ts at the build's base: a symbol moves when
       no reference to it remains outside the set. Keep each moved body verbatim, apart from reading its collaborators
       from the host, so diff-coverage's relocation exemption (W1-T2325, W1-T3138) reads the moved lines as moved
       code rather than new code.
    2. Any other run-task.ts symbol the moved code reaches arrives through one exported
       `RunTaskCommandHost` interface, taken as a parameter. src/lib symbols are imported
       directly. A collaborator that an earlier step already moved into src/cli/commands/ is imported from there. The
       module imports nothing from src/run-task.ts (W1-T9331's `cli-no-run-task`).
    3. src/run-task.ts imports the moved roots from "./cli/commands/run-task-verb.js" under local aliases named `<root>FromModule`. It keeps every moved root that
       was exported, or that another run-task.ts symbol calls, as a thin function with the same name and signature. That
       function builds the host from run-task.ts's own symbols and delegates to the module. HANDLERS, every in-file
       caller, and every test that imports a root from src/run-task.ts stay unchanged.
    4. Unchanged: COMMANDS (scripts/rmd-help.mjs source-scans that array), and the verb's behaviour, ledger rows,
       stdout and exit codes. Existing behavioural assertions and their fixtures/falsifiers stay unchanged.
       Only the explicitly declared source-reader companion suites may retarget the implementation's physical
       location from src/run-task.ts to src/cli/commands/run-task-verb.ts, or distinguish the retained wrapper
       from the moved body. Caller/source ownership inventories may rekey an existing site to its actual module;
       they may not add a site, remove an assertion, weaken an ordering check, add an exclusion or increase an allowance.
       No combined prose/source facsimile may stand in for the actual executable declaration under test.
       Add exactly one truthful AUTHORITY_TABLE row for the moved restoreBoundaryCheckpoint branch-recreation
       write, describing its real absence/exact-head/lease preconditions and existing ledger step. This is a report
       entry for an existing write, not new write authority or a new assertion that a live-write guard exists.
       docs/base-ref-contract.md may retarget only its irreversibleSignalForWorktree citation to the actual
       implementation. scripts/comment-load-baseline.json may only record the extraction's normally generated
       non-growth changes; no limit or measured count is raised to pass this task.
       Every other gate keeps its original population and enforcement. In particular clock, catch-erasure, bound,
       house-layout and sync-spawn checks must be satisfied by faithful implementation and existing semantics;
       no threshold, baseline allowance, scanner setting or acceptance proof is relaxed by this amendment.
       A gate requiring a separate relocation-only baseline ruling is escalated with exact per-site evidence.
