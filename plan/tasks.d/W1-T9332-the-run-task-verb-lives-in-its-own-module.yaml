       in the module; global recorded totals remain 97/150/216. No clock or catch behavior changes.
       For house-layout ONLY, preserve the raw physical-file census and grant one duplicate-file
       adjustment for each of plan/tasks.d, MASTER-PLAN.md, .remudero/ and learnings/ ONLY when the
       merge base has the original src/run-task.ts owner and has no extracted module, both current
