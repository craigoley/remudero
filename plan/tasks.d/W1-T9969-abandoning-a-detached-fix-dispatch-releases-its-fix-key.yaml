  falsifier: |
    The #12413 timeline in miniature:
    - claim key K at t0;
    - the fake dispatch enters its admission wait;
    - a second pass at t0+30 min is refused;
    - the drain abandons the action at t0+43 min;
    - a third pass at t0+44 min.
    At origin/main, the second pass's reason says "a concurrent sweep is already dispatching", so the naming test
    fails. The abandonment changes nothing, so the third pass is refused again and the release and re-admission tests
    fail. With the fix, the second pass names "admission for 1800s". The abandonment aborts the wait, writes
    `fix.done` admission_abandoned with no strike and frees K. The third pass claims K, and its admission's since is t0.
    Ways to break it, and the test that catches each:
    - Release the key on abandonment WITHOUT ending the wait: the fake's wait completes and starts a worker beside the
      third pass's round, and the no-worker test fails.
    - Abort a live worker's key: the live-worker test fails.
    - Start the re-dispatch's admission at its own time: the admission-age test fails.
