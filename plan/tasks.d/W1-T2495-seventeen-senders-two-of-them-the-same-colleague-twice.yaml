  rationale: |
    A MESSAGE WITHOUT A SENDER IS A NOTIFICATION, AND THIS IS THE CHEAPEST HALF OF MAKING THE INBOX
    READ LIKE CORRESPONDENCE. Every row the fleet writes carries a task id, and where no plan task
    owns the work it carries a pseudo id instead. Seventeen of those exist. They were never designed
    as identities — they are labels each producer chose for itself — and it shows.
    SURFACE 1 distinct pseudo sender ids written to the ledger = 17
    SURFACE 2 of those, pairs differing only by case = 2
    SURFACE 3 modules that raise an escalation = 14
    SURFACE 4 declared sender registries that exist today = 0
    SURFACE 5 feedback entries already landed the other way = 155

    THE CASE PAIRS ARE A CORRECTNESS BUG BEFORE THEY ARE A COSMETIC ONE. `DAEMON` and `daemon` are
    one producer and two keys; so are `RETRO` and `retro`. Anything that groups, counts, dedups or
    threads by that id sees two colleagues where there is one, which means a per-producer rate is
    computed over a split denominator and a thread keyed on producer identity (W1-T2494) would fork.
    That is why this is filed as its own task rather than as presentation.

    A REGISTRY, NOT A NORMALISER, AND THE DIFFERENCE MATTERS. Lower-casing at the read site would
    paper over the split and leave the next producer free to invent an eighteenth spelling. A
    declared registry — each producer named once, with the human-readable display name the console
    shows — makes an undeclared sender a REFUSAL rather than a silent new row, which is the only
    version of this that does not regenerate its own backlog.

    THE SEVENTEEN ARE A BASELINE, NOT A BLOCKAGE, exactly as W1-T2487 and W1-T2491 handle theirs:
    the existing spellings are declared as they stand, the two case pairs are collapsed to one
    entry each, and what the gate owns is that an EIGHTEENTH undeclared sender cannot appear. No
    historical ledger row is rewritten — the archives are append-only and rewriting them would
    destroy the record this repo already refuses to delete.

    THE DISPLAY NAME IS THE POINT AND IS NOT DECORATION. `DAEMON` is not a colleague's name; it is
    a log prefix. The registry carries what the console prints, so a thread reads as being from
    something a human recognises without an operator having to learn seventeen internal labels.

    NOT IN SCOPE: renaming any pseudo id in the ledger's own rows; the thread model, which W1-T2494
    owns; the console rendering, which W1-T2497 owns; and plan task ids, which are unaffected.

    THE RISK BAND IS RULE 19's SPAN, NOT BLAST RADIUS: two src stems plus a test, carrying two
    independent acceptance concerns — the registry's refusal and the case-pair collapse.
