- id: W1-T2495
  title: "SEVENTEEN SENDERS WRITE TO THE LEDGER AND TWO OF THEM ARE THE SAME COLLEAGUE TWICE — the pseudo task ids include the case-variant pairs DAEMON/daemon and RETRO/retro, none of them is a plan id, and no registry declares any of them, so a message has no From line a human could recognise and one producer's rows split across two keys"
