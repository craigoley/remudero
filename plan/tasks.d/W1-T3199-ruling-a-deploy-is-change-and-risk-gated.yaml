- id: W1-T3199
  title: "DESIGN RULING: A DEPLOY IS CHANGE-AND-RISK GATED, NOT HUMAN GATED — the supervisor already detected `daemon running stale code` SIX times and declined every one for want of an operator marker, and its restart path is `launchctl`, which does not exist on the Azure Linux host the fleet has run on since 2026-08-13"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  risk: high
  budget_usd: 3.00
  files: [DECISIONS.md]
  origin: "operator-session#deploy-gate-2026-09-08"
  plan_refs: ["W1-T3200", "W1-T3201", "W1-T3166"]
