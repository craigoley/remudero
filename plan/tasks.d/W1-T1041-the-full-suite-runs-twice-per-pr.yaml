    AMENDED 2026-09-02 (third) — THE MECHANISM IS GONE, AND TWO PREMISES MOVED UNDER THIS
    SHARD. EVIDENCE ONLY: NO RULING IS MADE HERE AND NO HARNESS IS RECOMMENDED.
