- id: W1-T1041
  title: "THE FULL ~7,900-TEST SUITE RUNS TWICE PER PR — `ci` and `coverage-ratchet` each run the identical glob under a DIFFERENT harness, so one PR spends 1,178s of billed runner time on the same tests and gives every external failure two chances to land; establish whether one run can serve both, and rule on which harness survives if it cannot"
  repo: remudero
  depends_on: []
  type: implement
  verify: human
  principles: {tdd: strict}
  budget_usd: 30.00
  rationale: |
    MEASURED 2026-08-19 on Craigs-Mac-mini under /bin/zsh 5.9, against origin/main 00a1f584 in a
    scratch worktree. Population: the 600 most recent retained runs of `.github/workflows/ci.yml`
    (2026-08-15T01:24Z .. 2026-08-19T21:12Z), all 7,804 of their job rows, and the step detail of
    every non-success `ci`/`coverage-ratchet` job in that window. Zero `/rate_limit` calls.
    POSITIVE CONTROL ON THE JOB CENSUS: each of `ci`, `coverage-ratchet`, `lint-plan`, `claims`,
    `commitlint`, `depcruise` and seven more reads exactly 600 rows, so no run is half-read.

    (1) THE DUPLICATION IS REAL, AND CONFIRMED FROM THE TWO COMMANDS RATHER THAN ASSUMED.
    `ci`'s Test step runs `npm run test:ci`, which package.json expands to
      node --test --import tsx --import ./test/setup/tmp-hygiene.ts "test/**/*.test.ts"
    `coverage-ratchet`'s Test-with-coverage step runs
      node --enable-source-maps --experimental-test-coverage --test-coverage-exclude="test/**"
           --test-reporter=spec --test-reporter-destination=stdout
           --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
           --test --import tsx "test/**/*.test.ts"
    THE GLOB IS BYTE-IDENTICAL. Both route through `scripts/test-with-retry.mjs` (W1-T255), so a
    red run re-runs the WHOLE command once — four full suite executions per failing PR, not two.
    NO OTHER JOB RUNS THE SUITE: `containment-probe` names one file, and `mutation-ratchet`'s
    `commandRunner` was scoped to two files by W1-T133. The duplication is exactly 2x, not 3x.

    (2) THE COMMANDS DIFFER IN THREE WAYS, AND ONLY TWO ARE INSTRUMENTATION.
    Coverage flags and reporters are the expected two. THE THIRD IS NOT INSTRUMENTATION AT ALL:
    tmp-hygiene is loaded by ci and NOT by coverage-ratchet. `test/setup/tmp-hygiene.ts` (W1-T131)
    WRAPS `fs.mkdtempSync` via `syncBuiltinESMExports()`, rewrites every fixture's temp prefix
    through `reapableTmpPrefix`, and sweeps the dirs on exit. So the two jobs do not merely measure
    the same run differently — they run the fixtures under different filesystem behaviour.

    (3) AND THEY DEMONSTRABLY DISAGREE, IN BOTH DIRECTIONS. 12 of 600 runs disagreed at the test
    step: 10 where `coverage-ratchet` failed while `ci` passed, and 2 the other way. EVERY ONE
    produced a complete summary on BOTH attempts, so none is a truncated run.
    SEVEN OF THE TEN ARE THE SAME FOUR TRIAGE TESTS ON SEVEN UNRELATED BRANCHES inside one 90
    minute window on 2026-08-19 — `dependabot/npm_and_yarn/stryker-mutator/core-10.0.0`,
    `ci/widen-licence-allow-list`, `docs/operator-rulings-t472-t446-w12t1`, `run-W1-T1020-…`,
    `run-W1-T975-…`, `run-W1-T1027-…`, `run-W1-T952-…`, `run-W1-T963-…`. Seven branches sharing one
    failure set is not seven defects; it is one harness disagreeing with the other on the same
    code. The failures are ordinary assertion errors (`The input did not match the regular
    expression /rejected/`), not coverage-channel crashes, so they cannot be waved off as noise.
    THIS IS THE POINT OF THE TASK: merging the two runs means DELETING ONE OF TWO VERDICTS THAT
    HAVE BEEN MEASURED TO DIFFER. Which one survives is an operator ruling, not a worker's call.

    (4) THE COST, PRICED FROM STEP TIMINGS RATHER THAN JOB TOTALS. On run 32277465976 (both green)
    the three coverage-gate steps took 0s each — base diff, `diff-coverage.mjs`, `coverage-ratchet
    .mjs`. `coverage-ratchet` spent 772s of 798s inside the suite and 26s on everything else; `ci`
    spent 662s of 700s inside the suite and 38s on everything else. Over the 600-run window:
    `ci` p50 479s / p95 803s (n=501 green), `coverage-ratchet` p50 699s / p95 1205s (n=475 green).
    So a PR spends 1,178s of billed job time at p50, of which roughly 441s is a second execution
    of tests already run. CI RAN 115 TIMES PER DAY on the three complete days in the window
    (08-16 139, 08-17 92, 08-18 114) against 56-72 SQUASH MERGES PER DAY — the multiplier is
    PUSHES, not merges, and the brief's 15-30/day understates it by four to seven times.

    (5) THE EXPOSURE, CLASSIFIED EXTERNAL VERSUS REAL BY THE SUMMARY RULE — AND THE RULE NEEDED
    CORRECTING FIRST. THE SPEC REPORTER WRITES A DIFFERENT SUMMARY LINE than the default one, so a
    classifier keyed only on the TAP form scores every `coverage-ratchet` failure as "no test
    result" and misclassifies 10 real failures as infrastructure. Corrected to accept both forms:
      - 52 runs had exactly one of the two fail while the other passed.
      - 30 of those are `coverage-ratchet`'s Diff-coverage step: REAL, and the job's unique signal.
      - 12 are the test-step disagreements of (3): REAL on both sides, full summaries.
      - 10 are the Playwright install step: EXTERNAL, no summary in EITHER form.
    ALL 18 install failures across the whole window (10 `ci`, 8 `coverage-ratchet`) are the apt
    lock, every one before #2226 merged at 16:37:12Z. ZERO CDN 403s appear anywhere in the window
    (control: `Could not get lock` matches in all 18, and `cdn.playwright` appears in 12 of the 22
    logs read) — that cause is NOT REPRODUCED here and this shard does not carry it as measured.

    ── AMENDED 2026-08-27: TWO FACTS FOR THE OPEN RULING (evidence only; no ruling is made here) ──

    (6) A FRESH INSTANCE OF THE DISAGREEMENT — AND IT CONFIRMS (3) RATHER THAN DISCOVERING IT. This
    amendment does not report a new phenomenon: (3) above already measured 12 of 600 runs disagreeing,
    10 one way and 2 the other, with a named seven-branch cluster. What follows is one more instance,
    on two PRs whose diff is a SINGLE YAML FILE each, verified over REST at 2026-08-27.

    ON ATTEMPT 1 OF EACH: PR #3134 (head 72a65c8e, 1 file) — `ci` SUCCESS in 626s, Test step 589s;
    `coverage-ratchet` NOT-SUCCESS at 2367s, Test-with-coverage step 2329s. PR #3135 (head 49bd5648,
    1 file) — `ci` SUCCESS in 720s, Test step 681s; `coverage-ratchet` NOT-SUCCESS at 2356s, step
    2322s. Same suite, same head, opposite verdicts, on a diff that touches no source at all.

    ⚠ AND THE CONCLUSION IS `cancelled`, NOT `failure` — CORRECTED AGAINST THE API RATHER THAN
    CARRIED. The brief that prompted this amendment recorded these as failures naming
    `test/daemon.test.ts:2296` with `tests 10797 pass 10795 fail 1`. The GitHub API reports the job
    conclusion as CANCELLED for both. The test-level detail lives in the job log, which is
    unreadable from the container this was written in (the logs endpoint redirects to a blob host the
    egress proxy refuses), so THAT detail is the operator's attributed measurement and is not
    re-derived here. The conclusion, the durations and the step timings ARE re-derived. The
    distinction matters, and (8) below is why.

    (7) AND ONE OF THE TWO NEVER RUNS AGAINST MAIN, SO ITS GREEN THERE IS VACUOUS — THIS IS THE PART
    (1)-(5) DID NOT COVER. `.github/workflows/ci.yml` guards the coverage job's real work with
    `[ "${GITHUB_EVENT_NAME}" = "pull_request" ] || { echo "W1-T1033: coverage-ratchet is PR-only;
    skipping..."; exit 0; }`. MEASURED on two completed push-event runs on main (33117783544,
    33116854470): `coverage-ratchet` reports SUCCESS with a whole-job duration of 27s and 35s, and
    steps 6, 7, 8 and 9 — Test-with-coverage, the base..head diff, diff-coverage and the ratchet —
    each ran 0s. CONTROL, the same job on PR heads the same day: 1130s (#3134), 1100s (#3135), 1123s
    (#3136). So on main the job runs none of its own checks and reports green, AND IT IS A REQUIRED
    CONTEXT. A required check that cannot fail on the branch it protects is a different property from
    duplication, and it belongs to the same ruling.

    (8) THE AMPLIFIER, RECORDED SO NOBODY MISREADS THE DURATIONS ABOVE. (1) already notes that both
    jobs route through `scripts/test-with-retry.mjs` (W1-T255) and that a red run re-runs the whole
    command once. WHAT IS ADDED HERE IS THE ARITHMETIC AND ITS CONSEQUENCE: one failing test doubles
    a 761-1414s job to roughly 2350s. Against the job cap that lands either side of the line — under
    it the job reads `failure`, over it `cancelled` — which is exactly what (6) shows, a 2329s step
    at roughly twice the 1130s single pass. THAT IS WHY A ONE-YAML DIFF CAN PRESENT AS A TIMEOUT, and
    why a reader comparing raw job durations across the two harnesses will over-state the gap unless
    they first ask whether the retry fired.

    (9) WHAT THIS AMENDMENT DOES NOT DECIDE, STATED SO THE SCOPE STAYS WHERE IT WAS FILED. It makes
    NO RULING and recommends NO HARNESS. The question this task already poses — whether one run can
    serve both, and which survives if it cannot — is unchanged and still open; (6) and (7) are
    evidence for it, nothing more. It proposes removing NEITHER job, changing the PR-only guard, nor
    touching any `timeout-minutes`.

    AND W1-T1033 OWNS "NOTHING RUNS THE SUITE AGAINST MAIN". Its PR-only guard is A DELIBERATE COST
    CHOICE, NOT AN OVERSIGHT — the workflow says so in its own comment at the `on:` block, and the
    guard is repeated at four steps and eighteen job-level `if:` lines, which is not what an accident
    looks like. Whether main SHOULD run under coverage is part of the same ruling this task asks for,
    not a separate defect, and (7) is recorded here because it changes what that ruling costs — not
    as a complaint about the guard.
  design: |
    THE DELIVERABLE IS A MEASURED ANSWER AND A RULING. The arithmetic is recorded here; the choice
    is not made here, because (3) shows the two harnesses produce different verdicts on the same
    code and picking one discards a signal.

    (i) THE ARTIFACT PATH, CONCRETELY, AND WHAT IT COSTS.
    `actions/upload-artifact` is ALREADY used at a pinned sha in five workflows
    (043fb46d1a93c77aae656e7c1c64a875d1fc6a0a), and `actions/cache` already appears in ci.yml, so
    the mechanism needs no new dependency. AND THE CONSUMER JOB IS GENUINELY CHEAP: both
    `scripts/diff-coverage.mjs` and `scripts/coverage-ratchet.mjs` import ONLY `node:` builtins, so
    the downstream job needs no `npm ci` and no Playwright at all. Checkout at fetch-depth 0 (4s
    measured), setup-node, a download, and three steps that measured 0s: call it 25-40s against
    today's 798s.
    THE UPSTREAM SIDE IS WHERE THE COST SITS. `ci` would have to run the INSTRUMENTED command to
    emit an lcov, which is the slower of the two (p50 699s vs 479s), so the saving is not one whole
    job. At p50: 1,178s today versus roughly 746s merged — about 432s per run, 828 billed
    job-minutes per day at 115 runs, near 14 job-hours daily. THE LCOV'S SIZE IS NOT MEASURED HERE
    and must be: 121 src files / 84,767 lines bound it at a few MB, and an artifact round-trip that
    approaches the re-run cost would leave only the exposure halving.
    AND WALL-CLOCK GETS WORSE, NOT BETTER. The two jobs run FULLY IN PARALLEL today — `needs:`
    appears in this repo only inside three COMMENTS and governs ZERO jobs (control: `runs-on:`
    appears 13 times in ci.yml alone). Wall-clock today is max(700s, 798s). Serialised behind
    `needs: ci` it becomes the sum, so the board waits LONGER per PR while the bill falls.
    THE SKIP HAZARD MUST BE SETTLED BEFORE ANY `needs:` LANDS. A `needs:`-dependent job whose
    dependency fails is SKIPPED, and ci.yml's own header names a skipped required check as a
    permanent merge deadlock. Today `coverage-ratchet` is listed in ci-gate.yml's expected-check
    env BECAUSE it is unconditional, and ci-gate treats skipped/neutral/success alike — so a
    skipped coverage gate would read as PASS rather than deadlock. That is the OPPOSITE failure and
    it is worse: the per-diff coverage gate could go silently absent. Branch protection requires
    only `remudero-review` and `ci-gate`, so the aggregator is the surface that must be re-derived.

    (ii) WHAT WOULD STILL FAIL AFTERWARDS — THIS IS A HALVING, NOT A CURE, AND ONE MEASURED EVENT
    PROVES IT. On run 32294506354 A RUNNER PREEMPTION TOOK BOTH JOBS IN THE SAME RUN: `ci` died at
    770s and `coverage-ratchet` at 980s, each with `The runner has received a shutdown signal` and
    `The operation was canceled`, neither naming a failed step. One job instead of two would have
    changed nothing there. The same holds for 3 of the 15 apt-poisoned runs, where BOTH jobs hit
    the lock. Honest arithmetic: 18 external job failures over 1,200 job-instances is 1.5% per job;
    at one job per run the poisoned-run count falls from the observed 15 to about 9. THAT IS A 40%
    REDUCTION, NOT 50%, and it is the whole benefit on the exposure side.

    (iii) WHAT THIS TASK MUST NOT DO.
      - IT MUST NOT REMOVE `coverage-ratchet`'s SIGNAL. The Diff-coverage step alone accounts for
        30 of the 52 single-job failures — the target is running the tests twice, not measuring
        coverage.
      - IT MUST NOT PROPOSE A MERGE QUEUE OR `required_status_checks_strict`. Both were costed in
        W1-T1014 and neither touches duplication.
      - IT MUST NOT PROPOSE A RETRY, A LONGER CAP, OR A CACHE. A preemption killed the process and
        a CDN refusal is upstream; `test-with-retry.mjs` already retries and did not help.
      - IT MUST NOT RE-FILE THE FIX-RUNG MISROUTING. W1-T1009's rationale already records the
        sweep dispatching a paid ci-log worker at an infrastructure stall; cited, not absorbed.

    (iv) RULE 25 RE-DERIVED AGAINST THE LIVE PREDICATE, FOUR CONTROLS, ONE OF THEM FIRING.
    `INSTRUMENT_SURFACE` (`src/lib/review.ts`) leads with `^\.github/workflows/`, so both files in
    `files:` are instrument surface and THE IMPLEMENTING PR RIDES ALONE. Driving
    `detectInstrumentEntanglement` directly: `[ci.yml]` alone reads CLEAN; `[ci.yml,
    src/lib/review.ts]` reads ENTANGLED — the falsifier, proving the check is live rather than
    vacuous; `[ci.yml, test/workflow-playwright-install.test.ts]` reads CLEAN because `test/` is
    excluded from `isProductPath`; and `[src/lib/review.ts]` alone reads CLEAN. So the two test
    files may ride with the workflows and no `src/` path may.

    (v) TWO TESTS KEY ON THE JOBS' SHAPE AND BOTH NEED RE-DERIVING IF IT CHANGES.
    `test/workflow-job-timeouts.test.ts` asserts `playwrightJobs.length > 0` AND
    `assert.deepEqual([...playwrightJobs].sort(), ["ci","coverage-ratchet"].sort())`, so dropping
    the browser from the consumer job breaks the set assertion, not just the count.
    `test/workflow-playwright-install.test.ts` asserts the two install `run:` lines are
    byte-identical (W1-T1027, #2226) — a shape that becomes meaningless the moment only one job
    installs a browser. RE-DERIVE BOTH; do not delete either.

    ────────────────────────────────────────────────────────────────────────────────────────
    AMENDED 2026-08-27 (second) — THE MECHANISM OF DISAGREEMENT, NAMED. EVIDENCE ONLY: NO
    RULING IS MADE HERE, NO HARNESS IS RECOMMENDED, AND NOTHING IS PROPOSED FOR REMOVAL.
    ────────────────────────────────────────────────────────────────────────────────────────

    (7) THE DISAGREEMENT IS ONE-DIRECTIONAL ON THE TEST STEP, AND THE ONE APPARENT REVERSE IS NOT A
    REVERSE. Re-reading the 2026-08-19 cluster of §(3) run by run over REST: FIVE test-step
    disagreements, ALL of them plain-PASS / instrumented-FAIL, with FOUR agreeing runs alongside
    them as controls — three both-pass (32255301031 12:56Z, 32277192171 16:39Z, 32282983498 17:40Z)
    and one both-fail (32259303025 13:39Z). The controls matter: a query that returned only
    disagreements would prove nothing about direction.

    RUN 32262707192 (14:13Z) READS AS THE REVERSE — `ci` failure, `coverage-ratchet` success — AND
    IT IS NOT ONE. Its `ci` job failed at STEP 5, "Install Playwright's Chromium", with
    `playwright install failed after 3 attempts`; the log carries NO test summary in either reporter
    form. That is the EXTERNAL class §(5) above already defines and already excludes. Counted
    correctly, the cluster does not run both directions on the test step.

    ⚠ SCOPE OF THIS RE-READING, STATED SO IT IS NOT OVER-READ: the ten runs enumerated above come
    from THREE of the eight branch names §(3) lists — `dependabot/npm_and_yarn/stryker-mutator/
    core-10.0.0`, `ci/widen-licence-allow-list` and `docs/operator-rulings-t472-t446-w12t1`. The
    `run-W1-T*` branches return zero because GitHub DELETES a head on merge, the query-shape zero
    CLAUDE.md's clause (d) names — not evidence of absence. So "5 of 5" is over the ENUMERABLE
    SUBSET, not over the whole cluster, and §(3)'s own count of ten stands unrevised.

    (8) THE CAUSE IS A HARNESS RACE, NOT A PRODUCT DEFECT — AND IT IS ALREADY WRITTEN DOWN IN THE
    TREE. `test/acceptance-block-diagnostics.test.ts:424` states it: node's test runner runs test
    FILES concurrently against the SAME on-disk tree, a source-mutating check writes the real
    checked-out file and spawns a child, and for the width of that window any other concurrently
    running file importing the same module reads the MUTATED bytes. Its own words: MEASURED in
    `coverage-ratchet` "(not `ci`, which never overlaps the same way)", producing exactly §(3)'s
    four assertions in a file the diff never touched.

    SO INSTRUMENTATION IS MORE SENSITIVE, NOT TRUER. It slows execution, which widens the overlap
    window until another file's import lands inside it. What it exposes is real — but it is a race
    in the TEST HARNESS, not a defect in the product under test. THAT DISTINCTION IS THE WHOLE
    POINT: "the job that fails more often" and "the job that is right more often" are not the same
    claim, and only the first is measured here.

    A SECOND, SEPARATE HARM SITS AT A DIFFERENT LAYER AND MUST NOT BE MERGED WITH THE FIRST.
    W1-T2292's enrolment defect is live in this corpus — `test/triage.test.ts` carries 45
    spawn/exec sites and ZERO `NODE_V8_COVERAGE` blanking, so its children are silently enrolled —
    and W1-T2276 records the malformed lcov record that follows. That corrupts the coverage
    ARTIFACT, making `diff-coverage` name an entered function uncovered; it does not fail
    assertions. INSTRUMENTATION MAKES TEST OUTCOMES NOISIER; ENROLMENT MAKES COVERAGE OUTPUT LESS
    TRUSTWORTHY. Two harms, two layers, and a ruling that conflates them will price one of them
    wrong.

    PERSISTENCE, MEASURED ACROSS EIGHT DAYS: the failing test in run 32265264156 (14:38Z, 08-19) is
    `W1-T356 wiring: the REAL daemonCommand sets DaemonDeps.sweepOrphans …` — THE SAME TEST that
    failed under coverage on #3134 and #3135 on 2026-08-27, on unrelated diffs. This is a standing
    coverage-only failure, not a one-off.

    (9) WHAT EACH OPTION STOPS DETECTING — the shard's own question, answered in detection terms
    rather than seconds. NO OPTION IS RECOMMENDED.

      (a) COVERAGE ALWAYS, DROP PLAIN `ci`. Stops detecting nothing on the coverage side, but makes
          the NOISIER harness the sole verdict — every instrumented false failure of §(7) becomes
          the only verdict there is. AND ON `main` IT DETECTS NOTHING AT ALL unless W1-T1033's
          PR-only guard is lifted: main's `coverage-ratchet` green is VACUOUS today, its step 6
          measured at 0 SECONDS against 1086s on a PR. Lifting that guard is a separate change with
          its own cost, and (a) silently depends on it.
      (b) PLAIN ALWAYS, COMPUTE COVERAGE ELSEWHERE. Stops detecting the WHOLE diff-coverage class —
          §(5) above measured 30 of 52 single-sided failures as that step, the largest single
          category and this job's unique signal.
      (c) KEEP BOTH. Stops detecting nothing. Costs the duplicate run priced in §(4), plus the
          instrumented false-failure rate of §(7).

    (10) A PREMISE CORRECTION THAT CHANGES WHERE (b)'s BLOCKER SITS. It is natural to assume
    `diff-coverage` is welded to one path; it is not. `scripts/diff-coverage.mjs:612` declares
    `lcov: { type: 'string', default: 'coverage/lcov.info' }` through `parseArgs`, so the path is a
    FLAG WITH A DEFAULT, not a hardcoded literal. (The `readFileSync` at line 617 IS genuinely
    unguarded — a missing lcov throws rather than reporting.) THE BLOCKER FOR (b) IS THEREFORE NOT
    THE PATH: it is that SOMETHING must still run instrumented to produce an lcov at all. Anyone
    costing (b) on the belief that the path is welded will cost the wrong obstacle.

    (11) THE RETRY, MEASURED, BECAUSE IT BEARS ON THE SAME RULING. `scripts/test-with-retry.mjs`
    re-runs the WHOLE suite once on any red. Measured 2026-08-27: it fired 0 OF 8 TIMES on green
    `coverage-ratchet` jobs (#3153, #3148, #3145, #3140, #3137, #3136, #3132, #3130) — so on a green
    run it costs nothing — and 5 OF 5 on red (#3126, #3127, #3133, #3134, #3135), RESCUING ZERO. In
    THREE of those five the doubled runtime pushed the job past the 2340s cap, converting a legible
    `failure` that named the failing test into an illegible `cancelled` that named nothing.

    ⚠ n = 5, AND ALL FIVE WERE DETERMINISTIC FAILURES — each PR's own real defect, or the standing
    coverage-only failure of §(8). THAT IS PRECISELY THE CASE A FLAKE-RETRY CANNOT HELP, so this
    sample CANNOT establish the retry's value against real flakes and must not be read as doing so.
    The rate that would settle it is this shard's OWN 600-run window, re-measured for retry firing
    and rescue, not the five runs above. Nothing here proposes removing or changing the retry.

    (12) A COUNT SLIP IN §(3), CORRECTED HERE RATHER THAN IN PLACE (this amendment is purely
    additive, so §(3)'s text is left exactly as merged). §(3) says "SEVEN OF THE TEN", "SEVEN
    UNRELATED BRANCHES" and "Seven branches sharing one failure set", and then LISTS EIGHT NAMES.
    ⚠ WHICH NUMBER IS WRONG IS NOT DETERMINABLE FROM THE SHARD: "seven of the ten" counts RUNS
    while "seven unrelated branches" counts BRANCHES, so the eighth name may be a second run on a
    branch already counted, or the word may simply be wrong. THIS AMENDMENT DOES NOT RESOLVE IT —
    it records that the list and the prose disagree, so a reader does not take either as measured.
