- id: W1-T4481
  title: "SERVE STILL RESTARTS FOR EVERY PLAN-ONLY MERGE BECAUSE IT READS ITS PLAN ONCE — serveCommand's `loadPlan(planPath)` feeds boardDeps.plan for the process's life, so W1-T4463 has to keep plan/ restart-relevant; reload the plan in place on a plan-only advance and stop restarting for it"
  repo: remudero
  depends_on: ["W1-T4463"]
