  origin: "2026-09-24 console data-architecture gateway build: W1-T4463 follow-up (plan-only merges still restart serve)"
  plan_refs: ["W1-T4463", "W1-T4229", "W1-T3972", "W1-T4409", "W1-T4421", "W1-T2229"]
