- id: W1-T2629
  title: "THE REAPER'S RESIDUE CANNOT READ A TASK ID A BRANCH NAME ALREADY DECLARES — every task-claim predicate in the tree requires the `run-` prefix, so `w1t1060-instrument-declare` files under `no_pr_ever` (\"needs adjudication\", ~$6-9 of worker judgement) for a question a grep answers: split that one reason by the NAMED task's state — credited elsewhere versus still open — while changing no disposition, because a task shipping by another route does not prove THIS branch's commits are in main"
  repo: remudero
  depends_on: []
  type: implement
  verify: auto
  principles: {tdd: strict}
  budget_usd: 100.00
  risk: high
  origin: architect
  plan_refs: ["W1-T2247", "W1-T2246", "W1-T2445", "W1-T2429", "W1-T447", "§5C"]
