  note: |
    FILED 2026-09-01 from follow-up harvest `followup:W1-T2463-1788065942887:2026-08-30T05:01:42.981Z:0`
    (run W1-T2463-1788065942887), which asked whether `w1t1060-instrument-declare` is abandoned or a
    stuck-task flag. THE RESEARCH IS ANSWERED IN THE RATIONALE, not deferred into this task: superseded
    residue, not a stuck task, on tree evidence (W1-T1060's three declared artifacts are all present).
    NO PER-BRANCH CHORE WAS FILED, deliberately. Deleting one branch is owned by nobody yet because NO
    DELETION PATH EXISTS IN `src/` (W1-T2445's measurement), and a per-instance filing is the
    reactive-diagnosis anti-pattern this plan names repeatedly. What is filed is the class the instance
    exposed: the reaper's residue cannot read a task id a branch name already declares.
    risk:high IS BLAST RADIUS, NOT RULE 19 SIZING. This edits `planBranchReap`, the classifier that
    decides what any future deletion path would be allowed to delete. Today a wrong reason is a wrong
    label; once W1-T2445's deletion work lands, a wrong reason that had drifted into `deletable` would
    delete the only copy of somebody's work. The third acceptance criterion is the guard against exactly
    that, and it is load-bearing rather than defensive.
    FILE OVERLAP CHECKED BEFORE FILING (the W1-T171 discipline, applied by hand since that check is
    unbuilt): W1-T2445 declares `files: [src/run-task.ts, …]` and W1-T2429 declares
    `files: [src/lib/status.ts, test/run-branch-claim-is-unenforced.test.ts]`. So this task does NOT
    collide with W1-T2445 at all, and DOES share `src/lib/status.ts` with W1-T2429 — those two should
    not be co-dispatched, and whichever lands second rebases rather than re-deriving the other's
    predicates. Recorded here because it is the kind of thing that is invisible until it conflicts.
