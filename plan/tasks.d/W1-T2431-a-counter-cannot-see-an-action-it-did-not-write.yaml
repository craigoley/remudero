  falsifier: |
    If `sweep.check_requeued` is found to read non-zero over the LIVE ledger at the sha a build
    starts from, it has joined a retention set and (6) is closed — the remedy must then be
    re-derived against a counter that only has the operator blindness, not both. The control for
    that re-run is `sweep.absent_repush` at 4 live, proving the query can see a retained sibling.

    SEPARATELY FALSIFYING: if every re-attempt GitHub's surface records is found to have a
    matching `sweep.check_requeued` row over the union, the population in (4) is empty and this is
    a record rather than a fix. The measurement to repeat is the two id lists in (4), matched by
    PR number, with the seeding-step census in (2) as the control that the union query can see
    each family at all.

    AND IF the sweep is ever changed so that an operator action writes its own attributable row,
    the premise inverts: the count would then be readable from the ledger after all, and reading
    the surface would be a second source where one already sufficed.
