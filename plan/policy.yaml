  # THE SETTLED-COUNTERPART SEQUENCING WAS LUCK, NOT DESIGN: #1364 — which logs
  # `dispatch.settled_set`, so a lane that dies is a row rather than a set-difference nobody
  # computes — merged 26 SECONDS AFTER the daemon had already booted onto this flip. The fleet
