  # THE LAST N=3 ATTEMPT WAS NEVER ACTUALLY RUN, so nothing below is a second opinion: it merged
  # 22:11Z and did not go live until 23:14:51Z (39cb7a9), and in the ~25 minutes it was live it
  # dispatched ONE task. A READER MUST NOT TREAT THE 2026-08-05 REVERT AS EVIDENCE AGAINST 3.
  # ONE CORRECTION TO THE BLOCK ABOVE, MEASURED: it says "zero `dispatch.concurrent_set` and zero
  # `dispatch.settled_set` rows carry `lane_count: 3`, because none was ever written." THE SETTLED
