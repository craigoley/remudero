  # row exists to make reviewable. max: 4 permits a modest, still-reviewed doubling; a bound
  # past that should be its own deliberate ruling, not a side effect of a generous default range.
  # W1-T344 IS THE FLIP TO 2, AND IT HAS NOW HAPPENED (2026-08-05). W1-T343 wired `runDaemon` to
  # drain's lane machinery and shipped it DARK at dispatchLanes: 1 (merged as #1363, 2026-08-05).
  # OBSERVATION WINDOW — n=1. WHAT WAS MERGED IS NOT WHAT WAS OBSERVED, AND THIS COMMENT ONCE
  # CONFLATED THEM. W1-T343's four dark-ship preconditions were MERGED and live in the shipped
  # code before this flip: serialized keychain provisioning, an immutable plan-snapshot binding, a
  # bounded deploy-deferral wait, a per-tick cost governor. That part is true, and it is why the
  # flip was reasonable to attempt. What this comment previously ALSO claimed — that none of the
  # four tripped — is NOT supported by the ledger. The row held at 1 for 25 MINUTES (W1-T343
  # merged 17:02:56Z, W1-T344 merged 17:28:18Z) and EXACTLY ONE dispatch occurred in that window;
  # positive control, 30 `run.start` in the preceding 24h. That one dispatch was run
  # W1-T344-1785949571975 — the flip's OWN implementation run, i.e. the run that wrote the claim
  # about itself. None of the four preconditions COULD have tripped, because almost nothing ran.
  # W1-T344's design item (i) anticipated this verbatim — "a flip on the day the capability lands
  # proves nothing about any of them" — so the task shipped against its own stated bar. A future
  # reader deciding whether to REVERT should treat the dark-ship period as UNOBSERVED rather than
