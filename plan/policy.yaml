  # Nothing sequenced those two merges; next time the ordering may not be kind.
  # MEASUREMENTS AT 1 (production ledger through 2026-08-04, this task's own rationale): 226
  # `run.start` dispatches, 39 merged verdicts (17% merge rate), the cost governor firing for the
  # first time ever at $152.28, and 20 consecutive dispatch gaps of 45-90 minutes against
  # ~25-minute runs (the daemon idle roughly 60% of the time). RETAKE THE SAME FOUR AT 2 so the
  # flip is evaluable rather than permanent: dispatches per day, mean run duration, idle fraction,
  # and the fraction of dispatches producing no merged PR — that last one decides whether lanes
  # helped or merely doubled the churn; throughput alone improves by construction and must not be
  # read as success.
  # REVERSION TRIGGER, STATED IN ADVANCE: the no-merge fraction rising materially above the
  # 83%-unmerged (226-vs-39) baseline measured at 1, OR the cost governor tripping a second time,
  # OR a deploy deferral hitting its bound (W1-T343's deploy-quiescence gate) — any one sends this
  # row back to 1. Reverting is a one-line policy edit plus a daemon restart: no source change,
  # no code PR, no CI, no deploy.
  # A RUNNING DAEMON WILL NOT PICK THIS UP UNTIL IT RESTARTS: `DEFAULT_SWEEP_POLICY` (sweep.ts) is
  # a module-level const built at import from this file, so the flip takes effect at the daemon's
  # NEXT start, never mid-flight.
  # ── N=3 (2026-08-05 evening, operator-directed, TIME-BOXED) ────────────────────────────────
  # MEASURED AT 2 BEFORE THIS FLIP: 4 `dispatch.concurrent_set` rows, EVERY ONE `lane_count: 2`
  # carrying exactly two ids — the cap was binding, not the queue. 5 `dispatch.settled_set` rows
  # with `rejected: 0` on every one, so no lane has ever failed for a concurrency reason.
  # Governors are PER-DISPATCH: daemon.ts calls `checkDispatchGovernors` inside the admission
  # loop per candidate ("never one reading admitting the whole"), so a third lane is admitted
  # against its own fresh reading rather than one reading covering the batch.
  # TWO PREMISES THAT WERE WRONG WHEN THIS FLIP WAS PROPOSED, RECORDED SO 4 IS NOT WAVED THROUGH:
  # (a) OVERLAP IS A REAL CEILING. The partitioner does not log `dispatch.overlap*`; its deferral
