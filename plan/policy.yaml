# plan/policy.yaml — the fleet's operating constants AS DATA (W1-T252, P37 substrate,
# ratifies P34's 2026-07-23 operator ruling). SAME load-and-validate house pattern
# .remudero/mounts.yaml and plan/alert-policy.yaml already use (parsed with the `yaml`
# package, validated by src/lib/policy.ts's `validatePolicy`/`loadPolicy`).
#
# WHY: before this file, the fleet's operating constants (proof timeout, prune grace,
# poll interval, fix-strike cap, sweep thresholds, drain width, headroom curve, retro
# cadence) were literals scattered across src/lib/*.ts — a value change was an edit to
# a constant, invisible to plan review. Every field below is SCHEMA-BOUNDED (min/max travel with
# the value, enforced by src/lib/policy.ts at load, and by `rmd lint-plan` at review
# time) — a value change is now a reviewed plan PR, and an out-of-bounds edit is
# refused mechanically rather than caught in code review after the fact.
#
# PROVENANCE (`origin`, on every field): `lifted:<src-site>` names the exact source
# constant this field's INITIAL value was copied from (verified against source at
# authoring time, OPERATOR RULING 2026-07-23) — never trust this comment over the
# cited site; re-derive it yourself if the site moves. `net-new` marks a field with
# NO prior source literal — `launchd.throttleIntervalS` is the one net-new field this
# file carries (the daemon's generated plist has no ThrottleInterval key today; see
# src/lib/launchd.ts's `generateLaunchdPlist`). A `net-new` field must NEVER be
# relabeled `lifted:` without a real source site to cite, and a `lifted:` field must
# NEVER be relabeled `net-new` — src/lib/policy.ts's loader enforces both directions
# per named field (test/policy.test.ts).
#
# THE 30000 REGRESSION (OPERATOR RULING, binding, rounds 1-4): `proofTimeoutMs.min` is
# set to 60000 — the value ALREADY live at src/lib/review.ts:675 — not merely as this
# field's initial value but as its FLOOR. A P37 fixture draft carried a stale 30000
# proof-timeout figure that predates a merged change; loading (or lint-plan-checking)
# a policy fixture with `proofTimeoutMs.value: 30000` FAILS the normal min-bound check
# for exactly this reason — 30000 is a regression below the live source value, not a
# looser tuning choice, and must be refused, never silently accepted as "a smaller
# number is fine".
#
# WIRING NOTE: this file and its loader (src/lib/policy.ts) are the SUBSTRATE only —
# no consumer site reads from it yet. W1-T253 (P37 CONSUMERS, depends_on this task)
# rewires review.ts/worker.ts/daemon.ts/sweep.ts/drain.ts/launchd.ts to read every
# field below instead of their current source literals.

proofTimeoutMs:
  value: 60000
  origin: "lifted:src/lib/review.ts:675 (DEFAULT_PROOF_TIMEOUT_MS)"
  # Floor = the CURRENT live source value. Never regress below it (the 30000 rejection).
  min: 60000
  max: 300000

pruneGraceMs:
  value: 120000
  origin: "lifted:src/lib/worker.ts:1243 (DEFAULT_PRUNE_GRACE_MS)"
  min: 30000
  max: 900000

pollIntervalMs:
  value: 60000
  origin: "lifted:src/lib/daemon.ts:87 (DEFAULT_POLL_INTERVAL_MS)"
  min: 5000
  max: 600000

fixStrikeCap:
  value: 2
  origin: "lifted:src/lib/config.ts:218 (fixStrikeCap default)"
  min: 1
  max: 10

sweep:
  staleDays:
    value: 14
    origin: "lifted:src/lib/sweep.ts:254 (DEFAULT_SWEEP_POLICY.staleDays)"
    min: 1
    max: 90
  strikeCap:
    value: 2
    origin: "lifted:src/lib/sweep.ts:255 (DEFAULT_SWEEP_POLICY.strikeCap)"
    min: 1
    max: 10
  wipLimit:
    value: 10
    origin: "lifted:src/lib/sweep.ts:257 (DEFAULT_SWEEP_POLICY.wipLimit)"
    min: 1
    max: 50
  # W1-T325: the concurrent dispatch-lane count `rmd drain` fills per pass (W1-T172, P19,
  # DECISIONS.md 2026-07-21 — "start N=2"). This row RELOCATES the pre-existing source literal;
  # it does not retune it (value unchanged at 2). Bounds are deliberately tighter than this
  # table's usual ~5x-of-value convention (compare wipLimit's 1-50, strikeCap's 1-10): raising
  # dispatch width is exactly the lever W1-T326 documents as unvalidated against real
  # concurrency risk (the WS-2 concurrent-keychain question, per this field's own sweep.ts
  # comment, plus the daemon-quiescence deploy-gate concern this task was filed alongside) — a
  # max that let one in-bounds edit jump straight to a large N would re-create the hazard this
  # row exists to make reviewable. max: 4 permits a modest, still-reviewed doubling; a bound
  # past that should be its own deliberate ruling, not a side effect of a generous default range.
  # W1-T344 IS THE FLIP TO 2, AND IT HAS NOT HAPPENED YET. W1-T325 (#1297) relocated this row out
  # of DEFAULT_SWEEP_POLICY and lifted the source literal verbatim — a relocation, not a retune —
  # so it arrived reading 2 while W1-T343 (wire runDaemon to runDrainLanes) is still queued and
  # unmerged. Left at 2, the daemon would take two lanes the moment that wiring merges and it next
  # restarts: no dark ship, no observation window, and no separate decision, which is exactly the
  # split W1-T344's `depends_on: [W1-T343]` exists to preserve. Its own rationale already assumes
  # this row reads 1. Set to 1 so the capability can ship dark and the flip stays deliberate.
  dispatchLanes:
    value: 1
    origin: "lifted:src/lib/sweep.ts:359 (DEFAULT_SWEEP_POLICY.dispatchLanes)"
    min: 1
    max: 4
  # W1-T330: the daily spend ceiling (W1-T148 COST GOVERNOR) — at or over this many ledgered
  # dollars spent today, NEW dispatch is deferred (drainage is never gated). This is a
  # RELOCATION, not a retune: the value stays exactly what src/lib/sweep.ts's
  # DEFAULT_SWEEP_POLICY.dailyCostCeilingUsd already carried (raised 150 -> 500 on 2026-08-04,
  # the day the governor first fired in production — $152.28 observed against the old $150
  # ceiling, roughly ten times the prior, ordinary day's spend). Retuning this row is now a
  # reviewed plan-data PR instead of a src/ edit + CI + deploy; it does NOT let a running
  # daemon pick up a new ceiling mid-flight — `loadDefaultPolicy` memoizes for the process
  # lifetime, so a long-lived daemon holds its boot-time ceiling until it restarts, while a
  # short-lived CLI verb picks up the new value on its next invocation.
  # min: 100 stays comfortably above the ~$15/day an ORDINARY (non-incident) day cost before
  # the $152.28 spike — a ceiling this low must not defer every dispatch on a normal day.
  # max: 2500 (5x the shipped value) follows this table's usual bounded-row convention
  # (wipLimit/fixStrikeCap/strikeCap all bound at 5x their value) rather than pinning
  # min/max to the value the way autoTriage.maxPerDay deliberately does — this ceiling gates
  # SPEND, so an editor still has room to raise it well past today's figure without the bound
  # itself becoming a second incident, while staying finite rather than effectively unbounded.
  dailyCostCeilingUsd:
    value: 500
    origin: "lifted:src/lib/sweep.ts:365 (DEFAULT_SWEEP_POLICY.dailyCostCeilingUsd)"
    min: 100
    max: 2500
  # W1-T320: the rmd-owned temp-dir backstop's age ceiling (src/lib/tmp.ts's
  # sweepStaleTempDirs). NET-NEW, not lifted from DEFAULT_TEMP_SWEEP_MAX_AGE_MS (24h) —
  # the 2026-08-03 incident (fb-1785807201821-e4c9dc) measured 53,310 rmd-* dirs minting
  # at ~200/minute, so the ENTIRE population is younger than 24h when the disk fills and
  # the old ceiling mathematically cannot fire before ENOSPC. tmp-hygiene-owned dirs live
  # for ONE test process, so an hour is generous headroom, not a tight shave. Retunable by
  # plan review (this row), never a source-literal edit.
  tmpMaxAgeMs:
    value: 3600000
    origin: "net-new"
    min: 60000
    max: 86400000

drain:
  max:
    value: 10
    origin: "lifted:src/lib/drain.ts:243 (DEFAULT_MAX)"
    min: 1
    max: 100

# W1-T264: the daemon's retro cadence trigger (src/lib/retro.ts's `evaluateRetroTrigger`)
# fires once EITHER threshold crosses — mergesSinceMarker >= mergesThreshold OR
# daysSinceMarker >= daysThreshold — whichever comes first. Retuning the cadence is now a
# reviewed policy-data edit, never a source change + deploy.
# The daemon's auto-triage rung (recon-DC #2, impl-DJ). It turns ONE feedback entry into a plan
# proposal per idle period, spending a MEDIAN $0.98 unsupervised each time (mean $0.99, range
# $0.27-$2.00, n=27 ledgered runs — impl-FO re-measured this over the unioned, deduplicated ledger).
#
# SHIPPED OFF, deliberately — a rung that spends unsupervised is opted into, never shipped on;
# nothing changed until the operator set `enabled.value: true`. FLIPPED ON by PR #1093
# (2026-08-01) and live since: the rung now spends unattended each idle period, inside the
# bounds below.
#
# THE PACING BOUND WAS minIntervalMinutes ALONE AT 60m (impl-FO); policy/triage-cadence (60 -> 15,
# to drain a 58-entry feedback backlog faster) REACTIVATED maxPerDay as a genuine second bound:
#   minIntervalMinutes 15 -> up to 96 fires/day by pacing alone if maxPerDay did not intervene
#   maxPerDay          24 -> now the BINDING constraint: it catches up after the 24th fire each
#                            rolling day, so the WORST-CASE daily spend is unchanged from the 60m
#                            era (~$23.54/day typical, ~$48.12/day only if every run were the most
#                            expensive ever recorded) even though the short-run rate quadrupled.
# maxPerDay was 4 and was the binding ceiling before impl-FO; it was raised to 24 because a COUNT
# is the wrong instrument for a SPEND risk, and because its stated basis ("~$2.00/run") was the
# single worst run ever recorded quoted as typical — 2.04x the real median. Raising it to 24 was
# safe under the THEN-shipped 60m pacing because 60m alone already capped a rolling day at 24
# fires (see maxPerDay's own comment below); it is the 60 -> 15 change that put a real floor back
# under this field, not a value change to maxPerDay itself.
# The daemon idled ~390 times in ten hours on 2026-08-01; a per-POLL rung would have spent ~$780
# that night. Together minIntervalMinutes and maxPerDay are what keep the worst case a number the
# operator can accept in advance — and `enabled: false` plus `state/PAUSE` remain the two real
# stops.
autoTriage:
  enabled:
    value: true
    origin: "net-new"   # a rung that spends unsupervised is opted into, never shipped on
  minIntervalMinutes:
    value: 15
    origin: "net-new"   # one idle hour is the smallest gap that is clearly not per-poll
    min: 5
    max: 1440
    # W1-T318: this is now the CADENCE CURVE's FLOOR — the fastest the interval ever gets,
    # reached once runnable depth (see depthFloor below) is thin. Unchanged in value and in
    # every pre-existing consumer's behaviour: a caller that supplies no census (every caller
    # that predates this curve) gets this fixed number unconditionally, exactly as before.
  maxIntervalMinutes:
    value: 60
    origin: "net-new"
    min: 15
    max: 1440
    # W1-T318: the curve's CEILING — the slowest the interval gets, reached once runnable depth
    # (see depthCeiling below) is full, OR whenever the plan is entirely merged (design clause
    # iv: DONE is not STARVED, and must not read as "near-empty, go fast"). 60m is the interval
    # this rung shipped with before policy/triage-cadence dropped it to 15 — restored here as the
    # RELAXED end of the curve rather than the fixed value, so a full queue paces exactly as
    # conservatively as the rung always did before it needed to go faster on a thin one.
  depthFloor:
    value: 0
    origin: "net-new"
    min: 0
    max: 5
    # W1-T318: runnable depth (blocked + unmet-deps tasks off the SAME idle_reasons census the
    # daemon already logs — drain.ts's tallyDispatchFilters, also W1-T298's StarvationCensus
    # input) at/below which the interval is pinned to minIntervalMinutes. 0 is deliberate: the
    # curve should already be at its fastest the moment the queue has NO recoverable backlog
    # left queued (short of the all-merged exception above), not merely once it is negative.
  depthCeiling:
    value: 10
    origin: "net-new"
    min: 1
    max: 100
    # W1-T318: runnable depth at/above which the interval is pinned to maxIntervalMinutes — a
    # queue with ten or more tasks still blocked/unmet-deps is "full enough" that triage need
    # not rush to add more. Retunable by plan review (this row), never a deploy.
  maxPerDay:
    value: 24
    origin: "net-new"
    # AT THE ORIGINAL 60m minIntervalMinutes this was NON-BINDING BY CONSTRUCTION: 60m already
    # capped the rolling 24h window at 24 fires, so every value >= 24 behaved identically (verified
    # by driving the real decideAutoTriage over a simulated 3-day span, polling once a minute,
    # always idle, always with a candidate: 24, 1000 and 1000000 each fired exactly 24/day, 72 over
    # 3 days). policy/triage-cadence dropped minIntervalMinutes to 15, which alone would allow 96
    # fires/day — so this field is now the BINDING constraint, not a kept-but-inert fallback: it is
    # the one-line lever that keeps the worst-case daily spend unchanged while the short-run rate
    # quadruples (see the block comment above `autoTriage:` for the arithmetic).
    # COST, measured over the ledger unioned across all rotations, deduplicated, summed per run_id:
    # MEDIAN $0.98/run, mean $0.99, range $0.27-$2.00, n=27 runs with recorded spend, total $26.76.
    # So ~$23.54/day typical at the 24-fire ceiling; $48.12/day only if every run were the most
    # expensive ever recorded. The previous comment here claimed "~$8/day at the measured ~$2.00/run"
    # -- $2.00 was that single worst run, quoted as typical, overstating the median by 2.04x.
    min: 1
    max: 24

retro:
  mergesThreshold:
    value: 25
    origin: "lifted:src/lib/retro.ts:2299 (DEFAULT_RETRO_MERGES_THRESHOLD)"
    min: 1
    max: 100
  daysThreshold:
    value: 7
    origin: "lifted:src/lib/retro.ts:2304 (DEFAULT_RETRO_DAYS_THRESHOLD)"
    min: 1
    max: 90

# The daemon's headroom ceiling curve (src/lib/daemon.ts's `buildDefaultHeadroomPolicy`):
# at/under 24h-to-window-reset the ceiling is 100% (no reason to hold back headroom that
# expires unused at reset); otherwise it holds at `reservePct`, the operator reserve
# (src/lib/headroom.ts's `HEADROOM_LIMIT_PCT`, currently 95). `maxHoursToReset: null`
# means "no ceiling on hours" (the last, catch-all rung — mirrors `Infinity` in source).
headroom:
  curve:
    value:
      - { maxHoursToReset: 24, limitPct: 100 }
      - { maxHoursToReset: null, limitPct: 95 }
    origin: "lifted:src/lib/daemon.ts:145-148 (buildDefaultHeadroomPolicy)"
  reservePct:
    value: 95
    origin: "lifted:src/lib/headroom.ts:119 (HEADROOM_LIMIT_PCT)"
    min: 50
    max: 100
  # OPERATOR RULING 2026-07-25 (fb-1784894405468-a4153e, superseded default clause):
  # documented default TRUE — matches the live runtime default (daemon.ts:968's
  # `opts.headroomEnabled ?? true`) — the governor protects the subscription window
  # by default; opting into overflow spend is the deliberate act, set here or via
  # config `headroom.enabled: false` / `RMD_HEADROOM_ENABLED=0` (both still win over
  # this row once W1-T253 wires the read).
  enabled:
    value: true
    origin: "lifted:src/lib/daemon.ts:968 (headroomEnabled default)"

# NET-NEW: no daemon-plist ThrottleInterval literal exists in src today (see
# src/lib/launchd.ts's `generateLaunchdPlist` — it emits no ThrottleInterval key).
# The R-1 relaunch-storm rate limit already applied to the SEPARATE serve unit
# (`DEFAULT_SERVE_THROTTLE_S`, also 60) is the precedent this value follows, but this
# row governs the daemon unit specifically and is NEVER to be presented as lifted from
# that (or any) source constant.
launchd:
  throttleIntervalS:
    value: 60
    origin: "net-new"
    min: 10
    max: 3600

# The boot-time abandoned-review-clone reap (impl-EK, 2026-08-01). Reviewing a PR
# materialises a standalone clone of this repo into a scratch root and never removes it;
# 36 survived across os.tmpdir(), /private/tmp and the SDK scratchpad root, totalling
# 5866 MiB, on a host where macOS's periodic tmp cleaner is absent so nothing ever has.
scratchReap:
  # SHIPPED OFF, deliberately: this rung DELETES, so it began survey-only — while false the
  # boot pass SURVEYS and writes `daemon.clone_reap` with what it would reclaim, removing
  # nothing, so the operator could read that line before arming it. FLIPPED ON by PR #1250
  # (2026-08-03, "after a third hand-clear tonight") and live since: the boot pass now REMOVES
  # qualifying clones. Same shipped-off posture as `autoTriage.enabled` above (itself flipped
  # on by PR #1093), which began off because it spends; this began off because it destroys.
  enabled:
    value: true
    origin: "net-new"
  # The age ceiling below which an idle clone is kept, in hours. Conservative end of the
  # range the two existing sweeps already set (both 24h). ~15x the 92.3-min longest observed
  # task wall-time, so no clone of a RUNNING review can reach it even if the liveness probe
  # were to fail open. Floor 4h matches worker-scratch.ts's teardown ceiling; a lower value
  # would risk a live review's clone.
  maxAgeHours:
    value: 24
    origin: "lifted:src/lib/worker-scratch.ts (DEFAULT_SCRATCH_SWEEP_MAX_AGE_MS = 24h)"
    min: 4
    max: 168
