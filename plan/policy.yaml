    value: 10
    origin: "lifted:src/lib/sweep.ts:257 (DEFAULT_SWEEP_POLICY.wipLimit)"
    min: 1
    max: 50
  # W1-T325: the concurrent dispatch-lane count `rmd drain` fills per pass (W1-T172, P19,
