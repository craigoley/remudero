  # ── N=3 AGAIN (2026-08-13, operator-directed). THE FIRST REAL TRIAL, NOT A SECOND ONE. ─────
  # PRECONDITION MET, WHICH IS THE WHOLE REASON THIS IS BACK: W1-T380 MERGED as a1f067c (PR
  # #1392, "a dry-run must not consume the idle ceiling"), verified an ancestor of this commit.
  # The block above set exactly this bar in its own words — "3 is worth revisiting once it is
