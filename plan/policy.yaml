# plan/policy.yaml — the fleet's operating constants AS DATA (W1-T252, P37 substrate,
# ratifies P34's 2026-07-23 operator ruling). SAME load-and-validate house pattern
# .remudero/mounts.yaml and plan/alert-policy.yaml already use (parsed with the `yaml`
# package, validated by src/lib/policy.ts's `validatePolicy`/`loadPolicy`).
#
# WHY: before this file, the fleet's operating constants (proof timeout, prune grace,
# poll interval, fix-strike cap, sweep thresholds, drain width, headroom curve, retro
# cadence) were literals scattered across src/lib/*.ts — a value change was an edit to
# a constant, invisible to plan review. Every field below is SCHEMA-BOUNDED (min/max travel with
# the value, enforced by src/lib/policy.ts at load, and by `rmd lint-plan` at review
# time) — a value change is now a reviewed plan PR, and an out-of-bounds edit is
# refused mechanically rather than caught in code review after the fact.
#
# PROVENANCE (`origin`, on every field): `lifted:<src-site>` names the exact source
# constant this field's INITIAL value was copied from (verified against source at
# authoring time, OPERATOR RULING 2026-07-23) — never trust this comment over the
# cited site; re-derive it yourself if the site moves. `net-new` marks a field with
# NO prior source literal — `launchd.throttleIntervalS` is the one net-new field this
# file carries — `net-new` means no prior source literal existed to lift it FROM, which
# remains true; since W1-T253 the daemon's generated plist emits a ThrottleInterval key
# by READING this row (src/lib/launchd.ts's `generateLaunchdPlist`), so the plist is this
# value's consumer, not its source. A `net-new` field must NEVER be
# relabeled `lifted:` without a real source site to cite, and a `lifted:` field must
# NEVER be relabeled `net-new` — src/lib/policy.ts's loader enforces both directions
# per named field (test/policy.test.ts).
#
# THE 30000 REGRESSION (OPERATOR RULING, binding, rounds 1-4): `proofTimeoutMs.min` is
# set to 60000 — the value ALREADY live at src/lib/review.ts:675 — not merely as this
# field's initial value but as its FLOOR. A P37 fixture draft carried a stale 30000
# proof-timeout figure that predates a merged change; loading (or lint-plan-checking)
# a policy fixture with `proofTimeoutMs.value: 30000` FAILS the normal min-bound check
# for exactly this reason — 30000 is a regression below the live source value, not a
# looser tuning choice, and must be refused, never silently accepted as "a smaller
# number is fine".
#
# WIRING NOTE: this file and its loader (src/lib/policy.ts) are the SUBSTRATE only —
# no consumer site reads from it yet. W1-T253 (P37 CONSUMERS, depends_on this task)
# rewires review.ts/worker.ts/daemon.ts/sweep.ts/drain.ts/launchd.ts to read every
# field below instead of their current source literals.

proofTimeoutMs:
  value: 60000
  origin: "lifted:src/lib/review.ts:675 (DEFAULT_PROOF_TIMEOUT_MS)"
  # Floor = the CURRENT live source value. Never regress below it (the 30000 rejection).
  min: 60000
  max: 300000

pruneGraceMs:
  value: 120000
  origin: "lifted:src/lib/worker.ts:1243 (DEFAULT_PRUNE_GRACE_MS)"
  min: 30000
  max: 900000

# W1-T378: the CADENCE reaper's own age ceiling, deliberately NOT pruneGraceMs above.
# pruneGraceMs is consumed by six pruneStaleRuns call sites at RUN START, where it guards a
# narrow create-before-lock race and a longer value delays reclaiming a colliding worktree
# name. reapStaleWorktrees runs on a cadence with no such urgency, so its ceiling is a
# separate dial and raising it costs only disk.
#
# 1800000 (30 min) is MEASURED, not picked. Over the unioned ledger (667 files incl. 666
# gzipped rotations, 4,268,018 lines read, 389,119 unique, 541 runs that reached a verdict,
# 11,059 intra-run gaps): p50 0.0 min, p90 1.5 min, p95 4.4 min, p99 29.7 min. At the old
# 120000, 8.55% of quiet stretches inside a HEALTHY run already exceeded the ENTIRE grace.
# 30 min covers p99 and is deliberately the SAME number as status.ts's
# DEFAULT_LIVENESS_BOUND_MS, so the reaper and the console agree about when a quiet run stops
# counting as live instead of each holding a private opinion.
worktreeReapGraceMs:
  value: 1800000
  origin: "net-new"
  min: 120000
  max: 7200000

pollIntervalMs:
  value: 60000
  origin: "lifted:src/lib/daemon.ts:87 (DEFAULT_POLL_INTERVAL_MS)"
  min: 5000
  max: 600000

fixStrikeCap:
  value: 2
  origin: "lifted:src/lib/config.ts:218 (fixStrikeCap default)"
  min: 1
  max: 10

# W1-T943 (WORKER-STALL DETECTOR). How long a LIVE in-flight run's newest `worker.state` row
# (W1-T942) may age before src/run-task.ts's `runWorkerStallDetectorRung` judges that run
# stalled, ledgers `worker.stalled` ONCE, and escalates through the existing §4 machinery — it
# never kills, signals, or defers the run itself (design note iv).
#
# NET-NEW — no prior source literal ever measured a worker-quiet threshold; this task's own
# filing verified plan/policy.yaml carried zero rows for it. The DEFAULT (3600000, 60 min) is
# this task's own title's illustrative duration ("A WORKER THAT HAS SAID NOTHING FOR AN HOUR
# REACHES NOBODY") and is deliberately measured against the one legitimate long step this
# fleet's own workers run: the 23-step `--ci-parity` suite, ~16 minutes of a 61-minute lane
# (W1-T465's own measurement, itself citing W1-T463/#1744's "has failed twice ever, once
# WRONGLY"). 60 min clears that measured figure by 3.75x — design note v's own requirement ("a
# known-long legitimate step ... cannot trip it") — with headroom to spare, so a first firing on
# a healthy run cannot be the thing that gets this organ disabled (design note v's own warning:
# "a first default that cries wolf gets the whole organ disabled").
#
# min (1200000, 20 min) sits above the SAME 16-minute `--ci-parity` figure with its own margin,
# so a tighter operator retune still cannot regress under the one known-long legitimate step.
# max (7200000, 2h) is the SAME ceiling worktreeReapGraceMs.max above already uses for a
# similarly-generous reclaim/observe window — a slower host can widen this far without the
# detector going arbitrarily silent.
workerStall:
  value: 3600000
  origin: "net-new"
  min: 1200000
  max: 7200000

# W1-T1045: THE CLOCK BOUND — the ACT-ON-DETECTION half of workerStall above. workerStall only
# ESCALATES a quiet run to an operator queue and, by its own design, never touches the worker
# itself; this is the elapsed-since-last-`worker.state`-transition threshold past which
# run-task.ts aborts that worker's own SDK stream, records the evidence, and ends the run with a
# terminal verdict instead of holding a lane/lock/slot forever. Never on total run age — a run
# still producing `worker.state` transitions is never touched, however long it runs.
#
# 7200000 (2h) is the SAME number #2251 chose for the recycle's kill predicate, checked directly
# against all 116 `implement.done` rows carrying `worker_duration_ms` (19.3 min median, 36.0 p90,
# 46.7 p95, 55.2 p99, 98.5 max): ZERO of those 116 would have tripped it, a 22% margin over the
# largest run ever observed. Matched to workerStall's own bounds and to #2251's value
# DELIBERATELY, not by coincidence — abandoning is the SOFTER act (a terminal verdict + a
# re-dispatchable lock/lane release, never a bare kill), so the naive "unattended should be
# tighter" reading does not apply. If either bound is ever retuned, retune both or record why
# they diverged.
#
# min/max mirror workerStall's own row above — the identical generous reclaim/observe window
# reasoning applies unchanged.
workerAbandon:
  value: 7200000
  origin: "net-new"
  min: 1200000
  max: 7200000
# W1-T1044 (A SWEEP TICK HAS NO WALL-CLOCK BOUND). The bound on `await deps.sweep()`
# (src/lib/daemon.ts's poll loop). MEASURED, not a round figure: this task's own rationale
# re-derived healthy sweep ticks at 61.8s median / 111.8s p90, against 21 confirmed hangs
# longer than 20 minutes (1200000ms), the shortest one 165.5 minutes. value: 559000 is 5x
# the measured p90 (111800ms) — comfortably past the whole healthy population's own tail,
# and still 2.15x BELOW the shortest confirmed hang, so the bound cannot fire on a
# merely-slow-but-healthy tick and cannot wait as long as even the shortest observed one.
#
# W1-T1219 (ONE POLICY ROW BOUNDS TWO UNRELATED POPULATIONS): until this task, this SAME
# field also bounded ONE fix-rung worker spawn inside `runFixRung` (src/run-task.ts) — a
# sweep tick classifies open PRs against a rollup it already fetched; a fix-rung spawn is an
# implement-class Claude worker that reads a diff, edits source and commits. Applying a bound
# derived from sweep-tick durations to that spawn made the rung abandon healthy implement-class
# work at 9m19s (three `fix.spawn_abandoned` rows on 2026-08-22, `spawnAbandonedElapsedMs`
# 559008/559060 — over by 8-60ms, nothing hung). The fix-rung spawn now reads its OWN row,
# `fixSpawnWallClockBoundMs` below — this row is UNCHANGED, value and bounds both, and now
# bounds ONLY the sweep tick.
#
# OPTIONAL IN THE SCHEMA (src/lib/policy.ts): this row is read like `autoTriage`'s own
# optional block — ABSENT means "use the committed default" (mirrored in policy.ts as
# `DEFAULT_SWEEP_WALL_CLOCK_BOUND_MS`), never a load failure, so an existing `policy.yaml`
# fixture that predates this task keeps loading clean.
#
# min: 180000 (3 minutes) sits comfortably above the measured p90 (111.8s) with its own
# margin — a tighter operator retune still cannot abandon a healthy-but-slow tick. max:
# 900000 (15 minutes) stays safely under the shortest confirmed hang (20 minutes) even at
# the loosest retune, so the bound cannot be widened past the point where it stops firing on
# the class of hang it was measured against.
sweepWallClockBoundMs:
  value: 559000
  origin: "net-new"
  min: 180000
  max: 900000

# W1-T1219 (the split half of the row above). The WALL-CLOCK BOUND (ms) on ONE fix-rung
# worker spawn inside `runFixRung` (src/run-task.ts) — see `sweepWallClockBoundMs`'s own
# comment above for why one row could no longer bound both a sweep tick and this spawn.
#
# THIS VALUE IS INTERIM BY CONSTRUCTION, NOT A MEASUREMENT. The ledger could not measure the
# right bound when this task was filed: `fix.dispatch` is logged AFTER the spawn returns
# (W1-T127), so every completed pair lands in the same second and encodes no duration at
# all (127 of 137 post-2026-07-28 pairs measured under one second). This task's own fix
# makes a completed spawn record its own elapsed milliseconds (the `fix.dispatch` row's
# `elapsed_ms` field — the SAME field `fix.spawn_abandoned` already carried on the failure
# path), so the population this bound should be derived from only starts accumulating once
# this row ships. RE-DERIVE FROM THAT INSTRUMENT once it holds a meaningful sample of
# completed spawns — no earlier than 2026-10-01, and never from `sweepWallClockBoundMs`'s
# own sweep-tick population above.
#
# UNTIL THEN, THIS VALUE MUST STILL BOUND SOMETHING, NOT BE UNBOUNDED (W1-T1044's whole
# point stands: a spawn with no ceiling is the hang it was built to stop). value: 3600000
# (1 hour) is checked against the ONE real fix-worker population that exists — the
# pre-W1-T127 historical `fix.dispatch`→spawn-span pairs this task's rationale measured
# (n=186, median 404.4s, p90 1346.2s/22.4min, max 5914.7s/98.6min) — comfortably above that
# population's own p90 (2.67x), so it is not ROUTINELY exceeded, while still comfortably
# above the general implement-class dispatch population's own mean/median (27.6min/25.0min,
# n=63) a fix worker is narrower than. OFFERED AS MAGNITUDE, NOT DERIVED PRECISELY FROM IT —
# see this task's own rationale (6) for why that population is historical evidence only.
#
# min: 1200000 (20 minutes) mirrors `workerStall`/`workerAbandon`'s own min above — the SAME
# generous reclaim/observe window reasoning, and comfortably above `sweepWallClockBoundMs`'s
# own max (900000) so an operator retuning either bound cannot collapse the two ranges into
# one another. max: 7200000 (2 hours) mirrors `workerAbandon`'s own max above — the SAME
# already-reviewed outer ceiling for a spawned worker's SDK stream, so this interim cannot be
# widened past what is already accepted safe for a full worker run.
fixSpawnWallClockBoundMs:
  value: 3600000
  origin: "net-new"
  min: 1200000
  max: 7200000

sweep:
