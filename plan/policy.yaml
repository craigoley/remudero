# $0.27-$2.00, n=27 ledgered runs — impl-FO re-measured this over the unioned, deduplicated ledger).
#
# SHIPPED OFF, deliberately — a rung that spends unsupervised is opted into, never shipped on;
# nothing changed until the operator set `enabled.value: true`. FLIPPED ON by PR #1093
# (2026-08-01) and live since: the rung now spends unattended each idle period, inside the
# bounds below.
#
# THE PACING BOUND WAS minIntervalMinutes ALONE AT 60m (impl-FO); policy/triage-cadence (60 -> 15,
# to drain a 58-entry feedback backlog faster) REACTIVATED maxPerDay as a genuine second bound:
#   minIntervalMinutes 15 -> up to 96 fires/day by pacing alone if maxPerDay did not intervene
#   maxPerDay          24 -> now the BINDING constraint: it catches up after the 24th fire each
#                            rolling day, so the WORST-CASE daily spend is unchanged from the 60m
#                            era (~$23.54/day typical, ~$48.12/day only if every run were the most
#                            expensive ever recorded) even though the short-run rate quadrupled.
# maxPerDay was 4 and was the binding ceiling before impl-FO; it was raised to 24 because a COUNT
# is the wrong instrument for a SPEND risk, and because its stated basis ("~$2.00/run") was the
# single worst run ever recorded quoted as typical — 2.04x the real median. Raising it to 24 was
# safe under the THEN-shipped 60m pacing because 60m alone already capped a rolling day at 24
# fires (see maxPerDay's own comment below); it is the 60 -> 15 change that put a real floor back
# under this field, not a value change to maxPerDay itself.
# The daemon idled ~390 times in ten hours on 2026-08-01; a per-POLL rung would have spent ~$780
# that night. Together minIntervalMinutes and maxPerDay are what keep the worst case a number the
# operator can accept in advance — and `enabled: false` plus `state/PAUSE` remain the two real
# stops.
autoTriage:
  enabled:
    value: true
    origin: "net-new"   # a rung that spends unsupervised is opted into, never shipped on
  minIntervalMinutes:
    value: 15
    origin: "net-new"   # one idle hour is the smallest gap that is clearly not per-poll
    min: 5
    max: 1440
    # W1-T475: the FIXED interval between two fires, and now the ONLY interval bound. It used to
    # reach decideAutoTriage only through the deleted curve's depth<=depthFloor arm, so removing
    # that curve would have removed this floor with it and left a rung free to fire every idle
    # tick; it is now read directly. Value unchanged at 15.
  # W1-T475: maxIntervalMinutes / depthFloor / depthCeiling were REMOVED here, not left as dead
  # data. The W1-T318 adaptive cadence curve they parameterised was a second, weaker governor on
  # the quantity maxPerDay already bounds exactly, and it was keyed to a depth proxy uncorrelated
  # with capacity in both directions. A row this file still declares after the code stops reading
  # it is a surface documented to disagree with the code — a pattern this repo has hit seven times
  # — so the rows go with the curve. minIntervalMinutes above survives as the fixed floor.
  maxPerDay:
    value: 24
    origin: "net-new"
    # AT THE ORIGINAL 60m minIntervalMinutes this was NON-BINDING BY CONSTRUCTION: 60m already
    # capped the rolling 24h window at 24 fires, so every value >= 24 behaved identically (verified
    # by driving the real decideAutoTriage over a simulated 3-day span, polling once a minute,
    # always idle, always with a candidate: 24, 1000 and 1000000 each fired exactly 24/day, 72 over
    # 3 days). policy/triage-cadence dropped minIntervalMinutes to 15, which alone would allow 96
    # fires/day — so this field is now the BINDING constraint, not a kept-but-inert fallback: it is
    # the one-line lever that keeps the worst-case daily spend unchanged while the short-run rate
    # quadruples (see the block comment above `autoTriage:` for the arithmetic).
    # COST, measured over the ledger unioned across all rotations, deduplicated, summed per run_id:
    # MEDIAN $0.98/run, mean $0.99, range $0.27-$2.00, n=27 runs with recorded spend, total $26.76.
    # So ~$23.54/day typical at the 24-fire ceiling; $48.12/day only if every run were the most
    # expensive ever recorded. The previous comment here claimed "~$8/day at the measured ~$2.00/run"
    # -- $2.00 was that single worst run, quoted as typical, overstating the median by 2.04x.
    min: 1
    max: 24

# W1-T1259: `rule-efficacy`, `verdict-calibration` and `autonomy-rate` — the three verbs that
# would answer "is this system getting better" — were merged, HOST-SIDE ONLY (their own ledger
# lives on the daemon host; nothing in CI can read it), and reachable only by an operator typing
# them on the right machine. No orchestrator (daemon.ts/retro.ts/sweep.ts) ever called them.
#
# THIS BLOCK IS SAFE ON BY DEFAULT, UNLIKE `autoTriage` ABOVE. That rung spends ~$1/fire
# unsupervised, so it ships off until an operator opts in. This cadence spends nothing:
# `verdict-calibration`/`autonomy-rate` carry no write symbol at all, and the default
# `rule-efficacy` run is its own `--no-escalate` form — a report, zero writes. A cadence that
# writes nothing cannot launder anything (Law 5), so it can run unattended from the start.
#
# `escalate` IS THE SEPARATE, OPT-IN FLAG for `rule-efficacy`'s one write (a promote-to-instrument
# PROPOSAL into the inbox's ACTIVE-proposal registry, idempotent by rule id — never a filed task).
# It mirrors `autoTriage.enabled`'s off-by-default posture for anything that writes, and ships
# false: turning the escalating form on is a separate, reviewed policy edit, not a side effect of
# giving the reports a cadence.
#
# minIntervalMinutes/maxPerDay ARE THE CADENCE'S OWN PACING BOUND, never the raw 60s poll
# interval — a metric fired every poll would be pure noise. 360m/4-per-day means the daemon
# checks in on the fleet's health a few times a day, comfortably above the ~16-minute CI-parity
# suite (policy/workerStall's own comment) and far below a spend-shaped cadence's tuning.
measurementCadence:
  enabled:
    value: true
    origin: "net-new"   # safe (read-only default) — see the block comment above
  minIntervalMinutes:
    value: 360
    origin: "net-new"
    min: 15
    max: 1440
  maxPerDay:
    value: 4
    origin: "net-new"
    min: 1
    max: 24
  escalate:
    value: true
    origin: "net-new"   # opt-in, ON since 2026-09-02 — turned on by operator instruction.
    # SPEND-BEARING, and that is why it was off: each escalated rule lands a proposal in
    # state/inbox-proposals.json, which is the SAME registry buildInboxDraftHook reads
    # ("if (proposals.length === 0) return; // no active proposals — no spend"), so every
    # escalation becomes a draft target at the inbox_draft mount. Bounded by the cadence above
    # (360m/4-per-day), by DAEMON_DRAFT_BATCH_CAP, and by idempotence: a rule escalates ONCE,
    # keyed by ruleEfficacyProposalId, so this is a one-off cost per repeating rule, not a
    # recurring one. Still never files a task — Law 5.
    # rule-efficacy's ONE write (a promote-to-instrument proposal); verdict-calibration and
    # autonomy-rate never consult this field at all.

# W1-T2277: THE DIGEST'S OWN CADENCE ROW — deliberately SEPARATE from `measurementCadence`
# immediately above, so a short digest interval can never drag rule-efficacy/verdict-
# calibration/autonomy-rate to it (and vice versa). Reuses the SAME pure two-bound decision
# function (`decideMeasurementCadence`) those three verbs already share — this row supplies it
# a DIFFERENT policy value and a DIFFERENT marker file (state/last-digest-cadence.json), never a
# second decision function.
#
# `minIntervalMinutes` is the operator-facing "digest interval": the console offers
# {1, 2, 4, 8, 12, 24} hours (60..1440 minutes) — every one of those six values is inside this
# row's own [15, 1440] bound, checked (not assumed) by `digest.ts`'s
# `digestIntervalOptionsOutOfBounds`. Default 1440 (once/day), matching the digest's pre-cadence
# behaviour (MASTER-PLAN §4's "daily digest").
#
# `maxPerDay` ships at its declared MAXIMUM (24) so `minIntervalMinutes` is the ONLY bound that
# actually paces the digest — an operator who dials the console down to a 1-hour interval is
# never additionally throttled by a stale daily cap left over from the 1440m default.
digestCadence:
  enabled:
    value: true
    origin: "net-new"   # safe (read-only default, sends nothing that spends budget or writes)
  minIntervalMinutes:
    value: 1440
    origin: "net-new"
    min: 15
    max: 1440
  maxPerDay:
    value: 24
    origin: "net-new"
    min: 1
    max: 24

# W1-T2304's board-review rung — the rung whose UNIT is the whole open board, not one PR. Its OWN
# row, deliberately not folded into measurementCadence or digestCadence above, so the three
# cadences can never drag one another (the rung's own design "Ownership" note).
#
# 120 / 6 ARE DERIVED FROM THE BOARD, not copied from a sibling. MEASURED 2026-08-26: the depth
# trigger was continuously satisfied for 2h26m — #2895 crossed the 8h age bar at 08:55Z and stayed
# open until 16:20:51Z, with two reds landing inside the same stretch. At a 120m floor that yields
# TWO reports across it: one when the condition appears, one confirming it persisted. Reporting the
# same stale board every poll is noise for a condition an operator can only act on hourly. maxPerDay
# 6 bounds a board that is red all day to twelve hours of coverage at that interval, and caps the
# cost at six whole-board reads.
#
# SAFE ON, like measurementCadence and digestCadence: the rung is READ-ONLY. It writes one report
# artifact and drafts registry proposals; it does not push, merge, mint or file, and Rule 15 stands.
boardReview:
  enabled:
    value: true
    origin: "net-new"   # safe (read-only: one report artifact plus registry proposals)
  minIntervalMinutes:
    value: 120
    origin: "net-new"
    min: 15
    max: 1440
  maxPerDay:
    value: 6
    origin: "net-new"
    min: 1
    max: 24

retro:
  mergesThreshold:
    value: 25
    origin: "lifted:src/lib/retro.ts:2299 (DEFAULT_RETRO_MERGES_THRESHOLD)"
    min: 1
    max: 100
  daysThreshold:
    value: 7
    origin: "lifted:src/lib/retro.ts:2304 (DEFAULT_RETRO_DAYS_THRESHOLD)"
    min: 1
    max: 90

# The daemon's headroom ceiling curve (src/lib/daemon.ts's `buildDefaultHeadroomPolicy`):
# at/under 24h-to-window-reset the ceiling is 100% (no reason to hold back headroom that
# expires unused at reset); otherwise it holds at `reservePct`, the operator reserve
# (src/lib/headroom.ts's `HEADROOM_LIMIT_PCT`, currently 95). `maxHoursToReset: null`
# means "no ceiling on hours" (the last, catch-all rung — mirrors `Infinity` in source).
headroom:
  curve:
    value:
      - { maxHoursToReset: 24, limitPct: 100 }
      - { maxHoursToReset: null, limitPct: 95 }
    origin: "lifted:src/lib/daemon.ts:145-148 (buildDefaultHeadroomPolicy)"
  reservePct:
    value: 95
    origin: "lifted:src/lib/headroom.ts:119 (HEADROOM_LIMIT_PCT)"
    min: 50
    max: 100
  # OPERATOR RULING 2026-07-25 (fb-1784894405468-a4153e, superseded default clause):
  # documented default TRUE — matches the live runtime default (`opts.headroomEnabled
  # ?? true` in src/lib/daemon.ts; the `:968` this comment used to cite drifted long ago
  # and is now unrelated code, which is why the symbol is the citation) — the governor
  # protects the subscription window by default; opting into overflow spend is the
  # deliberate act, set here or via config `headroom.enabled: false` /
  # `RMD_HEADROOM_ENABLED=0`, both of which win over this row. W1-T253 HAS wired the
  # read (src/lib/policy.ts's `booleanField("headroom.enabled", …)`); the previous
  # "once W1-T253 wires the read" was written before that landed.
  enabled:
    value: true
    origin: "lifted:src/lib/daemon.ts:968 (headroomEnabled default)"

# NET-NEW: no daemon-plist ThrottleInterval literal existed in src when this row was
# AUTHORED — that is what `net-new` records, and it is a statement about the row's
# provenance, not about the tree today. Since W1-T253, `src/lib/launchd.ts`'s
# `generateLaunchdPlist` DOES emit a ThrottleInterval key, and it emits it by READING
# THIS ROW. So the row stays `net-new` (there is still no prior literal it was lifted
# FROM), and the daemon plist is now this value's consumer rather than its source.
# Corrected 2026-08-11: the previous wording said the key does not exist, present tense,
# which stopped being true the moment its own consumer shipped. NOTE, unfixed here:
# `src/lib/policy.ts`'s module header carries the same sentence in the same present
# tense and needs the same correction — a src/ edit, out of scope for this docs pass.
# The R-1 relaunch-storm rate limit already applied to the SEPARATE serve unit
# (`DEFAULT_SERVE_THROTTLE_S`, also 60) is the precedent this value follows, but this
# row governs the daemon unit specifically and is NEVER to be presented as lifted from
# that (or any) source constant.
launchd:
  throttleIntervalS:
    value: 60
    origin: "net-new"
    min: 10
    max: 3600

# The boot-time abandoned-review-clone reap (impl-EK, 2026-08-01). Reviewing a PR
# materialises a standalone clone of this repo into a scratch root and never removes it;
# 36 survived across os.tmpdir(), /private/tmp and the SDK scratchpad root, totalling
# 5866 MiB, on a host where macOS's periodic tmp cleaner is absent so nothing ever has.
scratchReap:
  # SHIPPED OFF, deliberately: this rung DELETES, so it began survey-only — while false the
  # boot pass SURVEYS and writes `daemon.clone_reap` with what it would reclaim, removing
  # nothing, so the operator could read that line before arming it. FLIPPED ON by PR #1250
  # (2026-08-03, "after a third hand-clear tonight") and live since: the boot pass now REMOVES
  # qualifying clones. Same shipped-off posture as `autoTriage.enabled` above (itself flipped
  # on by PR #1093), which began off because it spends; this began off because it destroys.
  enabled:
    value: true
    origin: "net-new"
  # The age ceiling below which an idle clone is kept, in hours. Conservative end of the
  # range the two existing sweeps already set (both 24h). ~15x the 92.3-min longest observed
  # task wall-time, so no clone of a RUNNING review can reach it even if the liveness probe
  # were to fail open. Floor 4h matches worker-scratch.ts's teardown ceiling; a lower value
  # would risk a live review's clone.
  maxAgeHours:
    value: 24
    origin: "lifted:src/lib/worker-scratch.ts (DEFAULT_SCRATCH_SWEEP_MAX_AGE_MS = 24h)"
    min: 4
    max: 168

# W1-T406: the worktree cadence reaper's (reapStaleWorktrees) BOOT RUNG for a one-shot
# `rmd run-task` container dispatch. Neither existing call site — the daemon's per-poll
# sweep hook, or `rmd sweep` (sweepCommand, which anyway guards the reap behind
# `!dryRun`) — is reachable from `docker run ... rmd run-task <id>`, so a one-shot
# container never runs reapStaleWorktrees at all; only pruneStaleRuns' narrower run-start
# prune does, and it leaves three coverage holes (git-invisible dirs, detached-HEAD
# `sweep-*` orphans, widowed `.lock` files) that only reapStaleWorktrees closes. One state
# directory accumulated 3.0 GB across a day of one-shot dispatches on Azure (2026-08-08).
worktreeReapBoot:
  # SHIPPED OFF, same posture as `scratchReap.enabled` above and for the same reason: this
  # rung DELETES, so it begins survey-only — while false the boot pass SURVEYS and ledgers
  # `worktree.reap_boot` with what it would reclaim, removing nothing, so an operator can
  # read several boots' worth of dispositions before arming it. No `maxAgeHours` field of
  # its own: this rung introduces no new age arithmetic — it calls reapStaleWorktrees
  # exactly as the daemon/sweep call sites do, so it inherits `worktreeReapGraceMs` above
  # unchanged.
  enabled:
    value: false
    origin: "net-new"

# W1-T931 COST-ANOMALY SENTINEL (fb-1785237559155-feef92, item 4) — the two EXISTING cost guards
# are both ABSOLUTE and neither measures a RUN against its own kind: `sweep.dailyCostCeilingUsd`
# above gates the fleet's DAY (fired exactly once, ever, at $152.28), and `budget_usd`/
# DEFAULT_BUDGET_USD (run-task.ts, per-run) sits at $100 with MASTER-PLAN's own baseline recording
# "0/31 trips, tenth cycle running", peak run $26.380 (W1-T504) — a tripwire nothing has approached
# in ten cycles is not measuring runs. The entire band between an ordinary run and $100 is
# unpoliced. This sentinel closes it RELATIVELY, never absolutely: a run costing more than
# `multiplier` times its own task CLASS's median cost (src/lib/cost-anomaly.ts's
# `detectCostAnomalies`, over the same per-run `cost_usd`/`taskClass` ledger fields
# src/lib/retro.ts's `aggregateByClass` already reads) ledgers exactly one `cost.anomaly` row,
# idempotent per run id, and surfaces in `rmd status`'s NEEDS ME (src/lib/status-board.ts). It
# REPORTS ONLY (design note v) — no dispatch deferred, no worker stopped, no merge blocked.
# BOTH rows below are net-new: no source literal of either shape (a cost multiplier over a class
# median, a minimum-sample floor before a median is trusted) ever existed in src/ to lift from.
costAnomaly:
  # (iii) MEDIAN, NOT MEAN, AND THAT IS LOAD-BEARING — the mean is dragged by the very outlier
  # being detected. This row is the multiplier a run's own cost must clear over its class's
  # MEDIAN before it counts as an outlier rather than ordinary class variance.
  # MEASURED BASIS (net-new — no source literal to lift, so this leans on the two nearest
  # measured cost-variance data points this SAME file already carries): `autoTriage.maxPerDay`'s
  # own comment records one class's WORST-BUT-LEGITIMATE run at 2.04x its class median (n=27,
  # $0.27–$2.00, median $0.98) — ordinary variance this sentinel must NOT trip on (design ii:
  # "a sentinel that cries wolf ... trains the operator to skim the queue"). `dailyCostCeilingUsd`
  # immediately above records the other end: the day its governor first fired, $152.28 observed
  # against a normal day's ~$15 — roughly 10x, the INCIDENT signature. 3x sits with daylight
  # above the 2.04x ordinary-variance ceiling and well below the ~10x incident signature — close
  # enough to this task's own named fixture (the W1-T7 arc, $9.32 across strikes to a blocked
  # verdict) to have caught it against any class whose median sits under ~$3.11, without
  # inventing a number this fleet has not yet ledgered enough class-scoped runs to measure
  # directly (design ii's own diagnosis: the per-class contrast has been under-sampled for ten
  # cycles, "one `src` row, every time").
  multiplier:
    value: 3
    origin: "net-new"
    min: 2
    max: 8
  # (ii) A THIN CLASS IS SILENT, NOT ANOMALOUS — "a median over n=1 or n=2 is noise and would
  # fire on the first slightly-long run" (design, verbatim). This row is the floor a class's own
  # settled-run count must clear before its median is trusted at all; below it the sentinel
  # emits nothing and names why, never a false alarm over an under-sampled class.
  # MEASURED BASIS (net-new): min=3 is the smallest n at which a median is actually a MEDIAN
  # rather than an average-of-two or a bare single value — design note ii names n=1/n=2
  # explicitly as noise, so the bound forecloses an editor relaxing this row into the exact case
  # that note calls out. 5 asks for one run more than that floor: modest enough that a
  # routinely-dispatched class clears it within days at this fleet's own observed cadence
  # (autoTriage alone ledgers up to 24 fires/day), strict enough that a class this same file's
  # `multiplier` comment just named as under-sampled ("one `src` row, every time") stays silent
  # rather than guessing at a median it does not yet have enough runs to trust.
  minSamples:
    value: 5
    origin: "net-new"
    min: 3
    max: 15

# W1-T2568: the GitHub-event wake's bounded recent-delivery dedup window (src/lib/
# github-event-wake.ts's `createDeliveryDedupStore`, consumed by `POST /v1/hooks/github`,
# serve.ts). A GitHub redelivery of an already-accepted webhook, or a replay of a captured
# request, is refused as a duplicate only while its `X-GitHub-Delivery` id is still remembered
# here — this is THE bound design (iv) names explicitly ("the debounce is a bounded
# plan/policy.yaml row, not a literal beside fs.watch"), so raising or lowering the dedup
# window is a reviewed plan PR, never a source edit.
#
# NET-NEW: no prior source literal ever bounded this (the mechanism itself is new, W1-T2568).
# 500 is sized off GitHub's own delivery-failure contract, not a live measurement: a delivery
# that gets no 2xx within 10 seconds is never automatically redelivered by GitHub (this task's
# own rationale, citing GitHub's webhook best-practices doc), so the realistic redelivery
# volume this window must absorb is an operator's MANUAL "redeliver" click from the GitHub UI
# after an outage, not an unbounded stream — a handful of redeliveries per incident, not
# thousands. 500 sits comfortably above any plausible manual-redelivery burst while staying
# small enough that the in-memory Set this backs never becomes a real footprint concern in a
# long-lived `remudero-serve` process. min=50 keeps the window from being tuned so small a
# single burst of distinct check-run completions across one PR's build matrix could wrap
# around and reprocess its own oldest member; max=5000 keeps a generous raise bounded rather
# than unbounded, mirroring every other capacity-shaped row in this file (see costAnomaly's
# multiplier/minSamples rows immediately above for the same min/max discipline over a
# different quantity).
githubEventWake:
  dedupCapacity:
    value: 500
    origin: "net-new"
    min: 50
    max: 5000

# W1-T2579 — THE ARM GATE'S OPERATOR-RATIFIED BAND TABLE. `decideAutoMergeArm` (src/lib/
# review.ts) reads this table AFTER its existing refusals, on the already-arming full-pass/
# keyword-floor path only: a `hold` row refuses the arm naming its class
# (`calibration-band:<class>`); a `notify` row arms and carries its `note` in the decision
# reason. It can never arm a verdict the CAPPED-class refusal or an operator override already
# holds — those are evaluated first and this table is never consulted for them.
#
# SHIPS EMPTY, ON PURPOSE. `verdict-calibration.ts` (W1-T424) and `measurement_cadence`
# (W1-T1259) run on a cadence and MEASURE the per-class merge/revert rate this table would
# gate on — but neither one, nor any other cadence, rung or retro, ever WRITES a row here. A
# figure enters this table ONLY through a plan PR an operator reads and merges (Law 5: the
# machine never ratifies on its own judgment). Until that PR lands, this stays `[]`, and an
# empty table is BYTE-IDENTICAL, at every arm decision, to no table existing at all
# (test/arm-calibration-bands.test.ts) — the fail-inert contract this row exists to prove.
#
# A row here would look like:
#   armCalibrationBands:
#     - class: keyword-floor
#       verdict: notify
#       note: "the class the operator is watching, once measured"
armCalibrationBands: []
