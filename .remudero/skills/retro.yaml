# .remudero/skills/retro.yaml — the existing Architect retro (`rmd retro`),
# folded into the §5B registry unchanged ("retro -> the existing retro
# Architect (rmd retro), folded in"). Syncs plan/tasks.yaml from the ledger's
# observed outcomes (src/lib/retro.ts's gather + calibration table).
#
# grounding_sources deliberately does NOT name a `state/` path (W1-T2281):
# `state/` is gitignored (CLAUDE.md, W1-T255/W1-T256) so `state/ledger.ndjson`
# is absent from every fresh checkout by construction, and the true ledger
# UNION (live file + rotated `.ndjson.gz` archives) can only be assembled by
# `resolveLedgerUnion`/`ledgerRotationEntries` (src/lib/ledger-grep.ts,
# W1-T444) — a multi-file, gzip-aware reader, not a path a flat
# `readFileSync` list can express. `MASTER-PLAN.md#Calibration` is the
# checked-in prose home of exactly the observed-outcomes data this skill's
# own output_contract already describes reconciling against ("the gather +
# calibration table").
#
# W1-T2437 — THIS FILE IS REGISTRY METADATA, NOT THE ARCHITECT'S PROMPT. `loadSkillRegistry`
# (src/lib/skill.ts) reads only the five keys below (tools/permission_profile/output_contract/
# grounding_sources/gate/tier), for `rmd skill list` and the dashboard's skill-run buttons — it
# is never consulted by `retroCommand` (src/run-task.ts). The text the spawned Architect worker
# actually reads is `retroPrompt()` in that same file, which is where its PR body's `Acceptance:`
# block SHAPE is now spelled out (`RETRO_ACCEPTANCE_BLOCK_GRAMMAR`, exported alongside it): one
# criterion per physical line, never wrapped, and every proof opening with a recognised dialect
# (`grep:`/`demonstration:`) — see that constant's own doc for why. Recorded here so the next
# reader does not repeat the mistake of treating this YAML's prose as the fed instruction.
tools:
  - Read
  - Grep
  - Glob
  - Bash

permission_profile: architect

output_contract: >
  a plan-sync PR reconciling plan/tasks.yaml status/calibration against
  state/ledger.ndjson, gated by ci-gate+remudero-review; --dry-run prints
  the gather + calibration table only, proposing nothing.

grounding_sources:
  - MASTER-PLAN.md#Calibration
  - plan/tasks.yaml
  - LEARNINGS.md

gate: ci-gate+remudero-review
tier: architect
