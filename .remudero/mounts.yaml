# Remudero — .remudero/mounts.yaml (mount-routing policy table, v0 — static)
#
# MASTER-PLAN §9; W1-T167 added the `class` axis. A DETERMINISTIC policy table
# (no per-call LLM judgment): keyed by (task_type × risk × class) → a mount
# { model, effort, max_turns, context_budget }. v0 is a STATIC table; the
# flywheel (WS-8) later proposes downgrades/upgrades as golden-gated PRs —
# routing is knowledge, so it ships behind the golden suite like every other
# knowledge change.
#
# ── The class axis (W1-T167) ────────────────────────────────────────────────
# A flat sonnet/high mount for EVERY task regardless of shape prices a
# docs-only edit the same as a risk:high src change (the $12 W1-T115 run).
# Every routes.<type>.<risk> cell below is now a mapping of CLASS -> mount,
# where class comes from src/lib/task-class.ts's deriveTaskClass (a task's
# declared `files` globs: `docs`, `plan-lint`, or the universal `src` default)
# — so changing a routing decision is a DATA edit here, never a code change.
# Every risk cell MUST carry a `src` row (checked at load, src/lib/mounts.ts's
# parseRiskCell): it is the fallback resolveMountForClass takes — LOUDLY, the
# caller (run-task.ts) ledgers a `mount.class_fallback` line naming the
# unmatched class — for any class this table has no row for. Deliberately
# NOT every (type, risk) cell gets docs/plan-lint rows: risk:high stays
# src-only on purpose (a risk:high task classified docs/plan-lint is
# unusual enough to warrant the full mount and a loud fallback line, never a
# silent discount at a risk band that already flagged concern).
#
# Operator params (subscription, thinking_default, metering, …) are per-INSTANCE
# config gathered by `rmd init`, NEVER plan constants — they do not live here.
#
# ── The Tier Invariant (G-17, Craig directive) ────────────────────────────────
# The main agent (the Architect) ALWAYS rides a higher-thinking mount than the
# coding agents. Enforced deterministically at load (src/lib/mounts.ts) as TWO
# ANDed conditions, exactly per §9:
#     architect.tier  >  max(worker.tier)         # STRICT model-tier dominance
#     architect.effort ≥ thinking_default          # floor: high (plan authorship)
# A mounts.yaml that violates it is REJECTED at load. The flywheel may lower
# workers freely but can NEVER lower the Architect to or below the worker ceiling.
#
# The invariant is RELATIVE, not absolute: because the Architect rides `opus`
# (the top tier), every WORKER mount below is CAPPED at `sonnet` — a worker may
# never reach the Architect's tier. So "diagnose steps up" and "high-risk review"
# step up to the worker CEILING (sonnet, high effort), not to opus. An economy
# install could instead run haiku workers under a sonnet Architect and still
# comply — the ordering is what matters, not the absolute lineup.

# ── Model-tier ordering — CONFIG-MAINTAINED (the lineup shifts, §9) ────────────
# Higher rank = higher-thinking mount. The Tier Invariant compares models by this
# rank, so adding/renaming a model is a config edit HERE, not a code change.
tiers:
  haiku: 1
  sonnet: 2
  opus: 3
  claude-opus-5: 4

# Effort ordering — same idea for the thinking-effort axis.
efforts:
  low: 1
  medium: 2
  high: 3

# ── The capability axis (W1-T2573) — provider-neutral, DATA not a substring match ──────────────
# `tiers` above ranks CLAUDE model names — the vocabulary every mount in this file is written
# in. `capabilities` is the axis a SECOND vendor's adapter resolves a requested Claude model +
# effort INTO, so a cross-provider worker (today: Codex, via codexTierForRequestedModel in
# src/lib/worker-provider.ts) performs a TABLE LOOKUP here rather than a substring match on the
# Claude model name — renaming a Claude model, or adding a Codex model, is a data edit to this
# block, never a code change. Three parts:
#   `ladder`  — capability name -> rank, provider-agnostic, same shape as `tiers` above.
#   `claude`  — Claude model name -> capability. Every `tiers` key MUST appear here (checked at
#               load, src/lib/mounts.ts's parseCapabilities) — including a Claude model whose
#               name carries neither "haiku" nor "opus", which the OLD substring function could
#               only route by accident (it silently fell through to "balanced"); here it resolves
#               by its DECLARED capability instead.
#   `claude_candidates` — capability -> ordered concrete Claude model ids. Aliases start at the
#               best entry; an explicit concrete pin starts at its own position and therefore can
#               remain in place or move downward during an incident, never silently upgrade.
#   `codex`   — capability -> effort -> ordered (most-preferred-first) Codex candidate models.
#               Keyed on (capability, effort) so effort genuinely crosses the provider boundary:
#               a `sonnet/high` mount and a `sonnet/medium` mount both resolve capability
#               "balanced", but prefer DIFFERENT rows below — they are not the same request.
# The Tier Invariant (below) is enforced on capability rank too once this block is declared
# (src/lib/mounts.ts's enforceTierInvariant) — purely additive to the tiers-based check, so it
# stays enforceable even for a worker mount that names a model from a second vendor.
capabilities:
  ladder:
    economy: 1
    balanced: 2
    frontier: 3
  claude:
    haiku: economy
    sonnet: balanced
    opus: frontier
    claude-opus-5: frontier
    claude-opus-4-8: frontier
    claude-opus-4-7: frontier
    claude-opus-4-6: frontier
    claude-opus-4-5-20251101: frontier
    claude-sonnet-5: balanced
    claude-sonnet-4-6: balanced
    claude-sonnet-4-5-20250929: balanced
    claude-haiku-4-5-20251001: economy
  claude_candidates:
    economy:  [claude-haiku-4-5-20251001]
    balanced: [claude-sonnet-5, claude-sonnet-4-6, claude-sonnet-4-5-20250929]
    frontier: [claude-opus-5, claude-opus-4-8, claude-opus-4-7, claude-opus-4-6, claude-opus-4-5-20251101]
  # gpt-5.5 IS BEING DECOMMISSIONED (operator notice, 2026-09-14), so it is demoted to a TRAILING
  # fallback in every row it appears in rather than deleted: while it still answers it remains a
  # last resort, and once it stops being offered the eligibility filter drops it with no further
  # edit here. Two rows moved. `balanced.high` had it FIRST, so terra now leads both balanced rows.
  # `frontier.low` listed it ALONE — a single-point dependency whose failure mode is not a crash:
  # `readCodexCapacity` returns `readable:false` when no candidate is eligible, and
  # `selectWorkerProviderForPolicy` then treats Codex as unreadable and falls back to CLAUDE, so a
  # decommissioned 5.5 would have SILENTLY MIGRATED that lane onto the subscription this fleet is
  # trying to spend less of. `frontier.low` therefore gains `gpt-5.6-sol`, the same frontier model
  # the medium/high rows already lead with — a same-capability primary, never a downgrade to terra.
  # MEASURED on the live daemon 2026-09-14: gpt-5.5 was 309 of 364 observed model selections, so
  # this is the single highest-traffic entry in the table, not a marginal one.
  # MEASURED 2026-09-16 against this account's own `model/list` via the daemon container's
  # app-server. THE ACCOUNT CAN RUN EXACTLY FOUR MODELS: gpt-5.6-sol, gpt-5.6-terra,
  # gpt-5.6-luna, gpt-5.5. Three ids below were NOT in that list, and one of them is not merely
  # absent -- `codex exec --model gpt-5.3-codex-spark` returns HTTP 400 "not supported when using
  # Codex with a ChatGPT account". Spark's `rateLimitsByLimitId` bucket (0% short / 50% weekly)
  # is therefore PHANTOM HEADROOM: the account is shown an allowance it cannot spend.
  #
  # `balanced.low: [gpt-5.4]` was the single-point dependency this block's own comment warns
  # about, already realised: one candidate, not account-visible, so no candidate is eligible ->
  # readCodexCapacity returns readable:false -> selectWorkerProviderForPolicy falls back to
  # CLAUDE. That lane has been silently migrating onto the subscription this fleet is trying to
  # spend less of. It now mirrors balanced.medium/high exactly -- a same-capability primary
  # (terra), never a cross-band promotion (W1-T2842 forbids promoting beyond a band without
  # measured task outcomes).
  #
  # EVERY ECONOMY ROW IS LEFT EXACTLY AS W1-T2842 RULED. Spark leading economy/low and /high is
  # harmless precisely because the eligibility filter drops a model that is not account-visible
  # with no edit here, so those rows already resolve to Luna today and will resolve to Spark again,
  # with no further change, on the day the account is offered it. Reordering them would reverse a
  # merged ruling to buy nothing. ONLY `balanced.low` changes here, because only it was BROKEN:
  # a single non-visible candidate leaves the row with no eligible model at all.
  codex:
    economy:
      low:    [gpt-5.3-codex-spark, gpt-5.6-luna, gpt-5.4-mini]
      medium: [gpt-5.6-luna, gpt-5.3-codex-spark, gpt-5.4-mini]
      high:   [gpt-5.3-codex-spark, gpt-5.6-luna, gpt-5.4-mini]
    balanced:
      low:    [gpt-5.6-terra, gpt-5.4, gpt-5.5]
      medium: [gpt-5.6-terra, gpt-5.4, gpt-5.5]
      high:   [gpt-5.6-terra, gpt-5.4, gpt-5.5]
    frontier:
      low:    [gpt-5.6-sol, gpt-5.5]
      medium: [gpt-5.6-sol, gpt-5.5]
      high:   [gpt-5.6-sol, gpt-5.5]
  # W1-T3546: a pay-per-token deployment is selected by explicit mount affinity, never capacity.
  # The data shape mirrors `codex`: capability -> effort -> ordered deployment identifiers.
  # W1-T3598: gpt-5-nano LEADS economy and balanced — cheaper than gpt-oss-120b on both token axes
  # ($0.05/$0.40 vs $0.15/$0.60) and Azure-OpenAI-family, so it needs no second endpoint shape.
  # gpt-oss-120b TRAILS rather than being removed, the same demotion shape the `codex` block above
  # uses: a deployment that stops answering falls back instead of failing the lane. FRONTIER is left
  # on gpt-oss-120b — a nano-class model is not a frontier substitute.
  # W1-T3607: CANONICAL KEY IS `cash`, NOT `openweight`. THE CATEGORY IS HOW A DEPLOYMENT IS PAID
  # FOR, NEVER WHAT LICENCE IT SHIPS UNDER: this is the non-subscription, pay-per-token ladder,
  # billed per request against `dailyCapUsd`, outside the Claude/Codex subscriptions. A deployment
  # is admissible here by that billing property alone — gpt-5-nano (led below) is PROPRIETARY, not
  # open-weight, and belongs on this ladder anyway because it is cash-billed the same as every other
  # row. `src/lib/mounts.ts`'s `parseCapabilities` still accepts the deprecated `openweight:` key as
  # an alias for an already-deployed host's table; remove that alias once none remain.
  cash:
    # W1-T3614 — THE TWO ROWS LEAD WITH DIFFERENT DEPLOYMENTS, AND THAT IS THE POINT. Neither model
    # wins outright; the winner is decided by the INPUT:OUTPUT ratio of the lane, measured against
    # the live account with the adapter's own URL, api-version and body on 2026-09-15:
    #
    #     lane                input    gpt-oss out   nano out   cheaper
    #     inbox_draft       259,181        452         2,207     nano,    2.83x
    #     escalation judge      446        177           993     gpt-oss, 2.40x
    #
    # gpt-5-nano is cheaper PER TOKEN on both axes ($0.05/$0.40 vs $0.15/$0.60) and DEARER PER TASK
    # on short prompts, because it spends ~5x the completion tokens on reasoning. Solving for the
    # crossover with r = nano_out/oss_out gives `input > (4r - 6) x output`, i.e. roughly
    # INPUT > 15x OUTPUT. Do not "correct" economy back to the per-token-cheaper row: that reads
    # the price table and ignores the token counts, which is how this was wrong the first time.
    #
    # AND A HARD CEILING ABOVE THE COST ARGUMENT (W1-T3613): gpt-oss-120b's context window is
    # 131,072 tokens, and inbox_draft really sends 259,181 (it embeds the whole plan/tasks.yaml).
    # So `balanced` leading with nano is not a preference, it is the only thing that can run; the
    # trailing gpt-oss there is unreachable for that lane and is kept only for a smaller caller.
    economy:
      low:    [gpt-oss-120b, gpt-5-nano]
      medium: [gpt-oss-120b, gpt-5-nano]
      high:   [gpt-oss-120b, gpt-5-nano]
    # this change LEAVES ECONOMY AND BALANCED ALONE, DELIBERATELY. Luna is cheaper than gpt-5-mini,
    # but nano is cheaper than LUNA per token ($0.05/$0.40 vs $0.20/$1.20). W1-T3614 fixed these
    # two leads from MEASURED PER-TASK cost on real lane shapes, not per-token price, and luna has
    # no such measurement yet -- so reversing them here would trade a measured ordering for a
    # cheaper-looking table. Luna enters only where it replaces gpt-5-mini outright: frontier.
    balanced:
      low:    [gpt-5-nano, gpt-oss-120b]
      medium: [gpt-5-nano, gpt-oss-120b]
      high:   [gpt-5-nano, gpt-oss-120b]
    # LUNA TAKES gpt-5-mini's PLACE; TERRA IS THE ESCALATION BEHIND IT. Luna is cheaper
    # than mini on both axes ($0.20/$1.20 vs $0.25/$2.00) and spent 0 reasoning tokens on an
    # identical trivial prompt where mini spent 64 of 76, so mini was REMOVED rather than demoted.
    # Terra TRAILS rather than leads: at 10x luna on both axes ($2.00/$12.00) it is reached only
    # when luna is unavailable or below reserve -- "only when absolutely necessary", per operator
    # direction. Sol ($5.00/$30.00) is deliberately absent: 2.5x terra for the same band.
    frontier:
      low:    [gpt-5.6-luna, gpt-5.6-terra]
      medium: [gpt-5.6-luna, gpt-5.6-terra]
      high:   [gpt-5.6-luna, gpt-5.6-terra]

# ── The Architect mount (the bookend: plan authorship, orchestration) ──────────
# claude-opus-5/high — the sole top-tier mount; strictly above every worker below. Governs ONLY
# plan authorship (`rmd plan`'s orchestration + the retro Architect's own worktree-DAG framing)
# via architectModel(config, mounts) — a mount-table edit here, not a code change.
#
# W1-T2559: this row used to ALSO govern retro, triage, and the inbox-draft rung ("the
# Architect-tier roles"), which meant three jobs that ship no code and supervise no worker
# inherited plan authorship's tier for no reason other than sharing one resolver. They now each
# ride their OWN row under `synthesis:` below (`synthesisModel`/`synthesisEffort`,
# src/lib/config.ts) — an edit HERE no longer reaches them, and an edit to a `synthesis.*` row
# below no longer reaches plan authorship either. Nothing below weakens the Tier Invariant itself
# (G-17): plan authorship still strictly outranks every worker, unconditionally.
#
# THE ONE LANE `assertArchitectAboveWorker` STILL GUARDS HERE, AND THE OTHER EXCLUSION IS
# DELIBERATE. The manual `rmd plan` command (`planCommand`, src/run-task.ts) calls the
# ONE-ARGUMENT `architectModel(config)`, so its spawn model resolves through
# `config.architectModel ?? "opus"` (src/lib/config.ts) and NEVER READS THIS ROW — an edit here
# does not reach it. That is scoped out on purpose rather than missed: #781, the commit that
# wired the (former) other three, says so in terms — "judge and the manual `rmd plan` command are
# out of the ruling's scope and unchanged" (MPG first-instance ruling fb-1784921980488-44b355 §4).
# And the row is NOT inert for that lane: the plan spawn still reads `max_turns` from here
# (`mountsTable.architect.maxTurns`). Only the MODEL is config-governed there.
#
# MPG first-instance ruling (fb-1784921980488-44b355 §4): opus -> Opus 5, launch-day SOTA on
# knowledge-work evals at unchanged cost.
architect:
  model: claude-opus-5
  effort: high
  max_turns: 400
  context_budget: 180000

# ── The synthesis rungs (W1-T2559) — OWN mounts, not the Architect's ────────────
# retro, triage, and the inbox-draft rung each ship no code and supervise no worker — the Tier
# Invariant's premise (a supervisor must strictly outrank what it supervises) does not bind them,
# so bundling them onto the `architect:` row above (which DOES carry that premise, for plan
# authorship) forced three unrelated jobs onto its tier "for free," never by any ruling that a
# triage classification needs the top model. Each row below is resolved via
# `synthesisModel`/`synthesisEffort` (src/lib/config.ts), never `architectModel`. Every one of the
# three is REQUIRED — a missing role or a malformed mount REFUSES at load
# (src/lib/mounts.ts's `validateMounts`), the same fail-loud shape `architect`/`judge` already
# get; there is no fallback to the Architect mount.
#
# ── W1-T3094 program, MEASURED 2026-09-08 over the ledger union at /mnt/rmd/state2/state ──────
# THE MODEL IS THE THIRD LEVER AND THIS ROW HAD NEVER PULLED IT. W1-T2559 (below) stepped
# `triage` down on the EFFORT axis and left every synthesis row on `claude-opus-5`, the top of
# the `tiers` ladder. Re-measured a week later over 4,131,278 run-tagged rows -> 915 distinct
# runs: `inbox.draft_synthesized` is 1,436 runs and $4,486 of notional spend, 45% OF ALL METERED
# SPEND and the largest single lane in the fleet -- larger than `implement.done` ($3,429 across
# 668 runs), which is the lane that actually ships code.
#
# WHAT THE DRAFT RUNG PRODUCES DOES NOT NEED THE TOP MOUNT, AND THE EVIDENCE IS THE READINESS
# GATE'S OWN VERDICTS. A draft is a `plan/tasks.yaml` fragment + a MASTER-PLAN stamp line, judged
# afterwards by a DETERMINISTIC linter (`classifyProposal`, src/lib/inbox.ts) behind a bounded
# relint retry (`MAX_RELINT_ATTEMPTS`). Across 468 retained `inbox.classified` rows, all 299
# `not_ready` verdicts failed on exactly ONE predicate -- `drafted` ("no drafted candidate
# available yet"). ZERO failed `lint_clean`, `deps_merged`, `evidence_anchors` or `no_conflict`.
# So the gate has never once rejected a draft for its CONTENT: the top mount is buying a margin
# nothing downstream has ever had to spend. `triage` is the same argument at 176 runs -- the row
# below already calls it "CLASSIFICATION at HIGH VOLUME", and classification is the canonical
# workload a frontier model does not repay.
#
# `retro` STAYS ON claude-opus-5/high, DELIBERATELY. 89 runs, $740: low volume, and its output is
# acted on directly (a plan/LEARNINGS edit) rather than passing a linter first. The 2026-09-01
# reasoning below is unchanged for that row; only the two rows whose output IS machine-checked
# move. Both stay at the `sonnet` worker ceiling, so nothing here approaches the Architect.
#
# THIS IS A TIER CHANGE ON A MEASURED LANE, NOT A FLYWHEEL RECOMMENDATION. `recommendMounts` has
# filed ZERO recommendations across 959 `mount_recommendation.swept` rows (33/33 refusals every
# sweep: 24 `insufficient-sample`, 6 `unmatched-arms`, 1 `tier-invariant`, 2 `quality-regression`)
# because the routing policy concentrates ~95% of traffic into one arm and no alternative arm can
# reach `DEFAULT_MIN_SAMPLE_N`. W1-T3095 builds the bounded exploration that fixes that; until it
# lands, a measured operator edit here is the only lever, and this comment is its evidence.
#
# MEASURED 2026-09-01 (this task's own rationale): $827 across 219 invocations, 22% of the
# pipeline, none of it shipping code. `triage` is CLASSIFICATION at HIGH VOLUME (159 of those 219
# runs) — precisely the workload profile this file's own `max_turns` section already names as not
# repaying high effort — so its effort steps down to `low` here, the first row in this table ever
# to use it. `retro`/`inbox_draft` keep claude-opus-5/high: lower-volume (24 / 36 runs) synthesis
# whose OUTPUT is acted on directly (a plan/LEARNINGS edit, a filed proposal a later worker
# spends real budget implementing), so this change does not move their tier or effort absent a
# measured reason to — model is the THIRD lever, not the first, and effort is now genuinely WIRED
# to the spawn for all three (previously declared here but never passed to `spawnWorker`, so
# `architect.effort: high` silently governed nothing for these lanes).
# W1-T3569: `inbox_draft` alone gains `provider: openweight`. Its tool surface (Read/Grep/Glob,
# INBOX_DRAFT_WORKER_TOOLS, src/run-task.ts) is a strict subset of OPENWEIGHT_FUNCTIONS
# (src/lib/worker-provider.ts) — re-verified at this row's own commit — so this is the narrowest
# eligible lane to test accepted-output-per-dollar before the triage WebSearch bridge, which
# `openWeightTools` refuses outright (WebSearch is absent from the adapter). `triage`/`retro`
# stay OFF this lane on purpose: triage's declared WebSearch is not adapter-eligible, and retro's
# output is acted on directly rather than machine-linted. Model/effort/max_turns/context_budget
# are UNCHANGED from the prior row — only the provider affinity is new. The routed trial cannot
# begin until an operator applies the four-value TRIAL OPERATOR HANDOFF above this file's `note:`
# (plan/tasks.d/W1-T3569-...yaml): enable the provider, set the Azure endpoint, set
# `dailyCapUsd: 5`, and place the daemon-only key — none of which this row performs by itself, and
# W1-T3575's runtime cap (src/lib/worker-provider.ts) refuses any paid request before transport
# until `dailyCapUsd` is configured.
synthesis:
  retro:       { model: claude-opus-5, effort: high, max_turns: 400, context_budget: 180000 }
  triage:      { model: sonnet,        effort: low,  max_turns: 400, context_budget: 180000 }
  inbox_draft: { model: sonnet,        effort: high, max_turns: 400, context_budget: 180000, provider: cash }

# ── The flight-judge mount (Layer 2, W1-T21 — MASTER-PLAN §4B) ─────────────────
# The advisory process-judge a Layer-1 trip (flight-signals.ts, W1-T20) spawns
# with FRESH context. It must ride a HIGHER tier than the worker it supervises
# (G-17 Tier Invariant) — enforced at LOAD in src/lib/mounts.ts, the SAME
# enforcement shape as the Architect's own invariant above. Since every worker
# route below is capped at the sonnet ceiling, opus is the only tier that
# clears it, so the judge rides the Architect's own tier (there is no
# requirement it be strictly BELOW the Architect — only strictly ABOVE workers).
judge:
  model: opus
  effort: high
  max_turns: 400
  context_budget: 150000

# ── The escalation judge (W1-T3614) ───────────────────────────────────────────
# THE HIGHEST-VOLUME ZERO-TOOL LANE IN THE FLEET, AND IT HAD NO ROW OF ITS OWN. Measured over the
# ledger union: `escalation.judged` is 29,834 rows across 72 tasks in 6.9 days and RISING (6,026 on
# 2026-09-14) -- roughly 50x the ~120/day of `inbox.draft_synthesized`, the lane W1-T3094 calls the
# largest in the fleet. Its dedup is not the cause: `lookupDuplicateEscalation` runs BEFORE
# `judgeEscalation`, so these are genuinely distinct escalations.
#
# ELIGIBLE BY CONSTRUCTION, NOT BY ARGUMENT. `ESCALATION_JUDGE_TOOLS` is `[]` -- the empty list is
# trivially a subset of `OPENWEIGHT_FUNCTIONS`, and src/lib/escalate.ts says why that is safe:
# "everything it needs is baked into the prompt, so it has no ability to explore the worktree or
# take any action".
#
# haiku/low RESOLVES TO `economy`, which leads with gpt-oss-120b -- the deployment MEASURED cheaper
# for this lane's short prompts (446 in / 177 out). The model and effort are unchanged from what
# `resolveRiskJudgeMount` was already returning; only the provider is new.
#
# SAFE TO ROUTE BECAUSE FAILING OPEN IS ALREADY THE CONTRACT: `judgeEscalation` returns `deliver`
# on ANY spawn error, so a bad deployment shows the operator MORE, never less. This row is
# deliberately NOT the `judge:` mount above -- that one is bound by the Tier Invariant (G-17),
# which compares tier and capability rank against every worker it supervises, and openweight sits
# outside the `tiers` table those checks read.
escalation_judge:
  model: haiku
  effort: low
  max_turns: 400
  context_budget: 60000
  provider: cash

# ── The verify-human judge ─────────────────────────────────────────────────────
# ROUTED FOR CONTAINMENT, NOT FOR VOLUME -- and the distinction is the whole reason. Measured over
# the ledger union 2026-09-15: `verify_human.judged` is 42,448 rows but its most recent is
# 2026-09-09, and ALL of them fall inside ONE 30-MINUTE WINDOW with 20,776 marked `judge_failed`.
# It is dormant today. Routing a dormant lane saves nothing, so the argument is the other one:
#
#   ON THE SUBSCRIPTION A RUNAWAY IS UNBOUNDED. 42,448 spawns in half an hour is a proven shape for
#   this lane, and nothing in the Claude path stops it. On openweight the SAME runaway meets
#   `dailyCapUsd` and is REFUSED before transport (reserveOpenWeightBudget) -- at ~$0.0002 a
#   judgement it would exhaust the $10 day and then stop, instead of eating a 5-hour window.
#
# Same tool-less contract as the escalation row above (VERIFY_HUMAN_JUDGE_TOOLS is []), and the
# same FAIL-OPEN default: src/lib/verify-human-judge.ts resolves a spawn error, a timeout or an
# unparseable verdict to the permissive verdict, so a bad deployment cannot hide work.
#
# `risk_judge` and `ruling_judge` are DELIBERATELY NOT here despite being equally tool-less: both
# fail CLOSED (risk-judge.ts escalates to `high`; ruling-judge.ts has FAIL_CLOSED_RULING_VERDICT),
# so a flaky deployment would convert into escalations and refused rulings rather than into
# permissive defaults. They move only behind a measured reliability record for the rows above.
verify_human_judge:
  model: haiku
  effort: low
  max_turns: 400
  context_budget: 60000
  provider: openweight

# ── max_turns is a RUNAWAY CLIFF, not a work limit (§9 tripwire re-base) ────────
# The implement/reviewer/fix/diagnose worker lanes stay at a FLAT 400 — a tripwire
# set WAY above any real run, whose only job is to kill a genuinely runaway loop.
# It is NOT a sizing knob: task SIZING is enforced PRE-DISPATCH by the W1-T20c task
# linter (an over-scoped task is decomposed before it ever spawns, never trimmed by
# a low turn cap). The same bug as maxTurns=60 (PR #8, budget_usd re-base): a cap
# set NEAR expected work is a work limit masquerading as a safety limit.
# Concretely, run W1-T54b-1784149952116 (implement×medium) walled at 81/80 turns
# mid-LIVE-campaign — AFTER its minor proof had already merged #80 through the
# required gate — because live campaigns burn turns on POLLING the gate, work a cap
# must never kill.
#
# IMPLEMENT IS ALREADY A CLIFF. MEASURED 2026-09-08 over 668 retained
# `implement.done` rows: p50 72, p90 135, p95 156, p99 228, max 380. ZERO runs
# reached 390 or 400. The 400 cap is 5.6x median and 1.75x p99, so it stays put.
#
# RECON WAS THE EXCEPTION. MEASURED 2026-09-08 over 680 retained `recon.done`
# rows: p50 6, p90 10, p95 13, p99 21, max 26. The old 20 cap sat BELOW p99, ten
# runs reached or exceeded it, and the only fleet-ledgered `error_max_turns` wall
# was a recon run at 21 turns that exhausted its bounded retry and left implement
# with NO recon context. Recon therefore uses 40: 1.90x p99, 14 turns above the
# observed max, and still only one tenth of the implement cliff.
# P7-consistent: nothing here is raised to mask over-scoping; the sizer is the linter.

# ── Worker routing table: task_type → risk band → class → mount ────────────────
# Sonnet default for execution; Haiku for mechanical/high-volume; sonnet-high is
# the worker ceiling (bookend work steps up to it, never to opus). Every cell's
# `src` row is the UNCHANGED pre-W1-T167 default (the same numbers, same
# behavior for any task classified `src`); `docs`/`plan-lint` rows are NEW,
# cheaper mounts added only at low/medium risk for `recon`/`implement` — the
# two types that actually touch a task's declared `files` (W1-T167).
routes:
  recon:
    low:
      src:       { model: sonnet, effort: medium, max_turns: 40,   context_budget: 60000 }
      docs:      { model: sonnet, effort: medium, max_turns: 40,   context_budget: 40000 }
      plan-lint: { model: sonnet, effort: medium, max_turns: 40,   context_budget: 40000 }
    medium:
      src:       { model: sonnet, effort: medium, max_turns: 40,   context_budget: 90000 }
      docs:      { model: sonnet, effort: medium, max_turns: 40,   context_budget: 60000 }
      plan-lint: { model: sonnet, effort: medium, max_turns: 40,   context_budget: 60000 }
    high:
      src:       { model: sonnet, effort: high,   max_turns: 40,   context_budget: 120000 }
  implement:
    low:
      src:       { model: sonnet, effort: medium, max_turns: 400, context_budget: 120000 }
      docs:      { model: haiku,  effort: low,    max_turns: 400, context_budget: 60000 }
      plan-lint: { model: haiku,  effort: low,    max_turns: 400, context_budget: 60000 }
    medium:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 160000 }
      docs:      { model: haiku,  effort: medium, max_turns: 400, context_budget: 90000 }
      plan-lint: { model: haiku,  effort: medium, max_turns: 400, context_budget: 90000 }
    high:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 200000 }
  diagnose:
    low:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 120000 }
    medium:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 150000 }
    high:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 180000 }
  review:
    low:
      src:       { model: haiku,  effort: medium, max_turns: 400, context_budget: 60000 }
    medium:
      src:       { model: sonnet, effort: medium, max_turns: 400, context_budget: 90000 }
    high:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 120000 }
  # `reviewer` — the FRESH advisory reviewer runReview() spawns for the review gate on
  # ANY task's PR (run-task.ts), keyed by the UNDER-REVIEW task's risk. Distinct from
  # `review` above (a plan task whose own type happens to be "review"). W1-T63 (P10):
  # this row previously did not exist, so the reviewer spawn read a hardcoded
  # `maxTurns: 12` with NO model/effort — a ~12-turn cap reviewing a 400-turn-budgeted
  # implementation walled `error_max_turns` on every substantive code PR (3 ledgered
  # instances), silently degrading remudero-review to its mechanical floor (P10-a).
  # `implement`'s mount is the FLOOR reference; the reviewer rides effort=high at every
  # risk band (a HIGHER bar than implement's low/medium — G-17: it verifies acceptance,
  # never rescuing an unpasted proof, so it must not be under-mounted relative to the
  # work it judges) while staying at the sonnet worker CEILING, never opus (G-17).
  reviewer:
    low:
      src:       { model: sonnet, effort: high, max_turns: 400, context_budget: 120000 }
    medium:
      src:       { model: sonnet, effort: high, max_turns: 400, context_budget: 160000 }
    high:
      src:       { model: sonnet, effort: high, max_turns: 400, context_budget: 200000 }
  # `fix` — a patch/retry attempt after a strike (classify.ts's runDiagnoseThenRetry,
  # W1-T7; not yet wired to a live spawn, but mount-governed from day one so wiring it
  # never reintroduces an undeclared literal). Mirrors `implement`: a fix attempt is the
  # same class of work as the original implementation, riding the same mount per risk.
  fix:
    low:
      src:       { model: sonnet, effort: medium, max_turns: 400, context_budget: 120000 }
    medium:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 160000 }
    high:
      src:       { model: sonnet, effort: high,   max_turns: 400, context_budget: 200000 }
  manual:
    low:
      src:       { model: haiku,  effort: low,    max_turns: 400, context_budget: 40000 }
    medium:
      src:       { model: haiku,  effort: medium, max_turns: 400, context_budget: 60000 }
    high:
      src:       { model: sonnet, effort: medium, max_turns: 400, context_budget: 90000 }
