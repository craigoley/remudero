      proof: 'grep: test("W1-T9913: a finding whose cited line does not hold what its claim names is discarded and never filed" in test/a-scout-proposes-from-a-rotating-slice-of-the-repo.test.ts'
    - claim: "a finding that duplicates an open or recently merged task is discarded"
      proof: 'grep: test("W1-T9913: a finding that duplicates an open or recently merged task is discarded" in test/a-scout-proposes-from-a-rotating-slice-of-the-repo.test.ts'
    - claim: "a surviving finding is filed through the machine-filing renderer under the slice origin"
      proof: 'grep: test("W1-T9913: a surviving finding is filed through the machine filing renderer under the slice origin" in test/a-scout-proposes-from-a-rotating-slice-of-the-repo.test.ts'
    - claim: "a reverted change debits the class and filing respects the shared queue bound"
      proof: 'grep: test("W1-T9913: a reverted change debits the class and filing respects the shared queue bound" in test/a-scout-proposes-from-a-rotating-slice-of-the-repo.test.ts'
  falsifier: |
    File a finding whose cited line no longer holds the claimed text, file one that duplicates a queued task,
    or credit a change that was reverted inside the window. The affected proof must fail. CLOSE THIS TASK
    without implementation if the sibling ledger-scout task has not merged: this class reuses its admission
    bound and survival metric and must not carry a copy.

  notes: |
    Depends on W1-T9912 for the shared admission bound. If that task is retired, retire this one with it.
